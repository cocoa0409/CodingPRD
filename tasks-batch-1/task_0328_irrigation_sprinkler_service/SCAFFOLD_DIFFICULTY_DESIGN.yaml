# =============================================================================
# task_0328_irrigation_sprinkler_service — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 rules × ≥2 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls chain is empty-DB reachable.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_estimated_vs_final_total_diverge
        grounds:
          - calculations.quote_total
          - entities.ServiceQuote.fields.estimated_total_cents
          - entities.ServiceQuote.fields.final_total_cents
          - state_machines.WorkOrder.completion_status=IN_PROGRESS_to_completion_status=COMPLETED
        distinguishing_aspect: |
          On ServiceQuote cost-accounting domain: estimated_total_cents (forward-looking, catalog
          rates, single round) = 2416 differs from final_total_cents (chronological actuals,
          per-line rounding) = 2410 for the same job.
        test_recipe:
          setup:
            - "A Customer owns a Property with one OPERATIONAL IrrigationSystem."
            - "A REPAIR quote with line_items [{q:1,unit:1431},{q:1,unit:806}] is SENT (estimated_total_cents=2416)."
            - "Customer approves it; the spawned WorkOrder is driven to COMPLETED with actual_labor_cents=1431, actual_parts_cents=801."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Acme Lawns", contact_email: "a@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "1 Vine St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "RainBird", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tina Tech", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-quotes"
              payload: { property_id: "${prop_id}", quote_type: "REPAIR", line_items: [ { description: "valve", quantity: 1, unit_rate_cents: 1431 }, { description: "fitting", quantity: 1, unit_rate_cents: 806 } ] }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /service-quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /service-quotes/${quote_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_id: $.data.linked_work_order_id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-04-01" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${wo_id}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_cents: 1431, actual_parts_cents: 801 }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "ServiceQuote.${quote_id}.estimated_total_cents == 2416"
            - "ServiceQuote.${quote_id}.final_total_cents == 2410"
            - "ServiceQuote.${quote_id}.estimated_total_cents != ServiceQuote.${quote_id}.final_total_cents"

      - name: system_winter_risk_provisional_vs_assessed_diverge
        grounds:
          - calculations.winter_risk_score
          - entities.IrrigationSystem.fields.provisional_winter_risk
          - entities.IrrigationSystem.fields.assessed_winter_risk
          - state_machines.WorkOrder.completion_status=IN_PROGRESS_to_completion_status=COMPLETED
        distinguishing_aspect: |
          On IrrigationSystem risk-scoring domain (different entity domain from quote_total):
          provisional_winter_risk = 116 stays > assessed_winter_risk = 0 once a WINTERIZATION
          WorkOrder on the system reaches COMPLETED, for an identical zone inventory.
        test_recipe:
          setup:
            - "A system with static_psi=90 (>=HIGH_PSI) and two non-ARCHIVED zones: TURF head_count=10, ROTOR head_count=6 → zone_exposure=58, psi_factor=2 → provisional=116."
            - "A WINTERIZATION WorkOrder on the system is driven to COMPLETED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Hill Co", contact_email: "h@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "9 Hill Rd", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 90 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 1, plant_type: "TURF", head_count: 10, gpm_per_head: 18 }
              as: Dispatcher
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 2, plant_type: "ROTOR", head_count: 6, gpm_per_head: 22 }
              as: Dispatcher
            - call: "POST /technicians"
              payload: { full_name: "Will Winter", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "WINTERIZATION", estimated_minutes: 45, estimated_cost_cents: 9000 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-10-15" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${wo_id}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_cents: 5000, actual_parts_cents: 1000 }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "IrrigationSystem.${sys_id}.provisional_winter_risk == 116"
            - "IrrigationSystem.${sys_id}.assessed_winter_risk == 0"
            - "IrrigationSystem.${sys_id}.season_state == WINTERIZED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: blowout_price_tiered_with_psi_surcharge
        grounds:
          - calculations.blowout_price
          - entities.IrrigationSystem.fields.static_psi
          - endpoints.GET /irrigation-systems/{id}/blowout-quote
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered per_zone rate selected by
          zone_count, plus a max(0,min(cap, ...)) PSI surcharge. n=6 zones, psi=90 →
          4500 + 1000*6 + min(3000,(90-80)*50)=500 → 11000.
        test_recipe:
          setup:
            - "A system static_psi=90 with 6 non-ARCHIVED zones (zone_count=6 → TIER2 rate 1000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Tier Co", contact_email: "t@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "6 Tier Ln", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "RainBird", static_psi: 90 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 1, plant_type: "TURF", head_count: 4, gpm_per_head: 18 }
              as: Dispatcher
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 2, plant_type: "TURF", head_count: 4, gpm_per_head: 18 }
              as: Dispatcher
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 3, plant_type: "SHRUB", head_count: 4, gpm_per_head: 12 }
              as: Dispatcher
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 4, plant_type: "SHRUB", head_count: 4, gpm_per_head: 12 }
              as: Dispatcher
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 5, plant_type: "DRIP", head_count: 4, gpm_per_head: 5 }
              as: Dispatcher
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 6, plant_type: "ROTOR", head_count: 4, gpm_per_head: 22 }
              as: Dispatcher
          trigger:
            - call: "GET /irrigation-systems/${sys_id}/blowout-quote"
              payload: {}
              as: Dispatcher
              captures: { price: $.data.blowout_price_cents, zc: $.data.zone_count }
          assert:
            - "blowout-quote.zone_count == 6"
            - "blowout-quote.blowout_price_cents == 11000"

      - name: quote_final_round_per_line_then_sum
        grounds:
          - calculations.quote_total
          - entities.WorkOrder.fields.actual_labor_cents
          - entities.WorkOrder.fields.actual_parts_cents
          - state_machines.WorkOrder.completion_status=IN_PROGRESS_to_completion_status=COMPLETED
        distinguishing_aspect: |
          Mode (b): nested-rounding order is pinned. final_total_cents taxes-and-rounds each of
          labor (1431→1545) and parts (801→865) THEN sums = 2410; sum-then-round would give 2411.
          The scaffold pins round-per-line-then-sum, so the observable result is 2410.
        test_recipe:
          setup:
            - "Same chain as quote_estimated_vs_final_total_diverge through COMPLETE with actual_labor_cents=1431, actual_parts_cents=801."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Round Co", contact_email: "r@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "2 Round St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ray Round", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /service-quotes"
              payload: { property_id: "${prop_id}", quote_type: "REPAIR", line_items: [ { description: "valve", quantity: 1, unit_rate_cents: 1431 }, { description: "fitting", quantity: 1, unit_rate_cents: 806 } ] }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /service-quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /service-quotes/${quote_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_id: $.data.linked_work_order_id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-04-02" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${wo_id}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_cents: 1431, actual_parts_cents: 801 }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "ServiceQuote.${quote_id}.final_total_cents == 2410"

      - name: plan_dues_circular_tier_evaluation_order
        grounds:
          - calculations.plan_annual_dues
          - entities.MaintenancePlan.fields.annual_dues_cents
          - endpoints.POST /maintenance-plans
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — discount tier is keyed
          on gross, but gross must be computed first. PLUS @ 8 visits: gross=72000 → 8% tier → 66240.
        test_recipe:
          setup:
            - "A Property exists; a PLUS plan with visits_per_year=8 is created."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Plan Co", contact_email: "p@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "8 Plan Ave", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /maintenance-plans"
              payload: { property_id: "${prop_id}", tier: "PLUS", visits_per_year: 8 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
          assert:
            - "MaintenancePlan.${plan_id}.annual_dues_cents == 66240"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_cyclic_revision_loop
        grounds:
          - state_machines.ServiceQuote.SENT_to_CHANGES_REQUESTED
          - state_machines.ServiceQuote.CHANGES_REQUESTED_to_DRAFT
          - state_machines.ServiceQuote.DRAFT_to_SENT
        distinguishing_aspect: |
          ServiceQuote is cyclic: SENT → CHANGES_REQUESTED → DRAFT → SENT returns to a prior state,
          and estimated_total_cents is recomputed on the second send from revised line_items (100→108).
        test_recipe:
          setup:
            - "A Customer-owned Property with a quote SENT once, then CHANGES_REQUESTED, then revised line_items, then SENT again."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Loop Co", contact_email: "l@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "3 Loop Ct", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /service-quotes"
              payload: { property_id: "${prop_id}", quote_type: "INSTALL", line_items: [ { description: "heads", quantity: 1, unit_rate_cents: 5000 } ] }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /service-quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /service-quotes/${quote_id}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "PATCH /service-quotes/${quote_id}/line-items"
              payload: { line_items: [ { description: "heads", quantity: 2, unit_rate_cents: 50 } ] }
              as: Dispatcher
          trigger:
            - call: "POST /service-quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.quote_state, est: $.data.estimated_total_cents }
          assert:
            - "ServiceQuote.${quote_id}.quote_state == SENT"
            - "ServiceQuote.${quote_id}.estimated_total_cents == 108"

      - name: workorder_parallel_dispatch_and_completion_dimensions
        grounds:
          - state_machines.WorkOrder.dispatch_status=EN_ROUTE_to_dispatch_status=ON_SITE
          - entities.WorkOrder.fields.dispatch_status
          - entities.WorkOrder.fields.completion_status
        distinguishing_aspect: |
          WorkOrder (different entity from ServiceQuote) carries two independent state dimensions:
          arriving advances dispatch_status to ON_SITE while auto-advancing completion_status
          PENDING→IN_PROGRESS — both axes observed on one row in a single response.
        test_recipe:
          setup:
            - "A LEAK_REPAIR WorkOrder scheduled on a route, technician departed and arrived."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Par Co", contact_email: "par@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "4 Par St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Pat Par", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "LEAK_REPAIR", estimated_minutes: 45, estimated_cost_cents: 4000 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-05-01" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${wo_id}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "WorkOrder.${wo_id}.dispatch_status == ON_SITE"
            - "WorkOrder.${wo_id}.completion_status == IN_PROGRESS"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: system_decommission_depth3_zone_program_workorder_chain
        grounds:
          - state_machines.IrrigationSystem.OPERATIONAL_to_DECOMMISSIONED
          - state_machines.Zone
          - state_machines.ControllerProgram.DRAFT_to_ACTIVE
          - state_machines.WorkOrder.completion_status=PENDING_to_completion_status=CANCELLED
        distinguishing_aspect: |
          Depth-3+ cascade from the decommission trigger: decommission → Zones ARCHIVED (hop1) →
          that archival forces the ACTIVE ControllerProgram referencing them to STALE (hop2) →
          open WorkOrders on the system CANCELLED (hop3). Each hop is caused by the previous.
        test_recipe:
          setup:
            - "A system in season_state=ACTIVE with one ACTIVE zone, an ACTIVE ControllerProgram over that zone, and one PENDING (UNSCHEDULED) WorkOrder."
            - "season_state is set ACTIVE by completing a STARTUP work order (system was first WINTERIZED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Casc Co", contact_email: "c@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "5 Casc Rd", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 1, plant_type: "TURF", head_count: 8, gpm_per_head: 18 }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Cas Tech", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            # winterize first so STARTUP is allowed
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "WINTERIZATION", estimated_minutes: 30, estimated_cost_cents: 9000 }
              as: Dispatcher
              captures: { wint_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-10-01" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v0: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${wint_id}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${route_v0}" }
              as: Dispatcher
            - call: "POST /work-orders/${wint_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wint_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wint_id}/complete"
              payload: { actual_labor_cents: 5000, actual_parts_cents: 1000 }
              as: Technician
              as_user_id: "${tech_id}"
            # now STARTUP -> season ACTIVE
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "STARTUP", estimated_minutes: 30, estimated_cost_cents: 6000 }
              as: Dispatcher
              captures: { start_id: $.data.id }
            - call: "GET /routes/${route_id}"
              payload: {}
              as: Dispatcher
              captures: { route_v1: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${start_id}", arrival_start_sec: 32400, window_minutes: 60, expected_route_version: "${route_v1}" }
              as: Dispatcher
            - call: "POST /work-orders/${start_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${start_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${start_id}/complete"
              payload: { actual_labor_cents: 4000, actual_parts_cents: 0 }
              as: Technician
              as_user_id: "${tech_id}"
            # program now activatable (season ACTIVE)
            - call: "POST /controller-programs"
              payload: { system_id: "${sys_id}", slots: [ { zone_id: "${zone_id}", start_sec: 21600, run_minutes: 20 } ] }
              as: Dispatcher
              captures: { prog_id: $.data.id }
            - call: "POST /controller-programs/${prog_id}/activate"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            # an open work order to be cancelled by cascade
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "HEAD_REPAIR", estimated_minutes: 20, estimated_cost_cents: 3000 }
              as: Dispatcher
              captures: { open_wo_id: $.data.id }
          trigger:
            - call: "POST /irrigation-systems/${sys_id}/decommission"
              payload: {}
              as: Dispatcher
          assert:
            - "IrrigationSystem.${sys_id}.lifecycle_state == DECOMMISSIONED"
            - "Zone.${zone_id}.zone_state == ARCHIVED"
            - "ControllerProgram.${prog_id}.program_state == STALE"
            - "WorkOrder.${open_wo_id}.completion_status == CANCELLED"

      - name: backflow_pass_bubbles_up_system_then_property_compliance
        grounds:
          - state_machines.BackflowTest.(create)_to_result=PASS
          - entities.IrrigationSystem.fields.backflow_status
          - entities.Property.fields.compliance_status
        distinguishing_aspect: |
          Depth-2 bubble-up from a different trigger (backflow test creation): PASS sets
          IrrigationSystem.backflow_status=CERTIFIED (hop1), which forces Property.compliance_status
          recompute to COMPLIANT (hop2) because the property's only system is now CERTIFIED.
        test_recipe:
          setup:
            - "A property with exactly one system that has has_backflow_device=true; a backflow_certified technician exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Comply Co", contact_email: "cm@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "7 Comply Way", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60, has_backflow_device: true }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Bea Backflow", shift_start_sec: 28800, shift_end_sec: 64800, backflow_certified: true }
              as: Dispatcher
              captures: { tester_id: $.data.id }
          trigger:
            - call: "POST /backflow-tests"
              payload: { system_id: "${sys_id}", tester_technician_id: "${tester_id}", relief_open_psi: 5, checkvalve_hold_psi: 3 }
              as: BackflowTester
              as_user_id: "${tester_id}"
              captures: { res: $.data.result }
          assert:
            - "BackflowTest result == PASS"
            - "IrrigationSystem.${sys_id}.backflow_status == CERTIFIED"
            - "Property.${prop_id}.compliance_status == COMPLIANT"

