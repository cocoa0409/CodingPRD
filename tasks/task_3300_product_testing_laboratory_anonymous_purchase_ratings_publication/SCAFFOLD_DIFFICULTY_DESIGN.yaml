            - call: "POST /lab-protocols/${proto_id}/transitions"
              payload: { action: "activate", expected_category_version: "${cat_v}" }
              as: MethodologyOfficer
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "approve" }
              as: EditorialDirector
              as_user_id: "ed-1"
            - call: "POST /test-samples"
              payload: { program_id: "${prog_id}", model_label: "Mow1", required_units: 1 }
              as: LabManager
              captures: { samp_id: $.data.id }
            - call: "POST /test-programs/${prog_id}/transitions"
              payload: { action: "start_sourcing" }
              as: LabManager
            - call: "POST /purchase-orders"
              payload: { program_id: "${prog_id}", buyer_alias: "alias-a", retailer_name: "ToolMart", receipt_doc_ref: "RA", shipping_cents: 0, lines: [ { sample_id: "${samp_id}", unit_price_cents: 1000, qty: 1, tax_rate_bp: 0 } ] }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "place" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "POST /purchase-orders/${po_id}/transitions"
              payload: { action: "cancel" }
              as: PurchasingAgent
              as_user_id: "pa-1"
            - call: "GET /test-programs/${prog_id}"
              as: LabManager
              captures: { committed: $.data.committed_cents }
          assert:
            - "TestProgram.committed_cents == 0 after place+cancel pair (invariant: committed unchanged by compensated pair)"
      - name: survey_submit_exclude_count_invariant
        grounds: [entities.SurveyWave.fields.response_count, state_machines.SurveyWave.OPEN_to_CLOSED]
        distinguishing_aspect: "Different conserved quantity: SurveyWave.response_count and threshold_met. submit_response (+1) paired with exclude_response (-1) restores response_count and threshold_met exactly; a wave that crossed min_responses by the pair alone returns below threshold."
        test_recipe:
          setup: ["member ACTIVE with subscription; wave [2026-09-01, 2026-09-05] min_responses 1; clock 2026-09-03; one response submitted (COUNTED, threshold_met true)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s1@x.com", full_name: "S One" }
              as: Member
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/transitions"
              payload: { action: "add_subscription", plan_tier: "DIGITAL", term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /product-categories"
              payload: { name: "Dryers", refresh_cycle_months: 24, market_share_pct: 20, member_interest_pct: 20 }
              as: LabManager
              captures: { cat_id: $.data.id }
            - call: "POST /survey-waves"
              payload: { category_id: "${cat_id}", field_start: "2026-09-01T00:00:00Z", field_end: "2026-09-05T00:00:00Z", min_responses: 1 }
              as: SurveyDirector
              captures: { wave_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: LabManager
            - call: "POST /survey-waves/${wave_id}/transitions"
              payload: { action: "submit_response", member_id: "${m1_id}", model_label: "Dry1", reliability_score: 70, satisfaction_score: 80 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { tm: $.data.threshold_met }
          trigger:
            - call: "POST /survey-waves/${wave_id}/transitions"
              payload: { action: "exclude_response", response_index: 1 }
              as: SurveyDirector
              captures: { rc: $.data.response_count, tm2: $.data.threshold_met }
          assert:
            - "after submit: threshold_met was true (response_count 1 >= 1)"
            - "after exclude_response: response_count == 0 and threshold_met == false — the submit/exclude pair conserves the count with zero drift"
