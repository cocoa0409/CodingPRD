          trigger:
            - { call: "POST /api/installation-windows/${w_id}/transitions", payload: { to_status: "RELEASED" }, as: InstallationManager, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_WINDOW_TRANSITION; status remains RELEASED"

