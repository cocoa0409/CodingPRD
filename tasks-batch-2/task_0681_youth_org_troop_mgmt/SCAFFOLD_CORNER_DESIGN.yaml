              payload: { invoice_id: "${i5}", member_id: "${y5}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "Y6spare", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { y6: $.data.id }
            - call: "POST /members/${y6}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { i6: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${i6}", member_id: "${y6}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "ADULT", full_name: "L1", birthdate: "1980-01-01" }
              as: TroopLeader
              captures: { l1: $.data.id }
            - call: "POST /members/${l1}/leader-credentials"
              payload: { requested_by_user_id: "leader-bob" }
              as: TroopLeader
              captures: { lc1: $.data.id }
            - call: "POST /leader-credentials/${lc1}/start-bgcheck"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /leader-credentials/${lc1}/resolve-bgcheck"
              payload: { outcome: "CLEAR" }
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
            - call: "POST /leader-credentials/${lc1}/complete-training"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "ADULT", full_name: "L2", birthdate: "1980-01-01" }
              as: TroopLeader
              captures: { l2: $.data.id }
            - call: "POST /members/${l2}/leader-credentials"
              payload: { requested_by_user_id: "leader-bob" }
              as: TroopLeader
              captures: { lc2: $.data.id }
            - call: "POST /leader-credentials/${lc2}/start-bgcheck"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /leader-credentials/${lc2}/resolve-bgcheck"
              payload: { outcome: "CLEAR" }
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
            - call: "POST /leader-credentials/${lc2}/complete-training"
              payload: {}
              as: CouncilRegistrar
            - call: "GET /troops/${tid}"
              payload: {}
              as: CouncilRegistrar
              captures: { stale_v: $.data.version }
            # Drop the spare youth -> bumps troop.version, making stale_v stale (still READY with 5 youth left)
            - call: "POST /members/${y6}/drop"
              payload: {}
              as: TroopLeader
          trigger:
            - call: "POST /troops/${tid}/recharter"
              payload: { expected_troop_version: "${stale_v}" }
              as: CouncilRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "Troop.${tid}.charter_status == PROVISIONAL"

      - name: occ_order_place_stale_fundraiser
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-place-stale-fundraiser]", state_machines.FundraiserOrder.PLACED_to_CANCELLED]
        distinguishing_aspect: "Placing an order with a stale expected_fundraiser_version (read before a prior order bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["LIVE fundraiser; client reads version, one order placed (bumps version), then a second place uses the stale version."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "OCC2", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "OCC-2", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { sid: $.data.id }
            - call: "POST /councils/${cid}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 1000 }
              as: CouncilRegistrar
              captures: { fr: $.data.id }
            - call: "POST /fundraisers/${fr}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { stale_frv: $.data.version }
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr}", troop_id: "${tid}", seller_member_id: "${sid}", units: 10, expected_fundraiser_version: "${stale_frv}" }
              as: TroopLeader
              captures: { first_order: $.data.id }
          trigger:
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr}", troop_id: "${tid}", seller_member_id: "${sid}", units: 10, expected_fundraiser_version: "${stale_frv}" }
              as: TroopLeader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: occ_version_increments_on_write
        claim_type: optimistic_concurrency
        grounds: [entities.Fundraiser.fields.version, state_machines.Fundraiser.DRAFT_to_LIVE]
        distinguishing_aspect: "Fundraiser.version starts at 1 on create and increments to 2 after go-live."
        test_recipe:
          setup: ["A DRAFT fundraiser (version 1)."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "OCC3", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 100 }
              as: CouncilRegistrar
              captures: { fr: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /fundraisers/${fr}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { v2: $.data.version }
          assert:
            - "Fundraiser.${fr}.version == 2"

      - name: derived_field_reconciliation_troop_counts
        claim_type: derived_field_reconciliation
        grounds: [entities.Troop.fields.registered_youth_count, entities.Troop.fields.cleared_leader_count]
        distinguishing_aspect: "After registering one youth and clearing+training one leader, GET /troops/{id} reports registered_youth_count=1 and cleared_leader_count=1; suspending the youth drops the count to 0."
        test_recipe:
          setup: ["A troop with 1 registered youth and 1 cleared+trained leader."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "DR1", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "DR-1", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "DY", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${mid}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "ADULT", full_name: "DL", birthdate: "1980-01-01" }
              as: TroopLeader
              captures: { lid: $.data.id }
            - call: "POST /members/${lid}/leader-credentials"
              payload: { requested_by_user_id: "leader-bob" }
              as: TroopLeader
              captures: { lc: $.data.id }
            - call: "POST /leader-credentials/${lc}/start-bgcheck"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /leader-credentials/${lc}/resolve-bgcheck"
              payload: { outcome: "CLEAR" }
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
            - call: "POST /leader-credentials/${lc}/complete-training"
              payload: {}
              as: CouncilRegistrar
          trigger:
            - call: "POST /members/${mid}/suspend"
              payload: {}
              as: TroopLeader
              captures: { rs: $.data.registration_status }
          assert:
            - "Troop.${tid}.cleared_leader_count == 1"
            - "Troop.${tid}.registered_youth_count == 0"   # youth suspended -> no longer counted

  # =================================================================== Consistency
  - section: consistency_model
    instances:
      - name: immediate_payment_visible_same_request
        claim_type: immediate
        grounds: [state_machines.Member.PENDING_to_REGISTERED]
        excluded_because:
          difficulty_instance: transitive_cascade / payment_paid_registered_troop_posture_depth3
          rationale: "Immediate visibility of the payment cascade (member REGISTERED in the same response) is exercised by the named §1.8 cascade."
