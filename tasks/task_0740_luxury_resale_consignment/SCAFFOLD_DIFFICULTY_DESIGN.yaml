  - rule_id: cross_entity_state_dependency
    instances:
      - name: publish_requires_item_authenticated
        grounds:
          - state_machines.Listing.DRAFT_to_ACTIVE
          - validations[priority=7]
          - errors[ERR_ITEM_NOT_AUTHENTICATED]
          - entities.ConsignmentItem.fields.status
        distinguishing_aspect: "Publishing a listing whose ConsignmentItem is still RECEIVED (never authenticated) is rejected ERR_ITEM_NOT_AUTHENTICATED — the Listing transition is gated by ConsignmentItem.status (pair Listing->ConsignmentItem)."
        test_recipe:
          setup:
            - "HANDBAGS item created DROP_OFF (RECEIVED, NOT authenticated); a DRAFT listing exists for it."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
