      - name: sample_review_fork_divergent_side_effects
        grounds:
          - state_machines.ProductSubmission.SAMPLE_REQUESTED_to_SAMPLE_PASSED
          - state_machines.ProductSubmission.SAMPLE_REQUESTED_to_REVISION_REQUESTED
          - entities.SampleReview.fields.verdict
          - entities.ProductSubmission.fields.revision_round
          - calculations.compliance_risk_index
        distinguishing_aspect: |
          BRANCHING shape: SAMPLE_REQUESTED forks on the SampleReview verdict, and the
          two branches have different SIDE EFFECTS, not just different targets. PASS
          moves to SAMPLE_PASSED leaving revision_round 0 and contributing nothing to
          the risk index; FAIL moves to REVISION_REQUESTED, increments revision_round
          to 1 AND creates a SAMPLE_FAIL factor worth 8. Both submissions live on the
          same agreement, so the resulting index of exactly 8 (band CLEAR, one factor
          row) proves the PASS branch contributed zero.
