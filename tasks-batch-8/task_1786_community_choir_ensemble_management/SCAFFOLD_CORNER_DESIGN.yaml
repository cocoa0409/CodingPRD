  # ============================================================ cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_season_patch_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[season-config-stale-write]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH season with captured version succeeds and bumps version to 2; replaying the same captured version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["season DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id, sv: $.data.version } }
          trigger:
            - { call: "PATCH /v1/seasons/${s_id}", payload: { expected_season_version: "${sv}", late_fee_weekly_cents: 600 }, as: President, captures: { sv2: $.data.version } }
            - { call: "PATCH /v1/seasons/${s_id}", payload: { expected_season_version: "${sv}", late_fee_weekly_cents: 700 }, as: President, captures: { err: $.data.error_id } }
          assert:
            - "First PATCH: Season.version == 2 (version increments on every mutation)"
            - "Second PATCH error_id == ERR_STALE_VERSION"
            - "Season.${s_id}.late_fee_weekly_cents == 600 (stale write did not land)"

      - name: occ_checkpoint_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[season-checkpoint-stale-write]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Checkpoint with captured version succeeds (ops_week_index 0 -> 1); replaying the same version fails 412 rather than double-applying epoch side effects."
        test_recipe:
          setup: ["season OPEN at captured version"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /v1/seasons/${s_id}/checkpoint", payload: { expected_season_version: "${sv}" }, as: President, captures: { sv2: $.data.version } }
            - { call: "POST /v1/seasons/${s_id}/checkpoint", payload: { expected_season_version: "${sv}" }, as: President, captures: { err: $.data.error_id } }
          assert:
            - "First checkpoint: ops_week_index == 1"
            - "Second checkpoint error_id == ERR_STALE_VERSION and ops_week_index stays 1"

      - name: occ_guest_counter_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[guest-contract-counter-stale-write]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Counter-offer with the version captured at offer succeeds; a second counter carrying the same captured version fails 412 (counter legitimately superseded terms)."
        test_recipe:
          setup: ["season OPEN; contract OFFERED with version captured"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/guest-contracts", payload: { season_id: "${s_id}", musician_name: "Cellist", service_lines: [ { kind: "CONCERT", units: 1, rate_cents: 30000 } ], travel_stipend_cents: 0 }, as: ChoirDirector, captures: { gc: $.data.id } }
            - { call: "POST /v1/guest-contracts/${gc}/offer", payload: {}, as: ChoirDirector, captures: { gcv: $.data.version } }
          trigger:
            - { call: "POST /v1/guest-contracts/${gc}/counter", payload: { expected_guest_contract_version: "${gcv}", service_lines: [ { kind: "CONCERT", units: 1, rate_cents: 28000 } ] }, as: ChoirDirector }
            - { call: "POST /v1/guest-contracts/${gc}/counter", payload: { expected_guest_contract_version: "${gcv}", service_lines: [ { kind: "CONCERT", units: 1, rate_cents: 25000 } ] }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "First counter: status == COUNTERED, quoted_fee_cents == 28000, counter_count == 1"
            - "Second counter error_id == ERR_STALE_VERSION; quoted_fee_cents stays 28000"

      - name: library_hold_release_after_return
        claim_type: rate_threshold_reset
        grounds: [state_machines.ScoreCheckout.OVERDUE_to_RETURNED, "validations[priority=10]"]
        distinguishing_aspect: "Returning the OVERDUE checkout posts its 200 fine to the member ledger AND clears the hold: a subsequent new checkout succeeds."
        test_recipe:
          setup: ["season OPEN; ENROLLED member with one OVERDUE checkout (fine 200) on a 2-copy score"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President, captures: { sv: $.data.version } }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/music-scores", payload: { title: "Mass in G", copy_count: 2, replacement_cost_cents: 7000 }, as: Librarian, captures: { sc: $.data.id } }
            - { call: "POST /v1/score-checkouts", payload: { score_id: "${sc}", member_id: "${m_id}", due_date: "2026-08-10T00:00:00Z" }, as: Librarian, captures: { co: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: President }
            - { call: "POST /v1/seasons/${s_id}/checkpoint", payload: { expected_season_version: "${sv}" }, as: President }
          trigger:
            - { call: "POST /v1/score-checkouts/${co}/return", payload: {}, as: Librarian }
            - { call: "POST /v1/score-checkouts", payload: { score_id: "${sc}", member_id: "${m_id}", due_date: "2026-09-01T00:00:00Z" }, as: Librarian, captures: { co2: $.data.id } }
          assert:
            - "ScoreCheckout.${co}.status == RETURNED"
            - "Member.${m_id}.ledger_balance_cents == 200 (fine posted)"
            - "New checkout ${co2} succeeds (hold cleared) with status == CHECKED_OUT"

      - name: dual_variant_coverage_stub
        claim_type: dual_variant_divergence
        grounds: [calculations.dues_invoice_amount, calculations.tour_cost_share]
        excluded_because:
          difficulty_instance: dues_invoice_provisional_vs_final_after_cutoff
          rationale: "Both variants and their reconciliation asserted in §1.8 (dues and tour share instances)."

      - name: concert_cancel_cascade_stub
        claim_type: cascade_chain
        grounds: [state_machines.Concert.VENUE_BOOKED_to_CANCELLED]
        excluded_because:
          difficulty_instance: concert_cancel_depth3_cascade
          rationale: "Full depth-3 cascade asserted end-to-end in the named §1.8 instance."

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_payment
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, endpoints.POST_/v1/dues-payments]
        distinguishing_aspect: "The GET immediately following the payment reflects PAID status and paid_cents 18000 with no delay or separate reconcile call."
        test_recipe:
          setup: ["season OPEN; member ENROLLED with ISSUED invoice 18000"]
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "GET /v1/dues-invoices/${inv}", payload: {}, as: Treasurer }
          assert:
            - "DuesInvoice.${inv}.status == PAID in the immediate read"
            - "DuesInvoice.${inv}.paid_cents == 18000 and final_amount_cents == 18000 (paid before cutoff)"
            - "Season.${s_id}.treasury_balance_cents == 18000 in the same epoch"

