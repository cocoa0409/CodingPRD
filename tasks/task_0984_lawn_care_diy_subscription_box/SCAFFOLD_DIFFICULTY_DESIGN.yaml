  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: referral_qualify_revoke_credit_conservation
        grounds:
          - calculations.credit_balance_calc
          - state_machines.Referral.QUALIFIED_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity = monetary credit balance: EARN_REFERRAL(+480)
          followed by its compensating REVOKE_REFERRAL(-480) leaves
          Customer.credit_balance_cents unchanged at 0, and the balance always
          equals the sum of ledger entries. Different quantity type than the
          application-count invariant.
        test_recipe:
          setup:
            - "Same chain as referral_credit_provisional_vs_qualified through qualification: referrer balance 480, referral QUALIFIED"
          setup_api_calls:
            - call: "POST /api/catalog/products"
              payload: { sku: "FERT-01", name: "Fertilizer", category: FERTILIZER, list_price_cents: 1200, tier_t1_cents: 800, tier_t2_cents: 700, tier_t3_cents: 600, window_start_md: "03-01", window_end_md: "07-01", conflicting_categories: [WEED], min_gap_days: 14 }
              as: PlatformAdmin
