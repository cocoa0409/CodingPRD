      (SUSPENDED → BARRED); that mutation itself triggers Deal

      transitions (ACTIVE → TERMINATED_BREACH); that Deal transition

      triggers PaymentMilestone transitions (SCHEDULED/INVOICED/OVERDUE →

      DEFAULTED), ProductionObligation transitions (TRACKING →

      SHORTFALL_DECLARED), and SublicenseRequest transitions (PENDING →

      REJECTED, APPROVED → REVOKED). Three chained hops driven by one

      original action.

      '
