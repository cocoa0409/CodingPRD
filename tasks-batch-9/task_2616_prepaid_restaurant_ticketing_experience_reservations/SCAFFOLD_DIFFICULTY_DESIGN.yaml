              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/payments"
              payload: { amount_cents: 11583 }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/dietary-notes"
              payload: { guest_index: 1, restriction_code: "NUT", severity: "ANAPHYLAXIS", note_text: "carried epinephrine" }
              as: Guest
