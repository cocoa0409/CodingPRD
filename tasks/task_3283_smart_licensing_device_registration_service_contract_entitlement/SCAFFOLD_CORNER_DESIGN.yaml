  - section: endpoints
    instances:
      - name: response_envelope_shape
        claim_type: response_envelope
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, data; list endpoints include limit/offset/total_count/has_more with default limit 10."
        test_recipe:
          setup: ["Two accounts exist"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C17A", display_name: "E1" }
              as: PlatformAdmin
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C17B", display_name: "E2" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/smart-accounts"
              payload: {}
              as: PlatformAdmin
              captures: { env: $ }
          assert:
            - "env.meta.api_request_id is non-empty"
            - "env.response_type == array"
            - "env.data.total_count == 2"
            - "env.data.limit == 10 and env.data.offset == 0 and env.data.has_more == false"
      - name: pagination_limit_offset
        claim_type: pagination
        grounds:
          - "response_envelope"
        distinguishing_aspect: "limit=1&offset=1 on a 2-row list returns the second row, total_count 2, has_more false."
        test_recipe:
          setup: ["Two accounts exist (created in order C18A then C18B)"]
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C18A", display_name: "P1" }
