  - rule_id: transitive_cascade
    instances:
      - name: solicitation_confirm_three_hop_cascade
        grounds:
          - state_machines.SolicitationCase.INVESTIGATING_to_CONFIRMED
          - calculations.trust_score_update
        distinguishing_aspect: |
          Depth-3 chain where each link causes the next: confirm(case) REMOVES
          target reviews (hop 1, page counts recomputed); each removal increments
          author strike_count, and crossing strike_count >= 2 force-flags the
          author's OTHER reviews on a DIFFERENT page (hop 2, that page's
          displayed_review_count drops); independently the confirm auto-places a
          ConsumerAlert with a 30-day review cooldown on the case page (hop 3,
          future submissions now rejected).
        test_recipe:
          setup:
            - "Clock 2026-09-01; author UA trust 100 (so his reviews DISPLAY, score 700)"
            - "Pages P1 and P2 ACTIVE; UA has DISPLAYED review RA on P1 (rating 5), DISPLAYED review RB on P2 (rating 4), and DISPLAYED review RC on P3 (rating 3)"
            - "Reporter UR files case SC1 on P1 targeting RA; SC1 INVESTIGATING"
            - "Pre-existing strike: a prior confirmed case SC0 on P2 targeted and REMOVED RB, giving UA strike_count == 1 (so this confirm crosses the escalation threshold) and leaving RC as UA's only surviving DISPLAYED review"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
