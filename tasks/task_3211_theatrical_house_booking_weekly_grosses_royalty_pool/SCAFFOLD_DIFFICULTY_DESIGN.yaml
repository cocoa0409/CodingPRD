scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (WeeklyGrossReport vs TicketOrder).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: weekly_gross_provisional_vs_final_divergence
        grounds:
          - calculations.weekly_gross_sum
          - state_machines.WeeklyGrossReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Weekly-gross domain (WeeklyGrossReport entity): the provisional
          variant recomputes live at DRAFT time, the final variant re-derives
          once at submit and freezes; identical order data at creation and
          submit can yield different gross_cents because a refund landed
          between the two derivations.
        test_recipe:
          setup:
            - "One ACTIVE booking in a SMALL non-landmark house with crew engaged and a SIGNED license"
            - "Two SOLD orders in the same settlement week: order A (2 tickets x 5000 cents, factor 1.0, no code) and order B (2 tickets x 5000 cents)"
            - "WeeklyGrossReport for the week exists in DRAFT with provisional gross 20000 cents"
            - "Order B is then refunded, so the provisional live sum would drop to 10000 while the DRAFT report still shows the stale provisional figure"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "GrossCo", contact_email: "g@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "Bijou", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show G", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 50000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 4 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 2, is_group_sale: false, face_value_cents: 5000 }
              as: BoxOfficeAgent
              captures: { order_a: $.data.id }
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-09T19:00:00Z", ticket_count: 2, is_group_sale: false, face_value_cents: 5000 }
              as: BoxOfficeAgent
              captures: { order_b: $.data.id }
            - call: "POST /theatres/bookings/${bk_id}/weekly-gross-reports"
              payload: { week_start: "2026-09-07T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { rep_id: $.data.id, rep_gross_draft: $.data.gross_cents }
            - call: "POST /theatres/ticket-orders/${order_b}/refund"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: HouseManager
          trigger:
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/submit"
              payload: {}
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { rep_gross_final: $.data.gross_cents }
          assert:
            - "WeeklyGrossReport.${rep_id}.gross_cents at submit == 10000 (final variant re-derived after refund)"
            - "WeeklyGrossReport.${rep_id}.gross_cents at DRAFT creation was 20000 (provisional variant, before refund)"
            - "The two variants diverge by exactly the refunded order's computed_gross_cents of 10000"

      - name: order_gross_discount_stacking_divergence
        grounds:
          - calculations.ticket_order_gross
        distinguishing_aspect: |
          Ticket-order domain (TicketOrder entity): two valid reading orders of
          the same formula — "round per-ticket then multiply" vs the pinned
          "round the whole order once" — produce different computed_gross_cents
          for identical inputs; the scaffold pins per-order rounding, so the
          per-ticket reading is wrong.
        test_recipe:
          setup:
            - "One ACTIVE booking in a SMALL non-landmark house with crew and SIGNED license"
            - "One discount code at 11 percent off on the production"
            - "Scratch: 7 tickets x 999 cents face, factor 1.5, code 11 percent. Per-order (pinned): round_half_up(7*999*1.5*0.89) = round_half_up(9331.1505) = 9331. Per-ticket reading: round_half_up(999*1.5*0.89) = round_half_up(1333.665) = 1334; x7 = 9338. Divergence is 7 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "StackCo", contact_email: "s@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "Bijou2", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show S", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 50000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 4 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/productions/${prod_id}/discount-codes"
              payload: { code: "SAVE11", percent_off: 11 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 7, is_group_sale: false, face_value_cents: 999, discount_code_id: "${dc_id}", dynamic_pricing_factor: 1.5 }
              as: BoxOfficeAgent
              captures: { order_gross: $.data.computed_gross_cents }
          assert:
            - "TicketOrder.computed_gross_cents == 9331 (pinned per-order rounding: round_half_up(7*999*1.5*0.89) = round_half_up(9331.1505) = 9331)"
            - "The per-ticket reading would give 9338 (round_half_up(999*1.5*0.89)=1334 per ticket x 7) and MUST NOT be produced; the two valid readings diverge by exactly 7 cents"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes (a) and (b).
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_split_max_rent_vs_pct_nonlinear
        grounds:
          - calculations.weekly_settlement_split
          - calculations.weekly_crew_cost
        distinguishing_aspect: |
          Mode (a): the settlement split has >= 3 inputs (gross, rent,
          house_expenses, crew size vs union min, fixed royalties, points) with
          non-linear interaction via nested max(weekly_rent, 0.30*gross) and
          max(0, operating_profit) and a tiered crew minimum selected by house
          size_class.
        test_recipe:
          setup:
            - "ACTIVE booking in a MEDIUM house (union min 8, crew engaged 10), SIGNED license rent 400000"
            - "One pool participant 60 points, one pool participant 40 points, one fixed participant 50000 cents fixed royalty"
            - "VERIFIED report with gross 2000000 cents"
            - "Scratch: rent=max(400000, 0.30*2000000=600000)=600000; crew=10*120000=1200000; profit=2000000-300000(house_exp)-1200000-600000-50000=-150000 -> pool=0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "SplitCo", contact_email: "sp@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "Midtown", capacity: 1200, size_class: MEDIUM, is_landmark: false, base_weekly_rent_cents: 400000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show M", required_size_class: MEDIUM, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 400000, stop_clause_weekly_floor_cents: 100000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 10 }
              as: HouseManager
            - call: "POST /theatres/productions/${prod_id}/royalty-participants"
              payload: { participant_name: "Author", royalty_points: 60, pool_eligible: true }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/productions/${prod_id}/royalty-participants"
              payload: { participant_name: "Composer", royalty_points: 40, pool_eligible: true }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/productions/${prod_id}/royalty-participants"
              payload: { participant_name: "Star", royalty_points: 1, pool_eligible: false, fixed_royalty_cents: 50000 }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 8, is_group_sale: true, face_value_cents: 250000 }
              as: BoxOfficeAgent
            - call: "POST /theatres/bookings/${bk_id}/weekly-gross-reports"
              payload: { week_start: "2026-09-07T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/submit"
              payload: {}
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/verify"
              payload: {}
              as: HouseManager
          trigger:
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/settlements"
              payload: { house_expenses_cents: 300000 }
              as: HouseManager
              captures: { setl_id: $.data.id }
          assert:
            - "Settlement.${setl_id}.theatre_share_cents == 600000 (0.30 * 2000000 > rent 400000, so pct branch of max wins)"
            - "Settlement.${setl_id}.crew_cost_cents == 1200000 (engaged 10 > MEDIUM min 8; engaged wins)"
            - "Settlement.${setl_id}.weekly_operating_profit_cents == -150000"
            - "Settlement.${setl_id}.royalty_pool_cents == 0 (max(0, profit) gate)"

      - name: per_order_rounding_order_pinned
        grounds:
          - calculations.ticket_order_gross
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — the scaffold rounds the
          whole per-order value once (round_half_up after applying both
          multiplicative factors); rounding per-ticket first and then summing
          yields a different cent total on odd-priced tickets.
        test_recipe:
          setup:
            - "ACTIVE booking in SMALL house, crew 4, SIGNED license"
            - "No discount code; dynamic factor 1.5; face value 999 cents; 3 tickets"
            - "Scratch: per-order (pinned): round_half_up(3*999*1.5) = round_half_up(4495.5) = 4496; per-ticket reading: round_half_up(999*1.5) = round_half_up(1498.5) = 1499 per ticket, x3 = 4497; the pinned value is 4496"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "RoundCo", contact_email: "r@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "Bijou3", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show R", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 50000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 4 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
          trigger:
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 3, is_group_sale: false, face_value_cents: 999, dynamic_pricing_factor: 1.5 }
              as: BoxOfficeAgent
              captures: { order_gross: $.data.computed_gross_cents }
          assert:
            - "TicketOrder.computed_gross_cents == 4496 (round_half_up of the whole-order value 4495.5 rounds half up to 4496)"
            - "The per-ticket reading would give 4497 and MUST NOT be produced"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT
  # entities (cycle on WeeklyGrossReport; cycle on LicenseAgreement via
  # supersede-create; booking approval cascade is depth, not shape).
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: gross_report_revision_cycle
        grounds:
          - state_machines.WeeklyGrossReport
        distinguishing_aspect: |
          WeeklyGrossReport exhibits a true cycle DRAFT -> SUBMITTED ->
          REJECTED -> DRAFT (revision loop), not a linear pipeline; the loop
          re-derives the provisional gross each pass.
        test_recipe:
          setup:
            - "ACTIVE booking with SIGNED license and crew; one SOLD order of 2 x 5000 in week of 2026-09-07"
            - "Report created, submitted, rejected"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "CycCo", contact_email: "c@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "Bijou4", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show C", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 50000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 4 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 2, is_group_sale: false, face_value_cents: 5000 }
              as: BoxOfficeAgent
            - call: "POST /theatres/bookings/${bk_id}/weekly-gross-reports"
              payload: { week_start: "2026-09-07T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/submit"
              payload: {}
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/reject"
              payload: {}
              as: HouseManager
          trigger:
            - call: "POST /theatres/weekly-gross-reports/${rep_id}/revise"
              payload: {}
              as: CompanyRep
              as_user_id: "${comp_id}"
          assert:
            - "WeeklyGrossReport.${rep_id}.status == DRAFT after revise (cycle back)"
            - "WeeklyGrossReport.${rep_id}.gross_cents == 10000 re-derived provisional"
            - "A second submit from DRAFT is accepted (loop is repeatable)"

      - name: license_agreement_supersede_cycle
        grounds:
          - state_machines.LicenseAgreement
          - concurrency_rules[license-create-stale-booking]
        distinguishing_aspect: |
          LicenseAgreement is non-linear on a different entity: DRAFT/SIGNED ->
          SUPERSEDED is reachable repeatedly — creating a fresh agreement on the
          same booking supersedes the old one, and the new agreement itself can
          later be superseded, forming a DRAFT->SIGNED->SUPERSEDED-(new
          DRAFT) chain rather than a one-shot pipeline.
