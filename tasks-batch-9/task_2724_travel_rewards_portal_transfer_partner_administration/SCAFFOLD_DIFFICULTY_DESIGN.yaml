            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "SEA-NRT-11", depart_at: "2026-11-02T09:00:00Z", return_at: "2026-11-16T18:00:00Z", net_rate_cents: 40000, agency_public_price_cents: 50000, agency_public_seats: 3, portal_seats: 2, tax_cents: 0 }
              as: AgencySupplier
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /rewards/inventory-offers/${o_id}/book"
