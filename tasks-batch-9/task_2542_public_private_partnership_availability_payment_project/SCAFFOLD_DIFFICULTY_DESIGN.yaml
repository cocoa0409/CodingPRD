# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2542 — Public-Private Partnership Availability Payment Project
#
# Cross-reference of SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules
# of SKILL.md §0.5. 24 instances across 9 rule_ids.
#
# Shared fixture (every literal below was computed with Decimal/ROUND_HALF_UP
# against the §1.3 formulas before being written down):
#   Concession   masp_cents 100000000, indexation_pct 0.0325, deduction_cap_pct 0.20,
#                total_project_cost_cents 400000000, senior_debt_committed 300000000,
#                equity_committed 100000000, base_case_equity_irr_bps 1200,
#                scheduled_service_commencement 2027-01-01,
#                ld_daily_rate_cents 250000, ld_cap_cents 5000000
#   =>  monthly_unitary_charge_cents 8604167   (NOT 8604166)
#   ServicePeriod 2027-03-01 .. 2027-04-01 (half-open) => days_in_period 31,
#                gross_unitary_charge_cents 8604167, deduction_cap_cents 1720833
#   Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: deduction_cap_allocation_sequential_vs_pro_rata_diverge_per_event
        grounds:
          - calculations.period_deduction_cap_allocation
          - calculations.period_deduction_cap_allocation.variants.SEQUENTIAL_CAP
          - calculations.period_deduction_cap_allocation.variants.PRO_RATA_CAP
          - entities.DeductionEvent.fields.allowed_amount_cents
          - entities.DeductionEvent.fields.pro_rata_amount_cents
          - entities.ServicePeriod.fields.total_deduction_cents
        distinguishing_aspect: |
          Entity domain = DeductionEvent money allocation. The two variants share the
          same cap (1720833) and the same three raw amounts and agree on the TOTAL, yet
          disagree on all three per-event allocations: SEQUENTIAL_CAP pays events 1 and 2
          in full and truncates event 3 to 470833, PRO_RATA_CAP scales all three to
          458888 / 688334 / 573611. Only SEQUENTIAL_CAP feeds net_payment_cents.
        test_recipe:
          setup:
            - "A concession at OPERATIONS with monthly_unitary_charge_cents 8604167."
            - "One 31-day ServicePeriod (2027-03-01 .. 2027-04-01) verified with reporting_status VERIFIED, gross_unitary_charge_cents 8604167 and deduction_cap_cents 1720833."
            - "Two deduction events already issued on that period at sequence_no 1 (400 points, raw 500000) and sequence_no 2 (600 points, raw 750000); no relief claim exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/certify-service-commencement"
              payload: { actual_commencement_date: "2027-01-21" }
              as: IndependentCertifier
            - call: "POST /ppp/concessions/${csn_id}/service-periods"
              payload: { period_index: 1, period_start: "2027-03-01", period_end: "2027-04-01" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { sp1_id: $.data.id, sp1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/service-periods/${sp1_id}/performance-reports"
              payload: { unavailable_minutes: 100, category_a_failures: 2, category_b_failures: 4, expected_service_period_version: "${sp1_v}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { pr1_id: $.data.id }
            - call: "POST /ppp/service-periods/${sp1_id}/verify"
              payload: { verified_unavailable_minutes: 100, verified_category_a_failures: 2, verified_category_b_failures: 4 }
              as: AuthorityOfficer
              as_user_id: "officer-beta"
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "UNAVAILABILITY", points: 400 }
              as: AuthorityOfficer
              as_user_id: "officer-gamma"
              captures: { de1_id: $.data.id }
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "PERFORMANCE_FAILURE", points: 600 }
              as: AuthorityOfficer
              as_user_id: "officer-gamma"
              captures: { de2_id: $.data.id }
          trigger:
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "PERFORMANCE_FAILURE", points: 500 }
              as: AuthorityOfficer
              as_user_id: "officer-gamma"
              captures: { de3_id: $.data.id, de3_allowed: $.data.allowed_amount_cents, de3_pro_rata: $.data.pro_rata_amount_cents }
          assert:
            - "DeductionEvent.${de3_id}.sequence_no == 3"
            - "DeductionEvent.${de3_id}.raw_amount_cents == 625000"
            - "DeductionEvent.${de3_id}.allowed_amount_cents == 470833"
            - "DeductionEvent.${de3_id}.pro_rata_amount_cents == 573611"
            - "DeductionEvent.${de1_id}.allowed_amount_cents == 500000 and DeductionEvent.${de1_id}.pro_rata_amount_cents == 458888"
            - "DeductionEvent.${de2_id}.allowed_amount_cents == 750000 and DeductionEvent.${de2_id}.pro_rata_amount_cents == 688334"
            - "sum of allowed_amount_cents over the three events == 1720833"
            - "sum of pro_rata_amount_cents over the three events == 1720833"
            - "the two variants disagree on every one of the three events: 500000 != 458888, 750000 != 688334, 470833 != 573611"
            - "ServicePeriod.${sp1_id}.total_deduction_cents == 1720833"
            - "ServicePeriod.${sp1_id}.relief_credit_cents == 0"
            - "ServicePeriod.${sp1_id}.net_payment_cents == 6883334"
            - "Concession.${csn_id}.availability_deduction_ytd_cents == 1720833"
            - "Concession.${csn_id}.deduction_points_ytd == 1500"

      - name: termination_compensation_variant_selected_by_trigger_reason
        grounds:
          - calculations.termination_compensation
          - calculations.termination_compensation.variants.AUTHORITY_VOLUNTARY
          - calculations.termination_compensation.variants.CONCESSIONAIRE_DEFAULT
          - entities.EnforcementAction.fields.trigger_reason
          - entities.EnforcementAction.fields.compensation_cents
          - state_machines.EnforcementAction.NOTIFIED_to_COMPENSATION_CALCULATED
        distinguishing_aspect: |
          Entity domain = EnforcementAction termination settlement, a different subject
          from the DeductionEvent allocation above. Two TERMINATION rows on the SAME
          concession at the SAME termination_date read the same debt, equity, accrual and
          deduction-offset state, yet AUTHORITY_VOLUNTARY yields 290279167 while
          CONCESSIONAIRE_DEFAULT yields 185279167 — a 105000000-cent divergence — because
          the market-value variant drops the debt/equity/accrual terms entirely and
          substitutes three cost inputs the other variant never reads.
        test_recipe:
          setup:
            - "The dual-variant deduction fixture above: one VERIFIED 31-day period carrying three deduction events with allowed_amount_cents 500000, 750000 and 470833 (sum 1720833), so deduction_offset_cents resolves to 1720833."
            - "Concession at OPERATIONS with equity_drawn_cents 100000000, actual_service_commencement 2027-01-21 and base_case_equity_irr_bps 1200."
            - "No ServicePeriod has payment_status INVOICED, so unpaid_invoiced_cents resolves to 0."
            - "Two TERMINATION EnforcementActions in status NOTIFIED, one with trigger_reason AUTHORITY_VOLUNTARY and one with CONCESSIONAIRE_DEFAULT, both effective 2028-01-21."
            - "Logical clock at 2028-01-21T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/certify-service-commencement"
              payload: { actual_commencement_date: "2027-01-21" }
              as: IndependentCertifier
            - call: "POST /ppp/concessions/${csn_id}/service-periods"
              payload: { period_index: 1, period_start: "2027-03-01", period_end: "2027-04-01" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { sp1_id: $.data.id, sp1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/service-periods/${sp1_id}/performance-reports"
              payload: { unavailable_minutes: 100, category_a_failures: 2, category_b_failures: 4, expected_service_period_version: "${sp1_v}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
            - call: "POST /ppp/service-periods/${sp1_id}/verify"
              payload: { verified_unavailable_minutes: 100, verified_category_a_failures: 2, verified_category_b_failures: 4 }
              as: AuthorityOfficer
              as_user_id: "officer-beta"
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "UNAVAILABILITY", points: 400 }
              as: AuthorityOfficer
              as_user_id: "officer-gamma"
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "PERFORMANCE_FAILURE", points: 600 }
              as: AuthorityOfficer
              as_user_id: "officer-gamma"
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "PERFORMANCE_FAILURE", points: 500 }
              as: AuthorityOfficer
              as_user_id: "officer-gamma"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/enforcement-actions"
              payload: { action_type: "TERMINATION", trigger_reason: "AUTHORITY_VOLUNTARY", effective_date: "2028-01-21" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { ea_vol_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/enforcement-actions"
              payload: { action_type: "TERMINATION", trigger_reason: "CONCESSIONAIRE_DEFAULT", effective_date: "2028-01-21" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { ea_def_id: $.data.id }
          trigger:
            - call: "POST /ppp/enforcement-actions/${ea_vol_id}/calculate-compensation"
              payload: { termination_date: "2028-01-21", outstanding_senior_debt_cents: 180000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { vol_comp: $.data.compensation_cents }
            - call: "POST /ppp/enforcement-actions/${ea_def_id}/calculate-compensation"
              payload: { termination_date: "2028-01-21", outstanding_senior_debt_cents: 180000000, market_value_estimate_cents: 210000000, rectification_cost_cents: 15000000, authority_reprocurement_cost_cents: 8000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { def_comp: $.data.compensation_cents }
          assert:
            - "EnforcementAction.${ea_vol_id}.elapsed_operational_months == 12"
            - "EnforcementAction.${ea_vol_id}.accrued_equity_return_cents == 12000000"
            - "EnforcementAction.${ea_vol_id}.unpaid_invoiced_cents == 0"
            - "EnforcementAction.${ea_vol_id}.deduction_offset_cents == 1720833"
            - "EnforcementAction.${ea_vol_id}.compensation_cents == 290279167"
            - "EnforcementAction.${ea_def_id}.compensation_cents == 185279167"
            - "EnforcementAction.${ea_vol_id}.compensation_cents - EnforcementAction.${ea_def_id}.compensation_cents == 105000000"
            - "EnforcementAction.${ea_def_id}.market_value_estimate_cents == 210000000 while EnforcementAction.${ea_vol_id}.market_value_estimate_cents is null"
            - "EnforcementAction.${ea_vol_id}.status == COMPENSATION_CALCULATED and EnforcementAction.${ea_def_id}.status == COMPENSATION_CALCULATED"
            - "Concession.${csn_id}.status == OPERATIONS (calculating compensation does not terminate the concession)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: monthly_unitary_charge_indexes_before_dividing_and_rounds_once
        mode: b
        grounds:
          - calculations.monthly_unitary_charge
          - calculations.monthly_unitary_charge.rounding
          - entities.Concession.fields.monthly_unitary_charge_cents
          - state_machines.Concession.DRAFTED_to_FINANCIAL_CLOSE
        distinguishing_aspect: |
          Mode (b): rounding order is pinned. The formula is
          round_half_up(masp_cents * (1 + indexation_pct) / 12) — a single ROUND_HALF_UP
          applied to the fully-indexed annual figure. Rounding (or integer-dividing) at
          any intermediate step changes the answer by one cent in BOTH directions, which
          is why two fixtures are used: masp 100000000 @ 0.0325 must yield 8604167 (a
          divide-then-index or truncate-at-the-end implementation gives 8604166), and
          masp 8000000 @ 0.0325 must yield 688333 (a divide-then-index implementation
          gives 688334). No single-direction off-by-one guess satisfies both.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Concessionaire CNR-A with sponsor_equity_commitment_cents 100000000 and Concession A at DRAFTED with masp_cents 100000000, indexation_pct 0.0325, total_project_cost_cents 400000000, senior_debt_committed_cents 300000000, equity_committed_cents 100000000."
            - "Concessionaire CNR-B with sponsor_equity_commitment_cents 10000000 and Concession B at DRAFTED with masp_cents 8000000, indexation_pct 0.0325, total_project_cost_cents 40000000, senior_debt_committed_cents 30000000, equity_committed_cents 10000000."
            - "Neither concession has reached financial close, so monthly_unitary_charge_cents is null on both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_a: $.data.id }
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Tarn Valley Roads Holdco", sponsor_equity_commitment_cents: 10000000 }
              as: PlatformAdmin
              captures: { cnr_b: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_a}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_a: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_b}", project_name: "Tarn Valley Link", masp_cents: 8000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 40000000, senior_debt_committed_cents: 30000000, equity_committed_cents: 10000000, base_case_equity_irr_bps: 1100, scheduled_service_commencement: "2027-06-01", ld_daily_rate_cents: 40000, ld_cap_cents: 800000, lifecycle_reserve_target_cents: 2000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_b: $.data.id }
          trigger:
            - call: "POST /ppp/concessions/${csn_a}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { muc_a: $.data.monthly_unitary_charge_cents }
            - call: "POST /ppp/concessions/${csn_b}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { muc_b: $.data.monthly_unitary_charge_cents }
          assert:
            - "Concession.${csn_a}.monthly_unitary_charge_cents == 8604167"
            - "Concession.${csn_a}.monthly_unitary_charge_cents != 8604166 (truncation or divide-then-index is wrong)"
            - "Concession.${csn_b}.monthly_unitary_charge_cents == 688333"
            - "Concession.${csn_b}.monthly_unitary_charge_cents != 688334 (divide-then-index is wrong)"
            - "Concession.${csn_a}.status == FINANCIAL_CLOSE and Concession.${csn_a}.financial_close_date == '2026-09-15'"
            - "Concession.${csn_a}.version == 2"
            - "Concession.${csn_b}.status == FINANCIAL_CLOSE"

      - name: drawdown_split_applies_two_ceilings_in_pinned_order
        mode: a
        grounds:
          - calculations.drawdown_split
          - calculations.drawdown_split.constants.EQUITY_FIRST_PCT
          - entities.DrawdownMilestone.fields.equity_portion_cents
          - entities.DrawdownMilestone.fields.debt_portion_cents
          - entities.Concession.fields.equity_drawn_cents
          - entities.Concession.fields.senior_debt_drawn_cents
        distinguishing_aspect: |
          Mode (a): four interacting inputs (requested_amount_cents, total_project_cost_cents,
          equity_committed_cents and the already-drawn equity_drawn_cents) combine
          non-linearly through min(round_half_up(total_project_cost * 0.30) - equity_drawn,
          requested) — a double ceiling where the *second* milestone behaves completely
          differently from the first because the equity bucket is already exhausted.
          Milestone 1 requesting 120000000 splits 100000000 equity / 20000000 debt (the
          per-project equity ceiling of 120000000 is itself clipped by equity_committed
          100000000); milestone 2 requesting 60000000 splits 0 equity / 60000000 debt.
          A single-ceiling implementation gives 60000000/0 or 20000000/40000000 for
          milestone 2.
        test_recipe:
          setup:
            - "Concession at FINANCIAL_CLOSE with total_project_cost_cents 400000000, senior_debt_committed_cents 300000000, equity_committed_cents 100000000, equity_drawn_cents 0, senior_debt_drawn_cents 0."
            - "EQUITY_FIRST_PCT is 0.30, so the project equity ceiling is round_half_up(400000000 * 0.30) = 120000000, itself clipped by equity_committed_cents 100000000."
            - "Milestone M1 requesting 120000000 has been approved and disbursed, leaving equity_drawn_cents 100000000 and senior_debt_drawn_cents 20000000."
            - "Milestone M2 requesting 60000000 has been created and approved but not yet disbursed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
              captures: { m1_equity: $.data.equity_portion_cents, m1_debt: $.data.debt_portion_cents }
            - call: "GET /ppp/concessions/${csn_id}"
              payload: {}
              as: AuthorityOfficer
