scaffold_corner_design:
- section: entities
  instances:
  - name: product_creation_applies_defaults
    claim_type: creation_defaults
    grounds:
    - entities.Product
    distinguishing_aspect: Omitting co_pack_only yields false; status starts ACTIVE; version starts 1; system fields id/created_at are server-minted.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: BAR-VAN-70
          product_name: Vanilla Bar 70ml
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          p1: $.data.id
          p1_status: $.data.status
          p1_copack: $.data.co_pack_only
          p1_v: $.data.version
      trigger:
      - call: GET /products/${p1}
        as: PlantManager
        captures:
          g_status: $.data.status
          g_copack: $.data.co_pack_only
          g_v: $.data.version
      assert:
      - 'create response and GET agree: status == ACTIVE, co_pack_only == false, version == 1'
      - predecessor_product_id is null and successor_product_id is null
  - name: product_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Product
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /products without sku_code is rejected with ERR_INVALID_REQUEST (400); no partial row persists.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /products
        payload:
          product_name: No SKU
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST and HTTP 400
      - GET /products returns total_count == 0
  - name: product_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - entities.Product
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET on a well-formed but nonexistent product id returns ERR_NOT_FOUND (404).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: PlantManager
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and HTTP 404
  - name: product_list_pagination
    claim_type: listing
    grounds:
    - entities.Product
    - response_envelope
    distinguishing_aspect: limit=2 over 3 products returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false.
    test_recipe:
      setup:
      - three products exist
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: P-1
          product_name: P1
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
      - call: POST /products
        payload:
          sku_code: P-2
          product_name: P2
          format: NOVELTY
          flavor_family: CHOCOLATE
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
      - call: POST /products
        payload:
          sku_code: P-3
          product_name: P3
          format: BULK
          flavor_family: FRUIT
          allergens:
          - MILK
          fill_volume_ml_per_unit: 473
          target_overrun_pct: 30
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
      trigger:
      - call: GET /products
        payload:
          limit: 2
          offset: 0
        as: PlantManager
      - call: GET /products
        payload:
          limit: 2
          offset: 2
        as: PlantManager
      assert:
      - 'page 1: 2 rows, total_count == 3, has_more == true'
      - 'page 2: 1 row, total_count == 3, has_more == false'
  - name: lot_computed_fields_at_creation
    claim_type: computed_fields
    grounds:
    - entities.InventoryLot
    distinguishing_aspect: 'Lot fields are derived at run completion: lot_code == LOT-<run_code>, units_produced == actual_units, produced_at == run.completed_at, best_before == produced_at + shelf_life_days,
      pallets == ceil(units/units_per_pallet).'
    test_recipe:
      setup:
      - Product BAR-VAN-70 (shelf 540, upp 100); completed run R-LC with actual_units 2000 at logical time 2026-08-10T08:00 into zone Z-A
      setup_api_calls:
      - call: POST /products
        payload:
          sku_code: BAR-VAN-70
          product_name: Vanilla Bar 70ml
          format: NOVELTY
          flavor_family: VANILLA
          allergens:
          - MILK
          fill_volume_ml_per_unit: 70
          target_overrun_pct: 40
          units_per_pallet: 100
          shelf_life_days: 540
        as: PlantManager
        captures:
          p_bar: $.data.id
      - call: POST /lines
        payload:
          line_code: L-1
          format: NOVELTY
          rate_units_per_hour: 12000
        as: PlantManager
        captures:
          l1: $.data.id
      - call: POST /tunnels
        payload:
          tunnel_code: T-1
          max_units_per_hour: 20000
        as: PlantManager
        captures:
          t1: $.data.id
      - call: POST /freezer-zones
        payload:
          zone_code: Z-A
          pallet_capacity: 400
        as: PlantManager
        captures:
          z_a: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T08:00:00Z'
        as: PlantManager
      - call: POST /mix-batches
        payload:
          batch_code: MB-1
          product_id: ${p_bar}
          litres_produced: 500
        as: ProductionPlanner
        captures:
          m1: $.data.id
      - call: POST /mix-batches/${m1}/pasteurize
        as: LineOperator
        as_user_id: op_1
      - call: POST /mix-batches/${m1}/release
        as: QAManager
        as_user_id: qa_1
      - call: POST /production-runs
        payload:
          run_code: R-LC
          product_id: ${p_bar}
          line_id: ${l1}
          planned_units: 2000
          scheduled_start: '2026-08-10T14:00:00Z'
        as: ProductionPlanner
        captures:
          r1: $.data.id
      - call: POST /changeovers
        payload:
          line_id: ${l1}
          to_product_id: ${p_bar}
        as: ProductionPlanner
        captures:
          ch1: $.data.id
      - call: POST /changeovers/${ch1}/complete
        as: LineOperator
        as_user_id: op_1
      - call: POST /changeovers/${ch1}/verify
        payload:
          outcome: PASS
        as: QAManager
        as_user_id: qa_1
      - call: POST /tunnel-bookings
        payload:
          tunnel_id: ${t1}
          run_id: ${r1}
          start_at: '2026-08-10T13:00:00Z'
          end_at: '2026-08-10T14:00:00Z'
        as: ProductionPlanner
      - call: POST /production-runs/${r1}/assign-mix
        payload:
          mix_batch_id: ${m1}
        as: ProductionPlanner
      - call: POST /production-runs/${r1}/start
        as: LineOperator
        as_user_id: op_1
      trigger:
      - call: POST /production-runs/${r1}/complete
        payload:
          actual_units: 2000
          mix_metered_litres: 100.0
          zone_id: ${z_a}
        as: LineOperator
        as_user_id: op_1
      - call: GET /inventory-lots
        payload:
          run_id: ${r1}
        as: QAManager
        captures:
          lot_code: $.data[0].lot_code
          lot_prod: $.data[0].units_produced
          lot_pal: $.data[0].pallets
          lot_bb: $.data[0].best_before
          lot_status: $.data[0].status
      assert:
      - lot_code == 'LOT-R-LC' and units_produced == 2000 and status == AVAILABLE
      - pallets == 20 (ceil(2000/100)) and produced_at == 2026-08-10T08:00:00Z (logical clock)
      - best_before == produced_at + 540 days (2028-02-01T08:00:00Z)
  - name: run_create_unknown_product_reference_returns_404
    claim_type: parent_relationships
    grounds:
    - entities.ProductionRun
    - errors[ERR_REFERENCE_NOT_FOUND]
    distinguishing_aspect: A run referencing a nonexistent product_id is rejected ERR_REFERENCE_NOT_FOUND (404) — body FK integrity.
    test_recipe:
      setup:
      - one line exists
      setup_api_calls:
      - call: POST /lines
        payload:
          line_code: L-1
          format: NOVELTY
          rate_units_per_hour: 12000
        as: PlantManager
        captures:
          l1: $.data.id
      trigger:
      - call: POST /production-runs
        payload:
          run_code: R-404
          product_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
          line_id: ${l1}
          planned_units: 100
          scheduled_start: '2026-08-10T14:00:00Z'
        as: ProductionPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_REFERENCE_NOT_FOUND and HTTP 404
