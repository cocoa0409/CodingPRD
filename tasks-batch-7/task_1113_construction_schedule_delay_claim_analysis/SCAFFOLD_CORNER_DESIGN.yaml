              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/delay-events/${de}/tia/accept"
              payload: {}
              as: ClaimsConsultant
            - call: "POST /construction-projects/${pid}/eot-requests"
              payload: { delay_event_id: "${de}", requested_days: 3 }
              as: ContractorScheduler
              captures: { eid: $.data.id }
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/begin-review"
              payload: {}
              as: OwnerRepresentative
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/accept"
              payload: { expected_project_version: "${pv0}" }
              as: ProjectControlsEngineer
          trigger:
            - call: "POST /construction-projects/${pid}/eot-requests/${eid}/approve"
              payload: { expected_project_version: "${pv0}", approved_days: 3, awarded_cost_cents: 0 }
              as: OwnerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (project.version advanced by the unrelated schedule accept)"

      - name: cascade_progress_update_spawns_lda
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ProgressUpdate.SUBMITTED_to_APPROVED
        excluded_because:
          difficulty_instance: progress_approval_cascades_cpm_recompute_then_lda_spawn
          rationale: "Already covered as the failure path of the named §1.8 instance."

  # =======================================================================
  # Section: consistency_model
  # =======================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_project_version_after_accept
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - entities.ConstructionProject.fields.version
        distinguishing_aspect: "After ScheduleVersion accept returns, a subsequent GET on the project reflects the incremented version in the SAME logical instant — no asynchronous reconciliation."
        test_recipe:
          setup: ["Project with submitted BASELINE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /construction-projects"
              payload: { project_name: "P", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /construction-projects/${pid}/schedule-versions"
              payload: { kind: "BASELINE", data_date: "2026-05-01T00:00:00Z" }
              as: ContractorScheduler
              captures: { bv: $.data.id }
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/activities"
              payload: { activity_code: "A", description: "a", original_duration_days: 5 }
              as: ContractorScheduler
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/submit"
              payload: {}
              as: ContractorScheduler
          trigger:
            - call: "POST /construction-projects/${pid}/schedule-versions/${bv}/accept"
              payload: { expected_project_version: "${pv0}" }
              as: ProjectControlsEngineer
            - call: "GET /construction-projects/${pid}"
              as: ProjectControlsEngineer
              captures: { pv1: $.data.version, st: $.data.status }
          assert:
            - "ConstructionProject.${pid}.version == ${pv0} + 1 (visible immediately in the next read)"
            - "ConstructionProject.${pid}.status == ACTIVE"
