            - "Subscription.${s_a_id}.plan_id == ${core_plan_id}"
            - "Subscription.${s_a_id}.committed_price_cents == 4999"
            - "Subscription.${s_a_id}.version == 1"

      - name: presenting_an_exhausted_template_a_second_time_is_rejected_on_quota
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_QUOTA_EXCEEDED]
          - validations[priority=39]
          - calculations.save_offer_selection
        distinguishing_aspect: |
          The selector deliberately keeps quota-exhausted templates in the candidate set, so with
          max_per_subscriber_per_365d 1 already consumed the second present-offers call still
          selects T_Q and is rejected 422 ERR_OFFER_QUOTA_EXCEEDED - it must NOT silently fall
          through to ERR_NO_ELIGIBLE_SAVE_OFFER, and no second grant is created.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE; T_Q is the only template (DISCOUNT 0.1000 x 1, rank 10, reason PRICE, max_per_subscriber_per_365d 1)."
            - "Subscriber A subscribed, opened session 1, captured reason PRICE, was presented T_Q and accepted it, so the session is OFFER_ACCEPTED and the subscription is still ACTIVE."
            - "Session 2 was then opened and captured reason PRICE (step_count 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "T_Q", name: "One Per Year Discount", offer_type: "DISCOUNT", priority_rank: 10, discount_pct: 0.1000, discount_cycles: 1, eligible_reason_codes: ["PRICE"], max_per_subscriber_per_365d: 1 }
              as: PlatformAdmin
              captures: { t_q_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess1_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess1_id}/reason"
              payload: { reason_code: "PRICE" }
