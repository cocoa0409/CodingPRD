          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno ACTIVE with an ACTIVE DINING/CA agreement (commission 1200 bps, share 2500 bps)."
            - "Employer Northwind Co LIVE with revenue_share_enabled true and one ELIGIBLE membership E-001."
            - "Membership E-001 holds a VERIFIED redemption of gross 5000 (commission 480, share 120, provider net 360) whose fulfillment_status is AWAITING."
            - "At 2026-08-02T00:00:00Z the employee files a NOT_HONORED dispute, so the dispute is OPEN with response_deadline_at 2026-08-07T00:00:00Z."
