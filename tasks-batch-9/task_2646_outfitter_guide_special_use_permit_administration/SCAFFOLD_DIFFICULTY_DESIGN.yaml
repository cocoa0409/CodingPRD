              payload: { period_start_date: "2027-05-15", period_end_date: "2027-06-14", service_days_used: 10, client_count: 8, gross_revenue_cents: 1000001, allowable_deductions_cents: 150001 }
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
          assert:
            - "ONE PAST the cap: the trigger returns ERR_DEDUCTIONS_EXCEED_CAP with HTTP 422, because floor(1000001 * 0.15) == floor(150000.15) == 150000 and 150001 > 150000"
            - "no TripUseReport row is created by the refused call"
