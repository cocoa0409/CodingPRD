            - "trigger 1: HTTP status == 200, OrganizationRecognition.${rec_id}.status == 'CONDITIONAL' with conditional_reason_code == 'COMPLIANCE_REVIEW'"
            - "trigger 2: HTTP status == 201 — CONDITIONAL is inside the admitted set {ACTIVE, CONDITIONAL}, so priority 20 must stay quiet; Representative.${nadia_id}.authorization_status is still 'AUTHORIZED_ACCREDITED' because the qualifying filter also admits CONDITIONAL"
            - "trigger 3: HTTP status == 200, status == 'LAPSED', and Accreditation.${nadia_acc_id}.status == 'SUSPENDED_BY_RECOGNITION' with Representative.${nadia_id}.authorization_status == 'AUTHORIZATION_SUSPENDED'"
