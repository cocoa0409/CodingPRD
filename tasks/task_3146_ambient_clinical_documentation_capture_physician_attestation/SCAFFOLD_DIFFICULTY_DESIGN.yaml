              payload: {}
              as: Physician
              as_user_id: "${phy}"
              captures: { d_status: "$.data.status", d_score: "$.data.completeness_score" }
            - call: "GET /ambient-clinical-documentation/note-drafts/${draft}/fields"
              payload: {}
              as: Physician
              as_user_id: "${phy}"
          assert:
            - "AmbientConsent.${cons}.status == OPTED_OUT and end_reason == OPT_OUT"
            - "cascade link 1: AudioCapture.${cap2}.status == PURGED (purge_reason OPT_OUT); AudioCapture.${cap1} stays TRANSCRIBED with retention_days_effective == 30 (clamped from 90)"
            - "cascade link 2: every NoteField with source == AUDIO has field_value == null and validated == false; the MANUAL chief_complaint keeps 'back pain'"
            - "cascade link 3: d_status == DRAFT and d_score == 65 (only chief_complaint filled: missing 3x MAJOR + 1x MINOR = 35 penalty)"
      - name: encounter_cancel_expires_consent_purges_capture_depth2
        grounds:
          - state_machines.Encounter.IN_PROGRESS_to_CANCELLED
          - state_machines.AmbientConsent.GRANTED_to_EXPIRED
          - state_machines.AudioCapture.RECORDING_to_PURGED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (encounter cancel, not patient
          opt-out): cancel moves the GRANTED consent to EXPIRED; the consent
          expiry itself purges the RECORDING capture with purge_reason CANCEL.
        test_recipe:
          setup:
            - "Encounter IN_PROGRESS with GRANTED consent and one RECORDING capture"
          setup_api_calls:
            - call: "POST /ambient-clinical-documentation/patients"
              payload: { mrn: "MRN-TC2-1", full_name: "Pat Tc2" }
              as: PlatformAdmin
              captures: { pat: "$.data.id" }
