          setup:
            - "Clock at 2026-09-01. Atlas Mutual holds NAIC 11111 and Beacon Casualty 22222; producer PL-4471 exists; period 2026-P3 exists."
            - "Applicant Owen Pike holds driver licence D-99011 and owns VIN 1HGCM82633A004360."
