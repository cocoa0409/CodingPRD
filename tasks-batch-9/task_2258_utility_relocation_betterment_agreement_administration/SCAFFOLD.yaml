    roles: [ProgramAdmin, UtilityCoordinator, RightOfWayAdjudicator, ConstructionEngineer]
    code: 200
    input: ["project_id?", "facility_id?", "quality_level?", "limit?", "offset?"]
    output: SubsurfaceInvestigation[]
    side_effects: []
  - method: GET
    path: /uro/investigations/{id}
    description: Fetch one subsurface investigation record (immutable)
