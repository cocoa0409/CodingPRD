            - "Case.${case_id}.continuance_count == 5"
            - "Case.${case_id}.priority_score == 0: drag is 25 * min(5, 4) = 100 (cap binds), and max(0, 0 - 100) floors at 0"
            - "the surviving SCHEDULED hearing is at \"2027-01-28T10:00:00Z\" after five 28-day bumps from 2026-09-10 (09-10 -> 10-08 -> 11-05 -> 12-03 -> 12-31 -> 01-28)"

      - name: priority_score_age_cap_binds_at_720_days
        claim_type: Constants Applied
        grounds:
          - calculations.case_priority_score
        distinguishing_aspect: "The age term caps at min(days, 720): at 800 days pending a detained case scores 1000 + 2*720 = 2440, not 2600 — the cap removes exactly 160 points."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One DETAINED English case filed (no hearings needed — the score is a pure read-time derivation). Clock advanced 800 days to 2028-11-09."
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "OLD-1", respondent_full_name: "R Old", custody_status: "DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2028-11-09T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
          assert:
            - "Case.${case_id}.days_pending_calendar == 800"
            - "Case.${case_id}.priority_score == 2440 (1000 + 2*min(800, 720) - 0)"
            - "Case.${case_id}.is_past_goal == true (800 > 60 DETAINED target)"

      - name: interpreter_selector_ranks_by_load_then_created_at
        claim_type: Correct Result
        grounds:
          - calculations.interpreter_assignment_selector
        distinguishing_aspect: "Ranking is fewest SCHEDULED hearings that day, tie-break created_at ASC: the first hearing lands on the older interpreter (tie at 0-0), and the second lands on the other interpreter (load 0 beats load 1) — never on a random or id-based choice."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One court, one judge, two 'spa' interpreters (I1 created first, I2 second, daily cap 4), and two Spanish PRO_SE cases docketed to the judge."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - call: "POST /eoir/interpreters"
              payload: { court_id: "${court_id}", full_name: "Interp One", language_codes: ["spa"], daily_hearing_cap: 4 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { i1: $.data.id }
            - call: "POST /eoir/interpreters"
              payload: { court_id: "${court_id}", full_name: "Interp Two", language_codes: ["spa"], daily_hearing_cap: 4 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { i2: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "SP-1", respondent_full_name: "R Uno", custody_status: "NON_DETAINED", primary_language_code: "spa", representation_status: "PRO_SE", interpreter_required: true }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s1: $.data.id }
            - call: "POST /eoir/cases/${s1}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s1_v2: $.data.version }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "SP-2", respondent_full_name: "R Dos", custody_status: "NON_DETAINED", primary_language_code: "spa", representation_status: "PRO_SE", interpreter_required: true }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { s2: $.data.id }
            - call: "POST /eoir/cases/${s2}/assign-judge"
              payload: { judge_id: "${judge_id}" }
