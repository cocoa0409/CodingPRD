          handler happened to query first: the same unknown UUID must produce fourteen different error_ids across
          fourteen routes. A generic ERR_NOT_FOUND, or a handler that resolves ids across tables, fails every row.
          The per-id read of an immutable LiningInspection is included because it is the only route that can produce
          that member of the family.
