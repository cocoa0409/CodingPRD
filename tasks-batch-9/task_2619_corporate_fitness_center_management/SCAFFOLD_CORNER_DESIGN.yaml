            - "After the rejection LiabilityWaiver.${w1_id}.status == \"SIGNED\" AND Member.${m1_id}.current_waiver_id == ${w1_id} AND GET /members/${m1_id}/waivers -> total_count == 1"
            - "Retry with the re-read ${m1_ver2} -> HTTP 201 AND LiabilityWaiver.${w2_id}.status == \"SIGNED\" AND waiver_version_code == \"WVR-2026B\""
            - "LiabilityWaiver.${w1_id}.status == \"SUPERSEDED\" AND Member.${m1_id}.current_waiver_id == ${w2_id}"
            - "${m1_ver2} != ${m1_ver} (the first waiver bumped the member's version)"

      - name: invoice_draft_with_stale_contract_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
