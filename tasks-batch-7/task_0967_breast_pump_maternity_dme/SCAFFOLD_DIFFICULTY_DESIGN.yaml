            - call: "POST /dme/catalog-items"
              payload: { item_type: "PART", name: "Valve", sku: "PART-VALVE", unit_price_cents: 500, covered_under_resupply: true, max_qty_per_frequency: 4 }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Gap Mem", email: "gap@x.com", date_of_birth: "1990-07-17", shipping_address: "19 Chestnut St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
