  - rule_id: compensating_invariant
    instances:
      - name: program_budget_conserved_across_approve_and_revoke
        grounds:
          - calculations.program_budget_remaining
          - state_machines.StipendPayment.PROPOSED_to_APPROVED
          - state_machines.StipendPayment.APPROVED_to_REVOKED
          - state_machines.IncentiveProgram.OPEN_to_EXHAUSTED
        distinguishing_aspect: "Conserved quantity: program budget cents — budget_remaining_cents + sum(amount_cents over APPROVED/PAID stipends) == budget_total_cents holds after the forward APPROVE (0 + 330000 == 330000, program EXHAUSTED at exactly 0) and after the compensating REVOKE (330000 + 0 == 330000, program back OPEN); a different conserved quantity than booking seats."
