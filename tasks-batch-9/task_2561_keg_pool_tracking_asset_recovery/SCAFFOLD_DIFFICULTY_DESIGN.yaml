# §1.8 Scaffold Difficulty Design — task 2561 Keg Pool Tracking & Asset Recovery
# Nine §0.5 difficulty rules x 2 differentiated instances = 18 instances.
# Every numeric assert below was executed against the §1.3 formulas and their
# `constants:` in Python before being written as a literal.
#
# Shared conventions used by every setup chain:
#   * The logical clock is pinned FIRST via POST /_clock/set_current_utc. Where an
#     instance needs several instants on one day it parks the clock late in the day
#     (23:00Z) and uses earlier same-day timestamps, because validation priority 33
#     rejects any scanned_at / received_at / dispatched_at in the future.
#   * A CommodityIndex row is always posted before any keg valuation: validation
#     priority 32 raises ERR_NO_COMMODITY_INDEX without one.
#   * POST /issuance-orders/{order_id}/allocate carries OCC on FloatAgreement.version
#     (§1.2.1 rule order-allocate-stale-agreement), and allocate itself bumps that
#     version — so every allocate is preceded by a fresh GET /float-agreements/{id}
#     capture rather than reusing the activate response's version.
#   * POST /issuance-orders/{order_id}/dispatch carries an explicit dispatched_at and
#     re-bases every allocated keg's dwell_started_at to it, so the brewer dwell spell
#     that fill_charge_net reads is measured from the operator-supplied instant, not
#     from the logical clock at which the dispatch call was made. Every FILL scan below
#     is timestamped at or after its order's dispatched_at so validation priority 35
#     (ERR_CUSTODY_INTERVAL_CONFLICT) never fires unintentionally.
#   * Pools are always stocked with enough kegs that the post-allocation
#     available_pct stays at or above restrict_threshold_pct, otherwise the pool
#     posture cascade would suspend float_posture and mask the effect under test.

scaffold_difficulty_design:

  # ==========================================================================
  # RULE 1 — dual_variant_calc
  # Two variant-bearing calculations from different entity domains:
  #   (i)  keg_loss_value      — money valuation of a physical asset (Keg/LossAssessment)
  #   (ii) brewer_loss_rate_bp — risk scoring of a counterparty (Brewer)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: keg_loss_value_replacement_cost_versus_depreciated_book_divergence
        grounds:
          - calculations.keg_loss_value
          - calculations.stainless_scrap_value
          - entities.LossAssessment.fields.assessment_basis
          - entities.LossAssessment.fields.gross_value_cents
          - entities.LossAssessment.fields.net_chargeback_cents
          - entities.Keg.fields.stainless_scrap_value_cents
          - validations[priority=32]
          - concurrency_rules[assessment-create-stale-keg]
        distinguishing_aspect: |
          This instance exercises the ASSET-VALUATION domain: two LossAssessment rows over
          two kegs carrying byte-identical inputs (same pool replacement_cost_cents 23500,
          same stainless mass 12.5 kg, same commodity index 480 c/kg, same fill_count 24,
          same cause DAMAGED_BEYOND_REPAIR) differ ONLY in assessment_basis and therefore
          produce net_chargeback_cents 19600 versus 17062 — a delta of exactly 2538 cents
          driven by the 1080 bp depreciation write-down, while the scrap credit tail (3900)
          is identical across both variants.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T23:00:00Z."
            - "One CommodityIndex row effective 2026-07-01 at 480 cents/kg (LME_SS304)."
            - "Brewer RDG with credit_limit_cents 400000."
            - "KegPool HB-50L: replacement_cost_cents 23500, stainless_weight_kg 12.5, restrict 25 / freeze 10."
            - "Exactly two kegs in the pool, both imported with fill_count 24 so DEPRECIATED_BOOK is selectable and both rank identically in the allocation selector."
            - "Both kegs allocated to the brewer so keg.current_brewer_id is set and validation priority 32 is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { idx1_id: "$.data.id" }
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001", fill_count: 24, fills_at_last_pressure_test: 0 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002", fill_count: 24, fills_at_last_pressure_test: 0 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 10, per_fill_rate_cents: 2200, replenishment_threshold_pct: 20 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v1: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { io1_id: "$.data.id" }
            - call: "POST /issuance-orders/${io1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v1}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k1_v: "$.data.version", k1_scrap: "$.data.stainless_scrap_value_cents" }
            - call: "GET /kegs/${k2_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k2_v: "$.data.version" }
          trigger:
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "DAMAGED_BEYOND_REPAIR", assessment_basis: "REPLACEMENT_COST", expected_keg_version: "${k1_v}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k2_id}", cause: "DAMAGED_BEYOND_REPAIR", assessment_basis: "DEPRECIATED_BOOK", expected_keg_version: "${k2_v}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { a2_id: "$.data.id" }
          assert:
            - "Keg.${k1_id}.stainless_scrap_value_cents == 3900"
            - "LossAssessment.${a1_id}.assessment_basis == REPLACEMENT_COST"
            - "LossAssessment.${a1_id}.gross_value_cents == 23500"
            - "LossAssessment.${a1_id}.scrap_credit_cents == 3900"
            - "LossAssessment.${a1_id}.assessed_value_cents == 19600"
            - "LossAssessment.${a1_id}.brewer_liability_pct_bp == 10000"
            - "LossAssessment.${a1_id}.net_chargeback_cents == 19600"
            - "LossAssessment.${a2_id}.assessment_basis == DEPRECIATED_BOOK"
            - "LossAssessment.${a2_id}.gross_value_cents == 20962"
            - "LossAssessment.${a2_id}.scrap_credit_cents == 3900"
            - "LossAssessment.${a2_id}.assessed_value_cents == 17062"
            - "LossAssessment.${a2_id}.net_chargeback_cents == 17062"
            - "LossAssessment.${a1_id}.net_chargeback_cents - LossAssessment.${a2_id}.net_chargeback_cents == 2538"
            - "LossAssessment.${a1_id}.commodity_index_id == ${idx1_id} and LossAssessment.${a2_id}.commodity_index_id == ${idx1_id}"
            - "LossAssessment.${a1_id}.brewer_id == ${b1_id} and LossAssessment.${a2_id}.brewer_id == ${b1_id}"
            - "LossAssessment.${a1_id}.chargeback_status == NONE and LossAssessment.${a2_id}.chargeback_status == NONE"
            - "Brewer.${b1_id}.chargeback_balance_cents == 0"

      - name: brewer_loss_rate_trailing_window_versus_lifetime_divergence
        grounds:
          - calculations.brewer_loss_rate_bp
          - entities.Brewer.fields.loss_rate_bp_trailing_90d
          - entities.Brewer.fields.loss_rate_bp_lifetime
          - entities.Brewer.fields.lifetime_fill_count
          - entities.Brewer.fields.upheld_loss_count
          - endpoints[GET /brewers/{brewer_id}/loss-rate]
        distinguishing_aspect: |
          This instance exercises the COUNTERPARTY-RISK domain instead of asset valuation:
          one brewer history (5 lifetime FILL scans, 2 UPHELD assessments, of which 3 fills
          and 1 uphold fall inside the trailing 90-day window ending 2026-08-01) yields
          loss_rate_bp 3333 under TRAILING_90D and 4000 under LIFETIME — a 667 bp delta that
          exists purely because both numerator AND denominator are windowed in one variant
          and unwindowed in the other.
        test_recipe:
          setup:
            - "Clock starts at 2026-02-01T00:00:00Z, advances to 2026-06-15T00:00:00Z, then to 2026-08-01T00:00:00Z; the trailing window at the final read is [2026-05-03T00:00:00Z, 2026-08-01T00:00:00Z]."
            - "CommodityIndex effective 2026-01-01 at 480 c/kg so both assessments can be valued."
            - "Brewer RDG, credit_limit_cents 400000; KegPool with replacement_cost_cents 18000 so each LOST_IN_TRADE uphold nets only 10800 and the balance never reaches the 25000 probation threshold."
            - "Eight kegs in the pool; five allocated and dispatched on 2026-02-01."
            - "Two FILL scans on 2026-02-01 (outside the final window) and three on 2026-06-15 (inside it)."
            - "Assessment A created and upheld on 2026-02-01 (outside the final window); assessment B created and upheld on 2026-06-15 (inside it)."
            - "After each uphold the loss-rate probation gate trips, so the operator restores status ACTIVE before the next FILL — otherwise float_posture SUSPENDED would block it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-01-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { idx1_id: "$.data.id" }
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 18000, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k3_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k4_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0005" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k5_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0006" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0007" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0008" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 10, per_fill_rate_cents: 2200, replenishment_threshold_pct: 20 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-02-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v1: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 5 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { io1_id: "$.data.id" }
            - call: "POST /issuance-orders/${io1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v1}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${io1_id}/dispatch"
              payload: { dispatched_at: "2026-02-01T01:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-02-01T02:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "POST /kegs/${k2_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-02-01T02:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k1_v: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "LOST_IN_TRADE", assessment_basis: "REPLACEMENT_COST", expected_keg_version: "${k1_v}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /loss-assessments/${a1_id}/resolve"
              payload: { resolution: "UPHELD", resolution_notes: "keg never returned from trade" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
            - call: "POST /brewers/${b1_id}/status"
              payload: { status: "ACTIVE", status_reason: "loss review closed, float restored" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k3_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-06-15T00:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "POST /kegs/${k4_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-06-15T00:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "POST /kegs/${k5_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-06-15T00:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "GET /kegs/${k3_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k3_v: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k3_id}", cause: "LOST_IN_TRADE", assessment_basis: "REPLACEMENT_COST", expected_keg_version: "${k3_v}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { a2_id: "$.data.id" }
            - call: "POST /loss-assessments/${a2_id}/resolve"
              payload: { resolution: "UPHELD", resolution_notes: "second unreturned keg" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
            - call: "POST /brewers/${b1_id}/status"
              payload: { status: "ACTIVE", status_reason: "loss review closed, float restored" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /brewers/${b1_id}/loss-rate"
              payload: { basis: "TRAILING_90D" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-3"
            - call: "GET /brewers/${b1_id}/loss-rate"
              payload: { basis: "LIFETIME" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-3"
          assert:
            - "GET /brewers/${b1_id}/loss-rate with basis TRAILING_90D returns loss_rate_bp == 3333"
            - "the TRAILING_90D response returns upheld_loss_count == 1 and fill_count == 3"
            - "the TRAILING_90D response returns window_start == 2026-05-03T00:00:00Z and window_end == 2026-08-01T00:00:00Z"
            - "the TRAILING_90D response returns basis_insufficient == false"
            - "GET /brewers/${b1_id}/loss-rate with basis LIFETIME returns loss_rate_bp == 4000"
            - "the LIFETIME response returns upheld_loss_count == 2 and fill_count == 5"
            - "the two variants differ by exactly 667 bp on identical stored history"
            - "Brewer.${b1_id}.lifetime_fill_count == 5"
            - "Brewer.${b1_id}.upheld_loss_count == 2"
            - "Brewer.${b1_id}.chargeback_balance_cents == 21600"
            - "LossAssessment.${a1_id}.net_chargeback_cents == 10800 and LossAssessment.${a2_id}.net_chargeback_cents == 10800"
            - "Brewer.${b1_id}.status == ACTIVE"

  # ==========================================================================
  # RULE 2 — combinatorial_formula
  # Instance (i) is mode (b): rounding-order dependence (round per keg, then sum).
  # Instance (ii) is mode (c): pinned evaluation order where two sub-expressions
  # deliberately read different bases.
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: return_incentive_rounds_per_keg_before_summation
        grounds:
          - calculations.return_incentive
          - calculations.dwell_days
          - entities.ReturnIncentiveAccrual.fields.incentive_cents
          - entities.ReturnIncentiveAccrual.fields.tier_pct_bp
          - entities.ReturnIncentiveAccrual.fields.cooperation_multiplier_bp
          - entities.Distributor.fields.incentive_accrual_cents
          - state_machines.Keg.IN_TRADE_to_IN_SERVICE
        distinguishing_aspect: |
          Mode (b) — rounding order. Three RETURN scans with distributor dwell spells of
          exactly 12, 20 and 35 days at SILVER produce raw amounts 287.5, 172.5 and 71.875
          cents; rounding each accrual half-up FIRST and summing gives 288 + 173 + 72 = 533,
          whereas summing the raw values (531.875) and rounding once gives 532. The one-cent
          gap is the whole claim, and it exists only because two of the three raw values land
          exactly on a half-cent.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z for the outbound leg, then advanced to 2026-09-20T00:00:00Z for the returns."
            - "Distributor Front Range with return_incentive_rate_cents_per_keg 250 and a SILVER cooperation agreement (multiplier 11500 bp) signed before any return."
            - "KegPool with eight kegs; three allocated, dispatched, filled and distributed on 2026-08-01, all taking distributor custody at 2026-08-01T12:00:00Z."
            - "Returns are staged at exactly +12 days, +20 days and +35 days from that instant so the three dwell bands 10000 / 6000 / 2500 bp are all hit."
            - "SILVER cannot be promoted to GOLD during the test because GOLD_MIN_RETURNS is 5 and only three returns occur."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /distributors"
              payload: { name: "Front Range Distributing", region_code: "CO", return_incentive_rate_cents_per_keg: 250 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { d1_id: "$.data.id" }
            - call: "POST /distributors/${d1_id}/cooperation-agreement"
              payload: { cooperation_tier: "SILVER", effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k3_id: "$.data.id" }
