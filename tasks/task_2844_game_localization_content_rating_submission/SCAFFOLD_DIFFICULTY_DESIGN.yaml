  - rule_id: transitive_cascade
    instances:
      - name: content_edit_apply_six_hop_cascade_to_title_and_qa_passes
        grounds:
          - state_machines.ContentEdit.PROPOSED_to_APPLIED
          - state_machines.TranslationUnit.translation_status.DELIVERED_to_PENDING
          - state_machines.TranslationUnit.qa_status.PASSED_to_NOT_CHECKED
          - state_machines.MarketPlan.LQA_to_IN_LOCALIZATION
          - state_machines.QaPass.CLOSED_to_OPEN
          - state_machines.LqaBug.VERIFIED_to_TRIAGED
          - state_machines.Title.CERT_WINDOW_to_STRINGS_LOCKED
          - calculations.market_text_effort_units
          - calculations.market_localization_cost_cents
          - calculations.qa_defect_density
          - calculations.title_release_gate_state
        distinguishing_aspect: |
          Six-hop chain rooted in a single ContentEdit.apply call: unit revert (hop 2) lowers
          delivered_unit_count below required_unit_count, which reverts MarketPlan LQA ->
          IN_LOCALIZATION (hop 3) and re-derives effort/cost over the shrunken DELIVERED set
          (hop 3b), which reopens the CLOSED QaPass (hop 4), which drags a VERIFIED bug back to
          TRIAGED and lifts defect_density off zero (hop 5), which finally reverts Title
          CERT_WINDOW -> STRINGS_LOCKED (hop 6) - four distinct entity types beyond the trigger.
        test_recipe:
          setup:
            - "Title NOVA-15 with the canonical four keys, one JP market plan TEXT_ONLY at LQA, all four units DELIVERED with applied TM 96/60/40/60, so Title.localization_state is CERT_WINDOW."
            - "One FUNCTIONAL QaPass over 200 inspected units carrying one S3 TRUNCATION bug linked to the legal.eula unit, driven all the way to VERIFIED so the pass could be CLOSED at density 0.0000."
            - "One rating submission disclosing VIOLENCE_REALISTIC and BLOOD with two footage assets, reviewed and sent back EDITS_REQUIRED."
            - "One PROPOSED CENSOR_ASSET content edit naming legal.eula and hud.ammo and removing VIOLENCE_REALISTIC."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-15", name: "Nova Drift 15", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
