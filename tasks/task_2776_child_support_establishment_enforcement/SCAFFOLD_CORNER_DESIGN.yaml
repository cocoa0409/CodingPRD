      - name: good_cause_and_locate_status_gate_writes_on_other_entities
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority 11]"
          - "validations[priority 16]"
          - "errors[ERR_GOOD_CAUSE_BARS_DISCLOSURE]"
          - "errors[ERR_NCP_NOT_LOCATED]"
          - "state_machines.SupportCase.case_status.OPENED -> PATERNITY_PENDING"
        distinguishing_aspect: >
          Two flags that live on OTHER rows decide whether a write succeeds. A
          good_cause_claim on the SupportCase blocks both the locate referral and
          the interstate transmittal with ERR_GOOD_CAUSE_BARS_DISCLOSURE, yet the
          same flag EXEMPTS that case from the locate requirement so its paternity
          action opens straight from OPENED with an unlocated NCP. On the non-good-
          cause case the mirror holds: the paternity action is refused with
          ERR_NCP_NOT_LOCATED at locate_status NOT_NEEDED, still refused at PENDING
          after a referral, and succeeds only once the Participant row reads
          LOCATED.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "Case G: good_cause_claim true, DIRECT_APPLICATION, NCP never located (locate_status NOT_NEEDED)."
            - "Case H: good_cause_claim false, DIRECT_APPLICATION, NCP also unlocated at first."
            - "MAX_LOCATE_ATTEMPTS is 3 and locate_source must be one of the four declared sources."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Priya Chandrasekar", ssn_last4: "6211", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpg5: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Rohan Chandrasekar", ssn_last4: "6212", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpg5: "$.data.id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpg5}", noncustodial_party_id: "${ncpg5}", child_count: 2, tanf_assistance: false, good_cause_claim: true }
              as: CaseWorker
              captures: { caseg5: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Wilma Northcutt", ssn_last4: "6213", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cph5: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Otis Northcutt", ssn_last4: "6214", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncph5: "$.data.id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cph5}", noncustodial_party_id: "${ncph5}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { caseh5: "$.data.id" }
          trigger:
            - call: "POST /child-support/cases/${caseg5}/locate-referrals"
              payload: { locate_source: "FEDERAL_PLS" }
              as: CaseWorker
              captures: { e_gc_locate: "$.data.error_id" }
            - call: "POST /child-support/cases/${caseg5}/interstate-referrals"
