      assert:
      - The payment response's own body reports paid_amount_usd == 10.00, open_balance_usd == 22.47 and payment_status == PARTIALLY_PAID
      - The response also reports billed_amount_usd == 32.47 and lifecycle_status == ISSUED, unchanged by the payment
