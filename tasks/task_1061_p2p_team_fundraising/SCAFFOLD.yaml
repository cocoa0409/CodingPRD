scenario: "1061. Peer-to-Peer & Team Fundraising Event (walk/run): campaign & team/participant page, donation & matching, fundraising-minimum & incentive, event & registration linkage, thermometer & leaderboard, payout & fee, receipt, reporting"
domain_name: "p2p-team-fundraising"
api_prefix: "/api"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Optimistic concurrency"
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the beneficiary nonprofit."
      - name: ein
        type: string
        source: input
        description: "Tax identifier printed on every receipt issued under this organization."
      - name: contact_email
        type: string
        source: input
        description: "Operational contact address."
      - name: payout_account_status
        type: enum
        source: system
        description: "Disbursement readiness of the organization's bank account; gates payout release."
        default: UNVERIFIED
        constraints: "One of {UNVERIFIED, VERIFIED, SUSPENDED}; set by POST /api/organizations/{id}/payout-account"

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: organization_id
        type: string
        source: input
        description: "FK -> Organization.id; the beneficiary that receives payouts for this campaign."
      - name: title
        type: string
        source: input
        description: "Public campaign title shown on the campaign page."
      - name: goal_amount_cents
        type: integer
        source: input
        description: "Campaign fundraising goal in cents; denominator of the thermometer percentage."
        constraints: "integer >= 1"
      - name: fundraising_minimum_cents
        type: integer
        source: input
        description: "Per-participant credited amount required before an event registration may be confirmed."
        default: 0
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: system
        description: "Campaign lifecycle state."
        default: DRAFT
        constraints: "One of {DRAFT, PUBLISHED, CLOSED}"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the campaign moved DRAFT -> PUBLISHED; null while DRAFT."
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the campaign moved PUBLISHED -> CLOSED; null otherwise."
      - name: raised_credited_cents
        type: integer
        source: computed
        description: "Campaign-wide FINAL credited total; see calculations.campaign_thermometer."
        default: 0
      - name: lifetime_net_cents
        type: integer
        source: computed
        description: "Sum over SETTLED donations of (net_cents + matched_amount_cents); see calculations.campaign_available_balance."
        default: 0
      - name: reserved_payout_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over Payouts of this campaign in {REQUESTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED}."
        default: 0
      - name: paid_out_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over Payouts of this campaign in status RELEASED."
        default: 0
      - name: available_balance_cents
        type: integer
        source: computed
        description: "lifetime_net_cents - reserved_payout_cents - paid_out_cents; see calculations.campaign_available_balance."
        default: 0
      - name: donor_count
        type: integer
        source: computed
        description: "Count of distinct donor_id over Donations of this campaign with payment_status == SETTLED."
        default: 0
      - name: receipt_seq
        type: integer
        source: system
        description: "Per-campaign monotonically increasing receipt counter; last value used by receipt_number minting."
        default: 0

  - name: Event
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign this walk/run event belongs to."
      - name: name
        type: string
        source: input
        description: "Event name, e.g. 'Autumn 10K Walk'."
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start instant of the event."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end instant of the event; must be strictly after starts_at."
      - name: early_bird_ends_at
        type: datetime
        source: input
        description: "Instant at which early-bird registration pricing stops applying (strict: now < early_bird_ends_at qualifies)."
      - name: registration_fee_cents
        type: integer
        source: input
        description: "Undiscounted registration fee in cents."
        constraints: "integer >= 0"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of Registrations in {RESERVED, CONFIRMED, CHECKED_IN} this event may hold."
        constraints: "integer >= 1"
      - name: registered_count
        type: integer
        source: computed
        description: "Count of Registrations of this event with status IN {RESERVED, CONFIRMED, CHECKED_IN}."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Derived occupancy/lifecycle state; OPEN and FULL are re-derived from registered_count vs capacity."
        default: OPEN
        constraints: "One of {OPEN, FULL, CLOSED}"

  - name: Team
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign this team fundraises for."
      - name: name
        type: string
        source: input
        description: "Public team name."
      - name: goal_amount_cents
        type: integer
        source: input
        description: "Team fundraising goal in cents; denominator of the GOAL_PERCENT leaderboard variant."
        constraints: "integer >= 1"
      - name: captain_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; optional captain, must already belong to the same campaign. Null when unset."
      - name: status
        type: enum
        source: system
        description: "Team lifecycle state."
        default: ACTIVE
        constraints: "One of {ACTIVE, DISBANDED}"
      - name: credited_cents
        type: integer
        source: computed
        description: "FINAL team credit; see calculations.team_leaderboard_score."
        default: 0
      - name: member_count
        type: integer
        source: computed
        description: "Count of Participants whose team_id == this team and status IN {PENDING, ACTIVE}."
        default: 0

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign this fundraiser page belongs to."
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; optional team membership, must be a team of the same campaign. Null when unaffiliated."
      - name: recruited_by_participant_id
        type: string
        source: input
        description: "FK -> Participant.id; self-referential recruiter link inside the same campaign. Null when self-signed-up."
      - name: display_name
        type: string
        source: input
        description: "Name shown on the personal fundraising page and the leaderboard."
      - name: personal_goal_cents
        type: integer
        source: input
        description: "Personal fundraising goal in cents."
        default: 10000
        constraints: "integer >= 1"
      - name: status
        type: enum
        source: system
        description: "Participant lifecycle state."
        default: PENDING
        constraints: "One of {PENDING, ACTIVE, WITHDRAWN}"
      - name: credited_cents
        type: integer
        source: computed
        description: "FINAL variant of calculations.participant_credit (SETTLED donations only, actual match included)."
        default: 0
      - name: projected_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of calculations.participant_credit (PENDING + SETTLED, projected match)."
        default: 0
      - name: recruit_count
        type: integer
        source: computed
        description: "Count of Participants whose recruited_by_participant_id == this participant and status IN {PENDING, ACTIVE}."
        default: 0
      - name: minimum_met
        type: boolean
        source: computed
        description: "True when credited_cents >= Campaign.fundraising_minimum_cents of this participant's campaign."
        default: false

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the fundraiser attending the event."
      - name: event_id
        type: string
        source: input
        description: "FK -> Event.id; the event being registered for."
      - name: minimum_waived
        type: boolean
        source: input
        description: "When true, the fundraising-minimum gate is skipped at confirm time. Only a CampaignManager may set it true."
        default: false
      - name: fee_charged_cents
        type: integer
        source: computed
        description: "Registration fee actually charged; see calculations.registration_fee_charged."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Registration lifecycle state."
        default: RESERVED
        constraints: "One of {RESERVED, CONFIRMED, CHECKED_IN, CANCELLED, NO_SHOW}"
      - name: confirmed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the RESERVED -> CONFIRMED transition; null otherwise."

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: "Donor name printed on the receipt."
      - name: email
        type: string
        source: input
        description: "Donor email; receipt delivery address."
      - name: is_anonymous
        type: boolean
        source: input
        description: "When true the donor name is suppressed from public donation listings."
        default: false

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign the gift is credited to."
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the giver."
      - name: match_pool_id
        type: string
        source: system
        description: "FK -> MatchPool.id; the pool selected by calculations.match_allocation at settle time. Null when no pool matched."
      - name: designation_type
        type: enum
        source: input
        description: "Polymorphic designation discriminator selecting what designation_id points at."
        constraints: "One of {CAMPAIGN, TEAM, PARTICIPANT}"
      - name: designation_id
        type: string
        source: input
        description: "Polymorphic reference resolved by designation_type: Campaign.id when CAMPAIGN, Team.id when TEAM, Participant.id when PARTICIPANT. Not an FK column; resolvability is enforced by validations[priority=7]."
      - name: amount_cents
        type: integer
        source: input
        description: "Designated gift amount in cents; the number the donor intends the campaign to receive credit for."
        constraints: "integer >= 100"
      - name: cover_fees
        type: boolean
        source: input
        description: "When true the donor pays the fee on top of amount_cents; see calculations.donation_charged_amount."
        default: false
      - name: benefit_value_cents
        type: integer
        source: input
        description: "Fair market value of goods/services returned to the donor; subtracted from the deductible receipt amount."
        default: 0
        constraints: "integer >= 0"
      - name: fee_cents
        type: integer
        source: computed
        description: "Total platform + processing fee; see calculations.donation_fee_and_net."
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: "Amount the campaign nets from the gift itself; see calculations.donation_fee_and_net."
        default: 0
      - name: charged_amount_cents
        type: integer
        source: computed
        description: "Amount actually charged to the donor's card; see calculations.donation_charged_amount."
        default: 0
      - name: matched_amount_cents
        type: integer
        source: computed
        description: "Sponsor match applied from match_pool_id; see calculations.match_allocation. Reset to 0 on reversal."
        default: 0
      - name: payment_status
        type: enum
        source: system
        description: "Payment dimension of the Donation's parallel state machine."
        default: PENDING
        constraints: "One of {PENDING, SETTLED, REFUNDED, FAILED}"
      - name: match_status
        type: enum
        source: system
        description: "Match dimension of the Donation's parallel state machine; evolves independently of payment_status."
        default: UNMATCHED
        constraints: "One of {UNMATCHED, MATCHED, NOT_ELIGIBLE, REVERSED}"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant of PENDING -> SETTLED; anchor of the refund window."
      - name: refunded_at
        type: datetime
        source: system
        description: "Logical-clock instant of SETTLED -> REFUNDED; null otherwise."

  - name: MatchPool
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign whose donations this sponsor pool matches."
      - name: sponsor_name
        type: string
        source: input
        description: "Corporate sponsor funding the pool."
      - name: pool_amount_cents
        type: integer
        source: input
        description: "Total sponsor commitment in cents."
        constraints: "integer >= 1"
      - name: match_ratio
        type: number
        source: input
        description: "Multiplier applied to a settled donation's amount_cents before capping."
        constraints: "number > 0 and <= 5"
      - name: per_donation_cap_cents
        type: integer
        source: input
        description: "Maximum match applied to any single donation."
        constraints: "integer >= 1"
      - name: min_donation_cents
        type: integer
        source: input
        description: "Minimum donation amount_cents eligible for this pool (>= comparison)."
        default: 0
        constraints: "integer >= 0"
      - name: starts_at
        type: datetime
        source: input
        description: "Inclusive start of the pool's matching window."
      - name: ends_at
        type: datetime
        source: input
        description: "Exclusive end of the pool's matching window; must be strictly after starts_at."
      - name: allocated_cents
        type: integer
        source: computed
        description: "Sum of matched_amount_cents over Donations whose match_pool_id == this pool and match_status == MATCHED."
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: "pool_amount_cents - allocated_cents; never negative."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Pool lifecycle state; ACTIVE and EXHAUSTED are re-derived from remaining_cents."
        default: ACTIVE
        constraints: "One of {ACTIVE, EXHAUSTED, CLOSED}"

  - name: IncentiveTier
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign whose participants can earn this tier."
      - name: name
        type: string
        source: input
        description: "Tier name, e.g. 'Champion Jacket'."
      - name: threshold_cents
        type: integer
        source: input
        description: "Participant credited_cents required to earn the tier (>= comparison)."
        constraints: "integer >= 1"
      - name: reward_description
        type: string
        source: input
        description: "What the fundraiser receives."

  - name: IncentiveAward
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the earner. Awards are only created by the settle-time cascade, never by a direct POST."
      - name: tier_id
        type: string
        source: input
        description: "FK -> IncentiveTier.id; the tier earned."
      - name: status
        type: enum
        source: system
        description: "Award lifecycle state."
        default: EARNED
        constraints: "One of {EARNED, FULFILLED, REVOKED}"
      - name: earned_at
        type: datetime
        source: system
        description: "Logical-clock instant the award was created by the settle cascade."
      - name: fulfilled_at
        type: datetime
        source: system
        description: "Logical-clock instant of EARNED -> FULFILLED; null otherwise."
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock instant of EARNED -> REVOKED; null otherwise."

  - name: Receipt
    parent: null
    common_fields: true
    fields:
      - name: donation_id
        type: string
        source: input
        description: "FK -> Donation.id; the settled gift this tax receipt documents. Receipts are only created by the settle cascade."
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; denormalized campaign of the donation, used for the per-campaign receipt sequence."
      - name: receipt_number
        type: string
        source: system
        description: "Per-campaign sequential receipt identifier; see calculations.receipt_issue."
      - name: deductible_amount_cents
        type: integer
        source: computed
        description: "amount_cents - benefit_value_cents of the donation; see calculations.receipt_issue."
        default: 0
      - name: tax_year
        type: integer
        source: computed
        description: "UTC calendar year of the donation's settled_at."
      - name: status
        type: enum
        source: system
        description: "Receipt lifecycle state; cycles ISSUED -> VOIDED -> ISSUED on reissue."
        default: ISSUED
        constraints: "One of {ISSUED, VOIDED}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into ISSUED."
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into VOIDED; null while ISSUED."
      - name: reissue_count
        type: integer
        source: system
        description: "Number of VOIDED -> ISSUED transitions this receipt has undergone."
        default: 0

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign being disbursed."
      - name: amount_cents
        type: integer
        source: input
        description: "Requested disbursement amount in cents."
        constraints: "integer >= 1; the MIN_PAYOUT_CENTS floor of 5000 is enforced by validations[priority=13] as ERR_PAYOUT_BELOW_MINIMUM, not as a schema range error"
      - name: note
        type: string
        source: input
        description: "Free-text justification supplied by the requesting CampaignManager."
        default: ""
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CampaignManager who created or last resubmitted the payout."
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceReviewer who moved REQUESTED -> UNDER_REVIEW; null before review."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceReviewer who approved; must differ from reviewed_by_user_id (segregation of duties)."
      - name: status
        type: enum
        source: system
        description: "Payout lifecycle state; contains the CHANGES_REQUESTED -> REQUESTED revision cycle."
        default: REQUESTED
        constraints: "One of {REQUESTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED, RELEASED, VOIDED, SUPERSEDED}"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant of APPROVED -> RELEASED; null otherwise."

state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/campaigns/{id}/publish"
        actor: CampaignManager
        preconditions:
          - "campaign.status == DRAFT"
          - "acting X-User-ID == campaign.organization_id"
          - "campaign.goal_amount_cents >= 1"
        side_effects:
          - "sets Campaign.published_at to the current logical-clock instant"
          - "opens the campaign to POST /api/donations and POST /api/participants"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /api/campaigns/{id}/close"
        actor: CampaignManager
        preconditions:
          - "campaign.status == PUBLISHED"
          - "acting X-User-ID == campaign.organization_id"
        side_effects:
          - "sets Campaign.closed_at to the current logical-clock instant"
          - "cascade step 1: every Event of this campaign with status IN {OPEN, FULL} transitions to CLOSED"
          - "cascade step 2: every MatchPool of this campaign with status IN {ACTIVE, EXHAUSTED} transitions to CLOSED"
          - "new Donations, Participants, Teams, Events and Registrations are rejected with ERR_CAMPAIGN_NOT_PUBLISHED"

  - entity: Event
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: re-derivation after any Registration enters {RESERVED, CONFIRMED, CHECKED_IN}"
        actor: system
        preconditions:
          - "event.registered_count == event.capacity after the registration is persisted"
        side_effects:
          - "further POST /api/registrations for this event are rejected with ERR_EVENT_AT_CAPACITY"
      - from: FULL
        to: OPEN
        trigger: "system: re-derivation after any Registration leaves {RESERVED, CONFIRMED, CHECKED_IN}"
        actor: system
        preconditions:
          - "event.registered_count < event.capacity after the registration is cancelled or marked NO_SHOW"
        side_effects:
          - "event re-opens for new registrations"
        note: "OPEN <-> FULL is a derived cycle; capacity is re-evaluated on every registration status change."
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/campaigns/{id}/close (cascade step 1)"
        actor: system
        preconditions:
          - "parent campaign.status transitions PUBLISHED -> CLOSED"
        side_effects:
          - "existing Registrations keep their status; new registrations are rejected with ERR_INVALID_STATE"
      - from: FULL
        to: CLOSED
        trigger: "POST /api/campaigns/{id}/close (cascade step 1)"
        actor: system
        preconditions:
          - "parent campaign.status transitions PUBLISHED -> CLOSED"
        side_effects:
          - "existing Registrations keep their status; new registrations are rejected with ERR_INVALID_STATE"

  - entity: Participant
    initial_state: PENDING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /api/participants/{id}/activate"
        actor: Participant
        preconditions:
          - "participant.status == PENDING"
          - "campaign.status == PUBLISHED"
          - "acting X-User-ID == participant.id"
        side_effects:
          - "participant page becomes eligible for Registration confirmation"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /api/participants/{id}/withdraw"
        actor: Participant
        preconditions:
          - "participant.status == PENDING"
          - "acting X-User-ID == participant.id"
        side_effects:
          - "decrements Team.member_count of participant.team_id when set"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/participants/{id}/withdraw"
        actor: Participant
        preconditions:
          - "participant.status == ACTIVE"
          - "acting X-User-ID == participant.id"
        side_effects:
          - "cascade step 1: every Registration of this participant with status IN {RESERVED, CONFIRMED} transitions to CANCELLED"
          - "cascade step 2: each cancelled Registration decrements Event.registered_count of its event by 1"
          - "cascade step 3: each event whose registered_count drops below capacity and whose status == FULL transitions FULL -> OPEN"
          - "decrements Team.member_count of participant.team_id when set"
          - "already-SETTLED donations designated to this participant keep their credit; Participant.credited_cents is unchanged"

  - entity: Registration
    initial_state: RESERVED
    terminal_states: [CANCELLED, NO_SHOW, CHECKED_IN]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /api/registrations/{id}/confirm"
        actor: Participant
        preconditions:
          - "registration.status == RESERVED"
          - "participant.status == ACTIVE"
          - "event.status IN {OPEN, FULL}"
          - "registration.minimum_waived == true OR participant.credited_cents >= campaign.fundraising_minimum_cents"
        side_effects:
          - "sets Registration.confirmed_at to the current logical-clock instant"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /api/registrations/{id}/check-in"
        actor: CampaignManager
        preconditions:
          - "registration.status == CONFIRMED"
          - "current logical-clock instant >= event.starts_at"
        side_effects:
          - "registration is counted as attended in GET /api/campaigns/{id}/report"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /api/registrations/{id}/no-show"
        actor: CampaignManager
        preconditions:
          - "registration.status == CONFIRMED"
          - "current logical-clock instant >= event.ends_at"
        side_effects:
          - "decrements Event.registered_count by 1"
          - "when the event was FULL and registered_count now < capacity, event transitions FULL -> OPEN"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/registrations/{id}/cancel or Participant withdraw cascade"
        actor: Participant
        preconditions:
          - "registration.status == RESERVED"
        side_effects:
          - "decrements Event.registered_count by 1"
          - "when the event was FULL and registered_count now < capacity, event transitions FULL -> OPEN"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/registrations/{id}/cancel or Participant withdraw cascade"
        actor: Participant
        preconditions:
          - "registration.status == CONFIRMED"
        side_effects:
          - "decrements Event.registered_count by 1"
          - "when the event was FULL and registered_count now < capacity, event transitions FULL -> OPEN"

  - entity: Team
    initial_state: ACTIVE
    terminal_states: [DISBANDED]
    transitions:
      - from: ACTIVE
        to: DISBANDED
        trigger: "POST /api/teams/{id}/disband"
        actor: CampaignManager
        preconditions:
          - "team.status == ACTIVE"
          - "acting X-User-ID == campaign.organization_id of team.campaign_id"
        side_effects:
          - "every Participant whose team_id == this team has team_id set to null"
          - "Team.member_count becomes 0 and Team.credited_cents is recomputed to count only TEAM-designated SETTLED donations"

  - entity: Donation
    initial_state: PENDING
    terminal_states: [REFUNDED, FAILED]
    note: "payment dimension of the Donation parallel state machine; evolves independently of match_status"
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /api/donations/{id}/settle with outcome=SETTLED"
        actor: PlatformAdmin
        preconditions:
          - "donation.payment_status == PENDING"
          - "campaign.status == PUBLISHED"
        side_effects:
          - "sets Donation.settled_at to the current logical-clock instant"
          - "runs calculations.match_allocation, which drives the match dimension UNMATCHED -> MATCHED or UNMATCHED -> NOT_ELIGIBLE"
          - "recomputes Participant.credited_cents / Team.credited_cents / Campaign.raised_credited_cents for the designation target"
          - "creates a Receipt in status ISSUED via calculations.receipt_issue"
          - "creates an IncentiveAward in status EARNED for every IncentiveTier of the campaign whose threshold_cents <= the designated Participant's new credited_cents and for which no non-REVOKED award already exists"
      - from: PENDING
        to: FAILED
        trigger: "POST /api/donations/{id}/settle with outcome=FAILED"
        actor: PlatformAdmin
        preconditions:
          - "donation.payment_status == PENDING"
        side_effects:
          - "no Receipt is created; match dimension moves UNMATCHED -> NOT_ELIGIBLE"
          - "no credited totals change"
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /api/donations/{id}/refund"
        actor: PlatformAdmin
        preconditions:
          - "donation.payment_status == SETTLED"
          - "current logical-clock instant <= donation.settled_at + REFUND_WINDOW_DAYS (60 days)"
          - "campaign.available_balance_cents >= donation.net_cents + donation.matched_amount_cents"
        side_effects:
          - "sets Donation.refunded_at to the current logical-clock instant"
          - "cascade A step 1: when match_status == MATCHED it transitions MATCHED -> REVERSED"
          - "cascade A step 2: the REVERSED transition credits MatchPool.remaining_cents back by the reversed matched_amount_cents and zeroes Donation.matched_amount_cents"
          - "cascade A step 3: the restored remaining_cents makes an EXHAUSTED pool transition EXHAUSTED -> ACTIVE"
          - "cascade B step 1: recomputes Participant/Team/Campaign credited totals downward"
          - "cascade B step 2: every IncentiveAward of that participant in status EARNED whose tier threshold_cents > the new credited_cents transitions EARNED -> REVOKED; FULFILLED awards are left untouched"
          - "the donation's Receipt transitions ISSUED -> VOIDED"

  - entity: Donation
    initial_state: UNMATCHED
    terminal_states: [NOT_ELIGIBLE]
    note: "match dimension of the Donation parallel state machine; the same row carries payment_status and match_status independently"
    transitions:
      - from: UNMATCHED
        to: MATCHED
        trigger: "system: calculations.match_allocation during POST /api/donations/{id}/settle"
        actor: system
        preconditions:
          - "a MatchPool of the campaign satisfies the eligibility filter of calculations.match_allocation"
          - "the computed match is >= 1 cent"
        side_effects:
          - "sets Donation.match_pool_id and Donation.matched_amount_cents"
          - "increases MatchPool.allocated_cents and decreases MatchPool.remaining_cents by matched_amount_cents"
          - "when MatchPool.remaining_cents reaches 0 the pool transitions ACTIVE -> EXHAUSTED"
      - from: UNMATCHED
        to: NOT_ELIGIBLE
        trigger: "system: calculations.match_allocation finds an empty candidate set, or settle outcome=FAILED"
        actor: system
        preconditions:
          - "no MatchPool passes the eligibility filter at settle time"
        side_effects:
          - "matched_amount_cents stays 0 and match_pool_id stays null"
      - from: MATCHED
        to: REVERSED
        trigger: "system: cascade A step 1 of POST /api/donations/{id}/refund"
        actor: system
        preconditions:
          - "donation.payment_status transitions SETTLED -> REFUNDED"
          - "donation.match_status == MATCHED"
        side_effects:
          - "returns matched_amount_cents to MatchPool.remaining_cents and sets Donation.matched_amount_cents = 0"

  - entity: MatchPool
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: match allocation drives remaining_cents to 0"
        actor: system
        preconditions:
          - "pool.remaining_cents == 0 after the allocation is persisted"
        side_effects:
          - "the pool leaves the candidate set of calculations.match_allocation"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: cascade A step 3 of POST /api/donations/{id}/refund"
        actor: system
        preconditions:
          - "pool.remaining_cents > 0 after a match reversal"
        side_effects:
          - "the pool re-enters the candidate set of calculations.match_allocation"
        note: "EXHAUSTED <-> ACTIVE is a genuine cycle driven by refund compensation."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/match-pools/{id}/close or the campaign-close cascade step 2"
        actor: CampaignManager
        preconditions:
          - "pool.status == ACTIVE"
        side_effects:
          - "the pool permanently leaves the candidate set; remaining_cents is frozen"
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /api/match-pools/{id}/close or the campaign-close cascade step 2"
        actor: CampaignManager
        preconditions:
          - "pool.status == EXHAUSTED"
        side_effects:
          - "a later refund reversal still returns cents to remaining_cents but the pool stays CLOSED"

  - entity: IncentiveAward
    initial_state: EARNED
    terminal_states: [FULFILLED, REVOKED]
    transitions:
      - from: EARNED
        to: FULFILLED
        trigger: "POST /api/incentive-awards/{id}/fulfill"
        actor: CampaignManager
        preconditions:
          - "award.status == EARNED"
          - "acting X-User-ID == campaign.organization_id of the participant's campaign"
        side_effects:
          - "sets IncentiveAward.fulfilled_at; the award becomes immune to the refund revocation cascade"
      - from: EARNED
        to: REVOKED
        trigger: "system: cascade B step 2 of POST /api/donations/{id}/refund"
        actor: system
        preconditions:
          - "award.status == EARNED"
          - "participant.credited_cents after the refund < tier.threshold_cents"
        side_effects:
          - "sets IncentiveAward.revoked_at; a later settle that re-crosses the threshold creates a NEW award rather than reviving this one"

  - entity: Receipt
    initial_state: ISSUED
    terminal_states: []
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /api/receipts/{id}/void or the refund cascade"
        actor: CampaignManager
        preconditions:
          - "receipt.status == ISSUED"
        side_effects:
          - "sets Receipt.voided_at; the receipt is excluded from GET /api/campaigns/{id}/report deductible totals"
      - from: VOIDED
        to: ISSUED
        trigger: "POST /api/receipts/{id}/reissue"
        actor: CampaignManager
        preconditions:
          - "receipt.status == VOIDED"
          - "donation.payment_status == SETTLED"
        side_effects:
          - "increments Receipt.reissue_count by 1, refreshes issued_at, clears voided_at, and keeps the original receipt_number"
        note: "ISSUED -> VOIDED -> ISSUED is a genuine cycle; receipt_number never changes across reissues."

  - entity: Payout
    initial_state: REQUESTED
    terminal_states: [REJECTED, VOIDED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /api/payouts/{id}/review"
        actor: FinanceReviewer
        preconditions:
          - "payout.status == REQUESTED"
        side_effects:
          - "sets Payout.reviewed_by_user_id to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /api/payouts/{id}/request-changes"
        actor: FinanceReviewer
        preconditions:
          - "payout.status == UNDER_REVIEW"
        side_effects:
          - "the payout amount stays inside Campaign.reserved_payout_cents"
      - from: CHANGES_REQUESTED
        to: REQUESTED
        trigger: "POST /api/payouts/{id}/resubmit"
        actor: CampaignManager
        preconditions:
          - "payout.status == CHANGES_REQUESTED"
          - "acting X-User-ID == campaign.organization_id"
          - "the resubmitted amount_cents keeps campaign.available_balance_cents >= 0 after re-reservation"
        side_effects:
          - "replaces Payout.amount_cents with the resubmitted amount, sets requested_by_user_id to the acting X-User-ID, clears reviewed_by_user_id"
          - "recomputes Campaign.reserved_payout_cents and Campaign.available_balance_cents"
        note: "CHANGES_REQUESTED -> REQUESTED -> UNDER_REVIEW -> CHANGES_REQUESTED is the payout revision cycle."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/payouts/{id}/approve"
        actor: FinanceReviewer
        preconditions:
          - "payout.status == UNDER_REVIEW"
          - "acting X-User-ID != payout.reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "sets Payout.approved_by_user_id to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /api/payouts/{id}/reject"
        actor: FinanceReviewer
        preconditions:
          - "payout.status == UNDER_REVIEW"
        side_effects:
          - "releases the reservation: Campaign.reserved_payout_cents decreases by amount_cents and available_balance_cents increases by the same"
      - from: APPROVED
        to: RELEASED
        trigger: "POST /api/payouts/{id}/release"
        actor: PlatformAdmin
        preconditions:
          - "payout.status == APPROVED"
          - "organization.payout_account_status == VERIFIED"
        side_effects:
          - "sets Payout.released_at"
          - "moves the amount from Campaign.reserved_payout_cents into Campaign.paid_out_cents; available_balance_cents is unchanged"
      - from: RELEASED
        to: VOIDED
        trigger: "POST /api/payouts/{id}/void"
        actor: PlatformAdmin
        preconditions:
          - "payout.status == RELEASED"
        side_effects:
          - "compensating action: Campaign.paid_out_cents decreases by amount_cents and Campaign.available_balance_cents increases by the same, restoring the conservation identity"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system: POST /api/campaigns/{id}/payouts creates a replacement request"
        actor: system
        preconditions:
          - "an existing payout of the campaign is in status REQUESTED when a new payout is created"
        side_effects:
          - "releases the superseded payout's reservation from Campaign.reserved_payout_cents"
      - from: CHANGES_REQUESTED
        to: SUPERSEDED
        trigger: "system: POST /api/campaigns/{id}/payouts creates a replacement request"
        actor: system
        preconditions:
          - "an existing payout of the campaign is in status CHANGES_REQUESTED when a new payout is created"
        side_effects:
          - "releases the superseded payout's reservation from Campaign.reserved_payout_cents"

concurrency_rules:
  - rule_id: payout-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /api/campaigns/{id}/payouts"
    occ_field: "expected_campaign_version"
    description: |
      Creating a Payout against a Campaign whose version has advanced since the
      client last observed it is rejected. A new payout request legitimately
      supersedes any prior REQUESTED or CHANGES_REQUESTED payout of the same
      campaign, so the request cannot be rejected by a state precondition; the
      stale-version check is what protects the requester from disbursing against
      a balance that has since moved (a settle, refund, release or void bumped
      Campaign.version).
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

calculations:
  - name: donation_fee_and_net
    trigger: "on POST /api/donations (fee_cents, net_cents and charged_amount_cents are stamped at creation and never recomputed afterwards)"
    algorithm: tiered_pricing
    formula: |
      # Component-wise rounding, in this exact order. Each component is rounded
      # to whole cents BEFORE any addition; the sum is never re-rounded.
      platform_component_cents   = round_half_up(amount_cents * PLATFORM_FEE_PCT)
      processing_component_cents = round_half_up(amount_cents * PROCESSING_FEE_PCT)
      fee_cents = platform_component_cents + processing_component_cents + PROCESSING_FEE_FIXED_CENTS
      if cover_fees == false:
          net_cents = amount_cents - fee_cents
      else:
          net_cents = amount_cents
      # Campaign-level fee reporting uses the SAME per-donation rounded values:
      # campaign_fee_total_cents = SUM over donations of donation.fee_cents
      # (round-per-line then sum). Summing raw amounts first and rounding the
      # aggregate once is explicitly NOT the pinned order.
    input_set: "the single Donation being created; campaign-level fee totals sum fee_cents over Donations with payment_status IN {SETTLED, REFUNDED}"
    constants:
      PLATFORM_FEE_PCT: 0.05
      PROCESSING_FEE_PCT: 0.029
      PROCESSING_FEE_FIXED_CENTS: 30
    precision: "whole cents, round_half_up, applied independently to each fee component before summation"

  - name: donation_charged_amount
    trigger: "on POST /api/donations, evaluated strictly AFTER donation_fee_and_net"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency, pinned to a single non-iterative pass:
      # the fee is a function of amount_cents ONLY. The system does NOT
      # re-derive the fee from charged_amount_cents, and does NOT iterate to a
      # fixed point, even though the donor is charged more than amount_cents.
      if cover_fees == true:
          charged_amount_cents = amount_cents + fee_cents      # fee_cents from donation_fee_and_net(amount_cents)
      else:
          charged_amount_cents = amount_cents
      # Evaluation order (pinned): fee_cents -> net_cents -> charged_amount_cents.
    input_set: "the single Donation being created"
    constants:
      GROSS_UP_PASSES: 1
    precision: "whole cents; no rounding occurs in this step because both operands are already whole cents"

  - name: match_allocation
    trigger: "on POST /api/donations/{id}/settle with outcome=SETTLED, immediately after settled_at is stamped"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter — candidate MatchPools of donation.campaign_id:
      #       pool.status == ACTIVE
      #       AND pool.starts_at <= now  AND now <  pool.ends_at        (half-open window)
      #       AND pool.remaining_cents > 0
      #       AND donation.amount_cents >= pool.min_donation_cents      (>= comparison)
      # (b) ranking expression: ends_at ASC (soonest-expiring pool drains first)
      # (c) tie-break when ends_at ties: pool.created_at ASC
      # (d) empty candidate set -> matched_amount_cents = 0, match_pool_id = null,
      #     match_status = NOT_ELIGIBLE (no error is raised)
      pool = first(candidates sorted by (ends_at ASC, created_at ASC))
      raw_match_cents = round_half_up(donation.amount_cents * pool.match_ratio)
      matched_amount_cents = min(raw_match_cents,
                                 pool.per_donation_cap_cents,
                                 pool.remaining_cents)
      if matched_amount_cents >= 1:
          donation.match_pool_id = pool.id
          donation.match_status  = MATCHED
          pool.allocated_cents  += matched_amount_cents
          pool.remaining_cents   = pool.pool_amount_cents - pool.allocated_cents
          if pool.remaining_cents == 0: pool.status = EXHAUSTED
      else:
          donation.match_status = NOT_ELIGIBLE
      # Exactly ONE pool may match a donation; the allocation never spills over
      # into a second pool even when the first pool caps the match.
    input_set: "MatchPools of the donation's campaign with status == ACTIVE and a window covering the current logical-clock instant"
    constants:
      MIN_APPLIED_MATCH_CENTS: 1
    precision: "whole cents, round_half_up on the ratio product before the three-way min"

  - name: participant_credit
    trigger: "recomputed on Donation settle, Donation refund, and on every GET that returns a Participant"
    algorithm: aggregation
    formula: |
      # Base (FINAL) variant:
      credited_cents = SUM over Donations d where
                         d.designation_type == PARTICIPANT
                         AND d.designation_id == participant.id
                         AND d.payment_status == SETTLED
                       of (d.amount_cents + d.matched_amount_cents)
      minimum_met = credited_cents >= campaign.fundraising_minimum_cents
    input_set: "PARTICIPANT-designated donations only; TEAM- and CAMPAIGN-designated gifts never credit an individual"
    constants:
      MIN_CREDIT_CENTS: 0
    precision: "whole cents; no rounding (all inputs are whole cents)"
    variants:
      - name: FINAL
        when: "written to Participant.credited_cents; the only variant that gates incentive awards and the fundraising minimum"
        difference: "includes only payment_status == SETTLED donations and uses the ACTUAL matched_amount_cents already allocated"
      - name: PROVISIONAL
        when: "written to Participant.projected_cents; shown on the personal page as the optimistic pipeline figure"
        difference: |
          includes payment_status IN {PENDING, SETTLED}. For PENDING donations the
          match has not run, so it adds a PROJECTED match computed as
          min(round_half_up(d.amount_cents * pool.match_ratio), pool.per_donation_cap_cents, pool.remaining_cents)
          against the pool that match_allocation would select right now, or 0 when
          the candidate set is empty. Identical data therefore yields
          projected_cents > credited_cents whenever a PENDING donation exists.

  - name: team_leaderboard_score
    trigger: "on GET /api/campaigns/{id}/leaderboard with scope=TEAM, and whenever Team.credited_cents is read"
    algorithm: weighted_scoring
    formula: |
      team.credited_cents =
          SUM over Participants p where p.team_id == team.id
              of p.credited_cents                       # FINAL participant credit
        + SUM over Donations d where d.designation_type == TEAM
              AND d.designation_id == team.id
              AND d.payment_status == SETTLED
              of (d.amount_cents + d.matched_amount_cents)
      goal_percent_bp = floor(team.credited_cents * 10000 / team.goal_amount_cents)   # basis points
    input_set: "Teams of the campaign with status == ACTIVE; DISBANDED teams are excluded from the leaderboard"
    constants:
      BASIS_POINTS_SCALE: 10000
    precision: "credited_cents in whole cents; goal_percent_bp is an integer basis-point value, floored"
    variants:
      - name: RAW_TOTAL
        when: "the default leaderboard variant, and the only variant used by the public campaign page"
        difference: "orders teams by credited_cents DESC, tie-break created_at ASC; goal size is ignored"
      - name: GOAL_PERCENT
        when: "variant=GOAL_PERCENT is passed to GET /api/campaigns/{id}/leaderboard; used to award the 'closest to goal' challenge"
        difference: "orders teams by goal_percent_bp DESC, tie-break created_at ASC; a small team with a small goal can outrank a larger team, so the two variants can produce opposite orderings on identical data"

  - name: campaign_thermometer
    trigger: "on GET /api/campaigns/{id}/thermometer and after every donation settle or refund"
    algorithm: aggregation
    formula: |
      raised_credited_cents = SUM over Donations d of campaign where
                                d.payment_status == SETTLED
                              of (d.amount_cents + d.matched_amount_cents)
      donor_count      = COUNT DISTINCT d.donor_id over the same set
      participant_count = COUNT of Participants of the campaign with status IN {PENDING, ACTIVE}
      # Empty-set rule: with zero SETTLED donations the response is
      # raised_credited_cents = 0, donor_count = 0, percent_bp = 0 — never null and
      # never a division error. goal_amount_cents is guaranteed >= 1 by validation.
      percent_bp = floor(raised_credited_cents * 10000 / campaign.goal_amount_cents)
      percent_bp_capped = min(percent_bp, 20000)
    input_set: "all Donations of the campaign regardless of designation_type, restricted to payment_status == SETTLED"
    constants:
      BASIS_POINTS_SCALE: 10000
      PERCENT_BP_DISPLAY_CAP: 20000
    precision: "whole cents; percent_bp floored to an integer basis-point value"

  - name: registration_fee_charged
    trigger: "on POST /api/registrations, stamped once at creation"
    algorithm: threshold
    formula: |
      if current_clock_instant < event.early_bird_ends_at:      # STRICT less-than
          discount_cents      = round_half_up(event.registration_fee_cents * EARLY_BIRD_DISCOUNT_PCT)
          fee_charged_cents   = event.registration_fee_cents - discount_cents
      else:
          fee_charged_cents   = event.registration_fee_cents
      # At exactly early_bird_ends_at the discount does NOT apply.
    input_set: "the single Event referenced by the registration"
    constants:
      EARLY_BIRD_DISCOUNT_PCT: 0.20
    precision: "whole cents, round_half_up on the discount before subtraction"

  - name: campaign_available_balance
    trigger: "recomputed after donation settle, donation refund, and every Payout transition"
    algorithm: chronological
    formula: |
      lifetime_net_cents    = SUM over Donations d of campaign where d.payment_status == SETTLED
                                of (d.net_cents + d.matched_amount_cents)
      reserved_payout_cents = SUM over Payouts p of campaign where
                                p.status IN {REQUESTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED}
                                of p.amount_cents
      paid_out_cents        = SUM over Payouts p of campaign where p.status == RELEASED
                                of p.amount_cents
      available_balance_cents = lifetime_net_cents - reserved_payout_cents - paid_out_cents
      # CONSERVATION INVARIANT (must hold after every mutation, including the
      # release -> void compensating pair):
      #   available_balance_cents + reserved_payout_cents + paid_out_cents
      #     == lifetime_net_cents
    input_set: "SETTLED donations only (REFUNDED and FAILED donations leave the sum entirely); Payouts in REJECTED, VOIDED and SUPERSEDED contribute nothing"
    constants:
      MIN_PAYOUT_CENTS: 5000
    precision: "whole cents; no rounding"

  - name: receipt_issue
    trigger: "system, as a side effect of POST /api/donations/{id}/settle with outcome=SETTLED"
    algorithm: projection
    formula: |
      campaign.receipt_seq = campaign.receipt_seq + 1
      receipt_number       = "RCPT-" + zero_pad(campaign.receipt_seq, 6)     # e.g. RCPT-000001
      deductible_amount_cents = max(donation.amount_cents - donation.benefit_value_cents, 0)
      tax_year             = UTC calendar year of donation.settled_at
      status               = ISSUED
      # The sequence is per-campaign and assigned in settle order (each settle
      # increments the counter by exactly 1); it is never re-used, never
      # re-assigned on reissue, and never derived from any id.
    input_set: "the single Donation being settled and its Campaign's receipt_seq counter"
    constants:
      RECEIPT_NUMBER_PAD_WIDTH: 6
    precision: "whole cents; deductible amount floored at 0"

  - name: campaign_report
    trigger: "on GET /api/campaigns/{id}/report"
    algorithm: aggregation
    formula: |
      settled_donation_count   = COUNT of Donations with payment_status == SETTLED
      refunded_donation_count  = COUNT of Donations with payment_status == REFUNDED
      gross_amount_cents       = SUM of amount_cents over SETTLED donations
      fee_total_cents          = SUM of fee_cents over Donations with payment_status IN {SETTLED, REFUNDED}
      match_total_cents        = SUM of matched_amount_cents over SETTLED donations
      deductible_total_cents   = SUM of deductible_amount_cents over Receipts of the campaign with status == ISSUED
      confirmed_registrations  = COUNT of Registrations of the campaign's Events with status IN {CONFIRMED, CHECKED_IN}
      checked_in_registrations = COUNT of Registrations of the campaign's Events with status == CHECKED_IN
      awards_earned_count      = COUNT of IncentiveAwards of the campaign's Participants with status IN {EARNED, FULFILLED}
    input_set: "every Donation, Receipt, Registration and IncentiveAward reachable from the campaign, filtered by the status sets above"
    constants:
      REPORT_ROW_LIMIT: 1000
    precision: "whole cents and integer counts; no rounding"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles (Anonymous is supplied explicitly as X-User-Role: Anonymous with any X-User-ID)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list, and for entity_backed roles the X-User-ID owns the target resource (Participant acts on own participant/registration, Donor on own donation, CampaignManager on campaigns of its own organization)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body is well-formed: required fields present, types correct, enum members valid, integer ranges honored (amount_cents >= 100, goal_amount_cents >= 1, capacity >= 1, match_ratio > 0 and <= 5, ends_at > starts_at, limit within 1..100, offset >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every path-segment resource exists, validated left to right"
    error_id: ERR_CAMPAIGN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a templated path segment (each resource type raises its own ERR_*_NOT_FOUND)"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (organization_id, campaign_id, event_id, team_id, participant_id, donor_id, recruited_by_participant_id, captain_participant_id, tier_id)"
    error_id: ERR_ORGANIZATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /api/campaigns, POST /api/events, POST /api/teams, POST /api/participants, POST /api/registrations, POST /api/donations, POST /api/match-pools, POST /api/incentive-tiers"

  - priority: 6
    category: state
    check: "the target resource is in a state that admits the requested transition (campaign PUBLISHED for donation/participant/team/event/registration creation is checked at priority 10; this rule covers the transition's own from-state, e.g. donation.payment_status == SETTLED for refund, payout.status == UNDER_REVIEW for approve, receipt.status == VOIDED for reissue)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST action endpoints under /api/campaigns/{id}, /api/participants/{id}, /api/registrations/{id}, /api/teams/{id}, /api/match-pools/{id}, /api/incentive-awards/{id}, /api/receipts/{id}, /api/payouts/{id}"

  - priority: 6
    category: state
    check: "a donation may only be refunded from payment_status == SETTLED; PENDING, FAILED and already-REFUNDED donations are rejected before any window arithmetic runs"
    error_id: ERR_DONATION_NOT_REFUNDABLE
    http_status: 409
    applies_to: "POST /api/donations/{id}/refund"

  - priority: 7
    category: business_referential
    check: "polymorphic and cross-aggregate references resolve inside the same campaign: donation.designation_id resolves to a row of the type named by designation_type AND belongs to donation.campaign_id; registration.event_id belongs to the same campaign as registration.participant_id; participant.team_id belongs to participant.campaign_id"
    error_id: ERR_DESIGNATION_UNRESOLVABLE
    http_status: 422
    applies_to: "POST /api/donations, POST /api/registrations, POST /api/participants, POST /api/teams"

  - priority: 7
    category: business_referential
    check: "the event named by a registration belongs to the same campaign as the participant"
    error_id: ERR_EVENT_CAMPAIGN_MISMATCH
    http_status: 422
    applies_to: "POST /api/registrations"

  - priority: 7
    category: business_referential
    check: "a participant's team_id (and a team's captain_participant_id) belongs to the same campaign as the participant"
    error_id: ERR_TEAM_CAMPAIGN_MISMATCH
    http_status: 422
    applies_to: "POST /api/participants, POST /api/teams"

  - priority: 7
    category: business_referential
    check: "recruited_by_participant_id must not equal the participant being created and must belong to the same campaign"
    error_id: ERR_SELF_RECRUIT
    http_status: 422
    applies_to: "POST /api/participants"

  - priority: 8
    category: business_safety
    check: "the FinanceReviewer approving a payout must not be the FinanceReviewer who moved it into UNDER_REVIEW (X-User-ID != payout.reviewed_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/payouts/{id}/approve"

  - priority: 9
    category: business_temporal
    check: "a refund is only accepted while the current logical-clock instant is at or before donation.settled_at + 60 days (REFUND_WINDOW_DAYS); the boundary instant itself is still refundable"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/donations/{id}/refund"

  - priority: 9
    category: business_temporal
    check: "a new MatchPool window [starts_at, ends_at) must not overlap any existing MatchPool window of the same campaign whose status IN {ACTIVE, EXHAUSTED}; half-open semantics mean a pool starting exactly at another pool's ends_at is accepted"
    error_id: ERR_MATCH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/match-pools"

  - priority: 9
    category: business_temporal
    check: "a participant must not hold two registrations in status IN {RESERVED, CONFIRMED, CHECKED_IN} whose events' buffered windows [starts_at - 90 minutes, ends_at + 90 minutes] intersect; both endpoints are CLOSED, so windows that merely touch are a conflict"
    error_id: ERR_REGISTRATION_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /api/registrations"

  - priority: 10
    category: business_constraint
    check: "the campaign of the resource being created is in status PUBLISHED"
    error_id: ERR_CAMPAIGN_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /api/donations, POST /api/participants, POST /api/teams, POST /api/events, POST /api/registrations, POST /api/match-pools, POST /api/incentive-tiers"

  - priority: 10
    category: business_constraint
    check: "a participant must be in status ACTIVE before a registration of theirs can be confirmed or checked in"
    error_id: ERR_PARTICIPANT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/registrations/{id}/confirm, POST /api/registrations/{id}/check-in"

  - priority: 11
    category: business_constraint
    check: "a participant may hold at most one registration in status IN {RESERVED, CONFIRMED, CHECKED_IN} per event"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /api/registrations"

  - priority: 12
    category: business_constraint
    check: "the event's registered_count is strictly below capacity before the new registration is persisted"
    error_id: ERR_EVENT_AT_CAPACITY
    http_status: 422
    applies_to: "POST /api/registrations"

  - priority: 13
    category: business_fiscal
    check: "registration confirmation requires minimum_waived == true OR participant.credited_cents >= campaign.fundraising_minimum_cents (>= comparison: exactly meeting the minimum passes)"
    error_id: ERR_FUNDRAISING_MINIMUM_NOT_MET
    http_status: 422
    applies_to: "POST /api/registrations/{id}/confirm"

  - priority: 13
    category: business_fiscal
    check: "the requested payout amount_cents is at least MIN_PAYOUT_CENTS (5000)"
    error_id: ERR_PAYOUT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /api/campaigns/{id}/payouts, POST /api/payouts/{id}/resubmit"

  - priority: 14
    category: business_fiscal
    check: "the campaign has enough uncommitted funds: for a payout, amount_cents <= campaign.available_balance_cents (after releasing any superseded reservation); for a refund, campaign.available_balance_cents >= donation.net_cents + donation.matched_amount_cents"
    error_id: ERR_INSUFFICIENT_CAMPAIGN_BALANCE
    http_status: 422
    applies_to: "POST /api/campaigns/{id}/payouts, POST /api/payouts/{id}/resubmit, POST /api/donations/{id}/refund"

  - priority: 15
    category: business_constraint
    check: "the beneficiary organization's payout_account_status is VERIFIED before funds may leave the platform"
    error_id: ERR_ORGANIZATION_PAYOUT_UNVERIFIED
    http_status: 409
    applies_to: "POST /api/payouts/{id}/release"

  - priority: 16
    category: state
    check: "expected_campaign_version equals the campaign's current version (optimistic concurrency on the payout-create path)"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /api/campaigns/{id}/payouts"

endpoints:
  # ---- Organization -------------------------------------------------------
  - method: POST
    path: "/api/organizations"
    description: "Register a beneficiary nonprofit. The returned id is the X-User-ID a CampaignManager acts under."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "ein", "contact_email"]
    output: Organization
    side_effects: ["payout_account_status initialised to UNVERIFIED"]
  - method: GET
    path: "/api/organizations/{id}"
    description: "Read one organization."
    roles: [PlatformAdmin, CampaignManager, FinanceReviewer]
    code: 200
    input: []
    output: Organization
    side_effects: []
  - method: POST
    path: "/api/organizations/{id}/payout-account"
    description: "Set the organization's payout account status; VERIFIED unlocks payout release, SUSPENDED blocks it again."
    roles: [PlatformAdmin]
    code: 200
    input: ["status"]
    output: Organization
    side_effects: ["sets Organization.payout_account_status to the supplied value (VERIFIED or SUSPENDED)"]

  # ---- Campaign -----------------------------------------------------------
  - method: POST
    path: "/api/campaigns"
    description: "Create a campaign in DRAFT for the acting organization."
    roles: [CampaignManager]
    code: 201
    input: ["organization_id", "title", "goal_amount_cents", "fundraising_minimum_cents?"]
    output: Campaign
    side_effects: ["status initialised to DRAFT; all computed money fields initialised to 0; receipt_seq initialised to 0"]
  - method: GET
    path: "/api/campaigns/{id}"
    description: "Read one campaign including its recomputed money fields."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["recomputes raised_credited_cents, lifetime_net_cents, reserved_payout_cents, paid_out_cents and available_balance_cents before responding"]
  - method: GET
    path: "/api/campaigns"
    description: "List campaigns, optionally filtered by organization or status."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["organization_id?", "status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: POST
    path: "/api/campaigns/{id}/publish"
    description: "Move the campaign DRAFT -> PUBLISHED."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["sets published_at", "opens donation/participant/team/event/registration creation"]
  - method: POST
    path: "/api/campaigns/{id}/close"
    description: "Move the campaign PUBLISHED -> CLOSED and cascade to its events and match pools."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "sets closed_at"
      - "cascade step 1: Events of the campaign in {OPEN, FULL} become CLOSED"
      - "cascade step 2: MatchPools of the campaign in {ACTIVE, EXHAUSTED} become CLOSED"
  - method: GET
    path: "/api/campaigns/{id}/thermometer"
    description: "Public thermometer: credited total, distinct donor count, participant count and floored basis-point progress."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: "{ goal_amount_cents: integer, raised_credited_cents: integer, percent_bp: integer, donor_count: integer, participant_count: integer }"
    side_effects: ["runs calculations.campaign_thermometer"]
  - method: GET
    path: "/api/campaigns/{id}/leaderboard"
    description: "Ranked leaderboard for scope=TEAM or scope=PARTICIPANT under the RAW_TOTAL (default) or GOAL_PERCENT variant."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["scope", "variant?", "limit?", "offset?"]
    output: "{ scope: string, variant: string, rows: object[] }"
    side_effects: ["runs calculations.team_leaderboard_score (scope=TEAM) or calculations.participant_credit (scope=PARTICIPANT)"]
  - method: GET
    path: "/api/campaigns/{id}/report"
    description: "Operational rollup across donations, fees, matches, receipts, registrations and incentive awards."
    roles: [PlatformAdmin, CampaignManager, FinanceReviewer]
    code: 200
    input: []
    output: "{ settled_donation_count: integer, refunded_donation_count: integer, gross_amount_cents: integer, fee_total_cents: integer, match_total_cents: integer, deductible_total_cents: integer, confirmed_registrations: integer, checked_in_registrations: integer, awards_earned_count: integer }"
    side_effects: ["runs calculations.campaign_report"]
  - method: POST
    path: "/api/campaigns/{id}/payouts"
    description: "Request a disbursement. Supersedes any existing REQUESTED or CHANGES_REQUESTED payout of the campaign; guarded by optimistic concurrency on Campaign.version."
    roles: [CampaignManager]
    code: 201
    input: ["amount_cents", "expected_campaign_version", "note?"]
    output: Payout
    side_effects:
      - "increments Campaign.version by 1"
      - "any existing Payout of the campaign in {REQUESTED, CHANGES_REQUESTED} transitions to SUPERSEDED and its reservation is released"
      - "recomputes Campaign.reserved_payout_cents and Campaign.available_balance_cents"
      - "sets Payout.requested_by_user_id to the acting X-User-ID"

  # ---- Event --------------------------------------------------------------
  - method: POST
    path: "/api/events"
    description: "Create a walk/run event under a PUBLISHED campaign."
    roles: [CampaignManager]
    code: 201
    input: ["campaign_id", "name", "starts_at", "ends_at", "early_bird_ends_at", "registration_fee_cents", "capacity"]
    output: Event
    side_effects: ["status initialised to OPEN; registered_count initialised to 0"]
  - method: GET
    path: "/api/events/{id}"
    description: "Read one event."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: Event
    side_effects: ["re-derives registered_count and the OPEN/FULL status before responding"]
  - method: GET
    path: "/api/events"
    description: "List events, optionally filtered by campaign or status."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: Event[]
    side_effects: []

  # ---- Team ---------------------------------------------------------------
  - method: POST
    path: "/api/teams"
    description: "Create a fundraising team inside a PUBLISHED campaign."
    roles: [CampaignManager, Participant]
    code: 201
    input: ["campaign_id", "name", "goal_amount_cents", "captain_participant_id?"]
    output: Team
    side_effects: ["status initialised to ACTIVE; credited_cents and member_count initialised to 0"]
  - method: GET
    path: "/api/teams/{id}"
    description: "Read one team with its recomputed credited total."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: Team
    side_effects: ["runs calculations.team_leaderboard_score for this team"]
  - method: GET
    path: "/api/teams"
    description: "List teams, optionally filtered by campaign, status or captain."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["campaign_id?", "captain_participant_id?", "status?", "limit?", "offset?"]
    output: Team[]
    side_effects: []
  - method: POST
    path: "/api/teams/{id}/disband"
    description: "Disband a team; members are detached and the team leaves the leaderboard."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Team
    side_effects:
      - "every Participant with team_id == this team has team_id set to null"
      - "member_count becomes 0 and credited_cents is recomputed from TEAM-designated donations only"

  # ---- Participant --------------------------------------------------------
  - method: POST
    path: "/api/participants"
    description: "Create a personal fundraising page inside a PUBLISHED campaign. The returned id is the X-User-ID the Participant role acts under."
    roles: [Anonymous, CampaignManager]
    code: 201
    input: ["campaign_id", "display_name", "team_id?", "recruited_by_participant_id?", "personal_goal_cents?"]
    output: Participant
    side_effects: ["status initialised to PENDING", "increments Team.member_count when team_id is supplied", "increments recruiter's recruit_count when recruited_by_participant_id is supplied"]
  - method: GET
    path: "/api/participants/{id}"
    description: "Read one participant page with both credit variants."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: Participant
    side_effects: ["runs calculations.participant_credit for both the FINAL and PROVISIONAL variants and refreshes minimum_met"]
  - method: GET
    path: "/api/participants"
    description: "List participants, optionally filtered by campaign, team, recruiter or status."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["campaign_id?", "team_id?", "recruited_by_participant_id?", "status?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: POST
    path: "/api/participants/{id}/activate"
    description: "Move the participant PENDING -> ACTIVE."
    roles: [Participant, CampaignManager]
    code: 200
    input: []
    output: Participant
    side_effects: ["registrations of this participant become confirmable"]
  - method: POST
    path: "/api/participants/{id}/withdraw"
    description: "Withdraw the participant and cascade-cancel their open registrations."
    roles: [Participant, CampaignManager]
    code: 200
    input: []
    output: Participant
    side_effects:
      - "cascade step 1: Registrations of this participant in {RESERVED, CONFIRMED} become CANCELLED"
      - "cascade step 2: each cancelled registration decrements Event.registered_count by 1"
      - "cascade step 3: each event whose status was FULL and whose registered_count now falls below capacity becomes OPEN"
      - "decrements Team.member_count when team_id is set"

  # ---- Registration -------------------------------------------------------
  - method: POST
    path: "/api/registrations"
    description: "Reserve an event slot for a participant; the fee is stamped by calculations.registration_fee_charged."
    roles: [Participant, CampaignManager]
    code: 201
    input: ["participant_id", "event_id", "minimum_waived?"]
    output: Registration
    side_effects:
      - "status initialised to RESERVED"
      - "stamps fee_charged_cents via calculations.registration_fee_charged"
      - "increments Event.registered_count by 1 and flips the event OPEN -> FULL when the count reaches capacity"
  - method: GET
    path: "/api/registrations/{id}"
    description: "Read one registration."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/api/registrations"
    description: "List registrations, optionally filtered by participant, event or status."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["participant_id?", "event_id?", "status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/api/registrations/{id}/confirm"
    description: "Move the registration RESERVED -> CONFIRMED; enforces the fundraising minimum unless waived."
    roles: [Participant, CampaignManager]
    code: 200
    input: []
    output: Registration
    side_effects: ["sets confirmed_at"]
  - method: POST
    path: "/api/registrations/{id}/cancel"
    description: "Cancel a RESERVED or CONFIRMED registration."
    roles: [Participant, CampaignManager]
    code: 200
    input: []
    output: Registration
    side_effects: ["decrements Event.registered_count by 1", "flips the event FULL -> OPEN when the count falls below capacity"]
  - method: POST
    path: "/api/registrations/{id}/check-in"
    description: "Record race-day attendance; only valid at or after the event start."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Registration
    side_effects: ["registration counts toward checked_in_registrations in the campaign report"]
  - method: POST
    path: "/api/registrations/{id}/no-show"
    description: "Mark a confirmed registration as a no-show after the event ends."
    roles: [CampaignManager]
    code: 200
    input: []
    output: Registration
    side_effects: ["decrements Event.registered_count by 1", "flips the event FULL -> OPEN when the count falls below capacity"]

  # ---- Donor / Donation ---------------------------------------------------
  - method: POST
    path: "/api/donors"
    description: "Register a donor. The returned id is the X-User-ID the Donor role acts under."
    roles: [Anonymous, PlatformAdmin, CampaignManager]
    code: 201
    input: ["display_name", "email", "is_anonymous?"]
    output: Donor
    side_effects: []
  - method: GET
    path: "/api/donors/{id}"
    description: "Read one donor."
    roles: [PlatformAdmin, CampaignManager, Donor]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: POST
    path: "/api/donations"
    description: "Make a gift designated to the campaign, a team or a participant. Fees, net and charged amount are stamped at creation."
    roles: [Donor, PlatformAdmin]
    code: 201
    input: ["campaign_id", "donor_id", "designation_type", "designation_id", "amount_cents", "cover_fees?", "benefit_value_cents?"]
    output: Donation
    side_effects:
      - "runs calculations.donation_fee_and_net then calculations.donation_charged_amount"
      - "payment_status initialised to PENDING and match_status to UNMATCHED"
      - "no credited totals move until the donation settles"
  - method: GET
    path: "/api/donations/{id}"
    description: "Read one donation."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: Donation
    side_effects: []
  - method: GET
    path: "/api/donations"
    description: "List donations, optionally filtered by campaign, donor, match pool, designation or payment status."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["campaign_id?", "donor_id?", "match_pool_id?", "designation_type?", "designation_id?", "payment_status?", "limit?", "offset?"]
    output: Donation[]
    side_effects: []
  - method: POST
    path: "/api/donations/{id}/settle"
    description: "Settle or fail a pending gift. outcome=SETTLED runs matching, credits, receipt issuance and incentive awards."
    roles: [PlatformAdmin]
    code: 200
    input: ["outcome"]
    output: Donation
    side_effects:
      - "outcome=SETTLED: stamps settled_at, runs calculations.match_allocation, recomputes Participant/Team/Campaign credited totals, issues a Receipt via calculations.receipt_issue, and creates EARNED IncentiveAwards for every newly crossed tier"
      - "outcome=FAILED: moves payment_status to FAILED and match_status to NOT_ELIGIBLE with no credit, receipt or award"
  - method: POST
    path: "/api/donations/{id}/refund"
    description: "Refund a settled gift and unwind every downstream effect."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Donation
    side_effects:
      - "cascade A: match_status MATCHED -> REVERSED, matched cents returned to MatchPool.remaining_cents, pool EXHAUSTED -> ACTIVE when cents are restored"
      - "cascade B: credited totals recomputed downward, then EARNED IncentiveAwards whose threshold is no longer met become REVOKED"
      - "the donation's Receipt transitions ISSUED -> VOIDED"

  # ---- Match pools --------------------------------------------------------
  - method: POST
    path: "/api/match-pools"
    description: "Create a sponsor matching pool with a half-open [starts_at, ends_at) window."
    roles: [CampaignManager]
    code: 201
    input: ["campaign_id", "sponsor_name", "pool_amount_cents", "match_ratio", "per_donation_cap_cents", "starts_at", "ends_at", "min_donation_cents?"]
    output: MatchPool
    side_effects: ["status initialised to ACTIVE; allocated_cents 0 and remaining_cents = pool_amount_cents"]
  - method: GET
    path: "/api/match-pools/{id}"
    description: "Read one match pool with its remaining balance."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: MatchPool
    side_effects: []
  - method: GET
    path: "/api/match-pools"
    description: "List match pools, optionally filtered by campaign or status."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: MatchPool[]
    side_effects: []
  - method: POST
    path: "/api/match-pools/{id}/close"
    description: "Close a pool so it stops matching new donations."
    roles: [CampaignManager]
    code: 200
    input: []
    output: MatchPool
    side_effects: ["pool leaves the candidate set of calculations.match_allocation"]

  # ---- Incentives ---------------------------------------------------------
  - method: POST
    path: "/api/incentive-tiers"
    description: "Define an incentive tier participants can earn."
    roles: [CampaignManager]
    code: 201
    input: ["campaign_id", "name", "threshold_cents", "reward_description"]
    output: IncentiveTier
    side_effects: ["future settles evaluate this tier for award creation"]
  - method: GET
    path: "/api/incentive-tiers/{id}"
    description: "Read one incentive tier."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: IncentiveTier
    side_effects: []
  - method: GET
    path: "/api/incentive-tiers"
    description: "List incentive tiers, optionally filtered by campaign."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["campaign_id?", "limit?", "offset?"]
    output: IncentiveTier[]
    side_effects: []
  - method: GET
    path: "/api/incentive-awards/{id}"
    description: "Read one incentive award."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: []
  - method: GET
    path: "/api/incentive-awards"
    description: "List incentive awards, optionally filtered by participant, tier or status. This is the only discovery channel for awards created by the settle cascade."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["participant_id?", "tier_id?", "status?", "limit?", "offset?"]
    output: IncentiveAward[]
    side_effects: []
  - method: POST
    path: "/api/incentive-awards/{id}/fulfill"
    description: "Mark an earned award as fulfilled; fulfilled awards survive later refunds."
    roles: [CampaignManager]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["sets fulfilled_at and makes the award immune to the refund revocation cascade"]

  # ---- Receipts -----------------------------------------------------------
  - method: GET
    path: "/api/receipts/{id}"
    description: "Read one tax receipt."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: []
    output: Receipt
    side_effects: []
  - method: GET
    path: "/api/receipts"
    description: "List receipts, optionally filtered by donation, campaign or status. This is the only discovery channel for receipts created by the settle cascade."
    roles: [Anonymous, PlatformAdmin, CampaignManager, Participant, Donor, FinanceReviewer]
    code: 200
    input: ["donation_id?", "campaign_id?", "status?", "limit?", "offset?"]
    output: Receipt[]
    side_effects: []
  - method: POST
    path: "/api/receipts/{id}/void"
    description: "Void an issued receipt (e.g. a correction request)."
    roles: [CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: Receipt
    side_effects: ["sets voided_at and removes the receipt from deductible_total_cents in the campaign report"]
  - method: POST
    path: "/api/receipts/{id}/reissue"
    description: "Re-issue a voided receipt under its original receipt_number."
    roles: [CampaignManager, PlatformAdmin]
    code: 200
    input: []
    output: Receipt
    side_effects: ["increments reissue_count, refreshes issued_at, clears voided_at, keeps receipt_number"]

  # ---- Payouts ------------------------------------------------------------
  - method: GET
    path: "/api/payouts/{id}"
    description: "Read one payout request."
    roles: [PlatformAdmin, CampaignManager, FinanceReviewer]
    code: 200
    input: []
    output: Payout
    side_effects: []
  - method: GET
    path: "/api/payouts"
    description: "List payouts, optionally filtered by campaign or status."
    roles: [PlatformAdmin, CampaignManager, FinanceReviewer]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/api/payouts/{id}/review"
    description: "Take the payout into review; records the reviewing FinanceReviewer for the segregation-of-duties check."
    roles: [FinanceReviewer]
    code: 200
    input: []
    output: Payout
    side_effects: ["sets reviewed_by_user_id to the acting X-User-ID"]
  - method: POST
    path: "/api/payouts/{id}/request-changes"
    description: "Send the payout back to the campaign manager for revision."
    roles: [FinanceReviewer]
    code: 200
    input: ["note?"]
    output: Payout
    side_effects: ["the reservation remains inside Campaign.reserved_payout_cents"]
  - method: POST
    path: "/api/payouts/{id}/resubmit"
    description: "Revise and resubmit a payout that was sent back; re-enters the review cycle."
    roles: [CampaignManager]
    code: 200
    input: ["amount_cents", "note?"]
    output: Payout
    side_effects: ["replaces amount_cents", "sets requested_by_user_id and clears reviewed_by_user_id", "recomputes Campaign.reserved_payout_cents and available_balance_cents"]
  - method: POST
    path: "/api/payouts/{id}/approve"
    description: "Approve a payout under review. The approver must differ from the reviewer."
    roles: [FinanceReviewer]
    code: 200
    input: []
    output: Payout
    side_effects: ["sets approved_by_user_id to the acting X-User-ID"]
  - method: POST
    path: "/api/payouts/{id}/reject"
    description: "Reject a payout under review and release its reservation."
    roles: [FinanceReviewer]
    code: 200
    input: ["note?"]
    output: Payout
    side_effects: ["reserved_payout_cents decreases by amount_cents and available_balance_cents increases by the same"]
  - method: POST
    path: "/api/payouts/{id}/release"
    description: "Disburse an approved payout; requires a VERIFIED organization payout account."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["sets released_at", "moves amount_cents from reserved_payout_cents into paid_out_cents; available_balance_cents is unchanged"]
  - method: POST
    path: "/api/payouts/{id}/void"
    description: "Compensating action for a released payout (bank return); restores the campaign's available balance."
    roles: [PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Payout
    side_effects: ["paid_out_cents decreases by amount_cents and available_balance_cents increases by the same, restoring the conservation identity"]

  # ---- Test-driving clock -------------------------------------------------
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-07-01T00:00:00Z (startup default) and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent window, expiry and early-bird comparisons use the new instant"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed on the endpoint, or an entity_backed actor does not own the target resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, wrong type, unknown enum member, or a numeric value outside its declared range"
  - id: ERR_ORGANIZATION_NOT_FOUND
    http: 404
    condition: "organization id in the path or body does not exist"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign id in the path or body does not exist"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "event id in the path or body does not exist"
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "team id in the path or body does not exist"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "participant id in the path or body does not exist"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "registration id in the path does not exist"
  - id: ERR_DONOR_NOT_FOUND
    http: 404
    condition: "donor id in the path or body does not exist"
  - id: ERR_DONATION_NOT_FOUND
    http: 404
    condition: "donation id in the path or body does not exist"
  - id: ERR_MATCH_POOL_NOT_FOUND
    http: 404
    condition: "match pool id in the path does not exist"
  - id: ERR_TIER_NOT_FOUND
    http: 404
    condition: "incentive tier id in the path or body does not exist"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "incentive award id in the path does not exist"
  - id: ERR_RECEIPT_NOT_FOUND
    http: 404
    condition: "receipt id in the path does not exist"
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "payout id in the path does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's current state does not admit the requested transition (campaign publish/close, participant activate/withdraw, registration confirm/cancel/check-in/no-show, team disband, pool close, award fulfill, receipt void/reissue, payout review/request-changes/resubmit/approve/reject/release/void)"
  - id: ERR_DONATION_NOT_REFUNDABLE
    http: 409
    condition: "refund attempted on a donation whose payment_status is not SETTLED (PENDING, FAILED or already REFUNDED)"
  - id: ERR_REFUND_WINDOW_EXPIRED
    http: 422
    condition: "refund attempted more than 60 days (REFUND_WINDOW_DAYS) after donation.settled_at"
  - id: ERR_CAMPAIGN_NOT_PUBLISHED
    http: 409
    condition: "a child resource is created under a campaign whose status is not PUBLISHED"
  - id: ERR_PARTICIPANT_NOT_ACTIVE
    http: 409
    condition: "registration confirm or check-in attempted while the participant is PENDING or WITHDRAWN"
  - id: ERR_DESIGNATION_UNRESOLVABLE
    http: 422
    condition: "donation.designation_id does not resolve to a row of the type named by designation_type inside donation.campaign_id"
  - id: ERR_EVENT_CAMPAIGN_MISMATCH
    http: 422
    condition: "the event named by a registration belongs to a different campaign than the participant"
  - id: ERR_TEAM_CAMPAIGN_MISMATCH
    http: 422
    condition: "a participant's team_id, or a team's captain_participant_id, belongs to a different campaign"
  - id: ERR_SELF_RECRUIT
    http: 422
    condition: "recruited_by_participant_id equals the participant being created, or names a participant of another campaign"
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "the participant already holds a registration in {RESERVED, CONFIRMED, CHECKED_IN} for the same event"
  - id: ERR_REGISTRATION_TIME_CONFLICT
    http: 409
    condition: "the participant already holds an open registration whose event's buffered window [starts_at - 90m, ends_at + 90m] intersects the new event's buffered window (closed endpoints: touching conflicts)"
  - id: ERR_EVENT_AT_CAPACITY
    http: 422
    condition: "the event's registered_count already equals capacity"
  - id: ERR_MATCH_WINDOW_OVERLAP
    http: 409
    condition: "the new match pool's half-open window [starts_at, ends_at) overlaps an existing {ACTIVE, EXHAUSTED} pool of the same campaign"
  - id: ERR_FUNDRAISING_MINIMUM_NOT_MET
    http: 422
    condition: "registration confirm attempted while participant.credited_cents < campaign.fundraising_minimum_cents and minimum_waived is false"
  - id: ERR_PAYOUT_BELOW_MINIMUM
    http: 422
    condition: "payout amount_cents is below MIN_PAYOUT_CENTS (5000)"
  - id: ERR_INSUFFICIENT_CAMPAIGN_BALANCE
    http: 422
    condition: "payout amount_cents exceeds campaign.available_balance_cents, or a refund would drive available_balance_cents negative"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FinanceReviewer approving a payout is the same X-User-ID that moved it into UNDER_REVIEW"
  - id: ERR_ORGANIZATION_PAYOUT_UNVERIFIED
    http: 409
    condition: "payout release attempted while the beneficiary organization's payout_account_status is not VERIFIED"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version does not match Campaign.version on POST /api/campaigns/{id}/payouts"

roles:
  - name: PlatformAdmin
    description: "Platform operator: onboards organizations, verifies payout accounts, settles/refunds payments, releases and voids payouts, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/organizations"
      - "POST /api/organizations/{id}/payout-account"
      - "POST /api/donations/{id}/settle"
      - "POST /api/donations/{id}/refund"
      - "POST /api/payouts/{id}/release"
      - "POST /api/payouts/{id}/void"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/donations"
      - "POST /api/donors"
      - "POST /api/receipts/{id}/void"
      - "POST /api/receipts/{id}/reissue"
      - "all GET reads"
  - name: CampaignManager
    description: "Acts on behalf of the beneficiary organization: builds and runs campaigns, events, teams, pools and incentives, and requests payouts."
    identity: "entity_backed:Organization"
    exclusive_operations:
      - "POST /api/campaigns"
      - "POST /api/campaigns/{id}/publish"
      - "POST /api/campaigns/{id}/close"
      - "POST /api/campaigns/{id}/payouts"
      - "POST /api/events"
      - "POST /api/teams/{id}/disband"
      - "POST /api/match-pools"
      - "POST /api/match-pools/{id}/close"
      - "POST /api/incentive-tiers"
      - "POST /api/incentive-awards/{id}/fulfill"
      - "POST /api/registrations/{id}/check-in"
      - "POST /api/registrations/{id}/no-show"
      - "POST /api/payouts/{id}/resubmit"
    shared_operations:
      - "POST /api/teams"
      - "POST /api/participants"
      - "POST /api/participants/{id}/activate"
      - "POST /api/participants/{id}/withdraw"
      - "POST /api/registrations"
      - "POST /api/registrations/{id}/confirm"
      - "POST /api/registrations/{id}/cancel"
      - "POST /api/donors"
      - "POST /api/receipts/{id}/void"
      - "POST /api/receipts/{id}/reissue"
      - "GET /api/campaigns/{id}/report"
  - name: FinanceReviewer
    description: "Independent finance control: reviews, sends back, approves or rejects payout requests. Segregation of duties forbids the same X-User-ID from reviewing and approving the same payout."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/payouts/{id}/review"
      - "POST /api/payouts/{id}/request-changes"
      - "POST /api/payouts/{id}/approve"
      - "POST /api/payouts/{id}/reject"
    shared_operations:
      - "GET /api/payouts"
      - "GET /api/payouts/{id}"
      - "GET /api/campaigns/{id}/report"
  - name: Participant
    description: "An individual fundraiser acting on their own page and registrations; X-User-ID equals their Participant.id."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /api/teams"
      - "POST /api/participants/{id}/activate"
      - "POST /api/participants/{id}/withdraw"
      - "POST /api/registrations"
      - "POST /api/registrations/{id}/confirm"
      - "POST /api/registrations/{id}/cancel"
      - "all public GET reads"
  - name: Donor
    description: "A giver acting on their own donations; X-User-ID equals their Donor.id."
    identity: "entity_backed:Donor"
    exclusive_operations: []
    shared_operations:
      - "POST /api/donations"
      - "GET /api/donors/{id}"
      - "all public GET reads"
  - name: Anonymous
    description: "Unauthenticated public surface: self-signup as a participant or donor and read-only access to public campaign, team, participant, leaderboard and thermometer data. X-User-Role must be sent explicitly as Anonymous."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /api/participants"
      - "POST /api/donors"
      - "all public GET reads"
