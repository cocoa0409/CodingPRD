            - call: "POST /network-participations"
              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-06-30" }
              as: NetworkAdmin
          trigger:
