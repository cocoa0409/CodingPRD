  - rule_id: priority_pair_validation_conflict
    instances:

      - name: film_not_in_market_state_check_outranks_buyer_exposure_fiscal_check_on_offer
        grounds:
          - validations[priority=52]
          - validations[priority=100]
          - "endpoints[POST /film-sales/pre-sale-contracts]"
          - errors.ERR_FILM_NOT_IN_MARKET
          - errors.ERR_BUYER_EXPOSURE_EXCEEDED
        distinguishing_aspect: |
          Pair A: category `state` at priority 52 versus category `business_fiscal` at priority 100
          on POST /film-sales/pre-sale-contracts. One request violates BOTH — the film is still
          PACKAGING and the 2000000.00 minimum guarantee is twenty times the buyer's 100000.00
          exposure limit — and the only acceptable answer is ERR_FILM_NOT_IN_MARKET (409). The
          falsifier is the control call: with the film moved to IN_MARKET and nothing else changed,
          the same body must return ERR_BUYER_EXPOSURE_EXCEEDED (422), proving the fiscal check was
          reached but suppressed, not merely absent. Distinct from Pair B in both endpoint and in the
          categories being ordered (state vs fiscal, not safety vs temporal).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; agency agreement EXECUTED and in term."
            - "Film advanced only as far as PACKAGING — deliberately NOT moved to IN_MARKET."
            - "A PUBLISHED CAST_ADJUSTED DE valuation exists (floor 1176000.00), so priority 72 is satisfied."
            - "Buyer Rhein Films is AAA/ACTIVE (so priority 62 is satisfied) but has exposure_limit_usd 100000.00."
            - "No other contract exists for (film, DE), so priority 90 is satisfied."
          setup_api_calls:
