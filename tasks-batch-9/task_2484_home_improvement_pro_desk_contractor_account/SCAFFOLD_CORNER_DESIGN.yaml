            - call: "POST /pro/pro-orders/${order_g}/reserve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "pd-1"
              captures: { resv_g: "$.data[0].id" }
            - call: "POST /pro/reservations/${resv_g}/allocate"
              payload: {}
              as: StoreOperations
            - call: "POST /pro/will-call-stagings"
              payload: { pro_order_id: "${order_g}", store_id: "${store_id}", stage_start: "2026-08-01T00:00:00Z", stage_hours: 24 }
              as: StoreOperations
              captures: { staging_g: "$.data.id" }
            - call: "POST /pro/will-call-stagings/${staging_g}/stage"
              payload: {}
              as: StoreOperations
            - call: "POST /pro/will-call-stagings/${staging_g}/pick-up"
              payload: { picked_up_by: "CREW-G" }
              as: StoreOperations
          trigger:
            - call: "POST /pro/pro-orders/${order_f}/invoice"
              payload: {}
              as: CreditManager
              as_user_id: "cm-1"
            - call: "GET /pro/credit-lines/${cl_f}"
              payload: {}
              as: CreditManager
              as_user_id: "cm-1"
              captures: { exposure_f: "$.data.exposure_cents", status_f: "$.data.status", reason_f: "$.data.frozen_reason_code" }
            - call: "POST /pro/pro-orders/${order_g}/invoice"
              payload: {}
              as: CreditManager
              as_user_id: "cm-1"
            - call: "GET /pro/credit-lines/${cl_g}"
              payload: {}
              as: CreditManager
              as_user_id: "cm-1"
              captures: { exposure_g: "$.data.exposure_cents", status_g: "$.data.status", available_g: "$.data.available_cents" }
          assert:
            - "${total_f} == 82229 and ${total_g} == 82229"
            - "${exposure_f} == 82229 and ${status_f} == FROZEN and ${reason_f} == UTILIZATION_REVIEW"
            - "ProAccount.${acct_f}.status == HOLD"
            - "${exposure_g} == 82229 and ${status_g} == ACTIVE"
            - "${available_g} == 9138"
            - "CreditLine.${cl_g}.frozen_reason_code == null and ProAccount.${acct_g}.status == ACTIVE"
            - "both orders ProOrder.credit_status == INVOICED"

      - name: cascading_side_effects_claim
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: invoice_utilization_freeze_cascades_credit_line_then_account_hold
          rationale: "The §1.8 transitive_cascade rule already asserts both three-hop chains end to end — invoice -> exposure -> credit-line freeze -> account HOLD, and staging expiry -> reservation release -> stock recompute -> order revert — with the intermediate hop values checked, not just the final state."

      - name: dual_variant_calculation_claim
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: tier_variant_divergence_pinned_vs_rolling_on_order_pricing
          rationale: "Both declared variant families are already driven to divergent money on identical stored data by §1.8: PINNED_AT_REVIEW vs ROLLING_365_INCLUSIVE tier selection, and QUOTED_TERM vs CURRENT_LIST return valuation."

  - section: consistency_model
    instances:

      - name: every_write_is_visible_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /pro/pro-orders/{pro_order_id}/submit]
          - endpoints[GET /pro/credit-lines/{credit_line_id}]
        distinguishing_aspect: "Consistency is immediate, never eventual: the submit response itself already carries the priced totals, and the very next reads — with no retry, no polling and no intervening call — show the derived credit-line exposure, the recomputed stock availability and the order-line pricing that the same transaction produced."
        test_recipe:
          setup:
            - "Store HD-101 (tax 0.0825) stocks SHINGLE-BUNDLE with on_hand 600 at 1999; MEMBER account with an ACTIVE credit line limit 100000."
            - "CREDIT_LINE will-call order of 10 units: subtotal 19990, tax 1649, total 21639."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
              captures: { stock_id: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Read Your Writes Roofing", home_store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/credit-lines"
              payload: { pro_account_id: "${acct_id}", limit_cents: 100000, terms_days: 30 }
              as: CreditManager
              as_user_id: "cm-1"
              captures: { cl_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_id}", payment_method: "CREDIT_LINE", delivery_mode: "WILL_CALL" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /pro/pro-orders/${order_id}/lines"
              payload: { sku: "SHINGLE-BUNDLE", qty_units: 10 }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { ol_id: "$.data.id" }
          trigger:
            - call: "POST /pro/pro-orders/${order_id}/submit"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { inline_total: "$.data.total_cents", inline_tax: "$.data.tax_cents", inline_tier: "$.data.tier_code_applied" }
            - call: "GET /pro/credit-lines/${cl_id}"
              payload: {}
              as: CreditManager
              as_user_id: "cm-1"
              captures: { exposure_now: "$.data.exposure_cents", available_now: "$.data.available_cents" }
            - call: "GET /pro/order-lines/${ol_id}"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${acct_id}"
              captures: { unit_now: "$.data.effective_unit_price_cents", source_now: "$.data.price_source" }
            - call: "POST /pro/pro-orders/${order_id}/reserve"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "pd-1"
              captures: { resv_id: "$.data[0].id" }
            - call: "GET /pro/store-stocks/${stock_id}"
              payload: {}
              as: ProDeskAssociate
              as_user_id: "pd-1"
              captures: { reserved_now: "$.data.reserved_units", available_units_now: "$.data.available_units" }
          assert:
            - "${inline_total} == 21639 and ${inline_tax} == 1649 and ${inline_tier} == MEMBER"
            - "${exposure_now} == 21639 and ${available_now} == 78361 on the first read after submit"
            - "${unit_now} == 1999 and ${source_now} == TIER_DISCOUNTED"
            - "${reserved_now} == 10 and ${available_units_now} == 590 on the first read after reserve"
            - "Reservation.${resv_id}.status == HELD and Reservation.${resv_id}.qty_units == 10"
            - "no call in this recipe is retried or polled; each derived value is correct on its first read"
