  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: claim_reject_resubmit_cycle
        grounds:
          - state_machines.CarbonClaim.IN_REVIEW_to_REJECTED
          - state_machines.CarbonClaim.REJECTED_to_IN_REVIEW
          - state_machines.CarbonClaim.IN_REVIEW_to_APPROVED
        distinguishing_aspect: "CarbonClaim runs a revision cycle (IN_REVIEW -> REJECTED -> IN_REVIEW -> APPROVED) rather than a linear pipeline: REJECTED is non-terminal, resubmission recomputes required_offset_kgco2e (320.0) and clears reviewed_by."
        test_recipe:
          setup:
            - "Collection RND with one RELEASED batch DL-100 (embodied 6.400); report REP-1 [2026-09-01, 2026-10-01) CRADLE_TO_GATE submitted, verified, PUBLISHED (operational 6.400, lifecycle 6.750 — no credited take-backs)."
            - "Claim CL-1: CARBON_NEUTRAL, volume 50 m2, boundary CRADLE_TO_GATE (required = 6.400 x 50 = 320.0)."
          setup_api_calls:
            - *k_clock
            - *k_col_gate_none
            - *k_lot_net200
            - *k_lot_vir200
            - *k_qc_lot1
            - *k_qc_lot2
            - *k_batch_b1
            - *k_alloc1
            - *k_alloc2
            - *k_rel_b1
            - &k_rep_gate
              call: "POST /carpetloop/pcf-reports"
              payload: { collection_id: "${col_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", boundary: "CRADLE_TO_GATE", expected_collection_version: "${col_v}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { rep1: $.data.id }
            - *k_submit1
            - *k_assign1
            - *k_clear1
            - *k_publish1
            - &k_claim_neutral
              call: "POST /carpetloop/carbon-claims"
              payload: { collection_id: "${col_id}", report_id: "${rep1}", claim_type: "CARBON_NEUTRAL", claimed_volume_m2: 50, boundary: "CRADLE_TO_GATE" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { cl1: $.data.id }
            - *k_cl_submit
          trigger:
            - &k_review_reject
              call: "POST /carpetloop/carbon-claims/${cl1}/review"
              payload: { decision: "REJECT" }
              as: ClaimsApprover
              as_user_id: "ap-erin"
            - *k_cl_submit
            - *k_review_approve
          assert:
            - "after first review: CarbonClaim.${cl1}.status == REJECTED and reviewed_by == \"ap-erin\""
            - "after resubmission: status == IN_REVIEW, reviewed_by is null, required_offset_kgco2e == 320.0 (recomputed, unchanged inputs)"
            - "after second review: status == APPROVED and reviewed_by == \"ap-erin\""
            - "the loop DRAFT -> IN_REVIEW -> REJECTED -> IN_REVIEW -> APPROVED is legal; REJECTED is not terminal"

      - name: order_match_failed_rematch_loop
        grounds:
          - state_machines.ReplacementOrder.DRAFT_to_MATCH_FAILED
          - state_machines.ReplacementOrder.MATCH_FAILED_to_MATCHED
          - calculations.dye_lot_match
          - calculations.replacement_quote
        distinguishing_aspect: "ReplacementOrder runs a rematch loop on a second entity: the first match empties the candidate pool (sole batch EXHAUSTED) -> MATCH_FAILED; releasing a new batch and re-matching the same order -> MATCHED with quote 138000 cents (other-lot factor 1.15 on 100 m2)."
        test_recipe:
          setup:
            - "Collection CIR, batch DL-100 (100 m2) RELEASED; site INSTALLED with zone Z-1 consuming all 100 m2 -> batch EXHAUSTED."
            - "Order ORD on Z-1 (new_zone_code Z-1R). First match: no RELEASED batch with available_m2 >= 100 -> MATCH_FAILED."
            - "Batch DL-102 (150 m2, delta_e 0.5) then released -> re-match ranks it (only candidate; pair delta_e |0.5-0.4| = 0.1) -> MATCHED, quote = 100 x 1200 x 1.15 = 138000, reservation 100 m2."
          setup_api_calls:
            - *k_clock
            - *k_col_grave_none
            - *k_lot_net200
            - *k_lot_vir200
            - *k_qc_lot1
            - *k_qc_lot2
            - *k_batch_b1
            - *k_alloc1
            - *k_alloc2
            - *k_rel_b1
            - *k_site1
            - *k_install1
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 100 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - &k_get_site
              call: "GET /carpetloop/sites/${site1}"
              payload: {}
              as: Specifier
              as_user_id: "spec-ada"
              captures: { site_v: $.data.version }
            - &k_ord1
              call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z1}", reason: "DAMAGE", new_zone_code: "Z-1R", expected_site_version: "${site_v}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { ord1: $.data.id }
            - &k_match1_fail
              call: "POST /carpetloop/replacement-orders/${ord1}/match"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
            - *k_lot_pct600
            - *k_lot_vir600
            - *k_qc_lot3
            - *k_qc_lot4
            - &k_batch_b102
              call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-102", production_date: "2026-09-08T00:00:00Z", produced_m2: 150, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.5 }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${lot3}/allocate"
              payload: { batch_id: "${b2}", quantity_kg: 300 }
              as: SustainabilityManager
            - call: "POST /carpetloop/feedstock-lots/${lot4}/allocate"
              payload: { batch_id: "${b2}", quantity_kg: 300 }
              as: SustainabilityManager
            - *k_rel_b2
          trigger:
            - call: "POST /carpetloop/replacement-orders/${ord1}/match"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
          assert:
            - "first match: ReplacementOrder.${ord1}.status == MATCH_FAILED with matched_batch_id null (b1 EXHAUSTED -> empty candidate pool)"
            - "second match: status == MATCHED, matched_batch_id == ${b2}, quoted_cost_cents == 138000 (100 m2 x 1200 x 1.15 other-lot factor; dye_lot_code DL-102 != DL-100)"
            - "TileBatch.${b2}.available_m2 == 50 after the reservation (150 - 100)"
            - "TileBatch.${b1}.available_m2 == 0 and status == EXHAUSTED throughout"

