        grounds:
          - validations[priority=18]
          - errors[ERR_LICENSE_NOT_CE_ELIGIBLE]
        distinguishing_aspect: "CE activities accrue only to licenses in {ACTIVE, EXPIRED, LAPSED, SUSPENDED}: a PENDING_VERIFICATION license rejects logging."
        test_recipe:
