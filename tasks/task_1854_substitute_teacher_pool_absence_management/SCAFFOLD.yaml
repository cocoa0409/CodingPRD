# =============================================================================
# Task 1854: Substitute Teacher Pool & Absence Management
# (Frontline/Kelly Education style)
# =============================================================================

scenario: |
  1854. Substitute Teacher Pool & Absence Management (Frontline/Kelly Education style): absence entry & auto-callout/assignment rules, substitute qualification, clearance & preference matching, hard-to-fill incentive & premium pay, unfilled absence coverage by internal staff & compensation, long-term assignment conversion & pay rate change, fill-rate analytics by school & day-of-week, sub performance flag & do-not-return list, timesheet & payroll integration

domain_name: substitute-teacher-pool
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation      # finite substitute pool competed for by absences; offers reserved, committed, released
  secondary_archetype: temporal windowing    # absence date intervals, offer expiry windows, coverage day capacity
  complexity_layers:
    - selector_policy                        # auto-callout picks one substitute from eligible pool: eligibility filter + ranking + tie-break + empty-pool fallback
    - dual_variant_calculation               # provisional vs final assignment pay; lifetime vs trailing reliability; sub-only vs any-coverage fill rate
    - cascading_side_effects                 # cancel/no-show/escalate cascades across Assignment -> Absence -> Substitute -> Assignment
    - optimistic_concurrency                 # OCC on Absence.version (claim/edit) and District.version (config update)
  entity_topology: flat                      # peer entities linked by foreign keys in request bodies; no nested creation paths
  state_machine_shape: branching             # fork/join with reverts dominates (OFFERED fork; UNFILLED <-> COVERED_INTERNALLY; approval re-review)
  relationship_patterns:
    - one_to_many                            # School -> StaffMember/Absence; Substitute -> Qualification/Clearance/Assignment
    - many_to_many                           # Substitute <-> School via SchoolSubstituteMark; Substitute <-> subject/grade via Qualification
    - cross_aggregate                        # Assignment references Absence + Substitute + School; Timesheet references Assignment + PayrollPeriod
  role_model: hierarchical_override          # DistrictAdmin superset; SchoolCoordinator/Teacher scoped by school/ownership; Substitute self-service; PayrollClerk narrow
  consistency_model: immediate               # every mutation + its cascades are atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District name" }
      - { name: offer_response_window_minutes, type: integer, source: input, default: 120, description: "Minutes an offer stays live before auto-expiry" }
      - { name: long_term_approval_days, type: integer, source: input, default: 5, description: "Absences with total_days strictly greater than this require district approval" }
      - { name: long_term_threshold_days, type: integer, source: input, default: 10, description: "Approved workday streak index at or beyond which long-term rate applies" }
      - { name: long_term_rate_multiplier, type: number, source: input, default: 1.15, description: "Multiplier on base_daily_rate_cents for converted days" }
      - { name: htf_high_premium_pct, type: number, source: input, default: 0.20, description: "Premium fraction for schools with hard_to_fill_tier HIGH" }
      - { name: htf_moderate_premium_pct, type: number, source: input, default: 0.10, description: "Premium fraction for hard_to_fill_tier MODERATE" }
      - { name: short_notice_hours, type: integer, source: input, default: 24, description: "Lead time strictly below this earns short-notice premium" }
      - { name: short_notice_premium_pct, type: number, source: input, default: 0.25, description: "Premium fraction for short-notice offers" }
      - { name: moderate_notice_hours, type: integer, source: input, default: 72, description: "Lead time strictly below this (and >= short threshold) earns moderate-notice premium" }
      - { name: moderate_notice_premium_pct, type: number, source: input, default: 0.10, description: "Premium fraction for moderate-notice offers" }
      - { name: premium_cap_multiplier, type: number, source: input, default: 1.50, description: "Hard cap on combined premium multiplier" }
      - { name: preference_rank_boost, type: integer, source: input, default: 10, description: "Score boost for substitutes holding an ACTIVE PREFERRED mark at the absence's school" }
      - { name: reliability_window_days, type: integer, source: input, default: 90, description: "Trailing window for trailing reliability score" }
      - { name: suspension_score_threshold, type: integer, source: input, default: 60, description: "Trailing score strictly below this (with enough completions) triggers auto-suspension" }
      - { name: suspension_min_completions, type: integer, source: input, default: 5, description: "Minimum trailing completions before auto-suspension can trigger" }
      - { name: period_comp_rate_cents, type: integer, source: input, default: 2500, description: "Per-period compensation for internal coverage" }
      - { name: daily_period_cap, type: integer, source: input, default: 8, description: "Max covered periods per staff member per calendar day" }
      - { name: weekly_period_cap, type: integer, source: input, default: 10, description: "Max covered periods per staff member per ISO week (Mon-Sun)" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; owning district" }
      - { name: name, type: string, source: input, description: "School name" }
      - { name: hard_to_fill_tier, type: enum, source: input, default: NONE, description: "NONE | MODERATE | HIGH" }
      - { name: coverage_budget_total_cents, type: integer, source: input, description: "Total substitute-coverage budget for the school" }
      - { name: coverage_budget_committed_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_pay_cents on ACCEPTED/WORKED/VERIFIED assignments + reserve invariant leg" }
      - { name: coverage_budget_spent_cents, type: integer, source: computed, default: 0, description: "Sum of capped final payouts charged at payroll export plus COMPENSATED internal coverage" }
      - { name: coverage_budget_available_cents, type: integer, source: computed, description: "coverage_budget_total_cents - committed - spent; never negative" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; employing school" }
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: subject, type: string, source: input, description: "Primary teaching subject (e.g. MATH)" }
      - { name: grade_band, type: enum, source: input, description: "ELEMENTARY | MIDDLE | HIGH" }
      - { name: is_coordinator, type: boolean, source: input, default: false, description: "True when this staff member acts as SchoolCoordinator" }

  - name: Substitute
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Substitute full name" }
      - { name: base_daily_rate_cents, type: integer, source: input, description: "Base daily pay rate before premiums" }
      - { name: status, type: enum, source: system, description: "PENDING_CLEARANCE | ACTIVE | SUSPENDED" }
      - { name: reliability_events, type: array, source: system, default: [], description: "Append-only array of {event_type, delta, occurred_at, assignment_id?}; occurred_at stamped from logical clock" }
      - { name: reliability_lifetime_score, type: integer, source: computed, default: 100, description: "clamp(100 + sum(all event deltas), 0, 100)" }
      - { name: reliability_trailing_score, type: integer, source: computed, default: 100, description: "clamp(100 + sum(deltas with occurred_at >= clock - district.reliability_window_days), 0, 100)" }
      - { name: completions_lifetime, type: integer, source: computed, default: 0, description: "Count of assignments that reached VERIFIED" }
      - { name: completions_trailing, type: integer, source: computed, default: 0, description: "Count of VERIFIED events inside trailing window" }

  - name: Qualification
    parent: null
    common_fields: false
    fields:
      - { name: substitute_id, type: string, source: input, description: "FK -> Substitute.id; qualification holder" }
      - { name: subject, type: string, source: input, description: "Subject covered (e.g. MATH)" }
      - { name: grade_band, type: enum, source: input, description: "ELEMENTARY | MIDDLE | HIGH" }

  - name: Clearance
    parent: null
    common_fields: true
    fields:
      - { name: substitute_id, type: string, source: input, description: "FK -> Substitute.id; clearance holder" }
      - { name: clearance_type, type: enum, source: input, description: "BACKGROUND_CHECK | TEACHING_CREDENTIAL | TB_TEST" }
      - { name: expires_on, type: string, source: input, description: "ISO date; clearance valid through this date inclusive" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | EXPIRED" }

  - name: SchoolSubstituteMark
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; school issuing the mark" }
      - { name: substitute_id, type: string, source: input, description: "FK -> Substitute.id; marked substitute" }
      - { name: mark_type, type: enum, source: input, description: "PREFERRED | DO_NOT_RETURN" }
      - { name: priority_rank, type: integer, source: input, default: null, description: "Optional ordering hint for PREFERRED marks (not used in ranking formula; boost is flat)" }
      - { name: reason, type: string, source: input, default: null, description: "Required when mark_type = DO_NOT_RETURN" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED" }
      - { name: source_flag_id, type: string, source: system, default: null, description: "PerformanceFlag.id that auto-created this mark; null for manual marks" }

  - name: Absence
    parent: null
    common_fields: true
    fields:
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id; absent teacher" }
      - { name: school_id, type: string, source: system, description: "FK -> School.id; denormalized from staff_member.school_id at creation" }
      - { name: start_date, type: string, source: input, description: "ISO date of first absence day" }
      - { name: end_date, type: string, source: input, description: "ISO date of last absence day (inclusive)" }
      - { name: absence_type, type: enum, source: input, description: "SICK | PERSONAL | PROFESSIONAL_DEVELOPMENT | JURY_DUTY" }
      - { name: required_subject, type: string, source: input, description: "Subject a substitute must be qualified for" }
      - { name: required_grade_band, type: enum, source: input, description: "ELEMENTARY | MIDDLE | HIGH" }
      - { name: total_days, type: integer, source: computed, description: "Count of Monday-Friday dates in [start_date, end_date]" }
      - { name: fill_status, type: enum, source: system, description: "REPORTED | DISPATCHING | ASSIGNED | COMPLETED | UNFILLED | COVERED_INTERNALLY | CLOSED | CANCELLED" }
      - { name: approval_status, type: enum, source: system, description: "NOT_REQUIRED | PENDING | APPROVED | REJECTED" }
      - { name: days_covered_internal, type: integer, source: computed, default: 0, description: "Distinct coverage_dates with InternalCoverage status in {APPROVED, WORKED, COMPENSATED}" }
      - { name: days_covered_sub, type: integer, source: computed, default: 0, description: "APPROVED timesheet days of the assignment that reached VERIFIED; 0 otherwise" }
      - { name: days_uncovered, type: integer, source: computed, description: "total_days - days_covered_internal - days_covered_sub" }

  - name: DispatchBatch
    parent: null
    common_fields: false
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; district whose absences are processed" }
      - { name: run_for_date, type: string, source: input, default: null, description: "ISO date the batch treats as 'today'; null means current logical clock date" }
      - { name: executed_at, type: datetime, source: system, description: "Logical-clock timestamp of execution" }
      - { name: absences_considered, type: integer, source: computed, description: "Absences evaluated in this batch" }
      - { name: offers_created, type: integer, source: computed, description: "New OFFERED assignments created" }
      - { name: offers_expired, type: integer, source: computed, description: "OFFERED assignments flipped to EXPIRED" }
      - { name: absences_marked_unfilled, type: integer, source: computed, description: "Absences flipped DISPATCHING -> UNFILLED" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: absence_id, type: string, source: input, description: "FK -> Absence.id; covered absence" }
      - { name: substitute_id, type: string, source: input, description: "FK -> Substitute.id; offered/assigned substitute" }
      - { name: school_id, type: string, source: system, description: "FK -> School.id; denormalized from absence.school_id at creation" }
      - { name: offer_source, type: enum, source: system, description: "AUTO_DISPATCH | MANUAL_OFFER | SELF_CLAIM" }
      - { name: offer_sequence, type: integer, source: system, description: "Per-absence monotonic sequence starting at 1" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | CANCELLED | WORKED | NO_SHOW | VERIFIED | PAID" }
      - { name: cancel_reason, type: enum, source: system, default: null, description: "SUB_CANCEL | COORDINATOR_CANCEL | DNR_CANCEL | SUSPENSION_CANCEL | ABSENCE_CANCEL" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock time the offer was created" }
      - { name: offer_expires_at, type: datetime, source: system, description: "offered_at + district.offer_response_window_minutes" }
      - { name: start_date, type: string, source: system, description: "Snapshot of absence.start_date at offer creation" }
      - { name: end_date, type: string, source: system, description: "Current covered end date; moves with absence extensions" }
      - { name: scheduled_days, type: integer, source: computed, description: "Weekday count in [start_date, end_date] at offer time; refreshed on extension" }
      - { name: premium_multiplier_snapshot, type: number, source: computed, description: "Premium multiplier frozen at offer creation" }
      - { name: provisional_pay_cents, type: integer, source: computed, description: "scheduled_days * round_half_up(base_daily_rate_cents * premium_multiplier_snapshot)" }
      - { name: worked_days_count, type: integer, source: computed, default: 0, description: "Count of APPROVED timesheets for this assignment" }
      - { name: long_term_converted, type: boolean, source: computed, default: false, description: "True once any approved timesheet has streak_index >= district.long_term_threshold_days" }
      - { name: final_payout_cents, type: integer, source: computed, default: null, description: "Set at VERIFIED: sum of per-day rounded day_pay_cents" }
      - { name: payout_capped, type: boolean, source: computed, default: false, description: "True when payroll export capped the payout against school budget" }

  - name: InternalCoverage
    parent: null
    common_fields: true
    fields:
      - { name: absence_id, type: string, source: input, description: "FK -> Absence.id; unfilled absence being covered" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id; covering internal teacher" }
      - { name: school_id, type: string, source: system, description: "Denormalized from absence.school_id at creation" }
      - { name: coverage_date, type: string, source: input, description: "ISO date covered; must be a weekday within absence range" }
      - { name: periods, type: integer, source: input, description: "Periods covered this date (1..district.daily_period_cap)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | WORKED | COMPENSATED | CANCELLED" }
      - { name: compensation_cents, type: integer, source: computed, default: null, description: "Set at WORKED: periods * district.period_comp_rate_cents snapshotted at confirm-worked" }

  - name: Timesheet
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; worked assignment" }
      - { name: substitute_id, type: string, source: system, description: "Denormalized from assignment.substitute_id at creation" }
      - { name: payroll_period_id, type: string, source: system, default: null, description: "FK -> PayrollPeriod.id; set at export" }
      - { name: work_date, type: string, source: input, description: "ISO date worked; weekday within assignment date range" }
      - { name: hours_worked, type: number, source: input, description: "Hours worked, 0.5..12.0 in 0.5 steps" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | EXPORTED" }
      - { name: streak_index, type: integer, source: computed, default: null, description: "Position within current consecutive-workday streak among APPROVED timesheets; set at approval" }
      - { name: day_pay_cents, type: integer, source: computed, default: null, description: "Per-day rounded pay for this date; set at approval, recomputed on streak shifts" }

  - name: PayrollPeriod
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; district the period covers" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive; >= period_start" }
      - { name: status, type: enum, source: system, description: "OPEN | EXPORTED" }
      - { name: total_payout_cents, type: integer, source: computed, default: null, description: "Sum of charged payouts + coverage compensation at export" }
      - { name: assignments_paid_count, type: integer, source: computed, default: null, description: "Assignments moved VERIFIED -> PAID at export" }
      - { name: coverages_compensated_count, type: integer, source: computed, default: null, description: "Coverages moved WORKED -> COMPENSATED at export" }
      - { name: exported_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of export" }

  - name: PerformanceFlag
    parent: null
    common_fields: true
    fields:
      - { name: substitute_id, type: string, source: input, description: "FK -> Substitute.id; flagged substitute" }
      - { name: school_id, type: string, source: input, description: "FK -> School.id; school raising the flag" }
      - { name: assignment_id, type: string, source: input, default: null, description: "Optional Assignment.id the flag relates to" }
      - { name: flag_type, type: enum, source: input, description: "NO_SHOW | CONDUCT | QUALITY | TARDINESS" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | ESCALATED" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "True when created by the NO_SHOW cascade" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Absence
    field: fill_status
    initial_state: REPORTED
    terminal_states: [CLOSED, CANCELLED]
    note: "Parallel dimension: approval_status evolves independently (see next machine). Dispatch, claim, and manual offer are blocked while approval_status is PENDING or REJECTED."
    transitions:
      - from: REPORTED
        to: DISPATCHING
        trigger: "POST /dispatch-batches (batch pick-up) or POST /assignments (first manual offer)"
        actor: "system or SchoolCoordinator"
        preconditions:
          - "approval_status == NOT_REQUIRED or APPROVED (ERR_ABSENCE_INVALID_STATE)"
          - "end_date >= current clock date"
          - "days_covered_internal == 0"
        side_effects:
          - "Dispatch selector runs; if a candidate exists, an OFFERED Assignment is created (offer_sequence 1)"

      - from: DISPATCHING
        to: ASSIGNED
        trigger: "system (an Assignment reaches ACCEPTED via respond/claim)"
        actor: system
        preconditions: []
        side_effects:
          - "Any other OFFERED assignments for this absence are CANCELLED with cancel_reason ABSENCE_CANCEL (no reliability penalty)"

      - from: ASSIGNED
        to: DISPATCHING
        trigger: "system (the ACCEPTED assignment is cancelled or marked NO_SHOW)"
        actor: system
        preconditions: []
        side_effects:
          - "Dispatch selector immediately re-runs; if a candidate exists, a new OFFERED Assignment is created with incremented offer_sequence"

      - from: DISPATCHING
        to: UNFILLED
        trigger: "system (POST /dispatch-batches cutoff sweep)"
        actor: system
        preconditions:
          - "start_date <= batch run date"
          - "No ACCEPTED/WORKED/VERIFIED assignment exists for this absence"
          - "No live OFFERED assignment exists (all expired or terminal as of the batch clock)"
        side_effects: []

      - from: UNFILLED
        to: DISPATCHING
        trigger: "POST /dispatch-batches (re-pickup) or POST /assignments (manual offer)"
        actor: "system or SchoolCoordinator"
        preconditions:
          - "end_date >= current clock date"
          - "days_covered_internal == 0"
        side_effects:
          - "Dispatch selector runs as in REPORTED -> DISPATCHING"

      - from: UNFILLED
        to: COVERED_INTERNALLY
        trigger: "system (first InternalCoverage for this absence reaches APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "days_covered_internal recomputed"

      - from: COVERED_INTERNALLY
        to: UNFILLED
        trigger: "system (last APPROVED/WORKED coverage is CANCELLED, leaving days_covered_internal == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "days_covered_internal recomputed"

      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (assignment reaches VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "days_covered_sub set to assignment.worked_days_count; days_uncovered recomputed"

      - from: COMPLETED
        to: CLOSED
        trigger: "system (payroll export moves assignment VERIFIED -> PAID)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [REPORTED, DISPATCHING, UNFILLED, COVERED_INTERNALLY]
        to: CANCELLED
        trigger: "POST /absences/{id}/cancel"
        actor: "Teacher (own), SchoolCoordinator, DistrictAdmin"
        preconditions:
          - "fill_status in {REPORTED, DISPATCHING, UNFILLED, COVERED_INTERNALLY} (ERR_ABSENCE_INVALID_STATE from ASSIGNED/COMPLETED/CLOSED/CANCELLED)"
        side_effects:
          - "OFFERED assignments for this absence -> CANCELLED with cancel_reason ABSENCE_CANCEL (no reliability penalty)"
          - "PROPOSED/APPROVED InternalCoverages for this absence -> CANCELLED (days_covered_internal recomputed)"

  - entity: Absence
    field: approval_status
    initial_state: COMPUTED_AT_CREATION
    terminal_states: []
    note: "NOT_REQUIRED when total_days <= district.long_term_approval_days; PENDING when total_days > long_term_approval_days. Parallel to fill_status."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /absences/{id}/review with decision=APPROVE"
        actor: DistrictAdmin
        preconditions:
          - "approval_status in {PENDING, NOT_REQUIRED} (ERR_ABSENCE_INVALID_STATE otherwise)"
          - "fill_status not in {CANCELLED, CLOSED}"
        side_effects: []

      - from: [PENDING, NOT_REQUIRED]
        to: REJECTED
        trigger: "POST /absences/{id}/review with decision=REJECT"
        actor: DistrictAdmin
        preconditions:
          - "fill_status in {REPORTED, DISPATCHING, UNFILLED} (ERR_ABSENCE_INVALID_STATE otherwise)"
        side_effects:
          - "OFFERED assignments for this absence -> CANCELLED with cancel_reason ABSENCE_CANCEL"
          - "fill_status -> REPORTED if it was DISPATCHING or UNFILLED"

      - from: [APPROVED, NOT_REQUIRED, REJECTED]
        to: PENDING
        trigger: "PUT /absences/{id} (date edit recomputes total_days > district.long_term_approval_days)"
        actor: SchoolCoordinator
        preconditions: []
        side_effects:
          - "Absence must be re-approved before any further dispatch, offer, or claim"

      - from: PENDING
        to: NOT_REQUIRED
        trigger: "PUT /absences/{id} (date edit brings total_days <= district.long_term_approval_days)"
        actor: SchoolCoordinator
        preconditions: []
        side_effects: []

  - entity: Assignment
    field: status
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, CANCELLED, NO_SHOW, PAID]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/respond with decision=ACCEPT (owning substitute)"
        actor: Substitute
        preconditions:
          - "status == OFFERED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "clock < offer_expires_at, otherwise the assignment is auto-EXPIRED first"
          - "absence.fill_status == DISPATCHING (ERR_ABSENCE_INVALID_STATE)"
          - "absence.approval_status in {NOT_REQUIRED, APPROVED} (ERR_ABSENCE_INVALID_STATE)"
          - "substitute.status == ACTIVE (ERR_SUBSTITUTE_INVALID_STATE)"
          - "No ACTIVE DO_NOT_RETURN mark for (absence.school_id, substitute) (ERR_SUBSTITUTE_DO_NOT_RETURN)"
          - "All BACKGROUND_CHECK and TEACHING_CREDENTIAL clearances VERIFIED with expires_on >= absence.end_date (ERR_CLEARANCE_INVALID)"
          - "Qualification (required_subject, required_grade_band) exists for substitute (ERR_QUALIFICATION_MISMATCH)"
          - "No date-range overlap with substitute's other ACCEPTED/WORKED/VERIFIED assignments (ERR_ASSIGNMENT_DATE_OVERLAP)"
          - "school.coverage_budget_available_cents >= provisional_pay_cents (ERR_COVERAGE_BUDGET_INSUFFICIENT)"
        side_effects:
          - "absence.fill_status -> ASSIGNED"
          - "Other OFFERED assignments on this absence -> CANCELLED (ABSENCE_CANCEL)"
          - "school.coverage_budget_committed_cents += provisional_pay_cents"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/respond with decision=DECLINE"
        actor: Substitute
        preconditions:
          - "status == OFFERED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "Dispatch selector immediately re-runs for the absence; next candidate gets a new OFFERED assignment with incremented offer_sequence, else absence stays DISPATCHING"

      - from: OFFERED
        to: EXPIRED
        trigger: "system (clock >= offer_expires_at; applied lazily on respond and eagerly at dispatch batch)"
        actor: system
        preconditions: []
        side_effects:
          - "Same re-dispatch cascade as DECLINED"

      - from: [OFFERED, ACCEPTED]
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel (Substitute self-cancel or SchoolCoordinator/DistrictAdmin) or system cascade (DNR creation, suspension, absence cancel/reject)"
        actor: "Substitute, SchoolCoordinator, DistrictAdmin, system"
        preconditions:
          - "Manual cancel: status in {OFFERED, ACCEPTED} (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "If status was ACCEPTED: school.coverage_budget_committed_cents -= provisional_pay_cents"
          - "If manual substitute cancel of ACCEPTED: reliability event appended (SUB_CANCEL_LATE -15 when clock < absence start and lead < district.short_notice_hours, else SUB_CANCEL_EARLY -5); suspension evaluation runs"
          - "If status was ACCEPTED: absence.fill_status ASSIGNED -> DISPATCHING and dispatch selector re-runs (new offer to next eligible candidate, excluding this substitute when DNR_CANCEL)"
          - "cancel_reason is pinned by actor: substitute self-cancel -> SUB_CANCEL; coordinator/admin manual cancel -> COORDINATOR_CANCEL; system cascades -> DNR_CANCEL, SUSPENSION_CANCEL, or ABSENCE_CANCEL"
          - "System cancels (DNR_CANCEL, SUSPENSION_CANCEL, ABSENCE_CANCEL) carry no reliability penalty"

      - from: ACCEPTED
        to: WORKED
        trigger: "POST /assignments/{id}/report-outcome with outcome=WORKED"
        actor: SchoolCoordinator
        preconditions:
          - "status == ACCEPTED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "clock date >= start_date (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects: []

      - from: ACCEPTED
        to: NO_SHOW
        trigger: "POST /assignments/{id}/report-outcome with outcome=NO_SHOW"
        actor: SchoolCoordinator
        preconditions:
          - "status == ACCEPTED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "school.coverage_budget_committed_cents -= provisional_pay_cents"
          - "Reliability event NO_SHOW (-25) appended; suspension evaluation runs"
          - "A PerformanceFlag (flag_type NO_SHOW, severity MAJOR, auto_created=true, status OPEN) is created for (substitute, school)"
          - "absence.fill_status ASSIGNED -> DISPATCHING; dispatch selector re-runs"

      - from: WORKED
        to: VERIFIED
        trigger: "POST /assignments/{id}/verify"
        actor: SchoolCoordinator
        preconditions:
          - "status == WORKED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "No SUBMITTED timesheets exist for this assignment (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "final_payout_cents computed from APPROVED timesheets (see final_payout calculation)"
          - "Reliability event COMPLETION (+1) appended; completions counters incremented; suspension evaluation runs"
          - "absence.fill_status ASSIGNED -> COMPLETED; days_covered_sub = worked_days_count"

      - from: VERIFIED
        to: PAID
        trigger: "system (POST /payroll-periods/{id}/export)"
        actor: system
        preconditions: []
        side_effects:
          - "school budget: committed -= provisional_pay_cents, then charged amount (<= final_payout_cents when capped) moved to spent; payout_capped set accordingly"

  - entity: Substitute
    field: status
    initial_state: PENDING_CLEARANCE
    terminal_states: []
    transitions:
      - from: PENDING_CLEARANCE
        to: ACTIVE
        trigger: "POST /substitutes/{id}/activate"
        actor: DistrictAdmin
        preconditions:
          - "status in {PENDING_CLEARANCE, SUSPENDED} (ERR_SUBSTITUTE_INVALID_STATE)"
          - "BACKGROUND_CHECK and TEACHING_CREDENTIAL clearances exist in VERIFIED status with expires_on >= current clock date (ERR_CLEARANCE_INVALID)"
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /substitutes/{id}/activate"
        actor: DistrictAdmin
        preconditions:
          - "Same clearance preconditions as PENDING_CLEARANCE -> ACTIVE"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /substitutes/{id}/suspend (manual) or system (auto-suspension on reliability event, or clearance expiry detected at batch/validation)"
        actor: "DistrictAdmin or system"
        preconditions:
          - "Manual: status == ACTIVE (ERR_SUBSTITUTE_INVALID_STATE)"
          - "Auto (score): reliability_trailing_score < district.suspension_score_threshold AND completions_trailing >= district.suspension_min_completions"
          - "Auto (clearance): any required clearance (BACKGROUND_CHECK or TEACHING_CREDENTIAL) EXPIRED"
        side_effects:
          - "All OFFERED assignments for this substitute -> CANCELLED (SUSPENSION_CANCEL); their absences remain DISPATCHING and re-run the selector"
          - "All ACCEPTED assignments for this substitute -> CANCELLED (SUSPENSION_CANCEL); their absences ASSIGNED -> DISPATCHING and re-run the selector"

  - entity: Clearance
    field: status
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /clearances/{id}/verify"
        actor: DistrictAdmin
        preconditions:
          - "status == PENDING (ERR_CLEARANCE_INVALID_STATE)"
          - "expires_on >= current clock date (ERR_CLEARANCE_INVALID)"
        side_effects: []

      - from: [PENDING, VERIFIED]
        to: EXPIRED
        trigger: "system (clock date > expires_on; applied eagerly at dispatch batch, activation, and any validation that reads the clearance)"
        actor: system
        preconditions: []
        side_effects:
          - "When the expiry is detected at a dispatch batch or at substitute activation and this is a required clearance (BACKGROUND_CHECK or TEACHING_CREDENTIAL) and substitute.status == ACTIVE: substitute -> SUSPENDED with full suspension cascade. Detection at other validations flips the clearance status only."

  - entity: SchoolSubstituteMark
    field: status
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /marks/{id}/lift"
        actor: "SchoolCoordinator, DistrictAdmin"
        preconditions:
          - "status == ACTIVE (ERR_MARK_INVALID_STATE)"
        side_effects:
          - "Substitute becomes eligible for this school again (selector and DNR checks ignore LIFTED marks)"

  - entity: InternalCoverage
    field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, CANCELLED, COMPENSATED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /internal-coverages/{id}/review with decision=APPROVE"
        actor: DistrictAdmin
        preconditions:
          - "status == PROPOSED (ERR_COVERAGE_INVALID_STATE)"
          - "absence.fill_status in {UNFILLED, COVERED_INTERNALLY} (ERR_ABSENCE_INVALID_STATE)"
          - "Capacity re-check passes (ERR_COVERAGE_CAPACITY_EXCEEDED)"
        side_effects:
          - "absence.days_covered_internal recomputed; if first approved coverage, absence UNFILLED -> COVERED_INTERNALLY"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /internal-coverages/{id}/review with decision=REJECT"
        actor: DistrictAdmin
        preconditions:
          - "status == PROPOSED (ERR_COVERAGE_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: WORKED
        trigger: "POST /internal-coverages/{id}/confirm-worked"
        actor: SchoolCoordinator
        preconditions:
          - "status == APPROVED (ERR_COVERAGE_INVALID_STATE)"
          - "clock date >= coverage_date (ERR_COVERAGE_INVALID_STATE)"
        side_effects:
          - "compensation_cents = periods * district.period_comp_rate_cents (rate snapshotted now)"

      - from: [PROPOSED, APPROVED]
        to: CANCELLED
        trigger: "POST /internal-coverages/{id}/cancel or system (absence cancelled)"
        actor: "SchoolCoordinator, DistrictAdmin, system"
        preconditions:
          - "Manual: status in {PROPOSED, APPROVED} (ERR_COVERAGE_INVALID_STATE)"
        side_effects:
          - "If status was APPROVED: absence.days_covered_internal decremented; if it reaches 0 and absence was COVERED_INTERNALLY: absence -> UNFILLED"

      - from: WORKED
        to: COMPENSATED
        trigger: "system (POST /payroll-periods/{id}/export)"
        actor: system
        preconditions: []
        side_effects:
          - "school.coverage_budget_spent_cents += compensation_cents (post-cap; compensation is never capped)"

  - entity: Timesheet
    field: status
    initial_state: SUBMITTED
    terminal_states: [EXPORTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /timesheets/{id}/review with decision=APPROVE"
        actor: SchoolCoordinator
        preconditions:
          - "status == SUBMITTED (ERR_TIMESHEET_INVALID_STATE)"
          - "assignment.status == WORKED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "streak_index computed; full chronological streak recompute runs for the assignment's APPROVED timesheets"
          - "day_pay_cents recomputed per the streak table; assignment.worked_days_count and long_term_converted refreshed"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /timesheets/{id}/review with decision=REJECT"
        actor: SchoolCoordinator
        preconditions:
          - "status == SUBMITTED (ERR_TIMESHEET_INVALID_STATE)"
          - "assignment.status == WORKED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects: []

      - from: REJECTED
        to: SUBMITTED
        trigger: "PUT /timesheets/{id} (resubmit with new hours_worked)"
        actor: Substitute
        preconditions:
          - "status == REJECTED (ERR_TIMESHEET_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: EXPORTED
        trigger: "system (POST /payroll-periods/{id}/export)"
        actor: system
        preconditions: []
        side_effects:
          - "payroll_period_id set to the exporting period"

  - entity: PayrollPeriod
    field: status
    initial_state: OPEN
    terminal_states: [EXPORTED]
    transitions:
      - from: OPEN
        to: EXPORTED
        trigger: "POST /payroll-periods/{id}/export"
        actor: PayrollClerk
        preconditions:
          - "status == OPEN (ERR_PAYROLL_PERIOD_INVALID_STATE)"
          - "No SUBMITTED timesheets attached to assignments whose absence belongs to this district (ERR_PAYROLL_PERIOD_INVALID_STATE)"
          - "No assignments in {ACCEPTED, WORKED} whose absence.end_date falls within [period_start, period_end] (ERR_PAYROLL_PERIOD_INVALID_STATE)"
        side_effects:
          - "VERIFIED assignments with absence.end_date in period -> PAID (budget waterfall per payroll_waterfall calculation)"
          - "Their APPROVED timesheets -> EXPORTED with payroll_period_id set"
          - "WORKED coverages with coverage_date in period -> COMPENSATED"
          - "COMPLETED absences whose assignment was paid -> CLOSED"
          - "total_payout_cents, assignments_paid_count, coverages_compensated_count, exported_at set"

  - entity: PerformanceFlag
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /performance-flags/{id}/review with decision=RESOLVE"
        actor: DistrictAdmin
        preconditions:
          - "status == OPEN (ERR_PERFORMANCE_FLAG_INVALID_STATE)"
        side_effects: []

      - from: OPEN
        to: ESCALATED
        trigger: "POST /performance-flags/{id}/review with decision=ESCALATE"
        actor: DistrictAdmin
        preconditions:
          - "status == OPEN (ERR_PERFORMANCE_FLAG_INVALID_STATE)"
        side_effects:
          - "An ACTIVE SchoolSubstituteMark (mark_type DO_NOT_RETURN, source_flag_id = this flag) is created for (school, substitute) unless one already exists"
          - "DNR cascade: substitute's OFFERED and ACCEPTED assignments at this school with end_date >= clock date -> CANCELLED (DNR_CANCEL, no reliability penalty)"
          - "Each cancelled ACCEPTED assignment's absence -> DISPATCHING and re-runs the selector (the DNR'd substitute is now ineligible)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: absence-claim-stale-version
    parent_entity: Absence
    write_endpoint: "POST /absences/{id}/claim"
    occ_field: "expected_absence_version"
    description: |
      Claiming an absence whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just claimed or edited the absence (a successful claim legitimately
      fills the job and bumps the version), leaving the current writer's view
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: absence-edit-stale-version
    parent_entity: Absence
    write_endpoint: "PUT /absences/{id}"
    occ_field: "expected_absence_version"
    description: |
      Editing an absence whose version has advanced since the client last
      observed it is rejected. A second well-formed edit sent after another
      edit has fully completed would otherwise legitimately succeed; the
      stale version reveals the client's view is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: district-config-stale-version
    parent_entity: District
    write_endpoint: "PUT /districts/{id}"
    occ_field: "expected_district_version"
    description: |
      Updating district pay-rule configuration whose version has advanced
      since the client last observed it is rejected. Sequential configuration
      updates are each legitimate; the stale version check is the only
      rejection signal.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: weekday_day_count
    trigger: "absence creation, PUT /absences/{id}, POST /assignments/{id}/extend"
    algorithm: aggregation
    formula: |
      total_days = count of dates d in [start_date, end_date] where weekday(d) in {Mon..Fri}
    input_set: "Absence date range"
    precision: "integer day count"

  - name: premium_multiplier
    trigger: "assignment offer creation (dispatch batch, manual offer, self-claim)"
    algorithm: threshold
    formula: |
      lead_hours = (absence.start_dateT00:00:00Z - clock.now) in hours; may be negative
      htf = district.htf_high_premium_pct if school.hard_to_fill_tier == HIGH
            else district.htf_moderate_premium_pct if MODERATE else 0
      notice = district.short_notice_premium_pct if lead_hours < district.short_notice_hours
               else district.moderate_notice_premium_pct if lead_hours < district.moderate_notice_hours
               else 0
      premium_multiplier_snapshot = min(1.0 + htf + notice, district.premium_cap_multiplier)
    input_set: "Absence, its School, District config, logical clock"
    constants:
      PREMIUM_CAP: 1.50
      SHORT_NOTICE_HOURS: 24
      MODERATE_NOTICE_HOURS: 72
    precision: "multiplier kept exact to 2 decimal places (all components are 2-decimal)"

  - name: provisional_pay
    trigger: "assignment offer creation and extension (scheduled_days refresh)"
    algorithm: aggregation
    formula: |
      provisional_pay_cents = scheduled_days * round_half_up(base_daily_rate_cents * premium_multiplier_snapshot)
    input_set: "Assignment (scheduled_days, premium_multiplier_snapshot), Substitute.base_daily_rate_cents"
    precision: "integer cents; per-assignment single rounding"
    variants:
      - name: provisional_variant
        when: "Offer/accept time"
        difference: "Uses scheduled_days and premium snapshot; ignores worked days and long-term conversion"
      - name: final_variant
        when: "Verification time (see final_payout)"
        difference: "Uses APPROVED timesheets, streak-based long-term rate; generally differs from provisional"

  - name: final_payout
    trigger: "POST /assignments/{id}/verify"
    algorithm: chronological
    formula: |
      Collect APPROVED timesheets for the assignment, sort by work_date ASC (unique dates, no ties possible).
      Streak pass: streak_index(1st approved date) = 1;
        streak_index(d) = streak_index(prev) + 1 when d is the next district workday after prev (weekend gaps do not break the streak);
        any weekday gap (a skipped Mon-Fri date with no approved timesheet between two approved dates) resets streak_index(d) = 1.
      Per-day pay (rounding order PINNED — round each day first, then sum):
        day_pay(d) = round_half_up(base_daily_rate_cents * district.long_term_rate_multiplier)
                     if streak_index(d) >= district.long_term_threshold_days
                     else round_half_up(base_daily_rate_cents * premium_multiplier_snapshot)
      final_payout_cents = sum(day_pay(d) over approved dates)
      Rounding per-day-then-sum vs sum-then-round differ; per-day-then-sum is authoritative.
    input_set: "APPROVED timesheets of the assignment only (SUBMITTED block verification; REJECTED excluded)"
    constants:
      LONG_TERM_THRESHOLD_DAYS: 10
      LONG_TERM_RATE_MULTIPLIER: 1.15
    precision: "integer cents, round_half_up applied per day before summation"
    variants:
      - name: provisional_variant
        when: "Assignment provisional_pay_cents"
        difference: "Scheduled-day estimate at premium rate only"
      - name: final_variant
        when: "VERIFIED"
        difference: "Actual approved days with streak-based long-term conversion; replaces provisional"

  - name: reliability_scores
    trigger: "any append to Substitute.reliability_events (cancel, no-show, completion, flag creation)"
    algorithm: aggregation
    formula: |
      lifetime = clamp(100 + sum(delta over all events), 0, 100)
      trailing = clamp(100 + sum(delta over events with occurred_at >= clock.now - district.reliability_window_days), 0, 100)
      completions_lifetime = count(COMPLETION events, all time)
      completions_trailing = count(COMPLETION events inside trailing window)
      Event deltas: COMPLETION +1, SUB_CANCEL_EARLY -5, SUB_CANCEL_LATE -15, NO_SHOW -25,
        FLAG_MINOR -3, FLAG_MAJOR -10. DECLINE/EXPIRE/system-cancels produce no event.
    input_set: "Substitute.reliability_events; trailing variant filters by occurred_at window"
    constants:
      SCORE_START: 100
      WINDOW_DAYS: 90
    precision: "integer score"
    variants:
      - name: lifetime_variant
        when: "Displayed on substitute profile"
        difference: "All events ever; old events never age out"
      - name: trailing_variant
        when: "Dispatch ranking and suspension evaluation"
        difference: "Only events inside the trailing window; identical event log yields a different score once events age past the window"

  - name: suspension_evaluation
    trigger: "after every reliability event append and every completion counter change"
    algorithm: threshold
    formula: |
      if substitute.status == ACTIVE
         and reliability_trailing_score < district.suspension_score_threshold
         and completions_trailing >= district.suspension_min_completions:
           substitute -> SUSPENDED (cascade per Substitute state machine)
      Boundary: trailing score exactly equal to the threshold does NOT suspend (strictly below).
    input_set: "Substitute scores + District config"
    constants:
      SUSPEND_SCORE_LT: 60
      MIN_COMPLETIONS: 5

  - name: dispatch_candidate_ranking
    trigger: "dispatch batch pick-up, offer decline/expire re-dispatch, cancellation re-dispatch, manual offer preview (same selector)"
    algorithm: selector
    formula: |
      Eligibility filter (all must hold):
        substitute.status == ACTIVE
        Qualification exists matching (absence.required_subject, absence.required_grade_band)
        BACKGROUND_CHECK and TEACHING_CREDENTIAL clearances VERIFIED with expires_on >= absence.end_date
        No ACTIVE DO_NOT_RETURN SchoolSubstituteMark for (absence.school_id, substitute)
        No date-range overlap with substitute's ACCEPTED/WORKED/VERIFIED assignments
        No non-terminal assignment (OFFERED/ACCEPTED) already exists for (absence, substitute)
        No DECLINED or EXPIRED assignment exists for (absence, substitute) — a substitute who declined or timed out is never re-offered the same absence
      Ranking: rank_score = reliability_trailing_score + (district.preference_rank_boost if ACTIVE PREFERRED mark at absence.school_id else 0)
      Order: rank_score DESC, tie -> substitute.created_at ASC (earliest registered first)
      Fallback: empty pool -> no offer created; absence remains DISPATCHING (cutoff sweep may later mark UNFILLED)
    input_set: "All Substitute entities, their Qualifications/Clearances/Marks/Assignments, District config"
    precision: "integer rank score"

  - name: coverage_compensation
    trigger: "POST /internal-coverages/{id}/confirm-worked"
    algorithm: aggregation
    formula: |
      compensation_cents = periods * district.period_comp_rate_cents  (rate read at confirm-worked time and snapshotted onto the coverage)
    input_set: "InternalCoverage.periods, District.period_comp_rate_cents"
    constants:
      PERIOD_COMP_RATE_CENTS: 2500
    precision: "integer cents"

  - name: absence_day_coverage
    trigger: "coverage approve/cancel, assignment verify, absence edit/extend"
    algorithm: aggregation
    formula: |
      days_covered_internal = count(distinct coverage_date of coverages in {APPROVED, WORKED, COMPENSATED})
      days_covered_sub = assignment.worked_days_count if an assignment is VERIFIED/PAID else 0
      days_uncovered = total_days - days_covered_internal - days_covered_sub
      Conservation invariant: days_covered_internal + days_covered_sub + days_uncovered == total_days at all times.
    input_set: "Absence, its InternalCoverages, its terminal Assignment"

  - name: payroll_waterfall
    trigger: "POST /payroll-periods/{id}/export"
    algorithm: waterfall_allocation
    formula: |
      In-scope assignments: VERIFIED, absence.district == period.district, absence.end_date in [period_start, period_end].
      Processing order PINNED: assignment.created_at ASC (final tie-break; never id).
      For each assignment in order:
        1. school.coverage_budget_committed_cents -= provisional_pay_cents (release provisional reserve)
        2. charge = min(final_payout_cents, school.coverage_budget_available_cents after step 1)
        3. school.coverage_budget_spent_cents += charge; assignment.final_payout_cents is unchanged (uncapped amount),
           assignment.payout_capped = (charge < final_payout_cents); charged amount is spent - delta attributable to this assignment
        4. assignment -> PAID; its APPROVED timesheets -> EXPORTED
      Then WORKED coverages with coverage_date in period (ordered by created_at ASC):
        school.coverage_budget_spent_cents += compensation_cents (compensation is never capped)
      period.total_payout_cents = sum(charged assignment payouts) + sum(compensation_cents)
      Evaluation-order note: charge of assignment N depends on budget_available, which depends on charges of
      assignments 1..N-1; the pinned created_at ASC order makes every value well-defined.
    input_set: "VERIFIED assignments + WORKED coverages in period scope, School budget fields"
    precision: "integer cents"

  - name: fill_rate_analytics
    trigger: "GET /analytics/fill-rate"
    algorithm: aggregation
    formula: |
      Denominator: absences with start_date in [from_date, to_date] and fill_status != CANCELLED,
        grouped by school_id and ISO day-of-week of start_date (1=Mon..7=Sun).
      Variant SUB_ONLY (default): filled = absences that ever reached ASSIGNED (fill_status in
        {ASSIGNED, COMPLETED, CLOSED} or currently ASSIGNED-pipeline states).
      Variant ANY_COVERAGE: filled = SUB_ONLY set plus absences in COVERED_INTERNALLY.
      fill_rate = filled / denominator; when denominator == 0, fill_rate is null (not 0, not an error).
      Response: { rows: [ {school_id, day_of_week, reported_count, sub_only_filled_count, sub_only_fill_rate,
        any_coverage_filled_count, any_coverage_fill_rate} ] } — one row per (school, day_of_week) group that
        contains at least one absence in range including CANCELLED ones; reported_count counts only
        non-CANCELLED absences.
    input_set: "All non-cancelled absences in range; optional school_id filter"
    precision: "fill_rate rounded to 4 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_AUTH_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: existence
    check: "Request body shape: required fields present, types valid, enum values in declared sets, hours_worked in 0.5..12.0 step 0.5, periods >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "Entity-backed ownership: Teacher acts only on own absences (staff_member_id == X-User-ID); SchoolCoordinator acts only on resources of their school (coordinator's staff record school_id matches, is_coordinator true); Substitute acts only on own assignments/timesheets (substitute_id == X-User-ID)"
    error_id: ERR_RESOURCE_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "ownership-scoped endpoints (POST /absences as Teacher, POST /absences/{id}/cancel as Teacher, POST /assignments/{id}/respond, POST /assignments/{id}/cancel as Substitute, POST /timesheets, PUT /timesheets/{id}, POST /absences/{id}/claim, SchoolCoordinator write endpoints)"

  - priority: 5
    category: existence
    check: "Path resource ids exist, validated left-to-right; nested child belongs to path parent"
    error_id: "ERR_DISTRICT_NOT_FOUND | ERR_SCHOOL_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_SUBSTITUTE_NOT_FOUND | ERR_ABSENCE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CLEARANCE_NOT_FOUND | ERR_MARK_NOT_FOUND | ERR_COVERAGE_NOT_FOUND | ERR_TIMESHEET_NOT_FOUND | ERR_PAYROLL_PERIOD_NOT_FOUND | ERR_PERFORMANCE_FLAG_NOT_FOUND | ERR_DISPATCH_BATCH_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 6
    category: existence
    check: "Body FK references exist (staff_member_id, school_id, substitute_id, absence_id, assignment_id, district_id)"
    error_id: "same per-entity ERR_*_NOT_FOUND ids as priority 5"
    http_status: 404
    applies_to: "creation endpoints with body references"

  - priority: 7
    category: state
    check: "OCC: expected_absence_version / expected_district_version equals the resource's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /absences/{id}/claim, PUT /absences/{id}, PUT /districts/{id}"

  - priority: 8
    category: state
    check: "Target resource state precondition per §1.2 (fill_status, approval_status, assignment status, substitute status, coverage/timesheet/payroll/flag/mark status); POST /timesheets additionally requires assignment.status == WORKED (ERR_ASSIGNMENT_INVALID_STATE); POST /internal-coverages requires absence.fill_status in {DISPATCHING, UNFILLED, COVERED_INTERNALLY} (ERR_ABSENCE_INVALID_STATE)"
    error_id: "ERR_ABSENCE_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_SUBSTITUTE_INVALID_STATE | ERR_CLEARANCE_INVALID_STATE | ERR_MARK_INVALID_STATE | ERR_COVERAGE_INVALID_STATE | ERR_TIMESHEET_INVALID_STATE | ERR_PAYROLL_PERIOD_INVALID_STATE | ERR_PERFORMANCE_FLAG_INVALID_STATE"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 9
    category: business_safety
    check: "No ACTIVE DO_NOT_RETURN mark for (school, substitute)"
    error_id: ERR_SUBSTITUTE_DO_NOT_RETURN
    http_status: 409
    applies_to: "POST /assignments, POST /absences/{id}/claim, POST /assignments/{id}/respond (ACCEPT)"

  - priority: 10
    category: business_safety
    check: "Required clearances (BACKGROUND_CHECK, TEACHING_CREDENTIAL) VERIFIED with expires_on covering absence.end_date (or current date for activation)"
    error_id: ERR_CLEARANCE_INVALID
    http_status: 409
    applies_to: "POST /assignments, POST /absences/{id}/claim, POST /assignments/{id}/respond (ACCEPT), POST /substitutes/{id}/activate, POST /clearances/{id}/verify"

  - priority: 11
    category: business_safety
    check: "Qualification matches (required_subject, required_grade_band)"
    error_id: ERR_QUALIFICATION_MISMATCH
    http_status: 409
    applies_to: "POST /assignments, POST /absences/{id}/claim, POST /assignments/{id}/respond (ACCEPT)"

  - priority: 12
    category: business_temporal
    check: "Date sanity: end_date >= start_date; start_date not before current clock date at creation; range contains >= 1 weekday; coverage_date a weekday inside absence range; work_date a weekday inside assignment range; period_end >= period_start"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /absences, PUT /absences/{id}, POST /assignments/{id}/extend, POST /internal-coverages, POST /timesheets, POST /payroll-periods"

  - priority: 13
    category: business_temporal
    check: "Absence date-range overlap: same staff member may not hold two absences (fill_status not in {CANCELLED}) whose [start_date, end_date] ranges intersect; adjacent ranges permitted"
    error_id: ERR_ABSENCE_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /absences, PUT /absences/{id}"

  - priority: 14
    category: business_temporal
    check: "Assignment day overlap: substitute may not hold two assignments in {ACCEPTED, WORKED, VERIFIED} whose [start_date, end_date] ranges intersect; adjacent ranges permitted"
    error_id: ERR_ASSIGNMENT_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /assignments, POST /absences/{id}/claim, POST /assignments/{id}/respond (ACCEPT), POST /assignments/{id}/extend"

  - priority: 15
    category: business_temporal
    check: "Coverage capacity: per staff member, sum(periods of coverages in {PROPOSED, APPROVED, WORKED, COMPENSATED}) on the same coverage_date <= district.daily_period_cap, and within the ISO week (Mon-Sun) of coverage_date <= district.weekly_period_cap"
    error_id: ERR_COVERAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /internal-coverages, POST /internal-coverages/{id}/review (APPROVE)"

  - priority: 16
    category: business_constraint
    check: "Uniqueness: one ACTIVE mark per (school_id, substitute_id, mark_type); one Qualification per (substitute_id, subject, grade_band); one Timesheet per (assignment_id, work_date)"
    error_id: "ERR_DUPLICATE_MARK | ERR_DUPLICATE_QUALIFICATION | ERR_DUPLICATE_TIMESHEET"
    http_status: 409
    applies_to: "POST /marks, POST /qualifications, POST /timesheets"

  - priority: 17
    category: business_constraint
    check: "Timesheet work_date within assignment [start_date, end_date]"
    error_id: ERR_TIMESHEET_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /timesheets"

  - priority: 18
    category: business_constraint
    check: "Long-term approval: extension producing total_days > district.long_term_approval_days requires approval_status == APPROVED"
    error_id: ERR_LONG_TERM_APPROVAL_REQUIRED
    http_status: 409
    applies_to: "POST /assignments/{id}/extend"

  - priority: 19
    category: business_fiscal
    check: "School budget: coverage_budget_available_cents >= provisional_pay_cents of the assignment being accepted"
    error_id: ERR_COVERAGE_BUDGET_INSUFFICIENT
    http_status: 402
    applies_to: "POST /assignments/{id}/respond (ACCEPT), POST /absences/{id}/claim"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- District ---
  - method: POST
    path: "/districts"
    description: "Create a district with pay-rule configuration (defaults applied for omitted config fields)"
    roles: [DistrictAdmin]
    code: 201
    input: [name, "offer_response_window_minutes?", "long_term_approval_days?", "long_term_threshold_days?", "long_term_rate_multiplier?", "htf_high_premium_pct?", "htf_moderate_premium_pct?", "short_notice_hours?", "short_notice_premium_pct?", "moderate_notice_hours?", "moderate_notice_premium_pct?", "premium_cap_multiplier?", "preference_rank_boost?", "reliability_window_days?", "suspension_score_threshold?", "suspension_min_completions?", "period_comp_rate_cents?", "daily_period_cap?", "weekly_period_cap?"]
    output: District
    side_effects: ["status/config initialized; version 1"]

  - method: GET
    path: "/districts/{id}"
    description: "Get a district"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: PUT
    path: "/districts/{id}"
    description: "Update district pay-rule configuration; OCC-guarded"
    roles: [DistrictAdmin]
    code: 200
    input: [expected_district_version, "name?", "offer_response_window_minutes?", "long_term_approval_days?", "long_term_threshold_days?", "long_term_rate_multiplier?", "htf_high_premium_pct?", "htf_moderate_premium_pct?", "short_notice_hours?", "short_notice_premium_pct?", "moderate_notice_hours?", "moderate_notice_premium_pct?", "premium_cap_multiplier?", "preference_rank_boost?", "reliability_window_days?", "suspension_score_threshold?", "suspension_min_completions?", "period_comp_rate_cents?", "daily_period_cap?", "weekly_period_cap?"]
    output: District
    side_effects: ["increments District.version by 1"]

  # --- School ---
  - method: POST
    path: "/schools"
    description: "Create a school"
    roles: [DistrictAdmin]
    code: 201
    input: [district_id, name, coverage_budget_total_cents, "hard_to_fill_tier?"]
    output: School
    side_effects: ["budget committed/spent initialized to 0"]

  - method: GET
    path: "/schools/{id}"
    description: "Get a school"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/districts/{id}/schools"
    description: "List schools of a district"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "School[]"
    side_effects: []

  # --- StaffMember ---
  - method: POST
    path: "/staff-members"
    description: "Create a staff member"
    roles: [DistrictAdmin, SchoolCoordinator]
    code: 201
    input: [school_id, full_name, subject, grade_band, "is_coordinator?"]
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/staff-members/{id}"
    description: "Get a staff member"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/schools/{id}/staff-members"
    description: "List staff members of a school"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "StaffMember[]"
    side_effects: []

  # --- Substitute ---
  - method: POST
    path: "/substitutes"
    description: "Register a substitute (starts PENDING_CLEARANCE)"
    roles: [DistrictAdmin]
    code: 201
    input: [full_name, base_daily_rate_cents]
    output: Substitute
    side_effects: ["status PENDING_CLEARANCE; scores initialized to 100; counters 0"]

  - method: GET
    path: "/substitutes/{id}"
    description: "Get a substitute"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: Substitute
    side_effects: []

  - method: GET
    path: "/substitutes"
    description: "List substitutes with optional status filter"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Substitute[]"
    side_effects: []

  - method: POST
    path: "/substitutes/{id}/activate"
    description: "Activate from PENDING_CLEARANCE or SUSPENDED; requires valid required clearances"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: Substitute
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/substitutes/{id}/suspend"
    description: "Manually suspend an ACTIVE substitute"
    roles: [DistrictAdmin]
    code: 200
    input: ["reason?"]
    output: Substitute
    side_effects: ["status -> SUSPENDED; suspension cascade cancels OFFERED/ACCEPTED assignments and reopens their absences"]

  # --- Qualification ---
  - method: POST
    path: "/qualifications"
    description: "Grant a qualification to a substitute"
    roles: [DistrictAdmin]
    code: 201
    input: [substitute_id, subject, grade_band]
    output: Qualification
    side_effects: []

  - method: GET
    path: "/substitutes/{id}/qualifications"
    description: "List qualifications of a substitute"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Qualification[]"
    side_effects: []

  # --- Clearance ---
  - method: POST
    path: "/clearances"
    description: "Register a clearance record (starts PENDING)"
    roles: [DistrictAdmin]
    code: 201
    input: [substitute_id, clearance_type, expires_on]
    output: Clearance
    side_effects: ["status PENDING"]

  - method: POST
    path: "/clearances/{id}/verify"
    description: "Verify a pending clearance"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: Clearance
    side_effects: ["status PENDING -> VERIFIED"]

  - method: GET
    path: "/substitutes/{id}/clearances"
    description: "List clearances of a substitute (expiry applied lazily on read)"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Clearance[]"
    side_effects: []

  # --- SchoolSubstituteMark ---
  - method: POST
    path: "/marks"
    description: "Create a PREFERRED or DO_NOT_RETURN mark; DO_NOT_RETURN creation triggers the DNR cascade"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 201
    input: [school_id, substitute_id, mark_type, "priority_rank?", "reason?"]
    output: SchoolSubstituteMark
    side_effects: ["For DO_NOT_RETURN: substitute's future-dated OFFERED/ACCEPTED assignments at this school -> CANCELLED (DNR_CANCEL); cancelled ACCEPTED absences reopen and re-run selector"]

  - method: POST
    path: "/marks/{id}/lift"
    description: "Lift an ACTIVE mark"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 200
    input: []
    output: SchoolSubstituteMark
    side_effects: ["status ACTIVE -> LIFTED"]

  - method: GET
    path: "/schools/{id}/marks"
    description: "List marks issued by a school"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["mark_type?", "status?", "limit?", "offset?"]
    output: "SchoolSubstituteMark[]"
    side_effects: []

  - method: GET
    path: "/substitutes/{id}/marks"
    description: "List marks targeting a substitute"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["mark_type?", "status?", "limit?", "offset?"]
    output: "SchoolSubstituteMark[]"
    side_effects: []

  # --- Absence ---
  - method: POST
    path: "/absences"
    description: "Report an absence"
    roles: [Teacher, SchoolCoordinator, DistrictAdmin]
    code: 201
    input: [staff_member_id, start_date, end_date, absence_type, required_subject, required_grade_band]
    output: Absence
    side_effects: ["fill_status REPORTED; approval_status computed (PENDING when total_days > district.long_term_approval_days); total_days computed"]

  - method: GET
    path: "/absences/{id}"
    description: "Get an absence"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: Absence
    side_effects: []

  - method: GET
    path: "/absences"
    description: "List absences with filters"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["school_id?", "staff_member_id?", "fill_status?", "from_date?", "to_date?", "limit?", "offset?"]
    output: "Absence[]"
    side_effects: []

  - method: PUT
    path: "/absences/{id}"
    description: "Edit an absence's dates/requirements while unassigned; OCC-guarded"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 200
    input: [expected_absence_version, "start_date?", "end_date?", "required_subject?", "required_grade_band?"]
    output: Absence
    side_effects: ["increments Absence.version by 1; total_days recomputed; approval_status recomputed (date change on APPROVED long absence forces re-approval)"]

  - method: POST
    path: "/absences/{id}/cancel"
    description: "Cancel an unassigned absence"
    roles: [Teacher, SchoolCoordinator, DistrictAdmin]
    code: 200
    input: []
    output: Absence
    side_effects: ["fill_status -> CANCELLED; OFFERED assignments CANCELLED (ABSENCE_CANCEL); PROPOSED/APPROVED coverages CANCELLED"]

  - method: POST
    path: "/absences/{id}/review"
    description: "District decision on a long-term absence"
    roles: [DistrictAdmin]
    code: 200
    input: [decision]
    output: Absence
    side_effects: ["approval_status -> APPROVED or REJECTED; REJECT cancels outstanding offers and resets fill_status to REPORTED"]

  - method: POST
    path: "/absences/{id}/claim"
    description: "Substitute self-claims an open absence; creates an ACCEPTED assignment atomically; OCC-guarded"
    roles: [Substitute]
    code: 201
    input: [expected_absence_version]
    output: Assignment
    side_effects: ["increments Absence.version by 1; Assignment created ACCEPTED (SELF_CLAIM); absence -> ASSIGNED; budget committed"]

  # --- DispatchBatch ---
  - method: POST
    path: "/dispatch-batches"
    description: "Run an auto-callout batch: expire stale offers, mark cutoff-passed absences UNFILLED, create offers for eligible open absences (one offer per absence per batch)"
    roles: [DistrictAdmin]
    code: 201
    input: [district_id, "run_for_date?"]
    output: DispatchBatch
    side_effects: ["OFFERED -> EXPIRED where offer_expires_at <= clock; DISPATCHING -> UNFILLED per cutoff rule; REPORTED/UNFILLED eligible absences -> DISPATCHING with new OFFERED assignment; expired required clearances -> EXPIRED with suspension cascade"]

  - method: GET
    path: "/dispatch-batches/{id}"
    description: "Get a dispatch batch"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: DispatchBatch
    side_effects: []

  - method: GET
    path: "/districts/{id}/dispatch-batches"
    description: "List dispatch batches of a district"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "DispatchBatch[]"
    side_effects: []

  # --- Assignment ---
  - method: POST
    path: "/assignments"
    description: "Manual offer of an absence to a specific substitute (runs the same eligibility checks as the selector)"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 201
    input: [absence_id, substitute_id]
    output: Assignment
    side_effects: ["Assignment created OFFERED (MANUAL_OFFER, next offer_sequence); absence REPORTED/UNFILLED -> DISPATCHING"]

  - method: GET
    path: "/assignments/{id}"
    description: "Get an assignment"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments with filters"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["absence_id?", "substitute_id?", "school_id?", "status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: POST
    path: "/assignments/{id}/respond"
    description: "Owning substitute accepts or declines an offer"
    roles: [Substitute]
    code: 200
    input: [decision]
    output: Assignment
    side_effects: ["ACCEPT: OFFERED -> ACCEPTED with full validation chain and budget commit; DECLINE: OFFERED -> DECLINED and selector re-runs"]

  - method: POST
    path: "/assignments/{id}/cancel"
    description: "Cancel an OFFERED or ACCEPTED assignment"
    roles: [Substitute, SchoolCoordinator, DistrictAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["OFFERED -> CANCELLED, or ACCEPTED -> CANCELLED with budget release, reliability event (substitute self-cancel), absence reopen and re-dispatch"]

  - method: POST
    path: "/assignments/{id}/report-outcome"
    description: "Coordinator reports the worked outcome of an accepted assignment"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 200
    input: [outcome]
    output: Assignment
    side_effects: ["WORKED: ACCEPTED -> WORKED; NO_SHOW: ACCEPTED -> NO_SHOW with budget release, -25 reliability event, auto PerformanceFlag, absence reopen + re-dispatch"]

  - method: POST
    path: "/assignments/{id}/verify"
    description: "Verify a worked assignment; computes final payout"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["WORKED -> VERIFIED; final_payout_cents computed; COMPLETION event; absence -> COMPLETED"]

  - method: POST
    path: "/assignments/{id}/extend"
    description: "Extend the covered end date of an ACCEPTED or WORKED assignment (and its absence)"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 200
    input: [new_end_date]
    output: Assignment
    side_effects: ["absence.end_date extended; total_days/scheduled_days recomputed; provisional_pay_cents recomputed with committed delta adjustment; approval re-check per long-term rule"]

  # --- InternalCoverage ---
  - method: POST
    path: "/internal-coverages"
    description: "Propose internal coverage of one absence date"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 201
    input: [absence_id, staff_member_id, coverage_date, periods]
    output: InternalCoverage
    side_effects: ["status PROPOSED; capacity validated"]

  - method: GET
    path: "/internal-coverages/{id}"
    description: "Get an internal coverage"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: InternalCoverage
    side_effects: []

  - method: GET
    path: "/absences/{id}/internal-coverages"
    description: "List coverages of an absence"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "InternalCoverage[]"
    side_effects: []

  - method: GET
    path: "/staff-members/{id}/internal-coverages"
    description: "List coverages performed by a staff member"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "InternalCoverage[]"
    side_effects: []

  - method: POST
    path: "/internal-coverages/{id}/review"
    description: "District approves or rejects a proposed coverage"
    roles: [DistrictAdmin]
    code: 200
    input: [decision]
    output: InternalCoverage
    side_effects: ["APPROVE: PROPOSED -> APPROVED, absence day counters recomputed, possible UNFILLED -> COVERED_INTERNALLY; REJECT: PROPOSED -> REJECTED"]

  - method: POST
    path: "/internal-coverages/{id}/confirm-worked"
    description: "Confirm the coverage was worked; snapshots compensation"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 200
    input: []
    output: InternalCoverage
    side_effects: ["APPROVED -> WORKED; compensation_cents computed"]

  - method: POST
    path: "/internal-coverages/{id}/cancel"
    description: "Cancel a PROPOSED or APPROVED coverage"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 200
    input: []
    output: InternalCoverage
    side_effects: ["-> CANCELLED; absence day counters recomputed; possible COVERED_INTERNALLY -> UNFILLED"]

  # --- Timesheet ---
  - method: POST
    path: "/timesheets"
    description: "Substitute submits a timesheet for one worked date"
    roles: [Substitute]
    code: 201
    input: [assignment_id, work_date, hours_worked]
    output: Timesheet
    side_effects: ["status SUBMITTED"]

  - method: GET
    path: "/timesheets/{id}"
    description: "Get a timesheet"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: Timesheet
    side_effects: []

  - method: GET
    path: "/assignments/{id}/timesheets"
    description: "List timesheets of an assignment"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Timesheet[]"
    side_effects: []

  - method: GET
    path: "/payroll-periods/{id}/timesheets"
    description: "List timesheets exported in a payroll period"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Timesheet[]"
    side_effects: []

  - method: POST
    path: "/timesheets/{id}/review"
    description: "Coordinator approves or rejects a submitted timesheet"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 200
    input: [decision]
    output: Timesheet
    side_effects: ["APPROVE: SUBMITTED -> APPROVED with streak recompute and day_pay computation; REJECT: SUBMITTED -> REJECTED"]

  - method: PUT
    path: "/timesheets/{id}"
    description: "Resubmit a rejected timesheet with corrected hours"
    roles: [Substitute]
    code: 200
    input: [hours_worked]
    output: Timesheet
    side_effects: ["REJECTED -> SUBMITTED"]

  # --- PayrollPeriod ---
  - method: POST
    path: "/payroll-periods"
    description: "Open a payroll period for a district"
    roles: [PayrollClerk]
    code: 201
    input: [district_id, period_start, period_end]
    output: PayrollPeriod
    side_effects: ["status OPEN"]

  - method: GET
    path: "/payroll-periods/{id}"
    description: "Get a payroll period"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: []
    output: PayrollPeriod
    side_effects: []

  - method: GET
    path: "/payroll-periods"
    description: "List payroll periods, optionally filtered by district"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["district_id?", "limit?", "offset?"]
    output: "PayrollPeriod[]"
    side_effects: []

  - method: POST
    path: "/payroll-periods/{id}/export"
    description: "Export the period: pays verified assignments, exports timesheets, compensates worked coverages"
    roles: [PayrollClerk]
    code: 200
    input: []
    output: PayrollPeriod
    side_effects: ["payroll_waterfall runs; assignments VERIFIED -> PAID; timesheets APPROVED -> EXPORTED; coverages WORKED -> COMPENSATED; COMPLETED absences -> CLOSED; totals recorded"]

  # --- PerformanceFlag ---
  - method: POST
    path: "/performance-flags"
    description: "Raise a performance flag against a substitute; appends the reliability event immediately"
    roles: [SchoolCoordinator, DistrictAdmin]
    code: 201
    input: [substitute_id, school_id, flag_type, severity, "assignment_id?"]
    output: PerformanceFlag
    side_effects: ["Reliability event appended (FLAG_MINOR -3 / FLAG_MAJOR -10); suspension evaluation runs"]

  - method: GET
    path: "/substitutes/{id}/performance-flags"
    description: "List flags against a substitute"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "PerformanceFlag[]"
    side_effects: []

  - method: GET
    path: "/schools/{id}/performance-flags"
    description: "List flags raised by a school"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "PerformanceFlag[]"
    side_effects: []

  - method: POST
    path: "/performance-flags/{id}/review"
    description: "District resolves or escalates a flag; escalation creates a DO_NOT_RETURN mark and triggers the DNR cascade"
    roles: [DistrictAdmin]
    code: 200
    input: [decision]
    output: PerformanceFlag
    side_effects: ["RESOLVE: OPEN -> RESOLVED; ESCALATE: OPEN -> ESCALATED + DNR mark creation + DNR cascade"]

  # --- Analytics ---
  - method: GET
    path: "/analytics/fill-rate"
    description: "Fill-rate analytics grouped by school and day-of-week; both SUB_ONLY and ANY_COVERAGE variants returned"
    roles: [DistrictAdmin, SchoolCoordinator, Teacher, Substitute, PayrollClerk]
    code: 200
    input: [from_date, to_date, "school_id?"]
    output: "{ rows: array }"
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Forward jumps apply lazy expiry (offers, clearances) on the affected entities."
    roles: [DistrictAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; lazy expiry of offers/clearances applied"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / request ---
  - { id: ERR_MISSING_OR_INVALID_AUTH_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, invalid enum value, or numeric constraint (hours step, periods >= 1) violated" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_RESOURCE_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed caller does not own the target resource (wrong teacher/substitute, or coordinator of a different school)" }

  # --- Not found ---
  - { id: ERR_DISTRICT_NOT_FOUND, http: 404, condition: "district id does not exist" }
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "school id does not exist" }
  - { id: ERR_STAFF_MEMBER_NOT_FOUND, http: 404, condition: "staff member id does not exist" }
  - { id: ERR_SUBSTITUTE_NOT_FOUND, http: 404, condition: "substitute id does not exist" }
  - { id: ERR_ABSENCE_NOT_FOUND, http: 404, condition: "absence id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment id does not exist" }
  - { id: ERR_CLEARANCE_NOT_FOUND, http: 404, condition: "clearance id does not exist" }
  - { id: ERR_MARK_NOT_FOUND, http: 404, condition: "mark id does not exist" }
  - { id: ERR_COVERAGE_NOT_FOUND, http: 404, condition: "internal coverage id does not exist" }
  - { id: ERR_TIMESHEET_NOT_FOUND, http: 404, condition: "timesheet id does not exist" }
  - { id: ERR_PAYROLL_PERIOD_NOT_FOUND, http: 404, condition: "payroll period id does not exist" }
  - { id: ERR_PERFORMANCE_FLAG_NOT_FOUND, http: 404, condition: "performance flag id does not exist" }
  - { id: ERR_DISPATCH_BATCH_NOT_FOUND, http: 404, condition: "dispatch batch id does not exist" }

  # --- State ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the resource's current version (OCC)" }
  - { id: ERR_ABSENCE_INVALID_STATE, http: 409, condition: "Absence fill_status/approval_status does not allow the operation (e.g., dispatch while PENDING, cancel while ASSIGNED, review when already decided, claim while not DISPATCHING)" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment status does not allow the operation (respond on non-OFFERED, cancel on terminal, report-outcome on non-ACCEPTED, verify on non-WORKED or with SUBMITTED timesheets, extend on terminal)" }
  - { id: ERR_SUBSTITUTE_INVALID_STATE, http: 409, condition: "Substitute status does not allow the operation (activate from ACTIVE, suspend non-ACTIVE, offer/claim/accept while SUSPENDED or PENDING_CLEARANCE)" }
  - { id: ERR_CLEARANCE_INVALID_STATE, http: 409, condition: "Clearance status does not allow the operation (verify non-PENDING)" }
  - { id: ERR_MARK_INVALID_STATE, http: 409, condition: "Mark status does not allow the operation (lift non-ACTIVE)" }
  - { id: ERR_COVERAGE_INVALID_STATE, http: 409, condition: "Coverage status does not allow the operation (review non-PROPOSED, confirm-worked non-APPROVED or before coverage_date, cancel terminal)" }
  - { id: ERR_TIMESHEET_INVALID_STATE, http: 409, condition: "Timesheet status does not allow the operation (review non-SUBMITTED, resubmit non-REJECTED)" }
  - { id: ERR_PAYROLL_PERIOD_INVALID_STATE, http: 409, condition: "PayrollPeriod not OPEN, or export blocked by SUBMITTED timesheets / ACCEPTED or WORKED assignments ending inside the period" }
  - { id: ERR_PERFORMANCE_FLAG_INVALID_STATE, http: 409, condition: "PerformanceFlag status does not allow the operation (review non-OPEN)" }

  # --- Business: safety ---
  - { id: ERR_SUBSTITUTE_DO_NOT_RETURN, http: 409, condition: "ACTIVE DO_NOT_RETURN mark exists for (school, substitute)" }
  - { id: ERR_CLEARANCE_INVALID, http: 409, condition: "Required clearance missing, not VERIFIED, or expires before absence.end_date (or before today for activation/verify)" }
  - { id: ERR_QUALIFICATION_MISMATCH, http: 409, condition: "Substitute lacks the (required_subject, required_grade_band) qualification" }

  # --- Business: temporal ---
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end before start, start in the past at creation, zero weekday range, coverage/work date not a weekday inside the parent range, or period_end before period_start" }
  - { id: ERR_ABSENCE_DATE_OVERLAP, http: 409, condition: "Same staff member already has a non-cancelled absence overlapping the requested date range" }
  - { id: ERR_ASSIGNMENT_DATE_OVERLAP, http: 409, condition: "Substitute already holds an ACCEPTED/WORKED/VERIFIED assignment overlapping the requested date range" }
  - { id: ERR_COVERAGE_CAPACITY_EXCEEDED, http: 409, condition: "Coverage would push the staff member over the daily or weekly period cap" }

  # --- Business: constraint ---
  - { id: ERR_DUPLICATE_MARK, http: 409, condition: "An ACTIVE mark of the same type already exists for (school, substitute)" }
  - { id: ERR_DUPLICATE_QUALIFICATION, http: 409, condition: "Qualification already exists for (substitute, subject, grade_band)" }
  - { id: ERR_DUPLICATE_TIMESHEET, http: 409, condition: "A timesheet already exists for (assignment, work_date)" }
  - { id: ERR_TIMESHEET_OUT_OF_RANGE, http: 409, condition: "work_date outside assignment date range" }
  - { id: ERR_LONG_TERM_APPROVAL_REQUIRED, http: 409, condition: "Extension would push total_days past the approval threshold without APPROVED approval_status" }

  # --- Business: fiscal ---
  - { id: ERR_COVERAGE_BUDGET_INSUFFICIENT, http: 402, condition: "school.coverage_budget_available_cents < provisional_pay_cents at acceptance" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictAdmin
    description: "District operator; manages configuration, schools, substitute pool, clearances/qualifications, dispatch, reviews, escalations"
    identity: opaque
    exclusive_operations:
      - "POST /districts, PUT /districts/{id}"
      - "POST /schools"
      - "POST /substitutes, POST /substitutes/{id}/activate, POST /substitutes/{id}/suspend"
      - "POST /qualifications, POST /clearances, POST /clearances/{id}/verify"
      - "POST /absences/{id}/review"
      - "POST /dispatch-batches"
      - "POST /internal-coverages/{id}/review"
      - "POST /performance-flags/{id}/review"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /staff-members (with SchoolCoordinator)"
      - "POST /absences (with Teacher, SchoolCoordinator)"
      - "PUT /absences/{id}, POST /absences/{id}/cancel (with SchoolCoordinator/Teacher)"
      - "POST /assignments, POST /assignments/{id}/cancel, POST /assignments/{id}/report-outcome, POST /assignments/{id}/verify, POST /assignments/{id}/extend (with SchoolCoordinator; cancel also Substitute)"
      - "POST /marks, POST /marks/{id}/lift (with SchoolCoordinator)"
      - "POST /internal-coverages, POST /internal-coverages/{id}/confirm-worked, POST /internal-coverages/{id}/cancel (with SchoolCoordinator)"
      - "POST /performance-flags (with SchoolCoordinator)"
      - "POST /timesheets/{id}/review (with SchoolCoordinator)"

  - name: SchoolCoordinator
    description: "School-level coordinator; manages absences, offers, coverage, timesheet review for their own school"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /staff-members (own school)"
      - "POST /absences (any staff of own school), PUT /absences/{id}, POST /absences/{id}/cancel (own school)"
      - "POST /assignments, POST /assignments/{id}/cancel, /report-outcome, /verify, /extend (own school's assignments)"
      - "POST /marks, POST /marks/{id}/lift (own school)"
      - "POST /internal-coverages, POST /internal-coverages/{id}/confirm-worked, /cancel (own school)"
      - "POST /timesheets/{id}/review (own school)"
      - "POST /performance-flags (own school)"

  - name: Teacher
    description: "School staff member; reports and cancels own absences"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /absences (only with staff_member_id == X-User-ID)"
      - "POST /absences/{id}/cancel (only own absences)"

  - name: Substitute
    description: "Substitute teacher; responds to offers, claims open absences, submits timesheets"
    identity: "entity_backed:Substitute"
    exclusive_operations:
      - "POST /absences/{id}/claim"
      - "POST /assignments/{id}/respond"
      - "POST /timesheets"
      - "PUT /timesheets/{id}"
    shared_operations:
      - "All GET endpoints"
      - "POST /assignments/{id}/cancel (own assignments only; shared with coordinator/admin)"

  - name: PayrollClerk
    description: "Payroll operator; runs payroll periods"
    identity: opaque
    exclusive_operations:
      - "POST /payroll-periods"
      - "POST /payroll-periods/{id}/export"
    shared_operations:
      - "All GET endpoints"
