scaffold_corner_design:
  - section: state_machines
    instances:
      - name: record_layout_verified_to_superseded_retires_predecessor
        claim_type: valid_transition
        grounds:
          - state_machines.RecordLayout.DRAFT_or_VERIFIED_to_SUPERSEDED
          - entities.RecordLayout.fields.status
        distinguishing_aspect: "Creating a strictly higher layout_version for the same employer retires the incumbent VERIFIED layout to SUPERSEDED and bumps only the predecessor's version."
        test_recipe:
          setup:
            - "MONTHLY employer holding a VERIFIED layout_version 1"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_1: $.data.id, lay_1_v: $.data.version }
            - call: "POST /work-number/record-layouts/${lay_1}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 2, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_2: $.data.id }
          assert:
            - "RecordLayout.${lay_1}.status == SUPERSEDED"
            - "RecordLayout.${lay_2}.status == DRAFT and RecordLayout.${lay_2}.layout_version == 2"
            - "RecordLayout.${lay_1}.version advanced past the ${lay_1_v} captured at creation, because the supersede bumps the predecessor"
      - name: record_layout_draft_self_loop_revises_mapping_without_leaving_draft
        claim_type: valid_transition
        grounds:
          - state_machines.RecordLayout.DRAFT_to_DRAFT
          - entities.RecordLayout.fields.validation_error_count
        distinguishing_aspect: "Repeated PATCH calls on a DRAFT layout are admitted indefinitely and each recomputes the mapping diagnostics in place."
        test_recipe:
          setup:
            - "MONTHLY employer holding a DRAFT layout_version 1 whose column_map omits pay_rate_basis"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_1: $.data.id }
          trigger:
            - call: "PATCH /work-number/record-layouts/${lay_1}"
              payload: { column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "PATCH /work-number/record-layouts/${lay_1}"
              payload: { column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "RecordLayout.${lay_1}.status == DRAFT after both PATCH calls, proving the self-loop does not promote"
            - "RecordLayout.${lay_1}.validation_error_count == 1 and RecordLayout.${lay_1}.missing_canonical_fields == [\"pay_rate_basis\"] after the second revision"
            - "RecordLayout.${lay_1}.verified_at is null"
      - name: record_layout_verify_from_verified_is_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.RecordLayout.DRAFT_to_VERIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VERIFIED is not a from-state of the verify edge, so re-verifying a VERIFIED layout is rejected rather than idempotent."
        test_recipe:
          setup:
            - "MONTHLY employer holding an already-VERIFIED layout"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_1: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_1}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /work-number/record-layouts/${lay_1}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the second verify fails with ERR_INVALID_STATE at HTTP 409"
            - "RecordLayout.${lay_1}.status remains VERIFIED"
      - name: payroll_batch_validated_is_terminal_for_validate_and_reject
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PayrollFeedBatch.RECEIVED_to_VALIDATED
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "VALIDATED is terminal for the batch machine, so neither a second validate nor a reject can fire afterwards."
        test_recipe:
          setup:
            - "MONTHLY employer with a VERIFIED layout and a VALIDATED batch"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-05-31T00:00:00Z", record_count: 900 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/reject"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "the second validate fails with ERR_INVALID_STATE at HTTP 409"
            - "the reject also fails, with ERR_INVALID_STATE at HTTP 409, since REJECTED is only reachable from RECEIVED"
            - "PayrollFeedBatch.${bat_id}.validation_state remains VALIDATED"
      - name: verification_request_permit_from_terminal_responded_is_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.VerificationRequest.SUBMITTED_or_VALIDATED_to_RESPONDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RESPONDED is terminal for the request machine, so a further permit attempt is rejected as an invalid transition from a terminal state."
        test_recipe:
          setup:
            - "a request already materialized to RESPONDED at a MONTHLY employer"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id, wk_v: $.data.version }
            - call: "POST /work-number/verification-products"
              payload: { product_code: "MORTGAGE-I12", tier: "EMPLOYMENT_INCOME", requesting_class: "MORTGAGE", base_fee_cents: 1500, history_months_included: 12, includes_employment_status: true }
              as: PlatformAdmin
              captures: { prd_id: $.data.id }
            - call: "POST /work-number/verifiers"
              payload: { legal_name: "Meridian Home Lending", verifier_class: "MORTGAGE_LENDER", permitted_purpose: "MORTGAGE_CREDIT_DECISION", escrow_balance_cents: 6000 }
              as: PlatformAdmin
              captures: { vfr_id: $.data.id }
            - call: "POST /work-number/verifiers/${vfr_id}/accredit"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/verifiers/${vfr_id}/authorize"
              payload: {}
              as: Verifier
              as_user_id: "${vfr_id}"
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-08-31T00:00:00Z", record_count: 900 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_id}", payroll_feed_batch_id: "${bat_id}", employment_status: "ACTIVE", hire_date: "2023-01-15T00:00:00Z", separation_date: null, pay_rate_cents: 520000, pay_rate_basis: "MONTHLY", standard_hours_per_week: 40, final_pay_period_income_cents: 0 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/consumer-authorizations"
              payload: { covered_worker_id: "${wk_id}", verifier_id: "${vfr_id}", permitted_purpose: "MORTGAGE_CREDIT_DECISION", expected_covered_worker_version: "${wk_v}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { aut_id: $.data.id }
            - call: "POST /work-number/verification-requests"
              payload: { verifier_id: "${vfr_id}", covered_worker_id: "${wk_id}", product_id: "${prd_id}", permissible_purpose_asserted: "MORTGAGE_CREDIT_DECISION" }
              as: Verifier
              as_user_id: "${vfr_id}"
              captures: { req_id: $.data.id }
            - call: "POST /work-number/verification-requests/${req_id}/permit"
              payload: { consumer_authorization_id: "${aut_id}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
            - call: "POST /work-number/verification-responses"
              payload: { verification_request_id: "${req_id}" }
              as: Verifier
              as_user_id: "${vfr_id}"
          trigger:
            - call: "POST /work-number/verification-requests/${req_id}/permit"
              payload: { consumer_authorization_id: "${aut_id}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the permit fails with ERR_INVALID_STATE at HTTP 409"
            - "VerificationRequest.${req_id}.request_state remains RESPONDED"
            - "VerificationRequest.${req_id}.resolved_product_tier is unchanged by the rejected call"
      - name: record_dispute_closed_is_terminal_for_respond
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RecordDispute.RESOLVED_CORRECTED_or_RESOLVED_UPHELD_to_CLOSED
          - errors[ERR_DISPUTE_TERMINAL]
        distinguishing_aspect: "CLOSED is the RecordDispute terminal state, so a respond attempt afterwards is rejected rather than reopening the round."
        test_recipe:
          setup:
            - "a dispute resolved UPHELD and then closed by the automatic closure sweep"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-05-31T00:00:00Z", record_count: 900 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/employment-records"
              payload: { employer_id: "${emp_id}", covered_worker_id: "${wk_id}", payroll_feed_batch_id: "${bat_id}", employment_status: "ACTIVE", hire_date: "2023-01-15T00:00:00Z", separation_date: null, pay_rate_cents: 520000, pay_rate_basis: "MONTHLY", standard_hours_per_week: 40, final_pay_period_income_cents: 0 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /work-number/employment-records/${rec_id}"
              payload: {}
              as: PlatformAdmin
              captures: { rec_v: $.data.version }
            - call: "POST /work-number/record-disputes"
              payload: { employment_record_id: "${rec_id}", covered_worker_id: "${wk_id}", claimed_field: "PAY_RATE", claimed_correct_value: "480000", expected_employment_record_version: "${rec_v}" }
              as: CoveredWorker
              as_user_id: "${wk_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /work-number/record-disputes/${dsp_id}/notice"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/record-disputes/${dsp_id}/respond"
              payload: { resolution: "UPHELD" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /work-number/record-disputes/${dsp_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /work-number/record-disputes/${dsp_id}/respond"
              payload: { resolution: "UPHELD" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the dispute reads dispute_state == CLOSED after the clock passes DISPUTE_REOPEN_GRACE_DAYS 14"
            - "the respond fails with ERR_DISPUTE_TERMINAL at HTTP 409"
            - "RecordDispute.${dsp_id}.dispute_state remains CLOSED"
      - name: data_currency_review_escalate_below_stall_threshold_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DataCurrencyReview.SCORED_to_ESCALATED
          - validations[priority=6]
        distinguishing_aspect: "The escalate edge requires currency_score at or above STALL_STRIKE_THRESHOLD 300, so a healthy review cannot be escalated even though the endpoint is reachable."
        test_recipe:
          setup:
            - "MONTHLY employer whose review window is perfectly covered, so currency_score is 600"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /work-number/data-currency-reviews"
              payload: { employer_id: "${emp_id}", review_period_end: "2026-06-30T00:00:00Z", window_days: 90, last_feed_date_in_window: "2026-06-30T00:00:00Z", distinct_pay_periods_in_window: 3, expected_periods: 3 }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /work-number/data-currency-reviews/${rev_id}/escalate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the escalate fails with ERR_INVALID_STATE at HTTP 409 because currency_score is 600 and logical_now 2026-07-01 is before review_period_end is passed"
            - "DataCurrencyReview.${rev_id}.review_state remains SCORED"
      - name: contributor_accrual_paid_returns_to_accrued_on_void
        claim_type: valid_transition
        grounds:
          - state_machines.CompensationAccrual.PAID_to_ACCRUED
          - state_machines.CompensationAccrual.ACCRUED_to_PAID
        distinguishing_aspect: "The PAID to ACCRUED back edge releases paid_cents within SETTLEMENT_VOID_GRACE_DAYS 30, so the accrual becomes settleable again."
        test_recipe:
          setup:
            - "one ACCRUED accrual of 1200 records with gross_accrued_cents 12000"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/record-layouts"
              payload: { employer_id: "${emp_id}", layout_version: 1, column_map: { W_LAST4: "worker_ssn_last4", W_DOB: "worker_date_of_birth", HIRE: "hire_date", STATUS: "employment_status", RATE: "pay_rate", BASIS: "pay_rate_basis" }, fiscal_year_start_month: 1 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lay_id: $.data.id }
            - call: "POST /work-number/record-layouts/${lay_id}/verify"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/payroll-feed-batches"
              payload: { employer_id: "${emp_id}", record_layout_id: "${lay_id}", batch_sequence: 1, pay_period_end_date: "2026-05-31T00:00:00Z", record_count: 1200 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { bat_id: $.data.id }
            - call: "POST /work-number/payroll-feed-batches/${bat_id}/validate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /work-number/compensation-settlements"
              payload: { employer_id: "${emp_id}", settlement_period_end: "2026-06-30T00:00:00Z", settlement_budget_cents: 12000, waiver_budget_cents: 0, apply_blended_rate: false }
              as: PlatformAdmin
              captures: { set_id: $.data.settlement_id }
            - call: "GET /work-number/contributor-compensations"
              payload: { employer_id: "${emp_id}" }
              as: PlatformAdmin
              captures: { acc_id: "$.data[0].id" }
          trigger:
            - call: "POST /work-number/compensation-settlements/${set_id}/void"
              payload: {}
              as: PlatformAdmin
            - call: "POST /work-number/compensation-settlements"
              payload: { employer_id: "${emp_id}", settlement_period_end: "2026-07-31T00:00:00Z", settlement_budget_cents: 12000, waiver_budget_cents: 0, apply_blended_rate: false }
              as: PlatformAdmin
              captures: { set_2: $.data.settlement_id }
          assert:
            - "ContributorCompensation.${acc_id}.cycle_state == PAID after the second settlement, proving the void restored ACCRUED"
            - "the second settlement reports accrual_count == 1 and settled_gross_cents == 12000"
            - "Employer.${emp_id}.compensation_earned_cents == 12000 after the re-post, not 24000"
  - section: rbac
    instances:
      - name: verifier_cannot_validate_currency_on_another_requesting_party_request
        claim_type: ownership_denial
        grounds:
          - roles[Verifier]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_OWNERSHIP]
        distinguishing_aspect: "Verifier is entity_backed by Verifier, so acting with a different X-User-ID against a request owned by another requesting party is rejected before any state check."
        test_recipe:
          setup:
            - "requesting party Meridian owns a request at PERMITTED; requesting party Harbor exists and is authorized"
          setup_api_calls:
            - call: "POST /work-number/employers"
              payload: { legal_name: "Northwind Logistics", fein: "123456789", employer_type: "PRIVATE", payroll_frequency: "MONTHLY" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /work-number/covered-workers"
              payload: { full_name: "Dana Reyes", ssn_last4: "4417", date_of_birth: "1988-03-14" }
              as: PlatformAdmin
              captures: { wk_id: $.data.id, wk_v: $.data.version }
            - call: "POST /work-number/verification-products"
              payload: { product_code: "MORTGAGE-I12", tier: "EMPLOYMENT_INCOME", requesting_class: "MORTGAGE", base_fee_cents: 1500, history_months_included: 12, includes_employment_status: true }
              as: PlatformAdmin
