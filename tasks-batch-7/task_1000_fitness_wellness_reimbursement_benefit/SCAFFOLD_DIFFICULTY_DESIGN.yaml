            - { call: "POST /api/claims/${c1}/approve", payload: {}, as: ClaimsReviewer }
            - { call: "POST /api/claims/${c1}/pay", payload: {}, as: BenefitsAdmin }
            - { call: "POST /api/claims", payload: { enrollment_id: "${enr_id}", claim_type: "REIMBURSEMENT", service_date: "2026-05-03T10:00:00Z", receipt_ref: "R-Q2", line_items: [ { description: "q2", unit_amount_cents: 5000, quantity: 1, tax_pct: 0.0 } ] }, as: Member, as_user_id: "${m_id}", captures: { c2: $.data.id } }
