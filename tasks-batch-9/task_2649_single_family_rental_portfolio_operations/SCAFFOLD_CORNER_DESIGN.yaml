              as: AcquisitionAnalyst
              as_user_id: "analyst-1"
          assert:
            - "trigger call 1: response.http_status == 412 and response.error_id == ERR_STALE_HOME_VERSION"
            - "after trigger call 1: GET /underwriting-cases?home_id=${home_id} reports total_count == 0"
            - "trigger call 2: response.http_status == 201"
            - "trigger call 2: response.data.status == DRAFT"
            - "trigger call 2: response.data.underwritten_all_in_basis_cents == 26042176"
            - "trigger call 3: response.http_status == 201"
            - "after trigger call 3: the case created by trigger call 2 has status SUPERSEDED"
            - "after trigger call 3: Home.${home_id}.version == 2"
            - "after trigger call 3: GET /underwriting-cases?home_id=${home_id} reports total_count == 2"

      - name: identity_reverification_rejects_a_stale_prospect_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[identity-verification-stale-prospect]
          - validations[V102]
          - errors[ERR_STALE_PROSPECT_VERSION]
        distinguishing_aspect: |
          Re-verification is always legal, so the only thing standing between two verifications is the
          version: replaying the version the client read before its first verification returns 412
          ERR_STALE_PROSPECT_VERSION, the current version is accepted, and every accepted verification
          increments both Prospect.version and verification_attempt_count while leaving the recomputed
          post-verification score at 1093 for identical signals.
        test_recipe:
          setup:
            - "Market ATL exists; Prospect P1 was created at version 1 (declared income 700000, credit tier B, pre-verification score 4850)."
            - "P1's first identity verification (document match 9200, liveness true, verified income 560000, device 8800, geo 15 km) was accepted, taking her to version 2 with score 1093."
