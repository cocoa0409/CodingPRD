    input: []
    output: "{ part_id: string, as_designed_affected_count: integer, as_released_affected_count: integer, direct_parent_revision_ids: string[] }"
    side_effects: []

  # --- PartRevision ---
  - method: POST
    path: "/plm/parts/{id}/revisions"
    description: "Create a new PartRevision branched from the part (OCC on Part.version). First revision = rev_label A; later revisions branch from current released_revision_id."
    roles: [Designer]
    code: 201
    input: [expected_part_version]
    output: PartRevision
    side_effects:
      - "Assign next rev_label in sequence; lifecycle_state=WORKING"
      - "Set supersedes_revision_id = Part.released_revision_id (null for first)"
      - "Increment Part.revision_count; increment Part.version by 1"

  - method: GET
    path: "/plm/parts/{id}/revisions"
    description: "List revisions of a part (FK reverse-reachability for PartRevision.part_id)"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["lifecycle_state?", "limit?", "offset?"]
    output: "PartRevision[]"
    side_effects: []

  - method: GET
    path: "/plm/part-revisions/{id}"
    description: "Get a PartRevision"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: PartRevision
    side_effects: []

  - method: GET
    path: "/plm/part-revisions"
    description: "List PartRevisions; filter by part_id, supersedes_revision_id (FK reverse-reachability), governing_change_order_id (FK reverse-reachability), lifecycle_state"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["part_id?", "supersedes_revision_id?", "governing_change_order_id?", "lifecycle_state?", "limit?", "offset?"]
    output: "PartRevision[]"
    side_effects: []

  - method: GET
    path: "/plm/part-revisions/{id}/cost"
    description: "Computed rolled-up cost (calc bom_cost_rollup, both variants)"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: "{ part_revision_id: string, planned_cost_cents: integer, effective_cost_cents: integer }"
    side_effects: ["Recompute planned_cost_cents and effective_cost_cents"]

  - method: POST
    path: "/plm/part-revisions/{id}/submit-review"
    description: "Submit a WORKING revision for review"
    roles: [Designer]
    code: 200
    input: []
    output: PartRevision
    side_effects: ["lifecycle_state WORKING -> IN_REVIEW", "recompute costs"]

  - method: POST
    path: "/plm/part-revisions/{id}/return-to-work"
    description: "Return an IN_REVIEW revision to WORKING"
    roles: [Designer]
    code: 200
    input: []
    output: PartRevision
    side_effects: ["lifecycle_state IN_REVIEW -> WORKING"]

  # --- BomLine ---
  - method: POST
    path: "/plm/part-revisions/{id}/bom-lines"
    description: "Add a BOM line to a WORKING PartRevision (OCC on PartRevision.version; cycle-checked)"
    roles: [Designer]
    code: 201
    input: [child_part_id, quantity, "scrap_factor?", "reference_designator?", expected_part_revision_version]
    output: BomLine
    side_effects:
      - "Append BomLine; increment PartRevision.version by 1"
      - "Reject with ERR_BOM_CYCLE if the edge introduces a BOM cycle"

  - method: GET
    path: "/plm/part-revisions/{id}/bom-lines"
    description: "List BOM lines of a revision (FK reverse-reachability for BomLine.parent_revision_id)"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "BomLine[]"
    side_effects: []

  - method: GET
    path: "/plm/bom-lines/{id}"
    description: "Get a single BOM line"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: []
    output: BomLine
    side_effects: []

  - method: GET
    path: "/plm/bom-lines"
    description: "List BOM lines; filter by child_part_id (FK reverse-reachability for BomLine.child_part_id; this is the where-used edge query) and parent_revision_id"
    roles: [Designer, ChangeAdmin, Approver, QualityEngineer, SupplierManager, Viewer]
    code: 200
    input: ["child_part_id?", "parent_revision_id?", "limit?", "offset?"]
    output: "BomLine[]"
    side_effects: []

  # --- EngineeringChangeRequest ---
  - method: POST
    path: "/plm/change-requests"
    description: "Create an ECR (DRAFT)"
    roles: [Designer]
    code: 201
    input: [title, affected_part_id, reason_code]
    output: EngineeringChangeRequest
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/plm/change-requests/{id}"
    description: "Get an ECR"
