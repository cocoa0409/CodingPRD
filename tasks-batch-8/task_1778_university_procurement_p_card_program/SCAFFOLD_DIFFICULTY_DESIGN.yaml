# =============================================================================
# task_1778 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 25 instances across the nine §0.5 rules; every instance grounds in SCAFFOLD.yaml
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: grant_remaining_provisional_vs_settled
        grounds:
          - calculations.grant_budget_ledger
          - calculations.grant_charge
          - entities.Grant.fields.provisional_remaining_cents
          - entities.Grant.fields.settled_remaining_cents
        distinguishing_aspect: |
          Grant-domain dual variant: with an identical ledger (one approved grant-funded
          requisition), provisional_remaining_cents subtracts the encumbrance while
          settled_remaining_cents ignores it (8,944,000 vs 10,000,000); the variants
          converge only after the PO's invoice is paid (both 8,944,000).
        test_recipe:
          setup:
            - "Department, ACTIVE vendor, ACTIVE grant G (award 10,000,000, F&A 0.52, cap 500,000, categories SUPPLIES+EQUIPMENT)"
            - "Grant-funded requisition R (SUPPLIES 2x150,000 + EQUIPMENT 1x600,000 = 900,000 direct) fully APPROVED; charge = 900,000 + round_half_up(0.52*(900,000-600,000)) = 1,056,000"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Chemistry", cost_center: "CC-100", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "LabCorp" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "NSF-001", sponsor: "NSF", total_award_cents: 10000000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES", "EQUIPMENT"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", lines: [{ commodity_code: "LAB", description: "supplies", quantity: 2, unit_price_cents: 150000, cost_category: "SUPPLIES" }, { commodity_code: "LAB", description: "centrifuge", quantity: 1, unit_price_cents: 600000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
          trigger:
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { spent_1: $.data.spent_cents, enc_1: $.data.encumbered_cents, prov_1: $.data.provisional_remaining_cents, sett_1: $.data.settled_remaining_cents }
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 2 }, { line_no: 1, quantity: 1 }] }
              as: ReceivingClerk
            - call: "POST /purchase-orders/${po_id}/invoices"
              payload: { invoice_number: "INV-1", lines: [{ line_no: 0, quantity: 2, unit_price_cents: 150000 }, { line_no: 1, quantity: 1, unit_price_cents: 600000 }] }
              as: APClerk
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/pay"
              as: APClerk
              as_user_id: "ap-1"
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { spent_2: $.data.spent_cents, enc_2: $.data.encumbered_cents, prov_2: $.data.provisional_remaining_cents, sett_2: $.data.settled_remaining_cents }
          assert:
            - "ledger after approval: spent_cents == 0, encumbered_cents == 1056000"
            - "ledger after approval: provisional_remaining_cents == 8944000 and settled_remaining_cents == 10000000 (variants diverge by exactly the encumbrance)"
            - "ledger after pay: spent_cents == 1056000, encumbered_cents == 0"
            - "ledger after pay: provisional_remaining_cents == 8944000 and settled_remaining_cents == 8944000 (variants converge once settled)"

      - name: diversity_ratio_committed_vs_paid_basis
        grounds:
          - calculations.diversity_spend_ratio
          - entities.PurchaseOrder.fields.issued_at
          - entities.Invoice.fields.paid_at
        distinguishing_aspect: |
          Spend-analytics dual variant (different entity domain from the grant ledger):
          the same two POs (400,000 to a WBE vendor, 600,000 to a non-diverse vendor)
          yield ratio 0.4000 on the COMMITTED basis but 0.0000 on the PAID basis until
          the diverse-vendor invoice is paid; after payment both bases read 0.4000.
        test_recipe:
          setup:
            - "Department (goal 0.25); vendor V1 WBE+GOLD; vendor V2 NONE+NONE"
            - "Req A to V1 total 400,000 APPROVED and issued (PO-A); Req B to V2 total 600,000 APPROVED and issued (PO-B); both fully received and invoiced at exact price; only invoice B PAID"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Biology", cost_center: "CC-200", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "DiverseCo", diversity_certification: "WBE", sustainability_tier: "GOLD" }
              as: Buyer
              captures: { v1_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "PlainCo" }
              as: Buyer
              captures: { v2_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v1_id}", lines: [{ commodity_code: "OFF", description: "chairs", quantity: 1, unit_price_cents: 400000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { ra_id: $.data.id }
            - call: "POST /requisitions/${ra_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${ra_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${ra_id}/issue-po"
              as: Buyer
              captures: { poa_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v2_id}", lines: [{ commodity_code: "OFF", description: "desks", quantity: 1, unit_price_cents: 600000, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { rb_id: $.data.id }
            - call: "POST /requisitions/${rb_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${rb_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${rb_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /requisitions/${rb_id}/issue-po"
              as: Buyer
              captures: { pob_id: $.data.id }
            - call: "POST /purchase-orders/${poa_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
            - call: "POST /purchase-orders/${poa_id}/invoices"
              payload: { invoice_number: "INV-A", lines: [{ line_no: 0, quantity: 1, unit_price_cents: 400000 }] }
              as: APClerk
              captures: { inva_id: $.data.id }
            - call: "POST /purchase-orders/${pob_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }] }
              as: ReceivingClerk
            - call: "POST /purchase-orders/${pob_id}/invoices"
              payload: { invoice_number: "INV-B", lines: [{ line_no: 0, quantity: 1, unit_price_cents: 600000 }] }
              as: APClerk
              captures: { invb_id: $.data.id }
            - call: "POST /invoices/${invb_id}/pay"
              as: APClerk
              as_user_id: "ap-1"
          trigger:
            - call: "GET /departments/${d_id}/diversity-report"
              payload: { basis: "COMMITTED" }
              as: ProcurementAdmin
              captures: { div_c: $.data.diverse_spend_cents, tot_c: $.data.total_spend_cents, rat_c: $.data.ratio, met_c: $.data.goal_met }
            - call: "GET /departments/${d_id}/diversity-report"
              payload: { basis: "PAID" }
              as: ProcurementAdmin
              captures: { div_p: $.data.diverse_spend_cents, tot_p: $.data.total_spend_cents, rat_p: $.data.ratio, met_p: $.data.goal_met }
            - call: "POST /invoices/${inva_id}/pay"
              as: APClerk
              as_user_id: "ap-1"
            - call: "GET /departments/${d_id}/diversity-report"
              payload: { basis: "PAID" }
              as: ProcurementAdmin
              captures: { div_p2: $.data.diverse_spend_cents, tot_p2: $.data.total_spend_cents, rat_p2: $.data.ratio, met_p2: $.data.goal_met }
          assert:
            - "COMMITTED basis: diverse_spend_cents == 400000, total_spend_cents == 1000000, ratio == 0.4000, goal_met == true"
            - "PAID basis before paying invoice A: diverse_spend_cents == 0, total_spend_cents == 600000, ratio == 0.0000, goal_met == false (same purchases, divergent result)"
            - "PAID basis after paying invoice A: diverse_spend_cents == 400000, total_spend_cents == 1000000, ratio == 0.4000, goal_met == true"

  - rule_id: combinatorial_formula
    instances:
      - name: approval_chain_multi_input_assembly
        grounds:
          - calculations.approval_chain_resolution
          - entities.Requisition.fields.required_chain
        distinguishing_aspect: |
          Mode (a) combinatorial: the chain is assembled from three interacting inputs
          (total tier, grant funding, sole-source request) with a pinned insertion order;
          a 2,500,000-cent grant-funded sole-source requisition yields exactly
          [DEPARTMENT, GRANT_COMPLIANCE, SOLE_SOURCE, PURCHASING, DIRECTOR] and steps
          can only be decided in that order.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); ACTIVE vendor; ACTIVE grant (award 10,000,000, F&A 0.52, cap 500,000, categories SUPPLIES+EQUIPMENT)"
            - "Requisition R: 5 x EQUIPMENT @ 500,000 = 2,500,000 total, grant-funded, sole_source_requested with justification"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Physics", cost_center: "CC-300", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "SoleSourceInc" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "DOE-7", sponsor: "DOE", total_award_cents: 10000000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES", "EQUIPMENT"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g_id}", sole_source_requested: true, sole_source_justification: "only manufacturer of the cryostat", lines: [{ commodity_code: "PHY", description: "cryostat", quantity: 5, unit_price_cents: 500000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { chain: $.data.required_chain }
          trigger:
            - call: "POST /requisitions/${r_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
              captures: { err: $.data.error_id }
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: ProcurementDirector
              as_user_id: "director-1"
              captures: { ss_flag: $.data.sole_source_approved }
            - call: "POST /requisitions/${r_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: ProcurementDirector
              as_user_id: "director-1"
              captures: { final_status: $.data.status }
            - call: "GET /grants/${g_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { enc: $.data.encumbered_cents }
          assert:
            - "Requisition.${r_id}.required_chain == [DEPARTMENT, GRANT_COMPLIANCE, SOLE_SOURCE, PURCHASING, DIRECTOR] (exact order)"
            - "Buyer attempt at step 0 rejected: err == ERR_APPROVAL_STEP_MISMATCH (current step is DEPARTMENT)"
            - "after SOLE_SOURCE step: sole_source_approved == true"
            - "final approve: status == APPROVED; charge_cents == 3800000 (2,500,000 + round_half_up(0.52*2,500,000)); grant encumbered_cents == 3800000"

      - name: three_way_match_per_line_rounding_order
        grounds:
          - calculations.three_way_match
          - entities.Invoice.fields.total_tolerance_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: per-line tolerances round to 5, 3, 3 cents (raw
          5.0, 2.5, 2.5) so the pinned per-line-then-sum tolerance is 11 and the
          invoice with total variance 11 is PAYABLE; a sum-then-round implementation
          computes tolerance 10 and would wrongly land the invoice in EXCEPTION.
        test_recipe:
          setup:
            - "Department, vendor; requisition with 3 lines (250c x1, 125c x1, 125c x1) APPROVED and issued; all 3 lines fully received"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Art", cost_center: "CC-400", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "SupplyCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", lines: [{ commodity_code: "ART", description: "canvas", quantity: 1, unit_price_cents: 250, cost_category: "SUPPLIES" }, { commodity_code: "ART", description: "brushes", quantity: 1, unit_price_cents: 125, cost_category: "SUPPLIES" }, { commodity_code: "ART", description: "easels", quantity: 1, unit_price_cents: 125, cost_category: "SUPPLIES" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r_id: $.data.id }
            - call: "POST /requisitions/${r_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
            - call: "POST /requisitions/${r_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r_id}/issue-po"
              as: Buyer
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/receipts"
              payload: { lines: [{ line_no: 0, quantity: 1 }, { line_no: 1, quantity: 1 }, { line_no: 2, quantity: 1 }] }
              as: ReceivingClerk
          trigger:
            - call: "POST /purchase-orders/${po_id}/invoices"
              payload: { invoice_number: "INV-R", lines: [{ line_no: 0, quantity: 1, unit_price_cents: 255 }, { line_no: 1, quantity: 1, unit_price_cents: 128 }, { line_no: 2, quantity: 1, unit_price_cents: 128 }] }
              as: APClerk
              captures: { inv_status: $.data.status, inv_var: $.data.total_variance_cents, inv_tol: $.data.total_tolerance_cents, inv_reason: $.data.exception_reason }
          assert:
            - "Invoice.status == PAYABLE (per-line v = [5,3,3] within per-line t = [5,3,3]; totals 11 <= 11)"
            - "Invoice.total_variance_cents == 11 and total_tolerance_cents == 11 (round-half-up per line BEFORE summation: 2.5 -> 3 twice)"
            - "Invoice.exception_reason == NONE"

      - name: grant_charge_pinned_evaluation_order
        grounds:
          - calculations.grant_charge
          - entities.Grant.fields.equipment_cap_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order over a circular-looking dependency: equipment
          classification (strictly-over-cap) feeds the indirect base, the indirect feeds
          the charge, and the budget check compares the CHARGE — an EQUIPMENT unit at
          exactly 500,000 is NOT excluded (charge 1,216,000, budget fails at 402), while
          500,001 IS excluded (charge 956,001, approval succeeds).
        test_recipe:
          setup:
            - "Department (limit 10,000,000); vendor; grant G1 award 1,000,000 (F&A 0.52, cap 500,000, SUPPLIES+EQUIPMENT); grant G2 award 2,000,000 (same rates)"
            - "R1 on G1: SUPPLIES 2x150,000 + EQUIPMENT 1x500,000 (= cap, not excluded): direct 800,000, indirect 416,000, charge 1,216,000 > 1,000,000"
            - "R2 on G2: SUPPLIES 2x150,000 + EQUIPMENT 1x500,001 (> cap, excluded): direct 800,001, indirect round(0.52*300,000)=156,000, charge 956,001"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Engineering", cost_center: "CC-500", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
              as: ProcurementAdmin
              captures: { d_id: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "EquipCo" }
              as: Buyer
              captures: { v_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "G1", sponsor: "NIH", total_award_cents: 1000000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES", "EQUIPMENT"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g1_id: $.data.id }
            - call: "POST /grants"
              payload: { grant_code: "G2", sponsor: "NIH", total_award_cents: 2000000, f_and_a_rate: 0.52, allowed_categories: ["SUPPLIES", "EQUIPMENT"], budget_start: "2026-01-01T00:00:00Z", budget_end: "2027-12-31T00:00:00Z" }
              as: GrantOfficer
              captures: { g2_id: $.data.id }
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g1_id}", lines: [{ commodity_code: "ENG", description: "parts", quantity: 2, unit_price_cents: 150000, cost_category: "SUPPLIES" }, { commodity_code: "ENG", description: "lathe", quantity: 1, unit_price_cents: 500000, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_id: $.data.id }
            - call: "POST /requisitions/${r1_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { r1_charge: $.data.charge_cents }
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
            - call: "POST /requisitions"
              payload: { department_id: "${d_id}", requester_id: "req-user-1", vendor_id: "${v_id}", grant_id: "${g2_id}", lines: [{ commodity_code: "ENG", description: "parts", quantity: 2, unit_price_cents: 150000, cost_category: "SUPPLIES" }, { commodity_code: "ENG", description: "lathe+", quantity: 1, unit_price_cents: 500001, cost_category: "EQUIPMENT" }] }
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_id: $.data.id }
            - call: "POST /requisitions/${r2_id}/submit"
              as: Requester
              as_user_id: "req-user-1"
              captures: { r2_charge: $.data.charge_cents }
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: DepartmentApprover
              as_user_id: "dept-approver-1"
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: GrantOfficer
              as_user_id: "grant-officer-1"
            - call: "POST /requisitions/${r2_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
              captures: { r2_status: $.data.status }
          trigger:
            - call: "POST /requisitions/${r1_id}/approve-step"
              as: Buyer
              as_user_id: "buyer-1"
              captures: { err: $.data.error_id }
            - call: "GET /requisitions/${r1_id}"
              as: ProcurementAdmin
              captures: { r1_status: $.data.status }
            - call: "GET /grants/${g1_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { g1_enc: $.data.encumbered_cents }
            - call: "GET /grants/${g2_id}/budget-ledger"
              as: ProcurementAdmin
              captures: { g2_enc: $.data.encumbered_cents }
          assert:
            - "R1 charge_cents == 1216000 (unit 500,000 == cap is NOT excluded: indirect on the full 800,000)"
            - "R1 final-step approve fails: err == ERR_GRANT_BUDGET_EXCEEDED; R1 stays SUBMITTED; G1 encumbered_cents == 0 (a direct-only check of 800,000 <= 1,000,000 would wrongly pass)"
            - "R2 charge_cents == 956001 (unit 500,001 > cap IS excluded: indirect on 300,000 only)"
            - "R2 status == APPROVED; G2 encumbered_cents == 956001"

  - rule_id: non_linear_state_machine
    instances:
      - name: requisition_return_resubmit_cycle_resets_chain
        grounds:
          - state_machines.Requisition.RETURNED_to_SUBMITTED
          - state_machines.Requisition.SUBMITTED_to_RETURNED
          - calculations.approval_chain_resolution
        distinguishing_aspect: |
          Cyclic machine on Requisition: a RETURNED requisition is edited (total drops
          600,000 -> 400,000) and resubmitted; the resubmit RE-COMPUTES the pinned chain
          (dropping PURCHASING) while the audit trail retains the first cycle's RETURNED
          record, and every mutation increments version.
        test_recipe:
          setup:
            - "Department (limit 10,000,000); ACTIVE vendor; requisition created at total 600,000 (chain [DEPARTMENT, PURCHASING]), submitted, then returned at the DEPARTMENT step"
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Music", cost_center: "CC-600", diversity_goal_pct: 0.25, sustainability_goal_pct: 0.20, default_approval_limit_cents: 10000000 }
