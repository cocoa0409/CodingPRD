scenario: |
  Generate task harder than expert level!

  2589. Certificate Authority Operations (public certificate authority): certificate profile management by type with validation requirements for domain, organization and extended validation, domain control validation methods with approved techniques and reuse period limits, organizational vetting with registry verification, callback confirmation and applicant authority checks, issuance systems operating under audited key ceremony and hardware security module controls, certificate transparency log submission with monitoring for misissuance, revocation processing with reason codes, revocation list and status service availability requirements, incident response for misissuance with disclosure timelines and mass revocation obligations, annual audits against browser root program requirements and root program communication
domain_name: "certificate-authority-operations"
api_prefix: "/ca"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every business resource is addressed as a peer collection under /ca/<collection>.
  # Parent-child relationships are expressed by FK fields on the child, never by
  # deep URL nesting: creation sub-paths (POST /ca/subscribers/{id}/...) exist only
  # where the parent supplies the FK, and reads are peer collections with FK filters.

  state_machine_shape: cyclic
  # CertificateRequest cycles SUBMITTED -> DRAFT -> SUBMITTED (return-for-more-info)
  # and READY_TO_ISSUE -> ISSUANCE_BLOCKED -> READY_TO_ISSUE (posture gate);
  # DomainAuthorization cycles PENDING -> FAILED -> PENDING and VALIDATED -> PENDING;
  # Certificate carries two independent state dimensions (lifecycle_status x
  # revocation_status); OrganizationVetting is compound over three check dimensions;
  # RootProgramAudit forks FIELDWORK -> {QUALIFIED, UNQUALIFIED} with divergent
  # side-effect sets.

  relationship_patterns:
    - one_to_many          # Subscriber -> DomainAuthorization / CertificateRequest / Certificate
    - self_referential     # Certificate.supersedes_certificate_id -> Certificate.id
    - cross_aggregate      # Certificate.ceremony_id -> KeyCeremony (issuance-control aggregate)
    - polymorphic          # RootProgramCommunication attaches to an incident OR an audit

  role_model: segregation_of_duties
  # The X-User-ID that cleared validation may not issue; the X-User-ID that ran a
  # vetting check may not approve that vetting; a ceremony witness may not attest it.

  consistency_model: immediate

difficulty_level: expert_plus
# 14 entities / 55 endpoints / 52 error codes / 8 calculations (3 with variants) /
# 11 state machines. Density, not volume, is the point: issuance is gated by five
# independent aggregates (profile posture, subscriber account, org vetting, domain
# authorization freshness, HSM/ceremony attestation) and every revocation path
# feeds a conserved-quantity ledger that CRL publication must drain exactly.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: CertificateProfile
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable profile name, unique across profiles"
        constraints: "1..80 chars; unique (case-insensitive)"
      - name: validation_type
        type: enum
        source: input
        description: "Validation tier this profile issues under"
        constraints: "DV | OV | EV"
      - name: status
        type: enum
        source: system
        description: "Profile lifecycle state"
        default: DRAFT
        constraints: "DRAFT | ACTIVE | RETIRED"
      - name: status_service_posture
        type: enum
        source: computed
        description: "Revocation-status-service posture derived from pending_crl_entry_count vs crl_trigger_threshold; NOMINAL permits issuance, CRL_OVERDUE blocks it"
        default: NOMINAL
        constraints: "NOMINAL | CRL_OVERDUE"
      - name: max_validity_days
        type: integer
        source: input
        description: "Hard cap on certificate validity in days for this profile"
        constraints: "1..398"
      - name: dcv_reuse_days
        type: integer
        source: input
        description: "Domain control validation reuse period in days; a validated DomainAuthorization for this profile expires validated_at + dcv_reuse_days"
        constraints: "1..398"
      - name: max_dcv_reuse_count
        type: integer
        source: input
        description: "Maximum number of certificate requests a single validated DomainAuthorization may be consumed by"
        constraints: "1..50"
      - name: org_vetting_reuse_days
        type: integer
        source: input
        description: "Organizational vetting reuse period in days; required when validation_type is OV or EV, ignored for DV"
        default: 0
        constraints: "0 for DV; 1..825 for OV/EV"
      - name: allowed_dcv_methods
        type: array
        source: input
        description: "Approved domain control validation techniques for this profile"
        constraints: "non-empty subset of {DNS_TXT, HTTP_TOKEN, EMAIL_APPROVAL, TLS_ALPN}; no duplicates"
      - name: required_sct_count
        type: integer
        source: input
        description: "Minimum number of distinct certificate transparency logs that must have returned an accepted SCT before a certificate may be activated"
        constraints: "0..5"
      - name: required_vetting_level
        type: enum
        source: computed
        description: "Vetting level a subscriber must hold to use this profile; derived from validation_type (DV->NONE, OV->OV, EV->EV)"
        constraints: "NONE | OV | EV"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Per-domain base issuance fee in cents before validation-tier multiplier"
        constraints: "1..10000000"
      - name: crl_trigger_threshold
        type: integer
        source: input
        description: "Number of unpublished revocations that flips status_service_posture to CRL_OVERDUE"
        constraints: "1..1000"
      - name: max_crl_validity_hours
        type: integer
        source: input
        description: "Maximum permitted (next_update - this_update) span for a CRL published under this profile"
        constraints: "1..240"
      - name: pending_crl_entry_count
        type: integer
        source: computed
        description: "Count of certificates of this profile with revocation_status REVOKED and crl_published_at null"
        default: 0
      - name: revoked_certificate_count
        type: integer
        source: computed
        description: "Lifetime count of certificates of this profile that reached revocation_status REVOKED"
        default: 0
      - name: total_crl_entries_published
        type: integer
        source: computed
        description: "Running sum of entry_count over every CrlPublication of this profile"
        default: 0
      - name: last_crl_number
        type: integer
        source: computed
        description: "crl_number of the most recent CrlPublication of this profile; 0 when none published"
        default: 0
      - name: last_crl_this_update
        type: datetime
        source: computed
        description: "this_update of the most recent CrlPublication of this profile; null when none published"
      - name: last_crl_next_update
        type: datetime
        source: computed
        description: "next_update of the most recent CrlPublication of this profile; null when none published"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical clock instant at which status became ACTIVE; null while DRAFT"
      - name: retired_at
        type: datetime
        source: system
        description: "Logical clock instant at which status became RETIRED; null otherwise"

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the applicant organization"
        constraints: "1..160 chars"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Incorporation jurisdiction code used for registry verification"
        constraints: "2..6 uppercase chars"
      - name: registry_id
        type: string
        source: input
        description: "Business registry identifier asserted by the applicant"
        constraints: "1..40 chars"
      - name: contact_email
        type: string
        source: input
        description: "Verified contact address used for EMAIL_APPROVAL domain validation"
        constraints: "must contain '@'"
      - name: callback_phone
        type: string
        source: input
        description: "Registry-listed telephone number used for the vetting callback confirmation"
        constraints: "5..24 chars"
      - name: account_status
        type: enum
        source: system
        description: "Subscriber account posture; only ACTIVE subscribers may submit requests, validate domains or receive certificates"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | TERMINATED"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum permitted outstanding_balance_cents after an issuance charge"
        default: 500000
        constraints: "0..100000000"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Conserved money ledger: sum of Certificate.charged_amount_cents over this subscriber's certificates whose refunded_at is null"
        default: 0
      - name: issued_certificate_count
        type: integer
        source: computed
        description: "Lifetime count of certificates issued to this subscriber (never decremented)"
        default: 0
      - name: revocation_pending_count
        type: integer
        source: computed
        description: "Count of this subscriber's certificates with revocation_status REVOCATION_PENDING"
        default: 0
      - name: risk_score_operational
        type: integer
        source: computed
        description: "Operational variant of subscriber_risk_score, recomputed on every incident state change"
        default: 0
      - name: risk_score_audit_final
        type: number
        source: computed
        description: "Audit-final variant of subscriber_risk_score, written only by a RootProgramAudit opinion; null until the first opinion covers this subscriber"
      - name: suspended_at
        type: datetime
        source: system
        description: "Logical clock instant at which account_status became SUSPENDED; null otherwise"

  - name: OrganizationVetting
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; taken from the creation path, never from the body"
      - name: required_level
        type: enum
        source: input
        description: "Vetting depth this record performs; OV needs registry+callback, EV additionally needs applicant authority"
        constraints: "OV | EV"
      - name: registry_check_status
        type: enum
        source: computed
        description: "Outcome dimension for business-registry verification of legal_name/registry_id/jurisdiction_code"
        default: NOT_STARTED
        constraints: "NOT_STARTED | PASSED | FAILED"
      - name: callback_check_status
        type: enum
        source: computed
        description: "Outcome dimension for the registry-listed telephone callback confirmation"
        default: NOT_STARTED
        constraints: "NOT_STARTED | PASSED | FAILED"
      - name: authority_check_status
        type: enum
        source: computed
        description: "Outcome dimension for the applicant-authority check; only required when required_level is EV"
        default: NOT_STARTED
        constraints: "NOT_STARTED | PASSED | FAILED"
      - name: registry_checked_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ValidationSpecialist that recorded the registry check; null until recorded"
      - name: callback_checked_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ValidationSpecialist that recorded the callback check; null until recorded"
      - name: authority_checked_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ValidationSpecialist that recorded the authority check; null until recorded"
      - name: vetting_state
        type: enum
        source: computed
        description: "Compound state derived from the three check dimensions plus the approval act"
        default: PENDING
        constraints: "PENDING | IN_PROGRESS | AWAITING_APPROVAL | APPROVED | REJECTED"
      - name: approved_at
        type: datetime
        source: system
        description: "Logical clock instant of approval; the org vetting reuse window is measured from this instant"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approving ValidationSpecialist; must differ from every *_checked_by_user_id"
      - name: rejected_at
        type: datetime
        source: system
        description: "Logical clock instant at which a FAILED check drove vetting_state to REJECTED"

  - name: DomainAuthorization
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; taken from the creation path"
      - name: profile_id
        type: string
        source: input
        description: "FK -> CertificateProfile.id; the profile whose allowed_dcv_methods and dcv_reuse_days govern this authorization"
      - name: domain_name
        type: string
        source: input
        description: "Fully qualified domain name under validation"
        constraints: "lowercase, 4..253 chars, at least one dot, no leading/trailing dot"
      - name: method
        type: enum
        source: input
        description: "Domain control validation technique used"
        constraints: "DNS_TXT | HTTP_TOKEN | EMAIL_APPROVAL | TLS_ALPN; must be in profile.allowed_dcv_methods"
      - name: challenge_token
        type: string
        source: system
        description: "Server-minted challenge value the applicant must echo back on validate; deterministic per authorization"
      - name: state
        type: enum
        source: system
        description: "Authorization lifecycle state"
        default: PENDING
        constraints: "PENDING | VALIDATED | FAILED | EXHAUSTED | EXPIRED"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of validate attempts made against this authorization"
        default: 0
      - name: validated_at
        type: datetime
        source: system
        description: "Logical clock instant of the successful validate; null unless the authorization has ever been VALIDATED"
      - name: expires_at
        type: datetime
        source: computed
        description: "validated_at + profile.dcv_reuse_days days; the reuse window is half-open [validated_at, expires_at)"
      - name: reuse_count
        type: integer
        source: computed
        description: "Number of certificate requests that have consumed this authorization at clear-validation"
        default: 0
      - name: invalidated_at
        type: datetime
        source: system
        description: "Logical clock instant of the most recent ComplianceOfficer invalidation, which returns the authorization to PENDING with a fresh challenge_token; null when never invalidated"
      - name: invalidation_count
        type: integer
        source: computed
        description: "Number of times this authorization has been invalidated and re-opened for validation"
        default: 0

  - name: CertificateRequest
    parent: null
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; the applicant"
      - name: profile_id
        type: string
        source: input
        description: "FK -> CertificateProfile.id; must be a profile with status ACTIVE at submit time"
      - name: requested_domains
        type: array
        source: input
        description: "Domain names to be covered by the certificate"
        constraints: "1..10 lowercase FQDNs, no duplicates"
      - name: requested_validity_days
        type: integer
        source: input
        description: "Requested validity span in days; capped by profile.max_validity_days"
        constraints: "1..398"
      - name: expedited
        type: boolean
        source: input
        description: "When true the issuance charge carries the expedite fee"
        default: false
      - name: csr_key_bits
        type: integer
        source: input
        description: "RSA modulus size asserted in the certificate signing request"
        constraints: "2048 | 3072 | 4096"
      - name: state
        type: enum
        source: system
        description: "Request workflow state"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | READY_TO_ISSUE | ISSUANCE_BLOCKED | ISSUED | REJECTED | WITHDRAWN"
      - name: return_count
        type: integer
        source: computed
        description: "Number of times the request has been returned from SUBMITTED to DRAFT for more information"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical clock instant of the most recent submit"
      - name: validation_cleared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ValidationSpecialist that cleared validation; the issuing IssuanceOfficer must not equal it"
      - name: validation_cleared_at
        type: datetime
        source: system
        description: "Logical clock instant at which validation was cleared"
      - name: consumed_authorization_ids
        type: array
        source: computed
        description: "Ids of the DomainAuthorization records selected at clear-validation, one per requested domain, in requested_domains order"
        default: []
      - name: projected_not_before
        type: datetime
        source: computed
        description: "PROJECTED_AT_CLEARANCE variant of certificate_validity_window: the logical clock at clear-validation"
      - name: projected_not_after
        type: datetime
        source: computed
        description: "PROJECTED_AT_CLEARANCE variant of certificate_validity_window; ignores domain-authorization and attestation caps"
      - name: projected_charge_cents
        type: integer
        source: computed
        description: "issuance_charge_settlement evaluated at clear-validation; the fiscal gate compares this against the subscriber's remaining credit"
      - name: issued_certificate_id
        type: string
        source: system
        description: "FK -> Certificate.id; set when the request reaches ISSUED, null before"
      - name: rejected_reason
        type: string
        source: input
        description: "Free-text reason recorded on reject or on the third return; null otherwise"
      - name: blocked_reason
        type: enum
        source: system
        description: "Why the request sits in ISSUANCE_BLOCKED; null when not blocked"
        constraints: "PROFILE_STATUS_SERVICE_OVERDUE"

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: system
        description: "Monotonic decimal serial minted at issuance; the first certificate is '1000001' and each subsequent issuance is the previous serial plus one. Deterministic, never random."
      - name: request_id
        type: string
        source: system
        description: "FK -> CertificateRequest.id; the request this certificate was minted from"
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; copied from the request"
      - name: profile_id
        type: string
        source: system
        description: "FK -> CertificateProfile.id; copied from the request"
      - name: ceremony_id
        type: string
        source: input
        description: "FK -> KeyCeremony.id; the attested key ceremony whose HSM partition signed this certificate"
      - name: supersedes_certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; optional self-reference to the certificate this one replaces, which must belong to the same subscriber"
      - name: lifecycle_status
        type: enum
        source: system
        description: "First independent state dimension: pre-issuance staging, publicly usable, or past not_after"
        default: PREISSUANCE
        constraints: "PREISSUANCE | ISSUED | EXPIRED"
      - name: revocation_status
        type: enum
        source: system
        description: "Second independent state dimension, evolving separately from lifecycle_status"
        default: NONE
        constraints: "NONE | REVOCATION_PENDING | REVOKED"
      - name: not_before
        type: datetime
        source: computed
        description: "FINAL_AT_ISSUANCE variant of certificate_validity_window: logical clock at issuance"
      - name: not_after
        type: datetime
        source: computed
        description: "FINAL_AT_ISSUANCE variant of certificate_validity_window: min of profile/request cap, earliest consumed authorization expires_at, and ceremony attestation_expires_at"
      - name: validity_days_final
        type: integer
        source: computed
        description: "floor((not_after - not_before) / 86400 seconds)"
      - name: dcv_methods_used
        type: array
        source: computed
        description: "Distinct DomainAuthorization.method values of the authorizations consumed by the originating request, sorted ascending alphabetically"
      - name: sct_count
        type: integer
        source: computed
        description: "Count of distinct CtLogSubmission.log_operator values with outcome ACCEPTED for this certificate"
        default: 0
      - name: charged_amount_cents
        type: integer
        source: computed
        description: "issuance_charge_settlement total evaluated at issuance"
      - name: refunded_at
        type: datetime
        source: system
        description: "Logical clock instant at which the issuance charge was credited back by a compensating pre-issuance SUPERSEDED revocation; null otherwise"
      - name: activated_at
        type: datetime
        source: system
        description: "Logical clock instant at which lifecycle_status became ISSUED; null while PREISSUANCE"
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical clock instant at which revocation_status became REVOKED; null otherwise"
      - name: revocation_reason_code
        type: enum
        source: system
        description: "Reason code copied from the executed RevocationRequest; null while never revoked"
        constraints: "UNSPECIFIED | KEY_COMPROMISE | AFFILIATION_CHANGED | SUPERSEDED | CESSATION_OF_OPERATION | PRIVILEGE_WITHDRAWN"
      - name: crl_number
        type: integer
        source: system
        description: "crl_number of the first CrlPublication that carried this certificate's serial; null while unpublished"
      - name: crl_published_at
        type: datetime
        source: system
        description: "Logical clock instant at which this revocation was first carried on a CRL; null while unpublished"

  - name: HsmPartition
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Operator-facing partition label"
        constraints: "1..60 chars"
      - name: serial
        type: string
        source: input
        description: "Hardware security module serial number"
        constraints: "1..40 chars; unique across partitions"
      - name: state
        type: enum
        source: system
        description: "Partition control state; only OPERATIONAL partitions may back an issuance"
        default: OPERATIONAL
        constraints: "OPERATIONAL | QUARANTINED"
      - name: quarantined_at
        type: datetime
        source: system
        description: "Logical clock instant at which the partition entered QUARANTINED; null otherwise"
      - name: attested_ceremony_count
        type: integer
        source: computed
        description: "Count of this partition's ceremonies currently in state ATTESTED"
        default: 0

  - name: KeyCeremony
    parent: null
    common_fields: true
    fields:
      - name: partition_id
        type: string
        source: system
        description: "FK -> HsmPartition.id; taken from the creation path"
      - name: window_start
        type: datetime
        source: input
        description: "Start of the scheduled ceremony occupation window on the partition"
      - name: window_end
        type: datetime
        source: input
        description: "End of the scheduled ceremony occupation window; must be strictly after window_start"
      - name: attestation_valid_days
        type: integer
        source: input
        description: "Days the auditor attestation remains valid once granted"
        constraints: "1..365"
      - name: state
        type: enum
        source: system
        description: "Ceremony control state"
        default: SCHEDULED
        constraints: "SCHEDULED | WITNESSED | ATTESTED | ATTESTATION_REVOKED | ABORTED"
      - name: witness_user_ids
        type: array
        source: computed
        description: "X-User-IDs of the Auditors that witnessed the ceremony, in the order recorded"
        default: []
      - name: witness_count
        type: integer
        source: computed
        description: "Length of witness_user_ids"
        default: 0
      - name: attested_at
        type: datetime
        source: system
        description: "Logical clock instant of attestation; null until ATTESTED"
      - name: attested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the attesting ComplianceOfficer; must not appear in witness_user_ids"
      - name: attestation_expires_at
        type: datetime
        source: computed
        description: "attested_at + attestation_valid_days days; caps not_after of every certificate signed under this ceremony"
      - name: attestation_revoked_at
        type: datetime
        source: system
        description: "Logical clock instant at which the attestation was revoked; null otherwise"
      - name: issued_certificate_count
        type: integer
        source: computed
        description: "Count of certificates whose ceremony_id is this ceremony"
        default: 0

  - name: CtLogSubmission
    parent: null
    common_fields: false
    fields:
      - name: certificate_id
        type: string
        source: system
        description: "FK -> Certificate.id; taken from the creation path"
      - name: log_operator
        type: enum
        source: input
        description: "Certificate transparency log the pre-certificate was submitted to"
        constraints: "GOOGLE_ARGON | CLOUDFLARE_NIMBUS | DIGICERT_YETI | SECTIGO_SABRE"
      - name: outcome
        type: enum
        source: input
        description: "Log response for this submission"
        constraints: "ACCEPTED | REJECTED"
      - name: rejection_reason
        type: string
        source: input
        description: "Log-reported reason; required when outcome is REJECTED, must be omitted or null when ACCEPTED"
      - name: sct_timestamp
        type: datetime
        source: system
        description: "Logical clock instant at which the submission was recorded"
      - name: counted_toward_sct
        type: boolean
        source: computed
        description: "True only when outcome is ACCEPTED and no earlier submission for the same certificate_id and log_operator was already ACCEPTED; duplicates never raise sct_count"

  - name: RevocationRequest
    parent: null
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; the certificate to be revoked"
      - name: incident_id
        type: string
        source: input
        description: "FK -> MisissuanceIncident.id; optional link when the revocation is driven by an incident, null otherwise"
      - name: reason_code
        type: enum
        source: input
        description: "RFC 5280 revocation reason recorded on the CRL entry"
        constraints: "UNSPECIFIED | KEY_COMPROMISE | AFFILIATION_CHANGED | SUPERSEDED | CESSATION_OF_OPERATION | PRIVILEGE_WITHDRAWN"
      - name: evidence_ref
        type: string
        source: input
        description: "Reference to the compromise evidence package; required when reason_code is KEY_COMPROMISE"
      - name: state
        type: enum
        source: system
        description: "Revocation workflow state"
        default: REQUESTED
        constraints: "REQUESTED | EXECUTED | DENIED | SUPERSEDED"
      - name: origin
        type: enum
        source: system
        description: "How the request came into being; POST /ca/revocation-requests sets SUBSCRIBER when incident_id is absent and COMPLIANCE when incident_id is present, the attestation-repudiation cascade sets SYSTEM_CASCADE and a mass-revocation batch sets MASS_REVOCATION"
        constraints: "SUBSCRIBER | COMPLIANCE | SYSTEM_CASCADE | MASS_REVOCATION"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the requester, or the literal 'system' for SYSTEM_CASCADE origin"
      - name: requested_at
        type: datetime
        source: system
        description: "Logical clock instant at which the request was created"
      - name: deadline_at
        type: datetime
        source: computed
        description: "revocation_deadline result: requested_at plus the effective deadline hours"
      - name: deadline_breached
        type: boolean
        source: computed
        description: "Set at execute time to true when the logical clock is strictly after deadline_at"
        default: false
      - name: executed_at
        type: datetime
        source: system
        description: "Logical clock instant of execution; null unless EXECUTED"
      - name: denied_at
        type: datetime
        source: system
        description: "Logical clock instant of denial; null unless DENIED"
      - name: denial_reason
        type: string
        source: input
        description: "Free-text denial rationale recorded on deny"
      - name: superseded_at
        type: datetime
        source: system
        description: "Logical clock instant at which a newer request for the same certificate superseded this one; null otherwise"

  - name: CrlPublication
    parent: null
    common_fields: false
    fields:
      - name: profile_id
        type: string
        source: system
        description: "FK -> CertificateProfile.id; taken from the creation path"
      - name: crl_number
        type: integer
        source: system
        description: "Monotonic per-profile CRL sequence number; the first publication of a profile is 1"
      - name: this_update
        type: datetime
        source: input
        description: "Start of the half-open validity window [this_update, next_update) this CRL covers"
      - name: next_update
        type: datetime
        source: input
        description: "End of the half-open validity window; must be strictly after this_update"
      - name: entry_count
        type: integer
        source: computed
        description: "Number of certificates drained from the profile's pending revocation queue into this CRL"
      - name: revoked_serials
        type: array
        source: computed
        description: "serial_number values carried by this CRL, ordered by the drained certificates' revoked_at ascending, ties broken by serial_number ascending"
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID of the publishing IssuanceOfficer"

  - name: MisissuanceIncident
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Short incident title used in root program communication"
        constraints: "1..120 chars"
      - name: category
        type: enum
        source: input
        description: "Incident classification driving both the risk weight and the remediation penalty weight"
        constraints: "KEY_COMPROMISE | DOMAIN_MISISSUANCE | ORG_MISISSUANCE | PROCEDURAL"
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; optional attribution of the incident to one subscriber, null for CA-wide incidents"
      - name: scope_profile_id
        type: string
        source: input
        description: "FK -> CertificateProfile.id; certificates of this profile form the mass-revocation candidate pool"
      - name: scope_dcv_method
        type: enum
        source: input
        description: "Optional narrowing of the candidate pool to certificates whose dcv_methods_used contains this method; null means no method narrowing"
        constraints: "DNS_TXT | HTTP_TOKEN | EMAIL_APPROVAL | TLS_ALPN"
      - name: scope_issued_from
        type: datetime
        source: input
        description: "Inclusive lower bound on Certificate.not_before for the candidate pool"
      - name: scope_issued_to
        type: datetime
        source: input
        description: "Exclusive upper bound on Certificate.not_before for the candidate pool; must be strictly after scope_issued_from"
      - name: discovered_at
        type: datetime
        source: system
        description: "Logical clock instant at which the incident record was created"
      - name: disclosure_due_at
        type: datetime
        source: computed
        description: "discovered_at + INCIDENT_DISCLOSURE_HOURS; the root program disclosure deadline"
      - name: disclosure_breached
        type: boolean
        source: computed
        description: "Set true by clock sweep 3 when the incident is still OPEN and the new clock is STRICTLY AFTER disclosure_due_at, and never cleared afterwards; a disclosure landing exactly on disclosure_due_at is therefore on time"
        default: false
      - name: disclosed_at
        type: datetime
        source: system
        description: "Logical clock instant of the disclosure communication; null while OPEN"
      - name: state
        type: enum
        source: system
        description: "Incident response state"
        default: OPEN
        constraints: "OPEN | DISCLOSED | MASS_REVOCATION_IN_PROGRESS | REMEDIATED | CLOSED"
      - name: revoked_certificate_count
        type: integer
        source: computed
        description: "Running count of certificates revoked under this incident across all mass-revoke batches"
        default: 0
      - name: remaining_scope_count
        type: integer
        source: computed
        description: "Count of candidate-pool certificates still holding revocation_status NONE; recomputed at creation and after every mass-revoke batch"
        default: 0
      - name: penalty_total_cents
        type: integer
        source: computed
        description: "incident_remediation_penalty accumulated across all mass-revoke batches of this incident"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical clock instant at which the incident reached CLOSED; null otherwise"

  - name: RootProgramAudit
    parent: null
    common_fields: true
    fields:
      - name: root_program
        type: enum
        source: input
        description: "Browser root program the annual audit is performed against"
        constraints: "MOZILLA | CHROME | APPLE | MICROSOFT"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the audit period; audit periods for one root_program may not overlap"
      - name: period_end
        type: datetime
        source: input
        description: "Inclusive end of the audit period; must be strictly after period_start"
      - name: state
        type: enum
        source: system
        description: "Audit state; FIELDWORK forks into exactly one of the two opinion states"
        default: SCHEDULED
        constraints: "SCHEDULED | FIELDWORK | QUALIFIED | UNQUALIFIED"
      - name: finding_count
        type: integer
        source: computed
        description: "Total findings recorded against this audit"
        default: 0
      - name: critical_finding_count
        type: integer
        source: computed
        description: "Findings recorded with severity CRITICAL"
        default: 0
      - name: opinion_at
        type: datetime
        source: system
        description: "Logical clock instant of the opinion; null while SCHEDULED or FIELDWORK"
      - name: opined_by_user_id
        type: string
        source: system
        description: "X-User-ID of the opining Auditor"
      - name: assessed_subscriber_count
        type: integer
        source: computed
        description: "Number of subscribers whose risk_score_audit_final was written by this opinion"
        default: 0
      - name: retired_profile_count
        type: integer
        source: computed
        description: "Number of EV profiles retired by a QUALIFIED opinion; always 0 for UNQUALIFIED"
        default: 0

  - name: RootProgramCommunication
    parent: null
    common_fields: false
    fields:
      - name: incident_id
        type: string
        source: system
        description: "FK -> MisissuanceIncident.id; set for incident disclosures, null for audit notices"
      - name: audit_id
        type: string
        source: system
        description: "FK -> RootProgramAudit.id; set for audit notices, null for incident disclosures"
      - name: root_program
        type: enum
        source: input
        description: "Root program the communication is addressed to"
        constraints: "MOZILLA | CHROME | APPLE | MICROSOFT"
      - name: kind
        type: enum
        source: system
        description: "Communication kind; INCIDENT_DISCLOSURE and the two AUDIT notices are raised by cascades, BREACH_ESCALATION by POST /ca/misissuance-incidents/{id}/communications and ROOT_PROGRAM_RESPONSE by POST /ca/root-program-audits/{id}/communications"
        constraints: "INCIDENT_DISCLOSURE | BREACH_ESCALATION | AUDIT_QUALIFIED_NOTICE | AUDIT_CLEAN_NOTICE | ROOT_PROGRAM_RESPONSE"
      - name: body
        type: string
        source: input
        description: "Narrative sent to the root program; system-generated and null for audit notices"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical clock instant at which the communication was recorded"
      - name: within_deadline
        type: boolean
        source: computed
        description: "INCIDENT_DISCLOSURE: true when sent_at <= incident.disclosure_due_at. BREACH_ESCALATION: always false. AUDIT_QUALIFIED_NOTICE and AUDIT_CLEAN_NOTICE: always true. ROOT_PROGRAM_RESPONSE: true when sent_at <= audit.opinion_at + ROOT_PROGRAM_RESPONSE_DAYS (14) days"
      - name: sent_by_user_id
        type: string
        source: system
        description: "X-User-ID of the acting officer, or 'system' when the communication was raised by an audit opinion cascade"

state_machines:
  - entity: CertificateProfile
    dimension: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /ca/certificate-profiles/{id}/activate"
        actor: CaAdmin
        preconditions:
          - "status == DRAFT"
          - "validation_type == 'DV' OR org_vetting_reuse_days >= 1"
        side_effects:
          - "sets activated_at = logical clock"
          - "increments CertificateProfile.version by 1"
        note: "Only ACTIVE profiles may be named by a submit or an issuance."
      - from: ACTIVE
        to: RETIRED
        trigger: "system cascade from POST /ca/root-program-audits/{id}/opine when the opinion is QUALIFIED and validation_type == 'EV'"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "validation_type == 'EV'"
        side_effects:
          - "sets retired_at = logical clock"
          - "increments CertificateProfile.version by 1"
          - "increments RootProgramAudit.retired_profile_count by 1"
        note: "A qualified (adverse) audit opinion suspends extended-validation issuance; DV and OV profiles are untouched."

  - entity: CertificateProfile
    dimension: status_service_posture
    initial_state: NOMINAL
    terminal_states: []
    transitions:
      - from: NOMINAL
        to: CRL_OVERDUE
        trigger: "system cascade: pending_crl_entry_count reached crl_trigger_threshold after a revocation was executed"
        actor: system
        preconditions:
          - "pending_crl_entry_count >= crl_trigger_threshold"
          - "status_service_posture == NOMINAL"
        side_effects:
          - "every CertificateRequest with profile_id == this profile and state == READY_TO_ISSUE moves to ISSUANCE_BLOCKED with blocked_reason PROFILE_STATUS_SERVICE_OVERDUE, processed in created_at ASC order (ties broken by created_at then by nothing else, as created_at is unique per request in this system)"
          - "increments CertificateProfile.version by 1"
        note: "Threshold uses >= so a threshold of 1 flips the posture on the first unpublished revocation."
      - from: CRL_OVERDUE
        to: NOMINAL
        trigger: "system cascade from POST /ca/certificate-profiles/{id}/crl-publications after the pending queue is drained"
        actor: system
        preconditions:
          - "pending_crl_entry_count == 0 after the publication drained the queue"
        side_effects:
          - "every CertificateRequest with profile_id == this profile and state == ISSUANCE_BLOCKED returns to READY_TO_ISSUE and blocked_reason is cleared to null, processed in created_at ASC order"
          - "increments CertificateProfile.version by 1"
        note: "Cyclic: a profile may oscillate NOMINAL -> CRL_OVERDUE -> NOMINAL any number of times."

  - entity: Subscriber
    dimension: account_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: revocation_pending_count reached 2 after certificates entered REVOCATION_PENDING"
        actor: system
        preconditions:
          - "account_status == ACTIVE"
          - "revocation_pending_count >= 2"
        side_effects:
          - "sets suspended_at = logical clock"
          - "increments Subscriber.version by 1"
        note: "Suspension is a gate only: it blocks submit, validate, clear-validation and issue, and does not itself mutate the subscriber's requests."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade: revocation_pending_count fell below 2 because pending revocations were executed or denied"
        actor: system
        preconditions:
          - "account_status == SUSPENDED"
          - "revocation_pending_count < 2"
        side_effects:
          - "sets suspended_at = null"
          - "increments Subscriber.version by 1"
        note: "Cyclic: suspension is reversible once the pending-revocation backlog clears."
      - from: ACTIVE
        to: TERMINATED
        trigger: "system cascade from POST /ca/misissuance-incidents/{id}/mass-revoke when category == 'KEY_COMPROMISE' and the batch revoked at least one certificate of the incident's subscriber_id"
        actor: system
        preconditions:
          - "account_status IN {ACTIVE, SUSPENDED}"
          - "MisissuanceIncident.category == 'KEY_COMPROMISE'"
          - "MisissuanceIncident.subscriber_id == this subscriber's id"
        side_effects:
          - "sets suspended_at = logical clock"
          - "increments Subscriber.version by 1"
        note: "Terminal: a key-compromise mass revocation permanently terminates the attributed subscriber account."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system cascade from POST /ca/misissuance-incidents/{id}/mass-revoke when category == 'KEY_COMPROMISE' and the batch revoked at least one certificate of the incident's subscriber_id"
        actor: system
        preconditions:
          - "account_status == SUSPENDED"
          - "MisissuanceIncident.category == 'KEY_COMPROMISE'"
        side_effects:
          - "sets suspended_at = logical clock"
          - "increments Subscriber.version by 1"

  - entity: OrganizationVetting
    dimension: vetting_state
    initial_state: PENDING
    check_dimensions:
      - name: registry_check_status
        states: [NOT_STARTED, PASSED, FAILED]
        written_by: "POST /ca/organization-vettings/{id}/checks with dimension REGISTRY"
        required_for: "required_level IN {OV, EV}"
      - name: callback_check_status
        states: [NOT_STARTED, PASSED, FAILED]
        written_by: "POST /ca/organization-vettings/{id}/checks with dimension CALLBACK"
        required_for: "required_level IN {OV, EV}"
      - name: authority_check_status
        states: [NOT_STARTED, PASSED, FAILED]
        written_by: "POST /ca/organization-vettings/{id}/checks with dimension AUTHORITY"
        required_for: "required_level == EV only; ignored entirely when required_level == OV"
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /ca/organization-vettings/{id}/checks (first check recorded, outcome PASSED, while at least one required dimension is still NOT_STARTED)"
        actor: ValidationSpecialist
        preconditions:
          - "vetting_state IN {PENDING, IN_PROGRESS}"
          - "the addressed check dimension is NOT_STARTED"
        side_effects:
          - "sets the addressed <check>_check_status to PASSED"
          - "sets the addressed <check>_checked_by_user_id to X-User-ID"
          - "increments OrganizationVetting.version by 1"
      - from: IN_PROGRESS
        to: AWAITING_APPROVAL
        trigger: "POST /ca/organization-vettings/{id}/checks (last required dimension recorded PASSED)"
        actor: ValidationSpecialist
        preconditions:
          - "every dimension required by required_level is PASSED after this check is applied"
        side_effects:
          - "sets the addressed <check>_check_status to PASSED and <check>_checked_by_user_id to X-User-ID"
          - "increments OrganizationVetting.version by 1"
        note: "For required_level OV this fires once REGISTRY and CALLBACK are PASSED, even while authority_check_status is NOT_STARTED."
      - from: PENDING
        to: REJECTED
        trigger: "POST /ca/organization-vettings/{id}/checks with outcome FAILED"
        actor: ValidationSpecialist
        preconditions:
          - "vetting_state IN {PENDING, IN_PROGRESS, AWAITING_APPROVAL}"
          - "the addressed check dimension is required by required_level"
        side_effects:
          - "sets the addressed <check>_check_status to FAILED and <check>_checked_by_user_id to X-User-ID"
          - "sets rejected_at = logical clock"
          - "increments OrganizationVetting.version by 1"
        note: "Any single FAILED required dimension drives the compound state to REJECTED regardless of the other dimensions."
      - from: IN_PROGRESS
        to: REJECTED
        trigger: "POST /ca/organization-vettings/{id}/checks with outcome FAILED"
        actor: ValidationSpecialist
        preconditions:
          - "the addressed check dimension is required by required_level"
        side_effects:
          - "sets the addressed <check>_check_status to FAILED and <check>_checked_by_user_id to X-User-ID"
          - "sets rejected_at = logical clock"
          - "increments OrganizationVetting.version by 1"
      - from: AWAITING_APPROVAL
        to: REJECTED
        trigger: "POST /ca/organization-vettings/{id}/checks with outcome FAILED on a required dimension already PASSED"
        actor: ValidationSpecialist
        preconditions:
          - "vetting_state == AWAITING_APPROVAL"
        side_effects:
          - "overwrites the addressed <check>_check_status to FAILED and <check>_checked_by_user_id to X-User-ID"
          - "sets rejected_at = logical clock"
          - "increments OrganizationVetting.version by 1"
      - from: AWAITING_APPROVAL
        to: APPROVED
        trigger: "POST /ca/organization-vettings/{id}/approve"
        actor: ValidationSpecialist
        preconditions:
          - "vetting_state == AWAITING_APPROVAL"
          - "X-User-ID differs from every non-null registry_checked_by_user_id, callback_checked_by_user_id and authority_checked_by_user_id"
        side_effects:
          - "sets approved_at = logical clock and approved_by_user_id = X-User-ID"
          - "increments OrganizationVetting.version by 1"
        note: "approved_at starts the org-vetting reuse window, which each profile bounds with its own org_vetting_reuse_days."

  - entity: DomainAuthorization
    dimension: state
    initial_state: PENDING
    terminal_states: [EXHAUSTED, EXPIRED]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /ca/domain-authorizations/{id}/validate with the matching challenge_token"
        actor: ValidationSpecialist
        preconditions:
          - "state IN {PENDING, FAILED}"
          - "submitted challenge_token equals the stored challenge_token"
          - "Subscriber.account_status == 'ACTIVE' (cross-entity guard)"
          - "CertificateProfile.status == 'ACTIVE'"
        side_effects:
          - "increments attempt_count by 1"
          - "sets validated_at = logical clock"
          - "sets expires_at = validated_at + profile.dcv_reuse_days days"
          - "increments DomainAuthorization.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /ca/domain-authorizations/{id}/validate with a non-matching challenge_token while attempt_count reaches at most 2"
        actor: ValidationSpecialist
        preconditions:
          - "state == PENDING"
          - "submitted challenge_token differs from the stored challenge_token"
          - "attempt_count + 1 < 3"
        side_effects:
          - "increments attempt_count by 1"
          - "increments DomainAuthorization.version by 1"
        note: "The endpoint answers 200 with the authorization in state FAILED; it is not an error response."
      - from: FAILED
        to: FAILED
        trigger: "POST /ca/domain-authorizations/{id}/validate with a non-matching challenge_token while attempt_count + 1 < 3"
        actor: ValidationSpecialist
        preconditions:
          - "state == FAILED"
          - "attempt_count + 1 < 3"
        side_effects:
          - "increments attempt_count by 1"
          - "increments DomainAuthorization.version by 1"
      - from: FAILED
        to: EXHAUSTED
        trigger: "POST /ca/domain-authorizations/{id}/validate with a non-matching challenge_token when attempt_count is already 2"
        actor: ValidationSpecialist
        preconditions:
          - "state == FAILED"
          - "attempt_count + 1 == 3"
        side_effects:
          - "increments attempt_count to 3"
          - "increments DomainAuthorization.version by 1"
        note: "Terminal: an exhausted authorization can never be validated; a new authorization must be created."
      - from: FAILED
        to: VALIDATED
        trigger: "POST /ca/domain-authorizations/{id}/validate with the matching challenge_token after one or two failed attempts"
        actor: ValidationSpecialist
        preconditions:
          - "state == FAILED"
          - "submitted challenge_token equals the stored challenge_token"
          - "Subscriber.account_status == 'ACTIVE' (cross-entity guard)"
          - "CertificateProfile.status == 'ACTIVE'"
        side_effects:
          - "increments attempt_count by 1"
          - "sets validated_at = logical clock"
          - "sets expires_at = validated_at + profile.dcv_reuse_days days"
          - "increments DomainAuthorization.version by 1"
        note: "Recovery edge: a failed attempt is forgiven as long as the authorization has not reached EXHAUSTED; attempt_count is NOT reset by success."
      - from: VALIDATED
        to: EXPIRED
        trigger: "sweep 1 of POST /_clock/set_current_utc when expires_at <= the new clock"
        actor: system
        preconditions:
          - "state == VALIDATED"
          - "expires_at <= new logical clock (half-open reuse window)"
        side_effects:
          - "increments DomainAuthorization.version by 1"
        note: "Boundary: an authorization whose expires_at exactly equals the new clock IS expired."
      - from: VALIDATED
        to: PENDING
        trigger: "POST /ca/domain-authorizations/{id}/invalidate"
        actor: ComplianceOfficer
        preconditions:
          - "state == VALIDATED"
        side_effects:
          - "sets invalidated_at = logical clock, increments invalidation_count by 1, resets attempt_count to 0, validated_at to null, expires_at to null, and mints a fresh challenge_token"
          - "every CertificateRequest whose consumed_authorization_ids contains this authorization and whose state IN {READY_TO_ISSUE, ISSUANCE_BLOCKED} moves back to SUBMITTED, clearing validation_cleared_by_user_id, validation_cleared_at, projected_not_before, projected_not_after, projected_charge_cents and blocked_reason to null and consumed_authorization_ids to [], processed in created_at ASC order"
          - "decrements reuse_count by 1 on every authorization released by those requests, including this one"
          - "increments DomainAuthorization.version by 1"
        note: "Cyclic: VALIDATED -> PENDING -> VALIDATED is the re-validation loop after a domain control validation is repudiated."

  - entity: CertificateRequest
    dimension: state
    initial_state: DRAFT
    terminal_states: [ISSUED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ca/certificate-requests/{id}/submit"
        actor: Subscriber
        preconditions:
          - "state == DRAFT"
          - "Subscriber.account_status == 'ACTIVE'"
          - "CertificateProfile.status == 'ACTIVE'"
        side_effects:
          - "sets submitted_at = logical clock"
          - "increments CertificateRequest.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /ca/certificate-requests/{id}/return while return_count < 2"
        actor: ValidationSpecialist
        preconditions:
          - "state == SUBMITTED"
          - "return_count < 2"
        side_effects:
          - "increments return_count by 1"
          - "increments CertificateRequest.version by 1"
        note: "Cyclic: the request may bounce SUBMITTED -> DRAFT -> SUBMITTED twice."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ca/certificate-requests/{id}/return when return_count == 2"
        actor: ValidationSpecialist
        preconditions:
          - "state == SUBMITTED"
          - "return_count == 2"
        side_effects:
          - "increments return_count to 3"
          - "sets rejected_reason = the request body's return_reason value"
          - "increments CertificateRequest.version by 1"
        note: "Branch: the third return is not a return but a terminal rejection; the endpoint answers 200 with state REJECTED."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ca/certificate-requests/{id}/reject"
        actor: ValidationSpecialist
        preconditions:
          - "state == SUBMITTED"
        side_effects:
          - "sets rejected_reason from the body"
          - "increments CertificateRequest.version by 1"
      - from: SUBMITTED
        to: READY_TO_ISSUE
        trigger: "POST /ca/certificate-requests/{id}/clear-validation"
        actor: ValidationSpecialist
        preconditions:
          - "state == SUBMITTED"
          - "Subscriber.account_status == 'ACTIVE'"
          - "CertificateProfile.status == 'ACTIVE'"
          - "for every entry of requested_domains a DomainAuthorization is selectable per the domain_authorization_selection rule"
          - "each selected authorization has reuse_count < profile.max_dcv_reuse_count"
          - "when profile.required_vetting_level != 'NONE': the subscriber holds an OrganizationVetting in vetting_state APPROVED whose required_level covers the profile level, approved within profile.org_vetting_reuse_days of the logical clock"
        side_effects:
          - "sets validation_cleared_by_user_id = X-User-ID and validation_cleared_at = logical clock"
          - "sets consumed_authorization_ids to the selected authorization ids in requested_domains order"
          - "increments reuse_count by 1 on every selected DomainAuthorization"
          - "computes projected_not_before / projected_not_after per certificate_validity_window variant PROJECTED_AT_CLEARANCE"
          - "computes projected_charge_cents per issuance_charge_settlement"
          - "increments CertificateRequest.version by 1"
      - from: READY_TO_ISSUE
        to: SUBMITTED
        trigger: "system cascade from POST /ca/domain-authorizations/{id}/invalidate on a consumed authorization"
        actor: system
        preconditions:
          - "state == READY_TO_ISSUE"
          - "consumed_authorization_ids contains the invalidated authorization"
        side_effects:
          - "clears validation_cleared_by_user_id, validation_cleared_at, projected_not_before, projected_not_after, projected_charge_cents to null and consumed_authorization_ids to []"
          - "increments CertificateRequest.version by 1"
      - from: READY_TO_ISSUE
        to: ISSUANCE_BLOCKED
        trigger: "system cascade: the profile's status_service_posture became CRL_OVERDUE"
        actor: system
        preconditions:
          - "state == READY_TO_ISSUE"
          - "CertificateProfile.status_service_posture == 'CRL_OVERDUE'"
        side_effects:
          - "sets blocked_reason = PROFILE_STATUS_SERVICE_OVERDUE"
          - "increments CertificateRequest.version by 1"
      - from: ISSUANCE_BLOCKED
        to: READY_TO_ISSUE
        trigger: "system cascade: the profile's status_service_posture returned to NOMINAL after a CRL publication"
        actor: system
        preconditions:
          - "state == ISSUANCE_BLOCKED"
          - "CertificateProfile.status_service_posture == 'NOMINAL'"
        side_effects:
          - "sets blocked_reason = null"
          - "increments CertificateRequest.version by 1"
        note: "Cyclic gate: the pair READY_TO_ISSUE <-> ISSUANCE_BLOCKED may oscillate with the profile posture."
      - from: READY_TO_ISSUE
        to: ISSUED
        trigger: "POST /ca/certificate-requests/{id}/issue"
        actor: IssuanceOfficer
        preconditions:
          - "state == READY_TO_ISSUE"
          - "X-User-ID != validation_cleared_by_user_id (segregation of duties)"
          - "Subscriber.account_status == 'ACTIVE'"
          - "CertificateProfile.status == 'ACTIVE' and status_service_posture == 'NOMINAL'"
          - "the named KeyCeremony is in state ATTESTED and attestation_expires_at > logical clock"
          - "the named ceremony's HsmPartition.state == 'OPERATIONAL'"
          - "every consumed authorization is still in state VALIDATED with expires_at > logical clock"
          - "Subscriber.outstanding_balance_cents + issuance_charge_settlement total <= Subscriber.credit_limit_cents"
        side_effects:
          - "creates a Certificate with lifecycle_status PREISSUANCE, revocation_status NONE, a fresh monotonic serial_number, and the FINAL_AT_ISSUANCE validity window"
          - "sets issued_certificate_id on the request"
          - "increments Subscriber.issued_certificate_count by 1 and Subscriber.outstanding_balance_cents by Certificate.charged_amount_cents"
          - "increments KeyCeremony.issued_certificate_count by 1"
          - "increments CertificateRequest.version by 1 and Subscriber.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /ca/certificate-requests/{id}/reject while the request is still in DRAFT"
        actor: ValidationSpecialist
        preconditions:
          - "state == DRAFT"
        side_effects:
          - "sets rejected_reason from the body"
          - "increments CertificateRequest.version by 1"
        note: "A DRAFT request abandoned by the CA lands in WITHDRAWN rather than REJECTED, because no validation work was performed on it."

  - entity: Certificate
    dimension: lifecycle_status
    initial_state: PREISSUANCE
    terminal_states: [EXPIRED]
    parallel_note: "lifecycle_status and revocation_status are independent dimensions on the same row: any combination is reachable, including (PREISSUANCE, REVOKED) for a pre-issuance revocation and (EXPIRED, REVOKED) for a certificate revoked before it aged out."
    transitions:
      - from: PREISSUANCE
        to: ISSUED
        trigger: "POST /ca/certificates/{id}/activate"
        actor: IssuanceOfficer
        preconditions:
          - "lifecycle_status == PREISSUANCE"
          - "revocation_status == NONE"
          - "sct_count >= CertificateProfile.required_sct_count"
          - "not_after > logical clock"
        side_effects:
          - "sets activated_at = logical clock"
          - "increments Certificate.version by 1"
        note: "Boundary: sct_count exactly equal to required_sct_count passes."
      - from: ISSUED
        to: EXPIRED
        trigger: "sweep 2 of POST /_clock/set_current_utc when not_after <= the new clock"
        actor: system
        preconditions:
          - "lifecycle_status == ISSUED"
          - "not_after <= new logical clock"
        side_effects:
          - "increments Certificate.version by 1"
        note: "Independent of revocation_status: an already REVOKED certificate still ages into EXPIRED."
      - from: PREISSUANCE
        to: EXPIRED
        trigger: "sweep 2 of POST /_clock/set_current_utc when not_after <= the new clock and the certificate was never activated"
        actor: system
        preconditions:
          - "lifecycle_status == PREISSUANCE"
          - "not_after <= new logical clock"
        side_effects:
          - "increments Certificate.version by 1"

  - entity: Certificate
    dimension: revocation_status
    initial_state: NONE
    terminal_states: [REVOKED]
    transitions:
      - from: NONE
        to: REVOCATION_PENDING
        trigger: "POST /ca/revocation-requests (a RevocationRequest is created for this certificate), or the system cascade from POST /ca/key-ceremonies/{id}/revoke-attestation"
        actor: Subscriber | ComplianceOfficer | system
        preconditions:
          - "revocation_status == NONE"
        side_effects:
          - "increments Subscriber.revocation_pending_count by 1, which suspends the subscriber at 2"
          - "increments Certificate.version by 1"
      - from: REVOCATION_PENDING
        to: REVOKED
        trigger: "POST /ca/revocation-requests/{id}/execute"
        actor: IssuanceOfficer
        preconditions:
          - "revocation_status == REVOCATION_PENDING"
          - "the executing RevocationRequest is the certificate's newest request in state REQUESTED"
        side_effects:
          - "sets revoked_at = logical clock and revocation_reason_code from the request"
          - "decrements Subscriber.revocation_pending_count by 1 and increments CertificateProfile.revoked_certificate_count and CertificateProfile.pending_crl_entry_count by 1"
          - "when lifecycle_status == PREISSUANCE and reason_code == 'SUPERSEDED': sets refunded_at = logical clock and decrements Subscriber.outstanding_balance_cents by charged_amount_cents"
          - "increments Certificate.version by 1"
      - from: NONE
        to: REVOKED
        trigger: "POST /ca/misissuance-incidents/{id}/mass-revoke (batch revocation creates and executes the RevocationRequest in one step)"
        actor: ComplianceOfficer
        preconditions:
          - "revocation_status == NONE"
          - "the certificate is inside the incident's candidate pool per mass_revocation_scope_selection"
        side_effects:
          - "creates a RevocationRequest with origin MASS_REVOCATION in state EXECUTED"
          - "sets revoked_at = logical clock and revocation_reason_code per the incident category mapping"
          - "increments CertificateProfile.revoked_certificate_count and CertificateProfile.pending_crl_entry_count by 1"
          - "increments Certificate.version by 1"
        note: "Mass revocation skips REVOCATION_PENDING entirely; Subscriber.revocation_pending_count is untouched by this path."
      - from: REVOCATION_PENDING
        to: NONE
        trigger: "POST /ca/revocation-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "revocation_status == REVOCATION_PENDING"
          - "no other RevocationRequest for this certificate remains in state REQUESTED after this denial"
        side_effects:
          - "decrements Subscriber.revocation_pending_count by 1, which un-suspends the subscriber below 2"
          - "increments Certificate.version by 1"
        note: "Cyclic: a certificate may be pushed to REVOCATION_PENDING and released back to NONE repeatedly."

  - entity: HsmPartition
    dimension: state
    initial_state: OPERATIONAL
    terminal_states: [QUARANTINED]
    transitions:
      - from: OPERATIONAL
        to: QUARANTINED
        trigger: "system cascade from POST /ca/key-ceremonies/{id}/revoke-attestation (hop 2 of the attestation-repudiation cascade)"
        actor: system
        preconditions:
          - "state == OPERATIONAL"
          - "the ceremony whose attestation was revoked has partition_id == this partition"
        side_effects:
          - "sets quarantined_at = logical clock"
          - "recomputes attested_ceremony_count"
          - "increments HsmPartition.version by 1"
        note: "Terminal: a quarantined partition can never sign again; every issuance naming a ceremony on it is refused."

  - entity: KeyCeremony
    dimension: state
    initial_state: SCHEDULED
    terminal_states: [ATTESTATION_REVOKED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /ca/key-ceremonies/{id}/witness (first witness of the required two)"
        actor: Auditor
        preconditions:
          - "state == SCHEDULED"
          - "witness_count == 0"
          - "X-User-ID not already in witness_user_ids"
        side_effects:
          - "appends X-User-ID to witness_user_ids and sets witness_count = 1"
          - "increments KeyCeremony.version by 1"
        note: "Fork arm 1 of the two-witness join; the ceremony stays SCHEDULED until the quorum of 2 is met."
      - from: SCHEDULED
        to: WITNESSED
        trigger: "POST /ca/key-ceremonies/{id}/witness (second, distinct witness)"
        actor: Auditor
        preconditions:
          - "state == SCHEDULED"
          - "witness_count == 1"
          - "X-User-ID not already in witness_user_ids"
        side_effects:
          - "appends X-User-ID to witness_user_ids and sets witness_count = 2"
          - "increments KeyCeremony.version by 1"
        note: "Join point: the quorum of two distinct witnesses is what moves the ceremony forward."
      - from: WITNESSED
        to: ATTESTED
        trigger: "POST /ca/key-ceremonies/{id}/attest"
        actor: ComplianceOfficer
        preconditions:
          - "state == WITNESSED"
          - "logical clock >= window_end (the ceremony window has closed)"
          - "X-User-ID not in witness_user_ids (segregation of duties)"
          - "HsmPartition.state == 'OPERATIONAL'"
        side_effects:
          - "sets attested_at = logical clock, attested_by_user_id = X-User-ID and attestation_expires_at = attested_at + attestation_valid_days days"
          - "increments HsmPartition.attested_ceremony_count by 1 and HsmPartition.version by 1"
          - "increments KeyCeremony.version by 1"
      - from: ATTESTED
        to: ATTESTATION_REVOKED
        trigger: "POST /ca/key-ceremonies/{id}/revoke-attestation"
        actor: ComplianceOfficer
        preconditions:
          - "state == ATTESTED"
        side_effects:
          - "hop 1: sets attestation_revoked_at = logical clock and decrements HsmPartition.attested_ceremony_count by 1"
          - "hop 2: because this ceremony lost its attestation, its HsmPartition moves OPERATIONAL -> QUARANTINED"
          - "hop 3: because the partition is QUARANTINED, every Certificate whose ceremony_id is any ceremony of that partition and whose revocation_status == NONE moves to REVOCATION_PENDING and gets a system RevocationRequest with origin SYSTEM_CASCADE, reason_code KEY_COMPROMISE and evidence_ref 'ceremony:{id}', processed in Certificate.created_at ASC order"
          - "hop 4: because those certificates entered REVOCATION_PENDING, each affected Subscriber's revocation_pending_count rises and any subscriber reaching 2 moves ACTIVE -> SUSPENDED"
          - "increments KeyCeremony.version by 1"
        note: "Depth-4 transitive cascade; each hop is caused by the previous hop, not by the original request."
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /ca/key-ceremonies/{id}/abort"
        actor: CaAdmin
        preconditions:
          - "state IN {SCHEDULED, WITNESSED}"
        side_effects:
          - "increments KeyCeremony.version by 1"
        note: "An aborted ceremony frees its occupation window on the partition for a new ceremony."
      - from: WITNESSED
        to: ABORTED
        trigger: "POST /ca/key-ceremonies/{id}/abort"
        actor: CaAdmin
        preconditions:
          - "state == WITNESSED"
        side_effects:
          - "increments KeyCeremony.version by 1"

  - entity: RevocationRequest
    dimension: state
    initial_state: REQUESTED
    terminal_states: [EXECUTED, DENIED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: EXECUTED
        trigger: "POST /ca/revocation-requests/{id}/execute"
        actor: IssuanceOfficer
        preconditions:
          - "state == REQUESTED"
          - "Certificate.revocation_status == 'REVOCATION_PENDING'"
        side_effects:
          - "sets executed_at = logical clock and deadline_breached = (logical clock > deadline_at)"
          - "hop 1: the target Certificate moves REVOCATION_PENDING -> REVOKED, with the reason_code copied onto Certificate.revocation_reason_code"
          - "hop 2: because the certificate became REVOKED, CertificateProfile.revoked_certificate_count and CertificateProfile.pending_crl_entry_count each rise by 1"
          - "hop 3: because pending_crl_entry_count reached crl_trigger_threshold, CertificateProfile.status_service_posture moves NOMINAL -> CRL_OVERDUE, which in turn moves every READY_TO_ISSUE request of that profile to ISSUANCE_BLOCKED"
          - "when the certificate was PREISSUANCE and reason_code == 'SUPERSEDED': Certificate.refunded_at is set and Subscriber.outstanding_balance_cents is credited back by charged_amount_cents"
          - "increments RevocationRequest.version, Certificate.version, CertificateProfile.version and Subscriber.version by 1"
        note: "Depth-3 transitive cascade rooted at a different trigger than the ceremony cascade."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /ca/revocation-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "state == REQUESTED"
          - "origin != 'SYSTEM_CASCADE' (a cascade-raised revocation may not be denied)"
        side_effects:
          - "sets denied_at = logical clock and denial_reason from the body"
          - "the target Certificate moves REVOCATION_PENDING -> NONE when no other REQUESTED request remains for it"
          - "decrements Subscriber.revocation_pending_count by 1, which returns a SUSPENDED subscriber to ACTIVE below the threshold of 2"
          - "increments RevocationRequest.version, Certificate.version and Subscriber.version by 1"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system cascade from POST /ca/revocation-requests when a newer request is created for the same certificate_id"
        actor: system
        preconditions:
          - "state == REQUESTED"
          - "a newer RevocationRequest for the same certificate_id was just created"
        side_effects:
          - "sets superseded_at = logical clock"
          - "increments RevocationRequest.version by 1"
        note: "This legitimate supersede semantics is exactly why a second sequential create is not blocked by a state precondition, and therefore why the create endpoint carries an OCC guard on Certificate.version."

  - entity: MisissuanceIncident
    dimension: state
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: DISCLOSED
        trigger: "POST /ca/misissuance-incidents/{id}/disclose"
        actor: ComplianceOfficer
        preconditions:
          - "state == OPEN"
        side_effects:
          - "sets disclosed_at = logical clock"
          - "creates a RootProgramCommunication with kind INCIDENT_DISCLOSURE, incident_id set, audit_id null and within_deadline = (logical clock <= disclosure_due_at)"
          - "recomputes Subscriber.risk_score_operational for the attributed subscriber when subscriber_id is not null"
          - "increments MisissuanceIncident.version by 1"
      - from: DISCLOSED
        to: MASS_REVOCATION_IN_PROGRESS
        trigger: "POST /ca/misissuance-incidents/{id}/mass-revoke (batch that leaves remaining_scope_count > 0)"
        actor: ComplianceOfficer
        preconditions:
          - "state IN {DISCLOSED, MASS_REVOCATION_IN_PROGRESS}"
          - "disclosure_breached == false OR a RootProgramCommunication with kind BREACH_ESCALATION already exists for this incident"
          - "the candidate pool selected by mass_revocation_scope_selection is non-empty"
        side_effects:
          - "revokes up to 50 candidates in the pinned selection order, each moving Certificate.revocation_status NONE -> REVOKED with a MASS_REVOCATION RevocationRequest in state EXECUTED"
          - "adds the batch's incident_remediation_penalty to penalty_total_cents"
          - "sets revoked_certificate_count and remaining_scope_count from the post-batch pool"
          - "when category == 'KEY_COMPROMISE' and subscriber_id is not null, that Subscriber moves to TERMINATED"
          - "increments MisissuanceIncident.version by 1"
        note: "Cyclic: an incident may re-enter MASS_REVOCATION_IN_PROGRESS for each batch of 50."
      - from: MASS_REVOCATION_IN_PROGRESS
        to: REMEDIATED
        trigger: "POST /ca/misissuance-incidents/{id}/mass-revoke (batch that drains the pool to zero)"
        actor: ComplianceOfficer
        preconditions:
          - "state == MASS_REVOCATION_IN_PROGRESS"
          - "remaining_scope_count == 0 after this batch"
        side_effects:
          - "same per-certificate effects as the previous transition"
          - "increments MisissuanceIncident.version by 1"
      - from: DISCLOSED
        to: REMEDIATED
        trigger: "POST /ca/misissuance-incidents/{id}/mass-revoke (single batch that drains the whole pool)"
        actor: ComplianceOfficer
        preconditions:
          - "state == DISCLOSED"
          - "disclosure_breached == false OR a RootProgramCommunication with kind BREACH_ESCALATION already exists for this incident"
          - "remaining_scope_count == 0 after this batch"
        side_effects:
          - "same per-certificate effects as the MASS_REVOCATION_IN_PROGRESS transition"
          - "increments MisissuanceIncident.version by 1"
      - from: REMEDIATED
        to: CLOSED
        trigger: "POST /ca/misissuance-incidents/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "state IN {DISCLOSED, REMEDIATED}"
          - "remaining_scope_count == 0"
          - "every RevocationRequest with incident_id == this incident is in state EXECUTED or DENIED"
        side_effects:
          - "sets closed_at = logical clock"
          - "recomputes Subscriber.risk_score_operational for the attributed subscriber, which drops because CLOSED incidents leave the operational input set"
          - "increments MisissuanceIncident.version by 1"
      - from: DISCLOSED
        to: CLOSED
        trigger: "POST /ca/misissuance-incidents/{id}/close when the candidate pool was empty from the start"
        actor: ComplianceOfficer
        preconditions:
          - "state == DISCLOSED"
          - "remaining_scope_count == 0"
        side_effects:
          - "sets closed_at = logical clock"
          - "recomputes Subscriber.risk_score_operational for the attributed subscriber"
          - "increments MisissuanceIncident.version by 1"
        note: "A procedural incident whose scope window matches no certificate never needs a mass revocation."

  - entity: RootProgramAudit
    dimension: state
    initial_state: SCHEDULED
    terminal_states: [QUALIFIED, UNQUALIFIED]
    transitions:
      - from: SCHEDULED
        to: FIELDWORK
        trigger: "POST /ca/root-program-audits/{id}/findings (first finding)"
        actor: Auditor
        preconditions:
          - "state == SCHEDULED"
        side_effects:
          - "increments finding_count by 1 and critical_finding_count by 1 when severity == 'CRITICAL'"
          - "increments RootProgramAudit.version by 1"
      - from: FIELDWORK
        to: FIELDWORK
        trigger: "POST /ca/root-program-audits/{id}/findings (subsequent findings)"
        actor: Auditor
        preconditions:
          - "state == FIELDWORK"
        side_effects:
          - "increments finding_count by 1 and critical_finding_count by 1 when severity == 'CRITICAL'"
          - "increments RootProgramAudit.version by 1"
      - from: FIELDWORK
        to: QUALIFIED
        trigger: "POST /ca/root-program-audits/{id}/opine when critical_finding_count >= 1 OR finding_count >= 3"
        actor: Auditor
        preconditions:
          - "state == FIELDWORK"
          - "finding_count >= 1"
        side_effects:
          - "sets opinion_at = logical clock and opined_by_user_id = X-User-ID"
          - "writes Subscriber.risk_score_audit_final for every subscriber with at least one incident discovered inside [period_start, period_end], per the AUDIT_FINAL variant, and sets assessed_subscriber_count to that population size"
          - "retires every CertificateProfile with status ACTIVE and validation_type EV, setting retired_profile_count to the number retired"
          - "creates one RootProgramCommunication with kind AUDIT_QUALIFIED_NOTICE, audit_id set, incident_id null, sent_by_user_id 'system'"
          - "increments RootProgramAudit.version by 1"
        note: "Adverse branch: the divergent side effect versus UNQUALIFIED is the EV profile retirement and the notice kind."
      - from: FIELDWORK
        to: UNQUALIFIED
        trigger: "POST /ca/root-program-audits/{id}/opine when critical_finding_count == 0 AND finding_count < 3"
        actor: Auditor
        preconditions:
          - "state == FIELDWORK"
          - "finding_count >= 1"
        side_effects:
          - "sets opinion_at = logical clock and opined_by_user_id = X-User-ID"
          - "writes Subscriber.risk_score_audit_final for every subscriber with at least one incident discovered inside [period_start, period_end], per the AUDIT_FINAL variant, and sets assessed_subscriber_count to that population size"
          - "leaves every CertificateProfile untouched and retired_profile_count at 0"
          - "creates one RootProgramCommunication with kind AUDIT_CLEAN_NOTICE, audit_id set, incident_id null, sent_by_user_id 'system'"
          - "increments RootProgramAudit.version by 1"
        note: "Clean branch: same scoring side effect, no profile retirement, different notice kind."

concurrency_rules:
  - rule_id: revocation-request-create-stale-certificate
    parent_entity: Certificate
    write_endpoint: "POST /ca/revocation-requests"
    occ_field: "expected_certificate_version"
    description: |
      Creating a RevocationRequest against a Certificate whose version has advanced
      since the client last read it is rejected. A newer request legitimately
      supersedes any prior REQUESTED request for the same certificate, so the second
      create is NOT stopped by any state precondition; the OCC guard on
      Certificate.version is what makes the stale writer observable and deterministic.
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412
  - rule_id: crl-publish-stale-profile
    parent_entity: CertificateProfile
    write_endpoint: "POST /ca/certificate-profiles/{id}/crl-publications"
    occ_field: "expected_profile_version"
    description: |
      Publishing a CRL against a CertificateProfile whose version has advanced since
      the client last read it is rejected. Each publication legitimately supersedes
      the profile's previous CRL and drains whatever is pending at that moment, so a
      second publication from a stale view would otherwise succeed and silently
      publish a list that omits revocations recorded in between.
    error_id: ERR_STALE_PROFILE_VERSION
    http_status: 412

calculations:
  - name: certificate_validity_window
    trigger: "POST /ca/certificate-requests/{id}/clear-validation writes the PROJECTED_AT_CLEARANCE variant onto CertificateRequest.projected_not_before / projected_not_after; POST /ca/certificate-requests/{id}/issue writes the FINAL_AT_ISSUANCE variant onto Certificate.not_before / not_after / validity_days_final"
    algorithm: threshold
    formula: |
      cap_days = min(request.requested_validity_days, profile.max_validity_days)

      # variant PROJECTED_AT_CLEARANCE (written on the CertificateRequest)
      projected_not_before = clock_at_clearance
      projected_not_after  = clock_at_clearance + cap_days days

      # variant FINAL_AT_ISSUANCE (written on the Certificate)
      not_before        = clock_at_issuance
      profile_cap       = clock_at_issuance + cap_days days
      dcv_floor         = min(auth.expires_at for auth in request.consumed_authorization_ids)
      attestation_cap   = ceremony.attestation_expires_at
      not_after         = min(profile_cap, dcv_floor, attestation_cap)
      validity_days_final = floor((not_after - not_before) total_seconds / 86400)
    input_set: "The PROJECTED variant reads only the request and the profile. The FINAL variant additionally reads every DomainAuthorization named in consumed_authorization_ids (all of which are in state VALIDATED at issuance time) and the KeyCeremony named in the issue body (state ATTESTED)."
    constants:
      SECONDS_PER_DAY: 86400
    precision: "Whole seconds; every emitted timestamp is ISO 8601 UTC with exactly three fractional digits."
    variants:
      - name: PROJECTED_AT_CLEARANCE
        when: "clear-validation, stored on CertificateRequest.projected_not_after"
        difference: "Anchored to the clearance clock and capped only by min(requested_validity_days, profile.max_validity_days); it deliberately ignores the domain-authorization reuse floor and the ceremony attestation cap."
      - name: FINAL_AT_ISSUANCE
        when: "issue, stored on Certificate.not_after"
        difference: "Anchored to the (later) issuance clock and additionally floored by the earliest consumed authorization's expires_at and by the ceremony's attestation_expires_at, so it is strictly earlier than the projection whenever either cap binds."

  - name: issuance_charge_settlement
    trigger: "POST /ca/certificate-requests/{id}/clear-validation writes CertificateRequest.projected_charge_cents; POST /ca/certificate-requests/{id}/issue writes Certificate.charged_amount_cents and debits Subscriber.outstanding_balance_cents by the same amount"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED 1..6. The volume band is keyed on the
      # PRE-DISCOUNT, PRE-EXPEDITE subtotal and is never re-derived after the
      # discount or the expedite fee changes the running total, even though the
      # discounted subtotal or the final total may land in a different band.
      1. unit_cents      = round_half_up(profile.base_fee_cents * VALIDATION_MULTIPLIER[profile.validation_type])
      2. subtotal_cents  = unit_cents * count(request.requested_domains)
      3. volume_discount_pct = VOLUME_BANDS band whose [low, high] contains subtotal_cents
      4. discount_cents  = round_half_up(subtotal_cents * volume_discount_pct)
         discounted_subtotal_cents = subtotal_cents - discount_cents
      5. expedite_fee_cents = request.expedited ? round_half_up(discounted_subtotal_cents * EXPEDITE_PCT) : 0
      6. total_cents     = discounted_subtotal_cents + expedite_fee_cents
      # Step 1 rounds the PER-DOMAIN unit before the multiplication in step 2;
      # rounding the product instead (round_half_up(base * mult * domains))
      # yields a different subtotal whenever base * mult has a fractional part.
    input_set: "Exactly one profile, one request and the request's requested_domains array. No other subscriber or certificate state participates; in particular the subscriber's prior issuance count does NOT affect the band."
    constants:
      VALIDATION_MULTIPLIER: { DV: 1.0, OV: 1.5, EV: 2.5 }
      VOLUME_BANDS: "[0, 49999] -> 0.00 ; [50000, 149999] -> 0.10 ; [150000, and above] -> 0.20"
      EXPEDITE_PCT: 0.25
    precision: "Integer cents throughout; round_half_up at steps 1, 4 and 5 only."

  - name: subscriber_risk_score
    trigger: "The OPERATIONAL variant is recomputed on POST /ca/misissuance-incidents (create), POST /ca/misissuance-incidents/{id}/disclose, POST /ca/misissuance-incidents/{id}/mass-revoke and POST /ca/misissuance-incidents/{id}/close, writing Subscriber.risk_score_operational. The AUDIT_FINAL variant is written only by POST /ca/root-program-audits/{id}/opine, onto Subscriber.risk_score_audit_final."
    algorithm: weighted_scoring
    formula: |
      # variant OPERATIONAL — unresolved exposure only, no decay, integer
      operational_set = { i : MisissuanceIncident i with i.subscriber_id == S.id
                              AND i.state IN {OPEN, DISCLOSED, MASS_REVOCATION_IN_PROGRESS, REMEDIATED} }
      risk_score_operational = min(100, sum(CATEGORY_WEIGHT[i.category] for i in operational_set))

      # variant AUDIT_FINAL — whole audit period, closed incidents at half weight, aged decay
      final_set = { i : MisissuanceIncident i with i.subscriber_id == S.id
                        AND audit.period_start <= i.discovered_at <= audit.period_end }
      for i in final_set:
        closed_multiplier = 0.5 if i.state == CLOSED else 1.0
        age_days = floor((audit_opinion_clock - i.discovered_at) total_seconds / 86400)
        decay    = max(0.4, 1 - 0.1 * floor(age_days / 30))
        term_i   = CATEGORY_WEIGHT[i.category] * closed_multiplier * decay
      risk_score_audit_final = min(100.00, round_half_up(sum(term_i for i in final_set), 2))
    input_set: "OPERATIONAL includes every incident attributed to the subscriber whose state is not CLOSED, with no date filtering. AUDIT_FINAL includes every incident attributed to the subscriber whose discovered_at falls in the closed interval [period_start, period_end] regardless of state, so CLOSED incidents that the operational variant discarded re-enter at half weight."
    constants:
      CATEGORY_WEIGHT: { KEY_COMPROMISE: 40, DOMAIN_MISISSUANCE: 25, ORG_MISISSUANCE: 15, PROCEDURAL: 5 }
      CLOSED_MULTIPLIER: 0.5
      DECAY_STEP_DAYS: 30
      DECAY_PER_STEP: 0.1
      DECAY_FLOOR: 0.4
    precision: "OPERATIONAL is an integer 0..100. AUDIT_FINAL is a number with exactly 2 decimal places, round_half_up applied once to the summed terms (never per term)."
    variants:
      - name: OPERATIONAL
        when: "any incident state change"
        difference: "Counts only incidents whose state is not CLOSED, at full category weight, with no decay and no date window; a subscriber whose incidents are all closed scores 0."
      - name: AUDIT_FINAL
        when: "an audit opinion covering the incident's discovered_at"
        difference: "Counts every incident inside the audit period including CLOSED ones at 0.5 weight, and multiplies each term by an age decay floored at 0.4, so identical incident data produces a different number from OPERATIONAL."

  - name: incident_remediation_penalty
    trigger: "POST /ca/misissuance-incidents/{id}/mass-revoke; the batch result is added to MisissuanceIncident.penalty_total_cents"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round PER CERTIFICATE to whole cents, THEN sum.
      # Summing the unrounded terms and rounding once at the end is a different
      # (and wrong) answer -- for a two-certificate batch the two orders can
      # differ by a full cent.
      for each certificate c revoked by this batch, in the pinned selection order:
        residual_fraction_c = max(0, (c.not_after - clock) total_seconds
                                     / (c.not_after - c.not_before) total_seconds)
        penalty_c = round_half_up(BASE_PENALTY_CENTS
                                  * CATEGORY_PENALTY_WEIGHT[incident.category]
                                  * residual_fraction_c)
      batch_penalty_cents = sum(penalty_c)
      incident.penalty_total_cents = incident.penalty_total_cents + batch_penalty_cents
    input_set: "Only the certificates actually revoked by this batch (at most 50), each contributing exactly once. residual_fraction_c uses the certificate's own FINAL_AT_ISSUANCE window, never the request's projection."
    constants:
      BASE_PENALTY_CENTS: 1000
      CATEGORY_PENALTY_WEIGHT: { KEY_COMPROMISE: 3.0, DOMAIN_MISISSUANCE: 2.0, ORG_MISISSUANCE: 1.5, PROCEDURAL: 0.5 }
    precision: "residual_fraction_c is carried at full precision with no intermediate rounding; each penalty_c is rounded to whole cents with round_half_up before entering the sum."

  - name: revocation_deadline
    trigger: "POST /ca/revocation-requests and every system-cascade or mass-revocation RevocationRequest creation; writes RevocationRequest.deadline_at"
    algorithm: threshold
    formula: |
      base_hours = REASON_DEADLINE_HOURS[reason_code]
      incident_cap_hours = (request.incident_id != null) ? INCIDENT_LINKED_CAP_HOURS : base_hours
      profile_cap_hours  = (certificate.profile.validation_type == 'EV') ? EV_CAP_HOURS : base_hours
      effective_hours    = max(FLOOR_HOURS, min(base_hours, incident_cap_hours, profile_cap_hours))
      deadline_at        = requested_at + effective_hours hours
    input_set: "Three independent inputs interact non-linearly: the reason code, whether the request carries an incident link, and the validation tier of the target certificate's profile. The floor keeps a deadline from collapsing below 4 hours."
    constants:
      REASON_DEADLINE_HOURS: { KEY_COMPROMISE: 24, PRIVILEGE_WITHDRAWN: 24, AFFILIATION_CHANGED: 120, SUPERSEDED: 120, CESSATION_OF_OPERATION: 120, UNSPECIFIED: 120 }
      INCIDENT_LINKED_CAP_HOURS: 24
      EV_CAP_HOURS: 48
      FLOOR_HOURS: 4
    precision: "Whole hours added to requested_at; the resulting timestamp keeps three fractional digits."

  - name: domain_authorization_selection
    trigger: "POST /ca/certificate-requests/{id}/clear-validation, once per entry of requested_domains; the chosen ids are written to CertificateRequest.consumed_authorization_ids in requested_domains order"
    algorithm: chronological
    formula: |
      for each domain D in request.requested_domains (in array order):
        candidates = { a : DomainAuthorization a with
                          a.subscriber_id == request.subscriber_id
                          AND a.profile_id  == request.profile_id
                          AND a.domain_name == D
                          AND a.state == 'VALIDATED'
                          AND a.expires_at > clock            # half-open window
                          AND a.reuse_count < profile.max_dcv_reuse_count }
        if candidates is empty:
          if an authorization for D exists in state EXPIRED, or in state VALIDATED with
             a.expires_at <= clock                     -> ERR_DOMAIN_AUTHORIZATION_EXPIRED
          elif a VALIDATED authorization for D exists but reuse_count >= max -> ERR_DCV_REUSE_LIMIT_EXCEEDED
          else -> ERR_DOMAIN_AUTHORIZATION_MISSING
        # sweep 1 of the clock endpoint flips a VALIDATED authorization whose
        # expires_at <= the new clock to EXPIRED, so the EXPIRED state is the
        # normally observed form of a lapsed reuse window; both forms raise
        # ERR_DOMAIN_AUTHORIZATION_EXPIRED, and only a triple with no VALIDATED
        # and no EXPIRED authorization at all raises ERR_DOMAIN_AUTHORIZATION_MISSING.
        selected = candidate with the greatest validated_at;
                   ties broken by the greatest created_at;
                   ties then broken by the greatest reuse_count
    input_set: "Only VALIDATED, unexpired, under-reuse-cap authorizations for the exact (subscriber, profile, domain) triple. PENDING, FAILED, EXHAUSTED and EXPIRED authorizations are never candidates."
    constants: {}
    precision: "Timestamp comparisons at whole-second resolution; the reuse window is half-open [validated_at, expires_at)."

  - name: mass_revocation_scope_selection
    trigger: "POST /ca/misissuance-incidents/{id}/mass-revoke"
    algorithm: waterfall_allocation
    formula: |
      pool = { c : Certificate c with
                   c.profile_id == incident.scope_profile_id
                   AND c.revocation_status == 'NONE'
                   AND c.lifecycle_status IN {PREISSUANCE, ISSUED}
                   AND incident.scope_issued_from <= c.not_before < incident.scope_issued_to
                   AND (incident.scope_dcv_method IS NULL
                        OR incident.scope_dcv_method IN c.dcv_methods_used) }
      order = pool sorted by c.created_at ASC, ties broken by c.serial_number ASC
      batch = first MASS_REVOCATION_BATCH_CAP entries of order
      remaining_scope_count = count(pool) - count(batch)
      if count(pool) == 0 -> ERR_NO_CERTIFICATES_IN_SCOPE
    input_set: "Certificates of the scoped profile only, restricted to revocation_status NONE (already REVOKED or REVOCATION_PENDING certificates are excluded) and to a half-open not_before window [scope_issued_from, scope_issued_to)."
    constants:
      MASS_REVOCATION_BATCH_CAP: 50
    precision: "Selection order is fully deterministic: created_at ascending, then serial_number ascending (serial numbers are monotonic, never random). Certificate.id never participates in the ordering."

  - name: crl_publication_drain
    trigger: "POST /ca/certificate-profiles/{id}/crl-publications"
    algorithm: aggregation
    formula: |
      drained = { c : Certificate c with c.profile_id == profile.id
                      AND c.revocation_status == 'REVOKED'
                      AND c.crl_published_at IS NULL }
      order   = drained sorted by c.revoked_at ASC, ties broken by c.serial_number ASC
      crl_number      = profile.last_crl_number + 1
      entry_count     = count(drained)
      revoked_serials = [ c.serial_number for c in order ]
      for c in order: c.crl_published_at = clock ; c.crl_number = crl_number
      profile.total_crl_entries_published += entry_count
      profile.pending_crl_entry_count      = 0
      profile.last_crl_number              = crl_number
      profile.last_crl_this_update         = this_update
      profile.last_crl_next_update         = next_update
      # CONSERVED QUANTITY (must hold before and after every publication):
      #   profile.total_crl_entries_published + profile.pending_crl_entry_count
      #     == profile.revoked_certificate_count
    input_set: "Exactly the profile's REVOKED certificates with crl_published_at null. A publication with an empty drain set is legal: entry_count is 0, revoked_serials is [], crl_number still advances by 1."
    constants: {}
    precision: "Integer counts; ordering by revoked_at then serial_number, never by id."

  - name: sct_sufficiency
    trigger: "POST /ca/certificates/{id}/ct-submissions recomputes Certificate.sct_count; POST /ca/certificates/{id}/activate compares it against profile.required_sct_count"
    algorithm: aggregation
    formula: |
      accepted_operators = distinct { s.log_operator : CtLogSubmission s with
                                       s.certificate_id == certificate.id
                                       AND s.outcome == 'ACCEPTED' }
      sct_count = count(accepted_operators)
      counted_toward_sct(new submission) = (outcome == 'ACCEPTED'
                                            AND log_operator NOT IN accepted_operators_before)
      activation_allowed = sct_count >= profile.required_sct_count
    input_set: "Only ACCEPTED submissions, deduplicated by log_operator: two ACCEPTED submissions to the same log count once. REJECTED submissions never count and never decrement."
    constants: {}
    precision: "Integer count; the comparison uses >= so sct_count exactly equal to required_sct_count permits activation."

  - name: ceremony_window_occupation
    trigger: "POST /ca/hsm-partitions/{id}/key-ceremonies"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a mandatory separation buffer. Adjacency is a
      # CONFLICT here: touching windows are rejected because the buffer is
      # strictly positive.
      blocking = { k : KeyCeremony k with k.partition_id == partition.id
                       AND k.state IN {SCHEDULED, WITNESSED, ATTESTED} }
      conflict(new) = EXISTS k in blocking such that
          new.window_start <= k.window_end   + CEREMONY_BUFFER_MINUTES minutes
        AND k.window_start   <= new.window_end + CEREMONY_BUFFER_MINUTES minutes
      if conflict(new) -> ERR_CEREMONY_WINDOW_CONFLICT
    input_set: "Ceremonies on the same partition in state SCHEDULED, WITNESSED or ATTESTED. ABORTED and ATTESTATION_REVOKED ceremonies free their window and never block."
    constants:
      CEREMONY_BUFFER_MINUTES: 60
    precision: "Whole minutes; the comparison uses <= so a gap of exactly 60 minutes still conflicts and a gap of 60 minutes plus one second does not."

  - name: crl_window_coverage
    trigger: "POST /ca/certificate-profiles/{id}/crl-publications"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [this_update, next_update) on the profile's CRL series,
      # with the OPPOSITE geometry to the ceremony rule: here overlap is MANDATORY
      # and insufficient overlap is the violation, while a window nested inside the
      # previous one is a collision that never advances the series.
      if profile.last_crl_number == 0:
        require next_update > this_update                       # first CRL: no coverage constraint
      else:
        require this_update <= profile.last_crl_next_update
                               - CRL_MIN_OVERLAP_MINUTES minutes   else ERR_CRL_COVERAGE_GAP
        require next_update >  profile.last_crl_next_update        else ERR_CRL_WINDOW_NOT_ADVANCING
      require (next_update - this_update) <= profile.max_crl_validity_hours hours
                                                                  else ERR_CRL_VALIDITY_TOO_LONG
    input_set: "Only the profile's most recent publication (identified by last_crl_number) constrains the new window; older publications in the series do not."
    constants:
      CRL_MIN_OVERLAP_MINUTES: 30
    precision: "Whole minutes; the overlap comparison uses <= so an overlap of exactly 30 minutes is accepted and 29 minutes 59 seconds is a gap violation."

  - name: incident_disclosure_deadline
    trigger: "POST /ca/misissuance-incidents writes disclosure_due_at; sweep 3 of POST /_clock/set_current_utc writes disclosure_breached; POST /ca/misissuance-incidents/{id}/disclose and POST /ca/root-program-audits/{id}/communications write RootProgramCommunication.within_deadline"
    algorithm: threshold
    formula: |
      disclosure_due_at = discovered_at + INCIDENT_DISCLOSURE_HOURS hours

      # sweep 3 (STRICT comparison, deliberately unlike sweep 1 and sweep 2)
      disclosure_breached = true  iff  state == 'OPEN' AND new_clock > disclosure_due_at
      # sweeps 1 and 2 use the half-open convention `<= new_clock`, so a DCV
      # authorization or a certificate whose boundary equals the new clock DOES
      # flip, while an incident whose disclosure_due_at equals the new clock does NOT.

      within_deadline(INCIDENT_DISCLOSURE)   = sent_at <= incident.disclosure_due_at
      within_deadline(BREACH_ESCALATION)     = false
      within_deadline(AUDIT_*_NOTICE)        = true
      within_deadline(ROOT_PROGRAM_RESPONSE) = sent_at <= audit.opinion_at
                                                          + ROOT_PROGRAM_RESPONSE_DAYS days
    input_set: "Only the incident's own discovered_at and state, or the audit's own opinion_at. No other entity participates."
    constants:
      INCIDENT_DISCLOSURE_HOURS: 24
      ROOT_PROGRAM_RESPONSE_DAYS: 14
    precision: "Whole hours and whole days; the sweep comparison is strict (>) while the within_deadline comparisons are inclusive (<=), so the exact deadline instant is on time for both."

# §1.4 Validation Rules. Priority numbers are GLOBAL and STRICTLY ORDERED: when a
# single request violates several rules, the implementation returns the error of the
# lowest-numbered violated rule and stops. Bands: 1-4 authentication/authorization,
# 5-8 request schema, 10-24 existence (left-to-right along the path, then body FKs),
# 25-26 optimistic concurrency, 30-52 state preconditions, 60-69 segregation of duties
# and key-ceremony compliance, 70-79 issuance compliance gates, 80-89 uniqueness,
# 90-99 temporal geometry, 100-109 referential coherence, 110-119 capacity/aggregate
# constraints, 120 fiscal.
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty"
    error_id: ERR_MISSING_USER_HEADER
    http_status: 401
    applies_to: "all endpoints except GET endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role header is present and non-empty"
    error_id: ERR_MISSING_ROLE_HEADER
    http_status: 401
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all endpoints"
  - priority: 4
    category: auth
    check: "the role in X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 5
    category: business_constraint
    check: "every required input field of the endpoint is present and of the declared JSON type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 6
    category: business_constraint
    check: "every enum-typed input field holds one of the values declared in §1.1"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST and PATCH endpoints with enum inputs"
  - priority: 7
    category: business_constraint
    check: "integer inputs are within their declared range: max_validity_days 1..398, dcv_reuse_days 1..398, max_dcv_reuse_count 1..50, org_vetting_reuse_days 0..825 and at least 1 when validation_type is OV or EV, required_sct_count 0..5, base_fee_cents 1..10000000, crl_trigger_threshold 1..1000, max_crl_validity_hours 1..240, credit_limit_cents 0..100000000, requested_validity_days 1..398, csr_key_bits in {2048, 3072, 4096}, attestation_valid_days 1..365"
    error_id: ERR_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /ca/certificate-profiles, POST /ca/subscribers, POST /ca/certificate-requests, POST /ca/hsm-partitions/{id}/key-ceremonies"
  - priority: 8
    category: business_constraint
    check: "requested_domains holds between 1 and 10 entries with no duplicate (case-insensitive) domain name, and allowed_dcv_methods holds between 1 and 4 distinct methods"
    error_id: ERR_INVALID_ARRAY_CONTENT
    http_status: 422
    applies_to: "POST /ca/certificate-requests, POST /ca/certificate-profiles"
  - priority: 10
    category: existence
    check: "the CertificateProfile named by {id} or by profile_id exists"
    error_id: ERR_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id} or a profile_id / scope_profile_id body field"
  - priority: 11
    category: existence
    check: "the Subscriber named by {id} or by subscriber_id exists"
    error_id: ERR_SUBSCRIBER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id} or a subscriber_id body field"
  - priority: 12
    category: existence
    check: "the OrganizationVetting named by {id} exists"
    error_id: ERR_VETTING_NOT_FOUND
    http_status: 404
    applies_to: "POST /ca/organization-vettings/{id}/checks, POST /ca/organization-vettings/{id}/approve, GET /ca/organization-vettings/{id}"
  - priority: 13
    category: existence
    check: "the DomainAuthorization named by {id} exists"
    error_id: ERR_AUTHORIZATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id}"
  - priority: 14
    category: existence
    check: "the CertificateRequest named by {id} exists"
    error_id: ERR_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id}"
  - priority: 15
    category: existence
    check: "the Certificate named by {id}, by certificate_id or by supersedes_certificate_id exists"
    error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id}, certificate_id or supersedes_certificate_id"
  - priority: 16
    category: existence
    check: "the HsmPartition named by {id} exists"
    error_id: ERR_PARTITION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id}"
  - priority: 17
    category: existence
    check: "the KeyCeremony named by {id} or by ceremony_id exists"
    error_id: ERR_CEREMONY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id} or a ceremony_id body field"
  - priority: 18
    category: existence
    check: "the RevocationRequest named by {id} exists"
    error_id: ERR_REVOCATION_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id}"
  - priority: 19
    category: existence
    check: "the MisissuanceIncident named by {id} or by incident_id exists"
    error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id} or an incident_id body field"
  - priority: 20
    category: existence
    check: "the RootProgramAudit named by {id} exists"
    error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying {id}"
  - priority: 25
    category: state
    check: "expected_certificate_version equals the target Certificate's current version"
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412
    applies_to: "POST /ca/revocation-requests"
  - priority: 26
    category: state
    check: "expected_profile_version equals the target CertificateProfile's current version"
    error_id: ERR_STALE_PROFILE_VERSION
    http_status: 412
    applies_to: "POST /ca/certificate-profiles/{id}/crl-publications"
  - priority: 29
    category: business_temporal
    check: "the certificate's not_after is strictly after the logical clock"
    error_id: ERR_CERTIFICATE_ALREADY_EXPIRED
    http_status: 409
    applies_to: "POST /ca/certificates/{id}/activate"
    note: "Deliberately ordered ahead of the lifecycle_status check at priority 42: clock sweep 2 flips a PREISSUANCE certificate to EXPIRED as soon as not_after <= the clock, so this more specific expiry error must be raised before ERR_CERTIFICATE_NOT_PREISSUANCE, which stays reachable by activating an already ISSUED certificate."
  - priority: 30
    category: state
    check: "the CertificateProfile is in status DRAFT"
    error_id: ERR_PROFILE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /ca/certificate-profiles/{id}/activate"
  - priority: 31
    category: state
    check: "the CertificateProfile is in status ACTIVE"
    error_id: ERR_PROFILE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ca/domain-authorizations, POST /ca/domain-authorizations/{id}/validate, POST /ca/certificate-requests/{id}/submit, POST /ca/certificate-requests/{id}/clear-validation, POST /ca/certificate-requests/{id}/issue, POST /ca/certificate-profiles/{id}/crl-publications"
  - priority: 32
    category: state
    check: "the CertificateProfile's status_service_posture is NOMINAL"
    error_id: ERR_PROFILE_STATUS_SERVICE_OVERDUE
    http_status: 409
    applies_to: "POST /ca/certificate-requests/{id}/issue"
  - priority: 33
    category: state
    check: "the Subscriber's account_status is ACTIVE"
    error_id: ERR_SUBSCRIBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /ca/subscribers/{id}/organization-vettings, POST /ca/domain-authorizations, POST /ca/domain-authorizations/{id}/validate, POST /ca/certificate-requests, POST /ca/certificate-requests/{id}/submit, POST /ca/certificate-requests/{id}/clear-validation, POST /ca/certificate-requests/{id}/issue"
  - priority: 34
    category: state
    check: "the OrganizationVetting's vetting_state is PENDING, IN_PROGRESS or AWAITING_APPROVAL"
    error_id: ERR_VETTING_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /ca/organization-vettings/{id}/checks"
  - priority: 35
    category: state
    check: "the OrganizationVetting's vetting_state is AWAITING_APPROVAL"
    error_id: ERR_VETTING_NOT_AWAITING_APPROVAL
    http_status: 409
    applies_to: "POST /ca/organization-vettings/{id}/approve"
  - priority: 36
    category: state
    check: "the DomainAuthorization's state is PENDING or FAILED"
    error_id: ERR_AUTHORIZATION_NOT_VALIDATABLE
    http_status: 409
    applies_to: "POST /ca/domain-authorizations/{id}/validate"
  - priority: 37
    category: state
    check: "the DomainAuthorization's state is VALIDATED"
    error_id: ERR_AUTHORIZATION_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /ca/domain-authorizations/{id}/invalidate"
  - priority: 38
    category: state
    check: "the CertificateRequest's state is DRAFT"
    error_id: ERR_REQUEST_NOT_DRAFT
    http_status: 409
    applies_to: "POST /ca/certificate-requests/{id}/submit"
  - priority: 39
    category: state
    check: "the CertificateRequest's state is SUBMITTED"
    error_id: ERR_REQUEST_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /ca/certificate-requests/{id}/return, POST /ca/certificate-requests/{id}/clear-validation"
  - priority: 40
    category: state
    check: "the CertificateRequest's state is DRAFT or SUBMITTED"
    error_id: ERR_REQUEST_NOT_REJECTABLE
    http_status: 409
    applies_to: "POST /ca/certificate-requests/{id}/reject"
  - priority: 41
    category: state
    check: "the CertificateRequest's state is READY_TO_ISSUE"
    error_id: ERR_REQUEST_NOT_READY
    http_status: 409
    applies_to: "POST /ca/certificate-requests/{id}/issue"
  - priority: 42
    category: state
    check: "the Certificate's lifecycle_status is PREISSUANCE"
    error_id: ERR_CERTIFICATE_NOT_PREISSUANCE
    http_status: 409
    applies_to: "POST /ca/certificates/{id}/activate"
  - priority: 43
    category: state
    check: "the Certificate's lifecycle_status is PREISSUANCE or ISSUED and its revocation_status is NONE"
    error_id: ERR_CERTIFICATE_NOT_REVOCABLE
    http_status: 409
    applies_to: "POST /ca/revocation-requests, POST /ca/certificates/{id}/ct-submissions"
  - priority: 44
    category: state
    check: "the RevocationRequest's state is REQUESTED"
    error_id: ERR_REVOCATION_REQUEST_NOT_OPEN
    http_status: 409
    applies_to: "POST /ca/revocation-requests/{id}/execute, POST /ca/revocation-requests/{id}/deny"
  - priority: 45
    category: state
    check: "the HsmPartition's state is OPERATIONAL"
    error_id: ERR_PARTITION_QUARANTINED
    http_status: 409
    applies_to: "POST /ca/hsm-partitions/{id}/key-ceremonies, POST /ca/key-ceremonies/{id}/attest, POST /ca/certificate-requests/{id}/issue"
  - priority: 46
    category: state
    check: "the KeyCeremony's state is SCHEDULED"
    error_id: ERR_CEREMONY_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /ca/key-ceremonies/{id}/witness"
  - priority: 47
    category: state
    check: "the KeyCeremony's state is WITNESSED"
    error_id: ERR_CEREMONY_NOT_WITNESSED
    http_status: 409
    applies_to: "POST /ca/key-ceremonies/{id}/attest"
  - priority: 48
    category: state
    check: "the KeyCeremony's state is ATTESTED"
    error_id: ERR_CEREMONY_NOT_ATTESTED
    http_status: 409
    applies_to: "POST /ca/key-ceremonies/{id}/revoke-attestation"
  - priority: 49
    category: state
    check: "the KeyCeremony's state is SCHEDULED or WITNESSED"
    error_id: ERR_CEREMONY_NOT_ABORTABLE
    http_status: 409
    applies_to: "POST /ca/key-ceremonies/{id}/abort"
  - priority: 50
    category: state
    check: "the MisissuanceIncident's state is OPEN"
    error_id: ERR_INCIDENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /ca/misissuance-incidents/{id}/disclose"
  - priority: 51
    category: state
    check: "the MisissuanceIncident's state is DISCLOSED or MASS_REVOCATION_IN_PROGRESS"
    error_id: ERR_INCIDENT_NOT_DISCLOSED
    http_status: 409
    applies_to: "POST /ca/misissuance-incidents/{id}/mass-revoke, POST /ca/misissuance-incidents/{id}/communications"
  - priority: 52
    category: state
    check: "the MisissuanceIncident's state is DISCLOSED, MASS_REVOCATION_IN_PROGRESS or REMEDIATED"
    error_id: ERR_INCIDENT_NOT_CLOSEABLE
    http_status: 409
    applies_to: "POST /ca/misissuance-incidents/{id}/close"
  - priority: 53
    category: state
    check: "the RootProgramAudit's state is SCHEDULED or FIELDWORK"
    error_id: ERR_AUDIT_NOT_OPEN_FOR_FINDINGS
    http_status: 409
    applies_to: "POST /ca/root-program-audits/{id}/findings"
  - priority: 54
    category: state
    check: "the RootProgramAudit has not been opined yet (state is SCHEDULED or FIELDWORK); an audit already in QUALIFIED or UNQUALIFIED can never be opined again"
    error_id: ERR_AUDIT_NOT_IN_FIELDWORK
    http_status: 409
    applies_to: "POST /ca/root-program-audits/{id}/opine"
  - priority: 55
    category: state
    check: "the RootProgramAudit's state is QUALIFIED or UNQUALIFIED (follow-up correspondence is only sent after an opinion has been issued)"
    error_id: ERR_AUDIT_NOT_OPINED
    http_status: 409
    applies_to: "POST /ca/root-program-audits/{id}/communications"
  - priority: 60
    category: business_safety
    check: "the approving X-User-ID differs from every non-null registry_checked_by_user_id, callback_checked_by_user_id and authority_checked_by_user_id on the vetting (segregation of duties)"
    error_id: ERR_VETTING_SOD_VIOLATION
    http_status: 409
    applies_to: "POST /ca/organization-vettings/{id}/approve"
  - priority: 61
    category: business_safety
    check: "the witnessing X-User-ID is not already present in the ceremony's witness_user_ids"
    error_id: ERR_DUPLICATE_WITNESS
    http_status: 409
    applies_to: "POST /ca/key-ceremonies/{id}/witness"
  - priority: 62
    category: business_safety
    check: "the attesting X-User-ID is not present in the ceremony's witness_user_ids (an auditor may not attest a ceremony they witnessed)"
    error_id: ERR_ATTESTER_WAS_WITNESS
    http_status: 409
    applies_to: "POST /ca/key-ceremonies/{id}/attest"
  - priority: 63
    category: business_temporal
    check: "the logical clock is at or after the ceremony's window_end (a ceremony cannot be attested while its window is still open)"
    error_id: ERR_CEREMONY_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /ca/key-ceremonies/{id}/attest"
  - priority: 64
    category: business_safety
    check: "the issuing X-User-ID differs from the request's validation_cleared_by_user_id (the officer who cleared validation may not issue the certificate)"
    error_id: ERR_ISSUANCE_SOD_VIOLATION
    http_status: 409
    applies_to: "POST /ca/certificate-requests/{id}/issue"
  - priority: 70
    category: business_safety
    check: "the KeyCeremony named in the issue body is in state ATTESTED"
    error_id: ERR_CEREMONY_NOT_ATTESTED_FOR_ISSUANCE
    http_status: 409
    applies_to: "POST /ca/certificate-requests/{id}/issue"
  - priority: 71
    category: business_temporal
    check: "the KeyCeremony's attestation_expires_at is strictly after the logical clock"
    error_id: ERR_CEREMONY_ATTESTATION_EXPIRED
    http_status: 409
    applies_to: "POST /ca/certificate-requests/{id}/issue"
  - priority: 72
    category: business_safety
    check: "the DomainAuthorization's method appears in the profile's allowed_dcv_methods"
    error_id: ERR_DCV_METHOD_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /ca/domain-authorizations"
  - priority: 73
    category: business_referential
    check: "for every entry of requested_domains at least one DomainAuthorization exists for the (subscriber_id, profile_id, domain_name) triple in state VALIDATED or EXPIRED (a PENDING, FAILED or EXHAUSTED authorization never satisfies this check)"
    error_id: ERR_DOMAIN_AUTHORIZATION_MISSING
    http_status: 422
    applies_to: "POST /ca/certificate-requests/{id}/clear-validation"
  - priority: 74
    category: business_temporal
    check: "for every entry of requested_domains at least one authorization for the triple is in state VALIDATED with expires_at strictly after the logical clock (half-open reuse window); an authorization already flipped to EXPIRED by sweep 1, or still VALIDATED with expires_at <= the clock, fails this check"
    error_id: ERR_DOMAIN_AUTHORIZATION_EXPIRED
    http_status: 422
    applies_to: "POST /ca/certificate-requests/{id}/clear-validation"
  - priority: 75
    category: business_constraint
    check: "every selected authorization has reuse_count strictly below profile.max_dcv_reuse_count"
    error_id: ERR_DCV_REUSE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /ca/certificate-requests/{id}/clear-validation"
  - priority: 76
    category: business_safety
    check: "when profile.required_vetting_level is not NONE, the subscriber holds an OrganizationVetting in vetting_state APPROVED"
    error_id: ERR_ORG_VETTING_REQUIRED
    http_status: 422
    applies_to: "POST /ca/certificate-requests/{id}/clear-validation"
  - priority: 77
    category: business_safety
    check: "the APPROVED vetting's required_level covers the profile's required_vetting_level under the ordering NONE < OV < EV (an OV vetting never satisfies an EV profile)"
    error_id: ERR_ORG_VETTING_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /ca/certificate-requests/{id}/clear-validation"
  - priority: 78
    category: business_temporal
    check: "the APPROVED vetting's approved_at is strictly after (logical clock - profile.org_vetting_reuse_days days)"
    error_id: ERR_ORG_VETTING_REUSE_EXPIRED
    http_status: 422
    applies_to: "POST /ca/certificate-requests/{id}/clear-validation"
  - priority: 79
    category: business_safety
    check: "csr_key_bits meets the profile's validation-type minimum: DV and OV require at least 2048, EV requires at least 3072"
    error_id: ERR_CSR_KEY_TOO_WEAK
    http_status: 422
    applies_to: "POST /ca/certificate-requests/{id}/clear-validation"
  - priority: 80
    category: business_safety
    check: "when the incident's disclosure_breached is true, a RootProgramCommunication with kind BREACH_ESCALATION must already exist for the incident before any mass revocation may run"
    error_id: ERR_INCIDENT_DISCLOSURE_BREACHED
    http_status: 409
    applies_to: "POST /ca/misissuance-incidents/{id}/mass-revoke"
  - priority: 81
    category: business_safety
    check: "the RevocationRequest's origin is not SYSTEM_CASCADE (a cascade-raised revocation may not be denied)"
    error_id: ERR_CASCADE_REVOCATION_NOT_DENIABLE
    http_status: 409
    applies_to: "POST /ca/revocation-requests/{id}/deny"
  - priority: 82
    category: business_safety
    check: "the target Certificate's lifecycle_status is not EXPIRED (an expired certificate is never added to a CRL; its open revocation request must be denied instead)"
    error_id: ERR_CERTIFICATE_EXPIRED_NOT_REVOCABLE
    http_status: 409
    applies_to: "POST /ca/revocation-requests/{id}/execute"
  - priority: 85
    category: business_constraint
    check: "CertificateProfile.name is unique across all profiles after case-folding (case-insensitive)"
    error_id: ERR_PROFILE_NAME_DUPLICATE
    http_status: 409
    applies_to: "POST /ca/certificate-profiles"
  - priority: 86
    category: business_constraint
    check: "the (jurisdiction_code, registry_id) pair is unique across all subscribers"
    error_id: ERR_SUBSCRIBER_REGISTRY_DUPLICATE
    http_status: 409
    applies_to: "POST /ca/subscribers"
  - priority: 87
    category: business_constraint
    check: "HsmPartition.serial is unique across all partitions"
    error_id: ERR_PARTITION_SERIAL_DUPLICATE
    http_status: 409
    applies_to: "POST /ca/hsm-partitions"
  - priority: 88
    category: business_constraint
    check: "the subscriber has no OrganizationVetting in vetting_state PENDING, IN_PROGRESS or AWAITING_APPROVAL"
    error_id: ERR_VETTING_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /ca/subscribers/{id}/organization-vettings"
  - priority: 89
    category: business_constraint
    check: "no DomainAuthorization in state PENDING or VALIDATED already exists for the same (subscriber_id, profile_id, domain_name) triple"
    error_id: ERR_AUTHORIZATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /ca/domain-authorizations"
  - priority: 90
    category: business_temporal
    check: "window_end is strictly after window_start"
    error_id: ERR_INVALID_CEREMONY_WINDOW
    http_status: 422
    applies_to: "POST /ca/hsm-partitions/{id}/key-ceremonies"
  - priority: 91
    category: business_temporal
    check: "the requested ceremony window keeps at least CEREMONY_BUFFER_MINUTES (60) minutes of clearance from every SCHEDULED, WITNESSED or ATTESTED ceremony on the same partition, per the ceremony_window_occupation rule (closed intervals: a gap of exactly 60 minutes still conflicts)"
    error_id: ERR_CEREMONY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /ca/hsm-partitions/{id}/key-ceremonies"
  - priority: 92
    category: business_temporal
    check: "next_update is strictly after this_update"
    error_id: ERR_INVALID_CRL_WINDOW
    http_status: 422
    applies_to: "POST /ca/certificate-profiles/{id}/crl-publications"
  - priority: 93
    category: business_temporal
    check: "when the profile already has a published CRL, this_update is at or before (last_crl_next_update - CRL_MIN_OVERLAP_MINUTES (30) minutes), so consecutive CRLs overlap by at least 30 minutes and status service never has a coverage gap"
    error_id: ERR_CRL_COVERAGE_GAP
    http_status: 409
    applies_to: "POST /ca/certificate-profiles/{id}/crl-publications"
  - priority: 94
    category: business_temporal
    check: "when the profile already has a published CRL, next_update is strictly after last_crl_next_update, so the series advances instead of nesting inside the previous window"
    error_id: ERR_CRL_WINDOW_NOT_ADVANCING
    http_status: 409
    applies_to: "POST /ca/certificate-profiles/{id}/crl-publications"
  - priority: 95
    category: business_temporal
    check: "next_update - this_update is at most profile.max_crl_validity_hours hours"
    error_id: ERR_CRL_VALIDITY_TOO_LONG
    http_status: 422
    applies_to: "POST /ca/certificate-profiles/{id}/crl-publications"
  - priority: 96
    category: business_temporal
    check: "scope_issued_to is strictly after scope_issued_from"
    error_id: ERR_INVALID_SCOPE_WINDOW
    http_status: 422
    applies_to: "POST /ca/misissuance-incidents"
  - priority: 97
    category: business_temporal
    check: "period_end is strictly after period_start and the period is at most 366 days long"
    error_id: ERR_INVALID_AUDIT_PERIOD
    http_status: 422
    applies_to: "POST /ca/root-program-audits"
  - priority: 98
    category: business_constraint
    check: "no RootProgramAudit in state SCHEDULED or FIELDWORK already exists for the same root_program"
    error_id: ERR_AUDIT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /ca/root-program-audits"
  - priority: 99
    category: business_temporal
    check: "the submitted current_utc is at or after the server's current logical clock (the clock never moves backwards)"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 100
    category: business_referential
    check: "the certificate named by supersedes_certificate_id belongs to the same subscriber_id as the issuing request"
    error_id: ERR_SUPERSEDES_SUBSCRIBER_MISMATCH
    http_status: 422
    applies_to: "POST /ca/certificate-requests/{id}/issue"
  - priority: 101
    category: business_referential
    check: "scope_dcv_method, when present, appears in the scoped profile's allowed_dcv_methods"
    error_id: ERR_SCOPE_METHOD_NOT_IN_PROFILE
    http_status: 422
    applies_to: "POST /ca/misissuance-incidents"
  - priority: 102
    category: business_referential
    check: "when incident_id is present on a revocation request, the target certificate's profile_id equals the incident's scope_profile_id"
    error_id: ERR_INCIDENT_CERTIFICATE_MISMATCH
    http_status: 422
    applies_to: "POST /ca/revocation-requests"
  - priority: 103
    category: business_referential
    check: "the CtLogSubmission's rejection_reason is present exactly when outcome is REJECTED"
    error_id: ERR_REJECTION_REASON_MISMATCH
    http_status: 422
    applies_to: "POST /ca/certificates/{id}/ct-submissions"
  - priority: 110
    category: business_constraint
    check: "the candidate pool selected by mass_revocation_scope_selection is non-empty"
    error_id: ERR_NO_CERTIFICATES_IN_SCOPE
    http_status: 422
    applies_to: "POST /ca/misissuance-incidents/{id}/mass-revoke"
  - priority: 111
    category: business_constraint
    check: "the certificate's sct_count (distinct ACCEPTED log operators) is at least profile.required_sct_count"
    error_id: ERR_INSUFFICIENT_SCTS
    http_status: 409
    applies_to: "POST /ca/certificates/{id}/activate"
  - priority: 113
    category: business_constraint
    check: "the incident's remaining_scope_count is 0 and every RevocationRequest carrying this incident_id is in state EXECUTED or DENIED"
    error_id: ERR_INCIDENT_REVOCATIONS_OUTSTANDING
    http_status: 409
    applies_to: "POST /ca/misissuance-incidents/{id}/close"
  - priority: 114
    category: business_constraint
    check: "the audit's finding_count is at least 1"
    error_id: ERR_AUDIT_NO_FINDINGS
    http_status: 422
    applies_to: "POST /ca/root-program-audits/{id}/opine"
  - priority: 120
    category: business_fiscal
    check: "Subscriber.outstanding_balance_cents plus the issuance_charge_settlement total is at most Subscriber.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /ca/certificate-requests/{id}/issue"

# §1.5 API surface. All paths are absolute; the business surface is under /ca and the
# single test-driving endpoint is under /_clock. Every listed GET is available to all
# six roles so that any test can read back state regardless of the role it is acting as.
endpoints:
  - method: POST
    path: "/ca/certificate-profiles"
    description: "Create a certificate profile in status DRAFT with status_service_posture NOMINAL; required_vetting_level is derived from validation_type (DV->NONE, OV->OV, EV->EV)"
    roles: [POLICY_ADMIN]
    code: 201
    input: [name, validation_type, max_validity_days, dcv_reuse_days, max_dcv_reuse_count, org_vetting_reuse_days, allowed_dcv_methods, required_sct_count, base_fee_cents, crl_trigger_threshold, max_crl_validity_hours]
    output: CertificateProfile
    side_effects: ["derives required_vetting_level", "initialises pending_crl_entry_count, revoked_certificate_count, total_crl_entries_published and last_crl_number to 0"]
  - method: GET
    path: "/ca/certificate-profiles"
    description: "List certificate profiles, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["status?", "validation_type?", "status_service_posture?", "limit?", "offset?"]
    output: CertificateProfile[]
    side_effects: []
  - method: GET
    path: "/ca/certificate-profiles/{id}"
    description: "Read one certificate profile including its CRL ledger counters"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: CertificateProfile
    side_effects: []
  - method: POST
    path: "/ca/certificate-profiles/{id}/activate"
    description: "Move the profile DRAFT -> ACTIVE so it can accept domain authorizations and certificate requests"
    roles: [POLICY_ADMIN]
    code: 200
    input: []
    output: CertificateProfile
    side_effects: ["sets activated_at", "increments version"]
  - method: POST
    path: "/ca/certificate-profiles/{id}/crl-publications"
    description: "Publish a CRL for the profile: validates the window geometry per crl_window_coverage, drains every unpublished REVOKED certificate per crl_publication_drain and returns the immutable publication record"
    roles: [REVOCATION_OFFICER]
    code: 201
    input: [this_update, next_update, expected_profile_version]
    output: CrlPublication
    side_effects: ["assigns crl_number = profile.last_crl_number + 1", "stamps crl_published_at and crl_number on every drained certificate", "moves status_service_posture CRL_OVERDUE -> NOMINAL when the queue empties, releasing every ISSUANCE_BLOCKED request of the profile back to READY_TO_ISSUE", "increments CertificateProfile.version"]
  - method: GET
    path: "/ca/certificate-profiles/{id}/crl-publications"
    description: "List the profile's CRL publications in ascending crl_number order"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["limit?", "offset?"]
    output: CrlPublication[]
    side_effects: []
  - method: POST
    path: "/ca/subscribers"
    description: "Register a subscriber in account_status ACTIVE"
    roles: [POLICY_ADMIN]
    code: 201
    input: [legal_name, jurisdiction_code, registry_id, contact_email, callback_phone, credit_limit_cents]
    output: Subscriber
    side_effects: ["initialises outstanding_balance_cents, issued_certificate_count, revocation_pending_count and risk_score_operational to 0"]
  - method: GET
    path: "/ca/subscribers"
    description: "List subscribers, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["account_status?", "jurisdiction_code?", "limit?", "offset?"]
    output: Subscriber[]
    side_effects: []
  - method: GET
    path: "/ca/subscribers/{id}"
    description: "Read one subscriber including both risk scores and the fiscal counters"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: Subscriber
    side_effects: []
  - method: PATCH
    path: "/ca/subscribers/{id}"
    description: "Update a subscriber's credit limit and contact details; account_status and every computed counter are never writable from the body"
    roles: [POLICY_ADMIN]
    code: 200
    input: ["credit_limit_cents?", "contact_email?", "callback_phone?"]
    output: Subscriber
    side_effects: ["increments Subscriber.version"]
  - method: POST
    path: "/ca/subscribers/{id}/organization-vettings"
    description: "Open an organizational vetting file for the subscriber in vetting_state PENDING with all three check dimensions NOT_STARTED"
    roles: [VALIDATION_OFFICER]
    code: 201
    input: [required_level]
    output: OrganizationVetting
    side_effects: []
  - method: GET
    path: "/ca/subscribers/{id}/organization-vettings"
    description: "List the subscriber's vetting files, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["vetting_state?", "limit?", "offset?"]
    output: OrganizationVetting[]
    side_effects: []
  - method: GET
    path: "/ca/organization-vettings/{id}"
    description: "Read one vetting file including the three per-dimension check statuses and the user ids that recorded them"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: OrganizationVetting
    side_effects: []
  - method: POST
    path: "/ca/organization-vettings/{id}/checks"
    description: "Record the outcome of one vetting dimension; a PASSED result advances vetting_state, a FAILED result on a required dimension rejects the file outright. Body enums: dimension is one of REGISTRY | CALLBACK | AUTHORITY, outcome is one of PASSED | FAILED"
    roles: [VALIDATION_OFFICER]
    code: 200
    input: [dimension, outcome, "evidence_ref?"]
    output: OrganizationVetting
    side_effects: ["stamps the dimension's <check>_check_status and <check>_checked_by_user_id from X-User-ID", "advances vetting_state PENDING -> IN_PROGRESS -> AWAITING_APPROVAL, or -> REJECTED on a FAILED required dimension", "increments OrganizationVetting.version"]
  - method: POST
    path: "/ca/organization-vettings/{id}/approve"
    description: "Approve a fully checked vetting file; the approver must not be any of the users who recorded the checks"
    roles: [VETTING_APPROVER]
    code: 200
    input: []
    output: OrganizationVetting
    side_effects: ["sets approved_at and approved_by_user_id", "increments OrganizationVetting.version"]
  - method: POST
    path: "/ca/domain-authorizations"
    description: "Open a domain control validation challenge for one domain against one ACTIVE profile; the server mints challenge_token and returns it in the response"
    roles: [VALIDATION_OFFICER]
    code: 201
    input: [subscriber_id, profile_id, domain_name, method]
    output: DomainAuthorization
    side_effects: ["mints challenge_token", "initialises attempt_count, reuse_count and invalidation_count to 0"]
  - method: GET
    path: "/ca/domain-authorizations"
    description: "List domain authorizations filtered by owner, profile, domain or state, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["subscriber_id?", "profile_id?", "domain_name?", "state?", "method?", "limit?", "offset?"]
    output: DomainAuthorization[]
    side_effects: []
  - method: GET
    path: "/ca/domain-authorizations/{id}"
    description: "Read one domain authorization including challenge_token, attempt_count, reuse_count and the reuse window"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: DomainAuthorization
    side_effects: []
  - method: POST
    path: "/ca/domain-authorizations/{id}/validate"
    description: "Submit a challenge response. A matching token moves the authorization to VALIDATED and opens the reuse window; a non-matching token consumes one of three attempts and ends in EXHAUSTED on the third failure. Both outcomes return 200 with the updated authorization."
    roles: [VALIDATION_OFFICER]
    code: 200
    input: [challenge_token]
    output: DomainAuthorization
    side_effects: ["increments attempt_count", "on success sets validated_at and expires_at = validated_at + profile.dcv_reuse_days days", "increments DomainAuthorization.version"]
  - method: POST
    path: "/ca/domain-authorizations/{id}/invalidate"
    description: "Withdraw a VALIDATED authorization back to PENDING with a fresh challenge_token; every request that had consumed it falls back to SUBMITTED and releases its reuse count"
    roles: [VALIDATION_OFFICER]
    code: 200
    input: [reason]
    output: DomainAuthorization
    side_effects: ["resets attempt_count, validated_at and expires_at, mints a new challenge_token and increments invalidation_count", "rolls every READY_TO_ISSUE or ISSUANCE_BLOCKED consumer request back to SUBMITTED in created_at ASC order", "decrements reuse_count on every authorization released by those requests", "increments DomainAuthorization.version"]
  - method: POST
    path: "/ca/certificate-requests"
    description: "Create a certificate request in state DRAFT against an ACTIVE profile for an ACTIVE subscriber; expedited defaults to false"
    roles: [VALIDATION_OFFICER]
    code: 201
    input: [subscriber_id, profile_id, requested_domains, requested_validity_days, csr_key_bits, "expedited?"]
    output: CertificateRequest
    side_effects: ["initialises return_count to 0 and consumed_authorization_ids to []"]
  - method: GET
    path: "/ca/certificate-requests"
    description: "List certificate requests filtered by owner, profile, issued certificate or state, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["subscriber_id?", "profile_id?", "issued_certificate_id?", "state?", "blocked_reason?", "limit?", "offset?"]
    output: CertificateRequest[]
    side_effects: []
  - method: GET
    path: "/ca/certificate-requests/{id}"
    description: "Read one certificate request including consumed_authorization_ids, the projected validity window and the projected charge"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: CertificateRequest
    side_effects: []
  - method: POST
    path: "/ca/certificate-requests/{id}/submit"
    description: "Move the request DRAFT -> SUBMITTED for validation work"
    roles: [VALIDATION_OFFICER]
    code: 200
    input: []
    output: CertificateRequest
    side_effects: ["sets submitted_at", "increments version"]
  - method: POST
    path: "/ca/certificate-requests/{id}/return"
    description: "Return a SUBMITTED request to the subscriber for correction. The first two returns move it back to DRAFT; the third return is terminal and rejects the request."
    roles: [VALIDATION_OFFICER]
    code: 200
    input: [return_reason]
    output: CertificateRequest
    side_effects: ["increments return_count", "on the third return sets rejected_reason from return_reason and moves the request to REJECTED", "increments version"]
  - method: POST
    path: "/ca/certificate-requests/{id}/reject"
    description: "Reject the request outright; a DRAFT request becomes WITHDRAWN and a SUBMITTED request becomes REJECTED"
    roles: [VALIDATION_OFFICER]
    code: 200
    input: [rejected_reason]
    output: CertificateRequest
    side_effects: ["sets rejected_reason", "increments version"]
  - method: POST
    path: "/ca/certificate-requests/{id}/clear-validation"
    description: "Clear domain and organizational validation for a SUBMITTED request: selects one VALIDATED authorization per requested domain per domain_authorization_selection, enforces the vetting gates and the CSR key-strength gate, then computes the PROJECTED_AT_CLEARANCE validity window and the projected charge"
    roles: [VALIDATION_OFFICER]
    code: 200
    input: []
    output: CertificateRequest
    side_effects: ["sets validation_cleared_by_user_id and validation_cleared_at", "writes consumed_authorization_ids in requested_domains order", "increments reuse_count on every selected authorization", "writes projected_not_before, projected_not_after and projected_charge_cents", "increments version"]
  - method: POST
    path: "/ca/certificate-requests/{id}/issue"
    description: "Issue the certificate from a READY_TO_ISSUE request under an ATTESTED key ceremony on an OPERATIONAL partition, by an operator other than the one who cleared validation; computes the FINAL_AT_ISSUANCE validity window and debits the subscriber"
    roles: [ISSUANCE_OPERATOR]
    code: 201
    input: [ceremony_id, "supersedes_certificate_id?"]
    output: Certificate
    side_effects: ["creates the Certificate in lifecycle_status PREISSUANCE / revocation_status NONE with a fresh monotonic serial_number", "writes not_before, not_after, validity_days_final, dcv_methods_used and charged_amount_cents", "sets CertificateRequest.issued_certificate_id and moves the request to ISSUED", "increments Subscriber.issued_certificate_count and outstanding_balance_cents", "increments KeyCeremony.issued_certificate_count", "increments CertificateRequest.version and Subscriber.version"]
  - method: GET
    path: "/ca/certificates"
    description: "List certificates filtered by owner, profile, originating request, ceremony, superseded predecessor or either status dimension, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["subscriber_id?", "profile_id?", "request_id?", "ceremony_id?", "supersedes_certificate_id?", "lifecycle_status?", "revocation_status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: GET
    path: "/ca/certificates/{id}"
    description: "Read one certificate including both status dimensions, the final validity window, sct_count and the CRL stamp"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: POST
    path: "/ca/certificates/{id}/ct-submissions"
    description: "Record a certificate transparency log submission. An ACCEPTED submission from a log operator not yet represented raises sct_count by one; a repeat ACCEPTED submission from the same operator and any REJECTED submission leave sct_count unchanged."
    roles: [ISSUANCE_OPERATOR]
    code: 201
    input: [log_operator, outcome, "rejection_reason?"]
    output: CtLogSubmission
    side_effects: ["sets counted_toward_sct", "recomputes Certificate.sct_count as the number of distinct ACCEPTED log operators", "increments Certificate.version"]
  - method: GET
    path: "/ca/certificates/{id}/ct-submissions"
    description: "List the certificate's CT log submissions in ascending created_at order"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: CtLogSubmission[]
    side_effects: []
  - method: POST
    path: "/ca/certificates/{id}/activate"
    description: "Move the certificate PREISSUANCE -> ISSUED once enough distinct CT logs have accepted it and its not_after is still in the future"
    roles: [ISSUANCE_OPERATOR]
    code: 200
    input: []
    output: Certificate
    side_effects: ["sets activated_at", "increments Certificate.version"]
  - method: POST
    path: "/ca/hsm-partitions"
    description: "Register an HSM partition in state OPERATIONAL"
    roles: [POLICY_ADMIN]
    code: 201
    input: [label, serial]
    output: HsmPartition
    side_effects: ["initialises attested_ceremony_count to 0"]
  - method: GET
    path: "/ca/hsm-partitions"
    description: "List HSM partitions, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: HsmPartition[]
    side_effects: []
  - method: GET
    path: "/ca/hsm-partitions/{id}"
    description: "Read one HSM partition including attested_ceremony_count"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: HsmPartition
    side_effects: []
  - method: POST
    path: "/ca/hsm-partitions/{id}/key-ceremonies"
    description: "Schedule a key ceremony window on an OPERATIONAL partition; the window must clear every SCHEDULED, WITNESSED or ATTESTED ceremony on the same partition by at least 60 minutes"
    roles: [ISSUANCE_OPERATOR]
    code: 201
    input: [window_start, window_end, attestation_valid_days]
    output: KeyCeremony
    side_effects: ["initialises state SCHEDULED, witness_user_ids [], witness_count 0 and issued_certificate_count 0"]
  - method: GET
    path: "/ca/hsm-partitions/{id}/key-ceremonies"
    description: "List the partition's key ceremonies in ascending window_start order"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: KeyCeremony[]
    side_effects: []
  - method: GET
    path: "/ca/key-ceremonies/{id}"
    description: "Read one key ceremony including its witnesses and attestation window"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: KeyCeremony
    side_effects: []
  - method: POST
    path: "/ca/key-ceremonies/{id}/witness"
    description: "Record the acting user as a ceremony witness. The first witness leaves the ceremony SCHEDULED; the second, distinct witness moves it to WITNESSED."
    roles: [ISSUANCE_OPERATOR, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: KeyCeremony
    side_effects: ["appends X-User-ID to witness_user_ids and updates witness_count", "increments KeyCeremony.version"]
  - method: POST
    path: "/ca/key-ceremonies/{id}/attest"
    description: "Attest a WITNESSED ceremony after its window has closed, by an auditor who did not witness it; opens the attestation validity window used as an issuance cap"
    roles: [COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: KeyCeremony
    side_effects: ["sets attested_at, attested_by_user_id and attestation_expires_at = attested_at + attestation_valid_days days", "increments HsmPartition.attested_ceremony_count and HsmPartition.version", "increments KeyCeremony.version"]
  - method: POST
    path: "/ca/key-ceremonies/{id}/revoke-attestation"
    description: "Repudiate a ceremony's attestation. Four-hop cascade: the ceremony loses its attestation, its partition is quarantined, every certificate keyed on that partition enters REVOCATION_PENDING with a SYSTEM_CASCADE KEY_COMPROMISE revocation request, and every affected subscriber reaching two pending revocations is suspended."
    roles: [COMPLIANCE_AUDITOR]
    code: 200
    input: [reason]
    output: KeyCeremony
    side_effects: ["sets attestation_revoked_at and decrements HsmPartition.attested_ceremony_count", "moves the HsmPartition OPERATIONAL -> QUARANTINED", "moves every NONE certificate of that partition to REVOCATION_PENDING in Certificate.created_at ASC order and raises one SYSTEM_CASCADE RevocationRequest each", "suspends every subscriber whose revocation_pending_count reaches 2", "increments KeyCeremony.version, HsmPartition.version and every touched Certificate.version and Subscriber.version"]
  - method: POST
    path: "/ca/key-ceremonies/{id}/abort"
    description: "Abort a SCHEDULED or WITNESSED ceremony, freeing its window for a new ceremony on the same partition"
    roles: [ISSUANCE_OPERATOR]
    code: 200
    input: [reason]
    output: KeyCeremony
    side_effects: ["increments KeyCeremony.version"]
  - method: POST
    path: "/ca/revocation-requests"
    description: "Raise a revocation request against a certificate under optimistic concurrency on the certificate's version. Computes deadline_at per revocation_deadline, moves the certificate to REVOCATION_PENDING and supersedes any older REQUESTED request for the same certificate."
    roles: [REVOCATION_OFFICER]
    code: 201
    input: [certificate_id, reason_code, expected_certificate_version, "incident_id?", "evidence_ref?"]
    output: RevocationRequest
    side_effects: ["sets origin to SUBSCRIBER when incident_id is absent and COMPLIANCE when it is present, plus requested_by_user_id, requested_at and deadline_at", "moves Certificate.revocation_status NONE -> REVOCATION_PENDING and increments Subscriber.revocation_pending_count", "suspends the subscriber when revocation_pending_count reaches 2", "moves every older REQUESTED request for the same certificate to SUPERSEDED", "increments Certificate.version and Subscriber.version"]
  - method: GET
    path: "/ca/revocation-requests"
    description: "List revocation requests filtered by certificate, incident, state or origin, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["certificate_id?", "incident_id?", "state?", "origin?", "reason_code?", "limit?", "offset?"]
    output: RevocationRequest[]
    side_effects: []
  - method: GET
    path: "/ca/revocation-requests/{id}"
    description: "Read one revocation request including deadline_at and deadline_breached"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: RevocationRequest
    side_effects: []
  - method: POST
    path: "/ca/revocation-requests/{id}/execute"
    description: "Execute a REQUESTED revocation: the certificate becomes REVOKED, the profile's CRL queue grows and may push the profile's status service posture to CRL_OVERDUE, which blocks issuance on that profile"
    roles: [REVOCATION_OFFICER]
    code: 200
    input: []
    output: RevocationRequest
    side_effects: ["sets executed_at and deadline_breached", "moves Certificate.revocation_status REVOCATION_PENDING -> REVOKED and copies reason_code onto revocation_reason_code", "decrements Subscriber.revocation_pending_count and un-suspends the subscriber below 2", "increments CertificateProfile.revoked_certificate_count and pending_crl_entry_count", "moves status_service_posture NOMINAL -> CRL_OVERDUE at the trigger threshold and blocks every READY_TO_ISSUE request of that profile", "refunds a PREISSUANCE certificate revoked as SUPERSEDED", "increments RevocationRequest.version, Certificate.version, CertificateProfile.version and Subscriber.version"]
  - method: POST
    path: "/ca/revocation-requests/{id}/deny"
    description: "Deny an operator-raised revocation request; the certificate returns to revocation_status NONE when no other request remains open for it. Cascade-raised requests may never be denied."
    roles: [REVOCATION_OFFICER]
    code: 200
    input: [denial_reason]
    output: RevocationRequest
    side_effects: ["sets denied_at and denial_reason", "moves Certificate.revocation_status REVOCATION_PENDING -> NONE when no other REQUESTED request remains", "decrements Subscriber.revocation_pending_count and un-suspends the subscriber below 2", "increments RevocationRequest.version, Certificate.version and Subscriber.version"]
  - method: POST
    path: "/ca/misissuance-incidents"
    description: "Open a misissuance incident in state OPEN with discovered_at at the logical clock and disclosure_due_at 24 hours later; the scope is a profile, a half-open not_before window and optionally one DCV method and one attributed subscriber"
    roles: [COMPLIANCE_AUDITOR]
    code: 201
    input: [title, category, scope_profile_id, scope_issued_from, scope_issued_to, "subscriber_id?", "scope_dcv_method?"]
    output: MisissuanceIncident
    side_effects: ["sets discovered_at and disclosure_due_at", "initialises revoked_certificate_count, remaining_scope_count and penalty_total_cents to 0", "recomputes Subscriber.risk_score_operational for the attributed subscriber"]
  - method: GET
    path: "/ca/misissuance-incidents"
    description: "List misissuance incidents filtered by attributed subscriber, scoped profile, state or category, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["subscriber_id?", "scope_profile_id?", "state?", "category?", "disclosure_breached?", "limit?", "offset?"]
    output: MisissuanceIncident[]
    side_effects: []
  - method: GET
    path: "/ca/misissuance-incidents/{id}"
    description: "Read one incident including the disclosure deadline, the breach flag, the revocation counters and the accumulated penalty"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: MisissuanceIncident
    side_effects: []
  - method: POST
    path: "/ca/misissuance-incidents/{id}/disclose"
    description: "Disclose an OPEN incident to a root program; records an INCIDENT_DISCLOSURE communication whose within_deadline reflects the disclosure deadline"
    roles: [COMPLIANCE_AUDITOR]
    code: 200
    input: [root_program, body]
    output: MisissuanceIncident
    side_effects: ["sets disclosed_at", "creates a RootProgramCommunication with kind INCIDENT_DISCLOSURE and within_deadline = (disclosed_at <= disclosure_due_at)", "recomputes Subscriber.risk_score_operational for the attributed subscriber", "increments MisissuanceIncident.version"]
  - method: POST
    path: "/ca/misissuance-incidents/{id}/communications"
    description: "Send a BREACH_ESCALATION communication for an incident whose disclosure deadline was missed; this is the prerequisite that unblocks mass revocation on a breached incident"
    roles: [COMPLIANCE_AUDITOR]
    code: 201
    input: [root_program, body]
    output: RootProgramCommunication
    side_effects: ["records kind BREACH_ESCALATION with incident_id set, audit_id null and within_deadline false"]
  - method: GET
    path: "/ca/misissuance-incidents/{id}/communications"
    description: "List the incident's root program communications in ascending sent_at order"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: RootProgramCommunication[]
    side_effects: []
  - method: POST
    path: "/ca/misissuance-incidents/{id}/mass-revoke"
    description: "Revoke up to 50 in-scope certificates in the pinned selection order, accumulate the per-certificate remediation penalty, and advance the incident toward REMEDIATED as the pool drains. A KEY_COMPROMISE batch terminates the attributed subscriber."
    roles: [REVOCATION_OFFICER]
    code: 200
    input: []
    output: MisissuanceIncident
    side_effects: ["revokes each selected certificate NONE -> REVOKED with an EXECUTED MASS_REVOCATION RevocationRequest", "increments CertificateProfile.revoked_certificate_count and pending_crl_entry_count per certificate and may push the profile to CRL_OVERDUE", "adds the batch's incident_remediation_penalty to penalty_total_cents", "updates revoked_certificate_count and remaining_scope_count", "terminates the attributed subscriber on a KEY_COMPROMISE batch", "increments MisissuanceIncident.version, CertificateProfile.version and every touched Certificate.version"]
  - method: POST
    path: "/ca/misissuance-incidents/{id}/close"
    description: "Close a disclosed or remediated incident once its scope is empty and every linked revocation request has been executed or denied; the attributed subscriber's operational risk score drops as the incident leaves the input set"
    roles: [COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: MisissuanceIncident
    side_effects: ["sets closed_at", "recomputes Subscriber.risk_score_operational", "increments MisissuanceIncident.version and Subscriber.version"]
  - method: POST
    path: "/ca/root-program-audits"
    description: "Schedule an annual audit against one browser root program for a closed period of at most 366 days"
    roles: [COMPLIANCE_AUDITOR]
    code: 201
    input: [root_program, period_start, period_end]
    output: RootProgramAudit
    side_effects: ["initialises state SCHEDULED and every finding counter to 0"]
  - method: GET
    path: "/ca/root-program-audits"
    description: "List root program audits, newest first by created_at"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["root_program?", "state?", "limit?", "offset?"]
    output: RootProgramAudit[]
    side_effects: []
  - method: GET
    path: "/ca/root-program-audits/{id}"
    description: "Read one audit including its finding counters and the assessed population size"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: RootProgramAudit
    side_effects: []
  - method: POST
    path: "/ca/root-program-audits/{id}/findings"
    description: "Record an audit finding; the first finding moves the audit SCHEDULED -> FIELDWORK and CRITICAL findings drive the opinion outcome. Body enum: severity is one of MINOR | MAJOR | CRITICAL"
    roles: [COMPLIANCE_AUDITOR]
    code: 200
    input: [severity, summary]
    output: RootProgramAudit
    side_effects: ["increments finding_count and, for CRITICAL, critical_finding_count", "increments RootProgramAudit.version"]
  - method: POST
    path: "/ca/root-program-audits/{id}/opine"
    description: "Issue the audit opinion. QUALIFIED when at least one CRITICAL finding or at least three findings exist, otherwise UNQUALIFIED. Writes every in-period subscriber's AUDIT_FINAL risk score, retires every ACTIVE EV profile on a QUALIFIED opinion, and files the corresponding root program notice."
    roles: [COMPLIANCE_AUDITOR]
    code: 200
    input: []
    output: RootProgramAudit
    side_effects: ["sets opinion_at and opined_by_user_id", "writes Subscriber.risk_score_audit_final for every subscriber with an incident discovered inside the period and sets assessed_subscriber_count", "on QUALIFIED retires every ACTIVE EV CertificateProfile and sets retired_profile_count", "creates one RootProgramCommunication with kind AUDIT_QUALIFIED_NOTICE or AUDIT_CLEAN_NOTICE", "increments RootProgramAudit.version, every retired CertificateProfile.version and every assessed Subscriber.version"]
  - method: POST
    path: "/ca/root-program-audits/{id}/communications"
    description: "File a follow-up ROOT_PROGRAM_RESPONSE for an audit that already carries an opinion; within_deadline is true only when it is filed within 14 days of opinion_at"
    roles: [COMPLIANCE_AUDITOR]
    code: 201
    input: [root_program, body]
    output: RootProgramCommunication
    side_effects: ["records kind ROOT_PROGRAM_RESPONSE with audit_id set, incident_id null and within_deadline = (sent_at <= opinion_at + 14 days)"]
  - method: GET
    path: "/ca/root-program-audits/{id}/communications"
    description: "List the audit's root program communications in ascending sent_at order"
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: RootProgramCommunication[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock starts at the fixed default 2026-08-01T00:00:00Z and never falls back to wall-clock time; it may only move forward. Advancing it runs three sweeps in this exact order: (1) every VALIDATED DomainAuthorization with expires_at <= the new clock becomes EXPIRED, (2) every PREISSUANCE or ISSUED Certificate with not_after <= the new clock becomes EXPIRED, (3) every OPEN MisissuanceIncident whose disclosure_due_at is strictly before the new clock gets disclosure_breached = true."
    roles: [POLICY_ADMIN, VALIDATION_OFFICER, VETTING_APPROVER, ISSUANCE_OPERATOR, REVOCATION_OFFICER, COMPLIANCE_AUDITOR]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sweep 1 expires reusable domain authorizations", "sweep 2 expires certificates", "sweep 3 flags missed incident disclosure deadlines", "increments the version of every entity a sweep touched"]

# §1.6 Error catalog. Every entry is triggerable by the endpoints listed in the
# matching §1.4 rule; the http status and the priority ordering are normative.
errors:
  - id: ERR_MISSING_USER_HEADER
    http: 401
    condition: "violated when NOT (X-User-ID header is present and non-empty); raised by: all endpoints except GET endpoints"
  - id: ERR_MISSING_ROLE_HEADER
    http: 401
    condition: "violated when NOT (X-User-Role header is present and non-empty); raised by: all endpoints"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "violated when NOT (X-User-Role is one of the six roles declared in §1.7); raised by: all endpoints"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "violated when NOT (the role in X-User-Role appears in the endpoint's roles list); raised by: all endpoints"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "violated when NOT (every required input field of the endpoint is present and of the declared JSON type); raised by: all POST and PATCH endpoints"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "violated when NOT (every enum-typed input field holds one of the values declared in §1.1); raised by: all POST and PATCH endpoints with enum inputs"
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "violated when NOT (integer inputs are within their declared range: max_validity_days 1..398, dcv_reuse_days 1..398, max_dcv_reuse_count 1..50, org_vetting_reuse_days 0..825 and at least 1 when validation_type is OV or EV, required_sct_count 0..5, base_fee_cents 1..10000000, crl_trigger_threshold 1..1000, max_crl_validity_hours 1..240, credit_limit_cents 0..100000000, requested_validity_days 1..398, csr_key_bits in {2048, 3072, 4096}, attestation_valid_days 1..365); raised by: POST /ca/certificate-profiles, POST /ca/subscribers, POST /ca/certificate-requests, POST /ca/hsm-partitions/{id}/key-ceremonies"
  - id: ERR_INVALID_ARRAY_CONTENT
    http: 422
    condition: "violated when NOT (requested_domains holds between 1 and 10 entries with no duplicate (case-insensitive) domain name, and allowed_dcv_methods holds between 1 and 4 distinct methods); raised by: POST /ca/certificate-requests, POST /ca/certificate-profiles"
  - id: ERR_PROFILE_NOT_FOUND
    http: 404
    condition: "violated when NOT (the CertificateProfile named by {id} or by profile_id exists); raised by: all endpoints carrying {id} or a profile_id / scope_profile_id body field"
  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "violated when NOT (the Subscriber named by {id} or by subscriber_id exists); raised by: all endpoints carrying {id} or a subscriber_id body field"
  - id: ERR_VETTING_NOT_FOUND
    http: 404
    condition: "violated when NOT (the OrganizationVetting named by {id} exists); raised by: POST /ca/organization-vettings/{id}/checks, POST /ca/organization-vettings/{id}/approve, GET /ca/organization-vettings/{id}"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "violated when NOT (the DomainAuthorization named by {id} exists); raised by: all endpoints carrying {id}"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "violated when NOT (the CertificateRequest named by {id} exists); raised by: all endpoints carrying {id}"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "violated when NOT (the Certificate named by {id}, by certificate_id or by supersedes_certificate_id exists); raised by: all endpoints carrying {id}, certificate_id or supersedes_certificate_id"
  - id: ERR_PARTITION_NOT_FOUND
    http: 404
    condition: "violated when NOT (the HsmPartition named by {id} exists); raised by: all endpoints carrying {id}"
  - id: ERR_CEREMONY_NOT_FOUND
    http: 404
    condition: "violated when NOT (the KeyCeremony named by {id} or by ceremony_id exists); raised by: all endpoints carrying {id} or a ceremony_id body field"
  - id: ERR_REVOCATION_REQUEST_NOT_FOUND
    http: 404
    condition: "violated when NOT (the RevocationRequest named by {id} exists); raised by: all endpoints carrying {id}"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "violated when NOT (the MisissuanceIncident named by {id} or by incident_id exists); raised by: all endpoints carrying {id} or an incident_id body field"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "violated when NOT (the RootProgramAudit named by {id} exists); raised by: all endpoints carrying {id}"
  - id: ERR_STALE_CERTIFICATE_VERSION
    http: 412
    condition: "violated when NOT (expected_certificate_version equals the target Certificate's current version); raised by: POST /ca/revocation-requests"
  - id: ERR_STALE_PROFILE_VERSION
    http: 412
    condition: "violated when NOT (expected_profile_version equals the target CertificateProfile's current version); raised by: POST /ca/certificate-profiles/{id}/crl-publications"
  - id: ERR_PROFILE_NOT_DRAFT
    http: 409
    condition: "violated when NOT (the CertificateProfile is in status DRAFT); raised by: POST /ca/certificate-profiles/{id}/activate"
  - id: ERR_PROFILE_NOT_ACTIVE
    http: 409
    condition: "violated when NOT (the CertificateProfile is in status ACTIVE); raised by: POST /ca/domain-authorizations, POST /ca/domain-authorizations/{id}/validate, POST /ca/certificate-requests/{id}/submit, POST /ca/certificate-requests/{id}/clear-validation, POST /ca/certificate-requests/{id}/issue, POST /ca/certificate-profiles/{id}/crl-publications"
  - id: ERR_PROFILE_STATUS_SERVICE_OVERDUE
    http: 409
    condition: "violated when NOT (the CertificateProfile's status_service_posture is NOMINAL); raised by: POST /ca/certificate-requests/{id}/issue"
  - id: ERR_SUBSCRIBER_NOT_ACTIVE
    http: 409
    condition: "violated when NOT (the Subscriber's account_status is ACTIVE); raised by: POST /ca/subscribers/{id}/organization-vettings, POST /ca/domain-authorizations, POST /ca/domain-authorizations/{id}/validate, POST /ca/certificate-requests, POST /ca/certificate-requests/{id}/submit, POST /ca/certificate-requests/{id}/clear-validation, POST /ca/certificate-requests/{id}/issue"
  - id: ERR_VETTING_ALREADY_DECIDED
    http: 409
    condition: "violated when NOT (the OrganizationVetting's vetting_state is PENDING, IN_PROGRESS or AWAITING_APPROVAL); raised by: POST /ca/organization-vettings/{id}/checks"
  - id: ERR_VETTING_NOT_AWAITING_APPROVAL
    http: 409
    condition: "violated when NOT (the OrganizationVetting's vetting_state is AWAITING_APPROVAL); raised by: POST /ca/organization-vettings/{id}/approve"
  - id: ERR_AUTHORIZATION_NOT_VALIDATABLE
    http: 409
    condition: "violated when NOT (the DomainAuthorization's state is PENDING or FAILED); raised by: POST /ca/domain-authorizations/{id}/validate"
  - id: ERR_AUTHORIZATION_NOT_VALIDATED
    http: 409
    condition: "violated when NOT (the DomainAuthorization's state is VALIDATED); raised by: POST /ca/domain-authorizations/{id}/invalidate"
  - id: ERR_REQUEST_NOT_DRAFT
    http: 409
    condition: "violated when NOT (the CertificateRequest's state is DRAFT); raised by: POST /ca/certificate-requests/{id}/submit"
  - id: ERR_REQUEST_NOT_SUBMITTED
    http: 409
    condition: "violated when NOT (the CertificateRequest's state is SUBMITTED); raised by: POST /ca/certificate-requests/{id}/return, POST /ca/certificate-requests/{id}/clear-validation"
  - id: ERR_REQUEST_NOT_REJECTABLE
    http: 409
    condition: "violated when NOT (the CertificateRequest's state is DRAFT or SUBMITTED); raised by: POST /ca/certificate-requests/{id}/reject"
  - id: ERR_REQUEST_NOT_READY
    http: 409
    condition: "violated when NOT (the CertificateRequest's state is READY_TO_ISSUE); raised by: POST /ca/certificate-requests/{id}/issue"
  - id: ERR_CERTIFICATE_NOT_PREISSUANCE
    http: 409
    condition: "violated when NOT (the Certificate's lifecycle_status is PREISSUANCE); raised by: POST /ca/certificates/{id}/activate"
  - id: ERR_CERTIFICATE_NOT_REVOCABLE
    http: 409
    condition: "violated when NOT (the Certificate's lifecycle_status is PREISSUANCE or ISSUED and its revocation_status is NONE); raised by: POST /ca/revocation-requests, POST /ca/certificates/{id}/ct-submissions"
  - id: ERR_REVOCATION_REQUEST_NOT_OPEN
    http: 409
    condition: "violated when NOT (the RevocationRequest's state is REQUESTED); raised by: POST /ca/revocation-requests/{id}/execute, POST /ca/revocation-requests/{id}/deny"
  - id: ERR_PARTITION_QUARANTINED
    http: 409
    condition: "violated when NOT (the HsmPartition's state is OPERATIONAL); raised by: POST /ca/hsm-partitions/{id}/key-ceremonies, POST /ca/key-ceremonies/{id}/attest, POST /ca/certificate-requests/{id}/issue"
  - id: ERR_CEREMONY_NOT_SCHEDULED
    http: 409
    condition: "violated when NOT (the KeyCeremony's state is SCHEDULED); raised by: POST /ca/key-ceremonies/{id}/witness"
  - id: ERR_CEREMONY_NOT_WITNESSED
    http: 409
    condition: "violated when NOT (the KeyCeremony's state is WITNESSED); raised by: POST /ca/key-ceremonies/{id}/attest"
  - id: ERR_CEREMONY_NOT_ATTESTED
    http: 409
    condition: "violated when NOT (the KeyCeremony's state is ATTESTED); raised by: POST /ca/key-ceremonies/{id}/revoke-attestation"
  - id: ERR_CEREMONY_NOT_ABORTABLE
    http: 409
    condition: "violated when NOT (the KeyCeremony's state is SCHEDULED or WITNESSED); raised by: POST /ca/key-ceremonies/{id}/abort"
  - id: ERR_INCIDENT_NOT_OPEN
    http: 409
    condition: "violated when NOT (the MisissuanceIncident's state is OPEN); raised by: POST /ca/misissuance-incidents/{id}/disclose"
  - id: ERR_INCIDENT_NOT_DISCLOSED
    http: 409
    condition: "violated when NOT (the MisissuanceIncident's state is DISCLOSED or MASS_REVOCATION_IN_PROGRESS); raised by: POST /ca/misissuance-incidents/{id}/mass-revoke, POST /ca/misissuance-incidents/{id}/communications"
  - id: ERR_INCIDENT_NOT_CLOSEABLE
    http: 409
    condition: "violated when NOT (the MisissuanceIncident's state is DISCLOSED, MASS_REVOCATION_IN_PROGRESS or REMEDIATED); raised by: POST /ca/misissuance-incidents/{id}/close"
  - id: ERR_AUDIT_NOT_OPEN_FOR_FINDINGS
    http: 409
    condition: "violated when NOT (the RootProgramAudit's state is SCHEDULED or FIELDWORK); raised by: POST /ca/root-program-audits/{id}/findings"
  - id: ERR_AUDIT_NOT_IN_FIELDWORK
    http: 409
    condition: "violated when NOT (the RootProgramAudit has not been opined yet: state is SCHEDULED or FIELDWORK); raised by: POST /ca/root-program-audits/{id}/opine"
  - id: ERR_AUDIT_NOT_OPINED
    http: 409
    condition: "violated when NOT (the RootProgramAudit's state is QUALIFIED or UNQUALIFIED (follow-up correspondence is only sent after an opinion has been issued)); raised by: POST /ca/root-program-audits/{id}/communications"
  - id: ERR_VETTING_SOD_VIOLATION
    http: 409
    condition: "violated when NOT (the approving X-User-ID differs from every non-null registry_checked_by_user_id, callback_checked_by_user_id and authority_checked_by_user_id on the vetting (segregation of duties)); raised by: POST /ca/organization-vettings/{id}/approve"
  - id: ERR_DUPLICATE_WITNESS
    http: 409
    condition: "violated when NOT (the witnessing X-User-ID is not already present in the ceremony's witness_user_ids); raised by: POST /ca/key-ceremonies/{id}/witness"
  - id: ERR_ATTESTER_WAS_WITNESS
    http: 409
    condition: "violated when NOT (the attesting X-User-ID is not present in the ceremony's witness_user_ids (an auditor may not attest a ceremony they witnessed)); raised by: POST /ca/key-ceremonies/{id}/attest"
  - id: ERR_CEREMONY_WINDOW_OPEN
    http: 409
    condition: "violated when NOT (the logical clock is at or after the ceremony's window_end (a ceremony cannot be attested while its window is still open)); raised by: POST /ca/key-ceremonies/{id}/attest"
  - id: ERR_ISSUANCE_SOD_VIOLATION
    http: 409
    condition: "violated when NOT (the issuing X-User-ID differs from the request's validation_cleared_by_user_id (the officer who cleared validation may not issue the certificate)); raised by: POST /ca/certificate-requests/{id}/issue"
  - id: ERR_CEREMONY_NOT_ATTESTED_FOR_ISSUANCE
    http: 409
    condition: "violated when NOT (the KeyCeremony named in the issue body is in state ATTESTED); raised by: POST /ca/certificate-requests/{id}/issue"
  - id: ERR_CEREMONY_ATTESTATION_EXPIRED
    http: 409
    condition: "violated when NOT (the KeyCeremony's attestation_expires_at is strictly after the logical clock); raised by: POST /ca/certificate-requests/{id}/issue"
  - id: ERR_DCV_METHOD_NOT_ALLOWED
    http: 422
    condition: "violated when NOT (the DomainAuthorization's method appears in the profile's allowed_dcv_methods); raised by: POST /ca/domain-authorizations"
  - id: ERR_DOMAIN_AUTHORIZATION_MISSING
    http: 422
    condition: "violated when NOT (for every entry of requested_domains at least one DomainAuthorization exists for the (subscriber_id, profile_id, domain_name) triple in state VALIDATED or EXPIRED; a PENDING, FAILED or EXHAUSTED authorization never satisfies this check); raised by: POST /ca/certificate-requests/{id}/clear-validation"
  - id: ERR_DOMAIN_AUTHORIZATION_EXPIRED
    http: 422
    condition: "violated when NOT (for every entry of requested_domains at least one authorization for the triple is in state VALIDATED with expires_at strictly after the logical clock (half-open reuse window); an authorization already flipped to EXPIRED by sweep 1, or still VALIDATED with expires_at <= the clock, fails this check); raised by: POST /ca/certificate-requests/{id}/clear-validation"
  - id: ERR_DCV_REUSE_LIMIT_EXCEEDED
    http: 422
    condition: "violated when NOT (every selected authorization has reuse_count strictly below profile.max_dcv_reuse_count); raised by: POST /ca/certificate-requests/{id}/clear-validation"
  - id: ERR_ORG_VETTING_REQUIRED
    http: 422
    condition: "violated when NOT (when profile.required_vetting_level is not NONE, the subscriber holds an OrganizationVetting in vetting_state APPROVED); raised by: POST /ca/certificate-requests/{id}/clear-validation"
  - id: ERR_ORG_VETTING_LEVEL_INSUFFICIENT
    http: 422
    condition: "violated when NOT (the APPROVED vetting's required_level covers the profile's required_vetting_level under the ordering NONE < OV < EV (an OV vetting never satisfies an EV profile)); raised by: POST /ca/certificate-requests/{id}/clear-validation"
  - id: ERR_ORG_VETTING_REUSE_EXPIRED
    http: 422
    condition: "violated when NOT (the APPROVED vetting's approved_at is strictly after (logical clock - profile.org_vetting_reuse_days days)); raised by: POST /ca/certificate-requests/{id}/clear-validation"
  - id: ERR_CSR_KEY_TOO_WEAK
    http: 422
    condition: "violated when NOT (csr_key_bits meets the profile's validation-type minimum: DV and OV require at least 2048, EV requires at least 3072); raised by: POST /ca/certificate-requests/{id}/clear-validation"
  - id: ERR_INCIDENT_DISCLOSURE_BREACHED
    http: 409
    condition: "violated when NOT (when the incident's disclosure_breached is true, a RootProgramCommunication with kind BREACH_ESCALATION must already exist for the incident before any mass revocation may run); raised by: POST /ca/misissuance-incidents/{id}/mass-revoke"
  - id: ERR_CASCADE_REVOCATION_NOT_DENIABLE
    http: 409
    condition: "violated when NOT (the RevocationRequest's origin is not SYSTEM_CASCADE (a cascade-raised revocation may not be denied)); raised by: POST /ca/revocation-requests/{id}/deny"
  - id: ERR_CERTIFICATE_EXPIRED_NOT_REVOCABLE
    http: 409
    condition: "violated when NOT (the target Certificate's lifecycle_status is not EXPIRED (an expired certificate is never added to a CRL; its open revocation request must be denied instead)); raised by: POST /ca/revocation-requests/{id}/execute"
  - id: ERR_PROFILE_NAME_DUPLICATE
    http: 409
    condition: "violated when NOT (CertificateProfile.name is unique across all profiles after case-folding (case-insensitive)); raised by: POST /ca/certificate-profiles"
  - id: ERR_SUBSCRIBER_REGISTRY_DUPLICATE
    http: 409
    condition: "violated when NOT (the (jurisdiction_code, registry_id) pair is unique across all subscribers); raised by: POST /ca/subscribers"
  - id: ERR_PARTITION_SERIAL_DUPLICATE
    http: 409
    condition: "violated when NOT (HsmPartition.serial is unique across all partitions); raised by: POST /ca/hsm-partitions"
  - id: ERR_VETTING_ALREADY_OPEN
    http: 409
    condition: "violated when NOT (the subscriber has no OrganizationVetting in vetting_state PENDING, IN_PROGRESS or AWAITING_APPROVAL); raised by: POST /ca/subscribers/{id}/organization-vettings"
  - id: ERR_AUTHORIZATION_ALREADY_OPEN
    http: 409
    condition: "violated when NOT (no DomainAuthorization in state PENDING or VALIDATED already exists for the same (subscriber_id, profile_id, domain_name) triple); raised by: POST /ca/domain-authorizations"
  - id: ERR_INVALID_CEREMONY_WINDOW
    http: 422
    condition: "violated when NOT (window_end is strictly after window_start); raised by: POST /ca/hsm-partitions/{id}/key-ceremonies"
  - id: ERR_CEREMONY_WINDOW_CONFLICT
    http: 409
    condition: "violated when NOT (the requested ceremony window keeps at least CEREMONY_BUFFER_MINUTES (60) minutes of clearance from every SCHEDULED, WITNESSED or ATTESTED ceremony on the same partition, per the ceremony_window_occupation rule (closed intervals: a gap of exactly 60 minutes still conflicts)); raised by: POST /ca/hsm-partitions/{id}/key-ceremonies"
  - id: ERR_INVALID_CRL_WINDOW
    http: 422
    condition: "violated when NOT (next_update is strictly after this_update); raised by: POST /ca/certificate-profiles/{id}/crl-publications"
  - id: ERR_CRL_COVERAGE_GAP
    http: 409
    condition: "violated when NOT (when the profile already has a published CRL, this_update is at or before (last_crl_next_update - CRL_MIN_OVERLAP_MINUTES (30) minutes), so consecutive CRLs overlap by at least 30 minutes and status service never has a coverage gap); raised by: POST /ca/certificate-profiles/{id}/crl-publications"
  - id: ERR_CRL_WINDOW_NOT_ADVANCING
    http: 409
    condition: "violated when NOT (when the profile already has a published CRL, next_update is strictly after last_crl_next_update, so the series advances instead of nesting inside the previous window); raised by: POST /ca/certificate-profiles/{id}/crl-publications"
  - id: ERR_CRL_VALIDITY_TOO_LONG
    http: 422
    condition: "violated when NOT (next_update - this_update is at most profile.max_crl_validity_hours hours); raised by: POST /ca/certificate-profiles/{id}/crl-publications"
  - id: ERR_INVALID_SCOPE_WINDOW
    http: 422
    condition: "violated when NOT (scope_issued_to is strictly after scope_issued_from); raised by: POST /ca/misissuance-incidents"
  - id: ERR_INVALID_AUDIT_PERIOD
    http: 422
    condition: "violated when NOT (period_end is strictly after period_start and the period is at most 366 days long); raised by: POST /ca/root-program-audits"
  - id: ERR_AUDIT_ALREADY_OPEN
    http: 409
    condition: "violated when NOT (no RootProgramAudit in state SCHEDULED or FIELDWORK already exists for the same root_program); raised by: POST /ca/root-program-audits"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "violated when NOT (the submitted current_utc is at or after the server's current logical clock (the clock never moves backwards)); raised by: POST /_clock/set_current_utc"
  - id: ERR_SUPERSEDES_SUBSCRIBER_MISMATCH
    http: 422
    condition: "violated when NOT (the certificate named by supersedes_certificate_id belongs to the same subscriber_id as the issuing request); raised by: POST /ca/certificate-requests/{id}/issue"
  - id: ERR_SCOPE_METHOD_NOT_IN_PROFILE
    http: 422
    condition: "violated when NOT (scope_dcv_method, when present, appears in the scoped profile's allowed_dcv_methods); raised by: POST /ca/misissuance-incidents"
  - id: ERR_INCIDENT_CERTIFICATE_MISMATCH
    http: 422
    condition: "violated when NOT (when incident_id is present on a revocation request, the target certificate's profile_id equals the incident's scope_profile_id); raised by: POST /ca/revocation-requests"
  - id: ERR_REJECTION_REASON_MISMATCH
    http: 422
    condition: "violated when NOT (the CtLogSubmission's rejection_reason is present exactly when outcome is REJECTED); raised by: POST /ca/certificates/{id}/ct-submissions"
  - id: ERR_NO_CERTIFICATES_IN_SCOPE
    http: 422
    condition: "violated when NOT (the candidate pool selected by mass_revocation_scope_selection is non-empty); raised by: POST /ca/misissuance-incidents/{id}/mass-revoke"
  - id: ERR_INSUFFICIENT_SCTS
    http: 409
    condition: "violated when NOT (the certificate's sct_count (distinct ACCEPTED log operators) is at least profile.required_sct_count); raised by: POST /ca/certificates/{id}/activate"
  - id: ERR_CERTIFICATE_ALREADY_EXPIRED
    http: 409
    condition: "violated when NOT (the certificate's not_after is strictly after the logical clock); raised by: POST /ca/certificates/{id}/activate"
  - id: ERR_INCIDENT_REVOCATIONS_OUTSTANDING
    http: 409
    condition: "violated when NOT (the incident's remaining_scope_count is 0 and every RevocationRequest carrying this incident_id is in state EXECUTED or DENIED); raised by: POST /ca/misissuance-incidents/{id}/close"
  - id: ERR_AUDIT_NO_FINDINGS
    http: 422
    condition: "violated when NOT (the audit's finding_count is at least 1); raised by: POST /ca/root-program-audits/{id}/opine"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "violated when NOT (Subscriber.outstanding_balance_cents plus the issuance_charge_settlement total is at most Subscriber.credit_limit_cents); raised by: POST /ca/certificate-requests/{id}/issue"

# §1.7 RBAC. role_model is segregation_of_duties: three separate duty pairs must be
# performed by DIFFERENT X-User-ID values even when the same person could hold both
# roles -- (1) vetting checks vs vetting approval, (2) validation clearance vs
# certificate issuance, (3) ceremony witnessing vs ceremony attestation.
roles:
  - name: POLICY_ADMIN
    description: "Owns the CA's policy objects: certificate profiles, subscriber accounts and HSM partition inventory. Never touches an individual issuance, revocation or audit."
    identity: opaque
    exclusive_operations:
      - "POST /ca/certificate-profiles"
      - "POST /ca/certificate-profiles/{id}/activate"
      - "POST /ca/subscribers"
      - "PATCH /ca/subscribers/{id}"
      - "POST /ca/hsm-partitions"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
  - name: VALIDATION_OFFICER
    description: "Performs domain control validation and the three organizational vetting checks, and drives a certificate request from creation through validation clearance. May never approve the vetting file it checked nor issue the certificate it cleared."
    identity: opaque
    exclusive_operations:
      - "POST /ca/subscribers/{id}/organization-vettings"
      - "POST /ca/organization-vettings/{id}/checks"
      - "POST /ca/domain-authorizations"
      - "POST /ca/domain-authorizations/{id}/validate"
      - "POST /ca/domain-authorizations/{id}/invalidate"
      - "POST /ca/certificate-requests"
      - "POST /ca/certificate-requests/{id}/submit"
      - "POST /ca/certificate-requests/{id}/return"
      - "POST /ca/certificate-requests/{id}/reject"
      - "POST /ca/certificate-requests/{id}/clear-validation"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
  - name: VETTING_APPROVER
    description: "Sole approver of organizational vetting files. Holds no other write capability, which makes the vetting segregation-of-duties rule enforceable by user id rather than by role."
    identity: opaque
    exclusive_operations:
      - "POST /ca/organization-vettings/{id}/approve"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
  - name: ISSUANCE_OPERATOR
    description: "Runs the issuance systems: schedules and aborts key ceremony windows, issues certificates under an attested ceremony, submits to CT logs and activates certificates."
    identity: opaque
    exclusive_operations:
      - "POST /ca/hsm-partitions/{id}/key-ceremonies"
      - "POST /ca/key-ceremonies/{id}/abort"
      - "POST /ca/certificate-requests/{id}/issue"
      - "POST /ca/certificates/{id}/ct-submissions"
      - "POST /ca/certificates/{id}/activate"
    shared_operations:
      - "POST /ca/key-ceremonies/{id}/witness"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
  - name: REVOCATION_OFFICER
    description: "Owns revocation and the status services: raises, executes and denies revocation requests, publishes CRLs and runs mass revocation batches for disclosed incidents."
    identity: opaque
    exclusive_operations:
      - "POST /ca/revocation-requests"
      - "POST /ca/revocation-requests/{id}/execute"
      - "POST /ca/revocation-requests/{id}/deny"
      - "POST /ca/certificate-profiles/{id}/crl-publications"
      - "POST /ca/misissuance-incidents/{id}/mass-revoke"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
  - name: COMPLIANCE_AUDITOR
    description: "Attests key ceremonies (and repudiates attestations), manages misissuance incidents and root program correspondence, and runs the annual root program audit. May not attest a ceremony it witnessed."
    identity: opaque
    exclusive_operations:
      - "POST /ca/key-ceremonies/{id}/attest"
      - "POST /ca/key-ceremonies/{id}/revoke-attestation"
      - "POST /ca/misissuance-incidents"
      - "POST /ca/misissuance-incidents/{id}/disclose"
      - "POST /ca/misissuance-incidents/{id}/communications"
      - "POST /ca/misissuance-incidents/{id}/close"
      - "POST /ca/root-program-audits"
      - "POST /ca/root-program-audits/{id}/findings"
      - "POST /ca/root-program-audits/{id}/opine"
      - "POST /ca/root-program-audits/{id}/communications"
    shared_operations:
      - "POST /ca/key-ceremonies/{id}/witness"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
