            - "GET /inventory-integrity/physical-inventories/${pi1} reads recount_threshold_bps 150, net_variance_bps 1000, status still \"FIRST_PASS_COMPLETE\" and recount_round 0, and GET /inventory-integrity/adjustments?posting_state=POSTED returns total_count 0"
