  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: admit_cannot_proceed_while_facility_posture_frozen
        grounds:
          - validations[priority=75]
          - errors[ERR_FACILITY_ADMISSION_FROZEN]
          - state_machines.Admission.PENDING_to_ADMITTED
          - calculations.facility_posture
          - entities.Facility.fields.posture
        distinguishing_aspect: |
          The Admission transition PENDING -> ADMITTED is gated on a field of a different
          entity — Facility.posture — so a fully valid admission with a concurred
          in-window screening is refused with ERR_FACILITY_ADMISSION_FROZEN (403) purely
          because the facility crossed its freeze margin, and the admission stays PENDING.
        test_recipe:
          setup:
            - "Facility with default compliance_threshold_pct 60.00 and review period 2026-08-01..2026-08-31."
            - "Patients A, B and C each hold a PHYSICIAN_CONCURRED screening conducted at 2026-08-03T08:00:00Z, and each has a PENDING admission created before any freeze."
            - "Admissions A and B are admitted 2026-08-04T12:00:00Z and discharged 2026-08-04T18:00:00Z to COMMUNITY with no documentation, so both are NON_QUALIFYING and the facility reaches cohort_total_count 2 with provisional_compliance_pct 0.00 < 60.00 - 20.00 — posture ADMISSION_FREEZE."
            - "Admission C is still PENDING and its screening remains PHYSICIAN_CONCURRED (a terminal state the freeze cascade cannot touch)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
