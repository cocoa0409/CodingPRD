  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: rollover_resets_accrual_and_uncaps
        claim_type: threshold_reset
        grounds: [calculations.agent_cap_split, entities.Agent.fields.cap_year_start]
        distinguishing_aspect: "A commission whose occurred_on crosses the anniversary rolls the cap year (reset to 0.00, UNCAPPED) BEFORE the split: a capped agent's 6000.00 post in the new year splits 1800.00/4200.00 instead of 0.00/6000.00."
        test_recipe:
          setup:
            - "ACTIVE a1 (join 2026-09-01), capped: two 40000.00 posts put accrued at exactly 20000.00"
            - "Logical clock advanced to 2027-09-15"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 40000.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-1", expected_agent_version: "${v1}" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v2: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 40000.00, occurred_on: "2026-09-20T00:00:00Z", external_ref: "ref-2", expected_agent_version: "${v2}" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v3: $.data.version } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 6000.00, occurred_on: "2027-09-15T00:00:00Z", external_ref: "ref-3", expected_agent_version: "${v3}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev3: $.data.id, cd3: $.data.company_dollar, ar3: $.data.agent_retained } }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { cys: $.data.cap_year_start, acc: $.data.accrued_company_dollar, cap: $.data.cap_status } }
          assert:
            - "CommissionEvent.${ev3}.company_dollar == 1800.00 and agent_retained == 4200.00 (rate applies again after rollover)"
            - "Agent.${a1}.cap_year_start == 2027-09-01T00:00:00Z and accrued_company_dollar == 1800.00"
            - "Agent.${a1}.cap_status == UNCAPPED (rollover reverts CAPPED)"

      - name: vesting_variants_diverge_at_1095_day_boundary
        claim_type: variant_divergence
        grounds: [calculations.vesting_ratio, state_machines.VestingSchedule]
        distinguishing_aspect: "Departure exactly 1095 days after join (2023-09-01 -> 2026-08-31) vests with final ratio 1.0000 (inclusive boundary) while the provisional whole-month variant reads 35/36 = 0.9722 — same dates, two variants, different ratios."
        test_recipe:
          setup: ["ACTIVE a1 joined 2023-09-01"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2023-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /agents/${a1}/depart", payload: { departure_date: "2026-08-31T00:00:00Z" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}/vesting-schedule", as: PlatformAdmin, captures: { st: "$.data[0].status", rp: "$.data[0].vested_ratio_provisional", rf: "$.data[0].vested_ratio_final", sd: "$.data[0].service_days_final", sm: "$.data[0].service_months_provisional" } }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v: $.data.vested } }
          assert:
            - "service_days_final == 1095 (2024 is a leap year: 366+365+364 partial-year days) and service_months_provisional == 35"
            - "vested_ratio_final == 1.0000 (1095 >= 1095, inclusive) but vested_ratio_provisional == 0.9722 (35/36)"
            - "VestingSchedule status == VESTED and Agent.${a1}.vested == true"

      - name: departure_forfeits_unvested_projection_distributions
        claim_type: compensation
        grounds: [state_machines.ProfitShareDistribution, state_machines.VestingSchedule, entities.ProfitSharePeriod.fields.distributed_total]
        distinguishing_aspect: "Departing unvested (9 service days) flips the agent's PROJECTION distribution 750.00 to FORFEITED and recomputes the period: distributed_total drops 750.00 -> 0.00 and center_retained_amount rises 30.00 -> 780.00 against the unchanged 780.00 pool."
        test_recipe:
          setup: ["mca sponsors d1; d1 settled 5000.00 (company dollar 1500.00); period 2026-09 PRELIMINARY_CLOSED (provisional_pool 780.00; mca PROJECTION distribution 750.00)"]
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
