          The fee floor is inclusive at zero: fee_amount_cents 0 is accepted and
          produces a working engagement, while -1 is rejected with
          ERR_FEE_AMOUNT_NEGATIVE — a zero-vs-negative boundary on a monetary
          field reached through a different endpoint than the quorum boundary.
        test_recipe:
          setup:
            - "Empty database. One published methodology and one rated entity."
          setup_api_calls:
            - call: "POST /rating-agency/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
