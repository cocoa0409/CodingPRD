# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Employment Background Screening Vendor Management
# Breadth coverage of §1.1–§1.7 claims not already exercised by §1.8.
# Business window = Mon-Fri 09:00-17:00Z; clock default 2026-08-01T00:00:00Z (Sat).
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: vendor_creation_applies_defaults_and_system_fields
        claim_type: creation_defaults_system_fields
        grounds: [entities.ScreeningVendor]
        distinguishing_aspect: "Omitting surcharge_cents yields 0; counters start at 0; accuracy variants at 10000; status ACTIVE; id is a prefix-free UUID; version == 1."
        test_recipe:
          setup: ["empty DB; clock untouched"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-ENT1", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin, captures: { v_id: $.data.id } }
          trigger:
            - { call: "GET /vendors/${v_id}", payload: {}, as: HRAdmin }
          assert:
            - "surcharge_cents == 0 (default applied)"
            - "status == ACTIVE; active_order_count == 0; consecutive_sla_breaches == 0"
            - "accuracy_bps_finalized == 10000 AND accuracy_bps_including_draft == 10000 (empty audit set)"
            - "id matches UUID shape with no type prefix; version == 1; created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: order_create_missing_candidate_id_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ScreeningOrder, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "candidate_id is source: input with no default — omitting it is a 400 ERR_INVALID_REQUEST before any state/business check."
        test_recipe:
          setup: ["nothing needed beyond auth context"]
          setup_api_calls:
            - { call: "POST /candidates", payload: { full_name: "Ent Two", email: "ent2@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin }
          trigger:
            - { call: "POST /screening-orders", payload: { position_id: "00000000-0000-4000-8000-000000000000" }, as: HiringManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400 (missing required candidate_id)"

      - name: package_create_invalid_enum_member_rejected
        claim_type: type_constraints
        grounds: [entities.ScreeningPackage.fields.risk_tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "risk_tier TIER_9 is outside the declared enum — rejected at shape validation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-ENT3", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin }
          trigger:
            - { call: "POST /screening-packages", payload: { name: "P-BAD", risk_tier: TIER_9, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: candidate_email_uniqueness_enforced
        claim_type: type_constraints
        grounds: [entities.Candidate.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Second candidate reusing an existing email is rejected; the constraint is global, not per-jurisdiction."
        test_recipe:
          setup: ["one candidate registered with email dup@x.com"]
          setup_api_calls:
            - { call: "POST /candidates", payload: { full_name: "Dup A", email: "dup@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin }
          trigger:
            - { call: "POST /candidates", payload: { full_name: "Dup B", email: "dup@x.com", home_jurisdiction_code: "US-NY" }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: get_missing_resource_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed UUID that does not exist yields 404 ERR_NOT_FOUND on a single-resource GET."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-ENT5", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin }
          trigger:
            - { call: "GET /vendors/00000000-0000-4000-8000-000000000000", payload: {}, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: position_creation_requires_existing_package
        claim_type: parent_relationships
        grounds: [entities.Position.fields.package_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body-level FK: package_id referencing a missing package is a 404 existence failure (path/body ids validated left-to-right)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /candidates", payload: { full_name: "Ent Six", email: "ent6@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin }
          trigger:
            - { call: "POST /positions", payload: { title: "T", department: "D", risk_tier: TIER_1_STANDARD, package_id: "00000000-0000-4000-8000-000000000000", jurisdiction_code: "US-CA", annual_salary_cents: 100 }, as: HRAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: consent_list_empty_before_capture
        claim_type: retrieval
        grounds: [entities.ConsentRecord, "endpoints.GET /screening-orders/{id}/consents"]
        distinguishing_aspect: "Reverse-reachability sub-resource returns an empty array (not 404) when no consent exists yet."
        test_recipe:
          setup: ["package + jurisdiction + position + candidate + one DRAFT order"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-ENT7", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin }
            - { call: "POST /screening-packages", payload: { name: "P-ENT7", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "T", department: "D", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Ent Seven", email: "ent7@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
          trigger:
            - { call: "GET /screening-orders/${o_id}/consents", payload: {}, as: HRAdmin }
          assert:
            - "response_type == array and data == [] with total_count == 0"

      - name: rescreen_order_self_referential_fk
        claim_type: parent_relationships
        grounds: [entities.ScreeningOrder.fields.rescreen_of_order_id]
        excluded_because:
          difficulty_instance: rescreen_sweep_closed_interval_inclusion
          rationale: "The §1.8 sweep instance asserts RESCREEN orders carry rescreen_of_order_id == original order id (self-referential FK) and reads them back via the filtered list."

      - name: findings_computed_flags_on_subresource
        claim_type: computed_fields
        grounds: [entities.ReportFinding.fields.considerable, entities.ReportFinding.fields.matched_action]
        excluded_because:
          difficulty_instance: adjudication_first_match_rule_ordering
          rationale: "The §1.8 first-match instance asserts considerable and matched_action via GET /screening-reports/{id}/findings."

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: order_created_with_parallel_initial_states
        claim_type: initial_state
        grounds: [state_machines.ScreeningOrder]
        distinguishing_aspect: "New order starts fulfillment_status == DRAFT and adjudication_status == NOT_STARTED simultaneously (parallel dimensions)."
        test_recipe:
          setup: ["package + jurisdiction + position + candidate"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-SM1", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin }
            - { call: "POST /screening-packages", payload: { name: "P-SM1", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "T", department: "D", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Sm One", email: "sm1@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
          assert:
            - "create response: fulfillment_status == DRAFT AND adjudication_status == NOT_STARTED"
            - "order_type == INITIAL; rescreen_of_order_id == null; vendor_id == null; escalation_level == 0"

      - name: dispatch_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScreeningOrder, "errors[ERR_ORDER_NOT_CONSENT_CAPTURED]"]
        distinguishing_aspect: "Skipping consent: dispatch directly from DRAFT is rejected; no vendor capacity is consumed."
        test_recipe:
          setup: ["full config; order DRAFT"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-SM2", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-SM2", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "T", department: "D", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Sm Two", email: "sm2@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_CONSENT_CAPTURED (409)"
            - "GET /vendors/${v_id}.active_order_count == 0 (no capacity consumed)"

      - name: cancel_after_report_received_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScreeningOrder, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Manager-initiated cancel is only legal in {DRAFT, CONSENT_CAPTURED, DISPATCHED}; REPORT_RECEIVED is past the point of no return."
        test_recipe:
          setup: ["order REPORT_RECEIVED (empty findings)"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-SM3", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-SM3", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /adjudication-matrices", payload: { risk_tier: TIER_1_STANDARD, rules: [ { offense_category: VIOLENT_FELONY, min_severity: HIGH, max_recency_years: 10, action: ADVERSE_ELIGIBLE } ] }, as: ComplianceOfficer, captures: { m_id: $.data.id } }
            - { call: "POST /adjudication-matrices/${m_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "T", department: "D", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Sm Three", email: "sm3@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-04T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-reports", payload: { order_id: "${o_id}", findings: [] }, as: VendorAgent, as_user_id: "${v_id}" }
          trigger:
            - { call: "POST /screening-orders/${o_id}/cancel", payload: {}, as: HiringManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_CANCELLABLE (409); order remains REPORT_RECEIVED"

      - name: cancel_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ScreeningOrder, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "A CANCELLED order rejects a second cancel — terminal states admit no further transitions (second-call idempotency is an error, not a no-op)."
        test_recipe:
          setup: ["order cancelled while DRAFT"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-SM4", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin }
            - { call: "POST /screening-packages", payload: { name: "P-SM4", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "T", department: "D", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Sm Four", email: "sm4@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/cancel", payload: {}, as: HiringManager }
          trigger:
            - { call: "POST /screening-orders/${o_id}/cancel", payload: {}, as: HiringManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_CANCELLABLE; fulfillment_status stays CANCELLED; adjudication_status stays VOIDED"

      - name: double_resolve_dispute_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Dispute, "errors[ERR_DISPUTE_NOT_OPEN]"]
        distinguishing_aspect: "RESOLVED_UPHELD is terminal: a second resolve is rejected with ERR_DISPUTE_NOT_OPEN."
        test_recipe:
          setup: ["order REPORT_RECEIVED with finding; dispute filed and resolved UPHELD at 2026-08-07T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-SM5", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-SM5", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /adjudication-matrices", payload: { risk_tier: TIER_1_STANDARD, rules: [ { offense_category: NONVIOLENT_FELONY, min_severity: LOW, max_recency_years: 99, action: IA_REQUIRED } ] }, as: ComplianceOfficer, captures: { m_id: $.data.id } }
            - { call: "POST /adjudication-matrices/${m_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "T", department: "D", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Sm Five", email: "sm5@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-04T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-reports", payload: { order_id: "${o_id}", findings: [ { check_type: CRIMINAL_COUNTY, offense_category: NONVIOLENT_FELONY, severity: MEDIUM, offense_date: "2024-02-01T00:00:00Z", disposition: CONVICTION } ] }, as: VendorAgent, as_user_id: "${v_id}" }
            - { call: "POST /disputes", payload: { order_id: "${o_id}", reason: "record is inaccurate here" }, as: Candidate, as_user_id: "${c_id}", captures: { d_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /disputes/${d_id}/resolve", payload: { outcome: UPHELD }, as: VendorAgent, as_user_id: "${v_id}" }
          trigger:
            - { call: "POST /disputes/${d_id}/resolve", payload: { outcome: UPHELD }, as: VendorAgent, as_user_id: "${v_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DISPUTE_NOT_OPEN; dispute.status stays RESOLVED_UPHELD"

      - name: final_notice_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AdverseActionCase, "errors[ERR_CASE_NOT_AWAITING_FINAL]"]
        distinguishing_aspect: "FINAL_NOTICE_SENT is terminal for the case: a second send-final-notice is rejected with ERR_CASE_NOT_AWAITING_FINAL."
        test_recipe:
          setup: ["full chain; final notice already sent at the boundary 2026-08-12T00:00:00Z by co-sm6 (initiator adj-sm6)"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-SM6", base_tat_business_hours: 40, max_concurrent_orders: 5 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-SM6", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 1000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
