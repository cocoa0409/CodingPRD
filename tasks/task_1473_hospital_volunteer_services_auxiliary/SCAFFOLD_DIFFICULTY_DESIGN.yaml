            - "after volunteer SUSPENDED: confirm fails ERR_VOLUNTEER_INVALID_STATE (http 409)"
            - "assignment remains SIGNED_UP throughout (failed confirms cause no drift)"

      - name: placement_accept_blocked_until_request_reopens
        grounds:
          - state_machines.Placement.OFFERED_to_ACCEPTED
          - state_machines.DepartmentRequest.FILLED_to_OPEN
          - errors[ERR_REQUEST_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Placement -> DepartmentRequest (different pair): P2's accept is
          rejected solely because the REQUEST is FILLED; when a rescission reopens the
          request (FILLED -> OPEN), the SAME accept on the SAME OFFERED placement now
          succeeds — the placement's valid moves are a function of the request's state.
