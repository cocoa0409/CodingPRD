          assert:
            - "the first analysis returns HTTP 201 with analysis_index 1, allowable_kpa_m 90.0, required_stiffener_count 12 and verdict PASS"
            - "replaying the now-stale expected_bin_design_version returns HTTP 412 with error_id ERR_STALE_DESIGN_VERSION"
            - "the design's version is exactly the pre-analysis version plus 1, and its status is still DRAFT - the analysis create bumps the parent version without changing any BinDesign field"
            - "re-issuing the LRFD analysis with the refreshed version returns HTTP 201 with analysis_index 2, allowable_kpa_m 101.25, required_stiffener_count 11 and utilization_ratio 0.9653, so the earlier 412 was a version failure and not a duplicate rejection"
            - "GET /bin-designs/{id}/analyses reports total_count 2 - the rejected create persisted nothing"
            - "the first freight-load create returns HTTP 201 with status PLANNED, and the dealer's staged_kit_count goes from 0 to 1 with version incremented by exactly 1"
            - "replaying the same expected_dealer_version returns HTTP 412 with error_id ERR_STALE_DEALER_VERSION, and staged_kit_count stays 1"
            - "the same create with the refreshed dealer version returns HTTP 201 with status PLANNED, taking staged_kit_count to 2 - within Alpha's staging_slots of 2"
            - "GET /freight-loads filtered by Alpha reports total_count 2, so exactly one of the three creates was rejected"
            - "a create carrying an expected_dealer_version one GREATER than the stored value also returns HTTP 412 ERR_STALE_DEALER_VERSION - the rule is exact equality, not a monotonic staleness test"

      - name: list_filters_combine_conjunctively_and_offset_walks_a_stable_created_at_order
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET /bin-designs
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - validations.p3
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "total_count must describe the FILTERED population, not the table: the same page size returns total_count 3 under a dealer filter while an unfiltered read reports 5, and has_more is derived from offset + returned versus that filtered total rather than from whether the page came back full. Two filters together are an AND, not an OR, so dealer_id Alpha plus author PE-1003 yields exactly one row even though each filter alone yields more. Walking offset past the end returns an empty array with the SAME total_count and has_more false rather than a 404, a filter on a still-null column returns an empty page rather than every row, and limit 0 and limit 101 are priority-3 request-shape failures rather than clamped values."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115."
            - "Engineers PE-1001 (Dana) and PE-1003 (Nina), both licensed in NE-WEST; Dealers Alpha and Pinnacle."
            - "Five designs created in this exact order, all 12.0 m x 9.6 m, pitch 30, wind 105, moisture 14.0, ASD: DA1 (Alpha / Dana), DA2 (Alpha / Dana), DA3 (Alpha / Nina), DP1 (Pinnacle / Dana), DP2 (Pinnacle / Nina). None is sealed."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
