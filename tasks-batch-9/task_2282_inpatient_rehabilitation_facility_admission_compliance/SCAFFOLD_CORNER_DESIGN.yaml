# =============================================================================
# §1.9 Scaffold Corner Design — task 2282
# Inpatient Rehabilitation Facility Admission & Compliance Threshold
#
# Breadth probe over §1.1–§1.7 of SCAFFOLD.yaml. Every claim_type value is taken
# from references/claim-extraction-guide.md; corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
#
# Conventions shared by every chain below:
#   * The logical clock is set explicitly first; its documented default is
#     2026-08-01T00:00:00Z and no instance relies on that default.
#   * ComplianceOfficer is opaque: as_user_id "officer-1" (a second officer
#     "officer-2" is used where segregation of duties requires a distinct user).
#   * NPIs: nurse 1000000001, rehab physician 1000000002, PT 1000000003,
#     coder 1000000004, second PT 1000000005, second coder 1000000006,
#     OT 1000000007, second physician 1000000008.
#   * cms_ccn values 200001.. are allocated one per instance so no chain can be
#     confused with another when the recipes are transcribed into fixtures.
#   * Every negative trigger captures err: $.data.error_id and asserts both the
#     error_id and the HTTP status.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: facility_create_applies_declared_defaults_and_zeroed_computeds
        claim_type: Creation
        grounds:
          - entities.Facility.fields.compliance_threshold_pct
          - entities.Facility.fields.daily_therapy_cap_minutes
          - entities.Facility.fields.settled_payment_cents
          - entities.Facility.fields.posture
          - endpoints[POST /facilities]
        distinguishing_aspect: "POST /facilities with only the four required inputs returns 201 with compliance_threshold_pct 60.00, daily_therapy_cap_minutes 300, settled_payment_cents 0, cohort_total_count 0, provisional_compliance_pct 0.00, active_qrp_penalty_pct 0.00, posture OPEN and version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-03T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200001", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
          assert:
            - "HTTP status of the trigger response == 201"
            - "Facility.${fac_id}.name == Northside IRF"
            - "Facility.${fac_id}.cms_ccn == 200001"
            - "Facility.${fac_id}.compliance_threshold_pct == 60.00"
            - "Facility.${fac_id}.daily_therapy_cap_minutes == 300"
            - "Facility.${fac_id}.settled_payment_cents == 0"
            - "Facility.${fac_id}.cohort_total_count == 0"
            - "Facility.${fac_id}.provisional_compliance_pct == 0.00"
            - "Facility.${fac_id}.active_qrp_penalty_pct == 0.00"
            - "Facility.${fac_id}.certified_compliance_pct == null"
            - "Facility.${fac_id}.posture == OPEN"
            - "Facility.${fac_id}.version == 1"

      - name: clinician_get_by_id_returns_stored_record
        claim_type: Retrieval
        grounds:
          - endpoints[GET /clinicians/{clinicianId}]
          - entities.Clinician.fields.credential
          - entities.Clinician.fields.status
        distinguishing_aspect: "GET /clinicians/{clinicianId} returns the record exactly as stored: full_name Nina Nurse, credential NURSE, npi 1000000001, status ACTIVE, facility_id equal to the creating facility and version 1."
        test_recipe:
          setup:
            - "One facility and one NURSE clinician created at clock 2026-08-03T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200002", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "GET /clinicians/${nurse_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP status of the trigger response == 200"
            - "Clinician.${nurse_id}.full_name == Nina Nurse"
            - "Clinician.${nurse_id}.credential == NURSE"
            - "Clinician.${nurse_id}.npi == 1000000001"
            - "Clinician.${nurse_id}.status == ACTIVE"
            - "Clinician.${nurse_id}.facility_id == ${fac_id}"
            - "Clinician.${nurse_id}.version == 1"

      - name: clinician_list_reports_total_count_and_has_more_under_limit
        claim_type: Listing
        grounds:
          - endpoints[GET /clinicians]
          - response_envelope.pagination
        distinguishing_aspect: "With three clinicians at one facility, GET /clinicians?facility_id=...&limit=2&offset=0 returns exactly 2 items with total_count 3, has_more true, limit 2 and offset 0 in the envelope."
        test_recipe:
          setup:
            - "One facility with three clinicians: a NURSE, a REHAB_PHYSICIAN and a THERAPIST_PT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200003", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Paul Physician", credential: "REHAB_PHYSICIAN", npi: "1000000002" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { phys_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Tara Therapist", credential: "THERAPIST_PT", npi: "1000000003" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { pt1_id: $.data.id }
          trigger:
            - call: "GET /clinicians"
              payload: { facility_id: "${fac_id}", limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP status of the trigger response == 200"
            - "length of data in the trigger response == 2"
            - "total_count in the trigger response == 3"
            - "has_more in the trigger response == true"
            - "limit in the trigger response == 2"
            - "offset in the trigger response == 0"

      - name: patient_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /patients/{patientId}]
          - validations[priority=40]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /patients/00000000-0000-0000-0000-000000000000 against a database holding one real patient returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "One facility, one NURSE clinician and one patient exist; the id used in the trigger belongs to no record."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200004", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
            - call: "POST /patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN-A", full_name: "Ann Patient", birth_date: "1958-04-11", impairment_group_code: "0008", etiologic_diagnosis_code: "I63.9", comorbidity_tier: "TIER_2" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { pat_a_id: $.data.id }
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "HTTP status of the trigger response == 404"

      - name: facility_create_without_cms_ccn_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /facilities]
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /facilities omitting the required cms_ccn input returns ERR_INVALID_REQUEST with HTTP 400 and creates no facility."
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-08-03T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /facilities"
              payload: { name: "Northside IRF", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status of the trigger response == 400"

      - name: plan_of_care_three_hour_rule_mode_defaults_to_daily
        claim_type: Defaults
        grounds:
          - entities.OverallPlanOfCare.fields.three_hour_rule_mode
          - endpoints[POST /plans-of-care]
          - state_machines.Admission.documentation_status
        distinguishing_aspect: "POST /plans-of-care omitting three_hour_rule_mode stores DAILY_3HR, stamps signed_at at the current clock 2026-08-04T12:00:00Z, sets authored_by_clinician_id from X-User-ID and moves the admission's documentation_status to POC_SIGNED."
        test_recipe:
          setup:
            - "One facility, a NURSE and a REHAB_PHYSICIAN, patient A with a PHYSICIAN_CONCURRED screening."
            - "Admission A admitted at 2026-08-04T12:00:00Z and still holding documentation_status INCOMPLETE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200005", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Paul Physician", credential: "REHAB_PHYSICIAN", npi: "1000000002" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { phys_id: $.data.id }
            - call: "POST /patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN-A", full_name: "Ann Patient", birth_date: "1958-04-11", impairment_group_code: "0008", etiologic_diagnosis_code: "I63.9", comorbidity_tier: "TIER_2" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { pat_a_id: $.data.id }
            - call: "POST /screenings"
              payload: { patient_id: "${pat_a_id}", conducted_by_clinician_id: "${nurse_id}", expected_admission_at: "2026-08-04T12:00:00Z", intensive_therapy_documented: true, expected_functional_improvement_documented: true, prior_functional_level_documented: true, medical_supervision_documented: true }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { scr_a_id: $.data.id }
            - call: "POST /screenings/${scr_a_id}/submit"
              payload: {}
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
            - call: "POST /screenings/${scr_a_id}/review"
              payload: { decision: "CONCUR" }
              as: RehabPhysician
              as_user_id: "${phys_id}"
            - call: "POST /admissions"
              payload: { patient_id: "${pat_a_id}", screening_id: "${scr_a_id}" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { adm_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T12:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /admissions/${adm_a_id}/admit"
              payload: { admitted_at: "2026-08-04T12:00:00Z" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
            - call: "GET /admissions/${adm_a_id}"
              payload: {}
              as: RehabPhysician
              as_user_id: "${phys_id}"
              captures: { adm_a_v: $.data.version }
          trigger:
            - call: "POST /plans-of-care"
              payload: { admission_id: "${adm_a_id}", expected_admission_version: "${adm_a_v}", target_los_days: 14, weekly_minutes_target: 900, disciplines: ["PT"] }
              as: RehabPhysician
              as_user_id: "${phys_id}"
              captures: { poc_id: $.data.id }
          assert:
            - "HTTP status of the trigger response == 201"
            - "OverallPlanOfCare.${poc_id}.three_hour_rule_mode == DAILY_3HR"
            - "OverallPlanOfCare.${poc_id}.status == ACTIVE"
            - "OverallPlanOfCare.${poc_id}.signed_at == 2026-08-04T12:00:00Z"
            - "OverallPlanOfCare.${poc_id}.authored_by_clinician_id == ${phys_id}"
            - "Admission.${adm_a_id}.documentation_status == POC_SIGNED"
            - "Admission.${adm_a_id}.poc_signed_within_deadline == true"

      - name: screening_system_fields_stamped_at_creation
        claim_type: System Fields
        grounds:
          - entities.PreadmissionScreening.fields.conducted_at
          - entities.PreadmissionScreening.fields.status
          - entities.PreadmissionScreening.fields.revision_count
        distinguishing_aspect: "POST /screenings stamps conducted_at from the logical clock (2026-08-03T08:00:00Z), sets status DRAFT, revision_count 0, version 1 and leaves reviewed_at and reviewed_by_clinician_id null."
        test_recipe:
          setup:
            - "One facility, a NURSE clinician and patient A at clock 2026-08-03T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200006", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
            - call: "POST /patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN-A", full_name: "Ann Patient", birth_date: "1958-04-11", impairment_group_code: "0008", etiologic_diagnosis_code: "I63.9", comorbidity_tier: "TIER_2" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { pat_a_id: $.data.id }
          trigger:
            - call: "POST /screenings"
              payload: { patient_id: "${pat_a_id}", conducted_by_clinician_id: "${nurse_id}", expected_admission_at: "2026-08-04T12:00:00Z", intensive_therapy_documented: true, expected_functional_improvement_documented: true, prior_functional_level_documented: true, medical_supervision_documented: true }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { scr_a_id: $.data.id }
          assert:
            - "HTTP status of the trigger response == 201"
            - "PreadmissionScreening.${scr_a_id}.conducted_at == 2026-08-03T08:00:00Z"
            - "PreadmissionScreening.${scr_a_id}.status == DRAFT"
            - "PreadmissionScreening.${scr_a_id}.revision_count == 0"
            - "PreadmissionScreening.${scr_a_id}.reviewed_at == null"
            - "PreadmissionScreening.${scr_a_id}.reviewed_by_clinician_id == null"
            - "PreadmissionScreening.${scr_a_id}.version == 1"

      - name: admission_copies_facility_id_from_patient_at_creation
        claim_type: Computed Fields
        grounds:
          - entities.Admission.fields.facility_id
          - entities.Admission.fields.stay_status
          - entities.Admission.fields.payment_status
          - entities.Admission.fields.documentation_status
        distinguishing_aspect: "POST /admissions copies facility_id from the patient rather than accepting it as input, and opens the record at stay_status PENDING, payment_status NOT_PRICED, documentation_status INCOMPLETE with interrupted_stay_flag false and total_payment_cents 0."
        test_recipe:
          setup:
            - "One facility, a NURSE and a REHAB_PHYSICIAN, patient A with a PHYSICIAN_CONCURRED screening; no admission yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200007", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Paul Physician", credential: "REHAB_PHYSICIAN", npi: "1000000002" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { phys_id: $.data.id }
            - call: "POST /patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN-A", full_name: "Ann Patient", birth_date: "1958-04-11", impairment_group_code: "0008", etiologic_diagnosis_code: "I63.9", comorbidity_tier: "TIER_2" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { pat_a_id: $.data.id }
            - call: "POST /screenings"
              payload: { patient_id: "${pat_a_id}", conducted_by_clinician_id: "${nurse_id}", expected_admission_at: "2026-08-04T12:00:00Z", intensive_therapy_documented: true, expected_functional_improvement_documented: true, prior_functional_level_documented: true, medical_supervision_documented: true }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { scr_a_id: $.data.id }
            - call: "POST /screenings/${scr_a_id}/submit"
              payload: {}
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
            - call: "POST /screenings/${scr_a_id}/review"
              payload: { decision: "CONCUR" }
              as: RehabPhysician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /admissions"
              payload: { patient_id: "${pat_a_id}", screening_id: "${scr_a_id}" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { adm_a_id: $.data.id }
          assert:
            - "HTTP status of the trigger response == 201"
            - "Admission.${adm_a_id}.facility_id == ${fac_id}"
            - "Admission.${adm_a_id}.stay_status == PENDING"
            - "Admission.${adm_a_id}.payment_status == NOT_PRICED"
            - "Admission.${adm_a_id}.documentation_status == INCOMPLETE"
            - "Admission.${adm_a_id}.interrupted_stay_flag == false"
            - "Admission.${adm_a_id}.total_payment_cents == 0"
            - "Admission.${adm_a_id}.admitted_at == null"
            - "Admission.${adm_a_id}.version == 1"

      - name: patient_create_with_unknown_comorbidity_tier_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.comorbidity_tier
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /patients with comorbidity_tier TIER_9, which is outside the declared enum NONE|TIER_3|TIER_2|TIER_1, returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup:
            - "One facility and one NURSE clinician exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /facilities"
              payload: { name: "Northside IRF", cms_ccn: "200008", review_period_start: "2026-08-01", review_period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { facility_id: "${fac_id}", full_name: "Nina Nurse", credential: "NURSE", npi: "1000000001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN-A", full_name: "Ann Patient", birth_date: "1958-04-11", impairment_group_code: "0008", etiologic_diagnosis_code: "I63.9", comorbidity_tier: "TIER_9" }
              as: NurseCaseManager
              as_user_id: "${nurse_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status of the trigger response == 400"

      - name: facility_create_with_inverted_review_period_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=36]
          - errors[ERR_INVALID_PERIOD]
          - entities.Facility.fields.review_period_start
        distinguishing_aspect: "POST /facilities with review_period_start 2026-08-31 and review_period_end 2026-08-01 returns ERR_INVALID_PERIOD with HTTP 400 rather than the generic ERR_INVALID_REQUEST."
        test_recipe:
          setup:
