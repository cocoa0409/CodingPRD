              captures: { v_after_deenergize: $.data.version }
          assert:
            - "v_after_create == 1 — the initial write is version 1, not 0"
            - "v_after_index > v_after_create because the index creation restamped latest_forecast_fpi_score, latest_forecast_fpi_tier and risk_posture"
            - "v_after_customers > v_after_index because each customer create bumped customer_count on its circuit"
            - "v_after_deenergize > v_after_customers because the event's cascade wrote energization_state DE_ENERGIZED and risk_posture LOCKED"
            - "the four captured versions are strictly increasing, and none of the four writes came from a Circuit endpoint other than the create"

