scaffold_corner_design:
  # =========================================================================
  # Entities — creation, retrieval, listing, required fields, computed/system fields
  # =========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Venue, endpoints]
        distinguishing_aspect: "POST /venues with all required fields returns 201 and a Venue whose fm_channel_pool, version==1, and a server-minted id are present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Twilight Drive-In", fm_channel_pool: ["87.9","88.1"], turnaround_buffer_minutes: 20, no_show_grace_minutes: 10 }
              as: PlatformAdmin
              captures: { venue_id: $.data.id, ver: $.data.version }
          assert:
            - "trigger response status == 201"
            - "Venue.${venue_id}.name == 'Twilight Drive-In'"
            - "Venue.${venue_id}.version == 1"
            - "Venue.${venue_id}.turnaround_buffer_minutes == 20"

      - name: get_showtime_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Showtime, endpoints]
        distinguishing_aspect: "GET /showtimes/{id} returns the showtime with computed end_utc and reserved_stall_count==0 right after creation."
        test_recipe:
          setup: ["A SCHEDULED single-feature showtime (primary runtime 100m starting 2026-07-20T02:00:00Z)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC1", fm_channel_pool: ["88.5"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-20T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id }
          trigger:
            - call: "GET /showtimes/${st_id}"
              payload: {}
              as: Patron
          assert:
            - "GET response status == 200"
            - "Showtime.${st_id}.end_utc == '2026-07-20T03:40:00.000Z' (start + 100m)"
            - "Showtime.${st_id}.reserved_stall_count == 0"

      - name: list_lots_filtered_by_venue_paginated
        claim_type: Listing
        grounds: [entities.Lot, endpoints]
        distinguishing_aspect: "GET /lots?venue_id=... returns a paginated array with total_count and has_more; only lots of that venue appear."
        test_recipe:
          setup: ["One venue with two lots."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC2", fm_channel_pool: ["88.7"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "LA", stall_count: 5, person_capacity: 50 }
              as: VenueOperator
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "LB", stall_count: 5, person_capacity: 50 }
              as: VenueOperator
          trigger:
            - call: "GET /lots?venue_id=${venue_id}&limit=10&offset=0"
              payload: {}
              as: VenueOperator
          assert:
            - "GET response status == 200"
            - "response total_count == 2"
            - "response has_more == false"

      - name: create_lot_missing_stall_count_rejected
        claim_type: Required Fields
        grounds: [entities.Lot.fields.stall_count, "validations[priority=5]"]
        distinguishing_aspect: "POST /lots omitting stall_count returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC3", fm_channel_pool: ["89.5"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", person_capacity: 50 }
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 400"
            - "trigger response error_id == ERR_INVALID_REQUEST"

      - name: venue_timezone_default_applied
        claim_type: Defaults
        grounds: [entities.Venue.fields.timezone]
        distinguishing_aspect: "POST /venues omitting timezone applies default 'UTC'."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "VC4", fm_channel_pool: ["89.7"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
          assert:
            - "Venue.${venue_id}.timezone == 'UTC'"
            - "Venue.${venue_id}.turnaround_buffer_minutes == 30"
            - "Venue.${venue_id}.no_show_grace_minutes == 15"

      - name: reservation_amount_due_is_computed_not_input
        claim_type: Computed Fields
        grounds: [entities.Reservation.fields.amount_due_cents, calculations.reservation_pricing]
        excluded_because:
          difficulty_instance: combinatorial_formula / per_car_tiered_extra_person_mode_a
          rationale: "amount_due_cents computation correctness is asserted by the §1.8 per-car pricing instance (==5300)."

      - name: reservation_id_system_minted
        claim_type: System Fields
        grounds: [entities.Reservation.fields.gate_code]
        distinguishing_aspect: "Reservation create mints id, created_at, version=1, and a gate_code distinct from id; client cannot supply them."
        test_recipe:
          setup: ["A SCHEDULED showtime."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC5", fm_channel_pool: ["90.5"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-21T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-sys", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-sys"
              captures: { resv_id: $.data.id, gc: $.data.gate_code, v: $.data.version }
          assert:
            - "Reservation.${resv_id}.version == 1"
            - "Reservation.${resv_id}.gate_code is a non-empty string not equal to ${resv_id}"
            - "Reservation.${resv_id}.occupancy_status == CONFIRMED"
            - "Reservation.${resv_id}.payment_status == UNPAID"

      - name: showtime_invalid_rating_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Film.fields.rating, "validations[priority=5]"]
        distinguishing_aspect: "POST /films with rating='XYZ' (not in {G,PG,PG13,R}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /films"
              payload: { title: "Bad", runtime_minutes: 90, rating: "XYZ" }
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 400"
            - "trigger response error_id == ERR_INVALID_REQUEST"

      - name: showtime_references_existing_lot_and_films
        claim_type: Parent Relationships
        grounds: [entities.Showtime.fields.lot_id, "validations[priority=4]"]
        distinguishing_aspect: "POST /showtimes with a non-existent lot_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A venue and a film exist; no lot with the supplied id."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC6", fm_channel_pool: ["90.7"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "11111111-1111-4111-8111-111111111111", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-22T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 404"
            - "trigger response error_id == ERR_NOT_FOUND"

      - name: film_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Film]
        distinguishing_aspect: "Film has common_fields:false — it exposes id and created_at but no version field and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["A film exists."]
          setup_api_calls:
            - call: "POST /films"
              payload: { title: "Immutable", runtime_minutes: 95, rating: "PG" }
              as: VenueOperator
              captures: { f1: $.data.id }
          trigger:
            - call: "GET /films/${f1}"
              payload: {}
              as: Patron
          assert:
            - "GET response status == 200"
            - "Film.${f1} response has no 'version' key (common_fields:false)"

  # =========================================================================
  # State machines — valid/invalid transitions, terminal lockdown, initial state, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: showtime_complete_valid_after_end
        claim_type: Valid Transition
        grounds: [state_machines.Showtime.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "Advancing the clock past end_utc then POST /showtimes/{id}/complete moves SCHEDULED->COMPLETED."
        test_recipe:
          setup: ["A SCHEDULED single-feature showtime (100m) starting 2026-07-23T02:00:00Z; clock set past its end_utc."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC7", fm_channel_pool: ["91.5"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-23T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-23T05:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /showtimes/${st_id}/complete"
              payload: {}
              as: VenueOperator
          assert:
            - "Showtime.${st_id}.status == COMPLETED"

      - name: complete_before_end_returns_too_early
        claim_type: Precondition Enforcement
        grounds: [state_machines.Showtime.SCHEDULED_to_COMPLETED, "errors[ERR_COMPLETE_TOO_EARLY]"]
        distinguishing_aspect: "POST /showtimes/{id}/complete while clock < end_utc returns ERR_COMPLETE_TOO_EARLY (409)."
        test_recipe:
          setup: ["A SCHEDULED showtime starting in the future; clock before its end_utc."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC8", fm_channel_pool: ["91.7"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-24T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /showtimes/${st_id}/complete"
              payload: {}
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response error_id == ERR_COMPLETE_TOO_EARLY"

      - name: clear_weather_hold_from_scheduled_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Showtime.WEATHER_HOLD_to_SCHEDULED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /showtimes/{id}/clear-weather-hold on a SCHEDULED (not WEATHER_HOLD) showtime returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED showtime (never put on weather hold)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC9", fm_channel_pool: ["92.5"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-25T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /showtimes/${st_id}/clear-weather-hold"
              payload: {}
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: reject_after_approve_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.PrivateRental.REQUESTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An APPROVED rental cannot be REJECTED — reject requires REQUESTED — so POST /private-rentals/{id}/reject returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An APPROVED private rental on an otherwise free lot."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC10", fm_channel_pool: ["92.7"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /private-rentals"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", organizer_id: "org-x", start_utc: "2026-07-26T02:00:00Z", end_utc: "2026-07-26T05:00:00Z", flat_venue_fee_cents: 100000, per_hour_cents: 10000 }
              as: VenueOperator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /private-rentals/${r_id}/approve"
              payload: { expected_private_rental_version: "${r_v}" }
              as: VenueOperator
          trigger:
            - call: "POST /private-rentals/${r_id}/reject"
              payload: {}
              as: VenueOperator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: reservation_initial_state_confirmed_unpaid
        claim_type: Initial State
        grounds: [entities.Reservation.fields.occupancy_status, entities.Reservation.fields.payment_status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / reservation_parallel_occupancy_payment_dimensions
          rationale: "Initial CONFIRMED/UNPAID state is established and observed as the precondition of the parallel-dimension §1.8 instance."

      - name: double_cancel_reservation_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Reservation.CONFIRMED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED reservation a second time returns ERR_INVALID_STATE; no second refund record is created."
        test_recipe:
          setup: ["A CANCELLED unpaid reservation."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC11", fm_channel_pool: ["93.5"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-27T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-idem", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-idem"
              captures: { resv_id: $.data.id, resv_v: $.data.version }
            - call: "POST /reservations/${resv_id}/cancel"
              payload: { expected_reservation_version: "${resv_v}" }
              as: Patron
              as_user_id: "patron-idem"
              captures: { resv_v2: $.data.version }
          trigger:
            - call: "POST /reservations/${resv_id}/cancel"
              payload: { expected_reservation_version: "${resv_v2}" }
              as: Patron
              as_user_id: "patron-idem"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: scan_with_wrong_gate_code_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Reservation.CHECKED_IN_to_SCANNED, "errors[ERR_GATE_CODE_MISMATCH]"]
        distinguishing_aspect: "POST /reservations/{id}/scan with a gate_code != reservation.gate_code returns ERR_GATE_CODE_MISMATCH (409); status stays CHECKED_IN."
        test_recipe:
          setup: ["A CHECKED_IN reservation (paid, within window)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC12", fm_channel_pool: ["93.7"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-28T01:30:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { venue_id: "${venue_id}", lot_id: "${lot_id}", primary_film_id: "${f1}", is_double_feature: false, start_utc: "2026-07-28T02:00:00Z", pricing_mode: "PER_CAR", base_price_cents: 2000 }
              as: VenueOperator
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /reservations"
              payload: { showtime_id: "${st_id}", patron_id: "patron-scan", occupant_count: 2, expected_showtime_version: "${st_v}" }
              as: Patron
              as_user_id: "patron-scan"
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "patron-scan"
            - call: "POST /reservations/${resv_id}/check-in"
              payload: {}
              as: GateAttendant
          trigger:
            - call: "POST /reservations/${resv_id}/scan"
              payload: { gate_code: "WRONG-CODE" }
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response error_id == ERR_GATE_CODE_MISMATCH"
            - "Reservation.${resv_id}.occupancy_status == CHECKED_IN"

      - name: checkin_before_window_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Reservation.CONFIRMED_to_CHECKED_IN, "errors[ERR_CHECKIN_WINDOW_CLOSED]"]
        distinguishing_aspect: "POST /reservations/{id}/check-in more than 60 minutes before start_utc returns ERR_CHECKIN_WINDOW_CLOSED (409)."
        test_recipe:
          setup: ["A paid CONFIRMED reservation; clock more than 60m before showtime start."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "VC13", fm_channel_pool: ["94.5"] }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /lots"
              payload: { venue_id: "${venue_id}", name: "L", stall_count: 10, person_capacity: 100 }
              as: VenueOperator
              captures: { lot_id: $.data.id }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 100, rating: "G" }
              as: VenueOperator
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
