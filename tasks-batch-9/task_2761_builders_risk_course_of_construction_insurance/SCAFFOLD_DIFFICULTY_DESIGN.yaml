      - name: payee_referential_check_outranks_reserve_ceiling_and_rejects_payment
        grounds:
          - validations[priority=100].ERR_PAYEE_NOT_ON_POLICY
          - validations[priority=114].ERR_PAYMENT_EXCEEDS_RESERVE
          - calculations.coverage_erosion_reconciliation
        distinguishing_aspect: |
          Pairs a business_referential rule (priority 100) against a business_fiscal rule
          (priority 114) on the same POST /builders-risk/loss-payments request. One request
          violates both - the payee belongs to a different policy AND the amount exceeds what the
          coverage part still has available - and must surface the referential error. Repairing
          only the payee then exposes the fiscal error, and the fiscal ceiling is only reachable
          because an earlier payment on a sibling claim eroded the part after this claim was
          adjusted, so allocated_cents (15000000) is stale relative to available_cents (10000000).
