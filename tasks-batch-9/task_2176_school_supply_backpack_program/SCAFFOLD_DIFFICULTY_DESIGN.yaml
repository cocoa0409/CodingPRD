              as_user_id: "${site_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CYCLE_PHASE_INVALID"
            - "GET /donation-batches with collection_site_id=${site_id} returns an empty array"
            - "CollectionSite.${site_id}.operational_status == ACTIVE"

      - name: teacher_request_fulfilment_requires_covering_inventory_position
        grounds:
          - validations[priority=28]
          - state_machines.TeacherRequest.APPROVED_to_FULFILLED
          - errors[ERR_INSUFFICIENT_INVENTORY]
          - entities.InventoryPosition.fields.on_hand_qty
