  - method: GET
    path: "/supplement-compliance/product-ingredients/{id}"
    description: "Fetch one supplement-facts line."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: []
    output: ProductIngredient
    side_effects: []
  - method: GET
    path: "/supplement-compliance/product-ingredients"
    description: "List supplement-facts lines, filterable by product_id (FK reverse-reachability for ProductIngredient.product_id), ingredient_id (FK reverse-reachability for ProductIngredient.ingredient_id) and line_status."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
