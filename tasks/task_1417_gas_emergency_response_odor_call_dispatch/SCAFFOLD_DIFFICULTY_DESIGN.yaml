# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Gas Emergency Response & Odor Call Dispatch
# =============================================================================
# Common fixture shorthand used across instances:
#   T1 = territory with P1=30, P2=60, P3=240, P4=1440 minutes,
#        recurrence_window_hours=72, repair_budget_cap_cents=1000000
# All times are logical-clock times set via POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: response_elapsed_raw_vs_adjusted_variants
        grounds:
          - calculations.response_elapsed_time
          - calculations.sla_breach_classification
          - entities.GasIncident.fields.raw_elapsed_seconds
          - entities.GasIncident.fields.adjusted_elapsed_seconds
        distinguishing_aspect: |
          Dual variant on the incident/response-clock domain: identical stored
          timestamps yield raw_elapsed_seconds=4800 (breach under the raw
          variant, 4800 > 3600) and adjusted_elapsed_seconds=3600 (compliant
          under the adjusted variant, equality is not a breach). This instance
          belongs to the GasIncident timing domain, distinct from the
          RepairWorkOrder costing domain of the sibling instance.
        test_recipe:
          setup:
            - "Territory T1 with P2 threshold 60 minutes"
            - "Technician TECH1 on shift [2026-08-01T00:00:00Z, 2026-08-01T12:00:00Z) in T1"
            - "P2 incident (odor inside) created at 2026-08-01T00:00:00Z, triaged at 00:01, dispatched at 00:02"
            - "Pause [00:10, 00:30) = 1200 seconds; technician arrives at 01:20"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Ann", caller_phone: "555-0100", address_line: "10 Main St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:02:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:10:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/incidents/${inc_id}/response-clock-pauses"
              payload: { reason: "CUSTOMER_NOT_HOME" }
              as: Dispatcher
              captures: { pause_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/response-clock-pauses/${pause_id}/end"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:20:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /gas-ops/dispatches/${disp_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
          assert:
            - "GasIncident.${inc_id}.raw_elapsed_seconds == 4800"
            - "GasIncident.${inc_id}.adjusted_elapsed_seconds == 3600"
            - "GasIncident.${inc_id}.threshold_minutes == 60"
            - "GasIncident.${inc_id}.breach_class == NONE (adjusted variant: 3600 <= 3600, equality compliant)"
            - "Raw-variant comparison would breach (4800 > 3600) — verified via report in adjusted_elapsed_exactly_at_threshold_is_compliant"

      - name: repair_cost_provisional_vs_final_variants
        grounds:
          - calculations.repair_cost_final
          - calculations.provisional_estimate_matrix
          - entities.RepairWorkOrder.fields.provisional_estimate_cents
          - entities.RepairWorkOrder.fields.final_cost_cents
        distinguishing_aspect: |
          Dual variant on the RepairWorkOrder costing domain (distinct entity
          domain from the response-clock variant): one work order carries a
          matrix-derived provisional estimate (45000c for OUTSIDE_COMPANY x P3)
          and a line-derived final cost (9164c) — two valid algorithms over the
          same work order producing materially different values.
        test_recipe:
          setup:
            - "Territory T1 (cap 1000000); technician on shift all morning; crew C1 in T1 at 6000c/hour"
            - "P3 incident (odor outside) driven to leak_confirmed=true with a FINAL OUTSIDE_COMPANY determination, auto-creating the work order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/repair-crews"
              payload: { crew_code: "C1", territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { crew_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Bob", caller_phone: "555-0101", address_line: "20 Oak Ave", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P3" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/dispatches/${disp_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/atmospheric-readings"
              payload: { pct_lel: 3.0, co_ppm: 0, reading_context: "OUTSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/make-safe/complete"
              payload: { leak_confirmed: true, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
              captures: { inc_v: "$.data.version" }
            - call: "POST /gas-ops/incidents/${inc_id}/responsibility-determinations"
              payload: { responsibility: "OUTSIDE_COMPANY", basis: "BARHOLE_SURVEY", expected_incident_version: "${inc_v}" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { det_id: "$.data.id" }
            - call: "POST /gas-ops/responsibility-determinations/${det_id}/finalize"
              payload: {}
              as: Supervisor
              as_user_id: "sup-2"
            - call: "GET /gas-ops/incidents/${inc_id}/repair-work-orders"
              payload: {}
              as: Supervisor
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /gas-ops/repair-work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T10:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/repair-work-orders/${wo_id}/start"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /gas-ops/repair-work-orders/${wo_id}/complete"
              payload: { lines: [{ description: "pipe section", quantity: 7, unit_price_cents: 333, discount_pct: 0.05 }, { description: "clamp", quantity: 1, unit_price_cents: 999, discount_pct: 0.05 }], labor_minutes: 45 }
              as: Supervisor
            - call: "GET /gas-ops/repair-work-orders/${wo_id}"
              payload: {}
              as: Supervisor
          assert:
            - "RepairWorkOrder.${wo_id}.provisional_estimate_cents == 45000"
            - "RepairWorkOrder.${wo_id}.labor_billed_minutes == 60 (45 rounded up to quarter-hour)"
            - "Per-line rounding: round_half_up(7*333*0.95)=round_half_up(2214.45)=2214; round_half_up(1*999*0.95)=round_half_up(949.05)=949; parts=3163"
            - "Labor: 60min -> 1.0h * 6000c = 6000c"
            - "RepairWorkOrder.${wo_id}.final_cost_cents == 9163"
            - "RepairWorkOrder.${wo_id}.current_estimate_cents == 9163"
            - "provisional_estimate_cents (45000) != final_cost_cents (9163): variants diverge on identical work order"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: severity_score_multi_factor_branches
        grounds:
          - calculations.incident_severity_score
          - entities.GasIncident.fields.severity_score
          - entities.GasIncident.fields.evacuation_required
        distinguishing_aspect: |
          Mode (a) — a 4-input formula with conditional branch selection per
          input (LEL/CO/occupancy/symptom factor ladders) wrapped in nested
          min/max: with pct_lel=12.0 (factor 1.0), co_ppm=80 (factor 1.0),
          MULTI_FAMILY (0.6), symptoms on a linked call (1.0) the score is
          min(100, max(0, round(40+25+12+15))) = 92 and pct_lel >= 10.0 also
          flips evacuation_required.
        test_recipe:
          setup:
            - "T1; technician on shift; MULTI_FAMILY inside-odor incident (call reports symptoms) triaged P2, dispatched, arrived"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Cara", caller_phone: "555-0102", address_line: "5 Elm St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "MULTI_FAMILY", odor_reported: true, symptoms_reported: true, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:20:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/dispatches/${disp_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /gas-ops/incidents/${inc_id}/atmospheric-readings"
              payload: { pct_lel: 12.0, co_ppm: 80, reading_context: "INSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
            - call: "GET /gas-ops/incidents/${inc_id}/public-notifications"
              payload: {}
              as: Supervisor
              captures: { notif_count: "$.data" }
          assert:
            - "GasIncident.${inc_id}.severity_score == 92"
            - "GasIncident.${inc_id}.evacuation_required == true"
            - "GET notifications returns exactly 1 auto-created DRAFT with origin AUTO_PRIORITY (created at intake because implied_priority == P1 via symptoms) — severity 92 >= 80 does not create a second one (auto_notification_created idempotence)"
            - "PublicNotification[0].status == DRAFT"

      - name: repair_final_cost_per_line_rounding_order
        grounds:
          - calculations.repair_cost_final
          - entities.RepairWorkOrder.fields.labor_billed_minutes
        distinguishing_aspect: |
          Mode (b) — nested rounding where order is pinned: two parts lines of
          1 x 101c at 50% discount each round half-up to 51c (per-line sum
          102c), whereas sum-then-round would yield round(50.5+50.5)=101c; the
          scaffold pins per-line-first, so the 1-cent divergence is observable
          in final_cost_cents (102 + 3000 labor = 3102, not 3101).
        test_recipe:
          setup:
            - "T1; crew C1 at 6000c/hour; work order (origin MANUAL, UNDETERMINED estimate) progressed to IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/repair-crews"
              payload: { crew_code: "C1", territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { crew_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Dan", caller_phone: "555-0103", address_line: "9 Pine Rd", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:20:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/dispatches/${disp_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/atmospheric-readings"
              payload: { pct_lel: 2.0, co_ppm: 0, reading_context: "INSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/make-safe/complete"
              payload: { leak_confirmed: true, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/repair-work-orders"
              payload: {}
              as: Supervisor
              captures: { wo_id: "$.data.id" }
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
              captures: { inc_v: "$.data.version" }
            - call: "POST /gas-ops/incidents/${inc_id}/responsibility-determinations"
              payload: { responsibility: "SHARED", basis: "EXCAVATION", expected_incident_version: "${inc_v}" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { det_id: "$.data.id" }
            - call: "POST /gas-ops/responsibility-determinations/${det_id}/finalize"
              payload: {}
              as: Supervisor
              as_user_id: "sup-2"
            - call: "POST /gas-ops/repair-work-orders/${wo_id}/schedule"
              payload: { crew_id: "${crew_id}", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T09:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/repair-work-orders/${wo_id}/start"
              payload: {}
              as: Supervisor
          trigger:
            - call: "POST /gas-ops/repair-work-orders/${wo_id}/complete"
              payload: { lines: [{ description: "gasket", quantity: 1, unit_price_cents: 101, discount_pct: 0.5 }, { description: "sealant", quantity: 1, unit_price_cents: 101, discount_pct: 0.5 }], labor_minutes: 30 }
              as: Supervisor
            - call: "GET /gas-ops/repair-work-orders/${wo_id}"
              payload: {}
              as: Supervisor
          assert:
            - "RepairWorkOrder.${wo_id}.provisional_estimate_cents == 60000 (UNDETERMINED row at manual creation)"
            - "RepairWorkOrder.${wo_id}.labor_billed_minutes == 30"
            - "RepairWorkOrder.${wo_id}.final_cost_cents == 3102 (51 + 51 + 3000)"
            - "final_cost_cents != 3101 — the sum-then-round order is explicitly wrong"
            - "The SHARED finalization auto-creates a SECOND work order (origin AUTO_DETERMINATION, estimate 45000 for SHARED x P2); GET /gas-ops/incidents/${inc_id}/repair-work-orders returns 2 orders"

      - name: reclassification_breach_report_evaluation_order
        grounds:
          - calculations.sla_breach_classification
          - calculations.regulatory_compliance_snapshot
          - state_machines.GasIncident
          - entities.RegulatoryReport.fields.needs_regeneration
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned to an explicit
          evaluation order: reclassification changes the threshold, which
          changes the breach verdict against the already-running clock, which
          must then mark the covering DRAFT report stale; the pinned order is
          (1) recompute elapsed, (2) re-evaluate breach, (3) flag reports —
          observable because a P3->P1 reclassify at elapsed 200 minutes flips
          breach_class to NO_RESPONSE without any new arrival.
        test_recipe:
          setup:
            - "T1; P3 incident created 2026-08-01T00:00:00Z, triaged P3, never dispatched"
            - "DRAFT report for period [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z) generated at 03:00 (incident still pending: 180 < 240)"
            - "At 03:20 elapsed adjusted = 200 minutes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Eve", caller_phone: "555-0104", address_line: "30 Birch Ln", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P3" }
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/regulatory-reports"
              payload: { territory_id: "${terr_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z" }
              as: Supervisor
              captures: { rep_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:20:00Z" }
              as: SystemAdmin
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
              captures: { inc_v: "$.data.version" }
          trigger:
            - call: "POST /gas-ops/incidents/${inc_id}/reclassify-priority"
              payload: { new_priority: "P1", expected_incident_version: "${inc_v}", reason: "escalating caller volume" }
              as: Supervisor
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
            - call: "GET /gas-ops/regulatory-reports/${rep_id}"
              payload: {}
              as: Supervisor
          assert:
            - "GasIncident.${inc_id}.priority == P1"
            - "GasIncident.${inc_id}.threshold_minutes == 30"
            - "GasIncident.${inc_id}.adjusted_elapsed_seconds == 12000 (200 min, no pauses, no arrival)"
            - "GasIncident.${inc_id}.breach_class == NO_RESPONSE (12000 > 1800 with no arrival)"
            - "RegulatoryReport.${rep_id}.needs_regeneration == true"
            - "RegulatoryReport.${rep_id}.status == DRAFT (snapshot itself unchanged until regenerate)"
            - "RegulatoryReport.${rep_id}.pending_count == 1 (the incident was pending at generation time)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: incident_close_reopen_recurrence_cycle
        grounds:
          - state_machines.GasIncident.CLOSED_to_REOPENED
          - entities.GasIncident.fields.reopen_count
          - entities.GasIncident.fields.prior_segment_adjusted_seconds
        distinguishing_aspect: |
          Cyclic machine on GasIncident: CLOSED -> REOPENED -> TRIAGED -> ...
          -> CLOSED again, with the response clock restarting per segment and
          the prior segment archived — non-linear (cycle) on the incident
          entity, distinct from the RegulatoryReport amendment cycle.
        test_recipe:
          setup:
            - "T1; full first lifecycle: P2 call at 00:00, triaged 00:01, dispatched 00:02, arrived 00:20, reading, make-safe completed (leak_confirmed=false), all-clear, CLOSED at 01:00"
            - "At 2026-08-01T10:00:00Z (9 hours after closure, inside the 72h recurrence window) a new call arrives for the same address"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-02T00:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Fred", caller_phone: "555-0105", address_line: "44 Cedar St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:20:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/dispatches/${disp_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/atmospheric-readings"
              payload: { pct_lel: 1.0, co_ppm: 0, reading_context: "INSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/make-safe-actions"
              payload: { action_type: "VENTILATE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/make-safe/complete"
              payload: { leak_confirmed: false }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/dispatches/${disp_id}/clear"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/incidents/${inc_id}/close"
              payload: {}
              as: Supervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Fred", caller_phone: "555-0105", address_line: "44 Cedar St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { call2_class: "$.data.classification", call2_inc: "$.data.incident_id" }
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
          assert:
            - "Second call classification == RECURRENCE and incident_id == ${inc_id} (same incident, not a new one)"
            - "GasIncident.${inc_id}.lifecycle_status == REOPENED"
            - "GasIncident.${inc_id}.reopen_count == 1"
            - "GasIncident.${inc_id}.linked_call_count == 2"
            - "GasIncident.${inc_id}.prior_segment_adjusted_seconds == 1200 (00:00 -> 00:20 arrival, no pauses)"
            - "GasIncident.${inc_id}.response_clock_started_at == 2026-08-01T10:00:00Z (clock restarted)"
            - "GasIncident.${inc_id}.first_arrival_at == null"
            - "GasIncident.${inc_id}.make_safe_completed == false (reset for the new segment)"

      - name: report_submit_reject_regenerate_loop
        grounds:
          - state_machines.RegulatoryReport
          - entities.RegulatoryReport.fields.regeneration_count
        distinguishing_aspect: |
          Cyclic machine on RegulatoryReport (DRAFT -> SUBMITTED -> REJECTED ->
          DRAFT -> SUBMITTED -> ACCEPTED), a distinct entity from GasIncident;
          the loop is bounded only by regulator acceptance and each pass
          recomputes the snapshot with regeneration_count monotonically
          increasing.
        test_recipe:
          setup:
            - "T1; one closed P2 incident inside the period (fully compliant, 20-min adjusted response)"
            - "DRAFT report for [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-02T00:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Gail", caller_phone: "555-0106", address_line: "1 Walnut St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:20:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/dispatches/${disp_id}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/atmospheric-readings"
              payload: { pct_lel: 0.5, co_ppm: 0, reading_context: "INSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/make-safe/complete"
              payload: { leak_confirmed: false, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/dispatches/${disp_id}/clear"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_id}/close"
              payload: {}
              as: Supervisor
            - call: "POST /gas-ops/regulatory-reports"
              payload: { territory_id: "${terr_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z" }
              as: Supervisor
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "POST /gas-ops/regulatory-reports/${rep_id}/submit"
              payload: {}
              as: Supervisor
            - call: "POST /gas-ops/regulatory-reports/${rep_id}/reject"
              payload: { reason: "period boundary mismatch" }
              as: Regulator
            - call: "POST /gas-ops/regulatory-reports/${rep_id}/regenerate"
              payload: {}
              as: Supervisor
            - call: "POST /gas-ops/regulatory-reports/${rep_id}/submit"
              payload: {}
              as: Supervisor
            - call: "POST /gas-ops/regulatory-reports/${rep_id}/accept"
              payload: {}
              as: Regulator
            - call: "GET /gas-ops/regulatory-reports/${rep_id}"
              payload: {}
              as: Supervisor
          assert:
            - "After reject: status == REJECTED, reject_reason == 'period boundary mismatch'"
            - "After regenerate: status == DRAFT, regeneration_count == 1, needs_regeneration == false"
            - "Final status == ACCEPTED"
            - "RegulatoryReport.${rep_id}.incident_count == 1, determined_count == 1, compliant_count_adjusted == 1, compliance_rate_adjusted == 1.0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: duplicate_call_priority_escalation_cascade
        grounds:
          - state_machines.GasIncident
          - entities.EmergencyCall.fields.classification
          - entities.GasIncident.fields.linked_call_count
          - entities.PublicNotification.fields.origin
          - entities.RegulatoryReport.fields.needs_regeneration
        distinguishing_aspect: |
          Depth-3 cascade triggered by duplicate call intake: (1) EmergencyCall
          created with classification DUPLICATE and linked -> (2) the link
          mutates GasIncident (linked_call_count, auto-escalation P3->P1,
          threshold + breach re-eval) -> (3) the P1 escalation itself fires the
          AUTO_PRIORITY PublicNotification creation and marks the covering
          DRAFT report stale. Each hop is caused by the previous hop, not by
          the original POST.
        test_recipe:
          setup:
            - "T1; P3 incident (odor outside, no symptoms) created 2026-08-01T00:00:00Z, triaged P3, never dispatched"
            - "DRAFT report covering the period generated at 03:00"
            - "At 03:20 a second call for the same address reports symptoms"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Hank", caller_phone: "555-0107", address_line: "77 Maple Dr", city: "Springfield", territory_id: "${terr_id}", location_context: "OUTSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P3" }
              as: Dispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/regulatory-reports"
              payload: { territory_id: "${terr_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-02T00:00:00Z" }
              as: Supervisor
              captures: { rep_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:20:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Ivy", caller_phone: "555-0108", address_line: "77 Maple Dr", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: true, hissing_reported: false }
              as: Dispatcher
              captures: { call2_class: "$.data.classification", call2_inc: "$.data.incident_id" }
            - call: "GET /gas-ops/incidents/${inc_id}"
              payload: {}
              as: Supervisor
            - call: "GET /gas-ops/incidents/${inc_id}/public-notifications"
              payload: {}
              as: Supervisor
            - call: "GET /gas-ops/regulatory-reports/${rep_id}"
              payload: {}
              as: Supervisor
          assert:
            - "Second call classification == DUPLICATE and incident_id == ${inc_id}"
            - "GasIncident.${inc_id}.linked_call_count == 2"
            - "GasIncident.${inc_id}.priority == P1 (auto-escalated; never lowered)"
            - "GasIncident.${inc_id}.breach_class == NO_RESPONSE (200 min > 30 min threshold)"
            - "Notifications list length == 1; PublicNotification.origin == AUTO_PRIORITY, channel == PUBLIC_ALERT, status == DRAFT"
            - "RegulatoryReport.${rep_id}.needs_regeneration == true"

      - name: responsibility_finalization_work_order_budget_cascade
        grounds:
          - state_machines.ResponsibilityDetermination.DRAFT_to_FINAL
          - entities.RepairWorkOrder.fields.origin
          - entities.ServiceTerritory.fields.repair_reserved_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by determination finalization (a different
          trigger from call intake): (1) finalize flips DRAFT -> FINAL ->
          (2) the FINAL outcome auto-creates a RepairWorkOrder (OPEN,
          provisional 90000c for OUTSIDE_COMPANY x P2) -> (3) scheduling that
          order (made possible only by hop 2) reserves 90000c on the
          territory. Also asserts INSIDE_CUSTOMER does NOT create a work
          order and sets customer_referral_required instead.
        test_recipe:
          setup:
            - "T1; two P2 incidents A and B, both leak_confirmed=true after make-safe"
            - "A gets an OUTSIDE_COMPANY determination drafted by sup-1 and finalized by sup-2"
            - "B gets an INSIDE_CUSTOMER determination drafted by sup-1 and finalized by sup-2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/repair-crews"
              payload: { crew_code: "C1", territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { crew_id: "$.data.id" }
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Jack", caller_phone: "555-0109", address_line: "3 Ash Ct", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: true }
              as: Dispatcher
              captures: { inc_a: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_a}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_a}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_a: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:15:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/dispatches/${disp_a}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_a}/atmospheric-readings"
              payload: { pct_lel: 4.0, co_ppm: 10, reading_context: "INSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_a}/make-safe/complete"
              payload: { leak_confirmed: true, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Kim", caller_phone: "555-0110", address_line: "8 Ash Ct", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_b: "$.data.incident_id" }
            - call: "POST /gas-ops/incidents/${inc_b}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_b}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_b: "$.data.id" }
            - call: "POST /gas-ops/dispatches/${disp_b}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_b}/atmospheric-readings"
              payload: { pct_lel: 1.5, co_ppm: 5, reading_context: "INSIDE" }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "POST /gas-ops/incidents/${inc_b}/make-safe/complete"
              payload: { leak_confirmed: true, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
            - call: "GET /gas-ops/incidents/${inc_a}"
              payload: {}
              as: Supervisor
              captures: { inc_a_v: "$.data.version" }
            - call: "POST /gas-ops/incidents/${inc_a}/responsibility-determinations"
              payload: { responsibility: "OUTSIDE_COMPANY", basis: "METER_LOCATION", expected_incident_version: "${inc_a_v}" }
              as: Supervisor
              as_user_id: "sup-1"
              captures: { det_a: "$.data.id" }
            - call: "GET /gas-ops/incidents/${inc_b}"
              payload: {}
              as: Supervisor
              captures: { inc_b_v: "$.data.version" }
