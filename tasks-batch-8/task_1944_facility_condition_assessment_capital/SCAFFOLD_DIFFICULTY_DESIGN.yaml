            - "CapitalPlan.${plan_id}.total_programmed_cents == 0 after run B (recomputed from remaining FUNDED set)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Conflict pair state vs business_safety: an approve call on a DRAFT (never-submitted) plan
          made by the same user who would also violate segregation of duties must surface
          ERR_INVALID_STATE (priority 5) ahead of ERR_SEGREGATION_OF_DUTIES (priority 7).
        test_recipe:
          setup:
            - "Facility F, CapitalPlan P in DRAFT (no funded items needed since we never submit)"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Iota AB", contact_email: "i@iota.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Studio", address: "8 Pine St", gross_square_feet: 4000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 1, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /fca/capital-plans/${plan_id}/approve"
              payload: {}
              as: Approver
              as_user_id: "same-user-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE (state precondition priority 5 wins over the segregation-of-duties safety check at priority 7)"
            - "CapitalPlan.${plan_id}.status remains DRAFT; no side effects fired"
      - name: temporal_vs_constraint_on_deficiency_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Conflict pair business_safety vs business_temporal: a create with both a code violation at
          severity 2 (safety rule, priority 8) and recommended_year 2020 (temporal rule, priority 9)
          must surface ERR_CODE_SEVERITY_TOO_LOW — a different error-category pair than
          state-vs-safety.
        test_recipe:
          setup:
            - "Facility F, one ACTIVE AssetSystem"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Kappa Oy", contact_email: "k@kappa.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Hall", address: "12 Birch Ave", gross_square_feet: 7000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ENVELOPE", name: "Curtain Wall", install_year: 2000, design_life_years: 30, replacement_cost_cents: 120000000, condition_rating: 2 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
          trigger:
            - call: "POST /fca/deficiencies"
