      - name: alert_creation_threshold_38_vs_53_accumulation
        claim_type: correct_result
        grounds: [calculations.alert_score]
        distinguishing_aspect: "OPEN_THRESHOLD 40.00 gates creation on the running candidate sum: three small events accumulate to 38.0 (no alert), the fourth pushes to 53.0 and the alert is created containing ALL FOUR events (not just the crossing one)."
        test_recipe:
          setup: ["Store S1; employee E1; events posted in order: NO_SALE_DRAWER 4000 (6), PRICE_OVERRIDE 3000 (8), SWEETHEART_SCAN 20000 (24) -> cumulative 38.0"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S050", name: "Store 50", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
