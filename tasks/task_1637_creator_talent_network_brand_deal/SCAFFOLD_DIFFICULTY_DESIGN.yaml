            - "activation at exactly 2026-09-04 succeeds (half-open adjacency, end == start is not a conflict)"
            - "Deal.${d2}.exclusive_window_start == 2026-09-04T00:00:00Z"

      - name: deliverable_publish_min_gap
        grounds:
