        grounds: [state_machines.TrackRightsAgreement.ACTIVE_to_TERMINATED]
        excluded_because:
          difficulty_instance: transitive_cascade / agreement_terminate_depth4_chain
          rationale: "The 4-hop terminate cascade is asserted end-to-end by the named difficulty instance."
      - name: derived_field_reconciliation_covered_by_difficulty
        claim_type: derived_field_reconciliation
        grounds: [calculations.class_seat_availability]
        excluded_because:
          difficulty_instance: compensating_invariant / seat_count_confirm_cancel_conservation
          rationale: "Availability recomputation after CONFIRM and after CANCEL is asserted with literal values (5 -> 3 -> 5) by the named difficulty instance."

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: confirm_response_contains_final_computed_fields
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.fare_quote]
        distinguishing_aspect: "Immediate consistency: the CONFIRM response itself carries status CONFIRMED plus the computed unit_fare_cents/total_price_cents/paid_cents and the assigned dining table - no re-read required."
        test_recipe:
          setup: ["Published REGULAR excursion with DINING car; one HELD DINING booking party 2 EARLY"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "DIN-1", stock_type: "DINING_CAR", seat_capacity: 16, table_count: 4 }, as: Mechanic, captures: { din: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Immediate Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${din}", class_code: "DINING", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Chef Ana", role: "CHEF", is_volunteer: false }, as: CrewManager, captures: { cm_k: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr One", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s1: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Svr Two", role: "SERVER", is_volunteer: false }, as: CrewManager, captures: { cm_s2: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_k}", position: "CHEF" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_s1}", position: "SERVER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_s2}", position: "SERVER" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "imm@x.com", class_code: "DINING", party_size: 2, dining_service: "EARLY" }, as: StationAgent, captures: { b: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/bookings/${b}/events", payload: { event_type: "CONFIRM" }, as: StationAgent, captures: { st: "$.data.status", unit: "$.data.unit_fare_cents", total: "$.data.total_price_cents", paid: "$.data.paid_cents", table: "$.data.dining_table_number" } }
          assert:
            - "${st} == CONFIRMED"
            - "${unit} == 15000, ${total} == 30000, ${paid} == 30000 (REGULAR surge 10000)"
            - "${table} == 1 (selector result visible in the same response)"

  # =========================================================================
  # Section: state_machines (operate-day happy path, appended)
  # =========================================================================
  - section: state_machines_operate_day
    instances:
      - name: operate_day_happy_path_board_checkin_operate
        claim_type: valid_transition
        grounds: [state_machines.Excursion, state_machines.Booking, state_machines.OperatingSlot, state_machines.CrewAssignment]
        distinguishing_aspect: "On the service date the full happy path fires: BEGIN_BOARDING (PUBLISHED->BOARDING), CHECK_IN (CONFIRMED->CHECKED_IN), MARK_OPERATED (BOARDING->OPERATED) with slot RESERVED->CONSUMED, checked-in booking -> COMPLETED, non-checked-in booking -> NO_SHOW, crew -> COMPLETED."
        test_recipe:
          setup: ["Published REGULAR excursion on 2026-10-15 with two CONFIRMED COACH bookings (party 1 each); clock advanced to the service date morning"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Operate Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "go1@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b1: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "go2@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b2: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b2}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T08:30:00Z" }, as: OperationsManager }
          trigger:
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "BEGIN_BOARDING" }, as: Scheduler, captures: { st_board: "$.data.status" } }
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CHECK_IN" }, as: StationAgent, captures: { st_ci: "$.data.status" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "MARK_OPERATED" }, as: Scheduler, captures: { st_op: "$.data.status" } }
            - { call: "GET /railroad/slots/${slot}", as: Scheduler, captures: { slot_st: "$.data.status" } }
            - { call: "GET /railroad/bookings/${b1}", as: StationAgent, captures: { b1_st: "$.data.status" } }
            - { call: "GET /railroad/bookings/${b2}", as: StationAgent, captures: { b2_st: "$.data.status" } }
            - { call: "GET /railroad/crew-assignments?excursion_id=${ex}", as: CrewManager, captures: { ca_st: "$.data[0].status" } }
          assert:
            - "BEGIN_BOARDING on the service date succeeds: ${st_board} == BOARDING"
            - "CHECK_IN while BOARDING succeeds: ${st_ci} == CHECKED_IN"
            - "MARK_OPERATED: ${st_op} == OPERATED"
            - "slot consumed: ${slot_st} == CONSUMED"
            - "checked-in booking completed: ${b1_st} == COMPLETED"
            - "booking never checked in: ${b2_st} == NO_SHOW with refund_cents == 0"
            - "crew assignments completed: ${ca_st} == COMPLETED"
