  - section: cross_cutting_layers
    instances:
      - name: occ_analysis_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[analysis-create-stale-account]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "First create with the observed version succeeds (and supersedes nothing); a second create carrying the SAME now-stale expected_escrow_account_version is rejected 412 instead of silently superseding the cycle it never saw."
        test_recipe:
          setup: ["Setup A account ACTIVE; client observed version v before either create"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-OCC-1", borrower_name: "Occ Create", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "GET /servicing/escrow-accounts/${acct_id}", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_v: $.data.version } }
          trigger:
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${acct_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/analyses", payload: { analysis_year: 2028, projection_start_date: "2027-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${acct_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { err: $.data.error_id } }
          assert:
            - "First create succeeds: EscrowAnalysisCycle.${ana_id}.status == DRAFT"
            - "err == ERR_STALE_VERSION (http 412) for the second create carrying the pre-first-create version"
            - "EscrowAccount.${acct_id}.version was incremented by the first create"

      - name: occ_disbursement_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[disbursement-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the version observed at creation succeeds and bumps version; a second PATCH replaying the creation version is 412 — deterministic stale-write rejection with two strictly sequential requests."
        test_recipe:
          setup: ["Setup A account ACTIVE; disbursement created (version captured at create)"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-OCC-2", borrower_name: "Occ Patch", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 30000, due_date: "2026-12-20", scheduled_release_date: "2026-12-01" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id, disb_v: $.data.version } }
          trigger:
            - { call: "PATCH /servicing/disbursements/${disb_id}", payload: { expected_disbursement_version: "${disb_v}", amount_cents: 31000 }, as: DisbursementProcessor, as_user_id: "dp_1" }
            - { call: "PATCH /servicing/disbursements/${disb_id}", payload: { expected_disbursement_version: "${disb_v}", amount_cents: 32000 }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { err: $.data.error_id } }
          assert:
            - "First PATCH succeeds: Disbursement.${disb_id}.amount_cents == 31000 and version == ${disb_v} + 1"
            - "err == ERR_STALE_VERSION (http 412) for the replayed stale version"
            - "Disbursement.${disb_id}.amount_cents == 31000 (stale write not applied)"

      - name: clock_default_before_any_set
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z — never wall-clock — making every deadline deterministic."
        test_recipe:
          setup: ["empty DB; no clock call has ever run"]
          setup_api_calls: []
          trigger:
            - { call: "GET /_clock/current_utc", payload: {}, as: ComplianceOfficer, as_user_id: "co_1", captures: { now: $.data.current_utc } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { prev: $.data.previous_utc } }
          assert:
            - "now == 2026-08-01T00:00:00Z"
            - "prev == 2026-08-01T00:00:00Z (first set reports the default as previous)"

      - name: payee_expiry_boundary_sweep
        claim_type: scheduled_actions
        grounds: [entities.Payee.fields.verification_expires_at, state_machines.Payee]
        distinguishing_aspect: "Verified 2026-08-01 -> expires 2027-08-01: at exactly 2027-08-01 the payee is still VERIFIED (strictly-after rule); at 2027-08-02 the sweep flips it EXPIRED and its SCHEDULED disbursement cascades to BLOCKED."
        test_recipe:
          setup: ["Setup A account ACTIVE; payee verified at 2026-08-01; disbursement SCHEDULED (release 2027-09-01)"]
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
            - { call: "POST /servicing/payees/${pay_id}/verify", payload: {}, as: PayeeVerifier, as_user_id: "pv_1" }
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-SWP-1", borrower_name: "Ex Piry", principal_balance_cents: 30000000, monthly_pi_cents: 180000, closing_date: "2026-08-01", escrow_required: true }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/escrow-account", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1", captures: { acct_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/line-items", payload: { payee_id: "${pay_id}", expense_type: "PROPERTY_TAX", expected_annual_amount_cents: 240000, installments_per_year: 2, first_due_date: "2026-12-15" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { li_id: $.data.id } }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/activate", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/escrow-accounts/${acct_id}/disbursements", payload: { line_item_id: "${li_id}", payee_id: "${pay_id}", amount_cents: 30000, due_date: "2027-09-20", scheduled_release_date: "2027-09-01" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { disb_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          assert:
            - "At 2027-08-01: Payee.${pay_id}.verification_status == VERIFIED and verification_expires_at == 2027-08-01"
            - "At 2027-08-02: Payee.${pay_id}.verification_status == EXPIRED"
            - "Cascade: Disbursement.${disb_id}.status == BLOCKED"

      - name: tax_record_due_soon_delinquent_sweep
        claim_type: scheduled_actions
        grounds: [state_machines.TaxMonitoringRecord]
        distinguishing_aspect: "MONITORING -> DUE_SOON at exactly due-30 days (2026-08-11 for due 2026-09-10); -> DELINQUENT once current date passes due + grace (2026-09-16 with grace 5); delinquent_since == 2026-09-16."
        test_recipe:
          setup: ["Loan LN-SWP-2 ACTIVE (escrow false); tax record due 2026-09-10, grace 5"]
          setup_api_calls:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-SWP-2", borrower_name: "Due Soon", principal_balance_cents: 22000000, monthly_pi_cents: 140000, closing_date: "2026-07-01", escrow_required: false }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/loans/${loan_id}/tax-monitoring-records", payload: { parcel_number: "P-9", tax_year: 2026, installment_sequence: 1, amount_due_cents: 300000, due_date: "2026-09-10", grace_period_days: 5, monthly_penalty_rate_bps: 150, penalty_method: "SIMPLE" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { rec_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1" }
          assert:
            - "At 2026-08-10 (due-31 days): status == MONITORING"
            - "At 2026-08-11 (exactly due-30): status == DUE_SOON"
            - "At 2026-09-16 (past due+grace): status == DELINQUENT and delinquent_since == 2026-09-16"

  - section: consistency_model
    instances:
