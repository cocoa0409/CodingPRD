            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { v1_id: $.data.id, plan_v3: $.data.version }
            - call: "POST /shot-visits/${v1_id}/record-reaction"
              payload: { reaction_grade: "SYSTEMIC", epinephrine_administered: true }
              as: Nurse
              captures: { plan_v4: $.data.version }
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v4}" }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_PLAN_HELD (state priority 6 beats any business_temporal priority 12 check)."

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
