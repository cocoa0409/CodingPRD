            - "RefundRelease of ReturnLine.${line_id} has release_eligible_at == 2026-08-03T00:00:00Z (executed_at 2026-08-01T00:00:00Z plus 48 hours)"
            - "The response is HTTP 403 with ${err_id} == ERR_SEGREGATION_OF_DUTIES"
            - "${err_id} != ERR_REFUND_HOLD_ACTIVE — priority 36 outranks priority 58 even though the hold has not elapsed"
            - "ReturnLine.${line_id}.financial_state is still RELEASE_PENDING, released_at is null, and no REFUND_DEBIT ShrinkLedgerEntry exists"
            - "Client.${c_id}.settlement_balance_cents == 5461 — only the RECOVERY_CREDIT from the executed lot (net 5904 less round_half_up(5904 * 0.075) == 443)"

  # ===================================================================== #
  # RULE 6 — boundary_precision_check                                     #
  # Metric 1: liquidation-floor value ratio   (POST .../grade)             #
  # Metric 2: cumulative refund exposure      (POST .../release-refund)    #
  # Metric 3: package weight ratio            (POST /receipts)             #
  # ===================================================================== #
  - rule_id: boundary_precision_check
    instances:
      - name: liquidation_floor_exact_tie_liquidates_one_cent_more_donates
        grounds:
          - calculations.disposition_decision
          - calculations.return_line_recovery_value
          - entities.Client.fields.liquidation_floor_pct
          - endpoints[POST /return-lines/{return_line_id}/grade]
        distinguishing_aspect: |
          The metric is rule D6's scaled value ratio and the endpoint is POST
          /return-lines/{id}/grade. At declared_value_cents 30000 the comparison is an exact tie
          (12000 * 100 == 1200000 == 30000 * 1 * 40) and the >= makes it LIQUIDATE; at 30001 the
          right-hand side becomes 1200040 while the provisional recovery still rounds to 12000, so
          D6 fails by 40 scaled units and the line falls through to D7 DONATE. The other two
          boundary instances probe a cumulative money cap and a package weight ratio through
          different endpoints.
        test_recipe:
          setup:
            - "Client CLBOUND1: SL_STANDARD, restock_grade_floor A, liquidation_floor_pct 0.40, donation_allowed true, fraud_tolerance_cents 100000000, max_refund_exposure_cents 100000000."
            - "CatalogItem TIE-30000 at declared_value_cents 30000 and CatalogItem TIE-30001 at declared_value_cents 30001, both unit_weight_grams 1200, hazard_class NONE, not refurb_eligible, regulated_flag false."
            - "One RMA with one authorized line per item (quantity 1, reason BUYER_REMORSE so the reason penalty is 0.00), both received in one Receipt weighing exactly 200 + 1200 + 1200 == 2600 grams."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Boundary One Client", client_code: "CLBOUND1", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.40, fraud_tolerance_cents: 100000000, donation_allowed: true, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "TIE-30000", description: "Exact tie item", declared_value_cents: 30000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_a: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "TIE-30001", description: "One cent above the tie", declared_value_cents: 30001, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_b: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1013", customer_reference: "CUST-13", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_a}", authorized_quantity: 1, reason_code: "BUYER_REMORSE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_a: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_b}", authorized_quantity: 1, reason_code: "BUYER_REMORSE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_b: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-13", gross_weight_grams: 2600 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_a}", quantity: 1, reason_code: "BUYER_REMORSE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_a: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_b}", quantity: 1, reason_code: "BUYER_REMORSE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_b: $.data.id }
          trigger:
            - call: "POST /return-lines/${line_a}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
            - call: "POST /return-lines/${line_b}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
          assert:
            - "ReturnLine.${line_a}.recovery_value_cents == 12000 (round_half_up(30000 * 0.40 * 1.00))"
            - "ReturnLine.${line_a}.disposition == LIQUIDATE — 12000 * 100 == 1200000 is exactly equal to 30000 * 1 * round_half_up(0.40 * 100) == 1200000 and D6 uses >="
            - "ReturnLine.${line_b}.recovery_value_cents == 12000 as well (round_half_up(30001 * 0.40) == 12000, since 12000.4 rounds down)"
            - "ReturnLine.${line_b}.disposition == DONATE — 1200000 < 30001 * 1 * 40 == 1200040, so D6 misses by 40 scaled units and D7 applies (donation_allowed true, grade C is not SCRAP, regulated_flag false)"
            - "Both lines have disposition_state == DISPOSITION_ASSIGNED and financial_state == HOLD_PENDING_DISPOSITION"

      - name: refund_exposure_cap_exact_equality_allowed_one_cent_over_rejected
        grounds:
          - validations[priority 61 ERR_REFUND_EXCEEDS_EXPOSURE_CAP]
          - entities.Client.fields.max_refund_exposure_cents
          - calculations.refund_amounts
          - endpoints[POST /return-lines/{return_line_id}/release-refund]
          - errors.ERR_REFUND_EXCEEDS_EXPOSURE_CAP
        distinguishing_aspect: |
          The metric is the client's CUMULATIVE released-refund exposure in cents and the endpoint is
          POST /return-lines/{id}/release-refund. The first release lands on exactly the cap
          (0 already released + 18000 == max_refund_exposure_cents 18000) and priority 61 permits it
          because the check is "must not exceed"; the second release adds a single cent
          (18000 + 1 == 18001 > 18000) and is rejected. Unlike the liquidation-floor instance this
          boundary is a running aggregate that no single request can compute on its own, and unlike
          the weight instance it is measured in money and probed through a refund endpoint.
        test_recipe:
          setup:
            - "Client CLCAP: SL_STANDARD, restock_grade_floor A, refund_hold_hours 48, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, max_refund_exposure_cents 18000 — the cap is set to exactly the first line's net refund."
            - "CatalogItem WIDGET-1 (declared_value_cents 20000, unit_weight_grams 1200) and CatalogItem PENNY-1 (declared_value_cents 1, unit_weight_grams 1) — PENNY-1 exists purely to add one cent of exposure."
            - "An AUCTION channel with fee_pct 0.12, accepted_grades A/B/C/D, min_lot_value_cents 0, concurrent_lot_capacity 5, price_index_pct 1.0."
            - "One RMA with two lines: WIDGET-1 quantity 1 reason DEFECTIVE (graded C -> LIQUIDATE) and PENNY-1 quantity 1 reason WRONG_ITEM (graded A -> RESTOCK). Receipt weighs exactly 200 + 1200 + 1 == 1401 grams."
            - "Both lines are dispositioned and executed at their frozen prices, then the clock is advanced past both 48-hour holds."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Capped Client", client_code: "CLCAP", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 18000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_w: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "PENNY-1", description: "One cent probe item", declared_value_cents: 1, unit_weight_grams: 1, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 0, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_p: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Auction Cap", channel_code: "AUC1", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1014", customer_reference: "CUST-14", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_w}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_w: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_p}", authorized_quantity: 1, reason_code: "WRONG_ITEM" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_p: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-14", gross_weight_grams: 1401 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_w}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_w: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_p}", quantity: 1, reason_code: "WRONG_ITEM" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_p: $.data.id }
            - call: "POST /return-lines/${line_w}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { ver_w: $.data.version }
            - call: "POST /return-lines/${line_p}/grade"
              payload: { condition_grade: "A" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { ver_p: $.data.version }
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line_w}", expected_return_line_version: "${ver_w}", channel_id: "${ch_id}" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { ord_w: $.data.id }
            - call: "POST /disposition-orders/${ord_w}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${ord_w}/execute"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line_p}", expected_return_line_version: "${ver_p}" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { ord_p: $.data.id }
            - call: "POST /disposition-orders/${ord_p}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${ord_p}/execute"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /return-lines/${line_w}/release-refund"
              payload: {}
              as: RefundAnalyst
              as_user_id: "u_analyst"
            - call: "POST /return-lines/${line_p}/release-refund"
              payload: {}
              as: RefundAnalyst
              as_user_id: "u_analyst"
          assert:
            - "The WIDGET-1 release returns 200 with net_refund_cents == 18000 (gross 20000 - round_half_up(20000 * 0.10) == 2000) and financial_state REFUNDED — cumulative released exposure is now exactly 18000, equal to max_refund_exposure_cents, and priority 61 allows exact equality"
            - "The PENNY-1 release returns 409 ERR_REFUND_EXCEEDS_EXPOSURE_CAP — its net_refund_cents is 1 (gross 1, restocking_fee_pct 0.00 from WRONG_ITEM 0.00 + SL_STANDARD 0.00 + grade A 0.00 + late 0.00, fee 0) and 18000 + 1 == 18001 exceeds 18000 by one cent"
            - "ReturnLine.${line_p}.financial_state is still RELEASE_PENDING and no REFUND_DEBIT ShrinkLedgerEntry exists for it"
            - "Client.settlement_balance_cents == -12538 — the two RECOVERY_CREDIT rows (5461 for the liquidated widget at frozen 7200, 1 for the restocked penny) minus the single 18000 REFUND_DEBIT; this is above -18000, so the client is still ACTIVE and the rejection is the cap rule alone, not a suspension"

      - name: empty_box_weight_threshold_exact_sixty_percent_not_suspected
        grounds:
          - calculations.receipt_expected_weight
          - entities.Receipt.fields.empty_box_suspected
          - entities.Receipt.fields.expected_weight_grams
          - endpoints[POST /receipts]
        distinguishing_aspect: |
          The metric is the package weight ratio in integer grams and the endpoint is POST /receipts.
          Against an expectation of 1400 grams the threshold product is 1400 * 60 == 84000: a gross
          weight of 840 gives 840 * 100 == 84000 which is NOT strictly less, so empty_box_suspected
          is false, while 839 gives 83900 < 84000 and flips it to true. Neither the liquidation-floor
          instance (a value ratio at grading) nor the exposure-cap instance (a cumulative money
          total at refund release) touches weight or the receipt endpoint.
        test_recipe:
          setup:
            - "Client CLWEIGH with default rules; CatalogItem HEAVY-1 at unit_weight_grams 1200 and declared_value_cents 20000."
            - "One RMA with a single authorized line of quantity 1, so receipt_expected_weight is 200 tare + 1200 == 1400 grams for every receipt on it."
            - "Two receipts are scanned against that same RMA (both permitted: receipts may be created against ISSUED or PARTIALLY_RECEIVED, and the expectation is computed from authorized_quantity so it is identical for both)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Weight Boundary Client", client_code: "CLWEIGH", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "HEAVY-1", description: "Twelve hundred gram item", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1015", customer_reference: "CUST-15", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "BUYER_REMORSE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-15A", gross_weight_grams: 840 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-15B", gross_weight_grams: 839 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
          assert:
            - "Both receipts return 201 with expected_weight_grams == 1400 (200 + 1200 * 1)"
            - "The 840-gram receipt has empty_box_suspected == false — 840 * 100 == 84000 is not strictly less than 1400 * 60 == 84000, so a package at exactly 60 percent of expectation is trusted"
            - "The 839-gram receipt has empty_box_suspected == true — 83900 < 84000 by one hundred scaled units"
            - "ReturnAuthorization.${rma_id}.status == PARTIALLY_RECEIVED after both scans (no line was scanned, so nothing was received)"

  # ===================================================================== #
  # RULE 7 — cross_entity_state_dependency                                #
  # Pair 1: DispositionOrder  <- SecondaryMarketChannel.status             #
  # Pair 2: Receipt           <- Client.status                            #
  # Pair 3: ReturnAuthorization <- sibling ReturnLine.disposition_state    #
  # ===================================================================== #
  - rule_id: cross_entity_state_dependency
    instances:
      - name: disposition_order_execution_blocked_by_paused_channel
        grounds:
          - validations[priority 27 ERR_CHANNEL_PAUSED]
          - state_machines.SecondaryMarketChannel
          - state_machines.DispositionOrder.APPROVED_to_EXECUTED
          - endpoints[POST /secondary-market-channels/{channel_id}/pause]
          - endpoints[POST /disposition-orders/{disposition_order_id}/execute]
          - errors.ERR_CHANNEL_PAUSED
        distinguishing_aspect: |
          The dependent entity is DispositionOrder and the governing entity is SecondaryMarketChannel:
          an APPROVED order that is internally perfectly executable is refused solely because the
          channel it was routed to moved ACTIVE -> PAUSED after approval, and the identical request
          succeeds once the channel is resumed. Neither of the other two pairs involves a channel —
          they are Receipt-under-Client and ReturnAuthorization-under-its-own-ReturnLines.
        test_recipe:
          setup:
            - "Client CLXCHAN (restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, max_refund_exposure_cents 100000000) and CatalogItem WIDGET-1 at declared_value_cents 20000, unit_weight_grams 1200."
            - "An ACTIVE AUCTION channel (fee_pct 0.12, accepted_grades A/B/C/D, min_lot_value_cents 0, concurrent_lot_capacity 5)."
            - "One line received (receipt weighs exactly 1400 grams) and graded C, which gives provisional recovery 7200 and disposition LIQUIDATE; a disposition order is proposed on that channel and approved while the channel is still ACTIVE."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Cross Channel Client", client_code: "CLXCHAN", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Alpha Auction", channel_code: "AUC1", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
