  - rule_id: transitive_cascade
    instances:

      - name: segmentation_failure_five_link_scope_cascade
        grounds:
          - state_machines.NetworkSegment.TEST_PLANNED_to_FAILED
          - state_machines.SamplingPlan.ACTIVE_to_STALE
          - entities.NetworkSegment.fields.effective_class
          - entities.SystemComponent.fields.scope_class
          - entities.Engagement.fields.cde_component_count
          - entities.Engagement.fields.active_plan_stale
          - calculations.engagement_posture
        distinguishing_aspect: |
          One FAIL verdict on STORE-POS propagates through five distinct entity hops without any further
          API call: (1) the segment row itself, (2) its descendant segment STORE-BACKOFFICE whose
          effective_class flips although its own segment_class does not, (3) all five components hanging
          off that two-segment subtree, (4) the engagement's four component counters plus the ACTIVE
          SamplingPlan which is driven to STALE, and (5) the derived posture which becomes RESTRICTED -
          each link is caused by the previous link, not by the trigger directly.
