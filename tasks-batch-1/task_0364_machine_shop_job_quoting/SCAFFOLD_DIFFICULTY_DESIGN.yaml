# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Machine Shop / Job Shop Quoting & Production
# 9 rule_ids × 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_estimate_vs_workorder_actual_cost_diverge
        grounds:
          - calculations.quote_estimate_cost
          - calculations.work_order_actual_cost
          - state_machines.Quote.DRAFT_to_PRICED
          - state_machines.RoutingOp.SCHEDULED_to_COMPLETED
          - entities.Quote.fields.extended_cost_cents
          - entities.WorkOrder.fields.actual_cost_cents
        distinguishing_aspect: |
          The two variants operate on DIFFERENT entity domains: ESTIMATE is cost
          accounting on Quote (estimated_cycle_min over PartLine.quantity, scrap
          markup, margin tier); ACTUAL is realized cost on WorkOrder
          (actual_cycle_min over qty_started, true lot unit cost, no markup, no
          margin) — for the same job the two numbers differ (59750 vs 66220).
        test_recipe:
          setup:
            - "RFQ SUBMITTED with one PartLine qty=10 AL_6061 STANDARD."
            - "Quote PRICED then APPROVED: extended_cost_cents=59750, quoted_unit_price_cents=7469."
            - "WorkOrder qty_started=11, material allocated FIFO (4 of lot@1400c + 7 of lot@1500c), RELEASED."
            - "Two routing ops scheduled and completed: op1 MILL_3AX actual 14.0 min, op2 LATHE actual 6.0 min."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Acme", customer_id: "CUST-1", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-100", drawing_rev: "C", material_spec: "AL_6061", quantity: 10, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 1500, scrap_allowance_pct: 5 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 12.5, setup_fee_cents: 8000 }
              as: Estimator
              captures: { op1_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 2, machine_class: "LATHE", estimated_cycle_min: 6.0, setup_fee_cents: 4500 }
              as: Estimator
              captures: { op2_id: $.data.id }
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
              captures: { q_after: $.data.status }
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-A", qty_received: 4, unit_cost_cents: 1400, received_at: "2026-06-01T00:00:00Z" }
              as: MaterialController
              captures: { lotA_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-B", qty_received: 10, unit_cost_cents: 1500, received_at: "2026-06-02T00:00:00Z" }
              as: MaterialController
              captures: { lotB_id: $.data.id }
            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 10, qty_started: 11 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ShopAdmin
            - call: "POST /machine-slots"
              payload: { machine_class: "MILL_3AX", machine_code: "VF2-01", routing_op_id: "${op1_id}", start_min: 0, end_min: 150 }
              as: Scheduler
            - call: "POST /machine-slots"
              payload: { machine_class: "LATHE", machine_code: "L-01", routing_op_id: "${op2_id}", start_min: 0, end_min: 80 }
              as: Scheduler
            - call: "POST /routing-ops/${op1_id}/complete"
              payload: { actual_cycle_min: 14.0 }
              as: ShopAdmin
            - call: "POST /routing-ops/${op2_id}/complete"
              payload: { actual_cycle_min: 6.0 }
              as: ShopAdmin
          trigger:
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: ShopAdmin
              captures: { actual: $.data.actual_cost_cents }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: Estimator
              captures: { estimate: $.data.extended_cost_cents }
          assert:
            - "Quote.${q_id}.extended_cost_cents == 59750"
            - "WorkOrder.${wo_id}.actual_cost_cents == 66220"
            - "WorkOrder.${wo_id}.actual_cost_cents != Quote.${q_id}.extended_cost_cents"

      - name: shipment_penalty_vs_inspection_yield_independent_subjects
        grounds:
          - calculations.shipment_on_time_and_penalty
          - calculations.first_pass_yield
          - state_machines.Shipment.SHIPPED_to_VOIDED
          - state_machines.Inspection.OPEN_to_DISPOSITIONED
          - entities.Shipment.fields.late_penalty_cents
          - entities.Inspection.fields.first_pass_yield_pct
        distinguishing_aspect: |
          Two valid metrics on different entity domains: liquidated-damages
          penalty on Shipment (a capped monetary threshold function of days_late)
          versus first-pass-yield ratio on Inspection (accepted/inspected
          percentage) — neither shares inputs nor entity with the other.
        test_recipe:
          setup:
            - "WorkOrder IN_PROCESS with qty_in_process=10 (qty_started=10, released)."
            - "An OPEN Inspection on the WO with mode FINAL ready to disposition 10 parts: 9 accept, 1 scrap."
            - "Later a Shipment of 9 parts shipped 3 days late vs promised."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Beta", customer_id: "CUST-2", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-200", drawing_rev: "A", material_spec: "AL_6061", quantity: 10, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 1500, scrap_allowance_pct: 5 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 12.5, setup_fee_cents: 8000 }
              as: Estimator
              captures: { op1_id: $.data.id }
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-C", qty_received: 10, unit_cost_cents: 1500, received_at: "2026-06-01T00:00:00Z" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 10, qty_started: 10 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ShopAdmin
            - call: "POST /machine-slots"
              payload: { machine_class: "MILL_3AX", machine_code: "VF2-02", routing_op_id: "${op1_id}", start_min: 0, end_min: 150 }
              as: Scheduler
            - call: "POST /inspection-stations"
              payload: { name: "CMM-A", supports_mode: "ALL", buffer_min: 15 }
              as: Inspector
              captures: { st_id: $.data.id }
            - call: "POST /inspections"
              payload: { work_order_id: "${wo_id}", inspection_station_id: "${st_id}", mode: "FINAL", window_start_min: 200, window_end_min: 260 }
              as: Inspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/disposition"
              payload: { qty_inspected: 10, qty_accepted: 9, qty_rework: 0, qty_scrap: 1 }
              as: Inspector
              captures: { fpy: $.data.first_pass_yield_pct }
            - call: "POST /shipments"
              payload: { work_order_id: "${wo_id}", qty_shipped: 9, promised_date: "2026-07-01T00:00:00Z", actual_ship_date: "2026-07-04T00:00:00Z" }
              as: ShopAdmin
              captures: { ship_id: $.data.id, pen: $.data.late_penalty_cents }
          assert:
            - "Inspection.${insp_id}.first_pass_yield_pct == 90.0"
            - "Shipment.${ship_id}.late_penalty_cents == 1350"
            - "Shipment.${ship_id}.on_time == false"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_labor_round_per_op_then_sum_mode_b
        grounds:
          - calculations.quote_estimate_cost
          - state_machines.Quote.DRAFT_to_PRICED
          - entities.RoutingOp.fields.estimated_cycle_min
          - entities.Quote.fields.extended_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: two LATHE ops each
          0.75 min * 150 c/min = 112.5 c. Round-per-op-then-sum = 113+113 = 226;
          sum-then-round would be round(225.0) = 225. The scaffold pins
          round-per-op-then-sum, so extended_cost_cents == 226, not 225.
        test_recipe:
          setup:
            - "RFQ SUBMITTED, PartLine qty=1, AL_6061."
            - "Quote with material_unit_cost_cents=0, scrap_allowance_pct=0, two LATHE ops cyc 0.75 setup 0."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "RoundCo", customer_id: "CUST-3", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-R", drawing_rev: "A", material_spec: "AL_6061", quantity: 1, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 0, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "LATHE", estimated_cycle_min: 0.75, setup_fee_cents: 0 }
              as: Estimator
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 2, machine_class: "LATHE", estimated_cycle_min: 0.75, setup_fee_cents: 0 }
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { ext: $.data.extended_cost_cents, price: $.data.quoted_price_cents }
          assert:
            - "Quote.${q_id}.extended_cost_cents == 226"
            - "Quote.${q_id}.margin_pct == 35"
            - "Quote.${q_id}.quoted_price_cents == 305"

      - name: lot_waterfall_fifo_three_input_nonlinear_mode_a
        grounds:
          - calculations.lot_waterfall_allocation
          - state_machines.WorkOrder.PLANNED_to_RELEASED
          - entities.MaterialLot.fields.qty_remaining
          - entities.LotAllocation.fields.qty_allocated
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear interaction: allocation depends on
          (qty_started, per-lot qty_remaining, received_at ordering) via nested
          min() across an ordered bucket list. Need 11 from lots [4@earlier,
          10@later] => draw 4 then min(7,10)=7; first lot depletes, second keeps
          3 — different draws than any single-lot or sum-only formula.
        test_recipe:
          setup:
            - "WorkOrder PLANNED, qty_started=11, PartLine spec AL_6061."
            - "Two AVAILABLE AL_6061 lots: lotA received 2026-06-01 qty 4, lotB received 2026-06-02 qty 10."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Waterfall", customer_id: "CUST-4", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-W", drawing_rev: "A", material_spec: "AL_6061", quantity: 10, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 1500, scrap_allowance_pct: 5 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 12.5, setup_fee_cents: 8000 }
              as: Estimator
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-A", qty_received: 4, unit_cost_cents: 1400, received_at: "2026-06-01T00:00:00Z" }
              as: MaterialController
              captures: { lotA_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-B", qty_received: 10, unit_cost_cents: 1500, received_at: "2026-06-02T00:00:00Z" }
              as: MaterialController
              captures: { lotB_id: $.data.id }
            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 10, qty_started: 11 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
            - call: "GET /material-lots/${lotA_id}"
              payload: {}
              as: MaterialController
              captures: { a_rem: $.data.qty_remaining, a_status: $.data.status }
            - call: "GET /material-lots/${lotB_id}"
              payload: {}
              as: MaterialController
              captures: { b_rem: $.data.qty_remaining }
          assert:
            - "MaterialLot.${lotA_id}.qty_remaining == 0"
            - "MaterialLot.${lotA_id}.status == DEPLETED"
            - "MaterialLot.${lotB_id}.qty_remaining == 3"
            - "WorkOrder.${wo_id}.material_allocated == true"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_reject_reopen_revision_cycle
        grounds:
          - state_machines.Quote.PRICED_to_REJECTED
          - state_machines.Quote.REJECTED_to_DRAFT
          - state_machines.Quote.DRAFT_to_PRICED
          - entities.Quote.fields.status
        distinguishing_aspect: |
          Cyclic shape on Quote: PRICED->REJECTED->DRAFT->PRICED is a true
          revision loop (back-edge REJECTED->DRAFT), distinct from any linear
          pipeline; reopening clears computed price fields then re-pricing
          re-derives them.
        test_recipe:
          setup:
            - "RFQ SUBMITTED, PartLine qty=2, Quote with one MILL_3AX op priced then rejected."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Loop", customer_id: "CUST-5", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-L", drawing_rev: "A", material_spec: "AL_6061", quantity: 2, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 1000, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 5.0, setup_fee_cents: 2000 }
              as: Estimator
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /quotes/${q_id}/reject"
              payload: { rejection_reason: "price too high" }
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/reopen"
              payload: {}
              as: Estimator
              captures: { reopened_status: $.data.status, cleared_ext: $.data.extended_cost_cents }
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { repriced_status: $.data.status, repriced_ext: $.data.extended_cost_cents }
          assert:
            - "Quote.${q_id}.status == PRICED"
            - "Quote.${q_id}.extended_cost_cents == 5800"
            - "Quote.${q_id}.quoted_price_cents == 7830"

      - name: workorder_inspection_branching_rework_scrap_accept
        grounds:
          - state_machines.Inspection.OPEN_to_DISPOSITIONED
          - state_machines.WorkOrder.IN_PROCESS_to_COMPLETED
          - entities.WorkOrder.fields.qty_rework_pending
          - entities.WorkOrder.fields.qty_scrapped
          - entities.WorkOrder.fields.qty_accepted
        distinguishing_aspect: |
          Branching fork on WorkOrder: a single disposition splits parts into
          three divergent buckets {accept→qty_accepted, rework→qty_rework_pending,
          scrap→qty_scrapped} each with its own side-effect; the WO only
          fork-JOINS to COMPLETED when qty_in_process==0 AND qty_rework_pending==0.
          Distinct entity from the Quote revision cycle above.
        test_recipe:
          setup:
            - "WorkOrder IN_PROCESS, qty_started=11, qty_in_process=11, AL_6061 STANDARD."
            - "One OPEN FINAL inspection ready to split 11 parts: 9 accept, 1 rework, 1 scrap."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Fork", customer_id: "CUST-6", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-F", drawing_rev: "A", material_spec: "AL_6061", quantity: 10, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 1500, scrap_allowance_pct: 5 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 12.5, setup_fee_cents: 8000 }
              as: Estimator
              captures: { op1_id: $.data.id }
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-F", qty_received: 11, unit_cost_cents: 1500, received_at: "2026-06-01T00:00:00Z" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 10, qty_started: 11 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ShopAdmin
            - call: "POST /machine-slots"
              payload: { machine_class: "MILL_3AX", machine_code: "VF2-03", routing_op_id: "${op1_id}", start_min: 0, end_min: 150 }
              as: Scheduler
            - call: "POST /inspection-stations"
              payload: { name: "CMM-F", supports_mode: "ALL", buffer_min: 15 }
              as: Inspector
              captures: { st_id: $.data.id }
            - call: "POST /inspections"
              payload: { work_order_id: "${wo_id}", inspection_station_id: "${st_id}", mode: "FINAL", window_start_min: 200, window_end_min: 260 }
              as: Inspector
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/disposition"
              payload: { qty_inspected: 11, qty_accepted: 9, qty_rework: 1, qty_scrap: 1 }
              as: Inspector
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: ShopAdmin
              captures: { wo_status: $.data.status, wip: $.data.qty_in_process, rwk: $.data.qty_rework_pending }
          assert:
            - "WorkOrder.${wo_id}.qty_accepted == 9"
            - "WorkOrder.${wo_id}.qty_rework_pending == 1"
            - "WorkOrder.${wo_id}.qty_scrapped == 1"
            - "WorkOrder.${wo_id}.qty_in_process == 0"
            - "WorkOrder.${wo_id}.status == IN_PROCESS"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: wo_cancel_cascade_depth3_alloc_lot_and_slot_op
        grounds:
          - state_machines.WorkOrder.RELEASED_to_CANCELLED
          - state_machines.RoutingOp.SCHEDULED_to_PLANNED
          - entities.LotAllocation.fields.status
          - entities.MaterialLot.fields.qty_remaining
          - entities.MachineSlot.fields.status
        distinguishing_aspect: |
          Depth-≥3 chain from WorkOrder cancel: (1) cancel sets WO->CANCELLED;
          (2) that voids the WO's ACTIVE LotAllocation; (3) the voided allocation
          restores qty_remaining on its MaterialLot which flips DEPLETED->AVAILABLE.
          A parallel limb (slot RELEASED -> RoutingOp reverts to PLANNED) is a
          second causal link, not a direct fan-out from cancel.
        test_recipe:
          setup:
            - "WorkOrder RELEASED, qty_started=4 fully allocated from a single lot that thereby DEPLETED, one op SCHEDULED via a BOOKED slot."
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Casc", customer_id: "CUST-7", requested_due_date: "2026-08-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-CA", drawing_rev: "A", material_spec: "SS_304", quantity: 4, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
