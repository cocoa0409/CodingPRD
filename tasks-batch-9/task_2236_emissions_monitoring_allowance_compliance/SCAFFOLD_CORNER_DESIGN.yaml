              payload: { action: "DECLARE_OUT_OF_CONTROL", effective_utc: "2026-04-01T04:00:00Z", reason: "Daily calibration drift confirmed out of control from the 04:00 hour." }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/missing-data/substitutions"
              payload: { from_hour_utc: "2026-04-01T04:00:00Z", to_hour_utc: "2026-04-01T05:00:00Z" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/units/${unit_id}/missing-data/substitutions"
              payload: { from_hour_utc: "2026-04-01T04:00:00Z", to_hour_utc: "2026-04-01T05:00:00Z" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_already_done: $.data.error_id }
          assert:
            - "trigger 1 returns HTTP 422 with error_id == ERR_NO_SUBSTITUTABLE_HOURS — five MEASURED hours are in range and none is UNAVAILABLE"
            - "trigger 2 returns HTTP 422 with error_id == ERR_INVALID_INTERVAL"
            - "trigger 3 returns HTTP 422 with error_id == ERR_INVALID_INTERVAL — the range is half-open, so a zero-length range is rejected before the emptiness check"
            - "after trigger 4 the 04:00 hour has data_quality == UNAVAILABLE with so2_mass_lbs == null, heat_input_mmbtu still 555.556, and Unit.${unit_id}.data_availability_pct == 80.0 (4 MEASURED of 5 operating hours)"
            - "after trigger 4 QuarterlyReport.${q2_id}.total_so2_lbs == 1168.8 — the flipped hour contributes nothing"
            - "trigger 5 returns HTTP 200 with exactly one OperatingHour in the array: data_quality == SUBSTITUTED, substitution_method == T3_LOOKBACK_MAXIMUM, monitor_data_availability_pct_at_substitution == 80.0, substituted_so2_conc_ppm == 220.0 and so2_mass_lbs == 292.2"
            - "the tier is T3 and not T1 or T2 because 80.0 is below TIER2_MIN_AVAILABILITY_PCT 90.0 and at TIER3_MIN_AVAILABILITY_PCT exactly"
            - "after trigger 5 QuarterlyReport.${q2_id}.total_so2_lbs == 1461.0, substituted_hour_count == 1 and Unit.${unit_id}.data_availability_pct is still 80.0 — a substituted hour is not a measured hour"
            - "trigger 6 returns HTTP 422 with error_id == ERR_NO_SUBSTITUTABLE_HOURS — the range no longer holds an UNAVAILABLE hour, so the tier cannot drift on a re-run"

      - name: ep_computed_read_returns_the_derived_window_value
        claim_type: computed_read
        grounds:
          - endpoints[POST /emissions/permit-limits/{id}/evaluate]
          - entities.PermitLimit.fields.current_rolling_value
        excluded_because:
          difficulty_instance: boundary_rolling_window_one_sample_short_returns_insufficient_data
          rationale: "That instance reads the evaluated limit at 2 and at 3 samples and asserts both the INSUFFICIENT_DATA null and the computed rolling value, which is the computed-read claim."

      - name: ep_action_endpoint_drives_the_declared_transition
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /emissions/quarterly-reports/{id}/submit]
          - endpoints[POST /emissions/quarterly-reports/{id}/disposition]
        excluded_because:
          difficulty_instance: non_linear_quarterly_report_cycles_rejected_back_to_draft_and_resubmits
          rationale: "That instance walks validate, submit, certify, reject, reopen and resubmit, asserting each action's state, side effects and preconditions."

  # ===========================================================================
  # From Table 6 (Errors)
  # ===========================================================================
  - section: errors
    instances:

      - name: err_missing_caller_identity_is_rejected_everywhere
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "A blank X-User-ID is refused on a read as well as on a write, before role, existence or payload checks, so an anonymous caller cannot even learn whether the facility exists."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one registered facility"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /emissions/facilities/${fac_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: ""
              captures: { e_read: $.data.error_id }
            - call: "GET /emissions/facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: ""
              captures: { e_read_unknown: $.data.error_id }
            - call: "POST /emissions/facilities"
              payload: { name: "Harrier Energy Center", orispl_code: "7101", state_code: "IN", operator_org: "op_beta", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              as_user_id: ""
              captures: { e_write: $.data.error_id }
          assert:
            - "trigger 1 returns HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "trigger 2 returns HTTP 401 with error_id == ERR_UNAUTHENTICATED, not ERR_FACILITY_NOT_FOUND — authentication precedes existence"
            - "trigger 3 returns HTTP 401 with error_id == ERR_UNAUTHENTICATED, not ERR_DUPLICATE_ORISPL_CODE, and no second facility is created"
            - "the same three calls with a non-blank X-User-ID reach their normal outcomes (200, 404, 409)"

      - name: err_operator_cannot_reach_another_operators_unit
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FACILITY_SCOPE_VIOLATION]
          - validations[priority=5]
          - roles.FacilityOperator
        distinguishing_aspect: "The same dispatch and outage writes succeed for op_alpha and are refused with ERR_FACILITY_SCOPE_VIOLATION for op_beta, while a role that is not FacilityOperator at all is refused earlier with ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "facility 7101 with operator_org op_alpha and one FGD unit U1"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
          trigger:
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_beta"
              captures: { e_dispatch: $.data.error_id }
            - call: "POST /emissions/units/${unit_id}/control-outages"
              payload: { start_utc: "2026-08-10T00:00:00Z", end_utc: "2026-08-12T00:00:00Z", outage_type: "PLANNED_MAINTENANCE", control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_beta"
              captures: { e_outage: $.data.error_id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: QAAnalyst
              captures: { e_wrong_role: $.data.error_id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
          assert:
            - "trigger 1 returns HTTP 403 with error_id == ERR_FACILITY_SCOPE_VIOLATION and Unit.${unit_id}.dispatch_state is still OFFLINE"
            - "trigger 2 returns HTTP 403 with error_id == ERR_FACILITY_SCOPE_VIOLATION and no ControlOutageWindow is created"
            - "trigger 3 returns HTTP 403 with error_id == ERR_UNAUTHORIZED, not ERR_FACILITY_SCOPE_VIOLATION — the role check at priority 3 precedes the scope check at priority 5"
            - "trigger 4 returns HTTP 200 with dispatch_state == ONLINE and version == 2"

      - name: err_retest_must_cite_a_failed_unclaimed_audit_of_the_same_system
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RETEST_ALREADY_EXISTS]
          - errors[ERR_RATA_TEST_NOT_FOUND]
          - validations[priority=110]
          - validations[priority=120]
          - validations[priority=280]
        distinguishing_aspect: "retest_of_rata_test_id is refused four different ways — unknown id, another system's test, a test that is not FAILED, and a failure already claimed by an earlier retest — with the cross-parent case reported as NOT_FOUND rather than as a state error."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "U1 ONLINE with an SO2 CEM (system S) and a CO2 CEM (system C)"
            - "system S holds FAILED test F (SET B runs, relative_accuracy_pct 10.7) and PASSED test P (SET A runs)"
            - "system C holds SCHEDULED test X"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "PATCH /emissions/units/${unit_id}/dispatch"
              payload: { dispatch_state: "ONLINE" }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { sys_s: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "CO2", system_type: "CEM", span_value: 20.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { sys_c: $.data.id }
            - call: "POST /emissions/monitoring-systems/${sys_s}/rata-tests"
              payload: { window_start_utc: "2026-08-02T00:00:00Z", window_end_utc: "2026-08-03T00:00:00Z" }
              as: QAAnalyst
              captures: { rata_f: $.data.id }
            - call: "POST /emissions/rata-tests/${rata_f}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.248 }, { reference_value: 0.266, cems_value: 0.240 }, { reference_value: 0.268, cems_value: 0.234 }, { reference_value: 0.270, cems_value: 0.252 }, { reference_value: 0.270, cems_value: 0.256 }, { reference_value: 0.272, cems_value: 0.252 }, { reference_value: 0.274, cems_value: 0.240 }, { reference_value: 0.274, cems_value: 0.260 }, { reference_value: 0.274, cems_value: 0.251 }] }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rata_f}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${sys_s}/rata-tests"
              payload: { window_start_utc: "2026-08-04T00:00:00Z", window_end_utc: "2026-08-05T00:00:00Z" }
              as: QAAnalyst
              captures: { rata_p: $.data.id }
            - call: "POST /emissions/rata-tests/${rata_p}/runs"
              payload: { runs: [{ reference_value: 0.262, cems_value: 0.246 }, { reference_value: 0.266, cems_value: 0.236 }, { reference_value: 0.268, cems_value: 0.244 }, { reference_value: 0.270, cems_value: 0.258 }, { reference_value: 0.270, cems_value: 0.238 }, { reference_value: 0.272, cems_value: 0.248 }, { reference_value: 0.274, cems_value: 0.254 }, { reference_value: 0.274, cems_value: 0.246 }, { reference_value: 0.274, cems_value: 0.240 }] }
              as: QAAnalyst
            - call: "POST /emissions/rata-tests/${rata_p}/evaluate"
              payload: { ra_basis: "REFERENCE_MEAN" }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${sys_c}/rata-tests"
              payload: { window_start_utc: "2026-08-06T00:00:00Z", window_end_utc: "2026-08-07T00:00:00Z" }
              as: QAAnalyst
              captures: { rata_x: $.data.id }
          trigger:
            - call: "POST /emissions/monitoring-systems/${sys_s}/rata-tests"
              payload: { window_start_utc: "2026-08-10T00:00:00Z", window_end_utc: "2026-08-11T00:00:00Z", retest_of_rata_test_id: "00000000-0000-4000-8000-000000000000" }
              as: QAAnalyst
              captures: { e_unknown: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/${sys_s}/rata-tests"
              payload: { window_start_utc: "2026-08-10T00:00:00Z", window_end_utc: "2026-08-11T00:00:00Z", retest_of_rata_test_id: "${rata_x}" }
              as: QAAnalyst
              captures: { e_foreign: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/${sys_s}/rata-tests"
              payload: { window_start_utc: "2026-08-10T00:00:00Z", window_end_utc: "2026-08-11T00:00:00Z", retest_of_rata_test_id: "${rata_p}" }
              as: QAAnalyst
              captures: { e_not_failed: $.data.error_id }
            - call: "POST /emissions/monitoring-systems/${sys_s}/rata-tests"
              payload: { window_start_utc: "2026-08-10T00:00:00Z", window_end_utc: "2026-08-11T00:00:00Z", retest_of_rata_test_id: "${rata_f}" }
              as: QAAnalyst
              captures: { rata_r: $.data.id }
            - call: "POST /emissions/monitoring-systems/${sys_s}/rata-tests"
              payload: { window_start_utc: "2026-08-12T00:00:00Z", window_end_utc: "2026-08-13T00:00:00Z", retest_of_rata_test_id: "${rata_f}" }
              as: QAAnalyst
              captures: { e_claimed: $.data.error_id }
          assert:
            - "trigger 1 returns HTTP 404 with error_id == ERR_RATA_TEST_NOT_FOUND — the body FK is checked at priority 110"
            - "trigger 2 returns HTTP 404 with error_id == ERR_RATA_TEST_NOT_FOUND — system C's test is reported as absent, not as a scope error, at priority 120"
            - "trigger 3 returns HTTP 409 with error_id == ERR_RETEST_ALREADY_EXISTS — a PASSED audit cannot be retested"
            - "trigger 4 returns HTTP 201 with attempt_number == 2, status == SCHEDULED and retest_of_rata_test_id == ${rata_f}, and RataTest.${rata_f}.status becomes VOIDED"
            - "trigger 5 returns HTTP 409 with error_id == ERR_RETEST_ALREADY_EXISTS — at most one replacement audit per failure"
            - "GET /emissions/rata-tests?monitoring_system_id=${sys_s} returns total_count == 3"

      - name: err_state_family_codes_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_MONITOR_NOT_CERTIFIED]
          - errors[ERR_CALIBRATION_NOT_CURRENT]
          - errors[ERR_UNIT_NOT_ONLINE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: cross_entity_certify_blocked_by_outstanding_failed_rata_test
          rationale: "The QA-state family is triggered across the §1.8 cross-entity and priority instances: ERR_MONITOR_NOT_CERTIFIED and ERR_CALIBRATION_NOT_CURRENT there, ERR_UNIT_NOT_ONLINE in cross_entity_rata_runs_require_unit_online, ERR_SEGREGATION_OF_DUTIES in priority_segregation_of_duties_beats_stale_report_version, and ERR_INVALID_STATE_TRANSITION in the terminal-lockdown and invalid-trigger instances of this file."

  # ===========================================================================
  # From Table 7 (RBAC)
  # ===========================================================================
  - section: rbac
    instances:

      - name: rbac_every_role_performs_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.RegulatoryReviewer
          - roles.FacilityOperator
          - roles.QAAnalyst
          - roles.EmissionsReportPreparer
          - roles.DesignatedRepresentative
          - roles.AllowanceTrader
        distinguishing_aspect: "One end-to-end compliance quarter is completed with each of the six roles performing only its own exclusive operations, proving the partition is workable and not merely restrictive."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
          trigger:
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/fuel-samples"
              payload: { sample_utc: "2026-04-01T00:00:00Z", fuel_type: "COAL", lot_identifier: "LOT-4471" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { fs_id: $.data.id }
            - call: "POST /emissions/fuel-samples/${fs_id}/analysis"
              payload: { outcome: "ANALYZED", gcv_btu_per_lb: 12500.0, sulfur_content_pct: 0.85, analysis_method: "ASTM_D5865" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }
              as: FacilityOperator
              as_user_id: "op_alpha"
            - call: "POST /emissions/quarterly-reports/${q2_id}/validate"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/quarterly-reports/${q2_id}/submit"
              payload: { submission_format: "JSON_ECMPS" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_v_submitted: $.data.version }
            - call: "POST /emissions/quarterly-reports/${q2_id}/certifications"
              payload: { expected_quarterly_report_version: "${q2_v_submitted}", statement_text: "I certify under penalty of law that the submitted data are true and complete." }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
              captures: { cert_id: $.data.id }
            - call: "POST /emissions/quarterly-reports/${q2_id}/disposition"
              payload: { decision: "ACCEPT" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities/${fac_id}/allowance-accounts"
              payload: { program: "ARP_SO2", compliance_year: 2026, holdings_current_vintage_tons: 5.000, holdings_prior_vintage_tons: 0.000, holdings_next_vintage_tons: 0.000 }
              as: RegulatoryReviewer
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v1}", allowance_account_id: "${acct_id}", transaction_type: "SURRENDER", quantity_tons: 1.000, vintage_year: 2026 }
              as: AllowanceTrader
              captures: { tx_id: $.data.id }
            - call: "POST /emissions/allowance-transactions/${tx_id}/transition"
              payload: { action: "RECORD" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
          assert:
            - "every call returns its declared success status: 201 for the creates, 200 for the transitions"
            - "the shared creates work from either owner: the unit was created by FacilityOperator and the calibration by FacilityOperator, while QAAnalyst created the monitoring system and analysed the fuel sample"
            - "QuarterlyReport.${q2_id}.status == ACCEPTED with submitted_by_user_id == prep_1 and submission_format == JSON_ECMPS"
            - "ComplianceCertification.${cert_id}.status == SIGNED with certifier_user_id == dr_1"
            - "AllowanceTransaction.${tx_id}.status == RECORDED and AllowanceAccount.${acct_id}.holdings_current_vintage_tons is still 5.000"

      - name: rbac_exclusive_operations_are_closed_to_every_other_role
        claim_type: unauthorized_operations
        grounds:
          - roles.RegulatoryReviewer
          - roles.FacilityOperator
          - roles.QAAnalyst
          - roles.EmissionsReportPreparer
          - roles.DesignatedRepresentative
          - roles.AllowanceTrader
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=3]
        distinguishing_aspect: "Nine exclusive operations are each attempted by a role that does not own them and every one returns ERR_UNAUTHORIZED before any state, existence or payload check runs, leaving every entity version untouched."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "facility 7101 with U1, an SO2 CEM, a DRAFT 2026 Q3 report, an ARP_SO2 2026 account and one PROPOSED transaction"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
