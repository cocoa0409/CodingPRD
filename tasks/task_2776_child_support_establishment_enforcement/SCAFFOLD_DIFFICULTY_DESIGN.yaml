  # =====================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Differentiation: instance 1 pits category `state` (priority 9) against
  # `business_fiscal` (priority 43); instance 2 pits `business_safety`
  # (priority 13) against `business_constraint` (priority 31) — two disjoint
  # error-category pairs.
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_case_version_beats_arrears_below_compromise_minimum
        grounds:
          - validations[priority=9]
          - validations[priority=43]
          - concurrency_rules[compromise-create-stale-case]
          - errors[ERR_STALE_CASE_VERSION]
          - errors[ERR_ARREARS_BELOW_COMPROMISE_MINIMUM]
          - calculations.compromise_settlement_amount
        distinguishing_aspect: |
          One request violates the priority-9 `state` rule (stale
          expected_case_version) and the priority-43 `business_fiscal` rule
          (arrears_principal_cents 75000 below MIN_COMPROMISE_ARREARS_CENTS
          100000) at once, and must answer ERR_STALE_CASE_VERSION with HTTP
          412 — never the 409 fiscal error; a control request with a fresh
          version proves the fiscal rule is live.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false; CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD; NCP LOCATED."
            - "PRESUMED_MARITAL paternity; one CURRENT_SUPPORT MN order effective 2026-08-01 ENTERED at 75000."
            - "Exactly one OPEN CURRENT_SUPPORT charge of 75000 (period 2026-08-01/2026-09-01, due 2026-08-15), nothing paid: arrears_principal_cents 75000, below the 100000 compromise floor."
            - "The NCP has no IWO and no enforcement action, so compromise_risk_tier is MEDIUM and priority 39 does not fire."
            - "The client reads the case version, then an accrual run bumps SupportCase.version by 1, making the held version stale."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Bo Craven", ssn_last4: "1616", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Cyd Craven", ssn_last4: "1717", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
            - call: "GET /child-support/participants/${ncp_id}"
              as: FinanceOfficer
              captures: { c_tier: $.data.compromise_risk_tier }
            - call: "GET /child-support/cases/${case_id}"
              as: FinanceOfficer
              captures: { case_v_stale: $.data.version, principal: $.data.arrears_principal_cents }
            - call: "POST /child-support/cases/${case_id}/accrual-runs"
              payload: {}
              as: FinanceOfficer
              captures: { case_v_fresh: $.data.version }
          trigger:
            - call: "POST /child-support/cases/${case_id}/compromise-offers"
              payload: { installment_count: 6, expected_case_version: "${case_v_stale}" }
              as: FinanceOfficer
              captures: { err_conflict: $.data.error_id }
            - call: "POST /child-support/cases/${case_id}/compromise-offers"
              payload: { installment_count: 6, expected_case_version: "${case_v_fresh}" }
              as: FinanceOfficer
              captures: { err_control: $.data.error_id }
            - call: "GET /child-support/compromise-offers"
              payload: { case_id: "${case_id}" }
              as: FinanceOfficer
          assert:
            - "${principal} == 75000"
            - "${c_tier} == \"MEDIUM\"  # 42 on the compromise_screen, so priority 39 is satisfied"
            - "${case_v_fresh} == ${case_v_stale} + 1"
            - "${err_conflict} == \"ERR_STALE_CASE_VERSION\"  # HTTP 412, priority 9 wins"
            - "${err_conflict} != \"ERR_ARREARS_BELOW_COMPROMISE_MINIMUM\""
            - "${err_control} == \"ERR_ARREARS_BELOW_COMPROMISE_MINIMUM\"  # HTTP 409; the fiscal rule is live once the version is fresh"
            - "GET /child-support/compromise-offers?case_id=${case_id} returns an empty list — neither rejected request created a CompromiseOffer"

      - name: segregation_of_duties_beats_deviation_rejection_limit
        grounds:
          - validations[priority=13]
          - validations[priority=31]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_DEVIATION_REJECTION_LIMIT]
          - entities.SupportOrder.fields.drafted_by_user_id
          - entities.SupportOrder.fields.deviation_rejection_count
          - state_machines.SupportOrder.status.PENDING_DEVIATION_FINDINGS_to_CALCULATED
        distinguishing_aspect: |
          One deviation-findings request violates the priority-13
          `business_safety` rule (X-User-ID equals order.drafted_by_user_id) and
          the priority-31 `business_constraint` rule
          (deviation_rejection_count already 2 == DEVIATION_REJECTION_LIMIT) at
          once, and must answer ERR_SEGREGATION_OF_DUTIES with HTTP 403 rather
          than the 409 constraint error; a control request by a different
          reviewer proves the constraint rule is live.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false; CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD; NCP LOCATED."
            - "PRESUMED_MARITAL paternity; one CURRENT_SUPPORT MN order effective 2026-08-01."
            - "The guideline worksheet is run by X-User-ID \"u-shared\", so order.drafted_by_user_id is \"u-shared\" and guideline_monthly_cents is 75000."
            - "Two HARDSHIP deviation requests for 60000 (20% below guideline, clearing MIN_DEVIATION_PCT) are each rejected by attorney \"u-attorney-1\", so deviation_rejection_count is 2."
            - "A third deviation request is filed, leaving the order in PENDING_DEVIATION_FINDINGS."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dara Ellis", ssn_last4: "1818", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: $.data.id }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Eli Ellis", ssn_last4: "1919", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: $.data.id }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: $.data.id }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: $.data.id }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
              as_user_id: "u-shared"
              captures: { drafter: $.data.drafted_by_user_id, gl: $.data.guideline_monthly_cents }
            - call: "POST /child-support/orders/${order_id}/deviation-request"
              payload: { deviation_requested_cents: 60000, deviation_reason: "HARDSHIP" }
              as: CaseWorker
              as_user_id: "u-shared"
            - call: "POST /child-support/orders/${order_id}/deviation-findings"
              payload: { decision: "REJECT" }
              as: SupervisingAttorney
              as_user_id: "u-attorney-1"
              captures: { st1: $.data.status, rc1: $.data.deviation_rejection_count }
            - call: "POST /child-support/orders/${order_id}/deviation-request"
              payload: { deviation_requested_cents: 60000, deviation_reason: "HARDSHIP" }
              as: CaseWorker
              as_user_id: "u-shared"
            - call: "POST /child-support/orders/${order_id}/deviation-findings"
              payload: { decision: "REJECT" }
              as: SupervisingAttorney
              as_user_id: "u-attorney-1"
              captures: { st2: $.data.status, rc2: $.data.deviation_rejection_count }
            - call: "POST /child-support/orders/${order_id}/deviation-request"
              payload: { deviation_requested_cents: 60000, deviation_reason: "HARDSHIP" }
              as: CaseWorker
              as_user_id: "u-shared"
              captures: { st3: $.data.status }
          trigger:
            - call: "POST /child-support/orders/${order_id}/deviation-findings"
              payload: { decision: "REJECT" }
              as: SupervisingAttorney
              as_user_id: "u-shared"
              captures: { err_conflict: $.data.error_id }
            - call: "POST /child-support/orders/${order_id}/deviation-findings"
              payload: { decision: "REJECT" }
              as: SupervisingAttorney
              as_user_id: "u-attorney-1"
              captures: { err_control: $.data.error_id }
            - call: "GET /child-support/orders/${order_id}"
              as: SupervisingAttorney
              captures: { st_end: $.data.status, rc_end: $.data.deviation_rejection_count, approver_end: $.data.findings_approved_by_user_id }
          assert:
            - "${drafter} == \"u-shared\""
            - "${gl} == 75000"
            - "${st1} == \"CALCULATED\""
            - "${rc1} == 1"
            - "${st2} == \"CALCULATED\""
            - "${rc2} == 2  # == DEVIATION_REJECTION_LIMIT"
            - "${st3} == \"PENDING_DEVIATION_FINDINGS\""
            - "${err_conflict} == \"ERR_SEGREGATION_OF_DUTIES\"  # HTTP 403, priority 13 wins over priority 31"
            - "${err_conflict} != \"ERR_DEVIATION_REJECTION_LIMIT\""
            - "${err_control} == \"ERR_DEVIATION_REJECTION_LIMIT\"  # HTTP 409; the constraint rule is live for a different reviewer"
            - "${st_end} == \"PENDING_DEVIATION_FINDINGS\"  # neither rejected request moved the order"
            - "${rc_end} == 2  # neither rejected request incremented the counter"
            - "${approver_end} == null"

  # =====================================================================
  # RULE 6 — boundary_precision_check
  # Differentiation: three different metrics on three different endpoints —
  # (1) certified arrears cents against ENFORCEMENT_THRESHOLDS on
  #     POST /cases/{case_id}/enforcement-actions,
  # (2) the waterfall remainder at the zero-OPEN-charge boundary on
  #     POST /cases/{case_id}/payments,
  # (3) the variance ratio at exactly 1500 basis points on
  #     POST /modification-reviews/{id}/screening.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: enforcement_threshold_boundary_denies_at_statutory_interest
        grounds:
          - calculations.enforcement_eligibility_thresholds
          - calculations.arrears_interest_accrual
          - validations[priority=42]
          - errors[ERR_ARREARS_BELOW_ENFORCEMENT_THRESHOLD]
          - entities.EnforcementAction.fields.arrears_certified_snapshot_cents
          - entities.SupportCase.fields.interest_receivable_cents
        distinguishing_aspect: |
          At principal 298000 the statutory_per_charge interest is 1855, giving
          a certified balance of 299855 — 145 cents below the 300000
          LICENSE_SUSPENSION threshold — while the ledger's
          aggregate_month_end interest of 3345 would put the case at 301345 and
          over the line; the request must be denied, so the boundary proves the
          certification uses the statutory variant and not the ledger figure.
          One extra 145-cent charge that accrues zero interest then lands the
          certified balance on exactly 300000, which is eligible because the
          gate is `>=`.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION MN case, child_count 2, tanf_assistance false, good_cause_claim false; CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD, NCP has_valid_drivers_license true; NCP LOCATED."
            - "PRESUMED_MARITAL paternity; one CURRENT_SUPPORT MN order effective 2026-08-01 ENTERED at monthly_obligation_cents 75000."
            - "Three OPEN CURRENT_SUPPORT charges of 75000 due 2026-08-15, 2026-09-15 and 2026-10-15, plus one ARREARS_JUDGMENT charge of 73000 due 2026-08-15: principal 298000, nothing paid."
            - "Clock advanced to 2026-11-01T00:00:00Z and an accrual run posted, so the ledger's aggregate receivable is visible."
            - "statutory_per_charge at 2026-11-01: 75000x0.005x2 = 750, 75000x0.005x1 = 375, 75000x0.005x0 = 0, 73000x0.005x2 = 730 -> 1855."
            - "aggregate_month_end at 2026-11-01: 148000x0.005 = 740 (Aug 31) + 223000x0.005 = 1115 (Sep 30) + 298000x0.005 = 1490 (Oct 31) -> 3345."
