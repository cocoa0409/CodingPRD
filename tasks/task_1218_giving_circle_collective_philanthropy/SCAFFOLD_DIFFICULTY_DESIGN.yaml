            - { call: "POST /api/cycles/${cycle_id}/advance", payload: { expected_cycle_version: "${cycle_v}" }, as: CircleAdmin }
            - { call: "POST /api/ballots", payload: { cycle_id: "${cycle_id}", membership_id: "${ms1_id}", allocations: [{ nomination_id: "${n1_id}", points: 60 }, { nomination_id: "${n2_id}", points: 40 }] }, as: Member, as_user_id: "${m1_id}", captures: { b1_id: $.data.id, b1_v: $.data.version } }
          trigger:
            - { call: "GET /api/cycles/${cycle_id}/tally", as: CircleAdmin, captures: { total_before: $.data.total_points_cast } }
            - { call: "POST /api/ballots/${b1_id}/recast", payload: { allocations: [{ nomination_id: "${n1_id}", points: 30 }, { nomination_id: "${n2_id}", points: 70 }], expected_ballot_version: "${b1_v}" }, as: Member, as_user_id: "${m1_id}", captures: { b1_v2: $.data.version } }
