            - "ThirdPartyIntegration.${intg_id}.disclosed_in_notice == true after notice r2 is published"
            - "${approved_status} == APPROVED and ${approved_points} == 50 (SOCIAL_PLUGIN 25 x 2 for the persistent identifier)"
            - "OnlineService.${svc_id}.third_party_exposure_points == 50"
            - "OnlineService.${svc_id}.compliance_posture == RESTRICTED (50 >= 40 and 50 < 80)"
            - "OnlineService.${svc_id}.audit_decision_count == 1 (only the accepted approval counted; the two refusals did not)"
            - "OnlineService.${svc_id}.open_audit_count == 0"

      - name: retention_overlap_p102_beats_disposal_method_p112
        grounds:
          - validations[priority=102]
          - validations[priority=112]
          - errors[ERR_RETENTION_SCHEDULE_OVERLAP]
          - errors[ERR_DISPOSAL_METHOD_NOT_PERMITTED]
          - domain_constants.ALLOWED_DISPOSAL_METHODS
          - entities.RetentionSchedule.fields.effective_to
        distinguishing_aspect: |
          One POST /retention-schedules body violates the business_temporal rule at priority 102
          (effective_from 2026-06-30 is same-day adjacent to the existing range's inclusive
          effective_to, and the schedule demands at least a one-day gap) and the business_constraint
          rule at priority 112 (ANONYMIZE is not in ALLOWED_DISPOSAL_METHODS[GEOLOCATION_PRECISE]);
          the answer must be ERR_RETENTION_SCHEDULE_OVERLAP / 409, and moving the start by exactly
          one day to 2026-07-01 isolates the priority-112 error on an otherwise identical body.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service registered (no determination needed)."
            - "Schedule S1 exists: (GEOLOCATION_PRECISE, PARTICIPATION_CORE), retention_days 30, CRYPTO_ERASE, effective 2026-01-01 through 2026-06-30 inclusive."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Trail Trekkers Junior", operator_organization: "Trekker Outdoors Inc", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "GEOLOCATION_PRECISE", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "CRYPTO_ERASE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-30T00:00:00Z", defined_purpose_statement: "Precise location kept only to place the child on the trail map." }
              as: ComplianceOfficer
              captures: { sched_1: $.data.id }
          trigger:
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "GEOLOCATION_PRECISE", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "ANONYMIZE", effective_from: "2026-06-30T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Second half of the year." }
              as: ComplianceOfficer
              captures: { err_both_violated: $.data.error_id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "GEOLOCATION_PRECISE", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "ANONYMIZE", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Second half of the year." }
              as: ComplianceOfficer
              captures: { err_method_only: $.data.error_id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "GEOLOCATION_PRECISE", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "OVERWRITE", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Second half of the year, overwritten in place." }
              as: ComplianceOfficer
              captures: { sched_2: $.data.id }
          assert:
            - "${err_both_violated} == ERR_RETENTION_SCHEDULE_OVERLAP with HTTP 409 (priority 102 wins over the also-violated priority 112)"
            - "${err_both_violated} != ERR_DISPOSAL_METHOD_NOT_PERMITTED"
            - "${err_method_only} == ERR_DISPOSAL_METHOD_NOT_PERMITTED with HTTP 422 (identical body, effective_from moved by exactly one day)"
            - "RetentionSchedule.${sched_2}.effective_from == 2026-07-01T00:00:00Z and RetentionSchedule.${sched_2}.disposal_method == OVERWRITE"
            - "RetentionSchedule.${sched_1}.effective_to == 2026-06-30T00:00:00Z (unchanged; schedules are never rewritten by a successor)"
            - "GET /online-services/${svc_id}/retention-schedules?data_element_code=GEOLOCATION_PRECISE returns total_count == 2"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: disposal_due_inclusive_boundary_and_two_run_secure_disposal
        grounds:
          - calculations.record_disposal_schedule
          - state_machines.ChildDataRecord.COLLECTED_to_SCHEDULED_FOR_DISPOSAL
          - state_machines.ChildDataRecord.SCHEDULED_FOR_DISPOSAL_to_DISPOSED
          - entities.ChildDataRecord.fields.scheduled_run_sequence
          - entities.ChildDataRecord.fields.disposal_due_at
          - entities.OnlineService.fields.compliance_run_sequence
        distinguishing_aspect: |
          disposal_due_at is 2026-08-31T00:00:00Z (collected_at 2026-08-01 + retention_days 30) and
          the due test is INCLUSIVE: a run at 2026-08-30T23:59:59.999Z schedules nothing, a run at
          exactly 2026-08-31T00:00:00Z schedules the record with scheduled_run_sequence 2, and
          disposal needs a LATER run (scheduled_run_sequence < current run_sequence), so the very
          same run never both schedules and destroys — disposed_count is 0 in run 2 and 1 in run 3
          with the clock frozen between them.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; service MIXED_AUDIENCE (design_score 0.60) with an ACTIVE neutral age screen."
            - "Activity DIARY whitelists SCREEN_NAME; retention schedule (SCREEN_NAME, PARTICIPATION_CORE) retention_days 30, ANONYMIZE, effective 2026-01-01 through 2026-12-31."
            - "Notice published; consent GRANTED via SIGNED_FORM_RETURN; exactly one SCREEN_NAME record collected at 2026-08-01T00:00:00Z."
            - "No compliance run has executed yet (compliance_run_sequence == 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Dream Diary Kids", operator_organization: "Diary Apps Ltd", service_category: "EDUCATION_APP", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "NEUTRAL_DOB_ENTRY", retry_allowed_on_fail: false, outcome_session_persisted: true }
              as: PrivacyEngineer
              captures: { screen_id: $.data.id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /activities"
              payload: { service_id: "${svc_id}", activity_code: "DIARY", participation_required_elements: ["SCREEN_NAME"] }
              as: ComplianceOfficer
              captures: { act_id: $.data.id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "ANONYMIZE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Diary screen name kept 30 days after collection." }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.g@x.test", child_pseudonym: "child-401", intended_uses: ["PARTICIPATION_CORE"], consent_method: "SIGNED_FORM_RETURN", expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { consent_id: $.data.id }
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "FORM-OK-2" }
              as: ComplianceOfficer
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_id}", activity_id: "${act_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "UNDER_13" }
              as: PrivacyEngineer
              captures: { rec_id: $.data.id, due_at: $.data.disposal_due_at, collected_at: $.data.collected_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T23:59:59.999Z" }
              as: ComplianceOfficer
            - call: "POST /compliance-runs"
              payload: { service_id: "${svc_id}" }
              as: ComplianceOfficer
              captures: { run_1: $.data.run_sequence, sched_1: $.data.scheduled_count, disp_1: $.data.disposed_count, expired_1: $.data.expired_consent_count, live_1: $.data.live_child_data_element_count_after }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /compliance-runs"
              payload: { service_id: "${svc_id}" }
              as: ComplianceOfficer
              captures: { run_2: $.data.run_sequence, sched_2: $.data.scheduled_count, disp_2: $.data.disposed_count, live_2: $.data.live_child_data_element_count_after }
            - call: "POST /compliance-runs"
              payload: { service_id: "${svc_id}" }
              as: PrivacyEngineer
              captures: { run_3: $.data.run_sequence, sched_3: $.data.scheduled_count, disp_3: $.data.disposed_count, live_3: $.data.live_child_data_element_count_after, posture_3: $.data.compliance_posture_after }
          assert:
            - "${collected_at} == 2026-08-01T00:00:00Z and ${due_at} == 2026-08-31T00:00:00Z"
            - "${run_1} == 1 and ${sched_1} == 0 and ${disp_1} == 0 and ${expired_1} == 0 and ${live_1} == 1 (one millisecond before due is NOT due)"
            - "ChildDataRecord.${rec_id}.status == COLLECTED and ChildDataRecord.${rec_id}.scheduled_run_sequence == null after run 1"
            - "${run_2} == 2 and ${sched_2} == 1 and ${disp_2} == 0 and ${live_2} == 1 (exactly at disposal_due_at IS due; SCHEDULED_FOR_DISPOSAL still counts as live)"
            - "ChildDataRecord.${rec_id}.status == SCHEDULED_FOR_DISPOSAL and ChildDataRecord.${rec_id}.scheduled_run_sequence == 2 after run 2"
            - "ChildDataRecord.${rec_id}.disposed_at == null after run 2 (a record scheduled by THIS run is never disposed by the same run)"
            - "${run_3} == 3 and ${sched_3} == 0 and ${disp_3} == 1 and ${live_3} == 0 (the clock did not move between run 2 and run 3; only the run sequence did)"
            - "ChildDataRecord.${rec_id}.status == DISPOSED with disposed_at == 2026-08-31T00:00:00Z and disposal_method_applied == ANONYMIZE"
            - "OnlineService.${svc_id}.live_child_data_element_count == 0 and OnlineService.${svc_id}.lifetime_collected_element_count == 1"
            - "OnlineService.${svc_id}.compliance_run_sequence == 3 and ${posture_3} == OPEN"
            - "ConsentRequest.${consent_id}.status == GRANTED (a GRANTED consent is never expired by phase 1)"

      - name: determination_evidence_sufficiency_and_share_threshold_boundaries
        grounds:
          - validations[priority=130]
          - calculations.audience_child_share
          - calculations.child_directed_determination
          - errors[ERR_INSUFFICIENT_EVIDENCE]
          - entities.DeterminationEvidence.fields.sample_verified
          - entities.OnlineService.fields.design_score
        distinguishing_aspect: |
          Three boundaries in one instance: (i) an UNVERIFIED PANEL row is stored yet counts as no
          evidence at all, so determination is still refused with ERR_INSUFFICIENT_EVIDENCE and
          audience_child_share stays null; (ii) a single ABSENT design factor produces design_score
          exactly 0.00 — a legitimate determination of GENERAL_AUDIENCE rather than an error; and
          (iii) the share threshold is inclusive at 4 decimals — 1600/4000 == 0.4000 reaches
          CHILD_DIRECTED_PRIMARY while 1599/4000 == 0.3998 on an otherwise identical service lands
          on MIXED_AUDIENCE.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Service E registered with NO evidence of any kind."
            - "Service F registered with one SUBJECT_MATTER/MODERATE design row (design_score 0.60) and one verified PANEL sample over [2026-06-01, 2026-07-01) with total_users 4000, users_under_13 1599."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Blank Slate Portal", operator_organization: "Slate Media Group", service_category: "GENERAL_INTEREST_PORTAL", subject_matter_code: "ADULT_GENERAL" }
              as: ComplianceOfficer
              captures: { svc_e: $.data.id }
