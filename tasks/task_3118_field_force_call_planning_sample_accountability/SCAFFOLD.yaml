# =============================================================================
# SCAFFOLD — Field Force Call Planning & Sample Accountability
# (Merck U.S. commercial operations)
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml. Neither design key appears here.
# =============================================================================

scenario: |
  Field Force Call Planning & Sample Accountability (Merck U.S. commercial operations):
  territory alignment and target list construction from prescriber data with call
  frequency plans, sample inventory issuance to representatives with lot and expiration
  tracking, signature capture at each sample delivery with reconciliation of dispensed
  against received quantities, periodic physical inventory counts and variance
  investigation with disciplinary thresholds, sample storage temperature monitoring in
  representative vehicles and home offices, prescriber eligibility verification and
  per-visit sample quantity limits, transfer of samples between representatives with
  documentation, expired and damaged sample return, destruction and reporting obligations.

domain_name: field-force-sample-accountability
api_prefix: /field-force

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid          # Region→Territory→Representative tree + cross-cutting Prescriber/SampleLot references
  state_machine_shape: branching   # branching + cyclic loops on transfers and count sessions; parallel dims on disbursement
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential            # Representative.manager_rep_id hierarchy for count segregation
  role_model: segregation_of_duties  # rep cannot certify own count; issuer cannot accept own transfer; counter cannot be custodian
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "Unique business code (e.g. NE-01)" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: ACTIVE }

  - name: Territory
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id" }
      - { name: territory_code, type: string, source: input, description: "Unique within region" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: cycle_start_date, type: datetime, source: input, description: "Plan cycle start (UTC)" }
      - { name: cycle_end_date, type: datetime, source: input, description: "Plan cycle end (UTC, exclusive)" }
      - { name: cycle_sample_budget_units, type: integer, source: input, description: "Total sample units allocatable across target entries for the cycle; consumed by territory_sample_allocation_rounding at plan publish; required to publish a plan" }
      - { name: alignment_posture, type: enum, source: computed, description: "DRAFT | PUBLISHED | LOCKED — derived from presence of an ACTIVE CallPlan plus region status" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REALIGNING | RETIRED", default: ACTIVE }

  - name: Representative
    parent: Territory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: system, description: "FK -> Territory.id" }
      - { name: employee_id, type: string, source: input, description: "HR employee id (unique)" }
      - { name: full_name, type: string, source: input, description: "Rep name" }
      - { name: manager_rep_id, type: string, source: input, description: "FK -> Representative.id; self-referential manager link (nullable only for root district manager)" }
      - { name: hire_date, type: datetime, source: input, description: "Used for sample-eligibility tenure rule" }
      - { name: compliance_standing, type: enum, source: computed, description: "GOOD | WATCH | SUSPENDED — derived from variance investigation outcomes" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | TERMINATED", default: ACTIVE }

  - name: Prescriber
    parent: null
    common_fields: true
    fields:
      - { name: npi_number, type: string, source: input, description: "10-digit NPI, unique" }
      - { name: full_name, type: string, source: input, description: "Prescriber name" }
      - { name: state_license_number, type: string, source: input, description: "State medical license" }
      - { name: dea_number, type: string, source: input, description: "DEA registration, required if controlled=true" }
      - { name: specialty_code, type: string, source: input, description: "Taxonomy code" }
      - { name: eligibility_status, type: enum, source: system, description: "ELIGIBLE | PENDING_REVIEW | INELIGIBLE | EXPIRED_LICENSE", default: PENDING_REVIEW }
      - { name: eligibility_checked_at, type: datetime, source: system, description: "Last verification timestamp (logical clock)" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: ndc_code, type: string, source: input, description: "National Drug Code, unique" }
      - { name: brand_name, type: string, source: input, description: "Brand name" }
      - { name: controlled, type: boolean, source: input, description: "True if DEA-scheduled" }
      - { name: per_visit_max_units, type: integer, source: input, description: "Regulatory cap per prescriber visit" }
      - { name: annual_max_units_per_prescriber, type: integer, source: input, description: "Annual cap per prescriber across all reps" }
      - { name: storage_temp_min_c, type: number, source: input, description: "Lower bound of allowed storage band" }
      - { name: storage_temp_max_c, type: number, source: input, description: "Upper bound of allowed storage band" }
      - { name: status, type: enum, source: system, description: "MARKETED | DISCONTINUED", default: MARKETED }

  - name: TargetListEntry
    parent: Territory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: system, description: "FK -> Territory.id" }
      - { name: prescriber_id, type: string, source: input, description: "FK -> Prescriber.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: tier, type: enum, source: input, description: "A | B | C — decile tier drives planned frequency" }
      - { name: planned_calls_per_cycle, type: integer, source: computed, description: "Tier A=12, B=6, C=2 per cycle" }
      - { name: delivered_calls, type: integer, source: computed, description: "Count of COMPLETED CallVisits linked to this entry in current cycle", default: 0 }
      - { name: planned_sample_units, type: integer, source: input, description: "Total sample units planned for the cycle" }
      - { name: delivered_sample_units, type: integer, source: computed, description: "Sum of SIGNED disbursements for this entry", default: 0 }
      - { name: call_attainment_pct_planned_basis, type: number, source: computed, description: "delivered_calls / planned_calls_per_cycle * 100 (round per §1.3)" }
      - { name: call_attainment_pct_delivered_basis, type: number, source: computed, description: "delivered_calls / max(delivered_calls + open_scheduled_calls, 1) * 100 — variant of attainment" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CAP_EXHAUSTED | REMOVED", default: ACTIVE }

  - name: CallPlan
    parent: Territory
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: system, description: "FK -> Territory.id" }
      - { name: cycle_label, type: string, source: input, description: "e.g. 2026-Q3" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED | SUPERSEDED", default: DRAFT }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp at publish" }
      - { name: total_planned_calls, type: integer, source: computed, description: "Sum of planned_calls_per_cycle over ACTIVE TargetListEntry rows" }

  - name: CallVisit
    parent: CallPlan
    common_fields: true
    fields:
      - { name: call_plan_id, type: string, source: system, description: "FK -> CallPlan.id" }
      - { name: representative_id, type: string, source: input, description: "FK -> Representative.id" }
      - { name: target_list_entry_id, type: string, source: input, description: "FK -> TargetListEntry.id" }
      - { name: prescriber_id, type: string, source: input, description: "FK -> Prescriber.id (denormalized from entry)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end (UTC, exclusive)" }
      - { name: call_status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: signature_status, type: enum, source: system, description: "NONE | CAPTURED | REJECTED", default: NONE }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock completion timestamp" }

  - name: SampleLot
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot id; unique per product" }
      - { name: expiration_date, type: datetime, source: input, description: "Lot expiry (UTC date at 00:00:00Z)" }
      - { name: quantity_received, type: integer, source: input, description: "Total units received into the program" }
      - { name: quantity_available, type: integer, source: computed, description: "quantity_received − issued − destroyed − expired_quarantined − returned_to_manufacturer" }
      - { name: status, type: enum, source: system, description: "RELEASED | QUARANTINED | EXPIRED | DEPLETED | DESTROYED", default: RELEASED }
      - { name: quarantine_reason, type: enum, source: system, description: "NONE | TEMPERATURE_EXCURSION | RECALL | DAMAGE", default: NONE }

  - name: RepLotBalance
    parent: Representative
    common_fields: true
    fields:
      - { name: representative_id, type: string, source: system, description: "FK -> Representative.id" }
      - { name: lot_id, type: string, source: system, description: "FK -> SampleLot.id" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id (denormalized)" }
      - { name: qty_issued, type: integer, source: computed, description: "Units issued from distribution to this rep for this lot", default: 0 }
      - { name: qty_dispensed, type: integer, source: computed, description: "Units with CAPTURED signatures", default: 0 }
      - { name: qty_returned, type: integer, source: computed, description: "Units returned expired/damaged", default: 0 }
      - { name: qty_transferred_out, type: integer, source: computed, description: "Units whose transfer was ACCEPTED by another rep", default: 0 }
      - { name: qty_transferred_in, type: integer, source: computed, description: "Units received via ACCEPTED transfers", default: 0 }
      - { name: qty_in_transit_out, type: integer, source: computed, description: "Units in REQUESTED transfers out of this rep", default: 0 }
      - { name: qty_available_forward, type: integer, source: computed, description: "forward_looking variant: issued − dispensed − returned − transferred_out − in_transit_out + transferred_in" }
      - { name: qty_available_confirmed, type: integer, source: computed, description: "chronological/ledger-only variant: issued − dispensed − returned − transferred_out + transferred_in (excludes in-transit reserve)" }

  - name: SampleDisbursement
    parent: CallVisit
    common_fields: true
    fields:
      - { name: call_visit_id, type: string, source: system, description: "FK -> CallVisit.id" }
      - { name: representative_id, type: string, source: system, description: "FK -> Representative.id" }
      - { name: prescriber_id, type: string, source: system, description: "FK -> Prescriber.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> SampleLot.id" }
      - { name: quantity, type: integer, source: input, description: "Units delivered at this visit" }
      - { name: signature_payload, type: string, source: input, description: "Base64 signature capture blob; required to reach SIGNED" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock signature timestamp" }
      - { name: reconciliation_status, type: enum, source: system, description: "PENDING_SIGNATURE | SIGNED | REJECTED | VOIDED" }

  - name: SampleTransfer
    parent: null
    common_fields: true
    fields:
      - { name: from_rep_id, type: string, source: input, description: "FK -> Representative.id (sender)" }
      - { name: to_rep_id, type: string, source: input, description: "FK -> Representative.id (receiver)" }
      - { name: lot_id, type: string, source: input, description: "FK -> SampleLot.id" }
      - { name: quantity, type: integer, source: input, description: "Units to move" }
      - { name: reason_code, type: enum, source: input, description: "REBALANCE | TERRITORY_REALIGN | SHORTAGE_COVER | REP_DEPARTURE" }
      - { name: documentation_note, type: string, source: input, description: "Free-text justification (min 20 chars)" }
      - { name: expected_lot_version, type: integer, source: input, description: "OCC guard against SampleLot.version observed at request time" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ACCEPTED | REJECTED | CANCELLED | REVERSED" }

  - name: InventoryCountSession
    parent: Representative
    common_fields: true
    fields:
      - { name: representative_id, type: string, source: system, description: "FK -> Representative.id (custodian)" }
      - { name: counter_rep_id, type: string, source: input, description: "FK -> Representative.id — the independent counter; MUST differ from custodian AND from custodian's manager (segregation of duties)" }
      - { name: window_start, type: datetime, source: input, description: "Count window start (UTC, inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Count window end (UTC, exclusive)" }
      - { name: status, type: enum, source: system, description: "OPEN | COUNTED | RECONCILED | CLOSED | VOIDED" }
      - { name: variance_pct, type: number, source: computed, description: "|counted − expected| / max(expected,1) * 100, computed at RECONCILED" }
      - { name: disciplinary_tier, type: enum, source: computed, description: "NONE | COUNSELING | WRITTEN_WARNING | SUSPENSION_REVIEW per §1.3 thresholds" }

  - name: CountLine
    parent: InventoryCountSession
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> InventoryCountSession.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> SampleLot.id" }
      - { name: expected_qty, type: integer, source: computed, description: "Snapshot of custodian RepLotBalance.qty_available_forward at session OPEN" }
      - { name: counted_qty, type: integer, source: input, description: "Physical count entered by counter_rep_id" }
      - { name: variance_qty, type: integer, source: computed, description: "counted_qty − expected_qty" }

  - name: TemperatureExcursion
    parent: Representative
    common_fields: true
    fields:
      - { name: representative_id, type: string, source: system, description: "FK -> Representative.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: location_type, type: enum, source: input, description: "VEHICLE | HOME_OFFICE" }
      - { name: observed_temp_c, type: number, source: input, description: "Observed temperature" }
      - { name: excursion_minutes, type: integer, source: input, description: "Duration outside allowed band" }
      - { name: severity, type: enum, source: computed, description: "MINOR | MAJOR | CRITICAL per §1.3 temperature_excursion_severity" }
      - { name: status, type: enum, source: system, description: "REPORTED | ASSESSED | RESOLVED", default: REPORTED }

  - name: SampleReturn
    parent: Representative
    common_fields: true
    fields:
      - { name: representative_id, type: string, source: system, description: "FK -> Representative.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> SampleLot.id" }
      - { name: quantity, type: integer, source: input, description: "Units returned" }
      - { name: return_reason, type: enum, source: input, description: "EXPIRED | DAMAGED | RECALLED" }
      - { name: destruction_method, type: enum, source: input, description: "INCINERATION | CHEMICAL_NEUTRALIZATION | RETURN_TO_MANUFACTURER" }
      - { name: destruction_report_ref, type: string, source: computed, description: "Server-minted report reference DEST-<seq>" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DESTRUCTION_CONFIRMED", default: DRAFT }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CallPlan
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /field-force/call-plans/{id}/publish"
        actor: DistrictManager
        preconditions:
          - "Territory.status == ACTIVE (ERR_TERRITORY_NOT_ACTIVE)"
          - "Plan has >= 1 ACTIVE TargetListEntry (ERR_EMPTY_TARGET_LIST)"
          - "No other PUBLISHED plan exists for the territory whose cycle overlaps [cycle_start_date, cycle_end_date) (ERR_PLAN_CYCLE_OVERLAP)"
        side_effects:
          - "Territory.alignment_posture := PUBLISHED"
          - "published_at := logical clock now"

      - from: PUBLISHED
        to: LOCKED
        trigger: "system — first CallVisit linked to this plan reaches COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "Territory.alignment_posture := LOCKED"
          - "No further TargetListEntry edits permitted for this territory while plan LOCKED"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /field-force/call-plans (new plan for same territory with expected_territory_version OCC)"
        actor: DistrictManager
        preconditions:
          - "New plan payload carries expected_territory_version matching Territory.version"
        side_effects:
          - "CANCELLED all SCHEDULED CallVisits of the old plan"
          - "PENDING_SIGNATURE disbursements on cancelled visits -> VOIDED; their reserved quantities released"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /field-force/call-plans (supersede)"
        actor: DistrictManager
        preconditions:
          - "Old plan has zero COMPLETED visits (else it is LOCKED and cannot be superseded — ERR_PLAN_LOCKED)"
        side_effects:
          - "CANCELLED all SCHEDULED CallVisits"
          - "PENDING_SIGNATURE disbursements -> VOIDED"

  - entity: CallVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /field-force/call-visits/{id}/complete"
        actor: FieldRep
        preconditions:
          - "Acting rep (X-User-ID) == CallVisit.representative_id (ERR_NOT_VISIT_OWNER)"
          - "Prescriber.eligibility_status == ELIGIBLE at completion time (ERR_PRESCRIBER_NOT_ELIGIBLE)"
          - "TargetListEntry.status == ACTIVE (ERR_TARGET_ENTRY_INACTIVE)"
          - "Representative.compliance_standing != SUSPENDED (ERR_REP_SUSPENDED)"
          - "Logical clock now within [scheduled_start, scheduled_end + 24h) (ERR_VISIT_WINDOW_EXPIRED)"
        side_effects:
          - "completed_at := now; delivered_calls on TargetListEntry += 1"
          - "attainment variants recomputed"
          - "If this is the plan's first COMPLETED visit: CallPlan PUBLISHED -> LOCKED, Territory.alignment_posture := LOCKED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /field-force/call-visits/{id}/cancel"
        actor: FieldRep | DistrictManager
        preconditions:
          - "Visit must be SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "PENDING_SIGNATURE disbursements on this visit -> VOIDED; reserved qty released (in_transit / available recalcs)"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /field-force/call-visits/{id}/mark-no-show"
        actor: FieldRep
        preconditions:
          - "Logical clock now >= scheduled_end (ERR_VISIT_NOT_DUE)"
        side_effects: []

  - entity: SampleDisbursement
    initial_state: PENDING_SIGNATURE
    terminal_states: [SIGNED, REJECTED, VOIDED]
    transitions:
      - from: PENDING_SIGNATURE
        to: SIGNED
        trigger: "POST /field-force/sample-disbursements/{id}/capture-signature"
        actor: FieldRep
        preconditions:
          - "Parent CallVisit.call_status == COMPLETED (ERR_VISIT_NOT_COMPLETED)"
          - "signature_payload present and >= 32 chars (ERR_SIGNATURE_REQUIRED)"
          - "SampleLot.status == RELEASED at capture time (ERR_LOT_NOT_RELEASABLE) — a lot quarantined between visit completion and signature capture rejects the signature"
        side_effects:
          - "signed_at := now"
          - "RepLotBalance.qty_dispensed += quantity; qty_available_* recomputed"
          - "TargetListEntry.delivered_sample_units += quantity; if delivered_sample_units >= planned_sample_units -> entry.status := CAP_EXHAUSTED"
          - "Prescriber YTD usage += quantity; if YTD usage >= product.annual_max_units_per_prescriber: prescriber.eligibility_status -> INELIGIBLE (cascade hop 2)"
          - "If prescriber went INELIGIBLE: all SCHEDULED future CallVisits for that prescriber -> CANCELLED (cascade hop 3)"

      - from: PENDING_SIGNATURE
        to: REJECTED
        trigger: "POST /field-force/sample-disbursements/{id}/reject-signature"
        actor: FieldRep | ComplianceOfficer
        preconditions: []
        side_effects:
          - "signature_status on parent visit := REJECTED"
          - "Reserved quantity released back to RepLotBalance.qty_available_*"

      - from: PENDING_SIGNATURE
        to: VOIDED
        trigger: "system — parent CallVisit CANCELLED, or parent CallPlan SUPERSEDED, or lot EXPIRED/QUARANTINED sweep"
        actor: system
        preconditions: []
        side_effects:
          - "Reserved quantity released"

  - entity: SampleTransfer
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, REJECTED, CANCELLED, REVERSED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /field-force/sample-transfers/{id}/accept"
        actor: FieldRep
        preconditions:
          - "X-User-ID == to_rep_id (ERR_NOT_TRANSFER_RECEIVER) — receiver accepts, sender cannot accept own transfer (segregation of duties)"
          - "SampleLot.status == RELEASED (ERR_LOT_NOT_RELEASABLE)"
          - "Both from_rep and to_rep status == ACTIVE and in territories with status == ACTIVE (ERR_REP_INACTIVE)"
          - "Sender RepLotBalance.qty_in_transit_out still covers quantity (ERR_INSUFFICIENT_RESERVED)"
        side_effects:
          - "from balance: qty_transferred_out += qty; qty_in_transit_out −= qty"
          - "to balance: qty_transferred_in += qty"
          - "Conservation invariant: total field-force units unchanged"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /field-force/sample-transfers/{id}/reject"
        actor: FieldRep
        preconditions:
          - "X-User-ID == to_rep_id (ERR_NOT_TRANSFER_RECEIVER)"
        side_effects:
          - "Sender qty_in_transit_out −= qty (reserve released)"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /field-force/sample-transfers/{id}/cancel"
        actor: FieldRep
        preconditions:
          - "X-User-ID == from_rep_id (ERR_NOT_TRANSFER_SENDER)"
        side_effects:
          - "Sender qty_in_transit_out −= qty"

      - from: ACCEPTED
        to: REVERSED
        trigger: "POST /field-force/sample-transfers/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "Transfer ACCEPTED and SampleLot still RELEASED"
        side_effects:
          - "from balance: qty_transferred_out −= qty"
          - "to balance: qty_transferred_in −= qty"
          - "Conservation invariant re-verified"

  - entity: InventoryCountSession
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: COUNTED
        trigger: "POST /field-force/inventory-count-sessions/{id}/submit-count"
        actor: FieldRep
        preconditions:
          - "X-User-ID == counter_rep_id (ERR_NOT_COUNT_COUNTER)"
          - "Every CountLine for the session has counted_qty set (ERR_INCOMPLETE_COUNT)"
        side_effects:
          - "variance_qty computed per line"

      - from: COUNTED
        to: RECONCILED
        trigger: "POST /field-force/inventory-count-sessions/{id}/reconcile"
        actor: DistrictManager
        preconditions:
          - "Acting manager is custodian's manager_rep_id (ERR_NOT_CUSTODIAN_MANAGER)"
        side_effects:
          - "session.variance_pct := sum(|variance_qty|) / max(sum(expected_qty),1) * 100"
          - "disciplinary_tier assigned per thresholds: < 2.0 -> NONE; >= 2.0 and < 5.0 -> COUNSELING; >= 5.0 and < 10.0 -> WRITTEN_WARNING; >= 10.0 -> SUSPENSION_REVIEW"
          - "If tier >= WRITTEN_WARNING: custodian.compliance_standing := WATCH"
          - "If tier == SUSPENSION_REVIEW: custodian.compliance_standing := SUSPENDED (cascade hop 2)"
          - "If custodian SUSPENDED: all their SCHEDULED CallVisits -> CANCELLED and REQUESTED transfers out auto-CANCELLED (cascade hop 3)"

      - from: RECONCILED
        to: OPEN
        trigger: "POST /field-force/inventory-count-sessions/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "Session RECONCILED (rework loop; max 3 reopens — ERR_REOPEN_LIMIT_EXCEEDED)"
        side_effects:
          - "custodian.compliance_standing recomputed from scratch (tier reverted to NONE pending new reconcile)"
          - "Counted quantities cleared"

      - from: RECONCILED
        to: CLOSED
        trigger: "POST /field-force/inventory-count-sessions/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "Session RECONCILED"
        side_effects: []

      - from: OPEN
        to: VOIDED
        trigger: "POST /field-force/inventory-count-sessions/{id}/void"
        actor: DistrictManager | ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: TemperatureExcursion
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /field-force/temperature-excursions/{id}/assess"
        actor: QualityAssurance
        preconditions: []
        side_effects:
          - "If severity == CRITICAL: every SampleLot of product_id held by this rep (qty_available_forward > 0) -> QUARANTINED with reason TEMPERATURE_EXCURSION (cascade hop 1)"
          - "Quarantined lots: PENDING_SIGNATURE disbursements referencing them -> VOIDED (cascade hop 2)"
          - "REQUESTED SampleTransfers referencing quarantined lots -> auto-CANCELLED (cascade hop 3)"
          - "RepLotBalance rows for quarantined lots: qty_available_* recomputed to exclude quarantined stock"

      - from: ASSESSED
        to: RESOLVED
        trigger: "POST /field-force/temperature-excursions/{id}/resolve"
        actor: QualityAssurance
        preconditions:
          - "For CRITICAL excursions: affected lots already DESTROYED or returned via SampleReturn (ERR_QUARANTINE_OPEN)"
        side_effects: []

  - entity: SampleReturn
    initial_state: DRAFT
    terminal_states: [DESTRUCTION_CONFIRMED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /field-force/sample-returns/{id}/submit"
        actor: FieldRep
        preconditions:
          - "quantity <= rep's qty_available_forward for that lot (ERR_INSUFFICIENT_BALANCE)"
          - "return_reason == EXPIRED requires lot.expiration_date <= logical clock now (ERR_RETURN_REASON_MISMATCH)"
        side_effects:
          - "RepLotBalance.qty_returned += quantity; qty_available_* recomputed"

      - from: SUBMITTED
        to: DESTRUCTION_CONFIRMED
        trigger: "POST /field-force/sample-returns/{id}/confirm-destruction"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceOfficer X-User-ID != returning representative (segregation of duties — ERR_SELF_CONFIRM_FORBIDDEN)"
        side_effects:
          - "destruction_report_ref := DEST-<zero-padded-seq> minted"
          - "SampleLot.quantity_available recomputed; if lot fully accounted (received = dispensed + returned + destroyed) and expiration_date passed -> lot.status := DESTROYED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: transfer-request-stale-lot
    parent_entity: SampleLot
    write_endpoint: "POST /field-force/sample-transfers"
    occ_field: "expected_lot_version"
    description: |
      Creating a SampleTransfer against a SampleLot whose version has advanced
      since the requester last observed it is rejected. A transfer reserves
      units against the lot's availability; if another writer has since
      quarantined, issued, destroyed, or accepted transfers against that lot,
      the requester's view is stale and the reserve must not be taken.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-supersede-stale-territory
    parent_entity: Territory
    write_endpoint: "POST /field-force/call-plans"
    occ_field: "expected_territory_version"
    description: |
      Creating a CallPlan for a Territory whose version has advanced since the
      planner last observed it is rejected. Plan creation may legitimately
      supersede the prior DRAFT/PUBLISHED plan; if territory alignment has
      changed (realignment, cycle edit), the stale plan request must fail.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rep_available_units
    trigger: "any mutation touching RepLotBalance (issue, sign, reject, void, transfer request/accept/reject/cancel/reverse, return submit, excursion quarantine)"
    algorithm: aggregation
    formula: |
      qty_available_forward   = qty_issued − qty_dispensed − qty_returned
                                − qty_transferred_out − qty_in_transit_out
                                + qty_transferred_in
      qty_available_confirmed = qty_issued − qty_dispensed − qty_returned
                                − qty_transferred_out + qty_transferred_in
    input_set: "RepLotBalance row for (representative_id, lot_id); all quantities are integers >= 0"
    variants:
      - name: forward_looking
        when: "disbursement authorization, transfer request validation, return submit"
        difference: "Subtracts qty_in_transit_out — open REQUESTED transfers reserve stock"
      - name: confirmed_ledger
        when: "physical count expected_qty snapshot and reconciliation reporting"
        difference: "Ignores qty_in_transit_out — count reflects only completed ledger movements"

  - name: per_visit_disbursement_cap
    trigger: "POST /field-force/sample-disbursements (validation of requested quantity)"
    algorithm: threshold
    formula: |
      cap = min(
        product.per_visit_max_units,
        max(product.annual_max_units_per_prescriber − prescriber_ytd_used, 0),
        rep_balance.qty_available_forward,
        max(target_entry.planned_sample_units − target_entry.delivered_sample_units, 0)
      )
      Accept iff quantity >= 1 AND quantity <= cap.
    input_set: "Product, Prescriber YTD usage across ALL reps (sum of SIGNED disbursements in current calendar year), RepLotBalance, TargetListEntry"
    constants: {}
    precision: "integer units; all four terms evaluated before min()"

  - name: call_attainment
    trigger: "CallVisit COMPLETED or CANCELLED; TargetListEntry read"
    algorithm: aggregation
    formula: |
      call_attainment_pct_planned_basis   = round_half_up(delivered_calls / planned_calls_per_cycle * 100, 2)
      call_attainment_pct_delivered_basis = round_half_up(delivered_calls / max(delivered_calls + open_scheduled_calls, 1) * 100, 2)
      where open_scheduled_calls = count of CallVisits for this entry with call_status == SCHEDULED
    input_set: "TargetListEntry + its CallVisits in the current territory cycle"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: planned_basis
        when: "manager attainment dashboards"
        difference: "Denominator fixed at plan time"
      - name: delivered_basis
        when: "rep self-service progress view"
        difference: "Denominator shrinks as scheduled calls are cancelled — same delivered_calls yields a HIGHER percentage"

  - name: count_variance_and_discipline
    trigger: "InventoryCountSession COUNTED -> RECONCILED"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned: (1) line variances, (2) session variance_pct,
      # (3) disciplinary tier from variance_pct. tier NEVER feeds back into
      # variance_pct — the apparent circularity is broken by this order.
      variance_qty(line)   = counted_qty − expected_qty
      variance_pct(session) = round_half_up(sum(|variance_qty|) / max(sum(expected_qty), 1) * 100, 2)
      tier = NONE                if variance_pct <  2.0
             COUNSELING          if 2.0  <= variance_pct <  5.0
             WRITTEN_WARNING     if 5.0  <= variance_pct < 10.0
             SUSPENSION_REVIEW   if variance_pct >= 10.0
    input_set: "CountLine rows of the session; expected_qty snapshotted at OPEN from qty_available_forward"
    constants:
      TIER_COUNSELING_MIN: 2.0
      TIER_WRITTEN_MIN: 5.0
      TIER_SUSPENSION_MIN: 10.0
    precision: "2 decimal places, round_half_up; boundary uses >= on the lower edge of each tier"

  - name: temperature_excursion_severity
    trigger: "POST /field-force/temperature-excursions (creation)"
    algorithm: threshold
    formula: |
      outside = max(observed_temp_c − product.storage_temp_max_c,
                    product.storage_temp_min_c − observed_temp_c, 0)
      severity = MINOR    if outside == 0  OR  (outside <= 2.0 AND excursion_minutes <= 30)
                 MAJOR    if (outside > 2.0 AND outside <= 5.0) OR (outside <= 2.0 AND excursion_minutes > 30)
                 CRITICAL if outside > 5.0 OR excursion_minutes > 240
    input_set: "Product storage band, observed_temp_c, excursion_minutes"
    precision: "1 decimal place on outside; boundary comparisons use strict > as written"

  - name: territory_sample_allocation_rounding
    trigger: "POST /field-force/call-plans (auto-seed of planned_sample_units per entry) — and plan republish"
    algorithm: waterfall_allocation
    formula: |
      # Nested rounding — order pinned: round PER ENTRY first, then sum.
      # per_entry = round_half_up(territory_cycle_budget_units * tier_weight / sum_weights, 0)
      #   tier_weight: A=6, B=3, C=1
      # total_planned_calls (and the territory sample budget consumption) is the
      # SUM OF THE PER-ENTRY ROUNDED values — NOT round(sum(raw)). The two orders
      # differ by up to (n_entries − 1) * 0.5 units; the scaffold pins per-entry-
      # then-sum. Largest-remainder redistribution is NOT applied.
      per_entry_units(e) = round_half_up(cycle_budget_units * weight(e.tier) / sum_weights, 0)
      territory_consumed = Σ per_entry_units(e)   # no final re-round
    input_set: "ACTIVE TargetListEntry rows of the territory at plan creation"
    constants:
      TIER_WEIGHT_A: 6
      TIER_WEIGHT_B: 3
      TIER_WEIGHT_C: 1
    precision: "integer units, round_half_up applied per entry only"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, quantity >= 1, documentation_note >= 20 chars"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_lot_version / expected_territory_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /field-force/sample-transfers, POST /field-force/call-plans"

  - priority: 6
    category: state
    check: "Entity in a from-state permitted by its state machine for this trigger"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_safety
    check: "Prescriber eligibility: ELIGIBLE required at disbursement creation AND at visit completion; DEA number required when product.controlled"
    error_id: ERR_PRESCRIBER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /field-force/sample-disbursements, POST /field-force/call-visits/{id}/complete"

  - priority: 8
    category: business_safety
    check: "Lot releasability: SampleLot.status == RELEASED and expiration_date > logical clock now at disbursement creation, signature capture, transfer request, transfer accept"
    error_id: ERR_LOT_NOT_RELEASABLE
    http_status: 422
    applies_to: "disbursement create/capture, transfer request/accept"

  - priority: 9
    category: business_temporal
    check: "Visit scheduling: no overlapping CallVisit for same representative where [start,end) intersects an existing non-cancelled visit's [start,end) — back-to-back (end == start) is allowed"
    error_id: ERR_VISIT_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /field-force/call-visits"

  - priority: 10
    category: business_temporal
    check: "Count-session scheduling: no two non-VOIDED InventoryCountSessions for the same custodian with overlapping windows, AND a minimum gap of 24h between window_end of the earlier session and window_start of the later"
    error_id: ERR_COUNT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /field-force/inventory-count-sessions"

  - priority: 11
    category: business_referential
    check: "Segregation of duties: counter_rep_id != representative_id AND counter_rep_id != custodian.manager_rep_id; transfer sender != receiver; destruction confirmer != returning rep"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 422
    applies_to: "count session create, transfer create, return confirm-destruction"

  - priority: 12
    category: business_fiscal
    check: "Quantity caps: per_visit_disbursement_cap (four-term min), transfer quantity <= qty_available_forward, return quantity <= qty_available_forward"
    error_id: ERR_QUANTITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "disbursement create, transfer create, return submit"

  - priority: 13
    category: business_fiscal
    check: "Territory sample budget: sum of per-entry planned units must not exceed territory cycle budget"
    error_id: ERR_TERRITORY_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /field-force/call-plans"

