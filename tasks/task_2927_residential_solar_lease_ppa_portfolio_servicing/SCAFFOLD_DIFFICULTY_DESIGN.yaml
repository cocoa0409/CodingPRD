  - rule_id: boundary_precision_check
    instances:

      - name: metered_kwh_exactly_at_guarantee_floor_earns_no_credit
        grounds:
          - calculations.monthly_expected_production
          - calculations.monthly_shortfall_credit
          - calculations.period_net_settlement
          - state_machines.ProductionPeriod.RECONCILED_to_CREDIT_ISSUED
        distinguishing_aspect: |
          June 2026 on a 9600 kWh guarantee has gross_expected 1075 kWh (9600 * 0.1120
          = 1075.2, ROUND_HALF_UP to 1075) and a guarantee floor of 1021 (1075 * 0.95 =
          1021.25 -> 1021). Metering exactly 1021 kWh is NOT a shortfall because the
          comparison is strict (metered < floor); 1020 kWh is a 1 kWh shortfall worth
          exactly 15 cents (15178 millicents / 1000 = 15.178 -> 15). Off-by-one on the
          comparison, or truncation instead of ROUND_HALF_UP anywhere in the chain,
          moves at least one of the three periods.
        test_recipe:
          setup:
            - "Clock at 2026-07-10T00:00:00Z: June 2026 has elapsed, and the due date 2026-07-21 has not passed, so no late fee can mask a rounding error."
            - "Three ACTIVE PPA agreements with identical terms: start 2025-01-01, escalator 0.029, base rate 14750, 9600 kWh, band 0.05, 7.20 kW. June 2026 sits in contract year 2, so the escalated rate is 15178 millicents."
            - "No roof work and no excused outages anywhere, so adjusted_expected_kwh == gross_expected_kwh == 1075 on all three."
            - "Each agreement gets exactly one ProductionPeriod for 2026-06, reconciled with issue_credit true: metered 1022 (above floor), 1021 (exactly at floor), 1020 (one below floor)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
