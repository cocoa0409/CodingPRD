    code: 200
    input: []
    output: TailEndorsement
    side_effects: []

  - method: GET
    path: "/mpl/tail-endorsements"
    description: "List tail endorsements, filterable by policy and by triggering term"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["policy_id?", "triggering_term_id?", "tail_type?", "status?", "limit?", "offset?"]
    output: TailEndorsement[]
    side_effects: []

  - method: POST
    path: "/mpl/tail-endorsements/{id}/issuance"
    description: "Issue a quoted tail endorsement, opening its extended reporting window as a coverage trigger"
    roles: [UnderwritingOfficer]
    code: 200
    input: []
    output: TailEndorsement
    side_effects:
      - "status set to ISSUED and issued_at recorded"
      - "the closed reporting window becomes available to coverage_trigger_resolution at claim intake"

  # --- Claim ----------------------------------------------------------------
  - method: POST
    path: "/mpl/claims"
    description: "Intake a claim, resolve the responding coverage trigger and assign the severity band"
    roles: [ClaimsAdjuster]
    code: 201
    input: [insured_id, incident_date, report_date, venue_code, allegation_category, demand_amount]
    output: Claim
    side_effects:
      - "coverage_trigger_resolution runs, setting policy_term_id, tail_endorsement_id, coverage_status, denial_reason, severity_band and severity_band_factor"
      - "claim_status initialised to INTAKE"
      - "Insured.open_claim_count recomputed, then Insured.risk_class_* recomputed"
      - "every DRAFT PolicyTerm with rating_variant == RENEWAL_PROSPECTIVE on the insured's policies is re-rated"

  - method: GET
    path: "/mpl/claims/{id}"
    description: "Read one claim with both lifecycle axes and its full money block"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer, Insured]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/mpl/claims"
    description: "List claims, filterable by insured, responding term, responding tail and both lifecycle axes"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["insured_id?", "policy_term_id?", "tail_endorsement_id?", "claim_status?", "coverage_status?", "venue_code?", "allegation_category?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/mpl/claims/{id}/coverage-decision"
    description: "Record the adjuster's coverage position, advancing the handling axis into investigation"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["coverage_status", "reserved_rights_reason?"]
    output: Claim
    side_effects:
      - "coverage_status set on the coverage axis; denial_reason set to ADJUSTER_DENIAL on a denial; reserved_rights_reason recorded on a reservation of rights"
      - "claim_status advanced from INTAKE to INVESTIGATION on the handling axis for all three outcomes"
      - "Insured.open_claim_count and Insured.risk_class_* recomputed when coverage became DENIED"

  - method: POST
    path: "/mpl/claims/{id}/reserve-entries"
    description: "Post a case-basis or formula-basis reserve entry; guarded by optimistic concurrency on the claim"
    roles: [ClaimsAdjuster]
    code: 201
    input: ["method", "indemnity_amount?", "expense_amount?", "effective_at", "rationale", "expected_claim_version"]
    output: ReserveEntry
    side_effects:
      - "increments Claim.version by 1"
      - "case_reserve_projection runs, setting computed_indemnity_amount and computed_expense_amount on the entry"
      - "Claim.indemnity_reserve, expense_reserve and reserve_method_current re-derived from the effective entry (greatest effective_at, then greatest created_at)"
      - "Claim.case_incurred and Claim.actuarial_incurred recomputed under both claim_incurred_loss variants"

  - method: GET
    path: "/mpl/claims/{id}/reserve-entries"
    description: "List the append-only reserve postings of a claim"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["method?", "limit?", "offset?"]
    output: ReserveEntry[]
    side_effects: []

  - method: POST
    path: "/mpl/claims/{id}/litigation"
    description: "Record that suit has been filed, advancing the handling axis into litigation"
    roles: [ClaimsAdjuster]
    code: 200
    input: [suit_filed_on]
    output: Claim
    side_effects:
      - "claim_status set to LITIGATION and suit_filed_on recorded"
      - "coverage_status left untouched on the independent coverage axis"

  - method: POST
    path: "/mpl/claims/{id}/expense-payments"
    description: "Pay allocated loss adjustment expense to the assigned defence firm"
    roles: [ClaimsAdjuster]
    code: 200
    input: [amount, invoice_reference, counsel_assignment_id]
    output: Claim
    side_effects:
      - "Claim.paid_expense increased by amount"
      - "CounselAssignment.billed_expense_amount increased by amount"
      - "DefenseCounselFirm.billed_expense_total increased by amount"
      - "Claim.case_incurred and Claim.actuarial_incurred recomputed, which diverge once paid_expense is non-zero"

  - method: POST
    path: "/mpl/claims/{id}/disposition"
    description: "Record a tried or dismissed disposition, resolving the claim and any reporting obligation"
    roles: [ClaimsAdjuster]
    code: 200
    input: ["disposition", "verdict_amount?", "resolved_on"]
    output: Claim
    side_effects:
      - "claim_status set to RESOLVED; disposition, verdict_amount and resolved_on recorded"
      - "on PLAINTIFF_VERDICT: paid_indemnity increased by min(verdict_amount, Policy.limit_per_claim), PolicyTerm.aggregate_limit_remaining debited, and an NPDBReport created"
      - "indemnity_reserve and expense_reserve set to 0.00; case_incurred and actuarial_incurred recomputed"
      - "every ASSIGNED CounselAssignment on the claim set to CLOSED and DefenseCounselFirm.open_assignment_count decremented"
      - "Insured.open_claim_count, closed_paid_claim_count and risk_class_* recomputed"
    note: "disposition == SETTLED is rejected here; a settlement is recorded only through the negotiation payment endpoint."

  # --- DefenseCounselFirm ---------------------------------------------------
  - method: POST
    path: "/mpl/counsel-firms"
    description: "Admit a defence firm to the panel with its venue admissions, specialties, rate, quality score and capacity"
    roles: [ClaimsCommitteeApprover]
    code: 201
    input: ["firm_name", "admitted_venue_codes", "allegation_specialties", "blended_hourly_rate", "quality_score", "max_concurrent_assignments?", "conflict_insured_ids?"]
    output: DefenseCounselFirm
    side_effects: ["panel_status initialised to ACTIVE with open_assignment_count 0 and billed_expense_total 0.00"]

  - method: GET
    path: "/mpl/counsel-firms/{id}"
    description: "Read one panel defence firm"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: []
    output: DefenseCounselFirm
    side_effects: []

  - method: GET
    path: "/mpl/counsel-firms"
    description: "List panel defence firms"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["panel_status?", "venue_code?", "allegation_category?", "limit?", "offset?"]
    output: DefenseCounselFirm[]
    side_effects: []

  - method: POST
    path: "/mpl/counsel-firms/{id}/panel-status"
    description: "Change a firm's panel standing; removal replaces every open assignment it holds"
    roles: [ClaimsCommitteeApprover]
    code: 200
    input: [panel_status, reason]
    output: DefenseCounselFirm
    side_effects:
      - "panel_status and panel_status_reason updated"
      - "on REMOVED only: every CounselAssignment for the firm with assignment_status == ASSIGNED is set to REPLACED, open_assignment_count decremented for each, the firm's id appended to each affected Claim.excluded_counsel_firm_ids and Claim.counsel_reassignment_required set to true"
      - "on PROBATION: existing assignments are untouched but the firm stops being eligible for counsel_panel_selection"

  # --- CounselAssignment ----------------------------------------------------
  - method: POST
    path: "/mpl/claims/{id}/counsel-assignments"
    description: "Assign defence counsel to a claim by running the panel selector; the firm is chosen, not supplied"
    roles: [ClaimsAdjuster]
    code: 201
    input: []
    output: CounselAssignment
    side_effects:
      - "counsel_panel_selection runs, setting counsel_firm_id, selection_rank_snapshot and candidate_pool_size"
      - "assignment_status initialised to ASSIGNED and assigned_at recorded"
      - "DefenseCounselFirm.open_assignment_count incremented by 1"
      - "Claim.counsel_reassignment_required set to false"

  - method: GET
    path: "/mpl/counsel-assignments/{id}"
    description: "Read one counsel assignment"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: []
    output: CounselAssignment
    side_effects: []

  - method: GET
    path: "/mpl/counsel-assignments"
    description: "List counsel assignments, filterable by claim and by firm"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["claim_id?", "counsel_firm_id?", "assignment_status?", "limit?", "offset?"]
    output: CounselAssignment[]
    side_effects: []

  - method: POST
    path: "/mpl/counsel-assignments/{id}/decline"
    description: "Record that the assigned firm declined the matter, releasing its capacity and excluding it from reselection"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decline_reason]
    output: CounselAssignment
    side_effects:
      - "assignment_status set to DECLINED, decline_reason and closed_at recorded"
      - "DefenseCounselFirm.open_assignment_count decremented by 1, restoring the capacity counter to its pre-assignment value"
      - "the firm's id appended to Claim.excluded_counsel_firm_ids and Claim.counsel_reassignment_required set to true"

  # --- SettlementNegotiation ------------------------------------------------
  - method: POST
    path: "/mpl/claims/{id}/settlement-negotiations"
    description: "Open a settlement negotiation on a claim and request committee authority; guarded by optimistic concurrency on the claim"
    roles: [ClaimsAdjuster, ClaimsCommitteeApprover]
    code: 201
    input: [proposed_amount, authority_requested, expected_claim_version]
    output: SettlementNegotiation
    side_effects:
      - "increments Claim.version by 1"
      - "status initialised to AUTHORITY_REQUESTED with round_index 1 and prepared_by_user_id set to the acting X-User-ID"
      - "consent_clause_applied frozen from the responding Policy's consent_to_settle_clause"
      - "every other SettlementNegotiation on the claim whose status is not PAID or ABANDONED is set to ABANDONED"

  - method: GET
    path: "/mpl/settlement-negotiations/{id}"
    description: "Read one settlement negotiation"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer, Insured]
    code: 200
    input: []
    output: SettlementNegotiation
    side_effects: []

  - method: GET
    path: "/mpl/settlement-negotiations"
    description: "List settlement negotiations, filterable by claim and state"
    roles: [UnderwritingOfficer, ClaimsAdjuster, ClaimsCommitteeApprover, PeerReviewChair, ActuarialAnalyst, ChiefActuary, ComplianceOfficer]
    code: 200
    input: ["claim_id?", "status?", "consent_clause_applied?", "limit?", "offset?"]
    output: SettlementNegotiation[]
    side_effects: []

  - method: POST
    path: "/mpl/settlement-negotiations/{id}/authority-decision"
    description: "Grant or deny settlement authority; the decider may not be the preparer"
    roles: [ClaimsCommitteeApprover]
    code: 200
    input: ["decision", "granted_amount?", "approver_note"]
    output: SettlementNegotiation
    side_effects:
      - "status set to AUTHORITY_GRANTED or AUTHORITY_DENIED"
      - "authority_granted and approved_by_user_id recorded on a grant"

  - method: POST
    path: "/mpl/settlement-negotiations/{id}/consent-request"
    description: "Tender the proposed settlement to the insured for consent under the policy's consent-to-settle provision"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: SettlementNegotiation
    side_effects:
      - "status set to CONSENT_REQUESTED and consent_requested_at recorded"

  - method: POST
    path: "/mpl/settlement-negotiations/{id}/consent-response"
    description: "Insured consents to or vetoes the proposed settlement"
    roles: [Insured]
    code: 200
    input: ["response", "veto_reason?"]
    output: SettlementNegotiation
    side_effects:
      - "status set to CONSENT_GRANTED or VETOED and physician_response recorded"
      - "veto_reason recorded on a veto"

  - method: POST
    path: "/mpl/settlement-negotiations/{id}/revision"
    description: "Revise a vetoed or authority-denied offer, looping the negotiation back for fresh authority"
    roles: [ClaimsAdjuster]
    code: 200
    input: [proposed_amount, authority_requested]
    output: SettlementNegotiation
    side_effects:
      - "status set back to AUTHORITY_REQUESTED and round_index incremented by 1"
      - "proposed_amount and authority_requested overwritten; authority_granted, approved_by_user_id, physician_response and veto_reason reset to null"
      - "prepared_by_user_id set to the revising X-User-ID"

  - method: POST
    path: "/mpl/settlement-negotiations/{id}/hammer-invocation"
    description: "Invoke the hammer clause over the insured's veto and compute the insured's share of the projected excess"
    roles: [ClaimsCommitteeApprover]
    code: 200
    input: [notice_sent_on]
    output: SettlementNegotiation
    side_effects:
      - "status set to HAMMER_INVOKED, hammer_invoked set to true and notice_sent_on recorded"
      - "settlement_insured_share runs, setting hammer_exposure_estimate, insured_share_amount and carrier_share_amount"
      - "Claim.insured_share_receivable increased by insured_share_amount"

  - method: POST
    path: "/mpl/settlement-negotiations/{id}/payment"
    description: "Disburse the settlement, resolving the claim and creating the data bank reporting obligation"
    roles: [ClaimsAdjuster]
    code: 200
    input: [payment_date]
    output: SettlementNegotiation
    side_effects:
      - "status set to PAID; paid_amount set to carrier_share_amount under an invoked hammer and to proposed_amount otherwise; payment_date recorded"
      - "Claim.paid_indemnity increased by the disbursed amount and PolicyTerm.aggregate_limit_remaining debited by the same amount"
      - "Claim.claim_status set to RESOLVED, disposition set to SETTLED and resolved_on set to payment_date"
      - "Claim.indemnity_reserve and expense_reserve set to 0.00; case_incurred and actuarial_incurred recomputed"
      - "an NPDBReport is created; npdb_reportability decides whether it lands PENDING or VOID"
      - "every ASSIGNED CounselAssignment on the claim set to CLOSED and DefenseCounselFirm.open_assignment_count decremented"
      - "Insured.open_claim_count, closed_paid_claim_count and risk_class_* recomputed, then every DRAFT RENEWAL_PROSPECTIVE PolicyTerm on the insured's policies is re-rated"

