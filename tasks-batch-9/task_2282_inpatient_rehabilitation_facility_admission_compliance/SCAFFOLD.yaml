    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Clinician
    side_effects: ["status ACTIVE -> INACTIVE"]

  # -------------------------------------------------------------- Patient ----
  - method: POST
    path: "/patients"
    description: "Register a patient medical record at a facility"
    roles: [NurseCaseManager]
    code: 201
    input: [facility_id, mrn, full_name, birth_date, impairment_group_code, etiologic_diagnosis_code, comorbidity_tier]
