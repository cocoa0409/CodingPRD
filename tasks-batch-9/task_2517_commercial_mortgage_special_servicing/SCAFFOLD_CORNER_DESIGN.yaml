        distinguishing_aspect: "The deadline is a business-day walk, not issued_at + 14 days: from a Friday issue date the walk skips four weekend pairs and the pinned 2026-11-26 holiday, never counts the issue date itself, and lands on 2026-12-07 at 23:59:59.999Z — seventeen calendar days later for ten business days."
