      - name: inactive_models_and_frozen_carrier_accounts_block_their_operations
        claim_type: violation_to_error
        grounds:
          - validations.priority_64_ERR_DEVICE_MODEL_INACTIVE
          - validations.priority_61_ERR_CARRIER_ACCOUNT_NOT_PORTABLE
          - entities.DeviceModel.fields.active
          - entities.CarrierAccount.fields.port_freeze_flag
        distinguishing_aspect: |
          Both flag-driven refusals fire after their foreign key resolves, not instead of it: a
          retired model is found (no 404) and then refused with ERR_DEVICE_MODEL_INACTIVE, and a
          carrier account under a port freeze is found and then refused with
