# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Test Targeting Index (§1.8)
# Credit Union Membership & Field of Membership
# All numeric literals precomputed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dividend_method_adb_vs_minimum_balance_diverge
        grounds:
          - calculations.dividend_accrual
          - entities.DividendPayment.fields.accrued_amount_cents
          - entities.DividendDeclaration.fields.declared_pool_cents
        distinguishing_aspect: |
          Same account, same transactions, same period and rate: AVERAGE_DAILY_BALANCE
          yields 3896 cents while MINIMUM_DAILY_BALANCE yields 510 cents (ShareAccount
          dividend domain) — two valid methods producing different results for identical data.
        test_recipe:
          setup:
            - "Charter (par 500) with one OCCUPATIONAL segment; member approved 2026-06-15; PRIMARY account opened with 1,000,000 cents"
            - "Backdated postings: WITHDRAWAL 900,000 on 2026-07-20 (balance 100,000), DEPOSIT 500,000 on 2026-07-25 (balance 600,000)"
            - "July window balances: 19 days @1,000,000 + 5 days @100,000 + 7 days @600,000 = 23,700,000 day-cents"
            - "Clock at 2026-08-01; declaration for 2026-07-01..2026-07-31 at 600 bps, payable 2026-08-10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Ann Abel", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 1000000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "WITHDRAWAL", amount_cents: 900000, posted_date: "2026-07-20" }, as: OperationsOfficer }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 500000, posted_date: "2026-07-25" }, as: OperationsOfficer }
          trigger:
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl_adb: "$.data.id" } }
            - { call: "GET /credit-union/dividend-declarations/${decl_adb}/payments", as: BoardDirector, captures: { amt_adb: "$.data[0].accrued_amount_cents" } }
            - { call: "POST /credit-union/dividend-declarations/${decl_adb}/void", as: BoardDirector }
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "MINIMUM_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl_min: "$.data.id", pool_min: "$.data.declared_pool_cents" } }
            - { call: "GET /credit-union/dividend-declarations/${decl_min}/payments", as: BoardDirector, captures: { amt_min: "$.data[0].accrued_amount_cents" } }
          assert:
            - "amt_adb == 3896 (23,700,000 * 0.06 / 365 = 3895.89 -> 3896)"
            - "amt_min == 510 (min balance 100,000 * 0.06 * 31 / 365 = 509.59 -> 510)"
            - "amt_adb != amt_min for identical account data"
            - "pool_min == 510 and declaration ${decl_adb} is VOIDED so the re-declaration of the same period is accepted"

      - name: tier_current_vs_trailing90_same_member_same_day
        grounds:
          - calculations.member_tier_evaluation
          - entities.Member.fields.tier
          - entities.ProductEnrollment.fields.tier_at_enrollment
        distinguishing_aspect: |
          Same member, same evaluation date: the CURRENT_POINT_IN_TIME variant used at
          enrollment yields SELECT (balance 1,000,000), while the TRAILING_90_AVERAGE
          variant used by tier-review yields STANDARD (90-day average 180,000) —
          Member-domain dual variants, distinct from the ShareAccount dividend domain.
        test_recipe:
          setup:
            - "Member approved 2025-05-01 (tenure 15 months by 2026-08-01); PRIMARY account opened 2025-05-01 with 100,000 cents"
            - "DEPOSIT 900,000 posted 2026-07-25 -> current balance 1,000,000"
            - "Trailing 90-day window 2026-05-04..2026-08-01: 82 days @100,000 + 8 days @1,000,000 -> average 180,000 < 500,000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Tess Tier", date_of_birth: "1988-03-03", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 100000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-25T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 900000, posted_date: "2026-07-25" }, as: OperationsOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /credit-union/product-enrollments", payload: { member_id: "${m1}", product_code: "MONEY_MARKET", funding_share_account_id: "${acct1}" }, as: MembershipOfficer, captures: { enroll_tier: "$.data.tier_at_enrollment" } }
            - { call: "POST /credit-union/members/${m1}/tier-review", as: OperationsOfficer, captures: { swept_tier: "$.data.tier" } }
          assert:
            - "enroll_tier == SELECT (current balance 1,000,000 >= 500,000 and tenure 15 >= 12)"
            - "swept_tier == STANDARD (trailing-90 average 180,000 < 500,000)"
            - "the two variants disagree for the same member on the same date"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: dividend_tier_bonus_conditional_branches
        grounds:
          - calculations.dividend_accrual
          - calculations.member_tier_evaluation
        distinguishing_aspect: |
          Mode (a): dividend raw amount is a >=3-input non-linear formula (daily balance
          series x rate band x member-tier conditional bonus x minimum-balance gate);
          two members with identical 500,000-cent July balances but different tiers accrue
          2548 (STANDARD) vs 2654 (SELECT, +25 bps) — the conditional tier branch changes
          the result, and the pool sums both branches.
        test_recipe:
          setup:
            - "Member m2 approved 2025-07-01, PRIMARY 500,000 constant; tier-review on 2026-07-15 -> SELECT (trailing avg 500,000, tenure 12)"
            - "Member m1 approved 2026-06-15, PRIMARY 500,000 constant; stays STANDARD (tenure < 12)"
            - "Declaration for 2026-07-01..2026-07-31 at 600 bps ADB, payable 2026-08-10; payment rows created in account created_at order (m2's account first)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Senior Sue", date_of_birth: "1985-05-05", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app2: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app2}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m2: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m2}", account_type: "PRIMARY", initial_deposit_cents: 500000 }, as: MembershipOfficer, captures: { acct2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Junior Jay", date_of_birth: "1995-06-06", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 500000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/members/${m2}/tier-review", as: OperationsOfficer, captures: { m2_tier: "$.data.tier" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl_id: "$.data.id", pool: "$.data.declared_pool_cents" } }
            - { call: "GET /credit-union/dividend-declarations/${decl_id}/payments", as: BoardDirector, captures: { amt_first: "$.data[0].accrued_amount_cents", acct_first: "$.data[0].share_account_id", bonus_first: "$.data[0].tier_bonus_bps_applied", amt_second: "$.data[1].accrued_amount_cents", acct_second: "$.data[1].share_account_id", bonus_second: "$.data[1].tier_bonus_bps_applied" } }
          assert:
            - "m2_tier == SELECT"
            - "acct_first == ${acct2} (rows ordered by account created_at ASC) and amt_first == 2654 (500,000 * 0.0625 * 31 / 365 = 2654.11 -> 2654) and bonus_first == 25"
            - "acct_second == ${acct1} and amt_second == 2548 (500,000 * 0.06 * 31 / 365 = 2547.95 -> 2548) and bonus_second == 0"
            - "pool == 5202 (2654 + 2548)"

      - name: dividend_pool_round_per_account_then_sum
        grounds:
          - calculations.dividend_pool_total
          - entities.DividendDeclaration.fields.declared_pool_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with two accounts at 10,000 cents constant over 31 days
          at 700 bps, each raw accrual is 59.4521 cents; pinned order (round each account
          half-up, then sum) yields pool 118, whereas summing raw values first and rounding
          once would yield 119 — the scaffold pins per-account-first rounding.
        test_recipe:
          setup:
            - "Two members approved 2026-06-15; each opens a PRIMARY account with exactly 10,000 cents; no further transactions"
            - "Both members STANDARD (tenure < 12) so tier bonus is 0"
            - "raw per account = 10,000 * 31 * 0.07 / 365 = 59.4521 cents"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Round One", date_of_birth: "1991-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 10000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Round Two", date_of_birth: "1992-02-02", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app2: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app2}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m2: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m2}", account_type: "PRIMARY", initial_deposit_cents: 10000 }, as: MembershipOfficer, captures: { acct2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 700, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl_id: "$.data.id", pool: "$.data.declared_pool_cents" } }
            - { call: "GET /credit-union/dividend-declarations/${decl_id}/payments", as: BoardDirector, captures: { amt_first: "$.data[0].accrued_amount_cents", amt_second: "$.data[1].accrued_amount_cents" } }
          assert:
            - "amt_first == 59 and amt_second == 59 (59.4521 rounded half-up per account)"
            - "pool == 118 (round-per-account-then-sum), NOT 119 (sum-then-round of 118.9042)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_documentation_loop_cycles_twice
        grounds:
          - state_machines.MembershipApplication.UNDER_REVIEW_to_DOCS_REQUESTED
          - state_machines.MembershipApplication.DOCS_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on MembershipApplication: UNDER_REVIEW -> DOCS_REQUESTED ->
          UNDER_REVIEW -> DOCS_REQUESTED -> UNDER_REVIEW -> APPROVED — the documentation
          loop is traversed twice before approval, proving cycle re-entry (not a linear pipeline).
        test_recipe:
          setup:
            - "Charter with OCCUPATIONAL segment requiring [GOVERNMENT_ID, EMPLOYER_LETTER]"
            - "Application filed with only GOVERNMENT_ID (docs_complete false)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Loopy Lou", date_of_birth: "1993-03-03", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id", docs_complete_0: "$.data.docs_complete" } }
          trigger:
            - { call: "POST /credit-union/membership-applications/${app1}/request-documents", payload: { requested_document_codes: ["EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { st1: "$.data.status" } }
            - { call: "POST /credit-union/membership-applications/${app1}/submit-documents", payload: { documents_provided: ["EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { st2: "$.data.status", docs_complete_1: "$.data.docs_complete" } }
            - { call: "POST /credit-union/membership-applications/${app1}/request-documents", payload: { requested_document_codes: ["ADDRESS_PROOF"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { st3: "$.data.status" } }
            - { call: "POST /credit-union/membership-applications/${app1}/submit-documents", payload: { documents_provided: ["ADDRESS_PROOF"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { st4: "$.data.status" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { st5: "$.data.status", m1: "$.data.resulting_member_id" } }
          assert:
            - "docs_complete_0 == false (EMPLOYER_LETTER missing)"
            - "st1 == DOCS_REQUESTED, st2 == UNDER_REVIEW, docs_complete_1 == true"
            - "st3 == DOCS_REQUESTED and st4 == UNDER_REVIEW (second traversal of the cycle)"
            - "st5 == APPROVED and ${m1} references a Member with status ACTIVE and tier STANDARD"

      - name: meeting_adjourn_reconvene_chain_cycle
        grounds:
          - state_machines.AnnualMeeting.SCHEDULED_to_ADJOURNED_NO_QUORUM
          - state_machines.AnnualMeeting.ADJOURNED_NO_QUORUM_to_SCHEDULED
          - calculations.quorum_and_tally
        distinguishing_aspect: |
          Cyclic machine on AnnualMeeting (different entity than MembershipApplication):
          SCHEDULED -> ADJOURNED_NO_QUORUM -> (reconvene) new SCHEDULED successor ->
          HELD; the chain loops until quorum, and ballots cast on the adjourned meeting
          remain live in the chain.
        test_recipe:
          setup:
            - "Three members approved 2026-07-01 (effective <= record_date 2026-07-05)"
            - "Meeting M1: record 2026-07-05, voting_open 2026-07-10, meeting_date 2026-07-20, quorum_threshold 3"
            - "Only two of three members cast on M1 by 2026-07-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Ava", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appA: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appA}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mA: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Ben", date_of_birth: "1990-02-02", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appB: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appB}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mB: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Cy", date_of_birth: "1990-03-03", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appC: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appC}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mC: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-07-20", record_date: "2026-07-05", voting_open_date: "2026-07-10", quorum_threshold: 3 }, as: BoardDirector, captures: { mtg1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "FOR_SLATE_A" }, as: Member, as_user_id: "${mA}" }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "FOR_SLATE_B" }, as: Member, as_user_id: "${mB}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/annual-meetings/${mtg1}/close-and-tally", as: BoardDirector, captures: { st1: "$.data.status", qm1: "$.data.quorum_met", bc1: "$.data.ballots_counted" } }
            - { call: "POST /credit-union/annual-meetings/${mtg1}/reconvene", payload: { meeting_date: "2026-07-25", voting_open_date: "2026-07-16" }, as: BoardDirector, captures: { mtg2: "$.data.id", mtg2_from: "$.data.reconvened_from_id", mtg2_status: "$.data.status" } }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg2}", choice: "FOR_SLATE_A" }, as: Member, as_user_id: "${mC}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-25T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/annual-meetings/${mtg2}/close-and-tally", as: BoardDirector, captures: { st2: "$.data.status", qm2: "$.data.quorum_met", bc2: "$.data.ballots_counted", va2: "$.data.votes_for_slate_a", vb2: "$.data.votes_for_slate_b" } }
          assert:
            - "st1 == ADJOURNED_NO_QUORUM, qm1 == false, bc1 == 2 (2 < 3)"
            - "mtg2_from == ${mtg1} and mtg2_status == SCHEDULED (chain cycle re-entry)"
            - "mC's ballot on ${mtg2} is accepted on 2026-07-20 (within successor window 2026-07-16..2026-07-25) because chain ballots carry over"
            - "st2 == HELD, qm2 == true, bc2 == 3, va2 == 2, vb2 == 1 (chain-wide tally)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: grace_expiry_cascade_member_account_enrollment
        grounds:
          - state_machines.Member.GRACE_PERIOD_to_CLOSED_INELIGIBLE
          - state_machines.ShareAccount.OPEN_to_CLOSED
          - state_machines.ProductEnrollment.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Depth-3 cascade from the clock sweep: grace expiry mutates Member ->
          CLOSED_INELIGIBLE; that mutation closes each OPEN ShareAccount (with a
          CLOSURE_DISBURSEMENT transaction); each account closure itself closes
          ProductEnrollments funded by that account.
        test_recipe:
          setup:
            - "Member approved 2025-06-01; PRIMARY 500,000 and SUPPLEMENTAL 50,000; MONEY_MARKET enrollment funded by the PRIMARY account (tier SELECT at enrollment: current balance 550,000, tenure 13)"
            - "Eligibility review flagged by co-1 on 2026-08-01, confirmed ineligible by co-2 -> GRACE_PERIOD, grace_end_date = 2026-10-30"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-06-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Cascade Cal", date_of_birth: "1987-07-07", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 500000 }, as: MembershipOfficer, captures: { acctP: "$.data.id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "SUPPLEMENTAL", initial_deposit_cents: 50000 }, as: MembershipOfficer, captures: { acctS: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/product-enrollments", payload: { member_id: "${m1}", product_code: "MONEY_MARKET", funding_share_account_id: "${acctP}" }, as: MembershipOfficer, captures: { enr1: "$.data.id", enr_tier: "$.data.tier_at_enrollment" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/members/${m1}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rev1: "$.data.id" } }
            - { call: "POST /credit-union/eligibility-reviews/${rev1}/confirm-ineligible", as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-29T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /credit-union/members/${m1}", as: ComplianceOfficer, captures: { st_before: "$.data.status", grace_end: "$.data.grace_end_date" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /credit-union/members/${m1}", as: ComplianceOfficer, captures: { st_after: "$.data.status" } }
            - { call: "GET /credit-union/members/${m1}/share-accounts", as: ComplianceOfficer, captures: { p_status: "$.data[0].status", p_reason: "$.data[0].closure_reason", p_bal: "$.data[0].balance_cents", s_status: "$.data[1].status", s_bal: "$.data[1].balance_cents" } }
            - { call: "GET /credit-union/share-accounts/${acctP}/transactions", as: ComplianceOfficer, captures: { last_kind: "$.data[1].kind", last_amt: "$.data[1].amount_cents", last_posted: "$.data[1].posted_date" } }
            - { call: "GET /credit-union/product-enrollments/${enr1}", as: ComplianceOfficer, captures: { enr_status: "$.data.status", enr_reason: "$.data.closure_reason" } }
          assert:
            - "enr_tier == SELECT (precondition: enrollment succeeded before ineligibility)"
            - "grace_end == 2026-10-30 and st_before == GRACE_PERIOD on 2026-10-29 (boundary: one day before grace end)"
            - "st_after == CLOSED_INELIGIBLE after the 2026-10-30 sweep (hop 1)"
            - "p_status == CLOSED, p_reason == FORCED_INELIGIBILITY, p_bal == 0; s_status == CLOSED, s_bal == 0 (hop 2, both accounts)"
            - "last_kind == CLOSURE_DISBURSEMENT, last_amt == 500000, last_posted == 2026-10-30 (hop 2 side effect)"
            - "enr_status == CLOSED and enr_reason == FORCED_ACCOUNT_CLOSURE (hop 3, caused by the PRIMARY account closure)"

      - name: amendment_effective_retire_segment_cascade
        grounds:
          - state_machines.CharterAmendmentApplication.APPROVED_to_EFFECTIVE
          - entities.EligibilitySegment.fields.status
          - state_machines.Member.ACTIVE_to_INELIGIBLE_UNDER_REVIEW
          - concurrency_rules[charter-amendment-stale-baseline]
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (amendment EFFECTIVE via clock sweep):
          the amendment mutates the segment to RETIRED; that retirement itself creates an
          OPEN EligibilityReview and flips each matching ACTIVE member to
          INELIGIBLE_UNDER_REVIEW — while a member on a different segment is untouched.
        test_recipe:
          setup:
            - "Charter with two OCCUPATIONAL segments (ACME, BETA); m1 matched to ACME, m2 matched to BETA; both ACTIVE"
            - "RETIRE_SEGMENT amendment for ACME submitted with the captured charter baseline (version 1 -> charter version 2), effective 2026-09-01, approved by the Regulator"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, { segment_type: "OCCUPATIONAL", descriptor: "BETA LLC employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id", charter_v1: "$.data.version" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg_acme: "$.data[0].id", seg_beta: "$.data[1].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Retiree Ray", date_of_birth: "1980-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg_acme}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Stable Sal", date_of_birth: "1981-02-02", basis: "SEGMENT_MATCH", segment_id: "${seg_beta}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app2: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app2}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m2: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/charter-amendment-applications", payload: { charter_id: "${charter_id}", amendment_type: "RETIRE_SEGMENT", retire_segment_ids: ["${seg_acme}"], effective_date: "2026-09-01", expected_charter_version: "${charter_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { amend1: "$.data.id" } }
            - { call: "POST /credit-union/charter-amendment-applications/${amend1}/approve", as: Regulator, as_user_id: "reg-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /credit-union/charters/${charter_id}/amendment-applications", as: ComplianceOfficer, captures: { am_st_before: "$.data[0].status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /credit-union/charters/${charter_id}/amendment-applications", as: ComplianceOfficer, captures: { am_st_after: "$.data[0].status" } }
            - { call: "GET /credit-union/charters/${charter_id}", as: ComplianceOfficer, captures: { charter_v_after: "$.data.version" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: ComplianceOfficer, captures: { acme_status: "$.data[0].status", acme_retired_at: "$.data[0].retired_at", beta_status: "$.data[1].status" } }
            - { call: "GET /credit-union/members/${m1}", as: ComplianceOfficer, captures: { m1_status: "$.data.status" } }
            - { call: "GET /credit-union/members/${m1}/eligibility-reviews", as: ComplianceOfficer, captures: { rev_reason: "$.data[0].reason", rev_status: "$.data[0].status", rev_flagger: "$.data[0].flagged_by_user_id" } }
            - { call: "GET /credit-union/members/${m2}", as: ComplianceOfficer, captures: { m2_status: "$.data.status" } }
          assert:
            - "am_st_before == APPROVED on 2026-08-31 (day before effective_date; sweep is date-gated)"
            - "am_st_after == EFFECTIVE on 2026-09-01 (hop 0 trigger)"
            - "charter_v_after == 3 (1 at creation + 1 at submission + 1 at EFFECTIVE) (hop 1)"
            - "acme_status == RETIRED and acme_retired_at == 2026-09-01; beta_status == ACTIVE (hop 1)"
            - "m1_status == INELIGIBLE_UNDER_REVIEW (hop 2)"
            - "rev_reason == SEGMENT_RETIRED, rev_status == OPEN, rev_flagger == system (hop 2 side effect)"
            - "m2_status == ACTIVE (unaffected member on the surviving segment)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: account_open_member_state_vs_par_value_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_MEMBER_NOT_ACTIVE]
          - errors[ERR_BELOW_PAR_VALUE]
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: opening a PRIMARY account for an
          INELIGIBLE_UNDER_REVIEW member with a below-par deposit violates both rules;
          the state error ERR_MEMBER_NOT_ACTIVE (priority 7) MUST win over
          ERR_BELOW_PAR_VALUE (priority 12).
        test_recipe:
          setup:
            - "Member approved 2026-07-01 with no accounts yet; manual review flagged (co-1) -> INELIGIBLE_UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Dual Fail", date_of_birth: "1990-09-09", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/members/${m1}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 100 }, as: MembershipOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MEMBER_NOT_ACTIVE (409), not ERR_BELOW_PAR_VALUE (422)"
            - "no ShareAccount is created (GET /members/${m1}/share-accounts returns an empty list)"

      - name: declaration_rate_band_constraint_vs_period_overlap_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_DIVIDEND_RATE_OUT_OF_BAND]
          - errors[ERR_DIVIDEND_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Pair business_constraint-vs-business_temporal (different categories than
          state-vs-fiscal): a declaration that is both out of the authorized rate band
          and overlapping an existing DECLARED period MUST surface
          ERR_DIVIDEND_RATE_OUT_OF_BAND (priority 10) ahead of ERR_DIVIDEND_PERIOD_OVERLAP
          (priority 11).
        test_recipe:
          setup:
            - "Existing DECLARED declaration D1 for 2026-07-01..2026-07-31 (no eligible accounts, pool 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl1: "$.data.id", pool1: "$.data.declared_pool_cents" } }
          trigger:
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-15", period_end: "2026-08-15", rate_bps: 9999, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-20" }, as: BoardDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "pool1 == 0 (empty eligible set is legal at declaration)"
            - "err == ERR_DIVIDEND_RATE_OUT_OF_BAND (422), not ERR_DIVIDEND_PERIOD_OVERLAP (409)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_exactly_at_threshold_is_met
        grounds:
          - calculations.quorum_and_tally
          - state_machines.AnnualMeeting.SCHEDULED_to_HELD
        distinguishing_aspect: |
          Boundary on a count metric via close-and-tally: distinct chain voters exactly
          equal to quorum_threshold (3 == 3) meets quorum because the comparison is >= ;
          the meeting transitions to HELD, not ADJOURNED_NO_QUORUM.
        test_recipe:
          setup:
            - "Three members approved 2026-07-01; meeting record 2026-07-05, voting_open 2026-07-10, meeting_date 2026-07-20, quorum_threshold 3"
            - "All three cast ballots by 2026-07-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Ava", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appA: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appA}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mA: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Ben", date_of_birth: "1990-02-02", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appB: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appB}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mB: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Voter Cy", date_of_birth: "1990-03-03", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { appC: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${appC}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { mC: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-07-20", record_date: "2026-07-05", voting_open_date: "2026-07-10", quorum_threshold: 3 }, as: BoardDirector, captures: { mtg1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "FOR_SLATE_A" }, as: Member, as_user_id: "${mA}" }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "ABSTAIN" }, as: Member, as_user_id: "${mB}" }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "FOR_SLATE_B" }, as: Member, as_user_id: "${mC}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/annual-meetings/${mtg1}/close-and-tally", as: BoardDirector, captures: { st: "$.data.status", qm: "$.data.quorum_met", bc: "$.data.ballots_counted", va: "$.data.votes_for_slate_a", vb: "$.data.votes_for_slate_b", vab: "$.data.votes_abstain" } }
          assert:
            - "bc == 3 exactly equals quorum_threshold 3 and qm == true (>= boundary, not >)"
            - "st == HELD"
            - "va == 1, vb == 1, vab == 1 (ABSTAIN counts toward quorum but toward neither slate)"

      - name: tier_thresholds_exact_boundary_qualifies
        grounds:
          - calculations.member_tier_evaluation
          - entities.Member.fields.tier
        distinguishing_aspect: |
          Boundary on a money metric via a different endpoint (tier-review): trailing-90
          average balance exactly 500,000 cents AND tenure exactly 12 months both qualify
          because both thresholds are >= ; the member becomes SELECT, not STANDARD.
        test_recipe:
