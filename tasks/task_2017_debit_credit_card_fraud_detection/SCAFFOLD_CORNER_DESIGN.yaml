  - section: calculations
    instances:
      - name: blocked_card_auth_declined_without_score
        claim_type: input_set_filtering
        grounds:
          - calculations.authorization_scoring
          - entities.AuthTransaction.fields.decision_reason
        distinguishing_aspect: "A SOFT_BLOCKED card's authorization is recorded as DECLINE/CARD_BLOCKED with auth_score null — scoring is bypassed entirely and no alert is created, even though the same payload would score 40 (APPROVE) on an ACTIVE card."
        test_recipe:
          setup: ["Account/card; GLOBAL ruleset active; card SOFT_BLOCKED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-CA1", cardholder_name: "Calc One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-CA1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/cards/${card}/block", payload: { block_type: "SOFT", reason: "ANALYST_REVIEW" }, as: FraudAnalyst }
          trigger:
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 1000, merchant_id: "M-CA1", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id", dec: "$.data.decision", score: "$.data.auth_score" } }
            - { call: "GET /fraudops/fraud-alerts?auth_transaction_id=${t}", as: FraudOpsManager }
          assert:
            - "HTTP 201 with decision == DECLINE and decision_reason == CARD_BLOCKED"
            - "auth_score == null and ruleset_id == null (scoring bypassed)"
            - "alert list for the transaction is empty (no FraudAlert created for blocked-card declines)"
      - name: review_decision_creates_single_alert
        claim_type: constants_applied
        grounds:
          - calculations.authorization_scoring
          - calculations.alert_priority
          - entities.FraudAlert.fields.band_points
        distinguishing_aspect: "A REVIEW decision creates exactly one SCORING_REVIEW alert whose band_points = min(49, score - review_threshold) = 15 for score 75, priority 15 at LOW tier."
        test_recipe:
          setup: ["Account/card; GLOBAL ruleset active (review 60, decline 100)"]
          setup_api_calls:
