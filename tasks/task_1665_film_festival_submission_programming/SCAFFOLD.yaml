# =============================================================================
# SCAFFOLD.yaml — Film Festival Submission & Programming (Sundance-style)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Film Festival Submission & Programming (Sundance style festival): submission
  intake with fee tiers & deadlines, eligibility rules (premiere status/length/
  completion date), screener distribution to programmers & scoring, programming
  committee deliberation & slate construction, screening schedule & venue/time
  slot allocation, filmmaker notification & travel/accommodation, awards jury &
  prize administration, rights/exhibition agreement.

domain_name: film-festival-programming
api_prefix: /festival

complexity_profile:
  primary_archetype: posture_driven_gating   # FestivalEdition.status gates all child operations
  secondary_archetype: temporal_windowing    # ScreeningSlot intervals on Venue resources
  complexity_layers:
    - optimistic_concurrency    # OCC on Slate/Venue/FestivalEdition/ExhibitionAgreement version
    - scheduled_deferred_actions # logical clock sweeps: intake close, assignment expiry, RSVP expiry
    - selector_policy           # screener reassignment + waitlist promotion
    - derived_field_reconciliation # FestivalEdition aggregate ledger fields
  entity_topology: flat                     # peer entities joined by FK references, no URL nesting for writes
  state_machine_shape: cyclic               # NEEDS_INFO resubmit loop, slot hold/release loop, PROGRAMMED<->CONFIRMED loop; Submission also carries two independent status dimensions
  relationship_patterns:
    - one_to_many
    - many_to_many       # ScreenerAssignment junction: Submission x Programmer
    - cross_aggregate    # ScreeningSlot references SlateEntry; ExhibitionAgreement pins Submission.version
  role_model: segregation_of_duties         # chair adds entries, director locks; coordinator approves travel; juror COI
  consistency_model: immediate
  difficulty_target: expert_plus

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (17 entities, flat topology)
# =============================================================================
entities:
  - name: FestivalEdition
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Festival year; unique across editions" }
      - { name: host_country_code, type: string, source: input, description: "ISO country code of festival host", default: "US" }
      - { name: intake_open_at, type: datetime, source: input, description: "Submissions accepted at/after this instant" }
      - { name: early_deadline_at, type: datetime, source: input, description: "EARLY fee tier applies when paid_at <= this instant" }
      - { name: regular_deadline_at, type: datetime, source: input, description: "REGULAR fee tier applies when early_deadline_at < paid_at <= this instant" }
      - { name: late_deadline_at, type: datetime, source: input, description: "LATE fee tier applies when regular_deadline_at < paid_at <= this instant; clock sweep past this auto-closes intake" }
      - { name: rsvp_window_days, type: integer, source: input, description: "Days an invitation stays open before EXPIRED sweep", default: 7 }
      - { name: festival_start_at, type: datetime, source: input, description: "Screening slots must start at/after this instant" }
      - { name: festival_end_at, type: datetime, source: input, description: "Screening slots must end at/before this instant" }
      - { name: hotel_nights_pool, type: integer, source: input, description: "Total hotel room-nights available for allocation" }
      - { name: travel_budget_cents, type: integer, source: input, description: "Total travel stipend budget" }
      - { name: prize_pool_cents, type: integer, source: input, description: "Total prize money budget" }
      - { name: status, type: enum, source: system, description: "SETUP | INTAKE_OPEN | INTAKE_CLOSED | SCREENING | DELIBERATION | SLATE_LOCKED | NOTIFICATION | SCHEDULING | FESTIVAL_LIVE | AWARDS_NIGHT | CLOSED" }
      - { name: total_fees_collected_cents, type: integer, source: computed, description: "Sum of FeePayment.amount_cents with status SUCCEEDED or PARTIALLY_REFUNDED (full collected amount, refunds tracked separately)" }
      - { name: total_refunded_cents, type: integer, source: computed, description: "Sum of FeePayment.refunded_amount_cents over all payments" }
      - { name: hotel_nights_allocated, type: integer, source: computed, description: "Sum of hotel_nights_allocated over TravelPackage status in {APPROVED, BOOKED, RECONCILED}" }
      - { name: hotel_nights_remaining, type: integer, source: computed, description: "hotel_nights_pool - hotel_nights_allocated" }
      - { name: travel_committed_cents, type: integer, source: computed, description: "Sum of stipend_cents over TravelPackage status in {APPROVED, BOOKED, RECONCILED}" }
      - { name: travel_penalty_sink_cents, type: integer, source: computed, description: "Sum of penalty_cents over TravelPackage status CANCELLED after BOOKED" }
      - { name: travel_budget_remaining, type: integer, source: computed, description: "travel_budget_cents - travel_committed_cents - travel_penalty_sink_cents" }
      - { name: prize_committed_cents, type: integer, source: computed, description: "Sum of prize_cents over Award status in {SETUP, VOTING_OPEN, TALLIED, ANNOUNCED, DISBURSED}" }
      - { name: prize_disbursed_cents, type: integer, source: computed, description: "Sum of disbursed_amount_cents over Award status DISBURSED" }

  - name: CategoryConfig
    parent: FestivalEdition
    common_fields: true
    fields:
      - { name: edition_id, type: string, source: input, description: "FK -> FestivalEdition.id; owning edition" }
      - { name: category, type: enum, source: input, description: "NARRATIVE_FEATURE | DOCUMENTARY_FEATURE | SHORT_FILM | EPISODIC; unique per edition" }
      - { name: min_runtime_minutes, type: integer, source: input, description: "Inclusive minimum runtime" }
      - { name: max_runtime_minutes, type: integer, source: input, description: "Inclusive maximum runtime" }
      - { name: premiere_requirement, type: enum, source: input, description: "WORLD_REQUIRED | NORTH_AMERICA_REQUIRED | US_REQUIRED | NONE" }
      - { name: completion_cutoff, type: string, source: input, description: "ISO date; submission.completion_date must be >= this date" }
      - { name: early_fee_cents, type: integer, source: input, description: "Base fee when paid_at <= early_deadline_at" }
      - { name: regular_fee_cents, type: integer, source: input, description: "Base fee when early_deadline_at < paid_at <= regular_deadline_at" }
      - { name: late_fee_cents, type: integer, source: input, description: "Base fee when regular_deadline_at < paid_at <= late_deadline_at" }
      - { name: screener_count_required, type: integer, source: input, description: "SCORED assignments required before composite_score is computed", default: 3 }

  - name: Submitter
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Filmmaker legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across submitters" }
      - { name: country_of_residence, type: string, source: input, description: "ISO country code; drives is_international on travel" }
      - { name: is_student, type: boolean, source: input, description: "Student discount flag (25%)", default: false }
      - { name: is_member, type: boolean, source: input, description: "Member discount flag (10%)", default: false }

  - name: Programmer
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Programmer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across programmers" }
      - { name: seniority, type: enum, source: input, description: "STAFF | SENIOR | LEAD; drives scoring weight 1.0 / 1.5 / 2.0" }
      - { name: categories_covered, type: array, source: input, description: "Categories this programmer may be assigned" }
      - { name: coi_production_companies, type: array, source: input, description: "Production companies this programmer is conflicted with", default: [] }
      - { name: max_active_assignments, type: integer, source: input, description: "Cap on assignments with status ASSIGNED or IN_PROGRESS", default: 12 }
      - { name: active, type: boolean, source: input, description: "Inactive programmers cannot receive assignments", default: true }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of ScreenerAssignment with status ASSIGNED for this programmer" }

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - { name: edition_id, type: string, source: input, description: "FK -> FestivalEdition.id; edition submitted to" }
      - { name: submitter_id, type: string, source: system, description: "FK -> Submitter.id; set from X-User-ID at creation" }
      - { name: category, type: enum, source: input, description: "NARRATIVE_FEATURE | DOCUMENTARY_FEATURE | SHORT_FILM | EPISODIC; must have CategoryConfig for edition" }
      - { name: title, type: string, source: input, description: "Film title; unique per (edition_id, submitter_id)" }
      - { name: runtime_minutes, type: integer, source: input, description: "Runtime; must satisfy category min/max inclusive" }
      - { name: completion_date, type: string, source: input, description: "ISO date film was completed; must be >= category completion_cutoff" }
      - { name: premiere_status, type: enum, source: input, description: "WORLD | INTERNATIONAL | NORTH_AMERICA | US | REGIONAL | NONE" }
      - { name: production_company, type: string, source: input, description: "Used for programmer/juror COI matching" }
      - { name: format, type: enum, source: input, description: "DCP_2K | DCP_4K | FILM_35MM | PRORES_4444; exhibition format" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | NEEDS_INFO | ELIGIBLE | IN_SCREENING | ADVANCED | INVITED | WAITLISTED | CONFIRMED | PROGRAMMED | INELIGIBLE | DECLINED | DECLINED_BY_FILMMAKER | EXPIRED | WITHDRAWN" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | PARTIALLY_REFUNDED | REFUNDED — independent status dimension" }
      - { name: needs_info_resolved, type: boolean, source: system, description: "Set true by PATCH while NEEDS_INFO; cleared by next NEEDS_INFO decision", default: false }
      - { name: provisional_score, type: number, source: computed, description: "Simple mean of Score.overall over SCORED assignments, 3 decimals round_half_up; null when zero scores" }
      - { name: composite_score, type: number, source: computed, description: "Seniority-weighted mean of Score.overall over SCORED assignments, 3 decimals round_half_up; null until SCORED count >= screener_count_required" }
      - { name: award_names, type: array, source: system, description: "Names of awards announced for this submission", default: [] }

  - name: FeePayment
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> Submission.id; payment's submission" }
      - { name: tier_applied, type: enum, source: computed, description: "EARLY | REGULAR | LATE — chosen by logical clock vs edition deadlines at checkout" }
      - { name: base_fee_cents, type: integer, source: computed, description: "Category fee for tier_applied before discounts" }
      - { name: student_discount_applied, type: boolean, source: computed, description: "Snapshot of submitter.is_student at checkout" }
      - { name: member_discount_applied, type: boolean, source: computed, description: "Snapshot of submitter.is_member at checkout" }
      - { name: student_discount_cents, type: integer, source: computed, description: "round_half_up(base_fee_cents * 0.25) when student_discount_applied else 0" }
      - { name: member_discount_cents, type: integer, source: computed, description: "round_half_up((base_fee_cents - student_discount_cents) * 0.10) when member_discount_applied else 0" }
      - { name: amount_cents, type: integer, source: computed, description: "base_fee_cents - student_discount_cents - member_discount_cents" }
      - { name: status, type: enum, source: system, description: "INITIATED | SUCCEEDED | FAILED | PARTIALLY_REFUNDED | REFUNDED" }
      - { name: paid_at, type: datetime, source: system, description: "Logical clock timestamp when payment succeeded; null until SUCCEEDED" }
      - { name: refunded_amount_cents, type: integer, source: computed, description: "Total refunded against this payment", default: 0 }

  - name: ScreenerAssignment
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; film to screen" }
      - { name: programmer_id, type: string, source: input, description: "FK -> Programmer.id; assigned programmer" }
      - { name: due_at, type: datetime, source: input, description: "Clock sweep past due_at expires a non-terminal assignment" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | SCORED | RECUSED | EXPIRED" }
      - { name: replaced_by_assignment_id, type: string, source: system, description: "System back-reference to the replacement assignment row id created by recuse/expiry cascade; null when none" }

  - name: Score
    parent: ScreenerAssignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> ScreenerAssignment.id; one score per assignment (unique)" }
      - { name: originality, type: integer, source: input, description: "1..10 rubric score" }
      - { name: craft, type: integer, source: input, description: "1..10 rubric score" }
      - { name: story, type: integer, source: input, description: "1..10 rubric score" }
      - { name: overall, type: integer, source: input, description: "1..10 rubric score; feeds composite_score" }
      - { name: recommendation, type: enum, source: input, description: "STRONG_ADVOCATE | ADVOCATE | NEUTRAL | PASS | STRONG_PASS" }
      - { name: locked, type: boolean, source: computed, description: "True once owning edition reaches DELIBERATION; PATCH rejected when locked" }

  - name: Slate
    parent: FestivalEdition
    common_fields: true
    fields:
      - { name: edition_id, type: string, source: input, description: "FK -> FestivalEdition.id; owning edition" }
      - { name: section, type: enum, source: input, description: "US_DRAMATIC | US_DOCUMENTARY | WORLD_CINEMA_DRAMATIC | NEXT | PREMIERES | MIDNIGHT | SHORTS; unique per edition" }
      - { name: capacity_slots, type: integer, source: input, description: "Number of MAIN lane slots; entries ranked beyond this are WAITLIST lane" }
      - { name: status, type: enum, source: system, description: "OPEN | DELIBERATING | LOCKED" }
      - { name: last_entry_added_by, type: string, source: system, description: "X-User-ID of most recent entry add; segregation-of-duties check at lock" }
      - { name: entry_count, type: integer, source: computed, description: "Count of non-DROPPED SlateEntry rows" }
      - { name: locked_at, type: datetime, source: system, description: "Logical clock timestamp of lock; null until LOCKED" }

  - name: SlateEntry
    parent: Slate
    common_fields: true
    fields:
      - { name: slate_id, type: string, source: system, description: "FK -> Slate.id; owning slate" }
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; film on the slate" }
      - { name: rank_position, type: integer, source: computed, description: "1-based selection priority; assigned max+1 on add, compacted preserving order on delete" }
      - { name: lane, type: enum, source: system, description: "UNASSIGNED | MAIN | WAITLIST; derived at lock: rank_position <= capacity_slots => MAIN else WAITLIST" }
      - { name: status, type: enum, source: system, description: "NOMINATED | INVITED | CONFIRMED | PROGRAMMED | DECLINED | EXPIRED | DROPPED | RELEASED" }
      - { name: rsvp_deadline_at, type: datetime, source: system, description: "issue time + edition.rsvp_window_days; clock sweep past it expires INVITED entries" }
      - { name: locked_composite_score, type: number, source: system, description: "Snapshot of submission.composite_score at slate lock; null until lock" }

  - name: Venue
    parent: FestivalEdition
    common_fields: true
    fields:
      - { name: edition_id, type: string, source: input, description: "FK -> FestivalEdition.id; owning edition" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: seat_capacity, type: integer, source: input, description: "Seat count (informational)" }
      - { name: formats_supported, type: array, source: input, description: "Subset of DCP_2K | DCP_4K | FILM_35MM | PRORES_4444" }
      - { name: turnover_minutes, type: integer, source: input, description: "Required buffer between slots on this venue", default: 30 }

  - name: ScreeningSlot
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; venue hosting this slot" }
      - { name: slate_entry_id, type: string, source: system, description: "FK -> SlateEntry.id; film held/confirmed into this slot; null while OPEN" }
      - { name: slot_type, type: enum, source: input, description: "PREMIERE | PUBLIC | PRESS_INDUSTRY | AWARDS_ENCORE" }
      - { name: start_at, type: datetime, source: input, description: "Slot start; must be >= edition.festival_start_at" }
      - { name: end_at, type: datetime, source: input, description: "Slot end; must be > start_at and <= edition.festival_end_at" }
      - { name: status, type: enum, source: system, description: "OPEN | HELD | CONFIRMED | PLAYED | CANCELLED" }

  - name: TravelPackage
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> Submission.id; one package per confirmed submission (unique)" }
      - { name: edition_id, type: string, source: system, description: "FK -> FestivalEdition.id; denormalized from submission for budget checks" }
      - { name: delegate_count, type: integer, source: input, description: "Travelers; >= 1" }
      - { name: origin_country_code, type: string, source: input, description: "ISO country code of travel origin" }
      - { name: is_international, type: boolean, source: computed, description: "origin_country_code != edition.host_country_code" }
      - { name: hotel_nights_requested, type: integer, source: input, description: "Room-nights requested; >= 1" }
      - { name: hotel_nights_allocated, type: integer, source: computed, description: "min(hotel_nights_requested, edition.hotel_nights_remaining) at approval; 0 until approved" }
      - { name: raw_stipend_cents, type: integer, source: computed, description: "min(200000, base + 20000*(min(delegate_count,2)-1)); base 50000 domestic / 150000 international" }
      - { name: stipend_cents, type: integer, source: computed, description: "min(raw_stipend_cents, edition.travel_budget_remaining) at approval; 0 until approved" }
      - { name: penalty_cents, type: integer, source: computed, description: "round_half_up(stipend_cents * 0.25) forfeited when a BOOKED package is cancelled", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | APPROVED | BOOKED | RECONCILED | CANCELLED" }

  - name: ExhibitionAgreement
    parent: Submission
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> Submission.id; one agreement per submission (unique)" }
      - { name: slate_entry_id, type: string, source: system, description: "FK -> SlateEntry.id; entry whose acceptance created this agreement" }
      - { name: rights_scope, type: enum, source: input, description: "FESTIVAL_WORLD | FESTIVAL_NORTH_AMERICA | FESTIVAL_US" }
      - { name: licensed_screening_count, type: integer, source: input, description: "Maximum confirmed screenings licensed" }
      - { name: used_screening_count, type: integer, source: computed, description: "Confirmed/played slots counted against license", default: 0 }
      - { name: exclusivity_until, type: datetime, source: input, description: "Exclusivity window end (informational)" }
      - { name: revenue_share_pct, type: number, source: input, description: "Box-office share owed to filmmaker" }
      - { name: submission_version_at_signing, type: integer, source: system, description: "Submission.version pinned at signing; refreshed by amend" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | SIGNED | ACTIVE | TERMINATED" }

  - name: Juror
    parent: FestivalEdition
    common_fields: true
    fields:
      - { name: edition_id, type: string, source: input, description: "FK -> FestivalEdition.id; owning edition" }
      - { name: display_name, type: string, source: input, description: "Juror name" }
      - { name: coi_production_companies, type: array, source: input, description: "Production companies this juror is conflicted with", default: [] }

  - name: Award
    parent: FestivalEdition
    common_fields: true
    fields:
      - { name: edition_id, type: string, source: input, description: "FK -> FestivalEdition.id; owning edition" }
      - { name: name, type: string, source: input, description: "Award name (e.g., Grand Jury Prize: Dramatic)" }
      - { name: section, type: enum, source: input, description: "US_DRAMATIC | US_DOCUMENTARY | WORLD_CINEMA_DRAMATIC | NEXT | PREMIERES | MIDNIGHT | SHORTS; scopes candidate films" }
      - { name: prize_cents, type: integer, source: input, description: "Prize amount; must fit remaining prize pool at creation" }
      - { name: assigned_juror_ids, type: array, source: input, description: "Juror ids (same edition) empaneled on this award; >= 1" }
      - { name: status, type: enum, source: system, description: "SETUP | VOTING_OPEN | TALLIED | ANNOUNCED | DISBURSED" }
      - { name: winner_submission_id, type: string, source: system, description: "FK -> Submission.id; IRV winner; null until TALLIED" }
      - { name: rounds_log, type: array, source: system, description: "Per-round IRV elimination records", default: [] }
      - { name: disbursed_amount_cents, type: integer, source: computed, description: "Amount paid out at DISBURSED; equals prize_cents", default: 0 }

  - name: JuryVote
    parent: Award
    common_fields: false
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> Award.id; award this ballot serves" }
      - { name: juror_id, type: string, source: system, description: "FK -> Juror.id; set from X-User-ID" }
      - { name: ranked_submission_ids, type: array, source: input, description: "Ranked candidate submission ids, most-preferred first; non-empty; no duplicates" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock timestamp at ballot submission" }

# =============================================================================
# §1.2 State Machine Table (11 machines)
# =============================================================================
state_machines:
  - entity: FestivalEdition
    field: status
    initial_state: SETUP
    terminal_states: [CLOSED]
    note: "Posture machine: every phase gates which child operations are allowed. All transitions via POST /festival/editions/{id}/advance with explicit to_status, except the clock-sweep auto-close."
    transitions:
      - from: SETUP
        to: INTAKE_OPEN
        trigger: "POST /festival/editions/{id}/advance (to_status=INTAKE_OPEN)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "At least one CategoryConfig exists for this edition (ERR_NO_CATEGORY_CONFIG)"
        side_effects: []
      - from: INTAKE_OPEN
        to: INTAKE_CLOSED
        trigger: "POST /festival/editions/{id}/advance (to_status=INTAKE_CLOSED) OR system clock sweep when current_utc > late_deadline_at"
        actor: FESTIVAL_ADMIN | system
        preconditions: []
        side_effects:
          - "No new submissions or checkouts accepted for this edition thereafter"
      - from: INTAKE_CLOSED
        to: SCREENING
        trigger: "POST /festival/editions/{id}/advance (to_status=SCREENING)"
        actor: FESTIVAL_ADMIN
        preconditions: []
        side_effects:
          - "Every Submission with status ELIGIBLE moves to IN_SCREENING (bulk cascade)"
      - from: SCREENING
        to: DELIBERATION
        trigger: "POST /festival/editions/{id}/advance (to_status=DELIBERATION)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "No Submission remains in SUBMITTED or NEEDS_INFO (ERR_ELIGIBILITY_DECISIONS_PENDING)"
          - "Every Submission in IN_SCREENING has at least its category's screener_count_required assignments in SCORED status (ERR_SCORING_INCOMPLETE)"
        side_effects:
          - "All Score rows for this edition become locked=true (version-pinning on deliberation)"
      - from: DELIBERATION
        to: SLATE_LOCKED
        trigger: "POST /festival/editions/{id}/advance (to_status=SLATE_LOCKED)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "At least one Slate exists and every Slate is LOCKED (ERR_SLATES_UNLOCKED)"
        side_effects: []
      - from: SLATE_LOCKED
        to: NOTIFICATION
        trigger: "POST /festival/editions/{id}/advance (to_status=NOTIFICATION)"
        actor: FESTIVAL_ADMIN
        preconditions: []
        side_effects: []
      - from: NOTIFICATION
        to: SCHEDULING
        trigger: "POST /festival/editions/{id}/advance (to_status=SCHEDULING)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "No SlateEntry in this edition has status INVITED (ERR_INVITATIONS_PENDING) — all invitations answered or expired by sweep"
        side_effects: []
      - from: SCHEDULING
        to: FESTIVAL_LIVE
        trigger: "POST /festival/editions/{id}/advance (to_status=FESTIVAL_LIVE)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "current_utc >= festival_start_at (ERR_FESTIVAL_NOT_STARTED)"
        side_effects:
          - "Every Submission still WAITLISTED moves to DECLINED; its SlateEntry moves NOMINATED -> RELEASED"
      - from: FESTIVAL_LIVE
        to: AWARDS_NIGHT
        trigger: "POST /festival/editions/{id}/advance (to_status=AWARDS_NIGHT)"
        actor: FESTIVAL_ADMIN
        preconditions: []
        side_effects: []
      - from: AWARDS_NIGHT
        to: CLOSED
        trigger: "POST /festival/editions/{id}/advance (to_status=CLOSED)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "Every Award of this edition has status DISBURSED (ERR_AWARDS_PENDING)"
        side_effects: []

  - entity: Submission
    field: status
    initial_state: DRAFT
    terminal_states: [INELIGIBLE, DECLINED, DECLINED_BY_FILMMAKER, EXPIRED, WITHDRAWN]
    note: "Program pipeline dimension. Evolves independently of payment_status."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "system (FeePayment for this submission moves INITIATED -> SUCCEEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status UNPAID -> PAID"
          - "FestivalEdition.total_fees_collected_cents recomputed"
      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "POST /festival/submissions/{id}/eligibility-decision (decision=ELIGIBLE)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "premiere_status satisfies the category's premiere_requirement (ERR_INELIGIBLE_PREMIERE)"
          - "edition.status in {INTAKE_OPEN, INTAKE_CLOSED, SCREENING} (ERR_EDITION_PHASE_FORBIDDEN)"
        side_effects: []
      - from: SUBMITTED
        to: IN_SCREENING
        trigger: "POST /festival/submissions/{id}/eligibility-decision (decision=ELIGIBLE) while edition.status == SCREENING"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "premiere_status satisfies the category's premiere_requirement (ERR_INELIGIBLE_PREMIERE)"
        side_effects: []
      - from: SUBMITTED
        to: INELIGIBLE
        trigger: "POST /festival/submissions/{id}/eligibility-decision (decision=INELIGIBLE, reason required)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "edition.status in {INTAKE_OPEN, INTAKE_CLOSED, SCREENING}"
        side_effects: []
      - from: SUBMITTED
        to: NEEDS_INFO
        trigger: "POST /festival/submissions/{id}/eligibility-decision (decision=NEEDS_INFO, reason required)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "edition.status in {INTAKE_OPEN, INTAKE_CLOSED, SCREENING}"
        side_effects:
          - "needs_info_resolved := false"
      - from: NEEDS_INFO
        to: SUBMITTED
        trigger: "POST /festival/submissions/{id}/resubmit"
        actor: FILMMAKER (owner)
        preconditions:
          - "needs_info_resolved == true (ERR_UNRESOLVED_INFO_REQUEST) — set by a PATCH while NEEDS_INFO"
        side_effects: []
        note: "Revision cycle SUBMITTED -> NEEDS_INFO -> SUBMITTED may repeat"
      - from: ELIGIBLE
        to: IN_SCREENING
        trigger: "system (edition advances INTAKE_CLOSED -> SCREENING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SCREENING
        to: ADVANCED
        trigger: "system (submission added to a Slate via POST /festival/slates/{id}/entries)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SCREENING
        to: DECLINED
        trigger: "system (POST /festival/editions/{id}/issue-invitations: submission not on any locked slate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ADVANCED
        to: INVITED
        trigger: "system (issue-invitations: its SlateEntry has lane MAIN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ADVANCED
        to: WAITLISTED
        trigger: "system (issue-invitations: its SlateEntry has lane WAITLIST)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: INVITED
        trigger: "system (waitlist promotion cascade: its SlateEntry promoted to MAIN lane and INVITED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: DECLINED
        trigger: "system (edition advances SCHEDULING -> FESTIVAL_LIVE with film still waitlisted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /festival/slate-entries/{entry_id}/respond (accept=true)"
        actor: FILMMAKER (owner)
        preconditions: []
        side_effects:
          - "SlateEntry INVITED -> CONFIRMED"
          - "TravelPackage created (DRAFT, linked submission/edition)"
          - "ExhibitionAgreement created (DRAFT, linked submission/entry)"
      - from: INVITED
        to: DECLINED_BY_FILMMAKER
        trigger: "POST /festival/slate-entries/{entry_id}/respond (accept=false)"
        actor: FILMMAKER (owner)
        preconditions: []
        side_effects:
          - "SlateEntry INVITED -> DECLINED"
          - "Promotion cascade: selector picks the WAITLIST-lane SlateEntry of the same slate with the smallest rank_position among status NOMINATED; if found: that entry lane := MAIN, status := INVITED, rsvp_deadline_at := now + edition.rsvp_window_days; its Submission WAITLISTED -> INVITED. If none: no replacement (empty-pool fallback)"
      - from: INVITED
        to: EXPIRED
        trigger: "system (clock sweep: current_utc > rsvp_deadline_at while entry INVITED)"
        actor: system
        preconditions: []
        side_effects:
          - "SlateEntry INVITED -> EXPIRED"
          - "Same promotion cascade as DECLINED_BY_FILMMAKER"
      - from: CONFIRMED
        to: PROGRAMMED
        trigger: "system (first ScreeningSlot for its SlateEntry moves HELD -> CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROGRAMMED
        to: CONFIRMED
        trigger: "system (last CONFIRMED ScreeningSlot for its SlateEntry is cancelled, leaving zero CONFIRMED/PLAYED slots)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Reverse cascade makes CONFIRMED <-> PROGRAMMED a cycle"
      - from: [DRAFT, SUBMITTED, NEEDS_INFO, ELIGIBLE, IN_SCREENING, ADVANCED, INVITED, WAITLISTED, CONFIRMED, PROGRAMMED]
        to: WITHDRAWN
        trigger: "POST /festival/submissions/{id}/withdraw"
        actor: FILMMAKER (owner)
        preconditions: []
        side_effects:
          - "If a SUCCEEDED FeePayment exists AND no HELD/CONFIRMED/PLAYED slot ever referenced its entry: auto-refund round_half_up(amount_cents * 0.50); payment_status PAID -> PARTIALLY_REFUNDED; refunded_amount_cents set"
          - "If a SlateEntry exists in NOMINATED/INVITED: entry -> DROPPED; promotion cascade fires as in DECLINED_BY_FILMMAKER"
          - "Every HELD slot for its entry -> OPEN (slate_entry_id cleared); every CONFIRMED slot -> CANCELLED with ExhibitionAgreement.used_screening_count decremented per slot"
          - "DRAFT with only an INITIATED payment: that payment -> FAILED (voided)"

  - entity: Submission
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED, PARTIALLY_REFUNDED]
    note: "Payment dimension, independent of program pipeline status."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "system (FeePayment INITIATED -> SUCCEEDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "system (withdraw auto-refund 50%)"
        actor: system
        preconditions: []
        side_effects:
          - "FestivalEdition.total_refunded_cents recomputed"
      - from: PAID
        to: REFUNDED
        trigger: "POST /festival/fee-payments/{id}/refund (full refund within 48h of paid_at while submission SUBMITTED)"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "current_utc <= paid_at + 48 hours (ERR_REFUND_WINDOW_CLOSED)"
          - "Submission.status == SUBMITTED (ERR_REFUND_NOT_ALLOWED)"
        side_effects:
          - "FestivalEdition.total_refunded_cents recomputed"

  - entity: FeePayment
    field: status
    initial_state: INITIATED
    terminal_states: [SUCCEEDED, FAILED, PARTIALLY_REFUNDED, REFUNDED]
    transitions:
      - from: INITIATED
        to: SUCCEEDED
        trigger: "POST /festival/_payments/simulate (outcome=SUCCEEDED)"
        actor: FESTIVAL_ADMIN
        preconditions: []
        side_effects:
          - "paid_at := current_utc; Submission DRAFT -> SUBMITTED; payment_status -> PAID; edition fee aggregates recomputed"
      - from: INITIATED
        to: FAILED
        trigger: "POST /festival/_payments/simulate (outcome=FAILED) OR system (submission withdrawn while INITIATED)"
        actor: FESTIVAL_ADMIN | system
        preconditions: []
        side_effects:
          - "Submission remains DRAFT (unless withdrawing)"
      - from: SUCCEEDED
        to: PARTIALLY_REFUNDED
        trigger: "system (withdraw 50% auto-refund)"
        actor: system
        preconditions: []
        side_effects:
          - "refunded_amount_cents := round_half_up(amount_cents * 0.50)"
      - from: SUCCEEDED
        to: REFUNDED
        trigger: "POST /festival/fee-payments/{id}/refund"
        actor: FESTIVAL_ADMIN
        preconditions:
          - "current_utc <= paid_at + 48h AND submission status == SUBMITTED"
        side_effects:
          - "refunded_amount_cents := amount_cents"

  - entity: ScreenerAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [SCORED, RECUSED, EXPIRED]
    transitions:
      - from: ASSIGNED
        to: SCORED
        trigger: "POST /festival/screener-assignments/{id}/scores"
        actor: PROGRAMMER (owner)
        preconditions:
          - "edition.status == SCREENING (ERR_EDITION_PHASE_FORBIDDEN)"
          - "X-User-ID == assignment.programmer_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Score created; submission provisional_score/composite_score recomputed; programmer.active_assignment_count decremented"
      - from: ASSIGNED
        to: RECUSED
        trigger: "POST /festival/screener-assignments/{id}/recuse"
        actor: PROGRAMMER (owner)
        preconditions: []
        side_effects:
          - "Replacement cascade: selector creates a new ScreenerAssignment for the same submission — eligible programmers are active=true, category covered, production_company not in coi_production_companies, active_assignment_count < max_active_assignments, and no existing ScreenerAssignment in ANY status for this (submission, programmer) pair; ranked by active_assignment_count ASC, tie-break Programmer.created_at ASC; empty pool => no replacement (replaced_by_assignment_id stays null)"
          - "programmer.active_assignment_count decremented"
      - from: ASSIGNED
        to: EXPIRED
        trigger: "system (clock sweep: current_utc > due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Same replacement cascade as RECUSED"

  - entity: Slate
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: DELIBERATING
        trigger: "POST /festival/slates/{id}/deliberate"
        actor: PROGRAM_CHAIR
        preconditions:
          - "edition.status == DELIBERATION (ERR_EDITION_PHASE_FORBIDDEN)"
        side_effects: []
      - from: DELIBERATING
        to: LOCKED
        trigger: "POST /festival/slates/{id}/lock"
        actor: FESTIVAL_DIRECTOR
        preconditions:
          - "actor X-User-ID != slate.last_entry_added_by when at least one entry exists (ERR_SEGREGATION_OF_DUTIES)"
          - "entry_count >= capacity_slots (ERR_SLATE_UNDERFILLED)"
          - "every entry with rank_position <= capacity_slots has submission.composite_score != null and >= 7.500 (ERR_BELOW_SLATE_THRESHOLD)"
        side_effects:
          - "lane := MAIN for rank_position <= capacity_slots else WAITLIST"
          - "locked_composite_score snapshot per entry; locked_at := current_utc"
      - from: LOCKED
        to: DELIBERATING
        trigger: "POST /festival/slates/{id}/reopen"
        actor: FESTIVAL_DIRECTOR
        preconditions:
          - "no entry has status beyond NOMINATED — all entries still NOMINATED (ERR_INVALID_STATE)"
        side_effects:
          - "lane := UNASSIGNED and locked_composite_score := null on every entry"
        note: "Reopen cycle allowed only before issue-invitations"

  - entity: SlateEntry
    field: status
    initial_state: NOMINATED
    terminal_states: [PROGRAMMED, DECLINED, EXPIRED, DROPPED, RELEASED]
    note: "PROGRAMMED is terminal for the festival; CONFIRMED/PROGRAMMED reverse via slot-cancel cascade."
    transitions:
      - from: NOMINATED
        to: INVITED
        trigger: "system (issue-invitations with lane MAIN) OR system (waitlist promotion)"
        actor: system
        preconditions: []
        side_effects:
          - "rsvp_deadline_at := current_utc + edition.rsvp_window_days"
          - "Submission ADVANCED|WAITLISTED -> INVITED"
      - from: NOMINATED
        to: RELEASED
        trigger: "system (edition SCHEDULING -> FESTIVAL_LIVE while lane WAITLIST) OR system (slate reopened is NOT this; release only at festival live)"
        actor: system
        preconditions: []
        side_effects:
          - "Submission WAITLISTED -> DECLINED"
      - from: NOMINATED
        to: DROPPED
        trigger: "DELETE /festival/slates/{id}/entries/{entry_id}"
        actor: PROGRAM_CHAIR
        preconditions:
          - "slate.status == DELIBERATING (ERR_INVALID_STATE)"
        side_effects:
          - "Submission ADVANCED -> IN_SCREENING (compensation for the entry add)"
          - "remaining entry rank_positions compacted preserving order; Slate.version incremented"
      - from: [NOMINATED, INVITED, CONFIRMED, PROGRAMMED]
        to: DROPPED
        trigger: "system (submission withdrawn)"
        actor: system
        preconditions: []
        side_effects:
          - "Promotion cascade: selector picks the WAITLIST-lane SlateEntry of the same slate with the smallest rank_position among status NOMINATED; promoted entry lane := MAIN, status := INVITED, rsvp_deadline_at := now + edition.rsvp_window_days; its Submission WAITLISTED -> INVITED. Empty pool => no replacement"
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /festival/slate-entries/{id}/respond (accept=true)"
        actor: FILMMAKER (owner)
        preconditions: []
        side_effects:
          - "Submission INVITED -> CONFIRMED; TravelPackage + ExhibitionAgreement created (DRAFT)"
      - from: INVITED
        to: DECLINED
        trigger: "POST /festival/slate-entries/{id}/respond (accept=false)"
        actor: FILMMAKER (owner)
        preconditions: []
        side_effects:
          - "Submission INVITED -> DECLINED_BY_FILMMAKER; promotion cascade"
      - from: INVITED
        to: EXPIRED
        trigger: "system (clock sweep past rsvp_deadline_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Submission INVITED -> EXPIRED; promotion cascade"
      - from: CONFIRMED
        to: PROGRAMMED
        trigger: "system (first slot CONFIRMED for this entry)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROGRAMMED
        to: CONFIRMED
        trigger: "system (last CONFIRMED slot cancelled; zero CONFIRMED/PLAYED slots remain)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScreeningSlot
    field: status
    initial_state: OPEN
    terminal_states: [PLAYED, CANCELLED]
    transitions:
      - from: OPEN
        to: HELD
        trigger: "POST /festival/screening-slots/{id}/hold"
        actor: SCHEDULING_OPS
        preconditions:
          - "edition.status == SCHEDULING (ERR_EDITION_PHASE_FORBIDDEN)"
          - "SlateEntry status == CONFIRMED (ERR_ENTRY_NOT_CONFIRMED)"
          - "ExhibitionAgreement for entry's submission has status SIGNED or ACTIVE (ERR_AGREEMENT_NOT_SIGNED)"
          - "slot_type PREMIERE: no other PREMIERE slot for this entry in HELD/CONFIRMED/PLAYED (ERR_PREMIERE_SLOT_EXISTS)"
          - "slot_type PUBLIC or PRESS_INDUSTRY: a PREMIERE slot for this entry exists in HELD/CONFIRMED/PLAYED with start_at < this slot's start_at (ERR_PREMIERE_WINDOW_VIOLATION)"
          - "submission.format in venue.formats_supported (ERR_FORMAT_UNSUPPORTED)"
          - "(end_at - start_at) >= submission.runtime_minutes + 15 minutes QA (ERR_SLOT_TOO_SHORT)"
        side_effects:
          - "slate_entry_id set on slot"
      - from: HELD
        to: OPEN
        trigger: "POST /festival/screening-slots/{id}/release"
        actor: SCHEDULING_OPS
        preconditions: []
        side_effects:
          - "slate_entry_id cleared"
        note: "OPEN -> HELD -> OPEN release cycle"
      - from: HELD
        to: CONFIRMED
        trigger: "POST /festival/screening-slots/{id}/confirm"
        actor: SCHEDULING_OPS
        preconditions:
          - "agreement.used_screening_count + 1 <= agreement.licensed_screening_count (ERR_LICENSED_COUNT_EXCEEDED)"
        side_effects:
          - "agreement.used_screening_count += 1; agreement SIGNED -> ACTIVE on first confirmation"
          - "SlateEntry CONFIRMED -> PROGRAMMED and Submission CONFIRMED -> PROGRAMMED on first CONFIRMED slot for the entry"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /festival/screening-slots/{id}/cancel"
        actor: SCHEDULING_OPS
        preconditions: []
        side_effects:
          - "agreement.used_screening_count -= 1"
          - "if zero remaining CONFIRMED/PLAYED slots for the entry: SlateEntry PROGRAMMED -> CONFIRMED and Submission PROGRAMMED -> CONFIRMED"
      - from: CONFIRMED
        to: PLAYED
        trigger: "POST /festival/screening-slots/{id}/mark-played"
        actor: SCHEDULING_OPS
        preconditions:
          - "edition.status == FESTIVAL_LIVE (ERR_EDITION_PHASE_FORBIDDEN)"
        side_effects: []

  - entity: TravelPackage
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: [DRAFT, CHANGES_REQUESTED]
        to: SUBMITTED
        trigger: "POST /festival/travel-packages/{id}/submit"
        actor: FILMMAKER (owner)
        preconditions: []
        side_effects:
          - "raw_stipend_cents and is_international computed"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /festival/travel-packages/{id}/approve (OCC: expected_edition_version)"
        actor: TRAVEL_COORDINATOR
        preconditions:
          - "edition.travel_budget_remaining > 0 (ERR_TRAVEL_BUDGET_EXHAUSTED)"
          - "edition.hotel_nights_remaining > 0 (ERR_HOTEL_NIGHTS_EXHAUSTED)"
        side_effects:
          - "stipend_cents := min(raw_stipend_cents, edition.travel_budget_remaining)"
          - "hotel_nights_allocated := min(hotel_nights_requested, edition.hotel_nights_remaining)"
          - "edition travel/hotel aggregates recomputed; edition.version incremented"
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /festival/travel-packages/{id}/request-changes"
        actor: TRAVEL_COORDINATOR
        preconditions: []
        side_effects: []
        note: "SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED revision cycle"
      - from: APPROVED
        to: BOOKED
        trigger: "POST /festival/travel-packages/{id}/mark-booked"
        actor: TRAVEL_COORDINATOR
        preconditions: []
        side_effects: []
      - from: [APPROVED, BOOKED]
        to: CANCELLED
        trigger: "POST /festival/travel-packages/{id}/cancel"
        actor: TRAVEL_COORDINATOR | FILMMAKER (owner)
        preconditions: []
        side_effects:
          - "hotel_nights_allocated released (set to 0); stipend_cents released (set to 0)"
          - "BOOKED cancellation: penalty_cents := round_half_up(original stipend_cents * 0.25) into edition.travel_penalty_sink_cents; APPROVED cancellation: no penalty"
          - "edition aggregates recomputed (compensating invariants INV-HOTEL, INV-TRAVEL)"
      - from: BOOKED
        to: RECONCILED
        trigger: "POST /festival/travel-packages/{id}/reconcile"
        actor: TRAVEL_COORDINATOR
        preconditions:
          - "edition.status in {FESTIVAL_LIVE, AWARDS_NIGHT} (ERR_EDITION_PHASE_FORBIDDEN)"
        side_effects: []

  - entity: ExhibitionAgreement
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /festival/exhibition-agreements/{id}/issue"
        actor: FESTIVAL_DIRECTOR
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: SIGNED
        trigger: "POST /festival/exhibition-agreements/{id}/sign"
        actor: FILMMAKER (owner)
        preconditions: []
        side_effects:
          - "submission_version_at_signing := submission.version (version-pinning on approval)"
      - from: [SIGNED, ACTIVE]
        to: ACTIVE
        trigger: "POST /festival/exhibition-agreements/{id}/amend (OCC: expected_agreement_version)"
        actor: FESTIVAL_DIRECTOR
        preconditions:
          - "licensed_screening_count >= used_screening_count (ERR_LICENSED_BELOW_USED)"
        side_effects:
          - "submission_version_at_signing refreshed to current submission.version; agreement.version incremented"
      - from: SIGNED
        to: ACTIVE
        trigger: "system (first ScreeningSlot HELD -> CONFIRMED for the entry)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [SIGNED, ACTIVE]
        to: TERMINATED
        trigger: "POST /festival/exhibition-agreements/{id}/terminate"
        actor: FESTIVAL_DIRECTOR
        preconditions:
          - "no HELD or CONFIRMED ScreeningSlot references the entry (ERR_ACTIVE_SLOTS_EXIST)"
        side_effects: []

  - entity: Award
    field: status
    initial_state: SETUP
    terminal_states: [DISBURSED]
    transitions:
      - from: SETUP
        to: VOTING_OPEN
        trigger: "POST /festival/awards/{id}/open-voting"
        actor: AWARDS_ADMIN
        preconditions:
          - "edition.status == FESTIVAL_LIVE (ERR_EDITION_PHASE_FORBIDDEN)"
        side_effects: []
      - from: VOTING_OPEN
        to: TALLIED
        trigger: "POST /festival/awards/{id}/tally"
        actor: AWARDS_ADMIN
        preconditions:
          - "ballots submitted >= ceil(len(assigned_juror_ids) / 2) (ERR_QUORUM_NOT_MET)"
        side_effects:
          - "IRV tally computed; winner_submission_id and rounds_log stored"
      - from: TALLIED
        to: ANNOUNCED
        trigger: "POST /festival/awards/{id}/announce"
        actor: FESTIVAL_DIRECTOR
        preconditions:
          - "edition.status == AWARDS_NIGHT (ERR_EDITION_PHASE_FORBIDDEN)"
        side_effects:
          - "winner submission's award_names appended with award name"
      - from: ANNOUNCED
        to: DISBURSED
        trigger: "POST /festival/awards/{id}/disburse"
        actor: AWARDS_ADMIN
        preconditions: []
        side_effects:
          - "disbursed_amount_cents := prize_cents; edition.prize_disbursed_cents recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serial-observable only)
# =============================================================================
concurrency_rules:
  - rule_id: slate-entry-add-occ
    parent_entity: Slate
    write_endpoint: "POST /festival/slates/{id}/entries"
    occ_field: expected_slate_version
    description: |
      Adding a SlateEntry against a Slate whose version has advanced since the
      client last read it is rejected. This captures the case where another
      chair has just added or deleted an entry (which legitimately changed
      rank assignments) and the current writer's view of the slate is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: venue-slot-create-occ
    parent_entity: Venue
    write_endpoint: "POST /festival/screening-slots"
    occ_field: expected_venue_version
    description: |
      Creating a ScreeningSlot against a Venue whose version has advanced since
      the client last read it is rejected. This captures the case where another
      ops user has just added a non-overlapping slot to the same venue grid and
      the current writer's view of the grid is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: travel-approve-occ
    parent_entity: FestivalEdition
    write_endpoint: "POST /festival/travel-packages/{id}/approve"
    occ_field: expected_edition_version
    description: |
      Approving a TravelPackage against a FestivalEdition whose version has
      advanced since the client last read it is rejected. This captures the
      case where another approval has just committed budget/hotel nights the
      current writer has not seen, making their view of remaining pools stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-amend-occ
    parent_entity: ExhibitionAgreement
    write_endpoint: "POST /festival/exhibition-agreements/{id}/amend"
    occ_field: expected_agreement_version
    description: |
      Amending an ExhibitionAgreement whose version has advanced since the
      client last read it is rejected. This captures the case where another
      amendment has just legitimately changed license terms and the current
      writer's view of the agreement is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (10 rules)
# =============================================================================
calculations:
  - name: submission_fee
    trigger: "POST /festival/submissions/{id}/checkout (payment creation)"
    algorithm: tiered_pricing
    formula: |
      tier: now = logical clock; if now <= edition.early_deadline_at => EARLY
            elif now <= edition.regular_deadline_at => REGULAR
            elif now <= edition.late_deadline_at => LATE; now > late_deadline_at is unreachable because the clock sweep has already auto-closed intake (checkout then fails ERR_EDITION_PHASE_FORBIDDEN)
      base = CategoryConfig.{early|regular|late}_fee_cents for submission.category
      student_discount_cents = submitter.is_student ? round_half_up(base * 0.25) : 0
      member_discount_cents  = submitter.is_member  ? round_half_up((base - student_discount_cents) * 0.10) : 0
      amount_cents = base - student_discount_cents - member_discount_cents
      PINNED ORDER: student discount computed and rounded FIRST against base;
      member discount computed SECOND against (base - student_discount_cents);
      each discount rounded half-up to whole cents individually BEFORE subtraction.
      Worked: base 5500, student+member => d1 = round(1375.00) = 1375;
      d2 = round(4125 * 0.10) = round(412.50) = 413; amount = 5500-1375-413 = 3712.
      (Multiplying stacked rates instead would give round(4125*0.9)=3713 — forbidden.)
    input_set: "Submission in DRAFT; its CategoryConfig; its Submitter's is_student/is_member snapshot at checkout"
    constants:
      STUDENT_DISCOUNT_PCT: 0.25
      MEMBER_DISCOUNT_PCT: 0.10
    precision: "whole cents; round_half_up per discount step"
    variants:
      - name: undiscounted
        when: "submitter has neither flag"
        difference: "amount_cents == base_fee_cents"
      - name: stacked_discount
        when: "both flags true"
        difference: "sequential per-step rounding; differs from single-step rate multiplication by 1 cent on half-cent bases"

  - name: refund_amount
    trigger: "POST /festival/submissions/{id}/withdraw (auto) or POST /festival/fee-payments/{id}/refund (admin)"
    algorithm: threshold
    formula: |
      admin full refund: now <= paid_at + 48h AND submission.status == SUBMITTED
        => refund = amount_cents (status REFUNDED)
      withdraw auto refund: payment SUCCEEDED AND no HELD/CONFIRMED/PLAYED slot ever
        referenced the submission's entry
        => refund = round_half_up(amount_cents * 0.50) (status PARTIALLY_REFUNDED)
      otherwise no refund.
      Worked: amount 6075 => withdraw refund = round(3037.50) = 3038.
    input_set: "the submission's latest SUCCEEDED FeePayment"
    constants:
      FULL_REFUND_WINDOW_HOURS: 48
      WITHDRAWAL_REFUND_PCT: 0.50
    precision: "whole cents; round_half_up"
    variants:
      - name: full_refund
        when: "admin refund inside 48h cooling window while submission still SUBMITTED"
        difference: "100% of amount_cents"
      - name: withdrawal_half_refund
        when: "filmmaker withdraws before any slot occupation"
        difference: "50% with half-up rounding; odd-cent amounts round up"

  - name: composite_score
    trigger: "Score create/PATCH on any SCORED assignment of the submission"
    algorithm: weighted_scoring
    formula: |
      weight(programmer.seniority): STAFF=1.0, SENIOR=1.5, LEAD=2.0
      input = Score.overall over assignments of this submission with status SCORED
      provisional_score = round_half_up(mean(overall), 3)   # simple mean
      composite_score   = round_half_up(sum(overall*weight)/sum(weight), 3)
                          only when count(SCORED) >= category.screener_count_required
                          else null
      Worked: LEAD 8, SENIOR 7, STAFF 9 => composite = (8*2 + 7*1.5 + 9*1)/4.5
              = 35.5/4.5 = 7.8888... => 7.889; provisional = 24/3 = 8.000.
    input_set: "ScreenerAssignment status SCORED only; RECUSED/EXPIRED/ASSIGNED excluded"
    constants:
      WEIGHT_STAFF: 1.0
      WEIGHT_SENIOR: 1.5
      WEIGHT_LEAD: 2.0
      SLATE_COMPOSITE_THRESHOLD: 7.500
    precision: "3 decimal places; round_half_up applied once on the final quotient"
    variants:
      - name: provisional
        when: "displayed during SCREENING (and always available)"
        difference: "unweighted simple mean; can differ from composite — e.g. 8.000 vs 7.889"
      - name: official
        when: "composite_score; the only value honored by slate lock"
        difference: "seniority-weighted; requires screener_count_required scores"

  - name: jury_tally_irv
    trigger: "POST /festival/awards/{id}/tally"
    algorithm: chronological
    formula: |
      candidates = submissions with status PROGRAMMED whose SlateEntry.slate.section
                   == award.section
      active_ballots = all JuryVote rows for the award
      loop:
        count current first preferences among active candidates over active_ballots
        if a candidate holds > 50% of active_ballots => winner
        eliminate the candidate with the FEWEST current first preferences
          tie among lowest: eliminate the tied candidate whose EARLIEST current
          first-preference ballot (by JuryVote.submitted_at, then created_at) is LATEST
          still tied: fewest total mentions across all ballots
          final fallback: candidate submission created_at ASC loses (is eliminated)
        ballots whose ranked candidates are all eliminated become exhausted and
          leave active_ballots
      Worked: ballots A>C (x2), B>A (x2), C>B (x1) => first prefs A2 B2 C1;
      C eliminated; C ballot transfers to B => B3 A2; B wins with 3/5.
    input_set: "JuryVote rows for the award; eligible candidates as above"
    constants:
      MAJORITY: "strictly more than 50% of active (non-exhausted) ballots"
    precision: "integer vote counts; no rounding"
    variants:
      - name: provisional_first_preference
        when: "GET /festival/awards/{id}/standings during VOTING_OPEN"
        difference: "raw first-preference counts only; provisional leader can differ from the IRV winner (worked example: A ties first prefs 2-2 yet B wins)"
      - name: official_irv
        when: "POST /festival/awards/{id}/tally"
        difference: "full instant-runoff with elimination rounds and pinned tie-breaks"

  - name: travel_stipend
    trigger: "POST /festival/travel-packages/{id}/submit (raw) and /approve (clamped)"
    algorithm: tiered_pricing
    formula: |
      is_international = origin_country_code != edition.host_country_code
      base = is_international ? 150000 : 50000
      covered_extras = max(0, min(delegate_count, MAX_DELEGATES_COVERED) - 1)
      raw_stipend_cents = min(PER_FILM_CAP_CENTS, base + covered_extras * PER_EXTRA_DELEGATE_CENTS)
      at approve: stipend_cents = min(raw_stipend_cents, edition.travel_budget_remaining)
      Worked: international, 3 delegates => 150000 + 20000*1 = 170000 (cap 200000 not hit)
      domestic, 1 delegate => 50000
      international 170000 with budget remaining 100000 => stipend_cents = 100000
    input_set: "TravelPackage delegate_count/origin_country_code; edition pools at approve time"
    constants:
      DOMESTIC_BASE_CENTS: 50000
      INTERNATIONAL_BASE_CENTS: 150000
      PER_EXTRA_DELEGATE_CENTS: 20000
      MAX_DELEGATES_COVERED: 2
      PER_FILM_CAP_CENTS: 200000
    precision: "whole cents; no rounding"
    variants:
      - name: raw
        when: "at submit"
        difference: "uncapped-by-budget figure"
      - name: budget_clamped
        when: "at approve"
        difference: "min(raw, travel_budget_remaining); evaluation order pinned: raw computed first, then clamped against budget computed WITHOUT this package"

  - name: hotel_night_allocation
    trigger: "POST /festival/travel-packages/{id}/approve; reversed on cancel"
    algorithm: waterfall_allocation
    formula: |
      hotel_nights_allocated = min(hotel_nights_requested, edition.hotel_nights_remaining)
      edition.hotel_nights_remaining = hotel_nights_pool - sum(allocated over
        TravelPackage status in {APPROVED, BOOKED, RECONCILED})
      Invariant INV-HOTEL: sum(allocated) + hotel_nights_remaining == hotel_nights_pool
      at all times; cancel restores the allocation to the pool.
    input_set: "TravelPackages of the edition with status in {APPROVED, BOOKED, RECONCILED}"
    precision: "whole nights"
    variants: []

  - name: slot_fit_and_overlap
    trigger: "POST /festival/screening-slots (create) and /hold (film fit)"
    algorithm: interval_merge
    formula: |
      window: edition.festival_start_at <= start_at AND end_at <= edition.festival_end_at
              AND start_at < end_at
      occupation set: slots of the same venue with status in {OPEN, HELD, CONFIRMED, PLAYED}
      candidate [s,e) conflicts with existing [s2,e2) unless
        e + venue.turnover_minutes <= s2  OR  e2 + venue.turnover_minutes <= s
      adjacency with exactly the turnover buffer between them does NOT conflict.
      film fit at hold: (end_at - start_at) >= runtime_minutes + QA_MINUTES
    input_set: "all slots of the venue except CANCELLED"
    constants:
      QA_MINUTES: 15
    precision: "minute resolution"
    variants:
      - name: turnover_buffered
        when: "always"
        difference: "buffer belongs to BOTH neighbors: e + turnover <= s2 is the acceptance test"

  - name: slate_lane_assignment
    trigger: "POST /festival/slates/{id}/lock"
    algorithm: threshold
    formula: |
      entries ordered by rank_position ASC
      rank_position <= slate.capacity_slots => lane MAIN else WAITLIST
      lock precondition: entry_count >= capacity_slots AND every MAIN-lane entry's
        submission.composite_score != null AND >= SLATE_COMPOSITE_THRESHOLD (7.500)
      boundary: composite exactly 7.500 passes (>=)
    input_set: "SlateEntry rows of the slate with status != DROPPED, ordered by rank_position ASC"
    constants:
      SLATE_COMPOSITE_THRESHOLD: 7.500
    precision: "composite compared at its stored 3-decimal precision"
    variants: []

  - name: edition_aggregate_ledger
    trigger: "any FeePayment, TravelPackage, or Award mutation; recomputed immediately"
    algorithm: aggregation
    formula: |
      total_fees_collected_cents = sum(FeePayment.amount_cents where status in
        {SUCCEEDED, PARTIALLY_REFUNDED}) over submissions of this edition
      total_refunded_cents = sum(FeePayment.refunded_amount_cents) over same scope
      travel_committed_cents = sum(stipend_cents where TravelPackage.status in
        {APPROVED, BOOKED, RECONCILED})
      travel_penalty_sink_cents = sum(penalty_cents where status CANCELLED)
      travel_budget_remaining = travel_budget_cents - committed - sink
      Invariant INV-TRAVEL: remaining + committed + sink == travel_budget_cents
      hotel_nights_allocated / remaining per hotel_night_allocation
      prize_committed_cents = sum(prize_cents where Award.status in
        {SETUP, VOTING_OPEN, TALLIED, ANNOUNCED, DISBURSED})
      prize_disbursed_cents = sum(disbursed_amount_cents where DISBURSED)
    input_set: "all child rows of the edition, status-filtered as written"
    precision: "whole cents"
    variants: []

  - name: prize_pool_check
    trigger: "POST /festival/awards (creation) and /disburse"
    algorithm: threshold
    formula: |
      at create: prize_cents <= prize_pool_cents - sum(prize_cents of existing awards
        of the edition with status != CANCELLED-ish; all non-terminal count)
        else ERR_PRIZE_POOL_EXHAUSTED
      at disburse: disbursed_amount_cents := prize_cents (no withholding)
    input_set: "Award rows of the edition in any status"
    precision: "whole cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path-templated resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: auth
    check: "Entity-backed actor owns the target: FILMMAKER X-User-ID == submission.submitter_id (via entry/payment/package/agreement links); PROGRAMMER X-User-ID == assignment.programmer_id; JUROR X-User-ID == juror_id of ballot context"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 5
    category: state
    check: "Target resource's own state machine permits the transition (covers invalid-from and terminal lockdown). Domain-specific state errors declared on an endpoint or transition (ERR_SCORE_EXISTS, ERR_ENTRY_NOT_CONFIRMED, ERR_AGREEMENT_NOT_SIGNED, ERR_SCORES_LOCKED) fire at THIS priority in place of generic ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Edition posture gate: operation allowed only in declared edition status set"
    error_id: ERR_EDITION_PHASE_FORBIDDEN
    http_status: 409
    applies_to: "submission create/checkout, eligibility-decision, assignment create/score, slate deliberate/entries, issue-invitations, slot hold/mark-played, travel reconcile, award open-voting/announce"
  - priority: 7
    category: business_temporal
    check: "Clock-based window rules: intake window, late deadline, RSVP deadline, slot within festival window, premiere-before-public ordering"
    error_id: "ERR_INTAKE_NOT_YET_OPEN | ERR_SLOT_OUTSIDE_FESTIVAL_WINDOW | ERR_PREMIERE_WINDOW_VIOLATION | ERR_REFUND_WINDOW_CLOSED | ERR_FESTIVAL_NOT_STARTED"
    http_status: 409
    applies_to: "temporal endpoints"
  - priority: 8
    category: business_safety
    check: "COI and segregation: programmer COI on assign; slate lock actor != last entry adder; juror COI on ballot contents"
    error_id: "ERR_COI_RECUSAL_REQUIRED | ERR_SEGREGATION_OF_DUTIES | ERR_JUROR_CONFLICT"
    http_status: 409
    applies_to: "assignment create, slate lock, ballot create"
  - priority: 9
    category: business_referential
    check: "Body-referenced entities exist and belong to the same edition (venue/edition, entry/slot edition match, jurors in award.assigned_juror_ids belong to edition, category config exists for (edition, category))"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "endpoints with body FKs"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and structural constraints: duplicate submitter email, duplicate submission title per (edition, submitter), duplicate category config, duplicate slate section, duplicate active assignment per (submission, programmer), one score per assignment, one ballot per juror per award, duplicate slate entry, premiere slot uniqueness, eligibility field ranges (runtime/completion), section-category mapping, slot overlap with turnover, slot duration fit, slate lock quorum/threshold, scoring quorum for advance, ballot candidate validity, licensed screening count, format support"
    error_id: "ERR_DUPLICATE_EMAIL | ERR_DUPLICATE_SUBMISSION | ERR_DUPLICATE_CATEGORY_CONFIG | ERR_DUPLICATE_SLATE | ERR_DUPLICATE_ASSIGNMENT | ERR_SCORE_EXISTS | ERR_BALLOT_EXISTS | ERR_DUPLICATE_ENTRY | ERR_PREMIERE_SLOT_EXISTS | ERR_INELIGIBLE_RUNTIME | ERR_INELIGIBLE_COMPLETION_DATE | ERR_INELIGIBLE_PREMIERE | ERR_SECTION_CATEGORY_MISMATCH | ERR_VENUE_OVERLAP | ERR_SLOT_TOO_SHORT | ERR_SLATE_UNDERFILLED | ERR_BELOW_SLATE_THRESHOLD | ERR_SCORING_INCOMPLETE | ERR_ELIGIBILITY_DECISIONS_PENDING | ERR_BALLOT_INVALID | ERR_LICENSED_COUNT_EXCEEDED | ERR_LICENSED_BELOW_USED | ERR_FORMAT_UNSUPPORTED | ERR_NO_CATEGORY_CONFIG | ERR_SLATES_UNLOCKED | ERR_INVITATIONS_PENDING | ERR_AWARDS_PENDING | ERR_UNRESOLVED_INFO_REQUEST | ERR_ACTIVE_SLOTS_EXIST | ERR_ENTRY_NOT_CONFIRMED | ERR_ASSIGNMENT_CAP"
    http_status: 409
    applies_to: "per-endpoint as declared"
  - priority: 11
    category: business_fiscal
    check: "Money/quota guards: travel budget exhausted, hotel pool exhausted, prize pool exhausted, payment not refundable"
    error_id: "ERR_TRAVEL_BUDGET_EXHAUSTED | ERR_HOTEL_NIGHTS_EXHAUSTED | ERR_PRIZE_POOL_EXHAUSTED | ERR_PAYMENT_NOT_REFUNDABLE | ERR_REFUND_NOT_ALLOWED"
    http_status: 409
    applies_to: "travel approve, award create, refund"
  - priority: 12
    category: state
    check: "OCC stale-version guard on versioned write endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /festival/slates/{id}/entries, POST /festival/screening-slots, POST /festival/travel-packages/{id}/approve, POST /festival/exhibition-agreements/{id}/amend"
  - priority: 0
    category: existence
    check: "Request shape: required fields present, enum values valid, integer ranges sane (delegate_count >= 1, hotel_nights_requested >= 1, scores 1..10, capacity_slots >= 1, prize_cents >= 0, end_at > start_at)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with bodies"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving (outside public surface) ---
  - method: POST
    path: "/festival/_clock/set_current_utc"
    description: "Sets the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads that value and never the wall clock. Advancing the clock triggers sweeps: intake auto-close when past late_deadline_at, assignment expiry past due_at (with replacement cascade), invitation expiry past rsvp_deadline_at (with promotion cascade)."
    roles: [FESTIVAL_ADMIN]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sweeps: edition auto-close, ScreenerAssignment EXPIRED + replacement, SlateEntry EXPIRED + promotion"]

  - method: POST
    path: "/festival/_payments/simulate"
    description: "Drives a FeePayment to SUCCEEDED or FAILED deterministically."
    roles: [FESTIVAL_ADMIN]
    code: 200
    input: [fee_payment_id, outcome]
    output: FeePayment
    side_effects: ["SUCCEEDED: paid_at stamped, Submission DRAFT -> SUBMITTED, payment_status -> PAID, edition fee aggregates recomputed; FAILED: payment FAILED"]

  # --- FestivalEdition ---
  - method: POST
    path: "/festival/editions"
    description: "Create a festival edition (status SETUP)."
    roles: [FESTIVAL_ADMIN]
    code: 201
    input: [year, intake_open_at, early_deadline_at, regular_deadline_at, late_deadline_at, festival_start_at, festival_end_at, hotel_nights_pool, travel_budget_cents, prize_pool_cents, "host_country_code?", "rsvp_window_days?"]
    output: FestivalEdition
    side_effects: ["status=SETUP; aggregate fields zeroed"]

  - method: GET
    path: "/festival/editions/{id}"
    description: "Read an edition including derived aggregate ledger fields."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS, TRAVEL_COORDINATOR, AWARDS_ADMIN, PROGRAMMER, FILMMAKER, JUROR]
    code: 200
    input: []
    output: FestivalEdition
    side_effects: []

  - method: POST
    path: "/festival/editions/{id}/advance"
    description: "Advance edition posture; per-transition gates and bulk cascades per state machine."
    roles: [FESTIVAL_ADMIN]
    code: 200
    input: [to_status]
    output: FestivalEdition
    side_effects: ["gate checks per transition; bulk cascades (ELIGIBLE -> IN_SCREENING; WAITLISTED -> DECLINED); Score lock at DELIBERATION; increments FestivalEdition.version"]

  # --- CategoryConfig ---
  - method: POST
    path: "/festival/category-configs"
    description: "Create per-category fee/eligibility policy for an edition."
    roles: [FESTIVAL_ADMIN]
    code: 201
    input: [edition_id, category, min_runtime_minutes, max_runtime_minutes, premiere_requirement, completion_cutoff, early_fee_cents, regular_fee_cents, late_fee_cents, "screener_count_required?"]
    output: CategoryConfig
    side_effects: ["ERR_DUPLICATE_CATEGORY_CONFIG when (edition_id, category) exists"]

  - method: GET
    path: "/festival/editions/{id}/category-configs"
    description: "List category configs of an edition."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS, TRAVEL_COORDINATOR, AWARDS_ADMIN, PROGRAMMER, FILMMAKER, JUROR]
    code: 200
    input: ["limit?", "offset?"]
    output: "CategoryConfig[]"
    side_effects: []

  # --- Submitter ---
  - method: POST
    path: "/festival/submitters"
    description: "Register a submitter account (public intake)."
    roles: [PUBLIC]
    code: 201
    input: [legal_name, email, country_of_residence, "is_student?", "is_member?"]
    output: Submitter
    side_effects: ["ERR_DUPLICATE_EMAIL when email already registered"]

  - method: GET
    path: "/festival/submitters/{id}"
    description: "Read a submitter; FILMMAKER may read only own record."
    roles: [FESTIVAL_ADMIN, FILMMAKER]
    code: 200
    input: []
    output: Submitter
    side_effects: []

  # --- Programmer ---
  - method: POST
    path: "/festival/programmers"
    description: "Onboard a programmer."
    roles: [FESTIVAL_ADMIN]
    code: 201
    input: [display_name, email, seniority, categories_covered, "coi_production_companies?", "max_active_assignments?", "active?"]
    output: Programmer
    side_effects: []

  - method: GET
    path: "/festival/programmers/{id}"
    description: "Read a programmer."
    roles: [FESTIVAL_ADMIN, PROGRAM_CHAIR, PROGRAMMER]
    code: 200
    input: []
    output: Programmer
    side_effects: []

  - method: PATCH
    path: "/festival/programmers/{id}"
    description: "Update programmer flags/capacity; deactivating reassigns their ASSIGNED assignments via the replacement selector."
    roles: [FESTIVAL_ADMIN]
    code: 200
    input: ["active?", "categories_covered?", "max_active_assignments?", "coi_production_companies?"]
    output: Programmer
    side_effects: ["active true->false: each ASSIGNED assignment -> RECUSED with replacement cascade"]

  # --- Submission ---
  - method: POST
    path: "/festival/submissions"
    description: "Create a submission in DRAFT. Validates edition posture, intake window, category config existence, runtime range, completion cutoff, duplicate title."
    roles: [FILMMAKER]
    code: 201
    input: [edition_id, category, title, runtime_minutes, completion_date, premiere_status, production_company, format]
    output: Submission
    side_effects: ["submitter_id := X-User-ID; status=DRAFT; payment_status=UNPAID"]

  - method: GET
    path: "/festival/submissions/{id}"
    description: "Read a submission; FILMMAKER may read only own."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS, TRAVEL_COORDINATOR, AWARDS_ADMIN, PROGRAMMER, FILMMAKER, JUROR]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: GET
    path: "/festival/submissions"
    description: "List submissions with filters and pagination."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS, TRAVEL_COORDINATOR, AWARDS_ADMIN, PROGRAMMER, FILMMAKER, JUROR]
    code: 200
    input: ["edition_id?", "submitter_id?", "status?", "category?", "limit?", "offset?"]
    output: "Submission[]"
    side_effects: ["FILMMAKER sees only own submissions regardless of filters"]

  - method: PATCH
    path: "/festival/submissions/{id}"
    description: "Amend a submission while DRAFT or NEEDS_INFO; re-validates runtime/completion/premiere fields; in NEEDS_INFO sets needs_info_resolved=true."
    roles: [FILMMAKER]
    code: 200
    input: ["title?", "runtime_minutes?", "completion_date?", "premiere_status?", "production_company?", "format?"]
    output: Submission
    side_effects: ["increments Submission.version; sets needs_info_resolved when NEEDS_INFO"]

  - method: POST
    path: "/festival/submissions/{id}/checkout"
    description: "Create (or return the existing INITIATED) FeePayment for a DRAFT submission; fee per submission_fee calculation using the logical clock."
    roles: [FILMMAKER]
    code: 201
    input: []
    output: FeePayment
    side_effects: ["FeePayment created with computed tier/discounts; repeated checkout while INITIATED returns the same payment unchanged"]

  - method: POST
    path: "/festival/submissions/{id}/withdraw"
    description: "Withdraw a submission; refund policy, slot unwind, slate-entry drop and waitlist promotion cascades per state machine."
    roles: [FILMMAKER]
    code: 200
    input: []
    output: Submission
    side_effects: ["status -> WITHDRAWN; auto-refund 50% when applicable; entry DROPPED + promotion; HELD slots -> OPEN; CONFIRMED slots -> CANCELLED with agreement decrement"]

  - method: POST
    path: "/festival/submissions/{id}/eligibility-decision"
    description: "Record an eligibility ruling on a SUBMITTED film."
    roles: [FESTIVAL_ADMIN]
    code: 200
    input: [decision, "reason?"]
    output: Submission
    side_effects: ["SUBMITTED -> ELIGIBLE | INELIGIBLE | NEEDS_INFO (or SUBMITTED -> IN_SCREENING during SCREENING); NEEDS_INFO clears needs_info_resolved"]

  - method: POST
    path: "/festival/submissions/{id}/resubmit"
    description: "Return a NEEDS_INFO submission to SUBMITTED after amendment."
    roles: [FILMMAKER]
    code: 200
    input: []
    output: Submission
    side_effects: ["needs_info_resolved must be true (ERR_UNRESOLVED_INFO_REQUEST)"]

  # --- FeePayment ---
  - method: GET
    path: "/festival/fee-payments/{id}"
    description: "Read a payment; FILMMAKER may read only own submission's payments."
    roles: [FESTIVAL_ADMIN, FILMMAKER]
    code: 200
    input: []
    output: FeePayment
    side_effects: []

  - method: GET
    path: "/festival/fee-payments"
    description: "List payments filtered by submission."
    roles: [FESTIVAL_ADMIN, FILMMAKER]
    code: 200
    input: ["submission_id?", "status?", "limit?", "offset?"]
    output: "FeePayment[]"
    side_effects: []

  - method: POST
    path: "/festival/fee-payments/{id}/refund"
    description: "Full refund inside the 48h cooling window while the submission is still SUBMITTED."
    roles: [FESTIVAL_ADMIN]
    code: 200
    input: [reason]
    output: FeePayment
    side_effects: ["SUCCEEDED -> REFUNDED; refunded_amount_cents := amount_cents; submission payment_status -> REFUNDED; edition totals recomputed"]

  # --- ScreenerAssignment ---
  - method: POST
    path: "/festival/screener-assignments"
    description: "Assign a screener to a programmer."
    roles: [PROGRAM_CHAIR]
    code: 201
    input: [submission_id, programmer_id, due_at]
    output: ScreenerAssignment
    side_effects: ["validations: edition SCREENING; submission IN_SCREENING; programmer active, category covered, COI-free, under cap, no duplicate ASSIGNED pair; programmer.active_assignment_count incremented"]

  - method: GET
    path: "/festival/screener-assignments/{id}"
    description: "Read an assignment."
    roles: [FESTIVAL_ADMIN, PROGRAM_CHAIR, PROGRAMMER]
    code: 200
    input: []
    output: ScreenerAssignment
    side_effects: []

  - method: GET
    path: "/festival/screener-assignments"
    description: "List assignments with filters."
    roles: [FESTIVAL_ADMIN, PROGRAM_CHAIR, PROGRAMMER]
    code: 200
    input: ["submission_id?", "programmer_id?", "status?", "limit?", "offset?"]
    output: "ScreenerAssignment[]"
    side_effects: ["PROGRAMMER sees only own assignments"]

  - method: POST
    path: "/festival/screener-assignments/{id}/recuse"
    description: "Programmer recuses; replacement selector cascade."
    roles: [PROGRAMMER]
    code: 200
    input: []
    output: ScreenerAssignment
    side_effects: ["ASSIGNED -> RECUSED; replacement ScreenerAssignment created via selector policy when pool non-empty"]

  - method: POST
    path: "/festival/screener-assignments/{id}/scores"
    description: "Submit a rubric score for an assignment (one score per assignment)."
    roles: [PROGRAMMER]
    code: 201
    input: [originality, craft, story, overall, recommendation]
    output: Score
    side_effects: ["ASSIGNED -> SCORED; provisional_score/composite_score recomputed; ERR_SCORE_EXISTS on second score"]

  - method: GET
    path: "/festival/screener-assignments/{id}/scores"
    description: "List the score (0 or 1) for an assignment."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, PROGRAMMER]
    code: 200
    input: ["limit?", "offset?"]
    output: "Score[]"
    side_effects: []

  - method: GET
    path: "/festival/scores/{id}"
    description: "Read a score."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, PROGRAMMER]
    code: 200
    input: []
    output: Score
    side_effects: []

  - method: PATCH
    path: "/festival/scores/{id}"
    description: "Edit a score while its edition is still in SCREENING; rejected once scores are locked."
    roles: [PROGRAMMER]
    code: 200
    input: ["originality?", "craft?", "story?", "overall?", "recommendation?"]
    output: Score
    side_effects: ["ERR_SCORES_LOCKED when edition past SCREENING; recomputes submission scores"]

  # --- Slate / SlateEntry ---
  - method: POST
    path: "/festival/slates"
    description: "Create a program slate for an edition section (unique per edition+section)."
    roles: [PROGRAM_CHAIR]
    code: 201
    input: [edition_id, section, capacity_slots]
    output: Slate
    side_effects: ["status=OPEN; ERR_DUPLICATE_SLATE"]

  - method: GET
    path: "/festival/slates/{id}"
    description: "Read a slate."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR]
    code: 200
    input: []
    output: Slate
    side_effects: []

  - method: GET
    path: "/festival/slates"
    description: "List slates."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR]
    code: 200
    input: ["edition_id?", "status?", "limit?", "offset?"]
    output: "Slate[]"
    side_effects: []

  - method: POST
    path: "/festival/slates/{id}/deliberate"
    description: "Open the slate for entry editing (OPEN -> DELIBERATING)."
    roles: [PROGRAM_CHAIR]
    code: 200
    input: []
    output: Slate
    side_effects: []

  - method: POST
    path: "/festival/slates/{id}/entries"
    description: "Add a submission to the slate (OCC on slate version). Entry NOMINATED with next rank_position; submission IN_SCREENING -> ADVANCED."
    roles: [PROGRAM_CHAIR]
    code: 201
    input: [submission_id, expected_slate_version]
    output: SlateEntry
    side_effects: ["Slate.version incremented; last_entry_added_by := X-User-ID; submission IN_SCREENING -> ADVANCED; ERR_DUPLICATE_ENTRY; ERR_SECTION_CATEGORY_MISMATCH; ERR_STALE_VERSION"]

  - method: GET
    path: "/festival/slates/{id}/entries"
    description: "List entries of a slate ordered by rank_position ASC."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, FILMMAKER]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SlateEntry[]"
    side_effects: []

  - method: DELETE
    path: "/festival/slates/{id}/entries/{entry_id}"
    description: "Remove an entry while DELIBERATING; compensating revert of the add."
    roles: [PROGRAM_CHAIR]
    code: 204
    input: []
    output: null
    side_effects: ["entry -> DROPPED; submission ADVANCED -> IN_SCREENING; rank_positions compacted; Slate.version incremented"]

  - method: POST
    path: "/festival/slates/{id}/lock"
    description: "Lock the slate (FESTIVAL_DIRECTOR); segregation-of-duties, underfill, and composite threshold gates; assigns lanes and snapshots scores."
    roles: [FESTIVAL_DIRECTOR]
    code: 200
    input: []
    output: Slate
    side_effects: ["DELIBERATING -> LOCKED; lane MAIN/WAITLIST per rank vs capacity; locked_composite_score snapshots; locked_at stamped"]

  - method: POST
    path: "/festival/slates/{id}/reopen"
    description: "Reopen a locked slate before any invitation has been issued."
    roles: [FESTIVAL_DIRECTOR]
    code: 200
    input: []
    output: Slate
    side_effects: ["LOCKED -> DELIBERATING; lanes cleared to UNASSIGNED; locked_composite_score cleared"]

  - method: GET
    path: "/festival/slate-entries/{entry_id}"
    description: "Read a slate entry."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS, FILMMAKER]
    code: 200
    input: []
    output: SlateEntry
    side_effects: []

  - method: GET
    path: "/festival/slate-entries"
    description: "List slate entries filtered by submission or slate."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS, FILMMAKER]
    code: 200
    input: ["submission_id?", "slate_id?", "status?", "lane?", "limit?", "offset?"]
    output: "SlateEntry[]"
    side_effects: ["FILMMAKER sees only entries for own submissions"]

  - method: POST
    path: "/festival/slate-entries/{entry_id}/respond"
    description: "Filmmaker accepts or declines an invitation."
    roles: [FILMMAKER]
    code: 200
    input: [accept]
    output: SlateEntry
    side_effects: ["accept: entry INVITED -> CONFIRMED, submission -> CONFIRMED, TravelPackage + ExhibitionAgreement created DRAFT; decline: entry -> DECLINED, submission -> DECLINED_BY_FILMMAKER, promotion cascade"]

  - method: POST
    path: "/festival/editions/{id}/issue-invitations"
    description: "Bulk action: for every LOCKED slate of the edition, MAIN-lane NOMINATED entries become INVITED with RSVP deadline; WAITLIST lane submissions become WAITLISTED; IN_SCREENING submissions on no locked slate become DECLINED."
    roles: [FESTIVAL_DIRECTOR]
    code: 200
    input: []
    output: "{ invited_entry_ids: string[], declined_submission_ids: string[], waitlisted_submission_ids: string[] }"
    side_effects: ["edition must be NOTIFICATION and all slates LOCKED; per-entry cascades as declared"]

  # --- Venue / ScreeningSlot ---
  - method: POST
    path: "/festival/venues"
    description: "Create a venue for an edition (allowed before festival goes live)."
    roles: [FESTIVAL_ADMIN]
    code: 201
    input: [edition_id, name, seat_capacity, formats_supported, "turnover_minutes?"]
    output: Venue
    side_effects: ["ERR_EDITION_PHASE_FORBIDDEN once edition is FESTIVAL_LIVE or later"]

  - method: GET
    path: "/festival/venues/{id}"
    description: "Read a venue."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/festival/venues"
    description: "List venues."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS]
    code: 200
    input: ["edition_id?", "limit?", "offset?"]
    output: "Venue[]"
    side_effects: []

  - method: POST
    path: "/festival/screening-slots"
    description: "Create an OPEN slot on a venue grid (OCC on venue version); window and overlap (with turnover buffer) validated."
    roles: [SCHEDULING_OPS]
    code: 201
    input: [venue_id, slot_type, start_at, end_at, expected_venue_version]
    output: ScreeningSlot
    side_effects: ["Venue.version incremented; ERR_SLOT_OUTSIDE_FESTIVAL_WINDOW; ERR_VENUE_OVERLAP; ERR_STALE_VERSION"]

  - method: GET
    path: "/festival/screening-slots/{id}"
    description: "Read a slot."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS, FILMMAKER]
    code: 200
    input: []
    output: ScreeningSlot
    side_effects: []

  - method: GET
    path: "/festival/screening-slots"
    description: "List slots filtered by venue or entry."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, PROGRAM_CHAIR, SCHEDULING_OPS, FILMMAKER]
    code: 200
    input: ["venue_id?", "slate_entry_id?", "slot_type?", "status?", "limit?", "offset?"]
    output: "ScreeningSlot[]"
    side_effects: []

  - method: POST
    path: "/festival/screening-slots/{id}/hold"
    description: "Hold an OPEN slot for a CONFIRMED slate entry; agreement/premiere/format/duration gates."
    roles: [SCHEDULING_OPS]
    code: 200
    input: [slate_entry_id]
    output: ScreeningSlot
    side_effects: ["OPEN -> HELD; slate_entry_id set"]

  - method: POST
    path: "/festival/screening-slots/{id}/confirm"
    description: "Confirm a HELD slot; licensed-count gate; cascades to agreement/entry/submission."
    roles: [SCHEDULING_OPS]
    code: 200
    input: []
    output: ScreeningSlot
    side_effects: ["HELD -> CONFIRMED; agreement used_screening_count += 1; agreement SIGNED -> ACTIVE; first confirm moves entry and submission to PROGRAMMED"]

  - method: POST
    path: "/festival/screening-slots/{id}/release"
    description: "Release a HELD slot back to OPEN."
    roles: [SCHEDULING_OPS]
    code: 200
    input: []
    output: ScreeningSlot
    side_effects: ["HELD -> OPEN; slate_entry_id cleared"]

  - method: POST
    path: "/festival/screening-slots/{id}/cancel"
    description: "Cancel a CONFIRMED slot; compensating decrement and reverse cascade."
    roles: [SCHEDULING_OPS]
    code: 200
    input: []
    output: ScreeningSlot
    side_effects: ["CONFIRMED -> CANCELLED; agreement used_screening_count -= 1; if zero CONFIRMED/PLAYED remain for entry: entry and submission PROGRAMMED -> CONFIRMED"]

  - method: POST
    path: "/festival/screening-slots/{id}/mark-played"
    description: "Mark a CONFIRMED slot as played during FESTIVAL_LIVE."
    roles: [SCHEDULING_OPS]
    code: 200
    input: []
    output: ScreeningSlot
    side_effects: ["CONFIRMED -> PLAYED"]

  # --- TravelPackage ---
  - method: GET
    path: "/festival/travel-packages/{id}"
    description: "Read a travel package."
    roles: [FESTIVAL_ADMIN, TRAVEL_COORDINATOR, FILMMAKER]
    code: 200
    input: []
    output: TravelPackage
    side_effects: []

  - method: GET
    path: "/festival/travel-packages"
    description: "List travel packages."
    roles: [FESTIVAL_ADMIN, TRAVEL_COORDINATOR, FILMMAKER]
    code: 200
    input: ["submission_id?", "edition_id?", "status?", "limit?", "offset?"]
    output: "TravelPackage[]"
    side_effects: ["FILMMAKER sees only own submissions' packages"]

  - method: POST
    path: "/festival/travel-packages/{id}/submit"
    description: "Submit travel details; computes raw stipend."
    roles: [FILMMAKER]
    code: 200
    input: [delegate_count, origin_country_code, hotel_nights_requested]
    output: TravelPackage
    side_effects: ["DRAFT|CHANGES_REQUESTED -> SUBMITTED; is_international and raw_stipend_cents computed"]

  - method: POST
    path: "/festival/travel-packages/{id}/approve"
    description: "Approve a package (OCC on edition version); clamps stipend to remaining budget and allocates hotel nights."
    roles: [TRAVEL_COORDINATOR]
    code: 200
    input: [expected_edition_version]
    output: TravelPackage
    side_effects: ["SUBMITTED -> APPROVED; stipend_cents and hotel_nights_allocated set; edition aggregates recomputed; FestivalEdition.version incremented; ERR_STALE_VERSION"]

  - method: POST
    path: "/festival/travel-packages/{id}/request-changes"
    description: "Send a package back for filmmaker changes."
    roles: [TRAVEL_COORDINATOR]
    code: 200
    input: []
    output: TravelPackage
    side_effects: ["SUBMITTED -> CHANGES_REQUESTED"]

  - method: POST
    path: "/festival/travel-packages/{id}/mark-booked"
    description: "Mark an approved package as booked."
    roles: [TRAVEL_COORDINATOR]
    code: 200
    input: []
    output: TravelPackage
    side_effects: ["APPROVED -> BOOKED"]

  - method: POST
    path: "/festival/travel-packages/{id}/cancel"
    description: "Cancel an approved/booked package; releases allocations; BOOKED cancellation forfeits 25% penalty to the sink."
    roles: [TRAVEL_COORDINATOR, FILMMAKER]
    code: 200
    input: []
    output: TravelPackage
    side_effects: ["APPROVED|BOOKED -> CANCELLED; allocations released; penalty on BOOKED; edition aggregates recomputed"]

  - method: POST
    path: "/festival/travel-packages/{id}/reconcile"
    description: "Reconcile a booked package after the festival is live."
    roles: [TRAVEL_COORDINATOR]
    code: 200
    input: []
    output: TravelPackage
    side_effects: ["BOOKED -> RECONCILED"]

  # --- ExhibitionAgreement ---
  - method: GET
    path: "/festival/exhibition-agreements/{id}"
    description: "Read an agreement."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, SCHEDULING_OPS, FILMMAKER]
    code: 200
    input: []
    output: ExhibitionAgreement
    side_effects: []

  - method: GET
    path: "/festival/exhibition-agreements"
    description: "List agreements."
    roles: [FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, SCHEDULING_OPS, FILMMAKER]
    code: 200
    input: ["submission_id?", "slate_entry_id?", "status?", "limit?", "offset?"]
    output: "ExhibitionAgreement[]"
    side_effects: ["FILMMAKER sees only own submissions' agreements"]

  - method: POST
    path: "/festival/exhibition-agreements/{id}/issue"
    description: "Issue a DRAFT agreement to the filmmaker with license terms."
    roles: [FESTIVAL_DIRECTOR]
    code: 200
    input: [rights_scope, licensed_screening_count, exclusivity_until, revenue_share_pct]
    output: ExhibitionAgreement
    side_effects: ["DRAFT -> ISSUED"]

  - method: POST
    path: "/festival/exhibition-agreements/{id}/sign"
    description: "Filmmaker signs; pins submission version."
    roles: [FILMMAKER]
    code: 200
    input: []
    output: ExhibitionAgreement
    side_effects: ["ISSUED -> SIGNED; submission_version_at_signing := submission.version"]

  - method: POST
    path: "/festival/exhibition-agreements/{id}/amend"
    description: "Amend a signed/active agreement (OCC on agreement version); cannot drop licensed count below used."
    roles: [FESTIVAL_DIRECTOR]
    code: 200
    input: [expected_agreement_version, "rights_scope?", "licensed_screening_count?", "exclusivity_until?", "revenue_share_pct?"]
    output: ExhibitionAgreement
    side_effects: ["status stays SIGNED/ACTIVE (becomes ACTIVE); agreement.version incremented; submission_version_at_signing refreshed; ERR_STALE_VERSION; ERR_LICENSED_BELOW_USED"]

  - method: POST
    path: "/festival/exhibition-agreements/{id}/terminate"
    description: "Terminate an agreement; blocked while slots are held/confirmed."
    roles: [FESTIVAL_DIRECTOR]
    code: 200
    input: []
    output: ExhibitionAgreement
    side_effects: ["SIGNED|ACTIVE -> TERMINATED; ERR_ACTIVE_SLOTS_EXIST"]

  # --- Juror / Award / JuryVote ---
  - method: POST
    path: "/festival/jurors"
    description: "Empanel a juror for an edition."
    roles: [AWARDS_ADMIN]
    code: 201
    input: [edition_id, display_name, "coi_production_companies?"]
    output: Juror
    side_effects: []

  - method: GET
    path: "/festival/jurors/{id}"
    description: "Read a juror."
    roles: [AWARDS_ADMIN, FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, JUROR]
    code: 200
    input: []
    output: Juror
    side_effects: []

  - method: GET
    path: "/festival/jurors"
    description: "List jurors."
    roles: [AWARDS_ADMIN, FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, JUROR]
    code: 200
    input: ["edition_id?", "limit?", "offset?"]
    output: "Juror[]"
    side_effects: []

  - method: GET
    path: "/festival/jurors/{id}/ballots"
    description: "List ballots cast by a juror."
    roles: [AWARDS_ADMIN, FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, JUROR]
    code: 200
    input: ["award_id?", "limit?", "offset?"]
    output: "JuryVote[]"
    side_effects: []

  - method: POST
    path: "/festival/awards"
    description: "Create an award; prize must fit the remaining prize pool; jurors must belong to the edition."
    roles: [AWARDS_ADMIN]
    code: 201
    input: [edition_id, name, section, prize_cents, assigned_juror_ids]
    output: Award
    side_effects: ["status=SETUP; ERR_PRIZE_POOL_EXHAUSTED; ERR_REFERENTIAL_INTEGRITY"]

  - method: GET
    path: "/festival/awards/{id}"
    description: "Read an award."
    roles: [AWARDS_ADMIN, FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, JUROR]
    code: 200
    input: []
    output: Award
    side_effects: []

  - method: GET
    path: "/festival/awards"
    description: "List awards."
    roles: [AWARDS_ADMIN, FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, JUROR]
    code: 200
    input: ["edition_id?", "status?", "winner_submission_id?", "limit?", "offset?"]
    output: "Award[]"
    side_effects: []

  - method: POST
    path: "/festival/awards/{id}/open-voting"
    description: "Open jury voting during FESTIVAL_LIVE."
    roles: [AWARDS_ADMIN]
    code: 200
    input: []
    output: Award
    side_effects: ["SETUP -> VOTING_OPEN"]

  - method: POST
    path: "/festival/awards/{id}/ballots"
    description: "Juror casts a ranked ballot (one per juror per award); candidates must be PROGRAMMED submissions in the award's section; COI forbidden."
    roles: [JUROR]
    code: 201
    input: [ranked_submission_ids]
    output: JuryVote
    side_effects: ["juror_id := X-User-ID; submitted_at stamped; ERR_BALLOT_INVALID; ERR_BALLOT_EXISTS; ERR_JUROR_CONFLICT; juror must be in assigned_juror_ids (ERR_JUROR_NOT_ON_PANEL otherwise)"]

  - method: GET
    path: "/festival/awards/{id}/ballots"
    description: "List ballots of an award."
    roles: [AWARDS_ADMIN, FESTIVAL_ADMIN, FESTIVAL_DIRECTOR]
    code: 200
    input: ["juror_id?", "limit?", "offset?"]
    output: "JuryVote[]"
    side_effects: []

  - method: GET
    path: "/festival/awards/{id}/standings"
    description: "Provisional first-preference standings while VOTING_OPEN (variant of the official IRV tally)."
    roles: [AWARDS_ADMIN, FESTIVAL_ADMIN, FESTIVAL_DIRECTOR, JUROR]
    code: 200
    input: []
    output: "{ first_preference_counts: object, provisional_leaders: string[] }"
    side_effects: []

  - method: POST
    path: "/festival/awards/{id}/tally"
    description: "Close voting and run the official IRV tally."
    roles: [AWARDS_ADMIN]
    code: 200
    input: []
    output: Award
    side_effects: ["VOTING_OPEN -> TALLIED; winner_submission_id + rounds_log stored; ERR_QUORUM_NOT_MET"]

  - method: POST
    path: "/festival/awards/{id}/announce"
    description: "Announce the winner during AWARDS_NIGHT."
    roles: [FESTIVAL_DIRECTOR]
    code: 200
    input: []
    output: Award
    side_effects: ["TALLIED -> ANNOUNCED; winner submission award_names appended"]

  - method: POST
    path: "/festival/awards/{id}/disburse"
    description: "Disburse the prize."
    roles: [AWARDS_ADMIN]
    code: 200
    input: []
    output: Award
    side_effects: ["ANNOUNCED -> DISBURSED; disbursed_amount_cents := prize_cents; edition.prize_disbursed_cents recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Request / auth ---
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum value, or out-of-range scalar (score not 1..10, delegate_count < 1, capacity_slots < 1, end_at <= start_at, etc.)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or role not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role is not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed actor does not own the target resource (FILMMAKER vs submitter_id, PROGRAMMER vs assignment.programmer_id, JUROR vs ballot juror)" }
  - { id: ERR_JUROR_NOT_ON_PANEL, http: 403, condition: "Juror casting a ballot is not in the award's assigned_juror_ids" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated resource does not exist (validated left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  # --- State / posture ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's own state machine forbids the transition (invalid-from or terminal)" }
  - { id: ERR_EDITION_PHASE_FORBIDDEN, http: 409, condition: "Edition posture does not permit this operation (e.g., submission create outside INTAKE_OPEN, score submission outside SCREENING, slot hold outside SCHEDULING)" }
  - { id: ERR_SCORES_LOCKED, http: 409, condition: "PATCH of a Score whose edition has advanced to DELIBERATION or beyond" }
  - { id: ERR_ENTRY_NOT_CONFIRMED, http: 409, condition: "Slot hold references a SlateEntry not in CONFIRMED status" }
  - { id: ERR_AGREEMENT_NOT_SIGNED, http: 409, condition: "Slot hold while the entry's ExhibitionAgreement is not SIGNED or ACTIVE" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "Award tally attempted with fewer ballots than ceil(len(assigned_juror_ids)/2)" }
  # --- Temporal ---
  - { id: ERR_INTAKE_NOT_YET_OPEN, http: 409, condition: "current_utc < edition.intake_open_at at submission create or checkout" }
  - { id: ERR_SLOT_OUTSIDE_FESTIVAL_WINDOW, http: 409, condition: "Slot start_at < festival_start_at or end_at > festival_end_at" }
  - { id: ERR_PREMIERE_WINDOW_VIOLATION, http: 409, condition: "PUBLIC/PRESS_INDUSTRY hold without an existing PREMIERE slot for the entry starting earlier" }
  - { id: ERR_REFUND_WINDOW_CLOSED, http: 409, condition: "Admin refund attempted more than 48h after paid_at" }
  - { id: ERR_FESTIVAL_NOT_STARTED, http: 409, condition: "Advance to FESTIVAL_LIVE attempted before festival_start_at" }
  # --- Safety / segregation ---
  - { id: ERR_COI_RECUSAL_REQUIRED, http: 409, condition: "Assignment targets a programmer whose coi_production_companies contains the submission's production_company" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Slate lock actor's X-User-ID equals slate.last_entry_added_by" }
  - { id: ERR_JUROR_CONFLICT, http: 409, condition: "Ballot ranks a submission whose production_company is in the juror's coi_production_companies" }
  # --- Referential ---
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Body-referenced entity missing or cross-edition (venue/edition mismatch, juror from another edition, category config absent for (edition, category))" }
  # --- Constraint / uniqueness / eligibility ---
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Submitter email already registered" }
  - { id: ERR_DUPLICATE_SUBMISSION, http: 409, condition: "Same submitter already has a submission with this title in this edition" }
  - { id: ERR_DUPLICATE_CATEGORY_CONFIG, http: 409, condition: "CategoryConfig for (edition_id, category) already exists" }
  - { id: ERR_DUPLICATE_SLATE, http: 409, condition: "Slate for (edition_id, section) already exists" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "An ASSIGNED assignment already exists for this (submission, programmer) pair" }
  - { id: ERR_SCORE_EXISTS, http: 409, condition: "Assignment already has a Score" }
  - { id: ERR_BALLOT_EXISTS, http: 409, condition: "Juror already cast a ballot for this award" }
  - { id: ERR_DUPLICATE_ENTRY, http: 409, condition: "Submission already has a non-DROPPED entry on this slate" }
  - { id: ERR_PREMIERE_SLOT_EXISTS, http: 409, condition: "Entry already has a PREMIERE slot in HELD/CONFIRMED/PLAYED" }
  - { id: ERR_INELIGIBLE_RUNTIME, http: 409, condition: "runtime_minutes outside the category's inclusive [min, max] range" }
  - { id: ERR_INELIGIBLE_COMPLETION_DATE, http: 409, condition: "completion_date earlier than the category's completion_cutoff" }
  - { id: ERR_INELIGIBLE_PREMIERE, http: 409, condition: "premiere_status does not satisfy the category's premiere_requirement at ELIGIBLE ruling" }
  - { id: ERR_SECTION_CATEGORY_MISMATCH, http: 409, condition: "Submission category not allowed in the slate's section (SHORT_FILM only in SHORTS; NARRATIVE_FEATURE/DOCUMENTARY_FEATURE/EPISODIC only in non-SHORTS sections)" }
  - { id: ERR_VENUE_OVERLAP, http: 409, condition: "Slot conflicts with an occupied slot on the same venue under turnover-buffered half-open interval arithmetic" }
  - { id: ERR_SLOT_TOO_SHORT, http: 409, condition: "Slot duration shorter than submission.runtime_minutes + 15 minutes QA" }
  - { id: ERR_SLATE_UNDERFILLED, http: 409, condition: "Slate lock attempted with entry_count < capacity_slots" }
  - { id: ERR_BELOW_SLATE_THRESHOLD, http: 409, condition: "Slate lock attempted while a MAIN-lane entry has composite_score null or < 7.500" }
  - { id: ERR_SCORING_INCOMPLETE, http: 409, condition: "Advance to DELIBERATION while an IN_SCREENING submission lacks its category's screener_count_required SCORED assignments" }
  - { id: ERR_ELIGIBILITY_DECISIONS_PENDING, http: 409, condition: "Advance to DELIBERATION while submissions remain SUBMITTED or NEEDS_INFO" }
  - { id: ERR_BALLOT_INVALID, http: 409, condition: "Ballot ranks a non-candidate (not PROGRAMMED in the award's section), contains duplicates, or is empty" }
  - { id: ERR_LICENSED_COUNT_EXCEEDED, http: 409, condition: "Slot confirm would push agreement.used_screening_count above licensed_screening_count" }
  - { id: ERR_LICENSED_BELOW_USED, http: 409, condition: "Amendment would set licensed_screening_count below used_screening_count" }
  - { id: ERR_FORMAT_UNSUPPORTED, http: 409, condition: "Submission format not in venue.formats_supported" }
  - { id: ERR_NO_CATEGORY_CONFIG, http: 409, condition: "Advance SETUP -> INTAKE_OPEN with no CategoryConfig, or submission in a category with no config" }
  - { id: ERR_SLATES_UNLOCKED, http: 409, condition: "Advance DELIBERATION -> SLATE_LOCKED while a slate is not LOCKED (or none exist)" }
  - { id: ERR_INVITATIONS_PENDING, http: 409, condition: "Advance NOTIFICATION -> SCHEDULING while a SlateEntry remains INVITED" }
  - { id: ERR_AWARDS_PENDING, http: 409, condition: "Advance AWARDS_NIGHT -> CLOSED while an award is not DISBURSED" }
  - { id: ERR_UNRESOLVED_INFO_REQUEST, http: 409, condition: "Resubmit attempted while needs_info_resolved is false" }
  - { id: ERR_ACTIVE_SLOTS_EXIST, http: 409, condition: "Agreement termination attempted while HELD/CONFIRMED slots reference the entry" }
  - { id: ERR_ASSIGNMENT_CAP, http: 409, condition: "Assignment would exceed programmer.max_active_assignments" }
  # --- Fiscal ---
  - { id: ERR_TRAVEL_BUDGET_EXHAUSTED, http: 409, condition: "Travel approval while edition.travel_budget_remaining == 0" }
  - { id: ERR_HOTEL_NIGHTS_EXHAUSTED, http: 409, condition: "Travel approval while edition.hotel_nights_remaining == 0" }
  - { id: ERR_PRIZE_POOL_EXHAUSTED, http: 409, condition: "Award creation whose prize_cents exceeds the remaining prize pool" }
  - { id: ERR_PAYMENT_NOT_REFUNDABLE, http: 409, condition: "Refund attempted on a payment not in SUCCEEDED status" }
  - { id: ERR_REFUND_NOT_ALLOWED, http: 409, condition: "Admin refund attempted while submission is not SUBMITTED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PUBLIC
    description: "Unauthenticated public intake (registration only)."
    identity: opaque
    exclusive_operations:
      - "POST /festival/submitters — register a submitter account"
    shared_operations: []

  - name: FESTIVAL_ADMIN
    description: "Festival operations administrator; owns edition lifecycle, category policy, programmers, eligibility rulings, refunds."
    identity: opaque
    exclusive_operations:
      - "POST /festival/_clock/set_current_utc — advance logical clock (test-driving)"
      - "POST /festival/_payments/simulate — drive payment outcomes (test-driving)"
      - "POST /festival/editions — create edition"
      - "POST /festival/editions/{id}/advance — advance posture"
      - "POST /festival/category-configs — create category policy"
      - "POST /festival/programmers, PATCH /festival/programmers/{id} — programmer management"
      - "POST /festival/venues — create venue"
      - "POST /festival/submissions/{id}/eligibility-decision — eligibility rulings"
      - "POST /festival/fee-payments/{id}/refund — full cooling-window refund"
    shared_operations:
      - "GET reads across editions, submissions, payments, assignments, scores, slates, entries, slots, packages, agreements, jurors, awards, ballots"

  - name: FILMMAKER
    description: "Submitting filmmaker; owns their submissions, invitations, travel packages, agreements."
    identity: "entity_backed:Submitter"
    exclusive_operations:
      - "POST /festival/submissions — create own submission"
      - "PATCH /festival/submissions/{id} — amend own DRAFT/NEEDS_INFO submission"
      - "POST /festival/submissions/{id}/checkout — pay fee for own submission"
      - "POST /festival/submissions/{id}/withdraw — withdraw own submission"
      - "POST /festival/submissions/{id}/resubmit — resubmit after NEEDS_INFO"
      - "POST /festival/slate-entries/{id}/respond — answer invitation for own film"
      - "POST /festival/travel-packages/{id}/submit — submit own travel details"
      - "POST /festival/exhibition-agreements/{id}/sign — sign own agreement"
    shared_operations:
      - "POST /festival/travel-packages/{id}/cancel (shared with TRAVEL_COORDINATOR)"
      - "GET reads of own submissions, payments, entries, slots, packages, agreements; edition and category-config reads"

  - name: PROGRAMMER
    description: "Screening programmer; works screener assignments and files scores."
    identity: "entity_backed:Programmer"
    exclusive_operations:
      - "POST /festival/screener-assignments/{id}/recuse — recuse own assignment"
      - "POST /festival/screener-assignments/{id}/scores — score own assignment"
      - "PATCH /festival/scores/{id} — edit own unlocked score"
    shared_operations:
      - "GET reads of own assignments and scores; edition and submission reads"

  - name: PROGRAM_CHAIR
    description: "Programming committee chair; builds slates and assigns screeners. Cannot lock slates (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /festival/screener-assignments — assign screener"
      - "POST /festival/slates — create slate"
      - "POST /festival/slates/{id}/deliberate — open slate for editing"
      - "POST /festival/slates/{id}/entries — add entry (OCC)"
      - "DELETE /festival/slates/{id}/entries/{entry_id} — remove entry"
    shared_operations:
      - "GET reads of submissions, assignments, scores, slates, entries, venues, slots"

  - name: FESTIVAL_DIRECTOR
    description: "Festival director; locks slates, issues invitations, issues/amends/terminates agreements, announces awards."
    identity: opaque
    exclusive_operations:
      - "POST /festival/slates/{id}/lock — lock slate (segregation vs entry adder)"
      - "POST /festival/slates/{id}/reopen — reopen before invitations"
      - "POST /festival/editions/{id}/issue-invitations — bulk invitations"
      - "POST /festival/exhibition-agreements/{id}/issue — issue agreement"
      - "POST /festival/exhibition-agreements/{id}/amend — amend agreement (OCC)"
      - "POST /festival/exhibition-agreements/{id}/terminate — terminate agreement"
      - "POST /festival/awards/{id}/announce — announce winner"
    shared_operations:
      - "GET reads across editions, submissions, scores, slates, entries, slots, agreements, jurors, awards, ballots"

  - name: SCHEDULING_OPS
    description: "Scheduling operator; owns the venue grid and screening slots."
    identity: opaque
    exclusive_operations:
      - "POST /festival/screening-slots — create slot (OCC on venue)"
      - "POST /festival/screening-slots/{id}/hold — hold slot for entry"
      - "POST /festival/screening-slots/{id}/confirm — confirm slot"
      - "POST /festival/screening-slots/{id}/release — release hold"
      - "POST /festival/screening-slots/{id}/cancel — cancel confirmed slot"
      - "POST /festival/screening-slots/{id}/mark-played — mark played"
    shared_operations:
      - "GET reads of editions, submissions, entries, venues, slots, agreements"

  - name: TRAVEL_COORDINATOR
    description: "Travel and accommodation coordinator; approves/books/cancels/reconciles travel packages."
    identity: opaque
    exclusive_operations:
      - "POST /festival/travel-packages/{id}/approve — approve with budget/hotel clamp (OCC on edition)"
      - "POST /festival/travel-packages/{id}/request-changes — request changes"
      - "POST /festival/travel-packages/{id}/mark-booked — mark booked"
      - "POST /festival/travel-packages/{id}/reconcile — reconcile after festival live"
    shared_operations:
      - "POST /festival/travel-packages/{id}/cancel (shared with FILMMAKER owner)"
      - "GET reads of editions, submissions, packages"

  - name: JUROR
    description: "Awards juror; casts one ranked ballot per assigned award."
    identity: "entity_backed:Juror"
    exclusive_operations:
      - "POST /festival/awards/{id}/ballots — cast ranked ballot"
    shared_operations:
      - "GET reads of editions, submissions, jurors, awards, own ballots, standings"

  - name: AWARDS_ADMIN
    description: "Awards administrator; empanels jurors, creates awards, opens voting, tallies, disburses prizes."
    identity: opaque
    exclusive_operations:
      - "POST /festival/jurors — empanel juror"
      - "POST /festival/awards — create award"
      - "POST /festival/awards/{id}/open-voting — open voting"
      - "POST /festival/awards/{id}/tally — run IRV tally"
      - "POST /festival/awards/{id}/disburse — disburse prize"
    shared_operations:
      - "GET reads of editions, submissions, jurors, awards, ballots, standings"
