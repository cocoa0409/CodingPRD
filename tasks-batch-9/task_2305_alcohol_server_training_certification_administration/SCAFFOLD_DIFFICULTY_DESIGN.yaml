scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: certificate_anniversary_anchored_renewal_preserves_original_expiry_month
        grounds:
          - calculations.certificate_expiry_and_anchor
          - entities.Certificate.fields.expiry_anchor_mode
          - entities.Certificate.fields.renews_certificate_id
          - state_machines.Certificate.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          The renewal is issued while the prior certificate is still ACTIVE, so the
          ANNIVERSARY_ANCHORED variant adds 24 months to the PRIOR certificate's
          expires_at (2028-08-10T18:30:00Z -> 2030-08-10T18:30:00Z) instead of to the
          new issuance instant, which the ISSUANCE_ANCHORED variant would have turned
          into 2029-05-04T17:00:00Z — a difference of 15 months and 6 days on identical
          issuance data.
        test_recipe:
          setup:
            - "TX jurisdiction: certificate_validity_months 24, renewal_grace_days 30, min_passing_score_pct 70, proctor_separation_required false."
            - "One published ON_PREMISE course with an APPROVED TX approval effective 2026-08-01 through 2027-08-01, and one CERTIFIED trainer."
            - "Server Ari Cole already holds certificate #1 issued 2026-08-10T18:30:00Z, validity_state ACTIVE, expires_at 2028-08-10T18:30:00Z (ISSUANCE_ANCHORED)."
            - "A second class session is scheduled for 2027-05-04 and Ari has attended it and passed its exam; the logical clock stands at 2027-05-04T17:00:00Z just before completion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"], certificate_validity_months: 24, renewal_grace_days: 30, new_hire_training_days: 30, registry_submission_required: true, registry_deadline_days: 15, registry_late_fee_cents_per_day: 250, min_passing_score_pct: 70, max_retakes_allowed: 2, retake_cooling_off_hours: 24, proctor_separation_required: false, reminder_lead_days: 60 }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /courses"
              payload: { title: "TIPS On-Premise Core", track: "ON_PREMISE", delivery_mode: "CLASSROOM", contact_hours: 4, question_count: 40, version_label: "v1" }
              as: ProgramAdmin
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: ProgramAdmin
              captures: { course_v: $.data.version }
            - call: "POST /course-approvals"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", submission_note: "initial filing" }
              as: ProgramAdmin
              captures: { appr_id: $.data.id }
            - call: "POST /course-approvals/${appr_id}/decision"
              payload: { decision: "APPROVE", approval_number: "TX-ABC-2026-001", effective_from: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: StateRegulator
            - call: "POST /trainers"
              payload: { full_name: "Dana Reyes", email: "dana@tips.example" }
              as: ProgramAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /trainers/${tr_id}/credential"
              payload: { certified_tracks: ["ON_PREMISE"], certified_state_codes: ["TX"], credential_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions"
              payload: { course_id: "${course_id}", state_jurisdiction_id: "${tx_id}", trainer_id: "${tr_id}", scheduled_start_at: "2026-08-10T14:00:00Z", scheduled_end_at: "2026-08-10T18:00:00Z", capacity: 20 }
              as: ProgramAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /alcohol-servers"
              payload: { full_name: "Ari Cole", email: "ari@example.com", state_jurisdiction_id: "${tx_id}" }
              as: ProgramAdmin
              captures: { srv_id: $.data.id }
            - call: "POST /enrollments"
              payload: { class_session_id: "${sess_id}", alcohol_server_id: "${srv_id}", expected_class_session_version: "${sess_v}" }
              as: AlcoholServer
              as_user_id: "${srv_id}"
