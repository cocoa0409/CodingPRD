# Task 2764 — Ski Area Mountain Operations & Snowmaking
# Seed tables (§1.0–§1.7). Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).

scenario: |
  Ski Area Mountain Operations & Snowmaking (ski resort mountain operations): terrain opening plan
  by base depth, snowmaking capacity and grooming readiness with daily open/close decisions,
  snowmaking scheduling driven by wet bulb temperature, water rights limits and energy pricing
  windows, lift operations with staffing, mechanical inspections and wind hold procedures, grooming
  plan with cat routes, winch operations and overnight sequencing, ski patrol staffing, avalanche
  mitigation planning and incident response with medical transport, terrain park build and feature
  risk management, capacity, parking and pass access management on peak days, season-long snow
  accounting and terrain opening reporting.

domain_name: ski-area-mountain-operations
api_prefix: /mountain-ops

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - rate_threshold_triggers      # wet bulb bands, base depth minimum, wind hold + hysteresis, crowding density tier
    - cascading_side_effects       # weather -> lift -> terrain -> grooming/snowmaking -> season ledger
    - optimistic_concurrency       # OCC on TerrainArea.version and DayPlan.version
    - derived_field_reconciliation # season water ledger, day-plan carrying capacity, terrain readiness fields
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: SeasonConfig
    parent: null
    common_fields: true
    fields:
      - name: season_label
        type: string
        source: input
        description: "Human season label, e.g. 2026-27"
        constraints: "unique across all SeasonConfig rows; 1..32 chars"
      - name: base_depth_policy
        type: enum
        source: input
        description: "Which stake statistic defines TerrainArea.base_depth_in for this season"
        default: MEAN_OF_STAKES
        constraints: "MEAN_OF_STAKES | MIN_OF_STAKES"
      - name: water_right_seasonal_af
        type: number
        source: input
        description: "Seasonal water withdrawal allowance in acre-feet (AF)"
        constraints: "> 0; 3 decimal places"
      - name: plant_max_gpm
        type: integer
        source: input
        description: "Plant-wide pumping ceiling in gallons per minute across all PumpHouse rows of the season"
        constraints: ">= 1"
      - name: snowmaking_kwh_per_af
        type: number
        source: input
        description: "Energy intensity of pumping: kWh consumed per acre-foot of water delivered"
        constraints: "> 0"
      - name: min_patrollers_per_open_area
        type: integer
        source: input
        description: "Minimum count of Patroller rows with status=AVAILABLE assigned to a TerrainArea for it to be OPEN"
        default: 2
        constraints: ">= 1"
      - name: groom_freshness_hours
        type: integer
        source: input
        description: "A TerrainArea counts as groomed while logical_clock < last_groomed_at + groom_freshness_hours"
        default: 18
        constraints: ">= 1"
      - name: energy_windows
        type: array
        source: input
        description: >-
          Daily-recurring energy price windows, each object
          { code: string, start_hour_utc: integer, end_hour_utc: integer,
          price_usd_per_kwh: number, tier: OFF_PEAK|MID_PEAK|ON_PEAK|CRITICAL_PEAK }.
          Half-open [start_hour_utc, end_hour_utc) in UTC hours.
        constraints: "1..6 entries; 0 <= start_hour_utc < end_hour_utc <= 24; entries must tile [0,24) with no gap and no overlap"
      - name: season_state
        type: enum
        source: computed
        description: "Season lifecycle; PRESEASON until the first DayPlan publish, CLOSED after a final day close"
        default: PRESEASON
        constraints: "PRESEASON | OPERATING | CLOSED"
      - name: water_reserved_af
        type: number
        source: computed
        description: "Sum of water_af_reserved over SnowmakingSession rows in state SCHEDULED, RUNNING or PAUSED for this season; 3 decimals"
        default: 0.0
      - name: water_used_af
        type: number
        source: computed
        description: "Sum of water_af_actual over SnowmakingSession rows in state COMPLETED for this season; 3 decimals"
        default: 0.0
      - name: snow_produced_swe_af
        type: number
        source: computed
        description: "Season-long machine snow accounting: sum of snow_swe_af over COMPLETED SnowmakingSession rows of this season; 3 decimals"
        default: 0.0
      - name: open_area_count
        type: integer
        source: computed
        description: "Count of TerrainArea rows of this season whose opening_state == OPEN"
        default: 0

  - name: Lift
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> SeasonConfig.id; the season this lift belongs to"
      - name: lift_code
        type: string
        source: input
        description: "Operational lift code, e.g. L1"
        constraints: "unique per season_id"
      - name: name
        type: string
        source: input
        description: "Display name"
      - name: lift_type
        type: enum
        source: input
        description: "Lift technology"
        constraints: "SURFACE | FIXED_GRIP | DETACHABLE | GONDOLA"
      - name: wind_hold_threshold_mph
        type: number
        source: input
        description: "Sustained wind above which this lift is placed on wind hold"
        constraints: "> 0; 1 decimal place"
      - name: hourly_capacity_pph
        type: integer
        source: input
        description: "Uphill capacity in people per hour when service_status == OPEN"
        constraints: ">= 1"
      - name: required_operator_count
        type: integer
        source: input
        description: "Number of covering ASSIGNED LiftStaffAssignment rows required to run the lift"
        default: 2
        constraints: ">= 1"
      - name: service_status
        type: enum
        source: computed
        description: "Service dimension of the lift's parallel state machine"
        default: CLOSED
        constraints: "CLOSED | STANDBY | OPEN | WIND_HOLD | MECH_HOLD"
      - name: mechanical_status
        type: enum
        source: computed
        description: "Mechanical dimension of the lift's parallel state machine; evolves independently of service_status"
        default: INSPECTION_DUE
        constraints: "INSPECTION_DUE | INSPECTION_PASSED | INSPECTION_FAILED"
      - name: last_inspection_at
        type: datetime
        source: computed
        description: "Logical clock value at the most recent inspection; null before the first inspection"
      - name: last_inspection_result
        type: enum
        source: computed
        description: "Result of the most recent inspection; null before the first inspection"
        constraints: "PASS | FAIL"
      - name: inspection_valid_until
        type: datetime
        source: computed
        description: "last_inspection_at + 24h when last_inspection_result == PASS, else null"
      - name: staffed_operator_count
        type: integer
        source: computed
        description: "Count of LiftStaffAssignment rows for this lift with state == ASSIGNED and shift_start <= logical_clock < shift_end"
        default: 0
      - name: wind_hold_since
        type: datetime
        source: computed
        description: "Logical clock value when service_status entered WIND_HOLD; null otherwise"

  - name: LiftStaffAssignment
    parent: null
    common_fields: true
    fields:
      - name: lift_id
        type: string
        source: input
        description: "FK -> Lift.id; the lift this operator shift staffs"
      - name: operator_code
        type: string
        source: input
        description: "Employee code of the lift operator; opaque string, not an entity id"
        constraints: "1..32 chars"
      - name: role_on_lift
        type: enum
        source: input
        description: "Slot the operator fills on the lift"
        constraints: "TOP_OP | BOTTOM_OP | MID_LOAD | LIFTIE_FLOAT"
      - name: shift_start
        type: datetime
        source: input
        description: "Shift start, inclusive"
      - name: shift_end
        type: datetime
        source: input
        description: "Shift end, exclusive"
      - name: state
        type: enum
        source: computed
        description: "Assignment lifecycle"
        default: ASSIGNED
        constraints: "ASSIGNED | RELEASED"
      - name: released_at
        type: datetime
        source: computed
        description: "Logical clock value at release; null while ASSIGNED"

  - name: TerrainArea
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> SeasonConfig.id; the season this trail/pod belongs to"
      - name: serving_lift_id
        type: string
        source: input
        description: "FK -> Lift.id; the lift that must be running for this area to be skiable"
      - name: trail_code
        type: string
        source: input
        description: "Trail code, e.g. T1"
        constraints: "unique per season_id"
      - name: name
        type: string
        source: input
        description: "Display name"
      - name: terrain_class
        type: enum
        source: input
        description: "Difficulty / terrain class; PARK areas carry terrain-park features"
        constraints: "GREEN | BLUE | BLACK | PARK"
      - name: acres
        type: number
        source: input
        description: "Skiable acreage of the area"
        constraints: "> 0; 1 decimal place"
      - name: min_open_base_depth_in
        type: integer
        source: input
        description: "Minimum base depth in inches required to open this area"
        constraints: ">= 0"
      - name: avalanche_terrain
        type: boolean
        source: input
        description: "True when the area requires a current avalanche mitigation clearance to open"
        default: false
      - name: opening_state
        type: enum
        source: computed
        description: "Terrain opening dimension of this entity's parallel state machine"
        default: CLOSED
        constraints: "CLOSED | PREP | READY | OPEN | PATROL_HOLD | SEASON_CLOSED"
      - name: park_state
        type: enum
        source: computed
        description: "Terrain-park build dimension of this entity's parallel state machine; evolves independently of opening_state"
        default: NO_PARK
        constraints: "NO_PARK | PARK_BUILT | PARK_INSPECTED | PARK_CLOSED"
      - name: park_feature_count
        type: integer
        source: computed
        description: "Number of features recorded by the most recent park build"
        default: 0
      - name: park_risk_score
        type: number
        source: computed
        description: "Weighted feature risk score of the most recent park build; 1 decimal"
        default: 0.0
      - name: park_built_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who recorded the park build; null before any build"
      - name: park_inspected_by_user_id
        type: string
        source: system
        description: "X-User-ID of the patroller who signed the park risk inspection; null before inspection"
      - name: base_depth_in
        type: number
        source: computed
        description: "Base depth derived from SnowDepthReading rows per SeasonConfig.base_depth_policy; 1 decimal"
        default: 0.0
      - name: base_depth_stake_count
        type: integer
        source: computed
        description: "Number of distinct stake_code values inside the 48-hour reading lookback window"
        default: 0
      - name: last_groomed_at
        type: datetime
        source: computed
        description: "Logical clock value at the most recent GroomingTask completion that reached the coverage floor; null if never"
      - name: groom_coverage_pct
        type: number
        source: computed
        description: "coverage_pct of the most recent COMPLETED GroomingTask for this area; 1 decimal"
        default: 0.0
      - name: groom_ready
        type: boolean
        source: computed
        description: "True when last_groomed_at is not null and logical_clock < last_groomed_at + SeasonConfig.groom_freshness_hours"
        default: false
      - name: mitigation_clearance_expires_at
        type: datetime
        source: computed
        description: "Expiry of the most recent avalanche clearance for this area; null when never cleared"
      - name: assigned_patroller_count
        type: integer
        source: computed
        description: "Count of Patroller rows with assigned_terrain_area_id == this id and status == AVAILABLE"
        default: 0
      - name: machine_swe_af
        type: number
        source: computed
        description: "Sum of snow_swe_af over COMPLETED SnowmakingSession rows for this area; 3 decimals"
        default: 0.0

  - name: SnowDepthReading
    parent: null
    common_fields: false
    fields:
      - name: terrain_area_id
        type: string
        source: input
        description: "FK -> TerrainArea.id; the area this stake reading belongs to"
      - name: stake_code
        type: string
        source: input
        description: "Snow stake identifier within the area, e.g. S1"
        constraints: "1..16 chars"
      - name: depth_in
        type: number
        source: input
        description: "Measured settled snow depth in inches"
        constraints: ">= 0; 1 decimal place"
      - name: density_pct
        type: number
        source: input
        description: "Water content of the snowpack as a percentage, used for natural-snow SWE reporting"
        default: 10.0
        constraints: "> 0 and <= 60"
      - name: measured_at
        type: datetime
        source: input
        description: "When the stake was read; must not be in the future relative to the logical clock"
      - name: source
        type: enum
        source: input
        description: "How the reading was taken"
        default: MANUAL_STAKE
        constraints: "MANUAL_STAKE | AUTOMATED_SENSOR"

  - name: PumpHouse
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> SeasonConfig.id; the season this pump house serves"
      - name: pump_house_code
        type: string
        source: input
        description: "Pump house code, e.g. PH1"
        constraints: "unique per season_id"
      - name: name
        type: string
        source: input
        description: "Display name"
      - name: max_gpm
        type: integer
        source: input
        description: "Maximum aggregate flow this pump house can deliver at any instant"
        constraints: ">= 1"
      - name: gun_count
        type: integer
        source: input
        description: "Number of snow guns plumbed to this pump house"
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: "Availability of the pump house; MAINTENANCE blocks session starts"
        default: ONLINE
        constraints: "ONLINE | MAINTENANCE"
      - name: peak_committed_gpm
        type: integer
        source: computed
        description: "Maximum instantaneous sum of gpm over SnowmakingSession rows of this pump house in state SCHEDULED, RUNNING or PAUSED, evaluated by the boundary sweep of calculations.pump_concurrency_sweep"
        default: 0
      - name: active_session_count
        type: integer
        source: computed
        description: "Count of SnowmakingSession rows of this pump house in state RUNNING or PAUSED"
        default: 0

  - name: SnowmakingSession
    parent: null
    common_fields: true
    fields:
      - name: terrain_area_id
        type: string
        source: input
        description: "FK -> TerrainArea.id; the area being covered"
      - name: pump_house_id
        type: string
        source: input
        description: "FK -> PumpHouse.id; the pump house supplying water"
      - name: window_start
        type: datetime
        source: input
        description: "Scheduled window start, inclusive"
      - name: window_end
        type: datetime
        source: input
        description: "Scheduled window end, exclusive"
      - name: planned_minutes
        type: integer
        source: computed
        description: "(window_end - window_start) in whole minutes"
      - name: gun_count
        type: integer
        source: input
        description: "Guns committed to this session"
        constraints: ">= 1"
      - name: gpm
        type: integer
        source: input
        description: "Flow this session occupies on its pump house for the whole window"
        constraints: ">= 1"
      - name: state
        type: enum
        source: computed
        description: "Session lifecycle; RUNNING and PAUSED alternate freely"
        default: SCHEDULED
        constraints: "SCHEDULED | RUNNING | PAUSED | COMPLETED | ABORTED"
      - name: wet_bulb_f
        type: number
        source: computed
        description: "Wet bulb temperature reported on the most recent entry into RUNNING; null while SCHEDULED"
      - name: started_at
        type: datetime
        source: computed
        description: "Logical clock value at first entry into RUNNING; null while SCHEDULED"
      - name: last_running_since
        type: datetime
        source: computed
        description: "Logical clock value at the most recent entry into RUNNING; null when not RUNNING"
      - name: ended_at
        type: datetime
        source: computed
        description: "Logical clock value at entry into COMPLETED or ABORTED; null otherwise"
      - name: accumulated_run_minutes
        type: integer
        source: computed
        description: "Sum of whole minutes spent in RUNNING, accumulated at every exit from RUNNING"
        default: 0
      - name: water_af_reserved
        type: number
        source: computed
        description: "Planned water reservation in AF from calculations.snowmaking_water_volume variant PLANNED_RESERVATION; 3 decimals"
      - name: water_af_actual
        type: number
        source: computed
        description: "Metered water in AF from calculations.snowmaking_water_volume variant METERED_ACTUAL; 3 decimals; 0.0 until COMPLETED"
        default: 0.0
      - name: snow_yield_factor
        type: number
        source: computed
        description: "Wet-bulb yield factor applied at completion; null until COMPLETED"
      - name: snow_swe_af
        type: number
        source: computed
        description: "Machine snow produced expressed as snow water equivalent AF; 3 decimals; 0.0 until COMPLETED"
        default: 0.0
      - name: energy_kwh
        type: number
        source: computed
        description: "Total energy for the metered water volume; 3 decimals; 0.0 until COMPLETED"
        default: 0.0
      - name: energy_cost_usd
        type: number
        source: computed
        description: "Tiered energy cost from calculations.snowmaking_energy_cost; 2 decimals; 0.0 until COMPLETED"
        default: 0.0
      - name: demand_surcharge_applied
        type: boolean
        source: computed
        description: "True when the plant demand surcharge was applied to energy_cost_usd"
        default: false
      - name: abort_reason
        type: enum
        source: computed
        description: "Why the session was aborted; null unless state == ABORTED"
        constraints: "TERRAIN_HOLD | SUPERSEDED | SEASON_CLOSE"

  - name: GroomingTask
    parent: null
    common_fields: true
    fields:
      - name: terrain_area_id
        type: string
        source: input
        description: "FK -> TerrainArea.id; the area to be groomed"
      - name: cat_route_code
        type: string
        source: input
        description: "Cat route this task belongs to; overnight sequencing is enforced per route per groom night"
        constraints: "1..24 chars"
      - name: sequence_index
        type: integer
        source: input
        description: "Position of the task inside its cat route for the groom night"
        constraints: ">= 1"
      - name: snowcat_unit_code
        type: string
        source: input
        description: "Snowcat unit executing the task; opaque resource code, not an entity id"
        constraints: "1..24 chars"
      - name: winch_required
        type: boolean
        source: input
        description: "True for winch grooming; requires winch_anchor_code and lowers effective coverage"
        default: false
      - name: winch_anchor_code
        type: string
        source: input
        description: "Anchor point used for winch operations; required when winch_required is true"
      - name: window_start
        type: datetime
        source: input
        description: "Planned grooming window start, inclusive; its UTC date is the groom night key"
      - name: window_end
        type: datetime
        source: input
        description: "Planned grooming window end, exclusive"
      - name: state
        type: enum
        source: computed
        description: "Task lifecycle"
        default: PLANNED
        constraints: "PLANNED | DISPATCHED | COMPLETED | DEFERRED | CANCELLED"
      - name: passes_completed
        type: integer
        source: computed
        description: "Cat passes reported at completion"
        default: 0
      - name: coverage_pct
        type: number
        source: computed
        description: "Groom coverage from calculations.groom_coverage_pct; 1 decimal"
        default: 0.0
      - name: dispatched_at
        type: datetime
        source: computed
        description: "Logical clock value at dispatch; null while PLANNED"
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical clock value at completion; null unless COMPLETED"

  - name: Patroller
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> SeasonConfig.id; the season this patroller is rostered for"
      - name: assigned_terrain_area_id
        type: string
        source: input
        description: "FK -> TerrainArea.id; the area this patroller covers; null when unassigned"
      - name: patroller_code
        type: string
        source: input
        description: "Roster code, e.g. P1"
        constraints: "unique per season_id"
      - name: full_name
        type: string
        source: input
        description: "Display name"
      - name: cert_level
        type: enum
        source: input
        description: "Medical certification level"
        constraints: "BASIC | OEC | EMT | PARAMEDIC"
      - name: blaster_certified
        type: boolean
        source: input
        description: "Authorised to execute explosive avalanche mitigation"
        default: false
      - name: on_duty
        type: boolean
        source: input
        description: "Rostered on duty for the current operating period"
        default: false
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE when on_duty and not committed to an incident; OFF_DUTY when on_duty is false"
        default: OFF_DUTY
        constraints: "AVAILABLE | ON_INCIDENT | OFF_DUTY"

  - name: AvalancheMitigationMission
    parent: null
    common_fields: true
    fields:
      - name: terrain_area_id
        type: string
        source: input
        description: "FK -> TerrainArea.id; the avalanche terrain being mitigated"
      - name: executed_by_patroller_id
        type: string
        source: computed
        description: "FK -> Patroller.id; patroller who executed the mission; null while PLANNED"
      - name: cleared_by_patroller_id
        type: string
        source: computed
        description: "FK -> Patroller.id; patroller who signed the clearance; null until CLEARED"
      - name: route_code
        type: string
        source: input
        description: "Mitigation route code within the area"
        constraints: "1..24 chars"
      - name: method
        type: enum
        source: input
        description: "Mitigation technique; each branch has its own preconditions and side effects"
        constraints: "EXPLOSIVE | SKI_CUT | GAS_EXPLODER"
      - name: planned_charges
        type: integer
        source: input
        description: "Charges planned for EXPLOSIVE missions; must be 0 for SKI_CUT and GAS_EXPLODER"
        default: 0
        constraints: ">= 0 and <= 24"
      - name: hazard_rating_pre
        type: enum
        source: input
        description: "Forecast hazard rating before mitigation"
        constraints: "LOW | MODERATE | CONSIDERABLE | HIGH | EXTREME"
      - name: hazard_rating_post
        type: enum
        source: computed
        description: "Observed hazard rating reported at execution; null while PLANNED"
        constraints: "LOW | MODERATE | CONSIDERABLE | HIGH | EXTREME"
      - name: state
        type: enum
        source: computed
        description: "Mission lifecycle; EXECUTED forks to CLEARED or HOLD_EXTENDED"
        default: PLANNED
        constraints: "PLANNED | EXECUTED | CLEARED | HOLD_EXTENDED | ABORTED"
      - name: charges_used
        type: integer
        source: computed
        description: "Charges consumed at execution; 0 for non-explosive methods"
        default: 0
      - name: clearance_valid_hours
        type: integer
        source: computed
        description: "Validity of the clearance granted by this mission: 24 for EXPLOSIVE and GAS_EXPLODER, 8 for SKI_CUT; null until CLEARED"
      - name: road_closure_minutes
        type: integer
        source: computed
        description: "Road closure duration recorded for EXPLOSIVE execution (20 minutes per charge used); 0 otherwise"
        default: 0
      - name: executed_at
        type: datetime
        source: computed
        description: "Logical clock value at execution; null while PLANNED"
      - name: cleared_at
        type: datetime
        source: computed
        description: "Logical clock value at clearance; null unless CLEARED"

  - name: PatrolIncident
    parent: null
    common_fields: true
    fields:
      - name: terrain_area_id
        type: string
        source: input
        description: "FK -> TerrainArea.id; where the incident occurred"
      - name: responder_patroller_id
        type: string
        source: computed
        description: "FK -> Patroller.id; patroller committed to this incident; null while REPORTED"
      - name: reporter_code
        type: string
        source: input
        description: "Code of the staff member or guest services desk that reported the incident"
        constraints: "1..32 chars"
      - name: severity
        type: enum
        source: input
        description: "Triage severity; gates responder certification and transport mode"
        constraints: "MINOR | MODERATE | SERIOUS | CRITICAL"
      - name: location_note
        type: string
        source: input
        description: "Free-text location detail"
      - name: state
        type: enum
        source: computed
        description: "Incident lifecycle; transport is optional so DISPATCHED forks to TRANSPORT_ORDERED or CLOSED"
        default: REPORTED
        constraints: "REPORTED | DISPATCHED | TRANSPORT_ORDERED | CLOSED"
      - name: transport_mode
        type: enum
        source: computed
        description: "Medical transport ordered; null when the patient was released on hill"
        constraints: "TOBOGGAN | SNOWMOBILE | AMBULANCE | HELICOPTER"
      - name: disposition
        type: enum
        source: computed
        description: "Outcome recorded at close; derived from transport_mode"
        constraints: "RELEASED_ON_HILL | TRANSPORTED_TO_CLINIC | TRANSFERRED_TO_EMS"
      - name: reported_at
        type: datetime
        source: computed
        description: "Logical clock value at creation"
      - name: dispatched_at
        type: datetime
        source: computed
        description: "Logical clock value at dispatch; null while REPORTED"
      - name: transport_ordered_at
        type: datetime
        source: computed
        description: "Logical clock value when transport was ordered; null otherwise"
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical clock value at close; null unless CLOSED"
      - name: response_minutes
        type: integer
        source: computed
        description: "Whole minutes from reported_at to dispatched_at; null while REPORTED"

  - name: DayPlan
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> SeasonConfig.id; the season this operating day belongs to"
      - name: operating_date
        type: string
        source: input
        description: "Operating date as YYYY-MM-DD"
        constraints: "unique per season_id; matches ^\\d{4}-\\d{2}-\\d{2}$"
      - name: parking_stalls_total
        type: integer
        source: input
        description: "Guest parking stalls available on this operating day"
        constraints: ">= 0"
      - name: posture
        type: enum
        source: computed
        description: "Day posture; gates access reservations and terrain opening decisions"
        default: DRAFT
        constraints: "DRAFT | PUBLISHED_PARTIAL | PUBLISHED_FULL | WEATHER_HOLD | DAY_CLOSED"
      - name: wind_speed_mph
        type: number
        source: computed
        description: "Most recent sustained wind reading reported for the day; 1 decimal"
        default: 0.0
      - name: wet_bulb_f
        type: number
        source: computed
        description: "Most recent wet bulb reading reported for the day; 1 decimal"
        default: 32.0
      - name: new_snow_in
        type: number
        source: computed
        description: "New snow reported since the previous weather update; 1 decimal"
        default: 0.0
      - name: open_terrain_count
        type: integer
        source: computed
        description: "Count of TerrainArea rows of this season whose opening_state == OPEN"
        default: 0
      - name: terrain_open_acres
        type: number
        source: computed
        description: "Sum of acres over TerrainArea rows of this season whose opening_state == OPEN; 1 decimal"
        default: 0.0
      - name: open_lift_capacity_pph
        type: integer
        source: computed
        description: "Sum of hourly_capacity_pph over Lift rows of this season whose service_status == OPEN"
        default: 0
      - name: raw_ccc
        type: integer
        source: computed
        description: "Uncrowded comfortable carrying capacity, step 1 of calculations.day_guest_capacity"
        default: 0
      - name: guest_capacity
        type: integer
        source: computed
        description: "Crowding-adjusted comfortable carrying capacity, final value of calculations.day_guest_capacity"
        default: 0
      - name: non_season_pool
        type: integer
        source: computed
        description: "Capacity slice available to RECIPROCAL and DAY_TICKET parties: floor(guest_capacity * 0.70)"
        default: 0
      - name: admitted_guest_count
        type: integer
        source: computed
        description: "Sum of party_size over AccessReservation rows of this day in state CONFIRMED or CHECKED_IN"
        default: 0
      - name: non_season_admitted_count
        type: integer
        source: computed
        description: "Sum of party_size over AccessReservation rows of this day in state CONFIRMED or CHECKED_IN whose pass_type is RECIPROCAL or DAY_TICKET"
        default: 0
      - name: waitlisted_guest_count
        type: integer
        source: computed
        description: "Sum of party_size over AccessReservation rows of this day in state WAITLISTED"
        default: 0
      - name: parking_stalls_used
        type: integer
        source: computed
        description: "Sum of allocated_stalls over AccessReservation rows of this day in state CONFIRMED or CHECKED_IN"
        default: 0
      - name: weather_updated_at
        type: datetime
        source: computed
        description: "Logical clock value of the most recent weather update; null before the first update"
      - name: published_at
        type: datetime
        source: computed
        description: "Logical clock value of the publish that first left DRAFT; null while DRAFT"
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical clock value at day close; null unless DAY_CLOSED"

  - name: AccessReservation
    parent: null
    common_fields: true
    fields:
      - name: day_plan_id
        type: string
        source: input
        description: "FK -> DayPlan.id; the operating day this party is admitted for"
      - name: party_code
        type: string
        source: input
        description: "Reservation code for the party"
        constraints: "unique per day_plan_id"
      - name: pass_type
        type: enum
        source: input
        description: "Pass class; SEASON and EMPLOYEE draw on the whole capacity, RECIPROCAL and DAY_TICKET only on non_season_pool"
        constraints: "SEASON | EMPLOYEE | RECIPROCAL | DAY_TICKET"
      - name: party_size
        type: integer
        source: input
        description: "Number of guests in the party"
        constraints: ">= 1"
      - name: vehicle_count
        type: integer
        source: input
        description: "Vehicles the party brings; each consumes one parking stall"
        default: 0
        constraints: ">= 0"
      - name: state
        type: enum
        source: computed
        description: "Reservation lifecycle; the initial state is decided by calculations.admission_allocation"
        constraints: "CONFIRMED | WAITLISTED | CHECKED_IN | RELEASED | DENIED"
      - name: allocated_stalls
        type: integer
        source: computed
        description: "Parking stalls held by this reservation; equals vehicle_count while CONFIRMED or CHECKED_IN, else 0"
        default: 0
      - name: waitlist_reason
        type: enum
        source: computed
        description: "Why the party was waitlisted"
        default: NONE
        constraints: "NONE | CAPACITY | PARKING"
      - name: confirmed_at
        type: datetime
        source: computed
        description: "Logical clock value when the party first reached CONFIRMED; null while WAITLISTED or DENIED"
      - name: checked_in_at
        type: datetime
        source: computed
        description: "Logical clock value at check-in; null otherwise"
      - name: released_at
        type: datetime
        source: computed
        description: "Logical clock value at release; null otherwise"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: SeasonConfig
    initial_state: PRESEASON
    terminal_states: [CLOSED]
    note: "Dimension: season_state. Linear lifecycle that gates snowmaking and terrain opening."
    transitions:
      - from: PRESEASON
        to: OPERATING
        trigger: "POST /mountain-ops/day-plans/{id}/publish (first publish of any DayPlan of the season)"
        actor: system
        preconditions: ["season_state == PRESEASON", "the publishing DayPlan belongs to this season"]
        side_effects:
          - "season_state = OPERATING"
          - "SeasonConfig.version incremented by 1"
      - from: OPERATING
        to: CLOSED
        trigger: "POST /mountain-ops/day-plans/{id}/publish is not required; fired by POST /mountain-ops/day-plans/{id}/close-day with season_final=true"
        actor: system
        preconditions: ["season_state == OPERATING", "the closing DayPlan belongs to this season"]
        side_effects:
          - "season_state = CLOSED"
          - "every TerrainArea of the season whose opening_state != SEASON_CLOSED moves to SEASON_CLOSED (ordered by trail_code ASC)"
          - "each area moving to SEASON_CLOSED cascades: its GroomingTask rows in state PLANNED, DISPATCHED or DEFERRED move to CANCELLED; its SnowmakingSession rows in state SCHEDULED, RUNNING or PAUSED move to ABORTED with abort_reason=SEASON_CLOSE"
          - "each SnowmakingSession moving to ABORTED debits its water_af_reserved from SeasonConfig.water_reserved_af"
          - "SeasonConfig.version incremented by 1"

  - entity: TerrainArea
    initial_state: CLOSED
    terminal_states: [SEASON_CLOSED]
    note: >-
      Dimension 1 of 2: opening_state. Cyclic — OPEN <-> PATROL_HOLD and OPEN -> CLOSED -> PREP -> READY -> OPEN
      can repeat any number of times within a season.
    transitions:
      - from: CLOSED
        to: PREP
        trigger: "POST /mountain-ops/snowmaking-sessions, or POST /mountain-ops/grooming-tasks/{id}/dispatch, for this area"
        actor: system
        preconditions: ["opening_state == CLOSED", "SeasonConfig.season_state != CLOSED"]
        side_effects:
          - "opening_state = PREP"
          - "TerrainArea.version incremented by 1"
      - from: PREP
        to: READY
        trigger: "readiness re-evaluation (system) after POST snow-depth-readings, grooming-tasks/{id}/complete, mitigation-missions/{id}/clear, park-inspection, or POST /mountain-ops/patrollers for this area"
        actor: system
        preconditions:
          - "base_depth_in >= min_open_base_depth_in"
          - "groom_ready == true"
          - "avalanche_terrain == false OR (mitigation_clearance_expires_at is not null AND logical_clock < mitigation_clearance_expires_at)"
          - "assigned_patroller_count >= SeasonConfig.min_patrollers_per_open_area"
          - "terrain_class != PARK OR (park_state == PARK_INSPECTED AND park_risk_score <= 60.0)"
        side_effects:
          - "opening_state = READY"
          - "TerrainArea.version incremented by 1"
      - from: READY
        to: PREP
        trigger: "readiness re-evaluation (system) after any mutation that lowers a gate input (e.g. a new SnowDepthReading that lowers base_depth_in under MIN_OF_STAKES policy)"
        actor: system
        preconditions: ["opening_state == READY", "at least one PREP->READY precondition is now false"]
        side_effects:
          - "opening_state = PREP"
          - "TerrainArea.version incremented by 1"
      - from: READY
        to: OPEN
        trigger: "POST /mountain-ops/terrain-areas/{id}/opening-decision with decision=OPEN"
        actor: MountainOpsDirector
        preconditions:
          - "SeasonConfig.season_state == OPERATING"
          - "the season's active DayPlan (calculations.active_day_plan_selector) exists and its posture is PUBLISHED_PARTIAL or PUBLISHED_FULL"
          - "every PREP->READY precondition still holds when re-checked against the logical clock"
          - "serving Lift.service_status == OPEN"
          - "serving Lift.mechanical_status == INSPECTION_PASSED AND logical_clock < serving Lift.inspection_valid_until"
        side_effects:
          - "opening_state = OPEN"
          - "TerrainArea.version incremented by 1"
          - "SeasonConfig.open_area_count recomputed"
          - "active DayPlan open_terrain_count, terrain_open_acres, open_lift_capacity_pph, raw_ccc, guest_capacity and non_season_pool recomputed; posture becomes PUBLISHED_FULL when open_terrain_count equals the count of the season's TerrainArea rows with opening_state != SEASON_CLOSED, otherwise PUBLISHED_PARTIAL; DayPlan.version incremented by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /mountain-ops/terrain-areas/{id}/opening-decision with decision=CLOSE"
        actor: MountainOpsDirector
        preconditions: ["opening_state == OPEN"]
        side_effects:
          - "opening_state = CLOSED"
          - "GroomingTask rows of this area in state PLANNED or DISPATCHED move to DEFERRED"
          - "TerrainArea.version incremented by 1; SeasonConfig.open_area_count recomputed; active DayPlan counters and posture recomputed (DayPlan.version incremented by 1)"
      - from: OPEN
        to: PATROL_HOLD
        trigger: "system cascade: serving Lift enters WIND_HOLD or MECH_HOLD; or assigned_patroller_count falls below SeasonConfig.min_patrollers_per_open_area; or new_snow_in >= 12.0 invalidates avalanche clearance on avalanche_terrain"
        actor: system
        preconditions: ["opening_state == OPEN"]
        side_effects:
          - "opening_state = PATROL_HOLD"
          - "GroomingTask rows of this area in state PLANNED or DISPATCHED move to DEFERRED (ordered by sequence_index ASC)"
          - "SnowmakingSession rows of this area in state SCHEDULED, RUNNING or PAUSED move to ABORTED with abort_reason=TERRAIN_HOLD (ordered by created_at ASC)"
          - "TerrainArea.version incremented by 1; SeasonConfig.open_area_count recomputed; active DayPlan counters and posture recomputed (DayPlan.version incremented by 1)"
      - from: PATROL_HOLD
        to: OPEN
        trigger: "POST /mountain-ops/terrain-areas/{id}/opening-decision with decision=OPEN (an explicit re-open by the director), or the system cascade on POST /mountain-ops/lifts/{id}/service-status with target_status=OPEN releasing a wind hold, or POST /mountain-ops/lifts/{id}/inspections with result=PASS clearing a mech hold"
        actor: "MountainOpsDirector (explicit decision) or system (hold-release cascade)"
        preconditions:
          - "opening_state == PATROL_HOLD"
          - "every READY->OPEN precondition holds when re-checked against the logical clock (conditional cascade: areas that fail any gate stay in PATROL_HOLD; an explicit decision is rejected with the failing gate's error instead)"
        side_effects:
          - "opening_state = OPEN"
          - "TerrainArea.version incremented by 1; SeasonConfig.open_area_count recomputed; active DayPlan counters and posture recomputed (DayPlan.version incremented by 1)"
      - from: PATROL_HOLD
        to: CLOSED
        trigger: "POST /mountain-ops/terrain-areas/{id}/opening-decision with decision=CLOSE"
        actor: MountainOpsDirector
        preconditions: ["opening_state == PATROL_HOLD"]
        side_effects:
          - "opening_state = CLOSED"
          - "TerrainArea.version incremented by 1; active DayPlan counters and posture recomputed (DayPlan.version incremented by 1)"
      - from: OPEN
        to: SEASON_CLOSED
        trigger: "POST /mountain-ops/day-plans/{id}/close-day with season_final=true"
        actor: system
        preconditions: ["SeasonConfig.season_state == OPERATING"]
        side_effects:
          - "opening_state = SEASON_CLOSED"
          - "same cascade as the SeasonConfig OPERATING->CLOSED transition (grooming tasks CANCELLED, sessions ABORTED with abort_reason=SEASON_CLOSE, water reservations released)"
          - "TerrainArea.version incremented by 1"
      - from: CLOSED
        to: SEASON_CLOSED
        trigger: "POST /mountain-ops/day-plans/{id}/close-day with season_final=true"
        actor: system
        preconditions: ["SeasonConfig.season_state == OPERATING"]
        side_effects:
          - "opening_state = SEASON_CLOSED"
          - "TerrainArea.version incremented by 1"

  - entity: TerrainArea
    initial_state: NO_PARK
    terminal_states: []
    note: >-
      Dimension 2 of 2: park_state. Independent of opening_state — a PARK area can be OPEN with
      park_state PARK_INSPECTED, or CLOSED with park_state PARK_BUILT. No park_state is terminal:
      a torn-down park (PARK_CLOSED) may be rebuilt within the same season, which re-arms both the
      inspection gate at priority 29 and the risk gate at priority 30.
    transitions:
      - from: NO_PARK
        to: PARK_BUILT
        trigger: "POST /mountain-ops/terrain-areas/{id}/park-build"
        actor: GroomingLead | Patroller
        preconditions: ["terrain_class == PARK", "park_state is NO_PARK or PARK_BUILT or PARK_CLOSED", "SeasonConfig.season_state != CLOSED"]
        side_effects:
          - "park_feature_count = number of submitted features; park_risk_score = calculations.park_risk_score"
          - "park_built_by_user_id = X-User-ID of the caller; park_inspected_by_user_id reset to null"
          - "park_state = PARK_BUILT"
          - "TerrainArea.version incremented by 1"
      - from: PARK_BUILT
        to: PARK_INSPECTED
        trigger: "POST /mountain-ops/terrain-areas/{id}/park-inspection"
        actor: Patroller
        preconditions:
          - "park_state == PARK_BUILT"
          - "X-User-ID != park_built_by_user_id (segregation of duties)"
          - "the acting Patroller has on_duty == true"
        side_effects:
          - "park_inspected_by_user_id = X-User-ID of the acting Patroller"
          - "park_state = PARK_INSPECTED"
          - "readiness re-evaluation for this area may fire PREP->READY"
          - "TerrainArea.version incremented by 1"
      - from: PARK_INSPECTED
        to: PARK_CLOSED
        trigger: "POST /mountain-ops/terrain-areas/{id}/park-build with features=[] (park torn down)"
        actor: GroomingLead | Patroller
        preconditions: ["park_state == PARK_INSPECTED", "submitted features array is empty"]
        side_effects:
          - "park_state = PARK_CLOSED; park_feature_count = 0; park_risk_score = 0.0; park_inspected_by_user_id = null"
          - "if opening_state == OPEN and terrain_class == PARK, opening_state moves to PATROL_HOLD"
          - "TerrainArea.version incremented by 1"

  - entity: Lift
    initial_state: CLOSED
    terminal_states: []
    note: "Dimension 1 of 2: service_status. Cyclic (OPEN <-> WIND_HOLD) and cross-gated by the mechanical dimension."
    transitions:
      - from: CLOSED
        to: STANDBY
        trigger: "POST /mountain-ops/lifts/{id}/service-status with target_status=STANDBY"
        actor: LiftOpsManager
        preconditions:
          - "service_status == CLOSED or MECH_HOLD is false (MECH_HOLD leaves only via inspection PASS)"
          - "mechanical_status == INSPECTION_PASSED"
          - "logical_clock < inspection_valid_until"
        side_effects: ["service_status = STANDBY", "Lift.version incremented by 1"]
      - from: STANDBY
        to: OPEN
        trigger: "POST /mountain-ops/lifts/{id}/service-status with target_status=OPEN"
        actor: LiftOpsManager
        preconditions:
          - "service_status == STANDBY"
          - "mechanical_status == INSPECTION_PASSED AND logical_clock < inspection_valid_until"
          - "staffed_operator_count >= required_operator_count"
          - "the season's active DayPlan, when one exists, has posture != WEATHER_HOLD"
        side_effects:
          - "service_status = OPEN"
          - "active DayPlan open_lift_capacity_pph, raw_ccc, guest_capacity and non_season_pool recomputed (DayPlan.version incremented by 1)"
          - "Lift.version incremented by 1"
      - from: OPEN
        to: WIND_HOLD
        trigger: "POST /mountain-ops/day-plans/{id}/weather where wind_speed_mph > wind_hold_threshold_mph"
        actor: system
        preconditions: ["service_status == OPEN", "reported wind_speed_mph > wind_hold_threshold_mph (strictly greater)"]
        side_effects:
          - "service_status = WIND_HOLD; wind_hold_since = logical_clock"
          - "cascade: every TerrainArea with serving_lift_id == this lift and opening_state == OPEN moves to PATROL_HOLD (ordered by trail_code ASC), which in turn defers that area's grooming tasks and aborts that area's snowmaking sessions, which in turn releases those sessions' water reservations from SeasonConfig.water_reserved_af"
          - "active DayPlan open_lift_capacity_pph, guest_capacity, open_terrain_count and posture recomputed"
          - "Lift.version incremented by 1"
      - from: WIND_HOLD
        to: OPEN
        trigger: "POST /mountain-ops/lifts/{id}/service-status with target_status=OPEN"
        actor: LiftOpsManager
        preconditions:
          - "service_status == WIND_HOLD"
          - "the season's active DayPlan exists and its wind_speed_mph <= wind_hold_threshold_mph - 5.0 (hysteresis band)"
          - "staffed_operator_count >= required_operator_count"
          - "mechanical_status == INSPECTION_PASSED AND logical_clock < inspection_valid_until"
        side_effects:
          - "service_status = OPEN; wind_hold_since = null"
          - "conditional cascade: every TerrainArea served by this lift with opening_state == PATROL_HOLD is re-gated; those satisfying every READY->OPEN precondition return to OPEN, the others stay in PATROL_HOLD"
          - "active DayPlan counters and posture recomputed (DayPlan.version incremented by 1)"
          - "Lift.version incremented by 1"
      - from: OPEN
        to: MECH_HOLD
        trigger: "POST /mountain-ops/lifts/{id}/inspections with result=FAIL"
        actor: system
        preconditions: ["service_status is OPEN, STANDBY or WIND_HOLD"]
        side_effects:
          - "service_status = MECH_HOLD"
          - "cascade: every TerrainArea served by this lift with opening_state == OPEN moves to PATROL_HOLD, which defers that area's grooming tasks and aborts that area's snowmaking sessions, which releases those sessions' water reservations from SeasonConfig.water_reserved_af"
          - "active DayPlan counters and posture recomputed"
          - "Lift.version incremented by 1"
      - from: MECH_HOLD
        to: STANDBY
        trigger: "POST /mountain-ops/lifts/{id}/inspections with result=PASS"
        actor: system
        preconditions: ["service_status == MECH_HOLD"]
        side_effects:
          - "service_status = STANDBY; mechanical_status = INSPECTION_PASSED; inspection_valid_until = logical_clock + 24h"
          - "Lift.version incremented by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /mountain-ops/lifts/{id}/service-status with target_status=CLOSED"
        actor: LiftOpsManager
        preconditions: ["service_status is OPEN, STANDBY or WIND_HOLD"]
        side_effects:
          - "service_status = CLOSED; wind_hold_since = null"
          - "cascade: every TerrainArea served by this lift with opening_state == OPEN moves to PATROL_HOLD with the same downstream chain as WIND_HOLD"
          - "active DayPlan counters and posture recomputed"
          - "Lift.version incremented by 1"

  - entity: Lift
    initial_state: INSPECTION_DUE
    terminal_states: []
    note: >-
      Dimension 2 of 2: mechanical_status. Evolves independently of service_status on the same row —
      a lift can be CLOSED with INSPECTION_PASSED, or WIND_HOLD with INSPECTION_PASSED, and an
      INSPECTION_FAILED result drives the service dimension to MECH_HOLD.
    transitions:
      - from: INSPECTION_DUE
        to: INSPECTION_PASSED
        trigger: "POST /mountain-ops/lifts/{id}/inspections with result=PASS"
        actor: LiftOpsManager
        preconditions: ["mechanical_status is INSPECTION_DUE, INSPECTION_PASSED or INSPECTION_FAILED"]
        side_effects:
          - "mechanical_status = INSPECTION_PASSED; last_inspection_at = logical_clock; last_inspection_result = PASS; inspection_valid_until = logical_clock + 24h"
          - "if service_status == MECH_HOLD it moves to STANDBY"
          - "Lift.version incremented by 1"
      - from: INSPECTION_PASSED
        to: INSPECTION_FAILED
        trigger: "POST /mountain-ops/lifts/{id}/inspections with result=FAIL"
        actor: LiftOpsManager
        preconditions: ["mechanical_status is INSPECTION_DUE, INSPECTION_PASSED or INSPECTION_FAILED"]
        side_effects:
          - "mechanical_status = INSPECTION_FAILED; last_inspection_at = logical_clock; last_inspection_result = FAIL; inspection_valid_until = null"
          - "service_status moves to MECH_HOLD when it is OPEN, STANDBY or WIND_HOLD, with the full terrain cascade"
          - "Lift.version incremented by 1"
      - from: INSPECTION_FAILED
        to: INSPECTION_PASSED
        trigger: "POST /mountain-ops/lifts/{id}/inspections with result=PASS"
        actor: LiftOpsManager
        preconditions: ["mechanical_status == INSPECTION_FAILED"]
        side_effects:
          - "mechanical_status = INSPECTION_PASSED; inspection_valid_until = logical_clock + 24h; service_status MECH_HOLD -> STANDBY"
          - "Lift.version incremented by 1"

  - entity: LiftStaffAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /mountain-ops/lift-staff-assignments/{id}/release"
        actor: LiftOpsManager
        preconditions: ["state == ASSIGNED"]
        side_effects:
          - "state = RELEASED; released_at = logical_clock"
          - "Lift.staffed_operator_count recomputed; when it drops below Lift.required_operator_count and service_status == OPEN, the lift moves to STANDBY, which cascades every TerrainArea it serves with opening_state == OPEN to PATROL_HOLD"
          - "LiftStaffAssignment.version and Lift.version incremented by 1"

  - entity: SnowmakingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    note: >-
      Cyclic: RUNNING -> PAUSED -> RUNNING may repeat, and accumulated_run_minutes only advances
      while the row sits in RUNNING, so the metered water and energy figures depend on how many
      times the cycle was traversed, not only on the final state.
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /mountain-ops/snowmaking-sessions/{id}/status with target_state=RUNNING"
        actor: SnowmakingSupervisor
        preconditions:
          - "state == SCHEDULED"
          - "SeasonConfig.season_state == OPERATING"
          - "PumpHouse.status == ONLINE"
          - "TerrainArea.opening_state != PATROL_HOLD and != SEASON_CLOSED"
          - "wet_bulb_f of the season's active DayPlan <= 27.0"
        side_effects:
          - "state = RUNNING; started_at = logical_clock; last_running_since = logical_clock"
          - "wet_bulb_f copied from the active DayPlan; snow_yield_factor = calculations.snowmaking_wet_bulb_yield"
          - "PumpHouse.active_session_count incremented by 1"
          - "SnowmakingSession.version and PumpHouse.version incremented by 1"
      - from: RUNNING
        to: PAUSED
        trigger: "POST /mountain-ops/snowmaking-sessions/{id}/status with target_state=PAUSED"
        actor: SnowmakingSupervisor
        preconditions: ["state == RUNNING"]
        side_effects:
          - "accumulated_run_minutes increased by floor((logical_clock - last_running_since) in whole minutes)"
          - "state = PAUSED; last_running_since = null"
          - "SnowmakingSession.version incremented by 1"
      - from: PAUSED
        to: RUNNING
        trigger: "POST /mountain-ops/snowmaking-sessions/{id}/status with target_state=RUNNING"
        actor: SnowmakingSupervisor
        preconditions:
          - "state == PAUSED"
          - "PumpHouse.status == ONLINE"
          - "wet_bulb_f of the season's active DayPlan <= 27.0"
          - "TerrainArea.opening_state != PATROL_HOLD and != SEASON_CLOSED"
        side_effects:
          - "state = RUNNING; last_running_since = logical_clock"
          - "snow_yield_factor recomputed from the current active DayPlan wet_bulb_f"
          - "SnowmakingSession.version incremented by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /mountain-ops/snowmaking-sessions/{id}/status with target_state=COMPLETED"
        actor: SnowmakingSupervisor
        preconditions: ["state is RUNNING or PAUSED"]
        side_effects:
          - "when the previous state was RUNNING, accumulated_run_minutes increased by floor((logical_clock - last_running_since) in whole minutes) before any metering"
          - "state = COMPLETED; ended_at = logical_clock; last_running_since = null"
          - "water_af_actual = calculations.snowmaking_water_volume variant METERED_ACTUAL"
          - "snow_swe_af = round(water_af_actual * snow_yield_factor, 3)"
          - "energy_kwh and energy_cost_usd = calculations.snowmaking_energy_cost; demand_surcharge_applied set by that rule"
          - "SeasonConfig.water_reserved_af decreased by water_af_reserved; SeasonConfig.water_used_af increased by water_af_actual; SeasonConfig.snow_produced_swe_af increased by snow_swe_af"
          - "TerrainArea.machine_swe_af increased by snow_swe_af"
          - "PumpHouse.active_session_count decremented by 1; PumpHouse.peak_committed_gpm recomputed"
          - "SnowmakingSession.version, TerrainArea.version, PumpHouse.version and SeasonConfig.version incremented by 1"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /mountain-ops/snowmaking-sessions/{id}/status with target_state=COMPLETED"
        actor: SnowmakingSupervisor
        preconditions: ["state == PAUSED"]
        side_effects: ["identical to the RUNNING -> COMPLETED side effects, except that accumulated_run_minutes is already final"]
      - from: SCHEDULED
        to: ABORTED
        trigger: "system cascade: TerrainArea enters PATROL_HOLD or SEASON_CLOSED, or a newly created overlapping session supersedes this one"
        actor: system
        preconditions: ["state is SCHEDULED, RUNNING or PAUSED"]
        side_effects:
          - "state = ABORTED; ended_at = logical_clock; abort_reason = TERRAIN_HOLD, SUPERSEDED or SEASON_CLOSE"
          - "water_af_actual = 0.000; snow_swe_af = 0.000; energy_kwh = 0.000; energy_cost_usd = 0.00"
          - "SeasonConfig.water_reserved_af decreased by water_af_reserved (compensating release; water_used_af unchanged)"
          - "PumpHouse.active_session_count decremented by 1 when the previous state was RUNNING; PumpHouse.peak_committed_gpm recomputed"
          - "SnowmakingSession.version, PumpHouse.version and SeasonConfig.version incremented by 1"
      - from: RUNNING
        to: ABORTED
        trigger: "system cascade: TerrainArea enters PATROL_HOLD or SEASON_CLOSED"
        actor: system
        preconditions: ["state == RUNNING"]
        side_effects: ["identical to the SCHEDULED -> ABORTED side effects; accumulated_run_minutes is frozen at its stored value and is not advanced"]

  - entity: GroomingTask
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Cat-route sequencing: a task may only be dispatched after every lower sequence_index task on the same cat_route_code is COMPLETED or CANCELLED."
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /mountain-ops/grooming-tasks/{id}/dispatch"
        actor: GroomingLead
        preconditions:
          - "state is PLANNED or DEFERRED"
          - "SeasonConfig.season_state != CLOSED (grooming runs in PRESEASON so an area can first reach READY)"
          - "TerrainArea.opening_state != PATROL_HOLD and != SEASON_CLOSED"
          - "every GroomingTask on the same cat_route_code with a lower sequence_index is in state COMPLETED or CANCELLED"
          - "no other GroomingTask with the same snowcat_unit_code and state DISPATCHED has a window overlapping this task's window (half-open [window_start, window_end))"
          - "winch_required == false OR winch_anchor_code is not null"
        side_effects:
          - "state = DISPATCHED; dispatched_at = logical_clock"
          - "TerrainArea CLOSED -> PREP when the area is in CLOSED"
          - "GroomingTask.version incremented by 1"
      - from: DEFERRED
        to: DISPATCHED
        trigger: "POST /mountain-ops/grooming-tasks/{id}/dispatch"
        actor: GroomingLead
        preconditions: ["state == DEFERRED", "the same preconditions as PLANNED -> DISPATCHED"]
        side_effects: ["state = DISPATCHED; dispatched_at = logical_clock", "GroomingTask.version incremented by 1"]
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /mountain-ops/grooming-tasks/{id}/complete"
        actor: GroomingLead
        preconditions: ["state == DISPATCHED", "passes_completed >= 1 in the request body"]
        side_effects:
          - "state = COMPLETED; completed_at = logical_clock; passes_completed set from the request"
          - "coverage_pct = calculations.groom_coverage_pct"
          - "TerrainArea.last_groomed_at = logical_clock; TerrainArea.groom_coverage_pct = this task's coverage_pct; TerrainArea.groom_ready = (coverage_pct >= 70.0)"
          - "readiness re-evaluation for the area may fire PREP -> READY or READY -> PREP"
          - "GroomingTask.version and TerrainArea.version incremented by 1"
      - from: PLANNED
        to: DEFERRED
        trigger: "system cascade: TerrainArea enters PATROL_HOLD, or its serving Lift enters WIND_HOLD or MECH_HOLD"
        actor: system
        preconditions: ["state is PLANNED or DISPATCHED"]
        side_effects: ["state = DEFERRED", "GroomingTask.version incremented by 1"]
      - from: DISPATCHED
        to: DEFERRED
        trigger: "system cascade: TerrainArea enters PATROL_HOLD"
        actor: system
        preconditions: ["state == DISPATCHED"]
        side_effects: ["state = DEFERRED; dispatched_at retained", "GroomingTask.version incremented by 1"]
      - from: DEFERRED
        to: CANCELLED
        trigger: "POST /mountain-ops/day-plans/{id}/close-day with season_final=true"
        actor: system
        preconditions: ["state is PLANNED, DISPATCHED or DEFERRED"]
        side_effects: ["state = CANCELLED", "GroomingTask.version incremented by 1"]

  - entity: Patroller
    initial_state: OFF_DUTY
    terminal_states: []
    note: "Cyclic duty/availability dimension driven by the duty toggle, incident dispatch and incident closure."
    transitions:
      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "POST /mountain-ops/patrollers (created with on_duty=true) — the row is created directly in AVAILABLE"
        actor: MountainOpsDirector
        preconditions: ["on_duty == true"]
        side_effects:
          - "status = AVAILABLE"
          - "TerrainArea.assigned_patroller_count recomputed for assigned_terrain_area_id; readiness re-evaluation may fire PREP -> READY"
      - from: AVAILABLE
        to: OFF_DUTY
        trigger: "POST /mountain-ops/patrollers/{id}/duty with on_duty=false"
        actor: MountainOpsDirector
        preconditions: ["status == AVAILABLE"]
        side_effects:
          - "on_duty = false; status = OFF_DUTY"
          - "TerrainArea.assigned_patroller_count recomputed (OFF_DUTY patrollers are excluded); when the assigned area is OPEN and the count falls below SeasonConfig.min_patrollers_per_open_area the area moves to PATROL_HOLD with the full grooming / snowmaking / DayPlan cascade"
          - "Patroller.version incremented by 1"
      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "POST /mountain-ops/patrollers/{id}/duty with on_duty=true"
        actor: MountainOpsDirector
        preconditions: ["status == OFF_DUTY"]
        side_effects:
          - "on_duty = true; status = AVAILABLE"
          - "TerrainArea.assigned_patroller_count recomputed; readiness re-evaluation may fire PREP -> READY, but an area already in PATROL_HOLD is never auto-reopened by a duty change"
          - "Patroller.version incremented by 1"
      - from: AVAILABLE
        to: ON_INCIDENT
        trigger: "POST /mountain-ops/incidents/{id}/dispatch"
        actor: system
        preconditions: ["status == AVAILABLE", "on_duty == true"]
        side_effects:
          - "status = ON_INCIDENT"
          - "TerrainArea.assigned_patroller_count recomputed (patrollers with status ON_INCIDENT are excluded); when the assigned area is OPEN and the count falls below SeasonConfig.min_patrollers_per_open_area the area moves to PATROL_HOLD, which defers that area's grooming tasks and recomputes the active DayPlan posture"
          - "Patroller.version incremented by 1"
      - from: ON_INCIDENT
        to: AVAILABLE
        trigger: "POST /mountain-ops/incidents/{id}/close"
        actor: system
        preconditions: ["status == ON_INCIDENT"]
        side_effects:
          - "status = AVAILABLE"
          - "TerrainArea.assigned_patroller_count recomputed; readiness re-evaluation may fire PREP -> READY, but an area already in PATROL_HOLD is not auto-reopened"
          - "Patroller.version incremented by 1"

  - entity: AvalancheMitigationMission
    initial_state: PLANNED
    terminal_states: [CLEARED, ABORTED]
    note: >-
      Branching: EXECUTED forks to CLEARED (hazard_rating_post LOW or MODERATE) or HOLD_EXTENDED
      (hazard_rating_post CONSIDERABLE, HIGH or EXTREME), and HOLD_EXTENDED can only be resolved by a new mission.
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /mountain-ops/mitigation-missions/{id}/execute"
        actor: Patroller
        preconditions:
          - "state == PLANNED"
          - "SeasonConfig.season_state != CLOSED (mitigation runs in PRESEASON so avalanche terrain can first reach READY)"
          - "the executing Patroller has on_duty == true"
          - "method != EXPLOSIVE and != GAS_EXPLODER OR the executing Patroller has blaster_certified == true"
          - "method != SKI_CUT OR at least one other Patroller of the same season has status AVAILABLE and on_duty == true (partner requirement)"
          - "TerrainArea.opening_state != OPEN (mitigation may not be executed over open terrain)"
        side_effects:
          - "state = EXECUTED; executed_at = logical_clock; executed_by_patroller_id = the acting Patroller"
          - "charges_used set from the request (0 for SKI_CUT); road_closure_minutes = 20 * charges_used"
          - "AvalancheMitigationMission.version incremented by 1"
      - from: EXECUTED
        to: CLEARED
        trigger: "POST /mountain-ops/mitigation-missions/{id}/clear with hazard_rating_post in {LOW, MODERATE}"
        actor: Patroller
        preconditions:
          - "state == EXECUTED"
          - "X-User-ID of the clearing Patroller != X-User-ID that executed the mission (segregation of duties)"
          - "the clearing Patroller has cert_level EMT or PARAMEDIC"
        side_effects:
          - "state = CLEARED; cleared_at = logical_clock; cleared_by_patroller_id set; hazard_rating_post recorded"
          - "clearance_valid_hours = 24 for EXPLOSIVE and GAS_EXPLODER, 8 for SKI_CUT"
          - "TerrainArea.mitigation_clearance_expires_at = logical_clock + clearance_valid_hours"
          - "readiness re-evaluation for the area may fire PREP -> READY"
          - "AvalancheMitigationMission.version and TerrainArea.version incremented by 1"
      - from: EXECUTED
        to: HOLD_EXTENDED
        trigger: "POST /mountain-ops/mitigation-missions/{id}/clear with hazard_rating_post in {CONSIDERABLE, HIGH, EXTREME}"
        actor: Patroller
        preconditions: ["state == EXECUTED", "the same segregation-of-duties and cert preconditions as EXECUTED -> CLEARED"]
        side_effects:
          - "state = HOLD_EXTENDED; cleared_at = logical_clock; hazard_rating_post recorded"
          - "TerrainArea.mitigation_clearance_expires_at = null; when the area is OPEN it moves to PATROL_HOLD"
          - "AvalancheMitigationMission.version and TerrainArea.version incremented by 1"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /mountain-ops/day-plans/{id}/close-day with season_final=true"
        actor: system
        preconditions: ["state is PLANNED or EXECUTED"]
        side_effects: ["state = ABORTED", "AvalancheMitigationMission.version incremented by 1"]

  - entity: PatrolIncident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    note: "Branching: DISPATCHED forks to TRANSPORT_ORDERED -> CLOSED or straight to CLOSED (released on hill)."
    transitions:
      - from: REPORTED
        to: DISPATCHED
        trigger: "POST /mountain-ops/incidents/{id}/dispatch"
        actor: MountainOpsDirector
        preconditions:
          - "state == REPORTED"
          - "the nominated Patroller has status AVAILABLE and on_duty == true"
          - "severity != SERIOUS and != CRITICAL OR the nominated Patroller has cert_level EMT or PARAMEDIC"
        side_effects:
          - "state = DISPATCHED; dispatched_at = logical_clock; responder_patroller_id set"
          - "response_minutes = calculations.incident_response_minutes"
          - "Patroller AVAILABLE -> ON_INCIDENT, with the full downstream chain (assigned area staffing recount, possible OPEN -> PATROL_HOLD, grooming deferrals, DayPlan posture recompute)"
          - "PatrolIncident.version incremented by 1"
      - from: DISPATCHED
        to: TRANSPORT_ORDERED
        trigger: "POST /mountain-ops/incidents/{id}/transport"
        actor: Patroller
        preconditions:
          - "state == DISPATCHED"
          - "transport_mode HELICOPTER is only allowed when severity == CRITICAL"
          - "transport_mode AMBULANCE is only allowed when severity is SERIOUS or CRITICAL"
          - "X-User-ID matches the responder Patroller of this incident"
        side_effects:
          - "state = TRANSPORT_ORDERED; transport_ordered_at = logical_clock; transport_mode recorded"
          - "PatrolIncident.version incremented by 1"
      - from: TRANSPORT_ORDERED
        to: CLOSED
        trigger: "POST /mountain-ops/incidents/{id}/close"
        actor: Patroller
        preconditions: ["state == TRANSPORT_ORDERED", "disposition is TRANSPORTED_TO_CLINIC or TRANSFERRED_TO_EMS"]
        side_effects:
          - "state = CLOSED; closed_at = logical_clock; disposition recorded"
          - "responder Patroller ON_INCIDENT -> AVAILABLE, with the assigned-area staffing recount"
          - "PatrolIncident.version and Patroller.version incremented by 1"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /mountain-ops/incidents/{id}/close"
        actor: Patroller
        preconditions: ["state == DISPATCHED", "disposition == RELEASED_ON_HILL"]
        side_effects:
          - "state = CLOSED; closed_at = logical_clock; disposition = RELEASED_ON_HILL; transport_mode stays null"
          - "responder Patroller ON_INCIDENT -> AVAILABLE, with the assigned-area staffing recount"
          - "PatrolIncident.version and Patroller.version incremented by 1"

  - entity: DayPlan
    initial_state: DRAFT
    terminal_states: [DAY_CLOSED]
    note: "Cyclic: PUBLISHED_PARTIAL <-> PUBLISHED_FULL and WEATHER_HOLD -> PUBLISHED_PARTIAL may repeat within one operating day."
    transitions:
      - from: DRAFT
        to: PUBLISHED_PARTIAL
        trigger: "POST /mountain-ops/day-plans/{id}/publish"
        actor: MountainOpsDirector
        preconditions:
          - "posture == DRAFT"
          - "SeasonConfig.season_state is PRESEASON or OPERATING"
          - "at least one TerrainArea of the season has opening_state READY, OPEN or PATROL_HOLD"
          - "at least one Lift of the season has service_status OPEN or STANDBY"
        side_effects:
          - "posture = PUBLISHED_PARTIAL; published_at = logical_clock"
          - "open_lift_capacity_pph, open_terrain_count, terrain_open_acres, raw_ccc, guest_capacity and non_season_pool computed"
          - "SeasonConfig PRESEASON -> OPERATING on the season's first publish"
          - "DayPlan.version and SeasonConfig.version incremented by 1"
      - from: PUBLISHED_PARTIAL
        to: PUBLISHED_FULL
        trigger: "system recompute after POST /mountain-ops/terrain-areas/{id}/opening-decision with decision=OPEN"
        actor: system
        preconditions: ["posture == PUBLISHED_PARTIAL", "open_terrain_count equals the count of the season's TerrainArea rows with opening_state != SEASON_CLOSED"]
        side_effects: ["posture = PUBLISHED_FULL", "DayPlan.version incremented by 1"]
      - from: PUBLISHED_FULL
        to: PUBLISHED_PARTIAL
        trigger: "system recompute after any terrain area leaves OPEN (opening decision CLOSE, or a PATROL_HOLD cascade)"
        actor: system
        preconditions: ["posture == PUBLISHED_FULL", "open_terrain_count is now below the count of the season's TerrainArea rows with opening_state != SEASON_CLOSED"]
        side_effects: ["posture = PUBLISHED_PARTIAL", "DayPlan.version incremented by 1"]
      - from: PUBLISHED_PARTIAL
        to: WEATHER_HOLD
        trigger: "POST /mountain-ops/day-plans/{id}/weather with wind_speed_mph >= 60.0"
        actor: system
        preconditions: ["posture is PUBLISHED_PARTIAL or PUBLISHED_FULL"]
        side_effects:
          - "posture = WEATHER_HOLD; weather_updated_at = logical_clock"
          - "every Lift of the season with service_status OPEN or STANDBY moves to WIND_HOLD (ordered by lift_code ASC), with the full terrain / grooming / snowmaking / water-ledger cascade"
          - "DayPlan.version incremented by 1"
      - from: WEATHER_HOLD
        to: PUBLISHED_PARTIAL
        trigger: "POST /mountain-ops/day-plans/{id}/weather with wind_speed_mph < 60.0"
        actor: system
        preconditions: ["posture == WEATHER_HOLD"]
        side_effects:
          - "posture = PUBLISHED_PARTIAL; weather_updated_at = logical_clock"
          - "lifts stay in WIND_HOLD until released individually via POST /mountain-ops/lifts/{id}/service-status"
          - "DayPlan.version incremented by 1"
      - from: PUBLISHED_PARTIAL
        to: DAY_CLOSED
        trigger: "POST /mountain-ops/day-plans/{id}/close-day"
        actor: MountainOpsDirector
        preconditions: ["posture is PUBLISHED_PARTIAL, PUBLISHED_FULL or WEATHER_HOLD"]
        side_effects:
          - "posture = DAY_CLOSED; closed_at = logical_clock"
          - "every AccessReservation of the day in state CONFIRMED or WAITLISTED moves to RELEASED; allocated_stalls zeroed; parking_stalls_used and admitted counters recomputed"
          - "every TerrainArea of the season with opening_state OPEN or PATROL_HOLD moves to CLOSED (ordered by trail_code ASC), deferring that area's PLANNED and DISPATCHED grooming tasks"
          - "every Lift of the season with service_status OPEN, STANDBY or WIND_HOLD moves to CLOSED"
          - "when season_final=true, SeasonConfig OPERATING -> CLOSED with its own cascade"
          - "DayPlan.version incremented by 1"

  - entity: AccessReservation
    initial_state: CONFIRMED
    terminal_states: [RELEASED, DENIED]
    note: >-
      Created directly in CONFIRMED, WAITLISTED or DENIED by calculations.admission_allocation;
      WAITLISTED -> CONFIRMED promotion is driven by released capacity in created_at ASC order.
    transitions:
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system promotion sweep after POST /mountain-ops/access-reservations/{id}/release"
        actor: system
        preconditions:
          - "state == WAITLISTED"
          - "DayPlan.posture is PUBLISHED_PARTIAL or PUBLISHED_FULL"
          - "re-running calculations.admission_allocation for this reservation now yields CONFIRMED"
          - "candidates are evaluated in created_at ASC order, id never used as a tiebreak"
        side_effects:
          - "state = CONFIRMED; confirmed_at = logical_clock; waitlist_reason = NONE; allocated_stalls = vehicle_count"
          - "DayPlan admitted_guest_count, non_season_admitted_count, waitlisted_guest_count and parking_stalls_used recomputed"
          - "AccessReservation.version and DayPlan.version incremented by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /mountain-ops/access-reservations/{id}/check-in"
        actor: GuestServicesAgent
        preconditions:
          - "state == CONFIRMED"
          - "DayPlan.posture is PUBLISHED_PARTIAL or PUBLISHED_FULL"
        side_effects:
          - "state = CHECKED_IN; checked_in_at = logical_clock"
          - "AccessReservation.version incremented by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /mountain-ops/access-reservations/{id}/release"
        actor: GuestServicesAgent
        preconditions: ["state is CONFIRMED, WAITLISTED or CHECKED_IN"]
        side_effects:
          - "state = RELEASED; released_at = logical_clock; allocated_stalls = 0"
          - "DayPlan admitted_guest_count, non_season_admitted_count, waitlisted_guest_count and parking_stalls_used recomputed (compensating restore)"
          - "promotion sweep runs over the day's WAITLISTED reservations in created_at ASC order; each promoted reservation re-recomputes the DayPlan counters"
          - "AccessReservation.version and DayPlan.version incremented by 1"
      - from: CHECKED_IN
        to: RELEASED
        trigger: "POST /mountain-ops/access-reservations/{id}/release"
        actor: GuestServicesAgent
        preconditions: ["state == CHECKED_IN"]
        side_effects: ["identical to the CONFIRMED -> RELEASED side effects"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (optimistic concurrency control only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: session-create-stale-terrain-area
    parent_entity: TerrainArea
    write_endpoint: "POST /mountain-ops/snowmaking-sessions"
    occ_field: "expected_terrain_area_version"
    description: |
      Scheduling a SnowmakingSession reserves water against the season ledger and commits pump
      capacity on the strength of the TerrainArea's current opening_state, base_depth_in and
      groom_ready. A create that legitimately supersedes an overlapping SCHEDULED session on the
      same area (aborting it with abort_reason=SUPERSEDED) is accepted only when the caller states
      the TerrainArea.version it actually observed; a create carrying a version the server has
      already advanced is rejected as stale so the plan is re-derived from fresh gate inputs.
      Evaluated at validation priority 17 — after existence, schema, interval, uniqueness and state
      checks, before the segregation-of-duties, staffing and capacity checks.
    error_id: ERR_STALE_TERRAIN_AREA_VERSION
    http_status: 412

  - rule_id: reservation-create-stale-day-plan
    parent_entity: DayPlan
    write_endpoint: "POST /mountain-ops/access-reservations"
    occ_field: "expected_day_plan_version"
    description: |
      Admission is allocated against guest_capacity, non_season_pool and parking_stalls_total, all
      of which move whenever terrain opens, a lift goes on wind hold, or another party is admitted
      or released. A create that legitimately consumes the last of a pool is accepted only when the
      caller states the DayPlan.version it observed, so an admission decision can never be made
      against a capacity figure the server has already superseded. Evaluated at validation
      priority 18 — after existence, schema, uniqueness and posture checks, before the waterfall
      allocation and parking checks.
    error_id: ERR_STALE_DAY_PLAN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: active_day_plan_selector
    trigger: "Every rule that reads today's weather, posture or capacity — terrain opening decisions, lift open/release, snowmaking start/resume, admission allocation"
    algorithm: chronological
    formula: |
      candidates = DayPlan rows where season_id == season.id
                   and posture in {PUBLISHED_PARTIAL, PUBLISHED_FULL, WEATHER_HOLD}
      rank candidates by operating_date DESC, then created_at DESC   # id is never a decision input
      active_day_plan = first(candidates)
      if candidates is empty: there is no active DayPlan and the caller is rejected with
                              ERR_DAY_PLAN_NOT_PUBLISHED (409)
    input_set: "DRAFT and DAY_CLOSED plans are excluded; WEATHER_HOLD plans remain active so that wind readings and hold releases still resolve against them"
    constants: {}
    precision: "n/a — selector, not a numeric result"
    edge_cases:
      - "Two plans for the same season can never share an operating_date (uniqueness rule), so the created_at DESC fallback only fires if that constraint is ever relaxed"
      - "A season with only a DRAFT plan has no active DayPlan"

  - name: terrain_base_depth
    trigger: "POST /mountain-ops/terrain-areas/{id}/snow-depth-readings, and re-derived on every readiness re-evaluation"
    algorithm: aggregation
    formula: |
      cutoff = logical_clock - BASE_DEPTH_LOOKBACK_HOURS
      readings = SnowDepthReading rows where terrain_area_id == area.id and measured_at >= cutoff
      # collapse to the latest reading per stake
      for each distinct stake_code in readings:
          latest[stake_code] = the reading with the greatest measured_at;
                               ties broken by created_at DESC (never by id)
      depths = [latest[s].depth_in for s in latest]
      base_depth_stake_count = count(depths)
      if base_depth_stake_count == 0:
          base_depth_in = 0.0
      else if season.base_depth_policy == MEAN_OF_STAKES:
          base_depth_in = round_half_up(sum(depths) / base_depth_stake_count, 1)
      else:   # MIN_OF_STAKES
          base_depth_in = round_half_up(min(depths), 1)
    input_set: "Only readings whose measured_at falls inside the lookback window count; older readings are ignored even if they are the only reading for that stake, which can shrink base_depth_stake_count over time"
    constants:
      BASE_DEPTH_LOOKBACK_HOURS: 48
    precision: "1 decimal place, round_half_up"
    variants:
      - name: MEAN_OF_STAKES
        when: "season.base_depth_policy == MEAN_OF_STAKES"
        difference: "Averages the latest depth of every reporting stake, so a single thin stake is diluted by the others"
      - name: MIN_OF_STAKES
        when: "season.base_depth_policy == MIN_OF_STAKES"
        difference: "Takes the thinnest reporting stake, so the same reading set yields a strictly lower or equal depth and can hold terrain closed that MEAN_OF_STAKES would open"
    worked_example: |
      Stakes S1=33.4, S2=27.6, S3=41.9 (all inside the lookback window), min_open_base_depth_in = 30.0
        MEAN_OF_STAKES -> (33.4 + 27.6 + 41.9) / 3 = 102.9 / 3 = 34.3  -> gate passes
        MIN_OF_STAKES  -> min = 27.6                                   -> ERR_BASE_DEPTH_INSUFFICIENT
      base_depth_stake_count = 3 under both policies.
    edge_cases:
      - "Two readings for the same stake_code inside the window: only the later measured_at counts, so a later thin reading lowers the depth under both policies"
      - "Empty reading set yields base_depth_in = 0.0 and base_depth_stake_count = 0, which fails every non-zero min_open_base_depth_in"

  - name: groom_coverage_pct
    trigger: "POST /mountain-ops/grooming-tasks/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      winch_factor = WINCH_EFFICIENCY_FACTOR if task.winch_required else 1.0
      class_factor = BLACK_CLASS_FACTOR if area.terrain_class == BLACK else 1.0
      groomed_acres = passes_completed * CAT_SWATH_ACRES_PER_PASS * winch_factor * class_factor
      coverage_pct = min(100.0, round_half_up(groomed_acres / area.acres * 100, 1))
      # applied to the area
      area.groom_coverage_pct = coverage_pct
      area.groom_ready = (coverage_pct >= GROOM_READY_MIN_COVERAGE_PCT)
                         and (logical_clock < area.last_groomed_at + season.groom_freshness_hours)
    input_set: "Only the completing task's own passes_completed counts — coverage is not accumulated across tasks; the most recently completed task on the area defines its coverage"
    constants:
      CAT_SWATH_ACRES_PER_PASS: 0.75
      WINCH_EFFICIENCY_FACTOR: 0.8
      BLACK_CLASS_FACTOR: 0.9
      GROOM_READY_MIN_COVERAGE_PCT: 70.0
    precision: "1 decimal place, round_half_up; the min(100.0) cap is applied after rounding"
    worked_example: |
      acres = 15.0, passes_completed = 18, winch_required = false, terrain_class = BLUE
        groomed_acres = 18 * 0.75 * 1.0 * 1.0 = 13.5
        coverage_pct  = min(100.0, round(13.5 / 15.0 * 100, 1)) = 90.0  -> groom_ready = true
      acres = 12.0, passes_completed = 14, winch_required = true, terrain_class = BLACK
        groomed_acres = 14 * 0.75 * 0.8 * 0.9 = 7.56
        coverage_pct  = min(100.0, round(7.56 / 12.0 * 100, 1)) = 63.0  -> groom_ready = false
    edge_cases:
      - "A winched BLACK run needs 1 / (0.8 * 0.9) = 1.389x the passes of an unwinched BLUE run of the same acreage to reach the same coverage"
      - "coverage_pct is capped at 100.0, so extra passes past full coverage change nothing observable"

  - name: park_risk_score
    trigger: "POST /mountain-ops/terrain-areas/{id}/park-build"
    algorithm: weighted_scoring
    formula: |
      feature_weight(f) = FEATURE_BASE_WEIGHT[f.feature_type] * SIZE_MULTIPLIER[f.size_class]
      raw = sum(feature_weight(f) for f in submitted features)
      park_feature_count = count(features)
      exposure_factor = 1.0 + EXPOSURE_STEP * max(0, park_feature_count - EXPOSURE_FREE_FEATURES)
      park_risk_score = min(100.0, round_half_up(raw * exposure_factor, 1))
      # gate applied later, at the READY -> OPEN decision
      park is openable only when park_state == PARK_INSPECTED and park_risk_score <= PARK_RISK_MAX_OPEN
    input_set: "Every feature in the submitted array; a build with an empty array tears the park down (score 0.0, park_state PARK_CLOSED)"
    constants:
      FEATURE_BASE_WEIGHT: { JUMP: 6.0, RAIL: 4.0, JIB: 3.0, HALFPIPE: 12.0 }
      SIZE_MULTIPLIER: { S: 1.0, M: 1.5, L: 2.0 }
      EXPOSURE_FREE_FEATURES: 5
      EXPOSURE_STEP: 0.1
      PARK_RISK_MAX_OPEN: 60.0
    precision: "1 decimal place, round_half_up; cap applied after rounding"
    worked_example: |
      features = [JUMP/L, JUMP/M, RAIL/M, RAIL/S, JIB/S, HALFPIPE/S]  (6 features)
        raw = 12.0 + 9.0 + 6.0 + 4.0 + 3.0 + 12.0 = 46.0
        exposure_factor = 1.0 + 0.1 * (6 - 5) = 1.1
        park_risk_score = min(100.0, round(46.0 * 1.1, 1)) = 50.6  -> <= 60.0, park is openable
      adding a 7th feature HALFPIPE/L:
        raw = 46.0 + 24.0 = 70.0; exposure_factor = 1.0 + 0.1 * (7 - 5) = 1.2
        park_risk_score = 84.0 -> ERR_PARK_RISK_TOO_HIGH on the opening decision
    edge_cases:
      - "5 features or fewer carry exposure_factor exactly 1.0 — the free-feature allowance is a max(0, ...) floor, not a negative discount"
      - "Any rebuild resets park_inspected_by_user_id to null, so a re-inspection by a different user is mandatory before the area can open again"

  - name: snowmaking_wet_bulb_yield
    trigger: "POST /mountain-ops/snowmaking-sessions/{id}/status with target_state=RUNNING (both from SCHEDULED and from PAUSED)"
    algorithm: threshold
    formula: |
      wb = active_day_plan.wet_bulb_f            # copied onto the session as wet_bulb_f
      if wb > WET_BULB_MAX_F:            reject with ERR_WET_BULB_TOO_WARM (422)
      else if wb > WET_BULB_MARGINAL_F:  snow_yield_factor = YIELD_MARGINAL
      else if wb > WET_BULB_GOOD_F:      snow_yield_factor = YIELD_GOOD
      else:                              snow_yield_factor = YIELD_IDEAL
    input_set: "The wet_bulb_f of the season's active DayPlan at the instant the session enters RUNNING; a later weather update does not retroactively change a session already running"
    constants:
      WET_BULB_MAX_F: 27.0
      WET_BULB_MARGINAL_F: 24.0
      WET_BULB_GOOD_F: 20.0
      YIELD_MARGINAL: 0.60
      YIELD_GOOD: 0.85
      YIELD_IDEAL: 1.00
    precision: "snow_yield_factor is exact to 2 decimals; no rounding is applied to the band selection"
    worked_example: |
      wet_bulb_f = 27.0 -> not > 27.0, and > 24.0 -> snow_yield_factor = 0.60 (start succeeds)
      wet_bulb_f = 27.1 -> > 27.0                -> ERR_WET_BULB_TOO_WARM, session stays SCHEDULED
      wet_bulb_f = 24.0 -> not > 24.0, and > 20.0 -> snow_yield_factor = 0.85
      wet_bulb_f = 20.0 -> not > 20.0             -> snow_yield_factor = 1.00
    edge_cases:
      - "The bands are strict-greater tests, so every boundary value 27.0 / 24.0 / 20.0 falls into the colder (more productive) band"
      - "A PAUSED -> RUNNING resume re-reads the current wet_bulb_f, so a cycle across a warming trend can lower snow_yield_factor mid-session"

  - name: snowmaking_water_volume
    trigger: "PLANNED_RESERVATION at POST /mountain-ops/snowmaking-sessions; METERED_ACTUAL at POST /mountain-ops/snowmaking-sessions/{id}/status with target_state=COMPLETED"
    algorithm: aggregation
    formula: |
      planned_minutes = whole minutes between window_start and window_end
      PLANNED_RESERVATION:  water_af_reserved = round_half_up(gpm * planned_minutes / GALLONS_PER_ACRE_FOOT, 3)
      METERED_ACTUAL:       water_af_actual   = round_half_up(gpm * accumulated_run_minutes / GALLONS_PER_ACRE_FOOT, 3)
      # season ledger
      on create:    season.water_reserved_af += water_af_reserved
      on complete:  season.water_reserved_af -= water_af_reserved
                    season.water_used_af     += water_af_actual
                    season.snow_produced_swe_af += round_half_up(water_af_actual * snow_yield_factor, 3)
      on abort:     season.water_reserved_af -= water_af_reserved   (water_used_af untouched)
      # water-right gate, evaluated on create against the reservation variant
      if season.water_used_af + season.water_reserved_af + water_af_reserved > season.water_right_seasonal_af:
          reject with ERR_WATER_RIGHT_EXCEEDED (422)
    input_set: "PLANNED_RESERVATION uses the declared window length; METERED_ACTUAL uses only the minutes the row actually spent in RUNNING, accumulated across every RUNNING -> PAUSED cycle"
    constants:
      GALLONS_PER_ACRE_FOOT: 325851
    precision: "3 decimal places, round_half_up"
    variants:
      - name: PLANNED_RESERVATION
        when: "session create — the figure that is held against the season water right"
        difference: "Bills the entire declared window, so it is an upper bound that over-reserves whenever the session is paused or aborted early"
      - name: METERED_ACTUAL
        when: "session completion — the figure that is drawn from the season water right"
        difference: "Bills only accumulated_run_minutes, so it is strictly lower than PLANNED_RESERVATION for any session that did not run its whole window; the difference is released back to water_reserved_af"
    worked_example: |
      gpm = 1200, window [2026-08-01T05:00:00Z, 2026-08-01T12:00:00Z) -> planned_minutes = 420
        PLANNED_RESERVATION: 1200 * 420 / 325851 = 504000 / 325851 = 1.5467... -> 1.547 AF
      the session runs 05:00 -> 08:00, is paused, resumes 09:00 -> 12:00, then completes with
      accumulated_run_minutes = 360
        METERED_ACTUAL:      1200 * 360 / 325851 = 432000 / 325851 = 1.3257... -> 1.326 AF
      delta released back to season.water_reserved_af on completion = 1.547 AF of reservation
      retired against 1.326 AF of actual draw.
    edge_cases:
      - "An ABORTED session has water_af_actual = 0.000 and releases its whole reservation, so the ledger returns to its pre-create value exactly"
      - "accumulated_run_minutes counts whole minutes only (floor), so a 90-second run segment contributes 1 minute"

  - name: pump_capacity_sweep
    trigger: "POST /mountain-ops/snowmaking-sessions"
    algorithm: interval_merge
    formula: |
      # per pump house
      peers = SnowmakingSession rows where pump_house_id == request.pump_house_id
              and state in {SCHEDULED, RUNNING, PAUSED}
      boundaries = sorted set of every window_start and window_end among peers + the new session
      for each adjacent boundary pair [t_k, t_k+1):
          if [t_k, t_k+1) intersects the new session's [window_start, window_end):
              concurrent_gpm = new.gpm + sum(p.gpm for p in peers
                                             where p.window_start < t_k+1 and p.window_end > t_k)
              if concurrent_gpm > pump_house.max_gpm: reject ERR_PUMP_CAPACITY_EXCEEDED (422)
      # peak occupancy is measured over EVERY adjacent boundary pair, including the pairs the new
      # session does not intersect, so a pre-existing peer-only peak is not silently dropped
      occupants(t_k, t_k+1) = peers ∪ {the accepted new session}
                              filtered to rows with window_start < t_k+1 and window_end > t_k
      pump_house.peak_committed_gpm = max over every adjacent boundary pair
                                      of sum(o.gpm for o in occupants(t_k, t_k+1))
      # plant-wide sweep, same construction over every pump house of the season
      plant_peak_gpm = max over boundary pairs of the summed gpm across all pump houses of the season
      if plant_peak_gpm > season.plant_max_gpm: reject ERR_PLANT_CAPACITY_EXCEEDED (422)
    input_set: "Only SCHEDULED, RUNNING and PAUSED peers occupy capacity; COMPLETED and ABORTED sessions are excluded, so an abort immediately frees its gpm for a later create"
    constants:
      OVERLAP_SEMANTICS: "half-open [window_start, window_end) — an interval ending exactly when another begins does not overlap"
    precision: "integer gallons per minute; no rounding"
    worked_example: |
      pump_house.max_gpm = 2400
      peers: A [08:00, 12:00) gpm 1200 SCHEDULED, B [10:00, 14:00) gpm 900 SCHEDULED
        new [11:00, 13:00) gpm 400 -> on [11:00, 12:00) concurrent = 1200 + 900 + 400 = 2500 > 2400
                                   -> ERR_PUMP_CAPACITY_EXCEEDED
        new [12:00, 14:00) gpm 300 -> A does not overlap (touching at 12:00);
                                      concurrent = 900 + 300 = 1200 -> accepted,
                                      peak_committed_gpm = 2100 (from [10:00, 12:00))
    edge_cases:
      - "Two windows that merely touch never conflict, so a boundary-aligned back-to-back schedule is always admissible"
      - "The pump-house check runs before the plant-wide check, so a request that busts both reports ERR_PUMP_CAPACITY_EXCEEDED"

  - name: snowmaking_energy_cost
    trigger: "POST /mountain-ops/snowmaking-sessions/{id}/status with target_state=COMPLETED"
    algorithm: tiered_pricing
    formula: |
      kwh_total = round_half_up(water_af_actual * season.snowmaking_kwh_per_af, 3)
      # allocate the metered run time to the daily-recurring energy windows
      run_interval = [window_start, window_start + accumulated_run_minutes)
      for each energy window W of season.energy_windows, in start_hour_utc ASC order:
          minutes_W = whole minutes of run_interval that fall inside
                      [date(window_start) + W.start_hour_utc, date(window_start) + W.end_hour_utc)
          if minutes_W == 0: skip W
          kwh_W  = round_half_up(kwh_total * minutes_W / accumulated_run_minutes, 3)
          cost_W = round_half_up(kwh_W * W.price_usd_per_kwh, 2)     # ROUND PER WINDOW
      energy_kwh = kwh_total
      base_cost  = sum of cost_W in start_hour_utc ASC order          # sum of already-rounded costs
      # demand surcharge, applied after the per-window sum
      demand_surcharge_applied = (pump_house.peak_committed_gpm >= DEMAND_SURCHARGE_GPM_SHARE * season.plant_max_gpm)
      energy_cost_usd = round_half_up(base_cost * DEMAND_SURCHARGE_MULTIPLIER, 2) if demand_surcharge_applied
                        else base_cost
    input_set: "Only the metered run interval is priced; the unused tail of the declared window is never billed. Windows are daily-recurring, so a run interval that crosses 24:00 wraps into the first window of the next day."
    constants:
      DEMAND_SURCHARGE_GPM_SHARE: 0.80
      DEMAND_SURCHARGE_MULTIPLIER: 1.12
      ROUNDING_ORDER: "per-window kwh to 3 decimals, then per-window cost to 2 decimals, then sum; never sum first and round once"
    precision: "energy_kwh 3 decimals, energy_cost_usd 2 decimals, round_half_up at every step named above"
    worked_example: |
      season.energy_windows = [ {OFF_1, 0, 6, 0.062, OFF_PEAK}, {MID_1, 6, 9, 0.113, MID_PEAK},
                                {ON_1, 9, 21, 0.187, ON_PEAK}, {MID_2, 21, 24, 0.113, MID_PEAK} ]
      season.snowmaking_kwh_per_af = 620.0, plant_max_gpm = 6000
      session: gpm 1200, window_start 2026-08-01T05:00:00Z, accumulated_run_minutes 360,
               water_af_actual 1.326, pump_house.peak_committed_gpm 1200
        kwh_total = round(1.326 * 620.0, 3) = 822.120
        run_interval = [05:00, 11:00)
          OFF_1 [00:00, 06:00): minutes 60  -> kwh round(822.120 * 60 / 360, 3)  = 137.020
                                            -> cost round(137.020 * 0.062, 2)   =   8.50
          MID_1 [06:00, 09:00): minutes 180 -> kwh round(822.120 * 180 / 360, 3) = 411.060
                                            -> cost round(411.060 * 0.113, 2)   =  46.45
          ON_1  [09:00, 21:00): minutes 120 -> kwh round(822.120 * 120 / 360, 3) = 274.040
                                            -> cost round(274.040 * 0.187, 2)   =  51.25
          MID_2 [21:00, 24:00): minutes 0   -> skipped
        base_cost = 8.50 + 46.45 + 51.25 = 106.20
        demand_surcharge_applied = (1200 >= 0.80 * 6000 = 4800) = false
        energy_cost_usd = 106.20
      Summing the unrounded per-window costs and rounding once yields 106.19 — one cent low.
      With pump_house.peak_committed_gpm 5000 the surcharge fires:
        energy_cost_usd = round(106.20 * 1.12, 2) = 118.94   (rounding once at the end gives 118.93)
    edge_cases:
      - "A window contributing 0 minutes is skipped entirely and contributes no rounding remainder"
      - "energy_windows must tile [0,24); a submitted set with a gap is rejected at create time with ERR_ENERGY_WINDOW_COVERAGE_GAP"
      - "An ABORTED session prices to energy_kwh 0.000 and energy_cost_usd 0.00 regardless of accumulated_run_minutes"

  - name: day_guest_capacity
    trigger: "POST /mountain-ops/day-plans/{id}/publish, POST /mountain-ops/day-plans/{id}/weather, and every recompute triggered by a terrain opening decision or a lift service-status change"
    algorithm: constraint_propagation
    formula: |
      open_lift_capacity_pph = sum(lift.hourly_capacity_pph
                                   for lifts of the season with service_status == OPEN)
      open_terrain_count     = count(areas of the season with opening_state == OPEN)
      terrain_open_acres     = round_half_up(sum(area.acres for those areas), 1)
      # STEP ORDER IS NORMATIVE AND SINGLE-PASS — there is no fixed-point iteration
      raw_ccc = floor(open_lift_capacity_pph * CCC_UTILIZATION_FACTOR)
      if terrain_open_acres == 0.0:
          crowding_density = 0.0
      else:
          crowding_density = raw_ccc / terrain_open_acres        # evaluated on raw_ccc, NOT on guest_capacity
      density_factor = CROWDING_REDUCTION_FACTOR if crowding_density > CROWDING_DENSITY_THRESHOLD else 1.00
      guest_capacity  = floor(raw_ccc * density_factor)
      non_season_pool = floor(guest_capacity * NON_SEASON_POOL_SHARE)
    input_set: "Only lifts in service_status OPEN and areas in opening_state OPEN count; a lift on WIND_HOLD or an area on PATROL_HOLD contributes nothing, which is what makes the weather cascade shrink capacity"
    constants:
      CCC_UTILIZATION_FACTOR: 0.60
      CROWDING_DENSITY_THRESHOLD: 25.0
      CROWDING_REDUCTION_FACTOR: 0.85
      NON_SEASON_POOL_SHARE: 0.70
    precision: "raw_ccc, guest_capacity and non_season_pool are integers via floor; terrain_open_acres 1 decimal, round_half_up; crowding_density is not rounded before the threshold test"
    worked_example: |
      two OPEN lifts of 1100 and 700 pph, three OPEN areas of 18.0 + 14.0 + 8.0 acres
        open_lift_capacity_pph = 1800; terrain_open_acres = 40.0
        raw_ccc          = floor(1800 * 0.60) = 1080
        crowding_density = 1080 / 40.0 = 27.0  -> 27.0 > 25.0 -> density_factor = 0.85
        guest_capacity   = floor(1080 * 0.85)  = floor(918.0) = 918
        non_season_pool  = floor(918 * 0.70)   = floor(642.6) = 642
      Re-testing the density on the reduced figure (918 / 40.0 = 22.95, which is <= 25.0, so
      density_factor would revert to 1.00 and guest_capacity to 1080) is the forbidden reading:
      the threshold is evaluated exactly once, on raw_ccc.
    edge_cases:
      - "crowding_density exactly 25.0 does not trigger the reduction (strict greater-than)"
      - "terrain_open_acres == 0.0 with OPEN lifts yields crowding_density 0.0, density_factor 1.00 and guest_capacity == raw_ccc"
      - "posture WEATHER_HOLD does not zero the stored figures; it blocks admission through a separate validation"

  - name: admission_allocation
    trigger: "POST /mountain-ops/access-reservations, and re-run per candidate during the promotion sweep on POST /mountain-ops/access-reservations/{id}/release"
    algorithm: waterfall_allocation
    formula: |
      # buckets are consumed in this exact order; the first failing bucket decides the outcome
      # bucket 0 — whole-mountain sanity
      if party_size > day.guest_capacity:
          state = DENIED; waitlist_reason = NONE; allocated_stalls = 0; stop
      # bucket 1 — parking
      stalls_free = day.parking_stalls_total - day.parking_stalls_used
      if vehicle_count > stalls_free:
          state = WAITLISTED; waitlist_reason = PARKING; allocated_stalls = 0; stop
      # bucket 2 — pass-class pool (SEASON and EMPLOYEE bypass the non-season pool)
      if pass_type in {DAY_TICKET, RECIPROCAL}
         and day.non_season_admitted_count + party_size > day.non_season_pool:
          state = WAITLISTED; waitlist_reason = CAPACITY; allocated_stalls = 0; stop
      # bucket 3 — overall guest capacity
      if day.admitted_guest_count + party_size > day.guest_capacity:
          state = WAITLISTED; waitlist_reason = CAPACITY; allocated_stalls = 0; stop
      state = CONFIRMED; waitlist_reason = NONE; allocated_stalls = vehicle_count
      confirmed_at = logical_clock
      # counters, recomputed from the reservation set after every admission decision
      day.admitted_guest_count      = sum(party_size where state in {CONFIRMED, CHECKED_IN})
      day.non_season_admitted_count = sum(party_size where state in {CONFIRMED, CHECKED_IN}
                                          and pass_type in {DAY_TICKET, RECIPROCAL})
      day.waitlisted_guest_count    = sum(party_size where state == WAITLISTED)
      day.parking_stalls_used       = sum(allocated_stalls where state in {CONFIRMED, CHECKED_IN})
    input_set: "Only CONFIRMED and CHECKED_IN reservations consume capacity and stalls; WAITLISTED, RELEASED and DENIED rows consume nothing"
    constants:
      SEASON_BYPASS_PASS_TYPES: [SEASON, EMPLOYEE]
      NON_SEASON_PASS_TYPES: [DAY_TICKET, RECIPROCAL]
    precision: "integer guests and stalls; no rounding"
    worked_example: |
      day: guest_capacity 918, non_season_pool 642, parking_stalls_total 500,
           admitted_guest_count 700, non_season_admitted_count 630, parking_stalls_used 480
        party DAY_TICKET, party_size 20, vehicle_count 5
          bucket 0: 20 <= 918 ok; bucket 1: 5 <= 20 free stalls ok
          bucket 2: 630 + 20 = 650 > 642 -> WAITLISTED, waitlist_reason = CAPACITY
        party DAY_TICKET, party_size 10, vehicle_count 4
          bucket 2: 630 + 10 = 640 <= 642 ok; bucket 3: 700 + 10 = 710 <= 918 ok
          -> CONFIRMED, allocated_stalls = 4
        party DAY_TICKET, party_size 10, vehicle_count 25
          bucket 1: 25 > 20 free stalls -> WAITLISTED, waitlist_reason = PARKING
          (parking is checked before the pool, so a party that would also bust the pool still
           reports PARKING)
        party SEASON, party_size 10, vehicle_count 2
          bucket 2 skipped entirely; bucket 3: 700 + 10 = 710 <= 918 -> CONFIRMED
    edge_cases:
      - "A party whose party_size alone exceeds guest_capacity is DENIED (terminal), never WAITLISTED — it can never be promoted"
      - "Exact-fit admissions are allowed: 642 + 0 headroom means a party_size of exactly the remaining pool is CONFIRMED"

  - name: waitlist_promotion
    trigger: "POST /mountain-ops/access-reservations/{id}/release, and POST /mountain-ops/day-plans/{id}/weather when a recompute raises guest_capacity"
    algorithm: chronological
    formula: |
      candidates = AccessReservation rows where day_plan_id == day.id and state == WAITLISTED
      order candidates by created_at ASC   # id is never a decision input, and party_size is never used to pack
      for each candidate in that order:
          re-run calculations.admission_allocation against the current day counters
          if the outcome is CONFIRMED: promote it (state CONFIRMED, confirmed_at = logical_clock,
                                       allocated_stalls = vehicle_count, waitlist_reason = NONE)
                                       and recompute the day counters before evaluating the next candidate
          else: leave it WAITLISTED and continue to the next candidate
    input_set: "The whole WAITLISTED set of the day is swept on every release; a candidate that still does not fit is skipped, not removed, so later releases can promote it"
    constants: {}
    precision: "n/a — ordering rule"
    worked_example: |
      guest_capacity 918, admitted_guest_count 918. Waitlisted, in created_at order:
        W1 party_size 40, W2 party_size 10, W3 party_size 25
      A CONFIRMED party of 30 is released -> admitted_guest_count 888, 30 seats free
        W1: 888 + 40 = 928 > 918 -> stays WAITLISTED
        W2: 888 + 10 = 898 <= 918 -> promoted; admitted_guest_count becomes 898
        W3: 898 + 25 = 923 > 918 -> stays WAITLISTED
      Result: exactly one promotion (W2), and the sweep does not stop at the first skip.
    edge_cases:
      - "Promotion never reorders by party_size, so a small party later in created_at order cannot jump ahead of an earlier small party that also fits"
      - "A DENIED reservation is never a promotion candidate"

  - name: incident_response_minutes
    trigger: "POST /mountain-ops/incidents/{id}/dispatch"
    algorithm: chronological
    formula: |
      elapsed_seconds = (dispatched_at - reported_at) in whole seconds
      response_minutes = round_half_up(elapsed_seconds / 60, 0)
    input_set: "reported_at is stamped at incident creation from the logical clock; dispatched_at is stamped at dispatch"
    constants: {}
    precision: "integer minutes, round_half_up (a 7 minute 30 second response rounds to 8)"
    worked_example: |
      reported_at 2026-08-01T09:00:00.000Z, dispatched_at 2026-08-01T09:07:30.000Z
        elapsed_seconds = 450 -> 450 / 60 = 7.5 -> response_minutes = 8
      dispatched_at 2026-08-01T09:07:29.000Z -> 449 / 60 = 7.483... -> response_minutes = 7
    edge_cases:
      - "A dispatch in the same logical instant as the report yields response_minutes = 0"

  - name: season_snow_accounting
    trigger: "GET /mountain-ops/seasons/{id}/snow-accounting and GET /mountain-ops/day-plans/{id}/opening-report"
    algorithm: aggregation
    formula: |
      water_used_af          = round_half_up(sum(s.water_af_actual for COMPLETED sessions of the season), 3)
      water_reserved_af      = round_half_up(sum(s.water_af_reserved for sessions of the season
                                                 in state SCHEDULED, RUNNING or PAUSED), 3)
      snow_produced_swe_af   = round_half_up(sum(s.snow_swe_af for COMPLETED sessions of the season), 3)
      water_right_remaining_af = round_half_up(season.water_right_seasonal_af
                                               - water_used_af - water_reserved_af, 3)
      energy_cost_total_usd  = round_half_up(sum(s.energy_cost_usd for COMPLETED sessions), 2)
      open_area_count        = count(areas of the season with opening_state == OPEN)
      open_acres             = round_half_up(sum(area.acres for those areas), 1)
      openable_acres         = round_half_up(sum(area.acres for areas with opening_state
                                                 in {READY, OPEN, PATROL_HOLD}), 1)
      terrain_open_pct       = 0.0 if total season acres == 0 else
                               round_half_up(open_acres / sum(all non-SEASON_CLOSED area acres) * 100, 1)
      machine_swe_by_area    = per-area machine_swe_af, ordered by trail_code ASC
    input_set: "Session state filtering is the whole difficulty: ABORTED sessions contribute to none of the three ledgers, and their reservations must already have been released"
    constants: {}
    precision: "acre-feet 3 decimals, currency 2 decimals, percentages and acres 1 decimal, all round_half_up"
    worked_example: |
      one COMPLETED session (water_af_actual 1.326, snow_yield_factor 0.85,
      snow_swe_af round(1.326 * 0.85, 3) = 1.127, energy_cost_usd 106.20) and one ABORTED session
      (water_af_reserved 0.900, released) on a season with water_right_seasonal_af 250.000
        water_used_af = 1.326; water_reserved_af = 0.000; snow_produced_swe_af = 1.127
        water_right_remaining_af = round(250.000 - 1.326 - 0.000, 3) = 248.674
        energy_cost_total_usd = 106.20
    edge_cases:
      - "The identity water_used_af + water_reserved_af + water_right_remaining_af == water_right_seasonal_af must hold after every create, complete and abort"
      - "A season with no sessions reports 0.000 across all three ledgers and water_right_remaining_af == water_right_seasonal_af"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role is permitted for this endpoint per §1.7, and for role-owned actions X-User-ID resolves to the required entity (Patroller actions require X-User-ID to be an existing Patroller id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: >-
      Every templated path segment resolves, validated left-to-right:
      ERR_SEASON_NOT_FOUND, ERR_TERRAIN_AREA_NOT_FOUND, ERR_LIFT_NOT_FOUND, ERR_PUMP_HOUSE_NOT_FOUND,
      ERR_SESSION_NOT_FOUND, ERR_GROOMING_TASK_NOT_FOUND, ERR_STAFF_ASSIGNMENT_NOT_FOUND,
      ERR_PATROLLER_NOT_FOUND, ERR_MISSION_NOT_FOUND, ERR_INCIDENT_NOT_FOUND,
      ERR_DAY_PLAN_NOT_FOUND, ERR_RESERVATION_NOT_FOUND
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a templated path segment"

  - priority: 4
    category: business_referential
    check: >-
      Every foreign key in the request body resolves, validated in declaration order:
      season_id, serving_lift_id, terrain_area_id, pump_house_id, lift_id, day_plan_id,
      assigned_terrain_area_id, patroller_id. A body FK that resolves but belongs to a different
      season than the sibling FK is rejected with ERR_CROSS_SEASON_REFERENCE (422).
    error_id: ERR_CROSS_SEASON_REFERENCE
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas, POST /mountain-ops/lifts, POST /mountain-ops/pump-houses, POST /mountain-ops/snowmaking-sessions, POST /mountain-ops/patrollers, POST /mountain-ops/day-plans, POST /mountain-ops/incidents/{id}/dispatch"

  - priority: 5
    category: business_constraint
    check: "Request body conforms to the endpoint's declared input schema — required fields present, types correct, enum values inside their declared domains, numbers inside their declared ranges, arrays inside their declared cardinality"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_temporal
    check: "Every declared interval satisfies window_start < window_end, and shift_start < shift_end"
    error_id: ERR_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /mountain-ops/snowmaking-sessions, POST /mountain-ops/grooming-tasks, POST /mountain-ops/lift-staff-assignments"

  - priority: 7
    category: business_constraint
    check: "SeasonConfig.energy_windows tile [0,24) exactly — sorted by start_hour_utc the entries are contiguous, the first starts at 0, the last ends at 24, and no two overlap"
    error_id: ERR_ENERGY_WINDOW_COVERAGE_GAP
    http_status: 422
    applies_to: "POST /mountain-ops/seasons"

  - priority: 8
    category: business_safety
    check: "A GroomingTask with winch_required=true declares a non-empty winch_anchor_code"
    error_id: ERR_WINCH_ANCHOR_REQUIRED
    http_status: 422
    applies_to: "POST /mountain-ops/grooming-tasks"

  - priority: 9
    category: business_temporal
    check: "SnowDepthReading.measured_at is not after the logical clock"
    error_id: ERR_READING_TIMESTAMP_FUTURE
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas/{id}/snow-depth-readings"

  - priority: 10
    category: business_constraint
    check: >-
      Scoped uniqueness: SeasonConfig.season_label globally; Lift.lift_code, TerrainArea.trail_code,
      PumpHouse.pump_house_code and Patroller.patroller_code per season; DayPlan.operating_date per
      season; AccessReservation.party_code per day plan; GroomingTask.sequence_index per
      cat_route_code within a season
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /mountain-ops/seasons, POST /mountain-ops/lifts, POST /mountain-ops/terrain-areas, POST /mountain-ops/pump-houses, POST /mountain-ops/patrollers, POST /mountain-ops/grooming-tasks, POST /mountain-ops/day-plans, POST /mountain-ops/access-reservations"

  - priority: 11
    category: state
    check: >-
      The governing SeasonConfig.season_state permits the operation: CLOSED forbids every write;
      terrain opening decisions, snowmaking session status changes and admission additionally
      require OPERATING; day-plan publish requires PRESEASON or OPERATING because the season's
      first publish is what moves PRESEASON -> OPERATING
    error_id: ERR_SEASON_NOT_OPERATING
    http_status: 409
    applies_to: "all POST endpoints under /mountain-ops except POST /mountain-ops/seasons"

  - priority: 12
    category: state
    check: >-
      The target TerrainArea.opening_state permits the operation, enumerated per endpoint:
      snowmaking session create requires opening_state not in {PATROL_HOLD, SEASON_CLOSED};
      grooming task dispatch requires opening_state not in {PATROL_HOLD, SEASON_CLOSED};
      park build requires opening_state != SEASON_CLOSED (a park may be rebuilt while the area is
      CLOSED, PREP, READY, OPEN or PATROL_HOLD);
      mitigation mission execute requires opening_state != OPEN;
      an opening decision with decision=OPEN requires opening_state in {READY, PATROL_HOLD} and
      decision=CLOSE requires opening_state in {OPEN, PATROL_HOLD}
    error_id: ERR_TERRAIN_STATE_INVALID
    http_status: 409
    applies_to: "POST /mountain-ops/snowmaking-sessions, POST /mountain-ops/grooming-tasks/{id}/dispatch, POST /mountain-ops/terrain-areas/{id}/opening-decision, POST /mountain-ops/terrain-areas/{id}/park-build, POST /mountain-ops/mitigation-missions/{id}/execute"

  - priority: 13
    category: state
    check: "The target SnowmakingSession.state permits the requested target_state per §1.2 (SCHEDULED accepts RUNNING; RUNNING accepts PAUSED and COMPLETED; PAUSED accepts RUNNING and COMPLETED; COMPLETED and ABORTED accept nothing)"
    error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /mountain-ops/snowmaking-sessions/{id}/status"

  - priority: 14
    category: state
    check: "The target Lift.service_status permits the requested target_status per §1.2, and MECH_HOLD may only be left by a passing inspection"
    error_id: ERR_LIFT_STATE_INVALID
    http_status: 409
    applies_to: "POST /mountain-ops/lifts/{id}/service-status"

  - priority: 15
    category: state
    check: "The target workflow row is in a state that accepts the action — GroomingTask dispatch/complete, AvalancheMitigationMission execute/clear, PatrolIncident dispatch/transport/close, LiftStaffAssignment release, AccessReservation check-in/release"
    error_id: ERR_WORKFLOW_STATE_INVALID
    http_status: 409
    applies_to: "POST /mountain-ops/grooming-tasks/{id}/dispatch, POST /mountain-ops/grooming-tasks/{id}/complete, POST /mountain-ops/mitigation-missions/{id}/execute, POST /mountain-ops/mitigation-missions/{id}/clear, POST /mountain-ops/incidents/{id}/dispatch, POST /mountain-ops/incidents/{id}/transport, POST /mountain-ops/incidents/{id}/close, POST /mountain-ops/lift-staff-assignments/{id}/release, POST /mountain-ops/access-reservations/{id}/check-in, POST /mountain-ops/access-reservations/{id}/release"

  - priority: 16
    category: state
    check: >-
      The season has an active DayPlan per calculations.active_day_plan_selector. Required for
      terrain opening decisions, snowmaking status changes, lift service-status changes with
      target_status=OPEN, and admission; for admission and check-in the posture must additionally be
      PUBLISHED_PARTIAL or PUBLISHED_FULL (WEATHER_HOLD blocks admission but not a hold release).
    error_id: ERR_DAY_PLAN_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /mountain-ops/terrain-areas/{id}/opening-decision, POST /mountain-ops/lifts/{id}/service-status, POST /mountain-ops/snowmaking-sessions/{id}/status, POST /mountain-ops/access-reservations, POST /mountain-ops/access-reservations/{id}/check-in"

  - priority: 17
    category: state
    check: "expected_terrain_area_version equals the current TerrainArea.version (concurrency_rules.session-create-stale-terrain-area)"
    error_id: ERR_STALE_TERRAIN_AREA_VERSION
    http_status: 412
    applies_to: "POST /mountain-ops/snowmaking-sessions"

  - priority: 18
    category: state
    check: "expected_day_plan_version equals the current DayPlan.version (concurrency_rules.reservation-create-stale-day-plan)"
    error_id: ERR_STALE_DAY_PLAN_VERSION
    http_status: 412
    applies_to: "POST /mountain-ops/access-reservations"

  - priority: 19
    category: business_safety
    check: >-
      Segregation of duties on X-User-ID: the Patroller clearing a mitigation mission is not the one
      who executed it, and the user inspecting a terrain park is not the one who built it
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: "POST /mountain-ops/mitigation-missions/{id}/clear, POST /mountain-ops/terrain-areas/{id}/park-inspection"

  - priority: 20
    category: business_safety
    check: "The acting Patroller has on_duty == true"
    error_id: ERR_PATROLLER_NOT_ON_DUTY
    http_status: 422
    applies_to: "POST /mountain-ops/mitigation-missions/{id}/execute, POST /mountain-ops/mitigation-missions/{id}/clear, POST /mountain-ops/terrain-areas/{id}/park-inspection, POST /mountain-ops/incidents/{id}/dispatch"

  - priority: 21
    category: business_safety
    check: "A mission with method EXPLOSIVE or GAS_EXPLODER is executed by a Patroller with blaster_certified == true"
    error_id: ERR_BLASTER_CERT_REQUIRED
    http_status: 422
    applies_to: "POST /mountain-ops/mitigation-missions/{id}/execute"

  - priority: 22
    category: business_safety
    check: "A mission with method SKI_CUT has at least one other Patroller of the same season with on_duty == true and status AVAILABLE at execution time"
    error_id: ERR_SKI_CUT_PARTNER_REQUIRED
    http_status: 422
    applies_to: "POST /mountain-ops/mitigation-missions/{id}/execute"

  - priority: 23
    category: business_safety
    check: >-
      Certification floor: clearing a mitigation mission and responding to a SERIOUS or CRITICAL
      incident both require cert_level EMT or PARAMEDIC
    error_id: ERR_PATROLLER_CERT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /mountain-ops/mitigation-missions/{id}/clear, POST /mountain-ops/incidents/{id}/dispatch"

  - priority: 24
    category: business_safety
    check: "The nominated responder Patroller has status AVAILABLE (a patroller already ON_INCIDENT cannot be dispatched again)"
    error_id: ERR_PATROLLER_BUSY
    http_status: 409
    applies_to: "POST /mountain-ops/incidents/{id}/dispatch"

  - priority: 25
    category: business_safety
    check: "TerrainArea.base_depth_in >= min_open_base_depth_in, using calculations.terrain_base_depth under the season's base_depth_policy"
    error_id: ERR_BASE_DEPTH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas/{id}/opening-decision"

  - priority: 26
    category: business_safety
    check: "TerrainArea.groom_ready == true and logical_clock < last_groomed_at + season.groom_freshness_hours"
    error_id: ERR_GROOM_NOT_CURRENT
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas/{id}/opening-decision"

  - priority: 27
    category: business_safety
    check: "For an area with avalanche_terrain == true, mitigation_clearance_expires_at is not null and logical_clock < mitigation_clearance_expires_at"
    error_id: ERR_MITIGATION_NOT_CURRENT
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas/{id}/opening-decision"

  - priority: 28
    category: business_safety
    check: "TerrainArea.assigned_patroller_count >= SeasonConfig.min_patrollers_per_open_area, counting only Patroller rows with on_duty == true and status AVAILABLE"
    error_id: ERR_PATROL_STAFFING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas/{id}/opening-decision"

  - priority: 29
    category: business_safety
    check: "An area with terrain_class == PARK has park_state == PARK_INSPECTED"
    error_id: ERR_PARK_NOT_INSPECTED
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas/{id}/opening-decision"

  - priority: 30
    category: business_safety
    check: "An area with terrain_class == PARK has park_risk_score <= PARK_RISK_MAX_OPEN (60.0)"
    error_id: ERR_PARK_RISK_TOO_HIGH
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas/{id}/opening-decision"

  - priority: 31
    category: business_safety
    check: "The area's serving Lift.service_status == OPEN"
    error_id: ERR_SERVING_LIFT_NOT_OPEN
    http_status: 422
    applies_to: "POST /mountain-ops/terrain-areas/{id}/opening-decision"

  - priority: 32
    category: business_safety
    check: "Lift.mechanical_status == INSPECTION_PASSED and logical_clock < Lift.inspection_valid_until"
    error_id: ERR_LIFT_INSPECTION_EXPIRED
    http_status: 422
    applies_to: "POST /mountain-ops/lifts/{id}/service-status, POST /mountain-ops/terrain-areas/{id}/opening-decision"

  - priority: 33
    category: business_safety
    check: "Releasing a WIND_HOLD requires the active DayPlan.wind_speed_mph <= Lift.wind_hold_threshold_mph - WIND_HOLD_RELEASE_HYSTERESIS_MPH (5.0)"
    error_id: ERR_WIND_ABOVE_RELEASE_THRESHOLD
    http_status: 422
    applies_to: "POST /mountain-ops/lifts/{id}/service-status"

  - priority: 34
    category: business_safety
    check: "Starting or resuming a session requires the active DayPlan.wet_bulb_f <= WET_BULB_MAX_F (27.0)"
    error_id: ERR_WET_BULB_TOO_WARM
    http_status: 422
    applies_to: "POST /mountain-ops/snowmaking-sessions/{id}/status"

  - priority: 35
    category: business_safety
    check: "PumpHouse.status == ONLINE"
    error_id: ERR_PUMP_HOUSE_OFFLINE
    http_status: 422
    applies_to: "POST /mountain-ops/snowmaking-sessions, POST /mountain-ops/snowmaking-sessions/{id}/status"

  - priority: 36
    category: business_safety
    check: "transport_mode HELICOPTER requires severity == CRITICAL; transport_mode AMBULANCE requires severity SERIOUS or CRITICAL"
    error_id: ERR_TRANSPORT_MODE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /mountain-ops/incidents/{id}/transport"

  - priority: 37
    category: business_constraint
    check: "Lift.staffed_operator_count >= Lift.required_operator_count before the lift may enter OPEN"
    error_id: ERR_LIFT_OPERATORS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /mountain-ops/lifts/{id}/service-status"

  - priority: 38
    category: business_constraint
    check: "A lift has at most one ASSIGNED LiftStaffAssignment per role_on_lift, except LIFTIE_FLOAT which may repeat"
    error_id: ERR_LIFT_ROLE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /mountain-ops/lift-staff-assignments"

  - priority: 39
    category: business_temporal
    check: >-
      The same operator_code may not hold two ASSIGNED LiftStaffAssignment rows whose shifts come
      within OPERATOR_TURNAROUND_MINUTES (30) of one another — shifts conflict when
      new.shift_start < peer.shift_end + 30 minutes and new.shift_end + 30 minutes > peer.shift_start
    error_id: ERR_OPERATOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /mountain-ops/lift-staff-assignments"

  - priority: 40
    category: business_constraint
    check: "Every GroomingTask on the same cat_route_code with a lower sequence_index is in state COMPLETED or CANCELLED before this task may be dispatched"
    error_id: ERR_GROOM_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /mountain-ops/grooming-tasks/{id}/dispatch"

  - priority: 41
    category: business_temporal
    check: "No other DISPATCHED GroomingTask with the same snowcat_unit_code has a window overlapping this task's half-open [window_start, window_end)"
    error_id: ERR_SNOWCAT_CONFLICT
    http_status: 409
    applies_to: "POST /mountain-ops/grooming-tasks/{id}/dispatch"

  - priority: 42
    category: business_fiscal
    check: "calculations.pump_capacity_sweep finds no boundary interval where the concurrent gpm on the pump house exceeds PumpHouse.max_gpm"
    error_id: ERR_PUMP_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /mountain-ops/snowmaking-sessions"

  - priority: 43
    category: business_fiscal
    check: "calculations.pump_capacity_sweep finds no boundary interval where the summed gpm across all pump houses of the season exceeds SeasonConfig.plant_max_gpm"
    error_id: ERR_PLANT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /mountain-ops/snowmaking-sessions"

  - priority: 44
    category: business_fiscal
    check: "season.water_used_af + season.water_reserved_af + this session's water_af_reserved <= season.water_right_seasonal_af (fiscal check runs last)"
    error_id: ERR_WATER_RIGHT_EXCEEDED
    http_status: 422
    applies_to: "POST /mountain-ops/snowmaking-sessions"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # -- season configuration -------------------------------------------------
  - method: POST
    path: "/mountain-ops/seasons"
    description: "Create a season configuration: water right, plant ceiling, energy intensity, energy price windows and readiness policy"
    roles: [MountainOpsDirector]
    code: 201
    input: ["season_label", "water_right_seasonal_af", "plant_max_gpm", "snowmaking_kwh_per_af", "energy_windows", "base_depth_policy?", "min_patrollers_per_open_area?", "groom_freshness_hours?"]
    output: SeasonConfig
    side_effects:
      - "season_state = PRESEASON; water_reserved_af, water_used_af, snow_produced_swe_af = 0.0; open_area_count = 0"
      - "validates that energy_windows tile [0,24) (ERR_ENERGY_WINDOW_COVERAGE_GAP)"

  - method: GET
    path: "/mountain-ops/seasons/{id}"
    description: "Read a season configuration with its live water and snow ledgers"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: SeasonConfig
    side_effects: []

  - method: GET
    path: "/mountain-ops/seasons/{id}/snow-accounting"
    description: "Season-long snow and water accounting rollup (calculations.season_snow_accounting)"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: "{ season_id: string, water_right_seasonal_af: number, water_used_af: number, water_reserved_af: number, water_right_remaining_af: number, snow_produced_swe_af: number, energy_cost_total_usd: number, completed_session_count: integer, aborted_session_count: integer, open_area_count: integer, open_acres: number, openable_acres: number, terrain_open_pct: number }"
    side_effects: []

  # -- lifts ----------------------------------------------------------------
  - method: POST
    path: "/mountain-ops/lifts"
    description: "Register a lift with its wind hold threshold, hourly capacity and operator requirement"
    roles: [LiftOpsManager, MountainOpsDirector]
    code: 201
    input: ["season_id", "lift_code", "lift_type", "wind_hold_threshold_mph", "hourly_capacity_pph", "name?", "required_operator_count?"]
    output: Lift
    side_effects:
      - "service_status = CLOSED; mechanical_status = INSPECTION_DUE; staffed_operator_count = 0; inspection_valid_until = null"

  - method: GET
    path: "/mountain-ops/lifts/{id}"
    description: "Read a lift with both of its state dimensions"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: []
    output: Lift
    side_effects: []

  - method: GET
    path: "/mountain-ops/lifts"
    description: "List lifts, filterable by season and by either state dimension"
    roles: [MountainOpsDirector, SnowmakingSupervisor, GroomingLead, LiftOpsManager, Patroller, GuestServicesAgent]
    code: 200
    input: ["season_id?", "service_status?", "mechanical_status?", "limit?", "offset?"]
    output: Lift[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/lifts/{id}/inspections"
    description: "Record a mechanical inspection result; drives the mechanical_status dimension and, on FAIL, forces the service dimension into MECH_HOLD"
    roles: [LiftOpsManager]
    code: 200
    input: ["result", "notes?"]
    output: Lift
    side_effects:
      - "last_inspection_at = logical_clock; last_inspection_result = result"
      - "on PASS: mechanical_status = INSPECTION_PASSED; inspection_valid_until = logical_clock + 24h; service_status MECH_HOLD -> STANDBY; served TerrainArea rows in PATROL_HOLD are re-gated and return to OPEN when every gate holds"
      - "on FAIL: mechanical_status = INSPECTION_FAILED; inspection_valid_until = null; service_status OPEN|STANDBY|WIND_HOLD -> MECH_HOLD; served OPEN areas -> PATROL_HOLD; their PLANNED/DISPATCHED grooming tasks -> DEFERRED; their SCHEDULED/RUNNING/PAUSED sessions -> ABORTED (abort_reason=TERRAIN_HOLD) with their water reservations released from SeasonConfig.water_reserved_af"
      - "active DayPlan open_lift_capacity_pph, open_terrain_count, terrain_open_acres, raw_ccc, guest_capacity, non_season_pool and posture recomputed"
      - "increments Lift.version by 1"

  - method: POST
    path: "/mountain-ops/lifts/{id}/service-status"
    description: "Move a lift between CLOSED, STANDBY and OPEN, including releasing a wind hold under the hysteresis band"
    roles: [LiftOpsManager]
    code: 200
    input: [target_status]
    output: Lift
    side_effects:
      - "service_status = target_status when §1.2 permits the transition"
      - "target_status=OPEN from WIND_HOLD requires active DayPlan.wind_speed_mph <= wind_hold_threshold_mph - 5.0 and clears wind_hold_since; served PATROL_HOLD areas are re-gated and return to OPEN only when every READY->OPEN gate holds"
      - "target_status=CLOSED cascades served OPEN areas to PATROL_HOLD with the grooming/snowmaking/water chain"
      - "active DayPlan capacity fields and posture recomputed"
      - "increments Lift.version by 1"

  - method: GET
    path: "/mountain-ops/lifts/{id}/staff-assignments"
    description: "List the staffing roster of one lift"
    roles: [MountainOpsDirector, LiftOpsManager, GroomingLead, SnowmakingSupervisor, Patroller, GuestServicesAgent]
    code: 200
    input: ["state?", "role_on_lift?", "limit?", "offset?"]
    output: LiftStaffAssignment[]
    side_effects: []

  - method: POST
    path: "/mountain-ops/lift-staff-assignments"
    description: "Assign an operator to a lift role for a shift"
    roles: [LiftOpsManager]
    code: 201
    input: [lift_id, operator_code, role_on_lift, shift_start, shift_end]
    output: LiftStaffAssignment
    side_effects:
      - "state = ASSIGNED"
      - "rejects a second ASSIGNED row for the same non-LIFTIE_FLOAT role_on_lift (ERR_LIFT_ROLE_SLOT_CONFLICT) and a shift within 30 minutes of another ASSIGNED shift of the same operator_code (ERR_OPERATOR_DOUBLE_BOOKED)"
      - "Lift.staffed_operator_count recomputed; increments Lift.version by 1"

  - method: POST
    path: "/mountain-ops/lift-staff-assignments/{id}/release"
    description: "Release an operator from a lift assignment"
    roles: [LiftOpsManager]
    code: 200
    input: []
    output: LiftStaffAssignment
    side_effects:
      - "state = RELEASED; released_at = logical_clock"
      - "Lift.staffed_operator_count recomputed; a lift that falls below required_operator_count while OPEN drops to STANDBY and cascades its served OPEN areas to PATROL_HOLD"
      - "increments LiftStaffAssignment.version by 1 and Lift.version by 1"

  # -- terrain areas --------------------------------------------------------
  - method: POST
    path: "/mountain-ops/terrain-areas"
    description: "Create a terrain area (trail, glade or terrain park) served by one lift"
    roles: [MountainOpsDirector]
