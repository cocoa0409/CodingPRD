            - "snapshot remains DRAFT"

  # ===========================================================================
  # Section: endpoints — list/pagination/filtering, computed reads, envelope
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_reits_pagination_envelope
        claim_type: pagination_envelope
        grounds: [response_envelope, endpoints.GET_/reit-compliance/reits]
        distinguishing_aspect: "GET /reits?limit=1&offset=0 returns the fixed envelope: meta.api_request_id present, response_type array, total_count == 2, has_more == true; offset 1 flips has_more to false."
        test_recipe:
          setup: ["Two reits exist"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "P1", ticker: "PG01", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "P2", ticker: "PG02", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
          trigger:
            - call: "GET /reit-compliance/reits"
              payload: { limit: 1, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "response_type == \"array\" and data has exactly 1 element"
            - "total_count == 2 and has_more == true"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: filtered_list_income_items_by_quarter
        claim_type: filtering
        grounds: [endpoints.GET_/reit-compliance/income-items]
        distinguishing_aspect: "GET /income-items?quarter_id=Q returns only that quarter's items (FK reverse reachability filter)."
        test_recipe:
          setup: ["Reit R1 with quarters Q1 and Q2; one income item in each"]
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "FLT REIT", ticker: "FLTR", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q2", period_start: "2026-04-01", period_end: "2026-06-30" }
              as: ComplianceOfficer
              captures: { q2_id: $.data.id }
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "RENTS", amount_cents: 100, source_is_trs: false, accrued_at: "2026-01-10" }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q2_id}", income_class: "RENTS", amount_cents: 200, source_is_trs: false, accrued_at: "2026-04-10" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /reit-compliance/income-items"
              payload: { quarter_id: "${q1_id}" }
              as: ComplianceOfficer
          assert:
            - "response contains exactly 1 item and its amount_cents == 100"
            - "total_count == 1"

      - name: error_envelope_shape_on_failure
        claim_type: response_envelope
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type \"error\" and data.error_id/data.message keys per the fixed envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /reit-compliance/quarters/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: BoardDirector
              captures: { err: $.data.error_id }
          assert:
            - "response_type == \"error\" and data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"

