      - name: hub_selector_filters_then_ranks_by_free_slots_then_breaks_ties_on_window_start
        claim_type: correct_result
        grounds:
          - calculations.hub_selector.formula
          - calculations.hub_selector.input_set
          - state_machines.PickupHub.OPEN_to_CLOSED
        distinguishing_aspect: >
          Four hubs are shaped so that every stage of the selector is falsifiable: HC is filtered out
          because its staffed window starts after handoff_start_at even though it has the most free
          slots left; HD is never chosen despite having the earliest staffed window, because free-slot
          count DESC is the primary key; HA beats HB on the secondary key (earlier hub_window_start_at)
          when both have 5 free slots; and after HA takes one order the ranking flips to HB, then ties
          again at 4 free slots each and returns to HA. Orders of the same production window never
          conflict, so no ERR_HUB_SLOT_CONFLICT appears anywhere.
        test_recipe:
          setup:
            - "Identical to the setup_api_calls of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections through POST /production-windows: cook ${cook_id} ACTIVE, MenuItem ${mi_id} at 400 cents (no refrigeration), window ${w_id} with handoff 2026-08-08T16:00:00Z..18:00:00Z and capacity_meals 20, StatePolicy ${sp_id}. Clock 2026-08-01T00:00:00Z."
            - "A HUB_PICKUP zone with four hubs: HA (5 slots, 15:00-19:00), HB (5 slots, 15:30-19:00), HC (5 slots, 16:30-19:00), HD (1 slot, 14:00-20:00), all on 2026-08-08."
