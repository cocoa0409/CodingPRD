      - name: cancellation_cascade_touches_only_the_non_terminal_children
        claim_type: conditional_cascade
        grounds:
          - state_machines.Project.fulfillment_status.SCHEDULED_to_CANCELLED
          - state_machines.ChangeOrder.DRAFT_to_SUPERSEDED
          - state_machines.MaterialDelivery.DELIVERED_to_RETURNED
          - state_machines.InstallerAssignment.HELD_to_RELEASED
          - endpoints[POST /projects/{id}/cancel]
          - entities.ChangeOrder.fields.decided_at
          - entities.InstallerAssignment.fields.release_reason
          - calculations.cancellation_settlement
        distinguishing_aspect: "The cascade rewrites the DRAFT change order to SUPERSEDED, the DELIVERED delivery to RETURNED and the HELD assignment to RELEASED, but the already-DECLINED change order is terminal and keeps both its status and its decided_at — a conditional cascade, not a blanket one."
        test_recipe:
          setup:
            - "FLOOR-DIRECT / METRO-02 project of 420.00 units with its 51306 deposit paid, so financial_status is DEPOSIT_HELD."
            - "Change order CO1 is created, submitted and DECLINED by the customer, which returns the project to MEASURED and leaves it terminal at DECLINED."
            - "The material delivery is walked PLANNED -> IN_TRANSIT -> DELIVERED on a past promised window, change order CO2 is left in DRAFT, and one 480-minute assignment is HELD, so the project sits at SCHEDULED."
            - "The clock is never moved, so the cancellation happens 0 hours after creation and waiver tier T2 COOLING_OFF matches first (the acting role is ProjectCoordinator, so T1 RETAILER_FAULT does not)."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 51306 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pv1: $.data.version }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CUSTOMER_REQUEST", lines: [{ unit_kind: "PRIMARY_UNITS", units_delta: 10.00 }], expected_project_version: "${pv1}" }
              as: ProjectCoordinator
              captures: { co1_id: $.data.id }
            - call: "POST /change-orders/${co1_id}/submit"
              payload: {}
              as: ProjectCoordinator
            - call: "POST /change-orders/${co1_id}/decide"
              payload: { decision: "DECLINE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { co1_status: $.data.status, co1_decided: $.data.decided_at }
            - call: "POST /projects/${proj_id}/material-deliveries"
              payload: { promised_window_start: "2026-07-20T08:00:00.000Z", promised_window_end: "2026-07-22T08:00:00.000Z", sku_count: 14, material_cost_cents: 250000 }
              as: ProjectCoordinator
              captures: { del_id: $.data.id }
            - call: "POST /material-deliveries/${del_id}/status"
              payload: { new_status: "IN_TRANSIT" }
              as: ProjectCoordinator
            - call: "POST /material-deliveries/${del_id}/status"
              payload: { new_status: "DELIVERED", actual_delivered_at: "2026-07-22T08:00:00.000Z" }
              as: ProjectCoordinator
              captures: { del_status: $.data.status, del_delay: $.data.delay_days }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectCoordinator
              captures: { pv2: $.data.version }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CUSTOMER_REQUEST", lines: [{ unit_kind: "PRIMARY_UNITS", units_delta: 10.00 }], expected_project_version: "${pv2}" }
              as: ProjectCoordinator
              captures: { co2_id: $.data.id, co2_upcharge: $.data.upcharge_cents }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectCoordinator
              captures: { pv3: $.data.version }
            - call: "POST /installer-assignments"
              payload: { project_id: "${proj_id}", installer_id: "${inst_id}", window_start: "2026-08-25T08:00:00.000Z", window_end: "2026-08-25T16:00:00.000Z", expected_project_version: "${pv3}" }
              as: ProjectCoordinator
              captures: { asg_id: $.data.id, fs_before: $.data.status }
          trigger:
            - call: "POST /projects/${proj_id}/cancel"
              payload: { cancel_reason: "Customer moved out of the service area" }
              as: ProjectCoordinator
              captures: { fs_after: $.data.fulfillment_status, fin_after: $.data.financial_status }
          assert:
            - "${co1_status} == 'DECLINED' AND ${del_status} == 'DELIVERED' AND ${del_delay} == 0 AND ${co2_upcharge} == 4505 AND ${fs_before} == 'HELD'"
            - "${fs_after} == 'CANCELLED' AND Project.${proj_id}.cancelled_at == '2026-08-01T00:00:00.000Z' AND cancel_reason == 'Customer moved out of the service area'"
            - "ChangeOrder.${co1_id}.status == 'DECLINED' AND decided_at == ${co1_decided} — the terminal child is untouched by the cascade"
            - "ChangeOrder.${co2_id}.status == 'SUPERSEDED' AND upcharge_cents == 4505 — the DRAFT child is swept, and its money never entered Project.change_order_upcharge_cents"
            - "Project.${proj_id}.change_order_upcharge_cents == 0"
            - "MaterialDelivery.${del_id}.status == 'RETURNED'"
            - "InstallerAssignment.${asg_id}.status == 'RELEASED' AND release_reason == 'PROJECT_CANCELLED' AND Installer.${inst_id}.committed_minutes == 0"
            - "${fin_after} == 'REFUNDED' AND Project.${proj_id}.deposit_refunded_cents == 51306 AND deposit_forfeited_cents == 0 AND deposit_held_cents == 0 — tier T2 COOLING_OFF matched first and waived the SCHEDULED 25% forfeit and the 12% restocking fee"
            - "Project.${proj_id}.deposit_paid_cents == 51306 == deposit_held_cents + deposit_applied_cents + deposit_refunded_cents + deposit_forfeited_cents"

      - name: project_dimensions_move_independently_of_one_another
        claim_type: parallel
        grounds:
          - state_machines.Project.fulfillment_status
          - state_machines.Project.permit_status
          - state_machines.Project.financial_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The three Project dimensions are asserted as an ordered triple after each hop, so a permit-only hop must leave fulfillment_status and financial_status byte-identical."
        excluded_because:
          difficulty_instance: "non_linear_state_machine / project_permit_dimension_cycles_while_fulfillment_and_financial_hold_still"
          rationale: "That difficulty instance already drives the permit dimension through PENDING_APPLICATION -> APPLIED -> REJECTED -> PENDING_APPLICATION -> ISSUED -> INSPECTION_SCHEDULED -> INSPECTION_FAILED -> CLOSED while asserting the full (fulfillment, permit, financial) triple after every single hop. A separate §1.9 instance would replay the same triple with fewer hops and add no coverage."

      - name: change_order_revision_loop_reprices_each_resubmission
        claim_type: cyclic
        grounds:
          - state_machines.ChangeOrder.PENDING_CUSTOMER_to_REVISION_REQUESTED
          - state_machines.ChangeOrder.REVISION_REQUESTED_to_PENDING_CUSTOMER
          - entities.ChangeOrder.fields.revision_count
          - calculations.change_order_upcharge
        distinguishing_aspect: "Each REVISION_REQUESTED -> PENDING_CUSTOMER resubmission must replace the lines array, re-run the LINE_ITEMIZED variant and increment revision_count, with no cap on the number of loops."
        excluded_because:
          difficulty_instance: "non_linear_state_machine / change_order_revision_cycle_repriced_twice_before_acceptance"
          rationale: "That instance already walks the loop twice with three different line arrays, pinning upcharge_cents after each resubmission and revision_count at 1 then 2 before the ACCEPT. Re-testing the cycle here would duplicate its call sequence exactly."

      - name: final_labor_write_syncs_the_project_money_ledger
        claim_type: ledger_sync
        grounds:
          - endpoints[POST /installer-assignments/{id}/complete]
          - calculations.project_labor_charge
          - calculations.project_total_due
          - entities.Project.fields.final_labor_cents
          - entities.Project.fields.deposit_applied_cents
        distinguishing_aspect: "Writing final_labor_cents on the assignment must, in the same request, refresh the parent Project's total_due_cents, deposit_applied_cents and balance_due_cents so the before/after ledger reconciles."
        excluded_because:
          difficulty_instance: "dual_variant_calc / project_labor_charge_provisional_versus_final_diverge_on_same_project"
          rationale: "That instance completes the assignment on a measured project and asserts quoted_labor_cents 196673 frozen alongside final_labor_cents 253942, total_due_cents, the deposit waterfall and balance_due_cents in the same response — the ledger-sync claim in full."

      - name: reinstating_a_cancelled_project_reverses_the_settlement
        claim_type: compensation
        grounds:
          - state_machines.Project.fulfillment_status.CANCELLED_to_MEASURED
          - endpoints[POST /projects/{id}/reinstate]
          - calculations.cancellation_settlement
          - entities.Project.fields.deposit_forfeited_cents
        distinguishing_aspect: "Reinstatement must return every forfeited and refunded cent to deposit_held_cents so the four-bucket total still equals deposit_paid_cents with zero drift."
        excluded_because:
          difficulty_instance: "compensating_invariant / deposit_four_bucket_total_is_conserved_through_cancel_and_reinstate"
          rationale: "That instance asserts all four buckets plus the conservation identity before the cancel, after the cancel and after the reinstate, which is strictly more than a single compensation replay would check."

      - name: assignment_creation_is_guarded_by_another_entitys_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.Project.fulfillment_status.MEASURED_to_SCHEDULED
          - validations[priority=20]
          - errors.ERR_MEASUREMENT_STALE
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "MEASURED -> SCHEDULED is legal only while a different entity (the latest COMPLETED Measurement) is still inside its validity window, so the guard lives outside the Project row being written."
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / assignment_creation_depends_on_the_measurement_validity_of_another_entity"
          rationale: "That instance already books the assignment at the last valid instant and one day past it, asserting the success and the ERR_MEASUREMENT_STALE rejection from the same fixture — the guarded-transition claim end to end."

  # ==========================================================================
  # SECTION — calculations  (claim-extraction-guide Table 3)
  # ==========================================================================
  - section: calculations
    instances:

      - name: program_minimum_and_billable_units_floor_both_bind_the_quote
        claim_type: constants_applied
        grounds:
          - calculations.project_labor_charge
          - entities.ServiceCategory.fields.minimum_billable_units
          - entities.Project.fields.quoted_labor_cents
          - entities.Project.fields.deposit_required_cents
          - endpoints[POST /projects]
        distinguishing_aspect: "A 20.00-unit project on a category with minimum_billable_units 100.00 and rate 50 is billed on 100 units (5000 cents), and MIN_LABOR_CHARGE_CENTS then raises the quote to exactly 15000 — two different constants binding in sequence, with the deposit taken on the raised figure (4500, not 1500)."
        test_recipe:
          setup:
            - "Category SMALL-FIX: base_labor_rate_cents_per_unit 50, minimum_billable_units 100.00, measurement_required false, permit_policy NEVER, deposit_pct 0.30."
            - "Jurisdiction METRO-02 with labor_complexity_multiplier 1.00, so STEP 5 is a no-op and the floor is observable on its own."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "SMALL-FIX", name: "Small Repair Install", trade_code: "MILLWORK", unit_of_measure: "EACH", base_labor_rate_cents_per_unit: 50, minimum_billable_units: 100.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "3 Alder Court", estimated_units: 20.00, requested_install_date: "2026-08-20T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, quoted: $.data.quoted_labor_cents, dep: $.data.deposit_required_cents }
          assert:
            - "${quoted} == 15000 — billable_units is max(20.00, 100.00) = 100.00, base_cents is 5000, and STEP 6 raises it to MIN_LABOR_CHARGE_CENTS"
            - "${dep} == 4500 — round_half_up(15000 * 0.30), taken on the floored quote"
            - "Project.${proj_id}.effective_units == 20.00 — the floor is a pricing device only and never rewrites the units"
            - "Project.${proj_id}.fulfillment_status == 'MEASURED' AND permit_status == 'NOT_REQUIRED' AND financial_status == 'QUOTED'"

      - name: tier_ladder_boundaries_at_two_hundred_and_five_hundred_billable_units
        claim_type: tiered_pricing
        grounds:
          - calculations.project_labor_charge
          - entities.Project.fields.quoted_labor_cents
          - endpoints[POST /projects]
        distinguishing_aspect: "The ladder is marginal, not average: 200.00 units cost 85000 and 201.00 units cost 85391 (one unit at the rounded band-B rate 391, not at 425), while 500.00 units cost 202300 and 501.00 units cost 202661 (one unit at the rounded band-C rate 361)."
        test_recipe:
          setup:
            - "Category FLOOR-DIRECT: rate 425, minimum_billable_units 150.00, measurement_required false, permit_policy NEVER, deposit_pct 0.30."
            - "Jurisdiction METRO-02 with multiplier 1.00 so the band arithmetic is visible unscaled."
            - "Four projects for the same customer, differing only in estimated_units: 200.00, 201.00, 500.00, 501.00."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "1 Band Way", estimated_units: 200.00, requested_install_date: "2026-08-20T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { q200: $.data.quoted_labor_cents, d200: $.data.deposit_required_cents }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "2 Band Way", estimated_units: 201.00, requested_install_date: "2026-08-20T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { q201: $.data.quoted_labor_cents, d201: $.data.deposit_required_cents }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "3 Band Way", estimated_units: 500.00, requested_install_date: "2026-08-20T13:00:00.000Z" }
