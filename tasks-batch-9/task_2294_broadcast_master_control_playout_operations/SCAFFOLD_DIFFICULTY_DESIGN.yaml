              as: TrafficCoordinator
              as_user_id: "traffic-1"
              captures: { pl2_id: "$.data.id", pl2_v1: "$.data.version", pl2_var_before: "$.data.projected_end_variance_seconds" }
          trigger:
            - call: "POST /spot-orders/${ord_id}/makegoods"
              payload: { target_playlist_id: "${pl2_id}", expected_playlist_version: "${pl2_v1}", sequence_number: 2, scheduled_start_utc: "2026-08-02T13:29:30Z", scheduled_duration_seconds: 30 }
              as: TrafficCoordinator
              as_user_id: "traffic-1"
          assert:
            - "HTTP 201 and the created PlaylistItem has is_makegood == true, element_kind == COMMERCIAL, playout_status == SCHEDULED, spot_order_id == ${ord_id} and replaces_item_id == ${spot2_item_id}"
            - "Observation point 1 (before the SKIP): ${sched_before} == 3, ${credited_before} == 0, ${credit_before} == 0, ${ord_unplaced_0} == 3 at order creation and 0 once P1 linked all three spots, and INVARIANT_SPOTS reads 3 == 3 + 0 + 0 + 0 + 0"
            - "Observation point 2 (after the SKIP): ${sched_mid} == 2, ${credited_mid} == 1, ${credit_mid} == 333, ${status_mid} == PARTIALLY_CREDITED, and INVARIANT_SPOTS reads 3 == 2 + 0 + 0 + 1 + 0"
            - "The accrued figure is round_half_up(1000/3) == round_half_up(333.333...) == 333, not floor-to-333-then-333-then-334 and not 334"
            - "Observation point 3 (after the makegood): SpotOrder.${ord_id}.scheduled_spots == 3, aired_spots == 0, short_aired_spots == 0, credited_spots == 0, unplaced_spots == 0, so INVARIANT_SPOTS reads 3 == 3 + 0 + 0 + 0 + 0"
            - "SpotOrder.${ord_id}.credit_accrued_cents == 0 EXACTLY — the same rounded 333 that was added is subtracted, so neither +1 nor -1 of rounding drift survives the round trip even though 1000 is not divisible by 3"
            - "SpotOrder.${ord_id}.status == OPEN (the backward move out of PARTIALLY_CREDITED)"
            - "PlaylistItem.${spot2_item_id}.playout_status is still SKIPPED, but because it is superseded (its id is the makegood's replaces_item_id) it no longer contributes to credited_spots; counting it would make INVARIANT_SPOTS read 3 == 3 + 0 + 0 + 1 + 0, which the compensating-action form of calculations.spot_inventory_conservation forbids"
            - "${pl2_var_before} == -30 and Playlist.${pl2_id}.projected_end_variance_seconds == 0 after the placement (1770 + 30 == 1800), so the seconds ledger of the target playlist is restored by the same call"
            - "GET /playlists/${pl1_id}/reconciliation?basis=PRELIMINARY returns credit 0 at observation point 1, 333 at observation point 2, and 0 at observation point 3"
            - "Playlist.${pl2_id}.version > ${pl2_v1} (the makegood is an OCC-guarded write against the target playlist)"

      - name: off_air_round_trip_restores_every_kbps_with_no_drift_and_clamps_the_pool_at_zero
        grounds:
          - calculations.multiplex_capacity_conservation
          - calculations.multiplex_bitrate_allocation
          - state_machines.Transmitter.FULL_POWER_to_OFF_AIR
          - state_machines.Transmitter.OFF_AIR_to_FULL_POWER
          - entities.Multiplex.fields.available_kbps
          - entities.Multiplex.fields.starved_channel_count
        distinguishing_aspect: |
          Conserved quantity == transport-stream BANDWIDTH in kbps (available_kbps
          + assigned_kbps == effective_capacity_kbps), a different ledger and a
          different unit from the spot-count/cents ledger. The forward action
          (OFF_AIR) drives the pool to the clamped value max(0, floor(20000*0.00)
          - 500) == 0 rather than to -500, starves all three channels to 0 kbps and
          still satisfies 0 + 0 == 0; the compensating action (restore to
          FULL_POWER) must reproduce the pre-outage allocation EXACTLY —
          4236 / 6353 / 8911 including the two leftover kbps that the 1-kbps sweep
          hands to priority_rank 1 and 2 — because STARVED channels re-enter the
          waterfall from their unchanged floor and request, so no kbps is lost or
          invented across a round trip through a totally dark pool.
        test_recipe:
          setup:
            - "Transmitter FAC-1 (authorized_erp_kw 50) at FULL_POWER, derate_factor 1.00, carrying MUX-A with total_capacity_kbps 20000 and pilot_reserved_kbps 500, so effective_capacity_kbps == 19500."
            - "Three channels on MUX-A: 12.1 (PRIMARY, priority_rank 1, floor 2000, requested 6000), 12.2 (SUBCHANNEL of 12.1, priority_rank 2, floor 3000, requested 9000), 12.3 (SUBCHANNEL of 12.1, priority_rank 3, floor 5000, requested 12000). Floors sum to 10000, remainder 9500, weights 4000 / 6000 / 7000, total_weight 17000."
            - "Baseline allocation: shares floor(9500*4000/17000) == 2235, floor(9500*6000/17000) == 3352, floor(9500*7000/17000) == 3911; sum of floors plus shares == 19498, so the 1-kbps sweep in priority_rank ASC order gives one kbps each to 12.1 and 12.2, yielding 4236 / 6353 / 8911."
            - "No playlist, spot order or fault exists, so the power changes have no item, credit or posture side effects to confuse the bandwidth ledger."
            - "The clock is set to 2026-08-01T12:00:00Z; the transmitter is then taken OFF_AIR (reason given), and the clock is advanced to 2026-08-01T12:10:00Z, i.e. 600 s of outage, which is strictly below OUTAGE_NOTIFY_AFTER_SECONDS 1800, so no OUTAGE notification exists at trigger time."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Eve Engineer", role_class: "ENGINEER", override_authority: "NONE", certification_expires_utc: "2027-01-01T00:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /transmitters"
              payload: { facility_id: "FAC-1", call_sign: "WXYZ", authorized_erp_kw: 50 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /multiplexes"
              payload: { transmitter_id: "${tx_id}", name: "MUX-A", total_capacity_kbps: 20000, pilot_reserved_kbps: 500, live_encoder_units_total: 2 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_id: "$.data.id", mux_v1: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v1}", call_sign: "WXYZ-DT1", channel_number: "12.1", service_class: "PRIMARY", resolution_class: "SD_480I", requested_bitrate_kbps: 6000, floor_bitrate_kbps: 2000, priority_rank: 1 }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch1_id: "$.data.id" }
            - call: "GET /multiplexes/${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_v2: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v2}", call_sign: "WXYZ-DT2", channel_number: "12.2", service_class: "SUBCHANNEL", resolution_class: "SD_480I", requested_bitrate_kbps: 9000, floor_bitrate_kbps: 3000, priority_rank: 2, parent_channel_id: "${ch1_id}" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch2_id: "$.data.id" }
            - call: "GET /multiplexes/${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { mux_v3: "$.data.version" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux_id}", expected_multiplex_version: "${mux_v3}", call_sign: "WXYZ-DT3", channel_number: "12.3", service_class: "SUBCHANNEL", resolution_class: "HD_720P", requested_bitrate_kbps: 12000, floor_bitrate_kbps: 5000, priority_rank: 3, parent_channel_id: "${ch1_id}" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch3_id: "$.data.id" }
            - call: "GET /multiplexes/${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { eff_p1: "$.data.effective_capacity_kbps", assigned_p1: "$.data.assigned_kbps", available_p1: "$.data.available_kbps", starved_p1: "$.data.starved_channel_count" }
            - call: "GET /channels?multiplex_id=${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch1_p1: "$.data[0].allocated_bitrate_kbps", ch2_p1: "$.data[1].allocated_bitrate_kbps", ch3_p1: "$.data[2].allocated_bitrate_kbps" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
            - call: "POST /transmitters/${tx_id}/power-state"
              payload: { target_state: "OFF_AIR", reason: "emergency generator transfer at the site" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
            - call: "GET /multiplexes/${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { eff_p2: "$.data.effective_capacity_kbps", assigned_p2: "$.data.assigned_kbps", available_p2: "$.data.available_kbps", starved_p2: "$.data.starved_channel_count" }
            - call: "GET /channels?multiplex_id=${mux_id}"
              payload: {}
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
              captures: { ch1_p2: "$.data[0].allocated_bitrate_kbps", ch2_p2: "$.data[1].allocated_bitrate_kbps", ch3_p2: "$.data[2].allocated_bitrate_kbps" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:10:00Z" }
              as: StationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /transmitters/${tx_id}/power-state"
              payload: { target_state: "FULL_POWER", reason: "site power restored" }
              as: BroadcastEngineer
              as_user_id: "${eng_id}"
          assert:
            - "HTTP 200 and Transmitter.${tx_id}.operational_state == FULL_POWER with current_power_pct == 100 and derate_factor == 1.00"
            - "Observation point 1 (pre-outage): ${eff_p1} == 19500, ${ch1_p1} == 4236, ${ch2_p1} == 6353, ${ch3_p1} == 8911, ${assigned_p1} == 19500, ${available_p1} == 0, ${starved_p1} == 0, and INVARIANT_KBPS reads 0 + 19500 == 19500"
            - "Observation point 2 (OFF_AIR): ${eff_p2} == 0 — the clamp max(0, floor(20000*0.00) - 500) turns -500 into 0, and a negative pool would break the ledger outright"
            - "Observation point 2 detail: ${ch1_p2} == 0, ${ch2_p2} == 0, ${ch3_p2} == 0, ${assigned_p2} == 0, ${available_p2} == 0, ${starved_p2} == 3, and INVARIANT_KBPS reads 0 + 0 == 0"
            - "Observation point 3 (after the restore): Channel.${ch1_id}.allocated_bitrate_kbps == 4236, Channel.${ch2_id}.allocated_bitrate_kbps == 6353, Channel.${ch3_id}.allocated_bitrate_kbps == 8911 — byte-for-byte the pre-outage figures, including the two swept kbps on ranks 1 and 2"
            - "Multiplex.${mux_id}.effective_capacity_kbps == 19500, assigned_kbps == 19500, available_kbps == 0, starved_channel_count == 0, so INVARIANT_KBPS reads 0 + 19500 == 19500 again"
            - "All three channels are back to allocation_state == ACTIVE, proving STARVED channels re-enter the waterfall rather than being dropped from it"
            - "The unconserved neighbour ledger moves in the same round trip: Transmitter.${tx_id}.last_outage_seconds == 600, cumulative_outage_seconds == 600, outage_started_utc == null"
            - "600 < OUTAGE_NOTIFY_AFTER_SECONDS 1800, so GET /transmitters/${tx_id}/notifications contains NO row with kind == OUTAGE, exactly one row with kind == RESUMPTION (status PENDING, due_utc 2026-08-02T12:10:00Z), and Transmitter.${tx_id}.notification_pending_count == 1"
