            - { call: "GET /submissions/${s2}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { s2st: $.data.status } }
            - { call: "GET /submissions/${s1}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { s1st: $.data.status } }
          assert:
            - "${o1st} == ACCEPTED"
            - "${o2st} == SUPERSEDED   # link 1: accept caused the supersession"
            - "${s2st} == PASSED       # link 2: caused by O2's supersession via the Submission machine cascade"
            - "${s1st} == OFFER_EXTENDED   # winner's submission is NOT passed; it waits for deal execute"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: clear_audit_open_state_beats_fiscal_variance
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - state_machines.RoyaltyStatement.AUDIT_RESOLVED_to_CLEARED
        distinguishing_aspect: |
          Category pair state (p6) vs business_fiscal (p17): clearing an
          AUDIT_OPEN statement violates BOTH the state rule (clear is only
          defined from RECONCILED or AUDIT_RESOLVED) AND the fiscal rule
          (variance 2000 > 500 would fail ERR_VARIANCE_UNRESOLVED); the state
          error ERR_INVALID_STATE must win because p6 < p17.
        test_recipe:
          setup:
            - "Executed deal (advance 2000000, pcts 0.10/0.08/0.25, no override) at period 0"
            - "Statement period 0, units 6000/8000/10000, receipts 6000000/3200000/1000000, publisher_reported 1138000; reconciled (variance 2000) then audit opened (AUDIT_OPEN)"
