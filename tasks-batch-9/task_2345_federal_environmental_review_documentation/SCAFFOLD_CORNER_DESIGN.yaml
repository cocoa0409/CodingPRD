      - name: corner_cumulative_effect_score_filters_by_area_radius_and_status
        claim_type: input_set_filtering
        grounds: [calculations.cumulative_effect_score, calculations.cumulative_action_inclusion]
        distinguishing_aspect: "Only INCLUDED CumulativeAction rows of the SAME resource_area feed the score: a BIOLOGICAL entry 60.0 km away is EXCLUDED by cumulative_radius_km 25.0 and a CULTURAL entry 5.0 km away belongs to another area, so both are absent from the 60.04 result and from the crowding divisor."
        test_recipe:
          setup:
            - "The ERO-1 Ridgeline action is at review_stage ANALYSIS with statement ADOPTED and scoping CLOSED."
            - "Four BIOLOGICAL cumulative entries lie within 25.0 km, one BIOLOGICAL entry lies at 60.0 km, and one CULTURAL entry lies at 5.0 km."
          setup_api_calls:
            - *k_office
            - *k_action
            - *k_screen1
            - *k_adj_cleared
            - *k_classify
            - *k_pn1
            - *k_scope1
            - *k_get_act_v
            - *k_adopt
            - *k_close_scope
            - &k_cum1
              call: "POST /proposed-actions/${act_id}/cumulative-actions"
              payload: { resource_area: "BIOLOGICAL", label: "Legacy grazing allotment", intensity_contribution: 20.0, footprint_hectares: 100.0, distance_km: 10.0, temporal_scope: "PAST" }
              as: ResourceSpecialist
