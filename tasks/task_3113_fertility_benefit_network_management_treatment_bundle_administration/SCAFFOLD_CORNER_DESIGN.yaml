  # ===========================================================================
  - section: errors
    instances:

      - name: medication_dispense_against_unapproved_authorization_returns_invalid_state
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_STATE]
          - state_machines.MedicationOrder.PRESCRIBED_to_DISPENSING
          - errors[ERR_PHARMACY_POOL_EXHAUSTED]
        distinguishing_aspect: "The dispense gate reads the authorization's review_status, so a specialty order against a still-SUBMITTED authorization is refused with 409 ERR_INVALID_STATE — and the refusal leaves the pool untouched even though the pool has ample cents, so ERR_PHARMACY_POOL_EXHAUSTED is emphatically not the error returned."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through a SUBMITTED (undecided) authorization, plus a specialty medication order against it."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - call: "GET /bundle-entitlements/${bb}"
              payload: {}
              as: SpecialtyPharmacist
              captures: { bb_v2: $.data.version }
            - call: "POST /medication-orders"
              payload: { member_id: "${bm}", preauthorization_id: "${bax}", medication_code: "CETROTIDE-250", specialty_drug: true, quantity: 7, days_supply: 7, acquisition_cost_cents: 300000, dispensing_pharmacy: "SP-BASE" }
              as: SpecialtyPharmacist
              captures: { bmo: $.data.id }
          trigger:
            - call: "POST /medication-orders/${bmo}/dispense"
              payload: { expected_bundle_entitlement_version: "${bb_v2}" }
              as: SpecialtyPharmacist
              captures: { err: $.data.error_id }
          assert:
            - "Preauthorization.${bax}.review_status == SUBMITTED"
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "err != ERR_PHARMACY_POOL_EXHAUSTED — the pool still holds 1000000 cents"
            - "MedicationOrder.${bmo}.pharmacy_status == PRESCRIBED and MedicationOrder.${bmo}.plan_paid_cents == 0"
            - "MedicationOrder.${bmo}.dispensed_on is null"
            - "BundleEntitlement.${bb}.pharmacy_remaining_cents == 1000000 and pharmacy_consumed_cents == 0"

      - name: surrogacy_route_conflict_on_disagreeing_overlapping_carrier_kind
        claim_type: Violation → Error
        grounds:
          - errors[ERR_SURRENDER_ROUTE_CONFLICT]
          - validations[priority=11]
          - entities.SurrenderRoute.fields.carrier_kind
        distinguishing_aspect: "A GESTATIONAL_CARRIER route that overlaps an existing CUSTODIAN route on the same member disagrees on carrier kind and is refused with 409 ERR_SURRENDER_ROUTE_CONFLICT, whereas an identical-carrier route on a disjoint interval is admitted — so the conflict is about kind disagreement, not about occupancy alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through member intake, then a CUSTODIAN PRESERVATION route occupying [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_member_v
            - call: "POST /members/${bm}/surrender-routes"
              payload: { pathway_type: "PRESERVATION", carrier_kind: "CUSTODIAN", route_from: "2026-09-01T00:00:00Z", route_to: "2026-10-01T00:00:00Z", expected_member_version: "${bmv}" }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { sr_ok: $.data.id }
            - call: "GET /members/${bm}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { bmv2: $.data.version }
          trigger:
            - call: "POST /members/${bm}/surrender-routes"
              payload: { pathway_type: "SURROGACY", carrier_kind: "GESTATIONAL_CARRIER", route_from: "2026-09-15T00:00:00Z", route_to: "2026-11-15T00:00:00Z", expected_member_version: "${bmv2}" }
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { err: $.data.error_id }
          assert:
            - "the overlapping route returns 409 and err == ERR_SURRENDER_ROUTE_CONFLICT"
            - "SurrenderRoute.${sr_ok}.route_status == SUBMITTED and SurrenderRoute.${sr_ok}.carrier_kind == CUSTODIAN"
            - "GET /surrender-routes?member_id=${bm} returns exactly 1 row after the refusal"
            - "a GESTATIONAL_CARRIER route on a DISJOINT interval starting 2026-11-15 is admitted and reads route_status SUBMITTED"
            - "Member.${bm}.version == ${bmv2} after the refused call"

      - name: reversal_window_closed_and_amendment_window_closed_are_distinct_errors
