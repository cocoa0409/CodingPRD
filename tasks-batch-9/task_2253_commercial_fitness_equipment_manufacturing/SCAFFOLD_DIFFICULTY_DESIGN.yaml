        as: ProductEngineer
        captures: {g1: $.data.id}
      - call: POST /test-runs
        payload: {model_revision_id: '${ra}', test_rig_id: '${g1}', window_start: '2026-08-02T00:00:00Z', window_end: '2026-08-06T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {xa1: $.data.id}
      - call: POST /test-runs/${xa1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${xa1}/complete
        payload: {outcome: PASSED, achieved_cycles: 180000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${ra}', test_rig_id: '${g1}', window_start: '2026-08-06T00:00:00Z', window_end: '2026-08-10T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {xa2: $.data.id}
      - call: POST /test-runs/${xa2}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${xa2}/complete
        payload: {outcome: PASSED, achieved_cycles: 240000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${ra}', test_rig_id: '${g1}', window_start: '2026-08-10T00:00:00Z', window_end: '2026-08-14T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {xa3: $.data.id}
      - call: POST /test-runs/${xa3}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${xa3}/complete
        payload: {outcome: FAILED, failure_cycle_count: 140000}
        as: ProductEngineer
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
        captures: {m1_v2: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-RB, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v2}'}
        as: ProductEngineer
        captures: {rb: $.data.id}
      - call: POST /model-revisions/${rb}/submit-for-testing
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${rb}', test_rig_id: '${g1}', window_start: '2026-08-14T00:00:00Z', window_end: '2026-08-18T12:00:00Z', target_cycles: 300000}
        as: ProductEngineer
        captures: {xb1: $.data.id}
      - call: POST /test-runs/${xb1}/start
        payload: {}
        as: ProductEngineer
      - call: POST /test-runs/${xb1}/complete
        payload: {outcome: PASSED, achieved_cycles: 100000}
        as: ProductEngineer
      - call: POST /test-runs
        payload: {model_revision_id: '${rb}', test_rig_id: '${g1}', window_start: '2026-08-18T00:00:00Z', window_end: '2026-08-22T12:00:00Z', target_cycles: 300000}
