          assert:
            - "${posture_empty} == STAFFED_READY"
            - "${seats_open_empty} == 4"
            - "${posture_seated} == MOUNT_SHORT"
            - "${seats_open_seated} == 3"
            - "${required_seated} == 1"
            - "${posture_mounted} == UNDERSTAFFED"
            - "${mounts_mounted} == 1"
            - "${posture_staffed} == STAFFED_READY"
            - "${guides_staffed} == 1"
            - "${posture_extra} == STAFFED_READY"
            - "${guides_extra} == 2"
            - "the posture is a pure function of the counters: it is re-derived on every seat, mount and guide change and holds still once STAFFED_READY is reached"

      - name: per_member_rounding_before_summation
        claim_type: precision
        excluded_because:
          difficulty_instance: package_total_rounds_each_member_line_before_summing
          rationale: "The difficulty design already pins the rounding boundary with a 2A+1C CLASSIC line that rounds each member's discounted nightly total half-up before summing; repeating a precision instance here would duplicate the same three literals."

      - name: adjacent_cabin_intervals_do_not_conflict
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: cabin_stay_intervals_are_half_open_so_adjacency_is_legal
          rationale: "The half-open interval boundary — same-day departure and arrival allowed, one-night overlap refused — is the difficulty instance's whole subject, including the ERR_CABIN_DOUBLE_BOOKED negative arm."

      - name: provisional_versus_final_package_total
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: package_total_provisional_at_hold_vs_final_at_early_checkout
          rationale: "That instance already tests both package_charge_total variants on identical data and asserts the delta on the early-checkout switch, which is exactly the divergence claim for this calculation's variants block."

