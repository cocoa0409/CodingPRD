# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2859_dam_safety_inspection_emergency_action_planning
#
# Nine rule_id blocks x 2 instances = 18 instances. Every instance grounds only in
# elements already declared in SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls chain
# starts from an empty database and uses only §1.5 endpoints; every numeric assert is
# a literal computed from the §1.3 formulas and their pinned constants.
#
# Shared bootstrap used by most instances (clock, owner, engineer, reach, dam):
#   POST /_clock/set_current_utc  -> logical clock 2026-08-01T00:00:00Z
#   POST /owners                  -> Cascade Hydro LLC (bond 50,000,000 cents)
#   POST /engineers               -> Dana Reyes, PE-44120, certified LOW/SIGNIFICANT/HIGH
#   POST /river-reaches           -> Little Bear Creek Reach 3, 1200 cfs
#   POST /dams                    -> Elk Hollow Dam, crest 1042.5 ft, gross 1500 acre-ft,
#                                    registered_at 2019-04-15T00:00:00Z (UNCLASSIFIED / UNRATED)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: screening_vs_certified_consequence_score_diverges_and_reclassifies_dam
        grounds:
          - calculations.breach_consequence_score
          - calculations.hazard_classification
          - calculations.inspection_due_schedule
          - entities.ConsequenceAssessment.fields.screening_score
          - entities.ConsequenceAssessment.fields.certified_score
          - state_machines.ConsequenceAssessment.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          Risk scoring on the ConsequenceAssessment entity domain: the screening variant forces the
          travel-time multiplier to 1.0 and drops the economic component, so the same stored row
          yields screening_score 30.00 / SIGNIFICANT at intake and certified_score 45.00 / HIGH at
          certification - a 15.00-point divergence that changes the dam's statutory hazard class.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One owner, one engineer certified for LOW/SIGNIFICANT/HIGH, one reach, one dam registered 2019-04-15 with no accepted inspections (hazard_class UNCLASSIFIED)."
            - "One DRAFT consequence assessment pinned at population_at_risk 12, habitable_structures 4, critical_facilities 0, breach_travel_time_minutes 20 (fast wave), inundation_area_acres 300."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 12, habitable_structures: 4, critical_facilities: 0, breach_peak_outflow_cfs: 18500, breach_travel_time_minutes: 20, inundation_area_acres: 300, inundation_map_ref: "IM-2026-B" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a2_id: "$.data.id", a2_screening: "$.data.screening_score" }
          trigger:
            - call: "POST /consequence-assessments/${a2_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
          assert:
            - "ConsequenceAssessment.${a2_id}.screening_score == 30.00"
            - "ConsequenceAssessment.${a2_id}.recommended_hazard_class == SIGNIFICANT"
            - "ConsequenceAssessment.${a2_id}.certified_score == 45.00"
            - "ConsequenceAssessment.${a2_id}.certified_hazard_class == HIGH"
            - "ConsequenceAssessment.${a2_id}.certified_score - ConsequenceAssessment.${a2_id}.screening_score == 15.00"
            - "ConsequenceAssessment.${a2_id}.status == CERTIFIED and certified_at == 2026-08-01T00:00:00Z"
            - "Dam.${dam_id}.hazard_class == HIGH"
            - "Dam.${dam_id}.current_consequence_score == 45.00"
            - "Dam.${dam_id}.next_inspection_due_at == 2020-04-15T00:00:00Z"
            - "Dam.${dam_id}.inspection_overdue == true"

      - name: provisional_penalty_preview_exceeds_final_assessed_penalty_after_abatement
        grounds:
          - calculations.civil_penalty_accrual
          - calculations.remediation_deadline
          - entities.RemediationOrder.fields.assessed_penalty_cents
          - entities.RemediationOrder.fields.response_filed_at
          - state_machines.RemediationOrder.RESPONSE_FILED_to_DEFAULTED
        distinguishing_aspect: |
          Fiscal enforcement on the RemediationOrder entity domain (a different subject from the
          ConsequenceAssessment risk score): the provisional_preview variant reports the raw tiered
          accrual 209000 cents while the final_assessment variant applies the 25% good-faith
          abatement to the same 10 overdue days and writes 156750 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, advanced monotonically to 2026-08-05T13:00:00Z and finally to 2026-09-06T13:00:00Z."
            - "HIGH-hazard dam (certified score 45.00) with one SERIOUS deficiency from an accepted inspection."
            - "One COMPLIANCE_ORDER issued 2026-08-05T13:00:00Z requesting 60 response days, clamped to 22 days by HAZARD_FACTOR_HIGH, deadline 2026-08-27T13:00:00Z, daily_penalty_rate_cents 20000."
            - "The owner has filed a response, so response_filed_at is non-null and the good-faith abatement applies at default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Priya Nair", license_number: "PE-55210", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_b_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 12, habitable_structures: 4, critical_facilities: 0, breach_peak_outflow_cfs: 18500, breach_travel_time_minutes: 20, inundation_area_acres: 300, inundation_map_ref: "IM-2026-B" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a2_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a2_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /inspections"
              payload: { dam_id: "${dam_id}", engineer_id: "${eng_a_id}", inspection_type: "PERIODIC", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z" }
              as: ProgramAdmin
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${insp_id}/submit"
              payload: { performed_at: "2026-08-05T09:30:00Z", condition_rating: "POOR", narrative: "Downstream slope seepage with active piping at the left abutment.", deficiencies: [{ category: "SEEPAGE", severity: "SERIOUS", description: "Concentrated seepage exiting the downstream slope at station 2+40." }] }
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /inspections/${insp_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_b_id}"
            - call: "GET /deficiencies?dam_id=${dam_id}&severity=SERIOUS"
              payload: {}
              as: ProgramAdmin
              captures: { def_id: "$.data[0].id" }
            - call: "POST /deficiencies/${def_id}/remediation-orders"
              payload: { order_type: "COMPLIANCE_ORDER", requested_response_days: 60 }
              as: ProgramAdmin
              captures: { order_id: "$.data.id" }
            - call: "POST /remediation-orders/${order_id}/response"
              payload: { corrective_action_summary: "Toe drain cleaned and relief wells installed.", completed_at: "2026-08-05T12:00:00Z" }
              as: DamOwner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T13:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /remediation-orders/${order_id}/penalty-preview"
              payload: {}
              as: ProgramAdmin
            - call: "POST /program/compliance-sweep"
              payload: {}
              as: ProgramAdmin
          assert:
            - "RemediationOrder.${order_id}.effective_response_days == 22"
            - "RemediationOrder.${order_id}.compliance_deadline_at == 2026-08-27T13:00:00Z"
            - "RemediationOrder.${order_id}.daily_penalty_rate_cents == 20000"
            - "penalty-preview response overdue_days == 10"
            - "penalty-preview response provisional_penalty_cents == 209000"
            - "penalty-preview response response_filed == true"
            - "RemediationOrder.${order_id}.status == DEFAULTED"
            - "RemediationOrder.${order_id}.assessed_penalty_cents == 156750"
            - "209000 - 156750 == 52250, exactly the GOOD_FAITH_ABATEMENT_PCT reduction the preview variant omits"
            - "Owner.${owner_id}.fee_balance_cents == 156750"

  - rule_id: combinatorial_formula
    instances:
      - name: civil_penalty_per_day_rounding_diverges_from_sum_then_round
        mode: b
        grounds:
          - calculations.civil_penalty_accrual
          - calculations.remediation_deadline
          - state_machines.Deficiency.ORDERED_to_ESCALATED
          - state_machines.RemediationOrder.ISSUED_to_DEFAULTED
          - entities.RemediationOrder.fields.assessed_penalty_cents
        distinguishing_aspect: |
          Mode (b) - order of operations. The daily rate 6250 with TIER2_FACTOR 1.15 produces the
          half-cent value 7187.5 per day. Rounding each of the three tier-2 days half-up first gives
          7188 x 3 = 21564 and a total of 65314; summing the unrounded days and rounding once at the
          end gives 65312.50 -> 65313. A one-cent difference that only a per-day rounding
          implementation can produce.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and only ever moves forward."
            - "SIGNIFICANT-hazard dam (certified score 6.60): population_at_risk 3, habitable_structures 2, critical_facilities 0, travel 200 minutes, 50 acres."
            - "One MODERATE deficiency raised by an accepted PERIODIC inspection performed 2026-08-05T09:30:00Z."
            - "One COMPLIANCE_ORDER issued 2026-08-05T13:00:00Z requesting 67 days; allowed = floor(90 * 0.75) = 67, so effective_response_days = 67 and the deadline is 2026-10-11T13:00:00Z."
            - "daily_penalty_rate_cents = round_half_up(5000 * 1.25) = 6250. No response is ever filed, so no abatement applies."
            - "Clock advanced to 2026-10-21T13:00:00Z = exactly 10 whole days past the deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Priya Nair", license_number: "PE-55210", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_b_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a1_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /inspections"
              payload: { dam_id: "${dam_id}", engineer_id: "${eng_a_id}", inspection_type: "PERIODIC", window_start: "2026-08-05T08:00:00Z", window_end: "2026-08-05T12:00:00Z" }
              as: ProgramAdmin
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T13:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${insp_id}/submit"
              payload: { performed_at: "2026-08-05T09:30:00Z", condition_rating: "CONDITIONALLY_SATISFACTORY", narrative: "Upstream slope riprap displaced over a 40-foot run.", deficiencies: [{ category: "EROSION", severity: "MODERATE", description: "Riprap loss on the upstream face between stations 1+10 and 1+50." }] }
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /inspections/${insp_id}/accept"
              payload: {}
              as: Engineer
              as_user_id: "${eng_b_id}"
            - call: "GET /deficiencies?dam_id=${dam_id}&severity=MODERATE"
              payload: {}
              as: ProgramAdmin
              captures: { def_id: "$.data[0].id" }
            - call: "POST /deficiencies/${def_id}/remediation-orders"
              payload: { order_type: "COMPLIANCE_ORDER", requested_response_days: 67 }
              as: ProgramAdmin
              captures: { order_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-21T13:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /program/compliance-sweep"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Dam.${dam_id}.hazard_class == SIGNIFICANT and current_consequence_score == 6.60"
            - "Dam.${dam_id}.next_inspection_due_at == 2028-08-05T09:30:00Z and inspection_overdue == false"
            - "RemediationOrder.${order_id}.effective_response_days == 67"
            - "RemediationOrder.${order_id}.compliance_deadline_at == 2026-10-11T13:00:00Z"
            - "RemediationOrder.${order_id}.daily_penalty_rate_cents == 6250"
            - "RemediationOrder.${order_id}.status == DEFAULTED and defaulted_at == 2026-10-21T13:00:00Z"
            - "RemediationOrder.${order_id}.assessed_penalty_cents == 65314"
            - "assessed_penalty_cents != 65313 - the sum-then-round total (43750 + 3 * 7187.50 = 65312.50 -> 65313) is the wrong answer"
            - "compliance-sweep response penalty_cents_assessed == 65314 and defaulted_order_count == 1"
            - "Deficiency.${def_id}.status == ESCALATED"
            - "Owner.${owner_id}.fee_balance_cents == 65314 and delinquency_status == DELINQUENT"

      - name: permit_volume_credit_decided_once_on_pre_credit_total
        mode: c
        grounds:
          - calculations.permit_fee_schedule
          - calculations.owner_fee_balance_and_delinquency
          - entities.Permit.fields.volume_credit_cents
          - entities.Permit.fields.total_fee_cents
          - entities.FeeLedgerEntry.fields.balance_after_cents
        distinguishing_aspect: |
          Mode (c) - a conditional that depends on an aggregate computed earlier in the same pass.
          VOLUME_CREDIT_MIN_CENTS is tested against pre_credit_total 546250, not against the final
          491625. Because 491625 < 500000, any implementation that re-checks the threshold after
          subtracting the credit withdraws it and reports 546250 instead of 491625.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "HIGH-hazard dam (certified consequence score 45.00, REVIEW_UPLIFT_HIGH 1.25)."
            - "The owner already carries a 30000-cent civil penalty on the ledger, so delinquency_status is DELINQUENT and the 15% surcharge applies."
            - "No inspection has ever been accepted, so safety_status stays UNRATED and nothing blocks intake."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 12, habitable_structures: 4, critical_facilities: 0, breach_peak_outflow_cfs: 18500, breach_travel_time_minutes: 20, inundation_area_acres: 300, inundation_map_ref: "IM-2026-B" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a2_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a2_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "CIVIL_PENALTY", amount_cents: 30000, memo: "Carried-over penalty from a prior program year." }
              as: ProgramAdmin
              captures: { seed_entry_id: "$.data.id" }
          trigger:
            - call: "POST /permits"
              payload: { dam_id: "${dam_id}", permit_type: "CONSTRUCTION", scope_description: "Raise the spillway crest and add a labyrinth weir.", estimated_project_cost_cents: 40000000, proposed_start_date: "2026-10-01T00:00:00Z" }
              as: DamOwner
              as_user_id: "${owner_id}"
          assert:
            - "Permit.base_fee_cents == 100000 (40,000,000 falls in TIER2)"
            - "Permit.engineering_review_fee_cents == 375000 (40000000 * 0.0075 * 1.25, under the 750000 cap)"
            - "Permit.delinquency_surcharge_cents == 71250 (round_half_up(475000 * 0.15))"
            - "pre_credit_total == 546250, which is >= VOLUME_CREDIT_MIN_CENTS, so Permit.volume_credit_cents == 54625"
            - "Permit.total_fee_cents == 491625"
            - "Permit.total_fee_cents < 500000 and volume_credit_cents is still 54625 - the credit is NOT withdrawn"
            - "total_fee_cents != 546250 (the value produced by re-testing the threshold after the credit)"
            - "Permit.status == SUBMITTED and revision_count == 0"
            - "the owner's second FeeLedgerEntry has entry_type == PERMIT_REVIEW_FEE, amount_cents == 491625, sequence_no == 2, balance_after_cents == 521625"
            - "Owner.${owner_id}.fee_balance_cents == 521625 and delinquency_status == DELINQUENT"

  - rule_id: non_linear_state_machine
    instances:
      - name: dam_regulatory_status_cycles_back_to_registered_while_safety_status_holds
        grounds:
          - state_machines.Dam.REGISTERED_to_UNDER_ENFORCEMENT
          - state_machines.Dam.UNDER_ENFORCEMENT_to_REGISTERED
          - state_machines.Dam.UNRATED_to_CONDITIONALLY_SATISFACTORY
          - state_machines.Deficiency.ESCALATED_to_ORDERED
          - state_machines.RemediationOrder.RESPONSE_FILED_to_SATISFIED
          - calculations.owner_fee_balance_and_delinquency
        distinguishing_aspect: |
          The Dam entity carries two independent state fields. The regulatory_status dimension makes
          a full cycle REGISTERED -> UNDER_ENFORCEMENT -> REGISTERED (re-entering a state it has
          already occupied) while safety_status stays pinned at CONDITIONALLY_SATISFACTORY the whole
          way, and the Deficiency makes its own ESCALATED -> ORDERED back-edge. An implementation
          that models one linear status on Dam cannot express this.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z, advanced only forward: 2026-08-05T13:00:00Z then 2026-09-17T13:00:00Z."
            - "SIGNIFICANT-hazard dam (certified score 6.60), safety_status set to CONDITIONALLY_SATISFACTORY by an accepted PERIODIC inspection."
