      - name: show_index_is_zero_while_a_provisioned_channel_has_never_reported
        claim_type: input_set_filtering
        grounds:
          - calculations.simulcast_readiness_index
          - entities.StreamChannel.fields.readiness_index
        distinguishing_aspect: "The show index is a min() over every channel in {PROVISIONED, LIVE}, including one that has never sent a health report: a perfect FLAGSHIP_APP channel at 100 plus a silent PROVISIONED SOCIAL_A channel at 0 gives a show index of 0, and the silent channel is excluded from spread_ms so it does not dent the reporting channel."
        test_recipe:
          setup:
            - "One DRAFT show with a lineup slot, a FLAGSHIP_APP channel that reported 1500 ms / 0.0 frames, and a second PROVISIONED SOCIAL_A channel that never reported."
          setup_api_calls:
            - *k_clock_t0
            - *k_product
            - *k_show
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - call: "POST /stream-channels"
              payload: { show_id: "${sh1}", platform: "SOCIAL_A", target_latency_ms: 2000 }
              as: ShowProducer
              captures: { ch2: $.data.id }
            - call: "POST /stream-channels/${ch2}/provision"
              payload: {}
              as: ShowProducer
          trigger:
            - call: "GET /shows/${sh1}"
              payload: {}
              as: ShowProducer
            - call: "GET /stream-channels"
              payload: { show_id: "${sh1}" }
              as: ShowProducer
          assert:
            - "StreamChannel.${ch1}.readiness_index == 100, latency_ms == 1500, health_report_count == 1"
            - "StreamChannel.${ch2}.readiness_index == 0, latency_ms == null, health_report_count == 0, status == PROVISIONED"
            - "Show.${sh1}.simulcast_readiness_index == 0 — the never-reported channel floors the min()"

      - name: show_margin_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: show_margin_provisional_vs_final_diverge
          rationale: "§1.8 already drives PROVISIONAL and FINAL over identical data (authorised-plus-captured revenue at the slot cost snapshot versus captured-only revenue at the revalued current cost, net of RETURN_PROVISION_PCT) and asserts both margin figures plus the commission delta."

      - name: host_score_variant_divergence
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: host_score_live_window_vs_attributed_72h
          rationale: "§1.8 asserts both host-score variants on one dataset, including the REPLAY_ORDER_WEIGHT contribution of replay conversions to effective_orders and the min(100) clamp of the conversion component."

      - name: order_totals_per_line_tax_rounding_order
        claim_type: precision
        excluded_because:
          difficulty_instance: order_totals_per_line_tax_then_sum
          rationale: "§1.8 builds a basket whose per-line rounded taxes sum to a different cent total than a single rounding of the summed gross, and asserts the per-line result explicitly."

      - name: order_totals_free_shipping_threshold
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: free_shipping_at_exactly_7500_merchandise
          rationale: "§1.8 pins merchandise_cents to exactly FREE_SHIP_THRESHOLD_CENTS and one cent below it, asserting shipping_cents 0 versus 599."

      - name: effective_price_pinned_evaluation_order
        claim_type: correct_result
        excluded_because:
          difficulty_instance: effective_unit_price_pinned_four_step_order
          rationale: "§1.8 walks the four-step order (undiscounted subtotal, tier, effective price, line gross) and proves an earlier HELD line is not repriced when a later add lifts the cart into a higher tier."

      - name: simulcast_index_three_input_interaction
        claim_type: correct_result
        excluded_because:
          difficulty_instance: simulcast_index_three_input_nonlinear
          rationale: "§1.8 drives latency penalty, frame penalty and the platform-conditional drift penalty simultaneously across three channels, including the PARTNER_APP drift exemption and the max(0, min(100, ...)) clamps."

      - name: inventory_pool_conservation_invariants
        claim_type: correct_result
        excluded_because:
          difficulty_instance: hold_release_rehold_conserves_product_units
          rationale: "§1.8 asserts INV-1 and INV-2 after every step of a hold / release / re-hold cycle, which is the strongest form of the reconciliation claim."

  # ===========================================================================
  - section: validations
    instances:

      - name: add_item_above_offer_remaining_rejected_then_exact_remainder_accepted
        claim_type: violation_and_satisfaction
        grounds:
          - validations[priority=30]
          - errors[ERR_OFFER_QTY_EXCEEDED]
          - calculations.inventory_pool_reconciliation
        distinguishing_aspect: "The allotment check is on remaining_qty, not on physical stock: qty 11 against max_qty 10 returns 422 ERR_OFFER_QTY_EXCEEDED even though 50 units are on hand, while qty 10 — the exact remainder — succeeds and exhausts the offer."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with an ACTIVE 3500-cent offer capped at 10 units on a product holding 50 units, and viewer 1's OPEN cart."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
          trigger:
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 11 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { err_qty: $.data.error_id }
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 10 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itQ: $.data.id }
          assert:
            - "First add: HTTP 422 with ${err_qty} == ERR_OFFER_QTY_EXCEEDED; FlashOffer.${o1}.held_qty stays 0 and Cart.${ct1}.held_item_count stays 0"
            - "Second add: HTTP 201; CartItem.${itQ}.effective_unit_price_cents == 3150 (subtotal 35000 -> 0.10 tier), line_gross_cents == 31500, line_tax_cents == 2756"
            - "FlashOffer.${o1}: held_qty == 10, remaining_qty == 0, status == EXHAUSTED"
            - "Product.${p1}: reserved_qty == 10, available_qty == 40, committed_qty == 0"

      - name: add_item_above_available_inventory_rejected_then_exact_stock_accepted
        claim_type: violation_and_satisfaction
        grounds:
