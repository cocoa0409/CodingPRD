  - section: validations
    instances:
      - name: create_edition_missing_auth_headers
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Request without X-User-Role/X-User-ID headers is 401 ERR_UNAUTHENTICATED before anything else; the test omits the headers entirely."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /festival/editions", payload: { year: 2027, intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED, http 401; error envelope carries meta + response_type error"

      - name: filmmaker_cannot_create_edition_unauthorized
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "A well-formed request from a declared but wrong role is 403 ERR_UNAUTHORIZED_ROLE (role check precedes all business rules)."
        test_recipe:
          setup: ["submitter registered"]
          setup_api_calls:
            - { call: "POST /festival/submitters", payload: { legal_name: "Ivy Sol", email: "ivy@example.com", country_of_residence: "US" }, as: PUBLIC, captures: { subm: $.data.id } }
          trigger:
            - { call: "POST /festival/editions", payload: { year: 2027, intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FILMMAKER, as_user_id: "${subm}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE, http 403"

