  - section: cross_cutting_layers
    instances:
      - name: occ_offer_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offer-create-stale-lease]", "errors[ERR_STALE_LEASE_VERSION]"]
        distinguishing_aspect: "CREATE-with-supersede OCC: offer A create advances the lease to version 2; a second create carrying the stale version 1 is rejected 412; resubmitting with the observed version 2 succeeds and A becomes SUPERSEDED with supersedes_offer_id recorded on the new offer."
        test_recipe:
          setup: ["policy, property band [12,12], unit, resident, lease (version 1) exist"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
