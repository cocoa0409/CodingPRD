# =============================================================================
# §1.9 Scaffold Corner Design — Apprenticeship & Training Trust Fund (JATC)
# Breadth coverage of every testable §1.1–§1.7 claim not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Instances covered there are emitted as
# excluded_because stubs. Names are unique across both design files.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation, defaults, required fields, not-found, computed
  # ===========================================================================
  - section: entities
    instances:
      - name: apprentice_create_default_state
        claim_type: creation_defaults
        grounds: ["entities.Apprentice.fields.program_status", "entities.Apprentice.fields.current_wage_step"]
        distinguishing_aspect: "A newly created apprentice starts APPLICANT / UNFILED with zeroed accumulators and wage step 1; the derived wage rate equals base x 0.50."
        test_recipe:
          setup:
            - "Fund and employer exist; no apprentice yet."
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "New Apprentice", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
          assert:
            - "Apprentice.${app_id}.program_status == APPLICANT"
            - "Apprentice.${app_id}.registration_status == UNFILED"
            - "Apprentice.${app_id}.ojt_hours_accumulated == 0"
            - "Apprentice.${app_id}.rti_credits_accumulated == 0"
            - "Apprentice.${app_id}.current_wage_step == 1"
            - "Apprentice.${app_id}.current_wage_rate_cents == 2000"
            - "Apprentice.${app_id}.version == 1"

      - name: employer_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_EMPLOYER_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but non-existent employer id returns ERR_EMPLOYER_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /employers/00000000-0000-0000-0000-000000000000"
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EMPLOYER_NOT_FOUND"
            - "HTTP status == 404"

      - name: enrollment_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ENROLLMENT_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but non-existent enrollment id returns ERR_ENROLLMENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /enrollments/00000000-0000-0000-0000-000000000000"
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ENROLLMENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: contribution_report_list_filter_and_pagination
        claim_type: listing
        grounds: ["endpoints[GET /contribution-reports]", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "The filtered list returns only the target employer's reports and honors limit with has_more plus total_count envelope fields."
        test_recipe:
          setup:
            - "Employer E1 has one report for (2026,6) and one for (2026,7); employer E2 has one report for (2026,6)."
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp1_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Beacon Mechanical", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp1_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app1_id: $.data.id }
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp1_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${app1_id}", ojt_hours: 10 }] }
              as: EmployerRep
              as_user_id: "${emp1_id}"
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp1_id}", period_year: 2026, period_month: 7, lines: [{ apprentice_id: "${app1_id}", ojt_hours: 10 }] }
              as: EmployerRep
              as_user_id: "${emp1_id}"
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp2_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${app1_id}", ojt_hours: 5 }] }
              as: EmployerRep
              as_user_id: "${emp2_id}"
          trigger:
            - call: "GET /contribution-reports?employer_id=${emp1_id}&limit=1&offset=0"
              as: TrustAdmin
          assert:
            - "response.data.length == 1"
            - "response.data[0].employer_id == ${emp1_id}"
            - "response envelope contains total_count == 2"
            - "response envelope has_more == true"

      - name: required_field_missing_rejected
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]", "entities.Employer.fields.agreement_rate_cents_per_hour"]
        distinguishing_aspect: "Omitting required field agreement_rate_cents_per_hour on employer creation returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup: ["A fund exists."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "No Rate Inc" }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: contribution_report_due_date_computed
        claim_type: computed_fields
        grounds: ["calculations.contribution_due_date", "entities.ContributionReport.fields.due_date"]
        distinguishing_aspect: "A report for period (2026,6) gets computed due_date 2026-07-15T00:00:00Z regardless of when it was created."
        test_recipe:
          setup: ["Fund, employer, and apprentice exist."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${app_id}", ojt_hours: 40 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
          assert:
            - "ContributionReport.${rep_id}.due_date == 2026-07-15T00:00:00Z"
            - "ContributionReport.${rep_id}.provisional_due_cents == 20000"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, initial, terminal, cascades
  # ===========================================================================
  - section: state_machines
    instances:
      - name: apprentice_invalid_indenture_when_applicant_registered_path
        claim_type: invalid_transition
        grounds: ["state_machines.Apprentice.program_status.APPLICANT_to_INDENTURED", "errors[ERR_APPRENTICE_NOT_INDENTURED]"]
        distinguishing_aspect: "Indenture on an apprentice whose registration is still UNFILED fails with ERR_REGISTRATION_REQUIRED and leaves program_status APPLICANT."
        test_recipe:
          setup: ["Apprentice exists with registration UNFILED (never submitted)."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REGISTRATION_REQUIRED"
            - "Apprentice.${app_id}.program_status == APPLICANT"

      - name: apprentice_cancel_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Apprentice.program_status.terminal_states", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED apprentice rejects every further transition; suspend, indenture, and certify-journeyman all fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Apprentice exists and is CANCELLED from APPLICANT."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/cancel"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /apprentices/${app_id}/certify-journeyman"
              payload: {}
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Apprentice.${app_id}.program_status == CANCELLED"

      - name: class_cancel_drops_only_open_enrollments
        claim_type: conditional_cascade
        grounds: ["state_machines.TrainingClass.SCHEDULED_to_CANCELLED", "state_machines.ClassEnrollment.ENROLLED_to_DROPPED"]
        distinguishing_aspect: "Cancelling a SCHEDULED class cascades only ENROLLED enrollments to DROPPED; previously DROPPED enrollments are untouched."
        test_recipe:
          setup:
            - "Class C (capacity 5) has enrollments N1 (ENROLLED) and N2 (already DROPPED via drop)."
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app1_id: $.data.id }
            - call: "POST /apprentices/${app1_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app1_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app1_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App Two", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app2_id: $.data.id }
            - call: "POST /apprentices/${app2_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app2_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app2_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-101", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 5, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cls_id}", apprentice_id: "${app1_id}" }
              as: TrustAdmin
              captures: { enr1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cls_id}", apprentice_id: "${app2_id}" }
              as: TrustAdmin
              captures: { enr2_id: $.data.id }
            - call: "POST /enrollments/${enr2_id}/drop"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /classes/${cls_id}/cancel"
              payload: {}
              as: TrustAdmin
          assert:
            - "TrainingClass.${cls_id}.status == CANCELLED"
            - "ClassEnrollment.${enr1_id}.status == DROPPED"
            - "ClassEnrollment.${enr2_id}.status == DROPPED"
            - "Apprentice.${app1_id}.rti_credits_accumulated == 0"

      - name: enrollment_drop_rejected_when_creditable_window_closed
        claim_type: invalid_transition
        grounds: ["state_machines.ClassEnrollment.ENROLLED_to_DROPPED", "errors[ERR_ENROLLMENT_NOT_OPEN]"]
        distinguishing_aspect: "Dropping an enrollment already in CREDITED terminal state fails with ERR_ENROLLMENT_NOT_OPEN."
        test_recipe:
          setup: ["Class completed with the apprentice attended; enrollment is CREDITED."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-101", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 5, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cls_id}", apprentice_id: "${app_id}" }
              as: TrustAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /classes/${cls_id}/complete"
              payload: { attended_enrollment_ids: ["${enr_id}"] }
              as: TrustAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/drop"
              payload: {}
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ENROLLMENT_NOT_OPEN"
            - "ClassEnrollment.${enr_id}.status == CREDITED"

      - name: pay_claim_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.InstructorPayClaim.terminal_states", "errors[ERR_CLAIM_NOT_PAYABLE]"]
        distinguishing_aspect: "A REJECTED pay claim rejects both approve and pay attempts; the PAID claim rejects a second pay."
        test_recipe:
          setup: ["Class C1 completed; claim CL1 REJECTED. Class C2 completed; claim CL2 PAID."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-101", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 5, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls1_id: $.data.id }
            - call: "POST /classes/${cls1_id}/complete"
              payload: { attended_enrollment_ids: [] }
              as: TrustAdmin
            - call: "POST /pay-claims"
              payload: { class_id: "${cls1_id}", pay_basis: "SCHEDULED" }
              as: Instructor
              as_user_id: "inst-1"
              captures: { cl1_id: $.data.id }
            - call: "POST /pay-claims/${cl1_id}/reject"
              payload: {}
              as: CommitteeMember
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-102", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-B", rti_credit_value: 8, capacity: 5, start_minute: 800, end_minute: 920 }
              as: TrustAdmin
              captures: { cls2_id: $.data.id }
            - call: "POST /classes/${cls2_id}/complete"
              payload: { attended_enrollment_ids: [] }
              as: TrustAdmin
            - call: "POST /pay-claims"
              payload: { class_id: "${cls2_id}", pay_basis: "SCHEDULED" }
              as: Instructor
              as_user_id: "inst-1"
              captures: { cl2_id: $.data.id }
            - call: "POST /pay-claims/${cl2_id}/approve"
              payload: {}
              as: CommitteeMember
            - call: "POST /pay-claims/${cl2_id}/pay"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /pay-claims/${cl1_id}/pay"
              payload: {}
              as: TrustAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /pay-claims/${cl2_id}/pay"
              payload: {}
              as: TrustAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_CLAIM_NOT_PAYABLE"
            - "err2 == ERR_CLAIM_NOT_PAYABLE"
            - "InstructorPayClaim.${cl1_id}.status == REJECTED"
            - "InstructorPayClaim.${cl2_id}.status == PAID"

      - name: allocation_reject_sovereign
        claim_type: valid_transition
        grounds: ["state_machines.FundingAllocation.PROPOSED_to_REJECTED"]
        distinguishing_aspect: "A committee member may reject a PROPOSED allocation even when they proposed it — segregation of duties constrains approvals only, not rejections."
        test_recipe:
          setup: ["Allocation A proposed by user cm-self (as TrustAdmin)."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              as_user_id: "cm-self"
              captures: { fund_id: $.data.id }
            - call: "POST /funding-allocations"
              payload: { trust_fund_id: "${fund_id}", category: "EQUIPMENT", fiscal_year: 2026, amount_cents: 5000 }
              as: TrustAdmin
              as_user_id: "cm-self"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /funding-allocations/${alloc_id}/reject"
              payload: {}
              as: CommitteeMember
              as_user_id: "cm-self"
          assert:
            - "FundingAllocation.${alloc_id}.status == REJECTED"
            - "HTTP status == 200"

      - name: purchase_approve_from_approved_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.EquipmentPurchase.REQUESTED_to_APPROVED", "errors[ERR_PURCHASE_NOT_REQUESTED]"]
        distinguishing_aspect: "Approving an already-APPROVED purchase fails with ERR_PURCHASE_NOT_REQUESTED and the allocation encumbrance is not doubled."
        test_recipe:
          setup: ["Funded fund; ACTIVE allocation (600 cents); purchase P (200 cents) already APPROVED — allocation encumbered 200."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 3, lines: [{ apprentice_id: "${app_id}", ojt_hours: 1000 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "POST /contribution-reports/${rep_id}/remit"
              payload: { amount_tendered_cents: 500000 }
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "POST /funding-allocations"
              payload: { trust_fund_id: "${fund_id}", category: "EQUIPMENT", fiscal_year: 2026, amount_cents: 600 }
              as: TrustAdmin
              captures: { alloc_id: $.data.id }
            - call: "GET /trust-funds/${fund_id}"
              as: TrustAdmin
              captures: { fund_v: $.data.version }
            - call: "POST /funding-allocations/${alloc_id}/approve"
              payload: { expected_trust_fund_version: "${fund_v}" }
              as: CommitteeMember
              as_user_id: "cm-1"
            - call: "POST /equipment-purchases"
              payload: { allocation_id: "${alloc_id}", description: "Conduit bender", amount_cents: 200 }
              as: TrustAdmin
              as_user_id: "admin-1"
              captures: { pur_id: $.data.id }
            - call: "POST /equipment-purchases/${pur_id}/approve"
              payload: {}
              as: CommitteeMember
              as_user_id: "cm-1"
          trigger:
            - call: "POST /equipment-purchases/${pur_id}/approve"
              payload: {}
