# =============================================================================
# Task 1897 — Reserve Study & Capital Reserve Funding
# Seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "1897. Reserve Study & Capital Reserve Funding (reserve study specialist): component inventory & useful life/remaining life determination, replacement cost estimating & inflation/interest assumptions, funding plan (baseline/threshold/full) modeling, special assessment avoidance analysis, annual update & site visit cadence, board adoption & member disclosure requirements, actual expenditure reconciliation vs plan, statutory reserve requirements by state"

domain_name: reserve-study-funding
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation      # projected funding plan vs chronological actual expenditures
  secondary_archetype: compliance_audit         # statutory per-state rules, board adoption, member disclosure
  complexity_layers:
    - dual_variant_calculation                  # BASELINE/THRESHOLD/FULL contributions; chronological vs forward-looking variance
    - ops_run_checkpoint                        # annual update rolls remaining lives down and re-arms disclosures
    - derived_field_reconciliation              # percent_funded / statutory_compliance_status recomputed on every mutation
    - optimistic_concurrency                    # OCC on ReserveStudy.version for funding-plan create-with-supersede
  entity_topology: flat                         # peer entities joined by FK references, no nested URL ownership
  state_machine_shape: cyclic                   # ReserveStudy DRAFT→SUBMITTED→DRAFT revision loop; Expenditure carries two independent state axes
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain                    # ReserveSpecialist prepares → BoardMember adopts/approves
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Association (HOA/community) legal name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code; a StateReserveRule with this state_code must already exist (ERR_STATE_RULE_MISSING)" }
      - { name: fiscal_year_end_month, type: integer, source: input, description: "Month (1-12) on which the association fiscal year ends; 12 = calendar year" }
      - { name: reserve_cash_balance_cents, type: integer, source: input, description: "Current reserve cash on hand in cents; initialized at creation, afterwards mutated only by expenditure approve/reverse" }
      - { name: current_annual_contribution_cents, type: integer, source: input, default: 0, description: "Annual reserve contribution the association currently funds (cents); used by special-assessment analysis" }
      - { name: last_annual_update_fiscal_year, type: integer, source: system, description: "Fiscal year of the most recent annual-update run; null until first run", default: null }
      - { name: statutory_compliance_status, type: enum, source: computed, description: "COMPLIANCE_UNKNOWN | COMPLIANT | NON_COMPLIANT — re-evaluated on adopt/approve/reverse/annual-update from adopted study percent_funded vs state minimum" }
      - { name: next_site_visit_due_date, type: string, source: computed, description: "YYYY-MM-DD; latest COMPLETED SiteVisit.visit_date + site_visit_interval_years; null when no completed visit", default: null }
      - { name: annual_update_overdue, type: boolean, source: computed, description: "true when state rule annual_update_required and (last_annual_update_fiscal_year is null or < current fiscal year)" }

  - name: StateReserveRule
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code; unique across StateReserveRule (ERR_STATE_RULE_EXISTS)" }
      - { name: min_percent_funded_pct, type: number, source: input, description: "Statutory minimum percent funded required to adopt a study (0-100)" }
      - { name: allowed_plan_types, type: array, source: input, description: "Non-empty subset of [BASELINE, THRESHOLD, FULL]; the selected plan's type must be in this list at adoption" }
      - { name: site_visit_interval_years, type: integer, source: input, description: "Statutory maximum years between site visits (cadence window = 365 * this value, in days)" }
      - { name: disclosure_deadline_days, type: integer, source: input, description: "Days after adoption/annual-update within which the member disclosure must be distributed" }
      - { name: annual_update_required, type: boolean, source: input, description: "Whether the state mandates an annual reserve-study update" }

  - name: ReserveStudy
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; owning association" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal-year label the study covers; window derived from association fiscal_year_end_month" }
      - { name: study_type, type: enum, source: input, description: "FULL | UPDATE_WITH_VISIT | UPDATE_NO_VISIT — drives statutory site-visit cadence gate at submit" }
      - { name: inflation_rate, type: number, source: input, description: "Annual cost inflation assumption as decimal (e.g. 0.03); >= 0" }
      - { name: interest_rate, type: number, source: input, description: "Annual interest earned on reserve cash as decimal (e.g. 0.02); >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ADOPTED | SUPERSEDED | WITHDRAWN" }
      - { name: window_start_date, type: string, source: computed, description: "YYYY-MM-DD inclusive fiscal window start derived from fiscal_year + association fiscal_year_end_month" }
      - { name: window_end_date_exclusive, type: string, source: computed, description: "YYYY-MM-DD exclusive fiscal window end (half-open interval)" }
      - { name: fully_funded_balance_cents, type: integer, source: computed, description: "FFB: sum over ACTIVE included components of round_half_up(current_replacement_cost_cents * (useful_life_years - remaining_useful_life_years) / useful_life_years)" }
      - { name: percent_funded, type: number, source: computed, description: "round_half_up(association cash * 100 / FFB, 2dp); pinned to 100.00 when FFB == 0" }
      - { name: adopted_at, type: datetime, source: system, description: "Logical-clock timestamp of adoption; null until ADOPTED", default: null }
      - { name: adopted_plan_id, type: string, source: system, description: "FK -> FundingPlan.id; the plan that was SELECTED at adoption; null until ADOPTED", default: null }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> ReserveStudy.id; study this component belongs to" }
      - { name: name, type: string, source: input, description: "Component name (e.g. 'Roof - Building A')" }
      - { name: category, type: enum, source: input, description: "ROOFING | PAVING | MECHANICAL | EXTERIOR | INTERIOR | RECREATION | OTHER" }
      - { name: useful_life_years, type: integer, source: input, description: "Total useful life in years; >= 1" }
      - { name: remaining_useful_life_years, type: integer, source: input, description: "Remaining useful life in years; 0 <= RUL <= useful_life_years" }
      - { name: current_replacement_cost_cents, type: integer, source: input, description: "Today's estimated replacement cost in cents; > 0" }
      - { name: is_included_in_funding, type: boolean, source: input, default: true, description: "Whether the component participates in funding plan projections and FFB" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED (cyclic; retire/restore only while study DRAFT)" }
      - { name: actual_expenditure_cents, type: integer, source: system, default: 0, description: "Running total of APPROVED expenditure amounts against this component; debited on approve, credited back on reverse" }
      - { name: last_replaced_fiscal_year, type: integer, source: system, description: "Fiscal year of the most recent APPROVED PLANNED_REPLACEMENT expenditure; null if none", default: null }

  - name: FundingPlan
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: input, description: "FK -> ReserveStudy.id; study this plan models" }
      - { name: plan_type, type: enum, source: input, description: "BASELINE | THRESHOLD | FULL — selects the floor function of the contribution solve" }
      - { name: status, type: enum, source: system, description: "DRAFT | RECOMMENDED | SELECTED | RETIRED" }
      - { name: starting_cash_cents, type: integer, source: system, description: "Snapshot of association reserve_cash_balance_cents at plan computation" }
      - { name: annual_contribution_cents, type: integer, source: computed, description: "Minimal integer-cents constant annual contribution satisfying the plan-type floor over the 30-year projection" }
      - { name: threshold_floor_cents, type: integer, source: computed, description: "THRESHOLD plans only: round_half_up(0.5 * max single-year inflated outflow); null otherwise", default: null }
      - { name: computed_at, type: datetime, source: system, description: "Logical-clock timestamp of the contribution computation" }

  - name: SiteVisit
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; association inspected" }
      - { name: visit_date, type: string, source: input, description: "YYYY-MM-DD date of the visit; must be >= 30 days away from every other visit of the association (ERR_SITE_VISIT_TOO_SOON)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock timestamp of completion; null until COMPLETED", default: null }

  - name: Expenditure
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; association paying from reserves" }
      - { name: component_id, type: string, source: input, description: "FK -> Component.id; component paid for; must belong to the association's current ADOPTED study and be ACTIVE (ERR_COMPONENT_NOT_CURRENT)" }
      - { name: amount_cents, type: integer, source: input, description: "Actual amount paid in cents; > 0" }
      - { name: incurred_date, type: string, source: input, description: "YYYY-MM-DD date the expense was incurred" }
      - { name: kind, type: enum, source: input, description: "PLANNED_REPLACEMENT | UNPLANNED_REPAIR" }
      - { name: fiscal_year, type: integer, source: computed, description: "Fiscal-year label derived from incurred_date + association fiscal_year_end_month" }
      - { name: approval_status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | REVERSED (independent axis 1)" }
      - { name: reconciliation_status, type: enum, source: system, description: "UNRECONCILED | MATCHED | VARIANCE_ACCEPTED | NOT_APPLICABLE (independent axis 2)" }
      - { name: planned_chronological_cents, type: integer, source: computed, description: "Planned amount under the CHRONOLOGICAL variant (study covering expenditure fiscal_year); null until APPROVED", default: null }
      - { name: variance_chronological_cents, type: integer, source: computed, description: "amount_cents - planned_chronological_cents; null until APPROVED", default: null }
      - { name: planned_forward_cents, type: integer, source: computed, description: "Planned amount under the FORWARD_LOOKING variant (current ADOPTED study assumptions); recomputed live on every read; null when no adopted study", default: null }
      - { name: variance_forward_cents, type: integer, source: computed, description: "amount_cents - planned_forward_cents; null when planned_forward_cents is null", default: null }
      - { name: component_rul_before_years, type: integer, source: system, description: "Component remaining_useful_life_years captured at approval; restored on reverse (PLANNED_REPLACEMENT only)", default: null }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp of approval; null until APPROVED", default: null }

  - name: Disclosure
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> ReserveStudy.id; study disclosed (system-created at adoption or annual update)" }
      - { name: disclosure_type, type: enum, source: system, description: "ADOPTION_SUMMARY | ANNUAL_STATEMENT" }
      - { name: status, type: enum, source: system, description: "PENDING | DISTRIBUTED | VOIDED" }
      - { name: due_date, type: string, source: system, description: "YYYY-MM-DD; creation date + state disclosure_deadline_days" }
      - { name: distributed_at, type: datetime, source: system, description: "Logical-clock timestamp of distribution; null until DISTRIBUTED", default: null }
      - { name: is_late, type: boolean, source: computed, default: false, description: "true when distributed date is strictly after due_date" }
      - { name: allocation_lines, type: array, source: computed, description: "ADOPTION_SUMMARY only: per-component share of the adopted plan's annual contribution via largest-remainder rounding; [] for ANNUAL_STATEMENT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ReserveStudy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reserve-studies/{id}/submit"
        actor: ReserveSpecialist
        preconditions:
          - "site-visit cadence satisfied for study_type per state rule (ERR_SITE_VISIT_CADENCE)"
          - ">= 1 component with status ACTIVE and is_included_in_funding true (ERR_STUDY_EMPTY)"
          - ">= 1 FundingPlan with status in {DRAFT, RECOMMENDED, SELECTED} (ERR_NO_FUNDING_PLAN)"
        side_effects:
          - "status := SUBMITTED; version += 1"
      - from: SUBMITTED
        to: ADOPTED
        trigger: "POST /reserve-studies/{id}/adopt"
        actor: BoardMember
        preconditions:
          - "exactly one FundingPlan of this study has status SELECTED (ERR_NO_PLAN_SELECTED)"
          - "selected plan's plan_type is in the state rule's allowed_plan_types (ERR_PLAN_TYPE_NOT_ALLOWED)"
          - "percent_funded >= state rule min_percent_funded_pct (ERR_PERCENT_FUNDED_BELOW_MINIMUM)"
        side_effects:
          - "status := ADOPTED; adopted_at := clock; adopted_plan_id := selected plan; version += 1"
          - "any other ADOPTED study of the same association -> SUPERSEDED (its DRAFT/RECOMMENDED/SELECTED plans -> RETIRED; its PENDING disclosures -> VOIDED)"
          - "create Disclosure(type=ADOPTION_SUMMARY, status=PENDING, due_date = today + disclosure_deadline_days)"
          - "association.statutory_compliance_status re-evaluated (COMPLIANT here, since percent_funded >= minimum)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /reserve-studies/{id}/reject"
        actor: BoardMember
        preconditions: []
        side_effects:
          - "status := DRAFT; version += 1 (revision loop)"
          - "this study's SELECTED plan -> DRAFT (compensation of selection)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /reserve-studies/{id}/withdraw"
        actor: ReserveSpecialist
        preconditions: []
        side_effects:
          - "status := WITHDRAWN; version += 1"
          - "this study's DRAFT/RECOMMENDED plans -> RETIRED"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system (adoption of another study for the same association)"
        actor: system
        preconditions: []
        side_effects:
          - "status := SUPERSEDED; version += 1"
          - "this study's DRAFT/RECOMMENDED/SELECTED plans -> RETIRED"
          - "this study's PENDING disclosures -> VOIDED"

  - entity: Component
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /components/{id}/retire"
        actor: ReserveSpecialist
        preconditions:
          - "component's study has status DRAFT (ERR_STUDY_NOT_DRAFT)"
        side_effects:
          - "status := RETIRED; version += 1"
          - "study fully_funded_balance_cents and percent_funded recomputed (study version += 1)"
      - from: RETIRED
        to: ACTIVE
        trigger: "POST /components/{id}/restore"
        actor: ReserveSpecialist
        preconditions:
          - "component's study has status DRAFT (ERR_STUDY_NOT_DRAFT)"
        side_effects:
          - "status := ACTIVE; version += 1"
          - "study fully_funded_balance_cents and percent_funded recomputed (study version += 1)"

  - entity: FundingPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: RECOMMENDED
        trigger: "POST /funding-plans/{id}/recommend"
        actor: ReserveSpecialist
        preconditions:
          - "plan's study has status in {DRAFT, SUBMITTED} (ERR_INVALID_STATE)"
        side_effects:
          - "status := RECOMMENDED; version += 1"
          - "any other RECOMMENDED plan of the same study -> DRAFT"
      - from: DRAFT
        to: SELECTED
        trigger: "POST /funding-plans/{id}/select"
        actor: BoardMember
        preconditions:
          - "plan's study has status SUBMITTED (ERR_INVALID_STATE)"
          - "no other plan of the same study has status SELECTED (ERR_PLAN_ALREADY_SELECTED)"
        side_effects:
          - "status := SELECTED; version += 1"
      - from: RECOMMENDED
        to: SELECTED
        trigger: "POST /funding-plans/{id}/select"
        actor: BoardMember
        preconditions:
          - "plan's study has status SUBMITTED (ERR_INVALID_STATE)"
          - "no other plan of the same study has status SELECTED (ERR_PLAN_ALREADY_SELECTED)"
        side_effects:
          - "status := SELECTED; version += 1"
      - from: RECOMMENDED
        to: DRAFT
        trigger: "system (another plan of the same study is recommended, or the study is rejected)"
        actor: system
        preconditions: []
        side_effects:
          - "status := DRAFT; version += 1"
      - from: SELECTED
        to: DRAFT
        trigger: "system (the study is rejected: SUBMITTED -> DRAFT)"
        actor: system
        preconditions: []
        side_effects:
          - "status := DRAFT; version += 1"
      - from: DRAFT
        to: RETIRED
        trigger: "system (same-type replacement plan created, or study withdrawn/superseded)"
        actor: system
        preconditions: []
        side_effects:
          - "status := RETIRED; version += 1"
      - from: RECOMMENDED
        to: RETIRED
        trigger: "system (study withdrawn/superseded)"
        actor: system
        preconditions: []
        side_effects:
          - "status := RETIRED; version += 1"
      - from: SELECTED
        to: RETIRED
        trigger: "system (study superseded)"
        actor: system
        preconditions: []
        side_effects:
          - "status := RETIRED; version += 1"

  - entity: SiteVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /site-visits/{id}/complete"
        actor: AssociationManager
        preconditions: []
        side_effects:
          - "status := COMPLETED; completed_at := clock; version += 1"
          - "association.next_site_visit_due_date recomputed (association version += 1)"

  - entity: Expenditure
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVERSED]
    note: "Two independent state axes on one row: approval_status (SUBMITTED | APPROVED | REJECTED | REVERSED) x reconciliation_status (UNRECONCILED | MATCHED | VARIANCE_ACCEPTED | NOT_APPLICABLE). Initial pair: (SUBMITTED, UNRECONCILED)."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expenditures/{id}/approve"
        actor: BoardMember
        preconditions:
          - "component still belongs to the association's current ADOPTED study and is ACTIVE (ERR_COMPONENT_NOT_CURRENT)"
          - "association.reserve_cash_balance_cents >= amount_cents (ERR_CASH_INSUFFICIENT)"
        side_effects:
          - "approval_status := APPROVED; approved_at := clock; version += 1"
          - "association.reserve_cash_balance_cents -= amount_cents (association version += 1)"
          - "component.actual_expenditure_cents += amount_cents; for PLANNED_REPLACEMENT: component_rul_before_years := component.remaining_useful_life_years, then component.remaining_useful_life_years := component.useful_life_years and component.last_replaced_fiscal_year := expenditure.fiscal_year (component version += 1)"
          - "planned_chronological_cents / variance_chronological_cents computed; reconciliation_status := MATCHED when |variance| <= max(500, round_half_up(0.10 * planned_chronological_cents)), else stays UNRECONCILED"
          - "adopted study fully_funded_balance_cents and percent_funded recomputed (study version += 1)"
          - "association.statutory_compliance_status re-evaluated (NON_COMPLIANT when recomputed percent_funded < state minimum)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /expenditures/{id}/reject"
        actor: BoardMember
        preconditions: []
        side_effects:
          - "approval_status := REJECTED; reconciliation_status := NOT_APPLICABLE; version += 1"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /expenditures/{id}/reverse"
        actor: BoardMember
        preconditions:
          - "current fiscal year (logical clock) equals expenditure.fiscal_year (ERR_REVERSAL_WINDOW_CLOSED)"
        side_effects:
          - "approval_status := REVERSED; reconciliation_status := NOT_APPLICABLE; version += 1"
          - "association.reserve_cash_balance_cents += amount_cents (association version += 1)"
          - "component.actual_expenditure_cents -= amount_cents; for PLANNED_REPLACEMENT: component.remaining_useful_life_years := component_rul_before_years; component.last_replaced_fiscal_year recomputed as the max fiscal_year of the component's other APPROVED PLANNED_REPLACEMENT expenditures, or null when none (component version += 1)"
          - "adopted study fully_funded_balance_cents and percent_funded recomputed (study version += 1)"
          - "association.statutory_compliance_status re-evaluated"
      - from: UNRECONCILED
        to: VARIANCE_ACCEPTED
        trigger: "POST /expenditures/{id}/accept-variance"
        actor: ReserveSpecialist
        preconditions:
          - "reconciliation_status is UNRECONCILED (ERR_INVALID_STATE); approval_status is untouched by this transition"
        side_effects:
          - "reconciliation_status := VARIANCE_ACCEPTED; version += 1"

  - entity: Disclosure
    initial_state: PENDING
    terminal_states: [DISTRIBUTED, VOIDED]
    transitions:
      - from: PENDING
        to: DISTRIBUTED
        trigger: "POST /disclosures/{id}/distribute"
        actor: AssociationManager
        preconditions: []
        side_effects:
          - "status := DISTRIBUTED; distributed_at := clock; is_late := (distributed date > due_date); version += 1"
      - from: PENDING
        to: VOIDED
        trigger: "system (owning study is superseded)"
        actor: system
        preconditions: []
        side_effects:
          - "status := VOIDED; version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-study
    parent_entity: ReserveStudy
    write_endpoint: "POST /reserve-studies/{id}/funding-plans"
    occ_field: expected_study_version
    description: |
      Creating a FundingPlan against a ReserveStudy whose version has advanced
      since the client last observed it is rejected. Plan creation legitimately
      supersedes an existing DRAFT plan of the same plan_type (old plan ->
      RETIRED), so a create issued from a stale view of the study would retire
      a plan the client never saw; the stale-version check rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fiscal_year_derivation
    trigger: "expenditure creation (fiscal_year), annual-update guard, reversal window, study window derivation"
    algorithm: chronological
    formula: |
      fy(date, end_month): if end_month == 12 -> year(date)
                           else -> year(date) + 1 when month(date) > end_month else year(date)
      Study fiscal window (half-open): end_month == 12 -> [ fiscal_year-01-01 , (fiscal_year+1)-01-01 )
                                       else -> [ (fiscal_year-1)-(end_month+1)-01 , fiscal_year-(end_month+1)-01 )
    input_set: "the date and the association's fiscal_year_end_month"
    constants:
      DAYS_PER_YEAR: 365
    precision: "whole days; dates as YYYY-MM-DD"

  - name: component_replacement_schedule
    trigger: "funding plan computation, expenditure variance, special-assessment analysis"
    algorithm: forward_looking
    formula: |
      For each component with status ACTIVE and is_included_in_funding true:
        replacement years y = remaining_useful_life_years + k * useful_life_years for k = 0,1,2,... while y <= 29
        inflated cost at year y = round_half_up(current_replacement_cost_cents * (1 + study.inflation_rate) ^ y)  [integer cents]
      O_y = sum of inflated costs of all replacements scheduled in year y (0 when none).
    input_set: "components of the subject study with status ACTIVE and is_included_in_funding true"
    constants:
      PROJECTION_HORIZON_YEARS: 30
    precision: "integer cents, round_half_up applied per replacement event"

  - name: funding_plan_contribution
    trigger: "POST /reserve-studies/{id}/funding-plans (computed once at creation; snapshot stored on the plan)"
    algorithm: threshold
    formula: |
      B_0 = starting_cash_cents (association reserve_cash_balance_cents at computation)
      for y in 0..29: B_{y+1} = round_half_up((B_y + C - O_y) * (1 + study.interest_rate))
      O_y from component_replacement_schedule.
      floor_y per plan_type variant (below).
      C* = the MINIMAL integer cents >= 0 such that B_y >= floor_y for every y in 1..30.
      (Binary search over [0, 10^12]; the minimal feasible integer is unique.)
    input_set: "ACTIVE included components of the study, association cash snapshot, study inflation/interest"
    constants:
      PROJECTION_HORIZON_YEARS: 30
      THRESHOLD_PEAK_RATIO: 0.5
    precision: "integer cents; round_half_up applied once per year-step"
    variants:
      - name: BASELINE
        when: "plan_type == BASELINE (cash-flow / special-assessment-avoidance funding)"
        difference: "floor_y = 0 for all y — balance may never go negative"
      - name: THRESHOLD
        when: "plan_type == THRESHOLD"
        difference: "floor_y = threshold_floor_cents = round_half_up(0.5 * max over y in 0..29 of O_y) for all y (0 when every O_y is 0)"
      - name: FULL
        when: "plan_type == FULL (full funding)"
        difference: "floor_y = projected fully-funded balance FFB_y (see fully_funded_balance_and_percent_funded projected form) for all y"

  - name: fully_funded_balance_and_percent_funded
    trigger: "component create/patch/retire/restore, expenditure approve/reverse with RUL reset, annual update, study read"
    algorithm: aggregation
    formula: |
      Current (y = 0): age_c = useful_life_years_c - remaining_useful_life_years_c
        FFB_0 = sum over ACTIVE included components of round_half_up(current_replacement_cost_cents * age_c / useful_life_years_c)
      Projected (y >= 1): age_c(y) = (useful_life_years_c - remaining_useful_life_years_c + y) mod useful_life_years_c
        FFB_y = sum of round_half_up(round_half_up(current_replacement_cost_cents * (1 + inflation_rate)^y) * age_c(y) / useful_life_years_c)
      percent_funded = round_half_up(association.reserve_cash_balance_cents * 100 / FFB_0, 2 decimal places)
      pinned edge: FFB_0 == 0 -> percent_funded = 100.00
    input_set: "components of the study with status ACTIVE and is_included_in_funding true"
    constants: {}
    precision: "FFB integer cents; percent 2 decimal places round_half_up; per-component term rounded before summing"

  - name: expenditure_variance_reconciliation
    trigger: "expenditure approval (chronological variant + auto-match); expenditure read (forward variant)"
    algorithm: aggregation
    formula: |
      planned(anchor_study) = round_half_up(component.current_replacement_cost_cents
                              * (1 + anchor_study.inflation_rate) ^ (expenditure.fiscal_year - anchor_study.fiscal_year))
      variance = amount_cents - planned
      auto-match tolerance = max(500, round_half_up(0.10 * planned_chronological_cents))
      reconciliation_status := MATCHED when |variance_chronological_cents| <= tolerance, else stays UNRECONCILED
    input_set: "the APPROVED expenditure, its component, and the anchor study per variant"
    constants:
      VARIANCE_TOLERANCE_FLAT_CENTS: 500
      VARIANCE_TOLERANCE_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: CHRONOLOGICAL
        when: "computed and stored at approval time"
        difference: "anchor = study of the same association whose fiscal_year == expenditure.fiscal_year and status in {ADOPTED, SUPERSEDED} (ties broken by greatest created_at); when none exists, anchor = current ADOPTED study; null when the association has no adopted study"
      - name: FORWARD_LOOKING
        when: "recomputed live on every expenditure read"
        difference: "anchor = association's current ADOPTED study (whatever it is at read time); null when none — diverges from CHRONOLOGICAL whenever the adopted study's assumptions have changed since the expenditure's fiscal year"

  - name: disclosure_component_allocation
    trigger: "Disclosure read (allocation_lines on ADOPTION_SUMMARY disclosures)"
    algorithm: waterfall_allocation
    formula: |
      C = annual_contribution_cents of the study's adopted_plan_id plan.
      weight_c = inflated cost of component c at its first replacement year <= 29 (component_replacement_schedule); 0 when no replacement falls in the horizon.
      S = sum of weights.
      When S > 0: share_c = floor(C * weight_c / S); remainder = C - sum(share_c);
        distribute remainder one cent at a time to the components with the largest fractional part
        of (C * weight_c / S), ties broken by created_at ASC (then each receives at most +1).
      When S == 0: entire C goes to the component with the greatest current_replacement_cost_cents
        (tie: created_at ASC); all other lines 0.
      Line order: created_at ASC. Lines cover ACTIVE included components only.
    input_set: "ACTIVE included components of the disclosure's study; the adopted plan's contribution"
    constants: {}
    precision: "integer cents; per-line floor first, then largest-remainder cents — pinned order; independent per-line round_half_up would mis-sum and is NOT the rule"

  - name: annual_update_rolldown
    trigger: "POST /associations/{id}/annual-update"
    algorithm: constraint_propagation
    formula: |
      Preconditions: association has a current ADOPTED study (ERR_NO_ADOPTED_STUDY);
        current fiscal year (logical clock) > last_annual_update_fiscal_year (null always passes) else ERR_ANNUAL_UPDATE_ALREADY_RUN.
      Effects, in order:
        1) for every component with status ACTIVE of the current ADOPTED study:
             remaining_useful_life_years := max(0, remaining_useful_life_years - 1)  (component version += 1)
        2) recompute that study's fully_funded_balance_cents and percent_funded (study version += 1)
        3) create Disclosure(type=ANNUAL_STATEMENT, status=PENDING,
             due_date = current date + state rule disclosure_deadline_days)
        4) association.last_annual_update_fiscal_year := current fiscal year (association version += 1)
        5) association.statutory_compliance_status re-evaluated
    input_set: "current ADOPTED study's ACTIVE components"
    constants: {}
    precision: "integer years; RUL floors at 0 (components past end of life stay at 0)"

  - name: site_visit_cadence_and_gap
    trigger: "POST /site-visits (gap), POST /reserve-studies/{id}/submit (cadence), association read (due date)"
    algorithm: threshold
    formula: |
      Gap (create): |new visit_date - existing visit_date| >= SITE_VISIT_MIN_GAP_DAYS for every other
        SiteVisit of the association (any status); equality allowed; violation -> ERR_SITE_VISIT_TOO_SOON.
      Cadence (submit), using the logical clock's current date and days = 365 * site_visit_interval_years:
        FULL or UPDATE_WITH_VISIT: some COMPLETED visit has 0 <= (submit_date - visit_date).days <= days.
        UPDATE_NO_VISIT: some COMPLETED visit has 0 <= (submit_date - visit_date).days <= 2 * days.
        Violation -> ERR_SITE_VISIT_CADENCE.
      next_site_visit_due_date = latest COMPLETED visit_date + days (null when no COMPLETED visit).
    input_set: "SiteVisit rows of the association"
    constants:
      SITE_VISIT_MIN_GAP_DAYS: 30
      DAYS_PER_YEAR: 365
    precision: "whole days"

  - name: special_assessment_analysis
    trigger: "GET /reserve-studies/{id}/special-assessment-analysis"
    algorithm: forward_looking
    formula: |
      Requires the addressed study to be ADOPTED (ERR_INVALID_STATE).
      Project balances with C = association.current_annual_contribution_cents,
      B_0 = association.reserve_cash_balance_cents, O_y from component_replacement_schedule
      over the study's ACTIVE included components, recursion as in funding_plan_contribution.
      shortfall years = y in 1..30 with B_y < 0  (B_y == 0 is NOT a shortfall).
      risk = AT_RISK when any shortfall year exists else NONE.
      first_shortfall_year = study.fiscal_year + min shortfall y (null when NONE).
      projected_min_balance_cents = min over y in 1..30 of B_y.
      max_shortfall_cents = max(0, -projected_min_balance_cents).
    input_set: "the ADOPTED study's ACTIVE included components; association cash and current contribution"
    constants:
      PROJECTION_HORIZON_YEARS: 30
    precision: "integer cents, round_half_up per year-step"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path ids exist; body foreign-key ids (association_id, study_id, component_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "request shape: required fields present, no unknown fields, enum membership, useful_life_years >= 1, 0 <= remaining_useful_life_years <= useful_life_years, amounts > 0, rates >= 0, fiscal_year_end_month in 1..12"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: state
    check: "target entity state preconditions: study DRAFT/SUBMITTED as required (ERR_INVALID_STATE / ERR_STUDY_NOT_DRAFT), plan status, visit SCHEDULED, expenditure SUBMITTED/APPROVED, disclosure PENDING, exactly one SELECTED plan at adopt (ERR_NO_PLAN_SELECTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_study_version equals the study's current version on funding-plan creation"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reserve-studies/{id}/funding-plans"
  - priority: 7
    category: business_referential
    check: "referenced configuration/current-aggregate exists: state rule for association state_code (ERR_STATE_RULE_MISSING); association has a current ADOPTED study (ERR_NO_ADOPTED_STUDY); component belongs to that study and is ACTIVE (ERR_COMPONENT_NOT_CURRENT, re-checked at approve)"
    error_id: ERR_STATE_RULE_MISSING
    http_status: 422
    applies_to: "association create, expenditure create/approve, annual-update"
  - priority: 8
    category: business_temporal
    check: "time-based rules: site-visit cadence at study submit (ERR_SITE_VISIT_CADENCE 422); reversal inside the expenditure's fiscal year (ERR_REVERSAL_WINDOW_CLOSED 409); annual update once per fiscal year (ERR_ANNUAL_UPDATE_ALREADY_RUN 409)"
    error_id: ERR_SITE_VISIT_CADENCE
    http_status: 422
    applies_to: "study submit, expenditure reverse, annual-update"
  - priority: 9
    category: business_safety
    check: "statutory compliance at adoption: selected plan type allowed by state rule (ERR_PLAN_TYPE_NOT_ALLOWED 422); percent_funded >= state minimum (ERR_PERCENT_FUNDED_BELOW_MINIMUM 422)"
    error_id: ERR_PLAN_TYPE_NOT_ALLOWED
    http_status: 422
    applies_to: "study adopt"
  - priority: 10
    category: business_constraint
    check: "uniqueness/overlap/gap rules: one in-progress (DRAFT/SUBMITTED) study per association (ERR_STUDY_IN_PROGRESS); ADOPTED-study fiscal window overlap (ERR_STUDY_WINDOW_OVERLAP); site-visit min gap (ERR_SITE_VISIT_TOO_SOON); state rule state_code uniqueness (ERR_STATE_RULE_EXISTS); one SELECTED plan per study (ERR_PLAN_ALREADY_SELECTED); same-type plan replace only when existing plan is DRAFT (ERR_PLAN_TYPE_LOCKED); submit content minimums (ERR_STUDY_EMPTY, ERR_NO_FUNDING_PLAN)"
    error_id: ERR_STUDY_IN_PROGRESS
    http_status: 409
    applies_to: "study create, visit create, rule create, plan select/create, study submit"
  - priority: 11
    category: business_fiscal
    check: "association.reserve_cash_balance_cents >= expenditure amount_cents at approval"
    error_id: ERR_CASH_INSUFFICIENT
    http_status: 409
    applies_to: "expenditure approve"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- StateReserveRule ---
  - method: POST
    path: "/state-reserve-rules"
    description: "Create the statutory reserve rule for a state"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, min_percent_funded_pct, allowed_plan_types, site_visit_interval_years, disclosure_deadline_days, annual_update_required]
    output: StateReserveRule
    side_effects: []

  # --- Association ---
  - method: POST
    path: "/associations"
    description: "Create an association; state rule for state_code must exist"
    roles: [ReserveSpecialist]
    code: 201
    input: [name, state_code, fiscal_year_end_month, reserve_cash_balance_cents, "current_annual_contribution_cents?"]
    output: Association
    side_effects: ["statutory_compliance_status := COMPLIANCE_UNKNOWN; next_site_visit_due_date := null"]

  - method: GET
    path: "/associations/{id}"
    description: "Read one association (including computed compliance/cadence fields)"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: []
    output: Association
    side_effects: []

  - method: POST
    path: "/associations/{id}/annual-update"
    description: "Ops-run checkpoint: roll remaining lives down one year for the current ADOPTED study's ACTIVE components, recompute FFB/percent, create the ANNUAL_STATEMENT disclosure, stamp last_annual_update_fiscal_year"
    roles: [ReserveSpecialist]
    code: 200
    input: []
    output: Association
    side_effects: ["annual_update_rolldown calculation", "Disclosure(ANNUAL_STATEMENT, PENDING) created"]

  # --- ReserveStudy ---
  - method: POST
    path: "/reserve-studies"
    description: "Create a study in DRAFT; at most one DRAFT/SUBMITTED study per association; fiscal window must not overlap another ADOPTED study's window"
    roles: [ReserveSpecialist]
    code: 201
    input: [association_id, fiscal_year, study_type, inflation_rate, interest_rate]
    output: ReserveStudy
    side_effects: ["status := DRAFT; window dates computed; FFB := 0; percent_funded := 100.00"]

  - method: GET
    path: "/reserve-studies/{id}"
    description: "Read one study"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: []
    output: ReserveStudy
    side_effects: []

  - method: GET
    path: "/associations/{id}/reserve-studies"
    description: "List studies of an association; default sort created_at ASC"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReserveStudy[]
    side_effects: []

  - method: GET
    path: "/reserve-studies"
    description: "List/filter studies across associations (e.g. find the study that adopted a given plan); default sort created_at ASC"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: ["association_id?", "adopted_plan_id?", "status?", "limit?", "offset?"]
    output: ReserveStudy[]
    side_effects: []

  - method: POST
    path: "/reserve-studies/{id}/submit"
    description: "Submit a DRAFT study for board review (cadence + content minimums enforced)"
    roles: [ReserveSpecialist]
    code: 200
    input: []
    output: ReserveStudy
    side_effects: ["status := SUBMITTED; study version += 1"]

  - method: POST
    path: "/reserve-studies/{id}/adopt"
    description: "Board adopts a SUBMITTED study (statutory checks); supersedes the prior ADOPTED study and creates the ADOPTION_SUMMARY disclosure"
    roles: [BoardMember]
    code: 200
    input: []
    output: ReserveStudy
    side_effects: ["adoption cascade per §1.2", "Disclosure(ADOPTION_SUMMARY, PENDING) created"]

  - method: POST
    path: "/reserve-studies/{id}/reject"
    description: "Board rejects a SUBMITTED study back to DRAFT; its SELECTED plan reverts to DRAFT"
    roles: [BoardMember]
    code: 200
    input: ["reason?"]
    output: ReserveStudy
    side_effects: ["status := DRAFT; study version += 1", "SELECTED plan -> DRAFT"]

  - method: POST
    path: "/reserve-studies/{id}/withdraw"
    description: "Withdraw a DRAFT study (terminal)"
    roles: [ReserveSpecialist]
    code: 200
    input: []
    output: ReserveStudy
    side_effects: ["status := WITHDRAWN; study version += 1", "DRAFT/RECOMMENDED plans -> RETIRED"]

  - method: GET
    path: "/reserve-studies/{id}/special-assessment-analysis"
    description: "Computed read: special-assessment risk projection for an ADOPTED study under the association's current contribution"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: []
    output: "{ risk: string, first_shortfall_year: integer, max_shortfall_cents: integer, projected_min_balance_cents: integer }"
    side_effects: []

  # --- Component ---
  - method: POST
    path: "/components"
    description: "Add a component to a DRAFT study"
    roles: [ReserveSpecialist]
    code: 201
    input: [study_id, name, category, useful_life_years, remaining_useful_life_years, current_replacement_cost_cents, "is_included_in_funding?"]
    output: Component
    side_effects: ["status := ACTIVE", "study FFB/percent recomputed; study version += 1"]

  - method: GET
    path: "/reserve-studies/{id}/components"
    description: "List components of a study; default sort created_at ASC"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Component[]
    side_effects: []

  - method: PATCH
    path: "/components/{id}"
    description: "Update component fields; only while the owning study is DRAFT"
    roles: [ReserveSpecialist]
    code: 200
    input: ["name?", "category?", "useful_life_years?", "remaining_useful_life_years?", "current_replacement_cost_cents?", "is_included_in_funding?"]
    output: Component
    side_effects: ["study FFB/percent recomputed; study version += 1"]

  - method: POST
    path: "/components/{id}/retire"
    description: "Retire a component (only while study DRAFT)"
    roles: [ReserveSpecialist]
    code: 200
    input: []
    output: Component
    side_effects: ["status := RETIRED", "study FFB/percent recomputed; study version += 1"]

  - method: POST
    path: "/components/{id}/restore"
    description: "Restore a retired component (only while study DRAFT)"
    roles: [ReserveSpecialist]
    code: 200
    input: []
    output: Component
    side_effects: ["status := ACTIVE", "study FFB/percent recomputed; study version += 1"]

  # --- FundingPlan ---
  - method: POST
    path: "/reserve-studies/{id}/funding-plans"
    description: "Create a funding plan for a DRAFT study; computes and stores the annual contribution; supersedes an existing DRAFT plan of the same plan_type (old -> RETIRED); rejects when same-type plan is RECOMMENDED/SELECTED"
    roles: [ReserveSpecialist]
    code: 201
    input: [plan_type, expected_study_version]
    output: FundingPlan
    side_effects: ["funding_plan_contribution computed", "increments ReserveStudy.version by 1", "existing same-type DRAFT plan -> RETIRED"]

  - method: GET
    path: "/reserve-studies/{id}/funding-plans"
    description: "List funding plans of a study; default sort created_at ASC"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: ["plan_type?", "status?", "limit?", "offset?"]
    output: FundingPlan[]
    side_effects: []

  - method: POST
    path: "/funding-plans/{id}/recommend"
    description: "Specialist recommends a DRAFT plan; any other RECOMMENDED plan of the study reverts to DRAFT"
    roles: [ReserveSpecialist]
    code: 200
    input: []
    output: FundingPlan
    side_effects: ["status := RECOMMENDED", "other RECOMMENDED plan -> DRAFT"]

  - method: POST
    path: "/funding-plans/{id}/select"
    description: "Board selects a plan while the study is SUBMITTED; at most one SELECTED plan per study"
    roles: [BoardMember]
    code: 200
    input: []
    output: FundingPlan
    side_effects: ["status := SELECTED"]

  # --- SiteVisit ---
  - method: POST
    path: "/site-visits"
    description: "Schedule a site visit; >= 30 days from every other visit of the association"
    roles: [AssociationManager]
    code: 201
    input: [association_id, visit_date]
    output: SiteVisit
    side_effects: ["status := SCHEDULED"]

  - method: POST
    path: "/site-visits/{id}/complete"
    description: "Mark a SCHEDULED visit completed"
    roles: [AssociationManager]
    code: 200
    input: []
    output: SiteVisit
    side_effects: ["status := COMPLETED; completed_at := clock", "association.next_site_visit_due_date recomputed"]

  - method: GET
    path: "/associations/{id}/site-visits"
    description: "List site visits of an association; default sort created_at ASC"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SiteVisit[]
    side_effects: []

  # --- Expenditure ---
  - method: POST
    path: "/expenditures"
    description: "Submit an actual reserve expenditure; association must have a current ADOPTED study and the component must belong to it and be ACTIVE"
    roles: [AssociationManager]
    code: 201
    input: [association_id, component_id, amount_cents, incurred_date, kind]
    output: Expenditure
    side_effects: ["approval_status := SUBMITTED; reconciliation_status := UNRECONCILED; fiscal_year computed"]

  - method: GET
    path: "/expenditures/{id}"
    description: "Read one expenditure (forward-looking variance recomputed live)"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: []
    output: Expenditure
    side_effects: []

  - method: GET
    path: "/expenditures"
    description: "List expenditures with filters; default sort created_at ASC"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: ["association_id?", "component_id?", "approval_status?", "reconciliation_status?", "limit?", "offset?"]
    output: Expenditure[]
    side_effects: []

  - method: POST
    path: "/expenditures/{id}/approve"
    description: "Board approves a SUBMITTED expenditure; debits reserve cash, reconciles against plan, resets component life on PLANNED_REPLACEMENT"
    roles: [BoardMember]
    code: 200
    input: []
    output: Expenditure
    side_effects: ["approval cascade per §1.2 (cash debit, component actuals/RUL, study recompute, compliance re-eval)"]

  - method: POST
    path: "/expenditures/{id}/reject"
    description: "Board rejects a SUBMITTED expenditure"
    roles: [BoardMember]
    code: 200
    input: []
    output: Expenditure
    side_effects: ["approval_status := REJECTED; reconciliation_status := NOT_APPLICABLE"]

  - method: POST
    path: "/expenditures/{id}/reverse"
    description: "Board reverses an APPROVED expenditure inside its own fiscal year; credits cash back and restores component life"
    roles: [BoardMember]
    code: 200
    input: []
    output: Expenditure
    side_effects: ["compensation per §1.2 (cash credit, RUL restore, study recompute, compliance re-eval)"]

  - method: POST
    path: "/expenditures/{id}/accept-variance"
    description: "Specialist accepts an out-of-tolerance variance (reconciliation axis only)"
    roles: [ReserveSpecialist]
    code: 200
    input: ["reason?"]
    output: Expenditure
    side_effects: ["reconciliation_status := VARIANCE_ACCEPTED"]

  # --- Disclosure ---
  - method: GET
    path: "/reserve-studies/{id}/disclosures"
    description: "List disclosures of a study; default sort created_at ASC"
    roles: [PlatformAdmin, ReserveSpecialist, BoardMember, AssociationManager]
    code: 200
    input: ["status?", "disclosure_type?", "limit?", "offset?"]
    output: Disclosure[]
    side_effects: []

  - method: POST
    path: "/disclosures/{id}/distribute"
    description: "Distribute a PENDING disclosure to members; sets is_late when past due_date"
    roles: [AssociationManager]
    code: 200
    input: []
    output: Disclosure
    side_effects: ["status := DISTRIBUTED; distributed_at := clock; is_late computed"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO 8601 UTC). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or body foreign-key id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, unknown field, enum/range violation (e.g. RUL > UL)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target entity not in the required state for the action" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_study_version does not match the study's current version" }
  - { id: ERR_STATE_RULE_MISSING, http: 422, condition: "no StateReserveRule exists for the association's state_code" }
  - { id: ERR_STATE_RULE_EXISTS, http: 409, condition: "a StateReserveRule with this state_code already exists" }
  - { id: ERR_STUDY_IN_PROGRESS, http: 409, condition: "association already has a study in DRAFT or SUBMITTED" }
  - { id: ERR_STUDY_WINDOW_OVERLAP, http: 409, condition: "study fiscal window overlaps another ADOPTED study's fiscal window (same association)" }
  - { id: ERR_SITE_VISIT_TOO_SOON, http: 409, condition: "new visit_date is fewer than 30 days from an existing visit of the association" }
  - { id: ERR_SITE_VISIT_CADENCE, http: 422, condition: "no COMPLETED site visit inside the statutory window for the study_type at submit" }
  - { id: ERR_STUDY_EMPTY, http: 409, condition: "submit requires at least one ACTIVE, funding-included component" }
  - { id: ERR_NO_FUNDING_PLAN, http: 409, condition: "submit requires at least one non-RETIRED funding plan" }
  - { id: ERR_STUDY_NOT_DRAFT, http: 409, condition: "component/plan mutation requires the owning study to be DRAFT" }
  - { id: ERR_PLAN_ALREADY_SELECTED, http: 409, condition: "another plan of the same study is already SELECTED" }
  - { id: ERR_PLAN_TYPE_LOCKED, http: 409, condition: "a same-type plan exists in RECOMMENDED or SELECTED; only a DRAFT same-type plan may be superseded" }
  - { id: ERR_NO_PLAN_SELECTED, http: 409, condition: "adopt requires exactly one SELECTED plan" }
  - { id: ERR_PLAN_TYPE_NOT_ALLOWED, http: 422, condition: "selected plan's plan_type is not in the state rule's allowed_plan_types" }
  - { id: ERR_PERCENT_FUNDED_BELOW_MINIMUM, http: 422, condition: "percent_funded is below the state rule's min_percent_funded_pct at adoption" }
  - { id: ERR_CASH_INSUFFICIENT, http: 409, condition: "reserve cash balance is below the expenditure amount at approval" }
  - { id: ERR_COMPONENT_NOT_CURRENT, http: 409, condition: "component does not belong to the association's current ADOPTED study or is not ACTIVE" }
  - { id: ERR_NO_ADOPTED_STUDY, http: 409, condition: "association has no current ADOPTED study" }
  - { id: ERR_REVERSAL_WINDOW_CLOSED, http: 409, condition: "current fiscal year differs from the expenditure's fiscal_year" }
  - { id: ERR_ANNUAL_UPDATE_ALREADY_RUN, http: 409, condition: "annual update already ran for the association's current fiscal year" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; seeds statutory state rules and drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /state-reserve-rules"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: ReserveSpecialist
    description: "Reserve study specialist; prepares associations, studies, component inventory, funding plans; runs annual updates; accepts variances"
    identity: opaque
    exclusive_operations:
      - "POST /associations"
      - "POST /associations/{id}/annual-update"
      - "POST /reserve-studies, POST /reserve-studies/{id}/submit, POST /reserve-studies/{id}/withdraw"
      - "POST /components, PATCH /components/{id}, POST /components/{id}/retire, POST /components/{id}/restore"
      - "POST /reserve-studies/{id}/funding-plans, POST /funding-plans/{id}/recommend"
      - "POST /expenditures/{id}/accept-variance"
    shared_operations:
      - "all GET endpoints"

  - name: BoardMember
    description: "Association board member; adopts/rejects studies, selects the funding plan, approves/rejects/reverses expenditures"
    identity: opaque
    exclusive_operations:
      - "POST /reserve-studies/{id}/adopt, POST /reserve-studies/{id}/reject"
      - "POST /funding-plans/{id}/select"
      - "POST /expenditures/{id}/approve, POST /expenditures/{id}/reject, POST /expenditures/{id}/reverse"
    shared_operations:
      - "all GET endpoints"

  - name: AssociationManager
    description: "Association manager; schedules/completes site visits, submits expenditures, distributes disclosures"
    identity: opaque
    exclusive_operations:
      - "POST /site-visits, POST /site-visits/{id}/complete"
      - "POST /expenditures"
      - "POST /disclosures/{id}/distribute"
    shared_operations:
      - "all GET endpoints"
