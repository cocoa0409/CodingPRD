# =============================================================================
# Task 1939 — Hazardous Waste Generator & Manifest Management
# Large-quantity generator EHS office: waste stream profiling, generator status
# by monthly quantity, accumulation clocks & satellite limits, manifests with
# 45-day return, transporter/TSDF approval & audit, LDR notification, biennial
# report & fee, container labeling & weekly inspection log.
# =============================================================================

scenario: |
  1939. Hazardous Waste Generator & Manifest Management (large-quantity generator EHS office): waste stream profiling & characterization, generator status by monthly quantity, accumulation start date & satellite area limit, manifest creation, signature & 45-day return, transporter/TSDF approval & audit, land-disposal restriction notification, biennial report & fee, container labeling & inspection log

domain_name: hazardous-waste-generator-manifest
api_prefix: /hazwaste

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers      # generator category at 100/1000 kg; 55.0-gal satellite limit
    - cascading_side_effects       # container create -> site month total -> category flip -> report fee recompute
    - optimistic_concurrency       # OCC on WasteStream.version and WastePartner.version
    - ops_run_checkpoint           # POST /hazwaste/_clock/set_current_utc sweeps deadlines
  entity_topology: flat            # peer collections joined by FK references, no URL nesting
  state_machine_shape: cyclic      # WasteStream recharacterization loop, Manifest discrepancy loop, WastePartner suspend loop, BiennialReport amendment loop
  relationship_patterns:
    - one_to_many                  # site -> streams/areas/reports; container -> inspections; partner -> audits
    - cross_aggregate              # manifest line items reference Containers; manifest references two WastePartners
  role_model: segregation_of_duties # signer != creator; approver != registrar; inspector != last mover
  consistency_model: immediate
  difficulty_band: expert          # 10 entities / 45 endpoints; count exceeds the guideline band because the scenario's nine mandated feature areas are action-dense compliance workflows; coupling (not volume) carries the difficulty

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GeneratorSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: epa_id_number, type: string, source: input, description: "EPA identification number; unique across all sites", constraints: "unique; non-empty" }
      - { name: current_month_key, type: string, source: computed, description: "Calendar month of the logical clock, format YYYY-MM; rolled by the clock sweep" }
      - { name: current_month_generated_kg, type: number, source: computed, default: 0, description: "Sum of quantity_kg over this site's containers created in current_month_key with status != VOIDED; maintained incrementally (create +=, void -=, month rollover reset to 0)" }
      - { name: generator_category, type: enum, source: computed, default: VSQG, description: "VSQG | SQG | LQG derived from current_month_generated_kg per generator_category calculation", constraints: "VSQG | SQG | LQG" }
      - { name: open_exception_count, type: integer, source: computed, default: 0, description: "Manifests currently in EXCEPTION_REQUIRED or EXCEPTION_REPORT_FILED for this site" }
      - { name: open_discrepancy_count, type: integer, source: computed, default: 0, description: "Manifests currently in DISCREPANCY_RAISED for this site" }

  - name: WasteStream
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> GeneratorSite.id; owning site" }
      - { name: name, type: string, source: input, description: "Stream name (e.g. 'spent solvent')" }
      - { name: waste_codes, type: array, source: input, description: "Array of waste code strings, e.g. [\"D001\",\"F003\"]; may be empty before characterization" }
      - { name: physical_state, type: enum, source: input, description: "LIQUID | SOLID | SLUDGE | GAS", constraints: "LIQUID | SOLID | SLUDGE | GAS" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | CHARACTERIZED | ACTIVE | RETIRED", constraints: "DRAFT | CHARACTERIZED | ACTIVE | RETIRED" }
      - { name: is_hazardous, type: boolean, source: input, description: "Set by /characterize: determination that the stream is hazardous waste" }
      - { name: flash_point_c, type: number, source: input, description: "Set by /characterize: lab flash point in Celsius; required when is_hazardous is true" }
      - { name: ph, type: number, source: input, description: "Set by /characterize: lab pH; optional", default: null }
      - { name: ldr_treatment_standard, type: string, source: input, description: "Set by /characterize: land-disposal-restriction treatment standard code (required input on every characterize call; semantically meaningful when is_hazardous is true)" }
      - { name: characterization_version, type: integer, source: system, default: 0, description: "Increments by 1 on every successful /characterize call" }
      - { name: total_generated_kg, type: number, source: computed, default: 0, description: "Lifetime sum of quantity_kg over non-VOIDED containers of this stream" }

  - name: AccumulationArea
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> GeneratorSite.id; owning site" }
      - { name: name, type: string, source: input, description: "Area name (e.g. 'Paint booth SAA')" }
      - { name: area_type, type: enum, source: input, description: "SATELLITE | CENTRAL_90DAY", constraints: "SATELLITE | CENTRAL_90DAY" }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: waste_stream_id, type: string, source: input, description: "FK -> WasteStream.id; stream in this container" }
      - { name: accumulation_area_id, type: string, source: input, description: "FK -> AccumulationArea.id; area where the container currently sits (rewritten by /move)" }
      - { name: site_id, type: string, source: system, description: "FK -> GeneratorSite.id; derived from the accumulation area's site at creation" }
      - { name: quantity_gallons, type: number, source: input, description: "Container volume in gallons; > 0", constraints: "> 0" }
      - { name: quantity_kg, type: number, source: input, description: "Waste mass in kilograms; > 0; feeds monthly generation totals", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACCUMULATING_AT_SATELLITE | SATELLITE_LIMIT_EXCEEDED | IN_CENTRAL_ACCUMULATION | STAGED_FOR_SHIPMENT | SHIPPED | EMPTIED | VOIDED", constraints: "see state machine" }
      - { name: accumulation_start_date, type: datetime, source: system, description: "Logical-clock timestamp when the container entered central accumulation; null while purely satellite" }
      - { name: deadline_days, type: integer, source: computed, description: "Accumulation allowance snapshotted from site.generator_category at the moment accumulation_start_date is set (category-at-start variant): LQG 90, SQG 180, VSQG 180" }
      - { name: accumulation_deadline_at, type: datetime, source: computed, description: "accumulation_start_date + deadline_days; overdue iff logical now is strictly greater" }
      - { name: is_accumulation_overdue, type: boolean, source: computed, default: false, description: "now > accumulation_deadline_at while status in {IN_CENTRAL_ACCUMULATION, STAGED_FOR_SHIPMENT}" }
      - { name: satellite_exceeded_at, type: datetime, source: system, description: "Timestamp when the container pushed its satellite area's per-stream total strictly over 55.0 gal; null otherwise" }
      - { name: move_deadline_at, type: datetime, source: computed, description: "satellite_exceeded_at + 3 days; null unless SATELLITE_LIMIT_EXCEEDED" }
      - { name: is_move_late, type: boolean, source: computed, default: false, description: "True when the move to central happened after move_deadline_at" }
      - { name: is_labeled, type: boolean, source: computed, default: false, description: "Set true by a successful /label call; never cleared by later transitions" }
      - { name: label_text, type: string, source: input, description: "Set by /label; must contain the substring 'Hazardous Waste'" }
      - { name: label_accumulation_start_marked, type: datetime, source: input, description: "Set by /label; must equal accumulation_start_date exactly" }
      - { name: last_inspected_at, type: datetime, source: system, description: "Timestamp of most recent ContainerInspection; null if never inspected" }
      - { name: is_inspection_overdue, type: boolean, source: computed, default: false, description: "status in {IN_CENTRAL_ACCUMULATION, STAGED_FOR_SHIPMENT} and now - COALESCE(last_inspected_at, accumulation_start_date) > 7 days (strictly)" }
      - { name: last_action_user_id, type: string, source: system, description: "X-User-ID of the user who created or most recently moved the container; basis for inspection segregation-of-duties" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator" }
      - { name: shipped_manifest_id, type: string, source: system, description: "FK -> Manifest.id; set when the container transitioned to SHIPPED aboard that manifest; null otherwise" }

  - name: ContainerInspection
    parent: null
    common_fields: true
    fields:
      - { name: container_id, type: string, source: input, description: "FK -> Container.id; inspected container" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the inspector; must differ from container.last_action_user_id" }
      - { name: inspected_at, type: datetime, source: system, description: "Logical-clock timestamp at inspection creation" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "PASS | FAIL" }
      - { name: deficiency_note, type: string, source: input, description: "Required when result == FAIL; ignored when PASS", default: null }

  - name: WastePartner
    parent: null
    common_fields: true
    fields:
      - { name: partner_type, type: enum, source: input, description: "TRANSPORTER | TSDF", constraints: "TRANSPORTER | TSDF" }
      - { name: name, type: string, source: input, description: "Legal name" }
      - { name: epa_id_number, type: string, source: input, description: "EPA identification number; unique across all partners", constraints: "unique; non-empty" }
      - { name: permitted_waste_codes, type: array, source: input, description: "Waste codes the partner is permitted to handle; enforced for TSDF partners on manifest create/sign" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | SUSPENDED | REJECTED", constraints: "PENDING | APPROVED | SUSPENDED | REJECTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the registering ComplianceAuditor; approve requires a different user" }
      - { name: audit_coverage_start, type: datetime, source: system, description: "Start of the current audit coverage window [start, end); null until first audit" }
      - { name: audit_coverage_end, type: datetime, source: system, description: "Exclusive end of the current audit coverage window; audit current iff logical now < audit_coverage_end" }
      - { name: is_audit_current, type: boolean, source: computed, default: false, description: "audit_coverage_end is not null and logical now < audit_coverage_end" }

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - { name: waste_partner_id, type: string, source: input, description: "FK -> WastePartner.id; audited partner" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the auditing ComplianceAuditor" }
      - { name: audited_at, type: datetime, source: system, description: "Logical-clock timestamp when the audit was recorded" }
      - { name: coverage_from, type: datetime, source: input, description: "Inclusive start of the certified coverage window" }
      - { name: coverage_to, type: datetime, source: input, description: "Exclusive end of the certified coverage window; must be > coverage_from" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL", constraints: "PASS | FAIL" }

  - name: Manifest
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> GeneratorSite.id; generator site shipping the waste" }
      - { name: transporter_id, type: string, source: input, description: "FK -> WastePartner.id; partner with partner_type TRANSPORTER" }
      - { name: tsdf_id, type: string, source: input, description: "FK -> WastePartner.id; partner with partner_type TSDF" }
      - { name: manifest_tracking_number, type: string, source: input, description: "Generator-assigned tracking number; unique per site", constraints: "unique within site_id" }
      - { name: line_items, type: array, source: input, description: "Array of {waste_stream_id, container_id, quantity_kg}; at least one entry; each container must belong to this site and match the line's waste stream" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | GENERATOR_SIGNED | IN_TRANSIT | DELIVERED | DISCREPANCY_RAISED | RETURNED | EXCEPTION_REQUIRED | EXCEPTION_REPORT_FILED", constraints: "see state machine" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the WasteCoordinator creator; generator signature requires a different user" }
      - { name: generator_signed_by_user_id, type: string, source: system, description: "X-User-ID of the EHSManager who signed; null until GENERATOR_SIGNED" }
      - { name: shipped_at, type: datetime, source: system, description: "Timestamp of transporter signature; null until IN_TRANSIT" }
      - { name: return_due_at, type: datetime, source: computed, description: "shipped_at + 45 days; overdue iff logical now > return_due_at while not RETURNED" }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp of TSDF receipt; null until DELIVERED" }
      - { name: returned_at, type: datetime, source: system, description: "Timestamp of confirm-return; null until RETURNED" }
      - { name: is_return_late, type: boolean, source: computed, default: false, description: "True when confirm-return happened after return_due_at" }
      - { name: exception_note, type: string, source: system, description: "Note filed with the exception report; null until EXCEPTION_REPORT_FILED" }
      - { name: total_quantity_kg, type: number, source: computed, description: "Sum of line_items[].quantity_kg" }
      - { name: tonnage_fee_cents, type: integer, source: computed, description: "Per manifest_tonnage_fee_cents calculation: sum over lines of round_half_up(line.quantity_kg * 10.5) cents, rounded per line THEN summed" }

  - name: LDRNotification
    parent: null
    common_fields: false
    fields:
      - { name: manifest_id, type: string, source: input, description: "FK -> Manifest.id; the manifest this notice accompanies" }
      - { name: treatment_standard_codes, type: array, source: input, description: "LDR treatment standard codes covering every waste code on the manifest" }
      - { name: certification_statement, type: string, source: input, description: "Certification text; non-empty" }
      - { name: notified_at, type: datetime, source: system, description: "Logical-clock timestamp of creation" }

  - name: BiennialReport
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> GeneratorSite.id; reporting site" }
      - { name: report_year, type: integer, source: input, description: "Odd calendar year covered, e.g. 2025; period is [report_year-01-01, report_year+1-01-01)", constraints: "must be odd" }
      - { name: period_start, type: datetime, source: computed, description: "report_year-01-01T00:00:00Z (inclusive)" }
      - { name: period_end, type: datetime, source: computed, description: "(report_year+1)-01-01T00:00:00Z (exclusive)" }
      - { name: due_at, type: datetime, source: computed, description: "(report_year+1)-03-01T00:00:00Z; submission strictly after due_at is late" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ACCEPTED", constraints: "DRAFT | SUBMITTED | ACCEPTED" }
      - { name: category_snapshot, type: enum, source: computed, description: "site.generator_category read at the moment the fee was last computed", constraints: "VSQG | SQG | LQG" }
      - { name: provisional_shipped_kg, type: number, source: computed, description: "Sum of total_quantity_kg over this site's manifests with shipped_at in [period_start, period_end) and status in {IN_TRANSIT, DELIVERED, DISCREPANCY_RAISED, RETURNED, EXCEPTION_REQUIRED, EXCEPTION_REPORT_FILED}" }
      - { name: final_shipped_kg, type: number, source: computed, description: "Sum of total_quantity_kg over this site's manifests with shipped_at in [period_start, period_end) and status == RETURNED" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Fee at creation/refresh: category base + sum of tonnage_fee_cents over the provisional manifest set; no late penalty" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Fee at submit: category base + sum of tonnage_fee_cents over RETURNED manifests + late penalty (5000 cents/day, capped at 150000) when late" }
      - { name: is_late, type: boolean, source: computed, default: false, description: "submitted_at > due_at" }
      - { name: days_late, type: integer, source: computed, default: 0, description: "Whole days between due_at and submitted_at when late; 0 otherwise" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of submission; null while DRAFT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WasteStream
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: CHARACTERIZED
        trigger: "POST /hazwaste/waste-streams/{streamId}/characterize"
        actor: WasteCoordinator
        preconditions:
          - "Stream status == DRAFT or ACTIVE (ERR_INVALID_STATE otherwise)"
          - "expected_waste_stream_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "characterization_version += 1; waste stream version += 1"
          - "is_hazardous / flash_point_c / ph / ldr_treatment_standard / waste_codes overwritten"
      - from: ACTIVE
        to: CHARACTERIZED
        trigger: "POST /hazwaste/waste-streams/{streamId}/characterize (recharacterization loop)"
        actor: WasteCoordinator
        preconditions:
          - "Stream status == DRAFT or ACTIVE (ERR_INVALID_STATE otherwise)"
          - "expected_waste_stream_version matches current version (ERR_STALE_VERSION)"
        side_effects:
          - "characterization_version += 1; waste stream version += 1"
          - "Recharacterization sends an ACTIVE stream back to CHARACTERIZED; it must be re-activated before new containers reference it"
      - from: CHARACTERIZED
        to: ACTIVE
        trigger: "POST /hazwaste/waste-streams/{streamId}/activate"
        actor: EHSManager
        preconditions:
          - "Stream status == CHARACTERIZED (ERR_INVALID_STATE otherwise)"
          - "is_hazardous == true (ERR_STREAM_NOT_HAZARDOUS otherwise)"
        side_effects: []
      - from: [DRAFT, CHARACTERIZED, ACTIVE]
        to: RETIRED
        trigger: "POST /hazwaste/waste-streams/{streamId}/retire"
        actor: EHSManager
        preconditions:
          - "No container of this stream in {ACCUMULATING_AT_SATELLITE, SATELLITE_LIMIT_EXCEEDED, IN_CENTRAL_ACCUMULATION, STAGED_FOR_SHIPMENT} (ERR_STREAM_HAS_OPEN_CONTAINERS)"
        side_effects: []

  - entity: Container
    initial_state: ACCUMULATING_AT_SATELLITE
    terminal_states: [EMPTIED, VOIDED]
    transitions:
      - from: null
        to: ACCUMULATING_AT_SATELLITE
        trigger: "POST /hazwaste/containers (creation into a SATELLITE area)"
        actor: WasteCoordinator
        preconditions:
          - "Waste stream status == ACTIVE (ERR_STREAM_NOT_ACTIVE)"
          - "area.site_id == stream.site_id (ERR_CROSS_SITE_REFERENCE)"
        side_effects:
          - "site.current_month_generated_kg += quantity_kg (hop 1)"
          - "hop 1 re-evaluates generator_category; on a threshold crossing site.generator_category flips (hop 2)"
          - "hop 2 recomputes provisional_fee_cents on every DRAFT BiennialReport of this site (hop 3)"
          - "stream.total_generated_kg += quantity_kg"
          - "If the area's per-stream gallon total (statuses ACCUMULATING_AT_SATELLITE + SATELLITE_LIMIT_EXCEEDED) is now strictly > 55.0, this container immediately transitions to SATELLITE_LIMIT_EXCEEDED"
      - from: null
        to: IN_CENTRAL_ACCUMULATION
        trigger: "POST /hazwaste/containers (creation into a CENTRAL_90DAY area)"
        actor: WasteCoordinator
        preconditions:
          - "Same as satellite creation"
        side_effects:
          - "accumulation_start_date = now; deadline_days snapshotted from site.generator_category at this moment (category-at-start); accumulation_deadline_at computed"
          - "Same month-total / category / report-fee cascade as satellite creation (hops 1-3); satellite limit check not applicable"
      - from: ACCUMULATING_AT_SATELLITE
        to: SATELLITE_LIMIT_EXCEEDED
        trigger: "system (automatic when creation of another container pushes the area's per-stream total strictly over 55.0 gal — evaluated on the incoming container only)"
        actor: system
        preconditions: []
        side_effects:
          - "satellite_exceeded_at = now; move_deadline_at = now + 3 days"
      - from: [ACCUMULATING_AT_SATELLITE, SATELLITE_LIMIT_EXCEEDED]
        to: IN_CENTRAL_ACCUMULATION
        trigger: "POST /hazwaste/containers/{containerId}/move with target_area_id naming a CENTRAL_90DAY area"
        actor: WasteCoordinator
        preconditions:
          - "Target area exists, area_type == CENTRAL_90DAY (ERR_AREA_TYPE_MISMATCH), same site as the container (ERR_CROSS_SITE_REFERENCE)"
        side_effects:
          - "accumulation_area_id rewritten; accumulation_start_date = now; deadline_days snapshotted from site.generator_category at this moment; accumulation_deadline_at computed"
          - "is_move_late = (now > move_deadline_at) when moving from SATELLITE_LIMIT_EXCEEDED, else false"
          - "last_action_user_id = X-User-ID"
      - from: IN_CENTRAL_ACCUMULATION
        to: STAGED_FOR_SHIPMENT
        trigger: "POST /hazwaste/containers/{containerId}/stage"
        actor: WasteCoordinator
        preconditions:
          - "is_labeled == true (ERR_CONTAINER_NOT_LABELED)"
          - "is_inspection_overdue == false (ERR_INSPECTION_OVERDUE)"
          - "is_accumulation_overdue == false (ERR_ACCUMULATION_LIMIT_EXCEEDED)"
        side_effects: []
      - from: [ACCUMULATING_AT_SATELLITE, SATELLITE_LIMIT_EXCEEDED, IN_CENTRAL_ACCUMULATION, STAGED_FOR_SHIPMENT]
        to: VOIDED
        trigger: "POST /hazwaste/containers/{containerId}/void"
        actor: WasteCoordinator
        preconditions:
          - "shipped_manifest_id is null (ERR_INVALID_STATE if already linked to a shipped manifest)"
        side_effects:
          - "site.current_month_generated_kg -= quantity_kg when the container was created in the site's current_month_key (compensating reversal; hop 1)"
          - "hop 1 re-evaluates generator_category (hop 2); a downward crossing flips the category"
          - "hop 2 recomputes provisional_fee_cents on DRAFT BiennialReports of this site (hop 3)"
          - "stream.total_generated_kg -= quantity_kg"
      - from: STAGED_FOR_SHIPMENT
        to: SHIPPED
        trigger: "system (parent manifest reaches IN_TRANSIT via transporter signature)"
        actor: system
        preconditions: []
        side_effects:
          - "shipped_manifest_id = the manifest id"
      - from: SHIPPED
        to: EMPTIED
        trigger: "system (parent manifest reaches DELIVERED via TSDF receipt)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Manifest
    initial_state: DRAFT
    terminal_states: [RETURNED]
    transitions:
      - from: DRAFT
        to: GENERATOR_SIGNED
        trigger: "POST /hazwaste/manifests/{manifestId}/sign-generator"
        actor: EHSManager
        preconditions:
          - "Manifest status == DRAFT (ERR_MANIFEST_NOT_DRAFT)"
          - "X-User-ID != created_by_user_id (ERR_SOD_MANIFEST_SELF_SIGN)"
          - "At least one LDRNotification exists for this manifest (ERR_LDR_NOTICE_MISSING)"
          - "Every line-item container status == STAGED_FOR_SHIPMENT (ERR_CONTAINER_NOT_STAGED)"
          - "Transporter status == APPROVED and is_audit_current (ERR_PARTNER_NOT_APPROVED / ERR_PARTNER_AUDIT_STALE)"
          - "TSDF status == APPROVED and is_audit_current (ERR_PARTNER_NOT_APPROVED / ERR_PARTNER_AUDIT_STALE)"
          - "tsdf.permitted_waste_codes covers every line's stream waste_codes (ERR_TSDF_WASTE_CODE_NOT_PERMITTED)"
        side_effects:
          - "generator_signed_by_user_id = X-User-ID"
      - from: GENERATOR_SIGNED
        to: IN_TRANSIT
        trigger: "POST /hazwaste/manifests/{manifestId}/sign-transporter"
        actor: TransporterAgent
        preconditions:
          - "X-User-ID == manifest.transporter_id (ERR_PARTNER_IDENTITY_MISMATCH)"
          - "Manifest status == GENERATOR_SIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "shipped_at = now; return_due_at = now + 45 days"
          - "Each line-item container STAGED_FOR_SHIPMENT -> SHIPPED (hop 1), shipped_manifest_id set"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /hazwaste/manifests/{manifestId}/receive"
        actor: TSDFAgent
        preconditions:
          - "X-User-ID == manifest.tsdf_id (ERR_PARTNER_IDENTITY_MISMATCH)"
          - "Manifest status == IN_TRANSIT (ERR_INVALID_STATE)"
        side_effects:
          - "delivered_at = now"
          - "Each line-item container SHIPPED -> EMPTIED"
      - from: DELIVERED
        to: DISCREPANCY_RAISED
        trigger: "POST /hazwaste/manifests/{manifestId}/raise-discrepancy"
        actor: TSDFAgent
        preconditions:
          - "X-User-ID == manifest.tsdf_id (ERR_PARTNER_IDENTITY_MISMATCH)"
          - "Manifest status == DELIVERED (ERR_INVALID_STATE)"
        side_effects:
          - "site.open_discrepancy_count += 1"
      - from: DISCREPANCY_RAISED
        to: DELIVERED
        trigger: "POST /hazwaste/manifests/{manifestId}/resolve-discrepancy"
        actor: ComplianceAuditor
        preconditions:
          - "Manifest status == DISCREPANCY_RAISED (ERR_INVALID_STATE)"
        side_effects:
          - "site.open_discrepancy_count -= 1 (compensates the raise; net zero across the pair)"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /hazwaste/manifests/{manifestId}/confirm-return"
        actor: EHSManager
        preconditions:
          - "Manifest status in {DELIVERED, EXCEPTION_REQUIRED, EXCEPTION_REPORT_FILED} (ERR_INVALID_STATE)"
        side_effects:
          - "returned_at = now; is_return_late = (now > return_due_at)"
          - "If transitioning out of EXCEPTION_REQUIRED or EXCEPTION_REPORT_FILED: site.open_exception_count -= 1"
          - "Every DRAFT BiennialReport of this site whose period covers shipped_at recomputes provisional/final shipped kg and provisional_fee_cents"
      - from: EXCEPTION_REQUIRED
        to: RETURNED
        trigger: "POST /hazwaste/manifests/{manifestId}/confirm-return (late return)"
        actor: EHSManager
        preconditions:
          - "Manifest status in {DELIVERED, EXCEPTION_REQUIRED, EXCEPTION_REPORT_FILED} (ERR_INVALID_STATE)"
        side_effects:
          - "Same as DELIVERED -> RETURNED, with is_return_late = true"
      - from: EXCEPTION_REPORT_FILED
        to: RETURNED
        trigger: "POST /hazwaste/manifests/{manifestId}/confirm-return (late return after filing)"
        actor: EHSManager
        preconditions:
          - "Manifest status in {DELIVERED, EXCEPTION_REQUIRED, EXCEPTION_REPORT_FILED} (ERR_INVALID_STATE)"
        side_effects:
          - "Same as DELIVERED -> RETURNED, with is_return_late = true"
      - from: [IN_TRANSIT, DELIVERED, DISCREPANCY_RAISED]
        to: EXCEPTION_REQUIRED
        trigger: "system (clock sweep: logical now > return_due_at)"
        actor: system
        preconditions:
          - "now > return_due_at (strictly greater; at exactly return_due_at the manifest is not yet overdue)"
        side_effects:
          - "site.open_exception_count += 1 (hop 1 caused by this transition)"
          - "hop 1 keeps site.open_exception_count > 0, which gates new manifest creation for the site (ERR_OPEN_EXCEPTION_BLOCKS_MANIFEST) (hop 2)"
      - from: EXCEPTION_REQUIRED
        to: EXCEPTION_REPORT_FILED
        trigger: "POST /hazwaste/manifests/{manifestId}/file-exception-report"
        actor: ComplianceAuditor
        preconditions:
          - "Manifest status == EXCEPTION_REQUIRED (ERR_INVALID_STATE)"
        side_effects:
          - "exception_note = input note; manifest remains counted in site.open_exception_count until RETURNED"

  - entity: WastePartner
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /hazwaste/waste-partners/{partnerId}/status with to_status = APPROVED"
        actor: ComplianceAuditor
        preconditions:
          - "Partner status == PENDING or SUSPENDED (ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SOD_PARTNER_SELF_APPROVE)"
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /hazwaste/waste-partners/{partnerId}/status with to_status = APPROVED (reinstate)"
        actor: ComplianceAuditor
        preconditions:
          - "Partner status == PENDING or SUSPENDED (ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (ERR_SOD_PARTNER_SELF_APPROVE)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /hazwaste/waste-partners/{partnerId}/status with to_status = SUSPENDED"
        actor: ComplianceAuditor
        preconditions:
          - "Partner status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "Suspended partners fail the APPROVED precondition on subsequent manifest create/sign"
      - from: PENDING
        to: REJECTED
        trigger: "POST /hazwaste/waste-partners/{partnerId}/status with to_status = REJECTED"
        actor: ComplianceAuditor
        preconditions:
          - "Partner status == PENDING (ERR_INVALID_STATE)"
        side_effects: []

  - entity: BiennialReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hazwaste/biennial-reports/{reportId}/submit"
        actor: EHSManager
        preconditions:
          - "Report status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at = now; is_late and days_late computed against due_at"
          - "final_shipped_kg and final_fee_cents computed (RETURNED manifests only + late penalty)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /hazwaste/biennial-reports/{reportId}/review with outcome = ACCEPT"
        actor: ComplianceAuditor
        preconditions:
          - "Report status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /hazwaste/biennial-reports/{reportId}/review with outcome = REJECT (amendment loop)"
        actor: ComplianceAuditor
        preconditions:
          - "Report status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at cleared; provisional fee re-derived on next mutation of site category or manifest return"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; true races per the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: stream-characterize-stale-version
    parent_entity: WasteStream
    write_endpoint: "POST /hazwaste/waste-streams/{streamId}/characterize"
    occ_field: expected_waste_stream_version
    description: |
      Characterizing a WasteStream with an expected_waste_stream_version that no
      longer matches the stream's current version is rejected. This captures the
      case where another writer has just recharacterized the stream (legitimately
      superseding the prior characterization) and the current writer's view of the
      stream is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: partner-update-stale-version
    parent_entity: WastePartner
    write_endpoint: "PUT /hazwaste/waste-partners/{partnerId}"
    occ_field: expected_waste_partner_version
    description: |
      Updating a WastePartner's permitted_waste_codes or name with an
      expected_waste_partner_version that no longer matches the partner's current
      version is rejected. A writer holding a stale view would silently overwrite
      a permit change another writer just applied; the OCC check rejects the stale
      write instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_generated_kg
    trigger: "container create, container void, clock month rollover"
    algorithm: aggregation
    formula: |
      site.current_month_generated_kg =
        sum of Container.quantity_kg
        over containers with container.site_id == site.id,
        container.created_at within the site's current calendar month [month_start, next_month_start),
        and container.status != VOIDED.
      Maintained incrementally: create adds quantity_kg; void subtracts it when the
      container was created in the current month; when the logical clock crosses a
      calendar-month boundary the site resets current_month_generated_kg to 0 and
      sets current_month_key to the new month (containers created earlier keep
      counting toward their own creation month only).
    input_set: "non-VOIDED containers of the site created in the current calendar month per the logical clock"
    precision: "1 decimal place; quantities stored as given"

  - name: generator_category
    trigger: "every change to current_month_generated_kg (including month rollover reset)"
    algorithm: threshold
    formula: |
      if current_month_generated_kg >= 1000.0: category = LQG
      elif current_month_generated_kg > 100.0: category = SQG
      else: category = VSQG
      Boundaries are exact: exactly 100.0 kg stays VSQG; exactly 1000.0 kg is LQG.
    input_set: "site.current_month_generated_kg"
    constants:
      SQG_EXCLUSIVE_LOWER_KG: 100.0
      LQG_INCLUSIVE_THRESHOLD_KG: 1000.0
    precision: "threshold comparison at full stored precision"

  - name: accumulation_deadline_at
    trigger: "container enters IN_CENTRAL_ACCUMULATION (creation into central area, or move)"
    algorithm: threshold
    formula: |
      deadline_days = 90  if site.generator_category == LQG at the moment accumulation_start_date is set
                    = 180 if SQG or VSQG at that moment
      Evaluation-order pin for container creation: the creation's own month-total
      increment and category re-evaluation are applied FIRST, and only then is the
      new container's deadline_days snapshotted — a container whose own mass tips
      the site into LQG itself receives the 90-day allowance.
      accumulation_deadline_at = accumulation_start_date + deadline_days
      is_accumulation_overdue = (logical now > accumulation_deadline_at)
        while status in {IN_CENTRAL_ACCUMULATION, STAGED_FOR_SHIPMENT};
        at exactly the deadline timestamp the container is NOT overdue (strictly greater).
    input_set: "the single container; site.generator_category snapshot"
    constants:
      LQG_DEADLINE_DAYS: 90
      OTHER_DEADLINE_DAYS: 180
    precision: "whole days added to a millisecond timestamp"
    variants:
      - name: category_at_start
        when: "canonical — adopted by this scaffold"
        difference: "deadline_days snapshotted from site.generator_category at the moment accumulation_start_date is set; later category flips do NOT move an existing container's deadline"
      - name: current_category
        when: "rejected alternative a reader may plausibly implement"
        difference: "deadline_days re-derived from the site's category at evaluation time; a site that flips SQG->LQG mid-accumulation shortens the container's remaining window from 180 to 90 days and can flip is_accumulation_overdue for identical stored data — the scaffold pins category_at_start so this divergence is observable"

  - name: satellite_stream_gallons
    trigger: "container create into a SATELLITE area; container move into a SATELLITE area (not offered — moves target central only)"
    algorithm: aggregation
    formula: |
      area_stream_total =
        sum of quantity_gallons over containers with the same accumulation_area_id
        and waste_stream_id whose status in {ACCUMULATING_AT_SATELLITE, SATELLITE_LIMIT_EXCEEDED},
        INCLUDING the incoming container.
      If area_stream_total > 55.0 (strictly): the incoming container transitions to
      SATELLITE_LIMIT_EXCEEDED (satellite_exceeded_at = now, move_deadline_at = now + 3 days).
      At exactly 55.0 gal the limit is NOT exceeded.
    input_set: "containers in the same satellite area carrying the same waste stream, in satellite statuses"
    constants:
      SATELLITE_LIMIT_GAL: 55.0
      MOVE_GRACE_DAYS: 3
    precision: "1 decimal place; strict greater-than"

  - name: manifest_return_window
    trigger: "transporter signature (sets window); clock sweep (evaluates window)"
    algorithm: threshold
    formula: |
      return_due_at = shipped_at + 45 days.
      During POST /hazwaste/_clock/set_current_utc the sweep transitions every manifest
      with status in {IN_TRANSIT, DELIVERED, DISCREPANCY_RAISED} and now > return_due_at
      to EXCEPTION_REQUIRED and increments site.open_exception_count by 1 per manifest.
      At now == return_due_at exactly the manifest is NOT overdue (strictly greater).
    input_set: "manifests of all sites in {IN_TRANSIT, DELIVERED, DISCREPANCY_RAISED}"
    constants:
      RETURN_WINDOW_DAYS: 45
    precision: "whole days added to a millisecond timestamp"

  - name: manifest_tonnage_fee_cents
    trigger: "manifest creation (stored on the manifest); reused by biennial fee sums"
    algorithm: aggregation
    formula: |
      Per line item: line_cents = round_half_up(line.quantity_kg * RATE_CENTS_PER_KG)
      manifest.tonnage_fee_cents = sum of line_cents over all line items.
      PINNED ROUNDING ORDER: round each line to whole cents FIRST, then sum.
      The alternative order (sum quantities, then multiply, then round) is rejected:
      e.g. two 1.0 kg lines at 10.5 cents/kg give 11 + 11 = 22 cents under the pinned
      order but round_half_up(21.0) = 21 cents under sum-first.
    input_set: "manifest.line_items"
    constants:
      RATE_CENTS_PER_KG: 10.5
    precision: "round_half_up to whole cents per line, then integer sum"

  - name: biennial_report_fee_cents
    trigger: "report creation and category-flip cascade (provisional); report submit (final)"
    algorithm: tiered_pricing
    formula: |
      base_fee_cents = 250000 if category_snapshot == LQG
                     = 100000 if SQG
                     = 25000  if VSQG
      tonnage_cents = sum of manifest.tonnage_fee_cents over the included manifest set
      late_penalty_cents = 0 when not late, else min(LATE_CAP_CENTS, LATE_PER_DAY_CENTS * days_late)
      fee_cents = base_fee_cents + tonnage_cents + late_penalty_cents
      Evaluation order is pinned: category_snapshot is read first (at computation time),
      then the manifest set is filtered, then the late branch is applied last.
    input_set: "provisional: site manifests with shipped_at in [period_start, period_end) and status in {IN_TRANSIT, DELIVERED, DISCREPANCY_RAISED, RETURNED, EXCEPTION_REQUIRED, EXCEPTION_REPORT_FILED}; final: same window, status == RETURNED only"
    constants:
      LQG_BASE_CENTS: 250000
      SQG_BASE_CENTS: 100000
      VSQG_BASE_CENTS: 25000
      LATE_PER_DAY_CENTS: 5000
      LATE_CAP_CENTS: 150000
    precision: "integer cents; round_half_up inside line items only"
    variants:
      - name: provisional_at_draft
        when: "report creation and every site-category flip while DRAFT"
        difference: "includes shipped-but-unreturned manifests (statuses listed above); never applies a late penalty; uses the site category at computation time"
      - name: final_at_submission
        when: "POST submit"
        difference: "includes only RETURNED manifests; adds the late penalty branch when submitted_at > due_at; for identical site data the two variants differ whenever any in-period manifest is not yet RETURNED or the submission is late"

  - name: inspection_currency
    trigger: "container enters central accumulation; inspection creation; clock sweep"
    algorithm: threshold
    formula: |
      baseline = COALESCE(container.last_inspected_at, container.accumulation_start_date)
      is_inspection_overdue = (logical now - baseline > 7 days)
        while status in {IN_CENTRAL_ACCUMULATION, STAGED_FOR_SHIPMENT}.
      At exactly 7 days the container is NOT overdue (strictly greater).
    input_set: "single container"
    constants:
      INSPECTION_INTERVAL_DAYS: 7
    precision: "millisecond comparison"

  - name: audit_currency
    trigger: "audit creation; clock sweep; manifest create/sign precondition evaluation"
    algorithm: interval_merge
    formula: |
      A partner's coverage window is [audit_coverage_start, audit_coverage_end) — end EXCLUSIVE.
      is_audit_current = (audit_coverage_end is not null and logical now < audit_coverage_end).
      At now == audit_coverage_end exactly the audit is EXPIRED.
      New audit with coverage [from, to) for the same partner:
        - if it overlaps or exactly abuts the current window (from <= current_end and to >= current_start):
          merge — audit_coverage_start = min(starts), audit_coverage_end = max(ends)
        - if entirely disjoint and later: replace window with the new one
        - if entirely disjoint and earlier: rejected (ERR_AUDIT_WINDOW_REGRESSIVE)
      Overlap in the strict-interior sense (current_start < to and from < current_end) is
      rejected instead when the new audit's outcome is FAIL: ERR_AUDIT_COVERAGE_OVERLAP.
    input_set: "ComplianceAudit rows of the partner (the partner's current window fields)"
    precision: "millisecond comparison; half-open intervals"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role names a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Ownership: TransporterAgent's X-User-ID equals manifest.transporter_id (sign-transporter); TSDFAgent's X-User-ID equals manifest.tsdf_id (receive, raise-discrepancy)"
    error_id: ERR_PARTNER_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /hazwaste/manifests/{id}/sign-transporter, POST /hazwaste/manifests/{id}/receive, POST /hazwaste/manifests/{id}/raise-discrepancy"
  - priority: 4
    category: existence
    check: "Path and body-referenced ids exist, validated left-to-right (site, stream, area, container, partner, manifest, report)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 5
    category: request_shape
    check: "Request body well-formed: required fields present, types match, enum members valid, unknown request fields rejected, quantity > 0, report_year is an odd integer (else ERR_REPORT_YEAR_NOT_ODD), coverage_to > coverage_from, inspection result FAIL carries deficiency_note (else ERR_INSPECTION_NOTE_REQUIRED)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutation endpoints
    note: "ERR_REPORT_YEAR_NOT_ODD and ERR_INSPECTION_NOTE_REQUIRED are domain members of this band and win over the generic ERR_INVALID_REQUEST when they apply"
  - priority: 6
    category: concurrency
    check: "OCC: expected_waste_stream_version / expected_waste_partner_version equals the entity's current version (evaluated before state and business rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hazwaste/waste-streams/{id}/characterize, PUT /hazwaste/waste-partners/{id}"
  - priority: 7
    category: state
    check: "Target entity in a valid from-state for the requested transition; terminal states reject everything (ERR_ALREADY_TERMINAL). Members: ERR_INVALID_STATE, ERR_ALREADY_TERMINAL, ERR_MANIFEST_NOT_DRAFT (sign-generator), ERR_STREAM_NOT_HAZARDOUS (activate), ERR_CONTAINER_NOT_STAGED (line-item container not STAGED_FOR_SHIPMENT at manifest create or sign)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints and manifest create/sign
    note: "When both a generic and a specific state error apply, the specific one wins"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: manifest generator signer's X-User-ID must differ from manifest.created_by_user_id"
    error_id: ERR_SOD_MANIFEST_SELF_SIGN
    http_status: 403
    applies_to: "POST /hazwaste/manifests/{id}/sign-generator"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: partner approver's X-User-ID must differ from partner.created_by_user_id"
    error_id: ERR_SOD_PARTNER_SELF_APPROVE
    http_status: 403
    applies_to: "POST /hazwaste/waste-partners/{id}/status with to_status=APPROVED"
  - priority: 10
    category: business_safety
    check: "Segregation of duties: inspector's X-User-ID must differ from container.last_action_user_id"
    error_id: ERR_SOD_SELF_INSPECTION
    http_status: 403
    applies_to: "POST /hazwaste/containers/{id}/inspections"
  - priority: 11
    category: business_safety
    check: "TSDF permit: tsdf.permitted_waste_codes covers every waste code of every line item's waste stream"
    error_id: ERR_TSDF_WASTE_CODE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /hazwaste/manifests, POST /hazwaste/manifests/{id}/sign-generator"
  - priority: 12
    category: business_safety
    check: "LDR artifact: at least one LDRNotification exists for the manifest before generator signature"
    error_id: ERR_LDR_NOTICE_MISSING
    http_status: 409
    applies_to: "POST /hazwaste/manifests/{id}/sign-generator"
  - priority: 13
    category: business_safety
    check: "Label content: label_text contains the substring 'Hazardous Waste'"
    error_id: ERR_LABEL_MISSING_HAZARD_TEXT
    http_status: 400
    applies_to: "POST /hazwaste/containers/{id}/label"
  - priority: 14
    category: business_safety
    check: "Label content: label_accumulation_start_marked equals the container's accumulation_start_date exactly"
    error_id: ERR_LABEL_START_DATE_MISMATCH
    http_status: 400
    applies_to: "POST /hazwaste/containers/{id}/label"
  - priority: 15
    category: business_safety
    check: "Stage gate: container is_labeled == true"
    error_id: ERR_CONTAINER_NOT_LABELED
    http_status: 409
    applies_to: "POST /hazwaste/containers/{id}/stage"
  - priority: 16
    category: business_referential
    check: "Same-site coherence: line-item container's site == manifest.site_id; container create: area.site_id == stream.site_id; container move: target area's site == container's site"
    error_id: ERR_CROSS_SITE_REFERENCE
    http_status: 409
    applies_to: "POST /hazwaste/manifests, POST /hazwaste/containers, POST /hazwaste/containers/{id}/move"
  - priority: 17
    category: business_referential
    check: "Line integrity: line-item container.waste_stream_id == the line's waste_stream_id"
    error_id: ERR_LINE_CONTAINER_MISMATCH
    http_status: 400
    applies_to: "POST /hazwaste/manifests"
  - priority: 18
    category: business_referential
    check: "Partner role integrity: transporter_id references a partner with partner_type == TRANSPORTER; tsdf_id references partner_type == TSDF"
    error_id: ERR_PARTNER_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /hazwaste/manifests"
  - priority: 19
    category: business_constraint
    check: "Waste stream status == ACTIVE when a container is created against it; retire blocked while the stream has containers in non-terminal states (ERR_STREAM_HAS_OPEN_CONTAINERS)"
    error_id: ERR_STREAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /hazwaste/containers, POST /hazwaste/waste-streams/{id}/retire"
  - priority: 20
    category: business_constraint
    check: "Move target area area_type == CENTRAL_90DAY"
    error_id: ERR_AREA_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /hazwaste/containers/{id}/move"
  - priority: 21
    category: business_constraint
    check: "Transporter and TSDF both have status == APPROVED"
    error_id: ERR_PARTNER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /hazwaste/manifests, POST /hazwaste/manifests/{id}/sign-generator"
  - priority: 22
    category: business_constraint
    check: "Uniqueness: epa_id_number unique across sites and (separately) across partners; manifest_tracking_number unique within a site (ERR_DUPLICATE_TRACKING_NUMBER)"
    error_id: ERR_DUPLICATE_EPA_ID
    http_status: 409
    applies_to: "POST /hazwaste/generator-sites, POST /hazwaste/waste-partners, POST /hazwaste/manifests"
  - priority: 23
    category: business_constraint
    check: "One BiennialReport per site per odd-year grid cell: a second report for the same (site_id, report_year) is rejected"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /hazwaste/biennial-reports"
  - priority: 24
    category: business_constraint
    check: "Site has open_exception_count == 0 when a new manifest is created for it"
    error_id: ERR_OPEN_EXCEPTION_BLOCKS_MANIFEST
    http_status: 409
    applies_to: "POST /hazwaste/manifests"
  - priority: 25
    category: business_temporal
    check: "Audit currency: transporter and TSDF is_audit_current == true (logical now < audit_coverage_end)"
    error_id: ERR_PARTNER_AUDIT_STALE
    http_status: 409
    applies_to: "POST /hazwaste/manifests, POST /hazwaste/manifests/{id}/sign-generator"
  - priority: 26
    category: business_temporal
    check: "Stage gate: now <= accumulation_deadline_at (container not past its 90/180-day limit)"
    error_id: ERR_ACCUMULATION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /hazwaste/containers/{id}/stage"
  - priority: 27
    category: business_temporal
    check: "Stage gate: now - COALESCE(last_inspected_at, accumulation_start_date) <= 7 days"
    error_id: ERR_INSPECTION_OVERDUE
    http_status: 409
    applies_to: "POST /hazwaste/containers/{id}/stage"
  - priority: 28
    category: business_temporal
    check: "Audit windows: FAIL-outcome audit whose [coverage_from, coverage_to) strictly overlaps the partner's current window is rejected (ERR_AUDIT_COVERAGE_OVERLAP); disjoint-and-earlier window rejected (ERR_AUDIT_WINDOW_REGRESSIVE); overlap-or-abut PASS windows merge"
    error_id: ERR_AUDIT_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /hazwaste/waste-partners/{id}/audits"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Generator sites ---
  - method: POST
    path: "/hazwaste/generator-sites"
    description: "Register a generator site"
    roles: [EHSManager]
    code: 201
    input: [name, epa_id_number]
    output: GeneratorSite
    side_effects: ["status=ACTIVE; current_month_key = logical clock month; category=VSQG; counters 0"]
  - method: GET
    path: "/hazwaste/generator-sites"
    description: "List generator sites (paginated)"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "GeneratorSite[]"
    side_effects: []
  - method: GET
    path: "/hazwaste/generator-sites/{siteId}"
    description: "Get one generator site including computed category and counters"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: []
    output: GeneratorSite
    side_effects: []

  # --- Waste streams ---
  - method: POST
    path: "/hazwaste/waste-streams"
    description: "Create a waste stream (starts DRAFT)"
    roles: [WasteCoordinator]
    code: 201
    input: [site_id, name, waste_codes, physical_state]
    output: WasteStream
    side_effects: ["status=DRAFT; characterization_version=0"]
  - method: GET
    path: "/hazwaste/waste-streams"
    description: "List waste streams, optionally filtered by site"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: "WasteStream[]"
    side_effects: []
  - method: GET
    path: "/hazwaste/waste-streams/{streamId}"
    description: "Get one waste stream"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: []
    output: WasteStream
    side_effects: []
  - method: POST
    path: "/hazwaste/waste-streams/{streamId}/characterize"
    description: "Characterize/recharacterize a stream (OCC-guarded supersede of the prior characterization); allowed from DRAFT or ACTIVE and lands on CHARACTERIZED"
    roles: [WasteCoordinator]
    code: 200
    input: [is_hazardous, waste_codes, ldr_treatment_standard, expected_waste_stream_version, "flash_point_c?", "ph?"]
    output: WasteStream
    side_effects: ["status -> CHARACTERIZED; characterization_version += 1; increments WasteStream.version by 1"]
  - method: POST
    path: "/hazwaste/waste-streams/{streamId}/activate"
    description: "Activate a characterized hazardous stream"
    roles: [EHSManager]
    code: 200
    input: []
    output: WasteStream
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/hazwaste/waste-streams/{streamId}/retire"
    description: "Retire a stream with no open containers"
    roles: [EHSManager]
    code: 200
    input: []
    output: WasteStream
    side_effects: ["status -> RETIRED"]

  # --- Accumulation areas ---
  - method: POST
    path: "/hazwaste/accumulation-areas"
    description: "Create an accumulation area (SATELLITE or CENTRAL_90DAY)"
    roles: [WasteCoordinator]
    code: 201
    input: [site_id, name, area_type]
    output: AccumulationArea
    side_effects: []
  - method: GET
    path: "/hazwaste/accumulation-areas"
    description: "List accumulation areas, optionally filtered by site"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: "AccumulationArea[]"
    side_effects: []
  - method: GET
    path: "/hazwaste/accumulation-areas/{areaId}"
    description: "Get one accumulation area"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: []
    output: AccumulationArea
    side_effects: []

  # --- Containers ---
  - method: POST
    path: "/hazwaste/containers"
    description: "Place a new waste container into an area; triggers month-total cascade and satellite-limit evaluation"
    roles: [WasteCoordinator]
    code: 201
    input: [waste_stream_id, accumulation_area_id, quantity_gallons, quantity_kg]
    output: Container
    side_effects:
      - "site.current_month_generated_kg += quantity_kg; generator_category re-evaluated; on flip, DRAFT BiennialReports of the site recompute provisional_fee_cents"
      - "stream.total_generated_kg += quantity_kg"
      - "central-area creation sets accumulation_start_date/deadline; satellite creation may auto-transition to SATELLITE_LIMIT_EXCEEDED"
  - method: GET
    path: "/hazwaste/containers"
    description: "List containers, optionally filtered by stream and/or area"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: ["waste_stream_id?", "accumulation_area_id?", "site_id?", "shipped_manifest_id?", "limit?", "offset?"]
    output: "Container[]"
    side_effects: []
  - method: GET
    path: "/hazwaste/containers/{containerId}"
    description: "Get one container including computed deadline/overdue fields"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: []
    output: Container
    side_effects: []
  - method: POST
    path: "/hazwaste/containers/{containerId}/move"
    description: "Move a satellite container into a CENTRAL_90DAY area; starts the 90/180-day accumulation clock"
    roles: [WasteCoordinator]
    code: 200
    input: [target_area_id]
    output: Container
    side_effects: ["status -> IN_CENTRAL_ACCUMULATION; accumulation_start_date=now; deadline_days snapshotted from site category; is_move_late computed; last_action_user_id updated"]
  - method: POST
    path: "/hazwaste/containers/{containerId}/label"
    description: "Affix the hazardous-waste label; label_text must contain 'Hazardous Waste' and the marked start date must equal accumulation_start_date"
    roles: [WasteCoordinator]
    code: 200
    input: [label_text, label_accumulation_start_marked]
    output: Container
    side_effects: ["is_labeled=true on success"]
  - method: POST
    path: "/hazwaste/containers/{containerId}/stage"
    description: "Stage a central-accumulation container for shipment"
    roles: [WasteCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status -> STAGED_FOR_SHIPMENT"]
  - method: POST
    path: "/hazwaste/containers/{containerId}/void"
    description: "Void a container never shipped; reverses its month-total contribution"
    roles: [WasteCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status -> VOIDED; month total decremented when created in current month; category re-evaluated; DRAFT report provisional fees recomputed on flip"]
  - method: POST
    path: "/hazwaste/containers/{containerId}/inspections"
    description: "Record a weekly inspection; inspector must differ from the container's last_action_user_id"
    roles: [WasteCoordinator]
    code: 201
    input: [result, "deficiency_note?"]
    output: ContainerInspection
    side_effects: ["container.last_inspected_at = now; is_inspection_overdue recomputed"]
  - method: GET
    path: "/hazwaste/containers/{id}/inspections"
    description: "List a container's inspection log"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "ContainerInspection[]"
    side_effects: []

  # --- Waste partners (transporters & TSDFs) ---
  - method: POST
    path: "/hazwaste/waste-partners"
    description: "Register a transporter or TSDF (starts PENDING)"
    roles: [ComplianceAuditor]
    code: 201
    input: [partner_type, name, epa_id_number, permitted_waste_codes]
    output: WastePartner
    side_effects: ["status=PENDING; created_by_user_id recorded"]
  - method: GET
    path: "/hazwaste/waste-partners/{partnerId}"
    description: "Get one waste partner including audit currency"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: []
    output: WastePartner
    side_effects: []
  - method: PUT
    path: "/hazwaste/waste-partners/{partnerId}"
    description: "Update partner name/permitted codes (OCC-guarded)"
    roles: [ComplianceAuditor]
    code: 200
    input: [expected_waste_partner_version, "name?", "permitted_waste_codes?"]
    output: WastePartner
    side_effects: ["increments WastePartner.version by 1"]
  - method: POST
    path: "/hazwaste/waste-partners/{partnerId}/status"
    description: "Approve (PENDING/SUSPENDED->APPROVED, segregated from registrar), suspend (APPROVED->SUSPENDED), or reject (PENDING->REJECTED)"
    roles: [ComplianceAuditor]
    code: 200
    input: [to_status]
    output: WastePartner
    side_effects: ["status transition per state machine"]
  - method: POST
    path: "/hazwaste/waste-partners/{partnerId}/audits"
    description: "Record a compliance audit with a coverage window; overlapping/abutting PASS windows merge"
    roles: [ComplianceAuditor]
    code: 201
    input: [coverage_from, coverage_to, outcome]
    output: ComplianceAudit
    side_effects: ["partner audit_coverage_start/audit_coverage_end updated per audit_currency calculation; is_audit_current recomputed"]
  - method: GET
    path: "/hazwaste/waste-partners/{id}/audits"
    description: "List a partner's audit history"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "ComplianceAudit[]"
    side_effects: []

  # --- Manifests ---
  - method: POST
    path: "/hazwaste/manifests"
    description: "Create a manifest for staged containers; validates permits, approvals, audit currency, and cross-site references"
    roles: [WasteCoordinator]
    code: 201
    input: [site_id, transporter_id, tsdf_id, manifest_tracking_number, line_items]
    output: Manifest
    side_effects: ["status=DRAFT; total_quantity_kg and tonnage_fee_cents computed"]
  - method: GET
    path: "/hazwaste/manifests"
    description: "List manifests, optionally filtered by site, transporter, or TSDF"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: ["site_id?", "transporter_id?", "tsdf_id?", "limit?", "offset?"]
    output: "Manifest[]"
    side_effects: []
  - method: GET
    path: "/hazwaste/manifests/{manifestId}"
    description: "Get one manifest"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: []
    output: Manifest
    side_effects: []
  - method: POST
    path: "/hazwaste/manifests/{manifestId}/ldr-notifications"
    description: "Attach the land-disposal-restriction notification to a DRAFT manifest"
    roles: [EHSManager]
    code: 201
    input: [treatment_standard_codes, certification_statement]
    output: LDRNotification
    side_effects: ["notified_at = logical now"]
  - method: GET
    path: "/hazwaste/manifests/{id}/ldr-notifications"
    description: "List LDR notifications for a manifest"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: []
    output: "LDRNotification[]"
    side_effects: []
  - method: POST
    path: "/hazwaste/manifests/{manifestId}/sign-generator"
    description: "Generator signature (EHSManager, not the creator); revalidates permits, approvals, audit currency, LDR notice, and container staging"
    roles: [EHSManager]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status -> GENERATOR_SIGNED; generator_signed_by_user_id recorded"]
  - method: POST
    path: "/hazwaste/manifests/{manifestId}/sign-transporter"
    description: "Transporter signature at pickup; starts the 45-day return window and ships the containers"
    roles: [TransporterAgent]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status -> IN_TRANSIT; shipped_at/return_due_at set; line containers STAGED_FOR_SHIPMENT -> SHIPPED"]
  - method: POST
    path: "/hazwaste/manifests/{manifestId}/receive"
    description: "TSDF receipt; empties the containers"
    roles: [TSDFAgent]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status -> DELIVERED; delivered_at set; line containers SHIPPED -> EMPTIED"]
  - method: POST
    path: "/hazwaste/manifests/{manifestId}/raise-discrepancy"
    description: "TSDF raises a quantity/type discrepancy on a delivered manifest"
    roles: [TSDFAgent]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status -> DISCREPANCY_RAISED; site.open_discrepancy_count += 1"]
  - method: POST
    path: "/hazwaste/manifests/{manifestId}/resolve-discrepancy"
    description: "Resolve an open discrepancy; compensates the site counter"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status -> DELIVERED; site.open_discrepancy_count -= 1"]
  - method: POST
    path: "/hazwaste/manifests/{manifestId}/confirm-return"
    description: "Generator confirms the signed manifest copy came back from the TSDF; closes the 45-day window (late flag when past due)"
    roles: [EHSManager]
    code: 200
    input: []
    output: Manifest
    side_effects: ["status -> RETURNED; returned_at/is_return_late set; open_exception_count decremented when leaving exception states; covering DRAFT BiennialReports recompute"]
  - method: POST
    path: "/hazwaste/manifests/{manifestId}/file-exception-report"
    description: "File the 45-day exception report for an overdue manifest"
    roles: [ComplianceAuditor]
    code: 200
    input: [exception_note]
    output: Manifest
    side_effects: ["status -> EXCEPTION_REPORT_FILED"]

  # --- Biennial reports ---
  - method: POST
    path: "/hazwaste/biennial-reports"
    description: "Open a biennial report for a site and odd report year; one report per site per 2-year grid cell; provisional fee computed at creation"
    roles: [EHSManager]
    code: 201
    input: [site_id, report_year]
    output: BiennialReport
    side_effects: ["period/due dates derived; provisional_shipped_kg and provisional_fee_cents computed"]
  - method: GET
    path: "/hazwaste/biennial-reports"
    description: "List biennial reports, optionally filtered by site"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: "BiennialReport[]"
    side_effects: []
  - method: GET
    path: "/hazwaste/biennial-reports/{reportId}"
    description: "Get one biennial report"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor, TransporterAgent, TSDFAgent]
    code: 200
    input: []
    output: BiennialReport
    side_effects: []
  - method: POST
    path: "/hazwaste/biennial-reports/{reportId}/submit"
    description: "Submit the report; computes final fee (RETURNED manifests only) and late penalty"
    roles: [EHSManager]
    code: 200
    input: []
    output: BiennialReport
    side_effects: ["status -> SUBMITTED; submitted_at/is_late/days_late/final_fee_cents computed"]
  - method: POST
    path: "/hazwaste/biennial-reports/{reportId}/review"
    description: "Regulator review: ACCEPT -> ACCEPTED, REJECT -> back to DRAFT for amendment"
    roles: [ComplianceAuditor]
    code: 200
    input: [outcome]
    output: BiennialReport
    side_effects: ["status -> ACCEPTED or DRAFT per outcome"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/hazwaste/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the clock never falls back to wall-clock time. Sweep side effects: month rollover (reset month totals, recompute categories), manifest 45-day exception transitions, accumulation/inspection overdue flags, audit currency flags"
    roles: [EHSManager, WasteCoordinator, ComplianceAuditor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sweep per description; cascades spelled out in manifest/exception transitions"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_PARTNER_IDENTITY_MISMATCH, http: 403, condition: "TransporterAgent/TSDFAgent X-User-ID does not equal the manifest's transporter_id/tsdf_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, non-positive quantity, even report_year, coverage_to <= coverage_from" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Entity in a terminal state (RETIRED/EMPTIED/VOIDED/RETURNED/ACCEPTED/REJECTED) rejects all further transitions" }
  - { id: ERR_MANIFEST_NOT_DRAFT, http: 409, condition: "sign-generator requires manifest status DRAFT" }
  - { id: ERR_STREAM_NOT_HAZARDOUS, http: 409, condition: "activate requires characterization with is_hazardous == true" }
  - { id: ERR_STREAM_NOT_ACTIVE, http: 409, condition: "Container creation requires waste stream status ACTIVE" }
  - { id: ERR_STREAM_HAS_OPEN_CONTAINERS, http: 409, condition: "Retire blocked while containers of the stream sit in non-terminal states" }
  - { id: ERR_SOD_MANIFEST_SELF_SIGN, http: 403, condition: "Generator signer X-User-ID equals manifest created_by_user_id" }
  - { id: ERR_SOD_PARTNER_SELF_APPROVE, http: 403, condition: "Partner approver X-User-ID equals partner created_by_user_id" }
  - { id: ERR_SOD_SELF_INSPECTION, http: 403, condition: "Inspector X-User-ID equals container.last_action_user_id" }
  - { id: ERR_TSDF_WASTE_CODE_NOT_PERMITTED, http: 409, condition: "TSDF permitted_waste_codes does not cover a line item's stream waste codes" }
  - { id: ERR_LDR_NOTICE_MISSING, http: 409, condition: "sign-generator with no LDRNotification attached to the manifest" }
  - { id: ERR_CONTAINER_NOT_LABELED, http: 409, condition: "stage requires is_labeled == true" }
  - { id: ERR_LABEL_MISSING_HAZARD_TEXT, http: 400, condition: "label_text lacks the substring 'Hazardous Waste'" }
  - { id: ERR_LABEL_START_DATE_MISMATCH, http: 400, condition: "label_accumulation_start_marked does not equal the container's accumulation_start_date" }
  - { id: ERR_CROSS_SITE_REFERENCE, http: 409, condition: "Referenced container/area/stream belongs to a different site than the operation's site" }
  - { id: ERR_LINE_CONTAINER_MISMATCH, http: 400, condition: "line_items entry's container.waste_stream_id != line's waste_stream_id" }
  - { id: ERR_PARTNER_TYPE_MISMATCH, http: 409, condition: "transporter_id references a partner with partner_type != TRANSPORTER, or tsdf_id one with != TSDF" }
  - { id: ERR_PARTNER_NOT_APPROVED, http: 409, condition: "Manifest create/sign requires transporter and TSDF status APPROVED" }
  - { id: ERR_PARTNER_AUDIT_STALE, http: 409, condition: "Manifest create/sign requires is_audit_current on both partners" }
  - { id: ERR_AREA_TYPE_MISMATCH, http: 409, condition: "Move target area must be CENTRAL_90DAY" }
  - { id: ERR_CONTAINER_NOT_STAGED, http: 409, condition: "Manifest create/sign requires every line-item container STAGED_FOR_SHIPMENT" }
  - { id: ERR_ACCUMULATION_LIMIT_EXCEEDED, http: 409, condition: "stage blocked: now > accumulation_deadline_at" }
  - { id: ERR_INSPECTION_OVERDUE, http: 409, condition: "stage blocked: last inspection (or accumulation start) more than 7 days ago" }
  - { id: ERR_INSPECTION_NOTE_REQUIRED, http: 400, condition: "Inspection result FAIL without deficiency_note" }
  - { id: ERR_OPEN_EXCEPTION_BLOCKS_MANIFEST, http: 409, condition: "Manifest creation blocked while site.open_exception_count > 0" }
  - { id: ERR_REPORT_YEAR_NOT_ODD, http: 400, condition: "report_year is not an odd integer" }
  - { id: ERR_DUPLICATE_EPA_ID, http: 409, condition: "epa_id_number already registered (sites share one namespace; partners share another)" }
  - { id: ERR_DUPLICATE_TRACKING_NUMBER, http: 409, condition: "manifest_tracking_number already used on another manifest of the same site" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "A BiennialReport already exists for this site and report_year grid cell" }
  - { id: ERR_AUDIT_COVERAGE_OVERLAP, http: 409, condition: "FAIL-outcome audit window overlaps the partner's existing coverage window" }
  - { id: ERR_AUDIT_WINDOW_REGRESSIVE, http: 409, condition: "Audit window disjoint and entirely earlier than the current coverage window" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EHSManager
    description: "Site EHS manager: certifies/signs regulated documents — stream activation, manifest generator signature, LDR notices, biennial reports, site registration"
    identity: opaque
    exclusive_operations:
      - "POST /hazwaste/generator-sites"
      - "POST /hazwaste/waste-streams/{id}/activate"
      - "POST /hazwaste/waste-streams/{id}/retire"
      - "POST /hazwaste/manifests/{id}/ldr-notifications"
      - "POST /hazwaste/manifests/{id}/sign-generator"
      - "POST /hazwaste/manifests/{id}/confirm-return"
      - "POST /hazwaste/biennial-reports"
      - "POST /hazwaste/biennial-reports/{id}/submit"
    shared_operations:
      - "All GET endpoints"
      - "POST /hazwaste/_clock/set_current_utc"

  - name: WasteCoordinator
    description: "EHS coordinator: operates waste handling — streams, areas, containers, labels, inspections, manifest drafting"
    identity: opaque
    exclusive_operations:
      - "POST /hazwaste/waste-streams"
      - "POST /hazwaste/waste-streams/{id}/characterize"
      - "POST /hazwaste/accumulation-areas"
      - "POST /hazwaste/containers"
      - "POST /hazwaste/containers/{id}/move"
      - "POST /hazwaste/containers/{id}/label"
      - "POST /hazwaste/containers/{id}/stage"
      - "POST /hazwaste/containers/{id}/void"
      - "POST /hazwaste/containers/{id}/inspections"
      - "POST /hazwaste/manifests"
    shared_operations:
      - "All GET endpoints"
      - "POST /hazwaste/_clock/set_current_utc"

  - name: ComplianceAuditor
    description: "Compliance auditor: registers/approves/audits transporters and TSDFs, resolves discrepancies, files exception reports, reviews biennial reports"
    identity: opaque
    exclusive_operations:
      - "POST /hazwaste/waste-partners"
      - "PUT /hazwaste/waste-partners/{id}"
      - "POST /hazwaste/waste-partners/{id}/status"
      - "POST /hazwaste/waste-partners/{id}/audits"
      - "POST /hazwaste/manifests/{id}/resolve-discrepancy"
      - "POST /hazwaste/manifests/{id}/file-exception-report"
      - "POST /hazwaste/biennial-reports/{id}/review"
    shared_operations:
      - "All GET endpoints"
      - "POST /hazwaste/_clock/set_current_utc"

  - name: TransporterAgent
    description: "Driver/agent of the transport partner; may only countersign manifests whose transporter_id equals the agent's X-User-ID"
    identity: "entity_backed:WastePartner"
    exclusive_operations:
      - "POST /hazwaste/manifests/{id}/sign-transporter"
    shared_operations:
      - "All GET endpoints"

  - name: TSDFAgent
    description: "Receiving agent of the disposal facility; may only receive/flag manifests whose tsdf_id equals the agent's X-User-ID"
    identity: "entity_backed:WastePartner"
    exclusive_operations:
      - "POST /hazwaste/manifests/{id}/receive"
      - "POST /hazwaste/manifests/{id}/raise-discrepancy"
    shared_operations:
      - "All GET endpoints"
