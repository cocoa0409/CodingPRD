            - { call: "POST /briefs/${br_id}/publish", payload: {}, as: BrandManager, captures: { br_v: $.data.version } }
            - { call: "POST /briefs/${br_id}/pitches", payload: { creator_id: "${c_id}", proposed_fee_cents: 100000, concept_note: "x", expected_brief_version: "${br_v}" }, as: TalentManager, captures: { p_id: $.data.id } }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "SHORTLIST" }, as: BrandManager }
            - { call: "POST /pitches/${p_id}/brand-action", payload: { action: "ACCEPT" }, as: BrandManager, captures: { d_id: $.data.deal_id } }
            - { call: "GET /deals/${d_id}", payload: {}, as: BrandManager, captures: { d_v: $.data.version } }
            - { call: "POST /deals/${d_id}/propose-terms", payload: { fee_base_cents: 100000, expected_deal_version: "${d_v}" }, as: BrandManager }
            - { call: "POST /deals/${d_id}/creator-respond", payload: { action: "ACCEPT" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deals/${d_id}/brand-respond", payload: { action: "ACCEPT" }, as: Brand, as_user_id: "${b_id}" }
            - { call: "POST /deals/${d_id}/deliverables", payload: { platform: "YOUTUBE", due_date: "2026-08-10T00:00:00Z", scheduled_publish_date: "2026-08-03T10:00:00Z" }, as: BrandManager, captures: { dl_id: $.data.id } }
            - { call: "POST /deliverables/${dl_id}/submit", payload: {}, as: Creator, as_user_id: "${c_id}" }
            - { call: "POST /deliverables/${dl_id}/review", payload: { action: "APPROVE" }, as: BrandManager, as_user_id: "bm_1" }
            - { call: "POST /deliverables/${dl_id}/publish", payload: { content_url: "https://yt/6" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "GET /deliverables/${dl_id}/disclosure-checks", payload: {}, as: ComplianceOfficer, captures: { dc_id: "$.data[0].id" } }
            - { call: "POST /disclosure-checks/${dc_id}/review", payload: { action: "PASS", has_ad_hashtag: true, verbal_disclosure: true, platform_tool_used: true }, as: ComplianceOfficer, as_user_id: "co_1" }
