  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rescission_restores_property_committed_pace_principal
        grounds:
          - state_machines.FinancingAgreement.SIGNED_to_RESCINDED
          - entities.Property.fields.committed_pace_principal_cents
          - calculations.committed_pace_principal_rollup
          - errors[ERR_AGREEMENT_STATE_INVALID]
        distinguishing_aspect: |
          Conserved quantity = Property.committed_pace_principal_cents, the FORWARD-LOOKING pipeline
          exposure of a parcel. Signing adds financed_amount_cents to it and rescission must subtract
          exactly the same number, returning the parcel to its pre-signature exposure of 0 while
          simultaneously reversing three collateral side effects (application, measures, certificate).
          A naive implementation that recomputes the rollup but leaves the agreement in SIGNED, or that
          zeroes the field instead of subtracting, drifts as soon as a second agreement exists.
        test_recipe:
          setup:
            - "Clock 2026-08-12: Fixture A parcel (assessed 40000000, senior 25000000) with solar 3000000/220000 and hvac 1200000/100000, approved principal 4200000, financed 4314500."
            - "The agreement is signed on 2026-08-12, so rescission_expires_at is 2026-08-18T00:00:00Z (three program business days, then midnight of the next day)."
            - "On 2026-08-13 the contractor files a completion certificate for both measures and the owner signs it, so there is live downstream paperwork for the compensation to unwind. No disbursement is ever released, which is what keeps the rescission legal."
            - "The owner rescinds on 2026-08-14, comfortably inside the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/products"
              payload: { product_code: "HVAC_HEATPUMP", category: "HVAC", useful_life_years: 18, max_annual_savings_cents: 120000, requires_permit: true }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_hvac: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000, preferred_language: "EN" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id, committed_before: $.data.committed_pace_principal_cents }
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 25000000, recorded_on: "2019-03-14" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { l1: $.data.id }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3000000, estimated_annual_savings_cents: 220000, expected_application_version: "${a1_v0}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_solar: $.data.id }
            - call: "GET /pace/applications/${a1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1_v1: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_hvac}", installed_cost_cents: 1200000, estimated_annual_savings_cents: 100000, expected_application_version: "${a1_v1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { m_hvac: $.data.id }
            - call: "POST /pace/applications/${a1}/submit"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
            - call: "POST /pace/applications/${a1}/underwrite"
              payload: { decision: "PROCEED", valuation_basis: "ASSESSED" }
