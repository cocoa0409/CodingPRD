          assert:
            - "Subscription.${sub_id}.outstanding_balance_cents == 50000 after release (equals pre-hold value, zero drift)"
            - "WeeklyBox.${box_w5_id}.status == SCHEDULED"

      - name: addon_attach_then_detach_conserves_committed_count
        grounds:
          - entities.AddOn.fields.committed_count
          - entities.AddOn.fields.weekly_supply_cap
          - entities.SubscriptionAddOn.fields.status
        distinguishing_aspect: |
          Conserved quantity = AddOn.committed_count (a different conserved quantity, a discrete supply counter rather
          than a money balance). Attaching an add-on (committed_count +1) paired with its detach (committed_count −1)
          MUST return committed_count to its pre-attach value (0), with no leaked supply unit.
        test_recipe:
          setup:
            - "OPEN season, add-on EGGS weekly_supply_cap 5 committed_count 0; a CONFIRMED subscription; add-on attached then detached"
          setup_api_calls:
            - call: "POST /seasons"
