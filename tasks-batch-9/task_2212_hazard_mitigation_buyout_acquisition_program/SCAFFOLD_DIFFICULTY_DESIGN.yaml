              payload: { name: "Gamma Wrecking", license_no: "DEM-G", asbestos_certified: true, max_concurrent_work_orders: 1 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ctr: $.data.id }
            - call: "POST /parcels/${p1}/demolition-work-orders"
              payload: { parcel_id: "${p1}", contractor_id: "${ctr}", asbestos_survey_status: "CLEARED", scheduled_start: "2026-10-05T08:00:00Z", scheduled_end: "2026-10-06T17:00:00Z" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { wo: $.data.id }
            - call: "POST /demolition-work-orders/${wo}/utility-disconnections"
              payload: { work_order_id: "${wo}", utility_type: "WATER", provider_name: "Riverbend Water" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dc_water: $.data.id }
            - call: "POST /demolition-work-orders/${wo}/utility-disconnections"
              payload: { work_order_id: "${wo}", utility_type: "ELECTRIC", provider_name: "Riverbend Power" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dc_electric: $.data.id }
            - call: "POST /demolition-work-orders/${wo}/utility-disconnections"
              payload: { work_order_id: "${wo}", utility_type: "GAS", provider_name: "Riverbend Gas" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dc_gas: $.data.id }
            - call: "POST /demolition-work-orders/${wo}/utility-disconnections"
              payload: { work_order_id: "${wo}", utility_type: "SEWER", provider_name: "Riverbend Sewer" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { dc_sewer: $.data.id }
            - call: "POST /utility-disconnections/${dc_water}/resolve"
              payload: { disconnection_id: "${dc_water}", outcome: "CONFIRMED", confirmation_reference: "W-1" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /utility-disconnections/${dc_electric}/resolve"
              payload: { disconnection_id: "${dc_electric}", outcome: "CONFIRMED", confirmation_reference: "E-1" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /utility-disconnections/${dc_gas}/resolve"
              payload: { disconnection_id: "${dc_gas}", outcome: "CONFIRMED", confirmation_reference: "G-1" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /utility-disconnections/${dc_sewer}/resolve"
              payload: { disconnection_id: "${dc_sewer}", outcome: "CONFIRMED", confirmation_reference: "S-1" }
