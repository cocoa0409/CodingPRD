  - rule_id: boundary_precision_check
    instances:
      - name: substantial_test_met_at_exact_threshold_then_not_met_one_cent_above
        grounds:
          - calculations.substantial_rehabilitation_test
          - calculations.ratable_credit_schedule
          - entities.Project.fields.substantial_test_threshold_cents
          - concurrency_rules[basis-revision-stale-project]
        distinguishing_aspect: |
          Numeric-threshold boundary on the cents metric, reached through
          PATCH /projects/{id}: qre_total_final_cents == 210000000 against a threshold
          of exactly 210000000 is MET (the comparison is `>=`), and raising the
          threshold by a single cent to 210000001 flips it to NOT_MET.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "A project with adjusted_basis_cents = 250000000 and two in-period QRE costs totalling 210000000, so the test starts NOT_MET."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /properties"
              payload: { name: "Elm Mill", street_address: "120 Elm Street", city: "Dayton", state_code: "OH", year_built: 1912, listing_status: "INDIVIDUAL_LISTED" }
