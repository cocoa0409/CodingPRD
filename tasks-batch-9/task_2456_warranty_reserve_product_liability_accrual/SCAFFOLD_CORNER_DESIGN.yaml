  # ===========================================================================
  - section: validations
    instances:
      - name: corner_duplicate_family_code_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "family_code is unique globally, so a second POST with the same code returns 409 ERR_DUPLICATE_CODE while a different code succeeds."
        test_recipe:
          setup:
            - "One ProductFamily with family_code FAM-DUP exists."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-DUP", name: "Duplicate Platform", launch_date: "2025-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 12000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_dup_id: $.data.id }
          trigger:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-DUP", name: "Second Duplicate Platform", launch_date: "2025-02-01", base_warranty_months: 12, standard_cost_per_claim_cents: 9000, reserve_cap_cents: 9000000 }
              as: WarrantyAnalyst
              captures: { err_dup: $.data.error_id }
          assert:
            - "The trigger call returns 409 with error_id ERR_DUPLICATE_CODE"
            - "GET /warranty/product-families reports total_count == 1 and the surviving row is ${fam_dup_id} with name \"Duplicate Platform\""

      - name: corner_self_analog_reference_on_patch_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_SELF_ANALOG_REFERENCE]
        distinguishing_aspect: "PATCH setting analog_family_id to the family's own id returns 422 ERR_SELF_ANALOG_REFERENCE — the FK resolves (so priority 6 passes) and only the self-reference check fires."
        test_recipe:
          setup:
            - "One ProductFamily with analog_family_id null."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-SR", name: "Self Reference Platform", launch_date: "2025-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 12000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_sr_id: $.data.id }
          trigger:
            - call: "PATCH /warranty/product-families/${fam_sr_id}"
              payload: { analog_family_id: "${fam_sr_id}" }
              as: WarrantyAnalyst
              captures: { err_self: $.data.error_id }
          assert:
