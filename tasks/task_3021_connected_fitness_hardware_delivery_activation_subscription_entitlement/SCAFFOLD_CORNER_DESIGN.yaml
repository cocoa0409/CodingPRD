          assert:
            - "ClassEnrollment.${ce1}.status == COMPLETED with completion_grade == FULL_CREDIT because completion_pct is 100"
            - "ClassEnrollment.${ce1}.integrity_points == 150 with integrity_flagged == false (captured as ${pts_150} and ${flag_150}), since 150 is below the 200 discipline cap"
            - "ClassEnrollment.${ce2}.integrity_points == 200 with integrity_flagged == false (captured as ${pts_250} and ${flag_250}), the cap biting at exactly the discipline ceiling while 250 is still within the INDULGENT benchmark"
            - "ClassEnrollment.${ce3}.integrity_points == 0 with integrity_flagged == true (captured as ${pts_601} and ${flag_601}), because 601 exceeds the INDULGENT benchmark of ends_at + 600 seconds"
            - "Device.${d_id}.total_workouts == 3 and Membership.${m_id}.total_streams_observed == 3 after all three completions"
            - "ClassSession.${s_id}.live_enrollment_count == 0 because COMPLETED rows are excluded from the open-enrollment count"
  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated_before_any_existence_check
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "With no X-User-Role header at all, the auth clause at priority 1 fires before the existence clause at priority 3, so a request naming a non-existent membership still returns 401 rather than 404."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database: the addressed membership id does not exist either."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /fitness/memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NoSuchRole
              captures: { err_auth: $.data.error_id }
          assert:
            - "the response status is 401 with error_id ERR_UNAUTHENTICATED (captured as ${err_auth})"
            - "the response is NOT 404 ERR_RESOURCE_NOT_FOUND even though the addressed id is also absent, because priority 1 outranks priority 3"
            - "response_type is error and data carries only error_id and message"

      - name: missing_required_field_returns_invalid_request_before_the_existence_clause
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A request that is simultaneously missing a required field and pointing at an absent parent must surface the payload-shape failure, so the shape clause within priority 3 is evaluated before the existence clause."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /fitness/memberships/00000000-0000-4000-8000-000000000000/household-users"
              payload: { email: "ghost@x.com" }
              as: MembershipOwner
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err_shape: $.data.error_id }
          assert:
            - "the response status is 400 with error_id ERR_INVALID_REQUEST (captured as ${err_shape})"
            - "the response is NOT 404 ERR_RESOURCE_NOT_FOUND, so the payload-shape failure outranks the missing-parent failure inside priority 3"
            - "re-sending with display_name present and the same absent parent now returns 404 ERR_RESOURCE_NOT_FOUND"

      - name: owner_cannot_pause_a_foreign_membership
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.MembershipOwner.identity
        distinguishing_aspect: "MembershipOwner is entity_backed by Membership, so X-User-ID naming membership A while addressing membership B is refused at the authorization clause even when every business precondition holds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Membership A is fully provisioned and ACTIVE with a verified OWNER and a delivered linked device; membership B is a second PROVISIONAL membership with no users."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
            - *c_a_sched
            - *c_k_deliver
            - *c_a_start
            - *c_a_complete
            - *c_d_get
            - *c_d_link
            - *c_m_get
            - *c_m_act
            - call: "POST /fitness/memberships"
              payload: { household_name: "Rhone Household", billing_email: "r@x.com", plan_tier: "PLUS", monthly_fee_cents: 6000 }
              as: MembershipOwner
              captures: { m2_id: $.data.id }
            - call: "GET /fitness/memberships/${m2_id}"
              payload: {}
              as: PlatformAdmin
              captures: { m2_v: $.data.version }
          trigger:
            - call: "POST /fitness/memberships/${m2_id}/pause"
              payload: { pause_start_at: "2026-09-01T00:00:00Z", pause_end_at: "2026-10-01T00:00:00Z", expected_membership_version: "${m2_v}" }
              as: MembershipOwner
              as_user_id: "${m_id}"
              captures: { err_foreign: $.data.error_id }
          assert:
            - "the call returns 403 ERR_UNAUTHORIZED (captured as ${err_foreign}) because X-User-ID names membership ${m_id} while the path addresses ${m2_id}"
            - "Membership.${m2_id}.status stays PROVISIONAL, so the authorization clause fired before the state clause for the very same request"
            - "the identical request with as_user_id equal to ${m2_id} then succeeds and Membership.${m2_id}.status becomes PAUSED"

      - name: part_reservation_for_a_foreign_sku_returns_part_sku_mismatch
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_PART_SKU_MISMATCH]
        distinguishing_aspect: "A TREAD-compatible part reserved against a BIKE device is refused on the referential compatibility clause, a different category pair than the safety and fiscal rows exercised elsewhere."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T13:30:00Z. A delivered BIKE device with a DISPATCHED cosmetic order, and a TREAD-compatible part restocked to 5."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
