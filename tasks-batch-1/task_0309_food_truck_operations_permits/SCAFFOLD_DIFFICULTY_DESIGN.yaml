              as: Dispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Future Eve", starts_at: "2026-06-17T18:00:00.000Z", ends_at: "2026-06-17T23:00:00.000Z" }
              as: Dispatcher
              captures: { event_id: $.data.id }
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { truck_v: $.data.version }
            - call: "POST /bookings"
              payload: { truck_id: "${truck_id}", spot_id: "${spot_id}", event_id: "${event_id}", window_start: "2026-06-17T19:00:00.000Z", window_end: "2026-06-17T22:00:00.000Z", expected_truck_version: "${truck_v}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { booking_id: $.data.id }
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { bal_after_book: $.data.reservation_fee_balance_cents }
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
