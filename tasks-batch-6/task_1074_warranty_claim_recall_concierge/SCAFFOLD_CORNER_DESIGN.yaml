        distinguishing_aspect: "POST /recall-notices is exclusive to ManufacturerAgent; a HouseholdOwner attempting it returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A manufacturer and a household with an owner."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "r1@x.test", display_name: "R1" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
          trigger:
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "Z", serial_range_start: 1, serial_range_end: 2, severity: "LOW", remedy_type: "REPAIR", effective_from: "2025-01-01T00:00:00Z", effective_to: "2025-02-01T00:00:00Z" }
