            - call: "POST /plans/${plan_id}/reopen"
              payload: {}
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
              captures: { opens: $.data.comment_window_opens_on, closes: $.data.comment_window_closes_on, sub: $.data.submitted_on }
          assert:
            - "second open-comment re-stamps: comment_window_opens_on == 2026-08-31 and comment_window_closes_on == 2026-09-30 (30 calendar days)"
            - "submitted_on == 2026-08-31 and preferred_portfolio_id is re-pinned only at the NEXT submit-for-review (null until then)"

