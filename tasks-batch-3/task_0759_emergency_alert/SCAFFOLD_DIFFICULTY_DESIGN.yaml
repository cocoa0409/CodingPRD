            - "dispatch -> HTTP 422, data.error_id == ERR_ACCESSIBILITY_UNMET"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: geo_radius_inclusive_boundary_on_preview
        grounds:
          - calculations.geo_target_match
          - entities.Alert.fields.radius_m
        distinguishing_aspect: "METRIC=distance via POST /alerts/{id}/preview: a subscription at distance 1113 m is INCLUDED when radius_m=1113 (<=), EXCLUDED when radius_m=1112 (>); estimated_reach 1 vs 0."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; contact c1 with CONFIRMED SMS and an ACTIVE GEO subscription centred at (0.0,0.0); two GEO alerts centred at (0.0,0.01) — a_in radius 1113 m, a_out radius 1112 m (matching distance is 1113 m)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "Hal", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550009" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GEO", center_lat: 0.0, center_lon: 0.0, radius_m: 500 }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "In", severity: "WARNING", channels: ["SMS"], target_type: "GEO", center_lat: 0.0, center_lon: 0.01, radius_m: 1113, effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a_in: "$.data.id" } }
            - { call: "POST /alerts/${a_in}/localizations", payload: { language: "EN", message_text: "In." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts", payload: { title: "Out", severity: "WARNING", channels: ["SMS"], target_type: "GEO", center_lat: 0.0, center_lon: 0.01, radius_m: 1112, effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a_out: "$.data.id" } }
            - { call: "POST /alerts/${a_out}/localizations", payload: { language: "EN", message_text: "Out." }, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "POST /alerts/${a_in}/preview", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { est_in: "$.data.estimated_reach" } }
            - { call: "POST /alerts/${a_out}/preview", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { est_out: "$.data.estimated_reach" } }
          assert:
            - "POST /alerts/${a_in}/preview -> data.estimated_reach == 1"
            - "POST /alerts/${a_out}/preview -> data.estimated_reach == 0"

      - name: throttle_capacity_count_boundary_on_dispatch
        grounds:
          - calculations.gateway_window_count
          - validations[priority=10]
          - entities.Gateway.fields.capacity_per_window
        distinguishing_aspect: "METRIC=count via POST /alerts/{id}/dispatch: with capacity_per_window=1, a projected window_count of 1 (==cap) is allowed, projected 2 (cap+1) is rejected with ERR_THROTTLE_EXCEEDED — a distinct endpoint and metric from the geo boundary."
        test_recipe:
          setup:
            - "Clock 2026-03-10T14:00:00Z; SMS gateway capacity_per_window=1; contact cA in group gA, contact cB in group gB, each with CONFIRMED SMS; alert a1 (GROUP=gA) and a2 (GROUP=gB) both approved (WARNING)."
          setup_api_calls:
