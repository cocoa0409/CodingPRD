            - { call: "POST /cable-diagnostics/repair-splices", payload: { fault_record_id: "${f}", excavation_order_id: "${e}", splice_type: "COLD_SHRINK", cost_cents: 200040 }, as: FaultCrewLead, captures: { sp: "$.data.id" } }
            - { call: "POST /cable-diagnostics/repair-splices/${sp}/start", as: FaultCrewLead }
