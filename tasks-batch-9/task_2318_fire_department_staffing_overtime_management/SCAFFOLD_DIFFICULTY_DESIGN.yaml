              payload: { duty_shift_id: "${sh47}", firefighter_id: "${ff47b}", apparatus_id: "${eng47}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh47_v1}" }
              as: CompanyOfficer
