              captures: { veh_hi: $.data.id }
            - call: "POST /vpc/vehicles/${veh_lo}/damage-surveys"
              payload: { line_items: [{ damage_zone: "BODY_PANEL", severity_points: 40, repair_estimate_cents: 40000 }, { damage_zone: "GLASS", severity_points: 30, repair_estimate_cents: 20000 }] }
              as: DamageSurveyor
