  - rule_id: compensating_invariant
    instances:
      - name: subscription_slot_conserved_across_activate_terminate
        grounds:
          - calculations.subscription_commitment
          - state_machines.TransactionFile.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Conserved quantity: Subscription.included_files_used (a slot counter). Forward action (SUBSCRIPTION
          file create, +1) paired with its compensating action (termination before any document reaches
          ACCEPTED, -1) leaves the counter exactly at its pre-cycle value.
        test_recipe:
          setup:
            - "Coordinator with ACTIVE subscription (quota 2); included_files_used == 0 before the cycle"
          setup_api_calls:
            - call: "POST /tc/coordinators"
              payload: { full_name: "Casey Coord", email: "casey@tc.example", license_number: "TC-1001" }
              as: SystemAdmin
