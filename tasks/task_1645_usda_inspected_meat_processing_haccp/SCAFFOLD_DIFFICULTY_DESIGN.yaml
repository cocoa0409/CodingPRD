            - { call: "POST /lots/${lot1}/cut-records", payload: { primal_type: "RIB", weight_lbs: 200.0625 }, as: ProductionManager }
            - { call: "POST /lots/${lot1}/cut-records", payload: { primal_type: "LOIN", weight_lbs: 200.0625 }, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 8, live_weight_lbs: 9800 }, as: ProductionManager, captures: { lot2: $.data.id } }
            - { call: "POST /lots/${lot2}/pass-ante-mortem", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /lots/${lot2}/harvest", payload: { hot_carcass_weight_lbs: 900.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot2}/chill-complete", payload: { cold_carcass_weight_lbs: 850.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot2}/fabricate", payload: {}, as: ProductionManager }
            - { call: "POST /lots/${lot2}/cut-records", payload: { primal_type: "CHUCK", weight_lbs: 400.0 }, as: ProductionManager }
          trigger:
            - { call: "POST /lots/${lot1}/complete-fabrication", payload: { trim_waste_lbs: 399.8125 }, as: ProductionManager, captures: { lot1_status: $.data.status, lot1_cuts: $.data.total_cut_weight_lbs } }
            - { call: "POST /lots/${lot2}/complete-fabrication", payload: { trim_waste_lbs: 449.0 }, as: ProductionManager, captures: { err: $.data.error_id } }
            - { call: "GET /lots/${lot2}", as: ProductionManager, captures: { lot2_status: $.data.status, lot2_yield: $.data.fabrication_yield_pct } }
          assert:
            - "lot1 conserves mass: total_cut_weight_lbs 600.1875 + trim_waste_lbs 399.8125 == cold_carcass_weight_lbs 1000.0 exactly -> status FABRICATED"
            - "lot2: |400.0 + 449.0 - 850.0| = 1.0 > 0.5 tolerance -> error_id == ERR_MASS_BALANCE_VIOLATION"
            - "lot2 remains FABRICATING and fabrication_yield_pct == null (no partial write from the rejected close-out)"

      - name: cooler_occupancy_create_ship_conservation
        grounds:
          - calculations.cooler_occupancy
          - state_machines.FinishedLot.PRODUCED_to_SHIPPED
          - entities.Plant.fields.cooler_occupied_lbs
        distinguishing_aspect: |
          Conserved quantity: cooler storage allocation (a different quantity type than
          carcass mass). Create adds exactly total_weight_lbs and the compensating ship
          removes exactly the same amount; occupied + free == cooler_capacity_lbs at
          every step and never goes negative.
        test_recipe:
          setup:
            - "Plant (capacity 10000), EFFECTIVE plan, inspector ON_PREMISE, OPEN day, FABRICATED lot, APPROVED label; FinishedLot F1 of 1000.0 lbs stored"
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-R", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan_id}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /production-days/${day_id}/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: ProductionManager, captures: { lot_id: $.data.id } }
            - { call: "POST /lots/${lot_id}/pass-ante-mortem", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /lots/${lot_id}/harvest", payload: { hot_carcass_weight_lbs: 1030.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/chill-complete", payload: { cold_carcass_weight_lbs: 1000.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/fabricate", payload: {}, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/cut-records", payload: { primal_type: "CHUCK", weight_lbs: 600.0 }, as: ProductionManager }
            - { call: "POST /lots/${lot_id}/complete-fabrication", payload: { trim_waste_lbs: 400.0 }, as: ProductionManager }
            - { call: "POST /plants/${plant_id}/label-approvals", payload: { product_name: "Ground Beef 80/20", claims: ["NATURAL"], substantiation_doc_refs: ["doc-nat-1"], formulation_version: 1 }, as: QAManager, captures: { label_id: $.data.id } }
            - { call: "POST /label-approvals/${label_id}/submit", payload: {}, as: QAManager }
            - { call: "POST /label-approvals/${label_id}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /production-days/${day_id}/finished-lots", payload: { source_lot_id: "${lot_id}", label_approval_id: "${label_id}", units_produced: 100, unit_weight_lbs: 10.0, shelf_life_days: 10 }, as: ProductionManager, captures: { fl1_id: $.data.id, fl1_total: $.data.total_weight_lbs } }
          trigger:
            - { call: "GET /plants/${plant_id}", as: PlantAdmin, captures: { occ_after_create: $.data.cooler_occupied_lbs } }
            - { call: "POST /finished-lots/${fl1_id}/ship", payload: {}, as: ProductionManager, captures: { fl1_status: $.data.status } }
            - { call: "GET /plants/${plant_id}", as: PlantAdmin, captures: { occ_after_ship: $.data.cooler_occupied_lbs } }
            - { call: "POST /production-days/${day_id}/finished-lots", payload: { source_lot_id: "${lot_id}", label_approval_id: "${label_id}", units_produced: 50, unit_weight_lbs: 10.0, shelf_life_days: 10 }, as: ProductionManager, captures: { fl2_id: $.data.id } }
            - { call: "GET /plants/${plant_id}", as: PlantAdmin, captures: { occ_after_second: $.data.cooler_occupied_lbs } }
          assert:
            - "after create: cooler_occupied_lbs == 1000.0 (exactly F1.total_weight_lbs)"
            - "after ship (compensating action): cooler_occupied_lbs == 0.0 and FinishedLot.${fl1_id}.status == SHIPPED"
            - "after second create: cooler_occupied_lbs == 500.0 — create/ship pairs move exactly total_weight_lbs each way, occupied + free == 10000 at every step"
