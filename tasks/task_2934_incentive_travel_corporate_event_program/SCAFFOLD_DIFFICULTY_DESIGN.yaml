scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: cancellation_exposure_attrition_vs_deposit_forfeiture_divergence
    grounds:
    - §1.3 cancellation_exposure_projection.variants[attrition_basis] and [deposit_forfeiture_basis]
    - §1.3 room_night_ledger (attrition_floor_room_nights, shortfall_room_nights)
    - §1.5 GET /supplier-contracts/{contract_id}/exposure-projection (attrition_basis_cents, deposit_forfeiture_basis_cents,
      binding_basis, binding_exposure_cents)
    - §1.1 SupplierContract.exposure_basis, attrition_allowance_bp, force_majeure_clause
    - §1.1 DepositMilestone.sequence, due_at, amount_cents, refundable_bp
    distinguishing_aspect: |-
      On one EXECUTED 12-room x 5-night contract at 38500/night with attrition_allowance_bp 2000, room_nights_confirmed 10, the deposit schedule {1: 577500 due 2026-08-15 refundable_bp 10000 PAID, 2: 577500 due 2026-09-15 refundable_bp 5000 PAID, 3: 1155000 due 2026-10-15 refundable_bp 0 SCHEDULED} and force_majeure_clause STANDARD at logical_now 2026-09-20, the same GET must report attrition_basis_cents 1463000 and deposit_forfeiture_basis_cents 1732500 in the same response body, with binding_exposure_cents equal to 1463000 because exposure_basis is ATTRITION_BASIS.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default until the explicit advance to
        2026-09-20T00:00:00Z.
      - One program on budget 5000000 with the PLATINUM/GOLD tier ladder, Lisbon selected at per_person_cost_cents
        431757.
      - Contract C1 EXECUTED with exposure_basis ATTRITION_BASIS, three deposit milestones summing to
        exactly the contract value 2310000.
      - Milestones 1 and 2 PAID, milestone 3 still SCHEDULED; two WINNER registrations CONFIRMED for 5
        room-nights each.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 5000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: PLATINUM
          tier_rank: 1
          qualification_threshold: 250000000
          budget_per_qualifier_cents: 2500000
          guest_allowance: 1
          air_cabin_class: BUSINESS
          upgrade_allowance_cents: 150000
          service_load_bp: 1275
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: GOLD
          tier_rank: 2
          qualification_threshold: 150000000
          budget_per_qualifier_cents: 1600000
          guest_allowance: 1
          air_cabin_class: PREMIUM_ECONOMY
          upgrade_allowance_cents: 40000
          service_load_bp: 800
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t2_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Lisbon
          country_code: PT
          per_person_cost_cents: 431757
          risk_score: 35
          air_gateway_code: LIS
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d1_id: $.data.id
      - call: POST /destinations
        payload:
          program_id: ${p_id}
          city: Seville
          country_code: ES
          per_person_cost_cents: 388000
          risk_score: 28
          air_gateway_code: SVQ
        as: SourcingManager
        as_user_id: sm-01
        captures:
          d2_id: $.data.id
      - call: POST /destinations/${d1_id}/site-inspection
        payload:
          inspection_score: 82
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /destinations/${d1_id}/shortlist
        payload: {}
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-1001
          full_name: Ana Reyes
          baseline_metric: 180000000
          actual_metric: 260000000
          guest_count: 1
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qa_id: $.data.id
      - call: POST /qualifiers/${qa_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-2001
          full_name: Ben Ortiz
          baseline_metric: 120000000
          actual_metric: 155000000
          guest_count: 0
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qb_id: $.data.id
      - call: POST /qualifiers/${qb_id}/review
        payload: {}
        as: SalesOpsAnalyst
        as_user_id: so-01
      - call: POST /programs/${p_id}/advance
        payload:
          to_status: SOURCING
        as: ProgramDirector
        as_user_id: pd-01
      - call: POST /supplier-contracts
        payload:
          program_id: ${p_id}
          destination_id: ${d1_id}
          supplier_name: Estoril Palace
          supplier_kind: HOTEL
          room_block_count: 12
          contracted_nights: 5
          stay_start_at: '2026-11-08T00:00:00Z'
          nightly_rate_cents: 38500
          attrition_allowance_bp: 2000
          force_majeure_clause: STANDARD
          exposure_basis: ATTRITION_BASIS
        as: SourcingManager
        as_user_id: sm-01
        captures:
          c1_id: $.data.id
      - call: POST /deposit-milestones
        payload:
          contract_id: ${c1_id}
          sequence: 1
          due_at: '2026-08-15T00:00:00Z'
          amount_cents: 577500
          refundable_bp: 10000
        as: SourcingManager
        as_user_id: sm-01
        captures:
          m1_id: $.data.id
      - call: POST /deposit-milestones
        payload:
          contract_id: ${c1_id}
          sequence: 2
          due_at: '2026-09-15T00:00:00Z'
          amount_cents: 577500
          refundable_bp: 5000
        as: SourcingManager
        as_user_id: sm-01
        captures:
          m2_id: $.data.id
      - call: POST /deposit-milestones
        payload:
          contract_id: ${c1_id}
          sequence: 3
          due_at: '2026-10-15T00:00:00Z'
          amount_cents: 1155000
          refundable_bp: 0
        as: SourcingManager
        as_user_id: sm-01
        captures:
          m3_id: $.data.id
      - call: POST /supplier-contracts/${c1_id}/negotiate
        payload:
          action: PROPOSE
          note: opening room block and rate
        as: SourcingManager
        as_user_id: sm-01
      - call: POST /supplier-contracts/${c1_id}/execute
        payload: {}
        as: ContractApprover
        as_user_id: ca-01
      - call: POST /deposit-milestones/${m1_id}/pay
        payload: {}
        as: ContractApprover
        as_user_id: ca-02
      - call: POST /deposit-milestones/${m2_id}/pay
        payload: {}
        as: ContractApprover
        as_user_id: ca-02
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-20T00:00:00Z'
        as: ProgramDirector
        as_user_id: pd-01
      - call: POST /programs/${p_id}/notify-qualifiers
        payload: {}
        as: ProgramDirector
        as_user_id: pd-01
      - call: POST /programs/${p_id}/gross-up-policy
        payload:
          gross_up_policy: FULL_GROSS_UP
        as: ProgramDirector
        as_user_id: pd-01
      - call: POST /programs/${p_id}/advance
        payload:
          to_status: REGISTRATION_OPEN
        as: ProgramDirector
        as_user_id: pd-01
      - call: GET /programs/${p_id}
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          pv1: $.data.version
      - call: POST /registrations
        payload:
          qualifier_id: ${qa_id}
          registration_kind: WINNER
          arrival_date: '2026-11-08T00:00:00Z'
          departure_date: '2026-11-13T00:00:00Z'
          rooms: 1
          expected_program_version: ${pv1}
        as: TravelDesk
        as_user_id: td-01
        captures:
          ra_id: $.data.id
      - call: POST /registrations/${ra_id}/respond
        payload:
          response: ACCEPT
          waiver_signed: true
        as: Participant
        as_user_id: ${qa_id}
      - call: POST /registrations/${ra_id}/confirm
        payload: {}
        as: TravelDesk
        as_user_id: td-01
      - call: GET /programs/${p_id}
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          pv2: $.data.version
      - call: POST /registrations
        payload:
          qualifier_id: ${qb_id}
          registration_kind: WINNER
          arrival_date: '2026-11-08T00:00:00Z'
          departure_date: '2026-11-13T00:00:00Z'
          rooms: 1
          expected_program_version: ${pv2}
        as: TravelDesk
        as_user_id: td-01
        captures:
          rb_id: $.data.id
      - call: POST /registrations/${rb_id}/respond
        payload:
          response: ACCEPT
        as: Participant
        as_user_id: ${qb_id}
      - call: POST /registrations/${rb_id}/confirm
        payload: {}
        as: TravelDesk
        as_user_id: td-01
      trigger:
      - GET /supplier-contracts/${c1_id}/exposure-projection as ContractApprover ca-01.
      assert:
      - contract_value_cents == 2310000 (12 * 5 * 38500).
      - room_nights_blocked == 60 and room_nights_confirmed == 10.
      - attrition_floor_room_nights == 48 (ceil(60 * 8000 / 10000)) and shortfall_room_nights == 38.
      - attrition_basis_cents == 1463000 (38 * 38500) — variant A, computed with no reference to the deposit
        schedule.
      - deposit_pre_relief_cents == 2310000 (577500 matured + 577500 matured + 1155000 unmatured at refundable_bp
        0).
      - force_majeure_relief_bp == 2500 and deposit_forfeiture_basis_cents == 1732500 (round_half_up(2310000
        * 7500 / 10000)) — variant B.
      - The two variants diverge by exactly 269500 cents on identical stored data.
      - binding_basis == "ATTRITION_BASIS" and binding_exposure_cents == 1463000, NOT 1732500.
      - GET /programs/${p_id} shows cancellation_exposure_cents == 1463000 (the binding variant only).
  - name: gross_up_flat_supplemental_variant_on_travelled_winner
    grounds:
    - §1.3 taxable_award_gross_up.variants[flat_supplemental]
    - §1.3 taxable_award_base (BUSINESS_PURPOSE_EXCLUSION_BP 1500)
    - §1.5 POST /tax-award-reports
    - §1.1 TaxAwardReport.gross_up_method, combined_rate_bp, gross_up_cents, reported_value_cents
    - §1.1 Program.gross_up_policy
    distinguishing_aspect: |-
      With Program.gross_up_policy FLAT_SUPPLEMENTAL locked before registration opened and a travelled GOLD winner whose taxable_award_cents is 443198, the drafted report must carry combined_rate_bp 2200, gross_up_cents 97504 and reported_value_cents 540702 — the linear federal-only variant, with no FICA and no tiered state component.
