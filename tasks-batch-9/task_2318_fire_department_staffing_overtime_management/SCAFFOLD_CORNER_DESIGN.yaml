  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_parent_versions_are_refused_on_all_three_occ_write_paths
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-duty-shift]
