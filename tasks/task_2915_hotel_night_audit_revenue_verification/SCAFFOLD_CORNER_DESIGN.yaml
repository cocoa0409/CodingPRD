              as_user_id: "u_admin_1"
              captures: { prop_id: "$.data.id" }
            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id", period_id: "$.data.accounting_period_id" }
            - call: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/seal-charges"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/verify-settlements"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/balance"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd_v: "$.data.version" }
            - call: "POST /night-audit/revenue-reports"
              payload: { business_date_id: "${bd1_id}", recipient_role_list: ["Controller"], expected_business_date_version: "${bd_v}" }
              as: RevenueManager
              as_user_id: "u_rm_1"
              captures: { report_a_id: "$.data.id" }
            - call: "POST /night-audit/revenue-reports"
              payload: { business_date_id: "${bd1_id}", recipient_role_list: ["Controller", "RevenueManager"], expected_business_date_version: "${bd_v}" }
              as: RevenueManager
              as_user_id: "u_rm_1"
              captures: { report_b_id: "$.data.id" }
            - call: "POST /night-audit/revenue-reports/${report_b_id}/distribute"
              payload: {}
              as: RevenueManager
              as_user_id: "u_rm_1"
            - call: "POST /night-audit/business-dates/${bd1_id}/close"
              payload: {}
              as: NightAuditor
              as_user_id: "u_na_1"
          trigger: "POST /night-audit/business-dates/${bd1_id}/reopen as Controller (X-User-ID u_ctl_1)."
          assert:
            - "Before the trigger, GET /night-audit/revenue-reports/${report_a_id} already reads status == \"SUPERSEDED\" (report B replaced it) and ${report_b_id} reads \"DISTRIBUTED\"."
            - "HTTP 200 with status == \"REOPENED\" and reopen_count == 1."
            - "GET /night-audit/revenue-reports/${report_b_id} now reads status == \"SUPERSEDED\" - the DISTRIBUTED child was cascaded."
            - "GET /night-audit/revenue-reports/${report_a_id} is byte-for-byte unchanged, same version as before the reopen: an already-terminal child is not re-superseded and does not get a second version bump."
            - "GET /night-audit/accounting-periods/${period_id} reads subsystem_total_amount == 0.00 - the reopened date stopped contributing."
            - "POST /night-audit/business-dates/${bd1_id}/close fails 409 ERR_DATE_NOT_BALANCED, and after a fresh balance it fails 409 ERR_REPORT_NOT_DISTRIBUTED until a third report is created and distributed."
            - "POST /night-audit/accounting-periods/${period_id}/tie-out with gl_control_total_amount 0.00 fails 409 ERR_PERIOD_HAS_OPEN_DATES while the date sits in REOPENED."

      - name: state_cascade_down_period_tie_out_over_child_dates
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: period_tie_out_gated_on_every_child_date_being_closed
          rationale: "The parent-to-children cascade in this domain is the AccountingPeriod tie-out: it is gated on every child BusinessDate already being CLOSED or ARCHIVED and, on success, archives exactly the CLOSED ones. The §1.8 instance already drives a period with a mixed set of child dates through ERR_PERIOD_HAS_OPEN_DATES and then through the successful archive sweep, asserting which children moved and which were left alone, so a separate breadth instance would repeat the same walk with the same ids."

      - name: state_compensation_allowance_reversal_undoes_its_side_effects
        claim_type: compensation
        excluded_because:
          difficulty_instance: allowance_reversal_restores_net_money_but_not_gross_totals
          rationale: "Allowance reversal is the only declared undo transition, and its interesting property is precisely that compensation is partial by design - net money returns to the pre-allowance figure while the gross charges_total_amount deliberately does not. The §1.8 instance asserts every restored and every deliberately-unrestored field on both the folio and the BusinessDate, which is strictly more than the generic 'all side effects reversed, no drift' claim."

      - name: state_guarded_transitions_room_run_gated_on_comp_paperwork
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: revoking_comp_paperwork_breaks_tomorrows_audit_without_rewriting_yesterday
          rationale: "The scaffold's cross-entity transition guard is the OPEN to ROOM_POSTING precondition that every IN_HOUSE comp folio hold an ACTIVE COMP_ROOM document covering the date. The §1.8 instance drives exactly that guard from both sides - a date that posts cleanly, then a revoked document that blocks the next date while leaving the already-posted lines untouched - so the guarded-transition claim is fully covered there."

