  # =========================================================================
  # SECTION: rbac
  # =========================================================================
  - section: rbac
    instances:

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: unauthorized_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Rung 1 outranks every other check: a POST /patients with no X-User-Role and no X-User-ID header returns ERR_UNAUTHENTICATED (401) even though the body is also missing a required field."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Anon Ymous" }
              captures: { err_auth: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with HTTP 401"
            - "error_id != ERR_VALIDATION (rung 1 wins over rung 4)"
            - "no Patient row is created"

      - name: field_nurse_cannot_admit_an_episode_and_gets_forbidden_role
        claim_type: exclusive_operations
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
          - roles.AdmittingPhysician.exclusive_operations
        distinguishing_aspect: "POST /episodes is exclusive to AdmittingPhysician, so a FieldNurse call is rejected at rung 2 with ERR_FORBIDDEN_ROLE (403) before the admission gauntlet runs."
        test_recipe:
          setup:
            - "One ELIGIBLE referral ready for admission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-RB", full_name: "Rob Rbac", home_distance_km: 5.0, primary_diagnosis_code: "CHF_EXAC", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_rb: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_rb}", origin: "ED", qualifying_condition_code: "CHF_EXAC", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_rb: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_rb}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_rb}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
          trigger:
            - call: "POST /episodes"
              payload: { patient_id: "${pat_rb}", referral_id: "${ref_rb}", program_track: "CMS_WAIVER" }
              as: FieldNurse
              as_user_id: "rn-1"
              captures: { err_rb: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "Referral.${ref_rb}.status is still ELIGIBLE"
            - "GET /episodes with patient_id ${pat_rb} returns an empty array with total_count == 0"

      - name: controlled_order_authorized_by_its_own_requester_violates_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - "validations[priority=19]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - entities.DeliveryOrder.fields.authorized_by_user_id
        distinguishing_aspect: "The controlled-substance rung compares the authorizing X-User-ID against requested_by_user_id: pharm-9 authorizing an order it requested is rejected, and pharm-7 authorizing the same order succeeds."
        test_recipe:
          setup:
            - "One ACTIVE CMS_WAIVER episode with a controlled MEDICATION order whose requested_by_user_id is pharm-9."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /patients"
              payload: { mrn: "MRN-SD", full_name: "Sid Segregation", home_distance_km: 5.0, primary_diagnosis_code: "CELLULITIS", diet_restriction: "NONE", broadband_verified: true, caregiver_present: true }
              as: AdmittingPhysician
              captures: { pat_sd: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pat_sd}", origin: "ED", qualifying_condition_code: "CELLULITIS", acuity: "STANDARD", referring_physician_user_id: "phys-1" }
              as: AdmittingPhysician
              captures: { ref_sd: $.data.id }
            - call: "POST /eligibility-assessments"
              payload: { referral_id: "${ref_sd}", in_person_eval_at: "2026-06-01T06:00:00Z", home_safety_outcome: "PASS", broadband_check: "PASS", caregiver_present_confirmed: true, consent_signed: true, assessor_user_id: "phys-1" }
              as: AdmittingPhysician
            - call: "POST /referrals/${ref_sd}/mark-eligible"
              payload: {}
              as: AdmittingPhysician
            - call: "POST /episodes"
              payload: { patient_id: "${pat_sd}", referral_id: "${ref_sd}", program_track: "CMS_WAIVER" }
              as: AdmittingPhysician
              captures: { ep_sd: $.data.id }
            - call: "POST /delivery-orders"
              payload: { episode_id: "${ep_sd}", order_kind: "MEDICATION", is_controlled: true, cold_chain_required: false, weight_kg: 0.4, requested_by_user_id: "pharm-9" }
              as: LogisticsCoordinator
              captures: { do_sd: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${do_sd}/authorize"
              payload: {}
              as: PharmacyAuthorizer
              as_user_id: "pharm-9"
              captures: { err_sd: $.data.error_id }
            - call: "POST /delivery-orders/${do_sd}/authorize"
              payload: {}
              as: PharmacyAuthorizer
              as_user_id: "pharm-7"
          assert:
            - "the self-authorization returns error_id ERR_SEGREGATION_OF_DUTIES with HTTP 403"
