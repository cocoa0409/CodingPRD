  # ==================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_formula_supersede_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[formula-supersede-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Optimistic concurrency on Formula.version: a supersede carrying the pre-supersede version is accepted (and bumps the version); replaying the same stale version is rejected with 412 ERR_STALE_VERSION; refetching the current version allows a further supersede."
        test_recipe:
          setup: ["TB1, C1 exist; F1 ACTIVE at version 1 (captured at create)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id, f1v: $.data.version }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
          trigger:
            - call: "POST /coatings/formulas/${f1}/supersede"
              payload: { formula_code: "CLR-8841-R2", color_name: "Desert Dusk R2", target_delta_e: 0.7, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ], expected_formula_version: "${f1v}" }
              as: LabTechnician
              captures: { f1b: $.data.id }
            - call: "POST /coatings/formulas/${f1}/supersede"
              payload: { formula_code: "CLR-8841-R3", color_name: "Desert Dusk R3", target_delta_e: 0.6, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ], expected_formula_version: "${f1v}" }
              as: LabTechnician
              captures: { err: $.data.error_id }
            - { call: "GET /coatings/formulas/${f1}", payload: {}, as: LabTechnician, captures: { f1v2: $.data.version } }
            - call: "POST /coatings/formulas/${f1}/supersede"
              payload: { formula_code: "CLR-8841-R3", color_name: "Desert Dusk R3", target_delta_e: 0.6, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ], expected_formula_version: "${f1v2}" }
              as: LabTechnician
              captures: { f1c: $.data.id }
          assert:
            - "First supersede succeeds: Formula.${f1b}.status == DRAFT, formula_version_no == 2, predecessor_formula_id == ${f1}"
            - "err == ERR_STALE_VERSION and HTTP 412 (second supersede replayed version ${f1v} after the first advanced it)"
            - "Formula.${f1}.status == ACTIVE throughout (predecessor deprecates only on successor activation) and version == 3 after both successful supersedes"
            - "Third supersede with the refetched version succeeds: Formula.${f1c}.formula_version_no == 2"

      - name: cascade_bumps_batch_version_and_updated_at
        claim_type: cascade_version_bump
        grounds: [state_machines.Formula.ACTIVE_to_DEPRECATED, entities.Batch]
        distinguishing_aspect: "Cascaded side effects are real mutations: the formula-deprecation cascade that moves a PLANNED batch to ON_HOLD increments batch.version (1 -> 2) and refreshes updated_at without any direct batch call."
        test_recipe:
          setup: ["F1 ACTIVE; M1; B1 PLANNED on F1 (version 1 captured at create)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlantManager }
            - call: "POST /coatings/tint-bases"
              payload: { base_code: "B-100", product_category: "NONFLAT", base_family: "LATEX_EXTERIOR", base_voc_gpl: 80, water_fraction_pct: 40, density_kg_per_gal: 4.6, base_cost_per_gal_cents: 1500, unit_price_per_gal_cents: 3200, shelf_life_months: 24, grind_spec_um: 25 }
              as: LabTechnician
              captures: { tb1: $.data.id }
            - call: "POST /coatings/colorants"
              payload: { colorant_code: "MAG-7", voc_g_per_unit: 5, cost_per_shot_cents: 30, is_hazmat: false }
              as: LabTechnician
              captures: { c1: $.data.id }
            - call: "POST /coatings/formulas"
              payload: { formula_code: "CLR-8841", color_name: "Desert Dusk", tint_base_id: "${tb1}", is_custom: false, target_delta_e: 0.8, lines: [ { colorant_id: "${c1}", shots_per_gallon: 4, sequence: 1 } ] }
              as: LabTechnician
              captures: { f1: $.data.id }
            - { call: "POST /coatings/formulas/${f1}/activate", payload: {}, as: LabTechnician }
            - call: "POST /coatings/mills"
              payload: { mill_code: "M-1", capacity_gallons: 200 }
              as: PlantManager
              captures: { m1: $.data.id }
            - call: "POST /coatings/batches"
              payload: { formula_id: "${f1}", mill_id: "${m1}", planned_gallons: 3, mill_window_start: "2026-06-10T08:00:00Z", mill_window_end: "2026-06-10T12:00:00Z" }
              as: ProductionOperator
              captures: { b1: $.data.id, b1v: $.data.version, b1u: $.data.updated_at }
          trigger:
            - { call: "POST /coatings/formulas/${f1}/deprecate", payload: {}, as: LabTechnician }
            - { call: "GET /coatings/batches/${b1}", payload: {}, as: ProductionOperator, captures: { b1v_post: $.data.version, b1u_post: $.data.updated_at } }
          assert:
            - "b1v == 1 and b1v_post == 2 (cascade incremented the batch version)"
            - "b1u_post != b1u (updated_at refreshed by the cascaded mutation)"
            - "Batch.${b1}.status == ON_HOLD"

      - name: rush_capacity_resets_next_utc_day
        claim_type: rate_threshold_reset
        grounds: [calculations.rush_capacity]
        distinguishing_aspect: "The rush quota is date-keyed: after three approvals exhaust 2026-06-01 and a fourth fails, advancing the logical clock to 2026-06-02 lets the same fourth order approve without any manual reset."
        test_recipe:
