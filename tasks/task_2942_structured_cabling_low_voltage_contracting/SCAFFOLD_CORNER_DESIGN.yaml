              as: DesignEngineer
              captures: { link1: $.data.id }
          trigger:
            - call: "POST /cabling/links"
              payload: { project_id: "${proj1}", telecom_room_id: "${room1}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 41.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
