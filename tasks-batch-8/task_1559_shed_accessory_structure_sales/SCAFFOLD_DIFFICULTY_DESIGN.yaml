  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: assessment_report_ready_cascade_depth3
        grounds:
          - state_machines.SiteAssessment.REQUESTED_to_REPORTED
          - state_machines.Order.SITE_REVIEW_to_PERMIT_REVIEW
          - state_machines.Order.PERMIT_REVIEW_to_READY_TO_SCHEDULE
          - state_machines.PermitApplication.SUBMITTED_to_NOT_REQUIRED
        distinguishing_aspect: |
          Depth-3 chain: report (SiteAssessment -> REPORTED) mutates Order
          (SITE_REVIEW -> PERMIT_REVIEW); that mutation itself creates the
          PermitApplication; the application's NOT_REQUIRED outcome itself
          advances the Order (PERMIT_REVIEW -> READY_TO_SCHEDULE). Trigger
          differs from permit_denial_revert_cascade_depth2.
        test_recipe:
          setup:
            - "An 8x8 CASH order (area 64 < threshold 120) is in SITE_REVIEW with a REQUESTED assessment"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 8, depth_ft: 8, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_id: $.data.id }
          trigger:
            - call: "POST /api/site-assessments/${asm_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
          assert:
            - "SiteAssessment.${asm_id}.status == REPORTED and verdict == SUITABLE (link 0)"
            - "PermitApplication exists for the order with permit_required == false, status == NOT_REQUIRED, fee_cents == 0 (links 1-2: created BY the order's advance)"
            - "Order.${order_id}.status == READY_TO_SCHEDULE (link 3: NOT_REQUIRED creation itself advanced the order past PERMIT_REVIEW)"

      - name: permit_denial_revert_cascade_depth2
        grounds:
          - state_machines.PermitApplication.SUBMITTED_to_DENIED
          - state_machines.Order.PERMIT_REVIEW_to_DRAFT
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger: POST deny mutates
          PermitApplication (SUBMITTED -> DENIED); that mutation itself reverts
          the Order (PERMIT_REVIEW -> DRAFT). Shallower than
          assessment_report_ready_cascade_depth3 and originates from deny, not report.
        test_recipe:
          setup:
            - "A 10x12 CASH order is in PERMIT_REVIEW with a SUBMITTED application (fee 21000)"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
              captures: { jur_id: $.data.id }
            - call: "POST /api/models"
              payload: { name: "GardenPro", sku: "GP-01", min_width_ft: 8, max_width_ft: 16, min_depth_ft: 8, max_depth_ft: 24, wall_height_ft: 8, supported_delivery_modes: ["PRE_BUILT", "ON_SITE_BUILD"], base_price_cents: 300000, overage_rate_tier1_cents: 1500, overage_rate_tier2_cents: 2000 }
              as: SalesRep
              captures: { model_id: $.data.id }
            - call: "POST /api/customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", phone: "317-555-0100", street: "1200 Fern Ave", city: "Indianapolis", state_code: "IN", zip: "46201" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", jurisdiction_id: "${jur_id}", width_ft: 10, depth_ft: 12, delivery_mode: "PRE_BUILT", foundation_type: "GRAVEL_PAD", anchor_type: "AUGER_STRAP", purchase_type: "CASH", options: [] }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /api/orders/${order_id}/submit-site-check"
              payload: { assessor_id: "asr-1", scheduled_date: "2026-08-02", window_start_hour: 10 }
              as: SalesRep
              captures: { asm_id: $.data.id }
            - call: "POST /api/site-assessments/${asm_id}/report"
              payload: { measured_access_width_in: 140, measured_slope_pct: 4, setback_front_ft: 12, setback_side_ft: 6, setback_rear_ft: 8, ground_prep_needed: false }
              as: InstallCrew
            - call: "GET /api/orders/${order_id}/permit-applications"
              as: PermitCoordinator
              captures: { app_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/permit-applications/${app_id}/deny"
              payload: { decision_note: "HOA easement conflict" }
              as: PermitCoordinator
          assert:
            - "PermitApplication.${app_id}.status == DENIED (link 1)"
            - "Order.${order_id}.status == DRAFT (link 2: caused BY the DENIED transition, not by the deny call directly)"
            - "Order.${order_id}.quoted_total_cents unchanged (reconfiguration not yet applied)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancelled_order_payment_state_beats_overpayment
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Category pair STATE vs BUSINESS_FISCAL: a payment on a CANCELLED
          order that would ALSO overpay must return ERR_INVALID_STATE
          (priority 6), never ERR_OVERPAYMENT (priority 14); pair differs from
          amend_anchor_safety_beats_config_bounds.
        test_recipe:
          setup:
            - "A CASH order in SITE_REVIEW with collected_cents == 50000, then cancelled (retained 5000, refund 45000)"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
