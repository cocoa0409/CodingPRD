          assert:
            - "rejected ERR_INVALID_DATE_RANGE; no TrustAgreement persisted"
      - name: v_second_active_search_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SEARCH_ALREADY_ACTIVE]"]
        distinguishing_aspect: "Ordering a second title search while the first is still ACTIVE (not yet completed) fails ERR_SEARCH_ALREADY_ACTIVE (409)."
        test_recipe:
          setup: ["file with one ACTIVE search"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N143SA", serial_number: "S-28", make_model: "Cessna 425", year: 1982 }, as: EscrowOfficer, captures: { ac: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${ac}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 5000000, annual_registration_fee_cents: 0, proration_method: "DAILY", expected_close_date: "2026-06-30" }, as: EscrowOfficer, captures: { f: $.data.id } }
