          assert: ["err == ERR_FORBIDDEN", "HTTP 403"]

      - name: warranty_clerk_cannot_post_recovery_forbidden
        claim_type: role_denial
        grounds:
          - roles.FleetManager
          - roles.WarrantyClerk
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST_RECOVERY sits on the shared claim events endpoint but is FleetManager-exclusive per §1.7; a WarrantyClerk caller is rejected with ERR_FORBIDDEN even on an APPROVED claim."
        test_recipe:
          setup: ["APPROVED claim 6500c (labor-only WO in base warranty, submitted by clerk-9)"]
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "R3", vin: "VINR3", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "R3A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "R3B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
