scenario: |
  1845. Shipyard Repair & Drydock Scheduling (Gulf Coast repair yard): dock/berth slot booking & vessel dimensions, work specification & bid pricing, growth work discovery & change order approval, subcontractor & trade sequencing, regulatory (class/Coast Guard) survey coordination, environmental controls & permit, delivery date & liquidated damages, warranty period & re-work

domain_name: shipyard-repair-drydock
api_prefix: "/v1"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DockBerth
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable dock/berth identifier, e.g. 'Drydock 2'"
      - name: max_length_m
        type: number
        source: input
        description: "Maximum vessel length overall (metres) the dock accepts; fit check is inclusive (<=)"
      - name: max_beam_m
        type: number
        source: input
        description: "Maximum vessel beam (metres); fit check is inclusive (<=)"
      - name: max_depth_m
        type: number
        source: input
        description: "Maximum vessel draft (metres) over the blocks; fit check is inclusive (<=)"
      - name: daily_rate_cents
        type: integer
        source: input
        description: "Base dockage rate per booked night in cents before the LOA multiplier"
        constraints: ">= 0"

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Vessel name"
      - name: imo_number
        type: string
        source: input
        description: "IMO registration number; unique across vessels"
        constraints: "unique"
      - name: length_m
        type: number
        source: input
        description: "Length overall in metres; used by dock fit check"
      - name: beam_m
        type: number
        source: input
        description: "Beam in metres; used by dock fit check"
      - name: draft_m
        type: number
        source: input
        description: "Maximum draft in metres; used by dock fit check"
      - name: owner_user_id
        type: string
        source: input
        description: "Opaque operator id of the ShipownerRep who speaks for this vessel; compared against X-User-ID for owner countersign and warranty filing"

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Company name"
      - name: trade_codes
        type: array
        source: input
        description: "Array of trade codes the firm is certified for (e.g. HULL_STEEL, PIPING, COATINGS, ELECTRICAL, MACHINERY); a work item may only be assigned to a subcontractor whose trade_codes contain the item's trade_code"
      - name: day_rate_cents
        type: integer
        source: input
        description: "Reference day rate in cents (advisory only)"
        constraints: ">= 0"

  - name: RepairProject
    parent: null
    common_fields: true
    fields:
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel under repair"
      - name: dock_id
        type: string
        source: input
        description: "FK -> DockBerth.id; the dock the project will occupy; reservations for this project must target this dock"
      - name: contract_delivery_date
        type: string
        source: input
        description: "Contractual redelivery date, ISO 8601 date (YYYY-MM-DD); liquidated damages accrue per calendar day beyond it"
      - name: warranty_days
        type: integer
        source: input
        description: "Warranty window length in calendar days from delivery"
        default: 90
        constraints: "> 0"
      - name: change_budget_cents
        type: integer
        source: input
        description: "Optional ceiling on the sum of APPROVED change order costs; omitted means unlimited"
        default: null
      - name: required_survey_types
        type: array
        source: input
        description: "Survey types that must each have a PASSED latest survey before work completion; empty array means no survey gate"
        default: []
      - name: status
        type: enum
        source: system
        description: "Lifecycle: bid phase, dock phase, delivery, warranty, closed"
        default: DRAFT
        constraints: "one of {DRAFT, BID_SUBMITTED, CONTRACTED, IN_DOCK, WORK_COMPLETE, DELIVERED, CLOSED}"
      - name: bid_total_cents
        type: integer
        source: computed
        description: "Sum of line_total_cents over WorkItems of this project with origin_kind = BASE_SPEC and status != CANCELLED; per-line rounding per calc_bid_line_pricing"
      - name: awarded_price_cents
        type: integer
        source: computed
        description: "Snapshot of bid_total_cents frozen at the award transition; null until CONTRACTED"
        default: null
      - name: contracted_price_cents
        type: integer
        source: computed
        description: "awarded_price_cents + sum of proposed_cost_cents over APPROVED ChangeOrders; null until CONTRACTED; credit change orders (negative cost) reduce it"
        default: null
      - name: actual_dock_in_utc
        type: datetime
        source: system
        description: "Timestamp the reservation activated; null until IN_DOCK"
        default: null
      - name: critical_path_days
        type: integer
        source: computed
        description: "Longest dependency chain over remaining WorkItems per calc_critical_path_days"
        default: 0
      - name: forecast_delivery_utc
        type: datetime
        source: computed
        description: "actual_dock_in_utc + critical_path_days + sum of schedule_delta_days over APPROVED ChangeOrders; null until IN_DOCK"
        default: null
      - name: ld_daily_rate_cents
        type: integer
        source: computed
        description: "Liquidated-damages daily rate selected by tier from contracted_price_cents per calc_liquidated_damages; null until CONTRACTED"
        default: null
      - name: provisional_ld_cents
        type: integer
        source: computed
        description: "Forward-looking LD estimate from forecast_delivery_utc, recomputed on every mutation while status < DELIVERED; frozen at its last value once DELIVERED"
        default: 0
      - name: liquidated_damages_cents
        type: integer
        source: computed
        description: "Final LD assessed at the deliver transition from the actual delivery date; null until DELIVERED"
        default: null
      - name: delivered_at_utc
        type: datetime
        source: system
        description: "Delivery timestamp; null until DELIVERED"
        default: null
      - name: warranty_end_utc
        type: datetime
        source: computed
        description: "delivered_at_utc + warranty_days; claims must be filed at or before this instant; null until DELIVERED"
        default: null

  - name: DockReservation
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RepairProject.id; the project this booking serves"
      - name: dock_id
        type: string
        source: system
        description: "FK -> DockBerth.id; copied from RepairProject.dock_id at creation"
      - name: start_utc
        type: datetime
        source: input
        description: "Occupation start (inclusive); half-open interval [start_utc, end_utc)"
      - name: end_utc
        type: datetime
        source: input
        description: "Occupation end (exclusive); must be strictly after start_utc"
      - name: status
        type: enum
        source: system
        description: "BOOKED on creation; ACTIVE while vessel in dock; RELEASED on undock; CANCELLED frees the window"
        default: BOOKED
        constraints: "one of {BOOKED, ACTIVE, RELEASED, CANCELLED}"
      - name: dockage_fee_cents
        type: integer
        source: computed
        description: "Booked nights x daily_rate_cents x LOA multiplier per calc_dockage_fee; computed at creation"
      - name: activated_at_utc
        type: datetime
        source: system
        description: "When the vessel docked in; null until ACTIVE"
        default: null
      - name: released_at_utc
        type: datetime
        source: system
        description: "When the dock was freed; null until RELEASED"
        default: null

  - name: WorkItem
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RepairProject.id; owning project"
      - name: description
        type: string
        source: input
        description: "Work specification line text"
      - name: trade_code
        type: string
        source: input
        description: "Trade performing the work; must be in the assigned subcontractor's trade_codes"
      - name: pricing_mode
        type: enum
        source: input
        description: "Selects the pricing variant in calc_bid_line_pricing"
        constraints: "one of {LUMP_SUM, TIME_AND_MATERIALS}"
      - name: quantity
        type: number
        source: input
        description: "LUMP_SUM: units of work (may carry 3 decimals); required when pricing_mode = LUMP_SUM"
        constraints: "> 0 when LUMP_SUM"
      - name: unit_price_cents
        type: integer
        source: input
        description: "LUMP_SUM: price per unit in cents; required when pricing_mode = LUMP_SUM; negative allowed only on change-order-originated growth items (credit work)"
      - name: estimated_hours
        type: number
        source: input
        description: "TIME_AND_MATERIALS: estimated labour hours; required when pricing_mode = TIME_AND_MATERIALS"
        constraints: "> 0 when TIME_AND_MATERIALS"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "TIME_AND_MATERIALS: labour rate per hour in cents; required when pricing_mode = TIME_AND_MATERIALS"
        constraints: ">= 0"
      - name: materials_cost_cents
        type: integer
        source: input
        description: "TIME_AND_MATERIALS: materials subtotal in cents before markup; defaults to 0"
        default: 0
        constraints: ">= 0"
      - name: duration_days
        type: integer
        source: input
        description: "Planned duration in whole days; feeds calc_critical_path_days"
        constraints: ">= 1"
      - name: depends_on_ids
        type: array
        source: input
        description: "FK -> WorkItem.id; each array element references a prerequisite WorkItem in the same project; must keep the dependency graph acyclic"
        default: []
      - name: requires_hot_work
        type: boolean
        source: input
        description: "True when the task involves burning/welding; start is gated on a GRANTED HOT_WORK permit covering the current logical time"
        default: false
      - name: subcontractor_id
        type: string
        source: input
        description: "FK -> Subcontractor.id; assigned firm; null until assigned via PATCH"
        default: null
      - name: origin_kind
        type: enum
        source: system
        description: "BASE_SPEC for bid lines; CHANGE_ORDER for growth work materialised by an approved change order; WARRANTY_REWORK for zero-priced rework"
        default: BASE_SPEC
        constraints: "one of {BASE_SPEC, CHANGE_ORDER, WARRANTY_REWORK}"
      - name: origin_change_order_id
        type: string
        source: system
        description: "FK -> ChangeOrder.id; set when origin_kind = CHANGE_ORDER; null otherwise"
        default: null
      - name: line_total_cents
        type: integer
        source: computed
        description: "Priced value per calc_bid_line_pricing; 0 for WARRANTY_REWORK items"
      - name: status
        type: enum
        source: system
        description: "PLANNED until started; CANCELLED only from PLANNED"
        default: PLANNED
        constraints: "one of {PLANNED, IN_PROGRESS, COMPLETE, CANCELLED}"
      - name: ready
        type: boolean
        source: computed
        description: "Derived, never stored as a state: true when status = PLANNED and every WorkItem in depends_on_ids has status = COMPLETE"
      - name: completed_at_utc
        type: datetime
        source: system
        description: "Completion timestamp; null until COMPLETE"
        default: null

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RepairProject.id; project the growth work belongs to"
      - name: description
        type: string
        source: input
        description: "Growth work description discovered after docking"
      - name: trade_code
        type: string
        source: input
        description: "Trade for the growth work item materialised on approval"
      - name: pricing_mode
        type: enum
        source: input
        description: "Pricing variant for proposed_cost_cents, same rules as WorkItem"
        constraints: "one of {LUMP_SUM, TIME_AND_MATERIALS}"
      - name: quantity
        type: number
        source: input
        description: "LUMP_SUM quantity; required when pricing_mode = LUMP_SUM"
      - name: unit_price_cents
        type: integer
        source: input
        description: "LUMP_SUM unit price; negative permitted (credit change order)"
      - name: estimated_hours
        type: number
        source: input
        description: "TIME_AND_MATERIALS hours; required when pricing_mode = TIME_AND_MATERIALS"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "TIME_AND_MATERIALS hourly rate"
      - name: materials_cost_cents
        type: integer
        source: input
        description: "TIME_AND_MATERIALS materials subtotal before markup"
        default: 0
      - name: duration_days
        type: integer
        source: input
        description: "Duration of the growth work item materialised on approval"
        constraints: ">= 1"
      - name: schedule_delta_days
        type: integer
        source: input
        description: "Signed delivery-schedule impact in whole days; positive pushes redelivery out; applied to forecast_delivery_utc on approval"
      - name: proposed_cost_cents
        type: integer
        source: computed
        description: "Priced value computed at creation (and recomputed on revise) via calc_bid_line_pricing"
      - name: requires_owner_countersign
        type: boolean
        source: computed
        description: "True when proposed_cost_cents is strictly greater than OWNER_APPROVAL_THRESHOLD_CENTS = 5000000 (i.e. $50,000.00); a cost exactly equal to the threshold does not require countersign"
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the creating ProjectManager; the segregation-of-duties check compares it against the approver"
      - name: commercial_approved_by
        type: string
        source: system
        description: "X-User-ID of the CommercialApprover who approved; null until recorded"
        default: null
      - name: owner_approved_by
        type: string
        source: system
        description: "X-User-ID of the owning ShipownerRep who countersigned; null until recorded"
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Recorded on reject"
        default: null
      - name: status
        type: enum
        source: system
        description: "UNDER_REVIEW on creation; REJECTED can loop back to UNDER_REVIEW via revise"
        default: UNDER_REVIEW
        constraints: "one of {UNDER_REVIEW, APPROVED, REJECTED, WITHDRAWN}"
      - name: approved_at_utc
        type: datetime
        source: system
        description: "When the final required approval landed; null until APPROVED"
        default: null

  - name: Survey
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RepairProject.id; project being surveyed"
      - name: survey_type
        type: enum
        source: input
        description: "Regulatory survey kind (class society or USCG)"
        constraints: "one of {CLASS_RENEWAL, CLASS_INTERMEDIATE, USCG_INSPECTION, LOAD_LINE}"
      - name: surveyor_user_id
        type: string
        source: system
        description: "X-User-ID of the creating ClassSurveyor; the schedule-conflict check keys on this"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Planned survey start (inclusive); closed-interval semantics"
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Planned survey end (inclusive); must be strictly after scheduled_start_utc; touching intervals conflict"
      - name: result
        type: enum
        source: input
        description: "Recorded outcome; null until record-result"
        default: null
        constraints: "one of {PASSED, FAILED} or null"
      - name: deficiency_count
        type: integer
        source: input
        description: "FAILED requires >= 1; PASSED requires omitted or 0"
        default: null
      - name: status
        type: enum
        source: system
        description: "SCHEDULED until a result is recorded; terminal on PASSED or FAILED (a FAILED survey is superseded by booking a new Survey)"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PASSED, FAILED}"

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RepairProject.id; project the permit covers; dock scope derives from the project's dock_id"
      - name: permit_type
        type: enum
        source: input
        description: "Environmental control kind"
        constraints: "one of {HOT_WORK, PAINT_SPRAY, BALLAST_DISCHARGE, HULL_BLASTING}"
      - name: valid_from
        type: datetime
        source: input
        description: "Validity window start (inclusive); closed day-granular interval"
      - name: valid_to
        type: datetime
        source: input
        description: "Validity window end (inclusive); must be strictly after valid_from"
      - name: status
        type: enum
        source: system
        description: "APPLIED on creation; GRANTED by the environmental officer; SUSPENDED halts coverage; CLOSED or EXPIRED terminal"
        default: APPLIED
        constraints: "one of {APPLIED, GRANTED, SUSPENDED, CLOSED, EXPIRED}"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> RepairProject.id; must be a DELIVERED project inside its warranty window"
      - name: work_item_id
        type: string
        source: input
        description: "FK -> WorkItem.id; the delivered work item alleged defective; must belong to project_id"
      - name: description
        type: string
        source: input
        description: "Defect description"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the filing ShipownerRep; must equal the project vessel's owner_user_id"
      - name: status
        type: enum
        source: system
        description: "FILED on creation; ACCEPTED spawns a zero-priced rework WorkItem and auto-CLOSEs when that item completes; DENIED terminal"
        default: FILED
        constraints: "one of {FILED, ACCEPTED, DENIED, CLOSED}"
      - name: rework_work_item_id
        type: string
        source: system
        description: "FK -> WorkItem.id; the WARRANTY_REWORK item created on accept; null until ACCEPTED"
        default: null
      - name: denial_reason
        type: string
        source: input
        description: "Recorded on deny"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RepairProject
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: BID_SUBMITTED
        trigger: "POST /v1/repair-projects/{id}/submit-bid"
        actor: ProjectManager
        preconditions:
          - "at least one WorkItem of the project has origin_kind = BASE_SPEC and status != CANCELLED (else ERR_BID_EMPTY)"
        side_effects:
          - "recompute bid_total_cents per calc_bid_line_pricing roll-up"
          - "increments RepairProject.version by 1"
      - from: BID_SUBMITTED
        to: CONTRACTED
        trigger: "POST /v1/repair-projects/{id}/award"
        actor: CommercialApprover
        preconditions:
          - "none beyond state"
        side_effects:
          - "awarded_price_cents := bid_total_cents (snapshot)"
          - "contracted_price_cents := awarded_price_cents"
          - "ld_daily_rate_cents := tier rate per calc_liquidated_damages tier table"
          - "provisional_ld_cents recomputed (0 before docking)"
          - "increments RepairProject.version by 1"
      - from: CONTRACTED
        to: IN_DOCK
        trigger: "POST /v1/dock-reservations/{id}/activate (side effect on the project)"
        actor: ProjectManager
        preconditions:
          - "the reservation belongs to this project"
        side_effects:
          - "actual_dock_in_utc := current logical time"
          - "critical_path_days recomputed per calc_critical_path_days"
          - "forecast_delivery_utc := actual_dock_in_utc + critical_path_days + approved schedule deltas"
          - "provisional_ld_cents recomputed"
          - "increments RepairProject.version by 1"
      - from: IN_DOCK
        to: WORK_COMPLETE
        trigger: "system auto-transition, evaluated whenever a WorkItem completes or a Survey is recorded PASSED"
        actor: system
        preconditions:
          - "every WorkItem of the project has status in {COMPLETE, CANCELLED}"
          - "for every t in required_survey_types, the latest Survey (by created_at DESC) of that type for the project has status = PASSED"
        side_effects:
          - "the ACTIVE DockReservation of this project transitions to RELEASED with released_at_utc := current logical time (dock window freed)"
          - "increments RepairProject.version by 1"
      - from: WORK_COMPLETE
        to: DELIVERED
        trigger: "POST /v1/repair-projects/{id}/deliver"
        actor: ProjectManager
        preconditions:
          - "none beyond state"
        side_effects:
          - "delivered_at_utc := current logical time"
          - "liquidated_damages_cents := final variant of calc_liquidated_damages"
          - "warranty_end_utc := delivered_at_utc + warranty_days"
          - "provisional_ld_cents frozen at its last computed value"
          - "increments RepairProject.version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: "system sweep inside POST /v1/_clock/set_current_utc"
        actor: system
        preconditions:
          - "current logical time is strictly greater than warranty_end_utc"
        side_effects:
          - "increments RepairProject.version by 1"

  - entity: DockReservation
    initial_state: BOOKED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: BOOKED
        to: ACTIVE
        trigger: "POST /v1/dock-reservations/{id}/activate"
        actor: ProjectManager
        preconditions:
          - "parent RepairProject.status = CONTRACTED (else ERR_PROJECT_NOT_CONTRACTED)"
          - "current logical time >= start_utc and < end_utc (else ERR_INVALID_STATE)"
        side_effects:
          - "activated_at_utc := current logical time"
          - "parent RepairProject transitions CONTRACTED -> IN_DOCK (see RepairProject machine side effects)"
      - from: ACTIVE
        to: RELEASED
        trigger: "system, fired by the RepairProject IN_DOCK -> WORK_COMPLETE auto-transition"
        actor: system
        preconditions:
          - "parent project reaches WORK_COMPLETE"
        side_effects:
          - "released_at_utc := current logical time"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /v1/dock-reservations/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "none beyond state (only a BOOKED reservation may be cancelled)"
        side_effects:
          - "dock window [start_utc, end_utc + TURNAROUND_BUFFER_HOURS) is freed for future bookings"

  - entity: WorkItem
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /v1/work-items/{id}/start"
        actor: ProjectManager
        preconditions:
          - "parent RepairProject.status = IN_DOCK, OR (origin_kind = WARRANTY_REWORK and parent RepairProject.status = DELIVERED) (else ERR_PROJECT_NOT_IN_DOCK)"
          - "if subcontractor_id is set and actor role is Subcontractor, X-User-ID must equal subcontractor_id (else ERR_OWNERSHIP_MISMATCH)"
          - "if requires_hot_work = true, a Permit of the project with permit_type = HOT_WORK and status = GRANTED exists with valid_from <= now <= valid_to (else ERR_HOT_WORK_PERMIT_REQUIRED)"
          - "every WorkItem in depends_on_ids has status = COMPLETE (else ERR_DEPENDENCY_NOT_MET)"
          - "if subcontractor_id is set, that subcontractor has fewer than MAX_SUBCONTRACTOR_IN_PROGRESS WorkItems IN_PROGRESS (else ERR_SUBCONTRACTOR_CAPACITY)"
        side_effects:
          - "increments WorkItem.version by 1"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /v1/work-items/{id}/complete"
        actor: ProjectManager
        preconditions:
          - "if actor role is Subcontractor, X-User-ID must equal subcontractor_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "completed_at_utc := current logical time"
          - "ready flags of dependent WorkItems recompute (derived field)"
          - "parent RepairProject completion gate re-evaluated; if satisfied the project auto-transitions IN_DOCK -> WORK_COMPLETE (cascading the reservation release)"
          - "if origin_kind = WARRANTY_REWORK, the WarrantyClaim whose rework_work_item_id = this item auto-transitions ACCEPTED -> CLOSED"
          - "parent RepairProject critical_path_days, forecast_delivery_utc, provisional_ld_cents recomputed"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /v1/work-items/{id}/cancel"
        actor: ProjectManager
        preconditions:
          - "origin_kind = BASE_SPEC (growth and rework items may not be cancelled)"
        side_effects:
          - "bid_total_cents recomputed (cancelled lines excluded)"
          - "parent RepairProject critical_path_days recomputed"
      - from: PLANNED
        to: PLANNED
        trigger: "PATCH /v1/work-items/{id} (edit depends_on_ids / subcontractor_id / duration_days)"
        actor: ProjectManager
        preconditions:
          - "updated depends_on_ids keeps the project dependency graph acyclic (else ERR_DEPENDENCY_CYCLE)"
          - "if subcontractor_id is set, that subcontractor's trade_codes contain trade_code (else ERR_TRADE_MISMATCH)"
        side_effects:
          - "critical_path_days recomputed when duration_days or depends_on_ids change"

  - entity: ChangeOrder
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /v1/change-orders/{id}/approve (CommercialApprover); when requires_owner_countersign = true the transition fires only once owner_approved_by is also set (either endpoint can land last)"
        actor: CommercialApprover
        preconditions:
          - "status = UNDER_REVIEW (else ERR_CHANGE_ORDER_NOT_REVIEWABLE)"
          - "X-User-ID != proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "change_budget_cents unset on the project, or sum of proposed_cost_cents over APPROVED change orders plus this one <= change_budget_cents (else ERR_CHANGE_BUDGET_EXCEEDED)"
        side_effects:
          - "commercial_approved_by := X-User-ID; if requires_owner_countersign and owner_approved_by is null, status stays UNDER_REVIEW and no further side effects fire"
          - "on final approval: approved_at_utc := now and a growth WorkItem is materialised (origin_kind = CHANGE_ORDER, origin_change_order_id = this id, pricing fields copied, status PLANNED)"
          - "cascade link 1->2: materialised growth item triggers RepairProject.contracted_price_cents := awarded_price_cents + sum of proposed_cost_cents over APPROVED change orders"
          - "cascade link 2->3: the contracted_price_cents change re-selects ld_daily_rate_cents from the tier table"
          - "cascade link 3: schedule_delta_days and the new tier recompute forecast_delivery_utc and provisional_ld_cents"
          - "increments RepairProject.version by 1 and ChangeOrder.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /v1/change-orders/{id}/owner-approve (ShipownerRep) when commercial_approved_by is already set"
        actor: ShipownerRep
        preconditions:
          - "status = UNDER_REVIEW (else ERR_CHANGE_ORDER_NOT_REVIEWABLE)"
          - "X-User-ID equals the project vessel's owner_user_id (else ERR_OWNERSHIP_MISMATCH)"
          - "requires_owner_countersign = true (else ERR_OWNER_APPROVAL_NOT_REQUIRED)"
        side_effects:
          - "owner_approved_by := X-User-ID; when commercial_approved_by is also set the full APPROVED cascade above fires"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /v1/change-orders/{id}/reject"
        actor: CommercialApprover
        preconditions:
          - "status = UNDER_REVIEW (else ERR_CHANGE_ORDER_NOT_REVIEWABLE)"
          - "reason is non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "rejection_reason recorded"
      - from: REJECTED
        to: UNDER_REVIEW
        trigger: "POST /v1/change-orders/{id}/revise with updated pricing fields"
        actor: ProjectManager
        preconditions:
          - "status = REJECTED (else ERR_CHANGE_ORDER_NOT_REVIEWABLE)"
        side_effects:
          - "proposed_cost_cents recomputed from the revised pricing fields per calc_bid_line_pricing"
          - "commercial_approved_by and owner_approved_by cleared"
          - "requires_owner_countersign recomputed against the new proposed_cost_cents"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /v1/change-orders/{id}/withdraw"
        actor: ProjectManager
        preconditions:
          - "status = UNDER_REVIEW (else ERR_CHANGE_ORDER_NOT_REVIEWABLE)"
        side_effects: []

  - entity: Survey
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /v1/surveys/{id}/record-result with result = PASSED"
        actor: ClassSurveyor
        preconditions:
          - "X-User-ID equals surveyor_user_id (else ERR_OWNERSHIP_MISMATCH)"
          - "deficiency_count omitted or 0 (else ERR_SURVEY_RESULT_INVALID)"
        side_effects:
          - "parent RepairProject completion gate re-evaluated; if satisfied the project auto-transitions IN_DOCK -> WORK_COMPLETE (cascading the reservation release)"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /v1/surveys/{id}/record-result with result = FAILED"
        actor: ClassSurveyor
        preconditions:
          - "X-User-ID equals surveyor_user_id (else ERR_OWNERSHIP_MISMATCH)"
          - "deficiency_count >= 1 (else ERR_SURVEY_RESULT_INVALID)"
        side_effects:
          - "deficiency_count recorded; project remains IN_DOCK until a replacement Survey of the same survey_type is recorded PASSED (re-survey loop across Survey instances)"

  - entity: Permit
    initial_state: APPLIED
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: APPLIED
        to: GRANTED
        trigger: "POST /v1/permits/{id}/grant"
        actor: EnvironmentalOfficer
        preconditions:
          - "if permit_type = HOT_WORK, no other Permit with permit_type = HOT_WORK and status = GRANTED exists for a project sharing the same dock_id whose closed day-interval [valid_from, valid_to] overlaps this one (touching endpoints count as overlap) (else ERR_HOT_WORK_PERMIT_CONFLICT)"
        side_effects:
          - "increments Permit.version by 1"
      - from: GRANTED
        to: SUSPENDED
        trigger: "POST /v1/permits/{id}/suspend"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects:
          - "suspended permits no longer satisfy the hot-work start gate"
      - from: APPLIED
        to: CLOSED
        trigger: "POST /v1/permits/{id}/close"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: CLOSED
        trigger: "POST /v1/permits/{id}/close"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /v1/permits/{id}/close"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: EXPIRED
        trigger: "system sweep inside POST /v1/_clock/set_current_utc"
        actor: system
        preconditions:
          - "current logical time is strictly greater than valid_to"
        side_effects: []
      - from: GRANTED
        to: EXPIRED
        trigger: "system sweep inside POST /v1/_clock/set_current_utc"
        actor: system
        preconditions:
          - "current logical time is strictly greater than valid_to"
        side_effects:
          - "expired permits no longer satisfy the hot-work start gate"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system sweep inside POST /v1/_clock/set_current_utc"
        actor: system
        preconditions:
          - "current logical time is strictly greater than valid_to"
        side_effects: []

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [DENIED, CLOSED]
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /v1/warranty-claims/{id}/accept"
        actor: ProjectManager
        preconditions:
          - "status = FILED (else ERR_INVALID_STATE)"
        side_effects:
          - "a zero-priced WorkItem is created: origin_kind = WARRANTY_REWORK, line_total_cents = 0, trade_code and description copied from the defective item, duration_days := rework_duration_days input"
          - "rework_work_item_id := the new WorkItem id"
          - "RepairProject.contracted_price_cents is unchanged (yard absorbs rework cost)"
      - from: FILED
        to: DENIED
        trigger: "POST /v1/warranty-claims/{id}/deny"
        actor: ProjectManager
        preconditions:
          - "status = FILED (else ERR_INVALID_STATE)"
          - "reason is non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "denial_reason recorded"
      - from: ACCEPTED
        to: CLOSED
        trigger: "system, fired when the rework WorkItem referenced by rework_work_item_id transitions to COMPLETE"
        actor: system
        preconditions:
          - "rework WorkItem COMPLETE"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: co-create-stale-project
    parent_entity: RepairProject
    write_endpoint: "POST /v1/change-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a ChangeOrder against a RepairProject whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just mutated the project (a reservation booking, an award,
      or another change order creation — each a legitimate write under the product
      semantics) and the current writer's view of the project is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reservation-create-stale-project
    parent_entity: RepairProject
    write_endpoint: "POST /v1/dock-reservations"
    occ_field: "expected_project_version"
    description: |
      Creating a DockReservation against a RepairProject whose version has advanced
      since the client last observed it is rejected. A second booking request sent
      strictly after a first one fully completes would otherwise legitimately
      succeed (booking two disjoint windows is valid product behaviour), so the
      conflict is resolved by the stale-version check, not by any state
      precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_bid_line_pricing
    trigger: "WorkItem creation; ChangeOrder creation and revise; rolled into bid_total_cents on submit-bid and into contracted_price_cents on award/approval"
    algorithm: tiered_pricing
    formula: |
      if pricing_mode == LUMP_SUM:
        line_total_cents = round_half_up(quantity * unit_price_cents)   # to integer cents
      else:  # TIME_AND_MATERIALS
        line_total_cents = round_half_up(estimated_hours * hourly_rate_cents)
                         + round_half_up(materials_cost_cents * (1 + MATERIALS_MARKUP_PCT))
      # Rounding order is pinned: EVERY line is rounded to integer cents FIRST,
      # then lines are summed. Summing raw products and rounding once at the end
      # is the rejected alternative and yields a different cent.
      bid_total_cents = sum(line_total_cents for WorkItem of project
                            where origin_kind == BASE_SPEC and status != CANCELLED)
      contracted_price_cents = awarded_price_cents
                             + sum(proposed_cost_cents for ChangeOrder of project
                                   where status == APPROVED)
    input_set: "WorkItems of one project with origin_kind = BASE_SPEC and status != CANCELLED for the bid roll-up; APPROVED ChangeOrders for the contract roll-up"
    constants:
      MATERIALS_MARKUP_PCT: 0.15
    precision: "integer cents, round_half_up applied per line before summation"
    variants:
      - name: lump_sum
        when: "pricing_mode = LUMP_SUM"
        difference: "quantity x unit price only; no materials markup component"
      - name: time_and_materials
        when: "pricing_mode = TIME_AND_MATERIALS"
        difference: "labour hours x rate plus materials marked up 15%; identical labour inputs price higher than the lump-sum variant whenever materials_cost_cents > 0"

  - name: calc_dockage_fee
    trigger: "DockReservation creation"
    algorithm: tiered_pricing
    formula: |
      booked_nights = (end_utc - start_utc) in whole 24-hour days  # half-open: nights fully inside [start_utc, end_utc)
      multiplier = 1.00 if vessel.length_m < 100
                   1.25 if 100 <= vessel.length_m < 200
                   1.60 if vessel.length_m >= 200
      dockage_fee_cents = round_half_up(booked_nights * dock.daily_rate_cents * multiplier)
      # The 12-hour turnaround buffer is NOT chargeable.
    input_set: "the new DockReservation, its project's Vessel (length_m), and the DockBerth (daily_rate_cents)"
    constants:
      TIER1_MAX_LOA_M: 100
      TIER1_MULTIPLIER: 1.00
      TIER2_MAX_LOA_M: 200
      TIER2_MULTIPLIER: 1.25
      TIER3_MULTIPLIER: 1.60
      TURNAROUND_BUFFER_HOURS: 12
    precision: "integer cents, round_half_up"

  - name: calc_liquidated_damages
    trigger: "provisional variant: recomputed on every mutation of RepairProject that touches contracted_price_cents, forecast_delivery_utc, or ld_daily_rate_cents while status < DELIVERED; final variant: evaluated once at the deliver transition"
    algorithm: threshold
    formula: |
      tier_rate(price_cents):
        200000   if price_cents <  50000000
        500000   if 50000000 <= price_cents <= 200000000   # boundary: exactly 50000000 selects tier 2
        1000000  if price_cents >  200000000
      late_days = max(0, (delivery_date - contract_delivery_date) in whole calendar days)
      chargeable_days = max(0, late_days - LD_GRACE_DAYS)    # exactly LD_GRACE_DAYS late => 0
      accrued = chargeable_days * tier_rate(contracted_price_cents)
      cap = round_half_up(LD_CAP_PCT * contracted_price_cents)
      liquidated_damages = min(accrued, cap)                 # nested min: tiered rate vs percentage cap
    input_set: "the RepairProject's contracted_price_cents, contract_delivery_date, and the variant-specific delivery date"
    constants:
      LD_GRACE_DAYS: 3
      LD_CAP_PCT: 0.10
      TIER1_RATE_CENTS: 200000
      TIER1_MAX_PRICE_CENTS: 50000000
      TIER2_RATE_CENTS: 500000
      TIER2_MAX_PRICE_CENTS: 200000000
      TIER3_RATE_CENTS: 1000000
    precision: "integer cents, round_half_up; calendar-day granularity on dates"
    variants:
      - name: provisional
        when: "while status < DELIVERED"
        difference: "delivery_date is the forecast_delivery_utc date (forward-looking from remaining critical path plus approved schedule deltas); recomputed on every relevant mutation"
      - name: final
        when: "at the WORK_COMPLETE -> DELIVERED transition"
        difference: "delivery_date is the actual delivered_at_utc date; evaluated once and frozen into liquidated_damages_cents"

  - name: calc_critical_path_days
    trigger: "WorkItem create / patch / cancel / complete; ChangeOrder approval (growth item joins the DAG); project activation"
    algorithm: topological
    formula: |
      nodes = WorkItems of the project with status in {PLANNED, IN_PROGRESS}
      edges = depends_on_ids restricted to nodes in the same project
      longest(item) = duration_days + max(longest(d) for d in depends_on_ids ∩ nodes, default 0)
      critical_path_days = max(longest(item) for item in nodes, default 0)
      # Evaluation order: topological over the DAG; ties between chains contribute
      # identical sums, so no tie-break affects the value. The graph is guaranteed
      # acyclic by ERR_DEPENDENCY_CYCLE at write time.
      forecast_delivery_utc = actual_dock_in_utc
                            + critical_path_days days
                            + sum(schedule_delta_days over APPROVED ChangeOrders) days
    input_set: "WorkItems of one project with status in {PLANNED, IN_PROGRESS}; APPROVED ChangeOrders of the project for the schedule delta"
    precision: "whole days, integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request body is well-formed: all required fields present, types correct, enum values valid, non-empty reason/description where one is required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "path identifiers resolve left-to-right, then body-referenced ids (vessel_id, dock_id, project_id, work_item_id, subcontractor_id, depends_on_ids elements) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined (generic state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (submit-bid, award, deliver, activate, cancel, start, complete, approve, reject, revise, withdraw, owner-approve, record-result, grant, suspend, close, accept, deny)"
  - priority: 5
    category: state
    check: "reservation activation requires parent project CONTRACTED"
    error_id: ERR_PROJECT_NOT_CONTRACTED
    http_status: 409
    applies_to: "POST /v1/dock-reservations/{id}/activate"
  - priority: 5
    category: state
    check: "change order creation and work-item start require parent project IN_DOCK (start is additionally allowed for WARRANTY_REWORK items while the project is DELIVERED)"
    error_id: ERR_PROJECT_NOT_IN_DOCK
    http_status: 409
    applies_to: "POST /v1/change-orders, POST /v1/work-items/{id}/start"
  - priority: 5
    category: state
    check: "change order must be UNDER_REVIEW for approve/reject/owner-approve/withdraw and REJECTED for revise"
    error_id: ERR_CHANGE_ORDER_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /v1/change-orders/{id}/approve, reject, revise, withdraw, owner-approve"
  - priority: 5
    category: state
    check: "owner-approve on a change order whose proposed_cost_cents is at or below the owner threshold"
    error_id: ERR_OWNER_APPROVAL_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /v1/change-orders/{id}/owner-approve"
  - priority: 5
    category: state
    check: "OCC: expected_project_version must equal the RepairProject's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/change-orders, POST /v1/dock-reservations"
  - priority: 6
    category: auth
    check: "segregation of duties: change order approver must differ from proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /v1/change-orders/{id}/approve"
  - priority: 6
    category: auth
    check: "ownership: owner-approver and warranty filer must match the project vessel's owner_user_id; survey recorder must be the creating surveyor; subcontractor actor must be the assigned firm"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /v1/change-orders/{id}/owner-approve, POST /v1/warranty-claims, POST /v1/surveys/{id}/record-result, POST /v1/work-items/{id}/start, POST /v1/work-items/{id}/complete"
  - priority: 7
    category: business_safety
    check: "starting a work item with requires_hot_work = true requires a GRANTED HOT_WORK permit of the same project covering the current logical time (closed interval)"
    error_id: ERR_HOT_WORK_PERMIT_REQUIRED
    http_status: 409
    applies_to: "POST /v1/work-items/{id}/start"
  - priority: 8
    category: business_constraint
    check: "vessel dimensions must fit the dock: length_m <= max_length_m, beam_m <= max_beam_m, draft_m <= max_depth_m (inclusive)"
    error_id: ERR_VESSEL_EXCEEDS_DOCK_LIMITS
    http_status: 422
    applies_to: "POST /v1/dock-reservations"
  - priority: 8
    category: business_constraint
    check: "reservation end_utc must be strictly after start_utc"
    error_id: ERR_RESERVATION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /v1/dock-reservations"
  - priority: 8
    category: business_constraint
    check: "permit valid_to must be strictly after valid_from"
    error_id: ERR_PERMIT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /v1/permits"
  - priority: 8
    category: business_constraint
    check: "survey scheduled_end_utc must be strictly after scheduled_start_utc"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /v1/surveys"
  - priority: 8
    category: business_constraint
    check: "mode-conditional pricing inputs: LUMP_SUM requires quantity > 0 and unit_price_cents present; TIME_AND_MATERIALS requires estimated_hours > 0 and hourly_rate_cents present; negative unit price only on change orders"
    error_id: ERR_PRICING_INPUT_INVALID
    http_status: 422
    applies_to: "POST /v1/work-items, POST /v1/change-orders, POST /v1/change-orders/{id}/revise"
  - priority: 8
    category: business_constraint
    check: "dependency list must not create a cycle within the project's work-item graph and must not reference the item itself"
    error_id: ERR_DEPENDENCY_CYCLE
    http_status: 422
    applies_to: "POST /v1/work-items, PATCH /v1/work-items/{id}"
  - priority: 8
    category: business_constraint
    check: "assigned subcontractor's trade_codes must contain the item's trade_code"
    error_id: ERR_TRADE_MISMATCH
    http_status: 422
    applies_to: "PATCH /v1/work-items/{id}"
  - priority: 8
    category: business_constraint
    check: "submit-bid requires at least one non-cancelled BASE_SPEC work item"
    error_id: ERR_BID_EMPTY
    http_status: 422
    applies_to: "POST /v1/repair-projects/{id}/submit-bid"
  - priority: 8
    category: business_constraint
    check: "PASSED requires deficiency_count omitted or 0; FAILED requires deficiency_count >= 1"
    error_id: ERR_SURVEY_RESULT_INVALID
    http_status: 422
    applies_to: "POST /v1/surveys/{id}/record-result"
  - priority: 9
    category: business_temporal
    check: "reservation occupied window [start_utc, end_utc + TURNAROUND_BUFFER_HOURS) must not intersect the occupied window of any BOOKED or ACTIVE reservation of the same dock; a new start_utc exactly equal to a prior end_utc + 12h is allowed (half-open)"
    error_id: ERR_DOCK_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /v1/dock-reservations"
  - priority: 9
    category: business_temporal
    check: "surveys of the same surveyor_user_id must not overlap under closed-interval semantics: a new survey starting exactly when another SCHEDULED survey ends still conflicts"
    error_id: ERR_SURVEYOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /v1/surveys"
  - priority: 9
    category: business_temporal
    check: "granting a HOT_WORK permit must not overlap another GRANTED HOT_WORK permit on the same dock under closed day-interval semantics (touching days conflict)"
    error_id: ERR_HOT_WORK_PERMIT_CONFLICT
    http_status: 409
    applies_to: "POST /v1/permits/{id}/grant"
  - priority: 9
    category: business_temporal
    check: "warranty claim must be filed while the project is DELIVERED and current logical time <= warranty_end_utc; filing exactly at warranty_end_utc is allowed"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /v1/warranty-claims"
  - priority: 10
    category: business_referential
    check: "every element of depends_on_ids must have status = COMPLETE at start time"
    error_id: ERR_DEPENDENCY_NOT_MET
    http_status: 409
    applies_to: "POST /v1/work-items/{id}/start"
  - priority: 10
    category: business_referential
    check: "warranty claim's work_item_id must belong to the claim's project"
    error_id: ERR_WORK_ITEM_NOT_IN_PROJECT
    http_status: 422
    applies_to: "POST /v1/warranty-claims"
  - priority: 11
    category: business_fiscal
    check: "approving a change order must not push the sum of APPROVED proposed_cost_cents above the project's change_budget_cents (when set)"
    error_id: ERR_CHANGE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/change-orders/{id}/approve"
  - priority: 11
    category: business_fiscal
    check: "a subcontractor may hold at most MAX_SUBCONTRACTOR_IN_PROGRESS = 3 IN_PROGRESS work items; starting a fourth is rejected (exactly 3 in progress is allowed)"
    error_id: ERR_SUBCONTRACTOR_CAPACITY
    http_status: 409
    applies_to: "POST /v1/work-items/{id}/start"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/v1/docks"
    description: "Register a dock/berth"
    roles: [YardAdmin]
    code: 201
    input: [name, max_length_m, max_beam_m, max_depth_m, daily_rate_cents]
    output: DockBerth
    side_effects: []

  - method: GET
    path: "/v1/docks/{id}"
    description: "Fetch one dock"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer, Subcontractor]
    code: 200
    input: []
    output: DockBerth
    side_effects: []

  - method: POST
    path: "/v1/vessels"
    description: "Register a vessel with its dimensions and owner"
    roles: [ProjectManager]
    code: 201
    input: [name, imo_number, length_m, beam_m, draft_m, owner_user_id]
    output: Vessel
    side_effects: []

  - method: GET
    path: "/v1/vessels/{id}"
    description: "Fetch one vessel"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer, Subcontractor]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: POST
    path: "/v1/subcontractors"
    description: "Register a subcontractor with certified trades"
    roles: [YardAdmin]
    code: 201
    input: [name, trade_codes, day_rate_cents]
    output: Subcontractor
    side_effects: []

  - method: GET
    path: "/v1/subcontractors/{id}"
    description: "Fetch one subcontractor"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer, Subcontractor]
    code: 200
    input: []
    output: Subcontractor
    side_effects: []

  - method: POST
    path: "/v1/repair-projects"
    description: "Open a repair project in DRAFT against a vessel and a dock"
    roles: [ProjectManager]
    code: 201
    input: [vessel_id, dock_id, contract_delivery_date, "warranty_days?", "change_budget_cents?", "required_survey_types?"]
    output: RepairProject
    side_effects: []

  - method: GET
    path: "/v1/repair-projects/{id}"
    description: "Fetch one project with computed fields (bid totals, forecast, LD accruals)"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer]
    code: 200
    input: []
    output: RepairProject
    side_effects: []

  - method: GET
    path: "/v1/repair-projects"
    description: "List projects; supports FK reverse lookups by vessel and dock"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer]
    code: 200
    input: ["vessel_id?", "dock_id?", "status?", "limit?", "offset?"]
    output: RepairProject[]
    side_effects: []

  - method: POST
    path: "/v1/repair-projects/{id}/submit-bid"
    description: "Move DRAFT -> BID_SUBMITTED; requires a non-empty base spec"
    roles: [ProjectManager]
    code: 200
    input: []
    output: RepairProject
    side_effects: [recompute bid_total_cents, increments RepairProject.version by 1]

  - method: POST
    path: "/v1/repair-projects/{id}/award"
    description: "Move BID_SUBMITTED -> CONTRACTED; freezes awarded_price_cents and selects the LD tier"
    roles: [CommercialApprover]
    code: 200
    input: []
    output: RepairProject
    side_effects: [snapshot awarded_price_cents, set contracted_price_cents and ld_daily_rate_cents, increments RepairProject.version by 1]

  - method: POST
    path: "/v1/repair-projects/{id}/deliver"
    description: "Move WORK_COMPLETE -> DELIVERED; assesses final liquidated damages and opens the warranty window"
    roles: [ProjectManager]
    code: 200
    input: []
    output: RepairProject
    side_effects: [set delivered_at_utc, liquidated_damages_cents per final variant of calc_liquidated_damages, warranty_end_utc, increments RepairProject.version by 1]

  - method: POST
    path: "/v1/dock-reservations"
    description: "Book a dock window for a project (dock copied from project); validates vessel fit and half-open-plus-buffer overlap; OCC on project version"
    roles: [ProjectManager]
    code: 201
    input: [project_id, start_utc, end_utc, expected_project_version]
    output: DockReservation
    side_effects: [compute dockage_fee_cents per calc_dockage_fee, increments RepairProject.version by 1]

  - method: GET
    path: "/v1/dock-reservations/{id}"
    description: "Fetch one reservation"
    roles: [YardAdmin, ProjectManager, CommercialApprover, EnvironmentalOfficer]
    code: 200
    input: []
    output: DockReservation
    side_effects: []

  - method: GET
    path: "/v1/dock-reservations"
    description: "List reservations; FK reverse lookups by dock and project"
    roles: [YardAdmin, ProjectManager, CommercialApprover, EnvironmentalOfficer]
    code: 200
    input: ["dock_id?", "project_id?", "status?", "limit?", "offset?"]
    output: DockReservation[]
    side_effects: []

  - method: POST
    path: "/v1/dock-reservations/{id}/activate"
    description: "BOOKED -> ACTIVE when the clock is inside the window and the project is CONTRACTED; docks the project in"
    roles: [ProjectManager]
    code: 200
    input: []
    output: DockReservation
    side_effects: [parent RepairProject CONTRACTED -> IN_DOCK with actual_dock_in_utc, critical path and forecast recompute]

  - method: POST
    path: "/v1/dock-reservations/{id}/cancel"
    description: "BOOKED -> CANCELLED; frees the window including the turnaround buffer"
    roles: [ProjectManager]
    code: 200
    input: []
    output: DockReservation
    side_effects: []

  - method: POST
    path: "/v1/work-items"
    description: "Add a base-spec work line to a DRAFT or BID_SUBMITTED project"
    roles: [ProjectManager]
    code: 201
    input: [project_id, description, trade_code, pricing_mode, duration_days, "quantity?", "unit_price_cents?", "estimated_hours?", "hourly_rate_cents?", "materials_cost_cents?", "requires_hot_work?", "depends_on_ids?"]
    output: WorkItem
    side_effects: [compute line_total_cents per calc_bid_line_pricing, recompute bid_total_cents and critical_path_days]

  - method: GET
    path: "/v1/work-items/{id}"
    description: "Fetch one work item"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer, Subcontractor]
    code: 200
    input: []
    output: WorkItem
    side_effects: []

  - method: GET
    path: "/v1/work-items"
    description: "List work items; FK reverse lookups by project, subcontractor, and origin change order"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer, Subcontractor]
    code: 200
    input: ["project_id?", "subcontractor_id?", "origin_change_order_id?", "status?", "limit?", "offset?"]
    output: WorkItem[]
    side_effects: []

  - method: GET
    path: "/v1/work-items/{id}/dependents"
    description: "List work items whose depends_on_ids contain this item (reverse of the self-referential dependency FK)"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer, Subcontractor]
    code: 200
    input: ["limit?", "offset?"]
    output: WorkItem[]
    side_effects: []

  - method: PATCH
    path: "/v1/work-items/{id}"
    description: "Edit a PLANNED item: dependency list (cycle-checked), subcontractor assignment (trade-checked), duration"
    roles: [ProjectManager]
    code: 200
    input: ["depends_on_ids?", "subcontractor_id?", "duration_days?"]
    output: WorkItem
    side_effects: [recompute critical_path_days when duration_days or depends_on_ids change]

  - method: POST
    path: "/v1/work-items/{id}/start"
    description: "PLANNED -> IN_PROGRESS; enforces hot-work permit gate, dependency completion, subcontractor capacity, ownership"
    roles: [ProjectManager, Subcontractor]
    code: 200
    input: []
    output: WorkItem
    side_effects: [increments WorkItem.version by 1]

  - method: POST
    path: "/v1/work-items/{id}/complete"
    description: "IN_PROGRESS -> COMPLETE; re-evaluates the project completion gate and warranty claim closure"
    roles: [ProjectManager, Subcontractor]
    code: 200
    input: []
    output: WorkItem
    side_effects: [set completed_at_utc, recompute project critical path / forecast / provisional LD, possibly auto-complete project and release reservation, possibly close warranty claim]

  - method: POST
    path: "/v1/work-items/{id}/cancel"
    description: "PLANNED -> CANCELLED for BASE_SPEC items only; excluded from bid totals"
    roles: [ProjectManager]
    code: 200
    input: []
    output: WorkItem
    side_effects: [recompute bid_total_cents and critical_path_days]

  - method: POST
    path: "/v1/change-orders"
    description: "Propose growth work discovered in dock; created UNDER_REVIEW with computed proposed_cost_cents; OCC on project version"
    roles: [ProjectManager]
    code: 201
    input: [project_id, expected_project_version, description, trade_code, pricing_mode, duration_days, schedule_delta_days, "quantity?", "unit_price_cents?", "estimated_hours?", "hourly_rate_cents?", "materials_cost_cents?"]
    output: ChangeOrder
    side_effects: [compute proposed_cost_cents and requires_owner_countersign, increments RepairProject.version by 1]

  - method: GET
    path: "/v1/change-orders/{id}"
    description: "Fetch one change order"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: GET
    path: "/v1/change-orders"
    description: "List change orders; FK reverse lookup by project"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: POST
    path: "/v1/change-orders/{id}/approve"
    description: "Commercial approval; fires the APPROVED cascade immediately unless owner countersign is still outstanding"
    roles: [CommercialApprover]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: [set commercial_approved_by, on final approval materialise growth WorkItem and run the price/tier/provisional cascade, increments RepairProject.version by 1]

  - method: POST
    path: "/v1/change-orders/{id}/owner-approve"
    description: "Owner countersign for change orders above the threshold; fires the cascade when commercial approval is already recorded"
    roles: [ShipownerRep]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: [set owner_approved_by, possibly fire the APPROVED cascade, increments RepairProject.version by 1]

  - method: POST
    path: "/v1/change-orders/{id}/reject"
    description: "UNDER_REVIEW -> REJECTED with a reason"
    roles: [CommercialApprover]
    code: 200
    input: [reason]
    output: ChangeOrder
    side_effects: []

  - method: POST
    path: "/v1/change-orders/{id}/revise"
    description: "REJECTED -> UNDER_REVIEW with repriced fields; clears recorded approvals (negotiation loop)"
    roles: [ProjectManager]
    code: 200
    input: ["quantity?", "unit_price_cents?", "estimated_hours?", "hourly_rate_cents?", "materials_cost_cents?", "duration_days?", "schedule_delta_days?"]
    output: ChangeOrder
    side_effects: [recompute proposed_cost_cents and requires_owner_countersign, clear commercial_approved_by and owner_approved_by]

  - method: POST
    path: "/v1/change-orders/{id}/withdraw"
    description: "UNDER_REVIEW -> WITHDRAWN (terminal)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: POST
    path: "/v1/surveys"
    description: "Schedule a class/Coast Guard survey; the creating ClassSurveyor becomes surveyor_user_id; closed-interval conflict per surveyor"
    roles: [ClassSurveyor]
    code: 201
    input: [project_id, survey_type, scheduled_start_utc, scheduled_end_utc]
    output: Survey
    side_effects: []

  - method: GET
    path: "/v1/surveys/{id}"
    description: "Fetch one survey"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer]
    code: 200
    input: []
    output: Survey
    side_effects: []

  - method: GET
    path: "/v1/surveys"
    description: "List surveys; FK reverse lookup by project"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep, ClassSurveyor, EnvironmentalOfficer]
    code: 200
    input: ["project_id?", "surveyor_user_id?", "status?", "limit?", "offset?"]
    output: Survey[]
    side_effects: []

  - method: POST
    path: "/v1/surveys/{id}/record-result"
    description: "Record PASSED or FAILED with deficiency discipline; PASSED re-evaluates the project completion gate"
    roles: [ClassSurveyor]
    code: 200
    input: [result, "deficiency_count?"]
    output: Survey
    side_effects: [on PASSED possibly auto-complete project and release reservation]

  - method: POST
    path: "/v1/permits"
    description: "Apply for an environmental permit window for a project"
    roles: [EnvironmentalOfficer]
    code: 201
    input: [project_id, permit_type, valid_from, valid_to]
    output: Permit
    side_effects: []

  - method: GET
    path: "/v1/permits/{id}"
    description: "Fetch one permit"
    roles: [YardAdmin, ProjectManager, CommercialApprover, EnvironmentalOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/v1/permits"
    description: "List permits; FK reverse lookup by project"
    roles: [YardAdmin, ProjectManager, CommercialApprover, EnvironmentalOfficer]
    code: 200
    input: ["project_id?", "permit_type?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/v1/permits/{id}/grant"
    description: "APPLIED -> GRANTED; HOT_WORK grants enforce one-grant-per-dock-day-interval exclusivity"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: [increments Permit.version by 1]

  - method: POST
    path: "/v1/permits/{id}/suspend"
    description: "GRANTED -> SUSPENDED; coverage for the hot-work gate stops immediately"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: POST
    path: "/v1/permits/{id}/close"
    description: "APPLIED / GRANTED / SUSPENDED -> CLOSED (terminal)"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: POST
    path: "/v1/warranty-claims"
    description: "File a defect claim against a delivered work item; filer must be the vessel's owner and the warranty window open"
    roles: [ShipownerRep]
    code: 201
    input: [project_id, work_item_id, description]
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/v1/warranty-claims/{id}"
    description: "Fetch one warranty claim"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/v1/warranty-claims"
    description: "List warranty claims; FK reverse lookups by project, defective work item, and rework work item"
    roles: [YardAdmin, ProjectManager, CommercialApprover, ShipownerRep]
    code: 200
    input: ["project_id?", "work_item_id?", "rework_work_item_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/v1/warranty-claims/{id}/accept"
    description: "FILED -> ACCEPTED; spawns the zero-priced WARRANTY_REWORK work item; contract price unchanged"
    roles: [ProjectManager]
    code: 200
    input: [rework_duration_days]
    output: WarrantyClaim
    side_effects: [create WARRANTY_REWORK WorkItem with line_total_cents = 0, set rework_work_item_id]

  - method: POST
    path: "/v1/warranty-claims/{id}/deny"
    description: "FILED -> DENIED with a reason"
    roles: [ProjectManager]
    code: 200
    input: [reason]
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting the clock sweeps: non-terminal Permits past valid_to become EXPIRED; DELIVERED projects past warranty_end_utc become CLOSED."
    roles: [YardAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: [permit expiry sweep, project warranty closure sweep]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not in the endpoint's allowed roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, invalid enum member, or empty reason/description where one is required"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body-referenced id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state precondition failure: transition not defined from the current state (e.g. deliver before WORK_COMPLETE, record-result on a PASSED survey)"
  - id: ERR_PROJECT_NOT_CONTRACTED
    http: 409
    condition: "Reservation activation while the parent project is not CONTRACTED"
  - id: ERR_PROJECT_NOT_IN_DOCK
    http: 409
    condition: "Change order creation or work-item start while the parent project is not IN_DOCK"
  - id: ERR_CHANGE_ORDER_NOT_REVIEWABLE
    http: 409
    condition: "Approve / reject / owner-approve / withdraw on a change order not UNDER_REVIEW, or revise on one not REJECTED"
  - id: ERR_OWNER_APPROVAL_NOT_REQUIRED
    http: 409
    condition: "Owner countersign attempted on a change order at or below the owner threshold"
  - id: ERR_HOT_WORK_PERMIT_REQUIRED
    http: 409
    condition: "Starting hot work without a GRANTED HOT_WORK permit covering the current logical time"
  - id: ERR_VESSEL_EXCEEDS_DOCK_LIMITS
    http: 422
    condition: "Vessel length, beam, or draft strictly exceeds the corresponding dock limit"
  - id: ERR_RESERVATION_WINDOW_INVALID
    http: 422
    condition: "Reservation end_utc not strictly after start_utc"
  - id: ERR_PERMIT_WINDOW_INVALID
    http: 422
    condition: "Permit valid_to not strictly after valid_from"
  - id: ERR_PRICING_INPUT_INVALID
    http: 422
    condition: "Mode-conditional pricing inputs missing or non-positive (quantity / estimated_hours / rates)"
  - id: ERR_DEPENDENCY_CYCLE
    http: 422
    condition: "depends_on_ids introduces a cycle or self-reference in the project's work-item graph"
  - id: ERR_TRADE_MISMATCH
    http: 422
    condition: "Assigned subcontractor's trade_codes do not contain the item's trade_code"
  - id: ERR_BID_EMPTY
    http: 422
    condition: "submit-bid with no non-cancelled BASE_SPEC work items"
  - id: ERR_SURVEY_RESULT_INVALID
    http: 422
    condition: "PASSED with deficiency_count > 0, or FAILED with deficiency_count missing or 0"
  - id: ERR_DOCK_SLOT_CONFLICT
    http: 409
    condition: "Reservation window (plus the 12-hour turnaround buffer) intersects another BOOKED or ACTIVE reservation of the same dock"
  - id: ERR_SURVEYOR_SCHEDULE_CONFLICT
    http: 409
    condition: "A surveyor's closed survey interval overlaps another SCHEDULED survey; touching endpoints conflict"
  - id: ERR_HOT_WORK_PERMIT_CONFLICT
    http: 409
    condition: "Granting a HOT_WORK permit whose closed day-interval overlaps another GRANTED HOT_WORK permit on the same dock"
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "Claim filed while project not DELIVERED, or after warranty_end_utc"
  - id: ERR_DEPENDENCY_NOT_MET
    http: 409
    condition: "Starting a work item while some depends_on_ids element is not COMPLETE"
  - id: ERR_WORK_ITEM_NOT_IN_PROJECT
    http: 422
    condition: "Warranty claim references a work item belonging to a different project"
  - id: ERR_CHANGE_BUDGET_EXCEEDED
    http: 422
    condition: "Approval would push the sum of APPROVED change order costs above the project's change_budget_cents"
  - id: ERR_SUBCONTRACTOR_CAPACITY
    http: 409
    condition: "Start would give the subcontractor a fourth IN_PROGRESS work item"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Commercial approver is the same user who proposed the change order"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "Acting user is not the owning party for the resource (vessel owner, assigned subcontractor, or creating surveyor)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_project_version does not match the RepairProject's current version"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: YardAdmin
    description: "Yard operator staff; administers docks, subcontractors, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/docks"
      - "POST /v1/subcontractors"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "GET reads across the surface"
  - name: ProjectManager
    description: "Yard-side project manager; owns the repair project lifecycle, work specification, bookings, growth-work proposals, and warranty disposition"
    identity: opaque
    exclusive_operations:
      - "POST /v1/vessels"
      - "POST /v1/repair-projects"
      - "POST /v1/repair-projects/{id}/submit-bid"
      - "POST /v1/repair-projects/{id}/deliver"
      - "POST /v1/dock-reservations and activate/cancel"
      - "POST /v1/work-items, PATCH, cancel"
      - "POST /v1/change-orders, revise, withdraw"
      - "POST /v1/warranty-claims/{id}/accept and deny"
    shared_operations:
      - "POST /v1/work-items/{id}/start and complete (shared with Subcontractor)"
      - "GET reads across the surface"
  - name: CommercialApprover
    description: "Yard commercial authority; awards contracts and adjudicates change orders; may never approve a change order it proposed (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /v1/repair-projects/{id}/award"
      - "POST /v1/change-orders/{id}/approve"
      - "POST /v1/change-orders/{id}/reject"
    shared_operations:
      - "GET reads across the surface"
  - name: ShipownerRep
    description: "Representative of the vessel owner; countersigns large change orders and files warranty claims; X-User-ID must match the project vessel's owner_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /v1/change-orders/{id}/owner-approve"
      - "POST /v1/warranty-claims"
    shared_operations:
      - "GET reads on projects, change orders, surveys, warranty claims, work items"
  - name: ClassSurveyor
    description: "Classification society / Coast Guard surveyor; schedules and records regulatory surveys; survey intervals are booked against the surveyor's own calendar"
    identity: opaque
    exclusive_operations:
      - "POST /v1/surveys"
      - "POST /v1/surveys/{id}/record-result"
    shared_operations:
      - "GET reads across the surface"
  - name: EnvironmentalOfficer
    description: "Yard environmental compliance officer; applies, grants, suspends, and closes environmental permits"
    identity: opaque
    exclusive_operations:
      - "POST /v1/permits"
      - "POST /v1/permits/{id}/grant"
      - "POST /v1/permits/{id}/suspend"
      - "POST /v1/permits/{id}/close"
    shared_operations:
      - "GET reads across the surface"
  - name: Subcontractor
    description: "External trade firm; X-User-ID equals its Subcontractor entity id; may start and complete only work items assigned to it"
    identity: "entity_backed:Subcontractor"
    exclusive_operations: []
    shared_operations:
      - "POST /v1/work-items/{id}/start and complete (own assignments only)"
      - "GET reads across the surface"
