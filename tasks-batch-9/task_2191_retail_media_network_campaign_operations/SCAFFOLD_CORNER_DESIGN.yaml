# =============================================================================
# §1.9 Scaffold Corner Design — task_2191_retail_media_network_campaign_operations
#
# Breadth probe over the claim-extraction-guide taxonomy (nine sections) against
# SCAFFOLD.yaml §1.1-§1.7. Every `grounds:` entry resolves to a declared element
# of SCAFFOLD.yaml; every `setup_api_calls` chain drives empty-DB -> precondition
# using only §1.5 endpoints, with placeholder closure and literal discipline.
#
# Logical clock: the mandatory startup default is 2026-08-01T00:00:00Z, so chains
# that need no other time only call POST /_clock/set_current_utc when they move it.
# Operator ids used across chains (opaque, segregation-of-duties relevant):
#   u_admin (NetworkAdmin), u_am_1 / u_am_2 (AccountManager), u_ca_1 (CreditAnalyst),
#   u_bo_1 (BillingOps), u_cat_1 (CatalogOps), u_meas_1 (MeasurementAnalyst),
#   u_auc_1 (AuctionService). AdvertiserUser calls use as_user_id = Advertiser.id
#   because §1.7 declares identity: entity_backed:Advertiser and §1.4 priority 4
#   ownership-checks it.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # 1) ENTITIES
  # ===========================================================================
  - section: entities
    instances:
      - name: advertiser_create_stamps_draft_onboarding_and_zeroed_computed_fields
        claim_type: creation
        grounds:
          - endpoints[POST /rmn/advertisers]
          - entities.Advertiser.fields.onboarding_status
          - entities.Advertiser.fields.credit_exposure_cents
          - entities.Advertiser.fields.dispute_credit_balance_cents
          - state_machines.Advertiser.initial_state
        distinguishing_aspect: "A freshly created Advertiser is DRAFT with every computed money field at 0, kyc_document_count 0 and version 1 — none of the input-supplied commercial terms leak into the system-sourced lifecycle fields."
        test_recipe:
          setup: ["Empty DB. Logical clock at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /rmn/advertisers"
              payload:
                legal_name: "Nordvale Foods LLC"
                brand_code: "NRDV"
                service_model: "SELF_SERVE"
                credit_limit_cents: 50000000
                self_serve_daily_spend_cap_cents: 5000000
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { adv_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Advertiser.${adv_id}.onboarding_status == DRAFT"
            - "Advertiser.${adv_id}.suspension_reason == NONE"
            - "Advertiser.${adv_id}.credit_exposure_cents == 0"
            - "Advertiser.${adv_id}.dispute_credit_balance_cents == 0"
            - "Advertiser.${adv_id}.kyc_document_count == 0"
            - "Advertiser.${adv_id}.version == 1"
            - "Advertiser.${adv_id}.brand_code == NRDV"
            - "response.meta.api_request_id is present and response.response_type == object"

      - name: advertiser_optional_terms_omitted_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Advertiser.fields.self_serve_daily_spend_cap_cents
          - entities.Advertiser.fields.managed_service_fee_pct
          - entities.Advertiser.fields.service_model
          - endpoints[POST /rmn/advertisers]
        distinguishing_aspect: "Omitting self_serve_daily_spend_cap_cents and managed_service_fee_pct yields exactly 500000 and 0.0 — the §1.1 defaults, not null and not an echo of another advertiser's values."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rmn/advertisers"
              payload:
                legal_name: "Caldera Beverages Inc"
                brand_code: "CLDR"
                service_model: "SELF_SERVE"
                credit_limit_cents: 200000
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { adv_def_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Advertiser.${adv_def_id}.self_serve_daily_spend_cap_cents == 500000"
            - "Advertiser.${adv_def_id}.managed_service_fee_pct == 0.0"
            - "Advertiser.${adv_def_id}.credit_limit_cents == 200000"
            - "Advertiser.${adv_def_id}.parent_advertiser_id == null"
            - "Advertiser.${adv_def_id}.account_manager_user_id == null"

      - name: catalog_product_eligibility_derived_from_default_min_stock_threshold
        claim_type: defaults
        grounds:
          - entities.CatalogProduct.fields.min_stock_units_for_serving
          - entities.CatalogProduct.fields.eligibility_status
          - endpoints[POST /rmn/catalog-products]
        distinguishing_aspect: "With min_stock_units_for_serving defaulted to 3 and in_stock_units 2, creation lands directly in OUT_OF_STOCK rather than the ELIGIBLE initial_state — the derivation runs at creation, not only on stock adjustments."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rmn/catalog-products"
              payload:
                sku: "SKU-LOWSTOCK-1"
                category_code: "FOOTWEAR"
                title: "red shoes clearance"
                price_cents: 5000
                in_stock_units: 2
                margin_pct: 0.4
              as: CatalogOps
              as_user_id: "u_cat_1"
              captures: { prod_low_id: $.data.id }
          assert:
            - "HTTP 201"
            - "CatalogProduct.${prod_low_id}.min_stock_units_for_serving == 3"
            - "CatalogProduct.${prod_low_id}.in_stock_units == 2"
            - "CatalogProduct.${prod_low_id}.eligibility_status == OUT_OF_STOCK"
            - "CatalogProduct.${prod_low_id}.restricted_reason == NONE"
            - "CatalogProduct.${prod_low_id}.last_stock_change_at == null"

      - name: budget_plan_cash_share_and_available_computed_at_creation
        claim_type: computed_fields
        grounds:
          - entities.BudgetPlan.fields.cash_share_cents
          - entities.BudgetPlan.fields.available_cents
          - calculations.budget_plan_available
          - endpoints[POST /rmn/budget-plans]
        distinguishing_aspect: "cash_share_cents is 2000000 - 200000 = 1800000 and available_cents equals committed_total_cents (2000000) because reserved_cents and consumed_cents are both 0 at creation — the trade-fund share does NOT reduce available_cents."
        test_recipe:
          setup: ["One ACTIVE advertiser exists; no campaigns, no auctions."]
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Nordvale Foods LLC", brand_code: "NRDV", service_model: "SELF_SERVE", credit_limit_cents: 50000000, self_serve_daily_spend_cap_cents: 5000000 }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
              captures: { adv_v: $.data.version }
          trigger:
            - call: "POST /rmn/budget-plans"
              payload:
                advertiser_id: "${adv_id}"
                fiscal_period_code: "2026-Q3"
                committed_total_cents: 2000000
                trade_fund_share_cents: 200000
                window_start_at: "2026-08-01T00:00:00Z"
                window_end_at: "2026-10-01T00:00:00Z"
                expected_advertiser_version: "${adv_v}"
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP 201"
            - "BudgetPlan.${plan_id}.plan_status == DRAFT"
            - "BudgetPlan.${plan_id}.cash_share_cents == 1800000"
            - "BudgetPlan.${plan_id}.reserved_cents == 0"
            - "BudgetPlan.${plan_id}.consumed_cents == 0"
            - "BudgetPlan.${plan_id}.top_up_total_cents == 0"
            - "BudgetPlan.${plan_id}.available_cents == 2000000"
            - "BudgetPlan.${plan_id}.revision_round == 0"
            - "BudgetPlan.${plan_id}.exhausted_at == null"

      - name: engagement_event_channel_is_copied_from_slot_and_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.EngagementEvent.fields.channel
          - entities.PlacementSlot.fields.channel
          - endpoints[POST /rmn/engagement-events]
        distinguishing_aspect: "The request supplies channel OFFSITE while the auctioned slot is ONSITE; the persisted EngagementEvent.channel is ONSITE because the field is source: computed and copied from the auction slot."
        test_recipe:
          setup:
            - "Advertiser ACTIVE, plan ACTIVE, ONSITE slot SRP-A1, campaign DELIVERING, one SERVING LineItem with one ACTIVE hero ProductAssignment."
            - "One AuctionEvent on that slot has been ranked and AWARDED with the line item as winner."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Nordvale Foods LLC", brand_code: "NRDV", service_model: "SELF_SERVE", credit_limit_cents: 50000000, self_serve_daily_spend_cap_cents: 5000000 }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
              captures: { adv_v: $.data.version }
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 2000000, trade_fund_share_cents: 0, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", expected_advertiser_version: "${adv_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { plan_id: $.data.id }
            - call: "POST /rmn/budget-plans/${plan_id}/submit"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/budget-plans/${plan_id}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "u_ca_1"
            - call: "POST /rmn/placement-slots"
              payload: { slot_code: "SRP-A1", channel: "ONSITE", page_type: "SEARCH_RESULTS", position_index: 1, max_concurrent_line_items: 2, floor_cpc_cents: 50, relevance_weight: 1.0 }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { slot_id: $.data.id }
            - call: "POST /rmn/campaigns"
              payload: { advertiser_id: "${adv_id}", budget_plan_id: "${plan_id}", name: "Back to School", channel_mix: "ONSITE_ONLY", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", allocated_budget_cents: 1000000, pacing_mode: "EVEN", daily_cap_cents: 200000, attribution_model: "LAST_TOUCH", attribution_window_days: 14 }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { camp_id: $.data.id, camp_v: $.data.version }
            - call: "POST /rmn/catalog-products"
              payload: { sku: "SKU-RED-1", category_code: "FOOTWEAR", title: "red shoes", price_cents: 5000, in_stock_units: 50, margin_pct: 0.4 }
              as: CatalogOps
              as_user_id: "u_cat_1"
              captures: { prod_id: $.data.id }
            - call: "POST /rmn/line-items"
              payload: { campaign_id: "${camp_id}", placement_slot_id: "${slot_id}", bid_cents: 200, bid_type: "CPC", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", daily_budget_cents: 100000, category_code: "FOOTWEAR", keyword_match_terms: ["red", "shoes"], expected_campaign_version: "${camp_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { li_id: $.data.id, li_v: $.data.version }
            - call: "POST /rmn/product-assignments"
              payload: { line_item_id: "${li_id}", catalog_product_id: "${prod_id}", is_hero: true, expected_line_item_version: "${li_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/line-items/${li_id}/submit-eligibility"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/line-items/${li_id}/eligibility-decision"
              payload: { decision: "APPROVE" }
              as: CatalogOps
              as_user_id: "u_cat_1"
            - call: "POST /rmn/campaigns/${camp_id}/submit-for-review"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/campaigns/${camp_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: NetworkAdmin
              as_user_id: "u_admin"
            - call: "POST /rmn/campaigns/${camp_id}/activate"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/line-items/${li_id}/activate"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/auction-events"
              payload: { placement_slot_id: "${slot_id}", request_context_query: "red shoes sale", shopper_segment: "RETURNING", requested_at: "2026-08-01T12:00:00Z" }
              as: AuctionService
              as_user_id: "u_auc_1"
              captures: { auc_id: $.data.id }
            - call: "POST /rmn/auction-events/${auc_id}/rank"
              payload: {}
              as: AuctionService
              as_user_id: "u_auc_1"
            - call: "POST /rmn/auction-events/${auc_id}/award"
              payload: {}
              as: AuctionService
              as_user_id: "u_auc_1"
          trigger:
            - call: "POST /rmn/engagement-events"
              payload: { line_item_id: "${li_id}", auction_event_id: "${auc_id}", catalog_product_id: "${prod_id}", event_type: "IMPRESSION", occurred_at: "2026-08-01T12:05:00Z", shopper_hash: "sh_1", channel: "OFFSITE" }
              as: AuctionService
              as_user_id: "u_auc_1"
              captures: { ev_imp_id: $.data.id }
          assert:
            - "HTTP 201"
            - "EngagementEvent.${ev_imp_id}.channel == ONSITE"
            - "EngagementEvent.${ev_imp_id}.event_type == IMPRESSION"
            - "EngagementEvent.${ev_imp_id}.line_item_id == ${li_id}"
            - "EngagementEvent.${ev_imp_id}.billable_cents == 0"

      - name: attributed_sale_match_type_derived_from_engagement_event_type_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.AttributedSale.fields.match_type
          - entities.AttributedSale.fields.attribution_model_applied
          - calculations.attributed_sales_credit
          - endpoints[POST /rmn/attributed-sales]
        distinguishing_aspect: "The request declares match_type VIEW_THROUGH but the credited engagement is a CLICK, so the persisted match_type is CLICK_THROUGH and attribution_model_applied snapshots the campaign's LAST_TOUCH model."
        test_recipe:
          setup:
            - "As the DELIVERING/SERVING baseline (advertiser ACTIVE, plan ACTIVE, ONSITE slot, LAST_TOUCH campaign with attribution_window_days 14, one SERVING line item, one ACTIVE hero assignment)."
            - "AuctionEvent AWARDED with one IMPRESSION at 12:05Z and one CLICK at 12:10Z for shopper sh_1 on SKU-RED-1."
          setup_api_calls:
            - call: "POST /rmn/advertisers"
              payload: { legal_name: "Nordvale Foods LLC", brand_code: "NRDV", service_model: "SELF_SERVE", credit_limit_cents: 50000000, self_serve_daily_spend_cap_cents: 5000000 }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { adv_id: $.data.id }
            - call: "POST /rmn/advertisers/${adv_id}/submit-onboarding"
              payload: { kyc_document_count: 2 }
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/advertisers/${adv_id}/kyc-decision"
              payload: { decision: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "u_ca_1"
              captures: { adv_v: $.data.version }
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q3", committed_total_cents: 2000000, trade_fund_share_cents: 0, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", expected_advertiser_version: "${adv_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { plan_id: $.data.id }
            - call: "POST /rmn/budget-plans/${plan_id}/submit"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/budget-plans/${plan_id}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "u_ca_1"
            - call: "POST /rmn/placement-slots"
              payload: { slot_code: "SRP-A1", channel: "ONSITE", page_type: "SEARCH_RESULTS", position_index: 1, max_concurrent_line_items: 2, floor_cpc_cents: 50, relevance_weight: 1.0 }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { slot_id: $.data.id }
            - call: "POST /rmn/campaigns"
              payload: { advertiser_id: "${adv_id}", budget_plan_id: "${plan_id}", name: "Back to School", channel_mix: "ONSITE_ONLY", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", allocated_budget_cents: 1000000, pacing_mode: "EVEN", daily_cap_cents: 200000, attribution_model: "LAST_TOUCH", attribution_window_days: 14 }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { camp_id: $.data.id, camp_v: $.data.version }
            - call: "POST /rmn/catalog-products"
              payload: { sku: "SKU-RED-1", category_code: "FOOTWEAR", title: "red shoes", price_cents: 5000, in_stock_units: 50, margin_pct: 0.4 }
              as: CatalogOps
              as_user_id: "u_cat_1"
              captures: { prod_id: $.data.id }
            - call: "POST /rmn/line-items"
              payload: { campaign_id: "${camp_id}", placement_slot_id: "${slot_id}", bid_cents: 200, bid_type: "CPC", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", daily_budget_cents: 100000, category_code: "FOOTWEAR", keyword_match_terms: ["red", "shoes"], expected_campaign_version: "${camp_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { li_id: $.data.id, li_v: $.data.version }
            - call: "POST /rmn/product-assignments"
              payload: { line_item_id: "${li_id}", catalog_product_id: "${prod_id}", is_hero: true, expected_line_item_version: "${li_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/line-items/${li_id}/submit-eligibility"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/line-items/${li_id}/eligibility-decision"
              payload: { decision: "APPROVE" }
              as: CatalogOps
              as_user_id: "u_cat_1"
            - call: "POST /rmn/campaigns/${camp_id}/submit-for-review"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/campaigns/${camp_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: NetworkAdmin
              as_user_id: "u_admin"
            - call: "POST /rmn/campaigns/${camp_id}/activate"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/line-items/${li_id}/activate"
              payload: {}
              as: AccountManager
              as_user_id: "u_am_1"
            - call: "POST /rmn/auction-events"
              payload: { placement_slot_id: "${slot_id}", request_context_query: "red shoes sale", shopper_segment: "RETURNING", requested_at: "2026-08-01T12:00:00Z" }
              as: AuctionService
              as_user_id: "u_auc_1"
              captures: { auc_id: $.data.id }
            - call: "POST /rmn/auction-events/${auc_id}/rank"
              payload: {}
              as: AuctionService
              as_user_id: "u_auc_1"
            - call: "POST /rmn/auction-events/${auc_id}/award"
              payload: {}
              as: AuctionService
              as_user_id: "u_auc_1"
            - call: "POST /rmn/engagement-events"
              payload: { line_item_id: "${li_id}", auction_event_id: "${auc_id}", catalog_product_id: "${prod_id}", event_type: "IMPRESSION", occurred_at: "2026-08-01T12:05:00Z", shopper_hash: "sh_1", channel: "ONSITE" }
              as: AuctionService
              as_user_id: "u_auc_1"
              captures: { ev_imp_id: $.data.id }
            - call: "POST /rmn/engagement-events"
              payload: { line_item_id: "${li_id}", auction_event_id: "${auc_id}", catalog_product_id: "${prod_id}", event_type: "CLICK", occurred_at: "2026-08-01T12:10:00Z", shopper_hash: "sh_1", channel: "ONSITE" }
              as: AuctionService
              as_user_id: "u_auc_1"
              captures: { ev_click_id: $.data.id }
          trigger:
            - call: "POST /rmn/attributed-sales"
              payload: { engagement_event_id: "${ev_click_id}", catalog_product_id: "${prod_id}", retail_order_ref: "RO-1001", sale_cents: 50000, units: 1, occurred_at: "2026-08-02T09:00:00Z", match_type: "VIEW_THROUGH" }
              as: MeasurementAnalyst
              as_user_id: "u_meas_1"
              captures: { sale_id: $.data.id }
          assert:
            - "HTTP 201"
            - "AttributedSale.${sale_id}.match_type == CLICK_THROUGH"
            - "AttributedSale.${sale_id}.attribution_model_applied == LAST_TOUCH"
            - "AttributedSale.${sale_id}.line_item_id == ${li_id}"
            - "AttributedSale.${sale_id}.within_window == true"
            - "AttributedSale.${sale_id}.restated == false"
            - "AttributedSale.${sale_id}.attribution_weight == 1.0"
            - "AttributedSale.${sale_id}.attributed_credit_cents == 50000"

      - name: get_campaign_with_unknown_id_returns_campaign_not_found
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
          - endpoints[GET /rmn/campaigns/{id}]
        distinguishing_aspect: "A syntactically valid but unpersisted campaign id returns 404 ERR_CAMPAIGN_NOT_FOUND, not 200 with an empty body and not the generic ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB apart from the acting operator identity."]
          setup_api_calls: []
          trigger:
            - call: "GET /rmn/campaigns/f0000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err_id} == ERR_CAMPAIGN_NOT_FOUND"
            - "response.response_type == error"

      - name: advertiser_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints[GET /rmn/advertisers]
        distinguishing_aspect: "With three advertisers persisted and limit 2 / offset 0, the envelope reports total_count 3, has_more true and exactly two data rows — has_more reflects the unpaged total, not the page size."
        test_recipe:
          setup: ["Three advertisers created; no other rows."]
          setup_api_calls:
            - call: "POST /rmn/advertisers"
