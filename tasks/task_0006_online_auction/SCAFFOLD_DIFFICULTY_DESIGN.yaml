# =============================================================================
# Test Targeting Index for online-auction scaffold (§1.8)
# Each instance grounds in the SCAFFOLD.yaml §1.1–§1.6 declarations.
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across DIFFERENT entity domains
  # -------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_terminal_amount_variant
        grounds:
          - calculations.default_partial_refund
          - state_machines.Lot.REOFFERED_to_SOLD
          - state_machines.Lot.REOFFERED_to_UNSOLD
          - state_machines.Lot.DEFAULTED_to_UNSOLD
          - entities.Deposit.fields.refund_amount_cents
          - entities.Deposit.fields.forfeit_amount_cents
        distinguishing_aspect: |
          Same defaulter Deposit and the same input deposit.amount_cents produce two
          different terminal money splits depending on whether the runner-up acceptance
          path filled (PARTIAL_REFUND, refund_amount_cents = floor(amount*0.5)) or did
          not fill (FORFEITED, refund_amount_cents = 0). Entity domain: Deposit.
        test_recipe:
          setup:
            - "Seller created; Bidder W (winner) and Bidder R (runner-up) created with wallet_balance=20000"
            - "Lot created with reserve_price_cents=100000, starting_bid_cents=50000; published; clock advanced to LIVE"
            - "Bidder W places bid 100000 (deposit_required=10000 held from W); Bidder R places bid 105000 (deposit_required=10000 held from R)"
            - "Wait — that puts R as winner. Reorder: Bidder R bids 100000 first (Deposit_R 10000 HELD), Bidder W bids 110000 (Deposit_W 10000 HELD). W is winner; runner_up_bid_id = R's bid"
            - "Clock advanced past scheduled_end_at; Lot transitions LIVE→SOLD with hammer=110000, winning_bidder_id=W; Deposit_R RELEASED"
            - "Wait — losing bidders' deposits are released on SOLD per Lot.LIVE_to_SOLD side_effects. Need R to keep Deposit HELD so it's available if W defaults. Reread: per Lot LIVE_to_SOLD, losing deposits ARE released. So at default time, R has no deposit. We need R to re-bid acceptance which creates a new deposit hold? No — runner-up acceptance reuses the runner_up_bid_id record."
            - "PIN: at SOLD, only non-winner deposits are RELEASED. The deposit chain on default → reoffer → runner-up uses R's wallet at runner-up acceptance (no new deposit since R is now buyer; W's existing Deposit becomes the defaulter Deposit). The variant test should focus on W's deposit only."
            - "Branch A (full_forfeit): no runner-up exists OR runner-up declines"
            - "Branch B (partial_refund): runner-up accepts"
          trigger:
            - "Branch A: POST /lots/{id}/winner/default ; runner-up declines (POST /lots/{id}/runner-up/decline) OR no runner-up exists"
            - "Branch B: POST /lots/{id}/winner/default ; POST /lots/{id}/runner-up/accept by R (after R's wallet has 110000)"
          assert:
            - "Branch A: GET /bidders/W returns wallet_balance unchanged from pre-bid (10000 forfeited stays forfeited); Deposit_W.refund_amount_cents == 0; Deposit_W.forfeit_amount_cents == 10000; Deposit_W.terminal_reason == WINNER_DEFAULT_NO_REOFFER"
            - "Branch B: Deposit_W.refund_amount_cents == 5000; Deposit_W.forfeit_amount_cents == 5000; Deposit_W.terminal_reason == WINNER_DEFAULT_REOFFER_FILLED"

      - name: bidder_risk_score_chronic_vs_acute_variant
        grounds:
          - calculations.bidder_risk_score
          - entities.Bidder.fields.chronic_score
          - entities.Bidder.fields.acute_score
          - entities.Bidder.fields.shill_pattern_detected
          - entities.Bidder.fields.account_takeover_alert
          - state_machines.Bidder.RESTRICTED_to_ACTIVE
        distinguishing_aspect: |
          Same Bidder with identical withdrawal_count and dispute_loss_count produces two
          distinct risk_score values: chronic_only (after reinstate, acute_score=0) vs
          chronic_plus_acute (after a triggering acute event, acute_score>0). Entity
          domain: Bidder. Confirms variant outputs differ on the same Bidder.
        test_recipe:
          setup:
            - "Bidder B created; PlatformAdmin places B in a state where withdrawal_count=2 and dispute_loss_count=1 (chronic_score = 2*8 + 1*12 = 28)"
            - "POST /_events/account-takeover-alert {bidder_id: B} → acute_score includes ACUTE_PENALTY_TAKEOVER (20)"
          trigger:
            - "Read GET /bidders/B (after acute event)"
            - "Then POST /bidders/B/reinstate"
            - "Read GET /bidders/B (after reinstate)"
          assert:
            - "After acute event: Bidder.risk_score == 48.0 (chronic 28 + acute 20)"
            - "After reinstate: Bidder.risk_score == 28.0 (chronic only; acute cleared)"
            - "Bidder.account_takeover_alert == false after reinstate"

  # -------------------------------------------------------------------
  # Rule 2 — combinatorial formulas across DIFFERENT modes (a, b, c)
  # -------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: buyer_premium_three_input_combinatorial   # mode (a)
        grounds:
          - calculations.buyer_premium
          - entities.Lot.fields.category
          - entities.Bidder.fields.identity_verified
          - entities.Lot.fields.hammer_price_cents
          - entities.Invoice.fields.buyer_premium_cents
        distinguishing_aspect: |
          Mode (a): buyer_premium_cents depends on three independent inputs that
          interact non-linearly: hammer_price tier (3-way branch), category surcharge
          (+0.02 for JEWELRY), and bidder.identity_verified discount (-0.01). The
          rate is the SUM of branch outputs, then floor-multiplied, then clamped by
          MIN_PREMIUM_CENTS — four steps with conditional branches.
        test_recipe:
          setup:
            - "Bidder W with identity_verified=true (POST /_events/identity-verified ran); wallet 500000"
            - "Bidder L with identity_verified=false; wallet 100000 (loser to set up bid)"
            - "Seller S; Lot with category=JEWELRY, reserve_price_cents=150000, starting_bid_cents=150000, scheduled_end_at = start+3600"
            - "Lot published; clock advanced to LIVE"
            - "Bidder L places bid 150000 (loser); Bidder W places bid 200000 (winner). Note: Bidders cannot be affiliated_seller_id == S.id."
            - "Clock advanced past scheduled_end_at → LIVE→SOLD with hammer=200000, winning_bidder_id=W"
          trigger:
            - "GET /lots/{id}/invoice"
          assert:
            - "Invoice.hammer_price_cents == 200000"
            - "Invoice.buyer_premium_cents == 26000  # base_rate Tier-2 0.12 + JEWELRY 0.02 - VERIFIED 0.01 = 0.13; floor(200000*0.13)=26000"
            - "Invoice.buyer_total_cents == 226000"

      - name: commission_reversal_nested_rounding_order   # mode (b)
        grounds:
          - calculations.commission_reversal
          - entities.Invoice.fields.commission_reversal_amount_cents
          - state_machines.Lot.DISPUTED_to_REFUNDED
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_REFUND
        distinguishing_aspect: |
          Mode (b): the formula PINS the rounding order as (1) ratio = HALF_UP-round
          (refund_amount/buyer_total) to 4 decimal places, (2) multiply ratio by
          original seller_commission, (3) HALF_UP-round product to integer cents.
          Doing rounds in any other order (e.g., direct quotient → cents) can shift
          the result by ±1 cent on certain inputs. The pinned order is the contract.
        test_recipe:
          setup:
            - "Bidder W; Seller S; Lot with reserve=100000, starting=100000, category=ART"
            - "Lot bid by W at 100000; clock past end → LIVE→SOLD; hammer=100000, buyer_premium = floor(100000*0.15)=15000, buyer_total=115000, seller_commission = floor(100000*0.10)=10000"
            - "POST /_events/payment-confirmed {invoice_id} → Invoice PAID; POST /_events/logistics-delivered {lot_id} → delivered_at recorded"
            - "POST /lots/{id}/disputes by W with claimed_refund_amount_cents=50000; POST /disputes/{id}/start-review by ArbitratorOps"
          trigger:
            - "POST /lots/{id}/disputes/{id}/resolve { outcome: REFUND, resolution_refund_amount_cents: 50000 }"
            - "GET /lots/{id}/invoice"
          assert:
            - "Invoice.status == 'REVERSED'"
            - "Invoice.refund_amount_cents == 50000"
            - "Invoice.commission_reversal_amount_cents == 4348  # ratio = round(50000/115000, 4dp half_up) = 0.4348; round(10000*0.4348, half_up) = 4348"

      - name: proxy_resolution_evaluation_order   # mode (c)
        grounds:
          - calculations.bid_increment_ladder
          - calculations.lot_current_state
          - state_machines.AutoBidProxy.ACTIVE_to_EXHAUSTED
          - entities.AutoBidProxy.fields.last_executed_amount_cents
          - entities.AutoBidProxy.fields.bids_emitted_count
        distinguishing_aspect: |
          Mode (c): proxy resolution is circular-looking — emitting one proxy bid
          changes current_price, which changes min_required_bid for the NEXT proxy.
          The scaffold pins the order: "evaluate from oldest proxy to newest, one
          step at a time, alternating up the increment ladder until a proxy runs out
          of room." Without this pinning, two valid orderings can produce different
          final current_price and different last_executed_amount_cents per proxy.
        test_recipe:
          setup:
            - "Seller S; two Bidders X and Y; Lot reserve=200000, starting=10000; LIVE"
            - "Bidder X creates AutoBidProxy with max_amount_cents = 30000 (proxy_X older)"
            - "Bidder Y creates AutoBidProxy with max_amount_cents = 50000 (proxy_Y newer)"
          trigger:
            - "After both proxies are ACTIVE, the resolution loop runs: each emission alternates up the ladder by increment(base) — base=10000 → tier 2 increment 1000; bids alternate at 11000(Y), 12000(X)? wait — order is OLDER-first, so X emits first at min_required=10000 (no prior bid was 10000? starting_bid_cents serves as floor). Re-read calc: 'on first qualifying placement, min_required_bid = lot.starting_bid_cents'."
            - "Concretely: X creates proxy → emits bid at 10000 (current_price=10000). Y creates proxy → Y not winning → Y emits bid at 11000 (base=10000 → increment 1000). Loop: X re-evaluates → emits 12000 (X within max 30000). Y → 13000. Continue: X → 14000. Y → 15000. ... X → 30000 (X reaches max). Y → 31000 → exceeds Y? no Y max=50000. Hmm Y becomes winning at 31000 > X.max. Then X cannot emit (would need >31000 = 32000 > 30000 max). X.status=EXHAUSTED. Final state: current_price=31000, winner=Y."
          assert:
            - "Lot.current_price_cents == 31000"
            - "Lot.current_winner_bidder_id == Y.id"
            - "AutoBidProxy_X.status == 'EXHAUSTED'"
            - "AutoBidProxy_X.last_executed_amount_cents == 30000"
            - "AutoBidProxy_Y.status == 'ACTIVE'"
            - "AutoBidProxy_Y.last_executed_amount_cents == 31000"

  # -------------------------------------------------------------------
  # Rule 3 — non-linear state-machine shape on DIFFERENT entities
  # -------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: lot_branching_with_revert_shape
        grounds:
          - state_machines.Lot.LIVE_to_SOLD
          - state_machines.Lot.LIVE_to_UNSOLD
          - state_machines.Lot.DISPUTED_to_SOLD
          - state_machines.Lot.DISPUTED_to_REFUNDED
          - state_machines.Lot.DISPUTED_to_RELISTED
        distinguishing_aspect: |
          Lot is non-linear in two senses: (i) at LIVE close it FORKS into either SOLD
          or UNSOLD with divergent side-effect sets (Invoice creation vs none,
          deposit terminal_reason differs); (ii) DISPUTED → SOLD is a REVERT: the
          machine returns to a non-terminal earlier state when arbitration denies
          the refund. Linear A→B→C cannot express this.
        test_recipe:
          setup:
            - "Two parallel Lots constructed: Lot_A (reserve_met) and Lot_B (reserve_unmet); both reach LIVE; clock advanced past their respective scheduled_end_at."
            - "Lot_A SOLD path: Lot_C constructed similarly; pay invoice; deliver; file dispute; resolve DENIED → Lot returns to SOLD."
          trigger:
            - "GET /lots/{Lot_A.id} after close (reserve met)"
            - "GET /lots/{Lot_B.id} after close (reserve not met)"
            - "GET /lots/{Lot_C.id} after dispute resolved DENIED"
          assert:
            - "Lot_A.status == 'SOLD'; Invoice exists for Lot_A"
            - "Lot_B.status == 'UNSOLD'; GET /lots/{Lot_B.id}/invoice → 404 ERR_INVOICE_NOT_FOUND"
            - "Lot_C.status == 'SOLD' (reverted from DISPUTED back to SOLD); Invoice.status remains 'PAID'"

      - name: dispute_branching_resolution_shape
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_REFUND
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_RELIST
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_DENIED
        distinguishing_aspect: |
          Dispute is non-linear: from UNDER_REVIEW it FORKS into three terminal
          outcomes (RESOLVED_REFUND, RESOLVED_RELIST, RESOLVED_DENIED), each
          driving a DIFFERENT cascade in the Lot machine and differing Invoice
          side-effects. Three branches with divergent side-effect sets cannot be
          expressed as A→B→C linear pipeline.
        test_recipe:
          setup:
            - "Three independent SOLD-and-PAID Lot/Invoice/Dispute trios prepared identically: hammer=100000, premium=15000, commission=10000, refund_claimed=50000"
            - "Each dispute moved to UNDER_REVIEW"
          trigger:
            - "Dispute_R: resolve {outcome: REFUND, resolution_refund_amount_cents: 50000}"
            - "Dispute_L: resolve {outcome: RELIST}"
            - "Dispute_D: resolve {outcome: DENIED}"
          assert:
            - "Dispute_R: status='RESOLVED_REFUND'; Lot.status='REFUNDED'; Invoice.refund_amount_cents == 50000"
            - "Dispute_L: status='RESOLVED_RELIST'; Lot.status='RELISTED'; new Lot exists with relisted_from_lot_id == Lot_L.id"
            - "Dispute_D: status='RESOLVED_DENIED'; Lot.status='SOLD' (reverted); Bidder_D.dispute_loss_count == 1"

      - name: bid_branching_shape
        grounds:
          - state_machines.Lot.LIVE_to_SOLD
          - state_machines.Bidder.ACTIVE_to_SUSPENDED
          - entities.Bid.fields.status
        distinguishing_aspect: |
          Bid status branches at ACTIVE → {WINNING, OUTBID, WITHDRAWN_BY_RISK} with
          divergent downstream effects: WITHDRAWN_BY_RISK triggers Lot recompute
          cascade and contributes to Bidder.withdrawal_count; the other branches
          do not. Three terminal directions from one source state with mutually
          exclusive side-effect sets — non-linear.
        test_recipe:
          setup:
            - "Lot LIVE with three bids: bid_a (lower), bid_b (higher), bid_c (higher than b)"
            - "Lot reaches close; clock advanced; bid_c becomes WINNING; bid_a and bid_b become OUTBID"
            - "Separately: bidder_d has an ACTIVE bid on a separate LIVE lot; bidder_d is suspended → bid_d → WITHDRAWN_BY_RISK"
          trigger:
            - "GET /lots/{lot1.id}/bids"
            - "GET /lots/{lot2.id}/bids (after suspend cascade)"
          assert:
            - "lot1: bid_c.status == 'WINNING'; bid_a.status == 'OUTBID'; bid_b.status == 'OUTBID'"
            - "lot2: bid_d.status == 'WITHDRAWN_BY_RISK'; bidder_d.withdrawal_count == 1"

  # -------------------------------------------------------------------
  # Rule 4 — transitive cascade chains from DIFFERENT triggers
  # -------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: bidder_suspend_cascade   # depth 3
        grounds:
          - state_machines.Bidder.ACTIVE_to_SUSPENDED
          - state_machines.Lot.LIVE_to_SOLD
          - calculations.lot_current_state
          - entities.Bid.fields.status
          - entities.Lot.fields.current_winner_bid_id
          - entities.Lot.fields.current_price_cents
        distinguishing_aspect: |
          Trigger: PlatformAdmin /bidders/{id}/suspend.
          Hop 1: Bidder.status ACTIVE→SUSPENDED.
          Hop 2 (caused by Hop 1, NOT by the original action): all this Bidder's
          Bid records with status IN {ACTIVE, WINNING} flip to WITHDRAWN_BY_RISK.
          Hop 3 (caused by Hop 2, NOT by the original action): for every Lot that
          had this Bidder as its current_winner_bidder_id, lot_current_state
          recomputes from remaining Bid set, mutating Lot.current_price_cents and
          Lot.current_winner_bid_id.
          Each link is caused by the previous link, not by the original suspend.
        test_recipe:
          setup:
            - "Bidder B with 2 ACTIVE bids on Lot_X (B winning at 11000) and Lot_Y (B winning at 22000)"
            - "Each lot has a runner-up Bidder R_X and R_Y with ACTIVE OUTBID-but-second bids at 10000 and 21000 respectively"
          trigger:
            - "POST /bidders/B/suspend"
          assert:
            - "GET /bidders/B → status='SUSPENDED'"
            - "GET /lots/{X.id}/bids → bid by B has status='WITHDRAWN_BY_RISK'"
            - "GET /lots/{X.id} → current_price_cents == 10000; current_winner_bidder_id == R_X.id"
            - "GET /lots/{Y.id} → current_price_cents == 21000; current_winner_bidder_id == R_Y.id"

      - name: refund_cascade   # depth 3+ from a different trigger
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_REFUND
          - state_machines.Lot.DISPUTED_to_REFUNDED
          - state_machines.Invoice.PAID_to_REVERSED
          - calculations.commission_reversal
          - entities.Seller.fields.gross_proceeds_cents
          - entities.Seller.fields.net_proceeds_cents
        distinguishing_aspect: |
          Trigger: ArbitratorOps /disputes/{id}/resolve {outcome: REFUND}.
          Hop 1: Dispute UNDER_REVIEW → RESOLVED_REFUND.
          Hop 2 (caused by Hop 1): Lot DISPUTED → REFUNDED with refund_amount set.
          Hop 3 (caused by Hop 2): Invoice PAID → REVERSED, commission_reversal_amount_cents
          computed.
          Hop 4 (caused by Hop 3): Seller.net_proceeds_cents recomputed by reducing
          gross_proceeds_cents by commission_reversal_amount_cents.
          Different trigger from bidder_suspend_cascade (arbitration vs admin action).
        test_recipe:
          setup:
            - "Lot SOLD-and-PAID-and-DELIVERED (hammer=100000, premium=15000, commission=10000, seller_payout_cents recorded as 90000 in Seller.gross_proceeds)"
            - "Dispute filed and started review with claimed_refund=50000"
          trigger:
            - "POST /lots/{id}/disputes/{id}/resolve {outcome: REFUND, resolution_refund_amount_cents: 50000}"
          assert:
            - "Dispute.status == 'RESOLVED_REFUND'"
            - "Lot.status == 'REFUNDED'"
            - "Invoice.status == 'REVERSED'; Invoice.refund_amount_cents == 50000; Invoice.commission_reversal_amount_cents == 4348"
            - "Seller.gross_proceeds_cents == 90000  # gross stays the snapshot of original payout"
            - "Seller.net_proceeds_cents == 85652  # 90000 - 4348"

      - name: lot_close_cascade   # depth 3 from a third trigger
        grounds:
          - state_machines.Lot.LIVE_to_SOLD
          - state_machines.Invoice.PENDING_to_ISSUED
          - state_machines.Bidder.ACTIVE_to_SUSPENDED   # used only for cross-ref shape; not invoked here
          - entities.Bid.fields.status
          - entities.Deposit.fields.status
        distinguishing_aspect: |
          Trigger: clock advance past Lot.scheduled_end_at on a LIVE lot with a
          reserve-meeting bid.
          Hop 1: Lot LIVE → SOLD; Bid record id=current_winner_bid_id flips to WINNING.
          Hop 2 (caused by Hop 1, on a different entity): all OTHER ACTIVE Bids on
          this Lot flip to OUTBID.
          Hop 3 (caused by Hop 2, on a different entity): all losing-bidder Deposits
          flip to RELEASED with terminal_reason=LOSING_BIDDER.
          Different trigger from the other two cascades (system clock advance, not
          PlatformAdmin or ArbitratorOps).
        test_recipe:
          setup:
            - "Lot LIVE; 3 bidders L1, L2, W placed bids 10000, 11000, 12000 respectively (each holds Deposit 10000)"
          trigger:
            - "POST /_clock/advance until past scheduled_end_at"
          assert:
            - "Lot.status == 'SOLD'; Lot.hammer_price_cents == 12000"
            - "Bid_W.status == 'WINNING'"
            - "Bid_L1.status == 'OUTBID'; Bid_L2.status == 'OUTBID'"
            - "Deposit_L1.status == 'RELEASED' AND Deposit_L1.terminal_reason == 'LOSING_BIDDER'"
            - "Deposit_L2.status == 'RELEASED'"

  # -------------------------------------------------------------------
  # Rule 5 — validation priority conflicts across DIFFERENT error-category pairs
  # -------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_constraint_on_bid
        grounds:
          - validations[priority=4]   # state — ERR_LOT_NOT_LIVE
          - validations[priority=8]   # business_constraint — ERR_BID_BELOW_MIN_INCREMENT
          - errors.ERR_LOT_NOT_LIVE
          - errors.ERR_BID_BELOW_MIN_INCREMENT
        distinguishing_aspect: |
          Pair: state (priority 4, ERR_LOT_NOT_LIVE) vs business_constraint
          (priority 8, ERR_BID_BELOW_MIN_INCREMENT). Both fail simultaneously when
          a bid is placed on a CANCELLED Lot with an amount below the increment
          ladder. Priority dictates: state error wins.
        test_recipe:
          setup:
            - "Bidder B (ACTIVE, identity_verified, wallet 50000)"
            - "Lot constructed with reserve=10000, starting_bid=10000, then PUBLISHED → SCHEDULED → CANCELLED via /lots/{id}/cancel before LIVE"
          trigger:
            - "POST /lots/{id}/bids by B with amount_cents=1 (well below any increment min, AND lot is CANCELLED i.e. not LIVE)"
          assert:
            - "HTTP status == 409"
            - "response data.error_id == 'ERR_LOT_NOT_LIVE'  # state wins over business_constraint"

      - name: business_safety_vs_business_fiscal_on_bid
        grounds:
          - validations[priority=5]   # business_safety — ERR_BIDDER_RESTRICTED
          - validations[priority=13]  # business_fiscal — ERR_INSUFFICIENT_DEPOSIT_FUNDS
          - errors.ERR_BIDDER_RESTRICTED
          - errors.ERR_INSUFFICIENT_DEPOSIT_FUNDS
        distinguishing_aspect: |
          Pair: business_safety (priority 5, ERR_BIDDER_RESTRICTED) vs
          business_fiscal (priority 13, ERR_INSUFFICIENT_DEPOSIT_FUNDS). Both fail
          simultaneously when a RESTRICTED Bidder with empty wallet tries to bid.
          Priority dictates: safety error wins. Different error-category pair from
          the state_vs_business_constraint instance.
        test_recipe:
          setup:
            - "Bidder B with wallet 0; PlatformAdmin moves B to RESTRICTED"
            - "Lot LIVE with reserve 100000 (deposit_required would be 10000)"
          trigger:
            - "POST /lots/{id}/bids by B with amount_cents=999999"
          assert:
            - "HTTP status == 403"
            - "response data.error_id == 'ERR_BIDDER_RESTRICTED'  # safety wins over fiscal"

  # -------------------------------------------------------------------
  # Rule 6 — boundary-precision checks on DIFFERENT metrics/endpoints
  # -------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bid_increment_ladder_tier_boundary
        grounds:
          - calculations.bid_increment_ladder
          - validations[priority=8]
          - errors.ERR_BID_BELOW_MIN_INCREMENT
          - entities.Lot.fields.current_price_cents
        distinguishing_aspect: |
          Boundary on amount_cents at the tier 1/2 cusp: base price 9999 → tier 1
          (increment 500); base price 10000 → tier 2 (increment 1000). The tier
          lookup uses STRICT less-than against upper_exclusive_cents=10000. Tested
          on POST /lots/{id}/bids; metric = currency amount.
        test_recipe:
          setup:
            - "Lot LIVE; Bidder B; reserve=200000, starting_bid_cents=9500"
            - "First bid of 9500 placed → current_price=9500 (tier 1, base=9500 < 10000, next increment=500, min_required=10000)"
            - "Second bid of 10000 placed → current_price=10000 (now tier 2, base=10000, next increment=1000, min_required=11000)"
          trigger:
            - "Test A: POST /lots/{id}/bids amount_cents=10999  # tier-2-base 10000 → min_required=11000; 10999<11000 → reject"
            - "Test B: POST /lots/{id}/bids amount_cents=11000  # exactly min_required → accept"
          assert:
            - "Test A: HTTP 422; data.error_id == 'ERR_BID_BELOW_MIN_INCREMENT'"
            - "Test B: HTTP 201; Bid.amount_cents == 11000; Lot.current_price_cents == 11000"

      - name: dispute_filing_window_time_boundary
        grounds:
          - state_machines.Lot.SOLD_to_DISPUTED
          - validations[priority=11]
          - errors.ERR_DISPUTE_WINDOW_EXPIRED
          - entities.Lot.fields.delivered_at
        distinguishing_aspect: |
          Boundary on a TIME metric at delivered_at + DISPUTE_WINDOW_SECONDS
          (= 604800s = 7 days). Inclusive ≤: at exactly window-end, filing
          accepted; one second past, ERR_DISPUTE_WINDOW_EXPIRED. Tested on
          POST /lots/{id}/disputes — a DIFFERENT endpoint and a DIFFERENT metric
          (time-delta seconds vs currency cents) from the increment-ladder
          boundary.
        test_recipe:
          setup:
            - "Lot SOLD-and-PAID; POST /_events/logistics-delivered at clock T0 → delivered_at=T0"
            - "Test A: clock advanced to T0 + 604800s exactly"
            - "Test B: separate Lot prepared identically; clock advanced to T0 + 604801s"
          trigger:
            - "Test A: POST /lots/{id}/disputes by winning bidder"
            - "Test B: POST /lots/{id}/disputes by winning bidder"
          assert:
            - "Test A: HTTP 201; Dispute.status == 'FILED'"
            - "Test B: HTTP 409; data.error_id == 'ERR_DISPUTE_WINDOW_EXPIRED'"

  # -------------------------------------------------------------------
  # Rule 7 — cross-entity state dependencies across DIFFERENT entity pairs
  # -------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lot_bid_depends_on_bidder_status
        grounds:
          - validations[priority=5]   # business_safety
          - state_machines.Bidder.ACTIVE_to_RESTRICTED
          - errors.ERR_BIDDER_RESTRICTED
        distinguishing_aspect: |
          Lot operation (place a Bid) is gated by a DIFFERENT entity's state
          (Bidder.status). Pair: (Lot, Bidder). The bid-placement endpoint
          rejects with ERR_BIDDER_RESTRICTED when Bidder.status != ACTIVE,
          even though Lot is fully LIVE and bid amount is valid.
        test_recipe:
          setup:
            - "Bidder B; PlatformAdmin moves B to RESTRICTED via /bidders/{B.id}/restrict"
            - "Lot LIVE; reserve 100000 (deposit_required=10000); B has wallet 50000"
          trigger:
            - "POST /lots/{id}/bids by B amount_cents=100000"
          assert:
            - "HTTP 403; data.error_id == 'ERR_BIDDER_RESTRICTED'"

      - name: dispute_filing_depends_on_invoice_status
        grounds:
          - state_machines.Lot.SOLD_to_DISPUTED
          - state_machines.Invoice.ISSUED_to_PAID
          - errors.ERR_LOT_INVALID_STATE
        distinguishing_aspect: |
          Dispute creation (a Lot transition SOLD→DISPUTED in §1.2) is gated by a
          DIFFERENT entity's state: Invoice.status must be PAID. Pair: (Lot/Dispute,
          Invoice) — distinct from (Lot, Bidder) above. The endpoint rejects when
          Invoice is still ISSUED (winner has not paid).
        test_recipe:
          setup:
            - "Lot SOLD; Invoice exists with status=ISSUED (no /_events/payment-confirmed has been ingested yet)"
            - "Logistics-delivered event ingested so delivered_at is set, isolating the Invoice-state precondition"
          trigger:
            - "POST /lots/{id}/disputes by winning bidder with claimed_refund_amount=10000"
          assert:
            - "HTTP 409; data.error_id == 'ERR_LOT_INVALID_STATE'  # SOLD→DISPUTED precondition Invoice.status=PAID violated"

  # -------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap conflicts across DIFFERENT interval semantics
  # -------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: physical_item_serial_half_open_overlap
        grounds:
          - validations[priority=12]
          - errors.ERR_PHYSICAL_ITEM_TIME_OVERLAP
          - entities.Lot.fields.physical_item_serial
          - entities.Lot.fields.scheduled_start_at
          - entities.Lot.fields.scheduled_end_at
          - entities.Lot.fields.effective_end_at
        distinguishing_aspect: |
          Resource: Lot.physical_item_serial. Geometric semantic: HALF-OPEN
          intervals [scheduled_start_at, effective_end_at). Two Lots whose
          intervals strictly overlap collide; two Lots that ABUT (A.end ==
          B.start) do NOT collide (adjacency-permissive).
        test_recipe:
          setup:
            - "Seller S; Lot_A with physical_item_serial='SN-001', start=T+100, end=T+3700, PUBLISHED → SCHEDULED"
          trigger:
            - "Test Adjacent: POST /lots with physical_item_serial='SN-001', start=T+3700, end=T+7300, then /publish → expected to succeed (adjacency permitted)"
            - "Test Overlap: POST /lots with physical_item_serial='SN-001', start=T+3000, end=T+6600, then /publish → expected to fail"
          assert:
            - "Adjacent: HTTP 200 on publish; Lot_B.status='SCHEDULED'"
            - "Overlap: HTTP 409 on publish; data.error_id == 'ERR_PHYSICAL_ITEM_TIME_OVERLAP'"

      - name: deposit_aggregate_capacity_overlap
        grounds:
          - validations[priority=13]
          - errors.ERR_INSUFFICIENT_DEPOSIT_FUNDS
          - calculations.deposit_required
          - entities.Bidder.fields.wallet_balance_cents
          - entities.Bidder.fields.held_deposit_cents
        distinguishing_aspect: |
          Resource: Bidder.wallet_balance_cents. Geometric semantic: AGGREGATE
          CAPACITY over the union of overlapping LIVE auction intervals. Whereas
          the physical_item rule rejects pure point-overlap on a single resource,
          this rule rejects when the SUM of HELD deposits across multiple
          concurrently-live auctions exceeds the wallet capacity. Different
          entity, different geometry (sum-of-capacities vs interval-intersection).
        test_recipe:
          setup:
            - "Bidder B with wallet_balance_cents=15000"
            - "Lot_X: reserve_price_cents=100000 (deposit_required=10000); LIVE"
            - "Lot_Y: reserve_price_cents=100000 (deposit_required=10000); LIVE; Lot_X and Lot_Y intervals overlap"
            - "B places first bid on Lot_X — Deposit_X (10000) HELD; held_deposit_cents=10000"
          trigger:
            - "POST /lots/{Lot_Y.id}/bids by B amount_cents=100000  # would require new Deposit_Y (10000); aggregate held would become 20000 > wallet 15000"
          assert:
            - "HTTP 402; data.error_id == 'ERR_INSUFFICIENT_DEPOSIT_FUNDS'"

  # -------------------------------------------------------------------
  # Rule 9 — compensating-action invariants across DIFFERENT conserved quantities
  # -------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: deposit_ledger_conservation
        grounds:
          - state_machines.Bidder.ACTIVE_to_SUSPENDED
          - state_machines.Lot.LIVE_to_UNSOLD
          - entities.Deposit.fields.amount_cents
          - entities.Deposit.fields.refund_amount_cents
          - entities.Bidder.fields.wallet_balance_cents
          - entities.Bidder.fields.held_deposit_cents
        distinguishing_aspect: |
          Conserved quantity: Bidder cents ledger I_b = wallet_balance_cents +
          held_deposit_cents + sum(forfeit_amount_cents on terminal Deposits with
          bidder_id=b). Forward action: place bid → Deposit HELD (decrements
          wallet, increments held). Compensating action: Lot UNSOLD or Deposit
          RELEASED → wallet credited back by refund_amount_cents. Invariant: I_b
          constant across the forward+compensating cycle (no money is created or
          destroyed at the bidder level).
        test_recipe:
          setup:
            - "Bidder B with wallet_balance_cents=50000, held_deposit_cents=0; record I_b_initial = 50000"
            - "Lot LIVE with reserve=100000 (deposit_required=10000); B places bid 100000 → Deposit HELD"
            - "Verify after-bid: wallet_balance_cents=40000; held_deposit_cents=10000; I_b_during = 50000"
            - "Lot reaches close with no other bidders; reserve met (100000 >= 100000)? Yes — but we want to test UNSOLD path here. Adjust: Lot.reserve_price_cents=200000 so reserve unmet by 100000 → Lot LIVE→UNSOLD"
          trigger:
            - "Clock advance past scheduled_end_at; system Lot LIVE→UNSOLD; Deposit RELEASED"
          assert:
            - "Bidder.wallet_balance_cents == 50000  # restored"
            - "Bidder.held_deposit_cents == 0"
            - "Deposit.refund_amount_cents == 10000; Deposit.forfeit_amount_cents == 0"
            - "I_b_after = 50000 + 0 + 0 == I_b_initial = 50000  # invariant holds"

      - name: sale_proceeds_ledger_conservation_on_relist
        grounds:
          - state_machines.Lot.DISPUTED_to_RELISTED
          - state_machines.Invoice.PAID_to_REVERSED
          - calculations.commission_reversal
          - entities.Seller.fields.gross_proceeds_cents
          - entities.Seller.fields.net_proceeds_cents
          - entities.Invoice.fields.refund_amount_cents
          - entities.Invoice.fields.commission_reversal_amount_cents
        distinguishing_aspect: |
          Conserved quantity: per-Lot contribution to Seller.net_proceeds_cents
          across the full RELIST cycle. Forward action: Lot SOLD-and-PAID adds
          seller_payout_cents = hammer - commission to Seller.net_proceeds_cents.
          Compensating action: Dispute resolves RELIST → Invoice REVERSED with
          full refund_amount_cents=buyer_total and full commission_reversal_amount_cents=
          original seller_commission. Invariant: this Lot's net contribution to
          Seller.net_proceeds_cents == 0 after the cycle. Different conserved
          quantity from deposit_ledger_conservation (sale-proceeds vs deposit-
          movement).
        test_recipe:
          setup:
            - "Seller S baseline gross_proceeds_cents=0, net_proceeds_cents=0"
            - "Lot SOLD with hammer=100000, commission=10000; pay invoice → seller_payout=90000 added to S.gross_proceeds and S.net_proceeds"
            - "Verify: S.gross_proceeds_cents == 90000; S.net_proceeds_cents == 90000"
            - "Deliver lot; file dispute claimed_refund=115000; review"
          trigger:
            - "POST /disputes/{id}/resolve {outcome: RELIST}"
          assert:
            - "Invoice.status == 'REVERSED'"
            - "Invoice.refund_amount_cents == 115000  # full buyer_total"
            - "Invoice.commission_reversal_amount_cents == 10000  # full commission reversed"
            - "Seller.net_proceeds_cents == 0  # 90000 - (90000 - 0)? actually 90000 - 90000 = 0; net contribution returns to baseline"
            - "Seller.gross_proceeds_cents reflects the reversal too: spec choice — gross_proceeds_cents counts only PAID-and-not-REVERSED Invoices, so it returns to 0. Test asserts Seller.gross_proceeds_cents == 0 AND Seller.net_proceeds_cents == 0."
