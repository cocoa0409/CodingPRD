          assert:
            - "CapitationStatement.${stmt_id}.provisional_paid_cents == 99999  (3 * 33333)"
            - "CapitationStatement.${stmt_id}.final_amount_cents == 99998  (round(33333*0.8)=26666 twice + round(33333*1.4)=46666; sum-then-round would give 99999)"
            - "CapitationStatement.${stmt_id}.adjustment_cents == -1"
            - "CapitationStatement.${stmt_id}.status == RECONCILED"

  - rule_id: non_linear_state_machine
    instances:
      - name: encounter_correction_loop_cycles_rejected_to_validated
        grounds: [state_machines.Encounter.REJECTED_to_VALIDATED, state_machines.Encounter.REJECTED_to_REJECTED, calculations.provider_error_rate]
        distinguishing_aspect: |
          Encounter machine is cyclic: REJECTED -> correct -> REJECTED -> correct -> VALIDATED loops in place
          (correction_sequence stays 0, distinguishing correct from replace), and every loop turn feeds the
          provider scorecard (3 runs, 2 fatals, error_rate 0.6667, tier RED).
        test_recipe:
          setup:
            - "Program; August cycle; member ACTIVE; provider ACTIVE; one encounter with malformed diagnosis 9XX"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-LOOP", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["9XX"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e1}/correct", payload: { diagnosis_codes: ["7QQ"] }, as: McoEncounterOps }
          trigger:
            - { call: "POST /programs/encounters/${e1}/correct", payload: { diagnosis_codes: ["E11"] }, as: McoEncounterOps }
            - { call: "GET /programs/scorecards?provider_id=${prov_id}&cycle_id=${cyc_id}", as: McoEncounterOps, captures: { sc_runs: "$.data[0].run_count", sc_fatal: "$.data[0].fatal_finding_count", sc_tier: "$.data[0].tier" } }
          assert:
            - "Encounter.${e1}.status == VALIDATED after the second correction"
            - "Encounter.${e1}.correction_sequence == 0  (in-place correct never increments it)"
            - "Encounter.${e1}.validation_run_seq == 3"
            - "scorecard run_count == 3 and fatal_finding_count == 2 (E102 fired on run 1 and run 2)"
            - "scorecard tier == RED  (error_rate 0.6667 >= 0.05)"

      - name: batch_partial_branch_blocks_reconcile_until_denials_resolved
        grounds: [state_machines.SubmissionBatch.TRANSMITTED_to_PARTIAL, state_machines.SubmissionBatch.PARTIAL_to_RECONCILED, state_machines.Encounter.DENIED_to_SUPERSEDED]
        distinguishing_aspect: |
          Batch machine branches at acknowledgment: a mixed outcome forks to PARTIAL, whose reconcile is
          guarded (ERR_BATCH_HAS_UNRESOLVED_DENIALS) until the DENIED encounter leaves via the replace leg
          (DENIED -> SUPERSEDED) — divergent side-effect sets per branch on a different entity than the
          Encounter correction loop.
        test_recipe:
          setup:
            - "Program; TANF@50000 schedule; August cycle; member; provider; three clean VALIDATED encounters staged/sealed/transmitted"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-BRN", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 12000, lines: [{ line_number: 1, procedure_code: "99214", units: 1, billed_amount_cents: 12000, paid_amount_cents: 12000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E3", service_from_date: "2026-08-12", service_to_date: "2026-08-12", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 8000, lines: [{ line_number: 1, procedure_code: "99212", units: 1, billed_amount_cents: 8000, paid_amount_cents: 8000 }] }, as: McoEncounterOps, captures: { e3: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e3}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps, captures: { b_v2: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b_v2}" }, as: McoEncounterOps, captures: { b_v3: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e3}", expected_batch_version: "${b_v3}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }, { encounter_id: "${e2}", outcome: "DENIED", edit_code: "E501_STATE_EDIT" }, { encounter_id: "${e3}", outcome: "ACCEPTED" }] }, as: StateAgency }
          trigger:
            - { call: "POST /programs/batches/${b_id}/reconcile", payload: {}, as: McoEncounterOps, captures: { rec_err: $.data.error_id } }
            - { call: "POST /programs/encounters/${e2}/replace", payload: { encounter_ref: "E2R", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 12000, lines: [{ line_number: 1, procedure_code: "99214", units: 1, billed_amount_cents: 12000, paid_amount_cents: 12000 }] }, as: McoEncounterOps, captures: { e2r: $.data.id } }
            - { call: "POST /programs/batches/${b_id}/reconcile", payload: {}, as: McoEncounterOps }
          assert:
            - "first reconcile fails with ERR_BATCH_HAS_UNRESOLVED_DENIALS (captured rec_err)"
            - "Encounter.${e2}.status == SUPERSEDED after replace; Encounter.${e2r}.correction_sequence == 1 and replaces_encounter_id == ${e2}"
            - "second reconcile succeeds: SubmissionBatch.${b_id}.status == RECONCILED"
            - "cycle net_accepted_encounter_count == 2 and net_accepted_paid_cents == 18000 (e1 10000 + e3 8000; e2 superseded)"

  - rule_id: transitive_cascade
    instances:
      - name: audit_fail_penalty_posture_transmit_block
        grounds: [state_machines.Audit.DRAFT_to_DETERMINED, state_machines.SubmissionBatch.SEALED_to_TRANSMITTED, calculations.penalty_amount, entities.Program.fields.posture]
        distinguishing_aspect: |
          Depth-4 cascade triggered by audit determine: FAIL determination creates a PenaltyAssessment (link 1),
          which raises Program.penalties_outstanding_cents to 48000 (link 2), which crosses the 40000 threshold
          and flips posture to RESTRICTED (link 3), which then blocks the transmit of an unrelated SEALED
          batch with ERR_PROGRAM_RESTRICTED (link 4). Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Program with penalty_threshold_cents 40000; SSI@120000 schedule; August cycle; 4 SSI members"
            - "e1 ACKNOWLEDGED via batch1; e2 VALIDATED and staged into batch2 which is SEALED but not yet transmitted"
            - "Statement (provisional 480000) exists; audit sample 20 / defects 4 awaits determination"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-CAS1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 40000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "SSI", pmpm_cents: 120000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M2", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M3", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M4", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b1_id: $.data.id, b1_v1: $.data.version } }
            - { call: "POST /programs/batches/${b1_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b1_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b1_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b1_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b1_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-20", service_to_date: "2026-08-20", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 5000, lines: [{ line_number: 1, procedure_code: "99212", units: 1, billed_amount_cents: 5000, paid_amount_cents: 5000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b2_id: $.data.id, b2_v1: $.data.version } }
            - { call: "POST /programs/batches/${b2_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b2_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b2_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance }
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 20, defect_count: 4 }, as: StateAgency, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /programs/audits/${aud_id}/determine", payload: {}, as: StateAgency }
            - { call: "GET /programs/penalties?cycle_id=${cyc_id}", as: StateAgency, captures: { pen_amt: "$.data[0].amount_cents" } }
            - { call: "GET /programs/${prog_id}", as: StateAgency, captures: { posture_after: $.data.posture, outstanding_after: $.data.penalties_outstanding_cents } }
            - { call: "POST /programs/batches/${b2_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1", captures: { tx_err: $.data.error_id } }
          assert:
            - "penalty amount == 48000 (capped) with status ASSESSED — link 1"
            - "Program.${prog_id}.penalties_outstanding_cents == 48000 — link 2"
            - "Program.${prog_id}.posture == RESTRICTED — link 3 (48000 >= 40000)"
            - "transmit of unrelated SEALED batch ${b2_id} fails with ERR_PROGRAM_RESTRICTED — link 4"

      - name: late_transmit_penalty_posture_cascade
        grounds: [state_machines.SubmissionBatch.SEALED_to_TRANSMITTED, calculations.penalty_amount, entities.SubmissionBatch.fields.late]
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (transmit, not audit determine): late transmit sets
          batch.late and spawns a LATE_SUBMISSION penalty of 500000 + 2*100000 = 700000 (link 1), raising
          outstanding to 700000 (link 2), which crosses the 650000 threshold and flips posture to
          RESTRICTED (link 3).
        test_recipe:
          setup:
            - "Program with penalty_threshold_cents 650000; TANF@50000 schedule; August cycle with deadline 2026-09-15T00:00:00Z"
            - "One VALIDATED encounter staged and SEALED; logical clock moved to 2026-09-17T00:00:01Z (2 days and 1 second past deadline)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-CAS2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 650000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-17T00:00:01Z" }, as: StateAgency }
          trigger:
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1", captures: { late_flag: $.data.late } }
            - { call: "GET /programs/penalties?cycle_id=${cyc_id}", as: StateAgency, captures: { pen_amt: "$.data[0].amount_cents", pen_reason: "$.data[0].reason" } }
            - { call: "GET /programs/${prog_id}", as: StateAgency, captures: { posture_after: $.data.posture } }
          assert:
            - "SubmissionBatch.${b_id}.late == true (transmitted 2026-09-17T00:00:01Z > 2026-09-15T00:00:00Z)"
            - "penalty reason == LATE_SUBMISSION and amount == 700000 (500000 flat + floor(172801/86400)=2 days * 100000)"
            - "Program.${prog_id}.penalties_outstanding_cents == 700000 and posture == RESTRICTED (700000 >= 650000)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: transmit_draft_batch_while_restricted_state_beats_safety
        grounds: ["validations[priority=5]", "validations[priority=7]", "errors[ERR_INVALID_STATE_TRANSITION]", "errors[ERR_PROGRAM_RESTRICTED]"]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: a DRAFT batch transmitted while the program is
          RESTRICTED violates both priority 5 (not SEALED) and priority 7 (posture gate); the state error
          ERR_INVALID_STATE_TRANSITION must win. A SEALED control batch on the same program then shows the
          safety error surfacing once state passes.
        test_recipe:
          setup:
            - "Program with penalty_threshold_cents 0, so posture is RESTRICTED from creation (0 >= 0)"
            - "August cycle; member; provider; one VALIDATED encounter; batch1 left in DRAFT"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-PRIO1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 0 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
          trigger:
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1", captures: { err_draft: $.data.error_id } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1", captures: { err_sealed: $.data.error_id } }
          assert:
            - "DRAFT transmit fails with ERR_INVALID_STATE_TRANSITION (state, priority 5) — not ERR_PROGRAM_RESTRICTED"
            - "SEALED transmit on the same RESTRICTED program fails with ERR_PROGRAM_RESTRICTED (priority 7 fires once state passes)"

      - name: encounter_create_referential_beats_fiscal
        grounds: ["validations[priority=11]", "validations[priority=16]", "errors[ERR_NO_CYCLE_FOR_SERVICE_DATE]", "errors[ERR_HEADER_LINES_PAID_MISMATCH]"]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal: the create payload both misses any
          cycle window (service date 2026-10-05) and breaks header-vs-lines paid consistency; the referential
          error ERR_NO_CYCLE_FOR_SERVICE_DATE (priority 11) must beat ERR_HEADER_LINES_PAID_MISMATCH
          (priority 16).
        test_recipe:
          setup:
            - "Program with only the August cycle; member and provider exist and are ACTIVE"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-PRIO2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
          trigger:
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "EX", service_from_date: "2026-10-05", service_to_date: "2026-10-05", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 9999, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 100 }] }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "create fails with ERR_NO_CYCLE_FOR_SERVICE_DATE (referential), not ERR_HEADER_LINES_PAID_MISMATCH (fiscal)"
            - "GET /programs/encounters?program_id=${prog_id} returns total_count == 0 (nothing persisted)"

  - rule_id: boundary_precision_check
    instances:
      - name: audit_accuracy_exactly_at_threshold_passes
        grounds: [calculations.accuracy_rate, "validations[priority=28]", entities.Program.fields.accuracy_threshold]
        distinguishing_aspect: |
          Ratio boundary on the audit determine endpoint: accuracy_rate of exactly 0.95 (sample 20, defect 1)
          meets the >= threshold and the determination is PASS with no penalty — one defect more (0.90)
          would FAIL. Metric is a 4dp ratio; the >= (not >) semantics is the pinned behavior.
        test_recipe:
          setup:
            - "Program with default accuracy_threshold 0.95; TANF@50000 schedule; August cycle; 2 TANF members"
            - "1 encounter ACKNOWLEDGED (eligibility completeness = 1/ceil(2*0.5) = 1.0 passes); statement exists; audit sample 20 / defect 1"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-BND1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M2", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance }
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 20, defect_count: 1 }, as: StateAgency, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /programs/audits/${aud_id}/determine", payload: {}, as: StateAgency }
          assert:
            - "Audit.${aud_id}.accuracy_rate == 0.95  (1 - 1/20, exact boundary value)"
            - "Audit.${aud_id}.determination == PASS  (0.95 >= 0.95: boundary is inclusive)"
            - "GET /programs/penalties?cycle_id=${cyc_id} returns total_count == 0"

      - name: extension_request_exactly_at_deadline_allowed
        grounds: ["validations[priority=20]", "errors[ERR_EXTENSION_WINDOW_CLOSED]", entities.SubmissionCycle.fields.effective_deadline_at]
        distinguishing_aspect: |
          Timestamp boundary on the request-extension endpoint: a request with the logical clock exactly equal
          to effective_deadline_at is accepted (now <= deadline), while one second later is rejected with
          ERR_EXTENSION_WINDOW_CLOSED — a different metric (timestamp vs ratio) and endpoint than the audit
          accuracy boundary.
        test_recipe:
          setup:
            - "Program; August cycle with submission_deadline_at 2026-09-15T00:00:00Z; no extension yet (version 1)"
            - "Logical clock first set to exactly the deadline, then (after a deny) to deadline + 1 second"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-BND2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id, c_v1: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: StateAgency }
          trigger:
            - { call: "POST /programs/cycles/${cyc_id}/request-extension", payload: { requested_new_deadline_at: "2026-09-29T00:00:00Z", reason: "clearinghouse outage", expected_cycle_version: "${c_v1}" }, as: McoCompliance, captures: { c_v2: $.data.version, ext_status: $.data.extension_status } }
            - { call: "POST /programs/cycles/${cyc_id}/deny-extension", payload: {}, as: StateAgency, captures: { c_v3: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:01Z" }, as: StateAgency }
            - { call: "POST /programs/cycles/${cyc_id}/request-extension", payload: { requested_new_deadline_at: "2026-09-29T00:00:00Z", reason: "retry after denial", expected_cycle_version: "${c_v3}" }, as: McoCompliance, captures: { err: $.data.error_id } }
          assert:
            - "first request at exactly the deadline succeeds: extension_status == PENDING"
            - "deny succeeds (PENDING -> DENIED)"
            - "second request one second past the deadline fails with ERR_EXTENSION_WINDOW_CLOSED (window check is now <= deadline, boundary inclusive)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: encounter_validation_gated_by_member_enrollment_state
        grounds: [state_machines.Encounter.RECEIVED_to_REJECTED, state_machines.Member.ACTIVE_to_DISENROLLED, entities.ValidationFinding.fields.edit_code]
        distinguishing_aspect: |
          Entity pair Encounter -> Member: the validate transition's outcome depends on the Member's
          enrollment state (DISENROLLED with service date 2026-08-10 past enrolled_to 2026-08-05), producing
          FATAL finding E201_MEMBER_NOT_ELIGIBLE and REJECTED instead of VALIDATED.
        test_recipe:
          setup:
            - "Program; August cycle; member enrolled 2026-08-01 then disenrolled effective 2026-08-05; provider ACTIVE"
            - "Encounter with service_from_date 2026-08-10 (inside cycle window, outside enrollment)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-X1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/members/${m1}/disenroll", payload: { disenrolled_date: "2026-08-05" }, as: McoEncounterOps }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "GET /programs/encounters/${e1}/findings", as: McoEncounterOps, captures: { f_code: "$.data[0].edit_code", f_sev: "$.data[0].severity", f_tier: "$.data[0].tier" } }
          assert:
            - "Encounter.${e1}.status == REJECTED"
            - "finding edit_code == E201_MEMBER_NOT_ELIGIBLE with tier == REFERENTIAL and severity == FATAL"
            - "finding origin == MCO_EDIT (implied by validate run; state-ack findings only come from acknowledge)"

      - name: encounter_staging_gated_by_provider_scorecard_tier
        grounds: [state_machines.Encounter.VALIDATED_to_STAGED, calculations.provider_error_rate, "validations[priority=10]", "errors[ERR_PROVIDER_QUALITY_HOLD]"]
        distinguishing_aspect: |
          Entity pair Encounter -> ProviderScorecard: the VALIDATED -> STAGED transition depends on the
          scorecard for (provider, attributed cycle) — after one FATAL run the tier is RED (rate 1.0 >=
          0.05) and staging a different VALIDATED encounter of the same provider and cycle is rejected with
          ERR_PROVIDER_QUALITY_HOLD until remediation is acknowledged.
        test_recipe:
          setup:
            - "Program; August cycle; member; provider"
            - "e1 with malformed diagnosis REJECTED (scorecard: 1 run, 1 fatal, tier RED); e2 clean and VALIDATED"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-X2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["9XX"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
          trigger:
            - { call: "GET /programs/scorecards?provider_id=${prov_id}&cycle_id=${cyc_id}", as: McoEncounterOps, captures: { sc_tier: "$.data[0].tier", sc_id: "$.data[0].id" } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps, captures: { err: $.data.error_id } }
          assert:
            - "scorecard tier == RED after 1 FATAL in 1 run (error_rate 1.0 >= provider_red_threshold 0.05)"
            - "staging the provider's VALIDATED encounter e2 fails with ERR_PROVIDER_QUALITY_HOLD"
            - "Encounter.${e2}.status remains VALIDATED and batch encounter_count == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: cycle_windows_half_open_adjacency_allowed
        grounds: ["validations[priority=18]", "errors[ERR_CYCLE_OVERLAP]", entities.SubmissionCycle.fields.window_start_at]
        distinguishing_aspect: |
          Interval semantics: cycle windows are half-open [start, end), so a new cycle starting exactly at the
          existing cycle's window_end_at is accepted while one starting inside the window is rejected with
          ERR_CYCLE_OVERLAP — adjacency is NOT overlap on the SubmissionCycle resource.
        test_recipe:
          setup:
            - "Program with one cycle occupying [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-OV1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc1: $.data.id } }
          trigger:
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08B", window_start_at: "2026-08-15T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", submission_deadline_at: "2026-10-15T00:00:00Z" }, as: StateAgency, captures: { err: $.data.error_id } }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-09", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", submission_deadline_at: "2026-10-15T00:00:00Z" }, as: StateAgency, captures: { cyc2: $.data.id } }
          assert:
            - "overlapping cycle (start 2026-08-15 inside August window) fails with ERR_CYCLE_OVERLAP"
            - "adjacent cycle (start 2026-09-01 == existing window_end_at) succeeds with status OPEN"

      - name: rate_schedule_closed_interval_adjacency_is_overlap
        grounds: ["validations[priority=19]", "errors[ERR_RATE_SCHEDULE_OVERLAP]", entities.CapitationRateSchedule.fields.effective_to]
        distinguishing_aspect: |
          Different interval semantics on a different resource: rate-schedule windows are CLOSED
          [effective_from, effective_to], so a new TANF schedule starting 2026-08-31 — the exact day the
          existing one ends — IS an overlap (ERR_RATE_SCHEDULE_OVERLAP), while starting 2026-09-01 succeeds.
          Adjacency is allowed for cycles but forbidden here.
        test_recipe:
          setup:
            - "Program with TANF rate schedule effective [2026-08-01, 2026-08-31] (both ends inclusive)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-OV2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency, captures: { rs1: $.data.id } }
          trigger:
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 51000, effective_from: "2026-08-31", effective_to: "2026-09-30" }, as: StateAgency, captures: { err: $.data.error_id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 51000, effective_from: "2026-09-01", effective_to: "2026-09-30" }, as: StateAgency, captures: { rs2: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "SSI", pmpm_cents: 120000, effective_from: "2026-08-15", effective_to: "2026-09-15" }, as: StateAgency, captures: { rs3: $.data.id } }
          assert:
            - "schedule starting 2026-08-31 (== existing effective_to) fails with ERR_RATE_SCHEDULE_OVERLAP (closed interval shares that day)"
            - "schedule starting 2026-09-01 succeeds"
            - "overlapping dates for a DIFFERENT aid_category (SSI 08-15..09-15) also succeeds (overlap scope is per program + aid_category)"

  - rule_id: compensating_invariant
    instances:
      - name: replace_round_trip_restores_cycle_ledger
        grounds: [calculations.cycle_net_accepted, state_machines.Encounter.ACKNOWLEDGED_to_SUPERSEDED, state_machines.Encounter.SUBMITTED_to_ACKNOWLEDGED]
        distinguishing_aspect: |
          Conserved quantity: the cycle's accepted-encounter ledger (count and paid cents). Superseding an
          ACKNOWLEDGED 10000-cent encounter decrements the ledger to (1, 20000); its replacement carrying the
          same paid amount reaching ACKNOWLEDGED restores it to exactly (2, 30000) — forward action plus its
          compensating action leave the named quantities unchanged.
        test_recipe:
          setup:
            - "Program; TANF@50000 schedule; August cycle; member; provider"
            - "e1 (paid 10000) and e2 (paid 20000) both ACKNOWLEDGED in batch1; cycle nets are (2, 30000)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-INV1", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 20000, lines: [{ line_number: 1, procedure_code: "99215", units: 1, billed_amount_cents: 20000, paid_amount_cents: 20000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b1_id: $.data.id, b1_v1: $.data.version } }
            - { call: "POST /programs/batches/${b1_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b1_v1}" }, as: McoEncounterOps, captures: { b1_v2: $.data.version } }
            - { call: "POST /programs/batches/${b1_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b1_v2}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b1_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b1_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b1_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }, { encounter_id: "${e2}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "GET /programs/cycles/${cyc_id}", as: StateAgency, captures: { n_before: $.data.net_accepted_encounter_count, p_before: $.data.net_accepted_paid_cents } }
          trigger:
            - { call: "POST /programs/encounters/${e1}/replace", payload: { encounter_ref: "E1R", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1r: $.data.id } }
            - { call: "GET /programs/cycles/${cyc_id}", as: StateAgency, captures: { n_mid: $.data.net_accepted_encounter_count, p_mid: $.data.net_accepted_paid_cents } }
            - { call: "POST /programs/encounters/${e1r}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b2_id: $.data.id, b2_v1: $.data.version } }
            - { call: "POST /programs/batches/${b2_id}/encounters", payload: { encounter_id: "${e1r}", expected_batch_version: "${b2_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b2_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b2_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b2_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1r}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "GET /programs/cycles/${cyc_id}", as: StateAgency, captures: { n_after: $.data.net_accepted_encounter_count, p_after: $.data.net_accepted_paid_cents } }
          assert:
            - "before replace: net_accepted_encounter_count == 2 and net_accepted_paid_cents == 30000"
            - "after supersede (replacement not yet acknowledged): count == 1 and paid == 20000 (compensation leg)"
            - "after replacement acknowledged: count == 2 and paid == 30000 — ledger restored exactly"
            - "Encounter.${e1}.status == SUPERSEDED and Encounter.${e1r}.status == ACKNOWLEDGED with correction_sequence == 1"

      - name: assess_then_waive_restores_outstanding_penalties
        grounds: [state_machines.PenaltyAssessment.APPEALED_to_WAIVED, entities.Program.fields.penalties_outstanding_cents, calculations.penalty_amount]
        distinguishing_aspect: |
          Conserved quantity: the program's monetary penalties_outstanding_cents (a different quantity type
          than the encounter-count ledger). An audit FAIL assesses 48000 (outstanding 0 -> 48000); appeal
          plus resolve WAIVED is the compensating action and returns outstanding to exactly 0 with no drift.
        test_recipe:
          setup:
            - "Program (high penalty_threshold so posture stays OPEN); SSI@120000 schedule; August cycle; 4 SSI members; 1 encounter ACKNOWLEDGED; statement exists; audit sample 20 / defects 4"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-INV2", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "SSI", pmpm_cents: 120000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M2", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M3", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M4", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance }
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 20, defect_count: 4 }, as: StateAgency, captures: { aud_id: $.data.id } }
            - { call: "POST /programs/audits/${aud_id}/determine", payload: {}, as: StateAgency }
            - { call: "GET /programs/penalties?cycle_id=${cyc_id}", as: StateAgency, captures: { pen_id: "$.data[0].id" } }
            - { call: "GET /programs/${prog_id}", as: StateAgency, captures: { out_before: $.data.penalties_outstanding_cents } }
          trigger:
            - { call: "POST /programs/penalties/${pen_id}/appeal", payload: {}, as: McoCompliance }
            - { call: "POST /programs/penalties/${pen_id}/resolve", payload: { decision: "WAIVED" }, as: StateAgency }
            - { call: "GET /programs/${prog_id}", as: StateAgency, captures: { out_after: $.data.penalties_outstanding_cents } }
          assert:
            - "after determine: Program.penalties_outstanding_cents == 48000 (forward leg)"
            - "after appeal + WAIVED: Program.penalties_outstanding_cents == 0 (compensating leg restores exactly)"
            - "PenaltyAssessment.${pen_id}.status == WAIVED"
            - "Program.${prog_id}.posture == OPEN throughout (threshold 100000000 never crossed)"
