            - { call: "POST /api/model-runs/${run_t}/finalize", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${st}/submit-legal-review", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${st}/legal-decision", payload: { decision: APPROVE }, as: LegalCounsel }
            - { call: "POST /api/pay-equity-studies/${st}/open-remediation", payload: {}, as: LegalCounsel }
