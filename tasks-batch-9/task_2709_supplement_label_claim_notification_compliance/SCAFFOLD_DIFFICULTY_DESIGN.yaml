            - call: "PATCH /supplement-compliance/label-panels/${panel_id}"
              payload: { declared_warning_codes: ["ALLERGEN_SOYBEAN", "CONTRAINDICATION_ANTICOAGULANT", "PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/label-panels/${panel_id}/validate"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { err_second: $.data.error_id }
          assert:
            - "the first validate returns HTTP 422 with error_id == ERR_MANDATORY_WARNING_MISSING (priority 21), NOT ERR_PANEL_LINE_BUDGET_EXCEEDED (priority 23), even though 11 required lines already exceed the LINEAR allowance of 8"
            - "after adding ALLERGEN_SOYBEAN, the second validate returns HTTP 422 with error_id == ERR_PANEL_LINE_BUDGET_EXCEEDED"
            - "LabelPanel.${panel_id}.panel_status is still DRAFT after both attempts and validated_at == null"
            - "ProductIngredient.${line_soy_id}.dv_established == false and percent_dv_declared == null (this is the line that adds the dagger footnote)"
  - rule_id: boundary_precision_check
    instances:
      - name: serious_ae_fifteen_business_day_deadline_boundary
        grounds:
          - calculations.serious_ae_submission_due_date
          - calculations.product_compliance_risk_index
          - entities.AdverseEventReport.fields.submission_timeliness
          - entities.AdverseEventReport.fields.retention_until
          - state_machines.AdverseEventReport.TRIAGED_SERIOUS_to_SUBMITTED_TO_FDA
        distinguishing_aspect: |
          Metric under test: the 15-BUSINESS-DAY serious adverse event submission deadline
          at POST /supplement-compliance/adverse-event-reports/{id}/submit-to-fda. Two
          identical reports received 2026-08-03 are filed one second before and one second
          after the boundary instant 2026-08-25T00:00:00Z, so the only difference in the
          system is TIMELY versus LATE and the risk index that follows.
        test_recipe:
          setup:
            - "One DRAFT product with no lines, claims or panels."
            - "Two adverse event reports on it, both received_date 2026-08-03 with outcome code HOSPITALIZATION, both TRIAGED_SERIOUS, so serious_ae_count == 2 and compliance_risk_index == 55."
            - "Logical clock advanced explicitly around the 2026-08-24 due date."
          setup_api_calls:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Joint Relief", net_quantity_g: 60, servings_per_container: 30 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports"
              payload: { product_id: "${prod_id}", reporter_type: "CONSUMER", received_date: "2026-08-03", narrative: "Admitted overnight for observation", outcome_codes: ["HOSPITALIZATION"] }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { aer1_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports"
              payload: { product_id: "${prod_id}", reporter_type: "CONSUMER", received_date: "2026-08-03", narrative: "Second consumer admitted overnight", outcome_codes: ["HOSPITALIZATION"] }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { aer2_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports/${aer1_id}/triage"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { due1: $.data.submission_due_date, retain1: $.data.retention_until }
            - call: "POST /supplement-compliance/adverse-event-reports/${aer2_id}/triage"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
          trigger:
            - call: "POST /supplement-compliance/_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T23:59:59Z" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/adverse-event-reports/${aer1_id}/submit-to-fda"
              payload: { submission_reference: "SAE-2026-0001" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/adverse-event-reports/${aer2_id}/submit-to-fda"
              payload: { submission_reference: "SAE-2026-0002" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
          assert:
            - "AdverseEventReport.${aer1_id}.submission_due_date == 2026-08-24 (15 weekdays after Monday 2026-08-03, weekends skipped) and retention_until == 2032-08-03"
            - "AdverseEventReport.${aer1_id}.submission_timeliness == TIMELY and aer_status == SUBMITTED_TO_FDA"
            - "AdverseEventReport.${aer2_id}.submission_timeliness == LATE and aer_status == SUBMITTED_TO_FDA"
            - "Product.${prod_id}.late_notification_count == 1 (only the late filing counted)"
            - "Product.${prod_id}.compliance_risk_index == 77 (base 10 + 40 + 15 = 65, tier surcharge 12) and label_posture == RESTRICTED"
      - name: panel_changeover_buffer_seven_day_boundary
        grounds:
          - calculations.panel_effective_window_occupancy
          - validations[priority=29]
          - entities.LabelPanel.fields.effective_from
          - concurrency_rules[panel-create-stale-product]
        distinguishing_aspect: |
          A different metric on a different endpoint: the 7-DAY changeover buffer around a
          panel's effective window at POST /supplement-compliance/label-panels. Against a
          live window ending 2026-12-31, a candidate starting 2027-01-07 buffers back to
          exactly 2026-12-31 and collides, while 2027-01-08 buffers back to 2027-01-01 and
          is accepted — a one-day separation on a date metric, not on a business-day deadline.
        test_recipe:
          setup:
            - "One GRANDFATHERED VITAMIN ingredient (rdi_mg 90) on a DRAFT product (net_quantity_g 120, servings_per_container 60) with one ACTIVE line."
            - "One DRAFT panel P1 occupying 2026-09-01..2026-12-31; nothing supersedes it, so its window stays occupied."
            - "Product.version is 2 after P1's creation and is re-read before each candidate."
          setup_api_calls:
