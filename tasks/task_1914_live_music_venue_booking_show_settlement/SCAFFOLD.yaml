scenario: |
  1914. Live Music Venue Booking & Show Settlement (independent music venue): date hold &
  confirmation hierarchy, deal structure (guarantee/door split/versus) & expense budget,
  ticket scaling & on-sale coordination, advance (hospitality/tech/backline) & production
  requirements, night-of settlement with expense receipts & bar/merch splits, support act
  payment & buyout, cancellation/force majeure terms, artist deposit & wire

domain_name: live-music-venue-booking
api_prefix: /

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Show sits at the hub; DateHold is a competing-hold pool on (show_date, room);
  # Settlement rolls up from TicketTier sales + ExpenseReceipt + AncillarySplit.

  state_machine_shape: cyclic
  # Offer: PENDING → COUNTERED → PENDING (negotiation loop)
  # DateHold: HOLD_P1 ⇄ HOLD_P2 (challenge/upgrade loop)
  # Show: linear pipeline with revert (CANCELLED, POSTPONED) plus terminal SETTLED

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # BookingAgent creates Offer; VenueManager confirms; Promoter settles; Accountant wires;
  # separate roles prevent single-actor from both booking and settling.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Artist or band legal name" }
      - { name: agency, type: string, source: input, description: "Booking agency name" }
      - { name: guarantee_floor_cents, type: integer, source: input, description: "Minimum acceptable guarantee in cents" }
      - { name: deposit_pct, type: number, source: input, description: "Fraction of guarantee required as deposit (0.0–0.5)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE, SUSPENDED" }
      - { name: total_settled_shows, type: integer, source: computed, description: "Count of Shows in SETTLED state for this artist" }

  - name: Show
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; headline artist" }
      - { name: room, type: enum, source: input, description: "MAIN_ROOM | LOUNGE", constraints: "MAIN_ROOM, LOUNGE" }
      - { name: show_date, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD) of performance" }
      - { name: doors_at_utc, type: datetime, source: input, description: "Doors-open timestamp" }
      - { name: curfew_at_utc, type: datetime, source: input, description: "Hard curfew timestamp" }
      - { name: status, type: enum, source: system, description: "HOLD_PENDING | CONFIRMED | ON_SALE | ADVANCED | SHOW_NIGHT | SETTLED | CANCELLED | POSTPONED", constraints: "HOLD_PENDING, CONFIRMED, ON_SALE, ADVANCED, SHOW_NIGHT, SETTLED, CANCELLED, POSTPONED" }
      - { name: hold_priority, type: enum, source: system, description: "NONE | P1 | P2 | COURTESY", constraints: "NONE, P1, P2, COURTESY" }
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; the accepted deal governing this show" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "Artist deposit owed (= guarantee × deposit_pct at confirm time)" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Cumulative artist deposit received to date" }
      - { name: deposit_due_by_utc, type: datetime, source: computed, description: "Deadline for deposit wire; default = show_date − 14 days at confirm" }
      - { name: total_capacity, type: integer, source: input, description: "Ticket capacity across all tiers" }
      - { name: tickets_sold, type: integer, source: computed, description: "Sum of non-refunded TicketSale.quantity" }
      - { name: gross_ticket_revenue_cents, type: integer, source: computed, description: "Sum of non-refunded TicketSale gross_amount_cents" }
      - { name: on_sale_at_utc, type: datetime, source: input, description: "Public on-sale timestamp" }
      - { name: weather_or_emergency_flag, type: boolean, source: system, default: false, description: "Set when force-majeure invoked" }
      - { name: cancellation_reason, type: enum, source: system, description: "NONE | ARTIST | VENUE | FORCE_MAJEURE | LOW_TICKET_SALES", constraints: "NONE, ARTIST, VENUE, FORCE_MAJEURE, LOW_TICKET_SALES" }

  - name: DateHold
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: priority, type: enum, source: input, description: "P1 | P2 | COURTESY", constraints: "P1, P2, COURTESY" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CHALLENGED | CONFIRMED | RELEASED | EXPIRED", constraints: "ACTIVE, CHALLENGED, CONFIRMED, RELEASED, EXPIRED" }
      - { name: hold_expires_at_utc, type: datetime, source: computed, description: "Expiration = created_at + HOLD_TTL_HOURS (48h P1, 24h P2, 12h COURTESY)" }
      - { name: challenge_window_ends_at_utc, type: datetime, source: computed, description: "If challenged, window close (challenge_at + 24h)" }
      - { name: booked_by_agent_id, type: string, source: input, description: "FK -> BookingAgent.id of agent that placed the hold" }

  - name: BookingAgent
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Agent display name" }
      - { name: agency_name, type: string, source: input, description: "Agency legal name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE, SUSPENDED" }

  - name: Offer
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: round_number, type: integer, source: computed, description: "1, 2, 3, … per Show; increments on each new offer" }
      - { name: proposed_by_role, type: enum, source: system, description: "BOOKING_AGENT | VENUE_MANAGER", constraints: "BOOKING_AGENT, VENUE_MANAGER" }
      - { name: deal_kind, type: enum, source: input, description: "FLAT_GUARANTEE | DOOR_SPLIT | VERSUS", constraints: "FLAT_GUARANTEE, DOOR_SPLIT, VERSUS" }
      - { name: guarantee_cents, type: integer, source: input, description: "Guarantee amount (>=0); required for FLAT_GUARANTEE and VERSUS" }
      - { name: artist_split_pct, type: number, source: input, description: "Artist share of net door (0.0–1.0); required for DOOR_SPLIT and VERSUS" }
      - { name: versus_threshold_cents, type: integer, source: input, description: "For VERSUS: door-revenue threshold above which split applies" }
      - { name: status, type: enum, source: system, description: "PENDING | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | SUPERSEDED", constraints: "PENDING, COUNTERED, ACCEPTED, REJECTED, WITHDRAWN, SUPERSEDED" }
      - { name: expense_budget_cents, type: integer, source: input, description: "Cap on recoupable house expenses for this show" }
      - { name: support_budget_cents, type: integer, source: input, description: "Cap on total support-act payouts" }
      - { name: bar_split_pct, type: number, source: input, description: "Artist share of net bar revenue (0.0–0.25)" }
      - { name: merch_split_pct, type: number, source: input, description: "Venue share of gross merch (0.0–0.30)" }
      - { name: supersedes_offer_id, type: string, source: system, description: "FK -> Offer.id; offer this one replaces (null for round 1)" }

  - name: Deal
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; the accepted offer snapshot" }
      - { name: deal_kind, type: enum, source: system, description: "Snapshot from Offer: FLAT_GUARANTEE | DOOR_SPLIT | VERSUS", constraints: "FLAT_GUARANTEE, DOOR_SPLIT, VERSUS" }
      - { name: guarantee_cents, type: integer, source: system, description: "Snapshot from Offer" }
      - { name: artist_split_pct, type: number, source: system, description: "Snapshot from Offer" }
      - { name: versus_threshold_cents, type: integer, source: system, description: "Snapshot from Offer" }
      - { name: expense_budget_cents, type: integer, source: system, description: "Snapshot from Offer" }
      - { name: support_budget_cents, type: integer, source: system, description: "Snapshot from Offer" }
      - { name: bar_split_pct, type: number, source: system, description: "Snapshot from Offer" }
      - { name: merch_split_pct, type: number, source: system, description: "Snapshot from Offer" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOID", constraints: "ACTIVE, VOID" }

  - name: TicketTier
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: tier_name, type: string, source: input, description: "GA | VIP | BALCONY etc." }
      - { name: face_price_cents, type: integer, source: input, description: "Per-ticket face value (>0)" }
      - { name: capacity, type: integer, source: input, description: "Tier capacity (>0)" }
      - { name: sold_count, type: integer, source: computed, description: "Tickets sold in this tier" }
      - { name: refund_count, type: integer, source: computed, description: "Tickets refunded in this tier" }
      - { name: tier_order, type: integer, source: input, description: "Walk-up scaling order (lower number = cheaper, sold first at door)" }

  - name: TicketSale
    parent: Show
    common_fields: false
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: tier_id, type: string, source: system, description: "FK -> TicketTier.id" }
      - { name: quantity, type: integer, source: input, description: "Number of tickets in this sale (>=1)" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "quantity × tier.face_price_cents at time of sale" }
      - { name: sold_at_utc, type: datetime, source: system, description: "Server-stamped time of sale" }
      - { name: refund_status, type: enum, source: system, description: "NONE | REFUNDED", constraints: "NONE, REFUNDED" }

  - name: AdvanceChecklist
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: hospitality_done, type: boolean, source: system, default: false, description: "Hospitality rider received" }
      - { name: tech_done, type: boolean, source: system, default: false, description: "Tech rider received and approved" }
      - { name: backline_done, type: boolean, source: system, default: false, description: "Backline list confirmed" }
      - { name: production_requirements_done, type: boolean, source: system, default: false, description: "Stage plot, input list, lighting plot all received" }
      - { name: insurance_cert_received, type: boolean, source: system, default: false, description: "Certificate of insurance on file" }
      - { name: w9_received, type: boolean, source: system, default: false, description: "Artist W-9 on file" }
      - { name: all_complete, type: boolean, source: computed, description: "true iff all six booleans true" }

  - name: SupportAct
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: artist_name, type: string, source: input, description: "Support artist name" }
      - { name: agreed_fee_cents, type: integer, source: input, description: "Negotiated support fee" }
      - { name: buyout_fee_cents, type: integer, source: input, description: "Buyout amount (must be >= 0.5 × agreed_fee_cents and <= agreed_fee_cents)" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | PERFORMED | BOUGHT_OUT | CANCELLED", constraints: "CONFIRMED, PERFORMED, BOUGHT_OUT, CANCELLED" }
      - { name: paid_cents, type: integer, source: computed, description: "Total paid to this support act" }

  - name: ExpenseReceipt
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: category, type: enum, source: input, description: "SOUND | LIGHTS | BACKLINE | HOSPITALITY | SECURITY | MARKETING | MISC", constraints: "SOUND, LIGHTS, BACKLINE, HOSPITALITY, SECURITY, MARKETING, MISC" }
      - { name: amount_cents, type: integer, source: input, description: "Expense amount (>0)" }
      - { name: receipt_reference, type: string, source: input, description: "Receipt/invoice number" }
      - { name: submitted_by_role, type: enum, source: system, description: "PROMOTER | VENUE_MANAGER", constraints: "PROMOTER, VENUE_MANAGER" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED", constraints: "PENDING, APPROVED, REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Filled on REJECTED" }
      - { name: is_recoupable, type: boolean, source: input, default: true, description: "If false, expense is house-only and never deducted from door" }

  - name: AncillaryRevenue
    parent: Show
    common_fields: false
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: kind, type: enum, source: input, description: "BAR | MERCH", constraints: "BAR, MERCH" }
      - { name: gross_cents, type: integer, source: input, description: "Gross receipts for the night (>0)" }
      - { name: cost_cents, type: integer, source: input, description: "Cost of goods sold (>=0); for MERCH this is the artist's cost (not deducted from venue split)" }
      - { name: recorded_by_role, type: enum, source: system, description: "PROMOTER | VENUE_MANAGER", constraints: "PROMOTER, VENUE_MANAGER" }
      - { name: recorded_at_utc, type: datetime, source: system, description: "Server timestamp" }

  - name: Settlement
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id (1:1)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | PAID | DISPUTED", constraints: "DRAFT, SUBMITTED, APPROVED, PAID, DISPUTED" }
      - { name: gross_ticket_revenue_cents, type: integer, source: computed, description: "Snapshot from Show at draft" }
      - { name: recoupable_expenses_cents, type: integer, source: computed, description: "Sum of APPROVED ExpenseReceipt where is_recoupable=true, capped at Deal.expense_budget_cents" }
      - { name: net_door_cents, type: integer, source: computed, description: "gross_ticket_revenue_cents − recoupable_expenses_cents (floor at 0)" }
      - { name: artist_door_share_cents, type: integer, source: computed, description: "Per deal_kind formula (guarantee vs door-split vs versus)" }
      - { name: guarantee_paid_cents, type: integer, source: computed, description: "Guarantee portion of artist payout (0 for DOOR_SPLIT; else min(guarantee, applicable))" }
      - { name: bonus_cents, type: integer, source: computed, description: "For VERSUS deals only: amount above threshold times split_pct (else 0)" }
      - { name: bar_artist_share_cents, type: integer, source: computed, description: "round_half_up( (bar_gross − bar_cost) × bar_split_pct )" }
      - { name: merch_venue_share_cents, type: integer, source: computed, description: "round_half_up( merch_gross × merch_split_pct ); merch cost NOT deducted" }
      - { name: support_payouts_cents, type: integer, source: computed, description: "Sum of SupportAct.paid_cents (performed + bought_out)" }
      - { name: deposit_credit_cents, type: integer, source: computed, description: "Deposit already paid, applied against artist payout" }
      - { name: artist_total_due_cents, type: integer, source: computed, description: "artist_door_share + bar_artist_share + bonus − deposit_credit (floor 0)" }
      - { name: venue_net_cents, type: integer, source: computed, description: "net_door − artist_door_share − support_payouts + merch_venue_share + (bar_gross−bar_cost−bar_artist_share)" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "When status → SUBMITTED" }
      - { name: approved_by_user_id, type: string, source: system, description: "Accountant opaque user id who approved" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Promoter opaque user id who submitted" }

  - name: WireTransfer
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: purpose, type: enum, source: input, description: "ARTIST_DEPOSIT | ARTIST_BALANCE | SUPPORT_FEE | SUPPORT_BUYOUT | REFUND_TO_VENUE", constraints: "ARTIST_DEPOSIT, ARTIST_BALANCE, SUPPORT_FEE, SUPPORT_BUYOUT, REFUND_TO_VENUE" }
      - { name: amount_cents, type: integer, source: input, description: "Amount (>0)" }
      - { name: recipient_artist_id, type: string, source: input, description: "FK -> Artist.id for artist-bound wires; null otherwise" }
      - { name: support_act_id, type: string, source: input, description: "FK -> SupportAct.id for support wires; null otherwise" }
      - { name: status, type: enum, source: system, description: "INITIATED | COMPLETED | FAILED | RETURNED", constraints: "INITIATED, COMPLETED, FAILED, RETURNED" }
      - { name: initiated_by_role, type: enum, source: system, description: "ACCOUNTANT", constraints: "ACCOUNTANT" }
      - { name: initiated_at_utc, type: datetime, source: system, description: "Server timestamp" }
      - { name: completed_at_utc, type: datetime, source: system, description: "Server timestamp on COMPLETED" }
      - { name: failure_reason, type: string, source: system, description: "Filled on FAILED" }
      - { name: settlement_id, type: string, source: input, description: "FK -> Settlement.id when purpose=ARTIST_BALANCE; null otherwise" }

  - name: CancellationEvent
    parent: Show
    common_fields: false
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: reason, type: enum, source: input, description: "ARTIST | VENUE | FORCE_MAJEURE | LOW_TICKET_SALES", constraints: "ARTIST, VENUE, FORCE_MAJEURE, LOW_TICKET_SALES" }
      - { name: declared_by_role, type: enum, source: system, description: "BOOKING_AGENT | VENUE_MANAGER | PROMOTER", constraints: "BOOKING_AGENT, VENUE_MANAGER, PROMOTER" }
      - { name: declared_at_utc, type: datetime, source: system, description: "Server timestamp" }
      - { name: days_before_show, type: integer, source: computed, description: "Calendar days between declared_at and show_date (floor)" }
      - { name: artist_penalty_pct, type: number, source: computed, description: "From sliding scale in cancellation_policy calculation" }
      - { name: artist_penalty_cents, type: integer, source: computed, description: "artist_penalty_pct × guarantee_cents" }
      - { name: deposit_refundable_cents, type: integer, source: computed, description: "Portion of deposit to return to venue (depends on reason)" }
      - { name: support_kill_fee_cents, type: integer, source: computed, description: "Sum of 0.5 × agreed_fee_cents for CONFIRMED support acts at time of cancellation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DateHold
    initial_state: ACTIVE
    terminal_states: [CONFIRMED, RELEASED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CHALLENGED
        trigger: "POST /shows/{show_id}/date-holds/{hold_id}/challenge"
        actor: BookingAgent
        preconditions:
          - "hold.status == ACTIVE"
          - "caller is a different BookingAgent than hold.booked_by_agent_id"
          - "caller places a higher-priority hold on same (show.room, show.show_date)"
        side_effects:
          - "set hold.challenge_window_ends_at_utc = now + 24h"
          - "create a new DateHold (priority=caller's priority, status=ACTIVE) on the same (room, show_date)"
      - from: CHALLENGED
        to: CONFIRMED
        trigger: "POST /shows/{show_id}/date-holds/{hold_id}/confirm"
        actor: BookingAgent
        preconditions:
          - "hold.status == CHALLENGED"
          - "now < hold.challenge_window_ends_at_utc"
          - "caller.id == hold.booked_by_agent_id"
        side_effects:
          - "show.status = CONFIRMED; show.hold_priority = hold.priority"
          - "all other DateHolds on same (room, show_date) transition ACTIVE/CHALLENGED → RELEASED"
      - from: ACTIVE
        to: CONFIRMED
        trigger: "POST /shows/{show_id}/date-holds/{hold_id}/confirm"
        actor: BookingAgent
        preconditions:
          - "hold.status == ACTIVE"
          - "now < hold.hold_expires_at_utc"
          - "caller.id == hold.booked_by_agent_id"
          - "no other DateHold on same (room, show_date) in state ACTIVE with strictly higher priority"
        side_effects:
          - "show.status = CONFIRMED; show.hold_priority = hold.priority"
          - "all other DateHolds on same (room, show_date) transition ACTIVE/CHALLENGED → RELEASED"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /shows/{show_id}/date-holds/{hold_id}/release"
        actor: BookingAgent
        preconditions:
          - "hold.status == ACTIVE"
          - "caller.id == hold.booked_by_agent_id"
        side_effects: []
      - from: CHALLENGED
        to: RELEASED
        trigger: "POST /shows/{show_id}/date-holds/{hold_id}/release"
        actor: BookingAgent
        preconditions:
          - "hold.status == CHALLENGED"
          - "caller.id == hold.booked_by_agent_id"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock event: now >= hold.hold_expires_at_utc"
        actor: system
        preconditions: []
        side_effects:
          - "show.status remains HOLD_PENDING"
      - from: CHALLENGED
        to: EXPIRED
        trigger: "system clock event: now >= hold.challenge_window_ends_at_utc"
        actor: system
        preconditions: []
        side_effects:
          - "show.status remains HOLD_PENDING"

  - entity: Offer
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /shows/{show_id}/offers/{offer_id}/counter"
        actor: "BookingAgent or VenueManager (must be opposite of proposed_by_role)"
        preconditions:
          - "offer.status == PENDING"
          - "show.status IN {HOLD_PENDING, CONFIRMED}"
          - "caller role != offer.proposed_by_role"
        side_effects:
          - "create a new Offer with round_number = offer.round_number + 1, proposed_by_role = caller role, supersedes_offer_id = offer.id, status = PENDING"
          - "offer.status remains COUNTERED"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /shows/{show_id}/offers/{offer_id}/accept"
        actor: "BookingAgent or VenueManager (must be opposite of proposed_by_role)"
        preconditions:
          - "offer.status == PENDING"
          - "show.status == CONFIRMED"
          - "caller role != offer.proposed_by_role"
        side_effects:
          - "create Deal snapshot from offer; set deal.status = ACTIVE"
          - "show.deal_id = deal.id"
          - "show.deposit_required_cents = offer.guarantee_cents × artist.deposit_pct (rounded half-up); show.deposit_due_by_utc = show.show_date − 14 days"
          - "any other Offer on same show in state PENDING or COUNTERED transitions → SUPERSEDED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /shows/{show_id}/offers/{offer_id}/reject"
        actor: "BookingAgent or VenueManager (must be opposite of proposed_by_role)"
        preconditions:
          - "offer.status == PENDING"
          - "caller role != offer.proposed_by_role"
        side_effects: []
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /shows/{show_id}/offers/{offer_id}/withdraw"
        actor: "Same role as proposed_by_role"
        preconditions:
          - "offer.status == PENDING"
          - "caller role == offer.proposed_by_role"
        side_effects: []
      - from: COUNTERED
        to: SUPERSEDED
        trigger: "system: a new PENDING Offer with supersedes_offer_id == this offer's successor reaches ACCEPTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Show
    initial_state: HOLD_PENDING
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: HOLD_PENDING
        to: CONFIRMED
        trigger: "system: DateHold transition ACTIVE→CONFIRMED or CHALLENGED→CONFIRMED"
        actor: system
        preconditions:
          - "at least one DateHold on this show reached CONFIRMED"
        side_effects:
          - "show.hold_priority set from confirmed hold"
      - from: CONFIRMED
        to: ON_SALE
        trigger: "POST /shows/{show_id}/on-sale"
        actor: Promoter
        preconditions:
          - "show.status == CONFIRMED"
          - "show.deal_id is set"
          - "show.deposit_paid_cents >= show.deposit_required_cents"
          - "now >= show.on_sale_at_utc"
          - "at least one TicketTier exists for this show"
        side_effects:
          - "ticket sales become accepted (TicketSale creation allowed)"
      - from: ON_SALE
        to: ADVANCED
        trigger: "POST /shows/{show_id}/advance/complete"
        actor: ProductionManager
        preconditions:
          - "show.status == ON_SALE"
          - "show.advance_checklist.all_complete == true"
        side_effects: []
      - from: ADVANCED
        to: SHOW_NIGHT
        trigger: "system clock event: now >= show.doors_at_utc AND now < show.curfew_at_utc"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHOW_NIGHT
        to: SETTLED
        trigger: "system: Settlement transition APPROVED→PAID"
        actor: system
        preconditions:
          - "settlement.status == PAID"
          - "all WireTransfers with purpose IN {ARTIST_BALANCE, SUPPORT_FEE, SUPPORT_BUYOUT} for this show are in terminal state COMPLETED"
        side_effects:
          - "artist.total_settled_shows += 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /shows/{show_id}/cancel"
        actor: "BookingAgent, VenueManager, or Promoter"
        preconditions:
          - "show.status IN {CONFIRMED, ON_SALE, ADVANCED}"
        side_effects:
          - "create CancellationEvent with computed penalties"
          - "refund all non-refunded TicketSales (refund_status NONE → REFUNDED); show.tickets_sold recomputed"
          - "support acts in CONFIRMED transition → CANCELLED; create SUPPORT_BUYOUT WireTransfer for kill_fee per support act if cancellation is ARTIST or VENUE; no kill fee if FORCE_MAJEURE"
          - "if show.deposit_paid_cents > 0 and reason in {ARTIST, FORCE_MAJEURE}: deposit refundable per cancellation_policy; create REFUND_TO_VENUE WireTransfer"
          - "show.deal.status = VOID"
      - from: ON_SALE
        to: CANCELLED
        trigger: "POST /shows/{show_id}/cancel"
        actor: "BookingAgent, VenueManager, or Promoter"
        preconditions: ["show.status IN {CONFIRMED, ON_SALE, ADVANCED}"]
        side_effects:
          - "same cascade as CONFIRMED → CANCELLED"
      - from: ADVANCED
        to: CANCELLED
        trigger: "POST /shows/{show_id}/cancel"
        actor: "BookingAgent, VenueManager, or Promoter"
        preconditions: ["show.status IN {CONFIRMED, ON_SALE, ADVANCED}"]
        side_effects:
          - "same cascade as CONFIRMED → CANCELLED"
      - from: CONFIRMED
        to: POSTPONED
        trigger: "POST /shows/{show_id}/postpone"
        actor: VenueManager
        preconditions:
          - "show.status IN {CONFIRMED, ON_SALE}"
          - "request includes new_show_date > show.show_date"
        side_effects:
          - "create new Show with same artist, new show_date, status=HOLD_PENDING; carry-over TicketSales are NOT transferred; existing show remains POSTPONED"
      - from: ON_SALE
        to: POSTPONED
        trigger: "POST /shows/{show_id}/postpone"
        actor: VenueManager
        preconditions: ["show.status IN {CONFIRMED, ON_SALE}"]
        side_effects: ["same as CONFIRMED → POSTPONED"]
      - from: POSTPONED
        to: CANCELLED
        trigger: "POST /shows/{show_id}/cancel"
        actor: VenueManager
        preconditions: ["show.status == POSTPONED"]
        side_effects:
          - "no further refund (tickets already refunded on postpone)"

  - entity: AdvanceChecklist
    initial_state: "all false (all_complete=false)"
    terminal_states: ["all_complete=true"]
    transitions:
      - from: "any checklist item false"
        to: "that item true"
        trigger: "POST /shows/{show_id}/advance/items/{item_name}/complete"
        actor: ProductionManager
        preconditions:
          - "show.status IN {CONFIRMED, ON_SALE}"
          - "item_name IN {hospitality, tech, backline, production_requirements, insurance_cert, w9}"
        side_effects:
          - "recompute all_complete"
      - from: "any checklist item true"
        to: "that item false"
        trigger: "POST /shows/{show_id}/advance/items/{item_name}/uncomplete"
        actor: ProductionManager
        preconditions:
          - "show.status IN {CONFIRMED, ON_SALE}"
        side_effects:
          - "recompute all_complete"

  - entity: SupportAct
    initial_state: CONFIRMED
    terminal_states: [PERFORMED, BOUGHT_OUT, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: PERFORMED
        trigger: "POST /shows/{show_id}/support-acts/{support_act_id}/mark-performed"
        actor: Promoter
        preconditions:
          - "show.status == SHOW_NIGHT"
          - "support_act.status == CONFIRMED"
        side_effects:
          - "create WireTransfer purpose=SUPPORT_FEE amount=agreed_fee_cents status=INITIATED"
      - from: CONFIRMED
        to: BOUGHT_OUT
        trigger: "POST /shows/{show_id}/support-acts/{support_act_id}/buyout"
        actor: Promoter
        preconditions:
          - "support_act.status == CONFIRMED"
          - "show.status IN {CONFIRMED, ON_SALE, ADVANCED}"
          - "sum of buyout_fee_cents over BOUGHT_OUT + agreed_fee_cents over CONFIRMED support acts on this show <= Deal.support_budget_cents"
        side_effects:
          - "create WireTransfer purpose=SUPPORT_BUYOUT amount=buyout_fee_cents status=INITIATED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system: Show → CANCELLED cascade"
        actor: system
        preconditions: []
        side_effects:
          - "if show.cancellation_reason IN {ARTIST, VENUE}: create WireTransfer purpose=SUPPORT_BUYOUT amount=0.5 × agreed_fee_cents (kill fee) status=INITIATED"
          - "if show.cancellation_reason == FORCE_MAJEURE: no kill fee"

  - entity: ExpenseReceipt
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /shows/{show_id}/expense-receipts/{receipt_id}/approve"
        actor: VenueManager
        preconditions:
          - "receipt.status == PENDING"
          - "show.status IN {SHOW_NIGHT, CONFIRMED, ON_SALE, ADVANCED}"
        side_effects:
          - "recompute settlement.recoupable_expenses_cents if settlement exists"
      - from: PENDING
        to: REJECTED
        trigger: "POST /shows/{show_id}/expense-receipts/{receipt_id}/reject"
        actor: VenueManager
        preconditions:
          - "receipt.status == PENDING"
          - "rejection_reason provided"
        side_effects: []

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /shows/{show_id}/settlement/submit"
        actor: Promoter
        preconditions:
          - "settlement.status == DRAFT"
          - "show.status == SHOW_NIGHT"
          - "all ExpenseReceipts for this show in terminal state (APPROVED or REJECTED)"
          - "all SupportActs for this show in terminal state (PERFORMED, BOUGHT_OUT, or CANCELLED)"
        side_effects:
          - "settlement.submitted_at_utc = now; settlement.submitted_by_user_id = caller"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /shows/{show_id}/settlement/approve"
        actor: Accountant
        preconditions:
          - "settlement.status == SUBMITTED"
          - "caller.id != settlement.submitted_by_user_id  (segregation of duties)"
        side_effects:
          - "settlement.approved_by_user_id = caller"
          - "create WireTransfer purpose=ARTIST_BALANCE amount=artist_total_due_cents status=INITIATED if amount > 0"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /shows/{show_id}/settlement/dispute"
        actor: BookingAgent
        preconditions:
          - "settlement.status == SUBMITTED"
        side_effects: []
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /shows/{show_id}/settlement/return-to-draft"
        actor: Promoter
        preconditions:
          - "settlement.status == DISPUTED"
        side_effects:
          - "recompute all settlement computed fields from current show state"
      - from: APPROVED
        to: PAID
        trigger: "system: WireTransfer purpose=ARTIST_BALANCE for this settlement reaches COMPLETED"
        actor: system
        preconditions:
          - "settlement.status == APPROVED"
          - "artist-balance wire COMPLETED"
        side_effects:
          - "show.status → SETTLED if all support wires also COMPLETED"

  - entity: WireTransfer
    initial_state: INITIATED
    terminal_states: [COMPLETED, FAILED, RETURNED]
    transitions:
      - from: INITIATED
        to: COMPLETED
        trigger: "POST /shows/{show_id}/wire-transfers/{wire_id}/complete"
        actor: Accountant
        preconditions:
          - "wire.status == INITIATED"
        side_effects:
          - "wire.completed_at_utc = now"
          - "if purpose == ARTIST_DEPOSIT: show.deposit_paid_cents += amount_cents"
          - "if purpose == ARTIST_BALANCE and settlement exists: settlement.status → PAID"
          - "if purpose == SUPPORT_FEE or SUPPORT_BUYOUT: support_act.paid_cents += amount_cents"
      - from: INITIATED
        to: FAILED
        trigger: "POST /shows/{show_id}/wire-transfers/{wire_id}/fail"
        actor: Accountant
        preconditions:
          - "wire.status == INITIATED"
          - "failure_reason provided"
        side_effects: []
      - from: FAILED
        to: INITIATED
        trigger: "POST /shows/{show_id}/wire-transfers/{wire_id}/retry"
        actor: Accountant
        preconditions:
          - "wire.status == FAILED"
        side_effects:
          - "wire.failure_reason cleared"
      - from: COMPLETED
        to: RETURNED
        trigger: "POST /shows/{show_id}/wire-transfers/{wire_id}/mark-returned"
        actor: Accountant
        preconditions:
          - "wire.status == COMPLETED"
          - "show.status == CANCELLED"
          - "purpose == ARTIST_DEPOSIT"
        side_effects:
          - "show.deposit_paid_cents -= amount_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: date-hold-confirm-stale-show
    parent_entity: Show
    write_endpoint: "POST /shows/{show_id}/date-holds/{hold_id}/confirm"
    occ_field: "expected_show_version"
    description: |
      Confirming a DateHold against a Show whose `version` has advanced since the
      caller last observed it is rejected with 412. Captures the case where another
      agent has already confirmed a competing hold on the same (room, show_date),
      bumping show.version; the caller's view of the show is stale and the
      confirm MUST be rejected as a stale-version precondition rather than a
      state precondition (a sequential second caller observing show.status ==
      CONFIRMED might still legitimately attempt to confirm its own hold if it
      held a higher-priority ACTIVE hold).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: offer-accept-stale-show
    parent_entity: Show
    write_endpoint: "POST /shows/{show_id}/offers/{offer_id}/accept"
    occ_field: "expected_show_version"
    description: |
      Accepting an Offer against a Show whose `version` has advanced since the
      caller last observed it is rejected with 412. The offer-accept creates a
      Deal snapshot keyed on the offer's terms and bumps show.version; if any
      other mutation on the Show (deposit receipt, another offer acceptance,
      cancellation) has occurred between the caller's read and this write, the
      caller's snapshot is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-submit-stale-show
    parent_entity: Show
    write_endpoint: "POST /shows/{show_id}/settlement/submit"
    occ_field: "expected_show_version"
    description: |
      Submitting a Settlement against a Show whose `version` has advanced since
      the Promoter's draft was computed is rejected with 412. The submission
      pins gross_ticket_revenue_cents and recoupable_expenses_cents as of the
      Show's current version; any concurrent ticket refund, expense approval,
      or support-act buyout in between invalidates the snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: on-sale-stale-show
    parent_entity: Show
    write_endpoint: "POST /shows/{show_id}/on-sale"
    occ_field: "expected_show_version"
    description: |
      Placing a Show on sale against a Show whose `version` has advanced since
      the Promoter verified deposit-paid is rejected with 412. Deposit wires
      completing between the Promoter's read and this write bump show.version;
      proceeding on a stale version risks opening sales before deposit clears.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: artist_payout
    trigger: "on Settlement draft creation and on DISPUTED → DRAFT return-to-draft"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: Show, Deal, ExpenseReceipt[], AncillaryRevenue[], SupportAct[]
      # All arithmetic in integer cents; round_half_up only at the explicit ROUND steps.
      gross_ticket_revenue_cents = sum(s.gross_amount_cents for TicketSale s where s.show_id == show.id AND s.refund_status == NONE)

      # Expense recoupment: only APPROVED + is_recoupable receipts, capped at deal.expense_budget_cents
      recoupable_gross = sum(r.amount_cents for ExpenseReceipt r where r.show_id == show.id AND r.status == APPROVED AND r.is_recoupable == true)
      recoupable_expenses_cents = min(recoupable_gross, deal.expense_budget_cents)

      net_door_cents = max(0, gross_ticket_revenue_cents - recoupable_expenses_cents)

      # Artist door share by deal_kind
      if deal.deal_kind == FLAT_GUARANTEE:
          artist_door_share_cents = deal.guarantee_cents
          guarantee_paid_cents = deal.guarantee_cents
          bonus_cents = 0
      elif deal.deal_kind == DOOR_SPLIT:
          artist_door_share_cents = round_half_up(net_door_cents * deal.artist_split_pct)
          guarantee_paid_cents = 0
          bonus_cents = 0
      elif deal.deal_kind == VERSUS:
          # Artist gets the GREATER of (guarantee) vs (split of net door above threshold + guarantee if threshold met)
          # Concretely: door_split_component = round_half_up(max(0, net_door_cents - versus_threshold_cents) * artist_split_pct)
          door_split_component = round_half_up(max(0, net_door_cents - deal.versus_threshold_cents) * deal.artist_split_pct)
          # artist gets max(guarantee, guarantee + door_split_component) when threshold is crossed, else guarantee
          if net_door_cents > deal.versus_threshold_cents:
              artist_door_share_cents = deal.guarantee_cents + door_split_component
              guarantee_paid_cents = deal.guarantee_cents
              bonus_cents = door_split_component
          else:
              artist_door_share_cents = deal.guarantee_cents
              guarantee_paid_cents = deal.guarantee_cents
              bonus_cents = 0

      # Ancillary
      bar_gross = sum(a.gross_cents for AncillaryRevenue a where a.show_id == show.id AND a.kind == BAR)
      bar_cost = sum(a.cost_cents for AncillaryRevenue a where a.show_id == show.id AND a.kind == BAR)
      bar_artist_share_cents = round_half_up(max(0, bar_gross - bar_cost) * deal.bar_split_pct)

      merch_gross = sum(a.gross_cents for AncillaryRevenue a where a.show_id == show.id AND a.kind == MERCH)
      merch_venue_share_cents = round_half_up(merch_gross * deal.merch_split_pct)   # NB: merch cost NOT deducted

      support_payouts_cents = sum(s.paid_cents for SupportAct s where s.show_id == show.id)

      deposit_credit_cents = show.deposit_paid_cents

      artist_total_due_cents = max(0, artist_door_share_cents + bar_artist_share_cents - deposit_credit_cents)

      venue_net_cents = net_door_cents - artist_door_share_cents - support_payouts_cents + merch_venue_share_cents + max(0, bar_gross - bar_cost - bar_artist_share_cents)
    input_set: "TicketSale where refund_status==NONE; ExpenseReceipt where status==APPROVED; AncillaryRevenue all; SupportAct all; Deal snapshot"
    constants:
      ROUNDING: "round_half_up at each ROUND step; do not round intermediate products"
      EXPENSE_CAP_SOURCE: "deal.expense_budget_cents (snapshot, not current offer)"
      VERSUS_THRESHOLD_COMPARATOR: "strictly greater (>) — at exactly threshold, no bonus"
    precision: "integer cents; round_half_up at ROUND steps only"
    variants:
      - name: provisional_draft
        when: "Settlement.status == DRAFT (initial or after return-to-draft)"
        difference: "Uses current Show + ExpenseReceipt + AncillaryRevenue state; mutating any of these and returning to DRAFT recomputes all fields"
      - name: finalized_submitted
        when: "Settlement.status transitions DRAFT → SUBMITTED"
        difference: "Snapshots all computed fields onto Settlement; subsequent expense approvals, refunds, or ancillary postings DO NOT alter the SUBMITTED settlement — they require return-to-draft"

  - name: cancellation_policy
    trigger: "on POST /shows/{show_id}/cancel (all reasons)"
    algorithm: threshold
    formula: |
      # days_before_show: calendar days between cancellation declared_at and show_date, floor (>= 0)
      days = floor((show.show_date - cancellation.declared_at_utc.date()).days)

      # Artist penalty as % of guarantee (deal.guarantee_cents). Applies only when reason == ARTIST.
      if reason == ARTIST:
          if days >= 60: artist_penalty_pct = 0.00
          elif days >= 30: artist_penalty_pct = 0.25
          elif days >= 14: artist_penalty_pct = 0.50
          elif days >= 7:  artist_penalty_pct = 0.75
          else:            artist_penalty_pct = 1.00
          artist_penalty_cents = round_half_up(deal.guarantee_cents * artist_penalty_pct)
          # Artist's deposit is retained by venue up to penalty amount; remainder refunded to artist
          deposit_refundable_cents = 0   # from venue's perspective, deposit stays
          # Venue owes artist nothing further; artist forfeits min(deposit_paid, penalty)
      elif reason == VENUE:
          artist_penalty_pct = 0.0
          artist_penalty_cents = 0
          # Venue owes artist full guarantee (as kill fee) regardless of days
          deposit_refundable_cents = 0   # deposit stays with artist
      elif reason == FORCE_MAJEURE:
          artist_penalty_pct = 0.0
          artist_penalty_cents = 0
          # Deposit returned to venue (artist must refund deposit)
          deposit_refundable_cents = show.deposit_paid_cents
      elif reason == LOW_TICKET_SALES:
          # Promoter-initiated; only valid when show.status == ON_SALE and tickets_sold < low_sales_threshold
          artist_penalty_pct = 0.0
          artist_penalty_cents = 0
          deposit_refundable_cents = show.deposit_paid_cents
          # Artist owes venue nothing; venue owes artist 0.50 × guarantee as kill fee
      # Support kill fees (only when reason in {ARTIST, VENUE, LOW_TICKET_SALES}):
      #   per CONFIRMED support act: 0.5 × agreed_fee_cents
      # FORCE_MAJEURE: no kill fee
      if reason in {ARTIST, VENUE, LOW_TICKET_SALES}:
          support_kill_fee_cents = sum(round_half_up(0.5 * s.agreed_fee_cents) for SupportAct s where s.show_id == show.id AND s.status == CONFIRMED)
      else:
          support_kill_fee_cents = 0
    input_set: "Show, Deal, SupportAct[] (status==CONFIRMED at time of cancellation)"
    constants:
      PENALTY_TIERS: "60/30/14/7 days → 0/25/50/75/100 %"
      LOW_SALES_KILL_FEE_PCT: 0.50
      SUPPORT_KILL_FEE_PCT: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: artist_initiated
        when: "reason == ARTIST"
        difference: "Sliding-scale penalty deducted from deposit; excess penalty (above deposit) is owed by artist but NOT auto-collected"
      - name: venue_initiated
        when: "reason == VENUE"
        difference: "Venue owes full guarantee; deposit stays with artist"
      - name: force_majeure
        when: "reason == FORCE_MAJEURE"
        difference: "No penalties either direction; deposit returned; no support kill fees"

  - name: hold_priority_rank
    trigger: "on DateHold confirm precondition evaluation and on DateHold challenge"
    algorithm: topological
    formula: |
      # Strict priority order: P1 > P2 > COURTESY.
      # A hold H can transition ACTIVE → CONFIRMED only if no other DateHold on the same
      # (show.room, show.show_date) is in state ACTIVE with strictly higher priority.
      # Ties (same priority) — the hold with EARLIEST created_at wins (FIFO); created_at
      # is the sanctioned tie-break, never id.
      # CHALLENGED → CONFIRMED bypasses the priority check: the challenged original
      # holder has a 24h window to confirm regardless of the challenger's priority.
      rank(P1) = 3; rank(P2) = 2; rank(COURTESY) = 1
      can_confirm(H):
          if H.status == CHALLENGED: return now < H.challenge_window_ends_at_utc
          if H.status == ACTIVE:
              others = [h for h in DateHold where h.show.room == H.show.room
                                                  AND h.show.show_date == H.show.show_date
                                                  AND h.id != H.id
                                                  AND h.status == ACTIVE]
              if any(rank(h.priority) > rank(H.priority) for h in others): return false
              if any(rank(h.priority) == rank(H.priority) AND h.created_at < H.created_at for h in others): return false
              return now < H.hold_expires_at_utc
          return false
    input_set: "DateHold filtered by (show.room, show.show_date), status==ACTIVE or CHALLENGED"
    constants:
      HOLD_TTL_HOURS: "{P1: 48, P2: 24, COURTESY: 12}"
      CHALLENGE_WINDOW_HOURS: 24
    precision: "datetime comparison at UTC second precision"
    variants:
      - name: unchallenged_confirm
        when: "hold.status == ACTIVE"
        difference: "Applies priority + FIFO tie-break"
      - name: challenged_confirm
        when: "hold.status == CHALLENGED"
        difference: "Skips priority check; only challenge-window time check applies"

  - name: ticket_scaling_tier_advance
    trigger: "on TicketSale creation when the requested tier is sold out"
    algorithm: waterfall_allocation
    formula: |
      # Tickets are allocated from tiers in tier_order ASC (cheapest first at door).
      # A request for N tickets against tier T fills from T first; any remainder rolls to
      # the next tier with available capacity in tier_order ASC, charging that tier's
      # face_price_cents. gross_amount_cents is the sum across rolled tiers.
      # If total available < requested, reject entire sale (no partial fill).
      allocate(show, requested_tier, N):
          remaining = N
          line_items = []
          # Build candidate tier list: requested tier + all tiers with tier_order > requested.tier_order,
          # sorted by tier_order ASC; tie-break on created_at ASC (never id).
          candidates = [requested_tier] + sorted(
              [t for t in TicketTier where t.show_id == show.id AND t.tier_order > requested_tier.tier_order],
              key=lambda t: (t.tier_order, t.created_at)
          )
          total_available = sum(t.capacity - t.sold_count for t in candidates)
          if total_available < N: return ERR_INSUFFICIENT_TICKET_CAPACITY
          for t in candidates:
              avail = t.capacity - t.sold_count
              take = min(avail, remaining)
              if take > 0:
                  line_items.append((t, take, take * t.face_price_cents))
                  remaining -= take
              if remaining == 0: break
          gross = sum(li[2] for li in line_items)
          return (line_items, gross)
    input_set: "TicketTier where show_id == show.id, capacity - sold_count > 0 OR is the requested tier"
    constants:
      TIE_BREAK: "tier_order ASC, then created_at ASC"
      PARTIAL_FILL: "rejected — entire sale fails if any tier would underfill"
    precision: "integer cents, no rounding (multiplication only)"
    variants:
      - name: single_tier
        when: "requested tier has sufficient availability"
        difference: "gross = N × requested.face_price_cents; single line item"
      - name: roll_up
        when: "requested tier has insufficient availability but show does"
        difference: "gross is sum across multiple tiers at their respective face prices; creates ONE TicketSale row with composite gross"

  - name: versus_threshold_straddle
    trigger: "on Settlement draft when deal_kind == VERSUS"
    algorithm: threshold
    formula: |
      # The VERSUS deal pays the artist the guarantee PLUS a split of net-door ABOVE the threshold.
      # The threshold comparator is STRICTLY GREATER (>). At exactly threshold, no bonus.
      # Bonus = round_half_up( max(0, net_door_cents − versus_threshold_cents) × artist_split_pct )
      # Note: the split applies ONLY to the increment above threshold, NOT to the entire net door.
      # This is a marginal-rate (not average-rate) calculation.
      if net_door_cents > deal.versus_threshold_cents:
          bonus_cents = round_half_up((net_door_cents - deal.versus_threshold_cents) * deal.artist_split_pct)
      else:
          bonus_cents = 0
      artist_door_share_cents = deal.guarantee_cents + bonus_cents
    input_set: "Show, Deal snapshot"
    constants:
      COMPARATOR: ">"
      RATE_TYPE: "marginal (increment above threshold only)"
    precision: "integer cents, round_half_up"
    variants:
      - name: below_threshold
        when: "net_door_cents <= versus_threshold_cents"
        difference: "artist_door_share == guarantee; bonus == 0"
      - name: above_threshold
        when: "net_door_cents > versus_threshold_cents"
        difference: "artist_door_share == guarantee + round_half_up((net_door − threshold) × split_pct)"

  - name: expense_recoupment_ordering
    trigger: "on Settlement draft (subsumed by artist_payout); standalone for testability"
    algorithm: waterfall_allocation
    formula: |
      # Recoupable expenses are APPROVED receipts with is_recoupable=true, capped at deal.expense_budget_cents.
      # The CAP is applied to the SUM, not per-receipt — ordering of individual receipts does not affect
      # the total once the cap is reached. However, when the cap WOULD be exceeded, the receipts are
      # applied in receipt.created_at ASC order (chronological), and the first receipt that would push
      # the cumulative sum over the cap is TRUNCATED (its recoupable portion is reduced to fit exactly
      # under the cap), and all later receipts are recouped at 0.
      # This per-receipt ordering matters when reporting per-receipt recoupment breakdowns.
      cumulative = 0
      recoupable_per_receipt = []
      for r in sorted([r for r in ExpenseReceipt if r.show_id == show.id AND r.status == APPROVED AND r.is_recoupable],
                      key=lambda r: (r.created_at,)):
          remaining_cap = deal.expense_budget_cents - cumulative
          if remaining_cap <= 0:
              recoupable_per_receipt.append((r, 0))
          elif r.amount_cents <= remaining_cap:
              recoupable_per_receipt.append((r, r.amount_cents))
              cumulative += r.amount_cents
          else:
              recoupable_per_receipt.append((r, remaining_cap))   # truncate
              cumulative = deal.expense_budget_cents
      recoupable_expenses_cents = cumulative
    input_set: "ExpenseReceipt where status==APPROVED AND is_recoupable==true, ordered by created_at ASC"
    constants:
      CAP_BASIS: "deal.expense_budget_cents (snapshot)"
      TIE_BREAK: "created_at ASC (never id)"
    precision: "integer cents, no rounding"
    variants:
      - name: under_cap
        when: "sum(recoupable) <= expense_budget_cents"
        difference: "All receipts fully recouped; recoupable_expenses_cents == sum"
      - name: over_cap_truncated
        when: "sum(recoupable) > expense_budget_cents"
        difference: "First cap-crossing receipt is truncated; later receipts recouped at 0; recoupable_expenses_cents == cap"

  - name: deposit_wire_timing
    trigger: "on WireTransfer COMPLETED where purpose == ARTIST_DEPOSIT and on POST /shows/{id}/on-sale"
    algorithm: forward_looking
    formula: |
      # Deposit timing rule: artist deposit must be COMPLETED (not just INITIATED) by
      # show.deposit_due_by_utc (= show.show_date − 14 days at confirm time).
      # on-sale precondition: show.deposit_paid_cents >= show.deposit_required_cents
      # If the deposit deadline passes with deposit_paid < deposit_required, the venue MAY
      # cancel with reason == ARTIST (artist breach) and retain any partial deposit.
      # deposit_required_cents is computed at OFFER ACCEPTANCE time as
      #   round_half_up(offer.guarantee_cents × artist.deposit_pct)
      # and is immutable thereafter (even if artist.deposit_pct later changes).
    input_set: "Show, Artist, Deal, WireTransfer where purpose==ARTIST_DEPOSIT"
    constants:
      DEPOSIT_LEAD_DAYS: 14
      ACCEPTANCE_SNAPSHOT: "deposit_required_cents computed once at offer acceptance"
    precision: "integer cents, round_half_up"
    variants:
      - name: on_time
        when: "deposit completed by deposit_due_by_utc"
        difference: "Show proceeds to ON_SALE normally"
      - name: late_or_short
        when: "now > deposit_due_by_utc AND deposit_paid < deposit_required"
        difference: "Venue may cancel as ARTIST breach; partial deposit retained by venue"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a recognized enum"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is authorized for the target endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template resources exist (show, hold, offer, deal, tier, sale, advance, support, receipt, ancillary, settlement, wire), evaluated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body-referenced FKs exist (artist_id, tier_id, recipient_artist_id, support_act_id, settlement_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with body FKs"

  - priority: 5
    category: state
    check: "Target entity is in a valid from-state for the requested transition (per §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "OCC expected_show_version matches Show.version (when required by endpoint)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /shows/{show_id}/date-holds/{hold_id}/confirm; POST /shows/{show_id}/offers/{offer_id}/accept; POST /shows/{show_id}/on-sale; POST /shows/{show_id}/settlement/submit"

  - priority: 7
    category: business_safety
    check: "On POST /shows/{id}/cancel with reason == LOW_TICKET_SALES: show.tickets_sold < ceil(0.30 × show.total_capacity) AND show.status == ON_SALE"
    error_id: ERR_LOW_SALES_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /shows/{show_id}/cancel"

  - priority: 8
    category: business_safety
    check: "On POST /shows/{id}/on-sale: deposit_paid >= deposit_required AND now >= on_sale_at_utc"
    error_id: ERR_DEPOSIT_NOT_CLEARED
    http_status: 422
    applies_to: "POST /shows/{show_id}/on-sale"

  - priority: 9
    category: business_temporal
    check: "DateHold confirm: now < hold.hold_expires_at_utc (or challenge_window_ends_at_utc for CHALLENGED)"
    error_id: ERR_HOLD_EXPIRED
    http_status: 422
    applies_to: "POST /shows/{show_id}/date-holds/{hold_id}/confirm"

  - priority: 10
    category: business_temporal
    check: "DateHold challenge: caller's new hold has strictly higher priority than target hold"
    error_id: ERR_CHALLENGE_PRIORITY_TOO_LOW
    http_status: 422
    applies_to: "POST /shows/{show_id}/date-holds/{hold_id}/challenge"

  - priority: 11
    category: business_temporal
    check: "POST /shows: show_date >= today + 7 days (booking lead time); curfew_at > doors_at; doors_at on show_date"
    error_id: ERR_INVALID_SHOW_SCHEDULE
    http_status: 422
    applies_to: "POST /shows"

  - priority: 12
    category: business_constraint
    check: "POST /shows/{id}/ticket-tiers: sum of tier capacities <= show.total_capacity; tier_order unique per show"
    error_id: ERR_TIER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /shows/{show_id}/ticket-tiers"

  - priority: 13
    category: business_constraint
    check: "POST /shows/{id}/ticket-sales: total available across roll-up tiers >= requested quantity"
    error_id: ERR_INSUFFICIENT_TICKET_CAPACITY
    http_status: 422
    applies_to: "POST /shows/{show_id}/ticket-sales"

  - priority: 14
    category: business_constraint
    check: "POST /shows/{id}/support-acts: agreed_fee_cents > 0; buyout_fee_cents within [0.5 × agreed_fee_cents, agreed_fee_cents]; cumulative support spend (confirmed fees + buyouts) <= Deal.support_budget_cents"
    error_id: ERR_SUPPORT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /shows/{show_id}/support-acts; POST /shows/{show_id}/support-acts/{id}/buyout"

  - priority: 15
    category: business_constraint
    check: "POST /shows/{id}/offers: deal_kind-specific required fields present (guarantee_cents for FLAT_GUARANTEE|VERSUS; artist_split_pct for DOOR_SPLIT|VERSUS; versus_threshold_cents for VERSUS); 0 <= artist_split_pct <= 1; 0 <= bar_split_pct <= 0.25; 0 <= merch_split_pct <= 0.30"
    error_id: ERR_INVALID_DEAL_TERMS
    http_status: 422
    applies_to: "POST /shows/{show_id}/offers; POST /shows/{show_id}/offers/{offer_id}/counter"

  - priority: 16
    category: business_constraint
    check: "POST /shows/{id}/offers: offer.guarantee_cents >= artist.guarantee_floor_cents (when deal_kind includes guarantee)"
    error_id: ERR_GUARANTEE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /shows/{show_id}/offers; POST /shows/{show_id}/offers/{offer_id}/counter"

  - priority: 17
    category: business_fiscal
    check: "POST /shows/{id}/wire-transfers: amount_cents > 0; for ARTIST_BALANCE, amount == settlement.artist_total_due_cents; for SUPPORT_FEE, amount == support.agreed_fee_cents; for SUPPORT_BUYOUT, amount == support.buyout_fee_cents"
    error_id: ERR_WIRE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /shows/{show_id}/wire-transfers"

  - priority: 18
    category: business_fiscal
    check: "POST /shows/{id}/settlement/submit: all ExpenseReceipts and SupportActs in terminal state (no PENDING receipts, no CONFIRMED support acts)"
    error_id: ERR_SETTLEMENT_NOT_READY
    http_status: 422
    applies_to: "POST /shows/{show_id}/settlement/submit"

  - priority: 19
    category: business_referential
    check: "Segregation of duties: settlement approve caller.id != settlement.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /shows/{show_id}/settlement/approve"

  - priority: 20
    category: business_referential
    check: "Offer counter/accept/reject: caller role != offer.proposed_by_role (no self-negotiation)"
    error_id: ERR_SELF_NEGOTIATION
    http_status: 422
    applies_to: "POST /shows/{show_id}/offers/{offer_id}/counter; POST /shows/{show_id}/offers/{offer_id}/accept; POST /shows/{show_id}/offers/{offer_id}/reject"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Artist ---
  - method: POST
    path: "/artists"
    description: "Create an Artist"
    roles: [VenueManager]
    code: 201
    input: [legal_name, agency, guarantee_floor_cents, deposit_pct]
    output: Artist
    side_effects: []

  - method: GET
    path: "/artists/{id}"
    description: "Fetch an Artist by id"
    roles: [VenueManager, BookingAgent, Promoter, Accountant, ProductionManager]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: GET
    path: "/artists"
    description: "List Artists"
    roles: [VenueManager, BookingAgent, Promoter, Accountant, ProductionManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Artist[]"
    side_effects: []

  # --- BookingAgent ---
  - method: POST
    path: "/booking-agents"
    description: "Create a BookingAgent"
    roles: [VenueManager]
    code: 201
    input: [display_name, agency_name]
    output: BookingAgent
    side_effects: []

  - method: GET
    path: "/booking-agents/{id}"
    description: "Fetch a BookingAgent"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: []
    output: BookingAgent
    side_effects: []

  # --- Show ---
  - method: POST
    path: "/shows"
    description: "Create a Show (status=HOLD_PENDING, hold_priority=NONE)"
    roles: [BookingAgent, VenueManager]
    code: 201
    input: [artist_id, room, show_date, doors_at_utc, curfew_at_utc, total_capacity, on_sale_at_utc]
    output: Show
    side_effects:
      - "create AdvanceChecklist with all booleans=false"

  - method: GET
    path: "/shows/{id}"
    description: "Fetch a Show"
    roles: [VenueManager, BookingAgent, Promoter, Accountant, ProductionManager]
    code: 200
    input: []
    output: Show
    side_effects: []

  - method: GET
    path: "/shows"
    description: "List Shows"
    roles: [VenueManager, BookingAgent, Promoter, Accountant, ProductionManager]
    code: 200
    input: ["limit?", "offset?", "status?", "artist_id?", "room?", "show_date?", "deal_id?"]
    output: "Show[]"
    side_effects: []

  # --- DateHold ---
  - method: GET
    path: "/date-holds/{id}"
    description: "Fetch a DateHold by id"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: []
    output: DateHold
    side_effects: []

  - method: GET
    path: "/date-holds"
    description: "List DateHolds across shows (filtered)"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: ["limit?", "offset?", "show_id?", "booked_by_agent_id?", "status?", "priority?"]
    output: "DateHold[]"
    side_effects: []

  - method: POST
    path: "/shows/{id}/date-holds"
    description: "Place a DateHold on a Show"
    roles: [BookingAgent]
    code: 201
    input: [priority, booked_by_agent_id]
    output: DateHold
    side_effects:
      - "compute hold_expires_at_utc per priority TTL"

  - method: GET
    path: "/shows/{id}/date-holds"
    description: "List DateHolds for a Show"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DateHold[]"
    side_effects: []

  - method: GET
    path: "/shows/{id}/date-holds/{hold_id}"
    description: "Fetch a DateHold"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: []
    output: DateHold
    side_effects: []

  - method: POST
    path: "/shows/{id}/date-holds/{hold_id}/challenge"
    description: "Challenge an ACTIVE DateHold with a higher-priority hold"
    roles: [BookingAgent]
    code: 201
    input: [challenger_agent_id, challenger_priority]
    output: DateHold
    side_effects:
      - "target hold → CHALLENGED; challenge_window_ends_at_utc = now + 24h"
      - "create new DateHold (priority=challenger_priority, status=ACTIVE, booked_by=challenger_agent_id)"

  - method: POST
    path: "/shows/{id}/date-holds/{hold_id}/confirm"
    description: "Confirm a DateHold (OCC on Show.version)"
    roles: [BookingAgent]
    code: 200
    input: [expected_show_version]
    output: DateHold
    side_effects:
      - "hold → CONFIRMED; show.status → CONFIRMED; show.hold_priority = hold.priority"
      - "all other DateHolds on same (room, show_date) → RELEASED"
      - "increments Show.version by 1"

  - method: POST
    path: "/shows/{id}/date-holds/{hold_id}/release"
    description: "Release a DateHold"
    roles: [BookingAgent]
    code: 200
    input: []
    output: DateHold
    side_effects: ["hold → RELEASED"]

  # --- Offer ---
  - method: GET
    path: "/offers/{id}"
    description: "Fetch an Offer by id"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List Offers across shows (filtered)"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: ["limit?", "offset?", "show_id?", "status?", "supersedes_offer_id?"]
    output: "Offer[]"
    side_effects: []

  - method: POST
    path: "/shows/{id}/offers"
    description: "Create an Offer (round 1 from agent or manager)"
    roles: [BookingAgent, VenueManager]
    code: 201
    input: [deal_kind, guarantee_cents, artist_split_pct, versus_threshold_cents, expense_budget_cents, support_budget_cents, bar_split_pct, merch_split_pct]
    output: Offer
    side_effects:
      - "set round_number = (max existing round on this show) + 1 (or 1)"
      - "set proposed_by_role from caller"

  - method: GET
    path: "/shows/{id}/offers"
    description: "List Offers for a Show"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Offer[]"
    side_effects: []

  - method: GET
    path: "/shows/{id}/offers/{offer_id}"
    description: "Fetch an Offer"
    roles: [VenueManager, BookingAgent, Promoter]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: POST
    path: "/shows/{id}/offers/{offer_id}/counter"
    description: "Counter an Offer (creates new Offer in PENDING, supersedes this one)"
    roles: [BookingAgent, VenueManager]
    code: 201
    input: [deal_kind, guarantee_cents, artist_split_pct, versus_threshold_cents, expense_budget_cents, support_budget_cents, bar_split_pct, merch_split_pct]
    output: Offer
    side_effects:
      - "this offer → COUNTERED"
      - "create new Offer (round_number+1, proposed_by_role = caller, supersedes_offer_id = this offer, status = PENDING)"

  - method: POST
    path: "/shows/{id}/offers/{offer_id}/accept"
    description: "Accept an Offer (OCC on Show.version)"
    roles: [BookingAgent, VenueManager]
    code: 200
    input: [expected_show_version]
    output: Deal
    side_effects:
      - "offer → ACCEPTED"
      - "create Deal snapshot (status=ACTIVE)"
      - "show.deal_id = deal.id; show.deposit_required_cents computed"
      - "other PENDING/COUNTERED offers on this show → SUPERSEDED"
      - "increments Show.version by 1"

  - method: POST
    path: "/shows/{id}/offers/{offer_id}/reject"
    description: "Reject an Offer"
    roles: [BookingAgent, VenueManager]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer → REJECTED"]

  - method: POST
    path: "/shows/{id}/offers/{offer_id}/withdraw"
    description: "Withdraw an Offer (same role as proposer)"
    roles: [BookingAgent, VenueManager]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer → WITHDRAWN"]

  # --- Deal ---
  - method: GET
    path: "/shows/{id}/deal"
    description: "Fetch the ACTIVE Deal for a Show"
    roles: [VenueManager, BookingAgent, Promoter, Accountant]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: GET
