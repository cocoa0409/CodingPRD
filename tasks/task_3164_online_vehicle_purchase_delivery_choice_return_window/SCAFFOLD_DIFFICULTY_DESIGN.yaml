- rule_id: resource_temporal_overlap
  instances:
  - name: home_delivery_half_open_adjacency
    grounds:
    - validations[priority=12]
    - errors[ERR_APPOINTMENT_CONFLICT]
    distinguishing_aspect: 'Resource: home-delivery crew per market; interval semantics are

      half-open [start_at, end_at) with no buffer — a booking whose start_at

      equals an existing booking''s end_at is legal (adjacency allowed), while

      a one-minute interior overlap is rejected with ERR_APPOINTMENT_CONFLICT.

      '
    test_recipe:
      setup:
