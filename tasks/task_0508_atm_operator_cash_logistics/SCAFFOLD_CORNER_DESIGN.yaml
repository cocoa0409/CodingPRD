# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of the claim-extraction-guide against SCAFFOLD.yaml §1.1–§1.7.
# §1.8 covers the 9 depth rules; this file covers everything else testable.
# Clock default 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_atm_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.ATM, endpoints.POST_/atms]
        distinguishing_aspect: "POST /atms with all required fields -> 201; response has server-minted id, created_at, version=1, operational_status=IN_SERVICE, cash_status=EMPTY, monthly_wd_count=0."
        test_recipe:
          setup: ["A location exists (with merchant + route)."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /atms"
              payload: { serial_no: "SN-CR1", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id, ver: $.data.version, ops: $.data.operational_status, cash: $.data.cash_status }
          assert:
            - "Response code 201"
            - "ATM version == 1, operational_status == IN_SERVICE, cash_status == EMPTY, monthly_wd_count == 0"

      - name: atm_default_note_denomination_applied
        claim_type: Defaults
        grounds: [entities.ATM.fields.note_denomination_cents, endpoints.POST_/atms]
        distinguishing_aspect: "Omitting note_denomination_cents on POST /atms applies default 2000."
        test_recipe:
          setup: ["A location exists."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /atms"
              payload: { serial_no: "SN-DEF", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { nd: $.data.note_denomination_cents }
          assert:
            - "ATM note_denomination_cents == 2000 (default applied)"

      - name: get_atm_nonexistent_returns_404
        claim_type: Not Found
        grounds: [entities.ATM, "endpoints.GET_/atms/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /atms/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /atms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 404 with error_id == ERR_NOT_FOUND"

      - name: create_atm_missing_required_serial_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.ATM.fields.serial_no, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /atms without serial_no -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A location exists."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /atms"
              payload: { location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 422 with error_id == ERR_INVALID_REQUEST"

      - name: create_atm_invalid_enum_jurisdiction_on_location_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Location.fields.jurisdiction_code, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /locations with jurisdiction_code='ZZ' (not in CA|NY|TX|FL) -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A merchant and route exist."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
          trigger:
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "ZZ", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 422 with error_id == ERR_INVALID_REQUEST"

      - name: duplicate_atm_serial_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.ATM.fields.serial_no, "validations[priority=5]", "errors[ERR_DUPLICATE_SERIAL]"]
        distinguishing_aspect: "POST /atms with a serial_no already used -> 409 ERR_DUPLICATE_SERIAL."
        test_recipe:
          setup: ["A location and an ATM with serial SN-DUP exist."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-DUP", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
          trigger:
            - call: "POST /atms"
              payload: { serial_no: "SN-DUP", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 409 with error_id == ERR_DUPLICATE_SERIAL"

      - name: create_atm_bad_location_fk_returns_404
        claim_type: Parent Relationships
        grounds: [entities.ATM.fields.location_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /atms referencing a non-existent location_id -> 404 ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["Empty DB (no location)."]
          setup_api_calls: []
          trigger:
            - call: "POST /atms"
              payload: { serial_no: "SN-BADFK", location_id: "00000000-0000-4000-8000-000000000001", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 404 with error_id == ERR_NOT_FOUND"

      - name: list_atms_pagination_envelope
        claim_type: Listing
        grounds: [entities.ATM, endpoints.GET_/atms]
        distinguishing_aspect: "GET /atms returns array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["A location with two ATMs."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-L1", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
            - call: "POST /atms"
              payload: { serial_no: "SN-L2", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
          trigger:
            - call: "GET /atms?location_id=${loc_id}&limit=1&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_ticket_from_resolved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceTicket.OPEN_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RESOLVED ticket cannot be cancelled (cancel only from OPEN/ACKNOWLEDGED) -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ATM with a MINOR ticket acknowledged by T1 then resolved (status RESOLVED)."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-TK", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { atm_id: "${atm_id}", fault_kind: "NETWORK", severity: "MINOR" }
              as: FieldTech
              captures: { tk_id: $.data.id }
            - call: "POST /service-tickets/${tk_id}/acknowledge"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T1"
            - call: "POST /service-tickets/${tk_id}/resolve"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T1"
          trigger:
            - call: "POST /service-tickets/${tk_id}/cancel"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T1"
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 409 with error_id == ERR_INVALID_STATE"

      - name: settle_already_settled_run_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.SettlementRun.DRAFT_to_SETTLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A SETTLED run is terminal; a second settle -> 409 ERR_INVALID_STATE; no new commission statement."
        test_recipe:
          setup: ["An ATM (CA, approved disclosure), one withdrawal, settlement run already SETTLED."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1500, commission_flat_per_wd_cents: 30, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-ST", location_id: "${loc_id}", surcharge_cents: 295, note_denomination_cents: 2000 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /atms/${atm_id}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 295, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd_id: $.data.id }
            - call: "POST /fee-disclosures/${fd_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /atms/${atm_id}/transactions"
              payload: { kind: "WITHDRAWAL", amount_cents: 2000 }
              as: FieldTech
            - call: "POST /settlement-runs"
              payload: { atm_id: "${atm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-01T00:00:00Z" }
              as: SettlementOfficer
              captures: { run_id: $.data.id }
            - call: "POST /settlement-runs/${run_id}/settle"
              payload: {}
              as: SettlementOfficer
          trigger:
            - call: "POST /settlement-runs/${run_id}/settle"
              payload: {}
              as: SettlementOfficer
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 409 with error_id == ERR_INVALID_STATE"

      - name: resolve_open_ticket_skipping_acknowledge_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceTicket.ACKNOWLEDGED_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolve requires ACKNOWLEDGED; resolving an OPEN (un-acknowledged) ticket -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ATM with an OPEN MINOR ticket (never acknowledged)."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-RES", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { atm_id: "${atm_id}", fault_kind: "CARD_READER", severity: "MINOR" }
              as: FieldTech
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /service-tickets/${tk_id}/resolve"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T1"
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 409 with error_id == ERR_INVALID_STATE"

      - name: resolve_ticket_by_non_owner_returns_not_ticket_owner
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceTicket.ACKNOWLEDGED_to_RESOLVED, "validations[priority=7]", "errors[ERR_NOT_TICKET_OWNER]"]
        distinguishing_aspect: "Resolve by a FieldTech other than assigned_tech_id -> 403 ERR_NOT_TICKET_OWNER even though the transition is otherwise valid."
        test_recipe:
          setup: ["An ATM with a MINOR ticket acknowledged by tech-T1 (assigned_tech_id=tech-T1)."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-OWN", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { atm_id: "${atm_id}", fault_kind: "DISPENSER", severity: "MINOR" }
              as: FieldTech
              captures: { tk_id: $.data.id }
            - call: "POST /service-tickets/${tk_id}/acknowledge"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T1"
          trigger:
            - call: "POST /service-tickets/${tk_id}/resolve"
              payload: {}
              as: FieldTech
              as_user_id: "tech-T2"
              captures: { eid: $.data.error_id }
          assert:
            - "Response status 403 with error_id == ERR_NOT_TICKET_OWNER"

      - name: new_atm_starts_in_initial_states
        claim_type: Initial State
        grounds: [state_machines.ATM.IN_SERVICE_to_FAULTED, entities.ATM.fields.cash_status]
        distinguishing_aspect: "A freshly created ATM has operational_status=IN_SERVICE and cash_status=EMPTY (both initial states)."
        test_recipe:
          setup: ["A location exists."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /atms"
              payload: { serial_no: "SN-INIT", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { ops: $.data.operational_status, cash: $.data.cash_status }
          assert:
            - "ATM operational_status == IN_SERVICE and cash_status == EMPTY"

      - name: approve_fee_disclosure_supersedes_prior_approved
        claim_type: Side Effect Execution
        grounds: [state_machines.FeeDisclosure.DRAFT_to_APPROVED, entities.ATM.fields.fee_disclosure_id]
        distinguishing_aspect: "Approving a second disclosure flips the prior APPROVED one to REJECTED and repoints ATM.fee_disclosure_id (cross-entity side effect)."
        test_recipe:
          setup: ["ATM surcharge 250 with one APPROVED disclosure FD1; a second DRAFT disclosure FD2 (same surcharge)."]
          setup_api_calls:
            - call: "POST /vaults"
              payload: { name: "V", provisioned_cents: 1000000 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /routes"
              payload: { carrier_name: "Acme", vault_id: "${v_id}" }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /site-merchants"
              payload: { legal_name: "M", commission_pct_bps: 1000, commission_flat_per_wd_cents: 10, commission_monthly_ceiling_cents: 50000 }
              as: PlatformAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "S", jurisdiction_code: "CA", site_merchant_id: "${sm_id}", route_id: "${route_id}", address: "1 C" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /atms"
              payload: { serial_no: "SN-SUP", location_id: "${loc_id}", surcharge_cents: 250 }
              as: PlatformAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /atms/${atm_id}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 250, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd1: $.data.id }
            - call: "POST /fee-disclosures/${fd1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /atms/${atm_id}/fee-disclosures"
              payload: { disclosed_surcharge_cents: 250, ack_text_present: true }
              as: ComplianceOfficer
              captures: { fd2: $.data.id }
          trigger:
            - call: "POST /fee-disclosures/${fd2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /atms/${atm_id}/fee-disclosures?status=APPROVED"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /atms/${atm_id}"
              payload: {}
              as: ComplianceOfficer
