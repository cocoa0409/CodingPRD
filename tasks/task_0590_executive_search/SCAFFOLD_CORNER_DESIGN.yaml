      - name: client_protection_off_limits_until_is_activation_plus_protection_days
        claim_type: correct_result
        grounds:
          - calculations.off_limits_window
          - entities.OffLimitsRecord.fields.off_limits_until
          - state_machines.Engagement.DRAFT_to_ACTIVE
        distinguishing_aspect: "Activating an engagement at the clock default 2026-05-01T00:00:00Z with client_protection_days 730 mints a CLIENT_PROTECTION record with off_limits_until exactly 2028-04-30T00:00:00Z (2028 is a leap year, so 730 days from 2026-05-01 lands one day before 2028-05-01)."
