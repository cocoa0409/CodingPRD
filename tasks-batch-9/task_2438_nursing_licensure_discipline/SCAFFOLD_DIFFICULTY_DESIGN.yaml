              payload: { record_class: "PATIENT_CHART", custodian_code: "UNLINKED-CLINIC", hold_start_at: "2026-08-05T00:00:00Z", hold_end_at: "2026-09-05T00:00:00Z" }
              as: Investigator
              as_user_id: "inv-6"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err} == ERR_PHI_AUTHORIZATION_REQUIRED"
