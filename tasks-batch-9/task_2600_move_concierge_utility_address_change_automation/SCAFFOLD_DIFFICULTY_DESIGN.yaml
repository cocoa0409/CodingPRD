  - rule_id: resource_temporal_overlap
    instances:
      - name: service_window_half_open_adjacency_allowed
        grounds:
          - "validations[priority=32]"
          - state_machines.UtilityOrder.DRAFT_to_SCHEDULED
          - "endpoints[POST /utility-orders/{id}/schedule]"
          - "entities.UtilityOrder.fields.scheduled_window_start"
        distinguishing_aspect: |
          Resource: the (service_address_id, utility_type) crew window at a shared destination address,
          with HALF-OPEN [start, end) interval semantics. Two different moves land WATER orders on the same
          address: an 11:00-15:00 request against an existing 09:00-13:00 window must fail
          ERR_SERVICE_WINDOW_CONFLICT, while a 13:00-17:00 request that touches the incumbent's end
          instant must succeed, because a shared endpoint is not an intersection under half-open
          semantics.
