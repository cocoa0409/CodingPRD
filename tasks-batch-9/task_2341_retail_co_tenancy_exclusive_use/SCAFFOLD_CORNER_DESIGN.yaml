- section: errors
  instances:
  - name: request_without_the_x_user_role_header_returns_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: 'Priority 1 outranks everything except the clock endpoint: a POST /centers carrying a fully valid body but no X-User-Role header returns ERR_UNAUTHENTICATED (401) and no ShoppingCenter
      row is created.'
    test_recipe:
      setup:
      - Empty database
      - Logical clock at 2026-08-01T00:00:00Z
      - The trigger request deliberately omits the X-User-Role header entirely
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      trigger:
      - call: POST /centers
        payload:
          name: Northgate Crossing
          total_gla_sqft: 300000
          occupancy_grace_days: 30
        as: null
        captures:
          err: $.data.error_id
      assert:
      - response.http_status == 401
      - response.response_type == error
      - response.data.error_id == ERR_UNAUTHENTICATED
      - GET /centers returns total_count == 0
  - name: unknown_role_value_in_the_header_returns_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    - roles
    distinguishing_aspect: The header must name one of the five declared roles, so a syntactically present but undeclared role value is rejected at priority 1 with 401, not at priority 2 with 403.
    test_recipe:
      setup:
      - Empty database
      - Logical clock at 2026-08-01T00:00:00Z
      - 'The trigger request sends X-User-Role: PropertyManager, which §1.7 does not declare'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
