          rationale: "The tier, channel, loyalty and group axes together with the cap and the per-guest-then-multiply rounding order are asserted by the named §1.8 instance."

      - name: the_revenue_report_guards_its_zero_denominator
        claim_type: zero_denominator_guard
        grounds:
          - calculations.revenue_report_per_port
