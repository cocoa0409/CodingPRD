scenario: "2271. Biometric Privacy Consent Program (employer and retailer biometric compliance): biometric identifier inventory across timekeeping, access control, security cameras and customer-facing systems with vendor analysis, written policy development with retention schedule and destruction timelines published as required, informed written consent collection before collection begins with release language and record retention, vendor contract requirements prohibiting sale, restricting disclosure and requiring deletion on contract end, employee and customer notice with translation and accommodation for those declining biometric enrollment, alternative process provision for individuals who do not consent, incident response for biometric data exposure with heightened notification obligations, state-by-state variation management with private right of action exposure assessment"
domain_name: "biometric-consent-program"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat topology: every entity is addressed at the root (`/biometric-assets/{id}`,
    `/consent-records/{id}`) and linked by explicit FK body fields; no nesting in URL paths.
    Cyclic machines: BiometricPolicy (IN_REVIEW -> DRAFT revision loop), BiometricAsset
    (ACTIVE <-> GATED gating loop), ConsentRecord (re-solicitation loop back to SOLICITED).
    IncidentCase additionally carries two parallel state dimensions (containment_status x
    notification_status) that advance independently but are guarded against each other.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ComplianceProgram
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: "Legal name of the employer/retailer running the program."
      - name: org_type
        type: enum
        source: input
        description: "Whether the org collects biometrics from workers, shoppers, or both."
        constraints: "one of EMPLOYER, RETAILER, HYBRID"
      - name: exposure_ceiling_cents
        type: integer
        source: input
        description: "Board-approved maximum aggregate private-right-of-action exposure the program may carry across all FINAL ExposureAssessment rows."
        constraints: ">= 0"
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over all child operations; recomputed by calculations.program_posture after every mutation that can change its inputs."
        constraints: "one of OPEN, RESTRICTED, FROZEN"
        default: "OPEN"
      - name: consent_gap_count
        type: integer
        source: computed
        description: "Sum of BiometricAsset.consent_gap_count over this program's assets with status IN {ACTIVE, GATED}."
      - name: gated_asset_count
        type: integer
        source: computed
        description: "Count of this program's BiometricAsset rows with status == GATED."
      - name: open_deletion_obligation_count
        type: integer
        source: computed
        description: "Count of VendorContract rows under this program's vendors with status == TERMINATED and deletion_certificate_ref == null."
      - name: pra_exposure_cents
        type: integer
        source: computed
        description: "Sum of ExposureAssessment.exposure_cents over this program's assessments with status == FINAL."
      - name: inventory_completeness_pct
        type: number
        source: computed
        description: "Output of calculations.inventory_completeness_pct; 2 decimal places."

  - name: Jurisdiction
    parent: ComplianceProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ComplianceProgram.id; the program this state profile belongs to."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code; unique per program."
        constraints: "exactly 2 uppercase letters; unique within (program_id)"
      - name: statute_name
        type: string
        source: input
        description: "Short name of the controlling biometric statute (e.g. BIPA, CUBI)."
      - name: private_right_of_action
        type: enum
        source: input
        description: "Whether private plaintiffs may sue directly under the statute."
        constraints: "one of NONE, LIMITED, FULL"
      - name: damages_model
        type: enum
        source: input
        description: "Whether statutory per-violation damages apply or only proven actual damages."
        constraints: "one of STATUTORY_PER_VIOLATION, ACTUAL_ONLY"
      - name: requires_written_release
        type: boolean
        source: input
        description: "True when consent is only valid with an executed written release."
      - name: translation_required
        type: boolean
        source: input
        description: "True when notices and consents must be issued in every locale listed in required_locales."
      - name: required_locales
        type: array
        source: input
        description: "Locale tags (e.g. [\"en\", \"es\"]) that notices must cover when translation_required is true."
        default: "[]"
      - name: retention_max_days
        type: integer
        source: input
        description: "Statutory ceiling on template retention measured in days from collection start."
        constraints: ">= 1"
      - name: notice_lead_days
        type: integer
        source: input
        description: "Days that must elapse between NoticePacket publication and the first lawful consent solicitation."
        constraints: ">= 0"
      - name: per_violation_negligent_cents
        type: integer
        source: input
        description: "Statutory damages per negligent violation, in cents."
        constraints: ">= 0"
      - name: per_violation_reckless_cents
        type: integer
        source: input
        description: "Statutory damages per reckless/intentional violation, in cents."
        constraints: ">= 0"
      - name: cure_period_days
        type: integer
        source: input
        description: "Statutory notice-and-cure window in days; 0 means no cure right exists."
        constraints: ">= 0"
      - name: statutory_cap_cents
        type: integer
        source: input
        description: "Hard statutory cap on aggregate exposure for this state; null means uncapped."
        default: "null"
        constraints: "null or >= 0"

  - name: Vendor
    parent: ComplianceProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ComplianceProgram.id; the program that engaged this vendor."
      - name: name
        type: string
        source: input
        description: "Vendor legal name."
      - name: sells_biometric_data
        type: boolean
        source: input
        description: "True when the vendor's own disclosures admit sale or trade of biometric identifiers."
      - name: subprocessor_count
        type: integer
        source: input
        description: "Number of downstream subprocessors the vendor discloses."
        constraints: ">= 0"
      - name: subprocessor_disclosure_complete
        type: boolean
        source: input
        description: "True once the vendor has named every subprocessor in writing."
        default: "false"
      - name: deletion_sla_days
        type: integer
        source: input
        description: "Vendor-committed days to destroy templates after a deletion instruction."
        constraints: ">= 0"
      - name: attestation_status
        type: enum
        source: computed
        description: "Lifecycle of the vendor's written biometric-handling attestation; advanced only by POST /vendors/{vendor_id}/attestations."
        constraints: "one of NOT_REQUESTED, REQUESTED, RECEIVED, REJECTED"
        default: "NOT_REQUESTED"
      - name: risk_score
        type: number
        source: computed
        description: "Output of calculations.vendor_risk_score; integer-valued 0-100, recomputed on every attestation change and on vendor create."

  - name: VendorContract
    parent: Vendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor bound by this contract."
      - name: prohibits_sale
        type: boolean
        source: input
        description: "Contract clause forbidding sale, lease, or trade of biometric identifiers."
      - name: restricts_disclosure
        type: boolean
        source: input
        description: "Contract clause restricting disclosure to named purposes and parties."
      - name: requires_deletion_on_termination
        type: boolean
        source: input
        description: "Contract clause requiring template destruction when the contract ends."
      - name: deletion_deadline_days
        type: integer
        source: input
        description: "Contractual days after termination by which the vendor must certify deletion."
        constraints: ">= 0"
      - name: indemnity_cap_cents
        type: integer
        source: input
        description: "Per-incident indemnity ceiling the vendor accepts, in cents."
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the contract term."
      - name: compliance_score
        type: number
        source: computed
        description: "Output of calculations.vendor_contract_compliance_score; 2 decimal places."
      - name: status
        type: enum
        source: computed
        description: "Contract lifecycle state; see state_machines.VendorContract."
        constraints: "one of DRAFT, APPROVED, EXECUTED, TERMINATED, CLOSED_OUT, VOID"
        default: "DRAFT"
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the VendorManager who created the draft; used by the segregation-of-duties check on approval."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceApprover who approved the contract; null before approval."
        default: "null"
      - name: terminated_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the contract entered TERMINATED; null otherwise."
        default: "null"
      - name: deletion_deadline_at
        type: datetime
        source: computed
        description: "terminated_at + deletion_deadline_days, stamped on the TERMINATED transition; null otherwise."
        default: "null"
      - name: deletion_certificate_ref
        type: string
        source: input
        description: "Reference to the vendor's signed destruction certificate; set on close-out only."
        default: "null"

  - name: BiometricAsset
    parent: ComplianceProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ComplianceProgram.id; the program that owns this collection point."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the state whose statute governs this collection point."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the processor operating the system, or null when handled in-house."
        default: "null"
      - name: pinned_policy_id
        type: string
        source: computed
        description: "FK -> BiometricPolicy.id; the policy version pinned when the asset was activated, null before activation."
        default: "null"
      - name: system_category
        type: enum
        source: input
        description: "Which surface collects the identifier."
        constraints: "one of TIMEKEEPING, ACCESS_CONTROL, SECURITY_CAMERA, CUSTOMER_FACING"
      - name: modality
        type: enum
        source: input
        description: "Biometric identifier type collected."
        constraints: "one of FINGERPRINT, FACE_GEOMETRY, VOICEPRINT, IRIS, HAND_GEOMETRY"
      - name: subject_class
        type: enum
        source: input
        description: "Population enrolled at this collection point."
        constraints: "one of EMPLOYEE, CUSTOMER"
      - name: template_storage_location
        type: string
        source: input
        description: "Where templates or vectors are persisted (system of record identifier)."
      - name: declared_retention_days
        type: integer
        source: input
        description: "Retention the asset owner declares during inventory, before policy reconciliation."
        constraints: ">= 1"
      - name: retention_basis
        type: enum
        source: input
        description: "Whether destruction is driven by a fixed schedule only, or by purpose satisfaction capped by the schedule."
        constraints: "one of PURPOSE_LIMITED, SCHEDULE_ONLY"
      - name: status
        type: enum
        source: computed
        description: "Inventory/collection lifecycle state; see state_machines.BiometricAsset."
        constraints: "one of DISCOVERED, CLASSIFIED, ACTIVE, GATED, DECOMMISSIONED"
        default: "DISCOVERED"
      - name: collection_started_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the asset first entered ACTIVE; the retention clock origin."
        default: "null"
      - name: purpose_satisfied_at
        type: datetime
        source: input
        description: "Instant the collection purpose was fulfilled, reported by the asset owner; null while purpose is live."
        default: "null"
      - name: destruction_due_at
        type: datetime
        source: computed
        description: "Output of calculations.effective_retention_and_destruction."
        default: "null"
      - name: templates_destroyed_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the destruction sweep or decommission destroyed the templates."
        default: "null"
      - name: enrolled_subject_count
        type: integer
        source: computed
        description: "Count of ConsentRecord rows on this asset with status == GRANTED."
        default: "0"
      - name: consent_gap_count
        type: integer
        source: computed
        description: "Count of ConsentRecord rows on this asset with status IN {SOLICITED, RESOLICIT_REQUIRED, EXPIRED}. DECLINED and REVOKED records are lawful outcomes and are NOT gaps; registering a DataSubject who has no ConsentRecord at all is likewise not a gap until a record is solicited."
        default: "0"

  - name: BiometricPolicy
    parent: ComplianceProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ComplianceProgram.id; the program this written policy governs."
      - name: version_label
        type: string
        source: input
        description: "Human-readable policy version label, e.g. \"v1.0\"; unique within (program_id)."
        constraints: "unique within (program_id)"
      - name: retention_days
        type: integer
        source: input
        description: "Retention period the written policy publishes, in days from collection start."
        constraints: ">= 1"
      - name: destruction_trigger
        type: enum
        source: input
        description: "Published destruction rule; selects the variant of calculations.effective_retention_and_destruction."
        constraints: "one of FIXED_SCHEDULE, PURPOSE_SATISFIED_OR_MAX"
      - name: release_language_included
        type: boolean
        source: input
        description: "True when the policy embeds the written-release language required for consent validity."
      - name: jurisdiction_scope
        type: array
        source: input
        description: "Array of Jurisdiction.id values this policy version covers; assets outside the scope may not pin it."
        constraints: "non-empty; each element must be a Jurisdiction.id under the same program_id"
      - name: status
        type: enum
        source: computed
        description: "Policy lifecycle state; see state_machines.BiometricPolicy."
        constraints: "one of DRAFT, IN_REVIEW, PUBLISHED, SUPERSEDED, RETIRED"
        default: "DRAFT"
      - name: published_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the policy entered PUBLISHED; null otherwise."
        default: "null"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PrivacyOfficer who submitted the policy for review; used by the segregation-of-duties check on publish."
        default: "null"
      - name: published_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceApprover who published the policy; null before publication."
        default: "null"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times the policy has been kicked back from IN_REVIEW to DRAFT."
        default: "0"

  - name: NoticePacket
    parent: ComplianceProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ComplianceProgram.id; the program issuing the notice."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the state whose notice rules this packet satisfies."
      - name: policy_id
        type: string
        source: input
        description: "FK -> BiometricPolicy.id; the published policy the notice reproduces."
      - name: audience
        type: enum
        source: input
        description: "Population the notice addresses; pairs with Jurisdiction for the overlap constraint."
        constraints: "one of EMPLOYEE, CUSTOMER"
      - name: locales
        type: array
        source: input
        description: "Locale tags in which the packet was actually issued."
        constraints: "non-empty"
      - name: accommodation_channel
        type: string
        source: input
        description: "Contact channel published for individuals declining biometric enrollment."
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the notice window; inclusive."
      - name: effective_to
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the notice window; exclusive. Null means an open-ended window (+infinity)."
        default: "null"
      - name: status
        type: enum
        source: computed
        description: "Notice lifecycle state; see state_machines.NoticePacket."
        constraints: "one of DRAFT, PUBLISHED, WITHDRAWN"
        default: "DRAFT"
      - name: published_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the packet entered PUBLISHED; null otherwise."
        default: "null"
      - name: consent_eligible_from
        type: datetime
        source: computed
        description: "published_at + Jurisdiction.notice_lead_days; the earliest instant a ConsentRecord may be solicited under this packet."
        default: "null"

  - name: DataSubject
    parent: ComplianceProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ComplianceProgram.id; the program holding the relationship."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the state whose statute protects this individual."
      - name: subject_type
        type: enum
        source: input
        description: "Whether the individual is a worker or a shopper; must match an asset's subject_class to be enrollable there."
        constraints: "one of EMPLOYEE, CUSTOMER"
      - name: external_ref
        type: string
        source: input
        description: "Employee number or loyalty id; unique within (program_id)."
        constraints: "unique within (program_id)"
      - name: preferred_locale
        type: string
        source: input
        description: "Locale tag the individual reads; consent and notice must be available in it when the jurisdiction requires translation."
      - name: accommodation_needed
        type: boolean
        source: input
        description: "True when the individual has requested a non-biometric process on intake."
        default: "false"
      - name: enrollment_status
        type: enum
        source: computed
        description: "Priority-ordered derivation over this subject's ConsentRecord and AlternativeAccommodation rows: OPTED_OUT if any ConsentRecord is DECLINED or REVOKED and no GRANTED record exists; else ENROLLED if any ConsentRecord is GRANTED; else ALTERNATIVE if any AlternativeAccommodation is PROVISIONED or ACTIVE; else NOT_ENROLLED."
        constraints: "one of NOT_ENROLLED, ENROLLED, ALTERNATIVE, OPTED_OUT"
        default: "NOT_ENROLLED"
      - name: active_accommodation_count
        type: integer
        source: computed
        description: "Count of this subject's AlternativeAccommodation rows with status IN {PROVISIONED, ACTIVE}."
        default: "0"

  - name: ConsentRecord
    parent: DataSubject
    common_fields: true
    fields:
      - name: data_subject_id
        type: string
        source: input
        description: "FK -> DataSubject.id; the individual asked to consent."
      - name: asset_id
        type: string
        source: input
        description: "FK -> BiometricAsset.id; the collection point the consent covers."
      - name: pinned_policy_id
        type: string
        source: computed
        description: "FK -> BiometricPolicy.id; copied from BiometricAsset.pinned_policy_id at solicitation; drives the resolicitation cascade when the asset repins."
      - name: locale
        type: string
        source: input
        description: "Locale the consent form was presented in."
      - name: status
        type: enum
        source: computed
        description: "Consent lifecycle state; see state_machines.ConsentRecord."
        constraints: "one of SOLICITED, GRANTED, DECLINED, REVOKED, EXPIRED, RESOLICIT_REQUIRED"
        default: "SOLICITED"
      - name: written_release_acknowledged
        type: boolean
        source: input
        description: "True when the individual executed the written release; required to reach GRANTED where the jurisdiction requires it."
        default: "false"
      - name: signature_ref
        type: string
        source: input
        description: "Reference to the stored signature artifact; required to reach GRANTED."
        default: "null"
      - name: signed_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the consent entered GRANTED; null otherwise."
        default: "null"
      - name: pinned_retention_days
        type: integer
        source: computed
        description: "BiometricPolicy.retention_days of pinned_policy_id, frozen at grant time for evidentiary purposes."
        default: "null"
      - name: record_retention_until
        type: datetime
        source: computed
        description: "signed_at + CONSENT_RECORD_RETENTION_DAYS; the statutory floor for keeping the consent record itself, independent of template destruction."
        default: "null"
      - name: decline_reason
        type: string
        source: input
        description: "Free-text reason captured when the individual declines."
        default: "null"
      - name: revocation_reason
        type: string
        source: input
        description: "Free-text reason captured when a granted consent is revoked."
        default: "null"
      - name: solicitation_round
        type: integer
        source: computed
        description: "1 on creation; incremented each time the record re-enters SOLICITED from RESOLICIT_REQUIRED."
        default: "1"

  - name: AlternativeAccommodation
    parent: DataSubject
    common_fields: true
    fields:
      - name: data_subject_id
        type: string
        source: input
        description: "FK -> DataSubject.id; the individual receiving the non-biometric process."
      - name: asset_id
        type: string
        source: input
        description: "FK -> BiometricAsset.id; the collection point being bypassed."
      - name: created_from_consent_id
        type: string
        source: computed
        description: "FK -> ConsentRecord.id; set when the accommodation was auto-created by a consent decline, revocation, or expiry cascade; null for manually requested accommodations."
        default: "null"
      - name: method
        type: enum
        source: input
        description: "Non-biometric process granted; permitted set depends on BiometricAsset.system_category."
        constraints: "one of MANUAL_TIMESHEET, BADGE_PIN, STAFFED_LANE, MANUAL_LOG"
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the accommodation window; inclusive."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the accommodation window; inclusive."
      - name: status
        type: enum
        source: computed
        description: "Accommodation lifecycle state; see state_machines.AlternativeAccommodation."
        constraints: "one of REQUESTED, PROVISIONED, ACTIVE, ENDED"
        default: "REQUESTED"
      - name: sla_due_at
        type: datetime
        source: computed
        description: "Creation clock instant + ACCOMMODATION_SLA_DAYS; the deadline for reaching PROVISIONED."
      - name: sla_breached
        type: boolean
        source: computed
        description: "True when the PROVISIONED transition occurred at a clock instant strictly after sla_due_at, or when the destruction sweep observes a REQUESTED row past sla_due_at."
        default: "false"
      - name: origin
        type: enum
        source: computed
        description: "How the accommodation came into being; AUTO_* values are written only by cascades."
        constraints: "one of MANUAL, AUTO_DECLINE, AUTO_REVOKE, AUTO_CONSENT_EXPIRY"
        default: "MANUAL"

  - name: IncidentCase
    parent: ComplianceProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ComplianceProgram.id; the program that suffered the exposure."
      - name: affected_asset_ids
        type: array
        source: input
        description: "Array of BiometricAsset.id values whose templates were exposed; must be non-empty and all under program_id."
        constraints: "non-empty"
      - name: exposure_vector
        type: enum
        source: input
        description: "How the biometric data was exposed."
        constraints: "one of VENDOR_BREACH, INSIDER_MISUSE, LOST_DEVICE, MISCONFIGURED_EXPORT"
      - name: description
        type: string
        source: input
        description: "Narrative of the exposure for the regulator file."
      - name: discovered_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the case was created; the notification clock origin."
      - name: exposed_subject_count
        type: integer
        source: input
        description: "Number of individuals whose templates were exposed."
        constraints: ">= 1"
      - name: heightened_tier
        type: enum
        source: computed
        description: "Output of calculations.incident_notification_deadline_and_cost; TIER_1 carries the short deadline and the regulator surcharge schedule."
        constraints: "one of TIER_1, TIER_2"
      - name: notification_due_at
        type: datetime
        source: computed
        description: "discovered_at + tier deadline days, per calculations.incident_notification_deadline_and_cost."
      - name: containment_status
        type: enum
        source: computed
        description: "First parallel state dimension; see state_machines.IncidentCase."
        constraints: "one of DETECTED, CONTAINED, REMEDIATED"
        default: "DETECTED"
      - name: notification_status
        type: enum
        source: computed
        description: "Second parallel state dimension; see state_machines.IncidentCase."
        constraints: "one of PENDING, ASSESSED, NOTIFIED, EXEMPT"
        default: "PENDING"
      - name: translation_locale_count
        type: integer
        source: input
        description: "Number of non-default locales the notification must be issued in."
        constraints: ">= 0"
      - name: gross_notice_cents
        type: integer
        source: computed
        description: "Pre-credit notification cost from calculations.incident_notification_deadline_and_cost."
        default: "0"
      - name: regulator_surcharge_cents
        type: integer
        source: computed
        description: "Surcharge tier keyed on gross_notice_cents, per calculations.incident_notification_deadline_and_cost."
        default: "0"
      - name: vendor_indemnity_credit_cents
        type: integer
        source: computed
        description: "Credit recovered from EXECUTED vendor contracts, capped at half of gross_notice_cents."
        default: "0"
      - name: net_incident_cost_cents
        type: integer
        source: computed
        description: "gross_notice_cents + regulator_surcharge_cents - vendor_indemnity_credit_cents, in the pinned evaluation order."
        default: "0"
      - name: notified_subject_count
        type: integer
        source: input
        description: "Number of individuals actually notified; supplied on the NOTIFIED transition."
        default: "0"
      - name: notified_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which notification_status became NOTIFIED; null otherwise."
        default: "null"
      - name: late_notification
        type: boolean
        source: computed
        description: "True when notified_at is strictly after notification_due_at."
        default: "false"
      - name: exemption_basis
        type: string
        source: input
        description: "Written basis for claiming a notification exemption; required on the EXEMPT transition."
        default: "null"
      - name: containment_note
        type: string
        source: input
        description: "Description of the containment or remediation step taken."
        default: "null"

  - name: ExposureAssessment
    parent: ComplianceProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> ComplianceProgram.id; the program whose exposure is being quantified."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the state whose damages model drives the estimate."
      - name: incident_id
        type: string
        source: input
        description: "FK -> IncidentCase.id; the incident that prompted the assessment, or null for a routine posture assessment."
        default: "null"
      - name: variant
        type: enum
        source: input
        description: "Which damages theory to model; selects the variant of calculations.pra_exposure_estimate."
        constraints: "one of PER_VIOLATION_STACKED, PER_SUBJECT_CAPPED"
      - name: status
        type: enum
        source: computed
        description: "Assessment lifecycle state; see state_machines.ExposureAssessment."
        constraints: "one of DRAFT, FINAL, VOID"
        default: "DRAFT"
      - name: negligent_unit_count
        type: integer
        source: computed
        description: "Violation units priced at Jurisdiction.per_violation_negligent_cents, derived by calculations.pra_exposure_estimate's input_set."
        default: "0"
      - name: reckless_unit_count
        type: integer
        source: computed
        description: "Violation units priced at Jurisdiction.per_violation_reckless_cents, derived by calculations.pra_exposure_estimate's input_set."
        default: "0"
      - name: base_cents
        type: integer
        source: computed
        description: "Unmultiplied statutory base from the two unit counts."
        default: "0"
      - name: notice_gap_multiplier
        type: number
        source: computed
        description: "NOTICE_GAP_MULTIPLIER when the program carries at least one asset with consent_gap_count > 0, else 1.00."
        default: "1.00"
      - name: cure_credit_pct
        type: number
        source: computed
        description: "CURE_CREDIT_PCT when the jurisdiction grants a cure period and a PUBLISHED policy covers it, else 0.00."
        default: "0.00"
      - name: exposure_cents
        type: integer
        source: computed
        description: "Output of calculations.pra_exposure_estimate."
        default: "0"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PrivacyOfficer who drafted the assessment; used by the segregation-of-duties check on finalization."
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceApprover who finalized the assessment; null before finalization."
        default: "null"
      - name: void_reason
        type: string
        source: input
        description: "Reason recorded when a finalized assessment is voided."
        default: "null"

state_machines:
  - entity: BiometricPolicy
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /policies/{policy_id}/transitions with to_status=IN_REVIEW"
        actor: PrivacyOfficer
        preconditions:
          - "policy.status == DRAFT"
          - "policy.jurisdiction_scope is non-empty and every element resolves to a Jurisdiction under policy.program_id"
          - "for every Jurisdiction j in policy.jurisdiction_scope with j.requires_written_release == true: policy.release_language_included == true, else ERR_WRITTEN_RELEASE_REQUIRED"
          - "for every Jurisdiction j in policy.jurisdiction_scope: policy.retention_days <= j.retention_max_days, else ERR_RETENTION_EXCEEDS_JURISDICTION_MAX"
        side_effects:
          - "sets policy.submitted_by_user_id to the acting X-User-ID"
          - "refreshes policy.updated_at and increments policy.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /policies/{policy_id}/transitions with to_status=DRAFT"
        actor: ComplianceApprover
        preconditions:
          - "policy.status == IN_REVIEW"
        side_effects:
          - "increments policy.revision_count by 1"
          - "clears policy.submitted_by_user_id to null so the next submission re-stamps it"
          - "refreshes policy.updated_at and increments policy.version by 1"
        note: "Revision loop: this is the cycle edge that makes the machine non-linear (DRAFT -> IN_REVIEW -> DRAFT)."
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /policies/{policy_id}/publish"
        actor: ComplianceApprover
        preconditions:
          - "policy.status == IN_REVIEW"
          - "request carries expected_program_version equal to the current ComplianceProgram.version, else ERR_STALE_PROGRAM_VERSION"
          - "acting X-User-ID != policy.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "ComplianceProgram.posture != FROZEN, else ERR_PROGRAM_POSTURE_BLOCKED"
        side_effects:
          - "sets policy.published_at to the current logical clock and policy.published_by_user_id to the acting X-User-ID"
          - "CASCADE B hop 1: the program's other BiometricPolicy row with status == PUBLISHED (at most one exists) transitions PUBLISHED -> SUPERSEDED"
          - "CASCADE B hop 2: because of that SUPERSEDED policy, every ConsentRecord with pinned_policy_id == the superseded policy and status == GRANTED transitions GRANTED -> RESOLICIT_REQUIRED"
          - "CASCADE B hop 3: because those consents lost their grant, every BiometricAsset with pinned_policy_id == the superseded policy and status == ACTIVE transitions ACTIVE -> GATED and repins pinned_policy_id to this newly published policy when its jurisdiction_id is in the new policy's jurisdiction_scope; hop 2 is applied to all consents BEFORE any asset repins"
          - "CASCADE B hop 4: because assets became GATED, recomputes calculations.program_posture on the parent ComplianceProgram (gated_asset_count > 0 raises posture to at least RESTRICTED)"
          - "recomputes calculations.effective_retention_and_destruction for every affected BiometricAsset, refreshing destruction_due_at"
          - "increments ComplianceProgram.version by 1"
          - "refreshes policy.updated_at and increments policy.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system event: another BiometricPolicy under the same program is published (CASCADE B hop 1)"
        actor: system
        preconditions:
          - "policy.status == PUBLISHED"
        side_effects:
          - "triggers CASCADE B hop 2 on every ConsentRecord pinned to this policy with status == GRANTED"
          - "refreshes policy.updated_at and increments policy.version by 1"
      - from: SUPERSEDED
        to: RETIRED
        trigger: "POST /policies/{policy_id}/transitions with to_status=RETIRED"
        actor: PrivacyOfficer
        preconditions:
          - "policy.status == SUPERSEDED"
          - "no BiometricAsset has pinned_policy_id == policy.id with status IN {ACTIVE, GATED}, else ERR_ASSET_STILL_ACTIVE"
        side_effects:
          - "refreshes policy.updated_at and increments policy.version by 1"

  - entity: BiometricAsset
    initial_state: DISCOVERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: DISCOVERED
        to: CLASSIFIED
        trigger: "POST /biometric-assets/{asset_id}/transitions with to_status=CLASSIFIED"
        actor: PrivacyOfficer
        preconditions:
          - "asset.status == DISCOVERED"
          - "asset.vendor_id is null OR the vendor has at least one VendorContract with status IN {APPROVED, EXECUTED}, else ERR_VENDOR_CONTRACT_NONCOMPLIANT"
        side_effects:
          - "recomputes ComplianceProgram.inventory_completeness_pct via calculations.inventory_completeness_pct"
          - "refreshes asset.updated_at and increments asset.version by 1"
      - from: CLASSIFIED
        to: ACTIVE
        trigger: "POST /biometric-assets/{asset_id}/transitions with to_status=ACTIVE"
        actor: PrivacyOfficer
        preconditions:
          - "asset.status == CLASSIFIED"
          - "ComplianceProgram.posture NOT IN {RESTRICTED, FROZEN}, else ERR_PROGRAM_POSTURE_BLOCKED"
          - "exactly one BiometricPolicy under asset.program_id has status == PUBLISHED and lists asset.jurisdiction_id in jurisdiction_scope, else ERR_POLICY_NOT_PUBLISHED"
          - "a NoticePacket with status == PUBLISHED, jurisdiction_id == asset.jurisdiction_id and audience == asset.subject_class exists, else ERR_NOTICE_NOT_PUBLISHED"
          - "when Jurisdiction.translation_required is true, that NoticePacket.locales is a superset of Jurisdiction.required_locales, else ERR_TRANSLATION_LOCALE_MISSING"
          - "asset.vendor_id is null OR the vendor's risk_score <= VENDOR_RISK_GATE, else ERR_VENDOR_RISK_TOO_HIGH"
          - "asset.vendor_id is null OR the vendor has a VendorContract with status == EXECUTED whose compliance_score >= CONTRACT_SCORE_FLOOR, else ERR_CONTRACT_SCORE_BELOW_FLOOR"
        side_effects:
          - "pins asset.pinned_policy_id to the single PUBLISHED in-scope policy"
          - "sets asset.collection_started_at to the current logical clock when it is null (first activation only)"
          - "computes asset.destruction_due_at via calculations.effective_retention_and_destruction"
          - "recomputes ComplianceProgram.consent_gap_count, inventory_completeness_pct and calculations.program_posture"
          - "refreshes asset.updated_at and increments asset.version by 1"
      - from: ACTIVE
        to: GATED
        trigger: "POST /biometric-assets/{asset_id}/transitions with to_status=GATED, or system event (CASCADE A hop 2 / CASCADE B hop 3)"
        actor: PrivacyOfficer | system
        preconditions:
          - "asset.status == ACTIVE"
        side_effects:
          - "when driven by CASCADE A hop 2: triggers CASCADE A hop 3 on every ConsentRecord for this asset with status == GRANTED (GRANTED -> EXPIRED)"
          - "recomputes ComplianceProgram.gated_asset_count and calculations.program_posture"
          - "refreshes asset.updated_at and increments asset.version by 1"
      - from: GATED
        to: ACTIVE
        trigger: "POST /biometric-assets/{asset_id}/transitions with to_status=ACTIVE"
        actor: PrivacyOfficer
        preconditions:
          - "asset.status == GATED"
          - "ComplianceProgram.posture != FROZEN, else ERR_PROGRAM_POSTURE_BLOCKED"
          - "asset.consent_gap_count == 0, else ERR_CONSENT_GAP_OPEN"
          - "asset.vendor_id is null OR the vendor has a VendorContract with status == EXECUTED whose compliance_score >= CONTRACT_SCORE_FLOOR, else ERR_CONTRACT_SCORE_BELOW_FLOOR"
        side_effects:
          - "recomputes asset.destruction_due_at via calculations.effective_retention_and_destruction"
          - "recomputes ComplianceProgram.gated_asset_count and calculations.program_posture"
          - "refreshes asset.updated_at and increments asset.version by 1"
        note: "Gating loop: ACTIVE <-> GATED is the cycle edge. RESTRICTED posture blocks CLASSIFIED -> ACTIVE but NOT this re-activation, otherwise a gated asset could never recover; FROZEN blocks both."
      - from: GATED
        to: DECOMMISSIONED
        trigger: "POST /biometric-assets/{asset_id}/transitions with to_status=DECOMMISSIONED"
        actor: PrivacyOfficer
        preconditions:
          - "asset.status == GATED"
        side_effects:
          - "sets asset.templates_destroyed_at to the current logical clock"
          - "every ConsentRecord for this asset with status IN {SOLICITED, GRANTED, RESOLICIT_REQUIRED} transitions to EXPIRED; no AlternativeAccommodation is auto-created for these expiries because the collection point no longer exists"
          - "every AlternativeAccommodation for this asset with status IN {REQUESTED, PROVISIONED, ACTIVE} transitions to ENDED"
          - "recomputes ComplianceProgram.gated_asset_count, consent_gap_count, inventory_completeness_pct and calculations.program_posture"
          - "refreshes asset.updated_at and increments asset.version by 1"
      - from: CLASSIFIED
        to: DECOMMISSIONED
        trigger: "POST /biometric-assets/{asset_id}/transitions with to_status=DECOMMISSIONED"
        actor: PrivacyOfficer
        preconditions:
          - "asset.status == CLASSIFIED"
          - "no ConsentRecord exists for this asset"
        side_effects:
          - "recomputes ComplianceProgram.inventory_completeness_pct"
          - "refreshes asset.updated_at and increments asset.version by 1"

  - entity: ConsentRecord
    initial_state: SOLICITED
    terminal_states: [DECLINED]
    transitions:
      - from: SOLICITED
        to: GRANTED
        trigger: "POST /consent-records/{consent_id}/transitions with to_status=GRANTED"
        actor: HRAdministrator
        preconditions:
          - "consent.status == SOLICITED"
          - "consent.signature_ref is not null, else ERR_INVALID_REQUEST"
          - "when the subject's Jurisdiction.requires_written_release is true: consent.written_release_acknowledged == true, else ERR_WRITTEN_RELEASE_REQUIRED"
          - "the asset's status IN {ACTIVE, GATED}, else ERR_ASSET_NOT_COLLECTABLE"
        side_effects:
          - "sets consent.signed_at to the current logical clock"
          - "sets consent.pinned_retention_days to BiometricPolicy.retention_days of consent.pinned_policy_id"
          - "sets consent.record_retention_until to signed_at + CONSENT_RECORD_RETENTION_DAYS"
          - "COMPENSATION: every AlternativeAccommodation with created_from_consent_id == consent.id and status IN {REQUESTED, PROVISIONED, ACTIVE} transitions to ENDED, restoring BiometricAsset.enrolled_subject_count to its pre-decline value"
          - "increments BiometricAsset.enrolled_subject_count and recomputes BiometricAsset.consent_gap_count"
          - "recomputes DataSubject.enrollment_status and DataSubject.active_accommodation_count"
          - "recomputes ComplianceProgram.consent_gap_count and calculations.program_posture"
          - "refreshes consent.updated_at and increments consent.version by 1"
      - from: SOLICITED
        to: DECLINED
        trigger: "POST /consent-records/{consent_id}/transitions with to_status=DECLINED"
        actor: HRAdministrator
        preconditions:
          - "consent.status == SOLICITED"
          - "decline_reason is present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "auto-creates one AlternativeAccommodation with origin == AUTO_DECLINE, created_from_consent_id == consent.id, status REQUESTED, method defaulted from the asset's system_category per ACCOMMODATION_METHOD_MAP, starts_at == the current logical clock, ends_at == starts_at + AUTO_ACCOMMODATION_WINDOW_DAYS, sla_due_at == the current logical clock + ACCOMMODATION_SLA_DAYS"
          - "recomputes BiometricAsset.consent_gap_count"
          - "recomputes DataSubject.enrollment_status to OPTED_OUT"
          - "refreshes consent.updated_at and increments consent.version by 1"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /consent-records/{consent_id}/transitions with to_status=REVOKED"
        actor: HRAdministrator | Subject
        preconditions:
          - "consent.status == GRANTED"
          - "revocation_reason is present in the request body, else ERR_INVALID_REQUEST"
          - "when acting as Subject: X-User-ID == consent.data_subject_id, else ERR_SUBJECT_MISMATCH"
        side_effects:
          - "auto-creates one AlternativeAccommodation with origin == AUTO_REVOKE, created_from_consent_id == consent.id, status REQUESTED, method from ACCOMMODATION_METHOD_MAP, starts_at == the current logical clock, ends_at == starts_at + AUTO_ACCOMMODATION_WINDOW_DAYS"
          - "decrements BiometricAsset.enrolled_subject_count and recomputes BiometricAsset.consent_gap_count"
          - "recomputes DataSubject.enrollment_status to OPTED_OUT"
          - "recomputes ComplianceProgram.consent_gap_count and calculations.program_posture"
          - "refreshes consent.updated_at and increments consent.version by 1"
      - from: GRANTED
        to: EXPIRED
        trigger: "system event: destruction sweep observes the clock at or past BiometricAsset.destruction_due_at, or CASCADE A hop 3 (the asset was gated by a terminated vendor contract), or the asset was decommissioned"
        actor: system
        preconditions:
          - "consent.status == GRANTED"
        side_effects:
          - "CASCADE A hop 4: when the expiry was driven by CASCADE A hop 3 and the DataSubject.subject_type == EMPLOYEE, auto-creates one AlternativeAccommodation with origin == AUTO_CONSENT_EXPIRY, created_from_consent_id == consent.id, status REQUESTED, method from ACCOMMODATION_METHOD_MAP; no accommodation is created for CUSTOMER subjects or for decommission-driven expiries"
          - "decrements BiometricAsset.enrolled_subject_count and recomputes BiometricAsset.consent_gap_count"
          - "recomputes DataSubject.enrollment_status"
          - "refreshes consent.updated_at and increments consent.version by 1"
      - from: GRANTED
        to: RESOLICIT_REQUIRED
        trigger: "system event: the policy pinned on this consent was superseded (CASCADE B hop 2)"
        actor: system
        preconditions:
          - "consent.status == GRANTED"
        side_effects:
          - "decrements BiometricAsset.enrolled_subject_count and increments BiometricAsset.consent_gap_count"
          - "recomputes DataSubject.enrollment_status"
          - "refreshes consent.updated_at and increments consent.version by 1"
      - from: EXPIRED
        to: RESOLICIT_REQUIRED
        trigger: "POST /consent-records/{consent_id}/transitions with to_status=RESOLICIT_REQUIRED"
        actor: PrivacyOfficer
        preconditions:
          - "consent.status == EXPIRED"
          - "the asset's status IN {ACTIVE, GATED}, else ERR_ASSET_NOT_COLLECTABLE"
        side_effects:
          - "refreshes consent.updated_at and increments consent.version by 1"
      - from: RESOLICIT_REQUIRED
        to: SOLICITED
        trigger: "POST /consent-records/{consent_id}/transitions with to_status=SOLICITED"
        actor: HRAdministrator
        preconditions:
          - "consent.status == RESOLICIT_REQUIRED"
          - "the asset's status IN {ACTIVE, GATED}, else ERR_ASSET_NOT_COLLECTABLE"
          - "the asset's pinned_policy_id is not null and its BiometricPolicy.status == PUBLISHED, else ERR_POLICY_NOT_PUBLISHED"
        side_effects:
          - "increments consent.solicitation_round by 1"
          - "repins consent.pinned_policy_id to the asset's current pinned_policy_id"
          - "clears consent.signed_at, consent.pinned_retention_days, consent.record_retention_until, consent.written_release_acknowledged and consent.signature_ref"
          - "recomputes BiometricAsset.consent_gap_count and DataSubject.enrollment_status"
          - "refreshes consent.updated_at and increments consent.version by 1"
        note: "Re-solicitation loop: SOLICITED -> GRANTED -> RESOLICIT_REQUIRED -> SOLICITED is the cycle edge on this entity."
      - from: REVOKED
        to: RESOLICIT_REQUIRED
        trigger: "POST /consent-records/{consent_id}/transitions with to_status=RESOLICIT_REQUIRED"
        actor: PrivacyOfficer
        preconditions:
          - "consent.status == REVOKED"
          - "the asset's status IN {ACTIVE, GATED}, else ERR_ASSET_NOT_COLLECTABLE"
        side_effects:
          - "refreshes consent.updated_at and increments consent.version by 1"

  - entity: AlternativeAccommodation
    initial_state: REQUESTED
    terminal_states: [ENDED]
    transitions:
      - from: REQUESTED
        to: PROVISIONED
        trigger: "POST /accommodations/{accommodation_id}/transitions with to_status=PROVISIONED"
        actor: HRAdministrator
        preconditions:
          - "accommodation.status == REQUESTED"
          - "accommodation.method is permitted for the asset's system_category per ACCOMMODATION_METHOD_MAP, else ERR_ACCOMMODATION_METHOD_NOT_PERMITTED"
        side_effects:
          - "sets accommodation.sla_breached to true when the current logical clock is strictly after accommodation.sla_due_at"
          - "recomputes DataSubject.active_accommodation_count and DataSubject.enrollment_status"
          - "refreshes accommodation.updated_at and increments accommodation.version by 1"
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /accommodations/{accommodation_id}/transitions with to_status=ACTIVE"
        actor: HRAdministrator
        preconditions:
          - "accommodation.status == PROVISIONED"
          - "the current logical clock is at or after accommodation.starts_at, else ERR_INVALID_TRANSITION"
        side_effects:
          - "recomputes DataSubject.enrollment_status"
          - "refreshes accommodation.updated_at and increments accommodation.version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /accommodations/{accommodation_id}/transitions with to_status=ENDED"
        actor: HRAdministrator
        preconditions:
          - "accommodation.status == ACTIVE"
        side_effects:
          - "recomputes DataSubject.active_accommodation_count and DataSubject.enrollment_status"
          - "refreshes accommodation.updated_at and increments accommodation.version by 1"
      - from: PROVISIONED
        to: ENDED
        trigger: "POST /accommodations/{accommodation_id}/transitions with to_status=ENDED, or system event: the originating consent reached GRANTED (compensation) or the asset was decommissioned"
        actor: HRAdministrator | system
        preconditions:
          - "accommodation.status == PROVISIONED"
        side_effects:
          - "recomputes DataSubject.active_accommodation_count and DataSubject.enrollment_status"
          - "refreshes accommodation.updated_at and increments accommodation.version by 1"
      - from: REQUESTED
        to: ENDED
        trigger: "POST /accommodations/{accommodation_id}/transitions with to_status=ENDED, or system event: the originating consent reached GRANTED (compensation) or the asset was decommissioned"
        actor: HRAdministrator | system
        preconditions:
          - "accommodation.status == REQUESTED"
        side_effects:
          - "recomputes DataSubject.enrollment_status"
          - "refreshes accommodation.updated_at and increments accommodation.version by 1"

  - entity: VendorContract
    initial_state: DRAFT
    terminal_states: [CLOSED_OUT, VOID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /vendor-contracts/{contract_id}/transitions with to_status=APPROVED"
        actor: ComplianceApprover
        preconditions:
          - "contract.status == DRAFT"
          - "acting X-User-ID != contract.drafted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "contract.prohibits_sale == true AND contract.restricts_disclosure == true AND contract.requires_deletion_on_termination == true, else ERR_VENDOR_CONTRACT_NONCOMPLIANT"
        side_effects:
          - "sets contract.approved_by_user_id to the acting X-User-ID"
          - "recomputes contract.compliance_score via calculations.vendor_contract_compliance_score"
          - "refreshes contract.updated_at and increments contract.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /vendor-contracts/{contract_id}/transitions with to_status=EXECUTED"
        actor: VendorManager
        preconditions:
          - "contract.status == APPROVED"
          - "no other VendorContract for the same vendor_id has status == EXECUTED, else ERR_DUPLICATE_EXECUTED_CONTRACT"
          - "contract.compliance_score >= CONTRACT_SCORE_FLOOR, else ERR_CONTRACT_SCORE_BELOW_FLOOR"
        side_effects:
          - "recomputes contract.compliance_score"
          - "refreshes contract.updated_at and increments contract.version by 1"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /vendor-contracts/{contract_id}/transitions with to_status=TERMINATED"
        actor: VendorManager
        preconditions:
          - "contract.status == EXECUTED"
        side_effects:
          - "sets contract.terminated_at to the current logical clock and contract.deletion_deadline_at to terminated_at + contract.deletion_deadline_days"
          - "CASCADE A hop 2: every BiometricAsset with vendor_id == contract.vendor_id and status == ACTIVE transitions ACTIVE -> GATED, processed in created_at ASC order"
          - "CASCADE A hop 3: because those assets became GATED, every ConsentRecord on them with status == GRANTED transitions GRANTED -> EXPIRED, processed in created_at ASC order"
          - "CASCADE A hop 4: because those consents expired, each EXPIRED consent whose DataSubject.subject_type == EMPLOYEE spawns one AlternativeAccommodation with origin == AUTO_CONSENT_EXPIRY and status REQUESTED"
          - "CASCADE A hop 5: because assets became GATED and consent gaps opened, recomputes calculations.program_posture on the parent ComplianceProgram, together with gated_asset_count, consent_gap_count and open_deletion_obligation_count"
          - "refreshes contract.updated_at and increments contract.version by 1"
      - from: TERMINATED
        to: CLOSED_OUT
        trigger: "POST /vendor-contracts/{contract_id}/transitions with to_status=CLOSED_OUT"
        actor: VendorManager
        preconditions:
          - "contract.status == TERMINATED"
          - "deletion_certificate_ref is present in the request body, else ERR_INVALID_REQUEST"
          - "the current logical clock is at or before contract.deletion_deadline_at, else ERR_DELETION_DEADLINE_MISSED"
        side_effects:
          - "stores contract.deletion_certificate_ref"
          - "recomputes ComplianceProgram.open_deletion_obligation_count and calculations.program_posture"
          - "refreshes contract.updated_at and increments contract.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /vendor-contracts/{contract_id}/transitions with to_status=VOID"
        actor: VendorManager
        preconditions:
          - "contract.status == DRAFT"
        side_effects:
          - "refreshes contract.updated_at and increments contract.version by 1"

  - entity: NoticePacket
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /notice-packets/{notice_id}/transitions with to_status=PUBLISHED"
        actor: PrivacyOfficer
        preconditions:
          - "notice.status == DRAFT"
          - "the referenced BiometricPolicy.status == PUBLISHED, else ERR_POLICY_NOT_PUBLISHED"
          - "when Jurisdiction.translation_required is true: notice.locales is a superset of Jurisdiction.required_locales, else ERR_TRANSLATION_LOCALE_MISSING"
          - "no other NoticePacket with the same (jurisdiction_id, audience) and status == PUBLISHED occupies an overlapping window under the half-open [effective_from, effective_to) semantics of validations[priority=11], else ERR_NOTICE_WINDOW_OVERLAP"
        side_effects:
          - "sets notice.published_at to the current logical clock"
          - "sets notice.consent_eligible_from to published_at + Jurisdiction.notice_lead_days"
          - "refreshes notice.updated_at and increments notice.version by 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /notice-packets/{notice_id}/transitions with to_status=WITHDRAWN"
        actor: PrivacyOfficer
        preconditions:
          - "notice.status == PUBLISHED"
          - "no BiometricAsset with jurisdiction_id == notice.jurisdiction_id and subject_class == notice.audience has status == ACTIVE, else ERR_ASSET_STILL_ACTIVE"
        side_effects:
          - "refreshes notice.updated_at and increments notice.version by 1"

  - entity: IncidentCase
    initial_state: DETECTED
    terminal_states: [REMEDIATED]
    transitions:
      - from: DETECTED
        to: CONTAINED
        trigger: "POST /incidents/{incident_id}/containment-transitions with to_status=CONTAINED"
        actor: PrivacyOfficer
        preconditions:
          - "incident.containment_status == DETECTED"
          - "containment_note is present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "refreshes incident.updated_at and increments incident.version by 1"
        note: "Parallel dimension 1 of 2: containment_status advances independently of notification_status."
      - from: CONTAINED
        to: REMEDIATED
        trigger: "POST /incidents/{incident_id}/containment-transitions with to_status=REMEDIATED"
        actor: PrivacyOfficer
        preconditions:
          - "incident.containment_status == CONTAINED"
          - "incident.notification_status IN {NOTIFIED, EXEMPT}, else ERR_NOTIFICATION_OUTSTANDING"
          - "every BiometricAsset in incident.affected_asset_ids has status IN {GATED, DECOMMISSIONED}, else ERR_ASSET_STILL_ACTIVE"
        side_effects:
          - "recomputes calculations.program_posture on the parent ComplianceProgram"
          - "refreshes incident.updated_at and increments incident.version by 1"
        note: "Guarded join between the two parallel dimensions: containment cannot reach its terminal state until the notification dimension is resolved."
      - from: PENDING
        to: ASSESSED
        trigger: "POST /incidents/{incident_id}/notification-transitions with to_status=ASSESSED"
        actor: PrivacyOfficer
        preconditions:
          - "incident.notification_status == PENDING"
        side_effects:
          - "recomputes calculations.incident_notification_deadline_and_cost, writing heightened_tier, notification_due_at, gross_notice_cents, regulator_surcharge_cents, vendor_indemnity_credit_cents and net_incident_cost_cents"
          - "refreshes incident.updated_at and increments incident.version by 1"
        note: "Parallel dimension 2 of 2: notification_status advances independently of containment_status."
      - from: ASSESSED
        to: NOTIFIED
        trigger: "POST /incidents/{incident_id}/notification-transitions with to_status=NOTIFIED"
        actor: PrivacyOfficer
        preconditions:
          - "incident.notification_status == ASSESSED"
          - "notified_subject_count is present in the request body and >= incident.exposed_subject_count, else ERR_NOTIFIED_COUNT_SHORTFALL"
        side_effects:
          - "stores incident.notified_subject_count and sets incident.notified_at to the current logical clock"
          - "sets incident.late_notification to true when notified_at is strictly after incident.notification_due_at"
          - "refreshes incident.updated_at and increments incident.version by 1"
      - from: ASSESSED
        to: EXEMPT
        trigger: "POST /incidents/{incident_id}/notification-transitions with to_status=EXEMPT"
        actor: ComplianceApprover
        preconditions:
          - "incident.notification_status == ASSESSED"
          - "incident.heightened_tier == TIER_2, else ERR_EXEMPTION_NOT_AVAILABLE"
          - "exemption_basis is present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "stores incident.exemption_basis"
          - "refreshes incident.updated_at and increments incident.version by 1"

  - entity: ExposureAssessment
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /exposure-assessments/{assessment_id}/transitions with to_status=FINAL"
        actor: ComplianceApprover
        preconditions:
          - "assessment.status == DRAFT"
          - "acting X-User-ID != assessment.created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "no other ExposureAssessment with the same (program_id, jurisdiction_id) has status == FINAL, else ERR_ASSESSMENT_ALREADY_FINAL"
          - "ComplianceProgram.pra_exposure_cents + assessment.exposure_cents <= ComplianceProgram.exposure_ceiling_cents, else ERR_EXPOSURE_CAP_EXCEEDED"
        side_effects:
          - "sets assessment.finalized_by_user_id to the acting X-User-ID"
          - "adds assessment.exposure_cents into ComplianceProgram.pra_exposure_cents"
          - "recomputes calculations.program_posture on the parent ComplianceProgram (a program whose pra_exposure_cents reaches POSTURE_FREEZE_EXPOSURE_PCT of exposure_ceiling_cents freezes)"
          - "increments ComplianceProgram.version by 1"
          - "refreshes assessment.updated_at and increments assessment.version by 1"
      - from: FINAL
        to: VOID
        trigger: "POST /exposure-assessments/{assessment_id}/transitions with to_status=VOID"
        actor: ComplianceApprover
        preconditions:
          - "assessment.status == FINAL"
          - "void_reason is present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "COMPENSATION: subtracts assessment.exposure_cents from ComplianceProgram.pra_exposure_cents, restoring the pre-finalization value exactly"
          - "recomputes calculations.program_posture on the parent ComplianceProgram"
          - "increments ComplianceProgram.version by 1"
          - "refreshes assessment.updated_at and increments assessment.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /exposure-assessments/{assessment_id}/transitions with to_status=VOID"
        actor: PrivacyOfficer
        preconditions:
          - "assessment.status == DRAFT"
          - "void_reason is present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "leaves ComplianceProgram.pra_exposure_cents unchanged, since a DRAFT assessment was never added to it"
          - "refreshes assessment.updated_at and increments assessment.version by 1"

concurrency_rules:
  - rule_id: policy-publish-stale-program
    parent_entity: ComplianceProgram
    write_endpoint: "POST /policies/{policy_id}/publish"
    occ_field: "expected_program_version"
    description: |
      Publishing a BiometricPolicy whose program version has advanced since the
      approver last read the program is rejected as stale. Publication legitimately
      supersedes whatever policy was published before it, so a second publish of a
      different policy version would itself succeed on the merits; the stale
      expected_program_version is the only signal that the approver's view of the
      program (its posture, its currently published policy, its consent-gap counts)
      predates another writer's completed publication.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: exposure-assessment-create-stale-jurisdiction
    parent_entity: Jurisdiction
    write_endpoint: "POST /exposure-assessments"
    occ_field: "expected_jurisdiction_version"
    description: |
      Creating an ExposureAssessment against a Jurisdiction whose version has
      advanced since the drafter last read it is rejected as stale. A new
      assessment legitimately supersedes an earlier draft for the same state, so
      the create would otherwise succeed; the stale expected_jurisdiction_version
      shows that the statutory parameters the estimate is priced from (per-violation
      amounts, cure period, statutory cap) have been amended since the drafter read
      them, which would silently produce an exposure figure priced off withdrawn law.
    error_id: ERR_STALE_JURISDICTION_VERSION
    http_status: 412

calculations:
  - name: effective_retention_and_destruction
    trigger: "on BiometricAsset CLASSIFIED -> ACTIVE and GATED -> ACTIVE; on PATCH /biometric-assets/{asset_id}; on every BiometricAsset touched by CASCADE B hop 3; on POST /programs/{program_id}/destruction-sweeps"
    algorithm: threshold
    formula: |
      policy   = BiometricPolicy WHERE id == asset.pinned_policy_id
      juris    = Jurisdiction WHERE id == asset.jurisdiction_id
      effective_retention_days = min(policy.retention_days, juris.retention_max_days)
      horizon_at = asset.collection_started_at + effective_retention_days days

      purpose_branch_applies =
            policy.destruction_trigger == "PURPOSE_SATISFIED_OR_MAX"
        AND asset.retention_basis      == "PURPOSE_LIMITED"
        AND asset.purpose_satisfied_at != null

      IF purpose_branch_applies:
          asset.destruction_due_at = min(asset.purpose_satisfied_at + PURPOSE_GRACE_DAYS days, horizon_at)
      ELSE:
          asset.destruction_due_at = horizon_at
      # asset.collection_started_at is stamped once, on the FIRST activation only; a
      # GATED -> ACTIVE re-activation recomputes destruction_due_at from the ORIGINAL
      # collection_started_at and never restarts the retention clock.
    input_set: "Exactly one BiometricAsset (the one being activated, patched, cascaded, or swept) together with its pinned BiometricPolicy and its Jurisdiction. Assets with pinned_policy_id == null or collection_started_at == null have destruction_due_at == null and are excluded."
    constants:
      PURPOSE_GRACE_DAYS: 7
    precision: "Whole days added to an ISO 8601 UTC instant; output rendered with three fractional second digits."
    variants:
      - name: fixed_schedule
        when: "the pinned policy's destruction_trigger == FIXED_SCHEDULE, OR the asset's retention_basis == SCHEDULE_ONLY, OR asset.purpose_satisfied_at is null"
        difference: "destruction_due_at is always the schedule horizon; a reported purpose_satisfied_at is ignored entirely."
      - name: purpose_satisfied_or_max
        when: "the pinned policy's destruction_trigger == PURPOSE_SATISFIED_OR_MAX AND the asset's retention_basis == PURPOSE_LIMITED AND asset.purpose_satisfied_at is not null"
        difference: "destruction_due_at is pulled forward to purpose_satisfied_at + PURPOSE_GRACE_DAYS whenever that instant precedes the horizon, so identical retention inputs destroy templates earlier than the fixed-schedule variant."

  - name: pra_exposure_estimate
    trigger: "on POST /exposure-assessments (writes the DRAFT figure) and re-evaluated on ExposureAssessment DRAFT -> FINAL"
    algorithm: tiered_pricing
    formula: |
      juris = Jurisdiction WHERE id == assessment.jurisdiction_id

      scope_assets = BiometricAsset
                     WHERE program_id      == assessment.program_id
                       AND jurisdiction_id == assessment.jurisdiction_id
                       AND status IN {ACTIVE, GATED}

      negligent_rows = ConsentRecord
                       WHERE asset_id IN scope_assets.id
                         AND status IN {SOLICITED, RESOLICIT_REQUIRED, EXPIRED}
      reckless_rows  = ConsentRecord
                       WHERE asset_id IN scope_assets.id
                         AND status == REVOKED
                         AND the ConsentRecord's DataSubject has NO AlternativeAccommodation
                             with status IN {PROVISIONED, ACTIVE}

      assessment.negligent_unit_count = count(negligent_rows)
      assessment.reckless_unit_count  = count(reckless_rows)

      pra_factor = PRA_FACTOR[juris.private_right_of_action]

      assessment.notice_gap_multiplier =
          NOTICE_GAP_MULTIPLIER  IF any asset in scope_assets has consent_gap_count > 0
          ELSE 1.00
      assessment.cure_credit_pct =
          CURE_CREDIT_PCT  IF juris.cure_period_days >= 1
                           AND a BiometricPolicy exists WHERE program_id == assessment.program_id
                               AND status == PUBLISHED AND juris.id IN jurisdiction_scope
          ELSE 0.00

      # --- pinned evaluation order (step 1 .. step 5); no intermediate rounding ---
      # step 1: statutory base, variant-specific
      IF juris.damages_model == "ACTUAL_ONLY":
          assessment.base_cents = 0
      ELSE IF assessment.variant == "PER_VIOLATION_STACKED":
          assessment.base_cents = count(negligent_rows) * juris.per_violation_negligent_cents
                                + count(reckless_rows)  * juris.per_violation_reckless_cents
      ELSE:   # PER_SUBJECT_CAPPED
          FOR each DataSubject s contributing at least one row to negligent_rows or reckless_rows:
              subject_base(s) = (count of s's negligent_rows) * juris.per_violation_negligent_cents
                              + (count of s's reckless_rows)  * juris.per_violation_reckless_cents
          assessment.base_cents = sum over s of min(subject_base(s), PER_SUBJECT_CAP_CENTS)
      # step 2: private-right-of-action factor
      # step 3: notice-gap multiplier
      # step 4: cure credit
      raw = assessment.base_cents * pra_factor
                                  * assessment.notice_gap_multiplier
                                  * (1 - assessment.cure_credit_pct)
      # step 5: ONE rounding of the fully multiplied product, then the statutory cap
      capped = round_half_up(raw, 0)
      assessment.exposure_cents =
          capped IF juris.statutory_cap_cents == null ELSE min(capped, juris.statutory_cap_cents)
    input_set: "ConsentRecord rows attached to BiometricAsset rows of the assessment's program whose status IS IN {ACTIVE, GATED} and whose jurisdiction_id equals the assessment's jurisdiction_id. DECLINED consents are excluded (a lawful decline is not a violation), as are consents on DISCOVERED, CLASSIFIED, or DECOMMISSIONED assets. Subjects grouped by ConsentRecord.data_subject_id; when the PER_SUBJECT_CAPPED per-subject sum is order-sensitive it is accumulated in ConsentRecord.created_at ASC order."
    constants:
      PRA_FACTOR: { NONE: 0.00, LIMITED: 0.50, FULL: 1.00 }
      NOTICE_GAP_MULTIPLIER: 1.25
      CURE_CREDIT_PCT: 0.30
      PER_SUBJECT_CAP_CENTS: 300000
    precision: "Integer cents; exactly one round_half_up applied to the fully multiplied product (step 5), never per factor."
    variants:
      - name: per_violation_stacked
        when: "assessment.variant == PER_VIOLATION_STACKED — the plaintiff theory that each unconsented collection event is its own violation"
        difference: "Every violation row is priced independently, so a single subject with both an unconsented collection and a post-revocation collection contributes the full negligent + reckless sum with no per-person ceiling."
      - name: per_subject_capped
        when: "assessment.variant == PER_SUBJECT_CAPPED — the defence theory that recovery is capped per aggrieved person"
        difference: "Each subject's stacked base is clipped at PER_SUBJECT_CAP_CENTS before summation, so identical consent data yields a strictly lower figure whenever any single subject's base exceeds the cap."

  - name: vendor_contract_compliance_score
    trigger: "on POST /vendor-contracts, on VendorContract DRAFT -> APPROVED and APPROVED -> EXECUTED, and on POST /vendors/{vendor_id}/attestations for every non-terminal contract of that vendor"
    algorithm: weighted_scoring
    formula: |
      vendor = Vendor WHERE id == contract.vendor_id
      clause_value(prohibits_sale)                 = W_PROHIBITS_SALE       IF contract.prohibits_sale                 ELSE 0
      clause_value(restricts_disclosure)           = W_RESTRICTS_DISCLOSURE IF contract.restricts_disclosure           ELSE 0
      clause_value(requires_deletion_on_term)      = W_DELETION_ON_TERM     IF contract.requires_deletion_on_termination ELSE 0
      clause_value(deletion_sla)                   = W_DELETION_SLA
                                                     IF contract.deletion_deadline_days <= DELETION_DEADLINE_TARGET_DAYS ELSE 0
      factor = ATTESTATION_FACTOR[vendor.attestation_status]

      # --- PINNED ROUNDING ORDER: round EACH clause to 2dp, THEN sum. ---
      # Summing the raw products and rounding once at the end produces a different
      # cent figure (e.g. 85.50 instead of 85.51 at factor 0.855); the per-clause
      # order below is normative and MUST NOT be reordered.
      clause_points = 0
      FOR each of the four clauses c:
          clause_points = clause_points + round_half_up(clause_value(c) * 100 * factor, 2)

      # --- THEN the two penalty adjustments, THEN the clamp, in this order ---
      adjusted = clause_points
               - (SELL_PENALTY_POINTS IF vendor.sells_biometric_data ELSE 0)
               - SUBPROCESSOR_PENALTY_POINTS * min(vendor.subprocessor_count, SUBPROCESSOR_PENALTY_CAP)
      contract.compliance_score = round_half_up(max(0, min(100, adjusted)), 2)
    input_set: "Exactly one VendorContract plus its Vendor. Contracts with status IN {VOID, CLOSED_OUT} are frozen: their compliance_score is not recomputed by later attestation changes."
    constants:
      W_PROHIBITS_SALE: 0.35
      W_RESTRICTS_DISCLOSURE: 0.25
      W_DELETION_ON_TERM: 0.30
      W_DELETION_SLA: 0.10
      DELETION_DEADLINE_TARGET_DAYS: 30
      ATTESTATION_FACTOR: { NOT_REQUESTED: 0.715, REQUESTED: 0.855, RECEIVED: 1.000, REJECTED: 0.000 }
      SELL_PENALTY_POINTS: 7.5
      SUBPROCESSOR_PENALTY_POINTS: 2.5
      SUBPROCESSOR_PENALTY_CAP: 4
      CONTRACT_SCORE_FLOOR: 82.50
    precision: "2 decimal places, round_half_up, applied once per clause and once to the final clamped total."

  - name: vendor_risk_score
    trigger: "on POST /vendors and on POST /vendors/{vendor_id}/attestations"
    algorithm: aggregation
    formula: |
      raw = RISK_BASE
          + (RISK_SELLS_POINTS IF vendor.sells_biometric_data ELSE 0)
          + RISK_SUBPROCESSOR_POINTS * min(vendor.subprocessor_count, RISK_SUBPROCESSOR_CAP)
          + (RISK_SLA_POINTS IF vendor.deletion_sla_days > RISK_SLA_TARGET_DAYS ELSE 0)
          + RISK_ATTESTATION_POINTS[vendor.attestation_status]
          + (RISK_DISCLOSURE_GAP_POINTS IF vendor.subprocessor_disclosure_complete == false ELSE 0)
      vendor.risk_score = max(0, min(100, raw))
    input_set: "Exactly one Vendor row; no child aggregation. The gate BiometricAsset CLASSIFIED -> ACTIVE applies is risk_score <= VENDOR_RISK_GATE (a score of exactly 70 passes, 75 fails)."
    constants:
      RISK_BASE: 20
      RISK_SELLS_POINTS: 30
      RISK_SUBPROCESSOR_POINTS: 5
      RISK_SUBPROCESSOR_CAP: 6
      RISK_SLA_POINTS: 15
      RISK_SLA_TARGET_DAYS: 30
      RISK_ATTESTATION_POINTS: { NOT_REQUESTED: 20, REQUESTED: 10, RECEIVED: 0, REJECTED: 35 }
      RISK_DISCLOSURE_GAP_POINTS: 10
      VENDOR_RISK_GATE: 70
    precision: "Integer points, 0-100 inclusive after clamping."

  - name: incident_notification_deadline_and_cost
    trigger: "on IncidentCase notification_status PENDING -> ASSESSED"
    algorithm: threshold
    formula: |
      affected = BiometricAsset WHERE id IN incident.affected_asset_ids

      # --- tier ---
      incident.heightened_tier =
          "TIER_1" IF (any a in affected has a.modality IN {FACE_GEOMETRY, IRIS})
                      OR incident.exposed_subject_count >= TIER1_SUBJECT_THRESHOLD
          ELSE "TIER_2"
      deadline_days = TIER1_DEADLINE_DAYS IF incident.heightened_tier == "TIER_1" ELSE TIER2_DEADLINE_DAYS
      incident.notification_due_at = incident.discovered_at + deadline_days days

      # --- cost, in this PINNED evaluation order (1 gross, 2 surcharge, 3 credit, 4 net) ---
      # 1. gross
      incident.gross_notice_cents = incident.exposed_subject_count  * NOTICE_UNIT_CENTS
                                  + incident.translation_locale_count * TRANSLATION_UNIT_CENTS
      # 2. surcharge, keyed on the PRE-CREDIT gross (never on the net)
      incident.regulator_surcharge_cents =
          0                    IF incident.gross_notice_cents <  SURCHARGE_MID_FLOOR_CENTS
          SURCHARGE_MID_CENTS  IF SURCHARGE_MID_FLOOR_CENTS <= incident.gross_notice_cents < SURCHARGE_HIGH_FLOOR_CENTS
          SURCHARGE_HIGH_CENTS IF incident.gross_notice_cents >= SURCHARGE_HIGH_FLOOR_CENTS
      # 3. credit, capped at half of the PRE-SURCHARGE gross, TRUNCATED (floor), not rounded
      indemnity_pool = sum of VendorContract.indemnity_cap_cents over contracts WHERE
                       status == EXECUTED AND vendor_id IN (affected.vendor_id where not null)
      incident.vendor_indemnity_credit_cents =
          min(indemnity_pool, floor(INDEMNITY_CREDIT_PCT * incident.gross_notice_cents))
      # 4. net
      incident.net_incident_cost_cents = incident.gross_notice_cents
                                       + incident.regulator_surcharge_cents
                                       - incident.vendor_indemnity_credit_cents
    input_set: "The IncidentCase, its affected BiometricAsset rows (all must belong to incident.program_id), and the EXECUTED VendorContract rows of those assets' vendors. Contracts in DRAFT, APPROVED, TERMINATED, CLOSED_OUT or VOID contribute nothing to indemnity_pool."
    constants:
      TIER1_SUBJECT_THRESHOLD: 500
      TIER1_DEADLINE_DAYS: 15
      TIER2_DEADLINE_DAYS: 45
      NOTICE_UNIT_CENTS: 425
      TRANSLATION_UNIT_CENTS: 15000
      SURCHARGE_MID_FLOOR_CENTS: 50000
      SURCHARGE_HIGH_FLOOR_CENTS: 150000
      SURCHARGE_MID_CENTS: 25000
      SURCHARGE_HIGH_CENTS: 75000
      INDEMNITY_CREDIT_PCT: 0.50
    precision: "Integer cents. The half-of-gross credit ceiling is TRUNCATED toward zero (floor), so an odd gross yields the lower cent; round_half_up is NOT used here."

  - name: program_posture
    trigger: "recomputed at the end of every mutation that can change its inputs: BiometricAsset activation/gating/decommission, ConsentRecord grant/decline/revoke/expiry/resolicit, VendorContract termination and close-out, BiometricPolicy publication, ExposureAssessment finalization and voiding, IncidentCase CONTAINED -> REMEDIATED, and POST /programs/{program_id}/destruction-sweeps"
    algorithm: constraint_propagation
    formula: |
      gated_asset_count             = count of BiometricAsset WHERE program_id == program.id AND status == GATED
      consent_gap_count             = sum of BiometricAsset.consent_gap_count over the program's assets WHERE status IN {ACTIVE, GATED}
      open_deletion_obligations     = VendorContract WHERE status == TERMINATED
                                      AND deletion_certificate_ref == null
                                      AND vendor_id IN (Vendor WHERE program_id == program.id).id
      overdue_deletion_obligations  = open_deletion_obligations WHERE current_clock > deletion_deadline_at
      pra_exposure_cents            = sum of ExposureAssessment.exposure_cents WHERE program_id == program.id AND status == FINAL

      # --- pinned precedence: FROZEN tests first, RESTRICTED second, OPEN last ---
      IF count(overdue_deletion_obligations) > 0:                                  program.posture = "FROZEN"
      ELSE IF program.exposure_ceiling_cents > 0
              AND pra_exposure_cents * 100 >= POSTURE_FREEZE_EXPOSURE_PCT * program.exposure_ceiling_cents:
                                                                                   program.posture = "FROZEN"
      ELSE IF gated_asset_count > 0 OR consent_gap_count > 0
              OR count(open_deletion_obligations) > 0:                             program.posture = "RESTRICTED"
      ELSE:                                                                        program.posture = "OPEN"
    input_set: "All BiometricAsset rows of the program (status filter as written), all VendorContract rows reachable through the program's Vendor rows, and all ExposureAssessment rows of the program with status == FINAL. A program with zero assets, zero contracts and zero final assessments is OPEN."
    constants:
      POSTURE_FREEZE_EXPOSURE_PCT: 80
    precision: "Integer comparison only; the 80% test is evaluated as pra_exposure_cents * 100 >= 80 * exposure_ceiling_cents so no floating point is involved (exactly 80.00% freezes)."

  - name: inventory_completeness_pct
    trigger: "on POST /biometric-assets, on BiometricAsset DISCOVERED -> CLASSIFIED, CLASSIFIED -> ACTIVE, GATED -> DECOMMISSIONED and CLASSIFIED -> DECOMMISSIONED, and on GET /programs/{program_id}"
    algorithm: aggregation
    formula: |
      scope = BiometricAsset WHERE program_id == program.id AND status != DECOMMISSIONED
      IF count(scope) == 0:
          program.inventory_completeness_pct = 100.00        # empty-inventory convention
      ELSE:
          documented = count of a in scope WHERE
                         a.status IN {CLASSIFIED, ACTIVE, GATED}
                         AND a.template_storage_location != ""
                         AND (a.vendor_id == null
                              OR a VendorContract exists WHERE vendor_id == a.vendor_id AND status == EXECUTED)
          program.inventory_completeness_pct = round_half_up(100 * documented / count(scope), 2)
    input_set: "BiometricAsset rows of the program excluding status == DECOMMISSIONED. DECOMMISSIONED assets leave the denominator entirely, so decommissioning an undocumented DISCOVERED asset raises the percentage."
    constants: {}
    precision: "2 decimal places, round_half_up; the empty scope returns exactly 100.00 rather than a division by zero."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the six roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list. On the shared `/transitions` endpoints the role is checked against the requested to_status: e.g. POST /policies/{policy_id}/transitions accepts PrivacyOfficer only for to_status IN {IN_REVIEW, RETIRED} and ComplianceApprover only for to_status == DRAFT; POST /vendor-contracts/{contract_id}/transitions accepts ComplianceApprover only for to_status == APPROVED and VendorManager only for to_status IN {EXECUTED, TERMINATED, CLOSED_OUT, VOID}; POST /exposure-assessments/{assessment_id}/transitions accepts ComplianceApprover for to_status IN {FINAL, VOID} and PrivacyOfficer only for to_status == VOID; POST /consent-records/{consent_id}/transitions accepts Subject only for to_status == REVOKED."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request body conforms to the endpoint's declared input: required fields present, enum members valid, integers non-negative where constrained, ISO 8601 datetimes parseable, arrays non-empty where required, to_status a member of the target entity's status enum, pagination limit within [1,100] and offset >= 0. Also enforces the per-transition body requirements (decline_reason, revocation_reason, containment_note, exemption_basis, void_reason, deletion_certificate_ref, notified_subject_count, signature_ref) and the per-program uniqueness of Jurisdiction.state_code, DataSubject.external_ref and BiometricPolicy.version_label."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Every referenced resource exists, validated left-to-right: first the path id, then body foreign keys in the order they appear in the endpoint's input list (program_id, jurisdiction_id, policy_id, vendor_id, asset_id, data_subject_id, incident_id, then array members of affected_asset_ids in index order)."
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all"
    note: "Emits the entity-specific 404 from §1.6 for whichever reference fails first: ERR_PROGRAM_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND, ERR_VENDOR_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_SUBJECT_NOT_FOUND, ERR_CONSENT_NOT_FOUND, ERR_ACCOMMODATION_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND."
  - priority: 5
    category: auth
    check: "When the acting role is Subject, X-User-ID equals the DataSubject.id that owns the target resource (ConsentRecord.data_subject_id for a consent transition, AlternativeAccommodation.data_subject_id for an accommodation read, DataSubject.id for a subject read)."
    error_id: ERR_SUBJECT_MISMATCH
    http_status: 403
    applies_to: "POST /consent-records/{consent_id}/transitions, GET /data-subjects/{subject_id}, GET /accommodations/{accommodation_id}, GET /consent-records/{consent_id}"
  - priority: 6
    category: state
    check: "The supplied expected_program_version equals ComplianceProgram.version (POST /policies/{policy_id}/publish), and the supplied expected_jurisdiction_version equals Jurisdiction.version (POST /exposure-assessments), per the §1.2.1 concurrency rules."
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /policies/{policy_id}/publish, POST /exposure-assessments"
    note: "POST /exposure-assessments emits ERR_STALE_JURISDICTION_VERSION for its own occ_field."
  - priority: 7
    category: auth
    check: "Segregation of duties: the acting X-User-ID differs from the user who performed the preceding step — policy.submitted_by_user_id on publish, contract.drafted_by_user_id on approval, assessment.created_by_user_id on finalization."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /policies/{policy_id}/publish, POST /vendor-contracts/{contract_id}/transitions (to_status=APPROVED), POST /exposure-assessments/{assessment_id}/transitions (to_status=FINAL)"
  - priority: 8
    category: state
    check: "The requested transition (from the entity's current status to to_status) is declared in §1.2 for that entity; for consent lifecycle operations the target BiometricAsset must additionally be in a collectable status IN {ACTIVE, GATED}."
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all POST .../transitions, POST /incidents/{incident_id}/containment-transitions, POST /incidents/{incident_id}/notification-transitions, POST /policies/{policy_id}/publish, POST /consent-records, POST /vendors/{vendor_id}/attestations"
    note: |
      Emits ERR_ASSET_NOT_COLLECTABLE instead of ERR_INVALID_TRANSITION when the transition
      itself is legal but the asset is DISCOVERED, CLASSIFIED or DECOMMISSIONED.
      Vendor.attestation_status is advanced by POST /vendors/{vendor_id}/attestations along the
      permitted order NOT_REQUESTED -> REQUESTED -> {RECEIVED | REJECTED}, plus REJECTED ->
      REQUESTED (re-request). RECEIVED is terminal, and any other pair (e.g. NOT_REQUESTED ->
      RECEIVED, or RECEIVED -> REQUESTED) is rejected with ERR_INVALID_TRANSITION.
  - priority: 9
    category: state
    check: "ComplianceProgram.posture permits the operation: FROZEN blocks BiometricAsset CLASSIFIED -> ACTIVE and GATED -> ACTIVE, policy publication, notice publication, consent creation and consent granting; RESTRICTED blocks only CLASSIFIED -> ACTIVE and consent creation on assets whose status != ACTIVE."
    error_id: ERR_PROGRAM_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /biometric-assets/{asset_id}/transitions, POST /policies/{policy_id}/publish, POST /notice-packets/{notice_id}/transitions, POST /consent-records, POST /consent-records/{consent_id}/transitions"
  - priority: 10
    category: business_safety
    check: "Regulatory prerequisites for collecting or continuing to collect: a PUBLISHED in-scope BiometricPolicy exists (ERR_POLICY_NOT_PUBLISHED); a PUBLISHED NoticePacket covers the jurisdiction and audience (ERR_NOTICE_NOT_PUBLISHED); the notice locales cover Jurisdiction.required_locales when translation_required (ERR_TRANSLATION_LOCALE_MISSING); the written release is acknowledged where requires_written_release (ERR_WRITTEN_RELEASE_REQUIRED); the operating vendor's risk_score <= VENDOR_RISK_GATE (ERR_VENDOR_RISK_TOO_HIGH)."
    error_id: ERR_POLICY_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /biometric-assets/{asset_id}/transitions, POST /notice-packets/{notice_id}/transitions, POST /policies/{policy_id}/transitions, POST /consent-records, POST /consent-records/{consent_id}/transitions"
  - priority: 11
    category: business_temporal
    check: "Time-window rules: consent may not be solicited before the covering NoticePacket.consent_eligible_from (ERR_NOTICE_LEAD_NOT_MET); a PUBLISHED NoticePacket window may not overlap another PUBLISHED packet for the same (jurisdiction_id, audience) under HALF-OPEN [effective_from, effective_to) semantics where a null effective_to means +infinity and abutting windows (previous.effective_to == next.effective_from) are permitted (ERR_NOTICE_WINDOW_OVERLAP); an AlternativeAccommodation window may not collide with another accommodation for the same data_subject_id under CLOSED [starts_at, ends_at] semantics inflated by ACCOMMODATION_CHANGEOVER_BUFFER_HOURS = 24 on BOTH ends, so touching or merely near-adjacent windows DO collide (ERR_ACCOMMODATION_WINDOW_CONFLICT); a TERMINATED contract may not be closed out after deletion_deadline_at (ERR_DELETION_DEADLINE_MISSED)."
    error_id: ERR_NOTICE_LEAD_NOT_MET
    http_status: 409
    applies_to: "POST /consent-records, POST /notice-packets/{notice_id}/transitions, POST /accommodations, POST /vendor-contracts/{contract_id}/transitions"
  - priority: 12
    category: business_constraint
    check: "Threshold and configuration constraints: policy retention_days <= every in-scope Jurisdiction.retention_max_days (ERR_RETENTION_EXCEEDS_JURISDICTION_MAX); VendorContract.compliance_score >= CONTRACT_SCORE_FLOOR on execution and on asset activation (ERR_CONTRACT_SCORE_BELOW_FLOOR); the accommodation method is permitted for the asset's system_category per ACCOMMODATION_METHOD_MAP (ERR_ACCOMMODATION_METHOD_NOT_PERMITTED); notified_subject_count >= exposed_subject_count (ERR_NOTIFIED_COUNT_SHORTFALL)."
    error_id: ERR_CONTRACT_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /policies/{policy_id}/transitions, POST /vendor-contracts/{contract_id}/transitions, POST /biometric-assets/{asset_id}/transitions, POST /accommodations, POST /accommodations/{accommodation_id}/transitions, POST /incidents/{incident_id}/notification-transitions"
    note: |
      ACCOMMODATION_METHOD_MAP (normative, one permitted method per system_category; also the
      method every AUTO_* cascade-created accommodation receives):
        TIMEKEEPING     -> MANUAL_TIMESHEET
        ACCESS_CONTROL  -> BADGE_PIN
        CUSTOMER_FACING -> STAFFED_LANE
        SECURITY_CAMERA -> MANUAL_LOG
      Other constants referenced by transitions and endpoints:
        ACCOMMODATION_SLA_DAYS = 5            (REQUESTED -> PROVISIONED deadline, from creation clock)
        AUTO_ACCOMMODATION_WINDOW_DAYS = 90   (ends_at - starts_at for cascade-created accommodations)
        ACCOMMODATION_CHANGEOVER_BUFFER_HOURS = 24
        CONSENT_RECORD_RETENTION_DAYS = 1095  (ConsentRecord.record_retention_until offset from signed_at)
  - priority: 13
    category: business_referential
    check: "Cross-entity referential coherence: contract clauses complete before approval (ERR_VENDOR_CONTRACT_NONCOMPLIANT); no open consent gap when re-activating a GATED asset (ERR_CONSENT_GAP_OPEN); the DataSubject's jurisdiction_id equals the BiometricAsset's jurisdiction_id (ERR_JURISDICTION_MISMATCH); the DataSubject's subject_type equals the BiometricAsset's subject_class (ERR_SUBJECT_CLASS_MISMATCH); no non-terminal ConsentRecord already exists for the (data_subject_id, asset_id) pair (ERR_CONSENT_ALREADY_EXISTS); at most one EXECUTED contract per vendor (ERR_DUPLICATE_EXECUTED_CONTRACT); at most one FINAL assessment per (program_id, jurisdiction_id) (ERR_ASSESSMENT_ALREADY_FINAL); dependent assets no longer ACTIVE (ERR_ASSET_STILL_ACTIVE); notification resolved before remediation (ERR_NOTIFICATION_OUTSTANDING); exemption only available at TIER_2 (ERR_EXEMPTION_NOT_AVAILABLE)."
    error_id: ERR_JURISDICTION_MISMATCH
    http_status: 409
    applies_to: "POST /consent-records, POST /accommodations, POST /biometric-assets/{asset_id}/transitions, POST /vendor-contracts/{contract_id}/transitions, POST /policies/{policy_id}/transitions, POST /notice-packets/{notice_id}/transitions, POST /incidents/{incident_id}/containment-transitions, POST /incidents/{incident_id}/notification-transitions, POST /exposure-assessments/{assessment_id}/transitions"
  - priority: 14
    category: business_fiscal
    check: "Finalizing an ExposureAssessment must not push ComplianceProgram.pra_exposure_cents past ComplianceProgram.exposure_ceiling_cents (the sum of already-FINAL exposure plus this assessment's exposure_cents is compared to the ceiling; equality is allowed)."
    error_id: ERR_EXPOSURE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /exposure-assessments/{assessment_id}/transitions (to_status=FINAL)"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role not one of the six declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not permitted for this endpoint, or not permitted for the requested to_status on a shared transitions endpoint."
  - id: ERR_SUBJECT_MISMATCH
    http: 403
    condition: "Acting as Subject with an X-User-ID that is not the DataSubject owning the target resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is the same user who submitted the policy, drafted the contract, or created the assessment now being approved."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, invalid enum member, negative integer where non-negative required, unparseable datetime, empty required array, pagination out of range, or a duplicate value on a per-program unique field."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No ComplianceProgram with the referenced id."
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "No Jurisdiction with the referenced id."
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "No Vendor with the referenced id."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "No VendorContract with the referenced id."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "No BiometricPolicy with the referenced id, including ids listed in a policy's jurisdiction_scope that do not resolve."
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "No NoticePacket with the referenced id."
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "No BiometricAsset with the referenced id, including any member of affected_asset_ids."
  - id: ERR_SUBJECT_NOT_FOUND
    http: 404
    condition: "No DataSubject with the referenced id."
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "No ConsentRecord with the referenced id."
  - id: ERR_ACCOMMODATION_NOT_FOUND
    http: 404
    condition: "No AlternativeAccommodation with the referenced id."
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "No IncidentCase with the referenced id."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No ExposureAssessment with the referenced id."
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the current ComplianceProgram.version on POST /policies/{policy_id}/publish."
  - id: ERR_STALE_JURISDICTION_VERSION
    http: 412
    condition: "expected_jurisdiction_version does not equal the current Jurisdiction.version on POST /exposure-assessments."
  - id: ERR_INVALID_TRANSITION
    http: 409
    condition: "The requested from-status -> to_status pair is not declared in §1.2 for the entity, including a repeated trigger against an already-advanced or terminal row, and an accommodation activated before its starts_at."
  - id: ERR_ASSET_NOT_COLLECTABLE
    http: 409
    condition: "A consent lifecycle operation targets a BiometricAsset whose status is DISCOVERED, CLASSIFIED or DECOMMISSIONED."
  - id: ERR_PROGRAM_POSTURE_BLOCKED
    http: 409
    condition: "ComplianceProgram.posture is FROZEN (or RESTRICTED for asset activation from CLASSIFIED and for consent creation on a non-ACTIVE asset) and the requested operation is gated by posture."
  - id: ERR_POLICY_NOT_PUBLISHED
    http: 422
    condition: "No BiometricPolicy with status == PUBLISHED covers the jurisdiction in question, or the referenced policy is not PUBLISHED."
  - id: ERR_NOTICE_NOT_PUBLISHED
    http: 422
    condition: "No NoticePacket with status == PUBLISHED exists for the (jurisdiction_id, audience) pair required by the operation."
  - id: ERR_TRANSLATION_LOCALE_MISSING
    http: 422
    condition: "Jurisdiction.translation_required is true and the notice or consent locale set does not cover every entry in Jurisdiction.required_locales."
  - id: ERR_WRITTEN_RELEASE_REQUIRED
    http: 422
    condition: "Jurisdiction.requires_written_release is true but written_release_acknowledged is false on the consent being granted, or release_language_included is false on the policy being submitted for review."
  - id: ERR_VENDOR_RISK_TOO_HIGH
    http: 422
    condition: "The operating Vendor's risk_score exceeds VENDOR_RISK_GATE (70) at asset activation."
  - id: ERR_NOTICE_LEAD_NOT_MET
    http: 409
    condition: "A consent is solicited before the covering PUBLISHED NoticePacket's consent_eligible_from instant."
  - id: ERR_NOTICE_WINDOW_OVERLAP
    http: 409
    condition: "Publishing a NoticePacket whose half-open [effective_from, effective_to) window overlaps another PUBLISHED packet for the same (jurisdiction_id, audience)."
  - id: ERR_ACCOMMODATION_WINDOW_CONFLICT
    http: 409
    condition: "Creating an AlternativeAccommodation whose closed [starts_at, ends_at] window, inflated by 24 hours on both ends, intersects another accommodation for the same data_subject_id with status IN {REQUESTED, PROVISIONED, ACTIVE}."
  - id: ERR_DELETION_DEADLINE_MISSED
    http: 409
    condition: "Closing out a TERMINATED VendorContract when the logical clock is strictly after deletion_deadline_at."
  - id: ERR_RETENTION_EXCEEDS_JURISDICTION_MAX
    http: 422
    condition: "A policy's retention_days exceeds retention_max_days of at least one Jurisdiction in its jurisdiction_scope."
  - id: ERR_CONTRACT_SCORE_BELOW_FLOOR
    http: 422
    condition: "A VendorContract with compliance_score < CONTRACT_SCORE_FLOOR (82.50) is executed, or is relied on to activate an asset."
  - id: ERR_ACCOMMODATION_METHOD_NOT_PERMITTED
    http: 422
    condition: "The requested accommodation method is not the ACCOMMODATION_METHOD_MAP entry for the asset's system_category."
  - id: ERR_NOTIFIED_COUNT_SHORTFALL
    http: 422
    condition: "notified_subject_count is less than IncidentCase.exposed_subject_count on the NOTIFIED transition."
  - id: ERR_VENDOR_CONTRACT_NONCOMPLIANT
    http: 409
    condition: "A contract missing any of prohibits_sale, restricts_disclosure or requires_deletion_on_termination is approved, or an asset with a vendor that has no APPROVED/EXECUTED contract is classified."
  - id: ERR_CONSENT_GAP_OPEN
    http: 409
    condition: "Re-activating a GATED BiometricAsset whose consent_gap_count is greater than zero."
  - id: ERR_JURISDICTION_MISMATCH
    http: 409
    condition: "The DataSubject's jurisdiction_id differs from the BiometricAsset's jurisdiction_id, or an asset's jurisdiction is outside the pinned policy's jurisdiction_scope."
  - id: ERR_SUBJECT_CLASS_MISMATCH
    http: 409
    condition: "The DataSubject's subject_type differs from the BiometricAsset's subject_class."
  - id: ERR_CONSENT_ALREADY_EXISTS
    http: 409
    condition: "A ConsentRecord with status IN {SOLICITED, GRANTED, RESOLICIT_REQUIRED} already exists for the (data_subject_id, asset_id) pair."
  - id: ERR_DUPLICATE_EXECUTED_CONTRACT
    http: 409
    condition: "Executing a second VendorContract for a vendor that already has one with status == EXECUTED."
  - id: ERR_ASSESSMENT_ALREADY_FINAL
    http: 409
    condition: "Finalizing an ExposureAssessment when another assessment for the same (program_id, jurisdiction_id) is already FINAL."
  - id: ERR_ASSET_STILL_ACTIVE
    http: 409
    condition: "Retiring a policy, withdrawing a notice, or remediating an incident while a dependent BiometricAsset is still ACTIVE (or, for policy retirement, still ACTIVE or GATED)."
  - id: ERR_NOTIFICATION_OUTSTANDING
    http: 409
    condition: "Advancing containment_status CONTAINED -> REMEDIATED while notification_status is PENDING or ASSESSED."
  - id: ERR_EXEMPTION_NOT_AVAILABLE
    http: 409
    condition: "Claiming a notification exemption on an IncidentCase whose heightened_tier is TIER_1."
  - id: ERR_EXPOSURE_CAP_EXCEEDED
    http: 409
    condition: "Finalizing an ExposureAssessment would push the program's summed FINAL exposure_cents above exposure_ceiling_cents."

endpoints:
  # --- ComplianceProgram ---
  - method: POST
    path: "/programs"
    description: "Register a biometric privacy compliance program. Created with posture OPEN, inventory_completeness_pct 100.00 and all counters at zero."
    roles: [SystemOperator]
    code: 201
    input: [org_name, org_type, exposure_ceiling_cents]
    output: ComplianceProgram
    side_effects: ["initializes posture to OPEN via calculations.program_posture (empty program)", "initializes inventory_completeness_pct to 100.00 via calculations.inventory_completeness_pct (empty scope)"]
  - method: GET
    path: "/programs/{program_id}"
    description: "Read a compliance program including its recomputed posture, counters and exposure figures. This is the canonical read for the current ComplianceProgram.version used by the OCC rule policy-publish-stale-program."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager, HRAdministrator]
    code: 200
    input: []
    output: ComplianceProgram
    side_effects: ["recomputes inventory_completeness_pct and posture from current child state (read-through, no version bump)"]
  - method: POST
    path: "/programs/{program_id}/destruction-sweeps"
    description: "Run the scheduled destruction sweep for a program at the current logical clock: destroys templates on assets whose destruction_due_at has arrived, expires their granted consents, and flags accommodation SLA breaches."
    roles: [SystemOperator]
    code: 200
    input: []
    output: "{ swept_asset_count: integer, destroyed_template_count: integer, expired_consent_count: integer, sla_breached_accommodation_count: integer, program_posture: string }"
    side_effects:
      - "for every BiometricAsset of the program with status IN {ACTIVE, GATED}, destruction_due_at != null and current_clock >= destruction_due_at: stamps templates_destroyed_at and transitions the asset to GATED when it was ACTIVE"
      - "every ConsentRecord on those assets with status == GRANTED transitions GRANTED -> EXPIRED (no AlternativeAccommodation is auto-created: the expiry is a retention event, not a refusal)"
      - "sets sla_breached = true on every AlternativeAccommodation with status == REQUESTED whose sla_due_at has passed"
      - "recomputes calculations.program_posture, gated_asset_count and consent_gap_count"
      - "increments ComplianceProgram.version by 1"

  # --- Jurisdiction ---
  - method: POST
    path: "/jurisdictions"
    description: "Add a state statutory profile to a program."
    roles: [SystemOperator]
    code: 201
    input: [program_id, state_code, statute_name, private_right_of_action, damages_model, requires_written_release, translation_required, required_locales, retention_max_days, notice_lead_days, per_violation_negligent_cents, per_violation_reckless_cents, cure_period_days, "statutory_cap_cents?"]
    output: Jurisdiction
    side_effects: ["increments ComplianceProgram.version by 1"]
  - method: PATCH
    path: "/jurisdictions/{jurisdiction_id}"
    description: "Amend a state statutory profile after a legislative change. Every amendment bumps Jurisdiction.version, which is what the OCC rule exposure-assessment-create-stale-jurisdiction observes."
    roles: [SystemOperator]
    code: 200
    input: ["private_right_of_action?", "damages_model?", "requires_written_release?", "translation_required?", "required_locales?", "retention_max_days?", "notice_lead_days?", "per_violation_negligent_cents?", "per_violation_reckless_cents?", "cure_period_days?", "statutory_cap_cents?"]
    output: Jurisdiction
    side_effects: ["increments Jurisdiction.version by 1", "recomputes calculations.effective_retention_and_destruction for every BiometricAsset in this jurisdiction with status IN {ACTIVE, GATED}"]
  - method: GET
    path: "/jurisdictions/{jurisdiction_id}"
    description: "Read one state statutory profile. This is the canonical read for the current Jurisdiction.version used by the OCC rule exposure-assessment-create-stale-jurisdiction."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager, HRAdministrator]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/jurisdictions"
    description: "List state statutory profiles, filterable by program."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager, HRAdministrator]
    code: 200
    input: ["program_id?", "state_code?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Register a biometric processor for a program; risk_score is computed immediately from the disclosed attributes with attestation_status NOT_REQUESTED."
    roles: [VendorManager]
    code: 201
    input: [program_id, name, sells_biometric_data, subprocessor_count, deletion_sla_days, "subprocessor_disclosure_complete?"]
    output: Vendor
    side_effects: ["computes risk_score via calculations.vendor_risk_score", "increments ComplianceProgram.version by 1"]
  - method: POST
    path: "/vendors/{vendor_id}/attestations"
    description: "Advance the vendor's written biometric-handling attestation (NOT_REQUESTED -> REQUESTED -> RECEIVED or REJECTED) and optionally record that subprocessor disclosure is now complete."
    roles: [VendorManager]
    code: 200
    input: [attestation_status, "subprocessor_disclosure_complete?"]
    output: Vendor
    side_effects:
      - "sets Vendor.attestation_status and, when supplied, subprocessor_disclosure_complete"
      - "recomputes risk_score via calculations.vendor_risk_score"
      - "recomputes calculations.vendor_contract_compliance_score for every VendorContract of this vendor with status NOT IN {VOID, CLOSED_OUT}"
      - "increments Vendor.version by 1"
  - method: GET
    path: "/vendors/{vendor_id}"
    description: "Read one vendor with its current risk_score and attestation_status."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors"
    description: "List vendors, filterable by program."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  # --- VendorContract ---
  - method: POST
    path: "/vendor-contracts"
    description: "Draft a biometric processing contract for a vendor; compliance_score is computed at draft time from the clause set and the vendor's current attestation factor."
    roles: [VendorManager]
    code: 201
    input: [vendor_id, prohibits_sale, restricts_disclosure, requires_deletion_on_termination, deletion_deadline_days, indemnity_cap_cents, effective_from]
    output: VendorContract
    side_effects: ["stores drafted_by_user_id from the acting X-User-ID", "computes compliance_score via calculations.vendor_contract_compliance_score"]
  - method: POST
    path: "/vendor-contracts/{contract_id}/transitions"
    description: "Drive the contract lifecycle: APPROVED (ComplianceApprover, segregation of duties against the drafter), EXECUTED, TERMINATED (fires CASCADE A), CLOSED_OUT, VOID."
    roles: [ComplianceApprover, VendorManager]
    code: 200
    input: [to_status, "deletion_certificate_ref?"]
    output: VendorContract
    side_effects: ["applies the §1.2 VendorContract transition and all its declared side effects, including the five-hop CASCADE A on TERMINATED", "increments VendorContract.version by 1"]
  - method: GET
    path: "/vendor-contracts/{contract_id}"
    description: "Read one vendor contract with its compliance_score and deletion deadline."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager]
    code: 200
    input: []
    output: VendorContract
    side_effects: []
  - method: GET
    path: "/vendor-contracts"
    description: "List vendor contracts, filterable by vendor."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager]
    code: 200
    input: ["vendor_id?", "status?", "limit?", "offset?"]
    output: VendorContract[]
    side_effects: []

  # --- BiometricPolicy ---
  - method: POST
    path: "/policies"
    description: "Draft a written biometric policy version with its retention schedule and destruction trigger."
    roles: [PrivacyOfficer]
    code: 201
    input: [program_id, version_label, retention_days, destruction_trigger, release_language_included, jurisdiction_scope]
    output: BiometricPolicy
    side_effects: []
  - method: POST
    path: "/policies/{policy_id}/transitions"
    description: "Move a policy between DRAFT and IN_REVIEW (submission and kick-back revision loop) or retire a SUPERSEDED policy."
    roles: [PrivacyOfficer, ComplianceApprover]
    code: 200
    input: [to_status]
    output: BiometricPolicy
    side_effects: ["applies the §1.2 BiometricPolicy transition, stamping submitted_by_user_id on IN_REVIEW and incrementing revision_count on the kick-back to DRAFT", "increments BiometricPolicy.version by 1"]
  - method: POST
    path: "/policies/{policy_id}/publish"
    description: "Publish an IN_REVIEW policy as the program's controlling written policy. Requires expected_program_version (OCC rule policy-publish-stale-program) and a publisher distinct from the submitter."
    roles: [ComplianceApprover]
    code: 200
    input: [expected_program_version]
    output: BiometricPolicy
    side_effects:
      - "applies the IN_REVIEW -> PUBLISHED transition and the full four-hop CASCADE B"
      - "increments `ComplianceProgram.version` by 1"
      - "increments BiometricPolicy.version by 1"
  - method: GET
    path: "/policies/{policy_id}"
    description: "Read one policy version with its status, publication instant and revision count."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator]
    code: 200
    input: []
    output: BiometricPolicy
    side_effects: []
  - method: GET
    path: "/policies"
    description: "List policy versions, filterable by program and status."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: BiometricPolicy[]
    side_effects: []

  # --- NoticePacket ---
  - method: POST
    path: "/notice-packets"
    description: "Draft an employee or customer notice packet for a jurisdiction, reproducing a policy version, with its locale set, accommodation channel and effective window."
    roles: [PrivacyOfficer]
    code: 201
    input: [program_id, jurisdiction_id, policy_id, audience, locales, accommodation_channel, effective_from, "effective_to?"]
    output: NoticePacket
    side_effects: []
  - method: POST
    path: "/notice-packets/{notice_id}/transitions"
    description: "Publish or withdraw a notice packet. Publication enforces the half-open window overlap rule and stamps consent_eligible_from from the jurisdiction's notice lead days."
    roles: [PrivacyOfficer]
    code: 200
    input: [to_status]
    output: NoticePacket
    side_effects: ["applies the §1.2 NoticePacket transition, stamping published_at and consent_eligible_from on PUBLISHED", "increments NoticePacket.version by 1"]
  - method: GET
    path: "/notice-packets/{notice_id}"
    description: "Read one notice packet with its published window and consent_eligible_from."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator]
    code: 200
    input: []
    output: NoticePacket
    side_effects: []
  - method: GET
    path: "/notice-packets"
    description: "List notice packets, filterable by program, jurisdiction, source policy, audience and status."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator]
    code: 200
    input: ["program_id?", "jurisdiction_id?", "policy_id?", "audience?", "status?", "limit?", "offset?"]
    output: NoticePacket[]
    side_effects: []

  # --- BiometricAsset ---
  - method: POST
    path: "/biometric-assets"
    description: "Inventory a biometric collection point (timekeeping, access control, security camera or customer-facing) in DISCOVERED status."
    roles: [PrivacyOfficer]
    code: 201
    input: [program_id, jurisdiction_id, system_category, modality, subject_class, template_storage_location, declared_retention_days, retention_basis, "vendor_id?"]
    output: BiometricAsset
    side_effects: ["recomputes ComplianceProgram.inventory_completeness_pct via calculations.inventory_completeness_pct", "increments ComplianceProgram.version by 1"]
  - method: PATCH
    path: "/biometric-assets/{asset_id}"
    description: "Update inventory attributes of an asset that is not DECOMMISSIONED, including reporting that the collection purpose has been satisfied."
    roles: [PrivacyOfficer]
    code: 200
    input: ["purpose_satisfied_at?", "declared_retention_days?", "retention_basis?", "template_storage_location?"]
    output: BiometricAsset
    side_effects: ["recomputes destruction_due_at via calculations.effective_retention_and_destruction when the asset has a pinned policy and a collection_started_at", "recomputes ComplianceProgram.inventory_completeness_pct", "increments BiometricAsset.version by 1"]
  - method: POST
    path: "/biometric-assets/{asset_id}/transitions"
    description: "Drive the asset lifecycle: CLASSIFIED, ACTIVE (pins the published policy and starts the retention clock), GATED, DECOMMISSIONED."
    roles: [PrivacyOfficer]
    code: 200
    input: [to_status]
    output: BiometricAsset
    side_effects: ["applies the §1.2 BiometricAsset transition and all its declared side effects", "recomputes calculations.program_posture and calculations.inventory_completeness_pct", "increments BiometricAsset.version by 1"]
  - method: GET
    path: "/biometric-assets/{asset_id}"
    description: "Read one collection point with its pinned policy, retention horizon and consent counters."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager, HRAdministrator]
    code: 200
    input: []
    output: BiometricAsset
    side_effects: []
  - method: GET
    path: "/biometric-assets"
    description: "List collection points, filterable by program, jurisdiction, operating vendor, pinned policy and status. This is the discovery channel for assets gated by CASCADE A and CASCADE B."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager, HRAdministrator]
    code: 200
    input: ["program_id?", "jurisdiction_id?", "vendor_id?", "pinned_policy_id?", "status?", "limit?", "offset?"]
    output: BiometricAsset[]
    side_effects: []

  # --- DataSubject ---
  - method: POST
    path: "/data-subjects"
    description: "Register an employee or customer as a data subject of the program."
    roles: [HRAdministrator]
    code: 201
    input: [program_id, jurisdiction_id, subject_type, external_ref, preferred_locale, "accommodation_needed?"]
    output: DataSubject
    side_effects: ["initializes enrollment_status to NOT_ENROLLED"]
  - method: GET
    path: "/data-subjects/{subject_id}"
    description: "Read one data subject with derived enrollment_status and active accommodation count."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator, Subject]
    code: 200
    input: []
    output: DataSubject
    side_effects: []
  - method: GET
    path: "/data-subjects"
    description: "List data subjects, filterable by program, jurisdiction and enrollment status."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator]
    code: 200
    input: ["program_id?", "jurisdiction_id?", "enrollment_status?", "limit?", "offset?"]
    output: DataSubject[]
    side_effects: []

  # --- ConsentRecord ---
  - method: POST
    path: "/consent-records"
    description: "Solicit informed written consent from a data subject for a specific collection point, before collection begins. Pins the asset's currently pinned policy onto the record and enforces the notice lead time."
    roles: [HRAdministrator]
    code: 201
    input: [data_subject_id, asset_id, locale, "written_release_acknowledged?", "signature_ref?"]
    output: ConsentRecord
    side_effects: ["copies BiometricAsset.pinned_policy_id into ConsentRecord.pinned_policy_id", "sets solicitation_round to 1", "recomputes BiometricAsset.consent_gap_count and ComplianceProgram.consent_gap_count", "recomputes calculations.program_posture"]
  - method: POST
    path: "/consent-records/{consent_id}/transitions"
    description: "Drive the consent lifecycle: GRANTED, DECLINED (spawns an accommodation), REVOKED (spawns an accommodation), RESOLICIT_REQUIRED, SOLICITED (re-solicitation round)."
    roles: [HRAdministrator, PrivacyOfficer, Subject]
    code: 200
    input: [to_status, "written_release_acknowledged?", "signature_ref?", "decline_reason?", "revocation_reason?"]
    output: ConsentRecord
    side_effects: ["applies the §1.2 ConsentRecord transition and all its declared side effects, including auto-created AlternativeAccommodation rows and the compensating ENDED on a later grant", "recomputes BiometricAsset.enrolled_subject_count, BiometricAsset.consent_gap_count, DataSubject.enrollment_status and calculations.program_posture", "increments ConsentRecord.version by 1"]
  - method: GET
    path: "/consent-records/{consent_id}"
    description: "Read one consent record with its pinned policy, signature and retention dates."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator, Subject]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/consent-records"
    description: "List consent records, filterable by subject, asset, pinned policy and status. This is the discovery channel for consents mutated by CASCADE A hop 3 and CASCADE B hop 2."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator]
    code: 200
    input: ["data_subject_id?", "asset_id?", "pinned_policy_id?", "status?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []

  # --- AlternativeAccommodation ---
  - method: POST
    path: "/accommodations"
    description: "Request a non-biometric alternative process for a subject who does not consent. Enforces the 24-hour-buffered closed-interval conflict rule against the subject's other accommodations."
    roles: [HRAdministrator]
    code: 201
    input: [data_subject_id, asset_id, method, starts_at, ends_at]
    output: AlternativeAccommodation
    side_effects: ["sets origin to MANUAL and status to REQUESTED", "sets sla_due_at to the current logical clock + ACCOMMODATION_SLA_DAYS"]
  - method: POST
    path: "/accommodations/{accommodation_id}/transitions"
    description: "Drive the accommodation lifecycle: PROVISIONED (records SLA breach), ACTIVE, ENDED."
    roles: [HRAdministrator]
    code: 200
    input: [to_status]
    output: AlternativeAccommodation
    side_effects: ["applies the §1.2 AlternativeAccommodation transition", "recomputes DataSubject.active_accommodation_count and DataSubject.enrollment_status", "increments AlternativeAccommodation.version by 1"]
  - method: GET
    path: "/accommodations/{accommodation_id}"
    description: "Read one alternative accommodation with its window, SLA state and origin."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator, Subject]
    code: 200
    input: []
    output: AlternativeAccommodation
    side_effects: []
  - method: GET
    path: "/accommodations"
    description: "List alternative accommodations, filterable by subject, asset, originating consent and status. This is the discovery channel for accommodations auto-created by the decline, revoke and CASCADE A hop 4 expiry paths."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, HRAdministrator]
    code: 200
    input: ["data_subject_id?", "asset_id?", "created_from_consent_id?", "status?", "origin?", "limit?", "offset?"]
    output: AlternativeAccommodation[]
    side_effects: []

  # --- IncidentCase ---
  - method: POST
    path: "/incidents"
    description: "Open a biometric data exposure case; discovered_at is stamped from the logical clock and starts the heightened notification clock."
    roles: [PrivacyOfficer]
    code: 201
    input: [program_id, affected_asset_ids, exposure_vector, description, exposed_subject_count, translation_locale_count]
    output: IncidentCase
    side_effects: ["stamps discovered_at from the current logical clock", "initializes containment_status to DETECTED and notification_status to PENDING"]
  - method: POST
    path: "/incidents/{incident_id}/containment-transitions"
    description: "Advance the containment dimension: DETECTED -> CONTAINED -> REMEDIATED. REMEDIATED is guarded by the notification dimension."
    roles: [PrivacyOfficer]
    code: 200
    input: [to_status, "containment_note?"]
    output: IncidentCase
    side_effects: ["applies the §1.2 IncidentCase containment transition", "recomputes calculations.program_posture on REMEDIATED", "increments IncidentCase.version by 1"]
  - method: POST
    path: "/incidents/{incident_id}/notification-transitions"
    description: "Advance the notification dimension: PENDING -> ASSESSED (runs the tier, deadline and cost calculation), ASSESSED -> NOTIFIED, or ASSESSED -> EXEMPT (TIER_2 only, ComplianceApprover)."
    roles: [PrivacyOfficer, ComplianceApprover]
    code: 200
    input: [to_status, "notified_subject_count?", "exemption_basis?"]
    output: IncidentCase
    side_effects: ["applies the §1.2 IncidentCase notification transition, running calculations.incident_notification_deadline_and_cost on ASSESSED", "increments IncidentCase.version by 1"]
  - method: GET
    path: "/incidents/{incident_id}"
    description: "Read one incident case with its tier, deadline, cost breakdown and both state dimensions."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager]
    code: 200
    input: []
    output: IncidentCase
    side_effects: []
  - method: GET
    path: "/incidents"
    description: "List incident cases, filterable by program and either state dimension."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover, VendorManager]
    code: 200
    input: ["program_id?", "containment_status?", "notification_status?", "limit?", "offset?"]
    output: IncidentCase[]
    side_effects: []

  # --- ExposureAssessment ---
  - method: POST
    path: "/exposure-assessments"
    description: "Draft a private-right-of-action exposure estimate for one jurisdiction under one damages theory. Requires expected_jurisdiction_version (OCC rule exposure-assessment-create-stale-jurisdiction)."
    roles: [PrivacyOfficer]
    code: 201
    input: [program_id, jurisdiction_id, variant, expected_jurisdiction_version, "incident_id?"]
    output: ExposureAssessment
    side_effects: ["stores created_by_user_id from the acting X-User-ID", "computes negligent_unit_count, reckless_unit_count, base_cents, notice_gap_multiplier, cure_credit_pct and exposure_cents via calculations.pra_exposure_estimate", "increments `Jurisdiction.version` by 1"]
  - method: POST
    path: "/exposure-assessments/{assessment_id}/transitions"
    description: "Finalize a DRAFT assessment into the program's carried exposure (ComplianceApprover, segregation of duties against the drafter) or void an assessment, compensating the program ledger."
    roles: [ComplianceApprover, PrivacyOfficer]
    code: 200
    input: [to_status, "void_reason?"]
    output: ExposureAssessment
    side_effects: ["applies the §1.2 ExposureAssessment transition, adding or subtracting exposure_cents on ComplianceProgram.pra_exposure_cents", "recomputes calculations.program_posture", "increments ComplianceProgram.version by 1", "increments ExposureAssessment.version by 1"]
  - method: GET
    path: "/exposure-assessments/{assessment_id}"
    description: "Read one exposure assessment with its unit counts, multipliers and exposure figure."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover]
    code: 200
    input: []
    output: ExposureAssessment
    side_effects: []
  - method: GET
    path: "/exposure-assessments"
    description: "List exposure assessments, filterable by program, jurisdiction, source incident and status."
    roles: [SystemOperator, PrivacyOfficer, ComplianceApprover]
    code: 200
    input: ["program_id?", "jurisdiction_id?", "incident_id?", "status?", "limit?", "offset?"]
    output: ExposureAssessment[]
    side_effects: []

  # --- test-driving surface ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window, retention horizon and sweep reads. The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["moves the logical clock; no entity is mutated and no version is incremented — deadline effects materialize only when a subsequent request or destruction sweep reads the clock"]

roles:
  - name: SystemOperator
    description: "Platform operator who provisions programs and jurisdictional profiles and runs the scheduled destruction sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /jurisdictions"
      - "PATCH /jurisdictions/{jurisdiction_id}"
      - "POST /programs/{program_id}/destruction-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /programs/{program_id}"
      - "all GET list and single-resource reads except GET /data-subjects/{subject_id} restricted rows"
  - name: PrivacyOfficer
    description: "Owns the biometric inventory, the written policy drafting loop, notice packets, incident response and exposure drafting. Cannot publish a policy it submitted, nor finalize an assessment it drafted."
    identity: "opaque"
    exclusive_operations:
      - "POST /policies"
      - "POST /biometric-assets"
      - "PATCH /biometric-assets/{asset_id}"
      - "POST /biometric-assets/{asset_id}/transitions"
      - "POST /notice-packets"
      - "POST /notice-packets/{notice_id}/transitions"
      - "POST /incidents"
      - "POST /incidents/{incident_id}/containment-transitions"
      - "POST /exposure-assessments"
    shared_operations:
      - "POST /policies/{policy_id}/transitions (to_status IN {IN_REVIEW, RETIRED})"
      - "POST /consent-records/{consent_id}/transitions (to_status == RESOLICIT_REQUIRED)"
      - "POST /incidents/{incident_id}/notification-transitions (to_status IN {ASSESSED, NOTIFIED})"
      - "POST /exposure-assessments/{assessment_id}/transitions (to_status == VOID from DRAFT)"
      - "read endpoints"
  - name: ComplianceApprover
    description: "Independent approver who publishes policies, approves vendor contracts, grants notification exemptions and finalizes exposure assessments. Every approval is checked against the acting user id of the preceding step."
    identity: "opaque"
    exclusive_operations:
      - "POST /policies/{policy_id}/publish"
      - "POST /policies/{policy_id}/transitions (to_status == DRAFT kick-back)"
      - "POST /vendor-contracts/{contract_id}/transitions (to_status == APPROVED)"
      - "POST /incidents/{incident_id}/notification-transitions (to_status == EXEMPT)"
      - "POST /exposure-assessments/{assessment_id}/transitions (to_status == FINAL)"
    shared_operations:
      - "POST /exposure-assessments/{assessment_id}/transitions (to_status == VOID)"
      - "read endpoints"
  - name: VendorManager
    description: "Manages processors, their attestations and the contract lifecycle from execution through termination and close-out. Cannot approve a contract it drafted."
    identity: "opaque"
    exclusive_operations:
      - "POST /vendors"
      - "POST /vendors/{vendor_id}/attestations"
      - "POST /vendor-contracts"
      - "POST /vendor-contracts/{contract_id}/transitions (to_status IN {EXECUTED, TERMINATED, CLOSED_OUT, VOID})"
    shared_operations:
      - "GET /vendors, GET /vendors/{vendor_id}, GET /vendor-contracts, GET /vendor-contracts/{contract_id}, GET /biometric-assets, GET /incidents"
  - name: HRAdministrator
    description: "Front-line administrator who registers data subjects, solicits and records consent, and provisions alternative processes."
    identity: "opaque"
    exclusive_operations:
      - "POST /data-subjects"
      - "POST /consent-records"
      - "POST /accommodations"
      - "POST /accommodations/{accommodation_id}/transitions"
    shared_operations:
      - "POST /consent-records/{consent_id}/transitions (to_status IN {GRANTED, DECLINED, REVOKED, SOLICITED})"
      - "read endpoints for subjects, consents, accommodations, assets, policies and notices"
  - name: Subject
    description: "The data subject acting on their own record: may read their own consent, accommodation and profile rows and may revoke their own granted consent."
    identity: "entity_backed:DataSubject"
    exclusive_operations: []
    shared_operations:
      - "POST /consent-records/{consent_id}/transitions (to_status == REVOKED, own record only)"
      - "GET /data-subjects/{subject_id} (own record only)"
      - "GET /consent-records/{consent_id} (own record only)"
      - "GET /accommodations/{accommodation_id} (own record only)"
