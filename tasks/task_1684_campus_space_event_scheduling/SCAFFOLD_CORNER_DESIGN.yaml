            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "N1", expected_attendance: 5, start_at: "2026-09-10T08:00:00Z", end_at: "2026-09-10T09:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e1: $.data.id } }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v2: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "N2", expected_attendance: 5, start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-10T10:00:00Z", expected_room_version: "${room_v2}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { e2: $.data.id } }
            - { call: "POST /campus/event-reservations/${e1}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e2}/approve", payload: {}, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/event-reservations/${e1}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/event-reservations/${e2}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T12:00:00Z" }, as: Scheduler }
            - { call: "POST /campus/ops/daily-close", payload: {}, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: Scheduler }
            - { call: "GET /campus/rooms/${room_id}", payload: {}, as: Scheduler, captures: { room_v3: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "New", expected_attendance: 5, start_at: "2026-09-21T14:00:00Z", end_at: "2026-09-21T15:00:00Z", expected_room_version: "${room_v3}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id", inv_total: "$.data[0].total_cents" } }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
            - { call: "POST /campus/invoices/${inv_id}/pay", payload: { amount_cents: 1000 }, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          assert:
            - "Organization.${org_id}.standing == PROBATION and no_show_count == 2"
            - "${err} == ERR_PREPAYMENT_REQUIRED (http 402) and ${inv_total} == 1000"
            - "after paying exactly 1000: Invoice.${inv_id}.status == PAID and EventReservation.${ev_id}.status == CONFIRMED"

      - name: cancel_confirmed_with_issued_grant_blocked_until_returned
        claim_type: cross_entity_validation
        grounds: ["errors[ERR_ACCESS_GRANTS_OUTSTANDING]", state_machines.EventReservation.CONFIRMED_to_CANCELLED]
        distinguishing_aspect: "A CONFIRMED event with an ISSUED key cannot be cancelled (ERR_ACCESS_GRANTS_OUTSTANDING); after the key is returned the same cancel succeeds and, at >=72h notice, voids the invoice with fee 0."
        test_recipe:
          setup: ["CONFIRMED event 2026-09-16 14:00-15:00 (INTERNAL); key grant ISSUED; clock still 2026-08-01 (notice > 72h)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept S", org_type: "INTERNAL_DEPARTMENT", contact_email: "s@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "GRB-1", building_code: "GRB", capacity: 30, key_count: 1, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-16T14:00:00Z", end_at: "2026-09-16T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/confirm", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
            - { call: "POST /campus/access-grants", payload: { event_id: "${ev_id}", grant_type: "PHYSICAL_KEY" }, as: FacilitiesManager, captures: { grant_id: $.data.id } }
            - { call: "POST /campus/access-grants/${grant_id}/issue", payload: {}, as: FacilitiesManager }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { inv_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /campus/event-reservations/${ev_id}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org_id}", captures: { err: $.data.error_id } }
            - { call: "POST /campus/access-grants/${grant_id}/return", payload: {}, as: FacilitiesManager }
            - { call: "POST /campus/event-reservations/${ev_id}/cancel", payload: {}, as: OrgRequester, as_user_id: "${org_id}" }
          assert:
            - "${err} == ERR_ACCESS_GRANTS_OUTSTANDING (http 409); event stayed CONFIRMED"
            - "after return: EventReservation.${ev_id}.status == CANCELLED and cancellation_fee_cents == 0 (>=72h notice)"
            - "Invoice.${inv_id}.status == VOIDED"
            - "AccessGrant.${grant_id}.status == RETURNED and deposit_forfeit_cents == 0 (on-time)"

      - name: schedule_crew_category_mismatch_rejected
        claim_type: violation_to_error
