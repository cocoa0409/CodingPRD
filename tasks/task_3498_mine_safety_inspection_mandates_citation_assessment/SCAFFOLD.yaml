    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "status FILE_REVIEWED -> IN_PROGRESS; actual_entry_at = now"
      - "If kind == ACCIDENT_INVESTIGATION: linked Accident REPORTED -> UNDER_INVESTIGATION"
  - method: POST
    path: "/msha/inspections/{inspectionId}/complete"
    description: "Complete an inspection; REGULAR completions run quota crediting and require all required plan types APPROVED"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "status IN_PROGRESS -> COMPLETED; completed_at = now"
      - "If kind == REGULAR: inspection_quota_crediting credits exactly one cycle"
  - method: POST
    path: "/msha/inspections/{inspectionId}/reassign"
    description: "Reassign to a different inspector before entry; resets the file review"
    roles: [DistrictManager]
    code: 200
    input: [new_inspector_id]
    output: Inspection
    side_effects: ["status -> ASSIGNED (self-loop from ASSIGNED; FILE_REVIEWED -> ASSIGNED)", "inspector_id = new_inspector_id", "file_reviewed_at = null"]
  - method: POST
    path: "/msha/inspections/{inspectionId}/cancel"
    description: "Cancel an inspection that has not started; releases the planned window"
    roles: [DistrictManager]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> CANCELLED from ASSIGNED | FILE_REVIEWED | SUSPENDED"]

  # --- Citation ---
  - method: POST
    path: "/msha/citations"
    description: "Issue a citation or order during an IN_PROGRESS inspection; auto-creates the PenaltyAssessment (proposed variant); S&S issuance at a POV_FINAL mine auto-creates an ImminentDangerOrder"
    roles: [Inspector]
    code: 201
    input: [inspection_id, mine_id, standard_code, kind, negligence, gravity_likelihood, gravity_severity, persons_affected, significant_and_substantial, repeat_violation]
    output: Citation
    side_effects:
      - "Requires inspection status == IN_PROGRESS, inspection.mine_id == mine_id, X-User-ID == inspection.inspector_id"
      - "issued_at = now; abatement_base_days and abatement_deadline computed"
      - "Creates PenaltyAssessment PROPOSED with points_total and proposed_penalty_cents (penalty_points + penalty_dollar_pipeline proposed variant)"
      - "If mine.pov_status == POV_FINAL and significant_and_substantial: auto-create ImminentDangerOrder (inspection_id = this inspection, issued_by = this inspector), then mine.production_status -> HALTED (Mine.version += 1), then every IN_PROGRESS Inspection at the mine -> SUSPENDED"
  - method: GET
    path: "/msha/citations/{citationId}"
    description: "Get a citation"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: GET
    path: "/msha/citations"
    description: "List/filter citations (FK reverse reachability for mine_id, inspection_id, issued_by_inspector_id, verified_by_inspector_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["mine_id?", "inspection_id?", "issued_by_inspector_id?", "verified_by_inspector_id?", "abatement_status?", "contest_status?", "significant_and_substantial?", "limit?", "offset?"]
    output: "Citation[]"
    side_effects: []
  - method: POST
    path: "/msha/citations/{citationId}/abate"
    description: "Operator reports the violation abated; late abatement is accepted but forfeits good faith"
    roles: [OperatorRep]
    code: 200
    input: [abatement_note]
    output: Citation
    side_effects: ["abatement_status OPEN -> ABATED", "abated_at = now", "Citation.version += 1"]
  - method: POST
    path: "/msha/citations/{citationId}/verify-abatement"
    description: "Inspector verifies abatement; the verifying inspector must differ from the issuing inspector"
    roles: [Inspector]
    code: 200
    input: [verification_note]
    output: Citation
    side_effects: ["abatement_status ABATED -> VERIFIED", "verified_at = now", "verified_by_inspector_id = X-User-ID", "Citation.version += 1"]
  - method: POST
    path: "/msha/citations/{citationId}/extend-abatement"
    description: "Operator requests the single permitted abatement extension before the current deadline"
    roles: [OperatorRep]
    code: 200
    input: [justification]
    output: Citation
    side_effects: ["abatement_deadline += ceil(abatement_base_days / 2)", "abatement_extended = true", "Citation.version += 1"]

  # --- ImminentDangerOrder ---
  - method: POST
    path: "/msha/imminent-danger-orders"
    description: "Issue an imminent-danger withdrawal order; requires mine ACTIVE, no other non-TERMINATED order at the mine, and issuance strictly after any prior order's terminated_at (closed-interval occupation)"
    roles: [Inspector]
    code: 201
    input: [mine_id, hazard_description, "inspection_id?"]
    output: ImminentDangerOrder
    side_effects:
      - "status=ISSUED; issued_at = now; issued_by_inspector_id = X-User-ID"
      - "If inspection_id provided: inspection must be IN_PROGRESS at this mine and inspection.inspector_id == X-User-ID"
      - "mine.production_status -> HALTED (Mine.version += 1)"
      - "Every IN_PROGRESS Inspection at the mine -> SUSPENDED (each Inspection.version += 1)"
  - method: GET
    path: "/msha/imminent-danger-orders/{orderId}"
    description: "Get an imminent-danger order"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: []
    output: ImminentDangerOrder
    side_effects: []
  - method: GET
    path: "/msha/imminent-danger-orders"
    description: "List/filter imminent-danger orders (FK reverse reachability for mine_id, inspection_id, issued_by_inspector_id, verified_by_inspector_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["mine_id?", "inspection_id?", "issued_by_inspector_id?", "verified_by_inspector_id?", "status?", "limit?", "offset?"]
    output: "ImminentDangerOrder[]"
    side_effects: []
  - method: POST
    path: "/msha/imminent-danger-orders/{orderId}/confirm-withdrawal"
    description: "Confirm all miners withdrawn from the affected area"
    roles: [Inspector]
    code: 200
    input: [miners_withdrawn_count]
    output: ImminentDangerOrder
    side_effects: ["status ISSUED -> WITHDRAWAL_CONFIRMED", "withdrawal_confirmed_at = now"]
  - method: POST
    path: "/msha/imminent-danger-orders/{orderId}/verify-abatement"
    description: "Verify the hazard is abated; verifier must differ from the issuing inspector"
    roles: [Inspector]
    code: 200
    input: [abatement_note]
    output: ImminentDangerOrder
    side_effects: ["status WITHDRAWAL_CONFIRMED -> ABATEMENT_VERIFIED", "abatement_verified_at = now", "verified_by_inspector_id = X-User-ID"]
  - method: POST
    path: "/msha/imminent-danger-orders/{orderId}/terminate"
    description: "Terminate the order; reopens the mine when no other active order remains"
    roles: [DistrictManager]
    code: 200
    input: []
    output: ImminentDangerOrder
    side_effects:
      - "status ABATEMENT_VERIFIED -> TERMINATED; terminated_at = now"
      - "If no other non-TERMINATED order remains at the mine: mine.production_status -> NORMAL (Mine.version += 1) and every SUSPENDED Inspection at the mine -> IN_PROGRESS"

  # --- PenaltyAssessment ---
  - method: GET
    path: "/msha/citations/{id}/penalty-assessments"
    description: "List the penalty assessment of a citation (0 or 1 element; FK reverse reachability for PenaltyAssessment.citation_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["limit?", "offset?"]
    output: "PenaltyAssessment[]"
    side_effects: []
  - method: POST
    path: "/msha/penalty-assessments/{assessmentId}/finalize"
    description: "Finalize an uncontested assessment after the 30-day contest window has lapsed"
    roles: [MSHAAdmin]
    code: 200
    input: []
    output: PenaltyAssessment
    side_effects: ["status PROPOSED -> FINAL", "final_penalty_cents = penalty_dollar_pipeline final variant"]

  # --- Contest ---
  - method: POST
    path: "/msha/contests"
    description: "Operator contests a citation before the review commission; OCC-checked against the citation's current version"
    roles: [OperatorRep]
    code: 201
    input: [citation_id, expected_citation_version, grounds]
    output: Contest
    side_effects:
      - "Citation contest axis UNCONTESTED -> CONTESTED (Citation.version += 1)"
      - "Linked PenaltyAssessment PROPOSED -> CONTESTED"
  - method: GET
    path: "/msha/contests/{contestId}"
    description: "Get a contest"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: []
    output: Contest
    side_effects: []
  - method: GET
    path: "/msha/contests"
    description: "List/filter contests (FK reverse reachability for citation_id and filed_by_operator_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["citation_id?", "filed_by_operator_id?", "status?", "limit?", "offset?"]
    output: "Contest[]"
    side_effects: []
  - method: POST
    path: "/msha/contests/{contestId}/docket"
    description: "Docket a filed contest for hearing"
    roles: [CommissionJudge]
    code: 200
    input: []
    output: Contest
    side_effects: ["status FILED -> DOCKETED"]
  - method: POST
    path: "/msha/contests/{contestId}/decide"
    description: "Issue the commission's decision; applies the outcome to the citation and penalty assessment"
    roles: [CommissionJudge]
    code: 200
    input: [outcome, "modified_penalty_cents?"]
    output: Contest
    side_effects:
      - "status DOCKETED -> DECIDED; decided_at = now"
      - "AFFIRMED: citation contest axis -> AFFIRMED; assessment FINAL with final variant pipeline"
      - "MODIFIED: citation contest axis -> MODIFIED; assessment FINAL with final = max(modified_penalty_cents, floor), good-faith not applied"
      - "VACATED: citation contest axis -> VACATED; assessment FINAL with final = 0; citation excluded from POV and history windows from decided_at onward"
  - method: POST
    path: "/msha/contests/{contestId}/withdraw"
    description: "Operator withdraws its contest; restores the pre-contest posture"
    roles: [OperatorRep]
    code: 200
    input: []
    output: Contest
    side_effects:
      - "status FILED|DOCKETED -> WITHDRAWN"
      - "Citation contest axis CONTESTED -> UNCONTESTED (Citation.version += 1); assessment CONTESTED -> PROPOSED"

  # --- MinePlan ---
  - method: POST
    path: "/msha/mines/{mineId}/mine-plans"
    description: "Operator submits a plan (or next revision) for ventilation, roof control, or emergency response"
    roles: [OperatorRep]
    code: 201
    input: [plan_type, document_ref]
    output: MinePlan
    side_effects: ["status=SUBMITTED", "revision_no = 1 + max revision of same (mine_id, plan_type)", "submitted_at = now"]
  - method: GET
    path: "/msha/mine-plans/{planId}"
    description: "Get a mine plan"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: []
    output: MinePlan
    side_effects: []
  - method: GET
    path: "/msha/mine-plans"
    description: "List/filter mine plans (FK reverse reachability for mine_id and supersedes_plan_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["mine_id?", "supersedes_plan_id?", "plan_type?", "status?", "limit?", "offset?"]
    output: "MinePlan[]"
    side_effects: []
  - method: POST
    path: "/msha/mine-plans/{planId}/approve"
    description: "Approve a plan; supersedes the currently APPROVED plan of the same (mine_id, plan_type); OCC-checked against the mine's version"
    roles: [DistrictManager]
    code: 200
    input: [expected_mine_version]
    output: MinePlan
    side_effects:
      - "status SUBMITTED -> APPROVED; approved_at = now; next_revision_due_at = now + 180 days"
      - "Prior APPROVED plan of same (mine_id, plan_type) -> SUPERSEDED; supersedes_plan_id set"
      - "Mine.version += 1"
  - method: POST
    path: "/msha/mine-plans/{planId}/reject"
    description: "Reject a plan with a stated reason"
    roles: [DistrictManager]
    code: 200
    input: [rejection_reason]
    output: MinePlan
    side_effects: ["status SUBMITTED -> REJECTED"]

  # --- Accident ---
  - method: POST
    path: "/msha/accidents"
    description: "Operator reports an accident; late reports auto-issue a fixed-factor citation"
    roles: [OperatorRep]
    code: 201
    input: [mine_id, occurred_at, severity, description]
    output: Accident
    side_effects:
      - "Requires mine.status == ACTIVE (ERR_MINE_NOT_ACTIVE)"
      - "reported_at = now; late_report computed (strict > 900s for FATAL, > 7200s otherwise)"
      - "If late_report: system issues a Citation (system_issued=true, fixed factors MODERATE/UNLIKELY/NO_INJURY/1 person/non-S&S/non-repeat, standard_code '50.10 LATE REPORT') with its PenaltyAssessment"
  - method: GET
    path: "/msha/accidents/{accidentId}"
    description: "Get an accident"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: []
    output: Accident
    side_effects: []
  - method: GET
    path: "/msha/accidents"
    description: "List/filter accidents (FK reverse reachability for mine_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["mine_id?", "severity?", "status?", "limit?", "offset?"]
    output: "Accident[]"
    side_effects: []
  - method: POST
    path: "/msha/accidents/{accidentId}/publish-report"
    description: "Publish the public investigation report; requires a COMPLETED ACCIDENT_INVESTIGATION inspection"
    roles: [MSHAAdmin]
    code: 200
    input: [root_cause, report_text]
    output: Accident
    side_effects: ["status UNDER_INVESTIGATION -> REPORT_PUBLISHED", "published_at = now"]
  - method: GET
    path: "/msha/accidents/{accidentId}/public-report"
    description: "Public projection of a published accident report; unpublished accidents answer 404 as if absent"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge, PublicReader]
    code: 200
    input: []
    output: Accident
    side_effects: []

  # --- Pattern of Violations ---
  - method: POST
    path: "/msha/mines/{id}/pov-screenings"
    description: "Run a SCREENING-variant pattern-of-violations evaluation over the trailing 365-day window"
    roles: [MSHAAdmin]
    code: 201
    input: []
    output: POVScreening
    side_effects:
      - "Creates POVScreening with variant=SCREENING; result POTENTIAL_POV iff weighted_score >= 8"
      - "If result POTENTIAL_POV and mine.pov_status == NONE: pov_status -> POTENTIAL_POV (Mine.version += 1)"
      - "If result BELOW_THRESHOLD and mine.pov_status == POTENTIAL_POV: pov_status -> NONE (Mine.version += 1)"
  - method: GET
    path: "/msha/mines/{id}/pov-screenings"
    description: "List screenings of a mine (FK reverse reachability for POVScreening.mine_id)"
    roles: [MSHAAdmin, DistrictManager, Inspector, OperatorRep, CommissionJudge]
    code: 200
    input: ["limit?", "offset?"]
    output: "POVScreening[]"
    side_effects: []
  - method: POST
    path: "/msha/mines/{mineId}/pov-notices"
    description: "Issue a pattern-of-violations notice (FINAL_DETERMINATION variant); escalates the mine to POV_FINAL and adds one required inspection to every OPEN cycle"
    roles: [DistrictManager]
    code: 201
    input: []
    output: POVScreening
    side_effects:
      - "Requires mine.pov_status == POTENTIAL_POV (ERR_POV_NOTICE_REQUIRES_POTENTIAL)"
      - "Creates POVScreening with variant=FINAL_DETERMINATION; requires weighted_score >= 8 (ERR_POV_SCORE_INSUFFICIENT); result=CONFIRMED_POV"
      - "mine.pov_status -> POV_FINAL (Mine.version += 1)"
      - "Every OPEN InspectionCycle of the mine: required_inspections += 1"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, undeclared field present, enum value outside its declared set, or numeric range violated" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve; also the public-report response for an unpublished accident" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_mine_version / expected_citation_version does not match the parent's current version" }
  - { id: ERR_OPERATOR_MISMATCH, http: 403, condition: "OperatorRep X-User-ID is not the operator of the target mine/citation/contest" }
  - { id: ERR_INSPECTOR_MISMATCH, http: 403, condition: "Inspector X-User-ID is not the inspector assigned to the target inspection (or the inspection named on a manual IDO)" }
  - { id: ERR_SOD_VERIFY_SELF, http: 403, condition: "Abatement verifier equals the issuing inspector (citation or imminent-danger order)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state that permits the transition (e.g. complete from ASSIGNED, decide a FILED contest, finalize a CONTESTED assessment)" }
  - { id: ERR_MINE_NOT_ACTIVE, http: 409, condition: "Mine.status != ACTIVE for an operation requiring an operating mine (accident report, IDO issuance)" }
  - { id: ERR_CITATION_NOT_CONTESTABLE, http: 409, condition: "Contest filed against a citation whose contest_status != UNCONTESTED" }
  - { id: ERR_POV_NOTICE_REQUIRES_POTENTIAL, http: 409, condition: "POV notice issued while mine.pov_status != POTENTIAL_POV" }
  - { id: ERR_POV_SCORE_INSUFFICIENT, http: 409, condition: "POV notice whose FINAL_DETERMINATION weighted_score is below the threshold of 8" }
  - { id: ERR_IMMINENT_DANGER_ACTIVE, http: 409, condition: "Inspection start at a mine with a non-TERMINATED imminent-danger order" }
  - { id: ERR_REQUIRED_PLAN_NOT_APPROVED, http: 409, condition: "REGULAR inspection completion without an APPROVED plan for every required plan type (UNDERGROUND: VENTILATION + ROOF_CONTROL + EMERGENCY_RESPONSE; SURFACE: EMERGENCY_RESPONSE)" }
  - { id: ERR_ACCIDENT_INVESTIGATION_INCOMPLETE, http: 409, condition: "publish-report without a COMPLETED ACCIDENT_INVESTIGATION inspection for the accident" }
  - { id: ERR_INSPECTOR_CONFLICT, http: 409, condition: "Inspector's conflicted_operator_ids contains the mine's operator_id (assignment or reassignment)" }
  - { id: ERR_INSPECTOR_NOT_CERTIFIED, http: 409, condition: "Inspector certification does not cover the mine's mine_type" }
  - { id: ERR_INSPECTOR_DOUBLE_BOOKED, http: 409, condition: "Planned window overlaps another occupied window of the same inspector; half-open semantics: [start, end) touching at exactly one endpoint is NOT an overlap; occupied statuses are ASSIGNED, FILE_REVIEWED, IN_PROGRESS, SUSPENDED" }
  - { id: ERR_INSPECTOR_ENGAGED, http: 409, condition: "Inspector already holds another IN_PROGRESS inspection (capacity 1) at start time" }
  - { id: ERR_PLAN_TYPE_NOT_REQUIRED, http: 409, condition: "VENTILATION or ROOF_CONTROL plan submitted for a SURFACE mine" }
  - { id: ERR_ABATEMENT_EXTENSION_EXHAUSTED, http: 409, condition: "Second extend-abatement on the same citation, or extension on a citation not in abatement_status OPEN" }
  - { id: ERR_IDO_ACTIVE_EXISTS, http: 409, condition: "A non-TERMINATED imminent-danger order already exists at the mine, or the new issued_at is not strictly after a prior order's terminated_at (closed-interval occupation)" }
  - { id: ERR_CYCLE_OPEN_EXISTS, http: 409, condition: "Creating a cycle while another cycle of the mine is still OPEN" }
  - { id: ERR_CYCLE_PERIOD_INVALID, http: 422, condition: "Cycle window not exactly 90 days (UNDERGROUND) / 180 days (SURFACE) inclusive, first cycle not starting at activation_date, or period_start != prior period_end + 1 day" }
  - { id: ERR_CYCLE_CLOSE_TOO_EARLY, http: 409, condition: "Closing an unmet cycle on or before period_end (requirement must be met for early close; after period_end any result closes)" }
  - { id: ERR_CONTEST_WINDOW_LAPSED, http: 422, condition: "Contest filed later than citation.issued_at + 30 days (boundary: exactly +30 days is timely)" }
  - { id: ERR_ABATEMENT_WINDOW_PASSED, http: 409, condition: "extend-abatement requested at or after the current abatement_deadline" }
  - { id: ERR_FINALIZE_WINDOW_ACTIVE, http: 409, condition: "finalize at or before citation.issued_at + 30 days" }
  - { id: ERR_CONTEST_DECISION_INVALID, http: 422, condition: "decide with outcome == MODIFIED but missing/negative modified_penalty_cents, or modified_penalty_cents supplied for a non-MODIFIED outcome" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: MSHAAdmin
    description: "Agency administrator: registers operators/mines/inspectors, opens and closes statutory cycles, runs POV screenings, finalizes uncontested assessments, publishes accident reports, and drives the test clock. Reads are unscoped."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /msha/operators; POST /msha/mines; POST /msha/inspectors"
      - "POST /msha/mines/{id}/idle; POST /msha/mines/{id}/reactivate"
      - "POST /msha/mines/{id}/inspection-cycles; POST /msha/inspection-cycles/{id}/close"
      - "POST /msha/penalty-assessments/{id}/finalize"
      - "POST /msha/accidents/{id}/publish-report"
      - "POST /msha/mines/{id}/pov-screenings"
    shared_operations:
      - "All GET endpoints (business surface)"

  - name: DistrictManager
    description: "District manager: assigns and reassigns inspections, terminates imminent-danger orders, approves/rejects mine plans, issues POV notices. Cannot issue citations or decide contests (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /msha/inspections; POST /msha/inspections/{id}/reassign; POST /msha/inspections/{id}/cancel"
      - "POST /msha/imminent-danger-orders/{id}/terminate"
      - "POST /msha/mine-plans/{id}/approve; POST /msha/mine-plans/{id}/reject"
      - "POST /msha/mines/{id}/pov-notices"
    shared_operations:
      - "All GET endpoints (business surface)"

  - name: Inspector
    description: "Field inspector: conducts assigned inspections (file review, entry, completion), issues citations and imminent-danger orders, verifies abatement of citations/orders issued by OTHER inspectors."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /msha/inspections/{id}/file-review; POST /msha/inspections/{id}/start; POST /msha/inspections/{id}/complete"
      - "POST /msha/citations"
      - "POST /msha/imminent-danger-orders; POST /msha/imminent-danger-orders/{id}/confirm-withdrawal; POST /msha/imminent-danger-orders/{id}/verify-abatement"
      - "POST /msha/citations/{id}/verify-abatement"
    shared_operations:
      - "All GET endpoints (business surface)"

  - name: OperatorRep
    description: "Operator representative: reports accidents, submits mine plans, reports abatement and requests extension, files and withdraws contests. Ownership-checked: X-User-ID must equal the operator_id of the target mine's operator."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /msha/accidents"
      - "POST /msha/mines/{id}/mine-plans"
      - "POST /msha/citations/{id}/abate; POST /msha/citations/{id}/extend-abatement"
      - "POST /msha/contests; POST /msha/contests/{id}/withdraw"
    shared_operations:
      - "All GET endpoints (business surface)"

  - name: CommissionJudge
    description: "Independent review commission judge: dockets and decides contests. Cannot issue citations, approve plans, or inspect (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /msha/contests/{id}/docket; POST /msha/contests/{id}/decide"
    shared_operations:
      - "All GET endpoints (business surface)"

  - name: PublicReader
    description: "Unauthenticated-equivalent public role: may only read published accident reports. Every other endpoint is ERR_UNAUTHORIZED."
    identity: opaque
    exclusive_operations:
      - "GET /msha/accidents/{id}/public-report"
    shared_operations: []
