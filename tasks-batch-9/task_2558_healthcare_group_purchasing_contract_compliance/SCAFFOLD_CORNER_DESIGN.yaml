            - "${e3} == ERR_CONTRACT_NOT_ACTIVE, ${e4} == ERR_CONTRACT_NOT_ACTIVE, ${e5} == ERR_CONTRACT_NOT_ACTIVE"
            - "Contract.${c1}.status is still SUSPENDED and Contract.${c1}.version == ${cv} — no refusal bumped the version"
