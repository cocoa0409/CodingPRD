  - section: calculations
    instances:
      - name: titration_recommendation_raw_band_pinned
        claim_type: correct_result
        grounds: [calculations.titration_pressure_recommendation]
        distinguishing_aspect: "raw 10.0 sits in the LOW leak band (threshold 24.0): leak 30.0 adds +0.5 and residual AHI 6.0 adds +0.5 -> 11.0. Re-banding after adjustment would (incorrectly) yield 10.5; the pinned order is observable."
        test_recipe:
          setup:
            - "TITRATION_PAP study on a titration-capable bed; acquisition completed with final pressure 10.0 and leak 30.0; PRIMARY task accepted with residual AHI 6.0 (24 events / TST 240)"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-CALC-01", full_name: "Pat Calc", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { p1: $.data.id } }
