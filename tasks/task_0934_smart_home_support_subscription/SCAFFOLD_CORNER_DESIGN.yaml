          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Ver House", region_code: "NWA", billing_email: "ver@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Ver O", email: "vero@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: "$.data.id" }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "HUB-X1", display_name: "Hub X1", device_class: "HUB", serial_prefix: "HBX", base_warranty_months: 24, requires_install: true, manufacturer_service_only: false, msrp_cents: 24900, current_firmware_version: "1.0.0" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
          trigger:
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", serial_number: "HBX000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d_id: "$.data.id", tok: "$.data.activation_token", v1: "$.data.version" }
            - call: "POST /smart-home-support/devices/${d_id}/activate"
              payload: { activation_code: "${tok}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { v2: "$.data.version" }
            - call: "POST /smart-home-support/devices/${d_id}/decommission"
              payload: {}
              as: Owner
              as_user_id: "${own_id}"
              captures: { v3: "$.data.version" }
          assert:
            - "${v1} == 1"
            - "${v2} == 2"
            - "${v3} == 3"
            - "Device.${d_id}.lifecycle_status == DECOMMISSIONED"
            - "Device.${d_id}.updated_at == 2026-05-01T00:00:00.000Z"

