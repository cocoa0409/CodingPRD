              payload: {}
              as: PlatformAdmin
          assert:
            - "Requester.${rid}.abuse_score == 100 (clamped) and status == SUSPENDED"
            - "the unclamped weighted sum (100*1.2 + 3*3.0 + speed term) exceeds 100, confirming the min() clamp fired"

      - name: assignment_half_window_boundary_is_inclusive
        claim_type: Correct Result
        grounds:
          - calculations.assignment_eligible_for_approval
          - errors.ERR_REVIEW_TOO_EARLY
        distinguishing_aspect: "With assignment_duration_minutes 60 the approval gate opens at elapsed 30 minutes exactly — 29 minutes is too early and 30 is approvable, so the comparison is >= not >."
        test_recipe:
