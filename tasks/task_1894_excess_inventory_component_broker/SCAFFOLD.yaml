scenario: "1894. Excess Inventory & Component Broker (independent electronics broker): buy offer & inspection/counterfeit screening, escrow & payment terms on sourced parts, provenance documentation & test report, price volatility & holding risk, customer urgency tiering, return/refund on failed incoming inspection, storage & consignment listing, market-price intelligence"

domain_name: excess-inventory-component-broker
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# All server-stamped timestamps (created_at, updated_at, received_at,
# observed_at) read the logical clock (POST /_clock/set_current_utc), whose
# startup default is 2026-08-01T00:00:00Z. Money is integer cents.
# =============================================================================
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Seller legal name" }
      - { name: contact_email, type: string, source: input, description: "Seller contact email" }
      - { name: payout_terms_days, type: integer, source: input, default: 30, description: "Net payment terms in days (informational)" }
      - { name: account_balance_cents, type: integer, source: computed, default: 0, description: "Unpaid consignment proceeds owed to seller; incremented by SELLER_PAYOUT escrow entries at order settlement" }
      - { name: total_payouts_cents, type: integer, source: computed, default: 0, description: "Lifetime sum of SELLER_PAYOUT escrow entries across all settled orders for lots originating from this seller" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer name" }
      - { name: contact_email, type: string, source: input, description: "Customer contact email" }
      - { name: urgency_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PRIORITY | CRITICAL; drives provisional price premium", constraints: "enum {STANDARD, PRIORITY, CRITICAL}" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open-order exposure allowed", constraints: ">= 0" }
      - { name: open_order_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of required_escrow_cents over this customer's orders with status in {PENDING_ESCROW, ESCROW_FUNDED, FULFILLING, SHIPPED, DELIVERED, REFUND_PENDING}" }

  - name: StorageBin
    parent: null
    common_fields: true
    fields:
      - { name: bin_code, type: string, source: input, description: "Human-readable bin code", constraints: "unique across all bins" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum total component units storable", constraints: "> 0" }
      - { name: occupied_units, type: integer, source: computed, default: 0, description: "Sum of (qty_available + qty_reserved) over all non-DEPLETED lots assigned to this bin" }
      - { name: available_units, type: integer, source: computed, description: "capacity_units - occupied_units" }

  - name: BuyOffer
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; offering seller" }
      - { name: mpn, type: string, source: input, description: "Manufacturer part number" }
      - { name: quantity, type: integer, source: input, description: "Units offered", constraints: "> 0" }
      - { name: ask_price_per_unit_cents, type: integer, source: input, description: "Seller asking price per unit", constraints: "> 0" }
      - { name: provenance_doc_url, type: string, source: input, description: "Provenance documentation URL (may also be supplied at inspection)", default: null }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | ACCEPTED | REJECTED | CANCELLED | UNDER_INSPECTION | INSPECTION_PASSED | INSPECTION_FAILED | CONVERTED | RETURN_PENDING | RETURNED", default: PENDING_REVIEW }
      - { name: agreed_unit_price_cents, type: integer, source: input, description: "Broker-agreed acquisition price per unit, set at accept", default: null }
      - { name: acquisition_mode, type: enum, source: input, description: "BROKER_OWNED | CONSIGNMENT, set at accept", default: null }
      - { name: inspection_result, type: enum, source: system, description: "NONE | PASS | FAIL_COUNTERFEIT | FAIL_DAMAGED | FAIL_DOCUMENTATION", default: NONE }
      - { name: failure_note, type: string, source: input, description: "Inspector note recorded on a FAIL outcome", default: null }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: buy_offer_id, type: string, source: system, description: "FK -> BuyOffer.id; originating accepted offer" }
      - { name: mpn, type: string, source: system, description: "Manufacturer part number, copied from buy offer" }
      - { name: storage_bin_id, type: string, source: input, description: "FK -> StorageBin.id; physical bin assignment" }
      - { name: storage_mode, type: enum, source: system, description: "BROKER_OWNED | CONSIGNMENT, copied from buy offer acquisition_mode" }
      - { name: quantity_received, type: integer, source: system, description: "Units physically received, copied from buy offer quantity" }
      - { name: qty_available, type: integer, source: computed, description: "Units sellable right now" }
      - { name: qty_reserved, type: integer, source: computed, description: "Units reserved by open orders" }
      - { name: qty_sold, type: integer, source: computed, description: "Units settled" }
      - { name: qty_returned, type: integer, source: computed, description: "Units returned post-delivery" }
      - { name: cost_basis_per_unit_cents, type: integer, source: system, description: "Equals buy offer agreed_unit_price_cents" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp when the lot was converted" }
      - { name: is_counterfeit_suspect, type: boolean, source: system, default: false, description: "Set by inspector flag; gates listing activation and order creation" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | LISTED | FULLY_RESERVED | DEPLETED | QUARANTINED (posture-derived except QUARANTINED)" }
      - { name: carrying_value_straight_line_cents, type: integer, source: computed, description: "Straight-line depreciated carrying value (see lot_carrying_value calc)" }
      - { name: carrying_value_market_cents, type: integer, source: computed, description: "Mark-to-market carrying value from latest MarketPriceSnapshot; null when no snapshot exists for mpn" }

  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; consigning seller (must equal originating offer seller)" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; consigned lot" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive (half-open interval [effective_from, effective_to))" }
      - { name: broker_fee_bps, type: integer, source: input, description: "Broker fee in basis points of final_total_cents", constraints: "1..5000" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED | EXPIRED", default: ACTIVE }

  - name: MarketPriceSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: mpn, type: string, source: input, description: "Manufacturer part number observed" }
      - { name: spot_price_cents, type: integer, source: input, description: "Observed market spot price per unit", constraints: "> 0" }
      - { name: source, type: string, source: input, description: "Intelligence source label (e.g. DISTRIBUTOR_FEED, TRADE_DESK)" }
      - { name: observed_at, type: datetime, source: system, description: "Logical-clock timestamp of observation" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; listed lot" }
      - { name: asking_price_per_unit_cents, type: integer, source: input, description: "Advertised per-unit ask", constraints: "> 0" }
      - { name: recommended_price_per_unit_cents, type: integer, source: computed, description: "round_half_up(latest spot x 1.10); null when no snapshot exists for the lot mpn" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | WITHDRAWN | SOLD_OUT", default: DRAFT }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; listing being purchased from" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: "> 0" }
      - { name: urgency_tier_snapshot, type: enum, source: system, description: "Customer urgency_tier captured at creation; later tier changes do not affect this order" }
      - { name: consignment_fee_bps_snapshot, type: integer, source: system, description: "broker_fee_bps of the consignment agreement ACTIVE and current at creation; null for BROKER_OWNED lots" }
      - { name: provisional_unit_price_cents, type: integer, source: computed, description: "Urgency-premium price at creation (provisional variant)" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "provisional_unit_price_cents x quantity" }
      - { name: required_escrow_cents, type: integer, source: computed, description: "Equals provisional_total_cents (100% upfront escrow)" }
      - { name: escrow_funded_cents, type: integer, source: computed, default: 0, description: "Cumulative DEPOSIT escrow entries" }
      - { name: final_unit_price_cents, type: integer, source: computed, description: "Settlement-variant unit price; null until SETTLED" }
      - { name: final_total_cents, type: integer, source: computed, description: "final_unit_price_cents x quantity; null until SETTLED" }
      - { name: customer_refund_cents, type: integer, source: computed, description: "provisional_total_cents - final_total_cents; null until SETTLED" }
      - { name: status, type: enum, source: system, description: "PENDING_ESCROW | ESCROW_FUNDED | FULFILLING | SHIPPED | DELIVERED | SETTLED | CANCELLED | REFUND_PENDING | REFUNDED" }

  - name: EscrowEntry
    parent: null
    common_fields: false
    fields:
      - { name: sales_order_id, type: string, source: system, description: "FK -> SalesOrder.id; owning order" }
      - { name: entry_type, type: enum, source: system, description: "DEPOSIT | CUSTOMER_REFUND | BROKER_FEE | SELLER_PAYOUT | BROKER_REVENUE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: deposits positive; debits negative" }
      - { name: note, type: string, source: system, description: "Human-readable ledger note" }

  - name: ReturnCase
    parent: null
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: input, description: "FK -> SalesOrder.id; order being returned" }
      - { name: reason, type: enum, source: input, description: "COUNTERFEIT_SUSPECTED | DAMAGED | WRONG_PART | FAILED_INCOMING_INSPECTION" }
      - { name: status, type: enum, source: system, description: "OPENED | UNDER_REVIEW | APPROVED | REJECTED | REFUND_ISSUED", default: OPENED }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Set at approve; equals the order's escrow_funded_cents (full escrow refund)" }
      - { name: rejection_note, type: string, source: input, description: "Reviewer note on reject", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BuyOffer
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, CANCELLED, CONVERTED, RETURNED]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /buy-offers/{id}/accept"
        actor: BrokerOps
        preconditions: ["offer.status == PENDING_REVIEW"]
        side_effects: ["sets agreed_unit_price_cents and acquisition_mode from input"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /buy-offers/{id}/reject"
        actor: BrokerOps
        preconditions: ["offer.status == PENDING_REVIEW"]
        side_effects: []
      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: "POST /buy-offers/{id}/cancel"
        actor: Seller
        preconditions: ["offer.status == PENDING_REVIEW", "acting Seller.id == offer.seller_id"]
        side_effects: []
      - from: ACCEPTED
        to: UNDER_INSPECTION
        trigger: "POST /buy-offers/{id}/receive"
        actor: BrokerOps
        preconditions: ["offer.status == ACCEPTED"]
        side_effects: ["parts physically received; offer enters inspection queue"]
      - from: UNDER_INSPECTION
        to: INSPECTION_PASSED
        trigger: "POST /buy-offers/{id}/inspect with outcome=PASS"
        actor: Inspector
        preconditions:
          - "offer.status == UNDER_INSPECTION"
          - "provenance document present (offer.provenance_doc_url non-null OR provenance_doc_url supplied in inspect payload) else ERR_PROVENANCE_DOCUMENT_REQUIRED"
        side_effects: ["inspection_result = PASS"]
      - from: UNDER_INSPECTION
        to: INSPECTION_FAILED
        trigger: "POST /buy-offers/{id}/inspect with outcome in {FAIL_COUNTERFEIT, FAIL_DAMAGED, FAIL_DOCUMENTATION}"
        actor: Inspector
        preconditions: ["offer.status == UNDER_INSPECTION"]
        side_effects: ["inspection_result = outcome", "failure_note recorded"]
      - from: INSPECTION_PASSED
        to: CONVERTED
        trigger: "POST /buy-offers/{id}/convert-to-lot"
        actor: BrokerOps
        preconditions:
          - "offer.status == INSPECTION_PASSED"
          - "bin.available_units >= offer.quantity else ERR_BIN_CAPACITY_EXCEEDED"
        side_effects:
          - "creates Lot: qty_available=quantity, qty_reserved=qty_sold=qty_returned=0, cost_basis_per_unit_cents=agreed_unit_price_cents, received_at=clock now, storage_mode=acquisition_mode, status=IN_STOCK"
          - "bin.occupied_units += quantity (recompute)"
      - from: INSPECTION_FAILED
        to: RETURN_PENDING
        trigger: "POST /buy-offers/{id}/initiate-return"
        actor: BrokerOps
        preconditions: ["offer.status == INSPECTION_FAILED"]
        side_effects: []
      - from: RETURN_PENDING
        to: RETURNED
        trigger: "POST /buy-offers/{id}/mark-returned"
        actor: BrokerOps
        preconditions: ["offer.status == RETURN_PENDING"]
        side_effects: ["seller.account_balance_cents unchanged (broker never took ownership)"]

  - entity: Lot
    initial_state: IN_STOCK
    terminal_states: [DEPLETED]
    note: "status is posture-derived except QUARANTINED which is a manual override. Base posture recompute rule: QUARANTINED only via quarantine action; else DEPLETED if qty_available==0 and qty_reserved==0 and (qty_sold+qty_returned)>0; else FULLY_RESERVED if qty_available==0; else LISTED if an ACTIVE listing exists for this lot; else IN_STOCK."
    transitions:
      - from: IN_STOCK
        to: LISTED
        trigger: "system (listing activation on this lot)"
        actor: system
        preconditions: ["lot not quarantined", "no other ACTIVE listing on this lot"]
        side_effects: []
      - from: LISTED
        to: IN_STOCK
        trigger: "system (last ACTIVE listing on this lot paused or withdrawn, or consignment expiry/termination pause cascade)"
        actor: system
        preconditions: ["no remaining ACTIVE listing on this lot"]
        side_effects: []
      - from: [IN_STOCK, LISTED]
        to: FULLY_RESERVED
        trigger: "system (order creation drives qty_available to 0)"
        actor: system
        preconditions: ["qty_available == 0", "qty_reserved > 0"]
        side_effects: []
      - from: FULLY_RESERVED
        to: LISTED
        trigger: "system (reservation released via cancel/refund while an ACTIVE listing exists)"
        actor: system
        preconditions: ["qty_available > 0", "ACTIVE listing exists"]
        side_effects: []
      - from: FULLY_RESERVED
        to: IN_STOCK
        trigger: "system (reservation released via cancel/refund with no ACTIVE listing)"
        actor: system
        preconditions: ["qty_available > 0", "no ACTIVE listing"]
        side_effects: []
      - from: [FULLY_RESERVED, LISTED, IN_STOCK]
        to: DEPLETED
        trigger: "system (settle/refund leaves qty_available==0 and qty_reserved==0 with qty_sold+qty_returned>0)"
        actor: system
        preconditions: ["qty_available == 0", "qty_reserved == 0", "qty_sold + qty_returned > 0"]
        side_effects: ["any ACTIVE listing on this lot -> SOLD_OUT"]
      - from: [IN_STOCK, LISTED, FULLY_RESERVED]
        to: QUARANTINED
        trigger: "POST /lots/{id}/quarantine"
        actor: Inspector
        preconditions: ["lot.is_counterfeit_suspect == true", "lot.status != DEPLETED"]
        side_effects:
          - "ACTIVE listings on this lot -> WITHDRAWN (each such withdrawal may recompute lot posture on release)"
          - "open orders on this lot remain but POST fulfill and POST settle are blocked while QUARANTINED"
      - from: QUARANTINED
        to: IN_STOCK
        trigger: "POST /lots/{id}/release-quarantine"
        actor: Inspector
        preconditions: ["lot.status == QUARANTINED"]
        side_effects: ["is_counterfeit_suspect = false", "status recomputed to base posture (IN_STOCK since quarantine withdrew all listings; LISTED impossible because activation is blocked while suspect)"]

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SOLD_OUT]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /listings/{id}/activate"
        actor: BrokerOps
        preconditions:
          - "listing.status == DRAFT"
          - "lot.status == IN_STOCK else ERR_LOT_NOT_IN_STOCK"
          - "lot.is_counterfeit_suspect == false else ERR_COUNTERFEIT_SUSPECTED"
          - "if lot.storage_mode == CONSIGNMENT: an ACTIVE consignment agreement exists for lot with effective_from <= now < effective_to else ERR_NO_CURRENT_CONSIGNMENT_AGREEMENT"
          - "asking_price_per_unit_cents >= floor(lot.cost_basis_per_unit_cents x 0.80) else ERR_ASKING_BELOW_COST_FLOOR"
        side_effects: ["lot posture recompute (IN_STOCK -> LISTED)"]
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /listings/{id}/pause"
        actor: BrokerOps
        preconditions: ["listing.status == ACTIVE"]
        side_effects: ["lot posture recompute (LISTED -> IN_STOCK when no other ACTIVE listing)"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /listings/{id}/activate"
        actor: BrokerOps
        preconditions:
          - "listing.status == PAUSED"
          - "same lot/safety/consignment/floor preconditions as DRAFT -> ACTIVE"
        side_effects: ["lot posture recompute (IN_STOCK -> LISTED)"]
      - from: [DRAFT, ACTIVE, PAUSED]
        to: WITHDRAWN
        trigger: "POST /listings/{id}/withdraw or system (lot quarantined)"
        actor: "BrokerOps or system"
        preconditions: ["listing.status in {DRAFT, ACTIVE, PAUSED}"]
        side_effects: ["lot posture recompute"]
      - from: ACTIVE
        to: SOLD_OUT
        trigger: "system (lot became DEPLETED at order settlement)"
        actor: system
        preconditions: ["lot posture == DEPLETED"]
        side_effects: []

  - entity: SalesOrder
    initial_state: PENDING_ESCROW
    terminal_states: [SETTLED, CANCELLED, REFUNDED]
    transitions:
      - from: PENDING_ESCROW
        to: ESCROW_FUNDED
        trigger: "POST /sales-orders/{id}/escrow/deposit bringing escrow_funded_cents == required_escrow_cents"
        actor: system
        preconditions: ["order.status == PENDING_ESCROW", "cumulative deposits reach exactly required_escrow_cents (overpayment rejected with ERR_ESCROW_OVERPAYMENT)"]
        side_effects: ["EscrowEntry(DEPOSIT, +amount_cents) created", "escrow_funded_cents updated"]
      - from: PENDING_ESCROW
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: "Customer (owner) or BrokerOps"
        preconditions: ["order.status == PENDING_ESCROW"]
        side_effects:
          - "lot.qty_reserved -= quantity; lot.qty_available += quantity; lot posture recompute"
          - "customer.open_order_exposure_cents recompute"
      - from: ESCROW_FUNDED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: "Customer (owner) or BrokerOps"
        preconditions: ["order.status == ESCROW_FUNDED"]
        side_effects:
          - "EscrowEntry(CUSTOMER_REFUND, -escrow_funded_cents) created"
          - "lot.qty_reserved -= quantity; lot.qty_available += quantity; lot posture recompute"
          - "customer.open_order_exposure_cents recompute"
      - from: ESCROW_FUNDED
        to: FULFILLING
        trigger: "POST /sales-orders/{id}/fulfill"
        actor: BrokerOps
        preconditions: ["order.status == ESCROW_FUNDED", "lot.status != QUARANTINED else ERR_LOT_QUARANTINED"]
        side_effects: []
      - from: FULFILLING
        to: SHIPPED
        trigger: "POST /sales-orders/{id}/ship"
        actor: BrokerOps
        preconditions: ["order.status == FULFILLING"]
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /sales-orders/{id}/deliver"
        actor: BrokerOps
        preconditions: ["order.status == SHIPPED"]
        side_effects: []
      - from: DELIVERED
        to: SETTLED
        trigger: "POST /sales-orders/{id}/settle"
        actor: FinanceAdmin
        preconditions: ["order.status == DELIVERED", "lot.status != QUARANTINED else ERR_LOT_QUARANTINED"]
        side_effects:
          - "final price computed (final_settlement_pricing calc); customer_refund_cents = provisional_total - final_total"
          - "EscrowEntry(CUSTOMER_REFUND, -customer_refund_cents) created when customer_refund_cents > 0"
          - "BROKER_OWNED lot: EscrowEntry(BROKER_REVENUE, -final_total_cents) created"
          - "CONSIGNMENT lot: EscrowEntry(BROKER_FEE, -broker_fee) and EscrowEntry(SELLER_PAYOUT, -seller_payout) created (escrow_settlement_split calc)"
          - "SELLER_PAYOUT entry creation increments Seller.account_balance_cents and Seller.total_payouts_cents by seller_payout"
          - "lot.qty_reserved -= quantity; lot.qty_sold += quantity; lot posture recompute"
          - "lot posture becoming DEPLETED cascades the ACTIVE listing on the lot to SOLD_OUT"
          - "customer.open_order_exposure_cents recompute"
      - from: DELIVERED
        to: REFUND_PENDING
        trigger: "system (return case approved via POST /return-cases/{id}/approve)"
        actor: system
        preconditions: ["order.status == DELIVERED"]
        side_effects: []
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "system (POST /return-cases/{id}/issue-refund)"
        actor: system
        preconditions: ["order.status == REFUND_PENDING"]
        side_effects:
          - "EscrowEntry(CUSTOMER_REFUND, -refund_amount_cents) created"
          - "lot.qty_reserved -= quantity; lot.qty_returned += quantity; lot posture recompute"
          - "customer.open_order_exposure_cents recompute"

  - entity: ConsignmentAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /consignment-agreements/{id}/terminate"
        actor: BrokerOps
        preconditions: ["agreement.status == ACTIVE"]
        side_effects: ["ACTIVE listings on the agreement's lot -> PAUSED (lot posture recompute)"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: effective_to <= now)"
        actor: system
        preconditions: ["agreement.status == ACTIVE", "agreement.effective_to <= current clock"]
        side_effects: ["ACTIVE listings on the agreement's lot -> PAUSED (lot posture recompute)"]

  - entity: ReturnCase
    initial_state: OPENED
    terminal_states: [REJECTED, REFUND_ISSUED]
    transitions:
      - from: OPENED
        to: UNDER_REVIEW
        trigger: "POST /return-cases/{id}/start-review"
        actor: BrokerOps
        preconditions: ["case.status == OPENED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /return-cases/{id}/approve"
        actor: BrokerOps
        preconditions: ["case.status == UNDER_REVIEW", "order.status == DELIVERED else ERR_ORDER_NOT_DELIVERED"]
        side_effects: ["refund_amount_cents = order.escrow_funded_cents", "order.status -> REFUND_PENDING"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /return-cases/{id}/reject"
        actor: BrokerOps
        preconditions: ["case.status == UNDER_REVIEW"]
        side_effects: ["rejection_note recorded"]
      - from: APPROVED
        to: REFUND_ISSUED
        trigger: "POST /return-cases/{id}/issue-refund"
        actor: FinanceAdmin
        preconditions: ["case.status == APPROVED"]
        side_effects:
          - "EscrowEntry(CUSTOMER_REFUND, -refund_amount_cents) created"
          - "order.status -> REFUNDED"
          - "lot.qty_reserved -= order.quantity; lot.qty_returned += order.quantity; lot posture recompute"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: listing-update-stale-version
    parent_entity: Listing
    write_endpoint: "PATCH /listings/{id}"
    occ_field: expected_listing_version
    description: |
      Repricing a Listing whose version has advanced since the client last
      observed it is rejected. Two sequential repricing writes are each
      individually legitimate under product semantics (the later would blindly
      overwrite the earlier), so the stale writer is detected by its
      expected_listing_version no longer matching Listing.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_order_pricing
    trigger: "sales order creation"
    algorithm: tiered_pricing
    formula: |
      premium = URGENCY_PREMIUM[customer.urgency_tier at creation]
      provisional_unit_price_cents = round_half_up(listing.asking_price_per_unit_cents * (1 + premium))
      provisional_total_cents = provisional_unit_price_cents * quantity
      required_escrow_cents = provisional_total_cents
    input_set: "the referenced Listing (must be ACTIVE) and the ordering Customer's urgency_tier"
    constants:
      URGENCY_PREMIUM: { STANDARD: 0.00, PRIORITY: 0.10, CRITICAL: 0.25 }
    precision: "integer cents, round_half_up on the unit price before multiplying by quantity"

  - name: final_settlement_pricing
    trigger: "POST /sales-orders/{id}/settle"
    algorithm: tiered_pricing
    formula: |
      age_days = floor((settle_time - lot.received_at) / 86400)
      age_discount = 0.00 if age_days <= 89; 0.05 if 90 <= age_days <= 179; 0.12 if age_days >= 180
      vol = market_volatility_index(lot.mpn, settle_time)
      vol_dampener = 0.03 if vol > 0.20 else 0.00
      final_unit_price_cents = round_half_up(provisional_unit_price_cents * (1 - age_discount) * (1 - vol_dampener))
      final_total_cents = final_unit_price_cents * quantity
      customer_refund_cents = provisional_total_cents - final_total_cents
    input_set: "the order's lot, the order's provisional_unit_price_cents, MarketPriceSnapshot rows for lot.mpn with observed_at in (settle_time - 30*86400s, settle_time]"
    precision: "integer cents, single round_half_up at the unit-price step"
    variants:
      - name: provisional_variant
        when: "order creation (provisional_order_pricing)"
        difference: "uses asking price and urgency premium only; age and volatility are not yet known. Identical inputs therefore yield provisional != final whenever age_discount or vol_dampener is non-zero."

  - name: market_volatility_index
    trigger: "inside final_settlement_pricing and exposed via lot reads"
    algorithm: aggregation
    formula: |
      window = snapshots S where S.mpn == mpn and (t - 30*86400s) < S.observed_at <= t
      if count(window) < 2: volatility = 0
      else: volatility = (max(spot_price_cents) - min(spot_price_cents)) / min(spot_price_cents)
      Dampener applies only when volatility > 0.20 (strictly greater; exactly 0.20 does NOT trigger).
    input_set: "MarketPriceSnapshot rows for the mpn whose observed_at falls in the half-open window (t-30d, t]; tie on equal spots is irrelevant to max/min"
    constants:
      VOLATILITY_DAMPENER_THRESHOLD: 0.20
      VOLATILITY_DAMPENER_RATE: 0.03
      WINDOW_SECONDS: 2592000
    precision: "exact rational comparison; no rounding before the > 0.20 comparison"

  - name: escrow_settlement_split
    trigger: "POST /sales-orders/{id}/settle on a CONSIGNMENT lot order"
    algorithm: waterfall_allocation
    formula: |
      PINNED ROUNDING ORDER (mode b):
      1. broker_fee = round_half_up(final_total_cents * broker_fee_bps / 10000)
      2. seller_payout = final_total_cents - broker_fee   (exact subtraction, NOT independently rounded)
      The alternative order (seller_payout = round_half_up(final_total * (1 - bps/10000)), fee = remainder)
      yields a different cent split on half-cent boundaries and is forbidden.
      BROKER_OWNED lots: broker_revenue = final_total_cents (no split).
    input_set: "the settled order; consignment_fee_bps_snapshot taken at order creation"
    precision: "integer cents, round_half_up only at step 1"

  - name: lot_carrying_value
    trigger: "lot read; recomputed whenever age advances or a new MarketPriceSnapshot for the mpn is created"
    algorithm: decay_function
    formula: |
      qty_on_hand = qty_available + qty_reserved
      cost_total = cost_basis_per_unit_cents * qty_on_hand
      age_days = floor((now - received_at) / 86400)
      STRAIGHT_LINE variant:
        carrying_value_straight_line_cents = round_half_up(cost_total * max(0, 1 - age_days / 365))
      MARK_TO_MARKET variant:
        latest = snapshot with greatest observed_at for mpn (tie-break: greatest created_at)
        carrying_value_market_cents = round_half_up(latest.spot_price_cents * 0.85 * qty_on_hand); null if no snapshot
    input_set: "the lot; all MarketPriceSnapshot rows for lot.mpn"
    constants:
      DEPRECIATION_HORIZON_DAYS: 365
      BROKER_MARKET_HAIRCUT: 0.85
    precision: "integer cents, round_half_up"
    variants:
      - name: straight_line
        when: "accounting-basis reads (carrying_value_straight_line_cents)"
        difference: "time-decayed cost basis; ignores market observations entirely"
      - name: mark_to_market
        when: "market-basis reads (carrying_value_market_cents)"
        difference: "latest spot with broker haircut; ignores age. For identical lot state the two variants generally differ."

  - name: recommended_listing_price
    trigger: "listing read; recomputed whenever a new MarketPriceSnapshot for the lot's mpn is created"
    algorithm: aggregation
    formula: |
      latest = snapshot with greatest observed_at for lot.mpn (tie-break: greatest created_at)
      recommended_price_per_unit_cents = round_half_up(latest.spot_price_cents * 1.10); null if no snapshot
    input_set: "MarketPriceSnapshot rows for the lot's mpn"
    constants:
      RECOMMENDED_MARGIN: 1.10
    precision: "integer cents, round_half_up"

  - name: customer_credit_exposure
    trigger: "order creation (checked), and recomputed on order create/cancel/settle/refund-issue"
    algorithm: aggregation
    formula: |
      open_order_exposure_cents = sum(required_escrow_cents) over this customer's orders
        with status in {PENDING_ESCROW, ESCROW_FUNDED, FULFILLING, SHIPPED, DELIVERED, REFUND_PENDING}
      New order admission: open_order_exposure_cents + new required_escrow_cents <= credit_limit_cents
      (exact equality is admitted; one cent over is ERR_INSUFFICIENT_CUSTOMER_CREDIT).
    input_set: "all non-terminal orders of the customer (status filter as listed)"
    precision: "integer cents, exact"

  - name: lot_posture_derivation
    trigger: "any mutation to lot.qty_* fields, listing activation/pause/withdraw on the lot, quarantine actions"
    algorithm: constraint_propagation
    formula: |
      if manually QUARANTINED: QUARANTINED
      elif qty_available == 0 and qty_reserved == 0 and (qty_sold + qty_returned) > 0: DEPLETED
      elif qty_available == 0: FULLY_RESERVED
      elif exists listing L with L.lot_id == lot.id and L.status == ACTIVE: LISTED
      else: IN_STOCK
    input_set: "the lot and all its listings"
    precision: "deterministic total order of checks as written"

  - name: bin_occupancy
    trigger: "convert-to-lot (checked), lot quantity mutations (recomputed)"
    algorithm: aggregation
    formula: |
      occupied_units = sum(qty_available + qty_reserved) over all lots with storage_bin_id == bin.id and status != DEPLETED
      available_units = capacity_units - occupied_units
      Admission check at convert-to-lot: offer.quantity <= available_units
      (exact fit is admitted; one unit over is ERR_BIN_CAPACITY_EXCEEDED).
    input_set: "all non-DEPLETED lots assigned to the bin"
    precision: "integer units, exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Seller may only act on own buy offers (seller_id == X-User-ID); Customer may only act on own orders/return cases (customer_id == X-User-ID); Seller creating a buy offer must pass seller_id == X-User-ID"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "owner-scoped endpoints (POST /buy-offers, POST /buy-offers/{id}/cancel, POST /sales-orders, deposit/cancel on orders, POST /return-cases, owner GETs)"
  - priority: 4
    category: existence
    check: "Path and body-referenced ids exist (seller, customer, bin, offer, lot, listing, order, agreement, return case)"
    error_id: "ERR_SELLER_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_STORAGE_BIN_NOT_FOUND | ERR_BUY_OFFER_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_SALES_ORDER_NOT_FOUND | ERR_CONSIGNMENT_AGREEMENT_NOT_FOUND | ERR_RETURN_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FK ids"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_listing_version must equal Listing.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /listings/{id}"
  - priority: 6
    category: state
    check: "Target entity in a valid source state for the transition (covers ERR_INVALID_STATE generically plus specific guards: listing ACTIVE for order create (ERR_LISTING_NOT_ACTIVE); lot IN_STOCK for listing activate (ERR_LOT_NOT_IN_STOCK); lot not QUARANTINED for fulfill/settle (ERR_LOT_QUARANTINED); order DELIVERED for return approve (ERR_ORDER_NOT_DELIVERED); agreement ACTIVE for terminate (ERR_AGREEMENT_NOT_ACTIVE); consignment lot for agreement create (ERR_LOT_NOT_CONSIGNMENT))"
    error_id: "ERR_INVALID_STATE | ERR_LISTING_NOT_ACTIVE | ERR_LOT_NOT_IN_STOCK | ERR_LOT_QUARANTINED | ERR_ORDER_NOT_DELIVERED | ERR_AGREEMENT_NOT_ACTIVE | ERR_LOT_NOT_CONSIGNMENT"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Counterfeit/provenance safety: lot.is_counterfeit_suspect == false for listing activate and order create (ERR_COUNTERFEIT_SUSPECTED); inspect outcome=PASS requires provenance document on offer or in payload (ERR_PROVENANCE_DOCUMENT_REQUIRED)"
    error_id: "ERR_COUNTERFEIT_SUSPECTED | ERR_PROVENANCE_DOCUMENT_REQUIRED"
    http_status: 422
    applies_to: "POST /listings/{id}/activate, POST /sales-orders, POST /buy-offers/{id}/inspect"
  - priority: 8
    category: business_temporal
    check: "Consignment windows: effective_from < effective_to (ERR_CONSIGNMENT_WINDOW_INVALID); no overlap with any other ACTIVE agreement on the same lot using half-open [from, to) semantics (ERR_CONSIGNMENT_WINDOW_OVERLAP); listing activate requires a current ACTIVE agreement window (ERR_NO_CURRENT_CONSIGNMENT_AGREEMENT)"
    error_id: "ERR_CONSIGNMENT_WINDOW_INVALID | ERR_CONSIGNMENT_WINDOW_OVERLAP | ERR_NO_CURRENT_CONSIGNMENT_AGREEMENT"
    http_status: 409
    applies_to: "POST /consignment-agreements, POST /listings/{id}/activate"
  - priority: 9
    category: business_constraint
    check: "Aggregate/structural constraints: bin capacity admission (ERR_BIN_CAPACITY_EXCEEDED); order quantity <= lot.qty_available (ERR_QUANTITY_EXCEEDS_AVAILABLE); asking >= floor(cost_basis x 0.80) (ERR_ASKING_BELOW_COST_FLOOR); cumulative deposit <= required_escrow (ERR_ESCROW_OVERPAYMENT); agreement seller matches lot origin seller (ERR_CONSIGNMENT_SELLER_MISMATCH); broker_fee_bps in 1..5000 (ERR_INVALID_FEE_BPS); bin_code unique (ERR_DUPLICATE_BIN_CODE)"
    error_id: "ERR_BIN_CAPACITY_EXCEEDED | ERR_QUANTITY_EXCEEDS_AVAILABLE | ERR_ASKING_BELOW_COST_FLOOR | ERR_ESCROW_OVERPAYMENT | ERR_CONSIGNMENT_SELLER_MISMATCH | ERR_INVALID_FEE_BPS | ERR_DUPLICATE_BIN_CODE"
    http_status: 422
    applies_to: "convert-to-lot, order create, listing create/patch, deposit, agreement create, bin create"
  - priority: 10
    category: business_fiscal
    check: "Fiscal guards: open_order_exposure + new required_escrow <= credit_limit_cents (ERR_INSUFFICIENT_CUSTOMER_CREDIT); monetary and quantity inputs strictly positive (ERR_INVALID_AMOUNT)"
    error_id: "ERR_INSUFFICIENT_CUSTOMER_CREDIT | ERR_INVALID_AMOUNT"
    http_status: 402
    applies_to: "POST /sales-orders, deposit, create endpoints with amount fields"
    note: "ERR_INVALID_AMOUNT carries http 422; ERR_INSUFFICIENT_CUSTOMER_CREDIT carries 402"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock). Side effect sweep: ACTIVE consignment agreements with effective_to <= now become EXPIRED and ACTIVE listings on their lots become PAUSED."
    roles: [BrokerOps]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["consignment expiry sweep with listing pause cascade"]

  # --- Sellers ---
  - method: POST
    path: "/sellers"
    description: "Register a seller"
    roles: [BrokerOps]
    code: 201
    input: [name, contact_email, "payout_terms_days?"]
    output: Seller
    side_effects: []
  - method: GET
    path: "/sellers/{id}"
    description: "Get seller (includes computed account_balance_cents, total_payouts_cents)"
    roles: [BrokerOps, FinanceAdmin, Seller]
    code: 200
    input: []
    output: Seller
    side_effects: []
  - method: GET
    path: "/sellers/{id}/buy-offers"
    description: "List buy offers of a seller (Seller role restricted to own id)"
    roles: [BrokerOps, Inspector, Seller]
    code: 200
    input: []
    output: "BuyOffer[]"
    side_effects: []

  # --- Customers ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [BrokerOps]
    code: 201
    input: [name, contact_email, credit_limit_cents, "urgency_tier?"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Get customer (includes computed open_order_exposure_cents)"
    roles: [BrokerOps, FinanceAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Storage bins ---
  - method: POST
    path: "/storage-bins"
    description: "Create a storage bin"
    roles: [BrokerOps]
    code: 201
    input: [bin_code, capacity_units]
    output: StorageBin
    side_effects: []
  - method: GET
    path: "/storage-bins/{id}"
    description: "Get storage bin (includes computed occupied_units, available_units)"
    roles: [BrokerOps, Inspector]
    code: 200
    input: []
    output: StorageBin
    side_effects: []

  # --- Buy offers ---
  - method: POST
    path: "/buy-offers"
    description: "Seller submits a buy offer for excess inventory"
    roles: [Seller]
    code: 201
    input: [seller_id, mpn, quantity, ask_price_per_unit_cents, "provenance_doc_url?"]
    output: BuyOffer
    side_effects: ["status = PENDING_REVIEW"]
  - method: GET
    path: "/buy-offers/{id}"
    description: "Get buy offer"
    roles: [BrokerOps, Inspector, Seller]
    code: 200
    input: []
    output: BuyOffer
    side_effects: []
  - method: POST
    path: "/buy-offers/{id}/accept"
    description: "Broker accepts offer at an agreed unit price and acquisition mode"
    roles: [BrokerOps]
    code: 200
    input: [agreed_unit_price_cents, acquisition_mode]
    output: BuyOffer
    side_effects: ["status -> ACCEPTED; sets agreed_unit_price_cents, acquisition_mode"]
  - method: POST
    path: "/buy-offers/{id}/reject"
    description: "Broker rejects offer"
    roles: [BrokerOps]
    code: 200
    input: []
    output: BuyOffer
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/buy-offers/{id}/cancel"
    description: "Seller cancels own pending offer"
    roles: [Seller]
    code: 200
    input: []
    output: BuyOffer
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/buy-offers/{id}/receive"
    description: "Broker records physical receipt; offer enters inspection"
    roles: [BrokerOps]
    code: 200
    input: []
    output: BuyOffer
    side_effects: ["status -> UNDER_INSPECTION"]
  - method: POST
    path: "/buy-offers/{id}/inspect"
    description: "Inspector records inspection outcome; PASS requires provenance document"
    roles: [Inspector]
    code: 200
    input: [outcome, "provenance_doc_url?", "failure_note?"]
    output: BuyOffer
    side_effects: ["status -> INSPECTION_PASSED or INSPECTION_FAILED; sets inspection_result, failure_note"]
  - method: POST
    path: "/buy-offers/{id}/convert-to-lot"
    description: "Convert a passed offer into a physical lot in a storage bin"
    roles: [BrokerOps]
    code: 201
    input: [storage_bin_id]
    output: Lot
    side_effects: ["creates Lot (status IN_STOCK, received_at = clock)", "offer -> CONVERTED", "bin occupancy recompute"]
  - method: POST
    path: "/buy-offers/{id}/initiate-return"
    description: "Start seller return of failed-inspection goods"
    roles: [BrokerOps]
    code: 200
    input: []
    output: BuyOffer
    side_effects: ["status -> RETURN_PENDING"]
  - method: POST
    path: "/buy-offers/{id}/mark-returned"
    description: "Record goods shipped back to seller"
    roles: [BrokerOps]
    code: 200
    input: []
    output: BuyOffer
    side_effects: ["status -> RETURNED"]

  # --- Lots ---
  - method: GET
    path: "/lots"
    description: "List lots, optionally filtered by buy_offer_id and/or storage_bin_id"
    roles: [BrokerOps, Inspector, FinanceAdmin]
    code: 200
    input: ["buy_offer_id?", "storage_bin_id?"]
    output: "Lot[]"
    side_effects: []
  - method: GET
    path: "/lots/{id}"
    description: "Get lot (includes posture status, quantities, both carrying-value variants)"
    roles: [BrokerOps, Inspector, FinanceAdmin]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: POST
    path: "/lots/{id}/flag-counterfeit-suspect"
    description: "Inspector flags lot as counterfeit suspect (no status change; blocks listing activation and new orders)"
    roles: [Inspector]
    code: 200
    input: []
    output: Lot
    side_effects: ["is_counterfeit_suspect = true"]
  - method: POST
    path: "/lots/{id}/quarantine"
    description: "Quarantine a suspect lot; ACTIVE listings on it are withdrawn"
    roles: [Inspector]
    code: 200
    input: ["quarantine_note?"]
    output: Lot
    side_effects: ["status -> QUARANTINED", "ACTIVE listings on lot -> WITHDRAWN"]
  - method: POST
    path: "/lots/{id}/release-quarantine"
    description: "Release a quarantined lot; clears suspect flag and recomputes posture"
    roles: [Inspector]
    code: 200
    input: []
    output: Lot
    side_effects: ["is_counterfeit_suspect = false", "status recomputed to base posture"]

  # --- Market price intelligence ---
  - method: POST
    path: "/market-price-snapshots"
    description: "Record a market spot-price observation for an MPN; recomputes mark-to-market carrying values on matching lots and recommended prices on their ACTIVE listings"
    roles: [BrokerOps]
    code: 201
    input: [mpn, spot_price_cents, source]
    output: MarketPriceSnapshot
    side_effects: ["observed_at = clock now", "lot_carrying_value (mark_to_market) recompute on matching lots", "recommended_listing_price recompute on ACTIVE listings of matching lots"]
  - method: GET
    path: "/market-price-snapshots"
    description: "List snapshots, optionally filtered by mpn; sorted observed_at DESC, created_at DESC"
    roles: [BrokerOps, Inspector, FinanceAdmin]
    code: 200
    input: ["mpn?"]
    output: "MarketPriceSnapshot[]"
    side_effects: []

  # --- Consignment agreements ---
  - method: POST
    path: "/consignment-agreements"
    description: "Create a consignment agreement window for a CONSIGNMENT lot"
    roles: [BrokerOps]
    code: 201
    input: [seller_id, lot_id, effective_from, effective_to, broker_fee_bps]
    output: ConsignmentAgreement
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/consignment-agreements"
    description: "List agreements, optionally filtered by seller_id and/or lot_id"
    roles: [BrokerOps, FinanceAdmin]
    code: 200
    input: ["seller_id?", "lot_id?"]
    output: "ConsignmentAgreement[]"
    side_effects: []
  - method: GET
    path: "/consignment-agreements/{id}"
    description: "Get agreement"
    roles: [BrokerOps, FinanceAdmin]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: []
  - method: POST
    path: "/consignment-agreements/{id}/terminate"
    description: "Terminate an active agreement; ACTIVE listings on its lot are paused"
    roles: [BrokerOps]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["status -> TERMINATED", "ACTIVE listings on lot -> PAUSED", "lot posture recompute"]

  # --- Listings ---
  - method: POST
    path: "/listings"
    description: "Create a DRAFT listing for a lot"
    roles: [BrokerOps]
    code: 201
    input: [lot_id, asking_price_per_unit_cents]
    output: Listing
    side_effects: ["status = DRAFT", "recommended_price_per_unit_cents computed (null without snapshot)"]
  - method: GET
    path: "/listings"
    description: "List listings, optionally filtered by lot_id"
    roles: [BrokerOps, Inspector, FinanceAdmin, Customer]
    code: 200
    input: ["lot_id?"]
    output: "Listing[]"
    side_effects: []
  - method: GET
    path: "/listings/{id}"
    description: "Get listing"
    roles: [BrokerOps, Inspector, FinanceAdmin, Customer]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: PATCH
    path: "/listings/{id}"
    description: "Reprice a DRAFT or PAUSED listing (OCC-guarded by expected_listing_version)"
    roles: [BrokerOps]
    code: 200
    input: [asking_price_per_unit_cents, expected_listing_version]
    output: Listing
    side_effects: ["increments Listing.version by 1", "floor check on new asking price"]
  - method: POST
    path: "/listings/{id}/activate"
    description: "Activate a DRAFT or PAUSED listing"
    roles: [BrokerOps]
    code: 200
    input: []
    output: Listing
    side_effects: ["status -> ACTIVE", "lot posture recompute (IN_STOCK -> LISTED)"]
  - method: POST
    path: "/listings/{id}/pause"
    description: "Pause an ACTIVE listing"
    roles: [BrokerOps]
    code: 200
    input: []
    output: Listing
    side_effects: ["status -> PAUSED", "lot posture recompute"]
  - method: POST
    path: "/listings/{id}/withdraw"
    description: "Permanently withdraw a listing"
    roles: [BrokerOps]
    code: 200
    input: []
    output: Listing
    side_effects: ["status -> WITHDRAWN", "lot posture recompute"]

  # --- Sales orders ---
  - method: POST
    path: "/sales-orders"
    description: "Customer places an order against an ACTIVE listing; computes provisional urgency pricing and 100% escrow requirement"
    roles: [Customer]
    code: 201
    input: [customer_id, listing_id, quantity]
    output: SalesOrder
    side_effects: ["provisional_order_pricing calc", "urgency_tier_snapshot and consignment_fee_bps_snapshot captured", "lot.qty_available -= quantity; lot.qty_reserved += quantity; lot posture recompute", "customer exposure recompute", "status = PENDING_ESCROW"]
  - method: GET
    path: "/sales-orders"
    description: "List orders, optionally filtered by customer_id and/or listing_id"
    roles: [BrokerOps, FinanceAdmin]
    code: 200
    input: ["customer_id?", "listing_id?"]
    output: "SalesOrder[]"
    side_effects: []
  - method: GET
    path: "/sales-orders/{id}"
    description: "Get order (Customer role restricted to own orders)"
    roles: [BrokerOps, FinanceAdmin, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: POST
    path: "/sales-orders/{id}/escrow/deposit"
    description: "Customer funds escrow; reaching exactly required_escrow_cents transitions order to ESCROW_FUNDED"
    roles: [Customer]
    code: 200
    input: [amount_cents]
    output: SalesOrder
    side_effects: ["EscrowEntry(DEPOSIT, +amount_cents)", "escrow_funded_cents += amount", "status -> ESCROW_FUNDED when escrow_funded_cents == required_escrow_cents"]
  - method: POST
    path: "/sales-orders/{id}/fulfill"
    description: "Begin fulfillment of a funded order"
    roles: [BrokerOps]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> FULFILLING"]
  - method: POST
    path: "/sales-orders/{id}/ship"
    description: "Mark order shipped"
    roles: [BrokerOps]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> SHIPPED"]
  - method: POST
    path: "/sales-orders/{id}/deliver"
    description: "Mark order delivered"
    roles: [BrokerOps]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["status -> DELIVERED"]
  - method: POST
    path: "/sales-orders/{id}/settle"
    description: "Settle a delivered order: computes final price, refunds escrow delta, splits consignment proceeds, updates lot quantities and seller balance"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["final_settlement_pricing calc", "escrow_settlement_split calc", "escrow entries created", "Seller.account_balance_cents += seller_payout (consignment)", "lot qty_reserved -> qty_sold migration with posture recompute", "lot DEPLETED cascades ACTIVE listing to SOLD_OUT", "customer exposure recompute"]
  - method: POST
    path: "/sales-orders/{id}/cancel"
    description: "Cancel a PENDING_ESCROW or ESCROW_FUNDED order; releases reservation and refunds deposits"
    roles: [Customer, BrokerOps]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["CUSTOMER_REFUND escrow entry when escrow_funded_cents > 0", "lot reservation released with posture recompute", "customer exposure recompute", "status -> CANCELLED"]

  # --- Escrow ledger ---
  - method: GET
    path: "/sales-orders/{id}/escrow-entries"
    description: "Append-only escrow ledger for an order, chronological by created_at ASC"
    roles: [BrokerOps, FinanceAdmin, Customer]
    code: 200
    input: []
    output: "EscrowEntry[]"
    side_effects: []

  # --- Return cases ---
  - method: POST
    path: "/return-cases"
    description: "Customer opens a return case on a DELIVERED order (e.g., failed incoming inspection at the customer's dock)"
    roles: [Customer]
    code: 201
    input: [sales_order_id, reason]
    output: ReturnCase
    side_effects: ["status = OPENED"]
  - method: GET
    path: "/return-cases/{id}"
    description: "Get return case"
    roles: [BrokerOps, FinanceAdmin, Customer]
    code: 200
    input: []
    output: ReturnCase
    side_effects: []
  - method: GET
    path: "/sales-orders/{id}/return-cases"
    description: "List return cases for an order"
    roles: [BrokerOps, FinanceAdmin, Customer]
    code: 200
    input: []
    output: "ReturnCase[]"
    side_effects: []
  - method: POST
    path: "/return-cases/{id}/start-review"
    description: "Broker starts reviewing an open return case"
    roles: [BrokerOps]
    code: 200
    input: []
    output: ReturnCase
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/return-cases/{id}/approve"
    description: "Approve a return: sets refund to the order's funded escrow and moves the order to REFUND_PENDING"
    roles: [BrokerOps]
    code: 200
    input: []
    output: ReturnCase
    side_effects: ["status -> APPROVED", "refund_amount_cents = order.escrow_funded_cents", "order -> REFUND_PENDING"]
  - method: POST
    path: "/return-cases/{id}/reject"
    description: "Reject a return case"
    roles: [BrokerOps]
    code: 200
    input: ["rejection_note?"]
    output: ReturnCase
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/return-cases/{id}/issue-refund"
    description: "Finance issues the approved refund: CUSTOMER_REFUND escrow entry, order REFUNDED, lot units move reserved -> returned"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: ReturnCase
    side_effects: ["EscrowEntry(CUSTOMER_REFUND, -refund_amount_cents)", "order -> REFUNDED", "lot.qty_reserved -= quantity; lot.qty_returned += quantity; lot posture recompute", "status -> REFUND_ISSUED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller acting on a resource it does not own (Seller vs buy offer, Customer vs order/return case)" }
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "Referenced seller does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced customer does not exist" }
  - { id: ERR_STORAGE_BIN_NOT_FOUND, http: 404, condition: "Referenced storage bin does not exist" }
  - { id: ERR_BUY_OFFER_NOT_FOUND, http: 404, condition: "Referenced buy offer does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Referenced lot does not exist" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "Referenced listing does not exist" }
  - { id: ERR_SALES_ORDER_NOT_FOUND, http: 404, condition: "Referenced sales order does not exist" }
  - { id: ERR_CONSIGNMENT_AGREEMENT_NOT_FOUND, http: 404, condition: "Referenced consignment agreement does not exist" }
  - { id: ERR_RETURN_CASE_NOT_FOUND, http: 404, condition: "Referenced return case does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_listing_version does not match Listing.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state transition (e.g., deposit on CANCELLED order, accept on RECEIVED offer)" }
  - { id: ERR_LISTING_NOT_ACTIVE, http: 409, condition: "Order creation against a listing that is not ACTIVE" }
  - { id: ERR_LOT_NOT_IN_STOCK, http: 409, condition: "Listing activation requires lot posture IN_STOCK" }
  - { id: ERR_LOT_QUARANTINED, http: 409, condition: "Fulfill or settle blocked while the lot is QUARANTINED" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "Return-case create/approve requires order status DELIVERED (create) or DELIVERED at approve time" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Terminate requires agreement status ACTIVE" }
  - { id: ERR_LOT_NOT_CONSIGNMENT, http: 409, condition: "Consignment agreement requires lot.storage_mode == CONSIGNMENT" }
  - { id: ERR_COUNTERFEIT_SUSPECTED, http: 422, condition: "Listing activation or order creation on a lot with is_counterfeit_suspect == true" }
  - { id: ERR_PROVENANCE_DOCUMENT_REQUIRED, http: 422, condition: "Inspection outcome PASS without a provenance document on the offer or in the inspect payload" }
  - { id: ERR_CONSIGNMENT_WINDOW_INVALID, http: 422, condition: "effective_from >= effective_to" }
  - { id: ERR_CONSIGNMENT_WINDOW_OVERLAP, http: 409, condition: "New window overlaps an existing ACTIVE agreement on the same lot under half-open [from, to) semantics" }
  - { id: ERR_NO_CURRENT_CONSIGNMENT_AGREEMENT, http: 409, condition: "Listing activation on a CONSIGNMENT lot without an ACTIVE agreement whose window contains the current clock" }
  - { id: ERR_BIN_CAPACITY_EXCEEDED, http: 422, condition: "convert-to-lot quantity exceeds bin available_units" }
  - { id: ERR_QUANTITY_EXCEEDS_AVAILABLE, http: 422, condition: "Order quantity exceeds lot.qty_available" }
  - { id: ERR_ASKING_BELOW_COST_FLOOR, http: 422, condition: "Asking price below floor(lot.cost_basis_per_unit_cents x 0.80)" }
  - { id: ERR_ESCROW_OVERPAYMENT, http: 422, condition: "Deposit would push escrow_funded_cents above required_escrow_cents" }
  - { id: ERR_CONSIGNMENT_SELLER_MISMATCH, http: 422, condition: "Agreement seller_id differs from the seller of the lot's originating buy offer" }
  - { id: ERR_INVALID_FEE_BPS, http: 422, condition: "broker_fee_bps outside 1..5000" }
  - { id: ERR_DUPLICATE_BIN_CODE, http: 422, condition: "bin_code already in use" }
  - { id: ERR_INSUFFICIENT_CUSTOMER_CREDIT, http: 402, condition: "open_order_exposure_cents + new required_escrow_cents would exceed credit_limit_cents" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Monetary or quantity input not strictly positive (or zero where forbidden)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, wrong type, or unknown enum value" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BrokerOps
    description: "Broker operations staff: offer review, receiving, lot conversion, listings, fulfillment, consignment administration, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /buy-offers/{id}/accept, /reject, /receive, /convert-to-lot, /initiate-return, /mark-returned"
      - "POST /listings*, POST /storage-bins, POST /consignment-agreements*, POST /market-price-snapshots"
      - "POST /sales-orders/{id}/fulfill, /ship, /deliver"
      - "POST /return-cases/{id}/start-review, /approve, /reject"
      - "POST /_clock/set_current_utc"
    shared_operations: ["GET reads across all resources", "POST /sales-orders/{id}/cancel (shared with order-owning Customer)"]
  - name: Inspector
    description: "Quality inspector: counterfeit screening and quarantine control"
    identity: opaque
    exclusive_operations:
      - "POST /buy-offers/{id}/inspect"
      - "POST /lots/{id}/flag-counterfeit-suspect, /quarantine, /release-quarantine"
    shared_operations: ["GET reads on offers, lots, bins, listings, snapshots"]
  - name: FinanceAdmin
    description: "Finance administrator: settlement and refund issuance (segregated from BrokerOps fulfillment)"
    identity: opaque
    exclusive_operations:
      - "POST /sales-orders/{id}/settle"
      - "POST /return-cases/{id}/issue-refund"
    shared_operations: ["GET reads on orders, escrow entries, sellers, agreements, return cases"]
  - name: Seller
    description: "Entity-backed seller: submits and cancels own buy offers"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /buy-offers"
      - "POST /buy-offers/{id}/cancel (own offers only)"
    shared_operations: ["GET /sellers/{id} (self)", "GET /sellers/{id}/buy-offers (self)", "GET /buy-offers/{id} (own)"]
  - name: Customer
    description: "Entity-backed customer: places orders, funds escrow, opens return cases"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /sales-orders (customer_id must equal X-User-ID)"
      - "POST /sales-orders/{id}/escrow/deposit (own orders only)"
      - "POST /return-cases (on own orders only)"
    shared_operations: ["GET /customers/{id} (self)", "GET /sales-orders/{id} (own)", "GET /sales-orders/{id}/escrow-entries (own)", "GET /sales-orders/{id}/return-cases (own)", "GET /return-cases/{id} (own)", "GET /listings* (browse)", "POST /sales-orders/{id}/cancel (own orders, shared with BrokerOps)"]
