  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical UTC clock used for every date comparison, expiry and age derivation in this service; the clock starts at 2026-08-01T00:00:00Z on a fresh service and every request thereafter reads it rather than the wall clock"
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: ClockState
    side_effects: ["EducationEnrollment rows in COMPLETED whose expires_on is strictly before the new clock date become EXPIRED", "each expiry cascades: ApplicantHousehold.partnership_readiness CLOSING_READY or EDUCATION_COMPLETE -> NOT_READY, then that household's CLEARED_TO_CLOSE mortgages -> APPROVED", "VolunteerProfile.is_minor re-derived from birth_date; a profile whose waiver_expires_on is strictly before the new clock date keeps status ACTIVE but fails the waiver validation on any new reservation", "increments the version of every row it touches by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- Authentication and authorization --------------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role is absent or empty on any endpoint other than POST /_clock/set_current_utc"

  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven role names declared in section 1.7"

  - id: ERR_IDENTITY_NOT_FOUND
    http: 403
    condition: "X-User-Role is an entity_backed role (Applicant or Volunteer) and X-User-ID does not match the id of any ApplicantHousehold or VolunteerProfile row respectively"

  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the addressed endpoint's roles"

  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An Applicant addresses a row whose household chain does not resolve to its own X-User-ID, or a Volunteer addresses a row whose volunteer_id is not its own X-User-ID"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID already occupies an incompatible seat on the same object: the reviewer who submitted a SelectionReview also issuing that household's selection-decision, or the MortgageOfficer who submitted an application to underwriting also approving it"

  - id: ERR_SELF_VERIFICATION_FORBIDDEN
    http: 403
    condition: "POST /sweat-equity-entries/{id}/verification where the entry's claimed_by_user_id equals the acting X-User-ID"

  # ---- Payload shape ---------------------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "A required input field is absent, has the wrong type, is outside its declared numeric or enum domain, or a date/timestamp is not a valid ISO-8601 value"

  # ---- Referential integrity -------------------------------------------------
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "The addressed AffiliateProgram id, or a program_id supplied in a payload, matches no row"

  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "The addressed ApplicantHousehold id, or a household_id supplied in a payload, matches no row"

  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "The addressed HouseholdMember id, or a member_id / household_member_id supplied in a payload, matches no row"

  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "The addressed SelectionReview id matches no row"

  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "The addressed SweatEquityEntry id, or a reversal_of_entry_id supplied in a payload, matches no row"

  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "The addressed BuildSite id, or a build_site_id supplied in a payload, matches no row"

  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "The addressed ConstructionShift id, or a shift_id supplied in a payload, matches no row"

  - id: ERR_VOLUNTEER_NOT_FOUND
    http: 404
    condition: "The addressed VolunteerProfile id, or a volunteer_id supplied in a payload, matches no row"

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "The addressed ShiftAssignment id, or a shift_assignment_id supplied in a payload, matches no row"

  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "The addressed EducationEnrollment id matches no row"

  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "The addressed MortgageApplication id, or a superseded_application_id supplied in a payload, matches no row"

  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "The addressed GrantAward id matches no row"

  # ---- Optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the addressed AffiliateProgram's current version on POST /mortgage-applications/{id}/approve or POST /programs/{id}/subsidy-pool-adjustments"

  - id: ERR_STALE_SHIFT_VERSION
    http: 412
    condition: "expected_shift_version does not equal the parent ConstructionShift's current version on POST /shift-assignments"

  - id: ERR_STALE_HOUSEHOLD_VERSION
    http: 412
    condition: "expected_household_version does not equal the parent ApplicantHousehold's current version on POST /mortgage-applications"

  # ---- Lifecycle state -------------------------------------------------------
  - id: ERR_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "The addressed row's current value for the state_field being moved is not a declared from: state of the requested section 1.2 transition"

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The state_field being moved already holds a terminal value (DENIED, CLOSED, WITHDRAWN, COMPLETED, CANCELLED, NO_SHOW, SUPERSEDED, SATISFIED, RECAPTURED, FAILED or EXPIRED)"

  - id: ERR_PROGRAM_FROZEN
    http: 409
    condition: "The governing AffiliateProgram.program_posture is FROZEN and the request is any write other than a read or a subsidy-pool adjustment"

  - id: ERR_SITE_UNDER_SAFETY_HOLD
    http: 409
    condition: "The governing BuildSite has safety_posture HOLD (readiness_status SAFETY_HOLD) and the request schedules, opens, locks, completes or staffs work on that site"

  - id: ERR_SITE_NOT_READY_TO_BUILD
    http: 409
    condition: "A shift is scheduled or opened on a BuildSite whose readiness_status is not READY_TO_BUILD or UNDER_CONSTRUCTION"

  - id: ERR_SITE_NOT_COMPLETED
    http: 409
    condition: "POST /mortgage-applications/{id}/close where the pinned BuildSite.readiness_status is neither UNDER_CONSTRUCTION nor COMPLETED"

  - id: ERR_SITE_ALREADY_ASSIGNED
    http: 409
    condition: "POST /mortgage-applications names a build_site_id whose assigned_household_id is already set to a different household"

  - id: ERR_HOUSEHOLD_NOT_SELECTED
    http: 409
    condition: "A mortgage application, education enrollment or site assignment is created for a household whose selection_status is not SELECTED or PARTNERSHIP_ACTIVE"

  - id: ERR_SHIFT_NOT_ENDED
    http: 409
    condition: "POST /construction-shifts/{id}/complete where the logical clock is strictly before the shift's end_at"

  - id: ERR_CHECK_IN_WINDOW_CLOSED
    http: 409
    condition: "POST /shift-assignments/{id}/check-in where the parent shift is not LOCKED, or the logical clock is outside the closed window from 60 minutes before start_at through end_at"

  - id: ERR_EDUCATION_NOT_COMPLETE
    http: 409
    condition: "A closing-side transition is requested while the household has no EducationEnrollment for curriculum_code HOMEBUYER_CORE in status COMPLETED"

  - id: ERR_EDUCATION_EXPIRED
    http: 409
    condition: "The household's HOMEBUYER_CORE enrollment is COMPLETED but expires_on is strictly before the logical clock date, or the enrollment has already moved to EXPIRED"

  - id: ERR_SWEAT_EQUITY_INCOMPLETE
    http: 409
    condition: "POST /mortgage-applications/{id}/close where ApplicantHousehold.sweat_equity_satisfied is false"

  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "POST /education-enrollments for a household that already holds a non-terminal enrollment (ENROLLED or IN_PROGRESS) in the same curriculum_code"

  - id: ERR_VOLUNTEER_SUSPENDED
    http: 422
    condition: "POST /shift-assignments names a volunteer_id whose VolunteerProfile.status is SUSPENDED (three or more no_show_strikes)"

  - id: ERR_REPORTING_PERIOD_OPEN
    http: 409
    condition: "POST /grant-awards/{id}/impact-reports where the logical clock date is on or before the award's period_end, or the award status is already REPORTED"

  # ---- Selection and committee governance ------------------------------------
  - id: ERR_DOCUMENTATION_INCOMPLETE
    http: 409
    condition: "A documented step is requested without its evidence: a screening without verified income and housing figures, a readiness-advance without document_reference, a lock without safety_briefing_reference, or a FORBEARANCE lien action without counseling_session_reference"

  - id: ERR_INCOME_OUT_OF_BAND
    http: 422
    condition: "The household's verified income falls outside the inclusive 0.3000-0.8000 area-median-income band that section 1.3 household_selection_scoring requires for a FINAL basis"

  - id: ERR_COMMITTEE_QUORUM_NOT_MET
    http: 409
    condition: "POST /households/{id}/selection-decision where any of the three dimensions has fewer reviews in status SUBMITTED than AffiliateProgram.committee_quorum"

  - id: ERR_DUPLICATE_REVIEW
    http: 409
    condition: "POST /selection-reviews where the same reviewer_user_id already holds a SUBMITTED review on the same household for the same dimension"

  - id: ERR_VETO_REASON_REQUIRED
    http: 422
    condition: "A SelectionReview with recommendation VETO_WILLINGNESS omits documented_reason, or a selection-decision of DENIED omits denial_reason_code"

  - id: ERR_NO_ELIGIBLE_WAITLIST_HOUSEHOLD
    http: 409
    condition: "POST /programs/{id}/waitlist-promotions finds an empty candidate pool after the eligibility filter of section 1.3 waitlist_promotion_selector"

  - id: ERR_NO_READY_SITE_CAPACITY
    http: 409
    condition: "POST /programs/{id}/waitlist-promotions finds candidates but no unassigned BuildSite in readiness_status READY_TO_BUILD to seat them"

  # ---- Sweat equity crediting ------------------------------------------------
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "A sweat equity entry, credit or shift seat names a HouseholdMember whose status is REMOVED, or one that belongs to a different household than the entry's household_id"

  - id: ERR_MEMBER_INELIGIBLE_FOR_CREDIT
    http: 422
    condition: "The named HouseholdMember is younger than the minimum credit age of 16 at the entry's work_date (age_at_work_date computed as floor of the 365.25-day year count)"

  - id: ERR_MINOR_CATEGORY_NOT_ALLOWED
    http: 422
    condition: "A member who is 16 or 17 at work_date claims a category outside {RESTORE_STORE, ADVOCACY}; site safety keeps under-18 partners off CONSTRUCTION, and HOMEOWNER_EDUCATION is adult-only"

  - id: ERR_CATEGORY_CREDIT_CAP_REACHED
    http: 422
    condition: "Crediting the entry leaves hours_credited at 0 because the category allowance has no room (25.00 hours for HOMEOWNER_EDUCATION, 10.00 for ADVOCACY; other categories are uncapped)"

  - id: ERR_FAMILY_CREDIT_CAP_REACHED
    http: 422
    condition: "Crediting a non-applicant family member's entry would exceed the family allowance of floor(0.50 * sweat_equity_required_hours) with zero room left"

  - id: ERR_WORK_DATE_OUT_OF_RANGE
    http: 422
    condition: "The entry's work_date is strictly after the logical clock date, or strictly before the household's selection_status first reached SELECTED"

  # ---- Volunteer scheduling and trade coordination ---------------------------
  - id: ERR_WAIVER_EXPIRED
    http: 422
    condition: "POST /shift-assignments names a volunteer whose waiver_expires_on is strictly before the target shift's start_at date"

  - id: ERR_TRADE_CERTIFICATION_INVALID
    http: 422
    condition: "A SKILLED_TRADE seat is requested by a volunteer whose trade_certifications do not contain the shift's required_trade"

  - id: ERR_VOLUNTEER_DOUBLE_BOOKED
    http: 409
    condition: "The volunteer already holds a seat in status RESERVED, CONFIRMED, CHECKED_IN or COMPLETED on a shift in status SCHEDULED, OPEN or LOCKED whose half-open [start_at, end_at) interval intersects the target shift's interval; back-to-back shifts that only touch at an endpoint are accepted"

  - id: ERR_VOLUNTEER_WEEKLY_CAP_EXCEEDED
    http: 422
    condition: "Adding the target shift's duration_hours would push the volunteer past the Monday-anchored UTC calendar-week ceiling of 40.00 hours (16.00 for a minor); landing exactly on the ceiling is accepted"

  - id: ERR_SITE_SHIFT_BUFFER_CONFLICT
    http: 409
    condition: "Another shift on the same BuildSite in status SCHEDULED, OPEN, LOCKED or COMPLETED falls inside the closed 60-minute cleanup buffer around the requested interval; a gap of exactly 60 minutes is accepted"

  - id: ERR_SHIFT_HAS_NO_SLOTS
    http: 422
    condition: "POST /construction-shifts is given volunteer_slots of 0 or less, or required_trade_slots greater than volunteer_slots"

  - id: ERR_REQUIRED_TRADE_MISSING
    http: 422
    condition: "required_trade_slots is one or more while required_trade is absent, or required_trade is supplied with required_trade_slots of 0"

  - id: ERR_SHIFT_ROLE_FULL
    http: 409
    condition: "Every seat for the requested role is taken: general seats have reached volunteer_slots minus required_trade_slots, or trade seats have reached required_trade_slots"

  - id: ERR_PARTNER_MEMBER_NOT_ON_SITE
    http: 409
    condition: "A HOMEOWNER_PARTNER seat is requested for a household member whose household is not the assigned_household_id of the shift's BuildSite"

  - id: ERR_TRADE_COVERAGE_INSUFFICIENT
    http: 409
    condition: "POST /construction-shifts/{id}/lock while confirmed_trade_count is below required_trade_slots"

  - id: ERR_SHIFT_FILL_INSUFFICIENT
    http: 409
    condition: "POST /construction-shifts/{id}/lock while confirmed_general_count is below ceil(0.60 * volunteer_slots)"

  # ---- Mortgage, subsidy and lien --------------------------------------------
  - id: ERR_NO_AFFORDABLE_STRUCTURE
    http: 422
    condition: "Section 1.3 affordable_payment_structure yields an affordable principal-and-interest payment of 0 cents or less after escrow, so no first mortgage can be written"

  - id: ERR_SUBSIDY_POOL_EXHAUSTED
    http: 409
    condition: "POST /mortgage-applications/{id}/approve where silent_second_amount_cents is strictly greater than AffiliateProgram.subsidy_available_cents; an amount exactly equal to the balance is accepted"

  - id: ERR_POOL_BELOW_OBLIGATIONS
    http: 409
    condition: "POST /programs/{id}/subsidy-pool-adjustments would leave subsidy_pool_cents below the sum of subsidy_committed_cents and subsidy_disbursed_cents, breaking the pool identity"

  - id: ERR_FORBEARANCE_LIMIT_REACHED
    http: 409
    condition: "A FORBEARANCE lien action is requested when forbearance_counseling_sessions has already reached 3"

  - id: ERR_ROFR_WINDOW_OPEN
    http: 409
    condition: "A RECAPTURE lien action is requested while the logical clock date is on or before right_of_first_refusal_expires_on"

  - id: ERR_LIEN_BALANCE_OUTSTANDING
    http: 409
    condition: "A PAYOFF lien action is requested with a payment below lien_outstanding_cents, or a TRANSFER_NOTICE is requested on a lien that is not ACTIVE"

  - id: ERR_IN_KIND_AMOUNT_MISMATCH
    http: 422
    condition: "A CostEntry with is_in_kind true supplies amount_cents or omits fair_market_value_cents or donor_name, or one with is_in_kind false supplies fair_market_value_cents or omits amount_cents"

  # ---- Test-driving clock ----------------------------------------------------
  - id: ERR_CLOCK_MUST_ADVANCE
    http: 422
    condition: "POST /_clock/set_current_utc is given a current_utc that is not strictly after the clock's present value"

# =============================================================================
# 1.7 RBAC Matrix
#   Role model: segregation of duties. The affiliate's compliance posture splits
#   the homeownership pipeline into four custodies that no single operator may
#   combine: family services intake and hour crediting, committee scoring,
#   mortgage origination, and construction custody. ProgramAdmin governs the
#   program envelope and the subsidy pool but may neither score an applicant nor
#   verify sweat equity hours.
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Executive director / program administrator: owns the AffiliateProgram envelope, the subsidy pool, land acquisition, grant reporting and the final selection decision the committee's scores feed"
    identity: "opaque"
    exclusive_operations:
      - "POST /homeownership/programs — create the program with its subsidy pool, quorum and base sweat equity requirement"
      - "POST /homeownership/programs/{id}/subsidy-pool-adjustments — resize the pool under expected_program_version (rejected by ERR_POOL_BELOW_OBLIGATIONS when it would break the pool identity)"
      - "POST /homeownership/programs/{id}/waitlist-promotions — run the deterministic waitlist selector"
      - "POST /homeownership/households/{id}/selection-decision — issue SELECTED / WAITLISTED / DENIED once quorum is met"
      - "POST /homeownership/build-sites — record a land acquisition"
      - "POST /homeownership/grant-awards and POST /homeownership/grant-awards/{id}/impact-reports — donor and grant reporting on households served"
      - "POST /_clock/set_current_utc — advance the logical clock"
    shared_operations:
      - "POST /homeownership/build-sites/{id}/readiness-advance (with ConstructionManager)"
      - "POST /homeownership/cost-entries (with ConstructionManager)"
      - "POST /homeownership/volunteers (with ConstructionManager)"
      - "POST /homeownership/mortgage-applications/{id}/lien-actions (with MortgageOfficer)"
      - "every GET across the domain"
    notes: "Segregation of duties: ProgramAdmin cannot submit a SelectionReview (that is the committee's custody) yet issues the selection-decision, so the scores it acts on are always authored by other identities. It also cannot verify or credit sweat equity hours."

  - name: FamilyServicesCoordinator
    description: "Family services staff: owns applicant intake, need/ability documentation, homebuyer education delivery and the sweat equity hour ledger"
    identity: "opaque"
    exclusive_operations:
      - "POST /homeownership/households — open an applicant household file"
      - "POST /homeownership/households/{id}/screen — write verified income and housing figures and the FINAL score basis"
      - "POST /homeownership/households/{id}/committee-referral and POST /homeownership/households/{id}/return-to-screening — drive the SCREENING <-> COMMITTEE_REVIEW cycle"
      - "POST /homeownership/sweat-equity-entries/{id}/credit — post verified hours to the household ledger"
      - "POST /homeownership/sweat-equity-entries/{id}/reverse — post the compensating mirror entry"
      - "POST /homeownership/education-enrollments and POST /homeownership/education-enrollments/{id}/module-completions"
    shared_operations:
      - "POST /homeownership/households/{id}/submit (with Applicant)"
      - "POST /homeownership/household-members (with Applicant)"
      - "POST /homeownership/sweat-equity-entries (with Applicant)"
      - "POST /homeownership/sweat-equity-entries/{id}/verification (with ConstructionManager)"
      - "GET on households, members, reviews, entries, sites, shifts, enrollments and mortgage applications"
    notes: "Segregation of duties: ERR_SELF_VERIFICATION_FORBIDDEN blocks a coordinator from verifying an entry it claimed on the applicant's behalf; the coordinator also cannot score the applicant or approve the mortgage it prepares the file for."

  - name: SelectionCommitteeMember
    description: "Volunteer selection committee member: scores need, ability to pay and willingness to partner on the documented selection process, one review per dimension"
    identity: "opaque"
    exclusive_operations:
      - "POST /homeownership/selection-reviews — submit a scored review for exactly one dimension (NEED, ABILITY or WILLINGNESS) with a documented reason, including the WILLINGNESS veto"
      - "POST /homeownership/selection-reviews/{id}/retract — withdraw a submitted review, removing it from every quorum count and score aggregate"
    shared_operations:
      - "GET /homeownership/households, GET /homeownership/households/{id}, GET /homeownership/selection-reviews and GET /homeownership/selection-reviews/{id}"
    notes: "Identity is opaque and recorded on SelectionReview.reviewer_user_id. Segregation of duties: ERR_DUPLICATE_REVIEW stops one identity from padding quorum on a dimension, and ERR_SEGREGATION_OF_DUTIES stops a reviewer identity from also acting as the deciding ProgramAdmin on the same household. Committee members have no write access to hours, sites or mortgages."

  - name: MortgageOfficer
    description: "Mortgage origination staff: structures the affordability-based payment, sizes the subsidy silent second, closes the loan and runs foreclosure-prevention and resale-restriction actions on the lien"
    identity: "opaque"
    exclusive_operations:
      - "POST /homeownership/mortgage-applications — originate under expected_household_version, pinning the appraisal and income snapshots"
      - "POST /homeownership/mortgage-applications/{id}/submit-underwriting — compute the pinned 8-step affordability structure"
      - "POST /homeownership/mortgage-applications/{id}/return-to-draft — reprice or unwind a clearance"
      - "POST /homeownership/mortgage-applications/{id}/approve — commit the silent second under expected_program_version"
      - "POST /homeownership/mortgage-applications/{id}/deny"
      - "POST /homeownership/mortgage-applications/{id}/close — record the lien, resale restriction and households-served count"
      - "GET /homeownership/mortgage-applications/{id}/structure-preview"
    shared_operations:
      - "POST /homeownership/mortgage-applications/{id}/lien-actions (with ProgramAdmin)"
      - "GET on households, enrollments, entries, sites, cost entries and grant awards"
    notes: "Segregation of duties: ERR_SEGREGATION_OF_DUTIES rejects an approve whose X-User-ID matches the identity that submitted the same application to underwriting, so structuring and approval always sit with different officers. The officer cannot alter the household's verified income or its sweat equity ledger, both of which the structure depends on."

  - name: ConstructionManager
    description: "Construction and site safety manager: owns lot readiness, the safety hold, shift scheduling, skilled trade coordination, attendance and donated-material cost capture"
    identity: "opaque"
    exclusive_operations:
      - "POST /homeownership/build-sites/{id}/safety-posture — place or release the site safety hold and cascade cancellations"
      - "POST /homeownership/construction-shifts — schedule a shift under the closed 60-minute site buffer"
      - "POST /homeownership/construction-shifts/{id}/open, /lock, /complete and /cancel"
      - "POST /homeownership/shift-assignments/{id}/check-in — the attendance record that decides COMPLETED versus NO_SHOW"
    shared_operations:
      - "POST /homeownership/build-sites/{id}/readiness-advance (with ProgramAdmin)"
      - "POST /homeownership/cost-entries and POST /homeownership/volunteers (with ProgramAdmin)"
      - "POST /homeownership/sweat-equity-entries/{id}/verification (with FamilyServicesCoordinator)"
      - "POST /homeownership/shift-assignments, /confirm and /cancel (with Volunteer and Applicant)"
      - "GET on sites, cost entries, shifts, volunteers, assignments and sweat equity entries"
    notes: "Segregation of duties: the manager may verify construction hours it witnessed but may not credit them to the ledger (FamilyServicesCoordinator holds that step), and has no access to selection scoring or mortgage structuring."

  - name: Applicant
    description: "Partner-family applicant acting on its own household file: submits the application, adds household members, claims sweat equity hours and takes partner-family seats on shifts"
    identity: "entity_backed:ApplicantHousehold"
    exclusive_operations:
      - "POST /homeownership/sweat-equity-entries/{id}/resubmit — correct and resubmit a rejected hour claim"
    shared_operations:
      - "POST /homeownership/households/{id}/submit (with FamilyServicesCoordinator)"
      - "POST /homeownership/household-members (with FamilyServicesCoordinator)"
      - "POST /homeownership/sweat-equity-entries (with FamilyServicesCoordinator)"
      - "POST /homeownership/shift-assignments, /confirm and /cancel for HOMEOWNER_PARTNER seats (with ConstructionManager and Volunteer)"
      - "GET on its own household, members, reviews, entries, enrollments, assignments and mortgage applications, plus GET /homeownership/construction-shifts"
    notes: "X-User-ID is the ApplicantHousehold.id. Every addressed row must resolve to that household through household_id (directly, or through HouseholdMember.household_id for a member or partner seat) or the request fails with ERR_NOT_RESOURCE_OWNER. An Applicant can never verify or credit its own hours, score itself, or read another household's file."

  - name: Volunteer
    description: "Construction volunteer or skilled tradesperson taking general and trade seats on open shifts"
    identity: "entity_backed:VolunteerProfile"
    exclusive_operations: []
    shared_operations:
      - "POST /homeownership/shift-assignments, /confirm and /cancel for GENERAL_VOLUNTEER and SKILLED_TRADE seats (with ConstructionManager and Applicant)"
      - "GET /homeownership/volunteers, GET /homeownership/volunteers/{id}, GET /homeownership/construction-shifts, GET /homeownership/construction-shifts/{id}, GET /homeownership/shift-assignments and GET /homeownership/shift-assignments/{id}"
    notes: "X-User-ID is the VolunteerProfile.id; a seat request naming any other volunteer_id fails with ERR_NOT_RESOURCE_OWNER. The role holds no exclusive operation: every write it performs is one a ConstructionManager may also perform on its behalf. It cannot check itself in — attendance is the manager's custody — which is what makes the NO_SHOW strike ladder trustworthy."
