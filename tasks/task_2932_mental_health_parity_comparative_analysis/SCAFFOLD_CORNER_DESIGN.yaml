              captures: { pt_second_id: $.data.id }
          assert:
            - "after the first test: ParityTest.${pt_first_id}.substantially_all_met == true, predominant_level == 20, mh_level_value == 30, result == FAIL, advisory_only == false"
            - "after the first test: PlanYear.${py_id}.failing_parity_test_count == 1, compliance_posture == VIOLATION, status == REMEDIATION"
            - "after the rerun: ParityTest.${pt_first_id}.status == SUPERSEDED and ParityTest.${pt_second_id}.status == COMPUTED"
            - "ParityTest.${pt_second_id}.mh_level_value == 30 and result == FAIL (the replacement MH row keeps level 30; only its weights changed)"
            - "GET /parity/classifications/${cls_id}/parity-tests?status=COMPUTED returns total_count == 1"
            - "PlanYear.${py_id}.failing_parity_test_count == 1 (the superseded test no longer counts, the new one does)"

      - name: cap_closure_completed_remediates_the_item_and_issues_a_correction_notice
        claim_type: Side Effect Execution
