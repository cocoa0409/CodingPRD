            - call: "POST /ig/retention-rules/${inc}/activate"
              payload: {}
              as: RecordsManager
            - call: "POST /ig/retention-rules"
              payload: { program_id: "${p}", record_class_id: "${cl}", jurisdiction_id: "${jur}", rule_code: "R-CH", retention_months: 120, trigger_basis: "EVENT_DATE", effective_from: "2020-01-01T00:00:00Z" }
              as: RecordsManager
              captures: { ch: "$.data.id" }
            - call: "POST /ig/retention-rules/${ch}/activate"
              payload: {}
              as: RecordsManager
            - call: "GET /ig/retention-conflicts?challenger_rule_id=${ch}&status=OPEN"
              payload: {}
              as: RecordsManager
              captures: { conf: "$.data[0].id" }
          trigger:
