          assert:
            - "First trigger call: HTTP 409 with ${err_submit_id} == ERR_INVALID_PLATFORM_STATE"
            - "Second trigger call: HTTP 409 with ${err_retire_id} == ERR_INVALID_PLATFORM_STATE"
            - "ProductPlatform.${plat_id}.status == RETIRED and revision_round == 1 - neither refused call advanced anything"
            - "ProductPlatform.${plat_id}.salable_region_count == 0"

      - name: c_second_platform_release_returns_state_error
