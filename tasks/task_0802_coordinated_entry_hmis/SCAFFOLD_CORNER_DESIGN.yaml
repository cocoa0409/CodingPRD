  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: occ_reservation_create_stale_shelter_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-shelter]", "errors[ERR_STALE_VERSION]", "validations[priority=6]"]
        distinguishing_aspect: "A reservation create carrying a shelter version captured before another reservation consumed a bed is rejected with ERR_STALE_VERSION (412); two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Shelter with 2 beds; client A and client B; shelter version captured, then A books (version advances)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Occ A", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Occ B", dob: "1990-02-02" }
              as: IntakeSpecialist
              captures: { cb: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Occ ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { b1: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B2" }
              as: ShelterManager
              captures: { b2: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv0: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv0}" }
              as: ShelterManager
              captures: { resa: $.data.id }
          trigger:
            - call: "POST /bed-reservations"
              payload: { client_id: "${cb}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv0}" }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.status == 412"

      - name: occ_reservation_create_fresh_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-shelter]", entities.Shelter.fields.version]
        distinguishing_aspect: "A reservation create carrying the current shelter version succeeds (201) and advances Shelter.version by 1."
        test_recipe:
          setup: ["Shelter with 1 bed; version freshly read immediately before booking."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Fresh V", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Fresh ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
          trigger:
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
          assert:
            - "response.status == 201"
            - "BedReservation.${res}.status == RESERVED"

      - name: selector_bed_assignment_created_at_tiebreak
        claim_type: selector_policy
        grounds: [calculations.bed_assignment, entities.BedReservation.fields.bed_id]
        distinguishing_aspect: "With two eligible beds, the reservation is assigned the earlier-created bed (created_at ASC, id never used) — bed_id equals the first bed added."
        test_recipe:
          setup: ["Shelter with beds B1 (created first) then B2; one client."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Sel Client", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Sel ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { b1: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B2" }
              as: ShelterManager
              captures: { b2: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
          trigger:
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id, assigned: $.data.bed_id }
          assert:
            - "BedReservation.${res}.bed_id == ${b1}"

