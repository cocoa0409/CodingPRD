      - name: closure_checks_the_calendar_before_it_counts_the_cycles
        claim_type: priority_conflict
        grounds:
          - errors[ERR_WINDOW_NOT_REACHED]
          - errors[ERR_CYCLE_STILL_SCHEDULED]
          - errors[ERR_INVALID_PERIOD_STATE]
          - validations[priority=10][error_id=ERR_WINDOW_NOT_REACHED]
          - validations[priority=11][error_id=ERR_CYCLE_STILL_SCHEDULED]
        distinguishing_aspect: |
          The first closure attempt violates a priority-10 temporal rule and a priority-11 constraint
          simultaneously - the window has not elapsed AND a cycle is still SCHEDULED - so the temporal
          error must win. Only after the clock reaches window_end does the cycle backlog become the
          reported problem, and once the period is RECONCILING a repeat closure is a state error.
