              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_l_id: $.data.id, claim_l_v: $.data.version }
            - call: "POST /claims/${claim_l_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_l_id}/reprice"
              payload: { expected_claim_version: "${claim_l_v} + 1" }
