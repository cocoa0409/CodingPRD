            - "SettlementOffer.${off_b_id}.exposure_cents == 200000, the REINSTATEMENT floor, because max(200000, 3500 * 40) selects the floor arm"
            - "SettlementOffer.${off_b_id}.authority_tier == DIRECTOR"
