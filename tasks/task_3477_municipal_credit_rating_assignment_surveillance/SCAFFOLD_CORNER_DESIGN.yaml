        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rating-action-stale-rating]
          - errors[ERR_STALE_RATING_VERSION]
        distinguishing_aspect: "Two strictly sequential rating actions carrying the same expected_rating_version: the DOWNGRADE succeeds (version 2 -> 3), the AFFIRM replaying version 2 is rejected 412 ERR_STALE_RATING_VERSION."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. GO rating PUBLISHED with notch A and version 2 (created 1 at committee close, publish 2); posture CURRENT."
          setup_api_calls:
