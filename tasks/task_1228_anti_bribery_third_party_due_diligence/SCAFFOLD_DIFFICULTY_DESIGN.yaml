            - "PaymentRequest.payment_status remains BLOCKED"

      - name: gift_sanctioned_safety_beats_event_in_past
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_COUNTRY_SANCTIONED]
          - errors[ERR_EVENT_IN_PAST]
        distinguishing_aspect: |
          Category pair business_safety-vs-business_temporal (different pair than the
          state/fiscal instance): a gift entry for a government official of a
          sanctioned-country third party whose event_date is also in the past returns
          ERR_COUNTRY_SANCTIONED (priority 6), never ERR_EVENT_IN_PAST (priority 7).
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country IR cpi_score=36 sanctioned=true"
            - "ThirdParty IR-CO (CONSULTING/DIRECT) submitted; sanction-score override 100/CRITICAL applies at submit; screenings CLEAR -> DD_REVIEW (score override alone raises no red flag)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "IR", cpi_score: 36, sanctioned: true }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "IR Consulting", country_code: "IR", industry: "CONSULTING", government_touchpoint: "DIRECT" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { chk_pep: "$.data[0].id", chk_am: "$.data[1].id", chk_san: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${chk_pep}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_am}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${chk_san}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
          trigger:
            - { call: "POST /compliance/third-parties/${tp_id}/gift-hospitality-entries", payload: { entry_type: "HOSPITALITY", recipient_is_government_official: true, value_cents: 5000, fx_rate_to_usd: 1.0, event_date: "2026-04-01" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_COUNTRY_SANCTIONED — priority-6 safety check beats the priority-7 temporal check even though event_date 2026-04-01 < 2026-05-01 also violates it"
            - "No GiftHospitalityEntry is persisted (GET list returns empty array)"

  - rule_id: boundary_precision_check
    instances:
      - name: risk_tier_boundary_69_medium_vs_70_high
        grounds:
          - calculations.third_party_risk_score
          - entities.ThirdParty.fields.risk_tier
        distinguishing_aspect: |
          Metric = risk score, endpoint = submit. tier_high_min uses an inclusive >=
          boundary: score 69 (CPI 44 / CONSTRUCTION / DIRECT) is MEDIUM while score 70
          (CPI 36 / CONSULTING / DIRECT) is HIGH.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; countries VE (cpi 44) and CU (cpi 36)"
            - "TP-VE CONSTRUCTION(70)/DIRECT(100): (50*56 + 30*70 + 20*100)/100 = (2800+2100+2000)/100 = 69"
            - "TP-CU CONSULTING(60)/DIRECT(100): (50*64 + 30*60 + 20*100)/100 = (3200+1800+2000)/100 = 70"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "VE", cpi_score: 44 }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "CU", cpi_score: 36 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "VE Builders", country_code: "VE", industry: "CONSTRUCTION", government_touchpoint: "DIRECT" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp69: $.data.id } }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "CU Advisors", country_code: "CU", industry: "CONSULTING", government_touchpoint: "DIRECT" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp70: $.data.id } }
          trigger:
            - { call: "POST /compliance/third-parties/${tp69}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1", captures: { s69: $.data.risk_score_provisional, t69: $.data.risk_tier } }
            - { call: "POST /compliance/third-parties/${tp70}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1", captures: { s70: $.data.risk_score_provisional, t70: $.data.risk_tier } }
          assert:
            - "captured s69 == 69 and t69 == MEDIUM (69 < 70 does not reach the HIGH band)"
            - "captured s70 == 70 and t70 == HIGH (>= boundary is inclusive)"

      - name: gift_enhanced_threshold_24999_vs_25000
        grounds:
          - calculations.gift_rolling_window_total
          - entities.GiftHospitalityEntry.fields.requires_enhanced_approval
        distinguishing_aspect: |
          Metric = rolling USD cents (different metric than the risk score), endpoint = gift
          create/approve (different endpoint than submit). prospective_total 24999 does NOT
          require enhanced approval while exactly 25000 DOES (>= inclusive).
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country CH cpi_score=80; two third parties TP-A and TP-B in DD_REVIEW (screenings CLEAR)"
            - "Each has one APPROVED 20000-cent government-official entry (fx 1.0, event 2026-05-05); 20000 < 25000 so plain approval"
