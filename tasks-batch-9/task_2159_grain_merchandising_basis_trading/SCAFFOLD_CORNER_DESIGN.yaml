  - section: errors
    instances:
      - name: curing_an_unknown_margin_call_id_returns_margin_call_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_MARGIN_CALL_NOT_FOUND]
        distinguishing_aspect: "A cure against a well-formed but unknown margin call id is rejected at priority 3 with ERR_MARGIN_CALL_NOT_FOUND (404), before the payment amount is ever inspected."
        test_recipe:
          setup:
            - "One desk and no margin calls at all."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD45", name: "Corner Desk 45", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
          trigger:
            - call: "POST /grain/margin-calls/00000000-0000-4000-8000-000000000000/cure"
              payload: { payment_usd: 5000.00 }
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MARGIN_CALL_NOT_FOUND"
            - "the response status is 404"

      - name: unknown_path_ids_return_entity_specific_not_found_errors
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_DISCOUNT_SCHEDULE_NOT_FOUND]
          - errors[ERR_RISK_LIMIT_NOT_FOUND]
          - errors[ERR_PRICING_ORDER_NOT_FOUND]
          - errors[ERR_DELIVERY_TICKET_NOT_FOUND]
        distinguishing_aspect: "Priority 3 resolves the path id against the collection the path names, so the same unknown UUID yields four different domain-specific 404 codes depending on which single-resource read it is sent to."
        test_recipe:
          setup:
            - "One desk and nothing else; no schedules, limits, pricing orders or tickets exist."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD55", name: "Corner Desk 55", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
          trigger:
            - call: "GET /grain/discount-schedules/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { err_sched: $.data.error_id }
            - call: "GET /grain/risk-limits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { err_limit: $.data.error_id }
            - call: "GET /grain/pricing-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err_po: $.data.error_id }
            - call: "GET /grain/delivery-tickets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { err_tkt: $.data.error_id }
          assert:
            - "${err_sched} == ERR_DISCOUNT_SCHEDULE_NOT_FOUND"
            - "${err_limit} == ERR_RISK_LIMIT_NOT_FOUND"
            - "${err_po} == ERR_PRICING_ORDER_NOT_FOUND"
            - "${err_tkt} == ERR_DELIVERY_TICKET_NOT_FOUND"
            - "all four responses are HTTP 404 with response_type == error"

      - name: error_contract_not_active_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_apply_to_cancelled_contract
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_risk_limit_breach_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RISK_LIMIT_BREACH]
        excluded_because:
          difficulty_instance: boundary_precision_check / risk_limit_accepts_exactly_at_ceiling_rejects_one_bushel_over
          rationale: "Asserted as the one-bushel-over failure path of the named §1.8 boundary instance."

      - name: error_pricing_locked_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRICING_LOCKED]
        excluded_because:
          difficulty_instance: transitive_cascade / mark_to_market_calls_margin_freezes_desk_locks_contract_pricing
          rationale: "Asserted as hop 4's observable consequence in the named §1.8 cascade instance."

      - name: error_fleet_unavailable_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FLEET_UNAVAILABLE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rail_fleet_half_open_occupancy_with_turnaround_buffer
          rationale: "Asserted as the rejection half of the named §1.8 overlap instance."

      - name: error_location_capacity_exceeded_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LOCATION_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / elevator_intake_capacity_over_closed_interval_intersection
          rationale: "Asserted as the touching-endpoint rejection in the named §1.8 overlap instance."

      - name: error_bid_not_active_is_triggerable
