              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_naive_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_naive_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_naive_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_naive_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
