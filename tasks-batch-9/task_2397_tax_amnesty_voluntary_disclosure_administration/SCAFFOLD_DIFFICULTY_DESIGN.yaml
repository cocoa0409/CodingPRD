  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_cycles_three_counters_then_hits_counter_limit
        grounds:
          - state_machines.PreClearanceRequest.TERMS_OFFERED_to_COUNTERED
          - state_machines.PreClearanceRequest.COUNTERED_to_TERMS_OFFERED
          - validations[priority=31]
          - entities.PreClearanceRequest.fields.counter_count
        distinguishing_aspect: |
          Cyclic dimension: the request re-enters TERMS_OFFERED three times through
          COUNTERED (round_index climbs 1..7 on a single row) and the fourth counter is refused
          by the counter budget, not by a state guard — the request is still TERMS_OFFERED and
          negotiable by the state, so the loop terminates on a counter, not on reachability.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Representative Halloran has one UNDER_REVIEW pre-clearance for an anonymous client"
            - "Three full offer/counter cycles have already run and a fourth state offer stands, so counter_count is 3 and round_index is 7"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
