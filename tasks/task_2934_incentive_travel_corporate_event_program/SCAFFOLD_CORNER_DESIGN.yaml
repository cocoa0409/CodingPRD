      - call: POST /registrations/${ra_id}/respond
        payload:
          response: ACCEPT
        as: Participant
        as_user_id: ${qa_id}
      trigger:
      - POST /registrations/${ra_id}/confirm as TravelDesk td-01, and inspect that response body alone.
      - 'Immediately afterwards, with no delay: GET /qualifiers/${qa_id}, GET /programs/${p_id}, GET /supplier-contracts/${c1_id},
