            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-03", end_date: "2026-08-08", allocated_hours: 20.00 }
              as: SchedulingManager
              captures: { a1_id: $.data.id }
            - call: "GET /scheduling/engagement-phases/${ph1_id}"
