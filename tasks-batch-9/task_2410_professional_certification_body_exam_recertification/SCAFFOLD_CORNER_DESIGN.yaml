      - name: ceu_accrual_counts_only_approved_activities_and_ignores_rejected_and_unreviewed_ones
        claim_type: input_set_filtering
        grounds:
          - calculations.ceu_credit_accrual
          - state_machines.CEUActivity.SUBMITTED_to_APPROVED
          - state_machines.CEUActivity.SUBMITTED_to_REJECTED
          - entities.CEUActivity.fields.counted
          - entities.CEUActivity.computed_fields.credits_awarded
          - endpoints.POST_/ceu-activities/{id}/review
        distinguishing_aspect: |
          credits_awarded is stamped on every activity at submission, but the accrual input set
          is restricted to rows with counted == true: three activities each carrying an award
          (6.00, 12.00 and 12.00) leave the cycle at exactly 6.00 because only one was APPROVED.
