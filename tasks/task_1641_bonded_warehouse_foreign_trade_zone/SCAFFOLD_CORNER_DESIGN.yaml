              as: Importer
              as_user_id: "imp-1"
            - call: "POST /zones/admissions"
              payload: { zone_id: "${z}", description: "Dairy 2", hts_code: "0401.10", quantity: 5, unit_value_cents: 1000, zone_status: "NON_PRIVILEGED_FOREIGN" }
              as: Importer
              as_user_id: "imp-1"
              captures: { a2: "$.data.id" }
            - call: "POST /zones/admissions/${a2}/submit"
              as: Importer
              as_user_id: "imp-1"
          trigger:
            - call: "POST /zones/admissions/${a1}/admit"
              as: CustomsOfficer
              captures: { a1s: "$.data.status" }
            - call: "POST /zones/admissions/${a2}/admit"
              as: CustomsOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "A1 admitted: status == ADMITTED (250 <= 250; equality allowed)"
            - "A2 -> ERR_BOND_CAPACITY_EXCEEDED (http 402): 250 + 250 > 250"

