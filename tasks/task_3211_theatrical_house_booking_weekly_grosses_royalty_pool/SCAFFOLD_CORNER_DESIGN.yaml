            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_status: $.data.status }
          assert:
            - "Booking.${bk_id}.status == APPROVED at clock 2026-09-01 (before loadin)"
            - "After POST /_clock/set_current_utc to 2026-09-07, Booking.${bk_id}.status == ACTIVE (auto-transition at loadin_start with qualifying crew)"

  # ===========================================================================
  # Consistency model section
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_refund
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.weekly_gross_sum
        distinguishing_aspect: "Consistency is immediate: the refund response's TicketOrder shows REFUNDED and a same-request-chain GET on the covering DRAFT report already reflects the recomputed gross — no lag."
        test_recipe:
          setup: ["ACTIVE booking, DRAFT report with one SOLD order of 10000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "ImmCo", contact_email: "im@x.com" }
              as: HouseManager
              captures: { comp_id: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "BijouIm", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp_id}", title: "Show Im", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_id}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /theatres/bookings/${bk_id}/approve"
              payload: {}
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/license-agreements"
              payload: { weekly_rent_cents: 500000, stop_clause_weekly_floor_cents: 10000, stop_clause_consecutive_weeks: 2, expected_booking_version: "${bk_v}" }
              as: HouseManager
            - call: "GET /theatres/bookings/${bk_id}"
              payload: {}
              as: HouseManager
              captures: { bk_v2: $.data.version }
            - call: "GET /theatres/bookings/${bk_id}/license-agreements"
              payload: {}
              as: HouseManager
              captures: { lic_id: "$.data[0].id" }
            - call: "POST /theatres/license-agreements/${lic_id}/sign"
              payload: { expected_booking_version: "${bk_v2}" }
              as: CompanyRep
              as_user_id: "${comp_id}"
            - call: "POST /theatres/bookings/${bk_id}/crew-assignments"
              payload: { crew_size: 4 }
              as: HouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/bookings/${bk_id}/ticket-orders"
              payload: { performance_date: "2026-09-08T19:00:00Z", ticket_count: 2, is_group_sale: false, face_value_cents: 5000 }
              as: BoxOfficeAgent
              captures: { o_id: $.data.id }
            - call: "POST /theatres/bookings/${bk_id}/weekly-gross-reports"
              payload: { week_start: "2026-09-07T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /theatres/ticket-orders/${o_id}/refund"
              payload: {}
              as: BoxOfficeAgent
            - call: "GET /theatres/weekly-gross-reports/${rep_id}"
              payload: {}
              as: HouseManager
              captures: { rep_gross: $.data.gross_cents }
          assert:
            - "WeeklyGrossReport.${rep_id}.gross_cents == 0 immediately after the refund completes (no eventual-consistency lag)"
