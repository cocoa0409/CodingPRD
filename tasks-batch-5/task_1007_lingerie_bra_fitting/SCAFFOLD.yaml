# =============================================================================
# SCAFFOLD.yaml — Lingerie & Bra-Fitting Boutique (task_1007) — EXPERT
# §1.0–§1.7 (§1.8 and §1.9 live in sibling files)
# =============================================================================

scenario: |
  1007. Lingerie & Bra-Fitting Boutique: fitting appointment & size algorithm,
  SKU & band/cup matrix, post-surgical/mastectomy fitting & insurance, loyalty &
  replacement reminder, hygiene/exchange, special order, gift, inventory

domain_name: lingerie-bra-fitting
api_prefix: /boutique

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  difficulty: Expert
  primary_archetype: temporal_windowing          # fitter/room slot scheduling with overlap semantics
  secondary_archetype: quota_allocation           # SKU inventory reservation / release
  complexity_layers:
    - cascading_side_effects                       # exchange + cancel cascades across 3 entities
    - dual_variant_calculation                     # insurance estimate-vs-final; loyalty provisional-vs-final
    - optimistic_concurrency                       # OCC on FittingAppointment for re-fit supersede
    - rate_threshold_triggers                      # loyalty tiers, low-stock threshold, size-surcharge

  entity_topology: flat                            # peer collections under /boutique, FK references, no deep URL nesting
  state_machine_shape: parallel                    # Order carries payment_status x fulfillment_status independently
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                           # Customer / Fitter own distinct surfaces; StoreManager + BillingClerk operational
  consistency_model: immediate

  entity_count: 12
  endpoint_count: 44
  error_code_count: 30
  calculation_count: 8
  state_machine_count: 6
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email (unique)" }
      - { name: phone, type: string, source: input, description: "Contact phone", default: null }
      - { name: post_mastectomy_flag, type: boolean, source: input, default: false, description: "Marks the customer as a post-mastectomy client (informational; does not by itself grant insurance)" }
      - { name: loyalty_points, type: integer, source: system, default: 0, description: "Running loyalty points balance; equals sum of all LoyaltyEvent.points_delta for this customer (see calc loyalty_points_ledger)" }
      - { name: loyalty_tier, type: enum, source: computed, description: "Derived from loyalty_points: BRONZE|SILVER|GOLD (see calc loyalty_tier)", constraints: "BRONZE | SILVER | GOLD" }
      - { name: store_credit_cents, type: integer, source: system, default: 0, description: "Running store-credit balance in cents; incremented by exchange approval and insurance reimbursement" }

  - name: Fitter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Fitter full name" }
      - { name: post_surgical_certified, type: boolean, source: input, default: false, description: "True when the fitter holds post-surgical/mastectomy fitting certification" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive fitters cannot be assigned to appointments" }

  - name: FittingRoom
    parent: null
    common_fields: true
    fields:
      - { name: room_name, type: string, source: input, description: "Room label" }
      - { name: capacity, type: integer, source: input, description: "Maximum count of CONFIRMED appointments whose time intervals overlap that the room admits", constraints: ">= 1" }
      - { name: is_private, type: boolean, source: input, default: false, description: "Private room required for POST_SURGICAL/MASTECTOMY fittings" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive rooms cannot be booked" }

  - name: FittingAppointment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer being fitted" }
      - { name: fitter_id, type: string, source: input, description: "FK -> Fitter.id; the assigned fitter" }
      - { name: room_id, type: string, source: input, description: "FK -> FittingRoom.id; the booked room" }
      - { name: fitting_type, type: enum, source: input, description: "STANDARD | POST_SURGICAL | MASTECTOMY", constraints: "STANDARD | POST_SURGICAL | MASTECTOMY" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO-8601 UTC start instant of the fitting slot" }
      - { name: duration_minutes, type: integer, source: input, default: 30, description: "Slot length in minutes" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + duration_minutes" }
      - { name: underbust_cm, type: number, source: input, description: "Underbust measurement in cm; supplied on the fit action, not at booking", default: null }
      - { name: bust_cm, type: number, source: input, description: "Bust measurement in cm; supplied on the fit action", default: null }
      - { name: fit_preference, type: enum, source: input, default: "STANDARD", description: "SNUG | STANDARD | RELAXED band rounding preference; supplied on the fit action", constraints: "SNUG | STANDARD | RELAXED" }
      - { name: recommended_band, type: integer, source: computed, description: "Recommended band size (even integer, US) from calc bra_size_recommendation", default: null }
      - { name: recommended_cup, type: enum, source: computed, description: "Recommended cup letter A..H from calc bra_size_recommendation", default: null, constraints: "AA | A | B | C | D | E | F | G | H" }
      - { name: recommended_size, type: string, source: computed, description: "Concatenation of recommended_band and recommended_cup, e.g. '30D'", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle state (see state machine)", constraints: "REQUESTED | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: style_name, type: string, source: input, description: "Product style name" }
      - { name: brand, type: string, source: input, description: "Brand name" }
      - { name: category, type: enum, source: input, description: "EVERYDAY_BRA | SPORTS_BRA | MASTECTOMY_BRA | LINGERIE_SET", constraints: "EVERYDAY_BRA | SPORTS_BRA | MASTECTOMY_BRA | LINGERIE_SET" }
      - { name: base_price_cents, type: integer, source: input, description: "Base price in cents before per-size surcharge", constraints: ">= 0" }
      - { name: hygiene_class, type: enum, source: input, default: "STANDARD_RETURNABLE", description: "STANDARD_RETURNABLE (exchangeable when SEALED) | INTIMATE_NON_RETURNABLE (never exchangeable)", constraints: "STANDARD_RETURNABLE | INTIMATE_NON_RETURNABLE" }
      - { name: is_mastectomy, type: boolean, source: computed, description: "True iff category == MASTECTOMY_BRA; gates insurance eligibility" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive products cannot receive new order lines" }

  - name: SKU
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the parent product" }
      - { name: band_size, type: integer, source: input, description: "Band size (even integer, US)", constraints: "even, 28..44" }
      - { name: cup_size, type: enum, source: input, description: "Cup letter", constraints: "AA | A | B | C | D | E | F | G | H" }
      - { name: sku_code, type: string, source: input, description: "Human-readable SKU code (unique)" }
      - { name: price_cents, type: integer, source: computed, description: "product.base_price_cents + extended-size surcharge (see calc sku_price)" }
      - { name: stock_on_hand, type: integer, source: system, default: 0, description: "Physical units in inventory; set by initial_stock and mutated by restock, fulfillment (decrement) and exchange restock (increment)" }
      - { name: reserved_count, type: integer, source: computed, description: "Sum of quantity across all OrderLine rows for this SKU whose status == ACTIVE on a PLACED order (see calc sku_reserved_count)" }
      - { name: available_units, type: integer, source: computed, description: "stock_on_hand - reserved_count; the conserved inventory quantity" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive SKUs reject new standard order lines" }
      - { name: stock_status, type: enum, source: computed, description: "IN_STOCK | LOW_STOCK | OUT_OF_STOCK derived from available_units (see calc sku_stock_status)", constraints: "IN_STOCK | LOW_STOCK | OUT_OF_STOCK" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the purchasing customer" }
      - { name: order_type, type: enum, source: input, default: "STANDARD", description: "STANDARD (in-stock) | SPECIAL_ORDER (permits out-of-stock lines, adds special-order fee) | GIFT", constraints: "STANDARD | SPECIAL_ORDER | GIFT" }
      - { name: is_gift, type: boolean, source: input, default: false, description: "When true, a gift-wrap fee applies and gift fields are recorded" }
      - { name: gift_message, type: string, source: input, default: null, description: "Optional gift note" }
      - { name: gift_recipient_name, type: string, source: input, default: null, description: "Optional gift recipient name" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension (see state machine): UNPAID | PAID | REFUNDED", constraints: "UNPAID | PAID | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment dimension (see state machine): DRAFT | PLACED | FULFILLED | CANCELLED", constraints: "DRAFT | PLACED | FULFILLED | CANCELLED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_gross_cents over ACTIVE lines, computed at pay (see calc order_totals)" }
      - { name: discount_cents, type: integer, source: computed, description: "Sum of per-line rounded loyalty discounts at pay (see calc order_totals)" }
      - { name: gift_wrap_fee_cents, type: integer, source: computed, description: "GIFT_WRAP_FEE_CENTS when is_gift else 0" }
      - { name: special_order_fee_cents, type: integer, source: computed, description: "SPECIAL_ORDER_FEE_CENTS when order_type == SPECIAL_ORDER else 0" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + gift_wrap_fee_cents + special_order_fee_cents" }
      - { name: provisional_points, type: integer, source: computed, description: "Loyalty points estimated at pay (see calc loyalty_points_earned, PROVISIONAL variant)", default: 0 }
      - { name: final_points, type: integer, source: computed, description: "Loyalty points finalized at fulfillment (see calc loyalty_points_earned, FINAL variant)", default: 0 }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical-clock instant stamped when fulfillment_status becomes FULFILLED", default: null }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the parent order" }
      - { name: sku_id, type: string, source: input, description: "FK -> SKU.id; the ordered SKU" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of SKU.price_cents captured when the line is added" }
      - { name: line_gross_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: line_discount_cents, type: integer, source: computed, description: "round_half_up(line_gross_cents * tier_discount_pct) at pay" }
      - { name: line_net_cents, type: integer, source: computed, description: "line_gross_cents - line_discount_cents" }
      - { name: is_special_order, type: boolean, source: computed, description: "True when the line was added against an out-of-stock SKU on a SPECIAL_ORDER order (no reservation taken)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED | FULFILLED | EXCHANGED", constraints: "ACTIVE | CANCELLED | FULFILLED | EXCHANGED" }

  - name: Exchange
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the original order" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line being exchanged/returned" }
      - { name: item_condition, type: enum, source: input, description: "SEALED | TRIED_ON | WORN; only SEALED items on STANDARD_RETURNABLE products are exchangeable", constraints: "SEALED | TRIED_ON | WORN" }
      - { name: reason, type: string, source: input, default: null, description: "Free-text reason" }
      - { name: store_credit_issued_cents, type: integer, source: computed, description: "line_net_cents of the exchanged line, credited to the customer on approval", default: 0 }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED", constraints: "REQUESTED | APPROVED | REJECTED" }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; a PAID order containing at least one mastectomy line" }
      - { name: claim_amount_cents, type: integer, source: computed, description: "Sum of line_net_cents over the order's mastectomy lines, snapshotted at submit" }
      - { name: adjudicated_amount_cents, type: integer, source: input, default: null, description: "Insurer-approved eligible amount supplied on adjudicate APPROVE; null until then" }
      - { name: decision, type: enum, source: system, description: "PENDING | APPROVE | DENY set by adjudicate", default: "PENDING", constraints: "PENDING | APPROVE | DENY" }
      - { name: covered_amount_cents, type: integer, source: computed, description: "Estimate at submit = min(claim_amount_cents*COVERAGE_PCT, CAP); final at APPROVE = min(adjudicated_amount_cents*COVERAGE_PCT, CAP) (see calc insurance_coverage)" }
      - { name: reimbursed_cents, type: integer, source: computed, description: "covered_amount_cents transferred to customer store credit on reimburse", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | REIMBURSED", constraints: "SUBMITTED | APPROVED | DENIED | REIMBURSED" }

  - name: ReplacementReminder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer to remind" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the fulfilled bra line that seeded this reminder" }
      - { name: due_date, type: datetime, source: computed, description: "order.fulfilled_at + REPLACEMENT_INTERVAL_MONTHS" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SENT | DISMISSED | CANCELLED", constraints: "SCHEDULED | SENT | DISMISSED | CANCELLED" }

  - name: LoyaltyEvent
    parent: null
    common_fields: false        # append-only ledger row: id + created_at only
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the affected customer" }
      - { name: points_delta, type: integer, source: input, description: "Signed points change; positive on earn, negative on reversal" }
      - { name: reason, type: enum, source: input, description: "ORDER_EARN | ORDER_REVERSAL | FINAL_ADJUSTMENT | EXCHANGE_REVERSAL | PROMOTION | CORRECTION", constraints: "ORDER_EARN | ORDER_REVERSAL | FINAL_ADJUSTMENT | EXCHANGE_REVERSAL | PROMOTION | CORRECTION" }
      - { name: order_id, type: string, source: input, default: null, description: "FK -> Order.id; the order that produced this event, when applicable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: FittingAppointment
    field: status
    shape: cyclic                         # CONFIRMED -> REQUESTED reschedule loop
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /boutique/appointments/{id}/confirm"
        actor: Fitter
        preconditions:
          - "Fitter.is_active == true"
          - "FittingRoom.is_active == true"
          - "BUSINESS_SAFETY: if fitting_type IN {POST_SURGICAL, MASTECTOMY} then Fitter.post_surgical_certified == true (else ERR_FITTER_NOT_CERTIFIED)"
          - "BUSINESS_SAFETY: if fitting_type IN {POST_SURGICAL, MASTECTOMY} then FittingRoom.is_private == true (else ERR_ROOM_NOT_PRIVATE)"
          - "BUSINESS_CONSTRAINT: no other CONFIRMED/CHECKED_IN appointment on the same fitter_id whose buffered interval overlaps (see calc fitter_slot_overlap; else ERR_FITTER_DOUBLE_BOOKED)"
          - "BUSINESS_CONSTRAINT: count of CONFIRMED/CHECKED_IN appointments on the same room_id whose interval overlaps < FittingRoom.capacity (see calc room_capacity_overlap; else ERR_ROOM_AT_CAPACITY)"
        side_effects:
          - "Locks the fitter+room+time slot for this appointment"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /boutique/appointments/{id}/check-in"
        actor: Fitter
        preconditions: []
        side_effects: []
      - from: CHECKED_IN
        to: CHECKED_IN
        trigger: "POST /boutique/appointments/{id}/fit  (self-transition; re-fit supersedes prior recommendation)"
        actor: Fitter
        preconditions:
          - "expected_appointment_version matches FittingAppointment.version (else ERR_STALE_APPOINTMENT_VERSION)"
          - "underbust_cm and bust_cm within measurement range (else ERR_MEASUREMENT_OUT_OF_RANGE)"
        side_effects:
          - "Runs calc bra_size_recommendation; sets recommended_band, recommended_cup, recommended_size"
          - "increments FittingAppointment.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /boutique/appointments/{id}/complete"
        actor: Fitter
        preconditions:
          - "recommended_size != null (a fit must have been submitted; else ERR_FIT_NOT_SUBMITTED)"
        side_effects: []
      - from: CONFIRMED
        to: REQUESTED
        trigger: "POST /boutique/appointments/{id}/reschedule"
        actor: Customer
        preconditions: []
        side_effects:
          - "Releases the slot lock; scheduled_start updated if provided; re-confirmation required"
        note: "Cyclic revision loop CONFIRMED -> REQUESTED -> CONFIRMED"
      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /boutique/appointments/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "Releases the slot lock"

  # ---------------------------------------------------------------------------
  - entity: Order
    field: "payment_status x fulfillment_status (parallel dimensions)"
    shape: parallel
    initial_state: "UNPAID / DRAFT"
    terminal_states: ["REFUNDED / CANCELLED", "PAID / FULFILLED"]
    transitions:
      # -- fulfillment dimension --
      - from: "DRAFT"
        to: "PLACED"
        trigger: "POST /boutique/orders/{id}/place"
        actor: Customer
        preconditions:
          - "Order has >= 1 ACTIVE OrderLine (else ERR_EMPTY_ORDER)"
          - "BUSINESS_REFERENTIAL: for each ACTIVE non-special line, SKU.is_active == true (else ERR_SKU_INACTIVE)"
          - "BUSINESS_FISCAL: for each ACTIVE non-special line, SKU.available_units >= line.quantity (else ERR_INSUFFICIENT_STOCK). available_units == 0 rejects any reservation"
        side_effects:
          - "For each in-stock line: SKU.reserved_count recomputed upward (calc sku_reserved_count), SKU.available_units and stock_status recomputed"
          - "fulfillment_status -> PLACED"
      - from: "PLACED"
        to: "FULFILLED"
        trigger: "POST /boutique/orders/{id}/fulfill"
        actor: StoreManager
        preconditions:
          - "payment_status == PAID (cross-dimension guard; else ERR_ORDER_NOT_PAID)"
        side_effects:
          - "For each ACTIVE line: SKU.stock_on_hand -= quantity; reserved_count/available_units/stock_status recomputed; line.status -> FULFILLED"
          - "fulfilled_at stamped from logical clock"
          - "Runs calc loyalty_points_earned FINAL variant; final_points set; LoyaltyEvent(reason=FINAL_ADJUSTMENT, delta=final_points-provisional_points) appended; customer.loyalty_points updated"
          - "For each FULFILLED line whose product.category IN {EVERYDAY_BRA, SPORTS_BRA, MASTECTOMY_BRA}: create ReplacementReminder(status=SCHEDULED, due_date=fulfilled_at+REPLACEMENT_INTERVAL_MONTHS)"
      - from: ["DRAFT", "PLACED"]
        to: "CANCELLED"
        trigger: "POST /boutique/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "fulfillment_status IN {DRAFT, PLACED} (a FULFILLED order cannot be cancelled; else ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "CASCADE: each ACTIVE OrderLine -> CANCELLED"
          - "each line cancellation releases its reservation: SKU.reserved_count recomputed downward, available_units/stock_status recomputed"
          - "If payment_status == PAID: payment_status -> REFUNDED; reverse provisional loyalty: LoyaltyEvent(reason=ORDER_REVERSAL, delta=-provisional_points); customer.loyalty_points updated (conservation: returns to pre-order value)"
      # -- payment dimension --
      - from: "UNPAID"
        to: "PAID"
        trigger: "POST /boutique/orders/{id}/pay"
        actor: BillingClerk
        preconditions:
          - "fulfillment_status == PLACED (must place before pay; else ERR_ORDER_NOT_PLACED)"
        side_effects:
          - "Runs calc order_totals: subtotal_cents, discount_cents, fees, total_cents"
          - "Runs calc loyalty_points_earned PROVISIONAL variant; provisional_points set; LoyaltyEvent(reason=ORDER_EARN, delta=provisional_points) appended; customer.loyalty_points updated"
          - "payment_status -> PAID"

  # ---------------------------------------------------------------------------
  - entity: SKU
    field: stock_status
    shape: compound                        # threshold-derived on available_units
    initial_state: OUT_OF_STOCK
    terminal_states: []
    transitions:
      - from: [OUT_OF_STOCK, LOW_STOCK, IN_STOCK]
        to: IN_STOCK
        trigger: "system: available_units > LOW_STOCK_THRESHOLD after any stock/reservation change"
        actor: system
        preconditions: []
        side_effects: []
      - from: [OUT_OF_STOCK, LOW_STOCK, IN_STOCK]
        to: LOW_STOCK
        trigger: "system: 0 < available_units <= LOW_STOCK_THRESHOLD"
        actor: system
        preconditions: []
        side_effects: []
      - from: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
        to: OUT_OF_STOCK
        trigger: "system: available_units == 0"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: Exchange
    field: status
    shape: branching
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /boutique/exchanges/{id}/approve"
        actor: StoreManager
        preconditions:
          - "STATE: OrderLine.status == FULFILLED (else ERR_LINE_NOT_EXCHANGEABLE_STATE)"
          - "BUSINESS_SAFETY: item_condition == SEALED AND product.hygiene_class == STANDARD_RETURNABLE (else ERR_ITEM_NOT_EXCHANGEABLE_HYGIENE)"
          - "BUSINESS_TEMPORAL: (clock_now - order.fulfilled_at) <= EXCHANGE_WINDOW_DAYS (else ERR_EXCHANGE_WINDOW_EXPIRED)"
        side_effects:
          - "CASCADE hop1: OrderLine.status -> EXCHANGED"
          - "CASCADE hop2 (caused by line -> EXCHANGED): SKU.stock_on_hand += quantity; reserved_count/available_units recomputed"
          - "CASCADE hop3 (caused by available_units change): SKU.stock_status recomputed (OUT_OF_STOCK -> LOW_STOCK/IN_STOCK when it rises above 0)"
          - "store_credit_issued_cents = line_net_cents; customer.store_credit_cents += store_credit_issued_cents"
          - "Reverse earned points for the line: LoyaltyEvent(reason=EXCHANGE_REVERSAL, delta computed for the line); customer.loyalty_points updated"
          - "Any SCHEDULED ReplacementReminder for this order_line_id -> CANCELLED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /boutique/exchanges/{id}/reject"
        actor: StoreManager
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: InsuranceClaim
    field: status
    shape: cyclic                          # DENIED -> SUBMITTED resubmit loop
    initial_state: SUBMITTED
    terminal_states: [REIMBURSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /boutique/insurance-claims/{id}/adjudicate (decision=APPROVE)"
        actor: BillingClerk
        preconditions:
          - "adjudicated_amount_cents provided and >= 0 (else ERR_VALIDATION)"
        side_effects:
          - "Runs calc insurance_coverage FINAL variant over adjudicated_amount_cents; covered_amount_cents updated"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /boutique/insurance-claims/{id}/adjudicate (decision=DENY)"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "covered_amount_cents set to 0"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /boutique/insurance-claims/{id}/resubmit"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "decision -> PENDING; covered_amount_cents recomputed as ESTIMATE (calc insurance_coverage ESTIMATE variant)"
        note: "Cyclic loop DENIED -> SUBMITTED -> (APPROVED|DENIED)"
      - from: APPROVED
        to: REIMBURSED
        trigger: "POST /boutique/insurance-claims/{id}/reimburse"
        actor: BillingClerk
        preconditions:
          - "covered_amount_cents > 0 (else ERR_NOTHING_TO_REIMBURSE)"
        side_effects:
          - "reimbursed_cents = covered_amount_cents; customer.store_credit_cents += reimbursed_cents"

  # ---------------------------------------------------------------------------
  - entity: ReplacementReminder
    field: status
    shape: linear
    initial_state: SCHEDULED
    terminal_states: [DISMISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SENT
        trigger: "POST /boutique/reminders/{id}/send"
        actor: StoreManager
        preconditions:
          - "BUSINESS_TEMPORAL: clock_now >= due_date (else ERR_REMINDER_NOT_DUE)"
        side_effects: []
      - from: [SCHEDULED, SENT]
        to: DISMISSED
        trigger: "POST /boutique/reminders/{id}/dismiss"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: parent OrderLine cancelled or exchanged"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: refit-supersede-stale-appointment
    parent_entity: FittingAppointment
    write_endpoint: "POST /boutique/appointments/{id}/fit"
    occ_field: "expected_appointment_version"
    description: |
      Submitting a fit (measurements + recommendation) against a FittingAppointment
      whose version has advanced since the client last observed it is rejected. A
      re-fit legitimately supersedes the prior recommendation, so a second submit
      would itself succeed under natural product semantics; the OCC check rejects a
      submit whose expected_appointment_version is stale because another re-fit has
      already advanced the appointment's version.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bra_size_recommendation
    trigger: "POST /boutique/appointments/{id}/fit"
    algorithm: weighted_scoring            # non-linear branch selection + tiered cup letter
    formula: |
      # Inputs: underbust_cm, bust_cm, fit_preference (3 inputs, non-linear interaction)
      raw_band = underbust_cm / CM_PER_INCH
      half = raw_band / 2.0
      if   fit_preference == "SNUG":     recommended_band = floor(half) * 2
      elif fit_preference == "RELAXED":  recommended_band = ceil(half)  * 2
      else:                              recommended_band = round_half_up(half) * 2   # STANDARD
      cup_diff_cm = bust_cm - underbust_cm
      cup_index = ceil(cup_diff_cm / CUP_STEP_CM)          # smallest integer >= diff/step
      if cup_index < 1 or cup_index > 8: reject ERR_MEASUREMENT_OUT_OF_RANGE
      recommended_cup = CUP_LETTERS[cup_index]             # 1->A ... 8->H
      recommended_size = str(recommended_band) + recommended_cup
    input_set: "The single appointment's own supplied measurements; no cross-entity aggregation"
    constants:
      CM_PER_INCH: 2.54
      CUP_STEP_CM: 2.5
      CUP_LETTERS: { 1: A, 2: B, 3: C, 4: D, 5: E, 6: F, 7: G, 8: H }
      UNDERBUST_MIN_CM: 55
      UNDERBUST_MAX_CM: 120
      BUST_MIN_CM: 60
      BUST_MAX_CM: 170
    precision: "band is an even integer; cup_index uses ceil; band rounding uses round_half_up only for STANDARD"

  - name: sku_price
    trigger: "POST /boutique/skus (create); recomputed if base_price changes"
    algorithm: threshold
    formula: |
      surcharge = SIZE_SURCHARGE_CENTS if (band_size >= EXTENDED_BAND_MIN or CUP_LETTERS_INDEX[cup_size] >= EXTENDED_CUP_MIN_INDEX) else 0
      price_cents = product.base_price_cents + surcharge
    input_set: "SKU's own band/cup and its parent product's base_price_cents"
    constants:
      SIZE_SURCHARGE_CENTS: 500
      EXTENDED_BAND_MIN: 40
      EXTENDED_CUP_MIN_INDEX: 6            # F and larger
    precision: "integer cents"

  - name: order_totals
    trigger: "POST /boutique/orders/{id}/pay"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): per-line rounding order is PINNED as
      # 'round each line discount, THEN sum'. Summing then rounding is WRONG.
      tier_pct = TIER_DISCOUNT_PCT[customer.loyalty_tier]         # snapshot at pay
      subtotal_cents = 0; discount_cents = 0
      for line in ACTIVE lines (status == ACTIVE):
        line_gross_cents = line.unit_price_cents * line.quantity
        line_discount_cents = round_half_up(line_gross_cents * tier_pct)   # ROUND PER LINE
        line_net_cents = line_gross_cents - line_discount_cents
        subtotal_cents += line_gross_cents
        discount_cents  += line_discount_cents                            # THEN SUM
      gift_wrap_fee_cents     = GIFT_WRAP_FEE_CENTS     if order.is_gift else 0
      special_order_fee_cents = SPECIAL_ORDER_FEE_CENTS if order.order_type == "SPECIAL_ORDER" else 0
      total_cents = subtotal_cents - discount_cents + gift_wrap_fee_cents + special_order_fee_cents
    input_set: "Order's ACTIVE lines at pay time; customer tier snapshot at pay"
    constants:
      TIER_DISCOUNT_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10 }
      GIFT_WRAP_FEE_CENTS: 800
      SPECIAL_ORDER_FEE_CENTS: 1500
    precision: "cents; round_half_up applied per line before summation (order pinned)"

  - name: loyalty_points_earned
    trigger: "pay (PROVISIONAL) and fulfill (FINAL)"
    algorithm: threshold
    formula: |
      base_points = floor(order.total_cents / POINTS_DIVISOR_CENTS)
    input_set: "Order.total_cents and customer.loyalty_tier snapshot"
    constants:
      POINTS_DIVISOR_CENTS: 100
      TIER_MULTIPLIER: { BRONZE: 1, SILVER: 1, GOLD: 2 }
    precision: "integer points; floor on division"
    variants:
      - name: PROVISIONAL
        when: "at pay"
        difference: "provisional_points = base_points (no tier multiplier applied yet)"
      - name: FINAL
        when: "at fulfillment"
        difference: "final_points = base_points * TIER_MULTIPLIER[tier]; reconciliation delta (final_points - provisional_points) appended as a FINAL_ADJUSTMENT LoyaltyEvent"

  - name: insurance_coverage
    trigger: "insurance-claims submit (ESTIMATE) and adjudicate APPROVE (FINAL)"
    algorithm: threshold
    formula: |
      covered_amount_cents = min(round_half_up(base_amount_cents * COVERAGE_PCT), COVERAGE_CAP_CENTS)
    input_set: "A single claim's base amount"
    constants:
      COVERAGE_PCT: 0.80
      COVERAGE_CAP_CENTS: 50000
    precision: "integer cents; round_half_up before cap"
    variants:
      - name: ESTIMATE
        when: "at submit (and on resubmit)"
        difference: "base_amount_cents = claim_amount_cents (sum of order mastectomy line_net_cents)"
      - name: FINAL
        when: "at adjudicate APPROVE"
        difference: "base_amount_cents = adjudicated_amount_cents (insurer-approved eligible amount), which may be lower, yielding a different covered_amount_cents"

  - name: sku_reserved_count
    trigger: "order place, cancel, fulfill (recompute)"
    algorithm: aggregation
    formula: |
      reserved_count = sum(line.quantity
                           for line in OrderLine
                           where line.sku_id == this.sku_id
                             and line.status == ACTIVE
                             and line.is_special_order == false
                             and line.order.fulfillment_status == PLACED)
      available_units = stock_on_hand - reserved_count
    input_set: "ACTIVE non-special OrderLines on PLACED orders for this SKU"
    constants: {}
    precision: "integer units"

  - name: sku_stock_status
    trigger: "any change to stock_on_hand or reserved_count"
    algorithm: threshold
    formula: |
      if available_units <= 0:                         stock_status = OUT_OF_STOCK
      elif available_units <= LOW_STOCK_THRESHOLD:      stock_status = LOW_STOCK
      else:                                             stock_status = IN_STOCK
    input_set: "This SKU's available_units"
    constants:
      LOW_STOCK_THRESHOLD: 3
    precision: "boundary: available_units == LOW_STOCK_THRESHOLD is LOW_STOCK; == 0 is OUT_OF_STOCK"

  - name: fitter_slot_overlap
    trigger: "appointment confirm"
    algorithm: interval_merge
    formula: |
      # Interval semantics: EXCLUSIVE with a turnover BUFFER. A fitter may hold at
      # most one appointment whose buffered window touches the candidate window.
      candidate = [scheduled_start, scheduled_end + FITTER_BUFFER_MIN minutes)
      for other in CONFIRMED/CHECKED_IN appointments on same fitter_id:
        existing = [other.scheduled_start, other.scheduled_end + FITTER_BUFFER_MIN minutes)
        if candidate.start < existing.end and existing.start < candidate.end:  # half-open overlap
          reject ERR_FITTER_DOUBLE_BOOKED
    input_set: "CONFIRMED/CHECKED_IN appointments on the same fitter"
    constants:
      FITTER_BUFFER_MIN: 15
    precision: "half-open intervals; adjacency at exactly buffer boundary does NOT overlap"

  - name: room_capacity_overlap
    trigger: "appointment confirm"
    algorithm: aggregation
    formula: |
      # Interval semantics: AGGREGATE CAPACITY, NO buffer, plain half-open overlap.
      overlap_count = count(other in CONFIRMED/CHECKED_IN appointments on same room_id
                            where other.scheduled_start < candidate.scheduled_end
                              and candidate.scheduled_start < other.scheduled_end)
      if overlap_count >= FittingRoom.capacity:
        reject ERR_ROOM_AT_CAPACITY
    input_set: "CONFIRMED/CHECKED_IN appointments on the same room"
    constants: {}
    precision: "half-open intervals; no buffer; strict >= capacity rejects"

  - name: loyalty_tier
    trigger: "any change to customer.loyalty_points (create, pay/fulfill reconciliation, admin loyalty-adjustment)"
    algorithm: threshold
    formula: |
      # Derive tier from the customer's current loyalty_points balance.
      if   loyalty_points >= GOLD_THRESHOLD:   loyalty_tier = GOLD
      elif loyalty_points >= SILVER_THRESHOLD: loyalty_tier = SILVER
      else:                                    loyalty_tier = BRONZE
    input_set: "This customer's current loyalty_points"
    constants:
      SILVER_THRESHOLD: 1000
      GOLD_THRESHOLD: 5000
    precision: "boundary: loyalty_points == SILVER_THRESHOLD (1000) is SILVER; == GOLD_THRESHOLD (5000) is GOLD; below 1000 is BRONZE (>= comparison, inclusive)"

  - name: replacement_reminder_due_date
    trigger: "order fulfill (per qualifying FULFILLED line, create ReplacementReminder)"
    algorithm: threshold
    formula: |
      # Add a fixed month interval to the order's fulfillment timestamp.
      due_date = order.fulfilled_at + REPLACEMENT_INTERVAL_MONTHS calendar months
    input_set: "order.fulfilled_at"
    constants:
      REPLACEMENT_INTERVAL_MONTHS: 6
    precision: "calendar-month addition (e.g. fulfilled 2026-07-01T00:00:00Z -> due 2027-01-01T00:00:00Z)"

  - name: exchange_eligibility_window
    trigger: "exchange approve"
    algorithm: threshold
    formula: |
      # Days elapsed since the exchanged line's order fulfillment must be within window.
      days_since = (clock_now - order.fulfilled_at) in whole days
      if days_since > EXCHANGE_WINDOW_DAYS:
        reject ERR_EXCHANGE_WINDOW_EXPIRED
    input_set: "clock_now and order.fulfilled_at"
    constants:
      EXCHANGE_WINDOW_DAYS: 30
    precision: "inclusive boundary: exactly EXCHANGE_WINDOW_DAYS (30) days since fulfillment is still allowed (<=); day 31+ rejected"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_FITTER_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_SKU_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_ORDER_LINE_NOT_FOUND / ERR_EXCHANGE_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_REMINDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id, and body FK references"

  - priority: 4
    category: existence
    check: "Customer acting on their own resource: X-User-ID equals the resource's customer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Customer-owned operations (own appointments, orders, exchanges, reminders)"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges honored"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: business_constraint
    check: "Measurements within range (UNDERBUST/BUST min-max) on fit"
    error_id: ERR_MEASUREMENT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /boutique/appointments/{id}/fit"

  - priority: 7
    category: state
    check: "Target resource in a valid state for the requested transition (see §1.2)"
    error_id: "ERR_INVALID_STATE / ERR_LINE_NOT_EXCHANGEABLE_STATE / ERR_ORDER_NOT_PLACED / ERR_ORDER_NOT_PAID / ERR_ORDER_NOT_CANCELLABLE / ERR_EMPTY_ORDER / ERR_FIT_NOT_SUBMITTED / ERR_NOTHING_TO_REIMBURSE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "OCC: expected_appointment_version matches current FittingAppointment.version on re-fit"
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412
    applies_to: "POST /boutique/appointments/{id}/fit"

  - priority: 9
    category: business_safety
    check: "Post-surgical/mastectomy fitting requires a certified fitter and a private room; exchange requires SEALED condition on a STANDARD_RETURNABLE product (hygiene)"
    error_id: "ERR_FITTER_NOT_CERTIFIED / ERR_ROOM_NOT_PRIVATE / ERR_ITEM_NOT_EXCHANGEABLE_HYGIENE"
    http_status: 409
    applies_to: "POST /boutique/appointments/{id}/confirm; POST /boutique/exchanges/{id}/approve"

  - priority: 10
    category: business_constraint
    check: "Scheduling conflicts: fitter buffered-overlap double booking; room aggregate capacity exceeded"
    error_id: "ERR_FITTER_DOUBLE_BOOKED / ERR_ROOM_AT_CAPACITY"
    http_status: 409
    applies_to: "POST /boutique/appointments/{id}/confirm"

  - priority: 11
    category: business_temporal
    check: "Exchange within EXCHANGE_WINDOW_DAYS of fulfillment; reminder send only when clock >= due_date"
    error_id: "ERR_EXCHANGE_WINDOW_EXPIRED / ERR_REMINDER_NOT_DUE"
    http_status: 409
    applies_to: "POST /boutique/exchanges/{id}/approve; POST /boutique/reminders/{id}/send"

  - priority: 12
    category: business_referential
    check: "Order fulfillment/placement referential: SKU active; insurance requires a mastectomy line on the order"
    error_id: "ERR_SKU_INACTIVE / ERR_NOT_MASTECTOMY_ORDER"
    http_status: 409
    applies_to: "POST /boutique/orders/{id}/place; POST /boutique/insurance-claims"

  - priority: 13
    category: business_fiscal
    check: "Sufficient available inventory to reserve requested quantity (available_units >= quantity; 0 rejects)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 402
    applies_to: "POST /boutique/orders/{id}/place"

