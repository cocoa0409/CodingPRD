              payload: { champion_deployment_id: "${d1_id}", challenger_deployment_id: "${d2_id}", reserved_samples: 3000, evaluation_ends_at: "2026-08-15T00:00:00Z", champion_metrics: { ACCURACY_PROXY: 0.8200, CALIBRATION: 0.9100, LATENCY: 180.0, COST: 0.00420 }, challenger_metrics: { ACCURACY_PROXY: 0.8570, CALIBRATION: 0.9230, LATENCY: 171.0, COST: 0.00390 }, expected_model_version: "${m_ver}" }
