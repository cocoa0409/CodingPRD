  # ---------------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: create_adjuster_forbidden_for_carrier
        claim_type: Cannot perform other role's op
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /v1/adjusters as Carrier (not in the endpoint's roles) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/adjusters", payload: { full_name: "X", firm_name: "Y", email: "z@x.com" }, as: Carrier, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "HTTP status == 403"

      - name: sign_contract_by_wrong_client_forbidden
        claim_type: Ownership enforcement
        grounds: [roles, state_machines.Contract.DRAFT_to_SIGNED, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A different Client signing a contract they do not own (X-User-ID != contract.client_id) returns ERR_FORBIDDEN."
        test_recipe:
          setup: ["A DRAFT contract for client A; a second client B exists."]
          setup_api_calls:
            - { call: "POST /v1/adjusters", payload: { full_name: "Ada PA", firm_name: "Advocate LLC", email: "ada@x.com" }, as: FirmPrincipal, captures: { adj: $.data.id } }
            - { call: "POST /v1/clients", payload: { full_name: "Cy Client", email: "cy@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cliA: $.data.id } }
            - { call: "POST /v1/clients", payload: { full_name: "Bea Other", email: "bea@x.com", mailing_state: "TX" }, as: FirmPrincipal, captures: { cliB: $.data.id } }
            - { call: "POST /v1/contracts", payload: { client_id: "${cliA}", adjuster_id: "${adj}", loss_state_code: "TX", fee_pct: 0.10, statutory_cap_pct: 0.10 }, as: FirmPrincipal, captures: { con: $.data.id } }
