          - calculations.debt_service_coverage_test
          - state_machines.DebtServiceObligation.SCHEDULED_to_FUNDED
          - state_machines.CapitalProject.APPROVED_to_FUNDED
          - entities.Facility.fields.funded_obligation_count
        distinguishing_aspect: |
          Depth-5 chain triggered by POST /rac/cfc-remittances/{id}/receive: the
          receipt moves the trust buckets, the moved buckets flip
          bond_coverage_status to SATISFIED, that flip lets the auto-funding
          selector move obligation ${ob_id} SCHEDULED -> FUNDED, that funding
          raises funded_obligation_count to 1, and that count releases
          CapitalProject ${proj_id} from APPROVED to FUNDED. Each link is caused
          by the previous link, not by the original receive call.
