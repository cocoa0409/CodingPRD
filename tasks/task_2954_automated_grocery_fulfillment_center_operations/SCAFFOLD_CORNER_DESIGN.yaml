            - "CustomerOrder.${order_id}.merchandise_subtotal_cents == 2100 and delivery_fee_cents == 599 and order_total_cents == 2699"
            - "GET /slot-bookings?customer_order_id=${order_id} returns total_count == 1 (the three rejected attempts created nothing)"

      - name: substitution_approval_reads_the_substitute_zone_status_not_the_line_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=13].ERR_ZONE_NOT_OPERATIONAL
          - state_machines.GridZone[OPERATIONAL -> AUDIT_HOLD]
          - state_machines.SubstitutionProposal[PROPOSED -> APPROVED]
          - calculations.zone_inventory_accuracy
        distinguishing_aspect: "Approval validity depends on a different entity's state: with the proposal PROPOSED, unexpired, owned by the acting customer and the substitute SKU fully in stock, the approve still fails with ERR_ZONE_NOT_OPERATIONAL (409) purely because an unrelated decoy SKU's audit count pushed the substitute's GridZone into AUDIT_HOLD. A clean recount returns the zone to OPERATIONAL and the identical approve then succeeds."
        test_recipe:
          setup:
            - "Route R1, AMBIENT zone A1, AMBIENT station S1 (max 3 totes). Zone A1 holds AMB-1 (700, group DRY, 100 units), AMB-2 (750, group DRY, 100 units) and decoy AMB-D (500, group DECOY so it never enters AMB-1's substitution pool, 100 units)."
            - "A BASIC customer's order carries one 2-unit AMB-1 line (provisional 1400); it is booked, confirmed, waved and picking, and the pick completes with picked_units 0 so the line goes SHORT with an auto-created DRAFT proposal offering AMB-2."
            - "The proposal is then PROPOSED by the operator, and a GridEngineer audits only AMB-D at 90 of 100 units: unit-weighted accuracy 0.9000 < 0.98 drives zone A1 to AUDIT_HOLD while AMB-2's 100 units are untouched."
