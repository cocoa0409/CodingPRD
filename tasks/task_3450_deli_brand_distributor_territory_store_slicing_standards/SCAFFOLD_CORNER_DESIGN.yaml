        distinguishing_aspect: "Confirm is a conditional action: it only fires when training coverage and lot freshness both hold — covered end-to-end by the happy path in order_parallel_allocation_fulfillment_dimensions."
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_parallel_allocation_fulfillment_dimensions
          rationale: "The confirm happy path (all preconditions satisfied) is asserted there; failure branches have their own corner instances."

  - section: errors
    instances:
      - name: error_envelope_shape_on_validation_failure
        claim_type: violation_to_error
        grounds: [response_envelope, 'errors[ERR_VALIDATION"]']
        distinguishing_aspect: "Error responses use the fixed envelope: response_type error with data.error_id and data.message."
        test_recipe:
