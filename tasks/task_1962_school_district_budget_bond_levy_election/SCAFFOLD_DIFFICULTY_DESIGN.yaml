  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (two instances, different triggers, depth >= 3 / >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: adoption_cascade_version_to_allocation_to_position_to_fiscal_year
        grounds:
          - state_machines.BudgetVersion.HEARING_HELD_to_ADOPTED
          - state_machines.StaffingAllocation.DRAFT_to_AUTHORIZED
          - state_machines.Position.PROPOSED_to_OPEN
          - entities.FiscalYear.fields.authorized_fte_total
        distinguishing_aspect: |
          Depth-3 cascade from POST adopt: BudgetVersion HEARING_HELD -> ADOPTED mutates
          StaffingAllocations (DRAFT -> AUTHORIZED); each allocation's authorization itself
          mutates its Positions (PROPOSED -> OPEN); each position opening recomputes
          FiscalYear.authorized_fte_total (136.5) and open_position_count (2) — every link
          is caused by the previous link, not by the adopt call directly.
        test_recipe:
          setup:
            - "FY2028 OPEN; three projections (1200/800/1000); budget version with four lines (12M/6M/2M/3M = 23,000,000 <= total_revenue 23,404,000) and a revenue estimate"
            - "Three staffing allocations (ELEMENTARY 60.0, MIDDLE 36.5, HIGH 40.0); two PROPOSED positions under the ELEMENTARY allocation (1.0 and 0.5 FTE)"
            - "Budget proposed; hearing held 2027-03-20; clock at 2027-03-27"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { ep_e: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "MIDDLE", projected_pupils: 800 }
              as: BudgetAnalyst
              captures: { ep_m: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "HIGH", projected_pupils: 1000 }
              as: BudgetAnalyst
              captures: { ep_h: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 12000000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "OPERATIONS", function_code: "2500", object_code: "300", cost_center: "DISTRICT", appropriation_amount: 6000000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "TRANSPORTATION", function_code: "2550", object_code: "300", cost_center: "DISTRICT", appropriation_amount: 2000000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "CAPITAL_PROJECTS", function_code: "5100", object_code: "700", cost_center: "DISTRICT", appropriation_amount: 3000000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 1200000, other_revenue: 500000, cpi_rate: 0.034 }
              as: BusinessManager
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${ep_e}", allocated_fte: 60.0 }
              as: BudgetAnalyst
              captures: { sa_e: $.data.id }
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "MIDDLE", enrollment_projection_id: "${ep_m}", allocated_fte: 36.5 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "HIGH", enrollment_projection_id: "${ep_h}", allocated_fte: 40.0 }
              as: BudgetAnalyst
            - call: "POST /district/staffing-allocations/${sa_e}/positions"
              payload: { title: "Teacher A", fte: 1.0, base_salary: 60000 }
              as: BudgetAnalyst
              captures: { p1: $.data.id }
            - call: "POST /district/staffing-allocations/${sa_e}/positions"
              payload: { title: "Aide B", fte: 0.5, base_salary: 32000 }
              as: BudgetAnalyst
              captures: { p2: $.data.id }
            - call: "POST /district/budget-versions/${bv}/propose"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/public-hearings/${h1}/hold"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-27T09:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /district/budget-versions/${bv}/adopt"
              as: BoardClerk
              captures: { bv_status: $.data.status }
            - call: "GET /district/budget-versions/${bv}/staffing-allocations"
              as: Auditor
              captures: { sa0: "$.data[0].status", sa1: "$.data[1].status", sa2: "$.data[2].status" }
            - call: "GET /district/staffing-allocations/${sa_e}/positions"
              as: Auditor
              captures: { p1_st: "$.data[0].status", p2_st: "$.data[1].status" }
            - call: "GET /district/fiscal-years/${fy}"
              as: Auditor
              captures: { fte_total: $.data.authorized_fte_total, open_count: $.data.open_position_count }
          assert:
            - "Link 0: BudgetVersion.${bv} status == ADOPTED"
            - "Link 1: all three StaffingAllocations status == AUTHORIZED (caused by the adoption)"
            - "Link 2: both Positions status == OPEN (caused by the allocation authorization, not by adopt directly — positions were PROPOSED before)"
            - "Link 3: FiscalYear.authorized_fte_total == 136.5 (60.0 + 36.5 + 40.0) and open_position_count == 2 (recomputed from the position openings)"
            - "All four BudgetLines status == ADOPTED (fan-out link)"

      - name: canvass_cascade_measure_to_proposal_to_projects
        grounds:
          - state_machines.Election.SCHEDULED_to_CANVASSED
          - state_machines.BallotMeasure.LANGUAGE_CERTIFIED_to_PASSED
          - state_machines.BondProposal.REFERRED_to_PASSED
          - state_machines.BondProject.PLANNED_to_AUTHORIZED
        distinguishing_aspect: |
          Depth-3 cascade from POST canvass (a DIFFERENT trigger than adoption): the canvass
          mutates the BallotMeasure (LANGUAGE_CERTIFIED -> PASSED, votes recorded); the measure
          passing mutates the BondProposal (REFERRED -> PASSED, passed_at set); the proposal
          passing mutates each BondProject (PLANNED -> AUTHORIZED, authorized_amount =
          estimated_cost) — a fan-out at the leaf level but a strict chain at links 1-3.
        test_recipe:
          setup:
            - "FY2028 OPEN; bond proposal 18,000,000 BOARD_APPROVED with three projects (6M/5M/7M); certified ballot measure on the 2027-11-02 election; clock at 2027-11-03"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
