# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2465_water_utility_high_bill_investigation_leak_adjustment
#
# Shared fixture facts every chain below reproduces from empty DB:
#   * logical clock starts at 2026-08-01T00:00:00Z (endpoint default) and is set
#     explicitly on the first call of every chain.
#   * RateSchedule RS-STD-2026: base 1200; tier1 <= 3000 gal @ 350/kgal;
#     tier2 <= 10000 gal @ 520/kgal; tier3 @ 890/kgal; summer surcharge 1500 bp
#     on the tier-3 line only; sewer 610/kgal capped at 12000 gal; irrigation
#     submeter sewer credit capped at 8000 gal; admin fee 1500 waived at 10000.
#   * Pinned charge totals on RS-STD-2026, SUMMER:
#       4000 gal  -> water 2770,  sewer 2440, total 5210
#       7996 gal  -> water 4848,  sewer 4878, total 9726
#       8000 gal  -> water 4850,  sewer 4880, total 9730
#       12000 gal -> water 7937,  sewer 7320, total 15257
#       40204 gal -> water 36804, sewer 7320, total 44124
#       41000 gal -> water 37619, sewer 7320, total 44939
#     and WINTER 41000 gal -> water 33480, sewer 7320, total 40800.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_leak_credit_excess_reprice_vs_baseline_rebill
        grounds:
          - calculations.leak_adjustment_credit
          - calculations.adjustment_preview
          - calculations.sewer_relief_basis
          - entities.LeakAdjustment.fields.variant_applied
          - entities.LeakAdjustment.fields.net_credit_cents
          - endpoints[GET /bills/{id}/adjustment-preview]
        distinguishing_aspect: |
          The two variants are computed from the SAME bill and the SAME leak_type in one
          preview call and return different money: EXCESS_REPRICE nets 26779 cents because the
          37000 excess gallons are re-priced at the tier-1 rate, while BASELINE_REBILL nets
          26963 cents because the whole excess is forgiven and the cap then binds. The variant
          divergence lives in the pricing domain (Bill and LeakAdjustment), not in the
          instrumentation domain.
        test_recipe:
          setup:
            - "RateSchedule RS-STD-2026 and BillingPeriods 2025-06, 2025-07, 2025-08 (SUMMER) and 2026-07 (SUMMER, rebilling deadline 2027-01-31) exist and are OPEN."
            - "ServiceAccount ACC-1001 on RS-STD-2026 owns one 1.0 inch POTABLE_MASTER meter with initial_register_value 100000."
            - "Live ACTUAL reads 100000 / 104000 / 108000 / 112000 / 153000 give the four periods consumptions 4000, 4000, 4000 and 41000 gallons."
            - "The three 2025 bills are ISSUED, non-anomalous and non-estimated, so the 2026-07 bill's seasonal_baseline_gallons is 4000 and its anomaly_ratio is 10.250."
            - "A high-bill investigation on the 2026-07 bill has a VERIFIED SERVICE_LINE RepairProof and leak_determination CUSTOMER_SIDE_LEAK recorded by user csr-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-07", start_date: "2025-07-01", end_date: "2025-07-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-08", start_date: "2025-08-01", end_date: "2025-08-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2026-07", start_date: "2026-07-01", end_date: "2026-07-31", season: "SUMMER", rebilling_deadline_date: "2027-01-31" }
              as: SystemAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-1001", customer_name: "Alma Reyes", service_address: "12 Cedar St", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_a_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_a_id}", meter_serial: "MTR-A-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_a_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_a_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_a_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_a_id}", read_date: "2025-07-31", read_type: "ACTUAL", reading_value: 108000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_a_id}", read_date: "2025-08-31", read_type: "ACTUAL", reading_value: 112000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_a_id}", read_date: "2026-07-31", read_type: "ACTUAL", reading_value: 153000 }
              as: MeterTechnician
              captures: { read_p4_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p1_id}", meter_id: "${meter_a_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p1_id: $.data.id }
            - call: "POST /bills/${bill_p1_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p2_id}", meter_id: "${meter_a_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p2_id: $.data.id }
            - call: "POST /bills/${bill_p2_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p3_id}", meter_id: "${meter_a_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p3_id: $.data.id }
            - call: "POST /bills/${bill_p3_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p4_id}", meter_id: "${meter_a_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p4_id: $.data.id }
            - call: "POST /bills/${bill_p4_id}/issue"
              as: BillingSupervisor
            - call: "POST /investigations"
              payload: { bill_id: "${bill_p4_id}", reported_cause: "bill quadrupled with no change in use" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
              captures: { inv_id: $.data.id }
            - call: "POST /investigations/${inv_id}/request-evidence"
              payload: { note: "please send the plumber invoice" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
            - call: "POST /repair-proofs"
              payload: { investigation_id: "${inv_id}", plumber_license_no: "PL-88231", repair_date: "2026-07-20", leak_type: "SERVICE_LINE", invoice_amount_cents: 185000, description: "replaced 40 ft of copper service line" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
              captures: { proof_id: $.data.id }
            - call: "POST /repair-proofs/${proof_id}/verify"
              as: CustomerServiceRep
              as_user_id: "csr-1"
            - call: "POST /investigations/${inv_id}/determine"
              payload: { leak_determination: "CUSTOMER_SIDE_LEAK" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
              captures: { inv_v: $.data.version }
          trigger:
            - call: "GET /bills/${bill_p4_id}/adjustment-preview"
              payload: { assumed_leak_type: "SERVICE_LINE" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
              captures: { prev_excess: $.data.excess_reprice_net_cents, prev_baseline: $.data.baseline_rebill_net_cents }
            - call: "POST /leak-adjustments"
              payload: { investigation_id: "${inv_id}", bill_id: "${bill_p4_id}", leak_type: "SERVICE_LINE", expected_investigation_version: "${inv_v}" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
              captures: { adj_id: $.data.id }
          assert:
            - "Bill.${bill_p4_id}.consumption_gallons == 41000"
            - "Bill.${bill_p4_id}.seasonal_baseline_gallons == 4000"
            - "Bill.${bill_p4_id}.total_charge_cents == 44939"
            - "The preview response data.excess_reprice_net_cents == 26779"
            - "The preview response data.baseline_rebill_net_cents == 26963"
            - "The preview response data.variant_delta_cents == 184"
            - "The preview response data.recommended_variant == BASELINE_REBILL"
            - "The preview response data.excess_gallons == 37000"
            - "LeakAdjustment.${adj_id}.variant_applied == BASELINE_REBILL"
            - "LeakAdjustment.${adj_id}.water_credit_cents == 34849"
            - "LeakAdjustment.${adj_id}.sewer_relief_gallons == 8000"
            - "LeakAdjustment.${adj_id}.sewer_credit_cents == 4880"
            - "LeakAdjustment.${adj_id}.gross_credit_cents == 39729"
            - "LeakAdjustment.${adj_id}.cap_cents == 26963"
            - "LeakAdjustment.${adj_id}.capped_credit_cents == 26963"
            - "LeakAdjustment.${adj_id}.cap_applied == true"
            - "LeakAdjustment.${adj_id}.admin_fee_charged_cents == 0"
            - "LeakAdjustment.${adj_id}.net_credit_cents == 26963"
            - "No AccountLedgerEntry with source_kind LEAK_ADJUSTMENT_CREDIT exists yet; ServiceAccount.${acct_a_id}.balance_cents == 60569"

      - name: dual_variant_bench_accuracy_awwa_weighted_vs_simple_mean
        grounds:
          - calculations.bench_test_accuracy
          - entities.MeterTestRequest.fields.accuracy_method
          - entities.MeterTestRequest.fields.accuracy_pct
          - entities.MeterTestRequest.fields.bench_result
          - entities.Meter.fields.size_inches
          - state_machines.MeterTestRequest.BENCH_TEST_PENDING_to_CLOSED_FAST
          - state_machines.MeterTestRequest.BENCH_TEST_PENDING_to_CLOSED_PASS
        distinguishing_aspect: |
          Two meters receive the byte-identical flow triple (95.20, 103.40, 102.10) and land on
          opposite verdicts purely because of size_inches: the 1.0 inch meter is graded
          AWWA_WEIGHTED to 101.98 and fails FAST, the 3.0 inch meter is graded SIMPLE_MEAN to
          100.23 and passes. The variant divergence lives in the metering-instrumentation
          domain (Meter and MeterTestRequest), not in the pricing domain.
        test_recipe:
          setup:
            - "RateSchedule RS-STD-2026 and BillingPeriods 2025-06, 2025-07, 2025-08 and 2026-07 exist and are OPEN."
            - "ServiceAccount ACC-1001 owns a 1.0 inch POTABLE_MASTER meter (initial_register_value 100000) with the 100000 / 104000 / 108000 / 112000 / 153000 read history, and a second 3.0 inch POTABLE_MASTER meter (initial_register_value 200000) with a single 200000 read and no bills."
            - "The 2026-07 bill is ISSUED with consumption 41000 and baseline 4000, and a high-bill investigation on it is in EVIDENCE_REQUESTED."
            - "Two utility-initiated BENCH MeterTestRequests exist on that investigation with deposit_cents 0, one per meter, both in BENCH_TEST_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-07", start_date: "2025-07-01", end_date: "2025-07-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-08", start_date: "2025-08-01", end_date: "2025-08-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2026-07", start_date: "2026-07-01", end_date: "2026-07-31", season: "SUMMER", rebilling_deadline_date: "2027-01-31" }
              as: SystemAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-1001", customer_name: "Alma Reyes", service_address: "12 Cedar St", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_a_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_a_id}", meter_serial: "MTR-A-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_small_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_a_id}", meter_serial: "MTR-A-2", meter_type: "POTABLE_MASTER", size_inches: 3.0, initial_register_value: 200000 }
              as: MeterTechnician
              captures: { meter_large_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_large_id}", read_date: "2026-07-31", read_type: "ACTUAL", reading_value: 200000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_small_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_small_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_small_id}", read_date: "2025-07-31", read_type: "ACTUAL", reading_value: 108000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_small_id}", read_date: "2025-08-31", read_type: "ACTUAL", reading_value: 112000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_small_id}", read_date: "2026-07-31", read_type: "ACTUAL", reading_value: 153000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p1_id}", meter_id: "${meter_small_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p1_id: $.data.id }
            - call: "POST /bills/${bill_p1_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p2_id}", meter_id: "${meter_small_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p2_id: $.data.id }
            - call: "POST /bills/${bill_p2_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p3_id}", meter_id: "${meter_small_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p3_id: $.data.id }
            - call: "POST /bills/${bill_p3_id}/issue"
              as: BillingSupervisor
            - call: "POST /bills"
              payload: { account_id: "${acct_a_id}", period_id: "${p4_id}", meter_id: "${meter_small_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p4_id: $.data.id }
            - call: "POST /bills/${bill_p4_id}/issue"
              as: BillingSupervisor
            - call: "POST /investigations"
              payload: { bill_id: "${bill_p4_id}", reported_cause: "suspect meter over-registering" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
              captures: { inv_id: $.data.id }
            - call: "POST /investigations/${inv_id}/request-evidence"
              payload: { note: "utility will bench both masters" }
              as: CustomerServiceRep
              as_user_id: "csr-1"
            - call: "POST /meter-test-requests"
              payload: { investigation_id: "${inv_id}", meter_id: "${meter_large_id}", requested_test_type: "BENCH", requested_by_kind: "UTILITY", deposit_cents: 0 }
              as: MeterTechnician
              captures: { req_large_id: $.data.id }
            - call: "POST /meter-test-requests"
              payload: { investigation_id: "${inv_id}", meter_id: "${meter_small_id}", requested_test_type: "BENCH", requested_by_kind: "UTILITY", deposit_cents: 0 }
              as: MeterTechnician
              captures: { req_small_id: $.data.id }
          trigger:
            - call: "POST /meter-test-requests/${req_large_id}/record-bench-result"
              payload: { tested_at: "2026-08-05T09:00:00Z", low_flow_pct: 95.20, mid_flow_pct: 103.40, high_flow_pct: 102.10 }
              as: MeterTechnician
            - call: "POST /meter-test-requests/${req_small_id}/record-bench-result"
              payload: { tested_at: "2026-08-05T11:00:00Z", low_flow_pct: 95.20, mid_flow_pct: 103.40, high_flow_pct: 102.10 }
              as: MeterTechnician
          assert:
            - "MeterTestRequest.${req_large_id}.accuracy_method == SIMPLE_MEAN"
            - "MeterTestRequest.${req_large_id}.accuracy_pct == 100.23"
            - "MeterTestRequest.${req_large_id}.bench_result == PASS"
            - "MeterTestRequest.${req_large_id}.status == CLOSED_PASS"
            - "Meter.${meter_large_id}.accuracy_status == VERIFIED_ACCURATE"
            - "Meter.${meter_large_id}.correction_factor == 0.997705"
            - "MeterTestRequest.${req_small_id}.accuracy_method == AWWA_WEIGHTED"
            - "MeterTestRequest.${req_small_id}.accuracy_pct == 101.98"
            - "MeterTestRequest.${req_small_id}.bench_result == FAST"
            - "MeterTestRequest.${req_small_id}.status == CLOSED_FAST"
            - "Meter.${meter_small_id}.accuracy_status == FAILED_FAST"
            - "Meter.${meter_small_id}.correction_factor == 0.980584"
            - "MeterTestRequest.${req_large_id}.accuracy_pct != MeterTestRequest.${req_small_id}.accuracy_pct even though low_flow_pct, mid_flow_pct and high_flow_pct are identical on both rows"
            - "MeterTestRequest.${req_large_id}.deposit_refunded == false and MeterTestRequest.${req_small_id}.deposit_refunded == false because both deposits were 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # -------- MODE (a): nested clamping + conditional surcharge branch --------
      - name: combinatorial_mode_a_tiered_water_charge_nested_clamp_seasonal_branch
        grounds:
          - calculations.tiered_water_charge
          - entities.RateSchedule.fields.summer_surcharge_bp
          - entities.BillingPeriod.fields.season
          - entities.Bill.fields.water_charge_cents
          - endpoints[POST /bills]
        distinguishing_aspect: |
          MODE (a): a single formula whose three tier lines are produced by NESTED clamping
          (min(g, t1) / max(0, min(g, t2) - t1) / max(0, g - t2)), each line rounded half-up
          independently before summation, with a conditional basis-point surcharge folded into
          the tier-3 line only when BillingPeriod.season is SUMMER. Identical 41000-gallon
          consumption yields water_charge_cents 37619 in SUMMER and 33480 in WINTER, and the
          4139-cent gap is exactly the 15-percent surcharge on the tier-3 line alone
          (31729 - 27590), leaving base, tier-1, tier-2 and sewer untouched.
        test_recipe:
          setup:
            - "RateSchedule RS-STD-2026 exists with summer_surcharge_bp 1500."
            - "BillingPeriod 2026-01 (2026-01-01..2026-01-31, WINTER) and BillingPeriod 2026-07 (2026-07-01..2026-07-31, SUMMER) exist and are OPEN; they do not overlap."
            - "ServiceAccount ACC-SUM owns a 1.0 inch POTABLE_MASTER meter with reads 100000 on 2026-06-30 and 141000 on 2026-07-31, so the 2026-07 bill consumes 41000 gallons."
            - "ServiceAccount ACC-WIN owns a 1.0 inch POTABLE_MASTER meter with reads 500000 on 2025-12-31 and 541000 on 2026-01-31, so the 2026-01 bill consumes 41000 gallons."
            - "Neither account has three qualifying same-season history bills, so both bills have seasonal_baseline_gallons null and anomaly_flag false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2026-01", start_date: "2026-01-01", end_date: "2026-01-31", season: "WINTER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { pw_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2026-07", start_date: "2026-07-01", end_date: "2026-07-31", season: "SUMMER", rebilling_deadline_date: "2027-01-31" }
              as: SystemAdmin
              captures: { ps_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-SUM", customer_name: "Sunny Ortiz", service_address: "3 Summer Ln", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_sum_id: $.data.id }
            - call: "POST /service-accounts"
