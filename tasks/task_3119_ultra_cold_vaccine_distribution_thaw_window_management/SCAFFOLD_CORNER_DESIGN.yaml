              payload: { carton_id: "${c01}" }
              as: LogisticsOperator
              captures: { deficit_after: "$.data.dry_ice_deficit_kg", required_after: "$.data.required_dry_ice_kg" }
            - call: "GET /vaccine-distribution/shippers/${ship2_id}"
              payload: {}
              as: LogisticsOperator
              captures: { ship2_v: "$.data.version" }
