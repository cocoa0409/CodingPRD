  # ===========================================================================
  # From Table 7 (RBAC) — role_model: segregation_of_duties with peer agents
  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_rbac_exclusive_operations_refuse_every_other_role
        claim_type: exclusive_operations
        grounds:
          - roles.ElitesDirector.exclusive_operations
          - roles.TechnicalOfficial.exclusive_operations
          - roles.AntiDopingLiaison.exclusive_operations
          - roles.SanctioningBody.exclusive_operations
          - roles.FinanceOfficer.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: >-
          The six roles are strictly segregated with no hierarchical override: the ElitesDirector who
          owns the whole recruitment surface still cannot verify a time, enter a result, schedule a
          test or touch money, and the FinanceOfficer who owns the money cannot open the field — each
          crossing returns 403 ERR_ROLE_NOT_PERMITTED while the shared GET reads work for every role
          the endpoint lists.
        test_recipe:
          setup:
            - "One PLANNING edition with one DivisionStandard, one OVERALL purse line, one athlete and one VERIFIED-eligible performance record in SUBMITTED state."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Role Wall Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /athletes
              payload: { full_name: "Wall Walter", country_code: USA, gender: MALE, birth_date: "1997-06-01" }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual RW", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-RW-1", chip_timed: true }
              as: ElitesDirector
              captures: { pr_id: "$.data.id" }
          trigger:
            - call: POST /race-editions
              payload: { name: "Agent Invented Race", city: "Nowhere", race_date: "2026-12-01", appearance_budget_cents: 1000, total_purse_cents: 1000, bonus_pool_cap_cents: 0 }
              as: AthleteAgent
              as_user_id: "agent-x"
              captures: { err1: "$.data.error_id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: ElitesDirector
              captures: { err2: "$.data.error_id" }
            - call: POST /doping-tests
              payload: { athlete_id: "${ath_id}", race_edition_id: "${ed_id}", test_type: OUT_OF_COMPETITION, window_start_at: "2026-10-01T08:00:00Z", window_end_at: "2026-10-01T18:00:00Z", sample_code: "S-RW-1" }
              as: FinanceOfficer
              captures: { err3: "$.data.error_id" }
            - call: PATCH /athletes/${ath_id}/tax-profile
              payload: { w8ben_on_file: true }
              as: ElitesDirector
              captures: { err4: "$.data.error_id" }
            - call: POST /race-editions/${ed_id}/open-field
              as: FinanceOfficer
              captures: { err5: "$.data.error_id" }
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: GET /race-editions/${ed_id}
              as: SanctioningBody
            - call: GET /race-editions/${ed_id}/division-standards
              payload: { division: ELITE }
              as: AthleteAgent
              as_user_id: "agent-x"
            - call: GET /race-editions/${ed_id}/purse-lines
              payload: { category: OVERALL }
              as: FinanceOfficer
          assert:
            - "trigger calls 1 through 5 each return HTTP 403 with error_id == ERR_ROLE_NOT_PERMITTED — AthleteAgent cannot create an edition, ElitesDirector cannot verify a time or patch a tax profile, FinanceOfficer cannot schedule a test or open the field"
            - "no state changed during trigger calls 1..5: the performance record is still SUBMITTED, the athlete still has w8ben_on_file false and the edition is still PLANNING"
            - "trigger call 6 returns HTTP 200 with status == FIELD_OPEN — the same operation from its owning role"
            - "trigger calls 7, 8 and 9 all return HTTP 200: the shared read surface is open to every role listed in §1.5, including AthleteAgent for division standards and FinanceOfficer for purse lines"

      - name: corner_rbac_peer_agents_cannot_act_on_each_others_invitations
        claim_type: peer_roles
        grounds:
          - roles.AthleteAgent.identity
          - errors.ERR_NOT_INVITATION_AGENT
          - endpoints[POST /invitations/{id}/respond]
          - endpoints[POST /invitations/{id}/negotiation-rounds]
        distinguishing_aspect: >-
          AthleteAgent is entity-backed, so authority is per-row rather than per-role: agent two holds
          the AthleteAgent role and passes the role gate, then fails on identity with
          ERR_NOT_INVITATION_AGENT for both the counter-offer and the response, while the same calls
          from agent one succeed on the same invitation.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition (max_negotiation_rounds default 3) and two ACTIVE agents; one OFFERED invitation whose agent_id is agent one."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
