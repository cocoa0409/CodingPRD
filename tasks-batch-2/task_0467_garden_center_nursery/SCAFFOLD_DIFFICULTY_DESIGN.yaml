              as: InventoryManager
              captures: { veh: $.data.id }
            - call: "POST /nurseries/${nid}/products"
              payload: { sku: "DG-7", name: "Stone", category: "DRY_GOOD", unit: "EACH", unit_price_cents: 500 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { oa: $.data.id }
            - call: "POST /orders/${oa}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
            - call: "POST /orders/${oa}/deliveries"
              payload: { vehicle_id: "${veh}", window_start: "2026-04-02T10:00:00Z", window_end: "2026-04-02T11:00:00Z" }
              as: InventoryManager
            - call: "POST /accounts/${aid}/orders"
              payload: {}
              as: SalesClerk
              captures: { ob: $.data.id }
            - call: "POST /orders/${ob}/lines"
              payload: { product_id: "${pid}", qty: 1 }
              as: SalesClerk
          trigger:
            - call: "POST /orders/${ob}/deliveries"
