              payload: { official_id: "${ref_id}" }
              as: OfficiatingDirector
              captures: { idx_before: "$.data[0].accuracy_index", wep_before: "$.data[0].weighted_error_points", elig_before: "$.data[0].accuracy_eligible" }
            - call: "GET /officials/${ref_id}"
