      - name: unauthenticated_missing_or_unknown_role_header_rejected
        claim_type: error_triggerability
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "The priority-1 gate is proven to be authentication, not authorization: an X-User-Role that is not one of the five declared roles is 401 ERR_UNAUTHENTICATED (never 403), and so is an omitted X-User-ID; the identical request with a declared role and an id succeeds."
        test_recipe:
          setup:
            - "One season in status SETUP and one team, created normally."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
          trigger:
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: Spectator
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: StateOffice
              as_user_id: ""
              captures: { err_missing_id: $.data.error_id }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: StateOffice
              captures: { ok_status: $.data.status }
          assert:
            - "${err_unknown_role} == 'ERR_UNAUTHENTICATED' with HTTP 401 — 'Spectator' is not one of {StateOffice, Assessor, TeamCoach, WeighInOfficial, MedicalReviewer}, and an unknown role is an authentication failure, NOT the 403 ERR_UNAUTHORIZED reserved for a declared role acting outside its endpoint list"
            - "${err_missing_id} == 'ERR_UNAUTHENTICATED' with HTTP 401 — the empty/absent X-User-ID header fails the same priority-1 check even with a valid role"
            - "${ok_status} == 'SETUP' on the identical request carrying both headers, so the 401s were caused by the headers alone"
            - "Neither 401 created, mutated or versioned any row: Season.version is unchanged and GET /seasons/${season_id}/teams still returns total_count == 1"

      - name: disqualified_and_season_not_open_errors_covered_by_difficulty_design
        claim_type: error_triggerability
        grounds:
          - errors[ERR_WRESTLER_DISQUALIFIED]
          - errors[ERR_SEASON_NOT_OPEN]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / disqualified_beats_season_not_open
          rationale: "That §1.8 instance triggers both error ids on the same endpoint — ERR_WRESTLER_DISQUALIFIED when both conditions hold and ERR_SEASON_NOT_OPEN once only the season condition remains — so both are demonstrably reachable there."

      - name: entry_window_conflict_and_duplicate_entry_errors_covered_by_difficulty_design
        claim_type: error_triggerability
        grounds:
          - errors[ERR_ENTRY_WINDOW_CONFLICT]
          - errors[ERR_DUPLICATE_ENTRY]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / entry_window_conflict_beats_duplicate_entry
          rationale: "That §1.8 instance returns ERR_ENTRY_WINDOW_CONFLICT while both conditions hold and ERR_DUPLICATE_ENTRY after the overlapping window is removed, so each id has at least one triggering call there."

      - name: team_on_probation_error_covered_by_difficulty_design
