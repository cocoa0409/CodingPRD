      - name: cell_auto_select_empty_pool_rejected
        claim_type: violation_to_error
        grounds: [calculations.cell_auto_select, "errors[ERR_NO_CELL_AVAILABLE]"]
        distinguishing_aspect: "With cell_id omitted and no cell able to take 5000 kg, creation fails with ERR_NO_CELL_AVAILABLE (selector empty-pool fallback)."
