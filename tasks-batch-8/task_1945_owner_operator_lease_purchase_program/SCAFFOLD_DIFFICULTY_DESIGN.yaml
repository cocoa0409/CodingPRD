# =============================================================================
# Task 1945 — Owner-Operator Lease-Purchase Program
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × >=2 instances = 19 instances (rule 2 carries 3, one per mode a/b/c)
#
# Shared fixture conventions (re-instantiated per instance from empty DB):
#   lease start_date 2026-08-03, term_weeks 52  -> term end 2027-08-02
#   weeks: W1=2026-08-03, W2=2026-08-10, W3=2026-08-17, W4=2026-08-24
#   week W is settleable once clock >= W + 7 days
#   required compliance docs: W9, OPERATING_AUTHORITY, INSURANCE_CERTIFICATE
#   standard terms: weekly_payment 65000, escrow weekly 20000, guarantee 150000
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_maintenance_provisional_vs_final
        grounds:
          - calculations.settlement_waterfall
          - calculations.deduction_line_amounts
          - state_machines.SettlementStatement.ISSUED_to_FINALIZED
          - entities.SettlementStatement.fields.maintenance_deduction_cents
        distinguishing_aspect: |
          Same settlement inputs produce maintenance_deduction_cents 31250 under the
          provisional reserve-accrual basis (miles 2500 x 12.5) but 45000 under the
          final actual-billed basis (one OPERATOR work order completed in the week);
          entity domain = SettlementStatement ledger.
        test_recipe:
          setup:
            - "ACTIVE lease (weekly 65000, escrow 20000/wk cap 500000, guarantee 150000, start 2026-08-03, term 52) for a VERIFIED operator"
            - "One REPAIR work order completed 2026-08-05 (inside W1) at actual_cost 45000, odometer 120000 > warranty limit 100000 -> billed_to OPERATOR"
            - "Settlement for W1: gross 250000, fuel 200 gal @ 350 cpg, insurance 22000, miles 2500"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-DV1" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-DV1", year: 2023, make: "Freightliner", model: "Cascadia", odometer_current: 90000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/service-bays", payload: { bay_code: "BAY-DV1", location: "Terminal 4" }, as: MaintenanceCoordinator, captures: { bay: $.data.id } }
            - { call: "POST /lease-program/maintenance-work-orders", payload: { lease_id: "${lease}", service_bay_id: "${bay}", category: "REPAIR", description: "Turbo actuator", scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T10:00:00Z", estimated_cost_cents: 40000 }, as: MaintenanceCoordinator, captures: { wo: $.data.id } }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/maintenance-work-orders/${wo}/complete", payload: { actual_cost_cents: 45000, odometer_at_service: 120000 }, as: MaintenanceCoordinator }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st: $.data.id } }
            - { call: "POST /lease-program/settlement-statements/${st}/issue", payload: {}, as: SettlementClerk, captures: { st_issued_maint: $.data.maintenance_deduction_cents, st_issued_net: $.data.net_pay_cents } }
          trigger:
            - { call: "POST /lease-program/settlement-statements/${st}/finalize", payload: {}, as: SettlementClerk, captures: { st_final_maint: $.data.maintenance_deduction_cents, st_final_net: $.data.net_pay_cents, st_final_escrow: $.data.escrow_contribution_cents } }
          assert:
            - "captured st_issued_maint == 31250  (provisional: round_half_up(2500 * 12.5))"
            - "captured st_issued_net == 41750    (250000 - 70000 - 22000 - 31250 - 20000 - 65000)"
            - "captured st_final_maint == 45000   (final: actual OPERATOR work-order cost)"
            - "captured st_final_net == 28000     (250000 - 70000 - 22000 - 45000 - 20000 - 65000)"
            - "captured st_final_escrow == 20000"
            - "st_issued_maint != st_final_maint for identical settlement inputs"
            - "SettlementStatement.${st}.status == FINALIZED"

      - name: buyout_price_scheduled_vs_early
        grounds:
          - calculations.buyout_quote_pricing
          - state_machines.BuyoutQuote.GENERATED_to_SUPERSEDED
          - entities.BuyoutQuote.fields.quoted_price_cents
        distinguishing_aspect: |
          Same lease prices at 4831500 under the EARLY variant (week 1 of 52: base
          4500000 + round_half_up(51 * 65000 * 0.10) = 331500 fee) but 4500000 under
          the SCHEDULED variant at term end; entity domain = BuyoutQuote/LeaseAgreement
          asset pricing, different from the settlement ledger.
        test_recipe:
          setup:
            - "ACTIVE lease (weekly 65000, buyout base 4500000, start 2026-08-03, term 52), escrow balance 0, arrears 0"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-DV2" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-DV2", year: 2023, make: "Kenworth", model: "T680", odometer_current: 50000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
            - { call: "GET /lease-program/lease-agreements/${lease}", payload: {}, as: LeaseAdmin, captures: { lv1: $.data.version } }
          trigger:
            - { call: "POST /lease-program/buyout-quotes", payload: { lease_id: "${lease}", quote_kind: "EARLY", expected_lease_version: "${lv1}" }, as: LeaseAdmin, captures: { q1: $.data.id, q1_price: $.data.quoted_price_cents } }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2027-08-03T00:00:00Z" }, as: LeaseAdmin }
            - { call: "GET /lease-program/lease-agreements/${lease}", payload: {}, as: LeaseAdmin, captures: { lv2: $.data.version } }
            - { call: "POST /lease-program/buyout-quotes", payload: { lease_id: "${lease}", quote_kind: "SCHEDULED", expected_lease_version: "${lv2}" }, as: LeaseAdmin, captures: { q2: $.data.id, q2_price: $.data.quoted_price_cents } }
          assert:
            - "captured q1_price == 4831500  (EARLY at weeks_elapsed 1: 4500000 + round_half_up(51*65000*0.10)=331500)"
            - "captured q2_price == 4500000  (SCHEDULED: base price, no fee)"
            - "q1_price != q2_price for the same lease"
            - "BuyoutQuote.${q1}.status == SUPERSEDED after q2 creation"
            - "BuyoutQuote.${q2}.status == GENERATED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_nested_min_max_guarantee_escrow_lease
        grounds:
          - calculations.settlement_waterfall
          - calculations.guarantee_top_up
          - entities.SettlementStatement.fields.lease_payment_applied_cents
        distinguishing_aspect: |
          Mode (a): three conditional non-linearities interact on one settlement —
          guarantee branch max(0, 150000-100000)=50000, escrow branch min(20000,
          cap-room, remaining 26750)=20000, lease branch min(65000, remaining 6750)=6750
          producing a partial payment and net_pay 0.
        test_recipe:
          setup:
            - "ACTIVE lease (weekly 65000, escrow 20000/wk cap 45000, guarantee 150000), lane ACCEPTED covering W1"
            - "Settlement W1: gross 100000, fuel 200 gal @ 350, insurance 22000, miles 2500, load_declined false"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-CF1" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-CF1", year: 2022, make: "Peterbilt", model: "579", odometer_current: 80000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 45000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/lane-assignments", payload: { lease_id: "${lease}", origin: "ATL", destination: "DAL", weekly_commitment_cents: 120000, start_date: "2026-08-03", end_date: "2026-10-26" }, as: LeaseAdmin, captures: { lane: $.data.id } }
            - { call: "POST /lease-program/lane-assignments/${lane}/accept", payload: {}, as: Driver, as_user_id: "${op}" }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
          trigger:
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 100000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st: $.data.id } }
          assert:
            - "SettlementStatement.${st}.guarantee_top_up_cents == 50000   (max(0, 150000-100000); eligible: ACTIVE + lane ACCEPTED + not declined)"
            - "SettlementStatement.${st}.maintenance_deduction_cents == 31250"
            - "SettlementStatement.${st}.escrow_contribution_cents == 20000  (min(20000, 45000, 26750))"
            - "SettlementStatement.${st}.lease_payment_applied_cents == 6750  (min(65000, 150000-70000-22000-31250-20000))"
            - "SettlementStatement.${st}.payment_short_flag == true"
            - "SettlementStatement.${st}.net_pay_cents == 0"

      - name: per_line_rounding_order_pinned
        grounds:
          - calculations.deduction_line_amounts
          - calculations.settlement_waterfall
          - entities.SettlementStatement.fields.fuel_deduction_cents
        distinguishing_aspect: |
          Mode (b): fuel 100.5 gal x 333 cpg = 33466.5 and maintenance 1041 mi x 12.5
          = 13012.5; the pinned round-per-line-then-sum order yields 33467 + 13013 =
          46480, while sum-then-round would yield 46479 — the scaffold's order wins.
        test_recipe:
          setup:
            - "ACTIVE lease (standard terms), no lane needed (gross 250000 >= guarantee 150000 so top_up is 0 either way)"
            - "Settlement W1: gross 250000, fuel_gallons 100.5 @ 333 cpg, insurance 22000, miles 1041"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-CF2" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-CF2", year: 2024, make: "Volvo", model: "VNL", odometer_current: 30000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
          trigger:
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 250000, fuel_gallons: 100.5, fuel_price_cents_per_gallon: 333, insurance_weekly_cents: 22000, miles_driven: 1041, load_declined_flag: false }, as: SettlementClerk, captures: { st: $.data.id } }
          assert:
            - "SettlementStatement.${st}.fuel_deduction_cents == 33467   (round_half_up(100.5 * 333 = 33466.5))"
            - "SettlementStatement.${st}.maintenance_deduction_cents == 13013  (round_half_up(1041 * 12.5 = 13012.5))"
            - "fuel_deduction_cents + maintenance_deduction_cents == 46480, NOT 46479 (sum-then-round)"
            - "SettlementStatement.${st}.escrow_contribution_cents == 20000"
            - "SettlementStatement.${st}.lease_payment_applied_cents == 65000"
            - "SettlementStatement.${st}.net_pay_cents == 96520  (250000 - 33467 - 22000 - 13013 - 20000 - 65000)"

      - name: buyout_evaluation_order_pinned
        grounds:
          - calculations.buyout_quote_pricing
          - calculations.missed_payment_tracking
          - entities.BuyoutQuote.fields.amount_due_cents
        distinguishing_aspect: |
          Mode (c): price, arrears, and escrow credit interdepend; the pinned order
          (price -> arrears snapshot -> credit = min(balance, price+arrears) -> due)
          yields amount_due 4818500 + 130000 - 20000 = 4928500 with escrow_credit
          20000, whereas refunding escrow outside the quote would give 4948500.
        test_recipe:
          setup:
            - "ACTIVE lease (standard terms, cap 500000), lane ACCEPTED covering W1..W3"
            - "W1 finalized healthy (escrow +20000, payment in full); W2 and W3 finalized with load_declined true and all-zero economics -> 2 short payments, arrears 130000, missed_payment_count 2"
            - "clock at 2026-08-28 (weeks_elapsed 3, remaining_weeks 49)"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-CF3" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d1}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "OPERATING_AUTHORITY", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d2: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d2}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "INSURANCE_CERTIFICATE", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d3: $.data.id } }
            - { call: "POST /lease-program/compliance-documents/${d3}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-program/trucks", payload: { vin: "VIN-CF3", year: 2023, make: "Mack", model: "Anthem", odometer_current: 60000, powertrain_warranty_expires_on: "2027-01-01", powertrain_warranty_mileage_limit: 100000 }, as: LeaseAdmin, captures: { truck: $.data.id } }
            - { call: "POST /lease-program/lease-agreements", payload: { owner_operator_id: "${op}", truck_id: "${truck}", start_date: "2026-08-03", term_weeks: 52, weekly_payment_cents: 65000, escrow_weekly_contribution_cents: 20000, escrow_cap_cents: 500000, buyout_base_price_cents: 4500000, min_revenue_guarantee_weekly_cents: 150000 }, as: LeaseAdmin, captures: { lease: $.data.id } }
            - { call: "POST /lease-program/lease-agreements/${lease}/activate", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-program/lane-assignments", payload: { lease_id: "${lease}", origin: "CHI", destination: "MSP", weekly_commitment_cents: 120000, start_date: "2026-08-03", end_date: "2026-10-26" }, as: LeaseAdmin, captures: { lane: $.data.id } }
            - { call: "POST /lease-program/lane-assignments/${lane}/accept", payload: {}, as: Driver, as_user_id: "${op}" }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-03", gross_revenue_cents: 250000, fuel_gallons: 200, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 22000, miles_driven: 2500, load_declined_flag: false }, as: SettlementClerk, captures: { st1: $.data.id } }
            - { call: "POST /lease-program/settlement-statements/${st1}/issue", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/settlement-statements/${st1}/finalize", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-10", gross_revenue_cents: 0, fuel_gallons: 0, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 0, miles_driven: 0, load_declined_flag: true }, as: SettlementClerk, captures: { st2: $.data.id } }
            - { call: "POST /lease-program/settlement-statements/${st2}/issue", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/settlement-statements/${st2}/finalize", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: LeaseAdmin }
            - { call: "POST /lease-program/settlement-statements", payload: { lease_id: "${lease}", week_start_date: "2026-08-17", gross_revenue_cents: 0, fuel_gallons: 0, fuel_price_cents_per_gallon: 350, insurance_weekly_cents: 0, miles_driven: 0, load_declined_flag: true }, as: SettlementClerk, captures: { st3: $.data.id } }
            - { call: "POST /lease-program/settlement-statements/${st3}/issue", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/settlement-statements/${st3}/finalize", payload: {}, as: SettlementClerk }
            - { call: "POST /lease-program/_clock/set_current_utc", payload: { to_iso8601: "2026-08-28T00:00:00Z" }, as: LeaseAdmin }
            - { call: "GET /lease-program/lease-agreements/${lease}", payload: {}, as: LeaseAdmin, captures: { lv: $.data.version } }
          trigger:
            - { call: "POST /lease-program/buyout-quotes", payload: { lease_id: "${lease}", quote_kind: "EARLY", expected_lease_version: "${lv}" }, as: LeaseAdmin, captures: { q: $.data.id } }
          assert:
            - "LeaseAgreement.${lease}.arrears_cents == 130000 and missed_payment_count == 2 (pre-quote state)"
            - "BuyoutQuote.${q}.quoted_price_cents == 4818500  (4500000 + round_half_up(49*65000*0.10)=318500)"
            - "BuyoutQuote.${q}.arrears_carried_cents == 130000"
            - "BuyoutQuote.${q}.escrow_credit_cents == 20000   (min(balance 20000, 4818500+130000))"
            - "BuyoutQuote.${q}.amount_due_cents == 4928500    (max(0, 4818500 + 130000 - 20000))"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
