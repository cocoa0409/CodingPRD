scenario: "2370. Marine Bunkering & Vessel Fuel Supply (bunker fuel supplier): vessel nomination intake with grade, quantity, delivery window and port logistics, sulfur content and fuel specification compliance for emission control areas with documentation, barge or truck delivery scheduling with port authority and terminal coordination, quantity measurement by tank soundings, meters and joint surveys with dispute procedures, bunker delivery note issuance and mandatory sample retention for testing, quality claim handling on off-spec fuel with laboratory analysis and remediation, credit terms, pricing indexation and bunker adjustment factors, spill prevention plans, boom deployment and incident response"
domain_name: "marine-bunkering-vessel-fuel-supply"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Port
    parent: null
    common_fields: true
    fields:
      - name: port_code
        type: string
        source: input
        description: "Operational port identifier used on clearance paperwork"
        constraints: "unique across Port; 1-16 chars; ERR_DUPLICATE_REFERENCE_CODE on collision"
      - name: name
        type: string
        source: input
        description: "Human-readable port name"
      - name: eca_zone
        type: boolean
        source: input
        description: "True when the port lies inside an Emission Control Area"
        default: false
      - name: eca_sulfur_limit_pct
        type: number
        source: input
        description: "Regulatory maximum sulfur content (mass %) enforced at this port"
        default: 0.10
        constraints: "3 decimal places; > 0"
      - name: notice_lead_hours
        type: integer
        source: input
        description: "Minimum hours between nomination confirmation and the start of any delivery slot at this port"
        default: 24
        constraints: ">= 0"
      - name: concurrent_ops_capacity
        type: integer
        source: input
        description: "Maximum number of delivery orders whose [slot_start, slot_end) intervals may overlap at this port"
        default: 2
        constraints: ">= 1"
      - name: spill_response_tier
        type: enum
        source: input
        description: "Contracted spill-response tier of the port"
        default: "TIER_2"
        constraints: "TIER_1 | TIER_2 | TIER_3"

  - name: FuelGrade
    parent: null
    common_fields: true
    fields:
      - name: grade_code
        type: string
        source: input
        description: "Grade identifier, e.g. MGO-DMA, VLSFO-RME"
        constraints: "unique across FuelGrade; ERR_DUPLICATE_REFERENCE_CODE on collision"
      - name: max_sulfur_pct
        type: number
        source: input
        description: "Contractual sulfur ceiling (mass %) of the grade as sold"
        constraints: "3 decimal places; > 0"
      - name: eca_permitted
        type: boolean
        source: input
        description: "True when the grade may be burned inside an Emission Control Area"
        default: false
      - name: test_tolerance_pct
        type: number
        source: input
        description: "ISO 4259 reproducibility tolerance (mass %) added to the effective limit before a laboratory result counts as off-spec"
        default: 0.01
        constraints: "3 decimal places; >= 0"
      - name: index_code
        type: string
        source: input
        description: "Price index symbol whose IndexQuote rows price this grade"
      - name: base_barging_rate_usd_per_mt
        type: number
        source: input
        description: "Barging/trucking rate in USD per metric tonne used by calculations.invoice_amount"
        constraints: "2 decimal places; >= 0"
      - name: min_barging_fee_usd
        type: number
        source: input
        description: "Floor applied to the barging fee component of an invoice"
        constraints: "2 decimal places; >= 0"
      - name: cross_contamination_group
        type: enum
        source: input
        description: "Segregation family; an asset that last carried a different group needs segregated tanks"
        constraints: "DISTILLATE | RESIDUAL | BIOBLEND"

  - name: IndexQuote
    parent: null
    common_fields: false
    fields:
      - name: grade_id
        type: string
        source: input
        description: "FK -> FuelGrade.id; the grade this quote prices"
      - name: quote_date
        type: datetime
        source: input
        description: "UTC date-time the quote is effective from; quotes are immutable once posted"
      - name: price_usd_per_mt
        type: number
        source: input
        description: "Published index price in USD per metric tonne"
        constraints: "2 decimal places; > 0"
      - name: source
        type: enum
        source: input
        description: "Publishing agency of the quote"
        default: "PLATTS"
        constraints: "PLATTS | ARGUS"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Shipowner, operator or charterer buying bunkers"
      - name: credit_limit_usd
        type: number
        source: input
        description: "Maximum settled-plus-committed exposure the supplier will carry for this customer"
        constraints: "2 decimal places; >= 0"
      - name: payment_terms_days
        type: integer
        source: input
        description: "Net payment days added to Invoice.issued_at to derive Invoice.due_date"
        default: 30
        constraints: ">= 0"
      - name: settlement_basis
        type: enum
        source: input
        description: "Contractual quantity basis; JOINT_SURVEY_MANDATORY forces a surveyor figure before a BDN may be issued"
        default: "SUPPLIER_FIGURES"
        constraints: "SUPPLIER_FIGURES | JOINT_SURVEY_MANDATORY"
      - name: outstanding_balance_usd
        type: number
        source: computed
        description: "Settled exposure per calculations.customer_credit_exposure variant settled_receivables"
        default: 0.00
        constraints: "2 decimal places"
      - name: conservative_exposure_usd
        type: number
        source: computed
        description: "Settled receivables plus index-valued open commitments per calculations.customer_credit_exposure variant conservative_commitments"
        default: 0.00
        constraints: "2 decimal places"
      - name: available_credit_usd
        type: number
        source: computed
        description: "round(credit_limit_usd - conservative_exposure_usd, 2); may be negative"
        constraints: "2 decimal places"
      - name: open_commitment_count
        type: integer
        source: computed
        description: "Count of Nomination rows entering the open-commitment set of calculations.customer_credit_exposure"
        default: 0
        constraints: ">= 0"
      - name: credit_status
        type: enum
        source: computed
        description: "Derived from settled utilisation per calculations.customer_credit_exposure"
        default: "OK"
        constraints: "OK | WATCH | HOLD"

  - name: DeliveryAsset
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Barge or road-tanker name"
      - name: asset_type
        type: enum
        source: input
        description: "Delivery mode this asset provides"
        constraints: "BARGE | TRUCK"
      - name: capacity_mt
        type: number
        source: input
        description: "Maximum tonnage the asset can lift in one delivery"
        constraints: "3 decimal places; > 0"
      - name: home_port_id
        type: string
        source: input
        description: "FK -> Port.id; the only port at which this asset may be scheduled"
      - name: boom_certified
        type: boolean
        source: input
        description: "True when the asset carries a certified containment boom"
        default: false
      - name: segregated_tanks
        type: boolean
        source: input
        description: "True when the asset can load a different cross_contamination_group than its last cargo"
        default: false
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: "Minutes of cleaning/transit the asset needs strictly between two of its own delivery slots"
        default: 90
        constraints: ">= 0"
      - name: last_grade_id
        type: string
        source: computed
        description: "FK -> FuelGrade.id; grade of the most recent DeliveryOrder that reached logistics_status PUMPING on this asset, null before the first"
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE, or QUARANTINED after a MAJOR SpillIncident until return-to-service"
        default: "AVAILABLE"
        constraints: "AVAILABLE | QUARANTINED"
      - name: committed_quantity_mt
        type: number
        source: computed
        description: "Sum of planned_quantity_mt over DeliveryOrder rows on this asset with logistics_status IN {SCHEDULED, CLEARED, PUMPING}"
        default: 0.000
        constraints: "3 decimal places"
      - name: compliance_score
        type: number
        source: computed
        description: "Spill-history score per calculations.asset_compliance_score; drives selector ranking in calculations.auto_schedule_asset_selection"
        default: 100.00
        constraints: "2 decimal places; 0.00-100.00"

  - name: Nomination
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer nominating the stem"
      - name: port_id
        type: string
        source: input
        description: "FK -> Port.id; delivery port"
      - name: grade_id
        type: string
        source: input
        description: "FK -> FuelGrade.id; nominated grade"
      - name: vessel_imo
        type: string
        source: input
        description: "IMO number of the receiving vessel"
        constraints: "exactly 7 digits"
      - name: vessel_name
        type: string
        source: input
        description: "Name of the receiving vessel"
      - name: scrubber_fitted
        type: boolean
        source: input
        description: "True when the vessel has an approved exhaust gas cleaning system, which relaxes the ECA grade check"
        default: false
      - name: nominated_quantity_mt
        type: number
        source: input
        description: "Tonnage requested by the customer"
        constraints: "3 decimal places; > 0"
      - name: window_start
        type: datetime
        source: input
        description: "Earliest UTC instant the vessel can receive bunkers"
      - name: window_end
        type: datetime
        source: input
        description: "Latest UTC instant the vessel can receive bunkers; must be >= window_start + 6h"
      - name: delivery_mode
        type: enum
        source: input
        description: "Requested delivery asset type"
        constraints: "BARGE | TRUCK"
      - name: declared_sulfur_pct
        type: number
        source: input
        description: "Maximum sulfur content (mass %) the customer will accept"
        constraints: "3 decimal places; > 0"
      - name: eca_documentation_ref
        type: string
        source: input
        description: "Fuel-changeover / bunker-delivery documentation reference required when the port is an ECA and the vessel has no scrubber"
        default: null
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Logistics dimension of the nomination; evolves independently of compliance_status"
        default: "DRAFT"
        constraints: "DRAFT | CONFIRMED | SCHEDULED | AWAITING_SCHEDULE | DELIVERED | CLOSED"
      - name: compliance_status
        type: enum
        source: computed
        description: "Regulatory dimension of the nomination; evolves independently of fulfillment_status"
        default: "PENDING_REVIEW"
        constraints: "PENDING_REVIEW | APPROVED | REJECTED"
      - name: compliance_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who last decided compliance_status; null while PENDING_REVIEW and never reused as the BDN issuer"
        default: null

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - name: nomination_id
        type: string
        source: input
        description: "FK -> Nomination.id; the stem this order serves"
      - name: asset_id
        type: string
        source: input
        description: "FK -> DeliveryAsset.id; barge or truck performing the delivery; chosen by the server when the order is created by auto-schedule"
      - name: planned_quantity_mt
        type: number
        source: input
        description: "Tonnage this order intends to pump; defaults to the nomination's nominated_quantity_mt on auto-schedule"
        constraints: "3 decimal places; > 0"
      - name: slot_start
        type: datetime
        source: input
        description: "UTC start of the occupied delivery slot"
      - name: slot_end
        type: datetime
        source: input
        description: "UTC end of the occupied delivery slot; computed by calculations.auto_schedule_asset_selection when the order is created by POST /nominations/{id}/auto-schedule"
      - name: logistics_status
        type: enum
        source: computed
        description: "Physical-delivery dimension of the order; evolves independently of measurement_status"
        default: "SCHEDULED"
        constraints: "SCHEDULED | CLEARED | PUMPING | DELIVERED | SUSPENDED | CANCELLED"
      - name: measurement_status
        type: enum
        source: computed
        description: "Quantity-agreement dimension of the order; evolves independently of logistics_status"
        default: "NOT_STARTED"
        constraints: "NOT_STARTED | FIGURES_RECORDED | AGREED | DISPUTED | RESURVEYED"
      - name: barge_sounding_mt
        type: number
        source: input
        description: "Supplier-side tank sounding figure recorded at POST /delivery-orders/{id}/complete-pumping"
        default: null
        constraints: "3 decimal places; > 0"
      - name: vessel_sounding_mt
        type: number
        source: input
        description: "Receiving-vessel tank sounding figure recorded at complete-pumping; the customer's evidence for a quantity dispute"
        default: null
        constraints: "3 decimal places; > 0"
      - name: meter_mt
        type: number
        source: input
        description: "Mass-flow meter totaliser figure recorded at complete-pumping; cross-checked against barge_sounding_mt"
        default: null
        constraints: "3 decimal places; > 0"
      - name: surveyed_mt
        type: number
        source: input
        description: "Independent surveyor figure recorded at POST /delivery-orders/{id}/joint-survey"
        default: null
        constraints: "3 decimal places; > 0"
      - name: agreed_quantity_mt
        type: number
        source: computed
        description: "Governing delivered tonnage per calculations.agreed_quantity_resolution; null until measurement_status reaches AGREED"
        default: null
        constraints: "3 decimal places"
      - name: measurement_basis
        type: enum
        source: computed
        description: "Which variant of calculations.agreed_quantity_resolution produced agreed_quantity_mt"
        default: null
        constraints: "SUPPLIER_FIGURES | JOINT_SURVEY"
      - name: shortfall_mt
        type: number
        source: computed
        description: "round(barge_sounding_mt - agreed_quantity_mt, 3); the supplier-borne quantity difference, 0.000 on the SUPPLIER_FIGURES basis"
        default: null
        constraints: "3 decimal places"
      - name: port_clearance_ref
        type: string
        source: input
        description: "Port-authority and terminal clearance reference captured at POST /delivery-orders/{id}/clear"
        default: null
      - name: cleared_at
        type: datetime
        source: system
        description: "Logical-clock instant the clearance was recorded"
        default: null

  - name: BunkerDeliveryNote
    parent: null
    common_fields: true
    fields:
      - name: delivery_order_id
        type: string
        source: input
        description: "FK -> DeliveryOrder.id; the completed delivery this note evidences"
      - name: bdn_number
        type: string
        source: input
        description: "MARPOL Annex VI bunker delivery note number"
        constraints: "unique across BunkerDeliveryNote; ERR_DUPLICATE_BDN_NUMBER on collision"
      - name: declared_sulfur_pct
        type: number
        source: input
        description: "Sulfur content (mass %) declared on the note by the issuing supplier"
        constraints: "3 decimal places; > 0"
      - name: delivered_quantity_mt
        type: number
        source: computed
        description: "Snapshot of DeliveryOrder.agreed_quantity_mt at issuance"
        constraints: "3 decimal places"
      - name: sample_seal_number
        type: string
        source: input
        description: "Seal number of the mandatory MARPOL retained sample"
        constraints: "unique across BunkerDeliveryNote; ERR_DUPLICATE_SAMPLE_SEAL on collision"
      - name: sample_retention_until
        type: datetime
        source: computed
        description: "created_at + SAMPLE_RETENTION_DAYS (90 days); after this instant the sample may no longer back a claim"
      - name: sample_custody_status
        type: enum
        source: computed
        description: "RELEASED_TO_LAB once sample_released_at is set; else EXPIRED when the logical clock is past sample_retention_until; else RETAINED"
        default: "RETAINED"
        constraints: "RETAINED | RELEASED_TO_LAB | EXPIRED"
      - name: sample_released_at
        type: datetime
        source: system
        description: "Logical-clock instant the sample was released to the laboratory"
        default: null
      - name: status
        type: enum
        source: computed
        description: "SUPERSEDED once a corrected note is issued against the same delivery order"
        default: "ISSUED"
        constraints: "ISSUED | SUPERSEDED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the OpsCoordinator who issued the note; must differ from the nomination's compliance_reviewer_user_id"

  - name: QualityClaim
    parent: null
    common_fields: true
    fields:
      - name: bdn_id
        type: string
        source: input
        description: "FK -> BunkerDeliveryNote.id; the note whose retained sample backs the claim"
      - name: customer_id
        type: string
        source: computed
        description: "FK -> Customer.id; copied from the nomination behind the note"
      - name: claimed_defect
        type: enum
        source: input
        description: "Nature of the alleged off-spec condition"
        constraints: "SULFUR_EXCEEDANCE | WATER_CONTENT | DENSITY_DEVIATION"
      - name: affected_quantity_mt
        type: number
        source: input
        description: "Tonnage the customer claims is unusable; may not exceed quantity_basis_mt"
        constraints: "3 decimal places; > 0"
      - name: quantity_basis_mt
        type: number
        source: computed
        description: "Snapshot of BunkerDeliveryNote.delivered_quantity_mt taken at claim submission and never re-read"
        constraints: "3 decimal places"
      - name: replacement_price_usd_per_mt
        type: number
        source: input
        description: "Price the customer paid for replacement fuel; required by the DEBUNKER remediation branch"
        default: null
        constraints: "2 decimal places; > 0"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle; UNDER_ANALYSIS is re-entered on each retest round"
        default: "SUBMITTED"
        constraints: "SUBMITTED | UNDER_ANALYSIS | REMEDIATION_PROPOSED | REMEDIATION_ACCEPTED | REJECTED"
      - name: analysis_round
        type: integer
        source: computed
        description: "Count of LabAnalysis rows filed against this claim; capped by MAX_ANALYSIS_ROUNDS"
        default: 0
        constraints: "0-2"
      - name: remediation_type
        type: enum
        source: computed
        description: "Remediation branch selected by the surveyor at POST /quality-claims/{id}/decision"
        default: null
        constraints: "PRICE_ALLOWANCE | DEBUNKER"
      - name: credit_usd
        type: number
        source: computed
        description: "Credit per calculations.remediation_credit; 0.00 until a remediation is proposed"
        default: 0.00
        constraints: "2 decimal places"
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Surveyor who proposed the remediation"
        default: null
      - name: accepted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CreditController who booked the credit; must differ from proposed_by_user_id"
        default: null

  - name: LabAnalysis
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> QualityClaim.id; the claim under analysis"
      - name: retest_of_analysis_id
        type: string
        source: input
        description: "FK -> LabAnalysis.id; the first-round analysis this retest re-examines, null on a first round"
        default: null
      - name: lab_ref
        type: string
        source: input
        description: "Laboratory report reference"
      - name: measured_sulfur_pct
        type: number
        source: input
        description: "Sulfur content (mass %) measured on the retained sample"
        constraints: "3 decimal places; > 0"
      - name: verdict
        type: enum
        source: computed
        description: "Per calculations.offspec_verdict against the effective sulfur limit plus grade tolerance"
        constraints: "ON_SPEC | OFF_SPEC"
      - name: exceedance_pct
        type: number
        source: computed
        description: "round(measured_sulfur_pct - (effective_limit + test_tolerance_pct), 3), floored at 0.000"
        constraints: "3 decimal places"
      - name: round_index
        type: integer
        source: computed
        description: "1 for the first analysis on the claim, 2 for the retest"
        constraints: "1-2"
      - name: analyzed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LabTechnician who filed the analysis"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: delivery_order_id
        type: string
        source: input
        description: "FK -> DeliveryOrder.id; the delivery being billed"
      - name: customer_id
        type: string
        source: computed
        description: "FK -> Customer.id; copied from the nomination behind the delivery order"
      - name: pricing_date
        type: datetime
        source: input
        description: "Indexation date; selects the IndexQuote used for pricing"
      - name: index_price_usd_per_mt
        type: number
        source: computed
        description: "Price of the latest IndexQuote for the grade with quote_date <= pricing_date"
        constraints: "2 decimal places"
      - name: quantity_basis_mt
        type: number
        source: computed
        description: "Snapshot of DeliveryOrder.agreed_quantity_mt at invoice creation"
        constraints: "3 decimal places"
      - name: fuel_cost_usd
        type: number
        source: computed
        description: "First component of calculations.invoice_amount"
        constraints: "2 decimal places"
      - name: baf_pct
        type: number
        source: computed
        description: "Bunker adjustment factor per calculations.bunker_adjustment_factor"
        constraints: "4 decimal places"
      - name: baf_usd
        type: number
        source: computed
        description: "Second component of calculations.invoice_amount"
        constraints: "2 decimal places"
      - name: barging_fee_usd
        type: number
        source: computed
        description: "Third component of calculations.invoice_amount, floored at FuelGrade.min_barging_fee_usd"
        constraints: "2 decimal places"
      - name: eca_surcharge_usd
        type: number
        source: computed
        description: "Fourth component of calculations.invoice_amount; 0.00 outside an ECA port"
        constraints: "2 decimal places"
      - name: provisional_amount_usd
        type: number
        source: computed
        description: "Sum of the four rounded components per the pinned rounding order"
        constraints: "2 decimal places"
      - name: claim_credit_usd
        type: number
        source: computed
        description: "Sum of QualityClaim.credit_usd over claims on this delivery order with status REMEDIATION_ACCEPTED"
        default: 0.00
        constraints: "2 decimal places"
      - name: final_amount_usd
        type: number
        source: computed
        description: "round(provisional_amount_usd - claim_credit_usd, 2)"
        constraints: "2 decimal places"
      - name: status
        type: enum
        source: computed
        description: "Billing lifecycle"
        default: "PROVISIONAL"
        constraints: "PROVISIONAL | ISSUED | CREDIT_APPLIED | VOID"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant the invoice was issued"
        default: null
      - name: due_date
        type: datetime
        source: computed
        description: "issued_at + Customer.payment_terms_days; null until issuance"
        default: null

  - name: SpillIncident
    parent: null
    common_fields: true
    fields:
      - name: delivery_order_id
        type: string
        source: input
        description: "FK -> DeliveryOrder.id; the delivery during which fuel was spilled"
      - name: asset_id
        type: string
        source: computed
        description: "FK -> DeliveryAsset.id; copied from the delivery order"
      - name: port_id
        type: string
        source: computed
        description: "FK -> Port.id; copied from the nomination behind the delivery order"
      - name: reported_at
        type: datetime
        source: input
        description: "UTC instant the spill was observed; drives the decay window in calculations.asset_compliance_score"
      - name: volume_liters
        type: number
        source: input
        description: "Estimated spilled volume in litres"
        constraints: "2 decimal places; > 0"
      - name: boom_deployed
        type: boolean
        source: input
        description: "True when the containment boom was deployed before pumping resumed"
      - name: containment_confirmed
        type: boolean
        source: computed
        description: "False at creation; set to true only by POST /spill-incidents/{id}/confirm-containment; required to close the incident"
        default: false
      - name: severity
        type: enum
        source: computed
        description: "MAJOR when volume_liters >= 100.00 or boom_deployed is false; otherwise MINOR"
        constraints: "MINOR | MAJOR"
      - name: penalty_points
        type: number
        source: computed
        description: "MAJOR_PENALTY 45.00 for MAJOR, MINOR_PENALTY 15.00 for MINOR; consumed by calculations.asset_compliance_score"
        constraints: "2 decimal places"
      - name: response_ref
        type: string
        source: input
        description: "Port spill-response case reference"
        default: null
      - name: status
        type: enum
        source: computed
        description: "OPEN until the response is closed out"
        default: "OPEN"
        constraints: "OPEN | CLOSED"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the incident was closed"
        default: null

state_machines:
  - entity: Nomination
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED]
    note: "Compliance dimension of Nomination.compliance_status; evolves independently of the fulfillment dimension declared in the next machine (parallel state dimensions on one row)"
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /nominations/{id}/compliance-review with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "nomination.compliance_status == PENDING_REVIEW"
          - "if port.eca_zone AND nomination.scrubber_fitted == false: grade.eca_permitted == true AND grade.max_sulfur_pct <= port.eca_sulfur_limit_pct, else ERR_ECA_SULFUR_VIOLATION"
          - "if port.eca_zone AND nomination.scrubber_fitted == false: nomination.eca_documentation_ref is not null, else ERR_ECA_DOCUMENTATION_MISSING"
          - "nomination.declared_sulfur_pct <= grade.max_sulfur_pct, else ERR_ECA_SULFUR_VIOLATION"
        side_effects:
          - "sets Nomination.compliance_reviewer_user_id to the acting X-User-ID"
          - "increments Nomination.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /nominations/{id}/compliance-review with decision REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "nomination.compliance_status == PENDING_REVIEW"
        side_effects:
          - "sets Nomination.compliance_reviewer_user_id to the acting X-User-ID"
          - "increments Nomination.version by 1"
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /nominations/{id}/compliance-review with decision REOPEN"
        actor: ComplianceOfficer
        preconditions:
          - "nomination.compliance_status == REJECTED"
          - "nomination.fulfillment_status == DRAFT, else ERR_INVALID_NOMINATION_STATE"
        side_effects:
          - "clears Nomination.compliance_reviewer_user_id to null"
          - "increments Nomination.version by 1"
        note: "Cycle: a rejected nomination re-enters review after the customer amends the stem documentation"

  - entity: Nomination
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Fulfillment dimension of Nomination.fulfillment_status; a nomination may sit in (DRAFT, APPROVED) or (SCHEDULED, REJECTED) is unreachable because clearance requires APPROVED"
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /nominations/{id}/confirm"
        actor: OpsCoordinator
        preconditions:
          - "nomination.fulfillment_status == DRAFT"
          - "nomination.compliance_status == APPROVED, else ERR_COMPLIANCE_NOT_APPROVED"
          - "customer.credit_status != HOLD, else ERR_CUSTOMER_CREDIT_HOLD"
          - "calculations.credit_availability_check passes, else ERR_CREDIT_LIMIT_EXCEEDED"
        side_effects:
          - "increments Nomination.version by 1"
          - "the stem enters the open-commitment set of calculations.customer_credit_exposure variant conservative_commitments"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "POST /delivery-orders or POST /nominations/{id}/auto-schedule"
        actor: OpsCoordinator
        preconditions:
          - "nomination.fulfillment_status IN {CONFIRMED, AWAITING_SCHEDULE}"
          - "expected_nomination_version == nomination.version, else ERR_STALE_NOMINATION_VERSION"
          - "all §1.4 rows scoped to POST /delivery-orders pass"
        side_effects:
          - "creates a DeliveryOrder with logistics_status SCHEDULED and measurement_status NOT_STARTED"
          - "recomputes DeliveryAsset.committed_quantity_mt for the chosen asset"
          - "any pre-existing DeliveryOrder on this nomination with logistics_status IN {SCHEDULED, CLEARED} transitions to CANCELLED (supersede), which itself recomputes that asset's committed_quantity_mt"
          - "increments Nomination.version by 1"
      - from: AWAITING_SCHEDULE
        to: SCHEDULED
        trigger: "POST /delivery-orders or POST /nominations/{id}/auto-schedule"
        actor: OpsCoordinator
        preconditions:
          - "nomination.fulfillment_status == AWAITING_SCHEDULE"
          - "expected_nomination_version == nomination.version, else ERR_STALE_NOMINATION_VERSION"
        side_effects:
          - "creates a replacement DeliveryOrder with logistics_status SCHEDULED"
          - "recomputes DeliveryAsset.committed_quantity_mt for the chosen asset"
          - "increments Nomination.version by 1"
        note: "Cycle: SCHEDULED -> AWAITING_SCHEDULE -> SCHEDULED lets a stem be re-slotted after a cancellation"
      - from: SCHEDULED
        to: AWAITING_SCHEDULE
        trigger: "system cascade when the nomination's last non-terminal DeliveryOrder leaves logistics_status IN {SCHEDULED, CLEARED, PUMPING} without delivering (POST /delivery-orders/{id}/cancel, or the quarantine cascade of POST /spill-incidents)"
        actor: system
        preconditions:
          - "no remaining DeliveryOrder on this nomination has logistics_status IN {SCHEDULED, CLEARED, PUMPING}"
        side_effects:
          - "increments Nomination.version by 1"
      - from: SCHEDULED
        to: DELIVERED
        trigger: "system cascade from POST /delivery-orders/{id}/complete-pumping"
        actor: system
        preconditions:
          - "the completing DeliveryOrder reached logistics_status DELIVERED"
        side_effects:
          - "increments Nomination.version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: "system cascade from POST /invoices/{id}/issue"
        actor: system
        preconditions:
          - "the invoice for this nomination's delivered order reached status ISSUED"
        side_effects:
          - "increments Nomination.version by 1"
      - from: CLOSED
        to: DELIVERED
        trigger: "system cascade from POST /invoices/{id}/void"
        actor: system
        preconditions:
          - "the voided invoice was the only ISSUED or CREDIT_APPLIED invoice on this nomination's delivered order"
        side_effects:
          - "increments Nomination.version by 1"
        note: "Compensating reopen so a voided invoice can be re-raised; pairs with the CLOSED transition above"

  - entity: DeliveryOrder
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    note: "Logistics dimension of DeliveryOrder.logistics_status; evolves independently of the measurement dimension declared in the next machine"
    transitions:
      - from: SCHEDULED
        to: CLEARED
        trigger: "POST /delivery-orders/{id}/clear"
        actor: OpsCoordinator
        preconditions:
          - "order.logistics_status == SCHEDULED"
          - "nomination.compliance_status == APPROVED, else ERR_COMPLIANCE_NOT_APPROVED"
          - "asset.status == AVAILABLE, else ERR_ASSET_QUARANTINED"
          - "no SpillIncident on this asset has status OPEN, else ERR_OPEN_SPILL_INCIDENT"
          - "customer.credit_status != HOLD, else ERR_CUSTOMER_CREDIT_HOLD"
        side_effects:
          - "sets DeliveryOrder.port_clearance_ref and cleared_at to the logical clock"
      - from: CLEARED
        to: PUMPING
        trigger: "POST /delivery-orders/{id}/start-pumping"
        actor: BargeMaster
        preconditions:
          - "order.logistics_status == CLEARED"
          - "asset.boom_certified == true, else ERR_BOOM_NOT_CERTIFIED"
          - "asset.last_grade_id is null OR grade.cross_contamination_group of asset.last_grade_id == that of nomination.grade_id OR asset.segregated_tanks == true, else ERR_GRADE_INCOMPATIBLE_ASSET"
          - "logical clock >= order.slot_start, else ERR_SLOT_OUTSIDE_WINDOW"
        side_effects:
          - "sets DeliveryAsset.last_grade_id to the nomination's grade_id"
      - from: PUMPING
        to: DELIVERED
        trigger: "POST /delivery-orders/{id}/complete-pumping"
        actor: BargeMaster
        preconditions:
          - "order.logistics_status == PUMPING"
          - "abs(barge_sounding_mt - meter_mt) <= MEASUREMENT_TOLERANCE_MT (1.000), else ERR_MEASUREMENT_FIGURES_INCONSISTENT"
          - "barge_sounding_mt <= asset.capacity_mt, else ERR_ASSET_CAPACITY_EXCEEDED"
        side_effects:
          - "records barge_sounding_mt, vessel_sounding_mt and meter_mt; drives measurement_status NOT_STARTED -> FIGURES_RECORDED"
          - "removes the order from the committed set, recomputing DeliveryAsset.committed_quantity_mt"
          - "recomputes DeliveryAsset.compliance_score (the clean-delivery bonus term of calculations.asset_compliance_score)"
          - "cascades Nomination.fulfillment_status SCHEDULED -> DELIVERED"
      - from: SCHEDULED
        to: SUSPENDED
        trigger: "system cascade from POST /spill-incidents"
        actor: system
        preconditions:
          - "the incident's delivery_order_id is this order"
        side_effects:
          - "recomputes DeliveryAsset.compliance_score from the new SpillIncident.penalty_points"
          - "if the incident severity is MAJOR: cascades DeliveryAsset.status AVAILABLE -> QUARANTINED, which itself cascades every OTHER DeliveryOrder on that asset with logistics_status IN {SCHEDULED, CLEARED} to CANCELLED, each of which itself cascades its Nomination.fulfillment_status SCHEDULED -> AWAITING_SCHEDULE"
      - from: CLEARED
        to: SUSPENDED
        trigger: "system cascade from POST /spill-incidents"
        actor: system
        preconditions:
          - "the incident's delivery_order_id is this order"
        side_effects:
          - "recomputes DeliveryAsset.compliance_score from the new SpillIncident.penalty_points"
          - "if the incident severity is MAJOR: cascades DeliveryAsset.status AVAILABLE -> QUARANTINED, then that asset's other SCHEDULED/CLEARED orders to CANCELLED, then each of their Nominations to AWAITING_SCHEDULE"
      - from: PUMPING
        to: SUSPENDED
        trigger: "system cascade from POST /spill-incidents"
        actor: system
        preconditions:
          - "the incident's delivery_order_id is this order"
        side_effects:
          - "recomputes DeliveryAsset.compliance_score from the new SpillIncident.penalty_points"
          - "if the incident severity is MAJOR: cascades DeliveryAsset.status AVAILABLE -> QUARANTINED, then that asset's other SCHEDULED/CLEARED orders to CANCELLED, then each of their Nominations to AWAITING_SCHEDULE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /delivery-orders/{id}/cancel, or system supersede cascade from a later POST /delivery-orders on the same nomination"
        actor: OpsCoordinator
        preconditions:
          - "order.logistics_status IN {SCHEDULED, CLEARED, SUSPENDED}"
        side_effects:
          - "recomputes DeliveryAsset.committed_quantity_mt (releases planned_quantity_mt)"
          - "cascades Nomination.fulfillment_status SCHEDULED -> AWAITING_SCHEDULE when no other non-terminal order remains"
      - from: CLEARED
        to: CANCELLED
        trigger: "POST /delivery-orders/{id}/cancel"
        actor: OpsCoordinator
        preconditions:
          - "order.logistics_status == CLEARED"
        side_effects:
          - "recomputes DeliveryAsset.committed_quantity_mt (releases planned_quantity_mt)"
          - "clears port_clearance_ref and cleared_at to null (compensates the clearance)"
          - "cascades Nomination.fulfillment_status SCHEDULED -> AWAITING_SCHEDULE when no other non-terminal order remains"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /delivery-orders/{id}/cancel"
        actor: OpsCoordinator
        preconditions:
          - "order.logistics_status == SUSPENDED"
        side_effects:
          - "recomputes DeliveryAsset.committed_quantity_mt (releases planned_quantity_mt)"
          - "cascades Nomination.fulfillment_status SCHEDULED -> AWAITING_SCHEDULE when no other non-terminal order remains"

  - entity: DeliveryOrder
    initial_state: NOT_STARTED
    terminal_states: []
    note: "Measurement dimension of DeliveryOrder.measurement_status; the FIGURES_RECORDED fork and the AGREED -> DISPUTED -> RESURVEYED -> AGREED loop make this machine both branching and cyclic"
    transitions:
      - from: NOT_STARTED
        to: FIGURES_RECORDED
        trigger: "POST /delivery-orders/{id}/complete-pumping"
        actor: BargeMaster
        preconditions:
          - "order.logistics_status == PUMPING"
        side_effects:
          - "stores barge_sounding_mt, vessel_sounding_mt, meter_mt"
      - from: FIGURES_RECORDED
        to: AGREED
        trigger: "POST /delivery-orders/{id}/complete-pumping (same request, branch taken when customer.settlement_basis == SUPPLIER_FIGURES)"
        actor: system
        preconditions:
          - "customer.settlement_basis == SUPPLIER_FIGURES"
        side_effects:
          - "sets agreed_quantity_mt via calculations.agreed_quantity_resolution variant supplier_figures"
          - "sets measurement_basis SUPPLIER_FIGURES and shortfall_mt 0.000"
        note: "Branch A of the fork; Branch B leaves the order in FIGURES_RECORDED awaiting a joint survey"
      - from: FIGURES_RECORDED
        to: RESURVEYED
        trigger: "POST /delivery-orders/{id}/joint-survey"
        actor: Surveyor
        preconditions:
          - "order.logistics_status == DELIVERED"
          - "order.measurement_status IN {FIGURES_RECORDED, DISPUTED}"
        side_effects:
          - "stores surveyed_mt"
        note: "Branch B of the fork; mandatory when customer.settlement_basis == JOINT_SURVEY_MANDATORY"
      - from: RESURVEYED
        to: AGREED
        trigger: "POST /delivery-orders/{id}/quantity-decision with decision AGREE"
        actor: Surveyor
        preconditions:
          - "order.measurement_status == RESURVEYED"
          - "order.surveyed_mt is not null"
        side_effects:
          - "sets agreed_quantity_mt via calculations.agreed_quantity_resolution variant joint_survey"
          - "sets measurement_basis JOINT_SURVEY and shortfall_mt = round(barge_sounding_mt - agreed_quantity_mt, 3)"
      - from: AGREED
        to: DISPUTED
        trigger: "POST /delivery-orders/{id}/quantity-decision with decision DISPUTE"
        actor: CustomerRep
        preconditions:
          - "order.measurement_status == AGREED"
          - "no BunkerDeliveryNote with status ISSUED exists for this order, else ERR_BDN_ALREADY_ISSUED"
          - "order.vessel_sounding_mt < order.barge_sounding_mt, else ERR_NO_MEASUREMENT_DISCREPANCY"
        side_effects:
          - "clears agreed_quantity_mt, measurement_basis and shortfall_mt to null"
      - from: DISPUTED
        to: RESURVEYED
        trigger: "POST /delivery-orders/{id}/joint-survey"
        actor: Surveyor
        preconditions:
          - "order.measurement_status == DISPUTED"
        side_effects:
          - "overwrites surveyed_mt with the resurvey figure"
        note: "Closes the cycle AGREED -> DISPUTED -> RESURVEYED -> AGREED"

  - entity: BunkerDeliveryNote
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system cascade from a later POST /bunker-delivery-notes on the same delivery order"
        actor: system
        preconditions:
          - "no QualityClaim references this note"
        side_effects:
          - "the superseded note stops backing claims; only the ISSUED note may be claimed against"

  - entity: QualityClaim
    initial_state: SUBMITTED
    terminal_states: [REMEDIATION_ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_ANALYSIS
        trigger: "POST /lab-analyses"
        actor: LabTechnician
        preconditions:
          - "claim.status == SUBMITTED"
          - "bdn.sample_custody_status == RELEASED_TO_LAB, else ERR_SAMPLE_NOT_RELEASED"
          - "expected_claim_version == claim.version, else ERR_STALE_CLAIM_VERSION"
        side_effects:
          - "sets LabAnalysis.round_index to 1 and QualityClaim.analysis_round to 1"
          - "computes LabAnalysis.verdict and exceedance_pct via calculations.offspec_verdict"
          - "increments QualityClaim.version by 1"
      - from: UNDER_ANALYSIS
        to: UNDER_ANALYSIS
        trigger: "POST /lab-analyses carrying retest_of_analysis_id"
        actor: LabTechnician
        preconditions:
          - "claim.status == UNDER_ANALYSIS"
          - "claim.analysis_round < MAX_ANALYSIS_ROUNDS (2), else ERR_RETEST_LIMIT_REACHED"
          - "retest_of_analysis_id references a LabAnalysis on this claim with round_index 1"
          - "expected_claim_version == claim.version, else ERR_STALE_CLAIM_VERSION"
        side_effects:
          - "sets LabAnalysis.round_index to 2 and QualityClaim.analysis_round to 2"
          - "increments QualityClaim.version by 1"
        note: "Self-loop: the retest round re-enters UNDER_ANALYSIS"
      - from: UNDER_ANALYSIS
        to: REMEDIATION_PROPOSED
        trigger: "POST /quality-claims/{id}/decision with decision PROPOSE"
        actor: Surveyor
        preconditions:
          - "claim.status == UNDER_ANALYSIS"
          - "the LabAnalysis on this claim with the highest round_index has verdict OFF_SPEC, else ERR_NO_OFFSPEC_FINDING"
          - "if remediation_type == DEBUNKER: replacement_price_usd_per_mt is not null, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets remediation_type, credit_usd via calculations.remediation_credit, and proposed_by_user_id"
          - "increments QualityClaim.version by 1"
      - from: UNDER_ANALYSIS
        to: REJECTED
        trigger: "POST /quality-claims/{id}/decision with decision REJECT"
        actor: Surveyor
        preconditions:
          - "claim.status == UNDER_ANALYSIS"
          - "the LabAnalysis with the highest round_index has verdict ON_SPEC"
        side_effects:
          - "leaves credit_usd at 0.00; the invoice is unaffected"
          - "increments QualityClaim.version by 1"
      - from: REMEDIATION_PROPOSED
        to: UNDER_ANALYSIS
        trigger: "POST /quality-claims/{id}/request-retest"
        actor: CustomerRep
        preconditions:
          - "claim.status == REMEDIATION_PROPOSED"
          - "claim.analysis_round < MAX_ANALYSIS_ROUNDS (2), else ERR_RETEST_LIMIT_REACHED"
        side_effects:
          - "clears remediation_type to null and resets credit_usd to 0.00"
          - "clears proposed_by_user_id to null"
          - "increments QualityClaim.version by 1"
        note: "Cycle: UNDER_ANALYSIS -> REMEDIATION_PROPOSED -> UNDER_ANALYSIS negotiation round"
      - from: REMEDIATION_PROPOSED
        to: REMEDIATION_ACCEPTED
        trigger: "POST /quality-claims/{id}/accept-remediation"
        actor: CreditController
        preconditions:
          - "claim.status == REMEDIATION_PROPOSED"
          - "the acting X-User-ID != claim.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the Invoice on this claim's delivery order has status ISSUED, else ERR_INVOICE_NOT_ISSUED"
        side_effects:
          - "sets accepted_by_user_id and books credit_usd"
          - "cascades Invoice.claim_credit_usd += credit_usd, recomputes Invoice.final_amount_usd and moves Invoice.status ISSUED -> CREDIT_APPLIED"
          - "that invoice mutation itself cascades a recompute of Customer.outstanding_balance_usd, which itself cascades a recompute of Customer.credit_status"

  - entity: Invoice
    initial_state: PROVISIONAL
    terminal_states: [VOID]
    transitions:
      - from: PROVISIONAL
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: CreditController
        preconditions:
          - "invoice.status == PROVISIONAL"
          - "order.logistics_status == DELIVERED, else ERR_INVALID_ORDER_STATE"
          - "order.measurement_status == AGREED, else ERR_MEASUREMENT_NOT_AGREED"
          - "a BunkerDeliveryNote with status ISSUED exists for the order, else ERR_BDN_NOT_ISSUED"
        side_effects:
          - "sets issued_at to the logical clock and due_date = issued_at + customer.payment_terms_days days"
          - "recomputes Customer.outstanding_balance_usd, which itself cascades a recompute of Customer.credit_status"
          - "cascades Nomination.fulfillment_status DELIVERED -> CLOSED"
      - from: ISSUED
        to: CREDIT_APPLIED
        trigger: "system cascade from POST /quality-claims/{id}/accept-remediation"
        actor: system
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "sets claim_credit_usd and recomputes final_amount_usd"
          - "recomputes Customer.outstanding_balance_usd and Customer.credit_status"
      - from: PROVISIONAL
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: CreditController
        preconditions:
          - "invoice.status == PROVISIONAL"
        side_effects:
          - "no receivable existed, so Customer.outstanding_balance_usd is unchanged"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: CreditController
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "recomputes Customer.outstanding_balance_usd (removes the receivable) and Customer.credit_status"
          - "cascades Nomination.fulfillment_status CLOSED -> DELIVERED"
        note: "Compensating action for the PROVISIONAL -> ISSUED transition"
      - from: CREDIT_APPLIED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: CreditController
        preconditions:
          - "invoice.status == CREDIT_APPLIED"
        side_effects:
          - "recomputes Customer.outstanding_balance_usd (removes the net receivable) and Customer.credit_status"
          - "cascades Nomination.fulfillment_status CLOSED -> DELIVERED"

  - entity: DeliveryAsset
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system cascade from POST /spill-incidents whose computed severity is MAJOR"
        actor: system
        preconditions:
          - "asset.status == AVAILABLE"
          - "SpillIncident.severity == MAJOR"
        side_effects:
          - "every other DeliveryOrder on this asset with logistics_status IN {SCHEDULED, CLEARED} cascades to CANCELLED"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /delivery-assets/{id}/return-to-service"
        actor: ComplianceOfficer
        preconditions:
          - "asset.status == QUARANTINED, else ERR_INVALID_ASSET_STATE"
          - "no SpillIncident on this asset has status OPEN, else ERR_OPEN_SPILL_INCIDENT"
        side_effects:
          - "the asset re-enters the candidate pool of calculations.auto_schedule_asset_selection with its decayed compliance_score"

  - entity: SpillIncident
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /spill-incidents/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == OPEN"
          - "incident.containment_confirmed == true, else ERR_CONTAINMENT_NOT_CONFIRMED"
          - "incident.response_ref is not null, else ERR_CONTAINMENT_NOT_CONFIRMED"
        side_effects:
          - "sets closed_at to the logical clock"
          - "unblocks POST /delivery-assets/{id}/return-to-service for the asset"

concurrency_rules:
  - rule_id: order-create-stale-nomination
    parent_entity: Nomination
    write_endpoint: "POST /delivery-orders"
    occ_field: "expected_nomination_version"
    description: |
      Creating a DeliveryOrder against a Nomination whose version has advanced
      since the client last observed it is rejected. A new order legitimately
      supersedes the nomination's existing SCHEDULED or CLEARED order (the
      supersede side-effect cancels it), so the second create would otherwise
      succeed on identical state and silently discard a slot the requester never
      saw; the stale expected_nomination_version turns that into a deterministic
      412 instead.
    error_id: ERR_STALE_NOMINATION_VERSION
    http_status: 412

  - rule_id: retest-stale-claim
    parent_entity: QualityClaim
    write_endpoint: "POST /lab-analyses"
    occ_field: "expected_claim_version"
    description: |
      Filing a LabAnalysis against a QualityClaim whose version has advanced
      since the client last observed it is rejected. A retest round legitimately
      supersedes the previous round's verdict as the basis for the remediation
      decision, so a second filing carrying a stale expected_claim_version would
      otherwise overwrite the governing verdict the requester never read; the OCC
      guard rejects it with 412.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

calculations:
  - name: agreed_quantity_resolution
    trigger: "On POST /delivery-orders/{id}/complete-pumping (SUPPLIER_FIGURES branch) and on POST /delivery-orders/{id}/quantity-decision with decision AGREE (JOINT_SURVEY branch); writes DeliveryOrder.agreed_quantity_mt, measurement_basis and shortfall_mt"
    algorithm: reconciliation
    formula: |
      # variant selection is driven by Customer.settlement_basis and by which
      # measurement transition fired; it is never a free choice.
      if variant == supplier_figures:
          agreed_quantity_mt = round(order.barge_sounding_mt, 3)
          measurement_basis  = SUPPLIER_FIGURES
      else:  # variant == joint_survey
          agreed_quantity_mt = round(order.surveyed_mt, 3)
          measurement_basis  = JOINT_SURVEY
      shortfall_mt = round(order.barge_sounding_mt - agreed_quantity_mt, 3)
      # meter_mt never governs; it only feeds the
      # ERR_MEASUREMENT_FIGURES_INCONSISTENT cross-check at complete-pumping.
      # vessel_sounding_mt never governs; it only gates the DISPUTE right.
    input_set: "Exactly one DeliveryOrder row, the one addressed by the endpoint; no aggregation over siblings"
    constants:
      MEASUREMENT_TOLERANCE_MT: 1.000
    precision: "3 decimal places, round_half_up"
    variants:
      - name: supplier_figures
        when: "Customer.settlement_basis == SUPPLIER_FIGURES and the figures were recorded by complete-pumping (measurement_status FIGURES_RECORDED -> AGREED in the same request)"
        difference: "The supplier's own barge tank sounding governs, so shortfall_mt is always 0.000 and the customer is billed the full pumped figure"
      - name: joint_survey
        when: "Customer.settlement_basis == JOINT_SURVEY_MANDATORY, or the order passed through DISPUTED and reached RESURVEYED before AGREE"
        difference: "The independent surveyor figure governs, so agreed_quantity_mt is normally lower than barge_sounding_mt and shortfall_mt is the positive difference the supplier absorbs"

  - name: customer_credit_exposure
    trigger: "Recomputed on POST /invoices/{id}/issue, POST /invoices/{id}/void, the accept-remediation credit cascade, and on every read of GET /customers/{id}/credit-exposure; writes Customer.outstanding_balance_usd and Customer.credit_status"
    algorithm: forward_looking
    formula: |
      settled_receivables = round(
          sum(inv.final_amount_usd for inv in Invoice
              where inv.customer_id == customer.id
                and inv.status IN {ISSUED, CREDIT_APPLIED}), 2)

      # open commitments: confirmed-or-later stems not yet billed by a
      # non-void invoice, valued at the grade's governing index price.
      open_commitments = round(
          sum(nom.nominated_quantity_mt * index_price(nom.grade_id, clock)
              for nom in Nomination
              where nom.customer_id == customer.id
                and nom.fulfillment_status IN {CONFIRMED, SCHEDULED, AWAITING_SCHEDULE, DELIVERED}
                and no Invoice on nom's DeliveryOrder rows has status IN {ISSUED, CREDIT_APPLIED}), 2)

      conservative_exposure = round(settled_receivables + open_commitments, 2)
      available_credit      = round(customer.credit_limit_usd - conservative_exposure, 2)

      utilisation = round(settled_receivables / customer.credit_limit_usd, 4)
      credit_status = HOLD  if utilisation >= 1.0000
                 else WATCH if utilisation >= 0.8000
                 else OK
      outstanding_balance_usd = settled_receivables

      # index_price(grade_id, clock): the IndexQuote for grade_id with the
      # greatest quote_date <= clock; ties on quote_date break by created_at
      # DESC (most recently posted quote wins). Empty result ->
      # ERR_INDEX_QUOTE_UNAVAILABLE.
    input_set: "Invoice rows with status IN {ISSUED, CREDIT_APPLIED} (PROVISIONAL and VOID excluded); Nomination rows with fulfillment_status IN {CONFIRMED, SCHEDULED, AWAITING_SCHEDULE, DELIVERED} that have no ISSUED/CREDIT_APPLIED invoice (DRAFT and CLOSED excluded)"
    constants:
      WATCH_UTILISATION: 0.8000
      HOLD_UTILISATION: 1.0000
    precision: "2 decimal places for money, 4 decimal places for utilisation, round_half_up"
    variants:
      - name: settled_receivables
        when: "Setting Customer.outstanding_balance_usd and Customer.credit_status (the backward-looking books view)"
        difference: "Counts only invoiced money, so a customer with large unbilled stems still reads credit_status OK"
      - name: conservative_commitments
        when: "Gating POST /nominations/{id}/confirm and POST /delivery-orders/{id}/clear via calculations.credit_availability_check, and reported as conservative_exposure_usd by GET /customers/{id}/credit-exposure"
        difference: "Adds the index-valued open commitments on top of settled receivables, so the same customer data yields a strictly larger exposure than the settled variant whenever an unbilled confirmed stem exists"

  - name: invoice_amount
    trigger: "On POST /invoices; writes index_price_usd_per_mt, quantity_basis_mt, fuel_cost_usd, baf_usd, barging_fee_usd, eca_surcharge_usd, provisional_amount_usd and final_amount_usd"
    algorithm: tiered_pricing
    formula: |
      quantity_basis_mt       = order.agreed_quantity_mt              # snapshot
      index_price_usd_per_mt  = index_price(nomination.grade_id, invoice.pricing_date)
      baf_pct                 = calculations.bunker_adjustment_factor

      # PINNED ROUNDING ORDER: each component is rounded to 2dp FIRST, then the
      # four rounded components are summed. Summing the unrounded components and
      # rounding once at the end is FORBIDDEN and yields a different cent.
      fuel_cost_usd     = round(quantity_basis_mt * index_price_usd_per_mt, 2)
      baf_usd           = round(fuel_cost_usd * baf_pct, 2)          # BAF applies to the ROUNDED fuel cost
      barging_fee_usd   = max(round(quantity_basis_mt * grade.base_barging_rate_usd_per_mt, 2),
                              grade.min_barging_fee_usd)
      eca_surcharge_usd = round(quantity_basis_mt * ECA_SURCHARGE_USD_PER_MT, 2) if port.eca_zone else 0.00

      provisional_amount_usd = fuel_cost_usd + baf_usd + barging_fee_usd + eca_surcharge_usd
      claim_credit_usd       = round(sum(c.credit_usd for c in QualityClaim
                                         where c.bdn_id in this order's notes
                                           and c.status == REMEDIATION_ACCEPTED), 2)
      final_amount_usd       = round(provisional_amount_usd - claim_credit_usd, 2)
    input_set: "The single DeliveryOrder addressed by delivery_order_id, its Nomination, that nomination's Port and FuelGrade, and the QualityClaim rows with status REMEDIATION_ACCEPTED on that order's notes"
    constants:
      ECA_SURCHARGE_USD_PER_MT: 4.25
    precision: "2 decimal places per component, round_half_up; the sum of already-rounded components is not re-rounded"

  - name: bunker_adjustment_factor
    trigger: "On POST /invoices, as the baf_pct input of calculations.invoice_amount"
    algorithm: threshold
    formula: |
      latest = index_price(grade_id, invoice.pricing_date)            # the pricing quote
      prior  = the IndexQuote for grade_id with the greatest quote_date
               strictly less than latest.quote_date (ties: created_at DESC)
      volatility = abs(latest.price_usd_per_mt - prior.price_usd_per_mt)
                   / prior.price_usd_per_mt          if prior exists else 0

      volatility_step = VOL_STEP_LOW   if volatility <  VOL_MID_THRESHOLD
                   else VOL_STEP_MID   if volatility <  VOL_HIGH_THRESHOLD
                   else VOL_STEP_HIGH

      mode_premium  = MODE_PREMIUM_TRUCK if nomination.delivery_mode == TRUCK
                                         else MODE_PREMIUM_BARGE
      eca_premium   = ECA_PREMIUM   if port.eca_zone else 0
      tier_discount = TIER_DISCOUNT if invoice.quantity_basis_mt >= TIER_QTY_THRESHOLD else 0

      raw     = BASE_BAF + volatility_step + mode_premium + eca_premium - tier_discount
      baf_pct = round(min(BAF_CEILING, max(BAF_FLOOR, raw)), 4)
    input_set: "The two most recent IndexQuote rows for the nomination's grade at or before invoice.pricing_date; the nomination's delivery_mode; the port's eca_zone; the invoice's quantity_basis_mt"
    constants:
      BASE_BAF: 0.020
      VOL_MID_THRESHOLD: 0.05
      VOL_HIGH_THRESHOLD: 0.10
      VOL_STEP_LOW: 0.000
      VOL_STEP_MID: 0.010
      VOL_STEP_HIGH: 0.020
      MODE_PREMIUM_BARGE: 0.005
      MODE_PREMIUM_TRUCK: 0.015
      ECA_PREMIUM: 0.010
      TIER_DISCOUNT: 0.010
      TIER_QTY_THRESHOLD: 1000.000
      BAF_FLOOR: 0.010
      BAF_CEILING: 0.045
    precision: "4 decimal places, round_half_up; the clamp is applied before rounding"

  - name: credit_availability_check
    trigger: "On POST /nominations/{id}/confirm and on POST /delivery-orders/{id}/clear"
    algorithm: threshold
    formula: |
      prospective_commitment = round(nomination.nominated_quantity_mt
                                     * index_price(nomination.grade_id, clock), 2)
      # on /confirm the stem is still DRAFT, so it is added prospectively;
      # on /clear it is already inside conservative_exposure and is NOT added twice.
      prospective_exposure = round(
          conservative_exposure
          + (prospective_commitment if nomination.fulfillment_status == DRAFT else 0.00), 2)

      pass  if prospective_exposure <= customer.credit_limit_usd
      fail  if prospective_exposure >  customer.credit_limit_usd   -> ERR_CREDIT_LIMIT_EXCEEDED
    input_set: "conservative_exposure from calculations.customer_credit_exposure variant conservative_commitments, plus the addressed nomination"
    constants:
      COMPARISON: "strictly greater-than fails; exactly equal to credit_limit_usd passes"
    precision: "2 decimal places, round_half_up"

  - name: offspec_verdict
    trigger: "On POST /lab-analyses; writes LabAnalysis.verdict and LabAnalysis.exceedance_pct"
    algorithm: threshold
    formula: |
      regulatory_limit = port.eca_sulfur_limit_pct
                         if (port.eca_zone AND nomination.scrubber_fitted == false)
                         else grade.max_sulfur_pct
      effective_limit  = min(regulatory_limit, grade.max_sulfur_pct)
      trip_point       = effective_limit + grade.test_tolerance_pct

      verdict       = OFF_SPEC if measured_sulfur_pct >  trip_point else ON_SPEC
      exceedance_pct = max(0.000, round(measured_sulfur_pct - trip_point, 3))
    input_set: "The single LabAnalysis being filed, its QualityClaim, that claim's BunkerDeliveryNote, DeliveryOrder, Nomination, Port and FuelGrade"
    constants:
      COMPARISON: "strictly greater-than is off-spec; measured exactly equal to trip_point is ON_SPEC with exceedance_pct 0.000"
    precision: "3 decimal places, round_half_up"

  - name: remediation_credit
    trigger: "On POST /quality-claims/{id}/decision with decision PROPOSE; writes QualityClaim.credit_usd"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The cap in step 7 is derived from the
      # invoice total, which itself was derived from the quantity basis the
      # claim snapshotted in step 1 - so the steps MUST run in this order and
      # no step may re-read a later step's output.
      1. basis_qty   = claim.quantity_basis_mt          # snapshot taken at submission, never re-read from the note
      2. affected    = claim.affected_quantity_mt       # already validated <= basis_qty
      3. index_price = invoice.index_price_usd_per_mt   # the non-void Invoice on the claim's delivery order
      4. rate        = round(index_price * OFFSPEC_ALLOWANCE_PCT, 2)                       if remediation_type == PRICE_ALLOWANCE
                       max(DEBUNKER_HANDLING_USD_PER_MT,
                           round((claim.replacement_price_usd_per_mt - index_price)
                                 + DEBUNKER_HANDLING_USD_PER_MT, 2))                      if remediation_type == DEBUNKER
      5. raw_credit  = round(affected * rate, 2)
      6. if governing_analysis.exceedance_pct > SEVERE_EXCEEDANCE_PCT:
             raw_credit = round(raw_credit * SEVERE_EXCEEDANCE_MULTIPLIER, 2)
         # governing_analysis = the LabAnalysis on this claim with the highest round_index
      7. cap         = round(invoice.provisional_amount_usd * CREDIT_CAP_PCT, 2)
      8. credit_usd  = min(raw_credit, cap)
    input_set: "The addressed QualityClaim, its governing LabAnalysis (highest round_index), and the Invoice on its DeliveryOrder with status IN {PROVISIONAL, ISSUED, CREDIT_APPLIED}"
    constants:
      OFFSPEC_ALLOWANCE_PCT: 0.15
      DEBUNKER_HANDLING_USD_PER_MT: 12.00
      SEVERE_EXCEEDANCE_PCT: 0.050
      SEVERE_EXCEEDANCE_MULTIPLIER: 1.25
      CREDIT_CAP_PCT: 0.60
    precision: "2 decimal places, round_half_up at every numbered step"

  - name: asset_compliance_score
    trigger: "Recomputed on POST /spill-incidents, on POST /delivery-orders/{id}/complete-pumping, and on POST /delivery-assets/{id}/return-to-service; writes DeliveryAsset.compliance_score"
    algorithm: decay_function
    formula: |
      penalty = 0.00
      for incident in SpillIncident where incident.asset_id == asset.id
                                        ordered by reported_at ASC, then created_at ASC:
          age_days = floor((clock - incident.reported_at) / 24h)
          decay = DECAY_FRESH  if age_days <= FRESH_DAYS            # <= 30
             else DECAY_RECENT if age_days <= RECENT_DAYS           # 31..90
             else DECAY_STALE  if age_days <= STALE_DAYS            # 91..180
             else 0.00                                             # > 180 excluded
          penalty = penalty + round(incident.penalty_points * decay, 2)

      clean_count = count(order for order in DeliveryOrder
                          where order.asset_id == asset.id
                            and order.logistics_status == DELIVERED
                            and no SpillIncident references that order)
      bonus = min(CLEAN_BONUS_CAP, round(clean_count * CLEAN_DELIVERY_BONUS, 2))

      compliance_score = min(100.00, max(0.00, round(100.00 - penalty + bonus, 2)))
    input_set: "All SpillIncident rows on the asset regardless of status (OPEN and CLOSED both count), and all DeliveryOrder rows on the asset with logistics_status DELIVERED"
    constants:
      MAJOR_PENALTY: 45.00
      MINOR_PENALTY: 15.00
      FRESH_DAYS: 30
      RECENT_DAYS: 90
      STALE_DAYS: 180
      DECAY_FRESH: 1.00
      DECAY_RECENT: 0.50
      DECAY_STALE: 0.25
      CLEAN_DELIVERY_BONUS: 1.00
      CLEAN_BONUS_CAP: 10.00
    precision: "2 decimal places, round_half_up per incident term and once on the final score"

  - name: auto_schedule_asset_selection
    trigger: "On POST /nominations/{id}/auto-schedule; picks the DeliveryAsset and derives the DeliveryOrder slot"
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter - every predicate must hold
      candidates = [a for a in DeliveryAsset where
          a.home_port_id == nomination.port_id
          AND a.asset_type == nomination.delivery_mode
          AND a.status == AVAILABLE
          AND a.capacity_mt >= nomination.nominated_quantity_mt
          AND a.boom_certified == true
          AND (a.last_grade_id is null
               OR grade_of(a.last_grade_id).cross_contamination_group
                  == grade_of(nomination.grade_id).cross_contamination_group
               OR a.segregated_tanks == true)
          AND count(SpillIncident where asset_id == a.id AND status == OPEN) == 0
          AND the derived slot violates neither the asset-level buffer rule
              (validations priority 47) nor the port-level aggregate rule
              (validations priority 48)]

      # (b) ranking, (c) tie-break
      order candidates by compliance_score DESC,
                         (capacity_mt - nomination.nominated_quantity_mt) ASC,   # tightest fit
                         created_at ASC                                          # final tie-break
      chosen = first candidate

      # (d) empty-pool fallback
      if candidates is empty: ERR_NO_ELIGIBLE_ASSET (409)

      # derived slot
      slot_start   = requested_slot_start
      pump_minutes = ceil(nomination.nominated_quantity_mt / PUMP_RATE_MT_PER_HOUR * 60)
      slot_end     = slot_start + pump_minutes minutes + FIXED_HOSE_MINUTES minutes
      planned_quantity_mt = nomination.nominated_quantity_mt
    input_set: "All DeliveryAsset rows surviving the eligibility filter above; assets at other ports, of the wrong type, QUARANTINED, or too small are excluded"
    constants:
      PUMP_RATE_MT_PER_HOUR: 250
      FIXED_HOSE_MINUTES: 60
    precision: "Integer minutes, ceiling on pump_minutes; 3 decimal places on planned_quantity_mt"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the §1.7 role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every port_id in the path or body resolves to a Port"
    error_id: ERR_PORT_NOT_FOUND
    http_status: 404
    applies_to: "GET /ports/{id}, POST /nominations, POST /delivery-assets"
  - priority: 4
    category: existence
    check: "Every grade_id in the path or body resolves to a FuelGrade"
    error_id: ERR_FUEL_GRADE_NOT_FOUND
    http_status: 404
    applies_to: "GET /fuel-grades/{id}, GET /fuel-grades/{id}/index-quotes, POST /index-quotes, POST /nominations"
  - priority: 5
    category: existence
    check: "Every customer_id in the path or body resolves to a Customer"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "GET /customers/{id}, GET /customers/{id}/credit-exposure, POST /customers/{id}/credit-review, POST /nominations"
  - priority: 6
    category: existence
    check: "Every asset_id in the path or body resolves to a DeliveryAsset"
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "GET /delivery-assets/{id}, POST /delivery-assets/{id}/return-to-service, POST /delivery-orders"
  - priority: 7
    category: existence
    check: "Every nomination_id in the path or body resolves to a Nomination"
    error_id: ERR_NOMINATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /nominations/{id}, POST /nominations/{id}/compliance-review, POST /nominations/{id}/confirm, POST /nominations/{id}/auto-schedule, POST /delivery-orders"
  - priority: 8
    category: existence
    check: "Every delivery_order_id in the path or body resolves to a DeliveryOrder"
    error_id: ERR_DELIVERY_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /delivery-orders/{id}, all POST /delivery-orders/{id}/* actions, POST /bunker-delivery-notes, POST /invoices, POST /spill-incidents"
  - priority: 9
    category: existence
    check: "Every bdn_id in the path or body resolves to a BunkerDeliveryNote"
    error_id: ERR_BDN_NOT_FOUND
    http_status: 404
    applies_to: "GET /bunker-delivery-notes/{id}, POST /bunker-delivery-notes/{id}/release-sample, POST /quality-claims"
  - priority: 10
    category: existence
    check: "Every claim_id in the path or body resolves to a QualityClaim"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /quality-claims/{id}, POST /quality-claims/{id}/decision, POST /quality-claims/{id}/request-retest, POST /quality-claims/{id}/accept-remediation, POST /lab-analyses"
  - priority: 11
    category: existence
    check: "A non-null retest_of_analysis_id resolves to a LabAnalysis"
    error_id: ERR_LAB_ANALYSIS_NOT_FOUND
    http_status: 404
    applies_to: "GET /lab-analyses/{id}, POST /lab-analyses"
  - priority: 12
    category: existence
    check: "Every invoice id in the path resolves to an Invoice"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /invoices/{id}, POST /invoices/{id}/issue, POST /invoices/{id}/void"
  - priority: 13
    category: existence
    check: "Every spill incident id in the path resolves to a SpillIncident"
    error_id: ERR_SPILL_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /spill-incidents/{id}, POST /spill-incidents/{id}/close"
  - priority: 14
    category: auth
    check: "When the acting role is CustomerRep, X-User-ID equals the Customer.id that owns the addressed nomination, order, note, claim or invoice"
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /quality-claims, POST /quality-claims/{id}/request-retest, POST /delivery-orders/{id}/quantity-decision, GET /customers/{id}/credit-exposure, GET /nominations, GET /quality-claims"
  - priority: 15
    category: auth
    check: "When the acting role is BargeMaster, X-User-ID equals the addressed DeliveryOrder's asset_id"
    error_id: ERR_ASSET_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /delivery-orders/{id}/start-pumping, POST /delivery-orders/{id}/complete-pumping, POST /spill-incidents"
  - priority: 16
    category: business_constraint
    check: "Request body contains every required field with the declared type, enum members are valid, decimal quantities respect their declared scale, numeric quantities are > 0 where declared, limit is 1-100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"
  - priority: 17
    category: state
    check: "expected_nomination_version equals Nomination.version"
    error_id: ERR_STALE_NOMINATION_VERSION
    http_status: 412
    applies_to: "POST /delivery-orders, POST /nominations/{id}/auto-schedule"
  - priority: 18
    category: state
    check: "expected_claim_version equals QualityClaim.version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /lab-analyses"
  - priority: 19
    category: state
    check: "Nomination.fulfillment_status / compliance_status is a legal from-state for the requested transition"
    error_id: ERR_INVALID_NOMINATION_STATE
    http_status: 409
    applies_to: "POST /nominations/{id}/compliance-review, POST /nominations/{id}/confirm, POST /nominations/{id}/auto-schedule, POST /delivery-orders"
  - priority: 20
    category: state
    check: "Nomination.compliance_status == APPROVED"
    error_id: ERR_COMPLIANCE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /nominations/{id}/confirm, POST /delivery-orders/{id}/clear"
  - priority: 21
    category: state
    check: "DeliveryOrder.logistics_status is a legal from-state for the requested transition"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /delivery-orders/{id}/clear, /start-pumping, /complete-pumping, /joint-survey, /cancel, POST /bunker-delivery-notes, POST /invoices, POST /spill-incidents"
  - priority: 22
    category: state
    check: "DeliveryOrder.measurement_status == AGREED and agreed_quantity_mt is not null"
    error_id: ERR_MEASUREMENT_NOT_AGREED
    http_status: 409
    applies_to: "POST /bunker-delivery-notes, POST /invoices, POST /invoices/{id}/issue"
  - priority: 23
    category: state
    check: "DeliveryOrder.measurement_status is a legal from-state for the requested measurement transition"
    error_id: ERR_INVALID_MEASUREMENT_STATE
    http_status: 409
    applies_to: "POST /delivery-orders/{id}/joint-survey, POST /delivery-orders/{id}/quantity-decision"
  - priority: 24
    category: state
    check: "No BunkerDeliveryNote with status ISSUED exists for the delivery order"
    error_id: ERR_BDN_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /delivery-orders/{id}/quantity-decision with decision DISPUTE"
  - priority: 25
    category: state
    check: "A BunkerDeliveryNote with status ISSUED exists for the delivery order"
    error_id: ERR_BDN_NOT_ISSUED
    http_status: 409
    applies_to: "POST /invoices/{id}/issue"
  - priority: 26
    category: state
    check: "No Invoice with status IN {PROVISIONAL, ISSUED, CREDIT_APPLIED} already exists for the delivery order"
    error_id: ERR_INVOICE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /invoices"
  - priority: 27
    category: state
    check: "Invoice.status is a legal from-state for the requested transition"
    error_id: ERR_INVALID_INVOICE_STATE
    http_status: 409
    applies_to: "POST /invoices/{id}/issue, POST /invoices/{id}/void"
  - priority: 28
    category: state
    check: "A non-void Invoice exists on the claim's delivery order, and for accept-remediation its status is ISSUED"
    error_id: ERR_INVOICE_NOT_ISSUED
    http_status: 409
    applies_to: "POST /quality-claims/{id}/decision, POST /quality-claims/{id}/accept-remediation"
  - priority: 29
    category: state
    check: "QualityClaim.status is a legal from-state for the requested transition"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /lab-analyses, POST /quality-claims/{id}/decision, POST /quality-claims/{id}/request-retest, POST /quality-claims/{id}/accept-remediation"
  - priority: 30
    category: state
    check: "The claim's BunkerDeliveryNote has sample_custody_status == RELEASED_TO_LAB"
    error_id: ERR_SAMPLE_NOT_RELEASED
    http_status: 409
    applies_to: "POST /lab-analyses"
  - priority: 31
    category: state
    check: "QualityClaim.analysis_round < MAX_ANALYSIS_ROUNDS (2)"
    error_id: ERR_RETEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /lab-analyses, POST /quality-claims/{id}/request-retest"
  - priority: 32
    category: state
    check: "For decision PROPOSE the governing LabAnalysis (highest round_index) has verdict OFF_SPEC; for decision REJECT it has verdict ON_SPEC"
    error_id: ERR_NO_OFFSPEC_FINDING
    http_status: 409
    applies_to: "POST /quality-claims/{id}/decision"
  - priority: 33
    category: state
    check: "For decision DISPUTE, DeliveryOrder.vessel_sounding_mt < DeliveryOrder.barge_sounding_mt"
    error_id: ERR_NO_MEASUREMENT_DISCREPANCY
    http_status: 409
    applies_to: "POST /delivery-orders/{id}/quantity-decision"
  - priority: 34
    category: state
    check: "The delivery order's DeliveryAsset has status AVAILABLE"
    error_id: ERR_ASSET_QUARANTINED
    http_status: 409
    applies_to: "POST /delivery-orders, POST /nominations/{id}/auto-schedule, POST /delivery-orders/{id}/clear, POST /delivery-orders/{id}/start-pumping"
  - priority: 35
    category: state
    check: "DeliveryAsset.status == QUARANTINED"
    error_id: ERR_INVALID_ASSET_STATE
    http_status: 409
    applies_to: "POST /delivery-assets/{id}/return-to-service"
  - priority: 36
    category: state
    check: "No SpillIncident on the asset has status OPEN"
    error_id: ERR_OPEN_SPILL_INCIDENT
    http_status: 409
    applies_to: "POST /delivery-orders/{id}/clear, POST /delivery-assets/{id}/return-to-service"
  - priority: 37
    category: state
    check: "SpillIncident.status == OPEN"
    error_id: ERR_INVALID_SPILL_STATE
    http_status: 409
    applies_to: "POST /spill-incidents/{id}/close"
  - priority: 38
    category: auth
    check: "Segregation of duties: the BDN issuer's X-User-ID differs from the nomination's compliance_reviewer_user_id, and the accept-remediation actor's X-User-ID differs from QualityClaim.proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bunker-delivery-notes, POST /quality-claims/{id}/accept-remediation"
  - priority: 39
    category: business_safety
    check: "For an ECA port with a non-scrubber vessel: FuelGrade.eca_permitted is true and FuelGrade.max_sulfur_pct <= Port.eca_sulfur_limit_pct; and Nomination.declared_sulfur_pct <= FuelGrade.max_sulfur_pct in all cases"
    error_id: ERR_ECA_SULFUR_VIOLATION
    http_status: 422
    applies_to: "POST /nominations/{id}/compliance-review"
  - priority: 40
    category: business_safety
    check: "For an ECA port with a non-scrubber vessel, Nomination.eca_documentation_ref is not null"
    error_id: ERR_ECA_DOCUMENTATION_MISSING
    http_status: 422
    applies_to: "POST /nominations/{id}/compliance-review"
  - priority: 41
    category: business_safety
    check: "DeliveryAsset.boom_certified == true"
    error_id: ERR_BOOM_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /delivery-orders/{id}/start-pumping"
  - priority: 42
    category: business_safety
    check: "DeliveryAsset.last_grade_id is null, or shares the nominated grade's cross_contamination_group, or the asset has segregated_tanks"
    error_id: ERR_GRADE_INCOMPATIBLE_ASSET
    http_status: 422
    applies_to: "POST /delivery-orders, POST /delivery-orders/{id}/start-pumping"
  - priority: 43
    category: business_safety
    check: "SpillIncident.containment_confirmed == true and SpillIncident.response_ref is not null"
    error_id: ERR_CONTAINMENT_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /spill-incidents/{id}/close"
  - priority: 44
    category: business_referential
    check: "DeliveryAsset.home_port_id equals Nomination.port_id and DeliveryAsset.asset_type equals Nomination.delivery_mode"
    error_id: ERR_ASSET_NOT_SUITABLE
    http_status: 422
    applies_to: "POST /delivery-orders"
  - priority: 45
    category: business_temporal
    check: "Nomination.window_end >= Nomination.window_start + MIN_WINDOW_HOURS (6 hours)"
    error_id: ERR_WINDOW_TOO_SHORT
    http_status: 422
    applies_to: "POST /nominations"
  - priority: 46
    category: business_temporal
    check: "slot_start >= Nomination.window_start and slot_end <= Nomination.window_end; on start-pumping the logical clock is >= slot_start"
    error_id: ERR_SLOT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /delivery-orders, POST /nominations/{id}/auto-schedule, POST /delivery-orders/{id}/start-pumping"
  - priority: 47
    category: business_temporal
    check: "Asset-level closed-interval rule with buffer: for every other DeliveryOrder on the same asset with logistics_status IN {SCHEDULED, CLEARED, PUMPING}, the new [slot_start, slot_end] must not intersect the existing [slot_start, slot_end] AND the gap between the two intervals must be strictly greater than DeliveryAsset.turnaround_buffer_minutes (a gap exactly equal to the buffer is rejected)"
    error_id: ERR_ASSET_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-orders, POST /nominations/{id}/auto-schedule"
  - priority: 48
    category: business_temporal
    check: "Port-level aggregate half-open rule: counting DeliveryOrder rows at the same Port with logistics_status IN {SCHEDULED, CLEARED, PUMPING} whose [slot_start, slot_end) intersects the new [slot_start, slot_end), the new order is rejected when that count is already >= Port.concurrent_ops_capacity; back-to-back slots that only touch at an endpoint do not intersect and are always allowed"
    error_id: ERR_PORT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-orders, POST /nominations/{id}/auto-schedule"
  - priority: 49
    category: business_temporal
    check: "slot_start >= max(logical clock, Nomination.confirmed observation) + Port.notice_lead_hours"
    error_id: ERR_NOTICE_PERIOD_MISSED
    http_status: 422
    applies_to: "POST /delivery-orders, POST /nominations/{id}/auto-schedule"
  - priority: 50
    category: business_temporal
    check: "The logical clock is <= BunkerDeliveryNote.created_at + CLAIM_WINDOW_DAYS (30 days)"
    error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /quality-claims"
  - priority: 51
    category: business_temporal
    check: "The logical clock is <= BunkerDeliveryNote.sample_retention_until, i.e. sample_custody_status is not EXPIRED"
    error_id: ERR_SAMPLE_RETENTION_EXPIRED
    http_status: 422
    applies_to: "POST /bunker-delivery-notes/{id}/release-sample"
  - priority: 52
    category: business_constraint
    check: "planned_quantity_mt <= DeliveryAsset.capacity_mt, and barge_sounding_mt <= DeliveryAsset.capacity_mt at complete-pumping"
    error_id: ERR_ASSET_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /delivery-orders, POST /delivery-orders/{id}/complete-pumping"
  - priority: 53
    category: business_constraint
    check: "QualityClaim.affected_quantity_mt <= BunkerDeliveryNote.delivered_quantity_mt"
    error_id: ERR_AFFECTED_QUANTITY_EXCEEDS_BASIS
    http_status: 422
    applies_to: "POST /quality-claims"
  - priority: 54
    category: business_constraint
    check: "abs(barge_sounding_mt - meter_mt) <= MEASUREMENT_TOLERANCE_MT (1.000)"
    error_id: ERR_MEASUREMENT_FIGURES_INCONSISTENT
    http_status: 422
    applies_to: "POST /delivery-orders/{id}/complete-pumping"
  - priority: 55
    category: business_constraint
    check: "Port.port_code and FuelGrade.grade_code are unique across their entity"
    error_id: ERR_DUPLICATE_REFERENCE_CODE
    http_status: 409
    applies_to: "POST /ports, POST /fuel-grades"
  - priority: 56
    category: business_constraint
    check: "BunkerDeliveryNote.bdn_number is unique across BunkerDeliveryNote"
    error_id: ERR_DUPLICATE_BDN_NUMBER
    http_status: 409
    applies_to: "POST /bunker-delivery-notes"
  - priority: 57
    category: business_constraint
    check: "BunkerDeliveryNote.sample_seal_number is unique across BunkerDeliveryNote"
    error_id: ERR_DUPLICATE_SAMPLE_SEAL
    http_status: 409
    applies_to: "POST /bunker-delivery-notes"
  - priority: 58
    category: business_constraint
    check: "The candidate pool of calculations.auto_schedule_asset_selection is non-empty"
    error_id: ERR_NO_ELIGIBLE_ASSET
    http_status: 409
    applies_to: "POST /nominations/{id}/auto-schedule"
  - priority: 59
    category: business_constraint
    check: "An IndexQuote exists for the grade with quote_date <= the requested pricing date or logical clock"
    error_id: ERR_INDEX_QUOTE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /invoices, POST /nominations/{id}/confirm, GET /customers/{id}/credit-exposure"
  - priority: 60
    category: business_fiscal
    check: "Customer.credit_status != HOLD"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /nominations/{id}/confirm, POST /delivery-orders/{id}/clear"
  - priority: 61
    category: business_fiscal
    check: "calculations.credit_availability_check passes (prospective_exposure <= Customer.credit_limit_usd)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /nominations/{id}/confirm"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical UTC clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [OpsCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent sample_custody_status, claim-window, notice-period and compliance-score decay evaluations use the new instant"]

  - method: POST
    path: "/ports"
    description: "Register a bunkering port with its ECA profile, notice period and concurrent-operations capacity"
    roles: [OpsCoordinator]
    code: 201
    input: [port_code, name, "eca_zone?", "eca_sulfur_limit_pct?", "notice_lead_hours?", "concurrent_ops_capacity?", "spill_response_tier?"]
    output: Port
    side_effects: ["none"]
  - method: GET
    path: "/ports/{id}"
    description: "Read one port"
    roles: [OpsCoordinator, ComplianceOfficer, CreditController, Surveyor]
    code: 200
    input: []
    output: Port
    side_effects: ["none"]
  - method: GET
    path: "/ports"
    description: "List ports"
    roles: [OpsCoordinator, ComplianceOfficer, CreditController, Surveyor]
    code: 200
    input: ["limit?", "offset?"]
    output: Port[]
    side_effects: ["none"]

  - method: POST
    path: "/fuel-grades"
    description: "Register a fuel grade with its sulfur ceiling, test tolerance, barging rate and cross-contamination family"
    roles: [OpsCoordinator]
    code: 201
    input: [grade_code, max_sulfur_pct, "eca_permitted?", "test_tolerance_pct?", index_code, base_barging_rate_usd_per_mt, min_barging_fee_usd, cross_contamination_group]
    output: FuelGrade
    side_effects: ["none"]
  - method: GET
    path: "/fuel-grades/{id}"
    description: "Read one fuel grade"
    roles: [OpsCoordinator, ComplianceOfficer, CreditController, Surveyor]
    code: 200
    input: []
    output: FuelGrade
    side_effects: ["none"]
  - method: GET
    path: "/fuel-grades/{id}/index-quotes"
    description: "List the index quotes posted for one grade, most recent quote_date first"
    roles: [OpsCoordinator, CreditController]
    code: 200
    input: ["limit?", "offset?"]
    output: IndexQuote[]
    side_effects: ["none"]
  - method: POST
    path: "/index-quotes"
    description: "Post an immutable index quote for a grade"
    roles: [OpsCoordinator, CreditController]
    code: 201
    input: [grade_id, quote_date, price_usd_per_mt, "source?"]
    output: IndexQuote
    side_effects: ["becomes the pricing quote for invoices whose pricing_date is on or after quote_date, and the volatility baseline for calculations.bunker_adjustment_factor"]

  - method: POST
    path: "/customers"
    description: "Onboard a bunker buyer with credit limit, payment terms and contractual settlement basis"
    roles: [CreditController]
    code: 201
    input: [name, credit_limit_usd, "payment_terms_days?", "settlement_basis?"]
    output: Customer
    side_effects: ["credit_status initialised to OK, outstanding_balance_usd to 0.00"]
  - method: GET
    path: "/customers/{id}"
    description: "Read one customer including its computed exposure fields"
    roles: [CreditController, OpsCoordinator]
    code: 200
    input: []
    output: Customer
    side_effects: ["none"]
  - method: GET
    path: "/customers"
    description: "List customers, optionally filtered by credit_status"
    roles: [CreditController, OpsCoordinator]
    code: 200
    input: ["credit_status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: ["none"]
  - method: GET
    path: "/customers/{id}/credit-exposure"
    description: "Computed read returning both variants of calculations.customer_credit_exposure on the Customer projection (outstanding_balance_usd, conservative_exposure_usd, available_credit_usd, open_commitment_count, credit_status)"
    roles: [CreditController, CustomerRep]
    code: 200
    input: []
    output: Customer
    side_effects: ["recomputes Customer.outstanding_balance_usd, conservative_exposure_usd, available_credit_usd, open_commitment_count and credit_status per calculations.customer_credit_exposure"]
  - method: POST
    path: "/customers/{id}/credit-review"
    description: "Periodic credit review: adjust the credit limit and/or the contractual settlement basis and re-derive credit_status"
    roles: [CreditController]
    code: 200
    input: ["credit_limit_usd?", "settlement_basis?"]
    output: Customer
    side_effects: ["recomputes Customer.credit_status via calculations.customer_credit_exposure variant settled_receivables", "increments Customer.version by 1"]

  - method: POST
    path: "/delivery-assets"
    description: "Register a bunker barge or road tanker at its home port"
    roles: [OpsCoordinator]
    code: 201
    input: [name, asset_type, capacity_mt, home_port_id, "boom_certified?", "segregated_tanks?", "turnaround_buffer_minutes?"]
    output: DeliveryAsset
    side_effects: ["compliance_score initialised to 100.00, status to AVAILABLE, committed_quantity_mt to 0.000"]
  - method: GET
    path: "/delivery-assets/{id}"
    description: "Read one delivery asset"
    roles: [OpsCoordinator, ComplianceOfficer, BargeMaster]
    code: 200
    input: []
    output: DeliveryAsset
    side_effects: ["none"]
  - method: GET
    path: "/delivery-assets"
    description: "List delivery assets, optionally filtered by home port, last-carried grade, status or type"
    roles: [OpsCoordinator, ComplianceOfficer, BargeMaster]
    code: 200
    input: ["home_port_id?", "last_grade_id?", "status?", "asset_type?", "limit?", "offset?"]
    output: DeliveryAsset[]
    side_effects: ["none"]
  - method: POST
    path: "/delivery-assets/{id}/return-to-service"
    description: "Lift a quarantine after every spill incident on the asset is closed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DeliveryAsset
    side_effects: ["DeliveryAsset.status QUARANTINED -> AVAILABLE", "recomputes DeliveryAsset.compliance_score with the current decay window"]

  - method: POST
    path: "/nominations"
    description: "Intake a vessel bunker nomination: grade, quantity, delivery window, mode and ECA documentation"
    roles: [OpsCoordinator, CustomerRep]
    code: 201
    input: [customer_id, port_id, grade_id, vessel_imo, vessel_name, "scrubber_fitted?", nominated_quantity_mt, window_start, window_end, delivery_mode, declared_sulfur_pct, "eca_documentation_ref?"]
    output: Nomination
    side_effects: ["fulfillment_status initialised to DRAFT and compliance_status to PENDING_REVIEW"]
  - method: GET
    path: "/nominations/{id}"
    description: "Read one nomination with both status dimensions and its version"
    roles: [OpsCoordinator, ComplianceOfficer, CustomerRep]
    code: 200
    input: []
    output: Nomination
    side_effects: ["none"]
  - method: GET
    path: "/nominations"
    description: "List nominations, optionally filtered by customer, port, grade or either status dimension"
    roles: [OpsCoordinator, ComplianceOfficer, CustomerRep]
    code: 200
    input: ["customer_id?", "port_id?", "grade_id?", "fulfillment_status?", "compliance_status?", "limit?", "offset?"]
    output: Nomination[]
    side_effects: ["none"]
  - method: POST
    path: "/nominations/{id}/compliance-review"
    description: "ECA and specification compliance decision on the nomination: APPROVE, REJECT, or REOPEN a rejected stem"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: Nomination
    side_effects: ["moves Nomination.compliance_status per §1.2", "sets or clears Nomination.compliance_reviewer_user_id", "increments Nomination.version by 1"]
  - method: POST
    path: "/nominations/{id}/confirm"
    description: "Confirm the stem after compliance approval and the conservative credit check"
    roles: [OpsCoordinator]
    code: 200
    input: []
    output: Nomination
    side_effects: ["Nomination.fulfillment_status DRAFT -> CONFIRMED", "the stem joins the open-commitment set of calculations.customer_credit_exposure", "increments Nomination.version by 1"]
  - method: POST
    path: "/nominations/{id}/auto-schedule"
    description: "Server-side asset selection: applies calculations.auto_schedule_asset_selection to pick the asset, derive slot_end and create the DeliveryOrder"
    roles: [OpsCoordinator]
    code: 201
    input: [requested_slot_start, expected_nomination_version]
    output: DeliveryOrder
    side_effects: ["creates a DeliveryOrder with logistics_status SCHEDULED", "cancels any existing SCHEDULED or CLEARED order on the nomination (supersede)", "recomputes DeliveryAsset.committed_quantity_mt", "Nomination.fulfillment_status CONFIRMED or AWAITING_SCHEDULE -> SCHEDULED", "increments Nomination.version by 1"]

  - method: POST
    path: "/delivery-orders"
    description: "Schedule a barge or truck delivery against a confirmed nomination on an explicitly chosen asset and slot"
    roles: [OpsCoordinator]
    code: 201
    input: [nomination_id, asset_id, planned_quantity_mt, slot_start, slot_end, expected_nomination_version]
    output: DeliveryOrder
    side_effects: ["creates a DeliveryOrder with logistics_status SCHEDULED and measurement_status NOT_STARTED", "any existing DeliveryOrder on the nomination with logistics_status IN {SCHEDULED, CLEARED} transitions to CANCELLED (supersede), which recomputes that asset's committed_quantity_mt", "recomputes DeliveryAsset.committed_quantity_mt for the chosen asset", "Nomination.fulfillment_status CONFIRMED or AWAITING_SCHEDULE -> SCHEDULED", "increments Nomination.version by 1"]
  - method: GET
    path: "/delivery-orders/{id}"
    description: "Read one delivery order with both status dimensions and all measurement figures"
    roles: [OpsCoordinator, Surveyor, BargeMaster, CustomerRep]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["none"]
  - method: GET
    path: "/delivery-orders"
    description: "List delivery orders, optionally filtered by nomination, asset or either status dimension"
    roles: [OpsCoordinator, Surveyor, BargeMaster, CustomerRep]
    code: 200
    input: ["nomination_id?", "asset_id?", "logistics_status?", "measurement_status?", "limit?", "offset?"]
    output: DeliveryOrder[]
    side_effects: ["none"]
  - method: POST
    path: "/delivery-orders/{id}/clear"
    description: "Record port-authority and terminal clearance for the slot"
    roles: [OpsCoordinator]
    code: 200
    input: [port_clearance_ref]
    output: DeliveryOrder
    side_effects: ["DeliveryOrder.logistics_status SCHEDULED -> CLEARED", "sets port_clearance_ref and cleared_at to the logical clock"]
  - method: POST
    path: "/delivery-orders/{id}/start-pumping"
    description: "Start the transfer; boom deployment and grade segregation are enforced here"
    roles: [BargeMaster]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["DeliveryOrder.logistics_status CLEARED -> PUMPING", "sets DeliveryAsset.last_grade_id to the nomination's grade_id"]
  - method: POST
    path: "/delivery-orders/{id}/complete-pumping"
    description: "Close the transfer and record tank soundings and the meter totaliser; on the SUPPLIER_FIGURES basis the quantity is agreed in the same request"
    roles: [BargeMaster]
    code: 200
    input: [barge_sounding_mt, vessel_sounding_mt, meter_mt]
    output: DeliveryOrder
    side_effects: ["DeliveryOrder.logistics_status PUMPING -> DELIVERED", "measurement_status NOT_STARTED -> FIGURES_RECORDED, then -> AGREED when Customer.settlement_basis == SUPPLIER_FIGURES", "sets agreed_quantity_mt, measurement_basis and shortfall_mt via calculations.agreed_quantity_resolution on that branch", "recomputes DeliveryAsset.committed_quantity_mt", "recomputes DeliveryAsset.compliance_score", "cascades Nomination.fulfillment_status SCHEDULED -> DELIVERED"]
  - method: POST
    path: "/delivery-orders/{id}/joint-survey"
    description: "Record the independent surveyor's figure, either as the mandatory joint survey or as the resurvey of a disputed quantity"
    roles: [Surveyor]
    code: 200
    input: [surveyed_mt]
    output: DeliveryOrder
    side_effects: ["DeliveryOrder.measurement_status FIGURES_RECORDED or DISPUTED -> RESURVEYED", "stores surveyed_mt"]
  - method: POST
    path: "/delivery-orders/{id}/quantity-decision"
    description: "Conditional action closing the measurement dispute procedure: the Surveyor AGREEs a resurveyed figure, the CustomerRep DISPUTEs an agreed one"
    roles: [Surveyor, CustomerRep]
    code: 200
    input: [decision]
    output: DeliveryOrder
    side_effects: ["decision AGREE: measurement_status RESURVEYED -> AGREED and sets agreed_quantity_mt, measurement_basis JOINT_SURVEY and shortfall_mt via calculations.agreed_quantity_resolution", "decision DISPUTE: measurement_status AGREED -> DISPUTED and clears agreed_quantity_mt, measurement_basis and shortfall_mt"]
  - method: POST
    path: "/delivery-orders/{id}/cancel"
    description: "Cancel a scheduled, cleared or suspended delivery order and release the asset commitment"
    roles: [OpsCoordinator]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["DeliveryOrder.logistics_status -> CANCELLED", "recomputes DeliveryAsset.committed_quantity_mt", "clears port_clearance_ref and cleared_at when the order was CLEARED", "cascades Nomination.fulfillment_status SCHEDULED -> AWAITING_SCHEDULE when no other non-terminal order remains"]

  - method: POST
    path: "/bunker-delivery-notes"
    description: "Issue the MARPOL bunker delivery note and register the mandatory retained sample seal"
    roles: [OpsCoordinator]
    code: 201
    input: [delivery_order_id, bdn_number, declared_sulfur_pct, sample_seal_number]
    output: BunkerDeliveryNote
    side_effects: ["snapshots delivered_quantity_mt from DeliveryOrder.agreed_quantity_mt", "sets sample_retention_until = created_at + 90 days and sample_custody_status RETAINED", "any prior BunkerDeliveryNote on the same order transitions ISSUED -> SUPERSEDED"]
  - method: GET
    path: "/bunker-delivery-notes/{id}"
    description: "Read one bunker delivery note with its derived sample custody status"
    roles: [OpsCoordinator, Surveyor, CustomerRep, LabTechnician]
    code: 200
    input: []
    output: BunkerDeliveryNote
    side_effects: ["re-derives sample_custody_status against the logical clock"]
  - method: GET
    path: "/bunker-delivery-notes"
    description: "List bunker delivery notes, optionally filtered by delivery order or status"
    roles: [OpsCoordinator, Surveyor, CustomerRep, LabTechnician]
    code: 200
    input: ["delivery_order_id?", "status?", "limit?", "offset?"]
    output: BunkerDeliveryNote[]
    side_effects: ["re-derives sample_custody_status against the logical clock"]
  - method: POST
    path: "/bunker-delivery-notes/{id}/release-sample"
    description: "Release the retained sample to the laboratory before its retention period expires"
    roles: [OpsCoordinator]
    code: 200
    input: []
    output: BunkerDeliveryNote
    side_effects: ["sets sample_released_at to the logical clock so sample_custody_status becomes RELEASED_TO_LAB"]

  - method: POST
    path: "/quality-claims"
    description: "Raise a quality claim on an off-spec stem against the note's retained sample"
    roles: [CustomerRep]
    code: 201
    input: [bdn_id, claimed_defect, affected_quantity_mt, "replacement_price_usd_per_mt?"]
    output: QualityClaim
    side_effects: ["snapshots quantity_basis_mt from BunkerDeliveryNote.delivered_quantity_mt", "copies customer_id from the nomination behind the note", "status initialised to SUBMITTED and analysis_round to 0"]
  - method: GET
    path: "/quality-claims/{id}"
    description: "Read one quality claim"
    roles: [Surveyor, CreditController, CustomerRep, LabTechnician]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["none"]
  - method: GET
    path: "/quality-claims"
    description: "List quality claims, optionally filtered by note, customer or status"
    roles: [Surveyor, CreditController, CustomerRep, LabTechnician]
    code: 200
    input: ["bdn_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: QualityClaim[]
    side_effects: ["none"]
  - method: POST
    path: "/quality-claims/{id}/decision"
    description: "Surveyor decision on the analysed claim: PROPOSE a remediation (PRICE_ALLOWANCE or DEBUNKER) or REJECT an on-spec finding"
    roles: [Surveyor]
    code: 200
    input: [decision, "remediation_type?"]
    output: QualityClaim
    side_effects: ["decision PROPOSE: status UNDER_ANALYSIS -> REMEDIATION_PROPOSED, sets remediation_type, proposed_by_user_id and credit_usd via calculations.remediation_credit", "decision REJECT: status UNDER_ANALYSIS -> REJECTED leaving credit_usd 0.00", "increments QualityClaim.version by 1"]
  - method: POST
    path: "/quality-claims/{id}/request-retest"
    description: "Customer rejects the proposed remediation and sends the retained sample for a second round of analysis"
    roles: [CustomerRep]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["status REMEDIATION_PROPOSED -> UNDER_ANALYSIS", "clears remediation_type and proposed_by_user_id, resets credit_usd to 0.00", "increments QualityClaim.version by 1"]
  - method: POST
    path: "/quality-claims/{id}/accept-remediation"
    description: "Credit control books the proposed remediation credit against the issued invoice; the acting user may not be the proposer"
    roles: [CreditController]
    code: 200
    input: []
    output: QualityClaim
    side_effects: ["status REMEDIATION_PROPOSED -> REMEDIATION_ACCEPTED and sets accepted_by_user_id", "cascades Invoice.claim_credit_usd and final_amount_usd, moving Invoice.status ISSUED -> CREDIT_APPLIED", "that invoice change itself cascades Customer.outstanding_balance_usd, which itself cascades Customer.credit_status"]

  - method: POST
    path: "/lab-analyses"
    description: "File a laboratory analysis of the released sample; carries the OCC guard on the parent claim"
    roles: [LabTechnician]
    code: 201
    input: [claim_id, lab_ref, measured_sulfur_pct, expected_claim_version, "retest_of_analysis_id?"]
    output: LabAnalysis
    side_effects: ["computes verdict and exceedance_pct via calculations.offspec_verdict", "sets round_index and advances QualityClaim.analysis_round", "QualityClaim.status SUBMITTED -> UNDER_ANALYSIS on the first round", "increments QualityClaim.version by 1"]
  - method: GET
    path: "/lab-analyses/{id}"
    description: "Read one laboratory analysis"
    roles: [LabTechnician, Surveyor, CustomerRep]
    code: 200
    input: []
    output: LabAnalysis
    side_effects: ["none"]
  - method: GET
    path: "/lab-analyses"
    description: "List laboratory analyses, optionally filtered by claim, retested analysis or verdict"
    roles: [LabTechnician, Surveyor, CustomerRep]
    code: 200
    input: ["claim_id?", "retest_of_analysis_id?", "verdict?", "limit?", "offset?"]
    output: LabAnalysis[]
    side_effects: ["none"]

  - method: POST
    path: "/invoices"
    description: "Raise the provisional invoice for a delivered, quantity-agreed order using the indexed price and bunker adjustment factor"
    roles: [CreditController]
    code: 201
    input: [delivery_order_id, pricing_date]
    output: Invoice
    side_effects: ["computes index_price_usd_per_mt, quantity_basis_mt, baf_pct and the four rounded components via calculations.invoice_amount and calculations.bunker_adjustment_factor", "status initialised to PROVISIONAL"]
  - method: GET
    path: "/invoices/{id}"
    description: "Read one invoice with all pricing components"
    roles: [CreditController, OpsCoordinator, CustomerRep]
    code: 200
    input: []
    output: Invoice
    side_effects: ["none"]
  - method: GET
    path: "/invoices"
    description: "List invoices, optionally filtered by delivery order, customer or status"
    roles: [CreditController, OpsCoordinator, CustomerRep]
    code: 200
    input: ["delivery_order_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: ["none"]
  - method: POST
    path: "/invoices/{id}/issue"
    description: "Issue the invoice to the customer under its credit terms"
    roles: [CreditController]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status PROVISIONAL -> ISSUED, sets issued_at and due_date", "recomputes Customer.outstanding_balance_usd and Customer.credit_status", "cascades Nomination.fulfillment_status DELIVERED -> CLOSED"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Compensating action that voids an invoice and reverses the receivable"
    roles: [CreditController]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> VOID", "recomputes Customer.outstanding_balance_usd and Customer.credit_status", "cascades Nomination.fulfillment_status CLOSED -> DELIVERED when the voided invoice was the only ISSUED or CREDIT_APPLIED invoice on the order"]

  - method: POST
    path: "/spill-incidents"
    description: "Report a fuel spill during a delivery; severity, penalty points and the quarantine cascade are derived here"
    roles: [BargeMaster]
    code: 201
    input: [delivery_order_id, reported_at, volume_liters, boom_deployed]
    output: SpillIncident
    side_effects: ["copies asset_id and port_id from the delivery order and its nomination", "computes severity and penalty_points", "suspends the delivery order (logistics_status -> SUSPENDED)", "recomputes DeliveryAsset.compliance_score", "on MAJOR severity quarantines the asset, which cancels that asset's other SCHEDULED and CLEARED orders, which sets each of their nominations to AWAITING_SCHEDULE"]
  - method: GET
    path: "/spill-incidents/{id}"
    description: "Read one spill incident"
    roles: [ComplianceOfficer, OpsCoordinator, BargeMaster]
    code: 200
    input: []
    output: SpillIncident
    side_effects: ["none"]
  - method: GET
    path: "/spill-incidents"
    description: "List spill incidents, optionally filtered by delivery order, asset, port or status"
    roles: [ComplianceOfficer, OpsCoordinator, BargeMaster]
    code: 200
    input: ["delivery_order_id?", "asset_id?", "port_id?", "status?", "limit?", "offset?"]
    output: SpillIncident[]
    side_effects: ["none"]
  - method: POST
    path: "/spill-incidents/{id}/confirm-containment"
    description: "Record the port response team's containment confirmation and case reference"
    roles: [ComplianceOfficer]
    code: 200
    input: [response_ref]
    output: SpillIncident
    side_effects: ["sets containment_confirmed to true and response_ref"]
  - method: POST
    path: "/spill-incidents/{id}/close"
    description: "Close the incident once containment is confirmed, unblocking return-to-service for the asset"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SpillIncident
    side_effects: ["status OPEN -> CLOSED and sets closed_at to the logical clock"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "A CustomerRep acts on a nomination, order, note, claim or invoice belonging to another Customer"
  - id: ERR_ASSET_NOT_ASSIGNED
    http: 403
    condition: "A BargeMaster acts on a delivery order whose asset_id differs from the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The BDN issuer equals the nomination's compliance reviewer, or the remediation acceptor equals the proposer"
  - id: ERR_PORT_NOT_FOUND
    http: 404
    condition: "port_id does not resolve to a Port"
  - id: ERR_FUEL_GRADE_NOT_FOUND
    http: 404
    condition: "grade_id does not resolve to a FuelGrade"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id does not resolve to a Customer"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "asset_id does not resolve to a DeliveryAsset"
  - id: ERR_NOMINATION_NOT_FOUND
    http: 404
    condition: "nomination_id does not resolve to a Nomination"
  - id: ERR_DELIVERY_ORDER_NOT_FOUND
    http: 404
    condition: "delivery_order_id does not resolve to a DeliveryOrder"
  - id: ERR_BDN_NOT_FOUND
    http: 404
    condition: "bdn_id does not resolve to a BunkerDeliveryNote"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id does not resolve to a QualityClaim"
  - id: ERR_LAB_ANALYSIS_NOT_FOUND
    http: 404
    condition: "retest_of_analysis_id or the path id does not resolve to a LabAnalysis"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to an Invoice"
  - id: ERR_SPILL_INCIDENT_NOT_FOUND
    http: 404
    condition: "The path id does not resolve to a SpillIncident"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong type, invalid enum member, non-positive quantity, decimal scale violation, or out-of-range pagination parameter"
  - id: ERR_STALE_NOMINATION_VERSION
    http: 412
    condition: "expected_nomination_version does not equal the Nomination's current version"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the QualityClaim's current version"
  - id: ERR_INVALID_NOMINATION_STATE
    http: 409
    condition: "The nomination's fulfillment_status or compliance_status is not a legal from-state for the requested transition"
  - id: ERR_COMPLIANCE_NOT_APPROVED
    http: 409
    condition: "The nomination's compliance_status is not APPROVED"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "The delivery order's logistics_status is not a legal from-state for the requested transition"
  - id: ERR_INVALID_MEASUREMENT_STATE
    http: 409
    condition: "The delivery order's measurement_status is not a legal from-state for the requested measurement transition"
  - id: ERR_MEASUREMENT_NOT_AGREED
    http: 409
    condition: "The delivery order's measurement_status is not AGREED, so no governing quantity exists"
  - id: ERR_BDN_ALREADY_ISSUED
    http: 409
    condition: "A BunkerDeliveryNote with status ISSUED already exists for the delivery order"
  - id: ERR_BDN_NOT_ISSUED
    http: 409
    condition: "No BunkerDeliveryNote with status ISSUED exists for the delivery order"
  - id: ERR_INVOICE_ALREADY_EXISTS
    http: 409
    condition: "A non-void Invoice already exists for the delivery order"
  - id: ERR_INVALID_INVOICE_STATE
    http: 409
    condition: "The invoice's status is not a legal from-state for the requested transition"
  - id: ERR_INVOICE_NOT_ISSUED
    http: 409
    condition: "No non-void invoice exists on the claim's delivery order, or accept-remediation was called while that invoice is not ISSUED"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "The quality claim's status is not a legal from-state for the requested transition"
  - id: ERR_SAMPLE_NOT_RELEASED
    http: 409
    condition: "The claim's note does not have sample_custody_status RELEASED_TO_LAB"
  - id: ERR_RETEST_LIMIT_REACHED
    http: 409
    condition: "The claim already has MAX_ANALYSIS_ROUNDS (2) analyses"
  - id: ERR_NO_OFFSPEC_FINDING
    http: 409
    condition: "PROPOSE was requested while the governing analysis verdict is ON_SPEC, or REJECT while it is OFF_SPEC"
  - id: ERR_NO_MEASUREMENT_DISCREPANCY
    http: 409
    condition: "DISPUTE was requested although vessel_sounding_mt is not lower than barge_sounding_mt"
  - id: ERR_ASSET_QUARANTINED
    http: 409
    condition: "The delivery asset has status QUARANTINED"
  - id: ERR_INVALID_ASSET_STATE
    http: 409
    condition: "return-to-service was called on an asset whose status is already AVAILABLE"
  - id: ERR_OPEN_SPILL_INCIDENT
    http: 409
    condition: "A SpillIncident on the asset still has status OPEN"
  - id: ERR_INVALID_SPILL_STATE
    http: 409
    condition: "close was called on a SpillIncident whose status is already CLOSED"
  - id: ERR_ECA_SULFUR_VIOLATION
    http: 422
    condition: "The nominated grade exceeds the port's ECA sulfur limit for a vessel without a scrubber, or the declared sulfur exceeds the grade ceiling"
  - id: ERR_ECA_DOCUMENTATION_MISSING
    http: 422
    condition: "eca_documentation_ref is null for an ECA port with a non-scrubber vessel"
  - id: ERR_BOOM_NOT_CERTIFIED
    http: 422
    condition: "The delivery asset is not boom_certified, so the spill prevention plan cannot be satisfied"
  - id: ERR_GRADE_INCOMPATIBLE_ASSET
    http: 422
    condition: "The asset last carried a different cross_contamination_group and has no segregated tanks"
  - id: ERR_CONTAINMENT_NOT_CONFIRMED
    http: 422
    condition: "close was called before containment_confirmed is true and a response_ref exists"
  - id: ERR_ASSET_NOT_SUITABLE
    http: 422
    condition: "The chosen asset's home port or asset_type does not match the nomination"
  - id: ERR_WINDOW_TOO_SHORT
    http: 422
    condition: "window_end is earlier than window_start + MIN_WINDOW_HOURS (6 hours)"
  - id: ERR_SLOT_OUTSIDE_WINDOW
    http: 422
    condition: "The slot is not fully inside the nomination window, or pumping started before slot_start"
  - id: ERR_ASSET_SLOT_CONFLICT
    http: 409
    condition: "The slot intersects another slot on the same asset, or the gap to it is not strictly greater than the asset's turnaround buffer"
  - id: ERR_PORT_CAPACITY_EXCEEDED
    http: 409
    condition: "The port already has concurrent_ops_capacity orders whose half-open slots intersect the new one"
  - id: ERR_NOTICE_PERIOD_MISSED
    http: 422
    condition: "slot_start is earlier than the logical clock plus the port's notice_lead_hours"
  - id: ERR_CLAIM_WINDOW_CLOSED
    http: 422
    condition: "The logical clock is past the note's created_at plus CLAIM_WINDOW_DAYS (30 days)"
  - id: ERR_SAMPLE_RETENTION_EXPIRED
    http: 422
    condition: "The logical clock is past the note's sample_retention_until"
  - id: ERR_ASSET_CAPACITY_EXCEEDED
    http: 422
    condition: "planned_quantity_mt or barge_sounding_mt exceeds the asset's capacity_mt"
  - id: ERR_AFFECTED_QUANTITY_EXCEEDS_BASIS
    http: 422
    condition: "affected_quantity_mt exceeds the note's delivered_quantity_mt"
  - id: ERR_MEASUREMENT_FIGURES_INCONSISTENT
    http: 422
    condition: "The barge sounding and the meter totaliser differ by more than MEASUREMENT_TOLERANCE_MT (1.000)"
  - id: ERR_DUPLICATE_REFERENCE_CODE
    http: 409
    condition: "port_code or grade_code already exists"
  - id: ERR_DUPLICATE_BDN_NUMBER
    http: 409
    condition: "bdn_number already exists"
  - id: ERR_DUPLICATE_SAMPLE_SEAL
    http: 409
    condition: "sample_seal_number already exists"
  - id: ERR_NO_ELIGIBLE_ASSET
    http: 409
    condition: "The auto-schedule candidate pool is empty after the eligibility filter"
  - id: ERR_INDEX_QUOTE_UNAVAILABLE
    http: 422
    condition: "No IndexQuote exists for the grade at or before the requested pricing date or logical clock"
  - id: ERR_CUSTOMER_CREDIT_HOLD
    http: 402
    condition: "The customer's credit_status is HOLD"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "The prospective conservative exposure exceeds the customer's credit_limit_usd"

roles:
  - name: OpsCoordinator
    description: "Bunker operations desk: reference data, nomination intake and confirmation, barge/truck scheduling, port clearance, BDN issuance and sample custody"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /ports"
      - "POST /fuel-grades"
      - "POST /delivery-assets"
      - "POST /nominations/{id}/confirm"
      - "POST /nominations/{id}/auto-schedule"
      - "POST /delivery-orders"
      - "POST /delivery-orders/{id}/clear"
      - "POST /delivery-orders/{id}/cancel"
      - "POST /bunker-delivery-notes"
      - "POST /bunker-delivery-notes/{id}/release-sample"
    shared_operations:
      - "POST /nominations (with CustomerRep)"
      - "POST /index-quotes (with CreditController)"
      - "GET reads on ports, fuel-grades, index-quotes, customers, delivery-assets, nominations, delivery-orders, bunker-delivery-notes, invoices, spill-incidents"
  - name: ComplianceOfficer
    description: "Regulatory desk: ECA sulfur and documentation review, spill containment sign-off and asset quarantine release"
    identity: "opaque"
    exclusive_operations:
      - "POST /nominations/{id}/compliance-review"
      - "POST /delivery-assets/{id}/return-to-service"
      - "POST /spill-incidents/{id}/confirm-containment"
      - "POST /spill-incidents/{id}/close"
    shared_operations:
      - "GET reads on ports, fuel-grades, delivery-assets, nominations, spill-incidents"
  - name: Surveyor
    description: "Independent quantity and quality surveyor: joint surveys, resurveys, quantity agreement and claim remediation proposals"
    identity: "opaque"
    exclusive_operations:
      - "POST /delivery-orders/{id}/joint-survey"
      - "POST /quality-claims/{id}/decision"
    shared_operations:
      - "POST /delivery-orders/{id}/quantity-decision (AGREE branch; the DISPUTE branch belongs to CustomerRep)"
      - "GET reads on ports, fuel-grades, delivery-orders, bunker-delivery-notes, quality-claims, lab-analyses"
  - name: CreditController
    description: "Credit and billing desk: customer onboarding, credit reviews, index quotes, invoicing and remediation credits"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /customers/{id}/credit-review"
      - "POST /invoices"
      - "POST /invoices/{id}/issue"
      - "POST /invoices/{id}/void"
      - "POST /quality-claims/{id}/accept-remediation"
    shared_operations:
      - "POST /index-quotes (with OpsCoordinator)"
      - "GET reads on ports, fuel-grades, index-quotes, customers, customer credit-exposure, quality-claims, invoices"
  - name: LabTechnician
    description: "Fuel testing laboratory: files analyses of released retained samples"
    identity: "opaque"
    exclusive_operations:
      - "POST /lab-analyses"
    shared_operations:
      - "GET reads on bunker-delivery-notes, quality-claims, lab-analyses"
  - name: CustomerRep
    description: "Representative of the buying customer; X-User-ID is the Customer id it acts for"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /quality-claims"
      - "POST /quality-claims/{id}/request-retest"
    shared_operations:
      - "POST /nominations (with OpsCoordinator)"
      - "POST /delivery-orders/{id}/quantity-decision (DISPUTE branch)"
      - "GET reads on own nominations, delivery-orders, bunker-delivery-notes, quality-claims, lab-analyses, invoices and own credit-exposure"
  - name: BargeMaster
    description: "Master of the delivering barge or tanker; X-User-ID is the DeliveryAsset id it acts for"
    identity: "entity_backed:DeliveryAsset"
    exclusive_operations:
      - "POST /delivery-orders/{id}/start-pumping"
      - "POST /delivery-orders/{id}/complete-pumping"
      - "POST /spill-incidents"
    shared_operations:
      - "GET reads on delivery-assets, delivery-orders, spill-incidents"
