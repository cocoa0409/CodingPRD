        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_CONTEXT]"]
        distinguishing_aspect: "A request omitting X-User-Role -> ERR_MISSING_AUTH_CONTEXT 401 (auth precedes all other checks)."
