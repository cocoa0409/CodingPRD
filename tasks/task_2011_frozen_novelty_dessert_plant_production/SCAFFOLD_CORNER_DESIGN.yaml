      - 'parent: successor_product_id == ${child} and version == 2 (mutation incremented it)'
  - name: occ_amend_stale_version_rejected
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[contract-amend-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: Amend carrying the version observed at SUBMITTED time after approve advanced it -> 412 ERR_STALE_VERSION.
