        payload: {}
        as: SupplyPlanner
        captures:
          node_fee: $.data.committed_fee_cents
      assert:
      - ${hold_big_rate} == 1.95
      - the first hold's committed_rate_v2 == 1.75
      - ${node_fee} == 23187
      - ${node_fee} != 23188 (sum-then-round is NOT the pinned order)
  - name: preemption_displacement_frozen_candidate_snapshot
    grounds:
    - calculations.preemption_displacement
    - calculations.allocation_priority_ranking
    - state_machines.AllocationHold.REQUESTED_to_RECLAIMED
    - entities.AllocationHold.fields.state
    distinguishing_aspect: 'The candidate ranking and the displaced prefix are frozen before the

      incoming hold row exists, so the freshest standby reservation (score

      275.0, the only one whose eligibility deadline is close) is reclaimed

      while the incoming hold ends COMMITTED — had the incoming row been

      created first it would have entered its own candidate set at the same

      275.0 score and could have been displaced instead, pinning mode (c).

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-18T00:00:00Z. Partners HELIOS, CORVUS and DELTA qualified. Pool POOL-AMER-1 capacity 1000 holds three REQUESTED reservations of 200, 300 and 400 units, all COOL tier, so node.held_units is 900 and the pool has 100 units of unheld capacity.
