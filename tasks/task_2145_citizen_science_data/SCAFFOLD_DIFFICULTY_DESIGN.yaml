  - rule_id: combinatorial_formula
    instances:
      - name: campaign_coverage_two_stage_rounding_order
        grounds:
          - calculations.campaign_coverage_score
          - entities.SurveySite.fields.coverage_ratio
          - entities.Campaign.fields.coverage_score
          - entities.Campaign.fields.gap_count
        distinguishing_aspect: |
          Mode (b) nested-rounding-order instance: per-site coverage_ratio is rounded to 2 dp BEFORE
          the campaign mean is taken, so a campaign with target 3 and per-site accepted counts
          [1, 0] reports coverage_score 0.1650; averaging the unrounded ratios first and rounding
          once would report 0.1667.
        test_recipe:
          setup:
            - "Protocol BBS-2026 ACTIVE, Volunteer Vera ACTIVE and CERTIFIED, Campaign Autumn Count OPEN with target_observations_per_site 3"
            - "Two sites: S-HI (priority_weight 1.5) and S-LO (priority_weight 0.8), both with zero accepted observations"
            - "Observation o1 at S-HI is UNDER_REVIEW with one CONFIRM vote of confidence 5 already cast"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /citizen-science/protocols"
              payload: { code: "BBS-2026", title: "Breeding Bird Survey 2026", required_certification_level: "BASIC", min_photo_count: 1, max_submission_lag_hours: 96, required_equipment_type: "NONE", certification_valid_days: 365 }
