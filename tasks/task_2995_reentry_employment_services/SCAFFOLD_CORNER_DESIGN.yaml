          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      trigger:
      - call: POST /supervision-cases
        payload:
          participant_id: ${p1_id}
          officer_user_id: officer-1
          officer_name: M. Ruiz
          supervision_type: PAROLE
          expected_discharge_date: '2027-08-01'
        as: SupervisionOfficer
        as_user_id: officer-1
        captures:
          sc1_id: $.data.id
      assert:
      - HTTP 201
      - data.status == "PENDING_CONTACT"
      - data.work_authorization_status == "NOT_REQUESTED"
      - data.approved_window_start_minute == null
      - data.approved_window_end_minute == null
      - data.authorization_change_count == 0
      - data.officer_user_id == "officer-1"
      - data.version == 1
  - name: partnership_walks_prospect_to_engaged_to_active
    claim_type: valid_transition
    grounds:
    - state_machines.EmployerPartnership_status.transitions.PROSPECT_to_ENGAGED
    - state_machines.EmployerPartnership_status.transitions.ENGAGED_to_ACTIVE
    distinguishing_aspect: 'The two hops must be taken in order and each one is a mutation: version reaches exactly
      3 (create + two transitions). A shortcut straight from PROSPECT to ACTIVE is refused by the invalid-transition
      instance; here the legal walk must succeed and bump the row each time.'
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /employer-partnerships
        payload:
          employer_name: Northgate Logistics
          industry: LOGISTICS
          max_concurrent_placements: 2
          wotc_certified: true
          excluded_record_categories: []
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          pt1_id: $.data.id
      trigger:
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ENGAGED
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ACTIVE
        as: EmployerLiaison
        as_user_id: liaison-1
      assert:
      - 'first trigger call: HTTP 200, data.status == "ENGAGED", data.version == 2'
      - 'second trigger call: HTTP 200, data.status == "ACTIVE", data.version == 3'
      - data.active_placement_count == 0 throughout
      - GET /employer-partnerships?status=ACTIVE returns total_count == 1
