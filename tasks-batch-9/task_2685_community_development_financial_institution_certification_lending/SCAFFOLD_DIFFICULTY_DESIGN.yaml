scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: target_market_lending_dollar_versus_count_weighted_divergence
        grounds:
          - calculations.target_market_lending_percentage
          - entities.ComplianceMeasurement.fields.weighting_basis
          - entities.ComplianceMeasurement.fields.dollar_weighted_pct
          - entities.ComplianceMeasurement.fields.count_weighted_pct
          - entities.ComplianceMeasurement.fields.selected_pct
          - entities.Loan.fields.borrower_in_target_market_at_origination
          - state_machines.ComplianceMeasurement.DRAFT_to_FINALIZED
          - validations[priority=71]
        distinguishing_aspect: |
          This instance's two variants differ in the WEIGHT applied to each loan (principal
          versus headcount) over one identical loan set, so the same window returns 60.00
          (PASS) and 50.00 (FAIL); the other dual_variant instance's variants differ in the
          INPUT SET and the BASE amount (live outstanding versus original disbursed principal).
        test_recipe:
          setup:
            - "One institution with one APPROVED INVESTMENT_AREA target market covering census tract 36005010100."
            - "Borrower B1 geocoded into that tract (in_target_market true); borrower B2 geocoded outside it (in_target_market false, credit_score present so the OTHER_TARGETED_POPULATION predicate cannot rescue it)."
            - "Loan L1 of 6,000,000 cents to B1 and loan L2 of 4,000,000 cents to B2, both fully disbursed on 2026-09-15, so both carry first_disbursed_on inside the window and L1 carries borrower_in_target_market_at_origination true."
            - "Logical clock advanced to 2026-10-01 so that period_end is not in the future."
            - "Two DRAFT measurements over the identical window 2026-09-01 to 2026-10-01, one DOLLAR_WEIGHTED and one COUNT_WEIGHTED (permitted because overlap detection is scoped per weighting_basis)."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Delta Community Capital Fund", ein: "110000001", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/target-markets"
              payload: { market_type: "INVESTMENT_AREA", name: "South Bronx Investment Area", census_tract_codes: ["36005010100"] }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { tm_id: $.data.id }
            - call: "POST /cdfi/target-markets/${tm_id}/approve"
              payload: {}
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Flexible Small Business Loan", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b1_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36005010100" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Peter Hale", street_address: "88 Riverside Drive", postal_code: "10024", household_income_cents: 9800000, area_median_income_cents: 7000000, credit_score: 760 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b2_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36061019900" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 6000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /cdfi/loans/${l1_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
            - call: "POST /cdfi/loans/${l1_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 6000000 }
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "POST /cdfi/loans/${l1_id}/disbursements"
              payload: { amount_cents: 6000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b2_id}", product_id: "${prod_id}", requested_principal_cents: 4000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /cdfi/loans/${l2_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 760 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
            - call: "POST /cdfi/loans/${l2_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 4000000 }
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "POST /cdfi/loans/${l2_id}/disbursements"
              payload: { amount_cents: 4000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions/${inst_id}/compliance-measurements"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", weighting_basis: "DOLLAR_WEIGHTED" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { m_dollar_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/compliance-measurements"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", weighting_basis: "COUNT_WEIGHTED" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { m_count_id: $.data.id }
          trigger:
            - call: "POST /cdfi/compliance-measurements/${m_dollar_id}/finalize"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/compliance-measurements/${m_count_id}/finalize"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
          assert:
            - "ComplianceMeasurement.${m_dollar_id}.measured_loan_count == 2"
            - "ComplianceMeasurement.${m_dollar_id}.target_market_loan_count == 1"
            - "ComplianceMeasurement.${m_dollar_id}.measured_principal_cents == 10000000"
            - "ComplianceMeasurement.${m_dollar_id}.target_market_principal_cents == 6000000"
            - "ComplianceMeasurement.${m_dollar_id}.dollar_weighted_pct == 60.00"
            - "ComplianceMeasurement.${m_dollar_id}.count_weighted_pct == 50.00"
            - "ComplianceMeasurement.${m_dollar_id}.selected_pct == 60.00"
            - "ComplianceMeasurement.${m_dollar_id}.verdict == PASS"
            - "ComplianceMeasurement.${m_count_id}.dollar_weighted_pct == 60.00"
            - "ComplianceMeasurement.${m_count_id}.count_weighted_pct == 50.00"
            - "ComplianceMeasurement.${m_count_id}.selected_pct == 50.00"
            - "ComplianceMeasurement.${m_count_id}.verdict == FAIL"
            - "Institution.${inst_id}.target_market_lending_pct == 50.00"
      - name: loss_reserve_migration_versus_static_pool_divergence
        grounds:
          - calculations.portfolio_loss_reserve
          - calculations.reserve_coverage_and_posture
          - entities.Institution.fields.reserve_method
          - entities.Institution.fields.loss_reserve_required_migration_cents
          - entities.Institution.fields.loss_reserve_required_static_cents
          - entities.Institution.fields.loss_reserve_required_cents
          - state_machines.Loan.CURRENT_to_DELINQUENT_90
          - calculations.delinquency_bucket_assignment
        distinguishing_aspect: |
          This instance's two variants read DIFFERENT INPUT SETS and DIFFERENT BASE AMOUNTS
          of the same book - roll rates on current outstanding versus vintage rates on
          original disbursed principal - returning 1,520,000 and 135,000 cents; the other
          dual_variant instance's variants read one identical input set and differ only in
          the weight applied to each row.
        test_recipe:
          setup:
            - "One institution whose reserve_method is STATIC_POOL, so the selected variant is the vintage one while both variants are still computed and stored."
            - "Loan LB of 2,000,000 cents disbursed 2026-09-01 and driven to DELINQUENT_90 by a servicing run at 2026-12-31 (91 days past its 2026-10-01 installment)."
            - "Loan LA of 1,000,000 cents disbursed at 2026-12-31, therefore still CURRENT; both loans carry vintage_year 2026, which is the clock's calendar year."
            - "loss_reserve_balance_cents left at 0 so the coverage ratio is observable as 0.0000 against a non-zero requirement."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Static Pool Community Lender", ein: "110000002", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "STATIC_POOL", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Flexible Small Business Loan", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b1_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36005010100" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 2000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { lb_id: $.data.id }
            - call: "POST /cdfi/loans/${lb_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
            - call: "POST /cdfi/loans/${lb_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 2000000 }
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "POST /cdfi/loans/${lb_id}/disbursements"
              payload: { amount_cents: 2000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions/${inst_id}/servicing-runs"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { la_id: $.data.id }
            - call: "POST /cdfi/loans/${la_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
            - call: "POST /cdfi/loans/${la_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 1000000 }
              as: CreditCommittee
              as_user_id: "cc-1"
          trigger:
            - call: "POST /cdfi/loans/${la_id}/disbursements"
              payload: { amount_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
          assert:
            - "Loan.${lb_id}.servicing_state == DELINQUENT_90"
            - "Loan.${lb_id}.days_past_due == 91"
            - "Loan.${la_id}.servicing_state == CURRENT"
            - "Institution.${inst_id}.loss_reserve_required_migration_cents == 1520000"
            - "Institution.${inst_id}.loss_reserve_required_static_cents == 135000"
            - "Institution.${inst_id}.loss_reserve_required_cents == 135000"
            - "Institution.${inst_id}.portfolio_principal_outstanding_cents == 3000000"
            - "Institution.${inst_id}.reserve_coverage_ratio == 0.0000"
            - "Institution.${inst_id}.compliance_posture == PROBATION"
  - rule_id: combinatorial_formula
    instances:
      - name: award_match_per_commitment_rounding_order_decides_shortfall
        grounds:
          - calculations.award_eligible_match_total
          - entities.MatchingFundCommitment.fields.source_type
          - entities.MatchingFundCommitment.fields.eligible_cents
          - entities.AwardApplication.fields.required_match_cents
          - entities.AwardApplication.fields.match_eligible_cents
          - entities.AwardApplication.fields.match_shortfall_cents
          - state_machines.MatchingFundCommitment.PLEDGED_to_VERIFIED
        distinguishing_aspect: |
          This instance is the nested-rounding-order form: four haircut factors are applied
          and each product is rounded to whole cents BEFORE summation, so the pinned order
          yields 50,000,005 and shortfall 0 while the natural alternative order (sum exact
          products, round once) yields 50,000,004 and a 1-cent shortfall. The other
          combinatorial instance has no rounding-order ambiguity at all; its difficulty is a
          circular-looking dependency chain resolved by a pinned evaluation sequence.
        test_recipe:
          setup:
            - "One institution with one DRAFT award application for 100,000,010 cents at a 50.00 percent match ratio, so required_match_cents is 50,000,005."
            - "Four PLEDGED commitments whose haircut products each land on a half cent or an exact cent: 20,000,001 CASH_PRIVATE, 15,000,001 IN_KIND, 10,000,001 DEFERRED_PLEDGE and 30,000,003 IN_KIND."
            - "No award decision has been taken, so decided_by_user_id is null and the verification segregation-of-duties rule cannot fire."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Delta Community Capital Fund", ein: "110000003", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/award-applications"
              payload: { program: "CDFI_PROGRAM_FA", requested_amount_cents: 100000010, match_ratio_pct: 50.00, performance_goal_jobs: 40, performance_goal_housing_units: 10, period_start: "2026-10-01T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { award_id: $.data.id }
            - call: "POST /cdfi/award-applications/${award_id}/matching-fund-commitments"
              payload: { source_name: "Private Foundation A", source_type: "CASH_PRIVATE", amount_cents: 20000001, committed_on: "2026-08-15T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /cdfi/award-applications/${award_id}/matching-fund-commitments"
              payload: { source_name: "Donated Servicing Platform", source_type: "IN_KIND", amount_cents: 15000001, committed_on: "2026-08-15T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { c2_id: $.data.id }
            - call: "POST /cdfi/award-applications/${award_id}/matching-fund-commitments"
              payload: { source_name: "Deferred Bank Pledge", source_type: "DEFERRED_PLEDGE", amount_cents: 10000001, committed_on: "2026-08-15T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { c3_id: $.data.id }
            - call: "POST /cdfi/award-applications/${award_id}/matching-fund-commitments"
              payload: { source_name: "Donated Office Space", source_type: "IN_KIND", amount_cents: 30000003, committed_on: "2026-08-15T00:00:00Z" }
              as: AwardAdministrator
              as_user_id: "adm-1"
              captures: { c4_id: $.data.id }
          trigger:
            - call: "POST /cdfi/matching-fund-commitments/${c1_id}/verify"
              payload: {}
              as: AwardAdministrator
              as_user_id: "adm-2"
            - call: "POST /cdfi/matching-fund-commitments/${c2_id}/verify"
              payload: {}
              as: AwardAdministrator
              as_user_id: "adm-2"
            - call: "POST /cdfi/matching-fund-commitments/${c3_id}/verify"
              payload: {}
              as: AwardAdministrator
              as_user_id: "adm-2"
            - call: "POST /cdfi/matching-fund-commitments/${c4_id}/verify"
              payload: {}
              as: AwardAdministrator
              as_user_id: "adm-2"
          assert:
            - "AwardApplication.${award_id}.required_match_cents == 50000005"
            - "MatchingFundCommitment.${c1_id}.eligible_cents == 20000001"
            - "MatchingFundCommitment.${c2_id}.eligible_cents == 7500001"
            - "MatchingFundCommitment.${c3_id}.eligible_cents == 7500001"
            - "MatchingFundCommitment.${c4_id}.eligible_cents == 15000002"
            - "AwardApplication.${award_id}.match_eligible_cents == 50000005"
            - "AwardApplication.${award_id}.match_shortfall_cents == 0"
      - name: loan_pricing_pinned_order_freezes_dti_before_spread
        grounds:
          - calculations.loan_pricing_and_grade
          - entities.Loan.fields.provisional_monthly_payment_cents
          - entities.Loan.fields.dti_pct
          - entities.Loan.fields.risk_grade
          - entities.Loan.fields.risk_spread_bps
          - entities.Loan.fields.final_rate_bps
          - entities.Loan.fields.monthly_payment_cents
          - state_machines.Loan.SCREENING_to_UNDERWRITING
        distinguishing_aspect: |
          This instance is the circular-dependency form: rate depends on spread depends on
          grade depends on DTI depends on payment depends on rate, and the pinned order
          freezes dti_pct at 42.91 from the PROVISIONAL payment, landing grade B; a
          fixed-point implementation would recompute 43.38 from the final rate and land grade
          C with final_rate_bps 1050. Rounding order is irrelevant here, which is exactly what
          the other combinatorial instance turns on.
        test_recipe:
          setup:
            - "One institution with a product priced at 900 bps over 60 months, max_dti_pct 45.00 and min_credit_score 580, so both grade B and grade C are admissible outcomes."
            - "A GEOCODED borrower with credit_score 690 and ta_hours_total 0.00, so the TA discount is not in play."
            - "One SCREENING loan for 3,000,000 cents whose provisional payment is 72,500 cents and whose payment at the grade-B rate would be 74,375 cents."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CreditUnderwriter
              as_user_id: "uw-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Delta Community Capital Fund", ein: "110000004", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Working Capital Ladder", base_rate_bps: 900, term_months: 60, max_dti_pct: 45.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: false, product_cap_cents: 100000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Alma Reyes", street_address: "9 Melrose Avenue", postal_code: "10456", household_income_cents: 4824000, area_median_income_cents: 7000000, credit_score: 690 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b1_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36005010100" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 3000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /cdfi/loans/${loan_id}/underwrite"
              payload: { verified_monthly_income_cents: 402000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 690 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
          assert:
            - "Loan.${loan_id}.underwriting_state == UNDERWRITING"
            - "Loan.${loan_id}.provisional_monthly_payment_cents == 72500"
            - "Loan.${loan_id}.dti_pct == 42.91"
            - "Loan.${loan_id}.risk_grade == B"
            - "Loan.${loan_id}.risk_spread_bps == 75"
            - "Loan.${loan_id}.ta_discount_bps == 0"
            - "Loan.${loan_id}.final_rate_bps == 975"
            - "Loan.${loan_id}.monthly_payment_cents == 74375"
  - rule_id: non_linear_state_machine
    instances:
      - name: certification_review_cycle_exhausts_at_second_revision
        grounds:
          - state_machines.CertificationApplication.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.CertificationApplication.INFO_REQUESTED_to_UNDER_REVIEW
          - state_machines.CertificationApplication.INFO_REQUESTED_to_DENIED
          - entities.CertificationApplication.fields.revision_round
          - concurrency_rules[application-create-stale-institution]
