              payload: { entry_verdicts: [ { entry_id: "${en}", verdict: "REJECTED", reason: "Provider could not produce rosters" }, { entry_id: "${el}", verdict: "VERIFIED" }, { entry_id: "${ei}", verdict: "VERIFIED" } ] }
              as: RegistryAdmin
              captures: { st_post: $.data.status, rn: $.data.national_credited_hours, rl: $.data.local_credited_hours, ri: $.data.individual_credited_hours, rt: $.data.total_credited_hours }
          assert:
            - "Submit: status == AUDIT_PENDING with audit_selected == true (SINGLE_PROVIDER_CONCENTRATION: MegaCE 20 >= 20) and total_credited_hours == 40 over RECORDED entries"
            - "After audit-outcome: status == AUDIT_FAILED (national_credited 0 < 20 over VERIFIED entries)"
            - "national_credited_hours == 0, local_credited_hours == 10, individual_credited_hours == 10, total_credited_hours == 20"
            - "Invariant: the recorded-then-rejected 20-hour entry leaves the credited total identical to a portfolio that never contained it (20 == LOCAL 10 + INDIVIDUAL 10; certification NOT extended)"
