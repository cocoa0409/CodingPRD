          - validations[priority=19]
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.ContactAttempt.fields.attempted_at
        distinguishing_aspect: |
          Interval semantics here are POINT OCCUPANCY with a forward cooldown
          measured on the CareEpisode outreach resource, and the boundary is
