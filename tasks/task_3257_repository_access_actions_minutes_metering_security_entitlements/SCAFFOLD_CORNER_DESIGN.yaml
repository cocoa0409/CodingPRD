        grounds:
          - "endpoints.GET /repositories/{id}/workflow-runs"
          - response_envelope.pagination_fields
        distinguishing_aspect: "List endpoint returns the fixed envelope: meta.api_request_id present, response_type=array, data items paginated with limit/offset/total_count/has_more; limit default 10, min 1, max 100."
        test_recipe:
          setup: ["Enterprise + TEAM Organization + Repository with 2 dispatched runs"]
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
