          - concurrency_rules[cert-supersede-stale-account]
          - validations[priority=6]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Both OCC rules guard writes that are legitimate as state transitions — a fresh round may supersede the previous prices, a fresh certificate may supersede the prior verified one — so only the version tells them apart: the replayed expected_*_version is ERR_STALE_VERSION 412 with round_count and the certificate list unchanged, and the same body with the re-read version succeeds."
