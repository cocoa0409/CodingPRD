  - rule_id: transitive_cascade
    instances:
      - name: repair_complete_cascade_depth3
        grounds:
          - state_machines.WorkOrder.ON_SITE_to_REPAIR_COMPLETE
          - state_machines.BreakReport.IN_REPAIR_to_REPAIRED
          - state_machines.IsolationEvent.EXECUTED_to_RESTORED
          - state_machines.Valve.CLOSED_to_OPEN
        distinguishing_aspect: |
          Trigger = work-order completion; chain depth 3+: WorkOrder REPAIR_COMPLETE
          mutates BreakReport (-> REPAIRED), that mutation restores the
          IsolationEvent (valves OPEN, customers_out_of_service 0), and that in turn
          spawns the PENDING RestorationJob while the auto-issued advisory's
          sampling window opens.
        test_recipe:
          setup:
            - "Segment MAIN-8-CEDAR diameter 8; valves Z1/300 + Z2/250 (extent 550 >= 500)"
            - "Break confirmed, isolation executed (auto-advisory ISSUED), crew dispatched and on site"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-CEDAR", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1970 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-CED-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 300 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-CED-2", pipe_segment_id: "${seg}", coverage_zone: "Z2", customers_served: 250 }
              as: PublicWorksEngineer
              captures: { v2: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "5 Cedar Rd", source: SENSOR_SCADA }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: HIGH }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}", "${v2}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /crews"
              payload: { crew_name: "Crew Cedar", crew_size: 4, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
          trigger:
            - call: "POST /work-orders/${wo}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "GET /break-reports/${br}"
              as: Dispatcher
              captures: { st: $.data.break_status, oos: $.data.customers_out_of_service, rep: $.data.total_repair_cost_cents }
            - call: "GET /break-reports/${br}/isolation-events"
              as: Dispatcher
              captures: { iso_st: "$.data[0].isolation_status" }
            - call: "GET /pipe-segments/${seg}/valves"
              as: Dispatcher
              captures: { vv1: "$.data[0].valve_status", vv2: "$.data[1].valve_status" }
            - call: "GET /restoration-jobs?work_order_id=${wo}"
              as: Dispatcher
              captures: { rj_st: "$.data[0].restoration_status", rj: "$.data[0].id" }
            - call: "GET /break-reports/${br}/advisories"
              as: Dispatcher
              captures: { adv_st: "$.data[0].advisory_status" }
          assert:
            - "WorkOrder.${wo}.work_status == REPAIR_COMPLETE (link 0)"
            - "BreakReport.${br}.break_status == REPAIRED (link 1) and customers_out_of_service == 0"
            - "BreakReport.${br}.total_repair_cost_cents == 6000"
            - "IsolationEvent.${iso}.isolation_status == RESTORED (link 2) and both valves are OPEN"
            - "RestorationJob.${rj}.restoration_status == PENDING (link 3: auto-created by the repair completion)"
            - "BoilWaterAdvisory for the break remains ISSUED (sampling may now begin; repair does not auto-lift)"

      - name: isolation_execute_cascade_depth3
        grounds:
          - state_machines.IsolationEvent.PLANNED_to_EXECUTED
          - state_machines.Valve.OPEN_to_CLOSED
          - state_machines.BreakReport.CONFIRMED_to_ISOLATED
          - calculations.advisory_auto_issue
        distinguishing_aspect: |
          Different triggering transition from the repair-completion cascade:
          executing an isolation plan closes valves (link 1), the closures move the
          break to ISOLATED with the zone-deduped outage extent (link 2), and
          crossing the 500-customer threshold auto-issues a boil-water advisory
          (link 3).
        test_recipe:
          setup:
            - "Segment MAIN-8-CEDAR diameter 8; valves Z1/300 + Z2/250"
            - "Break confirmed CIRCUMFERENTIAL; isolation plan created for both valves"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-CEDAR", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1970 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-CED-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 300 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-CED-2", pipe_segment_id: "${seg}", coverage_zone: "Z2", customers_served: 250 }
              as: PublicWorksEngineer
              captures: { v2: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "5 Cedar Rd", source: SENSOR_SCADA }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: HIGH }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}", "${v2}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
          trigger:
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
              captures: { extent: $.data.outage_extent_customers }
            - call: "GET /break-reports/${br}"
              as: Dispatcher
              captures: { st: $.data.break_status, oos: $.data.customers_out_of_service }
            - call: "GET /pipe-segments/${seg}/valves"
              as: Dispatcher
              captures: { vv1: "$.data[0].valve_status", vv2: "$.data[1].valve_status" }
            - call: "GET /break-reports/${br}/advisories"
              as: Dispatcher
              captures: { adv_st: "$.data[0].advisory_status", adv_reason: "$.data[0].issue_reason", adv_by: "$.data[0].issued_by_user_id" }
          assert:
            - "IsolationEvent.${iso}.outage_extent_customers == 550  # 300 + 250 across distinct zones"
            - "Both valves CLOSED (link 1)"
            - "BreakReport.${br}.break_status == ISOLATED and customers_out_of_service == 550 (link 2)"
            - "One advisory exists: advisory_status ISSUED, issue_reason AUTO_OUTAGE_THRESHOLD, issued_by_user_id == \"system\" (link 3)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lift_conflict_state_beats_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.BoilWaterAdvisory.ISSUED_to_LIFTED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: lifting an advisory that is
          already LIFTED by the same officer who issued it violates BOTH the state
          precondition (not ISSUED) and the segregation-of-duties safety rule; the
          state-tier error ERR_INVALID_STATE must win over ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Break confirmed on segment MAIN-8-WILLOW (no isolation needed for a manual advisory)"
            - "Advisory issued by officer wq_officer_1; two PASS tests recorded; lifted by officer wq_officer_2"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-WILLOW", material: PVC, diameter_inches: 8, install_year: 1990 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "15 Willow Way", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: LOW }
              as: Dispatcher
            - call: "POST /boil-water-advisories"
              payload: { break_report_id: "${br}" }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
              captures: { adv: $.data.id }
            - call: "POST /water-quality-tests"
              payload: { advisory_id: "${adv}", sampled_at: "2026-08-02T00:00:00Z", chlorine_residual_mg_l: 0.30, coliform_result: PASS }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
            - call: "POST /water-quality-tests"
              payload: { advisory_id: "${adv}", sampled_at: "2026-08-03T00:00:00Z", chlorine_residual_mg_l: 0.25, coliform_result: PASS }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
            - call: "POST /boil-water-advisories/${adv}/lift"
              as: WaterQualityOfficer
              as_user_id: "wq_officer_2"
          trigger:
            - call: "POST /boil-water-advisories/${adv}/lift"
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
              captures: { err: $.data.error_id }
          assert:
            - "Second lift is rejected with error_id ERR_INVALID_STATE (http 409), NOT ERR_SEGREGATION_OF_DUTIES, even though wq_officer_1 is also the issuer"

      - name: schedule_conflict_referential_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.RestorationJob.PENDING_to_SCHEDULED
