            - "After approval, issue-equity succeeds and university_equity_bp == 500"
            - "Startup.${su_id}.status == EQUITY_ISSUED"
      - name: finalize_requires_all_entries_confirmed
        grounds:
          - state_machines.InventionDisclosure.INVENTORSHIP_REVIEW_to_INVENTORSHIP_CONFIRMED
          - errors[ERR_INVENTORSHIP_NOT_FINALIZABLE]
        distinguishing_aspect: |
          Pair DisclosureInventor -> InventionDisclosure (different pair than
          report->patent and plan->startup): finalize is rejected while any
          roster entry is still PENDING, even though the disclosure itself is
          in the correct state.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure INVENTORSHIP_REVIEW with entries e1 (CONFIRMED) and e2 (PENDING)"
          setup_api_calls:
