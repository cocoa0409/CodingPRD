# =============================================================================
# SCAFFOLD — Charity Specialty Pediatric Hospital Admission Without Family Billing
# (Shriners Children's style)
#
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Charity Specialty Pediatric Hospital Admission Without Family Billing
  (Shriners Children's): patient application review by condition category
  against the hospital's specialty scope, acceptance decisions made without
  regard to family ability to pay and with no family billing, insurance billing
  where coverage exists with no balance billing to the family, referral intake
  from community physicians, outreach clinics and international partners,
  travel and lodging support coordination for families with distance criteria,
  care continuity through growth for orthopedic and burn patients requiring
  staged procedures over years, philanthropic funding allocation across
  hospitals and specialty programs, outreach clinic scheduling in remote
  locations with follow-up conversion.

domain_name: charity-pediatric-admission
api_prefix: /charity-care

complexity_profile:
  primary_archetype: multi_party_negotiation   # intake -> committee review rounds -> decision
  secondary_archetype: quota_allocation        # philanthropic fund pool allocated across hospitals/programs
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: hybrid          # HospitalNetwork tree + flat patient/application/funding references
  state_machine_shape: compound    # Application branching-with-cycle; CarePlan parallel dims; StagedProcedure cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many                # Application <-> OutreachScreening conversions, Program <-> Hospital scope
    - cross_aggregate             # BillingAccount references Application across aggregates
  role_model: segregation_of_duties  # committee reviewer who requested info cannot cast the deciding vote
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: SpecialtyHospital
    parent: null
    common_fields: true
    fields:
      - { name: hospital_code, type: string, source: input, description: "Unique hospital code, e.g. SHC-PDX" }
      - { name: name, type: string, source: input, description: "Hospital name" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "2-letter US state or 2-letter ISO country code for international sites" }
      - { name: latitude, type: number, source: input, description: "Facility latitude, decimal degrees, -90..90" }
      - { name: longitude, type: number, source: input, description: "Facility longitude, decimal degrees, -180..180" }
      - { name: annual_capacity, type: integer, source: input, description: "Max new admissions accepted per calendar year, >= 1" }
      - { name: admissions_ytd, type: integer, source: computed, description: "Count of Applications transitioned to ACCEPTED in the current calendar year (logical clock); resets at year boundary; initial 0" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED | CLOSED; initial OPEN" }

  - name: SpecialtyProgram
    parent: SpecialtyHospital
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> SpecialtyHospital.id" }
      - { name: category, type: enum, source: input, description: "ORTHOPEDIC | BURN | CLEFT_CRANIOFACIAL | SPINAL_CORD | NEUROMUSCULAR" }
      - { name: accepts_international, type: boolean, source: input, default: false, description: "Whether this program accepts international referrals" }
      - { name: min_age_months, type: integer, source: input, description: "Minimum patient age in whole months at application submission, >= 0" }
      - { name: max_age_months, type: integer, source: input, description: "Maximum patient age in whole months at application submission; patient must be strictly younger than max_age_months (age < max_age_months); must be > min_age_months" }
      - { name: staged_care_required, type: boolean, source: input, default: false, description: "ORTHOPEDIC and BURN programs require a CarePlan on acceptance" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE" }

  - name: ReferralSource
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: input, description: "COMMUNITY_PHYSICIAN | OUTREACH_CLINIC | INTERNATIONAL_PARTNER" }
      - { name: display_name, type: string, source: input, description: "Physician name, clinic name, or partner organization name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: country_code, type: string, source: input, description: "2-letter ISO country code of the source" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE" }

  - name: PatientApplication
    parent: null
    common_fields: true
    fields:
      - { name: patient_full_name, type: string, source: input, description: "Patient legal name" }
      - { name: patient_date_of_birth, type: datetime, source: input, description: "Patient DOB (date at 00:00:00Z); used for age-in-months against the logical clock" }
      - { name: condition_category, type: enum, source: input, description: "ORTHOPEDIC | BURN | CLEFT_CRANIOFACIAL | SPINAL_CORD | NEUROMUSCULAR | OTHER" }
      - { name: referral_source_id, type: string, source: input, description: "FK -> ReferralSource.id" }
      - { name: program_id, type: string, source: input, description: "FK -> SpecialtyProgram.id — the program applied to" }
      - { name: screening_id, type: string, source: input, description: "Optional FK -> OutreachScreening.id when the application converts from an outreach screening; null otherwise", default: null }
      - { name: home_latitude, type: number, source: input, description: "Family home latitude, decimal degrees" }
      - { name: home_longitude, type: number, source: input, description: "Family home longitude, decimal degrees" }
      - { name: is_international, type: boolean, source: computed, description: "True when referral_source.country_code != 'US'; derived at creation, immutable thereafter" }
      - { name: family_ability_to_pay, type: enum, source: input, description: "UNABLE | PARTIAL | ABLE | DECLINED_TO_STATE — recorded for statistical purposes ONLY and MUST NOT influence acceptance (see no-means-test rule)", default: "DECLINED_TO_STATE" }
      - { name: review_round, type: integer, source: system, description: "Current committee review round number; starts at 1; increments each time the application returns from INFO_REQUESTED to PENDING_REVIEW" }
      - { name: info_requested_by, type: string, source: system, description: "X-User-ID of the ReviewCommitteeMember who most recently requested information; that member is barred from the deciding vote on this round (segregation of duties); null when not in an info-request cycle" }
      - { name: decision_reason, type: string, source: system, description: "Free-text rationale recorded at ACCEPTED or DENIED; null until decided" }
      - { name: age_at_submission_months, type: integer, source: computed, description: "Floor of (submission date - DOB) in whole months, computed at creation against the logical clock" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> PENDING_REVIEW -> INFO_REQUESTED -> PENDING_REVIEW (cycle) -> ACCEPTED | DENIED | WITHDRAWN; also SUBMITTED -> WITHDRAWN" }

  - name: ApplicationReview
    parent: PatientApplication
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PatientApplication.id" }
      - { name: round_number, type: integer, source: system, description: "Review round this event belongs to (copied from application.review_round at event time)" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the acting ReviewCommitteeMember" }
      - { name: action, type: enum, source: system, description: "OPEN_ROUND | REQUEST_INFO | CAST_VOTE_ACCEPT | CAST_VOTE_DENY | RESUBMIT_INFO" }
      - { name: vote_weight, type: integer, source: input, description: "For CAST_VOTE_* actions: 1 for a regular member, 2 for the committee chair; ignored otherwise", default: 1 }

  - name: InsurancePolicy
    parent: PatientApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PatientApplication.id" }
      - { name: payer_name, type: string, source: input, description: "Insurance payer name" }
      - { name: policy_number, type: string, source: input, description: "Policy/member number" }
      - { name: coverage_exists, type: boolean, source: input, description: "Whether any third-party coverage exists for this patient; when false the policy is informational only and no claims may be filed" }
      - { name: status, type: enum, source: system, description: "VERIFIED | LAPSED; initial VERIFIED" }

  - name: BillingAccount
    parent: PatientApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PatientApplication.id; exactly one account per ACCEPTED application, created automatically on acceptance" }
      - { name: insurance_policy_id, type: string, source: system, description: "FK -> InsurancePolicy.id of the policy billed; null when the patient is uninsured" }
      - { name: total_charged_cents, type: integer, source: computed, description: "Sum of all posted charge lines in whole cents; initial 0" }
      - { name: insurance_paid_cents, type: integer, source: computed, description: "Sum of adjudicated remittance amounts in whole cents; initial 0" }
      - { name: charity_writeoff_cents, type: integer, source: computed, description: "Sum of write-off lines in whole cents; initial 0" }
      - { name: family_balance_cents, type: integer, source: computed, description: "INVARIANT: always == 0. total_charged_cents - insurance_paid_cents - charity_writeoff_cents - open_claim_cents; the family is never billed" }
      - { name: open_claim_cents, type: integer, source: computed, description: "Cents currently inside a SUBMITTED (not yet adjudicated) Claim; initial 0" }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED; initial OPEN" }

  - name: Claim
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: service_date, type: datetime, source: input, description: "Date of service" }
      - { name: lines, type: array, source: input, description: "Array of { cpt_code: string, charge_cents: integer >= 1 }; at least one line" }
      - { name: submitted_amount_cents, type: integer, source: computed, description: "Sum of line charge_cents (integer arithmetic, no rounding needed)" }
      - { name: estimated_allowed_cents, type: integer, source: computed, description: "Provisional allowed amount: per-line estimated rate applied per line and rounded per line to whole cents (round_half_up), then summed — the PROVISIONAL variant" }
      - { name: adjudicated_amount_cents, type: integer, source: computed, description: "Final allowed amount: line charges summed first, payer contract rate applied once to the total, then rounded once to whole cents (round_half_up) — the FINAL variant; null until adjudication", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> ADJUDICATED | DENIED_CLAIM; initial SUBMITTED" }

  - name: CarePlan
    parent: PatientApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PatientApplication.id; exactly one per accepted application whose program has staged_care_required = true" }
      - { name: diagnosis_summary, type: string, source: input, description: "Clinical summary" }
      - { name: clinical_status, type: enum, source: system, description: "PLANNING | ACTIVE_TREATMENT | SURVEILLANCE | DISCHARGED — parallel dimension 1" }
      - { name: funding_status, type: enum, source: system, description: "UNFUNDED | PARTIALLY_FUNDED | FULLY_FUNDED — parallel dimension 2, derived from FundAllocations linked to this plan" }
      - { name: planned_stage_count, type: integer, source: input, description: "Total number of planned stages, >= 1" }
      - { name: completed_stage_count, type: integer, source: computed, description: "Count of StagedProcedures in COMPLETED state; initial 0" }

  - name: StagedProcedure
    parent: CarePlan
    common_fields: true
    fields:
      - { name: care_plan_id, type: string, source: system, description: "FK -> CarePlan.id" }
      - { name: stage_index, type: integer, source: input, description: "1-based stage number; must be unique within the care plan and <= care_plan.planned_stage_count" }
      - { name: min_age_months, type: integer, source: input, description: "Patient must be >= this many months old at scheduled_date (inclusive)" }
      - { name: max_age_months, type: integer, source: input, description: "Patient must be < this many months old at scheduled_date (exclusive upper bound); must be > min_age_months" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned procedure date (00:00:00Z)" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated cost in whole cents, >= 1" }
      - { name: status, type: enum, source: system, description: "PLANNED -> SCHEDULED -> COMPLETED | DEFERRED; DEFERRED -> PLANNED (reschedule cycle); PLANNED -> CANCELLED_STAGE" }

  - name: TravelSupportGrant
    parent: PatientApplication
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PatientApplication.id (must be ACCEPTED)" }
      - { name: grant_type, type: enum, source: input, description: "TRAVEL | LODGING | TRAVEL_AND_LODGING" }
      - { name: straight_line_distance_miles, type: number, source: computed, description: "Haversine distance between (home_latitude, home_longitude) and the hospital of the application's program; PROVISIONAL distance variant" }
      - { name: road_distance_miles, type: number, source: computed, description: "Road-network distance = straight_line_distance_miles * ROAD_CIRCUITY_FACTOR (1.3), rounded to 1 decimal round_half_up; FINAL eligibility distance variant" }
      - { name: distance_eligible, type: boolean, source: computed, description: "true iff road_distance_miles >= DISTANCE_THRESHOLD_MILES (100.0); boundary: exactly 100.0 IS eligible (>=)" }
      - { name: nightly_lodging_stipend_cents, type: integer, source: computed, description: "Tiered: 0 when not distance_eligible; LODGING_TIER1_CENTS (15000) when 100.0 <= road < 300.0; LODGING_TIER2_CENTS (22500) when road >= 300.0; only for grant_type LODGING or TRAVEL_AND_LODGING, else 0" }
      - { name: travel_allowance_cents, type: integer, source: computed, description: "TRAVEL_PER_MILE_CENTS (58) * round(road_distance_miles) for grant_type TRAVEL or TRAVEL_AND_LODGING, capped at TRAVEL_CAP_CENTS (100000); 0 when not distance_eligible or grant_type LODGING" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | REVOKED; initial ACTIVE" }

  - name: OutreachClinic
    parent: SpecialtyHospital
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> SpecialtyHospital.id of the sponsoring hospital" }
      - { name: location_name, type: string, source: input, description: "Remote location name" }
      - { name: latitude, type: number, source: input, description: "Clinic latitude" }
      - { name: longitude, type: number, source: input, description: "Clinic longitude" }
      - { name: start_date, type: datetime, source: input, description: "Clinic start date (00:00:00Z)" }
      - { name: end_date, type: datetime, source: input, description: "Clinic end date (00:00:00Z), must be >= start_date; the clinic occupies the CLOSED interval [start_date, end_date]" }
      - { name: screening_capacity, type: integer, source: input, description: "Maximum OutreachScreenings bookable across the whole clinic, >= 1" }
      - { name: booked_screening_count, type: integer, source: computed, description: "Count of screenings in BOOKED or COMPLETED status; initial 0" }
      - { name: conversion_deadline, type: datetime, source: computed, description: "end_date + CONVERSION_WINDOW_DAYS (90) days; screenings not converted by this date auto-expire at the next clock touch" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> CONFIRMED -> IN_PROGRESS -> COMPLETED | CANCELLED_CLINIC" }

  - name: OutreachScreening
    parent: OutreachClinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> OutreachClinic.id" }
      - { name: patient_full_name, type: string, source: input, description: "Screened patient name" }
      - { name: patient_date_of_birth, type: datetime, source: input, description: "Patient DOB" }
      - { name: suspected_condition_category, type: enum, source: input, description: "ORTHOPEDIC | BURN | CLEFT_CRANIOFACIAL | SPINAL_CORD | NEUROMUSCULAR | OTHER" }
      - { name: screening_date, type: datetime, source: input, description: "Screening date; must fall within the clinic's closed interval [start_date, end_date]" }
      - { name: converted_application_id, type: string, source: system, description: "FK -> PatientApplication.id created on conversion; null until converted" }
      - { name: status, type: enum, source: system, description: "BOOKED -> COMPLETED -> CONVERTED | EXPIRED; BOOKED -> NO_SHOW; NO_SHOW -> BOOKED (rebook cycle)" }

  - name: PhilanthropicFund
    parent: null
    common_fields: true
    fields:
      - { name: fund_name, type: string, source: input, description: "Fund name" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the fund covers, e.g. 2026" }
      - { name: total_committed_cents, type: integer, source: input, description: "Total committed gifts in whole cents, >= 0" }
      - { name: allocated_cents, type: integer, source: computed, description: "Sum of FundAllocations in COMMITTED status; initial 0; INVARIANT: allocated_cents + available_cents == total_committed_cents at all times" }
      - { name: available_cents, type: integer, source: computed, description: "total_committed_cents - allocated_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | CLOSED; initial OPEN" }

  - name: FundAllocation
    parent: PhilanthropicFund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> PhilanthropicFund.id" }
      - { name: hospital_id, type: string, source: input, description: "FK -> SpecialtyHospital.id receiving the allocation" }
      - { name: program_id, type: string, source: input, description: "Optional FK -> SpecialtyProgram.id restricting the allocation; null = hospital-general", default: null }
      - { name: care_plan_id, type: string, source: input, description: "Optional FK -> CarePlan.id for patient-designated grants; null otherwise", default: null }
      - { name: amount_cents, type: integer, source: input, description: "Allocation amount in whole cents, >= 1" }
      - { name: allocation_weight, type: number, source: computed, description: "Computed at commit: see allocation_weight calculation; used by the waterfall split" }
      - { name: status, type: enum, source: system, description: "PLEDGED -> COMMITTED -> RELEASED; PLEDGED -> WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SpecialtyHospital
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /charity-care/hospitals/{hospitalId}/suspend"
        actor: NetworkAdmin
        preconditions:
          - "hospital.status == OPEN"
        side_effects:
          - "All ACTIVE SpecialtyPrograms of the hospital -> SUSPENDED"
          - "All PROPOSED OutreachClinics of the hospital -> CANCELLED_CLINIC, which cascades: each of their BOOKED screenings -> EXPIRED"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /charity-care/hospitals/{hospitalId}/reopen"
        actor: NetworkAdmin
        preconditions:
          - "hospital.status == SUSPENDED"
        side_effects:
          - "Programs remain SUSPENDED (must be reactivated individually — no auto-restore)"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /charity-care/hospitals/{hospitalId}/close"
        actor: NetworkAdmin
        preconditions:
          - "hospital.status == SUSPENDED"
          - "No PatientApplication in a non-terminal state (SUBMITTED, PENDING_REVIEW, INFO_REQUESTED) references any program of this hospital (ERR_HOSPITAL_HAS_OPEN_APPLICATIONS)"
        side_effects:
          - "All SUSPENDED programs remain SUSPENDED (terminal hospital keeps program rows queryable)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /charity-care/hospitals/{hospitalId}/close"
        actor: NetworkAdmin
        preconditions:
          - "hospital.status == OPEN"
          - "No PatientApplication in a non-terminal state references any program of this hospital"
        side_effects:
          - "All ACTIVE programs -> SUSPENDED"

  - entity: SpecialtyProgram
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /charity-care/programs/{programId}/suspend OR cascade from hospital suspend"
        actor: NetworkAdmin | system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /charity-care/programs/{programId}/reactivate"
        actor: NetworkAdmin
        preconditions:
          - "Parent hospital.status == OPEN (ERR_HOSPITAL_NOT_OPEN)"
        side_effects: []

  - entity: PatientApplication
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: PENDING_REVIEW
        trigger: "POST /charity-care/applications/{applicationId}/open-review"
        actor: ReviewCommitteeMember
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "Append ApplicationReview { action: OPEN_ROUND, round_number: 1 }"
      - from: PENDING_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /charity-care/applications/{applicationId}/request-info"
        actor: ReviewCommitteeMember
        preconditions:
          - "application.status == PENDING_REVIEW"
        side_effects:
          - "application.info_requested_by := acting X-User-ID"
          - "Append ApplicationReview { action: REQUEST_INFO }"
      - from: INFO_REQUESTED
        to: PENDING_REVIEW
        trigger: "POST /charity-care/applications/{applicationId}/resubmit-info"
        actor: IntakeCoordinator
        preconditions:
          - "application.status == INFO_REQUESTED"
        side_effects:
          - "application.review_round += 1"
          - "Append ApplicationReview { action: RESUBMIT_INFO, round_number: new round }"
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /charity-care/applications/{applicationId}/decide  (decision=ACCEPT)"
        actor: ReviewCommitteeMember
        preconditions:
          - "application.status == PENDING_REVIEW"
          - "acting member's X-User-ID != application.info_requested_by on the current round (segregation of duties; ERR_REVIEWER_CONFLICT)"
          - "Weighted quorum on the current round: sum of vote_weight over CAST_VOTE_ACCEPT events this round >= ACCEPT_QUORUM_WEIGHT (3) AND sum of CAST_VOTE_DENY weight this round == 0"
          - "Hospital of the applied program has admissions_ytd < annual_capacity (capacity check — ERR_HOSPITAL_CAPACITY_REACHED)"
          - "Program is ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "family_ability_to_pay MUST NOT be consulted (acceptance blind to means)"
        side_effects:
          - "Append ApplicationReview { action: CAST_VOTE_ACCEPT } (the deciding vote)"
          - "Hospital.admissions_ytd += 1"
          - "Create BillingAccount for the application (status OPEN, all balances 0); if an InsurancePolicy with coverage_exists=true exists, link it as insurance_policy_id"
          - "If program.staged_care_required: create CarePlan (clinical_status PLANNING, funding_status UNFUNDED) — this CarePlan creation then triggers funding_status recompute (UNFUNDED stays UNFUNDED until allocations land)"
          - "If application.screening_id is set: the linked OutreachScreening -> CONVERTED with converted_application_id set; that conversion then recomputes the clinic's conversion bookkeeping"
      - from: PENDING_REVIEW
        to: DENIED
        trigger: "POST /charity-care/applications/{applicationId}/decide  (decision=DENY)"
        actor: ReviewCommitteeMember
        preconditions:
          - "application.status == PENDING_REVIEW"
          - "acting member's X-User-ID != application.info_requested_by on the current round (ERR_REVIEWER_CONFLICT)"
          - "Weighted quorum on the current round: sum of CAST_VOTE_DENY weight >= DENY_QUORUM_WEIGHT (2) AND sum of CAST_VOTE_ACCEPT weight this round == 0"
        side_effects:
          - "Append ApplicationReview { action: CAST_VOTE_DENY } (the deciding vote)"
          - "decision_reason recorded"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /charity-care/applications/{applicationId}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "application.status == SUBMITTED"
        side_effects: []
      - from: PENDING_REVIEW
        to: WITHDRAWN
        trigger: "POST /charity-care/applications/{applicationId}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "application.status == PENDING_REVIEW"
        side_effects: []
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /charity-care/applications/{applicationId}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "application.status == INFO_REQUESTED"
        side_effects: []

  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED, DENIED_CLAIM]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /charity-care/claims/{claimId}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == SUBMITTED"
          - "billing account's insurance_policy_id is not null and policy.status == VERIFIED (ERR_NO_BILLABLE_COVERAGE)"
        side_effects:
          - "Compute adjudicated_amount_cents via the FINAL variant (sum-then-rate-then-round)"
          - "BillingAccount.open_claim_cents -= submitted_amount_cents"
          - "BillingAccount.insurance_paid_cents += adjudicated_amount_cents"
          - "BillingAccount.charity_writeoff_cents += (submitted_amount_cents - adjudicated_amount_cents)  — the remainder is ALWAYS written off to charity; family_balance_cents stays 0"
          - "BillingAccount.version += 1 (cascade)"
      - from: SUBMITTED
        to: DENIED_CLAIM
        trigger: "POST /charity-care/claims/{claimId}/deny"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "BillingAccount.open_claim_cents -= submitted_amount_cents"
          - "BillingAccount.charity_writeoff_cents += submitted_amount_cents — a denied claim is fully absorbed by charity; family_balance_cents stays 0"
          - "BillingAccount.version += 1 (cascade)"

  - entity: BillingAccount
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /charity-care/billing-accounts/{accountId}/settle"
        actor: BillingSpecialist
        preconditions:
          - "account.status == OPEN"
          - "account.open_claim_cents == 0 (ERR_OPEN_CLAIMS_EXIST)"
        side_effects:
          - "family_balance_cents MUST be 0 at settle time; the settle recomputes it and any nonzero residue is moved to charity_writeoff_cents before SETTLED is stored (no-balance-billing invariant enforcement)"

  - entity: CarePlan
    initial_state: PLANNING   # clinical_status; funding_status starts UNFUNDED
    terminal_states: [DISCHARGED]   # clinical_status terminal; funding_status has no terminal
    transitions:
      - from: PLANNING
        to: ACTIVE_TREATMENT
        trigger: "system (automatic when the first StagedProcedure transitions to SCHEDULED)"
        actor: system
        preconditions:
          - "clinical_status == PLANNING"
        side_effects: []
      - from: ACTIVE_TREATMENT
        to: SURVEILLANCE
        trigger: "system (automatic when all planned stages reach COMPLETED: completed_stage_count == planned_stage_count)"
        actor: system
        preconditions:
          - "clinical_status == ACTIVE_TREATMENT"
        side_effects: []
      - from: SURVEILLANCE
        to: DISCHARGED
        trigger: "POST /charity-care/care-plans/{carePlanId}/discharge"
        actor: CareCoordinator
        preconditions:
          - "clinical_status == SURVEILLANCE"
          - "funding_status != PARTIALLY_FUNDED (ERR_PLAN_FUNDING_UNRESOLVED) — a plan holding a partial designation cannot be discharged until its allocations resolve to COMMITTED or are WITHDRAWN"
        side_effects: []
      - from: ACTIVE_TREATMENT
        to: DISCHARGED
        trigger: "POST /charity-care/care-plans/{carePlanId}/discharge"
        actor: CareCoordinator
        preconditions:
          - "clinical_status == ACTIVE_TREATMENT"
          - "No StagedProcedure in SCHEDULED state (ERR_STAGES_IN_FLIGHT)"
          - "funding_status != PARTIALLY_FUNDED (ERR_PLAN_FUNDING_UNRESOLVED)"
        side_effects:
          - "All PLANNED StagedProcedures -> CANCELLED_STAGE"

  - entity: StagedProcedure
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED_STAGE]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /charity-care/staged-procedures/{stageId}/schedule"
        actor: CareCoordinator
        preconditions:
          - "stage.status == PLANNED"
          - "care_plan.clinical_status IN {PLANNING, ACTIVE_TREATMENT}"
          - "Age window: min_age_months <= patient_age_at(scheduled_date) < max_age_months, where patient age derives from the parent application's patient_date_of_birth (ERR_AGE_WINDOW_VIOLATION)"
          - "scheduled_date >= logical clock current date (ERR_STAGE_IN_PAST)"
          - "No other StagedProcedure of the same care plan is already SCHEDULED (one stage in flight at a time; ERR_STAGE_ALREADY_IN_FLIGHT)"
        side_effects:
          - "If care_plan.clinical_status == PLANNING: care_plan.clinical_status -> ACTIVE_TREATMENT"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /charity-care/staged-procedures/{stageId}/complete"
        actor: CareCoordinator
        preconditions:
          - "stage.status == SCHEDULED"
          - "logical clock current date >= scheduled_date (ERR_STAGE_NOT_DUE)"
        side_effects:
          - "care_plan.completed_stage_count += 1"
          - "If care_plan.completed_stage_count == care_plan.planned_stage_count: care_plan.clinical_status -> SURVEILLANCE"
      - from: SCHEDULED
        to: DEFERRED
        trigger: "POST /charity-care/staged-procedures/{stageId}/defer"
        actor: CareCoordinator
        preconditions:
          - "stage.status == SCHEDULED"
        side_effects: []
      - from: DEFERRED
        to: PLANNED
        trigger: "POST /charity-care/staged-procedures/{stageId}/replan"
        actor: CareCoordinator
        preconditions:
          - "stage.status == DEFERRED"
          - "payload.new_scheduled_date present; min_age_months <= patient_age_at(new_scheduled_date) < max_age_months still holds (ERR_AGE_WINDOW_VIOLATION)"
        side_effects:
          - "scheduled_date := new_scheduled_date"
      - from: PLANNED
        to: CANCELLED_STAGE
        trigger: "POST /charity-care/staged-procedures/{stageId}/cancel-stage OR cascade from care plan discharge"
        actor: CareCoordinator | system
        preconditions:
          - "stage.status == PLANNED"
        side_effects:
          - "care_plan.planned_stage_count -= 1 (plan contracts); if completed_stage_count == new planned_stage_count and clinical_status == ACTIVE_TREATMENT: care_plan.clinical_status -> SURVEILLANCE"

  - entity: OutreachClinic
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED_CLINIC]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /charity-care/outreach-clinics/{clinicId}/confirm"
        actor: OutreachPlanner
        preconditions:
          - "clinic.status == PROPOSED"
          - "sponsoring hospital.status == OPEN (ERR_HOSPITAL_NOT_OPEN)"
          - "Location/date conflict: no other OutreachClinic of ANY hospital in status CONFIRMED or IN_PROGRESS within LOCATION_RADIUS_MILES (25.0) haversine of this clinic's coordinates whose closed interval [start_date, end_date] overlaps this clinic's interval, counting buffer: two clinics conflict when NOT (other.end_date + BUFFER_DAYS (7) < this.start_date OR this.end_date + BUFFER_DAYS (7) < other.start_date) — i.e. intervals padded by 7 days on the end side must not interleave; PROPOSED and terminal clinics never conflict (ERR_CLINIC_LOCATION_CONFLICT)"
        side_effects: []
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "system (automatic when logical clock reaches start_date)"
        actor: system
        preconditions:
          - "clinic.status == CONFIRMED"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /charity-care/outreach-clinics/{clinicId}/complete"
        actor: OutreachPlanner
        preconditions:
          - "clinic.status == IN_PROGRESS"
          - "logical clock current date > clinic.end_date (ERR_CLINIC_STILL_RUNNING)"
        side_effects:
          - "All remaining BOOKED screenings -> NO_SHOW (they never happened)"
      - from: PROPOSED
        to: CANCELLED_CLINIC
        trigger: "POST /charity-care/outreach-clinics/{clinicId}/cancel OR cascade from hospital suspend"
        actor: OutreachPlanner | system
        preconditions:
          - "clinic.status == PROPOSED"
        side_effects:
          - "All BOOKED screenings -> EXPIRED"
      - from: CONFIRMED
        to: CANCELLED_CLINIC
        trigger: "POST /charity-care/outreach-clinics/{clinicId}/cancel"
        actor: OutreachPlanner
        preconditions:
          - "clinic.status == CONFIRMED"
        side_effects:
          - "All BOOKED screenings -> EXPIRED"

  - entity: OutreachScreening
    initial_state: BOOKED
    terminal_states: [CONVERTED, EXPIRED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /charity-care/outreach-screenings/{screeningId}/record-outcome"
        actor: OutreachPlanner
        preconditions:
          - "screening.status == BOOKED"
          - "parent clinic.status == IN_PROGRESS (ERR_CLINIC_NOT_IN_PROGRESS)"
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /charity-care/outreach-screenings/{screeningId}/mark-no-show OR cascade from clinic complete"
        actor: OutreachPlanner | system
        preconditions:
          - "screening.status == BOOKED"
        side_effects: []
      - from: NO_SHOW
        to: BOOKED
        trigger: "POST /charity-care/outreach-screenings/{screeningId}/rebook"
        actor: OutreachPlanner
        preconditions:
          - "screening.status == NO_SHOW"
          - "parent clinic.status IN {CONFIRMED, IN_PROGRESS}"
          - "clinic.booked_screening_count < clinic.screening_capacity after rebooking (capacity re-check — the NO_SHOW released its slot; ERR_CLINIC_CAPACITY_REACHED if another booking took it)"
        side_effects:
          - "screening_date := payload.new_screening_date (must fall within clinic interval)"
      - from: COMPLETED
        to: CONVERTED
        trigger: "system (automatic when a PatientApplication with screening_id == this screening is ACCEPTED)"
        actor: system
        preconditions:
          - "screening.status == COMPLETED"
          - "logical clock current date <= parent clinic.conversion_deadline (ERR_CONVERSION_WINDOW_CLOSED)"
        side_effects:
          - "converted_application_id := application.id"
      - from: BOOKED
        to: EXPIRED
        trigger: "system (cascade from clinic cancel, or clock touch past conversion_deadline)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: EXPIRED
        trigger: "system (clock touch: logical clock current date > parent clinic.conversion_deadline)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PhilanthropicFund
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /charity-care/philanthropic-funds/{fundId}/lock"
        actor: PhilanthropyOfficer
        preconditions:
          - "fund.status == OPEN"
        side_effects: []
      - from: LOCKED
        to: OPEN
        trigger: "POST /charity-care/philanthropic-funds/{fundId}/unlock"
        actor: PhilanthropyOfficer
        preconditions:
          - "fund.status == LOCKED"
        side_effects: []
      - from: LOCKED
        to: CLOSED
        trigger: "POST /charity-care/philanthropic-funds/{fundId}/close"
        actor: PhilanthropyOfficer
        preconditions:
          - "fund.status == LOCKED"
          - "No FundAllocation in PLEDGED status (ERR_PLEDGED_ALLOCATIONS_EXIST)"
        side_effects:
          - "Any COMMITTED allocations stay COMMITTED (historical); fund becomes read-only"

  - entity: FundAllocation
    initial_state: PLEDGED
    terminal_states: [RELEASED, WITHDRAWN]
    transitions:
      - from: PLEDGED
        to: COMMITTED
        trigger: "POST /charity-care/fund-allocations/{allocationId}/commit"
        actor: PhilanthropyOfficer
        preconditions:
          - "allocation.status == PLEDGED"
          - "parent fund.status == OPEN (ERR_FUND_NOT_OPEN)"
          - "fund.available_cents >= amount_cents (ERR_INSUFFICIENT_FUND_BALANCE); boundary: equality commits and leaves available_cents == 0"
        side_effects:
          - "Compute allocation_weight (see calculation) and store"
          - "fund.allocated_cents += amount_cents; fund.available_cents -= amount_cents; fund.version += 1"
          - "If care_plan_id set: the CarePlan's funding_status recomputes — FULLY_FUNDED when sum(COMMITTED designations to the plan) >= sum(estimated_cost_cents of non-terminal stages), PARTIALLY_FUNDED when > 0 but less, UNFUNDED when 0"
      - from: PLEDGED
        to: WITHDRAWN
        trigger: "POST /charity-care/fund-allocations/{allocationId}/withdraw"
        actor: PhilanthropyOfficer
        preconditions:
          - "allocation.status == PLEDGED"
        side_effects: []
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /charity-care/fund-allocations/{allocationId}/release"
        actor: PhilanthropyOfficer
        preconditions:
          - "allocation.status == COMMITTED"
          - "If care_plan_id set: the linked care plan's clinical_status must NOT be ACTIVE_TREATMENT with a SCHEDULED stage (ERR_PLAN_HAS_STAGE_IN_FLIGHT)"
        side_effects:
          - "fund.allocated_cents -= amount_cents; fund.available_cents += amount_cents; fund.version += 1"
          - "If care_plan_id set: the CarePlan's funding_status recomputes (may drop FULLY_FUNDED -> PARTIALLY_FUNDED or -> UNFUNDED)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: decide-application-stale-version
    parent_entity: PatientApplication
    write_endpoint: "POST /charity-care/applications/{applicationId}/decide"
    occ_field: expected_application_version
    description: |
      Deciding an application whose version has advanced since the committee
      member last observed it is rejected. A prior vote or resubmission on the
      same application legitimately advanced its state (review_round bump or
      quorum already reached), so the decider's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: commit-allocation-stale-fund
    parent_entity: PhilanthropicFund
    write_endpoint: "POST /charity-care/fund-allocations/{allocationId}/commit"
    occ_field: expected_fund_version
    description: |
      Committing an allocation against a fund whose version has advanced since
      the officer last read it is rejected: another commit or release has
      legitimately moved allocated_cents/available_cents, so the requester's
      balance view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_allowed_amount
    trigger: "claim creation (provisional) and claim adjudication (final)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL variant (estimated_allowed_cents, at creation):
        for each line: est_line = round_half_up(line.charge_cents * ESTIMATED_RATE)
        estimated_allowed_cents = sum(est_line)          # round PER LINE, then sum
      FINAL variant (adjudicated_amount_cents, at adjudication):
        total = sum(line.charge_cents)
        adjudicated_amount_cents = round_half_up(total * CONTRACT_RATE)   # sum, then round ONCE
      Pinned rounding order: provisional rounds per line first; final rounds once at the end.
      For >= 2 lines with charge_cents not divisible in a way that aligns the two rates,
      the two variants produce different integers.
    input_set: "claim.lines (all lines, at least one)"
    constants:
      ESTIMATED_RATE: 0.62    # per-line provisional estimation rate
      CONTRACT_RATE: 0.60     # single adjudication rate applied to the summed total
    precision: "integer cents, round_half_up; per-line then sum (provisional) vs sum then once (final)"
    variants:
      - name: provisional_per_line
        when: "claim creation"
        difference: "rounds each line at 0.62 then sums"
      - name: final_on_total
        when: "adjudication"
        difference: "sums raw charges then applies 0.60 and rounds once"

  - name: distance_eligibility
    trigger: "travel support grant creation"
    algorithm: forward_looking
    formula: |
      PROVISIONAL (straight_line_distance_miles):
        Haversine between (home_latitude, home_longitude) and the hospital's
        (latitude, longitude), earth radius 3958.8 miles, 1 decimal round_half_up.
      FINAL (road_distance_miles):
        road_distance_miles = round_half_up(straight_line_distance_miles * ROAD_CIRCUITY_FACTOR, 1)
      distance_eligible = (road_distance_miles >= DISTANCE_THRESHOLD_MILES)   # >= : exactly 100.0 eligible
      The two variants disagree for applications whose straight-line distance is in
      [76.9, 100.0) miles: ineligible on the provisional reading, eligible on the final.
    input_set: "application home coordinates; hospital coordinates of the applied program"
    constants:
      ROAD_CIRCUITY_FACTOR: 1.3
      DISTANCE_THRESHOLD_MILES: 100.0
      EARTH_RADIUS_MILES: 3958.8
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional_straight_line
        when: "display / preliminary screening"
        difference: "raw haversine; NOT used for eligibility"
      - name: final_road
        when: "eligibility decision and stipend tiering"
        difference: "circuity-adjusted; governs distance_eligible"

  - name: travel_stipend_tiering
    trigger: "travel support grant creation (after distance_eligibility)"
    algorithm: threshold
    formula: |
      if not distance_eligible: stipend = 0 and allowance = 0
      nightly_lodging_stipend_cents =
          0                              if grant_type == TRAVEL
          LODGING_TIER1_CENTS            if 100.0 <= road < 300.0 and grant_type in {LODGING, TRAVEL_AND_LODGING}
          LODGING_TIER2_CENTS            if road >= 300.0            and grant_type in {LODGING, TRAVEL_AND_LODGING}
      travel_allowance_cents =
          0                              if grant_type == LODGING or not distance_eligible
          min(TRAVEL_PER_MILE_CENTS * round(road_distance_miles), TRAVEL_CAP_CENTS)   otherwise
      Non-linear interaction across THREE inputs (grant_type, road_distance_miles, eligibility)
      with nested min() capping and tier boundaries at exactly 100.0 (inclusive) and 300.0 (inclusive lower tier boundary).
    input_set: "grant grant_type; computed road_distance_miles; computed distance_eligible"
    constants:
      LODGING_TIER1_CENTS: 15000
      LODGING_TIER2_CENTS: 22500
      TRAVEL_PER_MILE_CENTS: 58
      TRAVEL_CAP_CENTS: 100000
    precision: "integer cents"

  - name: allocation_weight
    trigger: "fund allocation commit"
    algorithm: weighted_scoring
    formula: |
      allocation_weight =
          BASE_WEIGHT (1.0)
        * (1.5 if program_id is not null else 1.0)
        * (2.0 if care_plan_id is not null else 1.0)
        * (1.25 if the receiving hospital's admissions_ytd < (annual_capacity * CAPACITY_STRAIN_FRACTION (0.5)) else 1.0)
      Circular-looking dependency pinned by evaluation order (the strain factor
      depends on the receiving hospital's admissions_ytd, which later acceptances
      will mutate; and the commit itself mutates the fund):
        (1) snapshot hospital.admissions_ytd and annual_capacity BEFORE this commit,
        (2) compute weight from the snapshot,
        (3) THEN apply fund.allocated_cents += amount_cents.
      The pinned order makes the value well-defined: the strain factor uses the
      pre-commit admissions snapshot even when other commits or acceptances have
      advanced hospital/fund state since the pledge.
    input_set: "allocation's program_id/care_plan_id presence; receiving hospital admissions_ytd and annual_capacity snapshot"
    constants:
      BASE_WEIGHT: 1.0
      CAPACITY_STRAIN_FRACTION: 0.5
    precision: "4 decimal places, round_half_up"

  - name: hospital_admissions_ytd
    trigger: "application acceptance; year boundary of the logical clock"
    algorithm: aggregation
    formula: |
      admissions_ytd = count of PatientApplications whose status == ACCEPTED
      AND whose acceptance fell in the logical clock's current calendar year,
      restricted to programs of this hospital.
      Reset: on the first clock touch at or after January 1 00:00:00Z of a new year,
      every hospital's admissions_ytd recomputes from the accepted set (not a blind zeroing —
      recompute keeps it consistent if acceptances are later inspected).
      Ordering: acceptance increments AFTER the capacity check
      (admissions_ytd < annual_capacity is evaluated on the pre-increment value).
    input_set: "ACCEPTED applications joined through SpecialtyProgram.hospital_id, current calendar year (logical clock)"
    precision: "integer count"

  - name: screening_conversion_window
    trigger: "screening conversion attempt; clock touches"
    algorithm: chronological
    formula: |
      conversion_deadline = clinic.end_date + CONVERSION_WINDOW_DAYS days.
      A COMPLETED screening may convert only while logical_clock_now <= conversion_deadline
      (inclusive: conversion exactly AT the deadline succeeds).
      On any clock touch where logical_clock_now > conversion_deadline,
      every COMPLETED screening of the clinic -> EXPIRED.
    input_set: "clinic end_date; screenings in COMPLETED status"
    constants:
      CONVERSION_WINDOW_DAYS: 90
    precision: "datetime comparison at 00:00:00Z granularity"

  - name: care_plan_funding_status
    trigger: "fund allocation commit/release/withdraw naming this care plan; stage cost changes"
    algorithm: aggregation
    formula: |
      designated = sum(amount_cents of FundAllocations in COMMITTED status with care_plan_id == plan.id)
      remaining_need = sum(estimated_cost_cents of the plan's StagedProcedures
                           whose status IN {PLANNED, SCHEDULED, DEFERRED})
      funding_status =
          UNFUNDED           if designated == 0
          FULLY_FUNDED       if designated >= remaining_need AND remaining_need > 0
          PARTIALLY_FUNDED   otherwise (designated > 0 and designated < remaining_need, OR remaining_need == 0 with designated == 0 is impossible — designated == 0 wins UNFUNDED first)
      Edge: when remaining_need == 0 (all stages terminal) and designated > 0 -> FULLY_FUNDED.
    input_set: "COMMITTED allocations for the plan; non-terminal stages (PLANNED, SCHEDULED, DEFERRED)"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-segment resource ids must exist, validated left-to-right"
    error_id: "ERR_HOSPITAL_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_CLINIC_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_BILLING_ACCOUNT_NOT_FOUND | ERR_CARE_PLAN_NOT_FOUND | ERR_STAGE_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_REFERRAL_SOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Body foreign keys must exist, in the endpoint's declared input order (referral_source_id before program_id before screening_id on application creation)"
    error_id: "ERR_REFERRAL_SOURCE_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_HOSPITAL_NOT_FOUND | ERR_CARE_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints with body FKs"

  - priority: 5
    category: state
    check: "Target resource must be in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (decide, request-info, resubmit-info, withdraw, schedule, complete, defer, replan, commit, release, adjudicate, deny, confirm, cancel, settle, discharge, ..."

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version, when the endpoint declares it, must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /charity-care/applications/{id}/decide; POST /charity-care/fund-allocations/{id}/commit"

  - priority: 7
    category: business_safety
    check: "Condition-scope match: application's condition_category must equal the applied program's category; condition_category OTHER is NEVER in scope for any program"
    error_id: ERR_CONDITION_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /charity-care/applications"

  - priority: 8
    category: business_safety
    check: "Age eligibility: program.min_age_months <= age_at_submission_months < program.max_age_months (age computed from patient_date_of_birth against the logical clock at submission; upper bound exclusive)"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /charity-care/applications"

  - priority: 9
    category: business_safety
    check: "International routing: is_international applications may only target programs with accepts_international == true"
    error_id: ERR_INTERNATIONAL_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /charity-care/applications"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the deciding member's X-User-ID must differ from application.info_requested_by on the current round"
    error_id: ERR_REVIEWER_CONFLICT
    http_status: 403
    applies_to: "POST /charity-care/applications/{id}/decide"

  - priority: 11
    category: business_constraint
    check: "Weighted quorum on the current review round: ACCEPT requires accept-weight >= 3 and deny-weight == 0; DENY requires deny-weight >= 2 and accept-weight == 0"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /charity-care/applications/{id}/decide"

  - priority: 12
    category: business_constraint
    check: "Program and hospital must be ACTIVE/OPEN for acceptance and for screening booking"
    error_id: "ERR_PROGRAM_NOT_ACTIVE | ERR_HOSPITAL_NOT_OPEN"
    http_status: 409
    applies_to: "decide(ACCEPT), screening booking, clinic confirm, program reactivate"

  - priority: 13
    category: business_temporal
    check: "Stage age window: min_age_months <= patient age at scheduled_date < max_age_months"
    error_id: ERR_AGE_WINDOW_VIOLATION
    http_status: 422
    applies_to: "stage schedule/replan"

  - priority: 14
    category: business_temporal
    check: "Clinic scheduling: screening_date inside clinic closed interval; clinic location/date padded-interval conflict; conversion within deadline"
    error_id: "ERR_SCREENING_DATE_OUTSIDE_CLINIC | ERR_CLINIC_LOCATION_CONFLICT | ERR_CONVERSION_WINDOW_CLOSED"
    http_status: 409
    applies_to: "screening create/rebook; clinic confirm; application decide(ACCEPT) with screening_id"

  - priority: 15
    category: business_fiscal
    check: "Hospital capacity: admissions_ytd < annual_capacity at acceptance (pre-increment comparison)"
    error_id: ERR_HOSPITAL_CAPACITY_REACHED
    http_status: 409
    applies_to: "POST /charity-care/applications/{id}/decide (ACCEPT)"

  - priority: 16
    category: business_fiscal
    check: "Fund balance: fund.available_cents >= allocation.amount_cents at commit; equality allowed (boundary commits to zero)"
    error_id: ERR_INSUFFICIENT_FUND_BALANCE
    http_status: 402
    applies_to: "POST /charity-care/fund-allocations/{id}/commit"

  - priority: 17
    category: business_referential
    check: "Screening conversion integrity: screening_id, when supplied, must reference a COMPLETED screening of a clinic sponsored by the SAME hospital as the applied program, and the screening's suspected_condition_category must equal the application's condition_category"
    error_id: ERR_SCREENING_MISMATCH
    http_status: 422
    applies_to: "POST /charity-care/applications"

  - priority: 18
    category: business_referential
    check: "Claim submission and adjudication require the account's insurance_policy_id to reference an InsurancePolicy with coverage_exists == true and status == VERIFIED"
    error_id: ERR_NO_BILLABLE_COVERAGE
    http_status: 409
    applies_to: "POST /charity-care/billing-accounts/{id}/claims; POST /charity-care/claims/{id}/adjudicate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/charity-care/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time before the first call. Setting the clock runs all clock-touch side effects (clinic IN_PROGRESS activation, screening expiry past conversion_deadline, admissions_ytd year-boundary recompute)."
    roles: [NetworkAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["clock-touch cascade: clinics reaching start_date -> IN_PROGRESS; COMPLETED screenings past conversion_deadline -> EXPIRED; admissions_ytd recomputed on year boundary"]

  # --- SpecialtyHospital ---
  - method: POST
    path: "/charity-care/hospitals"
    description: "Create a specialty hospital"
    roles: [NetworkAdmin]
    code: 201
    input: [hospital_code, name, city, state_code, latitude, longitude, annual_capacity]
    output: SpecialtyHospital
    side_effects: ["admissions_ytd := 0, status := OPEN"]

  - method: GET
    path: "/charity-care/hospitals"
    description: "List hospitals"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator, OutreachPlanner, PhilanthropyOfficer, ReferringPhysician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SpecialtyHospital[]"
    side_effects: []

  - method: GET
    path: "/charity-care/hospitals/{hospitalId}"
    description: "Get one hospital"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator, OutreachPlanner, PhilanthropyOfficer, ReferringPhysician]
    code: 200
    input: []
    output: SpecialtyHospital
    side_effects: []

  - method: POST
    path: "/charity-care/hospitals/{hospitalId}/suspend"
    description: "Suspend a hospital (cascades to programs and proposed clinics)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: SpecialtyHospital
    side_effects: ["programs -> SUSPENDED; PROPOSED clinics -> CANCELLED_CLINIC -> their BOOKED screenings -> EXPIRED; increments version"]

  - method: POST
    path: "/charity-care/hospitals/{hospitalId}/reopen"
    description: "Reopen a suspended hospital (programs stay suspended)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: SpecialtyHospital
    side_effects: ["increments version"]

  - method: POST
    path: "/charity-care/hospitals/{hospitalId}/close"
    description: "Close a hospital (terminal)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: SpecialtyHospital
    side_effects: ["ACTIVE programs -> SUSPENDED when closing from OPEN; increments version"]

  # --- SpecialtyProgram ---
  - method: POST
    path: "/charity-care/hospitals/{id}/programs"
    description: "Create a specialty program within a hospital"
    roles: [NetworkAdmin]
    code: 201
    input: [category, accepts_international, min_age_months, max_age_months, staged_care_required]
    output: SpecialtyProgram
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/charity-care/hospitals/{id}/programs"
    description: "List programs of a hospital"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator, OutreachPlanner, PhilanthropyOfficer, ReferringPhysician]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: "SpecialtyProgram[]"
    side_effects: []

  - method: GET
    path: "/charity-care/programs/{programId}"
    description: "Get one program"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator, OutreachPlanner, PhilanthropyOfficer, ReferringPhysician]
    code: 200
    input: []
    output: SpecialtyProgram
    side_effects: []

  - method: POST
    path: "/charity-care/programs/{programId}/suspend"
    description: "Suspend a program"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: SpecialtyProgram
    side_effects: ["increments version"]

  - method: POST
    path: "/charity-care/programs/{programId}/reactivate"
    description: "Reactivate a program (requires hospital OPEN)"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: SpecialtyProgram
    side_effects: ["increments version"]

  # --- ReferralSource ---
  - method: POST
    path: "/charity-care/referral-sources"
    description: "Register a referral source (community physician, outreach clinic, or international partner)"
    roles: [NetworkAdmin, IntakeCoordinator]
    code: 201
    input: [source_type, display_name, contact_email, country_code]
    output: ReferralSource
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/charity-care/referral-sources"
    description: "List referral sources"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator, OutreachPlanner, PhilanthropyOfficer, ReferringPhysician]
    code: 200
    input: ["source_type?", "country_code?", "status?", "limit?", "offset?"]
    output: "ReferralSource[]"
    side_effects: []

  - method: GET
    path: "/charity-care/referral-sources/{sourceId}"
    description: "Get one referral source"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator, OutreachPlanner, PhilanthropyOfficer, ReferringPhysician]
    code: 200
    input: []
    output: ReferralSource
    side_effects: []

  # --- PatientApplication ---
  - method: POST
    path: "/charity-care/applications"
    description: "Submit a patient application (intake). Validates scope, age, international routing, screening linkage; NEVER validates or records any billing/financial-means gate."
    roles: [IntakeCoordinator, ReferringPhysician]
    code: 201
    input: [patient_full_name, patient_date_of_birth, condition_category, referral_source_id, program_id, home_latitude, home_longitude, "family_ability_to_pay?", "screening_id?"]
    output: PatientApplication
    side_effects: ["age_at_submission_months and is_international computed at creation; review_round := 1; status := SUBMITTED"]

  - method: GET
    path: "/charity-care/applications"
    description: "List applications"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator, OutreachPlanner, PhilanthropyOfficer]
    code: 200
    input: ["program_id?", "referral_source_id?", "screening_id?", "status?", "condition_category?", "limit?", "offset?"]
    output: "PatientApplication[]"
    side_effects: []

  - method: GET
    path: "/charity-care/applications/{applicationId}"
    description: "Get one application"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator, OutreachPlanner, PhilanthropyOfficer]
    code: 200
    input: []
    output: PatientApplication
    side_effects: []

  - method: POST
    path: "/charity-care/applications/{applicationId}/open-review"
    description: "Open committee review round 1"
    roles: [ReviewCommitteeMember]
    code: 200
    input: []
    output: PatientApplication
    side_effects: ["append ApplicationReview OPEN_ROUND; increments version"]

  - method: POST
    path: "/charity-care/applications/{applicationId}/request-info"
    description: "Committee member requests more information (cycles the application out of review)"
    roles: [ReviewCommitteeMember]
    code: 200
    input: []
    output: PatientApplication
    side_effects: ["info_requested_by := caller X-User-ID; append ApplicationReview REQUEST_INFO; increments version"]

  - method: POST
    path: "/charity-care/applications/{applicationId}/resubmit-info"
    description: "Intake coordinator supplies requested info; round increments"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: PatientApplication
    side_effects: ["review_round += 1; append ApplicationReview RESUBMIT_INFO; increments version"]

  - method: POST
    path: "/charity-care/applications/{applicationId}/vote"
    description: "Cast a non-deciding committee vote on the current round (appends CAST_VOTE_ACCEPT or CAST_VOTE_DENY with vote_weight)"
    roles: [ReviewCommitteeMember]
    code: 200
    input: [vote, "vote_weight?"]
    output: ApplicationReview
    side_effects: ["append ApplicationReview CAST_VOTE_*; increments application version"]

  - method: POST
    path: "/charity-care/applications/{applicationId}/decide"
    description: "Render the acceptance decision (OCC-guarded). Acceptance is blind to family_ability_to_pay. On ACCEPT: admissions_ytd += 1, BillingAccount auto-created, CarePlan auto-created when the program requires staged care, linked screening converts."
    roles: [ReviewCommitteeMember]
    code: 200
    input: [decision, decision_reason, expected_application_version]
    output: PatientApplication
    side_effects: ["quorum + segregation-of-duties checks; on ACCEPT: hospital.admissions_ytd += 1, BillingAccount created, CarePlan created when staged_care_required, OutreachScreening -> CONVERTED; increments version"]

  - method: POST
    path: "/charity-care/applications/{applicationId}/withdraw"
    description: "Withdraw a non-terminal application"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: PatientApplication
    side_effects: ["increments version"]

  - method: GET
    path: "/charity-care/applications/{id}/reviews"
    description: "List the append-only ApplicationReview events of an application"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember]
    code: 200
    input: ["round_number?", "limit?", "offset?"]
    output: "ApplicationReview[]"
    side_effects: []

  # --- InsurancePolicy ---
  - method: POST
    path: "/charity-care/applications/{id}/insurance-policies"
    description: "Attach an insurance policy to an application (informational until acceptance; never gates acceptance)"
    roles: [IntakeCoordinator, BillingSpecialist]
    code: 201
    input: [payer_name, policy_number, coverage_exists]
    output: InsurancePolicy
    side_effects: ["status := VERIFIED"]

  - method: GET
    path: "/charity-care/applications/{id}/insurance-policies"
    description: "List insurance policies of an application"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, BillingSpecialist, CareCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "InsurancePolicy[]"
    side_effects: []

  - method: GET
    path: "/charity-care/insurance-policies/{policyId}"
    description: "Get one insurance policy"
    roles: [NetworkAdmin, IntakeCoordinator, BillingSpecialist, CareCoordinator]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  # --- BillingAccount / Claim ---
  - method: GET
    path: "/charity-care/applications/{id}/billing-account"
    description: "Get the billing account of an application (array of 0 or 1)"
    roles: [NetworkAdmin, BillingSpecialist, CareCoordinator]
    code: 200
    input: []
    output: "BillingAccount[]"
    side_effects: []


  - method: GET
    path: "/charity-care/billing-accounts"
    description: "List billing accounts (filtered list form for FK reverse-reachability)"
    roles: [NetworkAdmin, BillingSpecialist, CareCoordinator]
    code: 200
    input: ["application_id?", "insurance_policy_id?", "status?", "limit?", "offset?"]
    output: "BillingAccount[]"
    side_effects: []

  - method: GET
    path: "/charity-care/billing-accounts/{accountId}"
    description: "Get one billing account"
    roles: [NetworkAdmin, BillingSpecialist, CareCoordinator]
    code: 200
    input: []
    output: BillingAccount
    side_effects: []

  - method: POST
    path: "/charity-care/billing-accounts/{id}/claims"
    description: "Submit a claim with charge lines; computes the provisional per-line estimate and adds submitted_amount to open_claim_cents. Requires the account's insurance_policy_id non-null and VERIFIED."
    roles: [BillingSpecialist]
    code: 201
    input: [service_date, lines]
    output: Claim
    side_effects: ["estimated_allowed_cents computed (per-line rounding); account.open_claim_cents += submitted_amount_cents; account.version += 1"]

  - method: GET
    path: "/charity-care/billing-accounts/{id}/claims"
    description: "List claims of a billing account"
    roles: [NetworkAdmin, BillingSpecialist, CareCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/charity-care/claims/{claimId}"
    description: "Get one claim"
    roles: [NetworkAdmin, BillingSpecialist, CareCoordinator]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/charity-care/claims/{claimId}/adjudicate"
    description: "Adjudicate a claim at the payer contract rate (final variant: sum-then-round); the uncompensated remainder is written off to charity"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["adjudicated_amount_cents computed; open_claim_cents -= submitted; insurance_paid_cents += adjudicated; charity_writeoff_cents += (submitted - adjudicated); account.version += 1"]

  - method: POST
    path: "/charity-care/claims/{claimId}/deny"
    description: "Deny a claim; the full amount is absorbed by charity write-off"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["open_claim_cents -= submitted; charity_writeoff_cents += submitted; account.version += 1"]

  - method: POST
    path: "/charity-care/billing-accounts/{accountId}/settle"
    description: "Settle the account; any residual non-claim balance is swept to charity write-off so family_balance_cents is 0 at SETTLED"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillingAccount
    side_effects: ["residual sweep to charity_writeoff_cents; status := SETTLED; version += 1"]

  # --- CarePlan / StagedProcedure ---
  - method: GET
    path: "/charity-care/applications/{id}/care-plan"
    description: "Get the care plan of an application (array of 0 or 1)"
    roles: [NetworkAdmin, IntakeCoordinator, ReviewCommitteeMember, CareCoordinator, PhilanthropyOfficer]
