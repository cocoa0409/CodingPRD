          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one ACTIVE peer group PG-MED-A (MEDIUM_GROCERY, band 0..20000000, LOWEST_HALF_AVG, allowance 0.05, min_submissions_for_ceiling 3, min_stock_multiplier 1.0)"
