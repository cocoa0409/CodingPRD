  # ===========================================================================
  # §1.6 error-catalog closure: the remaining NOT_FOUND ids. The claim-extraction
  # guide's Table 6 declares no claim types of its own, so each id is closed with
  # the entities table's `not_found` row against the endpoint that reaches it.
  # ===========================================================================
  - section: entities
    instances:

      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_DEPARTMENT_NOT_FOUND]
          - errors[ERR_PRIMAL_PURCHASE_NOT_FOUND]
          - errors[ERR_CUTTING_TEST_NOT_FOUND]
          - errors[ERR_CUTTING_TEST_LINE_NOT_FOUND]
          - errors[ERR_CASE_PLAN_LINE_NOT_FOUND]
          - errors[ERR_GRIND_RUN_NOT_FOUND]
          - errors[ERR_GRIND_INPUT_NOT_FOUND]
          - errors[ERR_TEMPERATURE_LOG_NOT_FOUND]
          - errors[ERR_CASE_FAILURE_NOT_FOUND]
          - errors[ERR_PRE_ORDER_NOT_FOUND]
          - errors[ERR_SHRINK_RECONCILIATION_NOT_FOUND]
        distinguishing_aspect: "Priority 3 names the entity that owns the path segment, so eleven syntactically valid but unknown UUIDs each return their own error_id with HTTP 404 — never a shared generic not-found and never HTTP 400 for a well-formed UUID."
        test_recipe:
          setup:
            - "One department exists so the store is not empty; every id used in the trigger is a well-formed UUID that was never minted."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "GET /meat-ops/departments/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { e_dept: $.data.error_id }
            - call: "GET /meat-ops/primal-purchases/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { e_purchase: $.data.error_id }
            - call: "GET /meat-ops/cutting-tests/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { e_test: $.data.error_id }
            - call: "GET /meat-ops/cutting-test-lines/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { e_test_line: $.data.error_id }
            - call: "GET /meat-ops/case-plan-lines/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { e_plan_line: $.data.error_id }
            - call: "GET /meat-ops/grind-runs/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { e_run: $.data.error_id }
            - call: "GET /meat-ops/grind-inputs/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { e_input: $.data.error_id }
            - call: "GET /meat-ops/temperature-logs/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { e_log: $.data.error_id }
            - call: "GET /meat-ops/case-failures/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { e_failure: $.data.error_id }
            - call: "GET /meat-ops/pre-orders/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ServiceClerk
              as_user_id: "clerk-01"
              captures: { e_order: $.data.error_id }
            - call: "GET /meat-ops/shrink-reconciliations/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { e_recon: $.data.error_id }
          assert:
            - "${e_dept} == ERR_DEPARTMENT_NOT_FOUND, ${e_purchase} == ERR_PRIMAL_PURCHASE_NOT_FOUND, ${e_test} == ERR_CUTTING_TEST_NOT_FOUND and ${e_test_line} == ERR_CUTTING_TEST_LINE_NOT_FOUND"
            - "${e_plan_line} == ERR_CASE_PLAN_LINE_NOT_FOUND, ${e_run} == ERR_GRIND_RUN_NOT_FOUND, ${e_input} == ERR_GRIND_INPUT_NOT_FOUND and ${e_log} == ERR_TEMPERATURE_LOG_NOT_FOUND"
            - "${e_failure} == ERR_CASE_FAILURE_NOT_FOUND, ${e_order} == ERR_PRE_ORDER_NOT_FOUND and ${e_recon} == ERR_SHRINK_RECONCILIATION_NOT_FOUND"
            - "All eleven responses carry HTTP 404 with response_type == error and a data.message string; the existing Department.${dept_id} is untouched"

      - name: unknown_parent_id_on_a_sub_resource_listing_is_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - endpoints[GET /meat-ops/departments/{id}/case-plans]
          - endpoints[GET /meat-ops/primal-purchases/{id}/cutting-tests]
          - errors[ERR_DEPARTMENT_NOT_FOUND]
          - errors[ERR_PRIMAL_PURCHASE_NOT_FOUND]
        distinguishing_aspect: "A sub-resource listing under an unknown parent returns 404 with the parent's error_id rather than an empty page — the parent path id is validated before the child query runs — while the same listing under a real but childless parent returns 200 with total_count 0."
        test_recipe:
          setup:
            - "Department 'Meat 41' exists with no case plans; purchase P1 exists with no cutting tests."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
