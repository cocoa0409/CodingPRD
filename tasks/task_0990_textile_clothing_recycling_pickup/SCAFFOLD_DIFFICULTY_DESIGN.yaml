            - call: "GET /diversion-credits/${id}"
              as: ZoneOperator
              captures: { c_status: $.data.status, c_hold: $.data.has_hold }
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { f_held: $.data.held_cents, f_avail: $.data.available_cents }
            - call: "GET /partners/${id}"
              as: ZoneOperator
