        excluded_because:
          difficulty_instance: boundary_precision_check / extension_prepayment_boundary_exact_equality
          rationale: "The insufficient-prepayment rejection and its exact >= boundary are both asserted by that difficulty instance."

      - name: state_over_fiscal_priority_ordering
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=39]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / filing_state_beats_extension_prepayment_fiscal
          rationale: "The dual-failure ordering between the state rule and the fiscal rule is the subject of that difficulty instance."

      - name: nexus_safety_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_NEXUS_NOT_ESTABLISHED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / nexus_safety_beats_zero_denominator_constraint
          rationale: "ERR_NEXUS_NOT_ESTABLISHED is triggered and asserted as the winning error of that difficulty instance."

