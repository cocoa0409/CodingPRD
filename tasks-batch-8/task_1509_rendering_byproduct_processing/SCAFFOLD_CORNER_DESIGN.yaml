            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
            - { call: "POST /rendering/price-index-entries", payload: { plant_id: "${plant_id}", index_product: "TALLOW", effective_date: "2026-08-01", price_cents_per_lb: 40, source: "JACOBSEN" }, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/price-index-entries", payload: { plant_id: "${plant_id}", index_product: "TALLOW", effective_date: "2026-08-10", price_cents_per_lb: 44, source: "USDA_AMS" }, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 100, requested_ship_date: "2026-08-10", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord_id: $.data.id } }
