scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: singles_vs_albums_points_formula
        grounds:
          - calculations.chart_points
          - calculations.chart_points.variants.singles_track_formula
          - calculations.chart_points.variants.albums_tea_formula
        distinguishing_aspect: |
          Identical consumption input set (10000 paid + 7500 ad + 5000 programmed streams, 100000 airplay, 500 sales) yields 515.4000 points on a SINGLES/TRACK context but 510.4000 points on an ALBUMS/ALBUM context, because the albums variant converts paid streams via floor(8/10) TEA units and drops ad-supported streams entirely.
        test_recipe:
          setup:
            - "Label account L and two TitleProducts: T_TRK (TRACK, genre pop, price 999, release 2026-08-01, availability open) and T_ALB (ALBUM, same genre/price/release/availability)"
            - "Chart C_S (SINGLES, MAIN) and chart C_A (ALBUMS, MAIN), each with recurrent rule RR and an ACTIVE methodology V (w_sales=1.0, w_on_demand=0.5, w_programmed=0.2, w_airplay=0.0001, divisors 1250/3750/2500, tea_rate=10, effective_from 2026-09-01T00:00:00Z)"
            - "Week W_S on C_S and week W_A on C_A, both OPEN, window [2026-09-04T00:00:00Z, 2026-09-11T00:00:00Z)"
            - "Four DOMESTIC providers (SALES, STREAM_ON_DEMAND, STREAM_PROGRAMMED, AIRPLAY), each with ACCEPTED reports for BOTH titles on their respective weeks: sales 500, paid 10000, ad 7500, prog 5000, airplay 100000, event_time 2026-09-05T00:00:00Z"
            - "Both weeks locked, clock at 2026-09-11T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /labels"
              payload: { legal_name: "Label One", account_code: "LBL-1" }
              as: PlatformAdmin
              captures: { lbl_id: $.data.id }
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-STD", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "standard recurrent" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-TRK-1", title: "Song One", artist_name: "Artist A", product_kind: "TRACK", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { trk_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-ALB-1", title: "Album One", artist_name: "Artist A", product_kind: "ALBUM", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { alb_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "SNG-1", title: "Singles One", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { chs_id: $.data.id, chs_ver: $.data.version }
            - call: "POST /charts"
              payload: { chart_code: "ALB-1", title: "Albums One", chart_kind: "ALBUMS", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { cha_id: $.data.id, cha_ver: $.data.version }
            - call: "POST /charts/${chs_id}/methodology-versions"
              payload: { version_label: "v1", w_sales: 1.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
              captures: { mvs_id: $.data.id }
            - call: "POST /charts/${cha_id}/methodology-versions"
              payload: { version_label: "v1", w_sales: 1.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
              captures: { mva_id: $.data.id }
            - call: "POST /charts/${chs_id}/methodology-versions/${mvs_id}/activate"
              payload: { expected_chart_version: "${chs_ver}" }
              as: ChartManager
            - call: "POST /charts/${cha_id}/methodology-versions/${mva_id}/activate"
              payload: { expected_chart_version: "${cha_ver}" }
              as: ChartManager
            - call: "POST /charts/${chs_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { ws_id: $.data.id }
            - call: "POST /charts/${cha_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wa_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_code: "POS-1", display_name: "POS One", feed_kind: "SALES", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_sales: $.data.id }
            - call: "POST /providers"
              payload: { provider_code: "DSP-1", display_name: "DSP One", feed_kind: "STREAM_ON_DEMAND", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_od: $.data.id }
            - call: "POST /providers"
              payload: { provider_code: "PRG-1", display_name: "Prog One", feed_kind: "STREAM_PROGRAMMED", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_prog: $.data.id }
            - call: "POST /providers"
              payload: { provider_code: "AIR-1", display_name: "Air One", feed_kind: "AIRPLAY", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_air: $.data.id }
            - call: "POST /providers/${pv_sales}/reports"
              payload: { title_product_id: "${trk_id}", chart_week_id: "${ws_id}", component_kind: "SALES", quantity: 500, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-s-trk" }
              as: DataProvider
              as_user_id: "${pv_sales}"
              captures: { r1: $.data.id }
            - call: "POST /providers/${pv_od}/reports"
              payload: { title_product_id: "${trk_id}", chart_week_id: "${ws_id}", component_kind: "STREAM_ON_DEMAND_PAID", quantity: 10000, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-p-trk" }
              as: DataProvider
              as_user_id: "${pv_od}"
              captures: { r2: $.data.id }
            - call: "POST /providers/${pv_od}/reports"
              payload: { title_product_id: "${trk_id}", chart_week_id: "${ws_id}", component_kind: "STREAM_ON_DEMAND_AD", quantity: 7500, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-a-trk" }
              as: DataProvider
              as_user_id: "${pv_od}"
              captures: { r3: $.data.id }
            - call: "POST /providers/${pv_prog}/reports"
              payload: { title_product_id: "${trk_id}", chart_week_id: "${ws_id}", component_kind: "STREAM_PROGRAMMED", quantity: 5000, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-g-trk" }
              as: DataProvider
              as_user_id: "${pv_prog}"
              captures: { r4: $.data.id }
            - call: "POST /providers/${pv_air}/reports"
              payload: { title_product_id: "${trk_id}", chart_week_id: "${ws_id}", component_kind: "AIRPLAY", quantity: 100000, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-r-trk" }
              as: DataProvider
              as_user_id: "${pv_air}"
              captures: { r5: $.data.id }
            - call: "POST /providers/${pv_sales}/reports"
              payload: { title_product_id: "${alb_id}", chart_week_id: "${wa_id}", component_kind: "SALES", quantity: 500, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-s-alb" }
              as: DataProvider
              as_user_id: "${pv_sales}"
              captures: { r6: $.data.id }
            - call: "POST /providers/${pv_od}/reports"
              payload: { title_product_id: "${alb_id}", chart_week_id: "${wa_id}", component_kind: "STREAM_ON_DEMAND_PAID", quantity: 10000, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-p-alb" }
              as: DataProvider
              as_user_id: "${pv_od}"
              captures: { r7: $.data.id }
            - call: "POST /providers/${pv_od}/reports"
              payload: { title_product_id: "${alb_id}", chart_week_id: "${wa_id}", component_kind: "STREAM_ON_DEMAND_AD", quantity: 7500, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-a-alb" }
              as: DataProvider
              as_user_id: "${pv_od}"
              captures: { r8: $.data.id }
            - call: "POST /providers/${pv_prog}/reports"
              payload: { title_product_id: "${alb_id}", chart_week_id: "${wa_id}", component_kind: "STREAM_PROGRAMMED", quantity: 5000, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-g-alb" }
              as: DataProvider
              as_user_id: "${pv_prog}"
              captures: { r9: $.data.id }
            - call: "POST /providers/${pv_air}/reports"
              payload: { title_product_id: "${alb_id}", chart_week_id: "${wa_id}", component_kind: "AIRPLAY", quantity: 100000, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-r-alb" }
              as: DataProvider
              as_user_id: "${pv_air}"
              captures: { r10: $.data.id }
            - call: "POST /consumption-reports/${r1}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r2}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r3}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r4}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r5}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r6}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r7}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r8}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r9}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r10}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chart-weeks/${ws_id}/lock"
              payload: {}
              as: ChartManager
            - call: "POST /chart-weeks/${wa_id}/lock"
              payload: {}
              as: ChartManager
          trigger:
            - call: "POST /chart-weeks/${ws_id}/compute"
              payload: {}
              as: ChartManager
              captures: { s_pts: "$.data[?(@.title_product_id=='${trk_id}')].points" }
            - call: "POST /chart-weeks/${wa_id}/compute"
              payload: {}
              as: ChartManager
              captures: { a_pts: "$.data[?(@.title_product_id=='${alb_id}')].points" }
          assert:
            - "ChartEntry for ${trk_id} on ${ws_id}.points == 515.4000"
            - "ChartEntry for ${alb_id} on ${wa_id}.points == 510.4000"
            - "515.4000 != 510.4000 (identical inputs, different variants)"

      - name: capped_batch_vs_uncapped_sales_report
        grounds:
          - calculations.countable_album_units
          - calculations.countable_album_units.variants.sales_report_variant
        distinguishing_aspect: |
          Identical gross quantity of 6 album units produces 4 countable units when delivered as one D2C SaleBatch from a single buyer (per-buyer cap MAX_ALBUM_UNITS_PER_BUYER_PER_WEEK=4 binds), but 6 countable units when delivered as an uncapped SALES ConsumptionReport — the two variants of album-unit accounting diverge on the same entity-week input.
        test_recipe:
          setup:
            - "Label L, album title T_ALB (price 999, release 2026-08-01, availability open)"
            - "ALBUMS chart C with ACTIVE methodology (any weights), week W1 OPEN [2026-09-04T00:00:00Z, 2026-09-11T00:00:00Z)"
            - "DOMESTIC SALES provider PV"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /labels"
              payload: { legal_name: "Label Two", account_code: "LBL-2" }
              as: PlatformAdmin
              captures: { lbl_id: $.data.id }
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-2", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-ALB-2", title: "Album Two", artist_name: "Artist B", product_kind: "ALBUM", genre_tag: "rock", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { alb_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "ALB-2", title: "Albums Two", chart_kind: "ALBUMS", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/methodology-versions"
              payload: { version_label: "v1", w_sales: 1.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
              captures: { mv_id: $.data.id }
            - call: "POST /charts/${ch_id}/methodology-versions/${mv_id}/activate"
              payload: { expected_chart_version: "${ch_ver}" }
              as: ChartManager
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_code: "POS-2", display_name: "POS Two", feed_kind: "SALES", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_id: $.data.id }
          trigger:
            - call: "POST /titles/${alb_id}/sale-batches"
              payload: { channel: "D2C", quantity: 6, buyer_key: "buyer-X", chart_week_id: "${wk_id}" }
              as: ChartOps
              captures: { batch_id: $.data.id, batch_countable: $.data.countable_units }
            - call: "POST /providers/${pv_id}/reports"
              payload: { title_product_id: "${alb_id}", chart_week_id: "${wk_id}", component_kind: "SALES", quantity: 6, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "fp-sales-6" }
              as: DataProvider
              as_user_id: "${pv_id}"
              captures: { rep_id: $.data.id }
          assert:
            - "SaleBatch.${batch_id}.countable_units == 4 (cap binds: min(6, 4))"
            - "ConsumptionReport.${rep_id}.quantity == 6 and contributes its full 6 to sales_units once ACCEPTED (no buyer cap)"
            - "4 != 6 (identical gross quantity, different variant totals)"

  - rule_id: combinatorial_formula
    instances:
      - name: weighted_points_mode_a_multifactor
        grounds:
          - calculations.chart_points
        distinguishing_aspect: |
          Mode (a): chart_points is a >=3-input non-linear formula — integer-floor division per component (paid/ad/prog divisors), a conditional branch on (chart_kind, product_kind) selecting the TEA path, and four configurable weights — pinned to 515.4000 for the canonical singles fixture.
        test_recipe:
          setup:
            - "Singles chart with ACTIVE methodology (w 1.0/0.5/0.2/0.0001, divisors 1250/3750/2500, tea 10), OPEN week [2026-09-04T00:00:00Z, 2026-09-11T00:00:00Z)"
            - "TRACK title eligible; ACCEPTED DOMESTIC reports: sales 500, paid 10000, ad 7500, prog 5000, airplay 100000; week locked at 2026-09-11T00:00:00Z"
