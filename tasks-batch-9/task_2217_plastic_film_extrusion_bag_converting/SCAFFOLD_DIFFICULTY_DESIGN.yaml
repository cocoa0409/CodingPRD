            - "after revocation: BagLot.${bl1}.bag_unit_weight_kg == 0.012520, bag_count_theoretical == 46006 and count_accuracy_pct == 99.99 are unchanged"
            - "after revocation: PlateSet.${plate1}.nonconformance_count == 1 and ExtrusionLine.${line_fd}.revoked_dossier_count == 1"
            - "after revocation: ComplianceDossier.${cd1}.status == REVOKED and revocation_reason is non-null"
