scaffold_corner_design:

  - section: entities
    instances:
      - name: customer_creation_with_required_fields_returns_201
        claim_type: creation_required_fields
        grounds:
          - entities.Customer
          - endpoints[POST /api/v1/customers]
        distinguishing_aspect: "POST /api/v1/customers with all required fields returns 201 and the response includes id, created_at, version=1, account_status=ACTIVE."
        test_recipe:
          setup: ["DeliveryZone NW-1 exists"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
          trigger:
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "NewCo", billing_email: "n@x.example", service_address: "1 N", delivery_zone_id: '${zone_id}', service_mode: "AUTO", par_level_bottles: 2, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id', ver: '$.data.version', status: '$.data.account_status' }
          assert:
            - "HTTP 201"
            - "Customer.account_status == ACTIVE"
            - "Customer.version == 1"
            - "Customer.bottles_on_site == 0"
            - "Customer.outstanding_balance_cents == 0"

      - name: customer_missing_required_field_returns_invalid_request
        claim_type: required_field_validation
        grounds:
          - entities.Customer
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /api/v1/customers missing billing_email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["DeliveryZone NW-1 exists"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
          trigger:
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "BadCo", service_address: "1 B", delivery_zone_id: '${zone_id}' }
              as: OpsAdmin
              captures: { err: '$.data.error_id' }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: customer_invalid_enum_account_type
        claim_type: type_constraint
        grounds:
          - entities.Customer.fields.account_type
        distinguishing_aspect: "account_type='BRANCH' (not in {OFFICE, HOME}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["DeliveryZone NW-1 exists"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
          trigger:
            - call: "POST /api/v1/customers"
              payload: { account_type: "BRANCH", business_name: "BadEnum", billing_email: "b@x.example", service_address: "1 B", delivery_zone_id: '${zone_id}' }
              as: OpsAdmin
              captures: { err: '$.data.error_id' }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: customer_default_pricing_tier_standard
        claim_type: defaults_applied
        grounds:
          - entities.Customer.fields.pricing_tier
        distinguishing_aspect: "Omitting pricing_tier yields STANDARD; omitting service_mode yields AUTO; omitting par_level_bottles yields 2."
        test_recipe:
          setup: ["DeliveryZone NW-1 exists"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
          trigger:
            - call: "POST /api/v1/customers"
              payload: { account_type: "HOME", business_name: "DefaultCo", billing_email: "d@x.example", service_address: "1 D", delivery_zone_id: '${zone_id}' }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
          assert:
            - "Customer.pricing_tier == STANDARD"
            - "Customer.service_mode == AUTO"
            - "Customer.par_level_bottles == 2"

      - name: customer_get_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /api/v1/customers/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /api/v1/customers/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["server up"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /api/v1/customers/00000000-0000-0000-0000-000000000000"
              as: OpsAdmin
              captures: { err: '$.data.error_id' }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: bottle_custody_ledger_immutable_no_version
        claim_type: immutability
        grounds:
          - entities.BottleCustodyLedger
        distinguishing_aspect: "BottleCustodyLedger has common_fields=false; carries only id and created_at, no version, no updated_at."
        test_recipe:
          setup: ["a delivered stop producing ledger entries"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "LedgerCo", billing_email: "l@x.example", service_address: "1 L", delivery_zone_id: '${zone_id}', service_mode: "WILL_CALL", par_level_bottles: 0, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: '${cust_id}', order_kind: "DELIVERY", requested_date: "2026-05-10", quantity_bottles: 1 }
              as: Dispatcher
              captures: { wo1: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: '${zone_id}', service_date: "2026-05-10", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r1: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo1}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r1}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r1}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}/stops"
              as: Driver
              captures: { s1: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s1}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}"
              as: Driver
              captures: { r1_v: '$.data.version' }
            - call: "POST /api/v1/stops/${s1}/deliver"
              payload: { expected_route_version: '${r1_v}', actual_bottles_delivered: 1, actual_empties_collected: 0 }
              as: Driver
          trigger:
            - call: "GET /api/v1/customers/${cust_id}/bottle-custody-ledger"
              as: OpsAdmin
          assert:
            - "Each ledger entry has id and created_at"
            - "No ledger entry has version or updated_at field"

  - section: state_machines
    instances:
      - name: stop_initial_state_planned
        claim_type: initial_state
        grounds:
          - state_machines.Stop
        distinguishing_aspect: "Newly created Stop has stop_status == PLANNED."
        test_recipe:
          setup: ["Customer AUTO par=2, Route DRAFT"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "InitCo", billing_email: "i@x.example", service_address: "1 I", delivery_zone_id: '${zone_id}', service_mode: "AUTO", par_level_bottles: 2, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: '${zone_id}', service_date: "2026-06-01", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r1: '$.data.id' }
          trigger:
            - call: "POST /api/v1/routes/${r1}/stops"
              payload: { customer_id: '${cust_id}', sequence_index: 1 }
              as: Dispatcher
              captures: { s1: '$.data.id' }
          assert:
            - "Stop.${s1}.stop_status == PLANNED"

      - name: customer_terminal_close_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Customer
        distinguishing_aspect: "From CLOSED state, no further transitions allowed."
        test_recipe:
          setup: ["Customer CLOSED"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "HOME", business_name: "TermCo", billing_email: "t@x.example", service_address: "1 T", delivery_zone_id: '${zone_id}' }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/customers/${cust_id}/close"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /api/v1/customers/${cust_id}/suspend"
              payload: {}
              as: OpsAdmin
              captures: { err: '$.data.error_id' }
          assert:
            - "error_id IN {ERR_INVALID_STATE, ERR_ALREADY_TERMINAL}"

      - name: invalid_transition_stop_deliver_from_planned
        claim_type: invalid_transition
        grounds:
          - state_machines.Stop
        distinguishing_aspect: "Cannot call deliver on PLANNED stop (must be ARRIVED first)."
        test_recipe:
          setup: ["Stop PLANNED"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "InvT", billing_email: "i@x.example", service_address: "1 I", delivery_zone_id: '${zone_id}', service_mode: "AUTO", par_level_bottles: 1, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: '${zone_id}', service_date: "2026-06-01", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r1: '$.data.id' }
            - call: "POST /api/v1/routes/${r1}/stops"
              payload: { customer_id: '${cust_id}', sequence_index: 1 }
              as: Dispatcher
              captures: { s1: '$.data.id' }
            - call: "GET /api/v1/routes/${r1}"
              as: Dispatcher
              captures: { r_v: '$.data.version' }
          trigger:
            - call: "POST /api/v1/stops/${s1}/deliver"
              payload: { expected_route_version: '${r_v}', actual_bottles_delivered: 1, actual_empties_collected: 0 }
              as: Driver
              captures: { err: '$.data.error_id' }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: invoice_terminal_void_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Invoice
        distinguishing_aspect: "VOID invoice cannot be disputed."
        test_recipe:
          setup: ["Invoice VOID"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "VoidCo", billing_email: "v@x.example", service_address: "1 V", delivery_zone_id: '${zone_id}', service_mode: "WILL_CALL", par_level_bottles: 0, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/invoices"
              payload: { customer_id: '${cust_id}', billing_period_start: "2026-05-01", billing_period_end: "2026-06-01", due_date: "2026-06-15" }
              as: BillingAdmin
              captures: { inv_id: '$.data.id' }
            - call: "POST /api/v1/invoices/${inv_id}/void"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/v1/invoices/${inv_id}/dispute"
              payload: {}
              as: CustomerSelf
              as_user_id: '${cust_id}'
              captures: { err: '$.data.error_id' }
          assert:
            - "error_id IN {ERR_INVALID_STATE, ERR_ALREADY_TERMINAL}"

  - section: calculations
    instances:
      - name: water_charge_gold_tier_rate
        claim_type: correct_result
        grounds:
          - calculations.calc_water_charge
        distinguishing_aspect: "Customer GOLD tier delivers 10 bottles; charge = 10 * 600 = 6000c."
        test_recipe:
          setup: ["Customer GOLD tier, PricingConfig gold=600c"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "GoldCo", billing_email: "g@x.example", service_address: "1 G", delivery_zone_id: '${zone_id}', service_mode: "WILL_CALL", par_level_bottles: 0, pricing_tier: "GOLD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: '${cust_id}', order_kind: "DELIVERY", requested_date: "2026-05-10", quantity_bottles: 10 }
              as: Dispatcher
              captures: { wo1: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: '${zone_id}', service_date: "2026-05-10", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r1: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo1}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r1}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r1}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}/stops"
              as: Driver
              captures: { s1: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s1}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}"
              as: Driver
              captures: { r1_v: '$.data.version' }
            - call: "POST /api/v1/stops/${s1}/deliver"
              payload: { expected_route_version: '${r1_v}', actual_bottles_delivered: 10, actual_empties_collected: 0 }
              as: Driver
            - call: "POST /api/v1/invoices"
              payload: { customer_id: '${cust_id}', billing_period_start: "2026-05-01", billing_period_end: "2026-06-01", due_date: "2026-06-15" }
              as: BillingAdmin
              captures: { inv_id: '$.data.id' }
          trigger:
            - call: "POST /api/v1/invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
          assert:
            - "Invoice.${inv_id}.subtotal_water_cents == 6000 (10 * 600)"

      - name: shortage_charge_calculation
        claim_type: correct_result
        grounds:
          - calculations.calc_shortage_charge
        distinguishing_aspect: "Stop with planned_empties=3, actual_empties=1 -> shortage_count=2; charge = 2 * 2000 = 4000c."
        test_recipe:
          setup: ["Customer bottles_on_site=3, then deliver 3 collect 1 (shortage 2)"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/pricing-configs"
              payload: { effective_from: "2026-01-01", bottle_deposit_cents: 1500, bottle_shortage_fee_cents: 2000, standard_per_bottle_cents: 700, silver_per_bottle_cents: 650, gold_per_bottle_cents: 600, silver_volume_threshold: 20, gold_volume_threshold: 50, late_fee_flat_cents: 1500 }
              as: OpsAdmin
            - call: "POST /api/v1/delivery-zones"
              payload: { code: "NW-1", name: "NW" }
              as: OpsAdmin
              captures: { zone_id: '$.data.id' }
            - call: "POST /api/v1/customers"
              payload: { account_type: "OFFICE", business_name: "ShortCo", billing_email: "s@x.example", service_address: "1 S", delivery_zone_id: '${zone_id}', service_mode: "WILL_CALL", par_level_bottles: 0, pricing_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cust_id: '$.data.id' }
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: '${cust_id}', order_kind: "DELIVERY", requested_date: "2026-05-05", quantity_bottles: 3 }
              as: Dispatcher
              captures: { wo1: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: '${zone_id}', service_date: "2026-05-05", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r1: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo1}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r1}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r1}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}/stops"
              as: Driver
              captures: { s1: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s1}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r1}"
              as: Driver
              captures: { r1_v: '$.data.version' }
            - call: "POST /api/v1/stops/${s1}/deliver"
              payload: { expected_route_version: '${r1_v}', actual_bottles_delivered: 3, actual_empties_collected: 0 }
              as: Driver
            - call: "POST /api/v1/work-orders"
              payload: { customer_id: '${cust_id}', order_kind: "DELIVERY", requested_date: "2026-05-10", quantity_bottles: 3 }
              as: Dispatcher
              captures: { wo2: '$.data.id' }
            - call: "POST /api/v1/routes"
              payload: { zone_id: '${zone_id}', service_date: "2026-05-10", driver_name: "Dave", truck_capacity_bottles: 50 }
              as: Dispatcher
              captures: { r2: '$.data.id' }
            - call: "POST /api/v1/work-orders/${wo2}/schedule"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/routes/${r2}/publish"
              payload: {}
              as: Dispatcher
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/v1/routes/${r2}/start"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r2}/stops"
              as: Driver
              captures: { s2: '$.data[0].id' }
            - call: "POST /api/v1/stops/${s2}/arrive"
              payload: {}
              as: Driver
            - call: "GET /api/v1/routes/${r2}"
              as: Driver
              captures: { r2_v: '$.data.version' }
          trigger:
            - call: "POST /api/v1/stops/${s2}/deliver"
              payload: { expected_route_version: '${r2_v}', actual_bottles_delivered: 3, actual_empties_collected: 1 }
              as: Driver
          assert:
            - "Stop.${s2}.stop_status == PARTIAL"
            - "Stop.${s2}.shortage_count == 2"
            - "Next invoice shortage_charge_cents includes 2 * 2000 == 4000c"

      - name: route_commit_aggregation
        claim_type: correct_result
        grounds:
          - calculations.calc_route_commit
