          - roles.ConcessionerAccountant
          - roles.ConcessionerHRManager
        distinguishing_aspect: "Peer-role isolation: the accountant is denied both housing-unit creation and voucher voiding (403) — exclusive operations stay exclusive even between two concessioner-side roles."
        test_recipe:
          setup:
            - "ACTIVE contract with one housing unit and one hire holding a BOOKED voucher."
          setup_api_calls:
            - *en_clock
            - &rb_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-113", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.04, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id }
            - &rb_l1
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
              captures: { sl_l: $.data.id }
            - &rb_l2
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
            - &rb_l3
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
            - &rb_l4
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
            - &rb_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
              captures: { s_id: $.data.id }
            - &rb_act
              call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &rb_unit
              call: "POST /contracts/${c_id}/housing-units"
              payload: { unit_code: "DORM-G1", bed_count: 4 }
              as: ConcessionerHRManager
              captures: { u1: $.data.id }
            - &rb_hire
              call: "POST /contracts/${c_id}/seasonal-hires"
              payload: { season_id: "${s_id}", service_line_id: "${sl_l}", employee_ref: "emp-rb", housing_unit_id: "${u1}", arrival_date: "2027-06-01T00:00:00Z", departure_date: "2027-08-31T00:00:00Z", needs_transport: true, transport_origin: "Denver" }
              as: ConcessionerHRManager
              captures: { h1: $.data.id }
            - &rb_getv
              call: "GET /contracts/${c_id}/transport-vouchers"
              payload: { hire_id: "${h1}" }
              as: ConcessionerHRManager
              captures: { v1: "$.data[0].id" }
          trigger:
            - call: "POST /contracts/${c_id}/housing-units"
              payload: { unit_code: "DORM-G2", bed_count: 4 }
              as: ConcessionerAccountant
              captures: { err1: $.data.error_id }
            - call: "POST /contracts/${c_id}/transport-vouchers/${v1}/void"
              payload: {}
              as: ConcessionerAccountant
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_INSUFFICIENT_PERMISSIONS (403) on housing-unit create"
            - "err2 == ERR_INSUFFICIENT_PERMISSIONS (403) on voucher void"
            - "TransportVoucher.${v1}.status == BOOKED (unchanged)"

      - name: shared_get_endpoints_work_for_every_role
        claim_type: Satisfaction → Pass
        grounds:
          - roles.AgencyContractingOfficer
          - roles.ConcessionerHRManager
        distinguishing_aspect: "GET /contracts and GET /contracts/{id} are shared across all roles: an AgencyContractingOfficer and a ConcessionerHRManager both read the same contract with 200."
        test_recipe:
          setup:
            - "One contract exists."
          setup_api_calls:
            - *en_clock
            - *en_contract
          trigger:
            - call: "GET /contracts/${c_id}"
              payload: {}
              as: AgencyContractingOfficer
              captures: { r1: $.data.id }
            - call: "GET /contracts/${c_id}"
              payload: {}
              as: ConcessionerHRManager
              captures: { r2: $.data.id }
          assert:
            - "both reads return 200 with identical contract data (r1 == r2 == ${c_id})"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_reservation_create_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-contract]
        distinguishing_aspect: "Two sequential reservation creates with the same captured expected_contract_version: the first succeeds (bumps version), the second is rejected 412 ERR_STALE_CONTRACT_VERSION."
        test_recipe:
          setup:
            - "ACTIVE contract; season; room class; APPROVED filing; clock inside lottery window; contract version captured once."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
            - *df_room
            - *df_study
            - *df_getc
            - *df_filing
            - *df_rev
            - *df_app
            - *df_clock2
            - *df_getc2
          trigger:
            - call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "g-occ1", check_in_date: "2027-07-10T00:00:00Z", check_out_date: "2027-07-11T00:00:00Z", occupancy_band: "SOLO", expected_contract_version: "${c_v3}" }
              as: ConcessionerFrontDesk
              captures: { r1: $.data.id }
            - call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "g-occ2", check_in_date: "2027-07-11T00:00:00Z", check_out_date: "2027-07-12T00:00:00Z", occupancy_band: "SOLO", expected_contract_version: "${c_v3}" }
              as: ConcessionerFrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "first create succeeds (r1 non-null)"
            - "second create with the now-stale version returns 412 err == ERR_STALE_CONTRACT_VERSION"
            - "re-reading the contract and retrying with the fresh version succeeds"

      - name: cascade_chain_hire_arrive_marks_voucher_used
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SeasonalHire.HIRED_to_ARRIVED
          - state_machines.TransportVoucher.BOOKED_to_USED
        distinguishing_aspect: "One client action (mark-arrived) produces a cross-entity mutation on the linked voucher (BOOKED -> USED) in the same request scope — a one-hop cascade with observable effect on a second entity."
        test_recipe:
          setup:
            - "ACTIVE contract; season; housing unit; hire HIRED with needs_transport true."
          setup_api_calls:
            - *en_clock
            - *ns_contract
            - *ns_l1
            - *ns_l2
            - *ns_l3
            - *ns_l4
            - *ns_season
            - *ns_act
            - *ns_unit
            - *ns_hire
          trigger:
            - call: "POST /contracts/${c_id}/seasonal-hires/${h1}/mark-arrived"
              payload: {}
              as: ConcessionerHRManager
              captures: { h_status: $.data.status }
            - call: "GET /contracts/${c_id}/transport-vouchers"
              payload: { hire_id: "${h1}" }
              as: ConcessionerHRManager
              captures: { v_status: "$.data[0].status" }
          assert:
            - "h_status == ARRIVED"
            - "v_status == USED — the voucher transitioned without any direct voucher call"

      - name: season_close_sweeps_confirmed_reservations_to_fulfilled
        claim_type: ops_run_checkpoint
        grounds:
          - state_machines.OperatingSeason.OPEN_to_CLOSED
          - state_machines.Reservation
        distinguishing_aspect: "The season-close checkpoint (clock crossing close_date) batch-advances every CONFIRMED reservation whose checkout is within the season to FULFILLED, and any lingering out-of-season CONFIRMED to NO_SHOW — a periodic epoch advance, not per-request work."
        test_recipe:
          setup:
            - "ACTIVE contract; season (close 2027-09-01); room class; APPROVED filing; one CONFIRMED reservation 8/28-8/31 checked in."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
            - *df_room
            - *df_study
            - *df_getc
            - *df_filing
            - *df_rev
            - *df_app
            - *df_clock2
            - *df_getc2
            - &sw_r1
              call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "g-sweep", check_in_date: "2027-08-28T00:00:00Z", check_out_date: "2027-08-31T00:00:00Z", occupancy_band: "SOLO", expected_contract_version: "${c_v3}" }
              as: ConcessionerFrontDesk
              captures: { r1: $.data.id }
            - &sw_close_window
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: SystemTestHarness
            - &sw_checkin_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-28T12:00:00Z" }
              as: SystemTestHarness
            - &sw_checkin
              call: "POST /contracts/${c_id}/reservations/${r1}/check-in"
              payload: {}
              as: ConcessionerFrontDesk
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-09-01T00:00:01Z" }
              as: SystemTestHarness
            - call: "GET /contracts/${c_id}/reservations/${r1}"
              payload: {}
              as: ConcessionerFrontDesk
              captures: { r1_status: $.data.status }
            - call: "GET /contracts/${c_id}/seasons/${s_id}"
              payload: {}
              as: ConcessionerOpsManager
              captures: { s_status: $.data.status }
          assert:
            - "s_status == CLOSED (epoch advanced by the clock)"
            - "r1_status == FULFILLED — swept by the season-close checkpoint"

      - name: approved_weighted_mean_pinned_against_later_study_change
        claim_type: derived_field_reconciliation
        grounds:
          - entities.RateFiling.fields.approved_weighted_mean_cents
          - state_machines.RateFiling.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "Version-pinning on approval: approved_weighted_mean_cents is frozen at approval; a newer study with a different mean registered afterwards does not retroactively change the approved filing."
        test_recipe:
          setup:
            - "ACTIVE contract; season; room class; study S1 (mean 25000); filing approved against S1. Then study S2 (mean 20500) registered."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
            - *df_room
            - *df_study
            - *df_getc
            - *df_filing
            - *df_rev
            - *df_app
          trigger:
            - call: "POST /contracts/${c_id}/comparability-studies"
              payload: { title: "S2-newer", comparables: [{ property_name: "A", nightly_rate_cents: 20000, weight: 1.0 }, { property_name: "B", nightly_rate_cents: 22000, weight: 2.0 }, { property_name: "C", nightly_rate_cents: 18000, weight: 1.0 }], prepared_at: "2026-08-01T00:00:00Z", valid_through: "2028-06-01T00:00:00Z" }
              as: AgencyRateAnalyst
            - call: "GET /contracts/${c_id}/rate-filings/${f_id}"
              payload: {}
              as: AgencyRateAnalyst
              captures: { pinned: $.data.approved_weighted_mean_cents }
          assert:
            - "pinned == 25000 — the approved filing keeps the S1 mean even though a 20500-mean study now exists"
            - "RateFiling.${f_id}.status == APPROVED (unaffected by the new study)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: writes_are_immediately_visible_in_subsequent_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a created room class is readable in the very next request with all computed/system fields populated — no eventual-consistency lag anywhere in the API."
        test_recipe:
          setup:
            - "ACTIVE contract."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
          trigger:
            - call: "POST /contracts/${c_id}/room-classes"
              payload: { code: "IMM_1", total_rooms: 3, peak_season_months: [7] }
              as: ConcessionerOpsManager
              captures: { rc: $.data.id }
            - call: "GET /contracts/${c_id}/room-classes"
              payload: {}
              as: ConcessionerOpsManager
          assert:
            - "the list response in the immediately following request contains ${rc} with code IMM_1, total_rooms 3, status ACTIVE"
            - "no staleness: the write's effect is fully observable in the next read"

