            - "SleepStudy.${st1}.split_outcome remains null"

      - name: split_central_predominance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SPLIT_CENTRAL_PREDOMINANCE]"]
        distinguishing_aspect: "On an IN_PROGRESS study (state satisfied), central_predominance_flag true triggers the safety exclusion ERR_SPLIT_CENTRAL_PREDOMINANCE before threshold checks."
