    roles: [TalentBuyer, ArtistRep, BusinessAffairs, FinanceController]
    input: ["offer_id?", "booking_id?", "artist_id?", "waiver_competing_performance_id?", "enforcement_status?", "waiver_status?", "limit?", "offset?"]
