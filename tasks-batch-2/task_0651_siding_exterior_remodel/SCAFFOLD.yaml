    input: []
    output: Warranty
    side_effects: []
  - method: GET
    path: "/warranties"
    description: "List warranties. Reverse-reachability for Warranty.project_id."
    roles: [ProjectManager, FinanceOfficer, HomeownerClient]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: Warranty[]
    side_effects: []

  # ---- financing ----
  - method: POST
    path: "/financing-applications"
    description: "Submit a financing application for a project."
    roles: [HomeownerClient, ProjectManager]
    code: 201
    input: [project_id, client_id, requested_amount_cents, term_months]
    output: FinancingApplication
    side_effects: ["create FinancingApplication SUBMITTED"]
  - method: GET
    path: "/financing-applications/{id}"
    description: "Fetch a FinancingApplication with computed monthly_payment_cents and dti_ratio."
    roles: [FinanceOfficer, HomeownerClient, ProjectManager]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []
  - method: GET
    path: "/financing-applications"
    description: "List financing applications. Reverse-reachability for FinancingApplication.project_id and FinancingApplication.client_id."
    roles: [FinanceOfficer, HomeownerClient, ProjectManager]
    code: 200
    input: ["project_id?", "client_id?", "limit?", "offset?"]
    output: FinancingApplication[]
    side_effects: []
  - method: POST
    path: "/financing-applications/{id}/decide"
    description: "FinanceOfficer decides the application; computes monthly_payment_cents then dti_ratio, applies DTI + principal gates."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["compute monthly_payment_cents (calc financing_monthly_payment)", "compute dti_ratio (calc financing_dti)", "FinancingApplication -> APPROVED or DECLINED"]

  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to real wall-clock time. Used to make delivery-ETA and window gates deterministic."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["set logical clock"]

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or malformed on a protected endpoint"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not permitted for this endpoint per RBAC"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FinanceOfficer releasing a draw is the same StaffMember who approved it"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path-referenced resource or body FK does not resolve to an existing entity"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad type, enum value out of set, or numeric range violated"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested transition is allowed"
  - id: ERR_BASELINE_EXISTS
    http: 409
    condition: "attempting to promote a second Estimate to BASELINE while one already exists for the project"
  - id: ERR_EMPTY_ESTIMATE
    http: 422
    condition: "promoting an Estimate to BASELINE with zero EstimateLineItem rows"
  - id: ERR_COMPLIANCE_NOT_CLEARED
    http: 409
    condition: "confirming a WorkSchedule while Project.compliance_status != CLEARED"
  - id: ERR_MATERIAL_NOT_DELIVERED
    http: 409
    condition: "confirming a WorkSchedule while the project's MaterialOrder is not DELIVERED"
  - id: ERR_WIND_EXCEEDS_LIMIT
    http: 409
    condition: "reweather with forecast_wind_mph still greater than the assigned Crew.max_wind_mph"
  - id: ERR_CREW_OVERLAP
    http: 409
    condition: "confirming a WorkSchedule whose [start,end) half-open interval overlaps another CONFIRMED window for the same crew"
  - id: ERR_SITE_WINDOW_CONFLICT
    http: 409
    condition: "confirming a WorkSchedule whose 24h-buffered closed interval overlaps/touches another CONFIRMED window for the same project (site can host only one trade window at a time)"
  - id: ERR_DELIVERY_TOO_EARLY
    http: 409
    condition: "recording delivery before the logical clock reaches delivery_eta_iso"
  - id: ERR_DUAL_SIGNOFF_INCOMPLETE
    http: 409
    condition: "approving a ChangeOrder before both pm_approved and client_approved are true"
  - id: ERR_MILESTONE_INCOMPLETE
    http: 409
    condition: "approving a ProgressDraw whose referenced WorkSchedule is not COMPLETED"
  - id: ERR_DTI_EXCEEDED
    http: 422
    condition: "financing decision where computed dti_ratio > DTI_MAX (0.43)"
  - id: ERR_PRINCIPAL_EXCEEDS_CONTRACT
    http: 422
    condition: "financing requested_amount_cents exceeds Project.contract_total_cents"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the current Project.version on an OCC-guarded write"
  - id: ERR_OPEN_MILESTONES
    http: 409
    condition: "completing a project while any WorkSchedule is not terminal or any ProgressDraw is REQUESTED/APPROVED"
  - id: ERR_CANCEL_NOT_ALLOWED
    http: 409
    condition: "cancelling a project that is IN_PROGRESS/COMPLETED/CANCELLED, or omitting cancelled_reason"
  - id: ERR_VALIDATION_RANGE
    http: 422
    condition: "a numeric input violates a declared business range (e.g., milestone_pct outside (0,1], waste_factor_pct outside [0,0.50], term_months not in {60,120,180})"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register clients/staff."
    identity: "opaque"
    exclusive_operations: ["POST /clients/register", "POST /staff/register"]
    shared_operations: []
  - name: Estimator
    description: "Field estimator: records measurements and drafts estimates/line items."
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /projects/{id}/measurements"]
    shared_operations: ["POST /estimates", "POST /estimates/{id}/line-items", "GET reads on projects/measurements/estimates/line-items/staff"]
  - name: ProjectManager
    description: "Owns project lifecycle, scope, permits, scheduling, change-order approval. Cannot release draws."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/complete"
      - "POST /projects/{id}/cancel"
      - "POST /estimates/{id}/baseline"
      - "POST /permits"
      - "POST /permits/{id}/issue"
      - "POST /permits/{id}/reject"
      - "POST /material-orders"
      - "POST /material-orders/{id}/confirm"
      - "POST /material-orders/{id}/backorder"
      - "POST /material-orders/{id}/deliver"
      - "POST /material-orders/{id}/cancel"
      - "POST /change-orders/{id}/revise"
      - "POST /change-orders/{id}/approve"
      - "POST /change-orders/{id}/reject"
      - "POST /crews"
      - "POST /projects/{id}/work-schedules"
      - "POST /work-schedules/{id}/confirm"
      - "POST /work-schedules/{id}/reweather"
      - "POST /work-schedules/{id}/start"
      - "POST /work-schedules/{id}/complete"
      - "POST /work-schedules/{id}/cancel"
      - "POST /projects/{id}/progress-draws"
      - "POST /progress-draws/{id}/approve"
      - "POST /progress-draws/{id}/reject"
    shared_operations:
      - "POST /estimates"
      - "POST /estimates/{id}/line-items"
      - "POST /hoa-approvals"
      - "POST /hoa-approvals/{id}/approve"
      - "POST /hoa-approvals/{id}/deny"
      - "POST /change-orders"
      - "POST /change-orders/{id}/sign"
      - "POST /financing-applications"
      - "GET reads across the project tree"
  - name: HomeownerClient
    description: "The homeowner: approves change orders and HOA reviews, withdraws/negotiates change orders, applies for financing."
    identity: "entity_backed:HomeownerClient"
    exclusive_operations:
      - "POST /change-orders/{id}/negotiate"
      - "POST /change-orders/{id}/withdraw"
    shared_operations:
      - "POST /hoa-approvals"
      - "POST /hoa-approvals/{id}/approve"
      - "POST /hoa-approvals/{id}/deny"
      - "POST /change-orders"
      - "POST /change-orders/{id}/sign"
      - "POST /financing-applications"
      - "GET reads on own project/estimate/change-order/financing/warranty/hoa rows"
  - name: FinanceOfficer
    description: "Releases and claws back progress draws and decides financing. Segregated from the PM who approves draws."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /progress-draws/{id}/release"
      - "POST /progress-draws/{id}/clawback"
      - "POST /financing-applications/{id}/decide"
    shared_operations:
      - "GET reads across the project tree"
