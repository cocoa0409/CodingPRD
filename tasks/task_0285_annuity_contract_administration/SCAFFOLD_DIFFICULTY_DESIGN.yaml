  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_safety_wins_over_state_on_settle
        grounds:
          - validations[priority=9]
          - validations[priority=7]
          - errors[ERR_CONTRACT_FROZEN]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          business_safety (pri 9, ERR_CONTRACT_FROZEN) vs state (pri 7, ERR_INVALID_STATE):
          settling a still-REQUESTED withdrawal on a contract frozen by an open DeathClaim — the
          withdrawal state precondition (REQUESTED) is satisfied so only the frozen safety check can
          fire, yielding ERR_CONTRACT_FROZEN; the pair exercised is safety-vs-state.
