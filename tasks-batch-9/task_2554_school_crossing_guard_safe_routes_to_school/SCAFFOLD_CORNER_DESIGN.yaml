      - name: corner_school_coverage_read_matches_post_level_truth
        claim_type: computed_read
        grounds:
          - endpoints.GET_/srts/schools/{id}
          - calculations.school_coverage_posture
          - entities.GuardPost.fields.coverage_status
        distinguishing_aspect: |
          The school's four derived coverage fields must be reconcilable against the
          per-post reads in the same fixture with no absence involved at all: post NW holds
          a SCHEDULED assignment and reads COVERED, post SE was activated and never staffed
          and reads UNSTAFFED, so active 2 / covered 1 / uncovered 1 gives exactly 50.00 —
          and 50.00 is RESTRICTED, not SUSPENDED, because the suspension comparison is
          strict. An UNSTAFFED post counts toward uncovered_post_count exactly like a post
          with an open gap.
        test_recipe:
          setup:
            - "WARRANTED intersection; post NW (AM) activated and staffed by Rita 2026-09-08 -> 2026-09-18; post SE (PM) activated last and left unstaffed."
