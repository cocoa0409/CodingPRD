            - "the case stays BLOCK_HELD; monitor_staff_id can only be supplied at creation, so the fix is a new case rather than a patch"

      - name: closing_a_severe_event_without_notification_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REGULATOR_NOTIFICATION_REQUIRED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / adverse_event_fork_join_regulator_track
          rationale: "The join guard on CLOSED is asserted as the failure path of that instance."

      - name: confirming_an_uncleared_case_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CASE_NOT_CLEARED]
        excluded_because:
          difficulty_instance: transitive_cascade / sentinel_event_three_hop_probation_cascade
          rationale: "Cases pushed to DEFERRED by the cascade are shown to fail confirmation with that error there."

      - name: incomplete_prerequisite_blocks_confirmation
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PREREQUISITE_CASE_INCOMPLETE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / drill_safety_59_beats_prerequisite_constraint_70
          rationale: "That instance asserts the prerequisite error once the higher-priority drill rule is satisfied."

      - name: holding_another_surgeons_block_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BLOCK_SURGEON_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_75_beats_temporal_76_on_hold_block
          rationale: "Asserted as the winning error of that priority pair."

      - name: overlapping_room_use_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ROOM_TURNOVER_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / operating_room_turnover_buffer_overlap
          rationale: "The buffered-interval collision is asserted there."

      - name: monitor_assigned_to_two_overlapping_cases_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MONITOR_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / monitor_half_open_overlap_without_buffer
          rationale: "The half-open monitor overlap is asserted there."

      - name: recovery_bays_oversubscribed_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RECOVERY_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / recovery_bay_pool_postop_window_capacity
          rationale: "The peak-concurrency refusal is asserted there."

      - name: under_fasted_case_cannot_be_cleared
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FASTING_REQUIREMENT_UNMET]
        excluded_because:
          difficulty_instance: boundary_precision_check / npo_minutes_exactly_at_the_480_and_120_floors
          rationale: "Both floors are probed one minute either side there."

      - name: missing_escort_cannot_be_cleared
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ESCORT_REQUIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / auth_9_beats_fasting_safety_62
          rationale: "That instance asserts the escort gate once the auth and fasting rules are satisfied."

      - name: self_review_of_a_case_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / auth_9_beats_fasting_safety_62
          rationale: "The same-person refusal is the asserted winner of that pair."

      - name: auto_size_with_no_eligible_lot_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_ELIGIBLE_IMPLANT_LOT]
        excluded_because:
          difficulty_instance: boundary_precision_check / auto_size_tolerance_inclusive_edge_and_empty_pool
          rationale: "The empty-pool branch is asserted there."

      - name: sedated_case_without_privilege_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEDATION_PRIVILEGE_UNAVAILABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / case_confirmation_depends_on_practice_privilege_state
          rationale: "All three privilege states are driven against the same confirmation there."

      - name: reservation_against_a_quarantined_lot_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_LOT_UNAVAILABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / reservation_creation_depends_on_lot_status
          rationale: "Both the quarantined-lot and the short-stock refusals are asserted there."

  # ==========================================================================
  - section: rbac
    instances:
      - name: shared_reads_are_open_to_all_seven_roles
        claim_type: exclusive_and_shared_operations_permitted
        grounds:
          - roles[*].shared_operations
          - endpoints[GET /surgical-cases/{caseId}]
        distinguishing_aspect: "Every GET is declared shared, so the same case read must succeed under all seven role headers; the read is the only operation with a seven-role list and nothing about it narrows by role."
        test_recipe:
          setup:
            - "one practice with one DRAFT surgical case"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Shared Read OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Public", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-20T13:00:00Z", planned_end: "2026-09-20T14:00:00Z", total_charge_cents: 90000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /surgical-cases/${case_id}"
              as: PracticeAdministrator
            - call: "GET /surgical-cases/${case_id}"
              as: SchedulingCoordinator
            - call: "GET /surgical-cases/${case_id}"
              as: BenefitsSpecialist
            - call: "GET /surgical-cases/${case_id}"
              as: InventoryManager
            - call: "GET /surgical-cases/${case_id}"
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "GET /surgical-cases/${case_id}"
              as: AnesthesiaCoordinator
            - call: "GET /surgical-cases/${case_id}"
              as: QualityReviewer
              as_user_id: "${surg_id}"
          assert:
            - "all seven reads return HTTP 200 with data.id == ${case_id} and identical scheduling_status DRAFT"
            - "no read mutates the row: version is 1 in every response"

      - name: exclusive_write_endpoints_refuse_foreign_roles
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - roles[SchedulingCoordinator].exclusive_operations
          - roles[PracticeAdministrator].exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "A role outside the endpoint's declared list is refused with 403 ERR_ROLE_NOT_PERMITTED before any field validation runs, so a well-formed body from the wrong role and a malformed body from the wrong role produce the same authorization error rather than 422."
        test_recipe:
          setup:
            - "one practice with a surgeon and a patient"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Role Fence OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Fence", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-20T13:00:00Z", planned_end: "2026-09-20T14:00:00Z", total_charge_cents: 90000 }
              as: BenefitsSpecialist
              captures: { err1: $.data.error_id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-20T14:00:00Z", planned_end: "2026-09-20T13:00:00Z", total_charge_cents: 90000 }
              as: BenefitsSpecialist
              captures: { err2: $.data.error_id }
            - call: "POST /_ops/run-compliance-sweep"
              payload: {}
              as: InventoryManager
              captures: { err3: $.data.error_id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Sneaky Hire", role_type: "RECOVERY_NURSE" }
              as: Surgeon
              as_user_id: "${surg_id}"
              captures: { err4: $.data.error_id }
          assert:
            - "trigger[0]: HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "trigger[1]: HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED even though planned_end precedes planned_start - the role check outranks priority 5"
            - "trigger[2] and trigger[3]: HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "GET /surgical-cases?practice_id=${prac_id} returns total_count == 0 and GET /staff-members?practice_id=${prac_id} still returns total_count == 1"

      - name: missing_or_unknown_identity_headers_rejected
        claim_type: unauthenticated_request
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - roles[Surgeon].identity
        distinguishing_aspect: "Two different header defects collapse into one 401: an absent or unrecognised X-User-Role on any endpoint, and an absent X-User-ID on an entity_backed role even when the role name itself is valid."
        test_recipe:
          setup:
            - "one practice with a surgeon and a DRAFT case"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Identity OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Anon", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-20T13:00:00Z", planned_end: "2026-09-20T14:00:00Z", total_charge_cents: 90000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /surgical-cases/${case_id}"
              as: "<X-User-Role header omitted>"
              captures: { err1: $.data.error_id }
            - call: "GET /surgical-cases/${case_id}"
              as: "OfficeManager"
              captures: { err2: $.data.error_id }
            - call: "POST /surgical-cases/${case_id}/start-recovery"
              payload: {}
              as: Surgeon
              as_user_id: "<X-User-ID header omitted>"
              captures: { err3: $.data.error_id }
          assert:
            - "trigger[0]: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "trigger[1]: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED - OfficeManager is not one of the seven declared roles, so it is unauthenticated rather than merely unpermitted"
            - "trigger[2]: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, ahead of the DRAFT-cannot-start-recovery state error"

      - name: only_the_bound_surgeon_may_run_the_case
        claim_type: exclusive_and_shared_operations_permitted
        grounds:
          - validations[priority=8]
          - errors[ERR_ACTOR_NOT_ASSIGNED]
          - roles[Surgeon].identity
        distinguishing_aspect: "Holding the Surgeon role is not enough: both surgeons pass the role check and only the case's own primary_surgeon_id passes the actor binding, which is enforced separately on start-recovery and on complete."
