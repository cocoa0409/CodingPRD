            - {call: "GET /licenses/${lic_mtg}", payload: {}, as: ScoreConsumer, as_user_id: "${lic_mtg}", captures: {lic_mtg_v2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c902}", score_variant_id: "${v1_mtg}", bureau_id: "${b_eqf}", license_id: "${lic_mtg}", raw_posted_score: 712, expected_license_version: "${lic_mtg_v2}"}, as: ScoreConsumer, as_user_id: "${lic_mtg}"}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "XFER-02", record_count: 5000, segment_name: "PRIME", sample_kind: "VALIDATION", observation_window_months: 24, window_start_month: "2024-01", window_end_month: "2026-01"}, as: ValidationAnalyst, captures: {s2: $.data.id}}
