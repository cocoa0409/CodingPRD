      - name: request_without_a_declared_role_header_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - roles
        distinguishing_aspect: "Authentication is priority 1, ahead of everything: a call with no X-User-Role header, a call with no X-User-ID header and a call naming a role that does not exist in §1.6 all return ERR_UNAUTHENTICATED (401) even when the target resource is missing and the body is malformed, so no 404, 403 or 400 can ever be observed first."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one campus exists so that at least one legal target is available."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
          trigger:
            - call: "GET /recycling/facilities/${fac_id}"
              payload: {}
              as: "<X-User-Role header omitted entirely>"
            - call: "GET /recycling/facilities/${fac_id}"
              payload: {}
              as: PlantOperator
              as_user_id: "<X-User-ID header omitted entirely>"
            - call: "GET /recycling/facilities/bbbbbbbb-0000-4000-8000-000000000001"
              payload: {}
              as: "WarehouseKeeper"
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "bbbbbbbb-0000-4000-8000-000000000002", facility_id: "${fac_id}", declared_chemistry: "LTO", gross_mass_kg: 110.0, packaging_tare_kg: 10.0 }
              as: "WarehouseKeeper"
          assert:
            - "All four calls return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "Call 3 returns 401 rather than 404 even though the facility id does not exist, because authentication (priority 1) precedes path existence (priority 5)"
            - "Call 4 returns 401 rather than 400 or 403 even though its declared_chemistry is out of range and its supplier_id is unresolvable, because authentication precedes body shape (priority 4), authorization (2) and FK existence (6)"
            - "GET /recycling/intakes as PlatformAdmin reports total_count == 0 - no unauthenticated call had any effect"

      - name: manifest_close_and_reject_both_require_the_submitted_status
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MANIFEST_NOT_SUBMITTED]
          - state_machines.HazmatManifest
          - state_machines.Intake.compliance_state
        distinguishing_aspect: "CLOSED is terminal for a manifest, so the very next close AND the reject of the same revision both fail with ERR_MANIFEST_NOT_SUBMITTED - the error is a property of the manifest row, not of the trigger - and neither refused call rolls the intake's compliance_state back out of MANIFEST_CLOSED."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z; one NMC622 intake at custody PACKAGED whose first manifest was submitted by co-submitter-1."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
