        distinguishing_aspect: "Two RegionalAdministrator exclusive operations are refused to a HazardAnalyst with 403 ERR_ROLE_NOT_PERMITTED even when the payload is perfectly well formed, while the same analyst can read the same collections."
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction and one CapitalProgram created by the administrator."
