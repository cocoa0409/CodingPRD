            - "after trigger call 2, CreditBatch.${batch_a_id}.verified_ratio == 1.0000"
            - "after trigger call 2, CreditBatch.${batch_a_id}.issued_lbs == 520 (issued_lbs is never restated by reverification)"
            - "trigger call 3 responds 200 with data.status == LISTED"
            - "after trigger call 3, CreditBatch.${batch_a_id}.listed_at == 2026-06-15T00:00:00Z"
            - "after trigger call 3, CreditBatch.${batch_a_id}.available_lbs == 520.00"

      - name: permit_finalization_gated_on_tmdl_approval_then_tightened_limit_flips_compliance
