            - call: "POST /api/objector-cases/${c2}/set-rate"
              payload: { chargeable_share_pct: 101 }
              as: LocalAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "pct 0: ${cum0} == 1000 (full dues rebated)"
            - "pct 100: ${cum1} == 0 and ${s1} == REBATE_ISSUED (zero rebate still issues)"
            - "pct 101 on the FILED case c2 (state guard passes from FILED): ${err} == ERR_PCT_OUT_OF_RANGE (422)"

