            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-CE3", product_name: "Planter Box", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Compliance Group", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-07-01T00:00:00Z", served_at: "2026-07-15T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nov_1: $.data.id }
