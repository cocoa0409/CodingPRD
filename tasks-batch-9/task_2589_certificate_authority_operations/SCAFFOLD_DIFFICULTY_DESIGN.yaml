# §1.8 Scaffold Difficulty Design for task_2589_certificate_authority_operations.
# Every instance grounds exclusively in SCAFFOLD.yaml §1.1-§1.7. Deleting this file
# leaves the declared behaviour identical; it only makes coverage harder to audit.
# The logical clock starts at the fixed default 2026-08-01T00:00:00Z, so any chain
# that does not call POST /_clock/set_current_utc runs at exactly that instant.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: validity_window_projected_at_clearance_vs_final_at_issuance
        grounds:
          - calculations.certificate_validity_window
          - entities.CertificateRequest.fields.projected_not_after
          - entities.Certificate.fields.not_after
          - entities.Certificate.fields.validity_days_final
          - state_machines.CertificateRequest.SUBMITTED_to_READY_TO_ISSUE
          - state_machines.CertificateRequest.READY_TO_ISSUE_to_ISSUED
        distinguishing_aspect: |
          This dual variant lives in the certificate time domain: PROJECTED_AT_CLEARANCE
          caps validity only by min(requested_validity_days, profile.max_validity_days)
          from the clearance clock, while FINAL_AT_ISSUANCE additionally floors not_after
          by the consumed authorizations' expires_at and the ceremony's
          attestation_expires_at, so the same request yields projected_not_after
          2026-11-03T00:00:00Z but not_after 2026-08-31T00:00:00Z - 64 days earlier.
        test_recipe:
          setup:
            - "An ACTIVE EV profile with max_validity_days 90, dcv_reuse_days 30, org_vetting_reuse_days 60, base_fee_cents 10085, required_sct_count 2, crl_trigger_threshold 100, max_crl_validity_hours 24."
            - "An ACTIVE subscriber with credit_limit_cents 10000000 holding an APPROVED EV OrganizationVetting approved at 2026-08-01T00:00:00Z."
            - "Two VALIDATED domain authorizations for a.example.com and b.example.com validated at 2026-08-01T00:00:00Z, both expiring 2026-08-31T00:00:00Z."
            - "An ATTESTED key ceremony on an OPERATIONAL partition, attested at 2026-08-02T04:00:00Z with attestation_expires_at 2026-11-30T04:00:00Z."
            - "A two-domain, 90-day, expedited request cleared at 2026-08-05T00:00:00Z and issued at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "ev-global-1", validation_type: "EV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 2, org_vetting_reuse_days: 60, allowed_dcv_methods: ["DNS_TXT", "HTTP_TOKEN"], required_sct_count: 2, base_fee_cents: 10085, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { prof_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${prof_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Acme Holdings BV", jurisdiction_code: "NL", registry_id: "NL-33012345", contact_email: "ops@acme.example", callback_phone: "+31205550100", credit_limit_cents: 10000000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/subscribers/${sub_id}/organization-vettings"
              payload: { required_level: "EV" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { vet_id: $.data.id }
            - call: "POST /ca/organization-vettings/${vet_id}/checks"
              payload: { dimension: "REGISTRY", outcome: "PASSED", evidence_ref: "kvk-extract-2026-08-01" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/organization-vettings/${vet_id}/checks"
              payload: { dimension: "CALLBACK", outcome: "PASSED", evidence_ref: "call-log-8891" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/organization-vettings/${vet_id}/checks"
              payload: { dimension: "AUTHORITY", outcome: "PASSED", evidence_ref: "authority-letter-77" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/organization-vettings/${vet_id}/approve"
              payload: {}
              as: VETTING_APPROVER
              as_user_id: "u_appr_1"
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", domain_name: "a.example.com", method: "DNS_TXT" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_a_id: $.data.id, auth_a_tok: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_a_id}/validate"
              payload: { challenge_token: "${auth_a_tok}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", domain_name: "b.example.com", method: "HTTP_TOKEN" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_b_id: $.data.id, auth_b_tok: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_b_id}/validate"
              payload: { challenge_token: "${auth_b_tok}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/hsm-partitions"
              payload: { label: "part-a", serial: "HSM-0001" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { part_id: $.data.id }
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T04:00:00Z", attestation_valid_days: 120 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer_id: $.data.id }
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T04:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/attest"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/certificate-requests"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", requested_domains: ["a.example.com", "b.example.com"], requested_validity_days: 90, csr_key_bits: 3072, expedited: true }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { req_id: $.data.id }
            - call: "POST /ca/certificate-requests/${req_id}/submit"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/certificate-requests/${req_id}/clear-validation"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { proj_not_after: $.data.projected_not_after }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
          trigger:
            - call: "POST /ca/certificate-requests/${req_id}/issue"
              payload: { ceremony_id: "${cer_id}" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_9"
              captures: { cert_id: $.data.id }
          assert:
            - "CertificateRequest.${req_id}.projected_not_before == 2026-08-05T00:00:00Z"
            - "CertificateRequest.${req_id}.projected_not_after == 2026-11-03T00:00:00Z"
            - "Certificate.${cert_id}.not_before == 2026-08-10T00:00:00Z"
            - "Certificate.${cert_id}.not_after == 2026-08-31T00:00:00Z"
            - "Certificate.${cert_id}.not_after != CertificateRequest.${req_id}.projected_not_after (the FINAL variant lands 64 days earlier because the domain-authorization reuse floor binds)"
            - "Certificate.${cert_id}.validity_days_final == 21"
            - "Certificate.${cert_id}.dcv_methods_used == [DNS_TXT, HTTP_TOKEN]"
            - "Certificate.${cert_id}.lifecycle_status == PREISSUANCE and Certificate.${cert_id}.revocation_status == NONE"
      - name: subscriber_risk_operational_vs_audit_final_variant
        grounds:
          - calculations.subscriber_risk_score
          - entities.Subscriber.fields.risk_score_operational
          - entities.Subscriber.fields.risk_score_audit_final
          - state_machines.MisissuanceIncident.REMEDIATED_to_CLOSED
          - state_machines.RootProgramAudit.FIELDWORK_to_UNQUALIFIED
        distinguishing_aspect: |
          This dual variant lives in the subscriber risk domain, not the certificate time
          domain: OPERATIONAL sums full category weights over non-CLOSED incidents with no
          decay and returns the integer 25, while AUDIT_FINAL re-admits the CLOSED
          KEY_COMPROMISE incident at half weight and multiplies both terms by the 0.8 age
          decay, returning 36.00 for exactly the same two incidents.
        test_recipe:
          setup:
            - "An ACTIVE DV profile and one ACTIVE subscriber."
            - "Incident i1 (KEY_COMPROMISE, empty scope) discovered 2026-08-01T00:00:00Z, disclosed and then CLOSED."
            - "Incident i2 (DOMAIN_MISISSUANCE, empty scope) discovered 2026-08-01T00:00:00Z, disclosed and left DISCLOSED."
            - "A MOZILLA audit for 2026-01-01T00:00:00Z..2026-12-31T00:00:00Z carrying exactly one MINOR finding, opined at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "dv-basic-1", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 2, org_vetting_reuse_days: 30, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 8000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { prof_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${prof_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Bravo Ltd", jurisdiction_code: "GB", registry_id: "GB-09112233", contact_email: "ops@bravo.example", callback_phone: "+442075550111", credit_limit_cents: 1000000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/misissuance-incidents"
              payload: { title: "compromised issuing key material", category: "KEY_COMPROMISE", scope_profile_id: "${prof_id}", scope_issued_from: "2026-07-01T00:00:00Z", scope_issued_to: "2026-07-31T00:00:00Z", subscriber_id: "${sub_id}" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { inc1_id: $.data.id }
            - call: "POST /ca/misissuance-incidents/${inc1_id}/disclose"
              payload: { root_program: "MOZILLA", body: "key compromise disclosure, no certificates in scope" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/misissuance-incidents/${inc1_id}/close"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/misissuance-incidents"
              payload: { title: "wildcard issued outside validated scope", category: "DOMAIN_MISISSUANCE", scope_profile_id: "${prof_id}", scope_issued_from: "2026-07-01T00:00:00Z", scope_issued_to: "2026-07-31T00:00:00Z", subscriber_id: "${sub_id}" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { inc2_id: $.data.id }
            - call: "POST /ca/misissuance-incidents/${inc2_id}/disclose"
              payload: { root_program: "MOZILLA", body: "domain misissuance disclosure" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/root-program-audits"
              payload: { root_program: "MOZILLA", period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { aud_id: $.data.id }
            - call: "POST /ca/root-program-audits/${aud_id}/findings"
              payload: { severity: "MINOR", summary: "CRL publication log retained only 90 days" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
          trigger:
            - call: "POST /ca/root-program-audits/${aud_id}/opine"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_2"
          assert:
            - "Subscriber.${sub_id}.risk_score_operational == 25"
            - "Subscriber.${sub_id}.risk_score_audit_final == 36.00"
            - "Subscriber.${sub_id}.risk_score_audit_final != Subscriber.${sub_id}.risk_score_operational"
            - "RootProgramAudit.${aud_id}.state == UNQUALIFIED"
            - "RootProgramAudit.${aud_id}.assessed_subscriber_count == 1"
            - "RootProgramAudit.${aud_id}.retired_profile_count == 0"
            - "CertificateProfile.${prof_id}.status == ACTIVE (an UNQUALIFIED opinion retires nothing)"
  - rule_id: combinatorial_formula
    instances:
      - name: issuance_charge_pinned_six_step_evaluation_order
        grounds:
          - calculations.issuance_charge_settlement
          - entities.CertificateRequest.fields.projected_charge_cents
          - entities.Certificate.fields.charged_amount_cents
          - entities.Subscriber.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Mode (c) - a pinned multi-step evaluation order. The volume band is keyed on the
          PRE-DISCOUNT subtotal 50426 and is never re-derived after the 10% discount drops
          the running total to 45383, and the per-domain unit is rounded BEFORE the domain
          multiplication. Re-deriving the band after the discount, or applying the expedite
          fee before the discount, or rounding the product instead of the unit, each yields
          a different integer (63033 / 50425-based totals) from the correct 56729.
        test_recipe:
          setup:
            - "An ACTIVE EV profile with base_fee_cents 10085 (EV multiplier 2.5 makes the unit price land on a half cent) and max_validity_days 90."
            - "An ACTIVE subscriber with credit_limit_cents 10000000, zero outstanding balance and an APPROVED EV vetting."
            - "Two VALIDATED authorizations (DNS_TXT + HTTP_TOKEN) and one ATTESTED ceremony."
            - "A two-domain expedited request in state SUBMITTED, so the subtotal 50426 sits just inside the [50000, 149999] 10% band while the discounted subtotal 45383 does not."
          setup_api_calls:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "ev-global-1", validation_type: "EV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 2, org_vetting_reuse_days: 60, allowed_dcv_methods: ["DNS_TXT", "HTTP_TOKEN"], required_sct_count: 2, base_fee_cents: 10085, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { prof_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${prof_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/subscribers"
              payload: { legal_name: "Acme Holdings BV", jurisdiction_code: "NL", registry_id: "NL-33012345", contact_email: "ops@acme.example", callback_phone: "+31205550100", credit_limit_cents: 10000000 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { sub_id: $.data.id }
            - call: "POST /ca/subscribers/${sub_id}/organization-vettings"
              payload: { required_level: "EV" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { vet_id: $.data.id }
            - call: "POST /ca/organization-vettings/${vet_id}/checks"
              payload: { dimension: "REGISTRY", outcome: "PASSED", evidence_ref: "kvk-extract-2026-08-01" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/organization-vettings/${vet_id}/checks"
              payload: { dimension: "CALLBACK", outcome: "PASSED", evidence_ref: "call-log-8891" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/organization-vettings/${vet_id}/checks"
              payload: { dimension: "AUTHORITY", outcome: "PASSED", evidence_ref: "authority-letter-77" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/organization-vettings/${vet_id}/approve"
              payload: {}
              as: VETTING_APPROVER
              as_user_id: "u_appr_1"
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", domain_name: "a.example.com", method: "DNS_TXT" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_a_id: $.data.id, auth_a_tok: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_a_id}/validate"
              payload: { challenge_token: "${auth_a_tok}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/domain-authorizations"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", domain_name: "b.example.com", method: "HTTP_TOKEN" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_b_id: $.data.id, auth_b_tok: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_b_id}/validate"
              payload: { challenge_token: "${auth_b_tok}" }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /ca/hsm-partitions"
              payload: { label: "part-a", serial: "HSM-0001" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { part_id: $.data.id }
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T04:00:00Z", attestation_valid_days: 120 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer_id: $.data.id }
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T04:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/attest"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/certificate-requests"
              payload: { subscriber_id: "${sub_id}", profile_id: "${prof_id}", requested_domains: ["a.example.com", "b.example.com"], requested_validity_days: 90, csr_key_bits: 3072, expedited: true }
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { req_id: $.data.id }
            - call: "POST /ca/certificate-requests/${req_id}/submit"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
          trigger:
            - call: "POST /ca/certificate-requests/${req_id}/clear-validation"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { charge: $.data.projected_charge_cents }
            - call: "POST /ca/certificate-requests/${req_id}/issue"
              payload: { ceremony_id: "${cer_id}" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_9"
              captures: { cert_id: $.data.id }
          assert:
            - "CertificateRequest.${req_id}.projected_charge_cents == 56729"
            - "CertificateRequest.${req_id}.projected_charge_cents != 63033 (the value produced when the volume discount is skipped or the expedite fee is applied to the pre-discount subtotal)"
            - "CertificateRequest.${req_id}.projected_charge_cents != 56728 (the value produced by rounding base_fee_cents * 2.5 * 2 = 50425 instead of rounding the 25213 unit first)"
            - "Certificate.${cert_id}.charged_amount_cents == 56729 (issue re-runs the same pinned order and lands on the identical integer)"
            - "Subscriber.${sub_id}.outstanding_balance_cents == 56729"
            - "Subscriber.${sub_id}.outstanding_balance_cents <= Subscriber.${sub_id}.credit_limit_cents"
      - name: remediation_penalty_round_per_certificate_then_sum
        grounds:
          - calculations.incident_remediation_penalty
          - calculations.mass_revocation_scope_selection
          - entities.MisissuanceIncident.fields.penalty_total_cents
          - state_machines.MisissuanceIncident.DISCLOSED_to_REMEDIATED
        distinguishing_aspect: |
          Mode (b) - a pinned rounding boundary rather than a pinned step order. Both
          certificates in the batch are engineered so their residual fractions produce
          299.5 and 1949.75 unrounded cents: rounding per certificate and then summing
          gives 300 + 1950 = 2250, while summing first (2249.25) and rounding once gives
          2249. The two orders differ by exactly one cent, which no reordering of the
          charge formula in the sibling instance can produce.
        test_recipe:
          setup:
            - "An ACTIVE DV profile with dcv_reuse_days 1 so the DCV reuse floor - not the 90-day profile cap - pins each certificate's not_after."
            - "Authorization A validated at 2026-08-01T00:00:00Z (expires 2026-08-02T00:00:00Z) and authorization B validated at 2026-08-01T02:00:00Z (expires 2026-08-02T02:00:00Z)."
            - "Certificate C1 issued at 2026-08-01T22:53:20Z, giving a 4000-second window; certificate C2 issued at 2026-08-01T23:46:40Z, giving an 8000-second window."
            - "A DISCLOSED DOMAIN_MISISSUANCE incident (weight 2.0) scoped to the profile over [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z), and the clock parked at 2026-08-01T23:50:01Z so the residuals are 599/4000 and 7799/8000."
