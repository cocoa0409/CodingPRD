scenario: "2409. Fountain Beverage Equipment Service & Syrup Supply (Coca-Cola Freestyle service network): equipment placement agreement with volume commitment and free-on-loan terms, cartridge and bag-in-box supply forecasting by outlet throughput, telemetry-driven low-supply alerting and route replenishment, preventive maintenance schedule and brix/ratio calibration, service call dispatch with parts inventory on the van, sanitation cycle compliance and water filter change intervals, outlet volume shortfall and equipment recall or fee, brand mix reporting and promotional flavor availability"
domain_name: "fountain-beverage-service-network"
api_prefix: "/fountain-network"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities joined by foreign keys; no nesting of entity ids in URL paths.
  # Every collection hangs directly off /fountain-network, and every FK is
  # discoverable through a filtered list endpoint.

  state_machine_shape: cyclic
  # Outlet ACTIVE<->SUSPENDED, PlacementAgreement ACTIVE<->SHORTFALL_REVIEW and
  # ServiceCall DISPATCHED->ON_SITE->ESCALATED->DISPATCHED all loop back.
  # DispenserUnit additionally carries two independent state dimensions
  # (status x calibration_status), and RouteStop is fork-join (SERVED | SKIPPED).

  relationship_patterns:
    - one_to_many        # Outlet -> PlacementAgreement -> DispenserUnit -> MaintenanceTask
    - cross_aggregate    # OutletSupplyPosition points at a RouteStop in the route aggregate

  role_model: segregation_of_duties
  # Two enforced separations keyed on X-User-ID:
  #   (1) the user who assessed an agreement shortfall may not decide its recall
  #   (2) the user who placed an Outlet compliance hold may not waive the
  #       MaintenanceTask whose overdue status justified that hold

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Outlet
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Trading name of the customer location that hosts the dispensers."
      - name: account_code
        type: string
        source: input
        description: "Operator-assigned account code for the outlet."
        constraints: "Unique across all Outlet rows; ERR_DUPLICATE_ACCOUNT_CODE on collision."
      - name: region_code
        type: string
        source: input
        description: "Depot region the outlet is served from; must equal ReplenishmentRoute.depot_region_code for a stop to be creatable."
      - name: throughput_tier
        type: enum
        source: input
        description: "Volume band used by the THROUGHPUT_PROJECTED forecast variant."
        default: "MEDIUM"
        constraints: "One of SMALL, MEDIUM, LARGE."
      - name: water_hardness_gpg
        type: number
        source: input
        description: "Feed-water hardness in grains per gallon; derates water-filter gallon intervals above 10 gpg."
        default: 10
        constraints: ">= 0 and <= 60."
      - name: status
        type: enum
        source: system
        description: "Commercial lifecycle of the outlet."
        default: "ACTIVE"
        constraints: "One of ACTIVE, SUSPENDED, CLOSED. Written only by state_machines.Outlet transitions."
      - name: service_posture
        type: enum
        source: computed
        description: "Derived compliance gate recomputed by calculations.outlet_service_posture after every change to open_compliance_hold_count or overdue_task_count."
        default: "OPEN"
        constraints: "One of OPEN, RESTRICTED, FROZEN."
      - name: open_compliance_hold_count
        type: integer
        source: computed
        description: "Number of currently open sanitation/compliance holds placed on this outlet."
        default: 0
        constraints: ">= 0."
      - name: overdue_task_count
        type: integer
        source: computed
        description: "Number of MaintenanceTask rows in status OVERDUE across all DispenserUnit rows of this outlet."
        default: 0
        constraints: ">= 0."
      - name: last_hold_placed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who placed the most recent still-open compliance hold; null when open_compliance_hold_count == 0. Segregation-of-duties input for maintenance waivers."
        default: null

  - name: PlacementAgreement
    parent: Outlet
    common_fields: true
    fields:
      - name: outlet_id
        type: string
        source: input
        description: "FK -> Outlet.id; the outlet whose equipment this agreement governs."
      - name: term_start_date
        type: datetime
        source: input
        description: "Inclusive start of the agreement term (ISO 8601 UTC)."
      - name: term_end_date
        type: datetime
        source: input
        description: "Exclusive end of the agreement term (ISO 8601 UTC); must be strictly after term_start_date."
      - name: annual_commitment_gallons
        type: number
        source: input
        description: "Committed finished-beverage gallons per contract year; quartered exactly (no rounding) by calculations.agreement_shortfall_fee."
        constraints: "> 0."
      - name: free_on_loan
        type: boolean
        source: input
        description: "True when equipment is placed free-on-loan and may therefore be recalled for shortfall; false means the outlet purchased the equipment and only a fee is available."
        default: true
      - name: shortfall_fee_cents_per_gallon
        type: integer
        source: input
        description: "Cents charged per shortfall gallon in each assessed calendar quarter."
        default: 50
        constraints: ">= 0."
      - name: equipment_value_cents
        type: integer
        source: input
        description: "Undepreciated placement value in cents of ONE dispenser unit under this agreement; input to calculations.equipment_recall_exposure."
        constraints: "> 0."
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle."
        default: "DRAFT"
        constraints: "One of DRAFT, ACTIVE, SHORTFALL_REVIEW, RECALL_PENDING, TERMINATED, EXPIRED."
      - name: assessed_shortfall_gallons
        type: number
        source: computed
        description: "Sum of per-quarter shortfall gallons from the most recent assessment, rounded half-up to 2 decimals."
        default: 0
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: "Sum of per-quarter rounded fee amounts in cents from the most recent assessment."
        default: 0
      - name: exposure_variant
        type: enum
        source: input
        description: "Which variant of calculations.equipment_recall_exposure the current assessment used."
        default: "BOOK_VALUE"
        constraints: "One of BOOK_VALUE, REPLACEMENT_RISK."
      - name: recall_exposure_cents
        type: integer
        source: computed
        description: "Equipment exposure in cents produced by calculations.equipment_recall_exposure under exposure_variant; gates the RECALL outcome."
        default: 0
      - name: assessment_period_start
        type: datetime
        source: system
        description: "Inclusive start of the period covered by the most recent shortfall assessment."
        default: null
      - name: assessment_period_end
        type: datetime
        source: system
        description: "Exclusive end of the period covered by the most recent shortfall assessment."
        default: null
      - name: shortfall_assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the NetworkAdmin who ran the most recent shortfall assessment; segregation-of-duties input for the recall decision."
        default: null
      - name: recall_decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who recorded the recall decision."
        default: null

  - name: DispenserUnit
    parent: PlacementAgreement
    common_fields: true
    fields:
      - name: outlet_id
        type: string
        source: input
        description: "FK -> Outlet.id; physical location of the unit. Must equal the outlet_id of agreement_id."
      - name: agreement_id
        type: string
        source: input
        description: "FK -> PlacementAgreement.id; the placement agreement that covers this unit."
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial of the dispenser."
        constraints: "Unique across all DispenserUnit rows; ERR_DUPLICATE_SERIAL_NUMBER on collision."
      - name: model_code
        type: string
        source: input
        description: "Equipment model identifier, e.g. FREESTYLE_9100."
      - name: installed_at
        type: datetime
        source: input
        description: "Installation timestamp; age driver for calculations.equipment_recall_exposure."
      - name: status
        type: enum
        source: system
        description: "Service dimension of the unit; evolves independently of calibration_status."
        default: "IN_SERVICE"
        constraints: "One of IN_SERVICE, SERVICE_HOLD, RECALL_STAGED, RETURNED."
      - name: calibration_status
        type: enum
        source: computed
        description: "Brix/ratio dimension of the unit; evolves independently of status and is written only by BRIX_CALIBRATION task completion."
        default: "UNVERIFIED"
        constraints: "One of UNVERIFIED, IN_SPEC, OUT_OF_SPEC."
      - name: lifetime_dispensed_gallons
        type: number
        source: computed
        description: "Running sum of TelemetryReading.dispensed_ounces for this unit divided by 128, rounded half-up to 2 decimals."
        default: 0
      - name: gallons_at_last_filter_change
        type: number
        source: system
        description: "Value of lifetime_dispensed_gallons at the moment the most recent FILTER_CHANGE task was completed; baseline for the gallon-interval breach test."
        default: 0
      - name: brix_ratio_last_measured
        type: number
        source: system
        description: "Most recently measured syrup-to-water brix ratio, e.g. 5.10."
        default: null

  - name: SupplyItem
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Cartridge or bag-in-box SKU code."
        constraints: "Unique across all SupplyItem rows; ERR_DUPLICATE_SKU_CODE on collision."
      - name: brand_name
        type: string
        source: input
        description: "Brand the SKU dispenses; grouping key for the brand mix report."
      - name: supply_form
        type: enum
        source: input
        description: "Packaging form of the consumable."
        constraints: "One of CARTRIDGE, BAG_IN_BOX."
      - name: case_pack_units
        type: integer
        source: input
        description: "Units per shippable case; allocations are truncated to whole cases."
        constraints: ">= 1."
      - name: ounces_per_unit
        type: number
        source: input
        description: "Finished-beverage ounces one unit yields; converts telemetry ounces into units."
        constraints: "> 0."
      - name: promotional
        type: boolean
        source: input
        description: "True for limited-time promotional flavors whose supply is only forecastable inside the promo window."
        default: false
      - name: promo_window_start
        type: datetime
        source: input
        description: "Inclusive start of the promotional availability window; null for non-promotional SKUs."
        default: null
      - name: promo_window_end
        type: datetime
        source: input
        description: "Exclusive end of the promotional availability window; null for non-promotional SKUs."
        default: null
      - name: national_allocation_units
        type: integer
        source: input
        description: "Total units of this SKU the network may commit to routes; the finite pool for calculations.route_allocation_waterfall."
        default: 0
        constraints: ">= 0."
      - name: reserved_pool_units
        type: integer
        source: computed
        description: "Units of national_allocation_units currently committed to route stops; equals the sum of OutletSupplyPosition.allocated_units for this SKU."
        default: 0
        constraints: ">= 0 and <= national_allocation_units."

  - name: TelemetryReading
    parent: DispenserUnit
    common_fields: false
    fields:
      - name: dispenser_unit_id
        type: string
        source: input
        description: "FK -> DispenserUnit.id; the unit that reported the pour volume."
      - name: supply_item_id
        type: string
        source: input
        description: "FK -> SupplyItem.id; the SKU whose consumption is reported."
      - name: dispensed_ounces
        type: number
        source: input
        description: "Finished-beverage ounces dispensed in the reported window."
        constraints: ">= 0."
      - name: reading_at
        type: datetime
        source: input
        description: "End timestamp of the reported window; must be <= the logical clock."
      - name: window_days
        type: integer
        source: input
        description: "Length in days of the window this reading summarises."
        default: 7
        constraints: ">= 1 and <= 90."
      - name: source
        type: enum
        source: input
        description: "How the reading was obtained."
        default: "TELEMETRY"
        constraints: "One of TELEMETRY, MANUAL_AUDIT."

  - name: OutletSupplyPosition
    parent: Outlet
    common_fields: true
    fields:
      - name: outlet_id
        type: string
        source: input
        description: "FK -> Outlet.id; the outlet whose stock position this row tracks."
      - name: supply_item_id
        type: string
        source: input
        description: "FK -> SupplyItem.id; the SKU this position tracks."
        constraints: "The pair (outlet_id, supply_item_id) is unique; ERR_DUPLICATE_SUPPLY_POSITION on collision."
      - name: on_hand_units
        type: integer
        source: input
        description: "Units physically at the outlet."
        default: 0
        constraints: ">= 0."
      - name: forecast_variant
        type: enum
        source: system
        description: "Variant of calculations.outlet_supply_forecast used by the most recent forecast run."
        default: "TRAILING_ACTUAL"
        constraints: "One of TRAILING_ACTUAL, THROUGHPUT_PROJECTED."
      - name: forecast_units
        type: number
        source: computed
        description: "Net units needed over the 14-day horizon from the most recent forecast run, rounded half-up to 2 decimals."
        default: 0
      - name: requested_units
        type: integer
        source: computed
        description: "ceil(forecast_units); the quantity offered to calculations.route_allocation_waterfall."
        default: 0
      - name: allocated_units
        type: integer
        source: computed
        description: "Whole-case units currently committed to planned_route_stop_id; released back to zero when the stop is skipped or the route is cancelled."
        default: 0
        constraints: ">= 0."
      - name: planned_route_stop_id
        type: string
        source: computed
        description: "FK -> RouteStop.id; the stop that will deliver allocated_units. Null whenever allocated_units == 0."
        default: null
      - name: alert_level
        type: enum
        source: computed
        description: "Low-supply alert band from the most recent forecast run."
        default: "NONE"
        constraints: "One of NONE, LOW, CRITICAL."
      - name: promo_suppressed
        type: boolean
        source: computed
        description: "True when the SKU is promotional and the logical clock sits outside its promo window, which forces forecast_units to 0.00 and blocks allocation."
        default: false
      - name: alert_acknowledged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the OutletManager who acknowledged the current alert; reset to null on every forecast run."
        default: null

  - name: ReplenishmentRoute
    parent: null
    common_fields: true
    fields:
      - name: route_code
        type: string
        source: input
        description: "Operator-assigned route identifier."
        constraints: "Unique across all ReplenishmentRoute rows; ERR_DUPLICATE_ROUTE_CODE on collision."
      - name: depot_region_code
        type: string
        source: input
        description: "Depot region served by this route; must equal Outlet.region_code of every stop."
      - name: service_date
        type: datetime
        source: input
        description: "Date the route runs (ISO 8601 UTC, midnight)."
      - name: van_code
        type: string
        source: input
        description: "Van running the route; matched against VanPartStock.van_code for parts questions."
      - name: capacity_units
        type: integer
        source: input
        description: "Total consumable units the van can carry on this route."
        constraints: ">= 1."
      - name: status
        type: enum
        source: system
        description: "Route lifecycle."
        default: "PLANNED"
        constraints: "One of PLANNED, DISPATCHED, COMPLETED, CANCELLED."
      - name: committed_units
        type: integer
        source: computed
        description: "Sum of OutletSupplyPosition.allocated_units across all stops of this route; may never exceed capacity_units."
        default: 0
      - name: delivered_units
        type: integer
        source: computed
        description: "Sum of RouteStop.delivered_units across stops in status SERVED."
        default: 0

  - name: RouteStop
    parent: ReplenishmentRoute
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> ReplenishmentRoute.id; the route this stop belongs to."
      - name: outlet_id
        type: string
        source: input
        description: "FK -> Outlet.id; the outlet visited at this stop."
      - name: sequence_index
        type: integer
        source: input
        description: "Visit order within the route."
        constraints: ">= 1; unique within route_id."
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the delivery window."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the delivery window; must be strictly after window_start."
      - name: status
        type: enum
        source: system
        description: "Stop lifecycle; SERVED and SKIPPED are the two terminal branches."
        default: "PENDING"
        constraints: "One of PENDING, ARRIVED, SERVED, SKIPPED."
      - name: delivered_units
        type: integer
        source: computed
        description: "Units handed over at this stop; equals the sum of allocated_units of its positions at the moment of service."
        default: 0
      - name: skip_reason_code
        type: enum
        source: system
        description: "Why the stop was skipped; null unless status == SKIPPED."
        default: null
        constraints: "One of OUTLET_CLOSED, POSTURE_FROZEN, ACCESS_DENIED."

  - name: MaintenanceTask
    parent: DispenserUnit
    common_fields: true
    fields:
      - name: dispenser_unit_id
        type: string
        source: input
        description: "FK -> DispenserUnit.id; the unit the task services."
      - name: task_type
        type: enum
        source: input
        description: "Kind of preventive work."
        constraints: "One of PREVENTIVE, BRIX_CALIBRATION, SANITATION, FILTER_CHANGE."
      - name: due_at
        type: datetime
        source: input
        description: "Calendar deadline for the task."
      - name: gallon_interval
        type: number
        source: input
        description: "Nominal gallons-since-last-change that also trips this task; required for FILTER_CHANGE, must be null for every other task_type."
        default: null
        constraints: "> 0 when present."
      - name: status
        type: enum
        source: system
        description: "Task lifecycle."
        default: "SCHEDULED"
        constraints: "One of SCHEDULED, DUE, OVERDUE, COMPLETED, WAIVED."
      - name: breach_kind
        type: enum
        source: computed
        description: "Which limit tripped the task out of SCHEDULED; null while still SCHEDULED."
        default: null
        constraints: "One of DATE, GALLON."
      - name: effective_gallon_interval
        type: number
        source: computed
        description: "gallon_interval after the water-hardness derate of calculations.maintenance_due_evaluation, rounded half-up to 2 decimals; null when gallon_interval is null."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at completion."
        default: null
      - name: completed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ServiceTechnician who completed the task."
        default: null
      - name: measured_brix_ratio
        type: number
        source: input
        description: "Brix ratio recorded at completion; required for BRIX_CALIBRATION completion, ignored otherwise."
        default: null
      - name: calibration_outcome
        type: enum
        source: computed
        description: "PASS when measured_brix_ratio is inside the spec band, FAIL otherwise; null for non-calibration tasks."
        default: null
        constraints: "One of PASS, FAIL."
      - name: waiver_reason
        type: string
        source: input
        description: "Free-text justification recorded when the task is waived."
        default: null
      - name: waived_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who waived the task."
        default: null

  - name: ServiceCall
    parent: DispenserUnit
    common_fields: true
    fields:
      - name: dispenser_unit_id
        type: string
        source: input
        description: "FK -> DispenserUnit.id; the faulty unit."
      - name: reported_at
        type: datetime
        source: input
        description: "When the outlet reported the fault; must be <= the logical clock."
      - name: symptom_code
        type: enum
        source: input
        description: "Reported symptom; base weight for calculations.service_call_severity."
        constraints: "One of NO_POUR, OFF_RATIO, LEAK, CO2_LOW, ICE_FAULT."
      - name: severity_score
        type: integer
        source: computed
        description: "Score from calculations.service_call_severity, capped at 100."
        default: 0
      - name: severity
        type: enum
        source: computed
        description: "Severity band derived from severity_score."
        default: "ROUTINE"
        constraints: "One of ROUTINE, URGENT, CRITICAL."
      - name: status
        type: enum
        source: system
        description: "Call lifecycle; ESCALATED loops back to DISPATCHED."
        default: "OPEN"
        constraints: "One of OPEN, DISPATCHED, ON_SITE, RESOLVED, ESCALATED, CANCELLED."
      - name: van_code
        type: string
        source: system
        description: "Van assigned by the most recent dispatch; null while OPEN."
        default: null
      - name: scheduled_window_start
        type: datetime
        source: system
        description: "Inclusive start of the assigned on-site window."
        default: null
      - name: scheduled_window_end
        type: datetime
        source: system
        description: "Inclusive end of the assigned on-site window; van windows are closed intervals padded by a travel buffer."
        default: null
      - name: assigned_tech_user_id
        type: string
        source: system
        description: "X-User-ID of the ServiceTechnician holding the current dispatch."
        default: null
      - name: reserved_part_stock_id
        type: string
        source: computed
        description: "FK -> VanPartStock.id; the van stock row the current dispatch drew a part from. Null when reserved_part_units == 0."
        default: null
      - name: reserved_part_units
        type: integer
        source: computed
        description: "Units currently held off the van for this call."
        default: 0
        constraints: ">= 0."
      - name: consumed_part_units
        type: integer
        source: computed
        description: "Units actually fitted at resolution; never greater than the reserved_part_units held at that moment."
        default: 0
        constraints: ">= 0."
      - name: escalation_count
        type: integer
        source: computed
        description: "How many times this call has cycled ON_SITE -> ESCALATED."
        default: 0
        constraints: ">= 0 and <= 2."
      - name: resolution_code
        type: enum
        source: input
        description: "Outcome recorded at resolution."
        default: null
        constraints: "One of PART_REPLACED, CALIBRATED, CLEANED, NO_FAULT_FOUND."

  - name: VanPartStock
    parent: null
    common_fields: true
    fields:
      - name: van_code
        type: string
        source: input
        description: "Van whose rolling inventory this row tracks."
        constraints: "The pair (van_code, part_sku) is unique; ERR_DUPLICATE_VAN_PART on collision."
      - name: part_sku
        type: string
        source: input
        description: "Service part identifier, e.g. PUMP_ASSY_12."
      - name: on_van_units
        type: integer
        source: input
        description: "Units currently free on the van."
        default: 0
        constraints: ">= 0."
      - name: reserved_units
        type: integer
        source: computed
        description: "Units held for dispatched service calls."
        default: 0
        constraints: ">= 0."
      - name: consumed_units
        type: integer
        source: computed
        description: "Cumulative units fitted at customer sites."
        default: 0
        constraints: ">= 0."
      - name: initial_units
        type: integer
        source: system
        description: "on_van_units as supplied at creation; fixed baseline of the parts conservation invariant."
      - name: restocked_units
        type: integer
        source: computed
        description: "Cumulative units added by restock operations after creation."
        default: 0
        constraints: ">= 0."

state_machines:
  - entity: Outlet
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /fountain-network/outlets/{id}/compliance-hold  (action: PLACE)"
        actor: ComplianceOfficer
        preconditions:
          - "Outlet.status == ACTIVE"
          - "Outlet.open_compliance_hold_count == 0 (one open hold at a time)"
        side_effects:
          - "sets Outlet.open_compliance_hold_count = 1"
          - "sets Outlet.last_hold_placed_by_user_id = X-User-ID"
          - "recomputes Outlet.service_posture via calculations.outlet_service_posture -> FROZEN"
          - "every RouteStop of this outlet in status PENDING transitions to SKIPPED with skip_reason_code = POSTURE_FROZEN (cascade hop 2)"
          - "each such SKIPPED stop releases its OutletSupplyPosition rows: allocated_units -> 0, planned_route_stop_id -> null, SupplyItem.reserved_pool_units decremented by the released amount, ReplenishmentRoute.committed_units decremented by the released amount (cascade hop 3)"
          - "increments Outlet.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /fountain-network/outlets/{id}/compliance-hold  (action: RELEASE)"
        actor: ComplianceOfficer
        preconditions:
          - "Outlet.status == ACTIVE"
          - "Outlet.open_compliance_hold_count == 1"
        side_effects:
          - "sets Outlet.open_compliance_hold_count = 0"
          - "keeps Outlet.last_hold_placed_by_user_id at its current value (audit trail for the waiver segregation-of-duties check)"
          - "recomputes Outlet.service_posture via calculations.outlet_service_posture"
          - "increments Outlet.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fountain-network/outlets/{id}/status-change  (action: SUSPEND)"
        actor: NetworkAdmin
        preconditions:
          - "Outlet.status == ACTIVE"
        side_effects:
          - "every RouteStop of this outlet in status PENDING or ARRIVED transitions to SKIPPED with skip_reason_code = OUTLET_CLOSED"
          - "each such SKIPPED stop releases its OutletSupplyPosition allocations exactly as in the compliance-hold cascade"
          - "increments Outlet.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fountain-network/outlets/{id}/status-change  (action: REINSTATE)"
        actor: NetworkAdmin
        preconditions:
          - "Outlet.status == SUSPENDED"
          - "Outlet.open_compliance_hold_count == 0"
        side_effects:
          - "recomputes Outlet.service_posture via calculations.outlet_service_posture"
          - "increments Outlet.version by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE. Reinstatement does NOT resurrect skipped stops."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: the last PlacementAgreement of this outlet reaches TERMINATED"
        actor: system
        preconditions:
          - "no PlacementAgreement of this outlet is in status DRAFT, ACTIVE, SHORTFALL_REVIEW or RECALL_PENDING"
        side_effects:
          - "same stop-skip and allocation-release cascade as the operator SUSPEND action"
          - "increments Outlet.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fountain-network/outlets/{id}/status-change  (action: CLOSE)"
        actor: NetworkAdmin
        preconditions:
          - "Outlet.status == ACTIVE"
          - "every DispenserUnit of this outlet has status == RETURNED"
        side_effects:
          - "increments Outlet.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /fountain-network/outlets/{id}/status-change  (action: CLOSE)"
        actor: NetworkAdmin
        preconditions:
          - "Outlet.status == SUSPENDED"
          - "every DispenserUnit of this outlet has status == RETURNED"
        side_effects:
          - "increments Outlet.version by 1"

  - entity: PlacementAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fountain-network/placement-agreements/{id}/activate"
        actor: NetworkAdmin
        preconditions:
          - "PlacementAgreement.status == DRAFT"
          - "Outlet.status == ACTIVE"
          - "at least one DispenserUnit references this agreement"
        side_effects:
          - "increments PlacementAgreement.version by 1"
      - from: DRAFT
        to: EXPIRED
        trigger: "system: a newer PlacementAgreement is created for the same outlet_id and supersedes this one"
        actor: system
        preconditions:
          - "PlacementAgreement.status == DRAFT"
        side_effects:
          - "increments PlacementAgreement.version by 1"
        note: "This supersede path is the true race guarded by concurrency_rules.agreement-create-stale-outlet."
      - from: ACTIVE
        to: SHORTFALL_REVIEW
        trigger: "POST /fountain-network/placement-agreements/{id}/assess-shortfall"
        actor: NetworkAdmin
        preconditions:
          - "PlacementAgreement.status == ACTIVE"
          - "calculations.agreement_shortfall_fee yields assessed_fee_cents > 0"
        side_effects:
          - "writes PlacementAgreement.assessed_shortfall_gallons and assessed_fee_cents from calculations.agreement_shortfall_fee"
          - "writes PlacementAgreement.recall_exposure_cents from calculations.equipment_recall_exposure under the submitted exposure_variant"
          - "writes PlacementAgreement.exposure_variant, assessment_period_start, assessment_period_end"
          - "writes PlacementAgreement.shortfall_assessed_by_user_id = X-User-ID"
          - "increments PlacementAgreement.version by 1"
      - from: SHORTFALL_REVIEW
        to: ACTIVE
        trigger: "POST /fountain-network/placement-agreements/{id}/recall-decision  (outcome: FEE_ONLY)"
        actor: ComplianceOfficer
        preconditions:
          - "PlacementAgreement.status == SHORTFALL_REVIEW"
          - "X-User-ID != PlacementAgreement.shortfall_assessed_by_user_id"
        side_effects:
          - "writes PlacementAgreement.recall_decided_by_user_id = X-User-ID"
          - "retains assessed_fee_cents as the amount payable"
          - "increments PlacementAgreement.version by 1"
        note: "Cycle: ACTIVE -> SHORTFALL_REVIEW -> ACTIVE, once per assessment period."
      - from: SHORTFALL_REVIEW
        to: RECALL_PENDING
        trigger: "POST /fountain-network/placement-agreements/{id}/recall-decision  (outcome: RECALL)"
        actor: ComplianceOfficer
        preconditions:
          - "PlacementAgreement.status == SHORTFALL_REVIEW"
          - "X-User-ID != PlacementAgreement.shortfall_assessed_by_user_id"
          - "PlacementAgreement.free_on_loan == true"
          - "PlacementAgreement.recall_exposure_cents >= 450000"
        side_effects:
          - "every DispenserUnit of this agreement with status IN {IN_SERVICE, SERVICE_HOLD} transitions to RECALL_STAGED"
          - "writes PlacementAgreement.recall_decided_by_user_id = X-User-ID"
          - "increments PlacementAgreement.version by 1"
      - from: RECALL_PENDING
        to: TERMINATED
        trigger: "system: the last DispenserUnit of this agreement reaches RETURNED"
        actor: system
        preconditions:
          - "every DispenserUnit of this agreement has status == RETURNED"
        side_effects:
          - "increments PlacementAgreement.version by 1"
          - "if no other PlacementAgreement of the outlet is in DRAFT, ACTIVE, SHORTFALL_REVIEW or RECALL_PENDING, the Outlet transitions ACTIVE -> SUSPENDED (cascade hop 3), which in turn skips the outlet's PENDING stops and releases their allocations (cascade hop 4)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /fountain-network/placement-agreements/{id}/close-term"
        actor: NetworkAdmin
        preconditions:
          - "PlacementAgreement.status == ACTIVE"
          - "logical clock >= PlacementAgreement.term_end_date"
        side_effects:
          - "increments PlacementAgreement.version by 1"

  - entity: DispenserUnit
    state_field: status
    initial_state: IN_SERVICE
    terminal_states: [RETURNED]
    transitions:
      - from: IN_SERVICE
        to: SERVICE_HOLD
        trigger: "POST /fountain-network/dispenser-units/{id}/service-hold  (action: PLACE)"
        actor: ServiceTechnician
        preconditions:
          - "DispenserUnit.status == IN_SERVICE"
        side_effects:
          - "increments DispenserUnit.version by 1"
        note: "Telemetry ingestion and forecasting still include SERVICE_HOLD units."
      - from: SERVICE_HOLD
        to: IN_SERVICE
        trigger: "POST /fountain-network/dispenser-units/{id}/service-hold  (action: RELEASE)"
        actor: ServiceTechnician
        preconditions:
          - "DispenserUnit.status == SERVICE_HOLD"
          - "no MaintenanceTask of this unit with task_type == SANITATION has status == OVERDUE"
        side_effects:
          - "increments DispenserUnit.version by 1"
      - from: IN_SERVICE
        to: RECALL_STAGED
        trigger: "system: the covering PlacementAgreement enters RECALL_PENDING"
        actor: system
        preconditions:
          - "DispenserUnit.status == IN_SERVICE"
        side_effects:
          - "increments DispenserUnit.version by 1"
      - from: SERVICE_HOLD
        to: RECALL_STAGED
        trigger: "system: the covering PlacementAgreement enters RECALL_PENDING"
        actor: system
        preconditions:
          - "DispenserUnit.status == SERVICE_HOLD"
        side_effects:
          - "increments DispenserUnit.version by 1"
      - from: RECALL_STAGED
        to: RETURNED
        trigger: "POST /fountain-network/dispenser-units/{id}/confirm-return"
        actor: NetworkAdmin
        preconditions:
          - "DispenserUnit.status == RECALL_STAGED"
        side_effects:
          - "every MaintenanceTask of this unit in status SCHEDULED, DUE or OVERDUE transitions to WAIVED with waiver_reason = 'EQUIPMENT_RETURNED'; each task leaving OVERDUE decrements Outlet.overdue_task_count by 1 and recomputes Outlet.service_posture"
          - "every ServiceCall of this unit in status OPEN, DISPATCHED, ON_SITE or ESCALATED transitions to CANCELLED, releasing any reserved van parts"
          - "if every DispenserUnit of the agreement is now RETURNED, the PlacementAgreement transitions RECALL_PENDING -> TERMINATED (cascade hop 2)"
          - "increments DispenserUnit.version by 1"

  - entity: DispenserUnit
    state_field: calibration_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: IN_SPEC
        trigger: "POST /fountain-network/maintenance-tasks/{id}/complete on a BRIX_CALIBRATION task whose calibration_outcome computes to PASS"
        actor: ServiceTechnician
        preconditions:
          - "MaintenanceTask.task_type == BRIX_CALIBRATION"
          - "measured_brix_ratio is present"
        side_effects:
          - "writes DispenserUnit.brix_ratio_last_measured = measured_brix_ratio"
          - "increments DispenserUnit.version by 1"
        note: "This dimension moves independently of DispenserUnit.status: a unit may be SERVICE_HOLD and IN_SPEC at once."
      - from: UNVERIFIED
        to: OUT_OF_SPEC
        trigger: "POST /fountain-network/maintenance-tasks/{id}/complete on a BRIX_CALIBRATION task whose calibration_outcome computes to FAIL"
        actor: ServiceTechnician
        preconditions:
          - "MaintenanceTask.task_type == BRIX_CALIBRATION"
          - "measured_brix_ratio is present"
        side_effects:
          - "writes DispenserUnit.brix_ratio_last_measured = measured_brix_ratio"
          - "blocks RouteStop service at this unit's outlet until the unit returns to IN_SPEC"
          - "increments DispenserUnit.version by 1"
      - from: IN_SPEC
        to: OUT_OF_SPEC
        trigger: "POST /fountain-network/maintenance-tasks/{id}/complete on a BRIX_CALIBRATION task whose calibration_outcome computes to FAIL"
        actor: ServiceTechnician
        preconditions:
          - "MaintenanceTask.task_type == BRIX_CALIBRATION"
        side_effects:
          - "writes DispenserUnit.brix_ratio_last_measured = measured_brix_ratio"
          - "increments DispenserUnit.version by 1"
      - from: OUT_OF_SPEC
        to: IN_SPEC
        trigger: "POST /fountain-network/maintenance-tasks/{id}/complete on a BRIX_CALIBRATION task whose calibration_outcome computes to PASS"
        actor: ServiceTechnician
        preconditions:
          - "MaintenanceTask.task_type == BRIX_CALIBRATION"
        side_effects:
          - "writes DispenserUnit.brix_ratio_last_measured = measured_brix_ratio"
          - "increments DispenserUnit.version by 1"
        note: "Cycle on the calibration dimension: IN_SPEC -> OUT_OF_SPEC -> IN_SPEC."

  - entity: MaintenanceTask
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "POST /fountain-network/maintenance-tasks/{id}/evaluate-due"
        actor: ComplianceOfficer
        preconditions:
          - "MaintenanceTask.status == SCHEDULED"
          - "calculations.maintenance_due_evaluation reports breach_kind == DATE inside the 72-hour grace band"
        side_effects:
          - "writes MaintenanceTask.breach_kind = DATE"
          - "increments MaintenanceTask.version by 1"
      - from: SCHEDULED
        to: OVERDUE
        trigger: "POST /fountain-network/maintenance-tasks/{id}/evaluate-due"
        actor: ComplianceOfficer
        preconditions:
          - "MaintenanceTask.status == SCHEDULED"
          - "calculations.maintenance_due_evaluation reports breach_kind == DATE and the logical clock is at or past due_at + 72h"
        side_effects:
          - "writes MaintenanceTask.breach_kind = DATE"
          - "increments Outlet.overdue_task_count by 1 and recomputes Outlet.service_posture via calculations.outlet_service_posture"
          - "increments MaintenanceTask.version by 1"
      - from: DUE
        to: OVERDUE
        trigger: "POST /fountain-network/maintenance-tasks/{id}/evaluate-due"
        actor: ComplianceOfficer
        preconditions:
          - "MaintenanceTask.status == DUE"
          - "logical clock >= due_at + 72h"
        side_effects:
          - "increments Outlet.overdue_task_count by 1 and recomputes Outlet.service_posture via calculations.outlet_service_posture"
          - "increments MaintenanceTask.version by 1"
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system: a TelemetryReading pushes DispenserUnit.lifetime_dispensed_gallons so that gallons since the last filter change reach effective_gallon_interval"
        actor: system
        preconditions:
          - "MaintenanceTask.status == SCHEDULED"
          - "MaintenanceTask.task_type == FILTER_CHANGE"
          - "DispenserUnit.lifetime_dispensed_gallons - DispenserUnit.gallons_at_last_filter_change >= MaintenanceTask.effective_gallon_interval"
        side_effects:
          - "writes MaintenanceTask.breach_kind = GALLON"
          - "increments Outlet.overdue_task_count by 1 and recomputes Outlet.service_posture (cascade hop 3)"
          - "increments MaintenanceTask.version by 1"
        note: "A gallon-interval breach skips the DUE grace band entirely: water quality is a compliance matter, not a calendar courtesy."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /fountain-network/maintenance-tasks/{id}/complete"
        actor: ServiceTechnician
        preconditions:
          - "MaintenanceTask.status == SCHEDULED"
          - "DispenserUnit.status != RETURNED"
        side_effects:
          - "writes completed_at (logical clock), completed_by_user_id"
          - "for task_type == FILTER_CHANGE: sets DispenserUnit.gallons_at_last_filter_change = DispenserUnit.lifetime_dispensed_gallons"
          - "for task_type == BRIX_CALIBRATION: writes calibration_outcome and moves the DispenserUnit.calibration_status dimension"
          - "increments MaintenanceTask.version by 1"
      - from: DUE
        to: COMPLETED
        trigger: "POST /fountain-network/maintenance-tasks/{id}/complete"
        actor: ServiceTechnician
        preconditions:
          - "MaintenanceTask.status == DUE"
          - "DispenserUnit.status != RETURNED"
        side_effects:
          - "same completion side effects as from SCHEDULED"
          - "increments MaintenanceTask.version by 1"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /fountain-network/maintenance-tasks/{id}/complete"
        actor: ServiceTechnician
        preconditions:
          - "MaintenanceTask.status == OVERDUE"
          - "DispenserUnit.status != RETURNED"
        side_effects:
          - "same completion side effects as from SCHEDULED"
          - "decrements Outlet.overdue_task_count by 1 and recomputes Outlet.service_posture"
          - "increments MaintenanceTask.version by 1"
      - from: DUE
        to: WAIVED
        trigger: "POST /fountain-network/maintenance-tasks/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "MaintenanceTask.status == DUE"
          - "X-User-ID != Outlet.last_hold_placed_by_user_id"
        side_effects:
          - "writes waiver_reason and waived_by_user_id"
          - "increments MaintenanceTask.version by 1"
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /fountain-network/maintenance-tasks/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "MaintenanceTask.status == OVERDUE"
          - "X-User-ID != Outlet.last_hold_placed_by_user_id"
        side_effects:
          - "writes waiver_reason and waived_by_user_id"
          - "decrements Outlet.overdue_task_count by 1 and recomputes Outlet.service_posture"
          - "increments MaintenanceTask.version by 1"
      - from: SCHEDULED
        to: WAIVED
        trigger: "system: the DispenserUnit reaches RETURNED"
        actor: system
        preconditions:
          - "MaintenanceTask.status IN {SCHEDULED, DUE, OVERDUE}"
        side_effects:
          - "writes waiver_reason = 'EQUIPMENT_RETURNED'"
          - "if leaving OVERDUE, decrements Outlet.overdue_task_count by 1 and recomputes Outlet.service_posture"
          - "increments MaintenanceTask.version by 1"

  - entity: ReplenishmentRoute
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /fountain-network/replenishment-routes/{id}/dispatch"
        actor: SupplyPlanner
        preconditions:
          - "ReplenishmentRoute.status == PLANNED"
          - "at least one RouteStop references this route"
          - "ReplenishmentRoute.committed_units <= ReplenishmentRoute.capacity_units"
        side_effects:
          - "increments ReplenishmentRoute.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /fountain-network/replenishment-routes/{id}/complete"
        actor: SupplyPlanner
        preconditions:
          - "ReplenishmentRoute.status == DISPATCHED"
          - "every RouteStop of this route has status IN {SERVED, SKIPPED}"
        side_effects:
          - "recomputes ReplenishmentRoute.delivered_units as the sum of RouteStop.delivered_units over stops in status SERVED"
          - "increments ReplenishmentRoute.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /fountain-network/replenishment-routes/{id}/cancel"
        actor: SupplyPlanner
        preconditions:
          - "ReplenishmentRoute.status == PLANNED"
        side_effects:
          - "every RouteStop of this route in status PENDING or ARRIVED transitions to SKIPPED with skip_reason_code = ACCESS_DENIED (cascade hop 2)"
          - "each skipped stop releases its OutletSupplyPosition rows: allocated_units -> 0, planned_route_stop_id -> null, SupplyItem.reserved_pool_units decremented, ReplenishmentRoute.committed_units decremented (cascade hop 3)"
          - "increments ReplenishmentRoute.version by 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /fountain-network/replenishment-routes/{id}/cancel"
        actor: SupplyPlanner
        preconditions:
          - "ReplenishmentRoute.status == DISPATCHED"
        side_effects:
          - "same stop-skip and allocation-release cascade as from PLANNED"
          - "increments ReplenishmentRoute.version by 1"

  - entity: RouteStop
    state_field: status
    initial_state: PENDING
    terminal_states: [SERVED, SKIPPED]
    transitions:
      - from: PENDING
        to: ARRIVED
        trigger: "POST /fountain-network/route-stops/{id}/arrive"
        actor: RouteDriver
        preconditions:
          - "RouteStop.status == PENDING"
          - "ReplenishmentRoute.status == DISPATCHED"
        side_effects:
          - "increments RouteStop.version by 1"
      - from: ARRIVED
        to: SERVED
        trigger: "POST /fountain-network/route-stops/{id}/serve"
        actor: RouteDriver
        preconditions:
          - "RouteStop.status == ARRIVED"
          - "Outlet.service_posture != FROZEN"
          - "no DispenserUnit of this outlet has calibration_status == OUT_OF_SPEC"
        side_effects:
          - "for every OutletSupplyPosition with planned_route_stop_id == this stop: on_hand_units += allocated_units, then allocated_units -> 0 and planned_route_stop_id -> null"
          - "writes RouteStop.delivered_units = the total units handed over"
          - "decrements SupplyItem.reserved_pool_units by the delivered units per SKU (the pool commitment is consumed, not returned)"
          - "recomputes each affected OutletSupplyPosition.alert_level from its stored forecast horizon"
          - "increments RouteStop.version by 1"
      - from: ARRIVED
        to: SKIPPED
        trigger: "POST /fountain-network/route-stops/{id}/skip"
        actor: RouteDriver
        preconditions:
          - "RouteStop.status == ARRIVED"
        side_effects:
          - "writes skip_reason_code from the request"
          - "releases every OutletSupplyPosition with planned_route_stop_id == this stop: allocated_units -> 0, planned_route_stop_id -> null, SupplyItem.reserved_pool_units decremented, ReplenishmentRoute.committed_units decremented"
          - "increments RouteStop.version by 1"
      - from: PENDING
        to: SKIPPED
        trigger: "POST /fountain-network/route-stops/{id}/skip"
        actor: RouteDriver
        preconditions:
          - "RouteStop.status == PENDING"
        side_effects:
          - "same release cascade as from ARRIVED"
          - "increments RouteStop.version by 1"
      - from: PENDING
        to: SKIPPED
        trigger: "system: the outlet's service_posture becomes FROZEN, the Outlet is SUSPENDED, or the route is CANCELLED"
        actor: system
        preconditions:
          - "RouteStop.status == PENDING"
        side_effects:
          - "writes skip_reason_code = POSTURE_FROZEN (posture cause), OUTLET_CLOSED (suspension cause) or ACCESS_DENIED (route cancellation cause)"
          - "same release cascade as the operator skip"
          - "increments RouteStop.version by 1"

  - entity: ServiceCall
    state_field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /fountain-network/service-calls/{id}/dispatch"
        actor: ServiceTechnician
        preconditions:
          - "ServiceCall.status == OPEN"
          - "DispenserUnit.status IN {IN_SERVICE, SERVICE_HOLD}"
          - "the requested van window does not collide with another DISPATCHED or ON_SITE ServiceCall on the same van_code under calculations.van_window_overlap"
          - "when part_sku is supplied, a VanPartStock row exists for (van_code, part_sku) with on_van_units >= part_units"
        side_effects:
          - "writes van_code, scheduled_window_start, scheduled_window_end, assigned_tech_user_id"
          - "when part_sku is supplied: VanPartStock.on_van_units -= part_units, VanPartStock.reserved_units += part_units, ServiceCall.reserved_part_stock_id and reserved_part_units set"
          - "increments ServiceCall.version by 1"
      - from: ESCALATED
        to: DISPATCHED
        trigger: "POST /fountain-network/service-calls/{id}/dispatch"
        actor: ServiceTechnician
        preconditions:
          - "ServiceCall.status == ESCALATED"
          - "ServiceCall.escalation_count <= 2"
          - "the requested van window does not collide with another DISPATCHED or ON_SITE ServiceCall on the same van_code"
        side_effects:
          - "same dispatch side effects as from OPEN, overwriting van_code, window and assigned_tech_user_id"
          - "increments ServiceCall.version by 1"
        note: "Cycle: DISPATCHED -> ON_SITE -> ESCALATED -> DISPATCHED, at most two escalations."
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /fountain-network/service-calls/{id}/arrive-on-site"
        actor: ServiceTechnician
        preconditions:
          - "ServiceCall.status == DISPATCHED"
          - "X-User-ID == ServiceCall.assigned_tech_user_id"
        side_effects:
          - "increments ServiceCall.version by 1"
      - from: ON_SITE
        to: RESOLVED
        trigger: "POST /fountain-network/service-calls/{id}/resolve"
        actor: ServiceTechnician
        preconditions:
          - "ServiceCall.status == ON_SITE"
          - "X-User-ID == ServiceCall.assigned_tech_user_id"
          - "consumed_part_units <= ServiceCall.reserved_part_units"
        side_effects:
          - "VanPartStock.reserved_units -= ServiceCall.reserved_part_units"
          - "VanPartStock.consumed_units += consumed_part_units"
          - "VanPartStock.on_van_units += (ServiceCall.reserved_part_units - consumed_part_units)"
          - "writes ServiceCall.consumed_part_units, resolution_code; sets reserved_part_units = 0 and reserved_part_stock_id = null"
          - "increments ServiceCall.version by 1"
      - from: ON_SITE
        to: ESCALATED
        trigger: "POST /fountain-network/service-calls/{id}/escalate"
        actor: ServiceTechnician
        preconditions:
          - "ServiceCall.status == ON_SITE"
          - "ServiceCall.escalation_count < 2"
        side_effects:
          - "compensating release: VanPartStock.reserved_units -= ServiceCall.reserved_part_units and VanPartStock.on_van_units += ServiceCall.reserved_part_units; then ServiceCall.reserved_part_units = 0 and reserved_part_stock_id = null"
          - "increments ServiceCall.escalation_count by 1"
          - "clears van_code, scheduled_window_start, scheduled_window_end, assigned_tech_user_id"
          - "increments ServiceCall.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /fountain-network/service-calls/{id}/cancel"
        actor: OutletManager | NetworkAdmin
        preconditions:
          - "ServiceCall.status == OPEN"
        side_effects:
          - "increments ServiceCall.version by 1"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /fountain-network/service-calls/{id}/cancel"
        actor: OutletManager | NetworkAdmin
        preconditions:
          - "ServiceCall.status == DISPATCHED"
        side_effects:
          - "same compensating parts release as the ESCALATE transition"
          - "increments ServiceCall.version by 1"

concurrency_rules:
  - rule_id: agreement-create-stale-outlet
    parent_entity: Outlet
    write_endpoint: "POST /fountain-network/placement-agreements"
    occ_field: "expected_outlet_version"
    description: |
      Creating a PlacementAgreement against an Outlet whose version has advanced
      since the client last read it is rejected with a stale-version error. A new
      agreement legitimately supersedes any agreement of the same outlet still in
      DRAFT (that agreement is moved to EXPIRED), so a writer holding an outdated
      view of the outlet would silently discard paperwork it never saw. The check
      is a comparison of expected_outlet_version against the stored
      Outlet.version, evaluated on one request at a time.
    error_id: ERR_STALE_OUTLET_VERSION
    http_status: 412

  - rule_id: stop-create-stale-route
    parent_entity: ReplenishmentRoute
    write_endpoint: "POST /fountain-network/replenishment-routes/{id}/stops"
    occ_field: "expected_route_version"
    description: |
      Adding a RouteStop to a ReplenishmentRoute whose version has advanced since
      the client last read it is rejected with a stale-version error. Stop
      creation is legal from PLANNED regardless of how many stops already exist,
      so no state precondition can catch a writer whose window plan was computed
      against an earlier stop set; the version comparison is the only signal that
      the route's stop list has moved on.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

calculations:
  - name: outlet_supply_forecast
    trigger: "POST /fountain-network/supply-positions/{id}/forecast"
    algorithm: forward_looking
    formula: |
      # Step 1 - telemetry window (half-open, anchored on the logical clock)
      window_ounces = sum(TelemetryReading.dispensed_ounces) over readings where
          TelemetryReading.supply_item_id == position.supply_item_id
          AND TelemetryReading.dispenser_unit_id IN (DispenserUnit.id where
                DispenserUnit.outlet_id == position.outlet_id
                AND DispenserUnit.status IN {IN_SERVICE, SERVICE_HOLD})
          AND reading_at >= clock_now - window_days days
          AND reading_at <  clock_now
      daily_ounces = window_ounces / window_days          # exact, unrounded

      # Step 2 - variant-specific 14-day horizon
      if variant == TRAILING_ACTUAL:
          projected_ounces = daily_ounces * HORIZON_DAYS
      if variant == THROUGHPUT_PROJECTED:
          projected_ounces = daily_ounces * HORIZON_DAYS * TIER_FACTOR[outlet.throughput_tier]

      # Step 3 - net requirement in units
      raw_units = projected_ounces / supply_item.ounces_per_unit
      forecast_units = round_half_up(max(0, raw_units - position.on_hand_units), 2)

      # Step 4 - promotional suppression (applied AFTER step 3, overwriting it)
      if supply_item.promotional == true
         AND NOT (supply_item.promo_window_start <= clock_now < supply_item.promo_window_end):
             forecast_units = 0.00
             promo_suppressed = true
      else:
             promo_suppressed = false

      requested_units = ceil(forecast_units)

      # Step 5 - alert band from days of cover on hand
      if daily_ounces == 0:
          coverage_days = INFINITY
      else:
          coverage_days = (position.on_hand_units * supply_item.ounces_per_unit) / daily_ounces
      alert_level = CRITICAL if (position.on_hand_units == 0 OR coverage_days < CRITICAL_COVER_DAYS)
                    else LOW  if coverage_days < LOW_COVER_DAYS
                    else NONE
    input_set: "TelemetryReading rows (immutable, any source) for DispenserUnit rows of the position's outlet whose status IN {IN_SERVICE, SERVICE_HOLD}; RECALL_STAGED and RETURNED units are excluded. Window is half-open [clock_now - window_days, clock_now)."
    constants:
      HORIZON_DAYS: 14
      TIER_FACTOR: { SMALL: 1.00, MEDIUM: 1.15, LARGE: 1.30 }
      CRITICAL_COVER_DAYS: 3
      LOW_COVER_DAYS: 7
    precision: "forecast_units: 2 decimal places, round_half_up. requested_units: integer, ceil. coverage_days compared unrounded."
    variants:
      - name: TRAILING_ACTUAL
        when: "the forecast request supplies variant == TRAILING_ACTUAL; the default recorded on a freshly created position"
        difference: "Uses measured trailing consumption unadjusted; ignores Outlet.throughput_tier entirely."
      - name: THROUGHPUT_PROJECTED
        when: "the forecast request supplies variant == THROUGHPUT_PROJECTED"
        difference: "Multiplies the same trailing consumption by TIER_FACTOR[outlet.throughput_tier], so a LARGE outlet forecasts 30% more units from identical telemetry."

  - name: equipment_recall_exposure
    trigger: "POST /fountain-network/placement-agreements/{id}/assess-shortfall"
    algorithm: decay_function
    formula: |
      months_in_service(unit) = floor((clock_now - unit.installed_at) / MONTH_DAYS days)   # floor of whole 30-day months
      if variant == BOOK_VALUE:
          unit_exposure_cents = round_half_up(agreement.equipment_value_cents
                                              * max(0, 1 - DEPRECIATION_PER_MONTH * months_in_service(unit)))
      if variant == REPLACEMENT_RISK:
          unit_exposure_cents = round_half_up(agreement.equipment_value_cents
                                              * (1 + ESCALATION_PER_MONTH * months_in_service(unit)))
      recall_exposure_cents = sum(unit_exposure_cents) over DispenserUnit rows where
          DispenserUnit.agreement_id == agreement.id
          AND DispenserUnit.status IN {IN_SERVICE, SERVICE_HOLD, RECALL_STAGED}
    input_set: "DispenserUnit rows of the agreement whose status IN {IN_SERVICE, SERVICE_HOLD, RECALL_STAGED}; RETURNED units contribute nothing."
    constants:
      MONTH_DAYS: 30
      DEPRECIATION_PER_MONTH: 0.01
      ESCALATION_PER_MONTH: 0.005
      RECALL_EXPOSURE_FLOOR_CENTS: 450000
    precision: "Whole cents, round_half_up per unit before summation."
    variants:
      - name: BOOK_VALUE
        when: "the assessment request supplies exposure_variant == BOOK_VALUE (default)"
        difference: "Straight-line depreciation reduces exposure by 1% of placement value per whole month in service, floored at 0."
      - name: REPLACEMENT_RISK
        when: "the assessment request supplies exposure_variant == REPLACEMENT_RISK"
        difference: "Escalates exposure by 0.5% per whole month in service instead of depreciating it, so the same fleet can clear RECALL_EXPOSURE_FLOOR_CENTS under this variant while falling short under BOOK_VALUE."

  - name: agreement_shortfall_fee
    trigger: "POST /fountain-network/placement-agreements/{id}/assess-shortfall"
    algorithm: tiered_pricing
    formula: |
      # Quarters are calendar quarters (Q1 Jan-Mar, Q2 Apr-Jun, Q3 Jul-Sep, Q4 Oct-Dec).
      # A quarter enters the assessment when its start instant lies inside the
      # half-open request period [period_start_date, period_end_date).
      quarter_commitment_gallons = agreement.annual_commitment_gallons / 4      # exact, NEVER rounded
      for each assessed quarter Q, in chronological order of Q.start:
          quarter_dispensed_gallons = sum(TelemetryReading.dispensed_ounces
                                          for units of this agreement with
                                          reading_at >= Q.start AND reading_at < Q.end) / OUNCES_PER_GALLON
          quarter_shortfall_gallons = max(0, quarter_commitment_gallons - quarter_dispensed_gallons)
          quarter_fee_cents = round_half_up(quarter_shortfall_gallons
                                            * agreement.shortfall_fee_cents_per_gallon)   # ROUND HERE
      assessed_shortfall_gallons = round_half_up(sum(quarter_shortfall_gallons over assessed quarters), 2)
      assessed_fee_cents        = sum(quarter_fee_cents over assessed quarters)            # SUM THE ROUNDED CENTS
    input_set: "TelemetryReading rows (any source) of every DispenserUnit whose agreement_id == this agreement, including units now RECALL_STAGED or RETURNED, bucketed by reading_at into half-open calendar quarters."
    constants:
      OUNCES_PER_GALLON: 128
      QUARTERS_PER_YEAR: 4
    precision: |
      PINNED ROUNDING ORDER: round each quarter's fee to whole cents FIRST, then sum the
      rounded per-quarter amounts. Summing the unrounded per-quarter shortfalls and rounding
      the product once at the end is explicitly WRONG and yields a different total whenever
      two or more quarters carry a half-cent residue. assessed_shortfall_gallons is reported
      to 2 decimals but is NOT the basis of assessed_fee_cents.

  - name: service_call_severity
    trigger: "POST /fountain-network/service-calls"
    algorithm: weighted_scoring
    formula: |
      base         = SYMPTOM_WEIGHT[symptom_code]
      posture_add  = POSTURE_ADD[outlet.service_posture]
      overdue_add  = min(OVERDUE_ADD_CAP, OVERDUE_ADD_PER_TASK * outlet.overdue_task_count)
      calib_add    = CALIBRATION_ADD if unit.calibration_status == OUT_OF_SPEC else 0
      severity_score = min(SCORE_CAP, base + posture_add + overdue_add + calib_add)
      severity = CRITICAL if severity_score >= CRITICAL_AT
                 else URGENT if severity_score >= URGENT_AT
                 else ROUTINE
    input_set: "The reported symptom_code, the Outlet.service_posture and Outlet.overdue_task_count of the unit's outlet as stored at request time, and the DispenserUnit.calibration_status dimension."
    constants:
      SYMPTOM_WEIGHT: { NO_POUR: 60, OFF_RATIO: 40, LEAK: 55, CO2_LOW: 30, ICE_FAULT: 25 }
      POSTURE_ADD: { OPEN: 0, RESTRICTED: 15, FROZEN: 30 }
      OVERDUE_ADD_PER_TASK: 5
      OVERDUE_ADD_CAP: 20
      CALIBRATION_ADD: 10
      SCORE_CAP: 100
      CRITICAL_AT: 85
      URGENT_AT: 60
    precision: "Integer arithmetic only; band comparisons use >= (a score of exactly 85 is CRITICAL, exactly 60 is URGENT)."

  - name: maintenance_due_evaluation
    trigger: "POST /fountain-network/maintenance-tasks/{id}/evaluate-due, and as a system side effect of POST /fountain-network/telemetry-readings"
    algorithm: threshold
    formula: |
      # Water-hardness derate, computed once at task creation and stored
      effective_gallon_interval = round_half_up(task.gallon_interval
              * (1 - HARDNESS_DERATE_PER_GPG * max(0, outlet.water_hardness_gpg - HARDNESS_BASELINE_GPG)), 2)
              if task.gallon_interval is not null else null

      gallons_since_change = unit.lifetime_dispensed_gallons - unit.gallons_at_last_filter_change

      # GALLON breach is evaluated first and outranks any calendar reasoning
      if effective_gallon_interval is not null
         AND gallons_since_change >= effective_gallon_interval:
             breach_kind = GALLON ; next_status = OVERDUE          # no grace band
      else if clock_now >= task.due_at + GRACE_HOURS hours:
             breach_kind = DATE   ; next_status = OVERDUE
      else if clock_now >= task.due_at:
             breach_kind = DATE   ; next_status = DUE
      else:
             breach_kind = null   ; next_status = task.status      # unchanged
    input_set: "The single MaintenanceTask under evaluation, its DispenserUnit gallon counters, and the Outlet.water_hardness_gpg of that unit's outlet."
    constants:
      HARDNESS_BASELINE_GPG: 10
      HARDNESS_DERATE_PER_GPG: 0.02
      GRACE_HOURS: 72
    precision: "effective_gallon_interval: 2 decimals, round_half_up. Both breach comparisons use >= (a unit exactly at the effective interval is OVERDUE; a clock exactly at due_at is DUE)."

  - name: outlet_service_posture
    trigger: "system: after every change to Outlet.open_compliance_hold_count or Outlet.overdue_task_count"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top to bottom; the first matching clause wins.
      if outlet.open_compliance_hold_count >= 1 OR outlet.overdue_task_count >= FROZEN_OVERDUE_AT:
          service_posture = FROZEN
      else if outlet.overdue_task_count >= RESTRICTED_OVERDUE_AT:
          service_posture = RESTRICTED
      else:
          service_posture = OPEN
    input_set: "The outlet's own two counters only; both are maintained incrementally by MaintenanceTask and compliance-hold transitions."
    constants:
      FROZEN_OVERDUE_AT: 3
      RESTRICTED_OVERDUE_AT: 1
    precision: "Integer comparisons with >=; FROZEN is checked before RESTRICTED so a held outlet with zero overdue tasks is still FROZEN."

  - name: route_allocation_waterfall
    trigger: "POST /fountain-network/route-stops/{id}/allocations"
    algorithm: waterfall_allocation
    formula: |
      # Eligibility filter over the supply_position_ids supplied in the request
      candidates = positions p in request where
          p.outlet_id == stop.outlet_id
          AND p.alert_level IN {LOW, CRITICAL}
          AND p.planned_route_stop_id IS NULL
          AND p.promo_suppressed == false
          AND p.requested_units >= 1
      # Processing order (pinned): CRITICAL before LOW, then larger request first,
      # then the older position first.
      order candidates by (alert_level rank: CRITICAL=0, LOW=1) ASC,
                          requested_units DESC,
                          created_at ASC
      if candidates is empty: reject the whole request with ERR_NO_ELIGIBLE_POSITIONS
      for each p in that order:
          item              = SupplyItem of p.supply_item_id
          remaining_pool    = item.national_allocation_units - item.reserved_pool_units
          remaining_capacity= route.capacity_units - route.committed_units
          # Hard stops evaluated before any grant is written for this position:
          if remaining_pool     < item.case_pack_units: reject with ERR_ALLOCATION_POOL_EXHAUSTED
          if remaining_capacity < item.case_pack_units: reject with ERR_ROUTE_CAPACITY_EXCEEDED
          cap               = min(p.requested_units, remaining_pool, remaining_capacity)
          grant             = floor(cap / item.case_pack_units) * item.case_pack_units
          if grant > 0:
              p.allocated_units        = grant
              p.planned_route_stop_id  = stop.id
              item.reserved_pool_units += grant
              route.committed_units    += grant
          else:
              p.allocated_units stays 0 and p.planned_route_stop_id stays null
      total_allocated_units = sum(grant over candidates)
    input_set: "Only the OutletSupplyPosition rows named in supply_position_ids that pass the eligibility filter; positions belonging to another outlet, already linked to a stop, promo-suppressed, or with alert_level NONE are silently excluded from the waterfall (they are not errors)."
    constants:
      ALERT_RANK: { CRITICAL: 0, LOW: 1 }
    precision: "Integer units only. Partial cases are never shipped: a cap of 5 with case_pack_units 4 grants 4, and a cap of 3 with case_pack_units 4 grants 0."

  - name: brand_mix_report
    trigger: "GET /fountain-network/outlets/{id}/brand-mix-report"
    algorithm: aggregation
    formula: |
      period = [clock_now - REPORT_WINDOW_DAYS days, clock_now)          # half-open
      lines  = one line per SupplyItem that has at least one qualifying reading, where a
               qualifying reading has reading_at inside period and belongs to a DispenserUnit
               of this outlet with status IN {IN_SERVICE, SERVICE_HOLD, RECALL_STAGED}
      line.total_ounces = sum(dispensed_ounces of its qualifying readings)
      total_ounces      = sum(line.total_ounces over lines)

      # Largest-remainder apportionment to one decimal place, so shares total exactly 100.0
      raw_i        = line_i.total_ounces / total_ounces * 100
      floor_i      = floor(raw_i * 10) / 10
      remainder_i  = raw_i - floor_i
      leftover_tenths = round((100.0 - sum(floor_i)) * 10)
      award one extra 0.1 to the leftover_tenths lines with the largest remainder_i,
        breaking ties by SupplyItem.created_at ASC
      line.share_pct = floor_i + awarded tenths

      top_brand_name = brand_name of the line with the largest total_ounces,
                       ties broken by SupplyItem.created_at ASC
      promo_available_skus = sku_code of every SupplyItem where promotional == true
                       AND promo_window_start <= clock_now < promo_window_end
                       AND outlet.service_posture != FROZEN
                       ordered by SupplyItem.created_at ASC
      # When total_ounces == 0: lines = [], share_pct not emitted, top_brand_name = null
    input_set: "TelemetryReading rows in the half-open 30-day window for DispenserUnit rows of this outlet with status IN {IN_SERVICE, SERVICE_HOLD, RECALL_STAGED}; RETURNED units are excluded."
    constants:
      REPORT_WINDOW_DAYS: 30
    precision: "share_pct: 1 decimal place by largest remainder; the emitted shares sum to exactly 100.0 whenever lines is non-empty."

  - name: stop_window_overlap
    trigger: "POST /fountain-network/replenishment-routes/{id}/stops"
    algorithm: interval_merge
    formula: |
      # Delivery windows on ONE route are HALF-OPEN intervals [window_start, window_end)
      # with NO buffer: a stop ending exactly when the next begins is legal.
      conflict = EXISTS RouteStop s where
          s.route_id == route.id
          AND s.status IN {PENDING, ARRIVED}
          AND s.window_start < new.window_end
          AND new.window_start < s.window_end
      if conflict: reject with ERR_STOP_WINDOW_OVERLAP
    input_set: "RouteStop rows of the same route in status PENDING or ARRIVED; SERVED and SKIPPED stops no longer occupy the van's day."
    constants:
      BUFFER_MINUTES: 0
    precision: "Strict inequalities on both sides, so touching endpoints (s.window_end == new.window_start) never conflict."

  - name: van_window_overlap
    trigger: "POST /fountain-network/service-calls/{id}/dispatch"
    algorithm: interval_merge
    formula: |
      # Van service windows are CLOSED intervals [scheduled_window_start, scheduled_window_end]
      # padded by a travel buffer on BOTH sides, so touching windows DO conflict.
      lo = new.scheduled_window_start - TRAVEL_BUFFER_MINUTES minutes
      hi = new.scheduled_window_end   + TRAVEL_BUFFER_MINUTES minutes
      conflict = EXISTS ServiceCall c where
          c.id != new.id
          AND c.van_code == requested van_code
          AND c.status IN {DISPATCHED, ON_SITE}
          AND c.scheduled_window_start <= hi
          AND lo <= c.scheduled_window_end
      if conflict: reject with ERR_VAN_WINDOW_CONFLICT
    input_set: "ServiceCall rows on the same van_code in status DISPATCHED or ON_SITE; OPEN, ESCALATED, RESOLVED and CANCELLED calls hold no van time."
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    precision: "Non-strict inequalities plus a 30-minute pad on each side: a window starting exactly 30 minutes after another ends still conflicts, and one starting 31 minutes after does not."

  - name: van_parts_ledger
    trigger: "POST /fountain-network/service-calls/{id}/dispatch, /escalate, /resolve, /cancel and POST /fountain-network/van-part-stocks/{id}/restock"
    algorithm: aggregation
    formula: |
      # Selector for the stock row a dispatch draws from
      candidates = VanPartStock rows where van_code == request.van_code
                                      AND part_sku == request.part_sku
      # (van_code, part_sku) is unique, so the candidate set holds 0 or 1 row.
      if candidates is empty:              reject with ERR_PART_NOT_ON_VAN
      if row.on_van_units < part_units:    reject with ERR_INSUFFICIENT_VAN_PARTS
      selected = that single row

      dispatch(units):  on_van_units -= units ; reserved_units += units
      escalate/cancel:  reserved_units -= call.reserved_part_units ; on_van_units += call.reserved_part_units
      resolve(consumed):reserved_units -= call.reserved_part_units
                        consumed_units += consumed
                        on_van_units   += (call.reserved_part_units - consumed)
      restock(units):   on_van_units += units ; restocked_units += units

      # CONSERVED QUANTITY (must hold after every one of the operations above)
      on_van_units + reserved_units + consumed_units == initial_units + restocked_units
    input_set: "The single VanPartStock row selected by (van_code, part_sku), plus the ServiceCall.reserved_part_units held at the moment of the compensating action."
    constants:
      PARTS_INVARIANT: "on_van_units + reserved_units + consumed_units - restocked_units == initial_units"
    precision: "Integer units; every branch moves units between the three buckets and never mints or destroys them."

  - name: supply_pool_ledger
    trigger: "POST /fountain-network/route-stops/{id}/allocations, /serve, /skip and POST /fountain-network/replenishment-routes/{id}/cancel"
    algorithm: aggregation
    formula: |
      allocate(grant): item.reserved_pool_units += grant ; route.committed_units += grant
      release(stop):   for each position p with planned_route_stop_id == stop.id:
                           item.reserved_pool_units -= p.allocated_units
                           route.committed_units    -= p.allocated_units
                           p.allocated_units = 0 ; p.planned_route_stop_id = null
      serve(stop):     for each position p with planned_route_stop_id == stop.id:
                           p.on_hand_units          += p.allocated_units
                           item.reserved_pool_units -= p.allocated_units
                           stop.delivered_units     += p.allocated_units
                           p.allocated_units = 0 ; p.planned_route_stop_id = null
                       # route.committed_units is NOT decremented on serve: the
                       # commitment was consumed by the delivery, not returned.

      # CONSERVED QUANTITY (must hold after every one of the operations above)
      item.reserved_pool_units == sum(OutletSupplyPosition.allocated_units
                                      over positions of that supply_item_id)
      # and, across a full allocate-then-release cycle,
      item.national_allocation_units is unchanged and item.reserved_pool_units
      returns to its pre-allocation value.
    input_set: "OutletSupplyPosition rows linked to the affected stop(s) and the SupplyItem rows they reference."
    constants:
      POOL_INVARIANT: "SupplyItem.reserved_pool_units == SUM(OutletSupplyPosition.allocated_units WHERE supply_item_id == SupplyItem.id)"
    precision: "Integer units; allocation grants are always whole multiples of SupplyItem.case_pack_units, so releases restore exact previous values."

  - name: brix_calibration_outcome
    trigger: "POST /fountain-network/maintenance-tasks/{id}/complete on a task whose task_type == BRIX_CALIBRATION"
    algorithm: threshold
    formula: |
      deviation = abs(measured_brix_ratio - BRIX_TARGET_RATIO)
      calibration_outcome = PASS if deviation <= BRIX_TOLERANCE else FAIL
      DispenserUnit.calibration_status = IN_SPEC  if calibration_outcome == PASS
                                        else OUT_OF_SPEC
      DispenserUnit.brix_ratio_last_measured = measured_brix_ratio
    input_set: "The single measured_brix_ratio submitted with the completion of a BRIX_CALIBRATION task; no other task or reading participates."
    constants:
      BRIX_TARGET_RATIO: 5.00
      BRIX_TOLERANCE: 0.15
    precision: "Comparison uses <= on the absolute deviation, so a ratio of exactly 5.15 or 4.85 still PASSes while 5.16 FAILs."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body parses, contains every required input field, every enum value is a declared member, numeric fields respect their declared ranges (no negative units, ounces, gallons or capacities), and pagination limit is within 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: "ERR_OUTLET_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_DISPENSER_UNIT_NOT_FOUND | ERR_SUPPLY_ITEM_NOT_FOUND | ERR_SUPPLY_POSITION_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_ROUTE_STOP_NOT_FOUND | ERR_MAINTENANCE_TASK_NOT_FOUND | ERR_SERVICE_CALL_NOT_FOUND | ERR_VAN_PART_STOCK_NOT_FOUND | ERR_TELEMETRY_READING_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "every foreign-key id in the request body exists (outlet_id, agreement_id, dispenser_unit_id, supply_item_id, every member of supply_position_ids)"
    error_id: "ERR_OUTLET_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_DISPENSER_UNIT_NOT_FOUND | ERR_SUPPLY_ITEM_NOT_FOUND | ERR_SUPPLY_POSITION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /placement-agreements, POST /dispenser-units, POST /telemetry-readings, POST /supply-positions, POST /replenishment-routes/{id}/stops, POST /route-stops/{id}/allocations, POST /maintenance-tasks, POST /service-calls"
  - priority: 6
    category: business_referential
    check: "when X-User-Role is OutletManager, X-User-ID equals the Outlet.id the target resource resolves to (the outlet itself, the position's outlet_id, or the outlet of the service call's dispenser unit)"
    error_id: ERR_OUTLET_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "GET /outlets/{id}/brand-mix-report, POST /supply-positions/{id}/acknowledge-alert, POST /service-calls, POST /service-calls/{id}/cancel"
  - priority: 7
    category: state
    check: "the supplied expected_outlet_version equals the stored Outlet.version"
    error_id: ERR_STALE_OUTLET_VERSION
    http_status: 412
    applies_to: "POST /placement-agreements"
  - priority: 8
    category: state
    check: "the supplied expected_route_version equals the stored ReplenishmentRoute.version"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /replenishment-routes/{id}/stops, POST /replenishment-routes/{id}/dispatch, POST /replenishment-routes/{id}/cancel"
  - priority: 9
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2 (including: the outlet must be ACTIVE to hold or place equipment, the agreement must be in the declared from-state, the route must be DISPATCHED before a stop can be arrived at, a call may only be dispatched from OPEN or ESCALATED)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: state
    check: "a ServiceCall may only be dispatched or resolved while its DispenserUnit.status IN {IN_SERVICE, SERVICE_HOLD}"
    error_id: ERR_UNIT_NOT_SERVICEABLE
    http_status: 409
    applies_to: "POST /service-calls, POST /service-calls/{id}/dispatch"
  - priority: 11
    category: state
    check: "arrive-on-site, resolve and escalate are performed by the technician holding the dispatch (X-User-ID == ServiceCall.assigned_tech_user_id)"
    error_id: ERR_TECHNICIAN_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /service-calls/{id}/arrive-on-site, POST /service-calls/{id}/resolve, POST /service-calls/{id}/escalate"
  - priority: 12
    category: state
    check: "a ServiceCall may not be escalated once escalation_count has reached 2"
    error_id: ERR_ESCALATION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /service-calls/{id}/escalate"
  - priority: 13
    category: business_safety
    check: "the outlet's service_posture is not FROZEN"
    error_id: ERR_OUTLET_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /route-stops/{id}/allocations, POST /route-stops/{id}/serve"
  - priority: 14
    category: business_safety
    check: "no DispenserUnit of the stop's outlet has calibration_status == OUT_OF_SPEC"
    error_id: ERR_CALIBRATION_OUT_OF_SPEC
    http_status: 409
    applies_to: "POST /route-stops/{id}/serve"
  - priority: 15
    category: business_safety
    check: "no MaintenanceTask of the unit with task_type == SANITATION is in status OVERDUE"
    error_id: ERR_SANITATION_OVERDUE
    http_status: 409
    applies_to: "POST /dispenser-units/{id}/service-hold (action RELEASE)"
  - priority: 16
    category: business_referential
    check: "the ComplianceOfficer recording the recall decision is not the NetworkAdmin who ran the assessment (X-User-ID != PlacementAgreement.shortfall_assessed_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /placement-agreements/{id}/recall-decision"
  - priority: 17
    category: business_referential
    check: "the ComplianceOfficer waiving the task is not the officer recorded in Outlet.last_hold_placed_by_user_id for that task's outlet"
    error_id: ERR_WAIVER_SEGREGATION_VIOLATION
    http_status: 409
    applies_to: "POST /maintenance-tasks/{id}/waive"
  - priority: 18
    category: business_referential
    check: "the submitted outlet_id equals the outlet_id of the submitted agreement_id"
    error_id: ERR_OUTLET_AGREEMENT_MISMATCH
    http_status: 422
    applies_to: "POST /dispenser-units"
  - priority: 19
    category: business_referential
    check: "Outlet.region_code of the stop's outlet equals ReplenishmentRoute.depot_region_code"
    error_id: ERR_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /replenishment-routes/{id}/stops"
  - priority: 20
    category: business_temporal
    check: "reading_at (telemetry) and reported_at (service call) are at or before the logical clock"
    error_id: ERR_TIMESTAMP_IN_FUTURE
    http_status: 422
    applies_to: "POST /telemetry-readings, POST /service-calls"
  - priority: 21
    category: business_temporal
    check: "every submitted interval is well-ordered: term_end_date > term_start_date, window_end > window_start, scheduled_window_end > scheduled_window_start, promo_window_end > promo_window_start, period_end_date > period_start_date"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /placement-agreements, POST /supply-items, PATCH /supply-items/{id}, POST /replenishment-routes/{id}/stops, POST /service-calls/{id}/dispatch, POST /placement-agreements/{id}/assess-shortfall"
  - priority: 22
    category: business_temporal
    check: "the logical clock is at or past PlacementAgreement.term_end_date"
    error_id: ERR_TERM_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /placement-agreements/{id}/close-term"
  - priority: 23
    category: business_temporal
    check: "the new delivery window does not overlap another PENDING or ARRIVED stop of the same route under calculations.stop_window_overlap (half-open, zero buffer)"
    error_id: ERR_STOP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /replenishment-routes/{id}/stops"
  - priority: 24
    category: business_temporal
    check: "the requested van window does not collide with another DISPATCHED or ON_SITE call on the same van under calculations.van_window_overlap (closed interval, 30-minute buffer both sides)"
    error_id: ERR_VAN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /service-calls/{id}/dispatch"
  - priority: 25
    category: business_constraint
    check: "when part_sku is supplied, a VanPartStock row exists for (van_code, part_sku)"
    error_id: ERR_PART_NOT_ON_VAN
    http_status: 404
    applies_to: "POST /service-calls/{id}/dispatch"
  - priority: 26
    category: business_constraint
    check: "the selected VanPartStock has on_van_units >= part_units"
    error_id: ERR_INSUFFICIENT_VAN_PARTS
    http_status: 409
    applies_to: "POST /service-calls/{id}/dispatch"
  - priority: 27
    category: business_constraint
    check: "consumed_part_units <= ServiceCall.reserved_part_units"
    error_id: ERR_CONSUMED_EXCEEDS_RESERVED
    http_status: 422
    applies_to: "POST /service-calls/{id}/resolve"
  - priority: 28
    category: business_constraint
    check: "gallon_interval is present for task_type == FILTER_CHANGE and absent for every other task_type"
    error_id: "ERR_GALLON_INTERVAL_REQUIRED | ERR_GALLON_INTERVAL_NOT_APPLICABLE"
    http_status: 422
    applies_to: "POST /maintenance-tasks"
  - priority: 29
    category: business_constraint
    check: "measured_brix_ratio is present when completing a BRIX_CALIBRATION task"
    error_id: ERR_BRIX_MEASUREMENT_REQUIRED
    http_status: 422
    applies_to: "POST /maintenance-tasks/{id}/complete"
  - priority: 30
    category: business_constraint
    check: "uniqueness of Outlet.account_code, DispenserUnit.serial_number, SupplyItem.sku_code, ReplenishmentRoute.route_code, (Outlet, SupplyItem) supply positions, (van_code, part_sku) van stock rows, and sequence_index within a route"
    error_id: "ERR_DUPLICATE_ACCOUNT_CODE | ERR_DUPLICATE_SERIAL_NUMBER | ERR_DUPLICATE_SKU_CODE | ERR_DUPLICATE_ROUTE_CODE | ERR_DUPLICATE_SUPPLY_POSITION | ERR_DUPLICATE_VAN_PART | ERR_DUPLICATE_STOP_SEQUENCE"
    http_status: 409
    applies_to: "POST /outlets, POST /dispenser-units, POST /supply-items, POST /replenishment-routes, POST /supply-positions, POST /van-part-stocks, POST /replenishment-routes/{id}/stops"
  - priority: 31
    category: business_constraint
    check: "at least one submitted supply position passes the eligibility filter of calculations.route_allocation_waterfall"
    error_id: ERR_NO_ELIGIBLE_POSITIONS
    http_status: 422
    applies_to: "POST /route-stops/{id}/allocations"
  - priority: 32
    category: business_fiscal
    check: "for each eligible position, SupplyItem.national_allocation_units - reserved_pool_units >= SupplyItem.case_pack_units"
    error_id: ERR_ALLOCATION_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /route-stops/{id}/allocations"
  - priority: 33
    category: business_fiscal
    check: "for each eligible position, ReplenishmentRoute.capacity_units - committed_units >= SupplyItem.case_pack_units"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /route-stops/{id}/allocations"
  - priority: 34
    category: business_fiscal
    check: "calculations.agreement_shortfall_fee yields assessed_fee_cents > 0"
    error_id: ERR_NO_SHORTFALL_TO_ASSESS
    http_status: 422
    applies_to: "POST /placement-agreements/{id}/assess-shortfall"
  - priority: 35
    category: business_fiscal
    check: "outcome RECALL requires PlacementAgreement.free_on_loan == true"
    error_id: ERR_RECALL_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /placement-agreements/{id}/recall-decision"
  - priority: 36
    category: business_fiscal
    check: "outcome RECALL requires PlacementAgreement.recall_exposure_cents >= 450000"
    error_id: ERR_RECALL_EXPOSURE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /placement-agreements/{id}/recall-decision"

endpoints:
  # --- logical clock (test-driving namespace) -------------------------------
  - method: POST
    path: "/fountain-network/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every due-date, window, promo and telemetry-window rule reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [NetworkAdmin, SupplyPlanner, ComplianceOfficer, ServiceTechnician, RouteDriver]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity is mutated; subsequent evaluate-due, forecast, allocation, dispatch and report calls read the new instant"]

  # --- outlets -------------------------------------------------------------
  - method: POST
    path: "/fountain-network/outlets"
    description: "Registers a customer outlet."
    roles: [NetworkAdmin]
    code: 201
    input: [name, account_code, region_code, "throughput_tier?", "water_hardness_gpg?"]
    output: Outlet
    side_effects: ["status = ACTIVE, service_posture = OPEN, both counters 0, version = 1"]
  - method: GET
    path: "/fountain-network/outlets/{id}"
    description: "Reads one outlet including its derived service_posture and counters."
    roles: [NetworkAdmin, SupplyPlanner, RouteDriver, ServiceTechnician, ComplianceOfficer, OutletManager]
    code: 200
    input: []
    output: Outlet
    side_effects: []
  - method: GET
    path: "/fountain-network/outlets"
    description: "Lists outlets with filtering and pagination."
    roles: [NetworkAdmin, SupplyPlanner, ComplianceOfficer]
    code: 200
    input: ["region_code?", "status?", "service_posture?", "limit?", "offset?"]
    output: Outlet[]
    side_effects: []
  - method: POST
    path: "/fountain-network/outlets/{id}/status-change"
    description: "Suspends, reinstates or closes an outlet (action: SUSPEND | REINSTATE | CLOSE)."
    roles: [NetworkAdmin]
    code: 200
    input: [action, "reason_code?"]
    output: Outlet
    side_effects:
      - "drives state_machines.Outlet.status"
      - "SUSPEND skips the outlet's PENDING and ARRIVED stops with skip_reason_code OUTLET_CLOSED and releases their allocations through calculations.supply_pool_ledger"
      - "recomputes service_posture via calculations.outlet_service_posture"
      - "increments Outlet.version by 1"
  - method: POST
    path: "/fountain-network/outlets/{id}/compliance-hold"
    description: "Places or releases the sanitation compliance hold on an outlet (action: PLACE | RELEASE)."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, hold_reason_code]
    output: Outlet
    side_effects:
      - "sets open_compliance_hold_count to 1 (PLACE) or 0 (RELEASE) and records last_hold_placed_by_user_id on PLACE"
      - "recomputes service_posture via calculations.outlet_service_posture"
      - "PLACE cascades: PENDING stops of this outlet become SKIPPED with skip_reason_code POSTURE_FROZEN, and their allocations are released through calculations.supply_pool_ledger"
      - "increments Outlet.version by 1"
  - method: GET
    path: "/fountain-network/outlets/{id}/brand-mix-report"
    description: "Computed read: 30-day brand mix shares by largest remainder plus the currently available promotional SKUs, per calculations.brand_mix_report."
    roles: [NetworkAdmin, SupplyPlanner, OutletManager]
    code: 200
    input: []
    output: "{ outlet_id: string, period_start: datetime, period_end: datetime, total_ounces: number, lines: array, top_brand_name: string, promo_available_skus: array }"
    side_effects: []

  # --- placement agreements ------------------------------------------------
  - method: POST
    path: "/fountain-network/placement-agreements"
    description: "Creates a placement agreement for an outlet. A new agreement supersedes any agreement of the same outlet still in DRAFT, which is moved to EXPIRED; the write is therefore guarded by OCC on Outlet.version (concurrency_rules.agreement-create-stale-outlet)."
    roles: [NetworkAdmin]
    code: 201
    input: [outlet_id, term_start_date, term_end_date, annual_commitment_gallons, equipment_value_cents, "free_on_loan?", "shortfall_fee_cents_per_gallon?", expected_outlet_version]
    output: PlacementAgreement
    side_effects:
      - "status = DRAFT, version = 1"
      - "any other PlacementAgreement of this outlet in status DRAFT transitions to EXPIRED"
      - "increments Outlet.version by 1"
  - method: GET
    path: "/fountain-network/placement-agreements/{id}"
    description: "Reads one placement agreement including its assessment outputs."
    roles: [NetworkAdmin, ComplianceOfficer, SupplyPlanner, OutletManager]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: []
  - method: GET
    path: "/fountain-network/placement-agreements"
    description: "Lists placement agreements; filter by outlet_id to walk an outlet's contract history."
    roles: [NetworkAdmin, ComplianceOfficer, SupplyPlanner]
    code: 200
    input: ["outlet_id?", "status?", "limit?", "offset?"]
    output: PlacementAgreement[]
    side_effects: []
  - method: POST
    path: "/fountain-network/placement-agreements/{id}/activate"
    description: "Activates a DRAFT agreement once equipment has been recorded against it."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: ["status DRAFT -> ACTIVE", "increments PlacementAgreement.version by 1"]
  - method: POST
    path: "/fountain-network/placement-agreements/{id}/assess-shortfall"
    description: "Runs the volume-shortfall assessment for a half-open period, writing the per-quarter rounded fee (calculations.agreement_shortfall_fee) and the equipment exposure under the chosen variant (calculations.equipment_recall_exposure)."
    roles: [NetworkAdmin]
    code: 200
    input: [period_start_date, period_end_date, "exposure_variant?"]
    output: PlacementAgreement
    side_effects:
      - "writes assessed_shortfall_gallons, assessed_fee_cents, recall_exposure_cents, exposure_variant, assessment_period_start, assessment_period_end, shortfall_assessed_by_user_id"
      - "status ACTIVE -> SHORTFALL_REVIEW"
      - "increments PlacementAgreement.version by 1"
  - method: POST
    path: "/fountain-network/placement-agreements/{id}/recall-decision"
    description: "Records the shortfall outcome (outcome: FEE_ONLY | RECALL). Segregation of duties: the deciding officer may not be the assessor."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: PlacementAgreement
    side_effects:
      - "FEE_ONLY: status SHORTFALL_REVIEW -> ACTIVE, assessed_fee_cents stands"
      - "RECALL: status SHORTFALL_REVIEW -> RECALL_PENDING and every IN_SERVICE or SERVICE_HOLD DispenserUnit of the agreement becomes RECALL_STAGED"
      - "writes recall_decided_by_user_id"
      - "increments PlacementAgreement.version by 1"
  - method: POST
    path: "/fountain-network/placement-agreements/{id}/close-term"
    description: "Expires an ACTIVE agreement whose term_end_date has elapsed on the logical clock."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PlacementAgreement
    side_effects: ["status ACTIVE -> EXPIRED", "increments PlacementAgreement.version by 1"]

  # --- dispenser units -----------------------------------------------------
  - method: POST
    path: "/fountain-network/dispenser-units"
    description: "Records a dispenser placed at an outlet under an agreement."
    roles: [NetworkAdmin]
    code: 201
    input: [outlet_id, agreement_id, serial_number, model_code, installed_at]
    output: DispenserUnit
    side_effects: ["status = IN_SERVICE, calibration_status = UNVERIFIED, lifetime_dispensed_gallons = 0, gallons_at_last_filter_change = 0, version = 1"]
  - method: GET
    path: "/fountain-network/dispenser-units/{id}"
    description: "Reads one dispenser unit including both state dimensions and its gallon counters."
    roles: [NetworkAdmin, SupplyPlanner, ServiceTechnician, ComplianceOfficer, OutletManager]
    code: 200
    input: []
    output: DispenserUnit
    side_effects: []
  - method: GET
    path: "/fountain-network/dispenser-units"
    description: "Lists dispenser units; filter by outlet_id or agreement_id to walk either parent."
    roles: [NetworkAdmin, SupplyPlanner, ServiceTechnician, ComplianceOfficer]
    code: 200
    input: ["outlet_id?", "agreement_id?", "status?", "calibration_status?", "limit?", "offset?"]
    output: DispenserUnit[]
    side_effects: []
  - method: POST
    path: "/fountain-network/dispenser-units/{id}/service-hold"
    description: "Places or releases a service hold on a unit (action: PLACE | RELEASE). Release is blocked while a SANITATION task is OVERDUE."
    roles: [ServiceTechnician]
    code: 200
    input: [action]
    output: DispenserUnit
    side_effects: ["status IN_SERVICE <-> SERVICE_HOLD", "increments DispenserUnit.version by 1"]
  - method: POST
    path: "/fountain-network/dispenser-units/{id}/confirm-return"
    description: "Confirms physical return of a RECALL_STAGED unit; the last return under an agreement terminates it, which in turn suspends the outlet."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DispenserUnit
    side_effects:
      - "status RECALL_STAGED -> RETURNED"
      - "waives the unit's SCHEDULED, DUE and OVERDUE MaintenanceTask rows and cancels its open ServiceCall rows, releasing any reserved van parts"
      - "when every unit of the agreement is RETURNED: agreement RECALL_PENDING -> TERMINATED, then Outlet ACTIVE -> SUSPENDED, then the outlet's PENDING stops are SKIPPED and their allocations released"
      - "increments DispenserUnit.version by 1"

  # --- supply items --------------------------------------------------------
  - method: POST
    path: "/fountain-network/supply-items"
    description: "Registers a cartridge or bag-in-box SKU, its case pack, yield and national allocation pool."
    roles: [NetworkAdmin]
    code: 201
    input: [sku_code, brand_name, supply_form, case_pack_units, ounces_per_unit, "promotional?", "promo_window_start?", "promo_window_end?", "national_allocation_units?"]
    output: SupplyItem
    side_effects: ["reserved_pool_units = 0, version = 1"]
  - method: GET
    path: "/fountain-network/supply-items/{id}"
    description: "Reads one SKU including the currently reserved share of its national pool."
    roles: [NetworkAdmin, SupplyPlanner, RouteDriver, OutletManager]
    code: 200
    input: []
    output: SupplyItem
    side_effects: []
  - method: PATCH
    path: "/fountain-network/supply-items/{id}"
    description: "Adjusts a SKU's national allocation pool or promotional window."
    roles: [NetworkAdmin]
    code: 200
    input: ["national_allocation_units?", "promo_window_start?", "promo_window_end?"]
    output: SupplyItem
    side_effects: ["increments SupplyItem.version by 1", "national_allocation_units may not be lowered below reserved_pool_units"]

  # --- telemetry -----------------------------------------------------------
  - method: POST
    path: "/fountain-network/telemetry-readings"
    description: "Ingests a pour-volume reading. Immutable event; drives the gallon counters, the filter-interval breach cascade and every forecast."
    roles: [SupplyPlanner, ServiceTechnician]
    code: 201
    input: [dispenser_unit_id, supply_item_id, dispensed_ounces, reading_at, "window_days?", "source?"]
    output: TelemetryReading
    side_effects:
      - "increments DispenserUnit.lifetime_dispensed_gallons by dispensed_ounces / 128 (2 decimals, round_half_up)"
      - "re-evaluates the unit's SCHEDULED FILTER_CHANGE tasks via calculations.maintenance_due_evaluation; a gallon breach moves the task straight to OVERDUE with breach_kind GALLON"
      - "each task entering OVERDUE increments Outlet.overdue_task_count and recomputes Outlet.service_posture via calculations.outlet_service_posture"
      - "a posture that becomes FROZEN skips the outlet's PENDING stops with skip_reason_code POSTURE_FROZEN and releases their allocations via calculations.supply_pool_ledger"
      - "increments DispenserUnit.version by 1"
  - method: GET
    path: "/fountain-network/telemetry-readings/{id}"
    description: "Reads one telemetry reading."
    roles: [NetworkAdmin, SupplyPlanner, ServiceTechnician, ComplianceOfficer]
    code: 200
    input: []
    output: TelemetryReading
    side_effects: []
  - method: GET
    path: "/fountain-network/telemetry-readings"
    description: "Lists telemetry readings; filter by dispenser_unit_id or supply_item_id and bound by reading_at."
    roles: [NetworkAdmin, SupplyPlanner, ServiceTechnician, ComplianceOfficer]
    code: 200
    input: ["dispenser_unit_id?", "supply_item_id?", "reading_at_from?", "reading_at_to?", "limit?", "offset?"]
    output: TelemetryReading[]
    side_effects: []

  # --- supply positions ----------------------------------------------------
  - method: POST
    path: "/fountain-network/supply-positions"
    description: "Opens the stock position for one SKU at one outlet."
    roles: [SupplyPlanner]
    code: 201
    input: [outlet_id, supply_item_id, "on_hand_units?"]
    output: OutletSupplyPosition
    side_effects: ["forecast_variant = TRAILING_ACTUAL, forecast_units = 0, requested_units = 0, allocated_units = 0, alert_level = NONE, promo_suppressed = false, version = 1"]
  - method: GET
    path: "/fountain-network/supply-positions/{id}"
    description: "Reads one stock position including its forecast, alert band and allocation link."
    roles: [NetworkAdmin, SupplyPlanner, RouteDriver, OutletManager]
    code: 200
    input: []
    output: OutletSupplyPosition
    side_effects: []
  - method: GET
    path: "/fountain-network/supply-positions"
    description: "Lists stock positions; filter by outlet_id, supply_item_id or planned_route_stop_id."
    roles: [NetworkAdmin, SupplyPlanner, RouteDriver, OutletManager]
    code: 200
    input: ["outlet_id?", "supply_item_id?", "planned_route_stop_id?", "alert_level?", "limit?", "offset?"]
    output: OutletSupplyPosition[]
    side_effects: []
  - method: POST
    path: "/fountain-network/supply-positions/{id}/forecast"
    description: "Runs calculations.outlet_supply_forecast under the requested variant over a telemetry window ending at the logical clock."
    roles: [SupplyPlanner]
    code: 200
    input: [variant, window_days]
    output: OutletSupplyPosition
    side_effects:
      - "writes forecast_variant, forecast_units, requested_units, alert_level, promo_suppressed"
      - "clears alert_acknowledged_by_user_id"
      - "increments OutletSupplyPosition.version by 1"
  - method: POST
    path: "/fountain-network/supply-positions/{id}/acknowledge-alert"
    description: "Outlet manager acknowledges the current low-supply alert on their own position."
    roles: [OutletManager]
    code: 200
    input: []
    output: OutletSupplyPosition
    side_effects: ["writes alert_acknowledged_by_user_id = X-User-ID", "increments OutletSupplyPosition.version by 1"]

  # --- replenishment routes ------------------------------------------------
  - method: POST
    path: "/fountain-network/replenishment-routes"
    description: "Plans a replenishment route out of a depot region for one service date and van."
    roles: [SupplyPlanner]
    code: 201
    input: [route_code, depot_region_code, service_date, van_code, capacity_units]
    output: ReplenishmentRoute
    side_effects: ["status = PLANNED, committed_units = 0, delivered_units = 0, version = 1"]
  - method: GET
    path: "/fountain-network/replenishment-routes/{id}"
    description: "Reads one route including its committed and delivered unit totals."
    roles: [NetworkAdmin, SupplyPlanner, RouteDriver]
    code: 200
    input: []
    output: ReplenishmentRoute
    side_effects: []
  - method: POST
    path: "/fountain-network/replenishment-routes/{id}/stops"
    description: "Adds a delivery stop to a PLANNED route. Guarded by OCC on ReplenishmentRoute.version (concurrency_rules.stop-create-stale-route) and by the half-open window-overlap rule."
    roles: [SupplyPlanner]
    code: 201
    input: [outlet_id, sequence_index, window_start, window_end, expected_route_version]
    output: RouteStop
    side_effects: ["status = PENDING, delivered_units = 0, version = 1", "increments ReplenishmentRoute.version by 1"]
  - method: POST
    path: "/fountain-network/replenishment-routes/{id}/dispatch"
    description: "Releases a planned route to the driver."
    roles: [SupplyPlanner]
    code: 200
    input: [expected_route_version]
    output: ReplenishmentRoute
    side_effects: ["status PLANNED -> DISPATCHED", "increments ReplenishmentRoute.version by 1"]
  - method: POST
    path: "/fountain-network/replenishment-routes/{id}/complete"
    description: "Closes a dispatched route once every stop is SERVED or SKIPPED."
    roles: [SupplyPlanner]
    code: 200
    input: []
    output: ReplenishmentRoute
    side_effects: ["status DISPATCHED -> COMPLETED", "recomputes delivered_units", "increments ReplenishmentRoute.version by 1"]
  - method: POST
    path: "/fountain-network/replenishment-routes/{id}/cancel"
    description: "Cancels a route, skipping its open stops and returning every reserved pool unit."
    roles: [SupplyPlanner]
    code: 200
    input: [expected_route_version, "reason_code?"]
    output: ReplenishmentRoute
    side_effects:
      - "status PLANNED or DISPATCHED -> CANCELLED"
      - "PENDING and ARRIVED stops become SKIPPED with skip_reason_code ACCESS_DENIED"
      - "each skipped stop releases its positions through calculations.supply_pool_ledger, restoring SupplyItem.reserved_pool_units and ReplenishmentRoute.committed_units"
      - "increments ReplenishmentRoute.version by 1"

  # --- route stops ---------------------------------------------------------
  - method: GET
    path: "/fountain-network/route-stops/{id}"
    description: "Reads one stop including its delivered units and skip reason."
    roles: [NetworkAdmin, SupplyPlanner, RouteDriver, OutletManager]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: "/fountain-network/route-stops"
    description: "Lists stops; filter by route_id or outlet_id."
    roles: [NetworkAdmin, SupplyPlanner, RouteDriver, OutletManager]
    code: 200
    input: ["route_id?", "outlet_id?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: "/fountain-network/route-stops/{id}/allocations"
    description: "Runs calculations.route_allocation_waterfall over the submitted positions, committing whole cases from each SKU's national pool to this stop."
    roles: [SupplyPlanner]
    code: 200
    input: [supply_position_ids]
    output: "{ route_stop_id: string, allocated_position_count: integer, total_allocated_units: integer, granted_units_by_position: array }"
    side_effects:
      - "writes OutletSupplyPosition.allocated_units and planned_route_stop_id for every granted position"
      - "increments SupplyItem.reserved_pool_units and ReplenishmentRoute.committed_units by each grant"
      - "increments the version of every mutated OutletSupplyPosition, SupplyItem and ReplenishmentRoute by 1"
  - method: POST
    path: "/fountain-network/route-stops/{id}/arrive"
    description: "Driver marks arrival at the stop."
    roles: [RouteDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["status PENDING -> ARRIVED", "increments RouteStop.version by 1"]
  - method: POST
    path: "/fountain-network/route-stops/{id}/serve"
    description: "Driver hands over the allocated units; blocked while the outlet is FROZEN or any unit at the outlet is OUT_OF_SPEC."
    roles: [RouteDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "status ARRIVED -> SERVED"
      - "moves allocated_units into on_hand_units for each linked position, clears the allocation link, decrements SupplyItem.reserved_pool_units and writes RouteStop.delivered_units"
      - "recomputes each affected position's alert_level"
      - "increments the version of every mutated row by 1"
  - method: POST
    path: "/fountain-network/route-stops/{id}/skip"
    description: "Driver skips the stop, releasing every unit committed to it."
    roles: [RouteDriver]
    code: 200
    input: [skip_reason_code]
    output: RouteStop
    side_effects:
      - "status PENDING or ARRIVED -> SKIPPED with the submitted skip_reason_code"
      - "releases the stop's positions through calculations.supply_pool_ledger, restoring SupplyItem.reserved_pool_units and ReplenishmentRoute.committed_units"
      - "increments the version of every mutated row by 1"

  # --- maintenance ---------------------------------------------------------
  - method: POST
    path: "/fountain-network/maintenance-tasks"
    description: "Schedules preventive work, a brix calibration, a sanitation cycle or a water filter change. FILTER_CHANGE carries a gallon_interval which is stored derated for the outlet's water hardness."
    roles: [ComplianceOfficer]
    code: 201
    input: [dispenser_unit_id, task_type, due_at, "gallon_interval?"]
    output: MaintenanceTask
    side_effects: ["status = SCHEDULED, breach_kind = null, version = 1", "writes effective_gallon_interval per calculations.maintenance_due_evaluation when gallon_interval is supplied"]
  - method: GET
    path: "/fountain-network/maintenance-tasks/{id}"
    description: "Reads one maintenance task including its derated interval and breach kind."
    roles: [NetworkAdmin, ComplianceOfficer, ServiceTechnician, OutletManager]
    code: 200
    input: []
    output: MaintenanceTask
    side_effects: []
  - method: GET
    path: "/fountain-network/maintenance-tasks"
    description: "Lists maintenance tasks; filter by dispenser_unit_id, task_type or status."
    roles: [NetworkAdmin, ComplianceOfficer, ServiceTechnician, OutletManager]
    code: 200
    input: ["dispenser_unit_id?", "task_type?", "status?", "limit?", "offset?"]
    output: MaintenanceTask[]
    side_effects: []
  - method: POST
    path: "/fountain-network/maintenance-tasks/{id}/evaluate-due"
    description: "Re-evaluates one task against the logical clock and the unit's gallon counters per calculations.maintenance_due_evaluation."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MaintenanceTask
    side_effects:
      - "status SCHEDULED -> DUE, SCHEDULED -> OVERDUE or DUE -> OVERDUE, writing breach_kind"
      - "entering OVERDUE increments Outlet.overdue_task_count and recomputes Outlet.service_posture"
      - "a posture that becomes FROZEN skips the outlet's PENDING stops and releases their allocations"
      - "increments MaintenanceTask.version by 1"
  - method: POST
    path: "/fountain-network/maintenance-tasks/{id}/complete"
    description: "Technician records completion; FILTER_CHANGE resets the gallon baseline and BRIX_CALIBRATION moves the unit's calibration dimension."
    roles: [ServiceTechnician]
    code: 200
    input: ["measured_brix_ratio?"]
    output: MaintenanceTask
    side_effects:
      - "status SCHEDULED, DUE or OVERDUE -> COMPLETED; writes completed_at and completed_by_user_id"
      - "FILTER_CHANGE: DispenserUnit.gallons_at_last_filter_change = DispenserUnit.lifetime_dispensed_gallons"
      - "BRIX_CALIBRATION: writes calibration_outcome, DispenserUnit.brix_ratio_last_measured and the DispenserUnit.calibration_status dimension"
      - "leaving OVERDUE decrements Outlet.overdue_task_count and recomputes Outlet.service_posture"
      - "increments MaintenanceTask.version by 1"
  - method: POST
    path: "/fountain-network/maintenance-tasks/{id}/waive"
    description: "Compliance officer waives a DUE or OVERDUE task. Segregation of duties: the officer who placed the outlet's compliance hold may not waive."
    roles: [ComplianceOfficer]
    code: 200
    input: [waiver_reason]
    output: MaintenanceTask
    side_effects:
      - "status DUE or OVERDUE -> WAIVED; writes waiver_reason and waived_by_user_id"
      - "leaving OVERDUE decrements Outlet.overdue_task_count and recomputes Outlet.service_posture"
      - "increments MaintenanceTask.version by 1"

  # --- service calls -------------------------------------------------------
  - method: POST
    path: "/fountain-network/service-calls"
    description: "Opens a service call; severity is computed on creation from symptom, outlet posture, overdue count and calibration state per calculations.service_call_severity."
    roles: [OutletManager, NetworkAdmin]
    code: 201
    input: [dispenser_unit_id, reported_at, symptom_code]
    output: ServiceCall
    side_effects: ["status = OPEN, version = 1", "writes severity_score and severity"]
  - method: GET
    path: "/fountain-network/service-calls/{id}"
    description: "Reads one service call including its parts reservation and escalation count."
    roles: [NetworkAdmin, ServiceTechnician, ComplianceOfficer, OutletManager]
    code: 200
    input: []
    output: ServiceCall
    side_effects: []
  - method: GET
    path: "/fountain-network/service-calls"
    description: "Lists service calls; filter by dispenser_unit_id or reserved_part_stock_id."
    roles: [NetworkAdmin, ServiceTechnician, ComplianceOfficer, OutletManager]
    code: 200
    input: ["dispenser_unit_id?", "reserved_part_stock_id?", "status?", "severity?", "limit?", "offset?"]
    output: ServiceCall[]
    side_effects: []
  - method: POST
    path: "/fountain-network/service-calls/{id}/dispatch"
    description: "Assigns a van and an on-site window, optionally reserving a part off that van. Van windows are closed intervals padded by a 30-minute travel buffer."
    roles: [ServiceTechnician]
    code: 200
    input: [van_code, scheduled_window_start, scheduled_window_end, "part_sku?", "part_units?"]
    output: ServiceCall
    side_effects:
      - "status OPEN or ESCALATED -> DISPATCHED; writes van_code, both window bounds and assigned_tech_user_id"
      - "with part_sku: selects the (van_code, part_sku) VanPartStock row, moves part_units from on_van_units to reserved_units and writes reserved_part_stock_id and reserved_part_units"
      - "increments ServiceCall.version and any mutated VanPartStock.version by 1"
  - method: POST
    path: "/fountain-network/service-calls/{id}/arrive-on-site"
    description: "Assigned technician reports arrival."
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: ServiceCall
    side_effects: ["status DISPATCHED -> ON_SITE", "increments ServiceCall.version by 1"]
  - method: POST
    path: "/fountain-network/service-calls/{id}/resolve"
    description: "Closes the call, consuming part of the reservation and returning the remainder to the van."
    roles: [ServiceTechnician]
    code: 200
    input: [resolution_code, "consumed_part_units?"]
    output: ServiceCall
    side_effects:
      - "status ON_SITE -> RESOLVED; writes resolution_code and consumed_part_units"
      - "settles the reservation through calculations.van_parts_ledger: reserved_units down, consumed_units up, unused units back to on_van_units"
      - "clears reserved_part_stock_id and reserved_part_units"
      - "increments ServiceCall.version and VanPartStock.version by 1"
  - method: POST
    path: "/fountain-network/service-calls/{id}/escalate"
    description: "Hands the call back for re-dispatch, fully reversing the parts reservation."
    roles: [ServiceTechnician]
    code: 200
    input: [escalation_reason_code]
    output: ServiceCall
    side_effects:
      - "status ON_SITE -> ESCALATED; increments escalation_count by 1"
      - "compensating release through calculations.van_parts_ledger: every reserved unit returns to on_van_units"
      - "clears van_code, both window bounds, assigned_tech_user_id, reserved_part_stock_id and reserved_part_units"
      - "increments ServiceCall.version and VanPartStock.version by 1"
  - method: POST
    path: "/fountain-network/service-calls/{id}/cancel"
    description: "Cancels an OPEN or DISPATCHED call, releasing any reservation."
    roles: [OutletManager, NetworkAdmin]
    code: 200
    input: []
    output: ServiceCall
    side_effects:
      - "status OPEN or DISPATCHED -> CANCELLED"
      - "compensating release through calculations.van_parts_ledger when a reservation is held"
      - "increments ServiceCall.version by 1"

  # --- van parts -----------------------------------------------------------
  - method: POST
    path: "/fountain-network/van-part-stocks"
    description: "Loads a service part onto a van."
    roles: [NetworkAdmin]
    code: 201
    input: [van_code, part_sku, on_van_units]
    output: VanPartStock
    side_effects: ["initial_units = on_van_units, reserved_units = 0, consumed_units = 0, restocked_units = 0, version = 1"]
  - method: GET
    path: "/fountain-network/van-part-stocks/{id}"
    description: "Reads one van stock row including all four ledger buckets."
    roles: [NetworkAdmin, ServiceTechnician]
    code: 200
    input: []
    output: VanPartStock
    side_effects: []
  - method: GET
    path: "/fountain-network/van-part-stocks"
    description: "Lists van stock rows; filter by van_code or part_sku."
    roles: [NetworkAdmin, ServiceTechnician]
    code: 200
    input: ["van_code?", "part_sku?", "limit?", "offset?"]
    output: VanPartStock[]
    side_effects: []
  - method: POST
    path: "/fountain-network/van-part-stocks/{id}/restock"
    description: "Adds units to a van stock row, raising the conserved total per calculations.van_parts_ledger."
    roles: [NetworkAdmin]
    code: 200
    input: [units]
    output: VanPartStock
    side_effects: ["on_van_units += units and restocked_units += units", "increments VanPartStock.version by 1"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_OUTLET_OWNERSHIP_REQUIRED
    http: 403
    condition: "an OutletManager acts on a resource that does not resolve to the Outlet whose id equals X-User-ID"
  - id: ERR_TECHNICIAN_NOT_ASSIGNED
    http: 403
    condition: "arrive-on-site, resolve or escalate attempted by a technician other than ServiceCall.assigned_tech_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, undeclared enum member, out-of-range numeric value, or pagination limit outside 1..100"
  - id: ERR_OUTLET_NOT_FOUND
    http: 404
    condition: "no Outlet matches the supplied path or body outlet_id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no PlacementAgreement matches the supplied path or body agreement_id"
  - id: ERR_DISPENSER_UNIT_NOT_FOUND
    http: 404
    condition: "no DispenserUnit matches the supplied path or body dispenser_unit_id"
  - id: ERR_SUPPLY_ITEM_NOT_FOUND
    http: 404
    condition: "no SupplyItem matches the supplied path or body supply_item_id"
  - id: ERR_SUPPLY_POSITION_NOT_FOUND
    http: 404
    condition: "no OutletSupplyPosition matches the supplied path id or a member of supply_position_ids"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "no ReplenishmentRoute matches the supplied path id"
  - id: ERR_ROUTE_STOP_NOT_FOUND
    http: 404
    condition: "no RouteStop matches the supplied path id"
  - id: ERR_MAINTENANCE_TASK_NOT_FOUND
    http: 404
    condition: "no MaintenanceTask matches the supplied path id"
  - id: ERR_SERVICE_CALL_NOT_FOUND
    http: 404
    condition: "no ServiceCall matches the supplied path id"
  - id: ERR_VAN_PART_STOCK_NOT_FOUND
    http: 404
    condition: "no VanPartStock matches the supplied path id"
  - id: ERR_TELEMETRY_READING_NOT_FOUND
    http: 404
    condition: "no TelemetryReading matches the supplied path id"
  - id: ERR_PART_NOT_ON_VAN
    http: 404
    condition: "dispatch names a part_sku for which the requested van_code carries no VanPartStock row"
  - id: ERR_STALE_OUTLET_VERSION
    http: 412
    condition: "expected_outlet_version does not equal the stored Outlet.version on agreement creation"
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_version does not equal the stored ReplenishmentRoute.version on stop creation, dispatch or cancellation"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not declared from the entity's current state in §1.2"
  - id: ERR_UNIT_NOT_SERVICEABLE
    http: 409
    condition: "a service call is opened or dispatched while its DispenserUnit.status is RECALL_STAGED or RETURNED"
  - id: ERR_ESCALATION_LIMIT_REACHED
    http: 409
    condition: "escalate attempted when ServiceCall.escalation_count is already 2"
  - id: ERR_OUTLET_POSTURE_FROZEN
    http: 409
    condition: "allocation or service attempted while the outlet's service_posture is FROZEN"
  - id: ERR_CALIBRATION_OUT_OF_SPEC
    http: 409
    condition: "a stop is served while any DispenserUnit at that outlet has calibration_status OUT_OF_SPEC"
  - id: ERR_SANITATION_OVERDUE
    http: 409
    condition: "a service hold release is attempted while a SANITATION task on that unit is OVERDUE"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the recall decision is recorded by the same X-User-ID that ran the shortfall assessment"
  - id: ERR_WAIVER_SEGREGATION_VIOLATION
    http: 409
    condition: "a maintenance waiver is recorded by the same X-User-ID stored in Outlet.last_hold_placed_by_user_id"
  - id: ERR_OUTLET_AGREEMENT_MISMATCH
    http: 422
    condition: "the submitted outlet_id differs from the outlet_id of the submitted agreement_id"
  - id: ERR_REGION_MISMATCH
    http: 422
    condition: "the stop's Outlet.region_code differs from the route's depot_region_code"
  - id: ERR_TIMESTAMP_IN_FUTURE
    http: 422
    condition: "reading_at or reported_at is later than the logical clock"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "an interval's end bound is not strictly after its start bound"
  - id: ERR_TERM_NOT_ELAPSED
    http: 409
    condition: "close-term attempted while the logical clock is before term_end_date"
  - id: ERR_STOP_WINDOW_OVERLAP
    http: 409
    condition: "the new stop window overlaps a PENDING or ARRIVED stop of the same route under half-open interval arithmetic"
  - id: ERR_VAN_WINDOW_CONFLICT
    http: 409
    condition: "the requested van window collides with a DISPATCHED or ON_SITE call on the same van under closed-interval arithmetic with a 30-minute buffer"
  - id: ERR_INSUFFICIENT_VAN_PARTS
    http: 409
    condition: "the selected VanPartStock has fewer on_van_units than the requested part_units"
  - id: ERR_CONSUMED_EXCEEDS_RESERVED
    http: 422
    condition: "consumed_part_units exceeds ServiceCall.reserved_part_units"
  - id: ERR_GALLON_INTERVAL_REQUIRED
    http: 422
    condition: "a FILTER_CHANGE task is created without gallon_interval"
  - id: ERR_GALLON_INTERVAL_NOT_APPLICABLE
    http: 422
    condition: "gallon_interval is supplied for a task_type other than FILTER_CHANGE"
  - id: ERR_BRIX_MEASUREMENT_REQUIRED
    http: 422
    condition: "a BRIX_CALIBRATION task is completed without measured_brix_ratio"
  - id: ERR_NO_ELIGIBLE_POSITIONS
    http: 422
    condition: "no submitted supply position passes the allocation eligibility filter"
  - id: ERR_DUPLICATE_ACCOUNT_CODE
    http: 409
    condition: "another Outlet already uses the submitted account_code"
  - id: ERR_DUPLICATE_SERIAL_NUMBER
    http: 409
    condition: "another DispenserUnit already uses the submitted serial_number"
  - id: ERR_DUPLICATE_SKU_CODE
    http: 409
    condition: "another SupplyItem already uses the submitted sku_code"
  - id: ERR_DUPLICATE_ROUTE_CODE
    http: 409
    condition: "another ReplenishmentRoute already uses the submitted route_code"
  - id: ERR_DUPLICATE_SUPPLY_POSITION
    http: 409
    condition: "a position already exists for the submitted (outlet_id, supply_item_id) pair"
  - id: ERR_DUPLICATE_VAN_PART
    http: 409
    condition: "a van stock row already exists for the submitted (van_code, part_sku) pair"
  - id: ERR_DUPLICATE_STOP_SEQUENCE
    http: 409
    condition: "another stop on the same route already uses the submitted sequence_index"
  - id: ERR_ALLOCATION_POOL_EXHAUSTED
    http: 409
    condition: "an eligible position's SKU has fewer unreserved pool units than one case pack"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "an eligible position's SKU cannot fit one case pack in the route's remaining capacity"
  - id: ERR_POOL_BELOW_RESERVED
    http: 422
    condition: "a PATCH lowers SupplyItem.national_allocation_units below reserved_pool_units"
  - id: ERR_NO_SHORTFALL_TO_ASSESS
    http: 422
    condition: "the assessed period yields assessed_fee_cents == 0"
  - id: ERR_RECALL_NOT_PERMITTED
    http: 422
    condition: "outcome RECALL requested on an agreement whose free_on_loan is false"
  - id: ERR_RECALL_EXPOSURE_BELOW_FLOOR
    http: 422
    condition: "outcome RECALL requested while recall_exposure_cents is below 450000"

roles:
  - name: NetworkAdmin
    description: "Bottler operations administrator: masters outlets, agreements, equipment, SKUs and van loadouts, and runs shortfall assessments."
    identity: "opaque"
    exclusive_operations:
      - "POST /fountain-network/outlets"
      - "POST /fountain-network/outlets/{id}/status-change"
      - "POST /fountain-network/placement-agreements"
      - "POST /fountain-network/placement-agreements/{id}/activate"
      - "POST /fountain-network/placement-agreements/{id}/assess-shortfall"
      - "POST /fountain-network/placement-agreements/{id}/close-term"
      - "POST /fountain-network/dispenser-units"
      - "POST /fountain-network/dispenser-units/{id}/confirm-return"
      - "POST /fountain-network/supply-items"
      - "PATCH /fountain-network/supply-items/{id}"
      - "POST /fountain-network/van-part-stocks"
      - "POST /fountain-network/van-part-stocks/{id}/restock"
    shared_operations:
      - "POST /fountain-network/_clock/set_current_utc"
      - "POST /fountain-network/service-calls"
      - "POST /fountain-network/service-calls/{id}/cancel"
      - "all GET reads"
  - name: SupplyPlanner
    description: "Demand planner who forecasts outlet consumption, allocates the national pool and plans replenishment routes."
    identity: "opaque"
    exclusive_operations:
      - "POST /fountain-network/supply-positions"
      - "POST /fountain-network/supply-positions/{id}/forecast"
      - "POST /fountain-network/replenishment-routes"
      - "POST /fountain-network/replenishment-routes/{id}/stops"
      - "POST /fountain-network/replenishment-routes/{id}/dispatch"
      - "POST /fountain-network/replenishment-routes/{id}/complete"
      - "POST /fountain-network/replenishment-routes/{id}/cancel"
      - "POST /fountain-network/route-stops/{id}/allocations"
    shared_operations:
      - "POST /fountain-network/_clock/set_current_utc"
      - "POST /fountain-network/telemetry-readings"
      - "GET reads on outlets, agreements, units, positions, routes, stops and telemetry"
  - name: RouteDriver
    description: "Delivery driver who executes a dispatched route stop by stop."
    identity: "opaque"
    exclusive_operations:
      - "POST /fountain-network/route-stops/{id}/arrive"
      - "POST /fountain-network/route-stops/{id}/serve"
      - "POST /fountain-network/route-stops/{id}/skip"
    shared_operations:
      - "POST /fountain-network/_clock/set_current_utc"
      - "GET reads on outlets, supply items, positions, routes and stops"
  - name: ServiceTechnician
    description: "Field technician who works service calls off a van and completes maintenance and calibration tasks."
    identity: "opaque"
    exclusive_operations:
      - "POST /fountain-network/dispenser-units/{id}/service-hold"
      - "POST /fountain-network/service-calls/{id}/dispatch"
      - "POST /fountain-network/service-calls/{id}/arrive-on-site"
      - "POST /fountain-network/service-calls/{id}/resolve"
      - "POST /fountain-network/service-calls/{id}/escalate"
      - "POST /fountain-network/maintenance-tasks/{id}/complete"
    shared_operations:
      - "POST /fountain-network/_clock/set_current_utc"
      - "POST /fountain-network/telemetry-readings"
      - "GET reads on units, tasks, service calls, van part stocks and telemetry"
  - name: ComplianceOfficer
    description: "Quality and compliance officer who owns sanitation holds, the maintenance schedule, waivers and recall decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /fountain-network/outlets/{id}/compliance-hold"
      - "POST /fountain-network/placement-agreements/{id}/recall-decision"
      - "POST /fountain-network/maintenance-tasks"
      - "POST /fountain-network/maintenance-tasks/{id}/evaluate-due"
      - "POST /fountain-network/maintenance-tasks/{id}/waive"
    shared_operations:
      - "POST /fountain-network/_clock/set_current_utc"
      - "GET reads on outlets, agreements, units, tasks, service calls and telemetry"
  - name: OutletManager
    description: "Manager of one customer outlet; acts only on that outlet's own resources."
    identity: "entity_backed:Outlet"
    exclusive_operations:
      - "POST /fountain-network/supply-positions/{id}/acknowledge-alert"
    shared_operations:
      - "POST /fountain-network/service-calls"
