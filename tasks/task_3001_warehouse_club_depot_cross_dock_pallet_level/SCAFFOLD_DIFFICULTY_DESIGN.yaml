            - call: "GET /wcd/chargebacks"
              payload: { appointment_id: "${appt_ns}" }
              as: DepotManager
              captures: { ns_amount: "$.data[0].amount_cents" }
          assert:
            - "unload_fee == 152100 (26 pallets * 4500 = 117000, above MID_LOAD_THRESHOLD 25 so tier multiplier 1.30: 152100)"
            - "ns_amount == 112500 (NO_SHOW base 75000 * repeat multiplier 1.5 from 2 prior CONFIRMED chargebacks)"
