            - { call: "POST /fenestration/dealers", payload: { name: "B", ship_to_state_code: "MN" }, as: PlantManager, captures: { dB: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dA}", order_date: "2026-08-02T00:00:00Z" }, as: DealerRep, as_user_id: "${dA}", captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: DealerRep, as_user_id: "${dA}" }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/confirm", as: DealerRep, as_user_id: "${dB}", captures: { err: $.data.error_id } }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: DealerRep, as_user_id: "${dA}", captures: { ps: $.data.production_status } }
          assert:
