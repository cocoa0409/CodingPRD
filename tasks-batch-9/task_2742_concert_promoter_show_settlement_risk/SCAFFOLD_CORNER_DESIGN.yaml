          - "validations[priority=5]"
          - "validations[priority=6]"
          - "validations[priority=7]"
          - "validations[priority=12]"
        distinguishing_aspect: |
          Under a flat topology the FK is carried in the payload rather than the URL, so it is easy to
          persist a row whose parent does not exist. Every declared FK input is probed with an
          unallocated UUID, and the two-bad-FK case pins the resolution ORDER: POST /shows with both a
