            - call: "POST /api/feed-deliveries"
              payload: { farm_id: "${farm_id}", delivered_at: "2026-07-01", quantity_kg: 5000, cost_per_kg_cents: 50 }
              as: FarmManager
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 120, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
          trigger:
            - call: "GET /api/flocks/${flock_id}/economics?period_start=2026-07-27&period_end=2026-08-02&variant=ACTUAL_FIFO"
              payload: {}
              as: FarmManager
