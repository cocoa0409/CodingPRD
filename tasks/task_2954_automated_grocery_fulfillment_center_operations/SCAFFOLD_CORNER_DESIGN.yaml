              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "ada@example.com", full_name: "Ada Lane", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_ada: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "bo@example.com", full_name: "Bo Reed", loyalty_tier: "PLUS", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_bo: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 5 }
              as: Customer
              as_user_id: "${cust_ada}"
              captures: { order_ada: $.data.id }
            - call: "POST /customer-orders/${order_ada}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_ada}"
          trigger:
            - call: "POST /customer-orders/${order_ada}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: ""
              as_user_id: ""
              captures: { err_401_a: $.data.error_id }
            - call: "POST /customer-orders/${order_ada}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Wizard
              as_user_id: "${cust_ada}"
              captures: { err_401_b: $.data.error_id }
            - call: "POST /customer-orders/${order_ada}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: WavePlanner
              as_user_id: "planner-1"
              captures: { err_403_a: $.data.error_id }
            - call: "POST /customer-orders/${order_ada}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "00000000-0000-4000-8000-0000000000d5"
              captures: { err_403_b: $.data.error_id }
            - call: "POST /customer-orders/${order_ada}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_bo}"
              captures: { err_403_c: $.data.error_id }
          assert:
            - "trigger 1 sends neither X-User-Role nor X-User-ID and returns HTTP 401 with ${err_401_a} == ERR_UNAUTHENTICATED"
            - "trigger 2 returns HTTP 401 with ${err_401_b} == ERR_UNKNOWN_ROLE (Wizard is not one of the five declared roles)"
            - "trigger 3 returns HTTP 403 with ${err_403_a} == ERR_FORBIDDEN_ROLE (POST /customer-orders/{orderId}/lines lists only Customer)"
            - "trigger 4 returns HTTP 403 with ${err_403_b} == ERR_CUSTOMER_IDENTITY_UNKNOWN"
            - "trigger 5 returns HTTP 403 with ${err_403_c} == ERR_ORDER_NOT_OWNED (Bo is a real customer, just not this order's)"
            - "CustomerOrder.${order_ada}.merchandise_subtotal_cents is still 1400 and GET /order-lines?order_id=${order_ada} still returns total_count == 1"
            - "a bogus X-User-Role is rejected before the endpoint's own role list is consulted, so trigger 2 is 401 and not 403"

