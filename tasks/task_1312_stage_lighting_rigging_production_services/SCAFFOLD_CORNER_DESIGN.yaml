            - "confirm by ${t1} succeeds: status == CONFIRMED"

      - name: occ_plot_create_stale_production_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[plot-create-stale-production]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Production.version: after a first plot creation advances the production to version 3, a second creation still carrying expected_production_version 2 is rejected with ERR_STALE_VERSION (412) — two strictly sequential requests, no overlap."
        test_recipe:
          setup: ["IATSE venue; production P1 in PLANNING at version 2 (observed by the client)"]
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
