# =============================================================================
# SCAFFOLD — State Park Concession & Lease Management
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2781. State Park Concession & Lease Management (state parks concessions program): concession
  opportunity identification with market analysis and required capital investment, competitive
  solicitation with prospectus, minimum franchise fee and evaluation criteria, contract terms
  including percentage rent, capital improvement obligations and ownership of improvements at
  expiration, operating standards for rates charged to the public, seasons and service levels with
  approval requirements, gross receipts reporting, audit rights and franchise fee reconciliation,
  maintenance responsibility split between the concessionaire and the agency, performance bond,
  insurance and default remedies, contract expiration, successor selection and transfer of
  possessory interest

domain_name: state-park-concession-lease-management
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a top-level collection linked by explicit FK fields; no
  # entity is addressed through a nested parent path (the single exception is
  # the append-only ProposalEvaluation sub-resource read).

  state_machine_shape: cyclic
  # Proposal carries a revision cycle (SUBMITTED -> UNDER_REVIEW ->
  # REVISION_REQUESTED -> SUBMITTED) plus a scored fork; Lease carries two
  # independent state dimensions (contract_status x compliance_status);
  # CapitalImprovement and OperatingPlan carry return/resubmit cycles.

  relationship_patterns:
    - one_to_many
    - self_referential      # Lease.predecessor_lease_id, FeeReconciliation.superseded_by_id
    - cross_aggregate       # AuditEngagement -> GrossReceiptsReport -> FeeReconciliation -> Lease

  role_model: segregation_of_duties
  # A user who scored a proposal on a prospectus may not award that prospectus,
  # and the user who awarded a lease may not execute it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 76 endpoints / 74 error codes / 11 calculations (two of them
  # dual-variant) / 13 state machines across 12 entities (Lease carries two
  # independent status dimensions) / 51 priority-ordered validation bands.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: Park
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "State park name" }
      - { name: region_code, type: enum, source: input, description: "Administrative region", constraints: "one of {NW, NE, SW, SE}" }
      - { name: annual_visitation, type: integer, source: input, description: "Prior-year visitor count", constraints: ">= 0" }
      - { name: comparable_lodging_rate_cents, type: integer, source: input, description: "Regional benchmark nightly lodging rate used as the public-rate ceiling base", constraints: "> 0" }
      - { name: comparable_meal_rate_cents, type: integer, source: input, description: "Regional benchmark meal rate used as the public-rate ceiling base", constraints: "> 0" }
      - { name: comparable_activity_rate_cents, type: integer, source: input, description: "Regional benchmark guided-activity rate used as the public-rate ceiling base", constraints: "> 0" }
      - { name: open_closure_window_count, type: integer, source: computed, description: "Number of CapitalImprovement rows on this park whose status is APPROVED — the park's currently reserved construction-closure windows", default: 0 }
      - { name: status, type: enum, source: system, description: "Park operating status", default: "OPERATING", constraints: "one of {OPERATING, CLOSED}" }

  - name: ConcessionOpportunity
    parent: null
    common_fields: true
    fields:
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; the park hosting the opportunity" }
      - { name: title, type: string, source: input, description: "Opportunity title" }
      - { name: service_category, type: enum, source: input, description: "Primary service line", constraints: "one of {LODGING, FOOD_SERVICE, RETAIL, GUIDED_ACTIVITY, MARINA}" }
      - { name: required_capital_investment_cents, type: integer, source: input, description: "Capital investment the agency requires of the concessionaire over the term", constraints: ">= 0" }
      - { name: comparable_gross_receipts_cents, type: integer, source: input, description: "Annual gross receipts of the closest market comparable; set by the market-analysis action", default: null }
      - { name: market_capture_pct, type: number, source: input, description: "Share of the comparable's receipts this site is projected to capture, 2 decimals; set by the market-analysis action", default: null, constraints: "0 < value <= 200.00" }
      - { name: estimated_annual_gross_receipts_cents, type: integer, source: computed, description: "market_analysis_projection calculation output", default: null }
      - { name: analyst_note, type: string, source: input, description: "Market analysis narrative", default: null }
      - { name: status, type: enum, source: system, description: "Opportunity lifecycle state", default: "DRAFT", constraints: "one of {DRAFT, ANALYSIS_COMPLETE, APPROVED_FOR_SOLICITATION, SOLICITED, AWARDED}" }

  - name: Prospectus
    parent: null
    common_fields: true
    fields:
      - { name: opportunity_id, type: string, source: input, description: "FK -> ConcessionOpportunity.id; the opportunity being solicited" }
      - { name: minimum_franchise_fee_pct, type: number, source: input, description: "Minimum acceptable base franchise fee percentage of gross receipts, 2 decimals", constraints: "> 0 and <= 100.00" }
      - { name: minimum_annual_guarantee_cents, type: integer, source: input, description: "Minimum annual guarantee (MAG) floor an offeror must at least match", constraints: "> 0" }
      - { name: term_years, type: integer, source: input, description: "Contract term length in whole years", constraints: ">= 1 and <= 30" }
      - { name: submission_deadline, type: datetime, source: input, description: "Proposals must be received strictly before this instant" }
      - { name: weight_experience, type: integer, source: input, description: "Evaluation weight for EXPERIENCE, whole percentage points", constraints: ">= 0 and <= 100" }
      - { name: weight_operating_plan, type: integer, source: input, description: "Evaluation weight for OPERATING_PLAN, whole percentage points", constraints: ">= 0 and <= 100" }
      - { name: weight_capital_investment, type: integer, source: input, description: "Evaluation weight for CAPITAL_INVESTMENT, whole percentage points", constraints: ">= 0 and <= 100" }
      - { name: weight_financial_capacity, type: integer, source: input, description: "Evaluation weight for FINANCIAL_CAPACITY, whole percentage points", constraints: ">= 0 and <= 100" }
      - { name: weight_fee_offer, type: integer, source: input, description: "Evaluation weight for FEE_OFFER, whole percentage points", constraints: ">= 0 and <= 100" }
      - { name: scoring_mode, type: enum, source: input, description: "Selects which variant of proposal_composite_score applies to every proposal on this prospectus", constraints: "one of {PER_CRITERION_ROUNDING, FINAL_ROUNDING}" }
      - { name: min_technical_score, type: number, source: input, description: "Composite score an offeror must reach to be responsive, 2 decimals", constraints: ">= 0 and <= 100.00" }
      - { name: status, type: enum, source: system, description: "Solicitation lifecycle state", default: "DRAFT", constraints: "one of {DRAFT, ISSUED, CLOSED, AWARDED}" }

  - name: Offeror
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: bond_capacity_cents, type: integer, source: input, description: "Surety-attested maximum penal sum this offeror can post", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Procurement eligibility", default: "ELIGIBLE", constraints: "one of {ELIGIBLE, DEBARRED}" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: prospectus_id, type: string, source: input, description: "FK -> Prospectus.id; the solicitation this proposal answers" }
      - { name: offeror_id, type: string, source: input, description: "FK -> Offeror.id; the submitting offeror" }
      - { name: offered_franchise_fee_pct, type: number, source: input, description: "Base franchise fee percentage offered, 2 decimals", constraints: "> 0 and <= 100.00" }
      - { name: proposed_capital_investment_cents, type: integer, source: input, description: "Capital investment the offeror commits to", constraints: ">= 0" }
      - { name: proposed_annual_guarantee_cents, type: integer, source: input, description: "Annual guarantee the offeror commits to", constraints: "> 0" }
      - { name: experience_years, type: integer, source: input, description: "Years of comparable concession operating experience", constraints: ">= 0" }
      - { name: financial_capacity_ratio, type: number, source: input, description: "Current-ratio style solvency figure, 2 decimals", constraints: "> 0" }
      - { name: revision_round, type: integer, source: computed, description: "Count of request-revision actions taken on this proposal", default: 0 }
      - { name: evaluation_count, type: integer, source: computed, description: "Number of ProposalEvaluation rows whose proposal_id is this proposal", default: 0 }
      - { name: composite_score, type: number, source: computed, description: "proposal_composite_score output, 2 decimals; null until evaluation_count reaches REQUIRED_PANELIST_COUNT", default: null }
      - { name: status, type: enum, source: system, description: "Proposal lifecycle state", default: "SUBMITTED", constraints: "one of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, SCORED, SELECTED, NOT_SELECTED, WITHDRAWN}" }

  - name: ProposalEvaluation
    parent: null
    common_fields: false
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id; the proposal being scored" }
      - { name: panelist_user_id, type: string, source: system, description: "X-User-ID of the EvaluationPanelist who submitted this score sheet; opaque operator id, not an entity id" }
      - { name: score_experience, type: integer, source: input, description: "Raw EXPERIENCE score", constraints: ">= 0 and <= 100" }
      - { name: score_operating_plan, type: integer, source: input, description: "Raw OPERATING_PLAN score", constraints: ">= 0 and <= 100" }
      - { name: score_capital_investment, type: integer, source: input, description: "Raw CAPITAL_INVESTMENT score", constraints: ">= 0 and <= 100" }
      - { name: score_financial_capacity, type: integer, source: input, description: "Raw FINANCIAL_CAPACITY score", constraints: ">= 0 and <= 100" }
      - { name: score_fee_offer, type: integer, source: input, description: "Raw FEE_OFFER score", constraints: ">= 0 and <= 100" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; the park the concession operates in" }
      - { name: prospectus_id, type: string, source: input, description: "FK -> Prospectus.id; the solicitation that produced this lease" }
      - { name: offeror_id, type: string, source: input, description: "FK -> Offeror.id; the concessionaire holding the lease" }
      - { name: selected_proposal_id, type: string, source: input, description: "FK -> Proposal.id; the winning proposal whose terms this lease carries" }
      - { name: predecessor_lease_id, type: string, source: input, description: "FK -> Lease.id; the expiring lease whose possessory interest transfers to this one; null for a first-generation lease", default: null }
      - { name: performance_bond_id, type: string, source: input, description: "FK -> PerformanceBond.id; the bond row minted alongside this lease at award" }
      - { name: awarded_by_user_id, type: string, source: system, description: "X-User-ID of the ContractingOfficer who awarded; opaque operator id" }
      - { name: executed_by_user_id, type: string, source: system, description: "X-User-ID of the ContractingOfficer who executed; opaque operator id", default: null }
      - { name: base_fee_pct, type: number, source: computed, description: "Copied from Proposal.offered_franchise_fee_pct at award, 2 decimals" }
      - { name: minimum_annual_guarantee_cents, type: integer, source: computed, description: "Copied from Proposal.proposed_annual_guarantee_cents at award" }
      - { name: capital_investment_obligation_cents, type: integer, source: computed, description: "Copied from Proposal.proposed_capital_investment_cents at award" }
      - { name: term_years, type: integer, source: computed, description: "Copied from Prospectus.term_years at award" }
      - { name: term_start, type: string, source: input, description: "Contract start date (YYYY-MM-DD), supplied at award" }
      - { name: term_end, type: string, source: computed, description: "lease_term_window calculation output (YYYY-MM-DD)" }
      - { name: required_bond_amount_cents, type: integer, source: computed, description: "required_performance_bond_amount calculation output, minted at award" }
      - { name: agency_maintenance_scope, type: enum, source: input, description: "Portion of physical maintenance the agency retains; everything else is the concessionaire's, funded from the maintenance reserve", default: "STRUCTURAL_ONLY", constraints: "one of {NONE, STRUCTURAL_ONLY, STRUCTURAL_AND_UTILITIES}" }
      - { name: insurance_expires_on, type: string, source: input, description: "Expiry date of the certificate of insurance on file (YYYY-MM-DD)", default: null }
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier of record", default: null }
      - { name: capital_investment_completed_cents, type: integer, source: computed, description: "Sum of min(actual_cost_cents, approved_cost_cents) over CapitalImprovement rows on this lease with status in {COMPLETED, VESTED_IN_AGENCY, COMPENSABLE}", default: 0 }
      - { name: reported_receipts_ytd_cents, type: integer, source: computed, description: "Sum of total_receipts_cents over this lease's GrossReceiptsReport rows with status in {ACCEPTED, RESTATED} inside the current lease year", default: 0 }
      - { name: remitted_fee_ytd_cents, type: integer, source: computed, description: "Sum of remittance_received_cents over this lease's GrossReceiptsReport rows with status in {ACCEPTED, RESTATED} inside the current lease year", default: 0 }
      - { name: maintenance_reserve_balance_cents, type: integer, source: computed, description: "Accrued maintenance reserve: sum of maintenance_reserve_due_cents over ACCEPTED/RESTATED reports minus approved_cost_cents of APPROVED-or-later improvements whose funding_source is MAINTENANCE_RESERVE", default: 0 }
      - { name: outstanding_fee_balance_cents, type: integer, source: computed, description: "Sum of additional_fee_due_cents over this lease's FeeReconciliation rows whose status is PENDING_PAYMENT", default: 0 }
      - { name: possessory_interest_value_cents, type: integer, source: computed, description: "Sum of unamortized_value_cents over this lease's CapitalImprovement rows that became COMPENSABLE at expiration", default: null }
      - { name: transfer_settlement_net_cents, type: integer, source: computed, description: "successor_transfer_settlement calculation output — net cash the agency owes the outgoing concessionaire", default: null }
      - { name: transfer_settlement_deficiency_cents, type: integer, source: computed, description: "successor_transfer_settlement calculation output — amount the outgoing concessionaire still owes the agency after offset", default: null }
      - { name: contract_status, type: enum, source: system, description: "Contract lifecycle dimension; evolves independently of compliance_status", default: "PENDING_EXECUTION", constraints: "one of {PENDING_EXECUTION, ACTIVE, HOLDOVER, EXPIRED, CLOSED_OUT, TERMINATED_DEFAULT}" }
      - { name: compliance_status, type: enum, source: system, description: "Compliance dimension; evolves independently of contract_status", default: "COMPLIANT", constraints: "one of {COMPLIANT, DEFICIENT, DEFAULT}" }

  - name: PerformanceBond
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease this bond secures" }
      - { name: required_amount_cents, type: integer, source: computed, description: "Copied from Lease.required_bond_amount_cents at award" }
      - { name: surety_name, type: string, source: input, description: "Surety company of record", default: null }
      - { name: penal_sum_cents, type: integer, source: input, description: "Face amount of the bond as posted", default: null }
      - { name: available_balance_cents, type: integer, source: computed, description: "penal_sum_cents minus drawn_total_cents", default: 0 }
      - { name: drawn_total_cents, type: integer, source: computed, description: "Cumulative amount drawn by the agency less reinstatements", default: 0 }
      - { name: status, type: enum, source: system, description: "Bond lifecycle state", default: "PENDING", constraints: "one of {PENDING, ACTIVE, PARTIALLY_DRAWN, INSUFFICIENT, RELEASED}" }

  - name: CapitalImprovement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease the improvement is built under" }
      - { name: park_id, type: string, source: input, description: "FK -> Park.id; denormalized from the lease at creation so closure windows can be counted per park" }
      - { name: description, type: string, source: input, description: "Scope of work" }
      - { name: funding_source, type: enum, source: input, description: "Whether the work draws the concessionaire's capital obligation or the accrued maintenance reserve", constraints: "one of {CONCESSIONAIRE_CAPITAL, MAINTENANCE_RESERVE}" }
      - { name: proposed_cost_cents, type: integer, source: input, description: "Cost the concessionaire proposes", constraints: "> 0" }
      - { name: approved_cost_cents, type: integer, source: input, description: "Cost the agency approves; the amortization base", default: null }
      - { name: actual_cost_cents, type: integer, source: input, description: "Cost reported when the asset is placed in service", default: null }
      - { name: useful_life_years, type: integer, source: input, description: "Straight-line amortization life in whole years", constraints: ">= 1 and <= 40" }
      - { name: construction_window_start, type: string, source: input, description: "First day the site is closed for construction (YYYY-MM-DD)" }
      - { name: construction_window_end, type: string, source: input, description: "Exclusive end of the closure window (YYYY-MM-DD); the site reopens on this date" }
      - { name: in_service_date, type: string, source: input, description: "Date the asset was placed in service (YYYY-MM-DD); starts amortization", default: null }
      - { name: ownership_at_expiration, type: enum, source: input, description: "Who owns the improvement when the lease ends", constraints: "one of {AGENCY, CONCESSIONAIRE}" }
      - { name: unamortized_value_cents, type: integer, source: computed, description: "unamortized_improvement_value calculation output, frozen when the lease expires", default: null }
      - { name: deficiency_note, type: string, source: input, description: "Reason the agency returned the proposal", default: null }
      - { name: status, type: enum, source: system, description: "Improvement lifecycle state", default: "PROPOSED", constraints: "one of {PROPOSED, RETURNED, APPROVED, COMPLETED, VESTED_IN_AGENCY, COMPENSABLE, WITHDRAWN}" }

  - name: OperatingPlan
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease whose season this plan governs" }
      - { name: season_start, type: string, source: input, description: "First day of the operating season (YYYY-MM-DD), inclusive" }
      - { name: season_end, type: string, source: input, description: "Last day of the operating season (YYYY-MM-DD), inclusive" }
      - { name: service_level, type: enum, source: input, description: "Service level committed for the season", constraints: "one of {FULL, REDUCED, WINTER_LIMITED}" }
      - { name: max_lodging_rate_cents, type: integer, source: input, description: "Highest nightly lodging rate that may be charged to the public", constraints: "> 0" }
      - { name: max_meal_rate_cents, type: integer, source: input, description: "Highest meal rate that may be charged to the public", constraints: "> 0" }
      - { name: max_activity_rate_cents, type: integer, source: input, description: "Highest guided-activity rate that may be charged to the public", constraints: "> 0" }
      - { name: deficiency_note, type: string, source: input, description: "Reason the agency returned the plan", default: null }
      - { name: status, type: enum, source: system, description: "Plan approval state", default: "SUBMITTED", constraints: "one of {SUBMITTED, RETURNED, APPROVED, SUPERSEDED}" }

  - name: GrossReceiptsReport
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the reporting lease" }
      - { name: operating_plan_id, type: string, source: system, description: "FK -> OperatingPlan.id; the APPROVED plan whose season covers this period, resolved at creation" }
      - { name: period_start, type: string, source: input, description: "First day of the reporting period (YYYY-MM-DD), inclusive" }
      - { name: period_end, type: string, source: input, description: "Exclusive end of the reporting period (YYYY-MM-DD)" }
      - { name: lodging_receipts_cents, type: integer, source: input, description: "Gross receipts from lodging", constraints: ">= 0" }
      - { name: food_beverage_receipts_cents, type: integer, source: input, description: "Gross receipts from food and beverage", constraints: ">= 0" }
      - { name: retail_receipts_cents, type: integer, source: input, description: "Gross receipts from retail", constraints: ">= 0" }
      - { name: activity_receipts_cents, type: integer, source: input, description: "Gross receipts from guided activities", constraints: ">= 0" }
      - { name: total_receipts_cents, type: integer, source: computed, description: "Sum of the four category receipt fields" }
      - { name: assessed_fee_cents, type: integer, source: computed, description: "period_franchise_fee calculation output — the franchise fee owed for this period" }
      - { name: maintenance_reserve_due_cents, type: integer, source: computed, description: "maintenance_reserve_accrual calculation output for this period" }
      - { name: remittance_received_cents, type: integer, source: input, description: "Franchise fee cash the agency logged when accepting the report", default: null }
      - { name: restated_receipts_cents, type: integer, source: computed, description: "This period's share of an audit's adjusted gross receipts, set when the report is restated", default: null }
      - { name: rejection_note, type: string, source: input, description: "Reason the agency rejected the report", default: null }
      - { name: status, type: enum, source: system, description: "Report lifecycle state", default: "SUBMITTED", constraints: "one of {SUBMITTED, REJECTED, ACCEPTED, RESTATED}" }

  - name: FeeReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the reconciled lease" }
      - { name: audit_engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; set only on a reconciliation minted by an audit restatement", default: null }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> FeeReconciliation.id; the reconciliation that replaced this one", default: null }
      - { name: lease_year_number, type: integer, source: computed, description: "1-based lease year index derived from lease_year_start and Lease.term_start" }
      - { name: lease_year_start, type: string, source: input, description: "First day of the reconciled lease year (YYYY-MM-DD), inclusive" }
      - { name: lease_year_end, type: string, source: input, description: "Last day of the reconciled lease year (YYYY-MM-DD), inclusive" }
      - { name: annual_gross_receipts_cents, type: integer, source: computed, description: "annual_fee_reconciliation input aggregate over the lease year's reports" }
      - { name: annual_fee_due_cents, type: integer, source: computed, description: "annual_fee_reconciliation output — tiered annual franchise fee after the MAG floor" }
      - { name: mag_applied_cents, type: integer, source: computed, description: "Prorated minimum annual guarantee compared against the tiered fee" }
      - { name: remitted_total_cents, type: integer, source: computed, description: "Sum of remittance_received_cents over the lease year's ACCEPTED/RESTATED reports" }
      - { name: base_delta_cents, type: integer, source: computed, description: "annual_fee_due_cents minus remitted_total_cents; negative means overpayment" }
      - { name: penalty_cents, type: integer, source: computed, description: "Underreporting penalty; zero unless an audit restatement crossed the penalty threshold", default: 0 }
      - { name: interest_cents, type: integer, source: computed, description: "Simple interest on base_delta_cents for whole months elapsed past due_date", default: 0 }
      - { name: additional_fee_due_cents, type: integer, source: computed, description: "base_delta_cents + penalty_cents + interest_cents" }
      - { name: due_date, type: string, source: computed, description: "lease_year_end plus RECONCILIATION_GRACE_DAYS (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "Reconciliation ledger state", default: "PENDING_PAYMENT", constraints: "one of {PENDING_PAYMENT, SETTLED, CREDIT_ISSUED, SUPERSEDED, VOIDED}" }

  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the audited lease" }
      - { name: audit_period_start, type: string, source: input, description: "First day of the audited window (YYYY-MM-DD), inclusive" }
      - { name: audit_period_end, type: string, source: input, description: "Exclusive end of the audited window (YYYY-MM-DD)" }
      - { name: scope_note, type: string, source: input, description: "Audit scope narrative" }
      - { name: reported_gross_receipts_cents, type: integer, source: computed, description: "Sum of total_receipts_cents over the ACCEPTED reports whose period lies inside the audit window, frozen when fieldwork begins", default: null }
      - { name: adjusted_gross_receipts_cents, type: integer, source: input, description: "Gross receipts the auditor substantiates for the window", default: null }
      - { name: underreport_pct, type: number, source: computed, description: "audit_underreport_assessment output, 2 decimals", default: null }
      - { name: penalty_applies, type: boolean, source: computed, description: "True when underreport_pct >= UNDERREPORT_PENALTY_THRESHOLD_PCT", default: false }
      - { name: finding_note, type: string, source: input, description: "Auditor's finding narrative", default: null }
      - { name: contest_basis, type: string, source: input, description: "Concessionaire's basis for contesting the findings", default: null }
      - { name: withdrawal_basis, type: string, source: input, description: "Auditor's basis for withdrawing final findings", default: null }
      - { name: status, type: enum, source: system, description: "Audit lifecycle state", default: "OPENED", constraints: "one of {OPENED, FIELDWORK, FINDINGS_ISSUED, CONTESTED, FINAL, WITHDRAWN, CLOSED}" }

  - name: ComplianceAction
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease in default posture" }
      - { name: reconciliation_id, type: string, source: input, description: "FK -> FeeReconciliation.id; the unpaid reconciliation that provoked the notice", default: null }
      - { name: action_type, type: enum, source: input, description: "Nature of the deficiency", constraints: "one of {FEE_DELINQUENCY, OPERATING_STANDARD, INSURANCE_LAPSE}" }
      - { name: origin, type: enum, source: system, description: "Whether an officer issued the notice or a cascade minted it", default: "AGENCY_ISSUED", constraints: "one of {AGENCY_ISSUED, SYSTEM_ISSUED}" }
      - { name: deficiency_note, type: string, source: input, description: "Description of the deficiency" }
      - { name: cure_deadline, type: datetime, source: input, description: "Instant by which the concessionaire must cure" }
      - { name: cure_note, type: string, source: input, description: "Officer's note when accepting the cure", default: null }
      - { name: draw_amount_cents, type: integer, source: input, description: "Amount ordered drawn against the performance bond", default: null }
      - { name: status, type: enum, source: system, description: "Compliance action state", default: "NOTICE_ISSUED", constraints: "one of {NOTICE_ISSUED, CURE_ACCEPTED, BOND_DRAW_ORDERED, RESCINDED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:
  - entity: ConcessionOpportunity
    state_field: status
    initial_state: DRAFT
    terminal_states: [AWARDED]
    transitions:
      - from: DRAFT
        to: ANALYSIS_COMPLETE
        trigger: "POST /concession-opportunities/{id}/market-analysis"
        actor: ConcessionSpecialist
        preconditions:
          - "status == DRAFT"
          - "market_capture_pct > 0 and <= 200.00"
        side_effects:
          - "comparable_gross_receipts_cents, market_capture_pct and analyst_note persisted from the request body"
          - "estimated_annual_gross_receipts_cents recomputed by calculations.market_analysis_projection"
          - "version incremented by 1"
      - from: ANALYSIS_COMPLETE
        to: ANALYSIS_COMPLETE
        trigger: "POST /concession-opportunities/{id}/market-analysis (re-analysis before approval)"
        actor: ConcessionSpecialist
        preconditions:
          - "status == ANALYSIS_COMPLETE"
        side_effects:
          - "estimated_annual_gross_receipts_cents recomputed by calculations.market_analysis_projection from the new comparables"
          - "version incremented by 1"
        note: "Self-loop: the analysis may be redone any number of times until an officer approves solicitation."
      - from: ANALYSIS_COMPLETE
        to: APPROVED_FOR_SOLICITATION
        trigger: "POST /concession-opportunities/{id}/approve-solicitation"
        actor: ContractingOfficer
        preconditions:
          - "status == ANALYSIS_COMPLETE"
          - "estimated_annual_gross_receipts_cents >= MIN_VIABLE_ANNUAL_RECEIPTS_CENTS (10000000); strictly below rejects with ERR_OPPORTUNITY_NOT_VIABLE"
        side_effects:
          - "version incremented by 1"
      - from: APPROVED_FOR_SOLICITATION
        to: SOLICITED
        trigger: "system — cascaded by POST /prospectuses/{id}/issue"
        actor: system
        preconditions:
          - "status == APPROVED_FOR_SOLICITATION"
        side_effects:
          - "version incremented by 1"
      - from: SOLICITED
        to: AWARDED
        trigger: "system — cascaded by POST /prospectuses/{id}/award"
        actor: system
        preconditions:
          - "status == SOLICITED"
        side_effects:
          - "version incremented by 1"

  - entity: Prospectus
    state_field: status
    initial_state: DRAFT
    terminal_states: [AWARDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /prospectuses/{id}/issue"
        actor: ConcessionSpecialist
        preconditions:
          - "status == DRAFT"
          - "ConcessionOpportunity.id == Prospectus.opportunity_id has status == APPROVED_FOR_SOLICITATION, else ERR_OPPORTUNITY_NOT_APPROVED"
          - "logical clock < submission_deadline, else ERR_SUBMISSION_WINDOW_CLOSED"
        side_effects:
          - "ConcessionOpportunity.id == opportunity_id transitions APPROVED_FOR_SOLICITATION -> SOLICITED"
          - "version incremented by 1"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /prospectuses/{id}/close"
        actor: ConcessionSpecialist
        preconditions:
          - "status == ISSUED"
          - "logical clock >= submission_deadline, else ERR_SUBMISSION_WINDOW_OPEN"
        side_effects:
          - "every Proposal with prospectus_id == this and status == REVISION_REQUESTED transitions to NOT_SELECTED (the revision window is gone)"
          - "Proposal rows with status in {SUBMITTED, UNDER_REVIEW, SCORED} are left untouched"
          - "version incremented by 1"
      - from: CLOSED
        to: AWARDED
        trigger: "POST /prospectuses/{id}/award"
        actor: ContractingOfficer
        preconditions:
          - "status == CLOSED"
          - "calculations.award_selection returns a non-empty candidate set, else ERR_NO_RESPONSIVE_PROPOSAL"
          - "no ProposalEvaluation row whose proposal_id belongs to this prospectus has panelist_user_id == acting X-User-ID, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "the proposal ranked first by calculations.award_selection transitions SCORED -> SELECTED"
          - "every other Proposal with prospectus_id == this and status in {SUBMITTED, UNDER_REVIEW, SCORED} transitions to NOT_SELECTED"
          - "a Lease row is created with contract_status PENDING_EXECUTION, compliance_status COMPLIANT, park_id from the opportunity, base_fee_pct / minimum_annual_guarantee_cents / capital_investment_obligation_cents copied from the selected proposal, term_years copied from this prospectus, term_end from calculations.lease_term_window, required_bond_amount_cents from calculations.required_performance_bond_amount, awarded_by_user_id = acting X-User-ID"
          - "a PerformanceBond row is created with status PENDING, lease_id of the new lease, required_amount_cents = Lease.required_bond_amount_cents, available_balance_cents 0, drawn_total_cents 0; Lease.performance_bond_id points at it"
          - "ConcessionOpportunity.id == opportunity_id transitions SOLICITED -> AWARDED"
          - "version incremented by 1"

  - entity: Offeror
    state_field: status
    initial_state: ELIGIBLE
    terminal_states: [DEBARRED]
    transitions:
      - from: ELIGIBLE
        to: DEBARRED
        trigger: "POST /offerors/{id}/debar"
        actor: ProgramAdministrator
        preconditions:
          - "status == ELIGIBLE"
        side_effects:
          - "every Proposal with offeror_id == this and status in {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, SCORED} transitions to WITHDRAWN (conditional cascade; terminal proposals are untouched)"
          - "Lease rows held by this offeror are NOT altered — debarment bars new awards only"
          - "version incremented by 1"

  - entity: Proposal
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [SELECTED, NOT_SELECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /proposals/{id}/begin-review"
        actor: ConcessionSpecialist
        preconditions:
          - "status == SUBMITTED"
          - "Prospectus.id == prospectus_id has status in {ISSUED, CLOSED}"
        side_effects:
          - "version incremented by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /proposals/{id}/request-revision"
        actor: ConcessionSpecialist
        preconditions:
          - "status == UNDER_REVIEW"
          - "evaluation_count == 0, else ERR_EVALUATION_ALREADY_STARTED"
          - "Prospectus.id == prospectus_id has status == ISSUED"
          - "revision_round < MAX_REVISION_ROUNDS (2), else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "revision_round incremented by 1"
          - "version incremented by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /proposals/{id}/resubmit"
        actor: Concessionaire
        preconditions:
          - "status == REVISION_REQUESTED"
          - "acting X-User-ID == offeror_id"
          - "Prospectus.id == prospectus_id has status == ISSUED"
          - "offered_franchise_fee_pct >= Prospectus.minimum_franchise_fee_pct"
        side_effects:
          - "offered_franchise_fee_pct, proposed_capital_investment_cents, proposed_annual_guarantee_cents overwritten from the request body"
          - "version incremented by 1"
        note: "Closes the revision cycle SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED; bounded by MAX_REVISION_ROUNDS."
      - from: UNDER_REVIEW
        to: SCORED
        trigger: "system — cascaded by the REQUIRED_PANELIST_COUNT-th POST /proposals/{id}/evaluations"
        actor: system
        preconditions:
          - "status == UNDER_REVIEW"
          - "evaluation_count == REQUIRED_PANELIST_COUNT (2) after the new ProposalEvaluation row is stored"
        side_effects:
          - "composite_score set from calculations.proposal_composite_score using the variant named by Prospectus.scoring_mode"
          - "version incremented by 1"
      - from: SCORED
        to: SELECTED
        trigger: "system — cascaded by POST /prospectuses/{id}/award"
        actor: system
        preconditions:
          - "status == SCORED"
          - "this proposal is ranked first by calculations.award_selection"
        side_effects:
          - "version incremented by 1"
      - from: SCORED
        to: NOT_SELECTED
        trigger: "system — cascaded by POST /prospectuses/{id}/award"
        actor: system
        preconditions:
          - "status == SCORED"
          - "this proposal is not the rank-1 candidate of calculations.award_selection"
        side_effects:
          - "version incremented by 1"
      - from: SUBMITTED
        to: NOT_SELECTED
        trigger: "system — cascaded by POST /prospectuses/{id}/award"
        actor: system
        preconditions:
          - "status == SUBMITTED at award time (never scored, therefore non-responsive)"
        side_effects:
          - "version incremented by 1"
      - from: UNDER_REVIEW
        to: NOT_SELECTED
        trigger: "system — cascaded by POST /prospectuses/{id}/award"
        actor: system
        preconditions:
          - "status == UNDER_REVIEW at award time (fewer than REQUIRED_PANELIST_COUNT score sheets)"
        side_effects:
          - "version incremented by 1"
      - from: REVISION_REQUESTED
        to: NOT_SELECTED
        trigger: "system — cascaded by POST /prospectuses/{id}/close"
        actor: system
        preconditions:
          - "status == REVISION_REQUESTED"
        side_effects:
          - "version incremented by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /proposals/{id}/withdraw, or system cascade from POST /offerors/{id}/debar"
        actor: Concessionaire
        preconditions:
          - "status == SUBMITTED"
          - "for the Concessionaire-triggered form: acting X-User-ID == offeror_id"
        side_effects:
          - "version incremented by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /proposals/{id}/withdraw, or system cascade from POST /offerors/{id}/debar"
        actor: Concessionaire
        preconditions:
          - "status == UNDER_REVIEW"
          - "for the Concessionaire-triggered form: acting X-User-ID == offeror_id"
        side_effects:
          - "version incremented by 1"
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /proposals/{id}/withdraw, or system cascade from POST /offerors/{id}/debar"
        actor: Concessionaire
        preconditions:
          - "status == REVISION_REQUESTED"
        side_effects:
          - "version incremented by 1"
      - from: SCORED
        to: WITHDRAWN
        trigger: "POST /proposals/{id}/withdraw, or system cascade from POST /offerors/{id}/debar"
        actor: Concessionaire
        preconditions:
          - "status == SCORED"
        side_effects:
          - "version incremented by 1"

  - entity: Lease
    state_field: contract_status
    initial_state: PENDING_EXECUTION
    terminal_states: [CLOSED_OUT, TERMINATED_DEFAULT]
    note: "Dimension 1 of 2 on Lease. contract_status and compliance_status advance on separate triggers and never gate each other's transitions; a lease may be HOLDOVER + DEFICIENT, or ACTIVE + DEFAULT."
    transitions:
      - from: PENDING_EXECUTION
        to: ACTIVE
        trigger: "POST /leases/{id}/execute"
        actor: ContractingOfficer
        preconditions:
          - "contract_status == PENDING_EXECUTION"
          - "PerformanceBond.id == performance_bond_id has status == ACTIVE, else ERR_BOND_NOT_ACTIVE"
          - "request insurance_expires_on > logical clock date, else ERR_INSURANCE_LAPSED"
          - "acting X-User-ID != awarded_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "insurance_expires_on, carrier_name, agency_maintenance_scope persisted from the request body"
          - "executed_by_user_id = acting X-User-ID"
          - "version incremented by 1"
      - from: ACTIVE
        to: HOLDOVER
        trigger: "POST /leases/{id}/enter-holdover"
        actor: ContractingOfficer
        preconditions:
          - "contract_status == ACTIVE"
          - "no Lease row with predecessor_lease_id == this lease has contract_status == ACTIVE, else ERR_SUCCESSOR_ALREADY_ACTIVE"
          - "logical clock date >= term_end, else ERR_TERM_NOT_ELAPSED"
        side_effects:
          - "version incremented by 1"
        note: "Holdover keeps the operating obligation alive past term_end while successor selection finishes."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /leases/{id}/expire"
        actor: ContractingOfficer
        preconditions:
          - "contract_status == ACTIVE"
          - "logical clock date > term_end, else ERR_TERM_NOT_ELAPSED"
        side_effects:
          - "each CapitalImprovement on this lease with status == COMPLETED gets unamortized_value_cents from calculations.unamortized_improvement_value, then transitions to VESTED_IN_AGENCY when ownership_at_expiration == AGENCY or to COMPENSABLE when ownership_at_expiration == CONCESSIONAIRE"
          - "each CapitalImprovement on this lease with status in {PROPOSED, RETURNED, APPROVED} transitions to WITHDRAWN; for each formerly APPROVED row Park.open_closure_window_count is decremented by 1"
          - "each OperatingPlan on this lease with status in {SUBMITTED, RETURNED, APPROVED} transitions to SUPERSEDED"
          - "possessory_interest_value_cents = sum of unamortized_value_cents over this lease's COMPENSABLE improvements"
          - "version incremented by 1"
      - from: HOLDOVER
        to: EXPIRED
        trigger: "POST /leases/{id}/expire"
        actor: ContractingOfficer
        preconditions:
          - "contract_status == HOLDOVER"
          - "logical clock date > term_end"
        side_effects:
          - "identical cascade to the ACTIVE -> EXPIRED transition"
          - "version incremented by 1"
      - from: EXPIRED
        to: CLOSED_OUT
        trigger: "POST /leases/{id}/close-out"
        actor: ContractingOfficer
        preconditions:
          - "contract_status == EXPIRED"
          - "no AuditEngagement on this lease has status in {OPENED, FIELDWORK, FINDINGS_ISSUED, CONTESTED}, else ERR_AUDIT_IN_PROGRESS"
        side_effects:
          - "transfer_settlement_net_cents and transfer_settlement_deficiency_cents set from calculations.successor_transfer_settlement"
          - "when a successor_lease_id is supplied, that Lease row's predecessor_lease_id is set to this lease id"
          - "PerformanceBond.id == performance_bond_id transitions ACTIVE -> RELEASED only when outstanding_fee_balance_cents == 0; otherwise the bond keeps its current status (conditional cascade)"
          - "version incremented by 1"
      - from: ACTIVE
        to: TERMINATED_DEFAULT
        trigger: "system — cascaded by POST /compliance-actions/{id}/order-bond-draw when the draw leaves the bond INSUFFICIENT"
        actor: system
        preconditions:
          - "contract_status == ACTIVE"
          - "PerformanceBond.id == performance_bond_id reached status INSUFFICIENT in this request"
        side_effects:
          - "each OperatingPlan on this lease with status in {SUBMITTED, RETURNED, APPROVED} transitions to SUPERSEDED"
          - "each CapitalImprovement on this lease with status in {PROPOSED, RETURNED, APPROVED} transitions to WITHDRAWN; Park.open_closure_window_count decremented by 1 per formerly APPROVED row"
          - "version incremented by 1"
      - from: HOLDOVER
        to: TERMINATED_DEFAULT
        trigger: "system — cascaded by POST /compliance-actions/{id}/order-bond-draw when the draw leaves the bond INSUFFICIENT"
        actor: system
        preconditions:
          - "contract_status == HOLDOVER"
          - "PerformanceBond.id == performance_bond_id reached status INSUFFICIENT in this request"
        side_effects:
          - "identical cascade to the ACTIVE -> TERMINATED_DEFAULT transition"
          - "version incremented by 1"

  - entity: Lease
    state_field: compliance_status
    initial_state: COMPLIANT
    terminal_states: [DEFAULT]
    note: "Dimension 2 of 2 on Lease. Driven only by ComplianceAction and audit cascades; contract_status is never read as a precondition here."
    transitions:
      - from: COMPLIANT
        to: DEFICIENT
        trigger: "POST /compliance-actions (officer-issued), or system cascade from POST /audit-engagements/{id}/finalize when outstanding_fee_balance_cents > DEFICIENCY_NOTICE_THRESHOLD_CENTS"
        actor: ContractingOfficer
        preconditions:
          - "compliance_status == COMPLIANT"
          - "contract_status in {ACTIVE, HOLDOVER}"
        side_effects:
          - "version incremented by 1"
      - from: DEFICIENT
        to: COMPLIANT
        trigger: "system — cascaded by POST /compliance-actions/{id}/accept-cure, or by POST /audit-engagements/{id}/withdraw-findings"
        actor: system
        preconditions:
          - "compliance_status == DEFICIENT"
          - "after the triggering transition, no ComplianceAction on this lease has status == NOTICE_ISSUED"
        side_effects:
          - "version incremented by 1"
      - from: DEFICIENT
        to: DEFAULT
        trigger: "system — cascaded by POST /compliance-actions/{id}/order-bond-draw when the draw leaves the bond INSUFFICIENT"
        actor: system
        preconditions:
          - "compliance_status == DEFICIENT"
          - "PerformanceBond.id == performance_bond_id reached status INSUFFICIENT in this request"
        side_effects:
          - "version incremented by 1"
        note: "A later bond reinstatement restores the bond but never returns compliance_status from DEFAULT."

  - entity: PerformanceBond
    state_field: status
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /performance-bonds/{id}/post"
        actor: Concessionaire
        preconditions:
          - "status == PENDING"
          - "acting X-User-ID == Lease.offeror_id of Lease.id == lease_id"
          - "penal_sum_cents >= required_amount_cents, else ERR_BOND_INSUFFICIENT"
          - "penal_sum_cents <= Offeror.bond_capacity_cents of the lease holder, else ERR_BOND_EXCEEDS_CAPACITY"
        side_effects:
          - "penal_sum_cents and surety_name persisted; available_balance_cents = penal_sum_cents; drawn_total_cents = 0"
          - "version incremented by 1"
      - from: ACTIVE
        to: PARTIALLY_DRAWN
        trigger: "system — cascaded by POST /compliance-actions/{id}/order-bond-draw"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "draw_amount_cents <= available_balance_cents"
          - "available_balance_cents - draw_amount_cents >= round_half_up(required_amount_cents * BOND_SUFFICIENCY_PCT / 100)"
        side_effects:
          - "available_balance_cents decremented by draw_amount_cents; drawn_total_cents incremented by draw_amount_cents (penal_sum_cents unchanged)"
          - "version incremented by 1"
      - from: ACTIVE
        to: INSUFFICIENT
        trigger: "system — cascaded by POST /compliance-actions/{id}/order-bond-draw"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "draw_amount_cents <= available_balance_cents"
          - "available_balance_cents - draw_amount_cents < round_half_up(required_amount_cents * BOND_SUFFICIENCY_PCT / 100)"
        side_effects:
          - "available_balance_cents decremented by draw_amount_cents; drawn_total_cents incremented by draw_amount_cents"
          - "Lease.id == lease_id transitions compliance_status DEFICIENT -> DEFAULT and contract_status ACTIVE|HOLDOVER -> TERMINATED_DEFAULT"
          - "version incremented by 1"
      - from: PARTIALLY_DRAWN
        to: INSUFFICIENT
        trigger: "system — cascaded by a later POST /compliance-actions/{id}/order-bond-draw"
        actor: system
        preconditions:
          - "status == PARTIALLY_DRAWN"
          - "draw_amount_cents <= available_balance_cents"
          - "available_balance_cents - draw_amount_cents < round_half_up(required_amount_cents * BOND_SUFFICIENCY_PCT / 100)"
        side_effects:
          - "available_balance_cents decremented by draw_amount_cents; drawn_total_cents incremented by draw_amount_cents"
          - "Lease.id == lease_id transitions compliance_status DEFICIENT -> DEFAULT and contract_status ACTIVE|HOLDOVER -> TERMINATED_DEFAULT"
          - "version incremented by 1"
      - from: PARTIALLY_DRAWN
        to: ACTIVE
        trigger: "POST /performance-bonds/{id}/reinstate"
        actor: Concessionaire
        preconditions:
          - "status == PARTIALLY_DRAWN"
          - "acting X-User-ID == Lease.offeror_id of Lease.id == lease_id"
          - "reinstatement_amount_cents == drawn_total_cents (a full reinstatement), else the PARTIALLY_DRAWN -> PARTIALLY_DRAWN transition applies"
        side_effects:
          - "available_balance_cents incremented by reinstatement_amount_cents; drawn_total_cents decremented by the same amount, reaching 0 (penal_sum_cents unchanged)"
          - "version incremented by 1"
      - from: PARTIALLY_DRAWN
        to: PARTIALLY_DRAWN
        trigger: "POST /performance-bonds/{id}/reinstate (partial)"
        actor: Concessionaire
        preconditions:
          - "status == PARTIALLY_DRAWN"
          - "0 < reinstatement_amount_cents < drawn_total_cents, else ERR_REINSTATEMENT_EXCEEDS_DRAWN when above drawn_total_cents"
        side_effects:
          - "available_balance_cents incremented by reinstatement_amount_cents; drawn_total_cents decremented by the same amount"
          - "version incremented by 1"
      - from: INSUFFICIENT
        to: ACTIVE
        trigger: "POST /performance-bonds/{id}/reinstate"
        actor: Concessionaire
        preconditions:
          - "status == INSUFFICIENT"
          - "reinstatement_amount_cents == drawn_total_cents"
        side_effects:
          - "available_balance_cents incremented by reinstatement_amount_cents; drawn_total_cents reaches 0"
          - "Lease.compliance_status and Lease.contract_status are NOT changed — reinstating the bond does not undo a declared default"
          - "version incremented by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "system — cascaded by POST /leases/{id}/close-out"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "Lease.outstanding_fee_balance_cents == 0"
        side_effects:
          - "version incremented by 1"

  - entity: CapitalImprovement
    state_field: status
    initial_state: PROPOSED
    terminal_states: [VESTED_IN_AGENCY, COMPENSABLE, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /capital-improvements/{id}/approve"
        actor: ContractingOfficer
        preconditions:
          - "status == PROPOSED"
          - "Lease.id == lease_id has contract_status == ACTIVE, else ERR_LEASE_NOT_ACTIVE"
          - "PerformanceBond of the lease has status in {ACTIVE, PARTIALLY_DRAWN}, else ERR_BOND_NOT_ACTIVE"
          - "Lease.insurance_expires_on > logical clock date, else ERR_INSURANCE_LAPSED"
          - "count of CapitalImprovement rows with park_id == this park, status == APPROVED and a construction window overlapping [construction_window_start, construction_window_end) is < MAX_OVERLAPPING_PARK_CLOSURES (2), else ERR_PARK_CLOSURE_CAPACITY"
          - "when funding_source == CONCESSIONAIRE_CAPITAL: Lease.capital_investment_completed_cents + sum of approved_cost_cents over the lease's APPROVED improvements + request approved_cost_cents <= Lease.capital_investment_obligation_cents, else ERR_IMPROVEMENT_EXCEEDS_OBLIGATION"
          - "when funding_source == MAINTENANCE_RESERVE: request approved_cost_cents <= Lease.maintenance_reserve_balance_cents, else ERR_MAINTENANCE_RESERVE_INSUFFICIENT"
        side_effects:
          - "approved_cost_cents persisted from the request body"
          - "Park.open_closure_window_count incremented by 1"
          - "when funding_source == MAINTENANCE_RESERVE: Lease.maintenance_reserve_balance_cents decremented by approved_cost_cents"
          - "version incremented by 1"
      - from: PROPOSED
        to: RETURNED
        trigger: "POST /capital-improvements/{id}/return"
        actor: ContractingOfficer
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "deficiency_note persisted"
          - "version incremented by 1"
      - from: RETURNED
        to: PROPOSED
        trigger: "POST /capital-improvements/{id}/resubmit"
        actor: Concessionaire
        preconditions:
          - "status == RETURNED"
          - "acting X-User-ID == Lease.offeror_id of Lease.id == lease_id"
        side_effects:
          - "proposed_cost_cents, useful_life_years, construction_window_start, construction_window_end overwritten from the request body; deficiency_note cleared to null"
          - "version incremented by 1"
        note: "Closes the PROPOSED -> RETURNED -> PROPOSED revision cycle."
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /capital-improvements/{id}/place-in-service"
        actor: Concessionaire
        preconditions:
          - "status == APPROVED"
          - "acting X-User-ID == Lease.offeror_id of Lease.id == lease_id"
          - "request in_service_date >= construction_window_start, else ERR_IN_SERVICE_BEFORE_WINDOW"
        side_effects:
          - "actual_cost_cents and in_service_date persisted"
          - "Park.open_closure_window_count decremented by 1"
          - "Lease.capital_investment_completed_cents incremented by min(actual_cost_cents, approved_cost_cents)"
          - "version incremented by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "system — cascaded by POST /leases/{id}/expire or by the bond-draw default cascade"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "Park.open_closure_window_count decremented by 1"
          - "version incremented by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system — cascaded by POST /leases/{id}/expire or by the bond-draw default cascade"
        actor: system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "version incremented by 1"
      - from: RETURNED
        to: WITHDRAWN
        trigger: "system — cascaded by POST /leases/{id}/expire or by the bond-draw default cascade"
        actor: system
        preconditions:
          - "status == RETURNED"
        side_effects:
          - "version incremented by 1"
      - from: COMPLETED
        to: VESTED_IN_AGENCY
        trigger: "system — cascaded by POST /leases/{id}/expire"
        actor: system
        preconditions:
          - "status == COMPLETED"
          - "ownership_at_expiration == AGENCY"
        side_effects:
          - "unamortized_value_cents set from calculations.unamortized_improvement_value (recorded for the record, not compensable)"
          - "version incremented by 1"
      - from: COMPLETED
        to: COMPENSABLE
        trigger: "system — cascaded by POST /leases/{id}/expire"
        actor: system
        preconditions:
          - "status == COMPLETED"
          - "ownership_at_expiration == CONCESSIONAIRE"
        side_effects:
          - "unamortized_value_cents set from calculations.unamortized_improvement_value and rolled into Lease.possessory_interest_value_cents"
          - "version incremented by 1"

  - entity: OperatingPlan
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /operating-plans/{id}/approve"
        actor: ContractingOfficer
        preconditions:
          - "status == SUBMITTED"
          - "Lease.id == lease_id has contract_status == ACTIVE, else ERR_LEASE_NOT_ACTIVE"
          - "no other OperatingPlan with the same lease_id and status == APPROVED shares a calendar day with [season_start, season_end], else ERR_SEASON_OVERLAP"
          - "max_lodging_rate_cents <= round_half_up(Park.comparable_lodging_rate_cents * RATE_CEILING_MULTIPLIER) and the same ceiling test holds for max_meal_rate_cents against comparable_meal_rate_cents and max_activity_rate_cents against comparable_activity_rate_cents, else ERR_RATE_EXCEEDS_CEILING"
        side_effects:
          - "version incremented by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /operating-plans/{id}/return"
        actor: ContractingOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "deficiency_note persisted"
          - "version incremented by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /operating-plans/{id}/resubmit"
        actor: Concessionaire
        preconditions:
          - "status == RETURNED"
          - "acting X-User-ID == Lease.offeror_id of Lease.id == lease_id"
        side_effects:
          - "season_start, season_end, service_level and the three max rate fields overwritten from the request body; deficiency_note cleared to null"
          - "version incremented by 1"
        note: "Closes the SUBMITTED -> RETURNED -> SUBMITTED cycle."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system — cascaded by POST /leases/{id}/expire or by the bond-draw default cascade"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "version incremented by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system — cascaded by POST /leases/{id}/expire or by the bond-draw default cascade"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "version incremented by 1"
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system — cascaded by POST /leases/{id}/expire or by the bond-draw default cascade"
        actor: system
        preconditions:
          - "status == RETURNED"
        side_effects:
          - "version incremented by 1"

  - entity: GrossReceiptsReport
    state_field: status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /gross-receipts-reports/{id}/accept"
        actor: ContractingOfficer
        preconditions:
          - "status == SUBMITTED"
          - "request remittance_received_cents == assessed_fee_cents, else ERR_REMITTANCE_MISMATCH"
        side_effects:
          - "remittance_received_cents persisted"
          - "Lease.reported_receipts_ytd_cents incremented by total_receipts_cents"
          - "Lease.remitted_fee_ytd_cents incremented by remittance_received_cents"
          - "Lease.maintenance_reserve_balance_cents incremented by maintenance_reserve_due_cents"
          - "version incremented by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /gross-receipts-reports/{id}/reject"
        actor: ContractingOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "rejection_note persisted"
          - "version incremented by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /gross-receipts-reports/{id}/amend"
        actor: Concessionaire
        preconditions:
          - "status == REJECTED"
          - "acting X-User-ID == Lease.offeror_id of Lease.id == lease_id"
        side_effects:
          - "the four category receipt fields overwritten from the request body; rejection_note cleared to null"
          - "total_receipts_cents, assessed_fee_cents and maintenance_reserve_due_cents recomputed by calculations.period_franchise_fee and calculations.maintenance_reserve_accrual"
          - "version incremented by 1"
        note: "Closes the SUBMITTED -> REJECTED -> SUBMITTED amendment cycle."
      - from: ACCEPTED
        to: RESTATED
        trigger: "system — cascaded by POST /audit-engagements/{id}/finalize"
        actor: system
        preconditions:
          - "status == ACCEPTED"
          - "[period_start, period_end) lies inside [AuditEngagement.audit_period_start, AuditEngagement.audit_period_end)"
        side_effects:
          - "restated_receipts_cents set from calculations.audit_underreport_assessment's per-report allocation"
          - "version incremented by 1"
      - from: RESTATED
        to: ACCEPTED
        trigger: "system — cascaded by POST /audit-engagements/{id}/withdraw-findings"
        actor: system
        preconditions:
          - "status == RESTATED"
        side_effects:
          - "restated_receipts_cents reset to null"
          - "version incremented by 1"

  - entity: FeeReconciliation
    state_field: status
    initial_state: PENDING_PAYMENT
    terminal_states: [SETTLED, VOIDED]
    note: "A reconciliation is minted in PENDING_PAYMENT when additional_fee_due_cents > 0 and directly in CREDIT_ISSUED when additional_fee_due_cents <= 0."
    transitions:
      - from: PENDING_PAYMENT
        to: SETTLED
        trigger: "POST /fee-reconciliations/{id}/settle"
        actor: Concessionaire
        preconditions:
          - "status == PENDING_PAYMENT"
          - "acting X-User-ID == Lease.offeror_id of Lease.id == lease_id"
          - "request payment_amount_cents == additional_fee_due_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects:
          - "Lease.outstanding_fee_balance_cents recomputed (this row leaves the PENDING_PAYMENT set)"
          - "when audit_engagement_id is not null and that AuditEngagement has status == FINAL, the audit transitions FINAL -> CLOSED"
          - "version incremented by 1"
      - from: PENDING_PAYMENT
        to: SETTLED
        trigger: "system — cascaded by POST /compliance-actions/{id}/order-bond-draw when the action's reconciliation_id points at this row and draw_amount_cents == additional_fee_due_cents"
        actor: system
        preconditions:
          - "status == PENDING_PAYMENT"
        side_effects:
          - "Lease.outstanding_fee_balance_cents recomputed"
          - "version incremented by 1"
      - from: PENDING_PAYMENT
        to: SUPERSEDED
        trigger: "system — cascaded by POST /fee-reconciliations (a new row for the same lease and lease_year_start) or by POST /audit-engagements/{id}/finalize"
        actor: system
        preconditions:
          - "status == PENDING_PAYMENT"
          - "the incoming row covers the same lease_id and lease_year_start"
        side_effects:
          - "superseded_by_id set to the incoming reconciliation id"
          - "Lease.outstanding_fee_balance_cents recomputed"
          - "version incremented by 1"
      - from: SUPERSEDED
        to: PENDING_PAYMENT
        trigger: "system — cascaded by POST /audit-engagements/{id}/withdraw-findings"
        actor: system
        preconditions:
          - "status == SUPERSEDED"
          - "superseded_by_id points at the reconciliation minted by the withdrawn audit"
        side_effects:
          - "superseded_by_id reset to null"
          - "Lease.outstanding_fee_balance_cents recomputed"
          - "version incremented by 1"
      - from: PENDING_PAYMENT
        to: VOIDED
        trigger: "system — cascaded by POST /audit-engagements/{id}/withdraw-findings"
        actor: system
        preconditions:
          - "status == PENDING_PAYMENT"
          - "audit_engagement_id == the withdrawn AuditEngagement id"
        side_effects:
          - "Lease.outstanding_fee_balance_cents recomputed"
          - "version incremented by 1"

  - entity: AuditEngagement
    state_field: status
    initial_state: OPENED
    terminal_states: [WITHDRAWN, CLOSED]
    transitions:
      - from: OPENED
        to: FIELDWORK
        trigger: "POST /audit-engagements/{id}/begin-fieldwork"
        actor: AuditorGeneral
        preconditions:
          - "status == OPENED"
          - "at least one GrossReceiptsReport on the lease with status == ACCEPTED lies inside the audit window, else ERR_AUDIT_PERIOD_EMPTY"
        side_effects:
          - "reported_gross_receipts_cents frozen as the sum of total_receipts_cents over the lease's ACCEPTED reports whose [period_start, period_end) lies inside the audit window"
          - "version incremented by 1"
      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /audit-engagements/{id}/issue-findings"
        actor: AuditorGeneral
        preconditions:
          - "status == FIELDWORK"
          - "request adjusted_gross_receipts_cents >= 0"
        side_effects:
          - "adjusted_gross_receipts_cents and finding_note persisted"
          - "underreport_pct and penalty_applies set from calculations.audit_underreport_assessment"
          - "version incremented by 1"
      - from: FINDINGS_ISSUED
        to: CONTESTED
        trigger: "POST /audit-engagements/{id}/contest"
        actor: Concessionaire
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "acting X-User-ID == Lease.offeror_id of Lease.id == lease_id"
        side_effects:
          - "contest_basis persisted"
          - "version incremented by 1"
      - from: FINDINGS_ISSUED
        to: FINAL
        trigger: "POST /audit-engagements/{id}/finalize"
        actor: AuditorGeneral
        preconditions:
          - "status == FINDINGS_ISSUED"
          - "a FeeReconciliation with status == PENDING_PAYMENT or SETTLED exists for the lease year the audit window falls in, else ERR_NO_RECONCILIATION_FOR_PERIOD"
        side_effects:
          - "each ACCEPTED report inside the audit window transitions ACCEPTED -> RESTATED (hop 1)"
          - "because those reports were restated, the lease year's PENDING_PAYMENT reconciliation transitions PENDING_PAYMENT -> SUPERSEDED and a replacement FeeReconciliation is minted with audit_engagement_id = this audit, annual_gross_receipts_cents = adjusted_gross_receipts_cents, penalty_cents and interest_cents from calculations.audit_underreport_assessment (hop 2)"
          - "because the replacement reconciliation is PENDING_PAYMENT, Lease.outstanding_fee_balance_cents is recomputed (hop 3)"
          - "because the recomputed balance exceeds DEFICIENCY_NOTICE_THRESHOLD_CENTS, Lease.compliance_status transitions COMPLIANT -> DEFICIENT and a ComplianceAction is minted with origin SYSTEM_ISSUED, action_type FEE_DELINQUENCY, reconciliation_id of the replacement row and cure_deadline = logical clock + CURE_PERIOD_DAYS (hop 4)"
          - "version incremented by 1"
      - from: CONTESTED
        to: FINAL
        trigger: "POST /audit-engagements/{id}/finalize"
        actor: AuditorGeneral
        preconditions:
          - "status == CONTESTED"
        side_effects:
          - "identical four-hop cascade to the FINDINGS_ISSUED -> FINAL transition"
          - "version incremented by 1"
      - from: FINAL
        to: WITHDRAWN
        trigger: "POST /audit-engagements/{id}/withdraw-findings"
        actor: AuditorGeneral
        preconditions:
          - "status == FINAL"
          - "the reconciliation minted by this audit still has status == PENDING_PAYMENT, else ERR_AUDIT_ALREADY_SETTLED"
        side_effects:
          - "the reconciliation minted by this audit transitions PENDING_PAYMENT -> VOIDED"
          - "the reconciliation it superseded transitions SUPERSEDED -> PENDING_PAYMENT with superseded_by_id reset to null"
          - "each RESTATED report inside the audit window transitions RESTATED -> ACCEPTED with restated_receipts_cents reset to null"
          - "every ComplianceAction with origin == SYSTEM_ISSUED, status == NOTICE_ISSUED and reconciliation_id == the voided row transitions to RESCINDED"
          - "Lease.outstanding_fee_balance_cents recomputed and Lease.compliance_status transitions DEFICIENT -> COMPLIANT when no ComplianceAction on the lease remains NOTICE_ISSUED"
          - "withdrawal_basis persisted; version incremented by 1"
      - from: FINAL
        to: CLOSED
        trigger: "system — cascaded by POST /fee-reconciliations/{id}/settle on the reconciliation this audit minted"
        actor: system
        preconditions:
          - "status == FINAL"
          - "the reconciliation with audit_engagement_id == this audit reached status == SETTLED in this request"
        side_effects:
          - "version incremented by 1"

  - entity: ComplianceAction
    state_field: status
    initial_state: NOTICE_ISSUED
    terminal_states: [CURE_ACCEPTED, BOND_DRAW_ORDERED, RESCINDED]
    transitions:
      - from: NOTICE_ISSUED
        to: CURE_ACCEPTED
        trigger: "POST /compliance-actions/{id}/accept-cure"
        actor: ContractingOfficer
        preconditions:
          - "status == NOTICE_ISSUED"
        side_effects:
          - "cure_note persisted"
          - "Lease.compliance_status transitions DEFICIENT -> COMPLIANT when no other ComplianceAction on the lease has status == NOTICE_ISSUED (conditional cascade)"
          - "version incremented by 1"
      - from: NOTICE_ISSUED
        to: BOND_DRAW_ORDERED
        trigger: "POST /compliance-actions/{id}/order-bond-draw"
        actor: ContractingOfficer
        preconditions:
          - "status == NOTICE_ISSUED"
          - "PerformanceBond of the lease has status in {ACTIVE, PARTIALLY_DRAWN}, else ERR_BOND_NOT_ACTIVE"
          - "logical clock > cure_deadline, else ERR_CURE_PERIOD_OPEN"
          - "request draw_amount_cents <= PerformanceBond.available_balance_cents, else ERR_DRAW_EXCEEDS_BOND"
        side_effects:
          - "draw_amount_cents persisted (hop 1)"
          - "because the draw was ordered, the lease's PerformanceBond debits available_balance_cents and credits drawn_total_cents, landing in PARTIALLY_DRAWN or INSUFFICIENT (hop 2)"
          - "because the bond landed in INSUFFICIENT, Lease.compliance_status transitions DEFICIENT -> DEFAULT and contract_status ACTIVE|HOLDOVER -> TERMINATED_DEFAULT (hop 3)"
          - "because the lease was terminated, its APPROVED/SUBMITTED/RETURNED OperatingPlan rows transition to SUPERSEDED and its PROPOSED/RETURNED/APPROVED CapitalImprovement rows transition to WITHDRAWN, decrementing Park.open_closure_window_count per formerly APPROVED row (hop 4)"
          - "when reconciliation_id is not null and draw_amount_cents == that reconciliation's additional_fee_due_cents, the reconciliation transitions PENDING_PAYMENT -> SETTLED and Lease.outstanding_fee_balance_cents is recomputed"
          - "version incremented by 1"
      - from: NOTICE_ISSUED
        to: RESCINDED
        trigger: "system — cascaded by POST /audit-engagements/{id}/withdraw-findings"
        actor: system
        preconditions:
          - "status == NOTICE_ISSUED"
          - "origin == SYSTEM_ISSUED and reconciliation_id == the reconciliation voided by the withdrawal"
        side_effects:
          - "version incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================

concurrency_rules:
  - rule_id: reconciliation-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /fee-reconciliations"
    occ_field: "expected_lease_version"
    description: |
      Creating a FeeReconciliation for a lease year whose Lease.version has
      advanced past the value the client last observed is rejected. A second
      reconciliation for the same lease year legitimately supersedes the first
      (see the FeeReconciliation PENDING_PAYMENT -> SUPERSEDED transition), so
      the write cannot be rejected on state alone; the stale-version check is
      what stops a writer whose view of the lease ledger predates the
      supersede from re-basing the year on figures it never saw.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

  - rule_id: operating-plan-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /operating-plans"
    occ_field: "expected_lease_version"
    description: |
      Creating an OperatingPlan against a Lease whose version has advanced
      since the client last read it is rejected. A newly submitted plan is a
      legitimate operation from any ACTIVE lease state, so no state
      precondition covers a writer working from a stale view of the lease's
      season calendar, rate ceilings or compliance posture; the version check
      forces the client to re-read the lease before re-submitting.
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:
  - name: market_analysis_projection
    trigger: "POST /concession-opportunities/{id}/market-analysis (DRAFT -> ANALYSIS_COMPLETE and the ANALYSIS_COMPLETE self-loop)"
    algorithm: aggregation
    formula: |
      estimated_annual_gross_receipts_cents =
        round_half_up(comparable_gross_receipts_cents * market_capture_pct / 100)
    input_set: "The single comparable figure and capture share supplied in the request body; no other entity is read."
    constants: {}
    precision: "whole cents, round_half_up"

  - name: lease_term_window
    trigger: "POST /prospectuses/{id}/award (Lease creation), and whenever a lease year window is needed"
    algorithm: interval_merge
    formula: |
      term_end = date(term_start) + term_years years - 1 day
      lease_year_start(N) = date(term_start) + (N - 1) years          # N is 1-based
      lease_year_end(N)   = date(term_start) + N years - 1 day
      lease_year_number(d) = the unique N with lease_year_start(N) <= d <= lease_year_end(N)
    input_set: "Lease.term_start and Lease.term_years only. Calendar arithmetic adds whole years first, then subtracts one day, so a term starting 2027-03-01 for 10 years ends 2037-02-28."
    constants: {}
    precision: "whole calendar days; all lease-year windows are closed intervals [start, end]"

  - name: required_performance_bond_amount
    trigger: "POST /prospectuses/{id}/award — stored on Lease.required_bond_amount_cents and copied to PerformanceBond.required_amount_cents"
    algorithm: threshold
    formula: |
      mag_component   = round_half_up(minimum_annual_guarantee_cents * BOND_MAG_FACTOR_PCT / 100)
      capex_component = round_half_up(capital_investment_obligation_cents * BOND_CAPEX_FACTOR_PCT / 100)
      base            = max(mag_component, capex_component, BOND_FLOOR_CENTS)
      required        = base                                   when term_years <= 10
      required        = round_half_up(base * BOND_LONG_TERM_MULTIPLIER)  when term_years > 10
    input_set: "The selected Proposal's proposed_annual_guarantee_cents and proposed_capital_investment_cents plus the Prospectus term_years. Three inputs interact through a max() over two scaled components and a floor, then a conditional multiplier keyed on term length."
    constants:
      BOND_MAG_FACTOR_PCT: 25.00
      BOND_CAPEX_FACTOR_PCT: 10.00
      BOND_FLOOR_CENTS: 2500000
      BOND_LONG_TERM_MULTIPLIER: 1.50
      BOND_SUFFICIENCY_PCT: 50.00
    precision: "whole cents, round_half_up on each component before the max, and again after the multiplier"
    note: "BOND_SUFFICIENCY_PCT is consumed by the PerformanceBond draw transitions: a draw that leaves available_balance_cents below round_half_up(required_amount_cents * 50 / 100) lands the bond in INSUFFICIENT."

  - name: proposal_composite_score
    trigger: "system — the REQUIRED_PANELIST_COUNT-th POST /proposals/{id}/evaluations (Proposal UNDER_REVIEW -> SCORED)"
    algorithm: weighted_scoring
    formula: |
      for each criterion c in [EXPERIENCE, OPERATING_PLAN, CAPITAL_INVESTMENT, FINANCIAL_CAPACITY, FEE_OFFER]:
          raw_mean(c) = (sum of ProposalEvaluation.score_<c> over all rows with proposal_id == this proposal)
                        / evaluation_count                      # exact rational, not yet rounded
          weight(c)   = Prospectus.weight_<c>                    # whole percentage points, must total 100
      composite_score = <variant-specific, see variants>
    input_set: "Every ProposalEvaluation row whose proposal_id is this proposal — no status filter exists on that entity because it is append-only and immutable. Weights come from the Prospectus row named by Proposal.prospectus_id."
    constants:
      REQUIRED_PANELIST_COUNT: 2
    precision: "2 decimal places, round_half_up; the rounding LOCATIONS differ per variant"
    variants:
      - name: per_criterion_rounding
        when: "Prospectus.scoring_mode == PER_CRITERION_ROUNDING"
        difference: |
          criterion_mean(c)  = round_half_up(raw_mean(c), 2)
          contribution(c)    = round_half_up(criterion_mean(c) * weight(c) / 100, 2)
          composite_score    = exact sum of the five contribution(c) values (already 2dp)
      - name: final_rounding
        when: "Prospectus.scoring_mode == FINAL_ROUNDING"
        difference: |
          composite_score = round_half_up(sum over c of (raw_mean(c) * weight(c) / 100), 2)
          Identical score sheets can therefore yield a composite one cent-of-a-point
          away from the per_criterion_rounding variant.

  - name: award_selection
    trigger: "POST /prospectuses/{id}/award"
    algorithm: weighted_scoring
    formula: |
      candidates = every Proposal p with p.prospectus_id == this prospectus AND
                     p.status == SCORED AND
                     Offeror(p.offeror_id).status == ELIGIBLE AND
                     p.composite_score >= Prospectus.min_technical_score AND
                     p.offered_franchise_fee_pct >= Prospectus.minimum_franchise_fee_pct AND
                     p.proposed_capital_investment_cents >= ConcessionOpportunity.required_capital_investment_cents AND
                     Offeror(p.offeror_id).bond_capacity_cents >= required_performance_bond_amount(p)
      rank by:  composite_score DESC,
                then offered_franchise_fee_pct DESC,
                then proposed_capital_investment_cents DESC,
                then created_at ASC
      winner   = rank-1 candidate
      when candidates is empty -> reject the award with ERR_NO_RESPONSIVE_PROPOSAL and change nothing
    input_set: "Scored proposals on this prospectus only. The eligibility predicate is a closed enum/threshold conjunction; no proposal in SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, SELECTED, NOT_SELECTED or WITHDRAWN can enter the pool."
    constants: {}
    precision: "composite_score compared at 2 decimals; ties resolved by the pinned key list, never by id"

  - name: period_franchise_fee
    trigger: "POST /gross-receipts-reports (creation) and POST /gross-receipts-reports/{id}/amend — writes GrossReceiptsReport.assessed_fee_cents"
    algorithm: tiered_pricing
    formula: |
      rate(LODGING)        = Lease.base_fee_pct + CATEGORY_DIFF_LODGING_PCT
      rate(FOOD_BEVERAGE)  = Lease.base_fee_pct + CATEGORY_DIFF_FOOD_PCT
      rate(RETAIL)         = Lease.base_fee_pct + CATEGORY_DIFF_RETAIL_PCT
      rate(ACTIVITY)       = Lease.base_fee_pct + CATEGORY_DIFF_ACTIVITY_PCT

      # PINNED EVALUATION ORDER: round each category product to whole cents FIRST,
      # then add the four rounded values in this exact order. Summing the raw
      # products and rounding once at the end is WRONG and can differ by 1-2 cents.
      fee(c)              = round_half_up(receipts(c) * rate(c) / 100)
      assessed_fee_cents  = fee(LODGING) + fee(FOOD_BEVERAGE) + fee(RETAIL) + fee(ACTIVITY)
      total_receipts_cents = lodging + food_beverage + retail + activity receipts
    input_set: "The four category amounts on this one report; the rate differentials are agency-wide constants and base_fee_pct comes from the lease named by GrossReceiptsReport.lease_id."
    constants:
      CATEGORY_DIFF_LODGING_PCT: 1.50
      CATEGORY_DIFF_FOOD_PCT: 0.00
      CATEGORY_DIFF_RETAIL_PCT: -0.50
      CATEGORY_DIFF_ACTIVITY_PCT: 2.00
    precision: "whole cents, round_half_up per category, summed afterwards (round-then-sum)"

  - name: maintenance_reserve_accrual
    trigger: "POST /gross-receipts-reports (creation) and POST /gross-receipts-reports/{id}/amend — writes maintenance_reserve_due_cents; accrued into Lease.maintenance_reserve_balance_cents on SUBMITTED -> ACCEPTED"
    algorithm: aggregation
    formula: |
      maintenance_reserve_due_cents = round_half_up(total_receipts_cents * MAINTENANCE_RESERVE_PCT / 100)
    input_set: "This report's total_receipts_cents. The reserve funds the concessionaire's half of the maintenance split (everything outside Lease.agency_maintenance_scope) and is spendable only through a CapitalImprovement with funding_source == MAINTENANCE_RESERVE."
    constants:
      MAINTENANCE_RESERVE_PCT: 0.50
    precision: "whole cents, round_half_up"

  - name: annual_fee_reconciliation
    trigger: "POST /fee-reconciliations, and again inside the POST /audit-engagements/{id}/finalize cascade when the replacement reconciliation is minted"
    algorithm: chronological
    formula: |
      period_set = every GrossReceiptsReport r with r.lease_id == this lease AND
                     r.status in {ACCEPTED, RESTATED} AND
                     lease_year_start <= r.period_start AND r.period_end <= lease_year_end + 1 day
                   ordered by period_start ASC, then created_at ASC

      receipts(r)                = r.restated_receipts_cents when r.status == RESTATED
                                   else r.total_receipts_cents
      annual_gross_receipts_cents = sum of receipts(r) over period_set

      # tier ladder over the ANNUAL total, marginal (each slice pays its own rate)
      slice1 = min(annual_gross_receipts_cents, TIER1_CEILING_CENTS)
      slice2 = max(0, min(annual_gross_receipts_cents, TIER2_CEILING_CENTS) - TIER1_CEILING_CENTS)
      slice3 = max(0, annual_gross_receipts_cents - TIER2_CEILING_CENTS)
      tiered_fee = round_half_up(slice1 *  Lease.base_fee_pct                    / 100)
                 + round_half_up(slice2 * (Lease.base_fee_pct + TIER2_UPLIFT_PCT) / 100)
                 + round_half_up(slice3 * (Lease.base_fee_pct + TIER3_UPLIFT_PCT) / 100)

      mag_applied_cents = Lease.minimum_annual_guarantee_cents
                            when [lease_year_start, lease_year_end] is exactly the lease year window
                          else round_half_up(Lease.minimum_annual_guarantee_cents
                                             * inclusive_day_count(lease_year_start, lease_year_end)
                                             / DAYS_IN_MAG_YEAR)
      annual_fee_due_cents  = max(tiered_fee, mag_applied_cents)
      remitted_total_cents  = sum of r.remittance_received_cents over period_set
      base_delta_cents      = annual_fee_due_cents - remitted_total_cents
      additional_fee_due_cents = base_delta_cents + penalty_cents + interest_cents
      due_date              = lease_year_end + RECONCILIATION_GRACE_DAYS days
      status at creation    = PENDING_PAYMENT when additional_fee_due_cents > 0
                              else CREDIT_ISSUED
    input_set: "Only ACCEPTED and RESTATED reports whose half-open period lies inside the reconciled lease year; SUBMITTED and REJECTED reports are excluded, so a rejected month silently lowers annual_gross_receipts_cents."
    constants:
      TIER1_CEILING_CENTS: 50000000
      TIER2_CEILING_CENTS: 150000000
      TIER2_UPLIFT_PCT: 2.50
      TIER3_UPLIFT_PCT: 5.00
      DAYS_IN_MAG_YEAR: 365
      RECONCILIATION_GRACE_DAYS: 30
    precision: "whole cents; round_half_up per tier slice, then sum the three rounded slices"
    variants:
      - name: annual_tiered_blended
        when: "Always, for the authoritative franchise fee owed for the lease year (POST /fee-reconciliations and the audit replacement row)"
        difference: |
          Applies the marginal tier ladder to the ANNUAL total of every category
          combined, ignoring the per-category differentials entirely.
      - name: sum_of_period_remittances
        when: "The interim in-year view surfaced as Lease.remitted_fee_ytd_cents and used by nothing else"
        difference: |
          Sums the per-report assessed_fee_cents figures produced by
          period_franchise_fee, i.e. each period priced on its own category mix
          at the flat category rates with no tier ladder. For identical receipts
          this is a different number from annual_tiered_blended; the gap IS
          base_delta_cents and is what the reconciliation invoices or credits.

  - name: audit_underreport_assessment
    trigger: "POST /audit-engagements/{id}/issue-findings (writes underreport_pct, penalty_applies) and POST /audit-engagements/{id}/finalize (writes the replacement reconciliation's penalty_cents, interest_cents and each report's restated_receipts_cents)"
    algorithm: threshold
    formula: |
      reported  = AuditEngagement.reported_gross_receipts_cents
      adjusted  = AuditEngagement.adjusted_gross_receipts_cents
      underreport_pct = 0.00                                     when reported == 0
                      = round_half_up((adjusted - reported) * 100 / reported, 2)   otherwise
      penalty_applies = underreport_pct >= UNDERREPORT_PENALTY_THRESHOLD_PCT       # >= , not >

      # replacement-reconciliation figures, computed after the covered reports are restated
      base_delta2 = annual_fee_due_cents(on adjusted receipts) - remitted_total_cents
      penalty_cents  = round_half_up(base_delta2 * UNDERREPORT_PENALTY_PCT / 100)
                         when penalty_applies AND base_delta2 > 0, else 0
      whole_months_late = number of whole calendar months from the superseded
                          reconciliation's due_date to the logical clock date
                          (0 when the clock is at or before due_date)
      interest_cents = round_half_up(base_delta2 * INTEREST_PCT_PER_MONTH / 100 * whole_months_late)
                         when base_delta2 > 0, else 0

      # per-report restatement, ordered by period_start ASC then created_at ASC
      for every covered report except the last in that order:
          restated_receipts_cents(r) = round_half_up(adjusted * r.total_receipts_cents / reported)
      the last report absorbs the remainder so that the restated figures sum exactly to adjusted
    input_set: "The ACCEPTED reports frozen into reported_gross_receipts_cents when fieldwork began, plus the auditor's adjusted figure. Reports that were REJECTED or still SUBMITTED never enter the audit."
    constants:
      UNDERREPORT_PENALTY_THRESHOLD_PCT: 5.00
      UNDERREPORT_PENALTY_PCT: 10.00
      INTEREST_PCT_PER_MONTH: 1.00
      DEFICIENCY_NOTICE_THRESHOLD_CENTS: 2000000
      CURE_PERIOD_DAYS: 30
    precision: "underreport_pct at 2 decimals round_half_up; money at whole cents round_half_up; remainder allocated to the chronologically last covered report"

  - name: unamortized_improvement_value
    trigger: "system — POST /leases/{id}/expire, for each CapitalImprovement leaving COMPLETED"
    algorithm: decay_function
    formula: |
      useful_life_months = useful_life_years * 12
      months_elapsed = (year(Lease.term_end) - year(in_service_date)) * 12
                     + (month(Lease.term_end) - month(in_service_date))
                     + 1                                  # the in-service month counts as elapsed
      months_elapsed = min(max(months_elapsed, 0), useful_life_months)
      amortized_cents   = round_half_up(approved_cost_cents * months_elapsed / useful_life_months)
      unamortized_value_cents = max(approved_cost_cents - amortized_cents, 0)
    input_set: "approved_cost_cents (NOT actual_cost_cents), the improvement's in_service_date and the lease's term_end. Straight-line by whole months; a partial month at either end counts as one full month."
    constants: {}
    precision: "whole cents, round_half_up on the amortized amount; the unamortized remainder is floored at 0"

  - name: successor_transfer_settlement
    trigger: "POST /leases/{id}/close-out (EXPIRED -> CLOSED_OUT)"
    algorithm: waterfall_allocation
    formula: |
      # STEP ORDER IS PART OF THE RULE. The administrative fee looks circular
      # (a percentage of the settlement, which is itself net of the fee); it is
      # pinned to the GROSS figure and evaluated before the offsets.
      step 1: gross_possessory_interest_cents =
                sum of unamortized_value_cents over this lease's CapitalImprovement
                rows with status == COMPENSABLE
      step 2: admin_fee_cents = round_half_up(gross_possessory_interest_cents
                                              * TRANSFER_ADMIN_FEE_PCT / 100)
      step 3: raw_net = gross_possessory_interest_cents - admin_fee_cents
                        - Lease.outstanding_fee_balance_cents
      step 4: transfer_settlement_net_cents        = max(raw_net, 0)
              transfer_settlement_deficiency_cents = max(-raw_net, 0)
    input_set: "COMPENSABLE improvements only — VESTED_IN_AGENCY improvements are worth zero to the outgoing concessionaire even when unamortized_value_cents is positive. The offset is the lease's PENDING_PAYMENT reconciliation total at close-out."
    constants:
      TRANSFER_ADMIN_FEE_PCT: 3.00
    precision: "whole cents, round_half_up; exactly one of net/deficiency is non-zero, and both are 0 when raw_net == 0"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
#
# Band structure: 1 auth -> 2 authz -> 3 path existence -> 4 body-FK existence
# -> 5 ownership -> 6 request shape -> 7 weight normalization -> 8 interval
# sanity -> 9 optimistic concurrency -> 10 own-status precondition
# -> 11..23 cross-entity state guards -> 24..25 safety / segregation of duties
# -> 26..33 temporal -> 34..40 constraint -> 41..51 fiscal.
# The lowest-numbered failing check is the one reported; every §1.2 precondition
# list is written in this same order.
# =============================================================================

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /parks/{id} route resolves to a Park row"
    error_id: ERR_PARK_NOT_FOUND
    http_status: 404
    applies_to: "GET /parks/{id}"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a ConcessionOpportunity row"
    error_id: ERR_OPPORTUNITY_NOT_FOUND
    http_status: 404
    applies_to: "GET /concession-opportunities/{id}, POST /concession-opportunities/{id}/market-analysis, POST /concession-opportunities/{id}/approve-solicitation"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a Prospectus row"
    error_id: ERR_PROSPECTUS_NOT_FOUND
    http_status: 404
    applies_to: "GET /prospectuses/{id}, POST /prospectuses/{id}/issue, POST /prospectuses/{id}/close, POST /prospectuses/{id}/award"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to an Offeror row"
    error_id: ERR_OFFEROR_NOT_FOUND
    http_status: 404
    applies_to: "GET /offerors/{id}, POST /offerors/{id}/debar"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a Proposal row"
    error_id: ERR_PROPOSAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /proposals/{id}, POST /proposals/{id}/begin-review, POST /proposals/{id}/evaluations, POST /proposals/{id}/request-revision, POST /proposals/{id}/resubmit, POST /proposals/{id}/withdraw"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a ProposalEvaluation row"
    error_id: ERR_EVALUATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /proposal-evaluations/{id}"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a Lease row"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /leases/{id}, POST /leases/{id}/execute, POST /leases/{id}/insurance-certificate, POST /leases/{id}/enter-holdover, POST /leases/{id}/expire, POST /leases/{id}/close-out"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a PerformanceBond row"
    error_id: ERR_BOND_NOT_FOUND
    http_status: 404
    applies_to: "GET /performance-bonds/{id}, POST /performance-bonds/{id}/post, POST /performance-bonds/{id}/reinstate"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a CapitalImprovement row"
    error_id: ERR_IMPROVEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /capital-improvements/{id}, POST /capital-improvements/{id}/approve, POST /capital-improvements/{id}/return, POST /capital-improvements/{id}/resubmit, POST /capital-improvements/{id}/place-in-service"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to an OperatingPlan row"
    error_id: ERR_OPERATING_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /operating-plans/{id}, POST /operating-plans/{id}/approve, POST /operating-plans/{id}/return, POST /operating-plans/{id}/resubmit"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a GrossReceiptsReport row"
    error_id: ERR_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "GET /gross-receipts-reports/{id}, POST /gross-receipts-reports/{id}/accept, POST /gross-receipts-reports/{id}/reject, POST /gross-receipts-reports/{id}/amend"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a FeeReconciliation row"
    error_id: ERR_RECONCILIATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /fee-reconciliations/{id}, POST /fee-reconciliations/{id}/settle"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to an AuditEngagement row"
    error_id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /audit-engagements/{id}, POST /audit-engagements/{id}/begin-fieldwork, POST /audit-engagements/{id}/issue-findings, POST /audit-engagements/{id}/contest, POST /audit-engagements/{id}/finalize, POST /audit-engagements/{id}/withdraw-findings"
  - priority: 3
    category: existence
    check: "the {id} path segment resolves to a ComplianceAction row"
    error_id: ERR_COMPLIANCE_ACTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance-actions/{id}, POST /compliance-actions/{id}/accept-cure, POST /compliance-actions/{id}/order-bond-draw"

  - priority: 4
    category: business_referential
    check: "park_id in the request body resolves to a Park row"
    error_id: ERR_PARK_NOT_FOUND
    http_status: 404
    applies_to: "POST /concession-opportunities"
  - priority: 4
    category: business_referential
    check: "opportunity_id in the request body resolves to a ConcessionOpportunity row"
    error_id: ERR_OPPORTUNITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /prospectuses"
  - priority: 4
    category: business_referential
    check: "prospectus_id in the request body resolves to a Prospectus row, then offeror_id resolves to an Offeror row (left-to-right in the order the fields are listed in the endpoint's input)"
    error_id: ERR_PROSPECTUS_NOT_FOUND
    http_status: 404
    applies_to: "POST /proposals"
  - priority: 4
    category: business_referential
    check: "offeror_id in the request body resolves to an Offeror row"
    error_id: ERR_OFFEROR_NOT_FOUND
    http_status: 404
    applies_to: "POST /proposals"
  - priority: 4
    category: business_referential
    check: "lease_id in the request body resolves to a Lease row"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /capital-improvements, POST /operating-plans, POST /gross-receipts-reports, POST /fee-reconciliations, POST /audit-engagements, POST /compliance-actions"
  - priority: 4
    category: business_referential
    check: "when reconciliation_id is supplied it resolves to a FeeReconciliation row whose lease_id equals the body's lease_id"
    error_id: ERR_RECONCILIATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /compliance-actions"
  - priority: 4
    category: business_referential
    check: "when successor_lease_id is supplied it resolves to a Lease row other than the path lease"
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /leases/{id}/close-out"

  - priority: 5
    category: auth
    check: "when the acting role is Concessionaire, X-User-ID equals the Offeror id that owns the target resource — Proposal.offeror_id for proposal routes, and Lease.offeror_id of the lease reached through the resource's lease_id for bond, improvement, plan, report, reconciliation and audit routes"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /proposals, POST /proposals/{id}/resubmit, POST /proposals/{id}/withdraw, POST /performance-bonds/{id}/post, POST /performance-bonds/{id}/reinstate, POST /capital-improvements, POST /capital-improvements/{id}/resubmit, POST /capital-improvements/{id}/place-in-service, POST /operating-plans, POST /operating-plans/{id}/resubmit, POST /gross-receipts-reports, POST /gross-receipts-reports/{id}/amend, POST /fee-reconciliations/{id}/settle, POST /audit-engagements/{id}/contest"

  - priority: 6
    category: business_constraint
    check: "every required input field is present and non-null; every enum value is a declared member; every *_cents field is an integer inside its declared bound; every *_pct field carries at most 2 decimals inside its declared bound; every date field is YYYY-MM-DD and every datetime field is ISO 8601 UTC; unknown fields are ignored rather than rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 7
    category: business_constraint
    check: "weight_experience + weight_operating_plan + weight_capital_investment + weight_financial_capacity + weight_fee_offer == 100"
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /prospectuses"

  - priority: 8
    category: business_temporal
    check: "half-open intervals require start strictly before end (construction_window_start < construction_window_end, period_start < period_end, audit_period_start < audit_period_end); closed intervals require start <= end (season_start <= season_end, lease_year_start <= lease_year_end)"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /capital-improvements, POST /capital-improvements/{id}/resubmit, POST /operating-plans, POST /operating-plans/{id}/resubmit, POST /gross-receipts-reports, POST /fee-reconciliations, POST /audit-engagements"

  - priority: 9
    category: business_referential
    check: "expected_lease_version equals the current Lease.version of the lease named by lease_id (see §1.2.1)"
    error_id: ERR_STALE_LEASE_VERSION
    http_status: 412
    applies_to: "POST /fee-reconciliations, POST /operating-plans"

  # ---- band 10: the path resource's own status admits the requested transition
  - priority: 10
    category: state
    check: "ConcessionOpportunity.status admits the transition (DRAFT or ANALYSIS_COMPLETE for market-analysis; ANALYSIS_COMPLETE for approve-solicitation)"
    error_id: ERR_OPPORTUNITY_STATUS_INVALID
    http_status: 409
    applies_to: "POST /concession-opportunities/{id}/market-analysis, POST /concession-opportunities/{id}/approve-solicitation"
  - priority: 10
    category: state
    check: "Prospectus.status admits the transition (DRAFT for issue; ISSUED for close; CLOSED for award)"
    error_id: ERR_PROSPECTUS_STATUS_INVALID
    http_status: 409
    applies_to: "POST /prospectuses/{id}/issue, POST /prospectuses/{id}/close, POST /prospectuses/{id}/award"
  - priority: 10
    category: state
    check: "Offeror.status == ELIGIBLE"
    error_id: ERR_OFFEROR_STATUS_INVALID
    http_status: 409
    applies_to: "POST /offerors/{id}/debar"
  - priority: 10
    category: state
    check: "Proposal.status admits the transition (SUBMITTED for begin-review; UNDER_REVIEW for evaluations and request-revision; REVISION_REQUESTED for resubmit; SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED or SCORED for withdraw)"
    error_id: ERR_PROPOSAL_STATUS_INVALID
    http_status: 409
    applies_to: "POST /proposals/{id}/begin-review, POST /proposals/{id}/evaluations, POST /proposals/{id}/request-revision, POST /proposals/{id}/resubmit, POST /proposals/{id}/withdraw"
  - priority: 10
    category: state
    check: "Lease.contract_status admits the transition (PENDING_EXECUTION for execute; ACTIVE for enter-holdover; ACTIVE or HOLDOVER for expire; EXPIRED for close-out; PENDING_EXECUTION, ACTIVE or HOLDOVER for insurance-certificate)"
    error_id: ERR_LEASE_STATUS_INVALID
    http_status: 409
    applies_to: "POST /leases/{id}/execute, POST /leases/{id}/enter-holdover, POST /leases/{id}/expire, POST /leases/{id}/close-out, POST /leases/{id}/insurance-certificate"
  - priority: 10
    category: state
    check: "PerformanceBond.status admits the transition (PENDING for post; PARTIALLY_DRAWN or INSUFFICIENT for reinstate)"
    error_id: ERR_BOND_STATUS_INVALID
    http_status: 409
    applies_to: "POST /performance-bonds/{id}/post, POST /performance-bonds/{id}/reinstate"
  - priority: 10
    category: state
    check: "CapitalImprovement.status admits the transition (PROPOSED for approve and return; RETURNED for resubmit; APPROVED for place-in-service)"
    error_id: ERR_IMPROVEMENT_STATUS_INVALID
    http_status: 409
    applies_to: "POST /capital-improvements/{id}/approve, POST /capital-improvements/{id}/return, POST /capital-improvements/{id}/resubmit, POST /capital-improvements/{id}/place-in-service"
  - priority: 10
    category: state
    check: "OperatingPlan.status admits the transition (SUBMITTED for approve and return; RETURNED for resubmit)"
    error_id: ERR_OPERATING_PLAN_STATUS_INVALID
    http_status: 409
    applies_to: "POST /operating-plans/{id}/approve, POST /operating-plans/{id}/return, POST /operating-plans/{id}/resubmit"
  - priority: 10
    category: state
    check: "GrossReceiptsReport.status admits the transition (SUBMITTED for accept and reject; REJECTED for amend)"
    error_id: ERR_REPORT_STATUS_INVALID
    http_status: 409
    applies_to: "POST /gross-receipts-reports/{id}/accept, POST /gross-receipts-reports/{id}/reject, POST /gross-receipts-reports/{id}/amend"
  - priority: 10
    category: state
    check: "FeeReconciliation.status == PENDING_PAYMENT"
    error_id: ERR_RECONCILIATION_STATUS_INVALID
    http_status: 409
    applies_to: "POST /fee-reconciliations/{id}/settle"
  - priority: 10
    category: state
    check: "AuditEngagement.status admits the transition (OPENED for begin-fieldwork; FIELDWORK for issue-findings; FINDINGS_ISSUED for contest; FINDINGS_ISSUED or CONTESTED for finalize; FINAL for withdraw-findings)"
    error_id: ERR_AUDIT_STATUS_INVALID
    http_status: 409
    applies_to: "POST /audit-engagements/{id}/begin-fieldwork, POST /audit-engagements/{id}/issue-findings, POST /audit-engagements/{id}/contest, POST /audit-engagements/{id}/finalize, POST /audit-engagements/{id}/withdraw-findings"
  - priority: 10
    category: state
    check: "ComplianceAction.status == NOTICE_ISSUED"
    error_id: ERR_COMPLIANCE_ACTION_STATUS_INVALID
    http_status: 409
    applies_to: "POST /compliance-actions/{id}/accept-cure, POST /compliance-actions/{id}/order-bond-draw"

  # ---- bands 11-23: cross-entity state guards
  - priority: 11
    category: state
    check: "the Lease named by the body's lease_id (or by the improvement/plan's lease_id) has contract_status == ACTIVE"
    error_id: ERR_LEASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /capital-improvements, POST /capital-improvements/{id}/approve, POST /operating-plans, POST /operating-plans/{id}/approve, POST /gross-receipts-reports, POST /fee-reconciliations"
  - priority: 11
    category: state
    check: "the Lease named by the body's lease_id is in an admissible contract_status: {ACTIVE, HOLDOVER} for a compliance action, {ACTIVE, HOLDOVER, EXPIRED} for an audit engagement"
    error_id: ERR_LEASE_STATUS_INVALID
    http_status: 409
    applies_to: "POST /compliance-actions, POST /audit-engagements"
  - priority: 12
    category: state
    check: "the ConcessionOpportunity named by Prospectus.opportunity_id has status == APPROVED_FOR_SOLICITATION"
    error_id: ERR_OPPORTUNITY_NOT_APPROVED
    http_status: 409
    applies_to: "POST /prospectuses/{id}/issue"
  - priority: 13
    category: state
    check: "the lease's PerformanceBond has status == ACTIVE for lease execution, or status in {ACTIVE, PARTIALLY_DRAWN} for an improvement approval or a bond draw"
    error_id: ERR_BOND_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /leases/{id}/execute, POST /capital-improvements/{id}/approve, POST /compliance-actions/{id}/order-bond-draw"
  - priority: 14
    category: state
    check: "the Offeror named by the body's offeror_id has status == ELIGIBLE"
    error_id: ERR_OFFEROR_DEBARRED
    http_status: 409
    applies_to: "POST /proposals"
  - priority: 15
    category: state
    check: "no AuditEngagement on this lease has status in {OPENED, FIELDWORK, FINDINGS_ISSUED, CONTESTED}"
    error_id: ERR_AUDIT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /leases/{id}/close-out"
  - priority: 16
    category: state
    check: "no Lease row whose predecessor_lease_id is this lease has contract_status == ACTIVE"
    error_id: ERR_SUCCESSOR_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /leases/{id}/enter-holdover"
  - priority: 17
    category: state
    check: "the FeeReconciliation this audit minted still has status == PENDING_PAYMENT"
    error_id: ERR_AUDIT_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /audit-engagements/{id}/withdraw-findings"
  - priority: 18
    category: state
    check: "a FeeReconciliation with status in {PENDING_PAYMENT, SETTLED} exists for the lease year the audit window falls in"
    error_id: ERR_NO_RECONCILIATION_FOR_PERIOD
    http_status: 409
    applies_to: "POST /audit-engagements/{id}/finalize"
  - priority: 19
    category: state
    check: "at least one GrossReceiptsReport on the lease with status == ACCEPTED has its [period_start, period_end) inside the audit window"
    error_id: ERR_AUDIT_PERIOD_EMPTY
    http_status: 409
    applies_to: "POST /audit-engagements/{id}/begin-fieldwork"
  - priority: 20
    category: state
    check: "Proposal.evaluation_count == 0 — once any panelist has filed a score sheet the proposal can no longer be sent back for revision"
    error_id: ERR_EVALUATION_ALREADY_STARTED
    http_status: 409
    applies_to: "POST /proposals/{id}/request-revision"
  - priority: 21
    category: state
    check: "Proposal.evaluation_count < REQUIRED_PANELIST_COUNT (2) — the panel is already complete"
    error_id: ERR_PANEL_ALREADY_COMPLETE
    http_status: 409
    applies_to: "POST /proposals/{id}/evaluations"
  - priority: 22
    category: state
    check: "exactly one OperatingPlan on this lease with status == APPROVED has a season whose closed interval [season_start, season_end] covers every day of [period_start, period_end); its id becomes the report's operating_plan_id"
    error_id: ERR_NO_APPROVED_OPERATING_PLAN
    http_status: 409
    applies_to: "POST /gross-receipts-reports"
  - priority: 23
    category: state
    check: "calculations.award_selection returns at least one eligible candidate"
    error_id: ERR_NO_RESPONSIVE_PROPOSAL
    http_status: 422
    applies_to: "POST /prospectuses/{id}/award"

  # ---- bands 24-25: safety / compliance, ahead of every temporal and fiscal check
  - priority: 24
    category: business_safety
    check: "the certificate of insurance on file is still in force — the request's insurance_expires_on (on execution) or Lease.insurance_expires_on (on any later operation) is strictly after the logical clock date"
    error_id: ERR_INSURANCE_LAPSED
    http_status: 409
    applies_to: "POST /leases/{id}/execute, POST /capital-improvements/{id}/approve"
  - priority: 25
    category: business_safety
    check: "the acting officer is not the officer who performed the paired step — on award, no ProposalEvaluation on this prospectus carries panelist_user_id == X-User-ID; on execution, Lease.awarded_by_user_id != X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /prospectuses/{id}/award, POST /leases/{id}/execute"

  # ---- bands 26-33: temporal
  - priority: 26
    category: business_temporal
    check: "the logical clock is strictly before Prospectus.submission_deadline"
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /prospectuses/{id}/issue, POST /proposals, POST /proposals/{id}/resubmit"
  - priority: 27
    category: business_temporal
    check: "the logical clock is at or after Prospectus.submission_deadline — the solicitation cannot close while proposals may still arrive"
    error_id: ERR_SUBMISSION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /prospectuses/{id}/close"
  - priority: 28
    category: business_temporal
    check: "the logical clock date is at or after Lease.term_end for holdover, and strictly after Lease.term_end for expiry"
    error_id: ERR_TERM_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /leases/{id}/enter-holdover, POST /leases/{id}/expire"
  - priority: 29
    category: business_temporal
    check: "the logical clock is strictly after ComplianceAction.cure_deadline"
    error_id: ERR_CURE_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /compliance-actions/{id}/order-bond-draw"
  - priority: 30
    category: business_temporal
    check: "the logical clock date is strictly after the requested lease_year_end — a lease year cannot be reconciled before it is over"
    error_id: ERR_RECONCILIATION_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /fee-reconciliations"
  - priority: 31
    category: business_temporal
    check: "the requested in_service_date is at or after CapitalImprovement.construction_window_start"
    error_id: ERR_IN_SERVICE_BEFORE_WINDOW
    http_status: 409
    applies_to: "POST /capital-improvements/{id}/place-in-service"
  - priority: 32
    category: business_temporal
    check: "the reporting period sits inside the contract term: period_start >= Lease.term_start and period_end <= Lease.term_end + 1 day (period_end is exclusive, so the day after term_end is the largest admissible value)"
    error_id: ERR_PERIOD_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /gross-receipts-reports"
  - priority: 33
    category: business_temporal
    check: "the construction closure window sits inside the contract term: construction_window_start >= Lease.term_start and construction_window_end <= Lease.term_end + 1 day"
    error_id: ERR_CONSTRUCTION_WINDOW_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /capital-improvements, POST /capital-improvements/{id}/resubmit"

  # ---- bands 34-40: constraint satisfaction
  - priority: 34
    category: business_constraint
    check: "no other OperatingPlan on the same lease with status == APPROVED shares a single calendar day with the closed interval [season_start, season_end] (touching endpoints DO collide: a plan ending 2027-09-30 and a plan starting 2027-09-30 overlap)"
    error_id: ERR_SEASON_OVERLAP
    http_status: 409
    applies_to: "POST /operating-plans/{id}/approve"
  - priority: 35
    category: business_constraint
    check: "no other GrossReceiptsReport on the same lease with status in {SUBMITTED, ACCEPTED, RESTATED} has a half-open [period_start, period_end) intersecting this one (touching endpoints do NOT collide: a period ending 2027-07-01 and a period starting 2027-07-01 are adjacent, not overlapping)"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /gross-receipts-reports"
  - priority: 36
    category: business_constraint
    check: "the offeror has no other Proposal on this prospectus with status outside {WITHDRAWN, NOT_SELECTED}"
    error_id: ERR_DUPLICATE_PROPOSAL
    http_status: 409
    applies_to: "POST /proposals"
  - priority: 37
    category: business_constraint
    check: "no existing ProposalEvaluation on this proposal carries panelist_user_id == the acting X-User-ID"
    error_id: ERR_DUPLICATE_PANELIST_EVALUATION
    http_status: 409
    applies_to: "POST /proposals/{id}/evaluations"
  - priority: 38
    category: business_constraint
    check: "the number of CapitalImprovement rows on the same park_id with status == APPROVED whose half-open [construction_window_start, construction_window_end) intersects this one is strictly below MAX_OVERLAPPING_PARK_CLOSURES (2)"
    error_id: ERR_PARK_CLOSURE_CAPACITY
    http_status: 409
    applies_to: "POST /capital-improvements/{id}/approve"
  - priority: 39
    category: business_constraint
    check: "each public rate is at or below its ceiling: max_lodging_rate_cents <= round_half_up(Park.comparable_lodging_rate_cents * RATE_CEILING_MULTIPLIER), and likewise max_meal_rate_cents and max_activity_rate_cents against their comparables (equality passes)"
    error_id: ERR_RATE_EXCEEDS_CEILING
    http_status: 422
    applies_to: "POST /operating-plans/{id}/approve"
  - priority: 40
    category: business_constraint
    check: "Proposal.revision_round < MAX_REVISION_ROUNDS (2)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /proposals/{id}/request-revision"

  # ---- bands 41-51: fiscal, evaluated last
  - priority: 41
    category: business_fiscal
    check: "estimated_annual_gross_receipts_cents >= MIN_VIABLE_ANNUAL_RECEIPTS_CENTS (10000000)"
    error_id: ERR_OPPORTUNITY_NOT_VIABLE
    http_status: 422
    applies_to: "POST /concession-opportunities/{id}/approve-solicitation"
  - priority: 42
    category: business_fiscal
    check: "offered_franchise_fee_pct >= Prospectus.minimum_franchise_fee_pct (equality passes — a proposal offering exactly the minimum is responsive)"
    error_id: ERR_FEE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /proposals, POST /proposals/{id}/resubmit"
  - priority: 43
    category: business_fiscal
    check: "proposed_annual_guarantee_cents >= Prospectus.minimum_annual_guarantee_cents (equality passes)"
    error_id: ERR_GUARANTEE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /proposals, POST /proposals/{id}/resubmit"
  - priority: 44
    category: business_fiscal
    check: "for funding_source == CONCESSIONAIRE_CAPITAL: Lease.capital_investment_completed_cents + the approved_cost_cents already committed by this lease's APPROVED improvements + the request's approved_cost_cents <= Lease.capital_investment_obligation_cents"
    error_id: ERR_IMPROVEMENT_EXCEEDS_OBLIGATION
    http_status: 422
    applies_to: "POST /capital-improvements/{id}/approve"
  - priority: 45
    category: business_fiscal
    check: "for funding_source == MAINTENANCE_RESERVE: the request's approved_cost_cents <= Lease.maintenance_reserve_balance_cents"
    error_id: ERR_MAINTENANCE_RESERVE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /capital-improvements/{id}/approve"
  - priority: 46
    category: business_fiscal
    check: "remittance_received_cents == GrossReceiptsReport.assessed_fee_cents — the agency accepts a period only when the cash matches the period fee to the cent"
    error_id: ERR_REMITTANCE_MISMATCH
    http_status: 422
    applies_to: "POST /gross-receipts-reports/{id}/accept"
  - priority: 47
    category: business_fiscal
    check: "payment_amount_cents == FeeReconciliation.additional_fee_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /fee-reconciliations/{id}/settle"
  - priority: 48
    category: business_fiscal
    check: "penal_sum_cents >= PerformanceBond.required_amount_cents (equality passes)"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /performance-bonds/{id}/post"
  - priority: 49
    category: business_fiscal
    check: "penal_sum_cents <= Offeror.bond_capacity_cents of the lease holder"
    error_id: ERR_BOND_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /performance-bonds/{id}/post"
  - priority: 50
    category: business_fiscal
    check: "draw_amount_cents <= PerformanceBond.available_balance_cents"
    error_id: ERR_DRAW_EXCEEDS_BOND
    http_status: 422
    applies_to: "POST /compliance-actions/{id}/order-bond-draw"
  - priority: 51
    category: business_fiscal
    check: "0 < reinstatement_amount_cents <= PerformanceBond.drawn_total_cents"
    error_id: ERR_REINSTATEMENT_EXCEEDS_DRAWN
    http_status: 422
    applies_to: "POST /performance-bonds/{id}/reinstate"

# =============================================================================
# §1.5 API Endpoint Table
#
# Flat top-level collections (api_prefix "/"). Every entity has a single-resource
# GET /<collection>/{id} and a filtered list GET /<collection> carrying each of
# its FK fields as an optional query input, so every FK declared in §1.1 is
# reverse-reachable. Lease and PerformanceBond rows are never created directly —
# they are minted by POST /prospectuses/{id}/award.
# =============================================================================

endpoints:
  # ---- test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit instant. The clock is the ONLY source of 'now' for every deadline, window, expiry and interest computation. Before the first call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ProgramAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock repositioned; no entity is mutated and no version is incremented"]

  # ---- Park
  - method: POST
    path: "/parks"
    description: "Registers a state park with the regional benchmark rates that cap what a concessionaire may charge the public."
    roles: [ProgramAdministrator]
    code: 201
    input: [name, region_code, annual_visitation, comparable_lodging_rate_cents, comparable_meal_rate_cents, comparable_activity_rate_cents]
    output: Park
    side_effects: ["Park created with status OPERATING and open_closure_window_count 0"]
  - method: GET
    path: "/parks"
    description: "Lists parks, optionally filtered."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: Park[]
    side_effects: []
  - method: GET
    path: "/parks/{id}"
    description: "Reads one park including its live open_closure_window_count."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: []
    output: Park
    side_effects: []

  # ---- ConcessionOpportunity
  - method: POST
    path: "/concession-opportunities"
    description: "Opens a draft concession opportunity for a park, stating the capital investment the agency will require of the concessionaire."
    roles: [ConcessionSpecialist]
    code: 201
    input: [park_id, title, service_category, required_capital_investment_cents]
    output: ConcessionOpportunity
    side_effects: ["ConcessionOpportunity created in DRAFT"]
  - method: POST
    path: "/concession-opportunities/{id}/market-analysis"
    description: "Records the market analysis: a comparable operation's annual receipts and the share this site is projected to capture. Recomputes estimated_annual_gross_receipts_cents. Repeatable while the opportunity is unapproved."
    roles: [ConcessionSpecialist]
    code: 200
    input: [comparable_gross_receipts_cents, market_capture_pct, "analyst_note?"]
    output: ConcessionOpportunity
    side_effects: ["calculations.market_analysis_projection recomputes estimated_annual_gross_receipts_cents", "status DRAFT -> ANALYSIS_COMPLETE, or an ANALYSIS_COMPLETE self-loop", "increments ConcessionOpportunity.version by 1"]
  - method: POST
    path: "/concession-opportunities/{id}/approve-solicitation"
    description: "A contracting officer clears the opportunity for solicitation once the projection clears the viability floor."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: ConcessionOpportunity
    side_effects: ["status ANALYSIS_COMPLETE -> APPROVED_FOR_SOLICITATION", "increments ConcessionOpportunity.version by 1"]
  - method: GET
    path: "/concession-opportunities"
    description: "Lists concession opportunities; filter by park to reach a park's opportunities."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: ["park_id?", "status?", "service_category?", "limit?", "offset?"]
    output: ConcessionOpportunity[]
    side_effects: []
  - method: GET
    path: "/concession-opportunities/{id}"
    description: "Reads one concession opportunity."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: []
    output: ConcessionOpportunity
    side_effects: []

  # ---- Prospectus
  - method: POST
    path: "/prospectuses"
    description: "Drafts the competitive solicitation prospectus: minimum franchise fee, minimum annual guarantee, term, submission deadline, the five evaluation weights (which must total 100), the scoring mode and the minimum technical score."
    roles: [ConcessionSpecialist]
    code: 201
    input: [opportunity_id, minimum_franchise_fee_pct, minimum_annual_guarantee_cents, term_years, submission_deadline, weight_experience, weight_operating_plan, weight_capital_investment, weight_financial_capacity, weight_fee_offer, scoring_mode, min_technical_score]
    output: Prospectus
    side_effects: ["Prospectus created in DRAFT"]
  - method: POST
    path: "/prospectuses/{id}/issue"
    description: "Publishes the prospectus, opening the submission window."
    roles: [ConcessionSpecialist]
    code: 200
    input: []
    output: Prospectus
    side_effects: ["status DRAFT -> ISSUED", "the opportunity transitions APPROVED_FOR_SOLICITATION -> SOLICITED", "increments Prospectus.version by 1"]
  - method: POST
    path: "/prospectuses/{id}/close"
    description: "Closes the submission window once the deadline has passed; outstanding revision requests lapse."
    roles: [ConcessionSpecialist]
    code: 200
    input: []
    output: Prospectus
    side_effects: ["status ISSUED -> CLOSED", "every REVISION_REQUESTED proposal on this prospectus transitions to NOT_SELECTED", "increments Prospectus.version by 1"]
  - method: POST
    path: "/prospectuses/{id}/award"
    description: "Awards the concession to the rank-1 responsive proposal per calculations.award_selection and mints the Lease plus its PENDING PerformanceBond. Returns the new Lease, whose performance_bond_id names the bond."
    roles: [ContractingOfficer]
    code: 201
    input: [term_start]
    output: Lease
    side_effects: ["status CLOSED -> AWARDED", "the rank-1 proposal transitions SCORED -> SELECTED; all other live proposals transition to NOT_SELECTED", "a Lease is created in PENDING_EXECUTION / COMPLIANT with base_fee_pct, minimum_annual_guarantee_cents and capital_investment_obligation_cents copied from the selected proposal, term_years from this prospectus, term_end from calculations.lease_term_window and required_bond_amount_cents from calculations.required_performance_bond_amount", "a PerformanceBond is created in PENDING with required_amount_cents copied from the lease", "the opportunity transitions SOLICITED -> AWARDED", "increments Prospectus.version by 1"]
  - method: GET
    path: "/prospectuses"
    description: "Lists prospectuses; filter by opportunity to reach an opportunity's solicitations."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: ["opportunity_id?", "status?", "limit?", "offset?"]
    output: Prospectus[]
    side_effects: []
  - method: GET
    path: "/prospectuses/{id}"
    description: "Reads one prospectus."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: []
    output: Prospectus
    side_effects: []

  # ---- Offeror
  - method: POST
    path: "/offerors"
    description: "Registers a prospective concessionaire with its surety-attested bond capacity. The returned id is the X-User-ID a Concessionaire acts under."
    roles: [ProgramAdministrator]
    code: 201
    input: [legal_name, contact_email, bond_capacity_cents]
    output: Offeror
    side_effects: ["Offeror created in ELIGIBLE"]
  - method: POST
    path: "/offerors/{id}/debar"
    description: "Debars an offeror; every live proposal it holds is withdrawn, but its existing leases are untouched."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Offeror
    side_effects: ["status ELIGIBLE -> DEBARRED", "every SUBMITTED / UNDER_REVIEW / REVISION_REQUESTED / SCORED proposal held by this offeror transitions to WITHDRAWN", "increments Offeror.version by 1"]
  - method: GET
    path: "/offerors"
    description: "Lists offerors."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Offeror[]
    side_effects: []
  - method: GET
    path: "/offerors/{id}"
    description: "Reads one offeror."
    roles: [ProgramAdministrator, ConcessionSpecialist, ContractingOfficer, EvaluationPanelist, AuditorGeneral, Concessionaire]
    code: 200
    input: []
    output: Offeror
    side_effects: []

  # ---- Proposal
  - method: POST
    path: "/proposals"
    description: "An offeror submits a proposal against an issued prospectus before the deadline."
    roles: [Concessionaire]
    code: 201
    input: [prospectus_id, offeror_id, offered_franchise_fee_pct, proposed_capital_investment_cents, proposed_annual_guarantee_cents, experience_years, financial_capacity_ratio]
    output: Proposal
    side_effects: ["Proposal created in SUBMITTED with revision_round 0, evaluation_count 0 and composite_score null"]
  - method: POST
    path: "/proposals/{id}/begin-review"
    description: "Moves a proposal into evaluation."
    roles: [ConcessionSpecialist]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status SUBMITTED -> UNDER_REVIEW", "increments Proposal.version by 1"]
  - method: POST
    path: "/proposals/{id}/evaluations"
    description: "A panelist files one score sheet. The REQUIRED_PANELIST_COUNT-th sheet scores the proposal. One sheet per panelist X-User-ID."
    roles: [EvaluationPanelist]
    code: 201
    input: [score_experience, score_operating_plan, score_capital_investment, score_financial_capacity, score_fee_offer]
    output: ProposalEvaluation
