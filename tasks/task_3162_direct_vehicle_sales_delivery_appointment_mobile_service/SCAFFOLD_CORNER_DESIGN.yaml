  # ===========================================================================
  - section: rbac
    instances:

      - name: platform_admin_can_read_the_catalog_while_buyer_may_only_read_own_order
        claim_type: exclusive_operation
        grounds:
          - roles[PlatformAdmin].shared_operations
          - roles[Buyer].shared_operations
          - endpoints.GET_/v1/orders
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "PlatformAdmin holds the shared read over every order while Buyer is not permitted to list the tenancy's orders, so the same GET /v1/orders resolves to 200 for one role and 403 for the other."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one order created by a verified buyer."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - *c_buyer
            - *c_verify
            - *c_order
          trigger:
            - call: "GET /v1/orders"
              payload: {}
              as: PlatformAdmin
            - call: "GET /v1/orders"
              payload: {}
              as: Buyer
              as_user_id: "${byr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the PlatformAdmin listing returns 200 with exactly 1 row"
            - "the Buyer listing returns 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /v1/orders/${ord_id} as Buyer with as_user_id ${byr_id} returns 200"

