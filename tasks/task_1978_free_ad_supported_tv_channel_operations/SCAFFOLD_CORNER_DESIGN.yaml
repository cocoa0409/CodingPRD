            - "FillDecision.${d1}.house_ad_id == ${h_lo} and FillDecision.${d1}.slot_index == 1"
            - "AdBreak.${br}.house_seconds == 60 and slate_seconds == 0"

      - name: house_ad_daily_cap_boundary_exact
        claim_type: correct_result
