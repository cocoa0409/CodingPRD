  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: scope_approve_requires_notice_acknowledged
        grounds:
          - state_machines.CollectionScope.PROPOSED_to_APPROVED
          - entities.CollectionScope.fields.preservation_notice_id
          - errors[ERR_NOTICE_NOT_ACKNOWLEDGED]
        distinguishing_aspect: |
          Pair CollectionScope -> PreservationNotice: scope approval is legal only
          when the covering notice has reached ACKNOWLEDGED; while the notice is
          merely ISSUED the approve fails with ERR_NOTICE_NOT_ACKNOWLEDGED, and it
          succeeds after the notice transitions to ACKNOWLEDGED.
        test_recipe:
          setup:
            - "Case FIELDWORK with approved plan; notice N (EMP-100, ALL_DATA) in ISSUED (not yet acknowledged); scope S PROPOSED referencing N"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /api/cases"
              payload: { title: "Case CE-1", allegation_category: DATA_BREACH, severity: HIGH, department: "IT", lead_investigator_id: "inv-lead-1" }
              as: IntakeCoordinator
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: TRIAGED, severity: HIGH, department: "IT" }, as: IntakeCoordinator }
            - call: "GET /api/cases/${case_id}"
              as: Investigator
              captures: { case_v: $.data.version }
            - call: "POST /api/cases/${case_id}/plans"
              payload: { scope_statement: "scope", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-20T00:00:00Z", expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { plan_id: $.data.id }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - call: "POST /api/cases/${case_id}/preservation-notices"
              payload: { custodian_ref: "EMP-100", scope: ALL_DATA, is_regulator_ordered: false }
              as: GeneralCounsel
              captures: { n1: $.data.id }
            - call: "POST /api/cases/${case_id}/collection-scopes"
              payload: { custodian_ref: "EMP-100", data_source: EMAIL, planned_start: "2026-05-05T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", preservation_notice_id: "${n1}" }
              as: Investigator
              captures: { s1: $.data.id }
