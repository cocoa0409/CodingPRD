          - ${z1}
          panels_per_zone: 36
          lites_per_panel: 2
          expected_package_version: ${pkg_v}
        as: CWProjectManager
        captures:
          e_stale2: $.data.error_id
      assert:
      - the release carrying ${pkg_v} - 1 returns ERR_STALE_PACKAGE_VERSION with HTTP 412, creates no FabricationRelease
        and no PanelLot
      - GlassOrder.${go}.allocated_lites is still 0 after the rejected call - the lite ledger was not touched
      - the release carrying ${pkg_v} succeeds and moves the package MOCKUP_QUALIFIED -> IN_FABRICATION, bumping its version
      - replaying the same payload with the now-stale ${pkg_v} returns ERR_STALE_PACKAGE_VERSION (412) - the successful
        write invalidated the token
