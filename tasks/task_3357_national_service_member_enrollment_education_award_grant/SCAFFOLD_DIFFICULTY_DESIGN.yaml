              captures: { award_v2: $.data.version }
          trigger:
            - call: "POST /awards/${award_id}/enrollments"
              payload: { member_id: "${m_a}", term_category: "FULL_TIME", service_start_date: "2027-08-15", service_end_date: "2028-04-15", expected_award_version: "${award_v2}" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { enr_a2: $.data.id }
            - call: "GET /awards/${award_id}"
              payload: {}
              as: CNCSProgramOfficer
              captures: { award_v3: $.data.version }
            - call: "POST /awards/${award_id}/enrollments"
