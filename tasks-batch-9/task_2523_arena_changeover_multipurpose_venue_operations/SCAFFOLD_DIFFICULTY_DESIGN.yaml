          assert:
            - "the install captured score_at_install == 40.00 and required_snapshot == 120, and the install itself was NOT rejected with ERR_DEHUMIDIFICATION_INSUFFICIENT because 30 >= 0.25 * 120 is evaluated with >="
            - "the first trigger call returns HTTP 422 with error_id ERR_CONDENSATION_RISK_TOO_HIGH, because 40.00 is not strictly below CONDENSATION_BLOCK_THRESHOLD 40.00"
            - "the second trigger call returns HTTP 200 with condensation_risk_score == 39.99 (unrounded 39.98875) and status == COVERED"
            - "IceSheet.${sheet_id}.dehumidification_lph_applied == 30.03"
            - "IceSheet.${sheet_id}.cover_cycles == 1"
            - "IceSheet.${sheet_id}.cover_installed_at_utc == 2026-08-01T00:00:00.000Z"
            - "IceSheet.${sheet_id}.cover_hours_accumulated == 0.000"
            - "Venue.${venue_id}.ice_deck_status == COVERED"

      - name: labor_settlement_rounds_per_head_half_cent_up_before_the_headcount_multiply
        grounds:
          - calculations.labor_call_cost_cents
          - state_machines.LaborCall.CALLED_to_WORKED
          - entities.LaborCall.fields.settled_cost_cents
          - endpoints.POST_/labor-calls/{id}/close
        distinguishing_aspect: |
          Four ELECTRICIAN heads on an overnight call reporting 8.2 actual hours land the per-head
          amount on an exact half cent — 6900 * (8 + 0.2 * 1.5) * 1.35 = 77314.5 — so the pinned
          order (round_half_up per head to 77315, then multiply by 4) yields 309260 while the
          reversed order (multiply first, round once) yields 309258; the two differ by exactly 2
          cents, and the ESTIMATED variant frozen at creation must still read 298080 from the
          scheduled 8-hour window with no overtime at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Lakeside Arena registered with overnight_shift_start_local_hour 22 and PROFILE ICE declared."
            - "A promoter ice booking 2026-09-10T00:00Z..03:00Z is HELD, used purely to scope the labor call to a booking rather than to a turnaround, so the close is not gated on any ChangeoverOrder state."
            - "A booking-scoped ELECTRICIAN labor call for 4 heads runs 2026-09-10T04:00:00Z..12:00:00Z with guaranteed_hours 4; its window local start hour is 0, so overnight is true and the ESTIMATED variant freezes at 298080."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_ice: $.data.id }
            - call: "POST /event-bookings/${b_ice}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /labor-calls"
              payload: { craft: "ELECTRICIAN", headcount: 4, call_start_utc: "2026-09-10T04:00:00Z", call_end_utc: "2026-09-10T12:00:00Z", guaranteed_hours: 4, booking_id: "${b_ice}" }
              as: LaborCoordinator
              captures: { call_id: $.data.id, estimated: $.data.estimated_cost_cents, is_overnight: $.data.overnight }
          trigger:
            - call: "POST /labor-calls/${call_id}/close"
              payload: { actual_hours: 8.2 }
              as: LaborCoordinator
          assert:
            - "the captured is_overnight == true and estimated == 298080, with no overtime component because scheduled_hours is exactly OT_THRESHOLD_HOURS 8"
            - "LaborCall.${call_id}.status == WORKED"
            - "LaborCall.${call_id}.actual_hours == 8.2"
            - "LaborCall.${call_id}.settled_cost_cents == 309260"
            - "LaborCall.${call_id}.settled_cost_cents != 309258, the value produced by rounding after the headcount multiply"
            - "LaborCall.${call_id}.estimated_cost_cents == 298080, unchanged by the close"
            - "LaborCall.${call_id}.cancellation_fee_cents == null"

      - name: hold_expiry_admits_the_confirm_at_the_exact_expiry_instant_and_refuses_it_one_second_later
        grounds:
          - calculations.hold_expires_at
          - validations[priority=78]
          - state_machines.EventBooking.HELD_to_CONFIRMED
          - errors.ERR_HOLD_EXPIRED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          Two identically-held TIER_3 bookings share the expiry instant 2026-08-04T00:00:00.000Z;
          confirmed at exactly that instant the first succeeds because the guard is `now <=
          hold_expires_at`, and one second later at 2026-08-04T00:00:01Z the second fails with
          ERR_HOLD_EXPIRED, so the pass/fail line sits on a single second and an implementation
          using a strict < or truncating to whole minutes gets exactly one of the two wrong.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Lakeside Arena registered with PROFILE ICE declared."
            - "Anchor tenant Harbor Curling at TIER_3 with 5 guaranteed holds, so HOLD_WINDOW_HOURS for TIER_3 is 72 and both holds expire at 2026-08-04T00:00:00.000Z."
            - "Two ice bookings with disjoint half-open event intervals (2026-09-12 and 2026-09-13, 1500 kg rigging load each) are both HELD at the 2026-08-01T00:00:00Z instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/anchor-tenants"
              payload: { name: "Harbor Curling", hold_priority_tier: "TIER_3", guaranteed_holds_per_season: 5 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { t3: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", tenant_id: "${t3}", config_profile_id: "${p_ice}", title: "Harbor Curling draw 1", event_start_utc: "2026-09-12T00:00:00Z", event_end_utc: "2026-09-12T03:00:00Z", expected_attendance: 9000, rigging_load_kg: 1500 }
              as: BookingManager
              captures: { bh1: $.data.id }
            - call: "POST /event-bookings/${bh1}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", tenant_id: "${t3}", config_profile_id: "${p_ice}", title: "Harbor Curling draw 2", event_start_utc: "2026-09-13T00:00:00Z", event_end_utc: "2026-09-13T03:00:00Z", expected_attendance: 9000, rigging_load_kg: 1500 }
              as: BookingManager
              captures: { bh2: $.data.id }
            - call: "POST /event-bookings/${bh2}/hold"
              payload: {}
              as: BookingManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v1: $.data.version }
            - call: "POST /event-bookings/${bh1}/confirm"
              payload: { expected_venue_version: "${v1}" }
              as: BookingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v2: $.data.version }
            - call: "POST /event-bookings/${bh2}/confirm"
              payload: { expected_venue_version: "${v2}" }
              as: BookingManager
          assert:
            - "the third trigger call returns HTTP 200 and EventBooking.${bh1}.status == CONFIRMED, because 2026-08-04T00:00:00Z <= hold_expires_at"
            - "the sixth trigger call returns HTTP 409 with error_id ERR_HOLD_EXPIRED"
            - "EventBooking.${bh1}.hold_expires_at == 2026-08-04T00:00:00.000Z"
            - "EventBooking.${bh2}.hold_expires_at == 2026-08-04T00:00:00.000Z"
            - "EventBooking.${bh2}.status == HELD"
            - "Venue.${venue_id}.open_hold_count == 1"
            - "Venue.${venue_id}.rigging_committed_load_kg == 1500"
            - "Venue.${venue_id}.version == ${v2}, unchanged by the rejected second confirm"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: floor_dimension_cannot_start_until_the_incoming_booking_leaves_held_for_confirmed
        grounds:
          - validations[priority=52]
          - state_machines.ChangeoverOrder.PLANNED_to_IN_PROGRESS
          - state_machines.EventBooking.HELD_to_CONFIRMED
          - errors.ERR_INCOMING_BOOKING_NOT_CONFIRMED
          - endpoints.POST_/changeover-orders/{id}/progress
        distinguishing_aspect: |
          The identical progress call flips from 409 ERR_INCOMING_BOOKING_NOT_CONFIRMED to 200 with
          nothing changed on the ChangeoverOrder itself — only the to_booking's status moved HELD ->
          CONFIRMED — so the order's ability to start is a function of a sibling entity's state
          rather than of its own, and opening the order while the incoming booking is merely HELD
          must still be allowed (the gate lives on progress, not on create).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and left there, so the promoter holds (OPEN tier, 24-hour window, expiring 2026-08-02T00:00:00.000Z) stay confirmable."
            - "Lakeside Arena registered; PROFILE ICE and PROFILE CONCERT declared; a FLOOR_PANEL_SET pool of 10 units."
            - "Outgoing promoter ice booking 2026-09-10T00:00Z..03:00Z is HELD; incoming promoter concert booking 2026-09-10T16:00Z..19:00Z is HELD and deliberately NOT confirmed."
            - "A ChangeoverOrder from the ice booking to the concert booking with crew_headcount 40 exists in PLANNED with a 735-minute window against a 708-minute plan; 3 FLOOR_PANEL_SET units are ISSUED to it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
