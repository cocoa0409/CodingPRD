scenario: |
  REIT Compliance & Distribution Management (public REIT compliance team): asset & income
  test monitoring by quarter, distribution requirement calculation & timing, taxable REIT
  subsidiary activity limits, shareholder concentration (5/50) monitoring & ownership limit
  enforcement, dividend declaration & characterization (ordinary/capital gain/return of
  capital), earnings & profits calculation, prohibited transaction analysis on sales,
  disclosure & board approvals.

domain_name: "reit-compliance-distribution"
api_prefix: "/reit-compliance"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Reit
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the REIT" }
      - { name: ticker, type: string, source: input, description: "Exchange ticker symbol", constraints: "unique across all Reit rows" }
      - { name: charter_ownership_limit_pct, type: number, source: input, description: "Charter ownership cap per person (percent, e.g. 9.8); must be strictly below 50.0", constraints: "0 < value < 50.0" }
      - { name: taxable_year_start, type: string, source: input, description: "Taxable year start date YYYY-MM-DD" }
      - { name: status, type: enum, source: computed, description: "Operating status of the REIT entity", constraints: "ACTIVE | SUSPENDED" }
      - { name: current_ep_balance_cents, type: integer, source: computed, description: "Current E&P balance: opening E&P plus all POSTED EpAdjustment entries net of distribution E&P allocations; pinned by calc_ep_balance" }
      - { name: dividend_distribution_deficit_cents, type: integer, source: computed, description: "Positive deficiency amount owed for the most recent POSTED DistributionRequirement (0 when satisfied); written on declaration post" }
      - { name: five_fifty_blocked, type: boolean, source: computed, description: "True while the latest ShareholderSnapshot covering a half-year end failed the 5/50 test; blocks dividend declaration until remediated", default: false }

  - name: AssetHolding
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: asset_name, type: string, source: input, description: "Human-readable asset label" }
      - { name: asset_class, type: enum, source: input, description: "Classification for the 75% asset test", constraints: "REAL_ESTATE | QUALIFYING_SECURITY | NON_QUALIFYING" }
      - { name: held_by_trs, type: boolean, source: input, description: "True when the asset is held through a taxable REIT subsidiary" }
      - { name: is_dealer_inventory, type: boolean, source: input, description: "True when the property is held primarily for sale to customers in the ordinary course (dealer property)" }
      - { name: acquisition_date, type: string, source: input, description: "YYYY-MM-DD the asset entered the REIT or TRS" }
      - { name: value_cents, type: integer, source: input, description: "Current gross asset value used in quarterly asset tests" }
      - { name: status, type: enum, source: computed, description: "HELD while owned; SOLD after a completed AssetSale", constraints: "HELD | SOLD" }

  - name: IncomeItem
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: quarter_id, type: string, source: input, description: "FK -> Quarter.id; quarter in which the income accrued" }
      - { name: income_class, type: enum, source: input, description: "Qualifying bucket: RENTS counts toward both 75% and 95%; MORTGAGE_INTEREST counts toward 95% only; NON_QUALIFYING counts toward neither", constraints: "RENTS | MORTGAGE_INTEREST | NON_QUALIFYING" }
      - { name: amount_cents, type: integer, source: input, description: "Gross income amount in cents", constraints: ">= 0" }
      - { name: source_is_trs, type: boolean, source: input, description: "True when the income was earned by a taxable REIT subsidiary" }
      - { name: accrued_at, type: string, source: input, description: "YYYY-MM-DD accrual date; drives chronological E&P accrual ordering (tie-break: created_at ASC)" }

  - name: Quarter
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: label, type: string, source: input, description: "Calendar label such as 2026-Q1", constraints: "unique within Reit" }
      - { name: period_start, type: string, source: input, description: "YYYY-MM-DD inclusive start of quarter" }
      - { name: period_end, type: string, source: input, description: "YYYY-MM-DD inclusive end of quarter" }
      - { name: status, type: enum, source: computed, description: "OPEN while data accrues; LOCKED once an AssetTestReport or IncomeTestReport is locked against the quarter", constraints: "OPEN | LOCKED" }
      - { name: gross_asset_total_cents, type: integer, source: computed, description: "Sum of value_cents over AssetHolding rows with reit_id == this reit and status == HELD at the moment the asset test is locked" }
      - { name: gross_income_total_cents, type: integer, source: computed, description: "Sum of amount_cents over IncomeItem rows whose quarter_id == this quarter (all classes)" }

  - name: AssetTestReport
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: quarter_id, type: string, source: input, description: "FK -> Quarter.id; quarter under test", constraints: "unique within Reit — one asset test report per quarter" }
      - { name: status, type: enum, source: computed, description: "DRAFT on creation; LOCKED after results are frozen; BREACHED when locked with a failing ratio", constraints: "DRAFT | LOCKED | BREACHED" }
      - { name: qualifying_75_pct, type: number, source: computed, description: "Percentage of total asset value in REAL_ESTATE or QUALIFYING_SECURITY, computed by calc_asset_test_75", constraints: "0..100, 4 decimal places" }
      - { name: trs_concentration_pct, type: number, source: computed, description: "Percentage of total asset value held via TRS subsidiaries, computed by calc_trs_concentration", constraints: "0..100, 4 decimal places" }
      - { name: test_75_passed, type: boolean, source: computed, description: "qualifying_75_pct >= 75.0000 (boundary is inclusive)" }
      - { name: trs_test_passed, type: boolean, source: computed, description: "trs_concentration_pct <= 20.0000 (boundary is inclusive; strictly above breaches)" }

  - name: IncomeTestReport
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: quarter_id, type: string, source: input, description: "FK -> Quarter.id; quarter under test", constraints: "unique within Reit — one income test report per quarter" }
      - { name: status, type: enum, source: computed, description: "DRAFT on creation; LOCKED after results frozen; BREACHED when locked with a failing ratio", constraints: "DRAFT | LOCKED | BREACHED" }
      - { name: qualifying_75_pct, type: number, source: computed, description: "Percentage of gross income qualifying for the 75% test (RENTS only)", constraints: "0..100, 4 decimal places" }
      - { name: qualifying_95_pct, type: number, source: computed, description: "Percentage of gross income qualifying for the 95% test (RENTS + MORTGAGE_INTEREST)", constraints: "0..100, 4 decimal places" }
      - { name: test_75_passed, type: boolean, source: computed, description: "qualifying_75_pct >= 75.0000 inclusive" }
      - { name: test_95_passed, type: boolean, source: computed, description: "qualifying_95_pct >= 95.0000 inclusive" }

  - name: Shareholder
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: display_name, type: string, source: input, description: "Holder display name" }
      - { name: holder_type, type: enum, source: input, description: "INDIVIDUAL persons count toward the 5/50 five-or-fewer test; ENTITY holders do not", constraints: "INDIVIDUAL | ENTITY" }
      - { name: status, type: enum, source: computed, description: "ACTIVE while holding; FROZEN while an ownership-limit violation on this holder is unremediated", constraints: "ACTIVE | FROZEN" }

  - name: ShareholderSnapshot
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: snapshot_date, type: string, source: input, description: "YYYY-MM-DD effective date of the ownership snapshot; must fall on the last day of a taxable-year half", constraints: "unique within Reit" }
      - { name: total_shares_outstanding, type: integer, source: input, description: "Total shares outstanding on snapshot_date", constraints: "> 0" }
      - { name: status, type: enum, source: computed, description: "DRAFT while positions accrue; FINALIZED once concentrations are computed and locked", constraints: "DRAFT | FINALIZED" }
      - { name: top5_individual_pct, type: number, source: computed, description: "Combined percentage of outstanding shares held by the five largest INDIVIDUAL holders (fewer than five individuals in DRAFT positions: sum all of them), computed by calc_five_fifty", constraints: "0..100, 4 decimal places" }
      - { name: five_fifty_passed, type: boolean, source: computed, description: "top5_individual_pct <= 50.0000 inclusive" }
      - { name: violator_shareholder_ids, type: array, source: computed, description: "Shareholder ids whose concentration_pct exceeded Reit.charter_ownership_limit_pct at finalization, ordered by shares_held DESC then created_at ASC" }

  - name: ShareholderPosition
    parent: ShareholderSnapshot
    common_fields: true
    fields:
      - { name: snapshot_id, type: string, source: input, description: "FK -> ShareholderSnapshot.id; snapshot this position belongs to" }
      - { name: shareholder_id, type: string, source: input, description: "FK -> Shareholder.id; holder of record" }
      - { name: shares_held, type: integer, source: input, description: "Shares held as of the snapshot date", constraints: ">= 0" }
      - { name: concentration_pct, type: number, source: computed, description: "shares_held / snapshot.total_shares_outstanding * 100 at finalization", constraints: "0..100, 4 decimal places" }

  - name: DistributionRequirement
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: taxable_year, type: integer, source: input, description: "Four-digit taxable year", constraints: "unique within Reit" }
      - { name: status, type: enum, source: computed, description: "DRAFT on creation; POSTED after ComplianceOfficer posts the required amount; CLOSED at year-end rollover which finalizes the deficiency", constraints: "DRAFT | POSTED | CLOSED" }
      - { name: taxable_income_cents, type: integer, source: input, description: "REIT taxable income before the dividends-paid deduction" }
      - { name: net_capital_gain_cents, type: integer, source: input, description: "Net capital gain for the year (may be 0)" }
      - { name: required_amount_cents, type: integer, source: computed, description: "90% of (taxable_income_cents - net_capital_gain_cents), floor 0, by calc_distribution_requirement" }
      - { name: distributed_amount_cents, type: integer, source: computed, description: "Sum of amount_cents over DividendDeclaration rows for this year with status in {DECLARED, PAID}", default: 0 }
      - { name: deficiency_cents, type: integer, source: computed, description: "max(0, required_amount_cents - distributed_amount_cents); frozen at CLOSED" }

  - name: DividendDeclaration
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: taxable_year, type: integer, source: input, description: "Taxable year the dividend counts against for the distribution requirement" }
      - { name: amount_cents, type: integer, source: input, description: "Gross dividend amount in cents", constraints: "> 0" }
      - { name: declaration_date, type: string, source: input, description: "YYYY-MM-DD declared" }
      - { name: record_date, type: string, source: input, description: "YYYY-MM-DD holder-of-record date", constraints: ">= declaration_date" }
      - { name: payable_date, type: string, source: input, description: "YYYY-MM-DD payment date", constraints: ">= record_date" }
      - { name: status, type: enum, source: computed, description: "PENDING_APPROVAL on creation; APPROVED after board resolution; DECLARED after declaration is executed; PAID after payment; VOID if cancelled before DECLARED", constraints: "PENDING_APPROVAL | APPROVED | DECLARED | PAID | VOID" }
      - { name: ordinary_cents, type: integer, source: computed, description: "Ordinary-income portion by calc_dividend_characterization" }
      - { name: capital_gain_cents, type: integer, source: computed, description: "Capital-gain portion by calc_dividend_characterization" }
      - { name: return_of_capital_cents, type: integer, source: computed, description: "Return-of-capital portion by calc_dividend_characterization" }
      - { name: declared_by_officer_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who executed the declaration" }
      - { name: approved_by_director_id, type: string, source: system, description: "X-User-ID of the BoardDirector who approved" }

  - name: EpAdjustment
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: quarter_id, type: string, source: input, description: "FK -> Quarter.id; quarter the adjustment accrues to" }
      - { name: kind, type: enum, source: input, description: "TAXABLE_INCOME accrues positive E&P; DISALLOWED_DEDUCTION accrues positive E&P; FEDERAL_TAX accrues negative E&P", constraints: "TAXABLE_INCOME | DISALLOWED_DEDUCTION | FEDERAL_TAX" }
      - { name: amount_cents, type: integer, source: input, description: "Signed magnitude in cents; sign convention enforced by kind (TAXABLE_INCOME/DISALLOWED_DEDUCTION must be >= 0; FEDERAL_TAX must be >= 0 and is subtracted)" , constraints: ">= 0" }
      - { name: effective_date, type: string, source: input, description: "YYYY-MM-DD accrual date; chronological replay key (tie-break created_at ASC)" }
      - { name: status, type: enum, source: computed, description: "DRAFT on creation; POSTED once included in the E&P balance", constraints: "DRAFT | POSTED" }

  - name: AssetSale
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: asset_holding_id, type: string, source: input, description: "FK -> AssetHolding.id; asset being sold" }
      - { name: sale_price_cents, type: integer, source: input, description: "Gross sale price", constraints: "> 0" }
      - { name: basis_cents, type: integer, source: input, description: "Adjusted tax basis at sale", constraints: ">= 0" }
      - { name: sale_date, type: string, source: input, description: "YYYY-MM-DD closing date" }
      - { name: status, type: enum, source: computed, description: "DRAFT on creation; ANALYZED after prohibited-transaction analysis completes; CONFIRMED after TaxDirector confirmation (AssetHolding flips to SOLD); VOID if cancelled before CONFIRMED", constraints: "DRAFT | ANALYZED | CONFIRMED | VOID" }
      - { name: holding_period_months, type: integer, source: computed, description: "Whole calendar months between AssetHolding.acquisition_date and sale_date (floor of day count / 30)" }
      - { name: is_prohibited, type: boolean, source: computed, description: "True when dealer inventory sold within 24 months per calc_prohibited_transaction" }
      - { name: prohibited_tax_cents, type: integer, source: computed, description: "100% tax on net gain when is_prohibited, else 0" }

  - name: ComplianceDisclosure
    parent: Reit
    common_fields: true
    fields:
      - { name: reit_id, type: string, source: input, description: "FK -> Reit.id; owning REIT" }
      - { name: disclosure_type, type: enum, source: input, description: "ASSET_TEST | INCOME_TEST | FIVE_FIFTY | DISTRIBUTION | PROHIBITED_TRANSACTION", constraints: "enum set" }
      - { name: reference_id, type: string, source: input, description: "Polymorphic reference: id of the report/snapshot/requirement/sale being disclosed" }
      - { name: title, type: string, source: input, description: "Disclosure title" }
      - { name: body, type: string, source: input, description: "Disclosure narrative" }
      - { name: status, type: enum, source: computed, description: "DRAFT on creation; SUBMITTED after ComplianceOfficer submits; APPROVED or REJECTED by BoardDirector; on REJECTED returns to DRAFT for revision (revision loop)", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times this disclosure has returned SUBMITTED -> DRAFT via rejection", default: 0 }
      - { name: submitted_by_officer_id, type: string, source: system, description: "X-User-ID of the submitting ComplianceOfficer" }
      - { name: decided_by_director_id, type: string, source: system, description: "X-User-ID of the BoardDirector who approved or rejected" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AssetTestReport
    initial_state: DRAFT
    terminal_states: [BREACHED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /asset-test-reports/{id}/lock"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT"
          - "report.quarter.status == OPEN"
          - "calc_asset_test_75(qualifying_75_pct) >= 75.0000 AND calc_trs_concentration(trs_concentration_pct) <= 20.0000 (both tests pass)"
        side_effects:
          - "recompute qualifying_75_pct, trs_concentration_pct, test_75_passed, trs_test_passed and persist on the report"
          - "set Quarter.status := LOCKED for report.quarter_id (cascade down — locks income data too)"
          - "increments report.version by 1; increments quarter.version by 1"
      - from: DRAFT
        to: BREACHED
        trigger: "POST /asset-test-reports/{id}/lock (either ratio fails)"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT"
          - "report.quarter.status == OPEN"
          - "qualifying_75_pct < 75.0000 OR trs_concentration_pct > 20.0000"
        side_effects:
          - "recompute and persist ratios; set test_75_passed / trs_test_passed accordingly"
          - "set Quarter.status := LOCKED for report.quarter_id"
          - "set Reit.status := SUSPENDED (cross-entity compliance contagion)"
          - "because Reit became SUSPENDED: auto-VOID every DividendDeclaration of this reit in status {PENDING_APPROVAL, APPROVED} (compliance kill-switch; DECLARED/PAID dividends are left untouched)"
          - "increments report.version by 1; increments quarter.version by 1; increments reit.version by 1; increments each auto-voided declaration.version by 1"

  - entity: IncomeTestReport
    initial_state: DRAFT
    terminal_states: [BREACHED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /income-test-reports/{id}/lock"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT"
          - "report.quarter.status == OPEN"
          - "qualifying_75_pct >= 75.0000 AND qualifying_95_pct >= 95.0000"
        side_effects:
          - "recompute and persist qualifying_75_pct, qualifying_95_pct, test_75_passed, test_95_passed"
          - "set Quarter.status := LOCKED"
          - "increments report.version by 1; increments quarter.version by 1"
      - from: DRAFT
        to: BREACHED
        trigger: "POST /income-test-reports/{id}/lock (either ratio fails)"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == DRAFT"
          - "report.quarter.status == OPEN"
          - "qualifying_75_pct < 75.0000 OR qualifying_95_pct < 95.0000"
        side_effects:
          - "recompute and persist ratios and booleans"
          - "set Quarter.status := LOCKED"
          - "set Reit.status := SUSPENDED"
          - "because Reit became SUSPENDED: auto-VOID every DividendDeclaration of this reit in status {PENDING_APPROVAL, APPROVED}"
          - "increments report.version by 1; increments quarter.version by 1; increments reit.version by 1; increments each auto-voided declaration.version by 1"

  - entity: Shareholder
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system cascade from POST /shareholder-snapshots/{id}/finalize when the holder's concentration_pct exceeds the charter limit"
        actor: system
        preconditions:
          - "shareholder appears in the finalized snapshot's violator_shareholder_ids"
        side_effects:
          - "increments shareholder.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /shareholders/{id}/unfreeze"
        actor: TaxDirector
        preconditions:
          - "shareholder.status == FROZEN"
        side_effects:
          - "increments shareholder.version by 1"

  - entity: ShareholderSnapshot
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /shareholder-snapshots/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "snapshot.status == DRAFT"
          - "at least one ShareholderPosition exists for the snapshot"
        side_effects:
          - "compute concentration_pct on every position (shares_held / total_shares_outstanding * 100)"
          - "compute top5_individual_pct and five_fifty_passed via calc_five_fifty; persist on snapshot"
          - "compute violator_shareholder_ids (concentration_pct > Reit.charter_ownership_limit_pct), ordered shares_held DESC then created_at ASC"
          - "for each violator id: set Shareholder.status := FROZEN (cascade down)"
          - "set Reit.five_fifty_blocked := (NOT five_fifty_passed) — a passing later snapshot clears the block (compensating pair)"
          - "increments snapshot.version by 1; increments each frozen shareholder.version by 1; increments reit.version by 1 when five_fifty_blocked flips"

  - entity: DistributionRequirement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /distribution-requirements/{id}/post"
        actor: ComplianceOfficer
        preconditions:
          - "requirement.status == DRAFT"
        side_effects:
          - "compute required_amount_cents via calc_distribution_requirement and persist"
          - "set Reit.dividend_distribution_deficit_cents := required_amount_cents (recomputed on every dividend declare/pay thereafter)"
          - "increments requirement.version by 1; increments reit.version by 1"
      - from: POSTED
        to: CLOSED
        trigger: "POST /distribution-requirements/{id}/close"
        actor: TaxDirector
        preconditions:
          - "requirement.status == POSTED"
          - "every DividendDeclaration with reit_id == requirement.reit_id and taxable_year == requirement.taxable_year is in a terminal state {PAID, VOID}"
        side_effects:
          - "freeze deficiency_cents := max(0, required_amount_cents - distributed_amount_cents)"
          - "if deficiency_cents > 0: set Reit.dividend_distribution_deficit_cents := deficiency_cents (persisted obligation); else set to 0"
          - "increments requirement.version by 1; increments reit.version by 1"

  - entity: DividendDeclaration
    initial_state: PENDING_APPROVAL
    terminal_states: [PAID, VOID]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /dividend-declarations/{id}/approve"
        actor: BoardDirector
        preconditions:
          - "declaration.status == PENDING_APPROVAL"
          - "segregation of duties: X-User-ID != declaration's creating officer is NOT required here (creator is not tracked); the forbidden pairing is approve-by-director then declare-by-same-id — see declare transition"
          - "Reit.status == ACTIVE (suspended REIT may not approve dividends)"
          - "Reit.five_fifty_blocked == false"
        side_effects:
          - "set approved_by_director_id := X-User-ID"
          - "increments declaration.version by 1"
      - from: APPROVED
        to: DECLARED
        trigger: "POST /dividend-declarations/{id}/declare"
        actor: ComplianceOfficer
        preconditions:
          - "declaration.status == APPROVED"
          - "Reit.status == ACTIVE"
          - "Reit.five_fifty_blocked == false"
          - "segregation of duties: X-User-ID != declaration.approved_by_director_id (the officer who declares must not be the director who approved)"
          - "DistributionRequirement for (reit_id, taxable_year) exists and status == POSTED"
        side_effects:
          - "run calc_dividend_characterization: persist ordinary_cents, capital_gain_cents, return_of_capital_cents"
          - "debit Reit.current_ep_balance_cents by ordinary_cents (E&P allocated to dividend)"
          - "set declared_by_officer_id := X-User-ID"
          - "recompute DistributionRequirement.distributed_amount_cents and deficiency_cents (ledger sync)"
          - "recompute Reit.dividend_distribution_deficit_cents := deficiency of the POSTED requirement"
          - "increments declaration.version by 1; increments reit.version by 1; increments requirement.version by 1"
      - from: DECLARED
        to: PAID
        trigger: "POST /dividend-declarations/{id}/pay"
        actor: ComplianceOfficer
        preconditions:
          - "declaration.status == DECLARED"
        side_effects:
          - "no E&P change (allocation happened at DECLARED); ledger sync on requirement amounts unchanged"
          - "increments declaration.version by 1"
      - from: PENDING_APPROVAL
        to: VOID
        trigger: "POST /dividend-declarations/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "declaration.status in {PENDING_APPROVAL, APPROVED}"
        side_effects:
          - "increments declaration.version by 1"
      - from: APPROVED
        to: VOID
        trigger: "POST /dividend-declarations/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "declaration.status in {PENDING_APPROVAL, APPROVED}"
        side_effects:
          - "increments declaration.version by 1"

  - entity: EpAdjustment
    initial_state: DRAFT
    terminal_states: [POSTED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /ep-adjustments/{id}/post"
        actor: TaxDirector
        preconditions:
          - "adjustment.status == DRAFT"
          - "adjustment.quarter.status == OPEN"
        side_effects:
          - "recompute Reit.current_ep_balance_cents via calc_ep_balance (chronological replay including this adjustment)"
          - "increments adjustment.version by 1; increments reit.version by 1"

  - entity: AssetSale
    initial_state: DRAFT
    terminal_states: [CONFIRMED, VOID]
    transitions:
      - from: DRAFT
        to: ANALYZED
        trigger: "POST /asset-sales/{id}/analyze"
        actor: ComplianceOfficer
        preconditions:
          - "sale.status == DRAFT"
          - "sale.asset_holding.status == HELD"
        side_effects:
          - "compute holding_period_months, is_prohibited, prohibited_tax_cents via calc_prohibited_transaction and persist"
          - "increments sale.version by 1"
      - from: ANALYZED
        to: CONFIRMED
        trigger: "POST /asset-sales/{id}/confirm"
        actor: TaxDirector
        preconditions:
          - "sale.status == ANALYZED"
        side_effects:
          - "set AssetHolding.status := SOLD for sale.asset_holding_id (cascade down; removes asset from subsequent asset tests)"
          - "if is_prohibited: accrue prohibited_tax_cents as a FEDERAL_TAX-like charge — post nothing automatically, but the sale row carries the tax; recompute nothing else"
          - "increments sale.version by 1; increments asset_holding.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /asset-sales/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "sale.status in {DRAFT, ANALYZED}"
        side_effects:
          - "increments sale.version by 1"
      - from: ANALYZED
        to: VOID
        trigger: "POST /asset-sales/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "sale.status in {DRAFT, ANALYZED}"
        side_effects:
          - "increments sale.version by 1"

  - entity: ComplianceDisclosure
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-disclosures/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "disclosure.status == DRAFT"
          - "reference integrity: disclosure.reference_id resolves to an existing entity of the type implied by disclosure_type, and that entity is in a terminal or locked state (LOCKED/BREACHED for test reports, FINALIZED for snapshots, POSTED/CLOSED for requirements, CONFIRMED for asset sales)"
        side_effects:
          - "set submitted_by_officer_id := X-User-ID"
          - "increments disclosure.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /compliance-disclosures/{id}/approve"
        actor: BoardDirector
        preconditions:
          - "disclosure.status == SUBMITTED"
          - "segregation of duties: X-User-ID != disclosure.submitted_by_officer_id"
        side_effects:
          - "set decided_by_director_id := X-User-ID"
          - "increments disclosure.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /compliance-disclosures/{id}/reject (revision loop)"
        actor: BoardDirector
        preconditions:
          - "disclosure.status == SUBMITTED"
          - "segregation of duties: X-User-ID != disclosure.submitted_by_officer_id"
        side_effects:
          - "set decided_by_director_id := X-User-ID"
          - "revision_count := revision_count + 1"
          - "increments disclosure.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: ep-adjustment-create-stale-reit
    parent_entity: Reit
    write_endpoint: "POST /ep-adjustments"
    occ_field: "expected_reit_version"
    description: |
      Creating an EpAdjustment against a Reit whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just posted an adjustment or locked a report (which legitimately
      advanced Reit.version) and the current writer's view of the E&P baseline is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: dividend-declare-stale-reit
    parent_entity: Reit
    write_endpoint: "POST /dividend-declarations"
    occ_field: "expected_reit_version"
    description: |
      Creating a DividendDeclaration against a Reit whose version has advanced
      since the client last observed it is rejected. A prior declaration or E&P
      posting moves current_ep_balance_cents, so a stale create would characterize
      the dividend against an E&P baseline the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_asset_test_75
    trigger: "POST /asset-test-reports/{id}/lock (before state transition resolves)"
    algorithm: aggregation
    formula: |
      total = sum(AssetHolding.value_cents WHERE reit_id == report.reit_id AND status == HELD)
      qualifying = sum(value_cents over same set AND asset_class IN {REAL_ESTATE, QUALIFYING_SECURITY})
      IF total == 0: qualifying_75_pct = 0.0000  (empty-set rule: a REIT with no assets fails the 75% test)
      ELSE: qualifying_75_pct = round_half_up(qualifying * 100 / total, 4)
      test_75_passed = (qualifying_75_pct >= 75.0000)   # inclusive boundary
    input_set: "AssetHolding rows with status == HELD for the report's reit; SOLD assets excluded"
    constants:
      THRESHOLD_75: 75.0000
    precision: "4 decimal places, round_half_up"

  - name: calc_trs_concentration
    trigger: "POST /asset-test-reports/{id}/lock (same sweep as calc_asset_test_75)"
    algorithm: aggregation
    formula: |
      total = sum(AssetHolding.value_cents WHERE reit_id == report.reit_id AND status == HELD)
      trs_value = sum(value_cents over same set AND held_by_trs == true)
      IF total == 0: trs_concentration_pct = 0.0000
      ELSE: trs_concentration_pct = round_half_up(trs_value * 100 / total, 4)
      trs_test_passed = (trs_concentration_pct <= 20.0000)   # inclusive boundary; 20.0001 breaches
    input_set: "same sweep as calc_asset_test_75 (status == HELD only)"
    constants:
      TRS_LIMIT: 20.0000
    precision: "4 decimal places, round_half_up"

  - name: calc_income_test
    trigger: "POST /income-test-reports/{id}/lock"
    algorithm: aggregation
    formula: |
      total = sum(IncomeItem.amount_cents WHERE quarter_id == report.quarter_id)   # all classes
      q75 = sum(amount_cents over same set AND income_class == RENTS)
      q95 = sum(amount_cents over same set AND income_class IN {RENTS, MORTGAGE_INTEREST})
      IF total == 0: qualifying_75_pct = 0.0000; qualifying_95_pct = 0.0000  (empty-set rule: zero income fails both tests)
      ELSE:
        qualifying_75_pct = round_half_up(q75 * 100 / total, 4)
        qualifying_95_pct = round_half_up(q95 * 100 / total, 4)
      test_75_passed = (qualifying_75_pct >= 75.0000)
      test_95_passed = (qualifying_95_pct >= 95.0000)
    input_set: "IncomeItem rows whose quarter_id == report.quarter_id, regardless of source_is_trs"
    constants:
      THRESHOLD_75: 75.0000
      THRESHOLD_95: 95.0000
    precision: "4 decimal places, round_half_up"

  - name: calc_five_fifty
    trigger: "POST /shareholder-snapshots/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      FOR each position: concentration_pct = round_half_up(shares_held * 100 / snapshot.total_shares_outstanding, 4)
      individuals = [positions whose shareholder.holder_type == INDIVIDUAL]
      sort individuals by shares_held DESC, tie-break Shareholder.created_at ASC  (never id)
      top5 = first 5 of sorted individuals (all of them when fewer than 5 exist)
      top5_individual_pct = round_half_up(sum(concentration_pct over top5), 4)
      five_fifty_passed = (top5_individual_pct <= 50.0000)   # inclusive boundary
      violators = [positions WHERE concentration_pct > Reit.charter_ownership_limit_pct]
      violator_shareholder_ids = violators sorted by shares_held DESC, tie-break Shareholder.created_at ASC
    input_set: "ShareholderPosition rows for the snapshot (all holders, both types, including zero-share positions)"
    constants:
      FIVE_FIFTY_LIMIT: 50.0000
    precision: "4 decimal places, round_half_up"

  - name: calc_distribution_requirement
    trigger: "POST /distribution-requirements/{id}/post"
    algorithm: threshold
    formula: |
      base = taxable_income_cents - net_capital_gain_cents
      IF base <= 0: required_amount_cents = 0   (floor at zero — no negative requirement)
      ELSE: required_amount_cents = round_half_up(base * 0.90, 0)   # exact cents, half-up
    input_set: "the DistributionRequirement row itself (taxable_income_cents, net_capital_gain_cents)"
    constants:
      REQUIRED_PCT: 0.90
    precision: "integer cents, round_half_up"

  - name: calc_dividend_characterization
    trigger: "POST /dividend-declarations/{id}/declare"
    algorithm: waterfall_allocation
    formula: |
      # Bucket 1: ordinary income from current E&P, capped at amount.
      ordinary_cents = min(amount_cents, max(0, Reit.current_ep_balance_cents))
      remainder1 = amount_cents - ordinary_cents
      # Bucket 2: capital gain, capped at the year's designated capital-gain pool
      # (net_capital_gain_cents of the POSTED DistributionRequirement minus capital_gain_cents
      # already characterized on DECLARED/PAID dividends for the same taxable year).
      cg_pool = requirement.net_capital_gain_cents - sum(capital_gain_cents over DividendDeclaration
                WHERE reit_id == this reit AND taxable_year == this taxable_year
                AND status IN {DECLARED, PAID})
      capital_gain_cents = min(remainder1, max(0, cg_pool))
      remainder2 = remainder1 - capital_gain_cents
      # Bucket 3: return of capital absorbs the rest.
      return_of_capital_cents = remainder2
      # Evaluation order is pinned: ordinary first (E&P is debited immediately by
      # ordinary_cents), then capital gain against the remaining pool, then ROC.
      # Rounding: integer cents throughout — no fractional rounding anywhere.
    input_set: "the declaration row; Reit.current_ep_balance_cents at declare time; sibling DividendDeclaration rows with status in {DECLARED, PAID} for the same (reit_id, taxable_year); the POSTED DistributionRequirement"
    constants: {}
    precision: "integer cents"
    variants:
      - name: regulatory_conduit_view
        when: "default variant — used by the declare transition above; E&P drives ordinary income first, capital-gain pool second"
        difference: "ordinary portion keyed to current_ep_balance_cents (conduit theory)"
      - name: tax_benefit_pro_rata_view
        when: "projections only — GET /reits/{id}/dividend-characterization-preview with mode=PRO_RATA reports what the characterization would be under pro-rata allocation"
        difference: "ordinary_cents = round_half_up(amount_cents * max(0,current_ep_balance_cents) / (max(0,current_ep_balance_cents) + max(0,cg_pool)), 0) when the denominator > 0 else 0; capital_gain_cents = amount_cents - ordinary_cents capped at cg_pool; ROC takes any remainder. Identical inputs yield different cents than the waterfall whenever both buckets are partially binding."

  - name: calc_ep_balance
    trigger: "POST /ep-adjustments/{id}/post; also re-run by the dividend declare transition (which debits ordinary_cents)"
    algorithm: chronological
    formula: |
      # Chronological replay: walk POSTED EpAdjustment rows for the reit ordered by
      # effective_date ASC, tie-break created_at ASC (never id). Running balance:
      balance = 0
      FOR adj IN ordered_posted_adjustments:
        IF adj.kind IN {TAXABLE_INCOME, DISALLOWED_DEDUCTION}: balance += adj.amount_cents
        IF adj.kind == FEDERAL_TAX: balance -= adj.amount_cents
      # Then subtract ordinary portions of dividends already declared:
      balance -= sum(ordinary_cents over DividendDeclaration WHERE reit_id == this reit AND status IN {DECLARED, PAID})
      # Balance MAY go negative (deficit E&P); a negative balance clamps the ordinary
      # bucket of calc_dividend_characterization to 0 via max(0, ...).
    input_set: "EpAdjustment rows with status == POSTED for the reit; DividendDeclaration rows with status in {DECLARED, PAID}"
    constants: {}
    precision: "integer cents"
    variants:
      - name: current_ep_view
        when: "default — live running balance described above, reflects all POSTED adjustments and declared dividends"
        difference: "includes dividend debits and all posted adjustments"
      - name: frozen_year_end_view
        when: "GET /reits/{id}/ep-balance?as_of=<taxable_year_end> — snapshot interpretation that replays only adjustments with effective_date on or before the year's last day and ignores later adjustments entirely (no late-arrival inclusion)"
        difference: "adjustments accruing after the as-of boundary are excluded, so the same ledger yields a smaller balance whenever late accruals exist"

  - name: calc_prohibited_transaction
    trigger: "POST /asset-sales/{id}/analyze"
    algorithm: threshold
    formula: |
      holding_period_months = floor((sale_date - asset.acquisition_date) in days / 30)
      is_prohibited = (asset.is_dealer_inventory == true AND holding_period_months < 24)   # 24-month boundary: < 24 triggers, >= 24 safe
      gain = sale_price_cents - basis_cents
      IF is_prohibited AND gain > 0: prohibited_tax_cents = gain        # 100% tax on net gain
      ELSE: prohibited_tax_cents = 0
    input_set: "the AssetSale row and its AssetHolding"
    constants:
      SAFE_HARBOR_MONTHS: 24
    precision: "integer months and cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in the declared role set; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.5 roles / §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id resolves to an existing entity, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every FK body field (reit_id, quarter_id, snapshot_id, shareholder_id, asset_holding_id) resolves to an existing entity of the right type"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK inputs"
  - priority: 5
    category: business_constraint
    check: "payload shape: required fields present, enum values in declared sets, numeric ranges respected (amount_cents > 0 where declared, 0 < charter_ownership_limit_pct < 50.0)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all create/update endpoints"
  - priority: 6
    category: business_constraint
    check: "uniqueness: Reit.ticker unique; Quarter.label unique within reit; one AssetTestReport per quarter; one IncomeTestReport per quarter; ShareholderSnapshot.snapshot_date unique within reit; DistributionRequirement.taxable_year unique within reit"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /reits, POST /quarters, POST /asset-test-reports, POST /income-test-reports, POST /shareholder-snapshots, POST /distribution-requirements"
  - priority: 7
    category: state
    check: "target entity is in a from-state listed for the requested transition (e.g., only DRAFT reports can lock; only PENDING_APPROVAL/APPROVED dividends can void)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_temporal
    check: "quarter is OPEN for data mutations: IncomeItem create/update requires its quarter.status == OPEN; EpAdjustment create and post require quarter.status == OPEN; ShareholderPosition create requires snapshot.status == DRAFT"
    error_id: ERR_QUARTER_LOCKED
    http_status: 409
    applies_to: "POST /income-items, PATCH /income-items/{id}, POST /ep-adjustments, POST /ep-adjustments/{id}/post, POST /shareholder-positions"
  - priority: 9
    category: business_referential
    check: "cross-aggregate consistency: IncomeItem.quarter_id must belong to the same reit as IncomeItem.reit_id; EpAdjustment.quarter_id likewise; ShareholderPosition.shareholder_id must belong to the snapshot's reit; AssetSale.asset_holding_id must belong to sale's reit"
    error_id: ERR_CROSS_REIT_REFERENCE
    http_status: 422
    applies_to: "POST /income-items, POST /ep-adjustments, POST /shareholder-positions, POST /asset-sales"
  - priority: 10
    category: business_temporal
    check: "date sanity: Quarter.period_end >= period_start; DividendDeclaration record_date >= declaration_date and payable_date >= record_date; ShareholderSnapshot.snapshot_date must be a half-year last day (Jun 30 or Dec 31 of some year) — half-year rule for the 5/50 look-back"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /quarters, POST /dividend-declarations, POST /shareholder-snapshots"
  - priority: 11
    category: business_temporal
    check: "quarter interval non-overlap: a new Quarter's closed interval [period_start, period_end] MUST NOT intersect any existing Quarter interval of the same reit; adjacency (existing.period_end + 1 day == new.period_start) is allowed; sharing even a single calendar day is a conflict"
    error_id: ERR_QUARTER_OVERLAP
    http_status: 409
    applies_to: "POST /quarters"
  - priority: 12
    category: business_safety
    check: "REIT posture gate: Reit.status == ACTIVE required for dividend create/approve/declare and AssetSale confirm"
    error_id: ERR_REIT_SUSPENDED
    http_status: 409
    applies_to: "POST /dividend-declarations, POST /dividend-declarations/{id}/approve, POST /dividend-declarations/{id}/declare, POST /asset-sales/{id}/confirm"
  - priority: 13
    category: business_safety
    check: "5/50 block: Reit.five_fifty_blocked == true rejects dividend approve/declare with the dedicated concentration error (checked immediately after the posture gate within safety priority)"
    error_id: ERR_FIVE_FIFTY_BLOCKED
    http_status: 409
    applies_to: "POST /dividend-declarations/{id}/approve, POST /dividend-declarations/{id}/declare"
  - priority: 14
    category: business_safety
    check: "segregation of duties: dividend declare rejects X-User-ID == approved_by_director_id; disclosure approve/reject rejects X-User-ID == submitted_by_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dividend-declarations/{id}/declare, POST /compliance-disclosures/{id}/approve, POST /compliance-disclosures/{id}/reject"
  - priority: 15
    category: business_referential
    check: "dividend declare requires a POSTED DistributionRequirement for (reit_id, taxable_year)"
    error_id: ERR_REQUIREMENT_NOT_POSTED
    http_status: 409
    applies_to: "POST /dividend-declarations/{id}/declare"
  - priority: 16
    category: business_fiscal
    check: "OCC: expected_reit_version on POST /ep-adjustments and POST /dividend-declarations must equal current Reit.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ep-adjustments, POST /dividend-declarations"
  - priority: 17
    category: business_fiscal
    check: "DistributionRequirement close precondition: all sibling DividendDeclaration rows for (reit_id, taxable_year) in terminal state {PAID, VOID}"
    error_id: ERR_DECLARATIONS_OPEN
    http_status: 409
    applies_to: "POST /distribution-requirements/{id}/close"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; mandatory default) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ComplianceOfficer, TaxDirector, BoardDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: [advance logical clock only]

  # --- Reit ---
  - method: POST
    path: "/reit-compliance/reits"
    description: "Register a REIT"
    roles: [TaxDirector]
    code: 201
    input: [legal_name, ticker, charter_ownership_limit_pct, taxable_year_start]
    output: Reit
    side_effects: [status := ACTIVE, current_ep_balance_cents := 0, dividend_distribution_deficit_cents := 0, five_fifty_blocked := false]
  - method: GET
    path: "/reit-compliance/reits/{id}"
    description: "Fetch a REIT with computed compliance fields"
    roles: [ComplianceOfficer, TaxDirector, BoardDirector]
    code: 200
    input: []
    output: Reit
    side_effects: []
  - method: GET
    path: "/reit-compliance/reits"
    description: "List REITs (paginated)"
    roles: [ComplianceOfficer, TaxDirector, BoardDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: Reit[]
    side_effects: []
  - method: GET
    path: "/reit-compliance/reits/{id}/ep-balance"
    description: "Computed read: current E&P balance; optional as_of=YYYY-MM-DD selects the frozen year-end variant"
    roles: [ComplianceOfficer, TaxDirector, BoardDirector]
    code: 200
    input: ["as_of?"]
    output: { ep_balance_cents: integer, variant: string }
    side_effects: []
  - method: GET
    path: "/reit-compliance/reits/{id}/dividend-characterization-preview"
    description: "Computed read: preview the characterization of a hypothetical dividend under WATERFALL (default) or PRO_RATA mode"
    roles: [ComplianceOfficer, TaxDirector]
    code: 200
    input: [amount_cents, taxable_year, "mode?"]
    output: { ordinary_cents: integer, capital_gain_cents: integer, return_of_capital_cents: integer, mode: string }
    side_effects: []

  # --- AssetHolding ---
  - method: POST
    path: "/reit-compliance/asset-holdings"
    description: "Register an asset"
    roles: [ComplianceOfficer]
    code: 201
    input: [reit_id, asset_name, asset_class, held_by_trs, is_dealer_inventory, acquisition_date, value_cents]
    output: AssetHolding
    side_effects: [status := HELD]
  - method: GET
    path: "/reit-compliance/asset-holdings/{id}"
    description: "Fetch an asset"
    roles: [ComplianceOfficer, TaxDirector, BoardDirector]
    code: 200
    input: []
    output: AssetHolding
    side_effects: []
  - method: GET
    path: "/reit-compliance/asset-holdings"
    description: "List assets; filterable by reit_id (FK reverse reachability)"
    roles: [ComplianceOfficer, TaxDirector, BoardDirector]
    code: 200
    input: ["reit_id?", "limit?", "offset?"]
    output: AssetHolding[]
    side_effects: []
  - method: PATCH
    path: "/reit-compliance/asset-holdings/{id}"
    description: "Update value_cents / flags while HELD"
    roles: [ComplianceOfficer]
    code: 200
    input: ["value_cents?", "asset_class?", "held_by_trs?", "is_dealer_inventory?"]
    output: AssetHolding
    side_effects: [increments version by 1]

  # --- Quarter ---
  - method: POST
    path: "/reit-compliance/quarters"
    description: "Open a compliance quarter"
    roles: [ComplianceOfficer]
    code: 201
    input: [reit_id, label, period_start, period_end]
    output: Quarter
    side_effects: [status := OPEN]
  - method: GET
    path: "/reit-compliance/quarters/{id}"
    description: "Fetch a quarter"
    roles: [ComplianceOfficer, TaxDirector, BoardDirector]
    code: 200
    input: []
    output: Quarter
    side_effects: []
  - method: GET
    path: "/reit-compliance/quarters"
    description: "List quarters; filterable by reit_id"
    roles: [ComplianceOfficer, TaxDirector, BoardDirector]
    code: 200
    input: ["reit_id?", "limit?", "offset?"]
    output: Quarter[]
    side_effects: []

  # --- IncomeItem ---
  - method: POST
    path: "/reit-compliance/income-items"
    description: "Accrue a gross income item into an OPEN quarter"
    roles: [ComplianceOfficer]
    code: 201
    input: [reit_id, quarter_id, income_class, amount_cents, source_is_trs, accrued_at]
    output: IncomeItem
    side_effects: [recompute Quarter.gross_income_total_cents]
  - method: GET
