  - rule_id: resource_temporal_overlap
    instances:

      - name: carrier_windows_are_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=28]
          - errors[ERR_CARRIER_WINDOW_CONFLICT]
          - entities.Shipment.fields.pickup_window_start
          - entities.Shipment.fields.pickup_window_end
        distinguishing_aspect: |
          Interval semantics on the Carrier resource are HALF-OPEN [start, end): a second
          tender starting exactly when the first ends (12:00:00Z) is accepted, while a
          tender running 11:00 to 13:00 genuinely intersects and is rejected with
          ERR_CARRIER_WINDOW_CONFLICT. Adjacency is not a collision on this axis.
        test_recipe:
          setup:
