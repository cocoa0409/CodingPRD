# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3349_protective_coating_specification_applicator_approval
#
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1–§1.7 NOT already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Sections and claim_type
# values follow references/claim-extraction-guide.md verbatim.
#
# Canonical fixture conventions (used across instances):
#   - The logical clock defaults to 2026-09-01T00:00:00Z; instances that need
#     a specific evaluation time set it explicitly as their first call.
#   - Paths carry the /coating api_prefix verbatim from §1.5.
#   - GET list calls pass declared `?`-suffixed filters (e.g. `limit?`).
#   - Every `${var}` is bound by a `captures:` on an earlier call of the same
#     instance; OCC expected_*_version values are always `${var}` captures.
#   - Roles are exactly the seven of §1.7: PlatformAdmin,
#     TechnicalServiceEngineer, ProjectEngineer, OwnerRepresentative,
#     ApplicatorRep (entity_backed:Applicator), Inspector, ComplianceOfficer.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: coating_system_creation_happy_path_echoes_inputs
        claim_type: creation
        grounds:
          - "entities.CoatingSystem"
          - "endpoints.POST_/coating/coating-systems"
        distinguishing_aspect: "A complete POST body returns 201, echoes every input field verbatim, and stamps system fields (status=ACTIVE, spec_revision=1, version=1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-ECHO-01", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, max_thinner_pct: 0.10, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
              captures:
                cs_id: "$.data.id"
          assert:
            - "HTTP 201"
            - "CoatingSystem.${cs_id}.status == 'ACTIVE'"
            - "CoatingSystem.${cs_id}.spec_revision == 1"
            - "CoatingSystem.${cs_id}.version == 1"
            - "CoatingSystem.${cs_id}.system_code == 'SW-ECHO-01'"
            - "CoatingSystem.${cs_id}.coat_count == 3"
            - "CoatingSystem.${cs_id}.base_voc_gpl == 250"
            - "CoatingSystem.${cs_id}.max_thinner_pct == 0.10"
            - "CoatingSystem.${cs_id}.is_competitor_system == false"
            - "CoatingSystem.${cs_id} carries a server-minted UUID id plus ISO-8601 created_at and updated_at"

      - name: coating_system_creation_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.CoatingSystem.fields.is_competitor_system"
          - "entities.CoatingSystem.fields.max_thinner_pct"
        distinguishing_aspect: "Omitting both optional fields lands the declared defaults is_competitor_system=false and max_thinner_pct=0 — the response proves the server applied them rather than leaving null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-DFLT-01", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP6_COMMERCIAL", min_surface_profile_mils: 1.0, max_surface_profile_mils: 3.0, coat_count: 2, total_dft_min_mils: 6.0, total_dft_max_mils: 10.0, base_voc_gpl: 300, thinner_voc_gpl: 380, adhesion_min_psi: 400 }
              as: TechnicalServiceEngineer
              captures:
                cs_id: "$.data.id"
          assert:
            - "HTTP 201"
            - "CoatingSystem.${cs_id}.is_competitor_system == false"
            - "CoatingSystem.${cs_id}.max_thinner_pct == 0"

      - name: coating_system_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "entities.CoatingSystem.fields.total_dft_min_mils"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input field total_dft_min_mils is a 400 ERR_INVALID_REQUEST — required-field validation, not a default."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-MISS-01", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "No CoatingSystem row persisted (a follow-up GET /coating/coating-systems has total_count == 0)"

      - name: coating_system_creation_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - "entities.CoatingSystem.fields.surface_prep_standard"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "surface_prep_standard outside the four-member SSPC enum is rejected at creation with 400 ERR_INVALID_REQUEST — enum closure enforced on input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-ENUM-01", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP7_BRUSH_OFF", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: coating_system_profile_max_below_min_rejected
        claim_type: type_constraints
        grounds:
          - "entities.CoatingSystem.fields.max_surface_profile_mils"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "max_surface_profile_mils < min_surface_profile_mils violates the declared range constraint (max must be >= min) and is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-PROF-01", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 4.0, max_surface_profile_mils: 2.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: coating_system_not_found_on_get
        claim_type: not_found
        grounds:
          - "endpoints.GET_/coating/coating-systems/{id}"
          - "errors[ERR_COATING_SYSTEM_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent id returns 404 ERR_COATING_SYSTEM_NOT_FOUND, not a generic 404 body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /coating/coating-systems/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP 404 with error_id ERR_COATING_SYSTEM_NOT_FOUND"

      - name: coating_system_list_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.GET_/coating/coating-systems"
          - "response_envelope"
        distinguishing_aspect: "List endpoint honors limit/offset: with 3 rows and limit=2, offset=0 returns 2 items with total_count=3 and has_more=true; offset=2 returns the final item with has_more=false — proving the pagination envelope fields are server-computed, not echoed."
        test_recipe:
          setup: ["three ACTIVE coating systems exist"]
          setup_api_calls:
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-PAGE-1", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-PAGE-2", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-PAGE-3", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
          trigger:
            - call: "GET /coating/coating-systems"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /coating/coating-systems"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "first response: response_type == 'array', exactly 2 data items, total_count == 3, has_more == true"
            - "second response: exactly 1 data item, total_count == 3, has_more == false"
            - "every response carries meta.api_request_id and meta.api_request_timestamp"

      - name: voc_regulation_creation_happy_path
        claim_type: creation
        grounds:
          - "entities.VocRegulation"
          - "endpoints.POST_/coating/voc-regulations"
        distinguishing_aspect: "A valid half-open window POST returns 201 with status=ACTIVE and echoes jurisdiction_code/application_method/voc_limit_gpl/effective bounds; version starts at 1."
        test_recipe:
          setup: ["empty DB", "clock at 2026-09-01"]
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-CA-SCAQMD", application_method: "SPRAY_AIRLESS", voc_limit_gpl: 340, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: ComplianceOfficer
              captures:
                reg_id: "$.data.id"
          assert:
            - "HTTP 201"
            - "VocRegulation.${reg_id}.status == 'ACTIVE'"
            - "VocRegulation.${reg_id}.voc_limit_gpl == 340"
            - "VocRegulation.${reg_id}.application_method == 'SPRAY_AIRLESS'"
            - "VocRegulation.${reg_id}.version == 1"

      - name: voc_regulation_creation_missing_effective_to_rejected
        claim_type: required_fields
        grounds:
          - "entities.VocRegulation.fields.effective_to"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input effective_to on regulation creation is 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-CA-SCAQMD", application_method: "SPRAY_AIRLESS", voc_limit_gpl: 340, effective_from: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: voc_regulation_creation_invalid_application_method_enum
        claim_type: type_constraints
        grounds:
          - "entities.VocRegulation.fields.application_method"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "application_method outside {SPRAY_AIRLESS, SPRAY_CONVENTIONAL, BRUSH_ROLLER} is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-FED", application_method: "DIP", voc_limit_gpl: 450, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: ComplianceOfficer
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: voc_regulation_not_found_on_get
        claim_type: not_found
        grounds:
          - "endpoints.GET_/coating/voc-regulations/{id}"
          - "errors[ERR_VOC_REGULATION_NOT_FOUND]"
        distinguishing_aspect: "GET on a nonexistent regulation id returns 404 ERR_VOC_REGULATION_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /coating/voc-regulations/00000000-0000-4000-8000-0000000000ee"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 404 with error_id ERR_VOC_REGULATION_NOT_FOUND"

      - name: applicator_creation_defaults_score_500_registered
        claim_type: defaults
        grounds:
          - "entities.Applicator.fields.quality_history_score"
          - "entities.Applicator.fields.status"
          - "endpoints.POST_/coating/applicators"
        distinguishing_aspect: "New applicator lands with computed defaults quality_history_score=500, consecutive_passed_inspections=0, status=REGISTERED — the response proves computed-field initialization, not merely an echo of input."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/applicators"
              payload: { company_name: "Acme Coaters LLC", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures:
                app_id: "$.data.id"
          assert:
            - "HTTP 201"
            - "Applicator.${app_id}.quality_history_score == 500"
            - "Applicator.${app_id}.consecutive_passed_inspections == 0"
            - "Applicator.${app_id}.status == 'REGISTERED'"
            - "Applicator.${app_id}.version == 1"

      - name: applicator_creation_missing_contact_email_rejected
        claim_type: required_fields
        grounds:
          - "entities.Applicator.fields.contact_email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting contact_email on applicator registration is 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/applicators"
              payload: { company_name: "No Email Coaters" }
              as: PlatformAdmin
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: applicator_not_found_on_get
        claim_type: not_found
        grounds:
          - "endpoints.GET_/coating/applicators/{id}"
          - "errors[ERR_APPLICATOR_NOT_FOUND]"
        distinguishing_aspect: "GET on nonexistent applicator id returns 404 ERR_APPLICATOR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /coating/applicators/00000000-0000-4000-8000-0000000000dd"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP 404 with error_id ERR_APPLICATOR_NOT_FOUND"

      - name: qualification_program_creation_defaults
        claim_type: defaults
        grounds:
          - "entities.QualificationProgram.fields.min_consecutive_passed_inspections"
          - "entities.QualificationProgram.fields.requires_training"
          - "entities.QualificationProgram.fields.requires_equipment_audit"
        distinguishing_aspect: "Omitting the three optional program fields lands defaults min_consecutive_passed_inspections=3, requires_training=true, requires_equipment_audit=true."
        test_recipe:
          setup: ["one ACTIVE coating system"]
          setup_api_calls:
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-QP-01", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
              captures:
                cs_id: "$.data.id"
          trigger:
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-DFLT-1", coating_system_id: "${cs_id}", min_quality_history_score: 400 }
              as: TechnicalServiceEngineer
              captures:
                prog_id: "$.data.id"
          assert:
            - "HTTP 201"
            - "QualificationProgram.${prog_id}.min_consecutive_passed_inspections == 3"
            - "QualificationProgram.${prog_id}.requires_training == true"
            - "QualificationProgram.${prog_id}.requires_equipment_audit == true"
            - "QualificationProgram.${prog_id}.status == 'ACTIVE'"

      - name: qualification_program_creation_unknown_coating_system_rejected
        claim_type: parent_relationships
        grounds:
          - "entities.QualificationProgram.fields.coating_system_id"
          - "errors[ERR_COATING_SYSTEM_NOT_FOUND]"
        distinguishing_aspect: "coating_system_id referencing a nonexistent system is rejected 404 ERR_COATING_SYSTEM_NOT_FOUND — FK integrity enforced at creation, not lazily at certify time."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-BADFK-1", coating_system_id: "00000000-0000-4000-8000-0000000000aa", min_quality_history_score: 400 }
              as: TechnicalServiceEngineer
          assert:
            - "HTTP 404 with error_id ERR_COATING_SYSTEM_NOT_FOUND"

      - name: applicator_qualification_enrollment_starts_candidate
        claim_type: creation
        grounds:
          - "entities.ApplicatorQualification"
          - "endpoints.POST_/coating/applicators/{applicatorId}/qualifications"
        distinguishing_aspect: "Enrollment returns 201 with status=CANDIDATE, suspension_count=0; the applicator_id is system-bound from the path, not from the payload."
        test_recipe:
          setup: ["one applicator and one ACTIVE program exist"]
          setup_api_calls:
            - call: "POST /coating/applicators"
              payload: { company_name: "Beta Blasters", contact_email: "qa@beta.example" }
              as: PlatformAdmin
              captures:
                app_id: "$.data.id"
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-QP-02", manufacturer_name: "Sherwin-Williams", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
              captures:
                cs_id: "$.data.id"
            - call: "POST /coating/qualification-programs"
              payload: { program_code: "QP-ENR-1", coating_system_id: "${cs_id}", min_quality_history_score: 400 }
              as: TechnicalServiceEngineer
              captures:
                prog_id: "$.data.id"
          trigger:
            - call: "POST /coating/applicators/${app_id}/qualifications"
              payload: { program_id: "${prog_id}", training_completed_at: "2026-08-15T09:00:00Z", equipment_audit_passed: true }
              as: ApplicatorRep
              as_user_id: "${app_id}"
              captures:
                qual_id: "$.data.id"
          assert:
            - "HTTP 201"
            - "ApplicatorQualification.${qual_id}.status == 'CANDIDATE'"
            - "ApplicatorQualification.${qual_id}.suspension_count == 0"
            - "ApplicatorQualification.${qual_id}.applicator_id == ${app_id}"
            - "ApplicatorQualification.${qual_id}.equipment_audit_passed == true"

      - name: applicator_qualification_enrollment_unknown_program_rejected
        claim_type: parent_relationships
        grounds:
          - "entities.ApplicatorQualification.fields.program_id"
          - "errors[ERR_PROGRAM_NOT_FOUND]"
        distinguishing_aspect: "program_id referencing a nonexistent program is rejected 404 ERR_PROGRAM_NOT_FOUND."
        test_recipe:
          setup: ["one applicator exists"]
          setup_api_calls:
            - call: "POST /coating/applicators"
              payload: { company_name: "Gamma Painters", contact_email: "g@gamma.example" }
              as: PlatformAdmin
              captures:
                app_id: "$.data.id"
          trigger:
            - call: "POST /coating/applicators/${app_id}/qualifications"
              payload: { program_id: "00000000-0000-4000-8000-0000000000bb", training_completed_at: "2026-08-15T09:00:00Z", equipment_audit_passed: true }
              as: ApplicatorRep
              as_user_id: "${app_id}"
          assert:
            - "HTTP 404 with error_id ERR_PROGRAM_NOT_FOUND"

      - name: project_creation_starts_planning_zero_exposure
        claim_type: creation
        grounds:
          - "entities.Project"
          - "endpoints.POST_/coating/projects"
        distinguishing_aspect: "Project creation returns 201 with status=PLANNING, computed committed_warranty_exposure_cents=0, version=1; all five input fields echoed."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/projects"
              payload: { project_name: "Harbor Bridge Recoat", owner_name: "Port Authority", jurisdiction_code: "US-CA-SCAQMD", asset_type: "BRIDGE", warranty_budget_cents: 50000000 }
              as: ProjectEngineer
              captures:
                proj_id: "$.data.id"
          assert:
            - "HTTP 201"
            - "Project.${proj_id}.status == 'PLANNING'"
            - "Project.${proj_id}.committed_warranty_exposure_cents == 0"
            - "Project.${proj_id}.asset_type == 'BRIDGE'"
            - "Project.${proj_id}.version == 1"

      - name: project_creation_invalid_asset_type_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Project.fields.asset_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "asset_type outside the five-member enum is 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /coating/projects"
              payload: { project_name: "Bad Asset", owner_name: "Owner", jurisdiction_code: "US-FED", asset_type: "DAM", warranty_budget_cents: 1000000 }
              as: ProjectEngineer
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"

      - name: project_not_found_on_get
        claim_type: not_found
        grounds:
          - "endpoints.GET_/coating/projects/{id}"
          - "errors[ERR_PROJECT_NOT_FOUND]"
        distinguishing_aspect: "GET on nonexistent project id returns 404 ERR_PROJECT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /coating/projects/00000000-0000-4000-8000-0000000000cc"
              payload: {}
              as: ProjectEngineer
          assert:
            - "HTTP 404 with error_id ERR_PROJECT_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: work_order_begin_prep_inspection_from_prep_approved_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.WorkOrder.transitions"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "begin-prep-inspection on a work order already past PREP_INSPECTION (PREP_APPROVED) is not a legal from-state and must fail with 409 ERR_INVALID_STATE — the forward-only prep branch is enforced."
        test_recipe:
          setup:
            - "clock 2026-09-01; regulation US-CA-SCAQMD/SPRAY_AIRLESS limit 340 window [2026-09-01,2027-09-01)"
            - "coating system (SP10, profile 2..4, DFT 9..15, base_voc 250, thinner 420, max_thinner 0.10, adhesion 500)"
            - "applicator + program (min_score 400, streak 0, no training/audit) enrolled and CERTIFIED"
