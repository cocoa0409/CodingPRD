  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: card_activate_requires_household_active
        grounds:
          - state_machines.EBTCard.PENDING_ISSUE_to_ACTIVE
          - validations[priority=7]
          - errors[ERR_HOUSEHOLD_NOT_ACTIVE]
          - entities.Household.fields.status
          - entities.EBTCard.fields.status
        distinguishing_aspect: |
          Cross-entity precondition: EBTCard.activate (entity A=EBTCard)
          requires Household.status=='ACTIVE' (entity B=Household). Pair:
          (EBTCard, Household). After Household is SUSPENDED via fraud flag,
          the still-PENDING_ISSUE card cannot be activated. Different entity
          pair from txn_settle_requires_card_active (PurchaseTransaction,
          EBTCard).
        test_recipe:
          setup:
            - "Clock: 2026-09-15T00:00:00Z"
            - "Household HH (started ACTIVE) now SUSPENDED via SUBSTANTIATED FraudFlag"
            - "EBTCard CARD status PENDING_ISSUE (cards in PENDING_ISSUE are NOT cascaded by Household.suspend per §1.2)"
