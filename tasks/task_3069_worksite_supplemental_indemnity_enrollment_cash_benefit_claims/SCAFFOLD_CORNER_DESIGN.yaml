            - { call: "POST /policy-series", payload: { series_code: "SB2", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { sb2: $.data.id, sb2_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sb2}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "B2", benefit_amount_cents: 500, max_occurrences_per_year: 2, lifetime_max_cents: 10000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schb: $.data.id } }
