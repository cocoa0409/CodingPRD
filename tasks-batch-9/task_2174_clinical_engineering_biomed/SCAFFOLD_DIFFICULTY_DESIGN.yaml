# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml 1.1-1.7. Deleting this file changes no
# declared behaviour; it only makes coverage harder to audit.
# Logical clock default: 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pm_compliance_strict_vs_operational_denominator_diverges
        grounds:
          - calculations.pm_compliance_rate
          - entities.Facility.fields.pm_compliance_pct_strict
          - entities.Facility.fields.pm_compliance_pct_operational
          - entities.PMTask.fields.deferral_count
          - state_machines.PMTask.SCHEDULED_to_MISSED
        distinguishing_aspect: |
          Dual variant on the FACILITY / preventive-maintenance domain: the same three PM
          tasks yield pm_compliance_pct_strict == 33.33 and pm_compliance_pct_operational
          == 50.00 in one audit response, because the once-deferred task enters the strict
          denominator but is forgiven by the operational denominator.
        test_recipe:
          setup:
            - "One facility with pm_compliance_target_pct 90.00 and one CRITICAL infusion pump."
            - "Three PM tasks on that pump, all with original_due_at at or before the audit clock."
            - "Task A completed inside its window and on time; task B never touched; task C deferred exactly once into a future window."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-4100", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "Medtronic", model_number: "IVS-9000", device_family: "INFUSION_PUMP", expected_life_years: 8, replacement_cost_cents: 3200000, is_network_connected: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m1_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m1_id}", serial_number: "SN-1001", acquisition_date: "2019-03-01", acquisition_cost_cents: 3000000, function_code: 9, physical_risk_code: 4, maintenance_requirement_code: 3, lot_number: "LOT-A7", condition_score: 3, utilization_hours: 12000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev1_id: $.data.id }
            - call: "POST /clinical-engineering/pm-tasks"
              payload: { device_id: "${dev1_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T23:59:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { ta_id: $.data.id }
            - call: "POST /clinical-engineering/pm-tasks"
              payload: { device_id: "${dev1_id}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T23:59:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { tb_id: $.data.id }
            - call: "POST /clinical-engineering/pm-tasks"
              payload: { device_id: "${dev1_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-03T23:59:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { tc_id: $.data.id }
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T10:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/pm-tasks/${ta_id}/complete"
              payload: { result: "PASS", labor_minutes: 45 }
              as: BiomedTech
              as_user_id: "tech-alpha"
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/pm-tasks/${tc_id}/defer"
              payload: { new_window_start: "2026-08-20T00:00:00Z", new_window_end: "2026-08-20T23:59:00Z", reason: "Vendor parts backorder" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
          trigger:
            - call: "POST /clinical-engineering/facilities/${f_id}/pm-audit"
              payload: {}
              as: CEManager
              as_user_id: "ce-mgr-01"
          assert:
            - "Facility.${f_id}.pm_compliance_pct_strict == 33.33"
            - "Facility.${f_id}.pm_compliance_pct_operational == 50.00"
            - "PMTask.${tb_id}.status == MISSED"
            - "PMTask.${tc_id}.status == DEFERRED"
            - "PMTask.${tc_id}.deferral_count == 1"
            - "PMTask.${ta_id}.on_time == true"
            - "Facility.${f_id}.ce_posture == HEIGHTENED"
            - "Facility.${f_id}.pm_audit_index == 1"

      - name: work_order_estimate_vs_contract_adjusted_final_cost
        grounds:
          - calculations.work_order_service_cost
          - calculations.contract_selection
          - entities.WorkOrder.fields.estimated_cost_cents
          - entities.WorkOrder.fields.final_cost_cents
          - entities.ServiceContract.fields.covered_events_used
          - state_machines.WorkOrder.VERIFIED_to_CLOSED
        distinguishing_aspect: |
          Dual variant on the WORK-ORDER / cost-accounting domain (a different entity
          domain from the facility PM-compliance variant): identical labour, parts and
          travel inputs yield estimated_cost_cents == 82938 at complete-repair and
          final_cost_cents == 25000 at close, because the covering ServiceContract
          replaces the whole list-rate figure with its flat deductible.
        test_recipe:
          setup:
            - "Vendor BioServe with hourly_rate_cents 18500 and travel_flat_cents 24000, approved."
            - "An ACTIVE contract on the pump model with deductible_cents 25000 and covered_event_cap 2, covering all of 2026."
            - "A vendor-mode work order started after hours (21:00 UTC) with 95 labour minutes and 15000 cents of parts, already verified by a second technician."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-4100", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "Medtronic", model_number: "IVS-9000", device_family: "INFUSION_PUMP", expected_life_years: 8, replacement_cost_cents: 3200000, is_network_connected: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m1_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m1_id}", serial_number: "SN-1001", acquisition_date: "2019-03-01", acquisition_cost_cents: 3000000, function_code: 9, physical_risk_code: 4, maintenance_requirement_code: 3, lot_number: "LOT-A7", condition_score: 3, utilization_hours: 12000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev1_id: $.data.id }
            - call: "POST /clinical-engineering/vendors"
              payload: { name: "BioServe Inc", vendor_code: "BSV", hourly_rate_cents: 18500, travel_flat_cents: 24000, security_attestation_on_file: true, is_approved: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { v1_id: $.data.id }
            - call: "POST /clinical-engineering/service-contracts"
              payload: { vendor_id: "${v1_id}", device_model_id: "${m1_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", annual_premium_cents: 1200000, deductible_cents: 25000, covered_event_cap: 2 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { sc1_id: $.data.id }
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T20:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders"
              payload: { device_id: "${dev1_id}", reported_severity: "CLINICAL_IMPACT", problem_summary: "Occlusion alarm will not clear" }
              as: DeptSteward
              as_user_id: "${dept_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T21:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders/${wo_id}/assign"
              payload: { service_mode: "VENDOR", vendor_id: "${v1_id}" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T22:35:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders/${wo_id}/complete-repair"
              payload: { labor_minutes: 95, parts_cost_cents: 15000 }
              as: VendorRep
              as_user_id: "${v1_id}"
            - call: "POST /clinical-engineering/work-orders/${wo_id}/verify"
              payload: { result: "PASS" }
              as: BiomedTech
              as_user_id: "tech-bravo"
            - call: "GET /clinical-engineering/departments/${dept_id}"
              payload: {}
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_v: $.data.version }
          trigger:
            - call: "POST /clinical-engineering/work-orders/${wo_id}/close"
              payload: { expected_department_version: "${dept_v}" }
              as: CEManager
              as_user_id: "ce-mgr-01"
          assert:
            - "WorkOrder.${wo_id}.shift_multiplier_applied == 1.5"
            - "WorkOrder.${wo_id}.estimated_cost_cents == 82938"
            - "WorkOrder.${wo_id}.final_cost_cents == 25000"
            - "WorkOrder.${wo_id}.service_contract_id == ${sc1_id}"
            - "ServiceContract.${sc1_id}.covered_events_used == 1"
            - "ServiceContract.${sc1_id}.status == ACTIVE"
            - "WorkOrder.${wo_id}.department_charge_cents == 25000"
            - "Department.${dept_id}.downtime_spend_cents == 25000"
            - "WorkOrder.${wo_id}.estimated_cost_cents != WorkOrder.${wo_id}.final_cost_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: loaner_rental_rounds_each_day_before_summing
        grounds:
          - calculations.loaner_rental_cost
          - entities.LoanerAssignment.fields.rental_cost_cents
          - entities.LoanerAssignment.fields.billable_days
          - state_machines.LoanerAssignment.DEPLOYED_to_RETURNED
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the cents. A 10-day RENTAL against
          a CRITICAL downed unit is 295037 cents when each day is rounded before summation
          (the pinned order) and 295038 cents when the exact per-day rationals are summed
          and rounded once, so the two orders are distinguishable by a single assertion.
        test_recipe:
          setup:
            - "A CRITICAL infusion pump taken down by an in-house work order."
            - "An external RENTAL loaner deployed 2026-08-01T00:00:00Z through 2026-08-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-4100", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "Medtronic", model_number: "IVS-9000", device_family: "INFUSION_PUMP", expected_life_years: 8, replacement_cost_cents: 3200000, is_network_connected: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m1_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m1_id}", serial_number: "SN-1001", acquisition_date: "2019-03-01", acquisition_cost_cents: 3000000, function_code: 9, physical_risk_code: 4, maintenance_requirement_code: 3, lot_number: "LOT-A7", condition_score: 3, utilization_hours: 12000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev1_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders"
              payload: { device_id: "${dev1_id}", reported_severity: "ROUTINE", problem_summary: "Display flicker under load" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { wo_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders/${wo_id}/assign"
              payload: { service_mode: "IN_HOUSE" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { wo_v: $.data.version }
            - call: "POST /clinical-engineering/loaner-assignments"
              payload: { work_order_id: "${wo_id}", source: "RENTAL", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-11T00:00:00Z", expected_work_order_version: "${wo_v}" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { la_id: $.data.id }
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
          trigger:
            - call: "POST /clinical-engineering/loaner-assignments/${la_id}/return"
              payload: {}
              as: CEManager
              as_user_id: "ce-mgr-01"
          assert:
            - "LoanerAssignment.${la_id}.status == RETURNED"
            - "LoanerAssignment.${la_id}.billable_days == 10"
            - "LoanerAssignment.${la_id}.rental_cost_cents == 295037"
            - "LoanerAssignment.${la_id}.rental_cost_cents != 295038"
            - "Device.${dev1_id}.risk_class == CRITICAL"

      - name: department_overhead_tier_keyed_on_pre_debit_spend
        grounds:
          - calculations.department_downtime_debit
          - entities.Department.fields.downtime_spend_cents
          - entities.WorkOrder.fields.department_charge_cents
          - state_machines.WorkOrder.VERIFIED_to_CLOSED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: the overhead
          tier depends on department spend and the spend depends on the overhead-scaled charge.
          With a 1000000-cent budget and a pre-debit spend of exactly 500000 (50.00%), tier T1
          applies, so a 9000-cent repair posts 9450 and the spend lands on 509450 — the value a
          post-debit tier reading (which would still be T1 here) and a fixed-point iteration
          cannot both reproduce, because the FIRST close must be tiered at T0 and post 500000.
        test_recipe:
          setup:
            - "A department with downtime_budget_cents 1000000 and no prior spend."
            - "A first in-house repair worth exactly 500000 cents closed under tier T0."
            - "A second in-house repair worth exactly 9000 cents, verified and ready to close."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-4100", downtime_budget_cents: 1000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "Medtronic", model_number: "IVS-9000", device_family: "INFUSION_PUMP", expected_life_years: 8, replacement_cost_cents: 3200000, is_network_connected: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m1_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m1_id}", serial_number: "SN-1001", acquisition_date: "2019-03-01", acquisition_cost_cents: 3000000, function_code: 9, physical_risk_code: 4, maintenance_requirement_code: 3, condition_score: 3 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev1_id: $.data.id }
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders"
              payload: { device_id: "${dev1_id}", reported_severity: "ROUTINE", problem_summary: "Annual calibration drift" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { wo1_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders/${wo1_id}/assign"
              payload: { service_mode: "IN_HOUSE" }
              as: BiomedTech
              as_user_id: "tech-alpha"
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders/${wo1_id}/complete-repair"
              payload: { labor_minutes: 1000, parts_cost_cents: 350000 }
              as: BiomedTech
              as_user_id: "tech-alpha"
            - call: "POST /clinical-engineering/work-orders/${wo1_id}/verify"
              payload: { result: "PASS" }
              as: BiomedTech
              as_user_id: "tech-bravo"
            - call: "GET /clinical-engineering/departments/${dept_id}"
              payload: {}
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_v1: $.data.version }
            - call: "POST /clinical-engineering/work-orders/${wo1_id}/close"
              payload: { expected_department_version: "${dept_v1}" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders"
              payload: { device_id: "${dev1_id}", reported_severity: "ROUTINE", problem_summary: "Battery pack replacement" }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { wo2_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders/${wo2_id}/assign"
              payload: { service_mode: "IN_HOUSE" }
              as: BiomedTech
              as_user_id: "tech-alpha"
            - call: "POST /clinical-engineering/work-orders/${wo2_id}/complete-repair"
              payload: { labor_minutes: 60, parts_cost_cents: 0 }
              as: BiomedTech
              as_user_id: "tech-alpha"
            - call: "POST /clinical-engineering/work-orders/${wo2_id}/verify"
              payload: { result: "PASS" }
              as: BiomedTech
              as_user_id: "tech-bravo"
            - call: "GET /clinical-engineering/departments/${dept_id}"
              payload: {}
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_v2: $.data.version }
          trigger:
            - call: "POST /clinical-engineering/work-orders/${wo2_id}/close"
              payload: { expected_department_version: "${dept_v2}" }
              as: CEManager
              as_user_id: "ce-mgr-01"
          assert:
            - "WorkOrder.${wo1_id}.department_charge_cents == 500000"
            - "WorkOrder.${wo2_id}.final_cost_cents == 9000"
            - "WorkOrder.${wo2_id}.department_charge_cents == 9450"
            - "Department.${dept_id}.downtime_spend_cents == 509450"
            - "Department.${dept_id}.budget_state == OPEN"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: work_order_verify_fail_returns_order_to_in_repair_cycle
        grounds:
          - state_machines.WorkOrder.REPAIR_COMPLETE_to_IN_REPAIR
          - state_machines.WorkOrder.IN_REPAIR_to_REPAIR_COMPLETE
          - entities.WorkOrder.fields.verify_fail_count
          - entities.WorkOrder.fields.labor_minutes
          - calculations.work_order_service_cost
        distinguishing_aspect: |
          Non-linear shape #1 — a CYCLE on WorkOrder: REPAIR_COMPLETE -> IN_REPAIR ->
          REPAIR_COMPLETE. The second pass proves the loop is real by accumulating
          labour (60 + 40 = 100 minutes -> estimated_cost_cents 15000) while
          shift_multiplier_applied stays pinned at 1.0 from the original assign.
        test_recipe:
          setup:
            - "One in-house work order assigned at 09:00 UTC (day shift) and completed once with 60 labour minutes."
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-4100", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "Medtronic", model_number: "IVS-9000", device_family: "INFUSION_PUMP", expected_life_years: 8, replacement_cost_cents: 3200000, is_network_connected: true }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m1_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m1_id}", serial_number: "SN-1001", acquisition_date: "2019-03-01", acquisition_cost_cents: 3000000, function_code: 9, physical_risk_code: 4, maintenance_requirement_code: 3, condition_score: 3 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev1_id: $.data.id }
            - call: "POST /clinical-engineering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "POST /clinical-engineering/work-orders"
