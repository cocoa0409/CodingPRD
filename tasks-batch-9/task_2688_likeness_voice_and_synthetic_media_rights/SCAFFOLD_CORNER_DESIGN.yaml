      - name: escalation_and_estate_verification_each_demand_a_second_pair_of_hands
        claim_type: segregation_of_duties
        grounds: [validations.priority_28, errors.ERR_SEGREGATION_OF_DUTIES, complexity_profile.role_model]
        distinguishing_aspect: >-
          Both duty-segregation rungs are exercised in one recipe against a single stamped id:
          verifying an estate authority you yourself filed, and escalating a case you yourself
          triaged. Because X-User-ID is opaque for the office roles, the second leg is a
          RightsAdministrator reusing the officer's user id — the check is on the id recorded in the
          row, not on the role name, and a role-only implementation passes it wrongly.
        test_recipe:
          setup:
            - "CA profile; a DECEASED talent whose estate authority was filed by ra-001"
            - "A LIVING talent with a case triaged by co-001 at severity 0.8950 (confidence 1.000, 10000000 views), so the escalation floor is satisfied and only the duty check can bite"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
