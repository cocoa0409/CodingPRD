        distinguishing_aspect: "Two strictly sequential deposits carrying the same captured version: first succeeds and bumps EscrowFile.version; second is rejected 412 ERR_STALE_VERSION — deterministic OCC, no wall-clock dependence."
        test_recipe:
          setup: ["CLEARED file; version captured once"]
