      - name: award_cascade_four_levels_bid_to_branch_ready
        grounds:
          - state_machines.Institution.EVALUATED_to_AWARDED
          - state_machines.Bid.CONFORMING_to_REJECTED
          - state_machines.DepositAccount.transition_status_PENDING_to_TRANSFERRED
          - state_machines.BranchReopening.PLANNED_to_READY
        distinguishing_aspect: |
          Depth 4, triggered by a DIFFERENT transition on a different entity than the certify chain:
          Institution.least_cost_status EVALUATED -> AWARDED. Transitivity again, not fan-out:
          L1 names a WINNER; L2 exists only because a WINNER now exists (the losing bid is REJECTED);
          L3 exists only because L1/L2 pinned resolution_method to a P&A structure (determined,
          hold-free accounts flip to TRANSFERRED); L4 exists only because at least one account reached
          TRANSFERRED (the planned branch becomes READY). The branch is never READY on its own.
        test_recipe:
          setup:
            - "Institution 34572 (book 25000000, estimated_liquidation_recovery_cents 18000000, total_deposit_balance_cents 29000001) is CLOSED_IN_RECEIVERSHIP with franchise marketing OPEN and bid_deadline_at 2026-09-30T00:00:00Z."
            - "Depositor Gita's determination is CERTIFIED (insured 25000000, uninsured 4000001); she has ACKNOWLEDGED the notice and both holds have been released, so both accounts are DETERMINED / RELEASED / transition_status PENDING."
