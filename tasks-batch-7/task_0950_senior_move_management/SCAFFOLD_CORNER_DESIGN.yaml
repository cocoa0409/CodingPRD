scaffold_corner_design:

  - section: entities
    instances:
      - name: client_create_mints_system_fields_and_zero_engagement_count
        claim_type: Creation
        grounds: ['entities.Client', 'endpoints["POST /clients"]']
        distinguishing_aspect: "A created Client returns a server-minted UUID id with no type prefix, created_at, updated_at, version 1 and engagement_count 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142", email: "ada@example.com" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
          assert:
            - "the response status is 201"
            - "Client.${cl}.version == 1"
            - "Client.${cl}.engagement_count == 0"
            - "Client.${cl}.full_name == Ada Whitfield"
            - "Client.${cl}.id contains no type prefix and parses as a UUID"

      - name: engagement_create_seeds_six_milestones_and_one_draft_invoice
        claim_type: Creation
        grounds: ['entities.Engagement', 'entities.Milestone', 'entities.Invoice', 'endpoints["POST /engagements"]']
        distinguishing_aspect: "Creating an engagement seeds exactly six Milestone rows with sequence_index 1..6, the first IN_PROGRESS and the rest PENDING, plus exactly one Invoice in DRAFT."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "GET /milestones"
              payload: { engagement_id: "${eng}" }
              as: MOVE_MANAGER
              captures: { ms1: "$.data[0].id", ms6: "$.data[5].id" }
            - call: "GET /invoices"
              payload: { engagement_id: "${eng}" }
              as: BILLING_ADMIN
              captures: { inv: "$.data[0].id" }
          assert:
            - "GET /milestones filtered by engagement_id returns total_count == 6"
            - "Milestone.${ms1}.milestone_key == ASSESSMENT and sequence_index == 1 and status == IN_PROGRESS"
            - "Milestone.${ms6}.milestone_key == CLOSE_OUT and sequence_index == 6 and status == PENDING"
            - "GET /invoices filtered by engagement_id returns total_count == 1"
            - "Invoice.${inv}.status == DRAFT and subtotal_cents == 0 and total_cents == 0"
            - "Engagement.${eng}.status == ACTIVE and phase == ASSESSMENT"
            - "Client.${cl}.engagement_count == 1"

      - name: engagement_computed_move_freeze_at_and_milestone_due_dates
        claim_type: Computed Fields
        grounds: ['calculations.move_day_freeze_at', 'calculations.milestone_due_on', 'entities.Engagement.fields.move_freeze_at_utc']
        distinguishing_aspect: "move_freeze_at_utc is scheduled_move_start_utc minus 72 hours and the six milestone due_on dates are the pinned day offsets from 2026-06-15."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "GET /milestones"
              payload: { engagement_id: "${eng}" }
              as: MOVE_MANAGER
              captures: { ms1: "$.data[0].id", ms2: "$.data[1].id", ms3: "$.data[2].id", ms4: "$.data[3].id", ms5: "$.data[4].id", ms6: "$.data[5].id" }
          assert:
            - "Engagement.${eng}.move_freeze_at_utc == 2026-06-12T14:00:00.000Z"
            - "Milestone.${ms1}.due_on == 2026-05-11"
            - "Milestone.${ms2}.due_on == 2026-05-25"
            - "Milestone.${ms3}.due_on == 2026-06-12"
            - "Milestone.${ms4}.due_on == 2026-06-15"
            - "Milestone.${ms5}.due_on == 2026-06-22"
            - "Milestone.${ms6}.due_on == 2026-07-06"

      - name: package_engagement_create_appends_package_base_line
        claim_type: Creation
        grounds: ['calculations.package_base_charge', 'entities.InvoiceLine.fields.line_type', 'endpoints["POST /engagements"]']
        distinguishing_aspect: "A PACKAGE engagement at tier STUDIO appends exactly one PACKAGE_BASE InvoiceLine of 185000 at creation, whereas an HOURLY engagement appends none."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "PACKAGE", package_tier: "STUDIO", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "GET /invoices"
              payload: { engagement_id: "${eng}" }
              as: BILLING_ADMIN
              captures: { inv: "$.data[0].id" }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BILLING_ADMIN
              captures: { ln: "$.data[0].id" }
          assert:
            - "GET /invoice-lines filtered by invoice_id returns total_count == 1"
            - "InvoiceLine.${ln}.line_type == PACKAGE_BASE"
            - "InvoiceLine.${ln}.amount_cents == 185000"
            - "Invoice.${inv}.subtotal_cents == 185000"
            - "Engagement.${eng}.package_tier == STUDIO"

      - name: portal_party_defaults_cannot_approve_until_authority_active
        claim_type: Defaults
        grounds: ['entities.PortalParty.fields.can_approve_dispositions', 'entities.PortalParty.fields.active_authority_ceiling_cents']
        distinguishing_aspect: "A freshly created POA portal party has can_approve_dispositions false and active_authority_ceiling_cents 0 until an AuthorityRecord reaches ACTIVE."
        test_recipe:
          setup: ["One HOURLY engagement exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
          trigger:
            - call: "POST /portal-parties"
              payload: { engagement_id: "${eng}", party_type: "POA", display_name: "Ruth Whitfield", email: "ruth@example.com" }
              as: MOVE_MANAGER
              captures: { ppoa: "$.data.id" }
          assert:
            - "PortalParty.${ppoa}.can_approve_dispositions == false"
            - "PortalParty.${ppoa}.active_authority_ceiling_cents == 0"
            - "PortalParty.${ppoa}.client_id == null"
            - "PortalParty.${ppoa}.version == 1"

      - name: authority_record_default_ceiling_and_pending_status
        claim_type: Defaults
        grounds: ['entities.AuthorityRecord.fields.approval_ceiling_cents', 'entities.AuthorityRecord.fields.status', 'calculations.authority_approval_ceiling_check']
        distinguishing_aspect: "Omitting approval_ceiling_cents applies AUTHORITY_DEFAULT_CEILING_CENTS 100000 and the record is created in status PENDING, not ACTIVE."
        test_recipe:
          setup: ["One engagement with a POA portal party."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /portal-parties"
              payload: { engagement_id: "${eng}", party_type: "POA", display_name: "Ruth Whitfield", email: "ruth@example.com" }
              as: MOVE_MANAGER
              captures: { ppoa: "$.data.id" }
          trigger:
            - call: "POST /authority-records"
              payload: { engagement_id: "${eng}", holder_party_id: "${ppoa}", authority_scope: "FULL", effective_from_utc: "2026-05-01T00:00:00.000Z", effective_to_utc: "2026-12-31T00:00:00.000Z" }
              as: MOVE_MANAGER
              captures: { auth: "$.data.id" }
          assert:
            - "AuthorityRecord.${auth}.approval_ceiling_cents == 100000"
            - "AuthorityRecord.${auth}.status == PENDING"
            - "AuthorityRecord.${auth}.suspend_count == 0"
            - "PortalParty.${ppoa}.can_approve_dispositions == false"

      - name: destination_room_create_computes_provisional_capacity_and_zero_load
        claim_type: Computed Fields
        grounds: ['calculations.room_effective_capacity', 'calculations.room_load_and_headroom', 'entities.DestinationResidence.fields.room_count']
        distinguishing_aspect: "A room created under a DRAFT placement reports effective_capacity_linear_inches 192.00 (0.80 derate, addendum ignored), keep_load 0.00 and headroom 192.00, and bumps the residence room_count to 1."
        test_recipe:
          setup: ["One engagement with a destination residence in placement_status DRAFT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "POST /destination-residences"
              payload: { engagement_id: "${eng}", name: "Maple Grove 12B", unit_type: "APARTMENT", address_line: "12B Maple Grove Way" }
              as: MOVE_MANAGER
              captures: { res: "$.data.id" }
          trigger:
            - call: "POST /destination-rooms"
              payload: { destination_residence_id: "${res}", room_type: "LIVING", nominal_linear_inches: 240, nominal_volume_cft: 400, approved_addendum_linear_inches: 36 }
              as: MOVE_MANAGER
              captures: { room: "$.data.id" }
          assert:
            - "DestinationRoom.${room}.effective_capacity_linear_inches == 192.00"
            - "DestinationRoom.${room}.keep_load_linear_inches == 0.00"
            - "DestinationRoom.${room}.headroom_linear_inches == 192.00"
            - "DestinationRoom.${room}.assigned_item_count == 0"
            - "DestinationResidence.${res}.room_count == 1"
            - "DestinationResidence.${res}.placement_status == DRAFT"
            - "DestinationResidence.${res}.total_effective_capacity_linear_inches == 192.00"

      - name: inventory_item_create_defaults_undecided_at_origin_and_none_appraisal
        claim_type: Defaults
        grounds: ['entities.InventoryItem.fields.disposition', 'entities.InventoryItem.fields.handling_state', 'entities.InventoryItem.fields.appraisal_source']
        distinguishing_aspect: "An item created without appraisal fields defaults to disposition UNDECIDED, handling_state AT_ORIGIN, appraisal_source NONE, appraised_value_cents 0, hold_state NONE and disposition_locked false."
        test_recipe:
          setup: ["One HOURLY engagement in phase ASSESSMENT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
          trigger:
            - call: "POST /inventory-items"
              payload: { engagement_id: "${eng}", label: "Walnut sideboard", category: "FURNITURE", footprint_linear_inches: 96, volume_cft: 40 }
              as: MOVE_MANAGER
              captures: { it1: "$.data.id" }
          assert:
            - "InventoryItem.${it1}.disposition == UNDECIDED"
            - "InventoryItem.${it1}.handling_state == AT_ORIGIN"
            - "InventoryItem.${it1}.appraisal_source == NONE"
            - "InventoryItem.${it1}.appraised_value_cents == 0"
            - "InventoryItem.${it1}.hold_state == NONE"
            - "InventoryItem.${it1}.disposition_locked == false"
            - "InventoryItem.${it1}.redesignation_count == 0"
            - "Engagement.${eng}.inventory_item_count == 1"
            - "Engagement.${eng}.total_inventory_volume_cft == 40.00"

      - name: crew_member_hourly_rate_defaults_to_role_constant
        claim_type: Defaults
        grounds: ['entities.CrewMember.fields.hourly_rate_cents', 'calculations.crew_assignment_labor_cents']
        distinguishing_aspect: "Omitting hourly_rate_cents for a PACKER stores RATE_PACKER_CENTS_PER_HOUR 6800, and for an ORGANIZER stores 8200."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /crew-members"
              payload: { full_name: "Nina Ortiz", crew_role: "PACKER" }
              as: PLATFORM_ADMIN
              captures: { cmp: "$.data.id" }
            - call: "POST /crew-members"
              payload: { full_name: "Sal Ibarra", crew_role: "ORGANIZER" }
              as: PLATFORM_ADMIN
              captures: { cmo: "$.data.id" }
          assert:
            - "CrewMember.${cmp}.hourly_rate_cents == 6800"
            - "CrewMember.${cmo}.hourly_rate_cents == 8200"
            - "CrewMember.${cmp}.assignment_count == 0"

      - name: vendor_create_defaults_capacity_and_holdback
        claim_type: Defaults
        grounds: ['entities.Vendor.fields.daily_capacity', 'entities.Vendor.fields.holdback_pct', 'calculations.vendor_payout']
        distinguishing_aspect: "Omitting daily_capacity and holdback_pct stores VENDOR_DAILY_CAPACITY_DEFAULT 3 and VENDOR_HOLDBACK_PCT_DEFAULT 0.10."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /vendors"
              payload: { name: "Northside Junk Haul", vendor_type: "JUNK_HAUL", coi_expires_on: "2027-01-31" }
              as: PLATFORM_ADMIN
              captures: { vend: "$.data.id" }
          assert:
            - "Vendor.${vend}.daily_capacity == 3"
            - "Vendor.${vend}.holdback_pct == 0.10"
            - "Vendor.${vend}.coi_renewal_count == 0"
            - "Vendor.${vend}.blocked_assignment_count == 0"

      - name: invoice_line_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds: ['entities.InvoiceLine', 'endpoints["POST /invoice-lines"]', 'endpoints["GET /invoice-lines/{id}"]']
        distinguishing_aspect: "InvoiceLine declares common_fields false, so a read exposes id and created_at but no version and no updated_at, and no endpoint in the whole surface updates or deletes a line."
        test_recipe:
          setup: ["One PACKAGE engagement whose DRAFT invoice already carries the PACKAGE_BASE line."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "PACKAGE", package_tier: "STUDIO", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "GET /invoices"
              payload: { engagement_id: "${eng}" }
              as: BILLING_ADMIN
              captures: { inv: "$.data[0].id" }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BILLING_ADMIN
              captures: { ln: "$.data[0].id" }
          trigger:
            - call: "GET /invoice-lines/${ln}"
              payload: {}
              as: BILLING_ADMIN
          assert:
            - "the response data has no `version` key and no `updated_at` key"
            - "InvoiceLine.${ln}.created_by_role == SYSTEM"
            - "InvoiceLine.${ln}.source_consignment_lot_id == null"
            - "no PUT, PATCH or DELETE endpoint for /invoice-lines exists in the API surface"

      - name: punch_list_item_create_computes_severity_sla_due_at
        claim_type: Computed Fields
        grounds: ['calculations.punch_sla_due_at', 'entities.PunchListItem.fields.due_at_utc']
        distinguishing_aspect: "A MAJOR punch item created at 2026-06-20T10:00:00.000Z gets due_at_utc 2026-06-23T10:00:00.000Z (PUNCH_SLA_HOURS_MAJOR 72) and breached_sla false."
        test_recipe:
          setup: ["An engagement whose settle-in phase has been reached is NOT required; the punch-list phase gate is exercised separately at rung 31."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { eng: "$.data.id" }
            - call: "GET /milestones"
              payload: { engagement_id: "${eng}" }
              as: MOVE_MANAGER
              captures: { m1: "$.data[0].id", m2: "$.data[1].id", m3: "$.data[2].id", m4: "$.data[3].id" }
            - call: "POST /portal-parties"
              payload: { engagement_id: "${eng}", party_type: "CLIENT", display_name: "Ada Whitfield", email: "ada@example.com", client_id: "${cl}" }
              as: MOVE_MANAGER
              captures: { pc: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00.000Z" }
              as: MOVE_MANAGER
          trigger:
            - call: "POST /punch-list-items"
              payload: { engagement_id: "${eng}", description: "Scratched dresser top", severity: "MAJOR" }
              as: MOVE_MANAGER
              captures: { pli: "$.data.id", plierr: "$.data.error_id" }
          assert:
            - "when the engagement phase gate permits the write, PunchListItem.${pli}.due_at_utc == 2026-06-23T10:00:00.000Z"
            - "PunchListItem.${pli}.status == OPEN"
            - "PunchListItem.${pli}.breached_sla == false"
            - "PunchListItem.${pli}.reopen_count == 0"
            - "when the engagement is still in phase ASSESSMENT the call instead responds 409 with ${plierr} == ERR_PHASE_NOT_PERMITTED, which is the rung-31 claim"

      - name: engagement_list_honours_limit_offset_and_total_count
        claim_type: Listing
        grounds: ['endpoints["GET /engagements"]', 'response_envelope.pagination_defaults', 'validations[priority=7]']
        distinguishing_aspect: "With three engagements for one client, GET /engagements with limit 2 and offset 0 returns 2 rows, total_count 3 and has_more true; offset 2 returns 1 row and has_more false."
        test_recipe:
          setup: ["One Client with three engagements."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00.000Z" }
              as: MOVE_MANAGER
            - call: "POST /clients"
              payload: { full_name: "Ada Whitfield", phone: "+1-555-0142" }
              as: MOVE_MANAGER
              captures: { cl: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "STUDIO", scheduled_move_start_utc: "2026-06-15T14:00:00.000Z", mileage_miles: 22, origin_stairs_flights: 2, origin_long_carry_feet: 100 }
              as: MOVE_MANAGER
              captures: { e1: "$.data.id" }
            - call: "POST /engagements"
              payload: { client_id: "${cl}", billing_mode: "HOURLY", home_tier: "ONE_BED", scheduled_move_start_utc: "2026-07-15T14:00:00.000Z", mileage_miles: 30, origin_stairs_flights: 0, origin_long_carry_feet: 20 }
              as: MOVE_MANAGER
