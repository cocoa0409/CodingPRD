              captures: { bk_ok: $.data.id }
          assert:
            - "first trigger response $.data.error_id == ERR_TALENT_UNBOOKABLE (LIMITED at exactly 50.00 >= 40.00 may not book PREMIUM)"
            - "second trigger succeeds: Booking.${bk_ok}.status == BOOKED (LIMITED may book HOUSE_SHOW)"

      - name: clearance_two_recommending_evaluations_exact_boundary
        grounds:
          - validations[priority=7]
          - state_machines.MedicalCase.OPEN_to_CLEARED
        distinguishing_aspect: |
          Empty/count boundary on a different metric via a different endpoint
          (POST /touring/medical-cases/{id}/clearances): exactly 1 recommending
          evaluation fails (count boundary), exactly 2 from distinct evaluators
          succeeds — the zero/one/two distinction is the metric, not a numeric
          threshold.
        test_recipe:
          setup:
            - "Talent T with OPEN MedicalCase MC; one recommending evaluation by medic-m1 exists"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Hurt Holly", legal_name: "Holly Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/medical-cases"
              payload: { talent_id: "${t_id}", severity: "MAJOR" }
              as: Medic
              captures: { mc_id: $.data.id }
            - call: "POST /touring/medical-cases/${mc_id}/evaluations"
              payload: { evaluator_id: "medic-m1", findings: "clearing", recommends_clearance: true }
              as: Medic
          trigger:
            - call: "POST /touring/medical-cases/${mc_id}/clearances"
              payload: { cleared_by: "medic-m2" }
              as: Medic
              captures: { err_one: $.data.error_id }
            - call: "POST /touring/medical-cases/${mc_id}/evaluations"
              payload: { evaluator_id: "medic-m3", findings: "second opinion, clearing", recommends_clearance: true }
              as: Medic
            - call: "POST /touring/medical-cases/${mc_id}/clearances"
              payload: { cleared_by: "medic-m2" }
              as: Medic
              captures: { clr_id: $.data.id }
          assert:
            - "first clearance response $.data.error_id == ERR_CLEARANCE_PROTOCOL_VIOLATION (1 < 2 recommending evaluations)"
            - "second clearance succeeds: MedicalClearance.${clr_id} created; MedicalCase.${mc_id}.status == CLEARED; Talent.${t_id}.availability_status == ACTIVE"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_lock_gated_by_booking_counts
        grounds:
          - state_machines.Event.SCHEDULED_to_LOCKED
          - validations[priority=19]
          - entities.Event.fields.roster_min_main
        distinguishing_aspect: |
          Entity pair Event -> Booking: the Event's SCHEDULED -> LOCKED
          transition is legal only when the COUNT of child Booking rows in
          BOOKED state (and their talents' roster_tier) satisfies the event's
          minimums — zero bookings against mins (1,2) rejects, adding two
          MAIN_ROSTER bookings flips it to success.
        test_recipe:
          setup:
            - "Two talents T1, T2 each with one FULFILLED house-show warmup (wellness 53.00, readiness score 1*4 + round_half_up(53.00*0.5) = 31 — below the 60 threshold), promoted via PROMOTE call-up"
            - "Event EV (roster_min_main 2, roster_min_total 2) initially with zero bookings"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Main One", legal_name: "One Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t1_id: $.data.id }
            - call: "POST /touring/talents"
              payload: { ring_name: "Main Two", legal_name: "Two Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t2_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Gate Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "WARM_A", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-03", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { wa_id: $.data.id, wa_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${wa_id}", talent_id: "${t1_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/bookings"
              payload: { event_id: "${wa_id}", talent_id: "${t2_id}", segment_label: "MATCH_2" }
              as: TourPlanner
            - call: "POST /touring/events/${wa_id}/lock"
              payload: { expected_event_version: "${wa_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${wa_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/talents/${t1_id}/call-up"
              payload: { decision: "PROMOTE" }
              as: TalentRelations
              captures: { cu1_err: $.data.error_id }
            - call: "POST /touring/talents/${t1_id}/call-up"
              payload: { decision: "PROMOTE" }
              as: TalentRelations
              captures: { cu1_err: $.data.error_id }
            - call: "POST /touring/talents/${t2_id}/call-up"
              payload: { decision: "PROMOTE" }
              as: TalentRelations
              captures: { cu2_err: $.data.error_id }
            - call: "POST /touring/events"
              payload: { name: "EV", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-10", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 2, roster_min_total: 2 }
              as: TourPlanner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
          trigger:
            - call: "POST /touring/events/${ev_id}/lock"
              payload: { expected_event_version: "${ev_v}" }
              as: TourPlanner
              captures: { err_lock: $.data.error_id }
          assert:
            - "lock with zero bookings fails: response $.data.error_id == ERR_ROSTER_MINIMUM_UNMET (0 BOOKED < roster_min_total 2)"
            - "the PROMOTE call-ups were rejected (readiness 31 < 60): captured cu1_err/cu2_err == ERR_READINESS_THRESHOLD_UNMET, so both talents remain DEVELOPMENTAL — a second lock after booking them would still fail roster_min_main, proving the gate reads child Booking counts AND talent tier state"

      - name: distribution_window_gated_by_territory_right_and_partner_status
        grounds:
          - validations[priority=16]
          - state_machines.DistributionWindow.PROVISIONAL_to_PUBLISHED
          - entities.TerritoryRight.fields.window_start_date
        distinguishing_aspect: |
          Different entity pair DistributionWindow -> TerritoryRight (vs
          Event -> Booking): window creation is legal only while a TerritoryRight
          of the same partner covers the window dates; a right whose window
          starts the day AFTER the event (uncovered) rejects with
          ERR_TERRITORY_NOT_LICENSED even though the partner exists and is ACTIVE.
        test_recipe:
          setup:
            - "PREMIUM event PE on 2026-09-20 (arena US)"
            - "Streaming partner SP ACTIVE"
            - "TerritoryRight for SP/US covering only 2026-10-01..2027-01-01 (does NOT span 2026-09-20)"
          setup_api_calls:
            - call: "POST /touring/arenas"
              payload: { name: "Dist Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "DPE", event_type: "PREMIUM", arena_id: "${ar_id}", event_date: "2026-09-20", start_time: "20:00", end_time: "23:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { pe_id: $.data.id }
            - call: "POST /touring/streaming-partners"
              payload: { name: "LateCo", partner_code: "LC" }
              as: DistributionManager
              captures: { sp_id: $.data.id }
            - call: "POST /touring/territory-rights"
              payload: { partner_id: "${sp_id}", territory_code: "US", window_start_date: "2026-10-01", window_end_date: "2027-01-01", exclusive: false }
              as: DistributionManager
          trigger:
            - call: "POST /touring/distribution-windows"
              payload: { event_id: "${pe_id}", partner_id: "${sp_id}", territory_code: "US", window_type: "LIVE", opens_at: "2026-09-20T19:30:00Z", closes_at: "2026-09-20T23:30:00Z" }
              as: DistributionManager
              captures: { err_dw: $.data.error_id }
            - call: "POST /touring/territory-rights"
              payload: { partner_id: "${sp_id}", territory_code: "US", window_start_date: "2026-09-01", window_end_date: "2026-10-01", exclusive: false }
              as: DistributionManager
            - call: "POST /touring/distribution-windows"
              payload: { event_id: "${pe_id}", partner_id: "${sp_id}", territory_code: "US", window_type: "LIVE", opens_at: "2026-09-20T19:30:00Z", closes_at: "2026-09-20T23:30:00Z" }
              as: DistributionManager
              captures: { dw_id: $.data.id }
          assert:
            - "first create response $.data.error_id == ERR_TERRITORY_NOT_LICENSED (right starts after the event date)"
            - "after adding a spanning right, second create succeeds: DistributionWindow.${dw_id}.status == PROVISIONAL"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: arena_whole_day_semantics_vs_time_window
        grounds:
          - validations[priority=11]
          - calculations.distribution_windowing
        distinguishing_aspect: |
          Interval semantics A (whole-day, adjacency-irrelevant): two events at
          the same arena on the same calendar date conflict even with disjoint
          [start_time,end_time) windows — arena capacity is a per-DAY aggregate,
          not an hour-overlap rule.
        test_recipe:
          setup:
            - "Arena AR; morning HOUSE_SHOW E_AM 2026-09-05 10:00-12:00 already scheduled"
          setup_api_calls:
            - call: "POST /touring/arenas"
              payload: { name: "Day Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "E_AM", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "10:00", end_time: "12:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { eam_id: $.data.id }
          trigger:
            - call: "POST /touring/events"
              payload: { name: "E_PM", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { err_day: $.data.error_id }
            - call: "POST /touring/events"
              payload: { name: "E_NEXT", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "10:00", end_time: "12:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { enext_id: $.data.id }
          assert:
            - "same-day create response $.data.error_id == ERR_ARENA_DATE_CONFLICT (disjoint hours do not matter)"
            - "next-day create succeeds: Event.${enext_id}.status == SCHEDULED (adjacent days are legal)"

      - name: territory_right_half_open_adjacency_and_exclusive_overlap
        grounds:
          - calculations.territory_right_overlap
          - validations[priority=14]
        distinguishing_aspect: |
          Interval semantics B (half-open dates, adjacency legal, exclusivity
          blast radius): back-to-back rights [..,09-01) and [09-01,..) for the
          same territory are legal (touching is not overlap), while a new
          EXCLUSIVE right conflicts with ANY existing overlapping right on the
          territory — a different geometric rule than the arena's whole-day
          aggregate.
        test_recipe:
          setup:
            - "Partners P1, P2 ACTIVE"
            - "P1 holds non-exclusive US right [2026-01-01, 2026-09-01)"
          setup_api_calls:
            - call: "POST /touring/streaming-partners"
              payload: { name: "PCo1", partner_code: "P1" }
              as: DistributionManager
              captures: { p1_id: $.data.id }
            - call: "POST /touring/streaming-partners"
              payload: { name: "PCo2", partner_code: "P2" }
              as: DistributionManager
              captures: { p2_id: $.data.id }
            - call: "POST /touring/territory-rights"
              payload: { partner_id: "${p1_id}", territory_code: "US", window_start_date: "2026-01-01", window_end_date: "2026-09-01", exclusive: false }
              as: DistributionManager
              captures: { tr1_id: $.data.id }
          trigger:
            - call: "POST /touring/territory-rights"
              payload: { partner_id: "${p2_id}", territory_code: "US", window_start_date: "2026-09-01", window_end_date: "2027-01-01", exclusive: false }
              as: DistributionManager
              captures: { tr2_id: $.data.id }
            - call: "POST /touring/territory-rights"
              payload: { partner_id: "${p2_id}", territory_code: "US", window_start_date: "2026-06-01", window_end_date: "2026-12-01", exclusive: true }
              as: DistributionManager
              captures: { err_ex: $.data.error_id }
          assert:
            - "adjacent create succeeds: TerritoryRight.${tr2_id} exists (half-open: 2026-09-01 end touches 2026-09-01 start)"
            - "overlapping exclusive create response $.data.error_id == ERR_TERRITORY_RIGHT_CONFLICT ([2026-06-01,2026-12-01) intersects both existing rights)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: wellness_fulfill_then_noshow_conserves_net_delta
        grounds:
          - state_machines.Booking.FULFILLED_to_NO_SHOW
          - calculations.wellness_score_accrual
        distinguishing_aspect: |
          Conserved quantity: Talent.wellness_score. Invariant — a FULFILLED
          booking followed by its compensating NO_SHOW leaves wellness exactly
          8.00 below its pre-booking value (reverse +3.00 then -8.00), with no
          drift: 50.00 -> 53.00 -> 42.00, and a second fulfill/no-show pair on
          another event lands at 34.00, never accumulating rounding error.
        test_recipe:
          setup:
            - "Talent T fresh (wellness 50.00) booked on house events N1 (2026-09-05) and N2 (2026-09-06), both LOCKED and COMPLETED with clock pinned to each event's date"
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Steady Sam", legal_name: "Sam Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Inv Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "N1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { n1_id: $.data.id, n1_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${n1_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
              captures: { bk1_id: $.data.id }
            - call: "POST /touring/events/${n1_id}/lock"
              payload: { expected_event_version: "${n1_v}" }
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "N2", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { n2_id: $.data.id, n2_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${n2_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
              captures: { bk2_id: $.data.id }
            - call: "POST /touring/events/${n2_id}/lock"
              payload: { expected_event_version: "${n2_v}" }
              as: TourPlanner
            - call: "POST /touring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T12:00:00Z" }
              as: ContractAdmin
            - call: "POST /touring/events/${n1_id}/complete"
              payload: {}
              as: TourPlanner
          trigger:
            - call: "POST /touring/events/${n1_id}/bookings/${bk1_id}/no-show"
              payload: {}
              as: TourPlanner
          assert:
            - "Booking.${bk1_id}.status == NO_SHOW"
            - "Talent.${t_id}.wellness_score == 42.00 (50.00 + 3.00 - 3.00 - 8.00; forward + compensate conserves the -8.00 net with zero drift)"

      - name: storyline_gap_count_conservation_miss_then_complete
        grounds:
          - calculations.storyline_gap_rule
          - state_machines.Event.SCHEDULED_to_CANCELLED
          - state_machines.Event.LOCKED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity: Storyline.gap_count as CONSECUTIVE misses. A
          chapter completion is the compensating action that resets the counter
          to 0 — miss, complete, miss, miss leaves gap_count == 2 (not 3), so
          the storyline stays ACTIVE; only three UNBROKEN misses shelve it.
        test_recipe:
          setup:
            - "ACTIVE storyline S with chapters on E1 (2026-09-05), E2 (2026-09-06), E3 (2026-09-07), E4 (2026-09-08)"
            - "E1 cancelled (gap 1); E2 locked+completed (chapter completes, gap resets to 0); E3 cancelled (gap 1); E4 cancelled (gap 2)"
          setup_api_calls:
            - call: "POST /touring/storylines"
              payload: { title: "Gap Feud" }
              as: StorylineEditor
              captures: { s_id: $.data.id }
            - call: "POST /touring/arenas"
              payload: { name: "Gap Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "G1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { g1_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "G2", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { g2_id: $.data.id, g2_v: $.data.version }
            - call: "POST /touring/events"
              payload: { name: "G3", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-07", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { g3_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "G4", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-08", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { g4_id: $.data.id }
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${g1_id}" }
              as: StorylineEditor
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${g2_id}" }
              as: StorylineEditor
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${g3_id}" }
              as: StorylineEditor
            - call: "POST /touring/chapters"
              payload: { storyline_id: "${s_id}", event_id: "${g4_id}" }
              as: StorylineEditor
            - call: "POST /touring/storylines/${s_id}/activate"
              payload: {}
              as: StorylineEditor
            - call: "POST /touring/events/${g1_id}/cancel"
              payload: {}
              as: TourPlanner
          trigger:
            - call: "POST /touring/events/${g2_id}/lock"
              payload: { expected_event_version: "${g2_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${g2_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events/${g3_id}/cancel"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events/${g4_id}/cancel"
              payload: {}
              as: TourPlanner
          assert:
            - "Storyline.${s_id}.gap_count == 2 (cancel=1, complete resets to 0, cancel=1, cancel=2)"
            - "Storyline.${s_id}.status == ACTIVE (never reached 3 consecutive)"
