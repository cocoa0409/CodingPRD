              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { f_rec5_id: $.data.id }
            - call: "POST /referrals/${ref_f_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { err_probe: $.data.error_id }
            # note: submit-review fails (no VERIFIED records yet); case still creatable only after verify.
            - &f_ver1
              call: "POST /referrals/${ref_f_id}/medical-records/${f_rec1_id}/verify"
              payload: {}
              as: CaseReviewer
              as_user_id: "cr-boris"
            - call: "POST /referrals/${ref_f_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - &case_f_create
              call: "POST /visit-cases"
              payload: { referral_id: "${ref_f_id}", case_type: "DESTINATION", care_team_specialty_ids: ["${svc_card_id}", "${svc_neur_id}"] }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { case_f_id: $.data.id }
            - &f_ver2
