# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3062_credit_monitoring_score_simulation_pre_qualified_offer
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by §1.8 appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Shared setup fragments (YAML anchors; expansion is identical in every use).
  # ---------------------------------------------------------------------------
  - section: entities
    instances:

      - name: consumer_create_ignores_client_supplied_monitoring_fields
        claim_type: Creation
        grounds:
          - entities.Consumer
          - endpoints.POST_/credit/consumers
        distinguishing_aspect: "A consumer created from four input fields comes back 201 with score_version 0, monitoring_consent_at null, monitoring_posture ENROLLED and version 1 — none of which the client supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &k_clock
              call: "POST /credit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /credit/consumers"
              payload: { full_name: "Maya Chen", email: "maya@x.com", state_code: "CA", bureau_pin: "4821", dti_pct: 35.0 }
              as: Consumer
              captures: { c_id: $.data.id, c_v1: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Consumer.${c_id}.full_name == \"Maya Chen\" and state_code == \"CA\" and dti_pct == 35.0"
            - "Consumer.${c_id}.score_version == 0, current_score is null, previous_score is null and utilization_pct is null"
            - "Consumer.${c_id}.monitoring_consent_at is null and open_dispute_count == 0"
            - "Consumer.${c_id}.version == 1 and id is a bare UUID with no type prefix"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: lender_program_get_round_trips_every_configuration_field
        claim_type: Retrieval
        grounds:
          - entities.LenderProgram
          - endpoints.GET_/credit/lender-programs/{program_id}
        distinguishing_aspect: "Every LenderProgram field round-trips through GET unchanged, including the clawback_rate_bps that governs the compensating leg and the two ISO timestamps that gate deliverability."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One active lender with one program."]
          setup_api_calls:
            - *k_clock
            - &k_lender
              call: "POST /credit/lenders"
              payload: { lender_name: "Northstar Bank", states_served: ["CA","NY","TX"] }
              as: PlatformAdmin
              captures: { lender_id: $.data.id }
            - &k_lender_act
              call: "POST /credit/lenders/${lender_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &k_item_loan
              call: "POST /credit/catalog/items"
              payload: { product_kind: "LOAN", product_name: "Personal Loan", min_score: 560, max_score: 720, max_dti_pct: 60.0 }
              as: PlatformAdmin
              captures: { item_id: $.data.id }
            - &k_item_act
              call: "POST /credit/catalog/items/${item_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &k_tier_good
              call: "POST /credit/score-tiers"
              payload: { tier_code: "GOOD", min_score: 670, max_score: 739, factor_catalog: ["high_utilization","length_of_credit_history"] }
              as: PlatformAdmin
              captures: { tier_id: $.data.id }
            - &k_tier_act
              call: "POST /credit/score-tiers/${tier_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &k_program_loan
              call: "POST /credit/lender-programs"
              payload: { lender_id: "${lender_id}", product_catalog_item_id: "${item_id}", program_name: "Northstar Personal Loan", program_code: "NS-LOAN-01", min_modeled_score: 560, max_dti_pct: 45.0, max_eligible_utilization_pct: 55.0, annual_fee_cents: 9500, intro_apr_bps: 1800, go_live_at: "2026-08-01T00:00:00Z", expiry_at: "2027-08-01T00:00:00Z", revenue_share_bps: 1000, clawback_rate_bps: 500, clawback_days: 90 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - &k_program_act
              call: "POST /credit/lender-programs/${prog_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /credit/lender-programs/${prog_id}"
              payload: {}
              as: Consumer
          assert:
            - "the response status is 200"
            - "program_code == \"NS-LOAN-01\" and program_name == \"Northstar Personal Loan\""
            - "min_modeled_score == 560, max_dti_pct == 45.0 and max_eligible_utilization_pct == 55.0"
            - "revenue_share_bps == 1000, clawback_rate_bps == 500 and clawback_days == 90"
            - "go_live_at == 2026-08-01T00:00:00Z and expiry_at == 2027-08-01T00:00:00Z"
            - "status == ACTIVE"

      - name: referrals_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/credit/referrals
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With exactly one referral on file, limit=1&offset=0 reports total_count 1 and has_more false while a status filter that matches nothing reports total_count 0 with an empty array — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Three referrals on one funded consent, two SENT and one FUNDED."]
          setup_api_calls:
            - *k_clock
            - &k_consumer_v
              call: "POST /credit/consumers"
              payload: { full_name: "Nadia Bell", email: "nadia@x.com", state_code: "CA", bureau_pin: "6600", dti_pct: 35.0 }
              as: Consumer
              captures: { v_id: $.data.id }
            - call: "POST /credit/consumers/${v_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${v_id}"
            - call: "GET /credit/consumers/${v_id}"
              payload: {}
              as: Consumer
              as_user_id: "${v_id}"
              captures: { v_sv: $.data.version }
            - call: "POST /credit/consumers/${v_id}/bureau-snapshots"
              payload: { score: 700, added_account_count: 1, total_revolving_balance_cents: 300000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${v_sv}" }
              as: BureauConnector
              captures: { v_snap: $.data.id }
            - *k_tier_good
            - *k_tier_act
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "UTILIZATION_PCT", operator: "LTE", criterion_value: "50", is_hard_requirement: true }
              as: LenderOps
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "DTI_PCT", operator: "LTE", criterion_value: "30", is_hard_requirement: false }
              as: LenderOps
            - &k_prequal_v
              call: "POST /credit/consumers/${v_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${v_id}"
              captures: { v_dec: $.data.id }
            - call: "POST /credit/pre-qualification-decisions/${v_dec}/qualify"
              payload: {}
              as: Referee
            - call: "POST /credit/consumers/${v_id}/content-quality-facets"
              payload: { topic: "factor_explanations", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/consumers/${v_id}/content-quality-facets"
              payload: { topic: "accuracy_education", score_bps: 9000 }
              as: Referee
            - call: "POST /credit/_ops/runs"
              payload: { run_key: "corner-list-rollup" }
              as: PlatformAdmin
            - &k_present_v
              call: "POST /credit/pre-qualification-decisions/${v_dec}/present"
              payload: { channel: "WEB" }
              as: Consumer
              as_user_id: "${v_id}"
              captures: { v_offer: $.data.id }
            - call: "POST /credit/offers/${v_offer}/render"
              payload: {}
              as: Consumer
              as_user_id: "${v_id}"
            - call: "GET /credit/consumers/${v_id}"
              payload: {}
              as: Consumer
              as_user_id: "${v_id}"
              captures: { v_cv: $.data.version }
            - &k_consent_v
              call: "POST /credit/consumers/${v_id}/consents/${v_dec}/complete"
              payload: { consent_method: "ELECTRONIC", consent_scope: "SHARE_PII_WITH_LENDER", expected_consumer_version: "${v_cv}" }
              as: Consumer
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /credit/referrals"
              payload: { external_referral_ref: "NS-L-9200", channel: "WEB", offer_id: "${v_offer}" }
              as: LenderOps
              captures: { r_a: $.data.id }
          assert:
            - "the referral created here has status SENT and the consumer now has exactly one referral"
            - "GET /credit/referrals?consumer_id=${v_id}&limit=1&offset=0 returns one row with total_count 1 and has_more false"
            - "GET /credit/referrals?consumer_id=${v_id}&status=SENT returns one row"
            - "GET /credit/referrals?consumer_id=${v_id}&status=FUNDED returns zero rows with total_count 0"
            - "GET /credit/referrals with no query parameters applies limit 10 and offset 0"

      - name: consumer_get_with_unknown_id_returns_consumer_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/credit/consumers/{consumer_id}
          - errors.ERR_CONSUMER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated path-segment id yields the entity-specific 404 ERR_CONSUMER_NOT_FOUND rather than a generic 400."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. No consumer has been created."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /credit/consumers/6f2b1c44-0000-4000-8000-000000000001"
              payload: {}
              as: Consumer
              captures: { err_nf: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "error_id == \"ERR_CONSUMER_NOT_FOUND\""
            - "message is a non-empty string"

      - name: consumer_create_without_required_field_fails
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/credit/consumers
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting dti_pct from an otherwise complete enrollment is rejected as a request-shape error before any entity is written."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /credit/consumers"
              payload: { full_name: "No Dti", email: "nodti@x.com", state_code: "CA", bureau_pin: "1111" }
              as: Consumer
              captures: { err_req: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == \"ERR_INVALID_REQUEST\""
            - "GET /credit/consumers returns zero rows, so nothing was persisted"

      - name: enrollment_defaults_populate_system_fields
        claim_type: Defaults
        grounds:
          - entities.Consumer.fields.score_version
          - entities.Consumer.fields.open_dispute_count
        distinguishing_aspect: "Fields the client never sends take their declared defaults rather than null: score_version 0 and open_dispute_count 0 on a freshly enrolled consumer."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Defa Ult", email: "defa@x.com", state_code: "TX", bureau_pin: "2222", dti_pct: 15.0 }
              as: Consumer
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /credit/consumers/${d_id}"
              payload: {}
              as: Consumer
          assert:
            - "score_version == 0 and open_dispute_count == 0, both system-minted"
            - "current_score is null and utilization_pct is null, so no derived value was invented"

      - name: snapshot_computed_utilization_is_derived_not_client_supplied
        claim_type: Computed Fields
        grounds:
          - entities.BureauSnapshot.fields.overall_credit_utilization_pct
          - endpoints.POST_/credit/consumers/{consumer_id}/bureau-snapshots
        distinguishing_aspect: "overall_credit_utilization_pct is derived from the two balance fields and ignores any client-supplied value, reporting 45.00 for a 540000-of-1200000 snapshot."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consented consumer."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Comp Uted", email: "comp@x.com", state_code: "CA", bureau_pin: "3333", dti_pct: 35.0 }
              as: Consumer
              captures: { co_id: $.data.id }
            - call: "POST /credit/consumers/${co_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${co_id}"
            - call: "GET /credit/consumers/${co_id}"
              payload: {}
              as: Consumer
              as_user_id: "${co_id}"
              captures: { co_v: $.data.version }
            - call: "POST /credit/consumers/${co_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 2, total_revolving_balance_cents: 540000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization","length_of_credit_history"], expected_consumer_version: "${co_v}" }
              as: BureauConnector
              captures: { co_snap: $.data.id, co_ord: $.data.snapshot_ordinal }
          trigger:
            - call: "GET /credit/bureau-snapshots/${co_snap}"
              payload: {}
              as: Consumer
          assert:
            - "overall_credit_utilization_pct == 45.00"
            - "snapshot_ordinal == 1 for ${co_ord} and status == ACTIVE"
            - "the two factor explanations exist with rank_index 0 and 1, ordered as the submitted factor_codes array"

      - name: snapshot_rejects_an_unknown_factor_code_before_persisting
        claim_type: Type Constraints
        grounds:
          - entities.ScoreTierThreshold.fields.factor_catalog
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A factor code outside the active tier's factor_catalog is rejected at ingest, so a snapshot can never carry a code the platform cannot explain."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consented consumer and one ACTIVE tier whose catalog holds only two codes."]
          setup_api_calls:
            - *k_clock
            - *k_tier_good
            - *k_tier_act
            - call: "POST /credit/consumers"
              payload: { full_name: "Bad Factor", email: "badf@x.com", state_code: "CA", bureau_pin: "4444", dti_pct: 35.0 }
              as: Consumer
              captures: { bf_id: $.data.id }
            - call: "POST /credit/consumers/${bf_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${bf_id}"
            - call: "GET /credit/consumers/${bf_id}"
              payload: {}
              as: Consumer
              as_user_id: "${bf_id}"
              captures: { bf_v: $.data.version }
          trigger:
            - call: "POST /credit/consumers/${bf_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 0, total_revolving_balance_cents: 100000, credit_limit_total_cents: 1200000, factor_codes: ["unmapped_mystery_factor"], expected_consumer_version: "${bf_v}" }
              as: BureauConnector
              captures: { err_fac: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == \"ERR_INVALID_REQUEST\", not a 409"
            - "GET /credit/bureau-snapshots?consumer_id=${bf_id} returns zero rows"
            - "Consumer.${bf_id}.score_version is still 0"

      - name: revenue_recognition_entry_has_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.RevenueRecognitionEntry
          - endpoints.GET_/credit/revenue-recognition-entries
        distinguishing_aspect: "RevenueRecognitionEntry carries only id and created_at and exposes no update or delete route, so a posted entry is an append-only fact."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database; no revenue entry exists."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /credit/revenue-recognition-entries"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "no PUT, PATCH or DELETE route exists under /credit/revenue-recognition-entries"
            - "the listing contains no entry, so entries can only arrive through the referral transitions"

      - name: decision_creation_requires_an_existing_program
        claim_type: Parent Relationships
        grounds:
          - entities.PreQualificationDecision.fields.lender_program_id
          - errors.ERR_CONSUMER_NOT_FOUND
        distinguishing_aspect: "The decision's parent is the lender program, and an unresolvable program id fails left-to-right path validation rather than creating an orphan decision."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consented consumer; no lender program exists."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Orp Han", email: "orphan@x.com", state_code: "CA", bureau_pin: "5555", dti_pct: 35.0 }
              as: Consumer
              captures: { or_id: $.data.id }
            - call: "POST /credit/consumers/${or_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${or_id}"
            - call: "GET /credit/consumers/${or_id}"
              payload: {}
              as: Consumer
              as_user_id: "${or_id}"
              captures: { or_v: $.data.version }
            - call: "POST /credit/consumers/${or_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 0, total_revolving_balance_cents: 100000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${or_v}" }
              as: BureauConnector
          trigger:
            - call: "POST /credit/consumers/${or_id}/pre-qualifications"
              payload: { lender_program_id: "6f2b1c44-0000-4000-8000-000000000002" }
              as: Consumer
              as_user_id: "${or_id}"
              captures: { err_par: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id is a non-null not-found code and no decision was created"
            - "GET /credit/consumers/${or_id}/pre-qualification-decisions returns zero rows"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:

      - name: monitoring_consent_is_refused_after_a_bureau_pull
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Consumer.ACTIVE_to_ACTIVE
          - errors.ERR_PRIOR_BUREAU_SNAPSHOT_EXISTS
        distinguishing_aspect: "The Prior-Bureau-Snapshot Rule rejects a first consent grant for any consumer whose score_version has already left zero, so the precondition is on the enrollment counter rather than on the consent field alone."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consumer already consented and pulled once."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Prior Snap", email: "prior@x.com", state_code: "CA", bureau_pin: "6666", dti_pct: 35.0 }
              as: Consumer
              captures: { ps_id: $.data.id }
            - call: "POST /credit/consumers/${ps_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${ps_id}"
            - call: "GET /credit/consumers/${ps_id}"
              payload: {}
              as: Consumer
              as_user_id: "${ps_id}"
              captures: { ps_v: $.data.version }
            - call: "POST /credit/consumers/${ps_id}/bureau-snapshots"
              payload: { score: 660, added_account_count: 0, total_revolving_balance_cents: 100000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${ps_v}" }
              as: BureauConnector
          trigger:
            - call: "POST /credit/consumers/${ps_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${ps_id}"
              captures: { err_prior: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == \"ERR_PRIOR_BUREAU_SNAPSHOT_EXISTS\""
            - "Consumer.${ps_id}.score_version == 1 and monitoring_consent_at is unchanged"

      - name: terminal_retired_tier_rejects_every_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ScoreTierThreshold.ACTIVE_to_RETIRED
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "RETIRED is a terminal status for ScoreTierThreshold, so re-activating it fails rather than silently toggling back."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One ACTIVE score tier."]
          setup_api_calls:
            - *k_clock
            - *k_tier_good
            - *k_tier_act
            - call: "POST /credit/score-tiers/${tier_id}/retire"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /credit/score-tiers/${tier_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err_term: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "GET /credit/score-tiers?status=RETIRED contains ${tier_id}"

      - name: qualifying_an_ineligible_decision_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PreQualificationDecision.NEEDS_SNAPSHOT_to_INELIGIBLE
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "A decision that landed INELIGIBLE can never be qualified, and the refusal comes from the state precondition rather than from a missing snapshot."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One consented consumer scoring 500 against a program requiring 640."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Low Score", email: "low@x.com", state_code: "CA", bureau_pin: "7777", dti_pct: 35.0 }
              as: Consumer
              captures: { ls_id: $.data.id }
            - call: "POST /credit/consumers/${ls_id}/monitoring-consent"
              payload: {}
              as: Consumer
              as_user_id: "${ls_id}"
            - call: "GET /credit/consumers/${ls_id}"
              payload: {}
              as: Consumer
              as_user_id: "${ls_id}"
              captures: { ls_v: $.data.version }
            - call: "POST /credit/consumers/${ls_id}/bureau-snapshots"
              payload: { score: 500, added_account_count: 0, total_revolving_balance_cents: 100000, credit_limit_total_cents: 1200000, factor_codes: ["high_utilization"], expected_consumer_version: "${ls_v}" }
              as: BureauConnector
            - *k_item_loan
            - *k_item_act
            - *k_lender
            - *k_lender_act
            - *k_program_loan
            - *k_program_act
            - call: "POST /credit/lender-programs/${prog_id}/targeting-criteria"
              payload: { criterion_field: "SCORE", operator: "GTE", criterion_value: "640", is_hard_requirement: true }
              as: LenderOps
          trigger:
            - call: "POST /credit/consumers/${ls_id}/pre-qualifications"
              payload: { lender_program_id: "${prog_id}" }
              as: Consumer
              as_user_id: "${ls_id}"
              captures: { ls_dec: $.data.id }
          assert:
            - "the decision is created with decision_status == INELIGIBLE and modeled_odds_pct null"
            - "disqualifying_criteria lists exactly one entry with criterion_field SCORE"
            - "reason == HARD_CRITERIA_FAILED"
            - "a subsequent POST /credit/pre-qualification-decisions/${ls_dec}/qualify returns 409 ERR_INVALID_STATE_TRANSITION"

      - name: snapshot_pull_side_effect_chain_creates_explanations_and_alert
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Consumer.ACTIVE_to_ACTIVE
          - endpoints.POST_/credit/consumers/{consumer_id}/bureau-snapshots
          - calculations.score_alert_threshold
        distinguishing_aspect: "One pull request fans out to four observable second-order effects: a superseded prior snapshot, one explanation row per submitted factor code, an updated consumer projection pair, and a SCORE_DOWN alert at the default threshold."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z, then 2026-09-02T00:00:00Z for the second pull."]
