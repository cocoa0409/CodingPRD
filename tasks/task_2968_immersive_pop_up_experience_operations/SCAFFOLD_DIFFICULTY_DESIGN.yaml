# =============================================================================
# §1.8 Scaffold Difficulty Design — task 2968 Immersive Pop-Up Experience Operations
#
# Test-targeting index for SCAFFOLD.yaml. Every instance grounds in elements
# already declared in §1.1-§1.7 of SCAFFOLD.yaml; deleting this file leaves the
# scaffold's declared behaviour identical.
#
# Every numeric literal in every `assert:` below was computed by executing the
# relevant §1.3 formula with Decimal / ROUND_HALF_UP against the pinned inputs
# in the same instance's `setup:`.
#
# Shared fixture vocabulary used across instances:
#   venue NYC   : egress_width_cm 400 -> egress_capacity floor(400 / 2.03) = 197
#                 requested_occupancy_load 180 -> permitted_occupancy_load 180
#   rooms       : (cap 40, dwell 15) -> 120, (cap 30, dwell 12) -> 112,
#                 (cap 25, dwell 20) -> 56  =>  effective_capacity = min(180, 197, 56) = 56
#   run price   : base_ticket_price_cents 35833, STANDARD tier, lead 7..29 days
#                 -> unit_price_cents 35833
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: royalty_provisional_versus_final_on_identical_orders
        grounds:
          - calculations.royalty_accrual
          - entities.RoyaltyStatement.fields.provisional_royalty_cents
          - entities.RoyaltyStatement.fields.final_royalty_cents
          - entities.RoyaltyStatement.fields.mg_prorated_cents
          - entities.RoyaltyStatement.fields.minimum_guarantee_shortfall_cents
          - entities.RoyaltyStatement.fields.amount_due_cents
          - state_machines.RoyaltyStatement.DRAFT_to_ISSUED
        distinguishing_aspect: |
          The provisional variant reads net_amount_cents over {PENDING, CONFIRMED, CHECKED_IN,
          NO_SHOW} and merch over the same set, while the final variant reads net_collected_cents
          over {CONFIRMED, CHECKED_IN, NO_SHOW, REFUND_DUE, REFUNDED} and merch over CHECKED_IN
          only; the identical four order rows therefore yield provisional_royalty_cents 59380 and
          final_royalty_cents 37710, a delta of exactly 21670.
        test_recipe:
          setup:
            - "One NYC venue with an issued permit and an active lease; one ACTIVE licence at 1250 / 750 bps with minimum_guarantee_cents 192790 over the term 2026-08-01..2026-12-31 (153 days)."
            - "One OPEN, CLEARED run priced at 35833 cents with three themed rooms (effective_capacity 56) and one RELEASED 40-seat slot starting 2026-09-05T14:00:00Z."
            - "Four SINGLE orders of party_size 4 and merch_amount_cents 25020, each with net_amount_cents 143332: O1 CHECKED_IN, O2 CONFIRMED, O3 PENDING, O4 REFUNDED with net_collected_cents 0."
            - "Clock at 2026-10-01T00:00:00Z when the statement for period 2026-09-01..2026-09-30 (30 days) is issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "NYC", site_name: "Pier 9 Shed", lease_start_date: "2026-08-01", lease_end_date: "2027-01-31", lease_extension_option_days: 30, base_monthly_rent_cents: 4500000, buildout_allowance_cents: 1500000, kit_reuse_credit_cents: 500000, buildout_cap_cents: 3000000, requested_occupancy_load: 180, egress_width_cm: 400, sprinklered: true }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package round 1" }
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 180 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /build-kits"
              payload: { kit_code: "KIT-NYC-001", module_count: 20, initial_condition_score: 100.00, localization_language: "en-US" }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { kit_id: $.data.id }
            - call: "POST /license-agreements"
              payload: { licensor_name: "Halcyon Studios", ip_title: "Neon Atrium", licensor_rep_user_id: "rep-1", royalty_rate_bps: 1250, merch_royalty_rate_bps: 750, minimum_guarantee_cents: 192790, approval_scopes: ["CREATIVE_EXECUTION", "MERCHANDISE"], territory_city_codes: ["NYC", "CHI"], term_start_date: "2026-08-01", term_end_date: "2026-12-31" }
              as: LicensingManager
              as_user_id: "lm-1"
              captures: { agreement_id: $.data.id }
            - call: "POST /license-agreements/${agreement_id}/activate"
              payload: {}
              as: LicensingManager
              as_user_id: "lm-1"
            - call: "POST /experience-runs"
              payload: { venue_id: "${venue_id}", license_agreement_id: "${agreement_id}", build_kit_id: "${kit_id}", run_name: "Neon Atrium NYC", scheduled_open_date: "2026-08-10", scheduled_close_date: "2026-10-31", base_ticket_price_cents: 35833, timed_slot_minutes: 45, max_group_size: 12 }
              as: ExperienceProducer
              as_user_id: "producer-1"
              captures: { run_id: $.data.id }
            - call: "POST /themed-rooms"
              payload: { run_id: "${run_id}", room_sequence: 1, name: "Vestibule", room_occupancy_cap: 40, target_dwell_minutes: 15, min_dwell_minutes: 5, sensory_intensity_level: 2, has_quiet_bypass: true, wheelchair_accessible: true }
