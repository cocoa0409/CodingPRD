    input: [hub_id, package_id, cause_code, failure_minutes]
    output: ServiceFailure
    side_effects: ["status=OPEN", "attributed_role and refund_eligible frozen by calculations.service_failure_attribution", "refund_amount_cents computed by calculations.money_back_guarantee_refund"]
  - method: GET
    path: "/airhub/failures"
    description: "List service failures, filterable by hub, package, failure id, or status"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: ["hub_id?", "package_id?", "service_failure_id?", "cause_code?", "attributed_role?", "refund_eligible?", "status?", "limit?", "offset?"]
    output: "ServiceFailure[]"
    side_effects: []
  - method: GET
    path: "/airhub/failures/{failure_id}"
    description: "Get a service failure"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: []
    output: ServiceFailure
    side_effects: []
  - method: POST
    path: "/airhub/failures/{failure_id}/finalize"
    description: "Finalize a refund-eligible failure and lift the money-back guarantee to its full value"
    roles: [RefundAdjuster]
    code: 200
    input: []
    output: ServiceFailure
    side_effects: ["status=FINALIZED", "refund_amount_cents recomputed without the provisional scaling", "increments ServiceFailure.version by 1"]
  - method: POST
    path: "/airhub/failures/{failure_id}/dispute"
    description: "Dispute a non-carrier-attributed failure"
    roles: [RefundAdjuster]
    code: 200
    input: []
    output: ServiceFailure
    side_effects: ["status=DISPUTED", "increments ServiceFailure.version by 1"]
  - method: POST
    path: "/airhub/failures/{failure_id}/reopen"
    description: "Reopen a disputed failure"
    roles: [RefundAdjuster]
    code: 200
    input: []
    output: ServiceFailure
    side_effects: ["status=OPEN", "increments ServiceFailure.version by 1"]
  - method: POST
    path: "/airhub/failures/{failure_id}/void"
    description: "Void a carrier-attributed failure and restore the package's commitment"
    roles: [RefundAdjuster]
    code: 200
    input: []
    output: ServiceFailure
    side_effects: ["status=VOIDED", "the related package's DOWNGRADED commitment -> COMMITTED with service_level restored and final_commitment_minutes=null", "Hub.live_planned_package_total recomputes and the hub's refund batch total recomputes by calculations.refund_batch_total", "increments ServiceFailure.version by 1 and Package.version by 1"]
  - method: POST
    path: "/airhub/failures/{failure_id}/claims"
    description: "Append an outcome claim to a failure"
    roles: [RefundAdjuster, HubOpsManager, WeatherOfficer]
    code: 201
    input: [outcome, "note?"]
    output: ServiceFailureClaim
    side_effects: ["claim_index assigned from the failure's current claim count + 1", "the failure's status re-derived by calculations.service_failure_status from its claim history"]
  - method: GET
    path: "/airhub/failures/{failure_id}/claims"
    description: "List the claims recorded against a failure, in claim order; service_failure_id must match the path segment when supplied"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: ["service_failure_id?", "limit?", "offset?"]
    output: "ServiceFailureClaim[]"
    side_effects: []
  - method: GET
    path: "/airhub/service-failure-claims"
    description: "List refund claims across the hub, filterable by the failure they speak for"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: ["service_failure_id?", "limit?", "offset?"]
    output: "ServiceFailureClaim[]"
    side_effects: []
  - method: POST
    path: "/airhub/moves/{move_id}/assign-buildup"
    description: "Place a package into a destination buildup on this move"
    roles: [LoadPlanner]
    code: 200
    input: [package_id, buildup_id]
    output: LoadMove
    side_effects: ["Package.buildup_id set", "Buildup.rated_weight_grams and hazardous_weight_grams recomputed", "increments LoadMove.version by 1 and Package.version by 1"]
  - method: POST
    path: "/airhub/moves/{move_id}/set-tier"
    description: "Set this move's manual load-plan tier override"
    roles: [LoadPlanner]
    code: 200
    input: [load_plan_tier]
    output: LoadMove
    side_effects: ["load_plan_tier overridden; recomputed by calculations.forward_capacity on the next package event", "increments LoadMove.version by 1"]
  - method: POST
    path: "/airhub/buildups/{buildup_id}/set-tier"
    description: "Set this buildup's manual load-plan tier override"
    roles: [LoadPlanner]
    code: 200
    input: [load_plan_tier]
    output: Buildup
    side_effects: ["load_plan_tier overridden; recomputed by calculations.buildup_reserve_tier on the next package event", "increments Buildup.version by 1"]
  - method: POST
    path: "/airhub/moves/{move_id}/gateway-requirements"
    description: "Declare that a destination gateway must ship in a full container"
    roles: [LoadPlanner]
    code: 200
    input: [destination_gateway_code, requires_container]
    output: LoadMove
    side_effects: ["gateway_requirements map updated; sealing the matching Buildup is gated on CONTAINER_FILL_TOLERANCE_GRAMS", "increments LoadMove.version by 1"]
  - method: POST
    path: "/airhub/shifts/{shift_id}/forecast-volume"
    description: "Revise a shift's forecast volume at the start of the night"
    roles: [SortSupervisor]
    code: 200
    input: [forecast_volume_grams]
    output: LaborShift
    side_effects: ["volume_variance_pct and staffing_posture recomputed by calculations.labor_variance_and_posture", "increments LaborShift.version by 1"]
  - method: POST
    path: "/airhub/hubs/{hub_id}/volume-override"
    description: "Replace the hub's live planning-set volume with an operator-declared figure until the next Package mutation"
    roles: [HubOpsManager]
    code: 200
    input: [live_planned_package_total]
    output: Hub
    side_effects: ["live_planned_package_total overridden; posture recomputed by calculations.hub_posture", "increments Hub.version by 1"]
  - method: POST
    path: "/airhub/packages/{package_id}/claim-indemnity"
    description: "Open a lost-package indemnity claim, separate from the money-back guarantee"
    roles: [RefundAdjuster]
    code: 200
    input: [claimed_value_cents]
    output: Package
    side_effects: ["a ServiceFailure is emitted with cause_code NO_SCAN and attributed_role CARRIER; refund_amount_cents comes from calculations.money_back_guarantee_refund (the declared value is recorded but not paid)", "increments Package.version by 1"]
  - method: POST
    path: "/airhub/packages/{package_id}/assign-aircraft"
    description: "Move a package onto a different inbound aircraft within the same hub"
    roles: [GatewayCoordinator]
    code: 200
    input: [aircraft_id]
    output: Package
    side_effects: ["Package.aircraft_id updated; commitment_cutoff_minutes unchanged", "increments Package.version by 1"]
  - method: GET
    path: "/airhub/service-failure-claims/{claim_id}"
    description: "Get a single refund claim"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: []
    output: ServiceFailureClaim
    side_effects: []
  - method: GET
    path: "/airhub/packages/{package_id}/failures"
    description: "List the service failures recorded against a package"
    roles: [HubOpsManager, SortSupervisor, SortOperator, LoadPlanner, CommitmentController, FeederCoordinator, GatewayCoordinator, HazmatCertifier, WeatherOfficer, RefundAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceFailure[]"
    side_effects: []
  - method: GET
    path: "/airhub/hubs/{hub_id}/refund-summary"
    description: "Computed read: the hub's money-back-guarantee refund batch total across every carrier-attributed ServiceFailure on the hub"
    roles: [HubOpsManager, RefundAdjuster, CommitmentController, WeatherOfficer]
    code: 200
    input: []
    output: "{ batch_total_cents: integer, eligible_failure_count: integer, provisional_failure_count: integer }"
    side_effects: ["batch_total_cents computed by calculations.refund_batch_total"]
  - method: GET
    path: "/airhub/hubs/{hub_id}/triage"
    description: "Computed read: classify the hub's next volume wave against the containing shift's staffing posture"
    roles: [HubOpsManager, SortSupervisor]
    code: 200
    input: []
    output: "{ triage: string, staffing_posture: string, shift_id: string }"
    side_effects: ["triage computed by calculations.labor_queue_triage"]
  - method: GET
    path: "/airhub/lanes/concourse-width"
    description: "Computed read: the merged turnout width for every non-CLOSED lane of one kind on a hub"
    roles: [HubOpsManager, SortSupervisor, SortOperator]
    code: 200
    input: [hub_id, lane_kind]
    output: "{ concourse_width_rating: integer, merged_minutes: integer, lane_count: integer }"
    side_effects: ["concourse_width_rating computed by calculations.concourse_width_rating"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing or not a declared role, or X-User-ID missing for an entity_backed role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not permitted on this endpoint, or a segregation-of-duties rule forbids this actor from completing the action" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path resource or a body-supplied foreign key does not exist in the hub scope, validated left-to-right / in declared input order" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required input field is missing, an unknown field is supplied, or a type or enum member is invalid" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a state that admits this transition, including the derived handling_posture and staffing_posture gates" }
  - { id: ERR_POSTURE_BLOCKS_INDUCTION, http: 409, condition: "Induction, loading, departure or landing attempted while the hub is LOCKDOWN or GROUND_STOP" }
  - { id: ERR_LANE_CERTIFICATION_LAPSED, http: 409, condition: "The target sort lane's certified_until_minutes is not strictly after the current hub minute" }
  - { id: ERR_LANE_NOT_AVAILABLE, http: 409, condition: "The target sort lane is CLOSED, or its commodity_capability does not match the package's commodity_class" }
  - { id: ERR_LANE_CAPACITY_EXCEEDED, http: 409, condition: "The sort lane's hourly handling capacity would be exceeded by this package's rated_weight_grams" }
  - { id: ERR_BUILDUP_UNDER_CAPACITY, http: 409, condition: "The destination buildup sits strictly inside its breach-tolerance band above the container limit, so it may neither accept more volume nor seal" }
  - { id: ERR_HAZMAT_CAP_EXCEEDED, http: 409, condition: "Onboarding this HAZMAT package would push the destination buildup's hazardous_weight_grams past its hazardous_cap_grams" }
  - { id: ERR_LOAD_WEIGHT_EXCEEDED, http: 409, condition: "A load would push the move's forward capacity below the SORT_BUDGET_GRAMS_FLOOR, or the completed move exceeds its weight limit plus the use-it-or-lose-it tolerance" }
  - { id: ERR_FEEDER_OVER_CAPACITY, http: 409, condition: "The feeder's staged weight exceeds 95% of its stage capacity at departure time, even though the same load was compliant while staging" }
  - { id: ERR_FEEDER_WINDOW_CONFLICT, http: 409, condition: "Another feeder's turnout window already occupies this feeder's staging interval" }
  - { id: ERR_UNLOAD_FACE_OCCUPIED, http: 409, condition: "Another aircraft on the same bank already holds status UNLOADING; the bank has exactly one unload face" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent resource's current version" }
  - { id: ERR_CARRIER_ATTRIBUTED_NOT_DISPUTABLE, http: 409, condition: "A carrier-attributed failure is a refund obligation and may not be moved to DISPUTED" }
  - { id: ERR_NO_ALTERNATE_HUB, http: 409, condition: "A diversion was requested on a hub whose alternate_hub_id is null" }
  - { id: ERR_CONTINGENCY_NOT_DECLARED, http: 409, condition: "A contingency-only action was attempted while contingency_mode is false" }
  - { id: ERR_HUB_NOT_LOCKED, http: 409, condition: "A ground stop was requested on a hub that is not currently in LOCKDOWN" }
  - { id: ERR_CLOCK_OUT_OF_ORDER, http: 409, condition: "The logical clock was asked to move strictly backwards" }
  - { id: ERR_DUPLICATE_LIVE_PACKAGE, http: 409, condition: "A hub already holds a package with this tracking_number that is neither VOIDED nor DIVERTED, so the tracking number is not reusable" }
  - { id: ERR_ACK_MISMATCH, http: 409, condition: "The same acknowledgement_number was replayed against a payload that differs from the original request" }
  - { id: ERR_BANK_NOT_UNLOADING, http: 409, condition: "An aircraft unload was attempted while its arrival bank is not in UNLOADING" }
  - { id: ERR_HYDRAULIC_CREW_UNAVAILABLE, http: 409, condition: "The bank's unload face was opened while hydraulic_crew_available is false" }
  - { id: ERR_LATE_UNLOAD_REGRESSION, http: 409, condition: "The supplied unload_completed_minutes precedes the aircraft's actual_arrival_minutes" }
  - { id: ERR_SORT_STAGE_BUDGET_EXCEEDED, http: 409, condition: "The secondary sort was attempted more than SECONDARY_STAGE_BUDGET_MINUTES after the primary sort" }
  - { id: ERR_IRREGULAR_RESOLVE_BUDGET_EXCEEDED, http: 409, condition: "An irregular or hazmat routing was resolved after its resolve budget had closed" }
  - { id: ERR_CUTOFF_NOT_REACHED, http: 409, condition: "A commitment downgrade was attempted before the package had entered its downgrade lead window" }
  - { id: ERR_COMMITMENT_GRACE_EXCEEDED, http: 409, condition: "A commitment downgrade was attempted after the commitment grace window had closed" }
  - { id: ERR_AIRCRAFT_NOT_CANCELLED, http: 409, condition: "An upgrade-hold or clear-upgrade-hold was attempted against a package whose aircraft is not CANCELLED" }
  - { id: ERR_SORT_PENDING, http: 409, condition: "A commitment action was attempted on a package that has already been loaded onto a move" }
  - { id: ERR_FINALIZED_FAILURE_PRESENT, http: 409, condition: "A package void was attempted while it carries a FINALIZED service failure" }
  - { id: ERR_REOPEN_POSTURE_BLOCKED, http: 409, condition: "A disputed failure was reopened while the hub is in LOCKDOWN or GROUND_STOP" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HubOpsManager
    description: "Hub duty manager: contingency authority, ground stops, ops checkpoints, aircraft cancellation and reinstatement, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /airhub/hubs/{hub_id}/clear-contingency"
      - "POST /airhub/hubs/{hub_id}/ground-stop"
      - "POST /airhub/aircraft/{aircraft_id}/cancel"
      - "POST /airhub/aircraft/{aircraft_id}/reinstate"
      - "POST /airhub/banks/{bank_id}/abandon"
      - "POST /airhub/ops-runs/{ops_run_id}/advance"
      - "POST /airhub/ops-runs/{ops_run_id}/release"
    shared_operations:
      - "POST /airhub/hubs — Create hub"
      - "POST /airhub/hubs/{hub_id}/run-ops — Run checkpoint"
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
      - "POST /airhub/failures/{failure_id}/claims — Append claim"
  - name: SortSupervisor
    description: "Sort supervisor: bank unload face, lane lifecycle, irregular routing, labor shifts, and package unload operations"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/banks/{bank_id}/begin-unload"
      - "POST /airhub/lanes/{lane_id}/close"
      - "POST /airhub/lanes/{lane_id}/reopen"
      - "POST /airhub/lanes — Create lane"
      - "POST /airhub/aircraft/{aircraft_id}/begin-unload"
      - "POST /airhub/aircraft/{aircraft_id}/complete-unload"
      - "POST /airhub/packages/{package_id}/route-irregular"
      - "POST /airhub/packages/{package_id}/resolve-irregular"
      - "POST /airhub/shifts — Create shift"
      - "POST /airhub/shifts/{shift_id}/cancel"
      - "POST /airhub/shifts/{shift_id}/complete"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
  - name: SortOperator
    description: "Sort operator: package induction, primary and secondary sort, lane reclaim, package creation"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/packages — Create package"
      - "POST /airhub/packages/{package_id}/induct"
      - "POST /airhub/packages/{package_id}/reject-induction"
      - "POST /airhub/packages/{package_id}/primary-sort"
      - "POST /airhub/packages/{package_id}/secondary-sort"
      - "POST /airhub/packages/{package_id}/reclaim-lane"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
  - name: LoadPlanner
    description: "Load planner: load move lifecycle, destination buildups, package onboarding"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/moves — Plan move"
      - "POST /airhub/moves/{move_id}/plan-load"
      - "POST /airhub/moves/{move_id}/begin-loading"
      - "POST /airhub/moves/{move_id}/complete-load"
      - "POST /airhub/moves/{move_id}/replan"
      - "POST /airhub/moves/{move_id}/cancel"
      - "POST /airhub/moves/{move_id}/load-package"
      - "POST /airhub/moves/{move_id}/unload-package"
      - "POST /airhub/buildups — Create buildup"
      - "POST /airhub/buildups/{buildup_id}/seal"
      - "POST /airhub/buildups/{buildup_id}/unseal"
      - "POST /airhub/buildups/{buildup_id}/cancel"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
  - name: CommitmentController
    description: "Commitment controller: cutoff decisions, downgrades, diversions, upgrade holds, and package void"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/packages/{package_id}/downgrade-commitment"
      - "POST /airhub/packages/{package_id}/ground-downgrade"
      - "POST /airhub/packages/{package_id}/diverge"
      - "POST /airhub/packages/{package_id}/upgrade-hold"
      - "POST /airhub/packages/{package_id}/clear-reroute"
      - "POST /airhub/packages/{package_id}/clear-upgrade-hold"
      - "POST /airhub/packages/{package_id}/void"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
  - name: FeederCoordinator
    description: "Ground network coordinator: regional feeder scheduling, staging and departure"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/feeders — Schedule feeder"
      - "POST /airhub/feeders/{feeder_id}/begin-staging"
      - "POST /airhub/feeders/{feeder_id}/stage-package"
      - "POST /airhub/feeders/{feeder_id}/begin-loading"
      - "POST /airhub/feeders/{feeder_id}/depart"
      - "POST /airhub/feeders/{feeder_id}/cancel"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
  - name: GatewayCoordinator
    description: "Gateway coordinator: inbound aircraft creation, origin departure and landing"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/aircraft — Create aircraft"
      - "POST /airhub/aircraft/{aircraft_id}/depart-origin"
      - "POST /airhub/aircraft/{aircraft_id}/land"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
  - name: HazmatCertifier
    description: "Hazmat certifier: hazmat lane routing and certification clearance"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/packages/{package_id}/route-hazmat"
      - "POST /airhub/packages/{package_id}/resolve-hazmat"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
  - name: WeatherOfficer
    description: "Weather officer: contingency declarations and weather-driven aircraft diversions"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/hubs/{hub_id}/declare-contingency"
      - "POST /airhub/aircraft/{aircraft_id}/divert-maintenance"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
      - "POST /airhub/failures/{failure_id}/claims — Append weather claim"
  - name: RefundAdjuster
    description: "Refund adjuster: service failure recording, finalization, dispute, and money-back guarantee settlement"
    identity: opaque
    exclusive_operations:
      - "POST /airhub/failures — Record failure"
      - "POST /airhub/failures/{failure_id}/finalize"
      - "POST /airhub/failures/{failure_id}/dispute"
      - "POST /airhub/failures/{failure_id}/reopen"
      - "POST /airhub/failures/{failure_id}/void"
    shared_operations:
      - "GET /airhub/hubs, /airhub/banks, /airhub/aircraft, /airhub/packages, /airhub/lanes, /airhub/moves, /airhub/buildups, /airhub/feeders, /airhub/shifts, /airhub/ops-runs, /airhub/failures"
      - "POST /airhub/failures/{failure_id}/claims — Append refund claim"
