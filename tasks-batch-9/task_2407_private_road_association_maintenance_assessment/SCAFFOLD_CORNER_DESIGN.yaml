      - name: award_path_project_not_found_outranks_body_bid_not_found
        claim_type: cascading_validation
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - endpoints[POST /maintenance-projects/{project_id}/award]
        distinguishing_aspect: "With both the path project id and the body bid id unresolvable, the response is ERR_PROJECT_NOT_FOUND; only after the path id resolves does the body foreign key surface as ERR_BID_NOT_FOUND, so priority 5 strictly precedes priority 6 on the same call."
