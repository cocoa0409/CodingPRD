      - name: scenario_price_realization_has_zero_incremental_units_and_zero_investment
        claim_type: Variant Divergence
        grounds:
          - calculations.calc_scenario_gap_closure
          - entities.Scenario.fields.price_increase_pct
          - endpoints[POST /sop/scenarios/{scenario_id}/evaluate]
        distinguishing_aspect: |
          The PRICE_REALIZATION variant short-circuits steps 1 and 3 to zero, so
          pre_trade_closure_cents equals gross_uplift_cents exactly, and the gross uplift is a
          percentage of the CYCLE's plan_value_cents rather than of any item price. With
          plan_value 1_331_330 and 5 percent the product is exactly 66_566.50, which
          round_half_up must lift to 66_567 (not truncate to 66_566), and the trade tier is
          read off that 66_567 — far below TRADE_TIER_1 1_000_000, so 4.0 percent applies.
        test_recipe:
          setup:
            - "The base family and customer, a MATURE item priced at 1001 cents (safety_stock_units 330, on_hand 0), and a 14-hour block inside 2026-09 (1400 units)."
            - "A cycle over 2026-09..2026-09 with commitment 0, one locked forecast of 1000 units, one PLANNED SupplyPlan with constrained_units 1330 giving plan_value_cents 1_331_330, walked on to SCENARIO_REVIEW."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
