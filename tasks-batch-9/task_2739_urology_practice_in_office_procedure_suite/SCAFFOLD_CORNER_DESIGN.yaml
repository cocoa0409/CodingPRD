          rationale: "That §1.8 instance evaluates the whole composed formula three times over — anticoagulant surcharge, renal surcharge, HIGH cleanup multiplier, scope add-on and the turnover floor — and pins scheduled_end_at and block_end_at for each. A single correct-result probe would be a strict subset of it."

      - name: calc_precision_dose_rounding_half_up
        claim_type: precision
        grounds:
          - calculations.antibiotic_agent_selection.precision
          - calculations.antibiotic_agent_selection.constants.DOSE_STEP_MG
        excluded_because:
          difficulty_instance: bp_renal_dose_step_rounding_at_egfr_45
          rationale: "The rounding mode and the DOSE_STEP_MG quantisation are the subject of that §1.8 instance, which straddles RENAL_ADJUST_EGFR at 45 and 44 and adds an explicitly requested TMP_SMX whose halved dose 80 quantises to 75."

      - name: calc_precision_billing_round_per_line_then_sum
        claim_type: precision
        grounds:
          - calculations.consignment_billing.precision
        excluded_because:
          difficulty_instance: cf_billing_round_per_line_then_sum
          rationale: "Rounding each reservation line before summing, rather than rounding the total, is exactly the divergence that instance measures (7107 across three 1-unit lines versus 7106 for one 3-unit line)."

      - name: calc_threshold_room_turnover_boundary
        claim_type: correct_result
        grounds:
          - calculations.case_occupancy_window.constants.MIN_TURNOVER_FLOOR_MIN
          - validations[priority 58]
        excluded_because:
          difficulty_instance: bp_room_turnover_adjacent_boundary
          rationale: "The threshold triple (one minute inside the turnover, exactly at block_end_at, and the accepted case after it) is already walked there, including the recomputed window of the accepted case."

      - name: calc_aggregation_reversal_lot_counters
        claim_type: correct_result
        grounds:
          - calculations.consignment_billing
          - entities.ConsignmentLot
        excluded_because:
          difficulty_instance: ci_consignment_unit_conservation_cancel_vs_noshow
          rationale: "The aggregation-reversal claim — running totals correct after the add, and correct again after the reversal — is asserted there across both reversal paths (cancel returning units to available, no-show moving them to wasted) with the conservation identity checked at every step."

      - name: calc_variant_selection_recall_anchor_basis
        claim_type: variant_selection
        grounds:
          - calculations.recall_due_date.variants
        excluded_because:
          difficulty_instance: dv_recall_protocol_vs_event_anchored
          rationale: "Variant selection by context (PROTOCOL_ANCHORED at creation, EVENT_ANCHORED at sweep step 1) and the resulting divergence on one identical row are the whole content of that instance."

      - name: calc_variant_divergence_billing_provisional_vs_final
        claim_type: variant_divergence
        grounds:
          - calculations.consignment_billing.variants
        excluded_because:
          difficulty_instance: dv_consignment_provisional_vs_final
          rationale: "Both variants are computed on the same lot there and the delta on the switch is pinned at -299 cents, which covers variant divergence and the reconciliation of the switch in one pass."

