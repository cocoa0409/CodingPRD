            - {call: "GET /water-rights/${wr2}/points-of-diversion", as: WaterRightsAnalyst}
            - {call: "GET /water-rights/${wr1}/points-of-diversion", payload: {status: PROPOSED}, as: WaterRightsAnalyst}
