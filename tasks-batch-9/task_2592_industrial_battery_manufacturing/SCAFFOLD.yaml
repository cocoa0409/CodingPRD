  # --- ProductionLot -------------------------------------------------
  - method: POST
    path: "/production-lots"
    description: "Opens a production lot against an APPROVED cell design. The lot pins the design revision that was approved, so later design edits never move an in-flight lot's specification."
    roles: [ProductionSupervisor]
    code: 201
    input: [plant_id, cell_design_id, lot_code, quantity]
    output: ProductionLot
    side_effects:
      - "chemistry is copied from the cell design and must be licensed at the plant; design_revision_pinned is set to cell_design.approved_revision."
      - "process_state initialises to PLANNED, env_hold_status to CLEAR, retest_count to 0, sampling_plan_revision to 0 and every counter to 0."
      - "sample_size and acceptance_number initialise to null - no sampling plan exists until one is drawn."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_PLANT_NOT_FOUND, ERR_CELL_DESIGN_NOT_FOUND, ERR_DUPLICATE_CODE, ERR_PLANT_FROZEN, ERR_CHEMISTRY_NOT_LICENSED, ERR_DESIGN_NOT_APPROVED]

  - method: GET
    path: "/production-lots"
    description: "Lists production lots, created_at ASC then id ASC, filterable by plant, cell design, process state, environmental hold and the worker who recorded the lot's last capacity-test result."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector, SafetyOfficer, DesignEngineer, WarrantyAdministrator]
    code: 200
    input: ["plant_id?", "cell_design_id?", "process_state?", "env_hold_status?", "last_test_recorded_by_worker_id?", "limit?", "offset?"]
    output: ProductionLot[]

  - method: GET
    path: "/production-lots/{id}"
    description: "Reads one lot including its sampling plan, test counters, environmental hold and derived lot_capacity_yield_pct."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector, SafetyOfficer, DesignEngineer, WarrantyAdministrator]
    code: 200
    input: []
    output: ProductionLot
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_LOT_NOT_FOUND]

  - method: POST
    path: "/production-lots/{id}/advance"
    description: "Advances the lot one step along PLANNED -> PLATE_PRODUCTION -> FORMATION -> ASSEMBLY. to_state must name the immediate successor; skipping a stage is refused. The final hop into LOT_TESTING is NOT available here - it happens only when the acceptance sampling plan is drawn."
    roles: [ProductionSupervisor]
    code: 200
    input: [to_state]
    output: ProductionLot
    side_effects:
      - "Entering FORMATION additionally requires compliance_posture OPEN - a RESTRICTED plant may finish work in flight but may not start hazardous formation."
      - "Entering ASSEMBLY makes the lot eligible for BatteryAssembly creation; the lot cannot reach LOT_TESTING until POST /production-lots/{id}/sampling-plans draws its first plan."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_LOT_NOT_FOUND, ERR_LOT_STATE_INVALID, ERR_PLANT_FROZEN, ERR_PLANT_RESTRICTED, ERR_LOT_ENV_HELD, ERR_CHEMISTRY_NOT_LICENSED]

  - method: POST
    path: "/production-lots/{id}/sampling-plans"
    description: "Draws or redraws the lot's acceptance sampling plan (sample size and acceptance number) from the lot quantity and chemistry. Optimistically concurrency-controlled on the lot: expected_lot_version must equal the lot's current version."
    roles: [QualityInspector]
    code: 201
    input: [expected_lot_version, "plan_reason?"]
    output: ProductionLot
    side_effects:
      - "sample_size and acceptance_number are computed by CALC lot_sampling_plan using the lot's retest_count as the tightening driver."
      - "sampling_plan_revision is incremented by 1 and the lot's version is incremented by 1."
      - "The FIRST plan drawn on a lot in ASSEMBLY moves process_state ASSEMBLY -> LOT_TESTING; later redraws leave process_state untouched."
      - "Drawing a plan does NOT reset completed_test_count, failed_test_count or passed_cycle_life_count - a retest plan is evaluated against the counters accumulated since the last disposition."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_LOT_NOT_FOUND, ERR_STALE_LOT_VERSION, ERR_LOT_STATE_INVALID, ERR_PLANT_FROZEN, ERR_LOT_ENV_HELD]

  - method: POST
    path: "/production-lots/{id}/disposition"
    description: "Dispositions a lot: RELEASE (LOT_TESTING -> RELEASED, QUALITY job class, sampling complete, acceptance honoured, and never by the worker who recorded the lot's last test), QUARANTINE (LOT_TESTING -> QUARANTINED), RETEST (QUARANTINED -> LOT_TESTING, at most twice) or SCRAP (QUARANTINED -> SCRAPPED)."
    roles: [QualityInspector]
    code: 200
    input: [action, "disposition_note?"]
    output: ProductionLot
    side_effects:
      - "RELEASE stamps released_at with logical now and freezes lot_capacity_yield_pct."
      - "RETEST increments retest_count and zeroes completed_test_count, failed_test_count and passed_cycle_life_count so the tightened plan is evaluated on fresh evidence."
      - "RETEST also immediately redraws the plan through CALC lot_sampling_plan with the incremented retest_count (sampling_plan_revision += 1), so no separate sampling-plans call is needed after a retest."
      - "SCRAP is terminal and does NOT move the plant lead ledger: lead leaves lead_inventory_kg only when a BatteryUnit ships, so a scrapped lot never entered the balance and INVARIANT L1 is unaffected."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_ACTOR_JOB_CLASS_MISMATCH, ERR_LOT_NOT_FOUND, ERR_LOT_STATE_INVALID, ERR_PLANT_FROZEN, ERR_LOT_ENV_HELD, ERR_SEGREGATION_OF_DUTIES, ERR_SAMPLING_INCOMPLETE, ERR_ACCEPTANCE_EXCEEDED, ERR_RETEST_LIMIT_REACHED]

  - method: POST
    path: "/production-lots/{id}/env-hold"
    description: "Places or lifts an environmental hold on a lot. action=HOLD requires hold_reason == OPERATOR_HOLD (the system-only reasons PLANT_FROZEN and PERMIT_SUSPENDED may not be supplied by a client) and blocks every downstream production, verification and release operation; action=RELEASE_HOLD clears it."
    roles: [SafetyOfficer]
    code: 200
    input: [action, "hold_reason?"]
    output: ProductionLot
    side_effects:
      - "env_hold_status becomes HELD or CLEAR; hold_reason is retained on HOLD and cleared to null on RELEASE_HOLD."
      - "The hold axis is orthogonal to process_state: a HELD lot keeps its process_state and resumes exactly where it stopped."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_LOT_NOT_FOUND, ERR_LOT_STATE_INVALID]

  - method: GET
    path: "/production-lots/{id}/quality-summary"
    description: "Computed read of the lot's acceptance position: the current sampling plan, completed/failed/cycle-life counters, the derived lot_capacity_yield_pct and the exact reason a RELEASE would be refused right now. release_blocked_by is ACTOR-INDEPENDENT: it reports the first of ERR_LOT_STATE_INVALID, ERR_LOT_ENV_HELD, ERR_PLANT_FROZEN, ERR_SAMPLING_INCOMPLETE, ERR_ACCEPTANCE_EXCEEDED that currently holds, and \"NONE\" when only the actor-dependent gates (ERR_ACTOR_JOB_CLASS_MISMATCH, ERR_SEGREGATION_OF_DUTIES) could still refuse the call."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector]
    code: 200
    input: []
    output: "{ sample_size: integer, acceptance_number: integer, sampling_plan_revision: integer, completed_test_count: integer, failed_test_count: integer, passed_cycle_life_count: integer, lot_capacity_yield_pct: number, release_blocked_by: string }"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_LOT_NOT_FOUND]

  # --- BatteryAssembly -----------------------------------------------
  - method: POST
    path: "/battery-assemblies"
    description: "Assembles modules into a case for a lot in ASSEMBLY. Records the module count, case type, torque specification and minimum insulation resistance the assembly will be verified against."
    roles: [ProductionSupervisor]
    code: 201
    input: [lot_id, serial_number, module_count, case_type, torque_spec_nm, ir_min_megaohm]
    output: BatteryAssembly
    side_effects:
      - "torque_status and insulation_status both initialise to PENDING, certification_status to PENDING and rework_count to 0."
      - "measured_torque_nm and measured_ir_megaohm initialise to null."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_LOT_NOT_FOUND, ERR_DUPLICATE_CODE, ERR_LOT_STATE_INVALID, ERR_PLANT_FROZEN, ERR_LOT_ENV_HELD]

  - method: GET
    path: "/battery-assemblies"
    description: "Lists assemblies, created_at ASC then id ASC, filterable by lot and by either verification axis."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector]
    code: 200
    input: ["lot_id?", "torque_status?", "insulation_status?", "certification_status?", "limit?", "offset?"]
    output: BatteryAssembly[]

  - method: GET
    path: "/battery-assemblies/{id}"
    description: "Reads one assembly with both verification axes and the derived certification_status."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector]
    code: 200
    input: []
    output: BatteryAssembly
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ASSEMBLY_NOT_FOUND]

  - method: POST
    path: "/battery-assemblies/{id}/verifications"
    description: "Records one verification verdict on one axis. verification_type=TORQUE carries measured_torque_nm plus connection_count (which must equal 2 * module_count); verification_type=INSULATION_RESISTANCE carries measured_ir_megaohm plus test_voltage_v. Each axis may only be recorded once per rework generation."
    roles: [QualityInspector]
    code: 200
    input: [verification_type, "measured_torque_nm?", "connection_count?", "measured_ir_megaohm?", "test_voltage_v?"]
    output: BatteryAssembly
    side_effects:
      - "TORQUE sets torque_status to PASS when measured_torque_nm is within [torque_spec_nm * 0.95, torque_spec_nm * 1.10] inclusive on both ends, otherwise FAIL, and stamps measured_torque_nm."
      - "INSULATION_RESISTANCE sets insulation_status to PASS when measured_ir_megaohm >= ir_min_megaohm (equality passes), otherwise FAIL, and stamps measured_ir_megaohm."
      - "certification_status is re-derived from the axis pair: CERTIFIED only when both axes are PASS, REJECTED when either axis is FAIL, and it stays PENDING while either axis is still PENDING."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_ASSEMBLY_NOT_FOUND, ERR_ASSEMBLY_AXIS_ALREADY_RECORDED, ERR_LOT_ENV_HELD, ERR_CONNECTION_COUNT_MISMATCH]

  - method: POST
    path: "/battery-assemblies/{id}/rework"
    description: "Reworks a REJECTED or REVOKED assembly: both verification axes are reset to PENDING so the pair can be re-verified. Permitted at most three times per assembly."
    roles: [ProductionSupervisor]
    code: 200
    input: ["rework_note?"]
    output: BatteryAssembly
    side_effects:
      - "torque_status and insulation_status are reset to PENDING, measured_torque_nm and measured_ir_megaohm to null, certification_status to PENDING."
      - "rework_count is incremented by 1."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_ASSEMBLY_NOT_FOUND, ERR_ASSEMBLY_STATE_INVALID, ERR_LOT_ENV_HELD, ERR_REWORK_LIMIT_REACHED]

  # --- FormationRun --------------------------------------------------
  - method: POST
    path: "/formation-runs"
    description: "Schedules a formation charging window for a lot in FORMATION on one bay. Reserves both the bay window (single occupancy plus cooldown buffer on both sides) and the plant's lead-emission quota, and prices the run provisionally from the scheduled peak/off-peak split."
    roles: [ProductionSupervisor]
    code: 201
    input: [lot_id, bay_id, scheduled_start_at, scheduled_end_at]
    output: FormationRun
    side_effects:
      - "run_state initialises to SCHEDULED; charge_factor_used is frozen from the lot's pinned cell design formation_charge_factor."
      - "CALC formation_energy_charge variant provisional_nameplate computes estimated_energy_kwh, scheduled_peak_hours, scheduled_offpeak_hours, provisional_charge_cents and reserved_emission_g."
      - "plant.emission_reserved_g increases by reserved_emission_g and plant.emission_utilization_ratio plus compliance_posture are re-derived (a reservation landing exactly on 1.0000 is accepted and FREEZES the plant)."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_LOT_NOT_FOUND, ERR_FORMATION_BAY_NOT_FOUND, ERR_LOT_STATE_INVALID, ERR_PLANT_FROZEN, ERR_LOT_ENV_HELD, ERR_PLANT_SCOPE_MISMATCH, ERR_BAY_UNAVAILABLE, ERR_WINDOW_INVALID, ERR_BAY_WINDOW_CONFLICT, ERR_EMISSION_BUDGET_EXCEEDED]

  - method: GET
    path: "/formation-runs"
    description: "Lists formation runs, scheduled_start_at ASC then created_at ASC, filterable by lot, bay and run state."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector, SafetyOfficer]
    code: 200
    input: ["lot_id?", "bay_id?", "run_state?", "limit?", "offset?"]
    output: FormationRun[]

  - method: GET
    path: "/formation-runs/{id}"
    description: "Reads one formation run with both the provisional (nameplate/scheduled-window) and, once completed, the final (metered/actual-window) energy figures."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector, SafetyOfficer]
    code: 200
    input: []
    output: FormationRun
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_FORMATION_RUN_NOT_FOUND]

  - method: POST
    path: "/formation-runs/{id}/start"
    description: "Starts a SCHEDULED run. Requires an OPEN plant posture, a CLEAR lot and an AVAILABLE bay; stamps actual_start_at from the logical clock."
    roles: [ProductionSupervisor]
    code: 200
    input: ["actual_start_at?"]
    output: FormationRun
    side_effects:
      - "run_state becomes CHARGING; actual_start_at defaults to logical now when omitted."
      - "bay_status is NOT changed by a start: AVAILABLE and MAINTENANCE are the only two values, and occupancy is expressed purely by the run window reservation of §1.4 ERR_BAY_WINDOW_CONFLICT."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_FORMATION_RUN_NOT_FOUND, ERR_RUN_STATE_INVALID, ERR_PLANT_FROZEN, ERR_PLANT_RESTRICTED, ERR_LOT_ENV_HELD, ERR_BAY_UNAVAILABLE]

  - method: POST
    path: "/formation-runs/{id}/complete"
    description: "Closes a CHARGING run with its metered energy, actual end time and measured formation capacity. Re-prices the run on the FINAL variant (metered kWh over the ACTUAL window) and settles both the emission reservation and the plant's energy charge."
    roles: [ProductionSupervisor]
    code: 200
    input: [metered_energy_kwh, formation_capacity_pct, "actual_end_at?"]
    output: FormationRun
    side_effects:
      - "run_state becomes COMPLETED; actual_end_at defaults to logical now when omitted."
      - "CALC formation_energy_charge variant final_metered computes actual_peak_hours, actual_offpeak_hours, final_charge_cents and consumed_emission_g."
      - "plant.emission_reserved_g decreases by reserved_emission_g, plant.emission_consumed_g increases by consumed_emission_g, plant.formation_energy_charge_cents increases by final_charge_cents, and emission_utilization_ratio plus compliance_posture are re-derived (INVARIANT E1)."
      - "capacity_validation_result becomes PASS when formation_capacity_pct >= 92.00, otherwise FAIL; a FAIL increments lot.failed_formation_count."
      - "bay_status is untouched (it never left AVAILABLE); the bay window is freed for other runs because a COMPLETED run no longer participates in the ERR_BAY_WINDOW_CONFLICT scan."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_FORMATION_RUN_NOT_FOUND, ERR_RUN_STATE_INVALID, ERR_WINDOW_INVALID, ERR_METERED_ENERGY_OUT_OF_RANGE]

  - method: POST
    path: "/formation-runs/{id}/abort"
    description: "Aborts a SCHEDULED or CHARGING run. The emission reservation is released in full and nothing is consumed or charged."
    roles: [ProductionSupervisor, SafetyOfficer]
    code: 200
    input: [abort_reason]
    output: FormationRun
    side_effects:
      - "run_state becomes ABORTED; abort_reason is stored; final_charge_cents and consumed_emission_g stay 0."
      - "plant.emission_reserved_g decreases by reserved_emission_g and emission_utilization_ratio plus compliance_posture are re-derived (INVARIANT E1 closes with the reservation removed)."
      - "bay_status is untouched; the window is freed for other runs because an ABORTED run no longer participates in the ERR_BAY_WINDOW_CONFLICT scan."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_FORMATION_RUN_NOT_FOUND, ERR_RUN_STATE_INVALID]

  # --- CapacityTest --------------------------------------------------
  - method: POST
    path: "/capacity-tests"
    description: "Schedules a capacity or cycle-life test for a CERTIFIED assembly in a chamber. The chamber admits any number of concurrent tests as long as the aggregate draw_kw over every overlapping instant stays within its power cap; adjacent windows never overlap."
    roles: [QualityInspector]
    code: 201
    input: [assembly_id, chamber_id, test_type, scheduled_start_at, scheduled_end_at, draw_kw]
    output: CapacityTest
    side_effects:
      - "test_state initialises to SCHEDULED; measured_capacity_ah, cycles_completed, result and yield_pct initialise to null."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_ASSEMBLY_NOT_FOUND, ERR_TEST_CHAMBER_NOT_FOUND, ERR_LOT_STATE_INVALID, ERR_LOT_ENV_HELD, ERR_PLANT_SCOPE_MISMATCH, ERR_ASSEMBLY_NOT_CERTIFIED, ERR_CHAMBER_UNAVAILABLE, ERR_WINDOW_INVALID, ERR_CHAMBER_CAPACITY_EXCEEDED]

  - method: GET
    path: "/capacity-tests"
    description: "Lists capacity tests, scheduled_start_at ASC then created_at ASC, filterable by assembly, chamber, recording inspector, test type, state and result."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector, WarrantyAdministrator]
    code: 200
    input: ["assembly_id?", "chamber_id?", "recorded_by_worker_id?", "test_type?", "test_state?", "result?", "limit?", "offset?"]
    output: CapacityTest[]

  - method: GET
    path: "/capacity-tests/{id}"
    description: "Reads one capacity test with its measured capacity, cycles completed, verdict and derived yield_pct."
    roles: [PlantAdmin, ProductionSupervisor, QualityInspector, WarrantyAdministrator]
    code: 200
    input: []
    output: CapacityTest
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_CAPACITY_TEST_NOT_FOUND]

  - method: POST
    path: "/capacity-tests/{id}/record-result"
    description: "Records the outcome of a SCHEDULED test whose window has closed. CAPACITY tests carry measured_capacity_ah; CYCLE_LIFE tests carry measured_capacity_ah and cycles_completed. The verdict feeds the lot's acceptance counters and can quarantine the lot in the same request."
    roles: [QualityInspector]
    code: 200
    input: [measured_capacity_ah, "cycles_completed?"]
    output: CapacityTest
    side_effects:
      - "test_state becomes COMPLETED; recorded_by_worker_id is stamped with the acting worker and copied to lot.last_test_recorded_by_worker_id."
      - "CALC capacity_test_result computes yield_pct and result (PASS/FAIL) against the pinned design revision's nominal_capacity_ah and rated_cycles."
      - "lot.completed_test_count increases by 1; a FAIL increases lot.failed_test_count by 1 (CASCADE B hop 1); a PASS on a CYCLE_LIFE test increases lot.passed_cycle_life_count by 1."
      - "lot.lot_capacity_yield_pct is recomputed by CALC lot_capacity_yield over the current sampling window's completed tests."
      - "When lot.failed_test_count > lot.acceptance_number the lot moves LOT_TESTING -> QUARANTINED (CASCADE B hop 2), which revokes its CERTIFIED assemblies (hop 3) and voids their SCHEDULED tests (hop 4)."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_VALIDATION, ERR_ACTING_WORKER_NOT_FOUND, ERR_ACTOR_MEDICALLY_REMOVED, ERR_CAPACITY_TEST_NOT_FOUND, ERR_CAPACITY_TEST_STATE_INVALID, ERR_LOT_ENV_HELD, ERR_CYCLE_LIFE_SAMPLE_MISSING]

