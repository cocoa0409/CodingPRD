    instances:
      - name: interview_scheduling_and_hold_read_the_subject_officer_employment_dimension
        grounds:
          - validations[priority=8]
          - state_machines.Officer.ACTIVE_to_SEPARATED
          - state_machines.Officer.ACTIVE_to_RELIEVED_OF_DUTY
          - endpoints["POST /officers/{id}/employment-status"]
          - endpoints["POST /interview-sessions/{id}/hold"]
        distinguishing_aspect: |
          Whether an interview may be scheduled or held is decided by the employment_status of a
          different entity, the subject Officer: SEPARATED blocks both actions with
          ERR_OFFICER_SEPARATED while RELIEVED_OF_DUTY permits both, and an already SCHEDULED
          session becomes unholdable the moment its subject separates, without the session row
          changing at all.
