          assert:
            - "before the trigger: Consignor.${cons_id}.unclaimed_balance_cents == 25474 with ledger amounts -44000, +69474"
            - "the reversal mints exactly one PayoutLedgerEntry with entry_type SALE_REVERSAL_DEBIT, amount_cents == -69474 and balance_after_cents == -44000"
            - "invariant: the SALE_CREDIT and SALE_REVERSAL_DEBIT for ${sale_id} sum to exactly 0, and Consignor.${cons_id}.unclaimed_balance_cents is back to its pre-sale -44000"
            - "the ledger is append-only: GET /consignors/${cons_id}/ledger-entries returns total_count == 3 in effective_at ascending order (-44000, +69474, -69474); nothing was deleted or edited"
            - "the compensation is deliberately partial: Consignor.${cons_id}.lifetime_credits_cents is still 69474, because only positive entries feed it"
            - "Sale.${sale_id}.status == REVERSED with reversed_at == 2026-08-01T00:00:00Z; consignor_share_cents is still recorded as 69474 rather than zeroed"
            - "ConsignmentItem.${s1_id}.lifecycle_state == ON_FLOOR (markdown_sequence == 1, so not MARKED_DOWN) with placement_zone_id still ${zone_front_id} and current_price_cents 126317"
            - "the scheduled delivery is unwound too: DeliveryOrder.${do_id}.status == CANCELLED, which releases the crew window"
            - "FloorZone.${zone_front_id}.occupied_sqft == 24 before and after the reversal"
            - "a second POST /sales/${sale_id}/reverse returns 409 ERR_SALE_ALREADY_REVERSED and mints no fourth entry, so the compensation cannot be applied twice"

      - name: write_off_then_recovery_and_replacement_restores_zone_square_footage
        conserved_quantity: "floor area - FloorZone.occupied_sqft, with the SHRINKAGE_CREDIT / SHRINKAGE_RECOVERY_DEBIT pair as the money-side mirror of the same restoration"
        grounds:
          - endpoints[POST /consignment-items/{id}/write-off]
          - endpoints[POST /consignment-items/{id}/inventory-flag]
          - calculations.floor_zone_utilization
          - calculations.shrinkage_write_off
          - state_machines.ConsignmentItem.inventory_state
          - concurrency_rules[write-off-stale-item]
        distinguishing_aspect: |
          A different conserved quantity from the money instance: square feet of floor, which
          is a recomputed sum over a filtered membership rather than a running total of signed
          entries. The subtlety is that the quantity is conserved across a THREE-step
          excursion with an asymmetric middle: flagging MISSING must not free any square feet
          (SHRINKAGE_MISSING still occupies the floor), the write-off must free exactly 12,
          and only the re-placement puts them back - while the same excursion drives the
          money side to zero net through a credit and its recovery debit.
        test_recipe:
          setup:
            - "one consignor at floor 1 with no elevator on an ACTIVE STD-2026 agreement"
            - "three pieces collected on one completed 2-mover job from floor 1 (12000 + 10 * 2500 + 5500 bulky == 42500, cap 94483 not binding, balance -42500, consignor ACTIVE): S1 SOFA declared 189950 volume 65 footprint 24 graded B -> 126317; C1 CASEGOOD declared 60000 volume 20 footprint 18 graded A -> 51000; C2 CASEGOOD declared 20000 volume 13 footprint 12 graded A -> 17000"
            - "all three placed in Front A (capacity 200), so occupied_sqft is 54 and utilization_state is NORMAL"
            - "C2 flagged MISSING, then written off under optimistic concurrency with the version read immediately beforehand: credit round_half_up(17000 * 0.60) == 10200"
            - "the clock never moves, so C2's current_price_cents is still 17000 when the credit is computed"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { ps_id: "$.data.id" }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${ps_id}", sequence: 2, start_day_offset: 30, markdown_pct: 0.15, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Zed Abara", email: "zed@example.com", address_line: "29 Linden St", floor_number: 1, has_elevator: false, payout_method: "ACH" }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: "$.data.id" }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${ps_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Lawson sofa", category: "SOFA", declared_value_cents: 189950, photo_count: 5, volume_cuft: 65, footprint_sqft: 24 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { s1_id: "$.data.id" }
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Teak highboy", category: "CASEGOOD", declared_value_cents: 60000, photo_count: 4, volume_cuft: 20, footprint_sqft: 18 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Cane nightstand", category: "CASEGOOD", declared_value_cents: 20000, photo_count: 3, volume_cuft: 13, footprint_sqft: 12 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { c2_id: "$.data.id" }
            - call: "POST /consignment-items/${s1_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 7.0, photo_structure_score: 6.5, photo_completeness_score: 6.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /consignment-items/${c1_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /consignment-items/${c2_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
            - call: "POST /trucks"
              payload: { name: "Truck 1", capacity_volume_cuft: 600 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { truck_id: "$.data.id" }
            - call: "POST /pickup-jobs"
              payload: { consignor_id: "${cons_id}", truck_id: "${truck_id}", window_start: "2026-08-01T07:00:00Z", window_end: "2026-08-01T10:00:00Z", crew_size: 2, item_ids: ["${s1_id}", "${c1_id}", "${c2_id}"] }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
              captures: { job_id: "$.data.id" }
            - call: "POST /pickup-jobs/${job_id}/complete"
              payload: { actual_stair_flights: 0, actual_elevator_used: false, actual_crew_size: 2 }
              as: LogisticsCoordinator
              as_user_id: "logi-1"
            - call: "POST /consignment-items/${s1_id}/receive"
              payload: { photo_surface_score: 7.0, photo_structure_score: 6.5, photo_completeness_score: 6.0 }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /consignment-items/${c1_id}/receive"
              payload: { photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /consignment-items/${c2_id}/receive"
              payload: { photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /floor-zones"
              payload: { name: "Front A", zone_type: "SHOWROOM_FRONT", capacity_sqft: 200 }
              as: FloorOperator
              as_user_id: "floor-1"
              captures: { zone_front_id: "$.data.id" }
            - call: "POST /consignment-items/${s1_id}/place"
              payload: { placement_zone_id: "${zone_front_id}", tag_code: "T-1501" }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /consignment-items/${c1_id}/place"
              payload: { placement_zone_id: "${zone_front_id}", tag_code: "T-1502" }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /consignment-items/${c2_id}/place"
              payload: { placement_zone_id: "${zone_front_id}", tag_code: "T-1503" }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /consignment-items/${c2_id}/inventory-flag"
              payload: { flag: "MISSING" }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "GET /consignment-items/${c2_id}"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { c2_v: "$.data.version" }
            - call: "POST /consignment-items/${c2_id}/write-off"
              payload: { expected_item_version: "${c2_v}" }
              as: GalleryManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /consignment-items/${c2_id}/inventory-flag"
              payload: { flag: "RECOVERED" }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /consignment-items/${c2_id}/place"
              payload: { placement_zone_id: "${zone_front_id}", tag_code: "T-1503R" }
              as: FloorOperator
              as_user_id: "floor-1"
          assert:
            - "area snapshot 1, all three placed: FloorZone.${zone_front_id}.occupied_sqft == 54 and utilization_state == NORMAL"
            - "area snapshot 2, C2 flagged MISSING: occupied_sqft is STILL 54, because SHRINKAGE_MISSING pieces are inside the occupancy filter"
            - "area snapshot 3, C2 written off: occupied_sqft == 42, C2.inventory_state == WRITTEN_OFF_INV, C2.lifecycle_state == WRITTEN_OFF and C2.placement_zone_id == null"
            - "area snapshot 4, immediately after the RECOVERED flag: occupied_sqft is still 42, because the recovery restores custody without restoring a placement; C2.inventory_state == IN_CUSTODY and C2.lifecycle_state == AWAITING_PLACEMENT"
            - "area snapshot 5, after the re-placement: occupied_sqft == 54 again, exactly the starting value, with utilization_state NORMAL"
            - "money mirror: the write-off minted one SHRINKAGE_CREDIT of +10200 (balance -32300) and the recovery minted one SHRINKAGE_RECOVERY_DEBIT of exactly -10200 (balance -42500); the pair sums to 0"
            - "Consignor.${cons_id}.unclaimed_balance_cents == -42500, exactly its pre-write-off value, while lifetime_credits_cents == 10200 is not unwound"
            - "GET /consignors/${cons_id}/ledger-entries returns total_count == 3 with amounts -42500, +10200, -10200; GET /consignment-items/${c2_id}/ledger-entries returns total_count == 2"
            - "the re-placement is a real placement: C2.lifecycle_state == ON_FLOOR, tag_code == T-1503R, and clearance_relocation_pending == true because 17000 is below the clearance threshold and no CLEARANCE zone exists"
            - "S1 and C1 were never touched: their placement_zone_id is still ${zone_front_id} and their inventory_state is still IN_CUSTODY"
            - "the write-off was version-guarded: replaying POST /consignment-items/${c2_id}/write-off with the now-stale ${c2_v} returns 412 ERR_STALE_ITEM_VERSION and mints no further entry"
