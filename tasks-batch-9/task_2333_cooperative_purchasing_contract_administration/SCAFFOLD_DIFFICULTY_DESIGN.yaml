          - calculations.member_usage_total
          - calculations.net_unit_price
          - entities.MemberAgency.fields.committed_spend_cents
          - entities.MasterContract.fields.usage_chargeable_cents_total
          - entities.ContractUsage.fields.discount_tier_index
        distinguishing_aspect: |
          The tier ladder is keyed on a SNAPSHOT of committed_spend_cents, so retracting the primer must
          restore the two ledgers to exactly 120888 and 118750 while leaving the already-priced usage
          frozen at tier 1 (net 11875, effective_fee_rate_bps 180, total 120888). The proof is the NEXT
          order: with the primer gone the snapshot is only 120888, so an identical quantity-10 order
          prices at tier 0 for 127500 - a different number for the same request. An implementation that
          re-prices historical usages on retraction, or that fails to reverse the exact total, lands on a
          different committed_spend_cents than 248388.
