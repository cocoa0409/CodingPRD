          trigger:
            - call: "POST /power/ppas/${ppa_id}/settlement-lines/${line_id}/reverse"
              payload: {}
              as: SettlementApprover
          assert:
            - "PpaAccrual.${accrual_id}.lifecycle_state == ACCRUAL_OPEN again after the reversal"
            - "SettlementAllowance.${allow_id}.lifecycle_state == ALLOWANCE_ISSUED again after the reversal"
            - "SettlementLine.${line_id}.status == SETTLEMENT_REVERSED"
            - "a line created after the reversal for the same period reads cap_side_pool_cents == 100000"
            - "Site.${site_id}.lifetime_customer_billable_cents == 0"