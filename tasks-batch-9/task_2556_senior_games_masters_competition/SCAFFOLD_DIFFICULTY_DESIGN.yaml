            - "AccommodationBlock.${blk_id}.version advanced on each of the four accepted stays and did NOT advance on the refused one, so ${blk_v4} equals ${blk_v3}"
            - "VillageStay.${stay_ada_id}.nights == 3 and total_charge_cents == 30000, confirming the same half-open date rule applied to the setup stay"


  # ===================================================================
  # RULE 9 - Compensating invariant over THREE DIFFERENT conserved
  #          quantities, each with its own undo path
  #   9a Personnel.assigned_minutes_total      (minutes)
  #   9b AccommodationBlock.reserved_bed_nights (bed-nights)
  #   9c GamesEdition.sponsorship_recognized_cents (cents)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assignment_release_restores_personnel_minutes_ledger_without_drift
        grounds:
          - state_machines.PersonnelAssignment[ASSIGNED->RELEASED]
          - state_machines.PersonnelAssignment[CONFIRMED->RELEASED]
          - entities.Personnel.fields.assigned_minutes_total
          - entities.SessionSlot.fields.confirmed_official_count
          - endpoints[POST /personnel-assignments/{personnel_assignment_id}/release]
          - validations[priority=38]
        distinguishing_aspect: |
          CONSERVED QUANTITY: MINUTES on Personnel.assigned_minutes_total. Release is the exact
          inverse of assignment creation: it subtracts the assignment's SNAPSHOTTED
          duration_minutes, not a recomputed slot length, and re-creating the same assignment
          returns the ledger to the byte-identical baseline. Releasing from CONFIRMED must
          compensate TWO ledgers at once (the minutes total AND
          SessionSlot.confirmed_official_count) while releasing from ASSIGNED compensates only
          one, and a second release must compensate ZERO ledgers.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN, one LOW-contact TRACK sport with required_certification_level 2, one 60-64 event with no entries."
            - "Venue A (North Oval) with competition_area_count 4, EP_ADVANCED and an on-site medical bay."
            - "One OFFICIAL, Dana Reyes, certification_level 3, certified_sport_codes ['TRACK']."
            - "Three slots at Venue A on 2026-09-12, all teardown_buffer_minutes 0 and required_official_count 1: S1 09:00-10:00 (60 min), S2 11:00-12:30 (90 min), S3 13:30-15:00 (90 min). All gaps exceed the closed-interval test and all are at one venue, so no travel buffer applies."
            - "Dana holds ASSIGNED assignments on all three slots, so the BASELINE Personnel.assigned_minutes_total is 60 + 90 + 90 == 240, comfortably under MAX_DAILY_ASSIGNED_MINUTES 480."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/venues"
              payload: { games_edition_id: "${ed_id}", name: "North Oval", competition_area_count: 4, spectator_capacity: 500, emergency_protocol_code: "EP_ADVANCED", has_onsite_medical_bay: true }
              as: GamesAdmin
              captures: { vn_a_id: $.data.id }
            - call: "POST /senior-games/personnel"
              payload: { games_edition_id: "${ed_id}", full_name: "Dana Reyes", personnel_type: "OFFICIAL", certification_level: 3, certified_sport_codes: ["TRACK"] }
              as: GamesAdmin
              captures: { pers_id: $.data.id }
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_a_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T09:00:00Z", end_utc: "2026-09-12T10:00:00Z", teardown_buffer_minutes: 0, required_official_count: 1 }
              as: GamesAdmin
              captures: { slot_s1_id: $.data.id }
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_a_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T11:00:00Z", end_utc: "2026-09-12T12:30:00Z", teardown_buffer_minutes: 0, required_official_count: 1 }
              as: GamesAdmin
              captures: { slot_s2_id: $.data.id }
            - call: "POST /senior-games/session-slots"
              payload: { venue_id: "${vn_a_id}", sport_event_id: "${ev_id}", start_utc: "2026-09-12T13:30:00Z", end_utc: "2026-09-12T15:00:00Z", teardown_buffer_minutes: 0, required_official_count: 1 }
              as: GamesAdmin
              captures: { slot_s3_id: $.data.id }
            - call: "POST /senior-games/personnel-assignments"
              payload: { personnel_id: "${pers_id}", session_slot_id: "${slot_s1_id}", role_at_event: "CHIEF_JUDGE" }
              as: GamesAdmin
              captures: { asg_s1_id: $.data.id }
            - call: "POST /senior-games/personnel-assignments"
              payload: { personnel_id: "${pers_id}", session_slot_id: "${slot_s2_id}", role_at_event: "JUDGE" }
              as: GamesAdmin
              captures: { asg_s2_id: $.data.id }
            - call: "POST /senior-games/personnel-assignments"
              payload: { personnel_id: "${pers_id}", session_slot_id: "${slot_s3_id}", role_at_event: "TIMER" }
              as: GamesAdmin
              captures: { asg_s3_id: $.data.id }
          trigger:
            - call: "POST /senior-games/personnel-assignments/${asg_s2_id}/release"
              payload: { reason: "Judge reassigned to a concurrent discipline" }
              as: GamesAdmin
            - call: "POST /senior-games/personnel-assignments"
              payload: { personnel_id: "${pers_id}", session_slot_id: "${slot_s2_id}", role_at_event: "JUDGE" }
              as: GamesAdmin
              captures: { asg_s2b_id: $.data.id }
            - call: "POST /senior-games/personnel-assignments/${asg_s3_id}/confirm"
              payload: {}
              as: SportOfficial
              as_user_id: "${pers_id}"
            - call: "POST /senior-games/personnel-assignments/${asg_s3_id}/release"
              payload: { reason: "Timer withdrew after confirming" }
              as: GamesAdmin
            - call: "POST /senior-games/personnel-assignments/${asg_s2_id}/release"
              payload: { reason: "Duplicate release attempt" }
              as: GamesAdmin
          assert:
            - "RELEASE FROM ASSIGNED SUBTRACTS EXACTLY THE SNAPSHOT: after releasing ${asg_s2_id}, PersonnelAssignment.${asg_s2_id}.status == RELEASED and Personnel.${pers_id}.assigned_minutes_total == 150, i.e. 240 - 90"
            - "PersonnelAssignment.${asg_s2_id}.duration_minutes is still 90 after release, so the snapshot is preserved rather than zeroed, and the ledger arithmetic used that snapshot"
            - "NO DRIFT ON REDO: after re-assigning Dana to ${slot_s2_id}, PersonnelAssignment.${asg_s2b_id}.duration_minutes == 90 and Personnel.${pers_id}.assigned_minutes_total == 240, exactly the pre-release baseline and not 239 or 241"
            - "CONFIRM MOVES NO MINUTES: after confirming ${asg_s3_id}, PersonnelAssignment.${asg_s3_id}.status == CONFIRMED, Personnel.${pers_id}.assigned_minutes_total is still 240, and SessionSlot.${slot_s3_id}.confirmed_official_count == 1"
            - "RELEASE FROM CONFIRMED COMPENSATES TWO LEDGERS: after releasing ${asg_s3_id}, PersonnelAssignment.${asg_s3_id}.status == RELEASED, Personnel.${pers_id}.assigned_minutes_total == 150 and SessionSlot.${slot_s3_id}.confirmed_official_count == 0"
            - "the ASSIGNED-path release of ${asg_s2_id} left SessionSlot.${slot_s2_id}.confirmed_official_count at 0 both before and after, so the second ledger is touched only on the CONFIRMED path"
            - "SECOND RELEASE COMPENSATES NOTHING: the repeat release of ${asg_s2_id} returns HTTP 409 with error_id == ERR_ALREADY_TERMINAL and Personnel.${pers_id}.assigned_minutes_total is still 150, so no double decrement to 60 occurred"
            - "PersonnelAssignment.${asg_s2_id}.version is unchanged by the refused second release"
            - "Personnel.${pers_id}.no_show_count == 0 throughout, so the release path never leaked into the no-show ledger"

      - name: village_stay_cancel_restores_block_bed_nights_and_frees_the_night
        grounds:
          - state_machines.VillageStay[RESERVED->CANCELLED]
          - entities.AccommodationBlock.fields.reserved_bed_nights
          - entities.VillageStay.fields.total_charge_cents
          - endpoints[POST /village-stays/{village_stay_id}/cancel]
          - calculations.bed_night_occupancy
          - validations[priority=78]
        distinguishing_aspect: |
          CONSERVED QUANTITY: BED-NIGHTS on AccommodationBlock.reserved_bed_nights, a different
          unit and a different ledger from the minutes case. Two features make this compensation
          non-trivial: the undo must release the resource itself and not merely the counter, proven
          by an identical request that is REFUSED before the cancel and ACCEPTED after it; and the
          undo is deliberately ASYMMETRIC, because cancel additionally zeroes the stay's
          total_charge_cents rather than conserving it, so money and bed-nights unwind by
          different rules on the same transition.
        test_recipe:
          setup:
            - "One GamesEdition in REGISTRATION_OPEN with competition_start_date 2026-09-10 and competition_end_date 2026-09-20, so the village window is 2026-09-08 through 2026-09-22."
            - "One AccommodationBlock 'Cedar Lodge' with bed_capacity 1 and nightly_rate_cents 12000, so any single reserved night saturates the block."
            - "Two athletes Ada and Ben, both born 1966-03-02 and resident in IL."
            - "Ada holds a stay 2026-09-09 -> 2026-09-14, i.e. nights 09-09 through 09-13, so nights == 5, total_charge_cents == 60000 and the block's reserved_bed_nights == 5."
            - "The logical clock is at its 2026-08-01T00:00:00Z default, so no stay has checked in."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sports"
              payload: { sport_code: "TRACK", name: "Track and Field", contact_class: "LOW", mark_direction: "LOWER_IS_BETTER", required_certification_level: 2, min_age: 50 }
              as: GamesAdmin
              captures: { sp_track_id: $.data.id }
            - call: "POST /senior-games/sport-events"
              payload: { sport_id: "${sp_track_id}", games_edition_id: "${ed_id}", event_code: "T100M", age_group_code: "60-64", gender_division: "MEN", entry_fee_cents: 6000, capacity: 8, min_entries_to_stage: 1 }
              as: GamesAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /senior-games/games-editions/${ed_id}/open-registration"
              payload: {}
              as: GamesAdmin
            - call: "POST /senior-games/accommodation-blocks"
              payload: { games_edition_id: "${ed_id}", name: "Cedar Lodge", bed_capacity: 1, nightly_rate_cents: 12000, accessible_units: 1 }
              as: GamesAdmin
              captures: { blk_id: $.data.id, blk_v1: $.data.version }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ada Fenn", email: "ada.fenn@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_ada_id: $.data.id }
            - call: "POST /senior-games/athletes"
              payload: { games_edition_id: "${ed_id}", full_name: "Ben Orsi", email: "ben.orsi@example.org", date_of_birth: "1966-03-02", residency_state_code: "IL" }
              as: RegistrationOfficer
              captures: { ath_ben_id: $.data.id }
            - call: "POST /senior-games/village-stays"
              payload: { athlete_id: "${ath_ada_id}", accommodation_block_id: "${blk_id}", check_in_date: "2026-09-09", check_out_date: "2026-09-14", expected_block_version: "${blk_v1}" }
              as: GamesAdmin
              captures: { stay_ada_id: $.data.id }
          trigger:
            - call: "GET /senior-games/accommodation-blocks/${blk_id}"
              payload: {}
              as: GamesAdmin
              captures: { blk_v2: $.data.version }
            - call: "POST /senior-games/village-stays"
              payload: { athlete_id: "${ath_ben_id}", accommodation_block_id: "${blk_id}", check_in_date: "2026-09-11", check_out_date: "2026-09-12", expected_block_version: "${blk_v2}" }
              as: GamesAdmin
            - call: "POST /senior-games/village-stays/${stay_ada_id}/cancel"
              payload: { reason: "Athlete arranged private lodging" }
              as: GamesAdmin
            - call: "GET /senior-games/accommodation-blocks/${blk_id}"
              payload: {}
              as: GamesAdmin
              captures: { blk_v3: $.data.version }
            - call: "POST /senior-games/village-stays"
              payload: { athlete_id: "${ath_ben_id}", accommodation_block_id: "${blk_id}", check_in_date: "2026-09-11", check_out_date: "2026-09-12", expected_block_version: "${blk_v3}" }
              as: GamesAdmin
              captures: { stay_ben_id: $.data.id }
            - call: "POST /senior-games/village-stays/${stay_ada_id}/cancel"
              payload: { reason: "Duplicate cancellation attempt" }
              as: GamesAdmin
          assert:
            - "BEFORE THE UNDO THE NIGHT IS TAKEN: Ben's 2026-09-11 -> 2026-09-12 request returns HTTP 409 with error_id == ERR_BLOCK_NIGHT_FULL, because night 09-11 holds Ada's reservation against bed_capacity 1"
            - "CANCEL SUBTRACTS EXACTLY THE STAY'S NIGHTS: after the cancel, VillageStay.${stay_ada_id}.status == CANCELLED and AccommodationBlock.${blk_id}.reserved_bed_nights == 0, i.e. 5 - 5"
            - "VillageStay.${stay_ada_id}.nights is still 5 after cancellation, so the quantity used for the decrement is preserved on the row rather than zeroed"
            - "ASYMMETRIC UNDO ON MONEY: VillageStay.${stay_ada_id}.total_charge_cents == 0 after the cancel, down from 60000, so the charge is erased rather than conserved even though the bed-night quantity is conserved"
            - "THE RESOURCE ITSELF IS RELEASED, NOT JUST THE COUNTER: the byte-identical 2026-09-11 -> 2026-09-12 request now returns HTTP 201 with VillageStay.${stay_ben_id}.status == RESERVED, nights == 1 and total_charge_cents == 12000"
            - "AccommodationBlock.${blk_id}.reserved_bed_nights == 1 after Ben's stay is accepted, so the ledger rebuilt from zero rather than resuming from a stale 5"
            - "SECOND CANCEL COMPENSATES NOTHING: the repeat cancel of ${stay_ada_id} returns HTTP 409 with error_id == ERR_ALREADY_TERMINAL and AccommodationBlock.${blk_id}.reserved_bed_nights is still 1, so the ledger never went negative to -4"
            - "${blk_v3} is greater than ${blk_v2} because the cancel advanced the block's version, while the refused stay-creation between them advanced nothing"
            - "AccommodationBlock.${blk_id}.bed_capacity is still 1 and nightly_rate_cents is still 12000, so compensation touched only the derived ledger"

      - name: sponsorship_withdraw_restores_edition_recognition_ledger_in_cents
        grounds:
          - state_machines.SponsorshipCommitment[ALLOCATED->WITHDRAWN]
          - state_machines.SponsorshipCommitment[PLEDGED->WITHDRAWN]
          - entities.GamesEdition.fields.sponsorship_recognized_cents
          - entities.SponsorshipCommitment.fields.allocation_map
          - calculations.sponsorship_recognition_allocation
          - endpoints[POST /sponsorship-commitments/{sponsorship_commitment_id}/withdraw]
        distinguishing_aspect: |
          CONSERVED QUANTITY: CENTS on GamesEdition.sponsorship_recognized_cents, a third unit on a
          third ledger. What makes this compensation distinctive is that the amount unwound is NOT
          the amount the sponsor pledged: allocation recognized 262606 cents against a 250100-cent
          pledge because of the per-bucket rounding, and withdrawal must subtract the recognized
          262606 rather than the pledged 250100 or any recomputed figure. The undo is also
          STATE-CONDITIONAL on the same endpoint: withdrawing from PLEDGED must move the ledger by
          zero, while withdrawing from ALLOCATED must move it by the full recognized amount.
        test_recipe:
          setup:
            - "One GamesEdition, still DRAFT, with municipal_support_cents 0; sponsorship writes are permitted in every status except IMPACT_FINALIZED, so no edition advance is needed."
            - "Commitment C1: Northline Bank, CORPORATE, SILVER, pledged_cents 250100. Its SILVER multiplier of 1.05 with per-bucket rounding recognizes 262606 cents, one cent above the 262605 a sum-then-round reading would produce."
            - "Commitment C2: City of Springfield, MUNICIPAL, BRONZE, pledged_cents 120000. The BRONZE multiplier of 1.0 recognizes exactly 120000."
            - "Commitment C3: Halberd Foundation, FOUNDATION, GOLD, pledged_cents 400000, left in PLEDGED and never allocated; had it been allocated it would have recognized 448000."
            - "C1 and C2 are both ALLOCATED, so the BASELINE GamesEdition.sponsorship_recognized_cents is 262606 + 120000 == 382606."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z", municipal_support_cents: 0 }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/sponsorship-commitments"
              payload: { games_edition_id: "${ed_id}", sponsor_name: "Northline Bank", sponsor_kind: "CORPORATE", tier: "SILVER", pledged_cents: 250100 }
              as: SponsorLiaison
              captures: { spo_c1_id: $.data.id }
            - call: "POST /senior-games/sponsorship-commitments"
              payload: { games_edition_id: "${ed_id}", sponsor_name: "City of Springfield", sponsor_kind: "MUNICIPAL", tier: "BRONZE", pledged_cents: 120000 }
              as: SponsorLiaison
              captures: { spo_c2_id: $.data.id }
            - call: "POST /senior-games/sponsorship-commitments"
              payload: { games_edition_id: "${ed_id}", sponsor_name: "Halberd Foundation", sponsor_kind: "FOUNDATION", tier: "GOLD", pledged_cents: 400000 }
              as: SponsorLiaison
              captures: { spo_c3_id: $.data.id }
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: SponsorLiaison
              captures: { ed_v1: $.data.version }
            - call: "POST /senior-games/sponsorship-commitments/${spo_c1_id}/allocate"
              payload: { expected_games_edition_version: "${ed_v1}" }
              as: SponsorLiaison
            - call: "GET /senior-games/games-editions/${ed_id}"
              payload: {}
              as: SponsorLiaison
              captures: { ed_v2: $.data.version }
            - call: "POST /senior-games/sponsorship-commitments/${spo_c2_id}/allocate"
              payload: { expected_games_edition_version: "${ed_v2}" }
              as: SponsorLiaison
          trigger:
            - call: "POST /senior-games/sponsorship-commitments/${spo_c3_id}/withdraw"
              payload: { reason: "Foundation deferred to the following biennium" }
              as: SponsorLiaison
            - call: "POST /senior-games/sponsorship-commitments/${spo_c1_id}/withdraw"
              payload: { reason: "Bank merger cancelled the sponsorship" }
              as: SponsorLiaison
            - call: "POST /senior-games/sponsorship-commitments/${spo_c2_id}/withdraw"
              payload: { reason: "Municipal budget amendment" }
              as: SponsorLiaison
            - call: "POST /senior-games/sponsorship-commitments/${spo_c1_id}/withdraw"
              payload: { reason: "Duplicate withdrawal attempt" }
              as: SponsorLiaison
          assert:
            - "BASELINE: after setup, SponsorshipCommitment.${spo_c1_id}.recognized_cents == 262606, SponsorshipCommitment.${spo_c2_id}.recognized_cents == 120000, and GamesEdition.${ed_id}.sponsorship_recognized_cents == 382606"
            - "WITHDRAWING A PLEDGED COMMITMENT MOVES NOTHING: after C3's withdrawal, SponsorshipCommitment.${spo_c3_id}.status == WITHDRAWN, its recognized_cents is still 0, and GamesEdition.${ed_id}.sponsorship_recognized_cents is still 382606"
            - "THE LEDGER UNWINDS THE RECOGNIZED AMOUNT, NOT THE PLEDGE: after C1's withdrawal, GamesEdition.${ed_id}.sponsorship_recognized_cents == 120000, i.e. 382606 - 262606; subtracting the pledged 250100 would have left 132506 and subtracting a sum-then-round 262605 would have left 120001"
            - "SponsorshipCommitment.${spo_c1_id}.status == WITHDRAWN with recognized_cents == 0 and allocation_map == {} after the withdrawal, so the per-bucket breakdown is cleared alongside the total"
            - "the four buckets recorded before withdrawal were VENUE_SIGNAGE 105042, ATHLETE_SERVICES 78782, MEDICAL_COVERAGE 52521 and SOCIAL_PROGRAM 26261, summing to the 262606 that was later unwound"
            - "LEDGER RETURNS TO ZERO: after C2's withdrawal, GamesEdition.${ed_id}.sponsorship_recognized_cents == 0 and SponsorshipCommitment.${spo_c2_id}.allocation_map == {}"
            - "SECOND WITHDRAWAL COMPENSATES NOTHING: the repeat withdrawal of ${spo_c1_id} returns HTTP 409 with error_id == ERR_ALREADY_TERMINAL and GamesEdition.${ed_id}.sponsorship_recognized_cents is still 0, so the ledger never went negative to -262606"
            - "GamesEdition.${ed_id}.version advanced on each allocate and on each of the two ALLOCATED withdrawals, did NOT advance on the PLEDGED withdrawal of ${spo_c3_id}, and did NOT advance on the refused repeat withdrawal"
            - "every SponsorshipCommitment.pledged_cents is unchanged throughout (250100, 120000, 400000), so compensation touched only recognized_cents, allocation_map and the edition ledger"
