              captures: { sa_west: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_west}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_east}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
          trigger:
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_west}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
          assert:
            - "the second enrollment returns 409 ERR_DUPLICATE_PARCEL_APN"
            - "GET /tdr/sending-parcels?sending_area_id=${sa_west} returns total_count 0"
            - "SendingParcel.${parcel_id}.sending_area_id == ${sa_east} and baseline_allocation_units == 22 (untouched)"
            - "an enrollment with apn APN-002 under SA-WEST returns 201 with baseline_allocation_units 23 — the V2 area's own formula, proving the refusal was about the APN and not the area"

      - name: area_codes_are_unique_across_sending_and_receiving_designations
        claim_type: violation_to_error
        grounds:
          - validations.priority_34_unique_area_code
          - errors.ERR_DUPLICATE_AREA_CODE
        distinguishing_aspect: "The uniqueness domain spans TWO entities: a receiving area may not take a code already used by a sending area (and vice versa), so the check cannot be implemented as a per-table constraint."
        test_recipe:
          setup:
            - "logical clock left at its 2026-08-01T00:00:00Z startup default"
            - "sending area with code ZONE-1 already designated (left in DRAFT — the collision does not depend on activation)"
          setup_api_calls:
            - call: "POST /tdr/sending-areas"
              payload: { code: "ZONE-1", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /tdr/receiving-areas"
              payload: { code: "ZONE-1", name: "Core District", neighborhood_code: "NB-CORE", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: true }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "ZONE-1", name: "East Ridge Duplicate", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
            - call: "POST /tdr/receiving-areas"
              payload: { code: "ZONE-2", name: "Core District", neighborhood_code: "NB-CORE", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: true }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id }
          assert:
            - "the ZONE-1 receiving area returns 409 ERR_DUPLICATE_AREA_CODE"
            - "the second ZONE-1 sending area also returns 409 ERR_DUPLICATE_AREA_CODE"
            - "the ZONE-2 receiving area returns 201 with status DRAFT, absorbed_units 0, reserved_units 0, and an empty eligible_sending_area_codes list"
            - "GET /tdr/sending-areas returns total_count 1 and GET /tdr/receiving-areas returns total_count 1"

      - name: suspended_party_safety_check_outranks_the_certificate_state_check
        claim_type: priority_ordering
        grounds:
          - validations.priority_10_party_suspended
          - validations.priority_20_certificate_transferable
          - errors.ERR_PARTY_SUSPENDED
          - errors.ERR_CERTIFICATE_NOT_TRANSFERABLE
        distinguishing_aspect: "A single split request violates priority 10 (the holder is SUSPENDED) and priority 20 (the certificate is UNDER_CONTRACT) at the same time. The party-safety error must win, because the program's answer to a suspended participant is the same whatever state its paper is in — and this pair is auth/safety versus state, distinct from the state/fiscal and safety/constraint pairs designed in §1.8."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER (version 1 at creation), DEVELOPER (credited 30000000), MUNICIPAL_BANK parties; appraisal schedule for NB-EAST (1234567 cents, 250 bps)"
            - "ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified"
            - "a PRIVATE sale of all 22 units proposed at 30000000 and left unsettled, so the certificate is UNDER_CONTRACT with units_encumbered 22"
            - "the landowner then SUSPENDED by an administrative account action"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id, own_v: $.data.version }
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id, dev_v: $.data.version }
            - call: "POST /tdr/parties"
              payload: { kind: "MUNICIPAL_BANK", legal_name: "City TDR Bank", contact_email: "bank@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { bank_id: $.data.id }
            - call: "POST /tdr/parties/${dev_id}/account-actions"
              payload: { action: "CREDIT", amount_cents: 30000000, expected_party_version: "${dev_v}" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id }
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${dev_id}", channel: "PRIVATE", units: 22, conveyance_mode: "WHOLE", agreed_price_cents: 30000000 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { mtx_id: $.data.id }
            - call: "GET /tdr/certificates/${cert_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { cert_v: $.data.version }
            - call: "POST /tdr/parties/${own_id}/account-actions"
              payload: { action: "SUSPEND", expected_party_version: "${own_v}", note: "compliance hold" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 5, expected_certificate_version: "${cert_v}" }
              as: Landowner
              as_user_id: "${own_id}"
          assert:
            - "the split returns 409 ERR_PARTY_SUSPENDED"
            - "the split does NOT return ERR_CERTIFICATE_NOT_TRANSFERABLE, ERR_INSUFFICIENT_CERTIFICATE_UNITS, or ERR_STALE_PARENT_VERSION"
            - "Party.${own_id}.status == SUSPENDED"
            - "Certificate.${cert_id}.market_status == UNDER_CONTRACT, units_encumbered == 22, split_count == 0, units_split_out == 0"
            - "GET /tdr/certificates?parent_certificate_id=${cert_id} returns total_count 0"
            - "MarketTransaction.${mtx_id}.status == PROPOSED (untouched)"

      - name: appraisal_window_temporal_validation_is_covered_by_the_overlap_instance
        claim_type: temporal_validation
        grounds:
          - validations.priority_29_appraisal_overlap
          - errors.ERR_APPRAISAL_PERIOD_OVERLAP
        distinguishing_aspect: "Half-open appraisal windows: touching endpoints are legal, a one-day intrusion is not."
        excluded_because:
          difficulty_instance: appraisal_calendar_adjacency_allowed_overlap_rejected
          rationale: "That §1.8 resource_temporal_overlap instance publishes an adjacent window (accepted), then an overlapping one (ERR_APPRAISAL_PERIOD_OVERLAP), and additionally shows a same-window schedule in a DIFFERENT neighborhood being accepted, which covers the temporal claim and its scoping at once."
      - name: cross_entity_state_validation_is_covered_by_the_area_status_gate_instance
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_26_sending_area_active
          - errors.ERR_SENDING_AREA_NOT_ACTIVE
        distinguishing_aspect: "A parcel enrollment's legality depends on a different entity's status (the sending area's), tested in both the passing and failing configuration."
        excluded_because:
          difficulty_instance: parcel_enrollment_gated_by_sending_area_status
          rationale: "That §1.8 cross_entity_state_dependency instance enrolls into a DRAFT area (rejected), activates the area, and re-enrolls successfully within one recipe, asserting the parcel's absence in between."
      - name: aggregate_cap_validation_is_covered_by_the_absorption_boundary_instance
        claim_type: aggregate_validation
        grounds:
          - validations.priority_41_absorption_cap
          - errors.ERR_ABSORPTION_CAP_EXCEEDED
        distinguishing_aspect: "Each finalization is individually valid, but their collective absorbed units may not exceed the receiving area's cap; the boundary is inclusive."
        excluded_because:
          difficulty_instance: absorption_cap_inclusive_unit_boundary_at_finalization
          rationale: "That §1.8 boundary_precision_check instance finalizes exactly onto the cap (accepted, area SUSPENDED) and one unit over it (ERR_ABSORPTION_CAP_EXCEEDED) on twin areas, which is the aggregate claim in its sharpest form."

  # ===========================================================================
  # §1.9.5 Endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: closing_a_sending_area_suspends_open_applications_and_freezes_approved_ones
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_tdr_sending-areas_id_close
          - state_machines.SendingArea.ACTIVE_to_CLOSED
          - state_machines.SeveranceApplication.SUBMITTED_to_SUSPENDED
          - validations.priority_26_sending_area_active
        distinguishing_aspect: "The manual close is the only ACTIVE -> CLOSED path an operator can trigger directly, and its cascade is deliberately partial: SUBMITTED / UNDER_REVIEW / REVISION_REQUESTED applications are suspended with a stamped denial_reason, while an APPROVED application is left APPROVED and merely becomes uncertifiable through the priority 26 gate. Nothing new may be filed against the area afterwards."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER party; ACTIVE SA-EAST (cap 200)"
            - "parcel A APN-A01 (40.00 / 0.00 / LOCAL / 0) -> baseline 10; application A for 10 units left SUBMITTED"
            - "parcel B APN-B01 (100.00 / 22.00 / PRIME / 2) -> baseline 22; application B screened and APPROVED for 22 units"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-A01", gross_acres: 40.00, constrained_acres: 0.00, soil_class: "LOCAL", existing_dwelling_units: 0 }
              as: ProgramAdministrator
              captures: { parcel_a: $.data.id }
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-B01", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_b: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_a}", applicant_party_id: "${own_id}", requested_units: 10 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_a: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_b}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_b: $.data.id }
            - call: "POST /tdr/severance-applications/${app_b}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_b}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /tdr/sending-areas/${sa_id}/close"
              payload: { reason: "designation retired by ordinance" }
              as: ProgramAdministrator
            - call: "POST /tdr/severance-applications/${app_b}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_a}", applicant_party_id: "${own_id}", requested_units: 5 }
              as: Landowner
              as_user_id: "${own_id}"
          assert:
            - "the close returns 200 with SendingArea.${sa_id}.status == CLOSED and version == 3"
            - "SeveranceApplication.${app_a}.status == SUSPENDED with denial_reason SENDING_AREA_CLOSED and version == 2"
            - "SeveranceApplication.${app_b}.status == APPROVED with allocated_units == 22 and denial_reason == null"
            - "the certify of ${app_b} returns 409 ERR_SENDING_AREA_NOT_ACTIVE"
            - "GET /tdr/certificates?origin_sending_area_id=${sa_id} returns total_count 0 and SendingArea.${sa_id}.issued_certificate_count == 0"
            - "the new severance application on parcel A returns 409 ERR_SENDING_AREA_NOT_ACTIVE, not ERR_PARCEL_HAS_OPEN_APPLICATION"
            - "SendingArea.${sa_id}.severed_units_total == 0 — a close severs nothing"

      - name: chain_of_title_reads_back_issuance_then_sale_in_sequence
        claim_type: computed_read
        grounds:
          - endpoints.GET_tdr_certificate-transfers
          - endpoints.GET_tdr_certificate-transfers_id
          - entities.CertificateTransfer
          - endpoints.POST_tdr_market-transactions_id_settle
        distinguishing_aspect: "The registry's chain of title is a read model over an append-only log: after one issuance and one settled private sale the certificate has exactly two rows with seq_no 1 and 2, and each declared filter selects a different slice of the same log — from_party_id finds only the sale, to_party_id finds one row per counterparty, and market_transaction_id ties the sale row back to the settlement that produced it while the issuance row keeps a null there."
