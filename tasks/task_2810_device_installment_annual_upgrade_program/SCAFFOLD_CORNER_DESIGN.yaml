  # ===========================================================================
  - section: state_machines
    instances:
      - name: newly_created_entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.CreditApplication.initial_state_SUBMITTED
          - state_machines.InstallmentLoan.status.initial_state_ACTIVE
          - state_machines.InstallmentLoan.delinquency_state.initial_state_CURRENT
          - state_machines.Installment.initial_state_SCHEDULED
          - state_machines.DeviceUnit.initial_states
          - state_machines.CarrierAccount.initial_state_PENDING
          - state_machines.PayoffQuote.initial_state_ISSUED
        distinguishing_aspect: |
          Seven state machines each begin on their declared initial state and nowhere else:
          CreditApplication SUBMITTED, InstallmentLoan ACTIVE/CURRENT, all 24 Installments
          SCHEDULED, DeviceUnit UNACTIVATED+LOCKED+WITH_CUSTOMER on all three dimensions,
          CarrierAccount PENDING, PayoffQuote ISSUED — and the loan additionally starts with
          protection_coverage_status ACTIVE, upgrade_hold_flag false and days_past_due 0.
        test_recipe:
          setup:
            - "A Handset B model and a customer with a PRIME-decided application, at the startup clock."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
