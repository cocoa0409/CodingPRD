            - { call: "POST /api/dialysis-machines/${m1}/assign", payload: { patient_id: "${p2}", expected_machine_version: "${m1v3}" }, as: BiomedTechnician, captures: { m1_reas: $.data.assigned_patient_id } }
            - { call: "POST /api/dialysis-machines/${m1}/assign", payload: { patient_id: "${p1}", expected_machine_version: "${m1v3}" }, as: BiomedTechnician, captures: { e7: $.data.error_id } }
            - { call: "GET /api/patients/${p2}", as: ProgramAdmin, captures: { p2v: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${p2}", plan_mode: BACKUP_MACHINE, expected_patient_version: "${p2v}" }, as: HomeNurse, as_user_id: "nurse-1", captures: { e8: $.data.error_id } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${p2}", plan_mode: BACKUP_MACHINE, backup_machine_id: "${m1}", expected_patient_version: "${p2v}" }, as: HomeNurse, as_user_id: "nurse-1", captures: { e9: $.data.error_id } }
            - { call: "GET /api/patients/${p2}", as: ProgramAdmin, captures: { p2v2: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${p2}", plan_mode: BACKUP_MACHINE, backup_machine_id: "${m2}", expected_patient_version: "${p2v2}" }, as: HomeNurse, as_user_id: "nurse-1", captures: { plan1: $.data.id, plan1_st: $.data.status } }
            - { call: "POST /api/dialysis-machines/${m2}/decommission", as: ProgramAdmin, captures: { e10: $.data.error_id } }
            - { call: "POST /api/maintenance-events", payload: { machine_id: "${m2}", event_type: PREVENTIVE, window_start: "2026-05-20T09:00:00Z", window_end: "2026-05-20T12:00:00Z" }, as: BiomedTechnician, captures: { ev4: $.data.id } }
            - { call: "GET /api/patients/${p2}", as: ProgramAdmin, captures: { p2v3: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${p2}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${p2v3}" }, as: HomeNurse, as_user_id: "nurse-1", captures: { plan2: $.data.id } }
            - { call: "POST /api/emergency-backup-plans/${plan1}/drill", as: HomeNurse, as_user_id: "nurse-1", captures: { e11: $.data.error_id } }
            - { call: "POST /api/dialysis-machines/${m2}/decommission", as: ProgramAdmin, captures: { m2_st: $.data.status } }
            - { call: "GET /api/dialysis-machines/${m2}/maintenance-events", as: ProgramAdmin, captures: { ev4_st: "$.data[0].status" } }
          assert:
            - "unassign from IN_STOCK: e1 == ERR_MACHINE_INVALID_STATE"
            - "assign to the SAME patient (no-op): e2 == ERR_INVALID_REQUEST"
            - "decommission while ASSIGNED: e3 == ERR_MACHINE_INVALID_STATE"
            - "start while another event IN_PROGRESS on M1: e4 == ERR_MACHINE_BUSY_MAINTENANCE"
            - "cancel from IN_PROGRESS: e5 == ERR_EVENT_INVALID_STATE"
            - "start after window_end: e6 == ERR_EVENT_WINDOW_PASSED"
            - "reassignment supersedes: assigned_patient_id == ${p2}"
            - "reassign with stale version: e7 == ERR_STALE_VERSION (412)"
            - "plan BACKUP_MACHINE without backup_machine_id: e8 == ERR_BACKUP_MACHINE_REQUIRED"
            - "plan referencing ASSIGNED machine M1: e9 == ERR_BACKUP_MACHINE_NOT_IN_STOCK"
            - "plan1 ACTIVE referencing IN_STOCK M2; decommission M2 blocked: e10 == ERR_MACHINE_REFERENCED_BY_PLAN"
            - "second plan supersedes: plan1 -> SUPERSEDED; drill on SUPERSEDED plan: e11 == ERR_PLAN_NOT_ACTIVE"
            - "after supersede, decommission M2 succeeds (status DECOMMISSIONED) and its SCHEDULED event ${ev4} is CANCELLED"

      - name: order_lifecycle_and_waste_battery
        claim_type: invalid_transition
        grounds: [state_machines.SupplyOrder, state_machines.DeliveryAppointment, state_machines.WasteReturnRecord, "errors[ERR_ORDER_INVALID_STATE]", "errors[ERR_APPOINTMENT_OUTSIDE_ORDER_MONTH]", "errors[ERR_ACTIVE_APPOINTMENT_EXISTS]", "errors[ERR_MONTH_NOT_ENDED]", "errors[ERR_OPEN_APPOINTMENTS_EXIST]", "errors[ERR_DELIVERED_UNITS_INVALID]", "errors[ERR_APPOINTMENT_INVALID_STATE]", "errors[ERR_WASTE_RECORD_NOT_REPORTED]", "errors[ERR_QUANTITY_EXCEEDS_ON_HAND]"]
        distinguishing_aspect: "Full order lifecycle probe: appointment on DRAFT, June window on a May order, second concurrent appointment, early close, close with open appointment, over-delivery, double-complete, waste verify replay, over-on-hand waste, and terminal submit on a CLOSED order."
        test_recipe:
          setup:
            - "ACTIVE_HOME patient (cap 400, allowance 72); May order of 10 DIALYSATE_2L SUBMITTED then APPROVED; June DRAFT order also exists"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Z", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Zero", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a1: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { a5: $.data.id } }
            - { call: "POST /api/training-attempts/${a1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${a5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-Z", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mv: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mv}" }, as: BiomedTechnician }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv: $.data.version } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pv}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 10 } ], expected_patient_version: "${pv2}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pv3: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-06", lines: [ { sku: "DIALYSATE_2L", quantity: 4 } ], expected_patient_version: "${pv3}" }, as: Patient, as_user_id: "${pat}", captures: { ord2: $.data.id } }
          trigger:
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord2}", window_start: "2026-06-04T08:00:00Z", window_end: "2026-06-04T12:00:00Z" }, as: SupplyCoordinator, captures: { e1: $.data.error_id } }
            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat}" }
            - { call: "POST /api/supply-orders/${ord}/review", payload: { decision: APPROVE }, as: SupplyCoordinator }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-06-04T08:00:00Z", window_end: "2026-06-04T12:00:00Z" }, as: SupplyCoordinator, captures: { e2: $.data.error_id } }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-04T08:00:00Z", window_end: "2026-05-04T12:00:00Z" }, as: SupplyCoordinator, captures: { ap1: $.data.id } }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-05T08:00:00Z", window_end: "2026-05-05T12:00:00Z" }, as: SupplyCoordinator, captures: { e3: $.data.error_id } }
            - { call: "POST /api/supply-orders/${ord}/close", as: SupplyCoordinator, captures: { e4: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/delivery-appointments/${ap1}/complete", payload: { delivered_units: 7 }, as: SupplyCoordinator, captures: { fs1: $.data.status } }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-18T08:00:00Z", window_end: "2026-05-18T12:00:00Z" }, as: SupplyCoordinator, captures: { ap2: $.data.id } }
            - { call: "POST /api/delivery-appointments/${ap2}/complete", payload: { delivered_units: 4 }, as: SupplyCoordinator, captures: { e5: $.data.error_id } }
            - { call: "POST /api/delivery-appointments/${ap2}/complete", payload: { delivered_units: 3 }, as: SupplyCoordinator }
            - { call: "POST /api/delivery-appointments/${ap2}/complete", payload: { delivered_units: 1 }, as: SupplyCoordinator, captures: { e6: $.data.error_id } }
            - { call: "POST /api/waste-return-records", payload: { patient_id: "${pat}", record_type: WASTE, activity_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", units: 2, expired: false } ] }, as: Patient, as_user_id: "${pat}", captures: { wr: $.data.id } }
            - { call: "POST /api/waste-return-records/${wr}/verify", payload: { approved: true }, as: SupplyCoordinator, captures: { wr_st: $.data.status } }
            - { call: "POST /api/waste-return-records/${wr}/verify", payload: { approved: true }, as: SupplyCoordinator, captures: { e7: $.data.error_id } }
            - { call: "POST /api/waste-return-records", payload: { patient_id: "${pat}", record_type: WASTE, activity_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", units: 100, expired: false } ] }, as: Patient, as_user_id: "${pat}", captures: { e8: $.data.error_id } }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-25T08:00:00Z", window_end: "2026-05-25T12:00:00Z" }, as: SupplyCoordinator, captures: { ap3: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/supply-orders/${ord}/close", as: SupplyCoordinator, captures: { e8b: $.data.error_id } }
            - { call: "POST /api/delivery-appointments/${ap3}/cancel", as: SupplyCoordinator }
            - { call: "POST /api/supply-orders/${ord}/close", as: SupplyCoordinator, captures: { ost: $.data.order_status, act: $.data.actualized_units, adj: $.data.adjustment_units } }
            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat}", captures: { e9: $.data.error_id } }
          assert:
            - "appointment on DRAFT order: e1 == ERR_ORDER_INVALID_STATE"
            - "June window on May order: e2 == ERR_APPOINTMENT_OUTSIDE_ORDER_MONTH"
            - "second concurrent SCHEDULED appointment: e3 == ERR_ACTIVE_APPOINTMENT_EXISTS"
            - "close while month still current: e4 == ERR_MONTH_NOT_ENDED"
            - "partial delivery of 7 leaves 3; delivering 4: e5 == ERR_DELIVERED_UNITS_INVALID"
            - "delivering the remaining 3 succeeds; a repeat complete: e6 == ERR_APPOINTMENT_INVALID_STATE"
            - "waste record verified: status VERIFIED; verify replay: e7 == ERR_WASTE_RECORD_NOT_REPORTED"
            - "waste of 100 units against on_hand 8: e8 == ERR_QUANTITY_EXCEEDS_ON_HAND"
            - "close in June with ap3 still SCHEDULED: e8b == ERR_OPEN_APPOINTMENTS_EXIST"
            - "after cancelling ap3, close in June: order_status CLOSED, actualized_units == 0 (no logs), adjustment_units == -72"
            - "submit on CLOSED order: e9 == ERR_ORDER_INVALID_STATE (terminal lockdown)"

