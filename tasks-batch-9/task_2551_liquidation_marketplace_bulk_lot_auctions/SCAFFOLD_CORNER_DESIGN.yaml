# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# task_2551 - Liquidation Marketplace & Bulk Lot Auctions
#
# A row-by-row walk of references/claim-extraction-guide.md against this
# scaffold's §1.1-§1.7 surface. Every `section:` value is one of the guide's
# nine sections and every `claim_type:` is one of that section's table rows.
# Corners that §1.8 already probes in depth are emitted as `excluded_because:`
# stubs naming the exact SCAFFOLD_DIFFICULTY_DESIGN.yaml instance.
#
# Standing conventions (identical to §1.8):
#   * the logical clock starts at 2026-08-01T00:00:00Z and only
#     POST /_clock/set_current_utc moves it
#   * SellerOps sends X-User-ID == SellerAccount.id, Buyer sends
#     X-User-ID == BuyerAccount.id (both entity_backed per §1.7)
#   * opaque roles use stable literal operator ids: "admin-1" (PlatformAdmin),
#     "ops-review-1" (manifest reviews), "ops-claims-9" (claim decisions),
#     "ops-dock-1" (pickup completions), "ops-close-1" (auction closures),
#     "ops-sweep-1" (sweeps), "ts-1"/"ts-2" (TrustSafety)
#   * every literal in an `assert:` line was computed against the §1.3 formula
#     and its constants before being written
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Guide section 1 - Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: seller_account_creation_returns_computed_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - endpoints[POST /liquidation/seller-accounts]
          - entities.SellerAccount.fields.account_status
          - entities.SellerAccount.fields.commission_tier
          - entities.SellerAccount.fields.commission_rate_bps
          - entities.SellerAccount.fields.gross_recovery_rate
          - entities.SellerAccount.fields.manifest_accuracy_avg
          - state_machines.SellerAccount.initial_state
        distinguishing_aspect: >
          A seller created with only the four declared input fields comes back 201 with every
          §1.1 computed field at its declared default - ACTIVE / TIER_STANDARD / 2000 bps /
          0.0000 rates / 1.000 accuracy / scored_lot_count 0 - plus system id, created_at and
          version 1; no commission tier is inferred from the empty lot population.
        test_recipe:
          setup:
            - "Empty database; the logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id", sv: "$.data.version" }
          assert:
            - "HTTP 201 and SellerAccount.${s1}.legal_name == Northline Returns LLC"
            - "SellerAccount.${s1}.account_status == ACTIVE and commission_tier == TIER_STANDARD"
            - "SellerAccount.${s1}.commission_rate_bps == 2000"
            - "SellerAccount.${s1}.gross_hammer_cents == 0 and listed_retail_value_cents == 0 and gross_recovery_rate == 0.0000"
            - "SellerAccount.${s1}.net_proceeds_cents == 0 and sold_retail_value_cents == 0 and net_recovery_rate == 0.0000"
            - "SellerAccount.${s1}.manifest_accuracy_avg == 1.000 and scored_lot_count == 0"
            - "${sv} == 1 and SellerAccount.${s1}.id and created_at are server-generated"

      - name: buyer_account_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - endpoints[POST /liquidation/buyer-accounts]
          - entities.BuyerAccount.fields.requested_credit_limit_cents
          - entities.BuyerAccount.fields.resale_certificate_number
          - entities.BuyerAccount.fields.business_verification_status
          - entities.BuyerAccount.fields.qualification_status
          - entities.BuyerAccount.fields.approved_credit_limit_cents
          - entities.BuyerAccount.fields.wallet_credit_cents
          - state_machines.BuyerAccount.initial_state
        distinguishing_aspect: >
          Omitting all four optional inputs yields requested_credit_limit_cents 0, null resale
          certificate fields, business_verification_status UNVERIFIED and qualification_status
          PENDING - the buyer is created but is not yet admissible to bid, and approved credit
          is 0 rather than mirroring the (absent) request.
        test_recipe:
          setup:
            - "Empty database; the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /liquidation/buyer-accounts"
              payload: { legal_name: "Bare Bones Resale", tax_id: "B-9001", state_code: "NV", contact_email: "bare@bones.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { bb: "$.data.id" }
          assert:
            - "HTTP 201 and BuyerAccount.${bb}.requested_credit_limit_cents == 0"
            - "BuyerAccount.${bb}.resale_certificate_number == null and resale_certificate_expires_on == null"
            - "BuyerAccount.${bb}.business_verification_status == UNVERIFIED"
            - "BuyerAccount.${bb}.qualification_status == PENDING"
            - "BuyerAccount.${bb}.approved_credit_limit_cents == 0 and wallet_credit_cents == 0 and outstanding_exposure_cents == 0"

      - name: lot_retrieval_by_id_returns_the_stored_lot
        claim_type: Retrieval
        grounds:
          - endpoints[GET /liquidation/lots/{id}]
          - endpoints[POST /liquidation/lots]
          - entities.Lot.fields.lot_status
          - entities.Lot.fields.de_branding_required
        distinguishing_aspect: >
          GET /liquidation/lots/{id} returns exactly the row POST created: the same seller_id,
          warehouse_id, category_code APPAREL and condition_grade CUSTOMER_RETURNS, lot_status
          DRAFT, de_branding_required false (no brand policy) and manifest_accuracy_score null.
        test_recipe:
          setup:
            - "One seller and one warehouse exist; one lot has been created with no manifest lines yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
          trigger:
            - call: "GET /liquidation/lots/${lot1}"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
          assert:
            - "HTTP 200 and Lot.${lot1}.seller_id == ${s1} and warehouse_id == ${w1}"
            - "Lot.${lot1}.category_code == APPAREL and condition_grade == CUSTOMER_RETURNS"
            - "Lot.${lot1}.lot_status == DRAFT and manifest_line_count == 0 and declared_unit_count == 0 and declared_retail_value_cents == 0"
            - "Lot.${lot1}.brand_policy_id == null and de_branding_required == false and manifest_accuracy_score == null"

      - name: manifest_lines_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /liquidation/lots/{id}/manifest-lines]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.ManifestLine.fields.line_status
        distinguishing_aspect: >
          With three ACTIVE lines on the lot, limit=2/offset=0 returns 2 rows with total_count 3
          and has_more true, and limit=2/offset=2 returns the remaining 1 row with has_more
          false - total_count reports the filtered population, not the page size.
        test_recipe:
          setup:
            - "One seller, one warehouse, one DRAFT lot carrying three ACTIVE manifest lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-100", unit_count: 100, unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-200", unit_count: 300, unit_retail_cents: 20000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-300", unit_count: 50, unit_retail_cents: 10000, declared_condition: "DAMAGED" }
              as: SellerOps
              as_user_id: "${s1}"
          trigger:
            - call: "GET /liquidation/lots/${lot1}/manifest-lines"
              payload: { limit: 2, offset: 0 }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "GET /liquidation/lots/${lot1}/manifest-lines"
              payload: { limit: 2, offset: 2 }
              as: SellerOps
              as_user_id: "${s1}"
          assert:
            - "first page: 2 ManifestLine rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "second page: 1 ManifestLine row, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "Lot.${lot1}.manifest_line_count == 3 and declared_unit_count == 450 and declared_retail_value_cents == 10500000"

      - name: lot_get_with_unknown_id_returns_lot_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /liquidation/lots/{id}]
          - validations[priority 3 -> ERR_LOT_NOT_FOUND]
          - errors[ERR_LOT_NOT_FOUND]
        distinguishing_aspect: >
          A syntactically valid but unstored lot id resolves to ERR_LOT_NOT_FOUND with HTTP 404
          from the priority-3 existence gate - not 200 with an empty body and not ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database apart from the clock; no Lot row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /liquidation/lots/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: MarketplaceOps
              as_user_id: "ops-review-1"
              captures: { err_lot: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${err_lot} == ERR_LOT_NOT_FOUND"

      - name: manifest_line_creation_missing_unit_count_is_rejected
        claim_type: Required Fields
        grounds:
          - endpoints[POST /liquidation/lots/{id}/manifest-lines]
          - validations[priority 7 -> ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_REQUEST]
          - entities.Lot.fields.declared_unit_count
        distinguishing_aspect: >
          Dropping the required unit_count field returns ERR_INVALID_REQUEST (400) from the
          priority-7 request-shape gate and leaves the lot's aggregates at 0/0/0 - no partial
          ManifestLine row is persisted.
        test_recipe:
          setup:
            - "One seller, one warehouse, one DRAFT lot with no manifest lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
          trigger:
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-100", unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { err_req: "$.data.error_id" }
          assert:
            - "HTTP 400 and ${err_req} == ERR_INVALID_REQUEST"
            - "Lot.${lot1}.manifest_line_count == 0 and declared_unit_count == 0 and declared_retail_value_cents == 0"
            - "GET /liquidation/lots/${lot1}/manifest-lines returns total_count == 0"

      - name: lot_aggregate_fields_are_computed_from_active_manifest_lines
        claim_type: Computed Fields
        grounds:
          - entities.Lot.fields.manifest_line_count
          - entities.Lot.fields.declared_unit_count
          - entities.Lot.fields.declared_retail_value_cents
          - entities.ManifestLine.fields.line_status
          - endpoints[POST /liquidation/manifest-lines/{id}/voids]
        distinguishing_aspect: >
          The three lot aggregates are recomputed from ACTIVE lines only: after two lines
          (100 x 40000 and 300 x 20000) they read 2 / 400 / 10000000, and voiding the 100-unit
          line drops them to 1 / 300 / 6000000 while the VOIDED row is retained and still
          readable through GET /liquidation/manifest-lines/{id}.
        test_recipe:
          setup:
            - "One seller, one warehouse, one DRAFT lot with two ACTIVE manifest lines (100 x 40000 and 300 x 20000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-100", unit_count: 100, unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { ml1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-200", unit_count: 300, unit_retail_cents: 20000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { ml2: "$.data.id" }
          trigger:
            - call: "POST /liquidation/manifest-lines/${ml1}/voids"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
          assert:
            - "before the void: Lot.${lot1}.manifest_line_count == 2, declared_unit_count == 400, declared_retail_value_cents == 10000000"
            - "after the void: Lot.${lot1}.manifest_line_count == 1, declared_unit_count == 300, declared_retail_value_cents == 6000000"
            - "ManifestLine.${ml1}.line_status == VOIDED and the row is still returned by GET /liquidation/manifest-lines/${ml1}"
            - "ManifestLine.${ml2}.line_status == ACTIVE"
            - "GET /liquidation/lots/${lot1}/manifest-lines with line_status == ACTIVE returns total_count == 1"

      - name: listing_creation_rejects_window_end_before_window_start
        claim_type: Type Constraints
        grounds:
          - endpoints[POST /liquidation/lots/{id}/listings]
          - validations[priority 7 -> ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_REQUEST]
          - entities.Listing.fields.window_start_at
          - entities.Listing.fields.window_end_at
        distinguishing_aspect: >
          window_end_at must be strictly greater than window_start_at: an inverted window and an
          out-of-set condition_grade both fail the same priority-7 gate with ERR_INVALID_REQUEST
          (400), and no Listing row is created for the lot.
        test_recipe:
          setup:
            - "One seller, one warehouse, one lot whose manifest is APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Apparel customer returns S1", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-100", unit_count: 100, unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
            - call: "POST /liquidation/lots/${lot1}/manifest-reviews"
              payload: { decision: "APPROVE", review_note: "manifest matches photos" }
              as: MarketplaceOps
              as_user_id: "ops-review-1"
          trigger:
            - call: "POST /liquidation/lots/${lot1}/listings"
              payload: { listing_format: "AUCTION", resale_channel: "MARKETPLACE_RESALE", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-05T00:00:00Z", opening_bid_cents: 1000000, bid_increment_cents: 100000 }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { err_window: "$.data.error_id" }
            - call: "POST /liquidation/lots/${lot1}/listings"
              payload: { listing_format: "AUCTION", resale_channel: "WHOLESALE_CLUB", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-12T00:00:00Z", opening_bid_cents: 1000000, bid_increment_cents: 100000 }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { err_enum: "$.data.error_id" }
          assert:
            - "inverted window: HTTP 400 and ${err_window} == ERR_INVALID_REQUEST"
            - "resale_channel outside {MARKETPLACE_RESALE, EXPORT_ONLY, DISCOUNT_RETAIL, SCRAP_ONLY}: HTTP 400 and ${err_enum} == ERR_INVALID_REQUEST"
            - "GET /liquidation/lots/${lot1}/listings returns total_count == 0"
            - "Lot.${lot1}.lot_status == MANIFEST_APPROVED (neither rejection advanced the lot)"

      - name: manifest_line_creation_under_unknown_lot_returns_lot_not_found
        claim_type: Parent Relationships
        grounds:
          - endpoints[POST /liquidation/lots/{id}/manifest-lines]
          - validations[priority 3 -> ERR_LOT_NOT_FOUND]
          - entities.ManifestLine.parent
          - errors[ERR_LOT_NOT_FOUND]
        distinguishing_aspect: >
          ManifestLine is a child of Lot: posting a well-formed line under an unstored lot id
          fails at the priority-3 path-existence gate with ERR_LOT_NOT_FOUND (404), before the
          priority-7 body check ever runs, and creates no orphan line.
        test_recipe:
          setup:
            - "One seller and one warehouse exist; no Lot row has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
          trigger:
            - call: "POST /liquidation/lots/22222222-2222-4222-8222-222222222222/manifest-lines"
              payload: { sku: "APP-100", unit_count: 100, unit_retail_cents: 40000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { err_parent: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${err_parent} == ERR_LOT_NOT_FOUND"
            - "GET /liquidation/manifest-lines returns total_count == 0"

      - name: offer_rows_are_immutable_and_carry_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Offer.common_fields
          - entities.Offer.fields.round_number
          - entities.Offer.fields.expires_at
          - endpoints[GET /liquidation/negotiations/{id}/offers]
          - endpoints[GET /liquidation/offers/{id}]
        distinguishing_aspect: >
          Offer is declared common_fields false: §1.5 exposes only the two read channels for
          offers, the append-only round ledger grows to two rows after one counter-offer, and
          neither row carries a version field nor any update/delete endpoint.
        test_recipe:
          setup:
            - "A NEGOTIATED listing (min_offer_cents 900000) is OPEN; a QUALIFIED buyer has opened a negotiation at 1000000 and the seller has countered at 1400000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
