          Metric vehicle count on order creation: exactly 10 vehicles triggers the 10%
          tier (quote 31500) while 9 vehicles falls to the 5% tier (quote 29925) — the
          >= boundary sits at 10.
        test_recipe:
          setup:
            - "RETAIL customer; site (non-reclaim); 10 SEDANs"
          setup_api_calls:
