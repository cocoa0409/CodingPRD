          The report is a pure read whose every number must agree with the stored DayPlan counters, and
          the interesting part is which rows feed it: a second lift sitting in STANDBY must contribute
          nothing at all, and the same lift moving to OPEN must move raw_ccc, cross the crowding threshold
          and shrink guest_capacity below raw_ccc in one step. The setup is tuned so crowding_density is
          exactly 25.0 before the change (no reduction) and 27.0 after it (reduction), so the strict
          threshold and the single-pass evaluation order are both pinned by a read-only endpoint.
