scaffold_corner_design:

  # =========================================================================
  # SECTION 1 — ENTITIES (creation, retrieval, listing, not-found, required
  # fields, defaults, computed/system fields, type constraints, FK integrity)
  # =========================================================================
  - section: entities
    instances:
      - name: create_importer_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - endpoints.POST_/importers
          - entities.Importer.fields.status
          - entities.Importer.fields.continuous_bond_id
        distinguishing_aspect: "POST /importers with name, ior_number, owner_user_id returns 201; status defaults ACTIVE and continuous_bond_id defaults null."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP01", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id, imp_status: $.data.status, imp_bond: $.data.continuous_bond_id }
          assert:
            - "response http status == 201"
            - "Importer.${imp_id}.status == ACTIVE"
            - "Importer.${imp_id}.continuous_bond_id == null"

      - name: get_importer_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/importers/{id}
        distinguishing_aspect: "GET /importers/{id} returns the stored Importer with matching id and ior_number."
        test_recipe:
          setup:
            - "An Importer created via POST /importers."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP02", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
          trigger:
            - call: "GET /importers/${imp_id}"
              payload: {}
              as: AccountAdmin
              captures: { got_id: $.data.id, got_ior: $.data.ior_number }
          assert:
            - "Importer.${imp_id}.id == ${imp_id}"
            - "Importer.${imp_id}.ior_number == IOR-CORNER-IMP02"

      - name: list_entries_filtered_by_importer_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/entries
        distinguishing_aspect: "GET /entries?importer_id=X returns an array envelope with pagination fields total_count and has_more; only that importer's entries appear."
        test_recipe:
          setup:
            - "An Importer with one DRAFT CustomsEntry."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP03", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
          trigger:
            - call: "GET /entries?importer_id=${imp_id}&limit=10&offset=0"
              payload: {}
              as: AccountAdmin
              captures: { total: $.meta.total_count }
          assert:
            - "response_type == array"
            - "the returned data array contains exactly one CustomsEntry whose id == ${entry_id}"
            - "pagination total_count == 1 and has_more == false"

      - name: get_bond_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/bonds/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /bonds/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB (no bond with the queried id)."
          setup_api_calls: []
          trigger:
            - call: "GET /bonds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: create_importer_missing_ior_number_rejected
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/importers
          - entities.Importer.fields.ior_number
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /importers omitting the required input field ior_number is rejected ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /importers"
              payload: { name: "Acme Imports", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: entry_line_assists_defaults_zero
        claim_type: Defaults
        grounds:
          - endpoints.POST_/entries/{id}/lines
          - entities.EntryLine.fields.assists_cents
          - entities.EntryLine.fields.preference_claim
          - entities.EntryLine.fields.pga_flag
        distinguishing_aspect: "POST /entries/{id}/lines omitting assists_cents, preference_claim, pga_flag applies defaults 0, NONE, NONE respectively."
        test_recipe:
          setup:
            - "A DRAFT entry on an importer with an ACTIVE bond."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP04", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 1000000, quantity: 1 }
              as: LicensedBroker
              captures: { line_id: $.data.id, a: $.data.assists_cents, p: $.data.preference_claim, g: $.data.pga_flag }
          assert:
            - "EntryLine.${line_id}.assists_cents == 0"
            - "EntryLine.${line_id}.preference_claim == NONE"
            - "EntryLine.${line_id}.pga_flag == NONE"

      - name: entry_line_dutiable_value_computed_from_value_plus_assists
        claim_type: Computed Fields
        grounds:
          - calculations.compute_line_dutiable_value
          - entities.EntryLine.fields.dutiable_value_cents
        distinguishing_aspect: "On line creation, dutiable_value_cents is computed as customs_value_cents + assists_cents = 400000 + 50000 = 450000; any client-supplied dutiable_value_cents is ignored."
        test_recipe:
          setup:
            - "A DRAFT entry; add one line customs_value_cents=400000, assists_cents=50000."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP05", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 400000, assists_cents: 50000, quantity: 1 }
              as: LicensedBroker
              captures: { line_id: $.data.id, dv: $.data.dutiable_value_cents }
          assert:
            - "EntryLine.${line_id}.dutiable_value_cents == 450000"

      - name: importer_system_id_and_created_at_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Importer.fields.status
          - endpoints.POST_/importers
        distinguishing_aspect: "Server mints id, created_at, updated_at, version=1 on POST /importers; any client-supplied id or status is ignored (status forced to ACTIVE, version to 1)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP06", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id, v: $.data.version, st: $.data.status }
          assert:
            - "Importer.${imp_id}.version == 1"
            - "Importer.${imp_id}.status == ACTIVE"
            - "Importer.${imp_id}.id is a server-minted non-empty string"

      - name: entry_line_invalid_hts_code_format_rejected
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/entries/{id}/lines
          - entities.EntryLine.fields.hts_code
          - validations[priority=12]
          - errors[ERR_INVALID_FORMAT]
        distinguishing_aspect: "POST /entries/{id}/lines with a non-10-digit hts_code is rejected ERR_INVALID_FORMAT (422)."
        test_recipe:
          setup:
            - "A DRAFT entry on an importer with an ACTIVE bond."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP07", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "61091", customs_value_cents: 1000000, quantity: 1 }
              as: LicensedBroker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_FORMAT"
            - "http status == 422"

      - name: entry_country_of_origin_not_two_letter_rejected
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/entries
          - entities.CustomsEntry.fields.country_of_origin
          - validations[priority=12]
          - errors[ERR_INVALID_FORMAT]
        distinguishing_aspect: "POST /entries with country_of_origin not a 2-letter uppercase ISO code (e.g. 'CHN') is rejected ERR_INVALID_FORMAT (422)."
        test_recipe:
          setup:
            - "An importer with an ACTIVE bond."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP08", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
          trigger:
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CHN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_FORMAT"
            - "http status == 422"

      - name: isf_data_element_count_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/isf-filings
          - entities.ISFFiling.fields.data_element_count
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /isf-filings with data_element_count outside 0..10 (e.g. 11) is rejected ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "An importer exists."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP09", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
          trigger:
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CORNER-09", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 11 }
              as: LicensedBroker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: entry_line_nonpositive_customs_value_rejected
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/entries/{id}/lines
          - entities.EntryLine.fields.customs_value_cents
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /entries/{id}/lines with customs_value_cents <= 0 violates the '> 0' constraint and is rejected ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "A DRAFT entry on an importer with an ACTIVE bond."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP10", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 0, quantity: 1 }
              as: LicensedBroker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: entry_bond_fk_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.POST_/entries
          - entities.CustomsEntry.fields.bond_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Flat-topology FK integrity: POST /entries with a bond_id that resolves to no Bond is rejected ERR_NOT_FOUND (404) by the existence check."
        test_recipe:
          setup:
            - "An importer exists; bond_id points to a non-existent Bond."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP11", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
          trigger:
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "00000000-0000-4000-8000-000000000000", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: entry_lines_reverse_reachable_from_entry
        claim_type: Parent Relationships
        grounds:
          - endpoints.GET_/entries/{id}/lines
          - entities.EntryLine.fields.entry_id
        distinguishing_aspect: "EntryLine (child of CustomsEntry) is reverse-reachable: GET /entries/{id}/lines returns the array of lines created under that entry."
        test_recipe:
          setup:
            - "A DRAFT entry with two lines added."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-IMP12", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
            - call: "POST /entries"
              payload: { importer_id: "${imp_id}", bond_id: "${bond_id}", entry_type: "CONSUMPTION_01", country_of_origin: "CN", entry_date: "2026-06-10T00:00:00Z" }
              as: LicensedBroker
              captures: { entry_id: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "9403600080", customs_value_cents: 1000000, quantity: 1 }
              as: LicensedBroker
              captures: { line_a: $.data.id }
            - call: "POST /entries/${entry_id}/lines"
              payload: { hts_code: "8501100000", customs_value_cents: 500000, quantity: 1 }
              as: LicensedBroker
              captures: { line_b: $.data.id }
          trigger:
            - call: "GET /entries/${entry_id}/lines"
              payload: {}
              as: LicensedBroker
              captures: { total: $.meta.total_count }
          assert:
            - "the returned array contains exactly the two lines ${line_a} and ${line_b}"
            - "pagination total_count == 2"

  # =========================================================================
  # SECTION 2 — STATE MACHINES (valid transitions, preconditions, invalid-from,
  # initial/terminal, idempotency, side-effects, cascade/bubble/cross-entity)
  # =========================================================================
  - section: state_machines
    instances:
      - name: bond_activate_pending_to_active_sets_continuous_bond_id
        claim_type: Valid Transition
        grounds:
          - state_machines.Bond.PENDING_to_ACTIVE
          - entities.Bond.fields.status
          - entities.Importer.fields.continuous_bond_id
        distinguishing_aspect: "POST /bonds/{id}/activate on a PENDING CONTINUOUS bond moves it to ACTIVE and sets Importer.continuous_bond_id to the bond id (side effect)."
        test_recipe:
          setup:
            - "An importer with a PENDING CONTINUOUS bond."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-SM01", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /bonds"
              payload: { importer_id: "${imp_id}", bond_type: "CONTINUOUS", limit_cents: 100000000 }
              as: AccountAdmin
              captures: { bond_id: $.data.id }
          trigger:
            - call: "POST /bonds/${bond_id}/activate"
              payload: {}
              as: AccountAdmin
              captures: { st: $.data.status }
          assert:
            - "Bond.${bond_id}.status == ACTIVE"
            - "Importer.${imp_id}.continuous_bond_id == ${bond_id}"

      - name: isf_file_requires_ten_data_elements_precondition
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ISFFiling.DRAFT_to_FILED
          - validations[priority=10]
          - errors[ERR_ISF_INCOMPLETE]
        distinguishing_aspect: "POST /isf-filings/{id}/file on a DRAFT ISF with data_element_count != 10 (here 9) is rejected ERR_ISF_INCOMPLETE (422); the ISF stays DRAFT."
        test_recipe:
          setup:
            - "A DRAFT ISFFiling with data_element_count=9."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-SM02", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CORNER-SM02", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 9 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
          trigger:
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ISF_INCOMPLETE"
            - "http status == 422"
            - "ISFFiling.${isf_id}.status == DRAFT (unchanged)"

      - name: isf_file_sets_filed_at_and_late_filing_true_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ISFFiling.DRAFT_to_FILED
          - entities.ISFFiling.fields.filed_at
          - entities.ISFFiling.fields.late_filing
        distinguishing_aspect: "Filing an ISF at clock 2026-06-09T12:00:00Z against vessel_eta 2026-06-10T00:00:00Z (cutoff = eta - 24h = 2026-06-09T00:00:00Z) stamps filed_at = clock.now and sets late_filing = true because filed_at > cutoff."
        test_recipe:
          setup:
            - "Clock set to 2026-06-09T12:00:00Z; a DRAFT ISF with 10 elements, vessel_eta 2026-06-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-SM03", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CORNER-SM03", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
          trigger:
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
              captures: { late: $.data.late_filing, fa: $.data.filed_at }
          assert:
            - "ISFFiling.${isf_id}.status == FILED"
            - "ISFFiling.${isf_id}.late_filing == true"
            - "ISFFiling.${isf_id}.filed_at == 2026-06-09T12:00:00.000Z"

      - name: isf_file_on_time_sets_late_filing_false
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ISFFiling.DRAFT_to_FILED
          - entities.ISFFiling.fields.late_filing
        distinguishing_aspect: "Filing an ISF at clock 2026-06-08T00:00:00Z (before cutoff 2026-06-09T00:00:00Z for vessel_eta 2026-06-10T00:00:00Z) sets late_filing = false."
        test_recipe:
          setup:
            - "Clock 2026-06-08T00:00:00Z; a DRAFT ISF with 10 elements, vessel_eta 2026-06-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-SM04", owner_user_id: "imp-user-1" }
              as: AccountAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /isf-filings"
              payload: { importer_id: "${imp_id}", bill_of_lading: "BOL-CORNER-SM04", vessel_eta: "2026-06-10T00:00:00Z", data_element_count: 10 }
              as: LicensedBroker
              captures: { isf_id: $.data.id }
          trigger:
            - call: "POST /isf-filings/${isf_id}/file"
              payload: {}
              as: LicensedBroker
              captures: { late: $.data.late_filing }
          assert:
            - "ISFFiling.${isf_id}.status == FILED"
            - "ISFFiling.${isf_id}.late_filing == false"

      - name: file_isf_twice_invalid_from_filed_rejected
