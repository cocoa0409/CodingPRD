            - "PositionSlot.${slot_id}.filled_headcount == 0 and status == OPEN"
            - "GET /backfill-requests?position_slot_id=${slot_id} returns total_count == 0"
            - "StaffMember.${m1}.reliability_score == 100 and no_show_strikes == 0; same for ${m2}"
            - "StaffingPlan.${plan_id}.status == LOCKED"
            - "the recommendation read now returns 200 with understaffed_slot_count == 0 and average_score == null"
            - "position_recommendations[0] has planned_headcount == 2, worked_headcount == 0, no_show_count == 0, fill_rate_bp == 0, direction == 'INCREASE' and recommended_ratio_per_1000 == 0.88"

      - name: plan_activate_from_locked_state_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.StaffingPlan.ACTIVE_to_LOCKED
          - errors[ERR_PLAN_STATE_INVALID]
          - validations[priority 10]
          - endpoints[POST /staffing-plans/{id}/activate]
        distinguishing_aspect: >-
          §1.2 declares no LOCKED -> ACTIVE edge, so re-activating the plan the event locked is
          refused at §1.4 priority 10 with ERR_PLAN_STATE_INVALID even though the OCC version
          supplied is current - and the refusal mutates nothing: the plan stays LOCKED and
          Event.version stays 3.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z."
            - "One Event driven FORECAST -> PLANNED -> IN_PROGRESS, so its only plan is LOCKED and Event.version is 3."
            - "A fresh Event.version is re-read immediately before the trigger so the OCC check cannot be the reason for the refusal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Locked Plan Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T19:00:00Z", shift_end: "2026-09-12T23:05:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { ev_v3: $.data.version }
          trigger:
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v3}" }
              as: StaffingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == 'ERR_PLAN_STATE_INVALID' (not ERR_STALE_EVENT_VERSION)"
            - "StaffingPlan.${plan_id}.status == LOCKED and activated_at is unchanged"
            - "Event.${ev_id}.status == IN_PROGRESS and version == 3 - the refused call incremented nothing"
            - "PositionSlot.${slot_id}.status == OPEN and filled_headcount == 0"

      - name: event_terminal_states_reject_further_lifecycle_calls
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Event.terminal_states
          - errors[ERR_EVENT_STATE_INVALID]
          - validations[priority 10]
          - endpoints[POST /events/{id}/lifecycle]
          - endpoints[PATCH /events/{id}]
        distinguishing_aspect: >-
          Both declared terminal states are closed: a CANCELLED event refuses IN_PROGRESS and a
          second CANCELLED, and a CLOSED event refuses IN_PROGRESS, CANCELLED and PATCH /events -
          all with ERR_EVENT_STATE_INVALID and with Event.version frozen at 2 and 4 respectively.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z."
            - "Event A cancelled straight out of FORECAST (version 2)."
            - "Event B driven PLANNED -> IN_PROGRESS -> CLOSED through its single plan (version 4)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Terminal A", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_a: $.data.id }
            - call: "POST /events/${ev_a}/lifecycle"
              payload: { target_status: "CANCELLED", reason: "Weather" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Terminal B", event_date: "2026-09-13T00:00:00Z", doors_open_at: "2026-09-13T17:00:00Z", doors_close_at: "2026-09-13T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_b: $.data.id, ev_b_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_b}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_b: $.data.id }
            - call: "POST /staffing-plans/${plan_b}/activate"
              payload: { expected_event_version: "${ev_b_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_b}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /events/${ev_b}/lifecycle"
              payload: { target_status: "CLOSED" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /events/${ev_a}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
              captures: { err_a1: $.data.error_id }
            - call: "POST /events/${ev_a}/lifecycle"
              payload: { target_status: "CANCELLED" }
              as: GuestExperienceDirector
              captures: { err_a2: $.data.error_id }
            - call: "POST /events/${ev_b}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
              captures: { err_b1: $.data.error_id }
            - call: "POST /events/${ev_b}/lifecycle"
              payload: { target_status: "CANCELLED" }
              as: GuestExperienceDirector
              captures: { err_b2: $.data.error_id }
            - call: "PATCH /events/${ev_b}"
              payload: { expected_attendance: 9000 }
              as: GuestExperienceDirector
              captures: { err_b3: $.data.error_id }
          assert:
            - "${err_a1} == 'ERR_EVENT_STATE_INVALID' and ${err_a2} == 'ERR_EVENT_STATE_INVALID', both HTTP 409"
            - "${err_b1} == 'ERR_EVENT_STATE_INVALID' and ${err_b2} == 'ERR_EVENT_STATE_INVALID' and ${err_b3} == 'ERR_EVENT_STATE_INVALID'"
            - "Event.${ev_a}.status == CANCELLED and version == 2"
            - "Event.${ev_b}.status == CLOSED and version == 4"
            - "Event.${ev_b}.expected_attendance == 6000 and attendance_tier == TIER_1 - the refused PATCH changed nothing"
            - "StaffingPlan.${plan_b}.status == LOCKED"

