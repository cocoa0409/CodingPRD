              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_ops_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${clin_id}", discipline: "CLINICAL", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_clin_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/team-assignments"
              payload: { member_employee_id: "${legal_id}", discipline: "LEGAL", role_on_team: "VOTING_MEMBER" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { seat_legal_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/convene"
              payload: { convene_note: "Five disciplines seated; opening round 1." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "ELEVATED", rationale: "Shift overlap keeps the two employees in contact." }
              as: ThreatTeamMember
              as_user_id: "${ops_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "IMMINENT", rationale: "Weapon on site and no badge control at the front desk." }
              as: ThreatTeamMember
              as_user_id: "${sec_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "ELEVATED", rationale: "Pattern of escalating verbal conflict on file." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "MONITOR", rationale: "No clinical indicators of imminent harm." }
              as: ThreatTeamMember
              as_user_id: "${clin_id}"
            - call: "POST /threat-cases/${case_id}/ballots"
              payload: { ballot_value: "IMMINENT", rationale: "Conduct is chargeable; restraining order is viable." }
              as: ThreatTeamMember
              as_user_id: "${legal_id}"
            - call: "POST /threat-cases/${case_id}/decide"
              payload: { disposition: "ELEVATED_RISK" }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
            - call: "GET /violent-incident-log"
              payload: { case_id: "${case_id}" }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { log_id: "$.data[0].id" }
          trigger:
            - call: "POST /threat-cases/${case_id}/close"
              payload: { closure_summary: "Monitoring complete; closing before the log is amended." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
              captures: { err: $.data.error_id }
            - call: "POST /violent-incident-log/${log_id}/amendments"
              payload: { amendment_reason: "Adding the two outcome elements required by the recordkeeping rule.", consequence_narrative: "Subject separated from the shift; no lost time recorded.", controls_summary: "Badge control installed at the front desk and escorts scheduled." }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { log2_id: $.data.id }
            - call: "POST /threat-cases/${case_id}/close"
              payload: { closure_summary: "Log amended to eight elements; case closed." }
              as: ThreatTeamLead
              as_user_id: "${lead_id}"
          assert:
            - "The first close call returns HTTP 409 with $.data.error_id == ERR_LOG_ENTRY_REQUIRED_ELEMENT_MISSING"
            - "The amendment returns HTTP 201 with $.data.supersedes_entry_id == ${log_id} and required_element_count_present == 8"
            - "ViolentIncidentLogEntry.${log2_id}.incident_at, work_area_name, incident_type, perpetrator_class and injury_level are copied unchanged from the superseded entry, and perpetrator_class == COWORKER"
            - "ViolentIncidentLogEntry.${log_id}.required_element_count_present is still 6 and superseded_flag == true - the original row is never mutated in place"
            - "GET /violent-incident-log?supersedes_entry_id=${log_id} returns total_count 1 whose only element has id ${log2_id}"
            - "PreventionPlan.${plan_id}.log_completeness_pct == 100.00 and inspection_readiness_score == 79.90, still inspection_ready false against the RESTRICTED threshold 85.00"
            - "The second close call returns HTTP 200 with ThreatCase.${case_id}.status == CLOSED and protection_status == NOT_APPLICABLE"
