              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { nurse_v_now: $.data.version }
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req2_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 8300, proposed_shift: "DAY", expected_nurse_version: "${nurse_v_now}" }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /marketplace/applications/${app2_id}/review"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /marketplace/nurses/${nurse_id}/withdraw"
