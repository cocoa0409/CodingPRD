  - section: validations
    instances:
      - name: stale_campaign_version_outranks_offsite_channel_mismatch_and_returns_412
        claim_type: priority_conflict
        grounds:
          - validations[priority=21]
          - validations[priority=64]
          - concurrency_rules.line-item-create-stale-campaign
        distinguishing_aspect: "One request violates both the priority-21 OCC check and the priority-64 channel rule (an OFFSITE slot under an ONSITE_ONLY campaign); the response must be ERR_STALE_CAMPAIGN_VERSION with HTTP 412, never ERR_OFFSITE_CHANNEL_MISMATCH with 422, because the lower priority number wins."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an APPROVED 2026-Q3 plan and a DRAFT ONSITE_ONLY campaign; both an ONSITE slot SRP-A1 and an OFFSITE slot OFF-B1 exist."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - &v_slot_off
              call: "POST /rmn/placement-slots"
              payload: { slot_code: "OFF-B1", channel: "OFFSITE", page_type: "OFFSITE_DISPLAY", position_index: 1, max_concurrent_line_items: 2, floor_cpc_cents: 100, relevance_weight: 1.0, buffer_minutes: 60 }
              as: NetworkAdmin
              as_user_id: "u_admin"
              captures: { slot_off_id: $.data.id }
          trigger:
            - call: "POST /rmn/line-items"
              payload: { campaign_id: "${camp_id}", placement_slot_id: "${slot_off_id}", bid_cents: 200, bid_type: "CPC", flight_start_at: "2026-08-01T00:00:00Z", flight_end_at: "2026-08-11T00:00:00Z", daily_budget_cents: 100000, category_code: "FOOTWEAR", keyword_match_terms: ["red", "shoes"], expected_campaign_version: "${camp_v} - 1" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_CAMPAIGN_VERSION"
            - "Campaign.${camp_id}.delivery_status == DRAFT"
            - "Campaign.${camp_id}.line_item_count == 0"

      - name: daily_cap_above_the_self_serve_spend_cap_is_rejected_despite_fitting_the_allocation
