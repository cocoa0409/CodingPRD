          Nothing in this API is deferred: the acquire response itself must already carry status OWNED
          and the booked basis, and reads issued immediately afterwards must show the debited fund cash
          and the recomputed NAV with no settling time. Any field that only converges on a later read
          breaks the immediate consistency contract the whole test suite relies on.
