  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: contract_create_stale_case_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-create-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second contract create carrying the pre-supersede expected_case_version → ERR_STALE_VERSION (412); the first create advanced case.version."
        test_recipe:
          setup: ["An OPEN case at version 1; one contract created against it (case.version -> 2)."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Occ School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ivo Occ", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id", case_v0: "$.data.version" }
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-01"
                end_date: "2026-12-01"
                goals:
                  - { description: "First plan", weight: 1, target_value: 1, met_value: 0 }
                expected_case_version: "${case_v0}"
              as: Administrator
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-02"
                end_date: "2026-12-02"
                goals:
                  - { description: "Second plan", weight: 1, target_value: 1, met_value: 0 }
                expected_case_version: "${case_v0}"
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412 (case.version advanced to 2 after the first create)"

      - name: envelope_object_shape_on_create
        claim_type: immediate
        grounds: [response_envelope]
        distinguishing_aspect: "POST /schools returns response_type 'object', meta.api_request_id present, data.id a prefix-less UUID."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /schools"
              payload: { name: "Env2 School" }
              as: Administrator
              captures: { sch: "$.data.id" }
          assert:
            - "response response_type == object"
            - "response meta.api_request_id is present"
            - "data.id matches a bare UUID (no type prefix)"

