    side_effects: ["status -> NOTIFIED", "remediation_deadline set"]

  - method: POST
    path: "/easement-cases/{caseId}/vegetation-zones/{zoneId}/violations/{violId}/confirm-remediation"
    description: "Confirm remediation"
    roles: [VegetationInspector]
    code: 200
    input: []
    output: VegetationViolation
    side_effects: ["status -> REMEDIATED", "zone.violation_count decremented", "zone may auto-transition"]

  - method: POST
    path: "/easement-cases/{caseId}/vegetation-zones/{zoneId}/violations/{violId}/exempt"
    description: "Exempt a violation"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: VegetationViolation
    side_effects: ["status -> EXEMPTED", "zone.violation_count decremented"]

