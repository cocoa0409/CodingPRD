              as: StoreClerk
            - call: "POST /sales/${s1}/complete"
              payload: {}
              as: StoreClerk
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { s2: $.data.id }
            - call: "POST /sales/${s2}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${s2}/apply-coupon"
              payload: { coupon_code: "PRN10" }
              as: StoreClerk
            - call: "POST /sales/${s2}/complete"
              payload: {}
              as: StoreClerk
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { s3: $.data.id }
