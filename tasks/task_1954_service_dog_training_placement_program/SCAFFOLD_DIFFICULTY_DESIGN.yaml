            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { d_v: $.data.version } }
            - { call: "POST /api/dogs/${d_id}/match-proposals", payload: { waitlist_entry_id: "${entry_id}", expected_dog_version: "${d_v}" }, as: IntakeCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /api/matches/${m_id}/accept", as: IntakeCoordinator }
            - { call: "POST /api/classes", payload: { name: "Cancel Class", lead_trainer_id: "${t_id}", starts_on: "2026-09-01", ends_on: "2026-10-15", capacity: 2, total_sessions: 20 }, as: TrainingDirector, captures: { cl_id: $.data.id } }
            - { call: "POST /api/classes/${cl_id}/open-enrollment", as: TrainingDirector }
            - { call: "GET /api/classes/${cl_id}", as: TrainingDirector, captures: { cl_v: $.data.version } }
            - { call: "POST /api/classes/${cl_id}/enrollments", payload: { match_id: "${m_id}", expected_class_version: "${cl_v}" }, as: TrainingDirector, captures: { enr_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/classes/${cl_id}/start", as: TrainingDirector }
          trigger:
            - { call: "POST /api/classes/${cl_id}/cancel", as: TrainingDirector }
          assert:
            - "TeamTrainingClass.${cl_id}.status == CANCELLED (hop 0)"
            - "Enrollment.${enr_id}.status == WITHDRAWN (hop 1)"
            - "Dog.${d_id}.status == MATCHED (hop 2 — reverts to MATCHED, not MATCH_READY)"
            - "Applicant.${a_id}.application_status == MATCHED (hop 2)"
            - "MatchRecord.${m_id}.status == ACCEPTED (match retained — contrast with PAT-fail cascade)"
            - "WaitlistEntry.${entry_id}.status == MATCHED and dissolved_match_count == 0"
            - "TeamTrainingClass.${cl_id}.enrolled_count == 0 (hop 3)"

      - name: refund_clawback_revert_chain
        grounds:
          - calculations.refund_clawback
          - state_machines.Contribution.RECEIVED_to_REFUNDED
          - state_machines.WaitlistEntry.ELIGIBLE_to_PENDING
          - state_machines.Applicant.MATCH_ELIGIBLE_to_WAITLISTED
        distinguishing_aspect: "Depth-3 cascade from a third distinct trigger (contribution refund): Contribution RECEIVED -> REFUNDED -> WaitlistEntry raised_cents drops 800000 -> 500000 below effective requirement 765000 -> entry ELIGIBLE -> PENDING -> Applicant MATCH_ELIGIBLE -> WAITLISTED; each hop caused by the previous one."
        test_recipe:
          setup:
            - "FACILITY applicant, income 12000000 (provisional requirement 765000); contributions 500000 + 300000 both RECEIVED; entry ELIGIBLE"
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Reba Refund", email: "reba.r@x.com", placement_track: FACILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [GUIDE_NAVIGATION], task_urgency_tier: STANDARD, home_environment_score: 5 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor U1", amount_cents: 500000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor U2", amount_cents: 300000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c2_id: $.data.id } }
            - { call: "POST /api/contributions/${c2_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id", raised_pre: "$.data[0].raised_cents" } }
          trigger:
            - { call: "POST /api/contributions/${c2_id}/refund", as: IntakeCoordinator }
          assert:
            - "precondition held: entry was ELIGIBLE with raised_cents == 800000 and applicant MATCH_ELIGIBLE"
            - "Contribution.${c2_id}.status == REFUNDED (hop 1)"
            - "WaitlistEntry.${entry_id}.raised_cents == 500000 (hop 2)"
            - "WaitlistEntry.${entry_id}.status == PENDING (500000 < 765000; hop 2)"
            - "Applicant.${a_id}.application_status == WAITLISTED (hop 3)"

  # ---------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ---------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_priority_on_contribution
        grounds:
          - "validations[priority=10]"
          - "validations[priority=33]"
          - "errors[ERR_APPLICANT_NOT_ACTIVE]"
          - "errors[ERR_CONTRIBUTION_BELOW_MINIMUM]"
        distinguishing_aspect: "Category pair state vs business_fiscal: a contribution of 50 cents (below the 100-cent minimum, fiscal) recorded for a WITHDRAWN applicant (state) must surface ERR_APPLICANT_NOT_ACTIVE, not ERR_CONTRIBUTION_BELOW_MINIMUM."
        test_recipe:
          setup:
            - "Applicant created and withdrawn from SUBMITTED by the coordinator"
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Gone Gone", email: "gone.g@x.com", placement_track: MOBILITY, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/withdraw", as: IntakeCoordinator }
          trigger:
            - call: "POST /api/applicants/${a_id}/contributions"
              payload: { donor_name: "Too Late", amount_cents: 50 }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPLICANT_NOT_ACTIVE (state priority 10 beats fiscal priority 33)"
            - "http status == 409 (not 422)"

      - name: safety_vs_referential_priority_on_pat
        grounds:
          - "validations[priority=13]"
          - "validations[priority=29]"
          - "errors[ERR_EVALUATOR_CONFLICT]"
          - "errors[ERR_EVALUATOR_NOT_CERTIFIED]"
        distinguishing_aspect: "Category pair business_safety vs business_referential: an evaluator who is BOTH the dog's primary trainer (segregation-of-duties safety violation) AND not pat_certified (referential violation) must surface ERR_EVALUATOR_CONFLICT, not ERR_EVALUATOR_NOT_CERTIFIED."
        test_recipe:
          setup:
            - "Matched pair enrolled, class IN_SESSION; the dog's primary trainer T has pat_certified == false"
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Conflict", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "Sod", origin: DONATED, breed: "Labrador", sex: MALE, born_on: "2024-02-15", region: NW, donor_name: "Donor Seven" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser Seven", region: NW, foster_capacity: 1, experience_score: 45 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /api/raiser-placements/${pl_id}/complete", payload: { primary_trainer_id: "${t_id}" }, as: TrainingDirector }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 95 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: OPEN_DOORS, score: 90 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: PUBLIC_MANNERS, score: 88 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 85 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: SOCIALIZATION, score: 82 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 84 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/applicants", payload: { full_name: "Sod Applicant", email: "sod.a@x.com", placement_track: MOBILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [RETRIEVE_ITEMS], task_urgency_tier: STANDARD, home_environment_score: 6 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor T", amount_cents: 1350000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c_id: $.data.id } }
            - { call: "POST /api/contributions/${c_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { d_v: $.data.version } }
            - { call: "POST /api/dogs/${d_id}/match-proposals", payload: { waitlist_entry_id: "${entry_id}", expected_dog_version: "${d_v}" }, as: IntakeCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /api/matches/${m_id}/accept", as: IntakeCoordinator }
            - { call: "POST /api/classes", payload: { name: "Sod Class", lead_trainer_id: "${t_id}", starts_on: "2026-09-01", ends_on: "2026-10-15", capacity: 2, total_sessions: 20 }, as: TrainingDirector, captures: { cl_id: $.data.id } }
            - { call: "POST /api/classes/${cl_id}/open-enrollment", as: TrainingDirector }
            - { call: "GET /api/classes/${cl_id}", as: TrainingDirector, captures: { cl_v: $.data.version } }
            - { call: "POST /api/classes/${cl_id}/enrollments", payload: { match_id: "${m_id}", expected_class_version: "${cl_v}" }, as: TrainingDirector, captures: { enr_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/classes/${cl_id}/start", as: TrainingDirector }
          trigger:
            - call: "POST /api/enrollments/${enr_id}/public-access-tests"
              payload: { scheduled_at: "2026-10-01T10:00:00Z" }
              as: Evaluator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EVALUATOR_CONFLICT (safety priority 13 beats referential priority 29)"
            - "the same request also violates ERR_EVALUATOR_NOT_CERTIFIED (pat_certified false) but that error must NOT surface"

      - name: existence_vs_constraint_priority_on_match_proposal
        grounds:
          - "validations[priority=6]"
          - "validations[priority=9]"
          - "errors[ERR_REFERENCE_NOT_FOUND]"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Category pair existence vs state: a match proposal naming a non-existent waitlist_entry_id against a REGISTERED dog (not MATCH_READY) must surface ERR_REFERENCE_NOT_FOUND — body-reference existence (priority 6) is checked before the dog's state precondition (priority 9)."
        test_recipe:
          setup:
            - "Dog freshly intaked, status REGISTERED (never screened)"
          setup_api_calls:
            - { call: "POST /api/dogs", payload: { name: "Early", origin: DONATED, breed: "Mix", sex: FEMALE, born_on: "2025-01-01", region: NW, donor_name: "Donor Eight" }, as: ProgramAdmin, captures: { d_id: $.data.id, d_v: $.data.version } }
          trigger:
            - call: "POST /api/dogs/${d_id}/match-proposals"
              payload: { waitlist_entry_id: "00000000-0000-0000-0000-000000000000", expected_dog_version: "${d_v}" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND (existence priority 6 beats state priority 9)"
            - "http status == 404 (not 409)"

  # ---------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics/endpoints
  # ---------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: fundraising_exact_threshold_crossing
        grounds:
          - state_machines.WaitlistEntry.PENDING_to_ELIGIBLE
          - calculations.refund_clawback
          - "validations[priority=33]"
        distinguishing_aspect: "Inclusive >= boundary on the raised_cents metric via POST /api/contributions/{id}/receive: 764900 of 765000 leaves the entry PENDING; adding exactly 100 cents to reach 765000 == effective_requirement_cents flips it to ELIGIBLE (equality satisfies the threshold)."
        test_recipe:
          setup:
            - "FACILITY applicant, income 12000000 (0% credit; provisional requirement = 900000 - 135000 = 765000); first contribution 764900 already RECEIVED"
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Edge Fund", email: "edge.f@x.com", placement_track: FACILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [GUIDE_NAVIGATION], task_urgency_tier: STANDARD, home_environment_score: 5 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor E1", amount_cents: 764900 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c1_id: $.data.id } }
            - { call: "POST /api/contributions/${c1_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id", st_pre: "$.data[0].status", raised_pre: "$.data[0].raised_cents" } }
          trigger:
