  # =========================================================================
  # Rule 4 — transitive_cascade (turnaround depth 3; cancellation depth 3)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: turnaround_begin_depth3_cascade
        grounds:
          - state_machines.LiquefactionTrain.COMMERCIAL_OPERATION_to_TURNAROUND
          - state_machines.CargoSlot.SCHEDULED_to_RESCHEDULED
          - calculations.turnaround_production_impact
        distinguishing_aspect: |
          Depth-3 chain from turnaround begin: turnaround -> train TURNAROUND (1) ->
          overlapping slot shifted (2) -> owning ADP quantities recomputed and ADP
          version bumped (3). Each hop is caused by the previous hop, not by begin.
        test_recipe:
          setup:
            - "Commercial train T1; confirmed ADP with slot S window 2027-03-05..2027-03-12 qty 3,600,000 and slot S2 window 2027-06-01..2027-06-08 qty 3,600,000 (not overlapping); APPROVED turnaround 2027-03-01..2027-03-10 (10 days, closed); clock at 2027-03-01; ADP version captured before begin"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Zeta Petrochemical", credit_rating: "AA" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-03-05T00:00:00Z", window_end: "2027-03-12T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot2: $.data.id } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/adps/${adp}/lock", payload: {}, as: CommercialManager, captures: { adp_v_pre: $.data.version } }
            - { call: "POST /api/trains/${tr}/turnarounds", payload: { planned_start_date: "2027-03-01", planned_end_date: "2027-03-10" }, as: TerminalOperator, as_user_id: "op-1", captures: { ta: $.data.id } }
            - { call: "POST /api/turnarounds/${ta}/approve", payload: {}, as: TerminalOperator, as_user_id: "op-2" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: TerminalOperator }
          trigger:
            - { call: "POST /api/turnarounds/${ta}/begin", payload: {}, as: TerminalOperator, as_user_id: "op-3", captures: { ta_after: $.data.version } }
          assert:
            - "LiquefactionTrain.${tr}.status == TURNAROUND (hop 1)"
            - "CargoSlot.${slot}.window_start == 2027-03-15T00:00:00Z and window_end == 2027-03-22T00:00:00Z (hop 2: shifted by 10 days)"
            - "CargoSlot.${slot}.lift_status == SCHEDULED (RESCHEDULED then system-restored)"
            - "CargoSlot.${slot2}.window_start == 2027-06-01T00:00:00Z (non-overlapping slot untouched)"
            - "AnnualDeliveryProgram.${adp}.version == ${adp_v_pre} + 1 (hop 3: slot shift caused ADP recompute)"
            - "AnnualDeliveryProgram.${adp}.scheduled_quantity_mmbtu == 7200000 (unchanged sum — shift conserves quantity)"
            - "MaintenanceTurnaround.${ta}.shifted_cargo_slot_count == 1"
            - "MaintenanceTurnaround.${ta}.lost_production_mmbtu == 7000000"

      - name: cancellation_depth3_reproration_cascade
        grounds:
          - state_machines.CargoSlot.SCHEDULED_to_CANCELLED
          - state_machines.FeedGasNomination.CONFIRMED_to_CUT
          - calculations.prorata_nomination_scaling
        distinguishing_aspect: |
          Depth-3 chain from a customer cancellation: cancel -> slot CANCELLED (1) ->
          its CONFIRMED nomination CUT to zero (2) -> the cut re-runs proration on the
          CLOSED schedule, raising surviving nominations from 46,154/15,385 to their
          full 60,000/20,000 (3). Trigger differs from the turnaround cascade.
        test_recipe:
          setup:
            - "Proration setup executed and schedule CLOSED: nominations A 60,000->46,154, B 50,000->38,461, C 20,000->15,385; slot B window 2027-06-01 (47 days notice from clock 2027-04-15)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Eta Utility Co", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 36000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 5000000 }, as: CommercialManager, captures: { slotA: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 5000000 }, as: CommercialManager, captures: { slotB: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 5000000 }, as: CommercialManager, captures: { slotC: $.data.id } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
            - { call: "POST /api/pipelines", payload: { name: "PL-1", daily_capacity_mmbtu: 500000 }, as: TerminalOperator, captures: { pipe: $.data.id } }
            - { call: "POST /api/pipelines/${pipe}/day-schedules", payload: { gas_day: "2027-06-03", capacity_mmbtu: 100000 }, as: GasScheduler, captures: { sched: $.data.id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "${slotA}", nominated_mmbtu: 60000 }, as: GasScheduler, captures: { nomA: $.data.id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "${slotB}", nominated_mmbtu: 50000 }, as: GasScheduler, captures: { nomB: $.data.id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "${slotC}", nominated_mmbtu: 20000 }, as: GasScheduler, captures: { nomC: $.data.id } }
            - { call: "POST /api/pipeline-day-schedules/${sched}/close", payload: {}, as: GasScheduler }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-04-15T00:00:00Z" }, as: TerminalOperator }
          trigger:
            - { call: "POST /api/cargo-slots/${slotB}/cancellations", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { cx: $.data.id } }
          assert:
            - "CargoSlot.${slotB}.lift_status == CANCELLED (hop 1)"
            - "FeedGasNomination.${nomB}.status == CUT and confirmed_mmbtu == 0 and cut_mmbtu == 50000 (hop 2)"
            - "FeedGasNomination.${nomA}.confirmed_mmbtu == 60000 (hop 3: re-proration restored full volume)"
            - "FeedGasNomination.${nomC}.confirmed_mmbtu == 20000"
            - "PipelineDaySchedule.${sched}.total_nominated_mmbtu == 130000"
            - "PipelineDaySchedule.${sched}.total_confirmed_mmbtu == 80000"
            - "PipelineDaySchedule.${sched}.total_cut_mmbtu == 50000"
            - "CargoCancellation.${cx}.fixed_fee_due_usd == 17500000.00"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (state vs fiscal; safety vs temporal)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_adp_confirm
        grounds:
          - validations[priority=4]
          - validations[priority=18]
          - errors[ERR_ADP_INVALID_STATE]
          - errors[ERR_ACQ_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: confirming a DRAFT ADP whose
          slots (3,600,000) exceed ACQ (3,000,000) violates BOTH rules; priority 4
          state wins over priority 18 fiscal, so ERR_ADP_INVALID_STATE is returned.
        test_recipe:
          setup:
            - "SPA with ACQ 3,000,000; ADP in DRAFT with one slot of 3,600,000 (slot creation does not check ACQ)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Theta Gas Supply", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 3000000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-02-01T00:00:00Z", window_end: "2027-02-08T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager }
          trigger:
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ADP_INVALID_STATE (state priority 4 beats fiscal priority 18)"
            - "AnnualDeliveryProgram.${adp}.status == DRAFT"

      - name: safety_beats_temporal_on_berth_accept
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_VESSEL_BERTH_INCOMPATIBLE]
          - errors[ERR_BERTH_WINDOW_OVERLAP]
