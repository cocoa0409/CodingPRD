# =============================================================================
# §1.9 SCAFFOLD CORNER DESIGN — Fishery Observer & Catch Monitoring Program
# Coverage Index for Non-Difficulty Tests: enumerates every testable claim the
# scaffold's §1.1–§1.7 surface declares that §1.8 does not already cover.
# Sections and claim_type values follow references/claim-extraction-guide.md.
# Instances already exercised by a §1.8 difficulty instance are emitted as
# excluded_because stubs (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities (Table 1): creation, required fields, defaults,
  # computed fields, system fields, type constraints, immutability, not-found,
  # listing/pagination. Flat topology: FK references validated.
  # ===========================================================================
  - section: entities
    instances:
      - name: fishery_creation_applies_defaults_and_computed_surface
        claim_type: creation
        grounds:
          - entities.Fishery
          - endpoints["POST /observer-program/fisheries"]
        distinguishing_aspect: |
          A fishery created with all required inputs returns 201 with
          status defaulted to ACTIVE (system source), server-minted id,
          created_at/updated_at/version == 1 (common_fields), and the echoed
          input fields.
        test_recipe:
          setup: ["empty database; logical clock at startup default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-ENT", name: "Entity Fishery", region: "Bering Sea", coverage_target_pct: 0.25, priority_gear: "POT" }
              as: ProgramAdmin
              captures: { f_id: $.data.id, f_status: $.data.status, f_ver: $.data.version }
          assert:
            - "response code == 201 and Fishery.status == ACTIVE (default applied)"
            - "Fishery.${f_id}.version == 1 and id is a server-minted UUID"
            - "Fishery.${f_id}.created_at == 2026-08-01T00:00:00Z (startup default clock)"

      - name: fishery_creation_missing_coverage_target_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Fishery.fields.coverage_target_pct
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          coverage_target_pct is a required input field with no default; omitting
          it yields ERR_INVALID_REQUEST (400).
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-MISS", name: "Missing Field Fishery", region: "Bering Sea", priority_gear: "POT" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST and http status == 400"
            - "no Fishery row created"

      - name: fishery_coverage_target_out_of_range_boundary_values
        claim_type: type_constraints
        grounds:
          - entities.Fishery.fields.coverage_target_pct
          - errors[ERR_COVERAGE_TARGET_OUT_OF_RANGE]
        distinguishing_aspect: |
          coverage_target_pct is pinned to the inclusive range [0.02, 1.00]:
          0.01 and 1.01 are rejected with ERR_COVERAGE_TARGET_OUT_OF_RANGE (422)
          while 0.02 and 1.00 are accepted.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-LO", name: "Too Low", region: "Bering Sea", coverage_target_pct: 0.01, priority_gear: "POT" }
              as: ProgramAdmin
              captures: { err_lo: $.data.error_id }
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-HI", name: "Too High", region: "Bering Sea", coverage_target_pct: 1.01, priority_gear: "POT" }
              as: ProgramAdmin
              captures: { err_hi: $.data.error_id }
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-MIN", name: "Min OK", region: "Bering Sea", coverage_target_pct: 0.02, priority_gear: "POT" }
              as: ProgramAdmin
              captures: { ok_lo: $.data.id }
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-MAX", name: "Max OK", region: "Bering Sea", coverage_target_pct: 1.00, priority_gear: "POT" }
              as: ProgramAdmin
              captures: { ok_hi: $.data.id }
          assert:
            - "0.01 -> ERR_COVERAGE_TARGET_OUT_OF_RANGE (422); 1.01 -> ERR_COVERAGE_TARGET_OUT_OF_RANGE (422)"
            - "0.02 -> 201 created; 1.00 -> 201 created (inclusive boundaries)"

      - name: observer_max_consecutive_sea_days_derived_from_certification
        claim_type: computed_fields
        grounds:
          - entities.Observer.fields.max_consecutive_sea_days
          - calculations.observer_capacity_check
        distinguishing_aspect: |
          max_consecutive_sea_days is a computed field derived from
          certification_level: TRAINEE=20, CERTIFIED=30, LEAD=45. Creating one
          observer of each level returns the derived value; any client-supplied
          value for a computed field is ignored.
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /observer-program/observers"
              payload: { person_ref: "person-ent-t", full_name: "Trainee Troy", home_port: "Kodiak", certification_level: "TRAINEE" }
              as: ProgramAdmin
              captures: { t_cap: $.data.max_consecutive_sea_days }
            - call: "POST /observer-program/observers"
              payload: { person_ref: "person-ent-c", full_name: "Certified Cara", home_port: "Kodiak", certification_level: "CERTIFIED" }
              as: ProgramAdmin
              captures: { c_cap: $.data.max_consecutive_sea_days }
            - call: "POST /observer-program/observers"
              payload: { person_ref: "person-ent-l", full_name: "Lead Liam", home_port: "Kodiak", certification_level: "LEAD" }
              as: ProgramAdmin
              captures: { l_cap: $.data.max_consecutive_sea_days }
          assert:
            - "TRAINEE observer.max_consecutive_sea_days == 20"
            - "CERTIFIED observer.max_consecutive_sea_days == 30"
            - "LEAD observer.max_consecutive_sea_days == 45"

      - name: vessel_creation_seeds_prior_history_fields
        claim_type: defaults
        grounds:
          - entities.Vessel.fields.prior_last_observed_end_date
          - entities.Vessel.fields.last_observed_end_date
          - entities.Vessel.fields.prior_harassment_points
          - entities.Vessel.fields.selection_penalty_points
          - entities.Vessel.fields.monitoring_mode
        distinguishing_aspect: |
          Vessel creation copies prior_last_observed_end_date into the system
          field last_observed_end_date and prior_harassment_points into
          selection_penalty_points; omitted prior_harassment_points defaults to
          0; monitoring_mode defaults to HUMAN_OBSERVER and status to REGISTERED.
        test_recipe:
          setup:
            - "Fishery F and operator OP exist"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-SEED", name: "Seed Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Seed Ops LLC", license_number: "LIC-SEED-1", contact_person_ref: "person-seed-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Seed", permit_number: "PERMIT-SEED", home_port: "Kodiak", length_ft: 45, gear_type: "POT", prior_last_observed_end_date: "2025-11-30T00:00:00Z", prior_harassment_points: 4 }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id, v_loed: $.data.last_observed_end_date, v_pts: $.data.selection_penalty_points, v_mode: $.data.monitoring_mode, v_status: $.data.status }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Seed2", permit_number: "PERMIT-SEED2", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v2_id: $.data.id, v2_loed: $.data.last_observed_end_date, v2_pts: $.data.selection_penalty_points }
          assert:
            - "Vessel.${v_id}.last_observed_end_date == 2025-11-30T00:00:00Z (seeded from prior_last_observed_end_date)"
            - "Vessel.${v_id}.selection_penalty_points == 4 (seeded from prior_harassment_points)"
            - "Vessel.${v_id}.monitoring_mode == HUMAN_OBSERVER and status == REGISTERED (defaults)"
            - "Vessel.${v2_id}.last_observed_end_date == null and selection_penalty_points == 0 (omitted optionals)"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints["GET /observer-program/vessels/{id}"]
        distinguishing_aspect: |
          GET on a non-existent UUID returns the error envelope with
          ERR_NOT_FOUND (404) — existence validation (priority 3).
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /observer-program/vessels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND and http status == 404"
            - "response_type == error in the envelope"

      - name: list_endpoint_pagination_fields_and_defaults
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints["GET /observer-program/vessels"]
        distinguishing_aspect: |
          List endpoints honor the fixed response envelope pagination contract:
          limit default 10 (min 1, max 100), offset default 0, and the response
          carries total_count and has_more. With 3 vessels and limit=2 the first
          page returns 2 rows with has_more true and total_count 3.
        test_recipe:
          setup:
            - "Fishery F, operator OP, three vessels registered under OP"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-PAG", name: "Pagination Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Pag Ops LLC", license_number: "LIC-PAG-1", contact_person_ref: "person-pag-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Pag1", permit_number: "PERMIT-PAG-1", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Pag2", permit_number: "PERMIT-PAG-2", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Pag3", permit_number: "PERMIT-PAG-3", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
          trigger:
            - call: "GET /observer-program/vessels"
              payload: { operator_id: "${op_id}", limit: 2, offset: 0 }
              as: ProgramCoordinator
              captures: { page1: $.data }
            - call: "GET /observer-program/vessels"
              payload: { operator_id: "${op_id}", limit: 2, offset: 2 }
              as: ProgramCoordinator
              captures: { page2: $.data }
          assert:
            - "page 1 returns exactly 2 vessel rows with total_count == 3 and has_more == true"
            - "page 2 returns exactly 1 vessel row with total_count == 3 and has_more == false"
            - "no vessel id appears in both pages (offset pagination is disjoint)"

      - name: safety_inspection_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.SafetyInspection
        distinguishing_aspect: |
          SafetyInspection is declared common_fields: false — it carries only id
          and created_at, has no version field, and no PATCH/PUT endpoint exists
          for it (append-only inspection log; corrections happen via a new
          superseding inspection).
        test_recipe:
          setup:
            - "Deployment D in SCHEDULED for vessel V / observer OBS (fishery F, plan P, notice N accepted)"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-IMM", name: "Immutable Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Imm Ops LLC", license_number: "LIC-IMM-1", contact_person_ref: "person-imm-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/observers"
              payload: { person_ref: "person-imm-obs", full_name: "Ivy Observer", home_port: "Kodiak", certification_level: "LEAD" }
              as: ProgramAdmin
              captures: { obs_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Imm", permit_number: "PERMIT-IMM", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-05T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
            - call: "GET /observer-program/selection-notices"
              payload: { coverage_plan_id: "${plan_id}", vessel_id: "${v_id}" }
              as: ProgramCoordinator
              captures: { n_id: "$.data[0].id" }
            - call: "POST /observer-program/selection-notices/${n_id}/accept"
              payload: {}
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { n_v: $.data.version }
            - call: "POST /observer-program/deployments"
              payload: { selection_notice_id: "${n_id}", observer_id: "${obs_id}", scheduled_departure_date: "2026-09-10T00:00:00Z", scheduled_return_date: "2026-09-15T00:00:00Z", expected_selection_notice_version: "${n_v}" }
              as: ProgramCoordinator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /observer-program/deployments/${d_id}/safety-inspections"
              payload: { life_raft_certified: true, epirb_registered: true, immersion_suits_adequate: true, fire_suppression_ok: true, comms_equipment_ok: true }
              as: Observer
              as_user_id: "${obs_id}"
              captures: { insp_id: $.data.id, insp_result: $.data.result }
          assert:
            - "SafetyInspection.${insp_id}.result == PASS (all five booleans true)"
            - "SafetyInspection.${insp_id} response contains id and created_at but NO version field (common_fields: false)"
            - "SafetyInspection.${insp_id}.deployment_id == ${d_id} and observer_id == ${obs_id} (system-copied FKs)"

      - name: unique_constraint_on_fishery_code_and_vessel_permit
        claim_type: type_constraints
        grounds:
          - errors[ERR_UNIQUE_CONSTRAINT]
          - entities.Fishery.fields.code
          - entities.Vessel.fields.permit_number
        distinguishing_aspect: |
          Flat-topology FK/uniqueness integrity: Fishery.code and
          Vessel.permit_number carry uniqueness constraints; a second create
          reusing either value fails with ERR_UNIQUE_CONSTRAINT (409).
        test_recipe:
          setup:
            - "Fishery F with code BSAI-UQ and operator OP with vessel PERMIT-UQ exist"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-UQ", name: "Unique Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Uq Ops LLC", license_number: "LIC-UQ-1", contact_person_ref: "person-uq-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Uq", permit_number: "PERMIT-UQ", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-UQ", name: "Duplicate Code", region: "GOA", coverage_target_pct: 0.20, priority_gear: "POT" }
              as: ProgramAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Uq Dup", permit_number: "PERMIT-UQ", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "duplicate Fishery.code -> ERR_UNIQUE_CONSTRAINT (409)"
            - "duplicate Vessel.permit_number -> ERR_UNIQUE_CONSTRAINT (409)"

      - name: haul_sample_sampling_ratio_computed_and_bounded
        claim_type: computed_fields
        grounds:
          - entities.HaulSample.fields.sampling_ratio
          - errors[ERR_SAMPLE_RATIO_OUT_OF_RANGE]
        distinguishing_aspect: |
          sampling_ratio is computed as sampled_weight_kg / total_haul_weight_kg
          (4 decimals, round_half_up) and must lie in [0.2000, 1.0000]; a sample
          with ratio below 0.2000 is rejected with ERR_SAMPLE_RATIO_OUT_OF_RANGE.
        test_recipe:
          setup:
            - "Deployment D AT_SEA (boarded) for vessel V / observer OBS"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-SR", name: "Sample Ratio Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Sr Ops LLC", license_number: "LIC-SR-1", contact_person_ref: "person-sr-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/observers"
              payload: { person_ref: "person-sr-obs", full_name: "Sam Observer", home_port: "Kodiak", certification_level: "LEAD" }
              as: ProgramAdmin
              captures: { obs_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Sr", permit_number: "PERMIT-SR", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-05T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
            - call: "GET /observer-program/selection-notices"
              payload: { coverage_plan_id: "${plan_id}", vessel_id: "${v_id}" }
              as: ProgramCoordinator
              captures: { n_id: "$.data[0].id" }
            - call: "POST /observer-program/selection-notices/${n_id}/accept"
              payload: {}
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { n_v: $.data.version }
            - call: "POST /observer-program/deployments"
              payload: { selection_notice_id: "${n_id}", observer_id: "${obs_id}", scheduled_departure_date: "2026-09-10T00:00:00Z", scheduled_return_date: "2026-09-19T00:00:00Z", expected_selection_notice_version: "${n_v}" }
              as: ProgramCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /observer-program/deployments/${d_id}/safety-inspections"
              payload: { life_raft_certified: true, epirb_registered: true, immersion_suits_adequate: true, fire_suppression_ok: true, comms_equipment_ok: true }
              as: Observer
              as_user_id: "${obs_id}"
            - call: "POST /observer-program/deployments/${d_id}/board"
              payload: {}
              as: Observer
              as_user_id: "${obs_id}"
          trigger:
            - call: "POST /observer-program/deployments/${d_id}/haul-samples"
              payload: { haul_date: "2026-09-12T00:00:00Z", haul_number: 1, species_code: "PLCK", sampled_weight_kg: 250, total_haul_weight_kg: 1000 }
              as: Observer
              as_user_id: "${obs_id}"
              captures: { h_ratio: $.data.sampling_ratio }
            - call: "POST /observer-program/deployments/${d_id}/haul-samples"
              payload: { haul_date: "2026-09-12T00:00:00Z", haul_number: 2, species_code: "PLCK", sampled_weight_kg: 199, total_haul_weight_kg: 1000 }
              as: Observer
              as_user_id: "${obs_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HaulSample 1: sampling_ratio == 0.2500 (250/1000, 4 decimals round_half_up)"
            - "HaulSample 2 (199/1000 = 0.1990 < 0.2000) -> ERR_SAMPLE_RATIO_OUT_OF_RANGE (422)"

      - name: fk_reverse_reachability_filtered_lists
        claim_type: parent_relationships
        grounds:
          - entities.Vessel.fields.operator_id
          - entities.Deployment.fields.vessel_id
          - entities.HaulSample.fields.deployment_id
          - entities.SelectionNotice.fields.coverage_plan_id
        distinguishing_aspect: |
          Flat topology: every child FK is reverse-reachable via a filtered-list
          GET — GET /vessels?operator_id=, GET /deployments?vessel_id=,
          GET /haul-samples?deployment_id=, GET /selection-notices?coverage_plan_id=
          each return arrays scoped to the parent id.
        test_recipe:
          setup:
            - "Fishery F, operator OP, vessel V ACTIVE, observer OBS; plan P published; notice accepted; deployment D SCHEDULED"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
