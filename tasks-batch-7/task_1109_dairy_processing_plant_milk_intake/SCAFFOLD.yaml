  - method: GET
    path: /dairy/pasteurizer-runs/{id}/cip-cycles
    description: "List CIP cycles for a run"
    roles: [PasteurizerOperator, QualityAssuranceManager, PlantController]
    code: 200
    input: ["pasteurizer_run_id?"]
