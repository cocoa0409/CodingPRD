scenario: |
  Field Kitchen Activation & Local Restaurant Meal Sourcing (World Central Kitchen): rapid assessment
  deployment to a disaster area determining feeding needs, access constraints and partner availability,
  field kitchen siting with power, water and food safety considerations in damaged infrastructure, local
  restaurant activation contracting with kitchens to produce meals with per-meal pricing and quality
  standards, ingredient sourcing through local suppliers to support the affected economy with cash flow to
  producers, meal distribution routing to shelters, hospitals and neighborhoods with volunteer drivers and
  community partners, meal counting, reporting and donor accountability across rapidly changing operations,
  culturally appropriate menu planning for affected populations, demobilization and transition to local
  organizations
domain_name: "field-kitchen-activation"
api_prefix: "/field-ops"

complexity_profile:
  primary_archetype: "workflow orchestration"
  secondary_archetype: "compliance / audit"
  complexity_layers:
    - "optimistic concurrency"
    - "cascading side effects"
    - "dual-variant calculation"
    - "rate / threshold triggers"
    - "selector policy"
  entity_topology: "flat"
  state_machine_shape: "parallel"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human label of the activation, e.g. "2026 Central Valley Floods"
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 code of the affected country
        constraints: "exactly 2 uppercase letters"
      - name: disaster_type
        type: enum
        source: input
        description: hazard class driving the feeding response
        constraints: "EARTHQUAKE | FLOOD | HURRICANE | WILDFIRE | CONFLICT | EPIDEMIC"
      - name: severity_level
        type: integer
        source: input
        description: operational severity on a 1-5 scale
        constraints: "1 <= severity_level <= 5"
      - name: target_daily_meals
        type: integer
        source: input
        description: planning target for meals served per day across the whole activation
        constraints: ">= 1"
      - name: funding_ceiling_cents
        type: integer
        source: input
        description: hard ceiling on cumulative meal-order and sourcing spend for this incident
        constraints: ">= 0"
      - name: currency_code
        type: string
        source: input
        description: ISO 4217 code used for every monetary field of this incident
        default: "USD"
      - name: population_dietary_requirements
        type: array
        source: input
        description: dietary tags the affected population requires every meal to satisfy
        constraints: "subset of [HALAL, VEGETARIAN, VEGAN, NUT_FREE, GLUTEN_FREE, LOW_SODIUM]"
      - name: status
        type: enum
        source: system
        description: lifecycle state of the activation
        constraints: "MONITORING | ACTIVE | WINDING_DOWN | CLOSED"
        default: "MONITORING"
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant the incident entered ACTIVE
      - name: wind_down_started_at
        type: datetime
        source: system
        description: logical-clock instant the incident entered WINDING_DOWN; null while not winding down
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the incident entered CLOSED
      - name: committed_cents
        type: integer
        source: computed
        description: "sum of DonorCommitment.amount_cents for this incident whose status IN {RECEIVED, ALLOCATED, PARTIALLY_DISBURSED, CLOSED}"
      - name: spent_cents
        type: integer
        source: computed
        description: "sum of MealOrder.provisional_cost_cents for orders whose status IN {PLACED, IN_PRODUCTION, QUALITY_HOLD, READY, DISPATCHED} plus MealOrder.final_cost_cents for orders whose status == DELIVERED, plus IngredientPurchase.amount_cents whose status IN {DELIVERED, PAID}"
      - name: delivered_meal_total
        type: integer
        source: computed
        description: "sum of MealOrder.accepted_meals for this incident whose status == DELIVERED"
      - name: local_sourcing_pct
        type: integer
        source: computed
        description: "share of delivered-meal spend matched by local supplier ingredient spend (calculation incident_local_sourcing_ratio)"
      - name: cost_per_meal_cents
        type: integer
        source: computed
        description: "final delivered-meal spend divided by delivered_meal_total, 0 when delivered_meal_total == 0"

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this rapid needs assessment belongs to"
      - name: assessed_at
        type: datetime
        source: input
        description: logical-clock instant the field team completed the assessment
      - name: population_affected
        type: integer
        source: input
        description: number of people in the assessed catchment area
        constraints: ">= 0"
      - name: estimated_daily_meal_need
        type: integer
        source: input
        description: field estimate of meals required per day in the catchment
        constraints: ">= 0"
      - name: access_constraint
        type: enum
        source: input
        description: road and security access into the catchment
        constraints: "OPEN | LIMITED | RESTRICTED | BLOCKED"
      - name: water_available
        type: boolean
        source: input
        description: whether potable water is available at the assessed catchment
      - name: power_available
        type: boolean
        source: input
        description: whether grid or generator power is available at the assessed catchment
      - name: partner_kitchens_identified
        type: integer
        source: input
        description: count of local restaurants the assessment team identified as activatable
        constraints: ">= 0"
      - name: assessment_mode
        type: enum
        source: input
        description: planning posture that selects the feeding-priority weighting variant
        constraints: "RAPID | DURABLE"
        default: "RAPID"
      - name: feeding_priority_score
        type: integer
        source: computed
        description: 0-100 deployment priority produced by calculation assessment_feeding_priority
      - name: status
        type: enum
        source: system
        description: assessment lifecycle; created directly in SUBMITTED
        constraints: "SUBMITTED | SUPERSEDED"
        default: "SUBMITTED"

  - name: FieldKitchen
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this field kitchen is deployed under"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the assessment that justifies siting this kitchen"
      - name: site_name
        type: string
        source: input
        description: physical location label of the field kitchen site
      - name: latitude
        type: number
        source: input
        description: site latitude in decimal degrees
        constraints: "-90.0 <= latitude <= 90.0"
      - name: longitude
        type: number
        source: input
        description: site longitude in decimal degrees
        constraints: "-180.0 <= longitude <= 180.0"
      - name: power_source
        type: enum
        source: input
        description: primary power arrangement at the site
        constraints: "GRID | GENERATOR | SOLAR | NONE"
      - name: water_source
        type: enum
        source: input
        description: primary potable water arrangement at the site
        constraints: "PIPED | TRUCKED | WELL | NONE"
      - name: refrigeration_hours_available
        type: integer
        source: input
        description: hours per day of reliable cold storage at the site
        constraints: ">= 0"
      - name: daily_capacity_meals
        type: integer
        source: input
        description: maximum meals the site can produce per day
        constraints: ">= 0"
      - name: site_status
        type: enum
        source: system
        description: lifecycle state of the field kitchen site
        constraints: "SITED | UTILITIES_PENDING | FOOD_SAFETY_CLEARED | OPERATIONAL | SUSPENDED | DEMOBILIZED"
        default: "SITED"
      - name: food_safety_score
        type: integer
        source: computed
        description: 0-100 food safety readiness produced by calculation field_kitchen_food_safety_score
      - name: last_inspection_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent recorded inspection
      - name: suspended_at
        type: datetime
        source: system
        description: logical-clock instant the site entered SUSPENDED; null when not suspended
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant the site entered OPERATIONAL
      - name: demobilized_at
        type: datetime
        source: system
        description: logical-clock instant the site entered DEMOBILIZED
      - name: runs_today_count
        type: integer
        source: computed
        description: "count of DistributionRun rows for this field kitchen whose planned_date falls in the current UTC calendar day [00:00:00Z, 24:00:00Z)"

  - name: PartnerKitchen
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this local restaurant is activated under"
      - name: business_name
        type: string
        source: input
        description: registered trade name of the local restaurant
      - name: owner_name
        type: string
        source: input
        description: name of the restaurant owner who signs the activation agreement
      - name: cuisine_tags
        type: array
        source: input
        description: free-form cuisine labels used for culturally appropriate menu matching
      - name: daily_capacity_meals
        type: integer
        source: input
        description: meals per day the restaurant can produce without dropping quality
        constraints: ">= 1"
      - name: per_meal_price_cents
        type: integer
        source: input
        description: contracted price the restaurant charges per meal produced
        constraints: ">= 1"
      - name: bank_verified
        type: boolean
        source: input
        description: whether the restaurant's payout account passed verification
      - name: vetting_score
        type: integer
        source: system
        description: 0-100 capability score recorded during vetting
        constraints: "0 <= vetting_score <= 100"
      - name: contract_status
        type: enum
        source: system
        description: contract dimension of the partner kitchen's parallel state machine
        constraints: "PROSPECT | VETTING | CONTRACTED | SUSPENDED | TERMINATED"
        default: "PROSPECT"
      - name: production_status
        type: enum
        source: system
        description: production dimension of the partner kitchen's parallel state machine
        constraints: "IDLE | PRODUCING | AT_CAPACITY | COOLDOWN"
        default: "IDLE"
      - name: quality_score
        type: integer
        source: computed
        description: 0-100 rolling quality score produced by calculation partner_kitchen_quality_score
      - name: meals_produced_total
        type: integer
        source: computed
        description: lifetime accepted meals produced by this restaurant for the activation
      - name: meals_produced_today
        type: integer
        source: computed
        description: "accepted meals produced by this restaurant whose production instant falls in the current UTC calendar day [00:00:00Z, 24:00:00Z)"
      - name: production_started_at
        type: datetime
        source: system
        description: logical-clock instant the current production window opened
      - name: cooldown_until
        type: datetime
        source: system
        description: logical-clock instant after which a new production window may open; null when not cooling down
      - name: contracted_at
        type: datetime
        source: system
        description: logical-clock instant the restaurant entered CONTRACTED
      - name: terminated_at
        type: datetime
        source: system
        description: logical-clock instant the restaurant entered TERMINATED

  - name: MealOrder
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this production order is placed under"
      - name: partner_kitchen_id
        type: string
        source: input
        description: "FK -> PartnerKitchen.id; the local restaurant contracted to produce the meals"
      - name: distribution_run_id
        type: string
        source: input
        description: "FK -> DistributionRun.id; the run the ready meals are loaded onto; null until the order is dispatched"
      - name: menu_name
        type: string
        source: input
        description: human label of the culturally appropriate menu this batch follows
      - name: dietary_tags
        type: array
        source: input
        description: dietary properties this batch satisfies
        constraints: "subset of [HALAL, VEGETARIAN, VEGAN, NUT_FREE, GLUTEN_FREE, LOW_SODIUM]"
      - name: ordered_meals
        type: integer
        source: input
        description: meals requested from the restaurant in this batch
        constraints: ">= 1"
      - name: scheduled_start
        type: datetime
        source: input
        description: logical-clock instant the production window is planned to open
      - name: production_hours
        type: integer
        source: input
        description: length of the planned production window in hours
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: lifecycle state of the production order
        constraints: "PLACED | IN_PRODUCTION | QUALITY_HOLD | READY | DISPATCHED | DELIVERED | REJECTED | CANCELLED"
        default: "PLACED"
      - name: produced_meals
        type: integer
        source: system
        description: meals physically produced when the batch left the line
      - name: rejected_meals
        type: integer
        source: system
        description: meals discarded by the quality check
      - name: accepted_meals
        type: integer
        source: computed
        description: "produced_meals - rejected_meals; 0 while produced_meals is unset"
      - name: rework_count
        type: integer
        source: system
        description: number of times the batch was sent back from QUALITY_HOLD for rework
        default: 0
      - name: quality_check_score
        type: integer
        source: system
        description: 0-100 score recorded by the quality check
        constraints: "0 <= quality_check_score <= 100"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "ordered_meals * partner_kitchen.per_meal_price_cents, computed at creation (calculation meal_order_cost_buildup step 1)"
      - name: logistics_fee_cents
        type: integer
        source: computed
        description: "3% logistics fee on subtotal_cents (calculation meal_order_cost_buildup step 3)"
      - name: volume_discount_cents
        type: integer
        source: computed
        description: "tier discount applied to subtotal plus logistics fee (calculation meal_order_cost_buildup step 5)"
      - name: provisional_cost_cents
        type: integer
        source: computed
        description: provisional settlement value of the batch, pinned at creation (calculation meal_order_cost_settlement, variant provisional)
      - name: final_cost_cents
        type: integer
        source: computed
        description: final settlement value of the batch, pinned when the order reaches DELIVERED (calculation meal_order_cost_settlement, variant final)
      - name: placed_at
        type: datetime
        source: system
        description: logical-clock instant the order was created
      - name: ready_at
        type: datetime
        source: system
        description: logical-clock instant the order entered READY
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant the order entered DELIVERED
      - name: cancel_reason
        type: string
        source: system
        description: reason recorded when the order enters CANCELLED

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this local producer supplies"
      - name: producer_name
        type: string
        source: input
        description: name of the local farm, cooperative or food producer
      - name: locality
        type: string
        source: input
        description: town or district the producer operates in
      - name: product_categories
        type: array
        source: input
        description: categories the producer can deliver, e.g. [GRAIN, PRODUCE, PROTEIN, DAIRY]
      - name: payment_terms_days
        type: integer
        source: input
        description: contractual days between delivery and cash payment
        default: 7
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: derived producer standing (calculation supplier_reliability_and_standing)
        constraints: "PROSPECT | APPROVED | PREFERRED | SUSPENDED"
        default: "PROSPECT"
      - name: cash_flow_received_cents
        type: computed
        description: cumulative cash actually paid to this producer
        source: computed
        constraints: ">= 0"
      - name: reliability_score
        type: integer
        source: computed
        description: 0-100 reliability score produced by calculation supplier_reliability_and_standing
      - name: delivered_purchase_count
        type: integer
        source: computed
        description: "count of IngredientPurchase rows for this supplier whose status IN {DELIVERED, PAID}"
      - name: disputed_purchase_count
        type: integer
        source: computed
        description: "count of IngredientPurchase rows for this supplier whose status IN {DISPUTED, CANCELLED}"

  - name: IngredientPurchase
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this sourcing order belongs to"
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the local producer being paid"
      - name: partner_kitchen_id
        type: string
        source: input
        description: "FK -> PartnerKitchen.id; the restaurant kitchen the ingredients are delivered to"
      - name: item_description
        type: string
        source: input
        description: what is being bought, e.g. "maize flour, 25kg sacks"
      - name: quantity_kg
        type: number
        source: input
        description: quantity purchased in kilograms
        constraints: "> 0"
      - name: unit_price_cents_per_kg
        type: integer
        source: input
        description: agreed local purchase price per kilogram
        constraints: ">= 1"
      - name: amount_cents
        type: integer
        source: computed
        description: "round_half_up(quantity_kg * unit_price_cents_per_kg), pinned at creation"
      - name: status
        type: enum
        source: system
        description: lifecycle state of the sourcing order
        constraints: "REQUESTED | CONFIRMED | DELIVERED | PAID | DISPUTED | CANCELLED"
        default: "REQUESTED"
      - name: requested_at
        type: datetime
        source: system
        description: logical-clock instant the sourcing order was created
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant the ingredients were received
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock instant cash was released to the producer
      - name: dispute_reason
        type: string
        source: system
        description: reason recorded when the order enters DISPUTED

  - name: DistributionSite
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this receiving site is registered under"
      - name: site_name
        type: string
        source: input
        description: name of the shelter, hospital, school or neighbourhood distribution point
      - name: site_type
        type: enum
        source: input
        description: category of receiving point
        constraints: "SHELTER | HOSPITAL | NEIGHBORHOOD | SCHOOL | COMMUNITY_CENTER"
      - name: population_served
        type: integer
        source: input
        description: people currently relying on this site for meals
        constraints: ">= 0"
      - name: daily_meal_request
        type: integer
        source: input
        description: meals the site requests per day
        constraints: ">= 0"
      - name: access_constraint
        type: enum
        source: input
        description: current access condition for delivery vehicles
        constraints: "OPEN | LIMITED | RESTRICTED | BLOCKED"
      - name: status
        type: enum
        source: system
        description: service state of the receiving site
        constraints: "REGISTERED | ACTIVE | SERVICE_ALERT | CLOSED"
        default: "REGISTERED"
      - name: received_meals_total
        type: integer
        source: computed
        description: "sum of DistributionStop.delivered_meals over stops of this site whose status == DELIVERED"
      - name: skipped_stop_count
        type: integer
        source: computed
        description: "count of DistributionStop rows of this site whose status == SKIPPED"
      - name: delivered_stop_count
        type: integer
        source: computed
        description: "count of DistributionStop rows of this site whose status == DELIVERED"

  - name: DistributionRun
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this delivery route serves"
      - name: field_kitchen_id
        type: string
        source: input
        description: "FK -> FieldKitchen.id; the field kitchen the run loads from"
      - name: driver_name
        type: string
        source: input
        description: name of the volunteer driver operating the run
      - name: driver_phone
        type: string
        source: input
        description: contact number for the volunteer driver
      - name: driver_safety_training_completed
        type: boolean
        source: input
        description: whether the volunteer completed the security and food-handling briefing
      - name: vehicle_type
        type: enum
        source: input
        description: vehicle used for the run
        constraints: "CAR | VAN | TRUCK | MOTORCYCLE"
      - name: planned_date
        type: datetime
        source: input
        description: logical-clock instant the run is planned to start; its UTC calendar day is the run's day bucket
      - name: window_start
        type: datetime
        source: input
        description: start of the delivery window
      - name: window_end
        type: datetime
        source: input
        description: end of the delivery window; must be strictly after window_start
      - name: loaded_meals
        type: integer
        source: system
        description: meals physically loaded onto the vehicle
        default: 0
      - name: fuel_cost_cents
        type: integer
        source: input
        description: fuel spend for the run
        constraints: ">= 0"
      - name: handling_cost_cents
        type: integer
        source: input
        description: loading and handling spend for the run
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: lifecycle state of the delivery run
        constraints: "PLANNED | LOADING | EN_ROUTE | DELIVERING | COMPLETED | ABORTED"
        default: "PLANNED"
      - name: total_cost_cents
        type: integer
        source: computed
        description: "fuel_cost_cents + handling_cost_cents, the pool allocated to stops by calculation run_cost_allocation"
      - name: unallocated_cost_cents
        type: computed
        source: computed
        description: "residual of total_cost_cents not attributable to any DELIVERED stop (calculation run_cost_allocation)"
      - name: delivered_meals
        type: integer
        source: computed
        description: "sum of DistributionStop.delivered_meals over stops of this run whose status == DELIVERED"
      - name: returned_meals
        type: integer
        source: computed
        description: "meals loaded but brought back to the field kitchen: loaded_meals - delivered_meals - sum(planned_meals of stops still PENDING), recomputed by calculation run_meal_conservation"
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the run entered COMPLETED
      - name: abort_reason
        type: string
        source: system
        description: reason recorded when the run enters ABORTED

  - name: DistributionStop
    parent: null
    common_fields: true
    fields:
      - name: distribution_run_id
        type: string
        source: input
        description: "FK -> DistributionRun.id; the run this stop belongs to"
      - name: distribution_site_id
        type: string
        source: input
        description: "FK -> DistributionSite.id; the receiving site this stop serves"
      - name: stop_sequence
        type: integer
        source: input
        description: 1-based ordering of the stop inside the run; also the residual target of run_cost_allocation
        constraints: ">= 1"
      - name: planned_meals
        type: integer
        source: input
        description: meals planned to be handed over at this stop
        constraints: ">= 0"
      - name: delivered_meals
        type: integer
        source: system
        description: meals actually handed over at this stop
        default: 0
      - name: allocated_cost_cents
        type: integer
        source: computed
        description: share of the run's total_cost_cents attributed to this stop by calculation run_cost_allocation
      - name: status
        type: enum
        source: system
        description: outcome of the stop
        constraints: "PENDING | DELIVERED | FAILED | SKIPPED"
        default: "PENDING"
      - name: failure_reason
        type: string
        source: system
        description: reason recorded when the stop enters FAILED or SKIPPED
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant the stop entered DELIVERED

  - name: DonorCommitment
    parent: null
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> Incident.id; the activation this donor commitment funds"
      - name: donor_name
        type: string
        source: input
        description: name of the donating organisation or individual
      - name: amount_cents
        type: integer
        source: input
        description: committed amount in the incident currency
        constraints: ">= 1"
      - name: earmark
        type: enum
        source: input
        description: spending restriction attached to the commitment
        constraints: "UNRESTRICTED | FIELD_KITCHENS | RESTAURANT_ACTIVATION | INGREDIENT_SOURCING | LOGISTICS"
      - name: status
        type: enum
        source: system
        description: lifecycle state of the commitment
        constraints: "PLEDGED | RECEIVED | ALLOCATED | PARTIALLY_DISBURSED | CLOSED | WITHDRAWN"
        default: "PLEDGED"
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant funds were received
      - name: allocated_cents
        type: integer
        source: computed
        description: amount of this commitment assigned to the activation's open obligations
      - name: disbursed_cents
        type: integer
        source: computed
        description: amount of this commitment actually disbursed against settled obligations
      - name: remaining_cents
        type: computed
        description: "amount_cents - disbursed_cents, the conserved balance of the commitment"
        source: computed

state_machines:
  - entity: Incident
    initial_state: MONITORING
    terminal_states: [CLOSED]
    transitions:
      - from: MONITORING
        to: ACTIVE
        trigger: "POST /field-ops/incidents/{id}/transitions with to_state=ACTIVE"
        actor: FieldCoordinator
        preconditions:
          - "at least one Assessment of this incident has status == SUBMITTED"
        side_effects:
          - "set activated_at to the current logical-clock instant"
          - "set every FieldKitchen of this incident with site_status == SITED to UTILITIES_PENDING"
          - "recompute Incident.spent_cents"
      - from: ACTIVE
        to: WINDING_DOWN
        trigger: "POST /field-ops/incidents/{id}/transitions with to_state=WINDING_DOWN"
        actor: PlatformAdmin
        preconditions:
          - "no MealOrder of this incident has status IN {IN_PRODUCTION, QUALITY_HOLD}"
        side_effects:
          - "set wind_down_started_at to the current logical-clock instant"
          - "set every FieldKitchen of this incident with site_status IN {SITED, UTILITIES_PENDING} to DEMOBILIZED and stamp demobilized_at"
      - from: WINDING_DOWN
        to: ACTIVE
        trigger: "POST /field-ops/incidents/{id}/transitions with to_state=ACTIVE (re-escalation)"
        actor: PlatformAdmin
        preconditions:
          - "at least one Assessment of this incident has status == SUBMITTED and assessed_at strictly after incident.wind_down_started_at"
        side_effects:
          - "clear wind_down_started_at"
          - "set every FieldKitchen of this incident with site_status == DEMOBILIZED and demobilized_at == wind_down_started_at back to SITED and clear demobilized_at"
        note: "re-escalation cycle; the incident can oscillate ACTIVE <-> WINDING_DOWN as new assessments land"
      - from: WINDING_DOWN
        to: CLOSED
        trigger: "POST /field-ops/incidents/{id}/transitions with to_state=CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "every FieldKitchen of this incident has site_status == DEMOBILIZED"
          - "every DistributionRun of this incident has status IN {COMPLETED, ABORTED}"
        side_effects:
          - "set closed_at to the current logical-clock instant"
          - "set every DistributionSite of this incident with status IN {REGISTERED, ACTIVE, SERVICE_ALERT} to CLOSED"
          - "set every DonorCommitment of this incident with status IN {ALLOCATED, PARTIALLY_DISBURSED} to CLOSED"

  - entity: FieldKitchen
    initial_state: SITED
    terminal_states: [DEMOBILIZED]
    transitions:
      - from: SITED
        to: UTILITIES_PENDING
        trigger: "POST /field-ops/field-kitchens/{id}/transitions with to_state=UTILITIES_PENDING"
        actor: FieldCoordinator
        preconditions:
          - "the linked Assessment (assessment_id) has access_constraint IN {OPEN, LIMITED, RESTRICTED}"
        side_effects:
          - "none beyond updated_at and version"
      - from: UTILITIES_PENDING
        to: FOOD_SAFETY_CLEARED
        trigger: "POST /field-ops/field-kitchens/{id}/transitions with to_state=FOOD_SAFETY_CLEARED"
        actor: FoodSafetyOfficer
        preconditions:
          - "power_source != NONE"
          - "water_source != NONE"
          - "food_safety_score >= 70"
        side_effects:
          - "none beyond updated_at and version"
      - from: FOOD_SAFETY_CLEARED
        to: OPERATIONAL
        trigger: "POST /field-ops/field-kitchens/{id}/transitions with to_state=OPERATIONAL"
        actor: FieldCoordinator
        preconditions:
          - "the parent Incident has status == ACTIVE"
        side_effects:
          - "set activated_at to the current logical-clock instant"
      - from: OPERATIONAL
        to: SUSPENDED
        trigger: "POST /field-ops/field-kitchens/{id}/transitions with to_state=SUSPENDED"
        actor: FoodSafetyOfficer
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set suspended_at to the current logical-clock instant"
          - "CASCADE HOP 1: set every DistributionRun of this field kitchen with status IN {PLANNED, LOADING} to ABORTED with abort_reason = ORIGIN_KITCHEN_SUSPENDED"
      - from: SUSPENDED
        to: FOOD_SAFETY_CLEARED
        trigger: "POST /field-ops/field-kitchens/{id}/transitions with to_state=FOOD_SAFETY_CLEARED (recovery)"
        actor: FoodSafetyOfficer
        preconditions:
          - "last_inspection_at is strictly after suspended_at"
          - "food_safety_score >= 70"
        side_effects:
          - "clear suspended_at"
        note: "recovery cycle OPERATIONAL -> SUSPENDED -> FOOD_SAFETY_CLEARED -> OPERATIONAL"
      - from: OPERATIONAL
        to: DEMOBILIZED
        trigger: "POST /field-ops/field-kitchens/{id}/transitions with to_state=DEMOBILIZED"
        actor: FieldCoordinator
        preconditions:
          - "the parent Incident has status IN {WINDING_DOWN, CLOSED}"
        side_effects:
          - "set demobilized_at to the current logical-clock instant"
          - "set every DistributionRun of this field kitchen with status == PLANNED to ABORTED with abort_reason = KITCHEN_DEMOBILIZED"

  - entity: PartnerKitchen
    initial_state: "contract_status=PROSPECT / production_status=IDLE (two independent dimensions)"
    terminal_states: ["contract_status=TERMINATED"]
    transitions:
      - from: "contract_status=PROSPECT"
        to: "contract_status=VETTING"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=CONTRACT, to_state=VETTING"
        actor: PartnershipLead
        preconditions:
          - "bank_verified == true"
        side_effects:
          - "none beyond updated_at and version"
      - from: "contract_status=VETTING"
        to: "contract_status=CONTRACTED"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=CONTRACT, to_state=CONTRACTED"
        actor: PartnershipLead
        preconditions:
          - "vetting_score >= 60"
        side_effects:
          - "set contracted_at to the current logical-clock instant"
      - from: "contract_status=VETTING"
        to: "contract_status=PROSPECT"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=CONTRACT, to_state=PROSPECT"
        actor: PartnershipLead
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set vetting_score to 0"
        note: "revert branch of the vetting cycle"
      - from: "contract_status=CONTRACTED"
        to: "contract_status=SUSPENDED"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=CONTRACT, to_state=SUSPENDED"
        actor: PartnershipLead
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "CROSS-DIMENSION: if production_status != IDLE then set production_status = COOLDOWN and set cooldown_until to the current logical-clock instant + 8 hours"
      - from: "contract_status=SUSPENDED"
        to: "contract_status=CONTRACTED"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=CONTRACT, to_state=CONTRACTED (reinstatement)"
        actor: PartnershipLead
        preconditions:
          - "vetting_score >= 60"
        side_effects:
          - "none beyond updated_at and version"
        note: "suspension cycle CONTRACTED <-> SUSPENDED"
      - from: "contract_status=CONTRACTED"
        to: "contract_status=TERMINATED"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=CONTRACT, to_state=TERMINATED"
        actor: PartnershipLead
        preconditions:
          - "every MealOrder of this partner kitchen has status IN {DELIVERED, REJECTED, CANCELLED}"
        side_effects:
          - "set terminated_at to the current logical-clock instant"
          - "set every MealOrder of this partner kitchen with status == PLACED to CANCELLED with cancel_reason = KITCHEN_TERMINATED"
      - from: "production_status=IDLE"
        to: "production_status=PRODUCING"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=PRODUCTION, to_state=PRODUCING"
        actor: KitchenOperator
        preconditions:
          - "contract_status == CONTRACTED"
          - "the current logical-clock instant is at or after cooldown_until, or cooldown_until is null"
        side_effects:
          - "set production_started_at to the current logical-clock instant"
      - from: "production_status=PRODUCING"
        to: "production_status=AT_CAPACITY"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=PRODUCTION, to_state=AT_CAPACITY (also entered automatically when meals_produced_today >= daily_capacity_meals)"
        actor: KitchenOperator
        preconditions:
          - "meals_produced_today >= daily_capacity_meals"
        side_effects:
          - "CASCADE HOP 1: set every MealOrder of this partner kitchen with status == PLACED to CANCELLED with cancel_reason = KITCHEN_AT_CAPACITY"
      - from: "production_status=AT_CAPACITY"
        to: "production_status=COOLDOWN"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=PRODUCTION, to_state=COOLDOWN"
        actor: KitchenOperator
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set cooldown_until to the current logical-clock instant + 8 hours"
      - from: "production_status=COOLDOWN"
        to: "production_status=IDLE"
        trigger: "POST /field-ops/partner-kitchens/{id}/transitions with dimension=PRODUCTION, to_state=IDLE"
        actor: KitchenOperator
        preconditions:
          - "the current logical-clock instant is at or after cooldown_until"
        side_effects:
          - "clear cooldown_until"
        note: "cooldown cycle IDLE -> PRODUCING -> AT_CAPACITY -> COOLDOWN -> IDLE"

  - entity: MealOrder
    initial_state: PLACED
    terminal_states: [DELIVERED, REJECTED, CANCELLED]
    transitions:
      - from: PLACED
        to: IN_PRODUCTION
        trigger: "POST /field-ops/meal-orders/{id}/transitions with to_state=IN_PRODUCTION"
        actor: ProductionPlanner
        preconditions:
          - "the linked PartnerKitchen has contract_status == CONTRACTED"
          - "the linked PartnerKitchen has production_status IN {IDLE, PRODUCING}"
        side_effects:
          - "none beyond updated_at and version"
      - from: IN_PRODUCTION
        to: QUALITY_HOLD
        trigger: "POST /field-ops/meal-orders/{id}/transitions with to_state=QUALITY_HOLD and produced_meals"
        actor: KitchenOperator
        preconditions:
          - "produced_meals is present and 0 <= produced_meals"
        side_effects:
          - "set produced_meals"
          - "increment the linked PartnerKitchen.meals_produced_total and meals_produced_today by produced_meals"
      - from: QUALITY_HOLD
        to: READY
        trigger: "POST /field-ops/meal-orders/{id}/transitions with to_state=READY and quality_check_score"
        actor: FoodSafetyOfficer
        preconditions:
          - "quality_check_score >= 80"
        side_effects:
          - "set ready_at to the current logical-clock instant"
          - "set rejected_meals from the request payload (0 when the field is omitted)"
          - "recompute accepted_meals"
          - "recompute PartnerKitchen.quality_score (calculation partner_kitchen_quality_score)"
      - from: QUALITY_HOLD
        to: IN_PRODUCTION
        trigger: "POST /field-ops/meal-orders/{id}/transitions with to_state=IN_PRODUCTION and quality_check_score (rework loop)"
        actor: FoodSafetyOfficer
        preconditions:
          - "quality_check_score >= 60"
          - "quality_check_score <= 79"
          - "rework_count < 2"
        side_effects:
          - "increment rework_count by 1"
          - "leave produced_meals and rejected_meals unchanged so the batch is re-produced from the same line state"
        note: "rework cycle QUALITY_HOLD -> IN_PRODUCTION -> QUALITY_HOLD"
      - from: QUALITY_HOLD
        to: REJECTED
        trigger: "POST /field-ops/meal-orders/{id}/transitions with to_state=REJECTED and quality_check_score"
        actor: FoodSafetyOfficer
        preconditions:
          - "quality_check_score <= 59 OR rework_count >= 2"
        side_effects:
          - "set rejected_meals = produced_meals"
          - "set accepted_meals = 0"
          - "recompute PartnerKitchen.quality_score (calculation partner_kitchen_quality_score)"
          - "recompute Incident.spent_cents"
      - from: READY
        to: DISPATCHED
        trigger: "POST /field-ops/meal-orders/{id}/transitions with to_state=DISPATCHED and distribution_run_id"
        actor: LogisticsCoordinator
        preconditions:
          - "the DistributionRun named by distribution_run_id belongs to the same incident_id"
          - "that DistributionRun has status == LOADING"
        side_effects:
          - "set distribution_run_id"
          - "increment that DistributionRun.loaded_meals by accepted_meals"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /field-ops/meal-orders/{id}/transitions with to_state=DELIVERED"
        actor: LogisticsCoordinator
        preconditions:
          - "the DistributionRun named by distribution_run_id has status == DELIVERING"
        side_effects:
          - "set delivered_at to the current logical-clock instant"
          - "pin final_cost_cents via calculation meal_order_cost_settlement (variant final)"
          - "recompute PartnerKitchen.quality_score (calculation partner_kitchen_quality_score)"
          - "CASCADE HOP 1: if PartnerKitchen.meals_produced_today >= PartnerKitchen.daily_capacity_meals then set PartnerKitchen.production_status = AT_CAPACITY"
          - "recompute Incident.spent_cents, delivered_meal_total, local_sourcing_pct and cost_per_meal_cents"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /field-ops/meal-orders/{id}/transitions with to_state=CANCELLED"
        actor: ProductionPlanner
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set cancel_reason"
          - "recompute Incident.spent_cents"

  - entity: DistributionRun
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNED
        to: LOADING
        trigger: "POST /field-ops/distribution-runs/{id}/transitions with to_state=LOADING"
        actor: LogisticsCoordinator
        preconditions:
          - "the linked FieldKitchen has site_status == OPERATIONAL"
          - "driver_safety_training_completed == true"
        side_effects:
          - "set loaded_meals from the request payload when the field is supplied, otherwise leave the stored value unchanged"
      - from: LOADING
        to: EN_ROUTE
        trigger: "POST /field-ops/distribution-runs/{id}/transitions with to_state=EN_ROUTE"
        actor: LogisticsCoordinator
        preconditions:
          - "the request supplies loaded_meals, which is applied as part of this transition, and that value is > 0"
          - "the sum of planned_meals over this run's stops with status == PENDING is <= the supplied loaded_meals"
        side_effects:
          - "none beyond updated_at and version"
      - from: EN_ROUTE
        to: DELIVERING
        trigger: "POST /field-ops/distribution-runs/{id}/transitions with to_state=DELIVERING"
        actor: LogisticsCoordinator
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "none beyond updated_at and version"
      - from: DELIVERING
        to: EN_ROUTE
        trigger: "POST /field-ops/distribution-runs/{id}/transitions with to_state=EN_ROUTE (return to depot for reload)"
        actor: LogisticsCoordinator
        preconditions:
          - "returned_meals > 0"
          - "at least one stop of this run still has status == PENDING"
        side_effects:
          - "recompute returned_meals via calculation run_meal_conservation; no meal is destroyed, so returned_meals stays loaded_meals - delivered_meals - pending_planned_meals"
        note: "reload cycle EN_ROUTE -> DELIVERING -> EN_ROUTE"
      - from: DELIVERING
        to: COMPLETED
        trigger: "POST /field-ops/distribution-runs/{id}/transitions with to_state=COMPLETED"
        actor: LogisticsCoordinator
        preconditions:
          - "every stop of this run has status IN {DELIVERED, FAILED, SKIPPED}"
        side_effects:
          - "set completed_at to the current logical-clock instant"
          - "run calculation run_cost_allocation over the DELIVERED stops of this run"
          - "run calculation run_meal_conservation and pin returned_meals"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /field-ops/distribution-runs/{id}/transitions with to_state=ABORTED"
        actor: LogisticsCoordinator
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set abort_reason"
          - "CASCADE HOP 1: set every DistributionStop of this run with status == PENDING to SKIPPED with failure_reason = RUN_ABORTED"
      - from: LOADING
        to: ABORTED
        trigger: "POST /field-ops/distribution-runs/{id}/transitions with to_state=ABORTED"
        actor: LogisticsCoordinator
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set abort_reason"
          - "CASCADE HOP 1: set every DistributionStop of this run with status == PENDING to SKIPPED with failure_reason = RUN_ABORTED"
      - from: "PLANNED or LOADING"
        to: ABORTED
        trigger: "system: the linked FieldKitchen enters SUSPENDED"
        actor: system
        preconditions:
          - "the linked FieldKitchen has site_status == SUSPENDED"
        side_effects:
          - "set abort_reason = ORIGIN_KITCHEN_SUSPENDED"
          - "CASCADE HOP 1: set every DistributionStop of this run with status == PENDING to SKIPPED with failure_reason = ORIGIN_KITCHEN_SUSPENDED"

  - entity: DistributionStop
    initial_state: PENDING
    terminal_states: [FAILED, SKIPPED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /field-ops/distribution-stops/{id}/transitions with to_state=DELIVERED and delivered_meals"
        actor: SiteCoordinator
        preconditions:
          - "the parent DistributionRun has status == DELIVERING"
          - "the linked DistributionSite has access_constraint != BLOCKED"
          - "delivered_meals <= planned_meals"
        side_effects:
          - "set delivered_at to the current logical-clock instant"
          - "increment the linked DistributionSite.received_meals_total by delivered_meals"
          - "set the linked DistributionSite.status to ACTIVE when it was REGISTERED"
          - "recompute DistributionRun.delivered_meals"
      - from: PENDING
        to: FAILED
        trigger: "POST /field-ops/distribution-stops/{id}/transitions with to_state=FAILED and failure_reason"
        actor: LogisticsCoordinator
        preconditions:
          - "the parent DistributionRun has status == DELIVERING"
        side_effects:
          - "set failure_reason"
          - "recompute DistributionRun.returned_meals via calculation run_meal_conservation"
      - from: PENDING
        to: SKIPPED
        trigger: "system: the parent DistributionRun enters ABORTED"
        actor: system
        preconditions:
          - "the parent DistributionRun has status == ABORTED"
        side_effects:
          - "set failure_reason = RUN_ABORTED (or ORIGIN_KITCHEN_SUSPENDED when the abort came from a kitchen suspension)"
          - "CASCADE HOP 2: if this site now has strictly more stops with status SKIPPED than with status DELIVERED, set the linked DistributionSite.status to SERVICE_ALERT"
      - from: DELIVERED
        to: FAILED
        trigger: "POST /field-ops/distribution-stops/{id}/transitions with to_state=FAILED and failure_reason (compensating reversal)"
        actor: LogisticsCoordinator
        preconditions:
          - "the parent DistributionRun has status IN {DELIVERING, COMPLETED}"
        side_effects:
          - "decrement the linked DistributionSite.received_meals_total by this stop's delivered_meals"
          - "set delivered_meals to 0"
          - "recompute DistributionRun.delivered_meals and DistributionRun.returned_meals via calculation run_meal_conservation"
        note: "compensating action of the PENDING -> DELIVERED transition; the run's loaded_meals is conserved"

  - entity: IngredientPurchase
    initial_state: REQUESTED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /field-ops/ingredient-purchases/{id}/transitions with to_state=CONFIRMED"
        actor: SourcingOfficer
        preconditions:
          - "the linked Supplier has status IN {APPROVED, PREFERRED}"
        side_effects:
          - "none beyond updated_at and version"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /field-ops/ingredient-purchases/{id}/transitions with to_state=DELIVERED"
        actor: SourcingOfficer
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set delivered_at to the current logical-clock instant"
          - "recompute Supplier.reliability_score, delivered_purchase_count and status (calculation supplier_reliability_and_standing)"
      - from: DELIVERED
        to: PAID
        trigger: "POST /field-ops/ingredient-purchases/{id}/transitions with to_state=PAID"
        actor: SourcingOfficer
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set paid_at to the current logical-clock instant"
          - "increment Supplier.cash_flow_received_cents by amount_cents"
          - "recompute Supplier.reliability_score and status (calculation supplier_reliability_and_standing)"
          - "CASCADE HOP 2: if Supplier.status became PREFERRED, set every other IngredientPurchase of this supplier with status == REQUESTED to CONFIRMED"
          - "recompute Incident.spent_cents and local_sourcing_pct"
      - from: DELIVERED
        to: DISPUTED
        trigger: "POST /field-ops/ingredient-purchases/{id}/transitions with to_state=DISPUTED and dispute_reason"
        actor: SourcingOfficer
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set dispute_reason"
          - "recompute Supplier.reliability_score, disputed_purchase_count and status"
      - from: DISPUTED
        to: DELIVERED
        trigger: "POST /field-ops/ingredient-purchases/{id}/transitions with to_state=DELIVERED (dispute resolved)"
        actor: SourcingOfficer
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "clear dispute_reason"
          - "recompute Supplier.reliability_score, disputed_purchase_count and status"
        note: "dispute cycle DELIVERED -> DISPUTED -> DELIVERED"
      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /field-ops/ingredient-purchases/{id}/transitions with to_state=CANCELLED"
        actor: SourcingOfficer
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "recompute Supplier.reliability_score, disputed_purchase_count and status"
      - from: PAID
        to: DISPUTED
        trigger: "POST /field-ops/ingredient-purchases/{id}/transitions with to_state=DISPUTED and dispute_reason (cash reversal)"
        actor: SourcingOfficer
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "decrement Supplier.cash_flow_received_cents by amount_cents"
          - "recompute Supplier.reliability_score, disputed_purchase_count and status"
          - "recompute Incident.spent_cents and local_sourcing_pct"
        note: "compensating action of DELIVERED -> PAID; Supplier.cash_flow_received_cents returns to its pre-payment value"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /field-ops/ingredient-purchases/{id}/transitions with to_state=CANCELLED"
        actor: SourcingOfficer
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "recompute Supplier.reliability_score and status"

  - entity: Supplier
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: APPROVED
        trigger: "system: the supplier's first IngredientPurchase enters DELIVERED"
        actor: system
        preconditions:
          - "delivered_purchase_count >= 1"
        side_effects:
          - "none beyond updated_at and version"
      - from: APPROVED
        to: PREFERRED
        trigger: "system: calculation supplier_reliability_and_standing re-evaluates the standing"
        actor: system
        preconditions:
          - "cash_flow_received_cents >= 500000"
          - "reliability_score >= 70"
        side_effects:
          - "none beyond updated_at and version"
      - from: PREFERRED
        to: APPROVED
        trigger: "system: cash paid to the producer drops below the preferred threshold"
        actor: system
        preconditions:
          - "cash_flow_received_cents < 500000"
        side_effects:
          - "none beyond updated_at and version"
      - from: "APPROVED or PREFERRED"
        to: SUSPENDED
        trigger: "system: calculation supplier_reliability_and_standing re-evaluates the standing"
        actor: system
        preconditions:
          - "reliability_score < 40"
        side_effects:
          - "none beyond updated_at and version"
      - from: SUSPENDED
        to: APPROVED
        trigger: "system: calculation supplier_reliability_and_standing re-evaluates the standing"
        actor: system
        preconditions:
          - "reliability_score >= 40"
        side_effects:
          - "none beyond updated_at and version"

  - entity: DistributionSite
    initial_state: REGISTERED
    terminal_states: [CLOSED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "system: the site's first DistributionStop enters DELIVERED"
        actor: system
        preconditions:
          - "delivered_stop_count >= 1"
        side_effects:
          - "none beyond updated_at and version"
      - from: "REGISTERED or ACTIVE"
        to: SERVICE_ALERT
        trigger: "system: cascade hop 2 of a DistributionStop entering SKIPPED"
        actor: system
        preconditions:
          - "skipped_stop_count > delivered_stop_count"
        side_effects:
          - "none beyond updated_at and version"
      - from: SERVICE_ALERT
        to: ACTIVE
        trigger: "system: a later DistributionStop of this site enters DELIVERED and the site's delivered stops then outnumber its skipped stops"
        actor: system
        preconditions:
          - "delivered_stop_count > skipped_stop_count"
        side_effects:
          - "none beyond updated_at and version"
        note: "service recovery cycle ACTIVE <-> SERVICE_ALERT"
      - from: "REGISTERED or ACTIVE or SERVICE_ALERT"
        to: CLOSED
        trigger: "system: the parent Incident enters CLOSED"
        actor: system
        preconditions:
          - "the parent Incident has status == CLOSED"
        side_effects:
          - "none beyond updated_at and version"

  - entity: DonorCommitment
    initial_state: PLEDGED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /field-ops/donor-commitments/{id}/transitions with to_state=RECEIVED"
        actor: DonorLiaison
        preconditions:
          - "none beyond role and state"
        side_effects:
          - "set received_at to the current logical-clock instant"
          - "recompute Incident.committed_cents"
      - from: PLEDGED
        to: WITHDRAWN
        trigger: "POST /field-ops/donor-commitments/{id}/transitions with to_state=WITHDRAWN"
        actor: DonorLiaison
        preconditions:
          - "received_at is null"
        side_effects:
          - "none beyond updated_at and version"
      - from: RECEIVED
        to: ALLOCATED
        trigger: "POST /field-ops/donor-commitments/{id}/transitions with to_state=ALLOCATED"
        actor: DonorLiaison
        preconditions:
          - "the parent Incident has status == ACTIVE"
        side_effects:
          - "set allocated_cents = amount_cents"
          - "recompute Incident.committed_cents"
      - from: ALLOCATED
        to: RECEIVED
        trigger: "POST /field-ops/donor-commitments/{id}/transitions with to_state=RECEIVED (de-allocation)"
        actor: DonorLiaison
        preconditions:
          - "disbursed_cents == 0"
        side_effects:
          - "set allocated_cents to 0"
          - "recompute Incident.committed_cents"
        note: "re-allocation cycle RECEIVED -> ALLOCATED -> RECEIVED"
      - from: ALLOCATED
        to: PARTIALLY_DISBURSED
        trigger: "POST /field-ops/donor-commitments/{id}/transitions with to_state=PARTIALLY_DISBURSED and disbursement_cents"
        actor: DonorLiaison
        preconditions:
          - "disbursement_cents >= 1"
          - "disbursed_cents + disbursement_cents <= amount_cents"
        side_effects:
          - "increment disbursed_cents by disbursement_cents"
      - from: PARTIALLY_DISBURSED
        to: PARTIALLY_DISBURSED
        trigger: "POST /field-ops/donor-commitments/{id}/transitions with to_state=PARTIALLY_DISBURSED and disbursement_cents (further drawdown)"
        actor: DonorLiaison
        preconditions:
          - "disbursement_cents >= 1"
          - "disbursed_cents + disbursement_cents <= amount_cents"
        side_effects:
          - "increment disbursed_cents by disbursement_cents"
      - from: PARTIALLY_DISBURSED
        to: CLOSED
        trigger: "POST /field-ops/donor-commitments/{id}/transitions with to_state=CLOSED"
        actor: DonorLiaison
        preconditions:
          - "disbursed_cents == amount_cents"
        side_effects:
          - "none beyond updated_at and version"
      - from: "ALLOCATED or PARTIALLY_DISBURSED"
        to: CLOSED
        trigger: "system: the parent Incident enters CLOSED"
        actor: system
        preconditions:
          - "the parent Incident has status == CLOSED"
        side_effects:
          - "none beyond updated_at and version"

concurrency_rules:
  - rule_id: meal-order-stale-partner-kitchen
    parent_entity: PartnerKitchen
    write_endpoint: "POST /field-ops/meal-orders"
    occ_field: "expected_partner_kitchen_version"
    description: |
      Creating a MealOrder against a PartnerKitchen whose version has advanced since the client
      last observed it is rejected. This captures the case where the kitchen's contract or
      production dimension has just been updated by another writer and the current writer's view
      of the kitchen's remaining capacity is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stop-create-stale-run
    parent_entity: DistributionRun
    write_endpoint: "POST /field-ops/distribution-stops"
    occ_field: "expected_distribution_run_version"
    description: |
      Adding a DistributionStop to a DistributionRun whose version has advanced since the client
      last observed it is rejected. This captures the case where stops were added or a stop outcome
      was recorded by another writer after this client read the run, so the client's view of the
      run's remaining load capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: meal_order_cost_settlement
    trigger: "POST /field-ops/meal-orders (variant provisional) and MealOrder transition DISPATCHED -> DELIVERED (variant final); surfaced by GET /field-ops/meal-orders/{id}"
    algorithm: dual_variant
    formula: |
      VARIANT provisional (evaluated once, at creation):
        provisional_cost_cents = subtotal_cents + logistics_fee_cents - volume_discount_cents
        (identical to the meal_order_cost_buildup output pinned on the row at creation)

      VARIANT final (evaluated once, when status becomes DELIVERED):
        billable_meals = accepted_meals                      # produced_meals - rejected_meals
        base_cents     = billable_meals * partner_kitchen.per_meal_price_cents
        quality_multiplier =
            1.00  when quality_check_score >= 90
            0.95  when 75 <= quality_check_score <= 89
            0.85  when 60 <= quality_check_score <= 74
            0.00  when quality_check_score <= 59
        final_cost_cents = round_half_up(base_cents * quality_multiplier)
      Evaluation order is pinned: billable_meals is resolved first, base_cents second, the
      multiplier third, the single rounding last. No intermediate rounding is performed.
    input_set: "provisional variant covers every MealOrder row in status IN {PLACED, IN_PRODUCTION, QUALITY_HOLD, READY, DISPATCHED}; final variant covers only rows in status == DELIVERED. Rows in {REJECTED, CANCELLED} contribute 0 to both."
    constants:
      QUALITY_MULTIPLIER_HIGH: 1.00
      QUALITY_MULTIPLIER_MID: 0.95
      QUALITY_MULTIPLIER_LOW: 0.85
      QUALITY_MULTIPLIER_VOID: 0.00
      QUALITY_SCORE_HIGH_MIN: 90
      QUALITY_SCORE_MID_MIN: 75
      QUALITY_SCORE_LOW_MIN: 60
    precision: "integer cents; every monetary value is an integer number of cents, round_half_up applied once to the final product"
    variants:
      - name: provisional
        when: "the batch exists but has not reached DELIVERED"
        difference: "prices the full ordered volume (ordered_meals) plus the logistics fee minus the volume discount, and ignores quality_check_score entirely"
      - name: final
        when: "the batch reaches DELIVERED"
        difference: "prices only accepted_meals at the restaurant's raw per-meal price and applies the quality multiplier; for identical ordered_meals the final value is strictly lower whenever rejected_meals > 0 or quality_check_score < 90, and it never contains the logistics fee or the volume discount"

  - name: assessment_feeding_priority
    trigger: "POST /field-ops/assessments (evaluated once, at creation, under the mode named by assessment_mode)"
    algorithm: weighted_scoring
    formula: |
      need_component    = 0 if population_affected == 0
                          else min(100, round_half_up(estimated_daily_meal_need * 100 / population_affected))
      access_component  = ACCESS_WEIGHT[access_constraint]
      infra_raw         = (0 if water_available else 20) + (0 if power_available else 15)
      partner_raw       = max(0, 25 - 5 * partner_kitchens_identified)

      RAPID mode   (assessment_mode == "RAPID"):
        infra_component   = infra_raw
        partner_component = partner_raw
      DURABLE mode (assessment_mode == "DURABLE"):
        infra_component   = round_half_up(infra_raw / 2)
        partner_component = min(40, 2 * partner_raw)

      feeding_priority_score = min(100, need_component + access_component + infra_component + partner_component)
    input_set: "every Assessment row in status SUBMITTED contributes to the incident's deployment ordering; rows in status SUPERSEDED are excluded"
    constants:
      ACCESS_WEIGHT_OPEN: 10
      ACCESS_WEIGHT_LIMITED: 25
      ACCESS_WEIGHT_RESTRICTED: 40
      ACCESS_WEIGHT_BLOCKED: 55
      WATER_MISSING_PENALTY: 20
      POWER_MISSING_PENALTY: 15
      PARTNER_BASE: 25
      PARTNER_STEP: 5
      DURABLE_INFRA_DIVISOR: 2
      DURABLE_PARTNER_MULTIPLIER: 2
      DURABLE_PARTNER_CAP: 40
      PRIORITY_SCORE_CAP: 100
    precision: "integer 0-100; round_half_up on need_component and on DURABLE infra_component, no other rounding"
    variants:
      - name: rapid
        when: "assessment_mode == RAPID, the default posture for the first 72 hours of an activation"
        difference: "counts damaged infrastructure at full weight and the absence of local restaurant capacity at single weight"
      - name: durable
        when: "assessment_mode == DURABLE, the posture used once the response shifts toward local capacity"
        difference: "halves the infrastructure penalty and doubles the partner-availability penalty (capped at 40), so two assessments with identical field data produce different feeding_priority_score values whenever infra_raw != 2 * partner_raw"

  - name: field_kitchen_food_safety_score
    trigger: "POST /field-ops/field-kitchens/{id}/inspections (re-evaluated on every inspection); gates the UTILITIES_PENDING -> FOOD_SAFETY_CLEARED transition"
    algorithm: weighted_scoring
    formula: |
      power_score  = POWER_POINTS[power_source]
      water_score  = WATER_POINTS[water_source]
      cold_score   = 25 when refrigeration_hours_available >= 12
                     15 when refrigeration_hours_available >= 6
                      0 otherwise
      capacity_penalty = 10 when daily_capacity_meals < 500 else 0
      raw = power_score + water_score + cold_score - capacity_penalty
      food_safety_score = max(0, min(100, raw))
    input_set: "the inspected FieldKitchen row only; the score is a pure function of that row's power_source, water_source, refrigeration_hours_available and daily_capacity_meals"
    constants:
      POWER_POINTS_GRID: 40
      POWER_POINTS_GENERATOR: 30
      POWER_POINTS_SOLAR: 20
      POWER_POINTS_NONE: 0
      WATER_POINTS_PIPED: 35
      WATER_POINTS_TRUCKED: 25
      WATER_POINTS_WELL: 15
      WATER_POINTS_NONE: 0
      REFRIGERATION_FULL_HOURS: 12
      REFRIGERATION_PARTIAL_HOURS: 6
      COLD_SCORE_FULL: 25
      COLD_SCORE_PARTIAL: 15
      COLD_SCORE_NONE: 0
      MIN_VIABLE_CAPACITY_MEALS: 500
      CAPACITY_PENALTY: 10
      FOOD_SAFETY_CLEARANCE_MIN: 70
      FOOD_SAFETY_SCORE_CAP: 100
      FOOD_SAFETY_SCORE_FLOOR: 0
    precision: "integer 0-100; no rounding required, every term is an integer"
    variants:
      - name: base
        when: "every inspection"
        difference: "single scoring path; the boundary that matters is refrigeration_hours_available == 6 and == 12 (>= crosses, 5 does not) and daily_capacity_meals == 500 (499 penalised, 500 not)"

  - name: run_cost_allocation
    trigger: "DistributionRun transition DELIVERING -> COMPLETED"
    algorithm: waterfall_allocation
    formula: |
      run_total_cost_cents = fuel_cost_cents + handling_cost_cents
      eligible_stops       = stops of this run with status == DELIVERED
      total_delivered_meals = sum(eligible_stops.delivered_meals)

      when total_delivered_meals == 0:
        every eligible stop gets allocated_cost_cents = 0
        run.unallocated_cost_cents = run_total_cost_cents
      otherwise:
        for each eligible stop, in stop_sequence ASC order:
          allocated_cost_cents = round_half_up(run_total_cost_cents * delivered_meals / total_delivered_meals)
        residual_cents = run_total_cost_cents - sum(allocated_cost_cents over eligible stops)
        add residual_cents to the eligible stop with the LOWEST stop_sequence
        run.unallocated_cost_cents = 0
      ROUNDING ORDER (pinned): each stop's share is rounded independently with round_half_up and the
      shares are summed afterwards; the residual is then assigned to the eligible stop with the lowest
      stop_sequence. Summing the unrounded shares and rounding once at the end is NOT used.
    input_set: "only DistributionStop rows of the run whose status == DELIVERED enter the denominator; PENDING, FAILED and SKIPPED stops receive allocated_cost_cents = 0"
    constants:
      ALLOCATION_RESIDUAL_TARGET: "LOWEST_STOP_SEQUENCE"
      ALLOCATION_ZERO_DENOMINATOR_POLICY: "ALL_ZERO_UNALLOCATED"
    precision: "integer cents; round_half_up per stop share, residual assigned to exactly one stop so the allocated shares sum exactly to run_total_cost_cents"
    variants:
      - name: base
        when: "every run completion"
        difference: "single allocation path; the boundary that matters is total_delivered_meals == 0, which moves the whole pool into unallocated_cost_cents instead of erroring"

  - name: meal_order_cost_buildup
    trigger: "POST /field-ops/meal-orders (evaluated once, at creation)"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER — the discount tier is keyed on the PRE-DISCOUNT subtotal, the logistics
      fee is computed before the discount, and the discount base includes the logistics fee. The total
      is computed last, so the apparent circularity (discount keyed on a total that includes the
      discount) never arises:
        1. subtotal_cents       = ordered_meals * partner_kitchen.per_meal_price_cents
        2. tier                 = BULK     when subtotal_cents >= 2000000
                                  STANDARD when subtotal_cents >= 800000
                                  SMALL    otherwise
        3. logistics_fee_cents  = round_half_up(subtotal_cents * 0.03)
        4. discount_base_cents  = subtotal_cents + logistics_fee_cents
        5. volume_discount_cents= round_half_up(discount_base_cents * TIER_RATE[tier])
                                  TIER_RATE: BULK = 0.08, STANDARD = 0.05, SMALL = 0.00
        6. total_cost_cents     = subtotal_cents + logistics_fee_cents - volume_discount_cents
        7. provisional_cost_cents = total_cost_cents
      The partner kitchen's per_meal_price_cents is never reduced by the tier; the volume discount is a
      separate negative line on the batch.
    input_set: "one MealOrder row at creation, joined to its PartnerKitchen.per_meal_price_cents"
    constants:
      LOGISTICS_FEE_RATE: 0.03
      TIER_BULK_MIN_CENTS: 2000000
      TIER_STANDARD_MIN_CENTS: 800000
      TIER_RATE_BULK: 0.08
      TIER_RATE_STANDARD: 0.05
      TIER_RATE_SMALL: 0.00
    precision: "integer cents; round_half_up at steps 3 and 5 only, step 6 is exact integer arithmetic"
    variants:
      - name: base
        when: "every order creation"
        difference: "single pricing path; the boundaries that matter are subtotal_cents == 800000 and == 2000000, which select STANDARD and BULK respectively (799999 and 1999999 do not)"

  - name: incident_local_sourcing_ratio
    trigger: "GET /field-ops/incidents/{id}/accountability-report (recomputed on read)"
    algorithm: aggregation
    formula: |
      numerator_cents   = sum(IngredientPurchase.amount_cents where incident_id == incident.id
                              and status IN {DELIVERED, PAID})
      denominator_cents = sum(MealOrder.final_cost_cents where incident_id == incident.id
                              and status == DELIVERED)
      delivered_meal_total = sum(MealOrder.accepted_meals where incident_id == incident.id
                                 and status == DELIVERED)

      local_sourcing_pct = 0 when denominator_cents == 0
                           else round_half_up(numerator_cents * 100 / denominator_cents)
      cost_per_meal_cents = 0 when delivered_meal_total == 0
                            else round_half_up(denominator_cents / delivered_meal_total)
      donor_report_flag = "BELOW_LOCAL_SOURCING_TARGET" when local_sourcing_pct < 30 else "ON_TARGET"
    input_set: "IngredientPurchase rows in status IN {REQUESTED, CONFIRMED, DISPUTED, CANCELLED} are excluded from the numerator; MealOrder rows not in status DELIVERED are excluded from the denominator and from delivered_meal_total"
    constants:
      LOCAL_SOURCING_TARGET_PCT: 30
      PCT_SCALE: 100
      ZERO_DENOMINATOR_PCT: 0
      ZERO_DENOMINATOR_COST_PER_MEAL: 0
    precision: "local_sourcing_pct is an integer percentage; cost_per_meal_cents is an integer number of cents with round_half_up"
    variants:
      - name: base
        when: "every accountability read"
        difference: "single aggregation path; the boundary that matters is denominator_cents == 0 and delivered_meal_total == 0, which yield 0 instead of an error"

  - name: supplier_reliability_and_standing
    trigger: "IngredientPurchase transitions to DELIVERED, PAID, DISPUTED or CANCELLED (re-evaluated on every such transition)"
    algorithm: threshold
    formula: |
      delivered_count   = count(IngredientPurchase where supplier_id == supplier.id and status IN {DELIVERED, PAID})
      disputed_count    = count(IngredientPurchase where supplier_id == supplier.id and status IN {DISPUTED, CANCELLED})
      reliability_score = max(0, min(100, 50 + 10 * delivered_count - 25 * disputed_count))

      status is resolved in this exact order:
        1. SUSPENDED  when reliability_score < 40
        2. PREFERRED  when cash_flow_received_cents >= 500000 AND reliability_score >= 70
        3. PROSPECT   when delivered_count == 0 AND disputed_count == 0
        4. APPROVED   otherwise
    input_set: "all IngredientPurchase rows of the supplier, in every status; rows in status REQUESTED count toward neither delivered_count nor disputed_count"
    constants:
      SUPPLIER_RELIABILITY_BASE: 50
      DELIVERED_PURCHASE_CREDIT: 10
      DISPUTED_PURCHASE_PENALTY: 25
      SUPPLIER_SUSPENSION_MAX_SCORE: 40
      PREFERRED_CASHFLOW_MIN_CENTS: 500000
      PREFERRED_RELIABILITY_MIN: 70
      RELIABILITY_SCORE_CAP: 100
      RELIABILITY_SCORE_FLOOR: 0
    precision: "integer 0-100; every term is an integer, no rounding"
    variants:
      - name: base
        when: "every purchase transition"
        difference: "single scoring path; the boundaries that matter are reliability_score == 40 (SUSPENDED ends), == 70 combined with cash_flow_received_cents == 500000 (PREFERRED begins) and delivered_count == 0 (PROSPECT)"

  - name: partner_kitchen_quality_score
    trigger: "MealOrder transitions to READY, REJECTED or DELIVERED (re-evaluated on every such transition)"
    algorithm: weighted_scoring
    formula: |
      S = the most recent 5 MealOrder rows of this partner kitchen with status IN {DELIVERED, REJECTED},
          ordered by created_at DESC and, when two created_at values are equal, by scheduled_start ASC
          and then by menu_name ASC (never by id)
      weights are assigned from the most recent row backwards: 5, 4, 3, 2, 1
      (a history shorter than 5 rows uses only the leading weights, e.g. 2 rows use 5 and 4)
      weighted_sum = sum(S[i].quality_check_score * weight[i])
      weight_total = sum(weight[i])
      quality_score = max(0, min(100, round_half_up(weighted_sum / weight_total)))
      when S is empty the quality_score is left unchanged
    input_set: "only MealOrder rows in status IN {DELIVERED, REJECTED} enter the window; rows in {PLACED, IN_PRODUCTION, QUALITY_HOLD, READY, DISPATCHED, CANCELLED} are excluded"
    constants:
      QUALITY_HISTORY_WINDOW: 5
      QUALITY_WEIGHT_MOST_RECENT: 5
      QUALITY_WEIGHT_STEP: 1
      QUALITY_SCORE_CAP: 100
      QUALITY_SCORE_FLOOR: 0
    precision: "integer 0-100 with round_half_up on the weighted mean"
    variants:
      - name: base
        when: "every quality-affecting transition"
        difference: "single scoring path; the boundary that matters is the 5-row window, where a 6th older row is dropped and the weights re-normalise"

  - name: run_meal_conservation
    trigger: "DistributionStop transitions to DELIVERED or FAILED, and DistributionRun transition to COMPLETED"
    algorithm: constraint_propagation
    formula: |
      INVARIANT (holds at every instant, and reduces to loaded == delivered + returned once no stop
      is still PENDING):
        DistributionRun.loaded_meals
          == DistributionRun.delivered_meals
           + DistributionRun.returned_meals
           + sum(stop.planned_meals over stops of this run with status == PENDING)
        where DistributionRun.delivered_meals = sum(stop.delivered_meals over stops with status == DELIVERED)
        and   DistributionRun.returned_meals = loaded_meals - delivered_meals - pending_planned_meals

      forward action   : stop PENDING -> DELIVERED with delivered_meals = d
                         run.delivered_meals += d ; site.received_meals_total += d ; loaded_meals unchanged
      compensating act : stop DELIVERED -> FAILED
                         run.delivered_meals -= d ; site.received_meals_total -= d ; returned_meals += d
                         loaded_meals unchanged
      failed-forward   : stop PENDING -> FAILED
                         pending_planned_meals drops by planned_meals so returned_meals rises by the
                         same amount ; loaded_meals unchanged
      The named global quantity is DistributionRun.loaded_meals, and it MUST be identical before and
      after the forward/compensating pair.
    input_set: "every DistributionStop row of the run, in every status; PENDING stops are in neither delivered_meals nor returned_meals until the run reaches COMPLETED"
    constants:
      CONSERVED_QUANTITY: "DistributionRun.loaded_meals"
      REVERSAL_TARGET: "DistributionRun.returned_meals"
    precision: "integer meals, exact arithmetic, no rounding"
    variants:
      - name: base
        when: "every stop outcome and every run completion"
        difference: "single conservation path; the boundary that matters is a stop reversed after the run already reached COMPLETED, where the invariant must still hold"

validations:
  - priority: 1
    category: business_constraint
    check: "request body is a well-formed object; every enum-valued field carries a declared member; every numeric field respects its declared range; window_end is strictly after window_start on POST /field-ops/distribution-runs"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers are present on the request"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-Role is one of the roles the endpoint declares"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "when X-User-Role is KitchenOperator, X-User-ID equals the partner_kitchen_id of the MealOrder named in the path, and equals the id of the PartnerKitchen named in the path"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /field-ops/meal-orders/{id}/transitions, POST /field-ops/partner-kitchens/{id}/transitions"
  - priority: 5
    category: auth
    check: "when X-User-Role is SiteCoordinator, X-User-ID equals the distribution_site_id of the DistributionStop named in the path"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /field-ops/distribution-stops/{id}/transitions"
  - priority: 6
    category: existence
    check: "every {id} in the path resolves to a row of the addressed entity, validated left-to-right in path order"
    error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /field-ops/incidents/{id}, POST /field-ops/incidents/{id}/transitions, GET /field-ops/incidents/{id}/accountability-report, GET /field-ops/incidents/{id}/assessments, GET /field-ops/incidents/{id}/partner-kitchens, GET /field-ops/incidents/{id}/suppliers, GET /field-ops/incidents/{id}/distribution-sites, GET /field-ops/incidents/{id}/donor-commitments (sibling not-found errors ERR_FIELD_KITCHEN_NOT_FOUND, ERR_PARTNER_KITCHEN_NOT_FOUND, ERR_MEAL_ORDER_NOT_FOUND, ERR_DISTRIBUTION_RUN_NOT_FOUND, ERR_DISTRIBUTION_STOP_NOT_FOUND and the generic ERR_RESOURCE_NOT_FOUND cover the other path entities)"
  - priority: 7
    category: existence
    check: "every foreign-key id carried in the request body resolves to an existing row of the referenced entity"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /field-ops/assessments, POST /field-ops/field-kitchens, POST /field-ops/partner-kitchens, POST /field-ops/meal-orders, POST /field-ops/suppliers, POST /field-ops/ingredient-purchases, POST /field-ops/distribution-sites, POST /field-ops/distribution-runs, POST /field-ops/distribution-stops, POST /field-ops/donor-commitments"
  - priority: 8
    category: state
    check: "the entity named in the path is in a state whose outgoing transitions include the requested to_state (and, for PartnerKitchen, the requested dimension/to_state pair)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /field-ops/incidents/{id}/transitions, POST /field-ops/field-kitchens/{id}/transitions, POST /field-ops/partner-kitchens/{id}/transitions, POST /field-ops/meal-orders/{id}/transitions, POST /field-ops/ingredient-purchases/{id}/transitions, POST /field-ops/distribution-runs/{id}/transitions, POST /field-ops/distribution-stops/{id}/transitions, POST /field-ops/donor-commitments/{id}/transitions"
  - priority: 9
    category: state
    check: "the entity named in the path is not in a terminal state (Incident CLOSED; FieldKitchen DEMOBILIZED; PartnerKitchen contract_status TERMINATED; MealOrder DELIVERED/REJECTED/CANCELLED; IngredientPurchase PAID/CANCELLED; DistributionRun COMPLETED/ABORTED; DistributionStop FAILED/SKIPPED except the DELIVERED -> FAILED compensating reversal; DonorCommitment CLOSED/WITHDRAWN; DistributionSite CLOSED)"
    error_id: ERR_ENTITY_TERMINAL
    http_status: 409
    applies_to: "every transitions endpoint"
  - priority: 10
    category: state
    check: "expected_partner_kitchen_version on POST /field-ops/meal-orders equals the current PartnerKitchen.version, and expected_distribution_run_version on POST /field-ops/distribution-stops equals the current DistributionRun.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /field-ops/meal-orders, POST /field-ops/distribution-stops"
  - priority: 11
    category: state
    check: "the PartnerKitchen referenced by a MealOrder has contract_status == CONTRACTED"
    error_id: ERR_PARTNER_KITCHEN_NOT_CONTRACTED
    http_status: 409
    applies_to: "POST /field-ops/meal-orders, POST /field-ops/meal-orders/{id}/transitions"
  - priority: 12
    category: state
    check: "the parent Incident has status == ACTIVE"
    error_id: ERR_INCIDENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /field-ops/field-kitchens/{id}/transitions, POST /field-ops/donor-commitments/{id}/transitions"
  - priority: 13
    category: state
    check: "the FieldKitchen a DistributionRun loads from has site_status == OPERATIONAL"
    error_id: ERR_ORIGIN_KITCHEN_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /field-ops/distribution-runs/{id}/transitions"
  - priority: 14
    category: state
    check: "the parent DistributionRun has status == DELIVERING before a stop outcome is recorded"
    error_id: ERR_RUN_NOT_DELIVERING
    http_status: 409
    applies_to: "POST /field-ops/distribution-stops/{id}/transitions"
  - priority: 15
    category: state
    check: "the Supplier referenced by an IngredientPurchase does not have status == SUSPENDED (a PROSPECT producer may take a first order, which is what promotes it to APPROVED on delivery; a SUSPENDED producer may not)"
    error_id: ERR_SUPPLIER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /field-ops/ingredient-purchases/{id}/transitions"
  - priority: 16
    category: state
    check: "the current logical-clock instant is at or after PartnerKitchen.cooldown_until when a production window is opened or closed out of COOLDOWN"
    error_id: ERR_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /field-ops/partner-kitchens/{id}/transitions"
  - priority: 17
    category: state
    check: "PartnerKitchen.bank_verified == true before the kitchen can enter VETTING"
    error_id: ERR_BANK_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /field-ops/partner-kitchens/{id}/transitions"
  - priority: 18
    category: state
    check: "PartnerKitchen.vetting_score >= 60 before the kitchen can enter CONTRACTED"
    error_id: ERR_VETTING_SCORE_TOO_LOW
    http_status: 409
    applies_to: "POST /field-ops/partner-kitchens/{id}/transitions"
  - priority: 19
    category: business_safety
    check: "FieldKitchen.power_source != NONE and FieldKitchen.water_source != NONE before the site can enter FOOD_SAFETY_CLEARED (checked before the score gate, so a site with no water source is reported as ERR_KITCHEN_UTILITY_MISSING even though its score is also below 70)"
    error_id: ERR_KITCHEN_UTILITY_MISSING
    http_status: 422
    applies_to: "POST /field-ops/field-kitchens/{id}/transitions"
  - priority: 20
    category: business_safety
    check: "FieldKitchen.food_safety_score >= 70 before the site can enter FOOD_SAFETY_CLEARED"
    error_id: ERR_FOOD_SAFETY_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /field-ops/field-kitchens/{id}/transitions"
  - priority: 21
    category: business_safety
    check: "the DistributionSite referenced by a stop, or by the Assessment that justified a FieldKitchen siting, has access_constraint != BLOCKED"
    error_id: ERR_SITE_ACCESS_BLOCKED
    http_status: 422
    applies_to: "POST /field-ops/distribution-stops, POST /field-ops/distribution-stops/{id}/transitions, POST /field-ops/field-kitchens/{id}/transitions"
  - priority: 22
    category: business_safety
    check: "MealOrder.dietary_tags is a superset of Incident.population_dietary_requirements for the order's incident"
    error_id: ERR_DIETARY_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /field-ops/meal-orders"
  - priority: 23
    category: business_safety
    check: "DistributionRun.driver_safety_training_completed == true before the run can be created or leave PLANNED"
    error_id: ERR_DRIVER_SAFETY_TRAINING_REQUIRED
    http_status: 422
    applies_to: "POST /field-ops/distribution-runs, POST /field-ops/distribution-runs/{id}/transitions"
  - priority: 24
    category: business_constraint
    check: "no other MealOrder of the same PartnerKitchen whose status IN {PLACED, IN_PRODUCTION, QUALITY_HOLD, READY, DISPATCHED} occupies a half-open production window [scheduled_start, scheduled_start + production_hours) that intersects the new window, and the new scheduled_start is not inside the 8-hour trailing cooldown buffer that follows a MealOrder of that kitchen which entered REJECTED"
    error_id: ERR_KITCHEN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /field-ops/meal-orders"
  - priority: 25
    category: business_constraint
    check: "the FieldKitchen already has fewer than 3 DistributionRun rows whose planned_date falls in the same UTC calendar day [00:00:00Z, 24:00:00Z) as the new run"
    error_id: ERR_KITCHEN_DAILY_RUN_CAP
    http_status: 409
    applies_to: "POST /field-ops/distribution-runs"
  - priority: 26
    category: business_constraint
    check: "the sum of planned_meals over the run's stops with status PENDING stays at or below DistributionRun.loaded_meals after the new stop is added"
    error_id: ERR_RUN_LOAD_EXCEEDS_CAPACITY
    http_status: 409
    applies_to: "POST /field-ops/distribution-stops, POST /field-ops/distribution-runs/{id}/transitions"
  - priority: 27
    category: business_constraint
    check: "stop_sequence is unique among the stops of the same DistributionRun"
    error_id: ERR_DUPLICATE_STOP_SEQUENCE
    http_status: 409
    applies_to: "POST /field-ops/distribution-stops"
  - priority: 28
    category: business_constraint
    check: "a DistributionSite appears at most once among the stops of the same DistributionRun"
    error_id: ERR_DUPLICATE_STOP_SITE
    http_status: 409
    applies_to: "POST /field-ops/distribution-stops"
  - priority: 29
    category: business_fiscal
    check: "Incident.spent_cents plus the provisional_cost_cents the new MealOrder would add stays at or below Incident.funding_ceiling_cents"
    error_id: ERR_FUNDING_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /field-ops/meal-orders"
  - priority: 30
    category: business_fiscal
    check: "DonorCommitment.disbursed_cents plus disbursement_cents stays at or below DonorCommitment.amount_cents"
    error_id: ERR_DISBURSEMENT_EXCEEDS_COMMITMENT
    http_status: 422
    applies_to: "POST /field-ops/donor-commitments/{id}/transitions"
  - priority: 31
    category: business_referential
    check: "every entity referenced by a request body or by a state transition belongs to the same incident_id as the subject of the request"
    error_id: ERR_CROSS_INCIDENT_REFERENCE
    http_status: 422
    applies_to: "POST /field-ops/assessments, POST /field-ops/field-kitchens, POST /field-ops/partner-kitchens, POST /field-ops/meal-orders, POST /field-ops/suppliers, POST /field-ops/ingredient-purchases, POST /field-ops/distribution-sites, POST /field-ops/distribution-runs, POST /field-ops/distribution-stops, POST /field-ops/donor-commitments, POST /field-ops/meal-orders/{id}/transitions"
  - priority: 32
    category: business_temporal
    check: "Assessment.assessed_at is not earlier than the parent Incident's created_at"
    error_id: ERR_ASSESSMENT_BEFORE_ACTIVATION
    http_status: 422
    applies_to: "POST /field-ops/assessments"

endpoints:
  - method: POST
    path: "/field-ops/incidents"
    description: "Open a new activation record in MONITORING"
    roles: [PlatformAdmin]
    code: 201
    input: [name, country_code, disaster_type, severity_level, target_daily_meals, funding_ceiling_cents, "currency_code?", "population_dietary_requirements?"]
    output: Incident
    side_effects: ["status starts at MONITORING", "version starts at 1"]
  - method: GET
    path: "/field-ops/incidents"
    description: "List activations, newest first by created_at DESC (tie-break created_at ASC is identical, so the ordering is total)"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: GET
    path: "/field-ops/incidents/{id}"
    description: "Read one activation including its computed accountability fields"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/field-ops/incidents/{id}/transitions"
    description: "Drive the Incident state machine (ACTIVE, WINDING_DOWN, CLOSED, re-escalation to ACTIVE)"
    roles: [PlatformAdmin, FieldCoordinator]
    code: 200
    input: [to_state]
    output: Incident
    side_effects: ["applies the transition side effects declared in state_machines[entity=Incident]", "recomputes Incident.committed_cents and spent_cents"]
  - method: GET
    path: "/field-ops/incidents/{id}/accountability-report"
    description: "Donor accountability read: meal counting, local sourcing share and cost per meal (calculation incident_local_sourcing_ratio)"
    roles: [PlatformAdmin, DonorLiaison, FieldCoordinator]
    code: 200
    input: []
    output: { incident_id: string, local_sourcing_pct: integer, cost_per_meal_cents: integer, delivered_meal_total: integer, committed_cents: integer, spent_cents: integer, donor_report_flag: string }
    side_effects: ["recomputes Incident.local_sourcing_pct, cost_per_meal_cents and delivered_meal_total"]
  - method: POST
    path: "/field-ops/assessments"
    description: "Record a rapid needs assessment; it is created directly in SUBMITTED and its feeding priority is scored at creation"
    roles: [FieldCoordinator]
    code: 201
    input: [incident_id, assessed_at, population_affected, estimated_daily_meal_need, access_constraint, water_available, power_available, partner_kitchens_identified, "assessment_mode?"]
    output: Assessment
    side_effects: ["computes feeding_priority_score via calculation assessment_feeding_priority"]
  - method: GET
    path: "/field-ops/incidents/{id}/assessments"
    description: "List the assessments recorded for one activation"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: POST
    path: "/field-ops/field-kitchens"
    description: "Site a field kitchen against an assessment"
    roles: [FieldCoordinator]
    code: 201
    input: [incident_id, assessment_id, site_name, latitude, longitude, power_source, water_source, refrigeration_hours_available, daily_capacity_meals]
    output: FieldKitchen
    side_effects: ["computes food_safety_score via calculation field_kitchen_food_safety_score", "site_status starts at SITED"]
  - method: GET
    path: "/field-ops/field-kitchens"
    description: "List field kitchens, filterable by activation and by the assessment that justified siting"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["incident_id?", "assessment_id?", "limit?", "offset?"]
    output: FieldKitchen[]
    side_effects: []
  - method: GET
    path: "/field-ops/field-kitchens/{id}"
    description: "Read one field kitchen"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: []
    output: FieldKitchen
    side_effects: []
  - method: POST
    path: "/field-ops/field-kitchens/{id}/transitions"
    description: "Drive the FieldKitchen state machine (UTILITIES_PENDING, FOOD_SAFETY_CLEARED, OPERATIONAL, SUSPENDED, DEMOBILIZED)"
    roles: [FieldCoordinator, FoodSafetyOfficer, PlatformAdmin]
    code: 200
    input: [to_state]
    output: FieldKitchen
    side_effects: ["applies the transition side effects declared in state_machines[entity=FieldKitchen]", "a SUSPENDED site cascades its PLANNED and LOADING runs to ABORTED"]
  - method: POST
    path: "/field-ops/field-kitchens/{id}/inspections"
    description: "Record an inspection of the site's utilities and cold chain, then re-score food safety"
    roles: [FoodSafetyOfficer]
    code: 200
    input: [power_source, water_source, refrigeration_hours_available, daily_capacity_meals]
    output: FieldKitchen
    side_effects: ["overwrites the four inspected fields", "sets last_inspection_at to the current logical-clock instant", "recomputes food_safety_score via calculation field_kitchen_food_safety_score"]
  - method: POST
    path: "/field-ops/partner-kitchens"
    description: "Register a local restaurant as a candidate partner kitchen"
    roles: [PartnershipLead]
    code: 201
    input: [incident_id, business_name, owner_name, cuisine_tags, daily_capacity_meals, per_meal_price_cents, bank_verified]
    output: PartnerKitchen
    side_effects: ["contract_status starts at PROSPECT and production_status at IDLE"]
  - method: GET
    path: "/field-ops/incidents/{id}/partner-kitchens"
    description: "List the local restaurants activated under one incident"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: PartnerKitchen[]
    side_effects: []
  - method: GET
    path: "/field-ops/partner-kitchens/{id}"
    description: "Read one partner kitchen including its current version, which the caller echoes back as expected_partner_kitchen_version"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: []
    output: PartnerKitchen
    side_effects: []
  - method: POST
    path: "/field-ops/partner-kitchens/{id}/transitions"
    description: "Drive one dimension of the PartnerKitchen parallel state machine (dimension CONTRACT or PRODUCTION)"
    roles: [PartnershipLead, KitchenOperator, PlatformAdmin]
    code: 200
    input: [dimension, to_state, "vetting_score?"]
    output: PartnerKitchen
    side_effects: ["applies the transition side effects declared in state_machines[entity=PartnerKitchen]", "suspending a producing kitchen forces production_status to COOLDOWN", "entering AT_CAPACITY cancels the kitchen's PLACED meal orders"]
  - method: POST
    path: "/field-ops/meal-orders"
    description: "Place a production batch with a contracted local restaurant"
    roles: [ProductionPlanner, KitchenOperator]
    code: 201
    input: [incident_id, partner_kitchen_id, menu_name, dietary_tags, ordered_meals, scheduled_start, production_hours, expected_partner_kitchen_version]
    output: MealOrder
    side_effects: ["computes subtotal_cents, logistics_fee_cents, volume_discount_cents, provisional_cost_cents via calculation meal_order_cost_buildup", "increments PartnerKitchen.version by 1", "recomputes Incident.spent_cents"]
  - method: GET
    path: "/field-ops/meal-orders"
    description: "List production batches, filterable by activation, partner kitchen and dispatch run"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["incident_id?", "partner_kitchen_id?", "distribution_run_id?", "limit?", "offset?"]
    output: MealOrder[]
    side_effects: []
  - method: GET
    path: "/field-ops/meal-orders/{id}"
    description: "Read one production batch including both settlement variants"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: []
    output: MealOrder
    side_effects: []
  - method: POST
    path: "/field-ops/meal-orders/{id}/transitions"
    description: "Drive the MealOrder state machine (IN_PRODUCTION, QUALITY_HOLD, READY, DISPATCHED, DELIVERED, REJECTED, CANCELLED)"
    roles: [ProductionPlanner, KitchenOperator, FoodSafetyOfficer, LogisticsCoordinator]
    code: 200
    input: [to_state, "produced_meals?", "quality_check_score?", "rejected_meals?", "distribution_run_id?"]
    output: MealOrder
    side_effects: ["applies the transition side effects declared in state_machines[entity=MealOrder]", "pins final_cost_cents on DELIVERED", "recomputes PartnerKitchen.quality_score and meals_produced_today"]
  - method: POST
    path: "/field-ops/suppliers"
    description: "Register a local producer so cash can flow to the affected economy"
    roles: [SourcingOfficer]
    code: 201
    input: [incident_id, producer_name, locality, product_categories, "payment_terms_days?"]
    output: Supplier
    side_effects: ["status starts at PROSPECT"]
  - method: GET
    path: "/field-ops/incidents/{id}/suppliers"
    description: "List the local producers registered under one incident"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Supplier[]
    side_effects: []
  - method: POST
    path: "/field-ops/ingredient-purchases"
    description: "Place a sourcing order with a local producer for delivery to a partner kitchen"
    roles: [SourcingOfficer]
    code: 201
    input: [incident_id, supplier_id, partner_kitchen_id, item_description, quantity_kg, unit_price_cents_per_kg]
    output: IngredientPurchase
    side_effects: ["computes amount_cents = round_half_up(quantity_kg * unit_price_cents_per_kg)", "status starts at REQUESTED", "recomputes Incident.spent_cents"]
  - method: GET
    path: "/field-ops/ingredient-purchases"
    description: "List sourcing orders, filterable by activation, producer and receiving kitchen"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["incident_id?", "supplier_id?", "partner_kitchen_id?", "limit?", "offset?"]
    output: IngredientPurchase[]
    side_effects: []
  - method: GET
    path: "/field-ops/ingredient-purchases/{id}"
    description: "Read one sourcing order"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: []
    output: IngredientPurchase
    side_effects: []
  - method: POST
    path: "/field-ops/ingredient-purchases/{id}/transitions"
    description: "Drive the IngredientPurchase state machine (CONFIRMED, DELIVERED, PAID, DISPUTED, CANCELLED)"
    roles: [SourcingOfficer, PlatformAdmin]
    code: 200
    input: [to_state, "dispute_reason?"]
    output: IngredientPurchase
    side_effects: ["applies the transition side effects declared in state_machines[entity=IngredientPurchase]", "a PAID transition moves cash into Supplier.cash_flow_received_cents and may promote the producer to PREFERRED, which auto-confirms the producer's other REQUESTED orders", "a PAID -> DISPUTED reversal returns exactly amount_cents to the producer's unreceived balance"]
  - method: POST
    path: "/field-ops/distribution-sites"
    description: "Register a shelter, hospital, school or neighbourhood distribution point"
    roles: [LogisticsCoordinator]
    code: 201
    input: [incident_id, site_name, site_type, population_served, daily_meal_request, access_constraint]
    output: DistributionSite
    side_effects: ["status starts at REGISTERED"]
  - method: GET
    path: "/field-ops/incidents/{id}/distribution-sites"
    description: "List the receiving sites registered under one incident"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: DistributionSite[]
    side_effects: []
  - method: POST
    path: "/field-ops/distribution-runs"
    description: "Plan a delivery run from a field kitchen to a set of receiving sites"
    roles: [LogisticsCoordinator]
    code: 201
    input: [incident_id, field_kitchen_id, driver_name, driver_phone, driver_safety_training_completed, vehicle_type, planned_date, window_start, window_end, fuel_cost_cents, handling_cost_cents]
    output: DistributionRun
    side_effects: ["status starts at PLANNED", "total_cost_cents = fuel_cost_cents + handling_cost_cents", "recomputes FieldKitchen.runs_today_count"]
  - method: GET
    path: "/field-ops/distribution-runs"
    description: "List delivery runs, filterable by activation and origin field kitchen"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["incident_id?", "field_kitchen_id?", "limit?", "offset?"]
    output: DistributionRun[]
    side_effects: []
  - method: GET
    path: "/field-ops/distribution-runs/{id}"
    description: "Read one delivery run including its current version, which the caller echoes back as expected_distribution_run_version"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: []
    output: DistributionRun
    side_effects: []
  - method: POST
    path: "/field-ops/distribution-runs/{id}/transitions"
    description: "Drive the DistributionRun state machine (LOADING, EN_ROUTE, DELIVERING, COMPLETED, ABORTED)"
    roles: [LogisticsCoordinator, PlatformAdmin]
    code: 200
    input: [to_state, "loaded_meals?", "abort_reason?"]
    output: DistributionRun
    side_effects: ["applies the transition side effects declared in state_machines[entity=DistributionRun]", "COMPLETED runs calculation run_cost_allocation and pins returned_meals via run_meal_conservation", "ABORTED cascades every PENDING stop to SKIPPED"]
  - method: POST
    path: "/field-ops/distribution-stops"
    description: "Add a receiving stop to a planned run"
    roles: [LogisticsCoordinator]
    code: 201
    input: [distribution_run_id, distribution_site_id, stop_sequence, planned_meals, expected_distribution_run_version]
    output: DistributionStop
    side_effects: ["status starts at PENDING", "increments DistributionRun.version by 1"]
  - method: GET
    path: "/field-ops/distribution-stops"
    description: "List stops, filterable by run and by receiving site"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["distribution_run_id?", "distribution_site_id?", "limit?", "offset?"]
    output: DistributionStop[]
    side_effects: []
  - method: GET
    path: "/field-ops/distribution-stops/{id}"
    description: "Read one stop"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: []
    output: DistributionStop
    side_effects: []
  - method: POST
    path: "/field-ops/distribution-stops/{id}/transitions"
    description: "Record a stop outcome (DELIVERED, FAILED) including the compensating DELIVERED -> FAILED reversal"
    roles: [SiteCoordinator, LogisticsCoordinator, PlatformAdmin]
    code: 200
    input: [to_state, "delivered_meals?", "failure_reason?"]
    output: DistributionStop
    side_effects: ["applies the transition side effects declared in state_machines[entity=DistributionStop]", "keeps DistributionRun.loaded_meals conserved (calculation run_meal_conservation)", "a SKIPPED stop can push its DistributionSite into SERVICE_ALERT"]
  - method: POST
    path: "/field-ops/donor-commitments"
    description: "Record a donor pledge against an activation"
    roles: [DonorLiaison]
    code: 201
    input: [incident_id, donor_name, amount_cents, earmark]
    output: DonorCommitment
    side_effects: ["status starts at PLEDGED"]
  - method: GET
    path: "/field-ops/incidents/{id}/donor-commitments"
    description: "List the donor commitments recorded against one incident"
    roles: [PlatformAdmin, FieldCoordinator, FoodSafetyOfficer, PartnershipLead, ProductionPlanner, SourcingOfficer, LogisticsCoordinator, DonorLiaison, KitchenOperator, SiteCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: DonorCommitment[]
    side_effects: []
  - method: POST
    path: "/field-ops/donor-commitments/{id}/transitions"
    description: "Drive the DonorCommitment state machine (RECEIVED, ALLOCATED, PARTIALLY_DISBURSED, CLOSED, WITHDRAWN)"
    roles: [DonorLiaison, PlatformAdmin]
    code: 200
    input: [to_state, "disbursement_cents?"]
    output: DonorCommitment
    side_effects: ["applies the transition side effects declared in state_machines[entity=DonorCommitment]", "recomputes Incident.committed_cents"]
  - method: POST
    path: "/field-ops/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call the logical clock reads the fixed default 2026-09-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["every subsequent deadline, cooldown, window and day-bucket evaluation uses the new instant"]

errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "request body is not a well-formed object, carries an undeclared enum member, breaks a declared numeric range, or has window_end at or before window_start"
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "X-User-Role or X-User-ID header is absent"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "X-User-Role is not one of the roles the endpoint declares"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role addresses a resource it does not own (KitchenOperator on another kitchen's meal order, SiteCoordinator on another site's stop)"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "the incident id in the path does not resolve"
  - id: ERR_FIELD_KITCHEN_NOT_FOUND
    http: 404
    condition: "the field kitchen id in the path does not resolve"
  - id: ERR_PARTNER_KITCHEN_NOT_FOUND
    http: 404
    condition: "the partner kitchen id in the path does not resolve"
  - id: ERR_MEAL_ORDER_NOT_FOUND
    http: 404
    condition: "the meal order id in the path does not resolve"
  - id: ERR_DISTRIBUTION_RUN_NOT_FOUND
    http: 404
    condition: "the distribution run id in the path does not resolve"
  - id: ERR_DISTRIBUTION_STOP_NOT_FOUND
    http: 404
    condition: "the distribution stop id in the path does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "the assessment, supplier, ingredient purchase, distribution site or donor commitment id in the path does not resolve"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign-key id carried in a request body does not resolve to an existing row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the entity is not in a state whose outgoing transitions include the requested to_state (or the requested dimension/to_state pair)"
  - id: ERR_ENTITY_TERMINAL
    http: 409
    condition: "the entity is in a terminal state and no transition is permitted"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_partner_kitchen_version or expected_distribution_run_version does not match the parent's current version"
  - id: ERR_PARTNER_KITCHEN_NOT_CONTRACTED
    http: 409
    condition: "the partner kitchen is not in contract_status CONTRACTED"
  - id: ERR_INCIDENT_NOT_ACTIVE
    http: 409
    condition: "the parent incident is not in status ACTIVE"
  - id: ERR_ORIGIN_KITCHEN_NOT_OPERATIONAL
    http: 409
    condition: "the origin field kitchen is not in site_status OPERATIONAL"
  - id: ERR_RUN_NOT_DELIVERING
    http: 409
    condition: "the parent distribution run is not in status DELIVERING"
  - id: ERR_SUPPLIER_NOT_APPROVED
    http: 409
    condition: "the producer is in status PROSPECT or SUSPENDED, so its sourcing orders cannot be confirmed"
  - id: ERR_COOLDOWN_ACTIVE
    http: 409
    condition: "the partner kitchen is still inside its cooldown window"
  - id: ERR_BANK_NOT_VERIFIED
    http: 409
    condition: "the partner kitchen has bank_verified false"
  - id: ERR_VETTING_SCORE_TOO_LOW
    http: 409
    condition: "the partner kitchen's vetting_score is below 60"
  - id: ERR_FOOD_SAFETY_SCORE_TOO_LOW
    http: 422
    condition: "the field kitchen's food_safety_score is below 70"
  - id: ERR_KITCHEN_UTILITY_MISSING
    http: 422
    condition: "the field kitchen has power_source NONE or water_source NONE"
  - id: ERR_SITE_ACCESS_BLOCKED
    http: 422
    condition: "the receiving site or assessed catchment is in access_constraint BLOCKED"
  - id: ERR_DIETARY_REQUIREMENT_UNMET
    http: 422
    condition: "the meal order's dietary_tags do not cover the incident's population_dietary_requirements"
  - id: ERR_DRIVER_SAFETY_TRAINING_REQUIRED
    http: 422
    condition: "the volunteer driver has not completed the safety briefing"
  - id: ERR_KITCHEN_WINDOW_CONFLICT
    http: 409
    condition: "the new production window overlaps another batch of the same partner kitchen or falls inside that kitchen's 8-hour post-rejection cooldown buffer"
  - id: ERR_KITCHEN_DAILY_RUN_CAP
    http: 409
    condition: "the origin field kitchen already has 3 distribution runs in the same UTC calendar day"
  - id: ERR_RUN_LOAD_EXCEEDS_CAPACITY
    http: 409
    condition: "the run's pending planned meals would exceed loaded_meals"
  - id: ERR_DUPLICATE_STOP_SEQUENCE
    http: 409
    condition: "another stop of the same run already uses this stop_sequence"
  - id: ERR_DUPLICATE_STOP_SITE
    http: 409
    condition: "another stop of the same run already serves this distribution site"
  - id: ERR_FUNDING_CEILING_EXCEEDED
    http: 422
    condition: "the incident's spent_cents plus the new order's provisional_cost_cents would exceed funding_ceiling_cents"
  - id: ERR_DISBURSEMENT_EXCEEDS_COMMITMENT
    http: 422
    condition: "the disbursement would push disbursed_cents above the commitment's amount_cents"
  - id: ERR_CROSS_INCIDENT_REFERENCE
    http: 422
    condition: "a referenced entity belongs to a different incident than the subject of the request"
  - id: ERR_ASSESSMENT_BEFORE_ACTIVATION
    http: 422
    condition: "assessed_at is earlier than the parent incident's created_at"

roles:
  - name: PlatformAdmin
    description: "Emergency operations director with override authority across every activation"
    identity: "opaque"
    exclusive_operations: ["POST /field-ops/incidents", "POST /field-ops/incidents/{id}/transitions with to_state in {WINDING_DOWN, CLOSED}", "POST /field-ops/_clock/set_current_utc"]
    shared_operations: ["every transitions endpoint as a fallback approver", "GET /field-ops/incidents", "GET /field-ops/incidents/{id}", "GET /field-ops/incidents/{id}/accountability-report"]
  - name: FieldCoordinator
    description: "Runs rapid assessments, sites field kitchens and drives activation state"
    identity: "opaque"
    exclusive_operations: ["POST /field-ops/assessments", "POST /field-ops/field-kitchens", "POST /field-ops/incidents/{id}/transitions with to_state=ACTIVE", "POST /field-ops/field-kitchens/{id}/transitions with to_state in {UTILITIES_PENDING, OPERATIONAL, DEMOBILIZED}"]
    shared_operations: ["GET /field-ops/incidents/{id}/accountability-report", "POST /field-ops/field-kitchens/{id}/transitions with to_state=SUSPENDED"]
  - name: FoodSafetyOfficer
    description: "Owns inspections, quality checks and food-safety suspensions"
    identity: "opaque"
    exclusive_operations: ["POST /field-ops/field-kitchens/{id}/inspections", "POST /field-ops/field-kitchens/{id}/transitions with to_state in {FOOD_SAFETY_CLEARED, SUSPENDED}", "POST /field-ops/meal-orders/{id}/transitions with to_state in {READY, REJECTED}"]
    shared_operations: ["POST /field-ops/meal-orders/{id}/transitions with to_state=IN_PRODUCTION (rework loop)"]
  - name: PartnershipLead
    description: "Vets and contracts local restaurants into the activation"
    identity: "opaque"
    exclusive_operations: ["POST /field-ops/partner-kitchens", "POST /field-ops/partner-kitchens/{id}/transitions with dimension=CONTRACT"]
    shared_operations: ["GET /field-ops/incidents/{id}/partner-kitchens", "GET /field-ops/partner-kitchens/{id}"]
  - name: ProductionPlanner
    description: "Plans production batches against contracted restaurant capacity"
    identity: "opaque"
    exclusive_operations: ["POST /field-ops/meal-orders", "POST /field-ops/meal-orders/{id}/transitions with to_state in {IN_PRODUCTION, CANCELLED}"]
    shared_operations: ["GET /field-ops/meal-orders", "GET /field-ops/meal-orders/{id}"]
  - name: SourcingOfficer
    description: "Buys ingredients from local producers so cash reaches the affected economy"
    identity: "opaque"
    exclusive_operations: ["POST /field-ops/suppliers", "POST /field-ops/ingredient-purchases", "POST /field-ops/ingredient-purchases/{id}/transitions"]
    shared_operations: ["GET /field-ops/incidents/{id}/suppliers", "GET /field-ops/ingredient-purchases"]
  - name: LogisticsCoordinator
    description: "Registers receiving sites, plans runs and records stop outcomes"
    identity: "opaque"
    exclusive_operations: ["POST /field-ops/distribution-sites", "POST /field-ops/distribution-runs", "POST /field-ops/distribution-runs/{id}/transitions", "POST /field-ops/distribution-stops"]
    shared_operations: ["POST /field-ops/distribution-stops/{id}/transitions", "POST /field-ops/meal-orders/{id}/transitions with to_state in {DISPATCHED, DELIVERED}"]
  - name: DonorLiaison
    description: "Records donor commitments and owns donor accountability reporting"
    identity: "opaque"
    exclusive_operations: ["POST /field-ops/donor-commitments", "POST /field-ops/donor-commitments/{id}/transitions"]
    shared_operations: ["GET /field-ops/incidents/{id}/accountability-report", "GET /field-ops/incidents/{id}/donor-commitments"]
  - name: KitchenOperator
    description: "The local restaurant's own account, acting only on its own kitchen and batches"
    identity: "entity_backed:PartnerKitchen"
    exclusive_operations: ["POST /field-ops/partner-kitchens/{id}/transitions with dimension=PRODUCTION", "POST /field-ops/meal-orders/{id}/transitions with to_state=QUALITY_HOLD"]
    shared_operations: ["POST /field-ops/meal-orders", "POST /field-ops/meal-orders/{id}/transitions with to_state=IN_PRODUCTION"]
  - name: SiteCoordinator
    description: "The receiving site's own account, confirming handover at its own site only"
    identity: "entity_backed:DistributionSite"
    exclusive_operations: ["POST /field-ops/distribution-stops/{id}/transitions with to_state=DELIVERED for a stop whose distribution_site_id equals X-User-ID"]
    shared_operations: ["GET /field-ops/distribution-stops", "GET /field-ops/incidents/{id}/distribution-sites"]
