              captures: { at_boundary: "$.data.crane_utilization_pct", w1: "$.data.pick_window_start" }
            - call: "POST /modular/modules/${m2}/schedule-pick"
              payload: { pick_window_start: "2026-09-10T11:30:00Z", pick_window_end: "2026-09-10T12:15:00Z", pick_radius_ft: 90, rigging_weight_lb: 5000 }
              as: SiteSuperintendent
              as_user_id: "${proj}"
              captures: { over: "$.data.error_id" }
          assert:
            - "at the boundary: HTTP 200, ${at_boundary} == 85.00, ${w1} == '2026-09-10T09:00:00Z' — 81600 * 100 == 85 * 96000 and the gate is strict >"
            - "one pound over: ${over} == 'ERR_CRANE_CAPACITY_EXCEEDED' with HTTP 422 — 8160100 > 8160000"
            - "GET /modular/modules/${m2} reports pick_window_start == null; the rejected pick left no reservation, so the crane window remains free"
            - "GET /modular/modules/${m2} reports crane_utilization_pct == 0 — the rejected computation is not persisted even though it would have displayed 85.00"

      - name: compatibility_score_exactly_70_freeze_floor_on_review_decision
        grounds:
          - calculations.design_factory_compatibility_score
          - validations[priority=87]
          - state_machines[DesignPackage.freeze_state]
          - endpoints[POST /modular/design-packages/{packageId}/review-decision]
        boundary_metric: factory_compatibility_score against FREEZE_MIN_SCORE == 70
        distinguishing_aspect: |
          A different metric (a 0..100 weighted detailing score, not a capacity percentage) on a
          different endpoint (review-decision, not schedule-pick), and the boundary sits on the
          opposite side of the comparison: the gate is >=, so exactly 70 must FREEZE while 69 and
          below must not. The pair 70 / 62 straddles the floor with one extra connection conflict,
          which is the smallest penalty step (weight 8) that can cross it from 70.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; Project with planned_module_count 4"
            - "package R1: 0 conflicts, 5 open field-scope items, FIELD_COORDINATED, split 4 -> penalty 0 + 25 + 5 + 0 == 30, score exactly 70"
            - "package R2: 1 conflict, 5 open field-scope items, FIELD_COORDINATED, split 4 -> penalty 8 + 25 + 5 + 0 == 38, score 62"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "FIELD_COORDINATED", open_connection_conflicts: 0, field_scope_items_open: 5 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg1: "$.data.id", score1: "$.data.factory_compatibility_score" }
            - call: "POST /modular/design-packages/${pkg1}/submit"
              payload: { review_note: "R1 at the floor" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "GET /modular/projects/${proj}"
              as: ProgramAdmin
              captures: { projv2: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 2, module_split_count: 4, expected_project_version: "${projv2}", connection_detail_state: "FIELD_COORDINATED", open_connection_conflicts: 1, field_scope_items_open: 5 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg2: "$.data.id", score2: "$.data.factory_compatibility_score" }
          trigger:
            - call: "POST /modular/design-packages/${pkg1}/review-decision"
              payload: { decision: "FREEZE", review_note: "exactly at the floor" }
              as: DesignEngineer
              as_user_id: "eng-002"
              captures: { at_boundary: "$.data.freeze_state", bscore: "$.data.factory_compatibility_score" }
            - call: "POST /modular/design-packages/${pkg2}/submit"
              payload: { review_note: "R2 one conflict short" }
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /modular/design-packages/${pkg2}/review-decision"
              payload: { decision: "FREEZE", review_note: "below the floor" }
              as: DesignEngineer
              as_user_id: "eng-002"
              captures: { under: "$.data.error_id" }
          assert:
            - "${score1} == 70 and ${score2} == 62 — the score is recomputed at create time"
            - "at the boundary: ${at_boundary} == 'FROZEN' and ${bscore} == 70 — the gate is >= 70, so exactly 70 freezes"
            - "one conflict below: ${under} == 'ERR_FACTORY_COMPATIBILITY_TOO_LOW' with HTTP 422"
            - "GET /modular/design-packages/${pkg2} reports freeze_state == 'IN_REVIEW' — the rejected freeze leaves the package reviewable, it does not fall back to REVISION_REQUIRED"
            - "GET /modular/projects/${proj} reports phase == 'DESIGN_FROZEN' from R1 only"

