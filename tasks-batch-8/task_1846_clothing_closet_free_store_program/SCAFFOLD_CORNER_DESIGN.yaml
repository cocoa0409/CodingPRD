        claim_type: rbac_deny
        grounds: [roles.Client, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Client role is absent from POST /storage-zones roles: the call fails ERR_FORBIDDEN (403) before any request-shape check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZX", season_policy: ALL_SEASON, capacity_items: 5 }, as: Client, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: client_ownership_scope_on_reads
        claim_type: ownership_scope
        grounds: [roles.Client, "validations[priority=3]"]
        distinguishing_aspect: "Client A reading client B's record fails ERR_FORBIDDEN; reading own record succeeds — ownership compares X-User-ID to the path id."
        test_recipe:
          setup: ["clients A and B registered"]
          setup_api_calls:
            - { call: "POST /closet/clients", payload: { full_name: "A", household_size: 2 }, as: ProgramAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "B", household_size: 2 }, as: ProgramAdmin, captures: { cb_id: $.data.id } }
          trigger:
            - { call: "GET /closet/clients/${cb_id}", payload: {}, as: Client, as_user_id: "${ca_id}", captures: { err: $.data.error_id } }
            - { call: "GET /closet/clients/${ca_id}", payload: {}, as: Client, as_user_id: "${ca_id}", captures: { nm: $.data.full_name } }
          assert:
            - "err == ERR_FORBIDDEN"
            - "nm == \"A\""

      - name: partner_ownership_scope_on_issue
        claim_type: ownership_scope
        grounds: [roles.ReferralPartner, "validations[priority=3]"]
        distinguishing_aspect: "ReferralPartner A issuing under partner B's path id fails ERR_FORBIDDEN; issuing under its own id succeeds."
        test_recipe:
          setup: ["partners A and B; one client"]
          setup_api_calls:
            - { call: "POST /closet/referral-partners", payload: { name: "Agency A", base_voucher_quota: 5 }, as: ProgramAdmin, captures: { pa_id: $.data.id } }
            - { call: "POST /closet/referral-partners", payload: { name: "Agency B", base_voucher_quota: 5 }, as: ProgramAdmin, captures: { pb_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: ProgramAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /closet/referral-partners/${pb_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2026-12-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${pa_id}", captures: { err: $.data.error_id } }
            - { call: "POST /closet/referral-partners/${pa_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 1, expires_at: "2026-12-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${pa_id}", captures: { vst: $.data.status } }
          assert:
            - "err == ERR_FORBIDDEN"
            - "vst == ISSUED"

      - name: batch_close_volunteer_cannot_close
        claim_type: rbac_deny
        grounds: [roles.Volunteer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Batch close is a VolunteerLead/ProgramAdmin operation; a plain Volunteer is rejected ERR_FORBIDDEN even when they did not sort the batch."
        test_recipe:
          setup: ["SORTED batch (sorted by lead); plain volunteer attempts the close"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Lead One", is_lead: true }, as: ProgramAdmin, captures: { l1_id: $.data.id } }
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol Two", is_lead: false }, as: ProgramAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 2 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${l1_id}" }, as: VolunteerLead, as_user_id: "${l1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: VolunteerLead, as_user_id: "${l1_id}" }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 1 }, as: VolunteerLead, as_user_id: "${l1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: VolunteerLead, as_user_id: "${l1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: VolunteerLead, as_user_id: "${l1_id}" }
          trigger:
            - { call: "POST /closet/donation-batches/${b_id}/close", payload: {}, as: Volunteer, as_user_id: "${v2_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (role denial, not SoD: v2 never sorted)"

      - name: volunteer_signup_ownership
        claim_type: ownership_scope
        grounds: [roles.Volunteer, "validations[priority=3]"]
        distinguishing_aspect: "A Volunteer may only sign up themselves (volunteer_id must equal X-User-ID -> ERR_FORBIDDEN otherwise); a VolunteerLead may sign up others."
        test_recipe:
          setup: ["volunteers v1, v2 and lead l1; capacity-3 shift"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "V1", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/volunteers", payload: { full_name: "V2", is_lead: false }, as: ProgramAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /closet/volunteers", payload: { full_name: "L1", is_lead: true }, as: ProgramAdmin, captures: { l1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", role_type: FLOOR, capacity_volunteers: 3 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
          trigger:
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v2_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v2_id}" }, as: VolunteerLead, as_user_id: "${l1_id}", captures: { su: $.data.status } }
          assert:
            - "err == ERR_FORBIDDEN (self-signup scope)"
            - "su == SIGNED_UP (lead may sign up others)"

  - section: cross_cutting_layers
    instances:
      - name: occ_client_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[client-profile-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /clients with the version observed before another writer's update fails 412 ERR_STALE_VERSION; the well-versioned writer succeeds and advances version by 1."
        test_recipe:
          setup: ["client created (version 1)"]
          setup_api_calls:
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: ProgramAdmin, captures: { c_id: $.data.id, cv: $.data.version } }
          trigger:
            - { call: "PATCH /closet/clients/${c_id}", payload: { household_size: 5, expected_client_version: "${cv}" }, as: ProgramAdmin, captures: { cv2: $.data.version, hh: $.data.household_size } }
            - { call: "PATCH /closet/clients/${c_id}", payload: { household_size: 6, expected_client_version: "${cv}" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /closet/clients/${c_id}", payload: {}, as: ProgramAdmin, captures: { hh_final: $.data.household_size } }
          assert:
            - "cv == 1 and cv2 == 2 and hh == 5 (first writer succeeds)"
            - "err == ERR_STALE_VERSION (stale expected_client_version rejected)"
            - "hh_final == 5 (loser's write not applied)"

      - name: occ_zone_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[zone-capacity-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /storage-zones carries the same OCC contract on the zone aggregate: stale expected_zone_version fails 412 while the fresh write advances version."
        test_recipe:
          setup: ["zone created (version 1)"]
          setup_api_calls:
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZOC", season_policy: ALL_SEASON, capacity_items: 4 }, as: ProgramAdmin, captures: { z_id: $.data.id, zv: $.data.version } }
          trigger:
            - { call: "PATCH /closet/storage-zones/${z_id}", payload: { capacity_items: 6, expected_zone_version: "${zv}" }, as: ProgramAdmin, captures: { zv2: $.data.version, cap: $.data.capacity_items } }
            - { call: "PATCH /closet/storage-zones/${z_id}", payload: { capacity_items: 8, expected_zone_version: "${zv}" }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "zv == 1 and zv2 == 2 and cap == 6"
            - "err == ERR_STALE_VERSION"

      - name: quarantine_restock_reconciles_zone_stock
        claim_type: derived_field_reconciliation
        grounds: [entities.StorageZone.fields.current_stock]
        excluded_because:
          difficulty_instance: item_quarantine_cycle_and_reject_branch
          rationale: "Zone current_stock reconciliation across quarantine/restock/reject is asserted there (z_stock == 1 after the cycle)."

  - section: consistency_model
    instances:
      - name: read_after_write_immediate_consistency
        claim_type: immediate
        grounds: [entities.StorageZone.fields.posture, entities.StorageZone.fields.current_stock]
        distinguishing_aspect: "Immediate consistency: mutations are visible in the same request's response and in the very next read — zone creation shows current_stock 0 / posture AVAILABLE, and a follow-up GET agrees."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZIC", season_policy: WINTER, capacity_items: 7 }, as: ProgramAdmin, captures: { z_id: $.data.id, st0: $.data.current_stock, po0: $.data.posture } }
            - { call: "GET /closet/storage-zones/${z_id}", payload: {}, as: ProgramAdmin, captures: { st1: $.data.current_stock, po1: $.data.posture, cap1: $.data.capacity_items } }
          assert:
            - "st0 == 0 and po0 == AVAILABLE (write response reflects derived fields)"
            - "st1 == 0 and po1 == AVAILABLE and cap1 == 7 (read agrees)"
