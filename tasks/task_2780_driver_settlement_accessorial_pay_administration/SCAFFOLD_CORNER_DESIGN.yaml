      - name: cancelling_the_pending_correction_reconciles_the_hold_back_to_false
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Driver.fields.pending_retro_correction_cents
          - entities.Driver.fields.settlement_hold
          - endpoints[POST /driver-pay/retro-corrections/{id}/cancel]
          - errors[ERR_CORRECTION_NOT_PENDING]
          - validations[priority=28]
          - domain_constants.RETRO_HOLD_THRESHOLD
        distinguishing_aspect: |
          pending_retro_correction_cents and settlement_hold are both derived, and the second is derived from the
          first, so a cancel has to walk the chain backwards: a -57200 re-grade on a 1200-mile load pushes the
          magnitude past RETRO_HOLD_THRESHOLD 50000 and raises the hold, and cancelling that single PENDING row
          must recompute the sum to 0 and the flag to false in the same request - not leave a stale true. The
          correction is then immutable: a second cancel is ERR_CORRECTION_NOT_PENDING at 409 and must not drive
          the derived pair negative or double-count it. The cancel also walks the load's pay axis back from
          ADJUSTED to SETTLED while leaving the re-graded 14500 in place, so the paid statement's 71700 and the
          load's 14500 disagree permanently and correctly.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_DRC is a LEASED_OPERATOR on a PER_MILE-58-only PRACTICAL package with escrow_required false"
            - "load LOAD_DRC practical 1200 / hhg 250 DELIVERED 2026-08-04T18:00Z paying 71700"
            - "settlement STL_DRC over [2026-08-03T00:00:00Z, 2026-08-10T00:00:00Z) is PAID at 2026-08-10T09:00:00Z"
            - "a MILEAGE dispute claiming (HHG, 250) is UNDER_REVIEW, reviewed by clerk-01"
