          rationale: "ERR_RUN_OVERLAP asserted there; ERR_VISIT_TOO_CLOSE asserted in visit_spacing_thirty_minute_buffer."

      - name: distributor_and_account_state_gate_errors
        claim_type: violation_to_error
        grounds: ['errors[ERR_DISTRIBUTOR_NOT_ACTIVE"]', 'errors[ERR_ACCOUNT_NOT_APPROVED]']
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_create_requires_distributor_active
          rationale: "Both gates asserted in the two cross-entity difficulty instances."

