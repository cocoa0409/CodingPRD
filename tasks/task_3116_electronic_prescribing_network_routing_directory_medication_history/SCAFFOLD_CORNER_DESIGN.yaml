            - "the second route-fallback succeeds and reports routing_status == FALLBACK_PENDING"
            - "GET /network/prescriptions/${rx_id}/attempts still returns exactly 1 row at this point — the fallback attempt is only created by POST /network/prescriptions/${rx_id}/fallback-attempts"

      - name: prescriptions_filtered_list_finds_children_by_pharmacy_endpoint_and_significance
        claim_type: standard_crud
        grounds:
