      - name: clock_accepts_the_same_instant_but_never_moves_backwards
        claim_type: Triggerability
        grounds:
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - validations[priority=80]
          - endpoints[POST /modular/_clock/set_current_utc]
        distinguishing_aspect: |
          The guard is >=, so re-setting the clock to the instant it already holds must succeed while
          one second earlier must fail. A failed attempt must leave the clock exactly where it was,
          which is observable through the created_at of the next write.
        test_recipe:
          setup: ["clock moved from its 2026-08-01T00:00:00Z default to 2026-09-01T08:00:00Z"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T07:59:59Z" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { ca: "$.data.created_at" }
          assert:
            - "the equal-instant call returns HTTP 200 with success == true"
            - "${err} == 'ERR_CLOCK_NOT_MONOTONIC' with HTTP 422"
            - "${ca} == '2026-09-01T08:00:00.000Z' — the rejected attempt did not roll the clock back"

      - name: design_package_lifecycle_errors_are_triggerable
