        distinguishing_aspect: "489/4000 seats is exactly 12.225 percent, which ROUND_HALF_UP renders 12.23 (banker's rounding would give 12.22); the error then propagates deterministically to usage_row_index 7.34 and snapshot_health_score 46.32."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account with no tickets, no sponsors and no goals (S = 100.00, E = 25.00, O = 60.00)."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 489, licensed_seats: 4000, feature_depth_pct: 0.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sig_id: $.data.id }
          assert:
            - "AccountSignal.${sig_id}.seat_utilisation_pct == 12.23 (exactly 12.225 rounded HALF_UP, not 12.22)."
            - "AccountSignal.${sig_id}.usage_row_index == 7.34 (0.60*12.23 + 0.40*0.00 = 7.338 -> 7.34)."
            - "Account.${acct_id}.adoption_index == 7.34."
            - "Account.${acct_id}.snapshot_health_score == 46.32 and trended_health_score == 46.32 and health_tier == \"RED\"."

