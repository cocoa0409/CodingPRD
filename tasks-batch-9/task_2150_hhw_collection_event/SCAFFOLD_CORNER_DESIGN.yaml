        grounds: ["state_machines.Appointment.REQUESTED_to_CONFIRMED", "calculations.appointment_quota_ledger"]
        excluded_because:
          difficulty_instance: compensating_invariant / appointment_cancel_restores_resident_reserved_mass
          rationale: "That §1.8 instance reads Resident.annual_quantity_reserved_kg immediately after CONFIRM and again immediately after CANCEL, proving every derived field is visible within the same request cycle."

