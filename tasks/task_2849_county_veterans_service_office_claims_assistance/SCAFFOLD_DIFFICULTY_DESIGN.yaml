  # =====================================================================
  # RULE 6 — boundary_precision_check
  # Three instances on three DIFFERENT metrics and three DIFFERENT
  # endpoints:
  #   evidence_completeness_pct exactly 80.00   -> MARK_READY
  #   program pool filled to the cent           -> determination APPROVE
  #   performance_score on an empty input set   -> outcome-report compute
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: evidence_completeness_exactly_at_threshold_marks_ready_while_one_late_item_is_rejected
        grounds:
          - calculations.evidence_completeness_pct
          - validations[priority=65]
          - state_machines.Claim.PEER_REVIEW_to_READY_TO_FILE
          - errors[ERR_EVIDENCE_INCOMPLETE]
        distinguishing_aspect: |
          The MARK_READY comparison is >= EVIDENCE_READY_THRESHOLD_PCT, so a claim landing on exactly 80.00
          must pass. Two 2-condition claims (required_points 70) each hold the same four evidence types;
          claim X earns 20.00 + 17.50 + 12.50 + 6.00 = 56.00 -> 80.00 and is accepted, while claim Y differs
          only in that its LAY_STATEMENT arrives 35 days after it was requested, so LATE_MULT 0.85 turns
          6.00 into 5.10, the total becomes 55.10 -> 78.71, and MARK_READY is refused. An implementation
          using a strict > on the threshold fails X; one that ignores LATE_MULT wrongly accepts Y.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z and is later moved to 2026-09-05T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO preparer, rep_b ACTIVE VSO_ORG reviewer."
            - "Veteran vet with discharge VERIFIED, intake_status SCREENED, ACTIVE PowerOfAttorney designating rep_a."
            - "Claim x and Claim y, both prepared by rep_a with two claimed_conditions so required_points is 40 + 2 * 15 = 70, both in EVIDENCE_DEVELOPMENT."
            - "Each claim holds SERVICE_TREATMENT_RECORD, DBQ, PRIVATE_MEDICAL and LAY_STATEMENT items, all requested on 2026-08-01."
            - "All four of claim x's items and the first three of claim y's are RECEIVED on 2026-08-01 (0 days elapsed, on time); claim y's LAY_STATEMENT is RECEIVED on 2026-09-05, 35 days later, so it is late."
            - "Both claims are then in PEER_REVIEW with rep_b as peer_reviewed_by_representative_id."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-141", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
