# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2800
# Preschool Special Education Child Find & Evaluation
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. The logical clock
# starts at 2026-08-01T00:00:00Z; every chain that depends on "now" sets it
# explicitly via POST /child-find/_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: referral_due_date_consent_anchored_vs_receipt_anchored
        grounds:
          - calculations.referral_evaluation_due_date
          - entities.Referral.fields.evaluation_due_date
          - entities.Referral.fields.eligibility_pathway
          - entities.Child.fields.third_birthday
          - state_machines.Referral.CONSENT_PENDING_to_EVALUATION_AUTHORIZED
        distinguishing_aspect: |
          The same referral yields three different 60-day deadlines depending on
          the anchor and the cap: receipt-anchored 2026-09-30, consent-anchored
          2026-11-19, and the pinned Part C value 2026-11-01 produced by capping
          the consent-anchored date at the child's third birthday; only the
          PART_C_TRANSITION_DEADLINE pathway applies the cap.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Part C child born 2023-11-01 (33 months old, third birthday 2026-11-01), part_c_enrolled true."
            - "One referral received 2026-08-01 with source PART_C_TRANSITION, so eligibility_pathway is PART_C_TRANSITION_DEADLINE."
            - "The evaluation-consent notice is issued on 2026-08-01 but the family does not sign until the clock has advanced to 2026-09-20."
            - "Referral is intake_status EVALUATION_AUTHORIZED, consent_status GRANTED, consent_granted_at 2026-09-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/children"
              payload: { first_name: "Ana", last_name: "Reyes", date_of_birth: "2023-11-01", guardian_full_name: "Marta Reyes", district_of_residence: "D-01", primary_language_code: "en", part_c_enrolled: true, part_c_exit_date: "2026-11-01" }
              as: ChildFindCoordinator
              captures: { child_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child_id}", source: "PART_C_TRANSITION", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referral_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referral_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consent_id: "$.data.id" }
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/consent-records/${consent_id}/decision"
              payload: { decision: "GRANTED" }
              as: Parent
              as_user_id: "${child_id}"
          trigger:
            - call: "GET /child-find/referrals/${referral_id}/timeline"
              payload: {}
              as: ChildFindCoordinator
          assert:
            - "timeline.eligibility_pathway == \"PART_C_TRANSITION_DEADLINE\""
            - "timeline.receipt_anchored_due_date == \"2026-09-30\""
            - "timeline.consent_anchored_due_date == \"2026-11-19\""
            - "timeline.third_birthday_cap_date == \"2026-11-01\""
            - "timeline.evaluation_due_date == \"2026-11-01\""
            - "timeline.days_remaining == 42"
            - "timeline.timeline_compliance == \"ON_TIME\""
            - "Referral.${referral_id}.evaluation_due_date == \"2026-11-01\""
            - "Referral.${referral_id}.consent_status == \"GRANTED\""
            - "Referral.${referral_id}.intake_status == \"EVALUATION_AUTHORIZED\""

      - name: provider_minutes_projected_vs_committed_plan_states
        grounds:
          - calculations.provider_assigned_weekly_minutes
          - entities.Provider.fields.assigned_weekly_service_minutes
          - entities.Provider.fields.direct_weekly_service_minutes
          - entities.ServicePlan.fields.status
          - state_machines.ServiceLine.PROPOSED_to_STAFFED
        distinguishing_aspect: |
          The two variants differ only in whether DRAFT plans count: with one
          STAFFED 150-minute DIRECT line under a DRAFT plan the pinned PROJECTED
          variant reports assigned_weekly_service_minutes 160 (150 direct + 10
          travel) while COMMITTED_ONLY reports committed_weekly_minutes 0,
          because it admits only PENDING_PARENT_CONSENT and ACTIVE plans.
        setup_note: "Uses the standardized 5-domain pipeline so the case can reach REPORT_DRAFTED and a DRAFT ELIGIBLE plan can be created."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One community site S1 (ACTIVE, languages_supported ['en'], iep_seat_capacity 2) and one SLP provider with max_weekly_service_minutes 400."
            - "One child born 2023-08-01 with a consent-granted referral and an evaluation case chaired by a SCHOOL_PSYCHOLOGIST, all five domains COMPLETED, report drafted."
            - "An ELIGIBLE ServicePlan in DRAFT with setting COMMUNITY_PRESCHOOL at S1 carrying exactly one SLP DIRECT line of 150 weekly minutes, STAFFED to the SLP provider."
            - "No plan has been submitted for parent consent, so nothing is PENDING_PARENT_CONSENT or ACTIVE."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Dana Chair", discipline: "SCHOOL_PSYCHOLOGIST", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { chair_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Eli ECSE", discipline: "ECSE_TEACHER", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { ecse_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Sam Social", discipline: "SOCIAL_WORKER", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { sw_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Omar OT", discipline: "OT", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { ot_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Iris SLP", discipline: "SLP", home_region_code: "R-1", max_weekly_service_minutes: 400 }
              as: DistrictAdmin
              captures: { slp_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Ben", last_name: "Ortiz", date_of_birth: "2023-08-01", guardian_full_name: "Lia Ortiz", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referral_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referral_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consent_id: "$.data.id" }
            - call: "POST /child-find/consent-records/${consent_id}/decision"
              payload: { decision: "GRANTED" }
              as: Parent
              as_user_id: "${child_id}"
            - call: "POST /child-find/referrals/${referral_id}/evaluation-cases"
              payload: { chair_provider_id: "${chair_id}", assessment_protocol: "STANDARDIZED" }
              as: ChildFindCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${ecse_id}", domain: "COMMUNICATION", method: "STANDARDIZED", window_start_utc: "2026-08-10T09:00:00Z", window_end_utc: "2026-08-10T10:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_comm_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${ecse_id}", domain: "COGNITIVE", method: "STANDARDIZED", window_start_utc: "2026-08-10T10:00:00Z", window_end_utc: "2026-08-10T11:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_cog_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${ecse_id}", domain: "ADAPTIVE", method: "STANDARDIZED", window_start_utc: "2026-08-10T11:00:00Z", window_end_utc: "2026-08-10T12:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_adap_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${sw_id}", domain: "SOCIAL_EMOTIONAL", method: "STANDARDIZED", window_start_utc: "2026-08-10T09:00:00Z", window_end_utc: "2026-08-10T10:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_se_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${ot_id}", domain: "PHYSICAL_MOTOR", method: "STANDARDIZED", window_start_utc: "2026-08-10T09:00:00Z", window_end_utc: "2026-08-10T10:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_pm_id: "$.data.id" }
            - call: "POST /child-find/domain-assessments/${da_comm_id}/completion"
              payload: { age_equivalent_months: 24, standard_score: 68 }
              as: Evaluator
              as_user_id: "${ecse_id}"
            - call: "POST /child-find/domain-assessments/${da_cog_id}/completion"
              payload: { age_equivalent_months: 23, standard_score: 66 }
              as: Evaluator
              as_user_id: "${ecse_id}"
            - call: "POST /child-find/domain-assessments/${da_adap_id}/completion"
              payload: { age_equivalent_months: 34, standard_score: 95 }
              as: Evaluator
              as_user_id: "${ecse_id}"
            - call: "POST /child-find/domain-assessments/${da_se_id}/completion"
              payload: { age_equivalent_months: 33, standard_score: 92 }
              as: Evaluator
              as_user_id: "${sw_id}"
            - call: "POST /child-find/domain-assessments/${da_pm_id}/completion"
              payload: { age_equivalent_months: 30, standard_score: 84 }
              as: Evaluator
              as_user_id: "${ot_id}"
            - call: "POST /child-find/evaluation-cases/${case_id}/report"
              payload: { report_narrative_summary: "Significant delays in communication and cognition." }
              as: EvaluationChair
              as_user_id: "${chair_id}"
              captures: { case_version: "$.data.version" }
            - call: "POST /child-find/evaluation-cases/${case_id}/service-plans"
              payload: { eligibility_decision: "ELIGIBLE", expected_evaluation_case_version: "${case_version}", disability_category: "DEVELOPMENTAL_DELAY", setting: "COMMUNITY_PRESCHOOL", community_site_id: "${site1_id}" }
              as: PlacementAdministrator
              captures: { plan_id: "$.data.id" }
            - call: "POST /child-find/service-plans/${plan_id}/service-lines"
              payload: { discipline: "SLP", weekly_minutes: 150, delivery_model: "DIRECT" }
              as: PlacementAdministrator
              captures: { line1_id: "$.data.id" }
            - call: "GET /child-find/providers/${slp_id}"
              payload: {}
              as: PlacementAdministrator
              captures: { slp_version: "$.data.version" }
            - call: "POST /child-find/service-lines/${line1_id}/staff"
              payload: { provider_id: "${slp_id}", expected_provider_version: "${slp_version}" }
              as: PlacementAdministrator
          trigger:
            - call: "GET /child-find/providers/${slp_id}/caseload"
              payload: {}
              as: PlacementAdministrator
          assert:
            - "caseload.direct_weekly_service_minutes == 150"
            - "caseload.distinct_site_count == 1"
            - "caseload.travel_tier_pct == 0.05"
            - "caseload.travel_overhead_minutes == 10"
            - "caseload.assigned_weekly_service_minutes == 160"
            - "caseload.committed_weekly_minutes == 0"
            - "caseload.service_capacity_posture == \"OPEN\""
            - "Provider.${slp_id}.assigned_weekly_service_minutes == 160"
            - "ServicePlan.${plan_id}.status == \"DRAFT\""

      - name: eligibility_composite_play_based_inclusive_vs_standardized_strict
        grounds:
          - calculations.evaluation_composite_delay_profile
          - calculations.domain_percent_delay
          - entities.EvaluationCase.fields.assessment_protocol
          - entities.EvaluationCase.fields.composite_eligibility_recommendation
          - entities.DomainAssessment.fields.weighted_percent_delay
        distinguishing_aspect: |
          On one identical set of five COMPLETED assessments at chronological age
          33 months, PLAY_BASED_INCLUSIVE admits the play-based and observation
          results at weight 0.9 and reaches ELIGIBLE_RECOMMENDED with
          qualifying_domain_count 2 and max 30.0, while STANDARDIZED_STRICT keeps
          only the single STANDARDIZED result and reaches
          NOT_ELIGIBLE_RECOMMENDED with qualifying_domain_count 0 and max 21.2.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One child born 2023-11-01 with a consent-granted referral; every assessment window starts 2026-08-10, so chronological_age_months is 33 for all five."
            - "Evaluation case with assessment_protocol PLAY_BASED, chaired by a SCHOOL_PSYCHOLOGIST who is not an evaluator on it."
            - "Five COMPLETED assessments: COMMUNICATION PLAY_BASED ae 22, SOCIAL_EMOTIONAL PLAY_BASED ae 23, COGNITIVE STANDARDIZED ae 26, PHYSICAL_MOTOR OBSERVATION ae 30, ADAPTIVE PARENT_REPORT ae 28."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/providers"
              payload: { full_name: "Dana Chair", discipline: "SCHOOL_PSYCHOLOGIST", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { chair_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Eli ECSE", discipline: "ECSE_TEACHER", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { ecse_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Sam Social", discipline: "SOCIAL_WORKER", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { sw_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Omar OT", discipline: "OT", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { ot_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Ana", last_name: "Reyes", date_of_birth: "2023-11-01", guardian_full_name: "Marta Reyes", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${child_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referral_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referral_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
              captures: { consent_id: "$.data.id" }
            - call: "POST /child-find/consent-records/${consent_id}/decision"
              payload: { decision: "GRANTED" }
              as: Parent
              as_user_id: "${child_id}"
            - call: "POST /child-find/referrals/${referral_id}/evaluation-cases"
              payload: { chair_provider_id: "${chair_id}", assessment_protocol: "PLAY_BASED" }
              as: ChildFindCoordinator
              captures: { case_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${ecse_id}", domain: "COMMUNICATION", method: "PLAY_BASED", window_start_utc: "2026-08-10T09:00:00Z", window_end_utc: "2026-08-10T10:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_comm_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${ecse_id}", domain: "COGNITIVE", method: "STANDARDIZED", window_start_utc: "2026-08-10T10:00:00Z", window_end_utc: "2026-08-10T11:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_cog_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${ecse_id}", domain: "ADAPTIVE", method: "PARENT_REPORT", window_start_utc: "2026-08-10T11:00:00Z", window_end_utc: "2026-08-10T12:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_adap_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${sw_id}", domain: "SOCIAL_EMOTIONAL", method: "PLAY_BASED", window_start_utc: "2026-08-10T09:00:00Z", window_end_utc: "2026-08-10T10:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_se_id: "$.data.id" }
            - call: "POST /child-find/evaluation-cases/${case_id}/domain-assessments"
              payload: { evaluator_provider_id: "${ot_id}", domain: "PHYSICAL_MOTOR", method: "OBSERVATION", window_start_utc: "2026-08-10T09:00:00Z", window_end_utc: "2026-08-10T10:00:00Z" }
              as: ChildFindCoordinator
              captures: { da_pm_id: "$.data.id" }
            - call: "POST /child-find/domain-assessments/${da_comm_id}/completion"
              payload: { age_equivalent_months: 22 }
              as: Evaluator
              as_user_id: "${ecse_id}"
            - call: "POST /child-find/domain-assessments/${da_cog_id}/completion"
              payload: { age_equivalent_months: 26, standard_score: 74 }
              as: Evaluator
              as_user_id: "${ecse_id}"
            - call: "POST /child-find/domain-assessments/${da_adap_id}/completion"
              payload: { age_equivalent_months: 28 }
              as: Evaluator
              as_user_id: "${ecse_id}"
            - call: "POST /child-find/domain-assessments/${da_se_id}/completion"
              payload: { age_equivalent_months: 23 }
              as: Evaluator
              as_user_id: "${sw_id}"
            - call: "POST /child-find/domain-assessments/${da_pm_id}/completion"
              payload: { age_equivalent_months: 30 }
              as: Evaluator
              as_user_id: "${ot_id}"
          trigger:
            - call: "GET /child-find/evaluation-cases/${case_id}/eligibility-profile"
              payload: {}
              as: EvaluationChair
              as_user_id: "${chair_id}"
          assert:
            - "eligibility_profile.pinned_variant == \"PLAY_BASED_INCLUSIVE\""
            - "eligibility_profile.completed_domain_count == 5"
            - "eligibility_profile.play_based_inclusive_qualifying_domain_count == 2"
            - "eligibility_profile.play_based_inclusive_max_weighted_percent_delay == 30.0"
            - "eligibility_profile.play_based_inclusive_recommendation == \"ELIGIBLE_RECOMMENDED\""
            - "eligibility_profile.standardized_strict_qualifying_domain_count == 0"
            - "eligibility_profile.standardized_strict_max_weighted_percent_delay == 21.2"
            - "eligibility_profile.standardized_strict_recommendation == \"NOT_ELIGIBLE_RECOMMENDED\""
            - "eligibility_profile.composite_eligibility_recommendation == \"ELIGIBLE_RECOMMENDED\""
            - "DomainAssessment.${da_comm_id}.percent_delay == 33.3"
            - "DomainAssessment.${da_comm_id}.weighted_percent_delay == 30.0"
            - "DomainAssessment.${da_se_id}.weighted_percent_delay == 27.3"
            - "DomainAssessment.${da_cog_id}.weighted_percent_delay == 21.2"
            - "DomainAssessment.${da_pm_id}.weighted_percent_delay == 8.2"
            - "DomainAssessment.${da_adap_id}.weighted_percent_delay == null"
            - "EvaluationCase.${case_id}.status == \"DOMAINS_COMPLETE\""
            - "EvaluationCase.${case_id}.recommended_weekly_minutes == 100"

  - rule_id: combinatorial_formula
    instances:

      - name: service_minutes_ceil_per_line_then_sum_not_sum_then_ceil
        grounds:
          - calculations.service_minutes_recommendation
          - calculations.evaluation_composite_delay_profile
          - entities.EvaluationCase.fields.recommended_weekly_minutes
          - state_machines.EvaluationCase.IN_PROGRESS_to_DOMAINS_COMPLETE
        distinguishing_aspect: |
          Two qualifying domains both land in the SIGNIFICANT severity band and
          both produce a raw 57.5 minutes, so rounding each line up to a
          multiple of 5 first and then summing gives 120, while summing the raw
          values first and rounding once gives 115; the pinned order is
          per-line-then-sum and recommended_weekly_minutes must be 120.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One child born 2023-08-01; every assessment window starts 2026-08-10, so chronological_age_months is 36."
            - "Evaluation case with assessment_protocol STANDARDIZED, all five domains assessed by the STANDARDIZED method and COMPLETED."
            - "Age equivalents: COMMUNICATION 24 (33.3%), COGNITIVE 23 (36.1%), PHYSICAL_MOTOR 30 (16.7%), SOCIAL_EMOTIONAL 33 (8.3%), ADAPTIVE 34 (5.6%), so exactly two domains qualify and both sit in the [33.0, 50.0) band."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
            - call: "POST /child-find/community-sites"
              payload: { name: "Maple Partner Center", region_code: "R-2", licensed_capacity: 30, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: false, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site2_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Dana Chair", discipline: "SCHOOL_PSYCHOLOGIST", home_region_code: "R-1" }
              as: DistrictAdmin
              captures: { chair_id: "$.data.id" }
            - call: "POST /child-find/providers"
              payload: { full_name: "Eli ECSE", discipline: "ECSE_TEACHER", home_region_code: "R-1" }
              as: DistrictAdmin
