scenario: |
  2762. Police Professional Standards & Early Intervention (police internal affairs and
  risk management): complaint intake from public, supervisors and anonymous channels with
  classification and routing, investigation assignment, interview procedures and officer
  rights under collective bargaining and state law, disposition categories with
  preponderance standards and discipline matrix application, appeal through arbitration or
  civil service with reinstatement handling, early intervention system thresholds across
  use-of-force, complaints, pursuits and sick leave patterns, non-disciplinary intervention
  plans with supervisor monitoring, public reporting on complaint outcomes and demographic
  analysis, records retention and disclosure obligations for officer credibility

domain_name: police-professional-standards
api_prefix: ""          # endpoints are declared at the root; no shared collection prefix

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: graph
  # Officer is self-referential through Allegation.subject_officer_id,
  # Investigation.assigned_investigator_officer_id and
  # InterventionPlan.supervisor_officer_id; Complaint/Allegation/Discipline/Appeal form a
  # cross-aggregate chain that OfficerActivityEvent feeds back into.
  state_machine_shape: cyclic
  # Investigation TOLLED loop and PENDING_REVIEW->IN_PROGRESS revision loop,
  # InterviewSession SCHEDULED->POSTPONED->SCHEDULED loop,
  # EarlyInterventionAlert ESCALATED->PLAN_REQUIRED loop, plus parallel
  # employment_status x eis_alert_level dimensions on Officer.
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Unit
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "Command unit display name"
      - name: unit_role
        type: enum
        source: input
        description: "Functional role of the unit; drives complaint routing"
        constraints: "one of INTERNAL_AFFAIRS, PATROL_DIVISION, SPECIAL_OPERATIONS"
      - name: command_code
        type: string
        source: input
        description: "Bureau command code, unique across units"
      - name: peer_group_code
        type: string
        source: input
        description: "Peer-comparison cohort code; PEER_RELATIVE EIS scoring pools all units sharing this code"
      - name: sworn_headcount
        type: integer
        source: input
        description: "Number of sworn positions; ranking key for INTERNAL_AFFAIRS routing"
        constraints: ">= 1"
      - name: intake_enabled
        type: boolean
        source: input
        default: true
        description: "When false the unit is not an eligible routing target"

  - name: Officer
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the officer's assigned command unit"
      - name: badge_number
        type: string
        source: input
        description: "Departmental badge number, unique across officers"
      - name: full_name
        type: string
        source: input
        description: "Officer full name"
      - name: rank
        type: enum
        source: input
        description: "Civil-service rank"
        constraints: "one of OFFICER, SERGEANT, LIEUTENANT, CAPTAIN"
      - name: assignment_type
        type: enum
        source: input
        description: "Duty assignment; selects the EIS exposure multiplier"
        constraints: "one of PATROL, INVESTIGATIVE, ADMIN"
      - name: is_investigator
        type: boolean
        source: input
        default: false
        description: "True when the officer is eligible to carry internal investigations"
      - name: certification_level
        type: integer
        source: input
        default: 0
        description: "Internal-affairs certification level; must meet the classification requirement to be assigned"
        constraints: "0..3"
      - name: max_case_load
        type: integer
        source: input
        default: 5
        description: "Maximum number of open investigations this officer may hold at any one time"
        constraints: ">= 0"
      - name: annual_salary_cents
        type: integer
        source: input
        description: "Annual base salary in cents; back-pay basis on reinstatement"
        constraints: ">= 0"
      - name: demographic_code
        type: enum
        source: input
        description: "Officer demographic cohort used in public reporting"
        constraints: "one of DG_A, DG_B, DG_C, DG_D"
      - name: hire_date
        type: datetime
        source: input
        description: "Date of hire, ISO 8601 UTC"
      - name: employment_status
        type: enum
        source: system
        default: ACTIVE
        description: "Employment state dimension; evolves independently of eis_alert_level"
        constraints: "one of ACTIVE, SUSPENDED, RELIEVED_OF_DUTY, SEPARATED"
      - name: eis_score
        type: number
        source: computed
        default: 0
        description: "Latest ROLLING_12M composite risk score, 2 decimal places"
      - name: eis_alert_level
        type: enum
        source: computed
        default: NONE
        description: "Risk state dimension derived from eis_score; evolves independently of employment_status"
        constraints: "one of NONE, WATCH, ALERT, CRITICAL"
      - name: open_case_load
        type: integer
        source: computed
        default: 0
        description: "Count of investigations assigned to this officer in status ASSIGNED, IN_PROGRESS, TOLLED or PENDING_REVIEW"
      - name: imposed_suspension_days_total
        type: integer
        source: computed
        default: 0
        description: "Conserved suspension-day ledger; sum of effective_days over this officer's disciplines in status IMPOSED, UPHELD or MODIFIED"
      - name: open_alert_count
        type: integer
        source: computed
        default: 0
        description: "Count of this officer's early-intervention alerts in status OPEN, PLAN_REQUIRED, PLAN_ACTIVE or ESCALATED"
      - name: intervention_escalation_count
        type: integer
        source: computed
        default: 0
        description: "Number of intervention plans for this officer that closed in ESCALATED"
      - name: credibility_disclosure_active
        type: boolean
        source: computed
        default: false
        description: "True when at least one CredibilityDisclosure for this officer is in status ACTIVE"
      - name: suspension_end_date
        type: datetime
        source: computed
        description: "Effective date plus imposed days when a discipline suspension is in force; null otherwise"

  - name: HearingRoom
    parent: null
    common_fields: false
    fields:
      - name: facility_code
        type: string
        source: input
        description: "Facility identifier"
      - name: room_name
        type: string
        source: input
        description: "Room display name"
      - name: concurrent_capacity
        type: integer
        source: input
        description: "Maximum number of interview sessions whose half-open intervals may overlap in this room"
        constraints: ">= 1"
      - name: recording_enabled
        type: boolean
        source: input
        default: true
        description: "Whether the room supports recorded interviews"

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: intake_channel
        type: enum
        source: input
        description: "Origin channel of the complaint"
        constraints: "one of PUBLIC, SUPERVISOR, ANONYMOUS"
      - name: complainant_name
        type: string
        source: input
        description: "Complainant name; MUST be omitted for ANONYMOUS intake"
      - name: complainant_contact
        type: string
        source: input
        description: "Complainant contact string; MUST be omitted for ANONYMOUS intake"
      - name: complainant_demographic_code
        type: enum
        source: input
        default: UNKNOWN
        description: "Complainant demographic cohort used in public reporting"
        constraints: "one of DG_A, DG_B, DG_C, DG_D, UNKNOWN"
      - name: narrative
        type: string
        source: input
        description: "Complaint narrative; redacted to null on purge"
      - name: incident_datetime
        type: datetime
        source: input
        description: "When the alleged conduct occurred; anchors the statute window and the FINAL discipline variant"
      - name: alleged_injury
        type: boolean
        source: input
        default: false
        description: "Whether physical injury is alleged; forces CLASS_I classification"
      - name: reported_allegation_types
        type: array
        source: input
        description: "Allegation types reported at intake; each member one of EXCESSIVE_FORCE, UNLAWFUL_SEARCH, UNTRUTHFULNESS, NEGLECT_OF_DUTY, PURSUIT_VIOLATION, DISCOURTESY"
        constraints: "non-empty array"
      - name: subject_unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit the complaint concerns; routing target for CLASS_II and CLASS_III"
      - name: reporting_supervisor_officer_id
        type: string
        source: input
        description: "FK -> Officer.id; required when intake_channel is SUPERVISOR, forbidden otherwise"
      - name: intake_sequence
        type: integer
        source: system
        description: "Monotonic intake counter starting at 1, incremented once per accepted intake"
      - name: intake_reference_code
        type: string
        source: system
        description: "Withdrawal credential formatted CMP-000123 from intake_sequence; null for ANONYMOUS intake"
      - name: classification
        type: enum
        source: computed
        description: "Severity classification computed at intake and on reclassification"
        constraints: "one of CLASS_I, CLASS_II, CLASS_III"
      - name: priority
        type: integer
        source: computed
        description: "Work priority 1 (highest) to 3, derived from classification and intake_channel"
        constraints: "1..3"
      - name: assigned_unit_id
        type: string
        source: computed
        description: "FK -> Unit.id; routing result of the classification rule"
      - name: screening_required
        type: boolean
        source: computed
        description: "True when an ANONYMOUS complaint classifies CLASS_III and must be screened before investigation"
      - name: statute_expires_at
        type: datetime
        source: computed
        description: "incident_datetime plus STATUTE_DAYS; intake after this instant is refused"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        constraints: "one of INTAKE_RECEIVED, SCREENING, CLASSIFIED, UNDER_INVESTIGATION, ADJUDICATION, CLOSED, REJECTED_INTAKE, WITHDRAWN, PURGED"
      - name: received_at
        type: datetime
        source: system
        description: "Logical clock instant at intake; anchors statutory investigation days"
      - name: closed_at
        type: datetime
        source: computed
        description: "Instant the complaint entered CLOSED, WITHDRAWN or REJECTED_INTAKE; anchors retention and public reporting"
      - name: retention_until
        type: datetime
        source: computed
        description: "closed_at plus the retention window of the governing disposition; null while open"
      - name: allegation_count
        type: integer
        source: computed
        default: 0
        description: "Count of Allegation rows on this complaint"
      - name: sustained_allegation_count
        type: integer
        source: computed
        default: 0
        description: "Count of this complaint's allegations whose disposition is SUSTAINED"
      - name: reclassification_count
        type: integer
        source: computed
        default: 0
        description: "Number of accepted reclassifications applied after the complaint reached CLASSIFIED"
      - name: purged_at
        type: datetime
        source: computed
        description: "Instant the complaint entered PURGED; null otherwise"

  - name: Allegation
    parent: Complaint
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; owning complaint"
      - name: subject_officer_id
        type: string
        source: input
        description: "FK -> Officer.id; the accused officer"
      - name: allegation_type
        type: enum
        source: input
        description: "Misconduct category"
        constraints: "one of EXCESSIVE_FORCE, UNLAWFUL_SEARCH, UNTRUTHFULNESS, NEGLECT_OF_DUTY, PURSUIT_VIOLATION, DISCOURTESY"
      - name: narrative
        type: string
        source: input
        description: "Allegation narrative; redacted to null on purge"
      - name: offense_class
        type: enum
        source: input
        description: "Discipline-matrix row supplied by the classifying commander; selects the MATRIX_BASE_DAYS row (A most severe, D least). Stored verbatim and copied onto the Discipline row."
        constraints: "one of A, B, C, D"
      - name: evidence_weight_for
        type: number
        source: system
        default: 0
        description: "Credible evidence weight supporting the allegation, 0.00..100.00, set by findings submission"
      - name: evidence_weight_against
        type: number
        source: system
        default: 0
        description: "Credible evidence weight rebutting the allegation, 0.00..100.00, set by findings submission"
      - name: policy_compliant
        type: boolean
        source: system
        description: "Findings flag that the conduct occurred but complied with policy; required for EXONERATED"
      - name: support_pct
        type: number
        source: computed
        default: 0
        description: "Share of the credible evidence that supports the allegation, per calculations.preponderance_evaluation: round_half_up(100 * evidence_weight_for / total_weight, 2), or 0.00 when total_weight is 0"
      - name: preponderance_met
        type: boolean
        source: computed
        description: "True when support_pct is strictly greater than PREPONDERANCE_THRESHOLD_PCT; the comparison is made on the rounded support_pct, not on the raw ratio"
      - name: disposition
        type: enum
        source: system
        default: PENDING
        description: "Adjudication result"
        constraints: "one of PENDING, SUSTAINED, NOT_SUSTAINED, UNFOUNDED, EXONERATED, POLICY_FAILURE, WITHDRAWN, OVERTURNED_ON_APPEAL"
      - name: disposed_at
        type: datetime
        source: computed
        description: "Logical clock instant the disposition was recorded; reference date of the PRESUMPTIVE discipline variant"
      - name: prior_sustained_count_at_disposition
        type: integer
        source: computed
        description: "Prior sustained allegations for the subject officer inside the PRESUMPTIVE look-back window"
      - name: redacted
        type: boolean
        source: computed
        default: false
        description: "True after the owning complaint is purged and the narrative is cleared"

  - name: Investigation
    parent: Complaint
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: system
        description: "FK -> Complaint.id; owning complaint"
      - name: assigned_investigator_officer_id
        type: string
        source: system
        description: "FK -> Officer.id; current assignee, null while UNASSIGNED"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        constraints: "one of UNASSIGNED, ASSIGNED, IN_PROGRESS, TOLLED, PENDING_REVIEW, CLOSED, VOIDED"
      - name: statutory_days
        type: integer
        source: computed
        description: "Statutory investigation window in days selected by the complaint classification"
      - name: tolled_days
        type: integer
        source: computed
        default: 0
        description: "Accumulated whole days of tolling; each RESUME adds floor((resumed_at - suspended_at) / 86400 seconds)"
      - name: due_at
        type: datetime
        source: computed
        description: "complaint.received_at plus statutory_days plus tolled_days"
      - name: overdue
        type: boolean
        source: computed
        default: false
        description: "True when the logical clock is strictly after due_at"
      - name: assignment_count
        type: integer
        source: computed
        default: 0
        description: "Number of accepted assignment writes, including reassignments"
      - name: interview_held_count
        type: integer
        source: computed
        default: 0
        description: "Count of this investigation's interview sessions in status HELD"
      - name: findings_submitted_at
        type: datetime
        source: computed
        description: "Instant findings were accepted; null before submission"
      - name: suspended_at
        type: datetime
        source: system
        description: "Instant the current tolling period began; null unless status is TOLLED"
      - name: required_certification_level
        type: integer
        source: computed
        description: "Minimum investigator certification_level required by the complaint classification"
      - name: closed_at
        type: datetime
        source: computed
        description: "Instant the investigation entered CLOSED or VOIDED"

  - name: InterviewSession
    parent: Investigation
    common_fields: true
    fields:
      - name: investigation_id
        type: string
        source: system
        description: "FK -> Investigation.id; owning investigation"
      - name: subject_officer_id
        type: string
        source: input
        description: "FK -> Officer.id; officer to be interviewed, must be a subject of an allegation on the owning complaint"
      - name: hearing_room_id
        type: string
        source: input
        description: "FK -> HearingRoom.id; room occupied by the session"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Session start, must be strictly after the logical clock"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Session end, must be strictly after scheduled_start"
      - name: notice_served_at
        type: datetime
        source: input
        description: "Instant written notice was served on the officer"
      - name: notice_hours
        type: number
        source: computed
        description: "Decimal hours from notice_served_at to scheduled_start, 2 decimal places"
      - name: representation_status
        type: enum
        source: input
        default: REP_REQUESTED
        description: "Collective-bargaining representation state for the session"
        constraints: "one of WAIVED, REP_REQUESTED, REP_PRESENT"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Lifecycle state"
        constraints: "one of SCHEDULED, HELD, POSTPONED, CANCELLED"
      - name: postpone_count
        type: integer
        source: computed
        default: 0
        description: "Number of accepted postponements on this session"
      - name: held_at
        type: datetime
        source: computed
        description: "Logical clock instant the session was held; null otherwise"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes from scheduled_start to scheduled_end"
      - name: interview_summary
        type: string
        source: system
        description: "Summary text captured when the session is held"

  - name: Discipline
    parent: null
    common_fields: true
    fields:
      - name: allegation_id
        type: string
        source: system
        description: "FK -> Allegation.id; sustained allegation that produced this discipline"
      - name: officer_id
        type: string
        source: system
        description: "FK -> Officer.id; disciplined officer"
      - name: offense_class
        type: enum
        source: computed
        description: "Discipline-matrix row copied from the allegation"
        constraints: "one of A, B, C, D"
      - name: aggravator_count
        type: integer
        source: input
        default: 0
        description: "Number of aggravating factors found at adjudication"
        constraints: "0..5"
      - name: mitigator_count
        type: integer
        source: input
        default: 0
        description: "Number of mitigating factors found at adjudication; only the first two earn credit"
        constraints: "0..5"
      - name: presumptive_prior_tier
        type: integer
        source: computed
        description: "Progressive-discipline tier index under the PRESUMPTIVE variant (look-back anchored on the allegation disposed_at); 0, 1 or 2 selects the MATRIX_BASE_DAYS element"
        constraints: "0..2"
      - name: presumptive_days
        type: integer
        source: computed
        description: "Suspension days under the PRESUMPTIVE variant, computed when the discipline is created"
      - name: final_prior_tier
        type: integer
        source: computed
        description: "Progressive-discipline tier index under the FINAL variant (look-back anchored on the impose-time logical clock, counting only priors whose Discipline reached IMPOSED, UPHELD or MODIFIED); null before imposition"
        constraints: "0..2"
      - name: final_days
        type: integer
        source: computed
        description: "Suspension days under the FINAL variant, computed at imposition; null before imposition"
      - name: effective_days
        type: integer
        source: computed
        default: 0
        description: "Days currently charged to the officer ledger: final_days while IMPOSED or UPHELD, appeal.modified_days while MODIFIED, 0 while PROPOSED or OVERTURNED"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Lifecycle state"
        constraints: "one of PROPOSED, IMPOSED, APPEALED, UPHELD, MODIFIED, OVERTURNED"
      - name: imposed_at
        type: datetime
        source: computed
        description: "Logical clock instant of imposition; anchors the appeal window and back-pay interest"
      - name: effective_date
        type: datetime
        source: input
        description: "First calendar day of the suspension, supplied at imposition"
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "imposed_at plus APPEAL_WINDOW_DAYS; appeals filed after this instant are refused"

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: discipline_id
        type: string
        source: system
        description: "FK -> Discipline.id; challenged discipline"
      - name: forum
        type: enum
        source: input
        description: "Appellate forum elected by the officer representative"
        constraints: "one of ARBITRATION, CIVIL_SERVICE"
      - name: grounds
        type: string
        source: input
        description: "Stated grounds for appeal"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical clock instant the appeal was filed"
      - name: days_to_file
        type: integer
        source: computed
        description: "Whole days from discipline.imposed_at to filed_at"
      - name: status
        type: enum
        source: system
        default: FILED
        description: "Lifecycle state"
        constraints: "one of FILED, HEARD, DECIDED"
      - name: outcome
        type: enum
        source: system
        default: PENDING
        description: "Decision result"
        constraints: "one of PENDING, UPHELD, MODIFIED, OVERTURNED"
      - name: modified_days
        type: integer
        source: system
        description: "Reduced suspension days when outcome is MODIFIED; null otherwise"
      - name: heard_at
        type: datetime
        source: computed
        description: "Instant the hearing was recorded"
      - name: decided_at
        type: datetime
        source: computed
        description: "Instant the decision was recorded"
      - name: hearing_notes
        type: string
        source: system
        description: "Notes captured at the hearing"

  - name: Reinstatement
    parent: Appeal
    common_fields: true
    fields:
      - name: appeal_id
        type: string
        source: system
        description: "FK -> Appeal.id; appeal decision that produced the reinstatement"
      - name: reversed_days
        type: integer
        source: computed
        description: "Suspension days reversed by the decision: final_days for OVERTURNED, final_days minus modified_days for MODIFIED"
      - name: gross_back_pay_cents
        type: integer
        source: computed
        description: "Back pay computed by rounding each pay period then summing"
      - name: interim_earnings_cents
        type: integer
        source: system
        default: 0
        description: "Outside earnings offset supplied at finalization"
      - name: net_back_pay_cents
        type: integer
        source: computed
        description: "gross_back_pay_cents minus interim_earnings_cents, floored at 0; null before finalization"
      - name: interest_cents
        type: integer
        source: computed
        description: "Simple interest on net_back_pay_cents; null before finalization"
      - name: total_award_cents
        type: integer
        source: computed
        description: "net_back_pay_cents plus interest_cents; null before finalization"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Lifecycle state"
        constraints: "one of PENDING, FINALIZED"
      - name: effective_date
        type: datetime
        source: computed
        description: "Logical clock instant the reinstatement was created"
      - name: finalized_at
        type: datetime
        source: computed
        description: "Logical clock instant of finalization; anchors the interest day count end"

  - name: OfficerActivityEvent
    parent: Officer
    common_fields: false
    fields:
      - name: officer_id
        type: string
        source: system
        description: "FK -> Officer.id; officer the event is attributed to"
      - name: event_type
        type: enum
        source: input
        description: "Activity indicator class"
        constraints: "one of USE_OF_FORCE, PURSUIT, SICK_LEAVE_DAY, COMPLAINT_INTAKE, COMPLAINT_SUSTAINED"
      - name: severity_code
        type: enum
        source: input
        default: NA
        description: "Force severity; multiplies the base weight"
        constraints: "one of LEVEL_1, LEVEL_2, LEVEL_3, NA"
      - name: occurred_at
        type: datetime
        source: input
        description: "When the activity occurred; may predate the logical clock"
      - name: source_reference
        type: string
        source: input
        description: "External report reference"
      - name: base_weight
        type: number
        source: computed
        description: "EVENT_BASE_WEIGHT for event_type times the severity multiplier"
      - name: weekday_index
        type: integer
        source: computed
        description: "Weekday of occurred_at in UTC, 0 for Monday through 6 for Sunday; drives sick-leave pattern detection"
        constraints: "0..6"
      - name: system_generated
        type: boolean
        source: computed
        default: false
        description: "True when the event was appended by a cascade rather than by a supervisor write"

  - name: EarlyInterventionAlert
    parent: null
    common_fields: true
    fields:
      - name: officer_id
        type: string
        source: system
        description: "FK -> Officer.id; officer under review"
      - name: trigger_source
        type: enum
        source: system
        description: "What produced the alert"
        constraints: "one of EVENT_INGEST, EIS_RUN, PLAN_ESCALATION, DISPOSITION_CASCADE"
      - name: composite_score
        type: number
        source: computed
        description: "Composite risk score at creation, 2 decimal places"
      - name: score_variant
        type: enum
        source: system
        description: "Which scoring variant produced composite_score"
        constraints: "one of ROLLING_12M, PEER_RELATIVE"
      - name: alert_level
        type: enum
        source: computed
        description: "Band of composite_score"
        constraints: "one of WATCH, ALERT, CRITICAL"
      - name: breached_indicators
        type: array
        source: computed
        description: "Indicator names at or over threshold at creation, in the fixed order FORCE_COUNT, PURSUIT_COUNT, COMPLAINT_COUNT, SICK_LEAVE_DAYS"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Lifecycle state"
        constraints: "one of OPEN, PLAN_REQUIRED, PLAN_ACTIVE, CLOSED_SUCCESS, ESCALATED, DISMISSED"
      - name: review_due_at
        type: datetime
        source: computed
        description: "Creation instant plus ALERT_REVIEW_DAYS"
      - name: dismissal_reason
        type: string
        source: system
        description: "Non-disciplinary dismissal rationale; null unless DISMISSED"
      - name: run_sequence
        type: integer
        source: system
        description: "EIS run that produced or promoted the alert; null for EVENT_INGEST and cascade alerts"
      - name: plan_count
        type: integer
        source: computed
        default: 0
        description: "Number of intervention plans created against this alert"

  - name: InterventionPlan
    parent: EarlyInterventionAlert
    common_fields: true
    fields:
      - name: alert_id
        type: string
        source: system
        description: "FK -> EarlyInterventionAlert.id; alert the plan answers"
      - name: officer_id
        type: string
        source: computed
        description: "FK -> Officer.id; copied from the alert"
      - name: supervisor_officer_id
        type: string
        source: input
        description: "FK -> Officer.id; supervisor accountable for monitoring"
      - name: required_checkin_count
        type: integer
        source: input
        description: "Number of monitoring check-ins the plan requires"
        constraints: "2..6"
      - name: duration_days
        type: integer
        source: input
        description: "Plan length in days"
        constraints: "one of 30, 60, 90"
      - name: interventions
        type: array
        source: input
        description: "Non-disciplinary measures; each member one of RETRAINING, COUNSELING, PEER_REVIEW, REASSIGNMENT, EAP_REFERRAL"
        constraints: "non-empty array"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Lifecycle state"
        constraints: "one of DRAFT, ACTIVE, CLOSED_SUCCESS, ESCALATED"
      - name: activated_at
        type: datetime
        source: computed
        description: "Logical clock instant of activation; anchors check-in due dates"
      - name: end_date
        type: datetime
        source: computed
        description: "activated_at plus duration_days"
      - name: completed_checkin_count
        type: integer
        source: computed
        default: 0
        description: "Count of this plan's check-ins in status COMPLETED"
      - name: on_time_checkin_count
        type: integer
        source: computed
        default: 0
        description: "Count of this plan's check-ins COMPLETED with completed_at at or before due_at"
      - name: concern_count
        type: integer
        source: computed
        default: 0
        description: "Count of this plan's check-ins whose outcome is CONCERN"
      - name: compliance_score
        type: number
        source: computed
        description: "Monitoring compliance score, 2 decimal places; null before closure evaluation"
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical clock instant of closure"

  - name: MonitoringCheckIn
    parent: InterventionPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> InterventionPlan.id; owning plan"
      - name: sequence_index
        type: integer
        source: computed
        description: "1-based position of the check-in inside the plan"
      - name: due_at
        type: datetime
        source: computed
        description: "activated_at plus floor(duration_days / (required_checkin_count + 1)) times sequence_index whole days, per calculations.checkin_schedule"
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical clock instant of completion; null while PENDING or MISSED"
      - name: outcome
        type: enum
        source: system
        default: PENDING
        description: "Supervisor finding at the check-in"
        constraints: "one of PENDING, SATISFACTORY, CONCERN"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Lifecycle state"
        constraints: "one of PENDING, COMPLETED, MISSED"
      - name: on_time
        type: boolean
        source: computed
        description: "True when completed_at is at or before due_at; null while PENDING"
      - name: notes
        type: string
        source: system
        description: "Supervisor notes recorded at completion"

  - name: CredibilityDisclosure
    parent: null
    common_fields: true
    fields:
      - name: officer_id
        type: string
        source: system
        description: "FK -> Officer.id; officer whose credibility is impaired"
      - name: source_allegation_id
        type: string
        source: system
        description: "FK -> Allegation.id; sustained allegation that created the obligation"
      - name: basis
        type: enum
        source: computed
        description: "Statutory basis of the disclosure obligation"
        constraints: "one of UNTRUTHFULNESS_SUSTAINED, BIAS_SUSTAINED, EVIDENCE_MISHANDLING_SUSTAINED"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Lifecycle state"
        constraints: "one of ACTIVE, EXPUNGED, EXPIRED"
      - name: retention_until
        type: datetime
        source: computed
        description: "Creation instant plus DISCLOSURE_RETENTION_DAYS; null when permanent_retention is true"
      - name: permanent_retention
        type: boolean
        source: computed
        description: "True when basis is UNTRUTHFULNESS_SUSTAINED; such records never expire and block purge of the owning complaint"
      - name: release_count
        type: integer
        source: computed
        default: 0
        description: "Number of releases logged to prosecuting agencies"
      - name: last_released_at
        type: datetime
        source: computed
        description: "Logical clock instant of the most recent release"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Complaint
    initial_state: INTAKE_RECEIVED
    terminal_states: [REJECTED_INTAKE, WITHDRAWN, PURGED]
    transitions:
      - from: INTAKE_RECEIVED
        to: SCREENING
        trigger: "system, immediately inside POST /complaints when screening_required is true"
        actor: system
        preconditions:
          - "classification computed as CLASS_III"
          - "intake_channel is ANONYMOUS"
        side_effects:
          - "sets screening_required true"
          - "sets assigned_unit_id to the INTERNAL_AFFAIRS routing target regardless of subject_unit_id"
          - "leaves intake_reference_code null because the channel is ANONYMOUS"
        note: "Anonymous minor complaints are screened for corroboration before any investigation exists."
      - from: INTAKE_RECEIVED
        to: CLASSIFIED
        trigger: "system, immediately inside POST /complaints when screening_required is false"
        actor: system
        preconditions:
          - "classification is CLASS_I or CLASS_II, or intake_channel is PUBLIC or SUPERVISOR"
        side_effects:
          - "sets classification, priority, assigned_unit_id per calculations.complaint_classification_and_routing"
          - "sets intake_sequence to the previous maximum plus 1 and intake_reference_code to CMP- plus the 6-digit zero-padded intake_sequence, except for ANONYMOUS intake where the code stays null"
          - "sets statute_expires_at to incident_datetime plus STATUTE_DAYS"
      - from: SCREENING
        to: CLASSIFIED
        trigger: "POST /complaints/{id}/classify with screening_outcome ACCEPT"
        actor: IACommander
        preconditions:
          - "complaint.status is SCREENING"
        side_effects:
          - "re-runs calculations.complaint_classification_and_routing with classification_override when supplied"
          - "sets screening_required false"
      - from: SCREENING
        to: REJECTED_INTAKE
        trigger: "POST /complaints/{id}/classify with screening_outcome REJECT"
        actor: IACommander
        preconditions:
          - "complaint.status is SCREENING"
          - "rejection_reason present"
        side_effects:
          - "sets closed_at to the logical clock"
          - "sets every allegation on the complaint to disposition WITHDRAWN"
          - "sets retention_until to closed_at plus RETENTION_DAYS_BY_DISPOSITION.WITHDRAWN"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /complaints/{id}/classify with screening_outcome ACCEPT and classification_override (reclassification self-loop)"
        actor: IACommander
        preconditions:
          - "complaint.status is CLASSIFIED or UNDER_INVESTIGATION"
          - "reclassification_count is strictly less than MAX_RECLASSIFICATIONS"
          - "classification_override differs from the current classification"
        side_effects:
          - "increments reclassification_count by 1"
          - "recomputes priority and assigned_unit_id from the new classification"
          - "cascade link 1: the complaint's Investigation recomputes statutory_days from the new classification, keeping accumulated tolled_days, and recomputes due_at and required_certification_level"
          - "cascade link 2: because required_certification_level rose above the current assignee certification_level, the Investigation is forced back to UNASSIGNED, assigned_investigator_officer_id is cleared and the former assignee open_case_load is decremented by 1"
        note: "Self-loop; the complaint keeps status CLASSIFIED, or keeps UNDER_INVESTIGATION when an investigation already exists."
      - from: CLASSIFIED
        to: UNDER_INVESTIGATION
        trigger: "POST /complaints/{id}/investigations"
        actor: IACommander
        preconditions:
          - "complaint.status is CLASSIFIED"
          - "no Investigation row exists with complaint_id equal to this complaint"
          - "allegation_count is at least 1"
        side_effects:
          - "creates Investigation in UNASSIGNED with statutory_days, due_at and required_certification_level from calculations.investigation_window"
      - from: UNDER_INVESTIGATION
        to: ADJUDICATION
        trigger: "POST /investigations/{id}/findings"
        actor: Investigator
        preconditions:
          - "the complaint's Investigation reached PENDING_REVIEW in the same request"
        side_effects:
          - "records evidence weights and policy_compliant on every allegation and recomputes preponderance_met"
      - from: ADJUDICATION
        to: CLOSED
        trigger: "POST /investigations/{id}/close"
        actor: IACommander
        preconditions:
          - "every allegation on the complaint has disposition other than PENDING"
          - "the complaint's Investigation is CLOSED in the same request"
        side_effects:
          - "sets closed_at to the logical clock"
          - "sets retention_until per calculations.retention_expiry_evaluation"
          - "recomputes sustained_allegation_count"
      - from: CLASSIFIED
        to: WITHDRAWN
        trigger: "POST /complaints/{id}/withdraw"
        actor: Complainant | Supervisor
        preconditions:
          - "intake_channel is PUBLIC or SUPERVISOR"
          - "supplied intake_reference_code equals complaint.intake_reference_code"
          - "sustained_allegation_count is 0"
        side_effects:
          - "sets closed_at to the logical clock and retention_until to closed_at plus RETENTION_DAYS_BY_DISPOSITION.WITHDRAWN"
          - "sets every PENDING allegation to disposition WITHDRAWN"
      - from: UNDER_INVESTIGATION
        to: WITHDRAWN
        trigger: "POST /complaints/{id}/withdraw"
        actor: Complainant | Supervisor
        preconditions:
          - "intake_channel is PUBLIC or SUPERVISOR"
          - "supplied intake_reference_code equals complaint.intake_reference_code"
          - "sustained_allegation_count is 0"
        side_effects:
          - "sets closed_at and retention_until as above and sets every PENDING allegation to disposition WITHDRAWN"
          - "cascade link 1: the complaint's Investigation moves to VOIDED and its closed_at is set"
          - "cascade link 2: because the Investigation became VOIDED, every InterviewSession on it in status SCHEDULED or POSTPONED moves to CANCELLED"
          - "cascade link 3: because the Investigation left an open status, the assignee open_case_load is decremented by 1"
      - from: ADJUDICATION
        to: WITHDRAWN
        trigger: "POST /complaints/{id}/withdraw"
        actor: Complainant | Supervisor
        preconditions:
          - "intake_channel is PUBLIC or SUPERVISOR"
          - "supplied intake_reference_code equals complaint.intake_reference_code"
          - "sustained_allegation_count is 0"
        side_effects:
          - "sets closed_at and retention_until as above and sets every PENDING allegation to disposition WITHDRAWN"
          - "cascade link 1: the complaint's Investigation moves from PENDING_REVIEW to VOIDED and its closed_at is set"
          - "cascade link 2: because the Investigation left an open status, the assignee open_case_load is decremented by 1"
        note: "A complainant may still withdraw after findings are filed, which is why the sustained_allegation_count guard does real work: once any allegation is SUSTAINED the file belongs to the discipline process and the withdrawal is refused with ERR_SUSTAINED_NOT_WITHDRAWABLE."
      - from: CLOSED
        to: PURGED
        trigger: "POST /complaints/{id}/purge"
        actor: RecordsCustodian
        preconditions:
          - "logical clock is at or after retention_until"
          - "no Appeal in status FILED or HEARD exists for any Discipline of this complaint's allegations"
          - "no CredibilityDisclosure in status ACTIVE references any allegation of this complaint"
          - "no allegation of this complaint has disposition SUSTAINED with allegation_type UNTRUTHFULNESS"
        side_effects:
          - "sets narrative, complainant_name and complainant_contact to null and complainant_demographic_code to UNKNOWN"
          - "sets every allegation narrative to null and redacted true"
          - "sets purged_at to the logical clock"
        note: "CredibilityDisclosure rows are never deleted by purge; the disclosure obligation outlives the complaint file."
      - from: WITHDRAWN
        to: PURGED
        trigger: "POST /complaints/{id}/purge"
        actor: RecordsCustodian
        preconditions:
          - "logical clock is at or after retention_until"
          - "no CredibilityDisclosure in status ACTIVE references any allegation of this complaint"
        side_effects:
          - "same redaction side effects as the CLOSED to PURGED transition"

  - entity: Investigation
    initial_state: UNASSIGNED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /investigations/{id}/assignments"
        actor: IACommander
        preconditions:
          - "expected_investigation_version equals investigation.version"
          - "the acting IACommander X-User-ID is not the selected investigator"
          - "the selected investigator satisfies calculations.investigator_selection eligibility"
        side_effects:
          - "sets assigned_investigator_officer_id and increments assignment_count by 1"
          - "increments the assignee Officer.open_case_load by 1"
          - "increments investigation.version by 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /investigations/{id}/assignments (reassignment self-loop)"
        actor: IACommander
        preconditions:
          - "expected_investigation_version equals investigation.version"
          - "the newly selected investigator differs from assigned_investigator_officer_id"
          - "the selected investigator satisfies calculations.investigator_selection eligibility"
        side_effects:
          - "decrements the previous assignee Officer.open_case_load by 1 and increments the new assignee Officer.open_case_load by 1, conserving the global caseload total"
          - "increments assignment_count by 1 and investigation.version by 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /investigations/{id}/interview-sessions (first accepted session) or POST /investigations/{id}/tolling with action RESUME"
        actor: Investigator
        preconditions:
          - "assigned_investigator_officer_id equals the acting X-User-ID"
        side_effects:
          - "no ledger change; open_case_load already counts ASSIGNED and IN_PROGRESS alike"
      - from: IN_PROGRESS
        to: TOLLED
        trigger: "POST /investigations/{id}/tolling with action SUSPEND"
        actor: Investigator | IACommander
        preconditions:
          - "investigation.status is IN_PROGRESS"
          - "tolling_reason present"
        side_effects:
          - "sets suspended_at to the logical clock"
      - from: TOLLED
        to: IN_PROGRESS
        trigger: "POST /investigations/{id}/tolling with action RESUME"
        actor: Investigator | IACommander
        preconditions:
          - "investigation.status is TOLLED"
        side_effects:
          - "adds floor((logical clock - suspended_at) / 86400 seconds) whole days to tolled_days, clears suspended_at and recomputes due_at"
        note: "Cycle: IN_PROGRESS -> TOLLED -> IN_PROGRESS may repeat; each pass accumulates tolled_days."
      - from: IN_PROGRESS
        to: PENDING_REVIEW
        trigger: "POST /investigations/{id}/findings"
        actor: Investigator
        preconditions:
          - "assigned_investigator_officer_id equals the acting X-User-ID"
          - "the owning complaint status is UNDER_INVESTIGATION"
          - "allegation_findings covers every allegation of the complaint exactly once"
          - "interview_held_count is at least 1"
        side_effects:
          - "sets findings_submitted_at, writes evidence weights and policy_compliant onto each allegation and recomputes preponderance_met"
          - "moves the owning Complaint to ADJUDICATION"
      - from: PENDING_REVIEW
        to: IN_PROGRESS
        trigger: "POST /investigations/{id}/tolling with action RESUME (returned for further investigation)"
        actor: IACommander
        preconditions:
          - "investigation.status is PENDING_REVIEW"
          - "no allegation of the complaint has a disposition other than PENDING"
        side_effects:
          - "clears findings_submitted_at and returns the owning Complaint to UNDER_INVESTIGATION"
        note: "Revision loop; findings must be resubmitted before the complaint can be adjudicated again."
      - from: PENDING_REVIEW
        to: CLOSED
        trigger: "POST /investigations/{id}/close"
        actor: IACommander
        preconditions:
          - "every allegation of the complaint has disposition other than PENDING"
        side_effects:
          - "sets closed_at, decrements the assignee Officer.open_case_load by 1 and moves the owning Complaint to CLOSED"
      - from: ASSIGNED
        to: VOIDED
        trigger: "system cascade from POST /complaints/{id}/withdraw"
        actor: system
        preconditions:
          - "the owning complaint moved to WITHDRAWN in the same request"
        side_effects:
          - "sets closed_at, decrements the assignee Officer.open_case_load by 1 and cancels SCHEDULED or POSTPONED interview sessions"
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "system cascade from POST /complaints/{id}/withdraw"
        actor: system
        preconditions:
          - "the owning complaint moved to WITHDRAWN in the same request"
        side_effects:
          - "sets closed_at, decrements the assignee Officer.open_case_load by 1 and cancels SCHEDULED or POSTPONED interview sessions"
      - from: PENDING_REVIEW
        to: VOIDED
        trigger: "system cascade from POST /complaints/{id}/withdraw"
        actor: system
        preconditions:
          - "the owning complaint moved from ADJUDICATION to WITHDRAWN in the same request"
        side_effects:
          - "sets closed_at, decrements the assignee Officer.open_case_load by 1 and leaves findings_submitted_at in place as the historical record"

  - entity: InterviewSession
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /interview-sessions/{id}/hold"
        actor: Investigator
        preconditions:
          - "session.status is SCHEDULED"
          - "notice_hours is at least MIN_NOTICE_HOURS"
          - "representation_status is WAIVED or REP_PRESENT"
          - "subject Officer.employment_status is ACTIVE, SUSPENDED or RELIEVED_OF_DUTY"
          - "logical clock is at or after scheduled_start"
        side_effects:
          - "sets held_at and interview_summary, increments investigation.interview_held_count by 1"
          - "moves the investigation from ASSIGNED to IN_PROGRESS when it is still ASSIGNED"
      - from: SCHEDULED
        to: POSTPONED
        trigger: "POST /interview-sessions/{id}/postpone"
        actor: Investigator | OfficerRepresentative
        preconditions:
          - "session.status is SCHEDULED"
          - "postpone_count is strictly less than MAX_POSTPONEMENTS"
        side_effects:
          - "increments postpone_count by 1 and clears the room and officer interval occupation held by the old times"
      - from: POSTPONED
        to: SCHEDULED
        trigger: "POST /interview-sessions/{id}/postpone (same request re-books the new times)"
        actor: Investigator | OfficerRepresentative
        preconditions:
          - "new_scheduled_start is strictly after the logical clock"
          - "the new interval clears calculations.officer_interview_buffer_overlap and calculations.room_capacity_overlap"
          - "recomputed notice_hours from new_notice_served_at is at least MIN_NOTICE_HOURS"
        side_effects:
          - "writes the new times, recomputes notice_hours and duration_minutes and re-occupies the room and officer intervals"
        note: "Postponement is a cycle: a single request performs SCHEDULED -> POSTPONED -> SCHEDULED, and the pair may repeat up to MAX_POSTPONEMENTS."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade from POST /complaints/{id}/withdraw via Investigation VOIDED"
        actor: system
        preconditions:
          - "the owning investigation moved to VOIDED in the same request"
        side_effects:
          - "releases the room and officer interval occupation"
      - from: POSTPONED
        to: CANCELLED
        trigger: "system cascade from POST /complaints/{id}/withdraw via Investigation VOIDED"
        actor: system
        preconditions:
          - "the owning investigation moved to VOIDED in the same request"
        side_effects:
          - "releases the room and officer interval occupation"

  - entity: Allegation
    initial_state: PENDING
    terminal_states: [NOT_SUSTAINED, UNFOUNDED, EXONERATED, POLICY_FAILURE, WITHDRAWN, OVERTURNED_ON_APPEAL]
    transitions:
      - from: PENDING
        to: SUSTAINED
        trigger: "POST /allegations/{id}/disposition with disposition SUSTAINED"
        actor: IACommander
        preconditions:
          - "owning complaint status is ADJUDICATION"
          - "the acting IACommander X-User-ID is not the investigation assigned_investigator_officer_id and is not the subject_officer_id"
          - "preponderance_met is true"
        side_effects:
          - "sets disposed_at, prior_sustained_count_at_disposition and increments complaint.sustained_allegation_count by 1"
          - "cascade link 1: creates a Discipline row in PROPOSED with offense_class copied from the allegation and presumptive_days from the PRESUMPTIVE variant"
          - "cascade link 2: because a sustained finding was recorded, appends a system_generated OfficerActivityEvent of type COMPLAINT_SUSTAINED with occurred_at equal to disposed_at"
          - "cascade link 3: because that event entered the rolling window, recomputes the subject officer eis_score and eis_alert_level"
          - "cascade link 4: because eis_alert_level rose above NONE, creates an EarlyInterventionAlert with trigger_source DISPOSITION_CASCADE and increments Officer.open_alert_count by 1"
          - "cascade link 5: when allegation_type is UNTRUTHFULNESS, creates a CredibilityDisclosure in ACTIVE with permanent_retention true and sets Officer.credibility_disclosure_active true"
      - from: PENDING
        to: NOT_SUSTAINED
        trigger: "POST /allegations/{id}/disposition with disposition NOT_SUSTAINED"
        actor: IACommander
        preconditions:
          - "owning complaint status is ADJUDICATION"
          - "the acting IACommander X-User-ID is not the investigation assigned_investigator_officer_id and is not the subject_officer_id"
        side_effects:
          - "sets disposed_at; no Discipline, no activity event and no disclosure are created"
        note: "Branch with divergent side-effect set: the SUSTAINED branch fires five cascade links, this branch fires none."
      - from: PENDING
        to: UNFOUNDED
        trigger: "POST /allegations/{id}/disposition with disposition UNFOUNDED"
        actor: IACommander
        preconditions:
          - "owning complaint status is ADJUDICATION"
          - "evidence_weight_for is exactly 0"
        side_effects:
          - "sets disposed_at only"
      - from: PENDING
        to: EXONERATED
        trigger: "POST /allegations/{id}/disposition with disposition EXONERATED"
        actor: IACommander
        preconditions:
          - "owning complaint status is ADJUDICATION"
          - "policy_compliant recorded true by findings"
        side_effects:
          - "sets disposed_at only"
      - from: PENDING
        to: POLICY_FAILURE
        trigger: "POST /allegations/{id}/disposition with disposition POLICY_FAILURE"
        actor: IACommander
        preconditions:
          - "owning complaint status is ADJUDICATION"
          - "policy_compliant recorded true by findings"
        side_effects:
          - "sets disposed_at only; the finding attaches to the policy, not the officer, so no Discipline is created"
      - from: PENDING
        to: WITHDRAWN
        trigger: "system cascade from POST /complaints/{id}/withdraw or from screening rejection"
        actor: system
        preconditions:
          - "the owning complaint moved to WITHDRAWN or REJECTED_INTAKE in the same request"
        side_effects:
          - "sets disposed_at to the complaint closed_at"
      - from: SUSTAINED
        to: OVERTURNED_ON_APPEAL
        trigger: "system cascade from POST /appeals/{id}/decide with outcome OVERTURNED"
        actor: system
        preconditions:
          - "the appeal decision overturned the Discipline created from this allegation"
        side_effects:
          - "decrements complaint.sustained_allegation_count by 1"
          - "cascade link: any CredibilityDisclosure whose source_allegation_id is this allegation moves to EXPUNGED"

  - entity: Discipline
    initial_state: PROPOSED
    terminal_states: [UPHELD, MODIFIED, OVERTURNED]
    transitions:
      - from: PROPOSED
        to: IMPOSED
        trigger: "POST /disciplines/{id}/impose"
        actor: IACommander
        preconditions:
          - "discipline.status is PROPOSED"
          - "the owning allegation disposition is SUSTAINED"
          - "the owning complaint status is ADJUDICATION or CLOSED"
          - "officer employment_status is not SEPARATED"
        side_effects:
          - "computes final_prior_tier and final_days under the FINAL variant and sets effective_days to final_days"
          - "sets imposed_at to the logical clock and appeal_deadline_at to imposed_at plus APPEAL_WINDOW_DAYS"
          - "adds final_days to Officer.imposed_suspension_days_total"
          - "moves Officer.employment_status from ACTIVE to SUSPENDED when final_days is at least 1 and sets suspension_end_date to effective_date plus final_days"
      - from: IMPOSED
        to: APPEALED
        trigger: "POST /disciplines/{id}/appeals"
        actor: OfficerRepresentative
        preconditions:
          - "discipline.status is IMPOSED"
          - "logical clock is at or before appeal_deadline_at"
        side_effects:
          - "creates the Appeal in FILED with days_to_file computed; the ledger is untouched while the appeal is pending"
      - from: APPEALED
        to: UPHELD
        trigger: "system cascade from POST /appeals/{id}/decide with outcome UPHELD"
        actor: system
        preconditions:
          - "appeal.status is HEARD"
        side_effects:
          - "leaves effective_days at final_days so Officer.imposed_suspension_days_total is unchanged"
      - from: APPEALED
        to: MODIFIED
        trigger: "system cascade from POST /appeals/{id}/decide with outcome MODIFIED"
        actor: system
        preconditions:
          - "appeal.status is HEARD"
          - "modified_days is at least 0 and strictly less than final_days"
        side_effects:
          - "sets effective_days to appeal.modified_days and adjusts Officer.imposed_suspension_days_total by modified_days minus final_days"
          - "cascade link: creates a Reinstatement with reversed_days equal to final_days minus modified_days"
      - from: APPEALED
        to: OVERTURNED
        trigger: "system cascade from POST /appeals/{id}/decide with outcome OVERTURNED"
        actor: system
        preconditions:
          - "appeal.status is HEARD"
        side_effects:
          - "sets effective_days to 0"
          - "cascade link 1: subtracts final_days from Officer.imposed_suspension_days_total, restoring the pre-imposition ledger value"
          - "cascade link 2: when the reversal brings Officer.imposed_suspension_days_total to exactly 0, Officer.employment_status returns from SUSPENDED to ACTIVE and suspension_end_date is cleared; when other imposed discipline still stands the officer remains SUSPENDED"
          - "cascade link 3: because the discipline was overturned, the source Allegation moves from SUSTAINED to OVERTURNED_ON_APPEAL, which in turn expunges its CredibilityDisclosure"
          - "cascade link 4: creates a Reinstatement in PENDING with reversed_days equal to final_days"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [DECIDED]
    transitions:
      - from: FILED
        to: HEARD
        trigger: "POST /appeals/{id}/hear"
        actor: AppealsOfficer
        preconditions:
          - "appeal.status is FILED"
        side_effects:
          - "sets heard_at and hearing_notes"
      - from: HEARD
        to: DECIDED
        trigger: "POST /appeals/{id}/decide"
        actor: AppealsOfficer
        preconditions:
          - "appeal.status is HEARD"
          - "when outcome is MODIFIED, modified_days is present, at least 0 and strictly less than discipline.final_days"
        side_effects:
          - "sets outcome, decided_at and modified_days and drives the Discipline branch for the chosen outcome"

  - entity: Reinstatement
    initial_state: PENDING
    terminal_states: [FINALIZED]
    transitions:
      - from: PENDING
        to: FINALIZED
        trigger: "POST /reinstatements/{id}/finalize"
        actor: AppealsOfficer
        preconditions:
          - "reinstatement.status is PENDING"
          - "interim_earnings_cents is at least 0"
        side_effects:
          - "sets interim_earnings_cents, net_back_pay_cents, interest_cents, total_award_cents and finalized_at per calculations.reinstatement_back_pay"

  - entity: EarlyInterventionAlert
    initial_state: OPEN
    terminal_states: [CLOSED_SUCCESS, DISMISSED]
    transitions:
      - from: OPEN
        to: PLAN_REQUIRED
        trigger: "system, at creation when alert_level is ALERT or CRITICAL, or during POST /eis-runs when the recomputed level rises to ALERT or CRITICAL"
        actor: system
        preconditions:
          - "composite_score is at least ALERT_LEVEL_THRESHOLDS.ALERT"
        side_effects:
          - "sets review_due_at to the creation or promotion instant plus ALERT_REVIEW_DAYS"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /eis-alerts/{id}/dismiss"
        actor: IACommander
        preconditions:
          - "alert.status is OPEN or PLAN_REQUIRED"
          - "dismissal_reason present"
        side_effects:
          - "sets dismissal_reason and decrements Officer.open_alert_count by 1"
      - from: PLAN_REQUIRED
        to: DISMISSED
        trigger: "POST /eis-alerts/{id}/dismiss"
        actor: IACommander
        preconditions:
          - "alert.status is PLAN_REQUIRED"
          - "plan_count is 0"
        side_effects:
          - "sets dismissal_reason and decrements Officer.open_alert_count by 1"
      - from: PLAN_REQUIRED
        to: PLAN_ACTIVE
        trigger: "POST /intervention-plans/{id}/activate"
        actor: Supervisor
        preconditions:
          - "a plan for this alert is in DRAFT and is being activated in the same request"
        side_effects:
          - "no ledger change; Officer.open_alert_count still counts this alert"
      - from: PLAN_ACTIVE
        to: CLOSED_SUCCESS
        trigger: "system cascade from POST /intervention-plans/{id}/close when the plan closes CLOSED_SUCCESS"
        actor: system
        preconditions:
          - "plan compliance_score is at least PLAN_SUCCESS_SCORE and no other alert was created for the officer during the plan window"
        side_effects:
          - "decrements Officer.open_alert_count by 1"
      - from: PLAN_ACTIVE
        to: ESCALATED
        trigger: "system cascade from POST /intervention-plans/{id}/close when the plan closes ESCALATED"
        actor: system
        preconditions:
          - "plan compliance_score is below PLAN_SUCCESS_SCORE or another alert was created for the officer during the plan window"
        side_effects:
          - "cascade link 1: the alert moves to ESCALATED and keeps counting toward Officer.open_alert_count"
          - "cascade link 2: because the alert escalated, Officer.intervention_escalation_count is incremented by 1 and Officer.eis_alert_level is raised one band, capped at CRITICAL"
      - from: ESCALATED
        to: PLAN_REQUIRED
        trigger: "POST /eis-alerts/{id}/intervention-plans (re-planning an escalated alert)"
        actor: Supervisor
        preconditions:
          - "alert.status is ESCALATED"
          - "expected_alert_version equals alert.version"
        side_effects:
          - "creates the replacement plan in DRAFT, increments plan_count by 1 and increments alert.version by 1"
        note: "Cycle: PLAN_REQUIRED -> PLAN_ACTIVE -> ESCALATED -> PLAN_REQUIRED, one revolution per failed plan."

  - entity: InterventionPlan
    initial_state: DRAFT
    terminal_states: [CLOSED_SUCCESS, ESCALATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /intervention-plans/{id}/activate"
        actor: Supervisor
        preconditions:
          - "plan.status is DRAFT"
          - "the acting Supervisor X-User-ID equals supervisor_officer_id"
          - "the owning alert status is PLAN_REQUIRED"
        side_effects:
          - "sets activated_at to the logical clock and end_date to activated_at plus duration_days"
          - "creates required_checkin_count MonitoringCheckIn rows in PENDING with due_at per calculations.checkin_schedule"
          - "moves the owning alert from PLAN_REQUIRED to PLAN_ACTIVE"
      - from: ACTIVE
        to: CLOSED_SUCCESS
        trigger: "POST /intervention-plans/{id}/close"
        actor: Supervisor | IACommander
        preconditions:
          - "plan.status is ACTIVE"
          - "no MonitoringCheckIn of the plan is still PENDING"
          - "compliance_score is at least PLAN_SUCCESS_SCORE"
          - "no EarlyInterventionAlert other than the plan's own alert was created for the officer with created_at inside the closed interval from activated_at to the logical clock"
        side_effects:
          - "sets compliance_score and closed_at and moves the owning alert to CLOSED_SUCCESS"
      - from: ACTIVE
        to: ESCALATED
        trigger: "POST /intervention-plans/{id}/close"
        actor: Supervisor | IACommander
        preconditions:
          - "plan.status is ACTIVE"
          - "no MonitoringCheckIn of the plan is still PENDING"
          - "compliance_score is below PLAN_SUCCESS_SCORE, or another alert was created for the officer inside the plan window"
        side_effects:
          - "sets compliance_score and closed_at"
          - "cascade link 1: the owning alert moves from PLAN_ACTIVE to ESCALATED"
          - "cascade link 2: because the alert escalated, Officer.intervention_escalation_count is incremented by 1 and Officer.eis_alert_level is raised one band, capped at CRITICAL"

  - entity: MonitoringCheckIn
    initial_state: PENDING
    terminal_states: [COMPLETED, MISSED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /check-ins/{id}/complete"
        actor: Supervisor
        preconditions:
          - "check-in status is PENDING"
          - "the acting Supervisor X-User-ID equals plan.supervisor_officer_id"
          - "the owning plan status is ACTIVE"
        side_effects:
          - "sets completed_at, outcome, notes and on_time (completed_at at or before due_at)"
          - "increments plan.completed_checkin_count, plan.on_time_checkin_count when on_time, and plan.concern_count when outcome is CONCERN"
      - from: PENDING
        to: MISSED
        trigger: "system sweep inside POST /eis-runs"
        actor: system
        preconditions:
          - "logical clock is strictly after due_at and the check-in is still PENDING"
          - "the owning plan status is ACTIVE"
        side_effects:
          - "records the miss; the plan on_time_checkin_count is unchanged so compliance_score falls"

  - entity: CredibilityDisclosure
    initial_state: ACTIVE
    terminal_states: [EXPUNGED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPUNGED
        trigger: "system cascade from POST /appeals/{id}/decide with outcome OVERTURNED"
        actor: system
        preconditions:
          - "the source allegation moved to OVERTURNED_ON_APPEAL in the same request"
        side_effects:
          - "recomputes Officer.credibility_disclosure_active over the officer's remaining ACTIVE disclosures"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep inside POST /eis-runs"
        actor: system
        preconditions:
          - "permanent_retention is false"
          - "logical clock is at or after retention_until"
        side_effects:
          - "recomputes Officer.credibility_disclosure_active over the officer's remaining ACTIVE disclosures"

  - entity: Officer
    initial_state: ACTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from POST /disciplines/{id}/impose when final_days is at least 1"
        actor: system
        preconditions:
          - "employment_status is ACTIVE"
        side_effects:
          - "sets suspension_end_date to effective_date plus final_days"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade from POST /appeals/{id}/decide with outcome OVERTURNED, or POST /officers/{id}/employment-status with ACTIVE"
        actor: system | SystemAdmin
        preconditions:
          - "employment_status is SUSPENDED"
          - "on the appeal cascade path, imposed_suspension_days_total is exactly 0 after the reversal"
        side_effects:
          - "clears suspension_end_date"
      - from: ACTIVE
        to: RELIEVED_OF_DUTY
        trigger: "POST /officers/{id}/employment-status with RELIEVED_OF_DUTY"
        actor: SystemAdmin
        preconditions:
          - "employment_status is ACTIVE or SUSPENDED"
        side_effects:
          - "the officer remains interviewable and remains an eligible discipline subject"
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /officers/{id}/employment-status with SEPARATED"
        actor: SystemAdmin
        preconditions:
          - "employment_status is not SEPARATED"
        side_effects:
          - "the officer stops being an eligible investigator candidate and stops being interviewable"
          - "open investigations assigned to the officer are left untouched; the caseload ledger is unchanged"
        note: "employment_status is one of two independent state dimensions on Officer; eis_alert_level evolves on its own axis and a SEPARATED officer keeps accumulating EIS history for reporting."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assignment-create-stale-investigation
    parent_entity: Investigation
    write_endpoint: "POST /investigations/{id}/assignments"
    occ_field: "expected_investigation_version"
    description: |
      Assigning an investigator to an Investigation whose version has advanced since the
      client last observed it is rejected. Reassignment is legitimate under the ASSIGNED to
      ASSIGNED self-loop, so a write carrying a stale version would otherwise silently
      supersede an assignment the client never saw and would double-count the caseload
      ledger.
    error_id: ERR_STALE_INVESTIGATION_VERSION
    http_status: 412
  - rule_id: plan-create-stale-alert
    parent_entity: EarlyInterventionAlert
    write_endpoint: "POST /eis-alerts/{id}/intervention-plans"
    occ_field: "expected_alert_version"
    description: |
      Creating an InterventionPlan against an EarlyInterventionAlert whose version has
      advanced since the client last observed it is rejected. Re-planning an ESCALATED alert
      legitimately supersedes the failed plan, so a stale-version write would attach a second
      DRAFT plan to an alert state the client has not observed.
    error_id: ERR_STALE_ALERT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# ---------------------------------------------------------------------------
calculations:
  - name: complaint_classification_and_routing
    applies_to: Complaint
    algorithm_type: threshold
    trigger: "POST /complaints, and again on POST /complaints/{id}/classify"
    constants:
      SEVERE_ALLEGATION_TYPES: [EXCESSIVE_FORCE, UNLAWFUL_SEARCH, UNTRUTHFULNESS]
      MODERATE_ALLEGATION_TYPES: [NEGLECT_OF_DUTY, PURSUIT_VIOLATION]
      MINOR_ALLEGATION_TYPES: [DISCOURTESY]
      PRIORITY_BY_CLASSIFICATION: {CLASS_I: 1, CLASS_II: 2, CLASS_III: 3}
      MAX_RECLASSIFICATIONS: 2
    formula: |
      Inputs: reported_allegation_types (list of allegation_type strings, order irrelevant),
      alleged_injury (boolean), intake_channel, subject_unit_id, and on the classify endpoint an
      optional classification_override.

      Step 1 - severity band, evaluated top to bottom, first match wins:
        (a) classification = CLASS_I when alleged_injury is true, or when at least one reported
            allegation_type is in SEVERE_ALLEGATION_TYPES.
        (b) classification = CLASS_II when at least one reported allegation_type is in
            MODERATE_ALLEGATION_TYPES.
        (c) classification = CLASS_III otherwise (only MINOR_ALLEGATION_TYPES present).

      Step 2 - classification_override: on POST /complaints/{id}/classify, when
      classification_override is supplied and differs from the computed or stored value, the
      override replaces the Step 1 result. The override never bypasses Step 1; Step 1 still runs
      so that the stored value is defined when no override is sent.

      Step 3 - priority = PRIORITY_BY_CLASSIFICATION[classification].

      Step 4 - screening_required = (classification == CLASS_III AND intake_channel ==
      "ANONYMOUS"). All other combinations yield false.

      Step 5 - routing target assigned_unit_id, evaluated top to bottom, first match wins:
        (a) when classification is CLASS_I, or screening_required is true, the target is the
            Unit whose unit_role is INTERNAL_AFFAIRS with the smallest created_at; the subject
            unit never investigates a Class I complaint.
        (b) otherwise, when the Unit identified by subject_unit_id has intake_enabled true, the
            target is subject_unit_id.
        (c) otherwise the target is the INTERNAL_AFFAIRS Unit with the smallest created_at.
      Empty-pool fallback: when no Unit with unit_role INTERNAL_AFFAIRS exists, the request is
      rejected with ERR_NO_INTAKE_UNIT (422).
    precision: "priority and classification are exact enum or integer values; no rounding"
    examples:
      - input: "reported_allegation_types [DISCOURTESY], alleged_injury false, intake_channel ANONYMOUS"
        output: "classification CLASS_III, priority 3, screening_required true, status SCREENING, intake_reference_code null"
      - input: "reported_allegation_types [PURSUIT_VIOLATION], alleged_injury false, intake_channel PUBLIC, subject unit intake_enabled true"
        output: "classification CLASS_II, priority 2, screening_required false, assigned_unit_id equal to subject_unit_id, status CLASSIFIED"
      - input: "reported_allegation_types [NEGLECT_OF_DUTY], alleged_injury true, intake_channel SUPERVISOR, subject unit intake_enabled true"
        output: "classification CLASS_I (injury outranks the moderate allegation), priority 1, assigned_unit_id equal to the INTERNAL_AFFAIRS unit, not the subject unit"

  - name: investigation_window
    applies_to: Investigation
    algorithm_type: chronological
    trigger: "POST /complaints/{id}/investigations, POST /investigations/{id}/tolling with action RESUME, and reclassification via POST /complaints/{id}/classify"
    constants:
      STATUTORY_DAYS_BY_CLASSIFICATION: {CLASS_I: 180, CLASS_II: 121, CLASS_III: 90}
      REQUIRED_CERTIFICATION_BY_CLASSIFICATION: {CLASS_I: 3, CLASS_II: 2, CLASS_III: 1}
      STATUTE_DAYS: 365
    formula: |
      statutory_days = STATUTORY_DAYS_BY_CLASSIFICATION[complaint.classification]
      required_certification_level = REQUIRED_CERTIFICATION_BY_CLASSIFICATION[complaint.classification]
      due_at = complaint.received_at + (statutory_days + tolled_days) whole days
      overdue = (logical clock > due_at) AND status is not CLOSED and not VOIDED

      Tolling accrual on RESUME: elapsed_days = floor((logical clock - suspended_at) /
      86400 seconds), i.e. whole days only, partial days are discarded. tolled_days is
      incremented by elapsed_days and due_at is recomputed from received_at, never from the
      previous due_at, so repeated tolling cycles cannot drift.

      Reclassification: statutory_days and required_certification_level are recomputed from the
      new classification while the accumulated tolled_days is preserved, then due_at is
      recomputed from received_at.

      Complaint.statute_expires_at = incident_datetime + STATUTE_DAYS whole days. This is the
      independent statute of limitations on filing, separate from the investigation due date.
    precision: "whole days only; floor on partial tolling days; all timestamps ISO-8601 UTC with second precision"
    examples:
      - input: "CLASS_I complaint received_at 2026-09-01T00:00:00Z, tolled_days 0"
        output: "statutory_days 180, required_certification_level 3, due_at 2027-02-28T00:00:00Z"
      - input: "CLASS_II complaint received_at 2026-09-01T00:00:00Z, tolled_days 0"
        output: "statutory_days 121, required_certification_level 2, due_at 2026-12-31T00:00:00Z"
      - input: "the same CLASS_I complaint after suspended_at 2026-09-10T00:00:00Z and RESUME at 2026-09-17T06:00:00Z"
        output: "elapsed_days floor(7.25) = 7, tolled_days 7, due_at 2027-03-07T00:00:00Z"

  - name: investigator_selection
    applies_to: Investigation
    algorithm_type: aggregation
    trigger: "POST /investigations/{id}/assignments when the request omits investigator_officer_id"
    constants:
      CASE_LOAD_HEADROOM: 1
    formula: |
      Eligibility filter - an Officer is a candidate when all of the following hold:
        (1) is_investigator is true
        (2) employment_status is ACTIVE
        (3) certification_level is at least investigation.required_certification_level
        (4) open_case_load + CASE_LOAD_HEADROOM is at most max_case_load, i.e.
            open_case_load < max_case_load
        (5) the officer is not the subject_officer_id of any allegation on the complaint
        (6) the officer unit_id differs from every subject officer unit_id on the complaint
        (7) the officer id differs from the acting IACommander X-User-ID
        (8) the officer id differs from the current assigned_investigator_officer_id

      Ranking expression, applied to the eligible pool in this exact order:
        key 1 ascending: open_case_load
        key 2 descending: certification_level
        key 3 ascending: badge_number (lexicographic byte order)
        key 4 ascending: created_at
      The first row after this sort is selected. badge_number is unique so key 4 is a
      belt-and-braces fallback and is never reached in practice.

      Empty-pool fallback: when the eligible pool is empty the request is rejected with
      ERR_NO_ELIGIBLE_INVESTIGATOR (422); the Investigation stays in its current state and no
      caseload ledger change occurs.

      Explicit investigator_officer_id: when the request supplies investigator_officer_id, the
      selector is skipped but conditions (1) through (8) are still enforced individually and each
      failure maps to its own error rather than to ERR_NO_ELIGIBLE_INVESTIGATOR.
    precision: "integer comparisons only"
    examples:
      - input: "pool of three eligible investigators with open_case_load 2, 1, 1 and certification_level 3, 2, 3"
        output: "the third officer wins: lowest open_case_load 1 ties with the second, then higher certification_level 3 breaks the tie"
      - input: "every is_investigator officer has open_case_load equal to max_case_load"
        output: "ERR_NO_ELIGIBLE_INVESTIGATOR (422), investigation stays UNASSIGNED"

  - name: officer_interview_buffer_overlap
    applies_to: InterviewSession
    algorithm_type: interval_merge
    trigger: "POST /investigations/{id}/interview-sessions and POST /interview-sessions/{id}/postpone"
    constants:
      OFFICER_REST_BUFFER_MINUTES: 60
    formula: |
      The candidate interval for the subject officer is the closed interval
        [new_scheduled_start - OFFICER_REST_BUFFER_MINUTES, new_scheduled_end + OFFICER_REST_BUFFER_MINUTES]
      Each existing InterviewSession of the same subject_officer_id in status SCHEDULED or
      POSTPONED contributes its own closed interval [scheduled_start, scheduled_end].

      Two closed intervals [a1,a2] and [b1,b2] conflict when a1 <= b2 AND b1 <= a2. Because the
      buffered interval is closed on both ends, a gap of exactly OFFICER_REST_BUFFER_MINUTES
      between the end of one session and the start of the next is a conflict; a gap of
      OFFICER_REST_BUFFER_MINUTES + 1 minute is accepted. HELD and CANCELLED sessions never
      contribute an interval.

      A conflict is rejected with ERR_OFFICER_REST_BUFFER_CONFLICT (409).
    precision: "minute resolution; buffer arithmetic in whole minutes"
    examples:
      - input: "existing SCHEDULED session 2026-08-10T09:00:00Z to 2026-08-10T10:00:00Z; new session 2026-08-10T11:00:00Z to 2026-08-10T12:00:00Z for the same officer"
        output: "gap is exactly 60 minutes, buffered interval starts 2026-08-10T10:00:00Z which touches the existing end, ERR_OFFICER_REST_BUFFER_CONFLICT (409)"
      - input: "the same existing session; new session 2026-08-10T11:01:00Z to 2026-08-10T12:01:00Z"
        output: "gap is 61 minutes, accepted, session created SCHEDULED"

  - name: room_capacity_overlap
    applies_to: InterviewSession
    algorithm_type: aggregation
    trigger: "POST /investigations/{id}/interview-sessions and POST /interview-sessions/{id}/postpone"
    constants: {}
    formula: |
      For the requested hearing_room_id, count every InterviewSession in status SCHEDULED or
      POSTPONED whose half-open interval [scheduled_start, scheduled_end) intersects the
      half-open candidate interval [new_scheduled_start, new_scheduled_end). Half-open
      intersection means a1 < b2 AND b1 < a2, so back-to-back bookings that share an instant do
      not intersect.

      The booking is accepted only when that count is strictly less than
      hearing_room.concurrent_capacity. Otherwise ERR_ROOM_CAPACITY_EXCEEDED (409).

      Note the deliberate asymmetry with officer_interview_buffer_overlap: the room rule is a
      half-open aggregate count, the officer rule is a closed-interval buffered pair test, so
      the same pair of times can pass one and fail the other.
    precision: "integer count; minute resolution timestamps"
    examples:
      - input: "room concurrent_capacity 2 with one SCHEDULED session 2026-08-12T09:00:00Z to 2026-08-12T11:00:00Z; new session 2026-08-12T10:00:00Z to 2026-08-12T12:00:00Z"
        output: "overlapping count 1, 1 < 2, accepted"
      - input: "the same room after a second overlapping session exists; a third overlapping session is requested"
        output: "overlapping count 2, 2 is not less than 2, ERR_ROOM_CAPACITY_EXCEEDED (409)"
      - input: "room concurrent_capacity 1 with one SCHEDULED session 2026-08-12T09:00:00Z to 2026-08-12T11:00:00Z; new session 2026-08-12T11:00:00Z to 2026-08-12T12:00:00Z"
        output: "half-open intervals share only the instant 11:00, overlapping count 0, accepted"

  - name: preponderance_evaluation
    applies_to: Allegation
    algorithm_type: threshold
    trigger: "POST /investigations/{id}/findings, then read again by POST /allegations/{id}/disposition"
    constants:
      PREPONDERANCE_THRESHOLD_PCT: "50.00"
    formula: |
      total_weight = evidence_weight_for + evidence_weight_against
      When total_weight is 0, preponderance_met is false and support_pct is 0.00.
      Otherwise support_pct = round_half_up(100 * evidence_weight_for / total_weight, 2)
      preponderance_met = (support_pct > PREPONDERANCE_THRESHOLD_PCT), a strict greater-than.
      An exact tie at 50.00 does not meet the standard: the burden rests on the department, so
      equipoise is a failure to carry it.
    precision: "support_pct to 2 decimal places, ROUND_HALF_UP; strict > comparison against 50.00"
    examples:
      - input: "evidence_weight_for 50, evidence_weight_against 50"
        output: "support_pct 50.00, preponderance_met false; a SUSTAINED disposition is rejected with ERR_PREPONDERANCE_NOT_MET"
      - input: "evidence_weight_for 5001, evidence_weight_against 5000"
        output: "support_pct 50.00 after rounding but the raw ratio 50.005 exceeds the threshold; the comparison is made on the rounded value, so preponderance_met is false"
      - input: "evidence_weight_for 51, evidence_weight_against 49"
        output: "support_pct 51.00, preponderance_met true"

  - name: discipline_matrix
    applies_to: Discipline
    algorithm_type: tiered_pricing
    trigger: "PRESUMPTIVE variant on POST /allegations/{id}/disposition with SUSTAINED; FINAL variant on POST /disciplines/{id}/impose"
    constants:
      MATRIX_BASE_DAYS:
        A: [30, 60, 120]
        B: [10, 20, 45]
        C: [3, 7, 15]
        D: [1, 2, 5]
      AGGRAVATOR_DAYS_EACH: 5
      MITIGATION_PCT_BY_PRE_CREDIT_TIER:
        - {max_days: 10, pct: "0.10"}
        - {max_days: 30, pct: "0.20"}
        - {max_days: 60, pct: "0.25"}
        - {max_days: null, pct: "0.30"}
      MAX_CREDITED_MITIGATORS: 2
      CLASS_A_FLOOR_DAYS: 30
      GLOBAL_CAP_DAYS: 180
      PRIOR_LOOKBACK_DAYS: 1095
    formula: |
      Step 1 - prior tier. Count the subject officer's Allegation rows with disposition
      SUSTAINED, excluding the allegation under disposition, whose disposed_at is at or after
      (reference_instant - PRIOR_LOOKBACK_DAYS whole days) and at or before reference_instant.
      Allegations in OVERTURNED_ON_APPEAL are not SUSTAINED and therefore never count.
        prior_tier_index = 0 when the count is 0, 1 when the count is 1, 2 when the count is at
        least 2. This index selects the element of MATRIX_BASE_DAYS[offense_class].
      The reference_instant is what differentiates the two variants; see the variants block.

      Step 2 - base = MATRIX_BASE_DAYS[offense_class][prior_tier_index]

      Step 3 - pre_credit = base + AGGRAVATOR_DAYS_EACH * aggravator_count

      Step 4 - mitigation percentage is selected from the pre_credit value, not from base. Walk
      MITIGATION_PCT_BY_PRE_CREDIT_TIER top to bottom and take the first row whose max_days is
      null or is at least pre_credit. This is the deliberately circular-looking step: the
      aggravators must be applied before the mitigation rate can be known, so the two adjustments
      cannot be reordered or folded into one multiplier.

      Step 5 - credited_mitigators = min(mitigator_count, MAX_CREDITED_MITIGATORS)
               credit_days = round_half_up(pre_credit * credited_mitigators * pct, 0)

      Step 6 - net = max(0, pre_credit - credit_days)

      Step 7 - floor and cap, in this order: when offense_class is A, net = max(net,
      CLASS_A_FLOOR_DAYS). Then days = min(net, GLOBAL_CAP_DAYS).
    variants:
      - variant: PRESUMPTIVE
        when: "computed inside POST /allegations/{id}/disposition with SUSTAINED; written to presumptive_prior_tier and presumptive_days"
        detail: |
          reference_instant is the allegation disposed_at, and aggravator_count and
          mitigator_count are taken from the disposition request payload. The prior tier counts
          every qualifying sustained allegation regardless of whether its Discipline was ever
          imposed, because at proposal time only the findings are known.
      - variant: FINAL
        when: "computed inside POST /disciplines/{id}/impose; written to final_prior_tier and final_days"
        detail: |
          reference_instant is the impose-time logical clock, and the prior tier counts only
          qualifying sustained allegations whose Discipline reached status IMPOSED, UPHELD or
          MODIFIED with effective_days at least 1. Proposed-but-never-imposed priors drop out, so
          the FINAL tier can be lower than the PRESUMPTIVE tier for the same officer.
          aggravator_count and mitigator_count are re-read from the impose payload and may differ
          from the disposition payload.
    precision: "credit_days rounded to 0 decimal places, ROUND_HALF_UP; all day counts are integers; percentages are exact decimals, never floats"
    examples:
      - input: "offense_class B, prior_tier_index 1, aggravator_count 2, mitigator_count 1"
        output: "base 20, pre_credit 30, pct 0.20 (30 is at most 30), credit_days round_half_up(30 * 1 * 0.20) = 6, days 24"
      - input: "offense_class B, prior_tier_index 0, aggravator_count 2, mitigator_count 1"
        output: "base 10, pre_credit 20, pct 0.20, credit_days 4, days 16 - the same officer therefore yields presumptive_days 24 and final_days 16 when one prior drops out at impose time"
      - input: "offense_class A, prior_tier_index 0, aggravator_count 0, mitigator_count 2"
        output: "base 30, pre_credit 30, pct 0.20, credit_days round_half_up(30 * 2 * 0.20) = 12, net 18, class A floor raises it to 30"
      - input: "offense_class A, prior_tier_index 2, aggravator_count 5, mitigator_count 0"
        output: "base 120, pre_credit 145, pct 0.30, credit_days 0, net 145, under the 180 cap, days 145"

  - name: reinstatement_back_pay
    applies_to: Reinstatement
    algorithm_type: waterfall_allocation
    trigger: "POST /reinstatements/{id}/finalize"
    constants:
      PAY_PERIOD_DAYS: 10
      ANNUAL_WORK_DAYS: 260
      INTEREST_ANNUAL_PCT: "0.05"
      INTEREST_YEAR_DAYS: 365
    formula: |
      Step 1 - split reversed_days into consecutive whole pay periods of PAY_PERIOD_DAYS days,
      with a final short period holding the remainder:
        full_periods = reversed_days // PAY_PERIOD_DAYS
        remainder_days = reversed_days % PAY_PERIOD_DAYS

      Step 2 - the amount for a period of d days is
        round_half_up(officer.annual_salary_cents * d / ANNUAL_WORK_DAYS, 0)
      Each period is rounded on its own and the rounded period amounts are then summed. Rounding
      per period before summing is mandatory; summing the unrounded period amounts and rounding
      once at the end produces a different total and is wrong.
        gross_back_pay_cents = full_periods * round_half_up(annual_salary_cents * PAY_PERIOD_DAYS / ANNUAL_WORK_DAYS, 0)
                               + (round_half_up(annual_salary_cents * remainder_days / ANNUAL_WORK_DAYS, 0) when remainder_days > 0 else 0)

      Step 3 - net_back_pay_cents = max(0, gross_back_pay_cents - interim_earnings_cents)

      Step 4 - days_elapsed = whole days from discipline.imposed_at to the finalize-time logical
      clock, floored.
        interest_cents = round_half_up(net_back_pay_cents * INTEREST_ANNUAL_PCT * days_elapsed / INTEREST_YEAR_DAYS, 0)
      Interest accrues on the net figure, after the interim-earnings offset, never on gross.

      Step 5 - total_award_cents = net_back_pay_cents + interest_cents
    precision: "all money in integer cents, ROUND_HALF_UP at each of the two rounding points; per-period rounding precedes summation"
    examples:
      - input: "annual_salary_cents 9100013, reversed_days 24, interim_earnings_cents 125000, imposed_at 2026-08-20T00:00:00Z, finalize clock 2026-11-01T00:00:00Z"
        output: "full_periods 2, remainder_days 4; period amounts round_half_up(9100013*10/260)=350001 twice and round_half_up(9100013*4/260)=140000; gross 840002 (a single end rounding would give 840001); net 715002; days_elapsed 73; interest round_half_up(715002*0.05*73/365)=7150; total_award_cents 722152"
      - input: "the same officer and dates with interim_earnings_cents 900000"
        output: "net_back_pay_cents floored at 0, interest_cents 0, total_award_cents 0"

  - name: eis_composite_score
    applies_to: Officer
    algorithm_type: weighted_scoring
    trigger: "POST /officers/{id}/activity-events, POST /eis-runs, the SUSTAINED disposition cascade, and the computed read GET /officers/{id}/eis-profile"
    constants:
      EVENT_BASE_WEIGHTS: {USE_OF_FORCE: 3, PURSUIT: 2, SICK_LEAVE_DAY: 1, COMPLAINT_INTAKE: 1, COMPLAINT_SUSTAINED: 4}
      SEVERITY_MULTIPLIERS: {LEVEL_1: "1.0", LEVEL_2: "1.5", LEVEL_3: "2.0", NA: "1.0"}
      WINDOW_DAYS: 365
      DECAY_FRESH_DAYS: 180
      DECAY_STALE_FACTOR: "0.5"
      ASSIGNMENT_MULTIPLIERS: {PATROL: "1.0", INVESTIGATIVE: "0.8", ADMIN: "0.6"}
      INDICATOR_THRESHOLDS: {FORCE_COUNT: 3, PURSUIT_COUNT: 2, COMPLAINT_COUNT: 3, SICK_LEAVE_DAYS: 12}
      SCORE_SCALE: "2.5"
      INDICATOR_BONUS_EACH: 10
      SCORE_CEILING: 100
      PEER_RELATIVE_SCALE: "40"
      ALERT_LEVEL_THRESHOLDS: {WATCH: 30, ALERT: 50, CRITICAL: 75}
      ALERT_REVIEW_DAYS: 30
    formula: |
      Input set: OfficerActivityEvent rows for the officer whose occurred_at is strictly after
      (now - WINDOW_DAYS whole days) and at or before now, where now is the logical clock. The
      window is half-open on the left: an event exactly WINDOW_DAYS old is excluded.

      Per-event contribution:
        age_days = floor((now - occurred_at) / 86400 seconds)
        decay = 1.0 when age_days is at most DECAY_FRESH_DAYS, else DECAY_STALE_FACTOR
        contribution = EVENT_BASE_WEIGHTS[event_type] * SEVERITY_MULTIPLIERS[severity_code] * decay
      weighted_total = the exact decimal sum of all contributions, summed in occurred_at
      ascending order with created_at ascending as the tie-break, with no intermediate rounding.

      Breached indicators, each evaluated with a non-strict at-least comparison over the same
      window:
        FORCE_COUNT: count of USE_OF_FORCE events >= 3
        PURSUIT_COUNT: count of PURSUIT events >= 2
        COMPLAINT_COUNT: count of COMPLAINT_INTAKE plus COMPLAINT_SUSTAINED events >= 3
        SICK_LEAVE_DAYS: count of SICK_LEAVE_DAY events >= 12
      breached_indicators is the list of breached names in the fixed order
      [FORCE_COUNT, PURSUIT_COUNT, COMPLAINT_COUNT, SICK_LEAVE_DAYS]; breached_count is its length.

      Alert band from the final score: CRITICAL when score >= 75, else ALERT when score >= 50,
      else WATCH when score >= 30, else NONE. An alert row is created only when the band is not
      NONE, and review_due_at is the creation instant plus ALERT_REVIEW_DAYS whole days.
    variants:
      - variant: ROLLING_12M
        when: "the default; written to Officer.eis_score and Officer.eis_alert_level, and used by every write-path trigger"
        detail: |
          score = round_half_up(min(SCORE_CEILING, max(0,
                    weighted_total * ASSIGNMENT_MULTIPLIERS[officer.assignment_type] * SCORE_SCALE
                    + INDICATOR_BONUS_EACH * breached_count)), 2)
          The assignment multiplier discounts officers whose duties expose them to fewer
          incidents, and the indicator bonus is additive on top of the scaled weight.
      - variant: PEER_RELATIVE
        when: "returned by GET /officers/{id}/eis-profile with variant=PEER_RELATIVE, and stored on the alert when the alert score_variant is PEER_RELATIVE"
        detail: |
          The peer pool is every other Officer with employment_status ACTIVE whose Unit
          peer_group_code equals the subject officer Unit peer_group_code. peer_mean is the exact
          decimal mean of those officers' ROLLING_12M weighted_total values, computed without the
          assignment multiplier and without the indicator bonus.
            ratio = subject weighted_total / peer_mean
            score = round_half_up(min(SCORE_CEILING, ratio * PEER_RELATIVE_SCALE), 2)
          The assignment multiplier and the indicator bonus are deliberately absent, so the two
          variants can disagree on both the score and the alert band for identical event data.
          Empty-pool fallback: when the peer pool is empty, or when peer_mean is exactly 0, the
          PEER_RELATIVE score falls back to the ROLLING_12M score for the same officer and the
          response peer_pool_size reports 0.
    precision: "scores to 2 decimal places, ROUND_HALF_UP, clamped to [0, 100]; weighted_total and peer_mean carry exact decimal arithmetic with no intermediate rounding; indicator comparisons are non-strict >="
    examples:
      - input: "PATROL officer, clock 2026-08-01T00:00:00Z, events USE_OF_FORCE LEVEL_2 2026-06-01, USE_OF_FORCE LEVEL_1 2026-06-15, USE_OF_FORCE LEVEL_3 2026-07-01, PURSUIT NA 2026-07-10, PURSUIT NA 2026-07-20"
        output: "weighted_total 3*1.5 + 3*1.0 + 3*2.0 + 2 + 2 = 17.5; breached FORCE_COUNT and PURSUIT_COUNT so breached_count 2; ROLLING_12M score round_half_up(17.5*1.0*2.5 + 20, 2) = 63.75, band ALERT"
      - input: "the same officer with a peer pool of two ACTIVE officers in the same peer_group_code whose weighted_totals are 30 and 0"
        output: "peer_mean 15, ratio 1.1666..., PEER_RELATIVE score round_half_up(1.1666...*40, 2) = 46.67, band WATCH - the two variants disagree on both score and band"
      - input: "one USE_OF_FORCE LEVEL_1 event at 2025-08-01T00:00:00Z with clock 2026-08-01T00:00:00Z"
        output: "age_days 365, exactly at the window edge and therefore excluded; weighted_total 0.00, score 0.00, band NONE, no alert created"
      - input: "one USE_OF_FORCE LEVEL_1 event at 2026-02-02T00:00:00Z versus 2026-02-01T00:00:00Z with clock 2026-08-01T00:00:00Z"
        output: "age_days 180 keeps decay 1.0 and contributes 3.0; age_days 181 applies DECAY_STALE_FACTOR and contributes 1.5"

  - name: checkin_schedule
    applies_to: MonitoringCheckIn
    algorithm_type: chronological
    trigger: "POST /intervention-plans/{id}/activate"
    constants: {}
    formula: |
      interval_days = duration_days // (required_checkin_count + 1)
      For sequence_index i running from 1 to required_checkin_count inclusive:
        due_at = activated_at + (interval_days * i) whole days
      The final check-in therefore lands strictly before end_date, leaving the last interval as
      the review gap. Every row is created in status PENDING with outcome PENDING, on_time null
      and completed_at null.
    precision: "whole days, floor division; timestamps carry the activated_at time of day"
    examples:
      - input: "activated_at 2026-08-01T00:00:00Z, duration_days 30, required_checkin_count 2"
        output: "interval_days 10, due_at values 2026-08-11T00:00:00Z and 2026-08-21T00:00:00Z, end_date 2026-08-31T00:00:00Z"
      - input: "activated_at 2026-08-01T00:00:00Z, duration_days 60, required_checkin_count 3"
        output: "interval_days 15, due_at values 2026-08-16T00:00:00Z, 2026-08-31T00:00:00Z and 2026-09-15T00:00:00Z, end_date 2026-09-30T00:00:00Z"

  - name: plan_compliance_score
    applies_to: InterventionPlan
    algorithm_type: weighted_scoring
    trigger: "POST /check-ins/{id}/complete and POST /intervention-plans/{id}/close"
    constants:
      CONCERN_PENALTY_EACH: 15
      PLAN_SUCCESS_SCORE: 80
    formula: |
      compliance_score = round_half_up(max(0,
        100 * on_time_checkin_count / required_checkin_count
        - CONCERN_PENALTY_EACH * concern_count), 2)
      Only on-time completions count toward the positive term: a check-in completed after its
      due_at, and a check-in swept to MISSED, both contribute nothing. The concern penalty is
      applied after the ratio and the whole expression is floored at 0.
      The close endpoint compares compliance_score against PLAN_SUCCESS_SCORE with a non-strict
      at-least test: a score of exactly PLAN_SUCCESS_SCORE closes CLOSED_SUCCESS.
    precision: "2 decimal places, ROUND_HALF_UP, floored at 0; non-strict >= against 80"
    examples:
      - input: "required_checkin_count 2, one on-time SATISFACTORY completion, one check-in swept MISSED, concern_count 0"
        output: "compliance_score 50.00, below 80, the plan closes ESCALATED"
      - input: "required_checkin_count 2, two on-time completions of which one is CONCERN"
        output: "compliance_score 100 - 15 = 85.00, at least 80, the plan closes CLOSED_SUCCESS"
      - input: "required_checkin_count 3, three on-time completions, concern_count 2"
        output: "compliance_score 100 - 30 = 70.00, below 80, the plan closes ESCALATED"

  - name: retention_expiry_evaluation
    applies_to: Complaint
    algorithm_type: threshold
    trigger: "POST /investigations/{id}/close, POST /complaints/{id}/withdraw, POST /complaints/{id}/classify with REJECT, and read again by POST /complaints/{id}/purge"
    constants:
      RETENTION_DAYS_BY_DISPOSITION: {SUSTAINED: 2555, NOT_SUSTAINED: 1825, UNFOUNDED: 1095, EXONERATED: 1095, POLICY_FAILURE: 1825, WITHDRAWN: 730}
      DISCLOSURE_RETENTION_DAYS: 2555
    formula: |
      The governing disposition for a closed complaint is the strongest disposition present
      across its allegations, using this precedence, first match wins:
        SUSTAINED, POLICY_FAILURE, NOT_SUSTAINED, EXONERATED, UNFOUNDED, WITHDRAWN
      OVERTURNED_ON_APPEAL allegations are treated as NOT_SUSTAINED for retention purposes; the
      finding is gone but the file must survive the appeal record.
        retention_until = closed_at + RETENTION_DAYS_BY_DISPOSITION[governing disposition] whole days
      For a withdrawn or intake-rejected complaint the governing disposition is WITHDRAWN.

      CredibilityDisclosure.retention_until = created_at + DISCLOSURE_RETENTION_DAYS whole days,
      and permanent_retention is true when basis is UNTRUTHFULNESS_SUSTAINED, in which case the
      row is never swept to EXPIRED regardless of retention_until.

      Purge eligibility is a non-strict comparison: the purge is allowed when the logical clock
      is at or after retention_until.
    precision: "whole days; non-strict >= comparison at the retention boundary"
    examples:
      - input: "complaint closed_at 2026-08-20T00:00:00Z whose allegations are one SUSTAINED and one UNFOUNDED"
        output: "governing disposition SUSTAINED, retention_until 2033-08-18T00:00:00Z"
      - input: "complaint closed_at 2026-08-20T00:00:00Z whose only allegation is NOT_SUSTAINED"
        output: "retention_until 2031-08-19T00:00:00Z"
      - input: "complaint withdrawn at 2026-08-05T00:00:00Z"
        output: "retention_until 2028-08-04T00:00:00Z; a purge at exactly 2028-08-04T00:00:00Z is allowed"

  - name: complaint_outcome_report
    applies_to: Complaint
    algorithm_type: aggregation
    trigger: "GET /reports/complaint-outcomes"
    constants:
      SUPPRESSION_MIN_CELL: 3
      SUSTAIN_RATE_DECIMALS: 1
    formula: |
      Input set: Complaint rows whose status is CLOSED or WITHDRAWN and whose closed_at is at or
      after period_start and at or before period_end. Complaints in PURGED are included in the
      totals; purging redacts narrative text, it does not erase the outcome statistics.

      Grouping: when breakdown is DEMOGRAPHIC the group key is
      complainant_demographic_code, with the literal UNKNOWN forming its own group; when
      breakdown is CHANNEL the group key is intake_channel; when breakdown is omitted the single
      group key is the literal ALL. Groups are emitted in ascending group_key byte order, with
      the SUPPRESSED bucket last.

      Per group:
        total_complaints = number of complaints in the group
        sustained_complaints = number of those with sustained_allegation_count at least 1
        sustain_rate_pct = round_half_up(100 * sustained_complaints / total_complaints,
                           SUSTAIN_RATE_DECIMALS), and 0.0 when total_complaints is 0

      Small-cell suppression: a group whose total_complaints is strictly less than
      SUPPRESSION_MIN_CELL is emitted with total_complaints, sustained_complaints and
      sustain_rate_pct all null and suppressed true, and its counts are added to a single
      trailing group with group_key SUPPRESSED whose own counts are always disclosed. A group
      whose total is exactly SUPPRESSION_MIN_CELL is disclosed in full.
    precision: "sustain_rate_pct to 1 decimal place, ROUND_HALF_UP; suppression uses a strict < comparison against 3"
    examples:
      - input: "period covering 4 closed complaints in group DG_A of which 1 is sustained, and 2 closed complaints in group DG_B of which 2 are sustained, breakdown DEMOGRAPHIC"
        output: "DG_A total 4, sustained 1, sustain_rate_pct 25.0, suppressed false; DG_B suppressed true with all three figures null; trailing SUPPRESSED group total 2, sustained 2, sustain_rate_pct 100.0"
      - input: "a group of exactly 3 closed complaints of which 0 are sustained"
        output: "disclosed in full: total 3, sustained 0, sustain_rate_pct 0.0, suppressed false"

  - name: interview_notice_and_appeal_windows
    applies_to: InterviewSession
    algorithm_type: threshold
    trigger: "POST /investigations/{id}/interview-sessions, POST /interview-sessions/{id}/postpone, POST /interview-sessions/{id}/hold, POST /disciplines/{id}/impose, POST /disciplines/{id}/appeals"
    constants:
      MIN_NOTICE_HOURS: 48
      MAX_POSTPONEMENTS: 2
      APPEAL_WINDOW_DAYS: 15
    formula: |
      notice_hours = floor((scheduled_start - notice_served_at) / 3600 seconds). The officer
      bill-of-rights test is non-strict: notice_hours at least MIN_NOTICE_HOURS is sufficient, so
      exactly 48.0 hours passes and 47 hours 59 minutes fails because the floor yields 47.
      Every postponement recomputes notice_hours from new_notice_served_at and
      new_scheduled_start and re-applies the same non-strict test; the original notice does not
      carry over to the new date.

      duration_minutes = floor((scheduled_end - scheduled_start) / 60 seconds), recorded when the
      session is created and recomputed on every postponement.

      appeal_deadline_at = discipline.imposed_at + APPEAL_WINDOW_DAYS whole days, and the filing
      test is non-strict: a filing at exactly appeal_deadline_at is timely.
      days_to_file = floor((appeal.filed_at - discipline.imposed_at) / 86400 seconds).
    precision: "whole hours and whole days by floor; non-strict >= at the notice boundary and non-strict <= at the appeal deadline"
    examples:
      - input: "notice_served_at 2026-08-08T09:00:00Z, scheduled_start 2026-08-10T09:00:00Z"
        output: "notice_hours 48, accepted at exactly the boundary"
      - input: "notice_served_at 2026-08-08T09:01:00Z, scheduled_start 2026-08-10T09:00:00Z"
        output: "notice_hours floor(47.983) = 47, ERR_INSUFFICIENT_NOTICE (422)"
      - input: "imposed_at 2026-08-20T00:00:00Z"
        output: "appeal_deadline_at 2026-09-04T00:00:00Z; an appeal filed at exactly 2026-09-04T00:00:00Z has days_to_file 15 and is timely"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules (evaluated strictly in ascending priority; the first
#      violated rule determines the response and no later rule is evaluated)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is a role declared in §1.7 and that role is listed in the target endpoint roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "the {id} path segment of a complaints path resolves to a Complaint"
    error_id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    applies_to: "GET /complaints/{id}, POST /complaints/{id}/allegations, POST /complaints/{id}/classify, POST /complaints/{id}/investigations, POST /complaints/{id}/withdraw, POST /complaints/{id}/purge"
  - priority: 3
    category: existence
    check: "the {id} path segment of an officers path resolves to an Officer"
    error_id: ERR_OFFICER_NOT_FOUND
    http_status: 404
    applies_to: "GET /officers/{id}, GET /officers/{id}/activity-events, GET /officers/{id}/eis-profile, POST /officers/{id}/activity-events, POST /officers/{id}/employment-status"
  - priority: 3
    category: existence
    check: "the {id} path segment of an investigations path resolves to an Investigation"
    error_id: ERR_INVESTIGATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /investigations/{id}, POST /investigations/{id}/assignments, POST /investigations/{id}/tolling, POST /investigations/{id}/interview-sessions, POST /investigations/{id}/findings, POST /investigations/{id}/close"
  - priority: 3
    category: existence
    check: "the {id} path segment of an allegations path resolves to an Allegation"
    error_id: ERR_ALLEGATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /allegations/{id}, POST /allegations/{id}/disposition"
  - priority: 3
    category: existence
    check: "the {id} path segment of an interview-sessions path resolves to an InterviewSession"
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /interview-sessions/{id}, POST /interview-sessions/{id}/hold, POST /interview-sessions/{id}/postpone"
  - priority: 3
    category: existence
    check: "the {id} path segment of a disciplines path resolves to a Discipline"
    error_id: ERR_DISCIPLINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /disciplines/{id}, POST /disciplines/{id}/impose, POST /disciplines/{id}/appeals"
  - priority: 3
    category: existence
    check: "the {id} path segment of an appeals path resolves to an Appeal"
    error_id: ERR_APPEAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /appeals/{id}, GET /appeals/{id}/reinstatements, POST /appeals/{id}/hear, POST /appeals/{id}/decide"
  - priority: 3
    category: existence
    check: "the {id} path segment of a reinstatements path resolves to a Reinstatement"
    error_id: ERR_REINSTATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /reinstatements/{id}/finalize"
  - priority: 3
    category: existence
    check: "the {id} path segment of an eis-alerts path resolves to an EarlyInterventionAlert"
    error_id: ERR_ALERT_NOT_FOUND
    http_status: 404
    applies_to: "GET /eis-alerts/{id}, POST /eis-alerts/{id}/dismiss, POST /eis-alerts/{id}/intervention-plans"
  - priority: 3
    category: existence
    check: "the {id} path segment of an intervention-plans path resolves to an InterventionPlan"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /intervention-plans/{id}, GET /intervention-plans/{id}/check-ins, POST /intervention-plans/{id}/activate, POST /intervention-plans/{id}/close"
  - priority: 3
    category: existence
    check: "the {id} path segment of a check-ins path resolves to a MonitoringCheckIn"
    error_id: ERR_CHECKIN_NOT_FOUND
    http_status: 404
    applies_to: "POST /check-ins/{id}/complete"
  - priority: 3
    category: existence
    check: "the {id} path segment of a credibility-disclosures path resolves to a CredibilityDisclosure"
    error_id: ERR_DISCLOSURE_NOT_FOUND
    http_status: 404
    applies_to: "GET /credibility-disclosures/{id}, POST /credibility-disclosures/{id}/release"
  - priority: 4
    category: schema
    check: "the request body parses, carries every required input field for the endpoint, and every supplied value matches its declared type, enum domain and numeric range (certification_level 0..3, priority 1..3, aggravator_count and mitigator_count 0..5, required_checkin_count 2..6, duration_days in {30,60,90}, limit 1..100, offset at least 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "every Officer id referenced in the request body (reporting_supervisor_officer_id, subject_officer_id, investigator_officer_id, supervisor_officer_id) resolves to an Officer"
    error_id: ERR_OFFICER_NOT_FOUND
    http_status: 404
    applies_to: "POST /complaints, POST /complaints/{id}/allegations, POST /investigations/{id}/assignments, POST /investigations/{id}/interview-sessions, POST /eis-alerts/{id}/intervention-plans"
  - priority: 5
    category: existence
    check: "subject_unit_id in the request body resolves to a Unit"
    error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /complaints, POST /officers"
  - priority: 5
    category: existence
    check: "hearing_room_id in the request body resolves to a HearingRoom"
    error_id: ERR_ROOM_NOT_FOUND
    http_status: 404
    applies_to: "POST /investigations/{id}/interview-sessions, POST /interview-sessions/{id}/postpone"
  - priority: 6
    category: auth
    check: "the acting X-User-ID equals investigation.assigned_investigator_officer_id"
    error_id: ERR_NOT_ASSIGNED_INVESTIGATOR
    http_status: 403
    applies_to: "POST /investigations/{id}/findings, POST /investigations/{id}/interview-sessions, POST /interview-sessions/{id}/hold"
  - priority: 6
    category: auth
    check: "when the acting role is Supervisor, the acting X-User-ID equals plan.supervisor_officer_id"
    error_id: ERR_NOT_PLAN_SUPERVISOR
    http_status: 403
    applies_to: "POST /intervention-plans/{id}/activate, POST /intervention-plans/{id}/close, POST /check-ins/{id}/complete"
  - priority: 6
    category: auth
    check: "when complaint.intake_reference_code is non-null, the supplied intake_reference_code equals it; an ANONYMOUS complaint stores no code, so it passes this check and falls through to the priority-12 anonymous-withdrawal guard"
    error_id: ERR_INTAKE_CODE_MISMATCH
    http_status: 403
    applies_to: "POST /complaints/{id}/withdraw"
  - priority: 7
    category: concurrency
    check: "expected_investigation_version equals investigation.version"
    error_id: ERR_STALE_INVESTIGATION_VERSION
    http_status: 412
    applies_to: "POST /investigations/{id}/assignments"
  - priority: 7
    category: concurrency
    check: "expected_alert_version equals alert.version"
    error_id: ERR_STALE_ALERT_VERSION
    http_status: 412
    applies_to: "POST /eis-alerts/{id}/intervention-plans"
  - priority: 8
    category: state
    check: "complaint.status is one of the states the requested operation declares as a valid from-state in §1.2: SCREENING, CLASSIFIED or UNDER_INVESTIGATION for allegation creation; SCREENING for a screening decision and CLASSIFIED or UNDER_INVESTIGATION for a reclassification override; CLASSIFIED for investigation opening; CLASSIFIED, UNDER_INVESTIGATION or ADJUDICATION for withdrawal"
    error_id: ERR_COMPLAINT_STATE_INVALID
    http_status: 409
    applies_to: "POST /complaints/{id}/allegations, POST /complaints/{id}/classify, POST /complaints/{id}/investigations, POST /complaints/{id}/withdraw"
  - priority: 8
    category: state
    check: "complaint.status is CLOSED or WITHDRAWN and purged_at is null"
    error_id: ERR_COMPLAINT_NOT_PURGEABLE
    http_status: 409
    applies_to: "POST /complaints/{id}/purge"
  - priority: 8
    category: state
    check: "investigation.status is a valid from-state for the requested operation (UNASSIGNED or ASSIGNED for assignments, IN_PROGRESS for SUSPEND, TOLLED or PENDING_REVIEW for RESUME, IN_PROGRESS for findings, PENDING_REVIEW for close)"
    error_id: ERR_INVESTIGATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /investigations/{id}/assignments, POST /investigations/{id}/tolling, POST /investigations/{id}/findings, POST /investigations/{id}/close"
  - priority: 8
    category: state
    check: "investigation.status is ASSIGNED or IN_PROGRESS, so an interview may be scheduled against it"
    error_id: ERR_INVESTIGATION_NOT_INTERVIEWABLE
    http_status: 409
    applies_to: "POST /investigations/{id}/interview-sessions"
    note: "Higher-priority member of the priority pair with ERR_OFFICER_REST_BUFFER_CONFLICT at priority 11."
  - priority: 8
    category: state
    check: "the subject Officer.employment_status is not SEPARATED, so the officer can still be compelled to interview, be disciplined, or have the employment dimension moved; SEPARATED is terminal and every further employment-status write is refused, including a repeat of SEPARATED"
    error_id: ERR_OFFICER_SEPARATED
    http_status: 409
    applies_to: "POST /investigations/{id}/interview-sessions, POST /interview-sessions/{id}/hold, POST /disciplines/{id}/impose, POST /officers/{id}/employment-status"
  - priority: 8
    category: state
    check: "session.status is SCHEDULED for hold, and SCHEDULED for postpone"
    error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /interview-sessions/{id}/hold, POST /interview-sessions/{id}/postpone"
  - priority: 8
    category: state
    check: "allegation.disposition is PENDING"
    error_id: ERR_ALLEGATION_ALREADY_DISPOSED
    http_status: 409
    applies_to: "POST /allegations/{id}/disposition"
  - priority: 8
    category: state
    check: "discipline.status is PROPOSED for impose and IMPOSED for appeals"
    error_id: ERR_DISCIPLINE_STATE_INVALID
    http_status: 409
    applies_to: "POST /disciplines/{id}/impose, POST /disciplines/{id}/appeals"
  - priority: 8
    category: state
    check: "appeal.status is FILED for hear and HEARD for decide"
    error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /appeals/{id}/hear, POST /appeals/{id}/decide"
  - priority: 8
    category: state
    check: "reinstatement.status is PENDING"
    error_id: ERR_REINSTATEMENT_ALREADY_FINALIZED
    http_status: 409
    applies_to: "POST /reinstatements/{id}/finalize"
  - priority: 8
    category: state
    check: "alert.status is OPEN or PLAN_REQUIRED for dismiss, and PLAN_REQUIRED or ESCALATED for plan creation"
    error_id: ERR_ALERT_STATE_INVALID
    http_status: 409
    applies_to: "POST /eis-alerts/{id}/dismiss, POST /eis-alerts/{id}/intervention-plans"
  - priority: 8
    category: state
    check: "plan.status is DRAFT for activate and ACTIVE for close"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /intervention-plans/{id}/activate, POST /intervention-plans/{id}/close"
  - priority: 8
    category: state
    check: "check-in status is PENDING and the owning plan status is ACTIVE"
    error_id: ERR_CHECKIN_NOT_PENDING
    http_status: 409
    applies_to: "POST /check-ins/{id}/complete"
  - priority: 8
    category: state
    check: "disclosure.status is ACTIVE"
    error_id: ERR_DISCLOSURE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /credibility-disclosures/{id}/release"
  - priority: 9
    category: business_safety
    check: "the acting IACommander X-User-ID is neither the investigation assigned_investigator_officer_id nor the allegation subject_officer_id; the officer who built the case may not decide it and no officer may decide their own case"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /allegations/{id}/disposition, POST /disciplines/{id}/impose"
    note: "Higher-priority member of the priority pair with ERR_PREPONDERANCE_NOT_MET at priority 12."
  - priority: 9
    category: business_safety
    check: "the investigator being assigned is not a subject officer of the complaint, does not share a unit_id with any subject officer, and is not the acting commander"
    error_id: ERR_INVESTIGATOR_CONFLICT
    http_status: 422
    applies_to: "POST /investigations/{id}/assignments"
  - priority: 9
    category: business_safety
    check: "notice_hours computed from notice_served_at to scheduled_start is at least MIN_NOTICE_HOURS, the officer bill-of-rights notice period"
    error_id: ERR_INSUFFICIENT_NOTICE
    http_status: 422
    applies_to: "POST /investigations/{id}/interview-sessions, POST /interview-sessions/{id}/postpone, POST /interview-sessions/{id}/hold"
  - priority: 9
    category: business_safety
    check: "representation_status is WAIVED or REP_PRESENT; an interview may not be held while representation is still REP_REQUESTED under the collective bargaining agreement"
    error_id: ERR_REPRESENTATION_NOT_PRESENT
    http_status: 409
    applies_to: "POST /interview-sessions/{id}/hold"
  - priority: 9
    category: business_safety
    check: "no CredibilityDisclosure in status ACTIVE references any allegation of the complaint, and no allegation of the complaint is a SUSTAINED UNTRUTHFULNESS finding; the credibility disclosure obligation outranks the retention clock"
    error_id: ERR_CREDIBILITY_HOLD
    http_status: 409
    applies_to: "POST /complaints/{id}/purge"
    note: "Higher-priority member of the priority pair with ERR_RETENTION_NOT_EXPIRED at priority 11."
  - priority: 9
    category: business_safety
    check: "no Appeal in status FILED or HEARD exists for any Discipline arising from the complaint's allegations"
    error_id: ERR_APPEAL_PENDING
    http_status: 409
    applies_to: "POST /complaints/{id}/purge"
  - priority: 10
    category: business_referential
    check: "the complaint has at least one Allegation"
    error_id: ERR_NO_ALLEGATIONS
    http_status: 422
    applies_to: "POST /complaints/{id}/investigations"
  - priority: 10
    category: business_referential
    check: "no Investigation already exists for the complaint"
    error_id: ERR_INVESTIGATION_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /complaints/{id}/investigations"
  - priority: 10
    category: business_referential
    check: "allegation_findings contains exactly one entry for every Allegation of the complaint, with no duplicates and no entries for foreign allegations"
    error_id: ERR_FINDINGS_INCOMPLETE
    http_status: 422
    applies_to: "POST /investigations/{id}/findings"
  - priority: 10
    category: business_referential
    check: "investigation.interview_held_count is at least 1; findings may not be submitted before the subject officer has been interviewed"
    error_id: ERR_NO_INTERVIEW_HELD
    http_status: 422
    applies_to: "POST /investigations/{id}/findings"
  - priority: 10
    category: business_referential
    check: "every Allegation of the complaint has a disposition other than PENDING"
    error_id: ERR_PENDING_DISPOSITIONS
    http_status: 409
    applies_to: "POST /investigations/{id}/close"
  - priority: 10
    category: business_referential
    check: "at least one Unit with unit_role INTERNAL_AFFAIRS exists to receive the routing"
    error_id: ERR_NO_INTAKE_UNIT
    http_status: 422
    applies_to: "POST /complaints, POST /complaints/{id}/classify"
  - priority: 10
    category: business_referential
    check: "when investigator_officer_id is omitted, the selector eligibility pool is non-empty"
    error_id: ERR_NO_ELIGIBLE_INVESTIGATOR
    http_status: 422
    applies_to: "POST /investigations/{id}/assignments"
  - priority: 10
    category: business_referential
    check: "when officer_id is supplied, that officer has no EarlyInterventionAlert in status ESCALATED; an escalated alert must be answered with a replacement intervention plan before a targeted rescore of that officer is accepted"
    error_id: ERR_ALERT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /eis-runs"
  - priority: 10
    category: business_referential
    check: "no MonitoringCheckIn of the plan is still PENDING"
    error_id: ERR_PENDING_CHECKINS
    http_status: 409
    applies_to: "POST /intervention-plans/{id}/close"
  - priority: 10
    category: business_referential
    check: "the alert has no existing InterventionPlan when it is being dismissed"
    error_id: ERR_PLAN_EXISTS
    http_status: 409
    applies_to: "POST /eis-alerts/{id}/dismiss"
  - priority: 11
    category: business_temporal
    check: "incident_datetime is at or after (logical clock - STATUTE_DAYS whole days); a complaint about a stale incident cannot be filed"
    error_id: ERR_STATUTE_EXPIRED
    http_status: 422
    applies_to: "POST /complaints"
  - priority: 11
    category: business_temporal
    check: "occurred_at is at or before the logical clock"
    error_id: ERR_EVENT_IN_FUTURE
    http_status: 422
    applies_to: "POST /officers/{id}/activity-events"
  - priority: 11
    category: business_temporal
    check: "scheduled_end is strictly after scheduled_start and scheduled_start is strictly after the logical clock"
    error_id: ERR_INVALID_SESSION_WINDOW
    http_status: 422
    applies_to: "POST /investigations/{id}/interview-sessions, POST /interview-sessions/{id}/postpone"
  - priority: 11
    category: business_temporal
    check: "the subject officer has no SCHEDULED or POSTPONED session whose interval intersects the candidate interval widened by OFFICER_REST_BUFFER_MINUTES on both ends"
    error_id: ERR_OFFICER_REST_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /investigations/{id}/interview-sessions, POST /interview-sessions/{id}/postpone"
    note: "Lower-priority member of the priority pair with ERR_INVESTIGATION_NOT_INTERVIEWABLE at priority 8."
  - priority: 11
    category: business_temporal
    check: "the count of SCHEDULED or POSTPONED sessions in the requested room whose half-open interval intersects the candidate interval is strictly less than the room concurrent_capacity"
    error_id: ERR_ROOM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /investigations/{id}/interview-sessions, POST /interview-sessions/{id}/postpone"
  - priority: 11
    category: business_temporal
    check: "the logical clock is at or after session.scheduled_start"
    error_id: ERR_INTERVIEW_NOT_STARTED
    http_status: 409
    applies_to: "POST /interview-sessions/{id}/hold"
  - priority: 11
    category: business_temporal
    check: "the logical clock is at or before discipline.appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /disciplines/{id}/appeals"
  - priority: 11
    category: business_temporal
    check: "the logical clock is at or after complaint.retention_until"
    error_id: ERR_RETENTION_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /complaints/{id}/purge"
    note: "Lower-priority member of the priority pair with ERR_CREDIBILITY_HOLD at priority 9."
  - priority: 11
    category: business_temporal
    check: "period_start is at or before period_end"
    error_id: ERR_INVALID_REPORT_PERIOD
    http_status: 422
    applies_to: "GET /reports/complaint-outcomes"
  - priority: 12
    category: business_constraint
    check: "preponderance_met is true when the requested disposition is SUSTAINED"
    error_id: ERR_PREPONDERANCE_NOT_MET
    http_status: 422
    applies_to: "POST /allegations/{id}/disposition"
    note: "Lower-priority member of the priority pair with ERR_SEGREGATION_OF_DUTIES at priority 9."
  - priority: 12
    category: business_constraint
    check: "UNFOUNDED requires evidence_weight_for exactly 0; EXONERATED and POLICY_FAILURE require policy_compliant true"
    error_id: ERR_DISPOSITION_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /allegations/{id}/disposition"
  - priority: 12
    category: business_constraint
    check: "session.postpone_count is strictly less than MAX_POSTPONEMENTS"
    error_id: ERR_MAX_POSTPONEMENTS_REACHED
    http_status: 409
    applies_to: "POST /interview-sessions/{id}/postpone"
  - priority: 12
    category: business_constraint
    check: "complaint.reclassification_count is strictly less than MAX_RECLASSIFICATIONS and classification_override differs from the stored classification"
    error_id: ERR_MAX_RECLASSIFICATIONS_REACHED
    http_status: 409
    applies_to: "POST /complaints/{id}/classify"
  - priority: 12
    category: business_constraint
    check: "when intake_channel is PUBLIC or SUPERVISOR, complainant_name and complainant_contact are both present and non-empty; when intake_channel is ANONYMOUS both are absent"
    error_id: ERR_COMPLAINANT_IDENTITY_REQUIRED
    http_status: 422
    applies_to: "POST /complaints"
  - priority: 12
    category: business_constraint
    check: "intake_channel is not ANONYMOUS; an anonymous complaint has no reference code and therefore no channel through which it can be withdrawn"
    error_id: ERR_ANONYMOUS_NOT_WITHDRAWABLE
    http_status: 422
    applies_to: "POST /complaints/{id}/withdraw"
  - priority: 12
    category: business_constraint
    check: "complaint.sustained_allegation_count is 0; a complaint with a sustained finding cannot be withdrawn by the complainant"
    error_id: ERR_SUSTAINED_NOT_WITHDRAWABLE
    http_status: 409
    applies_to: "POST /complaints/{id}/withdraw"
  - priority: 12
    category: business_constraint
    check: "badge_number is unique across all Officer rows"
    error_id: ERR_BADGE_NUMBER_DUPLICATE
    http_status: 409
    applies_to: "POST /officers"
  - priority: 12
    category: business_constraint
    check: "the explicitly supplied investigator open_case_load is strictly less than max_case_load"
    error_id: ERR_CASE_LOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /investigations/{id}/assignments"
  - priority: 12
    category: business_constraint
    check: "the explicitly supplied investigator is_investigator is true, employment_status is ACTIVE and certification_level is at least investigation.required_certification_level"
    error_id: ERR_CERTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /investigations/{id}/assignments"
  - priority: 12
    category: business_constraint
    check: "when outcome is MODIFIED, modified_days is at least 0 and strictly less than discipline.final_days"
    error_id: ERR_MODIFIED_DAYS_INVALID
    http_status: 422
    applies_to: "POST /appeals/{id}/decide"
  - priority: 13
    category: business_fiscal
    check: "interim_earnings_cents is at least 0"
    error_id: ERR_INVALID_INTERIM_EARNINGS
    http_status: 422
    applies_to: "POST /reinstatements/{id}/finalize"
  - priority: 13
    category: business_fiscal
    check: "the officer annual_salary_cents is strictly greater than 0, so a back-pay award can be computed"
    error_id: ERR_SALARY_UNKNOWN
    http_status: 422
    applies_to: "POST /reinstatements/{id}/finalize"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- reference data -------------------------------------------------------
  - method: POST
    path: "/units"
    description: "Register an organizational unit that can be a complaint subject, a routing target or a peer-comparison group member."
    roles: [SystemAdmin]
    code: 201
    input: [name, unit_role, command_code, peer_group_code, sworn_headcount, "intake_enabled?"]
    output: Unit
    side_effects: ["none; Unit is immutable once created"]
  - method: GET
    path: "/units/{id}"
    description: "Read a single unit."
    roles: [SystemAdmin, IACommander, Supervisor, Investigator, RecordsCustodian]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: GET
    path: "/units"
    description: "List units, optionally filtered by role or peer group."
    roles: [SystemAdmin, IACommander, Supervisor, Investigator, RecordsCustodian]
    code: 200
    input: ["unit_role?", "peer_group_code?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []
  - method: POST
    path: "/hearing-rooms"
    description: "Register a hearing room with a concurrent interview capacity."
    roles: [SystemAdmin]
    code: 201
    input: [facility_code, room_name, concurrent_capacity, "recording_enabled?"]
    output: HearingRoom
    side_effects: ["none; HearingRoom is immutable once created"]
  - method: GET
    path: "/hearing-rooms/{id}"
    description: "Read a single hearing room."
    roles: [SystemAdmin, IACommander, Investigator, OfficerRepresentative]
    code: 200
    input: []
    output: HearingRoom
    side_effects: []
  - method: GET
    path: "/hearing-rooms"
    description: "List hearing rooms."
    roles: [SystemAdmin, IACommander, Investigator, OfficerRepresentative]
    code: 200
    input: ["facility_code?", "limit?", "offset?"]
    output: HearingRoom[]
    side_effects: []
  # --- officers -------------------------------------------------------------
  - method: POST
    path: "/officers"
    description: "Create a sworn officer record. is_investigator defaults false, certification_level defaults 0, max_case_load defaults 5."
    roles: [SystemAdmin]
    code: 201
    input: [unit_id, badge_number, full_name, rank, assignment_type, annual_salary_cents, demographic_code, hire_date, "is_investigator?", "certification_level?", "max_case_load?"]
    output: Officer
    side_effects:
      - "initialises eis_score 0.00, eis_alert_level NONE, open_case_load 0, open_alert_count 0, imposed_suspension_days_total 0, intervention_escalation_count 0, credibility_disclosure_active false, employment_status ACTIVE"
  - method: GET
    path: "/officers/{id}"
    description: "Read a single officer including the stored EIS ledger fields."
    roles: [SystemAdmin, IACommander, Supervisor, Investigator, AppealsOfficer, RecordsCustodian, OfficerRepresentative]
    code: 200
    input: []
    output: Officer
    side_effects: []
  - method: GET
    path: "/officers"
    description: "List officers with filters used by assignment screening and EIS review."
    roles: [SystemAdmin, IACommander, Supervisor, Investigator, AppealsOfficer, RecordsCustodian]
    code: 200
    input: ["unit_id?", "is_investigator?", "employment_status?", "eis_alert_level?", "credibility_disclosure_active?", "limit?", "offset?"]
    output: Officer[]
    side_effects: []
  - method: POST
    path: "/officers/{id}/employment-status"
    description: "Move an officer between ACTIVE, SUSPENDED, RELIEVED_OF_DUTY and SEPARATED on the employment dimension."
    roles: [SystemAdmin]
    code: 200
    input: [employment_status, "reason?"]
    output: Officer
    side_effects:
      - "clears suspension_end_date when the new status is ACTIVE"
      - "a SEPARATED officer stops being an eligible investigator candidate and stops being interviewable; the caseload ledger is left untouched"
  - method: POST
    path: "/officers/{id}/activity-events"
    description: "Record a risk-relevant activity event (use of force, pursuit, sick-leave day, complaint intake) against an officer. Events are immutable."
    roles: [Supervisor, SystemAdmin]
    code: 201
    input: [event_type, "severity_code?", occurred_at, "source_reference?"]
    output: OfficerActivityEvent
    side_effects:
      - "sets base_weight from EVENT_BASE_WEIGHTS and weekday_index from occurred_at"
      - "recomputes Officer.eis_score and Officer.eis_alert_level under the ROLLING_12M variant"
      - "creates an EarlyInterventionAlert with trigger_source EVENT_INGEST and increments Officer.open_alert_count by 1 when the recomputed level is not NONE and the officer has no alert already open"
  - method: GET
    path: "/officers/{id}/activity-events"
    description: "List an officer's activity events in occurred_at ascending order."
    roles: [SystemAdmin, IACommander, Supervisor, Investigator, RecordsCustodian]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: OfficerActivityEvent[]
    side_effects: []
  - method: GET
    path: "/officers/{id}/eis-profile"
    description: "Computed read: the officer's early-intervention profile under the requested scoring variant. variant defaults to ROLLING_12M."
    roles: [SystemAdmin, IACommander, Supervisor]
    code: 200
    input: ["variant?"]
    output:
      officer_id: string
      variant: string
      window_start: string
      window_end: string
      event_count: integer
      weighted_total: decimal
      composite_score: decimal
      alert_level: string
      breached_indicators: "string[]"
      peer_pool_size: integer
      peer_mean: decimal
    side_effects: ["none; the stored Officer.eis_score is not overwritten by a read"]
  # --- complaint intake -----------------------------------------------------
  - method: POST
    path: "/complaints"
    description: "Intake a complaint from the public, a supervisor or an anonymous channel; classifies, prioritises and routes it in the same request."
    roles: [Complainant, Supervisor, IACommander]
    code: 201
    input: [intake_channel, narrative, incident_datetime, alleged_injury, reported_allegation_types, subject_unit_id, "complainant_name?", "complainant_contact?", "complainant_demographic_code?", "reporting_supervisor_officer_id?"]
    output: Complaint
    side_effects:
      - "runs calculations.complaint_classification_and_routing to set classification, priority, screening_required and assigned_unit_id"
      - "assigns intake_sequence and intake_reference_code, except for ANONYMOUS intake where the code stays null"
      - "sets received_at to the logical clock and statute_expires_at to incident_datetime plus STATUTE_DAYS"
      - "lands in SCREENING when screening_required is true, otherwise in CLASSIFIED"
  - method: GET
    path: "/complaints/{id}"
    description: "Read a single complaint."
    roles: [Complainant, Supervisor, Investigator, IACommander, RecordsCustodian, AppealsOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: GET
    path: "/complaints"
    description: "List complaints with intake, routing and outcome filters."
    roles: [Supervisor, Investigator, IACommander, RecordsCustodian, AppealsOfficer]
    code: 200
    input: ["assigned_unit_id?", "subject_unit_id?", "reporting_supervisor_officer_id?", "status?", "classification?", "intake_channel?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/complaints/{id}/allegations"
    description: "Attach a specific allegation against a named officer to a complaint."
    roles: [IACommander, Supervisor]
    code: 201
    input: [subject_officer_id, allegation_type, narrative, offense_class]
    output: Allegation
    side_effects:
      - "increments Complaint.allegation_count by 1"
      - "appends a system_generated OfficerActivityEvent of type COMPLAINT_INTAKE for the subject officer with occurred_at equal to the complaint received_at, then recomputes the officer eis_score and eis_alert_level"
  - method: GET
    path: "/allegations/{id}"
    description: "Read a single allegation including its evidence weights and disposition."
    roles: [Supervisor, Investigator, IACommander, RecordsCustodian, AppealsOfficer]
    code: 200
    input: []
    output: Allegation
    side_effects: []
  - method: GET
    path: "/allegations"
    description: "List allegations filtered by complaint, subject officer or disposition."
    roles: [Supervisor, Investigator, IACommander, RecordsCustodian, AppealsOfficer]
    code: 200
    input: ["complaint_id?", "subject_officer_id?", "disposition?", "allegation_type?", "limit?", "offset?"]
    output: Allegation[]
    side_effects: []
  - method: POST
    path: "/complaints/{id}/classify"
    description: "Screen or reclassify a complaint. screening_outcome ACCEPT moves SCREENING to CLASSIFIED or applies a reclassification override; REJECT closes intake."
    roles: [IACommander]
    code: 200
    input: [screening_outcome, "classification_override?", "rejection_reason?"]
    output: Complaint
    side_effects:
      - "re-runs calculations.complaint_classification_and_routing, updating classification, priority and assigned_unit_id"
      - "on a reclassification of a complaint that already has an Investigation, recomputes that investigation statutory_days, required_certification_level and due_at, and forces it back to UNASSIGNED with the former assignee open_case_load decremented by 1 when the new required_certification_level exceeds the assignee certification_level"
      - "on REJECT sets closed_at, retention_until and disposes every allegation WITHDRAWN"
  - method: POST
    path: "/complaints/{id}/withdraw"
    description: "Withdraw a complaint on the complainant's request, authenticated by the intake reference code issued at intake."
    roles: [Complainant, Supervisor]
    code: 200
    input: [intake_reference_code, "withdrawal_reason?"]
    output: Complaint
    side_effects:
      - "sets closed_at and retention_until from the WITHDRAWN retention class"
      - "disposes every PENDING allegation WITHDRAWN"
      - "voids the complaint's Investigation, cancels its SCHEDULED or POSTPONED interview sessions and decrements the assignee open_case_load by 1"
  - method: POST
    path: "/complaints/{id}/purge"
    description: "Redact a retention-expired complaint file. Narrative text and complainant identity are erased; outcome statistics and credibility disclosures survive."
    roles: [RecordsCustodian]
    code: 200
    input: ["purge_reason?"]
    output: Complaint
    side_effects:
      - "nulls narrative, complainant_name and complainant_contact and sets complainant_demographic_code to UNKNOWN"
      - "nulls every allegation narrative and sets allegation redacted true"
      - "sets purged_at and status PURGED; CredibilityDisclosure rows are untouched"
  # --- investigation --------------------------------------------------------
  - method: POST
    path: "/complaints/{id}/investigations"
    description: "Open the investigation for a classified complaint; computes the statutory window and the certification level the assignee must hold."
    roles: [IACommander]
    code: 201
    input: ["opening_note?"]
    output: Investigation
    side_effects:
      - "creates the Investigation in UNASSIGNED with statutory_days, required_certification_level and due_at from calculations.investigation_window"
      - "moves the Complaint from CLASSIFIED to UNDER_INVESTIGATION"
  - method: GET
    path: "/investigations/{id}"
    description: "Read a single investigation including the tolling ledger and the recomputed overdue flag."
    roles: [Supervisor, Investigator, IACommander, RecordsCustodian, AppealsOfficer]
    code: 200
    input: []
    output: Investigation
    side_effects: []
  - method: GET
    path: "/investigations"
    description: "List investigations filtered by complaint, assignee or status."
    roles: [Supervisor, Investigator, IACommander, RecordsCustodian, AppealsOfficer]
    code: 200
    input: ["complaint_id?", "assigned_investigator_officer_id?", "status?", "overdue?", "limit?", "offset?"]
    output: Investigation[]
    side_effects: []
  - method: POST
    path: "/investigations/{id}/assignments"
    description: "Assign or reassign the investigator. Omitting investigator_officer_id runs the deterministic selector of calculations.investigator_selection."
    roles: [IACommander]
    code: 200
    input: [expected_investigation_version, "investigator_officer_id?", "assignment_note?"]
    output: Investigation
    side_effects:
      - "sets assigned_investigator_officer_id and increments assignment_count by 1"
      - "increments the new assignee Officer.open_case_load by 1 and, on reassignment, decrements the previous assignee Officer.open_case_load by 1"
      - "increments Investigation.version by 1"
  - method: POST
    path: "/investigations/{id}/tolling"
    description: "Suspend or resume the statutory clock. action SUSPEND tolls an IN_PROGRESS investigation; action RESUME accrues the tolled days, and also returns a PENDING_REVIEW investigation for further work."
    roles: [Investigator, IACommander]
    code: 200
    input: [action, "tolling_reason?"]
    output: Investigation
    side_effects:
      - "on SUSPEND sets suspended_at to the logical clock"
      - "on RESUME from TOLLED adds the whole elapsed days to tolled_days, clears suspended_at and recomputes due_at from received_at"
      - "on RESUME from PENDING_REVIEW clears findings_submitted_at and returns the owning Complaint to UNDER_INVESTIGATION"
  - method: POST
    path: "/investigations/{id}/findings"
    description: "Submit the investigative findings for every allegation, recording evidence weights and the policy-compliance conclusion."
    roles: [Investigator]
    code: 200
    input: [allegation_findings, "summary?"]
    output: Investigation
    side_effects:
      - "writes evidence_weight_for, evidence_weight_against and policy_compliant onto each allegation and recomputes preponderance_met"
      - "sets findings_submitted_at, moves the Investigation to PENDING_REVIEW and the Complaint to ADJUDICATION"
  - method: POST
    path: "/investigations/{id}/close"
    description: "Close an investigation whose allegations are all disposed, which closes the complaint and starts its retention clock."
    roles: [IACommander]
    code: 200
    input: ["closing_note?"]
    output: Investigation
    side_effects:
      - "sets closed_at and decrements the assignee Officer.open_case_load by 1"
      - "moves the Complaint to CLOSED, sets its closed_at and retention_until and recomputes sustained_allegation_count"
  # --- interviews -----------------------------------------------------------
  - method: POST
    path: "/investigations/{id}/interview-sessions"
    description: "Schedule a compelled interview of a subject officer in a hearing room, subject to the notice period, the officer rest buffer and the room capacity."
    roles: [Investigator]
    code: 201
    input: [subject_officer_id, hearing_room_id, scheduled_start, scheduled_end, notice_served_at, representation_status]
    output: InterviewSession
    side_effects:
      - "computes notice_hours and duration_minutes per calculations.interview_notice_and_appeal_windows"
      - "occupies the officer buffered interval and one unit of the room concurrent capacity for the scheduled window"
      - "moves the Investigation from ASSIGNED to IN_PROGRESS on the first accepted session"
  - method: GET
    path: "/interview-sessions/{id}"
    description: "Read a single interview session."
    roles: [Investigator, IACommander, OfficerRepresentative, RecordsCustodian]
    code: 200
    input: []
    output: InterviewSession
    side_effects: []
  - method: GET
    path: "/interview-sessions"
    description: "List interview sessions filtered by investigation, subject officer, room or status."
    roles: [Investigator, IACommander, OfficerRepresentative, RecordsCustodian]
    code: 200
    input: ["investigation_id?", "subject_officer_id?", "hearing_room_id?", "status?", "limit?", "offset?"]
    output: InterviewSession[]
    side_effects: []
  - method: POST
    path: "/interview-sessions/{id}/hold"
    description: "Record that the interview was actually held, with the representation status observed at the door."
    roles: [Investigator]
    code: 200
    input: [interview_summary, "representation_status?"]
    output: InterviewSession
    side_effects:
      - "sets held_at to the logical clock and increments Investigation.interview_held_count by 1"
      - "releases the officer and room interval occupation"
  - method: POST
    path: "/interview-sessions/{id}/postpone"
    description: "Postpone a scheduled interview and re-book it in one request; the session leaves SCHEDULED, passes through POSTPONED and returns to SCHEDULED with the new times."
    roles: [Investigator, OfficerRepresentative]
    code: 200
    input: [new_scheduled_start, new_scheduled_end, new_notice_served_at, postpone_reason, "hearing_room_id?"]
    output: InterviewSession
    side_effects:
      - "increments postpone_count by 1 and rewrites scheduled_start, scheduled_end, notice_served_at, notice_hours and duration_minutes"
      - "releases the old officer and room occupation and takes the new one, re-running both overlap calculations"
  # --- adjudication and discipline -----------------------------------------
  - method: POST
    path: "/allegations/{id}/disposition"
    description: "Adjudicate one allegation under the preponderance standard. A SUSTAINED disposition proposes discipline from the presumptive matrix and drives the early-intervention cascade."
    roles: [IACommander]
    code: 200
    input: [disposition, "aggravator_count?", "mitigator_count?", "rationale?"]
    output: Allegation
    side_effects:
      - "sets disposed_at and prior_sustained_count_at_disposition"
      - "on SUSTAINED creates a Discipline in PROPOSED with presumptive_prior_tier and presumptive_days from the PRESUMPTIVE variant, increments Complaint.sustained_allegation_count by 1, appends a COMPLAINT_SUSTAINED activity event, recomputes the officer eis_score and eis_alert_level, creates an EarlyInterventionAlert with trigger_source DISPOSITION_CASCADE when the level is not NONE, and creates an ACTIVE CredibilityDisclosure when allegation_type is UNTRUTHFULNESS"
      - "on any other disposition sets disposed_at only"
  - method: GET
    path: "/disciplines/{id}"
    description: "Read a single discipline record with both the presumptive and the final matrix results."
    roles: [IACommander, AppealsOfficer, OfficerRepresentative, RecordsCustodian]
    code: 200
    input: []
    output: Discipline
    side_effects: []
  - method: GET
    path: "/disciplines"
    description: "List discipline records filtered by allegation, officer or status."
    roles: [IACommander, AppealsOfficer, OfficerRepresentative, RecordsCustodian]
    code: 200
    input: ["allegation_id?", "officer_id?", "status?", "limit?", "offset?"]
    output: Discipline[]
    side_effects: []
  - method: POST
    path: "/disciplines/{id}/impose"
    description: "Impose the proposed discipline. Recomputes the matrix under the FINAL variant, which may diverge from the presumptive result, and starts the appeal window."
    roles: [IACommander]
    code: 200
    input: [effective_date, "aggravator_count?", "mitigator_count?"]
    output: Discipline
    side_effects:
      - "sets final_prior_tier, final_days and effective_days from the FINAL variant"
      - "sets imposed_at and appeal_deadline_at"
      - "adds final_days to Officer.imposed_suspension_days_total and moves an ACTIVE officer to SUSPENDED with suspension_end_date set"
  - method: POST
    path: "/disciplines/{id}/appeals"
    description: "File an appeal of imposed discipline through arbitration or civil service, within the appeal window."
    roles: [OfficerRepresentative]
    code: 201
    input: [forum, grounds]
    output: Appeal
    side_effects:
      - "sets filed_at to the logical clock and days_to_file from imposed_at"
      - "moves the Discipline from IMPOSED to APPEALED; the suspension-day ledger is untouched while the appeal is pending"
  - method: GET
    path: "/appeals/{id}"
    description: "Read a single appeal."
    roles: [IACommander, AppealsOfficer, OfficerRepresentative, RecordsCustodian]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "List appeals filtered by discipline, forum or status."
    roles: [IACommander, AppealsOfficer, OfficerRepresentative, RecordsCustodian]
    code: 200
    input: ["discipline_id?", "forum?", "status?", "outcome?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{id}/hear"
    description: "Record that the arbitration or civil-service hearing took place."
    roles: [AppealsOfficer]
    code: 200
    input: ["hearing_notes?"]
    output: Appeal
    side_effects: ["sets heard_at to the logical clock"]
  - method: POST
    path: "/appeals/{id}/decide"
    description: "Decide the appeal. OVERTURNED reverses the discipline, the officer ledger, the sustained finding and any credibility disclosure, and opens a reinstatement."
    roles: [AppealsOfficer]
    code: 200
    input: [outcome, "modified_days?"]
    output: Appeal
    side_effects:
      - "sets outcome and decided_at"
      - "on UPHELD leaves effective_days and the officer ledger unchanged"
      - "on MODIFIED sets Discipline.effective_days to modified_days, adjusts Officer.imposed_suspension_days_total by the delta and creates a Reinstatement for the reversed days"
      - "on OVERTURNED sets effective_days 0, subtracts final_days from Officer.imposed_suspension_days_total, returns a SUSPENDED officer to ACTIVE only when that total reaches exactly 0, moves the Allegation to OVERTURNED_ON_APPEAL, expunges its CredibilityDisclosure and creates a Reinstatement for the full final_days"
  - method: GET
    path: "/appeals/{id}/reinstatements"
    description: "List the reinstatement records created by an appeal decision; the array is length 0 or 1."
    roles: [AppealsOfficer, IACommander, OfficerRepresentative, RecordsCustodian]
    code: 200
    input: ["status?"]
    output: Reinstatement[]
    side_effects: []
  - method: POST
    path: "/reinstatements/{id}/finalize"
    description: "Finalize the back-pay award: gross pay per pay period, the interim-earnings offset and simple interest on the net."
    roles: [AppealsOfficer]
    code: 200
    input: [interim_earnings_cents]
    output: Reinstatement
    side_effects:
      - "computes gross_back_pay_cents, net_back_pay_cents, interest_cents and total_award_cents per calculations.reinstatement_back_pay"
      - "sets finalized_at to the logical clock"
  # --- early intervention ---------------------------------------------------
  - method: POST
    path: "/eis-runs"
    description: "Run the early-intervention sweep: rescore officers, promote or create alerts, mark overdue check-ins MISSED and expire non-permanent credibility disclosures."
    roles: [IACommander, SystemAdmin]
    code: 200
    input: ["officer_id?"]
    output:
      run_sequence: integer
      evaluated_officer_count: integer
      alerts_created: integer
      alerts_promoted: integer
      checkins_missed: integer
      disclosures_expired: integer
    side_effects:
      - "recomputes Officer.eis_score and Officer.eis_alert_level under the ROLLING_12M variant for every ACTIVE officer, or for the single officer when officer_id is supplied"
      - "creates an EarlyInterventionAlert with trigger_source EIS_RUN and increments Officer.open_alert_count by 1 for each officer whose level is not NONE and who has no alert already open"
      - "refreshes each officer's existing open alert composite_score, score_variant, alert_level and breached_indicators to the recomputed values and stamps run_sequence"
      - "promotes an OPEN alert to PLAN_REQUIRED when the recomputed level reaches ALERT or CRITICAL"
      - "moves every PENDING MonitoringCheckIn whose due_at is past to MISSED"
      - "moves every ACTIVE CredibilityDisclosure with permanent_retention false past its retention_until to EXPIRED and recomputes Officer.credibility_disclosure_active"
  - method: GET
    path: "/eis-alerts/{id}"
    description: "Read a single early-intervention alert."
    roles: [IACommander, Supervisor, SystemAdmin, RecordsCustodian]
    code: 200
    input: []
    output: EarlyInterventionAlert
    side_effects: []
  - method: GET
    path: "/eis-alerts"
    description: "List early-intervention alerts filtered by officer, status or level."
    roles: [IACommander, Supervisor, SystemAdmin, RecordsCustodian]
    code: 200
    input: ["officer_id?", "status?", "alert_level?", "score_variant?", "limit?", "offset?"]
    output: EarlyInterventionAlert[]
    side_effects: []
  - method: POST
    path: "/eis-alerts/{id}/dismiss"
    description: "Dismiss an alert as not indicating risk. Only possible before any intervention plan is attached."
    roles: [IACommander]
    code: 200
    input: [dismissal_reason]
    output: EarlyInterventionAlert
    side_effects:
      - "sets status DISMISSED and dismissal_reason"
      - "decrements Officer.open_alert_count by 1"
  - method: POST
    path: "/eis-alerts/{id}/intervention-plans"
    description: "Create a non-disciplinary intervention plan for an alert, naming the monitoring supervisor and the check-in cadence. Also used to re-plan an ESCALATED alert."
    roles: [Supervisor, IACommander]
    code: 201
    input: [expected_alert_version, supervisor_officer_id, required_checkin_count, duration_days, interventions]
    output: InterventionPlan
    side_effects:
      - "creates the plan in DRAFT, increments EarlyInterventionAlert.plan_count by 1"
      - "increments EarlyInterventionAlert.version by 1"
      - "moves an ESCALATED alert back to PLAN_REQUIRED"
  - method: GET
    path: "/intervention-plans/{id}"
    description: "Read a single intervention plan with its monitoring counters and compliance score."
    roles: [IACommander, Supervisor, SystemAdmin, RecordsCustodian]
    code: 200
    input: []
    output: InterventionPlan
    side_effects: []
  - method: GET
    path: "/intervention-plans"
    description: "List intervention plans filtered by alert, subject officer, monitoring supervisor or status."
    roles: [IACommander, Supervisor, SystemAdmin, RecordsCustodian]
    code: 200
    input: ["alert_id?", "officer_id?", "supervisor_officer_id?", "status?", "limit?", "offset?"]
    output: InterventionPlan[]
    side_effects: []
  - method: POST
    path: "/intervention-plans/{id}/activate"
    description: "Activate a draft plan, which materialises the monitoring check-in schedule and moves the alert to PLAN_ACTIVE."
    roles: [Supervisor]
    code: 200
    input: ["activation_note?"]
    output: InterventionPlan
    side_effects:
      - "sets activated_at to the logical clock and end_date to activated_at plus duration_days"
      - "creates required_checkin_count MonitoringCheckIn rows in PENDING with due_at per calculations.checkin_schedule"
      - "moves the owning EarlyInterventionAlert from PLAN_REQUIRED to PLAN_ACTIVE"
  - method: GET
    path: "/intervention-plans/{id}/check-ins"
    description: "List the plan's monitoring check-ins in sequence_index ascending order."
    roles: [IACommander, Supervisor, SystemAdmin, RecordsCustodian]
    code: 200
    input: ["status?", "outcome?"]
    output: MonitoringCheckIn[]
    side_effects: []
  - method: POST
    path: "/check-ins/{id}/complete"
    description: "Record a supervisor monitoring check-in. Only an on-time completion counts toward the compliance score."
    roles: [Supervisor]
    code: 200
    input: [outcome, "notes?"]
    output: MonitoringCheckIn
    side_effects:
      - "sets completed_at to the logical clock, on_time from the due_at comparison and outcome"
      - "increments InterventionPlan.completed_checkin_count, and on_time_checkin_count when on_time, and concern_count when the outcome is CONCERN"
      - "recomputes InterventionPlan.compliance_score"
  - method: POST
    path: "/intervention-plans/{id}/close"
    description: "Close an intervention plan once no check-in is still pending. A compliance score below the success floor, or a new alert during the plan window, escalates instead of succeeding."
    roles: [Supervisor, IACommander]
    code: 200
    input: ["closing_note?"]
    output: InterventionPlan
    side_effects:
      - "sets compliance_score and closed_at"
      - "on success moves the plan to CLOSED_SUCCESS and the owning alert to CLOSED_SUCCESS, decrementing Officer.open_alert_count by 1"
      - "on failure moves the plan and the owning alert to ESCALATED, increments Officer.intervention_escalation_count by 1 and raises Officer.eis_alert_level one band capped at CRITICAL"
  # --- records, disclosure and reporting ------------------------------------
  - method: GET
    path: "/credibility-disclosures/{id}"
    description: "Read a single officer-credibility disclosure record."
    roles: [RecordsCustodian, IACommander, AppealsOfficer, OfficerRepresentative]
    code: 200
    input: []
    output: CredibilityDisclosure
    side_effects: []
  - method: GET
    path: "/credibility-disclosures"
    description: "List credibility disclosures filtered by officer, source allegation or status."
    roles: [RecordsCustodian, IACommander, AppealsOfficer, OfficerRepresentative]
    code: 200
    input: ["officer_id?", "source_allegation_id?", "status?", "basis?", "limit?", "offset?"]
    output: CredibilityDisclosure[]
    side_effects: []
  - method: POST
    path: "/credibility-disclosures/{id}/release"
    description: "Record a disclosure of the officer-credibility record to a requesting party such as a prosecutor or defense counsel."
    roles: [RecordsCustodian]
    code: 200
    input: [requesting_party]
    output: CredibilityDisclosure
    side_effects:
      - "increments release_count by 1 and sets last_released_at to the logical clock"
  - method: GET
    path: "/reports/complaint-outcomes"
    description: "Computed read: public reporting on complaint outcomes, optionally broken down by complainant demographic code or intake channel, with small-cell suppression applied."
    roles: [RecordsCustodian, IACommander, SystemAdmin]
    code: 200
    input: [period_start, period_end, "breakdown?"]
    output:
      period_start: string
      period_end: string
      breakdown: string
      total_complaints: integer
      sustained_complaints: integer
      sustain_rate_pct: decimal
      suppression_min_cell: integer
      groups: "object[]"
    side_effects: ["none; the report is derived on read"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock that every deadline, window and expiry rule reads. Before any call the logical clock reads exactly the startup default 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
      previous_utc: string
    side_effects: ["no entity is mutated; subsequent requests evaluate every temporal rule against the new logical clock"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or the role is not permitted on the target endpoint"
  - id: ERR_NOT_ASSIGNED_INVESTIGATOR
    http: 403
    condition: "the acting user is not the investigation's assigned investigator"
  - id: ERR_NOT_PLAN_SUPERVISOR
    http: 403
    condition: "the acting Supervisor is not the intervention plan's monitoring supervisor"
  - id: ERR_INTAKE_CODE_MISMATCH
    http: 403
    condition: "the intake_reference_code supplied on a withdrawal does not match the complaint's issued code"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting commander is the case's assigned investigator or the allegation's subject officer"
  # not found
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "a referenced Unit id does not resolve"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "a referenced HearingRoom id does not resolve"
  - id: ERR_OFFICER_NOT_FOUND
    http: 404
    condition: "a referenced Officer id does not resolve, in the path or in the body"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "a referenced Complaint id does not resolve"
  - id: ERR_ALLEGATION_NOT_FOUND
    http: 404
    condition: "a referenced Allegation id does not resolve"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "a referenced Investigation id does not resolve"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "a referenced InterviewSession id does not resolve"
  - id: ERR_DISCIPLINE_NOT_FOUND
    http: 404
    condition: "a referenced Discipline id does not resolve"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "a referenced Appeal id does not resolve"
  - id: ERR_REINSTATEMENT_NOT_FOUND
    http: 404
    condition: "a referenced Reinstatement id does not resolve"
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "a referenced EarlyInterventionAlert id does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "a referenced InterventionPlan id does not resolve"
  - id: ERR_CHECKIN_NOT_FOUND
    http: 404
    condition: "a referenced MonitoringCheckIn id does not resolve"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "a referenced CredibilityDisclosure id does not resolve"
  # schema
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "the body fails schema validation: a required field is missing, a type is wrong, an enum value is outside its domain, or a numeric value is outside its declared range"
  # concurrency
  - id: ERR_STALE_INVESTIGATION_VERSION
    http: 412
    condition: "expected_investigation_version does not equal the investigation's current version"
  - id: ERR_STALE_ALERT_VERSION
    http: 412
    condition: "expected_alert_version does not equal the alert's current version"
  # state
  - id: ERR_COMPLAINT_STATE_INVALID
    http: 409
    condition: "the complaint is not in a state from which the requested operation is a declared transition"
  - id: ERR_COMPLAINT_NOT_PURGEABLE
    http: 409
    condition: "the complaint is not CLOSED or WITHDRAWN, or has already been purged"
  - id: ERR_INVESTIGATION_STATE_INVALID
    http: 409
    condition: "the investigation is not in a state from which the requested operation is a declared transition"
  - id: ERR_INVESTIGATION_NOT_INTERVIEWABLE
    http: 409
    condition: "the investigation is not ASSIGNED or IN_PROGRESS, so no interview may be scheduled against it"
  - id: ERR_OFFICER_SEPARATED
    http: 409
    condition: "the subject officer employment_status is SEPARATED and can no longer be compelled to interview, be disciplined, or have the employment dimension moved again"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "the interview session is not SCHEDULED"
  - id: ERR_ALLEGATION_ALREADY_DISPOSED
    http: 409
    condition: "the allegation disposition is no longer PENDING"
  - id: ERR_DISCIPLINE_STATE_INVALID
    http: 409
    condition: "the discipline is not PROPOSED for impose, or not IMPOSED for appeal filing"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "the appeal is not FILED for hear, or not HEARD for decide"
  - id: ERR_REINSTATEMENT_ALREADY_FINALIZED
    http: 409
    condition: "the reinstatement is already FINALIZED"
  - id: ERR_ALERT_STATE_INVALID
    http: 409
    condition: "the alert is not in a state from which the requested operation is a declared transition"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "the intervention plan is not DRAFT for activate, or not ACTIVE for close"
  - id: ERR_CHECKIN_NOT_PENDING
    http: 409
    condition: "the monitoring check-in is not PENDING, or its owning plan is not ACTIVE"
  - id: ERR_DISCLOSURE_NOT_ACTIVE
    http: 409
    condition: "the credibility disclosure is EXPUNGED or EXPIRED and can no longer be released"
  # business safety
  - id: ERR_INVESTIGATOR_CONFLICT
    http: 422
    condition: "the nominated investigator is a subject officer, shares a unit with a subject officer, or is the acting commander"
  - id: ERR_INSUFFICIENT_NOTICE
    http: 422
    condition: "notice_hours from notice_served_at to scheduled_start is below MIN_NOTICE_HOURS"
  - id: ERR_REPRESENTATION_NOT_PRESENT
    http: 409
    condition: "the interview would be held while representation_status is still REP_REQUESTED"
  - id: ERR_CREDIBILITY_HOLD
    http: 409
    condition: "an ACTIVE credibility disclosure, or a sustained untruthfulness finding, blocks the purge of the complaint file"
  - id: ERR_APPEAL_PENDING
    http: 409
    condition: "an appeal arising from the complaint is still FILED or HEARD"
  # business referential
  - id: ERR_NO_ALLEGATIONS
    http: 422
    condition: "an investigation was requested for a complaint with no allegations"
  - id: ERR_INVESTIGATION_ALREADY_EXISTS
    http: 409
    condition: "the complaint already has an investigation"
  - id: ERR_FINDINGS_INCOMPLETE
    http: 422
    condition: "allegation_findings does not cover every allegation of the complaint exactly once"
  - id: ERR_NO_INTERVIEW_HELD
    http: 422
    condition: "findings were submitted before any interview was held"
  - id: ERR_PENDING_DISPOSITIONS
    http: 409
    condition: "the investigation cannot be closed while an allegation is still PENDING"
  - id: ERR_NO_INTAKE_UNIT
    http: 422
    condition: "no Unit with unit_role INTERNAL_AFFAIRS exists to receive the routing"
  - id: ERR_NO_ELIGIBLE_INVESTIGATOR
    http: 422
    condition: "the deterministic selector found no eligible investigator"
  - id: ERR_ALERT_ALREADY_OPEN
    http: 409
    condition: "a targeted eis-run named an officer whose alert is ESCALATED and therefore awaiting a replacement intervention plan"
  - id: ERR_PENDING_CHECKINS
    http: 409
    condition: "the plan cannot be closed while a monitoring check-in is still PENDING"
  - id: ERR_PLAN_EXISTS
    http: 409
    condition: "the alert cannot be dismissed because an intervention plan is already attached"
  # business temporal
  - id: ERR_STATUTE_EXPIRED
    http: 422
    condition: "the incident is older than STATUTE_DAYS at intake"
  - id: ERR_EVENT_IN_FUTURE
    http: 422
    condition: "an activity event occurred_at is after the logical clock"
  - id: ERR_INVALID_SESSION_WINDOW
    http: 422
    condition: "scheduled_end is not after scheduled_start, or scheduled_start is not after the logical clock"
  - id: ERR_OFFICER_REST_BUFFER_CONFLICT
    http: 409
    condition: "the subject officer already has a session whose interval falls inside the candidate interval widened by OFFICER_REST_BUFFER_MINUTES on both ends"
  - id: ERR_ROOM_CAPACITY_EXCEEDED
    http: 409
    condition: "the room already holds concurrent_capacity overlapping sessions for the candidate window"
  - id: ERR_INTERVIEW_NOT_STARTED
    http: 409
    condition: "the interview cannot be held before its scheduled_start"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "the appeal was filed after the discipline's appeal_deadline_at"
  - id: ERR_RETENTION_NOT_EXPIRED
    http: 409
    condition: "the logical clock has not reached the complaint's retention_until"
  - id: ERR_INVALID_REPORT_PERIOD
    http: 422
    condition: "period_start is after period_end"
  # business constraint
  - id: ERR_PREPONDERANCE_NOT_MET
    http: 422
    condition: "a SUSTAINED disposition was requested but support_pct does not exceed PREPONDERANCE_THRESHOLD_PCT"
  - id: ERR_DISPOSITION_NOT_SUPPORTED
    http: 422
    condition: "UNFOUNDED was requested with non-zero evidence_weight_for, or EXONERATED or POLICY_FAILURE was requested without policy_compliant true"
  - id: ERR_MAX_POSTPONEMENTS_REACHED
    http: 409
    condition: "postpone_count already equals MAX_POSTPONEMENTS"
  - id: ERR_MAX_RECLASSIFICATIONS_REACHED
    http: 409
    condition: "reclassification_count already equals MAX_RECLASSIFICATIONS, or the override equals the stored classification"
  - id: ERR_COMPLAINANT_IDENTITY_REQUIRED
    http: 422
    condition: "a PUBLIC or SUPERVISOR intake omitted complainant_name or complainant_contact, or an ANONYMOUS intake supplied them"
  - id: ERR_ANONYMOUS_NOT_WITHDRAWABLE
    http: 422
    condition: "a withdrawal was attempted on an ANONYMOUS complaint, which has no reference code"
  - id: ERR_SUSTAINED_NOT_WITHDRAWABLE
    http: 409
    condition: "a withdrawal was attempted on a complaint that already carries a sustained allegation"
  - id: ERR_BADGE_NUMBER_DUPLICATE
    http: 409
    condition: "badge_number is already used by another officer"
  - id: ERR_CASE_LOAD_EXCEEDED
    http: 422
    condition: "the nominated investigator open_case_load already equals max_case_load"
  - id: ERR_CERTIFICATION_INSUFFICIENT
    http: 422
    condition: "the nominated investigator is not an active certified investigator at the level the case requires"
  - id: ERR_MODIFIED_DAYS_INVALID
    http: 422
    condition: "modified_days is negative, absent for a MODIFIED outcome, or not strictly less than final_days"
  # business fiscal
  - id: ERR_INVALID_INTERIM_EARNINGS
    http: 422
    condition: "interim_earnings_cents is negative"
  - id: ERR_SALARY_UNKNOWN
    http: 422
    condition: "the officer annual_salary_cents is not greater than 0, so back pay cannot be computed"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Complainant
    description: "A member of the public who filed a complaint. Holds no persisted record; authority over the complaint file is proven by the intake reference code issued at intake, which is why an anonymous complaint can never be withdrawn."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /complaints"
      - "POST /complaints/{id}/withdraw"
      - "GET /complaints/{id}"
  - name: Supervisor
    description: "A sworn supervisor who files complaints on behalf of the department, records officer activity events and monitors non-disciplinary intervention plans."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /officers/{id}/activity-events"
      - "POST /intervention-plans/{id}/activate"
      - "POST /check-ins/{id}/complete"
    shared_operations:
      - "POST /complaints"
      - "POST /complaints/{id}/allegations"
      - "POST /complaints/{id}/withdraw"
      - "POST /eis-alerts/{id}/intervention-plans"
      - "POST /intervention-plans/{id}/close"
      - "the officer, complaint, allegation, investigation, session, alert and plan read endpoints"
  - name: Investigator
    description: "A certified internal-affairs investigator. Acts only on the investigations assigned to them: schedules and holds interviews, tolls the statutory clock and submits findings. Never adjudicates."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /investigations/{id}/interview-sessions"
      - "POST /interview-sessions/{id}/hold"
      - "POST /investigations/{id}/findings"
    shared_operations:
      - "POST /investigations/{id}/tolling"
      - "POST /interview-sessions/{id}/postpone"
      - "the complaint, allegation, investigation and session read endpoints"
  - name: IACommander
    description: "The internal-affairs commander. Screens and classifies intake, opens investigations, assigns investigators, adjudicates allegations, imposes discipline and manages early-intervention alerts. Segregation of duties forbids adjudicating a case they investigated or a case naming them as subject."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /complaints/{id}/classify"
      - "POST /complaints/{id}/investigations"
      - "POST /investigations/{id}/assignments"
      - "POST /investigations/{id}/close"
      - "POST /allegations/{id}/disposition"
      - "POST /disciplines/{id}/impose"
      - "POST /eis-alerts/{id}/dismiss"
    shared_operations:
      - "POST /complaints"
      - "POST /complaints/{id}/allegations"
      - "POST /investigations/{id}/tolling"
      - "POST /eis-runs"
      - "POST /eis-alerts/{id}/intervention-plans"
      - "POST /intervention-plans/{id}/close"
      - "every read endpoint except the hearing-room reads"
  - name: AppealsOfficer
    description: "The arbitrator or civil-service examiner who hears and decides appeals and finalizes reinstatement awards. Operational identity only; never an officer of the department."
    identity: opaque
    exclusive_operations:
      - "POST /appeals/{id}/hear"
      - "POST /appeals/{id}/decide"
      - "POST /reinstatements/{id}/finalize"
    shared_operations:
      - "the complaint, allegation, investigation, discipline, appeal and reinstatement read endpoints"
  - name: OfficerRepresentative
    description: "The collective-bargaining representative acting for a subject officer. Postpones interviews and files appeals; never investigates or adjudicates."
    identity: opaque
    exclusive_operations:
      - "POST /disciplines/{id}/appeals"
    shared_operations:
      - "POST /interview-sessions/{id}/postpone"
      - "the officer, session, discipline, appeal, reinstatement and disclosure read endpoints"
  - name: RecordsCustodian
    description: "The records custodian who purges retention-expired complaint files, releases officer-credibility records to requesting parties and produces the public outcome report."
    identity: opaque
    exclusive_operations:
      - "POST /complaints/{id}/purge"
      - "POST /credibility-disclosures/{id}/release"
    shared_operations:
      - "GET /reports/complaint-outcomes"
      - "the complaint, allegation, investigation, session, discipline, appeal and disclosure read endpoints"
  - name: SystemAdmin
    description: "Operational administrator: seeds units, hearing rooms and officer records, moves officers along the employment dimension, runs the early-intervention sweep and sets the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /units"
      - "POST /hearing-rooms"
      - "POST /officers"
      - "POST /officers/{id}/employment-status"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /officers/{id}/activity-events"
      - "POST /eis-runs"
      - "GET /reports/complaint-outcomes"
      - "the unit, hearing-room, officer, alert and plan read endpoints"
