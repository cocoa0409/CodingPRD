              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${p1v2}" }
              as: Underwriter
            - call: "POST /policies/${pol1}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "26 EE St", territory_code: "STANDARD", effective_date: "2026-06-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { pol2: $.data.id, p2v0: $.data.version }
            - call: "POST /policies/${pol2}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${p2v0}" }
              as: Underwriter
              captures: { p2v1: $.data.version }
            - call: "POST /policies/${pol2}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${p2v1}" }
              as: Underwriter
              captures: { p2v2: $.data.version }
            - call: "POST /policies/${pol2}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${p2v2}" }
              as: Underwriter
          trigger:
            - call: "POST /policies/${pol2}/issue"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TERM_OVERLAP"

      - name: loss_of_use_displacement_closed_interval_shared_boundary_rejected
        grounds:
          - state_machines.Claim.FILED_to_UNDER_REVIEW
          - validations[priority=16]
          - errors[ERR_DISPLACEMENT_OVERLAP]
        distinguishing_aspect: |
          Closed-interval-with-shared-boundary semantics on LOSS_OF_USE Claim
          displacement (different entity and different interval arithmetic than
          the half-open Policy term): a second LOSS_OF_USE claim displacement
          [2026-04-10, 2026-04-20] sharing the endpoint 2026-04-10 with an
          existing [2026-04-01, 2026-04-10] is rejected ERR_DISPLACEMENT_OVERLAP.
        test_recipe:
          setup:
            - "An ACTIVE policy with one non-terminal LOSS_OF_USE claim whose displacement is [2026-04-01, 2026-04-10]."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "to2@x.com", full_name: "TO Two", mailing_address: "16 P St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "27 FF St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { v1: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1}" }
              as: Underwriter
              captures: { v2: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${v2}" }
              as: Underwriter
            - call: "POST /policies/${pol}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol}/claims"
              payload: { loss_type: "LOSS_OF_USE", loss_date: "2026-04-01T00:00:00Z", displacement_start: "2026-04-01T00:00:00Z", displacement_end: "2026-04-10T00:00:00Z" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim1: $.data.id }
          trigger:
            - call: "POST /policies/${pol}/claims"
              payload: { loss_type: "LOSS_OF_USE", loss_date: "2026-04-15T00:00:00Z", displacement_start: "2026-04-10T00:00:00Z", displacement_end: "2026-04-20T00:00:00Z" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DISPLACEMENT_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reverse_approval_restores_coverage_limit_exactly
        grounds:
          - state_machines.Claim.APPROVED_to_DENIED
          - calculations.coverage_limit_ledger
          - entities.CoverageLine.fields.settled_cents
          - entities.CoverageLine.fields.remaining_limit_cents
        distinguishing_aspect: |
          Conserved quantity #1 (coverage limit): for the referenced CoverageLine,
          limit_cents == remaining_limit_cents + settled_cents always; approving a
          95000 claim debits then reverse-approval credits back so settled_cents
          returns to 0 and remaining_limit_cents returns to 3000000 (no drift).
        test_recipe:
          setup:
            - "An ACTIVE RCV policy (pp limit 3000000, deductible 25000) with an APPROVED PERSONAL_PROPERTY claim (one item rc=120000, settlement 95000 debited)."
          setup_api_calls:
            - call: "POST /policyholders"
              payload: { email: "ci1@x.com", full_name: "CI One", mailing_address: "17 Q St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "28 GG St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { cl_pp: $.data.id, v1: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1}" }
              as: Underwriter
              captures: { v2: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${v2}" }
              as: Underwriter
            - call: "POST /policies/${pol}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol}/claims"
              payload: { loss_type: "PERSONAL_PROPERTY", loss_date: "2026-03-01T00:00:00Z" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/items"
              payload: { coverage_line_id: "${cl_pp}", replacement_cost_cents: 120000, age_months: 0, useful_life_months: 60 }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /claims/${claim}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim}/approve"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /claims/${claim}/reverse-approval"
              payload: { denial_reason: "fraud re-investigation" }
              as: ClaimsAdjuster
          assert:
            - "CoverageLine.${cl_pp}.settled_cents == 0"
            - "CoverageLine.${cl_pp}.remaining_limit_cents == 3000000"
            - "CoverageLine.${cl_pp}.status == OPEN"
            - "Claim.${claim}.settlement_cents == 0"

      - name: payment_void_restores_invoice_balance_exactly
        grounds:
          - state_machines.PremiumInvoice.PAID_to_OPEN
          - entities.PremiumInvoice.fields.balance_due_cents
          - entities.PremiumInvoice.fields.paid_cents
          - entities.Payment.fields.status
        distinguishing_aspect: |
          Conserved quantity #2 (billed money, a DIFFERENT conserved quantity than
          coverage limit): paying an invoice in full then voiding the payment
          restores balance_due_cents to amount_cents 33350 and paid_cents to 0,
          and reopens the invoice — no money drift.
        test_recipe:
          setup:
            - "An ACTIVE standard policy with its invoice fully paid (33350) and status PAID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /policyholders"
              payload: { email: "ci2@x.com", full_name: "CI Two", mailing_address: "18 R St" }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /policies"
              payload: { policyholder_id: "${ph_id}", insured_address: "29 HH St", territory_code: "STANDARD", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", deductible_cents: 25000, pp_valuation_method: "RCV", billing_mode: "ANNUAL" }
              as: Underwriter
              captures: { pol: $.data.id, v0: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "PERSONAL_PROPERTY", limit_cents: 3000000, expected_policy_version: "${v0}" }
              as: Underwriter
              captures: { v1: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LIABILITY", limit_cents: 10000000, expected_policy_version: "${v1}" }
              as: Underwriter
              captures: { v2: $.data.version }
            - call: "POST /policies/${pol}/coverage-lines"
              payload: { coverage_type: "LOSS_OF_USE", limit_cents: 900000, expected_policy_version: "${v2}" }
              as: Underwriter
            - call: "POST /policies/${pol}/issue"
              payload: {}
              as: Underwriter
            - call: "GET /premium-invoices?policy_id=${pol}"
              payload: {}
              as: Underwriter
              captures: { inv: "$.data[0].id" }
            - call: "POST /premium-invoices/${inv}/payments"
              payload: { amount_cents: 33350, method: "CARD" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { pay: $.data.id }
          trigger:
            - call: "POST /payments/${pay}/void"
              payload: {}
              as: Underwriter
          assert:
            - "PremiumInvoice.${inv}.paid_cents == 0"
            - "PremiumInvoice.${inv}.balance_due_cents == 33350"
            - "PremiumInvoice.${inv}.status == OPEN"
            - "Payment.${pay}.status == VOIDED"
