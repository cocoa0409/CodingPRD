  # =====================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deposit_post_triggers_resource_cascade
        grounds:
          - state_machines.Deposit.RECEIVED_to_POSTED
          - entities.Client.fields.countable_resources_cents
          - entities.SpendDownPlan.fields.auto_created
          - calculations.spend_down_excess
        distinguishing_aspect: |
          Depth-3 chain from the deposit-post trigger: deposit POSTED mutates
          TrustAccount.balance (link 1), that recomputes Client.countable_resources
          across the 200000 threshold (link 2), and the threshold crossing itself
          auto-creates a DRAFT SpendDownPlan with provisional excess 110000 (link 3).
        test_recipe:
          setup:
            - "ACTIVE medicaid client (limit 200000), VERIFIED SSI 80000/mo open from 2026-01-01, OPERATING account, ACTIVE bond; 150000 already posted (countable 150000, no auto plan yet)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Lena Moss", date_of_birth: "1970-09-09", ssn_last4: "8642", county_of_residence: "TRV", medicaid_enrolled: true }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-RC-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 150000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d1_id: $.data.id } }
            - { call: "POST /deposits/${d1_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /spend-down-plans?client_id=${c_id}", payload: {}, as: CaseManager, captures: { plans_before: $.data } }
          trigger:
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "SSA_BENEFIT", amount_cents: 80000, received_date: "2026-06-05", entitlement_id: "${e_id}" }, as: FinancialOfficer, captures: { d2_id: $.data.id } }
            - { call: "POST /deposits/${d2_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /trust-accounts/${a_id}", payload: {}, as: FinancialOfficer, captures: { bal: $.data.balance_cents } }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { countable: $.data.countable_resources_cents, at_risk: $.data.medicaid_at_risk } }
            - { call: "GET /spend-down-plans?client_id=${c_id}", payload: {}, as: CaseManager, captures: { auto_plan_id: "$.data[0].id", auto_plan_status: "$.data[0].status", auto_plan_flag: "$.data[0].auto_created", auto_plan_prov: "$.data[0].provisional_excess_cents", auto_plan_month: "$.data[0].target_month" } }
          assert:
            - "plans_before is an empty array (150000 <= 200000: no auto-create on first post)"
            - "bal == 230000 (link 1: account balance recomputed)"
            - "countable == 230000 and at_risk == true (link 2: client resources crossed strictly above limit)"
            - "auto_plan_flag == true and auto_plan_status == DRAFT and auto_plan_month == '2026-06' (link 3: system-created plan)"
            - "auto_plan_prov == 110000 (max(0, 230000 + 80000 - 200000) PROVISIONAL)"

      - name: audit_misuse_triggers_suspension_cascade
        grounds:
          - state_machines.AuditCase.FINDINGS_ISSUED_to_MISUSE_CONFIRMED
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - state_machines.TrustAccount.OPEN_to_FROZEN
          - state_machines.Disbursement.REQUESTED_to_REJECTED
        distinguishing_aspect: |
          Different trigger from deposit-post: audit close with misuse > 0
          mutates Client -> SUSPENDED (link 1), the suspension freezes accounts
          (link 2), and each account freeze rejects its pending disbursements
          (link 3) — every link caused by the previous one, not by the close call.
        test_recipe:
          setup:
            - "ACTIVE client with OPERATING account, DRAFT budget plan, one REQUESTED disbursement d1 and one APPROVED disbursement d2; audit in FINDINGS_ISSUED with misuse_amount_cents 5000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Glenn Hale", date_of_birth: "1955-12-01", ssn_last4: "4321", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSDI", monthly_benefit_cents: 90000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-MC-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee One", category: "HOUSING", amount_cents: 5000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { d1_id: $.data.id } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee Two", category: "HOUSING", amount_cents: 6000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { d2_id: $.data.id } }
            - { call: "POST /disbursements/${d2_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /audit-cases", payload: { client_id: "${c_id}", authority: "SSA", scope: "CLIENT_ACCOUNT", period_start_date: "2026-01-01", period_end_date: "2026-05-31" }, as: ComplianceAuditor, captures: { au_id: $.data.id } }
            - { call: "POST /audit-cases/${au_id}/issue-findings", payload: { misuse_amount_cents: 5000, findings_count: 2 }, as: ComplianceAuditor }
          trigger:
            - { call: "POST /audit-cases/${au_id}/close", payload: {}, as: ComplianceAuditor, captures: { au_st: $.data.status } }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_st: $.data.status } }
            - { call: "GET /trust-accounts/${a_id}", payload: {}, as: FinancialOfficer, captures: { a_st: $.data.status } }
            - { call: "GET /disbursements/${d1_id}", payload: {}, as: FinancialOfficer, captures: { d1_st: $.data.status } }
            - { call: "GET /disbursements/${d2_id}", payload: {}, as: FinancialOfficer, captures: { d2_st: $.data.status } }
          assert:
            - "au_st == MISUSE_CONFIRMED (misuse 5000 > 0)"
            - "c_st == SUSPENDED (link 1)"
            - "a_st == FROZEN (link 2, caused by the suspension)"
            - "d1_st == REJECTED and d2_st == REJECTED (link 3, caused by the account freeze; REQUESTED and APPROVED both rejected)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_rejected_state_error_precedes_fiscal_error
        grounds:
          - validations[priority=6]
          - validations[priority=24]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: releasing a REQUESTED
          disbursement on a zero-balance account violates both; priority 6
          (state) must beat priority 24 (fiscal), returning ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "ACTIVE client, OPERATING account with balance 0 (no deposits), DRAFT budget plan, disbursement 30000 still REQUESTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Priya Nair", date_of_birth: "1980-04-18", ssn_last4: "3690", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-PV-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee Z", category: "HOUSING", amount_cents: 30000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /disbursements/${w_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (REQUESTED cannot release; state check precedes the insufficient-funds fiscal check)"
            - "Disbursement.${w_id}.status remains REQUESTED"

      - name: restricted_create_safety_error_precedes_referential_error
        grounds:
          - validations[priority=9]
          - validations[priority=22]
          - errors[ERR_COURT_ORDER_REQUIRED]
          - errors[ERR_BUDGET_PLAN_MISMATCH]
        distinguishing_aspect: |
          Category pair business_safety vs business_referential (different pair
          than the other instance): creating a disbursement on a RESTRICTED
          account with NO court_order_id AND a budget plan owned by a different
          client violates both; priority 9 (safety) must beat priority 22
          (referential), returning ERR_COURT_ORDER_REQUIRED.
        test_recipe:
          setup:
            - "Client A ACTIVE with RESTRICTED account; client B ACTIVE with a DRAFT budget plan (plan belongs to B, not A)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Client Aaa", date_of_birth: "1963-03-03", ssn_last4: "1001", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${ca_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { ea_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${ea_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${ca_id}", account_type: "RESTRICTED", bank_account_ref: "BA-PV-R01" }, as: FinancialOfficer, captures: { ar_id: $.data.id } }
            - { call: "POST /clients/${ca_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Client Bbb", date_of_birth: "1967-04-04", ssn_last4: "1002", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { cb_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${cb_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { eb_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${eb_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /clients/${cb_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${cb_id}", payload: {}, as: FiduciaryAdmin, captures: { cb_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${cb_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${cb_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { pb_id: $.data.id } }
          trigger:
            - { call: "POST /disbursements", payload: { client_id: "${ca_id}", account_id: "${ar_id}", budget_plan_id: "${pb_id}", payee_name: "Payee W", category: "HOUSING", amount_cents: 10000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_COURT_ORDER_REQUIRED (safety check on missing court_order_id fires before the cross-client budget-plan referential check)"

  # =====================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: medicaid_resource_limit_exact_boundary
        grounds:
          - entities.Client.fields.countable_resources_cents
          - entities.Client.fields.medicaid_at_risk
          - validations[priority=29]
          - errors[ERR_SPEND_DOWN_NOT_REQUIRED]
        distinguishing_aspect: |
          Metric = countable resources vs the 200000 limit, via
          POST /spend-down-plans/{id}/activate: exactly AT the limit (200000)
          provisional excess is 0 and activation is rejected; one cent over
          (200001) activation succeeds — strict > boundary.
        test_recipe:
          setup:
            - "ACTIVE medicaid client, VERIFIED SSI entitlement with window [2026-01-01, 2026-06-01) (end-exclusive: June inflow = 0), OPERATING account with exactly 200000 posted, ACTIVE bond"
            - "spend-down plan sp1 for 2026-06 created while countable == 200000 (provisional excess 0)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Ruth Vale", date_of_birth: "1959-08-23", ssn_last4: "7788", county_of_residence: "TRV", medicaid_enrolled: true }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01", effective_end_date: "2026-06-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-MD-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 200000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { risk_before: $.data.medicaid_at_risk } }
            - { call: "POST /spend-down-plans", payload: { client_id: "${c_id}", target_month: "2026-06", entries: [{ category: "MEDICAL", planned_amount_cents: 1000 }] }, as: CaseManager, as_user_id: "cm-1", captures: { sp1_id: $.data.id, sp1_prov: $.data.provisional_excess_cents } }
          trigger:
            - { call: "POST /spend-down-plans/${sp1_id}/activate", payload: {}, as: CaseManager, as_user_id: "cm-1", captures: { err: $.data.error_id } }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 1, received_date: "2026-06-06" }, as: FinancialOfficer, captures: { d2_id: $.data.id } }
            - { call: "POST /deposits/${d2_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { risk_after: $.data.medicaid_at_risk, countable_after: $.data.countable_resources_cents } }
            - { call: "POST /spend-down-plans", payload: { client_id: "${c_id}", target_month: "2026-06", entries: [{ category: "MEDICAL", planned_amount_cents: 1000 }] }, as: CaseManager, as_user_id: "cm-1", captures: { sp2_id: $.data.id, sp2_prov: $.data.provisional_excess_cents } }
            - { call: "POST /spend-down-plans/${sp2_id}/activate", payload: {}, as: CaseManager, as_user_id: "cm-1", captures: { sp2_st: $.data.status } }
          assert:
            - "risk_before == false (200000 == limit is NOT at risk: boundary is strict >)"
            - "sp1_prov == 0 and err == ERR_SPEND_DOWN_NOT_REQUIRED (excess 0 cannot activate)"
            - "countable_after == 200001 and risk_after == true (one cent over flips the boundary)"
            - "sp2_prov == 1 and sp2_st == ACTIVE"
            - "No auto-created plan appears after the 1-cent post because sp1 (DRAFT, 2026-06) already exists"

      - name: bond_coverage_exact_boundary
        grounds:
          - calculations.bond_utilization
          - entities.SuretyBond.fields.funds_under_management_cents
          - validations[priority=26]
          - errors[ERR_BOND_COVERAGE_EXCEEDED]
        distinguishing_aspect: |
          Metric = org-wide funds under management vs bond coverage, via
          POST /deposits/{id}/post (different metric and endpoint than the
          Medicaid instance): post that lands EXACTLY at coverage (300000 ==
          300000) succeeds (<= semantics); the next 1-cent post is rejected.
        test_recipe:
          setup:
            - "ACTIVE client with OPERATING account; ACTIVE bond with coverage 300000; deposit A 200000 already posted (FUM 200000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Sam Ortega", date_of_birth: "1972-02-14", ssn_last4: "5050", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-BC-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 300000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 200000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { da_id: $.data.id } }
            - { call: "POST /deposits/${da_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 100000, received_date: "2026-06-03" }, as: FinancialOfficer, captures: { db_id: $.data.id } }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 1, received_date: "2026-06-04" }, as: FinancialOfficer, captures: { dc_id: $.data.id } }
          trigger:
            - { call: "POST /deposits/${db_id}/post", payload: {}, as: FinancialOfficer, captures: { db_st: $.data.status } }
            - { call: "POST /deposits/${dc_id}/post", payload: {}, as: FinancialOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /surety-bonds/${b_id}", payload: {}, as: FiduciaryAdmin, captures: { fum: $.data.funds_under_management_cents, util: $.data.utilization_bps } }
          assert:
            - "db_st == POSTED (300000 == coverage is allowed: boundary is inclusive <=)"
            - "err == ERR_BOND_COVERAGE_EXCEEDED (300001 would exceed by exactly 1 cent)"
            - "fum == 300000 and util == 10000 (rejected post does not move funds under management)"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: client_activation_requires_verified_entitlement
        grounds:
          - state_machines.Client.INTAKE_REVIEW_to_ACTIVE
          - state_machines.BenefitEntitlement.PENDING_VERIFICATION_to_VERIFIED
          - errors[ERR_NO_VERIFIED_ENTITLEMENT]
        distinguishing_aspect: |
          Entity pair Client x BenefitEntitlement: Client's activation
          transition is gated on a DIFFERENT entity's state (at least one
          VERIFIED entitlement); PENDING_VERIFICATION blocks with
          ERR_NO_VERIFIED_ENTITLEMENT, flipping the entitlement unblocks it.
        test_recipe:
          setup:
            - "Client in INTAKE_REVIEW with one PENDING_VERIFICATION entitlement"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Tom Ivers", date_of_birth: "1985-06-30", ssn_last4: "6100", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
          trigger:
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin, captures: { c_st: $.data.status } }
          assert:
            - "err == ERR_NO_VERIFIED_ENTITLEMENT (entitlement PENDING blocks activation)"
            - "c_st == ACTIVE after the entitlement flips to VERIFIED"

      - name: disbursement_release_requires_active_bond
        grounds:
          - state_machines.Disbursement.APPROVED_to_RELEASED
          - state_machines.SuretyBond.PENDING_to_ACTIVE
          - errors[ERR_NO_ACTIVE_BOND]
        distinguishing_aspect: |
          Entity pair Disbursement x SuretyBond (different pair than the other
          instance): an APPROVED disbursement cannot RELEASE while no ACTIVE
          bond exists anywhere in the org; activating a PENDING bond unblocks
          the very same release.
        test_recipe:
          setup:
            - "ACTIVE client, OPERATING account funded 50000, APPROVED 2026-06 budget basis 100000 HOUSING, disbursement 10000 APPROVED; bond exists only in PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Uma Voss", date_of_birth: "1977-10-08", ssn_last4: "3003", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-NB-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 50000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /budget-plans/${p_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee Q", category: "HOUSING", amount_cents: 10000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id } }
            - { call: "POST /disbursements/${w_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 1000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /disbursements/${w_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { err: $.data.error_id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /disbursements/${w_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { w_st: $.data.status } }
          assert:
            - "err == ERR_NO_ACTIVE_BOND (bond PENDING does not satisfy the gate)"
            - "w_st == RELEASED after the bond flips to ACTIVE"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: entitlement_half_open_window_adjacency
        grounds:
          - validations[priority=15]
          - entities.BenefitEntitlement.fields.effective_end_date
          - errors[ERR_ENTITLEMENT_OVERLAP]
        distinguishing_aspect: |
          Half-open semantics on BenefitEntitlement: window end is EXCLUSIVE,
          so a successor starting exactly at the prior end date is legal while
          one starting a day earlier collides; gaps are allowed. Different
          entity and semantics from the report contiguity instance.
        test_recipe:
          setup:
            - "Client exists; entitlement E1 SSI [2026-01-01, 2026-06-01) created"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Vera Lin", date_of_birth: "1990-01-19", ssn_last4: "2020", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01", effective_end_date: "2026-06-01" }, as: FiduciaryAdmin, captures: { e1_id: $.data.id } }
          trigger:
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 85000, effective_start_date: "2026-06-01" }, as: FiduciaryAdmin, captures: { e2_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 81000, effective_start_date: "2026-05-31" }, as: FiduciaryAdmin, captures: { err: $.data.error_id } }
          assert:
            - "E2 created successfully (adjacency end == next start is NOT an overlap under half-open windows)"
            - "err == ERR_ENTITLEMENT_OVERLAP (2026-05-31 start intersects [2026-01-01, 2026-06-01))"

      - name: report_period_closed_interval_contiguity
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - entities.AccountingReport.fields.period_end_date
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - errors[ERR_REPORT_PERIOD_GAP]
        distinguishing_aspect: |
          Closed-interval semantics on AccountingReport (different entity and
          semantics than the half-open entitlement windows): periods are
          INCLUSIVE at both ends, adjacency is MANDATORY (start must equal
          prior end + 1 day), gaps are rejected as strictly as overlaps.
        test_recipe:
          setup:
            - "ACTIVE client; R1 SSA_6233 [2025-06-01, 2026-05-31] CASH created and SUBMITTED (clock 2026-06-15, before due date 2026-06-30)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Walt Chen", date_of_birth: "1953-05-27", ssn_last4: "4040", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2025-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /accounting-reports", payload: { client_id: "${c_id}", report_type: "SSA_6233", period_start_date: "2025-06-01", period_end_date: "2026-05-31", basis: "CASH" }, as: CaseManager, as_user_id: "cm-1", captures: { r1_id: $.data.id } }
            - { call: "POST /accounting-reports/${r1_id}/submit", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
          trigger:
            - { call: "POST /accounting-reports", payload: { client_id: "${c_id}", report_type: "SSA_6233", period_start_date: "2026-06-01", period_end_date: "2026-06-30", basis: "CASH" }, as: CaseManager, as_user_id: "cm-1", captures: { r2_id: $.data.id } }
            - { call: "POST /accounting-reports", payload: { client_id: "${c_id}", report_type: "SSA_6233", period_start_date: "2026-07-02", period_end_date: "2026-07-31", basis: "CASH" }, as: CaseManager, as_user_id: "cm-1", captures: { err_gap: $.data.error_id } }
            - { call: "POST /accounting-reports", payload: { client_id: "${c_id}", report_type: "SSA_6233", period_start_date: "2026-05-15", period_end_date: "2026-06-15", basis: "CASH" }, as: CaseManager, as_user_id: "cm-1", captures: { err_ovl: $.data.error_id } }
          assert:
            - "R2 created (start 2026-06-01 == R1 end 2026-05-31 + 1 day: mandatory adjacency satisfied)"
            - "err_gap == ERR_REPORT_PERIOD_GAP (2026-07-02 skips past expected 2026-06-01; R2 is DRAFTING and does not count)"
            - "err_ovl == ERR_REPORT_PERIOD_OVERLAP (2026-05-15 intersects R1's closed interval)"

  # =====================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: release_then_return_conserves_cash
        grounds:
          - state_machines.Disbursement.APPROVED_to_RELEASED
          - state_machines.Disbursement.RELEASED_to_RETURNED
          - entities.TrustAccount.fields.balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = account cash: release(-30000) paired with its
          compensating return(+30000) restores balance_cents to the exact
          pre-release value, and the signed ledger always sums to the balance.
          Different conserved quantity than the allocation instance.
        test_recipe:
          setup:
            - "ACTIVE client, OPERATING account with 50000 posted, ACTIVE bond, APPROVED 2026-06 budget basis 100000 HOUSING; disbursement 30000 APPROVED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Xenia Ford", date_of_birth: "1969-12-12", ssn_last4: "7070", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-CC-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 50000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /trust-accounts/${a_id}", payload: {}, as: FinancialOfficer, captures: { bal_start: $.data.balance_cents } }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /budget-plans/${p_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Payee R", category: "HOUSING", amount_cents: 30000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id } }
            - { call: "POST /disbursements/${w_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
            - { call: "POST /disbursements/${w_id}/release", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { w_fee: $.data.fee_cents } }
            - { call: "GET /trust-accounts/${a_id}", payload: {}, as: FinancialOfficer, captures: { bal_mid: $.data.balance_cents } }
          trigger:
            - { call: "POST /disbursements/${w_id}/return", payload: {}, as: FinancialOfficer, as_user_id: "fo-1", captures: { w_st: $.data.status } }
            - { call: "GET /trust-accounts/${a_id}", payload: {}, as: FinancialOfficer, captures: { bal_end: $.data.balance_cents } }
            - { call: "GET /trust-accounts/${a_id}/ledger", payload: {}, as: FinancialOfficer, captures: { le0_amt: "$.data[0].amount_cents", le1_amt: "$.data[1].amount_cents", le2_amt: "$.data[2].amount_cents", le2_bal: "$.data[2].balance_after_cents" } }
          assert:
            - "bal_start == 50000 and bal_mid == 20000 (release debited exactly 30000)"
            - "bal_end == bal_start == 50000 (return compensates release exactly; no drift)"
            - "le0_amt == 50000 and le1_amt == -30000 and le2_amt == 30000 and le2_bal == 50000 (signed ledger sums to balance)"
            - "w_st == RETURNED and w_fee == 1500 (fee is informational; it never touches cash)"

      - name: rebalance_conserves_allocation_total
        grounds:
          - calculations.budget_allocation
          - entities.BudgetPlan.fields.allocated_lines
          - entities.BudgetPlan.fields.total_planned_cents
        distinguishing_aspect: |
          Conserved quantity = plan allocation total (a pure allocation
          quantity, not cash): rebalance moves 5000 between lines; both
          SUM(allocated_lines) and total_planned_cents are invariant across
          the forward move — different conserved quantity than account cash.
        test_recipe:
          setup:
            - "ACTIVE client; DRAFT budget plan for 2026-06 with basis 100001 and lines HOUSING 33 / FOOD 33 / SAVINGS 34 (allocated 33001/33000/34000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Yara Boyd", date_of_birth: "1982-03-21", ssn_last4: "9090", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 100001, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100001, lines: [{ category: "HOUSING", percent: 33 }, { category: "FOOD", percent: 33 }, { category: "SAVINGS", percent: 34 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id, total_before: $.data.total_planned_cents } }
          trigger:
            - { call: "POST /budget-plans/${p_id}/rebalance", payload: { from_category: "HOUSING", to_category: "FOOD", amount_cents: 5000 }, as: CaseManager, as_user_id: "cm-1", captures: { total_after: $.data.total_planned_cents } }
          assert:
            - "total_before == 100001 and total_after == 100001 (total_planned_cents invariant)"
            - "allocated_lines after rebalance: HOUSING == 28001, FOOD == 38000, SAVINGS == 34000"
            - "SUM(allocated_lines.amount_cents) == 100001 after the move (no allocation drift)"
