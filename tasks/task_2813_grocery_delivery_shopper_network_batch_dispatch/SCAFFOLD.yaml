# =============================================================================
# PRD Benchmark Seed Tables — task_2813
# Grocery Delivery Shopper Network & Batch Dispatch
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2813. Grocery Delivery Shopper Network & Batch Dispatch (Instacart): multi-store batch
  construction & shopper capacity matching, shopper rating tier & priority batch access,
  in-aisle replacement approval with refund fallback, weighted-item price adjustment at
  checkout, EBT SNAP split-tender payment on eligible items only, tip adjustment window &
  tip-baiting protection, heavy-pay and long-distance mileage bonus calculation, mid-batch
  abandonment reassignment & customer credit, retailer catalog markup vs in-store price
  parity disclosure

domain_name: grocery-batch-dispatch

# All collections are top-level peers (flat topology); no nesting prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - selector_policy            # dispatch picks one Shopper from an eligibility-filtered, ranked pool
    - dual_variant_calculation   # ESTIMATE vs FINAL authorization; ROLLING_5 vs LIFETIME tier
    - cascading_side_effects     # abandonment -> suspension -> sibling batch release -> customer credit
    - optimistic_concurrency     # OCC on Order.version and Batch.version

  entity_topology: flat
  # Every entity is its own top-level collection joined by FK fields; the only
  # many-to-many link (Batch <-> Order) is carried by the BatchOrder junction row.

  state_machine_shape: parallel
  # Order carries two independent dimensions (fulfillment_status x payment_status).
  # Batch is cyclic (OFFERED->OFFERED on offer expiry, ABANDONED->OFFERED on reassign).
  # Shopper is cyclic (ACTIVE->SUSPENDED_REVIEW->ACTIVE).
  # OrderLine and ReplacementRequest are branching (fork with divergent side-effect sets).

  relationship_patterns:
    - one_to_many        # Retailer -> CatalogItem, Order -> OrderLine
    - many_to_many       # Batch <-> Order via BatchOrder
    - cross_aggregate    # ReplacementRequest references OrderLine, Batch and CatalogItem

  role_model: peer_roles
  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 53 endpoints / 52 error codes / 55 validation rules /
  # 17 calculations (3 with variants) / 6 state-machine tables over 5 entities
  # (Order carries 2 parallel dimensions; Batch and Shopper are cyclic;
  # OrderLine and ReplacementRequest are branching) / 2 OCC races.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        required: true
        description: Retailer legal name.
      - name: store_code
        type: string
        source: input
        required: true
        description: Human store code, unique across Retailer rows.
        constraints: "unique; 3-16 chars"
      - name: catalog_markup_pct
        type: number
        source: input
        required: false
        description: Fraction added to in_store_price_cents to derive catalog_price_cents.
        default: 0.15
        constraints: "0.00 <= v <= 0.60, 2 decimals"
      - name: parity_disclosure_required
        type: boolean
        source: input
        required: false
        description: When true the retailer discloses catalog-vs-in-store markup to customers.
        default: true
      - name: ebt_snap_enabled
        type: boolean
        source: input
        required: false
        description: When false no EBT SNAP tender may be authorized on this retailer's orders.
        default: true
      - name: concurrent_shopper_cap
        type: integer
        source: input
        required: false
        description: Max batches with overlapping shopping windows allowed at this retailer.
        default: 2
        constraints: "1 <= v <= 10"
      - name: status
        type: enum
        source: input
        required: false
        description: Retailer availability.
        default: ACTIVE
        constraints: "ACTIVE | PAUSED"

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        required: true
        description: "FK -> Retailer.id; the retailer whose shelf this item sits on."
      - name: sku
        type: string
        source: input
        required: true
        description: Retailer SKU, unique per retailer_id.
        constraints: "unique per (retailer_id, sku)"
      - name: name
        type: string
        source: input
        required: true
        description: Item display name.
      - name: pricing_unit
        type: enum
        source: input
        required: true
        description: EACH items price per unit, PER_LB items price per pound.
        constraints: "EACH | PER_LB"
      - name: in_store_price_cents
        type: integer
        source: input
        required: true
        description: Shelf price in the physical store, per each or per pound.
        constraints: "v >= 1"
      - name: catalog_price_cents
        type: integer
        source: computed
        required: false
        description: Marked-up in-app price; see calculations.catalog_price_markup.
      - name: is_ebt_eligible
        type: boolean
        source: input
        required: false
        description: True when the item qualifies as SNAP-eligible food.
        default: false
      - name: is_weighted
        type: boolean
        source: computed
        required: false
        description: True exactly when pricing_unit == PER_LB.
      - name: estimated_weight_lb
        type: number
        source: input
        required: false
        description: Default pounds assumed for a PER_LB item when the customer omits a weight.
        default: 0
        constraints: "required and > 0 when pricing_unit == PER_LB; must be 0 for EACH"
      - name: unit_weight_lb
        type: number
        source: input
        required: false
        description: Shipping weight of one EACH unit, used for heavy-pay totals.
        default: 0
        constraints: "v >= 0"
      - name: availability
        type: enum
        source: input
        required: false
        description: Shelf availability, flipped by the retailer manager.
        default: IN_STOCK
        constraints: "IN_STOCK | OUT_OF_STOCK"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        required: true
        description: Customer name.
      - name: card_last4
        type: string
        source: input
        required: true
        description: Last four digits of the card on file (card tender is always available).
        constraints: "exactly 4 digits"
      - name: ebt_snap_balance_cents
        type: integer
        source: input
        required: false
        description: Remaining SNAP benefit balance; debited on capture, restored on refund.
        default: 0
        constraints: "v >= 0"
      - name: ebt_captured_total_cents
        type: integer
        source: computed
        required: false
        description: Sum of Order.ebt_captured_cents over this customer's orders; conservation counterpart of ebt_snap_balance_cents.
      - name: credit_balance_cents
        type: integer
        source: computed
        required: false
        description: Sum of CreditLedgerEntry.amount_cents for this customer.

  - name: Shopper
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        required: true
        description: Shopper name.
      - name: service_area_code
        type: string
        source: input
        required: true
        description: Dispatch area; a batch is only offered to shoppers whose code equals Batch.service_area_code.
      - name: vehicle_capacity_units
        type: integer
        source: input
        required: true
        description: Maximum simultaneously committed batch units this shopper can carry.
        constraints: "1 <= v <= 200"
      - name: committed_units
        type: integer
        source: computed
        required: false
        description: "Sum of Batch.total_units over batches where claimed_shopper_id == this shopper and status IN {CLAIMED, SHOPPING, CHECKED_OUT}."
      - name: completed_batch_count
        type: integer
        source: computed
        required: false
        description: Count of batches delivered by this shopper, plus any injected history.
      - name: abandonment_count
        type: integer
        source: computed
        required: false
        description: Count of shopper-initiated abandonments, plus any injected history; system releases do not increment it.
      - name: rolling_recent_avg
        type: number
        source: computed
        required: false
        description: Mean stars over the most recent ROLLING_WINDOW_N ratings; see calculations.shopper_tier_scoring.
      - name: lifetime_rating_avg
        type: number
        source: computed
        required: false
        description: Mean stars over all ShopperRating rows for this shopper.
      - name: rolling_tier_score
        type: number
        source: computed
        required: false
        description: Weighted score from the ROLLING_5 variant; 4 decimals.
      - name: lifetime_tier_score
        type: number
        source: computed
        required: false
        description: Weighted score from the LIFETIME variant; 4 decimals; gates reinstatement.
      - name: tier
        type: enum
        source: computed
        required: false
        description: Authoritative access tier derived from rolling_tier_score.
        constraints: "PROBATION | STANDARD | PLATINUM | DIAMOND"
      - name: lifetime_tier
        type: enum
        source: computed
        required: false
        description: Display-only tier derived from lifetime_tier_score by the same thresholds.
        constraints: "PROBATION | STANDARD | PLATINUM | DIAMOND"
      - name: status
        type: enum
        source: computed
        required: false
        description: ACTIVE shoppers may be offered and claim batches; SUSPENDED_REVIEW shoppers may not.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED_REVIEW"

  - name: ShopperRating
    parent: null
    common_fields: false
    fields:
      - name: shopper_id
        type: string
        source: input
        required: true
        description: "FK -> Shopper.id; the rated shopper."
      - name: order_id
        type: string
        source: input
        required: false
        description: "FK -> Order.id; the delivered order being rated; null for back-office backfilled ratings."
        default: null
      - name: stars
        type: integer
        source: input
        required: true
        description: Star rating.
        constraints: "1 <= v <= 5"
      - name: sequence_no
        type: integer
        source: computed
        required: false
        description: 1-based index of this rating within the shopper's history ordered by created_at ASC.

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        required: true
        description: "FK -> Customer.id; the ordering customer."
      - name: retailer_id
        type: string
        source: input
        required: true
        description: "FK -> Retailer.id; single-retailer order (multi-store batches join several orders)."
      - name: delivery_distance_mi
        type: number
        source: input
        required: true
        description: Store-to-door driving miles, used for the mileage bonus.
        constraints: "0.0 <= v <= 60.0, 1 decimal"
      - name: delivery_deadline
        type: datetime
        source: input
        required: true
        description: Latest acceptable delivery instant (ISO 8601 UTC).
      - name: ebt_requested
        type: boolean
        source: input
        required: false
        description: Customer asks that SNAP-eligible lines be paid from the EBT balance.
        default: false
      - name: tip_amount_cents
        type: integer
        source: input
        required: false
        description: Current tip; set at creation and mutated by tip adjustments.
        default: 0
        constraints: "0 <= v <= 20000"
      - name: fulfillment_status
        type: enum
        source: computed
        required: false
        description: Physical progress dimension, independent of payment_status.
        default: DRAFT
        constraints: "DRAFT | PLACED | IN_BATCH | SHOPPING | CHECKED_OUT | DELIVERED | REASSIGN_PENDING"
      - name: payment_status
        type: enum
        source: computed
        required: false
        description: Money dimension, independent of fulfillment_status.
        default: UNAUTHORIZED
        constraints: "UNAUTHORIZED | AUTHORIZED | REAUTH_HELD | CAPTURED | REFUNDED"
      - name: estimated_subtotal_cents
        type: integer
        source: computed
        required: false
        description: Per-line rounded estimate; see calculations.order_estimate_authorization.
      - name: authorization_ceiling_cents
        type: integer
        source: computed
        required: false
        description: Buffered ceiling the card plus EBT authorization may not exceed.
      - name: authorized_ebt_cents
        type: integer
        source: computed
        required: false
        description: EBT slice of the authorization (never buffered, never covers fees or tip).
      - name: authorized_card_cents
        type: integer
        source: computed
        required: false
        description: Card slice of the authorization.
      - name: captured_subtotal_cents
        type: integer
        source: computed
        required: false
        description: Per-line rounded final item subtotal at checkout.
      - name: ebt_captured_cents
        type: integer
        source: computed
        required: false
        description: EBT amount actually captured; see calculations.checkout_split_tender_capture.
      - name: card_captured_cents
        type: integer
        source: computed
        required: false
        description: Card amount actually captured (fees and tip always ride on the card).
      - name: refunded_cents
        type: integer
        source: computed
        required: false
        description: Total refunded back to EBT plus card after a post-checkout abandonment.
      - name: tip_original_cents
        type: integer
        source: computed
        required: false
        description: Snapshot of tip_amount_cents at the delivery transition; baseline for tip-baiting protection.
      - name: tip_adjustment_count
        type: integer
        source: computed
        required: false
        description: Number of accepted tip adjustments in the post-delivery window.
        default: 0
      - name: delivered_at
        type: datetime
        source: computed
        required: false
        description: Logical-clock instant of the DELIVERED transition.
      - name: tip_window_closes_at
        type: datetime
        source: computed
        required: false
        description: delivered_at + TIP_WINDOW_HOURS; tip adjustments after it are rejected.
      - name: parity_markup_cents
        type: integer
        source: computed
        required: false
        description: Catalog subtotal minus in-store subtotal at capture; see calculations.price_parity_disclosure.
      - name: parity_disclosed
        type: boolean
        source: computed
        required: false
        description: Value of Retailer.parity_disclosure_required captured at checkout.

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        required: true
        description: "FK -> Order.id; owning order."
      - name: catalog_item_id
        type: string
        source: input
        required: true
        description: "FK -> CatalogItem.id; repointed to the proposed item when a replacement is approved."
      - name: requested_qty
        type: integer
        source: input
        required: false
        description: Units requested for an EACH item; must be 1 for PER_LB items.
        default: 1
        constraints: "1 <= v <= 50"
      - name: requested_weight_lb
        type: number
        source: input
        required: false
        description: Pounds requested for a PER_LB item.
        default: 0
        constraints: "required and > 0 when the item is PER_LB; must be 0 for EACH"
      - name: unit_price_cents_snapshot
        type: integer
        source: computed
        required: false
        description: CatalogItem.catalog_price_cents copied at submit and re-copied on replacement approval.
      - name: in_store_price_cents_snapshot
        type: integer
        source: computed
        required: false
        description: CatalogItem.in_store_price_cents copied at the same instants; parity baseline.
      - name: ebt_eligible_snapshot
        type: boolean
        source: computed
        required: false
        description: CatalogItem.is_ebt_eligible copied at the same instants.
      - name: picked_qty
        type: integer
        source: computed
        required: false
        description: Units actually picked for an EACH line.
        default: 0
      - name: final_weight_lb
        type: number
        source: computed
        required: false
        description: Pounds actually weighed for a PER_LB line.
        default: 0
      - name: final_price_cents
        type: integer
        source: computed
        required: false
        description: Per-line rounded money for this line; 0 while REQUESTED or once REFUNDED.
        default: 0
      - name: status
        type: enum
        source: computed
        required: false
        description: Line lifecycle.
        default: REQUESTED
        constraints: "REQUESTED | REPLACEMENT_PENDING | PICKED | REPLACED | REFUNDED"

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - name: service_area_code
        type: string
        source: input
        required: true
        description: Dispatch area; only shoppers with an equal service_area_code are eligible.
      - name: shop_window_start
        type: datetime
        source: input
        required: true
        description: Start of the in-store shopping window (ISO 8601 UTC).
      - name: shop_window_end
        type: datetime
        source: input
        required: true
        description: End of the in-store shopping window; must be strictly after shop_window_start.
      - name: tier_access_floor
        type: enum
        source: input
        required: false
        description: Minimum shopper tier permitted to be offered or to claim this batch.
        default: STANDARD
        constraints: "PROBATION | STANDARD | PLATINUM | DIAMOND"
      - name: status
        type: enum
        source: computed
        required: false
        description: Batch lifecycle.
        default: BUILDING
        constraints: "BUILDING | OFFERED | CLAIMED | SHOPPING | CHECKED_OUT | DELIVERED | ABANDONED"
      - name: offered_shopper_id
        type: string
        source: computed
        required: false
        description: "FK -> Shopper.id; shopper currently holding the offer; null before the first dispatch."
        default: null
      - name: claimed_shopper_id
        type: string
        source: computed
        required: false
        description: "FK -> Shopper.id; shopper who claimed the batch; null before the claim and after a release."
        default: null
      - name: declined_shopper_ids
        type: array
        source: computed
        required: false
        description: Shopper id values excluded from re-selection because their offer expired on this batch.
        default: []
      - name: offer_expires_at
        type: datetime
        source: computed
        required: false
        description: Offer instant plus OFFER_TTL_MINUTES; a claim at or after it is rejected.
      - name: delivery_deadline
        type: datetime
        source: computed
        required: false
        description: Earliest delivery_deadline over member orders; null while the batch has no orders.
      - name: total_units
        type: integer
        source: computed
        required: false
        description: Sum of BatchOrder.units over member rows; the quantity matched against vehicle_capacity_units.
      - name: total_weight_lb
        type: number
        source: computed
        required: false
        description: Sum of member line weights; see calculations.shopper_batch_pay.
      - name: total_distance_mi
        type: number
        source: computed
        required: false
        description: Sum of member Order.delivery_distance_mi.
      - name: store_count
        type: integer
        source: computed
        required: false
        description: Distinct member Order.retailer_id count.
      - name: checkout_blocked_count
        type: integer
        source: computed
        required: false
        description: "Count of member orders whose payment_status == REAUTH_HELD; checkout requires 0."
      - name: reassignment_count
        type: integer
        source: computed
        required: false
        description: Number of ABANDONED -> OFFERED reassignments performed on this batch.
        default: 0
      - name: abandoned_at
        type: datetime
        source: computed
        required: false
        description: Logical-clock instant of the most recent abandonment.

  - name: BatchOrder
    parent: null
    common_fields: false
    fields:
      - name: batch_id
        type: string
        source: input
        required: true
        description: "FK -> Batch.id; the batch this membership row joins."
      - name: order_id
        type: string
        source: input
        required: true
        description: "FK -> Order.id; the member order."
      - name: sequence_no
        type: integer
        source: computed
        required: false
        description: 1-based membership index within the batch ordered by created_at ASC.
      - name: units
        type: integer
        source: computed
        required: false
        description: Units contributed by this order at add time; EACH lines contribute requested_qty, PER_LB lines contribute 1.

  - name: ReplacementRequest
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        required: true
        description: "FK -> Batch.id; the batch being shopped when the substitution was proposed."
      - name: order_line_id
        type: string
        source: input
        required: true
        description: "FK -> OrderLine.id; the line that could not be picked as ordered."
      - name: proposed_catalog_item_id
        type: string
        source: input
        required: true
        description: "FK -> CatalogItem.id; the substitute the shopper found in the aisle."
      - name: proposed_qty
        type: integer
        source: input
        required: false
        description: Units of the substitute for an EACH proposal.
        default: 1
        constraints: "1 <= v <= 50"
      - name: proposed_weight_lb
        type: number
        source: input
        required: false
        description: Pounds of the substitute for a PER_LB proposal.
        default: 0
      - name: price_delta_cents
        type: integer
        source: computed
        required: false
        description: Proposed line money minus the original line estimate; may be negative.
      - name: expires_at
        type: datetime
        source: computed
        required: false
        description: Creation instant plus REPLACEMENT_TTL_MINUTES; unanswered requests fall back to a refund.
      - name: status
        type: enum
        source: computed
        required: false
        description: Approval lifecycle.
        default: PENDING
        constraints: "PENDING | APPROVED | REJECTED | EXPIRED"
      - name: resolution_effect
        type: enum
        source: computed
        required: false
        description: Effect applied to the line when the request left PENDING.
        default: NONE
        constraints: "NONE | LINE_REPLACED | LINE_REFUNDED"

  - name: ShopperPayout
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        required: true
        description: "FK -> Batch.id; the delivered or abandoned batch being paid."
      - name: shopper_id
        type: string
        source: input
        required: true
        description: "FK -> Shopper.id; the paid shopper."
      - name: base_pay_cents
        type: integer
        source: computed
        required: false
        description: Flat base plus per-unit rate.
      - name: heavy_pay_cents
        type: integer
        source: computed
        required: false
        description: Weight-tier bonus.
      - name: mileage_bonus_cents
        type: integer
        source: computed
        required: false
        description: Capped long-distance bonus.
      - name: multi_store_bonus_cents
        type: integer
        source: computed
        required: false
        description: Bonus per additional store beyond the first.
      - name: tip_pass_through_cents
        type: integer
        source: computed
        required: false
        description: Sum of member Order.tip_amount_cents at the evaluation instant.
      - name: tip_protection_cents
        type: integer
        source: computed
        required: false
        description: Platform make-good when tips were cut past the baiting threshold.
      - name: guarantee_top_up_cents
        type: integer
        source: computed
        required: false
        description: Top-up raising the tip-inclusive subtotal to the per-unit guarantee floor.
      - name: total_payout_cents
        type: integer
        source: computed
        required: false
        description: Final payable amount; 0 when FORFEITED.
      - name: status
        type: enum
        source: computed
        required: false
        description: Payout lifecycle.
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL | FORFEITED"

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        required: true
        description: "FK -> Customer.id; credited customer."
      - name: order_id
        type: string
        source: input
        required: false
        description: "FK -> Order.id; order the credit is attributed to; null for un-attributed support goodwill."
        default: null
      - name: amount_cents
        type: integer
        source: input
        required: true
        description: Positive credit added to Customer.credit_balance_cents.
        constraints: "1 <= v <= 100000"
      - name: reason_code
        type: enum
        source: input
        required: true
        description: Why the credit was issued.
        constraints: "ABANDONMENT_INCONVENIENCE | REPLACEMENT_REFUND | PARITY_ADJUSTMENT | POST_CHECKOUT_REVERSAL | SUPPORT_GOODWILL"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Batch
    initial_state: BUILDING
    terminal_states: [DELIVERED]
    note: |
      Cyclic. OFFERED -> OFFERED re-selects a shopper once an offer expires, and
      ABANDONED -> OFFERED returns a dropped batch to the pool, so a batch can be
      offered many times.
    transitions:
      - from: BUILDING
        to: OFFERED
        trigger: "POST /batches/{id}/dispatch"
        actor: DispatchAdmin
        preconditions:
          - "batch.status == BUILDING"
          - "batch.total_units >= 1 (a batch with no BatchOrder rows is rejected with ERR_BATCH_EMPTY)"
          - "calculations.dispatch_shopper_selection yields a non-empty candidate set (else ERR_NO_ELIGIBLE_SHOPPER, batch stays BUILDING)"
        side_effects:
          - "sets Batch.offered_shopper_id to the winner of calculations.dispatch_shopper_selection"
          - "sets Batch.offer_expires_at = clock_now + OFFER_TTL_MINUTES"
          - "increments Batch.version by 1"

      - from: OFFERED
        to: OFFERED
        trigger: "POST /batches/{id}/dispatch (re-offer after the standing offer expired)"
        actor: DispatchAdmin
        preconditions:
          - "batch.status == OFFERED"
          - "clock_now >= batch.offer_expires_at"
          - "calculations.dispatch_shopper_selection yields a non-empty candidate set after excluding declined_shopper_ids"
        side_effects:
          - "appends the outgoing Batch.offered_shopper_id to Batch.declined_shopper_ids"
          - "sets Batch.offered_shopper_id to the new winner and Batch.offer_expires_at = clock_now + OFFER_TTL_MINUTES"
          - "increments Batch.version by 1"
        note: "Exclusion-on-retry semantics of the selector policy."

      - from: OFFERED
        to: CLAIMED
        trigger: "POST /batches/{id}/claim"
        actor: Shopper
        preconditions:
          - "batch.status == OFFERED"
          - "X-User-ID == batch.offered_shopper_id (else ERR_NOT_RESOURCE_OWNER)"
          - "clock_now < batch.offer_expires_at (else ERR_OFFER_EXPIRED)"
          - "shopper.status == ACTIVE (else ERR_SHOPPER_SUSPENDED)"
          - "tier_rank(shopper.tier) >= tier_rank(batch.tier_access_floor) (else ERR_TIER_BELOW_BATCH_FLOOR)"
          - "calculations.shopper_window_overlap finds no conflicting claimed batch (else ERR_SHOPPER_WINDOW_CONFLICT)"
          - "shopper.committed_units + batch.total_units <= shopper.vehicle_capacity_units (else ERR_SHOPPER_CAPACITY_EXCEEDED)"
        side_effects:
          - "sets Batch.claimed_shopper_id = X-User-ID and clears Batch.offered_shopper_id to null"
          - "recomputes Shopper.committed_units (rises by Batch.total_units)"
          - "increments Batch.version by 1"

      - from: CLAIMED
        to: SHOPPING
        trigger: "POST /batches/{id}/start-shopping"
        actor: Shopper
        preconditions:
          - "batch.status == CLAIMED"
          - "X-User-ID == batch.claimed_shopper_id"
          - "clock_now >= batch.shop_window_start (else ERR_SHOP_WINDOW_NOT_OPEN)"
        side_effects:
          - "every member Order.fulfillment_status moves IN_BATCH -> SHOPPING"

      - from: SHOPPING
        to: CHECKED_OUT
        trigger: "POST /batches/{id}/checkout"
        actor: Shopper
        preconditions:
          - "batch.status == SHOPPING"
          - "X-User-ID == batch.claimed_shopper_id"
          - "no member OrderLine.status == REQUESTED (every line is picked, replaced, refunded, or awaiting a replacement answer)"
          - "batch.checkout_blocked_count == 0, i.e. every member Order.payment_status == AUTHORIZED (else ERR_ORDER_PAYMENT_HELD)"
        side_effects:
          - "sweep first: every PENDING ReplacementRequest on a member line moves PENDING -> EXPIRED with resolution_effect = LINE_REFUNDED and its OrderLine.status REPLACEMENT_PENDING -> REFUNDED, final_price_cents = 0 (refund fallback)"
          - "recomputes every member OrderLine.final_price_cents per calculations.checkout_line_pricing"
          - "recomputes Order.captured_subtotal_cents, Order.ebt_captured_cents and Order.card_captured_cents per calculations.checkout_split_tender_capture"
          - "debits Customer.ebt_snap_balance_cents by Order.ebt_captured_cents and recomputes Customer.ebt_captured_total_cents"
          - "member Order.payment_status moves AUTHORIZED -> CAPTURED"
          - "member Order.fulfillment_status moves SHOPPING -> CHECKED_OUT"
          - "recomputes Order.parity_markup_cents and Order.parity_disclosed per calculations.price_parity_disclosure"
          - "when calculations.price_parity_disclosure returns parity_credit_cents > 0, creates a CreditLedgerEntry with reason_code PARITY_ADJUSTMENT and recomputes Customer.credit_balance_cents"

      - from: CHECKED_OUT
        to: DELIVERED
        trigger: "POST /batches/{id}/deliver"
        actor: Shopper
        preconditions:
          - "batch.status == CHECKED_OUT"
          - "X-User-ID == batch.claimed_shopper_id"
        side_effects:
          - "member Order.fulfillment_status moves CHECKED_OUT -> DELIVERED; Order.delivered_at = clock_now; Order.tip_original_cents = Order.tip_amount_cents; Order.tip_window_closes_at = clock_now + TIP_WINDOW_HOURS"
          - "recomputes Shopper.completed_batch_count (rises by 1) and Shopper.committed_units (falls by Batch.total_units)"
          - "recomputes Shopper.rolling_tier_score, lifetime_tier_score, tier and lifetime_tier per calculations.shopper_tier_scoring"
          - "creates one ShopperPayout with status PROVISIONAL whose money fields come from calculations.shopper_batch_pay and calculations.payout_finalization evaluated at the delivery instant"

      - from: CLAIMED
        to: ABANDONED
        trigger: "POST /batches/{id}/abandon"
        actor: Shopper
        preconditions:
          - "batch.status == CLAIMED"
          - "X-User-ID == batch.claimed_shopper_id"
        side_effects:
          - "sets Batch.abandoned_at = clock_now, clears Batch.claimed_shopper_id to null and appends the abandoning shopper's id to Batch.declined_shopper_ids so calculations.dispatch_shopper_selection cannot re-offer the batch to them"
          - "creates one ShopperPayout row for the abandoning shopper with status FORFEITED and every money field 0 (calculations.payout_finalization variant FORFEITED)"
          - "member Order.fulfillment_status moves IN_BATCH -> REASSIGN_PENDING"
          - "creates one CreditLedgerEntry per member order with reason_code ABANDONMENT_INCONVENIENCE and amount_cents from calculations.abandonment_customer_credit, then recomputes Customer.credit_balance_cents"
          - "cascade link 1: recomputes Shopper.committed_units (falls by Batch.total_units) and Shopper.abandonment_count (rises by 1)"
          - "cascade link 2: because abandonment_count changed, recomputes Shopper.rolling_tier_score / tier per calculations.shopper_tier_scoring, forcing tier = PROBATION once abandonment_count >= ABANDONMENT_SUSPENSION_THRESHOLD"
          - "cascade link 3: because tier became PROBATION under the abandonment override, Shopper.status moves ACTIVE -> SUSPENDED_REVIEW"
          - "cascade link 4: because the shopper is SUSPENDED_REVIEW, every other Batch with claimed_shopper_id == this shopper and status IN {CLAIMED, SHOPPING, CHECKED_OUT} takes the system-release transition below"

      - from: SHOPPING
        to: ABANDONED
        trigger: "POST /batches/{id}/abandon"
        actor: Shopper
        preconditions:
          - "batch.status == SHOPPING"
          - "X-User-ID == batch.claimed_shopper_id"
        side_effects:
          - "identical to the CLAIMED -> ABANDONED cascade, except member Order.fulfillment_status moves SHOPPING -> REASSIGN_PENDING and calculations.abandonment_customer_credit sees a non-zero pick progress"
          - "every member OrderLine with status PICKED is reset to REQUESTED with picked_qty = 0, final_weight_lb = 0 and final_price_cents = 0"
          - "every PENDING ReplacementRequest on a member line moves PENDING -> EXPIRED with resolution_effect = NONE and its line returns REPLACEMENT_PENDING -> REQUESTED"

      - from: CHECKED_OUT
        to: ABANDONED
        trigger: "POST /batches/{id}/abandon (dropped after checkout, before hand-off)"
        actor: Shopper
        preconditions:
          - "batch.status == CHECKED_OUT"
          - "X-User-ID == batch.claimed_shopper_id"
        side_effects:
          - "member Order.payment_status moves CAPTURED -> REFUNDED; Order.refunded_cents = Order.ebt_captured_cents + Order.card_captured_cents"
          - "restores Customer.ebt_snap_balance_cents by Order.ebt_captured_cents, sets Order.ebt_captured_cents = 0 and recomputes Customer.ebt_captured_total_cents (conservation invariant ebt_funds_conserved)"
          - "creates one CreditLedgerEntry with reason_code POST_CHECKOUT_REVERSAL for the card slice and one with reason_code ABANDONMENT_INCONVENIENCE for the disruption credit"
          - "member Order.fulfillment_status moves CHECKED_OUT -> REASSIGN_PENDING and every member OrderLine returns to REQUESTED with final_price_cents = 0"
          - "runs the same four cascade links as CLAIMED -> ABANDONED"

      - from: CLAIMED
        to: ABANDONED
        trigger: "system release cascaded from Shopper ACTIVE -> SUSPENDED_REVIEW"
        actor: system
        preconditions:
          - "the batch's claimed_shopper_id just moved to status SUSPENDED_REVIEW"
        side_effects:
          - "clears Batch.claimed_shopper_id, sets Batch.abandoned_at = clock_now and appends the released shopper's id to Batch.declined_shopper_ids"
          - "creates one ShopperPayout row for the released shopper with status FORFEITED and every money field 0"
          - "member Order.fulfillment_status moves IN_BATCH -> REASSIGN_PENDING and each member order receives an ABANDONMENT_INCONVENIENCE CreditLedgerEntry"
          - "recomputes Shopper.committed_units; deliberately does NOT increment Shopper.abandonment_count, which stops the cascade from re-entering itself"

      - from: ABANDONED
        to: OFFERED
        trigger: "POST /batches/{id}/reassign"
        actor: DispatchAdmin
        preconditions:
          - "batch.status == ABANDONED"
          - "batch.total_units >= 1"
          - "calculations.dispatch_shopper_selection yields a non-empty candidate set after excluding declined_shopper_ids"
        side_effects:
          - "increments Batch.reassignment_count by 1"
          - "sets Batch.offered_shopper_id to the new winner and Batch.offer_expires_at = clock_now + OFFER_TTL_MINUTES"
          - "member Order.fulfillment_status moves REASSIGN_PENDING -> IN_BATCH"
          - "increments Batch.version by 1"

  - entity: Order
    dimension: fulfillment_status
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    note: "Physical dimension. Evolves independently of the payment dimension below."
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /orders/{id}/submit"
        actor: Customer
        preconditions:
          - "order.fulfillment_status == DRAFT (else ERR_ORDER_NOT_DRAFT)"
          - "X-User-ID == order.customer_id"
          - "the order has at least one OrderLine (else ERR_INVALID_REQUEST)"
          - "retailer.status == ACTIVE"
          - "when order.ebt_requested is true, retailer.ebt_snap_enabled is true (else ERR_EBT_NOT_ENABLED)"
        side_effects:
          - "snapshots every OrderLine.unit_price_cents_snapshot, in_store_price_cents_snapshot and ebt_eligible_snapshot from its CatalogItem"
          - "computes Order.estimated_subtotal_cents, authorization_ceiling_cents, authorized_ebt_cents and authorized_card_cents per calculations.order_estimate_authorization (ESTIMATE variant)"
          - "Order.payment_status moves UNAUTHORIZED -> AUTHORIZED"

      - from: PLACED
        to: IN_BATCH
        trigger: "POST /batches/{id}/orders"
        actor: DispatchAdmin
        preconditions:
          - "the order is not already a member of any batch (checked first, else ERR_ORDER_ALREADY_BATCHED)"
          - "order.fulfillment_status == PLACED (else ERR_ORDER_NOT_PLACED)"
        side_effects:
          - "creates the BatchOrder row and recomputes Batch.total_units, total_weight_lb, total_distance_mi, store_count and delivery_deadline"
          - "increments Batch.version by 1"

      - from: IN_BATCH
        to: SHOPPING
        trigger: "POST /batches/{id}/start-shopping (cascaded from the batch transition)"
        actor: Shopper
        preconditions: ["owning batch moves CLAIMED -> SHOPPING"]
        side_effects: ["member lines become pickable"]

      - from: SHOPPING
        to: CHECKED_OUT
        trigger: "POST /batches/{id}/checkout (cascaded)"
        actor: Shopper
        preconditions: ["owning batch moves SHOPPING -> CHECKED_OUT"]
        side_effects: ["see the batch transition's capture side effects"]

      - from: CHECKED_OUT
        to: DELIVERED
        trigger: "POST /batches/{id}/deliver (cascaded)"
        actor: Shopper
        preconditions: ["owning batch moves CHECKED_OUT -> DELIVERED"]
        side_effects:
          - "sets Order.delivered_at, Order.tip_original_cents and Order.tip_window_closes_at"

      - from: IN_BATCH
        to: REASSIGN_PENDING
        trigger: "POST /batches/{id}/abandon (cascaded)"
        actor: Shopper
        preconditions: ["owning batch moves CLAIMED -> ABANDONED"]
        side_effects: ["an ABANDONMENT_INCONVENIENCE CreditLedgerEntry is created for this order"]

      - from: SHOPPING
        to: REASSIGN_PENDING
        trigger: "POST /batches/{id}/abandon (cascaded)"
        actor: Shopper
        preconditions: ["owning batch moves SHOPPING -> ABANDONED"]
        side_effects: ["picked lines are reset to REQUESTED; an ABANDONMENT_INCONVENIENCE CreditLedgerEntry is created"]

      - from: CHECKED_OUT
        to: REASSIGN_PENDING
        trigger: "POST /batches/{id}/abandon (cascaded)"
        actor: Shopper
        preconditions: ["owning batch moves CHECKED_OUT -> ABANDONED"]
        side_effects: ["the capture is reversed; see the batch transition"]

      - from: REASSIGN_PENDING
        to: IN_BATCH
        trigger: "POST /batches/{id}/reassign (cascaded)"
        actor: DispatchAdmin
        preconditions: ["owning batch moves ABANDONED -> OFFERED"]
        side_effects: ["order waits for the new shopper to claim the batch"]

  - entity: Order
    dimension: payment_status
    initial_state: UNAUTHORIZED
    terminal_states: [REFUNDED]
    note: |
      Money dimension. Cyclic on AUTHORIZED -> REAUTH_HELD -> AUTHORIZED and fully
      independent of fulfillment_status: an order can be REAUTH_HELD while SHOPPING,
      or AUTHORIZED while REASSIGN_PENDING.
    transitions:
      - from: UNAUTHORIZED
        to: AUTHORIZED
        trigger: "POST /orders/{id}/submit"
        actor: Customer
        preconditions: ["order.payment_status == UNAUTHORIZED"]
        side_effects:
          - "sets Order.authorized_ebt_cents and Order.authorized_card_cents per calculations.order_estimate_authorization"

      - from: AUTHORIZED
        to: REAUTH_HELD
        trigger: "POST /replacement-requests/{id}/approve (cascade link 2)"
        actor: Customer
        preconditions:
          - "the approved substitution raises Order.estimated_subtotal_cents so that estimated_subtotal_cents + SERVICE_FEE_CENTS + tip_amount_cents > Order.authorization_ceiling_cents"
        side_effects:
          - "increments Batch.checkout_blocked_count on every batch holding this order (cascade link 3), which blocks POST /batches/{id}/checkout with ERR_ORDER_PAYMENT_HELD"

      - from: REAUTH_HELD
        to: AUTHORIZED
        trigger: "POST /orders/{id}/reauthorize"
        actor: Customer
        preconditions:
          - "order.payment_status == REAUTH_HELD (else ERR_REAUTH_NOT_REQUIRED)"
          - "X-User-ID == order.customer_id"
        side_effects:
          - "recomputes Order.authorization_ceiling_cents, authorized_ebt_cents and authorized_card_cents from the current line snapshots per calculations.order_estimate_authorization"
          - "decrements Batch.checkout_blocked_count on every batch holding this order"

      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /batches/{id}/checkout (cascaded)"
        actor: Shopper
        preconditions: ["batch.checkout_blocked_count == 0"]
        side_effects:
          - "sets Order.ebt_captured_cents and Order.card_captured_cents per calculations.checkout_split_tender_capture and debits Customer.ebt_snap_balance_cents"

      - from: CAPTURED
        to: REFUNDED
        trigger: "POST /batches/{id}/abandon from CHECKED_OUT (cascaded)"
        actor: Shopper
        preconditions: ["order.payment_status == CAPTURED and the owning batch leaves CHECKED_OUT for ABANDONED"]
        side_effects:
          - "sets Order.refunded_cents, restores Customer.ebt_snap_balance_cents and creates the POST_CHECKOUT_REVERSAL CreditLedgerEntry"

  - entity: OrderLine
    initial_state: REQUESTED
    terminal_states: [PICKED, REPLACED, REFUNDED]
    note: "Branching: a REQUESTED line forks into a straight pick or a replacement round whose three outcomes carry different side-effect sets."
    transitions:
      - from: REQUESTED
        to: PICKED
        trigger: "POST /order-lines/{id}/pick"
        actor: Shopper
        preconditions:
          - "the owning batch has status SHOPPING and X-User-ID == batch.claimed_shopper_id"
          - "line.status == REQUESTED (else ERR_LINE_NOT_PICKABLE)"
          - "the line's CatalogItem.availability == IN_STOCK (else ERR_ITEM_OUT_OF_STOCK)"
          - "for a PER_LB line, abs(final_weight_lb - requested_weight_lb) <= requested_weight_lb * WEIGHT_VARIANCE_PCT (else ERR_WEIGHT_VARIANCE_EXCEEDED)"
        side_effects:
          - "sets OrderLine.picked_qty / final_weight_lb and OrderLine.final_price_cents per calculations.checkout_line_pricing"
          - "recomputes Batch.total_weight_lb"

      - from: REQUESTED
        to: REPLACEMENT_PENDING
        trigger: "POST /replacement-requests"
        actor: Shopper
        preconditions:
          - "the owning batch has status SHOPPING and X-User-ID == batch.claimed_shopper_id"
          - "line.status == REQUESTED"
          - "the proposed CatalogItem belongs to the line's order retailer (else ERR_REPLACEMENT_RETAILER_MISMATCH)"
          - "when the line's ebt_eligible_snapshot is true and the order's authorized_ebt_cents > 0, the proposed item is_ebt_eligible (else ERR_EBT_INELIGIBLE_REPLACEMENT)"
        side_effects:
          - "creates the ReplacementRequest with status PENDING, expires_at = clock_now + REPLACEMENT_TTL_MINUTES and price_delta_cents per calculations.replacement_price_delta"

      - from: REPLACEMENT_PENDING
        to: REPLACED
        trigger: "POST /replacement-requests/{id}/approve"
        actor: Customer
        preconditions:
          - "request.status == PENDING (else ERR_REPLACEMENT_NOT_PENDING)"
          - "clock_now < request.expires_at"
          - "X-User-ID == the owning Order.customer_id"
        side_effects:
          - "cascade link 1: repoints OrderLine.catalog_item_id to the proposed item, re-snapshots unit_price_cents_snapshot / in_store_price_cents_snapshot / ebt_eligible_snapshot, sets picked_qty or final_weight_lb from the proposal and final_price_cents per calculations.checkout_line_pricing"
          - "cascade link 2: recomputes Order.estimated_subtotal_cents; when the new projected total exceeds authorization_ceiling_cents the order takes AUTHORIZED -> REAUTH_HELD"
          - "cascade link 3: recomputes Batch.checkout_blocked_count on the owning batch"

      - from: REPLACEMENT_PENDING
        to: REFUNDED
        trigger: "POST /replacement-requests/{id}/reject"
        actor: Customer
        preconditions:
          - "request.status == PENDING"
          - "X-User-ID == the owning Order.customer_id"
        side_effects:
          - "sets OrderLine.final_price_cents = 0, picked_qty = 0, final_weight_lb = 0 (refund fallback: the customer is simply not charged for the line)"
          - "recomputes Order.estimated_subtotal_cents"

      - from: REPLACEMENT_PENDING
        to: REFUNDED
        trigger: "POST /batches/{id}/checkout expiry sweep"
        actor: system
        preconditions: ["the owning batch leaves SHOPPING while the request is still PENDING"]
        side_effects:
          - "the ReplacementRequest moves PENDING -> EXPIRED with resolution_effect LINE_REFUNDED and the line is not charged"

  - entity: ReplacementRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    note: "Branching fork: the three exits write different resolution_effect values and different downstream money effects."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /replacement-requests/{id}/approve"
        actor: Customer
        preconditions: ["request.status == PENDING", "clock_now < request.expires_at", "X-User-ID == the owning Order.customer_id"]
        side_effects: ["sets resolution_effect = LINE_REPLACED and runs the three-link cascade documented on OrderLine REPLACEMENT_PENDING -> REPLACED"]

      - from: PENDING
        to: REJECTED
        trigger: "POST /replacement-requests/{id}/reject"
        actor: Customer
        preconditions: ["request.status == PENDING", "X-User-ID == the owning Order.customer_id"]
        side_effects: ["sets resolution_effect = LINE_REFUNDED and moves the line to REFUNDED with final_price_cents = 0"]

      - from: PENDING
        to: EXPIRED
        trigger: "POST /batches/{id}/checkout sweep, or POST /batches/{id}/abandon"
        actor: system
        preconditions: ["request.status == PENDING when the owning batch leaves SHOPPING"]
        side_effects:
          - "on a checkout sweep sets resolution_effect = LINE_REFUNDED and the line becomes REFUNDED"
          - "on an abandonment sets resolution_effect = NONE and the line returns to REQUESTED"

  - entity: Shopper
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic: suspension and reinstatement can repeat."
    transitions:
      - from: ACTIVE
        to: SUSPENDED_REVIEW
        trigger: "cascade link 3 of POST /batches/{id}/abandon"
        actor: system
        preconditions: ["shopper.abandonment_count >= ABANDONMENT_SUSPENSION_THRESHOLD after the abandonment"]
        side_effects:
          - "cascade link 4: releases every other batch this shopper holds in {CLAIMED, SHOPPING, CHECKED_OUT} via the system-release transition"

      - from: SUSPENDED_REVIEW
        to: ACTIVE
        trigger: "POST /shoppers/{id}/reinstate"
        actor: DispatchAdmin
        preconditions:
          - "shopper.status == SUSPENDED_REVIEW (else ERR_SHOPPER_NOT_SUSPENDED)"
          - "shopper.lifetime_tier_score >= REINSTATEMENT_MIN_SCORE (else ERR_REINSTATE_SCORE_TOO_LOW)"
        side_effects:
          - "resets Shopper.abandonment_count to 0 and recomputes tier / rolling_tier_score / lifetime_tier_score per calculations.shopper_tier_scoring"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's version only
# =============================================================================
concurrency_rules:
  - rule_id: tip-adjust-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/tip-adjustments"
    occ_field: "expected_order_version"
    description: |
      A tip adjustment legitimately supersedes the order's current tip amount, so a
      second adjustment is a valid product operation rather than an invalid state
      transition. The write therefore carries the order version the client last
      observed; when that version is stale the adjustment is rejected, because the
      superseded baseline (tip_original_cents, tip_adjustment_count) the client
      reasoned about is no longer the stored one.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: batch-order-add-stale-batch
    parent_entity: Batch
    write_endpoint: "POST /batches/{id}/orders"
    occ_field: "expected_batch_version"
    description: |
      Adding an order to a BUILDING batch legitimately supersedes the batch's derived
      composition (total_units, total_weight_lb, store_count, delivery_deadline), so a
      second add is a valid product operation. The write carries the batch version the
      client last observed; a stale version means the composition the dispatcher sized
      the addition against has already changed and the add is rejected.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: catalog_price_markup
    trigger: "POST /catalog-items, PATCH /catalog-items/{id}, and PATCH /retailers/{id}/parity-policy (for every CatalogItem of that retailer)"
    algorithm: threshold
    formula: |
      catalog_price_cents = round_half_up(in_store_price_cents * (1 + retailer.catalog_markup_pct))
      is_weighted = (pricing_unit == PER_LB)
      # OrderLine snapshots are taken at submit and at replacement approval only, so a
      # later markup change never re-prices an already-submitted line.
    input_set: "The single CatalogItem being written, plus its Retailer row read at write time."
    constants:
      MARKUP_PCT_MAX: 0.60
    precision: "integer cents, round_half_up on the .5 cent"

  - name: customer_derived_balances
    trigger: "Any mutation that creates a CreditLedgerEntry or changes Order.ebt_captured_cents"
    algorithm: aggregation
    formula: |
      credit_balance_cents     = sum(CreditLedgerEntry.amount_cents where customer_id == customer.id)   # no status filter: entries are immutable
      ebt_captured_total_cents = sum(Order.ebt_captured_cents where Order.customer_id == customer.id
                                     and Order.payment_status IN {CAPTURED, REFUNDED})
      # Conservation target (invariant ebt_funds_conserved):
      #   ebt_snap_balance_cents + ebt_captured_total_cents == the value it held before any capture
      #   because REFUNDED orders zero ebt_captured_cents while restoring the balance.
    input_set: "All CreditLedgerEntry rows for the customer (immutable, unfiltered) and all Order rows in CAPTURED or REFUNDED."
    constants: {}
    precision: "integer cents"

  - name: batch_composition_aggregates
    trigger: "POST /batches/{id}/orders, POST /order-lines/{id}/pick, POST /replacement-requests/{id}/approve, POST /replacement-requests/{id}/reject, and every Batch transition that changes member line state"
    algorithm: aggregation
    formula: |
      units(order)  = sum over the order's OrderLine rows of (requested_qty if item.pricing_unit == EACH else 1)
      BatchOrder.units  = units(order) evaluated at add time (frozen)
      BatchOrder.sequence_no = 1-based index over the batch's BatchOrder rows ordered by created_at ASC
      total_units       = sum(BatchOrder.units over the batch's membership rows)
      total_distance_mi = sum(Order.delivery_distance_mi over member orders), 1 decimal
      store_count       = count(distinct Order.retailer_id over member orders)
      delivery_deadline = min(Order.delivery_deadline over member orders); null when the batch has no member
      weight_of(line)   = final_weight_lb when final_weight_lb > 0 else requested_weight_lb
      qty_of(line)      = picked_qty when line.status IN {PICKED, REPLACED} else requested_qty
      total_weight_lb   = sum over member lines with status != REFUNDED of
                            (weight_of(line)                                if item.pricing_unit == PER_LB
                             else item.unit_weight_lb * qty_of(line))
      checkout_blocked_count = count(member orders where payment_status == REAUTH_HELD)
    input_set: "Member orders reached through BatchOrder rows; REFUNDED lines are excluded from total_weight_lb but their units stay frozen in BatchOrder.units."
    constants: {}
    precision: "total_weight_lb and total_distance_mi to 1 decimal, round_half_up; counts are integers"

  - name: order_estimate_authorization
    trigger: "POST /orders/{id}/submit and POST /orders/{id}/reauthorize"
    algorithm: forward_looking
    formula: |
      est_line_cents(L) = round_half_up(L.unit_price_cents_snapshot * L.requested_weight_lb)   if item.pricing_unit == PER_LB
                        = L.unit_price_cents_snapshot * L.requested_qty                        if item.pricing_unit == EACH
      # Per-line rounding happens BEFORE the sum (see checkout_line_pricing for the pinned order).
      estimated_subtotal_cents    = sum(est_line_cents(L) over lines with status != REFUNDED)
      authorization_ceiling_cents = round_half_up(estimated_subtotal_cents * AUTH_BUFFER_MULT)
                                    + SERVICE_FEE_CENTS + order.tip_amount_cents
      ebt_eligible_estimate_cents = sum(est_line_cents(L) over lines with status != REFUNDED
                                        and L.ebt_eligible_snapshot == true)
                                    when order.ebt_requested == true and retailer.ebt_snap_enabled == true, else 0
      authorized_ebt_cents  = min(customer.ebt_snap_balance_cents, ebt_eligible_estimate_cents)   # EBT slice is NEVER buffered
      authorized_card_cents = authorization_ceiling_cents - authorized_ebt_cents                  # card carries fees, tip and the whole buffer
    input_set: "Every OrderLine of the order whose status != REFUNDED, using requested quantities and requested weights only."
    constants:
      AUTH_BUFFER_MULT: 1.15
      SERVICE_FEE_CENTS: 399
    precision: "integer cents, round_half_up"
    variants:
      - name: ESTIMATE
        when: "At POST /orders/{id}/submit and POST /orders/{id}/reauthorize, before anything is weighed."
        difference: "Uses requested_weight_lb / requested_qty, applies the 1.15 buffer to build the ceiling, and derives the EBT slice from estimated line money."
      - name: FINAL
        when: "At POST /batches/{id}/checkout, executed by calculations.checkout_split_tender_capture."
        difference: |
          Uses final_weight_lb / picked_qty with replacements applied, applies NO buffer, and caps
          the EBT slice a third time by authorized_ebt_cents. For the same order the two variants
          disagree whenever a weighed item lands off its requested weight or a line is replaced or
          refunded: ESTIMATE answers "how much may we hold" and FINAL answers "how much do we take".

  - name: checkout_line_pricing
    trigger: "POST /order-lines/{id}/pick, POST /replacement-requests/{id}/approve, POST /replacement-requests/{id}/reject, POST /batches/{id}/checkout"
    algorithm: aggregation
    formula: |
      weight_of(L) = L.final_weight_lb when L.final_weight_lb > 0 else L.requested_weight_lb
      qty_of(L)    = L.picked_qty      when L.status IN {PICKED, REPLACED} else L.requested_qty
      final_price_cents(L) =
          0                                                          if L.status IN {REFUNDED, REQUESTED, REPLACEMENT_PENDING}
          round_half_up(L.unit_price_cents_snapshot * weight_of(L))   if item.pricing_unit == PER_LB
          L.unit_price_cents_snapshot * qty_of(L)                     if item.pricing_unit == EACH
      captured_subtotal_cents = sum(final_price_cents(L) over all lines of the order)
      # PINNED ROUNDING ORDER: round each PER_LB line to whole cents FIRST, then add the lines.
      # Summing unrounded price*weight products and rounding the total once is explicitly wrong
      # and produces a different number of cents for the same weights.
    input_set: "Every OrderLine of the order, including REFUNDED lines (which contribute exactly 0)."
    constants:
      WEIGHT_VARIANCE_PCT: 0.20        # accepted scale tolerance on a PER_LB pick, inclusive <=
    precision: "integer cents per line, round_half_up per line, then exact integer summation"

  - name: checkout_split_tender_capture
    trigger: "POST /batches/{id}/checkout"
    algorithm: waterfall_allocation
    formula: |
      # Ordered buckets: EBT first, then card. EBT may only pay for SNAP-eligible item money.
      captured_subtotal_cents  = calculations.checkout_line_pricing(order)
      order_grand_total_cents  = captured_subtotal_cents + SERVICE_FEE_CENTS + order.tip_amount_cents
      ebt_final_eligible_cents = sum(L.final_price_cents over lines with L.ebt_eligible_snapshot == true
                                     and L.status IN {PICKED, REPLACED})
      if order.ebt_requested == true and retailer.ebt_snap_enabled == true:
          ebt_captured_cents = min(customer.ebt_snap_balance_cents,      # live balance at capture
                                   ebt_final_eligible_cents,            # eligible item money actually picked
                                   order.authorized_ebt_cents)          # ceiling authorized at submit
      else:
          ebt_captured_cents = 0
      card_captured_cents = order_grand_total_cents - ebt_captured_cents   # fees and tip always ride the card
      # Side effect ordering: debit customer.ebt_snap_balance_cents by ebt_captured_cents BEFORE
      # the next member order of the same batch is captured, so two orders of one customer see a
      # shrinking EBT balance in BatchOrder.sequence_no ASC order.
    input_set: "Member orders of the batch processed in BatchOrder.sequence_no ASC; lines in PICKED or REPLACED for the EBT bucket."
    constants:
      SERVICE_FEE_CENTS: 399
    precision: "integer cents"

  - name: replacement_price_delta
    trigger: "POST /replacement-requests"
    algorithm: aggregation
    formula: |
      proposed_line_cents = round_half_up(proposed.catalog_price_cents * request.proposed_weight_lb)  if proposed.pricing_unit == PER_LB
                          = proposed.catalog_price_cents * request.proposed_qty                        if proposed.pricing_unit == EACH
      original_line_cents = est_line_cents(line) from calculations.order_estimate_authorization
      price_delta_cents   = proposed_line_cents - original_line_cents        # may be negative
    input_set: "The single proposed CatalogItem and the single target OrderLine."
    constants: {}
    precision: "integer cents, round_half_up"

  - name: shopper_batch_pay
    trigger: "POST /batches/{id}/deliver and POST /batches/{id}/finalize-payout"
    algorithm: tiered_pricing
    formula: |
      base_pay_cents = BASE_PAY_CENTS + UNIT_RATE_CENTS * batch.total_units
      heavy_pay_cents =                                    # tiers evaluated top-down, inclusive >=
          HEAVY_TIER_3_CENTS if batch.total_weight_lb >= HEAVY_TIER_3_LB
          HEAVY_TIER_2_CENTS if batch.total_weight_lb >= HEAVY_TIER_2_LB
          HEAVY_TIER_1_CENTS if batch.total_weight_lb >= HEAVY_TIER_1_LB
          0                  otherwise
      mileage_bonus_cents = min(MILEAGE_BONUS_CAP_CENTS,
                                round_half_up(max(0.0, batch.total_distance_mi - MILEAGE_FREE_MI)
                                              * MILEAGE_RATE_CENTS_PER_MI))
      multi_store_bonus_cents = MULTI_STORE_BONUS_CENTS * max(0, batch.store_count - 1)
      batch_pay_cents = base_pay_cents + heavy_pay_cents + mileage_bonus_cents + multi_store_bonus_cents
      # Tips are NOT part of batch_pay_cents; they enter only at step S2 of payout_finalization.
    input_set: "The batch's own aggregates from calculations.batch_composition_aggregates, evaluated at the triggering transition's instant."
    constants:
      BASE_PAY_CENTS: 700
      UNIT_RATE_CENTS: 25
      HEAVY_TIER_1_LB: 50.0
      HEAVY_TIER_1_CENTS: 300
      HEAVY_TIER_2_LB: 80.0
      HEAVY_TIER_2_CENTS: 600
      HEAVY_TIER_3_LB: 120.0
      HEAVY_TIER_3_CENTS: 900
      MILEAGE_FREE_MI: 8.0
      MILEAGE_RATE_CENTS_PER_MI: 60
      MILEAGE_BONUS_CAP_CENTS: 1200
      MULTI_STORE_BONUS_CENTS: 250
    precision: "integer cents; the mileage product is rounded once with round_half_up before the cap is applied"

  - name: payout_finalization
    trigger: "POST /batches/{id}/deliver (PROVISIONAL) and POST /batches/{id}/finalize-payout (FINAL)"
    algorithm: constraint_propagation
    formula: |
      # STRICT EVALUATION ORDER — the guarantee top-up is derived from the tip-inclusive
      # subtotal produced at S5, and tip protection is derived from the tip cut at S3/S4.
      # Any other order (e.g. topping up from batch_pay_cents alone and adding tips after)
      # yields a different total for the same inputs.
      S1: batch_pay_cents        = calculations.shopper_batch_pay(batch)
      S2: tip_pass_through_cents = sum(Order.tip_amount_cents over member orders at this instant)
      S3: tip_baseline_cents     = sum(Order.tip_original_cents over member orders)
          tip_cut_cents          = max(0, tip_baseline_cents - tip_pass_through_cents)
          protection_eligible    = tip_baseline_cents > 0
                                   and (tip_cut_cents * 100) >= (tip_baseline_cents * TIP_BAIT_PCT_NUMERATOR)
      S4: tip_protection_cents   = min(TIP_PROTECTION_CAP_CENTS, tip_cut_cents) if protection_eligible else 0
      S5: subtotal_cents         = batch_pay_cents + tip_pass_through_cents + tip_protection_cents
          guarantee_floor_cents  = GUARANTEE_PER_UNIT_CENTS * batch.total_units
          guarantee_top_up_cents = max(0, guarantee_floor_cents - subtotal_cents)
      S6: total_payout_cents     = subtotal_cents + guarantee_top_up_cents
    input_set: "Member orders of the batch; tip values read at the triggering instant, baselines frozen at the delivery transition."
    constants:
      TIP_BAIT_PCT_NUMERATOR: 50
      TIP_PROTECTION_CAP_CENTS: 1000
      GUARANTEE_PER_UNIT_CENTS: 80
    precision: "integer cents; the eligibility ratio is compared by integer cross-multiplication, never by float division"
    variants:
      - name: PROVISIONAL
        when: "At POST /batches/{id}/deliver, and again on every POST /orders/{id}/tip-adjustments while the payout is still PROVISIONAL."
        difference: |
          tip_protection_cents is forced to 0 in this variant. At delivery that falls out of the
          formula (tip_pass_through_cents == tip_baseline_cents, so tip_cut_cents is 0); on a
          later tip adjustment the cut is real but protection is deliberately NOT paid yet,
          because the customer may still raise the tip again inside the window. A provisional
          recompute therefore rewrites tip_pass_through_cents (and, through S5, may rewrite
          guarantee_top_up_cents and total_payout_cents) while leaving tip_protection_cents 0.
      - name: FINAL
        when: "At POST /batches/{id}/finalize-payout, after clock_now >= every member Order.tip_window_closes_at."
        difference: "Re-reads the adjusted tips, so a reduced tip both lowers tip_pass_through_cents and can add tip_protection_cents, and can change guarantee_top_up_cents."
      - name: FORFEITED
        when: "At POST /batches/{id}/abandon, where a ShopperPayout row is written for the abandoning shopper instead of the delivery payout."
        difference: "Every money field is written as 0 - base_pay_cents, heavy_pay_cents, mileage_bonus_cents, multi_store_bonus_cents, tip_pass_through_cents, tip_protection_cents, guarantee_top_up_cents and total_payout_cents - so the guarantee floor does NOT apply to a forfeited batch."

  - name: shopper_tier_scoring
    trigger: "POST /shoppers/{id}/ratings, POST /_ratings/backfill, POST /_shoppers/{id}/history, POST /batches/{id}/deliver, POST /batches/{id}/abandon, POST /shoppers/{id}/reinstate"
    algorithm: weighted_scoring
    formula: |
      recent_rows          = the most recent ROLLING_WINDOW_N ShopperRating rows of the shopper
                             ordered by created_at DESC, then sequence_no DESC
      rolling_recent_avg   = round_half_up(mean(recent_rows.stars), 4)      # 0.0 when the shopper has no rating
      lifetime_rating_avg  = round_half_up(mean(all rows.stars), 4)         # 0.0 when the shopper has no rating
      rating_component(a)  = (a - 1) / 4  when the shopper has >= 1 rating, else 0
      reliability_component= max(0, 1 - shopper.abandonment_count / ABANDONMENT_RELIABILITY_DIVISOR)
      score(a)             = round_half_up(RATING_WEIGHT * rating_component(a)
                                           + RELIABILITY_WEIGHT * reliability_component, 4)
      rolling_tier_score   = score(rolling_recent_avg)
      lifetime_tier_score  = score(lifetime_rating_avg)
      tier_of(s, completed) =
          DIAMOND   if s >= DIAMOND_MIN_SCORE and completed >= DIAMOND_MIN_COMPLETED
          PLATINUM  if s >= PLATINUM_MIN_SCORE
          STANDARD  if s >= STANDARD_MIN_SCORE
          PROBATION otherwise
      tier          = PROBATION if shopper.abandonment_count >= ABANDONMENT_SUSPENSION_THRESHOLD
                      else tier_of(rolling_tier_score, shopper.completed_batch_count)
      lifetime_tier = tier_of(lifetime_tier_score, shopper.completed_batch_count)   # the abandonment override does NOT apply here
      tier_rank: PROBATION = 0, STANDARD = 1, PLATINUM = 2, DIAMOND = 3
    input_set: "All ShopperRating rows of the shopper; the rolling variant keeps only the newest ROLLING_WINDOW_N by created_at DESC with sequence_no DESC as the tie-break."
    constants:
      ROLLING_WINDOW_N: 5
      RATING_WEIGHT: 0.70
      RELIABILITY_WEIGHT: 0.30
      ABANDONMENT_RELIABILITY_DIVISOR: 5
      DIAMOND_MIN_SCORE: 0.9200
      DIAMOND_MIN_COMPLETED: 3
      PLATINUM_MIN_SCORE: 0.8000
      STANDARD_MIN_SCORE: 0.6000
      ABANDONMENT_SUSPENSION_THRESHOLD: 2
      REINSTATEMENT_MIN_SCORE: 0.6000
    precision: "scores to 4 decimals, round_half_up; averages to 4 decimals"
    variants:
      - name: ROLLING_5
        when: "Always, to produce Shopper.tier — the authoritative gate for dispatch eligibility and POST /batches/{id}/claim."
        difference: "Only the newest 5 ratings enter the mean, so recent behaviour dominates."
      - name: LIFETIME
        when: "Always, to produce Shopper.lifetime_tier_score / lifetime_tier — the gate for POST /shoppers/{id}/reinstate."
        difference: |
          Every rating ever recorded enters the mean. For a shopper whose early ratings were poor
          and whose recent ratings are good the two variants disagree on the tier, and the shopper
          can be PLATINUM for batch access while only STANDARD on the lifetime books.

  - name: dispatch_shopper_selection
    trigger: "POST /batches/{id}/dispatch and POST /batches/{id}/reassign"
    algorithm: weighted_scoring
    formula: |
      candidates = Shopper rows where ALL of:
          status == ACTIVE
          service_area_code == batch.service_area_code
          tier_rank(tier) >= tier_rank(batch.tier_access_floor)
          committed_units + batch.total_units <= vehicle_capacity_units
          calculations.shopper_window_overlap(shopper, batch) == false
          id NOT IN batch.declined_shopper_ids
      ranking = ORDER BY tier_rank(tier) DESC,
                         rolling_tier_score DESC,
                         committed_units ASC,
                         created_at ASC          # final tie-break; `id` is never consulted
      winner  = first row of ranking
      empty candidates -> no state change, respond ERR_NO_ELIGIBLE_SHOPPER (422)
    input_set: "All Shopper rows; the eligibility predicate above is the complete filter, and declined_shopper_ids carries both expired offerees and the shopper who abandoned the batch."
    constants: {}
    precision: "exact integer / 4-decimal comparisons; no randomness and no id-based ordering"

  - name: shopper_window_overlap
    trigger: "POST /batches/{id}/claim, and as the eligibility predicate inside calculations.dispatch_shopper_selection"
    algorithm: interval_merge
    formula: |
      candidate_interval = [batch.shop_window_start, batch.delivery_deadline)          # half-open
      for each other Batch B where B.id != batch.id
                                and B.claimed_shopper_id == shopper.id
                                and B.status IN {CLAIMED, SHOPPING, CHECKED_OUT}:
          held_interval = [B.shop_window_start,
                           B.delivery_deadline + SHOPPER_TURNAROUND_BUFFER_MIN minutes)   # buffer on the END only
          conflict when candidate_interval.start < held_interval.end
                    and held_interval.start      < candidate_interval.end
      overlap = true when any conflict is found
    input_set: "Batches already claimed by this shopper in CLAIMED, SHOPPING or CHECKED_OUT; DELIVERED and ABANDONED batches never conflict."
    constants:
      SHOPPER_TURNAROUND_BUFFER_MIN: 15
    precision: "minute-resolution ISO 8601 UTC instants; strict < on both sides, so exact abutment of the raw intervals is legal but a gap shorter than the 15-minute buffer is not"

  - name: retailer_concurrency_overlap
    trigger: "POST /batches/{id}/orders"
    algorithm: interval_merge
    formula: |
      R = the retailer of the order being added
      T = the target batch
      others = count of Batch rows B where ALL of:
          B.id != T.id
          B.status IN {OFFERED, CLAIMED, SHOPPING}
          B has at least one member order with retailer_id == R.id
          [B.shop_window_start, B.shop_window_end] intersects [T.shop_window_start, T.shop_window_end]
              using CLOSED intervals: B.shop_window_start <= T.shop_window_end
                                  AND T.shop_window_start <= B.shop_window_end
              # touching endpoints DO collide, unlike shopper_window_overlap's half-open test
      reject with ERR_RETAILER_CONCURRENCY_CAP_REACHED when others >= R.concurrent_shopper_cap
    input_set: "Batches in OFFERED, CLAIMED or SHOPPING that already carry an order for retailer R; BUILDING, DELIVERED and ABANDONED batches are ignored."
    constants: {}
    precision: "minute-resolution ISO 8601 UTC instants; aggregate count against the retailer cap, not a pairwise veto"

  - name: abandonment_customer_credit
    trigger: "POST /batches/{id}/abandon and the system-release transition"
    algorithm: threshold
    formula: |
      for each member Order O of the abandoned batch, in BatchOrder.sequence_no ASC:
          total_lines  = count(OrderLine rows of O)
          picked_lines = count(OrderLine rows of O with status IN {PICKED, REPLACED})
          disruption_pct = 0.10 if picked_lines * 2 >= total_lines and picked_lines > 0     # progress >= 0.50
                           0.05 if picked_lines > 0
                           0.00 if picked_lines == 0
          raw_credit   = FLAT_INCONVENIENCE_CENTS + round_half_up(O.estimated_subtotal_cents * disruption_pct)
          amount_cents = min(raw_credit, ABANDON_CREDIT_CAP_CENTS)
      # A CHECKED_OUT abandonment always lands in the 0.10 band because every line is PICKED or REPLACED.
    input_set: "All OrderLine rows of each member order, counted before the abandonment resets picked lines to REQUESTED."
    constants:
      FLAT_INCONVENIENCE_CENTS: 500
      ABANDON_CREDIT_CAP_CENTS: 2500
    precision: "integer cents, round_half_up; the progress comparison is integer cross-multiplication (picked_lines * 2 >= total_lines)"

  - name: price_parity_disclosure
    trigger: "POST /batches/{id}/checkout, and read-only at GET /orders/{id}/parity-disclosure"
    algorithm: aggregation
    formula: |
      priced_lines            = OrderLine rows of the order with status IN {PICKED, REPLACED}
      catalog_subtotal_cents  = sum(L.final_price_cents over priced_lines)
      in_store_subtotal_cents = sum over priced_lines of
            round_half_up(L.in_store_price_cents_snapshot * weight_of(L))  if item.pricing_unit == PER_LB
            L.in_store_price_cents_snapshot * qty_of(L)                    if item.pricing_unit == EACH
      parity_markup_cents  = catalog_subtotal_cents - in_store_subtotal_cents
      effective_markup_pct = 0.0000 if in_store_subtotal_cents == 0
                             else round_half_up(parity_markup_cents / in_store_subtotal_cents, 4)
      disclosure_required  = retailer.parity_disclosure_required == true
                             and effective_markup_pct > PARITY_DISCLOSURE_THRESHOLD_PCT      # STRICT >, not >=
      parity_credit_cents  = 0 if retailer.parity_disclosure_required == true
                             else max(0, parity_markup_cents
                                         - round_half_up(in_store_subtotal_cents * PARITY_DISCLOSURE_THRESHOLD_PCT))
      disclosure_satisfied = true            if disclosure_required == false
                             else order.parity_disclosed == true
      # order.parity_disclosed is written only at checkout, so an order whose markup already
      # exceeds the threshold while it is still SHOPPING reads
      # disclosure_required == true with disclosure_satisfied == false.
      # An undisclosed retailer refunds only the markup ABOVE the 10% threshold, as a
      # PARITY_ADJUSTMENT CreditLedgerEntry created during checkout.
    input_set: "Only PICKED and REPLACED lines; REFUNDED and REQUESTED lines contribute nothing to either subtotal."
    constants:
      PARITY_DISCLOSURE_THRESHOLD_PCT: 0.10
    precision: "integer cents; effective_markup_pct to 4 decimals, round_half_up; an empty priced_lines set yields 0 markup and 0.0000 pct"

  - name: shopper_commitment_ledger
    trigger: "POST /batches/{id}/claim, POST /batches/{id}/deliver, POST /batches/{id}/abandon, and the system-release transition"
    algorithm: aggregation
    formula: |
      committed_units = sum(Batch.total_units over batches where Batch.claimed_shopper_id == shopper.id
                            and Batch.status IN {CLAIMED, SHOPPING, CHECKED_OUT})
      # Conservation invariant (capacity_units_conserved): a claim followed by its compensating
      # action (abandon, system release, or deliver) MUST return committed_units to the exact
      # value it held before the claim, and the stored field MUST always equal the sum above.
      completed_batch_count = injected_completed_history
                              + count(Batch rows where claimed_shopper_id == shopper.id and status == DELIVERED)
      abandonment_count     = injected_abandonment_history
                              + count of shopper-initiated abandonments (system releases excluded)
    input_set: "Batches claimed by the shopper filtered to CLAIMED, SHOPPING and CHECKED_OUT; DELIVERED and ABANDONED batches hold no capacity."
    constants: {}
    precision: "integer units"

  - name: temporal_window_deadlines
    trigger: "POST /batches/{id}/dispatch, POST /batches/{id}/reassign, POST /batches/{id}/deliver, POST /replacement-requests"
    algorithm: chronological
    formula: |
      # The three deadline fields the state machine writes; every value is derived from the
      # logical clock at the writing transition, never from wall-clock time.
      Batch.offer_expires_at        = clock_now + OFFER_TTL_MINUTES minutes          # written on dispatch and reassign
      Order.tip_window_closes_at    = Order.delivered_at + TIP_WINDOW_HOURS hours    # delivered_at == clock_now at delivery
      ReplacementRequest.expires_at = clock_now + REPLACEMENT_TTL_MINUTES minutes    # written at proposal time
      # Expiry is evaluated lazily: nothing changes state when the clock passes a deadline; the
      # affected endpoint compares clock_now against the stored instant on its next call.
    input_set: "The single Batch, Order or ReplacementRequest row being written, plus the logical clock value at that instant."
    constants:
      OFFER_TTL_MINUTES: 30
      TIP_WINDOW_HOURS: 2
      REPLACEMENT_TTL_MINUTES: 20
      TIP_ADJUSTMENT_MAX_COUNT: 2      # accepted adjustments allowed inside one tip window
    precision: "whole minutes, ISO 8601 UTC; comparisons are `clock_now < deadline` to remain open, so an action at exactly the deadline instant is rejected"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5."
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id resolves, validated left to right: retailer id."
    error_id: ERR_RETAILER_NOT_FOUND
    http_status: 404
    applies_to: "GET /retailers/{id}, PATCH /retailers/{id}/parity-policy"

  - priority: 3
    category: existence
    check: "Catalog item path id resolves."
    error_id: ERR_CATALOG_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /catalog-items/{id}, PATCH /catalog-items/{id}"

  - priority: 3
    category: existence
    check: "Customer path id resolves."
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "GET /customers/{id}, POST /customers/{id}/credits"

  - priority: 3
    category: existence
    check: "Shopper path id resolves."
    error_id: ERR_SHOPPER_NOT_FOUND
    http_status: 404
    applies_to: "GET /shoppers/{id}, POST /shoppers/{id}/ratings, POST /shoppers/{id}/reinstate, POST /_shoppers/{id}/history"

  - priority: 3
    category: existence
    check: "Order path id resolves."
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /orders/{id}, POST /orders/{id}/lines, POST /orders/{id}/submit, POST /orders/{id}/tip-adjustments, POST /orders/{id}/reauthorize, GET /orders/{id}/parity-disclosure, GET /orders/{id}/batch-orders"

  - priority: 3
    category: existence
    check: "Order line path id resolves."
    error_id: ERR_ORDER_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /order-lines/{id}, POST /order-lines/{id}/pick"

  - priority: 3
    category: existence
    check: "Batch path id resolves."
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "GET /batches/{id}, GET /batches/{id}/batch-orders, and every POST /batches/{id}/* action"

  - priority: 3
    category: existence
    check: "Replacement request path id resolves."
    error_id: ERR_REPLACEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /replacement-requests/{id}, POST /replacement-requests/{id}/approve, POST /replacement-requests/{id}/reject"

  - priority: 4
    category: auth
    check: |
      Ownership of the addressed resource: a Customer's X-User-ID must equal Order.customer_id
      (or the customer_id of the order owning the addressed line or replacement request); a
      Shopper's X-User-ID must equal Batch.offered_shopper_id for a claim and
      Batch.claimed_shopper_id for start-shopping, pick, replacement creation, checkout, deliver
      and abandon; a RetailerManager's X-User-ID must equal the CatalogItem's retailer_id.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints acted on by Customer, Shopper or RetailerManager"

  - priority: 5
    category: business_constraint
    check: |
      Request body schema: required fields present, types correct, enum members valid, integers
      within their declared ranges, PER_LB lines carry requested_weight_lb > 0 and requested_qty
      == 1, EACH lines carry requested_weight_lb == 0, shop_window_end > shop_window_start,
      stars within 1..5, tip_amount_cents within 0..20000, pagination limit within 1..100.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "Body foreign keys resolve: customer_id and retailer_id on order creation, catalog_item_id on line creation, order_id on batch membership, order_line_id and proposed_catalog_item_id on replacement creation, shopper_id on rating backfill."
    error_id: ERR_CATALOG_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /batches/{id}/orders, POST /replacement-requests, POST /_ratings/backfill (each body FK maps to its own ERR_*_NOT_FOUND id)"

  - priority: 7
    category: state
    check: "expected_order_version equals the stored Order.version."
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/tip-adjustments"

  - priority: 7
    category: state
    check: "expected_batch_version equals the stored Batch.version."
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /batches/{id}/orders"

  - priority: 7
    category: business_referential
    check: |
      The order is not already a member of any batch (one BatchOrder row per order, ever).
      Deliberately ranked ABOVE the priority-8 `order.fulfillment_status == PLACED` gate: an
      already-batched order necessarily fails that gate too, so the membership rule must be
      consulted first for the more specific error to ever be observable.
    error_id: ERR_ORDER_ALREADY_BATCHED
    http_status: 409
    applies_to: "POST /batches/{id}/orders"

  - priority: 8
    category: state
    check: "order.fulfillment_status == DRAFT."
    error_id: ERR_ORDER_NOT_DRAFT
    http_status: 409
    applies_to: "POST /orders/{id}/lines, POST /orders/{id}/submit"

  - priority: 8
    category: state
    check: "order.fulfillment_status == PLACED."
    error_id: ERR_ORDER_NOT_PLACED
    http_status: 409
    applies_to: "POST /batches/{id}/orders"

  - priority: 8
    category: state
    check: "order.fulfillment_status == DELIVERED."
    error_id: ERR_ORDER_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /shoppers/{id}/ratings, POST /orders/{id}/tip-adjustments"

  - priority: 8
    category: state
    check: "batch.status == BUILDING."
    error_id: ERR_BATCH_NOT_BUILDING
    http_status: 409
    applies_to: "POST /batches/{id}/orders"

  - priority: 8
    category: state
    check: "batch.status == BUILDING for a first dispatch, or OFFERED with an expired offer for a re-offer."
    error_id: ERR_BATCH_NOT_OFFERED
    http_status: 409
    applies_to: "POST /batches/{id}/dispatch, POST /batches/{id}/claim"

  - priority: 8
    category: state
    check: "batch.status == CLAIMED."
    error_id: ERR_BATCH_NOT_CLAIMED
    http_status: 409
    applies_to: "POST /batches/{id}/start-shopping"

  - priority: 8
    category: state
    check: "batch.status == SHOPPING."
    error_id: ERR_BATCH_NOT_SHOPPING
    http_status: 409
    applies_to: "POST /batches/{id}/checkout, POST /order-lines/{id}/pick, POST /replacement-requests"

  - priority: 8
    category: state
    check: "batch.status == CHECKED_OUT."
    error_id: ERR_BATCH_NOT_CHECKED_OUT
    http_status: 409
    applies_to: "POST /batches/{id}/deliver"

  - priority: 8
    category: state
    check: "batch.status == ABANDONED."
    error_id: ERR_BATCH_NOT_ABANDONED
    http_status: 409
    applies_to: "POST /batches/{id}/reassign"

  - priority: 8
    category: state
    check: "batch.status IN {CLAIMED, SHOPPING, CHECKED_OUT} for an abandonment."
    error_id: ERR_BATCH_NOT_CLAIMED
    http_status: 409
    applies_to: "POST /batches/{id}/abandon"

  - priority: 8
    category: state
    check: "line.status == REQUESTED."
    error_id: ERR_LINE_NOT_PICKABLE
    http_status: 409
    applies_to: "POST /order-lines/{id}/pick, POST /replacement-requests"

  - priority: 8
    category: state
    check: "request.status == PENDING."
    error_id: ERR_REPLACEMENT_NOT_PENDING
    http_status: 409
    applies_to: "POST /replacement-requests/{id}/approve, POST /replacement-requests/{id}/reject"

  - priority: 8
    category: state
    check: "the batch's ShopperPayout row exists with status == PROVISIONAL."
    error_id: ERR_PAYOUT_NOT_PROVISIONAL
    http_status: 409
    applies_to: "POST /batches/{id}/finalize-payout"

  - priority: 8
    category: state
    check: "shopper.status == SUSPENDED_REVIEW."
    error_id: ERR_SHOPPER_NOT_SUSPENDED
    http_status: 409
    applies_to: "POST /shoppers/{id}/reinstate"

  - priority: 8
    category: state
    check: "order.payment_status == REAUTH_HELD."
    error_id: ERR_REAUTH_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /orders/{id}/reauthorize"

  - priority: 9
    category: business_referential
    check: "The proposed CatalogItem.retailer_id equals the target line's Order.retailer_id."
    error_id: ERR_REPLACEMENT_RETAILER_MISMATCH
    http_status: 422
    applies_to: "POST /replacement-requests"

  - priority: 9
    category: business_referential
    check: "The batch has at least one BatchOrder row (total_units >= 1)."
    error_id: ERR_BATCH_EMPTY
    http_status: 422
    applies_to: "POST /batches/{id}/dispatch, POST /batches/{id}/reassign"

  - priority: 10
    category: business_safety
    check: "When order.ebt_requested is true the order's Retailer.ebt_snap_enabled must be true."
    error_id: ERR_EBT_NOT_ENABLED
    http_status: 422
    applies_to: "POST /orders/{id}/submit"

  - priority: 10
    category: business_safety
    check: "A substitution for a line whose ebt_eligible_snapshot is true on an order with authorized_ebt_cents > 0 must itself be SNAP-eligible; EBT funds may never migrate onto an ineligible item."
    error_id: ERR_EBT_INELIGIBLE_REPLACEMENT
    http_status: 422
    applies_to: "POST /replacement-requests"

  - priority: 11
    category: business_temporal
    check: "calculations.shopper_window_overlap finds no conflicting batch already claimed by this shopper."
    error_id: ERR_SHOPPER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /batches/{id}/claim"

  - priority: 11
    category: business_temporal
    check: "calculations.retailer_concurrency_overlap counts fewer than Retailer.concurrent_shopper_cap colliding batches."
    error_id: ERR_RETAILER_CONCURRENCY_CAP_REACHED
    http_status: 409
    applies_to: "POST /batches/{id}/orders"

  - priority: 11
    category: business_temporal
    check: "clock_now >= batch.shop_window_start before a claimed batch may start shopping."
    error_id: ERR_SHOP_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /batches/{id}/start-shopping"

  - priority: 11
    category: business_temporal
    check: "clock_now < batch.offer_expires_at."
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /batches/{id}/claim"

  - priority: 11
    category: business_temporal
    check: "clock_now < order.tip_window_closes_at."
    error_id: ERR_TIP_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /orders/{id}/tip-adjustments"

  - priority: 11
    category: business_temporal
    check: "clock_now >= every member Order.tip_window_closes_at before a payout may be finalized."
    error_id: ERR_PAYOUT_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /batches/{id}/finalize-payout"

  - priority: 11
    category: business_temporal
    check: "clock_now < request.expires_at for an approval (an expired-but-still-PENDING request cannot be approved)."
    error_id: ERR_REPLACEMENT_NOT_PENDING
    http_status: 409
    applies_to: "POST /replacement-requests/{id}/approve"

  - priority: 12
    category: business_constraint
    check: "shopper.status == ACTIVE."
    error_id: ERR_SHOPPER_SUSPENDED
    http_status: 403
    applies_to: "POST /batches/{id}/claim"

  - priority: 12
    category: business_constraint
    check: "tier_rank(shopper.tier) >= tier_rank(batch.tier_access_floor)."
    error_id: ERR_TIER_BELOW_BATCH_FLOOR
    http_status: 403
    applies_to: "POST /batches/{id}/claim"

  - priority: 12
    category: business_constraint
    check: "The line's CatalogItem.availability == IN_STOCK when picking it as ordered."
    error_id: ERR_ITEM_OUT_OF_STOCK
    http_status: 409
    applies_to: "POST /order-lines/{id}/pick"

  - priority: 12
    category: business_constraint
    check: "For a PER_LB line, abs(final_weight_lb - requested_weight_lb) <= requested_weight_lb * WEIGHT_VARIANCE_PCT (0.20)."
    error_id: ERR_WEIGHT_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /order-lines/{id}/pick"

  - priority: 12
    category: business_constraint
    check: "At most one ShopperRating row per (shopper_id, order_id) pair."
    error_id: ERR_DUPLICATE_RATING
    http_status: 409
    applies_to: "POST /shoppers/{id}/ratings"

  - priority: 12
    category: business_constraint
    check: "order.tip_adjustment_count < TIP_ADJUSTMENT_MAX_COUNT (2)."
    error_id: ERR_TIP_ADJUSTMENT_LIMIT
    http_status: 409
    applies_to: "POST /orders/{id}/tip-adjustments"

  - priority: 12
    category: business_constraint
    check: "shopper.lifetime_tier_score >= REINSTATEMENT_MIN_SCORE (0.6000)."
    error_id: ERR_REINSTATE_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /shoppers/{id}/reinstate"

  - priority: 13
    category: business_fiscal
    check: "shopper.committed_units + batch.total_units <= shopper.vehicle_capacity_units."
    error_id: ERR_SHOPPER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /batches/{id}/claim"

  - priority: 13
    category: business_fiscal
    check: "batch.checkout_blocked_count == 0, i.e. no member order sits in REAUTH_HELD."
    error_id: ERR_ORDER_PAYMENT_HELD
    http_status: 409
    applies_to: "POST /batches/{id}/checkout"

  - priority: 14
    category: business_constraint
    check: "calculations.dispatch_shopper_selection produced a non-empty candidate set (selector fallback, evaluated last so every cheaper rejection wins first)."
    error_id: ERR_NO_ELIGIBLE_SHOPPER
    http_status: 422
    applies_to: "POST /batches/{id}/dispatch, POST /batches/{id}/reassign"

  - priority: 3
    category: existence
    check: "Shopper-rating path id resolves."
    error_id: ERR_RATING_NOT_FOUND
    http_status: 404
    applies_to: "GET /shopper-ratings/{id}"

  - priority: 3
    category: existence
    check: "Payout path id resolves."
    error_id: ERR_PAYOUT_NOT_FOUND
    http_status: 404
    applies_to: "GET /shopper-payouts/{id}"

  - priority: 3
    category: existence
    check: "Credit-ledger-entry path id resolves."
    error_id: ERR_CREDIT_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /credit-ledger-entries/{id}"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is "" — every collection is top-level)
# =============================================================================
endpoints:
  # --- Retailer & catalog -----------------------------------------------------
  - method: POST
    path: "/retailers"
    description: "Onboard a retailer with its markup policy, EBT/SNAP capability and per-store concurrent-shopper cap."
    roles: [DispatchAdmin]
    code: 201
    input: [legal_name, store_code, "catalog_markup_pct?", "parity_disclosure_required?", "ebt_snap_enabled?", "concurrent_shopper_cap?", "status?"]
    output: Retailer
    side_effects: []

  - method: GET
    path: "/retailers/{id}"
    description: "Read one retailer."
    roles: [DispatchAdmin, RetailerManager, CustomerSupport]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  - method: PATCH
    path: "/retailers/{id}/parity-policy"
    description: "Update the retailer's catalog markup percentage, parity-disclosure flag and concurrency cap."
    roles: [RetailerManager]
    code: 200
    input: ["catalog_markup_pct?", "parity_disclosure_required?", "concurrent_shopper_cap?"]
    output: Retailer
    side_effects:
      - "re-runs calculations.catalog_price_markup for every CatalogItem of this retailer, rewriting catalog_price_cents"
      - "does NOT rewrite unit_price_cents_snapshot / in_store_price_cents_snapshot on existing OrderLine rows"
      - "increments Retailer.version by 1"

  - method: POST
    path: "/catalog-items"
    description: "Publish a catalog item; the customer-facing catalog price is derived from the in-store price and the retailer markup."
    roles: [RetailerManager]
    code: 201
    input: [retailer_id, sku, name, pricing_unit, in_store_price_cents, "is_ebt_eligible?", "estimated_weight_lb?", "unit_weight_lb?", "availability?"]
    output: CatalogItem
    side_effects:
      - "runs calculations.catalog_price_markup to set catalog_price_cents"
      - "sets is_weighted to (pricing_unit == PER_LB)"

  - method: GET
    path: "/catalog-items/{id}"
    description: "Read one catalog item."
    roles: [RetailerManager, DispatchAdmin, Customer, Shopper, CustomerSupport]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []

  - method: GET
    path: "/catalog-items"
    description: "List catalog items, optionally filtered by retailer or availability (reverse-reachability for CatalogItem.retailer_id)."
    roles: [RetailerManager, DispatchAdmin, Customer, Shopper, CustomerSupport]
    code: 200
    input: ["retailer_id?", "availability?", "is_ebt_eligible?", "limit?", "offset?"]
    output: CatalogItem[]
    side_effects: []

  - method: PATCH
    path: "/catalog-items/{id}"
    description: "Update shelf price, availability, EBT eligibility or weight metadata of a catalog item."
    roles: [RetailerManager]
    code: 200
    input: ["in_store_price_cents?", "availability?", "is_ebt_eligible?", "estimated_weight_lb?", "unit_weight_lb?"]
    output: CatalogItem
    side_effects:
      - "re-runs calculations.catalog_price_markup to rewrite catalog_price_cents"
      - "leaves every existing OrderLine snapshot untouched"
      - "increments CatalogItem.version by 1"

  # --- Customer & credit ledger ----------------------------------------------
  - method: POST
    path: "/customers"
    description: "Register a customer, optionally seeding an EBT/SNAP benefit balance."
    roles: [CustomerSupport]
    code: 201
    input: [display_name, card_last4, "ebt_snap_balance_cents?"]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Read one customer including EBT balance and credit balance."
    roles: [Customer, CustomerSupport, DispatchAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{id}/credits"
    description: "Post a credit-ledger entry for a customer (support goodwill, parity adjustment, or a manual make-good)."
    roles: [CustomerSupport]
    code: 201
    input: [amount_cents, reason_code, "order_id?"]
    output: CreditLedgerEntry
    side_effects:
      - "recomputes Customer.credit_balance_cents as the sum of all CreditLedgerEntry.amount_cents"

  - method: GET
    path: "/credit-ledger-entries/{id}"
    description: "Read one credit-ledger entry."
    roles: [Customer, CustomerSupport, DispatchAdmin]
    code: 200
    input: []
    output: CreditLedgerEntry
    side_effects: []

  - method: GET
    path: "/credit-ledger-entries"
    description: "List credit-ledger entries by customer, order or reason (reverse-reachability for both CreditLedgerEntry FKs)."
    roles: [Customer, CustomerSupport, DispatchAdmin]
    code: 200
    input: ["customer_id?", "order_id?", "reason_code?", "limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []

  # --- Shopper, ratings & tier ------------------------------------------------
  - method: POST
    path: "/shoppers"
    description: "Enroll a shopper with a vehicle capacity expressed in batch units."
    roles: [DispatchAdmin]
    code: 201
    input: [display_name, service_area_code, vehicle_capacity_units]
    output: Shopper
    side_effects:
      - "runs calculations.shopper_tier_scoring with an empty rating history, which lands both tier and lifetime_tier on PROBATION"
      - "initialises committed_units, completed_batch_count and abandonment_count to 0"

  - method: GET
    path: "/shoppers/{id}"
    description: "Read one shopper including both tier variants, both scores and the capacity ledger."
    roles: [Shopper, DispatchAdmin, CustomerSupport]
    code: 200
    input: []
    output: Shopper
    side_effects: []

  - method: POST
    path: "/shoppers/{id}/ratings"
    description: "Customer rates the shopper for a delivered order; the rating re-scores both tier variants."
    roles: [Customer]
    code: 201
    input: [stars, order_id]
    output: ShopperRating
    side_effects:
      - "assigns ShopperRating.sequence_no as max(existing sequence_no for this shopper) + 1"
      - "re-runs calculations.shopper_tier_scoring, rewriting rolling_recent_avg, lifetime_rating_avg, rolling_tier_score, lifetime_tier_score, tier and lifetime_tier"

  - method: GET
    path: "/shopper-ratings/{id}"
    description: "Read one shopper rating."
    roles: [Shopper, Customer, DispatchAdmin, CustomerSupport]
    code: 200
    input: []
    output: ShopperRating
    side_effects: []

  - method: GET
    path: "/shopper-ratings"
    description: "List ratings by shopper or order (reverse-reachability for both ShopperRating FKs)."
    roles: [Shopper, Customer, DispatchAdmin, CustomerSupport]
    code: 200
    input: ["shopper_id?", "order_id?", "limit?", "offset?"]
    output: ShopperRating[]
    side_effects: []

  - method: POST
    path: "/shoppers/{id}/reinstate"
    description: "Lift a suspension and return the shopper to ACTIVE; allowed only when the LIFETIME score has recovered."
    roles: [DispatchAdmin]
    code: 200
    input: []
    output: Shopper
    side_effects:
      - "moves Shopper.status SUSPENDED_REVIEW -> ACTIVE"
      - "increments Shopper.version by 1"

  - method: POST
    path: "/_ratings/backfill"
    description: "Test-driving endpoint: inject an ordered star history for a shopper as ShopperRating rows with order_id null, in list order, so tier bands are reachable without staging that many deliveries."
    roles: [DispatchAdmin]
    code: 200
    input: [shopper_id, stars_sequence]
    output: Shopper
    side_effects:
      - "creates one ShopperRating row per element of stars_sequence with order_id null and sequence_no assigned in list order"
      - "re-runs calculations.shopper_tier_scoring once after the whole sequence is written"

  - method: POST
    path: "/_shoppers/{id}/history"
    description: "Test-driving endpoint: set the injected completed-batch and abandonment history counters of a shopper directly."
    roles: [DispatchAdmin]
    code: 200
    input: ["completed_batch_count?", "abandonment_count?"]
    output: Shopper
    side_effects:
      - "overwrites Shopper.completed_batch_count and/or Shopper.abandonment_count with the supplied values"
      - "re-runs calculations.shopper_tier_scoring so both scores and both tiers reflect the injected reliability history"
      - "never changes Shopper.status by itself"

  # --- Orders & lines ---------------------------------------------------------
  - method: POST
    path: "/orders"
    description: "Open a draft order against one retailer."
    roles: [Customer]
    code: 201
    input: [customer_id, retailer_id, delivery_distance_mi, delivery_deadline, "ebt_requested?", "tip_amount_cents?"]
    output: Order
    side_effects:
      - "fulfillment_status starts at DRAFT and payment_status at UNAUTHORIZED"

  - method: GET
    path: "/orders/{id}"
    description: "Read one order including both status dimensions and every money field."
    roles: [Customer, Shopper, DispatchAdmin, CustomerSupport]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders by customer, retailer or either status dimension (reverse-reachability for both Order FKs)."
    roles: [Customer, Shopper, DispatchAdmin, CustomerSupport]
    code: 200
    input: ["customer_id?", "retailer_id?", "fulfillment_status?", "payment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a line to a draft order, snapshotting catalog price, in-store price and EBT eligibility at add time."
    roles: [Customer]
    code: 201
    input: [catalog_item_id, "requested_qty?", "requested_weight_lb?"]
    output: OrderLine
    side_effects:
      - "copies CatalogItem.catalog_price_cents into unit_price_cents_snapshot, CatalogItem.in_store_price_cents into in_store_price_cents_snapshot and CatalogItem.is_ebt_eligible into ebt_eligible_snapshot"
      - "status starts at REQUESTED"

  - method: GET
    path: "/order-lines/{id}"
    description: "Read one order line."
    roles: [Customer, Shopper, DispatchAdmin, CustomerSupport]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "List order lines by order, catalog item or status (reverse-reachability for both OrderLine FKs)."
    roles: [Customer, Shopper, DispatchAdmin, CustomerSupport]
    code: 200
    input: ["order_id?", "catalog_item_id?", "status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/submit"
    description: "Place the order: estimate the basket, authorize funds with the ESTIMATE variant and split the authorization across EBT and card."
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "runs calculations.order_estimate_authorization with variant ESTIMATE, writing estimated_subtotal_cents, authorization_ceiling_cents, authorized_ebt_cents and authorized_card_cents"
      - "copies tip_amount_cents into tip_original_cents"
      - "moves fulfillment_status DRAFT -> PLACED and payment_status UNAUTHORIZED -> AUTHORIZED"
      - "increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/tip-adjustments"
    description: "Adjust the tip inside the post-delivery adjustment window; guarded by OCC on Order.version."
    roles: [Customer]
    code: 200
    input: [tip_amount_cents, expected_order_version]
    output: Order
    side_effects:
      - "rewrites Order.tip_amount_cents and increments tip_adjustment_count by 1"
      - "re-runs calculations.shopper_batch_pay and calculations.payout_finalization with variant PROVISIONAL on the batch's ShopperPayout row, rewriting tip_pass_through_cents, tip_protection_cents, guarantee_top_up_cents and total_payout_cents"
      - "increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/reauthorize"
    description: "Re-authorize an order whose approved replacements pushed the basket above the existing authorization ceiling."
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "re-runs calculations.order_estimate_authorization with variant ESTIMATE over the current line snapshots, rewriting authorization_ceiling_cents, authorized_ebt_cents and authorized_card_cents"
      - "moves payment_status REAUTH_HELD -> AUTHORIZED"
      - "decrements Batch.checkout_blocked_count by 1 on the batch holding this order"
      - "increments Order.version by 1"

  - method: GET
    path: "/orders/{id}/parity-disclosure"
    description: "Computed read: catalog-vs-in-store price parity for the order, and whether the retailer's disclosure duty is triggered."
    roles: [Customer, CustomerSupport, DispatchAdmin, RetailerManager]
    code: 200
    input: []
    output:
      order_id: string
      catalog_total_cents: integer
      in_store_total_cents: integer
      markup_cents: integer
      effective_markup_pct: number
      disclosure_required: boolean
      disclosure_satisfied: boolean
    side_effects: []

  # --- Batch construction & dispatch -----------------------------------------
  - method: POST
    path: "/batches"
    description: "Open an empty batch for a service area and shopping window, with an optional tier access floor."
    roles: [DispatchAdmin]
    code: 201
    input: [service_area_code, shop_window_start, shop_window_end, "tier_access_floor?"]
    output: Batch
    side_effects:
      - "status starts at BUILDING with all aggregates at 0 and declined_shopper_ids empty"

  - method: GET
    path: "/batches/{id}"
    description: "Read one batch including its aggregates, offer state and decline history."
    roles: [DispatchAdmin, Shopper, CustomerSupport]
    code: 200
    input: []
    output: Batch
    side_effects: []

  - method: GET
    path: "/batches"
    description: "List batches by status, service area, offeree or claimant (reverse-reachability for Batch.offered_shopper_id and Batch.claimed_shopper_id)."
    roles: [DispatchAdmin, Shopper, CustomerSupport]
    code: 200
    input: ["status?", "service_area_code?", "offered_shopper_id?", "claimed_shopper_id?", "limit?", "offset?"]
    output: Batch[]
    side_effects: []

  - method: POST
    path: "/batches/{id}/orders"
    description: "Attach a placed order to a building batch; guarded by OCC on Batch.version and by the retailer's concurrent-shopper cap."
    roles: [DispatchAdmin]
    code: 201
    input: [order_id, expected_batch_version]
    output: BatchOrder
    side_effects:
      - "assigns BatchOrder.sequence_no as max(existing sequence_no in this batch) + 1 and BatchOrder.units from the order's line count"
      - "re-runs calculations.batch_composition_aggregates, rewriting Batch.total_units, total_weight_lb, total_distance_mi, store_count and delivery_deadline"
      - "moves the order's fulfillment_status PLACED -> IN_BATCH"
      - "increments Batch.version by 1"

  - method: GET
    path: "/batches/{id}/batch-orders"
    description: "List the membership rows of a batch (reverse-reachability for BatchOrder.batch_id)."
    roles: [DispatchAdmin, Shopper, CustomerSupport]
    code: 200
    input: ["limit?", "offset?"]
    output: BatchOrder[]
    side_effects: []

  - method: GET
    path: "/orders/{id}/batch-orders"
    description: "List the membership rows referencing an order (reverse-reachability for BatchOrder.order_id); length 0 or 1."
    roles: [DispatchAdmin, Shopper, Customer, CustomerSupport]
    code: 200
    input: ["limit?", "offset?"]
    output: BatchOrder[]
    side_effects: []

  - method: POST
    path: "/batches/{id}/dispatch"
    description: "Offer the batch to exactly one shopper chosen by the dispatch selector policy; also used to re-offer after an offer lapses."
    roles: [DispatchAdmin]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "runs calculations.dispatch_shopper_selection over the eligible pool"
      - "sets offered_shopper_id to the winner and offer_expires_at to clock_now + OFFER_TTL_MINUTES"
      - "moves status BUILDING -> OFFERED, or OFFERED -> OFFERED when the standing offer has lapsed"
      - "on a lapsed re-offer, appends the lapsed offeree's id to declined_shopper_ids before re-selecting"

  - method: POST
    path: "/batches/{id}/claim"
    description: "Shopper accepts the standing offer; capacity, tier floor, suspension and window conflicts are all enforced here."
    roles: [Shopper]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "moves status OFFERED -> CLAIMED, sets claimed_shopper_id and clears offered_shopper_id"
      - "increases Shopper.committed_units by Batch.total_units per calculations.shopper_commitment_ledger"
      - "increments Batch.version by 1"

  - method: POST
    path: "/batches/{id}/start-shopping"
    description: "Shopper arrives in store and begins picking."
    roles: [Shopper]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "moves status CLAIMED -> SHOPPING"
      - "moves every member order's fulfillment_status IN_BATCH -> SHOPPING"

  - method: POST
    path: "/order-lines/{id}/pick"
    description: "Pick a line as ordered; PER_LB lines are re-priced from the weight actually scanned at the scale."
    roles: [Shopper]
    code: 200
    input: ["picked_qty?", "final_weight_lb?"]
    output: OrderLine
    side_effects:
      - "runs calculations.checkout_line_pricing to write final_price_cents from the snapshot price and the final quantity or weight"
      - "moves status REQUESTED -> PICKED"

  - method: POST
    path: "/replacement-requests"
    description: "Shopper proposes an in-aisle substitute for a line that cannot be picked as ordered."
    roles: [Shopper]
    code: 201
    input: [batch_id, order_line_id, proposed_catalog_item_id, "proposed_qty?", "proposed_weight_lb?"]
    output: ReplacementRequest
    side_effects:
      - "runs calculations.replacement_price_delta to write price_delta_cents"
      - "sets expires_at to clock_now + REPLACEMENT_TTL_MINUTES and status to PENDING"
      - "moves the target OrderLine.status REQUESTED -> REPLACEMENT_PENDING"

  - method: GET
    path: "/replacement-requests/{id}"
    description: "Read one replacement request."
    roles: [Shopper, Customer, DispatchAdmin, CustomerSupport]
    code: 200
    input: []
    output: ReplacementRequest
    side_effects: []

  - method: GET
    path: "/replacement-requests"
    description: "List replacement requests by batch, line, proposed item or status (reverse-reachability for all three ReplacementRequest FKs)."
    roles: [Shopper, Customer, DispatchAdmin, CustomerSupport]
    code: 200
    input: ["batch_id?", "order_line_id?", "proposed_catalog_item_id?", "status?", "limit?", "offset?"]
    output: ReplacementRequest[]
    side_effects: []

  - method: POST
    path: "/replacement-requests/{id}/approve"
    description: "Customer accepts the substitute; the line is repointed and re-priced, which can push the order over its authorization ceiling."
    roles: [Customer]
    code: 200
    input: []
    output: ReplacementRequest
    side_effects:
      - "sets status APPROVED and resolution_effect LINE_REPLACED"
      - "repoints OrderLine.catalog_item_id to the proposed item, rewrites its three snapshot fields from the proposed item, writes final_price_cents from calculations.checkout_line_pricing and moves OrderLine.status REPLACEMENT_PENDING -> REPLACED"
      - "when the re-priced basket exceeds authorization_ceiling_cents, moves the order's payment_status AUTHORIZED -> REAUTH_HELD and increments Batch.checkout_blocked_count by 1"
      - "increments Order.version by 1"

  - method: POST
    path: "/replacement-requests/{id}/reject"
    description: "Customer refuses the substitute; the line falls back to a refund instead of a substitution."
    roles: [Customer]
    code: 200
    input: []
    output: ReplacementRequest
    side_effects:
      - "sets status REJECTED and resolution_effect LINE_REFUNDED"
      - "moves OrderLine.status REPLACEMENT_PENDING -> REFUNDED, sets its picked_qty to 0, final_weight_lb to 0 and final_price_cents to 0"
      - "adds the line's snapshot value to Order.refunded_cents"

  - method: POST
    path: "/batches/{id}/checkout"
    description: "Ring up every member order at the register: weighted lines settle at final weight and the split tender is captured EBT-first."
    roles: [Shopper]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "sweeps first: every still-PENDING ReplacementRequest on a member line moves PENDING -> EXPIRED with resolution_effect LINE_REFUNDED and its OrderLine.status REPLACEMENT_PENDING -> REFUNDED with final_price_cents 0"
      - "runs calculations.checkout_line_pricing and calculations.checkout_split_tender_capture per member order, writing captured_subtotal_cents, ebt_captured_cents and card_captured_cents"
      - "decreases Customer.ebt_snap_balance_cents and increases Customer.ebt_captured_total_cents by ebt_captured_cents"
      - "moves every member order's payment_status AUTHORIZED -> CAPTURED and fulfillment_status SHOPPING -> CHECKED_OUT"
      - "runs calculations.price_parity_disclosure to write Order.parity_markup_cents and Order.parity_disclosed, and when parity_credit_cents > 0 creates a PARITY_ADJUSTMENT CreditLedgerEntry and recomputes Customer.credit_balance_cents"
      - "moves status SHOPPING -> CHECKED_OUT"

  - method: POST
    path: "/batches/{id}/deliver"
    description: "Hand the groceries over: the batch completes, the tip adjustment window opens and a provisional payout is written."
    roles: [Shopper]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "moves status CHECKED_OUT -> DELIVERED and every member order's fulfillment_status CHECKED_OUT -> DELIVERED"
      - "sets Order.delivered_at to clock_now, re-snapshots Order.tip_original_cents from tip_amount_cents and sets Order.tip_window_closes_at to clock_now + TIP_WINDOW_HOURS"
      - "creates one ShopperPayout with status PROVISIONAL from calculations.shopper_batch_pay and calculations.payout_finalization variant PROVISIONAL"
      - "increases Shopper.completed_batch_count by 1, decreases Shopper.committed_units by Batch.total_units and re-runs calculations.shopper_tier_scoring"

  - method: GET
    path: "/shopper-payouts/{id}"
    description: "Read one payout with its full money breakdown."
    roles: [Shopper, DispatchAdmin, CustomerSupport]
    code: 200
    input: []
    output: ShopperPayout
    side_effects: []

  - method: GET
    path: "/shopper-payouts"
    description: "List payouts by batch, shopper or status (reverse-reachability for both ShopperPayout FKs)."
    roles: [Shopper, DispatchAdmin, CustomerSupport]
    code: 200
    input: ["batch_id?", "shopper_id?", "status?", "limit?", "offset?"]
    output: ShopperPayout[]
    side_effects: []

  - method: POST
    path: "/batches/{id}/abandon"
    description: "Shopper drops a batch mid-flight; the four-link cascade forfeits pay, credits every customer, re-scores the shopper and can suspend them."
    roles: [Shopper]
    code: 200
    input: ["reason_note?"]
    output: Batch
    side_effects:
      - "moves status CLAIMED | SHOPPING | CHECKED_OUT -> ABANDONED, sets abandoned_at, clears claimed_shopper_id and appends the abandoning shopper to declined_shopper_ids"
      - "creates one FORFEITED ShopperPayout with every money field 0 and moves every member order's fulfillment_status to REASSIGN_PENDING"
      - "creates one ABANDONMENT_INCONVENIENCE CreditLedgerEntry per member order from calculations.abandonment_customer_credit; a CHECKED_OUT abandonment additionally reverses the capture and posts a POST_CHECKOUT_REVERSAL entry"
      - "runs the four cascade links of §1.2: committed_units / abandonment_count -> tier -> Shopper.status SUSPENDED_REVIEW -> system release of every sibling batch the shopper still holds"

  - method: POST
    path: "/batches/{id}/reassign"
    description: "Re-offer an abandoned batch to a fresh shopper; the previous holder is excluded by the decline list."
    roles: [DispatchAdmin]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "moves status ABANDONED -> OFFERED, increments reassignment_count by 1 and sets a new offered_shopper_id / offer_expires_at from calculations.dispatch_shopper_selection"
      - "moves every member order's fulfillment_status REASSIGN_PENDING -> IN_BATCH"
      - "increments Batch.version by 1"

  - method: POST
    path: "/batches/{id}/finalize-payout"
    description: "Close the payout after every member order's tip window has shut, applying tip-baiting protection and the unit guarantee."
    roles: [DispatchAdmin]
    code: 200
    input: []
    output: ShopperPayout
    side_effects:
      - "re-runs calculations.payout_finalization with variant FINAL in the strict S1..S6 order over the adjusted tips"
      - "rewrites tip_pass_through_cents, tip_protection_cents, guarantee_top_up_cents and total_payout_cents, then moves ShopperPayout.status PROVISIONAL -> FINAL"
      - "increments ShopperPayout.version by 1"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every deadline, offer TTL, replacement TTL and tip window is evaluated against this logical clock."
    roles: [DispatchAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock; performs no state transition and expires nothing by itself (expiry is evaluated lazily when the affected endpoint is next called)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth & request shape ---------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles."
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "The acting Customer, Shopper or RetailerManager is not the owner of the addressed resource."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, unknown enum member, out-of-range integer, non-positive PER_LB weight, shop_window_end <= shop_window_start, stars outside 1..5, or pagination limit outside 1..100."

  # --- not found -------------------------------------------------------------
  - id: ERR_RETAILER_NOT_FOUND
    http: 404
    condition: "No Retailer with the given id (path or body FK)."
  - id: ERR_CATALOG_ITEM_NOT_FOUND
    http: 404
    condition: "No CatalogItem with the given id (path, catalog_item_id, or proposed_catalog_item_id)."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "No Customer with the given id (path or customer_id)."
  - id: ERR_SHOPPER_NOT_FOUND
    http: 404
    condition: "No Shopper with the given id (path or shopper_id)."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No Order with the given id (path or order_id)."
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "No OrderLine with the given id (path or order_line_id)."
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No Batch with the given id (path or batch_id)."
  - id: ERR_REPLACEMENT_NOT_FOUND
    http: 404
    condition: "No ReplacementRequest with the given id."
  - id: ERR_RATING_NOT_FOUND
    http: 404
    condition: "No ShopperRating with the given id."
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "No ShopperPayout with the given id."
  - id: ERR_CREDIT_ENTRY_NOT_FOUND
    http: 404
    condition: "No CreditLedgerEntry with the given id."

  # --- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the stored Order.version on POST /orders/{id}/tip-adjustments."
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_batch_version does not equal the stored Batch.version on POST /batches/{id}/orders."

  # --- state preconditions ----------------------------------------------------
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "Adding a line to, or submitting, an order whose fulfillment_status is not DRAFT."
  - id: ERR_ORDER_NOT_PLACED
    http: 409
    condition: "Attaching an order to a batch when its fulfillment_status is not PLACED."
  - id: ERR_ORDER_NOT_DELIVERED
    http: 409
    condition: "Rating a shopper for, or adjusting the tip on, an order whose fulfillment_status is not DELIVERED."
  - id: ERR_BATCH_NOT_BUILDING
    http: 409
    condition: "Attaching an order to a batch whose status is not BUILDING."
  - id: ERR_BATCH_NOT_OFFERED
    http: 409
    condition: "Dispatching a batch that is neither BUILDING nor an OFFERED batch with a lapsed offer, or claiming a batch whose status is not OFFERED."
  - id: ERR_BATCH_NOT_CLAIMED
    http: 409
    condition: "Starting to shop a batch whose status is not CLAIMED, or abandoning a batch outside {CLAIMED, SHOPPING, CHECKED_OUT}."
  - id: ERR_BATCH_NOT_SHOPPING
    http: 409
    condition: "Picking a line, proposing a replacement, or checking out when the governing batch's status is not SHOPPING."
  - id: ERR_BATCH_NOT_CHECKED_OUT
    http: 409
    condition: "Delivering a batch whose status is not CHECKED_OUT."
  - id: ERR_BATCH_NOT_ABANDONED
    http: 409
    condition: "Reassigning a batch whose status is not ABANDONED."
  - id: ERR_LINE_NOT_PICKABLE
    http: 409
    condition: "Picking or proposing a replacement for an OrderLine whose status is not REQUESTED."
  - id: ERR_REPLACEMENT_NOT_PENDING
    http: 409
    condition: "Approving or rejecting a ReplacementRequest that is not PENDING, or approving one whose expires_at has passed."
  - id: ERR_PAYOUT_NOT_PROVISIONAL
    http: 409
    condition: "Finalizing a payout that does not exist yet, or whose status is FINAL or FORFEITED."
  - id: ERR_SHOPPER_NOT_SUSPENDED
    http: 409
    condition: "Reinstating a shopper whose status is already ACTIVE."
  - id: ERR_REAUTH_NOT_REQUIRED
    http: 409
    condition: "Re-authorizing an order whose payment_status is not REAUTH_HELD."

  # --- referential integrity --------------------------------------------------
  - id: ERR_ORDER_ALREADY_BATCHED
    http: 409
    condition: "The order already has a BatchOrder membership row."
  - id: ERR_REPLACEMENT_RETAILER_MISMATCH
    http: 422
    condition: "The proposed substitute belongs to a different retailer than the line's order."
  - id: ERR_BATCH_EMPTY
    http: 422
    condition: "Dispatching or reassigning a batch with no member orders."

  # --- EBT / SNAP safety ------------------------------------------------------
  - id: ERR_EBT_NOT_ENABLED
    http: 422
    condition: "Submitting an order with ebt_requested true against a retailer whose ebt_snap_enabled is false."
  - id: ERR_EBT_INELIGIBLE_REPLACEMENT
    http: 422
    condition: "Proposing a non-SNAP-eligible substitute for an EBT-eligible line on an order holding an EBT authorization."

  # --- temporal ---------------------------------------------------------------
  - id: ERR_SHOPPER_WINDOW_CONFLICT
    http: 409
    condition: "The batch's shopping window overlaps a window the shopper already holds, once the turnaround buffer is applied."
  - id: ERR_RETAILER_CONCURRENCY_CAP_REACHED
    http: 409
    condition: "Attaching the order would put more than concurrent_shopper_cap live batches inside the retailer's window."
  - id: ERR_SHOP_WINDOW_NOT_OPEN
    http: 409
    condition: "Starting to shop a claimed batch before its shop_window_start."
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Claiming a batch at or after offer_expires_at."
  - id: ERR_TIP_WINDOW_CLOSED
    http: 409
    condition: "Adjusting a tip at or after Order.tip_window_closes_at."
  - id: ERR_PAYOUT_WINDOW_OPEN
    http: 409
    condition: "Finalizing a payout while any member order's tip window is still open."

  # --- business constraints ---------------------------------------------------
  - id: ERR_SHOPPER_SUSPENDED
    http: 403
    condition: "A shopper whose status is SUSPENDED_REVIEW attempts to claim a batch."
  - id: ERR_TIER_BELOW_BATCH_FLOOR
    http: 403
    condition: "tier_rank(Shopper.tier) is below tier_rank(Batch.tier_access_floor)."
  - id: ERR_ITEM_OUT_OF_STOCK
    http: 409
    condition: "Picking a line whose CatalogItem.availability is OUT_OF_STOCK."
  - id: ERR_WEIGHT_VARIANCE_EXCEEDED
    http: 422
    condition: "A PER_LB line's final_weight_lb deviates from requested_weight_lb by more than WEIGHT_VARIANCE_PCT."
  - id: ERR_DUPLICATE_RATING
    http: 409
    condition: "A second ShopperRating for the same (shopper_id, order_id) pair."
  - id: ERR_TIP_ADJUSTMENT_LIMIT
    http: 409
    condition: "A third tip adjustment on the same order."
  - id: ERR_REINSTATE_SCORE_TOO_LOW
    http: 422
    condition: "Reinstating a shopper whose lifetime_tier_score is below REINSTATEMENT_MIN_SCORE."
  - id: ERR_NO_ELIGIBLE_SHOPPER
    http: 422
    condition: "The dispatch selector's candidate pool is empty after eligibility filtering."

  # --- fiscal -----------------------------------------------------------------
  - id: ERR_SHOPPER_CAPACITY_EXCEEDED
    http: 409
    condition: "committed_units + batch.total_units would exceed the shopper's vehicle_capacity_units."
  - id: ERR_ORDER_PAYMENT_HELD
    http: 409
    condition: "Checking out a batch while at least one member order sits in REAUTH_HELD (checkout_blocked_count > 0)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Places grocery orders, adjudicates in-aisle substitutions, rates shoppers and adjusts tips."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/submit"
      - "POST /orders/{id}/reauthorize"
      - "POST /orders/{id}/tip-adjustments"
      - "POST /replacement-requests/{id}/approve"
      - "POST /replacement-requests/{id}/reject"
      - "POST /shoppers/{id}/ratings"
    shared_operations:
      - "GET /orders/{id}, GET /orders, GET /order-lines/{id}, GET /order-lines"
      - "GET /orders/{id}/parity-disclosure, GET /orders/{id}/batch-orders"
      - "GET /replacement-requests/{id}, GET /replacement-requests"
      - "GET /customers/{id}, GET /credit-ledger-entries/{id}, GET /credit-ledger-entries"
      - "GET /catalog-items/{id}, GET /catalog-items, GET /shopper-ratings/{id}, GET /shopper-ratings"

  - name: Shopper
    description: "Claims batches, shops the aisles, proposes substitutions, checks out and delivers."
    identity: "entity_backed:Shopper"
    exclusive_operations:
      - "POST /batches/{id}/claim"
      - "POST /batches/{id}/start-shopping"
      - "POST /order-lines/{id}/pick"
      - "POST /replacement-requests"
      - "POST /batches/{id}/checkout"
      - "POST /batches/{id}/deliver"
      - "POST /batches/{id}/abandon"
    shared_operations:
      - "GET /batches/{id}, GET /batches, GET /batches/{id}/batch-orders, GET /orders/{id}/batch-orders"
      - "GET /orders/{id}, GET /orders, GET /order-lines/{id}, GET /order-lines"
      - "GET /replacement-requests/{id}, GET /replacement-requests"
      - "GET /shoppers/{id}, GET /shopper-ratings/{id}, GET /shopper-ratings"
      - "GET /shopper-payouts/{id}, GET /shopper-payouts, GET /catalog-items/{id}, GET /catalog-items"

  - name: RetailerManager
    description: "Owns one retailer's catalog, shelf prices, markup policy and parity disclosure posture."
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /catalog-items"
      - "PATCH /catalog-items/{id}"
      - "PATCH /retailers/{id}/parity-policy"
    shared_operations:
      - "GET /retailers/{id}, GET /catalog-items/{id}, GET /catalog-items"
      - "GET /orders/{id}/parity-disclosure"

  - name: DispatchAdmin
    description: "Operates the dispatch board: builds batches, offers them, reassigns abandoned work, finalizes payouts and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /retailers"
      - "POST /shoppers"
      - "POST /shoppers/{id}/reinstate"
      - "POST /batches"
      - "POST /batches/{id}/orders"
      - "POST /batches/{id}/dispatch"
      - "POST /batches/{id}/reassign"
      - "POST /batches/{id}/finalize-payout"
      - "POST /_clock/set_current_utc"
      - "POST /_ratings/backfill"
      - "POST /_shoppers/{id}/history"
    shared_operations:
      - "every GET endpoint in §1.5"

  - name: CustomerSupport
    description: "Back-office support: registers customers, posts goodwill credits and reads the whole board."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /customers/{id}/credits"
    shared_operations:
