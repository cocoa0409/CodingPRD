            - *m_srev2c
            - *k_close_round
            - *x_board_review
            - *x_get_panel
            - *m_slate
            - *m_get_slots
          trigger:
            - { call: "POST /grants/artists/${art1}/award-history", payload: { fiscal_year: 2024, grant_period_end: "2026-01-02T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/artists/${art2}/award-history", payload: { fiscal_year: 2024, grant_period_end: "2026-01-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: CouncilBoardMember, as_user_id: "board-1", captures: { cyc_vA: "$.data.version" } }
            - { call: "POST /grants/recommendation-slots/${slot1}/board-action", payload: { action: APPROVE, expected_cycle_version: "${cyc_vA}" }, as: CouncilBoardMember, as_user_id: "board-1", captures: { err_cool: "$.data.error_id" } }
            - { call: "POST /grants/recommendation-slots/${slot1}/board-action", payload: { action: STRIKE, struck_reason_code: APPLICANT_INELIGIBLE, expected_cycle_version: "${cyc_vA}" }, as: CouncilBoardMember, as_user_id: "board-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: CouncilBoardMember, as_user_id: "board-1", captures: { cyc_vB: "$.data.version" } }
            - { call: "POST /grants/recommendation-slots/${slot2}/board-action", payload: { action: APPROVE, expected_cycle_version: "${cyc_vB}" }, as: CouncilBoardMember, as_user_id: "board-1" }
            - { call: "GET /grants/awards", payload: { application_id: "${app2}" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { aw2: "$.data[0].id" } }
            - { call: "GET /grants/artists/${art1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "art1.last_award_period_end == 2026-01-02T00:00:00Z and art1.prior_award_count == 1"
            - "Approving rank 1 returns 409 ERR_AWARD_PERIOD_COOLING_VIOLATION — 2027-01-01 is only 364 days after 2026-01-02"
            - "slot1 stays PROPOSED with awarded_amount_cents null and app1 stays SCORED; art1.active_award_count == 0"
            - "The rejected approval left the cycle untouched, so the STRIKE reusing cyc_vA is accepted and app1 becomes NOT_RECOMMENDED with notified_at stamped"
            - "Approving rank 2 succeeds: exactly 365 days is inside the closed interval"
            - "The created award for app2 has gross_amount_cents == 1500000 and is_prorated == false — the whole discipline allocation was still uncommitted"
            - "cycle.funded_total_cents == 1500000, admin_assessment_rate == 0.085, admin_assessment_cents == 127500, available_cents == 4072500 and posture == OPEN"

