            - call: "POST /heading-tools/${tool_id}/regrind"
              payload: {}
              as: ProcessEngineer
            - call: "POST /heading-tools/${tool_id}/mount"
              payload: { press_code: "PRESS-3" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_id}/complete-heading"
              payload: { headed_count: 4900, heading_scrap_count: 60 }
              as: ProcessEngineer
          assert:
            - "The first complete-heading returns 409 with error_id ERR_INVALID_TOOL_STATE"
            - "After the refusal: ProductionLot.${lot_id}.process_state == SETUP, headed_count == 0, disposition == IN_PROCESS, and WireLot.${wire_id}.consumed_mass_kg == 0.000"
            - "After the regrind: HeadingTool.${tool_id}.status == AVAILABLE, regrind_count == 1, rated_derated_life_pieces == 102000"
