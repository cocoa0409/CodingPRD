          - "endpoints: POST /spice/production-runs"
        distinguishing_aspect: |
          Entity pair ProductionRun x BlendRun: scheduling is rejected while the
          referenced BlendRun is DRAFT, and succeeds with HTTP 201 for the
          identical payload once the same BlendRun reaches COMMITTED.
        test_recipe:
          setup:
            - "supplier S; three ACCEPTED pepper lots (LA/LB/LC, costs 100/200/300, 100 kg each); ACTIVE formula GATE-1 (BLACK_PEPPER 100% min 50); line LN; blend run BR created and initially left DRAFT"
