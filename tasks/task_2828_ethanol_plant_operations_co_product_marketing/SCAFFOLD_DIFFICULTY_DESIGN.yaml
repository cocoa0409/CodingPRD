            - "UnitTrainShipment.${sh1_id}.loaded_gallons == 265900.00"
            - "ProductTank.${t301_id}.current_gallons == 134100.00"
            - "LoadingTrack.${trk_id}.committed_railcars == 100"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: settle_delivery_fills_contract_shrinks_coverage_flips_procurement_posture_and_grind_cap
        grounds:
          - state_machines.CornDelivery.grading_status.GRADED_to_SETTLED
          - state_machines.CornPurchaseContract.status.OPEN_to_FILLED
          - calculations.corn_delivery_settlement
          - calculations.plant_inventory_and_coverage
          - calculations.daily_grind_cap
          - entities.Plant.fields.procurement_posture
        distinguishing_aspect: |
          One settle call propagates four hops in the procurement domain —
          delivery SETTLED, contract OPEN -> FILLED, coverage 200440.00 ->
          199500.00 falling below coverage_floor_bushels 200000 so
          procurement_posture flips ADEQUATE -> SHORT, and daily_grind_cap_bushels
          drops 120000 -> 90000 — with the counter-intuitive property that
          RECEIVING corn REDUCES the plant's permitted grind.
        test_recipe:
          setup:
            - "Plant exists with base_grind_cap_bushels 120000 and coverage_floor_bushels 200000."
            - "Contract C-BIG is OPEN and UNPRICED for 199500.00 bushels."
            - "Contract C-1 is OPEN and PRICED at futures 458.0 / basis -18.0 for exactly 940.00 bushels."
            - "One GRADED delivery on C-1 with moisture 15.00, test weight 54.0, foreign material 3.00, damage 5.00 nets exactly 940.00 dry bushels at 440.00 c/bu."
            - "Before the trigger, open_contract_coverage_bushels is 200440.00, procurement_posture is ADEQUATE and daily_grind_cap_bushels is 120000."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 200000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Prairie Grain Terminal", delivery_month: "2026-11", bushels_contracted: 199500.00, basis_cents_per_bushel: -14.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { cbig_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 940.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0940", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
              as_user_id: "scale-01"
              captures: { d1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/grade"
              payload: { moisture_pct: 15.00, test_weight_lb_per_bu: 54.0, foreign_material_pct: 3.00, damaged_kernels_pct: 5.00, aflatoxin_ppb: 2 }
              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "GET /ethanol-ops/plants/${plant_id}"
              payload: {}
              as: PlantManager
              as_user_id: "pm-01"
              captures: { coverage_before: $.data.open_contract_coverage_bushels, cap_before: $.data.daily_grind_cap_bushels, posture_before: $.data.procurement_posture }
          trigger:
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
          assert:
            - "${coverage_before} == 200440.00 and ${posture_before} == ADEQUATE and ${cap_before} == 120000"
            - "CornDelivery.${d1_id}.net_dry_bushels == 940.00"
            - "CornDelivery.${d1_id}.net_price_cents_per_bushel == 440.00"
            - "CornDelivery.${d1_id}.settlement_amount_cents == 413600"
            - "CornDelivery.${d1_id}.grading_status == SETTLED"
            - "CornPurchaseContract.${c1_id}.bushels_delivered == 940.00 and CornPurchaseContract.${c1_id}.status == FILLED"
            - "CornPurchaseContract.${cbig_id}.status == OPEN"
            - "Plant.${plant_id}.open_contract_coverage_bushels == 199500.00"
            - "Plant.${plant_id}.procurement_posture == SHORT"
            - "Plant.${plant_id}.daily_grind_cap_bushels == 90000"
            - "Plant.${plant_id}.corn_inventory_bushels == 940.00"
            - "Plant.${plant_id}.compliance_posture == OPEN"

      - name: mechanical_tank_hold_cancels_shipment_which_releases_track_railcars
        grounds:
          - state_machines.ProductTank.service_status.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.DenaturantBlend.status.SCHEDULED_to_CANCELLED
          - state_machines.UnitTrainShipment.loading_status.SCHEDULED_to_CANCELLED
          - calculations.track_capacity_commitment
          - calculations.plant_compliance_posture
          - entities.LoadingTrack.fields.committed_railcars
        distinguishing_aspect: |
          A MECHANICAL hold on one ProductTank cascades across three different
          entity types — blend CANCELLED, shipment CANCELLED and VOIDED, and the
          LoadingTrack's committed_railcars released from 100 to 0 — while
          deliberately leaving Plant.compliance_posture at OPEN, because only an
          OFF_SPEC hold feeds the posture aggregate.
        test_recipe:
          setup:
            - "Plant exists with base_grind_cap_bushels 120000 and coverage_floor_bushels 5000."
            - "Tanks T-101 (ETHANOL_200_PROOF, 300000.00 gal), T-201 (DENATURANT, 500000.00 gal) and T-301 (DENATURED_E100, 400000.00 gal, settling_buffer_minutes 120) exist and are IN_SERVICE."
            - "Blend BL-7001 is SCHEDULED into T-301 over 2026-09-04T08:00:00Z to 2026-09-04T12:00:00Z for 100000.00 neat plus 2100.00 denaturant gallons."
            - "Shipment UT-7002 is SCHEDULED from T-301 for 100 railcars, so TRK-A has committed_railcars 100 of its 110 spot capacity."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 300000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-201", product_type: "DENATURANT", capacity_gallons: 600000.00, opening_gallons: 500000.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t201_id: $.data.id }
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 400000.00, settling_buffer_minutes: 120 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id, t301_v: $.data.version }
            - call: "POST /ethanol-ops/denaturant-blends"
              payload: { blend_code: "BL-7001", neat_source_tank_id: "${t101_id}", denaturant_source_tank_id: "${t201_id}", destination_tank_id: "${t301_id}", expected_destination_tank_version: "${t301_v}", neat_gallons: 100000.00, denaturant_gallons: 2100.00, window_start: "2026-09-04T08:00:00Z", window_end: "2026-09-04T12:00:00Z" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { bl1_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110, loading_rate_cars_per_hour: 20, is_active: true }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-7002", track_id: "${trk_id}", expected_track_version: "${trk_v}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 100, gallons_per_railcar: 2659.00, window_start: "2026-09-05T06:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id }
            - call: "GET /ethanol-ops/loading-tracks/${trk_id}"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { committed_before: $.data.committed_railcars }
          trigger:
            - call: "POST /ethanol-ops/product-tanks/${t301_id}/hold"
              payload: { hold_reason: "MECHANICAL" }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/product-tanks/${t301_id}/release"
              payload: {}
              as: ProcessOperator
              as_user_id: "op-01"
          assert:
            - "${committed_before} == 100"
            - "After the hold, ProductTank.${t301_id}.service_status == OUT_OF_SERVICE and hold_reason == MECHANICAL"
            - "After the hold, DenaturantBlend.${bl1_id}.status == CANCELLED and cancelled_at is not null"
            - "After the hold, UnitTrainShipment.${sh1_id}.loading_status == CANCELLED and billing_status == VOIDED"
            - "After the hold, LoadingTrack.${trk_id}.committed_railcars == 0"
            - "After the hold, Plant.${plant_id}.compliance_posture == OPEN and daily_grind_cap_bushels == 120000"
            - "After the hold, ProductTank.${t301_id}.current_gallons == 400000.00"
            - "After the release, ProductTank.${t301_id}.service_status == IN_SERVICE and hold_reason == null"
            - "After the release, DenaturantBlend.${bl1_id}.status == CANCELLED (the release never resurrects a cascade cancellation)"
            - "After the release, UnitTrainShipment.${sh1_id}.loading_status == CANCELLED and LoadingTrack.${trk_id}.committed_railcars == 0"

