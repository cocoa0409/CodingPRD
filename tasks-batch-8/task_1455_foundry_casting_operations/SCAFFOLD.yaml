  # --- SandBatch ---
  - method: POST
    path: "/api/sand-batches"
    description: "Mix a new sand batch"
    roles: [LineOperator]
    code: 201
    input: [foundry_id, virgin_weight_kg, max_loi_pct]
    output: SandBatch
    side_effects: ["status=MIXED; current_weight_kg = virgin_weight_kg"]
  - method: GET
    path: "/api/sand-batches/{id}"
    description: "Get a sand batch"
    roles: [FoundryAdmin, LineOperator, QualityInspector]
    code: 200
    input: []
    output: SandBatch
    side_effects: []
  - method: GET
    path: "/api/sand-batches"
    description: "List sand batches (reverse-reachability for SandBatch.foundry_id)"
    roles: [FoundryAdmin, LineOperator, QualityInspector]
    code: 200
    input: ["foundry_id?", "status?", "limit?", "offset?"]
    output: "SandBatch[]"
    side_effects: []
  - method: POST
    path: "/api/sand-batches/{id}/test"
    description: "LOI test: MIXED/RECLAIMING batch passes (loi_pct <= max_loi_pct, equality passes) or is DISCARDED; RECLAIMING failure triggers the quarantine cascade"
    roles: [QualityInspector]
    code: 200
    input: [loi_pct]
    output: SandBatch
    side_effects: ["per SandBatch transitions; posture recomputed"]
  - method: POST
    path: "/api/sand-batches/{id}/reclaim"
    description: "Reclaim spent sand (per-event 0.1kg rounding pinned); mass balance reclaimed + loss == spent enforced"
    roles: [LineOperator]
    code: 200
    input: [reclaimed_weight_kg, loss_weight_kg]
    output: SandBatch
    side_effects: ["status IN_SERVICE -> RECLAIMING; spent -> pending_reclaim; loss -> discarded"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/api/claims"
    description: "File a warranty claim on a FULFILLED/CLOSED order within the warranty window"
    roles: [Customer]
    code: 201
    input: [order_id, claim_type, claim_qty, claimed_amount_cents, "freight_cents?"]
    output: WarrantyClaim
    side_effects: ["status=FILED; customer_id copied from order; caller must own the order (ERR_FORBIDDEN_OWNER)"]
  - method: GET
    path: "/api/claims/{id}"
    description: "Get a claim"
    roles: [FoundryAdmin, WarrantyManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/api/claims"
    description: "List claims (reverse-reachability for WarrantyClaim.order_id/customer_id)"
    roles: [FoundryAdmin, WarrantyManager, Customer]
    code: 200
    input: ["order_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: POST
    path: "/api/claims/{id}/review"
    description: "Review action: START | APPROVE | DENY | REQUEST_INFO (WarrantyManager); RESPOND | APPEAL (owning Customer)"
    roles: [WarrantyManager, Customer]
    code: 200
    input: [action, "note?"]
    output: WarrantyClaim
    side_effects: ["per WarrantyClaim transitions; appeal sets appeal_used"]
  - method: POST
    path: "/api/claims/{id}/settle"
    description: "Settle an APPROVED claim; computes warranty_credit per claim_type variant; budget enforced; SoD vs approver"
    roles: [WarrantyManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> SETTLED; settled_credit_cents computed; order.settled_total_cents += credit"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or undeclared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint, or action not permitted for the role (claims review action scoping)" }
  - { id: ERR_FORBIDDEN_OWNER, http: 403, condition: "Entity-backed Customer acting on an order/claim whose customer_id differs from X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregated duty: spectro certifier dispositioning own heat's casting, or claim approver settling own approval" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, wrong type, invalid enum, array length mismatch, negative weight, non-positive impressions, window end <= start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition exists (generic state precondition)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target resource is in a terminal state; no further transitions" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_ACTIVE_REVISION_EXISTS, http: 409, condition: "A pattern revision of the same parent is already ACTIVE, or an ACTIVE pattern already exists for the part_number chain" }
  - { id: ERR_PATTERN_NOT_ACTIVE, http: 409, condition: "Mold/order creation references a pattern not in ACTIVE status" }
  - { id: ERR_PATTERN_HAS_OPEN_MOLDS, http: 409, condition: "Retire rejected: pattern has molds in ASSEMBLED, POURED, or COOLED" }
  - { id: ERR_HEAT_NOT_CERTIFIED, http: 409, condition: "Tap attempted on a heat in CHARGING or SAMPLED (domain-specific state error for the tap gate); tap from TAPPED -> ERR_INVALID_STATE, from POURED_OUT -> ERR_ALREADY_TERMINAL" }
  - { id: ERR_HEAT_NOT_TAPPED, http: 409, condition: "Pour slot completion attempted while the heat is not TAPPED" }
  - { id: ERR_FURNACE_CAPACITY_EXCEEDED, http: 422, condition: "Tap would push the furnace's same-date tapped total above daily_tap_capacity_kg (equality allowed)" }
  - { id: ERR_FURNACE_WINDOW_CONFLICT, http: 409, condition: "New furnace maintenance window overlaps an existing window under closed-interval semantics (touching endpoints conflict)" }
  - { id: ERR_SLOT_WINDOW_CONFLICT, http: 409, condition: "New pour slot collides with an existing BOOKED/COMPLETED slot under half-open+buffer semantics" }
  - { id: ERR_SLOT_IN_PAST, http: 409, condition: "Slot start_at or maintenance-window end is before the logical now" }
  - { id: ERR_SLOT_NOT_IN_WINDOW, http: 409, condition: "Slot completion attempted outside [start_at, end_at)" }
  - { id: ERR_LINE_MINUTES_EXCEEDED, http: 422, condition: "Slot would push the line's same-date booked minutes above daily_minute_capacity (equality allowed)" }
  - { id: ERR_METAL_INSUFFICIENT, http: 422, condition: "heat.remaining_metal_kg < sum of slot molds' metal_weight_kg at completion" }
  - { id: ERR_SAND_INSUFFICIENT, http: 422, condition: "Batch current_weight_kg < mold sand_weight_kg at mold creation" }
  - { id: ERR_SAND_BATCH_INACTIVE, http: 409, condition: "Pour completion references a mold whose sand batch is not IN_SERVICE" }
  - { id: ERR_SAND_MASS_MISMATCH, http: 422, condition: "Reclaim payload violates reclaimed_weight_kg + loss_weight_kg == spent_weight_kg" }
  - { id: ERR_CASTING_NOT_INSPECTABLE, http: 409, condition: "Inspection recorded on a casting not at routing FINAL_INSPECTION, or quality SCRAPPED" }
  - { id: ERR_DISPOSITION_RULE_VIOLATED, http: 422, condition: "Disposition not permitted for the recorded reading: USE_AS_IS requires porosity_grade <= 4; REWORK requires defect_type in {POROSITY, SHRINKAGE, INCLUSION}" }
  - { id: ERR_DISPOSITION_EXISTS, http: 409, condition: "Inspection report already DISPOSITIONED" }
  - { id: ERR_RETURN_LOT_NOT_ASSAYED, http: 409, condition: "Charge references a return lot not in ASSAYED status" }
  - { id: ERR_RETURN_LOT_INSUFFICIENT, http: 422, condition: "Charge/weigh would drive lot.remaining_weight_kg negative" }
  - { id: ERR_ORDER_QUANTITY_EXCEEDED, http: 422, condition: "Mold creation would push pipeline_count + impressions above ceil(quantity * (1 + overage_pct))" }
  - { id: ERR_WARRANTY_BUDGET_EXCEEDED, http: 422, condition: "Computed settlement credit exceeds remaining order warranty budget" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 409, condition: "Claim filed after fulfilled_at + warranty_months (logical clock)" }
  - { id: ERR_APPEAL_ALREADY_USED, http: 409, condition: "Second appeal attempt on a claim" }
  - { id: ERR_FOUNDRY_EMBARGO, http: 409, condition: "Foundry posture EMBARGO (no IN_SERVICE sand): pour-slot booking blocked" }
  - { id: ERR_FOUNDRY_CURTAILED, http: 409, condition: "Foundry posture CURTAILED: slot booking blocked" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FoundryAdmin
    description: "Site administrator: owns foundry setup, equipment, customers, ops epochs, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/foundries; POST /_clock/set_current_utc; POST /api/foundries/{id}/run-ops"
      - "POST /api/equipment; POST /api/equipment/{id}/windows"
      - "POST /api/customers"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/orders; POST /api/orders/{id}/cancel"
  - name: PatternMaker
    description: "Tooling engineer: owns patterns, qualification, retirement"
    identity: opaque
    exclusive_operations:
      - "POST /api/patterns; POST /api/patterns/{id}/qualify; POST /api/patterns/{id}/retire"
    shared_operations: ["GET /api/patterns*; GET /api/foundries/{id}"]
  - name: MeltSupervisor
    description: "Melt deck lead: owns heats, charges, tap; collects return lots"
    identity: opaque
    exclusive_operations:
      - "POST /api/heats; POST /api/heats/{id}/charges; POST /api/heats/{id}/tap"
      - "POST /api/return-lots"
    shared_operations: ["GET /api/heats*; GET /api/equipment*; GET /api/pour-slots*; GET /api/return-lots*; GET /api/scrap-records*"]
  - name: Spectrographer
    description: "Lab analyst: records spectro samples (certifying heats) and return-lot assays. Segregated from disposition of castings poured from heats they certified."
    identity: opaque
    exclusive_operations:
      - "POST /api/heats/{id}/samples; POST /api/return-lots/{id}/assay"
    shared_operations: ["GET /api/heats*; GET /api/return-lots*"]
  - name: LineOperator
    description: "Molding/pour line operator: books and completes pour slots, assembles molds, shakeout, casting routing, sand batch mix/reclaim"
    identity: opaque
    exclusive_operations:
      - "POST /api/pour-slots; POST /api/pour-slots/{id}/cancel; POST /api/pour-slots/{id}/complete"
      - "POST /api/molds; POST /api/molds/{id}/shakeout; POST /api/castings/{id}/advance"
      - "POST /api/sand-batches; POST /api/sand-batches/{id}/reclaim"
    shared_operations: ["GET /api/molds*; GET /api/castings*; GET /api/sand-batches*; GET /api/patterns*; GET /api/orders*; GET /api/equipment*; GET /api/pour-slots*"]
  - name: QualityInspector
    description: "Quality/NDT inspector: records X-ray inspections, MRB dispositions, scrap weighing, sand LOI tests. Segregated from spectro certification of the poured heat."
    identity: opaque
    exclusive_operations:
      - "POST /api/inspections; POST /api/inspections/{id}/disposition"
      - "POST /api/scrap-records/{id}/weigh; POST /api/sand-batches/{id}/test"
    shared_operations: ["GET /api/inspections*; GET /api/scrap-records*; GET /api/castings*; GET /api/molds*; GET /api/sand-batches*; GET /api/heats*; GET /api/return-lots*"]
  - name: WarrantyManager
    description: "Commercial claims officer: reviews and settles warranty claims. The approver of a claim may not settle it (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /api/claims/{id}/review (actions START, APPROVE, DENY, REQUEST_INFO); POST /api/claims/{id}/settle"
    shared_operations: ["GET /api/claims*; GET /api/orders*; GET /api/customers*; GET /api/castings*; GET /api/inspections*"]
  - name: Customer
    description: "External customer account: places/cancels own orders, files/answers/appeals own warranty claims"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/claims"
      - "POST /api/claims/{id}/review (actions RESPOND, APPEAL; only on own claims)"
    shared_operations:
      - "POST /api/orders; POST /api/orders/{id}/cancel (own orders only)"
      - "GET /api/orders*; GET /api/claims*; GET /api/patterns*; GET /api/foundries/{id}"
