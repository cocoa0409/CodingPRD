scaffold_corner_design:
  # =============================================================================
  # Section: entities — Table 1 claims (creation, required fields, defaults,
  # computed/system fields, type constraints, not-found, listing, parent FK).
  # =============================================================================
  - section: entities
    instances:
      - name: pipe_segment_creation_initializes_computed_fields
        claim_type: creation
        grounds:
          - entities.PipeSegment
          - endpoints.POST /pipe-segments
        distinguishing_aspect: "POST /pipe-segments with all required fields returns 201 and the server initializes status=ACTIVE, posture=NORMAL, open_grade counters=0, last_surveyed_at=null, version=1."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
          trigger:
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-C1", install_year: 2001, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { seg_id: $.data.id }
          assert:
            - "PipeSegment.${seg_id}.status == ACTIVE"
            - "PipeSegment.${seg_id}.posture == NORMAL"
            - "PipeSegment.${seg_id}.open_grade1_count == 0 AND open_grade2_count == 0 AND open_grade3_count == 0"
            - "PipeSegment.${seg_id}.last_surveyed_at == null AND next_survey_due_at == null"
            - "PipeSegment.${seg_id}.version == 1"

      - name: pipe_segment_missing_segment_code_rejected
        claim_type: required_fields
        grounds:
          - entities.PipeSegment.fields.segment_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required input field segment_code from POST /pipe-segments yields 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
          trigger:
            - call: "POST /pipe-segments"
              payload: { install_year: 2001, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: pipe_segment_invalid_material_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.PipeSegment.fields.material
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "material must be one of STEEL|CAST_IRON|PLASTIC_PE|PLASTIC_PVC|COPPER; value 'UNOBTAINIUM' is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
          trigger:
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-BADMAT", install_year: 2001, material: "UNOBTAINIUM", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: instrument_created_in_service_with_null_calibration
        claim_type: defaults
        grounds:
          - entities.Instrument
          - endpoints.POST /instruments
        distinguishing_aspect: "A new Instrument starts with status=IN_SERVICE, calibrated_at=null, calibration_due_at=null (per endpoint side_effects) until the first PASS calibration."
        test_recipe:
          setup:
            - "CalibrationTech CT-1 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-D1", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
          assert:
            - "Instrument.${instr_id}.status == IN_SERVICE"
            - "Instrument.${instr_id}.calibrated_at == null"
            - "Instrument.${instr_id}.calibration_due_at == null"
            - "Instrument.${instr_id}.version == 1"

      - name: leak_creation_computes_grade_and_repair_due
        claim_type: computed_fields
        grounds:
          - entities.Leak.fields.grade
          - entities.Leak.fields.repair_due_at
          - calculations.leak_grade
        distinguishing_aspect: "On POST /leaks the server computes grade (G2 for concentration 12000 >= G2_PPM_THRESHOLD 10000 on a non-HCA segment) and repair_due_at = discovered_at + 30 days = 2026-08-31T00:00:00Z; client cannot supply either."
        test_recipe:
          setup:
            - "Segment SEG-LC (DISTRIBUTION, non-HCA), dispatched route, SUBMITTED SurveyRun by FT-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-LC", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-LC", install_year: 2010, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-LC", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 1000.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
          trigger:
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 12000.0, distance_to_building_feet: 30.0, bar_hole_reading_pct_lel: 8.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { leak_id: $.data.id, leak_grade: $.data.grade, leak_due: $.data.repair_due_at, leak_disc: $.data.discovered_at }
          assert:
            - "leak_grade == G2"
            - "leak_disc == 2026-08-01T00:00:00Z"
            - "leak_due == 2026-08-31T00:00:00Z (discovered_at + 30 days per G2_REPAIR_DAYS)"
            - "Leak.${leak_id}.status == OPEN AND regrade_count == 0"

      - name: leak_without_building_distance_omits_proximity_term
        claim_type: defaults
        grounds:
          - entities.Leak.fields.distance_to_building_feet
          - calculations.leak_grade
        distinguishing_aspect: "distance_to_building_feet is optional ('distance_to_building_feet?' in POST /leaks input); when omitted it is null and the G2 building-proximity term is skipped, so low readings grade G3."
        test_recipe:
          setup:
            - "Segment SEG-LD (SERVICE, non-HCA), dispatched route, SUBMITTED SurveyRun"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-LD", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-LD", install_year: 2015, material: "PLASTIC_PE", diameter_inches: 2.0, length_feet: 300.0, operating_pressure_psi: 30.0, pressure_class: "SERVICE", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-LD", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 300.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
          trigger:
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 500.0, bar_hole_reading_pct_lel: 1.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { leak_id: $.data.id }
          assert:
            - "Leak.${leak_id}.distance_to_building_feet == null"
            - "Leak.${leak_id}.grade == G3 (no proximity term evaluated)"
            - "Leak.${leak_id}.repair_due_at == 2027-08-01T00:00:00Z (discovered_at + 365 days per G3_REPAIR_DAYS)"

      - name: get_missing_pipe_segment_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET /pipe-segments/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but non-existent PipeSegment id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
          trigger:
            - call: "GET /pipe-segments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_pipe_segments_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints.GET /pipe-segments
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /pipe-segments honors limit/offset and reports total_count and has_more: with 2 segments, limit=1 returns 1 row with total_count=2 and has_more=true; offset=1 returns the second row with has_more=false."
        test_recipe:
          setup:
            - "Two PipeSegments SEG-PG-A and SEG-PG-B exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-PG-A", install_year: 2001, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-PG-B", install_year: 2002, material: "CAST_IRON", diameter_inches: 8.0, length_feet: 2000.0, operating_pressure_psi: 45.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
          trigger:
            - call: "GET /pipe-segments"
              payload: { limit: 1, offset: 0 }
              as: IntegrityAnalyst
              captures: { page1_total: $.meta.total_count, page1_more: $.meta.has_more }
            - call: "GET /pipe-segments"
              payload: { limit: 1, offset: 1 }
              as: IntegrityAnalyst
              captures: { page2_more: $.meta.has_more }
          assert:
            - "page1_total == 2"
            - "page1_more == true"
            - "page2_more == false"
            - "Each page's data array length == 1"

      - name: route_segment_assignment_requires_existing_segment
        claim_type: parent_relationships
        grounds:
          - entities.RouteSegmentAssignment.fields.segment_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "RouteSegmentAssignment.segment_id is FK -> PipeSegment.id; POSTing an assignment whose segment_id does not resolve returns 404 ERR_NOT_FOUND (existence check on body-referenced id)."
        test_recipe:
          setup:
            - "SurveyRoute R-FK exists (PLANNED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-FK", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "00000000-0000-0000-0000-000000000000", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: repair_order_priority_mapped_from_leak_grade
        claim_type: computed_fields
        grounds:
          - entities.RepairOrder.fields.priority
          - state_machines.Leak.OPEN_to_REPAIR_SCHEDULED
        distinguishing_aspect: "POST /leaks/{id}/schedule-repair creates the RepairOrder with computed priority mapped from Leak.grade (G2 -> P2_URGENT) and parallel dimensions initialized: dispatch_status=PENDING_DISPATCH, excavation_permit_status=NOT_REQUIRED for CLAMP."
        test_recipe:
          setup:
            - "Segment SEG-RO with OPEN G2 leak"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
            - call: "POST /calibration-techs"
              payload: { employee_code: "CT-1", full_name: "Cal One" }
              as: IntegrityAnalyst
              captures: { ct_id: $.data.id }
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-RO", instrument_type: "CGI" }
              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-RO", install_year: 2010, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-RO", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
              payload: { route_id: "${route_id}", instrument_id: "${instr_id}", distance_covered_feet: 1000.0 }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { run_id: $.data.id }
            - call: "POST /survey-runs/${run_id}/submit"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
            - call: "POST /leaks"
              payload: { segment_id: "${seg_id}", survey_run_id: "${run_id}", concentration_ppm: 12000.0, distance_to_building_feet: 30.0, bar_hole_reading_pct_lel: 8.0, is_migration_evidence: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { leak_id: $.data.id, leak_v: $.data.version }
          trigger:
            - call: "POST /leaks/${leak_id}/schedule-repair"
              payload: { repair_method: "CLAMP", expected_leak_version: "${leak_v}" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { order_id: $.data.id }
          assert:
            - "RepairOrder.${order_id}.priority == P2_URGENT (mapped from G2)"
            - "RepairOrder.${order_id}.dispatch_status == PENDING_DISPATCH"
            - "RepairOrder.${order_id}.excavation_permit_status == NOT_REQUIRED (CLAMP needs no excavation)"
            - "RepairOrder.${order_id}.crew_id == null AND dispatched_at == null"

  # =============================================================================
  # Section: state_machines — Table 2 claims (initial state, valid/invalid
  # transitions, precondition enforcement, side effects, terminal lockdown,
  # idempotency) for every machine in §1.2.
  # =============================================================================
  - section: state_machines
    instances:
      - name: survey_route_created_in_planned_state
        claim_type: initial_state
        grounds:
          - state_machines.SurveyRoute
          - endpoints.POST /survey-routes
        distinguishing_aspect: "A newly created SurveyRoute starts in initial_state PLANNED with version 1."
        test_recipe:
          setup:
            - "DispatchCoordinator DC-1 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /survey-routes"
              payload: { route_code: "R-INIT", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
          assert:
            - "SurveyRoute.${route_id}.status == PLANNED"
            - "SurveyRoute.${route_id}.version == 1"

      - name: survey_route_dispatch_happy_path
        claim_type: valid_transition
        grounds:
          - state_machines.SurveyRoute.PLANNED_to_DISPATCHED
        distinguishing_aspect: "PLANNED route with one ACTIVE segment and clock before window_end dispatches to DISPATCHED and bumps version to 2."
        test_recipe:
          setup:
            - "Segment SEG-DSP ACTIVE; route R-DSP PLANNED covering it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-DSP", install_year: 2010, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-DSP", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
