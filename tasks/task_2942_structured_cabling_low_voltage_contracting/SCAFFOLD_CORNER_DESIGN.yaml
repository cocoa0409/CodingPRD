              as: DesignEngineer
          assert:
            - "all three route creations return 201 and GET /cabling/links/${link} reports routed_segment_count == 3"
            - "GET /cabling/pathway-segments/${seg_a} returns allowed_fill_pct == 50, fill_area_used_sq_mm == 49.02 and fill_ratio == 0.0025"
            - "GET /cabling/pathway-segments/${seg_b} returns allowed_fill_pct == 45, fill_area_used_sq_mm == 49.02 and fill_ratio == 0.0855"
            - "GET /cabling/pathway-segments/${seg_c} returns allowed_fill_pct == 25, not 17, and fill_area_used_sq_mm == 49.02"
            - "GET /cabling/pathway-segments/${seg_a} returns pathway_depth == 0, ${seg_b} returns 1 and ${seg_c} returns 2"

      - name: withdrawn_routes_leave_the_fill_input_set_and_the_tier_returns_to_one_cable
        claim_type: input_set_filtering
        grounds:
          - calculations.pathway_fill_evaluation.input_set
          - entities.PathwaySegment.fields.occupying_route_count
        distinguishing_aspect: "The fill input set is filtered on route_state == OCCUPYING, so withdrawing the second route removes both its area and its contribution to the cable count, taking allowed_fill_pct back from FILL_PCT_2_CABLES 31 to FILL_PCT_1_CABLE 53 while the WITHDRAWN row itself is retained."
        test_recipe:
          setup: ["Project RVT1 with conduit PS-A of 573.0 sq mm and two links TR01-A01 and TR01-A02 on the same CAT6A cable type"]
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "EMT_CONDUIT", usable_area_sq_mm: 573.0, length_m: 40.0, bend_count: 0, in_plenum_space: false, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id, seg_a_v1: $.data.version }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link1: $.data.id }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A02", application: "DATA_HORIZONTAL", horizontal_length_m: 41.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link2: $.data.id }
          trigger:
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link1}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v1}" }
              as: DesignEngineer
              captures: { route1: $.data.id }
            - call: "GET /cabling/pathway-segments/${seg_a}"
              payload: {}
              as: DesignEngineer
              captures: { seg_a_v2: $.data.version }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link2}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v2}" }
              as: DesignEngineer
              captures: { route2: $.data.id }
            - call: "GET /cabling/pathway-segments/${seg_a}"
              payload: {}
              as: DesignEngineer
              captures: { seg_a_v3: $.data.version }
            - call: "POST /cabling/link-routes/${route2}/withdraw"
              payload: { expected_segment_version: "${seg_a_v3}" }
              as: DesignEngineer
          assert:
            - "after the first route the segment reports occupying_route_count == 1, allowed_fill_pct == 53, fill_area_used_sq_mm == 49.02 and fill_ratio == 0.0855"
            - "after the second route the segment reports occupying_route_count == 2, allowed_fill_pct == 31, fill_area_used_sq_mm == 98.04 and fill_ratio == 0.1711"
            - "after the withdrawal the segment reports occupying_route_count == 1, allowed_fill_pct == 53, fill_area_used_sq_mm == 49.02 and fill_ratio == 0.0855"
            - "GET /cabling/link-routes/${route2} still exists with route_state == \"WITHDRAWN\" and consumed_area_sq_mm == 49.02"
            - "GET /cabling/link-routes with pathway_segment_id ${seg_a} and route_state OCCUPYING returns total_count == 1"

      - name: separation_requirement_switches_with_the_shield_and_admits_exact_equality
        claim_type: constants_applied
        grounds:
          - calculations.power_separation_requirement.constants
          - validations[priority=85]
          - errors[ERR_POWER_SEPARATION_INSUFFICIENT]
        distinguishing_aspect: "One power-sharing segment with power_separation_mm exactly 25 admits the shielded copper cable (SEPARATION_SHIELDED_MM 25, equality admitted) and the fibre cable (SEPARATION_FIBER_MM 0) while refusing the unshielded copper cable (SEPARATION_UNSHIELDED_MM 50) — the requirement is read from the cable, not from the segment."
