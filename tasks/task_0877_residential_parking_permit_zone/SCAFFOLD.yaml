# =============================================================================
# Residential Parking Permit Zone — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  Residential Parking Permit Zone: zone & eligibility (resident/guest), permit
  issuance & vehicle cap, visitor/temporary pass, renewal & proof-of-residency,
  waitlist & density limit, enforcement & citation, transfer/refund, complaint

domain_name: residential-parking-permit-zone
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Difficulty lives in the coupling: a finite per-zone permit density limit and a
    per-household vehicle cap are competed for through a two-stage (clerk review ->
    supervisor approve) application, backed by a waitlist that auto-promotes when a
    slot is freed by refund/revocation/expiry. Two conserved quantities (zone slot
    count and zone fee ledger) must survive every compensating action. Enforcement
    cascades (3 upheld citations -> permit revoked -> waitlist promotion -> new
    permit) interleave with proof-of-residency expiry that suspends permits.

# =============================================================================
# Global constants (referenced across §1.2 / §1.3 / §1.4)
# =============================================================================
global_constants:
  PROOF_VALIDITY_DAYS: 365          # a VERIFIED proof-of-residency is valid this many days
  RENEWAL_WINDOW_DAYS: 60           # renewal may be requested within this many days before expires_at
  ZONE_FISCAL_YEAR_END: "03-31"     # permit term ends 23:59:59.000Z on the next 03-31 on/after issued_at
  REVOKE_UPHELD_THRESHOLD: 3        # this many UPHELD citations on a permit auto-revoke it
  REFUND_ADMIN_FEE_CENTS: 2000      # withheld on VOLUNTARY refunds only
  REPEAT_THRESHOLD: 2               # prior UPHELD citations at/above this -> REPEAT_OFFENDER fine
  ESCALATION_MULTIPLIER: 2
  MIN_FINE_CENTS: 2500
  MAX_FINE_CENTS: 25000
  BASE_FINE_CENTS: { NO_PERMIT: 7500, EXPIRED_PERMIT: 5000, ZONE_VIOLATION: 5000 }
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Zone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable zone name" }
      - { name: zone_code, type: string, source: input, description: "Short unique code, e.g. RPZ-A; unique across zones" }
      - { name: permit_capacity, type: integer, source: input, description: "Density limit: maximum number of slot-occupying permits (status in {ACTIVE, SUSPENDED, RENEWAL_PENDING}) allowed in the zone" }
      - { name: max_permits_per_household, type: integer, source: input, description: "Vehicle cap: maximum slot-occupying permits per household in this zone" }
      - { name: guest_pass_daily_limit, type: integer, source: input, description: "Maximum GUEST_DAILY visitor passes a household may hold whose valid_from calendar date equals a given day" }
      - { name: permit_annual_fee_cents, type: integer, source: input, description: "Full-year permit fee in cents; prorated at issuance by remaining whole months to fiscal year end" }
      - { name: visitor_pass_fee_cents, type: integer, source: input, description: "Flat fee charged per TEMPORARY visitor pass; GUEST_DAILY passes are free" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}" }
      - { name: active_permit_count, type: integer, source: computed, description: "Count of Permits in this zone with status in {ACTIVE, SUSPENDED, RENEWAL_PENDING}; conserved against permit_capacity" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of WaitlistEntry rows in this zone with status WAITING" }
      - { name: fees_collected_cents, type: integer, source: computed, description: "Sum of fee_paid_cents over all Permits ever issued in this zone (issuance + renewal collections)" }
      - { name: fees_refunded_cents, type: integer, source: computed, description: "Sum of refund_amount_cents over all Permits in this zone with status REFUNDED" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; the residential parking zone this household belongs to" }
      - { name: unit_address, type: string, source: input, description: "Street address / unit of the residence" }
      - { name: resident_name, type: string, source: input, description: "Primary resident name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED}" }
      - { name: proof_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | EXPIRED", default: UNVERIFIED, constraints: "enum {UNVERIFIED, VERIFIED, EXPIRED}" }
      - { name: proof_verified_at, type: datetime, source: system, description: "Clock time at which most recent proof was VERIFIED; null until first verification" }
      - { name: proof_expires_at, type: datetime, source: system, description: "proof_verified_at + PROOF_VALIDITY_DAYS; null until first verification" }
      - { name: active_permit_count, type: integer, source: computed, description: "Count of this household's Permits with status in {ACTIVE, SUSPENDED, RENEWAL_PENDING}; conserved against Zone.max_permits_per_household" }

  - name: Vehicle
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; owning household (from path)" }
      - { name: license_plate, type: string, source: input, description: "License plate; unique per household among ACTIVE vehicles" }
      - { name: make, type: string, source: input, description: "Vehicle make" }
      - { name: model, type: string, source: input, description: "Vehicle model" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED", default: ACTIVE, constraints: "enum {ACTIVE, REMOVED}" }

  - name: ProofSubmission
    parent: Household
    common_fields: true
    fields:
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; household submitting proof (from path)" }
      - { name: document_type, type: enum, source: input, description: "LEASE | UTILITY_BILL | DEED | ID_CARD", constraints: "enum {LEASE, UTILITY_BILL, DEED, ID_CARD}" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED", default: PENDING, constraints: "enum {PENDING, VERIFIED, REJECTED}" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the ParkingClerk who reviewed; null while PENDING" }
      - { name: verified_at, type: datetime, source: system, description: "Clock time of VERIFIED decision; null otherwise" }
      - { name: expires_at, type: datetime, source: system, description: "verified_at + PROOF_VALIDITY_DAYS on VERIFIED; null otherwise" }

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; zone the permit is requested in" }
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; applying household" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle the permit is for; must be an ACTIVE vehicle of household_id" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | WAITLISTED | DENIED", default: SUBMITTED, constraints: "enum {SUBMITTED, UNDER_REVIEW, APPROVED, WAITLISTED, DENIED}" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the ParkingClerk who moved it to UNDER_REVIEW; null before review" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the PermitSupervisor who approved/denied; null before decision" }
      - { name: denial_reason, type: string, source: system, description: "Free-text set on DENIED; null otherwise" }
      - { name: permit_id, type: string, source: system, description: "Back-reference id of the Permit issued from this application (reverse side of Permit.application_id); set when APPROVED, null otherwise" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; the application that produced this permit" }
      - { name: zone_id, type: string, source: system, description: "FK -> Zone.id; zone the permit occupies a slot in" }
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; owning household" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; vehicle the permit is bound to" }
      - { name: permit_number, type: string, source: system, description: "Human-readable permit number minted at issuance" }
      - { name: license_plate, type: string, source: system, description: "Snapshot of the bound vehicle's license_plate at issuance" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | RENEWAL_PENDING | EXPIRED | REVOKED | TRANSFERRED | REFUNDED", default: ACTIVE, constraints: "enum {ACTIVE, SUSPENDED, RENEWAL_PENDING, EXPIRED, REVOKED, TRANSFERRED, REFUNDED}" }
      - { name: issued_at, type: datetime, source: system, description: "Clock time at approval/issuance" }
      - { name: expires_at, type: datetime, source: system, description: "End of term: 23:59:59.000Z on the next fiscal-year-end date (ZONE_FISCAL_YEAR_END, 03-31) on or after issued_at" }
      - { name: fee_paid_cents, type: integer, source: system, description: "Prorated issuance fee actually collected (see permit_issuance_fee); on renewal, increased by the renewal collection" }
      - { name: refund_amount_cents, type: integer, source: system, description: "Amount refunded on REFUNDED; 0 otherwise", default: 0 }
      - { name: refund_type, type: enum, source: system, description: "VOLUNTARY | ADMINISTRATIVE; null until REFUNDED", constraints: "enum {VOLUNTARY, ADMINISTRATIVE}" }
      - { name: upheld_citation_count, type: integer, source: computed, description: "Count of Citations with permit_id == this permit and status UPHELD" }
      - { name: transferred_to_permit_id, type: string, source: system, description: "Back-reference id of the successor Permit created by a transfer (self-referential pointer); null unless TRANSFERRED" }

  - name: VisitorPass
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; sponsoring household" }
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the resident permit the pass is issued under; must be ACTIVE and owned by household_id" }
      - { name: pass_type, type: enum, source: input, description: "GUEST_DAILY | TEMPORARY", constraints: "enum {GUEST_DAILY, TEMPORARY}" }
      - { name: guest_plate, type: string, source: input, description: "License plate of the visiting vehicle (not a registered Vehicle)" }
      - { name: valid_from, type: datetime, source: input, description: "Start of the pass validity interval" }
      - { name: valid_until, type: datetime, source: input, description: "End of the pass validity interval; must be > valid_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | CANCELLED", default: ACTIVE, constraints: "enum {ACTIVE, EXPIRED, CANCELLED}" }
      - { name: fee_charged_cents, type: integer, source: system, description: "visitor_pass_fee_cents for TEMPORARY; 0 for GUEST_DAILY" }

  - name: WaitlistEntry
    parent: Zone
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: system, description: "FK -> Zone.id; zone whose queue this entry sits in" }
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; the WAITLISTED application this entry represents" }
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; applying household" }
      - { name: position, type: integer, source: computed, description: "1-based rank among WAITING entries in the zone ordered by created_at ASC (tie-break created_at ASC)" }
      - { name: status, type: enum, source: system, description: "WAITING | PROMOTED | CANCELLED | EXPIRED", default: WAITING, constraints: "enum {WAITING, PROMOTED, CANCELLED, EXPIRED}" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; zone where the violation occurred" }
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; the offending resident's permit if identified; null for NO_PERMIT violations on unknown plates" }
      - { name: license_plate, type: string, source: input, description: "Plate cited" }
      - { name: violation_type, type: enum, source: input, description: "NO_PERMIT | EXPIRED_PERMIT | ZONE_VIOLATION", constraints: "enum {NO_PERMIT, EXPIRED_PERMIT, ZONE_VIOLATION}" }
      - { name: fine_amount_cents, type: integer, source: computed, description: "Computed at issuance by citation_fine (STANDARD or REPEAT_OFFENDER variant)" }
      - { name: fine_variant, type: enum, source: system, description: "STANDARD | REPEAT_OFFENDER; which variant produced fine_amount_cents", constraints: "enum {STANDARD, REPEAT_OFFENDER}" }
      - { name: prior_upheld_count, type: integer, source: system, description: "Snapshot at issuance: count of prior UPHELD citations on this license_plate in this zone" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | DISPUTED | UPHELD | DISMISSED", default: ISSUED, constraints: "enum {ISSUED, PAID, DISPUTED, UPHELD, DISMISSED}" }
      - { name: issuing_officer_id, type: string, source: system, description: "X-User-ID of the EnforcementOfficer who issued the citation" }
      - { name: adjudicator_id, type: string, source: system, description: "X-User-ID of the EnforcementOfficer who adjudicated a dispute; must differ from issuing_officer_id" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id; zone the complaint concerns" }
      - { name: complaint_type, type: enum, source: input, description: "ILLEGAL_PARKING | PERMIT_ABUSE | SIGNAGE | OTHER", constraints: "enum {ILLEGAL_PARKING, PERMIT_ABUSE, SIGNAGE, OTHER}" }
      - { name: target_plate, type: string, source: input, description: "License plate complained about; null when not plate-specific" }
      - { name: description, type: string, source: input, description: "Complaint narrative" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | DISMISSED | ESCALATED", default: OPEN, constraints: "enum {OPEN, RESOLVED, DISMISSED, ESCALATED}" }
      - { name: resolution_note, type: string, source: system, description: "Free-text set on terminal decision; null while OPEN" }
      - { name: created_citation_id, type: string, source: system, description: "Back-reference id of the Citation synthesized when ESCALATED (discoverable via GET /citations filtered by zone); null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Zone
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /zones/{zone_id}/suspend"
        actor: PermitSupervisor
        preconditions:
          - "Zone.status == ACTIVE"
        side_effects:
          - "CASCADE link 1: every Permit in this zone with status in {ACTIVE, RENEWAL_PENDING} -> SUSPENDED"
          - "CASCADE link 2: for each Permit just SUSPENDED, every VisitorPass with permit_id == that permit and status ACTIVE -> CANCELLED"
          - "No new approvals or issuances while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /zones/{zone_id}/reactivate"
        actor: PermitSupervisor
        preconditions:
          - "Zone.status == SUSPENDED"
        side_effects:
          - "Every Permit in this zone with status SUSPENDED and whose owning Household.proof_status == VERIFIED -> ACTIVE"
          - "Permits whose household proof is not VERIFIED remain SUSPENDED"

  - entity: Household
    field: proof_status
    initial_state: UNVERIFIED
    terminal_states: []
    note: "proof_status is driven by ProofSubmission review and by the expiry sweep; it is never set directly."
    transitions:
      - from: [UNVERIFIED, EXPIRED, VERIFIED]
        to: VERIFIED
        trigger: "POST /proof-submissions/{proof_id}/review with outcome=VERIFIED"
        actor: ParkingClerk
        preconditions:
          - "ProofSubmission.status == PENDING"
        side_effects:
          - "Household.proof_verified_at = clock now; Household.proof_expires_at = now + PROOF_VALIDITY_DAYS"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /zones/{zone_id}/run-expiry (system sweep)"
        actor: ParkingClerk
        preconditions:
          - "clock now > Household.proof_expires_at"
        side_effects:
          - "CASCADE: every Permit of this household with status ACTIVE -> SUSPENDED"

  - entity: ProofSubmission
    field: status
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /proof-submissions/{proof_id}/review with outcome=VERIFIED"
        actor: ParkingClerk
        preconditions:
          - "ProofSubmission.status == PENDING"
        side_effects:
          - "reviewer_user_id = X-User-ID; verified_at = now; expires_at = now + PROOF_VALIDITY_DAYS"
          - "Drives Household.proof_status -> VERIFIED (see Household SM)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /proof-submissions/{proof_id}/review with outcome=REJECTED"
        actor: ParkingClerk
        preconditions:
          - "ProofSubmission.status == PENDING"
        side_effects:
          - "reviewer_user_id = X-User-ID; Household.proof_status unchanged"

  - entity: PermitApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /permit-applications/{application_id}/review"
        actor: ParkingClerk
        preconditions:
          - "PermitApplication.status == SUBMITTED"
          - "Household.proof_status == VERIFIED (cross-entity)"
          - "Zone.status == ACTIVE (cross-entity)"
        side_effects:
          - "reviewer_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /permit-applications/{application_id}/approve"
        actor: PermitSupervisor
        preconditions:
          - "PermitApplication.status == UNDER_REVIEW"
          - "Zone.status == ACTIVE"
          - "Household.proof_status == VERIFIED"
          - "Household.active_permit_count < Zone.max_permits_per_household (vehicle cap)"
          - "Zone.active_permit_count < Zone.permit_capacity (density limit)"
          - "expected_zone_version matches Zone.version (OCC)"
        side_effects:
          - "Mint Permit (status ACTIVE), set application.permit_id"
          - "Permit.fee_paid_cents = permit_issuance_fee; Zone.fees_collected_cents += fee_paid_cents"
          - "Zone.active_permit_count += 1; Household.active_permit_count += 1"
          - "increments Zone.version by 1"
      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "POST /permit-applications/{application_id}/waitlist"
        actor: ParkingClerk
        preconditions:
          - "PermitApplication.status == UNDER_REVIEW"
          - "Zone.active_permit_count >= Zone.permit_capacity (only waitlist a full zone)"
        side_effects:
          - "Create WaitlistEntry (status WAITING); Zone.waitlist_count += 1"
      - from: WAITLISTED
        to: APPROVED
        trigger: "system promotion during POST /permits/{permit_id}/refund, /revoke, adjudicate cascade, or /zones/{zone_id}/run-expiry"
        actor: system
        preconditions:
          - "This application's WaitlistEntry is the WAITING entry with the smallest position (oldest created_at) in the zone"
          - "A slot has just been freed (Zone.active_permit_count < Zone.permit_capacity)"
          - "Owning Household.proof_status == VERIFIED and Household.active_permit_count < Zone.max_permits_per_household"
        side_effects:
          - "WaitlistEntry.status -> PROMOTED; Zone.waitlist_count -= 1"
          - "Mint Permit (status ACTIVE); application.permit_id set; fee collected; Zone/Household active_permit_count += 1; Zone.version += 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /permit-applications/{application_id}/deny"
        actor: PermitSupervisor
        preconditions:
          - "PermitApplication.status == UNDER_REVIEW"
        side_effects:
          - "denial_reason set; decided_by_user_id = X-User-ID"

  - entity: Permit
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED, TRANSFERRED, REFUNDED]
    transitions:
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /permits/{permit_id}/renew"
        actor: Resident
        preconditions:
          - "Permit.status == ACTIVE"
          - "clock now >= (expires_at - RENEWAL_WINDOW_DAYS) (within renewal window)"
        side_effects:
          - "No fee yet; slot still occupied (RENEWAL_PENDING counts toward capacity)"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /permits/{permit_id}/renew-approve"
        actor: PermitSupervisor
        preconditions:
          - "Permit.status == RENEWAL_PENDING"
          - "Household.proof_status == VERIFIED (cross-entity)"
          - "expected_permit_version matches Permit.version (OCC)"
        side_effects:
          - "expires_at advanced to the next fiscal-year-end after the current expires_at"
          - "Permit.fee_paid_cents += permit_annual_fee_cents (full-year renewal); Zone.fees_collected_cents += that amount"
          - "increments Permit.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (zone suspend cascade, or proof-expiry sweep)"
        actor: system
        preconditions:
          - "Permit.status == ACTIVE"
        side_effects:
          - "Slot still occupied (SUSPENDED counts toward capacity)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (zone reactivate, when household proof VERIFIED)"
        actor: system
        preconditions:
          - "Permit.status == SUSPENDED"
          - "Household.proof_status == VERIFIED"
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: REFUNDED
        trigger: "POST /permits/{permit_id}/refund"
        actor: PermitSupervisor
        preconditions:
          - "Permit.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "Permit.refund_amount_cents = permit_refund_amount(variant); refund_type set"
          - "Zone.fees_refunded_cents += refund_amount_cents"
          - "Zone.active_permit_count -= 1; Household.active_permit_count -= 1 (frees a slot)"
          - "CASCADE: attempt waitlist promotion of the oldest WAITING entry (see PermitApplication WAITLISTED->APPROVED)"
      - from: [ACTIVE, SUSPENDED, RENEWAL_PENDING]
        to: REVOKED
        trigger: "POST /permits/{permit_id}/revoke, or system (3rd UPHELD citation)"
        actor: "PermitSupervisor or system"
        preconditions:
          - "Permit.status in {ACTIVE, SUSPENDED, RENEWAL_PENDING}"
        side_effects:
          - "No refund; Zone.active_permit_count -= 1; Household.active_permit_count -= 1 (frees a slot)"
          - "CASCADE: attempt waitlist promotion of the oldest WAITING entry"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /permits/{permit_id}/transfer"
        actor: PermitSupervisor
        preconditions:
          - "Permit.status == ACTIVE"
          - "target vehicle_id is an ACTIVE Vehicle of the same household"
        side_effects:
          - "Mint successor Permit (status ACTIVE) bound to new vehicle, inheriting issued_at/expires_at/fee_paid_cents; set transferred_to_permit_id"
          - "No new fee; Zone.active_permit_count unchanged; Household.active_permit_count unchanged (conserved)"
      - from: [ACTIVE, SUSPENDED, RENEWAL_PENDING]
        to: EXPIRED
        trigger: "POST /zones/{zone_id}/run-expiry (system sweep)"
        actor: ParkingClerk
        preconditions:
          - "clock now > Permit.expires_at"
        side_effects:
          - "Zone.active_permit_count -= 1; Household.active_permit_count -= 1 (frees a slot)"
          - "CASCADE: attempt waitlist promotion of the oldest WAITING entry"

  - entity: VisitorPass
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /visitor-passes/{pass_id}/cancel, or system (zone suspend cascade)"
        actor: "Resident or system"
        preconditions:
          - "VisitorPass.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /zones/{zone_id}/run-expiry (system sweep)"
        actor: ParkingClerk
        preconditions:
          - "clock now >= VisitorPass.valid_until"
        side_effects: []

  - entity: Citation
    field: status
    initial_state: ISSUED
    terminal_states: [PAID, DISMISSED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /citations/{citation_id}/pay"
        actor: Resident
        preconditions:
          - "Citation.status == ISSUED"
        side_effects: []
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /citations/{citation_id}/dispute"
        actor: Resident
        preconditions:
          - "Citation.status == ISSUED"
        side_effects: []
      - from: DISPUTED
        to: UPHELD
        trigger: "POST /citations/{citation_id}/adjudicate with outcome=UPHELD"
        actor: EnforcementOfficer
        preconditions:
          - "Citation.status == DISPUTED"
          - "X-User-ID != issuing_officer_id (segregation of duties)"
        side_effects:
          - "adjudicator_id = X-User-ID"
          - "CASCADE link 1: if permit_id set and the permit now has upheld_citation_count >= REVOKE_UPHELD_THRESHOLD -> Permit REVOKED"
          - "CASCADE link 2: Permit REVOKED frees a zone slot -> oldest WAITING WaitlistEntry PROMOTED"
          - "CASCADE link 3: promoted WaitlistEntry's PermitApplication -> APPROVED and a new Permit is issued"
      - from: DISPUTED
        to: DISMISSED
        trigger: "POST /citations/{citation_id}/adjudicate with outcome=DISMISSED"
        actor: EnforcementOfficer
        preconditions:
          - "Citation.status == DISPUTED"
          - "X-User-ID != issuing_officer_id (segregation of duties)"
        side_effects:
          - "adjudicator_id = X-User-ID; no fine owed"
      - from: UPHELD
        to: PAID
        trigger: "POST /citations/{citation_id}/pay"
        actor: Resident
        preconditions:
          - "Citation.status == UPHELD"
        side_effects: []

  - entity: Complaint
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED, ESCALATED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /complaints/{complaint_id}/resolve with outcome=RESOLVED"
        actor: EnforcementOfficer
        preconditions:
          - "Complaint.status == OPEN"
        side_effects:
          - "resolution_note set"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /complaints/{complaint_id}/resolve with outcome=DISMISSED"
        actor: EnforcementOfficer
        preconditions:
          - "Complaint.status == OPEN"
        side_effects:
          - "resolution_note set"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /complaints/{complaint_id}/resolve with outcome=ESCALATED"
        actor: EnforcementOfficer
        preconditions:
          - "Complaint.status == OPEN"
          - "target_plate is not null"
        side_effects:
          - "Synthesize a Citation (violation_type ZONE_VIOLATION, license_plate = target_plate, permit_id null) in the same zone; set created_citation_id"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: approve-stale-zone
    parent_entity: Zone
    write_endpoint: "POST /permit-applications/{application_id}/approve"
    occ_field: "expected_zone_version"
    description: |
      Approving an application (which mints a Permit and occupies a zone slot)
      against a Zone whose version has advanced since the supervisor last
      observed it is rejected. Each approval bumps Zone.version and Zone.active_permit_count;
      an approval carrying a stale expected_zone_version reflects a view of the
      zone taken before another approval/refund/suspend consumed capacity, so it
      is rejected on the stale version rather than silently over-filling the zone.
    error_id: ERR_ZONE_VERSION_CONFLICT
    http_status: 412
  - rule_id: renew-approve-stale-permit
    parent_entity: Permit
    write_endpoint: "POST /permits/{permit_id}/renew-approve"
    occ_field: "expected_permit_version"
    description: |
      Approving a renewal against a Permit whose version has advanced since the
      supervisor last observed it is rejected. A transfer or a prior renewal-approve
      bumps Permit.version between the read and this write; a stale expected_permit_version
      is rejected so the renewal is not applied to a superseded permit view.
    error_id: ERR_PERMIT_VERSION_CONFLICT
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: zone_active_permit_count
    trigger: "permit issuance (approve/promotion), refund, revoke, expire, transfer, zone suspend/reactivate"
    algorithm: aggregation
    formula: |
      Zone.active_permit_count = count(Permit p where p.zone_id == zone.id
                                       AND p.status IN {ACTIVE, SUSPENDED, RENEWAL_PENDING})
      INVARIANT (conserved): after any issuance (+1) and its compensating action
      (refund / revoke / expire, each -1), Zone.active_permit_count stays exactly
      equal to that count. A transfer mints a successor and terminates the
      predecessor in the same step, leaving the count unchanged.
    input_set: "Permits in the zone with occupying status {ACTIVE, SUSPENDED, RENEWAL_PENDING}"
    precision: "integer count"

  - name: household_active_permit_count
    trigger: "permit issuance, refund, revoke, expire, transfer"
    algorithm: aggregation
    formula: |
      Household.active_permit_count = count(Permit p where p.household_id == household.id
                                            AND p.status IN {ACTIVE, SUSPENDED, RENEWAL_PENDING})
      Enforced against Zone.max_permits_per_household at approve time (vehicle cap).
    input_set: "Household permits with occupying status"
    precision: "integer count"

  - name: zone_fee_ledger
    trigger: "permit issuance, renewal collection, refund"
    algorithm: aggregation
    formula: |
      Zone.fees_collected_cents = sum(p.fee_paid_cents for every Permit p ever created in the zone)
      Zone.fees_refunded_cents  = sum(p.refund_amount_cents for Permit p in zone with status REFUNDED)
      net_fees_cents = fees_collected_cents - fees_refunded_cents
      INVARIANT (conserved): net_fees_cents == sum over permits of (fee_paid_cents - refund_amount_cents).
      A refund (compensating action of an issuance collection) moves money from the
      collected side into the refunded side; the identity above must hold exactly.
    input_set: "All permits of the zone; refunds only from REFUNDED permits"
    precision: "integer cents"

  - name: permit_issuance_fee
    trigger: "PermitApplication UNDER_REVIEW->APPROVED and WAITLISTED->APPROVED (issuance)"
    algorithm: tiered_pricing
    formula: |
      # Prorated by remaining WHOLE months from issued_at to the term end (fiscal year end).
      # Rounding ORDER is pinned: round the monthly rate FIRST, then multiply — i.e.
      # "round per month then sum" (all months share monthly_rate, so sum == monthly_rate * months).
      monthly_rate       = round_half_up(Zone.permit_annual_fee_cents / 12)
      remaining_months   = number of whole calendar months from issued_at's month to expires_at's month inclusive of the start month, exclusive of overshoot
                           = (expires_at.year*12 + expires_at.month) - (issued_at.year*12 + issued_at.month)
      permit_issuance_fee = monthly_rate * remaining_months
      # NOT round_half_up(annual_fee * remaining_months / 12) — that "sum then round"
      # order yields a different value when annual_fee is not divisible by 12.
    input_set: "Single permit at issuance"
    constants:
      MONTHS_PER_YEAR: 12
      ZONE_FISCAL_YEAR_END: "03-31"
    precision: "integer cents, round_half_up on the monthly rate only"

  - name: permit_refund_amount
    trigger: "Permit {ACTIVE,SUSPENDED}->REFUNDED"
    algorithm: forward_looking
    formula: |
      total_days     = (expires_at.date - issued_at.date) in whole days
      remaining_days = (expires_at.date - clock_now.date) in whole days, floored at 0
      prorated_unused = round_half_up(fee_paid_cents * remaining_days / total_days)
      # dual variant on refund_type:
      #   VOLUNTARY:       refund_amount = max(0, prorated_unused - REFUND_ADMIN_FEE_CENTS)
      #   ADMINISTRATIVE:  refund_amount = prorated_unused   (no admin fee withheld)
    input_set: "Single permit being surrendered"
    constants:
      REFUND_ADMIN_FEE_CENTS: 2000
    precision: "integer cents, round_half_up"
    variants:
      - name: VOLUNTARY
        when: "refund_type == VOLUNTARY (resident-initiated surrender)"
        difference: "REFUND_ADMIN_FEE_CENTS withheld from the prorated amount, floored at 0"
      - name: ADMINISTRATIVE
        when: "refund_type == ADMINISTRATIVE (municipality-initiated, e.g. zone decommission)"
        difference: "full prorated_unused refunded, no admin fee"

  - name: citation_fine
    trigger: "Citation issuance (POST /citations)"
    algorithm: threshold
    formula: |
      base = BASE_FINE_CENTS[violation_type]
      prior_upheld = count(Citation c where c.license_plate == plate AND c.zone_id == zone
                           AND c.status == UPHELD)   # snapshot into prior_upheld_count
      if prior_upheld < REPEAT_THRESHOLD:
        fine_variant = STANDARD
        fine_amount  = base
      else:
        fine_variant = REPEAT_OFFENDER
        raw  = base * (ESCALATION_MULTIPLIER ** (prior_upheld - REPEAT_THRESHOLD + 1))
        fine_amount = max(MIN_FINE_CENTS, min(raw, MAX_FINE_CENTS))
    input_set: "The issuing citation plus prior UPHELD citations on the same plate+zone"
    constants:
      BASE_FINE_CENTS: { NO_PERMIT: 7500, EXPIRED_PERMIT: 5000, ZONE_VIOLATION: 5000 }
      REPEAT_THRESHOLD: 2
      ESCALATION_MULTIPLIER: 2
      MIN_FINE_CENTS: 2500
      MAX_FINE_CENTS: 25000
    precision: "integer cents"
    variants:
      - name: STANDARD
        when: "prior_upheld < REPEAT_THRESHOLD"
        difference: "flat base fine for the violation type"
      - name: REPEAT_OFFENDER
        when: "prior_upheld >= REPEAT_THRESHOLD"
        difference: "geometric escalation of base, clamped to [MIN_FINE_CENTS, MAX_FINE_CENTS]"

  - name: waitlist_position
    trigger: "WaitlistEntry create, promotion, cancel, expire; read of WaitlistEntry"
    algorithm: aggregation
    formula: |
      Among WaitlistEntry rows in the zone with status WAITING, order by created_at ASC
      (tie-break created_at ASC; created_at is unique enough — id is NEVER used).
      position = 1-based index of this entry in that ordering.
      Promotion always selects position == 1 (the oldest WAITING entry).
    input_set: "WAITING WaitlistEntry rows in the zone"
    precision: "1-based integer rank"

  - name: guest_pass_daily_usage
    trigger: "POST /visitor-passes with pass_type GUEST_DAILY"
    algorithm: threshold
    formula: |
      day = valid_from.date (UTC calendar date)
      used = count(VisitorPass v where v.household_id == household
                   AND v.pass_type == GUEST_DAILY
                   AND v.status IN {ACTIVE, EXPIRED}
                   AND v.valid_from.date == day)
      # boundary: reject when used >= Zone.guest_pass_daily_limit (the pass being
      # created would be the (limit+1)-th for that day).
    input_set: "Household GUEST_DAILY passes whose valid_from date matches the new pass's day"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: authz
    check: "Role permitted for this operation per RBAC; entity-backed roles must own the target resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: adjudicator_id must differ from issuing_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /citations/{id}/adjudicate"

  - priority: 5
    category: business_safety
    check: "Household proof_status must be VERIFIED for review, approve, and renew-approve"
    error_id: ERR_PROOF_NOT_VERIFIED
    http_status: 422
    applies_to: "review, approve, renew-approve"

  - priority: 5
    category: business_safety
    check: "Zone must be ACTIVE for review/approve/waitlist/issuance; Household must be ACTIVE"
    error_id: ERR_ZONE_SUSPENDED
    http_status: 409
    applies_to: "review, approve, waitlist"

  - priority: 6
    category: business_referential
    check: "vehicle_id must be an ACTIVE Vehicle whose household_id == the application's household_id"
    error_id: ERR_VEHICLE_HOUSEHOLD_MISMATCH
    http_status: 409
    applies_to: "POST /permit-applications; POST /permits/{id}/transfer"

  - priority: 6
    category: business_referential
    check: "VisitorPass.permit_id must be an ACTIVE Permit whose household_id == the pass's household_id"
    error_id: ERR_PERMIT_HOUSEHOLD_MISMATCH
    http_status: 409
    applies_to: "POST /visitor-passes"

  - priority: 7
    category: business_temporal
    check: "New VisitorPass must not overlap an existing ACTIVE pass for same household + guest_plate; intervals are HALF-OPEN [valid_from, valid_until) so exact adjacency (a.valid_until == b.valid_from) is allowed"
    error_id: ERR_VISITOR_PASS_OVERLAP
    http_status: 409
    applies_to: "POST /visitor-passes"

  - priority: 7
    category: business_temporal
    check: "A vehicle may not hold two occupying Permits whose CLOSED validity intervals [issued_at, expires_at] intersect; a new permit's issued_at must be strictly after any prior permit's expires_at (shared endpoint counts as overlap)"
    error_id: ERR_PERMIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "approve (issuance), transfer"

  - priority: 7
    category: business_temporal
    check: "Renewal only allowed within RENEWAL_WINDOW_DAYS of expires_at"
    error_id: ERR_RENEWAL_WINDOW
    http_status: 422
    applies_to: "POST /permits/{id}/renew"

  - priority: 8
    category: business_constraint
    check: "Household.active_permit_count < Zone.max_permits_per_household (vehicle cap)"
    error_id: ERR_HOUSEHOLD_VEHICLE_CAP
    http_status: 409
    applies_to: "approve (issuance)"

  - priority: 8
    category: business_constraint
    check: "GUEST_DAILY passes for a household on a given day must stay below guest_pass_daily_limit"
    error_id: ERR_GUEST_PASS_LIMIT
    http_status: 409
    applies_to: "POST /visitor-passes"

  - priority: 8
    category: business_constraint
    check: "No duplicate SUBMITTED/UNDER_REVIEW/WAITLISTED application for the same household+vehicle"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /permit-applications"

  - priority: 9
    category: business_fiscal
    check: "Zone.active_permit_count < Zone.permit_capacity (density limit) at approve time"
    error_id: ERR_ZONE_AT_CAPACITY
    http_status: 409
    applies_to: "approve (issuance)"

  - priority: 10
    category: concurrency
    check: "expected_zone_version / expected_permit_version must match parent version (OCC)"
    error_id: ERR_ZONE_VERSION_CONFLICT
    http_status: 412
    applies_to: "approve, renew-approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PermitSupervisor, ParkingClerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock now == to_iso8601 for all subsequent deadline/expiry/window computations"]

  # ---- Zone ----
  - method: POST
    path: "/zones"
    description: "Create a residential parking permit zone"
    roles: [PermitSupervisor]
    code: 201
    input: [name, zone_code, permit_capacity, max_permits_per_household, guest_pass_daily_limit, permit_annual_fee_cents, visitor_pass_fee_cents]
    output: Zone
    side_effects: ["status=ACTIVE; all counters/ledgers=0; version=1"]

  - method: GET
    path: "/zones/{zone_id}"
    description: "Get a zone"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: []
    output: Zone
    side_effects: []

  - method: POST
    path: "/zones/{zone_id}/suspend"
    description: "Suspend a zone (cascade freeze)"
    roles: [PermitSupervisor]
    code: 200
    input: []
    output: Zone
    side_effects:
      - "Zone.status -> SUSPENDED"
      - "CASCADE: ACTIVE/RENEWAL_PENDING permits in zone -> SUSPENDED; their ACTIVE visitor passes -> CANCELLED"

  - method: POST
    path: "/zones/{zone_id}/reactivate"
    description: "Reactivate a suspended zone"
    roles: [PermitSupervisor]
    code: 200
    input: []
    output: Zone
    side_effects:
      - "Zone.status -> ACTIVE"
      - "SUSPENDED permits whose household proof_status VERIFIED -> ACTIVE"

  - method: POST
    path: "/zones/{zone_id}/run-expiry"
    description: "Run the expiry/promotion sweep for a zone at the current clock time"
    roles: [ParkingClerk]
    code: 200
    input: []
    output: Zone
    side_effects:
      - "Permits past expires_at -> EXPIRED (free slot); visitor passes past valid_until -> EXPIRED"
      - "Households past proof_expires_at -> proof_status EXPIRED (cascade suspend their ACTIVE permits)"
      - "For each freed slot, promote the oldest WAITING WaitlistEntry (WAITLISTED application -> APPROVED, permit issued)"

  # ---- Household ----
  - method: POST
    path: "/households"
    description: "Self-register a household in a zone (returns the id used as Resident X-User-ID)"
    roles: [Anonymous]
    code: 201
    input: [zone_id, unit_address, resident_name, contact_email]
    output: Household
    side_effects: ["status=ACTIVE; proof_status=UNVERIFIED"]

  - method: GET
    path: "/households/{household_id}"
    description: "Get a household"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/households"
    description: "List households, optionally filtered by zone"
    roles: [PermitSupervisor, ParkingClerk]
    code: 200
    input: ["zone_id?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  # ---- Vehicle ----
  - method: POST
    path: "/households/{household_id}/vehicles"
    description: "Register a vehicle for a household"
    roles: [Resident]
    code: 201
    input: [license_plate, make, model]
    output: Vehicle
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/vehicles/{vehicle_id}"
    description: "Get a vehicle"
    roles: [PermitSupervisor, ParkingClerk, Resident]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles, optionally filtered by household"
    roles: [PermitSupervisor, ParkingClerk, Resident]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ---- ProofSubmission ----
  - method: POST
    path: "/households/{household_id}/proof-submissions"
    description: "Submit a proof-of-residency document"
    roles: [Resident]
    code: 201
    input: [document_type]
    output: ProofSubmission
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/proof-submissions/{proof_id}"
    description: "Get a proof submission"
    roles: [PermitSupervisor, ParkingClerk, Resident]
    code: 200
    input: []
    output: ProofSubmission
    side_effects: []

  - method: GET
    path: "/proof-submissions"
    description: "List proof submissions, optionally filtered by household"
    roles: [PermitSupervisor, ParkingClerk, Resident]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: ProofSubmission[]
    side_effects: []

  - method: POST
    path: "/proof-submissions/{proof_id}/review"
    description: "Clerk reviews a proof submission"
    roles: [ParkingClerk]
    code: 200
    input: [outcome]
    output: ProofSubmission
    side_effects:
      - "outcome=VERIFIED: status->VERIFIED; Household.proof_status->VERIFIED; proof_verified_at=now; proof_expires_at=now+PROOF_VALIDITY_DAYS; expires_at=now+PROOF_VALIDITY_DAYS"
      - "outcome=REJECTED: status->REJECTED; Household.proof_status unchanged"

  # ---- PermitApplication ----
  - method: POST
    path: "/permit-applications"
    description: "Resident submits a permit application"
    roles: [Resident]
    code: 201
    input: [zone_id, household_id, vehicle_id]
    output: PermitApplication
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/permit-applications/{application_id}"
    description: "Get an application"
    roles: [PermitSupervisor, ParkingClerk, Resident]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: GET
    path: "/permit-applications"
    description: "List applications, optionally filtered"
    roles: [PermitSupervisor, ParkingClerk, Resident]
    code: 200
    input: ["zone_id?", "household_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: POST
    path: "/permit-applications/{application_id}/review"
    description: "Clerk starts review (SUBMITTED->UNDER_REVIEW)"
    roles: [ParkingClerk]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status->UNDER_REVIEW; reviewer_user_id set; requires proof VERIFIED and zone ACTIVE"]

  - method: POST
    path: "/permit-applications/{application_id}/approve"
    description: "Supervisor approves and issues a permit (density + vehicle-cap gated; OCC on zone)"
    roles: [PermitSupervisor]
    code: 201
    input: [expected_zone_version]
    output: Permit
    side_effects:
      - "application.status->APPROVED; mint Permit ACTIVE; application.permit_id set"
      - "collect permit_issuance_fee into Zone.fees_collected_cents; Zone/Household active_permit_count += 1"
      - "increments Zone.version by 1"

  - method: POST
    path: "/permit-applications/{application_id}/waitlist"
    description: "Clerk waitlists an application when the zone is at capacity"
    roles: [ParkingClerk]
    code: 201
    input: []
    output: WaitlistEntry
    side_effects: ["application.status->WAITLISTED; create WaitlistEntry WAITING; Zone.waitlist_count += 1"]

  - method: POST
    path: "/permit-applications/{application_id}/deny"
    description: "Supervisor denies an application"
    roles: [PermitSupervisor]
    code: 200
    input: [denial_reason]
    output: PermitApplication
    side_effects: ["status->DENIED; decided_by_user_id set"]

  # ---- Permit ----
  - method: GET
    path: "/permits/{permit_id}"
    description: "Get a permit"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits"
    description: "List permits, optionally filtered"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: ["zone_id?", "household_id?", "vehicle_id?", "application_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{permit_id}/renew"
    description: "Resident requests renewal (ACTIVE->RENEWAL_PENDING) within the renewal window"
    roles: [Resident]
    code: 200
    input: []
    output: Permit
    side_effects: ["status->RENEWAL_PENDING; slot still occupied"]

  - method: POST
    path: "/permits/{permit_id}/renew-approve"
    description: "Supervisor approves renewal (RENEWAL_PENDING->ACTIVE; OCC on permit)"
    roles: [PermitSupervisor]
    code: 200
    input: [expected_permit_version]
    output: Permit
    side_effects:
      - "status->ACTIVE; expires_at advanced to next fiscal-year-end; requires proof VERIFIED"
      - "fee_paid_cents += permit_annual_fee_cents; Zone.fees_collected_cents += that amount"
      - "increments Permit.version by 1"

  - method: POST
    path: "/permits/{permit_id}/transfer"
    description: "Supervisor transfers a permit to another ACTIVE vehicle of the same household (slot-conserving)"
    roles: [PermitSupervisor]
    code: 201
    input: [vehicle_id]
    output: Permit
    side_effects:
      - "predecessor status->TRANSFERRED; mint successor Permit ACTIVE inheriting issued_at/expires_at/fee_paid_cents"
      - "set predecessor.transferred_to_permit_id; Zone/Household active_permit_count unchanged"

  - method: POST
    path: "/permits/{permit_id}/refund"
    description: "Supervisor refunds/surrenders a permit (dual-variant refund; frees slot; promotes waitlist)"
    roles: [PermitSupervisor]
    code: 200
    input: [refund_type]
    output: Permit
    side_effects:
      - "status->REFUNDED; refund_amount_cents = permit_refund_amount(refund_type); Zone.fees_refunded_cents += it"
      - "Zone/Household active_permit_count -= 1; CASCADE promote oldest WAITING WaitlistEntry"

  - method: POST
    path: "/permits/{permit_id}/revoke"
    description: "Supervisor revokes a permit for cause (no refund; frees slot; promotes waitlist)"
    roles: [PermitSupervisor]
    code: 200
    input: [reason]
    output: Permit
    side_effects:
      - "status->REVOKED; Zone/Household active_permit_count -= 1; CASCADE promote oldest WAITING WaitlistEntry"

  # ---- VisitorPass ----
  - method: POST
    path: "/visitor-passes"
    description: "Issue a guest/temporary visitor pass under a resident permit"
    roles: [Resident]
    code: 201
    input: [household_id, permit_id, pass_type, guest_plate, valid_from, valid_until]
    output: VisitorPass
    side_effects:
      - "status=ACTIVE; fee_charged_cents = visitor_pass_fee_cents for TEMPORARY else 0"
      - "checks: permit ACTIVE & owned by household; no half-open overlap for same guest_plate; GUEST_DAILY daily limit"

  - method: GET
    path: "/visitor-passes/{pass_id}"
    description: "Get a visitor pass"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: []
    output: VisitorPass
    side_effects: []

  - method: GET
    path: "/visitor-passes"
    description: "List visitor passes, optionally filtered"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: ["household_id?", "permit_id?", "limit?", "offset?"]
    output: VisitorPass[]
    side_effects: []

  - method: POST
    path: "/visitor-passes/{pass_id}/cancel"
    description: "Resident cancels an active visitor pass"
    roles: [Resident]
    code: 200
    input: []
    output: VisitorPass
    side_effects: ["status->CANCELLED"]

  # ---- WaitlistEntry ----
  - method: GET
    path: "/waitlist-entries/{entry_id}"
    description: "Get a waitlist entry"
    roles: [PermitSupervisor, ParkingClerk, Resident]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/waitlist-entries"
    description: "List waitlist entries, optionally filtered"
    roles: [PermitSupervisor, ParkingClerk, Resident]
    code: 200
    input: ["zone_id?", "application_id?", "household_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  # ---- Citation ----
  - method: POST
    path: "/citations"
    description: "Officer issues a citation (fine computed by citation_fine)"
    roles: [EnforcementOfficer]
    code: 201
    input: [zone_id, "permit_id?", license_plate, violation_type]
    output: Citation
    side_effects: ["status=ISSUED; fine_amount_cents & fine_variant computed; prior_upheld_count snapshot; issuing_officer_id set"]

  - method: GET
    path: "/citations/{citation_id}"
    description: "Get a citation"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: []
    output: Citation
    side_effects: []

  - method: GET
    path: "/citations"
    description: "List citations, optionally filtered"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: ["zone_id?", "permit_id?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []

  - method: POST
    path: "/citations/{citation_id}/pay"
    description: "Resident pays a citation (ISSUED or UPHELD -> PAID)"
    roles: [Resident]
    code: 200
    input: []
    output: Citation
    side_effects: ["status->PAID"]

  - method: POST
    path: "/citations/{citation_id}/dispute"
    description: "Resident disputes a citation (ISSUED->DISPUTED)"
    roles: [Resident]
    code: 200
    input: []
    output: Citation
    side_effects: ["status->DISPUTED"]

  - method: POST
    path: "/citations/{citation_id}/adjudicate"
    description: "A different officer adjudicates a disputed citation (SoD enforced; UPHELD may cascade to permit revocation + waitlist promotion)"
    roles: [EnforcementOfficer]
    code: 200
    input: [outcome]
    output: Citation
    side_effects:
      - "outcome=UPHELD: status->UPHELD; adjudicator_id set; if permit reaches REVOKE_UPHELD_THRESHOLD upheld citations -> Permit REVOKED -> waitlist promotion"
      - "outcome=DISMISSED: status->DISMISSED; adjudicator_id set"
      - "requires X-User-ID != issuing_officer_id"

  # ---- Complaint ----
  - method: POST
    path: "/complaints"
    description: "File a complaint about a zone/plate"
    roles: [Resident, EnforcementOfficer]
    code: 201
    input: [zone_id, complaint_type, "target_plate?", description]
    output: Complaint
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/complaints/{complaint_id}"
    description: "Get a complaint"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/complaints"
    description: "List complaints, optionally filtered by zone"
    roles: [PermitSupervisor, ParkingClerk, EnforcementOfficer, Resident]
    code: 200
    input: ["zone_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/complaints/{complaint_id}/resolve"
    description: "Officer resolves/dismisses/escalates a complaint"
    roles: [EnforcementOfficer]
    code: 200
    input: [outcome, "resolution_note?"]
    output: Complaint
    side_effects:
      - "outcome=RESOLVED|DISMISSED: status set; resolution_note stored"
      - "outcome=ESCALATED: requires target_plate; synthesize a ZONE_VIOLATION Citation; created_citation_id set; status->ESCALATED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity-backed role does not own the target" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, valid_until <= valid_from, negative amount" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adjudicating officer is the same user who issued the citation" }
  - { id: ERR_PROOF_NOT_VERIFIED, http: 422, condition: "Household proof_status is not VERIFIED for review/approve/renew-approve" }
  - { id: ERR_ZONE_SUSPENDED, http: 409, condition: "Zone is SUSPENDED and cannot review/approve/waitlist/issue" }
  - { id: ERR_HOUSEHOLD_SUSPENDED, http: 409, condition: "Household is SUSPENDED and cannot transact" }
  - { id: ERR_VEHICLE_HOUSEHOLD_MISMATCH, http: 409, condition: "vehicle_id is not an ACTIVE vehicle of the target household" }
  - { id: ERR_PERMIT_HOUSEHOLD_MISMATCH, http: 409, condition: "VisitorPass.permit_id is not an ACTIVE permit owned by the household" }
  - { id: ERR_VISITOR_PASS_OVERLAP, http: 409, condition: "New visitor pass overlaps an existing ACTIVE pass for the same household+guest_plate (half-open intervals)" }
  - { id: ERR_PERMIT_PERIOD_OVERLAP, http: 409, condition: "A vehicle already holds an occupying permit whose closed period intersects the new permit's period" }
  - { id: ERR_RENEWAL_WINDOW, http: 422, condition: "Renewal requested outside the RENEWAL_WINDOW_DAYS window before expires_at" }
  - { id: ERR_HOUSEHOLD_VEHICLE_CAP, http: 409, condition: "Household already at max_permits_per_household occupying permits" }
  - { id: ERR_GUEST_PASS_LIMIT, http: 409, condition: "GUEST_DAILY pass would exceed guest_pass_daily_limit for the day" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "An open application for the same household+vehicle already exists" }
  - { id: ERR_ZONE_AT_CAPACITY, http: 409, condition: "Zone.active_permit_count already at permit_capacity; must waitlist" }
  - { id: ERR_ZONE_VERSION_CONFLICT, http: 412, condition: "expected_zone_version does not match Zone.version (OCC)" }
  - { id: ERR_PERMIT_VERSION_CONFLICT, http: 412, condition: "expected_permit_version does not match Permit.version (OCC)" }
  - { id: ERR_ESCALATION_REQUIRES_PLATE, http: 422, condition: "Complaint escalation requested with null target_plate" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Resident
    description: "A household member; self-registers the household and acts on its own resources"
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST /households/{id}/vehicles — register vehicle"
      - "POST /households/{id}/proof-submissions — submit proof"
      - "POST /permit-applications — apply"
      - "POST /permits/{id}/renew — request renewal"
      - "POST /visitor-passes — issue guest/temporary pass"
      - "POST /visitor-passes/{id}/cancel — cancel own pass"
      - "POST /citations/{id}/pay — pay citation"
      - "POST /citations/{id}/dispute — dispute citation"
    shared_operations:
      - "POST /households — self-register (as Anonymous, no ownership yet)"
      - "POST /complaints — file complaint (shared with EnforcementOfficer)"
      - "GET reads of own household, vehicles, applications, permits, passes, citations"

  - name: ParkingClerk
    description: "Front-office clerk; verifies proof and performs first-stage review and waitlisting"
    identity: "opaque"
    exclusive_operations:
      - "POST /proof-submissions/{id}/review — verify/reject proof"
      - "POST /permit-applications/{id}/review — start review"
      - "POST /permit-applications/{id}/waitlist — waitlist a full-zone application"
      - "POST /zones/{id}/run-expiry — run expiry/promotion sweep"
    shared_operations:
      - "GET reads across zones/households/applications/permits/waitlist/citations"

  - name: PermitSupervisor
    description: "Back-office supervisor; approves/denies, manages permit lifecycle and zones"
    identity: "opaque"
    exclusive_operations:
      - "POST /zones — create zone"
      - "POST /zones/{id}/suspend, /reactivate — zone lifecycle"
      - "POST /permit-applications/{id}/approve — approve & issue (OCC on zone)"
      - "POST /permit-applications/{id}/deny — deny"
      - "POST /permits/{id}/renew-approve — approve renewal (OCC on permit)"
      - "POST /permits/{id}/transfer — transfer permit"
      - "POST /permits/{id}/refund — refund/surrender"
      - "POST /permits/{id}/revoke — revoke for cause"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with ParkingClerk)"
      - "GET reads across all resources"

  - name: EnforcementOfficer
    description: "Field enforcement; issues and adjudicates citations, handles complaints"
    identity: "opaque"
    exclusive_operations:
      - "POST /citations — issue citation"
      - "POST /citations/{id}/adjudicate — adjudicate dispute (SoD: not own citation)"
      - "POST /complaints/{id}/resolve — resolve/dismiss/escalate complaint"
    shared_operations:
      - "POST /complaints — file complaint (shared with Resident)"
      - "GET reads across zones/permits/citations/complaints"

  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a household"
    identity: "opaque"
    exclusive_operations:
      - "POST /households — self-register"
    shared_operations: []
