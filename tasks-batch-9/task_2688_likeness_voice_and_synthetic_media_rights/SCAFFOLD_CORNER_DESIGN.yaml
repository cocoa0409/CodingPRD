      - name: estate_grant_needs_the_registration_number_the_state_demands
        claim_type: error_triggerable
        grounds: [validations.priority_56, errors.ERR_POSTMORTEM_REGISTRATION_MISSING]
        distinguishing_aspect: >-
          Two deceased CA talents differ only in whether their VERIFIED estate authority carried a
          registration_number. CA requires registration, so the unregistered estate cannot grant
          consent at all while the registered one can — the check reads a value COPIED onto the talent
          at verification, not the authority row, so an implementation that looks in the wrong place
          fails exactly one of the two legs.
        test_recipe:
          setup:
            - "CA profile with postmortem_requires_registration true"
            - "Talent A: deceased, estate authority verified WITHOUT a registration_number"
            - "Talent B: deceased, estate authority verified WITH registration_number CA-REG-88"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Unregistered Estate", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { ta_id: $.data.id }
            - call: "POST /talents/${ta_id}/death-record"
              payload: { date_of_death: "2026-08-01T00:00:00Z" }
              as: RightsAdministrator
            - call: "POST /talents/${ta_id}/estate-authorities"
              payload: { executor_name: "Dana Cole", court_document_ref: "PROB-A-1" }
              as: RightsAdministrator
              as_user_id: "ra-001"
              captures: { ea_id: $.data.id }
            - call: "POST /estate-authorities/${ea_id}/verify"
              payload: {}
              as: RightsAdministrator
              as_user_id: "ra-002"
            - call: "POST /talents"
              payload: { legal_name: "Registered Estate", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { tb_id: $.data.id }
            - call: "POST /talents/${tb_id}/death-record"
              payload: { date_of_death: "2026-08-01T00:00:00Z" }
              as: RightsAdministrator
            - call: "POST /talents/${tb_id}/estate-authorities"
              payload: { executor_name: "Sam Ruiz", court_document_ref: "PROB-B-1", registration_number: "CA-REG-88" }
              as: RightsAdministrator
              as_user_id: "ra-001"
              captures: { eb_id: $.data.id }
            - call: "POST /estate-authorities/${eb_id}/verify"
              payload: {}
              as: RightsAdministrator
              as_user_id: "ra-002"
          trigger:
            - call: "GET /talents/${ta_id}"
              payload: {}
              as: RightsAdministrator
              captures: { ta_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${ta_id}", grantor_kind: "ESTATE", estate_authority_id: "${ea_id}", permitted_media_types: ["FEATURE_FILM"], permitted_use_notes: "Archive film use", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${ta_v}" }
              as: RightsAdministrator
              as_user_id: "ra-002"
            - call: "GET /talents/${tb_id}"
              payload: {}
              as: RightsAdministrator
              captures: { tb_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${tb_id}", grantor_kind: "ESTATE", estate_authority_id: "${eb_id}", permitted_media_types: ["FEATURE_FILM"], permitted_use_notes: "Archive film use", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${tb_v}" }
              as: RightsAdministrator
              as_user_id: "ra-002"
          assert:
            - "trigger call 1 shows talent A with life_status \"DECEASED\", postmortem_rights_until \"2096-08-01T00:00:00Z\" and postmortem_registration_number null — verification copied nothing because the authority carried nothing"
            - "trigger call 2 -> 422 with data.error_id == \"ERR_POSTMORTEM_REGISTRATION_MISSING\": the estate is VERIFIED, so this is not ERR_ESTATE_AUTHORITY_UNVERIFIED, and no grant row is created"
            - "trigger call 3 shows talent B with postmortem_registration_number \"CA-REG-88\", copied from its VERIFIED authority"
            - "trigger call 4 -> 201 with status \"PENDING_COUNTERSIGN\", grantor_kind \"ESTATE\" and estate_authority_id ${eb_id} — the only difference between the two legs was the registration number"
            - "GET /consent-grants?talent_id=${ta_id} returns total_count == 0 while GET /consent-grants?talent_id=${tb_id} returns total_count == 1"

  - section: rbac
    instances:
      - name: each_offices_exclusive_operations_are_closed_to_the_other_roles
        claim_type: exclusive_operations
        grounds: [roles.RightsAdministrator, roles.TalentRepresentative, roles.LicenseeProducer, roles.ComplianceOfficer, validations.priority_2]
        distinguishing_aspect: >-
          Four roles each perform one operation §1.7 lists as their own, and the SAME operations are
          then replayed under a foreign role. The denial rung sits at priority 2, above every
          existence check, so a foreign role aimed at a non-existent id must still answer
          ERR_ROLE_NOT_PERMITTED rather than a 404 — that ordering is what stops the API leaking which
          ids exist to callers who may not act on them.
        test_recipe:
          setup:
            - "CA profile, one talent with an ACTIVE grant, one asset and one BUILT replica"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Ads", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-001", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:aaa" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", replica_kind: "VOICE_CLONE", source_asset_ids: ["${a1_id}"], build_ref: "build-001" }
              as: RightsAdministrator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /union-minimum-schedules"
              payload: { union_code: "SAG_AFTRA", media_type: "ADVERTISING", effective_from: "2026-01-01T00:00:00Z", minimum_initial_cents: 100000, minimum_per_use_cents: 50000 }
              as: RightsAdministrator
            - call: "POST /digital-replicas/${r_id}/approve-for-use"
              payload: { approval_note: "cleared" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /generated-performances"
              payload: { digital_replica_id: "${r_id}", licensee_name: "Northlight", media_type: "ADVERTISING", territory_codes: ["US"], intended_use_description: "US spot", projected_impressions: 500000, scheduled_first_use_at: "2026-09-01T00:00:00Z" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { p_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/x", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 1000, match_confidence: 0.400 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_id: $.data.id }
          assert:
            - "all four trigger calls succeed (201/200): every role can exercise the operation §1.7 lists as its own"
            - "transcribe: POST /talents with the SAME body but headers X-User-Role: LicenseeProducer, X-User-ID: lic-001 -> 403 ERR_ROLE_NOT_PERMITTED"
            - "transcribe: POST /digital-replicas/${r_id}/approve-for-use with headers X-User-Role: LicenseeProducer, X-User-ID: lic-001 -> 403 ERR_ROLE_NOT_PERMITTED — approval is the talent side's alone, and a licensee may not self-clear"
            - "transcribe: POST /generated-performances with the trigger-3 body and headers X-User-Role: RightsAdministrator, X-User-ID: ra-001 -> 403 ERR_ROLE_NOT_PERMITTED — the clearance office does not submit performances on a licensee's behalf"
            - "transcribe: POST /infringement-cases/${c_id}/triage {\"decision\": \"DISMISS\"} with headers X-User-Role: RightsAdministrator, X-User-ID: ra-001 -> 403 ERR_ROLE_NOT_PERMITTED; the same body under X-User-Role: ComplianceOfficer, X-User-ID: co-001 -> 200"
            - "transcribe: POST /infringement-cases/${c_id}/escalate {\"escalation_note\": \"x\"} with headers X-User-Role: ComplianceOfficer, X-User-ID: co-002 -> 403 ERR_ROLE_NOT_PERMITTED — the officer is barred from escalation by the endpoint's role list, before any severity or duty-segregation check"
            - "transcribe: POST /biometric-assets/{unknown-uuid}/purge {\"purge_note\": \"x\"} with headers X-User-Role: ComplianceOfficer, X-User-ID: co-001 -> 403 ERR_ROLE_NOT_PERMITTED, NOT 404 — priority 2 precedes priority 13"

      - name: shared_reads_and_the_shared_closure_action_admit_every_declared_role
        claim_type: shared_operations
        grounds: [roles.RightsAdministrator, roles.ComplianceOfficer, endpoints.POST_infringement_cases_id_close, validations.priority_1]
        distinguishing_aspect: >-
          The mirror image of the exclusivity corner: reads are shared by all five roles and case
          closure by both offices, so a permission model implemented as one role check per entity
          rather than per endpoint over-blocks here. The unauthenticated rung is also probed, including
          the ordering claim that a missing role header outranks a forbidden role.
        test_recipe:
          setup:
            - "CA profile, one talent with an ACTIVE grant, and one TAKEDOWN_ISSUED case"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Ads", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v}" }
              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/y", detected_channel: "ADVERTISING", detected_state_code: "CA", detected_view_count: 1000, match_confidence: 0.400 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_id: $.data.id }
            - call: "POST /infringement-cases/${c_id}/triage"
              payload: { decision: "ISSUE_TAKEDOWN" }
              as: ComplianceOfficer
              as_user_id: "co-001"
          trigger:
            - call: "GET /consent-grants/${g_id}"
              payload: {}
              as: RightsAdministrator
            - call: "GET /consent-grants/${g_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "GET /consent-grants/${g_id}"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "GET /consent-grants/${g_id}"
              payload: {}
              as: LicenseeProducer
              as_user_id: "lic-001"
            - call: "POST /infringement-cases/${c_id}/close"
              payload: { outcome: "REMOVED" }
              as: ComplianceOfficer
              as_user_id: "co-001"
          assert:
            - "trigger calls 1-4 all return 200 with byte-identical data payloads: a shared read is not narrowed by role, and no field is redacted per role"
            - "trigger call 5 -> 200 with status \"RESOLVED_REMOVED\" and closed_by_user_id \"co-001\" — closure is shared, so the officer that triaged may also close (only ESCALATION carries the duty-segregation bar)"
            - "transcribe: GET /consent-grants/${g_id} with X-User-Role: RightsAdministrator but NO X-User-ID header -> 401 ERR_UNAUTHENTICATED; with X-User-ID but no X-User-Role -> 401 ERR_UNAUTHENTICATED; with X-User-Role: Notary (undeclared) -> 401 ERR_UNAUTHENTICATED, not 403"
            - "transcribe: POST /talents with no headers at all -> 401 ERR_UNAUTHENTICATED, proving priority 1 outranks the priority 2 role denial that a header-less LicenseeProducer would otherwise draw"
            - "transcribe: POST /talents as X-User-Role: RightsAdministrator, X-User-ID: ra-001 with legal_name omitted -> 400 ERR_INVALID_REQUEST; with domicile_state_code: \"California\" (not two letters) -> 400 ERR_INVALID_REQUEST; with initial_creation_fee_cents sent as the string \"300000\" on POST /consent-grants -> 400 ERR_INVALID_REQUEST"

