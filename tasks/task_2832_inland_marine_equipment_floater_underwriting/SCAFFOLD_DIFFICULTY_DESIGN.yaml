            - "trigger[0] response error_id == ERR_JOBSITE_SECURITY_INSUFFICIENT"
            - "trigger[0] response error_id != ERR_FLOATER_LIMIT_EXCEEDS_PART_AGGREGATE"
            - "InstallationFloater.${flt}.status == PENDING"
            - "InstallationFloater.${flt}.rated_premium_cents == 88219"
            - "Jobsite.${js2}.status == UNSURVEYED and Jobsite.${js2}.security_tier == TIER_0"
            - "Jobsite.${js2}.active_floater_count == 1 (the create hop already counted it; the failed activate changes nothing)"
            - "CoveragePart.${cp_fl}.aggregate_available_cents == 10000000"
            - "Policy.${pol}.written_premium_cents == 100000"

