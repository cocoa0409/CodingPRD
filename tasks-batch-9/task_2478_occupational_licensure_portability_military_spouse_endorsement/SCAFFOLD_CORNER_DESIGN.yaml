              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-16001", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof}", primary_credential_id: "${cred}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app: $.data.id }
            - call: "POST /licensure/applications/${app}/submit"
              payload: {}
              as: Applicant
