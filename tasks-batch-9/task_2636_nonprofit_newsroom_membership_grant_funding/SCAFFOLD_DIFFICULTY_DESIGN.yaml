  - rule_id: resource_temporal_overlap
    instances:
      - name: rt_collaboration_half_open_windows_permit_adjacency_and_bar_overlap
        grounds:
          - validations[priority=35]
          - state_machines.Collaboration.DRAFT_to_ACTIVE
          - state_machines.Collaboration.DRAFT_to_DISSOLVED
          - entities.Collaboration.fields.window_start
          - entities.Collaboration.fields.window_end
        distinguishing_aspect: |
          On one CoverageArea, collaboration B starting exactly when A ends (window_start
          2026-10-01T00:00:00Z == A.window_end) activates cleanly because the interval is half-open,
          while collaboration C spanning 2026-09-30T00:00:00Z..2026-10-01T00:00:00Z - one day of overlap
          with A and mere adjacency to B - is refused with ERR_COLLABORATION_WINDOW_OVERLAP, and C
          activates only after A is DISSOLVED and therefore no longer ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OPEN FiscalPeriod FY2027 (2026-08-01..2027-07-31)."
            - "CoverageArea CLIMATE with publication_gate OPEN."
            - "Collaboration A on CLIMATE, window 2026-09-01T00:00:00Z..2026-10-01T00:00:00Z, total_cost_cents 100000, lead 6000/6000 bps, one CONFIRMED partner at 4000/4000, ACTIVATED."
            - "Collaboration B on CLIMATE, window 2026-10-01T00:00:00Z..2026-11-01T00:00:00Z (starts exactly where A ends), same share structure, ACTIVATED."
            - "Collaboration C on CLIMATE, window 2026-09-30T00:00:00Z..2026-10-01T00:00:00Z, same share structure, still DRAFT."
