scenario: |
  /prd-bench-entrance generate task hard than expert level! 979. Stairlift & Mobility-Equipment Sales/Rental: assessment & measure, product (stairlift/lift/scooter) & install, rental vs purchase & funding, service/maintenance plan, removal/buyback, warranty, insurance/waiver, inventory

domain_name: stairlift-mobility-equipment
api_prefix: /stairlift-ops

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer's full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) for age-based funding eligibility" }
      - { name: home_region_code, type: string, source: input, description: "Region code (e.g., 'NORTH', 'SOUTH') used by funding rules" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | FORMER", default: "PROSPECT" }
      - { name: lifetime_outstanding_cents, type: integer, source: computed, description: "Sum across all Agreements of (agreement.list_price_cents - agreement.funding_applied_cents - agreement.paid_to_date_cents) for agreements in ACTIVE or REMOVAL_REQUESTED; re-derived on each cascade" }

  - name: HomeAssessment
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: scheduled_date, type: string, source: input, description: "ISO 8601 date for the site visit" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | MEASURED | APPROVED | REJECTED | SUPERSEDED", default: "SCHEDULED" }
      - { name: staircase_kind, type: enum, source: input, description: "STRAIGHT | CURVED | OUTDOOR", constraints: "required on measurement" }
      - { name: stair_rise_mm, type: integer, source: input, description: "Total vertical rise of staircase in millimetres; >= 500", constraints: "500..6000" }
      - { name: stair_run_mm, type: integer, source: input, description: "Total horizontal run of staircase in millimetres", constraints: "500..12000" }
      - { name: stair_width_mm, type: integer, source: input, description: "Narrowest stair width in millimetres", constraints: "600..1500" }
      - { name: landing_clearance_mm, type: integer, source: input, description: "Clear space at bottom landing", constraints: "0..3000" }
      - { name: has_outdoor_exposure, type: boolean, source: input, default: false, description: "True if any portion of track is exposed to weather" }
      - { name: electrical_outlet_within_2m, type: boolean, source: input, description: "True if a 230V outlet exists within 2m of proposed rail top" }
      - { name: measured_at, type: datetime, source: system, description: "Server-stamped timestamp when MEASURED transition fires" }
      - { name: approved_at, type: datetime, source: system, description: "Server-stamped timestamp when APPROVED transition fires; null until approved" }

  - name: ProductModel
    parent: null
    common_fields: false
    fields:
      - { name: model_code, type: string, source: input, description: "Unique SKU, e.g. 'SL-STRAIGHT-100'" }
      - { name: kind, type: enum, source: input, description: "STAIRLIFT | VERTICAL_LIFT | SCOOTER" }
      - { name: supports_curved, type: boolean, source: input, description: "True if model can be installed on CURVED staircase" }
      - { name: supports_outdoor, type: boolean, source: input, description: "True if model rated for outdoor exposure" }
      - { name: min_stair_width_mm, type: integer, source: input, description: "Minimum stair width this model fits" }
      - { name: base_purchase_price_cents, type: integer, source: input, description: "Catalog purchase price in cents" }
      - { name: monthly_rental_rate_cents, type: integer, source: input, description: "Monthly rental rate in cents" }
      - { name: install_labor_hours, type: integer, source: input, description: "Standard install labor hours; used to compute install slot length" }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "FK -> ProductModel.model_code; the catalog model this unit belongs to" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial number; globally unique" }
      - { name: condition_grade, type: enum, source: system, description: "NEW | REFURB_A | REFURB_B | REFURB_C | RETIRED", default: "NEW" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | RESERVED | INSTALLED | IN_SERVICE | REMOVED | RETIRED", default: "IN_STOCK" }
      - { name: acquired_at, type: datetime, source: system, description: "Server-stamped acquisition timestamp" }
      - { name: lifetime_rental_months, type: integer, source: system, default: 0, description: "Cumulative months this unit has been under an ACTIVE rental agreement; used for buyback depreciation" }

  - name: Quote
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: home_assessment_id, type: string, source: input, description: "FK -> HomeAssessment.id; the measurement this quote is based on" }
      - { name: model_code, type: string, source: input, description: "FK -> ProductModel.model_code" }
      - { name: acquisition_mode, type: enum, source: input, description: "RENTAL | PURCHASE" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | ACCEPTED | EXPIRED | SUPERSEDED", default: "DRAFT" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "Increments on each revise action; creates cyclic DRAFT<->ISSUED loop" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Forward-looking estimate using catalog prices and nominal install labor; see provisional_quote_total" }
      - { name: issued_total_cents, type: integer, source: computed, description: "Actuals-based total computed at ISSUE time using measured rail length, measured labor, applicable region surcharge; see issued_quote_total" }
      - { name: issued_at, type: datetime, source: system, description: "Server-stamped when transitioned to ISSUED" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + QUOTE_TTL_DAYS; system job expires when logical clock passes" }
      - { name: valid_rail_length_m, type: number, source: computed, description: "Rail length derived from stair_rise_mm/stair_run_mm via Pythagoras, rounded to 2dp; pinned for installed price" }

  - name: FundingApplication
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id" }
      - { name: source_kind, type: enum, source: input, description: "STATE_GRANT | INSURANCE | CHARITY | VETERAN_BENEFIT" }
      - { name: requested_cents, type: integer, source: input, description: "Amount customer is applying for" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | PARTIALLY_APPROVED | DENIED | WITHDRAWN", default: "PENDING" }
      - { name: approved_cents, type: integer, source: system, description: "Amount granted; 0 until APPROVED / PARTIALLY_APPROVED" }
      - { name: decision_reason, type: string, source: input, description: "Free-text reason recorded at decision" }
      - { name: priority_rank, type: integer, source: input, description: "Lower number = higher priority in waterfall; must be unique within a quote" }

  - name: Agreement
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; the accepted quote this agreement consummates" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id (denormalized from Quote.customer_id for reverse lookup)" }
      - { name: mode, type: enum, source: system, description: "RENTAL | PURCHASE (copied from Quote.acquisition_mode)" }
      - { name: status, type: enum, source: system, description: "PENDING_FUNDING | FUNDED | SCHEDULED | INSTALLED | ACTIVE | REMOVAL_REQUESTED | REMOVED | CLOSED | CANCELLED", default: "PENDING_FUNDING" }
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; the reserved unit" }
      - { name: list_price_cents, type: integer, source: computed, description: "PURCHASE: quote.issued_total_cents; RENTAL: monthly_rental_rate_cents * committed_rental_months (committed_rental_months input on Agreement create)" }
      - { name: committed_rental_months, type: integer, source: input, description: "RENTAL only: minimum rental commitment in months; must be >= 3" }
      - { name: funding_applied_cents, type: integer, source: computed, default: 0, description: "Waterfall-allocated sum across APPROVED/PARTIALLY_APPROVED FundingApplications ordered by priority_rank ASC then created_at ASC; capped at list_price_cents" }
      - { name: paid_to_date_cents, type: integer, source: system, default: 0, description: "Customer out-of-pocket payments recorded via POST /agreements/{id}/payments" }
      - { name: liability_waiver_signed, type: boolean, source: input, default: false, description: "Customer declined extended warranty; affects WarrantyClaim eligibility and ServicePlan pricing" }
      - { name: version_anchor_quote_revision, type: integer, source: system, description: "Quote.revision_number at the moment of Agreement creation; used to detect stale quote acceptance" }

  - name: InstallJob
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id" }
      - { name: technician_crew_id, type: string, source: input, description: "Identifier of the crew booked; overlapping bookings on the same crew are rejected with a buffer rule" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "ISO 8601 install start" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "ISO 8601 install end; must be > start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | FAILED | CANCELLED", default: "SCHEDULED" }
      - { name: measured_labor_hours, type: integer, source: input, description: "Actual labor hours observed at completion; used by issued_price reconciliation" }
      - { name: installed_rail_length_m, type: number, source: input, description: "Actual rail length fitted; compared to quote.valid_rail_length_m" }
      - { name: completed_at, type: datetime, source: system, description: "Server-stamped when COMPLETED" }

  - name: ServicePlan
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id" }
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | CANCELLED", default: "ACTIVE" }
      - { name: monthly_fee_cents, type: integer, source: computed, description: "See service_plan_fee calculation (dual-variant: standard pricing vs waiver-discounted pricing)" }
      - { name: next_service_due_utc, type: datetime, source: system, description: "Logical clock timestamp when next preventive maintenance is due; activated Agreements auto-LAPSE plan if 90 days overdue" }
      - { name: coverage_cap_cents, type: integer, source: computed, description: "Lifetime cap on covered repairs under this plan; tier-dependent" }
      - { name: coverage_used_cents, type: integer, source: system, default: 0, description: "Cumulative covered-claim cents consumed" }

  - name: WarrantyClaim
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id" }
      - { name: service_plan_id, type: string, source: input, description: "FK -> ServicePlan.id; plan the claim draws against" }
      - { name: claim_kind, type: enum, source: input, description: "MECHANICAL | ELECTRICAL | STRUCTURAL | WEAR_AND_TEAR" }
      - { name: claimed_cents, type: integer, source: input, description: "Customer-estimated repair cost" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED | PAID", default: "SUBMITTED" }
      - { name: approved_cents, type: integer, source: system, default: 0, description: "Amount adjudicated; capped by (coverage_cap_cents - coverage_used_cents) and by tier inclusion rules" }
      - { name: denial_reason, type: string, source: input, description: "Required if status -> DENIED" }

  - name: RemovalJob
    parent: Agreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> Agreement.id" }
      - { name: technician_crew_id, type: string, source: input, description: "Crew identifier; same buffer rule as InstallJob" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "ISO 8601 removal start" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "ISO 8601 removal end" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: "SCHEDULED" }
      - { name: buyback_offered_cents, type: integer, source: computed, description: "Amount offered to customer for used equipment; see buyback_offer calculation (dual-variant)" }
      - { name: condition_grade_at_removal, type: enum, source: input, description: "REFURB_A | REFURB_B | REFURB_C | RETIRED; assessor-graded at removal" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: entity_kind, type: string, source: system, description: "Entity name of the affected row (e.g. 'Agreement')" }
      - { name: entity_id, type: string, source: system, description: "Id of the affected row" }
      - { name: event_kind, type: string, source: system, description: "Transition name or cascade label" }
      - { name: actor_role, type: string, source: system, description: "Role that triggered the event" }
      - { name: payload, type: object, source: system, description: "Free-form JSON snapshot of pre/post state" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: HomeAssessment
    initial_state: SCHEDULED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: MEASURED
        trigger: "POST /stairlift-ops/home-assessments/{id}/measure"
        actor: Assessor
        preconditions:
          - "HomeAssessment.status == SCHEDULED (ERR_INVALID_STATE otherwise)"
          - "All measurement fields present and within constraints (ERR_INVALID_MEASUREMENT otherwise)"
          - "If staircase_kind == CURVED, stair_run_mm must be >= 2 * stair_rise_mm (safety geometric minimum; ERR_INVALID_MEASUREMENT)"
        side_effects:
          - "measured_at := logical clock now"
          - "AuditEvent appended (event_kind='ASSESS_MEASURED')"

      - from: MEASURED
        to: APPROVED
        trigger: "POST /stairlift-ops/home-assessments/{id}/approve"
        actor: AssessmentReviewer
        preconditions:
          - "HomeAssessment.status == MEASURED"
          - "stair_width_mm >= ProductModel.min_stair_width_mm for the model the assessor pins in the request (ERR_STAIR_TOO_NARROW)"
          - "electrical_outlet_within_2m == true OR staircase_kind == OUTDOOR (ERR_NO_POWER_SOURCE)"
          - "landing_clearance_mm >= 500 (ERR_LANDING_CLEARANCE_TOO_SMALL)"
        side_effects:
          - "approved_at := logical clock now"
          - "AuditEvent appended"
      - from: MEASURED
        to: REJECTED
        trigger: "POST /stairlift-ops/home-assessments/{id}/reject"
        actor: AssessmentReviewer
        preconditions:
          - "HomeAssessment.status == MEASURED"
        side_effects:
          - "AuditEvent appended"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system (cascade from creation of a new SCHEDULED assessment on the same Customer while one is already SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditEvent appended (event_kind='ASSESS_SUPERSEDED')"
      - from: MEASURED
        to: SUPERSEDED
        trigger: "system (cascade from creation of a new SCHEDULED assessment on the same Customer while one is MEASURED)"
        actor: system
        preconditions: []
        side_effects:
          - "Any DRAFT or ISSUED Quote whose home_assessment_id == this.id transitions to SUPERSEDED (cascade)"
          - "AuditEvent appended"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /stairlift-ops/quotes/{id}/issue"
        actor: SalesRep
        preconditions:
          - "Quote.status == DRAFT (ERR_INVALID_STATE)"
          - "Quote.home_assessment_id points to a HomeAssessment with status == APPROVED (ERR_ASSESSMENT_NOT_APPROVED)"
          - "ProductModel compatibility: if assessment.staircase_kind == CURVED then ProductModel.supports_curved == true; if assessment.has_outdoor_exposure then ProductModel.supports_outdoor == true (ERR_MODEL_INCOMPATIBLE)"
          - "No other Quote on the same Customer currently in ISSUED state (ERR_ACTIVE_QUOTE_EXISTS)"
        side_effects:
          - "issued_total_cents computed via issued_quote_total (forward_looking -> actuals swap)"
          - "issued_at := now; expires_at := now + QUOTE_TTL_DAYS"
          - "AuditEvent appended"
      - from: ISSUED
        to: DRAFT
        trigger: "POST /stairlift-ops/quotes/{id}/revise"
        actor: SalesRep
        preconditions:
          - "Quote.status == ISSUED (ERR_INVALID_STATE)"
          - "Quote.expires_at > now (ERR_QUOTE_EXPIRED)"
        side_effects:
          - "revision_number += 1"
          - "issued_total_cents cleared to 0"
          - "AuditEvent appended (cyclic revision loop)"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /stairlift-ops/quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Quote.status == ISSUED (ERR_INVALID_STATE)"
          - "Quote.expires_at > now (ERR_QUOTE_EXPIRED)"
          - "EquipmentUnit with id == request.equipment_unit_id exists AND has status == IN_STOCK AND model_code == Quote.model_code (ERR_UNIT_NOT_AVAILABLE)"
          - "OCC on Customer.version via expected_customer_version (ERR_STALE_VERSION)"
        side_effects:
          - "EquipmentUnit.status := RESERVED"
          - "Agreement created with mode := Quote.acquisition_mode, list_price_cents per mode rule, funding_applied_cents := 0, version_anchor_quote_revision := Quote.revision_number"
          - "AuditEvent appended"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (logical clock sweep: any ISSUED quote with expires_at <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditEvent appended (event_kind='QUOTE_EXPIRED')"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (cascade from parent HomeAssessment becoming SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (cascade from parent HomeAssessment becoming SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent appended"]

  - entity: Agreement
    initial_state: PENDING_FUNDING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING_FUNDING
        to: FUNDED
        trigger: "system (auto when sum(approved_cents across FundingApplications with status in {APPROVED, PARTIALLY_APPROVED}) >= list_price_cents after funding waterfall recompute)"
        actor: system
        preconditions: []
        side_effects:
          - "funding_applied_cents recomputed via funding_waterfall"
          - "Customer.lifetime_outstanding_cents recomputed"
          - "AuditEvent appended"
      - from: PENDING_FUNDING
        to: SCHEDULED
        trigger: "POST /stairlift-ops/agreements/{id}/skip-funding"
        actor: FundingOfficer
        preconditions:
          - "Agreement.status == PENDING_FUNDING"
          - "Customer has signed liability_waiver (Agreement.liability_waiver_signed == true) OR all FundingApplications on this Agreement's Quote are in {DENIED, WITHDRAWN} (ERR_PENDING_FUNDING_APPS)"
        side_effects:
          - "Customer.lifetime_outstanding_cents recomputed"
      - from: FUNDED
        to: SCHEDULED
        trigger: "POST /stairlift-ops/agreements/{id}/install-jobs (create InstallJob)"
        actor: InstallCoordinator
        preconditions:
          - "Agreement.status == FUNDED"
          - "No existing InstallJob on this Agreement in {SCHEDULED, IN_PROGRESS} (ERR_INSTALL_ALREADY_SCHEDULED)"
          - "Crew temporal-overlap rule (technician crew buffer; ERR_CREW_OVERLAP)"
          - "Equipment unit still RESERVED (ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "InstallJob created (status SCHEDULED)"
      - from: SCHEDULED
        to: INSTALLED
        trigger: "system (cascade when InstallJob transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "EquipmentUnit.status := INSTALLED"
          - "Customer.status := ACTIVE (if was PROSPECT)"
          - "AuditEvent appended"
      - from: INSTALLED
        to: ACTIVE
        trigger: "POST /stairlift-ops/agreements/{id}/activate"
        actor: InstallCoordinator
        preconditions:
          - "Agreement.status == INSTALLED"
          - "ServicePlan exists for this Agreement and ServicePlan.status == ACTIVE (ERR_SERVICE_PLAN_REQUIRED)"
        side_effects:
          - "If mode == RENTAL: EquipmentUnit.lifetime_rental_months increments by 1 on each subsequent logical-month rollover while ACTIVE"
          - "Customer.lifetime_outstanding_cents recomputed"
      - from: ACTIVE
        to: REMOVAL_REQUESTED
        trigger: "POST /stairlift-ops/agreements/{id}/removal-jobs (create RemovalJob)"
        actor: InstallCoordinator
        preconditions:
          - "Agreement.status == ACTIVE"
          - "If mode == RENTAL: paid_to_date_cents >= list_price_cents (rental must be fully paid before removal; ERR_RENTAL_BALANCE_OUTSTANDING)"
          - "If mode == PURCHASE: at least 30 days have elapsed since INSTALLED transition (cooling-off; ERR_REMOVAL_COOLING_OFF)"
          - "Crew temporal-overlap rule for RemovalJob (capacity-based rule; ERR_CREW_OVERLAP)"
        side_effects:
          - "RemovalJob created with buyback_offered_cents computed via buyback_offer"
      - from: REMOVAL_REQUESTED
        to: REMOVED
        trigger: "system (cascade when RemovalJob transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "EquipmentUnit.status := REMOVED, condition_grade := RemovalJob.condition_grade_at_removal"
          - "ServicePlan.status := CANCELLED (cascade)"
          - "Any WarrantyClaim in {SUBMITTED, UNDER_REVIEW, APPROVED} transitions to DENIED with denial_reason='AGREEMENT_REMOVED' (cascade)"
          - "Customer.lifetime_outstanding_cents recomputed"
      - from: REMOVED
        to: CLOSED
        trigger: "POST /stairlift-ops/agreements/{id}/close"
        actor: InstallCoordinator
        preconditions:
          - "Agreement.status == REMOVED"
          - "All WarrantyClaims on this Agreement are in terminal state {DENIED, PAID}"
        side_effects:
          - "If Customer has no other Agreement in {PENDING_FUNDING, FUNDED, SCHEDULED, INSTALLED, ACTIVE, REMOVAL_REQUESTED}: Customer.status := FORMER"
      - from: PENDING_FUNDING
        to: CANCELLED
        trigger: "POST /stairlift-ops/agreements/{id}/cancel"
        actor: FundingOfficer
        preconditions:
          - "Agreement.status in {PENDING_FUNDING, FUNDED, SCHEDULED}"
        side_effects:
          - "EquipmentUnit.status := IN_STOCK (compensating release)"
          - "All FundingApplications on Quote transition to WITHDRAWN"
          - "Customer.lifetime_outstanding_cents recomputed"
      - from: FUNDED
        to: CANCELLED
        trigger: "POST /stairlift-ops/agreements/{id}/cancel"
        actor: FundingOfficer
        preconditions: ["Agreement.status in {PENDING_FUNDING, FUNDED, SCHEDULED}"]
        side_effects:
          - "EquipmentUnit.status := IN_STOCK"
          - "All FundingApplications on Quote transition to WITHDRAWN"
          - "Customer.lifetime_outstanding_cents recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /stairlift-ops/agreements/{id}/cancel"
        actor: FundingOfficer
        preconditions: ["Agreement.status in {PENDING_FUNDING, FUNDED, SCHEDULED}"]
        side_effects:
          - "InstallJob in SCHEDULED transitions to CANCELLED"
          - "EquipmentUnit.status := IN_STOCK"
          - "FundingApplications -> WITHDRAWN"
          - "Customer.lifetime_outstanding_cents recomputed"

  - entity: InstallJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /stairlift-ops/install-jobs/{id}/start"
        actor: InstallCoordinator
        preconditions:
          - "InstallJob.status == SCHEDULED"
          - "Logical clock >= scheduled_start_utc (ERR_TOO_EARLY)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /stairlift-ops/install-jobs/{id}/complete"
        actor: InstallCoordinator
        preconditions:
          - "InstallJob.status == IN_PROGRESS"
          - "measured_labor_hours and installed_rail_length_m supplied"
        side_effects:
          - "Cascade: parent Agreement transitions SCHEDULED -> INSTALLED"
          - "Quote.issued_total_cents reconciled if installed_rail_length_m differs from Quote.valid_rail_length_m by > 0.5m (reconciliation variant)"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /stairlift-ops/install-jobs/{id}/fail"
        actor: InstallCoordinator
        preconditions: ["InstallJob.status == IN_PROGRESS"]
        side_effects:
          - "Parent Agreement remains SCHEDULED; a new InstallJob may be created"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /stairlift-ops/install-jobs/{id}/cancel"
        actor: InstallCoordinator
        preconditions: ["InstallJob.status == SCHEDULED"]
        side_effects: []

  - entity: FundingApplication
    initial_state: PENDING
    terminal_states: [APPROVED, PARTIALLY_APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /stairlift-ops/funding-applications/{id}/decide with decision=APPROVED"
        actor: FundingOfficer
        preconditions:
          - "FundingApplication.status == PENDING"
          - "decision_reason supplied"
          - "approved_cents == requested_cents (full approval)"
        side_effects:
          - "funding_waterfall recomputed on parent Quote -> parent Agreement.funding_applied_cents updated"
          - "If resulting funding_applied_cents >= Agreement.list_price_cents: Agreement PENDING_FUNDING -> FUNDED (auto)"
      - from: PENDING
        to: PARTIALLY_APPROVED
        trigger: "POST /stairlift-ops/funding-applications/{id}/decide with decision=PARTIALLY_APPROVED"
        actor: FundingOfficer
        preconditions:
          - "FundingApplication.status == PENDING"
          - "approved_cents > 0 AND approved_cents < requested_cents"
        side_effects: ["Same as APPROVED"]
      - from: PENDING
        to: DENIED
        trigger: "POST /stairlift-ops/funding-applications/{id}/decide with decision=DENIED"
        actor: FundingOfficer
        preconditions: ["FundingApplication.status == PENDING", "decision_reason supplied"]
        side_effects: ["funding_waterfall recomputed"]
      - from: PENDING
        to: WITHDRAWN
        trigger: "system (cascade from Agreement CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServicePlan
    initial_state: ACTIVE
    terminal_states: [LAPSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (logical clock sweep: Agreement in ACTIVE and next_service_due_utc < now - 90 days)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (cascade from Agreement REMOVED) OR POST /stairlift-ops/service-plans/{id}/cancel"
        actor: "system | InstallCoordinator"
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /stairlift-ops/warranty-claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions: ["WarrantyClaim.status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /stairlift-ops/warranty-claims/{id}/adjudicate with decision=APPROVED"
        actor: ClaimsAdjuster
        preconditions:
          - "WarrantyClaim.status == UNDER_REVIEW"
          - "ServicePlan.status == ACTIVE (ERR_SERVICE_PLAN_INACTIVE)"
          - "If Agreement.liability_waiver_signed == true AND claim_kind == WEAR_AND_TEAR: reject (ERR_WAIVER_BLOCKS_CLAIM)"
          - "claim_kind included in ServicePlan.tier coverage matrix (ERR_CLAIM_KIND_NOT_COVERED)"
          - "coverage_used_cents + claimed_cents <= coverage_cap_cents (ERR_COVERAGE_CAP_EXCEEDED)"
        side_effects:
          - "approved_cents := min(claimed_cents, coverage_cap_cents - coverage_used_cents)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /stairlift-ops/warranty-claims/{id}/adjudicate with decision=DENIED"
        actor: ClaimsAdjuster
        preconditions: ["WarrantyClaim.status == UNDER_REVIEW"]
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /stairlift-ops/warranty-claims/{id}/pay"
        actor: ClaimsAdjuster
        preconditions: ["WarrantyClaim.status == APPROVED"]
        side_effects:
          - "ServicePlan.coverage_used_cents += approved_cents (compensating invariant with cap)"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: DENIED
        trigger: "system (cascade from Agreement REMOVED)"
        actor: system
        preconditions: []
        side_effects: ["denial_reason := 'AGREEMENT_REMOVED'"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system (cascade from Agreement REMOVED)"
        actor: system
        preconditions: []
        side_effects: ["denial_reason := 'AGREEMENT_REMOVED'"]
      - from: APPROVED
        to: DENIED
        trigger: "system (cascade from Agreement REMOVED — compensating reversal)"
        actor: system
        preconditions: []
        side_effects: ["denial_reason := 'AGREEMENT_REMOVED'"]

  - entity: RemovalJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /stairlift-ops/removal-jobs/{id}/complete"
        actor: InstallCoordinator
        preconditions:
          - "RemovalJob.status == SCHEDULED"
          - "condition_grade_at_removal supplied"
        side_effects:
          - "Cascade: parent Agreement REMOVAL_REQUESTED -> REMOVED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /stairlift-ops/removal-jobs/{id}/cancel"
        actor: InstallCoordinator
        preconditions: ["RemovalJob.status == SCHEDULED"]
        side_effects:
          - "Parent Agreement reverts REMOVAL_REQUESTED -> ACTIVE (compensating transition)"

  - entity: EquipmentUnit
    initial_state: IN_STOCK
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STOCK
        to: RESERVED
        trigger: "system (cascade from Quote ISSUED -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: INSTALLED
        trigger: "system (cascade from Agreement SCHEDULED -> INSTALLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: IN_STOCK
        trigger: "system (compensating cascade from Agreement CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSTALLED
        to: IN_SERVICE
        trigger: "system (cascade from Agreement INSTALLED -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: REMOVED
        trigger: "system (cascade from Agreement REMOVAL_REQUESTED -> REMOVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REMOVED
        to: IN_STOCK
        trigger: "POST /stairlift-ops/equipment-units/{id}/restock (refurbished)"
        actor: InventoryManager
        preconditions:
          - "EquipmentUnit.status == REMOVED"
          - "condition_grade in {REFURB_A, REFURB_B}"
        side_effects: []
      - from: REMOVED
        to: RETIRED
        trigger: "POST /stairlift-ops/equipment-units/{id}/retire"
        actor: InventoryManager
        preconditions:
          - "EquipmentUnit.status == REMOVED"
          - "condition_grade in {REFURB_C, RETIRED}"
        side_effects: []

  - entity: Customer
    initial_state: PROSPECT
    terminal_states: [FORMER]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "system (cascade from first Agreement INSTALLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: FORMER
        trigger: "system (cascade from last Agreement CLOSED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-accept-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /stairlift-ops/quotes/{id}/accept"
    occ_field: "expected_customer_version"
    description: |
      Accepting a Quote against a Customer whose version has advanced since the client
      last observed it is rejected. Captures the case where a parallel workflow (e.g.,
      another Quote's accept cascade or a payment) has mutated Customer state — most
      notably Customer.lifetime_outstanding_cents — making this client's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: agreement-payment-stale-agreement
    parent_entity: Agreement
    write_endpoint: "POST /stairlift-ops/agreements/{id}/payments"
    occ_field: "expected_agreement_version"
    description: |
      Recording a payment against an Agreement whose version has advanced since the
      client last observed it is rejected. Captures the case where a funding decision
      (auto-FUNDED cascade) or a skip-funding transition has mutated the Agreement
      between the client's read and its payment POST.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: valid_rail_length
    trigger: "HomeAssessment SCHEDULED -> MEASURED"
    algorithm: constraint_propagation
    formula: |
      valid_rail_length_m = round_half_up( sqrt( (stair_rise_mm/1000)^2 + (stair_run_mm/1000)^2 ), 2 )
    input_set: "stair_rise_mm, stair_run_mm from the measuring HomeAssessment"
    constants:
      MM_PER_M: 1000
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: provisional_quote_total
    trigger: "Quote created (DRAFT)"
    algorithm: forward_looking
    formula: |
      If mode == PURCHASE:
        provisional_total_cents = ProductModel.base_purchase_price_cents
                                + ProductModel.install_labor_hours * LABOR_RATE_CENTS
      If mode == RENTAL:
        provisional_total_cents = ProductModel.monthly_rental_rate_cents * COMMITTED_RENTAL_MONTHS_DEFAULT
                                + ProductModel.install_labor_hours * LABOR_RATE_CENTS
      Where COMMITTED_RENTAL_MONTHS_DEFAULT = 6 (estimate only)
    input_set: "ProductModel by Quote.model_code; Quote.acquisition_mode"
    constants:
      LABOR_RATE_CENTS: 8500
      COMMITTED_RENTAL_MONTHS_DEFAULT: 6
    precision: "integer cents"
    variants:
      - name: issued_variant
        when: "Quote DRAFT -> ISSUED"
        difference: "Switches from catalog-price forward_looking to actuals-based: uses valid_rail_length_m for rail materials and a curved-stair multiplier; see issued_quote_total"

  - name: issued_quote_total
    trigger: "Quote DRAFT -> ISSUED"
    algorithm: tiered_pricing
    formula: |
      rail_cost_cents = round_half_up( valid_rail_length_m * RAIL_COST_PER_M_CENTS, 0 )
      If HomeAssessment.staircase_kind == CURVED:
        rail_cost_cents = round_half_up( rail_cost_cents * CURVED_MULTIPLIER, 0 )
      If HomeAssessment.has_outdoor_exposure:
        rail_cost_cents = rail_cost_cents + OUTDOOR_SEALING_CENTS
      If mode == PURCHASE:
        base = ProductModel.base_purchase_price_cents
      If mode == RENTAL:
        base = ProductModel.monthly_rental_rate_cents * COMMITTED_RENTAL_MONTHS_DEFAULT
      issued_total_cents = base
                         + rail_cost_cents
                         + ProductModel.install_labor_hours * LABOR_RATE_CENTS
    input_set: "Quote + parent HomeAssessment + ProductModel"
    constants:
      RAIL_COST_PER_M_CENTS: 22000
      CURVED_MULTIPLIER: 1.35
      OUTDOOR_SEALING_CENTS: 45000
      LABOR_RATE_CENTS: 8500
      COMMITTED_RENTAL_MONTHS_DEFAULT: 6
    precision: "integer cents; nested rounding pinned: round rail_cost FIRST to cents, then add"
    variants: []

  - name: funding_waterfall
    trigger: "FundingApplication decide; Agreement cancel cascade"
    algorithm: waterfall_allocation
    formula: |
      eligible_apps = FundingApplications on Quote with status in {APPROVED, PARTIALLY_APPROVED}
      sort eligible_apps by priority_rank ASC, then created_at ASC (never by id)
      remaining = Agreement.list_price_cents
      funding_applied_cents = 0
      for app in eligible_apps (sorted):
        allocation = min(app.approved_cents, remaining)
        funding_applied_cents += allocation
        remaining -= allocation
        if remaining == 0: break
      Agreement.funding_applied_cents = funding_applied_cents
      If funding_applied_cents >= Agreement.list_price_cents AND Agreement.status == PENDING_FUNDING:
        Agreement auto-transitions PENDING_FUNDING -> FUNDED
    input_set: "FundingApplication rows where quote_id == Agreement.quote_id AND status in {APPROVED, PARTIALLY_APPROVED}"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: buyback_offer
    trigger: "RemovalJob created (Agreement ACTIVE -> REMOVAL_REQUESTED)"
    algorithm: decay_function
    formula: |
      base = ProductModel.base_purchase_price_cents (catalog at time of removal)
      # Two variants produce different offers:
      # straight_line: base * max(0, 1 - (months_installed / 120)) * CONDITION_FACTOR[grade_at_removal]
      # market_adjusted: base * (0.85 ^ years_installed) * CONDITION_FACTOR[grade_at_removal] * REGION_DEMAND_FACTOR[customer.home_region_code]
      # Scaffold pins: variant selected per Agreement.mode
      #   RENTAL -> straight_line
      #   PURCHASE -> market_adjusted
      # months_installed = whole months between Agreement INSTALLED transition timestamp and RemovalJob.created_at
      # years_installed = months_installed / 12 (floating)
      # Evaluation order pinned: compute depreciation first, then multiply condition factor, then region factor (market_adjusted only).
    input_set: "Agreement, EquipmentUnit, ProductModel, Customer.home_region_code"
    constants:
      CONDITION_FACTOR:
        REFURB_A: 0.85
        REFURB_B: 0.65
        REFURB_C: 0.35
        RETIRED: 0.0
      REGION_DEMAND_FACTOR:
        NORTH: 1.10
        SOUTH: 0.95
        EAST: 1.00
        WEST: 1.05
      USEFUL_LIFE_MONTHS: 120
      MARKET_YEARLY_RETENTION: 0.85
    precision: "integer cents, round_half_up after full multiplication chain"
    variants:
      - name: straight_line
        when: "Agreement.mode == RENTAL"
        difference: "Linear decay over 120-month useful life; offer can reach 0"
      - name: market_adjusted
        when: "Agreement.mode == PURCHASE"
        difference: "Geometric decay by year (0.85 ^ years) with regional demand multiplier; never reaches 0"

  - name: service_plan_fee
    trigger: "ServicePlan created"
    algorithm: weighted_scoring
    formula: |
      # Tier base fee
      base_fee = TIER_BASE_CENTS[tier]
      # Risk adders: each factor contributes an additive percentage
      risk_adders_pct = 0
      if HomeAssessment.has_outdoor_exposure: risk_adders_pct += 0.15
      if HomeAssessment.staircase_kind == CURVED: risk_adders_pct += 0.20
      if EquipmentUnit.condition_grade in {REFURB_B, REFURB_C}: risk_adders_pct += 0.10
      # Waiver interplay (dual variant):
      if Agreement.liability_waiver_signed == true:
        # waiver-discounted variant: 15% discount on final fee, BUT we apply it AFTER
        # risk adders and round differently
        monthly_fee_cents = round_half_up( base_fee * (1 + risk_adders_pct) * 0.85, 0 )
      else:
        monthly_fee_cents = round_half_up( base_fee * (1 + risk_adders_pct), 0 )
      # coverage_cap
      coverage_cap_cents = TIER_CAP_CENTS[tier]
    input_set: "ServicePlan.tier, parent Agreement, parent Quote -> HomeAssessment, Agreement.equipment_unit_id -> EquipmentUnit"
    constants:
      TIER_BASE_CENTS:
        BASIC: 2900
        STANDARD: 4900
        PREMIUM: 7900
      TIER_CAP_CENTS:
        BASIC: 50000
        STANDARD: 150000
        PREMIUM: 400000
    precision: "integer cents, round_half_up at final step"
    variants:
      - name: waiver_discounted
        when: "Agreement.liability_waiver_signed == true"
        difference: "Applies 15% discount but disallows WEAR_AND_TEAR claims; discount applied AFTER risk adders (order pinned)"

  - name: customer_outstanding_rollup
    trigger: "Any transition on Agreement status or funding_applied_cents / paid_to_date_cents change"
    algorithm: aggregation
    formula: |
      Customer.lifetime_outstanding_cents =
        sum over Agreement where customer_id == Customer.id
          AND Agreement.status in {ACTIVE, REMOVAL_REQUESTED}
          of (Agreement.list_price_cents - Agreement.funding_applied_cents - Agreement.paid_to_date_cents)
      Floor at 0.
    input_set: "Agreements for Customer in {ACTIVE, REMOVAL_REQUESTED} only"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: crew_temporal_conflict_install
    trigger: "POST /stairlift-ops/agreements/{id}/install-jobs AND POST /stairlift-ops/agreements/{id}/removal-jobs"
    algorithm: interval_merge
    formula: |
      # InstallJob: same-crew bookings must have a 60-minute BUFFER between them.
      # Half-open intervals [start, end) extended by 60 min on both sides.
      proposed = [scheduled_start_utc - 60min, scheduled_end_utc + 60min)
      for each existing InstallJob j where j.technician_crew_id == proposed_crew
            AND j.status in {SCHEDULED, IN_PROGRESS}:
        existing = [j.scheduled_start_utc - 60min, j.scheduled_end_utc + 60min)
        if proposed overlaps existing (half-open): reject ERR_CREW_OVERLAP
      # Adjacent jobs where one's end == other's start are allowed WITHOUT buffer
      # only if exactly equal; otherwise the 60-minute buffer applies.
    input_set: "InstallJob rows by technician_crew_id with status in {SCHEDULED, IN_PROGRESS}"
    constants:
      INSTALL_BUFFER_MINUTES: 60
    precision: "UTC timestamps, minute granularity"
    variants: []

  - name: crew_temporal_conflict_removal
    trigger: "POST /stairlift-ops/agreements/{id}/removal-jobs"
    algorithm: interval_merge
    formula: |
      # RemovalJob: different semantic — DAILY CAPACITY rule, not buffer.
      # A crew may perform at most 2 removals per calendar day (UTC), regardless of timing.
      proposed_day = date(scheduled_start_utc) in UTC
      count = count of RemovalJob r where r.technician_crew_id == proposed_crew
              AND r.status == SCHEDULED
              AND date(r.scheduled_start_utc) == proposed_day
      if count >= 2: reject ERR_CREW_OVERLAP
    input_set: "RemovalJob rows by technician_crew_id with status == SCHEDULED"
    constants:
      REMOVAL_DAILY_CAPACITY: 2
    precision: "UTC calendar day boundary"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role in X-User-Role is permitted to invoke this endpoint"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated ids resolve left-to-right; each FK in payload resolves"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested / FK-bearing endpoints"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "On /home-assessments/{id}/approve: geometric & safety rules — stair width >= model minimum, electrical outlet within 2m (unless OUTDOOR), landing clearance >= 500mm"
    error_id: "ERR_STAIR_TOO_NARROW | ERR_NO_POWER_SOURCE | ERR_LANDING_CLEARANCE_TOO_SMALL"
    http_status: 422
    applies_to: "POST /stairlift-ops/home-assessments/{id}/approve"

  - priority: 6
    category: business_safety
    check: "On WarrantyClaim adjudicate: liability_waiver_signed blocks WEAR_AND_TEAR claims"
    error_id: ERR_WAIVER_BLOCKS_CLAIM
    http_status: 422
    applies_to: "POST /stairlift-ops/warranty-claims/{id}/adjudicate"

  - priority: 7
    category: business_constraint
    check: "ProductModel compatibility with assessment (curved support, outdoor rating) on Quote issue"
    error_id: ERR_MODEL_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /stairlift-ops/quotes/{id}/issue"

  - priority: 8
    category: business_constraint
    check: "Uniqueness: only one ISSUED Quote per Customer at any time; only one active InstallJob per Agreement"
    error_id: "ERR_ACTIVE_QUOTE_EXISTS | ERR_INSTALL_ALREADY_SCHEDULED"
    http_status: 409
    applies_to: "POST /stairlift-ops/quotes/{id}/issue, POST /stairlift-ops/agreements/{id}/install-jobs"

  - priority: 9
    category: business_temporal
    check: "Temporal: Quote not expired; InstallJob not starting too early; RemovalJob respects cooling-off (PURCHASE)"
    error_id: "ERR_QUOTE_EXPIRED | ERR_TOO_EARLY | ERR_REMOVAL_COOLING_OFF"
    http_status: 409
    applies_to: "Quote accept/revise, InstallJob start, RemovalJob create"

  - priority: 10
    category: business_temporal
    check: "Crew temporal-overlap rules (buffer for installs, daily-capacity for removals)"
    error_id: ERR_CREW_OVERLAP
    http_status: 409
    applies_to: "POST /stairlift-ops/agreements/{id}/install-jobs, POST /stairlift-ops/agreements/{id}/removal-jobs"

  - priority: 11
    category: business_referential
    check: "Equipment unit availability and model match on Quote accept; unit still RESERVED on InstallJob create"
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /stairlift-ops/quotes/{id}/accept, POST /stairlift-ops/agreements/{id}/install-jobs"

  - priority: 12
    category: business_fiscal
    check: "Rental balance fully paid before RemovalJob create; ServicePlan active before Agreement activation"
    error_id: "ERR_RENTAL_BALANCE_OUTSTANDING | ERR_SERVICE_PLAN_REQUIRED | ERR_PENDING_FUNDING_APPS"
    http_status: 402
    applies_to: "POST /stairlift-ops/agreements/{id}/removal-jobs, POST /stairlift-ops/agreements/{id}/activate, POST /stairlift-ops/agreements/{id}/skip-funding"

  - priority: 13
    category: business_fiscal
    check: "WarrantyClaim fiscal: ServicePlan.status == ACTIVE, claim kind covered by tier, coverage cap not exceeded"
    error_id: "ERR_SERVICE_PLAN_INACTIVE | ERR_CLAIM_KIND_NOT_COVERED | ERR_COVERAGE_CAP_EXCEEDED"
    http_status: 402
    applies_to: "POST /stairlift-ops/warranty-claims/{id}/adjudicate"

  - priority: 14
    category: business_fiscal
    check: "OCC optimistic concurrency on Customer and Agreement version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /stairlift-ops/quotes/{id}/accept, POST /stairlift-ops/agreements/{id}/payments"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/stairlift-ops/_clock/set_current_utc"
    description: "Set logical clock to the given ISO8601 UTC timestamp. Server startup default time is 2026-05-01T00:00:00Z; before any set call, the logical clock reads exactly this default and MUST NOT fall back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["Trigger logical-time sweeps: quote expiry, ServicePlan lapse"]

  # --- Customer ---
  - method: POST
    path: "/stairlift-ops/customers"
    description: "Register a new Customer"
    roles: [PlatformAdmin, SalesRep]
    code: 201
    input: [full_name, date_of_birth, home_region_code]
    output: Customer
    side_effects: ["status := PROSPECT, lifetime_outstanding_cents := 0"]

  - method: GET
    path: "/stairlift-ops/customers"
    description: "List Customers"
    roles: [PlatformAdmin, SalesRep, Assessor, AssessmentReviewer, FundingOfficer, InstallCoordinator, InventoryManager, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/stairlift-ops/customers/{id}"
    description: "Get a Customer"
    roles: [PlatformAdmin, SalesRep, Assessor, AssessmentReviewer, FundingOfficer, InstallCoordinator, InventoryManager, ClaimsAdjuster, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- HomeAssessment ---
  - method: POST
    path: "/stairlift-ops/customers/{id}/home-assessments"
    description: "Schedule a HomeAssessment"
    roles: [SalesRep, Assessor]
    code: 201
    input: [scheduled_date]
    output: HomeAssessment
    side_effects: ["Any prior SCHEDULED or MEASURED assessment on this Customer -> SUPERSEDED (cascade; also supersedes any DRAFT/ISSUED Quote referencing it)"]

  - method: GET
    path: "/stairlift-ops/customers/{id}/home-assessments"
    description: "List HomeAssessments for Customer"
    roles: [PlatformAdmin, SalesRep, Assessor, AssessmentReviewer, InstallCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "HomeAssessment[]"
    side_effects: []

  - method: GET
    path: "/stairlift-ops/home-assessments/{id}"
    description: "Get a HomeAssessment"
    roles: [PlatformAdmin, SalesRep, Assessor, AssessmentReviewer, InstallCoordinator]
    code: 200
    input: []
    output: HomeAssessment
    side_effects: []

  - method: POST
    path: "/stairlift-ops/home-assessments/{id}/measure"
    description: "Submit measurements (SCHEDULED -> MEASURED)"
    roles: [Assessor]
    code: 200
    input: [staircase_kind, stair_rise_mm, stair_run_mm, stair_width_mm, landing_clearance_mm, has_outdoor_exposure, electrical_outlet_within_2m]
