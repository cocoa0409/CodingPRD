    output: ClubBuildSpec
    side_effects: []
  - method: GET
    path: /golf-shop/build-specs
    description: "List build specs"
    roles: [ShopManager, FittingSpecialist, Customer]
    code: 200
    input: ["customer_id?", "fitting_session_id?", "status?", "head_item_id?", "shaft_item_id?", "grip_item_id?", "limit?", "offset?"]
    output: ClubBuildSpec[]
    side_effects: []
  - method: POST
    path: /golf-shop/build-specs/{id}/quote
    description: "DRAFT -> QUOTED or QUOTED -> QUOTED re-quote (supersedes prior quote); OCC-guarded"
    roles: [FittingSpecialist]
    code: 200
    input: [expected_build_spec_version]
    output: ClubBuildSpec
    side_effects: ["provisional_quote_cents recomputed via calculations.build_provisional_quote; increments ClubBuildSpec.version by 1"]
  - method: POST
    path: /golf-shop/build-specs/{id}/approve
    description: "QUOTED -> ORDERED; computes final price, creates ComponentOrder, runs allocation sweep, takes CREDIT payment"
    roles: [Customer]
    code: 200
    input: [payment_method]
    output: ClubBuildSpec
    side_effects:
      - "final_price_cents via calculations.build_final_price"
      - "ComponentOrder created PENDING_ALLOCATION, then allocation sweep runs; spec may advance to IN_BUILD in the same request"
      - "CREDIT payment: CreditLedgerEntry(-final_price_cents, BUILD_PAYMENT); customer balance recomputed"
      - "increments ClubBuildSpec.version by 1"
  - method: POST
    path: /golf-shop/build-specs/{id}/cancel
    description: "DRAFT|QUOTED|ORDERED|IN_BUILD -> CANCELLED; releases allocations (triggers sweep), refunds CREDIT payment"
    roles: [Customer, FittingSpecialist]
    code: 200
    input: []
    output: ClubBuildSpec
    side_effects: ["ComponentOrder -> CANCELLED with stock release; allocation sweep; CREDIT refund ledger entry; increments ClubBuildSpec.version"]
