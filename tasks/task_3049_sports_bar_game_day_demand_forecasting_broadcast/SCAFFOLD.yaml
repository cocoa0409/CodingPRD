# =============================================================================
# Scaffold: Sports Bar Game-Day Demand Forecasting & Broadcast Licensing
# Difficulty: much-harder-than-expert (per caller instruction)
# =============================================================================

scenario: |
  Sports Bar Game-Day Demand Forecasting & Broadcast Licensing (Buffalo Wild Wings):
  event calendar ingestion of professional and college schedules to forecast traffic
  and wing consumption, commercial broadcast package licensing with per-venue fees
  and blackout compliance, screen and audio zoning to serve multiple simultaneous
  events with guest requests, wing supply and pricing volatility with promotional
  day pricing and portion controls, guest wait-list management around kickoff spikes
  with table-hold policies, fantasy and trivia promotion registration and prize
  handling, staffing surge for tournament weekends and title fights, pay-per-view
  event pricing and cover charge handling.

domain_name: sports-bar-game-day
api_prefix: /api

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - derived_field_reconciliation
    - rate_threshold_triggers
    - selector_policy
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: market_zip, type: string, source: input, description: "Postal code of the venue market" }
      - { name: capacity_seats, type: integer, source: input, description: "Total guest seats on the floor" }
      - { name: wing_cost_cents_per_lb, type: integer, source: input, description: "Current wing supply cost per pound in cents" }
      - { name: volatility_score, type: number, source: computed, description: "abs(wing_cost_cents_per_lb - 180) / 180, recomputed on wing-cost update" }
      - { name: version, type: integer, source: system, description: "OCC version, increments on every mutation" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: kind, type: enum, source: input, description: "BASE | OVERLAY | PPV", constraints: "BASE | OVERLAY | PPV" }
      - { name: league, type: enum, source: input, description: "FF_NFL | FF_NBA | MLB | NHL | NCAA | MMA | BOXING | ENTERTAINMENT", constraints: "FF_NFL | FF_NBA | MLB | NHL | NCAA | MMA | BOXING | ENTERTAINMENT" }
      - { name: title, type: string, source: input, description: "Human-readable event title" }
      - { name: home_market_zip, type: string, source: input, description: "Postal code of the home market; used for blackout distance" }
      - { name: expected_attendance, type: integer, source: input, description: "Forecast gross attendance for this event at any venue" }
      - { name: lift_pct, type: number, source: input, description: "OVERLAY only: fractional lift applied to overlapping base events; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "INGESTED | CANCELLED", constraints: "INGESTED | CANCELLED" }
      - { name: scheduled_start, type: datetime, source: input, description: "Event start (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Event end (UTC); must be after scheduled_start" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: BroadcastLicense
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: league, type: enum, source: input, description: "FF_NFL | FF_NBA | MLB | NHL | NCAA | MMA | BOXING | ENTERTAINMENT" }
      - { name: blackout_radius_miles, type: integer, source: input, description: "Blackout radius around home_market_zip; NCAA default enforcement uses 75" }
      - { name: fee_per_head_cents, type: integer, source: input, description: "Per-head license fee for BASE package events" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | TERMINATED", constraints: "PENDING | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Zone
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: name, type: string, source: input, description: "Zone name (e.g. Main Bar, Patio)" }
      - { name: screen_ids, type: array, source: input, description: "Array of screen identifier strings in this zone" }
      - { name: primary_event_id, type: string, source: computed, description: "FK -> Event.id; event with highest expected_attendance among events with an ACTIVE assignment in this zone; null when none", default: null }
      - { name: posture, type: enum, source: computed, description: "OPEN | FULL | BLACKOUT_LOCKED; recomputed whenever assignments, primary event, or blackout state change", constraints: "OPEN | FULL | BLACKOUT_LOCKED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ScreenAssignment
    parent: Zone
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: zone_id, type: string, source: input, description: "FK -> Zone.id" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: screen_id, type: string, source: input, description: "One of Zone.screen_ids" }
      - { name: audio_enabled, type: boolean, source: input, description: "Whether zone audio follows this screen" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; home venue of the guest" }
      - { name: name, type: string, source: input, description: "Guest name" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: no_show_count, type: integer, source: computed, description: "Number of expired waits; increments on expiry, decrements on redemption" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: WaitlistEntry
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: party_size, type: integer, source: input, description: "Guests in the party" }
      - { name: status, type: enum, source: system, description: "WAITING | CALLED | SEATED | EXPIRED | CANCELLED", constraints: "WAITING | CALLED | SEATED | EXPIRED | CANCELLED" }
      - { name: called_at, type: datetime, source: system, description: "Timestamp when the party was called; null until CALLED", default: null }
      - { name: kickoff_override, type: boolean, source: input, description: "Extends table-hold from 15 to 25 minutes when within 30 minutes before a kickoff", default: false }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Check
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: party_size, type: integer, source: input, description: "Guests on the check" }
      - { name: guest_count, type: integer, source: input, description: "Head-count used for PPV cover charge; defaults to party_size" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; required only when kind is PPV", default: null }
      - { name: kind, type: enum, source: input, description: "REGULAR | PPV", constraints: "REGULAR | PPV", default: REGULAR }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED | VOIDED", constraints: "OPEN | SETTLED | VOIDED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of non-VOID OrderLine.line_total_cents" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * 0.05), computed at settle" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents + cover charge" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: OrderLine
    parent: Check
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: check_id, type: string, source: input, description: "FK -> Check.id" }
      - { name: kind, type: enum, source: input, description: "TRADITIONAL | BONELESS", constraints: "TRADITIONAL | BONELESS" }
      - { name: portion_count, type: integer, source: input, description: "Number of portions; one portion = 10 wings" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Price per wing after promo overlay and surcharge multiplier, rounded half-up per unit before multiplication" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * portion_count * 10 * quantity-tier multiplier, rounded per line" }
      - { name: status, type: enum, source: system, description: "OPEN | VOID", constraints: "OPEN | VOID" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: PromoRule
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: day_of_week, type: integer, source: input, description: "0=Monday .. 6=Sunday; promo applies on this weekday" }
      - { name: wing_kind, type: enum, source: input, description: "TRADITIONAL | BONELESS" }
      - { name: promo_price_cents_per_10, type: integer, source: input, description: "Promotional price per 10 wings" }
      - { name: portion_size, type: integer, source: system, description: "Fixed at 10 wings per portion", default: 10 }
      - { name: start_date, type: datetime, source: input, description: "First date the promo applies (UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Last date the promo applies (UTC); must be on or after start_date" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: StaffingPlan
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: name, type: string, source: input, description: "Plan label" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED", constraints: "DRAFT | PUBLISHED | LOCKED" }
      - { name: foh_required, type: integer, source: computed, description: "Sum over shifts of ceil(expected_covers_i * 0.4 / 60)" }
      - { name: boh_required, type: integer, source: computed, description: "Sum over shifts of ceil(expected_covers_i * 0.4 / 100)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Shift
    parent: StaffingPlan
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: plan_id, type: string, source: input, description: "FK -> StaffingPlan.id" }
      - { name: role, type: enum, source: input, description: "FOH | BOH", constraints: "FOH | BOH" }
      - { name: start_time, type: datetime, source: input, description: "Shift start (UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Shift end (UTC); must be after start_time" }
      - { name: headcount, type: integer, source: input, description: "Scheduled headcount" }
      - { name: expected_covers, type: integer, source: input, description: "Expected covers this shift serves; drives staffing formula" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

  - name: TriviaSession
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: title, type: string, source: input, description: "Session title" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | SETTLED", constraints: "OPEN | CLOSED | SETTLED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: TriviaEntry
    parent: TriviaSession
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: session_id, type: string, source: input, description: "FK -> TriviaSession.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: points, type: integer, source: computed, description: "100 per correct answer + speed bonus + streak bonus" }
      - { name: correct_count, type: integer, source: computed, description: "Number of answers with is_correct=true" }
      - { name: consecutive_correct, type: integer, source: computed, description: "Current streak of correct answers in submission order; resets to 0 on an incorrect answer" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

  - name: FantasyContest
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Entry fee per registration" }
      - { name: rake_pct, type: number, source: input, description: "House rake fraction (e.g. 0.10)" }
      - { name: prize_structure, type: array, source: input, description: "Array of winner share fractions that must sum to 1.0 exactly (e.g. [0.5, 0.333333, 0.166667])" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | LOCKED | SETTLED | CANCELLED", constraints: "DRAFT | OPEN | LOCKED | SETTLED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: FantasyEntry
    parent: FantasyContest
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: contest_id, type: string, source: input, description: "FK -> FantasyContest.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: lineup, type: object, source: input, description: "Submitted lineup payload" }
      - { name: prize_cents, type: integer, source: computed, description: "Prize awarded at settlement; 0 until settled", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }

  - name: PpvEvent
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; must reference an Event with kind=PPV" }
      - { name: commercial_fee_cents, type: integer, source: input, description: "Flat commercial license fee for the fight card" }
      - { name: cover_charge_cents, type: integer, source: input, description: "Per-guest cover charge" }
      - { name: capacity_posture_cents, type: integer, source: computed, description: "Projected PPV revenue: guest_count_total * (commercial_fee_cents * 1.20 + cover_charge_cents)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: BroadcastLicense
    field: status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /api/licenses/{license_id}/activate"
        actor: VenueManager
        preconditions:
          - "Venue exists"
          - "No other ACTIVE license for the same (venue_id, league)"
        side_effects:
          - "venue.updated_at refreshed"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/licenses/{license_id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Zones with a primary event of this league recompute posture (blackout may re-apply)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/licenses/{license_id}/activate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: [PENDING, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "POST /api/licenses/{license_id}/terminate"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "Zones whose primary event belongs to this league drop the assignment; posture recomputed to OPEN"

  - entity: Zone
    field: posture
    initial_state: OPEN
    terminal_states: []
    note: "Compound/derived machine: posture = f(assignments, primary event, blackout)"
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (recompute after assignment or event change)"
        actor: system
        preconditions:
          - "primary_event_id is not null"
          - "Event[primary_event_id].expected_attendance >= Venue.capacity_seats"
          - "No blackout window is active for the primary event's league"
        side_effects:
          - "Waitlist join blocked for this venue's zones while ALL zones are FULL"
      - from: [OPEN, FULL]
        to: BLACKOUT_LOCKED
        trigger: "system (blackout window opens: current time within [start-30m, end+60m] of a non-PPV event of this league and venue is inside radius)"
        actor: system
        preconditions:
          - "BroadcastLicense for the league is ACTIVE"
          - "Venue market_zip is within blackout_radius_miles of the event home_market_zip"
          - "Zone currently shows that event (primary or audio)"
        side_effects:
          - "ScreenAssignments for the blacked-out event are removed"
          - "primary_event_id recomputed among remaining assignments"
      - from: BLACKOUT_LOCKED
        to: OPEN
        trigger: "system (blackout window closes)"
        actor: system
        preconditions:
          - "Current time > blacked-out event scheduled_end + 60 minutes"
        side_effects:
          - "Zone accepts new assignments again"
      - from: FULL
        to: OPEN
        trigger: "system (primary event removed or expected_attendance drops below capacity)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WaitlistEntry
    field: status
    initial_state: WAITING
    terminal_states: [SEATED, EXPIRED, CANCELLED]
    transitions:
      - from: WAITING
        to: CALLED
        trigger: "POST /api/waitlist/{entry_id}/call"
        actor: Host
        preconditions:
          - "Entry is the first WAITING entry by created_at ASC (skip-guard)"
        side_effects:
          - "called_at = now"
      - from: CALLED
        to: SEATED
        trigger: "POST /api/waitlist/{entry_id}/seat"
        actor: Host
        preconditions:
          - "now <= called_at + hold_minutes (15, or 25 when kickoff_override)"
        side_effects:
          - "guest.no_show_count decremented if > 0 (redemption)"
      - from: CALLED
        to: EXPIRED
        trigger: "system (hold timer elapses)"
        actor: system
        preconditions:
          - "now > called_at + hold_minutes"
        side_effects:
          - "guest.no_show_count incremented"
          - "If guest.no_show_count reaches 3, future joins rejected with ERR_TOO_MANY_NO_SHOWS"
      - from: [WAITING, CALLED]
        to: CANCELLED
        trigger: "POST /api/waitlist/{entry_id}/cancel"
        actor: Host
        preconditions: []
        side_effects:
          - "If CALLED, hold released immediately (no no-show penalty)"

  - entity: Check
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /api/checks/{check_id}/settle"
        actor: Server
        preconditions:
          - "Check has at least one OPEN OrderLine OR kind=PPV (cover-only check allowed)"
        side_effects:
          - "tax_cents = round_half_up(subtotal_cents * 0.05)"
          - "total_cents = subtotal_cents + tax_cents + cover"
      - from: OPEN
        to: VOIDED
        trigger: "POST /api/checks/{check_id}/void"
        actor: VenueManager
        preconditions:
          - "All OrderLines already VOID"
        side_effects:
          - "subtotal_cents, tax_cents, total_cents zeroed"

  - entity: OrderLine
    field: status
    initial_state: OPEN
    terminal_states: [VOID]
    transitions:
      - from: OPEN
        to: VOID
        trigger: "POST /api/order-lines/{line_id}/void"
        actor: Server
        preconditions:
          - "Parent Check.status == OPEN"
        side_effects:
          - "Check.subtotal_cents recomputed excluding this line"

  - entity: StaffingPlan
    field: status
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/staffing-plans/{plan_id}/publish"
        actor: VenueManager
        preconditions:
          - "Plan has at least one Shift"
          - "foh_required and boh_required > 0"
        side_effects: []
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /api/staffing-plans/{plan_id}/revert"
        actor: VenueManager
        preconditions:
          - "No shift has started yet (all shift start_time > now)"
        side_effects:
          - "Plan editable again; staffing formulas recomputed on next shift change"
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /api/staffing-plans/{plan_id}/lock"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "Shifts immutable"

  - entity: TriviaSession
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/trivia-sessions/{session_id}/close"
        actor: Host
        preconditions: []
        side_effects:
          - "Answers frozen; entries ranked by points DESC, entry.created_at ASC, then guest.created_at ASC"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /api/trivia-sessions/{session_id}/settle"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "Prizes assigned by rank; ties share the rank"

  - entity: FantasyContest
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/fantasy-contests/{contest_id}/open"
        actor: VenueManager
        preconditions:
          - "prize_structure sums to 1.0 within 0.001 tolerance"
        side_effects: []
      - from: OPEN
        to: LOCKED
        trigger: "POST /api/fantasy-contests/{contest_id}/lock"
        actor: VenueManager
        preconditions:
          - "At least one FantasyEntry registered"
        side_effects:
          - "Entries frozen"
      - from: LOCKED
        to: SETTLED
        trigger: "POST /api/fantasy-contests/{contest_id}/settle"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "gross = entry_count * entry_fee_cents"
          - "rake = floor(gross * rake_pct)"
          - "distributable = gross - rake"
          - "Each winner receives floor(distributable * share); remainders allocated by created_at ASC"
      - from: [DRAFT, OPEN]
        to: CANCELLED
        trigger: "POST /api/fantasy-contests/{contest_id}/cancel"
        actor: VenueManager
        preconditions: []
        side_effects:
          - "All entries voided; no prizes"

  - entity: Event
    field: status
    initial_state: INGESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: INGESTED
        to: CANCELLED
        trigger: "POST /api/events/{event_id}/cancel"
        actor: Scheduler
        preconditions: []
        side_effects:
          - "ScreenAssignments referencing this event are removed"
          - "Zones recompute primary_event_id and posture"
          - "Forecasts recompute excluding this event"

# =============================================================================
# §1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: fantasy-settle-stale-contest
    parent_entity: FantasyContest
    write_endpoint: "POST /api/fantasy-contests/{contest_id}/settle"
    occ_field: "expected_fantasy_contest_version"
    description: |
      Settling a FantasyContest against a version the client has already seen
      advance (e.g. another registration or a rake correction bumped the version)
      is rejected. The loser is told its view of the contest is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: waitlist-seat-stale-entry
    parent_entity: WaitlistEntry
    write_endpoint: "POST /api/waitlist/{entry_id}/seat"
    occ_field: "expected_waitlist_entry_version"
    description: |
      Seating a WaitlistEntry against a stale version is rejected. A prior
      expiry, cancel, or another seat attempt advanced the entry's version;
      the second sequential request observes the bumped version and fails.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: wing_prep_forecast
    trigger: "GET /api/venues/{venue_id}/forecasts/wing-prep"
    algorithm: forward_looking
    formula: |
      window = [date 14:00 UTC, date+2 14:00 UTC)
      base = sum(expected_attendance of Event with kind=BASE, status=INGESTED,
                 scheduled_start within window)
      overlay = sum(overlapping_base.expected_attendance * overlay.lift_pct
                    for OVERLAY events with status=INGESTED that temporally
                    overlap a BASE event in the window; if an OVERLAY overlaps
                    several BASE events it applies to the one with the highest
                    expected_attendance, tie-break by scheduled_start ASC)
      gross = base + overlay
      dine_in = floor(gross * 0.70)
      wing_eaters = floor(dine_in * 0.40)
      required_pieces = wing_eaters * 15
      If venue.volatility_score > 0.25, flag shortage_risk=true
    input_set: "Events with status=INGESTED only; CANCELLED excluded"
    constants:
      DINE_IN_SHARE: 0.70
      WING_EATER_SHARE: 0.40
      PIECES_PER_PERSON: 15
      WINDOW_START_HOUR_UTC: 14
      WINDOW_HOURS: 48
      VOLATILITY_RISK_THRESHOLD: 0.25
    precision: "integer pieces"
    variants:
      - name: with_overlay
        when: "OVERLAY events present in window"
        difference: "Includes lift_pct uplift on the overlapped BASE event"
      - name: without_overlay
        when: "No OVERLAY events in window"
        difference: "gross = base only"

  - name: wing_price_quote
    trigger: "POST /api/venues/{venue_id}/wing-pricing/quote"
    algorithm: tiered_pricing
    formula: |
      promo = PromoRule matching wing_kind where day_of_week == weekday(event_date)
              and start_date <= event_date <= end_date
      base_unit_cents = promo ? promo.promo_price_cents_per_10 / 10 : 150
      quantity_multiplier = pieces >= 50 ? 0.95 : 1.0
      last_30d = sum(pieces ordered by guest at venue in prior 30 days)
      surcharge = last_30d > 5000 ? 1.10 : 1.0
      quote_cents = round_half_up(base_unit_cents * pieces * quantity_multiplier * surcharge)
    input_set: "Settled checks only for the 30-day lookback"
    constants:
      BASE_UNIT_CENTS: 150
      QUANTITY_TIER_THRESHOLD: 50
      QUANTITY_TIER_MULTIPLIER: 0.95
      SURCHARGE_LOOKBACK_DAYS: 30
      SURCHARGE_THRESHOLD_PIECES: 5000
      SURCHARGE_MULTIPLIER: 1.10
    precision: "2 decimal places, round_half_up"
    variants:
      - name: promo_applied
        when: "Matching PromoRule found for event_date weekday"
        difference: "Uses promo_price_cents_per_10 instead of base"
      - name: base_price
        when: "No promo matches"
        difference: "Uses BASE_UNIT_CENTS"

  - name: event_check_total
    trigger: "POST /api/checks/{check_id}/settle"
    algorithm: aggregation
    formula: |
      For each non-VOID OrderLine:
        unit = round_half_up(base_or_promo_unit_cents * surcharge_multiplier)
        line_total_cents = round_half_up(unit * portion_count * 10 * tier_multiplier)
      subtotal_cents = sum(line_total_cents)
      tax_cents = round_half_up(subtotal_cents * 0.05)
      cover = (kind == PPV) ? guest_count * PpvEvent.cover_charge_cents : 0
      total_cents = subtotal_cents + tax_cents + cover
      Rounding order is fixed: per-unit, then per-line, then per-check tax.
      Summing first and rounding once at the end produces different cents.
    input_set: "OrderLines with status=OPEN on this Check"
    constants:
      TAX_RATE: 0.05
    precision: "2 decimal places, round_half_up per step"
    variants:
      - name: ppv_check
        when: "Check.kind == PPV"
        difference: "Adds cover charge before tax-free total"
      - name: regular_check
        when: "Check.kind == REGULAR"
        difference: "No cover"

  - name: zone_primary_allocation
    trigger: "screen assignment create/release, event cancel, blackout"
    algorithm: selector_policy
    formula: |
      candidates = events with an ACTIVE ScreenAssignment in this zone,
                   status=INGESTED
      primary_event_id = argmax(expected_attendance);
                         tie-break scheduled_start ASC, then created_at ASC
      If no candidates: primary_event_id = null, posture = OPEN
      If primary.expected_attendance >= venue.capacity_seats: posture = FULL
      If blackout active for primary's league: posture = BLACKOUT_LOCKED
    input_set: "ScreenAssignments in this zone whose event is INGESTED"
    precision: "n/a"
    variants: []

  - name: staffing_requirement
    trigger: "shift create/update, staffing plan publish"
    algorithm: threshold
    formula: |
      For each Shift i:
        foh_i = ceil(expected_covers_i * 0.4 / 60)
        boh_i = ceil(expected_covers_i * 0.4 / 100)
      plan.foh_required = sum(foh_i)
      plan.boh_required = sum(boh_i)
    input_set: "All Shifts of the plan regardless of role"
    constants:
      COVER_SHARE: 0.4
      FOH_PER_COVERS: 60
      BOH_PER_COVERS: 100
    precision: "integer heads, ceil"
    variants: []

  - name: blackout_window
    trigger: "current time enters/leaves event window"
    algorithm: threshold
    formula: |
      blackout_active = (now >= scheduled_start - 30 minutes)
                        AND (now <= scheduled_end + 60 minutes)
                        AND kind != PPV
                        AND venue within blackout_radius_miles of home_market_zip
                        AND league license ACTIVE
      NCAA radius is enforced at 75 miles when license.blackout_radius_miles is null.
    constants:
      PRE_GAME_MINUTES: 30
      POST_GAME_MINUTES: 60
      NCAA_DEFAULT_RADIUS_MILES: 75
    precision: "minute precision"
    variants: []

  - name: trivia_points
    trigger: "POST /api/trivia-entries/{entry_id}/answers"
    algorithm: aggregation
    formula: |
      On each answer:
        if is_correct:
          base = 100
          speed = max(0, 50 - floor(response_time_ms / 1000) * 2.5)
          streak_bonus = 25 if consecutive_correct (after increment) % 3 == 0 else 0
          points += base + speed + streak_bonus
          consecutive_correct += 1
        else:
          consecutive_correct = 0
      correct_count = count(is_correct)
    input_set: "Answers in submission order for this entry"
    constants:
      BASE_POINTS: 100
      SPEED_MAX: 50
      SPEED_DECAY_PER_SEC: 2.5
      STREAK_INTERVAL: 3
      STREAK_BONUS: 25
    precision: "integer points"
    variants: []

  - name: fantasy_payout
    trigger: "POST /api/fantasy-contests/{contest_id}/settle"
    algorithm: waterfall_allocation
    formula: |
      gross = entry_count * entry_fee_cents
      rake = floor(gross * rake_pct)
      distributable = gross - rake
      For each winner i in prize_structure order:
        raw = distributable * share_i
        prize_i = floor(raw)
      remainder = distributable - sum(prize_i)
      Distribute remainder one cent at a time to winners by entry.created_at ASC
    input_set: "All FantasyEntries of the contest"
    precision: "integer cents, floor"
    variants: []

  - name: group_day_forecast
    trigger: "GET /api/venues/{venue_id}/forecasts/wing-prep"
    algorithm: weighted_scoring
    formula: |
      window = [Friday 18:00 UTC, Sunday 18:00 UTC) of the requested week
      matched_leagues = distinct leagues of INGESTED BASE events in window
      score = sum(GROUP_DAY_WEIGHT[league] for league in matched_leagues)
      group_day = score >= 2.0
      Alternative rule (count distinct leagues >= 2) disagrees when exactly
      two low-weight leagues are present (0.5 + 0.3 + 0.2 = 1.0 with all three,
      but only 0.5 + 0.3 = 0.8 with two).
    constants:
      GROUP_DAY_WEIGHT_FF_NFL: 0.5
      GROUP_DAY_WEIGHT_FF_NBA: 0.4
      GROUP_DAY_WEIGHT_MLB: 0.3
      GROUP_DAY_WEIGHT_NHL: 0.3
      GROUP_DAY_WEIGHT_NCAA: 0.2
      GROUP_DAY_WEIGHT_MMA: 0.3
      GROUP_DAY_WEIGHT_BOXING: 0.3
      GROUP_DAY_WEIGHT_ENTERTAINMENT: 0.1
      GROUP_DAY_THRESHOLD: 2.0
    precision: "boolean"
    variants:
      - name: weighted
        when: "mode=group_day"
        difference: "Uses weighted sum against 2.0"
      - name: count_based
        when: "legacy mode"
        difference: "Uses distinct league count >= 2"

  - name: waitlist_quote
    trigger: "POST /api/waitlist"
    algorithm: threshold
    formula: |
      If any Zone of the venue has posture == FULL:
        reject with ERR_WAITLIST_FULL
      quoted_wait_minutes = 15 * count(WAITING entries with party_size > 8
                            split into ceil(party_size / 8) groups)
      Party_size > 8 is split into groups of <= 8 for seating math only;
      the entry itself is not split.
    constants:
      BASE_WAIT_MINUTES: 15
      GROUP_SEAT_CAP: 8
    precision: "integer minutes"
    variants: []

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resources exist and belong to the same venue scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "Target resource in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 400
    applies_to: "state transition endpoints"
  - priority: 5
    category: business_safety
    check: "Blackout window: zone cannot be assigned or audio-enabled to a blacked-out event"
    error_id: ERR_BLACKOUT_WINDOW_ACTIVE
    http_status: 400
    applies_to: "POST /api/zones/{zone_id}/screen-assignments"
  - priority: 6
    category: business_safety
    check: "License must be ACTIVE for the league of an event being assigned or PPV-linked"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 400
    applies_to: "POST /api/zones/{zone_id}/screen-assignments, POST /api/venues/{venue_id}/ppv-events"
  - priority: 7
    category: business_temporal
    check: "Event window conflicts: OVERLAY event must overlap at least one BASE event; shift end_time > start_time; promo end_date >= start_date"
    error_id: ERR_EVENT_WINDOW_CONFLICT
    http_status: 400
    applies_to: "POST /api/events, POST /api/staffing-plans/{plan_id}/shifts, POST /api/promo-rules"
  - priority: 8
    category: business_referential
    check: "Referenced child resources consistent: PPV check event must be kind=PPV; trivia guest exists; fantasy contest OPEN"
    error_id: varies
    http_status: 400
    applies_to: "POST /api/checks, POST /api/trivia-sessions/{session_id}/entries, POST /api/fantasy-contests/{contest_id}/entries"
  - priority: 9
    category: business_constraint
    check: "Capacity and quota: waitlist join blocked when all zones FULL; party_size > 0; screen_id belongs to zone"
    error_id: varies
    http_status: 400
    applies_to: "POST /api/waitlist, POST /api/zones/{zone_id}/screen-assignments"
  - priority: 10
    category: business_fiscal
    check: "Pricing and budget: quote inputs non-negative; fantasy prize_structure sums to 1.0; check settle preconditions"
    error_id: varies
    http_status: 400
    applies_to: "POST /api/venues/{venue_id}/wing-pricing/quote, POST /api/venues/{venue_id}/fantasy-contests, POST /api/checks/{check_id}/settle"
  - priority: 11
    category: state
    check: "OCC: expected_<parent>_version matches current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/fantasy-contests/{contest_id}/settle, POST /api/waitlist/{entry_id}/seat"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Venue ---
  - method: POST
    path: "/api/venues"
    description: "Create a venue"
    roles: [PlatformAdmin]
    code: 201
    input: [name, market_zip, capacity_seats, wing_cost_cents_per_lb]
    output: Venue
    side_effects: ["volatility_score computed"]

  - method: GET
    path: "/api/venues/{venue_id}"
    description: "Get venue"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: PATCH
    path: "/api/venues/{venue_id}/wing-cost"
    description: "Update wing supply cost"
    roles: [VenueManager]
    code: 200
    input: [wing_cost_cents_per_lb]
    output: Venue
    side_effects: ["volatility_score recomputed", "increments venue.version"]

  - method: GET
    path: "/api/venues/{venue_id}/forecasts/wing-prep"
    description: "48-hour wing prep forecast"
    roles: [VenueManager, Scheduler]
    code: 200
    input: [date, "mode?"]
    output: "{ required_pieces: integer, shortage_risk: boolean, base_attendance: integer, overlay_attendance: integer, group_day: boolean, matched_leagues: array }"
    side_effects: []

  - method: POST
    path: "/api/venues/{venue_id}/wing-pricing/quote"
    description: "Quote a wing price for a guest on a date"
    roles: [Server, VenueManager]
    code: 200
    input: [guest_id, wing_kind, pieces, event_date]
    output: "{ quote_cents: integer, promo_applied: boolean, quantity_tier_applied: boolean, surcharge_applied: boolean }"
    side_effects: []

  # --- Events ---
  - method: POST
    path: "/api/events"
    description: "Ingest a schedule event"
    roles: [Scheduler]
    code: 201
    input: [kind, league, title, home_market_zip, expected_attendance, scheduled_start, scheduled_end, "lift_pct?"]
    output: Event
    side_effects: ["status=INGESTED"]

  - method: GET
    path: "/api/events"
    description: "List events with filters"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: ["league?", "kind?", "status?", "date_from?", "date_to?", "limit?", "offset?"]
    output: Event[]
    side_effects: []

  - method: GET
    path: "/api/events/{event_id}"
    description: "Get event"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: POST
    path: "/api/events/{event_id}/cancel"
    description: "Cancel an event"
    roles: [Scheduler]
    code: 200
    input: []
    output: Event
    side_effects:
      - "ScreenAssignments removed"
      - "Zones recompute primary_event_id and posture"

  - method: GET
    path: "/api/events/{id}/zones"
    description: "Zones whose primary event is this event"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: []
    output: Zone[]
    side_effects: []

  - method: GET
    path: "/api/events/{id}/screen-assignments"
    description: "Screen assignments referencing this event"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: []
    output: ScreenAssignment[]
    side_effects: []

  - method: GET
    path: "/api/events/{id}/checks"
    description: "PPV checks referencing this event"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: []
    output: Check[]
    side_effects: []

  - method: GET
    path: "/api/events/{id}/ppv-events"
    description: "PPV registrations referencing this event"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: []
    output: PpvEvent[]
    side_effects: []

  # --- Licenses ---
  - method: POST
    path: "/api/venues/{venue_id}/licenses"
    description: "Create a broadcast license"
    roles: [VenueManager]
    code: 201
    input: [league, blackout_radius_miles, fee_per_head_cents]
    output: BroadcastLicense
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/api/venues/{id}/licenses"
    description: "List licenses for a venue"
    roles: [PlatformAdmin, VenueManager, Scheduler]
    code: 200
    input: ["league?", "status?"]
    output: BroadcastLicense[]
    side_effects: []

  - method: GET
    path: "/api/licenses/{license_id}"
    description: "Get license"
    roles: [PlatformAdmin, VenueManager, Scheduler]
    code: 200
    input: []
    output: BroadcastLicense
    side_effects: []

  - method: GET
    path: "/api/licenses"
    description: "List licenses with optional filters"
    roles: [PlatformAdmin, VenueManager, Scheduler]
    code: 200
    input: ["venue_id?", "league?", "status?"]
    output: BroadcastLicense[]
    side_effects: []

  - method: POST
    path: "/api/licenses/{license_id}/activate"
    description: "Activate a license"
    roles: [VenueManager, PlatformAdmin]
    code: 200
    input: []
    output: BroadcastLicense
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/api/licenses/{license_id}/suspend"
    description: "Suspend a license"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BroadcastLicense
    side_effects: ["status -> SUSPENDED", "zone postures recomputed"]

  - method: POST
    path: "/api/licenses/{license_id}/terminate"
    description: "Terminate a license"
    roles: [VenueManager]
    code: 200
    input: []
    output: BroadcastLicense
    side_effects: ["status -> TERMINATED", "zones showing that league drop assignment"]

  # --- Zones & Screens ---
  - method: POST
    path: "/api/venues/{venue_id}/zones"
    description: "Create a zone"
    roles: [VenueManager]
    code: 201
    input: [name, screen_ids]
    output: Zone
    side_effects: ["posture=OPEN"]

  - method: GET
    path: "/api/venues/{id}/zones"
    description: "List zones for a venue"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: []
    output: Zone[]
    side_effects: []

  - method: GET
    path: "/api/zones"
    description: "List zones with optional filters"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: ["venue_id?", "primary_event_id?"]
    output: Zone[]
    side_effects: []

  - method: GET
    path: "/api/zones/{zone_id}"
    description: "Get zone"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: []
    output: Zone
    side_effects: []

  - method: POST
    path: "/api/zones/{zone_id}/screen-assignments"
    description: "Assign a screen to an event"
    roles: [VenueManager, Host]
    code: 201
    input: [event_id, screen_id, audio_enabled]
    output: ScreenAssignment
    side_effects: ["zone primary_event_id and posture recomputed"]

  - method: DELETE
    path: "/api/zones/{zone_id}/screen-assignments/{assignment_id}"
    description: "Release a screen assignment"
    roles: [VenueManager, Host]
    code: 204
    input: []
    output: null
    side_effects: ["zone primary_event_id and posture recomputed"]

  - method: GET
    path: "/api/zones/{id}/screen-assignments"
    description: "List assignments in a zone"
    roles: [PlatformAdmin, VenueManager, Host, Server, Scheduler]
    code: 200
    input: []
    output: ScreenAssignment[]
    side_effects: []

  # --- Guests & Waitlist ---
  - method: POST
    path: "/api/guests"
    description: "Register a guest"
    roles: [Host, Server]
    code: 201
    input: [venue_id, name, phone]
    output: Guest
    side_effects: ["no_show_count=0"]

  - method: GET
    path: "/api/guests/{guest_id}"
    description: "Get guest"
    roles: [PlatformAdmin, VenueManager, Host, Server]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: GET
    path: "/api/venues/{id}/guests"
    description: "List guests registered at a venue"
    roles: [PlatformAdmin, VenueManager, Host, Server]
    code: 200
    input: []
    output: Guest[]
    side_effects: []

  - method: GET
    path: "/api/guests/{id}/waitlist-entries"
    description: "Waitlist entries for a guest"
    roles: [PlatformAdmin, VenueManager, Host]
    code: 200
    input: []
    output: WaitlistEntry[]
    side_effects: []

  - method: GET
    path: "/api/guests/{id}/checks"
    description: "Checks opened for a guest"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: []
    output: Check[]
    side_effects: []

  - method: GET
    path: "/api/guests/{id}/trivia-entries"
    description: "Trivia entries for a guest"
    roles: [PlatformAdmin, VenueManager, Host]
    code: 200
    input: []
    output: TriviaEntry[]
    side_effects: []

  - method: GET
    path: "/api/guests/{id}/fantasy-entries"
    description: "Fantasy entries for a guest"
    roles: [PlatformAdmin, VenueManager, Host, Server]
    code: 200
    input: []
    output: FantasyEntry[]
    side_effects: []

  - method: POST
    path: "/api/waitlist"
    description: "Join the waitlist"
    roles: [Host]
    code: 201
    input: [venue_id, guest_id, party_size, "kickoff_override?"]
    output: WaitlistEntry
    side_effects:
      - "status=WAITING"
      - "quoted_wait_minutes computed"
      - "rejected when all zones FULL"

  - method: GET
    path: "/api/venues/{id}/waitlist-entries"
    description: "List waitlist entries for a venue"
    roles: [PlatformAdmin, VenueManager, Host]
    code: 200
    input: ["status?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: POST
    path: "/api/waitlist/{entry_id}/call"
    description: "Call the next party"
    roles: [Host]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status -> CALLED, called_at=now"]

  - method: POST
    path: "/api/waitlist/{entry_id}/seat"
    description: "Seat a called party (OCC-guarded)"
