            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_r_id}", mode_code: "FM-R-IGN", description: "Ignition module failure", severity: "FUNCTIONAL", cost_per_claim_cents: 20000 }
              as: WarrantyAnalyst
              captures: { fm_r_id: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_r_id}", failure_mode_id: "${fm_r_id}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 12, claim_count: 25, paid_cost_cents: 200000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/accruals"
              payload: { period_id: "${pr_id}", vintage_id: "${vin_r_id}", method: "HISTORICAL_RATE", elapsed_exposure_bps: 3000, expected_period_version: "${pr_ver}" }
              as: WarrantyAnalyst
              as_user_id: "ua-1"
              captures: { acc_r_id: $.data.id }
          trigger:
            - call: "POST /warranty/accruals/${acc_r_id}/propose"
              payload: {}
              as: WarrantyAnalyst
              as_user_id: "ua-1"
            - call: "POST /warranty/accruals/${acc_r_id}/revise"
              payload: {}
              as: WarrantyAnalyst
              as_user_id: "ua-1"
            - call: "POST /warranty/accruals/${acc_r_id}/propose"
              payload: {}
              as: WarrantyAnalyst
              as_user_id: "ua-2"
          assert:
            - "After the first trigger call: WarrantyAccrual.${acc_r_id}.status == PROPOSED, proposed_by_user_id == \"ua-1\", revision_index == 0"
            - "After the second trigger call: WarrantyAccrual.${acc_r_id}.status == DRAFT, proposed_by_user_id == null, revision_index == 1"
            - "After the third trigger call: WarrantyAccrual.${acc_r_id}.status == PROPOSED, proposed_by_user_id == \"ua-2\", revision_index == 1"
            - "WarrantyAccrual.${acc_r_id}.accrued_amount_cents == 1060000 after every one of the three transitions"
            - "WarrantyAccrual.${acc_r_id}.posted_by_user_id == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: field_action_approval_cascades_four_hops_into_proposed_accrual_reversion
        grounds:
          - state_machines.FieldAction.SUBMITTED_to_APPROVED
          - calculations.field_action_specific_accrual
          - calculations.family_reserve_balance
          - calculations.family_reserve_posture
          - calculations.booking_period_selection
          - entities.ProductFamily.fields.reserve_posture
          - entities.WarrantyAccrual.fields.revision_index
          - entities.AccrualPeriod.fields.significant_exposure_count
        distinguishing_aspect: |
          Cascade depth 4 from a single approval trigger: HOP 1 writes
          FieldAction.specific_accrual_cents 150156000, HOP 2 recomputes
          ProductFamily.warranty_reserve_balance_cents to 150156000, HOP 3 flips
          reserve_posture to CONSTRAINED because ratio_bps 10010 crosses 10000, and HOP 4
          reverts the family's PROPOSED WarrantyAccrual back to DRAFT with revision_index 1
          — an effect on a THIRD entity that is only reachable because HOP 3 changed posture.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists and is the only period, so the booking-period selector resolves to it."
            - "ProductFamily FAM-A is the analog predecessor (one vintage of 10000 units, 300 observed claims), so its developed lifetime rate is 75000 ppm."
            - "ProductFamily FAM-C carries analog_family_id = FAM-A, engineering_estimate_rate_ppm 4000, standard_cost_per_claim_cents 30000 and reserve_cap_cents 150000000."
            - "FAM-C has one ACTIVE vintage of 3000 units and one failure mode, and one ANALOG_BLEND accrual of 2910000 cents sits in status PROPOSED (proposed by ua-1)."
            - "FieldAction FA-C-01 is a SUBMITTED SERVICE_CAMPAIGN over 12000 units whose selected PERMANENT_REPAIR remedy prices at 12513 cents per unit; it was submitted by uq-1."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { pc_id: $.data.id, pc_ver: $.data.version }
