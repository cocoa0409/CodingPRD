              as: Panelist
              as_user_id: "${p4}"
              captures: { t4: "$.data.panelist_total_100" }
          assert:
            - "reviewer legs, each rounded at the reviewer level: pa1 (35x9 + 27x8 + 23x8 + 15x7)/10 = 82.0 x 1.00 -> panelist_total_100 == 82.00; pa2 (35x8+27x8+23x8+15x8)/10 = 80.0 x 1.00 -> 80.00; pa3 (35x9+27x9+23x8+15x8)/10 = 86.2 x 0.90 = 77.58 -> 77.58 with expertise_matched == false; pa4 (35x7+27x7+23x7+15x7)/10 = 70.0 x 1.00 -> 70.00"
