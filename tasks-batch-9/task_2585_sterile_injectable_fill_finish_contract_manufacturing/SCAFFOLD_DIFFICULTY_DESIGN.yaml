            - "after trigger call 3: Deviation.${dev2_id}.capa_rejection_count == 1 and risk_score == 30 and status == UNDER_INVESTIGATION"
            - "after trigger call 3: ClientProject.${proj_id}.open_deviation_risk_total == 35"
            - "after trigger call 5: Deviation.${dev2_id}.status == CLOSED and Deviation.${dev2_id}.risk_score == 30"
            - "after trigger call 5: ClientProject.${proj_id}.open_deviation_risk_total == 5"
            - "ClientProject.${proj_id}.open_deviation_risk_total != 15 and != 0 and != 10"
            - "Deviation.${dev1_id}.status == UNDER_INVESTIGATION and Deviation.${dev1_id}.risk_score == 5 and Deviation.${dev1_id}.capa_rejection_count == 0"
            - "BatchOrder.${batch_id}.quality_status == PENDING and production_status == SCHEDULED"
