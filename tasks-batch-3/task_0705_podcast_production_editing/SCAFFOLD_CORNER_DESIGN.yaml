  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_version_contract_terminate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[contract-terminate-stale]
          - state_machines.EngagementContract.ACTIVE_to_TERMINATED
          - errors[ERR_STALE_VERSION]
          - endpoints."POST /contracts/{id}/terminate"
        distinguishing_aspect: "OCC stale-version: terminating an ACTIVE contract with expected_engagementcontract_version one behind the current version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "An ACTIVE EngagementContract; its version captured before activation (stale by one because activate bumps version)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Occ S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id, draft_v: $.data.version }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /contracts/${contract_id}/terminate"
              payload: { expected_engagementcontract_version: "${draft_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412 and data.error_id == 'ERR_STALE_VERSION' (draft_v is one behind after activate bumped the version)."

