          difficulty_instance: non_linear_state_machine / certificate_validity_and_registry_dimensions_advance_independently
          rationale: "That instance asserts the parallel state_machine_shape claim directly - validity reaching GRACE while registry_state stays ACCEPTED on the same Certificate row."

      - name: corner_enrollment_cyclic_retake_loop_and_void_handling
        claim_type: Valid Transition
        grounds:
          - state_machines.Enrollment.EXAM_FAILED_to_EXAM_IN_PROGRESS
          - state_machines.Enrollment.EXAM_IN_PROGRESS_to_EXAM_SCHEDULED
        excluded_because:
          difficulty_instance: non_linear_state_machine / enrollment_retake_cycle_reenters_exam_in_progress_and_voided_attempt_costs_no_retake
          rationale: "That instance walks the cyclic shape and the loop termination counter, including the VOIDED attempt that does not consume a retake."

      - name: corner_cross_entity_registry_rejection_side_effect_chain
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RegistrySubmission.TRANSMITTED_to_REJECTED
          - state_machines.Certificate.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / registry_rejection_cascades_six_hops_to_dram_shop_document_void
          rationale: "That instance asserts every hop of the cross-entity cascade fired by the rejection acknowledgement."

  # =========================================================================
  - section: calculations
    instances:
      - name: trainer_pass_rate_counts_only_graded_enrollments_and_rounds_to_two_decimals
        claim_type: Input Set Filtering
        grounds:
          - calculations.trainer_pass_rate
          - entities.Trainer.fields.pass_rate_pct
          - entities.StateJurisdiction.fields.certificates_issued_count
        distinguishing_aspect: |
          Four seats on one completed session produce three graded enrollments (two PASSED,
          one EXAM_FAILED) plus one INCOMPLETE that must be excluded from both numerator and
          denominator, so pass_rate_pct is 66.67 - the repeating 66.666... also pins
          round_half_up at two decimals rather than 66.66 or 67.
        test_recipe:
          setup:
            - "TX jurisdiction with min_passing_score_pct 70, proctor_separation_required false, registry_submission_required true, registry_deadline_days 15."
            - "A published 40-question ON_PREMISE course with an APPROVED TX approval and CERTIFIED trainer Dana Reyes."
            - "Four servers (Ari, Bo, Cy, Dee) are enrolled self-pay in one session, all marked ATTENDED, and the exam window is OPEN with Dana as proctor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"], min_passing_score_pct: 70, proctor_separation_required: false, registry_submission_required: true, registry_deadline_days: 15, certificate_validity_months: 24 }
