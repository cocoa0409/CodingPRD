      - GET /programs/${p_id}/measurement as ProgramDirector pd-01.
      - Repeat all of those reads.
      assert:
      - The confirm response body already shows attendance_status "CONFIRMED", room_nights 5 and cost_cents
        0 (no air has been requested), with the registration version incremented.
      - 'The first GET /qualifiers/${qa_id} already shows award_status "REGISTERED": the WINNER promotion
        is part of the same request, not a follow-up job.'
      - The first GET /programs/${p_id} shows committed_budget_cents still 1443174, budget_headroom_cents
        still 3556826 and budget_posture still "OK" — Ana was already counted as NOTIFIED and her registration
        cost_cents is 0, so the rollup is recomputed but not double counted, and committed_budget_cents
        + budget_headroom_cents still equals 5000000.
      - The first GET /supplier-contracts/${c1_id} shows room_nights_confirmed 5, room_nights_available
        55 and attrition_posture "AT_RISK" (the attrition floor is 48, so the shortfall is 43) — the ledger
        moved on the same request that moved the seat.
      - 'The first GET /registrations?program_id=${p_id}&attendance_status=CONFIRMED returns total_count
        1 containing ${ra_id}, and the first GET /qualifiers?program_id=${p_id}&award_status=REGISTERED
        returns total_count 1 containing ${qa_id}: filtered list reads see the write immediately, so the
        index behind them is not refreshed out of band.'
      - GET /programs/${p_id}/measurement returns sales_lift_pct null and travelled_count 0 on the first
        call — confirmation is not travel, and the measurement read is computed from current state rather
        than from a stale snapshot.
      - 'Every repeated read returns the same body as the first: no value converges, drifts or corrects
        itself between two reads.'
