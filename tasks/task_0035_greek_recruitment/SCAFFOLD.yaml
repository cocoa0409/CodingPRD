scenario: "College Greek System Recruitment (Rush): PNM registration, Sorority/Fraternity parties, Mutual Selection, Bid Day, chapter dues, Risk Management, Legacy priority."
domain_name: "greek-recruitment"
api_prefix: "/rush"

complexity_profile:
  primary_archetype: "multi_party_negotiation"
  secondary_archetype: "quota_allocation"
  complexity_layers:
    - "cascading_side_effects"
    - "rate_threshold_triggers"
    - "derived_field_reconciliation"
    - "optimistic_concurrency"
    - "ops_run_checkpoint"
  entity_topology: "graph"
  state_machine_shape: "branching"
  relationship_patterns:
    - "many_to_many"
    - "cross_aggregate"
  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Chapter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the sorority/fraternity chapter."
        constraints: "1..80 chars, unique (case-insensitive) within the system"
      - name: greek_type
        type: enum
        source: input
        description: "Sorority or Fraternity classification."
        constraints: "{SORORITY, FRATERNITY}"
      - name: quota_total
        type: integer
        source: input
        description: "Maximum number of new members the chapter may pledge in a single recruitment cycle."
        constraints: ">= 1"
      - name: dues_per_member_cents
        type: integer
        source: input
        description: "Per-pledge dues charged on bid acceptance, in USD cents."
        constraints: ">= 0"
      - name: legacy_priority_slots
        type: integer
        source: input
        description: "Number of seats inside quota_total reserved for legacy PNMs (parent/sibling alumna). Counts against quota_total, not in addition to it."
        constraints: "0 <= legacy_priority_slots <= quota_total"
      - name: risk_status
        type: enum
        source: computed
        description: "Risk-management posture computed from cumulative active RiskIncident severity points. Gates party scheduling and bid extension."
        constraints: "{GOOD_STANDING, PROBATION, SUSPENDED}; recomputed on every RiskIncident write"
      - name: risk_points
        type: integer
        source: computed
        description: "Cumulative severity points across this chapter's RiskIncident rows whose status is ACTIVE. Drives risk_status thresholds."
        constraints: ">= 0; recomputed on RiskIncident create/expire/dismiss"
      - name: pledged_count
        type: integer
        source: computed
        description: "Count of BidMatch rows where chapter_id=this and status=ACCEPTED in the current RecruitmentRound's cycle. Source of truth for quota enforcement."
        constraints: "0 <= pledged_count <= quota_total"
      - name: legacy_pledged_count
        type: integer
        source: computed
        description: "Count of ACCEPTED BidMatch rows for this chapter in the current cycle whose PNM is_legacy=true. Used to enforce legacy_priority_slots floor before quota close."
        constraints: "0 <= legacy_pledged_count <= legacy_priority_slots"

  - name: PNM
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "PNM full name."
        constraints: "1..120 chars"
      - name: gpa
        type: number
        source: input
        description: "PNM cumulative GPA at registration, used by chapter eligibility gates."
        constraints: "0.00 <= gpa <= 4.00; two decimal places"
      - name: legacy_chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; OPTIONAL; identifies the chapter where the PNM holds legacy status (parent/sibling alumna). When non-null and that chapter still has unfilled legacy_priority_slots, this PNM receives mutual-selection priority for that chapter."
        constraints: "must reference an existing Chapter or null"
      - name: is_legacy
        type: boolean
        source: computed
        description: "Convenience flag derived from legacy_chapter_id IS NOT NULL. Used by Chapter.legacy_pledged_count aggregation."
        constraints: "true iff legacy_chapter_id is non-null"
      - name: status
        type: enum
        source: computed
        description: "PNM lifecycle status driven by §1.2 PNM state machine."
        constraints: "{REGISTERED, ACTIVE, MATCHED, WITHDRAWN, BID_ACCEPTED, BID_DECLINED}"
      - name: matched_chapter_id
        type: string
        source: computed
        description: "FK -> Chapter.id; OPTIONAL; set to the chapter on the PROPOSED BidMatch when PNM enters MATCHED; cleared when bid is declined."
        constraints: "non-null iff status IN {MATCHED, BID_ACCEPTED}"

  - name: RecruitmentRound
    parent: null
    common_fields: true
    fields:
      - name: cycle_label
        type: string
        source: input
        description: "Human label for the recruitment cycle (e.g., 'Fall 2026'). Unique per cycle."
        constraints: "1..40 chars, unique"
      - name: phase
        type: enum
        source: computed
        description: "Current phase of the cycle. Advanced by the system epoch endpoint POST /rounds/{id}/advance. Drives gating on Party, Preference, and BidMatch writes."
        constraints: "{PARTY, MUTUAL_SELECTION, BID_DAY, CLOSED}; initial PARTY; linear forward only"
      - name: bid_day_at
        type: datetime
        source: input
        description: "Wall-clock target for Bid Day; informational only (advance is event-driven, not clock-driven)."

  - name: Party
    parent: null
    common_fields: true
    fields:
      - name: round_id
        type: string
        source: input
        description: "FK -> RecruitmentRound.id; the cycle that owns this party. Parties may only be created while round.phase=PARTY."
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; the hosting chapter. Chapter.risk_status MUST be GOOD_STANDING or PROBATION at create time; SUSPENDED chapters cannot host."
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "ISO 8601 UTC start time."
      - name: duration_minutes
        type: integer
        source: input
        description: "Party length in minutes; end = scheduled_start_utc + duration_minutes."
        constraints: "30 <= duration_minutes <= 240"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of confirmed PNM RSVPs."
        constraints: ">= 1"
      - name: confirmed_count
        type: integer
        source: computed
        description: "Number of PartyInvitation rows on this party with rsvp_status=ACCEPTED. Reconciled on every invitation transition."
        constraints: "0 <= confirmed_count <= capacity"
      - name: status
        type: enum
        source: computed
        description: "Party lifecycle status driven by §1.2 Party state machine."
        constraints: "{SCHEDULED, OPEN, COMPLETED, CANCELLED}"

  - name: PartyInvitation
    parent: null
    common_fields: true
    fields:
      - name: party_id
        type: string
        source: input
        description: "FK -> Party.id; the party being attended."
      - name: pnm_id
        type: string
        source: input
        description: "FK -> PNM.id; the PNM invited. PNM.status MUST be ACTIVE at invitation create time."
      - name: rsvp_status
        type: enum
        source: computed
        description: "Invitation lifecycle: INVITED -> ACCEPTED -> ATTENDED (terminal) | DECLINED (terminal) | NO_SHOW (terminal)."
        constraints: "{INVITED, ACCEPTED, DECLINED, ATTENDED, NO_SHOW}"

  - name: Preference
    parent: null
    common_fields: true
    fields:
      - name: round_id
        type: string
        source: input
        description: "FK -> RecruitmentRound.id; round.phase MUST be MUTUAL_SELECTION when this row is created."
      - name: side
        type: enum
        source: input
        description: "Which party owns this preference list. PNM_TO_CHAPTER is filed by the PNM; CHAPTER_TO_PNM is filed by the Chapter."
        constraints: "{PNM_TO_CHAPTER, CHAPTER_TO_PNM}"
      - name: pnm_id
        type: string
        source: input
        description: "FK -> PNM.id; the PNM whose ranking this row encodes (either as ranker, when side=PNM_TO_CHAPTER, or as ranked, when side=CHAPTER_TO_PNM)."
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; the chapter whose ranking this row encodes (either as ranker, when side=CHAPTER_TO_PNM, or as ranked, when side=PNM_TO_CHAPTER)."
      - name: rank
        type: integer
        source: input
        description: "1-based preference rank; 1 = top choice. Unique per (round_id, side, ranker) where ranker is pnm_id for PNM_TO_CHAPTER and chapter_id for CHAPTER_TO_PNM."
        constraints: ">= 1"

  - name: BidMatch
    parent: null
    common_fields: true
    fields:
      - name: round_id
        type: string
        source: input
        description: "FK -> RecruitmentRound.id; the cycle in which this bid was produced."
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; bidding chapter."
      - name: pnm_id
        type: string
        source: input
        description: "FK -> PNM.id; bid recipient."
      - name: status
        type: enum
        source: computed
        description: "BidMatch lifecycle driven by §1.2: PROPOSED -> ACCEPTED (terminal) | DECLINED (terminal)."
        constraints: "{PROPOSED, ACCEPTED, DECLINED}"
      - name: priority_kind
        type: enum
        source: computed
        description: "Why this bid was produced: LEGACY (counted against legacy_priority_slots) or STANDARD."
        constraints: "{LEGACY, STANDARD}"
      - name: dues_charged_cents
        type: integer
        source: computed
        description: "Snapshot of Chapter.dues_per_member_cents at the moment status flipped PROPOSED->ACCEPTED. Zero while status != ACCEPTED."
        constraints: ">= 0"

  - name: DuesLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; account the entry posts to."
      - name: bid_match_id
        type: string
        source: input
        description: "FK -> BidMatch.id; the bid acceptance (or refund-on-withdraw) that produced this entry."
      - name: amount_cents
        type: integer
        source: input
        description: "Signed amount in USD cents. Positive on CHARGE (bid accepted); negative on REFUND (post-acceptance withdrawal)."
      - name: entry_kind
        type: enum
        source: input
        description: "Kind of ledger entry."
        constraints: "{CHARGE, REFUND}"
      - name: running_balance_cents
        type: integer
        source: computed
        description: "Chapter dues balance after this entry posts. Equals sum of amount_cents over all entries on chapter_id ordered by created_at ASC (tie-break: insertion order)."

  - name: RiskIncident
    parent: null
    common_fields: true
    fields:
      - name: chapter_id
        type: string
        source: input
        description: "FK -> Chapter.id; chapter to which the incident is charged."
      - name: party_id
        type: string
        source: input
        description: "FK -> Party.id; OPTIONAL; the party at which the incident occurred (null for non-party incidents such as bid-day-conduct)."
      - name: severity_points
        type: integer
        source: input
        description: "Severity load contributed to Chapter.risk_points while this incident is ACTIVE."
        constraints: "1 <= severity_points <= 10"
      - name: status
        type: enum
        source: computed
        description: "Incident lifecycle: ACTIVE (counts toward Chapter.risk_points) -> EXPIRED | DISMISSED (no longer count)."
        constraints: "{ACTIVE, EXPIRED, DISMISSED}"
      - name: reason
        type: string
        source: input
        description: "Free-text reason; 1..200 chars."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RecruitmentRound
    initial_state: PARTY
    terminal_states: [CLOSED]
    transitions:
      - from: PARTY
        to: MUTUAL_SELECTION
        trigger: "POST /rounds/{id}/advance"
        actor: RecruitmentChair
        preconditions:
          - "round.phase == PARTY"
          - "every Party row on this round has status IN {COMPLETED, CANCELLED}"
        side_effects:
          - "round.phase := MUTUAL_SELECTION"
          - "for each PNM with status=ACTIVE who attended >= 1 party in this round, status remains ACTIVE (eligible to file preferences); ACTIVE PNMs with zero ATTENDED PartyInvitations transition to WITHDRAWN with reason 'NO_PARTY_ATTENDANCE'"
        note: "Linear advance; gated by per-Party closure."
      - from: MUTUAL_SELECTION
        to: BID_DAY
        trigger: "POST /rounds/{id}/advance"
        actor: RecruitmentChair
        preconditions:
          - "round.phase == MUTUAL_SELECTION"
          - "every Chapter with at least one PNM_TO_CHAPTER preference toward it has filed at least one CHAPTER_TO_PNM preference row in this round (so the matcher has mutual data)"
        side_effects:
          - "round.phase := BID_DAY"
          - "Mutual-selection allocator runs (see §1.3 calculations.mutual_selection_match); produces BidMatch rows in PROPOSED state with priority_kind ∈ {LEGACY, STANDARD}; for each produced BidMatch, the targeted PNM transitions ACTIVE -> MATCHED and PNM.matched_chapter_id is set"
      - from: BID_DAY
        to: CLOSED
        trigger: "POST /rounds/{id}/advance"
        actor: RecruitmentChair
        preconditions:
          - "round.phase == BID_DAY"
          - "every BidMatch on this round has status IN {ACCEPTED, DECLINED}"
        side_effects:
          - "round.phase := CLOSED"
          - "every MATCHED PNM whose BidMatch is still PROPOSED transitions PNM.status -> WITHDRAWN (timed-out bid)"
          - "(no DuesLedger drift: refunds already posted on individual DECLINE writes per §1.2 BidMatch DECLINE side effects)"

  - entity: Party
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /parties/{id}/open"
        actor: ChapterOfficer
        preconditions:
          - "party.status == SCHEDULED"
          - "hosting Chapter.risk_status IN {GOOD_STANDING, PROBATION}"
          - "Round on which party.round_id sits has phase == PARTY"
        side_effects:
          - "party.status := OPEN"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /parties/{id}/complete"
        actor: ChapterOfficer
        preconditions:
          - "party.status == OPEN"
        side_effects:
          - "party.status := COMPLETED"
          - "for every PartyInvitation on this party with rsvp_status=ACCEPTED, transition to ATTENDED"
          - "for every PartyInvitation on this party with rsvp_status=INVITED, transition to NO_SHOW (PNM stays ACTIVE)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /parties/{id}/cancel"
        actor: ChapterOfficer
        preconditions:
          - "party.status == SCHEDULED"
        side_effects:
          - "party.status := CANCELLED"
          - "every PartyInvitation on this party transitions to DECLINED (NOT NO_SHOW: the chapter, not the PNM, cancelled)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /parties/{id}/cancel"
        actor: ChapterOfficer
        preconditions:
          - "party.status == OPEN"
        side_effects:
          - "party.status := CANCELLED"
          - "every PartyInvitation on this party transitions to DECLINED"

  - entity: PartyInvitation
    initial_state: INVITED
    terminal_states: [ATTENDED, DECLINED, NO_SHOW]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /invitations/{id}/accept"
        actor: PNM
        preconditions:
          - "invitation.rsvp_status == INVITED"
          - "Party.status == OPEN"
          - "Party.confirmed_count < Party.capacity"
          - "no other PartyInvitation on this PNM with rsvp_status=ACCEPTED has time-overlap with this Party (half-open interval [start, start+duration))"
        side_effects:
          - "invitation.rsvp_status := ACCEPTED"
          - "Party.confirmed_count incremented by 1 (derived recompute)"
      - from: INVITED
        to: DECLINED
        trigger: "POST /invitations/{id}/decline"
        actor: PNM
        preconditions:
          - "invitation.rsvp_status == INVITED"
        side_effects:
          - "invitation.rsvp_status := DECLINED"
      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /invitations/{id}/decline"
        actor: PNM
        preconditions:
          - "invitation.rsvp_status == ACCEPTED"
          - "Party.status IN {SCHEDULED, OPEN}"
        side_effects:
          - "invitation.rsvp_status := DECLINED"
          - "Party.confirmed_count decremented by 1"

  - entity: PNM
    initial_state: REGISTERED
    terminal_states: [BID_ACCEPTED, BID_DECLINED, WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /pnms/{id}/activate"
        actor: RecruitmentChair
        preconditions:
          - "pnm.status == REGISTERED"
          - "pnm.gpa >= 2.50"
        side_effects:
          - "pnm.status := ACTIVE"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /pnms/{id}/withdraw"
        actor: PNM
        preconditions:
          - "pnm.status == ACTIVE"
        side_effects:
          - "pnm.status := WITHDRAWN"
          - "every PartyInvitation on this PNM with rsvp_status IN {INVITED, ACCEPTED} transitions to DECLINED"
      - from: MATCHED
        to: BID_ACCEPTED
        trigger: "POST /bid-matches/{id}/accept"
        actor: PNM
        preconditions:
          - "pnm.status == MATCHED"
          - "BidMatch.pnm_id == pnm.id AND BidMatch.status == PROPOSED"
          - "Round.phase == BID_DAY"
        side_effects:
          - "BidMatch.status := ACCEPTED"
          - "BidMatch.dues_charged_cents := Chapter.dues_per_member_cents (snapshot)"
          - "Append DuesLedgerEntry { chapter_id, bid_match_id, amount_cents=+Chapter.dues_per_member_cents, entry_kind=CHARGE } (cascade: Chapter dues balance reconciled by recompute of running_balance_cents)"
          - "pnm.status := BID_ACCEPTED"
          - "Chapter.pledged_count incremented; if BidMatch.priority_kind == LEGACY, Chapter.legacy_pledged_count incremented"
      - from: MATCHED
        to: BID_DECLINED
        trigger: "POST /bid-matches/{id}/decline"
        actor: PNM
        preconditions:
          - "pnm.status == MATCHED"
          - "BidMatch.pnm_id == pnm.id AND BidMatch.status == PROPOSED"
          - "Round.phase == BID_DAY"
        side_effects:
          - "BidMatch.status := DECLINED"
          - "pnm.status := BID_DECLINED"
          - "pnm.matched_chapter_id := null"

  - entity: BidMatch
    initial_state: PROPOSED
    terminal_states: [DECLINED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /bid-matches/{id}/accept"
        actor: PNM
        preconditions:
          - "bid.status == PROPOSED"
          - "associated PNM.status == MATCHED"
          - "associated Chapter.risk_status != SUSPENDED"
        side_effects:
          - "(see PNM MATCHED -> BID_ACCEPTED for the full chain)"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /bid-matches/{id}/decline"
        actor: PNM
        preconditions:
          - "bid.status == PROPOSED"
        side_effects:
          - "(see PNM MATCHED -> BID_DECLINED for the full chain)"
      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /bid-matches/{id}/rescind"
        actor: ChapterOfficer
        preconditions:
          - "bid.status == ACCEPTED"
          - "Round.phase == BID_DAY"
          - "Chapter.version matches expected_chapter_version (OCC; see §1.2.1)"
        side_effects:
          - "BidMatch.status := DECLINED; Append REFUND DuesLedgerEntry on bid_match_id; Chapter.pledged_count decremented; if priority_kind=LEGACY also Chapter.legacy_pledged_count decremented; Chapter.version incremented; PNM.status := ACTIVE; PNM.matched_chapter_id := null"

  - entity: RiskIncident
    initial_state: ACTIVE
    terminal_states: [EXPIRED, DISMISSED]
    transitions:
      - from: ACTIVE
        to: DISMISSED
        trigger: "POST /risk-incidents/{id}/dismiss"
        actor: RiskOfficer
        preconditions:
          - "incident.status == ACTIVE"
        side_effects:
          - "incident.status := DISMISSED"
          - "Chapter.risk_points := SUM(severity_points WHERE chapter_id == c AND status==ACTIVE) recomputed"
          - "Chapter.risk_status recomputed per §1.3 calculations.risk_status_from_points (CASCADE: may transition the chapter back to GOOD_STANDING, which transitively re-opens scheduling on that chapter)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: ops-run when Round.phase advances PARTY -> MUTUAL_SELECTION"
        actor: system
        preconditions:
          - "incident.status == ACTIVE"
          - "Round.phase transitions from PARTY to MUTUAL_SELECTION on the round to which incident.party_id belongs (incidents not tied to a party do NOT expire automatically)"
        side_effects:
          - "incident.status := EXPIRED"
          - "Chapter.risk_points and Chapter.risk_status recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: chapter-quota-stale-version
    parent_entity: Chapter
    write_endpoint: "POST /bid-matches"
    occ_field: "expected_chapter_version"
    description: |
      Proposing a new BidMatch against a Chapter whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just produced a bid that legitimately consumes
      the last quota slot (cascade-bumps Chapter.version), and the current
      writer's view of the chapter's quota headroom is therefore stale. Two
      strictly sequential POSTs both quoting the pre-bump version: the second
      sees version mismatch and is rejected with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: chapter-rescind-stale-version
    parent_entity: Chapter
    write_endpoint: "POST /bid-matches/{id}/rescind"
    occ_field: "expected_chapter_version"
    description: |
      Rescinding an ACCEPTED bid against a Chapter whose version has advanced
      since the client last observed it is rejected. Between reading the
      chapter and issuing the rescind, another writer may have legitimately
      accepted a different bid against the same chapter — bumping Chapter.version
      and altering pledged_count. The stale rescind would corrupt the quota
      ledger, so OCC rejects it with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: mutual_selection_match
    trigger: "Round.phase MUTUAL_SELECTION -> BID_DAY (system, on POST /rounds/{id}/advance)"
    algorithm: waterfall_allocation
    formula: |
      # Inputs: all Preference rows for round_id, plus Chapter.{quota_total, legacy_priority_slots, risk_status}, PNM.is_legacy / legacy_chapter_id.
      # Step 1 (LEGACY pass): for every Chapter C with risk_status != SUSPENDED, while C.legacy_priority_slots > 0:
      #   candidates_C = sorted([PNM P : P.is_legacy AND P.legacy_chapter_id == C.id AND P has a PNM_TO_CHAPTER preference toward C AND C has a CHAPTER_TO_PNM preference toward P AND P not yet matched in this pass], key=lambda P: (
      #       chapter_rank_of(C, P),                     # C's CHAPTER_TO_PNM rank for P (1=best); missing -> +inf
      #       pnm_rank_of(P, C),                         # P's PNM_TO_CHAPTER rank for C (1=best); missing -> +inf
      #       P.created_at_ASC                            # final tie-break — created_at, never id
      #   ))
      #   take up to min(C.legacy_priority_slots, C.quota_total - C.pledged_count_pending) candidates and produce BidMatch{C, P, priority_kind=LEGACY}.
      # Step 2 (STANDARD pass): for every Chapter C with risk_status != SUSPENDED, while C.quota_total - C.pledged_count_pending > 0:
      #   candidates_C = sorted([PNM P unmatched : P has PNM_TO_CHAPTER rank for C AND C has CHAPTER_TO_PNM rank for P], key=lambda P: (
      #       chapter_rank_of(C, P), pnm_rank_of(P, C), P.created_at_ASC
      #   ))
      #   take up to (C.quota_total - C.pledged_count_pending) candidates not already matched in Step 1 or Step 2.
      # CHAPTER ORDER inside each step is fixed: sort chapters by created_at ASC (NEVER by id).
      # A PNM matched in either step is REMOVED from all other chapters' candidate lists immediately (waterfall, not bipartite optimum).
      # Output: BidMatch rows in PROPOSED, plus PNM transitions ACTIVE -> MATCHED for each matched P, plus PNM.matched_chapter_id.
    input_set: |
      Preference rows where round_id == this_round; PNMs with status == ACTIVE; Chapters with risk_status IN {GOOD_STANDING, PROBATION}.
      SUSPENDED chapters and ACTIVE PNMs without at least one mutual Preference pair are EXCLUDED.
    constants:
      MAX_BIDS_PER_PNM: 1
    precision: "no rounding (counts and ranks are integers)"
    variants:
      - name: legacy_pass
        when: "Step 1 — chapter still has legacy_priority_slots and quota headroom"
        difference: "Candidate set restricted to is_legacy=true PNMs whose legacy_chapter_id equals this chapter; output BidMatch.priority_kind=LEGACY; counts against both Chapter.legacy_priority_slots AND Chapter.quota_total."
      - name: standard_pass
        when: "Step 2 — chapter has remaining (quota_total - already_pledged) headroom after Step 1"
        difference: "Candidate set drops the legacy filter; output BidMatch.priority_kind=STANDARD; counts only against Chapter.quota_total."

  - name: risk_status_from_points
    trigger: "On every RiskIncident create / dismiss / expire side-effect; also evaluated on POST /parties (precondition)"
    algorithm: threshold
    formula: |
      points = SUM(RiskIncident.severity_points WHERE chapter_id == C.id AND status == ACTIVE)
      if points >= SUSPEND_THRESHOLD:        # 15
          risk_status = SUSPENDED
      elif points >= PROBATION_THRESHOLD:    # 6
          risk_status = PROBATION
      else:
          risk_status = GOOD_STANDING
      # Boundary semantics: >= (NOT >). points = 6 -> PROBATION; points = 5 -> GOOD_STANDING.
      # points = 15 -> SUSPENDED; points = 14 -> PROBATION.
    input_set: "All RiskIncident rows on this chapter with status == ACTIVE; EXPIRED and DISMISSED rows EXCLUDED."
    constants:
      PROBATION_THRESHOLD: 6
      SUSPEND_THRESHOLD: 15
    precision: "integer comparison"

  - name: chapter_dues_balance
    trigger: "On POST /bid-matches/{id}/accept (CHARGE entry); on POST /pnms/{id}/withdraw when PNM.status was BID_ACCEPTED (REFUND entry); on GET /chapters/{id}/dues-ledger (read-only recompute)"
    algorithm: chronological
    formula: |
      # Ordered chronologically by DuesLedgerEntry.created_at ASC; tie-break created_at_ASC then insertion order (NEVER id).
      # Two evaluation modes pin the same chronological order but answer different questions:
      #
      # MODE A (running_balance_cents per entry):
      #   running = 0
      #   for each entry in chapter's DuesLedgerEntry rows ordered by created_at ASC:
      #       running += entry.amount_cents
      #       entry.running_balance_cents = running
      #   final_balance = running
      #
      # MODE B (chapter aggregate, used by Chapter.dues_balance_cents reads):
      #   balance = SUM(amount_cents for chapter_id == C.id)
      #   # Equal to MODE A's final by construction; included separately because MODE A
      #   # is row-level and MODE B is chapter-level — two valid algorithms over the
      #   # same input that the implementation MUST keep reconciled even after a
      #   # mid-cycle REFUND insertion that re-shuffles row order.
      # Same inputs both modes => same final answer; differ only in returned shape.
    input_set: "DuesLedgerEntry rows where chapter_id == C.id; all entry_kind ∈ {CHARGE, REFUND} included."
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: per_entry_running_balance
        when: "GET /chapters/{id}/dues-ledger response: each row carries its running_balance_cents"
        difference: "Output is one running_balance_cents per row; sensitive to insertion order — a back-dated REFUND inserted between two existing CHARGEs would change every later row's running_balance_cents."
      - name: chapter_aggregate_balance
        when: "Chapter detail read: a single dues_balance_cents value"
        difference: "Output is a single integer; insensitive to row order (commutative sum). Two interpretations of the same ledger that MUST stay equal — drift between MODE A's last row and MODE B's aggregate is a bug."

  - name: bid_acceptance_dues_snapshot
    trigger: "PNM MATCHED -> BID_ACCEPTED on POST /bid-matches/{id}/accept"
    algorithm: forward_looking
    formula: |
      # Pins the dues that the chapter will collect against THIS specific bid acceptance.
      # Snapshot interpretation (THIS IS THE PINNED ONE):
      #   BidMatch.dues_charged_cents := Chapter.dues_per_member_cents AS OF the instant POST /bid-matches/{id}/accept commits.
      #   Subsequent PUT /chapters/{id} that changes dues_per_member_cents does NOT alter past BidMatch.dues_charged_cents.
      # Rejected alternative (provisional/at-read):
      #   dues_charged_cents = current Chapter.dues_per_member_cents (would re-bill all past accepted bids when chapter raises dues mid-cycle).
      # Order: read chapter.dues_per_member_cents BEFORE writing the BidMatch row; tie-break: not applicable (single read).
    input_set: "Chapter.dues_per_member_cents AT bid-acceptance commit time."
    constants: {}
    precision: "integer cents"
    variants:
      - name: snapshot_at_acceptance
        when: "Pinned: dues_charged_cents frozen at acceptance"
        difference: "Later dues_per_member_cents changes do NOT affect past accepted bids."
      - name: live_at_read
        when: "REJECTED — listed only for clarity; the implementation MUST NOT use it"
        difference: "Would recompute on every read using current chapter dues; explicitly rejected by the snapshot rule above."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all non-public endpoints (all except POST /pnms/register and the /_clock endpoint)"
  - priority: 2
    category: auth
    check: "Role permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-parameter resource exists; left-to-right validation"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {id} or {round_id} path segments"
  - priority: 4
    category: existence
    check: "Referenced foreign-key ids in body resolve to existing rows (chapter_id, pnm_id, party_id, round_id, legacy_chapter_id when non-null)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /parties, POST /invitations, POST /preferences, POST /bid-matches, POST /risk-incidents, POST /pnms/register"
  - priority: 5
    category: state
    check: "Target entity is in a state that permits this transition (per §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (open/complete/cancel/accept/decline/advance/activate/withdraw/dismiss)"
  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_<parent>_version matches current parent version per §1.2.1"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bid-matches, POST /bid-matches/{id}/rescind"
  - priority: 7
    category: business_safety
    check: "Hosting Chapter.risk_status != SUSPENDED when creating a Party or producing a BidMatch (safety gate dominates fiscal gates below)"
    error_id: ERR_CHAPTER_SUSPENDED
    http_status: 409
    applies_to: "POST /parties, POST /bid-matches"
  - priority: 8
    category: business_temporal
    check: "On POST /invitations/{id}/accept: the PNM has no other ACCEPTED PartyInvitation whose Party time interval [start, start+duration) overlaps this Party's interval. Adjacency (gap == 0) does NOT collide."
    error_id: ERR_PARTY_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /invitations/{id}/accept"
  - priority: 9
    category: business_temporal
    check: "On POST /parties: scheduled_start_utc + duration_minutes does NOT overlap with another Party of the SAME chapter; same-chapter parties must be back-to-back at minimum (gap == 0 allowed, overlap forbidden)"
    error_id: ERR_CHAPTER_DOUBLE_BOOK
    http_status: 409
    applies_to: "POST /parties"
  - priority: 10
    category: business_referential
    check: "On POST /preferences: side=PNM_TO_CHAPTER requires PNM.status == ACTIVE; side=CHAPTER_TO_PNM may only be filed for PNMs with status == ACTIVE who have at least one ATTENDED PartyInvitation hosted by this chapter in this round"
    error_id: ERR_PREFERENCE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /preferences"
  - priority: 11
    category: business_constraint
    check: "On POST /preferences: (round_id, side, ranker, rank) must be unique; ranker is pnm_id for PNM_TO_CHAPTER and chapter_id for CHAPTER_TO_PNM; rank 1 cannot be filed twice on the same ranker."
    error_id: ERR_PREFERENCE_RANK_TAKEN
    http_status: 409
    applies_to: "POST /preferences"
  - priority: 12
    category: business_constraint
    check: "Round phase gating: POST /parties requires round.phase == PARTY; POST /preferences requires round.phase == MUTUAL_SELECTION; POST /bid-matches and POST /bid-matches/{id}/(accept|decline) require round.phase IN {BID_DAY, MUTUAL_SELECTION->BID_DAY transition window}"
    error_id: ERR_ROUND_PHASE_MISMATCH
    http_status: 409
    applies_to: "POST /parties, POST /preferences, POST /bid-matches/*"
  - priority: 13
    category: business_fiscal
    check: "On POST /bid-matches (manual override path): Chapter.pledged_count + 1 <= Chapter.quota_total"
    error_id: ERR_CHAPTER_QUOTA_FULL
    http_status: 409
    applies_to: "POST /bid-matches"
  - priority: 14
    category: business_constraint
    check: "On POST /invitations: invitation must be unique per (party_id, pnm_id)"
    error_id: ERR_DUPLICATE_INVITATION
    http_status: 409
    applies_to: "POST /invitations"
  - priority: 15
    category: business_constraint
    check: "PNM.gpa >= 2.50 on activate; gpa < 2.50 rejects with this code (rule 4 — existence — would not apply because PNM row exists)"
    error_id: ERR_GPA_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /pnms/{id}/activate"
  - priority: 16
    category: business_constraint
    check: "Required body fields present and well-typed; enum values inside declared sets; numerics within declared ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Chapter ------------------------------------------------------------
  - method: POST
    path: "/rush/chapters"
    description: "Create a chapter (sorority/fraternity)."
    roles: [PanhellenicAdmin]
    code: 201
    input: [name, greek_type, quota_total, dues_per_member_cents, legacy_priority_slots]
    output: Chapter
    side_effects:
      - "Chapter row created with risk_status=GOOD_STANDING, risk_points=0, pledged_count=0, legacy_pledged_count=0, version=1"

  - method: GET
    path: "/rush/chapters/{id}"
    description: "Fetch a chapter by id."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, RiskOfficer, PNM]
    code: 200
    input: []
    output: Chapter
    side_effects: []

  - method: GET
    path: "/rush/chapters"
    description: "List chapters."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, RiskOfficer, PNM]
    code: 200
    input: ["greek_type?", "limit?", "offset?"]
    output: Chapter[]
    side_effects: []

  - method: PUT
    path: "/rush/chapters/{id}"
    description: "Update mutable chapter fields. Does NOT alter past BidMatch.dues_charged_cents per §1.3 bid_acceptance_dues_snapshot."
    roles: [PanhellenicAdmin]
    code: 200
    input: ["dues_per_member_cents?", "quota_total?", "legacy_priority_slots?"]
    output: Chapter
    side_effects:
      - "Chapter.version incremented by 1"
      - "(no retroactive change to existing DuesLedgerEntry rows)"

  - method: GET
    path: "/rush/chapters/{id}/parties"
    description: "List parties hosted by a chapter (FK reverse-reachability for Party.chapter_id)."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, RiskOfficer, PNM]
    code: 200
    input: ["round_id?", "status?", "limit?", "offset?"]
    output: Party[]
    side_effects: []

  - method: GET
    path: "/rush/chapters/{id}/risk-incidents"
    description: "List risk incidents charged to a chapter (FK reverse-reachability for RiskIncident.chapter_id)."
    roles: [PanhellenicAdmin, RiskOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RiskIncident[]
    side_effects: []

  - method: GET
    path: "/rush/chapters/{id}/dues-ledger"
    description: "Chronological dues ledger for a chapter with per-entry running_balance_cents (calculation chapter_dues_balance, variant per_entry_running_balance). FK reverse-reachability for DuesLedgerEntry.chapter_id."
    roles: [PanhellenicAdmin, ChapterOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: DuesLedgerEntry[]
    side_effects: []

  # ---- PNM ----------------------------------------------------------------
  - method: POST
    path: "/rush/pnms/register"
    description: "PNM self-registration. Public; creates a PNM in REGISTERED state."
    roles: [Anonymous]
    code: 201
    input: ["full_name", "gpa", "legacy_chapter_id?"]
    output: PNM
    side_effects:
      - "PNM row created with status=REGISTERED; is_legacy=(legacy_chapter_id IS NOT NULL); matched_chapter_id=null"

  - method: GET
    path: "/rush/pnms/{id}"
    description: "Fetch PNM by id."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer, PNM]
    code: 200
    input: []
    output: PNM
    side_effects: []

  - method: GET
    path: "/rush/pnms"
    description: "List PNMs."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer]
    code: 200
    input: ["status?", "legacy_chapter_id?", "matched_chapter_id?", "limit?", "offset?"]
    output: PNM[]
    side_effects: []

  - method: POST
    path: "/rush/pnms/{id}/activate"
    description: "Activate a registered PNM. Gated by gpa >= 2.50."
    roles: [RecruitmentChair]
    code: 200
    input: []
    output: PNM
    side_effects:
      - "PNM.status := ACTIVE (per §1.2 PNM REGISTERED -> ACTIVE)"
      - "PNM.version incremented"

  - method: POST
    path: "/rush/pnms/{id}/withdraw"
    description: "PNM voluntarily withdraws. Cascades to invitations."
    roles: [PNM]
    code: 200
    input: []
    output: PNM
    side_effects:
      - "PNM.status := WITHDRAWN"
      - "All PartyInvitations on this PNM with rsvp_status IN {INVITED, ACCEPTED} := DECLINED (cascade)"
      - "PNM.version incremented"

  - method: GET
    path: "/rush/pnms/{id}/invitations"
    description: "List invitations for a PNM (FK reverse-reachability for PartyInvitation.pnm_id)."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer, PNM]
    code: 200
    input: ["rsvp_status?", "limit?", "offset?"]
    output: PartyInvitation[]
    side_effects: []

  - method: GET
    path: "/rush/pnms/{id}/preferences"
    description: "List preference rows authored about or by this PNM (FK reverse-reachability for Preference.pnm_id)."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer, PNM]
    code: 200
    input: ["side?", "round_id?", "limit?", "offset?"]
    output: Preference[]
    side_effects: []

  - method: GET
    path: "/rush/pnms/{id}/bid-matches"
    description: "List BidMatch rows targeting this PNM (FK reverse-reachability for BidMatch.pnm_id)."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer, PNM]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BidMatch[]
    side_effects: []

  - method: GET
    path: "/rush/pnms/legacy-of/{id}"
    description: "List PNMs whose legacy_chapter_id equals this chapter id (FK reverse-reachability for PNM.legacy_chapter_id)."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair]
    code: 200
    input: ["limit?", "offset?"]
    output: PNM[]
    side_effects: []

  # ---- RecruitmentRound ----------------------------------------------------
  - method: POST
    path: "/rush/rounds"
    description: "Open a new recruitment cycle in phase=PARTY."
    roles: [PanhellenicAdmin]
    code: 201
    input: [cycle_label, bid_day_at]
    output: RecruitmentRound
    side_effects:
      - "RecruitmentRound row created with phase=PARTY, version=1"

  - method: GET
    path: "/rush/rounds/{id}"
    description: "Fetch a recruitment round."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, RiskOfficer, PNM]
    code: 200
    input: []
    output: RecruitmentRound
    side_effects: []

  - method: GET
    path: "/rush/rounds"
    description: "List recruitment rounds."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, RiskOfficer]
    code: 200
    input: ["phase?", "limit?", "offset?"]
    output: RecruitmentRound[]
    side_effects: []

  - method: POST
    path: "/rush/rounds/{id}/advance"
    description: "Advance the round to the next phase per §1.2 RecruitmentRound. Triggers cascading side effects: PARTY->MUTUAL_SELECTION expires party-tied RiskIncidents and may withdraw zero-attendance PNMs; MUTUAL_SELECTION->BID_DAY runs the mutual_selection_match calculation."
    roles: [RecruitmentChair]
    code: 200
    input: []
    output: RecruitmentRound
    side_effects:
      - "RecruitmentRound.phase advanced per §1.2"
      - "RecruitmentRound.version incremented"
      - "Cascading side effects per §1.2 transition (Party-tied RiskIncidents expire on PARTY->MUTUAL_SELECTION; mutual-selection allocator runs on MUTUAL_SELECTION->BID_DAY; timed-out PROPOSED bids withdraw their PNMs on BID_DAY->CLOSED)"

  - method: GET
    path: "/rush/rounds/{id}/parties"
    description: "List parties for a round (FK reverse-reachability for Party.round_id)."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, RiskOfficer, PNM]
    code: 200
    input: ["chapter_id?", "status?", "limit?", "offset?"]
    output: Party[]
    side_effects: []

  - method: GET
    path: "/rush/rounds/{id}/preferences"
    description: "List preferences for a round (FK reverse-reachability for Preference.round_id)."
    roles: [PanhellenicAdmin, RecruitmentChair]
    code: 200
    input: ["side?", "chapter_id?", "pnm_id?", "limit?", "offset?"]
    output: Preference[]
    side_effects: []

  - method: GET
    path: "/rush/rounds/{id}/bid-matches"
    description: "List BidMatch rows for a round (FK reverse-reachability for BidMatch.round_id)."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer]
    code: 200
    input: ["chapter_id?", "pnm_id?", "status?", "limit?", "offset?"]
    output: BidMatch[]
    side_effects: []

  # ---- Party ---------------------------------------------------------------
  - method: POST
    path: "/rush/parties"
    description: "Schedule a party. Gated by chapter risk_status, round.phase=PARTY, and chapter double-booking check."
    roles: [ChapterOfficer]
    code: 201
    input: [round_id, chapter_id, scheduled_start_utc, duration_minutes, capacity]
    output: Party
    side_effects:
      - "Party row created with status=SCHEDULED, confirmed_count=0, version=1"

  - method: GET
    path: "/rush/parties/{id}"
    description: "Fetch a party."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, RiskOfficer, PNM]
    code: 200
    input: []
    output: Party
    side_effects: []

  - method: POST
    path: "/rush/parties/{id}/open"
    description: "Open the party for RSVP confirmations (SCHEDULED -> OPEN)."
    roles: [ChapterOfficer]
    code: 200
    input: []
    output: Party
    side_effects:
      - "Party.status := OPEN; Party.version incremented"

  - method: POST
    path: "/rush/parties/{id}/complete"
    description: "Complete an open party; ACCEPTED invites become ATTENDED, INVITED become NO_SHOW."
    roles: [ChapterOfficer]
    code: 200
    input: []
    output: Party
    side_effects:
      - "Party.status := COMPLETED; Party.version incremented"
      - "Cascade: every ACCEPTED PartyInvitation -> ATTENDED; every INVITED PartyInvitation -> NO_SHOW"

  - method: POST
    path: "/rush/parties/{id}/cancel"
    description: "Cancel a SCHEDULED or OPEN party; all invitations become DECLINED."
    roles: [ChapterOfficer]
    code: 200
    input: []
    output: Party
    side_effects:
      - "Party.status := CANCELLED; Party.version incremented"
      - "Cascade: every non-terminal PartyInvitation -> DECLINED"

  - method: GET
    path: "/rush/parties/{id}/invitations"
    description: "List invitations on a party (FK reverse-reachability for PartyInvitation.party_id)."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, PNM]
    code: 200
    input: ["rsvp_status?", "limit?", "offset?"]
    output: PartyInvitation[]
    side_effects: []

  - method: GET
    path: "/rush/parties/{id}/risk-incidents"
    description: "List risk incidents tied to a party (FK reverse-reachability for RiskIncident.party_id)."
    roles: [PanhellenicAdmin, RiskOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RiskIncident[]
    side_effects: []

  # ---- PartyInvitation -----------------------------------------------------
  - method: POST
    path: "/rush/invitations"
    description: "Issue an invitation from a Party to a PNM."
    roles: [ChapterOfficer]
    code: 201
    input: [party_id, pnm_id]
    output: PartyInvitation
    side_effects:
      - "PartyInvitation row created with rsvp_status=INVITED, version=1"

  - method: GET
    path: "/rush/invitations/{id}"
    description: "Fetch an invitation."
    roles: [PanhellenicAdmin, ChapterOfficer, RecruitmentChair, PNM]
    code: 200
    input: []
    output: PartyInvitation
    side_effects: []

  - method: POST
    path: "/rush/invitations/{id}/accept"
    description: "PNM accepts a party invitation; party capacity and PNM time-conflict gates apply."
    roles: [PNM]
    code: 200
    input: []
    output: PartyInvitation
    side_effects:
      - "invitation.rsvp_status := ACCEPTED; invitation.version incremented"
      - "Party.confirmed_count incremented"

  - method: POST
    path: "/rush/invitations/{id}/decline"
    description: "PNM declines or cancels a party invitation."
    roles: [PNM]
    code: 200
    input: []
    output: PartyInvitation
    side_effects:
      - "invitation.rsvp_status := DECLINED; invitation.version incremented"
      - "If previous rsvp_status was ACCEPTED: Party.confirmed_count decremented"

  # ---- Preference ----------------------------------------------------------
  - method: POST
    path: "/rush/preferences"
    description: "File one preference row (one rank). Round.phase MUST be MUTUAL_SELECTION."
    roles: [PNM, ChapterOfficer]
    code: 201
    input: [round_id, side, pnm_id, chapter_id, rank]
    output: Preference
    side_effects:
      - "Preference row created with version=1"

  - method: GET
    path: "/rush/preferences/{id}"
    description: "Fetch a preference row."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer, PNM]
    code: 200
    input: []
    output: Preference
    side_effects: []

  - method: GET
    path: "/rush/chapters/{id}/preferences"
    description: "List preference rows where chapter_id == this chapter (FK reverse-reachability for Preference.chapter_id)."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer]
    code: 200
    input: ["side?", "round_id?", "limit?", "offset?"]
    output: Preference[]
    side_effects: []

  # ---- BidMatch ------------------------------------------------------------
  - method: POST
    path: "/rush/bid-matches"
    description: |
      Manual / override bid creation by a chapter officer. Used as a manual
      backstop alongside the system-driven mutual_selection_match. OCC-gated
      on Chapter.version to prevent stale quota reads. Subject to quota,
      risk, and round-phase validations.
    roles: [ChapterOfficer]
    code: 201
    input: [round_id, chapter_id, pnm_id, expected_chapter_version]
    output: BidMatch
    side_effects:
      - "BidMatch row created with status=PROPOSED, priority_kind ∈ {LEGACY, STANDARD} (LEGACY iff PNM.legacy_chapter_id == chapter_id AND Chapter.legacy_pledged_count < Chapter.legacy_priority_slots), dues_charged_cents=0, version=1"
      - "Chapter.version incremented by 1"
      - "PNM.status := MATCHED; PNM.matched_chapter_id := chapter_id; PNM.version incremented"

  - method: GET
    path: "/rush/bid-matches/{id}"
    description: "Fetch a bid match."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer, PNM]
    code: 200
    input: []
    output: BidMatch
    side_effects: []

  - method: GET
    path: "/rush/bid-matches"
    description: "List BidMatch rows (FK reverse-reachability for BidMatch.chapter_id and BidMatch.pnm_id at the collection root, complementing the nested round-scoped list)."
    roles: [PanhellenicAdmin, RecruitmentChair, ChapterOfficer, PNM]
    code: 200
    input: ["chapter_id?", "pnm_id?", "round_id?", "status?", "limit?", "offset?"]
    output: BidMatch[]
    side_effects: []

  - method: GET
    path: "/rush/bid-matches/{id}/dues-ledger-entries"
    description: "List DuesLedgerEntry rows produced by this bid (FK reverse-reachability for DuesLedgerEntry.bid_match_id). Normally 0 or 1 rows for CHARGE plus optional REFUND."
    roles: [PanhellenicAdmin, ChapterOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: DuesLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/rush/bid-matches/{id}/accept"
    description: "PNM accepts a bid; charges dues snapshot and pledges the PNM."
    roles: [PNM]
    code: 200
    input: []
    output: BidMatch
    side_effects:
      - "BidMatch.status := ACCEPTED; BidMatch.dues_charged_cents := Chapter.dues_per_member_cents at this instant; BidMatch.version incremented"
      - "PNM.status := BID_ACCEPTED; PNM.version incremented"
      - "Append DuesLedgerEntry { chapter_id, bid_match_id, amount_cents=+dues_charged_cents, entry_kind=CHARGE }"
      - "Chapter.pledged_count incremented; if priority_kind=LEGACY also Chapter.legacy_pledged_count incremented; Chapter.version incremented"

  - method: POST
    path: "/rush/bid-matches/{id}/rescind"
    description: |
      ChapterOfficer rescinds an already-ACCEPTED bid (e.g., the pledge was
      found ineligible post-acceptance). Posts a REFUND DuesLedgerEntry
      compensating the CHARGE entry, decrements Chapter.pledged_count (and
      Chapter.legacy_pledged_count if priority_kind=LEGACY), and pushes the
      PNM back to ACTIVE so the chapter can refill the quota slot before
      BID_DAY closes. This is the compensating action for Rule 9.
    roles: [ChapterOfficer]
    code: 200
    input: ["expected_chapter_version"]
    output: BidMatch
    side_effects:
      - "BidMatch.status := DECLINED; BidMatch.version incremented (RESCINDED is modeled as DECLINED + REFUND entry; the discriminator is the trailing REFUND DuesLedgerEntry on bid_match_id)"
      - "Append DuesLedgerEntry { chapter_id, bid_match_id, amount_cents=-BidMatch.dues_charged_cents, entry_kind=REFUND } (conserves chapter dues balance: CHARGE + REFUND sum to 0)"
      - "Chapter.pledged_count decremented; if priority_kind=LEGACY also Chapter.legacy_pledged_count decremented; Chapter.version incremented (conserves quota count: increment + decrement)"
      - "PNM.status := ACTIVE; PNM.matched_chapter_id := null; PNM.version incremented"

  - method: POST
    path: "/rush/bid-matches/{id}/decline"
    description: "PNM declines a bid."
    roles: [PNM]
    code: 200
    input: []
    output: BidMatch
    side_effects:
      - "BidMatch.status := DECLINED; BidMatch.version incremented"
      - "PNM.status := BID_DECLINED; PNM.matched_chapter_id := null; PNM.version incremented"

  # ---- RiskIncident --------------------------------------------------------
  - method: POST
    path: "/rush/risk-incidents"
    description: "Record a risk incident against a chapter (optionally tied to a party)."
    roles: [RiskOfficer]
    code: 201
    input: ["chapter_id", "party_id?", "severity_points", "reason"]
    output: RiskIncident
    side_effects:
      - "RiskIncident row created with status=ACTIVE, version=1"
      - "Chapter.risk_points recomputed; Chapter.risk_status recomputed per §1.3 risk_status_from_points; Chapter.version incremented"

  - method: GET
    path: "/rush/risk-incidents/{id}"
    description: "Fetch a risk incident."
    roles: [PanhellenicAdmin, RiskOfficer]
    code: 200
    input: []
    output: RiskIncident
    side_effects: []

  - method: POST
    path: "/rush/risk-incidents/{id}/dismiss"
    description: "Dismiss an active risk incident; recomputes chapter risk_status."
    roles: [RiskOfficer]
    code: 200
    input: []
    output: RiskIncident
    side_effects:
      - "RiskIncident.status := DISMISSED; RiskIncident.version incremented"
      - "Chapter.risk_points recomputed; Chapter.risk_status recomputed; Chapter.version incremented"

  # ---- Test-driving endpoints (under /_<name>) -----------------------------
  - method: POST
    path: "/rush/_clock/set_current_utc"
    description: "Test-driving endpoint: pin the server's current UTC clock for deterministic temporal tests."
    roles: [PanhellenicAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Server clock observed by validations and timestamps moves to to_iso8601"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role not permitted to call this endpoint per §1.7."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Path-parameter id does not resolve to an existing row."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Foreign-key id in body does not resolve."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required body field missing; enum/type/range violation; malformed payload."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits this transition."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_<parent>_version differs from current parent.version (per §1.2.1)."
  - id: ERR_CHAPTER_SUSPENDED
    http: 409
    condition: "Hosting Chapter.risk_status == SUSPENDED at time of POST /parties or POST /bid-matches."
  - id: ERR_PARTY_TIME_CONFLICT
    http: 409
    condition: "On invitation accept: PNM has an overlapping ACCEPTED invitation on a different party (half-open intervals)."
  - id: ERR_CHAPTER_DOUBLE_BOOK
    http: 409
    condition: "On party create: same-chapter party overlaps an existing one (adjacency at gap=0 is allowed; overlap is not)."
  - id: ERR_PREFERENCE_NOT_ELIGIBLE
    http: 409
    condition: "Preference filing failed eligibility (PNM not ACTIVE, or CHAPTER_TO_PNM filed against PNM with no ATTENDED invitation hosted by this chapter)."
  - id: ERR_PREFERENCE_RANK_TAKEN
    http: 409
    condition: "(round_id, side, ranker, rank) collision on Preference create."
  - id: ERR_ROUND_PHASE_MISMATCH
    http: 409
    condition: "Endpoint called while RecruitmentRound.phase is wrong for the operation."
  - id: ERR_CHAPTER_QUOTA_FULL
    http: 409
    condition: "Chapter.pledged_count == quota_total on POST /bid-matches."
  - id: ERR_DUPLICATE_INVITATION
    http: 409
    condition: "Duplicate (party_id, pnm_id) invitation."
  - id: ERR_GPA_BELOW_MINIMUM
    http: 422
    condition: "POST /pnms/{id}/activate with PNM.gpa < 2.50."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PanhellenicAdmin
    description: "Top-level admin for the Panhellenic / IFC system. Creates chapters, opens recruitment cycles, reads everything."
    identity: "opaque"
    exclusive_operations:
      - "POST /rush/chapters"
      - "PUT /rush/chapters/{id}"
      - "POST /rush/rounds"
      - "POST /rush/_clock/set_current_utc"
    shared_operations:
      - "GET /rush/chapters, /rush/chapters/{id}, /rush/chapters/{id}/parties, /rush/chapters/{id}/risk-incidents, /rush/chapters/{id}/dues-ledger, /rush/chapters/{id}/preferences"
      - "GET /rush/pnms, /rush/pnms/{id}, /rush/pnms/{id}/invitations, /rush/pnms/{id}/preferences, /rush/pnms/{id}/bid-matches, /rush/pnms/legacy-of/{id}"
      - "GET /rush/rounds, /rush/rounds/{id}, /rush/rounds/{id}/parties, /rush/rounds/{id}/preferences, /rush/rounds/{id}/bid-matches"
      - "GET /rush/parties/{id}, /rush/parties/{id}/invitations, /rush/parties/{id}/risk-incidents"
      - "GET /rush/invitations/{id}, /rush/preferences/{id}, /rush/bid-matches/{id}, /rush/risk-incidents/{id}"

  - name: RecruitmentChair
    description: "Panhellenic recruitment chair: activates PNMs, advances round phases, reads chapter-level recruitment data."
    identity: "opaque"
    exclusive_operations:
      - "POST /rush/pnms/{id}/activate"
      - "POST /rush/rounds/{id}/advance"
    shared_operations:
      - "GET /rush/chapters, /rush/chapters/{id}, /rush/chapters/{id}/parties, /rush/chapters/{id}/preferences"
      - "GET /rush/pnms, /rush/pnms/{id}, /rush/pnms/{id}/invitations, /rush/pnms/{id}/preferences, /rush/pnms/{id}/bid-matches, /rush/pnms/legacy-of/{id}"
      - "GET /rush/rounds, /rush/rounds/{id}, /rush/rounds/{id}/parties, /rush/rounds/{id}/preferences, /rush/rounds/{id}/bid-matches"
      - "GET /rush/parties/{id}, /rush/parties/{id}/invitations"
      - "GET /rush/invitations/{id}, /rush/preferences/{id}, /rush/bid-matches/{id}"

  - name: ChapterOfficer
    description: "Officer of a single chapter. Schedules and runs parties, invites PNMs, files chapter-side preferences, and manually issues bids."
    identity: "entity_backed:Chapter"
    exclusive_operations:
      - "POST /rush/parties"
      - "POST /rush/parties/{id}/open"
      - "POST /rush/parties/{id}/complete"
      - "POST /rush/parties/{id}/cancel"
      - "POST /rush/invitations"
      - "POST /rush/bid-matches"
    shared_operations:
      - "POST /rush/preferences (side=CHAPTER_TO_PNM only; the validator at priority 10 enforces this)"
      - "GET /rush/chapters, /rush/chapters/{id}, /rush/chapters/{id}/parties, /rush/chapters/{id}/dues-ledger, /rush/chapters/{id}/preferences"
      - "GET /rush/pnms, /rush/pnms/{id}, /rush/pnms/{id}/invitations, /rush/pnms/{id}/preferences, /rush/pnms/{id}/bid-matches, /rush/pnms/legacy-of/{id}"
      - "GET /rush/rounds, /rush/rounds/{id}, /rush/rounds/{id}/parties, /rush/rounds/{id}/bid-matches"
      - "GET /rush/parties/{id}, /rush/parties/{id}/invitations"
      - "GET /rush/invitations/{id}, /rush/preferences/{id}, /rush/bid-matches/{id}"

  - name: RiskOfficer
    description: "Panhellenic risk-management officer. Files and dismisses risk incidents."
    identity: "opaque"
    exclusive_operations:
      - "POST /rush/risk-incidents"
      - "POST /rush/risk-incidents/{id}/dismiss"
    shared_operations:
      - "GET /rush/chapters, /rush/chapters/{id}, /rush/chapters/{id}/parties, /rush/chapters/{id}/risk-incidents"
      - "GET /rush/parties/{id}, /rush/parties/{id}/risk-incidents"
      - "GET /rush/risk-incidents/{id}"
      - "GET /rush/rounds, /rush/rounds/{id}, /rush/rounds/{id}/parties"

  - name: PNM
    description: "Potential New Member. Acts on their own resources only."
    identity: "entity_backed:PNM"
    exclusive_operations:
      - "POST /rush/pnms/{id}/withdraw"
      - "POST /rush/invitations/{id}/accept"
      - "POST /rush/invitations/{id}/decline"
      - "POST /rush/bid-matches/{id}/accept"
      - "POST /rush/bid-matches/{id}/decline"
    shared_operations:
      - "POST /rush/preferences (side=PNM_TO_CHAPTER only; validator at priority 10 enforces)"
      - "GET /rush/chapters, /rush/chapters/{id}, /rush/chapters/{id}/parties"
      - "GET /rush/pnms/{id}, /rush/pnms/{id}/invitations, /rush/pnms/{id}/preferences, /rush/pnms/{id}/bid-matches"
      - "GET /rush/rounds/{id}, /rush/rounds/{id}/parties"
      - "GET /rush/parties/{id}, /rush/parties/{id}/invitations"
      - "GET /rush/invitations/{id}, /rush/preferences/{id}, /rush/bid-matches/{id}"

  - name: Anonymous
    description: "Unauthenticated caller; used only for PNM self-registration."
    identity: "opaque"
    exclusive_operations:
      - "POST /rush/pnms/register"
    shared_operations: []
