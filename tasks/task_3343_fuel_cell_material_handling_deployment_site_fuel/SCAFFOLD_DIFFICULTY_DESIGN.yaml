  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_schedule_blocked_by_unapproved_assessment
        grounds:
          - validations[priority=16]
          - state_machines.ConversionPlan.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          ConversionPlan -> Assessment pair: scheduling a plan while the site's
          only assessment is SUBMITTED (not APPROVED) is rejected with
          ERR_ASSESSMENT_NOT_APPROVED; approving the assessment (an Assessment
          transition) is what unblocks the plan's transition — the plan cannot
          advance on its own.
        test_recipe:
          setup:
            - "Site with a SUBMITTED (not yet APPROVED) assessment, forklift_count 4; DRAFT plan targeting 4 units"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-XD1", name: "Cross Dep Site 1", address: "10 Gate Rd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 4, duty_cycle_hours_per_day: 8.0, peak_shift_hours: 8, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/conversion-plans"
              payload: { name: "Wave X", target_forklift_count: 4, transition_mode: "PARALLEL", start_date: "2026-10-05", end_date: "2026-10-25", baseline_productivity_units_per_hour: 50.0, expected_productivity_gain_pct: 15 }
              as: SiteManager
              captures: { plan: $.data.id, plan_v: $.data.version }
          trigger:
            - call: "POST /api/sites/${site_id}/conversion-plans/${plan}/schedule"
              payload: { expected_plan_version: "${plan_v}" }
              as: SiteManager
              captures: { err1: $.data.error_id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_id}/conversion-plans/${plan}/schedule"
              payload: { expected_plan_version: "${plan_v}" }
              as: SiteManager
          assert:
            - "first schedule rejected with ERR_ASSESSMENT_NOT_APPROVED (422) while assessment is SUBMITTED"
            - "after approval the identical schedule call succeeds and ConversionPlan.${plan}.status == SCHEDULED"
      - name: fueling_event_blocked_by_station_state
        grounds:
          - validations[priority=9]
          - state_machines.FuelingStation.transitions
        distinguishing_aspect: |
          FuelingEvent -> FuelingStation pair (different entity pair than
          plan->assessment): recording a dispense against a station in
          CONSTRUCTION (not yet COMMISSIONED) is rejected with
          ERR_STATION_NOT_COMMISSIONED even though the contract is ACTIVE and
          in-period; only the station's own commission transition unlocks it.
        test_recipe:
          setup:
            - "Site with ACTIVE contract and a station in CONSTRUCTION (permits issued, construction started, not commissioned)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
