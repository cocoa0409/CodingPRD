      # ---- Instance 2: QueueEntry play depends on parent Reservation.status (QueueEntry<->Reservation) ----
      - name: queue_play_blocked_when_reservation_not_checked_in
        grounds:
          - state_machines.QueueEntry.PENDING_to_PLAYED
          - state_machines.Reservation.HELD_to_CONFIRMED
          - entities.Reservation.fields.status
        distinguishing_aspect: |
          A DIFFERENT entity pair (QueueEntry->Reservation): playing a PENDING QueueEntry is
          rejected ERR_INVALID_STATE while the parent Reservation is only CONFIRMED (not yet
          CHECKED_IN), even though the entry is the head of the queue.
        test_recipe:
          setup:
            - "Reservation 2026-07-19 20:00->22:00 CONFIRMED (not checked in); one PENDING queue entry at head"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Cx2", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Ned", email: "ned@x.com", phone: "1414" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /songs"
              payload: { venue_id: "${v_id}", title: "Early", artist: "E", duration_seconds: 180, language: "EN" }
              as: FrontDesk
              captures: { s_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-19T19:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-19T20:00:00.000Z", slot_end_utc: "2026-07-19T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reservations/${res_id}/queue"
              payload: { song_id: "${s_id}", priority: 10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /queue-entries/${q_id}/play"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "QueueEntry.${q_id}.status == PENDING"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Instance 1: reservation create overlap, adjacency allowed (half-open) ----
      - name: reservation_overlap_rejected_adjacent_allowed
        grounds:
          - validations[priority=10]
          - state_machines.Reservation.HELD_to_CONFIRMED
          - entities.Reservation.fields.slot_start_utc
          - entities.Reservation.fields.slot_end_utc
        distinguishing_aspect: |
          Interval semantics for Reservation create: half-open [start,end). A booking starting
          exactly at an existing booking's end (adjacency, 22:00 start vs 22:00 end) is ALLOWED,
          while one overlapping by even a minute (21:30->23:00) is rejected ERR_ROOM_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "LARGE room; existing HELD reservation 2026-07-20 20:00->22:00"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Ov1", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Ola", email: "ola@x.com", phone: "1515" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-20T10:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-20T20:00:00.000Z", slot_end_utc: "2026-07-20T22:00:00.000Z", expected_room_version: "${room_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res1_id: $.data.id }
            - call: "GET /rooms/${room_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { room_v1: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-20T21:30:00.000Z", slot_end_utc: "2026-07-20T23:00:00.000Z", expected_room_version: "${room_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_ROOM_DOUBLE_BOOKED"

      # ---- Instance 2: extension overlap against a LATER booking (extension-window semantics) ----
      - name: extension_overlap_into_later_booking_rejected
        grounds:
          - validations[priority=11]
          - state_machines.Reservation.HELD_to_CONFIRMED
          - entities.Extension.fields.new_slot_end_utc
        distinguishing_aspect: |
          A DIFFERENT interval semantics on a DIFFERENT resource flow: the extension only checks
          the GROWTH window [old_end, new_end) (not the whole interval) against a later booking
          on the same room. Extending 20:00->22:00 to 23:00 collides with a 22:30->23:30 booking
          and is rejected ERR_EXTENSION_CONFLICT, whereas adjacency at exactly 22:30 would pass.
        test_recipe:
          setup:
            - "LARGE room; reservation R1 2026-07-21 20:00->22:00 (HELD); a later booking R2 22:30->23:30 (HELD) on same room"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Ov2", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Pat", email: "pat@x.com", phone: "1616" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-21T10:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-21T20:00:00.000Z", slot_end_utc: "2026-07-21T22:00:00.000Z", expected_room_version: "${room_v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res1_id: $.data.id }
            - call: "GET /rooms/${room_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { room_v1: $.data.version }
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-21T22:30:00.000Z", slot_end_utc: "2026-07-21T23:30:00.000Z", expected_room_version: "${room_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res2_id: $.data.id }
            - call: "GET /reservations/${res1_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res1_v: $.data.version }
          trigger:
            - call: "POST /reservations/${res1_id}/extensions"
              payload: { new_slot_end_utc: "2026-07-21T23:00:00.000Z", expected_reservation_version: "${res1_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_EXTENSION_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Instance 1: deposit ledger conserved on cancel-refund (Payment ledger nets to 0) ----
      - name: deposit_refund_ledger_nets_to_zero
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Payment.fields.amount_cents
          - entities.Payment.fields.kind
        distinguishing_aspect: |
          Conserved quantity #1 = the reservation's net cash position. Forward action confirm
          appends Payment{DEPOSIT, +3600}; the compensating cancel-outside-cutoff appends
          Payment{REFUND, 3600}, so deposit_collected - refunded == 0; no FORFEIT exists.
        test_recipe:
          setup:
            - "LARGE room base 6000; reservation 2026-07-22 20:00->22:00 confirmed (deposit 3600); clock far before slot (>24h)"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Inv1", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Qi", email: "qi@x.com", phone: "1717" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-20T09:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-22T20:00:00.000Z", slot_end_utc: "2026-07-22T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { deposit: $.data.deposit_cents }
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Reservation.${res_id}.status == CANCELLED"
            - "GET /venues/${v_id}/reservations/${res_id}/payments: sum(amount_cents for kind==DEPOSIT) == 3600"
            - "GET /venues/${v_id}/reservations/${res_id}/payments: sum(amount_cents for kind==DEPOSIT) - sum(amount_cents for kind==REFUND) == 0"

      # ---- Instance 2: room occupancy conserved across check-in/close (room never stuck OCCUPIED) ----
      - name: room_occupancy_conserved_checkin_close
        grounds:
          - state_machines.Room.AVAILABLE_to_OCCUPIED
          - state_machines.Room.OCCUPIED_to_AVAILABLE
          - entities.Room.fields.status
        distinguishing_aspect: |
          Conserved quantity #2 = the count of OCCUPIED rooms (a different conserved quantity than
          instance 1's cash). Check-in (forward) moves the room AVAILABLE->OCCUPIED; the
          compensating close moves it OCCUPIED->AVAILABLE, so the venue's occupied-room count
          returns to 0 after the round trip.
        test_recipe:
          setup:
            - "LARGE room (AVAILABLE); reservation 2026-07-23 20:00->22:00 confirmed, checked in at 20:00 (room OCCUPIED)"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Inv2", timezone: "UTC", peak_start_minute: 1080, peak_end_minute: 1380, peak_multiplier: 1.5, deposit_pct: 0.2, cancellation_cutoff_hours: 24, grace_minutes: 15, overage_grace_minutes: 10 }
              as: VenueManager
              captures: { v_id: $.data.id }
            - call: "POST /room-types"
              payload: { venue_id: "${v_id}", name: "LARGE", capacity: 12, base_hourly_rate_cents: 6000, fb_minimum_cents: 0 }
              as: VenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${v_id}", room_type_id: "${rt_id}", label: "Room 1" }
              as: VenueManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /customers"
              payload: { full_name: "Ray", email: "ray@x.com", phone: "1818" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-23T19:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-23T20:00:00.000Z", slot_end_utc: "2026-07-23T22:00:00.000Z", expected_room_version: "${room_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-23T20:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { room_status_mid: $.data.status }
          trigger:
            - call: "POST /reservations/${res_id}/close"
              payload: { actual_end_utc: "2026-07-23T21:30:00.000Z" }
              as: FrontDesk
          assert:
            - "Room.${room_id}.status == AVAILABLE"
            - "Reservation.${res_id}.status == CLOSED"
