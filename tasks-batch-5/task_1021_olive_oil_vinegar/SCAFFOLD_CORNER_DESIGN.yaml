      - name: order_not_found_on_pay
        claim_type: Violation to Error
        grounds: ["errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "Paying a non-existent order id returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["A member (no orders)."]
          setup_api_calls:
            - call: "POST /api/members"
