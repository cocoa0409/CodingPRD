            - "response.meta.total_count == 1"
            - "Incumbent.${inc1}.status == VACATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_fund_correct_version_succeeds_then_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[fund-position-stale-cost-center]"
          - state_machines.Position.REQUISITIONED_to_FUNDED
          - entities.CostCenter.fields.version
        distinguishing_aspect: "Funding P1 with the observed cost-center version succeeds and bumps CC.version; a second fund of P2 carrying the now-stale (pre-bump) version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["CC1 with P1 and P2 both REQUISITIONED; client observed CC version v0 before any fund"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P2", fte: 0.5 }
              as: HRBP
              captures: { p2: $.data.id }
            - call: "POST /positions/${p2}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
          trigger:
            - call: "POST /positions/${p2}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "response.code == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Position.${p2}.lifecycle_status == REQUISITIONED"

      - name: occ_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds: [entities.Position.fields.version, state_machines.Position.DRAFT_to_REQUISITIONED]
        distinguishing_aspect: "Position.version starts at 1 on create and increments by exactly 1 per mutation: REQUISITION leaves version=2."
        test_recipe:
          setup: ["Grade G07 and CC1 exist"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id, p1_v0: $.data.version }
          trigger:
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
              captures: { p1_v1: $.data.version }
          assert:
            - "Position.${p1}.version == 2"

      - name: cascade_freeze_suspends_open_requisition
        claim_type: cascading_side_effects
        grounds: [state_machines.FreezeOrder.ACTIVE_to_LIFTED, state_machines.Position.FUNDED_to_FROZEN, state_machines.Requisition.OPEN_to_SUSPENDED]
        distinguishing_aspect: "Opening a FreezeOrder covering now cascades the FUNDED position to FROZEN and its OPEN requisition to SUSPENDED in the same request."
        test_recipe:
          setup: ["Clock 2026-02-01. CC1 P1 FUNDED with OPEN requisition RQ1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: FinanceController
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
            - call: "POST /positions/${p1}/requisitions"
              payload: { req_type: "NEW_HIRE", justification: "hire" }
              as: HRBP
              captures: { rq1: $.data.id }
          trigger:
            - call: "POST /cost-centers/${cc1}/freeze-orders"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z", reason: "freeze" }
              as: FinanceController
          assert:
            - "Position.${p1}.lifecycle_status == FROZEN"
            - "Requisition.${rq1}.status == SUSPENDED"
            - "CostCenter.${cc1}.posture == FROZEN"

      - name: derived_available_budget_reconciles_after_fund
        claim_type: derived_field_reconciliation
        grounds: [calculations.available_budget_cents, calculations.committed_cost_cents, state_machines.Position.REQUISITIONED_to_FUNDED]
        distinguishing_aspect: "After funding P1 (planned 6000000) on CC1 (budget 100000000), committed_cost_cents=6000000 and available_budget_cents=94000000 in the same response."
        test_recipe:
          setup: ["CC1 budget 100000000; P1 G07 fte 0.5 REQUISITIONED"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
          trigger:
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
          assert:
            - "CostCenter.${cc1}.committed_cost_cents == 6000000"
            - "CostCenter.${cc1}.available_budget_cents == 94000000"
            - "CostCenter.${cc1}.committed_fte == 0.5"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_committed_cost_visible_in_fund_response
        claim_type: immediate
        grounds: [calculations.committed_cost_cents, state_machines.Position.REQUISITIONED_to_FUNDED]
        distinguishing_aspect: "Funding immediately reflects in the cost center: a GET of CC1 right after FUND already shows committed_cost_cents=6000000 (no lag)."
        test_recipe:
          setup: ["CC1 with P1 G07 fte 0.5 just FUNDED"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id, cc1_v0: $.data.version }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc1}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc1_v0}" }
              as: FinanceController
          trigger:
            - call: "GET /cost-centers/${cc1}"
              payload: {}
              as: FinanceController
          assert:
            - "CostCenter.${cc1}.committed_cost_cents == 6000000"

  # ===========================================================================
  - section: entities
    instances:
      - name: budget_adjustment_increases_available_and_admits_fund
        claim_type: Creation
        grounds:
          - entities.BudgetAdjustment
          - calculations.adjusted_budget_cents
          - calculations.available_budget_cents
        distinguishing_aspect: "Applying a +1 BudgetAdjustment to CC budget 5999999 raises adjusted_budget_cents to 6000000, so funding P1 (planned 6000000) that previously failed now succeeds; available_budget_cents=0."
        test_recipe:
          setup: ["CC8 budget 5999999 fte_cap 5.0; P1 G07 fte 0.5 REQUISITIONED (planned 6000000)"]
          setup_api_calls:
            - call: "POST /grades"
              payload: { code: "G07", band_min_cents: 10000000, band_mid_cents: 12000000, band_max_cents: 15000000, rank: 7 }
              as: CompensationAnalyst
              captures: { g07: $.data.id }
            - call: "POST /cost-centers"
              payload: { name: "Adj", code: "CC8", annual_budget_cents: 5999999, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc8: $.data.id }
            - call: "POST /positions"
              payload: { cost_center_id: "${cc8}", grade_id: "${g07}", title: "P1", fte: 0.5 }
              as: HRBP
              captures: { p1: $.data.id }
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "REQUISITION" }
              as: HRBP
            - call: "POST /cost-centers/${cc8}/budget-adjustments"
              payload: { amount_cents: 1, memo: "top-up" }
              as: FinanceController
            - call: "GET /cost-centers/${cc8}"
              payload: {}
              as: FinanceController
              captures: { cc8_v: $.data.version }
          trigger:
            - call: "POST /positions/${p1}/lifecycle"
              payload: { action: "FUND", expected_cost_center_version: "${cc8_v}" }
              as: FinanceController
          assert:
            - "CostCenter.${cc8}.adjusted_budget_cents == 6000000"
            - "Position.${p1}.lifecycle_status == FUNDED"
            - "CostCenter.${cc8}.available_budget_cents == 0"

      - name: budget_adjustment_reverse_reachable_list
        claim_type: Listing
        grounds: [entities.BudgetAdjustment.fields.cost_center_id, endpoints]
        distinguishing_aspect: "GET /cost-centers/{cc}/budget-adjustments returns the 2 applied adjustments (reverse-reachability for BudgetAdjustment.cost_center_id); total_count=2."
        test_recipe:
          setup: ["CC1 with two applied BudgetAdjustments"]
          setup_api_calls:
            - call: "POST /cost-centers"
              payload: { name: "Eng", code: "CC1", annual_budget_cents: 100000000, fte_cap: 5.0 }
              as: FinanceController
              captures: { cc1: $.data.id }
            - call: "POST /cost-centers/${cc1}/budget-adjustments"
              payload: { amount_cents: 5000, memo: "a1" }
              as: FinanceController
            - call: "POST /cost-centers/${cc1}/budget-adjustments"
              payload: { amount_cents: -2000, memo: "a2" }
              as: FinanceController
          trigger:
            - call: "GET /cost-centers/${cc1}/budget-adjustments"
              payload: {}
              as: FinanceController
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "CostCenter.${cc1}.adjusted_budget_cents == 100003000"

  # ===========================================================================
  # excluded_because stubs — corners already covered by §1.8 instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: excl_reclass_revision_loop
        claim_type: Valid Transition
        grounds: [state_machines.ReclassRequest.UNDER_REVIEW_to_SUBMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_reclass_revision_cycle
          rationale: "The review->return->review revision loop is exercised by the named §1.8 instance."

      - name: excl_position_parallel_dimensions
        claim_type: parallel
        grounds: [state_machines.Position.FILLED_to_VACANT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nlsm_position_parallel_lifecycle_x_occupancy
          rationale: "Independent lifecycle vs occupancy dimensions verified by the named §1.8 instance."

      - name: excl_abolish_cascade_to_incumbent
        claim_type: Compensation
        grounds: [state_machines.Position.FUNDED_to_ABOLISHED]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_abolish_depth2_vacate_incumbent
          rationale: "Abolish-cascade vacating the incumbent and freeing the employee is the named §1.8 instance."

  - section: calculations
    instances:
      - name: excl_committed_cost_dual_variant
        claim_type: Variant Divergence
        grounds: [calculations.committed_cost_cents]
        excluded_because:
          difficulty_instance: dual_variant_calc / dvc_position_cost_planned_vs_actual
          rationale: "Planned-vs-actual divergence of committed_cost_cents is the named §1.8 instance."

      - name: excl_committed_cost_rounding_order
        claim_type: Precision
        grounds: [calculations.planned_cost_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / cf_committed_cost_round_per_position_then_sum_mode_b
          rationale: "Round-per-position-then-sum order is pinned and verified by the named §1.8 instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: excl_snapshot_occ_stale
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[snapshot-period-stale-cost-center]"
        excluded_because:
          difficulty_instance: dual_variant_calc / dvc_forecast_planned_vs_actual_fte
          rationale: "The snapshot path consuming expected_cost_center_version is exercised in the named §1.8 instance's trigger; a dedicated stale-snapshot probe is redundant with the fund OCC probe in §1.9 occ_fund_correct_version_succeeds_then_stale_rejected."
