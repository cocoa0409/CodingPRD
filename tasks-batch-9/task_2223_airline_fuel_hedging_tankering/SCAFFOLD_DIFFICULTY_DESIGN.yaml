              payload: { hedge_instrument_id: "${inst_id}", collateral_type: "CASH", expected_counterparty_version: "${cp_v1}" }
              as: RiskPolicyAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /fuel/collateral-postings/${p1_id}/post"
              payload: { amount_usd: 180000.00 }
              as: RiskPolicyAdmin
