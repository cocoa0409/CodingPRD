    output: LoanRestructure
    side_effects: ["prior ACTIVE restructure -> SUPERSEDED", "loan term/installment recomputed over remaining principal", "increments Loan.version by 1"]

  - method: GET
    path: "/loans/{id}/restructures"
    description: "List restructures of a loan"
