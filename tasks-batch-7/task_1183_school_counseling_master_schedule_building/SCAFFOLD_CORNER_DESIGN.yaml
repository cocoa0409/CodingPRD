              payload: {}
              as: Administrator
            - call: "GET /scheduling/students/${s_drp}"
              as: Administrator
              captures: { load_now: "$.data.planned_credit_load" }
          assert:
            - "planned_credit_load == 1.0 after the drop (DROPPED entry excluded from the input set)"
      - name: singleton_course_forces_single_section
        claim_type: correct_result
        grounds:
          - calculations.section_count_tally
        distinguishing_aspect: "A singleton course with demand 60.0 (ceil(60/25) would be 3 sections) gets exactly 1 section."
        test_recipe:
          setup:
            - "term TALLYING-bound; singleton course SG-1 with 60 SUBMITTED primaries (test-generator loops 60 students)"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Sg", max_caseload: 500 }
              as: Administrator
              captures: { c_sg: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2051-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_sg: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "SG-1", title: "Singleton Seminar", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12, singleton: true }
              as: Administrator
              captures: { k_sg: "$.data.id" }
            # first of 60 identical student+request+submit triplets:
            - call: "POST /scheduling/students"
              payload: { external_ref: "SG01", full_name: "Sg 01", grade_level: 9, counselor_id: "${c_sg}" }
              as: Administrator
              captures: { sg01: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${sg01}", course_id: "${k_sg}", term_id: "${t_sg}", priority_rank: 1 }
              as: Student
              as_user_id: "${sg01}"
              captures: { rq_sg1: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_sg1}/submit"
              payload: {}
              as: Student
              as_user_id: "${sg01}"
            # ... 59 more triplets (external_ref SG02..SG60) ...
            - call: "POST /scheduling/terms/${t_sg}/close-collection"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /scheduling/terms/${t_sg}/generate-sections"
              payload: {}
              as: Administrator
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sg_secs: "$.data" }
          assert:
            - "exactly 1 DRAFT section exists for course ${k_sg} despite demand 60.0 (singleton override beats ceil division)"
      - name: utilization_window_boundary_exclusion
        claim_type: boundary_edge
        grounds:
          - calculations.counselor_utilization
        distinguishing_aspect: "Half-open window [window_start, window_end): an appointment starting exactly at window_end is excluded; booked_minutes counts only the in-window appointment (30 minutes -> utilization 0.0833 over 360)."
        test_recipe:
          setup:
            - "counselor c_wb with BOOKED appointments 2026-05-13 09:00-09:30 (s_wb1) and 2026-05-14 00:00-00:30 (s_wb2); window [2026-05-13T00:00:00Z, 2026-05-14T00:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-13T07:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Wb", max_caseload: 50 }
              as: Administrator
              captures: { c_wb: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "WB1", full_name: "Wb One", grade_level: 9, counselor_id: "${c_wb}" }
              as: Administrator
              captures: { s_wb1: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "WB2", full_name: "Wb Two", grade_level: 9, counselor_id: "${c_wb}" }
              as: Administrator
              captures: { s_wb2: "$.data.id" }
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c_wb}", student_id: "${s_wb1}", start_at: "2026-05-13T09:00:00Z", end_at: "2026-05-13T09:30:00Z" }
              as: Counselor
              as_user_id: "${c_wb}"
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c_wb}", student_id: "${s_wb2}", start_at: "2026-05-14T00:00:00Z", end_at: "2026-05-14T00:30:00Z" }
              as: Counselor
              as_user_id: "${c_wb}"
          trigger:
            - call: "GET /scheduling/counselors/${c_wb}/utilization"
              as: Administrator
              captures: { wb_booked: "$.data.booked_minutes", wb_util: "$.data.utilization" }
          assert:
            - "booked_minutes == 30 (the 2026-05-14T00:00:00Z appointment starts exactly at window_end and is excluded)"
            - "utilization == 0.0833 (30/360, round_half_up 4dp)"

