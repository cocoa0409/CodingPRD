            - call: "POST /financing-applications/${f}/approve"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FORBIDDEN"
            - "FinancingApplication.${f}.status == SUBMITTED"

      - name: missing_role_header_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request whose X-User-Role is not a declared role -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["No valid role header."]
          setup_api_calls: []
          trigger:
            - call: "GET /units"
              as: Intruder
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHENTICATED"

      - name: luthier_cannot_close_ticket_forbidden
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN]", state_machines.RepairTicket.READY_to_CLOSED]
        distinguishing_aspect: "A Luthier calling POST .../close (a SalesAssociate-exclusive op) -> ERR_FORBIDDEN (403)."
        test_recipe:
