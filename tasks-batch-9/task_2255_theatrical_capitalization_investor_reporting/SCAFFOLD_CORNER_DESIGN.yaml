          amount_cents: 15000000
          expected_production_version: ${pv2}
        as: GeneralManager
        as_user_id: u-gm-1
        captures:
          bl2: $.data.id
      - call: GET /budget-lines?production_id=${pr}
        as: GeneralManager
        as_user_id: u-gm-1
      assert:
      - 'Call 1: HTTP 201 - the token matched, and the production moves to version 2'
      - 'Call 2: HTTP 412 with data.error_id == "ERR_STALE_PRODUCTION_VERSION" (expected 1, current 2)'
      - 'Call 3: data.version == 2 - the refused create incremented nothing'
      - 'Call 4: HTTP 201 with the refreshed token, moving the production to version 3'
      - 'Call 5: total_count == 2 and the production reports budget_total_cents == 55000000 - the rejected attempt left no duplicate line'
