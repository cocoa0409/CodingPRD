# =============================================================================
# PRD Benchmark Scaffold — Electronics Trade-In & Device Repair Storefront
# Difficulty band: Expert
# =============================================================================

scenario: |
  556. Electronics Trade-In & Device Repair Storefront (uBreakiFix/Geek Squad style): device diagnosis & repair ticket, parts inventory & order, repair-vs-replace estimate & approval, mail-in vs walk-in, trade-in/buyback grading & payout, data-wipe certificate, protection-plan claim routing, warranty/callback

domain_name: device-repair-storefront
# Flat topology: every entity is a top-level collection reachable from the root.
# api_prefix is the root so scaffold_lint.py can derive each collection segment
# (GET /<collection>/{id}) for FK reverse-reachability.
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation           # parts inventory reservation pool
  complexity_layers:
    - optimistic_concurrency                        # OCC on RepairTicket.version for estimate supersede
    - cascading_side_effects                        # complete/cancel cascade across ticket→estimate→part-order→part
    - dual_variant_calculation                      # provisional-vs-final estimate; quoted-vs-final trade-in payout
    - rate_threshold_triggers                       # repair-vs-replace threshold; warranty window boundary

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting except the
  # ticket→estimate sub-resource and ticket→part-order creation path.

  state_machine_shape: branching
  # RepairTicket and TradeIn both carry cycles (revision / re-grade loops);
  # Estimate and ProtectionPlanClaim fork at a decision point.

  relationship_patterns:
    - one_to_many          # Customer→Device, RepairTicket→Estimate/PartOrder
    - flat_with_references # peer FKs (Device.customer_id, TradeIn.device_id, ...)
    - self_referential     # RepairTicket.original_ticket_id (warranty callback chain)
    - cross_aggregate      # TradeIn depends on DataWipeCertificate; RepairTicket depends on Estimate

  role_model: peer_roles
  # Customer, Technician, ServiceAdvisor, StoreManager each own distinct verbs.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: store_credit_balance_cents, type: integer, source: computed, default: 0, description: "Buyback store-credit ledger balance; credited on TradeIn accept, debited on cancel. Conserved quantity for compensating invariant." }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: certification_level, type: enum, source: input, description: "Labor-rate tier", constraints: "one of {STANDARD, MASTER}" }

  - name: RepairBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_name, type: string, source: input, description: "Physical bench / bay label" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the device" }
      - { name: category, type: enum, source: input, description: "Device class", constraints: "one of {PHONE, LAPTOP, TABLET, WEARABLE}" }
      - { name: brand, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: serial_number, type: string, source: input, description: "IMEI / serial" }
      - { name: market_value_cents, type: integer, source: input, description: "Current replacement / resale value in cents; drives repair-vs-replace and trade-in payout", constraints: ">= 0" }

  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device under repair" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ticket owner" }
      - { name: original_ticket_id, type: string, source: input, default: null, description: "FK -> RepairTicket.id; set only on a warranty-callback ticket, points at the completed ticket it re-opens (self-referential)" }
      - { name: intake_channel, type: enum, source: input, description: "Fulfillment channel", constraints: "one of {WALK_IN, MAIL_IN}" }
      - { name: reported_issue, type: string, source: input, description: "Customer-reported symptom" }
      - { name: is_under_warranty, type: boolean, source: input, default: false, description: "Manufacturer/store warranty flag; waives diagnostic fee when true" }
      - { name: is_callback, type: boolean, source: computed, default: false, description: "True when created via the callback endpoint (original_ticket_id set)" }
      - { name: spend_cap_cents, type: integer, source: input, description: "Customer pre-authorized maximum estimate total in cents; fiscal ceiling on estimate approval", constraints: ">= 0" }
      - { name: assigned_technician_id, type: string, source: input, default: null, description: "FK -> Technician.id; set at diagnose" }
      - { name: assigned_bay_id, type: string, source: input, default: null, description: "FK -> RepairBay.id; set at diagnose" }
      - { name: scheduled_start_at, type: datetime, source: input, default: null, description: "ISO 8601 UTC; bench window start, set at diagnose" }
      - { name: scheduled_end_at, type: datetime, source: input, default: null, description: "ISO 8601 UTC; bench window end, set at diagnose" }
      - { name: completed_at, type: datetime, source: computed, default: null, description: "ISO 8601 UTC; logical-clock instant when the ticket reached COMPLETED; anchors the warranty window" }
      - { name: final_invoice_cents, type: integer, source: computed, default: null, description: "Final invoice total computed at completion from actual labor + INSTALLED part orders + diagnostic fee" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of {INTAKE, DIAGNOSING, AWAITING_APPROVAL, IN_REPAIR, COMPLETED, CANCELLED}" }

  - name: Estimate
    parent: RepairTicket
    common_fields: true
    fields:
      - { name: repair_ticket_id, type: string, source: system, description: "FK -> RepairTicket.id; parent ticket" }
      - { name: revision_number, type: integer, source: computed, description: "1-based; increments per new estimate on the same ticket; the newest is the live estimate" }
      - { name: labor_hours, type: number, source: input, description: "Estimated labor hours priced at the assigned technician's certification rate" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "labor_hours * rate(technician.certification_level)" }
      - { name: parts_cost_cents, type: integer, source: computed, description: "Sum of unit_price_cents*quantity over the ticket's active (RESERVED or REQUESTED or BACKORDERED) part orders at estimate creation" }
      - { name: diagnostic_fee_cents, type: integer, source: computed, description: "DIAGNOSTIC_FEE_CENTS, or 0 when ticket.is_under_warranty" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "labor_cost_cents + parts_cost_cents + diagnostic_fee_cents at creation" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Recomputed at ticket completion from actual labor and INSTALLED part orders; may differ from provisional_total_cents" }
      - { name: recommendation, type: enum, source: computed, description: "Repair-vs-replace advice", constraints: "one of {REPAIR, REPLACE}" }
      - { name: status, type: enum, source: system, description: "Estimate state", constraints: "one of {SENT, APPROVED, REJECTED, SUPERSEDED, FINALIZED}" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit code" }
      - { name: name, type: string, source: input, description: "Part display name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit in cents", constraints: ">= 0" }
      - { name: on_hand_qty, type: integer, source: input, default: 0, description: "Physical units in stock; decremented when a part order is INSTALLED", constraints: ">= 0" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Units held by RESERVED part orders; released on RETURNED, cleared on INSTALLED" }
      - { name: available_qty, type: integer, source: computed, default: 0, description: "on_hand_qty - reserved_qty; conserved quantity for the inventory compensating invariant" }

  - name: PartOrder
    parent: RepairTicket
    common_fields: true
    fields:
      - { name: repair_ticket_id, type: string, source: system, description: "FK -> RepairTicket.id; consuming ticket" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; ordered part" }
      - { name: quantity, type: integer, source: input, description: "Units requested", constraints: ">= 1" }
      - { name: line_cost_cents, type: integer, source: computed, description: "part.unit_price_cents * quantity, frozen at order creation" }
      - { name: status, type: enum, source: system, description: "Reservation lifecycle", constraints: "one of {REQUESTED, RESERVED, BACKORDERED, INSTALLED, RETURNED}" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; seller" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device being bought back" }
      - { name: declared_grade, type: enum, source: input, description: "Customer self-assessed grade at submission", constraints: "one of {A, B, C, D}" }
      - { name: assessed_grade, type: enum, source: input, default: null, description: "Technician grade set at offer", constraints: "one of {A, B, C, D}" }
      - { name: has_accessories, type: boolean, source: input, default: false, description: "Accessory-bonus flag used by the final payout at offer time" }
      - { name: assessed_cosmetic_defect_count, type: integer, source: input, default: 0, description: "Count of cosmetic defects applied as per-defect deductions at offer time", constraints: ">= 0" }
      - { name: quoted_payout_cents, type: integer, source: computed, description: "Provisional buyback quote from declared_grade at submission" }
      - { name: final_payout_cents, type: integer, source: computed, default: null, description: "Final buyback amount from assessed_grade + accessories - cosmetic deductions, set at offer" }
      - { name: status, type: enum, source: system, description: "Buyback state", constraints: "one of {SUBMITTED, OFFER_MADE, ACCEPTED, PAID, DECLINED, CANCELLED}" }

  - name: DataWipeCertificate
    parent: null
    common_fields: false      # immutable event: only id + created_at
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; wiped device" }
      - { name: trade_in_id, type: string, source: input, default: null, description: "FK -> TradeIn.id; buyback this wipe supports (optional)" }
      - { name: method, type: enum, source: input, description: "Wipe method", constraints: "one of {CRYPTO_ERASE, FACTORY_RESET, PHYSICAL_DESTRUCTION}" }
      - { name: wipe_result, type: enum, source: input, description: "Outcome", constraints: "one of {SUCCESS, FAILED}" }
      - { name: certificate_number, type: string, source: system, description: "Server-minted human-readable certificate id (distinct from the UUID id)" }

  - name: ProtectionPlanClaim
    parent: null
    common_fields: true
    fields:
      - { name: repair_ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; ticket the claim funds" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; claimant" }
      - { name: plan_type, type: enum, source: input, description: "Protection plan class; sets deductible and routing", constraints: "one of {ADH, EXTENDED_WARRANTY, ACCESSORY}" }
      - { name: routing_destination, type: enum, source: computed, default: null, description: "Adjudication queue chosen at route time", constraints: "one of {IN_STORE, MANUFACTURER, THIRD_PARTY_ADMIN}" }
      - { name: deductible_cents, type: integer, source: computed, description: "Deductible from plan_type, set at filing" }
      - { name: covered_amount_cents, type: integer, source: computed, default: null, description: "min(ticket estimate total - deductible, COVERAGE_CAP_CENTS), floored at 0; set at approval" }
      - { name: status, type: enum, source: system, description: "Claim state", constraints: "one of {FILED, ROUTED, APPROVED, DENIED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RepairTicket
    field: status
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INTAKE
        to: DIAGNOSING
        trigger: "POST /repair-tickets/{ticketId}/diagnose"
        actor: Technician
        preconditions:
          - "assigned_technician_id references an existing Technician (ERR_TECHNICIAN_NOT_FOUND)"
          - "assigned_bay_id references an existing RepairBay (ERR_BAY_NOT_FOUND)"
          - "scheduled_end_at > scheduled_start_at (ERR_INVALID_INTERVAL)"
          - "No other non-terminal RepairTicket on assigned_technician_id has a half-open [start,end) window overlapping this one (ERR_TECHNICIAN_DOUBLE_BOOKED)"
          - "No other non-terminal RepairTicket on assigned_bay_id has a closed [start,end] window within CLEANING_BUFFER_MINUTES of this one (ERR_BAY_UNAVAILABLE)"
        side_effects:
          - "Sets assigned_technician_id, assigned_bay_id, scheduled_start_at, scheduled_end_at"

      - from: DIAGNOSING
        to: AWAITING_APPROVAL
        trigger: "POST /repair-tickets/{ticketId}/estimates"
        actor: Technician
        preconditions:
          - "expected_repair_ticket_version matches RepairTicket.version (ERR_STALE_TICKET_VERSION)"
        side_effects:
          - "Creates a new Estimate (status=SENT) via calc repair_estimate_total (provisional) and repair_vs_replace_recommendation"
          - "Any prior Estimate on this ticket in status SENT or REJECTED transitions to SUPERSEDED"
          - "increments RepairTicket.version by 1"

      - from: AWAITING_APPROVAL
        to: DIAGNOSING
        trigger: "POST /repair-tickets/{ticketId}/estimates/{estimateId}/reject"
        actor: Customer
        preconditions:
          - "Acting Customer owns the ticket: RepairTicket.customer_id == X-User-ID (ERR_UNAUTHORIZED)"
          - "Estimate.status == SENT (ERR_ESTIMATE_NOT_SENT)"
        side_effects:
          - "Estimate.status -> REJECTED"
        note: "Revision cycle: ticket returns to DIAGNOSING so the technician can post a new estimate."

      - from: AWAITING_APPROVAL
        to: IN_REPAIR
        trigger: "POST /repair-tickets/{ticketId}/estimates/{estimateId}/approve"
        actor: Customer
        preconditions:
          - "Acting Customer owns the ticket: RepairTicket.customer_id == X-User-ID (ERR_UNAUTHORIZED)"
          - "Estimate.status == SENT (ERR_ESTIMATE_NOT_SENT)"
          - "Estimate.provisional_total_cents <= RepairTicket.spend_cap_cents (ERR_SPEND_CAP_EXCEEDED)"
        side_effects:
          - "Estimate.status -> APPROVED (cross-entity: this Estimate is now the ticket's approved estimate)"

      - from: IN_REPAIR
        to: COMPLETED
        trigger: "POST /repair-tickets/{ticketId}/complete"
        actor: Technician
        preconditions:
          - "The ticket has an Estimate in status APPROVED (ERR_ESTIMATE_NOT_APPROVED)"
        side_effects:
          - "Sets completed_at = current logical clock"
          - "Approved Estimate.status APPROVED -> FINALIZED; recomputes Estimate.final_total_cents from actual_labor_hours + INSTALLED part orders (calc repair_estimate_total final variant)"
          - "Each PartOrder on the ticket in status RESERVED -> INSTALLED (this Estimate-finalization step causes the part-order transition)"
          - "final_invoice_cents = Estimate.final_total_cents"

      - from: [INTAKE, DIAGNOSING, AWAITING_APPROVAL]
        to: CANCELLED
        trigger: "POST /repair-tickets/{ticketId}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "RepairTicket.status in {INTAKE, DIAGNOSING, AWAITING_APPROVAL} (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "Each PartOrder on the ticket in status RESERVED -> RETURNED (this ticket-cancel step causes the part-order transition)"
          - "Any live Estimate (SENT) -> SUPERSEDED"

  - entity: Estimate
    field: status
    initial_state: SENT
    terminal_states: [SUPERSEDED, FINALIZED]
    transitions:
      - from: SENT
        to: APPROVED
        trigger: "POST /repair-tickets/{ticketId}/estimates/{estimateId}/approve"
        actor: Customer
        preconditions:
          - "Parent RepairTicket.status == AWAITING_APPROVAL (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "Drives RepairTicket AWAITING_APPROVAL -> IN_REPAIR"
      - from: SENT
        to: REJECTED
        trigger: "POST /repair-tickets/{ticketId}/estimates/{estimateId}/reject"
        actor: Customer
        preconditions:
          - "Parent RepairTicket.status == AWAITING_APPROVAL (ERR_TICKET_INVALID_STATE)"
        side_effects:
          - "Drives RepairTicket AWAITING_APPROVAL -> DIAGNOSING"
      - from: [SENT, REJECTED]
        to: SUPERSEDED
        trigger: "system (a newer Estimate is created on the same ticket, or the ticket is cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: FINALIZED
        trigger: "system (ticket completion)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets final_total_cents (final variant)"
          - "Each RESERVED PartOrder on the ticket -> INSTALLED (caused by this finalization)"

  - entity: PartOrder
    field: status
    initial_state: REQUESTED
    terminal_states: [INSTALLED, RETURNED]
    transitions:
      - from: REQUESTED
        to: RESERVED
        trigger: "POST /repair-tickets/{ticketId}/part-orders (auto on creation)"
        actor: Technician
        preconditions:
          - "part.available_qty >= quantity (else the order is created BACKORDERED instead)"
        side_effects:
          - "Part.reserved_qty += quantity; recompute Part.available_qty"
      - from: REQUESTED
        to: BACKORDERED
        trigger: "POST /repair-tickets/{ticketId}/part-orders (auto on creation)"
        actor: Technician
        preconditions:
          - "part.available_qty < quantity"
        side_effects: []
      - from: BACKORDERED
        to: RESERVED
        trigger: "POST /part-orders/{partOrderId}/restock"
        actor: StoreManager
        preconditions:
          - "part.available_qty >= quantity (ERR_PART_OUT_OF_STOCK)"
        side_effects:
          - "Part.reserved_qty += quantity; recompute Part.available_qty"
      - from: RESERVED
        to: INSTALLED
        trigger: "system (parent ticket completion via Estimate finalization)"
        actor: system
        preconditions: []
        side_effects:
          - "Part.on_hand_qty -= quantity; Part.reserved_qty -= quantity; recompute Part.available_qty (caused by this INSTALLED transition)"
      - from: RESERVED
        to: RETURNED
        trigger: "system (parent ticket cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "Part.reserved_qty -= quantity; recompute Part.available_qty (caused by this RETURNED transition)"

  - entity: TradeIn
    field: status
    initial_state: SUBMITTED
    terminal_states: [PAID, DECLINED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: OFFER_MADE
        trigger: "POST /trade-ins/{tradeInId}/offer"
        actor: Technician
        preconditions:
          - "assessed_grade is one of {A,B,C,D} (ERR_VALIDATION)"
        side_effects:
          - "Sets assessed_grade, has_accessories, assessed_cosmetic_defect_count"
          - "Computes final_payout_cents via calc trade_in_payout (final/assessed variant)"
      - from: OFFER_MADE
        to: SUBMITTED
        trigger: "POST /trade-ins/{tradeInId}/dispute"
        actor: Customer
        preconditions:
          - "Acting Customer owns the trade-in: TradeIn.customer_id == X-User-ID (ERR_UNAUTHORIZED)"
        side_effects:
          - "Clears assessed_grade and final_payout_cents (re-grade loop)"
        note: "Re-grade cycle: customer disputes the offer, technician re-offers."
      - from: OFFER_MADE
        to: ACCEPTED
        trigger: "POST /trade-ins/{tradeInId}/accept"
        actor: Customer
        preconditions:
          - "Acting Customer owns the trade-in: TradeIn.customer_id == X-User-ID (ERR_UNAUTHORIZED)"
        side_effects:
          - "Customer.store_credit_balance_cents += final_payout_cents (forward action of compensating invariant)"
      - from: OFFER_MADE
        to: DECLINED
        trigger: "POST /trade-ins/{tradeInId}/decline"
        actor: Customer
        preconditions:
          - "Acting Customer owns the trade-in: TradeIn.customer_id == X-User-ID (ERR_UNAUTHORIZED)"
        side_effects: []
      - from: ACCEPTED
        to: PAID
        trigger: "POST /trade-ins/{tradeInId}/pay"
        actor: StoreManager
        preconditions:
          - "TradeIn.device_id has NO RepairTicket whose status is in {INTAKE, DIAGNOSING, AWAITING_APPROVAL, IN_REPAIR} (ERR_DEVICE_HAS_ACTIVE_TICKET)"
          - "A DataWipeCertificate exists for TradeIn.device_id with wipe_result == SUCCESS (ERR_DATA_WIPE_REQUIRED)"
        side_effects:
          - "Payout finalized; store credit already applied at accept is retained"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /trade-ins/{tradeInId}/cancel"
        actor: ServiceAdvisor
        preconditions:
          - "TradeIn.status == ACCEPTED (ERR_TRADE_IN_INVALID_STATE)"
        side_effects:
          - "Customer.store_credit_balance_cents -= final_payout_cents (compensating action; restores the conserved balance)"

  - entity: ProtectionPlanClaim
    field: status
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: ROUTED
        trigger: "POST /protection-plan-claims/{claimId}/route"
        actor: ServiceAdvisor
        preconditions: []
        side_effects:
          - "Sets routing_destination from plan_type (ADH->IN_STORE, EXTENDED_WARRANTY->MANUFACTURER, ACCESSORY->THIRD_PARTY_ADMIN)"
      - from: ROUTED
        to: APPROVED
        trigger: "POST /protection-plan-claims/{claimId}/approve"
        actor: StoreManager
        preconditions:
          - "The claim's RepairTicket has an Estimate in status APPROVED or FINALIZED (ERR_ESTIMATE_NOT_APPROVED)"
        side_effects:
          - "Computes covered_amount_cents via calc protection_covered_amount"
      - from: ROUTED
        to: DENIED
        trigger: "POST /protection-plan-claims/{claimId}/deny"
        actor: StoreManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-ticket
    parent_entity: RepairTicket
    write_endpoint: "POST /repair-tickets/{ticketId}/estimates"
    occ_field: "expected_repair_ticket_version"
    description: |
      Creating a new Estimate against a RepairTicket whose version has advanced
      since the client last observed it is rejected. A newly created Estimate
      legitimately supersedes the prior live Estimate on the ticket, so a second
      creation that still carries the pre-supersede version is operating on a
      stale view of the ticket and is refused on the version check.
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: repair_estimate_total
    trigger: "Estimate creation (provisional variant) and RepairTicket completion (final variant)"
    algorithm: forward_looking
    formula: |
      rate_cents_per_hour = LABOR_RATE_STANDARD if technician.certification_level == "STANDARD"
                            else LABOR_RATE_MASTER   # "MASTER"
      labor_cost_cents = round_half_up(labor_hours * rate_cents_per_hour)
      parts_cost_cents = sum(po.line_cost_cents for po in part_orders_in_set)
      diagnostic_fee_cents = 0 if ticket.is_under_warranty else DIAGNOSTIC_FEE_CENTS
      total_cents = labor_cost_cents + parts_cost_cents + diagnostic_fee_cents
    input_set: "Provisional: labor_hours from the estimate request, part_orders_in_set = ticket's part orders in {REQUESTED, RESERVED, BACKORDERED}. Final: labor_hours = actual_labor_hours from the complete request, part_orders_in_set = ticket's part orders in {INSTALLED}."
    constants:
      LABOR_RATE_STANDARD: 5000
      LABOR_RATE_MASTER: 8000
      DIAGNOSTIC_FEE_CENTS: 4000
    precision: "integer cents; round_half_up on the labor term before summing"
    variants:
      - name: provisional_total_cents
        when: "Estimate creation (ticket DIAGNOSING -> AWAITING_APPROVAL)"
        difference: "Uses estimated labor_hours and reserved/requested part orders; written to Estimate.provisional_total_cents."
      - name: final_total_cents
        when: "Ticket completion (IN_REPAIR -> COMPLETED)"
        difference: "Uses actual_labor_hours and INSTALLED part orders only; written to Estimate.final_total_cents; may diverge from provisional."

  - name: repair_vs_replace_recommendation
    trigger: "Estimate creation"
    algorithm: threshold
    formula: |
      if provisional_total_cents >= round_half_up(REPLACE_THRESHOLD_PCT * device.market_value_cents):
        recommendation = "REPLACE"
      else:
        recommendation = "REPAIR"
    input_set: "The just-computed provisional_total_cents of this estimate and the linked Device.market_value_cents."
    constants:
      REPLACE_THRESHOLD_PCT: 0.60
    precision: "Compare integer cents; threshold value rounded_half_up. Boundary is inclusive (>=)."

  - name: trade_in_payout
    trigger: "TradeIn submission (quoted/declared variant) and TradeIn offer (final/assessed variant)"
    algorithm: weighted_scoring
    formula: |
      # Pinned rounding order: round EACH component to whole cents, THEN sum.
      base = device.market_value_cents
      graded_value_cents   = round_half_up(base * GRADE_MULTIPLIER[grade])
      accessory_bonus_cents = round_half_up(base * ACCESSORY_BONUS_PCT) if has_accessories else 0
      cosmetic_each_cents   = round_half_up(base * COSMETIC_DEDUCT_PCT)
      payout_cents = graded_value_cents + accessory_bonus_cents - (cosmetic_each_cents * cosmetic_defect_count)
      payout_cents = max(payout_cents, 0)
    input_set: "Quoted: grade=declared_grade, has_accessories=false, cosmetic_defect_count=0 (submission-time defaults). Final: grade=assessed_grade, has_accessories and cosmetic_defect_count from the offer request."
    constants:
      GRADE_MULTIPLIER: { A: 0.90, B: 0.70, C: 0.45, D: 0.20 }
      ACCESSORY_BONUS_PCT: 0.05
      COSMETIC_DEDUCT_PCT: 0.03
    precision: "integer cents, round_half_up per component BEFORE summation (round-then-sum, NOT sum-then-round)"
    variants:
      - name: quoted_payout_cents
        when: "TradeIn submission (POST /trade-ins)"
        difference: "grade = declared_grade; no accessory bonus; no cosmetic deductions."
      - name: final_payout_cents
        when: "TradeIn offer (SUBMITTED -> OFFER_MADE)"
        difference: "grade = assessed_grade; accessory bonus and per-defect deductions applied; may diverge from quoted."

  - name: part_availability
    trigger: "Any PartOrder reservation, restock, install, or return"
    algorithm: aggregation
    formula: |
      Part.available_qty = Part.on_hand_qty - Part.reserved_qty
    input_set: "The single Part row being mutated."
    precision: "integer units"

  - name: protection_covered_amount
    trigger: "ProtectionPlanClaim approval (ROUTED -> APPROVED)"
    algorithm: threshold
    formula: |
      deductible_cents = DEDUCTIBLE_BY_PLAN[plan_type]
      estimate_total = final_total_cents if the ticket's approved Estimate is FINALIZED
                       else provisional_total_cents of that approved Estimate
      covered_amount_cents = max(0, min(estimate_total - deductible_cents, COVERAGE_CAP_CENTS))
    input_set: "The claim's plan_type deductible and the approved Estimate on the claim's RepairTicket (FINALIZED total preferred, else provisional)."
    constants:
      DEDUCTIBLE_BY_PLAN: { ADH: 7500, EXTENDED_WARRANTY: 0, ACCESSORY: 2500 }
      COVERAGE_CAP_CENTS: 50000
    precision: "integer cents"

  - name: warranty_window_eligibility
    trigger: "Warranty callback creation (POST /repair-tickets/{ticketId}/callback)"
    algorithm: threshold
    formula: |
      expiry = original.completed_at + WARRANTY_DAYS days
      eligible = current_logical_clock <= expiry     # inclusive boundary
      if not eligible: reject ERR_WARRANTY_EXPIRED
    input_set: "The original (referenced) RepairTicket.completed_at and the current logical clock."
    constants:
      WARRANTY_DAYS: 90
    precision: "UTC instants; inclusive at expiry (<=)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is one of the declared roles"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this operation; for Customer-owned actions X-User-ID equals the resource's customer_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist, validated left-to-right (ticket, then estimate/part-order; referenced device/customer/technician/bay/part/trade-in)"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_TECHNICIAN_NOT_FOUND / ERR_BAY_NOT_FOUND / ERR_DEVICE_NOT_FOUND / ERR_TICKET_NOT_FOUND / ERR_ESTIMATE_NOT_FOUND / ERR_PART_NOT_FOUND / ERR_PART_ORDER_NOT_FOUND / ERR_TRADE_IN_NOT_FOUND / ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body references

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, quantity >= 1, interval end > start"
    error_id: "ERR_VALIDATION / ERR_INVALID_QUANTITY / ERR_INVALID_INTERVAL"
    http_status: 422
    applies_to: all POST endpoints with a body

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: "ERR_TICKET_INVALID_STATE / ERR_ESTIMATE_NOT_SENT / ERR_ESTIMATE_NOT_APPROVED / ERR_TRADE_IN_INVALID_STATE / ERR_PART_ORDER_INVALID_STATE / ERR_CLAIM_INVALID_STATE"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "On TradeIn pay, the trade-in's device must have NO RepairTicket in a non-terminal status {INTAKE, DIAGNOSING, AWAITING_APPROVAL, IN_REPAIR}"
    error_id: ERR_DEVICE_HAS_ACTIVE_TICKET
    http_status: 409
    applies_to: "POST /trade-ins/{tradeInId}/pay"

  - priority: 7
    category: business_safety
    check: "On TradeIn pay, a DataWipeCertificate with wipe_result==SUCCESS must exist for the device (data-sanitization compliance)"
    error_id: ERR_DATA_WIPE_REQUIRED
    http_status: 422
    applies_to: "POST /trade-ins/{tradeInId}/pay"

  - priority: 8
    category: business_temporal
    check: "Technician half-open window overlap on diagnose; RepairBay closed window + CLEANING_BUFFER_MINUTES overlap on diagnose; warranty window inclusive expiry on callback"
    error_id: "ERR_TECHNICIAN_DOUBLE_BOOKED / ERR_BAY_UNAVAILABLE / ERR_WARRANTY_EXPIRED"
    http_status: "409 (booking) / 422 (warranty)"
    applies_to: "POST /repair-tickets/{ticketId}/diagnose, POST /repair-tickets/{ticketId}/callback"

  - priority: 9
    category: business_constraint
    check: "PartOrder restock requires part.available_qty >= quantity"
    error_id: ERR_PART_OUT_OF_STOCK
    http_status: 409
    applies_to: "POST /part-orders/{partOrderId}/restock"

  - priority: 10
    category: business_fiscal
    check: "On estimate approval, the estimate provisional_total_cents must not exceed the ticket's spend_cap_cents"
    error_id: ERR_SPEND_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /repair-tickets/{ticketId}/estimates/{estimateId}/approve"

  - priority: 11
    category: state
    check: "Optimistic-concurrency: expected_repair_ticket_version must equal RepairTicket.version on estimate creation"
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412
    applies_to: "POST /repair-tickets/{ticketId}/estimates"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time."
    roles: [StoreManager, ServiceAdvisor, Technician, Customer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the logical clock used by completed_at and warranty_window_eligibility"]

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer"
    roles: [ServiceAdvisor]
    code: 201
    input: [full_name, email, phone]
    output: Customer
    side_effects: ["status implicit; store_credit_balance_cents=0"]
  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer (exposes store_credit_balance_cents)"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Technician ----
  - method: POST
    path: "/technicians"
    description: "Create a technician"
    roles: [StoreManager]
    code: 201
    input: [full_name, certification_level]
    output: Technician
    side_effects: []

  # ---- RepairBay ----
  - method: POST
    path: "/repair-bays"
    description: "Create a repair bay"
    roles: [StoreManager]
    code: 201
    input: [bay_name]
    output: RepairBay
    side_effects: []

  # ---- Device ----
  - method: POST
    path: "/devices"
    description: "Register a device"
    roles: [ServiceAdvisor]
    code: 201
    input: [customer_id, category, brand, model, serial_number, market_value_cents]
    output: Device
    side_effects: []
  - method: GET
    path: "/devices/{deviceId}"
    description: "Get a device"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: Device
    side_effects: []
  - method: GET
    path: "/devices"
    description: "List devices; filter by customer_id (FK reverse-reachability for Device.customer_id)"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: "Device[]"
    side_effects: []

  # ---- RepairTicket ----
  - method: POST
    path: "/repair-tickets"
    description: "Open a repair ticket (walk-in or mail-in)"
    roles: [ServiceAdvisor]
    code: 201
    input: [device_id, customer_id, intake_channel, reported_issue, "is_under_warranty?", spend_cap_cents]
    output: RepairTicket
    side_effects: ["status=INTAKE; is_callback=false"]
  - method: GET
    path: "/repair-tickets/{ticketId}"
    description: "Get a repair ticket"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []
  - method: GET
    path: "/repair-tickets"
    description: "List/filter repair tickets (FK reverse-reachability for device_id, customer_id, assigned_technician_id, assigned_bay_id, original_ticket_id)"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: ["device_id?", "customer_id?", "assigned_technician_id?", "assigned_bay_id?", "original_ticket_id?", "status?", "limit?", "offset?"]
    output: "RepairTicket[]"
    side_effects: []
  - method: POST
    path: "/repair-tickets/{ticketId}/diagnose"
    description: "Assign technician + bay + schedule window; runs technician and bay overlap checks"
    roles: [Technician]
    code: 200
    input: [assigned_technician_id, assigned_bay_id, scheduled_start_at, scheduled_end_at]
    output: RepairTicket
    side_effects: ["status INTAKE -> DIAGNOSING"]
  - method: POST
    path: "/repair-tickets/{ticketId}/estimates"
    description: "Post a new estimate (supersedes prior live estimate); OCC-guarded on ticket version"
    roles: [Technician]
    code: 201
    input: [labor_hours, expected_repair_ticket_version]
    output: Estimate
    side_effects:
      - "Creates Estimate (status=SENT); computes provisional_total_cents and recommendation"
      - "Prior Estimate in {SENT, REJECTED} -> SUPERSEDED"
      - "status DIAGNOSING -> AWAITING_APPROVAL"
      - "increments RepairTicket.version by 1"
  - method: GET
    path: "/repair-tickets/{id}/estimates"
    description: "List estimates for a ticket (FK reverse-reachability for Estimate.repair_ticket_id; parent placeholder is {id})"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Estimate[]"
    side_effects: []
  - method: GET
    path: "/repair-tickets/{ticketId}/estimates/{estimateId}"
    description: "Get a specific estimate"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: POST
    path: "/repair-tickets/{ticketId}/estimates/{estimateId}/approve"
    description: "Customer approves the estimate (fiscal spend-cap check); ticket enters repair"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["Estimate SENT -> APPROVED; ticket AWAITING_APPROVAL -> IN_REPAIR"]
  - method: POST
    path: "/repair-tickets/{ticketId}/estimates/{estimateId}/reject"
    description: "Customer rejects the estimate; ticket returns to diagnosing (revision cycle)"
    roles: [Customer]
    code: 200
    input: []
    output: Estimate
    side_effects: ["Estimate SENT -> REJECTED; ticket AWAITING_APPROVAL -> DIAGNOSING"]
  - method: POST
    path: "/repair-tickets/{ticketId}/complete"
    description: "Complete repair; finalizes estimate, installs parts, decrements inventory"
    roles: [Technician]
    code: 200
    input: [actual_labor_hours]
    output: RepairTicket
    side_effects:
      - "status IN_REPAIR -> COMPLETED; sets completed_at"
      - "Approved Estimate -> FINALIZED; sets final_total_cents; final_invoice_cents set"
      - "RESERVED part orders -> INSTALLED; Part.on_hand_qty and reserved_qty decremented"
  - method: POST
    path: "/repair-tickets/{ticketId}/cancel"
    description: "Cancel a non-terminal ticket; returns reserved parts"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: RepairTicket
    side_effects:
      - "status -> CANCELLED"
      - "RESERVED part orders -> RETURNED; Part.reserved_qty released"
      - "Live SENT estimate -> SUPERSEDED"
  - method: POST
    path: "/repair-tickets/{ticketId}/callback"
    description: "Open a warranty-callback ticket referencing a completed ticket; validates the warranty window"
    roles: [ServiceAdvisor]
    code: 201
    input: [reported_issue, intake_channel]
    output: RepairTicket
    side_effects:
      - "Creates a new RepairTicket with original_ticket_id={ticketId}, is_callback=true, is_under_warranty=true, status=INTAKE, spend_cap_cents copied from the original"
      - "warranty_window_eligibility must pass"

  # ---- Part ----
  - method: POST
    path: "/parts"
    description: "Create a part with opening stock"
    roles: [StoreManager]
    code: 201
    input: [sku, name, unit_price_cents, "on_hand_qty?"]
    output: Part
    side_effects: ["reserved_qty=0; available_qty=on_hand_qty"]
  - method: GET
    path: "/parts/{partId}"
    description: "Get a part (exposes on_hand_qty, reserved_qty, available_qty)"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: Part
    side_effects: []
  - method: POST
    path: "/parts/{partId}/receive-stock"
    description: "Receive additional units into on_hand stock"
    roles: [StoreManager]
    code: 200
    input: [quantity]
    output: Part
    side_effects: ["Part.on_hand_qty += quantity; recompute available_qty"]

  # ---- PartOrder ----
  - method: POST
    path: "/repair-tickets/{ticketId}/part-orders"
    description: "Order a part for a ticket; auto-reserves if available else backorders"
    roles: [Technician]
    code: 201
    input: [part_id, quantity]
    output: PartOrder
    side_effects:
      - "line_cost_cents frozen; status REQUESTED -> RESERVED (reserve inventory) or BACKORDERED"
  - method: GET
    path: "/part-orders/{partOrderId}"
    description: "Get a part order"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: PartOrder
    side_effects: []
  - method: GET
    path: "/part-orders"
    description: "List/filter part orders (FK reverse-reachability for repair_ticket_id and part_id)"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: ["repair_ticket_id?", "part_id?", "limit?", "offset?"]
    output: "PartOrder[]"
    side_effects: []
  - method: POST
    path: "/part-orders/{partOrderId}/restock"
    description: "Reserve a backordered part order once stock is available"
    roles: [StoreManager]
    code: 200
    input: []
    output: PartOrder
    side_effects: ["status BACKORDERED -> RESERVED; Part.reserved_qty += quantity"]

  # ---- TradeIn ----
  - method: POST
    path: "/trade-ins"
    description: "Submit a device for buyback; computes the provisional quoted payout"
    roles: [ServiceAdvisor]
    code: 201
    input: [customer_id, device_id, declared_grade]
    output: TradeIn
    side_effects: ["status=SUBMITTED; quoted_payout_cents computed"]
  - method: GET
    path: "/trade-ins/{tradeInId}"
    description: "Get a trade-in"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: TradeIn
    side_effects: []
  - method: GET
    path: "/trade-ins"
    description: "List/filter trade-ins (FK reverse-reachability for customer_id and device_id)"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: ["customer_id?", "device_id?", "limit?", "offset?"]
    output: "TradeIn[]"
    side_effects: []
  - method: POST
    path: "/trade-ins/{tradeInId}/offer"
    description: "Technician grades the device and makes a final buyback offer"
    roles: [Technician]
    code: 200
    input: [assessed_grade, "has_accessories?", "assessed_cosmetic_defect_count?"]
    output: TradeIn
    side_effects: ["status SUBMITTED -> OFFER_MADE; final_payout_cents computed"]
  - method: POST
    path: "/trade-ins/{tradeInId}/dispute"
    description: "Customer disputes the offer; trade-in returns to submitted for re-grade"
    roles: [Customer]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["status OFFER_MADE -> SUBMITTED; clears assessed_grade and final_payout_cents"]
  - method: POST
    path: "/trade-ins/{tradeInId}/accept"
    description: "Customer accepts the offer; store credit applied"
    roles: [Customer]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["status OFFER_MADE -> ACCEPTED; Customer.store_credit_balance_cents += final_payout_cents"]
  - method: POST
    path: "/trade-ins/{tradeInId}/decline"
    description: "Customer declines the offer"
    roles: [Customer]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["status OFFER_MADE -> DECLINED"]
  - method: POST
    path: "/trade-ins/{tradeInId}/pay"
    description: "Store issues the buyback payout; requires clean device (no active ticket) and a successful data-wipe certificate"
    roles: [StoreManager]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["status ACCEPTED -> PAID"]
  - method: POST
    path: "/trade-ins/{tradeInId}/cancel"
    description: "Cancel an accepted trade-in before payout; reverses store credit"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["status ACCEPTED -> CANCELLED; Customer.store_credit_balance_cents -= final_payout_cents"]

  # ---- DataWipeCertificate ----
  - method: POST
    path: "/data-wipe-certificates"
    description: "Issue an immutable data-wipe certificate for a device"
    roles: [Technician]
    code: 201
    input: [device_id, "trade_in_id?", method, wipe_result]
    output: DataWipeCertificate
    side_effects: ["certificate_number minted"]
  - method: GET
    path: "/data-wipe-certificates/{certificateId}"
    description: "Get a data-wipe certificate"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: DataWipeCertificate
    side_effects: []
  - method: GET
    path: "/data-wipe-certificates"
    description: "List/filter certificates (FK reverse-reachability for device_id and trade_in_id)"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: ["device_id?", "trade_in_id?", "limit?", "offset?"]
    output: "DataWipeCertificate[]"
    side_effects: []

  # ---- ProtectionPlanClaim ----
  - method: POST
    path: "/protection-plan-claims"
    description: "File a protection-plan claim against a ticket"
    roles: [ServiceAdvisor]
    code: 201
    input: [repair_ticket_id, customer_id, plan_type]
    output: ProtectionPlanClaim
    side_effects: ["status=FILED; deductible_cents set from plan_type"]
  - method: GET
    path: "/protection-plan-claims/{claimId}"
    description: "Get a claim"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: []
    output: ProtectionPlanClaim
    side_effects: []
  - method: GET
    path: "/protection-plan-claims"
    description: "List/filter claims (FK reverse-reachability for repair_ticket_id and customer_id)"
    roles: [Customer, Technician, ServiceAdvisor, StoreManager]
    code: 200
    input: ["repair_ticket_id?", "customer_id?", "limit?", "offset?"]
    output: "ProtectionPlanClaim[]"
    side_effects: []
  - method: POST
    path: "/protection-plan-claims/{claimId}/route"
    description: "Route a filed claim to its adjudication queue"
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ProtectionPlanClaim
    side_effects: ["status FILED -> ROUTED; routing_destination set"]
  - method: POST
    path: "/protection-plan-claims/{claimId}/approve"
    description: "Approve a routed claim; computes covered_amount"
    roles: [StoreManager]
    code: 200
    input: []
    output: ProtectionPlanClaim
    side_effects: ["status ROUTED -> APPROVED; covered_amount_cents computed"]
  - method: POST
    path: "/protection-plan-claims/{claimId}/deny"
    description: "Deny a routed claim"
    roles: [StoreManager]
    code: 200
    input: []
    output: ProtectionPlanClaim
    side_effects: ["status ROUTED -> DENIED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Customer acting on a resource it does not own" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, malformed body, or enum value out of range" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "Part order / receive-stock quantity < 1" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "scheduled_end_at <= scheduled_start_at on diagnose" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced customer does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Referenced technician does not exist" }
  - { id: ERR_BAY_NOT_FOUND, http: 404, condition: "Referenced repair bay does not exist" }
  - { id: ERR_DEVICE_NOT_FOUND, http: 404, condition: "Referenced device does not exist" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "Repair ticket does not exist" }
  - { id: ERR_ESTIMATE_NOT_FOUND, http: 404, condition: "Estimate does not exist under the ticket" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "Referenced part does not exist" }
  - { id: ERR_PART_ORDER_NOT_FOUND, http: 404, condition: "Part order does not exist" }
  - { id: ERR_TRADE_IN_NOT_FOUND, http: 404, condition: "Trade-in does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Protection-plan claim does not exist" }
  - { id: ERR_TICKET_INVALID_STATE, http: 409, condition: "Ticket not in a valid state for the requested transition" }
  - { id: ERR_ESTIMATE_NOT_SENT, http: 409, condition: "approve/reject requires the estimate to be SENT" }
  - { id: ERR_ESTIMATE_NOT_APPROVED, http: 409, condition: "complete/claim-approve requires an APPROVED (or FINALIZED) estimate on the ticket" }
  - { id: ERR_TRADE_IN_INVALID_STATE, http: 409, condition: "Trade-in not in a valid state for the requested transition" }
  - { id: ERR_PART_ORDER_INVALID_STATE, http: 409, condition: "restock requires the part order to be BACKORDERED" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim not in a valid state for route/approve/deny" }
  - { id: ERR_DEVICE_HAS_ACTIVE_TICKET, http: 409, condition: "Trade-in payout blocked: device still has a non-terminal repair ticket" }
  - { id: ERR_DATA_WIPE_REQUIRED, http: 422, condition: "Trade-in payout blocked: no successful data-wipe certificate for the device" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "Technician's half-open schedule window overlaps another ticket" }
  - { id: ERR_BAY_UNAVAILABLE, http: 409, condition: "Repair bay window overlaps another ticket within the cleaning buffer" }
  - { id: ERR_PART_OUT_OF_STOCK, http: 409, condition: "restock requested but part.available_qty < quantity" }
  - { id: ERR_SPEND_CAP_EXCEEDED, http: 402, condition: "Estimate provisional total exceeds the ticket's spend cap" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Callback filed after the original ticket's warranty window closed" }
  - { id: ERR_STALE_TICKET_VERSION, http: 412, condition: "expected_repair_ticket_version does not match the ticket's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Device owner; approves/rejects estimates and disputes/accepts/declines buyback offers on their own resources."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /repair-tickets/{ticketId}/estimates/{estimateId}/approve"
      - "POST /repair-tickets/{ticketId}/estimates/{estimateId}/reject"
      - "POST /trade-ins/{tradeInId}/dispute"
      - "POST /trade-ins/{tradeInId}/accept"
      - "POST /trade-ins/{tradeInId}/decline"
    shared_operations:
      - "GET endpoints (read own and reference data)"
      - "POST /_clock/set_current_utc"

  - name: Technician
    description: "Bench technician; diagnoses, estimates, orders parts, completes repairs, grades trade-ins, issues data-wipe certificates."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /repair-tickets/{ticketId}/diagnose"
      - "POST /repair-tickets/{ticketId}/estimates"
      - "POST /repair-tickets/{ticketId}/complete"
      - "POST /repair-tickets/{ticketId}/part-orders"
      - "POST /trade-ins/{tradeInId}/offer"
      - "POST /data-wipe-certificates"
    shared_operations:
      - "GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: ServiceAdvisor
    description: "Front-desk operator; registers customers/devices, opens/cancels tickets and callbacks, submits/cancels trade-ins, files/routes protection claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /devices"
      - "POST /repair-tickets"
      - "POST /repair-tickets/{ticketId}/cancel"
      - "POST /repair-tickets/{ticketId}/callback"
      - "POST /trade-ins"
      - "POST /trade-ins/{tradeInId}/cancel"
      - "POST /protection-plan-claims"
      - "POST /protection-plan-claims/{claimId}/route"
    shared_operations:
      - "GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: StoreManager
    description: "Store operator; provisions technicians/bays/parts, restocks, issues buyback payouts, adjudicates protection claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /technicians"
      - "POST /repair-bays"
      - "POST /parts"
      - "POST /parts/{partId}/receive-stock"
      - "POST /part-orders/{partOrderId}/restock"
      - "POST /trade-ins/{tradeInId}/pay"
      - "POST /protection-plan-claims/{claimId}/approve"
      - "POST /protection-plan-claims/{claimId}/deny"
    shared_operations:
      - "GET endpoints"
      - "POST /_clock/set_current_utc"
