              as: PortfolioManager
            - call: "POST /mgmt/properties/${p7_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { ob7_id: $.data.id }
            - call: "POST /mgmt/properties/${p7_id}/residents"
