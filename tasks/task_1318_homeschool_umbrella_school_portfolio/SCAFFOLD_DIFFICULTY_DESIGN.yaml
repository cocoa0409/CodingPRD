          - state_machines.Portfolio.REMEDIATION_REQUIRED_to_SUBMITTED
          - state_machines.Portfolio.SUBMITTED_to_REJECTED
          - state_machines.Enrollment.compliance_standing.GOOD_STANDING_to_NONCOMPLIANT
          - calculations.compliance_standing_derivation
