      - name: empty_quarter_reporting_period_yields_zero_rates_and_full_statutory_target
        grounds:
          - calculations.work_participation_rate
          - entities.FederalReportingPeriod.fields.wpr_all_families_pct
          - entities.FederalReportingPeriod.fields.adjusted_target_all_families_pct
          - entities.FederalReportingPeriod.fields.target_met
        distinguishing_aspect: |
          With no issued TimeLimitMonth rows at all and prior_year_caseload 0.00,
          every denominator is empty: the rates are 0.00 rather than undefined or
          100.00, raw_decline_pct is 0.00 (not 100.00, because prior_year_caseload
          is 0), the credit is 0.00 and adjusted_target_all_families_pct stays at
          the full 50.00, so target_met is false rather than vacuously true.
        test_recipe:
          setup:
            - "The database contains no AssistanceCase rows and no TimeLimitMonth rows."
            - "A FederalReportingPeriod for fiscal_year 2027 quarter 1 (Oct, Nov, Dec 2026) is OPEN with prior_year_caseload 0.00 and eligibility_change_caseload_effect 0.00."
          setup_api_calls:
            - call: "POST /reporting-periods"
              payload: { fiscal_year: 2027, quarter: 1, prior_year_caseload: 0.00, eligibility_change_caseload_effect: 0.00 }
              as: StateReportingAnalyst
              as_user_id: "an-1"
              captures: { period_id: $.data.id }
          trigger:
            - call: "POST /reporting-periods/${period_id}/calculate"
              payload: {}
              as: StateReportingAnalyst
              as_user_id: "an-1"
          assert:
            - "HTTP status == 200"
            - "FederalReportingPeriod.${period_id}.current_caseload == 0.00"
            - "FederalReportingPeriod.${period_id}.wpr_all_families_pct == 0.00"
            - "FederalReportingPeriod.${period_id}.wpr_two_parent_pct == 0.00"
            - "FederalReportingPeriod.${period_id}.caseload_reduction_credit_pct == 0.00"
            - "FederalReportingPeriod.${period_id}.adjusted_target_all_families_pct == 50.00"
            - "FederalReportingPeriod.${period_id}.target_met == false"
            - "FederalReportingPeriod.${period_id}.status == CALCULATED"

      - name: minimum_issuance_floor_at_exactly_one_thousand_cents_versus_one_cent_below
        grounds:
          - calculations.benefit_amount_calculation
          - constants.MINIMUM_ISSUANCE_CENTS
          - validations[priority=62]
          - errors.ERR_INELIGIBLE_ZERO_BENEFIT
        distinguishing_aspect: |
          Countable income 47824 gives deficit 1176 and round_half_up(1176 * 0.85)
          == 1000, exactly MINIMUM_ISSUANCE_CENTS, which is payable; one cent more
          income gives deficit 1175 and round_half_up(1175 * 0.85) == 999, which
          floors to 0 and makes approve fail. The one-cent input difference is
          amplified through the ratable reduction and the half-up rounding.
        test_recipe:
          setup:
            - "Household P (size 3, one adult, youngest child 84 months) has a PROSPECTIVE application for 2026-08 with one VERIFIED recurring UNEARNED_UI source of 47824, so countable_income_cents is 47824 and determined_benefit_cents is 1000."
            - "Household Q is identical except the UNEARNED_UI source is 47825, so countable_income_cents is 47825 and determined_benefit_cents is 0."
            - "Both applications are DETERMINED and neither household has a prior assistance record."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Minimum Issuance P Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_p_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_p_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_p_id: $.data.id }
            - call: "POST /applications/${app_p_id}/income-sources"
              payload: { source_type: "UNEARNED_UI", gross_monthly_cents: 47824, month_1_cents: 47824, month_2_cents: 47824, month_3_cents: 47824, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_p_id: $.data.id }
            - call: "POST /income-sources/${inc_p_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_p_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /households"
              payload: { head_of_household_name: "Minimum Issuance Q Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_q_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_q_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_q_id: $.data.id }
            - call: "POST /applications/${app_q_id}/income-sources"
              payload: { source_type: "UNEARNED_UI", gross_monthly_cents: 47825, month_1_cents: 47825, month_2_cents: 47825, month_3_cents: 47825, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_q_id: $.data.id }
            - call: "POST /income-sources/${inc_q_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_q_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /applications/${app_p_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_p_id: $.data.id }
            - call: "POST /applications/${app_q_id}/approve"
              payload: { certification_start_month: "2026-08" }
