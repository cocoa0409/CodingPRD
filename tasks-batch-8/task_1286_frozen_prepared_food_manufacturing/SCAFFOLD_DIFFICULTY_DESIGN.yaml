          Depth-2 chain from a different trigger (complaint resolve): resolve VALID
          mutates lot L1 (valid_complaint_count 2 -> 3); that mutation itself flips L1
          to QUARANTINED and recomputes the parent order's releasable_cases (200 -> 100),
