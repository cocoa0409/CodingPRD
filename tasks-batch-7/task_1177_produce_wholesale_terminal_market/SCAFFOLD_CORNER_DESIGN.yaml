            - { call: "POST /market/invoices", payload: { sales_order_id: "${ord}" }, as: BillingClerk, captures: { inv: "$.data.id" } }
          trigger:
            - { call: "POST /market/invoices", payload: { sales_order_id: "${ord}" }, as: BillingClerk, captures: { err: "$.data.error_id" } }
            - { call: "GET /market/sales-orders/${ord}/invoices", payload: {}, as: BillingClerk, captures: { i0: "$.data[0].id" } }
          assert:
            - "error_id == ERR_INVOICE_EXISTS (409)"
            - "GET /market/sales-orders/${ord}/invoices still returns exactly 1 invoice (id == ${inv})"

      - name: confirm_over_credit_limit_returns_credit_limit_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDIT_LIMIT_EXCEEDED]", "validations[priority=10]", calculations.credit_exposure]
        distinguishing_aspect: "The clean fiscal trigger (§1.8 only observed this error as the loser of a priority conflict): a valid PENDING order on an ACTIVE customer whose 1000-cent limit cannot cover exposure 0 + subtotal 10000 fails confirm with ERR_CREDIT_LIMIT_EXCEEDED (422). Equality is allowed by the formula, so the subtotal must strictly exceed the remaining headroom."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; lot ACCEPTED; customer credit_limit_cents 1000, ACTIVE; order PENDING with line 1 @ 100.00 (subtotal 10000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 100.00 } ] }, as: SalesDesk, captures: { ord: "$.data.id" } }
          trigger:
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: SalesDesk, captures: { err: "$.data.error_id" } }
            - { call: "GET /market/purchase-lots/${lot}", payload: {}, as: Receiver, captures: { res: "$.data.reserved_units" } }
          assert:
            - "error_id == ERR_CREDIT_LIMIT_EXCEEDED (422) — 0 + 10000 > 1000"
            - "order remains PENDING and lot.reserved_units == 0 (no reservation on the rejected confirm)"

      - name: error_ethylene_conflict_on_overlapping_booking
        claim_type: violation_to_error
        grounds: ["errors[ERR_ETHYLENE_CONFLICT]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ethylene_conflict_beats_room_overlap
          rationale: "Asserted as the winning error of the named §1.8 instance (SENSITIVE lot booked against an overlapping ethylene-enabled booking returns ERR_ETHYLENE_CONFLICT)."

      - name: error_room_overlap_inside_inflated_buffer
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROOM_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / ripening_room_buffer_inflated_overlap
          rationale: "Asserted in the named §1.8 instance (15:30 start vs 14:00 end with 2h buffer returns ERR_ROOM_OVERLAP; 16:00 touching is allowed)."

      - name: error_window_overlap_on_same_delivery_date
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / delivery_window_strict_half_open_adjacency
          rationale: "Asserted in the named §1.8 instance (09:00-11:00 vs 08:00-10:00 on the same delivery_date returns ERR_WINDOW_OVERLAP; 10:00-12:00 adjacency allowed)."

      - name: error_customer_inactive_on_order_confirm
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_INACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / confirm_requires_customer_active
          rationale: "Asserted in the named §1.8 instance (confirm on a SUSPENDED customer's PENDING order returns ERR_CUSTOMER_INACTIVE)."

      - name: error_lot_not_accepted_on_booking_start
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOT_NOT_ACCEPTED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ripening_start_requires_lot_accepted
          rationale: "Asserted in the named §1.8 instance (booking start against an INSPECTED lot returns ERR_LOT_NOT_ACCEPTED)."

  - section: roles
    instances:
      - name: receiver_cannot_approve_own_shrink_returns_forbidden
        claim_type: segregation_of_duties
        grounds: [roles.Receiver, roles.MarketAdmin, state_machines.ShrinkRecord.DRAFT_to_APPROVED, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: the Receiver who recorded the shrink may not approve it — POST /market/shrink-records/{id}/approve is exclusive to MarketAdmin; the Receiver attempt gets ERR_FORBIDDEN (403) and the record stays DRAFT with no CreditMemo created, after which MarketAdmin approves successfully."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; lot 100 @ 10.00 ACCEPTED; DRAFT shrink record (10, DUMP) filed by Receiver"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/shrink-records", payload: { purchase_lot_id: "${lot}", quantity: 10, reason: "DUMP" }, as: Receiver, captures: { shr: "$.data.id" } }
          trigger:
            - { call: "POST /market/shrink-records/${shr}/approve", payload: {}, as: Receiver, captures: { err: "$.data.error_id" } }
            - { call: "GET /market/purchase-lots/${lot}/credit-memos", payload: {}, as: MarketAdmin }
            - { call: "POST /market/shrink-records/${shr}/approve", payload: {}, as: MarketAdmin, captures: { st: "$.data.status" } }
          assert:
            - "Receiver approve -> error_id == ERR_FORBIDDEN (403)"
            - "after the denied attempt: shrink still DRAFT and the lot's credit-memos list is empty (no cascade fired)"
            - "MarketAdmin approve -> 200, status == APPROVED"

      - name: salesdesk_cannot_post_daily_price_returns_forbidden
        claim_type: rbac_denial
        grounds: [roles.SalesDesk, roles.MarketAdmin, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /market/daily-prices is exclusive to MarketAdmin; SalesDesk (whose exclusive domain is order confirm) is denied with ERR_FORBIDDEN (403) and no price row is persisted."
        test_recipe:
          setup: ["Commodity TOM exists; no prices posted"]
          setup_api_calls:
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
          trigger:
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: SalesDesk, captures: { err: "$.data.error_id" } }
            - { call: "GET /market/daily-prices", payload: { commodity_id: "${com}" }, as: MarketAdmin }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"
            - "subsequent GET /market/daily-prices?commodity_id=TOM returns an empty array (nothing persisted)"

      - name: customer_rep_cannot_cancel_other_customers_order
        claim_type: ownership_scope
        grounds: [roles.CustomerRep, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CustomerRep identity is entity_backed:Customer — X-User-ID must equal the order's customer_id. A rep for customer A attempting to cancel customer B's PENDING order is denied ERR_FORBIDDEN (403) even though cancel is a shared operation and the order is in a cancellable state."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; lot ACCEPTED; customers A and B; order OB (customer B, PENDING, line 1 @ 10.00)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { custA: "$.data.id" } }
            - { call: "POST /market/customers", payload: { name: "Buyer B", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { custB: "$.data.id" } }
            - { call: "POST /market/sales-orders", payload: { customer_id: "${custB}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: SalesDesk, captures: { ordB: "$.data.id" } }
          trigger:
            - { call: "POST /market/sales-orders/${ordB}/cancel", payload: {}, as: CustomerRep, as_user_id: "${custA}", captures: { err: "$.data.error_id" } }
            - { call: "GET /market/sales-orders/${ordB}", payload: {}, as: SalesDesk, captures: { st: "$.data.status" } }
          assert:
            - "error_id == ERR_FORBIDDEN (403) — rep of customer A cannot touch customer B's order"
            - "order B remains PENDING (no cancel, no exposure recompute)"

      - name: customer_rep_own_order_create_and_cancel_allowed
        claim_type: ownership_scope
        grounds: [roles.CustomerRep, roles.SalesDesk, state_machines.SalesOrder.PENDING_to_CANCELLED]
        distinguishing_aspect: "The positive ownership path: a CustomerRep whose X-User-ID equals the order's customer_id may create (201) and cancel (200, PENDING -> CANCELLED) their own order; the same rep attempting confirm (a SalesDesk exclusive) is denied ERR_FORBIDDEN."
        test_recipe:
          setup: ["Clock 2026-05-01T08:00:00Z; lot ACCEPTED; customer A (ACTIVE, ample credit)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: MarketAdmin }
            - { call: "POST /market/commodities", payload: { code: "TOM", name: "Tomato", ethylene_class: "PRODUCER", temp_min_f: 45, temp_max_f: 55, max_violation_minutes: 60 }, as: MarketAdmin, captures: { com: "$.data.id" } }
            - { call: "POST /market/shippers", payload: { name: "Shipper One", paca_license: "PACA-001" }, as: MarketAdmin, captures: { sh: "$.data.id" } }
            - { call: "POST /market/daily-prices", payload: { commodity_id: "${com}", market_date: "2026-05-01", low_price: 8.00, high_price: 12.00 }, as: MarketAdmin }
            - { call: "POST /market/purchase-lots", payload: { shipper_id: "${sh}", commodity_id: "${com}", market_date: "2026-05-01", quantity_units: 100, shipper_unit_price: 10.00, declared_grade: "US1" }, as: Receiver, captures: { lot: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 0, result: "PASS" }, as: USDAInspector, captures: { insp: "$.data.id" } }
            - { call: "POST /market/inspections/${insp}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
          trigger:
            - { call: "POST /market/sales-orders", payload: { customer_id: "${cust}", delivery_date: "2026-05-02", window_start: "08:00", window_end: "10:00", lines: [ { lot_id: "${lot}", quantity: 1, unit_price: 10.00 } ] }, as: CustomerRep, as_user_id: "${cust}", captures: { ord: "$.data.id", st0: "$.data.status" } }
            - { call: "POST /market/sales-orders/${ord}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
            - { call: "POST /market/sales-orders/${ord}/cancel", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { st1: "$.data.status" } }
          assert:
            - "create as own CustomerRep -> 201, status == PENDING"
            - "confirm as CustomerRep -> ERR_FORBIDDEN (403) (SalesDesk exclusive)"
            - "cancel own PENDING order -> 200, status == CANCELLED"

      - name: missing_or_undeclared_role_header_returns_unauthenticated
        claim_type: authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]", roles]
        distinguishing_aspect: "Priority 1 auth: a request with the X-User-Role/X-User-ID headers withheld, or with a role string that is not one of the six declared roles, is rejected ERR_UNAUTHENTICATED (401) before any other check — even when the payload itself is invalid (shape would also fail)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /market/shippers"
              payload: { name: "No Auth Shipper", paca_license: "PACA-009" }
              captures: { err1: "$.data.error_id" }
            - { call: "POST /market/shippers", payload: { name: "Bad Role Shipper", paca_license: "PACA-010" }, as: Anonymous, captures: { err2: "$.data.error_id" } }
          assert:
            - "no-auth call: error_id == ERR_UNAUTHENTICATED, http 401"
            - "undeclared-role call: error_id == ERR_UNAUTHENTICATED, http 401 (Anonymous is not a declared role)"

      - name: customer_rep_with_unknown_id_returns_unauthenticated
        claim_type: authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]", roles.CustomerRep]
        distinguishing_aspect: "For entity_backed role CustomerRep, priority 1 requires X-User-ID to equal an existing Customer.id: a well-formed UUID that matches no customer is an authentication failure (401 ERR_UNAUTHENTICATED), not a 404, because the identity itself cannot be established."
        test_recipe:
          setup: ["one customer exists (so the table is non-empty but does not contain the presented id)"]
          setup_api_calls:
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 1000000 }, as: MarketAdmin, captures: { cust: "$.data.id" } }
          trigger:
            - { call: "GET /market/customers/${cust}/sales-orders", payload: {}, as: CustomerRep, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http 401"
            - "the presented UUID is well-formed but not an existing Customer.id — identity resolution fails at priority 1"

  - section: concurrency_rules
    instances:
      - name: customer_patch_with_current_version_succeeds
        claim_type: occ_fresh_version
        grounds: ["concurrency_rules[customer-terms-stale-update]", entities.Customer.fields.terms_days, endpoints]
        distinguishing_aspect: "Happy path of the OCC rule: PATCH /market/customers/{id} carrying expected_customer_version equal to the server's current Customer.version applies the terms change and advances version by exactly 1 (1 -> 2)."
        test_recipe:
          setup: ["Customer created (version 1, terms_days default 10)"]
          setup_api_calls:
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 500000 }, as: MarketAdmin, captures: { cust: "$.data.id", cv: "$.data.version" } }
          trigger:
            - { call: "PATCH /market/customers/${cust}", payload: { terms_days: 14, expected_customer_version: "${cv}" }, as: MarketAdmin, captures: { terms: "$.data.terms_days", v2: "$.data.version" } }
          assert:
            - "HTTP 200: terms_days == 14"
            - "version == ${cv} + 1 (exactly one increment for the accepted write)"

      - name: customer_patch_with_stale_version_returns_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[customer-terms-stale-update]", "errors[ERR_STALE_VERSION]", endpoints]
        distinguishing_aspect: "Stale path of the same OCC rule: after one accepted PATCH advances Customer.version to 2, a second PATCH still carrying the previously observed version 1 is rejected with ERR_STALE_VERSION (412) and leaves terms_days and version untouched. Two strictly sequential requests — no wall-clock or parallelism involved."
        test_recipe:
          setup: ["Customer created (version 1); one accepted PATCH (terms_days 14) advances it to version 2"]
          setup_api_calls:
            - { call: "POST /market/customers", payload: { name: "Buyer A", credit_limit_cents: 500000 }, as: MarketAdmin, captures: { cust: "$.data.id", cv: "$.data.version" } }
            - { call: "PATCH /market/customers/${cust}", payload: { terms_days: 14, expected_customer_version: "${cv}" }, as: MarketAdmin }
          trigger:
            - { call: "PATCH /market/customers/${cust}", payload: { credit_limit_cents: 600000, expected_customer_version: "${cv}" }, as: MarketAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /market/customers/${cust}", payload: {}, as: MarketAdmin, captures: { terms: "$.data.terms_days", lim: "$.data.credit_limit_cents", v: "$.data.version" } }
          assert:
            - "error_id == ERR_STALE_VERSION, http 412"
            - "customer unchanged: terms_days == 14, credit_limit_cents == 500000, version == 2"