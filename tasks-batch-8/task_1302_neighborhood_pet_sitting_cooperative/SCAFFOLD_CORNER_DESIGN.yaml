        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints[POST /coop/sitting-assignments/{assignmentId}/settle]"]
        distinguishing_aspect: "Immediate consistency: the settle response body itself carries the final state — status SETTLED and credit_hours_settled 1.25 on the early-departure sit — with no re-read or reconciliation delay."
        test_recipe:
          setup: ["Founders VETTED; F1 owns pet1; canonical sit completed with actual 2.5h (checkout at 12:30)"]
          setup_api_calls:
            - *mk_f1
