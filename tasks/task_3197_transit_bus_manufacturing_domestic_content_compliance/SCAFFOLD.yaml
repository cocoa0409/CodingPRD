scenario: "Transit Bus Manufacturing & Domestic Content Compliance (New Flyer): transit agency procurement contracts with option orders, pricing escalation and delivery schedules, bus configuration engineering per agency with seating layouts, propulsion type, fare equipment and accessibility features, domestic content computation and certification for federally funded purchases with supplier documentation, pre-award and post-delivery audits verifying assembly location and component sourcing, production line sequencing for mixed configurations with parts kitting, agency inspection at the plant and acceptance testing at delivery, warranty administration with agency maintenance training and parts stocking, propulsion transition planning as agencies convert to battery-electric fleets"
domain_name: transit-bus-manufacturing-domestic-content
api_prefix: /api
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, scheduled_actions]
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns: [one_to_many, cross_aggregate, self_referential]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Transit agency legal name" }
      - { name: agency_code, type: string, source: input, description: "Unique short code, unique across agencies" }
      - { name: federally_funded, type: boolean, source: input, default: true, description: "Whether purchases use FTA federal funds (gates Buy America certification)" }
      - { name: fleet_transition_target_pct, type: number, source: input, default: 0, description: "Target percentage (0-100) of fleet to be battery-electric by transition target year" }
      - { name: transition_target_year, type: integer, source: input, description: "Year by which fleet_transition_target_pct must be reached" }
      - { name: zev_ratio, type: number, source: computed, default: 0, description: "Fraction of delivered ACCEPTED buses with propulsion_type in {BEV, FCEV} over all ACCEPTED buses for this agency" }
      - { name: projected_zev_ratio, type: number, source: computed, default: 0, description: "Forward-looking ratio counting ACCEPTED buses plus buses on OptionOrders in EXERCISED state whose BusConfiguration.propulsion_type is BEV or FCEV" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED blocks new contract creation" , constraints: "ACTIVE|SUSPENDED"}

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning transit agency" }
      - { name: base_quantity, type: integer, source: input, description: "Number of buses in the base order" }
      - { name: base_unit_price_cents, type: integer, source: input, description: "Contract-year unit price for base buses, in cents" }
      - { name: base_contract_year, type: integer, source: input, description: "Model/contract year of the base order" }
      - { name: escalation_index, type: enum, source: input, description: "PPI_1413 | CPI_U — published index used for option-year escalation", constraints: "PPI_1413|CPI_U" }
      - { name: option_years, type: integer, source: input, default: 0, description: "Number of option order years attached to this contract (0-5)" }
      - { name: option_specs, type: array, source: input, description: "Per-option-year specs [{quantity, propulsion_type}] aligned to option_years; award creates one OptionOrder per entry. Empty array when option_years == 0" }
      - { name: awarded_at, type: datetime, source: system, description: "Set when contract transitions DRAFT -> AWARDED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> AWARDED -> ACTIVE -> COMPLETED | TERMINATED", constraints: "DRAFT|AWARDED|ACTIVE|COMPLETED|TERMINATED" }

  - name: OptionOrder
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; parent procurement contract" }
      - { name: option_year, type: integer, source: input, description: "Option year number (1..contract.option_years)" }
      - { name: quantity, type: integer, source: input, description: "Number of buses exercised under this option" }
      - { name: propulsion_type, type: enum, source: system, description: "Copied from contract.option_specs[option_year-1].propulsion_type at award; must match a FROZEN BusConfiguration of the contract at exercise time", constraints: "DIESEL|CNG|HEV|BEV|FCEV" }
      - { name: exercised_unit_price_cents, type: integer, source: computed, description: "Computed by option_escalation calculation at exercise time; null until EXERCISED" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> EXERCISED | EXPIRED", constraints: "AVAILABLE|EXERCISED|EXPIRED" }
      - { name: exercise_deadline, type: datetime, source: computed, description: "awarded_at + (option_year * 365 days); exercise at or before this instant" }

  - name: BusConfiguration
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract this configuration is engineered under" }
      - { name: propulsion_type, type: enum, source: input, description: "DIESEL | CNG | HEV | BEV | FCEV", constraints: "DIESEL|CNG|HEV|BEV|FCEV" }
      - { name: seating_layout, type: object, source: input, description: "Structured seating plan; seat_count derived from it" }
      - { name: fare_equipment, type: object, source: input, description: "Farebox / validator equipment manifest" }
      - { name: accessibility_features, type: array, source: input, description: "List of accessibility feature codes; must include WHEELCHAIR_LIFT when agency requires it" }
      - { name: component_ids, type: array, source: input, description: "Standard component list: ids of Components required to build a bus on this configuration; copied into the PartsKit at engineer time" }
      - { name: seat_count, type: integer, source: computed, description: "Derived from seating_layout at freeze; locked thereafter" }
      - { name: freeze_version, type: integer, source: system, description: "Config revision counter incremented by each successful /freeze call" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ENGINEERING_REVIEW -> FROZEN -> OBSOLETE", constraints: "DRAFT|ENGINEERING_REVIEW|FROZEN|OBSOLETE" }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Component part name" }
      - { name: category, type: enum, source: input, description: "PROPULSION | BODY | AXLE | ELECTRICAL | FARE | ACCESSIBILITY", constraints: "PROPULSION|BODY|AXLE|ELECTRICAL|FARE|ACCESSIBILITY" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Supplier unit cost in cents" }
      - { name: is_domestic, type: boolean, source: input, description: "Supplier-attested domestic origin flag" }
      - { name: supplier_doc_status, type: enum, source: system, description: "MISSING -> SUBMITTED -> VERIFIED | REJECTED", constraints: "MISSING|SUBMITTED|VERIFIED|REJECTED" }

  - name: ComplianceCertificate
    parent: null
    common_fields: true
    fields:
      - { name: bus_unit_id, type: string, source: input, description: "FK -> BusUnit.id; bus this certificate attests for" }
      - { name: domestic_content_pct, type: number, source: computed, description: "Computed by domestic_content calculation when certificate is issued" }
      - { name: threshold_pct, type: number, source: input, default: 70, description: "Required domestic content percentage for federally funded purchase" }
      - { name: variant, type: enum, source: input, description: "COST_BASED | COMPONENT_COUNT — which computation variant the certificate attests", constraints: "COST_BASED|COMPONENT_COUNT" }
      - { name: issued_by, type: string, source: input, description: "ComplianceOfficer user id who issued (segregated from auditor)" }
      - { name: status, type: enum, source: system, description: "ISSUED -> SUPERSEDED | REVOKED", constraints: "ISSUED|SUPERSEDED|REVOKED" }

  - name: AuditRecord
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract under audit" }
      - { name: audit_type, type: enum, source: input, description: "PRE_AWARD | POST_DELIVERY", constraints: "PRE_AWARD|POST_DELIVERY" }
      - { name: auditor_id, type: string, source: input, description: "Auditor user id; for POST_DELIVERY must differ from the ComplianceCertificate.issued_by on every bus in scope" }
      - { name: scope_bus_count, type: integer, source: computed, description: "Number of BusUnits in audit scope at completion" }
      - { name: findings_count, type: integer, source: computed, default: 0, description: "Count of FAILED findings recorded" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL | null until completed", constraints: "PASS|FAIL" }
      - { name: status, type: enum, source: system, description: "OPEN -> COMPLETED", constraints: "OPEN|COMPLETED" }

  - name: ProductionSlot
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: enum, source: input, description: "LINE_A | LINE_B production line", constraints: "LINE_A|LINE_B" }
      - { name: start_ts, type: datetime, source: input, description: "Slot start (logical clock)" }
      - { name: end_ts, type: datetime, source: input, description: "Slot end; adjacency rule: [start_ts, end_ts) half-open, back-to-back slots allowed" }
      - { name: bus_unit_id, type: string, source: computed, description: "FK -> BusUnit.id; assigned bus, null while OPEN" }
      - { name: kit_status, type: enum, source: system, description: "NOT_KITTED -> KITTED when a complete PartsKit is linked", constraints: "NOT_KITTED|KITTED" }
      - { name: status, type: enum, source: system, description: "OPEN -> ASSIGNED -> IN_PRODUCTION -> DONE | CANCELLED", constraints: "OPEN|ASSIGNED|IN_PRODUCTION|DONE|CANCELLED" }

  - name: PartsKit
    parent: null
    common_fields: true
    fields:
      - { name: bus_unit_id, type: string, source: input, description: "FK -> BusUnit.id; bus this kit is staged for" }
      - { name: component_ids, type: array, source: input, description: "Component ids required by the bus configuration" }
      - { name: completeness_pct, type: number, source: computed, description: "Percent of required components with supplier_doc_status == VERIFIED" }
      - { name: status, type: enum, source: system, description: "STAGING -> COMPLETE -> CONSUMED", constraints: "STAGING|COMPLETE|CONSUMED" }

  - name: BusUnit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract the bus is built under" }
      - { name: bus_configuration_id, type: string, source: input, description: "FK -> BusConfiguration.id; frozen configuration used for the build" }
      - { name: option_order_id, type: string, source: input, description: "FK -> OptionOrder.id; null when bus belongs to base order" }
      - { name: serial_number, type: string, source: system, description: "Server-minted serial, unique" }
      - { name: assembly_location, type: enum, source: input, description: "Final assembly plant: US_MAIN | US_ANNEX", constraints: "US_MAIN|US_ANNEX" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID -> INVOICED -> PAID (independent parallel dimension)", constraints: "UNPAID|INVOICED|PAID" }
      - { name: status, type: enum, source: system, description: "ORDERED -> ENGINEERED -> IN_PRODUCTION -> BUILT -> PLANT_INSPECTION -> IN_TRANSIT -> DELIVERED -> ACCEPTED | REJECTED", constraints: "ORDERED|ENGINEERED|IN_PRODUCTION|BUILT|PLANT_INSPECTION|IN_TRANSIT|DELIVERED|ACCEPTED|REJECTED" }
      - { name: delivered_at, type: datetime, source: system, description: "Set at IN_TRANSIT -> DELIVERED" }
      - { name: acceptance_deadline, type: datetime, source: computed, description: "delivered_at + 30 days; auto-ACCEPT boundary is strictly after this instant" }

  - name: InspectionRecord
    parent: null
    common_fields: false
    fields:
      - { name: bus_unit_id, type: string, source: input, description: "FK -> BusUnit.id; inspected bus" }
      - { name: inspection_type, type: enum, source: input, description: "PLANT | DELIVERY", constraints: "PLANT|DELIVERY" }
      - { name: inspector_id, type: string, source: input, description: "AgencyInspector user id" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL", constraints: "PASS|FAIL" }
      - { name: defects, type: array, source: input, default: [], description: "Defect codes recorded; FAIL requires non-empty defects" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: bus_unit_id, type: string, source: input, description: "FK -> BusUnit.id; bus the claim is filed against" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock at filing" }
      - { name: defect_code, type: string, source: input, description: "Defect classification code" }
      - { name: component_id, type: string, source: input, description: "FK -> Component.id; component whose replacement the claim funds; drives the PartsStock reservation" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Agency-claimed repair cost in cents" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Amount approved by warranty engine at APPROVE; null before decision" }
      - { name: status, type: enum, source: system, description: "FILED -> UNDER_REVIEW -> APPROVED | DENIED -> PAID | CLOSED; revision loop APPROVED -> UNDER_REVIEW allowed once", constraints: "FILED|UNDER_REVIEW|APPROVED|DENIED|PAID|CLOSED" }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; agency whose maintenance staff attend" }
      - { name: propulsion_type, type: enum, source: input, description: "Training module propulsion focus", constraints: "DIESEL|CNG|HEV|BEV|FCEV" }
      - { name: scheduled_date, type: datetime, source: input, description: "Session date; must not collide with another session for same agency on same calendar date (whole-day buffer semantics)" }
      - { name: attendee_count, type: integer, source: input, description: "Number of agency technicians; must be >= 1" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | CANCELLED", constraints: "SCHEDULED|COMPLETED|CANCELLED" }

  - name: PartsStock
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; stocking agency" }
      - { name: component_id, type: string, source: input, description: "FK -> Component.id; stocked component" }
      - { name: quantity, type: integer, source: input, description: "Units stocked; >= 0" }
      - { name: reserved_quantity, type: integer, source: computed, default: 0, description: "Units reserved by APPROVED warranty claims" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED (auto when quantity - reserved_quantity == 0)", constraints: "ACTIVE|DEPLETED" }

state_machines:
  - entity: Agency
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /api/agencies/{agencyId}"
        actor: AgencyAdmin
        preconditions: ["no Contract of this agency in status AWARDED or ACTIVE"]
        side_effects: ["blocks subsequent POST /api/contracts for this agency"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /api/agencies/{agencyId}"
        actor: AgencyAdmin
        preconditions: []
        side_effects: []

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: AWARDED
        trigger: "POST /api/contracts/{contractId}/award"
        actor: ProcurementOfficer
        preconditions: ["agency.status == ACTIVE", "base_quantity >= 1", "at least one BusConfiguration for this contract in status FROZEN"]
        side_effects: ["awarded_at = logical clock now", "for each entry i in option_specs create OptionOrder(option_year=i+1, quantity=spec.quantity, propulsion_type=spec.propulsion_type, status=AVAILABLE, exercise_deadline = awarded_at + (i+1)*365d)", "increments Contract.version by 1"]
      - from: AWARDED
        to: ACTIVE
        trigger: "POST /api/contracts/{contractId}/activate"
        actor: ProcurementOfficer
        preconditions: ["a PRE_AWARD AuditRecord for this contract exists with status COMPLETED and result PASS"]
        side_effects: ["base BusUnits may now be created", "increments Contract.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/contracts/{contractId}/complete"
        actor: ProcurementOfficer
        preconditions: ["every BusUnit of this contract is in ACCEPTED or REJECTED", "every OptionOrder of this contract is EXERCISED or EXPIRED"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/contracts/{contractId}/terminate"
        actor: ProcurementOfficer
        preconditions: ["no BusUnit of this contract in status IN_PRODUCTION or PLANT_INSPECTION or IN_TRANSIT"]
        side_effects: ["all OptionOrders in AVAILABLE -> EXPIRED", "all BusUnits in ORDERED or ENGINEERED -> REJECTED", "all ProductionSlots referencing those buses -> CANCELLED with kit_status NOT_KITTED", "linked PartsKits in STAGING or COMPLETE -> CONSUMED release no stock"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /api/contracts/{contractId}/terminate"
        actor: ProcurementOfficer
        preconditions: []
        side_effects: []

  - entity: OptionOrder
    initial_state: AVAILABLE
    terminal_states: [EXERCISED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: EXERCISED
        trigger: "POST /api/option-orders/{optionOrderId}/exercise"
        actor: ProcurementOfficer
        preconditions: ["contract.status == ACTIVE", "logical clock now <= exercise_deadline", "a FROZEN BusConfiguration of the contract exists with propulsion_type == option_order.propulsion_type"]
        side_effects: ["run option_escalation calculation -> exercised_unit_price_cents", "agency projected_zev_ratio recomputed", "increments Contract.version by 1"]
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system auto-transition when logical clock now > exercise_deadline (at exactly the deadline the option remains AVAILABLE); evaluated on every POST /api/_clock/set_current_utc and lazily on reads of the option or its contract"
        actor: system
        preconditions: ["logical clock now > exercise_deadline"]
        side_effects: ["agency projected_zev_ratio recomputed (pipeline shrinks)"]

  - entity: BusConfiguration
    initial_state: DRAFT
    terminal_states: [OBSOLETE]
    transitions:
      - from: DRAFT
        to: ENGINEERING_REVIEW
        trigger: "POST /api/bus-configurations/{busConfigurationId}/submit-review"
        actor: ConfigEngineer
        preconditions: ["contract.status in {DRAFT, AWARDED}"]
        side_effects: []
      - from: ENGINEERING_REVIEW
        to: FROZEN
        trigger: "POST /api/bus-configurations/{busConfigurationId}/freeze"
        actor: ConfigEngineer
        preconditions: ["seating_layout parses to seat_count >= 10", "if agency.federally_funded then accessibility_features includes WHEELCHAIR_LIFT"]
        side_effects: ["seat_count computed and locked", "freeze_version += 1"]
      - from: ENGINEERING_REVIEW
        to: DRAFT
        trigger: "POST /api/bus-configurations/{busConfigurationId}/return-to-draft"
        actor: ConfigEngineer
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: DRAFT
        trigger: "POST /api/bus-configurations/{busConfigurationId}/return-to-draft"
        actor: ConfigEngineer
        preconditions: ["no BusUnit references this configuration with status other than ORDERED"]
        side_effects: ["seat_count unlocked"]
        note: "revision loop: FROZEN configs may be reopened, edited, re-frozen; freeze_version accumulates"
      - from: FROZEN
        to: OBSOLETE
        trigger: "POST /api/bus-configurations/{busConfigurationId}/obsolete"
        actor: ConfigEngineer
        preconditions: ["no BusUnit references this configuration in any non-terminal status"]
        side_effects: []

  - entity: Component
    initial_state: MISSING
    terminal_states: []
    transitions:
      - from: MISSING
        to: SUBMITTED
        trigger: "POST /api/components/{componentId}/supplier-docs"
        actor: SupplierRep
        preconditions: []
        side_effects: ["completeness_pct of every PartsKit containing this component recomputed; a PartsKit reaching 100 moves STAGING -> COMPLETE"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/components/{componentId}/verify-docs"
        actor: ComplianceOfficer
        preconditions: ["verifier user id != submitter user id (segregation of duties)"]
        side_effects: ["completeness_pct recompute cascade as above"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/components/{componentId}/reject-docs"
        actor: ComplianceOfficer
        preconditions: ["rejector user id != submitter user id"]
        side_effects: ["completeness_pct recompute cascade as above"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/components/{componentId}/supplier-docs"
        actor: SupplierRep
        preconditions: []
        side_effects: ["completeness_pct recompute cascade as above"]
        note: "resubmission loop"

  - entity: ComplianceCertificate
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /api/bus-units/{id}/compliance-certificates (issuing a new certificate supersedes any prior ISSUED one)"
        actor: ComplianceOfficer
        preconditions: ["bus_unit.status in {ENGINEERED, IN_PRODUCTION, BUILT}"]
        side_effects: ["prior ISSUED certificate for same bus -> SUPERSEDED"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /api/compliance-certificates/{complianceCertificateId}/revoke"
        actor: ComplianceOfficer
        preconditions: ["bus has no COMPLETED POST_DELIVERY audit with result PASS"]
        side_effects: ["bus cannot advance BUILT -> PLANT_INSPECTION while it lacks an ISSUED certificate"]

  - entity: AuditRecord
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /api/audit-records/{auditRecordId}/complete"
        actor: Auditor
        preconditions:
          - "if audit_type == PRE_AWARD: contract.status == AWARDED, and for at least one FROZEN BusConfiguration of the contract every PROPULSION-category Component on its standard component list has supplier_doc_status == VERIFIED"
          - "if audit_type == POST_DELIVERY: auditor_id differs from ComplianceCertificate.issued_by of every ISSUED certificate on in-scope buses, and every in-scope bus has an ISSUED certificate and assembly_location in {US_MAIN, US_ANNEX}"
        side_effects: ["result = PASS when findings_count == 0 else FAIL", "scope_bus_count recorded", "PASS on PRE_AWARD enables Contract AWARDED -> ACTIVE"]

  - entity: ProductionSlot
    initial_state: OPEN
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /api/production-slots/{productionSlotId}/assign"
        actor: ProductionPlanner
        preconditions: ["bus_unit.status == ENGINEERED", "slot interval [start_ts, end_ts) does not overlap any other OPEN or ASSIGNED slot on the same line_id (half-open: end == other.start is allowed)"]
        side_effects: ["bus_unit_id set", "if the bus's PartsKit is already COMPLETE, kit_status NOT_KITTED -> KITTED at assign time"]
      - from: ASSIGNED
        to: IN_PRODUCTION
        trigger: "POST /api/production-slots/{productionSlotId}/start-production"
        actor: ProductionPlanner
        preconditions: ["kit_status == KITTED", "logical clock now >= start_ts"]
        side_effects: ["bus_unit.status ENGINEERED -> IN_PRODUCTION", "linked PartsKit COMPLETE -> CONSUMED", "for each kit component: the PartsStock row keyed by (contract.agency_id, component_id), if one exists, has quantity decremented by 1 on CONSUMED"]
      - from: IN_PRODUCTION
        to: DONE
        trigger: "POST /api/production-slots/{productionSlotId}/complete-production"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["bus_unit.status IN_PRODUCTION -> BUILT"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/production-slots/{productionSlotId}/cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /api/production-slots/{productionSlotId}/cancel"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["bus_unit_id cleared; bus stays ENGINEERED"]

  - entity: PartsKit
    initial_state: STAGING
    terminal_states: [CONSUMED]
    transitions:
      - from: STAGING
        to: COMPLETE
        trigger: "system auto-transition when completeness_pct reaches 100"
        actor: system
        preconditions: ["every component_id has supplier_doc_status == VERIFIED"]
        side_effects: ["ProductionSlot of the bus (if ASSIGNED) kit_status NOT_KITTED -> KITTED"]
      - from: COMPLETE
        to: CONSUMED
        trigger: "system, fired by ProductionSlot ASSIGNED -> IN_PRODUCTION"
        actor: system
        preconditions: []
        side_effects: ["stock decrement cascade on PartsStock rows of the contract agency for kit components"]

  - entity: BusUnit
    initial_state: ORDERED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: ORDERED
        to: ENGINEERED
        trigger: "POST /api/bus-units/{busUnitId}/engineer"
        actor: ConfigEngineer
        preconditions: ["bus_configuration.status == FROZEN", "contract.status == ACTIVE"]
        side_effects: ["PartsKit created in STAGING with component_ids from the configuration standard component list"]
      - from: ENGINEERED
        to: IN_PRODUCTION
        trigger: "system, fired by ProductionSlot.start-production"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: BUILT
        trigger: "system, fired by ProductionSlot.complete-production"
        actor: system
        preconditions: []
        side_effects: []
      - from: BUILT
        to: PLANT_INSPECTION
        trigger: "POST /api/bus-units/{busUnitId}/submit-plant-inspection"
        actor: ProductionPlanner
        preconditions: ["bus has a ComplianceCertificate in status ISSUED", "if agency.federally_funded then certificate.domestic_content_pct >= certificate.threshold_pct"]
        side_effects: []
      - from: PLANT_INSPECTION
        to: IN_TRANSIT
        trigger: "POST /api/inspection-records with inspection_type=PLANT and result=PASS"
        actor: AgencyInspector
        preconditions: ["bus.status == PLANT_INSPECTION"]
        side_effects: ["bus PLANT_INSPECTION -> IN_TRANSIT"]
      - from: PLANT_INSPECTION
        to: BUILT
        trigger: "POST /api/inspection-records with inspection_type=PLANT and result=FAIL"
        actor: AgencyInspector
        preconditions: ["bus.status == PLANT_INSPECTION", "defects non-empty"]
        side_effects: ["bus PLANT_INSPECTION -> BUILT (rework loop)"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /api/bus-units/{busUnitId}/deliver"
        actor: ProductionPlanner
        preconditions: []
        side_effects: ["delivered_at = now", "acceptance_deadline = delivered_at + 30 days"]
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /api/inspection-records with inspection_type=DELIVERY and result=PASS, or POST /api/bus-units/{busUnitId}/accept"
        actor: AgencyInspector
        preconditions: ["bus.status == DELIVERED"]
        side_effects: ["agency.zev_ratio and projected_zev_ratio recomputed", "payment_status UNPAID -> INVOICED"]
      - from: DELIVERED
        to: REJECTED
        trigger: "POST /api/inspection-records with inspection_type=DELIVERY and result=FAIL"
        actor: AgencyInspector
        preconditions: ["bus.status == DELIVERED", "defects non-empty"]
        side_effects: ["agency.zev_ratio and projected_zev_ratio recomputed"]
      - from: DELIVERED
        to: ACCEPTED
        trigger: "system auto-accept when logical clock now > acceptance_deadline (strictly greater; at exactly deadline no auto-accept)"
        actor: system
        preconditions: ["logical clock now > acceptance_deadline"]
        side_effects: ["agency.zev_ratio recomputed", "payment_status UNPAID -> INVOICED"]
        note: "boundary precision: == deadline does not auto-accept"

  - entity: BusUnitPayment
    initial_state: INVOICED
    terminal_states: [PAID]
    transitions:
      - from: INVOICED
        to: PAID
        trigger: "POST /api/bus-units/{busUnitId}/record-payment"
        actor: ProcurementOfficer
        preconditions: ["bus_unit.payment_status == INVOICED (bus must be ACCEPTED first)"]
        side_effects: []
        note: "Parallel dimension: payment_status evolves independently of BusUnit.status"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [PAID, CLOSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/warranty-claims/{warrantyClaimId}/start-review"
        actor: WarrantyAdmin
        preconditions: ["bus.status == ACCEPTED", "reported_at <= bus delivered_at + 365 days (base warranty window)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/warranty-claims/{warrantyClaimId}/approve"
        actor: WarrantyAdmin
        preconditions: ["claimed_amount_cents > 0"]
        side_effects: ["run warranty_approval calculation -> approved_amount_cents", "PartsStock.reserved_quantity += ceil(approved_amount_cents / claim.component_id.unit_cost_cents) on the PartsStock row keyed by (contract.agency_id, claim.component_id)"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/warranty-claims/{warrantyClaimId}/deny"
        actor: WarrantyAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /api/warranty-claims/{warrantyClaimId}/start-review"
        actor: WarrantyAdmin
        preconditions: ["claim has not previously re-entered UNDER_REVIEW (loop allowed exactly once)"]
        side_effects: ["prior PartsStock reservation released (reserved_quantity decremented)"]
        note: "single-pass revision cycle"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/warranty-claims/{warrantyClaimId}/pay"
        actor: WarrantyAdmin
        preconditions: ["approver of the APPROVE step differs from payer user id (segregation of duties)"]
        side_effects: ["PartsStock reservation released", "PartsStock.quantity decremented by reserved units consumed; PartsStock -> DEPLETED when quantity - reserved_quantity == 0"]
      - from: DENIED
        to: CLOSED
        trigger: "POST /api/warranty-claims/{warrantyClaimId}/close"
        actor: WarrantyAdmin
        preconditions: []
        side_effects: []

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/training-sessions/{trainingSessionId}/complete"
        actor: WarrantyAdmin
        preconditions: ["logical clock now >= scheduled_date"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/training-sessions/{trainingSessionId}/cancel"
        actor: WarrantyAdmin
        preconditions: ["logical clock now < scheduled_date"]
        side_effects: []

  - entity: PartsStock
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system auto-transition when quantity - reserved_quantity == 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: ACTIVE
        trigger: "PATCH /api/parts-stocks/{partsStockId} restock (quantity increased above reserved_quantity)"
        actor: WarrantyAdmin
        preconditions: []
        side_effects: []

concurrency_rules:
  - rule_id: option-exercise-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /api/option-orders/{optionOrderId}/exercise"
    occ_field: "expected_contract_version"
    description: |
      Exercising an OptionOrder against a Contract whose version has advanced
      since the client last observed it is rejected, because an intervening
      exercise of a sibling option or a re-award mutation changed the escalation
      base the client priced against.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: config-freeze-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /api/bus-configurations/{busConfigurationId}/freeze"
    occ_field: "expected_contract_version"
    description: |
      Freezing a BusConfiguration against a Contract whose version has advanced
      since the client last observed it is rejected, because an intervening
      award or sibling freeze changed the contract baseline the configuration
      was engineered against.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: option_escalation
    trigger: "OptionOrder AVAILABLE -> EXERCISED"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order pinned: escalate base price FIRST, then apply tier,
      # then round ONCE at the end. Reversing tier/escalation order is a
      # different (wrong) number.
      base = contract.base_unit_price_cents
      idx_factor = ESCALATION[contract.escalation_index] ** option_order.option_year
      escalated = base * idx_factor                       # float
      # volume tier on exercised quantity (tiered, marginal-free flat discount):
      tier_pct = 0.00 if quantity < TIER1_QTY else (0.02 if quantity < TIER2_QTY else 0.05)
      price = round_half_up(escalated * (1 - tier_pct))   # single final rounding, integer cents
      exercised_unit_price_cents = price
    input_set: "The OptionOrder being exercised and its parent Contract"
    constants:
      ESCALATION_PPI_1413: 1.031
      ESCALATION_CPI_U: 1.024
      TIER1_QTY: 5
      TIER2_QTY: 20
    precision: "integer cents, round_half_up applied once at final step"
    variants:
      - name: by_index
        when: "contract.escalation_index selects PPI_1413 or CPI_U factor"
        difference: "same option year and quantity yield different unit prices under the two indices (1.031^n vs 1.024^n)"

  - name: domestic_content
    trigger: "POST /api/bus-units/{id}/compliance-certificates"
    algorithm: aggregation
    formula: |
      # COST_BASED variant:
      pct_cost = 100 * sum(c.unit_cost_cents for c in components if c.is_domestic) / sum(c.unit_cost_cents for c in components)
      # COMPONENT_COUNT variant:
      pct_count = 100 * count(c for c in components if c.is_domestic) / count(components)
      # components = PartsKit.component_ids of the bus's kit, all must exist;
      # round_half_up to 1 decimal place.
      domestic_content_pct = round_half_up(selected_variant_value, 1)
    input_set: "Components listed on the bus's PartsKit (any supplier_doc_status; documentation gates audits, not the percentage itself)"
    constants:
      DEFAULT_THRESHOLD_PCT: 70
    precision: "1 decimal place, round_half_up"
    variants:
      - name: COST_BASED
        when: "certificate.variant == COST_BASED"
        difference: "weights by unit_cost_cents; a cheap domestic fastener counts little"
      - name: COMPONENT_COUNT
        when: "certificate.variant == COMPONENT_COUNT"
        difference: "weights by count; the same component set yields a different percentage than COST_BASED whenever unit costs are unequal"

  - name: kit_completeness
    trigger: "Component supplier_doc_status transitions (SUBMITTED/VERIFIED/REJECTED/resubmission) and PartsKit creation"
    algorithm: aggregation
    formula: |
      required = kit.component_ids
      verified = [c for c in required if component(c).supplier_doc_status == VERIFIED]
      completeness_pct = round_half_up(100 * len(verified) / len(required), 1) if required else 100.0
      if completeness_pct == 100.0 and kit.status == STAGING: kit.status = COMPLETE
    input_set: "The kit's component_ids list; empty list treated as 100.0"
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: fleet_zev_ratio
    trigger: "BusUnit -> ACCEPTED or REJECTED; OptionOrder -> EXERCISED"
    algorithm: forward_looking
    formula: |
      accepted = [b for b in agency.buses if b.status == ACCEPTED]
      zev_ratio = (count(accepted with config.propulsion_type in {BEV,FCEV}) / count(accepted)) if accepted else 0
      # forward-looking variant: projected counts exercised-but-undelivered option quantities
      zev_pipeline = sum(o.quantity for o in agency.contracts.option_orders if o.status == EXERCISED and o.propulsion_type in {BEV,FCEV})
      pipeline     = sum(o.quantity for o in agency.contracts.option_orders if o.status == EXERCISED)
      projected_zev_ratio = (zev_accepted + zev_pipeline) / (count(accepted) + pipeline) if (count(accepted) + pipeline) > 0 else 0
      # Pipeline propulsion is pinned by OptionOrder.propulsion_type (input at creation,
      # validated against a FROZEN BusConfiguration of the contract at exercise).
      # The two variants diverge whenever the pipeline mix differs from the delivered mix.
    input_set: "BusUnits of all Contracts of the Agency; EXERCISED OptionOrders joined to their BusConfiguration propulsion_type"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: realized
        when: "zev_ratio — counts ACCEPTED buses only"
        difference: "backward-looking; ignores exercised option pipeline"
      - name: projected
        when: "projected_zev_ratio — counts ACCEPTED plus EXERCISED option quantities"
        difference: "forward-looking; same agency at the same instant yields a different ratio whenever any option is EXERCISED but its buses are not yet ACCEPTED"

  - name: warranty_approval
    trigger: "WarrantyClaim UNDER_REVIEW -> APPROVED"
    algorithm: threshold
    formula: |
      # Coverage depends on fleet-age tier of the bus (days since delivered_at):
      age_days = (claim decided date - bus.delivered_at) in days
      coverage = 1.00 if age_days <= T1_DAYS else (0.50 if age_days <= T2_DAYS else 0.0)
      # Rounding order pinned: apply coverage, cap, then round ONCE:
      raw = claim.claimed_amount_cents * coverage
      capped = min(raw, CAP_CENTS)
      approved_amount_cents = round_half_up(capped)
      # Boundary: age_days == T1_DAYS uses full coverage (<=), T1_DAYS+1 drops to 0.50.
    input_set: "The WarrantyClaim and its BusUnit.delivered_at"
    constants:
      T1_DAYS: 180
      T2_DAYS: 365
      CAP_CENTS: 2500000
    precision: "integer cents, round_half_up once after cap"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource state machine permits the requested transition from its current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "segregation of duties: verify-docs / reject-docs actor differs from supplier-docs submitter; pay actor differs from approve actor; POST_DELIVERY auditor differs from certificate issuer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /api/components/{componentId}/verify-docs", "POST /api/components/{componentId}/reject-docs", "POST /api/warranty-claims/{warrantyClaimId}/pay", "POST /api/audit-records"]
  - priority: 6
    category: business_safety
    check: "accessibility safety gate: for a federally funded agency, a bus whose BusConfiguration.accessibility_features lacks WHEELCHAIR_LIFT may not be engineered; domestic content gate: federally funded bus may not enter PLANT_INSPECTION without an ISSUED certificate whose domestic_content_pct >= threshold_pct"
    error_id: ERR_DOMESTIC_CONTENT_BELOW_THRESHOLD
    http_status: 422
    applies_to: ["POST /api/bus-units/{busUnitId}/submit-plant-inspection", "POST /api/bus-units/{busUnitId}/engineer"]
  - priority: 7
    category: business_constraint
    check: "production slot interval conflict on same line_id (half-open overlap); training session same-agency same-calendar-date conflict (whole-day)"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: ["POST /api/production-slots", "POST /api/production-slots/{productionSlotId}/assign", "POST /api/training-sessions"]
  - priority: 8
    category: business_constraint
    check: "uniqueness: agency_code unique; serial_number server-minted unique; at most one ISSUED ComplianceCertificate per bus"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: ["POST /api/agencies", "POST /api/bus-units/{id}/compliance-certificates"]
  - priority: 9
    category: business_temporal
    check: "option exercise at or before exercise_deadline; training cancel strictly before scheduled_date; warranty review within base warranty window"
    error_id: ERR_DEADLINE_PASSED
    http_status: 422
    applies_to: ["POST /api/option-orders/{optionOrderId}/exercise", "POST /api/training-sessions/{trainingSessionId}/cancel", "POST /api/warranty-claims/{warrantyClaimId}/start-review"]
  - priority: 10
    category: business_referential
    check: "referenced entities exist and are usable: bus_configuration must be FROZEN at engineer; PartsKit component_ids must reference existing Components; PartsStock (agency_id, component_id) pair unique"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: ["POST /api/bus-units/{busUnitId}/engineer", "POST /api/parts-kits", "POST /api/parts-stocks"]
  - priority: 11
    category: business_fiscal
    check: "fiscal sanity: quantities and prices positive; claimed_amount_cents > 0; PartsStock quantity >= reserved_quantity after mutation"
    error_id: ERR_FISCAL_VIOLATION
    http_status: 422
    applies_to: ["POST /api/contracts", "POST /api/warranty-claims", "PATCH /api/parts-stocks/{partsStockId}"]
  - priority: 12
    category: state
    check: "OCC: expected_contract_version matches Contract.version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /api/option-orders/{optionOrderId}/exercise", "POST /api/bus-configurations/{busConfigurationId}/freeze"]

endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["evaluate time-based auto-transitions (OptionOrder EXPIRED, BusUnit auto-ACCEPT)"]

  - method: POST
    path: "/api/agencies"
    description: "Create a transit agency"
    roles: [PlatformAdmin]
    code: 201
    input: [name, agency_code, "federally_funded?", "fleet_transition_target_pct?", "transition_target_year?"]
    output: Agency
    side_effects: ["status=ACTIVE, zev_ratio=0, projected_zev_ratio=0"]

  - method: GET
    path: "/api/agencies"
    description: "List agencies with pagination and optional status filter"
    roles: [PlatformAdmin, ProcurementOfficer, AgencyAdmin, Auditor, WarrantyAdmin, AgencyInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []

  - method: GET
    path: "/api/agencies/{agencyId}"
    description: "Get an agency including computed zev ratios"
    roles: [PlatformAdmin, ProcurementOfficer, AgencyAdmin, Auditor, WarrantyAdmin, AgencyInspector]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: PATCH
    path: "/api/agencies/{agencyId}"
    description: "Update agency fields or suspend/reactivate (status transition)"
    roles: [AgencyAdmin, PlatformAdmin]
    code: 200
    input: ["name?", "federally_funded?", "fleet_transition_target_pct?", "transition_target_year?", "status?"]
    output: Agency
    side_effects: ["suspend blocked while contracts AWARDED/ACTIVE"]

  - method: GET
    path: "/api/agencies/{id}/contracts"
    description: "List contracts of an agency (FK reverse reachability)"
    roles: [PlatformAdmin, ProcurementOfficer, AgencyAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: GET
    path: "/api/agencies/{id}/training-sessions"
    description: "List training sessions of an agency"
    roles: [PlatformAdmin, WarrantyAdmin, AgencyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TrainingSession[]
    side_effects: []

  - method: GET
    path: "/api/agencies/{id}/parts-stocks"
    description: "List parts stock of an agency"
    roles: [PlatformAdmin, WarrantyAdmin, AgencyAdmin]
    code: 200
    input: ["component_id?", "limit?", "offset?"]
    output: PartsStock[]
    side_effects: []

  - method: POST
    path: "/api/contracts"
    description: "Create a procurement contract in DRAFT"
    roles: [ProcurementOfficer]
    code: 201
    input: [agency_id, base_quantity, base_unit_price_cents, base_contract_year, escalation_index, "option_years?", "option_specs?"]
    output: Contract
    side_effects: ["agency must be ACTIVE"]

  - method: GET
    path: "/api/contracts"
    description: "List contracts with filters"
    roles: [PlatformAdmin, ProcurementOfficer, AgencyAdmin, Auditor, ProductionPlanner]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: GET
    path: "/api/contracts/{contractId}"
    description: "Get a contract"
    roles: [PlatformAdmin, ProcurementOfficer, AgencyAdmin, Auditor, ProductionPlanner]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/api/contracts/{contractId}/award"
    description: "Award a DRAFT contract; creates AVAILABLE option orders"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["creates option_years OptionOrders with computed exercise_deadline", "increments Contract.version by 1"]

  - method: POST
    path: "/api/contracts/{contractId}/activate"
    description: "Activate an AWARDED contract after a passing PRE_AWARD audit"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["increments Contract.version by 1"]

  - method: POST
    path: "/api/contracts/{contractId}/complete"
    description: "Complete an ACTIVE contract when all buses and options are terminal"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/api/contracts/{contractId}/terminate"
    description: "Terminate a contract; cascades to options, buses, slots, kits"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["OptionOrder AVAILABLE->EXPIRED; BusUnit ORDERED/ENGINEERED->REJECTED; ProductionSlot->CANCELLED; PartsKit->CONSUMED"]

  - method: GET
    path: "/api/contracts/{id}/option-orders"
    description: "List option orders of a contract"
    roles: [PlatformAdmin, ProcurementOfficer, AgencyAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OptionOrder[]
