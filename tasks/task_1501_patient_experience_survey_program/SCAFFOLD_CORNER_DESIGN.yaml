          trigger:
            - { call: "POST /api/sample-cases", payload: { cycle_id: "${cy}", discharge_id: "${d_ids[0]}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { err: "$.data.error_id" } }
          assert:
            - "422 ERR_DISCHARGE_OUTSIDE_WINDOW"

      - name: discharge_already_sampled
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_DISCHARGE_ALREADY_SAMPLED]"
        distinguishing_aspect: "A discharge referenced by a live SampleCase cannot be sampled again in the same or another non-VOIDED cycle -> 409 ERR_DISCHARGE_ALREADY_SAMPLED."
        test_recipe:
          setup: ["cycle SAMPLING_OPEN; discharge d already sampled (case k exists)"]
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-V7", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
