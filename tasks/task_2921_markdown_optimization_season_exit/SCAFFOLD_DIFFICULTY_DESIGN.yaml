              as: PricingAnalyst
              as_user_id: "pa-1"
          assert:
            - "ZoneExecution.${exec1_id}.status == ROLLED_BACK and it still carries per_unit_markdown_cents == 1128 and line_markdown_cents == 225600 as history"
            - "Item.${item_a_id}.current_retail_cents == 4999, restored to original_retail_cents"
            - "Item.${item_a_id}.permanent_markdown_reserve_cents == 0 and promo_discount_cents == 0, so margin_exposure_cents is back to its pre-apply 0"
            - "Item.${item_a_id}.markdown_state == FULL_PRICE and lifecycle_stage == AGING (R4 no longer matches, R5 does via slow_seller)"
            - "MarkdownPlan.${plan_id}.gross_markdown_cents == 0 and net_markdown_cents == 0, because ROLLED_BACK executions leave the input_set"
            - "MarkdownPlan.${plan_id}.status == EXECUTING - no reverse edge exists, so the plan does NOT return to APPROVED"
            - "MarkdownStep.${step1_id}.status == SCHEDULED, back from EXECUTED"
            - "ClearanceReservation.${res_rank1_id}.status == RESERVED with reserved_units == 500 and allocation_rank == 1"
            - "ClearanceReservation.${res_rank2_id}.status == RESERVED with reserved_units == 100 and allocation_rank == 2"
            - "Season.${season_id}.reserved_clearance_units == 600 and committed_clearance_units == 0"
            - "Season.${season_id}.status == EXIT_WINDOW - the Season state machine has no reverse edge, so this half of the cascade is deliberately NOT compensated"
            - "Store.${store_0202_id}.committed_clearance_units == 500 and available_clearance_units == 0, and Store.${store_0101_id}.committed_clearance_units == 100 and available_clearance_units == 200, so clearance_bay_units == available + booked holds at both stores"
            - "GET /clearance-reservations?markdown_plan_id=${plan_id} returns total_count == 2 and no reservation at store 0303 (REMODEL is never a candidate)"
      - name: claim_reversal_restores_cap_and_net_markdown_but_not_rejected_sibling
        grounds:
          - calculations.vendor_funding_recognition
          - state_machines.VendorClaim.RECOGNIZED_to_REVERSED
          - state_machines.VendorAllowanceAgreement.FUNDED_to_AGREED
          - entities.MarkdownPlan.fields.net_markdown_cents
          - state_machines.VendorClaim.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          The conserved quantity is funding_cap_cents == remaining_cap_cents + sum(recognized_cents of RECOGNIZED
          claims): reversal must restore the cap, the agreement status and net_markdown_cents exactly, yet the
          sibling claim REJECTED by the cascade stays rejected, so the compensation is deliberately asymmetric.
        test_recipe:
          setup:
            - "Season FW26-APPAREL is ACTIVE, item A-1001 has an EXECUTING PERMANENT plan whose 200-unit execution applied at 22.57% depth, so gross_markdown_cents == 225600"
            - "A VendorAllowanceAgreement for VN-100 / APPAREL is AGREED at share 25.00% with funding_cap_cents 56400, which is exactly 25.00% of the gross"
            - "Claim 1 for 56400c and claim 2 for 10000c were both created while SUBMITTED; recognising claim 1 took the whole 56400 (min of claim, plan headroom 56400 and remaining cap 56400), drove the agreement to FUNDED and cascaded claim 2 to REJECTED / CAP_EXHAUSTED"
            - "At that point MarkdownPlan.vendor_funded_cents == 56400 and net_markdown_cents == 169200"
          setup_api_calls:
