  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: offer_expiry_half_open_window_on_lock
        grounds:
          - validations[priority=9]
          - state_machines.Application.PREQUALIFIED_to_UNDER_REVIEW
          - entities.Offer.fields.expires_at
        distinguishing_aspect: |
          Interval semantics A (half-open validity window on Offer): an Offer is lockable while clock_now is strictly
          before expires_at (clock_now < expires_at), and rejected with ERR_OFFER_EXPIRED once clock_now reaches
          expires_at — the boundary is treated as the closed (expired) end of the validity interval.
        test_recipe:
          setup:
            - "An Application prequalified at clock 2026-06-01T00:00:00Z; Offer expires_at = +OFFER_TTL_HOURS. Clock then advanced past expiry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b14@x.com", full_name: "B Fourteen", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b14_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b14_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b14_id}"
              captures: { app14_id: $.data.id, app14_ver: $.data.version }
            - call: "POST /applications/${app14_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b14_id}"
            - call: "GET /offers"
              payload: { application_id: "${app14_id}" }
              as: Borrower
              as_user_id: "${b14_id}"
              captures: { offer14_id: "$.data[0].id"}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /offers/${offer14_id}/lock"
              payload: { expected_application_version: "${app14_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b14_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OFFER_EXPIRED (clock_now >= expires_at closes the half-open validity window)"
            - "Offer.${offer14_id}.status == PRESENTED (lock rejected)"

      - name: pool_capacity_aggregate_interval_at_funding
        grounds:
          - validations[priority=13]
          - calculations.pool_capacity_check
          - entities.AbsPool.fields.committed_principal_cents
          - entities.AbsPool.fields.max_principal_cents
        distinguishing_aspect: |
          Interval semantics B (aggregate-capacity occupation, not a time window): a Loan's principal occupies
          [committed, committed+principal] within the pool's [0, max_principal_cents] capacity band; funding is
          rejected with ERR_NO_ELIGIBLE_POOL when committed + principal would exceed max — a capacity overlap, a
          different interval geometry than the Offer time window, on a different resource entity (AbsPool).
        test_recipe:
          setup:
            - "An APPROVED application requesting 5,000,000; the only OPEN pool already committed 18,000,000 of a 20,000,000 cap (remaining 2,000,000 < 5,000,000)."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /abs-pools"
              payload: { pool_code: "POOL-FULL", max_principal_cents: 20000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
              captures: { pool_full_id: $.data.id }
            # Consume 18,000,000 of the pool via a prior funded loan of 18,000,000
            - call: "POST /borrowers"
              payload: { email: "bfill@x.com", full_name: "Filler", annual_income_cents: 100000000, fico_band: "PRIME" }
              as: Borrower
              captures: { bfill_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${bfill_id}", requested_principal_cents: 18000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
