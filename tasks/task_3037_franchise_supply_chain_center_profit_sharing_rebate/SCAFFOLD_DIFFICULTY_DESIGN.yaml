          assert:
            - "err == ERR_STORE_NOT_ACTIVE"
            - "DeliveryRoute.${route_id}.status == PLANNED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: price_book_window_overlap
        grounds:
          - validations.priority_11_business_referential
          - entities.PriceBook.fields.effective_from
          - entities.PriceBook.fields.effective_until
        distinguishing_aspect: |
          PriceBook window conflict on the (product_id, store_tier) resource uses
          closed-open interval semantics: a new book is rejected if
          new.from < existing.until AND new.until > existing.from.
          Adjacent windows (new.from == existing.until) are ALLOWED — half-open
          interval semantics on the PriceBook resource.
        test_recipe:
          setup:
            - "Center ACTIVE. Existing PriceBook for product P STANDARD covering [2026-01-01, 2026-06-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-TO", display_name: "TemporalOverlap", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 1000 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.1, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-06-01T00:00:00Z", expected_center_version: "${center_v_fresh}" }
              as: SupplyChainAdmin
          trigger:
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh2: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.2, min_quantity: 1, effective_from: "2026-05-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z", expected_center_version: "${center_v_fresh2}" }
              as: SupplyChainAdmin
              captures: { err_overlap: $.data.error_id }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh3: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.2, min_quantity: 1, effective_from: "2026-06-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z", expected_center_version: "${center_v_fresh3}" }
              as: SupplyChainAdmin
              captures: { pb_ok: $.data.id, pb_ok_v: $.data.version }
          assert:
            - "err_overlap == ERR_PRICE_BOOK_OVERLAP"
            - "PriceBook.${pb_ok} was created — adjacent windows allowed"

      - name: promotion_window_overlap
        grounds:
          - validations.priority_12_business_temporal
          - entities.PromotionEvent.fields.start_date
          - entities.PromotionEvent.fields.end_date
        distinguishing_aspect: |
          PromotionEvent window conflict on affected_product_ids uses a
          closed-interval overlap: a new promotion is rejected if it shares ANY
          affected product AND its date range intersects (including touching
          boundaries). Different interval semantics than PriceBook — touching
          end_date == start_date counts as overlap on the PromotionEvent resource.
        test_recipe:
          setup:
            - "Center ACTIVE. Existing CONFIRMED promotion covering 2026-09-07 to 2026-09-14 affecting product P."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-PO", display_name: "PromoOverlap", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "FOOD_INGREDIENT", base_cost_cents_per_unit: 1000, is_promotion_eligible: true }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/promotions"
              payload: { promotion_code: "PROMO1", start_date: "2026-09-07T00:00:00Z", end_date: "2026-09-14T00:00:00Z", surge_multiplier: 2.0, affected_product_ids: ["${prod_id}"] }
              as: SupplyChainAdmin
              captures: { promo1: $.data.id, promo1_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/promotions/${promo1}/confirm"
              payload: {}
              as: SupplyChainAdmin
          trigger:
            - call: "POST /supply-centers/${center_id}/promotions"
              payload: { promotion_code: "PROMO2", start_date: "2026-09-14T00:00:00Z", end_date: "2026-09-21T00:00:00Z", surge_multiplier: 1.5, affected_product_ids: ["${prod_id}"] }
              as: SupplyChainAdmin
              captures: { promo2: $.data.id, promo2_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/promotions/${promo2}/confirm"
              payload: {}
              as: SupplyChainAdmin
              captures: { err_touch: $.data.error_id }
          assert:
            - "err_touch == ERR_PROMOTION_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: po_submit_cancel_preserves_outstanding_balance
        grounds:
          - state_machines.PurchaseOrder
          - entities.Store.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Invariant: Store.outstanding_balance_cents is unchanged across a
          submit-then-cancel round-trip for a DRAFT/SUBMITTED PO (no settlement
          occurred). Conserved quantity: outstanding_balance_cents.
          Forward: submit. Compensating: cancel. Balance MUST equal original.
        test_recipe:
          setup:
            - "Center ACTIVE. Store ACTIVE with credit_limit=1000000c, outstanding_balance=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-INV", display_name: "Invariant", base_weekly_capacity_units: 100000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 1000 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.1, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v_fresh}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-INV", operator_name: "INV", credit_limit_cents: 1000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id, po_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { balance_before: $.data.outstanding_balance_cents, store_v_now: $.data.version }
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v_now}" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/cancel"
              payload: { reason: "invariant test" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { balance_after: $.data.outstanding_balance_cents }
          assert:
            - "balance_after == balance_before"
            - "balance_after == 0"
            - "PurchaseOrder.${po_id}.status == CANCELLED"

      - name: capacity_plan_allocation_conserved_on_short
        grounds:
          - state_machines.OrderLine
          - entities.CapacityPlan.fields.allocated_units
          - entities.CapacityPlan.fields.available_units
        distinguishing_aspect: |
          Invariant: CapacityPlan.allocated_units + CapacityPlan.available_units
          == baseline_units + surge_units at all times. When an OrderLine is
          marked SHORTED (forward), allocated_units decreases by line quantity
          (compensating). The sum is conserved. Different conserved quantity
          (capacity allocation) than outstanding_balance_cents (fiscal).
        test_recipe:
          setup:
            - "Center ACTIVE. CapacityPlan for week with baseline=1000, allocated=100, available=900. One CONFIRMED PO with one line of 10 units assigned to that week's capacity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers"
              payload: { center_code: "SC-CAP", display_name: "CapacityInv", base_weekly_capacity_units: 1000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 100 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "GET /supply-centers/${center_id}"
              payload: {}
              as: Any
              captures: { center_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.0, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v_fresh}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-CAP", operator_name: "CAP", credit_limit_cents: 100000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/capacity-plans"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: SupplyChainAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id, po_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { store_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v_fresh}" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /supply-centers/${center_id}/purchase-orders/${po_id}/confirm"
              payload: {}
              as: SupplyChainAdmin
            - call: "GET /supply-centers/${center_id}/capacity-plans/${plan_id}"
              payload: {}
              as: Any
              captures: { alloc_before: $.data.allocated_units, avail_before: $.data.available_units }
          trigger:
            - call: "POST /supply-centers/${center_id}/purchase-orders/${po_id}/lines/${line_id}/mark-shorted"
              payload: {}
              as: RouteCoordinator
            - call: "GET /supply-centers/${center_id}/capacity-plans/${plan_id}"
              payload: {}
              as: Any
              captures: { alloc_after: $.data.allocated_units, avail_after: $.data.available_units }
          assert:
            - "alloc_after + avail_after == alloc_before + avail_before"
            - "alloc_after == alloc_before - 10"
            - "avail_after == avail_before + 10"
