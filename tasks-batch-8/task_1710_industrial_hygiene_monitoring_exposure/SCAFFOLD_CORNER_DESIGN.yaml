          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "PUT /ih/sampling-plans/{id} is OCC-guarded: the first revise at version 1 succeeds (version -> 2), a second revise still carrying version 1 is 412; after submit, a revise with the FRESH version passes OCC but fails state (409 ERR_PLAN_INVALID_STATE) — proving the p5-before-p6 ordering."
