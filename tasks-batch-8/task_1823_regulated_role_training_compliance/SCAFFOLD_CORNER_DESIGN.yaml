      - name: manager_cannot_grant_extension_on_own_assignment
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_SELF_ACTION_FORBIDDEN]"
          - "roles[Manager]"
        distinguishing_aspect: "Segregation of duties: a manager who is themself the assignee may not extend their own due date — self-check fires before the direct-report check."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-SOD; curriculum CUR-SOD ACTIVE; role R-SOD WITH a SOFT INITIAL_ONLY req (due 30); manager M-SOD is in R-SOD and holds assignment A (manager_id null)"]
