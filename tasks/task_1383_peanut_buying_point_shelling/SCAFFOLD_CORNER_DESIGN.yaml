      - name: missing_auth_headers_return_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID fail at priority 1 with 401 ERR_UNAUTHENTICATED — before schema, role, or existence checks; the test issues the call with both headers omitted."
        test_recipe:
          setup: ["BP exists"]
          setup_api_calls:
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
          trigger:
            - call: "GET /buying-points/${bp}"
              payload: {}
              as: BuyingPointAdmin
              captures: { err: $.data.error_id }
          assert:
            - "With X-User-Role and X-User-ID omitted: http 401, error_id == ERR_UNAUTHENTICATED"

