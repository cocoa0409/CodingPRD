      - name: catalog_markup_rounds_the_half_cent_up
        claim_type: precision
        grounds:
          - calculations.catalog_price_markup
          - entities.CatalogItem.catalog_price_cents
        distinguishing_aspect: "The markup product is rounded half-up at the whole cent in both directions: 350 * 1.15 == 402.5 becomes 403, while 461 * 1.15 == 530.15 becomes 530."
        test_recipe:
          setup:
            - "Retailer R1 with catalog_markup_pct 0.15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: DispatchAdmin
            - call: "POST /retailers"
              payload: { legal_name: "Bay Fresh Market LLC", store_code: "BFM-01", catalog_markup_pct: 0.15 }
              as: DispatchAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-HALF-UP", name: "Half Cent Up", pricing_unit: "EACH", in_store_price_cents: 350 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { up: $.data.id }
            - call: "POST /catalog-items"
              payload: { retailer_id: "${r1}", sku: "SKU-ROUND-DOWN", name: "Rounds Down", pricing_unit: "EACH", in_store_price_cents: 461 }
              as: RetailerManager
              as_user_id: "${r1}"
              captures: { dn: $.data.id }
          assert:
            - "CatalogItem.${up}.catalog_price_cents == 403 (402.5 rounds half-up, never truncates to 402)"
            - "CatalogItem.${dn}.catalog_price_cents == 530 (530.15 rounds down)"
            - "Both items have is_weighted == false and availability == IN_STOCK"

