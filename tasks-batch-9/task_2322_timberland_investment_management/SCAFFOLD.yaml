scenario: "2322. Timberland Investment Management (timberland investment management organization): property acquisition underwriting with timber inventory cruise, growth modeling and market access analysis, harvest scheduling optimized across biological growth, price expectations and cash yield requirements, sustainable forestry certification maintenance and audit compliance, higher-and-better-use land identification and disposition program, hunting and recreational lease revenue administration, carbon offset project development and inventory dedication decisions, wildfire, insect and weather risk assessment with insurance and salvage planning, investor reporting with independent timberland appraisal and valuation methodology"
domain_name: "timberland-investment-management"
api_prefix: "/timberland"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  # Stand is the contested inventory pool: HarvestBlock, CarbonDedication and
  # HbuParcel are independent claimants against the same tons, Stand references
  # itself through split_from_stand_id, and CarbonDedication is a junction over
  # (CarbonProject x Stand). No single ownership tree exists.
  state_machine_shape: cyclic
  # Cycles on UnderwritingCase (REVISION_REQUESTED<->SUBMITTED), HarvestBlock
  # (RESERVED<->COMMITTED), CertificationAudit (FINDINGS_ISSUED<->CAR_REVIEW),
  # AuditFinding (OPEN<->CAR_SUBMITTED), CarbonProject
  # (REGISTERED<->REVERSAL_PENDING), Property.status (OWNED<->HBU_MARKETED),
  # plus a parallel dimension pair on Property (status x appraisal_status).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Fund name.
        constraints: "1..120 chars"
      - name: vintage_year
        type: integer
        source: input
        description: Vintage year of the closed-end timberland fund.
        constraints: "2000..2100"
      - name: committed_capital_usd
        type: number
        source: input
        description: Total limited-partner commitments; denominator of cash_yield_bps.
        constraints: "> 0, 2 decimals"
      - name: target_cash_yield_bps
        type: integer
        source: input
        description: Investor-mandated annual cash yield in basis points.
        constraints: "0..5000"
      - name: opening_cash_usd
        type: number
        source: input
        description: Drawn cash at fund inception; seeds cash_balance_usd.
        constraints: ">= 0, 2 decimals"
      - name: cash_balance_usd
        type: number
        source: computed
        description: "Running fund cash. Initialised to opening_cash_usd; credited by harvest COMPLETE net revenue, HBU CLOSE net proceeds, lease activation prorated rent and hazard claim settlement; debited by property acquisition price, lease termination refunds, insurance premiums and carbon buffer cure cost."
        default: "= opening_cash_usd"
      - name: net_operating_cash_usd
        type: number
        source: computed
        description: "Inception-to-date OPERATING cash only (excludes acquisition capital outflow). See calculations.fund_nav_and_cash_yield."
        default: 0.00
      - name: cash_yield_bps
        type: integer
        source: computed
        description: "round_half_up(net_operating_cash_usd / committed_capital_usd * 10000, 0)."
      - name: harvest_acceleration_required
        type: boolean
        source: computed
        description: "True when cash_yield_bps < target_cash_yield_bps (strict less-than). Gates HarvestBlock cancellation."
        default: false
      - name: nav_usd
        type: number
        source: computed
        description: "Net asset value; recomputed on every read of the Fund and of the investor report. See calculations.fund_nav_and_cash_yield."
        default: 0.00
      - name: replan_property_count
        type: integer
        source: computed
        description: "Count of Property rows of this fund with harvest_plan_status == REPLAN_REQUIRED."
        default: 0
      - name: valuation_basis_stale_count
        type: integer
        source: computed
        description: "Count of Property rows of this fund with status IN {OWNED, HBU_MARKETED} AND appraisal_status != SIGNED (staleness itself is applied by the lazy SIGNED -> STALE transition in state_machines)."
        default: 0

  - name: Property
    parent: Fund
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id; owning fund, immutable after creation."
      - name: name
        type: string
        source: input
        description: Tract name.
        constraints: "1..120 chars"
      - name: region_code
        type: enum
        source: input
        description: Geographic region; drives the wildfire multiplier in the risk calculation.
        constraints: "SOUTH | WEST | NORTHEAST"
      - name: total_acres
        type: number
        source: input
        description: Deeded acreage of the tract; denominator of the recreational-lease coverage cap.
        constraints: "> 0, 2 decimals"
      - name: haul_distance_miles
        type: integer
        source: input
        description: Distance from tract centroid to the nearest merchandising mill; drives market_access_tier.
        constraints: "0..600"
      - name: insured_value_usd
        type: number
        source: input
        description: Insured value used as the premium base.
        constraints: ">= 0, 2 decimals"
      - name: hbu_acres
        type: number
        source: input
        description: Acreage judged higher-and-better-use at underwriting; an underwriting input only.
        constraints: ">= 0, 2 decimals"
      - name: hbu_price_per_acre_usd
        type: number
        source: input
        description: Expected HBU land price per acre at underwriting.
        constraints: ">= 0, 2 decimals"
      - name: annual_rec_income_usd
        type: number
        source: input
        description: Expected stabilised annual recreational-lease income used at underwriting.
        constraints: ">= 0, 2 decimals"
      - name: certification_scheme
        type: enum
        source: input
        description: Sustainable-forestry scheme the tract is enrolled in.
        constraints: "SFI | FSC | NONE"
      - name: status
        type: enum
        source: computed
        description: "Acquisition/disposition lifecycle dimension. Evolves independently of appraisal_status."
        default: PROSPECT
        constraints: "PROSPECT | UNDER_UNDERWRITING | APPROVED_FOR_BID | PASSED | OWNED | HBU_MARKETED"
      - name: appraisal_status
        type: enum
        source: computed
        description: "Independent-appraisal dimension. Evolves independently of status."
        default: NONE
        constraints: "NONE | SUBMITTED | SIGNED | STALE"
      - name: appraisal_methodology
        type: enum
        source: input
        description: Valuation methodology of the most recent appraisal submission.
        default: null
        constraints: "INCOME | MARKET | COST | null"
      - name: appraised_value_usd
        type: number
        source: computed
        description: "Value produced by calculations.appraised_value_by_methodology at appraisal SUBMIT."
        default: null
      - name: appraisal_submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IndependentAppraiser that submitted the current appraisal."
        default: null
      - name: appraisal_signed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IndependentAppraiser that signed the current appraisal; segregation-of-duties counterpart of appraisal_submitted_by_user_id."
        default: null
      - name: appraisal_signed_at
        type: datetime
        source: system
        description: "Logical-clock instant the appraisal was signed; freshness input to fund_nav_and_cash_yield."
        default: null
      - name: certification_posture
        type: enum
        source: computed
        description: "Derived gate over open audit findings; see calculations.certification_posture_derivation. Recomputed on audit create/advance and finding create/transition."
        default: CERTIFIED
        constraints: "CERTIFIED | CONDITIONAL | SUSPENDED | UNCERTIFIED"
      - name: harvest_plan_status
        type: enum
        source: computed
        description: "Flips to REPLAN_REQUIRED whenever any HarvestBlock on this property has planned_tons cut by an inventory-loss waterfall; returns to ALIGNED when a new HarvestBlock is created on any of the property's stands."
        default: ALIGNED
        constraints: "ALIGNED | REPLAN_REQUIRED"
      - name: market_access_tier
        type: enum
        source: computed
        description: "Tier selected from haul_distance_miles: TIER_A <= 40; 41..80 TIER_B; 81..140 TIER_C; >= 141 TIER_D."
        constraints: "TIER_A | TIER_B | TIER_C | TIER_D"
      - name: market_access_discount_pct
        type: number
        source: computed
        description: "0.0 / 4.5 / 9.0 / 15.0 for TIER_A/B/C/D respectively."
      - name: insurance_rating_basis
        type: enum
        source: input
        description: Variant selector for the insurance premium calculation; set by the risk-review endpoint.
        default: null
        constraints: "ACTUARIAL | EXPERIENCE_RATED | null"
      - name: wildfire_hazard_index
        type: number
        source: input
        description: Raw wildfire hazard index from the most recent risk review.
        default: null
        constraints: "0..100, 2 decimals"
      - name: insect_hazard_index
        type: number
        source: input
        description: Raw insect/disease hazard index from the most recent risk review.
        default: null
        constraints: "0..100, 2 decimals"
      - name: weather_hazard_index
        type: number
        source: input
        description: Raw wind/ice/drought hazard index from the most recent risk review.
        default: null
        constraints: "0..100, 2 decimals"
      - name: composite_risk_score
        type: number
        source: computed
        description: "Weighted hazard score; see calculations.insurance_premium_and_risk_score."
        default: null
      - name: insurance_premium_usd
        type: number
        source: computed
        description: "Annual premium under insurance_rating_basis; debited from Fund.cash_balance_usd at each risk review."
        default: null
      - name: acquisition_price_usd
        type: number
        source: system
        description: "Bid actually paid at acquisition, copied from the approved UnderwritingCase.bid_price_usd."
        default: null

  - name: Stand
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; tract the stand sits on."
      - name: split_from_stand_id
        type: string
        source: input
        description: "FK -> Stand.id; self-reference set when this stand was minted by an HBU parcel closing. Null for cruised stands."
        default: null
      - name: stand_code
        type: string
        source: input
        description: Operator-assigned stand label.
        constraints: "1..40 chars"
      - name: acres
        type: number
        source: input
        description: "Stand acreage as supplied at creation; subsequently reduced by HBU parcel closings (see hbu_disposition_split)."
        constraints: "> 0, 2 decimals"
      - name: species_code
        type: enum
        source: input
        description: Dominant species; keys the growth and insect-multiplier constants.
        constraints: "LOBLOLLY_PINE | DOUGLAS_FIR | NORTHERN_HARDWOOD"
      - name: age_years
        type: integer
        source: input
        description: Stand age at creation.
        constraints: "0..200"
      - name: site_index
        type: integer
        source: input
        description: Site productivity index.
        constraints: "20..140"
      - name: status
        type: enum
        source: computed
        description: Stand lifecycle state.
        default: CRUISE_OPEN
        constraints: "CRUISE_OPEN | INVENTORIED | SALVAGE_PENDING | DISPOSED"
      - name: plot_count
        type: integer
        source: computed
        description: "Count of CruisePlot rows for this stand."
        default: 0
      - name: mean_net_tons_per_acre
        type: number
        source: computed
        description: "Mean of the per-plot rounded net tons per acre; 3 decimals. See calculations.stand_cruise_volume."
        default: null
      - name: cruise_confidence
        type: enum
        source: computed
        description: "NORMAL when plot_count >= 5 at cruise close, otherwise LOW (which applies the low-confidence haircut)."
        default: NONE
        constraints: "NONE | LOW | NORMAL"
      - name: gross_merch_tons
        type: number
        source: computed
        description: "Pre-haircut merchantable volume at cruise close."
        default: 0.00
      - name: net_merch_tons
        type: number
        source: computed
        description: "Merchantable standing inventory pool. Set at cruise close, reduced by HazardEvent damage and by harvest COMPLETE actual_tons."
        default: 0.00
      - name: reserved_tons
        type: number
        source: computed
        description: "round_half_up(sum of HarvestBlock.planned_tons where stand_id == this stand AND status == RESERVED, 2)."
        default: 0.00
      - name: committed_tons
        type: number
        source: computed
        description: "round_half_up(sum of HarvestBlock.planned_tons where stand_id == this stand AND status == COMMITTED, 2)."
        default: 0.00
      - name: dedicated_tons
        type: number
        source: computed
        description: "round_half_up(sum of (CarbonDedication.dedicated_tons - CarbonDedication.reduced_tons) where stand_id == this stand AND status IN {PENDING, ACTIVE, REDUCED}, 2)."
        default: 0.00
      - name: hbu_withdrawn_tons
        type: number
        source: computed
        description: "round_half_up(sum of HbuParcel.withdrawn_tons where stand_id == this stand AND status == CLOSED, 2)."
        default: 0.00
      - name: available_tons
        type: number
        source: computed
        description: "round_half_up(net_merch_tons - reserved_tons - committed_tons - dedicated_tons - hbu_withdrawn_tons, 2). The conserved-quantity identity of the whole scaffold."
        default: 0.00

  - name: CruisePlot
    parent: Stand
    common_fields: false
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; stand this plot measures."
      - name: plot_number
        type: integer
        source: input
        description: Plot ordinal within the stand; unique per stand.
        constraints: ">= 1, unique per stand_id"
      - name: tons_per_acre
        type: number
        source: input
        description: Gross measured tons per acre on this plot.
        constraints: "> 0, 2 decimals"
      - name: defect_pct
        type: number
        source: input
        description: Cull/defect percentage observed on this plot.
        constraints: "0..100, 2 decimals"
      - name: measured_at
        type: datetime
        source: input
        description: Field measurement instant (ISO 8601 UTC).
      - name: net_tons_per_acre
        type: number
        source: computed
        description: "round_half_up(tons_per_acre * (1 - defect_pct / 100), 3) — the per-plot rounding step the cruise calculation pins."
      - name: measured_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller that recorded the plot."

  - name: UnderwritingCase
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; tract being underwritten."
      - name: growth_variant
        type: enum
        source: input
        description: Variant selector for the growth model used by this case.
        constraints: "YIELD_TABLE | MAI_LINEAR"
      - name: discount_rate_bps
        type: integer
        source: input
        description: Discount rate applied to periodic timber cash flows.
        constraints: "1..5000"
      - name: stumpage_price_usd_per_ton
        type: number
        source: input
        description: Price expectation per merchantable ton across all three projection periods.
        constraints: "> 0, 2 decimals"
      - name: bid_price_usd
        type: number
        source: input
        description: Bid the committee is asked to approve; must not exceed underwritten_value_usd at submit.
        constraints: "> 0, 2 decimals"
      - name: status
        type: enum
        source: computed
        description: Review-cycle state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED | WITHDRAWN"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of REVISION_REQUESTED decisions issued on this case. Third request is rejected (MAX_REVISION_ROUNDS = 2)."
        default: 0
      - name: timber_pv_usd
        type: number
        source: computed
        description: "Present value of the three periodic harvests; see calculations.underwritten_value."
        default: null
      - name: hbu_premium_usd
        type: number
        source: computed
        description: "round_half_up(Property.hbu_acres * Property.hbu_price_per_acre_usd, 2)."
        default: null
      - name: rec_income_pv_usd
        type: number
        source: computed
        description: "round_half_up(Property.annual_rec_income_usd * REC_INCOME_MULTIPLE, 2)."
        default: null
      - name: pre_fee_value_usd
        type: number
        source: computed
        description: "round_half_up(timber_pv_usd + hbu_premium_usd + rec_income_pv_usd, 2). The value the acquisition-fee tier is keyed on."
        default: null
      - name: acquisition_fee_pct
        type: number
        source: computed
        description: "Fee tier selected by pre_fee_value_usd, NOT by underwritten_value_usd."
        default: null
      - name: acquisition_fee_usd
        type: number
        source: computed
        description: "round_half_up(pre_fee_value_usd * acquisition_fee_pct / 100, 2)."
        default: null
      - name: underwritten_value_usd
        type: number
        source: computed
        description: "round_half_up(pre_fee_value_usd - acquisition_fee_usd, 2)."
        default: null
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AcquisitionAnalyst that created the case; segregation-of-duties counterpart of decided_by_user_id."
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the InvestmentCommittee member that issued the last decision."
        default: null
      - name: decision_note
        type: string
        source: input
        description: Free-text rationale recorded with the last decision.
        default: null

  - name: HarvestBlock
    parent: Stand
    common_fields: true
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; stand whose inventory this block reserves."
      - name: planned_start_date
        type: string
        source: input
        description: "Operation window start (YYYY-MM-DD, inclusive)."
      - name: planned_end_date
        type: string
        source: input
        description: "Operation window end (YYYY-MM-DD, inclusive) — the block interval is CLOSED at both ends."
      - name: planned_tons
        type: number
        source: input
        description: "Reserved tons as supplied at creation; subsequently cut by inventory-loss waterfalls (hazard_loss_reallocation, hbu_disposition_split)."
        constraints: "> 0 at creation, 2 decimals"
      - name: actual_tons
        type: number
        source: input
        description: Scaled tons actually removed, supplied at COMPLETE.
        default: null
      - name: product_mix
        type: enum
        source: input
        description: Product mix; keys PRODUCT_MIX_FACTOR in the revenue formula.
        constraints: "SAWTIMBER | MIXED | PULPWOOD"
      - name: expected_stumpage_price_usd_per_ton
        type: number
        source: input
        description: Base stumpage price expectation for this block.
        constraints: "> 0, 2 decimals"
      - name: price_index_factor
        type: number
        source: input
        description: Expected regional price index multiplier at planning time.
        constraints: "0.10..3.00, 2 decimals"
      - name: realized_price_index_factor
        type: number
        source: input
        description: Realized index multiplier supplied at COMPLETE; drives the final revenue variant.
        default: null
      - name: expected_haul_distance_miles
        type: integer
        source: input
        description: Haul distance for this block; capped at MAX_BILLABLE_HAUL_MILES when billed.
        constraints: "0..600"
      - name: growth_variant
        type: enum
        source: input
        description: Growth model used to project standing volume at planned_start_date for the eligibility check.
        constraints: "YIELD_TABLE | MAI_LINEAR"
      - name: years_to_start
        type: integer
        source: computed
        description: "floor((planned_start_date - logical clock date) / 365 whole days) at creation time."
      - name: projected_available_tons
        type: number
        source: computed
        description: "round_half_up(projected_volume - Stand.reserved_tons - Stand.committed_tons - Stand.dedicated_tons - Stand.hbu_withdrawn_tons, 2) where projected_volume is calculations.growth_projection_volume run for years_to_start under this block's growth_variant. Snapshot taken at creation, before this block's own reservation."
      - name: status
        type: enum
        source: computed
        description: Allocation lifecycle state.
        default: RESERVED
        constraints: "RESERVED | COMMITTED | COMPLETED | CANCELLED | VOIDED"
      - name: provisional_net_revenue_usd
        type: number
        source: computed
        description: "Net revenue variant computed at creation from planned_tons and price_index_factor."
      - name: final_net_revenue_usd
        type: number
        source: computed
        description: "Net revenue variant computed at COMPLETE from actual_tons and realized_price_index_factor; credited to Fund cash."
        default: null
      - name: severance_tax_usd
        type: number
        source: computed
        description: "Severance tax of the most recently computed revenue variant."
      - name: voided_reason
        type: enum
        source: computed
        description: Why an inventory-loss waterfall voided the block.
        default: null
        constraints: "HAZARD_LOSS | HBU_WITHDRAWAL | null"

  - name: CarbonProject
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; tract hosting the improved-forest-management project."
      - name: registry
        type: enum
        source: input
        description: Offset registry the project is listed with.
        constraints: "ACR | CAR | VERRA"
      - name: crediting_period_years
        type: integer
        source: input
        description: Crediting period length.
        constraints: "1..40"
      - name: permanence_term_years
        type: integer
        source: input
        description: Permanence obligation length; drives dedication permanence_end_date.
        constraints: "1..100"
      - name: baseline_tons_per_acre
        type: number
        source: input
        description: Baseline carbon stocking assumption.
        constraints: "> 0, 2 decimals"
      - name: status
        type: enum
        source: computed
        description: Registry lifecycle state.
        default: DRAFT
        constraints: "DRAFT | VALIDATION | REGISTERED | REVERSAL_PENDING | TERMINATED"
      - name: dedicated_tons_total
        type: number
        source: computed
        description: "round_half_up(sum of (CarbonDedication.dedicated_tons - reduced_tons) where carbon_project_id == this project AND status IN {PENDING, ACTIVE, REDUCED}, 2)."
        default: 0.00
      - name: buffer_pool_tons
        type: number
        source: computed
        description: "round_half_up(dedicated_tons_total * CARBON_BUFFER_POOL_PCT / 100, 2), fixed at REGISTER and increased by buffer cures."
        default: 0.00
      - name: buffer_deficit_tons
        type: number
        source: computed
        description: "Unfunded reversal obligation accumulated when dedications are cut by a hazard waterfall."
        default: 0.00

  - name: CarbonDedication
    parent: CarbonProject
    common_fields: true
    fields:
      - name: carbon_project_id
        type: string
        source: input
        description: "FK -> CarbonProject.id; project the tons are dedicated to."
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; stand whose inventory is dedicated. Must belong to the project's property."
      - name: dedicated_tons
        type: number
        source: input
        description: Tons withdrawn from the stand's allocatable pool for the permanence term.
        constraints: "> 0, 2 decimals"
      - name: reduced_tons
        type: number
        source: computed
        description: "Tons clawed back by hazard waterfalls; remaining dedication is dedicated_tons - reduced_tons."
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: Dedication lifecycle state.
        default: PENDING
        constraints: "PENDING | ACTIVE | REDUCED | RELEASED"
      - name: permanence_end_date
        type: string
        source: computed
        description: "Logical clock date at project REGISTER plus CarbonProject.permanence_term_years calendar years (YYYY-MM-DD)."
        default: null
      - name: release_reason
        type: string
        source: input
        description: Free-text rationale recorded when the dedication is released.
        default: null

  - name: HbuParcel
    parent: Stand
    common_fields: true
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; stand the parcel is carved out of."
      - name: parcel_code
        type: string
        source: input
        description: Operator-assigned parcel label.
        constraints: "1..40 chars"
      - name: acres
        type: number
        source: input
        description: Parcel acreage; must leave at least MIN_RETAINED_ACRES on the parent stand.
        constraints: "> 0, 2 decimals"
      - name: ask_price_usd
        type: number
        source: input
        description: Listing ask price.
        constraints: "> 0, 2 decimals"
      - name: contract_price_usd
        type: number
        source: input
        description: Contract price supplied at CONTRACT.
        default: null
      - name: closing_costs_usd
        type: number
        source: input
        description: Third-party closing costs supplied at CLOSE.
        default: null
      - name: status
        type: enum
        source: computed
        description: Disposition lifecycle state.
        default: IDENTIFIED
        constraints: "IDENTIFIED | LISTED | UNDER_CONTRACT | CLOSED | WITHDRAWN"
      - name: withdrawn_tons
        type: number
        source: computed
        description: "Pro-rata tons carved off the parent stand at CLOSE; see calculations.hbu_disposition_split."
        default: 0.00
      - name: commission_usd
        type: number
        source: computed
        description: "round_half_up(contract_price_usd * HBU_COMMISSION_PCT / 100, 2)."
        default: null
      - name: net_proceeds_usd
        type: number
        source: computed
        description: "round_half_up(contract_price_usd - commission_usd - closing_costs_usd, 2); credited to Fund cash at CLOSE."
        default: null
      - name: derived_stand_id
        type: string
        source: computed
        description: "FK -> Stand.id; stand minted in DISPOSED at CLOSE carrying the withdrawn acres and tons."
        default: null

  - name: RecreationalLease
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; tract being leased."
      - name: lessee_name
        type: string
        source: input
        description: Hunting-club or lessee name.
        constraints: "1..120 chars"
      - name: leased_acres
        type: number
        source: input
        description: Acres under this lease; counted against the property coverage cap over overlapping terms.
        constraints: "> 0, 2 decimals"
      - name: rent_per_acre_usd
        type: number
        source: input
        description: Annual rent per leased acre.
        constraints: "> 0, 2 decimals"
      - name: term_start_date
        type: string
        source: input
        description: "Term start (YYYY-MM-DD, INCLUSIVE)."
      - name: term_end_date
        type: string
        source: input
        description: "Term end (YYYY-MM-DD, EXCLUSIVE) — lease intervals are HALF-OPEN."
      - name: blackout_start_date
        type: string
        source: input
        description: "Hunting-season blackout start (YYYY-MM-DD, INCLUSIVE)."
      - name: blackout_end_date
        type: string
        source: input
        description: "Hunting-season blackout end (YYYY-MM-DD, EXCLUSIVE)."
      - name: status
        type: enum
        source: computed
        description: Lease lifecycle state.
        default: PENDING
        constraints: "PENDING | ACTIVE | TERMINATED | EXPIRED"
      - name: annual_rent_usd
        type: number
        source: computed
        description: "round_half_up(leased_acres * rent_per_acre_usd, 2)."
      - name: term_days
        type: integer
        source: computed
        description: "(term_end_date - term_start_date) in whole days under half-open semantics."
      - name: first_year_prorated_rent_usd
        type: number
        source: computed
        description: "Rent charged to the lessee at activation; see calculations.lease_rent_and_coverage."
        default: null
      - name: earned_rent_usd
        type: number
        source: computed
        description: "Rent earned from term_start_date to termination_effective_date; see calculations.lease_rent_and_coverage."
        default: 0.00
      - name: refunded_rent_usd
        type: number
        source: computed
        description: "Unearned rent returned at termination = first_year_prorated_rent_usd - earned_rent_usd."
        default: 0.00
      - name: termination_effective_date
        type: string
        source: input
        description: "Effective date of termination (YYYY-MM-DD); earned rent is measured to this date exclusive."
        default: null

  - name: CertificationAudit
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; tract under audit."
      - name: audit_type
        type: enum
        source: input
        description: Audit kind.
        constraints: "SURVEILLANCE | RECERTIFICATION"
      - name: scheduled_date
        type: string
        source: input
        description: "Scheduled field-work date (YYYY-MM-DD)."
      - name: status
        type: enum
        source: computed
        description: Audit lifecycle state.
        default: SCHEDULED
        constraints: "SCHEDULED | FIELD_WORK | FINDINGS_ISSUED | CAR_REVIEW | SUSPENDED | CLOSED_CONFORMING"
      - name: major_finding_count
        type: integer
        source: computed
        description: "Count of AuditFinding rows of this audit with severity == MAJOR."
        default: 0
      - name: open_major_count
        type: integer
        source: computed
        description: "Count with severity == MAJOR AND status IN {OPEN, CAR_SUBMITTED}."
        default: 0
      - name: open_minor_count
        type: integer
        source: computed
        description: "Count with severity == MINOR AND status IN {OPEN, CAR_SUBMITTED}."
        default: 0

  - name: AuditFinding
    parent: CertificationAudit
    common_fields: true
    fields:
      - name: certification_audit_id
        type: string
        source: input
        description: "FK -> CertificationAudit.id; audit that raised the finding."
      - name: finding_code
        type: string
        source: input
        description: Registry finding code.
        constraints: "1..40 chars"
      - name: severity
        type: enum
        source: input
        description: Nonconformance severity; MAJOR counts drive the property posture.
        constraints: "MAJOR | MINOR | OBSERVATION"
      - name: indicator_ref
        type: string
        source: input
        description: Standard indicator reference the finding cites.
        constraints: "1..40 chars"
      - name: due_date
        type: string
        source: input
        description: "Corrective-action due date (YYYY-MM-DD)."
      - name: status
        type: enum
        source: computed
        description: Corrective-action-request cycle state.
        default: OPEN
        constraints: "OPEN | CAR_SUBMITTED | CLOSED"
      - name: car_text
        type: string
        source: input
        description: Corrective-action narrative supplied at SUBMIT_CAR.
        default: null
      - name: car_submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ForestManager that submitted the CAR; segregation-of-duties counterpart of closed_by_user_id."
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CertificationAuditor that verified and closed the finding."
        default: null
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of times a submitted CAR was rejected back to OPEN."
        default: 0

  - name: HazardEvent
    parent: Stand
    common_fields: true
    fields:
      - name: stand_id
        type: string
        source: input
        description: "FK -> Stand.id; stand that sustained the loss."
      - name: event_type
        type: enum
        source: input
        description: Peril; keys SALVAGE_RECOVERY_PCT.
        constraints: "WILDFIRE | INSECT | WIND_STORM | ICE_STORM"
      - name: occurred_at
        type: datetime
        source: input
        description: Event instant (ISO 8601 UTC); trailing-window input to experience-rated premiums.
      - name: damaged_tons
        type: number
        source: input
        description: Merchantable tons destroyed or degraded.
        constraints: "> 0, 2 decimals"
      - name: salvageable_tons
        type: number
        source: computed
        description: "round_half_up(damaged_tons * SALVAGE_RECOVERY_PCT[event_type] / 100, 2)."
      - name: insurance_claim_usd
        type: number
        source: computed
        description: "round_half_up(damaged_tons * INDEMNITY_RATE_USD_PER_TON * INSURANCE_INDEMNITY_PCT / 100, 2); ceiling on settled_claim_usd."
      - name: settled_claim_usd
        type: number
        source: input
        description: Carrier settlement supplied at salvage settlement; credited to Fund cash.
        default: null
      - name: salvage_sold_tons
        type: number
        source: input
        description: Tons actually merchandised out of the salvage operation.
        default: null
      - name: inventory_shortfall_tons
        type: number
        source: computed
        description: "round_half_up(max(0, allocated_before - net_merch_tons_after), 2) — the amount the waterfall had to claw back."
        default: 0.00
      - name: reallocation_log
        type: array
        source: computed
        description: "Ordered waterfall records: [{ target_type: HARVEST_BLOCK|CARBON_DEDICATION, target_id, tons_cut, resulting_status }]."
        default: []
      - name: status
        type: enum
        source: computed
        description: Salvage/claim lifecycle state.
        default: REPORTED
        constraints: "REPORTED | SETTLED"

state_machines:
  # ---------------------------------------------------------------- Property
  # Property carries FOUR independent state dimensions. `status` (acquisition/
  # disposition) and `appraisal_status` (valuation) advance on disjoint triggers
  # and never gate each other's transitions; `certification_posture` is derived
  # from audit findings; `harvest_plan_status` is driven by inventory-loss
  # waterfalls. A test must be able to observe any combination.
  - entity: Property
    dimension: status
    initial_state: PROSPECT
    terminal_states: [PASSED]
    transitions:
      - from: PROSPECT
        to: UNDER_UNDERWRITING
        trigger: "POST /timberland/underwriting-cases/{id}/submit"
        actor: AcquisitionAnalyst
        preconditions: ["case.status IN {DRAFT, REVISION_REQUESTED}", "case.bid_price_usd <= case.underwritten_value_usd"]
        side_effects: ["case.status -> SUBMITTED", "increments Property.version by 1"]
      - from: UNDER_UNDERWRITING
        to: UNDER_UNDERWRITING
        trigger: "POST /timberland/underwriting-cases/{id}/decide (decision=REQUEST_REVISION)"
        actor: InvestmentCommittee
        preconditions: ["case.status == SUBMITTED", "case.revision_count < MAX_REVISION_ROUNDS"]
        side_effects: ["case.status -> REVISION_REQUESTED", "case.revision_count += 1"]
        note: "Self-loop: the property stays under underwriting while the case cycles."
      - from: UNDER_UNDERWRITING
        to: APPROVED_FOR_BID
        trigger: "POST /timberland/underwriting-cases/{id}/decide (decision=APPROVE)"
        actor: InvestmentCommittee
        preconditions: ["case.status == SUBMITTED", "X-User-ID != case.authored_by_user_id"]
        side_effects: ["case.status -> APPROVED", "every other case on the property in {DRAFT, SUBMITTED, REVISION_REQUESTED} -> WITHDRAWN", "increments Property.version by 1"]
      - from: UNDER_UNDERWRITING
        to: PASSED
        trigger: "POST /timberland/underwriting-cases/{id}/decide (decision=REJECT)"
        actor: InvestmentCommittee
        preconditions: ["case.status == SUBMITTED", "X-User-ID != case.authored_by_user_id"]
        side_effects: ["case.status -> REJECTED", "increments Property.version by 1"]
      - from: APPROVED_FOR_BID
        to: OWNED
        trigger: "POST /timberland/properties/{id}/acquire"
        actor: FundAdmin
        preconditions: ["referenced case.status == APPROVED", "case.property_id == this property", "Property.appraisal_status == SIGNED", "Fund.cash_balance_usd >= case.bid_price_usd", "expected_fund_version matches Fund.version"]
        side_effects: ["Property.acquisition_price_usd = case.bid_price_usd", "Fund.cash_balance_usd -= case.bid_price_usd", "recomputes Fund.nav_usd", "increments Fund.version by 1"]
      - from: OWNED
        to: HBU_MARKETED
        trigger: "system: an HbuParcel on one of the property's stands enters LISTED"
        actor: system
        preconditions: ["Property.status == OWNED"]
        side_effects: ["Property.status -> HBU_MARKETED"]
      - from: HBU_MARKETED
        to: OWNED
        trigger: "system: the last HbuParcel of the property leaves {LISTED, UNDER_CONTRACT} (CLOSE or WITHDRAW)"
        actor: system
        preconditions: ["no remaining HbuParcel of the property in {LISTED, UNDER_CONTRACT}"]
        side_effects: ["Property.status -> OWNED"]
        note: "Cycle: OWNED <-> HBU_MARKETED may repeat any number of times."

  - entity: Property
    dimension: appraisal_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "POST /timberland/properties/{id}/appraisal (action=SUBMIT)"
        actor: IndependentAppraiser
        preconditions: ["all inputs required by the chosen appraisal_methodology are present"]
        side_effects: ["computes Property.appraised_value_usd via appraised_value_by_methodology", "Property.appraisal_submitted_by_user_id = X-User-ID", "increments Property.version by 1"]
      - from: SUBMITTED
        to: SIGNED
        trigger: "POST /timberland/properties/{id}/appraisal (action=SIGN)"
        actor: IndependentAppraiser
        preconditions: ["X-User-ID != Property.appraisal_submitted_by_user_id", "X-User-ID is not the authored_by_user_id of any UnderwritingCase on this property"]
        side_effects: ["Property.appraisal_signed_by_user_id = X-User-ID", "Property.appraisal_signed_at = logical clock", "recomputes Fund.valuation_basis_stale_count", "increments Property.version by 1"]
      - from: SUBMITTED
        to: NONE
        trigger: "POST /timberland/properties/{id}/appraisal (action=INVALIDATE)"
        actor: IndependentAppraiser
        preconditions: []
        side_effects: ["clears appraised_value_usd, appraisal_methodology and appraisal_submitted_by_user_id"]
      - from: SIGNED
        to: STALE
        trigger: "POST /timberland/properties/{id}/appraisal (action=INVALIDATE)"
        actor: IndependentAppraiser
        preconditions: []
        side_effects: ["applies STALE_APPRAISAL_HAIRCUT_PCT to this property's contribution to Fund.nav_usd", "recomputes Fund.valuation_basis_stale_count"]
      - from: SIGNED
        to: STALE
        trigger: "system: lazily on any read of the Property, its fund, or the investor report, when logical clock >= appraisal_signed_at + 365 days"
        actor: system
        preconditions: ["appraisal_signed_at is more than 365 days before the logical clock"]
        side_effects: ["applies STALE_APPRAISAL_HAIRCUT_PCT to this property's contribution to Fund.nav_usd", "recomputes Fund.valuation_basis_stale_count"]
      - from: STALE
        to: SUBMITTED
        trigger: "POST /timberland/properties/{id}/appraisal (action=SUBMIT)"
        actor: IndependentAppraiser
        preconditions: ["all inputs required by the chosen appraisal_methodology are present"]
        side_effects: ["recomputes Property.appraised_value_usd", "Property.appraisal_submitted_by_user_id = X-User-ID"]
        note: "Cycle: SIGNED -> STALE -> SUBMITTED -> SIGNED repeats each appraisal season."

  - entity: Property
    dimension: certification_posture
    initial_state: CERTIFIED
    terminal_states: []
    transitions:
      - from: CERTIFIED
        to: CONDITIONAL
        trigger: "system: derived on audit create/advance and finding create/transition (see calculations.certification_posture_derivation)"
        actor: system
        preconditions: ["open MAJOR finding count across the property's audits == 1, or open MINOR count >= 1 with zero open MAJORs"]
        side_effects: ["Property.certification_posture -> CONDITIONAL"]
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "system: derived when the property's open MAJOR finding count reaches 2"
        actor: system
        preconditions: ["open MAJOR finding count >= 2"]
        side_effects: ["every HarvestBlock on the property's stands in COMMITTED reverts to RESERVED", "Property.harvest_plan_status is left untouched by the revert (planned_tons unchanged)"]
      - from: SUSPENDED
        to: CONDITIONAL
        trigger: "system: derived after findings are verified and closed"
        actor: system
        preconditions: ["open MAJOR finding count == 1"]
        side_effects: ["Property.certification_posture -> CONDITIONAL"]
      - from: CONDITIONAL
        to: CERTIFIED
        trigger: "system: derived when the property has zero open findings and at least one CLOSED_CONFORMING audit"
        actor: system
        preconditions: ["open MAJOR count == 0", "open MINOR count == 0"]
        side_effects: ["Property.certification_posture -> CERTIFIED"]
      - from: CERTIFIED
        to: UNCERTIFIED
        trigger: "system: derived at Property creation when certification_scheme == NONE"
        actor: system
        preconditions: ["Property.certification_scheme == NONE"]
        side_effects: ["Property.certification_posture -> UNCERTIFIED"]
        note: "UNCERTIFIED is an absorbing value for scheme NONE; such properties can host no CertificationAudit."

  - entity: Property
    dimension: harvest_plan_status
    initial_state: ALIGNED
    terminal_states: []
    transitions:
      - from: ALIGNED
        to: REPLAN_REQUIRED
        trigger: "system: any inventory-loss waterfall cuts planned_tons on a HarvestBlock of one of the property's stands (hazard_loss_reallocation or hbu_disposition_split)"
        actor: system
        preconditions: ["at least one HarvestBlock on the property had planned_tons reduced"]
        side_effects: ["increments Fund.replan_property_count"]
      - from: REPLAN_REQUIRED
        to: ALIGNED
        trigger: "POST /timberland/harvest-blocks"
        actor: ForestManager
        preconditions: ["the new block's stand belongs to this property"]
        side_effects: ["decrements Fund.replan_property_count"]
        note: "Cycle: a second waterfall re-raises REPLAN_REQUIRED."

  # ------------------------------------------------------- UnderwritingCase
  - entity: UnderwritingCase
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /timberland/underwriting-cases/{id}/submit"
        actor: AcquisitionAnalyst
        preconditions: ["Property.status IN {PROSPECT, UNDER_UNDERWRITING}", "bid_price_usd <= underwritten_value_usd"]
        side_effects: ["Property.status -> UNDER_UNDERWRITING"]
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /timberland/underwriting-cases/{id}/decide (decision=REQUEST_REVISION)"
        actor: InvestmentCommittee
        preconditions: ["revision_count < MAX_REVISION_ROUNDS", "X-User-ID != authored_by_user_id"]
        side_effects: ["revision_count += 1", "decided_by_user_id = X-User-ID"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /timberland/underwriting-cases/{id}/submit"
        actor: AcquisitionAnalyst
        preconditions: ["bid_price_usd <= underwritten_value_usd"]
        side_effects: ["clears decision_note"]
        note: "Cycle: at most MAX_REVISION_ROUNDS (2) revision rounds; a third REQUEST_REVISION is rejected with ERR_REVISION_LIMIT_REACHED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /timberland/underwriting-cases/{id}/decide (decision=APPROVE)"
        actor: InvestmentCommittee
        preconditions: ["X-User-ID != authored_by_user_id"]
        side_effects: ["Property.status -> APPROVED_FOR_BID", "sibling cases on the property in {DRAFT, SUBMITTED, REVISION_REQUESTED} -> WITHDRAWN"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /timberland/underwriting-cases/{id}/decide (decision=REJECT)"
        actor: InvestmentCommittee
        preconditions: ["X-User-ID != authored_by_user_id"]
        side_effects: ["Property.status -> PASSED"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: a sibling case on the same property is APPROVED"
        actor: system
        preconditions: []
        side_effects: ["decision_note = 'superseded by approved case'"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: a sibling case on the same property is APPROVED"
        actor: system
        preconditions: []
        side_effects: ["decision_note = 'superseded by approved case'"]
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "system: a sibling case on the same property is APPROVED"
        actor: system
        preconditions: []
        side_effects: ["decision_note = 'superseded by approved case'"]

  # ------------------------------------------------------------------ Stand
  - entity: Stand
    initial_state: CRUISE_OPEN
    terminal_states: [DISPOSED]
    transitions:
      - from: CRUISE_OPEN
        to: INVENTORIED
        trigger: "POST /timberland/stands/{id}/cruise-close"
        actor: ForestManager
        preconditions: ["plot_count >= 1"]
        side_effects: ["runs stand_cruise_volume: sets mean_net_tons_per_acre, cruise_confidence, gross_merch_tons, net_merch_tons, available_tons", "increments Stand.version by 1"]
      - from: INVENTORIED
        to: SALVAGE_PENDING
        trigger: "POST /timberland/hazard-events"
        actor: ForestManager
        preconditions: ["Stand.status == INVENTORIED", "damaged_tons <= net_merch_tons"]
        side_effects: ["runs hazard_loss_reallocation (reduces net_merch_tons, cuts blocks/dedications)", "increments Stand.version by 1"]
      - from: SALVAGE_PENDING
        to: INVENTORIED
        trigger: "POST /timberland/hazard-events/{id}/salvage-settle"
        actor: FundAdmin
        preconditions: ["hazard.status == REPORTED", "settled_claim_usd <= hazard.insurance_claim_usd", "salvage_sold_tons <= hazard.salvageable_tons"]
        side_effects: ["Fund.cash_balance_usd += settled_claim_usd", "hazard.status -> SETTLED"]
        note: "Cycle: a stand may be damaged and settled repeatedly."
      - from: INVENTORIED
        to: DISPOSED
        trigger: "system: HbuParcel CLOSE mints the derived stand carrying the withdrawn acres and tons, then disposes it in the same side-effect chain"
        actor: system
        preconditions: ["parent stand had enough acres to satisfy MIN_RETAINED_ACRES"]
        side_effects: ["derived stand's split_from_stand_id = parent stand id", "derived stand's net_merch_tons = HbuParcel.withdrawn_tons", "HbuParcel.derived_stand_id set"]
        note: "System-minted derived stands are created directly in INVENTORIED (they inherit a completed cruise) and then transitioned to DISPOSED. No public endpoint reaches DISPOSED."

  # ----------------------------------------------------------- HarvestBlock
  - entity: HarvestBlock
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, VOIDED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /timberland/harvest-blocks/{id}/commit"
        actor: ForestManager
        preconditions: ["Property.certification_posture != SUSPENDED", "the block window does not intersect any ACTIVE lease blackout on the property", "Stand.status == INVENTORIED"]
        side_effects: ["moves planned_tons from Stand.reserved_tons to Stand.committed_tons (available_tons unchanged)", "increments Stand.version by 1"]
      - from: COMMITTED
        to: RESERVED
        trigger: "system: Property.certification_posture becomes SUSPENDED"
        actor: system
        preconditions: []
        side_effects: ["moves planned_tons back from Stand.committed_tons to Stand.reserved_tons"]
        note: "Cycle: RESERVED <-> COMMITTED repeats across suspension/reinstatement rounds."
      - from: COMMITTED
        to: COMPLETED
        trigger: "POST /timberland/harvest-blocks/{id}/close (action=COMPLETE)"
        actor: ForestManager
        preconditions: ["actual_tons <= planned_tons", "Property.certification_posture != SUSPENDED"]
        side_effects: ["computes final_net_revenue_usd via harvest_block_net_revenue (final variant)", "Stand.net_merch_tons -= actual_tons", "planned_tons leaves Stand.committed_tons", "Fund.cash_balance_usd += final_net_revenue_usd", "Fund.net_operating_cash_usd += final_net_revenue_usd", "recomputes Fund.cash_yield_bps and harvest_acceleration_required"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /timberland/harvest-blocks/{id}/close (action=CANCEL)"
        actor: ForestManager
        preconditions: ["Fund.harvest_acceleration_required == false"]
        side_effects: ["planned_tons leaves Stand.reserved_tons and returns to Stand.available_tons", "increments Stand.version by 1"]
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /timberland/harvest-blocks/{id}/close (action=CANCEL)"
        actor: ForestManager
        preconditions: ["Fund.harvest_acceleration_required == false"]
        side_effects: ["planned_tons leaves Stand.committed_tons and returns to Stand.available_tons"]
      - from: RESERVED
        to: VOIDED
        trigger: "system: an inventory-loss waterfall cuts planned_tons to 0.00"
        actor: system
        preconditions: ["waterfall reduction consumed the whole block"]
        side_effects: ["voided_reason set to HAZARD_LOSS or HBU_WITHDRAWAL", "Property.harvest_plan_status -> REPLAN_REQUIRED"]
      - from: COMMITTED
        to: VOIDED
        trigger: "system: an inventory-loss waterfall cuts planned_tons to 0.00"
        actor: system
        preconditions: ["waterfall reduction consumed the whole block"]
        side_effects: ["voided_reason set", "Property.harvest_plan_status -> REPLAN_REQUIRED"]

  # ----------------------------------------------------------- CarbonProject
  - entity: CarbonProject
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: VALIDATION
        trigger: "POST /timberland/carbon-projects/{id}/advance (action=SUBMIT_VALIDATION)"
        actor: CarbonDeveloper
        preconditions: ["at least one CarbonDedication in PENDING"]
        side_effects: ["freezes dedicated_tons_total"]
      - from: VALIDATION
        to: REGISTERED
        trigger: "POST /timberland/carbon-projects/{id}/advance (action=REGISTER)"
        actor: CarbonDeveloper
        preconditions: ["Property.certification_posture != SUSPENDED", "dedicated_tons_total > 0"]
        side_effects: ["all PENDING dedications -> ACTIVE with permanence_end_date = clock date + permanence_term_years years", "buffer_pool_tons = dedicated_tons_total * CARBON_BUFFER_POOL_PCT / 100"]
      - from: REGISTERED
        to: REVERSAL_PENDING
        trigger: "system: hazard_loss_reallocation cuts an ACTIVE dedication of this project"
        actor: system
        preconditions: ["buffer_deficit_tons > 0 after the waterfall"]
        side_effects: ["buffer_deficit_tons accumulates the reversal obligation"]
      - from: REVERSAL_PENDING
        to: REGISTERED
        trigger: "POST /timberland/carbon-projects/{id}/advance (action=CURE_BUFFER)"
        actor: CarbonDeveloper
        preconditions: ["cure_tons >= buffer_deficit_tons"]
        side_effects: ["buffer_pool_tons += cure_tons", "buffer_deficit_tons -> 0.00", "Fund.cash_balance_usd -= cure_tons * BUFFER_CURE_COST_USD_PER_TON"]
        note: "Cycle: REGISTERED <-> REVERSAL_PENDING repeats per reversal event."
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /timberland/carbon-projects/{id}/advance (action=TERMINATE)"
        actor: CarbonDeveloper
        preconditions: []
        side_effects: ["all dedications in {PENDING, ACTIVE, REDUCED} -> RELEASED", "tons return to Stand.available_tons"]
      - from: VALIDATION
        to: TERMINATED
        trigger: "POST /timberland/carbon-projects/{id}/advance (action=TERMINATE)"
        actor: CarbonDeveloper
        preconditions: []
        side_effects: ["all dedications in {PENDING, ACTIVE, REDUCED} -> RELEASED", "tons return to Stand.available_tons"]
      - from: REVERSAL_PENDING
        to: TERMINATED
        trigger: "POST /timberland/carbon-projects/{id}/advance (action=TERMINATE)"
        actor: CarbonDeveloper
        preconditions: []
        side_effects: ["all dedications in {PENDING, ACTIVE, REDUCED} -> RELEASED", "buffer_deficit_tons is written off"]
      - from: REGISTERED
        to: TERMINATED
        trigger: "POST /timberland/carbon-projects/{id}/advance (action=TERMINATE)"
        actor: CarbonDeveloper
        preconditions: ["no ACTIVE dedication whose permanence_end_date is still in the future"]
        side_effects: ["all dedications in {PENDING, ACTIVE, REDUCED} -> RELEASED"]

  # -------------------------------------------------------- CarbonDedication
  - entity: CarbonDedication
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system: parent CarbonProject enters REGISTERED"
        actor: system
        preconditions: []
        side_effects: ["permanence_end_date set"]
      - from: ACTIVE
        to: REDUCED
        trigger: "system: hazard_loss_reallocation claws tons back from this dedication"
        actor: system
        preconditions: ["reduced_tons > 0 and reduced_tons < dedicated_tons"]
        side_effects: ["CarbonProject.buffer_deficit_tons += reduced_tons * CARBON_BUFFER_POOL_PCT / 100", "CarbonProject.status -> REVERSAL_PENDING"]
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /timberland/carbon-dedications/{id}/release"
        actor: CarbonDeveloper
        preconditions: ["logical clock date >= permanence_end_date"]
        side_effects: ["tons return to Stand.available_tons", "increments Stand.version by 1"]
      - from: REDUCED
        to: RELEASED
        trigger: "POST /timberland/carbon-dedications/{id}/release"
        actor: CarbonDeveloper
        preconditions: ["logical clock date >= permanence_end_date"]
        side_effects: ["remaining tons return to Stand.available_tons"]
      - from: PENDING
        to: RELEASED
        trigger: "POST /timberland/carbon-dedications/{id}/release"
        actor: CarbonDeveloper
        preconditions: ["parent CarbonProject.status IN {DRAFT, VALIDATION}"]
        side_effects: ["tons return to Stand.available_tons", "increments Stand.version by 1"]
        note: "A PENDING dedication is not yet permanence-locked, so it releases freely; an ACTIVE one is locked until permanence_end_date (ERR_CARBON_PERMANENCE_LOCK)."

  # -------------------------------------------------------------- HbuParcel
  - entity: HbuParcel
    initial_state: IDENTIFIED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: IDENTIFIED
        to: LISTED
        trigger: "POST /timberland/hbu-parcels/{id}/advance (action=LIST)"
        actor: FundAdmin
        preconditions: ["Property.status == OWNED or HBU_MARKETED", "Property.appraisal_status == SIGNED"]
        side_effects: ["Property.status -> HBU_MARKETED"]
      - from: LISTED
        to: UNDER_CONTRACT
        trigger: "POST /timberland/hbu-parcels/{id}/advance (action=CONTRACT)"
        actor: FundAdmin
        preconditions: ["contract_price_usd is present and > 0"]
        side_effects: ["records contract_price_usd and commission_usd"]
      - from: UNDER_CONTRACT
        to: LISTED
        trigger: "POST /timberland/hbu-parcels/{id}/advance (action=RELIST)"
        actor: FundAdmin
        preconditions: []
        side_effects: ["clears contract_price_usd and commission_usd"]
        note: "Cycle: LISTED <-> UNDER_CONTRACT repeats on buyer fallout."
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "POST /timberland/hbu-parcels/{id}/advance (action=CLOSE)"
        actor: FundAdmin
        preconditions: ["closing_costs_usd is present", "Stand.acres - HbuParcel.acres >= MIN_RETAINED_ACRES", "Stand.status == INVENTORIED"]
        side_effects: ["runs hbu_disposition_split: withdrawn_tons, parent Stand.acres reduced, derived DISPOSED stand minted", "net_proceeds_usd credited to Fund.cash_balance_usd and Fund.net_operating_cash_usd", "waterfall may cut HarvestBlocks -> Property.harvest_plan_status REPLAN_REQUIRED", "Property.status -> OWNED when no listed/contracted parcel remains"]
      - from: IDENTIFIED
        to: WITHDRAWN
        trigger: "POST /timberland/hbu-parcels/{id}/advance (action=WITHDRAW)"
        actor: FundAdmin
        preconditions: []
        side_effects: []
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /timberland/hbu-parcels/{id}/advance (action=WITHDRAW)"
        actor: FundAdmin
        preconditions: []
        side_effects: ["Property.status -> OWNED when no listed/contracted parcel remains"]
      - from: UNDER_CONTRACT
        to: WITHDRAWN
        trigger: "POST /timberland/hbu-parcels/{id}/advance (action=WITHDRAW)"
        actor: FundAdmin
        preconditions: []
        side_effects: ["Property.status -> OWNED when no listed/contracted parcel remains"]

  # ------------------------------------------------------- RecreationalLease
  - entity: RecreationalLease
    initial_state: PENDING
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /timberland/recreational-leases/{id}/activate"
        actor: FundAdmin
        preconditions: ["Property.status IN {OWNED, HBU_MARKETED}", "aggregate leased acres over any overlapping ACTIVE/PENDING term <= total_acres * MAX_LEASE_COVERAGE_PCT / 100"]
        side_effects: ["computes first_year_prorated_rent_usd via lease_rent_and_coverage", "Fund.cash_balance_usd += first_year_prorated_rent_usd", "Fund.net_operating_cash_usd += first_year_prorated_rent_usd"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /timberland/recreational-leases/{id}/terminate"
        actor: FundAdmin
        preconditions: ["termination_effective_date >= term_start_date", "termination_effective_date < term_end_date"]
        side_effects: ["refunded_rent_usd = first_year_prorated_rent_usd - earned rent to the effective date", "Fund.cash_balance_usd -= refunded_rent_usd", "Fund.net_operating_cash_usd -= refunded_rent_usd", "leased acres released from the coverage cap"]
      - from: PENDING
        to: TERMINATED
        trigger: "POST /timberland/recreational-leases/{id}/terminate"
        actor: FundAdmin
        preconditions: []
        side_effects: ["refunded_rent_usd stays 0.00 (no rent was ever charged)"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazily on any read of the lease or of the property's lease list, when logical clock date >= term_end_date"
        actor: system
        preconditions: ["logical clock date >= term_end_date"]
        side_effects: ["leased acres released from the coverage cap"]

  # ----------------------------------------------------- CertificationAudit
  - entity: CertificationAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED_CONFORMING]
    transitions:
      - from: SCHEDULED
        to: FIELD_WORK
        trigger: "POST /timberland/certification-audits/{id}/advance (action=START_FIELD_WORK)"
        actor: CertificationAuditor
        preconditions: ["Property.certification_scheme != NONE"]
        side_effects: []
      - from: FIELD_WORK
        to: FINDINGS_ISSUED
        trigger: "POST /timberland/certification-audits/{id}/advance (action=ISSUE_FINDINGS)"
        actor: CertificationAuditor
        preconditions: []
        side_effects: ["recomputes Property.certification_posture from the audit's finding counts"]
      - from: FINDINGS_ISSUED
        to: CAR_REVIEW
        trigger: "system: every open finding of the audit has reached CAR_SUBMITTED"
        actor: system
        preconditions: ["open_major_count + open_minor_count >= 1", "no finding of this audit remains in OPEN"]
        side_effects: []
      - from: CAR_REVIEW
        to: FINDINGS_ISSUED
        trigger: "POST /timberland/audit-findings/{id}/transition (action=REJECT_CAR)"
        actor: CertificationAuditor
        preconditions: ["finding.status == CAR_SUBMITTED"]
        side_effects: ["finding.status -> OPEN", "finding.rejection_count += 1"]
        note: "Cycle: FINDINGS_ISSUED <-> CAR_REVIEW repeats once per rejected corrective action."
      - from: FINDINGS_ISSUED
        to: SUSPENDED
        trigger: "POST /timberland/certification-audits/{id}/advance (action=SUSPEND)"
        actor: CertificationAuditor
        preconditions: ["open_major_count >= 2"]
        side_effects: ["Property.certification_posture -> SUSPENDED", "COMMITTED HarvestBlocks on the property revert to RESERVED"]
      - from: SUSPENDED
        to: FINDINGS_ISSUED
        trigger: "POST /timberland/certification-audits/{id}/advance (action=REINSTATE)"
        actor: CertificationAuditor
        preconditions: ["open_major_count <= 1"]
        side_effects: ["recomputes Property.certification_posture"]
      - from: FINDINGS_ISSUED
        to: CLOSED_CONFORMING
        trigger: "POST /timberland/certification-audits/{id}/advance (action=CLOSE)"
        actor: CertificationAuditor
        preconditions: ["open_major_count == 0", "open_minor_count == 0"]
        side_effects: ["recomputes Property.certification_posture"]
      - from: CAR_REVIEW
        to: CLOSED_CONFORMING
        trigger: "POST /timberland/certification-audits/{id}/advance (action=CLOSE)"
        actor: CertificationAuditor
        preconditions: ["open_major_count == 0", "open_minor_count == 0"]
        side_effects: ["recomputes Property.certification_posture"]

  # ------------------------------------------------------------ AuditFinding
  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CAR_SUBMITTED
        trigger: "POST /timberland/audit-findings/{id}/transition (action=SUBMIT_CAR)"
        actor: ForestManager
        preconditions: ["car_text is present", "parent audit.status IN {FINDINGS_ISSUED, SUSPENDED}"]
        side_effects: ["car_submitted_by_user_id = X-User-ID", "parent audit may advance FINDINGS_ISSUED -> CAR_REVIEW"]
      - from: CAR_SUBMITTED
        to: OPEN
        trigger: "POST /timberland/audit-findings/{id}/transition (action=REJECT_CAR)"
        actor: CertificationAuditor
        preconditions: []
        side_effects: ["rejection_count += 1", "parent audit CAR_REVIEW -> FINDINGS_ISSUED"]
        note: "Cycle: OPEN <-> CAR_SUBMITTED repeats without limit."
      - from: CAR_SUBMITTED
        to: CLOSED
        trigger: "POST /timberland/audit-findings/{id}/transition (action=VERIFY_CLOSE)"
        actor: CertificationAuditor
        preconditions: ["X-User-ID != car_submitted_by_user_id"]
        side_effects: ["closed_by_user_id = X-User-ID", "recomputes audit open counts and Property.certification_posture"]

  # ------------------------------------------------------------- HazardEvent
  - entity: HazardEvent
    initial_state: REPORTED
    terminal_states: [SETTLED]
    transitions:
      - from: REPORTED
        to: SETTLED
        trigger: "POST /timberland/hazard-events/{id}/salvage-settle"
        actor: FundAdmin
        preconditions: ["settled_claim_usd <= insurance_claim_usd", "salvage_sold_tons <= salvageable_tons"]
        side_effects: ["Fund.cash_balance_usd += settled_claim_usd", "Fund.net_operating_cash_usd += settled_claim_usd", "Stand.status SALVAGE_PENDING -> INVENTORIED"]

concurrency_rules:
  - rule_id: harvest-block-create-stale-stand
    parent_entity: Stand
    write_endpoint: "POST /timberland/harvest-blocks"
    occ_field: "expected_stand_version"
    description: |
      Creating a HarvestBlock against a Stand whose version has advanced since
      the client last read it is rejected. A block reservation is legitimate on
      its own terms — a second writer holding an older view of the stand would
      pass every state precondition and quietly over-allocate the same tons
      already spoken for by an intervening reservation, dedication, hazard loss
      or HBU withdrawal. The stale version is what the system detects.
    error_id: ERR_STALE_STAND_VERSION
    http_status: 412

  - rule_id: carbon-dedication-create-stale-stand
    parent_entity: Stand
    write_endpoint: "POST /timberland/carbon-dedications"
    occ_field: "expected_stand_version"
    description: |
      Dedicating stand inventory to a carbon project on the basis of a stale
      Stand version is rejected. Carbon dedications and harvest reservations
      draw on the same allocatable pool, so a writer whose view predates an
      intervening allocation would legitimately succeed against its own stale
      available_tons and break the inventory identity.
    error_id: ERR_STALE_STAND_VERSION
    http_status: 412

  - rule_id: underwriting-case-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /timberland/underwriting-cases"
    occ_field: "expected_property_version"
    description: |
      Creating an UnderwritingCase against a Property whose version has moved
      since the client last read it is rejected. A new case legitimately
      supersedes prior cases on approval, so nothing in the case's own state
      preconditions would stop a writer whose cruise, appraisal, risk-review or
      market-access view of the property is out of date from underwriting a
      value that no longer holds.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

  - rule_id: property-acquire-stale-fund
    parent_entity: Fund
    write_endpoint: "POST /timberland/properties/{id}/acquire"
    occ_field: "expected_fund_version"
    description: |
      Acquiring a property against a stale Fund version is rejected. Every
      approved case is individually fundable, so a writer whose view of
      cash_balance_usd predates another acquisition, premium debit, refund or
      buffer cure would commit capital the fund no longer has under a check
      that its own stale numbers satisfy.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

calculations:
  # ------------------------------------------------------------------- C1
  - name: stand_cruise_volume
    trigger: "POST /timberland/stands/{id}/cruise-close"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED. Per-plot rounding happens BEFORE the mean, and
      # the mean is rounded to 3 decimals BEFORE multiplication by acres. Any
      # other order (e.g. mean of raw values, or expanding each plot to tons and
      # then averaging) yields a different, WRONG gross_merch_tons.
      for each CruisePlot p of the stand:
          p.net_tons_per_acre = round_half_up(p.tons_per_acre * (1 - p.defect_pct / 100), 3)
      mean_net_tons_per_acre = round_half_up(sum(p.net_tons_per_acre) / plot_count, 3)
      gross_merch_tons       = round_half_up(mean_net_tons_per_acre * Stand.acres, 2)
      cruise_confidence      = NORMAL if plot_count >= MIN_PLOTS_FOR_NORMAL_CONFIDENCE else LOW
      if cruise_confidence == NORMAL:
          net_merch_tons = gross_merch_tons
      else:
          net_merch_tons = round_half_up(gross_merch_tons * (1 - LOW_CONFIDENCE_HAIRCUT_PCT / 100), 2)
      available_tons = net_merch_tons        # all five allocation buckets are 0.00 at close
    input_set: "Every CruisePlot row whose stand_id is this stand, regardless of measured_at. Plots cannot be added after the cruise is closed (ERR_CRUISE_ALREADY_CLOSED), so the set is frozen at close."
    constants:
      MIN_PLOTS_FOR_NORMAL_CONFIDENCE: 5
      LOW_CONFIDENCE_HAIRCUT_PCT: 8
    precision: "per-plot net tons per acre and the mean at 3 decimals; tonnage at 2 decimals; round_half_up throughout"

  # ------------------------------------------------------------------- C2
  - name: growth_projection_volume
    trigger: "POST /timberland/harvest-blocks (projected_available_tons) and inside underwritten_value for each of the three harvest periods"
    algorithm: projection
    formula: |
      # variant-dependent; `years` is a whole number of years from the logical clock
      YIELD_TABLE : projected = round_half_up(base_tons * (1 + PERIODIC_GROWTH_PCT[species] / 100) ** years, 2)
      MAI_LINEAR  : projected = round_half_up(base_tons + MAI_TONS_PER_ACRE_YEAR[species] * Stand.acres * years, 2)
      # single rounding at the end; NO per-year re-rounding
      years_to_start = floor((planned_start_date - logical clock date) in whole days / 365)
    input_set: "base_tons is the stand's current net_merch_tons; species is Stand.species_code; the variant comes from the caller (UnderwritingCase.growth_variant or HarvestBlock.growth_variant)."
    constants:
      PERIODIC_GROWTH_PCT: { LOBLOLLY_PINE: 4.2, DOUGLAS_FIR: 3.1, NORTHERN_HARDWOOD: 2.4 }
      MAI_TONS_PER_ACRE_YEAR: { LOBLOLLY_PINE: 2.1, DOUGLAS_FIR: 1.6, NORTHERN_HARDWOOD: 0.9 }
      DAYS_PER_YEAR: 365
    precision: "2 decimals, round_half_up"
    variants:
      - name: YIELD_TABLE
        when: "growth_variant == YIELD_TABLE — compound percentage growth off the cruised volume"
        difference: "Geometric: base * (1 + pct/100)^years. Grows faster than MAI on well-stocked stands and slower on lightly stocked ones."
      - name: MAI_LINEAR
        when: "growth_variant == MAI_LINEAR — mean-annual-increment growth per acre"
        difference: "Arithmetic: base + MAI * acres * years. Independent of the standing volume, so identical inputs produce a different projection from YIELD_TABLE (e.g. 4647.12 tons on 120.00 LOBLOLLY_PINE acres at year 3 gives 5257.59 vs 5403.12)."

  # ------------------------------------------------------------------- C3
  - name: underwritten_value
    trigger: "POST /timberland/underwriting-cases, and recomputed on POST /timberland/underwriting-cases/{id}/submit"
    algorithm: tiered_pricing
    formula: |
      base_tons = sum of net_merch_tons over the property's stands with status == INVENTORIED
      acres     = sum of acres over those same stands
      disc      = Property.market_access_discount_pct        # from haul_distance_miles
      timber_pv = 0
      for k in 1..HARVEST_PERIODS:                            # 3 periods, one per year
          vol_k   = growth_projection_volume(base_tons, acres, species, k, case.growth_variant)
          tons_k  = round_half_up(vol_k * PERIOD_HARVEST_PCT / 100, 2)
          rev_k   = round_half_up(tons_k * case.stumpage_price_usd_per_ton * (1 - disc / 100), 2)
          df_k    = (1 + case.discount_rate_bps / 10000) ** (k - MIDPERIOD_OFFSET)
          pv_k    = round_half_up(rev_k / df_k, 2)
          timber_pv += pv_k
      timber_pv_usd     = round_half_up(timber_pv, 2)
      hbu_premium_usd   = round_half_up(Property.hbu_acres * Property.hbu_price_per_acre_usd, 2)
      rec_income_pv_usd = round_half_up(Property.annual_rec_income_usd * REC_INCOME_MULTIPLE, 2)
      pre_fee_value_usd = round_half_up(timber_pv_usd + hbu_premium_usd + rec_income_pv_usd, 2)

      # TIER KEY: the acquisition fee tier is selected by pre_fee_value_usd.
      # Keying it on the post-fee underwritten_value_usd is the natural mistake and
      # is WRONG: subtracting the fee can drop the value back below the breakpoint.
      acquisition_fee_pct   = 1.50 if pre_fee_value_usd <  ACQ_FEE_BREAK_1
                              else 1.00 if pre_fee_value_usd < ACQ_FEE_BREAK_2
                              else 0.75
      acquisition_fee_usd   = round_half_up(pre_fee_value_usd * acquisition_fee_pct / 100, 2)
      underwritten_value_usd = round_half_up(pre_fee_value_usd - acquisition_fee_usd, 2)
    input_set: "Only stands of the property in status INVENTORIED contribute base_tons and acres. CRUISE_OPEN stands (no cruise yet), SALVAGE_PENDING stands (loss not yet settled) and DISPOSED stands (sold as HBU) are all excluded."
    constants:
      HARVEST_PERIODS: 3
      PERIOD_HARVEST_PCT: 25
      MIDPERIOD_OFFSET: 0.5
      REC_INCOME_MULTIPLE: 6.5
      ACQ_FEE_BREAK_1: 1500000.00
      ACQ_FEE_BREAK_2: 3250000.00
      MARKET_ACCESS_DISCOUNT_PCT: { TIER_A: 0.0, TIER_B: 4.5, TIER_C: 9.0, TIER_D: 15.0 }
      MARKET_ACCESS_MILE_BREAKS: { TIER_A: "<= 40", TIER_B: "41..80", TIER_C: "81..140", TIER_D: ">= 141" }
    precision: "2 decimals, round_half_up at every named step; the discount factor itself is not rounded"
    variants:
      - name: YIELD_TABLE
        when: "case.growth_variant == YIELD_TABLE"
        difference: "Feeds compound growth into every period, producing a lower period-3 volume than MAI on the canonical stands."
      - name: MAI_LINEAR
        when: "case.growth_variant == MAI_LINEAR"
        difference: "Feeds increment growth into every period. On a 1860.00-acre LOBLOLLY_PINE stand at 72030.36 tons, 800 bps, 60.50/ton, TIER_B, hbu 40.00 acres @ 3000.00, rec 18000.00/yr the two variants give underwritten_value_usd 3233360.64 (YIELD_TABLE) vs 3293063.46 (MAI_LINEAR)."

  # ------------------------------------------------------------------- C4
  - name: harvest_block_net_revenue
    trigger: "POST /timberland/harvest-blocks (provisional) and POST /timberland/harvest-blocks/{id}/close with action=COMPLETE (final)"
    algorithm: threshold
    formula: |
      effective_price = round_half_up(stumpage * index * PRODUCT_MIX_FACTOR[product_mix], 4)
      gross_usd       = round_half_up(tons * effective_price, 2)
      logging_usd     = round_half_up(tons * LOGGING_COST_USD_PER_TON, 2)
      # nested cap: miles beyond MAX_BILLABLE_HAUL_MILES are absorbed by the contractor
      billable_miles  = min(expected_haul_distance_miles, MAX_BILLABLE_HAUL_MILES)
      haul_usd        = round_half_up(tons * HAUL_RATE_USD_PER_TON_MILE * billable_miles, 2)
      # nested floor: severance tax has a per-block minimum
      severance_usd   = max(round_half_up(gross_usd * SEVERANCE_TAX_PCT / 100, 2), MIN_SEVERANCE_TAX_USD)
      net_revenue_usd = round_half_up(gross_usd - logging_usd - haul_usd - severance_usd, 2)
    input_set: "A single HarvestBlock. Which tons/index pair is fed in depends on the variant."
    constants:
      LOGGING_COST_USD_PER_TON: 12.75
      HAUL_RATE_USD_PER_TON_MILE: 0.145
      MAX_BILLABLE_HAUL_MILES: 90
      SEVERANCE_TAX_PCT: 2.5
      MIN_SEVERANCE_TAX_USD: 250.00
      PRODUCT_MIX_FACTOR: { SAWTIMBER: 1.00, MIXED: 0.82, PULPWOOD: 0.61 }
    precision: "effective_price at 4 decimals; all USD at 2 decimals, round_half_up"
    variants:
      - name: provisional
        when: "at block creation — tons = planned_tons, index = price_index_factor"
        difference: "Written to provisional_net_revenue_usd. Never touches Fund cash."
      - name: final
        when: "at COMPLETE — tons = actual_tons, index = realized_price_index_factor"
        difference: "Written to final_net_revenue_usd and credited to Fund.cash_balance_usd and Fund.net_operating_cash_usd. Identical block, 1000.00 planned tons at index 1.05 gives 22889.55 provisional; 940.50 actual tons at index 0.92 gives 15858.07 final."

  # ------------------------------------------------------------------- C5
  - name: insurance_premium_and_risk_score
    trigger: "POST /timberland/properties/{id}/risk-review"
    algorithm: weighted_scoring
    formula: |
      wildfire_adj = min(100.00, round_half_up(wildfire_hazard_index * REGION_WILDFIRE_MULT[region_code], 2))
      insect_mult  = SPECIES_INSECT_MULT[dominant species of the property's stands] (1.00 when the property has no stand)
      insect_adj   = min(100.00, round_half_up(insect_hazard_index * insect_mult, 2))
      composite_risk_score = round_half_up(  WEIGHT_WILDFIRE * wildfire_adj
                                           + WEIGHT_INSECT   * insect_adj
                                           + WEIGHT_WEATHER  * weather_hazard_index, 2)
      base_premium = round_half_up(insured_value_usd * BASE_RATE_BPS / 10000, 2)
      ACTUARIAL        : premium = max(round_half_up(base_premium * (1 + composite_risk_score / 100), 2), MIN_PREMIUM_USD)
      EXPERIENCE_RATED : loss_ratio = round_half_up(trailing_settled_claims_usd / insured_value_usd, 4)
                         premium    = max(round_half_up(base_premium * (1 + loss_ratio), 2), MIN_PREMIUM_USD)
    input_set: "dominant species = the species_code of the property's stand with the largest acres, ties broken by the earlier created_at. trailing_settled_claims_usd = sum of HazardEvent.settled_claim_usd over hazard events on the property's stands with status == SETTLED and occurred_at within TRAILING_CLAIM_WINDOW_DAYS before the logical clock; REPORTED (unsettled) events contribute 0.00."
    constants:
      WEIGHT_WILDFIRE: 0.45
      WEIGHT_INSECT: 0.30
      WEIGHT_WEATHER: 0.25
      REGION_WILDFIRE_MULT: { SOUTH: 1.00, WEST: 1.25, NORTHEAST: 0.80 }
      SPECIES_INSECT_MULT: { LOBLOLLY_PINE: 1.15, DOUGLAS_FIR: 1.00, NORTHERN_HARDWOOD: 1.00 }
      HAZARD_INDEX_CAP: 100.00
      BASE_RATE_BPS: 38
      MIN_PREMIUM_USD: 1500.00
      TRAILING_CLAIM_WINDOW_DAYS: 1095
    precision: "indices and score at 2 decimals; loss_ratio at 4 decimals; USD at 2 decimals; round_half_up"
    variants:
      - name: ACTUARIAL
        when: "insurance_rating_basis == ACTUARIAL — no credible claim history"
        difference: "Loads the base premium by the composite hazard score. Wildfire 72.00 / insect 64.00 / weather 48.00 on a SOUTH LOBLOLLY_PINE property insured for 4200000.00 gives composite 66.48 and premium 26570.21."
      - name: EXPERIENCE_RATED
        when: "insurance_rating_basis == EXPERIENCE_RATED — credible settled-claim history exists"
        difference: "Ignores the composite score entirely and loads by realised loss ratio. The same property with 310500.00 of trailing settled claims gives loss_ratio 0.0739 and premium 17139.44 — composite_risk_score is still stored (66.48) but does not price the policy."

  # ------------------------------------------------------------------- C6
  - name: hazard_loss_reallocation
    trigger: "POST /timberland/hazard-events"
    algorithm: waterfall_allocation
    formula: |
      salvageable_tons    = round_half_up(damaged_tons * SALVAGE_RECOVERY_PCT[event_type] / 100, 2)
      insurance_claim_usd = round_half_up(damaged_tons * INDEMNITY_RATE_USD_PER_TON * INSURANCE_INDEMNITY_PCT / 100, 2)
      Stand.net_merch_tons = round_half_up(Stand.net_merch_tons - damaged_tons, 2)
      allocated = round_half_up(reserved_tons + committed_tons + dedicated_tons + hbu_withdrawn_tons, 2)
      inventory_shortfall_tons = round_half_up(max(0, allocated - Stand.net_merch_tons), 2)

      # ORDERED buckets — the cheapest-to-break claim is cut first. hbu_withdrawn_tons
      # is NEVER clawed back (the land is sold). If the shortfall survives all three
      # buckets the remainder is written off against hbu_withdrawn_tons implicitly.
      remaining = inventory_shortfall_tons
      bucket 1: HarvestBlocks with status == RESERVED,  ordered by created_at ascending
      bucket 2: HarvestBlocks with status == COMMITTED, ordered by created_at ascending
      bucket 3: CarbonDedications with status == ACTIVE then status == PENDING, each ordered by created_at ascending
      for target in bucket 1, then bucket 2, then bucket 3:
          if remaining == 0: break
          cut = min(remaining, target remaining tons)
          if target is a HarvestBlock:
              target.planned_tons = round_half_up(target.planned_tons - cut, 2)
              target.status = VOIDED with voided_reason = HAZARD_LOSS if target.planned_tons == 0.00
              Property.harvest_plan_status = REPLAN_REQUIRED          # any cut, void or not
          else:
              target.reduced_tons += cut ; target.status = REDUCED
              project.buffer_deficit_tons += round_half_up(cut * CARBON_BUFFER_POOL_PCT / 100, 2)
              project.status = REVERSAL_PENDING
          append { target_type, target_id, tons_cut: cut, resulting_status } to reallocation_log
          remaining = round_half_up(remaining - cut, 2)
      Stand.status = SALVAGE_PENDING
    input_set: "Only HarvestBlocks in RESERVED/COMMITTED and CarbonDedications in ACTIVE/PENDING on the damaged stand participate. COMPLETED, CANCELLED and VOIDED blocks and RELEASED dedications are already off the pool and are skipped."
    constants:
      SALVAGE_RECOVERY_PCT: { WILDFIRE: 35, INSECT: 55, WIND_STORM: 70, ICE_STORM: 60 }
      INDEMNITY_RATE_USD_PER_TON: 22.50
      INSURANCE_INDEMNITY_PCT: 60
      CARBON_BUFFER_POOL_PCT: 18
      BUFFER_CURE_COST_USD_PER_TON: 14.00
    precision: "2 decimals, round_half_up"

  # ------------------------------------------------------------------- C7
  - name: fund_nav_and_cash_yield
    trigger: "GET /timberland/funds/{id}, GET /timberland/funds/{id}/investor-report, and after every cash movement"
    algorithm: aggregation
    formula: |
      for each Property of the fund with status IN {OWNED, HBU_MARKETED}:
          if appraisal_status == SIGNED    : carry = appraised_value_usd
          elif appraisal_status == STALE   : carry = round_half_up(appraised_value_usd * (1 - STALE_APPRAISAL_HAIRCUT_PCT / 100), 2)
          else                             : carry = acquisition_price_usd        # NONE / SUBMITTED fall back to cost basis
      nav_usd = round_half_up(cash_balance_usd + sum(carry), 2)
      cash_yield_bps = round_half_up(net_operating_cash_usd / committed_capital_usd * 10000, 0)
      harvest_acceleration_required = (cash_yield_bps < target_cash_yield_bps)      # STRICT less-than
      replan_property_count        = count of the fund's properties with harvest_plan_status == REPLAN_REQUIRED
      valuation_basis_stale_count  = count of the fund's OWNED/HBU_MARKETED properties with appraisal_status != SIGNED
      owned_property_count         = count of the fund's properties with status IN {OWNED, HBU_MARKETED}
      appraised_value_total_usd    = round_half_up(sum(carry) over those same OWNED/HBU_MARKETED properties, 2)
      standing_inventory_tons      = round_half_up(sum of Stand.net_merch_tons over every Stand of every property of
                                     the fund whose Stand.status != DISPOSED, 2)     # ownership status is irrelevant here
    input_set: "Only properties in OWNED or HBU_MARKETED carry value; PROSPECT, UNDER_UNDERWRITING, APPROVED_FOR_BID and PASSED contribute 0.00. net_operating_cash_usd accumulates every cash movement EXCEPT the acquisition price outflow (a capital call, not operating cash)."
    constants:
      STALE_APPRAISAL_HAIRCUT_PCT: 12
      BPS_SCALE: 10000
    precision: "USD at 2 decimals; cash_yield_bps at 0 decimals; round_half_up"

  # ------------------------------------------------------------------- C8
  - name: lease_rent_and_coverage
    trigger: "POST /timberland/recreational-leases (coverage check), POST /timberland/recreational-leases/{id}/activate (rent), POST /timberland/recreational-leases/{id}/terminate (refund)"
    algorithm: interval_merge
    formula: |
      annual_rent_usd = round_half_up(leased_acres * rent_per_acre_usd, 2)
      term_days       = (term_end_date - term_start_date) in whole days       # HALF-OPEN: end excluded
      first_year_prorated_rent_usd = round_half_up(annual_rent_usd * min(term_days, DAYS_PER_YEAR) / DAYS_PER_YEAR, 2)
      # termination
      earned_days      = (termination_effective_date - term_start_date) in whole days
      earned_rent_usd  = round_half_up(annual_rent_usd * earned_days / DAYS_PER_YEAR, 2)
      refunded_rent_usd = round_half_up(first_year_prorated_rent_usd - earned_rent_usd, 2)
      # aggregate coverage capacity, evaluated at activation
      capacity = round_half_up(Property.total_acres * MAX_LEASE_COVERAGE_PCT / 100, 2)
      overlapping = leases of the property with status IN {PENDING, ACTIVE} whose [term_start_date, term_end_date)
                    intersects the candidate's [term_start_date, term_end_date)   # touching endpoints do NOT intersect
      round_half_up(sum(overlapping.leased_acres) + candidate.leased_acres, 2) <= capacity   # <= is allowed, > rejects
      # blackout, evaluated at harvest commit
      block interval [planned_start_date, planned_end_date] is CLOSED at both ends;
      blackout interval [blackout_start_date, blackout_end_date) is HALF-OPEN.
      A commit is rejected when the closed block interval intersects the half-open blackout
      of any ACTIVE lease on the property.
    input_set: "PENDING and ACTIVE leases occupy coverage; TERMINATED and EXPIRED leases release it immediately. Only ACTIVE leases impose blackouts."
    constants:
      MAX_LEASE_COVERAGE_PCT: 80
      DAYS_PER_YEAR: 365
    precision: "2 decimals, round_half_up"

  # ------------------------------------------------------------------- C9
  - name: hbu_disposition_split
    trigger: "POST /timberland/hbu-parcels/{id}/advance with action=CLOSE"
    algorithm: constraint_propagation
    formula: |
      withdrawn_tons   = round_half_up(Stand.net_merch_tons * HbuParcel.acres / Stand.acres, 2)
      commission_usd   = round_half_up(contract_price_usd * HBU_COMMISSION_PCT / 100, 2)
      net_proceeds_usd = round_half_up(contract_price_usd - commission_usd - closing_costs_usd, 2)
      # acre conservation: parent + derived == original, exactly
      derived_stand.acres = HbuParcel.acres
      Stand.acres         = round_half_up(Stand.acres - HbuParcel.acres, 2)
      derived_stand.net_merch_tons = withdrawn_tons ; derived_stand.status = DISPOSED
      # Stand.net_merch_tons is deliberately NOT reduced: the withdrawal is carried in the
      # hbu_withdrawn_tons bucket so the partition identity below stays exact and the
      # reallocation waterfall has one source of truth.
      Stand.hbu_withdrawn_tons += withdrawn_tons
      then propagate: available_tons may go negative, so run the same ordered waterfall as
      hazard_loss_reallocation (RESERVED blocks, then COMMITTED blocks, then dedications)
      for inventory_shortfall_tons = round_half_up(max(0, reserved + committed + dedicated
                                     + hbu_withdrawn - net_merch_tons), 2); every block whose
      planned_tons is cut sets Property.harvest_plan_status = REPLAN_REQUIRED, and a block cut
      to 0.00 becomes VOIDED with voided_reason = HBU_WITHDRAWAL.
      Fund.cash_balance_usd += net_proceeds_usd ; Fund.net_operating_cash_usd += net_proceeds_usd
    input_set: "One HbuParcel and its parent Stand. The parcel must leave at least MIN_RETAINED_ACRES on the parent (checked at parcel creation, priority 65)."
    constants:
      HBU_COMMISSION_PCT: 3.5
      MIN_RETAINED_ACRES: 5
    precision: "tons and acres at 2 decimals; USD at 2 decimals; round_half_up"

  # ------------------------------------------------------------------ C10
  - name: appraised_value_by_methodology
    trigger: "POST /timberland/properties/{id}/appraisal with action=SUBMIT"
    algorithm: threshold
    formula: |
      INCOME : appraised_value_usd = round_half_up(stabilized_noi_usd / (cap_rate_bps / 10000), 2)
      MARKET : appraised_value_usd = round_half_up(Property.total_acres * comparable_price_per_acre_usd, 2)
      COST   : appraised_value_usd = round_half_up(Property.total_acres * bare_land_value_per_acre_usd
                                     + timber_basis_tons * timber_unit_value_usd_per_ton, 2)
      where timber_basis_tons = sum of net_merch_tons over the property's stands with status == INVENTORIED
      # Each methodology has its own required-input set; a missing input for the CHOSEN
      # methodology is ERR_APPRAISAL_INPUTS_INCOMPLETE (422). Inputs belonging to the other
      # two methodologies are ignored when present.
    input_set: "INCOME requires stabilized_noi_usd and cap_rate_bps. MARKET requires comparable_price_per_acre_usd. COST requires bare_land_value_per_acre_usd and timber_unit_value_usd_per_ton, and reads INVENTORIED stands only."
    constants:
      BPS_SCALE: 10000
    precision: "2 decimals, round_half_up"
    variants:
      - name: INCOME
        when: "appraisal_methodology == INCOME"
        difference: "Direct capitalisation. 210000.00 NOI at 575 bps gives 3652173.91."
      - name: MARKET
        when: "appraisal_methodology == MARKET"
        difference: "Per-acre comparables. 1200.00 acres at 3250.00 gives 3900000.00."
      - name: COST
        when: "appraisal_methodology == COST"
        difference: "Bare land plus timber. 1200.00 acres at 1150.00 plus 4647.12 tons at 26.50 gives 1503148.68."

  # ------------------------------------------------------------------ C11
  - name: certification_posture_derivation
    trigger: "POST /timberland/certification-audits, POST /timberland/certification-audits/{id}/advance, POST /timberland/certification-audits/{id}/findings, POST /timberland/audit-findings/{id}/transition"
    algorithm: threshold
    formula: |
      open_major = count of AuditFindings across ALL audits of the property with
                   severity == MAJOR and status IN {OPEN, CAR_SUBMITTED}
      open_minor = count with severity == MINOR and status IN {OPEN, CAR_SUBMITTED}
      if Property.certification_scheme == NONE                     : UNCERTIFIED
      elif any audit of the property has status == SUSPENDED       : SUSPENDED
      elif open_major >= MAJOR_SUSPENSION_THRESHOLD                : SUSPENDED     # 2, not 1
      elif open_major == 1 or open_minor >= 1                      : CONDITIONAL
      else                                                        : CERTIFIED
      # On any transition INTO SUSPENDED, every HarvestBlock on the property's stands with
      # status == COMMITTED reverts to RESERVED (tons move from committed_tons back to
      # reserved_tons; available_tons and planned_tons are untouched).
    input_set: "Findings with severity == OBSERVATION never affect the posture, in any status. CLOSED findings of any severity are excluded."
    constants:
      MAJOR_SUSPENSION_THRESHOLD: 2
    precision: "integer counts; no rounding"

validations:
  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list AND, for endpoints with an `action` discriminator, is permitted for the requested action (SUBMIT_CAR is ForestManager-only; REJECT_CAR and VERIFY_CLOSE are CertificationAuditor-only)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 30
    category: existence
    check: "the resource named by the path {id} exists"
    error_id: "ERR_FUND_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_STAND_NOT_FOUND | ERR_UNDERWRITING_CASE_NOT_FOUND | ERR_HARVEST_BLOCK_NOT_FOUND | ERR_CARBON_PROJECT_NOT_FOUND | ERR_CARBON_DEDICATION_NOT_FOUND | ERR_HBU_PARCEL_NOT_FOUND | ERR_RECREATIONAL_LEASE_NOT_FOUND | ERR_CERTIFICATION_AUDIT_NOT_FOUND | ERR_AUDIT_FINDING_NOT_FOUND | ERR_HAZARD_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path {id}"

  - priority: 40
    category: existence
    check: "every foreign key in the request body resolves, validated left-to-right in the order the fields are declared in §1.1 (e.g. POST /carbon-dedications checks carbon_project_id before stand_id)"
    error_id: "the matching *_NOT_FOUND for the first unresolved reference"
    http_status: 404
    applies_to: "POST /timberland/properties, POST /timberland/stands, POST /timberland/cruise-plots, POST /timberland/underwriting-cases, POST /timberland/harvest-blocks, POST /timberland/carbon-projects, POST /timberland/carbon-dedications, POST /timberland/hbu-parcels, POST /timberland/recreational-leases, POST /timberland/certification-audits, POST /timberland/hazard-events, POST /timberland/properties/{id}/acquire"

  - priority: 45
    category: business_constraint
    check: "request shape: all required input fields present; enums within their declared value set; numerics within their declared range and decimal precision; computed and system fields present in the body are ignored, not rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 48
    category: state
    check: "expected_stand_version equals Stand.version"
    error_id: ERR_STALE_STAND_VERSION
    http_status: 412
    applies_to: "POST /timberland/harvest-blocks, POST /timberland/carbon-dedications"

  - priority: 49
    category: state
    check: "expected_property_version equals Property.version; expected_fund_version equals Fund.version"
    error_id: "ERR_STALE_PROPERTY_VERSION | ERR_STALE_FUND_VERSION"
    http_status: 412
    applies_to: "POST /timberland/underwriting-cases, POST /timberland/properties/{id}/acquire"

  - priority: 50
    category: business_safety
    check: "segregation of duties: the case decider is not its author; the appraisal signer is neither its submitter nor the author of any UnderwritingCase on that property; the finding closer is not the user who submitted the corrective action"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /timberland/underwriting-cases/{id}/decide, POST /timberland/properties/{id}/appraisal, POST /timberland/audit-findings/{id}/transition"

  - priority: 55
    category: state
    check: "the requested transition is declared for the entity's current state"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 55
    category: state
    check: "the stand is INVENTORIED before allocating, dedicating, splitting or damaging its inventory"
    error_id: ERR_STAND_NOT_INVENTORIED
    http_status: 409
    applies_to: "POST /timberland/harvest-blocks, POST /timberland/carbon-dedications, POST /timberland/hbu-parcels, POST /timberland/hazard-events"

  - priority: 55
    category: state
    check: "the stand is still CRUISE_OPEN when adding a plot or closing the cruise"
    error_id: ERR_CRUISE_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /timberland/cruise-plots, POST /timberland/stands/{id}/cruise-close"

  - priority: 55
    category: state
    check: "the referenced UnderwritingCase is APPROVED"
    error_id: ERR_UNDERWRITING_NOT_APPROVED
    http_status: 409
    applies_to: "POST /timberland/properties/{id}/acquire"

  - priority: 55
    category: state
    check: "the property is OWNED or HBU_MARKETED before leases, carbon projects, audits or HBU listings are operated on it"
    error_id: ERR_PROPERTY_NOT_OWNED
    http_status: 409
    applies_to: "POST /timberland/recreational-leases/{id}/activate, POST /timberland/carbon-projects, POST /timberland/certification-audits, POST /timberland/hbu-parcels/{id}/advance"

  - priority: 55
    category: state
    check: "Property.appraisal_status == SIGNED"
    error_id: ERR_APPRAISAL_NOT_SIGNED
    http_status: 409
    applies_to: "POST /timberland/properties/{id}/acquire, POST /timberland/hbu-parcels/{id}/advance (action=LIST)"

  - priority: 55
    category: state
    check: "the carbon project is in DRAFT or VALIDATION when a new dedication is added"
    error_id: ERR_CARBON_PROJECT_NOT_OPEN_FOR_DEDICATION
    http_status: 409
    applies_to: "POST /timberland/carbon-dedications"

  - priority: 55
    category: state
    check: "revision_count < MAX_REVISION_ROUNDS (2) before issuing another REQUEST_REVISION"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /timberland/underwriting-cases/{id}/decide"

  - priority: 55
    category: state
    check: "an ACTIVE or REDUCED dedication cannot be released before its permanence_end_date"
    error_id: ERR_CARBON_PERMANENCE_LOCK
    http_status: 409
    applies_to: "POST /timberland/carbon-dedications/{id}/release, POST /timberland/carbon-projects/{id}/advance (action=TERMINATE from REGISTERED)"

  - priority: 55
    category: state
    check: "findings may only be raised while the audit is in FIELD_WORK or FINDINGS_ISSUED"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /timberland/certification-audits/{id}/findings"

  - priority: 55
    category: state
    check: "an audit cannot be closed while it has open MAJOR or MINOR findings"
    error_id: ERR_OPEN_FINDINGS_BLOCK_CLOSURE
    http_status: 409
    applies_to: "POST /timberland/certification-audits/{id}/advance (action=CLOSE)"

  - priority: 60
    category: business_safety
    check: "Property.certification_posture != SUSPENDED before committing or completing a harvest, or registering a carbon project"
    error_id: ERR_CERTIFICATION_SUSPENDED
    http_status: 409
    applies_to: "POST /timberland/harvest-blocks/{id}/commit, POST /timberland/harvest-blocks/{id}/close, POST /timberland/carbon-projects/{id}/advance (action=REGISTER)"

  - priority: 60
    category: business_safety
    check: "a harvest block cannot be cancelled while Fund.harvest_acceleration_required is true — the investor cash-yield mandate locks scheduled volume in place"
    error_id: ERR_YIELD_SHORTFALL_LOCK
    http_status: 409
    applies_to: "POST /timberland/harvest-blocks/{id}/close (action=CANCEL)"

  - priority: 62
    category: business_temporal
    check: "planned_end_date >= planned_start_date (closed interval); term_end_date > term_start_date and blackout_end_date > blackout_start_date with both blackout dates inside the term (half-open intervals)"
    error_id: "ERR_HARVEST_WINDOW_INVALID | ERR_LEASE_TERM_INVALID"
    http_status: 422
    applies_to: "POST /timberland/harvest-blocks, POST /timberland/recreational-leases"

  - priority: 64
    category: business_temporal
    check: "a new harvest block's planned_start_date must fall strictly after prior_block.planned_end_date + REENTRY_BUFFER_MONTHS (24) for every RESERVED, COMMITTED or COMPLETED block on the same stand — the buffer endpoint itself is a conflict"
    error_id: ERR_REENTRY_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /timberland/harvest-blocks"

  - priority: 64
    category: business_temporal
    check: "the block's closed [planned_start_date, planned_end_date] window must not intersect the half-open blackout window of any ACTIVE recreational lease on the property"
    error_id: ERR_LEASE_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /timberland/harvest-blocks/{id}/commit"

  - priority: 65
    category: business_constraint
    check: "plot_number is unique within the stand"
    error_id: ERR_DUPLICATE_PLOT_NUMBER
    http_status: 409
    applies_to: "POST /timberland/cruise-plots"

  - priority: 65
    category: business_constraint
    check: "the stand has at least one CruisePlot before its cruise can be closed"
    error_id: ERR_NO_CRUISE_PLOTS
    http_status: 422
    applies_to: "POST /timberland/stands/{id}/cruise-close"

  - priority: 65
    category: business_constraint
    check: "every input required by the chosen appraisal_methodology is present"
    error_id: ERR_APPRAISAL_INPUTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /timberland/properties/{id}/appraisal (action=SUBMIT)"

  - priority: 65
    category: business_constraint
    check: "HbuParcel.acres <= Stand.acres - MIN_RETAINED_ACRES (5)"
    error_id: ERR_HBU_ACRES_EXCEED_STAND
    http_status: 422
    applies_to: "POST /timberland/hbu-parcels"

  - priority: 70
    category: business_referential
    check: "the dedicated stand belongs to the carbon project's property"
    error_id: ERR_STAND_PROPERTY_MISMATCH
    http_status: 422
    applies_to: "POST /timberland/carbon-dedications"

  - priority: 70
    category: business_referential
    check: "the referenced UnderwritingCase.property_id equals the path property id"
    error_id: ERR_CASE_PROPERTY_MISMATCH
    http_status: 422
    applies_to: "POST /timberland/properties/{id}/acquire"

  - priority: 80
    category: business_fiscal
    check: "planned_tons (or dedicated_tons) <= Stand.available_tons; equality is allowed"
    error_id: ERR_INSUFFICIENT_AVAILABLE_TONS
    http_status: 422
    applies_to: "POST /timberland/harvest-blocks, POST /timberland/carbon-dedications"

  - priority: 80
    category: business_fiscal
    check: "actual_tons <= planned_tons at COMPLETE"
    error_id: ERR_ACTUAL_TONS_EXCEED_PLANNED
    http_status: 422
    applies_to: "POST /timberland/harvest-blocks/{id}/close (action=COMPLETE)"

  - priority: 80
    category: business_fiscal
    check: "aggregate leased acres over every overlapping PENDING/ACTIVE lease plus the candidate <= total_acres * MAX_LEASE_COVERAGE_PCT / 100; equality is allowed"
    error_id: ERR_LEASE_ACREAGE_EXCEEDED
    http_status: 422
    applies_to: "POST /timberland/recreational-leases/{id}/activate"

  - priority: 80
    category: business_fiscal
    check: "Fund.cash_balance_usd >= the amount about to be debited (bid price, buffer cure cost, insurance premium or lease refund)"
    error_id: ERR_FUND_CASH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /timberland/properties/{id}/acquire, POST /timberland/carbon-projects/{id}/advance (action=CURE_BUFFER), POST /timberland/properties/{id}/risk-review, POST /timberland/recreational-leases/{id}/terminate"

  - priority: 80
    category: business_fiscal
    check: "bid_price_usd <= underwritten_value_usd"
    error_id: ERR_BID_EXCEEDS_UNDERWRITTEN_VALUE
    http_status: 422
    applies_to: "POST /timberland/underwriting-cases/{id}/submit"

  - priority: 80
    category: business_fiscal
    check: "settled_claim_usd <= HazardEvent.insurance_claim_usd"
    error_id: ERR_CLAIM_EXCEEDS_INDEMNITY
    http_status: 422
    applies_to: "POST /timberland/hazard-events/{id}/salvage-settle"

  - priority: 80
    category: business_fiscal
    check: "salvage_sold_tons <= HazardEvent.salvageable_tons"
    error_id: ERR_SALVAGE_EXCEEDS_RECOVERABLE
    http_status: 422
    applies_to: "POST /timberland/hazard-events/{id}/salvage-settle"

  - priority: 80
    category: business_fiscal
    check: "the project has at least one PENDING dedication before validation, and dedicated_tons_total > 0 at registration"
    error_id: ERR_CARBON_NO_DEDICATIONS
    http_status: 422
    applies_to: "POST /timberland/carbon-projects/{id}/advance (action=SUBMIT_VALIDATION or REGISTER)"

  - priority: 80
    category: business_fiscal
    check: "cure_tons >= CarbonProject.buffer_deficit_tons"
    error_id: ERR_BUFFER_CURE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /timberland/carbon-projects/{id}/advance (action=CURE_BUFFER)"

endpoints:
  # ------------------------------------------------------- test-driving clock
  - method: POST
    path: "/timberland/_clock/set_current_utc"
    description: "Sets the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. Every date-dependent rule (re-entry buffer, lease proration, permanence lock, appraisal staleness, trailing claim window) reads this clock."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock", "lazily re-evaluates lease expiry and appraisal staleness on the next read of the affected entity"]

  # ------------------------------------------------------------------- Fund
  - method: POST
    path: "/timberland/funds"
    description: "Creates a closed-end timberland fund."
    roles: [FundAdmin]
    code: 201
    input: [name, vintage_year, committed_capital_usd, target_cash_yield_bps, opening_cash_usd]
    output: Fund
    side_effects: ["cash_balance_usd = opening_cash_usd", "net_operating_cash_usd = 0.00", "cash_yield_bps = 0", "harvest_acceleration_required = (0 < target_cash_yield_bps)", "nav_usd = cash_balance_usd"]

  - method: GET
    path: "/timberland/funds/{id}"
    description: "Reads a fund with freshly recomputed nav_usd, cash_yield_bps, replan_property_count and valuation_basis_stale_count."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: Fund
    side_effects: ["runs fund_nav_and_cash_yield", "applies any pending lazy SIGNED -> STALE appraisal transitions"]

  - method: GET
    path: "/timberland/funds/{id}/properties"
    description: "Lists the fund's properties (FK reverse-reachability for Property.fund_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: "/timberland/funds/{id}/investor-report"
    description: "Investor reporting pack: NAV, cash yield against mandate, replan exposure and independent-appraisal coverage."
    roles: [FundAdmin, InvestmentCommittee, IndependentAppraiser]
    code: 200
    input: []
    output: { nav_usd: number, cash_balance_usd: number, net_operating_cash_usd: number, cash_yield_bps: integer, target_cash_yield_bps: integer, harvest_acceleration_required: boolean, replan_property_count: integer, valuation_basis_stale_count: integer, owned_property_count: integer, appraised_value_total_usd: number, standing_inventory_tons: number }
    side_effects: ["runs fund_nav_and_cash_yield", "applies any pending lazy SIGNED -> STALE appraisal transitions"]

  # --------------------------------------------------------------- Property
  - method: POST
    path: "/timberland/properties"
    description: "Registers a prospective tract under a fund."
    roles: [AcquisitionAnalyst]
    code: 201
    input: [fund_id, name, region_code, total_acres, haul_distance_miles, insured_value_usd, hbu_acres, hbu_price_per_acre_usd, annual_rec_income_usd, certification_scheme]
    output: Property
    side_effects: ["derives market_access_tier and market_access_discount_pct from haul_distance_miles", "certification_posture = UNCERTIFIED when certification_scheme == NONE, else CERTIFIED", "status = PROSPECT, appraisal_status = NONE, harvest_plan_status = ALIGNED"]

  - method: GET
    path: "/timberland/properties/{id}"
    description: "Reads a property including its four state dimensions and the derived market-access fields."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: Property
    side_effects: ["applies the lazy SIGNED -> STALE appraisal transition when the appraisal is older than 365 days"]

  - method: GET
    path: "/timberland/properties/{id}/stands"
    description: "Lists the property's stands (FK reverse-reachability for Stand.property_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: Stand[]
    side_effects: []

  - method: POST
    path: "/timberland/properties/{id}/appraisal"
    description: "Drives the independent-appraisal dimension: SUBMIT computes appraised_value_usd under the chosen methodology, SIGN countersigns it, INVALIDATE discards or stales it."
    roles: [IndependentAppraiser]
    code: 200
    input: [action, "appraisal_methodology?", "stabilized_noi_usd?", "cap_rate_bps?", "comparable_price_per_acre_usd?", "bare_land_value_per_acre_usd?", "timber_unit_value_usd_per_ton?"]
    output: Property
    side_effects: ["SUBMIT runs appraised_value_by_methodology and stamps appraisal_submitted_by_user_id", "SIGN stamps appraisal_signed_by_user_id and appraisal_signed_at and recomputes Fund.valuation_basis_stale_count", "INVALIDATE clears or stales the appraisal", "increments Property.version by 1"]

  - method: POST
    path: "/timberland/properties/{id}/risk-review"
    description: "Records a wildfire/insect/weather hazard review and prices the annual insurance policy under the chosen rating basis."
    roles: [FundAdmin]
    code: 200
    input: [insurance_rating_basis, wildfire_hazard_index, insect_hazard_index, weather_hazard_index]
    output: Property
    side_effects: ["runs insurance_premium_and_risk_score", "Fund.cash_balance_usd -= insurance_premium_usd", "Fund.net_operating_cash_usd -= insurance_premium_usd", "recomputes Fund.cash_yield_bps and harvest_acceleration_required", "increments Property.version by 1"]

  - method: POST
    path: "/timberland/properties/{id}/acquire"
    description: "Closes the acquisition against an APPROVED underwriting case, drawing the bid price from fund cash."
    roles: [FundAdmin]
    code: 200
    input: [underwriting_case_id, expected_fund_version]
    output: Property
    side_effects: ["Property.status -> OWNED", "Property.acquisition_price_usd = case.bid_price_usd", "Fund.cash_balance_usd -= case.bid_price_usd (net_operating_cash_usd is NOT touched — this is a capital call)", "recomputes Fund.nav_usd", "increments Fund.version by 1"]

  - method: GET
    path: "/timberland/properties/{id}/underwriting-cases"
    description: "Lists the property's underwriting cases (FK reverse-reachability for UnderwritingCase.property_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: UnderwritingCase[]
    side_effects: []

  - method: GET
    path: "/timberland/properties/{id}/carbon-projects"
    description: "Lists the property's carbon projects (FK reverse-reachability for CarbonProject.property_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: CarbonProject[]
    side_effects: []

  - method: GET
    path: "/timberland/properties/{id}/recreational-leases"
    description: "Lists the property's recreational leases (FK reverse-reachability for RecreationalLease.property_id). Applies the lazy ACTIVE -> EXPIRED transition."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: RecreationalLease[]
    side_effects: ["applies the lazy ACTIVE -> EXPIRED transition for leases whose term_end_date has passed"]

  - method: GET
    path: "/timberland/properties/{id}/certification-audits"
    description: "Lists the property's certification audits (FK reverse-reachability for CertificationAudit.property_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: CertificationAudit[]
    side_effects: []

  # -------------------------------------------------------- UnderwritingCase
  - method: POST
    path: "/timberland/underwriting-cases"
    description: "Opens an underwriting case on a property and computes the full valuation stack under the chosen growth variant."
    roles: [AcquisitionAnalyst]
    code: 201
    input: [property_id, growth_variant, discount_rate_bps, stumpage_price_usd_per_ton, bid_price_usd, expected_property_version]
    output: UnderwritingCase
    side_effects: ["runs underwritten_value: timber_pv_usd, hbu_premium_usd, rec_income_pv_usd, pre_fee_value_usd, acquisition_fee_pct, acquisition_fee_usd, underwritten_value_usd", "authored_by_user_id = X-User-ID", "increments Property.version by 1"]

  - method: GET
    path: "/timberland/underwriting-cases/{id}"
    description: "Reads an underwriting case with its valuation stack."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: UnderwritingCase
    side_effects: []

  - method: POST
    path: "/timberland/underwriting-cases/{id}/submit"
    description: "Submits (or resubmits after a revision round) the case to the investment committee."
    roles: [AcquisitionAnalyst]
    code: 200
    input: []
    output: UnderwritingCase
    side_effects: ["recomputes the valuation stack against the property's current inventory", "case.status -> SUBMITTED", "Property.status -> UNDER_UNDERWRITING", "increments Property.version by 1"]

  - method: POST
    path: "/timberland/underwriting-cases/{id}/decide"
    description: "Committee decision on a submitted case: APPROVE, REJECT or REQUEST_REVISION."
    roles: [InvestmentCommittee]
    code: 200
    input: [decision, "decision_note?"]
    output: UnderwritingCase
    side_effects: ["decided_by_user_id = X-User-ID", "APPROVE -> Property.status APPROVED_FOR_BID and sibling non-terminal cases -> WITHDRAWN", "REJECT -> Property.status PASSED", "REQUEST_REVISION -> revision_count += 1", "increments Property.version by 1"]

  # ------------------------------------------------------------------ Stand
  - method: POST
    path: "/timberland/stands"
    description: "Creates a stand on a property, open for cruise."
    roles: [ForestManager]
    code: 201
    input: [property_id, stand_code, acres, species_code, age_years, site_index]
    output: Stand
    side_effects: ["status = CRUISE_OPEN", "all five allocation buckets = 0.00", "increments Property.version by 1"]

  - method: GET
    path: "/timberland/stands/{id}"
    description: "Reads a stand including the five-bucket inventory partition (reserved/committed/dedicated/hbu_withdrawn/available)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: Stand
    side_effects: []

  - method: POST
    path: "/timberland/stands/{id}/cruise-close"
    description: "Closes the timber cruise and expands the plot sample to a stand-level merchantable inventory."
    roles: [ForestManager]
    code: 200
    input: []
    output: Stand
    side_effects: ["runs stand_cruise_volume", "status -> INVENTORIED", "available_tons = net_merch_tons", "increments Stand.version by 1"]

  - method: GET
    path: "/timberland/stands/{id}/cruise-plots"
    description: "Lists the stand's cruise plots (FK reverse-reachability for CruisePlot.stand_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: CruisePlot[]
    side_effects: []

  - method: GET
    path: "/timberland/stands/{id}/harvest-blocks"
    description: "Lists the stand's harvest blocks (FK reverse-reachability for HarvestBlock.stand_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: HarvestBlock[]
    side_effects: []

  - method: GET
    path: "/timberland/stands/{id}/carbon-dedications"
    description: "Lists dedications drawn against the stand (FK reverse-reachability for CarbonDedication.stand_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: CarbonDedication[]
    side_effects: []

  - method: GET
    path: "/timberland/stands/{id}/hbu-parcels"
    description: "Lists HBU parcels carved from the stand (FK reverse-reachability for HbuParcel.stand_id and HbuParcel.derived_stand_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: HbuParcel[]
    side_effects: []

  - method: GET
    path: "/timberland/stands/{id}/hazard-events"
    description: "Lists hazard events on the stand (FK reverse-reachability for HazardEvent.stand_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: HazardEvent[]
    side_effects: []

  - method: GET
    path: "/timberland/stands/{id}/derived-stands"
    description: "Lists stands minted out of this stand by HBU closings (FK reverse-reachability for the self-referential Stand.split_from_stand_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: Stand[]
    side_effects: []

  # ------------------------------------------------------------- CruisePlot
  - method: POST
    path: "/timberland/cruise-plots"
    description: "Records one immutable cruise plot measurement on a stand that is still CRUISE_OPEN."
    roles: [ForestManager]
    code: 201
    input: [stand_id, plot_number, tons_per_acre, defect_pct, measured_at]
    output: CruisePlot
    side_effects: ["net_tons_per_acre = round_half_up(tons_per_acre * (1 - defect_pct / 100), 3)", "measured_by_user_id = X-User-ID", "Stand.plot_count += 1"]

  # ----------------------------------------------------------- HarvestBlock
  - method: POST
    path: "/timberland/harvest-blocks"
    description: "Reserves stand inventory for a harvest window, subject to available tons, the re-entry buffer and the caller's view of the stand version."
    roles: [ForestManager]
    code: 201
    input: [stand_id, planned_start_date, planned_end_date, planned_tons, product_mix, expected_stumpage_price_usd_per_ton, price_index_factor, expected_haul_distance_miles, growth_variant, expected_stand_version]
    output: HarvestBlock
    side_effects: ["status = RESERVED", "Stand.reserved_tons += planned_tons and Stand.available_tons -= planned_tons", "computes years_to_start and projected_available_tons via growth_projection_volume", "computes provisional_net_revenue_usd and severance_tax_usd via harvest_block_net_revenue (provisional)", "Property.harvest_plan_status -> ALIGNED", "increments Stand.version by 1"]

  - method: GET
    path: "/timberland/harvest-blocks/{id}"
    description: "Reads a harvest block including its current planned_tons after any waterfall cuts."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: HarvestBlock
    side_effects: []

  - method: POST
    path: "/timberland/harvest-blocks/{id}/commit"
    description: "Commits a reserved block to operations after the certification and lease-blackout gates pass."
    roles: [ForestManager]
    code: 200
    input: []
    output: HarvestBlock
    side_effects: ["status -> COMMITTED", "planned_tons moves from Stand.reserved_tons to Stand.committed_tons (available_tons unchanged)", "increments Stand.version by 1"]

  - method: POST
    path: "/timberland/harvest-blocks/{id}/close"
    description: "Closes a block: COMPLETE scales the actual removal and settles cash, CANCEL releases the reservation back to the pool."
    roles: [ForestManager]
    code: 200
    input: [action, "actual_tons?", "realized_price_index_factor?"]
    output: HarvestBlock
    side_effects: ["COMPLETE runs harvest_block_net_revenue (final), reduces Stand.net_merch_tons by actual_tons, credits Fund.cash_balance_usd and Fund.net_operating_cash_usd, recomputes cash_yield_bps and harvest_acceleration_required", "CANCEL returns planned_tons to Stand.available_tons", "increments Stand.version by 1"]

  # ----------------------------------------------------------- CarbonProject
  - method: POST
    path: "/timberland/carbon-projects"
    description: "Opens an improved-forest-management carbon project on an owned property."
    roles: [CarbonDeveloper]
    code: 201
    input: [property_id, registry, crediting_period_years, permanence_term_years, baseline_tons_per_acre]
    output: CarbonProject
    side_effects: ["status = DRAFT", "dedicated_tons_total = 0.00", "buffer_pool_tons = 0.00", "buffer_deficit_tons = 0.00"]

  - method: GET
    path: "/timberland/carbon-projects/{id}"
    description: "Reads a carbon project including its buffer pool and any unfunded reversal obligation."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: CarbonProject
    side_effects: []

  - method: POST
    path: "/timberland/carbon-projects/{id}/advance"
    description: "Drives the registry lifecycle: SUBMIT_VALIDATION, REGISTER, CURE_BUFFER, TERMINATE."
    roles: [CarbonDeveloper]
    code: 200
    input: [action, "cure_tons?"]
    output: CarbonProject
    side_effects: ["REGISTER activates every PENDING dedication with permanence_end_date and fixes buffer_pool_tons", "CURE_BUFFER adds cure_tons to the buffer pool, zeroes buffer_deficit_tons and debits Fund cash at BUFFER_CURE_COST_USD_PER_TON", "TERMINATE releases every non-terminal dedication and returns the tons to Stand.available_tons"]

  - method: GET
    path: "/timberland/carbon-projects/{id}/dedications"
    description: "Lists the project's dedications (FK reverse-reachability for CarbonDedication.carbon_project_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: CarbonDedication[]
    side_effects: []

  # -------------------------------------------------------- CarbonDedication
  - method: POST
    path: "/timberland/carbon-dedications"
    description: "Dedicates stand inventory to a carbon project, withdrawing the tons from the allocatable pool."
    roles: [CarbonDeveloper]
    code: 201
    input: [carbon_project_id, stand_id, dedicated_tons, expected_stand_version]
    output: CarbonDedication
    side_effects: ["status = PENDING", "Stand.dedicated_tons += dedicated_tons and Stand.available_tons -= dedicated_tons", "CarbonProject.dedicated_tons_total recomputed", "increments Stand.version by 1"]

  - method: GET
    path: "/timberland/carbon-dedications/{id}"
    description: "Reads a dedication including any reduced_tons clawed back by a reversal."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: CarbonDedication
    side_effects: []

  - method: POST
    path: "/timberland/carbon-dedications/{id}/release"
    description: "Releases a dedication and returns its remaining tons to the stand's allocatable pool."
    roles: [CarbonDeveloper]
    code: 200
    input: ["release_reason?"]
    output: CarbonDedication
    side_effects: ["status -> RELEASED", "Stand.dedicated_tons -= remaining tons and Stand.available_tons += remaining tons", "CarbonProject.dedicated_tons_total recomputed", "increments Stand.version by 1"]

  # -------------------------------------------------------------- HbuParcel
  - method: POST
    path: "/timberland/hbu-parcels"
    description: "Identifies a higher-and-better-use parcel inside a stand, leaving at least MIN_RETAINED_ACRES behind."
    roles: [FundAdmin]
    code: 201
    input: [stand_id, parcel_code, acres, ask_price_usd]
    output: HbuParcel
    side_effects: ["status = IDENTIFIED", "withdrawn_tons = 0.00"]

  - method: GET
    path: "/timberland/hbu-parcels/{id}"
    description: "Reads an HBU parcel including withdrawn_tons, commission and net proceeds after closing."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: HbuParcel
    side_effects: []

  - method: POST
    path: "/timberland/hbu-parcels/{id}/advance"
    description: "Drives the disposition lifecycle: LIST, CONTRACT, RELIST, CLOSE, WITHDRAW."
    roles: [FundAdmin]
    code: 200
    input: [action, "contract_price_usd?", "closing_costs_usd?"]
    output: HbuParcel
    side_effects: ["LIST flips Property.status to HBU_MARKETED", "CLOSE runs hbu_disposition_split: withdrawn_tons, parent Stand.acres reduced, derived DISPOSED stand minted, net proceeds credited to the fund, inventory waterfall may cut harvest blocks and set Property.harvest_plan_status = REPLAN_REQUIRED", "CLOSE and WITHDRAW return Property.status to OWNED when no parcel remains LISTED or UNDER_CONTRACT", "increments Stand.version by 1 on CLOSE"]

  # ------------------------------------------------------- RecreationalLease
  - method: POST
    path: "/timberland/recreational-leases"
    description: "Records a hunting/recreational lease offer on an owned property, with its term and hunting-season blackout window."
    roles: [FundAdmin]
    code: 201
    input: [property_id, lessee_name, leased_acres, rent_per_acre_usd, term_start_date, term_end_date, blackout_start_date, blackout_end_date]
    output: RecreationalLease
    side_effects: ["status = PENDING", "computes annual_rent_usd and term_days", "the leased acres already count against the coverage cap while PENDING"]

  - method: GET
    path: "/timberland/recreational-leases/{id}"
    description: "Reads a lease including prorated rent and any refund. Applies the lazy ACTIVE -> EXPIRED transition."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: RecreationalLease
    side_effects: ["applies the lazy ACTIVE -> EXPIRED transition when term_end_date has passed"]

  - method: POST
    path: "/timberland/recreational-leases/{id}/activate"
    description: "Activates the lease after the aggregate acreage-coverage check, charging the prorated first-term rent."
    roles: [FundAdmin]
    code: 200
    input: []
    output: RecreationalLease
    side_effects: ["status -> ACTIVE", "computes first_year_prorated_rent_usd via lease_rent_and_coverage", "Fund.cash_balance_usd and Fund.net_operating_cash_usd += first_year_prorated_rent_usd", "recomputes Fund.cash_yield_bps and harvest_acceleration_required", "the blackout window starts blocking harvest commits"]

  - method: POST
    path: "/timberland/recreational-leases/{id}/terminate"
    description: "Terminates a lease effective on a date inside its term and refunds the unearned rent."
    roles: [FundAdmin]
    code: 200
    input: [termination_effective_date]
    output: RecreationalLease
    side_effects: ["status -> TERMINATED", "refunded_rent_usd = first_year_prorated_rent_usd - earned rent", "Fund.cash_balance_usd and Fund.net_operating_cash_usd -= refunded_rent_usd", "releases the leased acres from the coverage cap and the blackout from the commit gate"]

  # ----------------------------------------------------- CertificationAudit
  - method: POST
    path: "/timberland/certification-audits"
    description: "Schedules an SFI/FSC surveillance or recertification audit on an owned, enrolled property."
    roles: [CertificationAuditor]
    code: 201
    input: [property_id, audit_type, scheduled_date]
    output: CertificationAudit
    side_effects: ["status = SCHEDULED", "all finding counts = 0", "recomputes Property.certification_posture"]

  - method: GET
    path: "/timberland/certification-audits/{id}"
    description: "Reads an audit including its MAJOR/MINOR open finding counts."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: CertificationAudit
    side_effects: []

  - method: POST
    path: "/timberland/certification-audits/{id}/advance"
    description: "Drives the audit lifecycle: START_FIELD_WORK, ISSUE_FINDINGS, SUSPEND, REINSTATE, CLOSE."
    roles: [CertificationAuditor]
    code: 200
    input: [action]
    output: CertificationAudit
    side_effects: ["recomputes Property.certification_posture via certification_posture_derivation", "SUSPEND reverts every COMMITTED HarvestBlock on the property's stands to RESERVED", "CLOSE requires zero open MAJOR and MINOR findings", "increments Property.version by 1"]

  - method: POST
    path: "/timberland/certification-audits/{id}/findings"
    description: "Raises a nonconformance finding against the audit."
    roles: [CertificationAuditor]
    code: 201
    input: [finding_code, severity, indicator_ref, due_date]
    output: AuditFinding
    side_effects: ["status = OPEN", "recomputes the audit's major/minor counts", "recomputes Property.certification_posture — the second open MAJOR suspends the property and reverts COMMITTED blocks to RESERVED"]

  - method: GET
    path: "/timberland/certification-audits/{id}/findings"
    description: "Lists the audit's findings (FK reverse-reachability for AuditFinding.certification_audit_id)."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: ["limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  # ------------------------------------------------------------ AuditFinding
  - method: GET
    path: "/timberland/audit-findings/{id}"
    description: "Reads a finding including its corrective-action custody fields."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []

  - method: POST
    path: "/timberland/audit-findings/{id}/transition"
    description: "Corrective-action cycle: SUBMIT_CAR (ForestManager only), REJECT_CAR and VERIFY_CLOSE (CertificationAuditor only)."
    roles: [ForestManager, CertificationAuditor]
    code: 200
    input: [action, "car_text?"]
    output: AuditFinding
    side_effects: ["SUBMIT_CAR stamps car_submitted_by_user_id and may advance the audit FINDINGS_ISSUED -> CAR_REVIEW", "REJECT_CAR increments rejection_count and returns the audit to FINDINGS_ISSUED", "VERIFY_CLOSE stamps closed_by_user_id and recomputes Property.certification_posture"]

  # ------------------------------------------------------------- HazardEvent
  - method: POST
    path: "/timberland/hazard-events"
    description: "Reports a wildfire, insect, wind or ice loss on an inventoried stand and reallocates the affected inventory."
    roles: [ForestManager]
    code: 201
    input: [stand_id, event_type, occurred_at, damaged_tons]
    output: HazardEvent
    side_effects: ["runs hazard_loss_reallocation: reduces Stand.net_merch_tons, computes salvageable_tons and insurance_claim_usd, cuts RESERVED then COMMITTED blocks then dedications, writes reallocation_log", "Stand.status -> SALVAGE_PENDING", "any block cut sets Property.harvest_plan_status = REPLAN_REQUIRED and increments Fund.replan_property_count", "increments Stand.version by 1"]

  - method: GET
    path: "/timberland/hazard-events/{id}"
    description: "Reads a hazard event including the ordered reallocation_log the waterfall produced."
    roles: [FundAdmin, AcquisitionAnalyst, InvestmentCommittee, ForestManager, CertificationAuditor, CarbonDeveloper, IndependentAppraiser]
    code: 200
    input: []
    output: HazardEvent
    side_effects: []

  - method: POST
    path: "/timberland/hazard-events/{id}/salvage-settle"
    description: "Settles the insurance claim and records the salvage volume actually merchandised."
    roles: [FundAdmin]
    code: 200
    input: [settled_claim_usd, salvage_sold_tons]
    output: HazardEvent
    side_effects: ["status -> SETTLED", "Stand.status SALVAGE_PENDING -> INVENTORIED", "Fund.cash_balance_usd and Fund.net_operating_cash_usd += settled_claim_usd", "recomputes Fund.cash_yield_bps and harvest_acceleration_required", "the settled claim becomes part of the trailing claim window for EXPERIENCE_RATED premiums"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for the endpoint, or not permitted for the requested action on a multi-role action endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user would perform two duties the scaffold requires to be separated (decide own case, sign own or own-underwritten appraisal, close own corrective action)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, numeric out of declared range or precision, or malformed date"

  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "the referenced fund does not exist"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "the referenced property does not exist"
  - id: ERR_STAND_NOT_FOUND
    http: 404
    condition: "the referenced stand does not exist"
  - id: ERR_UNDERWRITING_CASE_NOT_FOUND
    http: 404
    condition: "the referenced underwriting case does not exist"
  - id: ERR_HARVEST_BLOCK_NOT_FOUND
    http: 404
    condition: "the referenced harvest block does not exist"
  - id: ERR_CARBON_PROJECT_NOT_FOUND
    http: 404
    condition: "the referenced carbon project does not exist"
  - id: ERR_CARBON_DEDICATION_NOT_FOUND
    http: 404
    condition: "the referenced carbon dedication does not exist"
  - id: ERR_HBU_PARCEL_NOT_FOUND
    http: 404
    condition: "the referenced HBU parcel does not exist"
  - id: ERR_RECREATIONAL_LEASE_NOT_FOUND
    http: 404
    condition: "the referenced recreational lease does not exist"
  - id: ERR_CERTIFICATION_AUDIT_NOT_FOUND
    http: 404
    condition: "the referenced certification audit does not exist"
  - id: ERR_AUDIT_FINDING_NOT_FOUND
    http: 404
    condition: "the referenced audit finding does not exist"
  - id: ERR_HAZARD_EVENT_NOT_FOUND
    http: 404
    condition: "the referenced hazard event does not exist"

  - id: ERR_STALE_STAND_VERSION
    http: 412
    condition: "expected_stand_version does not match the stand's current version"
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version does not match the property's current version"
  - id: ERR_STALE_FUND_VERSION
    http: 412
    condition: "expected_fund_version does not match the fund's current version"

  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not a declared transition out of the entity's current state"
  - id: ERR_STAND_NOT_INVENTORIED
    http: 409
    condition: "the stand is not in INVENTORIED when its inventory is allocated, dedicated, split or damaged"
  - id: ERR_CRUISE_ALREADY_CLOSED
    http: 409
    condition: "a plot is added to, or the cruise re-closed on, a stand that has left CRUISE_OPEN"
  - id: ERR_UNDERWRITING_NOT_APPROVED
    http: 409
    condition: "the underwriting case cited at acquisition is not APPROVED"
  - id: ERR_PROPERTY_NOT_OWNED
    http: 409
    condition: "the property is not OWNED or HBU_MARKETED for an operation that requires ownership"
  - id: ERR_APPRAISAL_NOT_SIGNED
    http: 409
    condition: "the property's appraisal_status is not SIGNED where an independent signed appraisal is required"
  - id: ERR_CARBON_PROJECT_NOT_OPEN_FOR_DEDICATION
    http: 409
    condition: "a dedication is added to a project that has left DRAFT/VALIDATION"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "a third REQUEST_REVISION is issued on a case that already has revision_count == MAX_REVISION_ROUNDS (2)"
  - id: ERR_CERTIFICATION_SUSPENDED
    http: 409
    condition: "a harvest commit/complete or a carbon registration is attempted while Property.certification_posture == SUSPENDED"
  - id: ERR_CARBON_PERMANENCE_LOCK
    http: 409
    condition: "an ACTIVE or REDUCED dedication is released, or a REGISTERED project terminated, before the permanence_end_date"
  - id: ERR_OPEN_FINDINGS_BLOCK_CLOSURE
    http: 409
    condition: "an audit is closed while it still has open MAJOR or MINOR findings"
  - id: ERR_YIELD_SHORTFALL_LOCK
    http: 409
    condition: "a harvest block is cancelled while Fund.harvest_acceleration_required is true"
  - id: ERR_REENTRY_BUFFER_CONFLICT
    http: 409
    condition: "the new harvest window starts on or before a prior block's end date plus REENTRY_BUFFER_MONTHS (24)"
  - id: ERR_LEASE_BLACKOUT_CONFLICT
    http: 409
    condition: "the block's closed operating window intersects an ACTIVE lease's half-open hunting blackout"
  - id: ERR_DUPLICATE_PLOT_NUMBER
    http: 409
    condition: "plot_number already exists on the stand"

  - id: ERR_HARVEST_WINDOW_INVALID
    http: 422
    condition: "planned_end_date is earlier than planned_start_date"
  - id: ERR_LEASE_TERM_INVALID
    http: 422
    condition: "term_end_date is not after term_start_date, or the blackout window is empty or falls outside the term"
  - id: ERR_NO_CRUISE_PLOTS
    http: 422
    condition: "the cruise is closed on a stand with zero cruise plots"
  - id: ERR_APPRAISAL_INPUTS_INCOMPLETE
    http: 422
    condition: "an input required by the chosen appraisal_methodology is absent"
  - id: ERR_HBU_ACRES_EXCEED_STAND
    http: 422
    condition: "the parcel acreage would leave fewer than MIN_RETAINED_ACRES (5) on the parent stand"
  - id: ERR_STAND_PROPERTY_MISMATCH
    http: 422
    condition: "the dedicated stand does not belong to the carbon project's property"
  - id: ERR_CASE_PROPERTY_MISMATCH
    http: 422
    condition: "the underwriting case cited at acquisition belongs to a different property"
  - id: ERR_INSUFFICIENT_AVAILABLE_TONS
    http: 422
    condition: "planned_tons or dedicated_tons exceeds the stand's available_tons"
  - id: ERR_ACTUAL_TONS_EXCEED_PLANNED
    http: 422
    condition: "actual_tons at COMPLETE exceeds the block's current planned_tons"
  - id: ERR_LEASE_ACREAGE_EXCEEDED
    http: 422
    condition: "aggregate leased acres over overlapping terms would exceed total_acres * MAX_LEASE_COVERAGE_PCT / 100"
  - id: ERR_FUND_CASH_INSUFFICIENT
    http: 422
    condition: "the fund's cash_balance_usd cannot cover the debit about to be posted"
  - id: ERR_BID_EXCEEDS_UNDERWRITTEN_VALUE
    http: 422
    condition: "bid_price_usd exceeds underwritten_value_usd at submission"
  - id: ERR_CLAIM_EXCEEDS_INDEMNITY
    http: 422
    condition: "settled_claim_usd exceeds the hazard event's computed insurance_claim_usd"
  - id: ERR_SALVAGE_EXCEEDS_RECOVERABLE
    http: 422
    condition: "salvage_sold_tons exceeds the hazard event's computed salvageable_tons"
  - id: ERR_CARBON_NO_DEDICATIONS
    http: 422
    condition: "validation or registration is attempted on a project with no dedicated tons"
  - id: ERR_BUFFER_CURE_INSUFFICIENT
    http: 422
    condition: "cure_tons is less than the project's buffer_deficit_tons"

roles:
  - name: FundAdmin
    description: "Fund-level treasury and asset administration: fund setup, acquisition closing, insurance placement, HBU disposition, recreational leasing, claim settlement."
    identity: opaque
    exclusive_operations:
      - "POST /timberland/funds"
      - "POST /timberland/properties/{id}/acquire"
      - "POST /timberland/properties/{id}/risk-review"
      - "POST /timberland/hbu-parcels"
      - "POST /timberland/hbu-parcels/{id}/advance"
      - "POST /timberland/recreational-leases"
      - "POST /timberland/recreational-leases/{id}/activate"
      - "POST /timberland/recreational-leases/{id}/terminate"
      - "POST /timberland/hazard-events/{id}/salvage-settle"
    shared_operations:
      - "GET /timberland/funds/{id}/investor-report"
      - "every GET read endpoint"
      - "POST /timberland/_clock/set_current_utc"

  - name: AcquisitionAnalyst
    description: "Underwrites prospective tracts: registers properties and authors underwriting cases. Cannot decide its own cases."
    identity: opaque
    exclusive_operations:
      - "POST /timberland/properties"
      - "POST /timberland/underwriting-cases"
      - "POST /timberland/underwriting-cases/{id}/submit"
    shared_operations:
      - "every GET read endpoint except GET /timberland/funds/{id}/investor-report"
      - "POST /timberland/_clock/set_current_utc"

  - name: InvestmentCommittee
    description: "Approves, rejects or returns underwriting cases. Segregated from the case author."
    identity: opaque
    exclusive_operations:
      - "POST /timberland/underwriting-cases/{id}/decide"
    shared_operations:
      - "GET /timberland/funds/{id}/investor-report"
      - "every GET read endpoint"
      - "POST /timberland/_clock/set_current_utc"

  - name: ForestManager
    description: "Silvicultural operations: stands, cruise plots, harvest scheduling, hazard reporting, and submitting corrective actions for audit findings."
    identity: opaque
    exclusive_operations:
      - "POST /timberland/stands"
      - "POST /timberland/cruise-plots"
      - "POST /timberland/stands/{id}/cruise-close"
      - "POST /timberland/harvest-blocks"
      - "POST /timberland/harvest-blocks/{id}/commit"
      - "POST /timberland/harvest-blocks/{id}/close"
      - "POST /timberland/hazard-events"
      - "POST /timberland/audit-findings/{id}/transition (action=SUBMIT_CAR only)"
    shared_operations:
      - "POST /timberland/audit-findings/{id}/transition"
      - "every GET read endpoint except GET /timberland/funds/{id}/investor-report"
      - "POST /timberland/_clock/set_current_utc"

  - name: CertificationAuditor
    description: "Independent SFI/FSC auditor: schedules audits, raises findings, rejects or verifies corrective actions, suspends and reinstates certification."
    identity: opaque
    exclusive_operations:
      - "POST /timberland/certification-audits"
      - "POST /timberland/certification-audits/{id}/advance"
      - "POST /timberland/certification-audits/{id}/findings"
      - "POST /timberland/audit-findings/{id}/transition (action=REJECT_CAR or VERIFY_CLOSE only)"
    shared_operations:
      - "POST /timberland/audit-findings/{id}/transition"
      - "every GET read endpoint except GET /timberland/funds/{id}/investor-report"
      - "POST /timberland/_clock/set_current_utc"

  - name: CarbonDeveloper
    description: "Develops carbon offset projects and decides which stand inventory is dedicated to permanence."
    identity: opaque
    exclusive_operations:
      - "POST /timberland/carbon-projects"
      - "POST /timberland/carbon-projects/{id}/advance"
      - "POST /timberland/carbon-dedications"
      - "POST /timberland/carbon-dedications/{id}/release"
    shared_operations:
      - "every GET read endpoint except GET /timberland/funds/{id}/investor-report"
      - "POST /timberland/_clock/set_current_utc"

  - name: IndependentAppraiser
    description: "Third-party timberland appraiser. Submits and countersigns valuations; the signer must differ from the submitter and from any underwriting author on the property."
    identity: opaque
    exclusive_operations:
      - "POST /timberland/properties/{id}/appraisal"
    shared_operations:
      - "GET /timberland/funds/{id}/investor-report"
      - "every GET read endpoint"
      - "POST /timberland/_clock/set_current_utc"
