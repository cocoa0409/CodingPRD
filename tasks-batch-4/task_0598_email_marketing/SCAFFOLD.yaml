scenario: "Email Marketing & Automation (Mailchimp style): list/audience & subscriber import, opt-in/double-opt-in & consent (CAN-SPAM), campaign & template, segmentation & automation journey, send & deliverability/bounce, open/click & A/B test, unsubscribe/suppression, tiered (contact-count) billing"
domain_name: "email-marketing-automation"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Graph: Send is polymorphic over two producers (Campaign OR Journey), Segment
  # cross-cuts Audience->Subscriber, JourneyEnrollment is a Journey x Subscriber
  # junction, and SuppressionEntry is an account-scoped email index that gates
  # Subscriber creation across every Audience of the account.

  state_machine_shape: cyclic
  # Campaign cycles DRAFT -> IN_REVIEW -> DRAFT (REQUEST_CHANGES revision loop) and
  # Journey cycles ACTIVE <-> PAUSED. Send carries two independent state dimensions
  # (delivery_status x engagement_status) that advance without constraining each
  # other. Campaign SENDING -> SENT is a compound/bubble-up transition derived from
  # the aggregate delivery_status of its child Sends.

  relationship_patterns:
    - one_to_many        # Account -> Audience -> Subscriber
    - many_to_many       # JourneyEnrollment junction (Journey x Subscriber)
    - polymorphic        # Send.campaign_id XOR Send.journey_id
    - cross_aggregate    # SuppressionEntry (Account) gates Subscriber (Audience) writes

  role_model: segregation_of_duties
  # The AccountUser who authored a Campaign may never be the AccountUser who
  # approves it, even when that user holds the DUAL user_role.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Tenant display name"
        constraints: "1..120 chars, required"
      - name: plan_tier
        type: enum
        source: input
        description: "Billing plan tier; drives base fee, included contacts and overage discount"
        default: "FREE"
        constraints: "one of FREE, ESSENTIALS, STANDARD, PREMIUM"
      - name: status
        type: enum
        source: system
        description: "ACTIVE by default; set to SUSPENDED by the deliverability threshold rule"
        default: "ACTIVE"
        constraints: "one of ACTIVE, SUSPENDED"
      - name: suspension_reason
        type: enum
        source: system
        description: "Why the account was suspended; null while status == ACTIVE"
        default: null
        constraints: "one of HIGH_HARD_BOUNCE_RATE, or null"
      - name: hourly_send_capacity
        type: integer
        source: input
        description: "Maximum number of recipients this account may have inside any one overlapping send-window group"
        default: 1000
        constraints: ">= 1"
      - name: granted_send_credits
        type: integer
        source: system
        description: "Immutable total of send credits granted to the account; set from the `initial_send_credits` request field at POST /accounts (default 0). Never changes afterwards; anchors the send-credit conservation invariant."
        default: 0
        constraints: ">= 0"
      - name: send_credit_balance
        type: integer
        source: system
        description: "Unreserved, unconsumed send credits. Starts equal to granted_send_credits; decremented by Campaign.recipient_count on schedule, incremented back by Campaign.reserved_credit_count on cancel."
        default: 0
        constraints: ">= 0"
      - name: reserved_send_credits
        type: integer
        source: computed
        description: "Sum of Campaign.reserved_credit_count over campaigns of this account whose status IN {SCHEDULED, SENDING}"
      - name: consumed_send_credits
        type: integer
        source: computed
        description: "Sum of Campaign.reserved_credit_count over campaigns of this account whose status == SENT"
      - name: billable_contact_count
        type: integer
        source: computed
        description: "Sum of Audience.subscriber_count over all audiences of this account (calculation billable_contact_count, variant CURRENT)"
      - name: sender_reputation_score
        type: integer
        source: computed
        description: "0..100 deliverability reputation (calculation sender_reputation_score); 100 when the account has no scored sends"
        default: 100
        constraints: "0..100"

  - name: AccountUser
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the tenant this operator belongs to"
      - name: email
        type: string
        source: input
        description: "Operator login email"
        constraints: "must contain '@', unique within the account"
      - name: user_role
        type: enum
        source: input
        description: "Which X-User-Role headers this operator may claim. CAMPAIGN_AUTHOR permits CampaignAuthor; COMPLIANCE_APPROVER permits ComplianceApprover; DUAL permits both."
        constraints: "one of CAMPAIGN_AUTHOR, COMPLIANCE_APPROVER, DUAL"

  - name: Audience
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning tenant"
      - name: name
        type: string
        source: input
        description: "Audience (list) display name"
        constraints: "1..120 chars, required"
      - name: double_optin_required
        type: boolean
        source: input
        description: "When true, new subscribers land in consent_state PENDING and must confirm; when false they land in CONFIRMED immediately"
        default: true
      - name: default_from_email
        type: string
        source: input
        description: "From-address used by campaigns targeting this audience"
        constraints: "must contain '@', required"
      - name: subscriber_count
        type: integer
        source: computed
        description: "count(Subscriber WHERE audience_id == this.id AND consent_state IN {PENDING, CONFIRMED, UNSUBSCRIBED}); CLEANED and ARCHIVED subscribers are excluded"

  - name: Subscriber
    parent: Audience
    common_fields: true
    fields:
      - name: audience_id
        type: string
        source: input
        description: "FK -> Audience.id; the list this contact belongs to"
      - name: email
        type: string
        source: input
        description: "Contact email; unique per audience across every consent_state"
        constraints: "must contain '@', required"
      - name: first_name
        type: string
        source: input
        description: "Optional given name used in merge tags"
        default: null
      - name: consent_source
        type: enum
        source: input
        description: "How consent was captured (CAN-SPAM audit field). Rows created by an ImportJob are always stamped IMPORT."
        constraints: "one of SIGNUP_FORM, IMPORT, API, MANUAL"
      - name: consent_state
        type: enum
        source: system
        description: "Consent dimension of the subscriber lifecycle"
        default: "PENDING"
        constraints: "one of PENDING, CONFIRMED, UNSUBSCRIBED, CLEANED, ARCHIVED"
      - name: engagement_state
        type: enum
        source: computed
        description: "NEW when delivered_send_count == 0; else ENGAGED when engagement_score >= 70, DORMANT when 40 <= engagement_score < 70, LAPSED when engagement_score < 40"
        default: "NEW"
        constraints: "one of NEW, ENGAGED, DORMANT, LAPSED"
      - name: confirmation_token
        type: string
        source: system
        description: "Double-opt-in token minted when the subscriber is created in PENDING; null when the audience is single-opt-in"
        default: null
      - name: unsubscribe_token
        type: string
        source: system
        description: "Stable token embedded in the {{unsubscribe_url}} merge tag; minted at creation, never rotated"
      - name: consent_confirmed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which consent_state became CONFIRMED; null while PENDING"
        default: null
      - name: unsubscribed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which consent_state became UNSUBSCRIBED; null otherwise"
        default: null
      - name: delivered_send_count
        type: integer
        source: computed
        description: "count(Send WHERE subscriber_id == this.id AND delivery_status == DELIVERED)"
      - name: opened_send_count
        type: integer
        source: computed
        description: "count(Send WHERE subscriber_id == this.id AND delivery_status == DELIVERED AND engagement_status IN {OPENED, CLICKED})"
      - name: clicked_send_count
        type: integer
        source: computed
        description: "count(Send WHERE subscriber_id == this.id AND delivery_status == DELIVERED AND engagement_status == CLICKED)"
      - name: last_opened_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent OPEN or CLICK event across this subscriber's sends; null when never opened"
        default: null
      - name: engagement_score
        type: integer
        source: computed
        description: "0..100 (calculation subscriber_engagement_score, variant LIFETIME)"
        default: 50
        constraints: "0..100"
      - name: engagement_score_90d
        type: integer
        source: computed
        description: "0..100 (calculation subscriber_engagement_score, variant ROLLING_90D)"
        default: 50
        constraints: "0..100"

  - name: ImportJob
    parent: Audience
    common_fields: true
    fields:
      - name: audience_id
        type: string
        source: input
        description: "FK -> Audience.id; the list rows are imported into"
      - name: rows
        type: array
        source: input
        description: "Ordered array of row objects { email, first_name? }; processed strictly in array order"
        constraints: "1..100 elements"
      - name: status
        type: enum
        source: system
        description: "Import lifecycle state"
        default: "PENDING"
        constraints: "one of PENDING, COMPLETED, PARTIAL, REJECTED, ROLLED_BACK"
      - name: row_count
        type: integer
        source: computed
        description: "len(rows)"
      - name: accepted_count
        type: integer
        source: computed
        description: "Number of rows that produced a new Subscriber"
      - name: rejected_count
        type: integer
        source: computed
        description: "Number of rows rejected for malformed email (no '@')"
      - name: duplicate_count
        type: integer
        source: computed
        description: "Number of rows whose email already exists in the audience (any consent_state) or was already accepted by an earlier row of the same job"
      - name: suppressed_count
        type: integer
        source: computed
        description: "Number of rows whose email matches a SuppressionEntry of the audience's account"
      - name: created_subscriber_ids
        type: array
        source: computed
        description: "Ids of the Subscribers this job created, in row order; the exact set a rollback archives"

  - name: Segment
    parent: Audience
    common_fields: true
    fields:
      - name: audience_id
        type: string
        source: input
        description: "FK -> Audience.id; the list this segment filters"
      - name: name
        type: string
        source: input
        description: "Segment display name"
        constraints: "1..120 chars, required"
      - name: consent_states
        type: array
        source: input
        description: "Explicit enum set a subscriber's consent_state must be in to qualify"
        constraints: "non-empty subset of {PENDING, CONFIRMED, UNSUBSCRIBED}"
      - name: min_engagement_score
        type: integer
        source: input
        description: "Subscriber.engagement_score must be >= this value (inclusive)"
        constraints: "0..100"
      - name: max_days_since_open
        type: integer
        source: input
        description: "When non-null, Subscriber.last_opened_at must be non-null and (now - last_opened_at) in whole days must be <= this value"
        default: null
        constraints: ">= 0 or null"
      - name: member_count
        type: integer
        source: computed
        description: "Size of the segment member set (calculation segment_member_set), recomputed on every read of the segment and on every campaign schedule"

  - name: Template
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning tenant"
      - name: name
        type: string
        source: input
        description: "Template display name"
        constraints: "1..120 chars, required"
      - name: subject
        type: string
        source: input
        description: "Default subject line"
        constraints: "1..200 chars, required"
      - name: html_body
        type: string
        source: input
        description: "HTML body; must embed the literal merge tag {{unsubscribe_url}} to be CAN-SPAM compliant"
        constraints: "1..5000 chars, required"
      - name: has_unsubscribe_link
        type: boolean
        source: computed
        description: "true iff the literal substring '{{unsubscribe_url}}' occurs in html_body"
      - name: status
        type: enum
        source: system
        description: "DRAFT until published; PUBLISHED is terminal (templates are never edited in place)"
        default: "DRAFT"
        constraints: "one of DRAFT, PUBLISHED"

  - name: Campaign
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning tenant"
      - name: audience_id
        type: string
        source: input
        description: "FK -> Audience.id; the list this campaign targets"
      - name: segment_id
        type: string
        source: input
        description: "FK -> Segment.id; optional narrowing filter, must belong to audience_id"
        default: null
      - name: template_id
        type: string
        source: input
        description: "FK -> Template.id; must belong to account_id"
      - name: created_by_user_id
        type: string
        source: system
        description: "FK -> AccountUser.id; stamped from X-User-ID of the CampaignAuthor who created the campaign"
      - name: approved_by_user_id
        type: string
        source: system
        description: "FK -> AccountUser.id; stamped from X-User-ID on APPROVE, cleared to null on REQUEST_CHANGES"
        default: null
      - name: name
        type: string
        source: input
        description: "Campaign display name"
        constraints: "1..120 chars, required"
      - name: status
        type: enum
        source: system
        description: "Campaign lifecycle state"
        default: "DRAFT"
        constraints: "one of DRAFT, IN_REVIEW, APPROVED, SCHEDULED, SENDING, SENT, CANCELLED"
      - name: ab_test_enabled
        type: boolean
        source: input
        description: "When true the recipient snapshot is split between variant labels A and B"
        default: false
      - name: variant_split_pct
        type: integer
        source: input
        description: "Percentage of the recipient snapshot assigned to variant A when ab_test_enabled"
        default: 50
        constraints: "1..99"
      - name: variant_b_subject
        type: string
        source: input
        description: "Subject line used for variant-B sends; required when ab_test_enabled is true"
        default: null
      - name: pinned_subject
        type: string
        source: system
        description: "Snapshot of Template.subject taken at APPROVE; cleared to null on REQUEST_CHANGES"
        default: null
      - name: pinned_html_body
        type: string
        source: system
        description: "Snapshot of Template.html_body taken at APPROVE; cleared to null on REQUEST_CHANGES"
        default: null
      - name: pinned_template_version
        type: integer
        source: system
        description: "Snapshot of Template.version taken at APPROVE; cleared to null on REQUEST_CHANGES"
        default: null
      - name: review_note
        type: string
        source: system
        description: "Last reviewer note supplied on POST /campaigns/{id}/review"
        default: null
      - name: scheduled_at
        type: datetime
        source: input
        description: "Logical-clock instant at which the campaign should be dispatched; set on schedule, retained on cancel"
        default: null
      - name: send_window_minutes
        type: integer
        source: input
        description: "Length of the send window; the campaign occupies the half-open interval [scheduled_at, scheduled_at + send_window_minutes)"
        default: null
        constraints: "1..1440"
      - name: recipient_snapshot_ids
        type: array
        source: computed
        description: "Ordered Subscriber ids frozen at schedule (calculation campaign_recipient_snapshot); the exact list Sends are minted from at dispatch"
      - name: recipient_count
        type: integer
        source: computed
        description: "len(recipient_snapshot_ids); 0 before the campaign is scheduled"
        default: 0
      - name: reserved_credit_count
        type: integer
        source: system
        description: "Send credits held by this campaign: set to recipient_count on schedule, reset to 0 on cancel, retained on SENT"
        default: 0
      - name: send_charge_cents
        type: integer
        source: computed
        description: "Money charge for this dispatch (calculation campaign_send_charge_cents), frozen at schedule; 0 before scheduling"
        default: 0
      - name: winning_variant
        type: enum
        source: system
        description: "A/B winner recorded by POST /campaigns/{id}/select-winner"
        default: null
        constraints: "one of A, B, or null"
      - name: winner_selected_at
        type: datetime
        source: system
        description: "Logical-clock instant the winner was recorded; null until then"
        default: null

  - name: Send
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: system
        description: "FK -> Campaign.id; non-null for campaign sends, null for journey sends"
        default: null
      - name: journey_id
        type: string
        source: system
        description: "FK -> Journey.id; non-null for journey EMAIL-step sends, null for campaign sends"
        default: null
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; the recipient"
      - name: variant_label
        type: enum
        source: system
        description: "A or B for A/B campaign sends; null for non-A/B campaign sends and for journey sends"
        default: null
        constraints: "one of A, B, or null"
      - name: delivery_status
        type: enum
        source: system
        description: "Delivery dimension. Terminal set: {DELIVERED, HARD_BOUNCED, SUPPRESSED, COMPLAINED, CANCELLED}. SOFT_BOUNCED is non-terminal."
        default: "QUEUED"
        constraints: "one of QUEUED, DELIVERED, SOFT_BOUNCED, HARD_BOUNCED, SUPPRESSED, COMPLAINED, CANCELLED"
      - name: engagement_status
        type: enum
        source: system
        description: "Engagement dimension, advances independently of delivery_status"
        default: "NOT_OPENED"
        constraints: "one of NOT_OPENED, OPENED, CLICKED"
      - name: soft_bounce_count
        type: integer
        source: system
        description: "Number of SOFT_BOUNCE events seen; the 3rd one escalates delivery_status to HARD_BOUNCED"
        default: 0
      - name: open_count
        type: integer
        source: system
        description: "Number of OPEN events applied to this send"
        default: 0
      - name: click_count
        type: integer
        source: system
        description: "Number of CLICK events applied to this send"
        default: 0
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant delivery_status became DELIVERED; drives the ROLLING_90D engagement window"
        default: null
      - name: first_opened_at
        type: datetime
        source: system
        description: "Logical-clock instant of the first OPEN event"
        default: null
      - name: last_clicked_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent CLICK event"
        default: null

  - name: SuppressionEntry
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; suppression is account-wide, spanning every audience of the tenant"
      - name: email
        type: string
        source: system
        description: "The suppressed address; no further Subscriber with this email may be created in any audience of the account"
      - name: reason
        type: enum
        source: system
        description: "Why the address entered the suppression list"
        constraints: "one of UNSUBSCRIBE, HARD_BOUNCE, COMPLAINT"

  - name: Journey
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning tenant"
      - name: audience_id
        type: string
        source: input
        description: "FK -> Audience.id; only subscribers of this list may enroll"
      - name: name
        type: string
        source: input
        description: "Journey display name"
        constraints: "1..120 chars, required"
      - name: trigger_event
        type: enum
        source: input
        description: "SUBSCRIBE_CONFIRMED enrolls a subscriber the moment consent_state becomes CONFIRMED; CAMPAIGN_CLICK enrolls on the first CLICK event applied to one of that subscriber's campaign sends"
        constraints: "one of SUBSCRIBE_CONFIRMED, CAMPAIGN_CLICK"
      - name: steps
        type: array
        source: input
        description: "Ordered step objects { step_index, kind, wait_hours?, template_id?, condition_min_score?, on_true_step_index?, on_false_step_index? }; kind is one of WAIT, EMAIL, CONDITION"
        constraints: "1..10 elements; step_index values are 0..n-1 in ascending order; every on_true_step_index / on_false_step_index must be strictly greater than its own step_index"
      - name: status
        type: enum
        source: system
        description: "Journey lifecycle state"
        default: "DRAFT"
        constraints: "one of DRAFT, ACTIVE, PAUSED"
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "count(JourneyEnrollment WHERE journey_id == this.id AND status == ACTIVE)"
      - name: entered_count
        type: integer
        source: computed
        description: "count(JourneyEnrollment WHERE journey_id == this.id) across every status"

  - name: JourneyEnrollment
    parent: Journey
    common_fields: true
    fields:
      - name: journey_id
        type: string
        source: system
        description: "FK -> Journey.id; the automation this subscriber entered"
      - name: subscriber_id
        type: string
        source: system
        description: "FK -> Subscriber.id; the enrolled contact"
      - name: status
        type: enum
        source: system
        description: "Enrollment lifecycle state"
        default: "ACTIVE"
        constraints: "one of ACTIVE, COMPLETED, SUPPRESSED"
      - name: current_step_index
        type: integer
        source: system
        description: "Index into Journey.steps that will be executed on the next due advance"
        default: 0
      - name: next_action_at
        type: datetime
        source: system
        description: "Logical-clock instant at or after which POST /_ops/run may advance this enrollment"
      - name: enrolled_at
        type: datetime
        source: system
        description: "Logical-clock instant the enrollment was created"

  - name: BillingCycle
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; the billed tenant"
      - name: period_start
        type: datetime
        source: system
        description: "Inclusive start of the billing period"
      - name: period_end
        type: datetime
        source: system
        description: "Exclusive end of the billing period; always period_start + BILLING_PERIOD_DAYS"
      - name: status
        type: enum
        source: system
        description: "OPEN while accruing snapshots; CLOSED once charged"
        default: "OPEN"
        constraints: "one of OPEN, CLOSED"
      - name: peak_contact_count
        type: integer
        source: computed
        description: "Maximum of Account.billable_contact_count over every snapshot taken into this cycle (calculation billable_contact_count, variant PEAK_CYCLE)"
        default: 0
      - name: tier_applied
        type: enum
        source: system
        description: "Account.plan_tier frozen at close time"
        default: null
        constraints: "one of FREE, ESSENTIALS, STANDARD, PREMIUM, or null while OPEN"
      - name: base_fee_cents
        type: integer
        source: computed
        description: "PLAN_BASE_FEE_CENTS[tier_applied]; 0 while OPEN"
        default: 0
      - name: overage_cents
        type: integer
        source: computed
        description: "Overage charge (calculation tiered_contact_billing); 0 while OPEN"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "base_fee_cents + overage_cents; 0 while OPEN"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the cycle was closed; null while OPEN"
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Subscriber
    initial_state: PENDING
    terminal_states: [CLEANED, ARCHIVED]
    note: "consent_state dimension. Single-opt-in audiences (double_optin_required == false) mint the subscriber straight into CONFIRMED via the system transition below."
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /audiences/{id}/subscribers or POST /audiences/{id}/import-jobs on an audience whose double_optin_required == false (system, applied inside the create request)"
        actor: system
        preconditions:
          - "Audience.double_optin_required == false"
        side_effects:
          - "consent_confirmed_at := clock now; confirmation_token := null"
          - "Audience.subscriber_count recomputed"
          - "because Audience.subscriber_count changed, Account.billable_contact_count recomputed"
          - "for every Journey with status == ACTIVE, audience_id == this.audience_id and trigger_event == SUBSCRIBE_CONFIRMED that has no ACTIVE JourneyEnrollment for this subscriber: create JourneyEnrollment(status=ACTIVE, current_step_index=0, next_action_at=now, enrolled_at=now)"
          - "because a JourneyEnrollment was created, Journey.active_enrollment_count and Journey.entered_count recomputed"

      - from: PENDING
        to: CONFIRMED
        trigger: "POST /subscribers/{id}/confirm"
        actor: Anonymous
        preconditions:
          - "consent_state == PENDING"
          - "body confirmation_token == Subscriber.confirmation_token (else ERR_INVALID_CONFIRMATION_TOKEN)"
          - "clock now < Subscriber.created_at + CONFIRMATION_TOKEN_TTL_HOURS (else ERR_CONFIRMATION_EXPIRED; the subscriber remains PENDING)"
        side_effects:
          - "consent_confirmed_at := clock now; confirmation_token := null"
          - "Audience.subscriber_count unchanged (PENDING already counted)"
          - "for every Journey with status == ACTIVE, audience_id == this.audience_id and trigger_event == SUBSCRIBE_CONFIRMED that has no ACTIVE JourneyEnrollment for this subscriber: create JourneyEnrollment(status=ACTIVE, current_step_index=0, next_action_at=now, enrolled_at=now)"
          - "because a JourneyEnrollment was created, Journey.active_enrollment_count and Journey.entered_count recomputed"

      - from: PENDING
        to: ARCHIVED
        trigger: "POST /_ops/run step 1 (system): clock now >= Subscriber.created_at + CONFIRMATION_TOKEN_TTL_HOURS"
        actor: system
        preconditions:
          - "consent_state == PENDING"
          - "clock now >= created_at + CONFIRMATION_TOKEN_TTL_HOURS"
        side_effects:
          - "confirmation_token := null"
          - "Audience.subscriber_count recomputed (drops by 1)"
          - "because Audience.subscriber_count changed, Account.billable_contact_count recomputed"

      - from: PENDING
        to: UNSUBSCRIBED
        trigger: "POST /subscribers/{id}/unsubscribe"
        actor: Anonymous
        preconditions:
          - "consent_state IN {PENDING, CONFIRMED}"
          - "body unsubscribe_token == Subscriber.unsubscribe_token (else ERR_INVALID_UNSUBSCRIBE_TOKEN)"
        side_effects:
          - "unsubscribed_at := clock now"
          - "create SuppressionEntry(account_id=Audience.account_id, email=Subscriber.email, reason=UNSUBSCRIBE) unless an entry with the same (account_id, email) already exists"
          - "Audience.subscriber_count unchanged (UNSUBSCRIBED still counts as a billable contact)"

      - from: CONFIRMED
        to: UNSUBSCRIBED
        trigger: "POST /subscribers/{id}/unsubscribe"
        actor: Anonymous
        preconditions:
          - "consent_state IN {PENDING, CONFIRMED}"
          - "body unsubscribe_token == Subscriber.unsubscribe_token (else ERR_INVALID_UNSUBSCRIBE_TOKEN)"
        side_effects:
          - "unsubscribed_at := clock now"
          - "create SuppressionEntry(account_id=Audience.account_id, email=Subscriber.email, reason=UNSUBSCRIBE) unless an entry with the same (account_id, email) already exists"
          - "Audience.subscriber_count unchanged (UNSUBSCRIBED still counts as a billable contact)"
        note: "Enrollments are NOT touched here. An ACTIVE JourneyEnrollment for this subscriber is retired lazily, on its next due advance inside POST /_ops/run, by the cross-entity precondition on JourneyEnrollment.ACTIVE_to_SUPPRESSED."

      - from: CONFIRMED
        to: UNSUBSCRIBED
        trigger: "POST /_events/emit { kind: COMPLAINT } on one of this subscriber's sends (system)"
        actor: system
        preconditions:
          - "the send's delivery_status == DELIVERED"
        side_effects:
          - "unsubscribed_at := clock now"
          - "create SuppressionEntry(account_id, email, reason=COMPLAINT) unless an entry with the same (account_id, email) already exists"

      - from: CONFIRMED
        to: CLEANED
        trigger: "POST /_events/emit { kind: HARD_BOUNCE } on one of this subscriber's sends, or the 3rd SOFT_BOUNCE on one send (system)"
        actor: system
        preconditions:
          - "the send's delivery_status became HARD_BOUNCED as a result of the event"
        side_effects:
          - "create SuppressionEntry(account_id, email, reason=HARD_BOUNCE) unless an entry with the same (account_id, email) already exists"
          - "Audience.subscriber_count recomputed (CLEANED is excluded from the count)"
          - "because Audience.subscriber_count changed, Account.billable_contact_count recomputed"

      - from: PENDING
        to: CLEANED
        trigger: "POST /_events/emit { kind: HARD_BOUNCE } on one of this subscriber's sends (system)"
        actor: system
        preconditions:
          - "the send's delivery_status became HARD_BOUNCED as a result of the event"
        side_effects:
          - "create SuppressionEntry(account_id, email, reason=HARD_BOUNCE) unless an entry with the same (account_id, email) already exists"
          - "Audience.subscriber_count recomputed; Account.billable_contact_count recomputed"

      - from: CONFIRMED
        to: ARCHIVED
        trigger: "POST /import-jobs/{id}/rollback (system): this subscriber id is in ImportJob.created_subscriber_ids"
        actor: system
        preconditions:
          - "consent_state != ARCHIVED"
        side_effects:
          - "Audience.subscriber_count recomputed"
          - "because Audience.subscriber_count changed, Account.billable_contact_count recomputed"

      - from: UNSUBSCRIBED
        to: ARCHIVED
        trigger: "POST /import-jobs/{id}/rollback (system): this subscriber id is in ImportJob.created_subscriber_ids"
        actor: system
        preconditions:
          - "consent_state != ARCHIVED"
        side_effects:
          - "Audience.subscriber_count recomputed; Account.billable_contact_count recomputed"

  - entity: ImportJob
    initial_state: PENDING
    terminal_states: [REJECTED, ROLLED_BACK]
    note: "Branching machine. The POST that creates the job runs the row loop synchronously and lands the job in exactly one of COMPLETED / PARTIAL / REJECTED before responding."
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /audiences/{id}/import-jobs (system, same request)"
        actor: system
        preconditions:
          - "accepted_count == row_count"
        side_effects:
          - "created_subscriber_ids populated in row order; each new Subscriber stamped consent_source=IMPORT"
          - "Audience.subscriber_count recomputed; Account.billable_contact_count recomputed"
          - "increments Audience.version by 1"

      - from: PENDING
        to: PARTIAL
        trigger: "POST /audiences/{id}/import-jobs (system, same request)"
        actor: system
        preconditions:
          - "0 < accepted_count < row_count"
        side_effects:
          - "created_subscriber_ids populated in row order"
          - "Audience.subscriber_count recomputed; Account.billable_contact_count recomputed"
          - "increments Audience.version by 1"

      - from: PENDING
        to: REJECTED
        trigger: "POST /audiences/{id}/import-jobs (system, same request)"
        actor: system
        preconditions:
          - "accepted_count == 0 and row_count >= 1"
        side_effects:
          - "created_subscriber_ids := []; no Subscriber is created"
          - "increments Audience.version by 1"

      - from: COMPLETED
        to: ROLLED_BACK
        trigger: "POST /import-jobs/{id}/rollback"
        actor: CampaignAuthor
        preconditions:
          - "status IN {COMPLETED, PARTIAL} (else ERR_IMPORT_NOT_ROLLBACKABLE)"
          - "no Send exists whose subscriber_id is in created_subscriber_ids (else ERR_IMPORT_NOT_ROLLBACKABLE)"
        side_effects:
          - "every Subscriber in created_subscriber_ids whose consent_state != ARCHIVED transitions to ARCHIVED"
          - "because those subscribers left the counted set, Audience.subscriber_count is recomputed from its formula"
          - "because Audience.subscriber_count changed, Account.billable_contact_count is recomputed from its formula"

      - from: PARTIAL
        to: ROLLED_BACK
        trigger: "POST /import-jobs/{id}/rollback"
        actor: CampaignAuthor
        preconditions:
          - "status IN {COMPLETED, PARTIAL} (else ERR_IMPORT_NOT_ROLLBACKABLE)"
          - "no Send exists whose subscriber_id is in created_subscriber_ids (else ERR_IMPORT_NOT_ROLLBACKABLE)"
        side_effects:
          - "every Subscriber in created_subscriber_ids whose consent_state != ARCHIVED transitions to ARCHIVED"
          - "Audience.subscriber_count recomputed from its formula"
          - "Account.billable_contact_count recomputed from its formula"

  - entity: Template
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /templates/{id}/publish"
        actor: CampaignAuthor
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "has_unsubscribe_link recomputed"
        note: "Publishing deliberately does NOT enforce the {{unsubscribe_url}} merge tag; the CAN-SPAM gate lives on campaign approval so that a non-compliant template is reachable in PUBLISHED state."

  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [SENT, CANCELLED]
    note: "Cyclic machine: IN_REVIEW -> DRAFT -> IN_REVIEW may repeat without bound. SENDING -> SENT is a compound bubble-up derived from the aggregate delivery_status of the campaign's child Sends."
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /campaigns/{id}/submit-review"
        actor: CampaignAuthor
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "acting AccountUser.account_id == Campaign.account_id (else ERR_CROSS_ACCOUNT_ACCESS)"
        side_effects:
          - "no field other than status/updated_at/version changes"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /campaigns/{id}/review { decision: APPROVE }"
        actor: ComplianceApprover
        preconditions:
          - "status == IN_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != Campaign.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Template(template_id).status == PUBLISHED (else ERR_TEMPLATE_NOT_PUBLISHED) -- cross-entity dependency Campaign -> Template"
          - "Template(template_id).has_unsubscribe_link == true (else ERR_MISSING_UNSUBSCRIBE_LINK)"
        side_effects:
          - "approved_by_user_id := X-User-ID; review_note := body note"
          - "pinned_subject := Template.subject; pinned_html_body := Template.html_body; pinned_template_version := Template.version"

      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /campaigns/{id}/review { decision: REQUEST_CHANGES }"
        actor: ComplianceApprover
        preconditions:
          - "status == IN_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != Campaign.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id := null; pinned_subject := null; pinned_html_body := null; pinned_template_version := null"
          - "review_note := body note"
        note: "Revision loop. The campaign may be resubmitted and re-reviewed any number of times."

      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /campaigns/{id}/schedule"
        actor: CampaignAuthor
        preconditions:
          - "status == APPROVED (else ERR_CAMPAIGN_NOT_APPROVED)"
          - "body expected_account_version == Account.version (else ERR_STALE_VERSION)"
          - "Account.status == ACTIVE (else ERR_ACCOUNT_SUSPENDED)"
          - "scheduled_at > clock now (else ERR_SCHEDULE_IN_PAST)"
          - "no other Campaign of the same audience_id with status IN {SCHEDULED, SENDING} sits within AUDIENCE_FATIGUE_BUFFER_HOURS of scheduled_at (else ERR_AUDIENCE_FATIGUE_CONFLICT)"
          - "the account's overlapping send-window recipient total stays <= Account.hourly_send_capacity (else ERR_SEND_CAPACITY_EXCEEDED)"
          - "recipient_count >= 1 (else ERR_EMPTY_RECIPIENT_SET)"
          - "Account.send_credit_balance >= recipient_count (else ERR_INSUFFICIENT_SEND_CREDITS)"
        side_effects:
          - "recipient_snapshot_ids := calculation campaign_recipient_snapshot; recipient_count := len(recipient_snapshot_ids)"
          - "send_charge_cents := calculation campaign_send_charge_cents"
          - "reserved_credit_count := recipient_count"
          - "Account.send_credit_balance -= recipient_count; Account.reserved_send_credits recomputed"
          - "increments Account.version by 1"

      - from: SCHEDULED
        to: SENDING
        trigger: "POST /_ops/run step 2 (system): scheduled_at <= clock now"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "scheduled_at <= clock now"
          - "Account.status == ACTIVE -- cross-entity dependency Campaign -> Account; a SUSPENDED account leaves the campaign in SCHEDULED and mints no Sends"
        side_effects:
          - "one Send per id in recipient_snapshot_ids, minted in snapshot order, campaign_id := this.id, journey_id := null"
          - "each Send.delivery_status := SUPPRESSED when its Subscriber.consent_state != CONFIRMED or the subscriber's email now matches a SuppressionEntry of the account; otherwise QUEUED"
          - "each Send.variant_label := A for the first floor(recipient_count * variant_split_pct / 100) snapshot positions and B for the rest when ab_test_enabled, else null"

      - from: SENDING
        to: SENT
        trigger: "system bubble-up: every Send of this campaign reached a terminal delivery_status"
        actor: system
        preconditions:
          - "status == SENDING"
          - "every Send with campaign_id == this.id has delivery_status IN {DELIVERED, HARD_BOUNCED, SUPPRESSED, COMPLAINED, CANCELLED}"
        side_effects:
          - "reserved_credit_count retained; Account.reserved_send_credits and Account.consumed_send_credits recomputed (the reservation moves from the reserved bucket to the consumed bucket, Account.send_credit_balance unchanged)"
        note: "Evaluated at the end of every POST /_ops/run dispatch and at the end of every POST /_events/emit that changes a Send's delivery_status. A SOFT_BOUNCED send is non-terminal and holds the campaign in SENDING."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: CampaignAuthor
        preconditions:
          - "status IN {SCHEDULED, SENDING} (else ERR_INVALID_STATE)"
          - "acting AccountUser.account_id == Campaign.account_id (else ERR_CROSS_ACCOUNT_ACCESS)"
        side_effects:
          - "no Send exists yet; reserved_credit_count -> 0"
          - "because reserved_credit_count dropped to 0, Account.send_credit_balance += the released amount and Account.reserved_send_credits is recomputed"
          - "increments Account.version by 1"

      - from: SENDING
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel"
        actor: CampaignAuthor
        preconditions:
          - "status IN {SCHEDULED, SENDING} (else ERR_INVALID_STATE)"
          - "acting AccountUser.account_id == Campaign.account_id (else ERR_CROSS_ACCOUNT_ACCESS)"
        side_effects:
          - "link 2: because the campaign became CANCELLED, every Send with campaign_id == this.id whose delivery_status IN {QUEUED, SOFT_BOUNCED} transitions to CANCELLED"
          - "link 3: because those Sends became CANCELLED, the campaign releases its whole reservation -- reserved_credit_count -> 0"
          - "link 4: because reserved_credit_count dropped to 0, Account.send_credit_balance += the released amount, Account.reserved_send_credits recomputed"
          - "increments Account.version by 1"
        note: "Already-terminal Sends (DELIVERED / HARD_BOUNCED / SUPPRESSED / COMPLAINED) are left untouched, but the FULL original reservation is still returned to the balance -- this is the stated compensation policy and is what keeps granted == balance + reserved + consumed."

  - entity: Send
    initial_state: QUEUED
    terminal_states: [DELIVERED, HARD_BOUNCED, SUPPRESSED, COMPLAINED, CANCELLED]
    note: "Two independent state dimensions on one row: delivery_status (below) and engagement_status (second block below). Neither dimension's transitions constrain the other's, except that engagement events require delivery_status == DELIVERED."
    transitions:
      - from: QUEUED
        to: DELIVERED
        trigger: "POST /_events/emit { kind: DELIVERED }"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status IN {QUEUED, SOFT_BOUNCED} (else ERR_INVALID_STATE)"
        side_effects:
          - "delivered_at := clock now"
          - "Account.sender_reputation_score recomputed"
          - "Subscriber.engagement_score, engagement_score_90d and engagement_state recomputed"
          - "if every Send of the parent Campaign is now terminal, the Campaign bubbles SENDING -> SENT"

      - from: SOFT_BOUNCED
        to: DELIVERED
        trigger: "POST /_events/emit { kind: DELIVERED } (retry succeeded)"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status IN {QUEUED, SOFT_BOUNCED}"
        side_effects:
          - "delivered_at := clock now"
          - "Account.sender_reputation_score recomputed; Subscriber engagement fields recomputed"
          - "if every Send of the parent Campaign is now terminal, the Campaign bubbles SENDING -> SENT"

      - from: QUEUED
        to: SOFT_BOUNCED
        trigger: "POST /_events/emit { kind: SOFT_BOUNCE }"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status IN {QUEUED, SOFT_BOUNCED} (else ERR_INVALID_STATE)"
          - "soft_bounce_count + 1 < SOFT_BOUNCE_ESCALATION_COUNT"
        side_effects:
          - "soft_bounce_count += 1"
          - "Account.sender_reputation_score recomputed"

      - from: SOFT_BOUNCED
        to: SOFT_BOUNCED
        trigger: "POST /_events/emit { kind: SOFT_BOUNCE } (2nd occurrence)"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status == SOFT_BOUNCED"
          - "soft_bounce_count + 1 < SOFT_BOUNCE_ESCALATION_COUNT"
        side_effects:
          - "soft_bounce_count += 1"
          - "Account.sender_reputation_score recomputed"

      - from: SOFT_BOUNCED
        to: HARD_BOUNCED
        trigger: "POST /_events/emit { kind: SOFT_BOUNCE } escalation (soft_bounce_count + 1 == SOFT_BOUNCE_ESCALATION_COUNT)"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status == SOFT_BOUNCED"
          - "soft_bounce_count + 1 >= SOFT_BOUNCE_ESCALATION_COUNT"
        side_effects:
          - "soft_bounce_count += 1"
          - "the full HARD_BOUNCED cascade below fires"

      - from: QUEUED
        to: HARD_BOUNCED
        trigger: "POST /_events/emit { kind: HARD_BOUNCE }"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status IN {QUEUED, SOFT_BOUNCED} (else ERR_INVALID_STATE)"
        side_effects:
          - "link 2: because this Send became HARD_BOUNCED, its Subscriber transitions to consent_state CLEANED and a SuppressionEntry(reason=HARD_BOUNCE) is created for (account_id, email)"
          - "link 3: because the Subscriber became CLEANED, Audience.subscriber_count is recomputed and drops"
          - "link 4: because Audience.subscriber_count changed, Account.billable_contact_count is recomputed and drops"
          - "Account.sender_reputation_score recomputed; if the account's hard-bounce rate crosses BOUNCE_SUSPENSION_HARD_RATE with at least BOUNCE_SUSPENSION_MIN_SENDS scored sends, Account.status := SUSPENDED and suspension_reason := HIGH_HARD_BOUNCE_RATE"
          - "if every Send of the parent Campaign is now terminal, the Campaign bubbles SENDING -> SENT"

      - from: DELIVERED
        to: COMPLAINED
        trigger: "POST /_events/emit { kind: COMPLAINT }"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status == DELIVERED (else ERR_INVALID_STATE)"
        side_effects:
          - "the Send's engagement_status is left exactly as it was -- the two dimensions do not constrain each other"
          - "the Subscriber transitions CONFIRMED -> UNSUBSCRIBED and a SuppressionEntry(reason=COMPLAINT) is created"
          - "Account.sender_reputation_score recomputed"

      - from: QUEUED
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel (system cascade)"
        actor: system
        preconditions:
          - "delivery_status IN {QUEUED, SOFT_BOUNCED}"
          - "the parent Campaign transitioned to CANCELLED"
        side_effects:
          - "the Send is excluded from every reputation and engagement denominator"

      - from: SOFT_BOUNCED
        to: CANCELLED
        trigger: "POST /campaigns/{id}/cancel (system cascade)"
        actor: system
        preconditions:
          - "delivery_status IN {QUEUED, SOFT_BOUNCED}"
          - "the parent Campaign transitioned to CANCELLED"
        side_effects:
          - "the Send is excluded from every reputation and engagement denominator"

  - entity: Send
    initial_state: NOT_OPENED
    terminal_states: [CLICKED]
    note: "engagement_status dimension -- the SECOND, independent state axis on the same Send row. It advances without reading or writing delivery_status beyond the DELIVERED gate, and a COMPLAINT that moves delivery_status to COMPLAINED leaves engagement_status untouched."
    transitions:
      - from: NOT_OPENED
        to: OPENED
        trigger: "POST /_events/emit { kind: OPEN }"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status == DELIVERED (else ERR_INVALID_STATE)"
        side_effects:
          - "open_count += 1; first_opened_at := clock now (first OPEN only)"
          - "Subscriber.last_opened_at := clock now; Subscriber.engagement_score, engagement_score_90d and engagement_state recomputed"

      - from: OPENED
        to: OPENED
        trigger: "POST /_events/emit { kind: OPEN } (repeat open)"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status == DELIVERED"
        side_effects:
          - "open_count += 1; first_opened_at unchanged; Subscriber.last_opened_at := clock now"

      - from: OPENED
        to: CLICKED
        trigger: "POST /_events/emit { kind: CLICK }"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status == DELIVERED (else ERR_INVALID_STATE)"
          - "engagement_status IN {OPENED, CLICKED} (else ERR_CLICK_WITHOUT_OPEN)"
        side_effects:
          - "click_count += 1; last_clicked_at := clock now; Subscriber.last_opened_at := clock now"
          - "Subscriber.engagement_score, engagement_score_90d and engagement_state recomputed"
          - "for every Journey with status == ACTIVE, audience_id == the send's subscriber's audience_id and trigger_event == CAMPAIGN_CLICK that has no ACTIVE JourneyEnrollment for this subscriber: create JourneyEnrollment(status=ACTIVE, current_step_index=0, next_action_at=now, enrolled_at=now)"

      - from: CLICKED
        to: CLICKED
        trigger: "POST /_events/emit { kind: CLICK } (repeat click)"
        actor: PlatformAdmin
        preconditions:
          - "delivery_status == DELIVERED"
          - "engagement_status IN {OPENED, CLICKED}"
        side_effects:
          - "click_count += 1; last_clicked_at := clock now"

  - entity: Journey
    initial_state: DRAFT
    terminal_states: []
    note: "Cyclic machine: ACTIVE <-> PAUSED may repeat without bound."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /journeys/{id}/activate"
        actor: CampaignAuthor
        preconditions:
          - "status IN {DRAFT, PAUSED} (else ERR_INVALID_STATE)"
          - "every step whose kind == EMAIL references a Template with status == PUBLISHED and account_id == Journey.account_id (else ERR_JOURNEY_TEMPLATE_INVALID)"
        side_effects:
          - "no enrollment is back-filled; only subscribers that confirm (or click) AFTER activation enroll"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /journeys/{id}/activate"
        actor: CampaignAuthor
        preconditions:
          - "status IN {DRAFT, PAUSED} (else ERR_INVALID_STATE)"
          - "every step whose kind == EMAIL references a Template with status == PUBLISHED and account_id == Journey.account_id (else ERR_JOURNEY_TEMPLATE_INVALID)"
        side_effects:
          - "ACTIVE enrollments become eligible for advancement again on the next POST /_ops/run; their next_action_at is NOT shifted"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /journeys/{id}/pause"
        actor: CampaignAuthor
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "no new JourneyEnrollment is created by any trigger while PAUSED"
          - "existing ACTIVE enrollments keep status ACTIVE but POST /_ops/run skips them"

  - entity: JourneyEnrollment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, SUPPRESSED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /_ops/run step 3 (system): Journey.status == ACTIVE and next_action_at <= clock now"
        actor: system
        preconditions:
          - "Journey.status == ACTIVE"
          - "next_action_at <= clock now"
          - "Subscriber.consent_state == CONFIRMED -- cross-entity dependency JourneyEnrollment -> Subscriber"
        side_effects:
          - "steps are executed from current_step_index onward: a WAIT step sets next_action_at := now + wait_hours, advances current_step_index by 1 and STOPS this enrollment for this run; an EMAIL step mints a Send(journey_id=Journey.id, campaign_id=null, subscriber_id, delivery_status=QUEUED, engagement_status=NOT_OPENED, variant_label=null), advances current_step_index by 1 and CONTINUES; a CONDITION step sets current_step_index := on_true_step_index when Subscriber.engagement_score >= condition_min_score else on_false_step_index and CONTINUES"
          - "journey EMAIL sends never touch Account.send_credit_balance -- they are included in the plan"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /_ops/run step 3 (system): current_step_index advanced past the last step"
        actor: system
        preconditions:
          - "Journey.status == ACTIVE"
          - "next_action_at <= clock now"
          - "Subscriber.consent_state == CONFIRMED"
          - "current_step_index >= len(Journey.steps) after executing the due steps"
        side_effects:
          - "Journey.active_enrollment_count recomputed"

      - from: ACTIVE
        to: SUPPRESSED
        trigger: "POST /_ops/run step 3 (system): the enrollment is due but its Subscriber is no longer CONFIRMED"
        actor: system
        preconditions:
          - "Journey.status == ACTIVE"
          - "next_action_at <= clock now"
          - "Subscriber.consent_state != CONFIRMED (UNSUBSCRIBED, CLEANED, ARCHIVED or PENDING)"
        side_effects:
          - "no Send is minted; the current step is not executed"
          - "Journey.active_enrollment_count recomputed"

  - entity: BillingCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /_ops/run step 5 (system): period_end <= clock now"
        actor: system
        preconditions:
          - "status == OPEN"
          - "period_end <= clock now"
        side_effects:
          - "tier_applied := Account.plan_tier; base_fee_cents := PLAN_BASE_FEE_CENTS[tier_applied]"
          - "overage_cents := calculation tiered_contact_billing over peak_contact_count; total_cents := base_fee_cents + overage_cents; closed_at := clock now"
          - "a fresh BillingCycle(status=OPEN, period_start=this.period_end, period_end=this.period_end + BILLING_PERIOD_DAYS, peak_contact_count=Account.billable_contact_count at close time) is created; the close-and-roll loop repeats until the OPEN cycle's period_end > clock now"

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /_events/emit (system threshold): hard-bounce rate crosses the deliverability breakpoint"
        actor: system
        preconditions:
          - "scored_sends >= BOUNCE_SUSPENSION_MIN_SENDS"
          - "hard_bounced_sends / scored_sends >= BOUNCE_SUSPENSION_HARD_RATE"
        side_effects:
          - "suspension_reason := HIGH_HARD_BOUNCE_RATE"
          - "POST /_ops/run step 2 stops dispatching this account's SCHEDULED campaigns; they remain SCHEDULED"
          - "POST /campaigns/{id}/schedule for this account is rejected with ERR_ACCOUNT_SUSPENDED"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` -- the only sanctioned mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: campaign-schedule-stale-account
    parent_entity: Account
    write_endpoint: "POST /campaigns/{id}/schedule"
    occ_field: "expected_account_version"
    description: |
      Scheduling a Campaign against an Account whose version has advanced since
      the client last observed it is rejected. Scheduling debits
      Account.send_credit_balance, so a client whose view of the account is stale
      may be reserving credits it no longer has. Two different APPROVED campaigns
      may each legitimately be scheduled, so the second request is not covered by
      any state precondition -- it is resolved by the stale-version check alone.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: import-create-stale-audience
    parent_entity: Audience
    write_endpoint: "POST /audiences/{id}/import-jobs"
    occ_field: "expected_audience_version"
    description: |
      Creating an ImportJob against an Audience whose version has advanced since
      the client last observed it is rejected. Every import mutates
      Audience.subscriber_count, and a second import of the same row set is a
      legitimate operation the product allows, so no state precondition rejects
      it -- only the stale-version check does. This catches the case where the
      client computed its row set from a subscriber_count that is no longer true.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: billable_contact_count
    trigger: "CURRENT: recomputed on every mutation that changes any Subscriber.consent_state of the account (create, confirm, unsubscribe, hard-bounce clean, PENDING expiry, import, import rollback). PEAK_CYCLE: sampled by POST /_ops/run step 4 into the OPEN BillingCycle."
    algorithm: aggregation
    formula: |
      # CURRENT (stored on Account.billable_contact_count)
      audience_count(A) = count(Subscriber
                                WHERE audience_id == A.id
                                  AND consent_state IN {PENDING, CONFIRMED, UNSUBSCRIBED})
      Account.billable_contact_count = sum(audience_count(A) for A in audiences of the account)

      # PEAK_CYCLE (stored on BillingCycle.peak_contact_count)
      # Every POST /_ops/run takes exactly one snapshot into the account's OPEN cycle:
      cycle.peak_contact_count = max(cycle.peak_contact_count, Account.billable_contact_count)
      # A cycle created at account creation starts at peak_contact_count = 0.
      # A cycle created by a close-and-roll starts at the account's billable count at close time.
    input_set: |
      Subscribers with consent_state IN {PENDING, CONFIRMED, UNSUBSCRIBED} are billable.
      CLEANED (hard-bounced) and ARCHIVED (expired opt-in, or rolled-back import) are NOT
      billable. UNSUBSCRIBED contacts DO remain billable -- they still occupy a list slot.
    constants:
      BILLING_PERIOD_DAYS: 30
    precision: "integer count, no rounding"
    variants:
      - name: CURRENT
        when: "read from Account.billable_contact_count; drives segment eligibility displays and the schedule-time recipient math"
        difference: "Instantaneous count at read time. Falls when a subscriber is CLEANED or ARCHIVED."
      - name: PEAK_CYCLE
        when: "read from BillingCycle.peak_contact_count; the ONLY variant the invoice uses"
        difference: "Monotone maximum over the cycle's snapshots. Never falls inside a cycle, so a list that grew to 13 and then collapsed to 0 is still billed on 13."

  - name: tiered_contact_billing
    trigger: "BillingCycle OPEN -> CLOSED inside POST /_ops/run step 5"
    algorithm: tiered_pricing
    formula: |
      tier            = Account.plan_tier                        # frozen into BillingCycle.tier_applied
      included        = PLAN_INCLUDED_CONTACTS[tier]
      discount        = PLAN_OVERAGE_DISCOUNT_PCT[tier]
      base_fee_cents  = PLAN_BASE_FEE_CENTS[tier]

      overage_contacts = max(0, BillingCycle.peak_contact_count - included)
      n_blocks         = ceil(overage_contacts / OVERAGE_BLOCK_SIZE)

      overage_cents = 0
      for i in 1 .. n_blocks:                                    # 1-indexed block position
          block_contacts = min(OVERAGE_BLOCK_SIZE,
                               overage_contacts - OVERAGE_BLOCK_SIZE * (i - 1))
          rate = 27.0  if i <= 2                                 # cents per contact
                 19.0  if 3 <= i <= 5
                 13.0  if i >= 6
          # ROUNDING ORDER IS PINNED: round EACH BLOCK to whole cents, THEN sum.
          # ("sum the raw block amounts, then round once" is the WRONG reading and
          #  produces a different invoice -- e.g. 195 vs 194 on peak 13, ESSENTIALS.)
          overage_cents += round_half_up(block_contacts * rate * (1 - discount), 0)

      total_cents = base_fee_cents + overage_cents
    input_set: "Exactly one input: BillingCycle.peak_contact_count (variant PEAK_CYCLE of billable_contact_count). Account.billable_contact_count at close time is NOT used."
    constants:
      OVERAGE_BLOCK_SIZE: 5
      PLAN_INCLUDED_CONTACTS: { FREE: 2, ESSENTIALS: 5, STANDARD: 10, PREMIUM: 25 }
      PLAN_BASE_FEE_CENTS: { FREE: 0, ESSENTIALS: 1300, STANDARD: 2000, PREMIUM: 29900 }
      PLAN_OVERAGE_DISCOUNT_PCT: { FREE: 0.00, ESSENTIALS: 0.10, STANDARD: 0.20, PREMIUM: 0.30 }
      OVERAGE_RATE_CENTS_BLOCK_1_2: 27.0
      OVERAGE_RATE_CENTS_BLOCK_3_5: 19.0
      OVERAGE_RATE_CENTS_BLOCK_6_PLUS: 13.0
    precision: "whole cents, round_half_up, applied ONCE PER BLOCK before summation"

  - name: campaign_send_charge_cents
    trigger: "Campaign APPROVED -> SCHEDULED (POST /campaigns/{id}/schedule); frozen onto Campaign.send_charge_cents"
    algorithm: tiered_pricing
    formula: |
      R = Campaign.recipient_count                      # from campaign_recipient_snapshot

      # STEP 1 -- volume tier keyed on the RECIPIENT COUNT
      per_email_rate = 2.8  if R <= 10
                       2.2  if 11 <= R <= 50
                       1.6  if R >= 51
      subtotal_raw = R * per_email_rate                 # fractional cents, NOT yet rounded

      # STEP 2 -- volume discount tier keyed on subtotal_raw (the PRE-SURCHARGE subtotal).
      #           This is the pinned evaluation order. The naive reading -- "the discount
      #           tier is keyed on the campaign TOTAL", where the total already includes
      #           the reputation surcharge -- is CIRCULAR and produces a different number
      #           (e.g. R=7, score=80: 21 cents pinned vs 20 cents naive).
      volume_discount_pct = 0.00  if subtotal_raw < 20
                            0.05  if 20 <= subtotal_raw < 40
                            0.10  if subtotal_raw >= 40
      discount_cents = round_half_up(subtotal_raw * volume_discount_pct, 0)

      # STEP 3 -- reputation surcharge, keyed on Account.sender_reputation_score,
      #           applied to the POST-DISCOUNT base.
      surcharge_pct = 0.00  if Account.sender_reputation_score >= 90
                      0.05  if 70 <= Account.sender_reputation_score < 90
                      0.20  if Account.sender_reputation_score < 70
      surcharge_cents = round_half_up((subtotal_raw - discount_cents) * surcharge_pct, 0)

      # STEP 4
      send_charge_cents = round_half_up(subtotal_raw, 0) - discount_cents + surcharge_cents
    input_set: "Campaign.recipient_count as frozen at schedule, and Account.sender_reputation_score as it stands at schedule time. Later reputation movements never re-price a scheduled campaign."
    constants:
      RATE_CENTS_1_10: 2.8
      RATE_CENTS_11_50: 2.2
      RATE_CENTS_51_PLUS: 1.6
      DISCOUNT_BREAK_LOW_CENTS: 20
      DISCOUNT_BREAK_HIGH_CENTS: 40
      DISCOUNT_PCT_MID: 0.05
      DISCOUNT_PCT_HIGH: 0.10
      SURCHARGE_PCT_GOOD: 0.00
      SURCHARGE_PCT_FAIR: 0.05
      SURCHARGE_PCT_POOR: 0.20
    precision: "whole cents, round_half_up, at each of the three pinned steps"

  - name: sender_reputation_score
    trigger: "Every POST /_events/emit that changes a Send.delivery_status"
    algorithm: weighted_scoring
    formula: |
      scored = [S for S in Sends of the account
                  if S.delivery_status IN {DELIVERED, SOFT_BOUNCED, HARD_BOUNCED, COMPLAINED}]
      n = len(scored)
      if n == 0:
          score = 100
      else:
          hard_pct      = 100 * count(scored, delivery_status == HARD_BOUNCED) / n
          complaint_pct = 100 * count(scored, delivery_status == COMPLAINED)  / n
          soft_pct      = 100 * count(scored, delivery_status == SOFT_BOUNCED) / n
          raw   = 100 - 2.0 * hard_pct - 3.0 * complaint_pct - 0.5 * soft_pct
          score = max(0, min(100, round_half_up(raw, 0)))

      # THRESHOLD TRIGGER (evaluated on the same event, after the score):
      hard_rate = count(scored, delivery_status == HARD_BOUNCED) / n   when n >= 1
      if n >= BOUNCE_SUSPENSION_MIN_SENDS and hard_rate >= BOUNCE_SUSPENSION_HARD_RATE:
          Account.status := SUSPENDED; Account.suspension_reason := HIGH_HARD_BOUNCE_RATE
      # `>=` on BOTH comparisons: exactly 4 scored sends with exactly 1 hard bounce
      # (rate 0.25) DOES suspend; 5 scored sends with 1 hard bounce (0.20) does NOT.
    input_set: "Sends of the account -- campaign sends AND journey sends -- whose delivery_status is in the scored set. QUEUED, SUPPRESSED and CANCELLED sends are excluded from both numerator and denominator."
    constants:
      HARD_BOUNCE_WEIGHT: 2.0
      COMPLAINT_WEIGHT: 3.0
      SOFT_BOUNCE_WEIGHT: 0.5
      BOUNCE_SUSPENSION_MIN_SENDS: 4
      BOUNCE_SUSPENSION_HARD_RATE: 0.25
      SOFT_BOUNCE_ESCALATION_COUNT: 3
    precision: "integer 0..100, round_half_up, clamped by max(0, min(100, .))"

  - name: subscriber_engagement_score
    trigger: "Every POST /_events/emit of kind DELIVERED, OPEN or CLICK on one of the subscriber's sends"
    algorithm: weighted_scoring
    formula: |
      # `window` selects the input set and is the ONLY difference between the two variants.
      sends   = [S for S in Sends WHERE subscriber_id == this.id
                                    AND delivery_status == DELIVERED
                                    AND (variant == LIFETIME
                                         or S.delivered_at >= now - ROLLING_WINDOW_DAYS days)]
      n = len(sends)
      if n == 0:
          score = 50                                   # neutral, unmeasured contact
      else:
          opens  = count(sends, engagement_status IN {OPENED, CLICKED})
          clicks = count(sends, engagement_status == CLICKED)
          open_rate  = opens  / n
          click_rate = clicks / n
          base = 100 * (OPEN_WEIGHT * open_rate + CLICK_WEIGHT * click_rate)

          last_open = max(S.first_opened_at for S in sends if S.first_opened_at is not null)
          days_since_open = floor((now - last_open) / 1 day)   if last_open exists else INF
          recency = 1.0  if days_since_open <= 30
                    0.8  if 30 < days_since_open <= 90
                    0.5  if days_since_open > 90 or last_open does not exist

          volume_bonus = min(10, max(0, n - 2) * 2)            # nested min/max

          score = max(0, min(100, round_half_up(base * recency + volume_bonus, 0)))

      engagement_state = NEW      if Subscriber.delivered_send_count == 0
                         ENGAGED  if engagement_score >= 70
                         DORMANT  if 40 <= engagement_score < 70
                         LAPSED   if engagement_score < 40
    input_set: "Only Sends with delivery_status == DELIVERED enter either variant. QUEUED, bounced, suppressed, complained and cancelled sends are excluded from numerator and denominator alike."
    constants:
      OPEN_WEIGHT: 0.4
      CLICK_WEIGHT: 0.6
      ROLLING_WINDOW_DAYS: 90
      VOLUME_BONUS_CAP: 10
      VOLUME_BONUS_PER_SEND: 2
      VOLUME_BONUS_FREE_SENDS: 2
    precision: "integer 0..100, round_half_up applied ONCE to (base * recency + volume_bonus)"
    variants:
      - name: LIFETIME
        when: "stored on Subscriber.engagement_score; drives engagement_state and every Segment.min_engagement_score comparison"
        difference: "Every DELIVERED send the subscriber ever received enters the input set, no matter how old."
      - name: ROLLING_90D
        when: "stored on Subscriber.engagement_score_90d; a read-only dashboard metric"
        difference: "Only sends with delivered_at >= now - 90 days enter the input set, and the recency term only sees opens inside that window. A contact who clicked 4 months ago and merely opened last week scores 70 LIFETIME but 40 ROLLING_90D on identical data."

  - name: segment_member_set
    trigger: "Read of Segment.member_count, and campaign_recipient_snapshot at POST /campaigns/{id}/schedule"
    algorithm: constraint_propagation
    formula: |
      members(SEG) = [ S for S in Subscriber WHERE S.audience_id == SEG.audience_id
                       AND S.consent_state IN SEG.consent_states
                       AND S.engagement_score >= SEG.min_engagement_score          # inclusive >=
                       AND ( SEG.max_days_since_open is null
                             OR ( S.last_opened_at is not null
                                  AND floor((now - S.last_opened_at) / 1 day) <= SEG.max_days_since_open ) ) ]
      Segment.member_count = len(members(SEG))
    input_set: "Subscribers of the segment's own audience only. CLEANED and ARCHIVED subscribers can never qualify because those values are not permitted in Segment.consent_states."
    constants: {}
    precision: "integer count"

  - name: campaign_recipient_snapshot
    trigger: "Campaign APPROVED -> SCHEDULED (POST /campaigns/{id}/schedule); frozen onto Campaign.recipient_snapshot_ids"
    algorithm: chronological
    formula: |
      pool = [ S for S in Subscriber WHERE S.audience_id == Campaign.audience_id
                                       AND S.consent_state == CONFIRMED ]
      if Campaign.segment_id is not null:
          pool = pool INTERSECT members(Segment(segment_id))      # calculation segment_member_set
      pool = [ S for S in pool
                 if no SuppressionEntry exists with
                    (account_id == Campaign.account_id AND email == S.email) ]

      # ORDERING IS OBSERVABLE (it decides A/B allocation and Send creation order):
      recipient_snapshot_ids = [ S.id for S in sort(pool, key = (S.created_at ASC, S.email ASC)) ]
      recipient_count        = len(recipient_snapshot_ids)
      # Sort key is created_at, tie-broken by email. Subscriber.id NEVER participates.

      # A/B ALLOCATION over that same order:
      if Campaign.ab_test_enabled:
          a_count = floor(recipient_count * Campaign.variant_split_pct / 100)
          positions [0 .. a_count-1] -> variant_label A
          positions [a_count .. recipient_count-1] -> variant_label B
      else:
          every position -> variant_label null

      if recipient_count == 0: reject with ERR_EMPTY_RECIPIENT_SET
    input_set: "Only consent_state == CONFIRMED subscribers of the campaign's audience. PENDING, UNSUBSCRIBED, CLEANED and ARCHIVED are excluded even when a Segment's consent_states would admit them -- the CONFIRMED filter is applied first and is not overridable."
    constants: {}
    precision: "integer count; floor() on the A/B split"

  - name: ab_test_winner
    trigger: "POST /campaigns/{id}/select-winner"
    algorithm: weighted_scoring
    formula: |
      for label in {A, B}:
          sends_L  = count(Send WHERE campaign_id == C.id AND variant_label == label
                                  AND delivery_status == DELIVERED)
          opens_L  = count(those sends WHERE engagement_status IN {OPENED, CLICKED})
          clicks_L = count(those sends WHERE engagement_status == CLICKED)

      # ELIGIBILITY (empty-pool fallback):
      if sends_A < AB_MIN_SAMPLE_PER_VARIANT
         or sends_B < AB_MIN_SAMPLE_PER_VARIANT
         or (opens_A + opens_B) < AB_MIN_TOTAL_OPENS:
          reject with ERR_INSUFFICIENT_AB_SAMPLE          # no winner is recorded

      # RANKING:
      click_rate_L = clicks_L / sends_L
      winner = the label with the strictly higher click_rate
      # TIE-BREAK 1: higher open_rate_L = opens_L / sends_L
      # TIE-BREAK 2: the label whose earliest Send has the smaller created_at
      #              (created_at ASC; Send.id NEVER participates)
      Campaign.winning_variant  := winner
      Campaign.winner_selected_at := clock now
    input_set: "Only DELIVERED sends of the campaign, partitioned by variant_label. Bounced, suppressed, complained, cancelled and still-queued sends are excluded from both the sample-size gate and the rates."
    constants:
      AB_MIN_SAMPLE_PER_VARIANT: 2
      AB_MIN_TOTAL_OPENS: 1
    precision: "exact rational comparison of click_rate; no rounding before comparison"

  - name: send_window_overlap_capacity
    trigger: "Campaign APPROVED -> SCHEDULED (POST /campaigns/{id}/schedule)"
    algorithm: interval_merge
    formula: |
      # RULE A -- AUDIENCE FATIGUE BUFFER (resource: Audience). Point-event geometry:
      # two campaigns on the SAME audience are treated as instants and must sit at
      # least AUDIENCE_FATIGUE_BUFFER_HOURS apart. Exactly-at-the-buffer is ALLOWED.
      for every other Campaign X with X.audience_id == C.audience_id
                                 and X.status IN {SCHEDULED, SENDING}:
          if abs(C.scheduled_at - X.scheduled_at) < AUDIENCE_FATIGUE_BUFFER_HOURS hours:
              reject with ERR_AUDIENCE_FATIGUE_CONFLICT       # `<` -- exactly 6h passes

      # RULE B -- ACCOUNT SEND-WINDOW CAPACITY (resource: Account). Half-open interval
      # geometry with AGGREGATE capacity: each campaign occupies
      # [scheduled_at, scheduled_at + send_window_minutes). Touching windows do NOT
      # overlap. Every campaign of the account whose window overlaps C's window
      # contributes its recipient_count to a shared budget.
      overlapping = [ X for X in Campaigns of C.account_id
                        if X.status IN {SCHEDULED, SENDING}
                        and X.scheduled_at < C.scheduled_at + C.send_window_minutes
                        and C.scheduled_at < X.scheduled_at + X.send_window_minutes ]
      if sum(X.recipient_count for X in overlapping) + C.recipient_count
         > Account.hourly_send_capacity:
          reject with ERR_SEND_CAPACITY_EXCEEDED             # `>` -- exactly-at-capacity passes

      # RULE A is evaluated BEFORE RULE B (priority 22 before priority 23 in §1.4).
    input_set: "Rule A scans campaigns of the same AUDIENCE with status IN {SCHEDULED, SENDING}. Rule B scans campaigns of the same ACCOUNT with status IN {SCHEDULED, SENDING}. DRAFT, IN_REVIEW, APPROVED, SENT and CANCELLED campaigns never occupy a window."
    constants:
      AUDIENCE_FATIGUE_BUFFER_HOURS: 6
    precision: "exact datetime arithmetic; whole minutes"

  - name: import_row_disposition
    trigger: "POST /audiences/{id}/import-jobs -- once per row, in array order"
    algorithm: chronological
    formula: |
      accepted = rejected = duplicate = suppressed = 0
      seen_in_batch = {}
      for row in rows:                                  # STRICTLY in array order
          # CHECK ORDER IS PINNED: format -> suppression -> duplicate.
          if '@' not in row.email:
              rejected += 1;  continue
          if a SuppressionEntry exists with (account_id == audience.account_id
                                             AND email == row.email):
              suppressed += 1; continue                 # suppression BEATS duplicate
          if row.email in seen_in_batch
             or a Subscriber with (audience_id, email) already exists in ANY consent_state:
              duplicate += 1;  continue
          create Subscriber(audience_id, email=row.email, first_name=row.first_name,
                            consent_source=IMPORT,
                            consent_state = CONFIRMED if audience.double_optin_required == false
                                            else PENDING)
          seen_in_batch.add(row.email); accepted += 1

      # ROW CONSERVATION INVARIANT (must hold on every job):
      #   accepted_count + rejected_count + duplicate_count + suppressed_count == row_count
      status = REJECTED   if accepted == 0
               COMPLETED  if accepted == row_count
               PARTIAL    otherwise
    input_set: "All rows of the request, in the order supplied. Prior ImportJobs of the same audience affect the outcome only through the Subscribers and SuppressionEntries they left behind."
    constants:
      IMPORT_MIN_ROWS: 1
      IMPORT_MAX_ROWS: 100
      CONFIRMATION_TOKEN_TTL_HOURS: 48
    precision: "integer counts"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the four declared roles; X-User-ID present for every role except Anonymous"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The claimed X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For the entity_backed roles (CampaignAuthor, ComplianceApprover), X-User-ID names an existing AccountUser whose user_role permits the claimed role: CAMPAIGN_AUTHOR permits CampaignAuthor, COMPLIANCE_APPROVER permits ComplianceApprover, DUAL permits both"
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "every endpoint whose roles list contains CampaignAuthor or ComplianceApprover"

  - priority: 4
    category: business_constraint
    check: "Request body schema: every required field present, enum values legal, integers within their declared ranges, `rows` length within 1..100, variant_b_subject present when ab_test_enabled is true, Journey.steps well-formed (1..10 elements, step_index 0..n-1 ascending)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: existence
    check: "Path resources resolve, left to right"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_AUDIENCE_NOT_FOUND | ERR_SUBSCRIBER_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_JOURNEY_NOT_FOUND | ERR_IMPORT_JOB_NOT_FOUND | ERR_SEND_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 6
    category: existence
    check: "Body foreign keys resolve: account_id, audience_id, template_id, segment_id, send_id"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_AUDIENCE_NOT_FOUND | ERR_TEMPLATE_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_SEND_NOT_FOUND"
    http_status: 404
    applies_to: "POST /audiences, POST /templates, POST /campaigns, POST /journeys, POST /_events/emit"

  - priority: 7
    category: auth
    check: "Multi-tenancy isolation: for CampaignAuthor and ComplianceApprover, the acting AccountUser.account_id must equal the account_id of every resource named in the path and the body (including Template.account_id and the audience's account). PlatformAdmin is exempt."
    error_id: ERR_CROSS_ACCOUNT_ACCESS
    http_status: 403
    applies_to: "every endpoint whose roles list contains CampaignAuthor or ComplianceApprover"

  - priority: 8
    category: auth
    check: "Segregation of duties: on POST /campaigns/{id}/review, X-User-ID must differ from Campaign.created_by_user_id. A DUAL user who authored the campaign is rejected here even though its user_role permits the ComplianceApprover header."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /campaigns/{id}/review"

  - priority: 9
    category: business_referential
    check: "Segment(segment_id).audience_id == Campaign.audience_id"
    error_id: ERR_SEGMENT_AUDIENCE_MISMATCH
    http_status: 422
    applies_to: "POST /campaigns"

  - priority: 10
    category: business_constraint
    check: "Optimistic concurrency: body expected_account_version == Account.version (POST /campaigns/{id}/schedule); body expected_audience_version == Audience.version (POST /audiences/{id}/import-jobs)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /campaigns/{id}/schedule, POST /audiences/{id}/import-jobs"

  - priority: 11
    category: state
    check: "The target resource is in a state from which the requested transition exists (generic guard: Template publish from non-DRAFT, Journey activate from ACTIVE, Journey pause from non-ACTIVE, Campaign submit-review from non-DRAFT, Campaign review from non-IN_REVIEW, Campaign cancel from a status outside {SCHEDULED, SENDING}, select-winner on a non-SENT campaign or a campaign that already has a winning_variant, delivery event on a Send whose delivery_status forbids it, engagement event on a Send that is not DELIVERED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 12
    category: state
    check: "POST /campaigns/{id}/schedule requires status == APPROVED"
    error_id: ERR_CAMPAIGN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /campaigns/{id}/schedule"

  - priority: 13
    category: state
    check: "POST /subscribers/{id}/unsubscribe requires consent_state IN {PENDING, CONFIRMED}"
    error_id: ERR_ALREADY_UNSUBSCRIBED
    http_status: 409
    applies_to: "POST /subscribers/{id}/unsubscribe"

  - priority: 14
    category: state
    check: "POST /import-jobs/{id}/rollback requires status IN {COMPLETED, PARTIAL} and requires that no Send references any subscriber in created_subscriber_ids"
    error_id: ERR_IMPORT_NOT_ROLLBACKABLE
    http_status: 409
    applies_to: "POST /import-jobs/{id}/rollback"

  - priority: 15
    category: state
    check: "The acting account's status must be ACTIVE"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 403
    applies_to: "POST /campaigns/{id}/schedule"

  - priority: 16
    category: business_safety
    check: "CAN-SPAM: on APPROVE, Template(template_id).status must be PUBLISHED"
    error_id: ERR_TEMPLATE_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /campaigns/{id}/review"

  - priority: 17
    category: business_safety
    check: "CAN-SPAM: on APPROVE, Template(template_id).has_unsubscribe_link must be true (the literal merge tag {{unsubscribe_url}} occurs in html_body)"
    error_id: ERR_MISSING_UNSUBSCRIBE_LINK
    http_status: 422
    applies_to: "POST /campaigns/{id}/review"

  - priority: 18
    category: business_safety
    check: "CAN-SPAM: a Subscriber may not be created with an email that matches a SuppressionEntry of the audience's account"
    error_id: ERR_EMAIL_SUPPRESSED
    http_status: 409
    applies_to: "POST /audiences/{id}/subscribers"

  - priority: 19
    category: business_safety
    check: "Consent token match: body confirmation_token == Subscriber.confirmation_token; body unsubscribe_token == Subscriber.unsubscribe_token"
    error_id: "ERR_INVALID_CONFIRMATION_TOKEN | ERR_INVALID_UNSUBSCRIBE_TOKEN"
    http_status: 403
    applies_to: "POST /subscribers/{id}/confirm, POST /subscribers/{id}/unsubscribe"

  - priority: 20
    category: business_constraint
    check: "A Subscriber with this email already exists in this audience (in any consent_state)"
    error_id: ERR_SUBSCRIBER_EXISTS
    http_status: 409
    applies_to: "POST /audiences/{id}/subscribers"

  - priority: 21
    category: business_temporal
    check: "Double-opt-in confirmation window: clock now < Subscriber.created_at + CONFIRMATION_TOKEN_TTL_HOURS (48h)"
    error_id: ERR_CONFIRMATION_EXPIRED
    http_status: 422
    applies_to: "POST /subscribers/{id}/confirm"

  - priority: 22
    category: business_temporal
    check: "scheduled_at must be strictly after the logical clock"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /campaigns/{id}/schedule"

  - priority: 23
    category: business_temporal
    check: "Audience fatigue buffer (calculation send_window_overlap_capacity, RULE A): no other campaign of the SAME audience with status IN {SCHEDULED, SENDING} sits strictly closer than 6 hours to scheduled_at"
    error_id: ERR_AUDIENCE_FATIGUE_CONFLICT
    http_status: 409
    applies_to: "POST /campaigns/{id}/schedule"

  - priority: 24
    category: business_constraint
    check: "Account send-window capacity (calculation send_window_overlap_capacity, RULE B): the recipient total across every ACCOUNT campaign whose half-open send window overlaps this one must not exceed Account.hourly_send_capacity"
    error_id: ERR_SEND_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /campaigns/{id}/schedule"

  - priority: 25
    category: business_constraint
    check: "Journey step graph: every EMAIL step references a PUBLISHED template of the same account"
    error_id: ERR_JOURNEY_TEMPLATE_INVALID
    http_status: 422
    applies_to: "POST /journeys/{id}/activate"

  - priority: 26
    category: business_constraint
    check: "Journey step graph: every on_true_step_index / on_false_step_index is strictly greater than its own step_index (forward-only, so no enrollment can loop)"
    error_id: ERR_JOURNEY_STEP_ORDER
    http_status: 422
    applies_to: "POST /journeys"

  - priority: 27
    category: business_constraint
    check: "A CLICK event may only be applied to a Send whose engagement_status is already OPENED or CLICKED"
    error_id: ERR_CLICK_WITHOUT_OPEN
    http_status: 422
    applies_to: "POST /_events/emit"

  - priority: 28
    category: business_constraint
    check: "select-winner requires Campaign.ab_test_enabled == true"
    error_id: ERR_AB_NOT_ENABLED
    http_status: 422
    applies_to: "POST /campaigns/{id}/select-winner"

  - priority: 29
    category: business_constraint
    check: "A/B sample gate (calculation ab_test_winner): sends_A >= 2 and sends_B >= 2 and (opens_A + opens_B) >= 1"
    error_id: ERR_INSUFFICIENT_AB_SAMPLE
    http_status: 422
    applies_to: "POST /campaigns/{id}/select-winner"

  - priority: 30
    category: business_constraint
    check: "The frozen recipient snapshot must contain at least one subscriber"
    error_id: ERR_EMPTY_RECIPIENT_SET
    http_status: 422
    applies_to: "POST /campaigns/{id}/schedule"

  - priority: 31
    category: business_fiscal
    check: "Account.send_credit_balance >= Campaign.recipient_count"
    error_id: ERR_INSUFFICIENT_SEND_CREDITS
    http_status: 402
    applies_to: "POST /campaigns/{id}/schedule"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # --- Accounts -----------------------------------------------------------
  - method: POST
    path: "/accounts"
    description: "Create a tenant. Also opens its first BillingCycle [clock now, clock now + 30d) with peak_contact_count = 0."
    roles: [PlatformAdmin]
    code: 201
    input: [name, "plan_tier?", "initial_send_credits?", "hourly_send_capacity?"]
    output: Account
    side_effects:
      - "granted_send_credits := initial_send_credits (default 0); send_credit_balance := granted_send_credits"
      - "creates the account's first BillingCycle with status OPEN"

  - method: GET
    path: "/accounts/{id}"
    description: "Read one account, including the computed credit buckets, billable_contact_count, sender_reputation_score and version (capture this before any OCC write)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{id}/users"
    description: "Create an operator of the account."
    roles: [PlatformAdmin]
    code: 201
    input: [email, user_role]
    output: AccountUser
    side_effects: []

  - method: GET
    path: "/accounts/{id}/users"
    description: "List the operators of an account (FK reverse-reachability for AccountUser.account_id)."
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AccountUser[]
    side_effects: []

  - method: GET
    path: "/accounts/{id}/billing-cycles"
    description: "List the account's billing cycles ordered by period_start ASC (FK reverse-reachability for BillingCycle.account_id)."
    roles: [PlatformAdmin, CampaignAuthor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BillingCycle[]
    side_effects: []

  - method: GET
    path: "/accounts/{id}/suppressions"
    description: "List the account-wide suppression list ordered by created_at ASC (FK reverse-reachability for SuppressionEntry.account_id)."
    roles: [PlatformAdmin, CampaignAuthor]
    code: 200
    input: ["email?", "reason?", "limit?", "offset?"]
    output: SuppressionEntry[]
    side_effects: []

  # --- Audiences ----------------------------------------------------------
  - method: POST
    path: "/audiences"
    description: "Create an audience (list)."
    roles: [PlatformAdmin, CampaignAuthor]
    code: 201
    input: [account_id, name, default_from_email, "double_optin_required?"]
    output: Audience
    side_effects: []

  - method: GET
    path: "/audiences/{id}"
    description: "Read one audience, including subscriber_count and version (capture this before the import OCC write)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: []
    output: Audience
    side_effects: []

  - method: GET
    path: "/audiences"
    description: "List audiences, filterable by account (FK reverse-reachability for Audience.account_id)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Audience[]
    side_effects: []

  # --- Subscribers --------------------------------------------------------
  - method: POST
    path: "/audiences/{id}/subscribers"
    description: "Add one contact. Lands in PENDING with a confirmation_token when the audience requires double opt-in, otherwise straight into CONFIRMED (which may fire SUBSCRIBE_CONFIRMED journey enrollments)."
    roles: [Anonymous, CampaignAuthor, PlatformAdmin]
    code: 201
    input: [email, consent_source, "first_name?"]
    output: Subscriber
    side_effects:
      - "mints unsubscribe_token, and confirmation_token when double_optin_required"
      - "recomputes Audience.subscriber_count and Account.billable_contact_count"
      - "may create JourneyEnrollment rows (single-opt-in audiences only)"

  - method: GET
    path: "/subscribers/{id}"
    description: "Read one contact, including confirmation_token, unsubscribe_token and both engagement-score variants."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: []
    output: Subscriber
    side_effects: []

  - method: GET
    path: "/subscribers"
    description: "List contacts ordered by created_at ASC, filterable by audience and state (FK reverse-reachability for Subscriber.audience_id)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: ["audience_id?", "consent_state?", "engagement_state?", "limit?", "offset?"]
    output: Subscriber[]
    side_effects: []

  - method: POST
    path: "/subscribers/{id}/confirm"
    description: "Double-opt-in confirmation. PENDING -> CONFIRMED."
    roles: [Anonymous]
    code: 200
    input: [confirmation_token]
    output: Subscriber
    side_effects:
      - "consent_confirmed_at := clock now; confirmation_token := null"
      - "may create JourneyEnrollment rows for ACTIVE SUBSCRIBE_CONFIRMED journeys on this audience"

  - method: POST
    path: "/subscribers/{id}/unsubscribe"
    description: "One-click unsubscribe from the {{unsubscribe_url}} merge tag. PENDING|CONFIRMED -> UNSUBSCRIBED."
    roles: [Anonymous, CampaignAuthor]
    code: 200
    input: [unsubscribe_token]
    output: Subscriber
    side_effects:
      - "creates SuppressionEntry(reason=UNSUBSCRIBE) for (account_id, email)"
      - "Audience.subscriber_count is unchanged -- UNSUBSCRIBED contacts stay billable"

  - method: GET
    path: "/subscribers/{id}/enrollments"
    description: "List this contact's journey enrollments (FK reverse-reachability for JourneyEnrollment.subscriber_id)."
    roles: [PlatformAdmin, CampaignAuthor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: JourneyEnrollment[]
    side_effects: []

  # --- Imports ------------------------------------------------------------
  - method: POST
    path: "/audiences/{id}/import-jobs"
    description: "Bulk-import rows into the audience. Runs the row loop synchronously (format -> suppression -> duplicate, in array order) and returns the job already in COMPLETED / PARTIAL / REJECTED. OCC-guarded on the audience."
    roles: [CampaignAuthor]
    code: 201
    input: [rows, expected_audience_version]
    output: ImportJob
    side_effects:
      - "creates one Subscriber per accepted row (consent_source = IMPORT)"
      - "recomputes Audience.subscriber_count and Account.billable_contact_count"
      - "increments Audience.version by 1"

  - method: GET
    path: "/audiences/{id}/import-jobs"
    description: "List the audience's import jobs ordered by created_at ASC (FK reverse-reachability for ImportJob.audience_id)."
    roles: [PlatformAdmin, CampaignAuthor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ImportJob[]
    side_effects: []

  - method: POST
    path: "/import-jobs/{id}/rollback"
    description: "Compensating action for an import: archives exactly the Subscribers listed in created_subscriber_ids and recomputes Audience.subscriber_count and Account.billable_contact_count from their formulas, restoring the pre-import contact count."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: ImportJob
    side_effects:
      - "each created Subscriber whose consent_state != ARCHIVED transitions to ARCHIVED"
      - "Audience.subscriber_count and Account.billable_contact_count recomputed"

  # --- Segments -----------------------------------------------------------
  - method: POST
    path: "/audiences/{id}/segments"
    description: "Create a dynamic segment over the audience."
    roles: [CampaignAuthor, PlatformAdmin]
    code: 201
    input: [name, consent_states, min_engagement_score, "max_days_since_open?"]
    output: Segment
    side_effects:
      - "member_count computed immediately from calculation segment_member_set"

  - method: GET
    path: "/audiences/{id}/segments"
    description: "List the audience's segments with a freshly recomputed member_count (FK reverse-reachability for Segment.audience_id)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: ["limit?", "offset?"]
    output: Segment[]
    side_effects:
      - "member_count recomputed on read"

  # --- Templates ----------------------------------------------------------
  - method: POST
    path: "/templates"
    description: "Create an email template in DRAFT. has_unsubscribe_link is computed from html_body and cannot be supplied."
    roles: [CampaignAuthor]
    code: 201
    input: [account_id, name, subject, html_body]
    output: Template
    side_effects: []

  - method: POST
    path: "/templates/{id}/publish"
    description: "DRAFT -> PUBLISHED. Deliberately does NOT enforce the {{unsubscribe_url}} merge tag; the CAN-SPAM gate lives on campaign approval."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: Template
    side_effects: []

  - method: GET
    path: "/templates/{id}"
    description: "Read one template."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: []
    output: Template
    side_effects: []

  - method: GET
    path: "/templates"
    description: "List templates, filterable by account (FK reverse-reachability for Template.account_id)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Template[]
    side_effects: []

  # --- Campaigns ----------------------------------------------------------
  - method: POST
    path: "/campaigns"
    description: "Create a campaign in DRAFT. created_by_user_id is stamped from X-User-ID."
    roles: [CampaignAuthor]
    code: 201
    input: [account_id, audience_id, template_id, name, "segment_id?", "ab_test_enabled?", "variant_split_pct?", "variant_b_subject?"]
    output: Campaign
    side_effects: []

  - method: GET
    path: "/campaigns/{id}"
    description: "Read one campaign, including recipient_count, reserved_credit_count, send_charge_cents, the pinned template snapshot and winning_variant."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/campaigns"
    description: "List campaigns ordered by created_at ASC (FK reverse-reachability for account_id, audience_id, segment_id, template_id, created_by_user_id and approved_by_user_id)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: ["account_id?", "audience_id?", "segment_id?", "template_id?", "created_by_user_id?", "approved_by_user_id?", "status?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []

  - method: POST
    path: "/campaigns/{id}/submit-review"
    description: "DRAFT -> IN_REVIEW."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/campaigns/{id}/review"
    description: "IN_REVIEW -> APPROVED (decision APPROVE, pins the template snapshot) or IN_REVIEW -> DRAFT (decision REQUEST_CHANGES, clears the pins). Segregation of duties: the approver may not be the campaign's author."
    roles: [ComplianceApprover]
    code: 200
    input: [decision, "note?"]
    output: Campaign
    side_effects:
      - "APPROVE: approved_by_user_id, pinned_subject, pinned_html_body, pinned_template_version set"
      - "REQUEST_CHANGES: approved_by_user_id and all three pins cleared to null"

  - method: POST
    path: "/campaigns/{id}/schedule"
    description: "APPROVED -> SCHEDULED. Freezes the recipient snapshot, prices the dispatch and reserves send credits. OCC-guarded on the account: expected_account_version must equal Account.version."
    roles: [CampaignAuthor]
    code: 200
    input: [scheduled_at, send_window_minutes, expected_account_version]
    output: Campaign
    side_effects:
      - "recipient_snapshot_ids, recipient_count, send_charge_cents, reserved_credit_count set"
      - "Account.send_credit_balance -= recipient_count; Account.reserved_send_credits recomputed"
      - "increments Account.version by 1"

  - method: POST
    path: "/campaigns/{id}/cancel"
    description: "SCHEDULED|SENDING -> CANCELLED. Cascades to the campaign's non-terminal Sends and returns the whole credit reservation to the account."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "every Send with delivery_status IN {QUEUED, SOFT_BOUNCED} -> CANCELLED"
      - "reserved_credit_count -> 0; Account.send_credit_balance += the released amount"
      - "increments Account.version by 1"

  - method: POST
    path: "/campaigns/{id}/select-winner"
    description: "Records the A/B winner on a SENT campaign (calculation ab_test_winner). Rejected when the sample gate is not met."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: Campaign
    side_effects:
      - "winning_variant and winner_selected_at set"

  # --- Sends --------------------------------------------------------------
  - method: GET
    path: "/sends/{id}"
    description: "Read one send, including both state dimensions, the bounce/open/click counters and delivered_at."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: []
    output: Send
    side_effects: []

  - method: GET
    path: "/sends"
    description: "List sends ordered by created_at ASC (FK reverse-reachability for Send.campaign_id, Send.journey_id and Send.subscriber_id)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: ["campaign_id?", "journey_id?", "subscriber_id?", "variant_label?", "delivery_status?", "engagement_status?", "limit?", "offset?"]
    output: Send[]
    side_effects: []

  # --- Journeys -----------------------------------------------------------
  - method: POST
    path: "/journeys"
    description: "Create an automation journey in DRAFT with its full step list."
    roles: [CampaignAuthor]
    code: 201
    input: [account_id, audience_id, name, trigger_event, steps]
    output: Journey
    side_effects: []

  - method: GET
    path: "/journeys/{id}"
    description: "Read one journey, including active_enrollment_count and entered_count."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: []
    output: Journey
    side_effects: []

  - method: GET
    path: "/journeys"
    description: "List journeys (FK reverse-reachability for Journey.account_id and Journey.audience_id)."
    roles: [PlatformAdmin, CampaignAuthor, ComplianceApprover]
    code: 200
    input: ["account_id?", "audience_id?", "status?", "limit?", "offset?"]
    output: Journey[]
    side_effects: []

  - method: POST
    path: "/journeys/{id}/activate"
    description: "DRAFT|PAUSED -> ACTIVE. Every EMAIL step must reference a PUBLISHED template of the same account."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: Journey
    side_effects: []

  - method: POST
    path: "/journeys/{id}/pause"
    description: "ACTIVE -> PAUSED. No new enrollments are created and POST /_ops/run skips existing ACTIVE enrollments while paused."
    roles: [CampaignAuthor]
    code: 200
    input: []
    output: Journey
    side_effects: []

  - method: GET
    path: "/journeys/{id}/enrollments"
    description: "List this journey's enrollments ordered by created_at ASC (FK reverse-reachability for JourneyEnrollment.journey_id)."
    roles: [PlatformAdmin, CampaignAuthor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: JourneyEnrollment[]
    side_effects: []

  # --- Test-driving endpoints (declared scaffold contract, /_ namespace) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-05-01T00:00:00Z; before any call to this endpoint the clock reads that instant and MUST NOT fall back to real wall-clock time. The clock may move forward or backward."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "no entity is mutated; only the logical clock moves"

  - method: POST
    path: "/_ops/run"
    description: "Advance the system epoch. Runs five phases in this pinned order: (1) archive PENDING subscribers whose confirmation window expired; (2) dispatch SCHEDULED campaigns whose scheduled_at <= now on ACTIVE accounts, in scheduled_at ASC order tie-broken by created_at ASC, minting one Send per snapshot position; (3) advance due ACTIVE journey enrollments on ACTIVE journeys, in enrollment created_at ASC order; (4) snapshot Account.billable_contact_count into every OPEN BillingCycle (peak := max(peak, current)); (5) close every OPEN BillingCycle whose period_end <= now and roll a fresh one forward, repeating until the OPEN cycle's period_end > now."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { subscribers_archived: integer, campaigns_dispatched: integer, sends_created: integer, enrollments_advanced: integer, billing_cycles_closed: integer }
    side_effects:
      - "Subscriber PENDING -> ARCHIVED; Campaign SCHEDULED -> SENDING with Send rows minted; JourneyEnrollment advanced / COMPLETED / SUPPRESSED with journey Send rows minted; BillingCycle snapshots and OPEN -> CLOSED"

  - method: POST
    path: "/_events/emit"
    description: "Inject an ESP delivery webhook against one Send. kind is one of DELIVERED, SOFT_BOUNCE, HARD_BOUNCE, COMPLAINT, OPEN, CLICK. Drives both Send state dimensions and every downstream cascade (subscriber cleaning, suppression, reputation, engagement, campaign bubble-up, CAMPAIGN_CLICK enrollments, account suspension)."
    roles: [PlatformAdmin]
    code: 200
    input: [send_id, kind]
    output: Send
    side_effects:
      - "Send.delivery_status and/or Send.engagement_status advance"
      - "Account.sender_reputation_score recomputed; Account may be SUSPENDED by the hard-bounce threshold"
      - "Subscriber consent and engagement fields recomputed; SuppressionEntry may be created"
      - "Campaign may bubble SENDING -> SENT"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing/unknown, or X-User-ID missing for a non-Anonymous role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The claimed role is not in the endpoint's roles list"
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "X-User-ID names no AccountUser, or that AccountUser's user_role does not permit the claimed X-User-Role"
  - id: ERR_CROSS_ACCOUNT_ACCESS
    http: 403
    condition: "A CampaignAuthor or ComplianceApprover touches a resource belonging to a different account than their own AccountUser.account_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewer's X-User-ID equals Campaign.created_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, illegal enum value, out-of-range integer, rows length outside 1..100, ab_test_enabled without variant_b_subject, or a malformed Journey.steps array"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No Account with the given id"
  - id: ERR_AUDIENCE_NOT_FOUND
    http: 404
    condition: "No Audience with the given id"
  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "No Subscriber with the given id"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "No Template with the given id"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "No Campaign with the given id"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "POST /campaigns names a segment_id that does not exist"
  - id: ERR_JOURNEY_NOT_FOUND
    http: 404
    condition: "No Journey with the given id"
  - id: ERR_IMPORT_JOB_NOT_FOUND
    http: 404
    condition: "No ImportJob with the given id"
  - id: ERR_SEND_NOT_FOUND
    http: 404
    condition: "POST /_events/emit names a send_id that does not exist, or GET /sends/{id} misses"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_account_version != Account.version on schedule, or expected_audience_version != Audience.version on import"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition does not exist from the resource's current state (generic guard, see validation priority 11)"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 403
    condition: "Scheduling a campaign on an Account whose status == SUSPENDED"
  - id: ERR_CAMPAIGN_NOT_APPROVED
    http: 409
    condition: "POST /campaigns/{id}/schedule on a campaign whose status != APPROVED"
  - id: ERR_ALREADY_UNSUBSCRIBED
    http: 409
    condition: "POST /subscribers/{id}/unsubscribe on a subscriber whose consent_state is not in {PENDING, CONFIRMED}"
  - id: ERR_SUBSCRIBER_EXISTS
    http: 409
    condition: "POST /audiences/{id}/subscribers with an email that already exists in that audience in any consent_state"
  - id: ERR_IMPORT_NOT_ROLLBACKABLE
    http: 409
    condition: "Rollback of an ImportJob whose status is not in {COMPLETED, PARTIAL}, or whose created subscribers already have Sends"
  - id: ERR_MISSING_UNSUBSCRIBE_LINK
    http: 422
    condition: "APPROVE on a campaign whose template's html_body does not contain the literal {{unsubscribe_url}} merge tag"
  - id: ERR_TEMPLATE_NOT_PUBLISHED
    http: 422
    condition: "APPROVE on a campaign whose template is still in DRAFT"
  - id: ERR_EMAIL_SUPPRESSED
    http: 409
    condition: "Creating a Subscriber whose email matches a SuppressionEntry of the audience's account"
  - id: ERR_SEGMENT_AUDIENCE_MISMATCH
    http: 422
    condition: "POST /campaigns where Segment.audience_id != the campaign's audience_id"
  - id: ERR_SCHEDULE_IN_PAST
    http: 422
    condition: "scheduled_at <= the logical clock"
  - id: ERR_AUDIENCE_FATIGUE_CONFLICT
    http: 409
    condition: "Another campaign of the same audience with status IN {SCHEDULED, SENDING} sits strictly less than 6 hours from scheduled_at"
  - id: ERR_CONFIRMATION_EXPIRED
    http: 422
    condition: "Confirming more than 48 hours after the subscriber was created"
  - id: ERR_INVALID_CONFIRMATION_TOKEN
    http: 403
    condition: "The confirmation_token in the body does not match the subscriber's"
  - id: ERR_INVALID_UNSUBSCRIBE_TOKEN
    http: 403
    condition: "The unsubscribe_token in the body does not match the subscriber's"
  - id: ERR_SEND_CAPACITY_EXCEEDED
    http: 409
    condition: "The recipient total across every overlapping half-open send window of the account exceeds Account.hourly_send_capacity"
  - id: ERR_EMPTY_RECIPIENT_SET
    http: 422
    condition: "The frozen recipient snapshot is empty (zero CONFIRMED, unsuppressed, in-segment subscribers)"
  - id: ERR_INSUFFICIENT_AB_SAMPLE
    http: 422
    condition: "select-winner where sends_A < 2, or sends_B < 2, or opens_A + opens_B == 0"
  - id: ERR_AB_NOT_ENABLED
    http: 422
    condition: "select-winner on a campaign whose ab_test_enabled == false"
  - id: ERR_JOURNEY_STEP_ORDER
    http: 422
    condition: "A Journey step's on_true_step_index or on_false_step_index is not strictly greater than its own step_index"
  - id: ERR_JOURNEY_TEMPLATE_INVALID
    http: 422
    condition: "Activating a journey whose EMAIL steps reference a non-PUBLISHED template, or a template of another account"
  - id: ERR_CLICK_WITHOUT_OPEN
    http: 422
    condition: "A CLICK event on a DELIVERED send whose engagement_status is still NOT_OPENED"
  - id: ERR_INSUFFICIENT_SEND_CREDITS
    http: 402
    condition: "Account.send_credit_balance < Campaign.recipient_count at schedule time"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Operator of the SaaS platform: provisions tenants and operators, drives the logical clock, the ops epoch and the ESP webhook simulator. Not scoped to any single account."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{id}/users"
      - "GET /accounts/{id}/users"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run"
      - "POST /_events/emit"
    shared_operations:
      - "GET /accounts/{id}"
      - "GET /accounts/{id}/billing-cycles"
      - "GET /accounts/{id}/suppressions"
      - "POST /audiences"
      - "GET /audiences/{id}"
      - "GET /audiences"
      - "POST /audiences/{id}/subscribers"
      - "GET /subscribers/{id}"
      - "GET /subscribers"
      - "GET /subscribers/{id}/enrollments"
      - "GET /audiences/{id}/import-jobs"
      - "POST /audiences/{id}/segments"
      - "GET /audiences/{id}/segments"
      - "GET /templates/{id}"
      - "GET /templates"
      - "GET /campaigns/{id}"
      - "GET /campaigns"
      - "GET /sends/{id}"
      - "GET /sends"
      - "GET /journeys/{id}"
      - "GET /journeys"
      - "GET /journeys/{id}/enrollments"

  - name: CampaignAuthor
    description: "Marketer inside one tenant. Builds audiences, imports contacts, writes templates and campaigns, schedules and cancels dispatches, and runs journeys. May never approve a campaign they authored."
    identity: "entity_backed:AccountUser"
    exclusive_operations:
      - "POST /audiences/{id}/import-jobs"
      - "POST /import-jobs/{id}/rollback"
      - "POST /templates"
      - "POST /templates/{id}/publish"
      - "POST /campaigns"
      - "POST /campaigns/{id}/submit-review"
      - "POST /campaigns/{id}/schedule"
      - "POST /campaigns/{id}/cancel"
      - "POST /campaigns/{id}/select-winner"
      - "POST /journeys"
      - "POST /journeys/{id}/activate"
      - "POST /journeys/{id}/pause"
    shared_operations:
      - "GET /accounts/{id}"
      - "GET /accounts/{id}/billing-cycles"
      - "GET /accounts/{id}/suppressions"
      - "POST /audiences"
      - "GET /audiences/{id}"
      - "GET /audiences"
      - "POST /audiences/{id}/subscribers"
      - "POST /subscribers/{id}/unsubscribe"
      - "GET /subscribers/{id}"
      - "GET /subscribers"
      - "GET /subscribers/{id}/enrollments"
      - "GET /audiences/{id}/import-jobs"
      - "POST /audiences/{id}/segments"
      - "GET /audiences/{id}/segments"
      - "GET /templates/{id}"
      - "GET /templates"
      - "GET /campaigns/{id}"
      - "GET /campaigns"
      - "GET /sends/{id}"
      - "GET /sends"
      - "GET /journeys/{id}"
      - "GET /journeys"
      - "GET /journeys/{id}/enrollments"

  - name: ComplianceApprover
    description: "Compliance officer inside one tenant. The only role that may decide a campaign review, and the CAN-SPAM gate (published template + {{unsubscribe_url}}) is enforced on their APPROVE."
    identity: "entity_backed:AccountUser"
    exclusive_operations:
      - "POST /campaigns/{id}/review"
    shared_operations:
      - "GET /accounts/{id}"
      - "GET /audiences/{id}"
      - "GET /audiences"
      - "GET /audiences/{id}/segments"
      - "GET /subscribers/{id}"
      - "GET /subscribers"
      - "GET /templates/{id}"
      - "GET /templates"
      - "GET /campaigns/{id}"
      - "GET /campaigns"
      - "GET /sends/{id}"
      - "GET /sends"
      - "GET /journeys/{id}"
      - "GET /journeys"

  - name: Anonymous
    description: "Unauthenticated visitor acting through a public signup form or a one-click link in a delivered email. Carries X-User-Role: Anonymous and no X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /subscribers/{id}/confirm"
    shared_operations:
      - "POST /audiences/{id}/subscribers"
      - "POST /subscribers/{id}/unsubscribe"
