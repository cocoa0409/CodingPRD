      - name: feed_degradation_fires_strictly_above_the_reject_rate_and_recovers_at_it
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.participant_quality_score.constants.FEED_DEGRADED_REJECT_RATE
          - state_machines.DataFeed.MONITORED_to_DEGRADED
          - state_machines.DataFeed.DEGRADED_to_MONITORED
          - entities.DataFeed.fields.latest_reject_rate
        distinguishing_aspect: |
          The instantaneous trigger is a strict inequality on a 4-decimal rate: 100/2000 = 0.0500 is NOT
          greater than FEED_DEGRADED_REJECT_RATE and leaves the feed MONITORED with a null status_reason,
          while a single extra rejected message (101/2000 = 0.0505) moves it to DEGRADED with
          status_reason REJECT_RATE_BREACH, and a subsequent sample back at exactly 0.0500 restores
          MONITORED and clears status_reason. The three samples occupy adjacent, non-overlapping windows,
          so none of them is refused by the sample-window rule and every transition is caused only by the
          rate.
        test_recipe:
          setup:
            - "One participant is at CONFORMANCE_TESTING and has one PROVISIONING CCDA feed at version 1."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Foxglove Valley Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 60000, primary_contact_email: "hie@foxglove.example" }
              as: HieAdmin
              captures: { pH3_id: $.data.id }
