    output: null
    side_effects: []
  - method: GET
    path: "/athletics/seats/{id}"
    description: "Fetch one seat, including the version a picker must echo in expected_seat_version."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
