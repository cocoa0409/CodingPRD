      - name: cumulative_throughput_at_design_spends_the_charge_at_the_variance_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines[CatalystCharge.status].transitions[ACTIVE -> SPENT]
          - state_machines[CatalystCharge.status].transitions[ACTIVE -> DERATED].preconditions
          - calculations[catalyst_activity_decay]
        distinguishing_aspect: "Two thresholds are evaluated on the same completion and only one fires: 400.000 MT crosses the 300.0 MT design throughput so the charge goes SPENT, while a variance of exactly -2.000 sits on the 2.0 tolerance and does not derate (the check is a strict inequality)."
