          - "errors[ERR_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "Driver role may append duty events only where X-User-ID == path driver id: own id succeeds (201); another driver's id yields 403 ERR_OWNERSHIP_MISMATCH."
        test_recipe:
