            - "RateFiling.${filing_id}.reviewed_by_user_id == reg-1"

      - name: producer_suspension_then_reinstatement_cycles_back_to_appointed
        claim_type: valid_transition
        grounds:
          - state_machines.Producer.APPOINTED_to_SUSPENDED
          - state_machines.Producer.SUSPENDED_to_APPOINTED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The APPOINTED -> SUSPENDED -> APPOINTED cycle is repeatable and non-destructive: after reinstatement agreement_status is APPOINTED again with commission_rate_bps still 1000 and agreement_effective_date still 2026-08-01."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one APPOINTED STANDARD producer."
