            - "ScrapManifest.${man1_id}.tire_count == 1 and total_weight_lbs == 140"
            - "ScrapManifest.${man2_id}.tire_count == 0 and total_weight_lbs == 0"
            - "Casing.${casing_id}.scrap_manifest_id is still ${man1_id} and status is still \"REJECTED\""
            - "grade REJECT accrued nothing: GET /casing-credit-entries?casing_id=${casing_id} returns total_count == 0"

      - name: repeated_manifest_line_posts_accumulate_totals
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/scrap-manifests/{manifest_id}/lines
