              as: HousingManager
              captures: { hotelA_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotelA_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contractA_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contractA_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 20, arrival_date: "2026-09-08", departure_date: "2026-09-15", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { blockA_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts/${contractA_id}/negotiation"
              payload: { action: "SUBMIT" }
              as: HousingManager
            - call: "POST /housing/hotel-contracts/${contractA_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotelA_id}"
            - call: "POST /housing/hotels"
              payload: { name: "Riverfront Suites", city: "Metro", total_rooms: 100, distance_miles_from_venue: 6.0 }
              as: HousingManager
              captures: { hotelB_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotelB_id}", negotiated_nightly_rate_cents: 15900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contractB_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contractB_id}", room_type: "KING", block_size_rooms: 20, arrival_date: "2026-09-08", departure_date: "2026-09-15", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { blockB_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts/${contractB_id}/negotiation"
              payload: { action: "SUBMIT" }
              as: HousingManager
            - call: "POST /housing/hotel-contracts/${contractB_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotelB_id}"
            - call: "POST /housing/teams"
              payload: { name: "Riverside FC 16U", home_city: "Farville", home_state: "ST", org_contact_email: "riverside@example.com", distance_miles_from_venue: 120.0 }
              as: HousingManager
              captures: { team_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg_id: "$.data.id", reg_v1: "$.data.version" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${blockA_id}", rooms_requested: 1, check_in_date: "2026-09-10", check_out_date: "2026-09-12", expected_registration_version: "${reg_v1}" }
              as: HousingManager
              captures: { bk_first_id: "$.data.id" }
            - call: "GET /housing/team-registrations/${reg_id}"
              payload: {}
              as: HousingManager
              captures: { reg_v2: "$.data.version" }
          trigger:
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${blockB_id}", rooms_requested: 1, check_in_date: "2026-09-12", check_out_date: "2026-09-14", expected_registration_version: "${reg_v2}" }
              as: HousingManager
