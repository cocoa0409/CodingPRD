            - "the first POST /district-energy/connection-agreements/${cg_id}/activate returns HTTP 409 with error_id ERR_LOOP_ISOLATED"
            - "after the failed activate, ConnectionAgreement.${cg_id}.contract_state == PENDING_CAPACITY and NetworkLoop.${loop_g_id}.committed_reserved_kw == 0.0"
            - "POST /district-energy/work-orders/${woi_id}/complete response: WorkOrder.${woi_id}.work_state == COMPLETED"
            - "PipeSegment.${seg_g9_id}.leak_risk_score == 10.83"
            - "PipeSegment.${seg_g9_id}.condition == SOUND"
            - "PipeSegment.${seg_g9_id}.historical_leak_count == 0"
            - "NetworkLoop.${loop_g_id}.posture == NORMAL"
            - "NetworkLoop.${loop_g_id}.open_isolation_count == 0"
            - "the second POST /district-energy/connection-agreements/${cg_id}/activate returns HTTP 201 or 200 and ConnectionAgreement.${cg_id}.contract_state == ACTIVE"
            - "NetworkLoop.${loop_g_id}.committed_reserved_kw == 5000.0"

      - name: plan_optimize_blocked_when_bound_forecast_was_superseded
        grounds:
          - validations[priority=10]
          - errors[ERR_FORECAST_STATE_INVALID]
          - state_machines.LoadForecast.PUBLISHED_to_SUPERSEDED
          - state_machines.DispatchPlan.DRAFT_to_DRAFT
          - entities.DispatchPlan.fields.forecast_id
        distinguishing_aspect: |
          A different entity pair from the agreement-to-loop dependency: DispatchPlan to
          LoadForecast. The plan's own state stays DRAFT, but optimize requires the LoadForecast at
          plan.forecast_id to be PUBLISHED, so once a newer publish for the same loop_id and
          service_date pushes that forecast to SUPERSEDED the optimize call returns
          ERR_FORECAST_STATE_INVALID while a fresh plan bound to the surviving forecast optimizes
          successfully.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NetworkLoop LOOP-H (HEATING, rated_capacity_kw 5000.0), RateSchedule RS-U (UNIVERSITY), ACTIVE ConnectionAgreement CH1 (UNIVERSITY, reserved 1000.0)."
            - "One AVAILABLE ProductionAsset H_B (BIOMASS_BOILER, rated 1200.0, min_stable 50.0, cost 50.00, emission factor 25.0) on LOOP-H."
            - "LoadForecast FH1 for LOOP-H on 2026-08-07 PUBLISHED with coincident_demand_kw 756.00, then LoadForecast FH2 for the same loop and service_date PUBLISHED, which supersedes FH1."
            - "DispatchPlan PH1 in DRAFT bound to FH1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
