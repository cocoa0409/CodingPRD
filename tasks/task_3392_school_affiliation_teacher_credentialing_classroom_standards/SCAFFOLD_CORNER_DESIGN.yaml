              as_user_id: "${br_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /society/schools/${br_id}/brand"
              payload: { display_name: "Brand Montessori Inspired School", uses_method_name: true, descriptor: "Inspired" }
              as: SchoolAdmin
              as_user_id: "${br_id}"
              captures: { br_v2: $.data.version, br_ok: $.data.brand_compliant }
            - call: "POST /society/schools/${br_id}/brand"
              payload: { display_name: "Brand Montessori School", uses_method_name: true }
              as: SchoolAdmin
              as_user_id: "${br_id}"
              captures: { err2: $.data.error_id }
            - call: "GET /society/schools/${br_id}"
              payload: {}
              as: SocietyAdmin
              captures: { br_final_v: $.data.version, br_final_name: $.data.display_name }
          assert:
            - "err1 == ERR_BRAND_DIFFERENTIATION_REQUIRED (422): method name without descriptor"
            - "the compliant update succeeds: br_v2 == 2 (exactly one bump) and br_ok == true"
            - "err2 == ERR_BRAND_DIFFERENTIATION_REQUIRED (422): removing the descriptor re-breaks the rule"
            - "br_final_v == 2 and br_final_name == \"Brand Montessori Inspired School\" (rejected updates never mutate)"

