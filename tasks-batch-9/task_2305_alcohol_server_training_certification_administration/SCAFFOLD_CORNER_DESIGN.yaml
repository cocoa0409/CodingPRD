            - "${course_v2} == ${course_v1} + 1 (publication bumped the version)"
            - "the retry returns 200 with Course.${course_id}.contact_hours == 5, content_revision_count == 1, status == 'PUBLISHED' and version == ${course_v1} + 2"

      - name: occ_dram_shop_issuance_rejects_the_account_version_read_before_the_location_was_added
