# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2532: Project-Based Rental Assistance Contract Renewal
# Nine §0.5 Difficulty Rules x 2 differentiated instances = 18 instances.
# Every numeric literal in `assert:` was produced by executing the referenced
# calculations[].formula with Decimal/ROUND_HALF_UP, not estimated.
#
# Shared reference fixture used by most chains (state IL, OCAF factor 1.032):
#   Property: total_units 24, assisted_unit_count 20, published_fmr_cents 126000,
#             baseline_utility_allowance_cents 11500, has_fha_insured_mortgage false
#   HapContract: NEW_CONSTRUCTION, expiration_date 2027-12-31, term_months 12,
#             contract_rent 118000, debt_service 32000, opex 61000, reserve 4500,
#             authorized_hap_budget 30000000
#   Logical clock starts at 2026-08-01T00:00:00Z; chains that open a RenewalCase first
#   move it to 2026-12-01 (395 whole days to expiration, inside RENEWAL_WINDOW_DAYS 420).

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: renewal_rent_ocaf_track_versus_budget_based_track_on_identical_contract_data
        grounds:
          - calculations.renewal_rent_determination
          - calculations.ocaf_adjusted_rent
          - calculations.budget_based_rent
          - entities.RenewalCase.fields.adjustment_method
          - entities.RenewalCase.fields.approved_rent_per_unit_cents
          - validations[priority=70]
          - validations[priority=71]
        distinguishing_aspect: |
          Two HapContracts carrying byte-identical rent, debt-service, opex and reserve figures
          produce approved_rent_per_unit_cents 120752 under adjustment_method OCAF and 105300
          under BUDGET_BASED — a 15452-cent divergence decided solely by the elected variant,
          with each variant reading a different subset of the same stored columns (OCAF reads
          contract_rent minus debt service; BUDGET_BASED ignores contract_rent entirely).
        test_recipe:
          setup:
            - "One owner, one IL property, and two HapContracts A and B with identical financial inputs."
            - "Clock at 2026-12-01, so both contracts sit 395 days from expiration (inside the 420-day window)."
            - "Case A on contract A: OPTION_2_OCAF + OCAF, rcs_required false, no study needed."
            - "Case B on contract B: OPTION_2_OCAF + BUDGET_BASED, rcs_required true, one ACCEPTED study whose estimated_market_rent_cents is 130200."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_a_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_b_id: $.data.id }
            - call: "POST /pbra/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_a_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_a_id: $.data.id }
            - call: "POST /pbra/renewal-cases/${case_a_id}/select-option"
              payload: { renewal_option: "OPTION_2_OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/renewal-cases/${case_a_id}/elect-adjustment"
              payload: { adjustment_method: "OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_b_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_b_id: $.data.id }
            - call: "POST /pbra/renewal-cases/${case_b_id}/select-option"
              payload: { renewal_option: "OPTION_2_OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/renewal-cases/${case_b_id}/elect-adjustment"
              payload: { adjustment_method: "BUDGET_BASED" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies"
              payload: { renewal_case_id: "${case_b_id}", appraiser_name: "Hollis Appraisal Group" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { study_b_id: $.data.id }
            - call: "POST /pbra/comparables"
              payload: { study_id: "${study_b_id}", address_label: "88 Alder Court", raw_rent_cents: 125000, adjustment_total_cents: 4650, utility_adjustment_cents: 1500, weight: 3 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/comparables"
              payload: { study_id: "${study_b_id}", address_label: "12 Birch Lane", raw_rent_cents: 118000, adjustment_total_cents: 4100, utility_adjustment_cents: 1500, weight: 2 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/comparables"
              payload: { study_id: "${study_b_id}", address_label: "5 Cypress Way", raw_rent_cents: 133000, adjustment_total_cents: 5925, utility_adjustment_cents: 1500, weight: 1 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies/${study_b_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies/${study_b_id}/decide"
              payload: { decision: "ACCEPT" }
              as: ContractAdministrator
              as_user_id: "ca-reviewer-1"
          trigger:
            - call: "POST /pbra/renewal-cases/${case_a_id}/approve-rents"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { case_a_approved: $.data.approved_rent_per_unit_cents }
            - call: "POST /pbra/renewal-cases/${case_b_id}/approve-rents"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-approver-1"
              captures: { case_b_approved: $.data.approved_rent_per_unit_cents }
          assert:
            - "RenewalCase.${case_a_id}.ocaf_rent_per_unit_cents == 120752"
            - "RenewalCase.${case_a_id}.budget_rent_per_unit_cents == 105300"
            - "RenewalCase.${case_a_id}.approved_rent_per_unit_cents == 120752"
            - "RenewalCase.${case_a_id}.rcs_required == false"
            - "RenewalCase.${case_b_id}.ocaf_rent_per_unit_cents == 120752"
            - "RenewalCase.${case_b_id}.budget_rent_per_unit_cents == 105300"
            - "RenewalCase.${case_b_id}.rcs_required == true"
            - "RenewalCase.${case_b_id}.comparable_market_rent_cents == 130200"
            - "RenewalCase.${case_b_id}.approved_rent_per_unit_cents == 105300"
            - "${case_a_approved} - ${case_b_approved} == 15452"
            - "Both cases read identical HapContract columns; only adjustment_method differs."

      - name: special_claim_actual_chronological_versus_projected_estimate_on_identical_vacancy_length
        grounds:
          - calculations.special_claim_amount
          - entities.SpecialClaim.fields.valuation_variant
          - entities.SpecialClaim.fields.vacancy_days_claimed
          - entities.SpecialClaim.fields.computed_amount_cents
          - state_machines.SpecialClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Two VACANCY claims covering exactly 44 vacant days on the same contract diverge by
          40435 cents — 178888 for the settled claim, which walks January (31-day divisor,
          daily 3806), February (28-day divisor, daily 4214) and March, against 138453 for the
          still-vacant claim, which applies VACANCY_ESTIMATE_PCT 0.80 over a flat 30-day month
          and never touches the calendar. Variant selection is driven purely by whether
          vacancy_end_date is null, not by any client-supplied variant field.
        test_recipe:
          setup:
            - "One owner, one IL property, one HapContract with contract_rent_per_unit_cents 118000 and no executed renewal (renewed_rent_per_unit_cents null)."
            - "Two vacancy claims in unit 101 and unit 102, each covering 44 vacant days, one settled and one open."
            - "Clock at 2027-03-10 so both vacancy windows are in the past."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pbra/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: ContractAdministrator
          trigger:
            - call: "POST /pbra/special-claims"
              payload: { contract_id: "${contract_id}", claim_type: "VACANCY", unit_number: "101", claim_period_month: "2027-01", vacancy_start_date: "2027-01-20", vacancy_end_date: "2027-03-05" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { claim_settled_id: $.data.id, settled_amount: $.data.computed_amount_cents }
            - call: "POST /pbra/special-claims"
              payload: { contract_id: "${contract_id}", claim_type: "VACANCY", unit_number: "102", claim_period_month: "2027-01", vacancy_start_date: "2027-01-20", estimated_vacancy_days: 44 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { claim_open_id: $.data.id, open_amount: $.data.computed_amount_cents }
            - call: "POST /pbra/special-claims/${claim_settled_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/special-claims/${claim_open_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
          assert:
            - "SpecialClaim.${claim_settled_id}.valuation_variant == ACTUAL_CHRONOLOGICAL"
            - "SpecialClaim.${claim_settled_id}.vacancy_days_claimed == 44"
            - "SpecialClaim.${claim_settled_id}.computed_amount_cents == 178888"
            - "SpecialClaim.${claim_open_id}.valuation_variant == PROJECTED_ESTIMATE"
            - "SpecialClaim.${claim_open_id}.vacancy_days_claimed == 44"
            - "SpecialClaim.${claim_open_id}.computed_amount_cents == 138453"
            - "${settled_amount} - ${open_amount} == 40435"
            - "SpecialClaim.${claim_settled_id}.state == SUBMITTED"
            - "SpecialClaim.${claim_open_id}.state == SUBMITTED"

  - rule_id: combinatorial_formula
    instances:
      - name: comparable_market_rent_rounds_each_comparable_to_whole_dollars_before_the_weighted_mean
        grounds:
          - calculations.comparable_market_rent
          - entities.Comparable.fields.adjusted_rent_cents
          - entities.Comparable.fields.weight
          - entities.RentComparabilityStudy.fields.estimated_market_rent_cents
          - state_machines.RentComparabilityStudy.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) — order of operations: rounding each comparable's gross rent to whole dollars
          FIRST and taking the weighted mean of the rounded values SECOND yields 130200, whereas
          taking the weighted mean of the unrounded gross values (131150/w3, 123600/w2,
          140425/w1) and rounding once at the end yields 130179; the 21-cent gap is observable
          on estimated_market_rent_cents and is not reachable by any single-rounding pipeline.
        test_recipe:
          setup:
            - "One owner, one IL property, one HapContract, clock at 2026-12-01, one renewal case with OPTION_2_OCAF selected."
            - "A DRAFT study holding three comparables whose gross rents are 131150 (weight 3), 123600 (weight 2) and 140425 (weight 1)."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pbra/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_id: $.data.id }
            - call: "POST /pbra/renewal-cases/${case_id}/select-option"
              payload: { renewal_option: "OPTION_2_OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies"
              payload: { renewal_case_id: "${case_id}", appraiser_name: "Hollis Appraisal Group" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { study_id: $.data.id }
          trigger:
            - call: "POST /pbra/comparables"
              payload: { study_id: "${study_id}", address_label: "88 Alder Court", raw_rent_cents: 125000, adjustment_total_cents: 4650, utility_adjustment_cents: 1500, weight: 3 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { comp_a_id: $.data.id, comp_a_adjusted: $.data.adjusted_rent_cents }
            - call: "POST /pbra/comparables"
              payload: { study_id: "${study_id}", address_label: "12 Birch Lane", raw_rent_cents: 118000, adjustment_total_cents: 4100, utility_adjustment_cents: 1500, weight: 2 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { comp_b_id: $.data.id, comp_b_adjusted: $.data.adjusted_rent_cents }
            - call: "POST /pbra/comparables"
              payload: { study_id: "${study_id}", address_label: "5 Cypress Way", raw_rent_cents: 133000, adjustment_total_cents: 5925, utility_adjustment_cents: 1500, weight: 1 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { comp_c_id: $.data.id, comp_c_adjusted: $.data.adjusted_rent_cents }
            - call: "POST /pbra/rent-comparability-studies/${study_id}/submit"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { market_rent: $.data.estimated_market_rent_cents }
          assert:
            - "${comp_a_adjusted} == 131200"
            - "${comp_b_adjusted} == 123600"
            - "${comp_c_adjusted} == 140400"
            - "RentComparabilityStudy.${study_id}.accepted_comparable_count == 3"
            - "${market_rent} == 130200"
            - "${market_rent} != 130179"
            - "RenewalCase.${case_id}.comparable_market_rent_cents == 130200"
            - "RenewalCase.${case_id}.rent_track_status == RCS_IN_PROGRESS"

      - name: budget_based_rent_levies_the_management_fee_once_on_the_pre_fee_subtotal
        grounds:
          - calculations.budget_based_rent
          - entities.RenewalCase.fields.budget_rent_per_unit_cents
          - entities.HapContract.fields.operating_expense_per_unit_cents
          - entities.HapContract.fields.reserve_deposit_per_unit_cents
          - state_machines.RenewalCase.OPTION_SELECTED_to_OPTION_SELECTED
        distinguishing_aspect: |
          Mode (c) — self-referential definition resolved by a pinned single forward pass: the
          8 percent management fee is defined on a budget-based rent that itself includes the
          fee, and the scaffold pins one pass over the pre-fee subtotal 97500, giving fee 7800
          and total 105300; the algebraic fixed point 97500/0.92 = 105978 and the
          second-iteration value 105924 are both explicitly rejected, so the three candidate
          answers are separated by 624 and 678 cents on the same stored inputs.
        test_recipe:
          setup:
            - "One owner, one IL property, one HapContract with opex 61000, debt service 32000, reserve 4500 (pre-fee subtotal 97500)."
            - "Clock at 2026-12-01; one renewal case with OPTION_2_OCAF selected, so elect-adjustment is a legal self-transition."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pbra/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_id: $.data.id }
            - call: "POST /pbra/renewal-cases/${case_id}/select-option"
              payload: { renewal_option: "OPTION_2_OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { budget_after_option: $.data.budget_rent_per_unit_cents }
          trigger:
            - call: "POST /pbra/renewal-cases/${case_id}/elect-adjustment"
              payload: { adjustment_method: "BUDGET_BASED" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { budget_rent: $.data.budget_rent_per_unit_cents, track_after_elect: $.data.rent_track_status }
          assert:
            - "${budget_after_option} == 105300"
            - "${budget_rent} == 105300"
            - "${budget_rent} != 105978"
            - "${budget_rent} != 105924"
            - "${track_after_elect} == OPTION_SELECTED"
            - "RenewalCase.${case_id}.adjustment_method == BUDGET_BASED"
            - "RenewalCase.${case_id}.rcs_required == true"

  - rule_id: non_linear_state_machine
    instances:
      - name: rcs_submit_challenge_cycle_terminates_at_three_rounds
        grounds:
          - state_machines.RentComparabilityStudy.SUBMITTED_to_CHALLENGED
          - state_machines.RentComparabilityStudy.CHALLENGED_to_SUBMITTED
          - entities.RentComparabilityStudy.fields.challenge_round
          - validations[priority=33]
          - errors[ERR_MAX_CHALLENGE_ROUNDS]
        distinguishing_aspect: |
          The study loops SUBMITTED -> CHALLENGED -> SUBMITTED three times and the fourth
          challenge is refused with ERR_MAX_CHALLENGE_ROUNDS while the study remains SUBMITTED —
          the loop counter, not a state, is what terminates the cycle, and the first round's
          strike permanently lowers estimated_market_rent_cents from 130200 to 129200.
        test_recipe:
          setup:
            - "One owner, one IL property, one HapContract, clock at 2026-12-01, one renewal case with OPTION_2_OCAF."
            - "A study holding the three reference comparables (weights 3, 2, 1), submitted once."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${property_id}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pbra/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /pbra/renewal-cases"
              payload: { contract_id: "${contract_id}" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { case_id: $.data.id }
            - call: "POST /pbra/renewal-cases/${case_id}/select-option"
              payload: { renewal_option: "OPTION_2_OCAF" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
            - call: "POST /pbra/rent-comparability-studies"
              payload: { renewal_case_id: "${case_id}", appraiser_name: "Hollis Appraisal Group" }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { study_id: $.data.id }
            - call: "POST /pbra/comparables"
              payload: { study_id: "${study_id}", address_label: "88 Alder Court", raw_rent_cents: 125000, adjustment_total_cents: 4650, utility_adjustment_cents: 1500, weight: 3 }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { comp_a_id: $.data.id }
            - call: "POST /pbra/comparables"
