            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/orders", payload: { customer_name: "CustZ", product_code: "THIGH_MEAT", pounds_ordered: 100.0, temperature_requirement: "FROZEN", due_at: "2026-08-01T06:00:00Z" }, as: OrderPlanner, captures: { o1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /poultry/deboning-batches", payload: { order_id: "${o1}", flock_lot_id: "${f1}", shift_id: "${s1}", line_id: "${l2}", crew_count: 4, input_weight_lb: 1000.0 }, as: ShiftSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ORDER_WINDOW_CLOSED (temporal priority 7 beats fiscal priority 9; NOT ERR_LABOR_BUDGET_EXCEEDED even though est 2.0 > 1.0 remaining)"
            - "http status == 409"

