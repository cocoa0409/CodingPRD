scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: inmate_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Inmate, endpoints]
        distinguishing_aspect: "POST /inmates with full_name/date_of_birth/sex returns 201 with a server-minted id, status IN_CUSTODY, and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /inmates"
              payload: { full_name: "Test Person", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
          assert:
            - "response status == 201"
            - "Inmate.${inm}.status == \"IN_CUSTODY\""
            - "Inmate.${inm}.version == 1"

      - name: booking_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Booking, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bookings/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_NOT_FOUND\""

      - name: booking_missing_sentence_days_returns_validation
        claim_type: Required Fields
        grounds: [entities.Booking.fields.sentence_days, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /bookings omitting the required sentence_days field returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["one inmate exists"]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Miss Field", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
          trigger:
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "FELONY", prior_bookings_count: 0, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_VALIDATION\""

      - name: booking_invalid_charge_severity_enum
        claim_type: Type Constraints
        grounds: [entities.Booking.fields.charge_severity, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /bookings with charge_severity not in {FELONY,MISDEMEANOR,INFRACTION} returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["one inmate exists"]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Bad Enum", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
          trigger:
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "TRAFFIC", prior_bookings_count: 0, sentence_days: 30, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_INVALID_ENUM\""

      - name: booking_create_auto_provisions_commissary_account
        claim_type: Computed Fields
        grounds: [entities.CommissaryAccount, endpoints]
        distinguishing_aspect: "Creating a booking auto-creates exactly one CommissaryAccount with balance_cents 0 and total_deposited_cents 0, discoverable via the FK-reverse GET."
        test_recipe:
          setup: ["one inmate exists"]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Acct Owner", date_of_birth: "1990-01-01", sex: "FEMALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 30, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
          trigger:
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id" }
          assert:
            - "exactly one account returned; CommissaryAccount.${acct}.balance_cents == 0"
            - "CommissaryAccount.${acct}.total_deposited_cents == 0"

  # =====================================================================
  - section: state_machines
    instances:
      - name: attend_already_attended_court_event_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.CourtEvent.SCHEDULED_to_ATTENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Attending a CourtEvent already in ATTENDED (terminal) returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["Inmate; Booking; a CourtEvent already ATTENDED."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Court Guy", date_of_birth: "1985-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "FELONY", prior_bookings_count: 0, sentence_days: 200, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /bookings/${bk}/court-events"
              payload: { event_datetime: "2026-06-01T09:00:00Z", event_type: "HEARING" }
              as: Scheduler
              captures: { ce: "$.data.id" }
            - call: "POST /court-events/${ce}/attend"
              as: Scheduler
          trigger:
            - call: "POST /court-events/${ce}/attend"
              as: Scheduler
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_INVALID_STATE\""

      - name: resolve_request_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Request.UNDER_REVIEW_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a Request still in SUBMITTED (must be UNDER_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Inmate; Booking; a SUBMITTED Request (never reviewed)."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Req Guy", date_of_birth: "1985-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /bookings/${bk}/requests"
              payload: { request_type: "MEDICAL", description: "sick call" }
              as: HealthGrievanceOfficer
              captures: { rq: "$.data.id" }
          trigger:
            - call: "POST /requests/${rq}/resolve"
              as: HealthGrievanceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_INVALID_STATE\""

      - name: fulfill_already_fulfilled_order_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.CommissaryOrder.PENDING_to_FULFILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Fulfilling an order already FULFILLED returns ERR_INVALID_STATE (409); balance is not debited twice."
        test_recipe:
          setup: ["Inmate; Booking; account deposited 1000; a FULFILLED order (total 364)."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ord Guy", date_of_birth: "1985-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id" }
            - call: "POST /commissary-accounts/${acct}/deposits"
              payload: { amount_cents: 1000 }
              as: IntakeOfficer
              captures: { acctv: "$.data.version" }
            - call: "POST /commissary-accounts/${acct}/orders"
              payload: { lines: [ { item_name: "soap", quantity: 1, unit_price_cents: 105, taxable: true }, { item_name: "pen", quantity: 1, unit_price_cents: 105, taxable: true }, { item_name: "gum", quantity: 1, unit_price_cents: 105, taxable: true } ], expected_commissaryaccount_version: "${acctv}" }
              as: IntakeOfficer
              captures: { ord: "$.data.id" }
            - call: "POST /commissary-orders/${ord}/fulfill"
              as: IntakeOfficer
          trigger:
            - call: "POST /commissary-orders/${ord}/fulfill"
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_INVALID_STATE\""
            - "CommissaryAccount.${acct}.balance_cents == 636 (debited once only)"

      - name: court_event_continuance_cycle_covered
        claim_type: Valid Transition
        grounds: [state_machines.CourtEvent.SCHEDULED_to_CONTINUED]
        excluded_because:
          difficulty_instance: court_event_continuance_cycle
          rationale: "The cyclic continue transition is exercised by the named §1.8 instance."

  # =====================================================================
  - section: calculations
    instances:
      - name: statutory_good_time_computed_at_booking_create
        claim_type: Correct Result
        grounds: [calculations.good_time_credit, entities.Booking.fields.statutory_release_date]
        distinguishing_aspect: "Before any classification, statutory_good_time_days = floor(100*0.10)=10 and statutory_release_date=2026-07-30, while earned_good_time_days=0 (accrual rate 0 when unclassified) so projected_release_date=2026-08-09."
        test_recipe:
          setup: ["Inmate; Booking sentence 100 start 2026-05-01, never classified."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Stat Guy", date_of_birth: "1985-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "FELONY", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
          trigger:
            - call: "GET /bookings/${bk}/release-projection"
              as: Supervisor
          assert:
            - "release-projection.statutory_good_time_days == 10"
            - "release-projection.statutory_release_date == \"2026-07-30\""
            - "release-projection.earned_good_time_days == 0"
            - "release-projection.projected_release_date == \"2026-08-09\""

      - name: earned_vs_statutory_divergence_covered
        claim_type: Variant Divergence
        grounds: [calculations.good_time_credit]
        excluded_because:
          difficulty_instance: release_statutory_vs_earned_release_date
          rationale: "Dual-variant divergence asserted by the named §1.8 instance."

  # =====================================================================
  - section: validations
    instances:
      - name: housing_gender_mismatch_returns_error
        claim_type: Cross-entity validation
        grounds: ["validations[priority=51]", "errors[ERR_GENDER_MISMATCH]"]
        distinguishing_aspect: "Assigning a MALE inmate's booking to a bed in a FEMALE unit returns ERR_GENDER_MISMATCH (409)."
        test_recipe:
          setup: ["MALE inmate, MIN booking classified; FEMALE MIN unit with one bed."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "He Male", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
            - call: "POST /housing-units"
              payload: { name: "Pod-F", security_level: "MIN", gender: "FEMALE", capacity: 4 }
              as: ClassificationOfficer
              captures: { hu: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "F1" }
              as: ClassificationOfficer
              captures: { bed: "$.data.id" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk}", bed_id: "${bed}", start_datetime: "2026-05-02T10:00:00Z" }
              as: ClassificationOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_GENDER_MISMATCH\""

      - name: release_time_served_before_date_not_eligible
        claim_type: Temporal validation
        grounds: ["validations[priority=80]", calculations.release_eligibility, "errors[ERR_NOT_RELEASE_ELIGIBLE]"]
        distinguishing_aspect: "TIME_SERVED release with the logical clock (default 2026-05-01) before projected_release_date (2026-07-20) returns ERR_NOT_RELEASE_ELIGIBLE (409)."
        test_recipe:
          setup: ["Inmate; MIN booking sentence 100 classified (projected 2026-07-20); clock at default 2026-05-01."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Early Bird", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
          trigger:
            - call: "POST /bookings/${bk}/release"
              payload: { release_reason: "TIME_SERVED" }
              as: Supervisor
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_NOT_RELEASE_ELIGIBLE\""

      - name: release_time_served_after_projected_date_succeeds
        claim_type: Satisfaction to Pass
        grounds: ["validations[priority=80]", calculations.release_eligibility, endpoints]
        distinguishing_aspect: "After advancing the clock to 2026-07-20 (>= projected_release_date), a TIME_SERVED release succeeds and sets booking_status RELEASED."
        test_recipe:
          setup: ["Inmate; MIN booking sentence 100 classified (projected 2026-07-20); clock advanced to 2026-07-20."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "On Time", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: Supervisor
          trigger:
            - call: "POST /bookings/${bk}/release"
              payload: { release_reason: "TIME_SERVED" }
              as: Supervisor
          assert:
            - "Booking.${bk}.booking_status == \"RELEASED\""

      - name: visit_end_before_start_returns_invalid_time_range
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "POST /visits with end_datetime <= start_datetime returns ERR_INVALID_TIME_RANGE (422)."
        test_recipe:
          setup: ["Inmate; Booking; APPROVED Visitor."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Time Bad", date_of_birth: "1990-01-01", sex: "FEMALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /inmates/${inm}/visitors"
              payload: { visitor_name: "Guest", relationship: "FRIEND" }
              as: Scheduler
              captures: { vis: "$.data.id" }
            - call: "POST /visitors/${vis}/approve"
              as: Scheduler
          trigger:
            - call: "POST /visits"
              payload: { booking_id: "${bk}", visitor_id: "${vis}", start_datetime: "2026-05-03T11:00:00Z", end_datetime: "2026-05-03T10:00:00Z" }
              as: Scheduler
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_INVALID_TIME_RANGE\""

      - name: order_insufficient_funds_at_create
        claim_type: Aggregate validation
        grounds: ["validations[priority=70]", "errors[ERR_INSUFFICIENT_FUNDS]"]
        distinguishing_aspect: "An order whose total (364) exceeds the account balance (deposit 300) on a non-released booking returns ERR_INSUFFICIENT_FUNDS (402) — no state conflict, isolating the fiscal rule."
        test_recipe:
          setup: ["Inmate; Booking (BOOKED); account deposited only 300c (version 2)."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Broke Guy", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id" }
            - call: "POST /commissary-accounts/${acct}/deposits"
              payload: { amount_cents: 300 }
              as: IntakeOfficer
              captures: { acctv: "$.data.version" }
          trigger:
            - call: "POST /commissary-accounts/${acct}/orders"
              payload: { lines: [ { item_name: "soap", quantity: 1, unit_price_cents: 105, taxable: true }, { item_name: "pen", quantity: 1, unit_price_cents: 105, taxable: true }, { item_name: "gum", quantity: 1, unit_price_cents: 105, taxable: true } ], expected_commissaryaccount_version: "${acctv}" }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_INSUFFICIENT_FUNDS\""

      - name: housing_unit_full_returns_error
        claim_type: Aggregate validation
        grounds: ["validations[priority=62]", calculations.housing_unit_occupancy, "errors[ERR_HOUSING_UNIT_FULL]"]
        distinguishing_aspect: "A unit with capacity 1 already has one occupied bed; assigning a second booking to its second bed returns ERR_HOUSING_UNIT_FULL (409)."
        test_recipe:
          setup: ["MIN/MALE unit capacity 1 with two beds; booking1 (MIN) housed on bed1; booking2 (MIN) classified, un-housed."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "First In", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm1: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm1}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk1: "$.data.id", bkv1: "$.data.version" }
            - call: "POST /bookings/${bk1}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv1}" }
              as: ClassificationOfficer
            - call: "POST /inmates"
              payload: { full_name: "Second In", date_of_birth: "1991-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm2: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm2}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 40, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk2: "$.data.id", bkv2: "$.data.version" }
            - call: "POST /bookings/${bk2}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv2}" }
              as: ClassificationOfficer
            - call: "POST /housing-units"
              payload: { name: "Pod-Full", security_level: "MIN", gender: "MALE", capacity: 1 }
              as: ClassificationOfficer
              captures: { hu: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "U1" }
              as: ClassificationOfficer
              captures: { bed1: "$.data.id" }
            - call: "POST /housing-units/${hu}/beds"
              payload: { bed_label: "U2" }
              as: ClassificationOfficer
              captures: { bed2: "$.data.id" }
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk1}", bed_id: "${bed1}", start_datetime: "2026-05-02T10:00:00Z" }
              as: ClassificationOfficer
              captures: { ha1: "$.data.id" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { booking_id: "${bk2}", bed_id: "${bed2}", start_datetime: "2026-05-02T10:00:00Z" }
              as: ClassificationOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_HOUSING_UNIT_FULL\""

  # =====================================================================
  - section: endpoints
    instances:
      - name: fk_reverse_list_bookings_by_inmate
        claim_type: Computed read
        grounds: [endpoints, entities.Booking.fields.inmate_id]
        distinguishing_aspect: "GET /inmates/{id}/bookings returns the array of bookings whose inmate_id equals the path id (FK reverse-reachability)."
        test_recipe:
          setup: ["one inmate with two bookings"]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Multi Book", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 30, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk1: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "FELONY", prior_bookings_count: 1, sentence_days: 90, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk2: "$.data.id" }
          trigger:
            - call: "GET /inmates/${inm}/bookings"
              as: Supervisor
          assert:
            - "response is an array containing both ${bk1} and ${bk2} (total_count == 2)"

      - name: property_release_returns_item
        claim_type: Action endpoint
        grounds: [endpoints, state_machines.PropertyItem.STORED_to_RETURNED]
        distinguishing_aspect: "POST /property-items/{id}/release moves a STORED item to RETURNED."
        test_recipe:
          setup: ["Inmate; Booking; a STORED PropertyItem."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Prop Guy", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 30, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /bookings/${bk}/property"
              payload: { description: "silver watch", category: "ELECTRONICS" }
              as: IntakeOfficer
              captures: { pi: "$.data.id" }
          trigger:
            - call: "POST /property-items/${pi}/release"
              as: IntakeOfficer
          assert:
            - "PropertyItem.${pi}.property_status == \"RETURNED\""

  # =====================================================================
  - section: rbac
    instances:
      - name: scheduler_cannot_create_inmate_unauthorized
        claim_type: peer_roles
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /inmates as Scheduler (not IntakeOfficer) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /inmates"
              payload: { full_name: "No Right", date_of_birth: "1990-01-01", sex: "MALE" }
              as: Scheduler
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_UNAUTHORIZED\""

      - name: missing_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds: [roles, "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request to POST /inmates with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["empty DB; request sent WITHOUT auth headers"]
          setup_api_calls: []
          trigger:
            - call: "POST /inmates"
              payload: { full_name: "Anon", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "with both auth headers omitted, err == \"ERR_UNAUTHENTICATED\""

      - name: uphold_by_reporter_segregation_of_duties
        claim_type: Segregation of duties
        grounds: ["validations[priority=40]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.DisciplinaryInfraction.REPORTED_to_UPHELD]
        distinguishing_aspect: "When the upholder's X-User-ID equals the infraction's reported_by_user_id, uphold returns ERR_SEGREGATION_OF_DUTIES (403); the infraction stays REPORTED."
        test_recipe:
          setup: ["Inmate; Booking; infraction reported by X-User-ID supervisor-9."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Sod Guy", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "FELONY", prior_bookings_count: 0, sentence_days: 100, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "POST /bookings/${bk}/infractions"
              payload: { infraction_type: "ASSAULT", good_time_forfeit_days: 4 }
              as: Supervisor
              as_user_id: "supervisor-9"
              captures: { inf: "$.data.id" }
          trigger:
            - call: "POST /infractions/${inf}/uphold"
              as: Supervisor
              as_user_id: "supervisor-9"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_SEGREGATION_OF_DUTIES\""
            - "DisciplinaryInfraction.${inf}.infraction_status == \"REPORTED\""

  # =====================================================================
  - section: cross_cutting
    instances:
      - name: classification_stale_booking_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[classification-supersede-stale-booking]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After an INITIAL classification advances Booking.version from 1 to 2, a REASSESSMENT create carrying the stale expected_booking_version 1 returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Inmate; Booking (version 1 at create); INITIAL classification bumps version to 2."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Occ Guy", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 60, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id", bkv: "$.data.version" }
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "INITIAL", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
          trigger:
            - call: "POST /bookings/${bk}/classifications"
              payload: { assessment_type: "REASSESSMENT", expected_booking_version: "${bkv}" }
              as: ClassificationOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_STALE_VERSION\""

      - name: order_stale_account_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-create-stale-account]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first order create advances CommissaryAccount.version, a second order create carrying the stale account version returns ERR_STALE_VERSION (412) even though funds suffice."
        test_recipe:
          setup: ["Inmate; Booking; account deposited 2000 (version 2); one order already created off version 2 (version -> 3)."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Occ Two", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 60, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id" }
            - call: "POST /commissary-accounts/${acct}/deposits"
              payload: { amount_cents: 2000 }
              as: IntakeOfficer
              captures: { acctv: "$.data.version" }
            - call: "POST /commissary-accounts/${acct}/orders"
              payload: { lines: [ { item_name: "soap", quantity: 1, unit_price_cents: 105, taxable: true } ], expected_commissaryaccount_version: "${acctv}" }
              as: IntakeOfficer
              captures: { ord1: "$.data.id" }
          trigger:
            - call: "POST /commissary-accounts/${acct}/orders"
              payload: { lines: [ { item_name: "pen", quantity: 1, unit_price_cents: 105, taxable: true } ], expected_commissaryaccount_version: "${acctv}" }
              as: IntakeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == \"ERR_STALE_VERSION\""

      - name: version_increments_on_deposit
        claim_type: optimistic_concurrency
        grounds: [entities.CommissaryAccount, endpoints]
        distinguishing_aspect: "Each deposit increments CommissaryAccount.version by exactly 1 (1 at auto-create -> 2 after first deposit -> 3 after second)."
        test_recipe:
          setup: ["Inmate; Booking; auto account version 1."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "Ver Guy", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 60, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id" }
            - call: "POST /commissary-accounts/${acct}/deposits"
              payload: { amount_cents: 100 }
              as: IntakeOfficer
              captures: { v_after_1: "$.data.version" }
          trigger:
            - call: "POST /commissary-accounts/${acct}/deposits"
              payload: { amount_cents: 100 }
              as: IntakeOfficer
              captures: { v_after_2: "$.data.version" }
          assert:
            - "v_after_1 == 2"
            - "v_after_2 == 3"

      - name: release_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Booking.HOUSED_to_RELEASED]
        excluded_because:
          difficulty_instance: release_cascade_assignment_bed_unit
          rationale: "The depth-3 release cascade is exercised by the named §1.8 instance."

  # =====================================================================
  - section: consistency_model
    instances:
      - name: deposit_immediately_visible_in_balance
        claim_type: immediate
        grounds: [entities.CommissaryAccount.fields.balance_cents, endpoints]
        distinguishing_aspect: "A deposit's effect on balance_cents is visible in the same response and in an immediate follow-up GET (immediate consistency)."
        test_recipe:
          setup: ["Inmate; Booking; auto account balance 0."]
          setup_api_calls:
            - call: "POST /inmates"
              payload: { full_name: "See Now", date_of_birth: "1990-01-01", sex: "MALE" }
              as: IntakeOfficer
              captures: { inm: "$.data.id" }
            - call: "POST /bookings"
              payload: { inmate_id: "${inm}", arrest_datetime: "2026-05-01T00:00:00Z", charge_severity: "MISDEMEANOR", prior_bookings_count: 0, sentence_days: 30, sentence_start_date: "2026-05-01" }
              as: IntakeOfficer
              captures: { bk: "$.data.id" }
            - call: "GET /bookings/${bk}/commissary-account"
              as: IntakeOfficer
              captures: { acct: "$.data[0].id" }
            - call: "POST /commissary-accounts/${acct}/deposits"
              payload: { amount_cents: 500 }
              as: IntakeOfficer
          trigger:
            - call: "GET /commissary-accounts/${acct}"
              as: IntakeOfficer
          assert:
            - "CommissaryAccount.${acct}.balance_cents == 500"
