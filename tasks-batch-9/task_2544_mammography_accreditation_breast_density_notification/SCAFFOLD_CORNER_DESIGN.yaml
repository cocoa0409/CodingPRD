        grounds:
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Priority 20 is a single rule with four observable faces — an enum/range overflow (birads 7 against 0..6), a minimum-count breach (original_image_count 0), a shape breach (a two-letter uppercase state code), and a conditional pairing breach (ce_hours on a READ_VOLUME credit) — and every one of them returns 400 ERR_INVALID_REQUEST without persisting a row."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One SCREENING exam performed 2026-07-20 awaiting interpretation."
          setup_api_calls:
