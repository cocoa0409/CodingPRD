      - name: geo_holdout_measurement_derives_lift_from_the_conversion_rate_ratio
        claim_type: correct_result
        grounds:
          - calculations.incremental_sales_lift.variants.GEO_HOLDOUT
          - state_machines.IncrementalityStudy.RUNNING_to_MEASURING
          - validations[priority=52]
        distinguishing_aspect: "exposed_rate 0.10 over control_rate 0.05 gives lift_pct exactly 1.0000, incremental_sales_cents = round_half_up(2000000 * 1.0/2.0) = 1000000, and significance_score = |0.10 - 0.05| * sqrt(10000) = 5.0000 which clears SIGNIFICANCE_MIN 1.96."
        test_recipe:
          setup:
            - "Baseline chain through line item activation; a GEO_HOLDOUT study on the campaign covering [2026-08-01, 2026-08-08) has been started with 10000 exposed and 10000 control shoppers, and the logical clock has been advanced to the window end."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
