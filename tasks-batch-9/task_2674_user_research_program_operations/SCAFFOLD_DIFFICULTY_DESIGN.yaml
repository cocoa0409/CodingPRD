      - name: no_show_three_hop_suppression_and_pool_posture
        grounds:
          - state_machines.Recruitment.status.SCHEDULED_to_NO_SHOW
          - state_machines.Recruitment.incentive_state.RESERVED_to_FORFEITED
          - state_machines.Participant.ELIGIBLE_to_SUPPRESSED
          - calculations.participant_eligibility
          - calculations.pool_posture
        distinguishing_aspect: |
          Depth-3 cascade from a completely different trigger than the consent-revocation chain -
          Recruitment SCHEDULED -> NO_SHOW: the no-show forfeits the reservation, the forfeiture's strike
          increment (not the original call) pushes no_show_strikes to NO_SHOW_SUPPRESSION_STRIKES and
          re-derives the Participant as SUPPRESSED, and that suppression (not the no-show) raises the
          pool's suppressed_ratio above POSTURE_SUPPRESSED_RATIO and re-derives the pool as RESTRICTED.
