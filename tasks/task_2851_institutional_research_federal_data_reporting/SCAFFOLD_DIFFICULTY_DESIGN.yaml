  - rule_id: compensating_invariant
    instances:
      - name: exclusion_approve_then_deny_restores_cohort_counts_and_rates
        grounds:
          - calculations.cohort_headcount_conservation
          - calculations.cohort_rate_variants
          - state_machines.CohortMember.CLAIMED_to_APPROVED
          - state_machines.CohortMember.APPROVED_to_DENIED
          - entities.CohortDefinition.fields.adjusted_count
          - entities.CohortDefinition.fields.exclusion_count
        distinguishing_aspect: |
          adjusted_count + exclusion_count == initial_count holds at 4 + 1 == 5 and again at
          5 + 0 == 5, and denying the previously approved exclusion drives federal_rate_pct
          back to exactly 60.0 with rate_divergence_pp 0.0, proving the recomputation is
          total rather than an incremental delta that would leave the roster identity drifted.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED (clock at 2026-11-01T00:00:00Z)."
            - "A DRAFT GRAD_RATE_150 / FALL2020 cohort holds five members: S001-S003 COMPLETED_150, S004-S005 STILL_ENROLLED, giving federal_rate_pct 60.0 and ranking_rate_pct 60.0."
            - "S005 has a CLAIMED ARMED_FORCES exclusion awaiting review; the cohort is never locked, so no restatement cascade participates."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 5, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "a1b2c3d4e5f60022", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/cohorts"
              payload: { cohort_type: "GRAD_RATE_150", entry_term: "FALL2020", publication_metric_key: "GRAD_RATE_150_FALL2020" }
              as: RegistrarOfficer
              captures: { coh: $.data.id }
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S001", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S002", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S003", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S004", entry_status: "FULL_TIME", outcome: "STILL_ENROLLED" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S005", entry_status: "FULL_TIME", outcome: "STILL_ENROLLED" }
              as: RegistrarOfficer
              captures: { m5: $.data.id }
            - call: "POST /ir/cohort-members/${m5}/exclusion-claim"
              payload: { exclusion_code: "ARMED_FORCES", exclusion_evidence_note: "Active-duty orders filed with the registrar on 2026-10-02." }
              as: RegistrarOfficer
              as_user_id: "registrar-1"
          trigger:
            - call: "POST /ir/cohort-members/${m5}/exclusion-review"
              payload: { decision: "APPROVE", review_note: "Orders verified; allowable exclusion approved." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/cohort-members/${m5}/exclusion-review"
              payload: { decision: "DENY", review_note: "Orders postdate the 150 percent completion window; exclusion withdrawn." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "GET /ir/cohorts/${coh}/rate-summary"
              payload: {}
              as: IRAnalyst
          assert:
            - "After the APPROVE: CohortDefinition.${coh}.adjusted_count == 4, exclusion_count == 1, initial_count == 5, federal_rate_pct == 75.0, ranking_rate_pct == 60.0"
            - "CohortMember.${m5}.exclusion_status == DENIED"
            - "CohortDefinition.${coh}.initial_count == 5"
            - "CohortDefinition.${coh}.exclusion_count == 0"
            - "CohortDefinition.${coh}.adjusted_count == 5"
            - "CohortDefinition.${coh}.completers_count == 3"
            - "CohortDefinition.${coh}.federal_rate_pct == 60.0"
            - "CohortDefinition.${coh}.ranking_rate_pct == 60.0"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.rate_divergence_pp == 0.0"
            - "GET /ir/cohorts/${coh}/rate-summary -> data.adjusted_count + data.exclusion_count == data.initial_count"
      - name: compensating_restatement_returns_publication_to_original_value
        grounds:
          - calculations.publication_value_conservation
          - calculations.restatement_materiality
          - state_machines.DashboardPublication.RESTATEMENT_PENDING_to_RESTATED
          - state_machines.RestatementRequest.SUBMITTED_to_APPLIED
          - entities.DashboardPublication.fields.net_applied_delta
          - entities.DashboardPublication.fields.restatement_count
          - concurrency_rules[restatement-create-stale-publication]
        distinguishing_aspect: |
          Restating 250.0 up to 275.0 and then back down to 250.0 drives net_applied_delta to
          exactly 0.0 with published_value == original_value == 250.0, while
          restatement_count keeps climbing to 2 - the audit trail is never rewound - and the
          asymmetric baselines are pinned at delta_pct 10.00 then 9.09.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN with one CERTIFIED COMPLETIONS component."
            - "Publication PC (metric_key COMPLETIONS_TOTAL_FALL) is PUBLISHED at published_value 250.0 with original_value 250.0, net_applied_delta 0.0 and restatement_count 0."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "COMPLETIONS", record_count: 250, coverage_start_date: "2026-07-01", coverage_end_date: "2027-06-30", checksum: "a1b2c3d4e5f60023", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff}", component_code: "COMPLETIONS" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_COMPLETIONS", reported_value: 250, prior_year_value: 250, source_field_path: "sis.degrees.awarded_total" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the completions component as reported to the federal collection." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/reporting-cycles/${cyc}/freeze"
              payload: {}
              as: IRDirector
            - call: "POST /ir/publications"
              payload: { component_id: "${comp}", metric_key: "COMPLETIONS_TOTAL_FALL", published_value: 250.0, effective_from: "2026-12-01T00:00:00Z" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id, pub_v: $.data.version }
          trigger:
            - call: "POST /ir/publications/${pub}/restatements"
              payload: { proposed_value: 275.0, justification: "Twenty-five late-conferred degrees were omitted from the original completions extract.", expected_publication_version: "${pub_v}" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /ir/restatements/${r1}/approve"
              payload: { public_notice_reference: "PN-2027-001" }
              as: IRDirector
              as_user_id: "director-1"
            - call: "GET /ir/publications/${pub}"
              payload: {}
              as: IRAnalyst
              captures: { pub_v2: $.data.version }
            - call: "POST /ir/publications/${pub}/restatements"
              payload: { proposed_value: 250.0, justification: "The twenty-five degrees belong to the following collection year; reverting to the certified figure.", expected_publication_version: "${pub_v2}" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { r2: $.data.id }
            - call: "POST /ir/restatements/${r2}/approve"
              payload: { public_notice_reference: "PN-2027-002" }
              as: IRDirector
              as_user_id: "director-1"
          assert:
            - "After R1 approval: DashboardPublication.${pub}.published_value == 275.0, net_applied_delta == 25.0, restatement_count == 1, publication_status == RESTATED"
            - "RestatementRequest.${r1}.baseline_value == 250.0"
            - "RestatementRequest.${r1}.delta_pct == 10.00"
            - "RestatementRequest.${r1}.public_notice_required == true"
            - "RestatementRequest.${r1}.status == APPLIED"
            - "RestatementRequest.${r2}.baseline_value == 275.0"
            - "RestatementRequest.${r2}.delta_pct == 9.09"
            - "RestatementRequest.${r2}.public_notice_required == true"
            - "RestatementRequest.${r2}.status == APPLIED"
            - "DashboardPublication.${pub}.published_value == 250.0"
            - "DashboardPublication.${pub}.original_value == 250.0"
            - "DashboardPublication.${pub}.net_applied_delta == 0.0"
            - "DashboardPublication.${pub}.restatement_count == 2"
            - "DashboardPublication.${pub}.publication_status == RESTATED"
