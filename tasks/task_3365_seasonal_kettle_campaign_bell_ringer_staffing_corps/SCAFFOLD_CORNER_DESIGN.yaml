            - call: "POST /api/bell-ringers/${minor_id}/screenings"
              payload: { vendor: "SafeGuard Screening", package_level: "STANDARD" }
              as: VolunteerCoordinator
            - call: "POST /api/bell-ringers/${minor_id}/screenings/complete"
              payload: { result: "CLEAR", completed_at: "2026-11-10T00:00:00Z" }
              as: VolunteerCoordinator
            - call: "POST /api/bell-ringers"
              payload: { full_name: "Adult Ringer", email: "adult.ringer@example.org", ringer_type: "VOLUNTEER", corps_id: "${unit_id}", date_of_birth: "1980-01-01T00:00:00Z", hourly_rate_cents: 0 }
              as: VolunteerCoordinator
              captures: { adult_id: "$.data.id" }
            - call: "POST /api/bell-ringers/${adult_id}/screenings"
              payload: { vendor: "SafeGuard Screening", package_level: "STANDARD" }
              as: VolunteerCoordinator
            - call: "POST /api/bell-ringers/${adult_id}/screenings/complete"
              payload: { result: "CLEAR", completed_at: "2026-11-10T00:00:00Z" }
              as: VolunteerCoordinator
            - call: "GET /api/kettle-locations/${loc_id}"
              as: KettleCoordinator
              captures: { lv1: "$.data.version" }
          trigger:
            - call: "POST /api/shifts"
              payload: { kettle_location_id: "${loc_id}", bell_ringer_id: "${minor_id}", starts_at: "2026-11-20T15:00:00Z", ends_at: "2026-11-20T23:00:00Z", break_minutes: 0, shift_kind: "REGULAR", expected_kettle_location_version: "${lv1}" }
              as: VolunteerCoordinator
              captures: { err_curfew: "$.data.error_id" }
            - call: "POST /api/shifts"
              payload: { kettle_location_id: "${loc_id}", bell_ringer_id: "${adult_id}", starts_at: "2026-11-20T15:00:00Z", ends_at: "2026-11-20T23:00:00Z", break_minutes: 0, shift_kind: "REGULAR", expected_kettle_location_version: "${lv1}" }
              as: VolunteerCoordinator
              captures: { ok_shift: "$.data.id", ok_status: "$.data.status" }
          assert:
            - "the minor's shift returns error_id ERR_MINOR_CURFEW_VIOLATION with http status 422"
            - "the adult's identical shift is accepted with status SCHEDULED"
            - "only one Shift row exists for the location after both calls"

      - name: labor_budget_exceeded_on_shift_completion
        claim_type: violation_to_error
        grounds:
          - validations[priority=38]
          - calculations.shift_paid_amount
          - errors[ERR_LABOR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Completing a 480-minute shift for a paid ringer at 1500 cents per hour costs 12750 cents,
          which exceeds the campaign's 5000-cent labor budget, so the completion is rejected with
          ERR_LABOR_BUDGET_EXCEEDED and the shift stays CHECKED_IN rather than COMPLETED.
        test_recipe:
          setup:
            - "logical clock at 2026-11-20T09:00:00Z"
            - "one ACTIVE campaign with labor_budget_cents 5000 and one ACTIVE kettle location"
            - "one CLEARED PAID_SEASONAL ringer at 1500 cents per hour and one CHECKED_IN 480-minute shift"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/units"
              payload: { name: "Corps 41", unit_type: "CORPS", territory_code: "NT", canteen_pool_size: 4 }
              as: PlatformAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /api/campaigns"
              payload: { name: "2026 Christmas Kettle Campaign", season_year: 2026, starts_on: "2026-11-01T00:00:00Z", ends_on: "2026-12-24T23:59:59Z", goal_cents: 5000000, labor_budget_cents: 5000 }
              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 2 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id", host_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_id}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_v}" }
              as: KettleCoordinator
            - call: "GET /api/campaigns/${campaign_id}"
              as: TerritorialCommander
              captures: { campaign_v: "$.data.version" }
            - call: "POST /api/campaigns/${campaign_id}/activate"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: TerritorialCommander
            - call: "POST /api/kettle-locations"
              payload: { host_site_id: "${host_id}", campaign_id: "${campaign_id}", location_code: "K-114-A", placement: "OUTDOOR", placement_starts_on: "2026-11-01T00:00:00Z", placement_ends_on: "2026-12-24T00:00:00Z", daily_required_minutes: 480 }
              as: KettleCoordinator
              captures: { loc_id: "$.data.id", loc_v: "$.data.version" }
            - call: "POST /api/kettle-locations/${loc_id}/activate"
              payload: { expected_kettle_location_version: "${loc_v}" }
              as: KettleCoordinator
            - call: "POST /api/bell-ringers"
              payload: { full_name: "Priya Raman", email: "priya.raman@example.org", ringer_type: "PAID_SEASONAL", corps_id: "${unit_id}", date_of_birth: "1985-09-30T00:00:00Z", hourly_rate_cents: 1500 }
              as: VolunteerCoordinator
              captures: { ringer_id: "$.data.id" }
            - call: "POST /api/bell-ringers/${ringer_id}/screenings"
              payload: { vendor: "SafeGuard Screening", package_level: "STANDARD" }
              as: VolunteerCoordinator
            - call: "POST /api/bell-ringers/${ringer_id}/screenings/complete"
              payload: { result: "CLEAR", completed_at: "2026-11-10T00:00:00Z" }
              as: VolunteerCoordinator
            - call: "GET /api/kettle-locations/${loc_id}"
              as: KettleCoordinator
              captures: { lv1: "$.data.version" }
            - call: "POST /api/shifts"
              payload: { kettle_location_id: "${loc_id}", bell_ringer_id: "${ringer_id}", starts_at: "2026-11-20T09:00:00Z", ends_at: "2026-11-20T17:00:00Z", break_minutes: 0, shift_kind: "REGULAR", expected_kettle_location_version: "${lv1}" }
              as: VolunteerCoordinator
              captures: { shift_id: "$.data.id" }
            - call: "POST /api/shifts/${shift_id}/confirm"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /api/shifts/${shift_id}/check-in"
              payload: {}
              as: VolunteerCoordinator
          trigger:
            - call: "POST /api/shifts/${shift_id}/complete"
              payload: {}
              as: VolunteerCoordinator
              captures: { err_budget: "$.data.error_id" }
          assert:
            - "response error_id == ERR_LABOR_BUDGET_EXCEEDED with http status 409"
            - "the shift would have cost 12750 cents (7h * 1500 + 1h * 1500 * 1.5), above the 5000-cent budget"
            - "Shift.${shift_id}.status is still CHECKED_IN"
            - "Campaign.${campaign_id}.labor_committed_cents == 0"
