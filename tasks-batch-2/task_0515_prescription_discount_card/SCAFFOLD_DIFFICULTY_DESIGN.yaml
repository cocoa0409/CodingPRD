              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
          trigger:
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 6900, discount_price_cents: 5400, gold_price_cents: 5100, effective_at: "2026-05-15T00:00:00Z", expires_at: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_QUOTE_PERIOD_OVERLAP"

      - name: gold_membership_closed_buffer_window_overlap_rejected
        grounds:
          - validations[priority=11.6]
          - errors[ERR_MEMBERSHIP_PERIOD_OVERLAP]
          - entities.GoldMembership.fields.coverage_start
          - entities.GoldMembership.fields.coverage_end
        distinguishing_aspect: |
          CLOSED [coverage_start, coverage_end] + 1-day (86400 s) buffer on
          GoldMembership: a new membership starting 2026-06-30T12:00:00Z, only
          43200 s after an existing window ending 2026-06-30T00:00:00Z, violates the
          >=86400 s buffer -> ERR_MEMBERSHIP_PERIOD_OVERLAP. Buffer arithmetic differs
          from the quote's plain half-open intersection.
        test_recipe:
          setup:
            - "Member M with an existing GoldMembership coverage [2026-01-01,2026-06-30]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "ov@x.com", full_name: "M Ov", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /gold-memberships"
              payload: { member_id: "${m_id}", tier: "GOLD_INDIVIDUAL", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-06-30T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { gm1_id: $.data.id }
          trigger:
            - call: "POST /gold-memberships"
              payload: { member_id: "${m_id}", tier: "GOLD_INDIVIDUAL", coverage_start: "2026-06-30T12:00:00Z", coverage_end: "2026-12-31T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_MEMBERSHIP_PERIOD_OVERLAP"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: copaycard_benefit_pool_conserved_on_reverse
        grounds:
          - state_machines.Claim.ADJUDICATED_to_REVERSED
          - state_machines.CopayLink.APPLIED_to_RELEASED
          - state_machines.CopayCard.EXHAUSTED_to_ACTIVE
          - calculations.copay_offset_calculation
        distinguishing_aspect: |
          Conserved quantity: CopayCard.remaining_benefit_cents + SUM(applied_offset
          over APPLIED links) == max_benefit_cents (3000) at all times. Adjudicate
          draws 3000 (remaining->0, EXHAUSTED); reverse restores it (remaining->3000,
          link RELEASED, card ACTIVE) so the invariant holds with zero drift.
        test_recipe:
          setup:
            - "DISCOUNT card, claim quantity=2; ACTIVE CopayCard max_benefit=3000 per_fill_cap=8000 LINKED; adjudicated -> card EXHAUSTED, remaining=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drugs"
              payload: { name: "Atorvastatin", ndc: "00071015523", dosage_mg: 20, form: "TABLET", awp_cents: 10000 }
              as: PlatformAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "PH One", chain_code: "CVS", state_code: "CA", dispense_fee_cents: 200 }
              as: PlatformAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph_id}", cash_price_cents: 7000, discount_price_cents: 5500, gold_price_cents: 5200, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m10@x.com", full_name: "M Ten", state_code: "CA" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { card_id: $.data.id }
            - call: "POST /claims"
              payload: { discount_card_id: "${card_id}", pharmacy_id: "${ph_id}", quantity: 2 }
              as: PharmacyOperator
              captures: { claim_id: $.data.id }
            - call: "POST /copay-cards"
              payload: { sponsor_name: "Pfizer", drug_id: "${drug_id}", max_benefit_cents: 3000, per_fill_cap_cents: 8000 }
              as: CopayCardSponsor
              captures: { cc_id: $.data.id }
            - call: "POST /copay-links"
              payload: { copay_card_id: "${cc_id}", member_id: "${m_id}", claim_id: "${claim_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { link_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: PharmacyOperator
              captures: { claim_v: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/reverse"
              payload: { expected_claim_version: "${claim_v}" }
              as: PharmacyOperator
          assert:
            - "Claim.${claim_id}.status == REVERSED"
            - "CopayLink.${link_id}.status == RELEASED"
            - "CopayLink.${link_id}.applied_offset_cents == 0"
            - "CopayCard.${cc_id}.remaining_benefit_cents == 3000"
            - "CopayCard.${cc_id}.status == ACTIVE"

      - name: member_lifetime_savings_conserved_on_reverse
        grounds:
          - state_machines.Claim.ADJUDICATED_to_REVERSED
          - calculations.lifetime_savings_reconciliation
          - entities.Member.fields.lifetime_savings_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity (Member.lifetime_savings_cents, not the
          copay-card pool): adjudicate adds savings 3000 to the member's lifetime
          total; reversing the claim removes exactly 3000 so lifetime_savings_cents
          returns to 0 (its pre-adjudication value) with no drift.
        test_recipe:
          setup:
            - "DISCOUNT card, claim quantity=2 (savings 3000), no copay link; adjudicated so Member.lifetime_savings_cents==3000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
