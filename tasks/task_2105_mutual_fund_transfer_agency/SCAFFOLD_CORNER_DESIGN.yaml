          - "validations[priority=20]"
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "POST /nav-records is exclusive to FundAccountant, so a TransferAgentOperator holding a perfectly valid body is refused with 403 ERR_FORBIDDEN_ROLE and no NavRecord row is created."
        test_recipe:
          setup:
            - "One fund and one share class exist."
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Meridian Growth Fund", fund_family_code: "MER" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
