          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SUBSCRIPTION_STATE_INVALID"
            - "HTTP status is 409"
            - "Subscription.${sub_id}.anchor_date == 2026-06-08T00:00:00.000Z"

      - name: corner_cancelled_subscription_is_terminal_for_pauses
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Subscription.ACTIVE_to_CANCELLED", "validations[priority=22]", "errors[ERR_SUBSCRIPTION_STATE_INVALID]"]
