    - name: deposit_waterfall_fills_installments_then_pushes_the_residual
      claim_type: waterfall_allocation
      grounds:
      - calculations.deposit_schedule_allocation
      - entities.DepositInstallment.fields.amount_usd
      - entities.Contract.fields.deposit_total_usd
      excluded_because:
        difficulty_instance: deposit_schedule_per_installment_rounding_then_residual
        rationale: The waterfall claim - each 0.34/0.33/0.33 share rounded first and the leftover cent pushed onto the last installment so the three amounts sum exactly to deposit_total_usd - is the entire subject of that difficulty instance, including the 180/90/30-day due dates.
    - name: performance_weights_sum_to_one_without_rounding_drift
      claim_type: weighted_scoring
      grounds:
      - calculations.venue_performance_score
      - calculations.venue_performance_score.constants
      - entities.Venue.fields.performance_score
      excluded_because:
        difficulty_instance: venue_performance_recency_weighted_vs_simple_mean
        rationale: That difficulty instance already pins the 0.35/0.25/0.20/0.20 composite for three reviews and both aggregate variants to the cent, which is exactly the weights-sum / no-drift claim.
    - name: recency_decay_curve_restarts_from_the_newest_review
      claim_type: decay_function
      grounds:
      - calculations.venue_performance_score
      - calculations.venue_performance_score.constants.RECENCY_DECAY
      - entities.Venue.fields.performance_score
      excluded_because:
        difficulty_instance: venue_performance_recency_weighted_vs_simple_mean
        rationale: The 0.7 ** (rank - 1) decay over reviews ordered created_at DESC - and the re-ranking that happens when a newer review arrives - is asserted there across three captures.
    - name: contracted_and_actualized_bases_diverge_on_the_same_grid
      claim_type: Variant Divergence
      grounds:
      - calculations.proposal_total_cost_model.variants
      - entities.BidEvaluation.fields.total_cost_usd
      - entities.BidEvaluation.fields.attrition_damages_usd
      excluded_because:
        difficulty_instance: proposal_cost_contracted_basis_vs_actualized_basis
        rationale: Both variants are evaluated against the identical grid there, with the shrunken night count, the attrition damages and the signed delta between the two totals all pinned to literals.
    - name: only_the_contracted_basis_feeds_the_budget_and_rebate_reads
      claim_type: Variant Selection
      grounds:
      - calculations.proposal_total_cost_model.variants
      - entities.Proposal.fields.total_cost_contracted_usd
      - entities.Proposal.fields.last_evaluation_basis
      - validations[priority=63]
      excluded_because:
        difficulty_instance: proposal_cost_contracted_basis_vs_actualized_basis
        rationale: The selection claim - that total_cost_contracted_usd (and therefore the budget-ceiling check and the rebate tier) always uses CONTRACTED_BASIS no matter which basis was evaluated last - is asserted there via last_evaluation_basis ACTUALIZED_BASIS alongside an unchanged total_cost_contracted_usd.
