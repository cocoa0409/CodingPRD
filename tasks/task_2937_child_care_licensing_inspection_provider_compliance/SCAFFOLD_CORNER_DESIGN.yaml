              captures: { insp: $.data.id }
          trigger:
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_1: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-07T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { ins_2: $.data.id }
            - call: "POST /licensing/inspections/${ins_1}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins_1}", checklist_item_id: "${ci_su}", primary_age_group: "PRESCHOOL", narrative: "Nap room left unattended." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { vio: $.data.id }
            - call: "POST /licensing/violations/${vio}/disposition"
              payload: { disposition: "VACATED", vacated_reason: "Recorded against the wrong room." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { e_vac: $.data.error_id }
            - call: "POST /licensing/violations/${vio}/disposition"
              payload: { disposition: "VACATED", vacated_reason: "Recorded against the wrong room." }
              as: LicensingSupervisor
              captures: { vst: $.data.status }
          assert:
            - "Both ${ins_1} and ${ins_2} are created with HTTP 201 — POST /licensing/inspections is shared by LicensingSupervisor and AgencyAdmin, and the provider row itself was created by the AgencyAdmin under the same shared bullet"
            - "Inspector.${insp}.scheduled_visit_count == 2 and the two windows are two days apart, so no double-booking check fires"
            - "${e_vac} == ERR_UNAUTHORIZED with HTTP 403; Violation.${vio}.status is still CITED and Provider.${prov}.open_violation_points is still 15"
            - "${vst} == VACATED from the supervisor's identical body, and open_violation_points and lifetime_violation_points both return to 0"

      - name: rbac_segregation_of_duties_recent_inspector_cannot_investigate
        claim_type: segregation_of_duties
        grounds:
          - segregation_of_duties_rules[sod-investigator-not-recent-inspector]
          - validations.priority_18_ERR_SEGREGATION_OF_DUTIES
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - global_constants.SEGREGATION_LOOKBACK_MONTHS
        distinguishing_aspect: "The bar is per-inspector and per-provider, not per-role: the inspector who conducted this provider's FINALIZED visit four days ago is refused the investigator assignment with ERR_SEGREGATION_OF_DUTIES 403, while a second inspector of the same role and county takes the assignment immediately."
        test_recipe:
          setup:
            - "A provider with a cleared DIRECTOR, one FINALIZED ANNUAL inspection conducted by inspector 1 on 2026-08-06T09:00:00Z, a second untainted inspector, and one SCREENED_IN complaint at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
