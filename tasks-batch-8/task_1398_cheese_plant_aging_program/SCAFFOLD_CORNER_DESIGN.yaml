  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Request with no X-User-Role header returns ERR_UNAUTHENTICATED 401 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-230" }, as: "", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED"

      - name: existence_checked_after_authorization
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "validations[priority=3]"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "A MilkReceiver GET-ing a nonexistent plant: authorization for that endpoint includes MilkReceiver, so existence (p3) fires ERR_NOT_FOUND; but POST /plant/plants as MilkReceiver fails authorization (p2) even though the body references nothing — p2 beats everything below it."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/plants", payload: { name: "P", license_number: "WI-231" }, as: MilkReceiver, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHORIZED (p2 authorization before existence/state)"

      - name: stale_version_beats_state_on_occ_endpoints
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
