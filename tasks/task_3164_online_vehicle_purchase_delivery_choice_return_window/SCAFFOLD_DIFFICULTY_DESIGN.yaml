  - name: prequalification_zero_income_cap_zero
    grounds:
    - calculations.prequalification_terms
    - entities.FinancingPrequalification.fields.max_amount_cents
    distinguishing_aspect: 'Metric: max_amount_cents on POST financing/prequalify — a zero

      collection/degenerate-numeric edge, distinct from the mileage

      threshold. annual_income 0 yields income_cap 0, so

      max_amount_cents == 0 even for band A, and any financed structure

      against it fails with ERR_FINANCING_CAP_EXCEEDED.

      '
    test_recipe:
      setup:
      - customer with zero declared income; a LISTED vehicle and RESERVED order ready to structure
      setup_api_calls:
      - call: POST /vehicle-hub/customers
        payload:
          full_name: Zero U
