            - "${h_recovery} == 4500"
            - "${c_goodwill} == 0 and Member.${m_id}.point_balance == 14800 (10000 base + 4000 base + 800 SILVER bonus) - adjudication moves no points"

      - name: posting_a_platinum_stay_synthesizes_three_obligated_deliveries_and_two_ledger_entries
