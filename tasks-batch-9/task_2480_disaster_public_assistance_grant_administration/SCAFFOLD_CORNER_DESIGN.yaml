            - "Disaster.${disaster_id}.total_obligated_cents == 750000 and status == DECLARED"

      - name: cost_line_temporal_check_outranks_procurement_check
        claim_type: priority_conflict
        grounds:
          - validations[priority 10]
          - validations[priority 16]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cost_line_item_temporal_priority_beats_safety_priority
          rationale: "That §1.8 instance violates the incident-period rule and the procurement rule in one request and asserts ERR_OUTSIDE_INCIDENT_PERIOD wins."

      - name: project_submit_facility_check_outranks_applicant_check
        claim_type: priority_conflict
        grounds:
          - validations[priority 14]
          - validations[priority 19]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / project_submit_safety_priority_beats_referential_priority
          rationale: "That §1.8 instance submits with both an INELIGIBLE facility and an INELIGIBLE applicant and asserts ERR_FACILITY_INELIGIBLE wins."

      - name: drawdown_suspension_check_outranks_available_cash_check
        claim_type: priority_conflict
        grounds:
          - validations[priority 34]
          - validations[priority 35]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / drawdown_state_priority_beats_fiscal_priority
          rationale: "That §1.8 instance requests more than is available while the applicant is SUSPENDED and asserts ERR_DRAWDOWN_SUSPENDED wins."

      - name: drawdown_request_at_available_ceiling
        claim_type: aggregate_validation
        grounds:
          - validations[priority 35]
        excluded_because:
          difficulty_instance: boundary_precision_check / drawdown_request_exactly_equal_to_available_is_accepted
          rationale: "That §1.8 instance draws exactly available_drawdown_cents, then one cent more, asserting acceptance then ERR_DRAWDOWN_EXCEEDS_AVAILABLE."

      - name: labor_entry_rest_buffer_collision_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority 25]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / force_account_labor_rest_buffer_collision
          rationale: "That §1.8 instance walks the 30-minute rest buffer boundary on one LABOR resource and asserts ERR_LABOR_ENTRY_OVERLAP at exactly 30 minutes and acceptance at 31."

      - name: equipment_daily_hours_aggregate_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority 26]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / force_account_equipment_daily_hours_aggregate_capacity
          rationale: "That §1.8 instance sums equipment_hours per UTC day to exactly 16 and then past it, asserting ERR_EQUIPMENT_DAILY_HOURS_EXCEEDED."

      - name: incident_period_overlap_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority 24]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / incident_period_half_open_adjacency_allowed_overlap_rejected
          rationale: "That §1.8 instance declares an adjacent period (allowed) and a one-second overlap (ERR_INCIDENT_PERIOD_OVERLAP) for the same state and incident type."

      - name: rfi_round_ceiling_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority 27]
        excluded_because:
          difficulty_instance: non_linear_state_machine / project_rfi_cycle_bounded_at_two_rounds
          rationale: "That §1.8 instance exhausts MAX_RFI_ROUNDS and asserts ERR_RFI_ROUNDS_EXHAUSTED on the third issuance."

      - name: closeout_request_without_documented_costs_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority 37]
        excluded_because:
          difficulty_instance: boundary_precision_check / closeout_request_on_empty_documented_cost_set_rejected
          rationale: "That §1.8 instance requests closeout with no ALLOWED or PARTIALLY_ALLOWED line and asserts ERR_NO_DOCUMENTED_COSTS."

      - name: drawdown_blocked_while_applicant_suspended
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 34]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / drawdown_creation_blocked_by_suspended_applicant
          rationale: "That §1.8 instance suspends the applicant through a pending determination and asserts ERR_DRAWDOWN_SUSPENDED on creation."

      - name: appeal_blocked_while_determination_proposed
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 8]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / appeal_filing_blocked_by_unfinalized_determination
          rationale: "That §1.8 instance files against a PROPOSED determination and asserts ERR_DEOBLIGATION_NOT_FINAL."

      - name: obligate_blocked_after_declaration_closed
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 20]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / project_obligate_blocked_by_closed_declaration
          rationale: "That §1.8 instance closes obligations and asserts ERR_DISASTER_NOT_OPEN on a later obligation attempt."

      - name: close_obligations_blocked_by_open_reviews
        claim_type: aggregate_validation
        grounds:
          - validations[priority 22]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / close_obligations_blocked_by_open_project_review
          rationale: "That §1.8 instance leaves one project UNDER_REVIEW and asserts ERR_PROJECT_REVIEWS_OPEN."

  # ===========================================================================
  # §1.5 declares no bulk endpoint, so the guide's bulk_action row has no
  # instance; every other endpoint pattern present in §1.5 is covered here or
  # by the entities / state_machines sections above.
  - section: endpoints
    instances:
      - name: facility_crud_lifecycle_create_read_update_and_list
        claim_type: standard_crud
        grounds:
          - endpoints[POST /public-assistance/facilities]
          - endpoints[PATCH /public-assistance/facilities/{facility_id}]
          - endpoints[GET /public-assistance/facilities]
        distinguishing_aspect: "Facility is the only entity with a general-purpose PATCH: create, read, partial update and filtered list all work, the PATCH writes only the supplied flags, and no DELETE endpoint exists for any entity in §1.5."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z, declaration DR-4984 with one applicant."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4984", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_id: $.data.id }
            - call: "GET /public-assistance/facilities/${facility_id}"
              payload: {}
              as: ProgramSpecialist
              as_user_id: "spec-1"
            - call: "PATCH /public-assistance/facilities/${facility_id}"
              payload: { flood_zone: true }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
            - call: "GET /public-assistance/facilities?applicant_id=${applicant_id}"
              payload: {}
              as: StateAuditor
              as_user_id: "auditor-1"
          assert:
            - "create -> HTTP 201 with eligibility_status == PENDING, in_active_use == true, legal_responsibility_documented == true, flood_zone == false, version == 1"
            - "read -> HTTP 200 with the same id, name 'Riverside Pump Station', facility_type WATER_CONTROL and ownership PUBLIC"
            - "patch -> HTTP 200 with Facility.${facility_id}.flood_zone == true, in_active_use still true, eligibility_status still PENDING, version == 2"
            - "list filtered by applicant -> HTTP 200 with total_count == 1, has_more == false and one row whose id == ${facility_id}"
            - "no DELETE endpoint for /public-assistance/facilities/{facility_id} is declared in §1.5, so records are never removed"

      - name: reporting_sweep_action_endpoint_scores_the_monitoring_variant
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /public-assistance/applicants/{applicant_id}/reporting-sweep]
          - calculations.applicant_risk_score.variants[MONITORING]
          - entities.Applicant.fields.monitoring_scored_at
        distinguishing_aspect: "A sweep on an applicant with no reports and no obligations still runs: it writes risk_score_monitoring 6.00 and monitoring_scored_at while leaving risk_score_screening at its 12.00 screening value, and it creates no ProgressReport row."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z, declaration DR-4985."
            - "LOCAL_GOVERNMENT applicant with two facilities, determined ELIGIBLE (screening score 0.30*20 + 0.30*20 == 12.00)."
            - "No projects, no obligations, no progress reports."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4985", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Riverside Pump Station", facility_type: "WATER_CONTROL", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_1_id: $.data.id }
            - call: "POST /public-assistance/facilities"
              payload: { applicant_id: "${applicant_id}", name: "Main Street Bridge", facility_type: "ROAD", ownership: "PUBLIC" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { facility_2_id: $.data.id }
            - call: "POST /public-assistance/applicants/${applicant_id}/eligibility-determination"
              payload: { decision: "ELIGIBLE", rationale: "Local government inside the declared area" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /public-assistance/applicants/${applicant_id}/reporting-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP 200 with the Applicant row as the body"
            - "Applicant.${applicant_id}.risk_score_screening == 12.00 (unchanged by the sweep)"
            - "Applicant.${applicant_id}.risk_score_monitoring == 6.00 (0.30 * 20 with no delinquency and a zero cash ratio)"
            - "Applicant.${applicant_id}.monitoring_scored_at == '2026-07-01T00:00:00Z'"
            - "Applicant.${applicant_id}.risk_tier == LOW (the monitoring score now drives the tier)"
            - "Applicant.${applicant_id}.delinquent_report_count == 0 and drawdown_status == ACTIVE"
            - "GET /public-assistance/progress-reports?applicant_id=${applicant_id} -> total_count == 0 (a sweep never creates rows)"

