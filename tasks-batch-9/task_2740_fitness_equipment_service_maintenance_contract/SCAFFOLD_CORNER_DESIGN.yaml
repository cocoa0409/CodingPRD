            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-SH-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-SH-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ServiceCoordinator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ClubManager, as_user_id: "${club_id}", captures: { call_cm: "$.data.id", cm_status: "$.data.status" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", severity: "MINOR", symptom_code: "CONSOLE_DIM" }, as: ServiceCoordinator, captures: { call_sc: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_cm}/cancel", payload: { reason: "member resolved it" }, as: ServiceCoordinator, captures: { x1_status: "$.data.status" } }
            - { call: "POST /fleetcare/service-calls/${call_sc}/cancel", payload: { reason: "duplicate report" }, as: ClubManager, as_user_id: "${club_id}", captures: { x2_status: "$.data.status" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Ravi Shah", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ServiceCoordinator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "BELT-STD", category: "WEAR", unit_price_cents: 8000, initial_on_hand_qty: 5 }, as: ContractAdministrator, captures: { part_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment/${e1_id}/usage-readings", payload: { usage_hours: 610 }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { reading_hours: "$.data.usage_hours" } }
          assert:
            - "both calls are created with HTTP 201 and ${cm_status} == 'OPEN' — ClubManager and ServiceCoordinator share call filing"
            - "${x1_status} == 'CANCELLED' and ${x2_status} == 'CANCELLED' — each holder cancelled the other's row"
            - "${t2_id} is a fresh technician created with HTTP 201 by the coordinator, matching the administrator-created T1 in shape"
            - "${part_id} is created with HTTP 201 by the administrator on a PartsPlanner-shared endpoint"
            - "${reading_hours} == 610.00, posted by a field technician on an endpoint also open to the administrator and the coordinator"
            - "equipment creation succeeded from both ContractAdministrator and ServiceCoordinator, and model creation from PartsPlanner"

      - name: a_club_manager_is_confined_to_the_club_named_in_its_user_id
        claim_type: identity_scoped_operations
        grounds:
          - roles.ClubManager.identity_binding
          - validations[priority 3 ERR_CLUB_SCOPE_FORBIDDEN]
          - endpoints[GET /fleetcare/contracts/{contractId}/credit-summary]
        distinguishing_aspect: "The ClubManager role passes the priority-2 role gate and is then stopped one rung later by the priority-3 scope gate: the manager of club B is refused on club A's contract for both a write and a computed read, while the manager of club A sails through the very same requests."
        test_recipe:
          setup:
