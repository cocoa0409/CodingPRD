            - "Youth.${post_bo_id}.risk_posture == OPEN"
            - "Cy's admission returns HTTP 409 with error_id ERR_BED_CAPACITY_EXCEEDED"
            - "GET /ryhs/admissions?youth_id=${post_cy_id} returns total_count 0"
            - "ShelterProgram.${post_program_id}.occupied_beds == 1"
            - "ShelterProgram.${post_program_id}.waitlisted_count == 1"

  - rule_id: resource_temporal_overlap
    instances:
      - name: admission_half_open_occupancy_adjacency_on_the_youth_is_legal
        grounds:
          - validations[priority=27]
          - errors.ERR_ADMISSION_OVERLAP
          - calculations.admission_billable_nights
          - entities.Admission.fields.planned_discharge_at
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) with a zero buffer, and the contended resource is
          the YOUTH (capacity 1 occupancy across all programs). The identical request is rejected at
          the clock 2026-08-09T00:00:00Z, because [08-09, 08-20) still intersects the standing
          [08-01, 08-10), and accepted unchanged at the clock 2026-08-10T00:00:00Z, because
          new_start == prior_end is exact adjacency and half-open intervals do not include their end
          instant. Two distinct programs are used so that the same-program rule at priority 11 cannot
          mask the temporal rule at priority 27.
        test_recipe:
          setup:
            - "two EMERGENCY_SHELTER programs, 'Riverside Emergency Shelter' and 'Eastgate Emergency Shelter', each with licensed_bed_capacity 2 and band 12..17, so neither program is ever FROZEN during the test"
            - "youth Sam Oyelaran (dob 2010-03-15, age 16) with a CLEARED SafetyScreening"
            - "an ACTIVE Admission at Riverside with admitted_at 2026-08-01T00:00:00Z and planned_discharge_at 2026-08-10T00:00:00Z, giving the occupancy interval [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z)"
            - "that admission is never discharged, so its interval end stays at planned_discharge_at throughout"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { adj_p1_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Eastgate Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { adj_p2_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Sam", legal_last_name: "Oyelaran", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { sam_id: $.data.id }
            - call: "POST /ryhs/youths/${sam_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { sam_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${sam_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${sam_id}", program_id: "${adj_p1_id}", planned_discharge_at: "2026-08-10T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { sam_adm1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${sam_id}", program_id: "${adj_p2_id}", planned_discharge_at: "2026-08-20T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { sam_overlap_err_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${sam_id}", program_id: "${adj_p2_id}", planned_discharge_at: "2026-08-20T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { sam_adm2_id: $.data.id }
          assert:
            - "the attempt at the clock 2026-08-09T00:00:00Z returns HTTP 409 with error_id ERR_ADMISSION_OVERLAP"
            - "immediately after that attempt GET /ryhs/admissions?youth_id=${sam_id} returns total_count 1"
            - "the identical attempt at the clock 2026-08-10T00:00:00Z returns HTTP 201"
            - "Admission.${sam_adm2_id}.status == ACTIVE"
            - "Admission.${sam_adm2_id}.admitted_at == 2026-08-10T00:00:00Z"
            - "Admission.${sam_adm2_id}.projected_billable_nights == 10"
            - "Admission.${sam_adm1_id}.status == ACTIVE"
            - "Admission.${sam_adm1_id}.discharged_at == null"
            - "ShelterProgram.${adj_p1_id}.occupied_beds == 1"
            - "ShelterProgram.${adj_p2_id}.occupied_beds == 1"
            - "ShelterProgram.${adj_p2_id}.utilization_bp == 5000"
            - "ShelterProgram.${adj_p2_id}.posture == OPEN"
            - "Youth.${sam_id}.cumulative_shelter_nights == 0"
            - "GET /ryhs/admissions?youth_id=${sam_id} returns total_count 2"

      - name: mediation_closed_interval_touching_endpoints_on_the_case_collide
        grounds:
          - validations[priority=28]
          - errors.ERR_MEDIATION_SESSION_OVERLAP
          - entities.MediationSession.fields.scheduled_start_at
          - entities.MediationSession.fields.round_number
          - state_machines.ReunificationCase.MEDIATION_HELD_to_MEDIATION_SCHEDULED
        distinguishing_aspect: |
          Deliberately the opposite interval semantics on a different contended resource: CLOSED
          [start, end] windows on a ReunificationCase, where touching endpoints DO collide. A
          candidate starting exactly at the held session's scheduled_end_at is rejected with
          ERR_MEDIATION_SESSION_OVERLAP - the mirror image of the admission rule, where the same
          adjacency is legal - and moving the candidate start forward by a single second is enough to
          make it pass, which pins the comparison at second granularity. The held session is a
          multi-day intensive whose end lies past the 72-hour cooldown floor of 2026-08-06T15:00:00Z,
          so the cooldown rule at priority 29 is provably not what rejects the touching candidate.
        test_recipe:
          setup:
            - "youth Tao Bergstrom created at the default clock 2026-08-01T00:00:00Z with no admissions, so risk_posture is OPEN and the case may be opened"
            - "one ReunificationCase in status OPENED"
            - "one MediationSession scheduled 2026-08-03T14:00:00Z..2026-08-08T15:00:00Z - a five-day family mediation intensive - whose PROGRESS outcome is recorded at the clock 2026-08-03T15:00:00Z, so held_at is 2026-08-03T15:00:00Z, mediation_round becomes 1, the case is MEDIATION_HELD and the cooldown floor is 2026-08-06T15:00:00Z"
            - "every candidate window below starts at or after 2026-08-08T15:00:00Z, which is later than both the cooldown floor and the clock, so priorities 29 and 32 are satisfied by construction"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Tao", legal_last_name: "Bergstrom", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { tao_id: $.data.id, tao_v1: $.data.version }
            - call: "POST /ryhs/reunification-cases"
              payload: { youth_id: "${tao_id}", guardian_household_label: "Bergstrom household - grandmother", expected_youth_version: "${tao_v1}" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { tao_case_id: $.data.id }
            - call: "POST /ryhs/reunification-cases/${tao_case_id}/mediation-sessions"
              payload: { scheduled_start_at: "2026-08-03T14:00:00Z", scheduled_end_at: "2026-08-08T15:00:00Z" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { tao_s1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T15:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/mediation-sessions/${tao_s1_id}/record-outcome"
              payload: { outcome: "PROGRESS" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
          trigger:
            - call: "POST /ryhs/reunification-cases/${tao_case_id}/mediation-sessions"
              payload: { scheduled_start_at: "2026-08-08T15:00:00Z", scheduled_end_at: "2026-08-08T16:00:00Z" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { tao_touch_err_id: $.data.error_id }
            - call: "POST /ryhs/reunification-cases/${tao_case_id}/mediation-sessions"
              payload: { scheduled_start_at: "2026-08-08T15:00:01Z", scheduled_end_at: "2026-08-08T16:00:00Z" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { tao_s2_id: $.data.id, tao_s2_round: $.data.round_number }
          assert:
            - "the touching candidate returns HTTP 409 with error_id ERR_MEDIATION_SESSION_OVERLAP"
            - "the touching candidate does NOT return error_id ERR_MEDIATION_COOLDOWN_ACTIVE"
            - "immediately after the touching candidate GET /ryhs/reunification-cases/${tao_case_id}/mediation-sessions returns total_count 1"
            - "the one-second-later candidate returns HTTP 201"
            - "MediationSession.${tao_s2_id}.round_number == 2"
            - "MediationSession.${tao_s2_id}.scheduled_start_at == 2026-08-08T15:00:01Z"
            - "MediationSession.${tao_s2_id}.outcome == null"
            - "MediationSession.${tao_s2_id}.held_at == null"
            - "MediationSession.${tao_s1_id}.held_at == 2026-08-03T15:00:00Z"
            - "ReunificationCase.${tao_case_id}.status == MEDIATION_SCHEDULED"
            - "ReunificationCase.${tao_case_id}.mediation_round == 1"
            - "GET /ryhs/reunification-cases/${tao_case_id}/mediation-sessions returns total_count 2"

  - rule_id: compensating_invariant
    instances:
      - name: governance_vote_retraction_and_recast_restores_the_support_tally
        grounds:
          - entities.GovernanceProposal.fields.support_vote_count
          - entities.GovernanceVote.fields.status
          - calculations.governance_adoption_tally
          - validations[priority=38]
          - state_machines.GovernanceProposal
        distinguishing_aspect: |
          Conserved quantity: the proposal's COUNTED support tally, a pure count. Retracting a vote
          must decrement support_vote_count from 2 to 1 and stamp retracted_at while leaving the
          GovernanceVote row in place as RETRACTED, and re-casting must bring the tally back to
          exactly 2 - not to 3 - so the closed outcome is byte-identical to the never-retracted world:
          eligible_electorate_size 2, support_ratio_bp 10000, ADOPTED. Drift shows up either as a
          tally that never comes back down (retraction not compensated) or as a tally of 3 (the
          retracted row still counted alongside the replacement).
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program 'Riverside Emergency Shelter' with licensed_bed_capacity 2, band 12..17"
            - "youths Ana Petrov and Ben Halloran (both dob 2010-03-15, age 16) each have one OutreachContact with empty indicator_flags, so engagement_contact_count is 1"
            - "both youths have a CLEARED SafetyScreening and an ACTIVE Admission at that program, so Youth.status is SHELTERED and governance_vote_eligible is true for both; the program is then FROZEN at 2 of 2 beds, which does not affect voting"
            - "one GovernanceProposal opened by ProgramAdmin with voting_closes_at 2026-08-10T00:00:00Z, so the clock 2026-08-01T00:00:00Z is inside the voting window"
            - "the electorate is exactly these two residents, so ADOPTION_MIN_SUPPORT 2 and ADOPTION_RATIO_BP 5000 are both exactly reachable"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { gov_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ana", legal_last_name: "Petrov", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ana_id: $.data.id }
            - call: "POST /ryhs/youths/${ana_id}/outreach-contacts"
              payload: { engagement_stage: "TRUST_ESTABLISHED", basic_needs_provided: ["FOOD"], indicator_flags: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${ana_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ana_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${ana_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${ana_id}", program_id: "${gov_program_id}", planned_discharge_at: "2026-08-20T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ana_adm_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ben", legal_last_name: "Halloran", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ben_id: $.data.id }
            - call: "POST /ryhs/youths/${ben_id}/outreach-contacts"
              payload: { engagement_stage: "TRUST_ESTABLISHED", basic_needs_provided: ["HYGIENE_KIT"], indicator_flags: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${ben_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ben_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${ben_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${ben_id}", program_id: "${gov_program_id}", planned_discharge_at: "2026-08-20T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ben_adm_id: $.data.id }
            - call: "POST /ryhs/shelter-programs/${gov_program_id}/governance-proposals"
              payload: { title: "Rotating youth-led house meeting chair", category: "GRIEVANCE_PROCESS", voting_closes_at: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { gov_proposal_id: $.data.id }
          trigger:
            - call: "POST /ryhs/governance-proposals/${gov_proposal_id}/votes"
              payload: { stance: "SUPPORT" }
              as: YouthMember
              as_user_id: "${ana_id}"
              captures: { ana_vote1_id: $.data.id }
            - call: "POST /ryhs/governance-proposals/${gov_proposal_id}/votes"
              payload: { stance: "SUPPORT" }
              as: YouthMember
              as_user_id: "${ben_id}"
              captures: { ben_vote_id: $.data.id }
            - call: "POST /ryhs/governance-votes/${ana_vote1_id}/retract"
              payload: {}
              as: YouthMember
              as_user_id: "${ana_id}"
              captures: { ana_vote1_status: $.data.status, ana_vote1_retracted_at: $.data.retracted_at }
            - call: "POST /ryhs/governance-proposals/${gov_proposal_id}/votes"
              payload: { stance: "SUPPORT" }
              as: YouthMember
              as_user_id: "${ana_id}"
              captures: { ana_vote2_id: $.data.id }
            - call: "POST /ryhs/governance-proposals/${gov_proposal_id}/close-vote"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { gov_final_status: $.data.status, gov_ratio: $.data.support_ratio_bp }
          assert:
            - "Youth.${ana_id}.governance_vote_eligible == true"
            - "Youth.${ben_id}.governance_vote_eligible == true"
            - "after the two initial votes GovernanceProposal.${gov_proposal_id}.support_vote_count == 2"
            - "after the retraction GovernanceProposal.${gov_proposal_id}.support_vote_count == 1"
            - "GovernanceVote.${ana_vote1_id}.status == RETRACTED"
            - "GovernanceVote.${ana_vote1_id}.retracted_at == 2026-08-01T00:00:00Z"
            - "after the re-cast GovernanceProposal.${gov_proposal_id}.support_vote_count == 2"
            - "GovernanceVote.${ana_vote2_id}.status == COUNTED"
            - "GovernanceVote.${ben_vote_id}.status == COUNTED"
            - "GovernanceProposal.${gov_proposal_id}.oppose_vote_count == 0"
            - "GovernanceProposal.${gov_proposal_id}.eligible_electorate_size == 2"
            - "GovernanceProposal.${gov_proposal_id}.support_ratio_bp == 10000"
            - "GovernanceProposal.${gov_proposal_id}.status == ADOPTED"
            - "GovernanceProposal.${gov_proposal_id}.adopted_at == 2026-08-01T00:00:00Z"
            - "GovernanceProposal.${gov_proposal_id}.decided_by_user_id == admin-1"
            - "GET /ryhs/governance-proposals/${gov_proposal_id}/votes?status=COUNTED returns total_count 2"
            - "GET /ryhs/governance-proposals/${gov_proposal_id}/votes returns total_count 3"
            - "GET /ryhs/youths/${ana_id}/governance-votes returns total_count 2"

      - name: savings_reversal_restores_placement_balance_and_youth_lifetime_total
        grounds:
          - calculations.savings_match_award
          - entities.SavingsLedgerEntry.fields.signed_amount_cents
          - entities.TlpPlacement.fields.savings_balance_cents
          - entities.Youth.fields.lifetime_savings_deposited_cents
          - validations[priority=46]
        distinguishing_aspect: |
          A different conserved quantity - whole cents across two separate ledgers, the placement
          balance and the youth's lifetime deposit total - and it is conserved by compensation rather
          than by re-creation: the REVERSAL row is appended with signed_amount_cents -2000 AND
          match_component_cents -500, so the 2000-cent deposit and its 500-cent match both unwind and
          the balance returns to exactly 1263, the value it held before that deposit. The immutable
          ledger keeps all three rows, so a correct implementation shows total_count 3 with a restored
          balance; drift appears as 1763 (signed amount reversed, match left behind) or as a deleted
          row.
        test_recipe:
          setup:
            - "one TRANSITIONAL_LIVING program 'Northside Transitional Living' with band 16..20, savings_match_rate_bp 2500 and required_savings_rate_bp 2000"
            - "youth Zev Anand (dob 2010-03-15, age 16) with a CLEARED SafetyScreening"
            - "an EMERGENCY_SHELTER program (licensed_bed_capacity 2, band 12..17) and an ACTIVE Admission for the youth, whose 24-hour GuardianNotification is attempted once by PHONE and then resolved CONTACTED - this is the only reachable path to Youth.status SHELTERED with risk_posture OPEN, which state_machines.Youth requires before SHELTERED -> TLP_ENROLLED"
            - "TlpPlacement placed at 2026-08-01T00:00:00Z with documented_monthly_income_cents 90000, savings_balance_cents 0, match_awarded_cents 0, compliance_status IN_COMPLIANCE (so priority 45 never blocks a later withdrawal-shaped entry)"
            - "the clock never moves, so days_elapsed stays 0, required_savings_cents stays 0 and no review is needed"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { zev_shelter_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { zev_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Zev", legal_last_name: "Anand", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { zev_id: $.data.id }
            - call: "POST /ryhs/youths/${zev_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { zev_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${zev_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${zev_id}", program_id: "${zev_shelter_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { zev_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${zev_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { zev_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${zev_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${zev_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${zev_id}", program_id: "${zev_program_id}", documented_monthly_income_cents: 90000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { zev_plc_id: $.data.id, zev_v1: $.data.version }
          trigger:
            - call: "POST /ryhs/tlp-placements/${zev_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1010, expected_placement_version: "${zev_v1}", source_note: "week 1 wages" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { zev_e1_id: $.data.id, zev_e1_balance: $.data.balance_after_cents }
            - call: "GET /ryhs/tlp-placements/${zev_plc_id}"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { zev_v2: $.data.version }
            - call: "POST /ryhs/tlp-placements/${zev_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 2000, expected_placement_version: "${zev_v2}", source_note: "week 2 wages posted in error" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { zev_e2_id: $.data.id, zev_e2_balance: $.data.balance_after_cents }
            - call: "GET /ryhs/tlp-placements/${zev_plc_id}"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { zev_v3: $.data.version }
            - call: "POST /ryhs/tlp-placements/${zev_plc_id}/savings-entries"
              payload: { entry_type: "REVERSAL", amount_cents: 2000, expected_placement_version: "${zev_v3}", source_note: "reverse the erroneous week 2 posting" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { zev_e3_id: $.data.id, zev_e3_balance: $.data.balance_after_cents }
          assert:
            - "SavingsLedgerEntry.${zev_e1_id}.signed_amount_cents == 1010"
            - "SavingsLedgerEntry.${zev_e1_id}.match_component_cents == 253"
            - "SavingsLedgerEntry.${zev_e1_id}.balance_after_cents == 1263"
            - "SavingsLedgerEntry.${zev_e2_id}.signed_amount_cents == 2000"
            - "SavingsLedgerEntry.${zev_e2_id}.match_component_cents == 500"
            - "SavingsLedgerEntry.${zev_e2_id}.balance_after_cents == 3763"
            - "SavingsLedgerEntry.${zev_e3_id}.signed_amount_cents == -2000"
            - "SavingsLedgerEntry.${zev_e3_id}.match_component_cents == -500"
            - "SavingsLedgerEntry.${zev_e3_id}.balance_after_cents == 1263"
            - "TlpPlacement.${zev_plc_id}.savings_balance_cents == 1263"
            - "TlpPlacement.${zev_plc_id}.match_awarded_cents == 253"
            - "TlpPlacement.${zev_plc_id}.compliance_status == IN_COMPLIANCE"
            - "Youth.${zev_id}.lifetime_savings_deposited_cents == 1010"
            - "GET /ryhs/tlp-placements/${zev_plc_id}/savings-entries returns total_count 3"
