      - name: state_gate_outranks_the_fiscal_gates_on_a_decision
        claim_type: priority_conflict
        grounds:
          - validations[priority 12 ERR_INVALID_BID_STATE]
          - validations[priority 36 ERR_FUND_INSUFFICIENT]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / invalid_bid_state_priority_12_outranks_fund_insufficient_priority_36"
          rationale: "That instance violates both rules in one call and asserts the returned error is ERR_INVALID_BID_STATE with neither fiscal error surfacing."

      - name: segregation_of_duties_outranks_the_cap_check
        claim_type: priority_conflict
        grounds:
