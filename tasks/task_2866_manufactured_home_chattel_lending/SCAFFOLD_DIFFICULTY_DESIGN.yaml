              as: ClosingAgent
              captures: { err_lot: "$.data.error_id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0470003", manufacturer: "Clayton", model_year: 2019, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c16}", lot_number: "B-08", placement_start_date: "2027-01-06T00:00:00Z" }
