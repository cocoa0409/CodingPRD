# =============================================================================
# Task 1901 — Corporate Entity Management & Subsidiary Governance
# Corporate secretary office: entity registry, filing calendar, resolutions,
# formation/dissolution, foreign qualification, signature authority, ownership
# chart, good-standing certificates.
# =============================================================================

scenario: |
  1901. Corporate Entity Management & Subsidiary Governance (corporate secretary office): entity registry with jurisdiction/officers/registered agent, annual report & franchise filing calendar, officer/director appointment & resignation resolutions, entity formation & dissolution workflow, foreign qualification & withdrawal, signature authority matrix & delegation, org chart & ownership percentage maintenance, good-standing certificate procurement

domain_name: corporate-entity-governance
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency        # OCC on LegalEntity.version for resolution adoption and ownership creation
    - cascading_side_effects        # RA resignation -> posture -> qualification revocation -> filing withdrawal; dissolution -> appointments -> grants -> delegated grants
    - dual_variant_calculation      # franchise tax ESTIMATED vs ACTUAL; ownership DIRECT vs LOOK_THROUGH
    - scheduled_actions             # resolution effective_date materialization, sweep-driven clock transitions
  entity_topology: graph            # self-referential ownership DAG across LegalEntity + cross-aggregate references
  state_machine_shape: cyclic       # Resolution return-for-revision loop, Grant suspend/reinstate loop, Qualification abort-withdrawal loop, Filing reject/re-prepare loop, Entity dissolution-revocation loop
  relationship_patterns:
    - one_to_many
    - self_referential              # OwnershipRecord parent->subsidiary DAG; SignatureAuthorityGrant.delegated_from_grant_id
    - cross_aggregate               # grants reference officers/appointments; filings reference jurisdictions
  role_model: segregation_of_duties # drafter != adopter; submitter != acceptor; suspender != reinstater
  consistency_model: immediate      # every mutation + cascade visible in the same request's response/read-after-write

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# Common clock semantics (apply to every entity and state machine below):
#  - The server maintains a logical clock. On startup and before any
#    POST /_clock/set_current_utc call, the logical clock reads exactly
#    2026-08-01T00:00:00Z (never the wall clock).
#  - Fields typed "date" are ISO calendar dates "YYYY-MM-DD"; date comparisons
#    use the calendar date of the logical clock in UTC.
#  - Time-driven transitions (filing OVERDUE, resolution EFFECTIVE, grant
#    EXPIRED, certificate EXPIRED, posture recomputation) materialize (a) when
#    POST /_system/sweep runs, and (b) lazily whenever the affected resource is
#    returned by a GET-by-id or is the target of a mutation. Both paths apply
#    the identical rule against the logical clock.
entities:
  - name: LegalEntity
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the entity" }
      - { name: entity_type, type: enum, source: input, description: "CORPORATION | LLC | LIMITED_PARTNERSHIP | NONPROFIT_CORPORATION" }
      - { name: formation_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction of formation" }
      - { name: formation_date, type: string, source: input, description: "ISO date of formation filing; base for anniversary due dates and first filing period" }
      - { name: fiscal_year_end_month, type: integer, source: input, default: 12, description: "1-12; fiscal year end month" }
      - { name: authorized_shares, type: integer, source: input, default: 0, description: "Current authorized share capital; franchise tax base; changed via PATCH while status == ACTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | FORMATION_PENDING | ACTIVE | DISSOLUTION_PENDING | DISSOLVED" }
      - { name: compliance_posture, type: enum, source: computed, description: "GOOD_STANDING | DELINQUENT | SUSPENDED | FORFEITED; derived per calculation compliance_posture_derivation on every read/sweep" }
      - { name: suspended_since, type: string, source: system, description: "ISO date when the current continuous SUSPENDED condition began; null when not SUSPENDED; cleared when suspension condition clears" }
      - { name: fees_accrued_cents, type: integer, source: computed, default: 0, description: "Ledger of assessed filing fees; invariant: == sum(AnnualFiling.fee_cents) over filings of this entity with status IN {SUBMITTED, ACCEPTED}" }
      - { name: dissolved_date, type: string, source: system, description: "ISO date of DISSOLVED transition; null otherwise" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique jurisdiction code, e.g. US-DE" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: annual_report_due_rule, type: enum, source: input, description: "FIXED_MONTH_DAY | FORMATION_ANNIVERSARY" }
      - { name: annual_report_due_month, type: integer, source: input, description: "1-12; required iff annual_report_due_rule == FIXED_MONTH_DAY, else must be null" }
      - { name: annual_report_due_day, type: integer, source: input, description: "1-31; required iff annual_report_due_rule == FIXED_MONTH_DAY, else must be null" }
      - { name: grace_period_days, type: integer, source: input, description: "Days after due_date before late penalty accrues; >= 0" }
      - { name: franchise_tax_method, type: enum, source: input, description: "SHARES_TIERED | FLAT | NONE; NONE suppresses FRANCHISE_TAX filing generation" }
      - { name: late_penalty_base_cents, type: integer, source: input, description: "Flat late-fee base component, >= 0" }
      - { name: late_penalty_cap_cents, type: integer, source: input, description: "Late-fee cap per filing, >= base" }
      - { name: penalty_day_counting, type: enum, source: input, description: "CALENDAR_DAYS | BUSINESS_DAYS; selects the days_late counting variant (weekends excluded for BUSINESS_DAYS)" }
      - { name: report_fee_cents, type: integer, source: input, description: "Filing fee snapshotted onto each generated AnnualFiling.report_fee_cents" }
      - { name: cert_fee_cents, type: integer, source: input, description: "Good-standing certificate STANDARD fee; EXPEDITED = round_half_up(cert_fee_cents * 1.5)" }
      - { name: ra_resignation_notice_days, type: integer, source: input, description: "Registered-agent resignation notice period; AgentAppointment.effective_end_date = notice_date + this many calendar days" }
      - { name: forfeiture_window_days, type: integer, source: input, description: "Continuous SUSPENDED days after which posture becomes FORFEITED" }

  - name: RegisteredAgent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agent company name" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction the agent is authorized in" }
      - { name: address, type: string, source: input, description: "Registered office address" }

  - name: Officer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Person's full legal name" }
      - { name: email, type: string, source: input, description: "Unique email; duplicate rejected with ERR_DUPLICATE_OFFICER" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEACTIVATED; DEACTIVATED officers cannot be appointed" }

  - name: AgentAppointment
    parent: LegalEntity
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: system, description: "FK -> LegalEntity.id; from path" }
      - { name: agent_id, type: string, source: input, description: "FK -> RegisteredAgent.id; agent.jurisdiction_id must equal jurisdiction_id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction this appointment covers" }
      - { name: start_date, type: string, source: input, description: "ISO date coverage begins" }
      - { name: notice_date, type: string, source: system, description: "ISO date resignation notice was filed; null while ACTIVE" }
      - { name: effective_end_date, type: string, source: computed, description: "= notice_date + jurisdiction.ra_resignation_notice_days; null while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | NOTICE_PENDING | RESIGNED" }

  - name: Resolution
    parent: LegalEntity
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: system, description: "FK -> LegalEntity.id; from path" }
      - { name: resolution_type, type: enum, source: input, description: "AUTHORIZE_FORMATION | AUTHORIZE_DISSOLUTION | REVOKE_DISSOLUTION | AUTHORIZE_QUALIFICATION | AUTHORIZE_WITHDRAWAL | APPOINT_OFFICER | REMOVE_OFFICER | ACCEPT_RESIGNATION | GRANT_SIGNATURE_AUTHORITY | REVOKE_SIGNATURE_AUTHORITY" }
      - { name: payload, type: object, source: input, description: "Type-specific: APPOINT_OFFICER {officer_id, office_title, start_date}; REMOVE_OFFICER/ACCEPT_RESIGNATION {appointment_id}; AUTHORIZE_QUALIFICATION/AUTHORIZE_WITHDRAWAL {jurisdiction_id}; GRANT_SIGNATURE_AUTHORITY {officer_id, scope}; REVOKE_SIGNATURE_AUTHORITY {grant_id}; authorization types {}" }
      - { name: effective_date, type: string, source: input, description: "ISO date on which an ADOPTED resolution materializes to EFFECTIVE at sweep/lazy evaluation" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the creator; recorded at POST" }
      - { name: adopted_by_user_id, type: string, source: system, description: "X-User-ID of the adopter; null until ADOPTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ADOPTED | EFFECTIVE | WITHDRAWN | RESCINDED" }

  - name: OfficerAppointment
    parent: LegalEntity
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: system, description: "FK -> LegalEntity.id" }
      - { name: officer_id, type: string, source: system, description: "FK -> Officer.id; from resolution payload" }
      - { name: resolution_id, type: string, source: system, description: "FK -> Resolution.id; the APPOINT_OFFICER resolution that created this appointment" }
      - { name: office_title, type: enum, source: system, description: "PRESIDENT | SECRETARY | TREASURER | CEO | CFO | DIRECTOR; single-holder titles are PRESIDENT, SECRETARY, TREASURER" }
      - { name: start_date, type: string, source: system, description: "ISO date from resolution payload" }
      - { name: end_date, type: string, source: system, description: "ISO date the appointment ended; null while APPOINTED" }
      - { name: status, type: enum, source: system, description: "APPOINTED | RESIGNED | REMOVED" }

  - name: AnnualFiling
    parent: LegalEntity
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: system, description: "FK -> LegalEntity.id" }
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id" }
      - { name: filing_type, type: enum, source: system, description: "ANNUAL_REPORT | FRANCHISE_TAX" }
      - { name: period_year, type: integer, source: system, description: "Fiscal period year; first period = year(formation_date) + 1" }
      - { name: due_date, type: string, source: computed, description: "Per calculation filing_due_date" }
      - { name: report_fee_cents, type: integer, source: system, description: "Snapshot of jurisdiction.report_fee_cents at generation" }
      - { name: shares_basis, type: integer, source: system, description: "Share count used for the ESTIMATED tax variant (prior ACCEPTED FRANCHISE_TAX shares_basis, else formation authorized_shares)" }
      - { name: tax_estimated_cents, type: integer, source: computed, description: "ESTIMATED franchise tax computed at prepare; null until PREPARED; 0 for ANNUAL_REPORT" }
      - { name: tax_assessed_cents, type: integer, source: computed, description: "ACTUAL franchise tax from entity.authorized_shares at submit; null until first submit; 0 for ANNUAL_REPORT" }
      - { name: submitted_date, type: string, source: system, description: "ISO date of latest SUBMITTED transition; null until first submit" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of latest submitter" }
      - { name: days_late, type: integer, source: computed, description: "Per calculation late_filing_penalty; 0 when submitted on/before due_date + grace_period_days" }
      - { name: penalty_cents, type: integer, source: computed, description: "Per calculation late_filing_penalty; 0 when days_late == 0" }
      - { name: fee_cents, type: integer, source: computed, description: "= report_fee_cents + tax_assessed_cents + penalty_cents at latest submit" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PREPARED | OVERDUE | SUBMITTED | ACCEPTED | REJECTED | WITHDRAWN" }

  - name: ForeignQualification
    parent: LegalEntity
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: system, description: "FK -> LegalEntity.id; from path" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; must differ from formation jurisdiction" }
      - { name: agent_appointment_id, type: string, source: input, description: "FK -> AgentAppointment.id; appointment covering (entity, jurisdiction) with status == ACTIVE" }
      - { name: qualified_date, type: string, source: system, description: "ISO date of QUALIFIED transition; null until confirmed" }
      - { name: status, type: enum, source: system, description: "PENDING | QUALIFIED | WITHDRAWAL_PENDING | WITHDRAWN | REVOKED" }

  - name: SignatureAuthorityGrant
    parent: LegalEntity
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: system, description: "FK -> LegalEntity.id; from path" }
      - { name: officer_id, type: string, source: input, description: "FK -> Officer.id; must hold an APPOINTED OfficerAppointment at this entity" }
      - { name: scope, type: enum, source: input, description: "BANKING | CONTRACTS | TAX_FILINGS | GOVERNMENT_FILINGS" }
      - { name: max_amount_cents, type: integer, source: input, description: "Authority ceiling; > 0; authorized when amount_cents <= effective limit" }
      - { name: effective_date, type: string, source: input, description: "ISO date window start, inclusive" }
      - { name: expiry_date, type: string, source: input, description: "ISO date window end, exclusive; must be > effective_date; window is half-open [effective_date, expiry_date)" }
      - { name: delegated_from_grant_id, type: string, source: input, description: "FK -> SignatureAuthorityGrant.id; null for direct grants; delegator must be a direct grant (depth <= 2)" }
      - { name: source_resolution_id, type: string, source: system, description: "FK -> Resolution.id; the GRANT_SIGNATURE_AUTHORITY resolution authorizing this grant" }
      - { name: suspended_by_user_id, type: string, source: system, description: "X-User-ID of the suspender; null unless SUSPENDED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED | EXPIRED" }

  - name: GoodStandingCertificate
    parent: LegalEntity
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: system, description: "FK -> LegalEntity.id; from path" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: delivery_speed, type: enum, source: input, description: "STANDARD | EXPEDITED; selects certificate_fee variant" }
      - { name: fee_cents, type: integer, source: computed, description: "STANDARD: jurisdiction.cert_fee_cents; EXPEDITED: round_half_up(cert_fee_cents * 1.5)" }
      - { name: requested_date, type: string, source: system, description: "ISO date of request" }
      - { name: issued_date, type: string, source: system, description: "ISO date of ISSUED transition; null until issued" }
      - { name: valid_until, type: string, source: computed, description: "= issued_date + 90 calendar days; null until issued" }
      - { name: denial_reason, type: string, source: system, description: "Manual reason or POSTURE_LOST when auto-denied by posture drop; null unless DENIED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ISSUED | DENIED | EXPIRED" }

  - name: OwnershipRecord
    parent: null
    common_fields: true
    fields:
      - { name: parent_entity_id, type: string, source: input, description: "FK -> LegalEntity.id; owning entity" }
      - { name: subsidiary_entity_id, type: string, source: input, description: "FK -> LegalEntity.id; owned entity; must differ from parent_entity_id" }
      - { name: percentage_bps, type: integer, source: input, description: "Ownership share in basis points, 1..10000 (10000 == 100%)" }
      - { name: effective_date, type: string, source: input, description: "ISO date window start, inclusive" }
      - { name: end_date, type: string, source: system, description: "ISO date window end, exclusive; set when superseded; null = open-ended; window is half-open [effective_date, end_date)" }
      - { name: supersedes_record_id, type: string, source: input, description: "FK -> OwnershipRecord.id; record being corrected/superseded; null for initial records" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | VOIDED" }

  - name: ComplianceEvent
    parent: LegalEntity
    common_fields: false   # append-only audit log: id, created_at only
    fields:
      - { name: entity_id, type: string, source: system, description: "FK -> LegalEntity.id" }
      - { name: event_type, type: enum, source: system, description: "POSTURE_CHANGED | FILING_OVERDUE | FILING_WITHDRAWN | QUALIFICATION_REVOKED | GRANT_REVOKED | CERTIFICATE_DENIED | OFFICER_REMOVED | OFFICER_RESIGNED | AGENT_RESIGNED | DISSOLUTION_COMMENCED | DISSOLUTION_COMPLETED | RESOLUTION_EFFECTIVE_BLOCKED" }
      - { name: payload, type: object, source: system, description: "Event detail, e.g. {from_posture, to_posture}, {filing_id}, {grant_id}, {qualification_id}, {appointment_id}" }
      - { name: occurred_at, type: string, source: system, description: "ISO 8601 UTC timestamp from the logical clock" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LegalEntity
    initial_state: DRAFT
    terminal_states: [DISSOLVED]
    transitions:
      - from: DRAFT
        to: FORMATION_PENDING
        trigger: "POST /api/entities/{entityId}/submit-formation"
        actor: CorporateSecretary
        preconditions:
          - "status == DRAFT (else ERR_ENTITY_NOT_DRAFT)"
          - "An AUTHORIZE_FORMATION resolution for this entity exists with status IN {ADOPTED, EFFECTIVE} (else ERR_REQUIRED_RESOLUTION_MISSING)"
        side_effects:
          - "increments LegalEntity.version by 1"
      - from: FORMATION_PENDING
        to: ACTIVE
        trigger: "POST /api/entities/{entityId}/confirm-formation"
        actor: CorporateSecretary
        preconditions:
          - "status == FORMATION_PENDING (else ERR_ENTITY_NOT_FORMATION_PENDING)"
          - "An AgentAppointment covering (entity, formation_jurisdiction) exists with status IN {ACTIVE, NOTICE_PENDING} and start_date <= current logical date (else ERR_AGENT_COVERAGE_GAP)"
        side_effects:
          - "compliance_posture recomputed (GOOD_STANDING on clean formation)"
          - "generates AnnualFiling rows for formation jurisdiction, period_year = year(formation_date) + 1: one ANNUAL_REPORT always, plus one FRANCHISE_TAX iff jurisdiction.franchise_tax_method != NONE"
          - "increments LegalEntity.version by 1"
      - from: ACTIVE
        to: DISSOLUTION_PENDING
        trigger: "POST /api/entities/{entityId}/commence-dissolution"
        actor: CorporateSecretary
        preconditions:
          - "status == ACTIVE (else ERR_ENTITY_NOT_ACTIVE)"
          - "An AUTHORIZE_DISSOLUTION resolution exists with status IN {ADOPTED, EFFECTIVE} (else ERR_REQUIRED_RESOLUTION_MISSING)"
          - "Every ForeignQualification of this entity has status IN {WITHDRAWN, REVOKED} (else ERR_OPEN_QUALIFICATIONS_EXIST)"
        side_effects:
          - "All AnnualFiling rows of this entity with status IN {SCHEDULED, PREPARED} -> WITHDRAWN (winding down cancels future obligations); each withdrawal appends ComplianceEvent(FILING_WITHDRAWN)"
          - "ComplianceEvent(DISSOLUTION_COMMENCED) appended"
          - "increments LegalEntity.version by 1"
      - from: DISSOLUTION_PENDING
        to: ACTIVE
        trigger: "POST /api/entities/{entityId}/revoke-dissolution"
        actor: CorporateSecretary
        preconditions:
          - "status == DISSOLUTION_PENDING (else ERR_ENTITY_NOT_DISSOLUTION_PENDING)"
          - "A REVOKE_DISSOLUTION resolution exists with status IN {ADOPTED, EFFECTIVE} (else ERR_REQUIRED_RESOLUTION_MISSING)"
        side_effects:
          - "compliance_posture recomputed"
          - "increments LegalEntity.version by 1"
        note: "Cycle: ACTIVE -> DISSOLUTION_PENDING -> ACTIVE. Filings WITHDRAWN at commencement stay WITHDRAWN; new periods are generated only by future ACCEPTED-driven rollovers (none while none ACCEPTED)."
      - from: DISSOLUTION_PENDING
        to: DISSOLVED
        trigger: "POST /api/entities/{entityId}/finalize-dissolution"
        actor: CorporateSecretary
        preconditions:
          - "status == DISSOLUTION_PENDING (else ERR_ENTITY_NOT_DISSOLUTION_PENDING)"
          - "No AnnualFiling of this entity with status IN {SCHEDULED, PREPARED, OVERDUE, SUBMITTED, REJECTED} (else ERR_DISSOLUTION_BLOCKED)"
          - "No GoodStandingCertificate of this entity with status == REQUESTED (else ERR_DISSOLUTION_BLOCKED)"
        side_effects:
          - "dissolved_date := current logical date"
          - "Cascade hop 1: every OfficerAppointment of this entity with status == APPOINTED -> REMOVED, end_date := current logical date; each appends ComplianceEvent(OFFICER_REMOVED)"
          - "Cascade hop 2: for each appointment removed in hop 1, every SignatureAuthorityGrant of this entity with officer_id == appointment.officer_id and status IN {ACTIVE, SUSPENDED} -> REVOKED; each appends ComplianceEvent(GRANT_REVOKED)"
          - "Cascade hop 3: every SignatureAuthorityGrant whose delegated_from_grant_id references a grant revoked in hop 2 and whose status IN {ACTIVE, SUSPENDED} -> REVOKED; each appends ComplianceEvent(GRANT_REVOKED)"
          - "ComplianceEvent(DISSOLUTION_COMPLETED) appended"
          - "compliance_posture recomputed"
          - "increments LegalEntity.version by 1"

  - entity: Resolution
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, WITHDRAWN, RESCINDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/resolutions/{resolutionId}/submit"
        actor: "CorporateSecretary or FilingCoordinator"
        preconditions:
          - "status == DRAFT (else ERR_RESOLUTION_NOT_DRAFT)"
          - "LegalEntity.status != DISSOLVED (else ERR_ENTITY_ALREADY_DISSOLVED)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /api/resolutions/{resolutionId}/return"
        actor: CorporateSecretary
        preconditions:
          - "status == SUBMITTED (else ERR_RESOLUTION_NOT_SUBMITTED)"
        side_effects: []
        note: "Cycle: DRAFT -> SUBMITTED -> DRAFT (return for revision); loop count unbounded."
      - from: SUBMITTED
        to: ADOPTED
        trigger: "POST /api/resolutions/{resolutionId}/adopt"
        actor: CorporateSecretary
        preconditions:
          - "status == SUBMITTED (else ERR_RESOLUTION_NOT_SUBMITTED)"
          - "request body expected_entity_version == current LegalEntity.version (else ERR_STALE_VERSION, 412; see concurrency_rules)"
          - "Segregation of duties: X-User-ID != drafted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "For APPOINT_OFFICER: payload.officer_id references an Officer with status == ACTIVE (else ERR_OFFICER_NOT_ACTIVE)"
          - "For APPOINT_OFFICER with office_title IN {PRESIDENT, SECRETARY, TREASURER}: no other OfficerAppointment of this entity with the same office_title and status == APPOINTED (else ERR_OFFICE_OCCUPIED)"
        side_effects:
          - "adopted_by_user_id := X-User-ID"
          - "increments LegalEntity.version by 1"
      - from: ADOPTED
        to: EFFECTIVE
        trigger: "system (sweep/lazy evaluation when current logical date >= effective_date)"
        actor: system
        preconditions:
          - "status == ADOPTED"
          - "current logical date >= effective_date"
        side_effects:
          - "APPOINT_OFFICER: create OfficerAppointment(entity, payload.officer_id, payload.office_title, payload.start_date, resolution_id, status APPOINTED); if a same-title single-holder appointment with status == APPOINTED now exists, the resolution stays ADOPTED and ComplianceEvent(RESOLUTION_EFFECTIVE_BLOCKED) is appended instead"
          - "REMOVE_OFFICER: payload appointment APPOINTED -> REMOVED (end_date := effective_date); then grant cascade: that officer's grants at this entity with status IN {ACTIVE, SUSPENDED} -> REVOKED, then delegated grants of those -> REVOKED; each appends ComplianceEvent"
          - "ACCEPT_RESIGNATION: payload appointment APPOINTED -> RESIGNED (end_date := effective_date); same grant cascade as REMOVE_OFFICER"
          - "REVOKE_SIGNATURE_AUTHORITY: payload grant with status IN {ACTIVE, SUSPENDED} -> REVOKED, then its delegated grants -> REVOKED; each appends ComplianceEvent(GRANT_REVOKED)"
          - "AUTHORIZE_* / REVOKE_DISSOLUTION / GRANT_SIGNATURE_AUTHORITY: no record mutation at EFFECTIVE (they authorize action endpoints; ADOPTED already suffices for those checks)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/resolutions/{resolutionId}/withdraw"
        actor: "CorporateSecretary or FilingCoordinator"
        preconditions:
          - "status == DRAFT (else ERR_RESOLUTION_NOT_DRAFT)"
        side_effects: []
      - from: ADOPTED
        to: RESCINDED
        trigger: "POST /api/resolutions/{resolutionId}/rescind"
        actor: CorporateSecretary
        preconditions:
          - "status IN {ADOPTED, EFFECTIVE} (else ERR_RESOLUTION_NOT_ADOPTED)"
          - "If status == EFFECTIVE: resolution_type must be IN {APPOINT_OFFICER, GRANT_SIGNATURE_AUTHORITY} (else ERR_RESOLUTION_NOT_RESCINDABLE)"
        side_effects:
          - "Compensation for EFFECTIVE APPOINT_OFFICER: the created appointment -> REMOVED with end_date := current logical date; grant cascade as in REMOVE_OFFICER"
          - "Compensation for EFFECTIVE or ADOPTED GRANT_SIGNATURE_AUTHORITY: every SignatureAuthorityGrant with source_resolution_id == this resolution and status IN {ACTIVE, SUSPENDED} -> REVOKED, then their delegated grants -> REVOKED; each appends ComplianceEvent(GRANT_REVOKED)"
          - "increments LegalEntity.version by 1"

  - entity: OfficerAppointment
    initial_state: APPOINTED
    terminal_states: [RESIGNED, REMOVED]
    transitions:
      - from: APPOINTED
        to: RESIGNED
        trigger: "POST /api/officer-appointments/{appointmentId}/resign"
        actor: AuthorizedOfficer
        preconditions:
          - "status == APPOINTED (else ERR_APPOINTMENT_NOT_APPOINTED)"
          - "X-User-ID == appointment.officer_id (else ERR_FORBIDDEN_ACTOR)"
        side_effects:
          - "end_date := current logical date"
          - "Grant cascade: officer's SignatureAuthorityGrants at this entity with status IN {ACTIVE, SUSPENDED} -> REVOKED, then their delegated grants -> REVOKED; each appends ComplianceEvent(GRANT_REVOKED)"
          - "ComplianceEvent(OFFICER_RESIGNED) appended"
      - from: APPOINTED
        to: REMOVED
        trigger: "system (REMOVE_OFFICER resolution EFFECTIVE, dissolution finalize, or APPOINT_OFFICER rescission compensation)"
        actor: system
        preconditions: []
        side_effects:
          - "end_date := effective/current date per triggering transition"
          - "Same grant cascade as RESIGNED"
          - "ComplianceEvent(OFFICER_REMOVED) appended"

  - entity: AnnualFiling
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: SCHEDULED
        to: PREPARED
        trigger: "POST /api/filings/{filingId}/prepare"
        actor: "FilingCoordinator or CorporateSecretary"
        preconditions:
          - "status IN {SCHEDULED, OVERDUE, REJECTED} after lazy OVERDUE evaluation (else ERR_FILING_NOT_PREPARED)"
          - "LegalEntity.status IN {ACTIVE, DISSOLUTION_PENDING} (else ERR_ENTITY_NOT_ACTIVE)"
        side_effects:
          - "runs calculation franchise_tax (ESTIMATED variant): sets shares_basis and tax_estimated_cents (0 for ANNUAL_REPORT)"
        note: "REJECTED -> PREPARED is the revision cycle. Preparing an OVERDUE filing returns it to PREPARED; if it is still past due_date, the next lazy/sweep evaluation flips it back to OVERDUE. The prepare response reports the post-transition status (PREPARED)."
      - from: PREPARED
        to: SUBMITTED
        trigger: "POST /api/filings/{filingId}/submit"
        actor: "FilingCoordinator or CorporateSecretary"
        preconditions:
          - "status IN {PREPARED, OVERDUE} (else ERR_FILING_NOT_PREPARED)"
          - "LegalEntity.status IN {ACTIVE, DISSOLUTION_PENDING} (else ERR_ENTITY_NOT_ACTIVE)"
        side_effects:
          - "runs calculation franchise_tax (ACTUAL variant): tax_assessed_cents from LegalEntity.authorized_shares at submit"
          - "runs calculation late_filing_penalty: sets submitted_date, submitted_by_user_id, days_late, penalty_cents, fee_cents"
          - "LegalEntity.fees_accrued_cents += fee_cents; increments LegalEntity.version by 1"
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /api/filings/{filingId}/submit"
        actor: "FilingCoordinator or CorporateSecretary"
        preconditions:
          - "status IN {PREPARED, OVERDUE} (else ERR_FILING_NOT_PREPARED)"
        side_effects:
          - "same as PREPARED -> SUBMITTED"
        note: "OVERDUE means current date > due_date; the grace period affects only the penalty, not the status."
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (sweep/lazy evaluation when current logical date > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "ComplianceEvent(FILING_OVERDUE) appended"
          - "compliance_posture recomputed on the owning LegalEntity"
      - from: PREPARED
        to: OVERDUE
        trigger: "system (sweep/lazy evaluation when current logical date > due_date)"
        actor: system
        preconditions: []
        side_effects:
          - "ComplianceEvent(FILING_OVERDUE) appended"
          - "compliance_posture recomputed on the owning LegalEntity"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/filings/{filingId}/accept"
        actor: CorporateSecretary
        preconditions:
          - "status == SUBMITTED (else ERR_FILING_NOT_SUBMITTED)"
          - "Segregation of duties: X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Period rollover: generates next-period AnnualFiling rows (period_year + 1, same jurisdiction and filing_type) if none exist and the entity still owes filings to this jurisdiction (formation jurisdiction while entity status IN {ACTIVE}; qualification jurisdiction while qualification status IN {QUALIFIED, WITHDRAWAL_PENDING})"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/filings/{filingId}/reject"
        actor: CorporateSecretary
        preconditions:
          - "status == SUBMITTED (else ERR_FILING_NOT_SUBMITTED)"
          - "Segregation of duties: X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Compensation: LegalEntity.fees_accrued_cents -= fee_cents (exact reversal of the submit accrual); increments LegalEntity.version by 1"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "system (dissolution commencement, or ForeignQualification REVOKED/WITHDRAWN cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "ComplianceEvent(FILING_WITHDRAWN) appended"
      - from: PREPARED
        to: WITHDRAWN
        trigger: "system (dissolution commencement, or ForeignQualification REVOKED/WITHDRAWN cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "ComplianceEvent(FILING_WITHDRAWN) appended"

  - entity: ForeignQualification
    initial_state: PENDING
    terminal_states: [WITHDRAWN, REVOKED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /api/qualifications/{qualificationId}/confirm"
        actor: CorporateSecretary
        preconditions:
          - "status == PENDING (else ERR_QUALIFICATION_NOT_PENDING)"
        side_effects:
          - "qualified_date := current logical date"
          - "generates AnnualFiling rows for this jurisdiction, period_year = year(formation_date) + 1 if not already past, else for the period containing the current logical date per filing_due_date; ANNUAL_REPORT always, FRANCHISE_TAX iff jurisdiction.franchise_tax_method != NONE; skips rows that already exist"
      - from: QUALIFIED
        to: WITHDRAWAL_PENDING
        trigger: "POST /api/qualifications/{qualificationId}/commence-withdrawal"
        actor: CorporateSecretary
        preconditions:
          - "status == QUALIFIED (else ERR_QUALIFICATION_NOT_QUALIFIED)"
          - "An AUTHORIZE_WITHDRAWAL resolution with payload.jurisdiction_id == this jurisdiction and status IN {ADOPTED, EFFECTIVE} exists (else ERR_REQUIRED_RESOLUTION_MISSING)"
        side_effects: []
      - from: WITHDRAWAL_PENDING
        to: QUALIFIED
        trigger: "POST /api/qualifications/{qualificationId}/abort-withdrawal"
        actor: CorporateSecretary
        preconditions:
          - "status == WITHDRAWAL_PENDING (else ERR_QUALIFICATION_NOT_WITHDRAWAL_PENDING)"
        side_effects: []
        note: "Cycle: QUALIFIED -> WITHDRAWAL_PENDING -> QUALIFIED."
      - from: WITHDRAWAL_PENDING
        to: WITHDRAWN
        trigger: "POST /api/qualifications/{qualificationId}/finalize-withdrawal"
        actor: CorporateSecretary
        preconditions:
          - "status == WITHDRAWAL_PENDING (else ERR_QUALIFICATION_NOT_WITHDRAWAL_PENDING)"
          - "Exit clearance: no AnnualFiling of this entity in this jurisdiction with status IN {OVERDUE, SUBMITTED, REJECTED} (else ERR_EXIT_CLEARANCE_FAILED)"
        side_effects:
          - "Remaining AnnualFiling rows of this entity in this jurisdiction with status IN {SCHEDULED, PREPARED} -> WITHDRAWN; each appends ComplianceEvent(FILING_WITHDRAWN)"
          - "compliance_posture recomputed on the owning LegalEntity"
      - from: QUALIFIED
        to: REVOKED
        trigger: "system (cascade: agent coverage lost in this jurisdiction — AgentAppointment RESIGNED with no covering successor)"
        actor: system
        preconditions: []
        side_effects:
          - "ComplianceEvent(QUALIFICATION_REVOKED) appended"
          - "Cascade: AnnualFiling rows of this entity in this jurisdiction with status IN {SCHEDULED, PREPARED} -> WITHDRAWN; each appends ComplianceEvent(FILING_WITHDRAWN)"

  - entity: SignatureAuthorityGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/signature-grants/{grantId}/suspend"
        actor: "ComplianceAuditor or CorporateSecretary"
        preconditions:
          - "status == ACTIVE (else ERR_GRANT_NOT_ACTIVE)"
        side_effects:
          - "suspended_by_user_id := X-User-ID"
          - "Delegated grants referencing this grant become ineffective for verify while this grant is SUSPENDED (no status change on them)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/signature-grants/{grantId}/reinstate"
        actor: CorporateSecretary
        preconditions:
          - "status == SUSPENDED (else ERR_GRANT_NOT_SUSPENDED)"
          - "Segregation of duties: X-User-ID != suspended_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "suspended_by_user_id := null"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/signature-grants/{grantId}/revoke, or system cascade (officer exit, dissolution, resolution rescission, delegator revocation)"
        actor: "CorporateSecretary or system"
        preconditions:
          - "status IN {ACTIVE, SUSPENDED} (else ERR_GRANT_ALREADY_TERMINAL)"
        side_effects:
          - "ComplianceEvent(GRANT_REVOKED) appended"
          - "Cascade: grants with delegated_from_grant_id == this grant and status IN {ACTIVE, SUSPENDED} -> REVOKED"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /api/signature-grants/{grantId}/revoke, or system cascade"
        actor: "CorporateSecretary or system"
        preconditions:
          - "status IN {ACTIVE, SUSPENDED} (else ERR_GRANT_ALREADY_TERMINAL)"
        side_effects:
          - "same as ACTIVE -> REVOKED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (sweep/lazy evaluation when current logical date >= expiry_date; window is half-open)"
        actor: system
        preconditions: []
        side_effects:
          - "ComplianceEvent(GRANT_REVOKED) appended with payload {reason: EXPIRED}"

  - entity: GoodStandingCertificate
    initial_state: REQUESTED
    terminal_states: [ISSUED, DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /api/certificates/{certificateId}/issue"
        actor: CorporateSecretary
        preconditions:
          - "status == REQUESTED (else ERR_CERTIFICATE_NOT_REQUESTED)"
          - "Owning LegalEntity.compliance_posture == GOOD_STANDING, freshly computed (else ERR_POSTURE_NOT_GOOD_STANDING)"
        side_effects:
          - "issued_date := current logical date; valid_until := issued_date + 90 calendar days"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/certificates/{certificateId}/deny, or system sweep when posture leaves GOOD_STANDING"
        actor: "CorporateSecretary or system"
        preconditions:
          - "status == REQUESTED (else ERR_CERTIFICATE_NOT_REQUESTED)"
        side_effects:
          - "denial_reason := input reason, or POSTURE_LOST when system-denied"
          - "ComplianceEvent(CERTIFICATE_DENIED) appended"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (sweep/lazy evaluation when current logical date > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AgentAppointment
    initial_state: ACTIVE
    terminal_states: [RESIGNED]
    transitions:
      - from: ACTIVE
        to: NOTICE_PENDING
        trigger: "POST /api/agent-appointments/{appointmentId}/file-resignation-notice"
        actor: RegisteredAgentUser
        preconditions:
          - "status == ACTIVE (else ERR_AGENT_APPOINTMENT_NOT_ACTIVE)"
          - "X-User-ID == appointment.agent_id (else ERR_FORBIDDEN_ACTOR)"
        side_effects:
          - "notice_date := current logical date; effective_end_date := notice_date + jurisdiction.ra_resignation_notice_days"
      - from: NOTICE_PENDING
        to: RESIGNED
        trigger: "POST /api/agent-appointments/{appointmentId}/finalize-resignation"
        actor: CorporateSecretary
        preconditions:
          - "status == NOTICE_PENDING (else ERR_AGENT_APPOINTMENT_NOT_NOTICE_PENDING)"
          - "current logical date >= effective_end_date (else ERR_AGENT_RESIGNATION_NOTICE_UNRIPE)"
        side_effects:
          - "ComplianceEvent(AGENT_RESIGNED) appended"
          - "Hop 1: compliance_posture recomputed on the owning LegalEntity (agent coverage lost in this jurisdiction when no other appointment with status IN {ACTIVE, NOTICE_PENDING} covers the current date)"
          - "Hop 2: every ForeignQualification of this entity in this jurisdiction with status == QUALIFIED -> REVOKED (with ComplianceEvent(QUALIFICATION_REVOKED))"
          - "Hop 3: for each qualification revoked in hop 2, its AnnualFiling rows in this jurisdiction with status IN {SCHEDULED, PREPARED} -> WITHDRAWN (with ComplianceEvent(FILING_WITHDRAWN) each)"
          - "increments LegalEntity.version by 1"

  - entity: Officer
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /api/officers/{officerId}/deactivate"
        actor: CorporateSecretary
        preconditions:
          - "status == ACTIVE (else ERR_OFFICER_NOT_ACTIVE)"
        side_effects: []
        note: "Deactivation does not alter existing appointments; it blocks future APPOINT_OFFICER adoptions."

  - entity: OwnershipRecord
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new OwnershipRecord with supersedes_record_id == this record is created)"
        actor: system
        preconditions: []
        side_effects:
          - "end_date := the superseding record's effective_date"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /api/ownership-records/{recordId}/void"
        actor: CorporateSecretary
        preconditions:
          - "status == ACTIVE (else ERR_OWNERSHIP_RECORD_NOT_ACTIVE)"
        side_effects:
          - "Frees the record's percentage_bps from the subsidiary's aggregate at all covered dates"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: adopt-resolution-stale-entity
    parent_entity: LegalEntity
    write_endpoint: "POST /api/resolutions/{resolutionId}/adopt"
    occ_field: expected_entity_version
    description: |
      Adopting a resolution against a LegalEntity whose version has advanced
      since the client last observed it is rejected. The adopting officer's
      view of the entity's governance state (roster, posture-affecting
      versions) is stale: another resolution adoption or governance mutation
      has legitimately advanced LegalEntity.version in the meantime, and
      adoption must always execute against the current governance snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: create-ownership-stale-subsidiary
    parent_entity: LegalEntity
    write_endpoint: "POST /api/ownership-records"
    occ_field: expected_entity_version
    description: |
      Creating an OwnershipRecord against a subsidiary LegalEntity whose
      version has advanced since the client last observed it is rejected.
      Successive ownership creates (including supersession chains) are
      legitimate under product semantics, but each create must be issued
      against the current subsidiary version so that aggregate-cap and cycle
      checks are evaluated against the latest ownership graph.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: filing_due_date
    trigger: "AnnualFiling generation (formation confirm, qualification confirm, period rollover)"
    algorithm: interval_adjustment
    formula: |
      period_year P and jurisdiction rule R:
      1. If R.annual_report_due_rule == FIXED_MONTH_DAY:
           due = date(P, R.annual_report_due_month, R.annual_report_due_day)
        If R.annual_report_due_rule == FORMATION_ANNIVERSARY:
           due = anniversary of LegalEntity.formation_date in year P;
           if formation month/day == 02/29 and P is not a leap year, clamp to Feb 28.
      2. Weekend roll: if due falls on Saturday or Sunday, move to the next
         Monday (holidays are not modeled).
      3. First filing period P0 = year(formation_date) + 1. Rollover generates
         P + 1 when the period-P filing of the same (entity, jurisdiction,
         filing_type) transitions to ACCEPTED.
    input_set: "The AnnualFiling being generated; its Jurisdiction rule fields; owning LegalEntity.formation_date"
    constants:
      LEAP_CLAMP_DAY: 28
    precision: "calendar-date granularity; no rounding"
    variants: []

  - name: franchise_tax
    trigger: "AnnualFiling prepare (ESTIMATED variant) and submit (ACTUAL variant) for filing_type == FRANCHISE_TAX"
    algorithm: tiered_pricing
    formula: |
      if LegalEntity.entity_type == NONPROFIT_CORPORATION:
        tax = NONPROFIT_FLAT_CENTS
      elif Jurisdiction.franchise_tax_method == SHARES_TIERED:
        blocks = ceil(max(0, shares - FREE_SHARES) / SHARE_BLOCK_SIZE)
        tax = min(TAX_CAP_CENTS, TAX_BASE_CENTS + blocks * PER_BLOCK_CENTS)
      elif Jurisdiction.franchise_tax_method == FLAT:
        tax = TAX_BASE_CENTS
      else:  # NONE — no FRANCHISE_TAX filing is ever generated
        tax = 0
      where `shares` is:
        ESTIMATED variant: shares_basis = prior ACCEPTED FRANCHISE_TAX filing's
          shares_basis for the same (entity, jurisdiction), else the entity's
          authorized_shares at formation-confirm time (snapshot recorded on the
          generated filing as shares_basis).
        ACTUAL variant: LegalEntity.authorized_shares at submit time.
      ANNUAL_REPORT filings always assess tax = 0.
    input_set: "The filing being prepared/submitted; owning LegalEntity (entity_type, authorized_shares); filing jurisdiction (franchise_tax_method); prior ACCEPTED FRANCHISE_TAX filing of same (entity, jurisdiction) for the ESTIMATED basis"
    constants:
      TAX_BASE_CENTS: 17500
      FREE_SHARES: 5000
      SHARE_BLOCK_SIZE: 10000
      PER_BLOCK_CENTS: 8500
      TAX_CAP_CENTS: 2000000
      NONPROFIT_FLAT_CENTS: 2500
    precision: "integer cents; ceil applies before min; no fractional rounding"
    variants:
      - name: ESTIMATED
        when: "POST /api/filings/{filingId}/prepare"
        difference: "uses prior-period shares_basis (or formation shares for the first period); result stored in tax_estimated_cents"
      - name: ACTUAL
        when: "POST /api/filings/{filingId}/submit"
        difference: "uses current LegalEntity.authorized_shares; result stored in tax_assessed_cents; ESTIMATED and ACTUAL diverge whenever authorized_shares changed between basis snapshot and submit"

  - name: late_filing_penalty
    trigger: "AnnualFiling submit"
    algorithm: chronological
    formula: |
      grace_end = due_date + jurisdiction.grace_period_days (calendar days)
      days_late = number of days in the half-open interval (grace_end, submitted_date]
        counted per jurisdiction.penalty_day_counting:
          CALENDAR_DAYS: every day counts
          BUSINESS_DAYS: only Monday-Friday count
      if days_late == 0: penalty_cents = 0
      else:
        tax_component    = round_half_up(tax_assessed_cents * DAILY_TAX_RATE * days_late)
        report_component = round_half_up(report_fee_cents * DAILY_REPORT_RATE * days_late)
        penalty_cents = min(jurisdiction.late_penalty_cap_cents,
                            jurisdiction.late_penalty_base_cents + tax_component + report_component)
      ROUNDING ORDER IS PINNED: each component is rounded to whole cents with
      round_half_up BEFORE the components are summed and the cap applied.
      Summing the unrounded components and rounding once afterwards yields
      different cents (e.g. tax 26000, fee 5000, 4 days: 38.48->38 and 8.2->8
      sum to 46 under the pinned order vs round(46.68)=47 unpinned) and is
      non-conformant.
      fee_cents = report_fee_cents + tax_assessed_cents + penalty_cents
    input_set: "The filing being submitted (due_date, report_fee_cents, tax_assessed_cents); jurisdiction (grace_period_days, penalty_day_counting, late_penalty_base_cents, late_penalty_cap_cents)"
    constants:
      DAILY_TAX_RATE: 0.00037
      DAILY_REPORT_RATE: 0.00041
    precision: "whole cents; round_half_up per component before summation"
    variants:
      - name: CALENDAR_DAYS
        when: "jurisdiction.penalty_day_counting == CALENDAR_DAYS"
        difference: "weekend days count toward days_late"
      - name: BUSINESS_DAYS
        when: "jurisdiction.penalty_day_counting == BUSINESS_DAYS"
        difference: "Saturday/Sunday inside (grace_end, submitted_date] do not count; identical submit dates yield smaller days_late than CALENDAR_DAYS whenever the interval spans a weekend"

  - name: compliance_posture_derivation
    trigger: "every read of LegalEntity, every sweep, and as a gate inside qualification create, certificate request, certificate issue"
    algorithm: threshold
    formula: |
      Let today = current logical date (lazy OVERDUE evaluation applied first:
      filings in {SCHEDULED, PREPARED} with due_date < today become OVERDUE).
      registered_jurisdictions(E) = {E.formation_jurisdiction_id if E.status IN
        {ACTIVE, DISSOLUTION_PENDING}} UNION {q.jurisdiction_id for
        ForeignQualification q of E with q.status IN {PENDING, QUALIFIED,
        WITHDRAWAL_PENDING}}
      coverage_lost = EXISTS j IN registered_jurisdictions(E) with NO
        AgentAppointment a of E where a.jurisdiction_id == j AND
        a.status IN {ACTIVE, NOTICE_PENDING} AND a.start_date <= today AND
        (a.status == ACTIVE OR a.effective_end_date >= today)
      hard_overdue = EXISTS AnnualFiling f of E with f.status == OVERDUE AND
        today > f.due_date + jurisdiction.grace_period_days + SUSPEND_AFTER_GRACE_DAYS
      if coverage_lost OR hard_overdue:
        if E.suspended_since is null: E.suspended_since = today
        if today >= E.suspended_since + formation_jurisdiction.forfeiture_window_days:
          posture = FORFEITED
        else: posture = SUSPENDED
      else:
        E.suspended_since = null
        if EXISTS AnnualFiling f of E with f.status == OVERDUE: posture = DELINQUENT
        else: posture = GOOD_STANDING
    input_set: "LegalEntity; its AgentAppointments (status IN {ACTIVE, NOTICE_PENDING} only); its ForeignQualifications (status IN {PENDING, QUALIFIED, WITHDRAWAL_PENDING}); its AnnualFilings (status == OVERDUE only — SCHEDULED/PREPARED filings with future due dates and terminal filings are excluded)"
    constants:
      SUSPEND_AFTER_GRACE_DAYS: 30
    precision: "date-granularity comparisons; boundary: a filing is OVERDUE only when today > due_date (on due_date itself it is not overdue); hard_overdue uses strict > of grace_end + 30"
    variants: []

  - name: signature_effective_limit
    trigger: "POST /api/signature-grants/verify"
    algorithm: constraint_propagation
    formula: |
      candidates = SignatureAuthorityGrants g where g.entity_id, g.officer_id,
        g.scope match the request, g.status == ACTIVE, and
        g.effective_date <= as_of_date < g.expiry_date   (half-open window)
      At most one candidate can exist per (entity, officer, scope, date)
      because grant creation rejects window overlaps.
      if no candidate: authorized = false, effective_limit_cents = 0
      else:
        g = the candidate
        if g.delegated_from_grant_id is null:
          effective_limit_cents = g.max_amount_cents
        else:
          d = g.delegated_from_grant grant
          if d.status != ACTIVE OR NOT (d.effective_date <= as_of_date < d.expiry_date):
            authorized = false, effective_limit_cents = 0
          else:
            effective_limit_cents = min(g.max_amount_cents, d.max_amount_cents)
      authorized = (effective_limit_cents > 0) AND (amount_cents <= effective_limit_cents)
      Boundary: amount_cents == effective_limit_cents is authorized (<=).
    input_set: "Grants of the entity with status == ACTIVE only (SUSPENDED/REVOKED/EXPIRED excluded); the delegator grant when chained"
    constants: {}
    precision: "integer cents; exact <= comparison"
    variants: []

  - name: ownership_consolidation
    trigger: "GET /api/entities/{entityId}/ownership-chart"
    algorithm: topological
    formula: |
      Graph: nodes are LegalEntity rows; edges are OwnershipRecords with
      status == ACTIVE whose half-open window covers the current logical date
      (effective_date <= today AND (end_date is null OR today < end_date)).
      direct_percentage_bps(E) per edge = record.percentage_bps.
      look_through_percentage_bps(root, E) = sum over all directed paths
        root -> ... -> E of the product of edge percentages divided by
        10000^(path_length - 1), computed with integer arithmetic:
        path_value_bps(path) = floor-based iterated product:
          acc = first edge bps; for each subsequent edge: acc = acc * bps / 10000
          (integer division, truncation toward zero, per edge in path order).
      Traversal: breadth-first from root; nodes at equal depth ordered by
        (edge.effective_date ASC, edge.created_at ASC); this order is pinned
        and deterministic. Cycles are impossible because creation enforces a
        DAG among status == ACTIVE records.
      Response nodes[] carry {entity_id, depth, look_through_percentage_bps};
      edges[] carry {parent_entity_id, subsidiary_entity_id, percentage_bps}.
      The root node is always emitted with depth == 0 and
      look_through_percentage_bps == null (no inbound path exists).
    input_set: "OwnershipRecords with status == ACTIVE only (SUPERSEDED and VOIDED excluded) and window covering the current logical date"
    constants: {}
    precision: "integer basis points; per-edge truncation in path order"
    variants:
      - name: DIRECT
        when: "edges[] entries"
        difference: "immediate parent percentages only"
      - name: LOOK_THROUGH
        when: "nodes[].look_through_percentage_bps"
        difference: "multiplies along every directed path and sums across paths; identical records yield different numbers from DIRECT whenever an indirect path exists (e.g. root->A 8000 bps and A->E 5000 bps plus root->E 1000 bps gives LOOK_THROUGH(E) = 4000 + 1000 = 5000 vs DIRECT 1000)"

  - name: certificate_fee
    trigger: "POST /api/entities/{entityId}/certificate-requests"
    algorithm: threshold
    formula: |
      STANDARD: fee_cents = jurisdiction.cert_fee_cents
      EXPEDITED: fee_cents = round_half_up(jurisdiction.cert_fee_cents * 1.5)
    input_set: "The request's delivery_speed; jurisdiction.cert_fee_cents"
    constants:
      EXPEDITED_MULTIPLIER: 1.5
    precision: "whole cents; round_half_up"
    variants:
      - name: STANDARD
        when: "delivery_speed == STANDARD"
        difference: "flat cert_fee_cents"
      - name: EXPEDITED
        when: "delivery_speed == EXPEDITED"
        difference: "1.5x with round_half_up (5000 -> 7500)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role name; for entity_backed roles (AuthorizedOfficer, RegisteredAgentUser) X-User-ID must be the id of an existing Officer/RegisteredAgent"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The role is permitted to invoke this endpoint per §1.5 roles and §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right; body-supplied FK references (jurisdiction_id, agent_id, officer_id, agent_appointment_id, parent_entity_id, subsidiary_entity_id, delegated_from_grant_id, supersedes_record_id, ids inside Resolution.payload) exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_ENTITY_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND, ERR_AGENT_NOT_FOUND, ERR_OFFICER_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_RESOLUTION_NOT_FOUND, ERR_FILING_NOT_FOUND, ERR_QUALIFICATION_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_OWNERSHIP_RECORD_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 4
    category: existence
    check: "Body schema: required fields present; enum values valid; ISO dates well-formed; integer ranges (percentage_bps 1..10000; max_amount_cents > 0; fiscal_year_end_month 1..12); date ranges (expiry_date > effective_date; due rule month/day present iff FIXED_MONTH_DAY)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints with a request body"
  - priority: 5
    category: state
    check: "Target resource state-machine preconditions: LegalEntity status gates (ERR_ENTITY_NOT_DRAFT, ERR_ENTITY_NOT_FORMATION_PENDING, ERR_ENTITY_NOT_ACTIVE, ERR_ENTITY_NOT_DISSOLUTION_PENDING, ERR_ENTITY_ALREADY_DISSOLVED); Resolution (ERR_RESOLUTION_NOT_DRAFT, ERR_RESOLUTION_NOT_SUBMITTED, ERR_RESOLUTION_NOT_ADOPTED, ERR_RESOLUTION_NOT_RESCINDABLE); AnnualFiling (ERR_FILING_NOT_PREPARED, ERR_FILING_NOT_SUBMITTED); ForeignQualification (ERR_QUALIFICATION_NOT_PENDING, ERR_QUALIFICATION_NOT_QUALIFIED, ERR_QUALIFICATION_NOT_WITHDRAWAL_PENDING); Grant (ERR_GRANT_NOT_ACTIVE, ERR_GRANT_NOT_SUSPENDED, ERR_GRANT_ALREADY_TERMINAL); Certificate (ERR_CERTIFICATE_NOT_REQUESTED); OfficerAppointment (ERR_APPOINTMENT_NOT_APPOINTED); AgentAppointment (ERR_AGENT_APPOINTMENT_NOT_ACTIVE, ERR_AGENT_APPOINTMENT_NOT_NOTICE_PENDING); Officer (ERR_OFFICER_NOT_ACTIVE); OwnershipRecord (ERR_OWNERSHIP_RECORD_NOT_ACTIVE). Child-creation endpoints require the parent entity not DISSOLVED (ERR_ENTITY_ALREADY_DISSOLVED); ownership-records create additionally requires both parent and subsidiary entities status == ACTIVE (ERR_ENTITY_NOT_ACTIVE)."
    error_id: "domain-specific 409 per transition (see state_machines preconditions)"
    http_status: 409
    applies_to: "all action/transition endpoints; all POST endpoints that create children under /api/entities/{entityId}; PATCH /api/entities/{entityId}; POST /api/ownership-records"
  - priority: 6
    category: business_safety
    check: "Compliance gates and segregation of duties: posture must be GOOD_STANDING for qualification create, certificate request, certificate issue (ERR_POSTURE_NOT_GOOD_STANDING); adopter != drafter, acceptor/rejecter != submitter, reinstater != suspender (ERR_SEGREGATION_OF_DUTIES); self-action holder checks for resign / file-resignation-notice (ERR_FORBIDDEN_ACTOR)"
    error_id: "ERR_POSTURE_NOT_GOOD_STANDING | ERR_SEGREGATION_OF_DUTIES | ERR_FORBIDDEN_ACTOR"
    http_status: 409
    applies_to: "POST /api/entities/{id}/qualifications, POST /api/entities/{id}/certificate-requests, POST /api/certificates/{id}/issue, POST /api/resolutions/{id}/adopt, POST /api/filings/{id}/accept, POST /api/filings/{id}/reject, POST /api/signature-grants/{id}/reinstate, POST /api/officer-appointments/{id}/resign, POST /api/agent-appointments/{id}/file-resignation-notice"
  - priority: 7
    category: business_referential
    check: "Cross-entity references in required states: authorizing resolution with matching type/payload in status IN {ADOPTED, EFFECTIVE} and not RESCINDED/WITHDRAWN (ERR_REQUIRED_RESOLUTION_MISSING); grant officer holds APPOINTED appointment at entity (ERR_OFFICER_NOT_APPOINTED); delegator grant exists with status == ACTIVE (ERR_DELEGATOR_GRANT_INVALID); qualification's agent_appointment covers (entity, jurisdiction) with status == ACTIVE (ERR_AGENT_COVERAGE_GAP); APPOINT_OFFICER adoption requires Officer.status == ACTIVE (ERR_OFFICER_NOT_ACTIVE)"
    error_id: "ERR_REQUIRED_RESOLUTION_MISSING | ERR_OFFICER_NOT_APPOINTED | ERR_DELEGATOR_GRANT_INVALID | ERR_AGENT_COVERAGE_GAP | ERR_OFFICER_NOT_ACTIVE"
    http_status: 422
    applies_to: "POST /api/entities/{id}/submit-formation, /commence-dissolution, /revoke-dissolution, /qualifications, /signature-grants, POST /api/qualifications/{id}/commence-withdrawal, POST /api/resolutions/{id}/adopt"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and structural constraints: officer email unique (ERR_DUPLICATE_OFFICER); no second ForeignQualification for (entity, jurisdiction) with status IN {PENDING, QUALIFIED, WITHDRAWAL_PENDING} (ERR_QUALIFICATION_EXISTS); ownership graph stays acyclic among status == ACTIVE records (ERR_OWNERSHIP_CYCLE); parent != subsidiary (ERR_SELF_OWNERSHIP); grant window overlap per (entity, officer, scope) among status IN {ACTIVE, SUSPENDED} (ERR_GRANT_WINDOW_OVERLAP); single-holder office occupied at adopt (ERR_OFFICE_OCCUPIED); second AgentAppointment overlapping an ACTIVE one outside a notice window (ERR_AGENT_APPOINTMENT_OVERLAP); dissolution gates (ERR_OPEN_QUALIFICATIONS_EXIST, ERR_DISSOLUTION_BLOCKED); delegation depth: delegator must itself be a direct grant (ERR_DELEGATION_DEPTH_EXCEEDED)"
    error_id: "per check"
    http_status: 409
    applies_to: "POST endpoints creating officers, qualifications, ownership-records, signature-grants, agent-appointments; POST /api/resolutions/{id}/adopt; dissolution endpoints"
  - priority: 9
    category: business_temporal
    check: "Interval semantics: agent coverage continuity — when an appointment in NOTICE_PENDING exists for (entity, jurisdiction), a successor appointment's start_date must be <= the incumbent's effective_end_date (ERR_AGENT_COVERAGE_GAP); delegated grant window must be contained within the delegator window [delegator.effective_date, delegator.expiry_date) (ERR_DELEGATOR_WINDOW_INSUFFICIENT); resignation notice must be ripe at finalize (ERR_AGENT_RESIGNATION_NOTICE_UNRIPE); withdrawal exit clearance — no filings in jurisdiction with status IN {OVERDUE, SUBMITTED, REJECTED} (ERR_EXIT_CLEARANCE_FAILED)"
    error_id: "ERR_AGENT_COVERAGE_GAP | ERR_DELEGATOR_WINDOW_INSUFFICIENT | ERR_AGENT_RESIGNATION_NOTICE_UNRIPE | ERR_EXIT_CLEARANCE_FAILED"
    http_status: 422
    applies_to: "POST /api/entities/{id}/agent-appointments, POST /api/entities/{id}/signature-grants, POST /api/agent-appointments/{id}/finalize-resignation, POST /api/qualifications/{id}/finalize-withdrawal"
  - priority: 10
    category: business_fiscal
    check: "Monetary/aggregate caps last: delegated grant max_amount_cents <= delegator.max_amount_cents (ERR_DELEGATION_LIMIT_EXCEEDED); ownership aggregate — for every date t, sum of percentage_bps over the subsidiary's OwnershipRecords with status == ACTIVE whose half-open window covers t must be <= 10000 (ERR_OWNERSHIP_TOTAL_EXCEEDED)"
    error_id: "ERR_DELEGATION_LIMIT_EXCEEDED | ERR_OWNERSHIP_TOTAL_EXCEEDED"
    http_status: 422
    applies_to: "POST /api/entities/{id}/signature-grants, POST /api/ownership-records"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving harness ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [CorporateSecretary]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []
  - method: POST
    path: "/_system/sweep"
    description: "Materialize all time-driven transitions against the logical clock: filing OVERDUE, resolution EFFECTIVE, grant EXPIRED, certificate EXPIRED, posture recompute with ComplianceEvent emission"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: { filings_marked_overdue: integer, resolutions_made_effective: integer, resolutions_blocked: integer, grants_expired: integer, certificates_expired: integer, certificates_auto_denied: integer, posture_changes: integer }
    side_effects: ["all clock-driven transitions and their cascades/events"]

  # --- Jurisdiction ---
  - method: POST
    path: "/api/jurisdictions"
    description: "Register a jurisdiction with its filing-calendar and fee rules"
    roles: [CorporateSecretary]
    code: 201
    input: [code, name, annual_report_due_rule, "annual_report_due_month?", "annual_report_due_day?", grace_period_days, franchise_tax_method, late_penalty_base_cents, late_penalty_cap_cents, penalty_day_counting, report_fee_cents, cert_fee_cents, ra_resignation_notice_days, forfeiture_window_days]
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/api/jurisdictions"
    description: "List jurisdictions"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?", "code?"]
    output: "Jurisdiction[]"
    side_effects: []
  - method: GET
    path: "/api/jurisdictions/{jurisdictionId}"
    description: "Get a jurisdiction"
    roles: [CorporateSecretary, FilingCoordinator, AuthorizedOfficer, RegisteredAgentUser, ComplianceAuditor]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # --- RegisteredAgent ---
