            - call: "POST /fof/programs/${prog}/pacing-plans/${planA}/supersede"
              payload: { replacement_plan_id: "${planB}", expected_program_version: "${pv_fresh}" }
              as: CIO
          assert:
            - "err == ERR_STALE_VERSION (ledger append bumped version between read and supersede)"
            - "retry with pv_fresh succeeds: PacingPlan.${planA}.status == SUPERSEDED and PacingPlan.${planB}.status == APPROVED"

