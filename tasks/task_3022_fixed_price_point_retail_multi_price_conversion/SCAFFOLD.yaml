# =============================================================================
# PRD Benchmark Scaffold — task_3022
# Fixed-Price-Point Retail Multi-Price Conversion & Freight Pass-Through
# =============================================================================

scenario: |
  Fixed-Price-Point Retail Multi-Price Conversion & Freight Pass-Through (Dollar Tree): item cost engineering to fit a fixed shelf price with pack-size and formulation changes, multi-price-point conversion of stores with sign, shelf-tag and register file changes, import freight cost volatility absorbed at a fixed retail with break-even reassessment per item, container flow from port to distribution center with allocation to stores by shelf capacity, seasonal aisle changeover with fixed reset calendars, item deletion when landed cost exceeds the price point, store-level compliance auditing on price integrity and mixed price points, vendor development of exclusive pack configurations

domain_name: fixed-price-point-retail-multi-price-conversion
api_prefix: /merchandise

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Ops-run checkpoint"
    - "Derived field reconciliation"
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Configuration: the fixed price ladder ---------------------------------
  - name: PricePoint
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human label for the shelf price point, e.g. 'DOLLAR_25_LEGACY'"
      - name: shelf_price_cents
        type: integer
        source: input
        description: "The single fixed retail price charged to the shopper at this price point, in cents"
        constraints: "> 0"
      - name: target_landed_cost_ratio
        type: number
        source: input
        description: "Maximum landed cost as a fraction of shelf_price_cents that the buying office is allowed to commit to"
        constraints: "0 < ratio <= 1"
      - name: status
        type: enum
        source: system
        description: "Definition lifecycle: DRAFT (editable, not issuable) | ACTIVE (issuable to items, stores and pack programs)"
        default: "DRAFT"
      - name: issued_store_count
        type: integer
        source: computed
        description: "Computed. Number of distinct Store rows whose active_aisle_reset.price_point_id equals this PricePoint, counting each store exactly once regardless of how many aisles it carries."

  # --- Configuration: the physical reset calendar ----------------------------
  - name: SeasonWindow
    parent: null
    common_fields: true
    fields:
      - name: season_code
        type: string
        source: input
        description: "Season identifier, e.g. 'HARVEST_2026'"
      - name: opens_on
        type: datetime
        source: input
        description: "First instant the season window is open, inclusive (UTC)"
      - name: closes_on
        type: datetime
        source: input
        description: "Last instant the season window is open, inclusive (UTC); must be strictly after opens_on"
      - name: status
        type: enum
        source: system
        description: "DRAFT | SCHEDULED | OPEN | CLOSED"
        default: "DRAFT"
      - name: overlapping_reset_count
        type: integer
        source: computed
        description: "Computed. Number of AisleReset rows whose [starts_at, ends_at] interval overlaps this window's [opens_on, closes_on] interval under the half-open convention: an interval starts inside the window when starts_at <= closes_on AND ends_at >= opens_on."

  # --- Configuration: the exclusivity contract -------------------------------
  - name: ExclusivePackProgram
    parent: Vendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: system
        description: "FK -> Vendor.id; the vendor that manufactures the exclusive pack configuration"
      - name: price_point_id
        type: string
        source: input
        description: "FK -> PricePoint.id; the shelf price point this pack configuration is designed to fit"
      - name: pack_qty
        type: integer
        source: input
        description: "Units contained in the exclusive pack configuration"
        constraints: ">= 1"
      - name: case_pack_qty
        type: integer
        source: input
        description: "Units per shipping carton of this pack configuration"
        constraints: ">= 1"
      - name: formulation_code
        type: string
        source: input
        description: "Exclusive formulation identifier, e.g. 'LOW_SUDS_V3'; distinguishes this pack from the standard formulation"
      - name: quoted_landed_cost_cents
        type: integer
        source: input
        description: "Vendor-quoted landed cost per unit for this pack configuration, in cents"
        constraints: ">= 0"
      - name: target_landed_cost_cents
        type: computed
        description: "Computed at status transition to ACTIVE using landed_cost_target_ceiling: floor(PricePoint.shelf_price_cents * PricePoint.target_landed_cost_ratio * (1 - target_margin_buffer_pct))"
      - name: status
        type: enum
        source: system
        description: "DRAFT | PENDING_ACTIVATION | ACTIVE | TERMINATED"
        default: "DRAFT"

  # --- Master data: the item --------------------------------------------------
  - name: Item
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Merchandise SKU; unique across all Items"
        constraints: "unique"
      - name: description
        type: string
        source: input
        description: "Item description shown on the shelf tag and register file"
      - name: unit_retail_cents
        type: integer
        source: input
        description: "Fixed retail price in cents per selling unit. MUST equal shelf_price_cents of the item's assigned PricePoint for the whole time the item is price-assigned."
        constraints: "> 0"
      - name: price_point_id
        type: string
        source: system
        description: "FK -> PricePoint.id; the shelf price point this item currently sells at. May be null while the item is DENOMINATED (pre-assignment)."
        constraints: "nullable"
      - name: commodity_class
        type: string
        source: input
        description: "Merchandise class used by AisleReset changeover planning"
      - name: season_code
        type: string
        source: input
        description: "Season this item belongs to, e.g. 'HARVEST_2026'; '' when the item is a year-round staple"
        constraints: "nullable"
      - name: sqft_per_unit
        type: number
        source: input
        description: "Shelf facing square feet consumed by ONE selling unit of this item"
        constraints: "> 0"
      - name: shelf_package_capacity
        type: number
        source: input
        description: "Square feet of shelf facing allocated to this item at its home store; the maximum on-hand the shelf can present"
        constraints: "> 0"
      - name: units_per_case
        type: integer
        source: input
        description: "Selling units contained in one store-orderable case of this item"
        constraints: ">= 1"
      - name: base_landed_cost_cents
        type: integer
        source: input
        description: "Vendor FOB landed cost per unit before any freight pass-through, in cents. The base the freight apportionment adds to."
        constraints: ">= 0"
      - name: fixed_store_handling_cents
        type: integer
        source: input
        description: "Fixed store handling cost per case that the item must recover at the fixed retail, in cents"
        constraints: ">= 0"
      - name: variable_store_cost_cents
        type: integer
        source: input
        description: "Variable per-unit store cost subtracted from the unit retail when computing net contribution and break-even"
        constraints: ">= 0"
      - name: sourcing_vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor the item is sourced from. A freight pass-through container must carry this same vendor."
      - name: on_hand_units
        type: integer
        source: system
        description: "On-hand units at the store, written only by POST /allocation-lines/{id}/release"
        constraints: ">= 0"
      - name: broken_case_allowance
        type: boolean
        source: computed
        description: "Computed. True exactly when (units_per_case * sqft_per_unit) > shelf_package_capacity — one full case cannot fit on the shelf."
      - name: is_shelf_overflow
        type: boolean
        source: computed
        description: "Computed. True exactly when on_hand_units * sqft_per_unit > shelf_package_capacity — the on-hand exceeds what the shelf can present."
      - name: landed_cost_cents
        type: integer
        source: computed
        description: "Computed. Current landed cost per unit, recomputed from the latest landed_cost_history row for the item. 0 when no history exists."
      - name: break_even_units
        type: integer
        source: computed
        description: "Computed. Minimum full-case units that must move at the committed landed cost to cover unit_retail_cents: ceil(total_landed_cost_cents / (unit_retail_cents - variable_store_cost_cents)). 0 in the divergence regime."
      - name: net_contribution_cents_per_unit
        type: integer
        source: computed
        description: "Computed signed. unit_retail_cents - landed_cost_cents - variable_store_cost_cents. Negative means the fixed price point no longer absorbs the landed cost."
      - name: status
        type: enum
        source: system
        description: "DENOMINATED | PRICE_ASSIGNED | COST_PENDING | DELETE_REVIEW | ACTIVE | DELETED"
        default: "DENOMINATED"

  # --- Master data: the vendor ------------------------------------------------
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: vendor_name
        type: string
        source: input
        description: "Legal vendor name; unique across all Vendors"
        constraints: "unique"
      - name: country_of_origin
        type: string
        source: input
        description: "ISO-3166 alpha-2 country code, e.g. 'CN', 'VN', 'US'"
      - name: import_flag
        type: boolean
        source: input
        description: "True when the vendor ships on ocean import lanes and therefore carries freight pass-through"
      - name: exclusivity_program_count
        type: integer
        source: computed
        description: "Computed. Number of ExclusivePackProgram rows on this vendor whose status is ACTIVE."

  # --- Resource: the import container -----------------------------------------
  - name: Container
    parent: Vendor
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: system
        description: "FK -> Vendor.id; the vendor whose purchase order this container carries"
      - name: container_number
        type: string
        source: input
        description: "Ocean container number; unique across all Containers"
        constraints: "unique"
      - name: port_code
        type: string
        source: input
        description: "Port of discharge code, e.g. 'LAX'"
      - name: dc_code
        type: string
        source: input
        description: "Destination distribution center code, e.g. 'DC-ATL'"
      - name: total_freight_cents
        type: integer
        source: input
        description: "Total ocean and drayage freight billed for this container, in cents"
        constraints: ">= 0"
      - name: customs_cleared
        type: boolean
        source: input
        default: false
        description: "Set true by the broker once customs clears; a hard gate on receipt allocation"
      - name: status
        type: enum
        source: system
        description: "BOOKED | IN_TRANSIT | AT_PORT | CUSTOMS_HOLD | RECEIVED | ALLOCATED"
        default: "BOOKED"

  # --- Resource: the store ----------------------------------------------------
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: store_number
        type: string
        source: input
        description: "Store number; unique across all Stores"
        constraints: "unique"
      - name: shelf_facing_capacity_sqft
        type: number
        source: input
        description: "Total shelf facing square feet the store can commit across concurrent aisle resets; the ceiling summed against in the store-day aggregate capacity check"
        constraints: "> 0"
      - name: conversion_price_point_id
        type: string
        source: system
        description: "FK -> PricePoint.id; the price point to which this store is converting. Set at conversion start, cleared to null at conversion completion."
        constraints: "nullable"
      - name: sign_order_filed
        type: boolean
        source: system
        default: false
        description: "Set true when the signage order is filed; required at conversion completion"
      - name: shelf_tag_filed
        type: boolean
        source: system
        default: false
        description: "Set true when the shelf-tag file is filed; required at conversion completion"
      - name: register_file_locked
        type: boolean
        source: system
        default: false
        description: "Set true when the register file is locked; required at conversion completion"
      - name: status
        type: enum
        source: system
        description: "SINGLE_PRICE | CONVERTING | MULTI_PRICE | REVERTING"
        default: "SINGLE_PRICE"
      - name: price_integrity_audit_count
        type: integer
        source: computed
        description: "Computed. Number of PriceIntegrityAudit rows filed against this store."
      - name: open_violation_count
        type: integer
        source: computed
        description: "Computed. Number of PriceIntegrityAudit rows on this store whose result is VIOLATION and whose status is OPEN."

  # --- Resource: seasonal aisle reset -----------------------------------------
  - name: AisleReset
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; the store whose aisle is being reset"
      - name: price_point_id
        type: string
        source: input
        description: "FK -> PricePoint.id; the price point the reset aisle will carry. Must be consistent with Store.conversion_price_point_id while an aisle reset is open under a store that is CONVERTING."
      - name: season_window_id
        type: string
        source: input
        description: "FK -> SeasonWindow.id; the reset calendar window this aisle changeover belongs to"
      - name: aisle_code
        type: string
        source: input
        description: "Physical aisle identifier, e.g. 'A14'"
      - name: starts_at
        type: datetime
        source: input
        description: "Start of the aisle occupation interval, inclusive (UTC)"
      - name: ends_at
        type: datetime
        source: input
        description: "End of the aisle occupation interval, inclusive (UTC); must be strictly after starts_at"
      - name: allocated_shelf_sqft
        type: number
        source: input
        description: "Shelf facing square feet this aisle changeover commits on the store-day; the quantity summed by the store-day aggregate capacity check"
        constraints: "> 0"
      - name: seasonal_changeover
        type: boolean
        source: input
        description: "True when the reset swaps the aisle to a new season_code; false for a same-season refresh"
      - name: status
        type: enum
        source: system
        default: "PLANNED"
        description: "PLANNED | EXECUTING | EXECUTED | ABANDONED"

  # --- Resource: the price conversion project ---------------------------------
  - name: ConversionProject
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; the store being converted"
      - name: from_price_point_id
        type: string
        source: system
        description: "FK -> PricePoint.id; the price point the store is converting away from. Set from Store.conversion_price_point_id at start, or from the store's from_point_id when issued by POST /multi-price-issues."
      - name: to_price_point_id
        type: string
        source: input
        description: "FK -> PricePoint.id; the destination price point; must differ from from_price_point_id"
      - name: expected_store_version
        type: integer
        source: input
        description: "OCC token: the Store.version the client last observed. Required on POST /conversion-projects and PATCH /conversion-projects/{id}."
      - name: status
        type: enum
        source: system
        default: "DRAFT"
        description: "DRAFT | IN_PROGRESS | COMPLETED | ROLLBACK"
      - name: coverage_delta_pct
        type: number
        source: computed
        description: "Computed. (converted_aisle_count - projected_convertible_aisle_count) / projected_convertible_aisle_count. 0 when projected_convertible_aisle_count is 0."

  # --- Event log: audited store visit -----------------------------------------
  - name: PriceIntegrityAudit
    parent: Store
    common_fields: false
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; the store audited"
      - name: price_point_id
        type: string
        source: input
        description: "FK -> PricePoint.id; the price point the auditor observed on the shelf and at the register"
      - name: audited_at
        type: datetime
        source: input
        description: "Instant the audit visit occurred (UTC)"
      - name: observed_item_count
        type: integer
        source: input
        description: "Number of facings counted during the visit"
        constraints: ">= 0"
      - name: mismatched_item_count
        type: integer
        source: input
        description: "Number of facings whose shelf tag disagreed with the register file"
        constraints: ">= 0 and <= observed_item_count"
      - name: result
        type: enum
        source: computed
        description: "Computed at creation: WITHIN_TOLERANCE when the formatted mismatch ratio is at or below the tolerance ceiling, VIOLATION when it exceeds it."
      - name: mismatch_ratio
        type: number
        source: computed
        description: "Computed at creation: round(mismatched_item_count / observed_item_count, 3) using round_half_up. 0 when observed_item_count is 0."
      - name: status
        type: enum
        source: system
        default: "OPEN"
        description: "OPEN | RESOLVED"

  # --- Event log: the applied freight pass-through ----------------------------
  - name: LandedCostHistory
    parent: Item
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: system
        description: "FK -> Item.id; the item whose landed cost this row records"
      - name: container_id
        type: string
        source: system
        description: "FK -> Container.id; the container whose freight was passed through. Null when the cost is a vendor price change with no container."
        constraints: "nullable"
      - name: method
        type: enum
        source: input
        description: "FREIGHT_PASS_THROUGH when a received container's freight is applied; VENDOR_PRICE_CHANGE when the vendor revises the quoted cost"
      - name: applied_amount_cents
        type: integer
        source: input
        description: "Landed cost per unit recorded by this row, in cents"
        constraints: ">= 0"
      - name: effective_sequence
        type: integer
        source: system
        description: "Server-minted strictly increasing integer, unique across all LandedCostHistory rows, assigned in the order rows are created. The row with the highest effective_sequence for an item is the item's current cost row; ties are impossible by construction."

  # --- Bridge: container receipt allocation -----------------------------------
  - name: AllocationLine
    parent: Container
    common_fields: true
    fields:
      - name: container_id
        type: string
        source: system
        description: "FK -> Container.id; the container being allocated to stores"
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; the store receiving units"
      - name: item_id
        type: string
        source: system
        description: "FK -> Item.id; the item being allocated"
      - name: sequence
        type: integer
        source: input
        description: "Client-supplied pallet sequence number, unique within the container and stable across the container's whole life. This is the pinned tie-break-free ordering key for shelf_allocation_waterfall."
        constraints: ">= 1; unique within container_id"
      - name: requested_units
        type: integer
        source: input
        description: "Selling units the distribution center proposes to send this store for this item"
        constraints: ">= 0"
      - name: allocated_units
        type: integer
        source: computed
        description: "Computed by shelf_allocation_waterfall. Selling units that can actually be placed on the store's shelf for this item; 0 when the line is fully starved."
      - name: overflow_units
        type: integer
        source: computed
        description: "Computed. requested_units - allocated_units; units the store must hold back-of-house rather than on the shelf."
      - name: released_units
        type: integer
        source: system
        default: 0
        description: "Selling units already released to the store's on_hand_units"
        constraints: ">= 0"
      - name: remaining_units
        type: integer
        source: computed
        description: "Computed. allocated_units - released_units"
      - name: status
        type: enum
        source: system
        default: "ALLOCATED"
        description: "ALLOCATED | OVERFLOW | RELEASED | SHORTED | REVERSED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Item
    initial_state: DENOMINATED
    terminal_states: [ACTIVE, DELETED]
    transitions:
      - from: DENOMINATED
        to: PRICE_ASSIGNED
        trigger: "POST /merchandise/items/{id}/price-assignments"
        actor: MerchandiseBuyer
        preconditions:
          - "Item.status == DENOMINATED (ERR_ITEM_NOT_DENOMINATED)"
          - "Item.unit_retail_cents == PricePoint.shelf_price_cents of the requested price point (ERR_PRICE_POINT_MISMATCH)"
          - "PricePoint.status == ACTIVE (ERR_PRICE_POINT_NOT_ACTIVE)"
        side_effects:
          - "Item.price_point_id = requested price_point_id"
          - "Item.status → PRICE_ASSIGNED"
          - "Item.updated_at refreshed"

      - from: PRICE_ASSIGNED
        to: COST_PENDING
        trigger: "POST /merchandise/items/{id}/landed-costs"
        actor: MerchandiseBuyer
        preconditions:
          - "Item.status == PRICE_ASSIGNED (ERR_ITEM_NOT_PRICE_ASSIGNED)"
          - "LandedCostHistory.method == FREIGHT_PASS_THROUGH requires the referenced Container.status == RECEIVED (ERR_CONTAINER_NOT_RECEIVED)"
          - "LandedCostHistory.container_id's vendor must equal the Item's sourcing vendor (ERR_CONTAINER_VENDOR_MISMATCH)"
        side_effects:
          - "LandedCostHistory row created with effective_sequence = max(existing)+1"
          - "Item.landed_cost_cents recomputed from the new highest-effective_sequence row"
          - "Item.break_even_units recomputed"
          - "Item.net_contribution_cents_per_unit recomputed"
          - "If Item.net_contribution_cents_per_unit < 0 AND Item has no ACTIVE ExclusivePackProgram: Item.status → DELETE_REVIEW"
          - "If Item.net_contribution_cents_per_unit < 0 AND Item has an ACTIVE ExclusivePackProgram: Item.status stays COST_PENDING, ERR_COST_EXCEEDS_PRICE_POINT is raised on the response"
          - "If Item.net_contribution_cents_per_unit >= 0: Item.status stays COST_PENDING"

      - from: COST_PENDING
        to: COST_PENDING
        trigger: "POST /merchandise/items/{id}/landed-costs"
        actor: MerchandiseBuyer
        note: "Cyclic revision round: the buying office may re-apply freight or a vendor price change any number of times while the item has not yet been cleared to ACTIVE. Each round appends a new LandedCostHistory row and re-derives landed_cost_cents, break_even_units and net_contribution_cents_per_unit."
        preconditions:
          - "Item.status == COST_PENDING (ERR_ITEM_NOT_COST_PENDING)"
          - "LandedCostHistory.method == FREIGHT_PASS_THROUGH requires the referenced Container.status == RECEIVED (ERR_CONTAINER_NOT_RECEIVED)"
        side_effects:
          - "LandedCostHistory row appended with effective_sequence = max(existing)+1"
          - "Item.landed_cost_cents recomputed from the new highest-effective_sequence row"
          - "Item.break_even_units and Item.net_contribution_cents_per_unit recomputed"
          - "If Item.net_contribution_cents_per_unit < 0 AND Item has no ACTIVE ExclusivePackProgram: Item.status → DELETE_REVIEW"
          - "If Item.net_contribution_cents_per_unit >= 0: Item.status stays COST_PENDING"

      - from: COST_PENDING
        to: ACTIVE
        trigger: "POST /merchandise/items/{id}/activations"
        actor: MerchandiseBuyer
        preconditions:
          - "Item.status == COST_PENDING (ERR_ITEM_NOT_COST_PENDING)"
          - "Item.net_contribution_cents_per_unit >= 0 (ERR_ITEM_NOT_COST_CLEARED)"
        side_effects:
          - "Item.status → ACTIVE"
          - "Item.price_point_id retained; Item.unit_retail_cents unchanged"

      - from: COST_PENDING
        to: DELETE_REVIEW
        trigger: "system (automatic, when a landed cost row drives net_contribution_cents_per_unit below zero)"
        actor: system
        note: "Reached from the POST /items/{id}/landed-costs side-effect chain, not by a direct client call. The landed-cost mutation on Item itself is the transition trigger."
        preconditions:
          - "Item.net_contribution_cents_per_unit < 0"
          - "No ExclusivePackProgram row exists with vendor_id == Item.sourcing_vendor_id, price_point_id == Item.price_point_id, and status == ACTIVE"
        side_effects:
          - "Item.break_even_units set to 0 (divergence regime: the break-even ratio is not defined at a non-positive unit margin)"
          - "Store.open_violation_count is NOT affected"
          - "PriceIntegrityAudit rows for the item's price point are unaffected"

      - from: DELETE_REVIEW
        to: ACTIVE
        trigger: "POST /merchandise/item-deletions/{id}/decision"
        actor: MerchandiseBuyer
        preconditions:
          - "Item.status == DELETE_REVIEW (ERR_ITEM_NOT_IN_DELETE_REVIEW)"
          - "decision == RETAIN (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "Item.status → ACTIVE"
          - "Item.price_point_id retained"

      - from: DELETE_REVIEW
        to: DELETED
        trigger: "POST /merchandise/item-deletions/{id}/decision"
        actor: MerchandiseBuyer
        note: "Transitive cascade origin. Deleting the item is hop 1; the item's open AllocationLines shorting is hop 2; Container.status retraction is hop 3 (see §1.2.1 cascade chain 1)."
        preconditions:
          - "Item.status == DELETE_REVIEW (ERR_ITEM_NOT_IN_DELETE_REVIEW)"
          - "decision == DELETE (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "Item.status → DELETED"
          - "CASCADE HOP 1: every AllocationLine with item_id == this item and status in {ALLOCATED, SHORTED} → status = REVERSED, released_units reset to 0"
          - "CASCADE HOP 2: the affected AllocationLine.store_id stores each have open_violation_count recomputed"
          - "CASCADE HOP 2: the affected AllocationLine.container_id containers each have their remaining ALLOCATED line count recomputed"
          - "CASCADE HOP 3: any Container whose remaining ALLOCATED line count is 0 and whose status is ALLOCATED → status = RECEIVED"
          - "Item.price_point_id set to null"
          - "INVARIANT container-freight-absorption: after this cascade, for each affected Container the sum over its non-REVERSED AllocationLine rows of (LandedCostHistory.applied_amount_cents - Item.base_landed_cost_cents) * AllocationLine.allocated_units is exactly 0 — the pass-through absorbed on the container is fully given back by the deletion."

      - from: PRICE_ASSIGNED
        to: DENOMINATED
        trigger: "POST /merchandise/items/{id}/price-assignment-release"
        actor: MerchandiseBuyer
        preconditions:
          - "Item.status == PRICE_ASSIGNED (ERR_ITEM_NOT_PRICE_ASSIGNED)"
        side_effects:
          - "Item.price_point_id set to null"
          - "Item.status → DENOMINATED"

  - entity: Container
    initial_state: BOOKED
    terminal_states: [ALLOCATED]
    transitions:
      - from: BOOKED
        to: IN_TRANSIT
        trigger: "POST /merchandise/containers/{id}/depart"
        actor: ImportCoordinator
        preconditions:
          - "Container.status == BOOKED (ERR_CONTAINER_NOT_BOOKED)"
        side_effects:
          - "Container.status → IN_TRANSIT"

      - from: IN_TRANSIT
        to: AT_PORT
        trigger: "POST /merchandise/containers/{id}/arrive"
        actor: ImportCoordinator
        preconditions:
          - "Container.status == IN_TRANSIT (ERR_CONTAINER_NOT_IN_TRANSIT)"
        side_effects:
          - "Container.status → AT_PORT"

      - from: AT_PORT
        to: CUSTOMS_HOLD
        trigger: "POST /merchandise/containers/{id}/customs-hold"
        actor: ImportCoordinator
        preconditions:
          - "Container.status == AT_PORT (ERR_CONTAINER_NOT_AT_PORT)"
        side_effects:
          - "Container.status → CUSTOMS_HOLD"
          - "Container.customs_cleared set to false"

      - from: CUSTOMS_HOLD
        to: AT_PORT
        trigger: "POST /merchandise/containers/{id}/customs-release"
        actor: ImportCoordinator
        note: "Revert edge: a held container returns to the port queue once the broker clears it. customs_cleared is set true on arrival at AT_PORT, so the gate is satisfied and receipt is then permitted."
        preconditions:
          - "Container.status == CUSTOMS_HOLD (ERR_CONTAINER_NOT_ON_CUSTOMS_HOLD)"
        side_effects:
          - "Container.status → AT_PORT"
          - "Container.customs_cleared set to true"
          - "Container.updated_at refreshed"

      - from: AT_PORT
        to: RECEIVED
        trigger: "POST /merchandise/containers/{id}/receive"
        actor: ImportCoordinator
        preconditions:
          - "Container.status == AT_PORT (ERR_CONTAINER_NOT_AT_PORT)"
          - "Container.customs_cleared == true (ERR_CUSTOMS_NOT_CLEARED)"
        side_effects:
          - "Container.status → RECEIVED"
          - "Container becomes eligible as the container_id of a FREIGHT_PASS_THROUGH LandedCostHistory row"

      - from: RECEIVED
        to: ALLOCATED
        trigger: "system (automatic, once every AllocationLine on the container is terminal)"
        actor: system
        preconditions:
          - "The container has at least one AllocationLine (a line-free container never auto-advances)"
          - "Every AllocationLine with container_id == this container has status in {RELEASED, SHORTED, REVERSED}"
        side_effects:
          - "Container.status → ALLOCATED"

      - from: ALLOCATED
        to: RECEIVED
        trigger: "system (automatic, when a new ALLOCATED AllocationLine is created against the container)"
        actor: system
        note: "Revert edge reached from the POST /allocation-lines side-effect chain: creating a fresh allocation line reopens the container for release."
        preconditions: []
        side_effects:
          - "Container.status → RECEIVED"

  - entity: Store
    initial_state: SINGLE_PRICE
    terminal_states: [MULTI_PRICE]
    transitions:
      - from: SINGLE_PRICE
        to: CONVERTING
        trigger: "POST /merchandise/stores/{id}/conversions"
        actor: StoreOperationsManager
        preconditions:
          - "Store.status == SINGLE_PRICE (ERR_STORE_NOT_SINGLE_PRICE)"
          - "Store.conversion_price_point_id is null (ERR_STORE_ALREADY_CONVERTING)"
          - "Target PricePoint.status == ACTIVE (ERR_PRICE_POINT_NOT_ACTIVE)"
        side_effects:
          - "Store.conversion_price_point_id = target price point"
          - "Store.status → CONVERTING"
          - "Store.sign_order_filed, shelf_tag_filed, register_file_locked all reset to false"
          - "Store.updated_at refreshed"

      - from: CONVERTING
        to: MULTI_PRICE
        trigger: "POST /merchandise/stores/{id}/conversions/{conversionId}/complete"
        actor: StoreOperationsManager
        preconditions:
          - "Store.status == CONVERTING (ERR_STORE_NOT_CONVERTING)"
          - "Store.sign_order_filed == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "Store.shelf_tag_filed == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "Store.register_file_locked == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "ConversionProject.status == IN_PROGRESS (ERR_CONVERSION_NOT_IN_PROGRESS)"
          - "ConversionProject.coverage_delta_pct >= -0.50 (ERR_AISLE_COVERAGE_SHORTFALL)"
        side_effects:
          - "Store.status → MULTI_PRICE"
          - "Store.conversion_price_point_id set to null"
          - "ConversionProject.status → COMPLETED"
          - "CASCADE HOP 1: every PriceIntegrityAudit on this store with status OPEN → status = RESOLVED"
          - "CASCADE HOP 2: Store.open_violation_count recomputed to 0"

      - from: CONVERTING
        to: SINGLE_PRICE
        trigger: "POST /merchandise/stores/{id}/conversions/{conversionId}/rollback"
        actor: StoreOperationsManager
        preconditions:
          - "Store.status is CONVERTING or REVERTING (ERR_STORE_NOT_CONVERTING)"
        side_effects:
          - "Store.status → SINGLE_PRICE"
          - "Store.conversion_price_point_id set to null"
          - "ConversionProject.status → ROLLBACK"
          - "Store.sign_order_filed, shelf_tag_filed, register_file_locked reset to false"
          - "INVARIANT conversion-binding-count: after this rollback the number of Store rows whose conversion_price_point_id is non-null is unchanged from immediately before the matching POST /stores/{id}/conversions begin — the forward and compensating actions leave the bound-store count at its prior value."

      - from: MULTI_PRICE
        to: REVERTING
        trigger: "POST /merchandise/stores/{id}/reversions"
        actor: StoreOperationsManager
        note: "Cyclic edge: a multi-price store can be pulled back toward a single price point, then re-converted. MULTI_PRICE is the terminal state of the forward path but not a sink."
        preconditions:
          - "Store.status == MULTI_PRICE (ERR_STORE_NOT_MULTI_PRICE)"
          - "Target PricePoint.status == ACTIVE (ERR_PRICE_POINT_NOT_ACTIVE)"
        side_effects:
          - "Store.conversion_price_point_id = target single price point"
          - "Store.status → REVERTING"

      - from: REVERTING
        to: SINGLE_PRICE
        trigger: "POST /merchandise/stores/{id}/conversions/{conversionId}/complete"
        actor: StoreOperationsManager
        preconditions:
          - "Store.status == REVERTING (ERR_STORE_NOT_CONVERTING)"
          - "Store.sign_order_filed == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "Store.shelf_tag_filed == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "Store.register_file_locked == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "ConversionProject.coverage_delta_pct >= -0.50 (ERR_AISLE_COVERAGE_SHORTFALL)"
        side_effects:
          - "Store.status → SINGLE_PRICE"
          - "Store.conversion_price_point_id set to null"
          - "ConversionProject.status → COMPLETED"

  - entity: ConversionProject
    initial_state: DRAFT
    terminal_states: [COMPLETED, ROLLBACK]
    transitions:
      - from: DRAFT
        to: IN_PROGRESS
        trigger: "POST /merchandise/conversion-projects/{id}/start"
        actor: StoreOperationsManager
        preconditions:
          - "ConversionProject.status == DRAFT (ERR_CONVERSION_NOT_DRAFT)"
          - "Store.status == CONVERTING (ERR_STORE_NOT_CONVERTING)"
        side_effects:
          - "ConversionProject.status → IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /merchandise/stores/{id}/conversions/{conversionId}/complete"
        actor: StoreOperationsManager
        preconditions:
          - "Store.sign_order_filed == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "Store.shelf_tag_filed == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "Store.register_file_locked == true (ERR_CONVERSION_PREREQUISITES_UNMET)"
          - "ConversionProject.coverage_delta_pct >= -0.50 (ERR_AISLE_COVERAGE_SHORTFALL)"
        side_effects:
          - "ConversionProject.status → COMPLETED"
          - "Store.status → MULTI_PRICE or SINGLE_PRICE depending on the store's prior state"

      - from: IN_PROGRESS
        to: ROLLBACK
        trigger: "POST /merchandise/stores/{id}/conversions/{conversionId}/rollback"
        actor: StoreOperationsManager
        preconditions:
          - "ConversionProject.status == IN_PROGRESS (ERR_CONVERSION_NOT_IN_PROGRESS)"
        side_effects:
          - "ConversionProject.status → ROLLBACK"
          - "Store.status → SINGLE_PRICE"

  - entity: SeasonWindow
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /merchandise/season-windows/{id}/schedule"
        actor: ResetCalendarPlanner
        preconditions:
          - "SeasonWindow.status == DRAFT (ERR_SEASON_WINDOW_NOT_DRAFT)"
          - "SeasonWindow.closes_on > SeasonWindow.opens_on (ERR_INVALID_SEASON_WINDOW)"
        side_effects:
          - "SeasonWindow.status → SCHEDULED"

      - from: SCHEDULED
        to: OPEN
        trigger: "system (automatic, when the logical clock reaches opens_on)"
        actor: system
        preconditions:
          - "logical_clock >= SeasonWindow.opens_on"
        side_effects:
          - "SeasonWindow.status → OPEN"

      - from: OPEN
        to: CLOSED
        trigger: "system (automatic, when the logical clock passes closes_on)"
        actor: system
        preconditions:
          - "logical_clock > SeasonWindow.closes_on"
        side_effects:
          - "SeasonWindow.status → CLOSED"

      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /merchandise/season-windows/{id}/unschedule"
        actor: ResetCalendarPlanner
        preconditions:
          - "SeasonWindow.status == SCHEDULED (ERR_SEASON_WINDOW_NOT_SCHEDULED)"
          - "logical_clock < SeasonWindow.opens_on"
        side_effects:
          - "SeasonWindow.status → DRAFT"

  - entity: AisleReset
    initial_state: PLANNED
    terminal_states: [EXECUTED, ABANDONED]
    transitions:
      - from: PLANNED
        to: EXECUTING
        trigger: "POST /merchandise/aisle-resets/{id}/begin"
        actor: ResetCalendarPlanner
        preconditions:
          - "AisleReset.status == PLANNED (ERR_AISLE_RESET_NOT_PLANNED)"
          - "SeasonWindow.status == OPEN (ERR_SEASON_WINDOW_NOT_OPEN)"
          - "logical_clock >= AisleReset.starts_at (ERR_RESET_OUTSIDE_CALENDAR)"
        side_effects:
          - "AisleReset.status → EXECUTING"

      - from: EXECUTING
        to: EXECUTED
        trigger: "POST /merchandise/aisle-resets/{id}/execute"
        actor: ResetCalendarPlanner
        preconditions:
          - "AisleReset.status == EXECUTING (ERR_AISLE_RESET_NOT_EXECUTING)"
          - "At least one Item exists whose status is ACTIVE and whose price_point_id equals this reset's price_point_id (ERR_NO_ELIGIBLE_ITEMS)"
        side_effects:
          - "AisleReset.status → EXECUTED"
          - "Store.updated_at refreshed"

      - from: PLANNED
        to: ABANDONED
        trigger: "POST /merchandise/aisle-resets/{id}/abandon"
        actor: StoreOperationsManager
        preconditions:
          - "AisleReset.status == PLANNED (ERR_AISLE_RESET_NOT_PLANNED)"
        side_effects:
          - "AisleReset.status → ABANDONED"

      - from: EXECUTING
        to: ABANDONED
        trigger: "POST /merchandise/aisle-resets/{id}/abandon"
        actor: StoreOperationsManager
        preconditions:
          - "AisleReset.status == EXECUTING (ERR_AISLE_RESET_NOT_PLANNED)"
        side_effects:
          - "AisleReset.status → ABANDONED"

  - entity: PriceIntegrityAudit
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "system (automatic, when the audited store completes a conversion)"
        actor: system
        note: "Bubbling close: a completed conversion reconciles shelf tags to the register file, so every open integrity violation on the store closes."
        preconditions:
          - "Store.status transitions CONVERTING or REVERTING → MULTI_PRICE or SINGLE_PRICE"
        side_effects:
          - "PriceIntegrityAudit.status → RESOLVED"
          - "Store.open_violation_count recomputed"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /merchandise/price-integrity-audits/{id}/resolve"
        actor: StoreOperationsManager
        preconditions:
          - "PriceIntegrityAudit.status == OPEN (ERR_AUDIT_ALREADY_RESOLVED)"
        side_effects:
          - "PriceIntegrityAudit.status → RESOLVED"
          - "Store.open_violation_count recomputed"

  - entity: AllocationLine
    initial_state: ALLOCATED
    terminal_states: [RELEASED, SHORTED, REVERSED]
    transitions:
      - from: ALLOCATED
        to: RELEASED
        trigger: "POST /merchandise/allocation-lines/{id}/release"
        actor: DistributionCenterOperator
        note: "Cross-entity gate: the line's own state is not sufficient — the units physically exist only once the Container has been received at the distribution center."
        preconditions:
          - "AllocationLine.status == ALLOCATED (ERR_ALLOCATION_LINE_NOT_ALLOCATED)"
          - "Container.status == RECEIVED for the line's container_id (ERR_CONTAINER_NOT_RECEIVED)"
          - "release_units >= 1 (ERR_INVALID_REQUEST)"
          - "release_units <= AllocationLine.remaining_units (ERR_RELEASE_EXCEEDS_ALLOCATION)"
        side_effects:
          - "AllocationLine.released_units += release_units"
          - "AllocationLine.remaining_units recomputed"
          - "CASCADE HOP 1: Item.on_hand_units += release_units for the line's item_id"
          - "CASCADE HOP 2: Item.is_shelf_overflow recomputed as (on_hand_units * sqft_per_unit) > shelf_package_capacity"
          - "If AllocationLine.remaining_units == 0: AllocationLine.status → RELEASED"
          - "Container.status recomputed: ALLOCATED when every line on the container is terminal, RECEIVED otherwise"

      - from: ALLOCATED
        to: SHORTED
        trigger: "POST /merchandise/allocation-lines/{id}/short"
        actor: DistributionCenterOperator
        preconditions:
          - "AllocationLine.status == ALLOCATED (ERR_ALLOCATION_LINE_NOT_ALLOCATED)"
        side_effects:
          - "AllocationLine.status → SHORTED"
          - "AllocationLine.remaining_units set to 0"
          - "CASCADE HOP 1: Store.open_violation_count recomputed for the line's store_id"
          - "CASCADE HOP 2: Container.status recomputed for the line's container_id"

      - from: ALLOCATED
        to: REVERSED
        trigger: "system (automatic, when the line's item transitions to DELETED)"
        actor: system
        note: "Reached from the POST /item-deletions/{id}/decision DELETE cascade; the line is not reversed by a direct client call."
        preconditions:
          - "Item.status == DELETED for the line's item_id"
        side_effects:
          - "AllocationLine.status → REVERSED"
          - "AllocationLine.released_units reset to 0"
          - "AllocationLine.remaining_units set to 0"
          - "Container.status recomputed for the line's container_id"

      - from: SHORTED
        to: REVERSED
        trigger: "system (automatic, when the line's item transitions to DELETED)"
        actor: system
        preconditions:
          - "Item.status == DELETED for the line's item_id"
        side_effects:
          - "AllocationLine.status → REVERSED"
          - "AllocationLine.released_units reset to 0"
          - "Container.status recomputed for the line's container_id"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: conversion-create-stale-store
    parent_entity: Store
    write_endpoint: "POST /conversion-projects"
    occ_field: "expected_store_version"
    description: |
      Creating a ConversionProject against a Store whose version has advanced
      since the client last observed it is rejected. This captures the case
      where the store's price-point binding, sign / shelf-tag / register flags,
      or conversion_price_point_id have moved on — for example because an aisle
      reset was begun against the store, or a prior conversion project was
      started — so the client's view of the store is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: conversion-patch-stale-store
    parent_entity: Store
    write_endpoint: "PATCH /conversion-projects/{id}"
    occ_field: "expected_store_version"
    description: |
      Advancing a ConversionProject whose owning Store has been mutated since
      the client last observed it is rejected, because the project's completion
      gate reads sign_order_filed / shelf_tag_filed / register_file_locked off
      the Store and those flags are only meaningful against the observed store
      version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: landed_cost_target_ceiling
    trigger: "Every PATCH /merchandise/exclusive-pack-programs/{id} call"
    algorithm: threshold
    formula: |
      ceiling = floor(
        PricePoint.shelf_price_cents
        * PricePoint.target_landed_cost_ratio
        * (1 - target_margin_buffer_pct)
      )
      rounded with round_half_down at the cent.
      The multiplication order is pinned: (shelf_price_cents * target_landed_cost_ratio)
      is computed first as an exact rational, then multiplied by
      (1 - target_margin_buffer_pct), then floored.
      ExclusivePackProgram.target_landed_cost_cents = ceiling.
      PASS when ExclusivePackProgram.quoted_landed_cost_cents <= ceiling
      (equality passes). FAIL when quoted_landed_cost_cents > ceiling.
    input_set: "The single ExclusivePackProgram being activated and its referenced PricePoint"
    constants:
      target_margin_buffer_pct: 0.12
    precision: "integer cents, floor (round_half_down at the cent)"
    variants:
      - name: draft_estimate
        when: "Status still DRAFT; the ceiling is reported for planning only"
        difference: "Reports the same ceiling but does not gate the transition — a DRAFT program may quote above the ceiling."
      - name: activation_gate
        when: "PENDING_ACTIVATION → ACTIVE"
        difference: "Same ceiling number, but now fatal: quoted_landed_cost_cents strictly above the ceiling raises ERR_PACK_COST_TARGET_MISSED and the transition does not occur."

  - name: break_even_units
    trigger: "Every POST /items/{id}/landed-costs write, and the POST /_clock/set_current_utc recompute sweep"
    algorithm: threshold
    formula: |
      total_landed_cost_cents =
          Item.landed_cost_cents * Item.units_per_case
        + Item.fixed_store_handling_cents
      unit_margin_cents = Item.unit_retail_cents - Item.variable_store_cost_cents

      if Item.landed_cost_cents == 0 AND Item has no LandedCostHistory row:
          # not yet costed — the ratio has no denominator to evaluate against
          break_even_units = 0
          regime = PRICE_PENDING
      elif unit_margin_cents <= 0:
          # divergence regime — the item cannot recover its unit variable cost at the fixed retail
          break_even_units = 0
          regime = DIVERGENCE_OR_ZERO_MARGIN
      else:
          # convergence regime — a unique non-negative integer fixed point
          break_even_units = ceil(total_landed_cost_cents / unit_margin_cents)
          regime = CONVERGENCE

      Evaluation order is pinned: total_landed_cost_cents first, then
      unit_margin_cents, then the branch. The division uses exact rational
      arithmetic and ceil is taken at the end — never a running float.
    input_set: "The single Item being costed; reads Item.landed_cost_cents, Item.units_per_case, Item.fixed_store_handling_cents, Item.unit_retail_cents, Item.variable_store_cost_cents"
    constants:
      fixed_store_handling_cents: 6
      variable_store_cost_cents: 4
    precision: "integer units, ceil"
    variants:
      - name: price_pending_regime
        when: "the item has taken no landed cost row yet (Item.landed_cost_cents == 0 and LandedCostHistory is empty)"
        difference: "Reports break_even_units 0 and regime PRICE_PENDING, a third declared shape distinct from both a real divergence and a real convergence — a brand-new item is not yet a losing item."
      - name: convergence_regime
        when: "unit_margin_cents > 0"
        difference: "Closed-form ceil of the ratio; the item's contribution turns positive at exactly break_even_units."
      - name: divergence_regime
        when: "unit_margin_cents <= 0"
        difference: "No finite break-even exists, so the rule pins the sentinel value 0 — NOT a null, NOT a negative, and NOT 'unbounded'. The two regimes are the dual-variant pair: identical inputs, different result shapes."

  - name: shelf_allocation_waterfall
    trigger: "POST /merchandise/allocation-lines and the POST /_clock/set_current_utc recompute sweep"
    algorithm: waterfall_allocation
    formula: |
      unit_shelf_capacity(item) = floor(Item.shelf_package_capacity / Item.sqft_per_unit)

      capacity_ceiling(line) =
          unit_shelf_capacity(line.Item) + line.Item.units_per_case
              when line.Item.broken_case_allowance == true
          unit_shelf_capacity(line.Item)
              otherwise
      # The broken-case branch arms the base-deck allowance: one extra full
      # case may sit beside the shelf when a single case cannot fit on it.

      Grouping is pinned: capacity is held PER (container, item, store) group and
      is NEVER pooled across stores or across containers. Within a group, lines
      are processed in AllocationLine.sequence ASC order. Ties are impossible
      because sequence is unique within a container.

      for each group (container_id, item_id, store_id):
          already = 0
          for line in group's lines ordered by line.sequence ASC:
              remaining_capacity = max(0, capacity_ceiling(group's first line) - already)
              line.allocated_units = min(line.requested_units, remaining_capacity)
              line.overflow_units  = line.requested_units - line.allocated_units
              already += line.allocated_units
              if line.allocated_units == 0 and line.requested_units > 0:
                  line.status = OVERFLOW
              else:
                  line.status = ALLOCATED

      Evaluation order is pinned: capacity_ceiling first (which reads
      broken_case_allowance), then the per-group running `already`, then the min.
      The container's allocated-unit total used by
      freight_pass_through_apportionment is the sum of allocated_units over all
      lines whose status is not REVERSED.
    input_set: "Items whose status is in {PRICE_ASSIGNED, COST_PENDING, ACTIVE} — items in DENOMINATED or DELETE_REVIEW never draw container units. Lines whose status is REVERSED are skipped."
    constants:
      base_deck_allowance_cases: 1
    precision: "integer units, floor"
    variants:
      - name: broken_case_overflow_guard
        when: "Item.broken_case_allowance == true — one full case does not fit on the shelf (units_per_case * sqft_per_unit > shelf_package_capacity)"
        difference: "The line's ceiling is unit_shelf_capacity + units_per_case, so a broken-case line places one extra full case on the base deck: a 40-unit shelf with a 100-unit case accepts 140 units, not 40."
      - name: strict_capacity
        when: "Item.broken_case_allowance == false"
        difference: "The line's ceiling is unit_shelf_capacity alone, so the same 150-unit request against a 40-unit shelf is capped at 40 with 110 units recorded as overflow."

  - name: conversion_coverage_shortfall
    trigger: "POST /stores/{id}/conversions/{conversionId}/complete, and every GET /conversion-projects/{id}/coverage"
    algorithm: aggregation
    formula: |
      completed_aisle_count = number of AisleReset rows on the store with status EXECUTED
      projected_convertible_aisle_count = number of AisleReset rows on the store with status in {PLANNED, EXECUTING}
      adjusted_baseline = max(projected_convertible_aisle_count, shortfall_floor_aisles)
      coverage_delta_pct = (completed_aisle_count - adjusted_baseline) / adjusted_baseline
      rounded to 3 decimal places with round_half_up.
      Shortfall is declared exactly when coverage_delta_pct < tolerance_pct,
      evaluated on the ROUNDED value. coverage_delta_pct == -0.50 passes.
    input_set: "All AisleReset rows on the store; ABANDONED rows are excluded from both counts"
    constants:
      tolerance_pct: -0.50
      shortfall_floor_aisles: 1
    precision: "3 decimal places, round_half_up"
    variants:
      - name: empty_reset_set
        when: "projected_convertible_aisle_count == 0"
        difference: "adjusted_baseline equals shortfall_floor_aisles (1), so coverage_delta_pct is (completed - 1) / 1 — a store with zero projected and zero completed resets reports -1.000 against a baseline of 1, never a division-by-zero."
      - name: populated_reset_set
        when: "projected_convertible_aisle_count >= 1"
        difference: "adjusted_baseline is the projected count itself and the shortfall check is the literal -0.50 boundary."

  - name: freight_pass_through_apportionment
    trigger: "POST /items/{id}/landed-costs with method FREIGHT_PASS_THROUGH"
    algorithm: weighted_scoring
    formula: |
      Per container:
        container_total_units = sum of AllocationLine.allocated_units across every
                                line on the container whose status is not REVERSED
        freight_per_unit_cents = floor(Container.total_freight_cents / container_total_units)
                                 # exact rational division, floored ONCE to whole cents

      Per item receiving a pass-through from that container:
        applied_amount_cents = Item.base_landed_cost_cents + freight_per_unit_cents

      Rounding order is pinned: the freight rate is floored ONCE for the whole
      container, at whole-cent precision, BEFORE any per-item application. The
      explicitly WRONG alternative — apportioning each item a share floored
      individually, floor(total_freight * item_units / container_total_units) —
      produces a different per-unit number for the same container. The residual
      cents left by the single floor are dropped and never redistributed, so the
      invariant pinned in compensating_invariant / container-freight-apportionment
      (freight_per_unit_cents * container_total_units <= Container.total_freight_cents)
      always holds with no drift.
    input_set: "Every line on the container; lines with status REVERSED are excluded from container_total_units"
    constants:
      base_landed_cost_cents_source: "Item.base_landed_cost_cents"
    precision: "integer cents, floor once per container"
    variants:
      - name: floor_once_per_container
        when: "always — the sanctioned evaluation"
        difference: "One floor at container level; every item on the container receives the identical per-unit freight rate."
      - name: floor_per_item_share
        when: "NOT SANCTIONED — documented as the trap"
        difference: "Flooring floor(total_freight_cents * item_units / container_total_units) for each item independently yields a different per-unit rate per item; the scaffold pins floor_once_per_container and rejects this variant."

  - name: net_contribution_cents_per_unit
    trigger: "Every POST /items/{id}/landed-costs write"
    algorithm: weighted_scoring
    formula: |
      net_contribution_cents_per_unit =
          Item.unit_retail_cents
        - Item.landed_cost_cents
        - Item.variable_store_cost_cents
      Signed integer. The evaluation order is pinned (retail, then landed
      cost, then variable store cost) so the sign is well-defined when
      landed_cost_cents exceeds unit_retail_cents.
    input_set: "The single Item being costed"
    constants:
      variable_store_cost_cents: 4
    precision: "integer cents, exact"

  - name: price_integrity_result
    trigger: "POST /price-integrity-audits"
    algorithm: threshold
    formula: |
      if observed_item_count == 0:
          mismatch_ratio = 0
          result = WITHIN_TOLERANCE
      else:
          mismatch_ratio = round(mismatched_item_count / observed_item_count, 3) with round_half_up
          result = VIOLATION if mismatch_ratio > mismatch_tolerance_pct else WITHIN_TOLERANCE

      The boundary is strict: a mismatch_ratio exactly equal to
      mismatch_tolerance_pct is WITHIN_TOLERANCE; only a ratio strictly
      greater is a VIOLATION. The comparison runs on the ROUNDED ratio, so
      5/97 = 0.052 (rounded) is WITHIN_TOLERANCE while 5/96 = 0.052083…
      rounds to 0.052 and is also WITHIN_TOLERANCE — the branch flips only
      when the rounded 3-decimal value exceeds 0.052.
    input_set: "The single PriceIntegrityAudit being created"
    constants:
      mismatch_tolerance_pct: 0.052
    precision: "3 decimal places, round_half_up"

  - name: season_window_lifecycle
    trigger: "Every GET /season-windows read and the POST /_clock/set_current_utc recompute sweep"
    algorithm: threshold
    formula: |
      Derived status, evaluated against the logical clock on read:
        logical_clock <  SeasonWindow.opens_on                         -> DRAFT or SCHEDULED (as stored)
        opens_on <= logical_clock <= SeasonWindow.closes_on            -> OPEN
        logical_clock >  SeasonWindow.closes_on                        -> CLOSED
      The window is CLOSED on the instant AFTER closes_on; closes_on
      itself is still OPEN (inclusive upper bound).
    input_set: "The single SeasonWindow being read"
    constants: {}
    precision: "exact datetime comparison, no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and X-User-Role must be one of the seven declared roles"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The X-User-Role must be listed in the target endpoint's roles set"
    error_id: ERR_INSUFFICIENT_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Resource ids appearing in the path must resolve, validated left-to-right in the order the path declares them"
    error_id: "ERR_ITEM_NOT_FOUND | ERR_CONTAINER_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_PRICE_POINT_NOT_FOUND | ERR_SEASON_WINDOW_NOT_FOUND | ERR_AISLE_RESET_NOT_FOUND | ERR_ALLOCATION_LINE_NOT_FOUND | ERR_CONVERSION_PROJECT_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_PACK_PROGRAM_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"

  - priority: 4
    category: business_referential
    check: "Foreign keys supplied in a request body must resolve before any business rule is evaluated; body FKs are validated in the order the endpoint's input list declares them"
    error_id: "ERR_ITEM_NOT_FOUND | ERR_CONTAINER_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_PRICE_POINT_NOT_FOUND | ERR_SEASON_WINDOW_NOT_FOUND"
    http_status: 404
    applies_to: "POST /items, POST /exclusive-pack-programs, POST /containers, POST /aisle-resets, POST /allocation-lines, POST /price-integrity-audits, POST /conversion-projects, POST /multi-price-issues"

  - priority: 5
    category: state
    check: "The acting resource must be in the state its transition declares as `from:`"
    error_id: "ERR_ITEM_NOT_PRICE_ASSIGNED | ERR_ITEM_NOT_COST_PENDING | ERR_ITEM_NOT_DENOMINATED | ERR_ITEM_NOT_IN_DELETE_REVIEW | ERR_STORE_NOT_SINGLE_PRICE | ERR_STORE_NOT_CONVERTING | ERR_STORE_NOT_MULTI_PRICE | ERR_CONTAINER_NOT_BOOKED | ERR_CONTAINER_NOT_IN_TRANSIT | ERR_CONTAINER_NOT_AT_PORT | ERR_CONTAINER_NOT_RECEIVED | ERR_CONTAINER_NOT_ON_CUSTOMS_HOLD | ERR_ALLOCATION_LINE_NOT_ALLOCATED | ERR_AISLE_RESET_NOT_PLANNED | ERR_AISLE_RESET_NOT_EXECUTING | ERR_CONVERSION_NOT_DRAFT | ERR_CONVERSION_NOT_IN_PROGRESS | ERR_AUDIT_ALREADY_RESOLVED | ERR_SEASON_WINDOW_NOT_DRAFT | ERR_SEASON_WINDOW_NOT_SCHEDULED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCC token equality: expected_store_version must equal Store.version of the store the request targets or was issued against"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /conversion-projects, PATCH /conversion-projects/{id}"

  - priority: 7
    category: business_constraint
    check: "Declared request-shape constraints: units_per_case >= 1; sqft_per_unit > 0; shelf_package_capacity > 0; pack_qty >= 1; case_pack_qty >= 1; sequence >= 1; requested_units >= 0; observed_item_count >= 0; mismatched_item_count <= observed_item_count; release_units >= 1; closes_on > opens_on; ends_at > starts_at; to_price_point_id != from_price_point_id; decision in {RETAIN, DELETE}; method in {FREIGHT_PASS_THROUGH, VENDOR_PRICE_CHANGE}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 8
    category: business_constraint
    check: "Unique-key constraints on creation: Item.sku, Vendor.vendor_name, Store.store_number, Container.container_number"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /items, POST /vendors, POST /stores, POST /containers"

  - priority: 9
    category: business_constraint
    check: "Price integrity: Item.unit_retail_cents must equal PricePoint.shelf_price_cents of the item's assigned price point"
    error_id: ERR_PRICE_POINT_MISMATCH
    http_status: 422
    applies_to: "POST /items/{id}/price-assignments"

  - priority: 10
    category: business_constraint
    check: "Target PricePoint must be in status ACTIVE before it may be issued to an item, a store conversion, a store reversion, or an exclusive pack program"
    error_id: ERR_PRICE_POINT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /items/{id}/price-assignments, POST /stores/{id}/conversions, POST /stores/{id}/reversions, PATCH /exclusive-pack-programs/{id}"

  - priority: 11
    category: business_constraint
    check: "Container.customs_cleared must be true before the container may be received"
    error_id: ERR_CUSTOMS_NOT_CLEARED
    http_status: 409
    applies_to: "POST /containers/{id}/receive"

  - priority: 12
    category: business_temporal
    check: "AisleReset [starts_at, ends_at] must not overlap any non-terminal AisleReset (status in {PLANNED, EXECUTING}) on the SAME aisle_code of the same store. Overlap is detected under the half-open convention: existing.starts_at < new.ends_at AND new.starts_at < existing.ends_at — touching endpoints do NOT conflict."
    error_id: ERR_AISLE_RESET_OVERLAP
    http_status: 409
    applies_to: "POST /aisle-resets"

  - priority: 13
    category: business_temporal
    check: "AisleReset [starts_at, ends_at] must fall entirely inside its SeasonWindow [opens_on, closes_on], inclusive at both ends. An interval that starts before opens_on or ends after closes_on is rejected."
    error_id: ERR_RESET_OUTSIDE_CALENDAR
    http_status: 409
    applies_to: "POST /aisle-resets, POST /aisle-resets/{id}/begin"

  - priority: 14
    category: business_temporal
    check: "Aggregate store-day commitment: the sum of allocated shelf capacity across all non-terminal AisleResets on one store whose intervals overlap the candidate interval must not exceed Store.shelf_facing_capacity_sqft. Overlap here is the closed convention (starts_at <= other.ends_at AND ends_at >= other.starts_at), so touching endpoints DO share the day."
    error_id: ERR_STORE_DAY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /aisle-resets"

  - priority: 15
    category: business_safety
    check: "A container must be in status RECEIVED before it backs a charge: a FREIGHT_PASS_THROUGH landed cost row may only reference a RECEIVED container, and an allocation line may only be released against a line whose container is RECEIVED"
    error_id: ERR_CONTAINER_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /merchandise/items/{id}/landed-costs, POST /merchandise/allocation-lines/{id}/release"

  - priority: 16
    category: business_safety
    check: "A FREIGHT_PASS_THROUGH landed cost row may only reference a container whose vendor_id equals the item's sourcing vendor"
    error_id: ERR_CONTAINER_VENDOR_MISMATCH
    http_status: 409
    applies_to: "POST /items/{id}/landed-costs"

  - priority: 17
    category: business_referential
    check: "A conversion-issue batch may only carry items whose current Item.price_point_id equals the batch's own from_price_point_id — the store's outgoing single price point"
    error_id: ERR_ITEM_NOT_AT_SOURCE_PRICE_POINT
    http_status: 409
    applies_to: "POST /multi-price-issues"

  - priority: 18
    category: business_safety
    check: "When an Item.net_contribution_cents_per_unit is negative, activation is only permitted if the item is cured by an exclusive pack: there must exist an ExclusivePackProgram row with vendor_id == Item.sourcing_vendor_id, price_point_id == Item.price_point_id, and status == ACTIVE. The join is pinned on those three fields."
    error_id: ERR_ITEM_NOT_COST_CLEARED
    http_status: 422
    applies_to: "POST /items/{id}/activations"

  - priority: 19
    category: business_referential
    check: "While a Store is CONVERTING, every AisleReset opened on that store must carry a price_point_id equal to the store's conversion_price_point_id — a mixed price point inside a single conversion is rejected"
    error_id: ERR_PRICE_POINT_MIXED_WITHIN_CONVERSION
    http_status: 409
    applies_to: "POST /aisle-resets"

  - priority: 20
    category: business_fiscal
    check: "The audited store must not already carry an OPEN PriceIntegrityAudit whose price_point_id differs from the new audit's price_point_id — a second price point cannot be opened against a store with unresolved integrity violations"
    error_id: ERR_MIXED_PRICE_POINT_OPEN_VIOLATION
    http_status: 422
    applies_to: "POST /price-integrity-audits"

  - priority: 21
    category: business_fiscal
    check: "An ExclusivePackProgram may not be advanced to ACTIVE when quoted_landed_cost_cents exceeds the target landed cost ceiling"
    error_id: ERR_PACK_COST_TARGET_MISSED
    http_status: 422
    applies_to: "PATCH /exclusive-pack-programs/{id}"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:

  # --- Test-driving: logical clock -------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z; before any call to this endpoint the clock reads that fixed default and never falls back to real wall-clock time. This call re-derives every clock-dependent computed field: SeasonWindow derived status, Item.break_even_units, and the shelf_allocation_waterfall sweep."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, recomputed_item_count: integer, recomputed_season_window_count: integer }
    side_effects:
      - "logical clock set to to_iso8601"
      - "Every SeasonWindow derived status re-evaluated against the new clock"
      - "Item.break_even_units recomputed for every Item"

  # --- PricePoint -------------------------------------------------------------
  - method: POST
    path: "/merchandise/price-points"
    description: "Register a fixed shelf price point and its landing-cost ceiling ratio"
    roles: [MerchandiseBuyer]
    code: 201
    input: [label, shelf_price_cents, target_landed_cost_ratio]
    output: PricePoint
    side_effects: ["status = DRAFT", "issued_store_count = 0"]

  - method: GET
    path: "/merchandise/price-points"
    description: "List shelf price points"
    roles: [MerchandiseBuyer, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PricePoint[]"
    side_effects: []

  - method: GET
    path: "/merchandise/price-points/{id}"
    description: "Read one shelf price point"
    roles: [MerchandiseBuyer, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: []
    output: PricePoint
    side_effects: []

  - method: POST
    path: "/merchandise/price-points/{id}/activate"
    description: "Activate a price point so it may be issued"
    roles: [MerchandiseBuyer]
    code: 200
    input: []
    output: PricePoint
    side_effects: ["status → ACTIVE"]

  - method: GET
    path: "/merchandise/price-points/{id}/aisle-resets"
    description: "List the aisle resets scheduled to carry a price point"
    roles: [MerchandiseBuyer, ResetCalendarPlanner, MerchandiseAnalyst]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: "AisleReset[]"
    side_effects: []

  - method: GET
    path: "/merchandise/price-points/{id}/conversion-projects"
    description: "List the conversion projects whose source or destination is a price point"
    roles: [MerchandiseBuyer, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConversionProject[]"
    side_effects: []

  # --- Vendor -----------------------------------------------------------------
  - method: POST
    path: "/merchandise/vendors"
    description: "Register a vendor"
    roles: [MerchandiseBuyer]
    code: 201
    input: [vendor_name, country_of_origin, import_flag]
    output: Vendor
    side_effects: ["exclusivity_program_count = 0"]

  - method: GET
    path: "/merchandise/vendors"
    description: "List vendors"
    roles: [MerchandiseBuyer, MerchandiseAnalyst]
    code: 200
    input: ["import_flag?", "limit?", "offset?"]
    output: "Vendor[]"
    side_effects: []

  - method: GET
    path: "/merchandise/vendors/{id}"
    description: "Read one vendor"
    roles: [MerchandiseBuyer, MerchandiseAnalyst]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/merchandise/vendors/{id}/exclusive-pack-programs"
    description: "List the exclusive pack programs developed for a vendor"
    roles: [MerchandiseBuyer, MerchandiseAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ExclusivePackProgram[]"
    side_effects: []

  # --- ExclusivePackProgram ---------------------------------------------------
  - method: POST
    path: "/merchandise/exclusive-pack-programs"
    description: "Open a vendor-developed exclusive pack configuration aimed at a shelf price point"
    roles: [MerchandiseBuyer]
    code: 201
    input: [vendor_id, price_point_id, pack_qty, case_pack_qty, formulation_code, quoted_landed_cost_cents]
    output: ExclusivePackProgram
    side_effects: ["status = DRAFT", "target_landed_cost_cents computed via landed_cost_target_ceiling"]

  - method: GET
    path: "/merchandise/exclusive-pack-programs"
    description: "List exclusive pack programs"
    roles: [MerchandiseBuyer, MerchandiseAnalyst]
    code: 200
    input: ["vendor_id?", "price_point_id?", "status?", "limit?", "offset?"]
    output: "ExclusivePackProgram[]"
    side_effects: []

  - method: GET
    path: "/merchandise/exclusive-pack-programs/{id}"
    description: "Read one exclusive pack program"
    roles: [MerchandiseBuyer, MerchandiseAnalyst]
    code: 200
    input: []
    output: ExclusivePackProgram
    side_effects: []

  - method: PATCH
    path: "/merchandise/exclusive-pack-programs/{id}"
    description: "Advance an exclusive pack program's status, optionally re-quoting its landed cost. DRAFT → PENDING_ACTIVATION → ACTIVE, and ACTIVE → TERMINATED. The ACTIVE transition is the landing gate: target_landed_cost_cents is re-derived from the price point and compared against quoted_landed_cost_cents."
    roles: [MerchandiseBuyer]
    code: 200
    input: [status, "quoted_landed_cost_cents?"]
    output: ExclusivePackProgram
    side_effects:
      - "target_landed_cost_cents recomputed via landed_cost_target_ceiling"
      - "status → requested value"
      - "On ACTIVE: Vendor.exclusivity_program_count incremented by 1"

  # --- Item -------------------------------------------------------------------
  - method: POST
    path: "/merchandise/items"
    description: "Denominate a new item at a fixed retail, before any price-point assignment"
    roles: [MerchandiseBuyer]
    code: 201
    input: [sku, description, unit_retail_cents, commodity_class, season_code, sqft_per_unit, shelf_package_capacity, units_per_case, base_landed_cost_cents, fixed_store_handling_cents, variable_store_cost_cents, sourcing_vendor_id]
    output: Item
    side_effects:
      - "status = DENOMINATED"
      - "price_point_id = null"
      - "on_hand_units = 0"
      - "broken_case_allowance, is_shelf_overflow, landed_cost_cents, break_even_units, net_contribution_cents_per_unit derived"

  - method: GET
    path: "/merchandise/items"
    description: "List items"
    roles: [MerchandiseBuyer, MerchandiseAnalyst, StoreOperationsManager, LegalCostEngineer]
    code: 200
    input: ["status?", "price_point_id?", "sourcing_vendor_id?", "commodity_class?", "season_code?", "limit?", "offset?"]
    output: "Item[]"
    side_effects: []

  - method: GET
    path: "/merchandise/items/{id}"
    description: "Read one item with all derived cost fields"
    roles: [MerchandiseBuyer, MerchandiseAnalyst, StoreOperationsManager, LegalCostEngineer]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: POST
    path: "/merchandise/items/{id}/price-assignments"
    description: "Fix an item to a shelf price point; requires the item's retail to already equal that price point's shelf price"
    roles: [MerchandiseBuyer]
    code: 200
    input: [price_point_id]
    output: Item
    side_effects: ["status → PRICE_ASSIGNED", "price_point_id set"]

  - method: POST
    path: "/merchandise/items/{id}/price-assignment-release"
    description: "Release an item back to DENOMINATED before it has taken any cost"
    roles: [MerchandiseBuyer]
    code: 200
    input: []
    output: Item
    side_effects: ["status → DENOMINATED", "price_point_id = null"]

  - method: POST
    path: "/merchandise/items/{id}/landed-costs"
    description: "Apply a landed cost to an item — either a freight pass-through from a received container or a vendor price change. Appends a LandedCostHistory row and re-derives the item's cost fields; a negative net contribution pushes the item into DELETE_REVIEW or raises ERR_COST_EXCEEDS_PRICE_POINT."
    roles: [MerchandiseBuyer]
    code: 201
    input: [method, applied_amount_cents, "container_id?"]
    output: LandedCostHistory
    side_effects:
      - "LandedCostHistory row created with server-minted effective_sequence"
      - "Item.landed_cost_cents, break_even_units, net_contribution_cents_per_unit recomputed"
      - "status → COST_PENDING, or DELETE_REVIEW when the net contribution is negative with no ACTIVE pack program"
      - "ERR_COST_EXCEEDS_PRICE_POINT raised on the response when the net contribution is negative but an ACTIVE pack program exists"

  - method: GET
    path: "/merchandise/items/{id}/landed-costs"
    description: "List the landed cost history for an item, newest applicable row first"
    roles: [MerchandiseBuyer, MerchandiseAnalyst, LegalCostEngineer]
    code: 200
    input: ["method?", "container_id?", "limit?", "offset?"]
    output: "LandedCostHistory[]"
    side_effects: []

  - method: GET
    path: "/merchandise/landed-cost-history"
    description: "List landed cost history rows across items, filterable by item and container"
    roles: [MerchandiseBuyer, MerchandiseAnalyst, LegalCostEngineer]
    code: 200
    input: ["item_id?", "container_id?", "method?", "limit?", "offset?"]
    output: "LandedCostHistory[]"
    side_effects: []

  - method: GET
    path: "/merchandise/items/{id}/break-even"
    description: "Read the item's break-even projection at the current committed landed cost; regime reports PRICE_PENDING when the item has taken no cost row yet, CONVERGENCE when the unit margin is positive, and DIVERGENCE_OR_ZERO_MARGIN otherwise"
    roles: [MerchandiseBuyer, MerchandiseAnalyst, LegalCostEngineer]
    code: 200
    input: []
    output: { item_id: string, break_even_units: integer, unit_retail_cents: integer, landed_cost_cents: integer, variable_store_cost_cents: integer, net_contribution_cents_per_unit: integer, regime: string }
    side_effects: []

  - method: POST
    path: "/merchandise/items/{id}/activations"
    description: "Clear an item to sell at its fixed price point once its landed cost is covered"
    roles: [MerchandiseBuyer]
    code: 200
    input: []
    output: Item
    side_effects: ["status → ACTIVE"]

  # --- ItemDeletion -----------------------------------------------------------
  - method: POST
    path: "/merchandise/item-deletions/{id}/decision"
    description: "Disposition a DELETE_REVIEW item: RETAIN clears it back to ACTIVE, DELETE terminates it and cascades through allocation lines and the container"
    roles: [MerchandiseBuyer]
    code: 200
    input: [decision]
    output: Item
    side_effects:
      - "status → ACTIVE (RETAIN) or DELETED (DELETE)"
      - "On DELETE: AllocationLines REVERSED → Store.open_violation_count recomputed → Container.status retracted"

  # --- Container --------------------------------------------------------------
  - method: POST
    path: "/merchandise/containers"
    description: "Book an import container carrying a vendor's purchase order"
    roles: [ImportCoordinator]
    code: 201
    input: [vendor_id, container_number, port_code, dc_code, total_freight_cents]
    output: Container
    side_effects: ["status = BOOKED", "customs_cleared = false"]

  - method: GET
    path: "/merchandise/containers"
    description: "List containers"
    roles: [ImportCoordinator, MerchandiseAnalyst, DistributionCenterOperator]
    code: 200
    input: ["status?", "vendor_id?", "limit?", "offset?"]
    output: "Container[]"
    side_effects: []

  - method: GET
    path: "/merchandise/containers/{id}"
    description: "Read one container"
    roles: [ImportCoordinator, MerchandiseAnalyst, DistributionCenterOperator]
    code: 200
    input: []
    output: Container
    side_effects: []

  - method: POST
    path: "/merchandise/containers/{id}/depart"
    description: "Move a booked container onto the water"
    roles: [ImportCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status → IN_TRANSIT"]

  - method: POST
    path: "/merchandise/containers/{id}/arrive"
    description: "Discharge the container at the port of entry"
    roles: [ImportCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status → AT_PORT"]

  - method: POST
    path: "/merchandise/containers/{id}/customs-hold"
    description: "Place a discharged container on customs hold"
    roles: [ImportCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status → CUSTOMS_HOLD", "customs_cleared = false"]

  - method: POST
    path: "/merchandise/containers/{id}/customs-release"
    description: "Clear the broker hold and return the container to the port queue with customs declared cleared"
    roles: [ImportCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status → AT_PORT", "customs_cleared = true"]

  - method: POST
    path: "/merchandise/containers/{id}/receive"
    description: "Receive a customs-cleared container at the distribution center, making its freight eligible for pass-through"
    roles: [ImportCoordinator]
    code: 200
    input: []
    output: Container
    side_effects: ["status → RECEIVED"]

  - method: GET
    path: "/merchandise/containers/{id}/landed-cost-history"
    description: "List the landed cost history rows that carry freight passed through from a container"
    roles: [MerchandiseBuyer, MerchandiseAnalyst, LegalCostEngineer]
    code: 200
    input: ["item_id?", "limit?", "offset?"]
    output: "LandedCostHistory[]"
    side_effects: []

  # --- AllocationLine ---------------------------------------------------------
  - method: POST
    path: "/merchandise/allocation-lines"
    description: "Allocate container units to a store and item, constrained by the item's current shelf capacity. Any unit that cannot be placed on the shelf is recorded as overflow on the line."
    roles: [DistributionCenterOperator]
    code: 201
    input: [container_id, store_id, item_id, sequence, requested_units]
    output: AllocationLine
    side_effects:
      - "allocated_units derived via shelf_allocation_waterfall"
      - "remaining_shelf_capacity_units computed"
      - "overflow_units computed"
      - "status = ALLOCATED, or OVERFLOW when overflow_units > 0 and allocated_units == 0"
      - "Container.status recomputed"

  - method: GET
    path: "/merchandise/allocation-lines"
    description: "List allocation lines, filterable by container, store, item or status"
    roles: [DistributionCenterOperator, ImportCoordinator, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["container_id?", "store_id?", "item_id?", "status?", "limit?", "offset?"]
    output: "AllocationLine[]"
    side_effects: []

  - method: GET
    path: "/merchandise/allocation-lines/{id}"
    description: "Read one allocation line"
    roles: [DistributionCenterOperator, ImportCoordinator, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: []
    output: AllocationLine
    side_effects: []

  - method: GET
    path: "/merchandise/containers/{id}/allocation-lines"
    description: "List the allocation lines a container was broken into"
    roles: [DistributionCenterOperator, ImportCoordinator, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AllocationLine[]"
    side_effects: []

  - method: POST
    path: "/merchandise/allocation-lines/{id}/release"
    description: "Release allocated units to the store's on-hand, which recomputes the item's shelf overflow flag"
    roles: [DistributionCenterOperator]
    code: 200
    input: [release_units]
    output: AllocationLine
    side_effects:
      - "released_units += release_units"
      - "Item.on_hand_units += release_units"
      - "Item.is_shelf_overflow recomputed"
      - "status → RELEASED when remaining_units == 0"
      - "Container.status recomputed"

  - method: POST
    path: "/merchandise/allocation-lines/{id}/short"
    description: "Short an allocation line, recording that the distribution center could not fill it"
    roles: [DistributionCenterOperator]
    code: 200
    input: []
    output: AllocationLine
    side_effects:
      - "status → SHORTED, remaining_units = 0"
      - "Store.open_violation_count recomputed"
      - "Container.status recomputed"

  # --- Store ------------------------------------------------------------------
  - method: POST
    path: "/merchandise/stores"
    description: "Register a store with its shelf facing capacity"
    roles: [StoreOperationsManager]
    code: 201
    input: [store_number, shelf_facing_capacity_sqft]
    output: Store
    side_effects: ["status = SINGLE_PRICE", "conversion_price_point_id = null", "open_violation_count = 0"]

  - method: GET
    path: "/merchandise/stores"
    description: "List stores"
    roles: [StoreOperationsManager, MerchandiseAnalyst, MerchandiseBuyer, LegalCostEngineer]
    code: 200
    input: ["status?", "conversion_price_point_id?", "limit?", "offset?"]
    output: "Store[]"
    side_effects: []

  - method: GET
    path: "/merchandise/stores/{id}"
    description: "Read one store"
    roles: [StoreOperationsManager, MerchandiseAnalyst, MerchandiseBuyer, LegalCostEngineer]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: POST
    path: "/merchandise/stores/{id}/conversions"
    description: "Begin converting a single-price store to a new price point"
    roles: [StoreOperationsManager]
    code: 200
    input: [to_price_point_id]
    output: Store
    side_effects:
      - "status → CONVERTING"
      - "conversion_price_point_id set"
      - "sign_order_filed, shelf_tag_filed, register_file_locked reset to false"

  - method: POST
    path: "/merchandise/stores/{id}/conversions/{conversionId}/filing"
    description: "File one of the three conversion artefacts: the signage order, the shelf-tag file, or the register file lock"
    roles: [StoreOperationsManager]
    code: 200
    input: [artifact]
    output: Store
    side_effects: ["sets the matching flag true", "Store.version incremented"]

  - method: POST
    path: "/merchandise/stores/{id}/conversions/{conversionId}/complete"
    description: "Complete a conversion once all three artefacts are filed and the aisle coverage clears the tolerance; also closes every open price-integrity violation on the store"
    roles: [StoreOperationsManager]
    code: 200
    input: []
    output: Store
    side_effects:
      - "status → MULTI_PRICE (from CONVERTING) or SINGLE_PRICE (from REVERTING)"
      - "conversion_price_point_id = null"
      - "ConversionProject.status → COMPLETED"
      - "All OPEN PriceIntegrityAudit rows on the store → RESOLVED"
      - "Store.open_violation_count recomputed"

  - method: POST
    path: "/merchandise/stores/{id}/conversions/{conversionId}/rollback"
    description: "Abandon an in-progress conversion and return the store to a single price point"
    roles: [StoreOperationsManager]
    code: 200
    input: []
    output: Store
    side_effects:
      - "status → SINGLE_PRICE"
      - "conversion_price_point_id = null"
      - "ConversionProject.status → ROLLBACK"
      - "artefact flags reset to false"

  - method: POST
    path: "/merchandise/stores/{id}/reversions"
    description: "Begin pulling a multi-price store back to a single price point"
    roles: [StoreOperationsManager]
    code: 200
    input: [to_price_point_id]
    output: Store
    side_effects: ["status → REVERTING", "conversion_price_point_id set"]

  - method: GET
    path: "/merchandise/stores/{id}/price-integrity-audits"
    description: "List the price integrity audits filed against a store"
    roles: [StoreOperationsManager, MerchandiseAnalyst, LegalCostEngineer]
    code: 200
    input: ["result?", "status?", "limit?", "offset?"]
    output: "PriceIntegrityAudit[]"
    side_effects: []

  - method: GET
    path: "/merchandise/stores/{id}/aisle-resets"
    description: "List the aisle resets planned against a store"
    roles: [StoreOperationsManager, ResetCalendarPlanner, MerchandiseAnalyst]
    code: 200
    input: ["status?", "season_window_id?", "limit?", "offset?"]
    output: "AisleReset[]"
    side_effects: []

  - method: GET
    path: "/merchandise/stores/{id}/conversion-projects"
    description: "List the conversion projects opened against a store"
    roles: [StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConversionProject[]"
    side_effects: []

  # --- ConversionProject ------------------------------------------------------
  - method: POST
    path: "/merchandise/conversion-projects"
    description: "Open a conversion project against a store that is already CONVERTING; guarded by the store's version"
    roles: [StoreOperationsManager]
    code: 201
    input: [store_id, from_price_point_id, to_price_point_id, expected_store_version]
    output: ConversionProject
    side_effects: ["status = DRAFT", "Store.version incremented by 1"]

  - method: GET
    path: "/merchandise/conversion-projects"
    description: "List conversion projects"
    roles: [StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: "ConversionProject[]"
    side_effects: []

  - method: GET
    path: "/merchandise/conversion-projects/{id}"
    description: "Read one conversion project"
    roles: [StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: []
    output: ConversionProject
    side_effects: []

  - method: GET
    path: "/merchandise/conversion-projects/{id}/coverage"
    description: "Read the projected aisle coverage shortfall for a conversion project"
    roles: [StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: []
    output: { conversion_project_id: string, completed_aisle_count: integer, projected_convertible_aisle_count: integer, adjusted_baseline: integer, coverage_delta_pct: number, shortfall: boolean }
    side_effects: []

  - method: POST
    path: "/merchandise/conversion-projects/{id}/start"
    description: "Move a draft conversion project into execution"
    roles: [StoreOperationsManager]
    code: 200
    input: []
    output: ConversionProject
    side_effects: ["status → IN_PROGRESS"]

  - method: PATCH
    path: "/merchandise/conversion-projects/{id}"
    description: "Adjust a conversion project's destination price point; guarded by the owning store's version"
    roles: [StoreOperationsManager]
    code: 200
    input: [to_price_point_id, expected_store_version]
    output: ConversionProject
    side_effects: ["to_price_point_id updated", "Store.version incremented by 1"]

  - method: POST
    path: "/merchandise/multi-price-issues"
    description: "Issue a batch of items to a converting store's new price point, validating that every item still sits at the store's source price point"
    roles: [MerchandiseBuyer]
    code: 201
    input: [store_id, from_price_point_id, item_ids, to_price_point_id]
    output: { store_id: string, issued_item_count: integer, to_price_point_id: string, rejected_item_ids: array }
    side_effects: ["ConversionProject opened with from_price_point_id set to the request value"]

  # --- SeasonWindow -----------------------------------------------------------
  - method: POST
    path: "/merchandise/season-windows"
    description: "Define a seasonal reset calendar window"
    roles: [ResetCalendarPlanner]
    code: 201
    input: [season_code, opens_on, closes_on]
    output: SeasonWindow
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/merchandise/season-windows"
    description: "List season windows with clock-derived status"
    roles: [ResetCalendarPlanner, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["season_code?", "status?", "limit?", "offset?"]
    output: "SeasonWindow[]"
    side_effects: []

  - method: GET
    path: "/merchandise/season-windows/{id}"
    description: "Read one season window with its clock-derived status"
    roles: [ResetCalendarPlanner, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: []
    output: SeasonWindow
    side_effects: []

  - method: GET
    path: "/merchandise/season-windows/{id}/aisle-resets"
    description: "List the aisle resets planned inside a season window"
    roles: [ResetCalendarPlanner, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: "AisleReset[]"
    side_effects: []

  - method: POST
    path: "/merchandise/season-windows/{id}/schedule"
    description: "Publish a draft season window onto the reset calendar"
    roles: [ResetCalendarPlanner]
    code: 200
    input: []
    output: SeasonWindow
    side_effects: ["status → SCHEDULED, then immediately re-evaluated against the logical clock: SCHEDULED → OPEN when the clock has already reached opens_on"]

  - method: POST
    path: "/merchandise/season-windows/{id}/unschedule"
    description: "Pull a scheduled season window back to draft before it opens"
    roles: [ResetCalendarPlanner]
    code: 200
    input: []
    output: SeasonWindow
    side_effects: ["status → DRAFT"]

  # --- AisleReset -------------------------------------------------------------
  - method: POST
    path: "/merchandise/aisle-resets"
    description: "Plan an aisle changeover inside a season window, validated against same-aisle overlap, calendar containment, and the store-day capacity aggregate"
    roles: [ResetCalendarPlanner]
    code: 201
    input: [store_id, price_point_id, season_window_id, aisle_code, starts_at, ends_at, allocated_shelf_sqft, seasonal_changeover]
    output: AisleReset
    side_effects: ["status = PLANNED"]

  - method: GET
    path: "/merchandise/aisle-resets"
    description: "List aisle resets, filterable by store, season window or status"
    roles: [ResetCalendarPlanner, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: ["store_id?", "season_window_id?", "status?", "limit?", "offset?"]
    output: "AisleReset[]"
    side_effects: []

  - method: GET
    path: "/merchandise/aisle-resets/{id}"
    description: "Read one aisle reset"
    roles: [ResetCalendarPlanner, StoreOperationsManager, MerchandiseAnalyst]
    code: 200
    input: []
    output: AisleReset
    side_effects: []

  - method: POST
    path: "/merchandise/aisle-resets/{id}/begin"
    description: "Start executing a planned aisle reset once its season window is open and the calendar has reached it"
    roles: [ResetCalendarPlanner]
    code: 200
    input: []
    output: AisleReset
    side_effects: ["status → EXECUTING"]

  - method: POST
    path: "/merchandise/aisle-resets/{id}/execute"
    description: "Complete the aisle changeover"
    roles: [ResetCalendarPlanner]
    code: 200
    input: []
    output: AisleReset
    side_effects: ["status → EXECUTED", "Store.updated_at refreshed"]

  - method: POST
    path: "/merchandise/aisle-resets/{id}/abandon"
    description: "Abandon a planned or executing aisle reset"
    roles: [StoreOperationsManager]
    code: 200
    input: []
    output: AisleReset
    side_effects: ["status → ABANDONED"]

  # --- PriceIntegrityAudit ----------------------------------------------------
  - method: POST
    path: "/merchandise/price-integrity-audits"
    description: "File a store price integrity audit visit, computing the mismatch ratio and its result"
    roles: [StoreOperationsManager]
    code: 201
    input: [store_id, price_point_id, audited_at, observed_item_count, mismatched_item_count]
    output: PriceIntegrityAudit
    side_effects:
      - "mismatch_ratio computed via price_integrity_result"
      - "result computed"
      - "status = OPEN"
      - "Store.price_integrity_audit_count incremented"
      - "Store.open_violation_count recomputed"

  - method: GET
    path: "/merchandise/price-integrity-audits"
    description: "List price integrity audits, filterable by store, price point or result"
    roles: [StoreOperationsManager, MerchandiseAnalyst, LegalCostEngineer]
    code: 200
    input: ["store_id?", "price_point_id?", "result?", "status?", "limit?", "offset?"]
    output: "PriceIntegrityAudit[]"
    side_effects: []

  - method: GET
    path: "/merchandise/price-integrity-audits/{id}"
    description: "Read one price integrity audit"
    roles: [StoreOperationsManager, MerchandiseAnalyst, LegalCostEngineer]
    code: 200
    input: []
    output: PriceIntegrityAudit
    side_effects: []

  - method: POST
    path: "/merchandise/price-integrity-audits/{id}/resolve"
    description: "Close an open price integrity violation after the shelf and the register have been reconciled"
    roles: [StoreOperationsManager]
    code: 200
    input: []
    output: PriceIntegrityAudit
    side_effects: ["status → RESOLVED", "Store.open_violation_count recomputed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth -------------------------------------------------------------------
  - id: ERR_MISSING_USER_CONTEXT
    http: 401
    condition: "X-User-ID or X-User-Role header absent, or X-User-Role is not one of the seven declared roles"

  - id: ERR_INSUFFICIENT_ROLE
    http: 403
    condition: "The acting role is not in the target endpoint's roles set"

  # --- not found --------------------------------------------------------------
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "No Item exists for the supplied id"

  - id: ERR_CONTAINER_NOT_FOUND
    http: 404
    condition: "No Container exists for the supplied id"

  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "No Store exists for the supplied id"

  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "No Vendor exists for the supplied id"

  - id: ERR_PRICE_POINT_NOT_FOUND
    http: 404
    condition: "No PricePoint exists for the supplied id"

  - id: ERR_SEASON_WINDOW_NOT_FOUND
    http: 404
    condition: "No SeasonWindow exists for the supplied id"

  - id: ERR_AISLE_RESET_NOT_FOUND
    http: 404
    condition: "No AisleReset exists for the supplied id"

  - id: ERR_ALLOCATION_LINE_NOT_FOUND
    http: 404
    condition: "No AllocationLine exists for the supplied id"

  - id: ERR_CONVERSION_PROJECT_NOT_FOUND
    http: 404
    condition: "No ConversionProject exists for the supplied id"

  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No PriceIntegrityAudit exists for the supplied id"

  - id: ERR_PACK_PROGRAM_NOT_FOUND
    http: 404
    condition: "No ExclusivePackProgram exists for the supplied id"

  # --- request shape ----------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A declared request-shape constraint is violated: a required field is missing, an enum member is unknown, a count is negative, an upper bound is not after its lower bound, or to_price_point_id equals from_price_point_id"

  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "An Item, Vendor, Store or Container is created with a value already held by another row's unique key"

  # --- price point ------------------------------------------------------------
  - id: ERR_PRICE_POINT_MISMATCH
    http: 422
    condition: "Item.unit_retail_cents does not equal PricePoint.shelf_price_cents of the price point being assigned"

  - id: ERR_PRICE_POINT_NOT_ACTIVE
    http: 409
    condition: "The referenced PricePoint is not in status ACTIVE, so it may not be issued"

  - id: ERR_PRICE_POINT_MIXED_WITHIN_CONVERSION
    http: 409
    condition: "An AisleReset is opened on a CONVERTING store with a price_point_id different from the store's conversion_price_point_id"

  # --- item lifecycle ---------------------------------------------------------
  - id: ERR_ITEM_NOT_DENOMINATED
    http: 409
    condition: "A price assignment is attempted on an Item that is not in DENOMINATED"

  - id: ERR_ITEM_NOT_PRICE_ASSIGNED
    http: 409
    condition: "A landed cost write or a price-assignment release targets an Item that is not in PRICE_ASSIGNED"

  - id: ERR_ITEM_NOT_COST_PENDING
    http: 409
    condition: "A landed cost write or an activation targets an Item that is not in COST_PENDING"

  - id: ERR_ITEM_NOT_IN_DELETE_REVIEW
    http: 409
    condition: "A deletion decision targets an Item that is not in DELETE_REVIEW"

  - id: ERR_ITEM_NOT_COST_CLEARED
    http: 422
    condition: "An Item is activated while net_contribution_cents_per_unit is negative and it has no ACTIVE ExclusivePackProgram"

  - id: ERR_COST_EXCEEDS_PRICE_POINT
    http: 422
    condition: "A landed cost write drives net_contribution_cents_per_unit below zero while the Item has an ACTIVE ExclusivePackProgram — the loss is reported but the item is not pushed into DELETE_REVIEW"

  # --- container / freight ----------------------------------------------------
  - id: ERR_CONTAINER_NOT_BOOKED
    http: 409
    condition: "A container departure is attempted from a status other than BOOKED"

  - id: ERR_CONTAINER_NOT_IN_TRANSIT
    http: 409
    condition: "A container arrival is attempted from a status other than IN_TRANSIT"

  - id: ERR_CONTAINER_NOT_AT_PORT
    http: 409
    condition: "A customs hold, customs release or receipt is attempted from a status other than AT_PORT"

  - id: ERR_CONTAINER_NOT_RECEIVED
    http: 409
    condition: "A FREIGHT_PASS_THROUGH landed cost references a Container that is not in status RECEIVED, or an allocation line release targets a line whose Container is not RECEIVED"

  - id: ERR_CONTAINER_NOT_ON_CUSTOMS_HOLD
    http: 409
    condition: "A customs release is attempted from a status other than CUSTOMS_HOLD"

  - id: ERR_CUSTOMS_NOT_CLEARED
    http: 409
    condition: "A container receipt is attempted while customs_cleared is false"

  - id: ERR_CONTAINER_VENDOR_MISMATCH
    http: 409
    condition: "A FREIGHT_PASS_THROUGH landed cost references a Container whose vendor_id differs from the Item's sourcing vendor"

  # --- allocation -------------------------------------------------------------
  - id: ERR_ALLOCATION_LINE_NOT_ALLOCATED
    http: 409
    condition: "A release or short is attempted on an AllocationLine that is not in status ALLOCATED"

  - id: ERR_RELEASE_EXCEEDS_ALLOCATION
    http: 422
    condition: "release_units exceeds the AllocationLine's remaining_units"

  # --- store conversion -------------------------------------------------------
  - id: ERR_STORE_NOT_SINGLE_PRICE
    http: 409
    condition: "A conversion is started on a Store that is not in SINGLE_PRICE"

  - id: ERR_STORE_NOT_MULTI_PRICE
    http: 409
    condition: "A reversion is started on a Store that is not in MULTI_PRICE"

  - id: ERR_STORE_NOT_CONVERTING
    http: 409
    condition: "A conversion completion or rollback targets a Store that is not in CONVERTING or REVERTING"

  - id: ERR_STORE_ALREADY_CONVERTING
    http: 409
    condition: "A conversion is started on a Store whose conversion_price_point_id is already set"

  - id: ERR_CONVERSION_NOT_DRAFT
    http: 409
    condition: "A conversion project start targets a project that is not in DRAFT"

  - id: ERR_CONVERSION_NOT_IN_PROGRESS
    http: 409
    condition: "A conversion completion or rollback targets a project that is not in IN_PROGRESS"

  - id: ERR_CONVERSION_PREREQUISITES_UNMET
    http: 409
    condition: "A conversion is completed while any of sign_order_filed, shelf_tag_filed or register_file_locked is false"

  - id: ERR_ITEM_NOT_AT_SOURCE_PRICE_POINT
    http: 409
    condition: "A multi-price issue batch carries an Item whose current price_point_id differs from the store's source single price point"

  # --- reset calendar ---------------------------------------------------------
  - id: ERR_SEASON_WINDOW_NOT_DRAFT
    http: 409
    condition: "A season window is scheduled from a status other than DRAFT"

  - id: ERR_SEASON_WINDOW_NOT_SCHEDULED
    http: 409
    condition: "A season window is unscheduled from a status other than SCHEDULED"

  - id: ERR_SEASON_WINDOW_NOT_OPEN
    http: 409
    condition: "An aisle reset is begun while its SeasonWindow is not in status OPEN"

  - id: ERR_INVALID_SEASON_WINDOW
    http: 400
    condition: "SeasonWindow.closes_on is not strictly after SeasonWindow.opens_on"

  - id: ERR_AISLE_RESET_NOT_PLANNED
    http: 409
    condition: "An aisle reset begin or abandon targets a reset that is not in PLANNED"

  - id: ERR_AISLE_RESET_NOT_EXECUTING
    http: 409
    condition: "An aisle reset execution targets a reset that is not in EXECUTING"

  - id: ERR_AISLE_RESET_OVERLAP
    http: 409
    condition: "The candidate aisle reset interval overlaps an existing non-terminal reset on the same aisle_code of the same store under the half-open convention"

  - id: ERR_RESET_OUTSIDE_CALENDAR
    http: 409
    condition: "The aisle reset interval is not fully contained in its SeasonWindow's [opens_on, closes_on] range"

  - id: ERR_STORE_DAY_CAPACITY_EXCEEDED
    http: 422
    condition: "The sum of shelf capacity across non-terminal aisle resets sharing a store-day exceeds Store.shelf_facing_capacity_sqft"

  - id: ERR_NO_ELIGIBLE_ITEMS
    http: 422
    condition: "An aisle reset execution finds no Item in status ACTIVE whose price_point_id equals the reset's price_point_id"

  # --- price integrity --------------------------------------------------------
  - id: ERR_AUDIT_ALREADY_RESOLVED
    http: 409
    condition: "A price integrity audit is resolved while already in status RESOLVED"

  - id: ERR_MIXED_PRICE_POINT_OPEN_VIOLATION
    http: 422
    condition: "A new audit carries a price_point_id different from that of an existing OPEN violation on the same store"

  # --- vendor pack development ------------------------------------------------
  - id: ERR_PACK_COST_TARGET_MISSED
    http: 422
    condition: "An ExclusivePackProgram is advanced to ACTIVE while quoted_landed_cost_cents exceeds its target_landed_cost_cents ceiling"

  # --- concurrency ------------------------------------------------------------
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_store_version does not equal the current Store.version of the store the request targets or was issued against"

  - id: ERR_AISLE_COVERAGE_SHORTFALL
    http: 422
    condition: "ConversionProject.coverage_delta_pct is below -0.50 when the store's conversion is completed"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: MerchandiseBuyer
    description: "Owns item cost engineering, price-point assignment, landed cost application, deletion disposition, exclusive pack development and multi-price issue batches. Cannot operate a store's physical conversion or file its compliance audits."
    identity: opaque
    exclusive_operations:
      - "POST /items — Denominate an item"
      - "POST /items/{id}/price-assignments — Assign an item to a shelf price point"
      - "POST /items/{id}/price-assignment-release — Release an item back to DENOMINATED"
      - "POST /items/{id}/landed-costs — Apply a landed cost"
      - "POST /items/{id}/activations — Clear an item to sell"
      - "POST /item-deletions/{id}/decision — Disposition a deletion review"
      - "POST /multi-price-issues — Issue a batch of items to a store's new price point"
      - "POST /price-points — Register a shelf price point"
      - "POST /price-points/{id}/activate — Activate a shelf price point"
      - "POST /vendors — Register a vendor"
      - "POST /exclusive-pack-programs — Open an exclusive pack program"
      - "PATCH /exclusive-pack-programs/{id} — Advance an exclusive pack program"
    shared_operations:
      - "GET /items, GET /items/{id} — Read items"
      - "GET /price-points, GET /price-points/{id} — Read price points"
      - "GET /stores, GET /stores/{id} — Read stores"

  - name: StoreOperationsManager
    description: "Operates the store: begins and completes price-point conversions, files the signage, shelf-tag and register artefacts, files price integrity audits, and abandons aisle resets. Cannot change an item's cost or price-point binding."
    identity: opaque
    exclusive_operations:
      - "POST /stores — Register a store"
      - "POST /stores/{id}/conversions — Begin a conversion"
      - "POST /stores/{id}/conversions/{conversionId}/filing — File a conversion artefact"
      - "POST /stores/{id}/conversions/{conversionId}/complete — Complete a conversion"
      - "POST /stores/{id}/conversions/{conversionId}/rollback — Roll back a conversion"
      - "POST /stores/{id}/reversions — Begin a reversion"
      - "POST /conversion-projects — Open a conversion project"
      - "POST /conversion-projects/{id}/start — Start a conversion project"
      - "PATCH /conversion-projects/{id} — Adjust a conversion project"
      - "POST /price-integrity-audits — File a price integrity audit"
      - "POST /price-integrity-audits/{id}/resolve — Resolve a violation"
      - "POST /aisle-resets/{id}/abandon — Abandon an aisle reset"
    shared_operations:
      - "GET /stores, GET /stores/{id} — Read stores"
      - "GET /conversion-projects, GET /conversion-projects/{id} — Read conversion projects"
      - "GET /price-integrity-audits, GET /price-integrity-audits/{id} — Read audits"

  - name: ImportCoordinator
    description: "Moves containers from port to distribution center: booking, departure, arrival, customs hold and release, and receipt. Cannot allocate units to stores and cannot apply landed costs."
    identity: opaque
    exclusive_operations:
      - "POST /containers — Book a container"
      - "POST /containers/{id}/depart — Depart"
      - "POST /containers/{id}/arrive — Arrive at port"
      - "POST /containers/{id}/customs-hold — Place on customs hold"
      - "POST /containers/{id}/customs-release — Clear customs hold"
      - "POST /containers/{id}/receive — Receive at the distribution center"
    shared_operations:
      - "GET /containers, GET /containers/{id} — Read containers"
      - "GET /allocation-lines — Read allocation lines"

  - name: DistributionCenterOperator
    description: "Allocates received container units to stores against shelf capacity and releases or shorts those lines. Cannot book, move or receive containers, and cannot author landed-cost charges."
    identity: opaque
    exclusive_operations:
      - "POST /allocation-lines — Allocate units to a store"
      - "POST /allocation-lines/{id}/release — Release units to the store's on-hand"
      - "POST /allocation-lines/{id}/short — Short an allocation line"
    shared_operations:
      - "GET /allocation-lines, GET /allocation-lines/{id} — Read allocation lines"
      - "GET /containers, GET /containers/{id} — Read containers"

  - name: ResetCalendarPlanner
    description: "Owns the fixed reset calendar: defines and publishes season windows and plans, begins and executes aisle changeovers. Cannot convert a store or audit price integrity."
    identity: opaque
    exclusive_operations:
      - "POST /season-windows — Define a season window"
      - "POST /season-windows/{id}/schedule — Publish a season window"
      - "POST /season-windows/{id}/unschedule — Pull a season window back to draft"
      - "POST /aisle-resets — Plan an aisle reset"
      - "POST /aisle-resets/{id}/begin — Begin an aisle reset"
      - "POST /aisle-resets/{id}/execute — Execute an aisle reset"
    shared_operations:
      - "GET /season-windows, GET /season-windows/{id} — Read season windows"
      - "GET /aisle-resets, GET /aisle-resets/{id} — Read aisle resets"

  - name: MerchandiseAnalyst
    description: "Read-only analytics role across items, price points, containers, allocation lines, stores, conversion projects, season windows, aisle resets and audits. Owns no state transition."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /price-points, GET /price-points/{id}"
      - "GET /vendors, GET /vendors/{id}, GET /vendors/{id}/exclusive-pack-programs"
      - "GET /exclusive-pack-programs, GET /exclusive-pack-programs/{id}"
      - "GET /items, GET /items/{id}, GET /items/{id}/landed-costs, GET /items/{id}/break-even"
      - "GET /containers, GET /containers/{id}"
      - "GET /allocation-lines, GET /allocation-lines/{id}"
      - "GET /stores, GET /stores/{id}"
      - "GET /conversion-projects, GET /conversion-projects/{id}, GET /conversion-projects/{id}/coverage"
      - "GET /season-windows, GET /season-windows/{id}"
      - "GET /aisle-resets, GET /aisle-resets/{id}"
      - "GET /price-integrity-audits, GET /price-integrity-audits/{id}"

  - name: LegalCostEngineer
    description: "Independently reviews landed-cost pass-through, break-even projections and price-integrity audit exposure. Read-only; deliberately holds no write operation so that the same operator cannot both author a cost and attest to it."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /items, GET /items/{id}, GET /items/{id}/landed-costs, GET /items/{id}/break-even"
      - "GET /stores, GET /stores/{id}"
      - "GET /price-integrity-audits, GET /price-integrity-audits/{id}"

  - name: PlatformAdmin
    description: "Operates the benchmark harness itself. Holds the logical-clock endpoint and nothing else on the business surface."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — Set the server's logical clock"
    shared_operations: []