              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
            - call: "POST /purchase-matches"
              payload: { enrollment_id: "${e1_id}", retailer_channel_code: "WEB-US", purchase_amount_cents: 5000, purchased_at: "2026-08-01T00:00:00Z", match_confidence: 0.9 }
