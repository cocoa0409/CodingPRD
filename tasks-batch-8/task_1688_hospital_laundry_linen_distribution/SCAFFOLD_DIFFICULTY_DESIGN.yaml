  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: surge_activation_cascade_depth3
        grounds:
          - state_machines.SurgeEvent.DECLARED_to_ACTIVE
          - state_machines.Facility.NORMAL_to_SURGE
          - calculations.reserve_allocation
          - calculations.restock_quantity
        distinguishing_aspect: |
          Depth-3 chain from POST /surge-events/{id}/activate: SurgeEvent ->
          Facility.surge_posture -> ParLevel.effective_par recompute -> reserve
          waterfall mutating LinenStock.reserve_pieces and ParLevel.on_hand; each
          link is caused by the previous one.
        test_recipe:
          setup:
            - "Facility; units U1 (CRITICAL) and U2 (STANDARD)"
            - "S1 (FLATWORK, opening 100, reserve 10) with pars U1=20, U2=10; S2 (ISOLATION, opening 200, reserve 20) with par U1=30"
            - "Both units pre-filled to base par via cart runs"
