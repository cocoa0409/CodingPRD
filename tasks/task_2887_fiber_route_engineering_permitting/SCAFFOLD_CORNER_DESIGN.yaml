        distinguishing_aspect: "The pre-set default 2026-08-01T00:00:00Z stamps scope_locked_at, and only after the clock is moved to 2026-09-01T00:00:00Z does a permit submit read the new now — proving deadlines come from the logical clock and not wall time."
