        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo: $.data.0.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T09:00:00Z'
        as: ProgramManager
      trigger:
      - call: POST /streetlights/compliance-exceptions/${exc}/refresh
        payload: {}
        as: ComplianceOfficer
        captures:
          e1: $.data.error_id
      - call: POST /streetlights/work-orders/${wo}/dispatch
        payload:
