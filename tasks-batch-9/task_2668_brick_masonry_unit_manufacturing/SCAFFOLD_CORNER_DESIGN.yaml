              captures: { pit_z: "$.data.id" }
          assert:
            - "${e_plant_code} == ERR_DUPLICATE_CODE with HTTP 409 - plant_code is unique globally"
            - "${e_pit_name} == ERR_DUPLICATE_CODE with HTTP 409 - pit_name is unique within ${p1}, and material_type does not make it a different pit"
            - "The P2 creation returns HTTP 201, and the second PIT-CLAY-A returns HTTP 201 with ${pit_z} != ${pit_a} - pit_name collides only inside one plant"
            - "GET /plants returns total_count == 2 and GET /plants/${p1}/clay-pits returns total_count == 1"

      - name: kiln_run_state_invalid_covers_start_without_a_car_grade_before_firing_and_double_start
