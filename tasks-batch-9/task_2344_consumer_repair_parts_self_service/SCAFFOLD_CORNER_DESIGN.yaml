      - name: documentation_deadline_floors_at_the_parts_deadline_when_the_region_asks_for_less
        claim_type: interval_merge
        grounds:
          - calculations.mandated_support_window.formula
          - entities.ComplianceObligation.fields.documentation_available_until
          - endpoints[POST /repair-program/product-models/{model_id}/end-production]
        distinguishing_aspect: |
          US-WA demands 7 parts-years but only 5 documentation-years, yet the
          documentation deadline is 2031-03-15 (the max of the two), not the naive
          2029-03-15 — and both are null with deadline_basis PRODUCTION_ACTIVE
          until production actually ends.
        test_recipe:
            setup:
              - "Profile US-WA with min_parts_availability_years 7 and min_documentation_years 5; model CRX-C205 still in ACTIVE_PRODUCTION; one obligation for (CRX-C205, US-WA)."
            setup_api_calls:
              - call: "POST /repair-program/compliance-profiles"
                payload: { region_code: "US-WA", min_parts_availability_years: 7, min_documentation_years: 5, requires_public_manual: false, max_documentation_fee_cents: 1000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_PARTS_ONLY" }
                as: ProgramAdmin
                as_user_id: "u_admin_1"
              - call: "POST /repair-program/product-models"
                payload: { model_code: "CRX-C205", product_family: "CRX", market_release_date: "2020-01-01T00:00:00Z", repairability_tier: "TIER_A_SELF_SERVICE" }
                as: ProgramAdmin
                as_user_id: "u_admin_1"
                captures: { model_id: $.data.id }
              - call: "POST /repair-program/compliance-obligations"
                payload: { model_id: "${model_id}", region_code: "US-WA" }
                as: ComplianceOfficer
                as_user_id: "u_co_1"
                captures: { obligation_id: $.data.id, basis_before: $.data.deadline_basis, parts_before: $.data.parts_available_until }
            trigger:
              - call: "POST /repair-program/product-models/${model_id}/end-production"
                payload: { end_of_production_date: "2024-03-15T00:00:00Z" }
                as: ProgramAdmin
                as_user_id: "u_admin_1"
              - call: "GET /repair-program/compliance-obligations/${obligation_id}"
                payload: {}
                as: ComplianceOfficer
                captures: { basis: $.data.deadline_basis, parts_until: $.data.parts_available_until, docs_until: $.data.documentation_available_until, status: $.data.status, breaches: $.data.breach_count }
            assert:
              - "${basis_before} == PRODUCTION_ACTIVE and ${parts_before} == null"
              - "${basis} == END_OF_PRODUCTION"
              - "${parts_until} == 2031-03-15T23:59:59.999Z"
              - "${docs_until} == 2031-03-15T23:59:59.999Z — floored up to the parts deadline"
              - "${docs_until} != 2029-03-15T23:59:59.999Z (taking min_documentation_years literally is wrong)"
              - "${status} == BREACHED_PARTS and ${breaches} == 2 — the model has no PUBLISHED part, and the count incremented once at create and once on the re-run"
              - "ProductModel.support_state == LEGACY_SUPPORT and compliance_posture == ORDER_RESTRICTED"

      - name: leap_day_end_of_production_clamps_to_february_28
        claim_type: precision
        grounds:
          - calculations.mandated_support_window.input_set
          - calculations.mandated_support_window.constants.END_OF_DAY_SUFFIX
          - entities.ComplianceObligation.fields.parts_available_until
        distinguishing_aspect: |
          29 February 2024 plus seven whole years lands on 28 February 2031 —
          2031 is not a leap year — and the stored deadline keeps the inclusive
          23:59:59.999Z end-of-day suffix rather than midnight.
        test_recipe:
            setup:
              - "Profile US-TX with min_parts_availability_years 7 and min_documentation_years 7; model CRX-C205L created WITH end_of_production_date 2024-02-29 so the window is computed at obligation-create time."
            setup_api_calls:
              - call: "POST /repair-program/compliance-profiles"
                payload: { region_code: "US-TX", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 1000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_PARTS_ONLY" }
                as: ProgramAdmin
                as_user_id: "u_admin_1"
              - call: "POST /repair-program/product-models"
                payload: { model_code: "CRX-C205L", product_family: "CRX", market_release_date: "2020-01-01T00:00:00Z", repairability_tier: "TIER_A_SELF_SERVICE", end_of_production_date: "2024-02-29T00:00:00Z" }
                as: ProgramAdmin
                as_user_id: "u_admin_1"
                captures: { model_id: $.data.id }
            trigger:
              - call: "POST /repair-program/compliance-obligations"
                payload: { model_id: "${model_id}", region_code: "US-TX" }
                as: ComplianceOfficer
                as_user_id: "u_co_1"
                captures: { parts_until: $.data.parts_available_until, docs_until: $.data.documentation_available_until, basis: $.data.deadline_basis }
            assert:
              - "${basis} == END_OF_PRODUCTION"
              - "${parts_until} == 2031-02-28T23:59:59.999Z"
              - "${docs_until} == 2031-02-28T23:59:59.999Z"
              - "${parts_until} != 2031-03-01T23:59:59.999Z (rolling into March is wrong) and != 2031-02-28T00:00:00Z (dropping the end-of-day suffix is wrong)"
              - "ProductModel.support_state == LEGACY_SUPPORT — supplied at create, not via end-production"

      - name: pairing_override_frees_eligibility_while_warranty_reads_the_stored_safety_class
