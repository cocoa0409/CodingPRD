scenario: |
  Applicant Tracking System (ATS): job requisition approval, candidate pool,
  EEO/OFCCP data, interview feedback, Offer approval chain, Background Check
  integration, referral bonus, Diversity Goals.

domain_name: "applicant-tracking-system"
api_prefix: "/requisitions"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - version_pinning_on_approval
    - optimistic_concurrency
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: branching          # plus one cyclic (offer renegotiation) and one compound (application)
  relationship_patterns:
    - one_to_many                          # Requisition→JobApplication, Application→Interview
    - many_to_many                         # Interviewer↔Interview via InterviewFeedback
    - cross_aggregate                      # Offer→BackgroundCheck, ReferralBonus→Candidate
  role_model: segregation_of_duties        # combined informally with approval_chain for offers
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Recruiter
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Recruiter login email"
        constraints: "unique, RFC 5322"
      - name: full_name
        type: string
        source: input
        description: "Display name"
      - name: department_code
        type: string
        source: input
        description: "Department this recruiter belongs to (e.g., 'ENG', 'SALES')"
      - name: is_active
        type: boolean
        source: input
        description: "Whether recruiter is active and may create/own requisitions"
        default: true

  - name: HiringManager
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Manager login email"
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Display name"
      - name: department_code
        type: string
        source: input
        description: "Department code"
      - name: budget_cents
        type: integer
        source: input
        description: "Annual hiring budget in USD cents; consumed by Offer.total_first_year_comp_cents on APPROVED"
        constraints: ">= 0"

  - name: Interviewer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Interviewer email"
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Display name"
      - name: department_code
        type: string
        source: input
        description: "Home department"
      - name: is_certified_for_eeo
        type: boolean
        source: input
        description: "Required for InterviewFeedback that scores diversity-flagged candidates"
        default: false

  - name: Requisition
    parent: null
    common_fields: true
    fields:
      - name: recruiter_id
        type: string
        source: input
        description: "Owning Recruiter.id"
        constraints: "must reference an existing active Recruiter"
      - name: hiring_manager_id
        type: string
        source: input
        description: "Owning HiringManager.id"
      - name: job_title
        type: string
        source: input
        description: "Public job title"
      - name: department_code
        type: string
        source: input
        description: "Department"
      - name: seniority_level
        type: enum
        source: input
        description: "Job seniority used in referral bonus tiering"
        constraints: "one of {JUNIOR, MID, SENIOR, STAFF, PRINCIPAL}"
      - name: headcount
        type: integer
        source: input
        description: "Number of slots authorized"
        constraints: ">= 1, immutable after APPROVED"
      - name: filled_count
        type: integer
        source: computed
        description: "Number of Applications on this requisition currently in HIRED. Bubbled up on Application→HIRED and down on Application revert from HIRED."
        default: 0
      - name: active_offer_count
        type: integer
        source: computed
        description: "Number of Offers tied to this requisition in DRAFT, PENDING_APPROVAL, NEGOTIATING, APPROVED, or EXTENDED. Drops when an Offer reaches a terminal status."
        default: 0
      - name: posted_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; set when status transitions to OPEN"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Set when status transitions to CLOSED"
        default: null
      - name: budget_cents
        type: integer
        source: input
        description: "Maximum total_first_year_comp_cents allowed for any Offer on this requisition"
        constraints: ">= 0"
      - name: target_diversity_goal_id
        type: string
        source: input
        description: "Optional DiversityGoal.id this requisition is tied to"
        default: null
      - name: status
        type: enum
        source: computed
        description: "See §1.2 Requisition state machine"
        constraints: "one of {DRAFT, PENDING_APPROVAL, OPEN, ON_HOLD, CLOSED, CANCELLED}"
        default: DRAFT

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Candidate contact email"
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Candidate name"
      - name: source
        type: enum
        source: input
        description: "How the candidate entered the pool"
        constraints: "one of {DIRECT, AGENCY, REFERRAL, EVENT, INBOUND}"
      - name: referrer_employee_id
        type: string
        source: input
        description: "If source == REFERRAL, the referring employee's id (a Recruiter, HiringManager, or Interviewer id). Required if source == REFERRAL, MUST be null otherwise."
        default: null
      - name: is_in_eeo_protected_class
        type: boolean
        source: input
        description: "Whether candidate is self-identified in an EEO-tracked protected class; drives DiversityGoal progress and OFCCP audit flags"
        default: false

  - name: EEORecord
    parent: Candidate
    common_fields: false
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "Owning Candidate.id; UNIQUE (one EEORecord per Candidate)"
      - name: gender
        type: enum
        source: input
        description: "Self-identified gender"
        constraints: "one of {MALE, FEMALE, NON_BINARY, DECLINE}"
      - name: ethnicity
        type: enum
        source: input
        description: "Self-identified ethnicity per OFCCP categories"
        constraints: "one of {HISPANIC_LATINO, WHITE, BLACK_AFRICAN_AMERICAN, NATIVE_HAWAIIAN_PI, ASIAN, AMERICAN_INDIAN_AN, TWO_OR_MORE, DECLINE}"
      - name: veteran_status
        type: enum
        source: input
        description: "OFCCP veteran category"
        constraints: "one of {NOT_VETERAN, PROTECTED_VETERAN, OTHER_VETERAN, DECLINE}"
      - name: disability_status
        type: enum
        source: input
        description: "OFCCP disability self-identification"
        constraints: "one of {YES, NO, DECLINE}"
      - name: submitted_at
        type: datetime
        source: system
        description: "When the record was attached to the candidate"

  - name: Application
    parent: Requisition
    common_fields: true
    fields:
      - name: requisition_id
        type: string
        source: input
        description: "Owning Requisition.id"
      - name: candidate_id
        type: string
        source: input
        description: "Applying Candidate.id"
        constraints: "(requisition_id, candidate_id) is UNIQUE while status NOT IN {WITHDRAWN, REJECTED}"
      - name: stage
        type: enum
        source: computed
        description: "Pipeline stage; see §1.2 Application state machine"
        constraints: "one of {APPLIED, SCREENING, INTERVIEWING, OFFER_STAGE, HIRED, REJECTED, WITHDRAWN}"
        default: APPLIED
      - name: rejection_reason
        type: enum
        source: input
        description: "Filled on transition to REJECTED"
        constraints: "one of {NOT_QUALIFIED, FAILED_INTERVIEW, FAILED_BACKGROUND_CHECK, OFFER_DECLINED, DUPLICATE, OTHER}; null otherwise"
        default: null
      - name: panel_average_score
        type: number
        source: computed
        description: "Mean of InterviewFeedback.overall_score across all SUBMITTED feedback on COMPLETED Interviews for this Application; null until at least one such feedback exists. Rounded to 2 decimals, round_half_up."
        default: null
      - name: pinned_eeo_snapshot_version
        type: integer
        source: system
        description: "On transition to OFFER_STAGE, snapshots the Candidate.version at that moment so later EEO edits do not retroactively invalidate the approval chain"
        default: null

  - name: Interview
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "Owning Application.id"
      - name: interviewer_id
        type: string
        source: input
        description: "Assigned Interviewer.id"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Closed interval start, ISO 8601 UTC"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Closed interval end, must be strictly after scheduled_start_at"
      - name: status
        type: enum
        source: computed
        description: "See §1.2 Interview state machine"
        constraints: "one of {SCHEDULED, COMPLETED, NO_SHOW, CANCELLED}"
        default: SCHEDULED

  - name: InterviewFeedback
    parent: Interview
    common_fields: false
    fields:
      - name: interview_id
        type: string
        source: input
        description: "Owning Interview.id"
      - name: interviewer_id
        type: string
        source: input
        description: "Submitting Interviewer.id; MUST equal Interview.interviewer_id"
      - name: overall_score
        type: integer
        source: input
        description: "1..5, where 5 = strong hire"
        constraints: "1 <= overall_score <= 5"
      - name: recommendation
        type: enum
        source: input
        description: "Hire recommendation"
        constraints: "one of {STRONG_HIRE, HIRE, NO_HIRE, STRONG_NO_HIRE}"
      - name: submitted_at
        type: datetime
        source: system
        description: "When the feedback was POSTed; immutable after creation"

  - name: Offer
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "Owning Application.id; UNIQUE while status NOT IN {RESCINDED, EXPIRED, DECLINED}"
      - name: requisition_id
        type: string
        source: computed
        description: "Mirrors Application.requisition_id at creation time"
      - name: base_salary_cents
        type: integer
        source: input
        description: "Annual base salary in USD cents"
        constraints: ">= 0"
      - name: sign_on_bonus_cents
        type: integer
        source: input
        description: "One-time sign-on bonus in USD cents"
        constraints: ">= 0"
        default: 0
      - name: annual_equity_cents
        type: integer
        source: input
        description: "Annualized equity grant value in USD cents (vest / 4)"
        constraints: ">= 0"
        default: 0
      - name: total_first_year_comp_cents
        type: integer
        source: computed
        description: "Per calculation rule offer_total_comp"
        default: 0
      - name: pinned_requisition_version
        type: integer
        source: system
        description: "Requisition.version at the moment the offer transitioned to PENDING_APPROVAL; later Requisition mutations do not invalidate this approval"
        default: null
      - name: status
        type: enum
        source: computed
        description: "See §1.2 Offer state machine (cyclic)"
        constraints: "one of {DRAFT, PENDING_APPROVAL, NEGOTIATING, APPROVED, EXTENDED, ACCEPTED, DECLINED, RESCINDED, EXPIRED}"
        default: DRAFT
      - name: expires_at
        type: datetime
        source: input
        description: "When EXTENDED offer auto-expires if not ACCEPTED/DECLINED; required on transition to EXTENDED"
        default: null
      - name: negotiation_round
        type: integer
        source: computed
        description: "Increments on each APPROVED→NEGOTIATING revert"
        default: 0

  - name: OfferApprovalStep
    parent: Offer
    common_fields: false
    fields:
      - name: offer_id
        type: string
        source: input
        description: "Owning Offer.id"
      - name: step_order
        type: integer
        source: input
        description: "1-based position in the chain"
        constraints: ">= 1; (offer_id, step_order) UNIQUE"
      - name: approver_role
        type: enum
        source: input
        description: "Which role must act on this step"
        constraints: "one of {HIRING_MANAGER, COMPENSATION, EXECUTIVE}"
      - name: required_approver_id
        type: string
        source: input
        description: "Specific approver id (HiringManager.id for HIRING_MANAGER step; opaque user id for COMPENSATION/EXECUTIVE). MUST NOT equal the Recruiter who created the Offer (segregation of duties)."
      - name: decision
        type: enum
        source: computed
        description: "Set when approver acts"
        constraints: "one of {PENDING, APPROVED, REJECTED}"
        default: PENDING
      - name: decided_at
        type: datetime
        source: system
        description: "When the decision was recorded"
        default: null

  - name: BackgroundCheck
    parent: Offer
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "Owning Offer.id; UNIQUE"
      - name: vendor
        type: enum
        source: input
        description: "Provider used"
        constraints: "one of {ACME_BG, VERIFY_INC, FED_CHECKS}"
      - name: status
        type: enum
        source: computed
        description: "See §1.2 BackgroundCheck state machine"
        constraints: "one of {PENDING, PASSED, FAILED, CANCELLED}"
        default: PENDING
      - name: ordered_at
        type: datetime
        source: system
        description: "When the check was ordered"
      - name: result_received_at
        type: datetime
        source: system
        description: "When the vendor result was recorded"
        default: null

  - name: ReferralBonus
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "Referred Candidate.id; Candidate.source MUST equal REFERRAL"
      - name: referrer_employee_id
        type: string
        source: computed
        description: "Mirrors Candidate.referrer_employee_id at creation"
      - name: requisition_id
        type: string
        source: input
        description: "Requisition on which the candidate was HIRED"
      - name: base_amount_cents
        type: integer
        source: computed
        description: "Per calculation rule referral_bonus_amount"
        default: 0
      - name: diversity_uplift_cents
        type: integer
        source: computed
        description: "Additional amount when candidate is_in_eeo_protected_class"
        default: 0
      - name: total_amount_cents
        type: integer
        source: computed
        description: "base_amount_cents + diversity_uplift_cents"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "See §1.2 ReferralBonus state machine"
        constraints: "one of {ACCRUED, PAYABLE, PAID, CLAWED_BACK}"
        default: ACCRUED
      - name: payable_at
        type: datetime
        source: computed
        description: "ACCRUED→PAYABLE eligibility timestamp = Application.HIRED_at + WAITING_DAYS"
        default: null

  - name: DiversityGoal
    parent: null
    common_fields: true
    fields:
      - name: department_code
        type: string
        source: input
        description: "Department this goal applies to"
        constraints: "(department_code, period_year) UNIQUE"
      - name: period_year
        type: integer
        source: input
        description: "Calendar year"
        constraints: ">= 2020"
      - name: target_protected_class_percentage
        type: number
        source: input
        description: "Goal: fraction of HIRED Applications whose Candidate.is_in_eeo_protected_class == true, as a percentage (e.g., 30.0 means 30%)"
        constraints: "0 < target_protected_class_percentage <= 100.0"
      - name: realized_percentage
        type: number
        source: computed
        description: "Per calculation rule diversity_goal_progress (realized variant); recomputed on every Application→HIRED and on every reversion FROM HIRED. 2 decimals, round_half_up."
        default: 0.00
      - name: projected_percentage
        type: number
        source: computed
        description: "Per calculation rule diversity_goal_progress (projected variant)"
        default: 0.00

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Requisition
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /requisitions/{id}/submit"
        actor: Recruiter
        preconditions:
          - "Requisition.recruiter_id == authenticated Recruiter.id"
          - "Requisition.headcount >= 1"
          - "Requisition.budget_cents >= 0"
        side_effects: []
      - from: PENDING_APPROVAL
        to: OPEN
        trigger: "POST /requisitions/{id}/approve"
        actor: HiringManager
        preconditions:
          - "actor.id == Requisition.hiring_manager_id"
          - "actor.department_code == Requisition.department_code"
        side_effects:
          - "Set Requisition.posted_at = now()"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /requisitions/{id}/reject"
        actor: HiringManager
        preconditions:
          - "actor.id == Requisition.hiring_manager_id"
        side_effects: []
      - from: OPEN
        to: ON_HOLD
        trigger: "POST /requisitions/{id}/hold"
        actor: Recruiter
        preconditions:
          - "no Application on this Requisition is in OFFER_STAGE"
        side_effects: []
      - from: ON_HOLD
        to: OPEN
        trigger: "POST /requisitions/{id}/resume"
        actor: Recruiter
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system, on Application→HIRED side-effect"
        actor: system
        preconditions:
          - "Requisition.filled_count + 1 == Requisition.headcount (i.e., this hire is the last seat)"
        side_effects:
          - "Set Requisition.closed_at = now()"
          - "Reject all non-terminal Applications on this Requisition with rejection_reason=OTHER (Application→REJECTED auto-transition; see Application state machine)"
        note: "This is hop 3 of the hire cascade; see §0.5 rule_id transitive_cascade instance hire_chain"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /requisitions/{id}/cancel"
        actor: Recruiter
        preconditions:
          - "Requisition.filled_count == 0"
          - "no Application on this Requisition is in OFFER_STAGE"
        side_effects:
          - "Set Requisition.closed_at = now()"
          - "Auto-transition every non-terminal Application to REJECTED with rejection_reason=OTHER"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /requisitions/{id}/cancel"
        actor: Recruiter
        preconditions:
          - "Requisition.filled_count == 0"
        side_effects:
          - "Set Requisition.closed_at = now()"

  - entity: Application
    initial_state: APPLIED
    terminal_states: [HIRED, REJECTED, WITHDRAWN]
    transitions:
      - from: APPLIED
        to: SCREENING
        trigger: "POST /applications/{id}/advance"
        actor: Recruiter
        preconditions:
          - "parent Requisition.status == OPEN"
        side_effects: []
      - from: SCREENING
        to: INTERVIEWING
        trigger: "POST /applications/{id}/advance"
        actor: Recruiter
        preconditions:
          - "parent Requisition.status == OPEN"
          - "at least one Interview exists under this Application with status == SCHEDULED"
        side_effects: []
      - from: INTERVIEWING
        to: OFFER_STAGE
        trigger: "POST /applications/{id}/advance"
        actor: Recruiter
        preconditions:
          - "parent Requisition.status == OPEN"
          - "at least one Interview under this Application has status == COMPLETED with at least one InterviewFeedback whose recommendation IN {HIRE, STRONG_HIRE}"
          - "Application.panel_average_score IS NOT NULL"
          - "if Candidate.is_in_eeo_protected_class == true, an EEORecord MUST exist for this Candidate"
        side_effects:
          - "Set Application.pinned_eeo_snapshot_version = Candidate.version (compound state version pin)"
      - from: OFFER_STAGE
        to: HIRED
        trigger: "system, on Offer→ACCEPTED side-effect"
        actor: system
        preconditions:
          - "an Offer linked to this Application has status == ACCEPTED"
          - "parent Requisition.status == OPEN"
          - "parent Requisition.filled_count < parent Requisition.headcount"
        side_effects:
          - "Increment parent Requisition.filled_count by 1 (bubble up; see hire_chain cascade in §0.5 rule_id transitive_cascade)"
          - "If parent Requisition.filled_count reaches headcount, transition Requisition→CLOSED (cascade hop 3)"
          - "For ReferralBonus where candidate_id == this.Candidate.id and requisition_id == this.requisition_id, set status=ACCRUED, base_amount_cents and diversity_uplift_cents via calculation referral_bonus_amount, payable_at = now() + WAITING_DAYS"
      - from: HIRED
        to: REJECTED
        trigger: "system, on BackgroundCheck→FAILED side-effect (post-hire revoke)"
        actor: system
        preconditions:
          - "BackgroundCheck linked to this Application's Offer is FAILED"
        side_effects:
          - "Set Application.rejection_reason = FAILED_BACKGROUND_CHECK"
          - "Decrement parent Requisition.filled_count by 1"
          - "If parent Requisition.status == CLOSED, reopen → OPEN and clear Requisition.closed_at"
          - "ReferralBonus on this hire: ACCRUED→CLAWED_BACK or PAYABLE→CLAWED_BACK"
      - from: APPLIED
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: Recruiter
        preconditions: []
        side_effects: ["Set Application.rejection_reason from request body"]
      - from: SCREENING
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: Recruiter
        preconditions: []
        side_effects: ["Set Application.rejection_reason from request body"]
      - from: INTERVIEWING
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: Recruiter
        preconditions: []
        side_effects: ["Set Application.rejection_reason = FAILED_INTERVIEW unless body overrides"]
      - from: OFFER_STAGE
        to: REJECTED
        trigger: "system, on Offer→DECLINED or Offer→RESCINDED"
        actor: system
        preconditions:
          - "no other ACCEPTED Offer exists on this Application"
        side_effects:
          - "Set Application.rejection_reason = OFFER_DECLINED (if Offer.status==DECLINED) or FAILED_BACKGROUND_CHECK (if RESCINDED due to BG fail) or OTHER"
      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Candidate
        preconditions: ["actor candidate_id == Application.candidate_id"]
        side_effects: []
      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects: []
      - from: INTERVIEWING
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects: []
      - from: OFFER_STAGE
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "Cancel any non-terminal Offer on this Application (Offer→RESCINDED if APPROVED/EXTENDED, otherwise dropped to DECLINED)"
      - from: APPLIED
        to: REJECTED
        trigger: "system, on parent Requisition→CANCELLED or Requisition→CLOSED side-effect"
        actor: system
        preconditions: []
        side_effects: ["Set Application.rejection_reason = OTHER"]
      - from: SCREENING
        to: REJECTED
        trigger: "system, on parent Requisition→CANCELLED or Requisition→CLOSED side-effect"
        actor: system
        preconditions: []
        side_effects: ["Set Application.rejection_reason = OTHER"]
      - from: INTERVIEWING
        to: REJECTED
        trigger: "system, on parent Requisition→CANCELLED or Requisition→CLOSED side-effect"
        actor: system
        preconditions: []
        side_effects: ["Set Application.rejection_reason = OTHER"]

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /interviews/{id}/complete"
        actor: Recruiter
        preconditions:
          - "current_time >= Interview.scheduled_end_at (use POST /_clock/advance to drive in tests)"
        side_effects:
          - "On first matching SUBMITTED InterviewFeedback, recompute Application.panel_average_score"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /interviews/{id}/no-show"
        actor: Recruiter
        preconditions:
          - "current_time >= Interview.scheduled_end_at"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /interviews/{id}/cancel"
        actor: Recruiter
        preconditions:
          - "current_time < Interview.scheduled_start_at"
        side_effects: []

  - entity: Offer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, RESCINDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /offers/{id}/submit"
        actor: Recruiter
        preconditions:
          - "parent Application.stage == OFFER_STAGE"
          - "parent Application's parent Requisition.status == OPEN"
          - "Offer.total_first_year_comp_cents <= parent Requisition.budget_cents"
          - "at least one OfferApprovalStep exists for this Offer with step_order=1"
        side_effects:
          - "Set Offer.pinned_requisition_version = Requisition.version (version-pinning on approval)"
          - "Increment parent Requisition.active_offer_count by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /offers/{id}/approve (final step approval)"
        actor: HiringManager | Compensation | Executive
        preconditions:
          - "this is the last step (max step_order) AND every prior step.decision == APPROVED"
          - "BackgroundCheck for this Offer exists and status == PASSED  (cross-entity gate: Offer↔BackgroundCheck — see rule_id cross_entity_state_dependency)"
          - "approver_id matches OfferApprovalStep.required_approver_id"
          - "approver_id != Offer.created_by_recruiter_id (segregation of duties)"
        side_effects:
          - "Set OfferApprovalStep.decision = APPROVED, decided_at = now()"
          - "Debit HiringManager.budget_cents by Offer.total_first_year_comp_cents"
      - from: PENDING_APPROVAL
        to: NEGOTIATING
        trigger: "POST /offers/{id}/request-revision"
        actor: HiringManager | Compensation | Executive
        preconditions: []
        side_effects:
          - "Set the acting OfferApprovalStep.decision = REJECTED, decided_at = now()"
      - from: NEGOTIATING
        to: PENDING_APPROVAL
        trigger: "PATCH /offers/{id}  (recruiter resubmits with new amounts)"
        actor: Recruiter
        preconditions:
          - "Offer.total_first_year_comp_cents <= parent Requisition.budget_cents"
        side_effects:
          - "Increment Offer.negotiation_round by 1"
          - "Reset every OfferApprovalStep.decision to PENDING, decided_at = null"
          - "Recompute Offer.total_first_year_comp_cents via calculation offer_total_comp"
        note: "Cycle: NEGOTIATING→PENDING_APPROVAL→NEGOTIATING is the renegotiation loop"
      - from: APPROVED
        to: EXTENDED
        trigger: "POST /offers/{id}/extend"
        actor: Recruiter
        preconditions:
          - "request body provides expires_at in the future"
          - "BackgroundCheck.status == PASSED"
        side_effects:
          - "Set Offer.expires_at"
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /offers/{id}/accept"
        actor: Candidate
        preconditions:
          - "actor candidate_id == parent Application.candidate_id"
          - "current_time < Offer.expires_at"
          - "parent Requisition.status == OPEN"
          - "parent Requisition.filled_count < parent Requisition.headcount"
        side_effects:
          - "Transition parent Application: OFFER_STAGE → HIRED  (cascade hop 1)"
          - "(Application→HIRED then bubbles up to Requisition.filled_count; see hire_chain)"
          - "Decrement parent Requisition.active_offer_count by 1"
      - from: EXTENDED
        to: DECLINED
        trigger: "POST /offers/{id}/decline"
        actor: Candidate
        preconditions:
          - "actor candidate_id == parent Application.candidate_id"
        side_effects:
          - "Decrement parent Requisition.active_offer_count by 1"
          - "Auto-transition parent Application → REJECTED with rejection_reason=OFFER_DECLINED"
      - from: EXTENDED
        to: EXPIRED
        trigger: "system, when current_time >= Offer.expires_at without ACCEPTED/DECLINED"
        actor: system
        preconditions: []
        side_effects:
          - "Decrement parent Requisition.active_offer_count by 1"
          - "Auto-transition parent Application → REJECTED with rejection_reason=OTHER"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /offers/{id}/rescind  OR  system on BackgroundCheck→FAILED"
        actor: Recruiter | system
        preconditions: []
        side_effects:
          - "Decrement parent Requisition.active_offer_count by 1"
          - "Credit back HiringManager.budget_cents by Offer.total_first_year_comp_cents"
          - "Auto-transition parent Application → REJECTED with rejection_reason=FAILED_BACKGROUND_CHECK (if RESCINDED due to BG fail) or OTHER"
      - from: EXTENDED
        to: RESCINDED
        trigger: "POST /offers/{id}/rescind  OR  system on BackgroundCheck→FAILED"
        actor: Recruiter | system
        preconditions: []
        side_effects:
          - "Decrement parent Requisition.active_offer_count by 1"
          - "Credit back HiringManager.budget_cents by Offer.total_first_year_comp_cents"
          - "Auto-transition parent Application → REJECTED with rejection_reason=FAILED_BACKGROUND_CHECK or OTHER"
      - from: ACCEPTED
        to: RESCINDED
        trigger: "system on BackgroundCheck→FAILED  (post-hire revoke)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-transition parent Application HIRED→REJECTED with rejection_reason=FAILED_BACKGROUND_CHECK"
          - "Decrement parent Requisition.filled_count by 1"
          - "If parent Requisition.status==CLOSED, reopen Requisition→OPEN, clear closed_at"
          - "Credit back HiringManager.budget_cents by Offer.total_first_year_comp_cents"
          - "ReferralBonus on this hire: status→CLAWED_BACK (compensating action — see compensating_invariant rule)"
        note: "This branch is the bg_fail_chain cascade in §0.5 rule_id transitive_cascade (BG→Offer→Application→Requisition)"

  - entity: OfferApprovalStep
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /offers/{id}/approve at this step's step_order"
        actor: HiringManager | Compensation | Executive
        preconditions:
          - "every prior step.decision == APPROVED"
          - "approver_id == OfferApprovalStep.required_approver_id"
        side_effects:
          - "Set decided_at = now()"
          - "If this is the final step, advance Offer to APPROVED (see Offer state machine)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /offers/{id}/request-revision"
        actor: HiringManager | Compensation | Executive
        preconditions: []
        side_effects:
          - "Set decided_at = now()"
          - "Advance Offer to NEGOTIATING"

  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /background-checks/{id}/report-result with outcome=PASS"
        actor: opaque ComplianceOfficer
        preconditions:
          - "actor.role == ComplianceOfficer"
          - "BackgroundCheck.status == PENDING"
        side_effects:
          - "Set result_received_at = now()"
      - from: PENDING
        to: FAILED
        trigger: "POST /background-checks/{id}/report-result with outcome=FAIL"
        actor: opaque ComplianceOfficer
        preconditions:
          - "actor.role == ComplianceOfficer"
        side_effects:
          - "Set result_received_at = now()"
          - "Cascade to Offer: if Offer.status IN {APPROVED, EXTENDED, ACCEPTED}, force Offer → RESCINDED (or post-hire revoke chain — see bg_fail_chain)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /background-checks/{id}/cancel"
        actor: Recruiter
        preconditions:
          - "linked Offer.status IN {NEGOTIATING, DECLINED, RESCINDED, EXPIRED}"
        side_effects: []

  - entity: ReferralBonus
    initial_state: ACCRUED
    terminal_states: [PAID, CLAWED_BACK]
    transitions:
      - from: ACCRUED
        to: PAYABLE
        trigger: "POST /_clock/advance moves current_time past payable_at"
        actor: system
        preconditions:
          - "current_time >= ReferralBonus.payable_at"
          - "linked Application.stage == HIRED"
        side_effects: []
      - from: PAYABLE
        to: PAID
        trigger: "POST /referral-bonuses/{id}/pay"
        actor: opaque PayrollOperator
        preconditions:
          - "linked Application.stage == HIRED"
        side_effects: []
      - from: ACCRUED
        to: CLAWED_BACK
        trigger: "system, on Application HIRED→REJECTED (post-hire revoke)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAYABLE
        to: CLAWED_BACK
        trigger: "system, on Application HIRED→REJECTED (post-hire revoke)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two recruiters create an Application for the same (requisition_id, candidate_id) concurrently"
    guarantee: "At most one Application exists with status NOT IN {WITHDRAWN, REJECTED} for that pair; second is rejected"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    serialization: "First-writer-wins on (requisition_id, candidate_id) uniqueness"

  - scenario: "Two approvers act on the same OfferApprovalStep concurrently (one approve, one request-revision)"
    guarantee: "Exactly one decision is recorded; loser receives ERR_INVALID_STATE because the step is no longer PENDING"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on OfferApprovalStep.decision (PENDING→APPROVED|REJECTED)"

  - scenario: "Candidate accepts the offer while Recruiter rescinds it concurrently"
    guarantee: "Exactly one operation succeeds; loser is rejected with ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Offer.status (EXTENDED→ACCEPTED vs EXTENDED→RESCINDED)"

  - scenario: "Two candidates try to fill the last open headcount slot on the same Requisition by accepting concurrently issued Offers"
    guarantee: "At most filled_count == headcount; second acceptance is rejected"
    error_id: ERR_HEADCOUNT_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on Requisition.filled_count increment"

  - scenario: "Two recruiters schedule overlapping interviews for the same Interviewer (overlapping closed intervals after 15-minute buffer)"
    guarantee: "At most one Interview occupies any moment of the interviewer's calendar (with 15-minute buffer); second is rejected"
    error_id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http_status: 409
    serialization: "First-writer-wins on Interviewer.scheduled_start_at/scheduled_end_at overlap with 15-min buffer"

  - scenario: "Offer accept and BackgroundCheck FAIL report arrive concurrently"
    guarantee: "Exactly one outcome wins; if BackgroundCheck reports FAIL first, accept loses with ERR_INVALID_STATE; if accept lands first, the FAIL still applies and post-hire revoke cascade runs (Offer→RESCINDED, Application HIRED→REJECTED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Offer.status; FAIL after ACCEPTED triggers post-hire revoke cascade"

  - scenario: "Stale PATCH on Offer during NEGOTIATING uses outdated version number"
    guarantee: "OCC rejects stale update"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "version field on Offer must match server version"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: offer_total_comp
    description: "First-year total compensation for an Offer"
    trigger: "Offer creation (POST /applications/{id}/offers) and every PATCH that updates base_salary_cents, sign_on_bonus_cents, or annual_equity_cents; also on every NEGOTIATING→PENDING_APPROVAL transition"
    inputs:
      - Offer.base_salary_cents
      - Offer.sign_on_bonus_cents
      - Offer.annual_equity_cents
    algorithm: tiered_pricing
    formula: |
      # Step 1: round each component to whole dollars FIRST (round_half_up), then sum.
      # This is mode-(b) of §0.5 rule_id combinatorial_formula: pin rounding order.
      base_dollars    = round_half_up(Offer.base_salary_cents    / 100)
      signon_dollars  = round_half_up(Offer.sign_on_bonus_cents  / 100)
      equity_dollars  = round_half_up(Offer.annual_equity_cents  / 100)
      total_dollars   = base_dollars + signon_dollars + equity_dollars
      Offer.total_first_year_comp_cents = total_dollars * 100
      # NOTE: summing the cents first and rounding to dollars at the end is INCORRECT.
    constants: {}
    precision: "whole dollars (cents always end in 00), round_half_up per component"
    variants:
      - name: provisional
        when: "Offer.status IN {DRAFT, PENDING_APPROVAL, NEGOTIATING}; reads CURRENT Offer field values"
        difference: "Recomputed live on every mutation; not budget-pinned"
      - name: ratified
        when: "Offer.status IN {APPROVED, EXTENDED, ACCEPTED}; reads the pinned snapshot at the moment of APPROVED transition"
        difference: "Frozen at the moment Offer first reached APPROVED; subsequent PATCH attempts on those fields are rejected with ERR_INVALID_STATE"

  - name: referral_bonus_amount
    description: "Tiered referral bonus with diversity uplift"
    trigger: "Application→HIRED side-effect on a ReferralBonus tied to (candidate_id, requisition_id)"
    inputs:
      - Requisition.seniority_level
      - Candidate.is_in_eeo_protected_class
      - Requisition.target_diversity_goal_id  # presence flips uplift cap
    algorithm: tiered_pricing
    formula: |
      # Mode-(a) of §0.5 rule_id combinatorial_formula: ≥3 inputs with non-linear interaction
      seniority_tiers_cents = {
        JUNIOR:    150000,   # $1,500.00
        MID:       250000,   # $2,500.00
        SENIOR:    500000,   # $5,000.00
        STAFF:     750000,   # $7,500.00
        PRINCIPAL: 1000000   # $10,000.00
      }
      base_amount_cents = seniority_tiers_cents[Requisition.seniority_level]

      if Candidate.is_in_eeo_protected_class == true:
          diversity_uplift_cents = round_half_up(base_amount_cents * UPLIFT_RATE)
          # Cap the uplift, but the cap depends on whether the requisition is tied to a DiversityGoal:
          if Requisition.target_diversity_goal_id is not null:
              cap = UPLIFT_CAP_GOAL_CENTS
          else:
              cap = UPLIFT_CAP_DEFAULT_CENTS
          diversity_uplift_cents = min(diversity_uplift_cents, cap)
      else:
          diversity_uplift_cents = 0

      total_amount_cents = base_amount_cents + diversity_uplift_cents
      ReferralBonus.payable_at = Application.HIRED_at + WAITING_DAYS
    constants:
      UPLIFT_RATE: 0.50            # 50% uplift on the base
      UPLIFT_CAP_DEFAULT_CENTS: 200000   # $2,000.00 cap when no goal tied
      UPLIFT_CAP_GOAL_CENTS:    400000   # $4,000.00 cap when goal tied
      WAITING_DAYS: 90
    precision: "integer cents; round_half_up only at uplift step"
    variants: []

  - name: diversity_goal_progress
    description: "Compute realized and projected percentages for a DiversityGoal"
    trigger: |
      - Every Application→HIRED (recompute realized) and every reversion FROM HIRED
      - Every Application→OFFER_STAGE and every reversion FROM OFFER_STAGE (recompute projected)
      - Every Application→APPLIED creation and every Application→REJECTED|WITHDRAWN (recompute projected)
    inputs:
      - DiversityGoal.department_code
      - DiversityGoal.period_year
      - Applications tied via Requisition.target_diversity_goal_id
    algorithm: aggregation
    formula: |
      # Realized variant — only counts Applications where stage == HIRED
      hired_set = {
        a in Application | a.stage == HIRED
                         AND a.requisition.target_diversity_goal_id == DiversityGoal.id
                         AND year(a.updated_at) == DiversityGoal.period_year
      }
      if len(hired_set) == 0:
          realized_percentage = 0.00
      else:
          protected = count(a in hired_set | a.candidate.is_in_eeo_protected_class == true)
          realized_percentage = round_half_up(100 * protected / len(hired_set), 2)

      # Projected variant — includes Applications still in the pipeline plus realized
      projected_set = {
        a in Application | a.stage IN {APPLIED, SCREENING, INTERVIEWING, OFFER_STAGE, HIRED}
                         AND a.requisition.target_diversity_goal_id == DiversityGoal.id
                         AND year(a.created_at) == DiversityGoal.period_year
      }
      if len(projected_set) == 0:
          projected_percentage = 0.00
      else:
          protected_p = count(a in projected_set | a.candidate.is_in_eeo_protected_class == true)
          projected_percentage = round_half_up(100 * protected_p / len(projected_set), 2)
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: realized
        when: "Read via GET /diversity-goals/{id} field 'realized_percentage'"
        difference: "Denominator = HIRED applications only"
      - name: projected
        when: "Read via GET /diversity-goals/{id} field 'projected_percentage'"
        difference: "Denominator includes APPLIED/SCREENING/INTERVIEWING/OFFER_STAGE plus HIRED; can drop as a WITHDRAWN candidate leaves the denominator"

  - name: panel_average_score
    description: "Average of submitted InterviewFeedback scores on an Application"
    trigger: "Every POST /interviews/{id}/feedback that creates a new InterviewFeedback, and every Interview→COMPLETED"
    inputs:
      - Application.id
    algorithm: aggregation
    formula: |
      feedback_set = {
        f in InterviewFeedback | f.interview.application_id == Application.id
                              AND f.interview.status == COMPLETED
      }
      if len(feedback_set) == 0:
          Application.panel_average_score = null
      else:
          Application.panel_average_score = round_half_up(
              sum(f.overall_score for f in feedback_set) / len(feedback_set),
              2
          )
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHORIZED
    http_status: 401
    applies_to: "all except POST /_clock/advance, POST /_events/emit"

  - priority: 2
    category: auth
    check: "Role permitted for the requested endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All resources named in the URL path exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "All foreign-key fields in the request body reference existing entities (e.g., recruiter_id, hiring_manager_id, interviewer_id, candidate_id, target_diversity_goal_id, referrer_employee_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /requisitions, POST /applications, POST /interviews, POST /offers, PATCH endpoints"

  - priority: 5
    category: state
    check: "Acting entity is in a state that permits the requested transition (e.g., Requisition must be DRAFT for /submit, OPEN for /hold, ON_HOLD for /resume)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "Optimistic concurrency: when 'version' is supplied in a PATCH body, it MUST equal the server's current version of the target entity"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 7
    category: business_safety
    check: "OFCCP audit gate: if Candidate.is_in_eeo_protected_class==true, an EEORecord MUST exist for that Candidate BEFORE the Application can advance INTERVIEWING→OFFER_STAGE"
    error_id: ERR_EEO_DATA_MISSING
    http_status: 422
    applies_to: "POST /applications/{id}/advance (when advancing to OFFER_STAGE)"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the approver acting on an OfferApprovalStep MUST NOT be the Recruiter who created the parent Offer; an Interviewer scoring a candidate flagged is_in_eeo_protected_class MUST have is_certified_for_eeo==true"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /offers/{id}/approve, POST /interviews/{id}/feedback"

  - priority: 9
    category: business_referential
    check: "Candidate.source==REFERRAL requires non-null referrer_employee_id; conversely Candidate.source!=REFERRAL requires referrer_employee_id IS NULL. ReferralBonus may only be created for a Candidate whose source==REFERRAL."
    error_id: ERR_REFERRAL_REQUIRES_REFERRER
    http_status: 422
    applies_to: "POST /candidates, POST /referral-bonuses, side-effect on Application→HIRED"

  - priority: 10
    category: business_constraint
    check: "Interview overlap with buffer: a new Interview on Interviewer X cannot overlap (Interview.scheduled_start_at, Interview.scheduled_end_at as a CLOSED interval) with any of X's other Interviews of status==SCHEDULED, after extending each existing interval by INTERVIEW_BUFFER_MINUTES=15 on both sides. Adjacency (end1 == start2) IS a conflict because of the buffer."
    error_id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /applications/{id}/interviews, PATCH /interviews/{id}"

  - priority: 11
    category: business_constraint
    check: "Active-open-requisition cap per recruiter: a Recruiter cannot own more than MAX_OPEN_REQUISITIONS_PER_RECRUITER=5 Requisitions whose posted_at IS NOT NULL AND closed_at IS NULL  (half-open lifetime interval). Aggregate cap, NOT pairwise overlap; semantics differ from interview overlap."
    error_id: ERR_RECRUITER_REQUISITION_CAP
    http_status: 409
    applies_to: "POST /requisitions/{id}/approve"

  - priority: 12
    category: business_constraint
    check: "(requisition_id, candidate_id) UNIQUE when Application.stage NOT IN {WITHDRAWN, REJECTED}"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /applications"

  - priority: 13
    category: business_constraint
    check: "Application advance from INTERVIEWING→OFFER_STAGE requires at least one Interview.status==COMPLETED with InterviewFeedback whose recommendation IN {HIRE, STRONG_HIRE}; if zero qualifying feedback exists, reject"
    error_id: ERR_NO_QUALIFYING_FEEDBACK
    http_status: 409
    applies_to: "POST /applications/{id}/advance"

  - priority: 14
    category: business_fiscal
    check: "Offer.total_first_year_comp_cents <= parent Requisition.budget_cents at every transition into PENDING_APPROVAL or APPROVED"
    error_id: ERR_OFFER_EXCEEDS_REQ_BUDGET
    http_status: 422
    applies_to: "POST /offers/{id}/submit, PATCH /offers/{id}, POST /offers/{id}/approve"

  - priority: 15
    category: business_fiscal
    check: "HiringManager.budget_cents >= sum of total_first_year_comp_cents across that manager's APPROVED|EXTENDED|ACCEPTED Offers in current period; the new APPROVED transition must not breach this"
    error_id: ERR_MANAGER_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /offers/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: "Requisition.filled_count + 1 <= Requisition.headcount at Application→HIRED moment"
    error_id: ERR_HEADCOUNT_EXCEEDED
    http_status: 409
    applies_to: "POST /offers/{id}/accept (which cascades into Application→HIRED)"

  - priority: 17
    category: business_constraint
    check: "Diversity goal threshold check on /diversity-goals/{id}/lock: realized_percentage >= target_protected_class_percentage (note: '>=' NOT '>'; exactly hitting the target counts as met)"
    error_id: ERR_DIVERSITY_GOAL_NOT_MET
    http_status: 422
    applies_to: "POST /diversity-goals/{id}/lock"

  - priority: 18
    category: business_temporal
    check: "Offer extension requires expires_at > now() at the moment of the /extend call"
    error_id: ERR_OFFER_EXPIRES_IN_PAST
    http_status: 422
    applies_to: "POST /offers/{id}/extend"

  - priority: 19
    category: business_temporal
    check: "Interview /complete requires now() >= scheduled_end_at; Interview /cancel requires now() < scheduled_start_at"
    error_id: ERR_INTERVIEW_TIMING
    http_status: 409
    applies_to: "POST /interviews/{id}/complete, POST /interviews/{id}/cancel, POST /interviews/{id}/no-show"

  - priority: 20
    category: business_constraint
    check: "Interview must have at least one interviewer assigned (panel size >= 1); also when /advance moves Application INTERVIEWING→OFFER_STAGE, at least one Interview must be COMPLETED — an empty completed-set is rejected"
    error_id: ERR_EMPTY_PANEL
    http_status: 409
    applies_to: "POST /applications/{id}/advance, POST /applications/{id}/interviews"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Recruiters / HiringManagers / Interviewers (lightweight management) ---
  - method: POST
    path: "/recruiters"
    description: "Create a Recruiter"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, department_code]
    output: Recruiter
    side_effects: []

  - method: GET
    path: "/recruiters/{id}"
    description: "Read a Recruiter"
    roles: [PlatformAdmin, Recruiter, HiringManager]
    code: 200
    input: []
    output: Recruiter
    side_effects: []

  - method: POST
    path: "/hiring-managers"
    description: "Create a HiringManager"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, department_code, budget_cents]
    output: HiringManager
    side_effects: []

  - method: POST
    path: "/interviewers"
    description: "Create an Interviewer"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, department_code, "is_certified_for_eeo?"]
    output: Interviewer
    side_effects: []

  # --- Requisitions ---
  - method: POST
    path: "/requisitions"
    description: "Create a Requisition in DRAFT"
    roles: [Recruiter]
    code: 201
    input: [recruiter_id, hiring_manager_id, job_title, department_code, seniority_level, headcount, budget_cents, "target_diversity_goal_id?"]
    output: Requisition
    side_effects: []

  - method: GET
    path: "/requisitions"
    description: "List Requisitions (filterable by status, recruiter_id, hiring_manager_id, department_code)"
    roles: [PlatformAdmin, Recruiter, HiringManager]
    code: 200
    input: ["status?", "recruiter_id?", "hiring_manager_id?", "department_code?", "limit?", "offset?"]
    output: Requisition[]
    side_effects: []

  - method: GET
    path: "/requisitions/{id}"
    description: "Read a Requisition"
    roles: [PlatformAdmin, Recruiter, HiringManager]
    code: 200
    input: []
    output: Requisition
    side_effects: []

  - method: PATCH
    path: "/requisitions/{id}"
    description: "Edit Requisition fields while in DRAFT"
    roles: [Recruiter]
    code: 200
    input: ["job_title?", "department_code?", "seniority_level?", "headcount?", "budget_cents?", "target_diversity_goal_id?", "version?"]
    output: Requisition
    side_effects: []

  - method: POST
    path: "/requisitions/{id}/submit"
    description: "DRAFT→PENDING_APPROVAL"
    roles: [Recruiter]
    code: 200
    input: []
    output: Requisition
    side_effects: ["state transition"]

  - method: POST
    path: "/requisitions/{id}/approve"
    description: "PENDING_APPROVAL→OPEN"
    roles: [HiringManager]
    code: 200
    input: []
    output: Requisition
    side_effects: ["sets posted_at; enforces ERR_RECRUITER_REQUISITION_CAP"]

  - method: POST
    path: "/requisitions/{id}/reject"
    description: "PENDING_APPROVAL→DRAFT"
    roles: [HiringManager]
    code: 200
    input: []
    output: Requisition
    side_effects: []

  - method: POST
    path: "/requisitions/{id}/hold"
    description: "OPEN→ON_HOLD"
    roles: [Recruiter]
    code: 200
    input: []
    output: Requisition
    side_effects: []

  - method: POST
    path: "/requisitions/{id}/resume"
    description: "ON_HOLD→OPEN"
    roles: [Recruiter]
    code: 200
    input: []
    output: Requisition
    side_effects: []

  - method: POST
    path: "/requisitions/{id}/cancel"
    description: "OPEN|ON_HOLD→CANCELLED"
    roles: [Recruiter]
    code: 200
    input: []
    output: Requisition
    side_effects: ["auto-rejects non-terminal Applications"]

  # --- Candidates / EEO ---
  - method: POST
    path: "/candidates"
    description: "Create a Candidate"
    roles: [Recruiter, PlatformAdmin]
    code: 201
    input: [email, full_name, source, "referrer_employee_id?", "is_in_eeo_protected_class?"]
    output: Candidate
    side_effects: ["ERR_REFERRAL_REQUIRES_REFERRER enforced"]

  - method: GET
    path: "/candidates/{id}"
    description: "Read a Candidate"
    roles: [Recruiter, HiringManager, PlatformAdmin]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: POST
    path: "/candidates/{id}/eeo-record"
    description: "Attach the EEORecord (one per Candidate)"
    roles: [Candidate, ComplianceOfficer]
    code: 201
    input: [gender, ethnicity, veteran_status, disability_status]
    output: EEORecord
    side_effects: []

  - method: GET
    path: "/candidates/{id}/eeo-record"
    description: "Read EEORecord (ComplianceOfficer or the candidate themselves)"
    roles: [Candidate, ComplianceOfficer]
    code: 200
    input: []
    output: EEORecord
    side_effects: []

  # --- Applications ---
  - method: POST
    path: "/requisitions/{id}/applications"
    description: "Create an Application on a Requisition"
    roles: [Recruiter, Candidate]
    code: 201
    input: [candidate_id]
    output: Application
    side_effects: ["recomputes DiversityGoal.projected_percentage"]

  - method: GET
    path: "/applications/{id}"
    description: "Read an Application"
    roles: [Recruiter, HiringManager, Candidate, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/requisitions/{id}/applications"
    description: "List Applications on a Requisition (filterable by stage)"
    roles: [Recruiter, HiringManager, PlatformAdmin]
    code: 200
    input: ["stage?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/advance"
    description: "Advance to the next stage in the pipeline"
    roles: [Recruiter]
    code: 200
    input: []
    output: Application
    side_effects: ["pins eeo snapshot when entering OFFER_STAGE; recomputes DiversityGoal.projected_percentage"]

  - method: POST
    path: "/applications/{id}/reject"
    description: "Reject the application"
    roles: [Recruiter]
    code: 200
    input: [rejection_reason]
    output: Application
    side_effects: ["recomputes DiversityGoal.projected_percentage"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Candidate withdraws"
    roles: [Candidate]
    code: 200
    input: []
    output: Application
    side_effects: ["cancels any non-terminal Offer; recomputes DiversityGoal.projected_percentage"]

  # --- Interviews / Feedback ---
  - method: POST
    path: "/applications/{id}/interviews"
    description: "Schedule an Interview"
    roles: [Recruiter]
    code: 201
    input: [interviewer_id, scheduled_start_at, scheduled_end_at]
    output: Interview
    side_effects: ["ERR_INTERVIEWER_DOUBLE_BOOKED enforced with 15-min buffer"]

  - method: GET
    path: "/interviews/{id}"
    description: "Read an Interview"
    roles: [Recruiter, HiringManager, Interviewer, PlatformAdmin]
    code: 200
    input: []
    output: Interview
    side_effects: []

  - method: POST
    path: "/interviews/{id}/complete"
    description: "Mark Interview COMPLETED (must be at/after scheduled_end_at)"
    roles: [Recruiter, Interviewer]
    code: 200
    input: []
    output: Interview
    side_effects: ["may trigger panel_average_score recompute"]

  - method: POST
    path: "/interviews/{id}/no-show"
    description: "Mark Interview NO_SHOW"
    roles: [Recruiter, Interviewer]
    code: 200
    input: []
    output: Interview
    side_effects: []

  - method: POST
    path: "/interviews/{id}/cancel"
    description: "Cancel SCHEDULED Interview before scheduled_start_at"
    roles: [Recruiter]
    code: 200
    input: []
    output: Interview
    side_effects: []

  - method: POST
    path: "/interviews/{id}/feedback"
    description: "Submit InterviewFeedback (Interviewer themselves only)"
    roles: [Interviewer]
    code: 201
    input: [overall_score, recommendation]
    output: InterviewFeedback
    side_effects: ["recomputes Application.panel_average_score"]

  - method: GET
    path: "/interviews/{id}/feedback"
    description: "List feedback for an Interview"
    roles: [Recruiter, HiringManager, Interviewer]
    code: 200
    input: []
    output: InterviewFeedback[]
    side_effects: []

  # --- Offers / Approval Chain ---
  - method: POST
    path: "/applications/{id}/offers"
    description: "Create an Offer in DRAFT (requires Application.stage==OFFER_STAGE)"
    roles: [Recruiter]
    code: 201
    input: [base_salary_cents, "sign_on_bonus_cents?", "annual_equity_cents?", approval_chain]
    output: Offer
    side_effects: ["creates OfferApprovalStep[] from approval_chain; runs offer_total_comp"]

  - method: GET
    path: "/offers/{id}"
    description: "Read an Offer"
    roles: [Recruiter, HiringManager, Candidate, Compensation, Executive, PlatformAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: PATCH
    path: "/offers/{id}"
    description: "Edit Offer amounts (DRAFT or NEGOTIATING only)"
    roles: [Recruiter]
    code: 200
    input: ["base_salary_cents?", "sign_on_bonus_cents?", "annual_equity_cents?", "version?"]
    output: Offer
    side_effects: ["re-runs offer_total_comp; if from NEGOTIATING, also drives Offer to PENDING_APPROVAL and resets ApprovalSteps"]

  - method: POST
    path: "/offers/{id}/submit"
    description: "DRAFT→PENDING_APPROVAL"
    roles: [Recruiter]
    code: 200
    input: []
    output: Offer
    side_effects: ["pins Requisition.version"]

  - method: POST
    path: "/offers/{id}/approve"
    description: "Approve the next pending OfferApprovalStep"
    roles: [HiringManager, Compensation, Executive]
    code: 200
    input: [step_order]
    output: Offer
    side_effects: ["may trigger Offer→APPROVED if last step; debits HiringManager.budget_cents"]

  - method: POST
    path: "/offers/{id}/request-revision"
    description: "PENDING_APPROVAL→NEGOTIATING (the approver requests changes)"
    roles: [HiringManager, Compensation, Executive]
    code: 200
    input: [step_order, "reason?"]
    output: Offer
    side_effects: ["sets that step's decision=REJECTED"]

  - method: POST
    path: "/offers/{id}/extend"
    description: "APPROVED→EXTENDED (deliver to candidate)"
    roles: [Recruiter]
    code: 200
    input: [expires_at]
    output: Offer
    side_effects: []

  - method: POST
    path: "/offers/{id}/accept"
    description: "EXTENDED→ACCEPTED (candidate accepts)"
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: ["cascades to Application→HIRED, Requisition.filled_count++, possibly Requisition→CLOSED; triggers referral_bonus_amount"]

  - method: POST
    path: "/offers/{id}/decline"
    description: "EXTENDED→DECLINED (candidate declines)"
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: ["cascades to Application→REJECTED (OFFER_DECLINED)"]

  - method: POST
    path: "/offers/{id}/rescind"
    description: "APPROVED|EXTENDED→RESCINDED"
    roles: [Recruiter]
    code: 200
    input: ["reason?"]
    output: Offer
    side_effects: ["credits HiringManager.budget_cents back; cascades to Application→REJECTED"]

  - method: GET
    path: "/offers/{id}/approval-chain"
    description: "Read OfferApprovalStep[] for this Offer"
    roles: [Recruiter, HiringManager, Compensation, Executive, PlatformAdmin]
    code: 200
    input: []
    output: OfferApprovalStep[]
    side_effects: []

  # --- Background Checks ---
  - method: POST
    path: "/offers/{id}/background-check"
    description: "Order a BackgroundCheck for an Offer (PENDING)"
    roles: [Recruiter]
    code: 201
    input: [vendor]
    output: BackgroundCheck
    side_effects: []

  - method: GET
    path: "/background-checks/{id}"
    description: "Read a BackgroundCheck"
    roles: [Recruiter, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  - method: POST
    path: "/background-checks/{id}/report-result"
    description: "Compliance reports the outcome"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]                       # one of {PASS, FAIL}
    output: BackgroundCheck
    side_effects: ["on FAIL, cascades Offer→RESCINDED (or post-hire revoke if ACCEPTED)"]

  - method: POST
    path: "/background-checks/{id}/cancel"
    description: "Cancel a PENDING BackgroundCheck whose Offer is no longer live"
    roles: [Recruiter]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  # --- Referral Bonus ---
  - method: GET
    path: "/referral-bonuses"
    description: "List ReferralBonus records (filterable by status, referrer_employee_id, candidate_id)"
    roles: [Recruiter, PayrollOperator, PlatformAdmin]
    code: 200
    input: ["status?", "referrer_employee_id?", "candidate_id?", "limit?", "offset?"]
    output: ReferralBonus[]
    side_effects: []

  - method: GET
    path: "/referral-bonuses/{id}"
    description: "Read a ReferralBonus"
    roles: [Recruiter, PayrollOperator, PlatformAdmin]
    code: 200
    input: []
    output: ReferralBonus
    side_effects: []

  - method: POST
    path: "/referral-bonuses/{id}/pay"
    description: "PAYABLE→PAID (payroll executes payment)"
    roles: [PayrollOperator]
    code: 200
    input: []
    output: ReferralBonus
    side_effects: []

  # --- Diversity Goals ---
  - method: POST
    path: "/diversity-goals"
    description: "Create a DiversityGoal"
    roles: [PlatformAdmin]
    code: 201
    input: [department_code, period_year, target_protected_class_percentage]
    output: DiversityGoal
    side_effects: []

  - method: GET
    path: "/diversity-goals/{id}"
    description: "Read a DiversityGoal (returns realized_percentage and projected_percentage)"
    roles: [PlatformAdmin, Recruiter, HiringManager]
    code: 200
    input: []
    output: DiversityGoal
    side_effects: []

  - method: POST
    path: "/diversity-goals/{id}/lock"
    description: "Attempt to lock a goal as 'met' for the period (enforces realized >= target)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DiversityGoal
    side_effects: ["ERR_DIVERSITY_GOAL_NOT_MET if realized_percentage < target_protected_class_percentage"]

  # --- Test-driving harness endpoints ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the server's logical clock to drive time-gated transitions (interview completion eligibility, offer expiration, referral payable_at). Test harness only."
    roles: [PlatformAdmin]
    code: 200
    input: [to]                            # ISO 8601 UTC datetime
    output: null
    side_effects: ["any Offer EXTENDED whose expires_at <= new_now auto-transitions to EXPIRED; any ReferralBonus ACCRUED whose payable_at <= new_now auto-transitions to PAYABLE"]

  - method: POST
    path: "/_events/emit"
    description: "Emit a system event (used by tests to drive purely cascading transitions like sweep ticks). Currently used to trigger the OFFER_EXPIRY_SWEEP and REFERRAL_PAYABLE_SWEEP idempotently."
    roles: [PlatformAdmin]
    code: 200
    input: [event_type]                    # one of {OFFER_EXPIRY_SWEEP, REFERRAL_PAYABLE_SWEEP}
    output: null
    side_effects: ["scans matching entities and performs eligible auto-transitions"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHORIZED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role is not permitted for the requested endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource named in the URL path does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Foreign-key field in request body references a non-existent entity"
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic field-level validation failure (type, range, missing required field)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state that permits the requested transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: supplied 'version' does not match the server's current version"
  - id: ERR_EEO_DATA_MISSING
    http: 422
    condition: "Application advancing INTERVIEWING→OFFER_STAGE for a candidate is_in_eeo_protected_class==true without an attached EEORecord"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Approver acting on OfferApprovalStep equals the Recruiter who created the Offer, OR an Interviewer scoring an EEO-flagged candidate lacks is_certified_for_eeo"
  - id: ERR_REFERRAL_REQUIRES_REFERRER
    http: 422
    condition: "Candidate.source==REFERRAL with null referrer_employee_id (or vice versa), or ReferralBonus created for a non-REFERRAL candidate"
  - id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http: 409
    condition: "New/edited Interview overlaps an existing SCHEDULED Interview of the same Interviewer (closed interval + 15-min buffer)"
  - id: ERR_RECRUITER_REQUISITION_CAP
    http: 409
    condition: "Recruiter already owns MAX_OPEN_REQUISITIONS_PER_RECRUITER=5 Requisitions whose posted_at IS NOT NULL AND closed_at IS NULL (aggregate cap on half-open lifetime intervals)"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "(requisition_id, candidate_id) already exists for an Application whose stage NOT IN {WITHDRAWN, REJECTED}"
  - id: ERR_NO_QUALIFYING_FEEDBACK
    http: 409
    condition: "Application advance to OFFER_STAGE without at least one COMPLETED Interview having InterviewFeedback whose recommendation IN {HIRE, STRONG_HIRE}"
  - id: ERR_OFFER_EXCEEDS_REQ_BUDGET
    http: 422
    condition: "Offer.total_first_year_comp_cents > parent Requisition.budget_cents at submit/approve/edit"
  - id: ERR_MANAGER_BUDGET_EXCEEDED
    http: 422
    condition: "Approving this Offer would push the HiringManager's total committed comp past HiringManager.budget_cents"
  - id: ERR_HEADCOUNT_EXCEEDED
    http: 409
    condition: "Application→HIRED would push Requisition.filled_count beyond Requisition.headcount"
  - id: ERR_DIVERSITY_GOAL_NOT_MET
    http: 422
    condition: "DiversityGoal.realized_percentage < DiversityGoal.target_protected_class_percentage at /lock time (strict <; the '>=' threshold is met when equal)"
  - id: ERR_OFFER_EXPIRES_IN_PAST
    http: 422
    condition: "POST /offers/{id}/extend with expires_at <= now()"
  - id: ERR_INTERVIEW_TIMING
    http: 409
    condition: "Interview /complete or /no-show called before scheduled_end_at, or /cancel called at/after scheduled_start_at"
  - id: ERR_EMPTY_PANEL
    http: 409
    condition: "Application advance to OFFER_STAGE with zero COMPLETED Interviews, or Interview created with no interviewer assigned"
  - id: ERR_HEADCOUNT_IMMUTABLE
    http: 422
    condition: "PATCH /requisitions/{id} attempts to modify headcount after status leaves DRAFT"
  - id: ERR_OFFER_FIELDS_IMMUTABLE
    http: 422
    condition: "PATCH /offers/{id} attempts to modify base_salary_cents/sign_on_bonus_cents/annual_equity_cents while status NOT IN {DRAFT, NEGOTIATING}"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Recruiter
    description: "Owns requisitions, candidates, applications, interviews, and offers; orchestrates the pipeline"
    identity: "entity_backed:Recruiter"
    exclusive_operations:
      - "POST /requisitions, PATCH /requisitions/{id}, POST /requisitions/{id}/submit"
      - "POST /requisitions/{id}/hold, /resume, /cancel"
      - "POST /applications/{id}/advance, /reject"
      - "POST /applications/{id}/interviews, POST /interviews/{id}/cancel, /no-show"
      - "POST /offers (POST /applications/{id}/offers), PATCH /offers/{id}"
      - "POST /offers/{id}/submit, /extend, /rescind"
      - "POST /offers/{id}/background-check, POST /background-checks/{id}/cancel"
    shared_operations:
      - "POST /candidates  (shared with PlatformAdmin)"
      - "POST /interviews/{id}/complete  (shared with Interviewer)"
      - "GET /requisitions, /candidates, /applications, /interviews, /offers, /referral-bonuses  (read paths shared with HiringManager, PlatformAdmin)"

  - name: HiringManager
    description: "Approves requisitions, owns hiring budget, may serve as the HIRING_MANAGER step in OfferApprovalSteps"
    identity: "entity_backed:HiringManager"
    exclusive_operations:
      - "POST /requisitions/{id}/approve, /reject"
    shared_operations:
      - "POST /offers/{id}/approve  (shared with Compensation, Executive at later steps)"
      - "POST /offers/{id}/request-revision  (shared with Compensation, Executive)"
      - "GET on Requisition / Application / Offer / Interview"

  - name: Interviewer
    description: "Conducts interviews and submits feedback"
    identity: "entity_backed:Interviewer"
    exclusive_operations:
      - "POST /interviews/{id}/feedback  (must equal Interview.interviewer_id)"
    shared_operations:
      - "POST /interviews/{id}/complete, /no-show  (shared with Recruiter)"
      - "GET /interviews/{id}, GET /interviews/{id}/feedback"

  - name: Candidate
    description: "Acts as the applicant — applies, withdraws, accepts/declines offers, may upload own EEORecord"
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /applications/{id}/withdraw"
      - "POST /offers/{id}/accept, /decline"
    shared_operations:
      - "POST /requisitions/{id}/applications  (shared with Recruiter)"
      - "POST /candidates/{id}/eeo-record  (shared with ComplianceOfficer)"
      - "GET on own Application / own Offer / own EEORecord"

  - name: Compensation
    description: "Compensation-team approver in the offer approval chain"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /offers/{id}/approve  (shared with HiringManager, Executive)"
      - "POST /offers/{id}/request-revision  (shared with HiringManager, Executive)"
      - "GET /offers/{id}, /offers/{id}/approval-chain"

  - name: Executive
    description: "Executive-team approver at the top of the chain (typically last step for SENIOR+ offers)"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /offers/{id}/approve  (shared with HiringManager, Compensation)"
      - "POST /offers/{id}/request-revision  (shared with HiringManager, Compensation)"
      - "GET /offers/{id}, /offers/{id}/approval-chain"

  - name: ComplianceOfficer
    description: "Reports background-check results; reads EEO data for OFCCP audits"
    identity: "opaque"
    exclusive_operations:
      - "POST /background-checks/{id}/report-result"
    shared_operations:
      - "POST /candidates/{id}/eeo-record  (shared with Candidate)"
      - "GET /background-checks/{id}, GET /candidates/{id}/eeo-record"

  - name: PayrollOperator
    description: "Executes referral-bonus payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /referral-bonuses/{id}/pay"
    shared_operations:
      - "GET /referral-bonuses, GET /referral-bonuses/{id}"

  - name: PlatformAdmin
    description: "System administrator — provisions users, creates diversity goals, drives the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /recruiters, POST /hiring-managers, POST /interviewers"
      - "POST /diversity-goals, POST /diversity-goals/{id}/lock"
      - "POST /_clock/advance, POST /_events/emit"
    shared_operations:
      - "GET on every resource"
