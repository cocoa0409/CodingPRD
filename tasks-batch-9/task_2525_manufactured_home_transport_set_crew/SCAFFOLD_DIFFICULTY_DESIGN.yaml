            - "after trigger step 2: EscortCrew.${esc_id}.reserved_minutes == 0"
            - "after trigger step 2: EscortCrew.${esc_id}.status == AVAILABLE"
            - "after trigger step 3: EscortCrew.${esc_id}.reserved_minutes == 480"
            - "after trigger step 4: EscortCrew.${esc_id}.reserved_minutes == 0"
            - "after trigger step 4: EscortCrew.${esc_id}.status == AVAILABLE"
            - "EscortAssignment.${assign1_id}.status == RELEASED"
            - "EscortAssignment.${assign2_id}.status == RELEASED"
            - "EscortAssignment.${assign1_id}.reserved_minutes == 480 (the frozen per-assignment value is NOT zeroed by release)"

      - name: chargeback_ledger_and_holds_restored_after_claim_reversal
        grounds:
          - calculations.party_chargeback_ledger
          - calculations.damage_claim_allocation
          - state_machines.DamageClaim.ADJUDICATED_to_REVERSED
          - state_machines.RouteLeg.HAULER_HOLD_to_SCHEDULED
          - calculations.order_posture
        distinguishing_aspect: |
          A five-field, four-entity compensation rather than a single counter: reversing
          one adjudication must unwind the plant balance, the hauler balance, the
          installer balance, both party statuses, the leg hold AND the order posture in
          one shot. The claim is opened at exactly CLAIM_CAP_CENTS (2500000), which is
          accepted, and the 10 percent approval haircut plus a 1/1/0 evidence split
          makes every restored value non-trivially large before the reversal.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one ACTIVE Hauler, one SetCrew, a single-section AZ order with a released 168 in section, its permit and one SCHEDULED leg"
            - "a damage claim for exactly 2500000 cents with evidence points plant 1, hauler 1, installer 0, taken UNDER_REVIEW"
            - "the claim is adjudicated on the EVIDENCE basis, which approves 2250000 and charges plant 1125000 and hauler 1125000, suspending the hauler, putting the plant on probation, holding the leg and blocking the order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/haulers"
              payload: { name: "Desert Toter", dot_number: "DOT-771004", insurance_expiry_date: "2027-01-31", endorsed_states: ["AZ"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /installations/sections/${sec_id}/measure"
              payload: { measured_width_in: 168, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
            - call: "POST /installations/sections/${sec_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_v: $.data.version }
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_id}", state_code: "AZ", planned_leg_count: 1, expected_section_version: "${sec_v}", night_move: false }
              as: PermitDesk
              captures: { permit_id: $.data.id }
            - call: "POST /installations/route-legs"
              payload: { permit_id: "${permit_id}", hauler_id: "${hauler_id}", sequence_no: 1, corridor_id: "AZ-I10", state_code: "AZ", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z" }
              as: PermitDesk
              captures: { leg_id: $.data.id }
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${order_id}", section_id: "${sec_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "IN_TRANSIT", claimed_amount_cents: 2500000, blocks_set: false, plant_evidence_points: 1, hauler_evidence_points: 1, installer_evidence_points: 0 }
              as: ClaimsAdjuster
              captures: { claim_id: $.data.id }
            - call: "POST /installations/damage-claims/${claim_id}/review"
              payload: { notes: "photos from both ends of the haul" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claim_id}/adjudicate"
              payload: { allocation_basis: "EVIDENCE" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /installations/damage-claims/${claim_id}/reverse"
              payload: { reason_code: "NEW_EVIDENCE" }
              as: ClaimsAdjuster
          assert:
            - "before trigger: DamageClaim.${claim_id}.status == ADJUDICATED"
            - "before trigger: DamageClaim.${claim_id}.approved_amount_cents == 2250000"
            - "before trigger: DamageClaim.${claim_id}.plant_charge_cents == 1125000"
            - "before trigger: DamageClaim.${claim_id}.hauler_charge_cents == 1125000"
            - "before trigger: DamageClaim.${claim_id}.installer_charge_cents == 0"
            - "before trigger: Plant.${plant_id}.chargeback_balance_cents == 1125000 and Plant.${plant_id}.status == PROBATION"
            - "before trigger: Hauler.${hauler_id}.chargeback_balance_cents == 1125000 and Hauler.${hauler_id}.status == SUSPENDED"
            - "before trigger: SetCrew.${crew_id}.chargeback_balance_cents == 0"
            - "before trigger: RouteLeg.${leg_id}.status == HAULER_HOLD"
            - "before trigger: InstallationOrder.${order_id}.posture == TRANSPORT_BLOCKED"
            - "after trigger: DamageClaim.${claim_id}.status == REVERSED"
            - "after trigger: DamageClaim.${claim_id}.plant_charge_cents == 0"
            - "after trigger: DamageClaim.${claim_id}.hauler_charge_cents == 0"
            - "after trigger: DamageClaim.${claim_id}.installer_charge_cents == 0"
            - "after trigger: Plant.${plant_id}.chargeback_balance_cents == 0 and Plant.${plant_id}.status == ACTIVE"
            - "after trigger: Hauler.${hauler_id}.chargeback_balance_cents == 0 and Hauler.${hauler_id}.status == ACTIVE"
            - "after trigger: SetCrew.${crew_id}.chargeback_balance_cents == 0"
            - "after trigger: RouteLeg.${leg_id}.status == SCHEDULED"
            - "after trigger: InstallationOrder.${order_id}.posture != TRANSPORT_BLOCKED"
