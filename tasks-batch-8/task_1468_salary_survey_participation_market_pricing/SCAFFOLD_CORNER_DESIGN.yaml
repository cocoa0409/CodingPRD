            # Survey 1: ACCEPTED
            - { call: "POST /vendors/${vendor_id}/surveys", payload: { survey_code: "S1", edition_year: 2026, data_effective_date: "2026-01-01", submission_deadline: "2026-12-31", industry_cut_supported: ["ALL_INDUSTRIES"] }, as: VendorAdmin, captures: { survey1: $.data.id } }
