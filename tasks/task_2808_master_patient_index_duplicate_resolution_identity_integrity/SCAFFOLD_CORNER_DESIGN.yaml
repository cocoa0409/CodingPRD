        grounds:
          - endpoints[POST /mpi/fraud-investigations/{id}/refer]
          - state_machines.FraudInvestigation
          - entities.RegistrationSite.fields.flagged_record_count
        distinguishing_aspect: "Referral is a terminal book-keeping step that never releases the hold: the record stays FRAUD_CONFIRMED and the site's flagged_record_count stays 1 after the investigation reaches REFERRED_LAW_ENFORCEMENT."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite EF-SITE with one PatientRecord EF-1000."
            - "One MANUAL FraudInvestigation is opened on that record and substantiated, so the record is FRAUD_CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "EF-SITE", name: "Referral Clinic", region_code: "US-AR", registrar_headcount: 2 }
              as: MpiAdmin
