      - name: insufficient_stems_at_available_boundary
        grounds:
          - calculations.stem_availability
          - validations[priority=60]
          - errors[ERR_INSUFFICIENT_STEMS]
        distinguishing_aspect: |
          Count metric on POST /allocations: reserving available+1 (11 > 10) returns ERR_INSUFFICIENT_STEMS,
