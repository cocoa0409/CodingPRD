            - { call: "POST /spd/trays/${v1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 1 }] }, as: SpdTechnician, as_user_id: "${ta}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/technicians/${ta}", as: Any, captures: { s30: "$.data.competency_score" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/technicians/${ta}", as: Any, captures: { s45: "$.data.competency_score" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-31T00:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/technicians/${ta}", as: Any, captures: { s91: "$.data.competency_score", s91l: "$.data.competency_score_lifetime" } }
          assert:
            - "s30 == 98 (age exactly 30d: weight 1.0, boundary inclusive of tier 1)"
            - "s45 == 99 (age 45d: weight 0.5 -> 100 - 1.0)"
            - "s91 == 100 (age 91d: outside the 90d rolling window) while s91l == 98 (lifetime never forgets)"

