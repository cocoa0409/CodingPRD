          - state_machines.CreditLine
          - state_machines.InventoryUnit
          - state_machines.FundingAdvance
        distinguishing_aspect: "One chain observes all four declared initial states in order: Dealer PROSPECT, CreditLine PENDING, InventoryUnit REGISTERED on the funding dimension with NOT_RECEIVED on the independent title dimension, and FundingAdvance REQUESTED."
