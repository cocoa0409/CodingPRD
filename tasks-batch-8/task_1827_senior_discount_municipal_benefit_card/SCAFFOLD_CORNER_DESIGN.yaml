            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { st_before: $.data.status } }
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2027-06-02T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { st_after: $.data.status } }
          assert:
            - "st_before == ACTIVE (one second before the window)"
            - "st_after == RECERTIFICATION_DUE (boundary inclusive at due_date - 60 days)"

      - name: merchant_month_reimbursed_reconciles_with_clock_month
        claim_type: derived_field_reconciliation
        grounds: [entities.Merchant.fields.current_month_reimbursed_cents, calculations.fund_available]
        distinguishing_aspect: "The derived counter tracks the APPROVAL month: approving a 150-cent claim at clock 2026-09-01 makes current_month_reimbursed_cents == 150; advancing the clock to 2026-10-01 recomputes the window and it reads 0."
        test_recipe:
          setup: ["cardholder onboarded; merchant rate 50 with GROCERY offer; three August transactions (discount 100 each); fund FY2026 allocated 10000; clock 2026-09-01; claim SUBMITTED (final will be 150)"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Month Mia", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "63 Month St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
