          assert:
            - "409 ERR_GRADING_RESULT_MISSING"
            - "GET /grain-inspection/inspection-requests/${req} -> grading_status == SAMPLED (unchanged)"
            - "GET /grain-inspection/inspection-requests/${req}/certificates -> total_count 0"
            - "GET /grain-inspection/applicants/${app} -> charges_total_cents == 0 (no fee was assessed for the refused issuance)"
            - "A WEIGHT certificate on the same request -> 422 ERR_SERVICE_NOT_REQUESTED: WEIGHING is absent from requested_services, and the priority-7 referential rule outranks the priority-9 state rule"

      - name: revoked_license_is_terminal_and_rejects_reinstatement
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Inspector.license_status"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
          - "endpoints[POST /grain-inspection/inspectors/{id}/reinstate]"
        distinguishing_aspect: "REVOKED is a declared terminal state, so reinstate, activate and suspend must all be refused from it with ERR_INVALID_STATE_TRANSITION — unlike SUSPENDED, from which reinstatement is legal."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; a DESIGNATED area with one inspector who has 24 training hours, was activated, then SUSPENDED and finally REVOKED (SUSPENDED is the only state from which revocation is declared)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1203", full_name: "R. Revoked", endorsements: ["GRADING", "SUPERVISION"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${insp}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${insp}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/inspectors/${insp}/suspend
              as: ServiceAdmin
              payload: { suspension_reason: "Falsified certificate" }
            - call: POST /grain-inspection/inspectors/${insp}/revoke
              as: ServiceAdmin
              payload: { suspension_reason: "Falsified certificate" }
          trigger:
            - call: POST /grain-inspection/inspectors/${insp}/reinstate
              as: ServiceAdmin
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "409 ERR_INVALID_STATE_TRANSITION"
            - "GET /grain-inspection/inspectors/${insp} -> license_status == REVOKED, suspension_reason == \"Falsified certificate\""
            - "POST /grain-inspection/inspectors/${insp}/activate -> 409 ERR_INVALID_STATE_TRANSITION; POST /grain-inspection/inspectors/${insp}/suspend -> 409 ERR_INVALID_STATE_TRANSITION"
            - "Using the revoked inspector on any grading, sampling or weighing call -> 409 ERR_INSPECTOR_LICENSE_INVALID"
            - "A separately SUSPENDED inspector CAN be reinstated to ACTIVE, proving only REVOKED is terminal"

      - name: second_supervise_call_on_the_same_weighing_is_rejected
        claim_type: idempotency
        grounds:
