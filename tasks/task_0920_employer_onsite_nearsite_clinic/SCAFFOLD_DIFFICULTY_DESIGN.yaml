  - rule_id: non_linear_state_machine
    instances:

      - name: visit_encounter_and_disclosure_axes_advance_independently
        grounds:
          - state_machines.Visit.COMPLETED_to_AMENDED
          - state_machines.Visit.RELEASE_PENDING_to_FITNESS_RELEASED
          - entities.Visit.fields.encounter_status
          - entities.Visit.fields.disclosure_status
        distinguishing_aspect: |
          Non-linear shape on the Visit entity, of the PARALLEL-dimension kind: encounter_status moves
          COMPLETED -> AMENDED while disclosure_status stays RELEASE_PENDING, and a later release moves
          disclosure_status to FITNESS_RELEASED while encounter_status stays AMENDED - neither axis
          constrains the other's position.
        test_recipe:
          setup:
            - "Participant with authorization GRANTED and one OCC_HEALTH visit COMPLETED with fitness_conclusion FIT_FOR_DUTY, so the disclosure axis sits at RELEASE_PENDING."
            - "No reporting period exists, so the freeze rung cannot fire."
