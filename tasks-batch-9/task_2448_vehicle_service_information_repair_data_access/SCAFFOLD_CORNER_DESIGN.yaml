              as: ContentPublisher
              as_user_id: "cp_1"
              captures: { pub_id: $.data.id, pub_v1: $.data.version }
            - call: "POST /publications/${pub_id}/versions"
              payload: { source_tsb_ref: "TSB-0001", expected_publication_version: "${pub_v1}" }
