            - "trigger[1] returns 409 ERR_TARIFF_EFFECTIVE_CONFLICT"
            - "trigger[2] returns 409 ERR_TARIFF_EFFECTIVE_CONFLICT"
            - "TariffVersion.${tv_old}.status == DRAFT and published_at == null"
            - "TariffVersion.${tv_tie}.status == DRAFT and published_at == null"
            - "TariffVersion.${tv1}.status == PUBLISHED"
            - "TariffVersion.${tv1}.superseded_by_tariff_version_id == null"

      - name: state_before_window_priority_covered_by_difficulty
        claim_type: Priority Ordering
        grounds:
          - validations[priority=9]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: state_check_beats_dispute_window_on_resolved_notice
          rationale: "That instance violates the priority-9 state rule and the priority-13 window rule with one call and asserts the priority-9 error, which is exactly this claim."

      - name: sod_before_referential_priority_covered_by_difficulty
        claim_type: Priority conflict
        grounds:
          - validations[priority=11]
          - validations[priority=17]
        excluded_because:
          difficulty_instance: sod_check_beats_partial_outcome_referential_check
          rationale: "A single resolve call that is both a segregation-of-duties violation and a malformed PARTIAL outcome is already shown to return the priority-11 error there."

      - name: calibration_cross_entity_validation_covered_by_difficulty
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=10]
          - errors.ERR_DEVICE_OUT_OF_CALIBRATION
        excluded_because:
          difficulty_instance: capture_blocked_by_out_of_calibration_terminal
          rationale: "Both legs of the cross-entity rule are covered there: the capture succeeds while the terminal is CALIBRATED and is refused once its capture counter pushes it OUT_OF_CALIBRATION."

