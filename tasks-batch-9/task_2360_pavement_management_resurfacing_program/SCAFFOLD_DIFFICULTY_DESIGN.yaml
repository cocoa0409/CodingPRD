        grounds: ["calculations.scenario_funding_conservation", "state_machines.ResurfacingProject.delivery_status.BID_READY_to_AWARDED", "state_machines.ResurfacingProject.delivery_status.AWARDED_to_BID_READY", "entities.BudgetScenario.fields.committed_cents", "entities.BudgetScenario.fields.uncommitted_cents"]
        distinguishing_aspect: "Awarding 11,817,655 cents then cancelling the award returns committed_cents to exactly 0 and uncommitted_cents to exactly 20,000,000 — the stored award_amount_cents is subtracted rather than a recomputed estimate, so funding_cents == committed_cents + uncommitted_cents holds at every step with zero drift, while the scenario's version advances twice and never rewinds."
