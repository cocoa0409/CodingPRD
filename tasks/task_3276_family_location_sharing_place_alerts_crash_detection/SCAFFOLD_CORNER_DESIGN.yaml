        claim_type: ViolationToError
        grounds:
          - errors.ERR_PLACE_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / place_geofence_overlap_area_threshold
          rationale: "Asserted as the failure path of the named §1.8 instance (rejected at d=250 m, accepted at d=500 m)."

      - name: err_consent_not_granted_on_fix_post
        claim_type: ViolationToError
        grounds:
          - errors.ERR_CONSENT_NOT_GRANTED
          - validations[priority=7]
        distinguishing_aspect: "Posting a fix as a PENDING-consent member is rejected 409 ERR_CONSENT_NOT_GRANTED."
        test_recipe:
          setup: ["Circle with a PENDING-consent adult member."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "P", birthdate: "1990-01-01T00:00:00Z", email: "p@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { mid: $.data.id }
          trigger:
            - call: "POST /api/circles/${cid}/members/${mid}/fixes"
              payload: { recorded_at: "2026-09-01T00:00:30Z", lat: 37.7, lng: -122.4, accuracy_m: 20, speed_mps: 0.0, battery_pct: 90, phone_in_use: false, motion_context: "STILL" }
              as: Member
              as_user_id: "${mid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_CONSENT_NOT_GRANTED"

      - name: err_minor_consent_locked_for_admin_revoke
        claim_type: ViolationToError
        grounds:
          - errors.ERR_MINOR_CONSENT_LOCKED
          - validations[priority=8]
        distinguishing_aspect: "An ADMIN's attempt to revoke a GRANTED MINOR's consent is rejected 403 ERR_MINOR_CONSENT_LOCKED (state allows revoke; the safety rule blocks the actor class)."
        test_recipe:
          setup: ["Circle with a GRANTED MINOR and an ADMIN."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "K2", birthdate: "2012-01-01T00:00:00Z", email: "k2@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { kid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${kid}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Owner
              as_user_id: "${oid}"
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "Adm", birthdate: "1985-01-01T00:00:00Z", email: "adm@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { aid: $.data.id }
            - call: "POST /api/circles/${cid}/members/${aid}/consent/grant"
              payload: { scope: "FULL", monetization_opt_in: false }
              as: Member
              as_user_id: "${aid}"
            - call: "POST /api/circles/${cid}/members/${aid}/promote"
              payload: {}
              as: Owner
              as_user_id: "${oid}"
          trigger:
            - call: "POST /api/circles/${cid}/members/${kid}/consent/revoke"
              payload: {}
              as: Admin
              as_user_id: "${aid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_MINOR_CONSENT_LOCKED"

      - name: err_privacy_self_only_for_hidden_lift
        claim_type: ViolationToError
        grounds:
          - errors.ERR_PRIVACY_SELF_ONLY
          - validations[priority=9]
        distinguishing_aspect: "An OWNER attempting to lift another member's HIDDEN -> PRECISE is rejected 403 ERR_PRIVACY_SELF_ONLY."
        test_recipe:
          setup: ["Circle; an adult member has set themselves HIDDEN."]
          setup_api_calls:
            - *clock_set
            - *circle_create
            - call: "POST /api/circles/${cid}/members"
              payload: { display_name: "H", birthdate: "1990-01-01T00:00:00Z", email: "h@example.com" }
              as: Owner
              as_user_id: "${oid}"
              captures: { hid: $.data.id }
