# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every grounds ref resolves into SCAFFOLD.yaml. 9 rules x >= 2 instances = 18.
# All formula-derived assert literals were computed by code, not estimated.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: freight_cost_quoted_vs_audited_diverge_on_shipment
        grounds:
          - calculations.freight_cost_quoted
          - calculations.freight_cost_audited
          - calculations.accessorial_charge
          - entities.Shipment.fields.quoted_cost_cents
          - entities.Shipment.fields.audited_cost_cents
        distinguishing_aspect: |
          Same shipment, two valid freight costings on the Shipment domain:
          quoted uses a flat ACCESSORIAL_ESTIMATE_CENTS=5000 reserve (91250),
          audited prices the invoice's ACTUAL accessorial codes (97750); the two
          differ by 6500 cents for identical linehaul inputs.
        test_recipe:
          setup:
            - "Carrier A (TL, ACTIVE); ContractRate A base_rate 250 c/mi, min 50000, fuel 0.15, window [0,1000]."
            - "Order Z1->Z2 weight 10000, declared 200000; Shipment mode TL distance 300 weight 6000 eta 500."
            - "Shipment tendered at minute 100, tender accepted -> BOOKED with quoted_cost_cents=91250."
            - "Shipment consolidated, dispatched, departed, delivered at minute 400 (on time)."
            - "FreightInvoice recorded: invoiced_linehaul_cents 86250, accessorial codes [DETENTION,REWEIGH]."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
              captures: { rate_a_id: $.data.id }
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship_id}", expected_load_version: "${load_v}" }
              as: DockOps
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load_id}", dock_door: "D1", start_minute: 200, end_minute: 260 }
              as: DockOps
            - call: "POST /tms/loads/${load_id}/dispatch"
              payload: {}
              as: DockOps
            - call: "POST /tms/shipments/${ship_id}/depart"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/shipments/${ship_id}/deliver"
              payload: { delivered_minute: 400 }
              as: CarrierOps
            - call: "POST /tms/freight-invoices"
              payload: { shipment_id: "${ship_id}", invoiced_linehaul_cents: 86250, invoiced_accessorial_codes: ["DETENTION","REWEIGH"] }
              as: FreightAuditor
              captures: { invoice_id: $.data.id }
          trigger:
            - call: "POST /tms/freight-invoices/${invoice_id}/audit"
              payload: {}
              as: FreightAuditor
          assert:
            - "Shipment.${ship_id}.quoted_cost_cents == 91250"
            - "Shipment.${ship_id}.audited_cost_cents == 97750"
            - "FreightInvoice.${invoice_id}.variance_cents == 0"
            - "Shipment.${ship_id}.audited_cost_cents != Shipment.${ship_id}.quoted_cost_cents"

      - name: claim_settlement_overage_vs_standard_diverge_on_claim
        grounds:
          - calculations.claim_settlement
          - state_machines.Claim.OPEN_to_APPROVED
          - entities.Claim.fields.approved_amount_cents
          - entities.Claim.fields.claim_type
        distinguishing_aspect: |
          On the Claim domain, two claims with identical claimed_amount_cents=250000
          and identical order declared_value_cents=200000 settle to different amounts:
          a DAMAGE claim caps at the declared value (200000) while an OSD_OVERAGE
          claim settles to 0 (overage is not a carrier liability).
        test_recipe:
          setup:
            - "A delivered shipment exists (carrier A, order declared 200000) — same happy-path spine."
            - "Two OPEN claims on that shipment: one DAMAGE claimed 250000, one OSD_OVERAGE claimed 250000."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship_id}", expected_load_version: "${load_v}" }
              as: DockOps
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load_id}", dock_door: "D1", start_minute: 200, end_minute: 260 }
              as: DockOps
            - call: "POST /tms/loads/${load_id}/dispatch"
              payload: {}
              as: DockOps
            - call: "POST /tms/shipments/${ship_id}/depart"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/shipments/${ship_id}/deliver"
              payload: { delivered_minute: 400 }
              as: CarrierOps
            - call: "POST /tms/claims"
              payload: { shipment_id: "${ship_id}", claim_type: "DAMAGE", claimed_amount_cents: 250000 }
              as: ShipperOps
              captures: { claim_damage_id: $.data.id }
            - call: "POST /tms/claims"
              payload: { shipment_id: "${ship_id}", claim_type: "OSD_OVERAGE", claimed_amount_cents: 250000 }
              as: ShipperOps
              captures: { claim_overage_id: $.data.id }
          trigger:
            - call: "POST /tms/claims/${claim_damage_id}/approve"
              payload: {}
              as: FreightAuditor
            - call: "POST /tms/claims/${claim_overage_id}/approve"
              payload: {}
              as: FreightAuditor
          assert:
            - "Claim.${claim_damage_id}.approved_amount_cents == 200000"
            - "Claim.${claim_overage_id}.approved_amount_cents == 0"
            - "Claim.${claim_damage_id}.approved_amount_cents != Claim.${claim_overage_id}.approved_amount_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rate_shop_lowest_cost_with_ontime_tiebreak_mode_a
        grounds:
          - calculations.rate_shop_selection
          - entities.Tender.fields.offered_rate_cents
          - entities.Tender.fields.carrier_id
          - entities.Carrier.fields.on_time_pct
        distinguishing_aspect: |
          MODE (a) non-linear interaction: priced_cents = max(base*miles,min) + round_half_up(linehaul*fuel)
          over >=3 inputs with a nested max floor, then a conditional ranking
          (lowest priced_cents, then HIGHER on_time_pct, then earliest created_at).
          Carrier A prices 86250 vs Carrier B 96000, so A is selected by cost.
        test_recipe:
          setup:
            - "Carrier A (TL) rate base 250/min 50000/fuel 0.15 -> priced 86250 on a 300mi shipment."
            - "Carrier B (TL) rate base 200/min 80000/fuel 0.20 -> priced 96000 on the same shipment."
            - "Order Z1->Z2, Shipment TL distance 300 weight 6000."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/carriers"
              payload: { name: "Best TL", scac: "BEST", mode: "TL" }
              as: CarrierOps
              captures: { carrier_b_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
              captures: { rate_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_b_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 200, min_charge_cents: 80000, fuel_surcharge_pct: 0.20, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
              captures: { rate_b_id: $.data.id }
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id, picked_carrier: $.data.carrier_id, picked_rate: $.data.offered_rate_cents }
          assert:
            - "Tender.${tender_id}.carrier_id == ${carrier_a_id}"
            - "Tender.${tender_id}.contract_rate_id == ${rate_a_id}"
            - "Tender.${tender_id}.offered_rate_cents == 86250"

      - name: quoted_cost_min_charge_floor_before_fuel_mode_b
        grounds:
          - calculations.freight_cost_quoted
          - entities.Shipment.fields.quoted_cost_cents
          - state_machines.Tender.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          MODE (b) nested-rounding/order-matters: the min-charge floor is applied
          to linehaul BEFORE fuel. With base 100 c/mi over 100 mi (raw 10000),
          min_charge 25000, fuel 0.125: floor-then-fuel = 25000 + 3125 = 28125
          (+5000 reserve = 33125), whereas fuel-then-floor would give 25000. The
          scaffold pins floor-then-fuel.
        test_recipe:
          setup:
            - "Single ACTIVE carrier+rate: base 100 c/mi, min_charge 25000, fuel 0.125, window [0,1000]."
            - "Order Z1->Z2, Shipment TL distance 100 weight 4000; tender accepted -> BOOKED."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Floor TL", scac: "FLOR", mode: "TL" }
              as: CarrierOps
              captures: { carrier_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 100, min_charge_cents: 25000, fuel_surcharge_pct: 0.125, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
              captures: { rate_id: $.data.id }
            - call: "POST /tms/orders"
              payload: { customer_ref: "C2", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 8000, declared_value_cents: 50000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 100, weight_lbs: 4000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
          trigger:
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
          assert:
            - "Tender.${tender_id}.offered_rate_cents == 28125"
            - "Shipment.${ship_id}.quoted_cost_cents == 33125"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_parallel_tender_and_execution_dimensions
        grounds:
          - state_machines.Shipment
          - entities.Shipment.fields.tender_status
          - entities.Shipment.fields.execution_status
        distinguishing_aspect: |
          The Shipment carries two independent state axes: tender_status
          (UNTENDERED|TENDERED|BOOKED) and execution_status (PENDING|IN_TRANSIT|
          DELIVERED|CANCELLED). Tendering then booking advances tender_status to
          BOOKED while execution_status stays PENDING — the dimensions evolve
          independently until cancellation/departure.
        test_recipe:
          setup:
            - "Carrier+rate ACTIVE; order + shipment created (UNTENDERED/PENDING)."
            - "Tender created (TENDERED/PENDING) then accepted (BOOKED/PENDING)."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
          trigger:
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
          assert:
            - "Shipment.${ship_id}.tender_status == BOOKED"
            - "Shipment.${ship_id}.execution_status == PENDING"

      - name: tender_branch_with_revert_offered_to_untendered
        grounds:
          - state_machines.Tender.OFFERED_to_DECLINED
          - state_machines.Shipment.tender_status=TENDERED_to_tender_status=UNTENDERED
          - entities.Tender.fields.status
        distinguishing_aspect: |
          On the Tender entity, OFFERED branches to {ACCEPTED, DECLINED, EXPIRED}
          with divergent side-effects; the DECLINED branch reverts the linked
          Shipment.tender_status TENDERED -> UNTENDERED (a cycle back to the
          re-tenderable state), distinct from the linear forward-only ACCEPTED
          branch.
        test_recipe:
          setup:
            - "Carrier+rate ACTIVE; shipment tendered (Tender OFFERED, Shipment TENDERED)."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
          trigger:
            - call: "POST /tms/tenders/${tender_id}/decline"
              payload: {}
              as: CarrierOps
          assert:
            - "Tender.${tender_id}.status == DECLINED"
            - "Shipment.${ship_id}.tender_status == UNTENDERED"
            - "Shipment.${ship_id}.assigned_carrier_id == null"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: shipment_cancel_cascade_depth3_tender_decline_reverts_status
        grounds:
          - state_machines.Shipment.execution_status=PENDING_to_execution_status=CANCELLED
          - state_machines.Tender.OFFERED_to_DECLINED
          - state_machines.Shipment.tender_status=TENDERED_to_tender_status=UNTENDERED
          - calculations.load_consolidation
        distinguishing_aspect: |
          Depth-3 chain from the Shipment cancel trigger: (1) cancel sets
          execution_status=CANCELLED and fires the OFFERED Tender's DECLINED
          transition; (2) the Tender DECLINED transition's OWN side-effect
          reverts Shipment.tender_status TENDERED -> UNTENDERED; this is caused
          by hop 1, not by the cancel directly. Distinct trigger from the
          deliver cascade below.
        test_recipe:
          setup:
            - "Shipment tendered (Tender OFFERED, Shipment TENDERED/PENDING), not yet booked."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
          trigger:
            - call: "POST /tms/shipments/${ship_id}/cancel"
              payload: {}
              as: ShipperOps
          assert:
            - "Shipment.${ship_id}.execution_status == CANCELLED"
            - "Tender.${tender_id}.status == DECLINED"
            - "Shipment.${ship_id}.tender_status == UNTENDERED"

      - name: shipment_deliver_cascade_depth2_carrier_counters_to_scorecard
        grounds:
          - state_machines.Shipment.execution_status=IN_TRANSIT_to_execution_status=DELIVERED
          - calculations.carrier_scorecard
          - entities.Carrier.fields.delivered_count
          - entities.Carrier.fields.scorecard_grade
          - state_machines.Order.PLANNED_to_CLOSED
        distinguishing_aspect: |
          Depth-2 chain from the Shipment deliver trigger: (1) deliver bumps
          Carrier.delivered_count and on_time_count; (2) those counter changes
          force recomputation of Carrier.on_time_pct and scorecard_grade
          (derived fields) — caused by hop 1. Distinct trigger (deliver) from
          the cancel cascade above. The order also bubbles PLANNED -> CLOSED.
        test_recipe:
          setup:
            - "Single delivered-eligible shipment booked on carrier A, on a DISPATCHED load, departed."
            - "Carrier A starts delivered_count=0, on_time_count=0, scorecard PROBATION."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship_id}", expected_load_version: "${load_v}" }
              as: DockOps
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load_id}", dock_door: "D1", start_minute: 200, end_minute: 260 }
              as: DockOps
            - call: "POST /tms/loads/${load_id}/dispatch"
              payload: {}
              as: DockOps
            - call: "POST /tms/shipments/${ship_id}/depart"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /tms/shipments/${ship_id}/deliver"
