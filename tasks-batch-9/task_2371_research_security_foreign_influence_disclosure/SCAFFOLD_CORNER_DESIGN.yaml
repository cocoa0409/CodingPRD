            - "the successful create did not change Investigator.committed_effort_pct, which stays 25.00"

      - name: designation_write_with_a_stale_organization_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.organization-designate-stale-org
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "A designation write is an unconditional overwrite with no state precondition, so OCC is the only thing standing between a stale client and silently reverting someone else's ownership edit — and the version that matters is the organization's own, which an ownership write on that same row advances."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; organizations ORG_A (own NONE) and ORG_B (own NONE); ORG_A read at version 1, then given ORG_B as a 60.00% parent."
