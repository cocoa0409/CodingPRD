  - name: monthly_cap_at_exact_boundary
    grounds:
    - calculations.voucher_monthly_issuance_cap
    - errors[ERR_MONTHLY_CAP_EXCEEDED]
    distinguishing_aspect: 'Fiscal threshold: cumulative face value exactly == 30000 is admitted

      (rejection requires strict >), and the next 1-cent voucher is

