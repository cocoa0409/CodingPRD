      - name: anesthesia_aggregate_ceiling_and_adjacency
        grounds:
          - calculations.anesthesia_overlap_load
          - validations.priority_29_ERR_ANESTHESIA_CONCURRENCY_EXCEEDED
          - entities.Clinician.fields.max_overlapping_rooms
          - entities.AnesthesiaCoverage.fields.overlap_index
        distinguishing_aspect: |
          Aggregate multi-resource geometry rather than pairwise single-room geometry: each of three
          coverage intervals is individually legal and only their collective peak load of 3 breaches
          max_overlapping_rooms 2, the sweep spans several EndoscopySession rows at once, a coverage
          starting exactly when the others end adds no load, and releasing one row immediately frees
          capacity for the previously rejected one.
        test_recipe:
