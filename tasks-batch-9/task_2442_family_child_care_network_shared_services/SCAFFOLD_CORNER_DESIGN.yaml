              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-06-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-06", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cla: $.data.id }
            - call: "POST /fccn/subsidy-claims/${cla}/submit"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-claims/${cla}/advance"
              as: FiscalOfficer
            - call: "POST /fccn/subsidy-claims/${cla}/reconcile"
              as: FiscalOfficer
              captures: { fin_a: $.data.final_amount_cents }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: NetworkAdmin
              captures: { cv2: $.data.version }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-07", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv2}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { clb: $.data.id }
            - call: "POST /fccn/subsidy-claims/${clb}/submit"
              as: Provider
              as_user_id: "${p1}"
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: NetworkAdmin
              captures: { cv3: $.data.version }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv3}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { clc: $.data.id }
            - call: "POST /fccn/compliance-reviews"
