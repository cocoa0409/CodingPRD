        constraints: "enum: {PRODUCTION_SHORTFALL, EQUIPMENT_DEFECT}"
      - name: claimed_window_start
        type: datetime
        source: input
        description: "Start (inclusive) of the 12-month production window a PRODUCTION_SHORTFALL claim measures. Ignored for EQUIPMENT_DEFECT."
      - name: claimed_window_end
        type: datetime
        source: input
        description: "End (exclusive) of the production window; must be strictly after start."
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state (cyclic: can loop INFO_REQUESTED -> SUBMITTED)."
        default: SUBMITTED
        constraints: "enum: {SUBMITTED, INFO_REQUESTED, APPROVED, DENIED, REMEDIATED}"
