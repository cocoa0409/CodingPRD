  - section: cross_cutting_layers
    instances:
      - name: stale_cycle_version_on_second_publish
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[cutpoint-publish-stale-cycle]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Publishing set S1 advances the cycle version; a second publish carrying the pre-publish expected_rating_cycle_version fails with 412 ERR_STALE_VERSION and S2 stays DRAFT."
        test_recipe:
          setup: ["Cycle in CUTPOINT_REVIEW (version captured); DRAFT sets S1 and S2 each with one row for the ACTIVE measure"]
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
