  # =========================================================================
  # Rule 7 — cross-entity state dependencies
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: capture_blocked_by_out_of_calibration_terminal
        grounds:
          - validations[priority=10]
          - entities.Terminal.fields.dimensioner_status
          - entities.Terminal.fields.captures_since_calibration
          - errors.ERR_DEVICE_OUT_OF_CALIBRATION
          - endpoints[POST /ltl/capture-events].side_effects
        distinguishing_aspect: |
          A capture on shipment B is refused with ERR_DEVICE_OUT_OF_CALIBRATION purely because of
          the state of a THIRD entity — the Terminal, whose captures_since_calibration reached its
          calibration_interval_captures of 1 on shipment A. The same payload against a shipment
          tendered at a still-CALIBRATED terminal succeeds, proving the block is terminal state and
          not shipment state.
