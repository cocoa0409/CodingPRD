              payload: { pay_period_start: "2026-03-01", pay_period_end: "2026-03-31", pay_date: "2026-04-03", total_deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { rem2_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem2_id}/remittance-lines"
              payload: { enrollment_id: "${enr_id}", gross_wages_cents: 8000000, deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { line2_id: "$.data.id" }
            - call: "POST /payroll-remittances/${rem2_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /payroll-remittances/${rem2_id}/post"
              payload: { posting_reference: "PR-2026-0002" }
              as: Recordkeeper
          assert:
            - "PayrollRemittance.${rem2_id}.status == POSTED"
            - "PayrollRemittance.${rem2_id}.total_allocated_cents == 400000"
            - "PayrollRemittance.${rem2_id}.total_excess_cents == 100000"
            - "PayrollRemittance.${rem2_id}.line_count == 1"
            - "RemittanceLine.${line2_id}.status == POSTED"
            - "RemittanceLine.${line2_id}.allocated_cents == 400000"
            - "RemittanceLine.${line2_id}.excess_cents == 100000"
            - "RemittanceLine.${line2_id}.expected_deduction_cents == 400000"
            - "ParticipantAccount.${acct_id}.balance_cents == 850000"
            - "ParticipantAccount.${acct_id}.contribution_basis_cents == 800000"
            - "ParticipantAccount.${acct_id}.ytd_contribution_cents == 800000"
            - "ParticipantAccount.${acct_id}.remaining_headroom_cents == 0"
            - "ParticipantAccount.${acct_id}.uncorrected_excess_cents == 100000"
            - "ParticipantAccount.${acct_id}.posture == RESTRICTED"
            - "GET /participant-accounts/${acct_id}/excess-contribution-cases returns total_count == 1"
            - "the returned ExcessContributionCase has status == DETECTED"
            - "the returned ExcessContributionCase has detected_excess_cents == 100000"
            - "the returned ExcessContributionCase has opening_fmv_cents == 450000"
            - "the returned ExcessContributionCase has period_contributions_cents == 400000"
            - "the returned ExcessContributionCase has computation_period_start == 2026-04-05"
            - "the returned ExcessContributionCase has deadline_date == 2027-04-15"
            - "Employer.${emp_id}.unremitted_deduction_cents == 0"
            - "Employer.${emp_id}.compliance_status == COMPLIANT"

  # ===========================================================================
  # RULE 5 / 9 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: closed_account_state_gate_outranks_fiscal_sufficiency_check
        grounds:
          - validations.v_account_closed
          - validations.v_insufficient_account_balance
          - state_machines.ParticipantAccount.account_status.CLOSURE_PENDING_to_CLOSED
          - errors.ERR_ACCOUNT_CLOSED
          - errors.ERR_INSUFFICIENT_ACCOUNT_BALANCE
        distinguishing_aspect: |
          Priority 20 (state gate, ERR_ACCOUNT_CLOSED, 409) versus priority 70 (fiscal
          sufficiency, ERR_INSUFFICIENT_ACCOUNT_BALANCE, 402) — a 50-point spread across two
          different categories AND two different HTTP statuses. The request violates both
          simultaneously because a CLOSED account necessarily has a zero balance, so an
          implementation that checks money before lifecycle returns 402 instead of 409.
        test_recipe:
          setup:
            - "Program year 2026; Rosa Lim enrolled and ACTIVE with a ROTH_IRA account"
            - "No remittance has ever posted, so balance_cents is 0 and posture is UNRESTRICTED"
            - "A closure request is filed and completed by the recordkeeper, so account_status is CLOSED and posture is LOCKED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 9600000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /participant-accounts"
              payload: { participant_id: "${par_id}" }
              as: ProgramAdministrator
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /participant-accounts/${acct_id}/closure-requests"
              payload: { closure_reason: "PARTICIPANT_REQUEST", residual_disposition: "CASH_DISTRIBUTION" }
              as: Participant
              as_user_id: "${par_id}"
            - call: "POST /participant-accounts/${acct_id}/closure-completion"
              payload: { completion_note: "Residual balance is zero; account closed at participant request" }
              as: Recordkeeper
          trigger:
            - call: "POST /portability-transfers"
              payload: { participant_id: "${par_id}", source_account_id: "${acct_id}", destination_type: "EXTERNAL_IRA", external_institution_name: "Northline Trust Company", transfer_kind: "DIRECT_ROLLOVER", amount_cents: 5000000 }
              as: Participant
              as_user_id: "${par_id}"
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_ACCOUNT_CLOSED"
            - "response data.error_id != ERR_INSUFFICIENT_ACCOUNT_BALANCE"
            - "response data.error_id != ERR_ACCOUNT_RESTRICTED"
            - "GET /portability-transfers with participant_id ${par_id} returns total_count == 0"
            - "ParticipantAccount.${acct_id}.account_status == CLOSED"
            - "ParticipantAccount.${acct_id}.balance_cents == 0"
            - "ParticipantAccount.${acct_id}.posture == LOCKED"

      - name: enforcement_hold_outranks_exemption_coverage_window_temporal_check
        grounds:
          - validations.v_enforcement_hold
          - validations.v_exemption_window_closed
          - errors.ERR_ENFORCEMENT_HOLD
          - errors.ERR_EXEMPTION_WINDOW_CLOSED
          - entities.EnforcementReferral.fields.status
        distinguishing_aspect: |
          Priority 45 (enforcement hold, ERR_ENFORCEMENT_HOLD) versus priority 58 (temporal
          window, ERR_EXEMPTION_WINDOW_CLOSED) — a narrow 13-point spread inside the
          same 409 status class, so the two errors are indistinguishable by HTTP code and only
          the ordering rule separates them. The filing is doubly invalid: the employer has an OPEN
          enforcement referral AND the claimed plan's three-year coverage period ended
          2024-01-01, long before the 2026-07-01 clock.
        test_recipe:
          setup:
            - "Ridge Composites (120 employees, WAVE_1, deadline 2026-06-30) carries an AFFIRMED FAILURE_TO_ENROLL assessment raised by officer-a and affirmed by officer-b"
            - "A 401K exemption certification approved by admin-reviewer-1 was revoked by officer-c at clock 2026-07-01, which cascaded the employer to registration_status PENDING_REGISTRATION, compliance_status REFERRED, and opened one EnforcementReferral in status OPEN"
            - "The referral has not been withdrawn, so the enforcement hold is live"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "77-8889990", legal_name: "Ridge Composites Corp", worksite_state: "CA", employee_count: 120 }
              as: ProgramAdministrator
              captures: { emp3_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp3_id}/penalty-assessments"
              payload: { violation_type: "FAILURE_TO_ENROLL", notice_date: "2025-10-01", cure_days: 30 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pen0_id: "$.data.id" }
            - call: "POST /penalty-assessments/${pen0_id}/disposition"
              payload: { disposition: "AFFIRM", disposition_note: "Employer did not respond to notice" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /employers/${emp3_id}/exemption-certifications"
              payload: { qualified_plan_type: "401K", plan_sponsor_ein: "77-8889990", plan_effective_date: "2026-01-01", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp3_id}"
              captures: { cert_id: "$.data.id" }
            - call: "POST /exemption-certifications/${cert_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Plan documents verified" }
              as: ProgramAdministrator
              as_user_id: "admin-reviewer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /exemption-certifications/${cert_id}/revoke"
              payload: { revocation_reason: "Qualified plan terminated retroactively to 2026-01-01" }
              as: ComplianceOfficer
              as_user_id: "officer-c"
          trigger:
            - call: "POST /employers/${emp3_id}/exemption-certifications"
              payload: { qualified_plan_type: "403B", plan_sponsor_ein: "77-8889990", plan_effective_date: "2021-01-01", attestation_accepted: true }
              as: Employer
              as_user_id: "${emp3_id}"
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_ENFORCEMENT_HOLD"
            - "response data.error_id != ERR_EXEMPTION_WINDOW_CLOSED"
            - "GET /employers/${emp3_id}/exemption-certifications returns total_count == 1"
            - "the single returned ExemptionCertification has status == REVOKED"
            - "Employer.${emp3_id}.registration_status == PENDING_REGISTRATION"
            - "Employer.${emp3_id}.compliance_status == REFERRED"

  # ===========================================================================
  # RULE 6 / 9 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: employee_count_five_versus_four_flips_wave_coverage
        grounds:
          - calculations.employer_coverage_tier
          - entities.Employer.fields.wave_tier
          - entities.Employer.fields.registration_deadline
          - entities.Employer.fields.registration_status
        distinguishing_aspect: |
          The lowest coverage threshold, tested at exactly the mandate floor and one employee
          below it: 5 employees is covered (WAVE_3, deadline 2027-06-30, registration_status
          PENDING_REGISTRATION) while 4 employees falls out of the mandate entirely
          (wave_tier NOT_COVERED, registration_deadline null, registration_status EXEMPT_SMALL).
          A strict ">" comparison against 5, or a "< 5" test that swallows the boundary, moves
          the 5-employee firm out of the mandate and silently drops its deadline.
        test_recipe:
          setup:
            - "Program year 2026 exists so registration deadlines can be resolved"
            - "No employers exist yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
          trigger:
            - call: "POST /employers"
              payload: { ein: "31-0000005", legal_name: "Five Person Bindery", worksite_state: "CA", employee_count: 5 }
              as: ProgramAdministrator
              captures: { emp_at_id: "$.data.id" }
            - call: "POST /employers"
              payload: { ein: "31-0000004", legal_name: "Four Person Bindery", worksite_state: "CA", employee_count: 4 }
              as: ProgramAdministrator
              captures: { emp_below_id: "$.data.id" }
          assert:
            - "Employer.${emp_at_id}.employee_count == 5"
            - "Employer.${emp_at_id}.wave_tier == WAVE_3"
            - "Employer.${emp_at_id}.registration_deadline == 2027-06-30"
            - "Employer.${emp_at_id}.registration_status == PENDING_REGISTRATION"
            - "Employer.${emp_at_id}.compliance_status == COMPLIANT"
            - "Employer.${emp_below_id}.employee_count == 4"
            - "Employer.${emp_below_id}.wave_tier == NOT_COVERED"
            - "Employer.${emp_below_id}.registration_deadline == null"
            - "Employer.${emp_below_id}.registration_status == EXEMPT_SMALL"
            - "Employer.${emp_at_id}.wave_tier != Employer.${emp_below_id}.wave_tier"

      - name: default_fund_target_year_inclusive_at_participant_retirement_year
        grounds:
          - calculations.default_investment_option_selection
          - entities.InvestmentOption.fields.target_year
          - entities.InvestmentOption.fields.default_eligible
          - entities.InvestmentElection.fields.selection_basis
          - endpoints[POST /_ops/auto-enrollment-run]
        distinguishing_aspect: |
          The inclusive comparison target_year >= retirement_year is probed from both sides at the
          SAME fund: Tomas retires in 2040 and TDF2040 qualifies on equality, while Rosa retires
          in 2045 and that identical TDF2040 is disqualified by one year, forcing her into the
          capital-preservation fallback. The menu is also seeded with a lower-expense
          CAPITAL_PRESERVATION fund and a matching TDF2045 that are both default_eligible: false,
          so any implementation that ignores the eligibility flag or that picks the cheapest fund
          overall selects STABLE1 or TDF2045 instead of MMKT01.
