          assert:
            - "Agency.${ag_a}.designated_passthrough_ytd == 92750.00"
            - "AllocationRequest.${req_id}.composite_score == 87.98"
            - "AllocationRequest.${req_id}.base_award == 175960.00"
            - "AllocationRequest.${req_id}.designation_offset == 61586.00"
            - "AllocationRequest.${req_id}.strategic_supplement == 3431.22"
            - "AllocationRequest.${req_id}.total_award == 117805.22"
            - "AllocationRequest.${req_id}.total_award != 115517.74 (the value produced by keying SUPPLEMENT_RATE on base_award instead of net_after_offset)"
            - "AllocationRequest.${req_id}.status == AWARDED"
            - "AllocationRequest.${req_id}.outcome_report_due_date == 2027-01-28"
            - "AllocationCycle.${cyc_id}.awarded_total == 117805.22"
            - "AllocationCycle.${cyc_id}.available_undesignated_pool == 382194.78"

  - rule_id: non_linear_state_machine
    instances:
      - name: pledge_designation_and_collection_axes_evolve_independently
        grounds:
          - state_machines.Pledge.CONFIRMED_to_AMENDED
          - state_machines.Pledge.PENDING_to_PARTIAL
          - state_machines.Pledge.PARTIAL_to_COLLECTED
          - state_machines.PledgeDesignation.ACTIVE_to_SUPERSEDED
          - entities.Pledge.fields.designation_status
          - entities.Pledge.fields.collection_status
          - entities.Pledge.fields.amend_count
          - concurrency_rules[designation-amend-stale-pledge]
        distinguishing_aspect: |
          Non-linear shape = PARALLEL state dimensions on the Pledge entity: designation_status
          (DRAFT/CONFIRMED/AMENDED/LOCKED) and collection_status (PENDING/PARTIAL/COLLECTED/
          WRITTEN_OFF) advance on the same row without either constraining the other's position -
          the amend moves the designation axis CONFIRMED -> AMENDED while collection_status stays
          PARTIAL at 400.00, and the second remittance moves the collection axis PARTIAL ->
          COLLECTED while designation_status stays AMENDED. The entity is Pledge, distinct from
          the OutcomeReport cycle instance.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency (certified review scoring 100.00) usable as a designation target."
            - "One ACTIVE employer and one OPEN campaign."
            - "One CONFIRMED PAYROLL_DEDUCTION pledge of gross_amount 1000.00 with a single ACTIVE designation line of 200.00 to that agency (processing_fee 14.50, net_designated_amount 185.50)."
            - "One remittance of 400.00 already recorded, so collection_status is PARTIAL and the ACTIVE line's collected_designated_amount is 74.20."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Cedar Valley Foods", employee_count: 900, payroll_periods_per_year: 26, historical_shrinkage_rate_bps: 700 }
              as: UnitedFundAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /fundraising/employers/${emp_id}/activate"
              payload: {}
              as: UnitedFundAdmin
