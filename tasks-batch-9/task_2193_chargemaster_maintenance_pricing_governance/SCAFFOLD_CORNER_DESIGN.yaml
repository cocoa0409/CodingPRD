            - "${f2_status} == DISMISSED"
            - "${e_hold} == ERR_DEPARTMENT_CAPTURE_HOLD with HTTP 409"
            - "${e_hold_new} == ERR_DEPARTMENT_CAPTURE_HOLD with HTTP 409 (the hold also blocks new batches for CC-100)"
            - "${e_recovery} == ERR_RECOVERY_LINE_INVALID with HTTP 422 (line l2 resolves to the trigger item, not to expected_charge_item_id)"
            - "${f1_resolved} == RESOLVED"
            - "MissingChargeFinding.${f1}.recovery_captured_charge_id == ${l3}"
            - "Department.${dept}.unresolved_finding_amount_cents == 0"
            - "Department.${dept}.recovered_charge_cents == 900000"
            - "Department.${dept}.capture_hold == false"
            - "${batch_closed} == CLOSED"
            - "ChargeCaptureBatch.${batch}.open_finding_count == 0"
            - "ChargeCaptureBatch.${batch}.total_expected_charge_cents == 1170000"
            - "ChargeCaptureBatch.${batch}.total_posted_charge_cents == 1170000"
      - name: facility_frozen_masks_the_item_price_frozen_check_while_restricted_only_gates_coded_creation
        claim_type: priority_conflict
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - validations[priority=50]
          - entities.Facility.chargemaster_posture
          - state_machines.TransparencyFile.status
        distinguishing_aspect: "ERR_ITEM_PRICE_FROZEN (priority 50) is structurally masked: an item can only be PRICE_FROZEN while a TransparencyFile is BUILDING or VALIDATED, and both of those force chargemaster_posture FROZEN, so reprice always fails earlier with ERR_FACILITY_FROZEN (14). After PUBLISH the item thaws and reprice succeeds; a MAPPING code update cycle then makes the posture RESTRICTED, which blocks CPT item creation with ERR_FACILITY_RESTRICTED (15) but leaves reprice working."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001, revenue code 0300, department CC-100, COST_PLUS_MARKUP rule with the default tiers."
            - "ACTIVE item CDM-1001 at version 5, gross 240000, PRICED_CURRENT."
            - "ComplianceOfficer builds a transparency file with the observed Facility.version, so the posture is FROZEN before the first trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "APPROVE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "POST /chargemaster/charge-items/${item}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: PricingCommitteeApprover
              as_user_id: "pca_1"
            - call: "GET /chargemaster/facilities/${fac}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { fv: $.data.version }
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac}", file_format: "JSON", expected_facility_version: "${fv}" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { file: $.data.id, file_status: $.data.status, included: $.data.included_item_count }
          trigger:
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_frozen1: $.data.error_id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1002", description: "CARDIAC CATH COMPLEX", code_type: "CPT", code_value: "93460", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { e_frozen2: $.data.error_id }
            - call: "POST /chargemaster/transparency-files/${file}/lifecycle"
              payload: { action: "VALIDATE" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { validated: $.data.status }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { e_frozen3: $.data.error_id }
            - call: "POST /chargemaster/transparency-files/${file}/lifecycle"
              payload: { action: "PUBLISH" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { published: $.data.status }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { gross_thawed: $.data.gross_charge_cents, price_thawed: $.data.price_status }
            - call: "POST /chargemaster/code-update-cycles"
              payload: { facility_id: "${fac}", cycle_year: 2027, code_set: "CPT" }
              as: RevenueIntegrityAnalyst
              captures: { cycle: $.data.id }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/entries"
              payload: { action: "REVISE", old_code_value: "93458", new_code_value: "93458A" }
              as: RevenueIntegrityAnalyst
              captures: { entry: $.data.id }
            - call: "POST /chargemaster/code-update-cycles/${cycle}/lifecycle"
              payload: { action: "START_MAPPING" }
              as: RevenueIntegrityAnalyst
              captures: { cycle_state: $.data.status }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1003", description: "CARDIAC CATH ADD ON", code_type: "CPT", code_value: "93461", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { e_restricted: $.data.error_id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { gross_restricted: $.data.gross_charge_cents }
          assert:
            - "${file_status} == BUILDING and ${included} == 1"
            - "Facility.${fac}.chargemaster_posture == FROZEN immediately after the build"
            - "${e_frozen1} == ERR_FACILITY_FROZEN with HTTP 409"
            - "${e_frozen2} == ERR_FACILITY_FROZEN with HTTP 409 (priority 14 fires before the RESTRICTED check at 15)"
            - "${validated} == VALIDATED and ChargeItem.${item}.price_status == PRICE_FROZEN"
            - "${e_frozen3} == ERR_FACILITY_FROZEN with HTTP 409, NOT ERR_ITEM_PRICE_FROZEN — priority 14 masks priority 50 for every reachable state"
            - "${published} == PUBLISHED and ChargeItem.${item}.price_status == PRICED_CURRENT"
            - "TransparencyFile.${file}.status == SUPERSEDED at the end (the reprice of an ACTIVE item supersedes the published file)"
            - "Facility.${fac}.published_transparency_file_id == null at the end"
            - "Facility.${fac}.transparency_status == NEEDS_REFRESH at the end"
            - "${gross_thawed} == 240000 and ${price_thawed} == PRICED_CURRENT"
            - "${cycle_state} == MAPPING and Facility.${fac}.chargemaster_posture == RESTRICTED"
            - "${e_restricted} == ERR_FACILITY_RESTRICTED with HTTP 409"
            - "${gross_restricted} == 240000 (reprice is gated by FROZEN only, not by RESTRICTED)"
            - "listing charge items for facility ${fac} returns total_count 1"

      - name: pagination_bounds_reject_limit_zero_and_limit_101_and_accept_the_inclusive_ends
