# =============================================================================
# §1.9 Scaffold Corner Design — task_2612_guitar_factory_operations
#
# Breadth probe. One block per section of references/claim-extraction-guide.md
# (Entities / State Machines / Calculations / Validations / Endpoints / Errors /
# RBAC / Cross-Cutting Complexity Layers / Consistency Model); `claim_type`
# values are taken from that guide's per-section rows and nothing else.
#
# Same seven-point contract as §1.8: every `grounds` entry resolves into
# SCAFFOLD.yaml §1.1–§1.7, every `setup_api_calls` entry is a structured call
# on a §1.5 endpoint with a role from that endpoint's `roles` list, every
# `${var}` is bound by an earlier `captures:` in the same instance, and every
# formula-derived assert is a pre-computed literal.
#
# Corners already asserted by a §1.8 instance are emitted as
# `excluded_because:` stubs with no test_recipe.
#
# The logical clock starts at 2026-08-01T00:00:00Z. The literal
# 00000000-0000-4000-8000-000000000000 is used everywhere a deliberately
# non-existent row id is required.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_storage_room_returns_201_with_the_declared_envelope
        claim_type: creation
        grounds: ["entities.StorageRoom", "endpoints.POST_/storage-rooms", "response_envelope.success"]
        distinguishing_aspect: "POST /storage-rooms with every required field returns 201 inside the declared envelope: meta.api_request_id and meta.api_request_timestamp are present, response_type is \"object\", and data carries the six input fields plus the system defaults climate_status IN_SPEC and occupied_slots 0."
        test_recipe:
          setup: "Empty database, logical clock pinned."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
          trigger: "POST /storage-rooms with room_code DRY-1, room_type DRY_STORE, target_rh_pct 45.0, rh_tolerance_pct 3.0, target_temp_c 21.0 and capacity_slots 20 as PlantAdmin"
          assert:
            http_status: 201
            response_type: "object"
            meta_api_request_id_present: true
            meta_api_request_timestamp_present: true
            room_code: "DRY-1"
            room_type: "DRY_STORE"
            target_rh_pct: 45.0
            target_temp_c: 21.0
            capacity_slots: 20
            climate_status: "IN_SPEC"
            occupied_slots: 0
            latest_rh_pct: null
            out_of_spec_since: null
            note: "id, created_at, updated_at and version are all present because StorageRoom declares common_fields: true. The error envelope is never used on a 201: data has no error_id key."

      - name: get_tonewood_lot_returns_the_stored_row
        claim_type: retrieval
        grounds: ["entities.TonewoodLot", "endpoints.GET_/tonewood-lots/{lot_id}"]
        distinguishing_aspect: "GET /tonewood-lots/{lot_id} echoes exactly what POST stored — lot_code LOT-001, species_code SITKA_SPRUCE, board_feet_received 100.00 — plus the server-derived moisture_at_receipt_pct 12.0 and permit_status NOT_REQUIRED, with no field silently renamed or dropped."
        test_recipe:
          setup: "One SITKA_SPRUCE lot of 100.00 board feet received at 12.0% moisture into DRY-1."
          setup_api_calls: &lot_received
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
          trigger: "GET /tonewood-lots/${lot1} as Machinist"
          assert:
            http_status: 200
            response_type: "object"
            lot_code: "LOT-001"
            species_code: "SITKA_SPRUCE"
            cites_appendix: "NONE"
            board_feet_received: 100.00
            moisture_content_pct: 12.0
            moisture_at_receipt_pct: 12.0
            permit_status: "NOT_REQUIRED"
            status: "RECEIVED"
            storage_room_id: "${dry1}"
            note: "Every staff role may read; the read does not mutate the row (version is unchanged from the POST response)."

      - name: list_tonewood_lots_filtered_by_species_with_pagination
        claim_type: listing
        grounds: ["endpoints.GET_/tonewood-lots", "response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "Filter and page compose: with three SITKA_SPRUCE lots and one HARD_MAPLE lot, GET /tonewood-lots?species_code=SITKA_SPRUCE&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true — total_count counts the FILTERED set, not the table, and has_more is derived from offset + returned < total_count."
        test_recipe:
          setup: "Four lots in DRY-1: LOT-001, LOT-002, LOT-003 SITKA_SPRUCE and LOT-004 HARD_MAPLE."
          setup_api_calls: &four_lots
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-002", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 80.00, moisture_content_pct: 11.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot2: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-003", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 60.00, moisture_content_pct: 10.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot3: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-004", species_code: "HARD_MAPLE", cites_appendix: "NONE", board_feet_received: 40.00, moisture_content_pct: 9.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot4: "$.data.id" } }
          trigger: "GET /tonewood-lots?species_code=SITKA_SPRUCE&limit=2&offset=0 as WoodBuyer, then GET /tonewood-lots?species_code=SITKA_SPRUCE&limit=2&offset=2, then GET /tonewood-lots with no query string"
          assert:
            http_status: 200
            response_type: "array"
            page1_returned_count: 2
            page1_total_count: 3
            page1_has_more: true
            page1_limit: 2
            page1_offset: 0
            page2_returned_count: 1
            page2_total_count: 3
            page2_has_more: false
            unfiltered_total_count: 4
            unfiltered_returned_count: 4
            unfiltered_limit: 10
            note: "The unfiltered call applies the declared defaults limit 10 / offset 0, so all four rows come back in one page with has_more false. LOT-004 never appears in the filtered pages."

      - name: get_unknown_build_order_returns_build_order_not_found
        claim_type: not_found
        grounds: ["errors[ERR_BUILD_ORDER_NOT_FOUND]", "validations.priority_40", "endpoints.GET_/build-orders/{build_order_id}"]
        distinguishing_aspect: "A well-formed but non-existent path id returns 404 ERR_BUILD_ORDER_NOT_FOUND — not 200 with a null data payload and not 422 — and the error envelope carries response_type \"error\" with data.error_id and data.message."
        test_recipe:
          setup: "Empty database."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
          trigger: "GET /build-orders/00000000-0000-4000-8000-000000000000 as CustomShopCoordinator"
          assert:
            http_status: 404
            response_type: "error"
            error_id: "ERR_BUILD_ORDER_NOT_FOUND"
            message_present: true
            note: "Priority 40 (path-id resolution) runs before every business rule, so no state or role reasoning can substitute a different code here."

      - name: create_tonewood_lot_without_board_feet_received_is_refused
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations.priority_30", "endpoints.POST_/tonewood-lots"]
        distinguishing_aspect: "board_feet_received carries source: input with no default, so omitting it returns 422 ERR_INVALID_REQUEST and NO TonewoodLot row is created — the server must not substitute 0.00 and compute a zero-yield lot."
        test_recipe:
          setup: "One DRY_STORE room."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
          trigger: "POST /tonewood-lots with lot_code LOT-001, species_code SITKA_SPRUCE, cites_appendix NONE, moisture_content_pct 12.0 and storage_room_id ${dry1} — board_feet_received omitted — as WoodBuyer"
          assert:
            http_status: 422
            error_id: "ERR_INVALID_REQUEST"
            tonewood_lots_total_count_after: 0
            note: "GET /tonewood-lots afterwards returns total_count 0. The same code covers the other no-default inputs on this endpoint: lot_code, species_code, cites_appendix, moisture_content_pct, storage_room_id."

      - name: omitted_optional_plant_fields_take_their_declared_defaults
        claim_type: defaults
        grounds: ["entities.StorageRoom.rh_tolerance_pct", "entities.Station.changeover_minutes", "entities.ComponentSpec.thickness_tolerance_mm", "entities.ComponentSpec.required_room_type"]
        distinguishing_aspect: "Three separate defaults land without being sent: StorageRoom.rh_tolerance_pct 3.0, Station.changeover_minutes 30, and ComponentSpec.thickness_tolerance_mm 0.15 with required_room_type BUILD_ROOM. An implementation that stores null for an omitted optional field would report null here and would later mis-evaluate the climate band and the changeover-widened conflict window."
        test_recipe:
          setup: "Empty database, logical clock pinned."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
          trigger: "POST /stations with station_code CNC-1, station_type CNC_ROUTER and room_id ${br1} (changeover_minutes omitted) as PlantAdmin, then POST /component-specs with spec_code TOP-OM, component_type BODY_TOP, required_species_codes [SITKA_SPRUCE], min_grade AA, nominal_board_feet 6.00, target_thickness_mm 2.90, cnc_minutes 45 and hand_shape_minutes 60 (thickness_tolerance_mm and required_room_type omitted) as PlantAdmin"
          assert:
            http_status: 201
            room_rh_tolerance_pct: 3.0
            station_changeover_minutes: 30
            station_total_scheduled_minutes: 0
            station_held_minutes: 0
            spec_thickness_tolerance_mm: 0.15
            spec_required_room_type: "BUILD_ROOM"
            note: "All three defaults are observable on the creation response itself, so no follow-up read is needed."

      - name: omitted_build_order_flags_default_to_a_standard_nitro_build
        claim_type: defaults
        grounds: ["entities.BuildOrder.is_custom_shop", "entities.BuildOrder.artist_tier", "entities.BuildOrder.finish_system", "calculations.custom_shop_quote_total", "calculations.build_priority_score"]
        distinguishing_aspect: "Omitting is_custom_shop, artist_tier and finish_system yields false / NONE / NITRO, and those defaults are load-bearing on the same response: provisional_quote_total_cents is exactly the base price 300000 (no 12% custom-shop surcharge) and priority_score is 0.00 (no tier points, no custom-shop points, and days_out 92 exceeds LEAD_HORIZON_DAYS 90 so the urgency term clamps to zero)."
        test_recipe:
          setup: "Empty database, clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
          trigger: "POST /build-orders with order_code ORD-STD, model_code D28, base_price_cents 300000 and promised_date 2026-11-01T00:00:00Z as CustomShopCoordinator"
          assert:
            http_status: 201
            is_custom_shop: false
            artist_tier: "NONE"
            finish_system: "NITRO"
            build_stage: "DRAFT"
            commercial_status: "QUOTED"
            provisional_quote_total_cents: 300000
            binding_quote_total_cents: null
            priority_score: 0.00
            deposit_paid_cents: 0
            deposit_held_cents: 0
            cites_permit_required: false
            strictest_cites_appendix: "NONE"
            note: "binding_quote_total_cents stays null until lock-options: the BINDING variant is not defined over an unlocked order. 300000 + 0 surcharge - 0 discount = 300000."

      - name: lot_creation_computes_the_receipt_projection_and_a_zeroed_ledger
        claim_type: computed_fields
        grounds: ["calculations.tonewood_lot_yield", "calculations.lot_board_feet_ledger", "entities.TonewoodLot.nominal_yield_board_feet"]
        distinguishing_aspect: "At creation the two yield figures diverge immediately: nominal_yield_board_feet is 97.90 (100.00 discounted by shrink_bp(12.0) = 180 and NOMINAL_KERF_BP 30) while actual_yield_board_feet is 0.00 because the replay set of Billet rows is empty. An implementation that seeds actual from nominal reports 97.90 twice; one that leaves actual null breaks invariant I1's first reconciliation."
        test_recipe:
          setup: "One DRY_STORE room, nothing else."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
          trigger: "POST /tonewood-lots with lot_code LOT-001, species_code SITKA_SPRUCE, cites_appendix NONE, board_feet_received 100.00, moisture_content_pct 12.0 and storage_room_id ${dry1} as WoodBuyer"
          assert:
            http_status: 201
            nominal_yield_board_feet: 97.90
            actual_yield_board_feet: 0.00
            board_feet_available: 100.00
            board_feet_cut: 0.00
            board_feet_unassigned: 0.00
            board_feet_reserved: 0.00
            board_feet_consumed: 0.00
            board_feet_scrapped: 0.00
            board_feet_kerf_loss: 0.00
            note: "Invariant I1 at creation: 100.00 = 100.00 + 0 + 0 + 0 + 0 + 0."

      - name: lot_system_fields_are_server_minted_and_version_advances_per_write
        claim_type: system_fields
        grounds: ["entities.TonewoodLot.status", "entities.TonewoodLot.permit_status", "entities.TonewoodLot.moisture_at_receipt_pct", "concurrency_rules.billet-cut-stale-tonewood-lot"]
        distinguishing_aspect: "status, permit_status and moisture_at_receipt_pct are source: system — the client never sends them and they are RECEIVED / NOT_REQUIRED / 12.0 after creation — and the common field version strictly increases on each subsequent write (creation, moisture reading, condition, release are four distinct writes), which is exactly what the OCC rules later compare against."
        test_recipe:
          setup: "One SITKA_SPRUCE lot received at 12.0% moisture."
          setup_api_calls: *lot_received
          trigger: "POST /tonewood-lots/${lot1}/moisture-readings with moisture_content_pct 7.0 as WoodBuyer, then POST /tonewood-lots/${lot1}/condition as WoodBuyer, then POST /tonewood-lots/${lot1}/release as WoodBuyer"
          assert:
            http_status: 200
            id_present_and_non_empty: true
            created_at_equals_logical_clock: "2026-08-01T00:00:00Z"
            moisture_at_receipt_pct_after_reading: 12.0
            moisture_content_pct_after_reading: 7.0
            status_after_release: "RELEASED"
            permit_status: "NOT_REQUIRED"
            version_strictly_increases_on_each_of_the_three_writes: true
            note: "moisture_at_receipt_pct is frozen at 12.0 even though moisture_content_pct moved to 7.0 — that immutable snapshot is what the NOMINAL_YIELD variant reads. created_at comes from the logical clock, never from wall-clock time."

      - name: unknown_species_enum_and_out_of_range_limit_are_both_refused
        claim_type: type_constraints
        grounds: ["entities.TonewoodLot.species_code", "validations.priority_30", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Two different schema violations return the same 422 ERR_INVALID_REQUEST: an enum value outside the declared six species, and a pagination limit of 101 against the declared max of 100. Both are rejected before any row is read, so neither can be reported as a 404 or a 409."
        test_recipe:
          setup: "Four lots already on file so the list endpoint has something to page."
          setup_api_calls: *four_lots
          trigger: "POST /tonewood-lots with species_code TEAK (all other fields valid, lot_code LOT-005, cites_appendix NONE, board_feet_received 50.00, moisture_content_pct 10.0, storage_room_id ${dry1}) as WoodBuyer, then GET /tonewood-lots?limit=101 as WoodBuyer, then GET /tonewood-lots?offset=-1 as WoodBuyer"
          assert:
            enum_http_status: 422
            enum_error_id: "ERR_INVALID_REQUEST"
            limit_http_status: 422
            limit_error_id: "ERR_INVALID_REQUEST"
            offset_http_status: 422
            offset_error_id: "ERR_INVALID_REQUEST"
            tonewood_lots_total_count_after: 4
            note: "limit=100 and offset=0 are both accepted — the bounds are inclusive on the legal side."

      - name: component_spec_is_immutable_and_exposes_no_version
        claim_type: immutability
        grounds: ["entities.ComponentSpec", "entities.OptionCatalog", "endpoints.GET_/component-specs/{spec_id}"]
        distinguishing_aspect: "ComponentSpec and OptionCatalog are the only two entities declared common_fields: false: their read payloads carry no version field, §1.5 declares no PUT/PATCH/DELETE for either path, and no OCC rule in §1.2.1 names them as a parent. Engineering reference data is re-issued under a new spec_code rather than edited."
        test_recipe:
          setup: "One ComponentSpec and one OptionCatalog row."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /component-specs", payload: { spec_code: "TOP-OM", component_type: "BODY_TOP", required_species_codes: ["SITKA_SPRUCE", "EAST_INDIAN_ROSEWOOD"], min_grade: "AA", nominal_board_feet: 6.00, target_thickness_mm: 2.90, thickness_tolerance_mm: 0.10, cnc_minutes: 45, hand_shape_minutes: 60, required_room_type: "BUILD_ROOM" }, as: PlantAdmin, captures: { spec1: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "INL-VINE", option_group: "INLAY", upcharge_cents: 130000, complexity_class: "ARTISAN", lead_time_days: 45 }, as: PlantAdmin, captures: { optA: "$.data.id" } }
          trigger: "GET /component-specs/${spec1} as Machinist and GET /option-catalog/${optA} as CustomShopCoordinator"
          assert:
            http_status: 200
            spec_version_field_absent: true
            option_version_field_absent: true
            option_incompatible_option_codes: []
            option_requires_finish_system: "ANY"
            no_update_endpoint_declared_for_component_specs: true
            no_update_endpoint_declared_for_option_catalog: true
            note: "The two array/enum defaults on OptionCatalog ([] and ANY) are visible on the same read, which is why an omitted incompatible_option_codes can never be null."

      - name: create_billet_against_an_unknown_lot_returns_tonewood_lot_not_found
        claim_type: parent_relationships
        grounds: ["entities.Billet.parent", "errors[ERR_TONEWOOD_LOT_NOT_FOUND]", "validations.priority_42"]
        distinguishing_aspect: "Billet declares parent: TonewoodLot, so a body FK that resolves to nothing returns 404 ERR_TONEWOOD_LOT_NOT_FOUND at priority 42 — ahead of the priority-55 OCC comparison and the priority-80 board-feet guard, even though the request also carries a version that cannot possibly match a non-existent row."
        test_recipe:
          setup: "One RELEASED SITKA_SPRUCE lot (so a valid version literal exists to send)."
          setup_api_calls: &lot_released
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/release", payload: {}, as: WoodBuyer, captures: { lot_v1: "$.data.version" } }
          trigger: "POST /billets with billet_code BLT-001, lot_id 00000000-0000-4000-8000-000000000000, board_feet 30.00, grade AAA and expected_tonewood_lot_version ${lot_v1} as Machinist"
          assert:
            http_status: 404
            error_id: "ERR_TONEWOOD_LOT_NOT_FOUND"
            billets_total_count_after: 0
            real_lot_board_feet_available_unchanged: 100.00
            note: "The real lot is untouched: no kerf is charged and no bucket moves. Replacing the lot_id with ${lot1} makes the identical request return 201."

      - name: component_is_the_graph_junction_of_spec_billet_and_order
        claim_type: graph
        grounds: ["complexity_profile.entity_topology", "entities.Component.spec_id", "entities.Component.billet_id", "endpoints.GET_/components"]
        distinguishing_aspect: "Component is a junction row with three independent foreign keys (ComponentSpec, Billet, optional BuildOrder) and no parent declaration, so it is reachable by filtering on any one of them: GET /components?billet_id=... and GET /components?spec_id=... each return the same single row, and creating it flips the Billet to RESERVED without either aggregate owning the other."
        test_recipe:
          setup: "A CNC-routed BODY_TOP component cut from BLT-001 against spec TOP-OM, with no build order attached."
          setup_api_calls: &comp_routed
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "HS-1", station_type: "HAND_SHAPING", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { hs1: "$.data.id" } }
            - { call: "POST /component-specs", payload: { spec_code: "TOP-OM", component_type: "BODY_TOP", required_species_codes: ["SITKA_SPRUCE", "EAST_INDIAN_ROSEWOOD"], min_grade: "AA", nominal_board_feet: 6.00, target_thickness_mm: 2.90, thickness_tolerance_mm: 0.10, cnc_minutes: 45, hand_shape_minutes: 60, required_room_type: "BUILD_ROOM" }, as: PlantAdmin, captures: { spec1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/release", payload: {}, as: WoodBuyer, captures: { lot_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-001", lot_id: "${lot1}", board_feet: 30.00, grade: "AAA", expected_tonewood_lot_version: "${lot_v1}" }, as: Machinist, captures: { blt1: "$.data.id" } }
            - { call: "POST /components", payload: { spec_id: "${spec1}", billet_id: "${blt1}" }, as: Machinist, captures: { cmp1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T08:00:00Z", ends_at: "2026-08-02T09:00:00Z", component_id: "${cmp1}" }, as: Machinist, captures: { res1: "$.data.id" } }
            - { call: "POST /components/${cmp1}/route", payload: { station_reservation_id: "${res1}", measured_thickness_mm: 2.90 }, as: Machinist }
          trigger: "GET /components?billet_id=${blt1} as Machinist, then GET /components?spec_id=${spec1} as Machinist, then GET /billets/${blt1} as Machinist"
          assert:
            http_status: 200
            by_billet_total_count: 1
            by_spec_total_count: 1
            component_id_returned: "${cmp1}"
            component_build_order_id: null
            component_status: "CNC_ROUTED"
            component_measured_thickness_mm: 2.90
            billet_status: "RESERVED"
            note: "build_order_id is optional on POST /components, so the junction row is legal with only two of its three edges bound — which is what makes the route precondition on BuildOrder explicitly skippable."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_build_order_starts_in_draft_and_quoted
        claim_type: initial_state
        grounds: ["state_machines.BuildOrder.build_stage.initial_state", "state_machines.BuildOrder.commercial_status.initial_state", "complexity_profile.state_machine_shape"]
        distinguishing_aspect: "A BuildOrder is created with TWO state fields initialised at once — build_stage DRAFT and commercial_status QUOTED — because the order carries two independent (parallel) dimensions. Neither dimension may be skipped ahead at creation: an implementation that starts commercial_status at CONFIRMED because a deposit field exists, or that starts build_stage at COMPONENTS_RELEASED, fails here."
        test_recipe:
          setup: "Empty database, clock pinned."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
          trigger: "POST /build-orders with order_code ORD-STD, model_code OM45, base_price_cents 300000, promised_date 2026-11-01T00:00:00Z, is_custom_shop false, artist_tier NONE and finish_system NITRO as CustomShopCoordinator"
          assert:
            http_status: 201
            build_stage: "DRAFT"
            commercial_status: "QUOTED"
            rework_round_count: 0
            refinish_count: 0
            serial_number: null
            deposit_paid_cents: 0
            deposit_held_cents: 0
            deposit_applied_cents: 0
            deposit_refunded_cents: 0
            deposit_forfeited_cents: 0
            binding_quote_total_cents: null
            stage_before_compliance_hold: null
            note: "Only the QUOTED dimension can move first (confirm); release-components is refused from QUOTED because it requires commercial_status OPTIONS_LOCKED, which is what makes the two dimensions ordered but independent."

      - name: releasing_a_lot_that_was_never_conditioned_is_refused
        claim_type: invalid_transitions
        grounds: ["state_machines.TonewoodLot.transitions", "validations.priority_50", "errors[ERR_LOT_STATE_INVALID]"]
        distinguishing_aspect: "RELEASE is declared only from CONDITIONED. A lot sitting in RECEIVED — moisture already inside the 6.0-8.0 band would not help — is refused with 409 ERR_LOT_STATE_INVALID at priority 50, BEFORE the priority-78 moisture band is even consulted, so the response must not be ERR_MOISTURE_OUT_OF_BAND."
        test_recipe:
          setup: "One SITKA_SPRUCE lot in RECEIVED at 12.0% moisture (outside the band as well, to prove the ordering)."
          setup_api_calls: *lot_received
          trigger: "POST /tonewood-lots/${lot1}/release as WoodBuyer"
          assert:
            http_status: 409
            error_id: "ERR_LOT_STATE_INVALID"
            status_after: "RECEIVED"
            note: "Both a state check (priority 50) and a moisture check (priority 78) are violated; priority 50 wins. POST /billets against this lot would separately return ERR_LOT_NOT_RELEASED, a different code for a different caller."

      - name: conditioning_a_lot_below_the_moisture_band_is_refused
        claim_type: precondition_enforcement
        grounds: ["state_machines.TonewoodLot.transitions", "validations.priority_78", "errors[ERR_MOISTURE_OUT_OF_BAND]"]
        distinguishing_aspect: "With status KILN_DRYING the state precondition is satisfied, so the only failing guard is the moisture band: 5.9 is refused with 409 ERR_MOISTURE_OUT_OF_BAND while 6.0 — the inclusive lower bound — is accepted by the same call. The lot must be left in KILN_DRYING, not advanced or reverted."
        test_recipe:
          setup: "One SITKA_SPRUCE lot driven into KILN_DRYING with a reading of 5.9 (over-dried)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 5.9 }, as: WoodBuyer }
          trigger: "POST /tonewood-lots/${lot1}/condition as WoodBuyer, then POST /tonewood-lots/${lot1}/moisture-readings with moisture_content_pct 6.0 as WoodBuyer, then POST /tonewood-lots/${lot1}/condition as WoodBuyer again"
          assert:
            first_condition_http_status: 409
            first_condition_error_id: "ERR_MOISTURE_OUT_OF_BAND"
            status_after_first_condition: "KILN_DRYING"
            second_condition_http_status: 200
            status_after_second_condition: "CONDITIONED"
            moisture_content_pct_after: 6.0
            note: "MOISTURE_MIN_PCT is 6.0 INCLUSIVE, so the boundary value passes; the self-loop on moisture-readings from KILN_DRYING is what lets the lot be re-measured without leaving the state."

      - name: attest_permit_applies_every_declared_side_effect
        claim_type: side_effect_execution
        grounds: ["state_machines.TonewoodLot.transitions", "entities.TonewoodLot.attested_by_user_id", "endpoints.POST_/tonewood-lots/{lot_id}/attest-permit"]
        distinguishing_aspect: "One call must apply all three declared side effects at once: permit_number is stored from the body, permit_status flips PENDING -> VERIFIED, and attested_by_user_id records the ComplianceOfficer's X-User-ID (co-alice) — the field later consumed by the export-release segregation-of-duties check. Storing the permit number without stamping attested_by_user_id silently disarms that downstream check."
        test_recipe:
          setup: "One APPENDIX_II lot, which the creation fork put into PERMIT_HOLD with permit_status PENDING."
          setup_api_calls: &lot_permit_hold
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-BRW", species_code: "BRAZILIAN_ROSEWOOD", cites_appendix: "APPENDIX_II", board_feet_received: 40.00, moisture_content_pct: 7.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lotB: "$.data.id" } }
          trigger: "POST /tonewood-lots/${lotB}/attest-permit with permit_number CITES-BR-2026-0099 as ComplianceOfficer with X-User-ID co-alice"
          assert:
            http_status: 200
            status: "RECEIVED"
            permit_status: "VERIFIED"
            permit_number: "CITES-BR-2026-0099"
            attested_by_user_id: "co-alice"
            moisture_at_receipt_pct: 7.0
            note: "Before this call the lot could not be conditioned or released at all — PERMIT_HOLD is not a from-state for either. An empty-string permit_number is refused with ERR_CITES_PERMIT_MISSING rather than accepted as VERIFIED."

      - name: a_rejected_lot_refuses_every_further_transition
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.TonewoodLot.terminal_states", "errors[ERR_LOT_STATE_INVALID]", "validations.priority_50"]
        distinguishing_aspect: "REJECTED is terminal, so all four remaining lot triggers — moisture-readings, condition, release and a second reject — return 409 ERR_LOT_STATE_INVALID, and permit_status stays INVALID. A implementation that only guards the specific from-state of each transition (rather than the terminal set) typically lets the harmless-looking moisture-readings self-loop through."
        test_recipe:
          setup: "One SITKA_SPRUCE lot in RECEIVED."
          setup_api_calls: *lot_received
          trigger: "POST /tonewood-lots/${lot1}/reject with reason \"grain runout across the whole flitch\" as ComplianceOfficer, then in turn POST /tonewood-lots/${lot1}/moisture-readings with moisture_content_pct 7.0 as WoodBuyer, POST /tonewood-lots/${lot1}/condition as WoodBuyer, POST /tonewood-lots/${lot1}/release as WoodBuyer, and POST /tonewood-lots/${lot1}/reject with reason \"again\" as ComplianceOfficer"
          assert:
            reject_http_status: 200
            status_after_reject: "REJECTED"
            permit_status_after_reject: "INVALID"
            moisture_readings_http_status: 409
            moisture_readings_error_id: "ERR_LOT_STATE_INVALID"
            condition_http_status: 409
            condition_error_id: "ERR_LOT_STATE_INVALID"
            release_http_status: 409
            release_error_id: "ERR_LOT_STATE_INVALID"
            second_reject_http_status: 409
            second_reject_error_id: "ERR_LOT_STATE_INVALID"
            moisture_content_pct_unchanged: 12.0
            note: "The reject cascade over Billet / Component / BuildOrder resolves over empty sets here and must not error — that empty-closure boundary is the point of rejecting a lot that has never been cut."

      - name: a_second_cancel_on_a_cancelled_order_is_refused
        claim_type: idempotency
        grounds: ["state_machines.BuildOrder.commercial_status.terminal_states", "errors[ERR_COMMERCIAL_STATUS_INVALID]", "calculations.cancellation_deposit_disposition"]
        distinguishing_aspect: "Cancel is NOT idempotent: the first call moves commercial_status QUOTED -> CANCELLED and build_stage DRAFT -> SCRAPPED, the second returns 409 ERR_COMMERCIAL_STATUS_INVALID. Because nothing was ever deposited, the compensating waterfall must move zero money — a second cancel that re-ran the waterfall would either double-count a forfeit or reset deposit_forfeited_cents."
        test_recipe:
          setup: "One un-confirmed order (commercial_status QUOTED, deposit_paid_cents 0)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /build-orders", payload: { order_code: "ORD-STD", model_code: "OM45", base_price_cents: 300000, promised_date: "2026-11-01T00:00:00Z", is_custom_shop: false, artist_tier: "NONE", finish_system: "NITRO" }, as: CustomShopCoordinator, captures: { bo1: "$.data.id" } }
          trigger: "POST /build-orders/${bo1}/cancel with reason \"customer withdrew\" as CustomShopCoordinator, then POST /build-orders/${bo1}/cancel with reason \"customer withdrew\" as CustomShopCoordinator again"
          assert:
            first_http_status: 200
            commercial_status_after_first: "CANCELLED"
            build_stage_after_first: "SCRAPPED"
            deposit_paid_cents: 0
            deposit_forfeited_cents: 0
            deposit_refunded_cents: 0
            deposit_held_cents: 0
            second_http_status: 409
            second_error_id: "ERR_COMMERCIAL_STATUS_INVALID"
            note: "forfeit = min(deposit_held_cents 0, round_half_up(300000 * 2500 / 10000) = 75000) = 0, so refund = 0 - 0 = 0 and invariant I2 reads 0 = 0 + 0 + 0 + 0 after both calls."

      - name: room_quarantine_voids_conditioning_for_conditioned_lots_only
        claim_type: conditional_cascade
        grounds: ["state_machines.StorageRoom.transitions", "state_machines.TonewoodLot.transitions", "errors[ERR_ROOM_QUARANTINED]"]
        distinguishing_aspect: "The QUARANTINED side effect is conditional on the child's state: only lots with status == CONDITIONED are pushed back to RECEIVED. The RECEIVED lot in the same room is untouched, and the voided lot keeps its stored moisture_content_pct 7.0 — the conditioning is void, not the measurement. Quarantine also fires only because the second out-of-spec reading lands exactly QUARANTINE_AFTER_HOURS (24) after out_of_spec_since, an inclusive bound."
        test_recipe:
          setup: "DRY-1 holding two lots: LOT-001 conditioned at 7.0%, LOT-002 still RECEIVED."
          setup_api_calls: &two_lots_one_conditioned
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-002", species_code: "HARD_MAPLE", cites_appendix: "NONE", board_feet_received: 60.00, moisture_content_pct: 9.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot2: "$.data.id" } }
          trigger: "POST /storage-rooms/${dry1}/climate-readings with rh_pct 60.0 and temp_c 21.0 as FinishTech, then POST /_clock/set_current_utc to 2026-08-02T00:00:00Z as PlantAdmin, then POST /storage-rooms/${dry1}/climate-readings with rh_pct 60.0 and temp_c 21.0 as FinishTech again, then POST /tonewood-lots/${lot1}/condition as WoodBuyer"
          assert:
            first_reading_climate_status: "OUT_OF_SPEC"
            first_reading_out_of_spec_since: "2026-08-01T00:00:00Z"
            second_reading_climate_status: "QUARANTINED"
            latest_rh_pct: 60.0
            latest_temp_c: 21.0
            lot1_status_after: "RECEIVED"
            lot1_moisture_content_pct_after: 7.0
            lot2_status_after: "RECEIVED"
            recondition_http_status: 409
            recondition_error_id: "ERR_ROOM_QUARANTINED"
            note: "abs(60.0 - 45.0) = 15.0 > rh_tolerance_pct 3.0 on both readings; the second is 24 hours after out_of_spec_since so the >= 24 bound is met exactly. Re-conditioning is then blocked by the room, not by the lot's own state."

      - name: repair_shop_authorization_cycle_closes
        claim_type: cyclic
        grounds: ["state_machines.RepairShop.transitions", "entities.RepairShop.authorization_level", "complexity_profile.state_machine_shape"]
        distinguishing_aspect: "APPLIED -> AUTHORIZED -> SUSPENDED -> AUTHORIZED is a genuine loop, and each pass rewrites authorization_level from the request body: FULL_SERVICE, then forced to NONE by suspend, then CUSTOM_SHOP_CERTIFIED on re-authorization. The level is source: system — it must never be settable on POST /repair-shops — and suspend must zero it rather than merely flipping status."
        test_recipe:
          setup: "One repair shop application."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /repair-shops", payload: { shop_code: "SHP-1", shop_name: "Kanto Fret Works", country_code: "JP" }, as: ServiceNetworkManager, captures: { shop1: "$.data.id" } }
          trigger: "POST /repair-shops/${shop1}/authorize with authorization_level FULL_SERVICE as ServiceNetworkManager, then POST /repair-shops/${shop1}/suspend with reason \"audit finding\" as ServiceNetworkManager, then POST /repair-shops/${shop1}/authorize with authorization_level CUSTOM_SHOP_CERTIFIED as ServiceNetworkManager"
          assert:
            status_at_creation: "APPLIED"
            authorization_level_at_creation: "NONE"
            status_after_first_authorize: "AUTHORIZED"
            authorization_level_after_first_authorize: "FULL_SERVICE"
            status_after_suspend: "SUSPENDED"
            authorization_level_after_suspend: "NONE"
            status_after_second_authorize: "AUTHORIZED"
            authorization_level_after_second_authorize: "CUSTOM_SHOP_CERTIFIED"
            warranty_claim_count: 0
            note: "RepairShop declares no terminal states, so the cycle can repeat without bound; a warranty registration attempted in the SUSPENDED window is refused with ERR_SHOP_NOT_AUTHORIZED while registrations made earlier stay ACTIVE."

      - name: certifying_a_room_that_is_not_quarantined_is_refused
        claim_type: invalid_transitions
        grounds: ["state_machines.StorageRoom.transitions", "errors[ERR_ROOM_STATE_INVALID]", "validations.priority_50"]
        distinguishing_aspect: "certify is declared ONLY from QUARANTINED. It is refused with 409 ERR_ROOM_STATE_INVALID both from IN_SPEC (nothing to certify) and from OUT_OF_SPEC (recovery there is by reading, not by fiat), and the ordinary way back from OUT_OF_SPEC is a reading exactly at the tolerance edge: abs(48.0 - 45.0) = 3.0 <= 3.0 returns the room to IN_SPEC."
        test_recipe:
          setup: "One DRY_STORE room at its target humidity."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
          trigger: "POST /storage-rooms/${dry1}/certify as PlantAdmin, then POST /storage-rooms/${dry1}/climate-readings with rh_pct 60.0 and temp_c 21.0 as PlantAdmin, then POST /storage-rooms/${dry1}/certify as QualityInspector, then POST /storage-rooms/${dry1}/climate-readings with rh_pct 48.0 and temp_c 21.0 as FinishTech"
          assert:
            certify_from_in_spec_http_status: 409
            certify_from_in_spec_error_id: "ERR_ROOM_STATE_INVALID"
            climate_status_after_bad_reading: "OUT_OF_SPEC"
            certify_from_out_of_spec_http_status: 409
            certify_from_out_of_spec_error_id: "ERR_ROOM_STATE_INVALID"
            climate_status_after_good_reading: "IN_SPEC"
            out_of_spec_since_after_good_reading: null
            note: "Both PlantAdmin and QualityInspector may call certify, so the 409s are state refusals and not 403s. Readings taken while QUARANTINED would update latest_rh_pct without changing climate_status."

      - name: qc_hold_then_rework_returns_the_part_to_the_router
        claim_type: valid_transition
        grounds: ["state_machines.Component.transitions", "entities.Component.rework_count", "endpoints.POST_/components/{component_id}/disposition"]
        distinguishing_aspect: "HAND_SHAPED -> QC_HELD -> REWORK is the cyclic backbone of the machining spine: disposition REWORK increments rework_count to 1 AND clears qc_hold_reason back to NONE, and REWORK is a legal from-state for route, so the same part can re-enter the CNC cell. Leaving qc_hold_reason set at DIMENSION would permanently block the second disposition; failing to increment rework_count would defeat the MAX_COMPONENT_REWORKS (2) ceiling."
        test_recipe:
          setup: "A CNC-routed BODY_TOP component with no build order attached, plus an idle HAND_SHAPING station HS-1."
          setup_api_calls: *comp_routed
          trigger: "POST /station-reservations with station_id ${hs1}, starts_at 2026-08-02T10:00:00Z and ends_at 2026-08-02T11:00:00Z and component_id ${cmp1} as Luthier, then POST /components/${cmp1}/hand-shape citing that reservation with measured_thickness_mm 2.90 as Luthier, then POST /components/${cmp1}/qc with verdict HOLD and hold_reason DIMENSION as QualityInspector, then POST /components/${cmp1}/disposition with disposition REWORK as Luthier"
          assert:
            hand_shape_http_status: 200
            status_after_hand_shape: "HAND_SHAPED"
            status_after_qc: "QC_HELD"
            qc_hold_reason_after_qc: "DIMENSION"
            status_after_disposition: "REWORK"
            rework_count_after_disposition: 1
            qc_hold_reason_after_disposition: "NONE"
            billet_status_throughout: "RESERVED"
            hs1_consumed_minutes: 60
            hs1_held_minutes: 0
            note: "The hand-shape call consumed the HS-1 reservation (HELD -> CONSUMED, 60 minutes moving from held_minutes to consumed_minutes), so a second hand-shape after the rework needs a NEW reservation — the reservation is not recycled by the rework loop."

      - name: a_failed_inspection_pushes_the_order_back_to_setup
        claim_type: cross_entity
        grounds: ["state_machines.SetupInspection.transitions", "state_machines.BuildOrder.build_stage.transitions", "calculations.playability_deviation_score"]
        distinguishing_aspect: "Signing a MEASURED inspection whose deviation_score is 13.00 sends the SetupInspection to FAILED and, in the same request, drags a DIFFERENT entity backwards: BuildOrder.build_stage INSPECTION -> SETUP with rework_round_count 0 -> 1. The commercial dimension must NOT move, because REWORK_ESCALATION_THRESHOLD is 2 — promised_date stays 2026-11-01T00:00:00Z and commercial_status stays OPTIONS_LOCKED after the first failure."
        test_recipe:
          setup: "A standard NITRO OM45 order carried all the way to build_stage INSPECTION with one OPEN inspection round opened by luthier lu-eve."
          setup_api_calls: &order_at_inspection
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
