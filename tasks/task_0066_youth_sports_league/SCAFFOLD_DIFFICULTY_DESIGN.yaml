  - name: confirm_release_conserves_referee_day_occupancy
    grounds:
    - state_machines.RefereeAssignment.PROPOSED_to_CONFIRMED
    - state_machines.RefereeAssignment.CONFIRMED_to_RELEASED
    - entities.Referee.fields.max_games_per_day
    distinguishing_aspect: 'Different conserved quantity = referee daily-slot occupancy: count of CONFIRMED/CHECKED_IN

      assignments for a referee on a calendar day. Confirm (+1) paired with release (-1) returns

      the day-occupancy to its pre-confirm value (0 -> 1 -> 0), distinct from roster occupancy.

      '
    test_recipe:
      setup:
      - League in SEASON; one SCHEDULED game; referee assignment PROPOSED, then CONFIRMED.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
          draft_snake: true
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: X
          coach_user_id: cx
          draft_slot: 1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          tx: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: Y
          coach_user_id: cy
          draft_slot: 2
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ty: $.data.id
      - call: POST /fields
        payload:
          league_id: ${lg}
          name: Field 1
          turnover_buffer_minutes: 30
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fld: $.data.id
      - call: POST /referees
        payload:
          league_id: ${lg}
          user_id: ref-1
          full_name: Ref One
          max_games_per_day: 1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ref: $.data.id
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: EVALUATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: DRAFT
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: SEASON
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /games
        payload:
          league_id: ${lg}
          division_id: ${div}
          home_team_id: ${tx}
          away_team_id: ${ty}
          field_id: ${fld}
          start_iso: '2026-05-01T17:00:00Z'
          end_iso: '2026-05-01T19:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          g1: $.data.id
      - call: POST /assignments
        payload:
          game_id: ${g1}
          referee_id: ${ref}
          role: PLATE
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          a1: $.data.id
      - call: POST /assignments/${a1}/confirm
        payload: {}
        as: Referee
        as_user_id: ref-1
      - call: POST /games
        payload:
          league_id: ${lg}
          division_id: ${div}
          home_team_id: ${tx}
          away_team_id: ${ty}
          field_id: ${fld}
          start_iso: '2026-05-01T20:00:00Z'
          end_iso: '2026-05-01T22:00:00Z'
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          g2: $.data.id
      - call: POST /assignments
        payload:
          game_id: ${g2}
          referee_id: ${ref}
          role: PLATE
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          a2: $.data.id
      trigger:
      - call: POST /assignments/${a1}/release
        payload: {}
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /assignments/${a2}/confirm
        payload: {}
        as: Referee
        as_user_id: ref-1
      assert:
      - RefereeAssignment.${a1}.status == RELEASED (compensating -1 to day occupancy)
      - 'After release, day-occupancy back to 0, so confirming a2 succeeds: RefereeAssignment.${a2}.status == CONFIRMED (would have hit ERR_REFEREE_DAY_LIMIT if a1 still counted)'
