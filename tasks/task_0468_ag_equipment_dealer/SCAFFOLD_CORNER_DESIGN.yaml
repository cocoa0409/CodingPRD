            - call: "POST /units"
              payload: { stock_number: "S-RV-1", condition: "USED", model_code: "5095E", serial_number: "SN-RV-1", dealer_cost_cents: 4000000, list_price_cents: 5500000, engine_hours: 900 }
              as: DealerAdmin
              captures: { unit_id: $.data.id }
