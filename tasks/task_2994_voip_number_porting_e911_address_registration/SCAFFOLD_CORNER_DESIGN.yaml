              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900500", destination_country_code: "44", requested_duration_seconds: 1 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca_id: $.data.id }
          assert:
            - "CallAttempt.${ca_id}.billable_minutes == 1 and rate_cents_per_minute == 12"
            - "CallAttempt.${ca_id}.estimated_base_cents == 12, day_subtotal_cents == 12, surcharge_pct_applied == 0, projected_day_total_cents == 12"
            - "CallAttempt.${ca_id}.decision == ALLOWED"

      - name: remittance_run_voids_the_provisional_and_remits_the_full_final_amount
        claim_type: reconciliation
        grounds:
          - calculations.e911_fee_assessment
          - calculations.fee_ledger_reconciliation
          - endpoints[POST /voip/jurisdictions/{id}/remittance-runs]
          - entities.Jurisdiction.fields.last_remitted_period
        distinguishing_aspect: "A PROVISIONAL assessment anchored 2026-08-17 is prorated to 85 cents (round_half_up(175 * 15 / 31)); the September remittance run voids it and creates a FINAL assessment of the unprorated 175 cents that immediately becomes REMITTED, leaving pending_fee_cents 0, remitted_fee_cents 175 and last_remitted_period '2026-08'."
        test_recipe:
          setup:
            - "clock at 2026-08-17T00:00:00Z; PER_LINE jurisdiction at 175 cents with remit_day_of_month 5"
            - "a device holding number 2901 whose registration is created and VERIFIED at 2026-08-17T00:00:00Z, giving anchor day-of-month 17"
            - "a PROVISIONAL assessment for period 2026-08 is taken by billing-1, then the clock moves to 2026-09-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1022", billing_name: "WILLOW GMBH", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415614", total_capacity: 10, max_concurrent_reservations: 2 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "2901" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC002901", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "22 WILLOW WAY", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /voip/fee-assessments"
              payload: { account_id: "${acct_id}", jurisdiction_id: "${jur_id}", period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/jurisdictions/${jur_id}/remittance-runs"
              payload: { period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-1"
          assert:
            - "FeeAssessment.${prov_id}.variant == PROVISIONAL, billable_units == 1, unit_fee_breakdown == [85], amount_cents == 85 and status == VOIDED with voided_by_user_id == 'system:remittance'"
            - "GET /voip/fee-assessments?jurisdiction_id=${jur_id}&variant=FINAL returns exactly 1 row with amount_cents == 175, unit_fee_breakdown == [175], billable_units == 1, unit_basis == PER_LINE and status == REMITTED"
            - "that FINAL row's remitted_at == 2026-09-05T00:00:00Z"
            - "Jurisdiction.${jur_id}.pending_fee_cents == 0, remitted_fee_cents == 175, last_remitted_period == '2026-08'"
            - "Account.${acct_id}.fee_liability_cents == 175"

      - name: intl_cap_threshold_boundary_at_and_above_the_ceiling
        claim_type: threshold
        grounds:
          - calculations.international_spend_control
          - validations[priority=53]
        excluded_because:
          difficulty_instance: boundary_precision_check / intl_spend_cap_blocks_one_cent_above_ceiling_and_excludes_blocked_spend
          rationale: "The named §1.8 instance pins the at-cap, one-cent-above and blocked-attempt-exclusion cases of the same threshold."

      - name: cutover_slot_interval_merge_buffer_semantics
        claim_type: interval_merge
        grounds:
          - calculations.cutover_slot_overlap
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cutover_slot_buffer_expands_half_open_windows_and_touching_edges_are_free
          rationale: "The named §1.8 instance asserts the buffered overlap rejection and the touching-edge acceptance."

      - name: fee_assessment_provisional_versus_final_variant_delta
        claim_type: variant_divergence
        grounds:
          - calculations.e911_fee_assessment.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / fee_assessment_provisional_vs_final_variant_divergence
          rationale: "The named §1.8 instance computes both variants over identical data and asserts the cent delta."

      - name: fraud_score_realtime_versus_daily_review_variant_delta
        claim_type: variant_divergence
        grounds:
          - calculations.toll_fraud_risk_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / fraud_score_realtime_vs_daily_review_variant_divergence
          rationale: "The named §1.8 instance asserts both windows and both spread weights over the same call history."

      - name: intl_surcharge_tier_keyed_on_the_surcharge_free_subtotal
        claim_type: tiered_pricing
        grounds:
          - calculations.international_spend_control
        excluded_because:
          difficulty_instance: combinatorial_formula / intl_surcharge_tier_keyed_on_subtotal_not_projected_total
          rationale: "The named §1.8 instance pins the tier lookup to day_subtotal_cents and rejects the circular projected-total keying."

  - section: validations
    instances:
      - name: reusing_an_account_number_returns_duplicate_identifier
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - entities.Account.fields.account_number
        distinguishing_aspect: "The second POST /voip/accounts carrying an already-stored account_number is refused with ERR_DUPLICATE_IDENTIFIER (409) and no second Account row appears, even though every field is individually well formed."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one account already holding account_number ACCT1023"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1023", billing_name: "XANTHE LDA", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1023", billing_name: "XANTHE TWO LDA", service_state_code: "NV", status: "ACTIVE" }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_DUPLICATE_IDENTIFIER"
            - "GET /voip/accounts/${acct_id} still shows billing_name 'XANTHE LDA', service_state_code 'CA' and version 1"

      - name: account_admin_cannot_create_a_device_under_another_account
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - rbac.AccountAdmin
        distinguishing_aspect: "An AccountAdmin whose X-User-ID is account A's id, posting a device whose body account_id is account B, is refused with ERR_ACCOUNT_FORBIDDEN (403) at priority 3 - before the body is interpreted and regardless of both accounts existing and being ACTIVE."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; two ACTIVE accounts A and B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1024", billing_name: "YARROW AS", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acctA_id: $.data.id }
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1025", billing_name: "ZEPHYR AS", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acctB_id: $.data.id }
          trigger:
            - call: "POST /voip/devices"
              payload: { account_id: "${acctB_id}", mac_address: "AABBCC003001", device_type: "HANDSET", nomadic: false }
              as: AccountAdmin
              as_user_id: "${acctA_id}"
          assert:
            - "the trigger returns HTTP 403 with error_id ERR_ACCOUNT_FORBIDDEN"
            - "GET /voip/devices?account_id=${acctB_id} as PlatformAdmin returns total_count 0"
            - "the same body posted as PlatformAdmin succeeds with HTTP 201, proving the payload itself was valid"

      - name: role_check_outranks_port_request_existence_returns_403
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=8]
          - endpoints[POST /voip/port-requests/{id}/reject]
        distinguishing_aspect: "A BillingAdmin rejecting a port-request id that does not exist, with an empty body, gets ERR_ROLE_NOT_PERMITTED (403) from priority 2 - not the 404 from priority 8 nor the 400 from priority 4 - because the ladder stops at the first violated rule."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; empty port-request table"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/port-requests/00000000-0000-4000-8000-0000000000ff/reject"
              payload: {}
              as: BillingAdmin
              as_user_id: "billing-1"
          assert:
            - "the trigger returns HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "the response error_id is neither ERR_PORT_REQUEST_NOT_FOUND nor ERR_INVALID_REQUEST"
            - "the same call as CarrierLiaison with user liaison-1 returns HTTP 404 ERR_PORT_REQUEST_NOT_FOUND, confirming priority 8 is the next rule down"

      - name: reservation_window_of_exactly_45_days_is_accepted_and_46_is_not
        claim_type: temporal_validation
        grounds:
          - validations[priority=43]
          - calculations.reservation_interval_capacity.constants.RESERVATION_MAX_DAYS
        distinguishing_aspect: "2026-08-01T00:00:00Z to 2026-09-15T00:00:00Z is exactly 45 days and is accepted; extending the same hold by one day to 2026-09-16T00:00:00Z is refused with ERR_RESERVATION_WINDOW_INVALID (422), so RESERVATION_MAX_DAYS is inclusive."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; block 415615 with two numbers and max_concurrent_reservations 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1026", billing_name: "ASTER NV", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415615", total_capacity: 10, max_concurrent_reservations: 2 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "3101" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "3102" }
              as: NumberingAdmin
              captures: { pn2_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v1: $.data.version }
          trigger:
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-01T00:00:00Z", reserved_until: "2026-09-15T00:00:00Z", expected_number_block_version: "${blk_v1}" }
              as: NumberingAdmin
              captures: { res_ok_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v2: $.data.version }
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-01T00:00:00Z", reserved_until: "2026-09-16T00:00:00Z", expected_number_block_version: "${blk_v2}" }
              as: NumberingAdmin
          assert:
            - "the first trigger returns HTTP 201 with NumberReservation.${res_ok_id}.status == HELD and number_id == '${pn1_id}'"
            - "the second trigger returns HTTP 422 with error_id ERR_RESERVATION_WINDOW_INVALID"
            - "PhoneNumber.${pn2_id}.status is still AVAILABLE and NumberBlock.${blk_id}.reserved_count == 1"
            - "NumberBlock.${blk_id}.version equals ${blk_v2}, unchanged by the refused attempt"

      - name: remittance_run_before_the_remit_day_of_month_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=44]
          - entities.Jurisdiction.fields.remit_day_of_month
        distinguishing_aspect: "With remit_day_of_month 5, a run for the closed period 2026-08 is refused with ERR_REMITTANCE_PERIOD_NOT_CLOSED (422) while the clock reads 2026-09-04, and a run for the clock's own month 2026-09 is refused even once the day-of-month test would pass - both halves of the conjunction are required."
        test_recipe:
          setup:
            - "clock at 2026-09-04T23:00:00Z; PER_LINE jurisdiction at 175 cents with remit_day_of_month 5"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T23:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
          trigger:
            - call: "POST /voip/jurisdictions/${jur_id}/remittance-runs"
              payload: { period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/jurisdictions/${jur_id}/remittance-runs"
              payload: { period_month: "2026-09" }
              as: BillingAdmin
              as_user_id: "billing-1"
          assert:
            - "the first trigger returns HTTP 422 with error_id ERR_REMITTANCE_PERIOD_NOT_CLOSED because the clock day-of-month 4 is below remit_day_of_month 5"
            - "the third trigger returns HTTP 422 with the same error_id because period_month 2026-09 is not strictly before the clock's month"
            - "Jurisdiction.${jur_id}.last_remitted_period is still null and remitted_fee_cents == 0"

      - name: scheduling_onto_another_carriers_slot_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=30]
          - entities.CutoverSlot.fields.carrier_id
          - entities.PortRequest.fields.losing_carrier_id
        distinguishing_aspect: "The slot is OPEN and its window_start 2026-08-06T14:00:00Z is after the request's earliest_cutover_at 2026-08-05T00:00:00Z, so only the carrier identity differs: the schedule is refused with ERR_SLOT_CARRIER_MISMATCH (422) and the slot stays OPEN."
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z, a Monday; carrier A with foc_business_days 2 and carrier B"
            - "a VALIDATED port request against carrier A, and an OPEN slot belonging to carrier B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1027", billing_name: "BRYONY OY", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Bryony Legacy A", ocn: "BA15", csr_match_policy: "STRICT", porting_buffer_minutes: 30, foc_business_days: 2 }
              as: PlatformAdmin
              captures: { carA_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Bryony Legacy B", ocn: "BB16", csr_match_policy: "STRICT", porting_buffer_minutes: 30, foc_business_days: 2 }
              as: PlatformAdmin
              captures: { carB_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${carA_id}", requested_numbers: ["+14155551803"], claimed_account_number: "CSR-1027", claimed_pin: "1027", claimed_billing_name: "BRYONY OY", claimed_address_line1: "27 BRYONY CT", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id, pr_v1: $.data.version }
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-1027", pin_on_file: "1027", billing_name_on_file: "BRYONY OY", address_line1_on_file: "27 BRYONY CT", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
            - call: "POST /voip/cutover-slots"
              payload: { carrier_id: "${carB_id}", window_start: "2026-08-06T14:00:00Z", window_end: "2026-08-06T18:00:00Z" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { slotB_id: $.data.id }
          trigger:
            - call: "POST /voip/port-requests/${pr_id}/schedule"
              payload: { cutover_slot_id: "${slotB_id}" }
              as: PortingSpecialist
              as_user_id: "porting-1"
          assert:
            - "the trigger returns HTTP 422 with error_id ERR_SLOT_CARRIER_MISMATCH"
            - "PortRequest.${pr_id}.status is still VALIDATED with earliest_cutover_at == 2026-08-05T00:00:00Z"
            - "CutoverSlot.${slotB_id}.status is still OPEN with booked_port_request_id == null"

      - name: intl_flag_gates_only_non_domestic_destinations
        claim_type: conditional_validation
        grounds:
          - validations[priority=49]
          - entities.Account.fields.intl_calling_enabled
        distinguishing_aspect: "On an account with intl_calling_enabled false the same device places a domestic call to country code 1 successfully, while country code 44 is refused with ERR_INTL_CALLING_DISABLED (403) - the rule is conditional on the destination, not on the device."
        test_recipe:
          setup:
            - "clock at 2026-08-05T10:00:00Z; account with intl_calling_enabled false"
            - "one non-nomadic device holding number 3201 with a VERIFIED registration"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT1028", billing_name: "CLOVER LTD", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: false }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415616", total_capacity: 10, max_concurrent_reservations: 2 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "3201" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC003201", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "28 CLOVER ROW", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+14155559001", destination_country_code: "1", requested_duration_seconds: 300 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca_dom_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900501", destination_country_code: "44", requested_duration_seconds: 300 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the domestic trigger returns HTTP 201 with CallAttempt.${ca_dom_id}.decision == ALLOWED and decision_error_id == null"
            - "the international trigger returns HTTP 403 with error_id ERR_INTL_CALLING_DISABLED"
            - "GET /voip/devices/${dev_id}/call-attempts shows the blocked row with decision == BLOCKED_INTL and decision_error_id == 'ERR_INTL_CALLING_DISABLED'"
