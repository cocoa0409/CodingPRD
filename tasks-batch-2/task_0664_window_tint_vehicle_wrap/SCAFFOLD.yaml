scenario: |
  664. Window-Tint & Vehicle-Wrap Shop: vehicle & service (tint/PPF/wrap/ceramic) selection,
  film/material & coverage quote, bay/installer scheduling, state-legal tint % compliance &
  medical exemption, cure time & warranty, design/print (wrap) proof, fleet/commercial account,
  callback/redo
domain_name: window-tint-vehicle-wrap
api_prefix: ""

# Difficulty band: Expert (14 entities, 30 endpoints, 27 error codes, 5 calculations with 3+
# dual-variant pairs, 5 state machines including a cyclic proof loop and parallel dimensions).
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation        # ESTIMATED vs ACTUAL cure; PROVISIONAL vs SETTLED fleet credit
    - cascading_side_effects          # quote->workorder->bay/installer/fleet cascade chains
    - optimistic_concurrency          # OCC on Quote.version (line edits) and WorkOrder.version (schedule)
    - rate_threshold_triggers         # rush-fee tier breakpoints, VLT compliance boundary
  entity_topology: flat
  # Peer entities linked by foreign keys (Quote, WorkOrder, Bay, Installer, FleetAccount are peers
  # referenced by FK; only QuoteLine and WrapProof nest under a parent in the URL).
  state_machine_shape: cyclic
  # WrapProof loops PROOF_SUBMITTED -> CHANGES_REQUESTED -> PROOF_SUBMITTED (revision rounds);
  # WorkOrder carries parallel dimensions (install_status x payment_status); Quote is branching.
  relationship_patterns:
    - one_to_many        # Quote -> QuoteLine; WorkOrder -> WrapProof; FleetAccount -> WorkOrder
    - cross_aggregate    # WorkOrder references Quote, Bay, Installer, FleetAccount across aggregates
    - polymorphic        # none; left flat
  role_model: peer_roles
  # ShopManager owns scheduling/regulation config; Installer owns install execution; Customer owns
  # quotes/proof approval; FleetManager owns fleet account; ComplianceOfficer owns exemptions.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ShopLocation
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the shop branch.
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code; selects the StateTintRegulation that governs compliance for WorkOrders at this shop.
        constraints: Uppercase 2-letter; must match a StateTintRegulation.state_code on use.
      - name: status
        type: enum
        source: system
        description: Operational status of the shop.
        default: ACTIVE
        constraints: One of {ACTIVE, SUSPENDED}.

  - name: StateTintRegulation
    parent: null
    common_fields: false
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code this regulation governs.
        constraints: Uppercase 2-letter; unique across StateTintRegulation.
      - name: front_side_min_vlt_pct
        type: integer
        source: input
        description: Minimum legal Visible Light Transmission percent for FRONT_SIDE windows; a QuoteLine on a FRONT_SIDE window with requested_vlt_pct below this is illegal unless an approved MedicalExemption applies.
        constraints: 0..100.
      - name: windshield_strip_max_inches
        type: number
        source: input
        description: Maximum allowed tint strip depth (inches from top) on the WINDSHIELD; a WINDSHIELD QuoteLine whose strip_depth_inches exceeds this is illegal (no exemption overrides windshield strip limits).
        constraints: ">= 0."
      - name: medical_exemption_allowed
        type: boolean
        source: input
        description: Whether this state permits a medical exemption to lower the FRONT_SIDE VLT floor.

  - name: FilmMaterial
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Material SKU; unique across FilmMaterial.
        constraints: Unique.
      - name: category
        type: enum
        source: input
        description: Material category; constrains which ServicePackage.service_type may reference it.
        constraints: One of {TINT_FILM, PPF_FILM, WRAP_VINYL, CERAMIC_COATING}.
      - name: cure_hours
        type: integer
        source: input
        description: Hours of cure time this material requires after installation completes; drives WorkOrder cure_complete_at.
        constraints: ">= 0."
      - name: price_multiplier_bps
        type: integer
        source: input
        description: Material price multiplier in basis points (10000 = 1.00x) applied to ServicePackage.base_rate_cents in line pricing.
        constraints: ">= 0."
      - name: status
        type: enum
        source: system
        description: Catalog availability of the material.
        default: ACTIVE
        constraints: One of {ACTIVE, DISCONTINUED}.

  - name: ServicePackage
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Display name of the package.
      - name: service_type
        type: enum
        source: input
        description: Service category; must be compatible with the referenced FilmMaterial.category on a QuoteLine.
        constraints: One of {TINT, PPF, WRAP, CERAMIC}.
      - name: base_rate_cents
        type: integer
        source: input
        description: Base labor+material rate in cents before coverage factor, material multiplier, and size surcharge.
        constraints: ">= 0."
      - name: duration_minutes
        type: integer
        source: input
        description: Install bay/installer occupancy duration in minutes for a WorkOrder line of this package.
        constraints: "> 0."
      - name: cure_buffer_minutes
        type: integer
        source: input
        description: Extra minutes the BAY remains occupied AFTER duration for in-bay curing (back-buffer); 0 for services that cure off-bay.
        constraints: ">= 0."
      - name: warranty_days
        type: integer
        source: input
        description: Warranty length in days added to WorkOrder.actual_completed_at to compute warranty_expires_at.
        constraints: ">= 0."
      - name: requires_proof
        type: boolean
        source: input
        description: Whether a WrapProof approval cycle is mandatory before a WorkOrder for this package may start install.

  - name: VehicleProfile
    parent: null
    common_fields: true
    fields:
      - name: customer_user_id
        type: string
        source: input
        description: Opaque-or-customer identifier of the vehicle owner; the Customer acting on this vehicle's quotes must match this value.
      - name: vin
        type: string
        source: input
        description: Vehicle identification number; unique across VehicleProfile.
        constraints: Unique.
      - name: size_class
        type: enum
        source: input
        description: Vehicle size class selecting the size surcharge in line pricing.
        constraints: One of {SEDAN, SUV, TRUCK}.
      - name: size_surcharge_cents
        type: integer
        source: computed
        description: Flat surcharge in cents added per QuoteLine; SEDAN=0, SUV=15000, TRUCK=25000.

  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: Commercial account name.
      - name: fleet_manager_user_id
        type: string
        source: input
        description: Identifier of the FleetManager who owns this account; FleetManager actions on this account must match this value.
      - name: discount_bps
        type: integer
        source: input
        description: Volume discount in basis points applied to a Quote.subtotal_cents when the Quote is linked to this fleet account.
        constraints: 0..10000.
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum outstanding credit in cents the account may hold across open WorkOrders.
        constraints: ">= 0."
      - name: held_credit_cents
        type: integer
        source: computed
        description: PROVISIONAL conserved quantity — sum of total_due_cents over WorkOrders linked to this account whose install_status IN {SCHEDULED, IN_PROGRESS, CURING, COMPLETED}; scheduling holds, cancellation releases.
        default: 0
      - name: status
        type: enum
        source: system
        description: Account standing.
        default: ACTIVE
        constraints: One of {ACTIVE, SUSPENDED}.

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: vehicle_profile_id
        type: string
        source: input
        description: FK -> VehicleProfile.id; the vehicle this quote prices.
      - name: shop_location_id
        type: string
        source: input
        description: FK -> ShopLocation.id; the shop whose state regulation governs compliance.
      - name: fleet_account_id
        type: string
        source: input
        description: FK -> FleetAccount.id; optional commercial account whose discount_bps and credit apply.
        default: null
      - name: rushed
        type: boolean
        source: input
        description: Whether a rush fee tier is applied at finalization.
        default: false
      - name: status
        type: enum
        source: system
        description: Quote lifecycle state.
        default: DRAFT
        constraints: One of {DRAFT, PRICED, ACCEPTED, CONVERTED, EXPIRED, VOIDED}.
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of QuoteLine.line_total_cents over lines with status INCLUDED; recomputed on price.
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: Fleet discount applied sum-then-round to subtotal_cents.
        default: 0
      - name: net_cents
        type: integer
        source: computed
        description: subtotal_cents - discount_cents.
        default: 0
      - name: rush_fee_cents
        type: integer
        source: computed
        description: Rush fee derived from the net_cents tier when rushed; 0 otherwise.
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: net_cents + rush_fee_cents; the price quoted to the customer.
        default: 0
      - name: deposit_required_cents
        type: integer
        source: computed
        description: Deposit due to schedule, round(net_cents * DEPOSIT_RATE_BPS / 10000).
        default: 0

  - name: QuoteLine
    parent: Quote
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: FK -> Quote.id; the parent quote.
      - name: service_package_id
        type: string
        source: input
        description: FK -> ServicePackage.id; the service applied on this line.
      - name: film_material_id
        type: string
        source: input
        description: FK -> FilmMaterial.id; the material applied; its category must be compatible with the package service_type.
      - name: coverage
        type: enum
        source: input
        description: Coverage scope selecting the coverage factor (FULL=1.00, PARTIAL=0.60, ACCENT=0.35).
        constraints: One of {FULL, PARTIAL, ACCENT}.
      - name: window_position
        type: enum
        source: input
        description: Window or panel the line applies to; FRONT_SIDE and WINDSHIELD lines are subject to tint compliance.
        constraints: One of {FRONT_SIDE, REAR_SIDE, REAR_WINDOW, WINDSHIELD, BODY_PANEL}.
      - name: requested_vlt_pct
        type: integer
        source: input
        description: Requested Visible Light Transmission percent for the film on this window; checked against StateTintRegulation.front_side_min_vlt_pct for FRONT_SIDE lines.
        default: 100
        constraints: 0..100.
      - name: strip_depth_inches
        type: number
        source: input
        description: For WINDSHIELD lines, depth of the tint strip from the top in inches; checked against StateTintRegulation.windshield_strip_max_inches.
        default: 0
        constraints: ">= 0."
      - name: status
        type: enum
        source: system
        description: Line state; REMOVED lines are excluded from subtotal.
        default: INCLUDED
        constraints: One of {INCLUDED, REMOVED}.
      - name: line_total_cents
        type: integer
        source: computed
        description: Per-line price = round(base_rate_cents * coverage_factor * material_multiplier) + size_surcharge_cents.
        default: 0

  - name: MedicalExemption
    parent: null
    common_fields: true
    fields:
      - name: vehicle_profile_id
        type: string
        source: input
        description: FK -> VehicleProfile.id; the vehicle this exemption covers.
      - name: certificate_ref
        type: string
        source: input
        description: External medical certificate reference number.
      - name: exempt_min_vlt_pct
        type: integer
        source: input
        description: The reduced FRONT_SIDE VLT floor this exemption authorizes when APPROVED.
        constraints: 0..100.
      - name: status
        type: enum
        source: system
        description: Exemption review state; only APPROVED exemptions relax the VLT floor.
        default: PENDING
        constraints: One of {PENDING, APPROVED, REJECTED, REVOKED}.

  - name: Bay
    parent: null
    common_fields: true
    fields:
      - name: shop_location_id
        type: string
        source: input
        description: FK -> ShopLocation.id; the shop this bay belongs to.
      - name: label
        type: string
        source: input
        description: Bay label, e.g. "Bay 1".
      - name: reserved_minutes
        type: integer
        source: computed
        description: Conserved quantity — sum over WorkOrders on this bay with install_status IN {SCHEDULED, IN_PROGRESS, CURING} of (duration_minutes + cure_buffer_minutes); scheduling reserves, cancellation/completion releases.
        default: 0
      - name: status
        type: enum
        source: system
        description: Bay availability.
        default: OPEN
        constraints: One of {OPEN, CLOSED}.

  - name: Installer
    parent: null
    common_fields: true
    fields:
      - name: shop_location_id
        type: string
        source: input
        description: FK -> ShopLocation.id; the shop this installer works at.
      - name: installer_user_id
        type: string
        source: input
        description: Identifier of the Installer principal; Installer self-actions must match this value.
      - name: full_name
        type: string
        source: input
        description: Installer display name.
      - name: certified_service_types
        type: array
        source: input
        description: Service types this installer is certified to perform; a WorkOrder's package service_type must be in this set to assign the installer.
        constraints: Subset of {TINT, PPF, WRAP, CERAMIC}.
      - name: status
        type: enum
        source: system
        description: Installer availability.
        default: AVAILABLE
        constraints: One of {AVAILABLE, OFF_DUTY}.

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: FK -> Quote.id; the accepted quote this order realizes (must be ACCEPTED).
      - name: bay_id
        type: string
        source: input
        description: FK -> Bay.id; the bay reserved for this order.
      - name: installer_id
        type: string
        source: input
        description: FK -> Installer.id; the installer assigned to this order.
      - name: fleet_account_id
        type: string
        source: computed
        description: FK -> FleetAccount.id; copied from the source Quote at scheduling; null for retail orders.
        default: null
      - name: primary_service_type
        type: enum
        source: computed
        description: Service type of the order's dominant package — the service_type of the source quote's INCLUDED line with the highest line_total_cents, tie-broken by QuoteLine.created_at ASC; selects certification and proof requirements.
        constraints: One of {TINT, PPF, WRAP, CERAMIC}.
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the install slot.
      - name: duration_minutes
        type: integer
        source: computed
        description: Sum of duration_minutes over the source quote's INCLUDED lines' packages; bay/installer occupancy length.
        default: 0
      - name: cure_buffer_minutes
        type: integer
        source: computed
        description: Max cure_buffer_minutes over the source quote's INCLUDED lines' packages; back-buffer the bay stays occupied.
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: Copied from Quote.total_due_cents at scheduling; the amount held against fleet credit and later invoiced.
        default: 0
      - name: install_status
        type: enum
        source: system
        description: Install lifecycle dimension (independent of payment_status).
        default: SCHEDULED
        constraints: One of {SCHEDULED, IN_PROGRESS, CURING, COMPLETED, CANCELLED}.
      - name: payment_status
        type: enum
        source: system
        description: Payment lifecycle dimension (independent of install_status).
        default: DEPOSIT_DUE
        constraints: One of {DEPOSIT_DUE, DEPOSIT_PAID, INVOICED, SETTLED}.
      - name: actual_started_at
        type: datetime
        source: system
        description: Clock time install actually began.
        default: null
      - name: actual_completed_at
        type: datetime
        source: system
        description: Clock time install actually finished; anchors ACTUAL cure and warranty.
        default: null
      - name: cure_complete_at
        type: datetime
        source: computed
        description: ESTIMATED at scheduling (scheduled_start + duration + cure_hours), recomputed ACTUAL at completion (actual_completed_at + cure_hours).
        default: null
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: actual_completed_at + warranty_days; set at completion.
        default: null

  - name: WrapProof
    parent: WorkOrder
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: FK -> WorkOrder.id; the order this design proof belongs to.
      - name: design_ref
        type: string
        source: input
        description: External reference to the uploaded print/design file.
      - name: revision_round
        type: integer
        source: computed
        description: 1-based revision counter; increments each time a new proof is submitted after CHANGES_REQUESTED.
        default: 1
      - name: status
        type: enum
        source: system
        description: Proof review state; cyclic between PROOF_SUBMITTED and CHANGES_REQUESTED.
        default: PROOF_SUBMITTED
        constraints: One of {PROOF_SUBMITTED, CHANGES_REQUESTED, APPROVED, REJECTED}.

  - name: CallbackTicket
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: FK -> WorkOrder.id; the completed order this callback/redo concerns (must be COMPLETED and within warranty).
      - name: reason
        type: enum
        source: input
        description: Why the callback was opened.
        constraints: One of {BUBBLING, PEELING, COLOR_MISMATCH, MEASUREMENT_ERROR}.
      - name: outcome
        type: enum
        source: system
        description: Resolution; REDO triggers a free rework reservation, DENIED closes with no rework.
        default: null
        constraints: One of {REDO, DENIED} when terminal.
      - name: status
        type: enum
        source: system
        description: Ticket lifecycle.
        default: OPEN
        constraints: One of {OPEN, RESOLVED, CLOSED}.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [CONVERTED, EXPIRED, VOIDED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /quotes/{id}/price"
        actor: Customer
        preconditions:
          - "Quote.status == DRAFT"
          - "expected_quote_version matches Quote.version"
          - "at least one QuoteLine with status INCLUDED exists"
          - "every INCLUDED QuoteLine passes tint compliance (see validations priority 30/31)"
          - "every INCLUDED QuoteLine's FilmMaterial.category is compatible with its ServicePackage.service_type"
        side_effects:
          - "recompute QuoteLine.line_total_cents for every INCLUDED line (calc line_item_price)"
          - "recompute Quote.subtotal_cents, discount_cents, net_cents, rush_fee_cents, total_due_cents, deposit_required_cents (calc quote_total)"
          - "increments Quote.version by 1"
      - from: PRICED
        to: DRAFT
        trigger: "POST /quotes/{id}/lines or DELETE /quote-lines/{id} (line mutation reverts pricing)"
        actor: Customer
        preconditions:
          - "Quote.status == PRICED"
        side_effects:
          - "Quote.subtotal_cents/discount_cents/net_cents/rush_fee_cents/total_due_cents/deposit_required_cents reset to 0 (stale pricing invalidated)"
          - "increments Quote.version by 1"
        note: "Cyclic revert — editing lines on a PRICED quote sends it back to DRAFT so it must be re-priced."
      - from: PRICED
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "Quote.status == PRICED"
          - "expected_quote_version matches Quote.version"
        side_effects:
          - "increments Quote.version by 1"
      - from: ACCEPTED
        to: CONVERTED
        trigger: "system: POST /work-orders schedules this quote"
        actor: system
        preconditions:
          - "Quote.status == ACCEPTED"
        side_effects:
          - "WorkOrder created from this quote (see WorkOrder SCHEDULED transition)"
          - "increments Quote.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /quotes/{id}/void"
        actor: Customer
        preconditions:
          - "Quote.status IN {DRAFT, PRICED}"
        side_effects:
          - "increments Quote.version by 1"
      - from: PRICED
        to: VOIDED
        trigger: "POST /quotes/{id}/void"
        actor: Customer
        preconditions:
          - "Quote.status IN {DRAFT, PRICED}"
        side_effects:
          - "increments Quote.version by 1"
      - from: PRICED
        to: EXPIRED
        trigger: "system: clock advances past created_at + QUOTE_TTL_DAYS, observed on next read/price"
        actor: system
        preconditions:
          - "Quote.status == PRICED"
          - "current clock >= Quote.created_at + QUOTE_TTL_DAYS days"
        side_effects:
          - "increments Quote.version by 1"

  - entity: WorkOrder
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: Installer
        preconditions:
          - "WorkOrder.install_status == SCHEDULED"
          - "the assigned Installer (X-User-ID) equals WorkOrder.installer_id's installer_user_id"
          - "if primary_service_type ServicePackage.requires_proof, a WrapProof with status APPROVED exists for this WorkOrder"
          - "current clock >= WorkOrder.scheduled_start"
        side_effects:
          - "set WorkOrder.actual_started_at = current clock"
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: CURING
        trigger: "POST /work-orders/{id}/complete-install"
        actor: Installer
        preconditions:
          - "WorkOrder.install_status == IN_PROGRESS"
        side_effects:
          - "set WorkOrder.actual_completed_at = current clock"
          - "recompute WorkOrder.cure_complete_at using ACTUAL variant (actual_completed_at + cure_hours)"
          - "set WorkOrder.warranty_expires_at = actual_completed_at + warranty_days (calc warranty_window)"
          - "increments WorkOrder.version by 1"
        note: "Bay and Installer remain reserved through CURING (cure_buffer)."
      - from: CURING
        to: COMPLETED
        trigger: "POST /work-orders/{id}/release"
        actor: ShopManager
        preconditions:
          - "WorkOrder.install_status == CURING"
          - "current clock >= WorkOrder.cure_complete_at"
        side_effects:
          - "Bay.reserved_minutes -= (WorkOrder.duration_minutes + WorkOrder.cure_buffer_minutes) (bay capacity released; held_credit unchanged because still COMPLETED)"
          - "increments WorkOrder.version by 1"
        note: "Bay capacity is released on COMPLETED; fleet credit stays held until INVOICED."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "WorkOrder.install_status == SCHEDULED"
          - "expected_work_order_version matches WorkOrder.version"
        side_effects:
          - "Bay.reserved_minutes -= (WorkOrder.duration_minutes + WorkOrder.cure_buffer_minutes) (compensating release of reserved bay minutes)"
          - "if fleet_account_id set, FleetAccount.held_credit_cents -= WorkOrder.total_due_cents (compensating release of held credit)"
          - "source Quote.status set back to ACCEPTED (re-schedulable) and Quote.version +1"
          - "increments WorkOrder.version by 1"
        note: "Cascade origin A (depth 3): cancel WO -> Quote reverts to ACCEPTED -> on next schedule the new WorkOrder re-holds credit/minutes."
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "WorkOrder.install_status == IN_PROGRESS"
          - "expected_work_order_version matches WorkOrder.version"
        side_effects:
          - "Bay.reserved_minutes -= (WorkOrder.duration_minutes + WorkOrder.cure_buffer_minutes) (compensating release)"
          - "if fleet_account_id set, FleetAccount.held_credit_cents -= WorkOrder.total_due_cents (compensating release)"
          - "source Quote.status set back to ACCEPTED and Quote.version +1"
          - "increments WorkOrder.version by 1"

  - entity: WorkOrder_payment
    initial_state: DEPOSIT_DUE
    terminal_states: [SETTLED]
    transitions:
      - from: DEPOSIT_DUE
        to: DEPOSIT_PAID
        trigger: "POST /work-orders/{id}/pay-deposit"
        actor: Customer
        preconditions:
          - "WorkOrder.payment_status == DEPOSIT_DUE"
          - "amount_cents == source Quote.deposit_required_cents"
        side_effects:
          - "increments WorkOrder.version by 1"
        note: "Parallel dimension: payment_status evolves independently of install_status on the same WorkOrder row."
      - from: DEPOSIT_PAID
        to: INVOICED
        trigger: "POST /work-orders/{id}/invoice"
        actor: ShopManager
        preconditions:
          - "WorkOrder.payment_status == DEPOSIT_PAID"
          - "WorkOrder.install_status == COMPLETED"
        side_effects:
          - "if fleet_account_id set, FleetAccount.held_credit_cents stays held (PROVISIONAL) but invoiced amount recorded; SETTLED variant of fleet credit now counts this order"
          - "increments WorkOrder.version by 1"
        note: "Cross-dimension guard: invoice requires install_status == COMPLETED (parallel-dimension dependency)."
      - from: INVOICED
        to: SETTLED
        trigger: "POST /work-orders/{id}/settle"
        actor: ShopManager
        preconditions:
          - "WorkOrder.payment_status == INVOICED"
        side_effects:
          - "if fleet_account_id set, FleetAccount.held_credit_cents -= WorkOrder.total_due_cents (credit released on settlement)"
          - "increments WorkOrder.version by 1"

  - entity: WrapProof
    initial_state: PROOF_SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROOF_SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /wrap-proofs/{id}/request-changes"
        actor: Customer
        preconditions:
          - "WrapProof.status == PROOF_SUBMITTED"
        side_effects:
          - "increments WrapProof.version by 1"
      - from: CHANGES_REQUESTED
        to: PROOF_SUBMITTED
        trigger: "POST /work-orders/{id}/proofs (resubmit a new design)"
        actor: Installer
        preconditions:
          - "the WorkOrder's primary package requires_proof is true (else ERR_PROOF_NOT_REQUIRED)"
          - "the WorkOrder's latest WrapProof (max revision_round; tie-break created_at ASC, take last) has status CHANGES_REQUESTED — i.e. no APPROVED/REJECTED proof and not already a PROOF_SUBMITTED awaiting review"
        side_effects:
          - "create a new WrapProof with revision_round = latest WrapProof.revision_round + 1, status PROOF_SUBMITTED"
        note: "Cyclic revision loop: SUBMITTED -> CHANGES_REQUESTED -> (new) SUBMITTED. revision_round counts rounds; the first proof on an order has revision_round 1."
      - from: PROOF_SUBMITTED
        to: APPROVED
        trigger: "POST /wrap-proofs/{id}/approve"
        actor: Customer
        preconditions:
          - "WrapProof.status == PROOF_SUBMITTED"
        side_effects:
          - "increments WrapProof.version by 1"
      - from: PROOF_SUBMITTED
        to: REJECTED
        trigger: "POST /wrap-proofs/{id}/reject"
        actor: Customer
        preconditions:
          - "WrapProof.status == PROOF_SUBMITTED"
        side_effects:
          - "increments WrapProof.version by 1"

  - entity: CallbackTicket
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /callbacks/{id}/resolve"
        actor: ShopManager
        preconditions:
          - "CallbackTicket.status == OPEN"
          - "if outcome == REDO: the referenced WorkOrder.install_status == COMPLETED and a free redo bay reservation is available (see redo cascade)"
        side_effects:
          - "set CallbackTicket.outcome to REDO or DENIED"
          - "if REDO: Bay.reserved_minutes += (WorkOrder.duration_minutes + WorkOrder.cure_buffer_minutes) on the WorkOrder's bay (rework re-reserves the same bay capacity, total_due_cents not re-charged)"
          - "increments CallbackTicket.version by 1"
        note: "Cascade origin B (depth 2): resolve(REDO) -> Bay.reserved_minutes increases -> bay overlap re-check applies to subsequent bookings."
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /callbacks/{id}/close"
        actor: ShopManager
        preconditions:
          - "CallbackTicket.status == RESOLVED"
        side_effects:
          - "increments CallbackTicket.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only — OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: workorder-create-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /work-orders"
    occ_field: "expected_quote_version"
    description: |
      Scheduling a WorkOrder from a Quote whose version has advanced since the
      client last observed it is rejected. An ACCEPTED quote can legitimately be
      scheduled, and a previously-cancelled WorkOrder bumps the Quote back to
      ACCEPTED (version advances); a client still carrying the old version is
      working from a stale view of the quote and must re-read before scheduling.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: line-add-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /quotes/{id}/lines"
    occ_field: "expected_quote_version"
    description: |
      Adding a QuoteLine against a Quote whose version has advanced since the
      client last read it is rejected. Pricing a quote and reverting it on line
      edits both advance Quote.version; a writer adding a line from a stale
      version snapshot is rejected so the recomputed subtotal cannot silently
      drop or double-count a concurrently added line.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_item_price
    trigger: "POST /quotes/{id}/price (Quote DRAFT->PRICED); recomputed per INCLUDED QuoteLine"
    algorithm: tiered_pricing
    formula: |
      coverage_factor = { FULL: 1.00, PARTIAL: 0.60, ACCENT: 0.35 }[QuoteLine.coverage]
      material_mult   = FilmMaterial.price_multiplier_bps / 10000      # exact ratio
      raw_cents       = ServicePackage.base_rate_cents * coverage_factor * material_mult
      # Mode (a): >=3 inputs (base_rate, coverage_factor, material_mult, size_surcharge) with
      # non-linear interaction; rounding pinned BEFORE adding the integer size surcharge.
      priced_cents    = round_half_up(raw_cents)                       # round the product first
      line_total_cents = priced_cents + VehicleProfile.size_surcharge_cents
    input_set: "Each QuoteLine with status INCLUDED on the quote; REMOVED lines excluded."
    constants:
      COVERAGE_FULL: 1.00
      COVERAGE_PARTIAL: 0.60
      COVERAGE_ACCENT: 0.35
      SURCHARGE_SEDAN_CENTS: 0
      SURCHARGE_SUV_CENTS: 15000
      SURCHARGE_TRUCK_CENTS: 25000
    precision: "Integer cents; round_half_up applied to the product BEFORE adding the integer size surcharge (round-then-add, pinned)."
    variants:
      - name: retail_line
        when: "Quote.fleet_account_id is null"
        difference: "No fleet discount applies at the line level; discount is a quote-level operation."
      - name: fleet_line
        when: "Quote.fleet_account_id set"
        difference: "Line price is identical; the fleet discount is applied at the quote level (see quote_total), never per line — pins where the discount enters."

  - name: quote_total
    trigger: "POST /quotes/{id}/price (Quote DRAFT->PRICED)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is PINNED (mode (b) nested rounding order + mode (c) circular fee/discount):
      subtotal_cents   = sum(line_total_cents for INCLUDED QuoteLine)          # sum first
      discount_cents   = round_half_up(subtotal_cents * fleet_discount_bps / 10000)  # sum-then-round on the SUM
      net_cents        = subtotal_cents - discount_cents
      # rush_fee is keyed on the discounted NET tier — circular-looking (fee depends on net which
      # depends on discount which depends on subtotal); order pinned subtotal->discount->net->rush:
      rush_bps         = 500  if net_cents >= 100000
                         800  if 50000 <= net_cents < 100000
                         1200 if net_cents < 50000
      rush_fee_cents   = round_half_up(net_cents * rush_bps / 10000) if Quote.rushed else 0
      total_due_cents  = net_cents + rush_fee_cents
      deposit_required_cents = round_half_up(net_cents * DEPOSIT_RATE_BPS / 10000)
      # fleet_discount_bps = FleetAccount.discount_bps when fleet_account_id set, else 0.
    input_set: "INCLUDED QuoteLine line_total_cents; fleet_discount_bps from linked FleetAccount or 0."
    constants:
      DEPOSIT_RATE_BPS: 2500
      RUSH_BPS_HIGH: 500
      RUSH_BPS_MID: 800
      RUSH_BPS_LOW: 1200
      RUSH_TIER_HIGH_CENTS: 100000
      RUSH_TIER_MID_CENTS: 50000
      QUOTE_TTL_DAYS: 30
      INSTALLER_REST_BUFFER_MINUTES: 45
    precision: "Integer cents; each round_half_up is applied to a SUM (sum-then-round), never per-line; rush tier boundaries are inclusive lower bounds (>=)."
    variants:
      - name: rush_pricing
        when: "Quote.rushed == true"
        difference: "rush_fee_cents > 0 using the net-tier rush_bps; rush% is HIGHER for smaller jobs (inverse tier)."
      - name: standard_pricing
        when: "Quote.rushed == false"
        difference: "rush_fee_cents == 0; total_due_cents == net_cents."

  - name: cure_complete_at
    trigger: "Set ESTIMATED at POST /work-orders (scheduling); recomputed ACTUAL at POST /work-orders/{id}/complete-install"
    algorithm: projection
    formula: |
      cure_hours = max(FilmMaterial.cure_hours over the source quote's INCLUDED lines' materials)
      # ESTIMATED (at scheduling): anchor on the planned slot
      cure_complete_at = scheduled_start + duration_minutes(min) + cure_hours(h)
      # ACTUAL (at completion): anchor on the real finish
      cure_complete_at = actual_completed_at + cure_hours(h)
    input_set: "The FilmMaterial.cure_hours of the source quote's INCLUDED lines (max taken); WorkOrder timestamps."
    constants: {}
    precision: "Datetime arithmetic in UTC; ISO 8601 with three fractional digits."
    variants:
      - name: estimated_cure
        when: "At scheduling (install_status SCHEDULED)"
        difference: "Anchored on scheduled_start + duration; a planning projection."
      - name: actual_cure
        when: "At completion (IN_PROGRESS -> CURING)"
        difference: "Anchored on actual_completed_at; supersedes the estimate and governs the CURING->COMPLETED release gate."

  - name: warranty_window
    trigger: "POST /work-orders/{id}/complete-install (IN_PROGRESS -> CURING)"
    algorithm: aggregation
    formula: |
      warranty_days = max(ServicePackage.warranty_days over the source quote's INCLUDED lines' packages)
      warranty_expires_at = actual_completed_at + warranty_days(d)
    input_set: "Source quote's INCLUDED lines' packages (max warranty_days)."
    constants: {}
    precision: "Datetime arithmetic in UTC; ISO 8601 with three fractional digits."
    variants:
      - name: single_package
        when: "One INCLUDED line"
        difference: "warranty_days is that package's value."
      - name: multi_package
        when: "Multiple INCLUDED lines"
        difference: "warranty_days is the MAX across packages, not the sum — pins the aggregate rule."

  - name: fleet_available_credit
    trigger: "Read at GET /fleet-accounts/{id}; PROVISIONAL recomputed on WorkOrder schedule/cancel, SETTLED on settle"
    algorithm: aggregation
    formula: |
      # PROVISIONAL: credit consumed by every open order (holds), regardless of payment.
      held_credit_cents = sum(WorkOrder.total_due_cents
                              for WorkOrder where fleet_account_id == this
                              and install_status IN {SCHEDULED, IN_PROGRESS, CURING, COMPLETED})
      provisional_available_cents = credit_limit_cents - held_credit_cents
      # SETTLED: credit consumed only by orders already invoiced-and-not-yet-settled.
      settled_consumed_cents = sum(WorkOrder.total_due_cents
                              for WorkOrder where fleet_account_id == this
                              and payment_status == INVOICED)
      settled_available_cents = credit_limit_cents - settled_consumed_cents
    input_set: "WorkOrders linked to this FleetAccount, filtered by install_status (PROVISIONAL) vs payment_status (SETTLED)."
    constants: {}
    precision: "Integer cents."
    variants:
      - name: provisional_available
        when: "Capacity check at WorkOrder scheduling"
        difference: "Counts all open orders by install_status; a scheduled-but-unpaid order still consumes credit."
      - name: settled_available
        when: "Accounting view after invoicing"
        difference: "Counts only INVOICED-not-yet-SETTLED orders by payment_status; diverges from PROVISIONAL whenever orders are completed-but-uninvoiced or invoiced-but-unsettled."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity_backed roles acting on owned resources, X-User-ID matches the resource owner field (Customer->VehicleProfile.customer_user_id; FleetManager->FleetAccount.fleet_manager_user_id; Installer->Installer.installer_user_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owned-resource mutations"
  - priority: 10
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 20
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 21
    category: state
    check: "Stale optimistic-concurrency version: expected_<parent>_version does not match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /work-orders, POST /quotes/{id}/lines, POST /quotes/{id}/price, POST /quotes/{id}/accept, POST /work-orders/{id}/cancel"
  - priority: 22
    category: state
    check: "Quote PRICED past its TTL is treated as EXPIRED and cannot be accepted or scheduled"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /quotes/{id}/accept, POST /work-orders"
  - priority: 29
    category: business_safety
    check: "Exemption applicability — if a FRONT_SIDE line is below the statutory floor AND an APPROVED MedicalExemption covers the vehicle BUT the shop's StateTintRegulation.medical_exemption_allowed is false, reject: the exemption cannot be used in this state"
    error_id: ERR_EXEMPTION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /quotes/{id}/price"
  - priority: 30
    category: business_safety
    check: "Compliance — a FRONT_SIDE QuoteLine's requested_vlt_pct must be >= the effective floor; effective floor = StateTintRegulation.front_side_min_vlt_pct, lowered to an APPROVED MedicalExemption.exempt_min_vlt_pct only when the state's medical_exemption_allowed is true and an APPROVED exemption covers the vehicle"
    error_id: ERR_TINT_BELOW_LEGAL_VLT
    http_status: 422
    applies_to: "POST /quotes/{id}/price"
  - priority: 31
    category: business_safety
    check: "Compliance — a WINDSHIELD QuoteLine's strip_depth_inches must be <= StateTintRegulation.windshield_strip_max_inches; no medical exemption overrides the windshield strip limit"
    error_id: ERR_WINDSHIELD_STRIP_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /quotes/{id}/price"
  - priority: 32
    category: business_safety
    check: "Proof gate — a WorkOrder whose primary package requires_proof cannot start install without an APPROVED WrapProof"
    error_id: ERR_PROOF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /work-orders/{id}/start"
  - priority: 40
    category: business_constraint
    check: "Material compatibility — every INCLUDED QuoteLine's FilmMaterial.category must be compatible with its ServicePackage.service_type (TINT<->TINT_FILM, PPF<->PPF_FILM, WRAP<->WRAP_VINYL, CERAMIC<->CERAMIC_COATING)"
    error_id: ERR_MATERIAL_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /quotes/{id}/lines, POST /quotes/{id}/price"
  - priority: 41
    category: business_constraint
    check: "Installer certification — the assigned Installer.certified_service_types must include the WorkOrder.primary_service_type"
    error_id: ERR_INSTALLER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /work-orders"
  - priority: 42
    category: business_temporal
    check: "Bay overlap — the new WorkOrder's bay interval [scheduled_start, scheduled_start + duration_minutes + cure_buffer_minutes) (half-open, adjacency allowed) must not intersect any existing active WorkOrder interval on the same Bay"
    error_id: ERR_BAY_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 43
    category: business_temporal
    check: "Installer overlap — the new WorkOrder's installer interval [scheduled_start - INSTALLER_REST_BUFFER_MINUTES, scheduled_start + duration_minutes) (front rest buffer) must not intersect any existing active WorkOrder installer interval for the same Installer"
    error_id: ERR_INSTALLER_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 50
    category: business_referential
    check: "Quote must be ACCEPTED to schedule a WorkOrder"
    error_id: ERR_QUOTE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 51
    category: business_referential
    check: "Callback eligibility — the referenced WorkOrder must be COMPLETED and the current clock must be <= WorkOrder.warranty_expires_at"
    error_id: ERR_OUT_OF_WARRANTY
    http_status: 409
    applies_to: "POST /callbacks"
  - priority: 60
    category: business_fiscal
    check: "Fleet credit — scheduling a fleet WorkOrder must not drive held_credit_cents above credit_limit_cents (provisional available must be >= total_due_cents at schedule time)"
    error_id: ERR_FLEET_CREDIT_EXCEEDED
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 61
    category: business_fiscal
    check: "Deposit amount — pay-deposit amount_cents must equal the source Quote.deposit_required_cents exactly"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /work-orders/{id}/pay-deposit"
  - priority: 70
    category: business_constraint
    check: "Request body field types/enums valid and required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- config / catalog ----
  - method: POST
    path: "/shop-locations"
    description: "Create a shop branch."
    roles: [ShopManager]
    code: 201
    input: [name, state_code]
    output: ShopLocation
    side_effects: []
  - method: GET
    path: "/shop-locations/{id}"
    description: "Read a shop."
    roles: [ShopManager, Installer, Customer, FleetManager, ComplianceOfficer]
    code: 200
    input: []
    output: ShopLocation
    side_effects: []
  - method: POST
    path: "/state-tint-regulations"
    description: "Create or register a state's tint regulation."
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, front_side_min_vlt_pct, windshield_strip_max_inches, medical_exemption_allowed]
    output: StateTintRegulation
    side_effects: []
  - method: GET
    path: "/state-tint-regulations/{id}"
    description: "Read a state regulation."
    roles: [ComplianceOfficer, ShopManager, Customer]
    code: 200
    input: []
    output: StateTintRegulation
    side_effects: []
  - method: POST
    path: "/film-materials"
    description: "Create a film/material catalog entry."
    roles: [ShopManager]
    code: 201
    input: [sku, category, cure_hours, price_multiplier_bps]
    output: FilmMaterial
    side_effects: []
  - method: GET
    path: "/film-materials/{id}"
    description: "Read a film material."
    roles: [ShopManager, Installer, Customer]
    code: 200
    input: []
    output: FilmMaterial
    side_effects: []
  - method: POST
    path: "/service-packages"
    description: "Create a service package."
    roles: [ShopManager]
    code: 201
    input: [name, service_type, base_rate_cents, duration_minutes, cure_buffer_minutes, warranty_days, requires_proof]
    output: ServicePackage
    side_effects: []
  - method: GET
    path: "/service-packages/{id}"
    description: "Read a service package."
    roles: [ShopManager, Installer, Customer]
    code: 200
    input: []
    output: ServicePackage
    side_effects: []
  # ---- vehicle / fleet ----
  - method: POST
    path: "/vehicle-profiles"
    description: "Register a customer vehicle."
    roles: [Customer, ShopManager]
    code: 201
    input: [customer_user_id, vin, size_class]
    output: VehicleProfile
    side_effects: ["compute size_surcharge_cents from size_class"]
  - method: GET
    path: "/vehicle-profiles/{id}"
    description: "Read a vehicle profile."
    roles: [Customer, ShopManager, Installer]
    code: 200
    input: []
    output: VehicleProfile
    side_effects: []
  - method: POST
    path: "/fleet-accounts"
    description: "Create a commercial fleet account."
    roles: [ShopManager]
    code: 201
    input: [company_name, fleet_manager_user_id, discount_bps, credit_limit_cents]
    output: FleetAccount
    side_effects: []
  - method: GET
    path: "/fleet-accounts/{id}"
    description: "Read a fleet account incl. provisional/settled available credit."
    roles: [FleetManager, ShopManager]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["recompute held_credit_cents (calc fleet_available_credit)"]
  - method: GET
    path: "/work-orders"
    description: "List WorkOrders; filterable by fleet_account_id, bay_id, installer_id, quote_id."
    roles: [ShopManager, FleetManager, Installer]
    code: 200
    input: ["fleet_account_id?", "bay_id?", "installer_id?", "quote_id?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  # ---- medical exemptions ----
  - method: POST
    path: "/medical-exemptions"
    description: "File a medical exemption for a vehicle."
    roles: [Customer, ComplianceOfficer]
    code: 201
    input: [vehicle_profile_id, certificate_ref, exempt_min_vlt_pct]
    output: MedicalExemption
    side_effects: []
  - method: GET
    path: "/medical-exemptions/{id}"
    description: "Read a single medical exemption."
    roles: [ComplianceOfficer, Customer, ShopManager]
    code: 200
    input: []
    output: MedicalExemption
    side_effects: []
  - method: POST
    path: "/medical-exemptions/{id}/approve"
    description: "Approve a pending exemption (relaxes FRONT_SIDE VLT floor)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MedicalExemption
    side_effects: ["MedicalExemption.status -> APPROVED"]
  - method: POST
    path: "/medical-exemptions/{id}/reject"
    description: "Reject a pending exemption."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MedicalExemption
    side_effects: ["MedicalExemption.status -> REJECTED"]
  - method: GET
    path: "/medical-exemptions"
    description: "List exemptions; filter by vehicle_profile_id."
    roles: [ComplianceOfficer, Customer, ShopManager]
    code: 200
    input: ["vehicle_profile_id?", "limit?", "offset?"]
    output: MedicalExemption[]
    side_effects: []
  # ---- bays / installers ----
  - method: POST
    path: "/bays"
    description: "Create an install bay at a shop."
    roles: [ShopManager]
    code: 201
    input: [shop_location_id, label]
    output: Bay
    side_effects: []
  - method: GET
    path: "/bays/{id}"
    description: "Read a single bay incl. reserved_minutes."
    roles: [ShopManager, Installer]
    code: 200
    input: []
    output: Bay
    side_effects: []
  - method: GET
    path: "/bays"
    description: "List bays; filter by shop_location_id."
    roles: [ShopManager, Installer]
    code: 200
    input: ["shop_location_id?", "limit?", "offset?"]
    output: Bay[]
    side_effects: []
  - method: POST
    path: "/installers"
    description: "Create an installer at a shop."
    roles: [ShopManager]
    code: 201
    input: [shop_location_id, installer_user_id, full_name, certified_service_types]
    output: Installer
    side_effects: []
  - method: GET
    path: "/installers/{id}"
    description: "Read a single installer."
    roles: [ShopManager, Installer]
    code: 200
    input: []
    output: Installer
    side_effects: []
  - method: GET
    path: "/installers"
    description: "List installers; filter by shop_location_id."
    roles: [ShopManager]
    code: 200
    input: ["shop_location_id?", "limit?", "offset?"]
    output: Installer[]
    side_effects: []
  # ---- quotes ----
  - method: POST
    path: "/quotes"
    description: "Create a draft quote for a vehicle at a shop."
    roles: [Customer, ShopManager]
    code: 201
    input: [vehicle_profile_id, shop_location_id, "fleet_account_id?", "rushed?"]
    output: Quote
    side_effects: []
  - method: GET
    path: "/quotes"
    description: "List quotes; filter by vehicle_profile_id, shop_location_id, or fleet_account_id."
    roles: [Customer, ShopManager, FleetManager]
    code: 200
    input: ["vehicle_profile_id?", "shop_location_id?", "fleet_account_id?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: GET
    path: "/quotes/{id}"
    description: "Read a quote (observes TTL expiry on read)."
    roles: [Customer, ShopManager, FleetManager]
    code: 200
    input: []
    output: Quote
    side_effects: ["if PRICED and past TTL, transition to EXPIRED"]
  - method: POST
    path: "/quotes/{id}/lines"
    description: "Add a line to a quote (reverts PRICED->DRAFT)."
    roles: [Customer, ShopManager]
    code: 201
    input: [service_package_id, film_material_id, coverage, window_position, "requested_vlt_pct?", "strip_depth_inches?", expected_quote_version]
    output: QuoteLine
    side_effects: ["material compatibility check", "if Quote PRICED, revert to DRAFT and zero computed totals", "increments Quote.version by 1"]
  - method: GET
    path: "/quotes/{id}/lines"
    description: "List the lines of a quote."
    roles: [Customer, ShopManager, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []
  - method: DELETE
    path: "/quote-lines/{id}"
    description: "Mark a line REMOVED (reverts PRICED->DRAFT)."
    roles: [Customer, ShopManager]
    code: 200
    input: []
    output: QuoteLine
    side_effects: ["QuoteLine.status -> REMOVED", "if Quote PRICED, revert to DRAFT and zero computed totals", "increments Quote.version by 1"]
  - method: GET
    path: "/quote-lines/{id}"
    description: "Read a single quote line."
    roles: [Customer, ShopManager]
    code: 200
    input: []
    output: QuoteLine
    side_effects: []
  - method: GET
    path: "/quote-lines"
    description: "List quote lines; filter by quote_id, service_package_id, or film_material_id."
    roles: [Customer, ShopManager]
    code: 200
    input: ["quote_id?", "service_package_id?", "film_material_id?", "limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []
  - method: POST
    path: "/quotes/{id}/price"
    description: "Price a quote (DRAFT->PRICED); runs compliance and computes totals."
    roles: [Customer, ShopManager]
    code: 200
    input: [expected_quote_version]
    output: Quote
    side_effects: ["calc line_item_price per INCLUDED line", "calc quote_total", "compliance validations", "increments Quote.version by 1"]
  - method: POST
    path: "/quotes/{id}/accept"
    description: "Accept a priced quote (PRICED->ACCEPTED)."
    roles: [Customer]
    code: 200
    input: [expected_quote_version]
    output: Quote
    side_effects: ["increments Quote.version by 1"]
  - method: POST
    path: "/quotes/{id}/void"
    description: "Void a quote (DRAFT/PRICED->VOIDED)."
    roles: [Customer, ShopManager]
    code: 200
    input: []
    output: Quote
    side_effects: ["increments Quote.version by 1"]
  # ---- work orders ----
  - method: POST
    path: "/work-orders"
    description: "Schedule a WorkOrder from an ACCEPTED quote onto a bay+installer. Server default clock is 2026-04-01T00:00:00Z until set via /_clock/set_current_utc."
    roles: [ShopManager]
    code: 201
    input: [quote_id, bay_id, installer_id, scheduled_start, expected_quote_version]
    output: WorkOrder
    side_effects: ["copy fleet_account_id/total_due_cents/duration_minutes/cure_buffer_minutes/primary_service_type from quote", "calc cure_complete_at (ESTIMATED)", "Bay.reserved_minutes += duration+cure_buffer", "if fleet, FleetAccount.held_credit_cents += total_due_cents", "Quote.status -> CONVERTED and Quote.version +1"]
  - method: GET
    path: "/work-orders/{id}"
    description: "Read a WorkOrder."
    roles: [ShopManager, Installer, Customer, FleetManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/start"
    description: "Begin install (SCHEDULED->IN_PROGRESS); proof gate enforced."
    roles: [Installer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["set actual_started_at", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/complete-install"
    description: "Finish install (IN_PROGRESS->CURING); recompute ACTUAL cure + warranty."
    roles: [Installer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["set actual_completed_at", "calc cure_complete_at (ACTUAL)", "calc warranty_window", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/release"
    description: "Release a cured order (CURING->COMPLETED); frees bay capacity."
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["Bay.reserved_minutes -= duration+cure_buffer", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a scheduled/in-progress order; compensating release of bay minutes and fleet credit; reverts quote to ACCEPTED."
    roles: [ShopManager]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects: ["Bay.reserved_minutes -= duration+cure_buffer", "if fleet, FleetAccount.held_credit_cents -= total_due_cents", "Quote.status -> ACCEPTED and Quote.version +1", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/pay-deposit"
    description: "Pay the deposit (DEPOSIT_DUE->DEPOSIT_PAID)."
    roles: [Customer]
    code: 200
    input: [amount_cents]
    output: WorkOrder
    side_effects: ["increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/invoice"
    description: "Invoice a completed order (DEPOSIT_PAID->INVOICED); requires install COMPLETED."
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/settle"
    description: "Settle an invoiced order (INVOICED->SETTLED); releases held fleet credit."
    roles: [ShopManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["if fleet, FleetAccount.held_credit_cents -= total_due_cents", "increments WorkOrder.version by 1"]
  # ---- wrap proofs ----
  - method: POST
    path: "/work-orders/{id}/proofs"
    description: "Submit/resubmit a wrap design proof for an order (creates a WrapProof)."
    roles: [Installer]
    code: 201
    input: [design_ref]
    output: WrapProof
    side_effects: ["new WrapProof PROOF_SUBMITTED; revision_round = prior latest + 1 (1 if first)"]
  - method: GET
    path: "/work-orders/{id}/proofs"
    description: "List wrap proofs for an order."
    roles: [ShopManager, Installer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: WrapProof[]
    side_effects: []
  - method: POST
    path: "/wrap-proofs/{id}/approve"
    description: "Customer approves a submitted proof (->APPROVED)."
    roles: [Customer]
    code: 200
    input: []
    output: WrapProof
    side_effects: ["increments WrapProof.version by 1"]
  - method: POST
    path: "/wrap-proofs/{id}/request-changes"
    description: "Customer requests changes (PROOF_SUBMITTED->CHANGES_REQUESTED)."
    roles: [Customer]
    code: 200
    input: []
    output: WrapProof
    side_effects: ["increments WrapProof.version by 1"]
  - method: POST
    path: "/wrap-proofs/{id}/reject"
    description: "Customer rejects a submitted proof (->REJECTED)."
    roles: [Customer]
    code: 200
    input: []
    output: WrapProof
    side_effects: ["increments WrapProof.version by 1"]
  # ---- callbacks / redo ----
  - method: POST
    path: "/callbacks"
    description: "Open a callback/redo ticket against a completed in-warranty order."
    roles: [Customer, ShopManager]
    code: 201
    input: [work_order_id, reason]
    output: CallbackTicket
    side_effects: []
  - method: GET
    path: "/callbacks/{id}"
    description: "Read a single callback ticket."
    roles: [ShopManager, Customer]
    code: 200
    input: []
    output: CallbackTicket
    side_effects: []
  - method: GET
    path: "/callbacks"
    description: "List callbacks; filter by work_order_id."
    roles: [ShopManager, Customer]
    code: 200
    input: ["work_order_id?", "limit?", "offset?"]
    output: CallbackTicket[]
    side_effects: []
  - method: POST
    path: "/callbacks/{id}/resolve"
    description: "Resolve a callback as REDO or DENIED; REDO re-reserves bay minutes for free rework."
    roles: [ShopManager]
    code: 200
    input: [outcome]
    output: CallbackTicket
    side_effects: ["set outcome", "if REDO: Bay.reserved_minutes += duration+cure_buffer on the order's bay", "increments CallbackTicket.version by 1"]
  - method: POST
    path: "/callbacks/{id}/close"
    description: "Close a resolved callback (RESOLVED->CLOSED)."
    roles: [ShopManager]
    code: 200
    input: []
    output: CallbackTicket
    side_effects: ["increments CallbackTicket.version by 1"]
  # ---- test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Default before any call is 2026-04-01T00:00:00Z (never real wall-clock). All deadline/cure/warranty/TTL rules read this clock."
    roles: [ShopManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock; PRICED quotes past TTL observe EXPIRED on next read"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not permitted for the operation."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed role's X-User-ID does not match the owned resource's owner field."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (path id or FK) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version."
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "Quote is PRICED but past its TTL and cannot be accepted or scheduled."
  - id: ERR_TINT_BELOW_LEGAL_VLT
    http: 422
    condition: "FRONT_SIDE line requested_vlt_pct is below the effective legal floor."
  - id: ERR_WINDSHIELD_STRIP_EXCEEDS_LIMIT
    http: 422
    condition: "WINDSHIELD line strip_depth_inches exceeds the state's allowed strip depth."
  - id: ERR_PROOF_NOT_APPROVED
    http: 409
    condition: "Start blocked because a required wrap proof is not APPROVED."
  - id: ERR_MATERIAL_INCOMPATIBLE
    http: 422
    condition: "FilmMaterial.category incompatible with the line's ServicePackage.service_type."
  - id: ERR_INSTALLER_NOT_CERTIFIED
    http: 422
    condition: "Assigned installer is not certified for the order's primary_service_type."
  - id: ERR_BAY_TIME_CONFLICT
    http: 409
    condition: "Bay interval (with cure back-buffer) overlaps an existing booking."
  - id: ERR_INSTALLER_TIME_CONFLICT
    http: 409
    condition: "Installer interval (with front rest buffer) overlaps an existing booking."
  - id: ERR_QUOTE_NOT_ACCEPTED
    http: 409
    condition: "Quote is not ACCEPTED when scheduling a WorkOrder."
  - id: ERR_OUT_OF_WARRANTY
    http: 409
    condition: "Callback target not COMPLETED or current clock past warranty_expires_at."
  - id: ERR_FLEET_CREDIT_EXCEEDED
    http: 409
    condition: "Scheduling would push fleet held credit above the credit limit."
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "Pay-deposit amount_cents does not equal Quote.deposit_required_cents."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad type, or invalid enum value."
  - id: ERR_NO_INCLUDED_LINES
    http: 422
    condition: "Pricing a quote that has no INCLUDED lines."
  - id: ERR_VLT_OUT_OF_RANGE
    http: 422
    condition: "requested_vlt_pct outside 0..100."
  - id: ERR_DUPLICATE_VIN
    http: 409
    condition: "VehicleProfile.vin already exists."
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "FilmMaterial.sku already exists."
  - id: ERR_DUPLICATE_STATE_REGULATION
    http: 409
    condition: "StateTintRegulation.state_code already exists."
  - id: ERR_EXEMPTION_NOT_ALLOWED
    http: 422
    condition: "A medical exemption is invoked in a state whose medical_exemption_allowed is false."
  - id: ERR_PROOF_NOT_REQUIRED
    http: 409
    condition: "Submitting a wrap proof for an order whose primary package does not require_proof."
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset outside permitted bounds."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "set_current_utc target time is earlier than the current logical clock."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Operates the shop: catalog, bays, installers, scheduling, lifecycle of work orders, invoicing, callbacks."
    identity: opaque
    exclusive_operations:
      - "POST /shop-locations"
      - "POST /film-materials"
      - "POST /service-packages"
      - "POST /fleet-accounts"
      - "POST /bays"
      - "POST /installers"
      - "POST /work-orders"
      - "POST /work-orders/{id}/release"
      - "POST /work-orders/{id}/cancel"
      - "POST /work-orders/{id}/invoice"
      - "POST /work-orders/{id}/settle"
      - "POST /callbacks/{id}/resolve"
      - "POST /callbacks/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /vehicle-profiles"
      - "POST /quotes"
      - "POST /quotes/{id}/lines"
      - "DELETE /quote-lines/{id}"
      - "POST /quotes/{id}/price"
      - "POST /quotes/{id}/void"
      - "POST /callbacks"
      - "GET (most reads)"
  - name: Installer
    description: "Executes installs and submits wrap design proofs."
    identity: "entity_backed:Installer"
    exclusive_operations:
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/complete-install"
      - "POST /work-orders/{id}/proofs"
    shared_operations:
      - "GET /work-orders"
      - "GET (catalog/vehicle reads)"
  - name: Customer
    description: "Owns vehicles and quotes; approves wrap proofs; pays deposits; opens callbacks."
    identity: "entity_backed:VehicleProfile"
    exclusive_operations:
      - "POST /quotes/{id}/accept"
      - "POST /work-orders/{id}/pay-deposit"
      - "POST /wrap-proofs/{id}/approve"
      - "POST /wrap-proofs/{id}/request-changes"
      - "POST /wrap-proofs/{id}/reject"
    shared_operations:
      - "POST /vehicle-profiles"
      - "POST /quotes"
      - "POST /quotes/{id}/lines"
      - "DELETE /quote-lines/{id}"
      - "POST /quotes/{id}/price"
      - "POST /quotes/{id}/void"
      - "POST /medical-exemptions"
      - "POST /callbacks"
      - "GET (own quotes/proofs/work-orders)"
  - name: FleetManager
    description: "Owns a commercial fleet account; reads fleet credit and the account's work orders."
    identity: "entity_backed:FleetAccount"
    exclusive_operations: []
    shared_operations:
      - "GET /fleet-accounts/{id}"
      - "GET /work-orders"
      - "GET /quotes/{id}"
  - name: ComplianceOfficer
    description: "Maintains state tint regulations and adjudicates medical exemptions."
    identity: opaque
    exclusive_operations:
      - "POST /state-tint-regulations"
      - "POST /medical-exemptions/{id}/approve"
      - "POST /medical-exemptions/{id}/reject"
    shared_operations:
      - "POST /medical-exemptions"
      - "GET (regulations/exemptions)"
