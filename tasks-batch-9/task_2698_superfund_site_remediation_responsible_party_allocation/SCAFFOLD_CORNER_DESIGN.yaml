          trigger:
            - call: "POST /sites/${site_id}/cost-recovery-actions"
              payload: { respondent_prp_id: "${prp_a}", action_type: "COST_RECOVERY_DEMAND", demanded_cents: 4586736, expected_prp_version: "${prp_a_v}" }
              as: SettlementCounsel
              as_user_id: "sc-001"
              captures: { action_1: $.data.id }
            - call: "POST /cost-recovery-actions/${action_1}/response"
              payload: { decision: "REJECT", response_note: "Share disputed." }
              as: PRPRepresentative
              as_user_id: "${prp_a}"
            - call: "POST /sites/${site_id}/cost-recovery-actions"
              payload: { respondent_prp_id: "${prp_a}", action_type: "COST_RECOVERY_DEMAND", demanded_cents: 4000000, expected_prp_version: "${prp_a_v}" }
              as: SettlementCounsel
              as_user_id: "sc-001"
              captures: { err_1: $.data.error_id }
            - call: "GET /prps/${prp_a}"
              payload: {}
