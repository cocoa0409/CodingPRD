  - rule_id: boundary_precision_check
    instances:
      - name: cltv_cap_inclusive_at_9700_and_fails_at_9701
        grounds:
          - validations[priority=46]
          - calculations.combined_lien_to_value_ratio
          - errors[ERR_CLTV_LIMIT_EXCEEDED]
          - entities.Application.fields.underwriting_cltv_bps
        distinguishing_aspect: |
          Metric = combined lien-to-value in basis points at the inclusive CLTV_CAP_BPS endpoint.
          Two parcels differing by exactly 4000 cents of solar cost land on 9700 (passes, because
          the cap is `<=`) and 9701 (fails), so an implementation using `<` on either side is
          caught. The 1-bps step is engineered, not incidental: 38800000/40000000 is exactly
          9700.0 bps and 38804000/40000000 is exactly 9701.0 bps, so the result does not depend on
          the rounding mode at all — only on the comparison operator.
        test_recipe:
          setup:
            - "Clock 2026-08-12. Products SOLAR_PV (25y, cap 300000) and HVAC (18y, cap 120000); one contractor serving 06073."
