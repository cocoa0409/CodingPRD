        claim_type: segregation_of_duties
        grounds: ["validations[priority=8]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "SoD is enforced by X-User-ID even when the caller holds the right role: the creator cannot authorize their own order, the estimate submitter cannot approve it, the reg-asset proposer cannot approve it, and the completer cannot close out their own completion — each fails 403 ERR_SEGREGATION_OF_DUTIES and succeeds for a different operator."
