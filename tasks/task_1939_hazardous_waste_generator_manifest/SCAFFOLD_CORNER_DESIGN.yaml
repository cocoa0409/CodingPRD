  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: month_rollover_resets_totals
        claim_type: input_set_filtering
        grounds:
          - calculations.monthly_generated_kg
          - calculations.generator_category
          - entities.GeneratorSite.fields.current_month_key
        distinguishing_aspect: "Crossing a calendar-month boundary resets the month window: August's 700 kg (SQG) disappears from the September total, which reads 0.0 and VSQG — the aggregation window is [month_start, next_month_start)."
        test_recipe:
          setup: ["Site with ACTIVE stream, central area, and one 700 kg container created in August"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 700.0 }, as: WasteCoordinator }
          trigger:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: EHSManager }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
          assert:
            - "Before rollover: current_month_generated_kg == 700.0 and generator_category == SQG"
            - "After clock 2026-09-01: current_month_key == '2026-09', current_month_generated_kg == 0.0, generator_category == VSQG"
            - "WasteStream.${stream_id}.total_generated_kg == 700.0 (lifetime total not reset)"

      - name: inspection_overdue_exactly_7_days
        claim_type: constants_applied
        grounds:
          - calculations.inspection_currency
          - validations[priority=27]
          - errors[ERR_INSPECTION_OVERDUE]
        distinguishing_aspect: "At exactly 7 days from the inspection baseline the container is NOT overdue (strictly-greater); one second later stage is rejected with ERR_INSPECTION_OVERDUE."
        test_recipe:
          setup: ["Site with ACTIVE stream and central area; container labeled, inspected PASS at creation time 2026-08-01T00:00:00Z, not yet staged"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 50.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2026-08-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${cont_id}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
          trigger:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: EHSManager }
            - { call: "GET /hazwaste/containers/${cont_id}", as: EHSManager }
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:01Z" }, as: EHSManager }
            - { call: "POST /hazwaste/containers/${cont_id}/stage", as: WasteCoordinator, as_user_id: "wc-1", captures: { err: "$.data.error_id" } }
          assert:
            - "At exactly 2026-08-08T00:00:00Z (7 days after the 2026-08-01 inspection): is_inspection_overdue == false"
            - "At 2026-08-08T00:00:01Z: stage returns err == ERR_INSPECTION_OVERDUE (409)"

      - name: audit_currency_exclusive_end
        claim_type: precision
        grounds:
          - calculations.audit_currency
          - entities.WastePartner.fields.is_audit_current
        distinguishing_aspect: "The coverage end is exclusive: at 2026-12-31T23:59:59Z the partner is current; at exactly 2027-01-01T00:00:00Z the audit is expired."
        test_recipe:
          setup: ["TSDF APPROVED with PASS audit coverage [2026-01-01, 2027-01-01)"]
          setup_api_calls:
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2026-01-01T00:00:00Z", coverage_to: "2027-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
          trigger:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-12-31T23:59:59Z" }, as: EHSManager }
            - { call: "GET /hazwaste/waste-partners/${tsdf_id}", as: ComplianceAuditor }
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: EHSManager }
            - { call: "GET /hazwaste/waste-partners/${tsdf_id}", as: ComplianceAuditor }
          assert:
            - "At 2026-12-31T23:59:59Z: is_audit_current == true"
            - "At 2027-01-01T00:00:00Z: is_audit_current == false (exclusive coverage end)"

      - name: tonnage_fee_rounding_corner
        claim_type: variant_divergence
        grounds:
          - calculations.manifest_tonnage_fee_cents
        excluded_because:
          difficulty_instance: manifest_tonnage_fee_per_line_rounding
          rationale: "Per-line-then-sum rounding pinned and asserted with the 22-vs-21 cents divergence in §1.8."

      - name: biennial_fee_variant_corner
        claim_type: variant_selection
        grounds:
          - calculations.biennial_report_fee_cents
        excluded_because:
          difficulty_instance: biennial_fee_provisional_vs_final
          rationale: "Provisional vs final variant selection (and their differing totals on identical data) is the §1.8 instance's assertion."

      - name: accumulation_overdue_blocks_stage
        claim_type: correct_result
        grounds:
          - calculations.accumulation_deadline_at
          - validations[priority=26]
          - errors[ERR_ACCUMULATION_LIMIT_EXCEEDED]
        distinguishing_aspect: "A VSQG container created 2026-08-01 (180-day deadline 2027-01-28) becomes overdue only after the deadline; staging at 2027-01-29 is rejected."
        test_recipe:
          setup: ["Site with ACTIVE stream and central area; labeled+inspected container in central accumulation since 2026-08-01"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 50.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2026-08-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${cont_id}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
          trigger:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2027-01-29T00:00:00Z" }, as: EHSManager }
            - { call: "GET /hazwaste/containers/${cont_id}", as: EHSManager }
            - { call: "POST /hazwaste/containers/${cont_id}/stage", as: WasteCoordinator, as_user_id: "wc-1", captures: { err: "$.data.error_id" } }
          assert:
            - "After the sweep at 2027-01-29: Container.${cont_id}.is_accumulation_overdue == true (deadline 2027-01-28 passed)"
            - "err == ERR_ACCUMULATION_LIMIT_EXCEEDED (p26 temporal gate at stage)"

