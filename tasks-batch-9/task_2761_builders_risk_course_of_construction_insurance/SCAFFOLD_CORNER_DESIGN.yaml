        distinguishing_aspect: "Three different shapes of malformed project submission - an omitted required field, an enum value outside the declared set, and a negative money amount - all return the single ERR_INVALID_REQUEST (400), and none of them creates a row, while the otherwise identical well-formed body is accepted."
