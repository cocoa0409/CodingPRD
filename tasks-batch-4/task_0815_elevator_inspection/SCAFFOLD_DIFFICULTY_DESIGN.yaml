        distinguishing_aspect: "OutOfServiceOrder occupation uses CLOSED intervals on the Device resource: a new order [20,25] collides with an existing ACTIVE [10,20] because they share endpoint 20 (ERR_OOS_ORDER_OVERLAP) — closed-interval semantics on Device, distinct from the inspector half-open+buffer rule."
