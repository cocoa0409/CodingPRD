# =============================================================================
# Task 1160 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# §1.8-covered corners are emitted as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: sponsor_creation_defaults_and_computed_npe
        claim_type: creation
        grounds: [entities.Sponsor, "endpoints[POST /aip/sponsors]"]
        distinguishing_aspect: "Sponsor creation returns server-minted UUID id, version 1, status ACTIVE, and npe_entitlement_available == npe_entitlement_total before any grant exists."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id, ver: $.data.version } }
          assert:
            - "response HTTP 201; id is a UUID; version == 1"
            - "Sponsor.${sp}.status == ACTIVE and npe_entitlement_available == 5000000.00"

      - name: sponsor_duplicate_loc_id_rejected
        claim_type: type_constraints
        grounds: [entities.Sponsor.fields.loc_id, "validations[priority=13]"]
        distinguishing_aspect: "loc_id uniqueness is enforced across sponsors: second create with the same loc_id fails with ERR_VALIDATION."
        test_recipe:
          setup: ["sponsor ZXY exists"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager }
          trigger:
            - call: "POST /aip/sponsors"
              payload: { sponsor_name: "Sponsor B", loc_id: "ZXY", airport_size_tier: "NONHUB", npe_entitlement_total: 100 }
              as: FAAManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 422 with error_id == ERR_VALIDATION"

      - name: sponsor_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Sponsor, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404), and the error envelope carries data.error_id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /aip/sponsors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SponsorStaff
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: cip_project_defaults_and_null_scores
        claim_type: defaults
        grounds: [entities.CIPProject.fields.runway_safety_noncompliant, entities.CIPProject.fields.priority_score_sponsor]
        distinguishing_aspect: "Omitting the two boolean flags yields false/false, initial status PROPOSED, and both priority scores remain null until apply-selection runs."
        test_recipe:
          setup: ["program DRAFT exists"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Apron", project_type: "CAPACITY", estimated_cost: 250000, safety_score: 5, capacity_score: 5, preservation_score: 5, security_score: 5, environmental_score: 5 }, as: SponsorStaff, captures: { p1: $.data.id } }
          assert:
            - "CIPProject.${p1}.runway_safety_noncompliant == false and multi_airport_system == false"
            - "CIPProject.${p1}.status == PROPOSED; priority_score_sponsor == null; priority_score_federal == null; selection_rank == null"

      - name: cip_project_score_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.CIPProject.fields.safety_score, "validations[priority=13]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Component scores are bounded 0..20: safety_score 21 is rejected at creation."
        test_recipe:
          setup: ["program DRAFT exists"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
          trigger:
            - call: "POST /aip/cip-projects"
              payload: { program_id: "${prog}", title: "Apron", project_type: "CAPACITY", estimated_cost: 250000, safety_score: 21, capacity_score: 5, preservation_score: 5, security_score: 5, environmental_score: 5 }
              as: SponsorStaff
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_VALIDATION"

      - name: application_creation_auto_creates_six_assurances
        claim_type: computed_fields
        grounds: [entities.GrantApplication.fields.assurances_total, entities.SponsorAssurance, "endpoints[GET /aip/grant-applications/{id}/assurances]"]
        distinguishing_aspect: "Creating an application cascades six PENDING SponsorAssurance children (one per assurance_code); assurances_total == 6 and assurances_cleared == 0 until certification."
        test_recipe:
          setup: ["program DRAFT with one PROPOSED project"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Apron", project_type: "CAPACITY", estimated_cost: 250000, safety_score: 5, capacity_score: 5, preservation_score: 5, security_score: 5, environmental_score: 5 }, as: SponsorStaff, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff }
          assert:
            - "GrantApplication.${app}.assurances_total == 6 and assurances_cleared == 0"
            - "assurances list has 6 rows, all PENDING, codes {TITLE_VI, BUY_AMERICAN, DBE_PROGRAM, ENVIRONMENTAL_REVIEW, PREVAILING_WAGE, AIRPORT_FEES}"
            - "GrantApplication.${app}.total_eligible_cost == 250000.00 and submission_deadline == 2026-05-15T23:59:59Z"

      - name: assurance_immutable_entity_shape
        claim_type: immutability
        grounds: [entities.SponsorAssurance]
        distinguishing_aspect: "SponsorAssurance has common_fields: false — responses expose id and created_at only, with no version or updated_at keys."
        test_recipe:
          setup: ["application created (assurances auto-created)"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Apron", project_type: "CAPACITY", estimated_cost: 250000, safety_score: 5, capacity_score: 5, preservation_score: 5, security_score: 5, environmental_score: 5 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
          trigger:
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff }
          assert:
            - "each row has id, created_at, application_id, assurance_code, status; no version or updated_at field is present"

      - name: invoice_retainage_computed_on_create
        claim_type: computed_fields
        grounds: [calculations.retainage_split, entities.Invoice.fields.retainage_withheld, entities.Invoice.fields.net_payable]
        distinguishing_aspect: "retainage_withheld and net_payable are server-computed: gross 100,000 at retainage_pct 0.10 yields 10,000.00 / 90,000.00."
        test_recipe:
          setup: ["ACTIVE grant; contract awarded 500,000 retainage 0.10"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Runway rehab", project_type: "PRESERVATION", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { prog_v: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_v}" }, as: SponsorStaff }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff, captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id", a3: "$.data[3].id", a4: "$.data[4].id", a5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${a0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a1}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a2}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a3}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a4}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a5}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/grant-applications/${app}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/grant-applications/${app}/offer", payload: {}, as: FAAManager }
            - { call: "POST /aip/grant-applications/${app}/accept-offer", payload: {}, as: SponsorStaff, captures: { grant: $.data.created_grant_id } }
            - { call: "POST /aip/contractors", payload: { sponsor_id: "${sp}", contractor_name: "BuildCo", dbe_certified: false }, as: SponsorStaff, captures: { ctr: $.data.id } }
            - { call: "POST /aip/contracts", payload: { grant_id: "${grant}", cip_project_id: "${p1}", contractor_id: "${ctr}", awarded_value: 500000, dbe_goal_pct: 12.50, retainage_pct: 0.10 }, as: SponsorStaff, captures: { con: $.data.id } }
          trigger:
            - { call: "POST /aip/invoices", payload: { contract_id: "${con}", invoice_number: "INV-1", period: "2026-05", gross_amount: 100000 }, as: Contractor, as_user_id: "${ctr}", captures: { inv: $.data.id } }
          assert:
            - "Invoice.${inv}.retainage_withheld == 10000.00 and net_payable == 90000.00"
            - "Invoice.${inv}.status == SUBMITTED and drawdown_id == null"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: program_accept_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CapitalProgram, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "accept is only declared from SUBMITTED; calling it on a DRAFT program returns ERR_INVALID_STATE and the program stays DRAFT."
        test_recipe:
          setup: ["program DRAFT with one project"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Apron", project_type: "CAPACITY", estimated_cost: 250000, safety_score: 5, capacity_score: 5, preservation_score: 5, security_score: 5, environmental_score: 5 }, as: SponsorStaff }
          trigger:
            - call: "POST /aip/capital-programs/${prog}/accept"
              payload: {}
              as: FAAManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; program stays DRAFT"

      - name: program_amendment_cycle
        claim_type: valid_transition
        grounds: [state_machines.CapitalProgram.ACCEPTED_to_AMENDMENT_DRAFT, state_machines.CapitalProgram.AMENDMENT_DRAFT_to_SUBMITTED]
        distinguishing_aspect: "The program machine cycles ACCEPTED -> AMENDMENT_DRAFT -> SUBMITTED -> ACCEPTED; each hop bumps version (3 -> 6) and new projects may be added during AMENDMENT_DRAFT."
        test_recipe:
          setup: ["program ACCEPTED (version 3) with one SELECTED project"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Apron", project_type: "CAPACITY", estimated_cost: 250000, safety_score: 5, capacity_score: 5, preservation_score: 5, security_score: 5, environmental_score: 5 }, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { v3: $.data.version } }
          trigger:
            - { call: "POST /aip/capital-programs/${prog}/begin-amendment", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Taxiway", project_type: "PRESERVATION", estimated_cost: 300000, safety_score: 8, capacity_score: 8, preservation_score: 8, security_score: 8, environmental_score: 8 }, as: SponsorStaff, captures: { p2: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { v_end: $.data.version, st: $.data.status } }
          assert:
            - "CapitalProgram.${prog}.status == ACCEPTED after the full amendment loop"
            - "version advanced from ${v3} (3) to 6 across begin-amendment/submit/accept"
            - "CIPProject.${p2} created during AMENDMENT_DRAFT is PROPOSED and unranked"

      - name: declined_application_is_terminal
        claim_type: terminal_lockdown
        grounds: [state_machines.GrantApplication.OFFERED_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: submitting a declined application returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["application OFFERED (standard chain through offer)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FAAManager }
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Runway rehab", project_type: "PRESERVATION", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { prog_v: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_v}" }, as: SponsorStaff }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff, captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id", a3: "$.data[3].id", a4: "$.data[4].id", a5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${a0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a1}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a2}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a3}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a4}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/sponsor-assurances/${a5}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
            - { call: "POST /aip/grant-applications/${app}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/grant-applications/${app}/offer", payload: {}, as: FAAManager }
            - { call: "POST /aip/grant-applications/${app}/decline-offer", payload: {}, as: SponsorStaff }
          trigger:
            - call: "POST /aip/grant-applications/${app}/submit"
              payload: {}
              as: SponsorStaff
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE; application remains DECLINED"

      - name: assurance_certify_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SponsorAssurance, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CERTIFIED is terminal for an assurance; a second certify returns ERR_INVALID_STATE (also covers idempotency of the certify trigger)."
        test_recipe:
          setup: ["application created; one assurance certified"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Apron", project_type: "CAPACITY", estimated_cost: 250000, safety_score: 5, capacity_score: 5, preservation_score: 5, security_score: 5, environmental_score: 5 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff, captures: { a0: "$.data[0].id" } }
            - { call: "POST /aip/sponsor-assurances/${a0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
          trigger:
            - call: "POST /aip/sponsor-assurances/${a0}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-compl-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "GrantApplication.${app}.assurances_cleared == 1 (no double count)"

      - name: invoice_verify_after_reject_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Invoice.SUBMITTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal for an invoice; verify afterwards returns ERR_INVALID_STATE and contract totals stay untouched."
        test_recipe:
          setup: ["ACTIVE grant; contract; invoice INV-1 REJECTED"]
          setup_api_calls:
            - { call: "POST /aip/sponsors", payload: { sponsor_name: "Sponsor A", loc_id: "ZXY", airport_size_tier: "SMALL_HUB", npe_entitlement_total: 5000000 }, as: FAAManager, captures: { sp: $.data.id } }
            - { call: "POST /aip/capital-programs", payload: { sponsor_id: "${sp}", fiscal_year: 2027 }, as: SponsorStaff, captures: { prog: $.data.id } }
            - { call: "POST /aip/cip-projects", payload: { program_id: "${prog}", title: "Runway rehab", project_type: "PRESERVATION", estimated_cost: 1000000, safety_score: 20, capacity_score: 10, preservation_score: 10, security_score: 10, environmental_score: 10 }, as: SponsorStaff, captures: { p1: $.data.id } }
            - { call: "POST /aip/capital-programs/${prog}/submit", payload: {}, as: SponsorStaff }
            - { call: "POST /aip/capital-programs/${prog}/accept", payload: {}, as: FAAManager, captures: { prog_v: $.data.version } }
            - { call: "POST /aip/capital-programs/${prog}/apply-selection", payload: { selection_budget: 2000000, expected_program_version: "${prog_v}" }, as: SponsorStaff }
            - { call: "POST /aip/grant-applications", payload: { sponsor_id: "${sp}", program_id: "${prog}", project_ids: ["${p1}"] }, as: SponsorStaff, as_user_id: "user-sponsor-1", captures: { app: $.data.id } }
            - { call: "GET /aip/grant-applications/${app}/assurances", payload: {}, as: SponsorStaff, captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id", a3: "$.data[3].id", a4: "$.data[4].id", a5: "$.data[5].id" } }
            - { call: "POST /aip/sponsor-assurances/${a0}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "user-compl-1" }
