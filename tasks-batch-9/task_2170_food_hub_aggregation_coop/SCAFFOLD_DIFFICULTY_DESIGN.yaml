- rule_id: combinatorial_formula
  instances:
  - name: hub_margin_rounded_per_allocation_then_summed
    grounds:
    - calculations.order_pricing_rollup
    - calculations.line_allocation_waterfall
    - entities.Allocation.fields.hub_margin_cents
    - entities.BuyerOrder.fields.hub_margin_cents
    distinguishing_aspect: Mode (b) — nested rounding where the order matters. Two allocations of 9025 and 5415 producer cents at 1800 bp round to 1625 and 975 and sum to 2600, whereas summing first (14440
      * 0.18 = 2599.2) and rounding once yields 2599; the scaffold pins round-per-allocation-then-sum, so hub_margin_cents must be 2600 and order_total_cents 17040.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      - Producer P1 ACTIVE with two LISTED products PR1 and PR2, both 1805 cents/CASE, both quantity_offered 5, units_per_pallet 40, created in that order.
      - Buyer B1 with credit_limit_cents 5000000; order O1 has one line L1 for 8 CASE of CARROT_LOOSE at max_unit_price_cents 2500 (the eligibility ceiling for 1805 cents is 2130).
      - O1 is still fulfillment_status DRAFT with no allocations.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /producers
        payload:
          legal_name: Green Acres Farm
