            - "after the second call PublisherAccount.${acct_id}.standing_score_rolling_365 == 94.00"
            - "after the second call PublisherAccount.${acct_id}.standing_score_lifetime == 88.00"
            - "GET /publisher-accounts/${acct_id}/standing reports decayed_penalty_total == 6.00 and undecayed_penalty_total == 12.00"

      - name: past_one_hundred_and_eighty_days_the_penalty_decays_to_a_quarter
        claim_type: Constants Applied
        grounds:
