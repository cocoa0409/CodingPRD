      - name: freight_waiver_threshold_boundary_claim
        claim_type: threshold
        excluded_because:
          difficulty_instance: freight_waiver_exact_threshold_on_pricing_preview
          rationale: "The §1.8 boundary instance already prices subtotal 249875 / 250000 / 250125 around FREIGHT_WAIVER_SUBTOTAL_CENTS on the same endpoint and asserts the inclusive edge, which is the threshold algorithm claim."

      - name: per_unit_rounding_precision_claim
        claim_type: precision
        excluded_because:
          difficulty_instance: per_unit_rounding_pinned_before_multiply_mode_b
          rationale: "The §1.8 combinatorial instance pins round-then-multiply at the unit (7 x round_half_up(1839.08) = 12873, not round_half_up(12873.56) = 12874); the corner file instead probes the contrasting round-once-on-the-sum path in the return valuation."

      - name: tier_variant_divergence_claim
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: tier_variant_divergence_pinned_vs_rolling_on_order_pricing
          rationale: "PINNED_AT_REVIEW vs ROLLING_365_INCLUSIVE on identical data, including the forward-looking leg that adds the order's own list_subtotal, is asserted in full by the §1.8 dual-variant instance."

      - name: rebate_running_total_aggregation_claim
        claim_type: aggregation
        excluded_because:
          difficulty_instance: return_credit_conserves_rebate_against_net_volume
          rationale: "The §1.8 compensating-invariant instance already asserts the accrual running total after the add and after the reversal, together with payable_cents = max(0, accrued - clawed_back)."

  - section: validations
