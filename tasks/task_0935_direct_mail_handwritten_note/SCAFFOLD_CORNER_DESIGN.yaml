scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:

      - name: account_creation_starts_with_zero_permit_balance
        claim_type: Creation
        grounds: [entities.Account.fields.permit_balance_cents, 'endpoints["POST /mail/accounts"]']
        distinguishing_aspect: "A freshly created Account returns 201 with permit_balance_cents 0, all four lifetime counters 0, status ACTIVE and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-200" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "response status == 201"
            - "Account.${acct_id}.permit_balance_cents == 0"
            - "Account.${acct_id}.lifetime_topup_cents == 0"
            - "Account.${acct_id}.lifetime_draw_cents == 0"
            - "Account.${acct_id}.status == ACTIVE"
            - "Account.${acct_id}.version == 1"

      - name: campaign_defaults_three_status_axes_and_open_write_gate
        claim_type: Defaults
        grounds: [entities.Campaign.fields.lifecycle_status, entities.Campaign.fields.compliance_status, entities.Campaign.fields.billing_status, entities.Campaign.fields.write_gate]
        distinguishing_aspect: "A new Campaign defaults to lifecycle_status DRAFT, compliance_status CLEAR, billing_status OPEN and the derived write_gate OPEN, with every money counter at 0."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-201" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /mail/campaigns"
              payload: { account_id: "${acct_id}", name: "Spring 2026" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          assert:
            - "response status == 201"
            - "Campaign.${camp_id}.lifecycle_status == DRAFT"
            - "Campaign.${camp_id}.compliance_status == CLEAR"
            - "Campaign.${camp_id}.billing_status == OPEN"
            - "Campaign.${camp_id}.write_gate == OPEN"
            - "Campaign.${camp_id}.committed_postage_cents == 0"
            - "Campaign.${camp_id}.returned_piece_count == 0"

      - name: list_record_system_fields_assigned_by_server
        claim_type: System Fields
        grounds: [entities.ListRecord.fields.insertion_seq, entities.ListRecord.fields.exact_key, entities.ListRecord.fields.household_key]
        distinguishing_aspect: "Two records imported into one list receive insertion_seq 1 and 2 in call order, and both computed dedupe keys are derived from the address fields rather than supplied by the client."
        test_recipe:
          setup: ["One account and one empty mailing list in UPLOADED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-202" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Seq List" }
              as: ListOperator
              captures: { list_id: $.data.id }
          trigger:
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "John", last_name: "Smith", address_line1: "100 Main St", city: "Chicago", state_code: "IL", zip5: "60601", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { r1_id: $.data.id, r1_seq: $.data.insertion_seq }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Jane", last_name: "Smith", address_line1: "100 Main St", city: "Chicago", state_code: "IL", zip5: "60601", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { r2_id: $.data.id, r2_seq: $.data.insertion_seq }
          assert:
            - "ListRecord.${r1_id}.insertion_seq == 1"
            - "ListRecord.${r2_id}.insertion_seq == 2"
            - "ListRecord.${r1_id}.household_key == ListRecord.${r2_id}.household_key"
            - "ListRecord.${r1_id}.exact_key != ListRecord.${r2_id}.exact_key"
            - "ListRecord.${r1_id}.cass_status == PENDING"
            - "ListRecord.${r1_id}.deliverability_tier == UNASSIGNED"
            - "MailingList.${list_id}.record_count == 2"

      - name: account_not_found_on_postage_topup
        claim_type: Not Found
        grounds: ['validations[priority=4]', 'errors[ERR_ACCOUNT_NOT_FOUND]']
        distinguishing_aspect: "Topping up a non-existent account id returns 404 ERR_ACCOUNT_NOT_FOUND and writes no ledger row."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mail/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/postage-topups"
              payload: { amount_cents: 1000, reason: "seed" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_ACCOUNT_NOT_FOUND"

      - name: mail_job_not_found_on_estimate
        claim_type: Not Found
        grounds: ['validations[priority=4]', 'errors[ERR_MAIL_JOB_NOT_FOUND]']
        distinguishing_aspect: "Estimating a non-existent mail job id returns 404 ERR_MAIL_JOB_NOT_FOUND, distinct from the generic resource error."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mail/mail-jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/estimate"
              payload: {}
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_MAIL_JOB_NOT_FOUND"

      - name: campaign_not_found_on_activate
        claim_type: Not Found
        grounds: ['validations[priority=4]', 'errors[ERR_CAMPAIGN_NOT_FOUND]']
        distinguishing_aspect: "Activating a non-existent campaign returns 404 ERR_CAMPAIGN_NOT_FOUND rather than a state error."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mail/campaigns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/activate"
              payload: {}
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_CAMPAIGN_NOT_FOUND"

      - name: resource_not_found_on_ink_lot_read
        claim_type: Not Found
        grounds: ['validations[priority=4]', 'errors[ERR_RESOURCE_NOT_FOUND]']
        distinguishing_aspect: "Reading a non-existent ink lot returns 404 ERR_RESOURCE_NOT_FOUND — the catch-all code used for every entity outside Account, Campaign and MailJob."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /mail/ink-lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProductionOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: missing_required_field_on_template_create
        claim_type: Required Fields
        grounds: ['validations[priority=6]', 'errors[ERR_VALIDATION]']
        distinguishing_aspect: "Omitting character_count from a template create returns 400 ERR_VALIDATION and creates no Template."
        test_recipe:
          setup: ["One account and one handwriting style."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-203" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Casual Script", pen_type: "GEL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { style_id: $.data.id }
          trigger:
            - call: "POST /mail/templates"
              payload: { account_id: "${acct_id}", handwriting_style_id: "${style_id}", name: "Spring Note", body_text: "Thank you kindly" }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_VALIDATION"

      - name: invalid_enum_on_handwriting_style_pen_type
        claim_type: Type Constraints
        grounds: ['validations[priority=7]', 'errors[ERR_INVALID_ENUM]']
        distinguishing_aspect: "pen_type is on rung 7's closed enum list, so an unknown member returns 422 ERR_INVALID_ENUM rather than 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Odd Script", pen_type: "QUILL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_INVALID_ENUM"
            - "response data.error_id != ERR_VALIDATION"

      - name: character_count_above_maximum_rejected
        claim_type: Type Constraints
        grounds: ['validations[priority=8]', 'errors[ERR_VALUE_OUT_OF_RANGE]', entities.Template.fields.character_count]
        distinguishing_aspect: "character_count 2001 exceeds the INCLUSIVE MAX_TEMPLATE_CHARACTER_COUNT of 2000 and returns 422 ERR_VALUE_OUT_OF_RANGE."
        test_recipe:
          setup: ["One account and one handwriting style."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-204" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Casual Script", pen_type: "GEL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { style_id: $.data.id }
          trigger:
            - call: "POST /mail/templates"
              payload: { account_id: "${acct_id}", handwriting_style_id: "${style_id}", name: "Long Note", body_text: "x", character_count: 2001 }
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_VALUE_OUT_OF_RANGE"

      - name: list_records_filtered_list_paginates_with_envelope
        claim_type: Listing
        grounds: ['endpoints["GET /mail/list-records"]', response_envelope.pagination_fields]
        distinguishing_aspect: "GET /mail/list-records?mailing_list_id=... with limit 2 and offset 0 returns exactly 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup: ["One list holding three records."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-205" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Page List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Carl", last_name: "Lee", address_line1: "300 Pine Rd", city: "Chicago", state_code: "IL", zip5: "60603", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Dana", last_name: "Fox", address_line1: "400 Elm St", city: "Chicago", state_code: "IL", zip5: "60604", dpv_confirmation_code: "Y" }
              as: ListOperator
          trigger:
            - call: "GET /mail/list-records"
              payload: { mailing_list_id: "${list_id}", limit: 2, offset: 0 }
              as: ListOperator
          assert:
            - "response status == 200"
            - "response meta contains api_request_id and api_request_timestamp"
            - "response response_type == array"
            - "len(response data) == 2"
            - "response total_count == 3"
            - "response has_more == true"

      - name: postage_ledger_entry_is_append_only_without_version
        claim_type: Immutability
        grounds: [entities.PostageLedgerEntry, 'endpoints["GET /mail/postage-ledger-entries"]']
        distinguishing_aspect: "PostageLedgerEntry is declared common_fields false, so a TOPUP row exposes id and created_at but no version field, and there is no update or delete endpoint for it anywhere in the API."
        test_recipe:
          setup: ["One account topped up by 500000 cents."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-206" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/accounts/${acct_id}/postage-topups"
              payload: { amount_cents: 500000, reason: "seed escrow" }
              as: PlatformAdmin
          trigger:
            - call: "GET /mail/postage-ledger-entries"
              payload: { account_id: "${acct_id}", entry_type: "TOPUP" }
              as: PlatformAdmin
          assert:
            - "len(response data) == 1"
            - "response data[0].entry_type == TOPUP"
            - "response data[0].amount_cents == 500000"
            - "response data[0].signed_amount_cents == 500000"
            - "response data[0].balance_after_cents == 500000"
            - "response data[0].campaign_id == null"
            - "response data[0] has no version field"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: campaign_pause_from_draft_returns_campaign_invalid_state
        claim_type: Invalid Transitions
        grounds: ['validations[priority=15]', 'errors[ERR_CAMPAIGN_INVALID_STATE]', state_machines.Campaign.lifecycle_status.ACTIVE_to_PAUSED]
        distinguishing_aspect: "Pausing a campaign still in DRAFT returns 409 ERR_CAMPAIGN_INVALID_STATE and leaves lifecycle_status DRAFT."
        test_recipe:
          setup: ["One campaign in DRAFT with an OPEN write gate."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-210" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/campaigns"
              payload: { account_id: "${acct_id}", name: "Spring 2026" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /mail/campaigns/${camp_id}/pause"
              payload: {}
              as: CampaignManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_CAMPAIGN_INVALID_STATE"
            - "Campaign.${camp_id}.lifecycle_status == DRAFT"

      - name: record_import_after_cass_run_returns_list_invalid_state
        claim_type: Precondition Enforcement
        grounds: ['validations[priority=16]', 'errors[ERR_LIST_INVALID_STATE]', state_machines.MailingList.import_status.UPLOADED_to_CASS_RUN]
        distinguishing_aspect: "Records may only be imported while the list is UPLOADED; a second import after the CASS run returns 409 ERR_LIST_INVALID_STATE and record_count stays 1."
        test_recipe:
          setup: ["A one-record list that has been CASS-run."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-211" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Mini List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
          trigger:
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Carl", last_name: "Lee", address_line1: "300 Pine Rd", city: "Chicago", state_code: "IL", zip5: "60603", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_LIST_INVALID_STATE"
            - "MailingList.${list_id}.record_count == 1"
            - "MailingList.${list_id}.import_status == CASS_RUN"

      - name: dedupe_run_after_lock_returns_list_locked
        claim_type: Terminal State Lockdown
        grounds: ['validations[priority=12]', 'errors[ERR_LIST_LOCKED]', state_machines.MailingList.import_status.DEDUPED_to_LOCKED]
        distinguishing_aspect: "LOCKED is terminal for the list: a further dedupe run returns 409 ERR_LIST_LOCKED at rung 12, above the rung-16 state gate that would also have rejected it."
        test_recipe:
          setup: ["A one-record list that has been CASS-run, deduped EXACT and locked."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-212" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Mini List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_bob_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "EXACT" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/lock"
              payload: {}
              as: ListOperator
          trigger:
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "HOUSEHOLD" }
              as: ListOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /mail/list-records/${rec_bob_id}/ncoa-moves"
              payload: { new_address_line1: "250 Oak Ave" }
              as: ListOperator
              captures: { err2_id: $.data.error_id }
          assert:
            - "the dedupe re-run returned status 409 with data.error_id == ERR_LIST_LOCKED"
            - "the NCOA move returned status 409 with data.error_id == ERR_LIST_LOCKED"
            - "MailingList.${list_id}.dedupe_mode == EXACT"
            - "ListRecord.${rec_bob_id}.move_status == NONE"

      - name: commit_from_draft_returns_mail_job_invalid_state
        claim_type: Invalid Transitions
        grounds: ['validations[priority=17]', 'errors[ERR_MAIL_JOB_INVALID_STATE]']
        distinguishing_aspect: "Committing a job still in DRAFT on an unfrozen campaign returns 409 ERR_MAIL_JOB_INVALID_STATE — the state rung, not the approval rungs, because commit demands SCHEDULED."
        test_recipe:
          setup: ["One ADDRESSED job in DRAFT on a CLEAR, OPEN campaign whose list is locked."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-213" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Casual Script", pen_type: "GEL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { style_id: $.data.id }
            - call: "POST /mail/templates"
              payload: { account_id: "${acct_id}", handwriting_style_id: "${style_id}", name: "Spring Note", body_text: "Thank you kindly", character_count: 400 }
              as: CampaignManager
              captures: { tpl_id: $.data.id }
            - call: "POST /mail/campaigns"
              payload: { account_id: "${acct_id}", name: "Spring 2026" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Mini List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "EXACT" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/lock"
              payload: {}
