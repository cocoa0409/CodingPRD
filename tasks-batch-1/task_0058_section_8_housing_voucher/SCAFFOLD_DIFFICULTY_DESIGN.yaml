  - rule_id: boundary_precision_check
    instances:
      - name: rent_reasonableness_inclusive_equal_passes
        grounds:
          - validations[priority=9]
          - calculations.subsidy_calculation
          - entities.RentReasonablenessDetermination.fields.outcome
        distinguishing_aspect: |
          Numeric threshold metric: requested rent EXACTLY equal to comparable
          (90000 == 90000) is REASONABLE (INCLUSIVE <=); reached via POST
          /rent-reasonableness, distinct endpoint from the empty-set boundary.
        test_recipe:
          setup:
            - "A unit with comparable_rent_cents 90000."
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "BND_REG1", name: "Bnd1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LL10", payee_account: "acct-10" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 90000, comparable_rent_cents: 90000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
          trigger:
            - call: "POST /rent-reasonableness"
              payload: { unit_id: "${unit}", requested_rent_cents: 90000 }
              as: Caseworker
              captures: { det: $.data.outcome }
          assert:
            - "RentReasonablenessDetermination.outcome == REASONABLE"

      - name: list_vouchers_empty_set_for_unused_region
        grounds:
          - endpoints
          - entities.Voucher.fields.issuing_region_id
        distinguishing_aspect: |
          Empty-collection boundary on a different metric/endpoint: GET
          /vouchers?issuing_region_id=<region with no vouchers> returns an empty
          array with total_count 0, not an error.
        test_recipe:
          setup:
            - "A region with no vouchers issued in it."
