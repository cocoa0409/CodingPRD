# =============================================================================
# Final Expense & Burial Insurance — benchmark seed tables (SCAFFOLD.yaml)
# Difficulty band: EXPERT (§0.4)
# Sections §1.0–§1.7. The §1.8 / §1.9 design indexes live in the sibling files
# SCAFFOLD_DIFFICULTY_DESIGN.yaml and SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Final Expense & Burial Insurance (Lincoln Heritage style): simplified-issue
  underwriting & age band, guaranteed vs graded benefit, premium & face-amount
  tiers, beneficiary & funeral-home assignment, contestability/graded payout,
  lapse/reinstatement, claim & death-certificate, policy-loan/cash value

domain_name: final-expense-burial-insurance

# Flat, multi-collection topology: ProductPlan / Applicant / Application / Policy
# are peer top-level collections linked by foreign keys (not nested under a single
# root). api_prefix is the bare root "/" so every collection sits directly beneath
# it (e.g. /policies, /applications, /claims). Sub-resources hang off /policies/{id}
# and /claims/{id}; everything else is reached by filtered-list GETs.
api_prefix: /

complexity_profile:
  primary_archetype: "Ledger reconciliation"        # same death event, graded vs guaranteed payout algorithms diverge
  secondary_archetype: "Compliance / audit"         # contestability window, simplified-issue knockout, append-only ledger
  complexity_layers:
    - "Dual-variant calculation"                    # graded vs guaranteed payout; gross vs net surrender value
    - "Cascading side effects"                      # claim-approve -> policy-terminate -> loan-settle; missed-payment -> lapse -> loan-call
    - "Optimistic concurrency"                       # OCC on Policy.version for loan disbursement (CREATE-with-supersede draws on shared cash value)
    - "Rate / threshold triggers"                   # age-band cutoff, graded-period boundary, cash-value vesting threshold

  entity_topology: flat                              # peer entities with FK references; no nesting in URL paths beyond policy/claim children
  state_machine_shape: parallel                      # Policy carries coverage_status x payment_status as independent dimensions; also cyclic (ACTIVE<->LAPSED)
  relationship_patterns:
    - one_to_many                                    # Policy has many Beneficiaries / PremiumPayments / PolicyLoans / LedgerEntries
    - cross_aggregate                                # Claim references Policy across aggregate boundary; PolicyLoan reads Policy cash value

  role_model: peer_roles                             # Underwriter, PolicyAdmin, ClaimsExaminer, Policyholder own different resource types
  consistency_model: immediate                       # all mutations atomic within a single request; derived ledger fields recomputed in-request

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---- Configuration -------------------------------------------------------
  - name: ProductPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan display name, e.g. 'Heritage Funeral Advantage'" }
      - { name: benefit_type, type: enum, source: input, description: "Underwriting/benefit class", constraints: "one of GUARANTEED_ISSUE | GRADED_BENEFIT | LEVEL_BENEFIT" }
      - { name: min_issue_age, type: integer, source: input, description: "Minimum attained age (years) eligible to apply", default: 45 }
      - { name: max_issue_age, type: integer, source: input, description: "Maximum attained age (years) eligible to apply; applicant age must be <= this value", default: 85 }
      - { name: graded_period_months, type: integer, source: input, description: "Months from issue during which a non-accidental death pays the graded benefit instead of full face (0 for LEVEL_BENEFIT)", default: 24 }
      - { name: contestability_period_months, type: integer, source: input, description: "Months from issue during which the carrier may contest/rescind for material misrepresentation", default: 24 }
      - { name: graded_refund_apr, type: number, source: input, description: "Annual simple-interest rate applied to returned premiums when a graded-period non-accidental death pays the graded benefit", default: 0.10 }
      - { name: base_monthly_rate_per_1000_cents, type: integer, source: input, description: "Base monthly premium in cents per $1000 of face, before age-band and class multipliers", default: 400 }
      - { name: face_tiers, type: array, source: input, description: "Ordered face-amount tiers, each { tier_name, min_face_cents, max_face_cents, tier_load_pct }; selects a premium load by requested face" }
      - { name: age_bands, type: array, source: input, description: "Ordered age bands, each { band_name, min_age, max_age, age_factor }; min_age inclusive, max_age inclusive" }
      - { name: cash_value_factor_per_1000_cents, type: integer, source: input, description: "Guaranteed cash value accrued in cents per $1000 of face per full policy-year in force after the vesting threshold", default: 1500 }
      - { name: cash_value_vesting_years, type: integer, source: input, description: "Whole policy-years in force before any cash value vests (loans/surrender blocked before this)", default: 3 }
      - { name: max_loan_to_cash_value_pct, type: number, source: input, description: "Maximum fraction of net cash value that may be outstanding as a loan", default: 0.90 }
      - { name: loan_apr, type: number, source: input, description: "Annual simple-interest rate charged on policy loan principal", default: 0.08 }
      - { name: loan_cooldown_days, type: integer, source: input, description: "Days that must elapse after a loan is SETTLED before a new loan may be disbursed", default: 30 }
      - { name: surrender_charge_tiers, type: array, source: input, description: "Ordered surrender-charge tiers keyed on gross cash value, each { min_gross_cents, max_gross_cents, charge_pct }" }
      - { name: grace_period_days, type: integer, source: input, description: "Days past a premium due date before the policy lapses for non-payment", default: 31 }
      - { name: reinstatement_window_days, type: integer, source: input, description: "Days after lapse during which reinstatement (with back-premiums) is permitted", default: 180 }

  # ---- People & application ------------------------------------------------
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal full name of the proposed insured" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (ISO 8601 date); attained age is computed against the issue/effective date" }
      - { name: gender, type: enum, source: input, description: "Rating gender", constraints: "one of MALE | FEMALE" }
      - { name: tobacco_use, type: boolean, source: input, description: "Whether applicant uses tobacco (drives rating class)" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of residence" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; the proposed insured" }
      - { name: product_plan_id, type: string, source: input, description: "FK -> ProductPlan.id; the plan applied for" }
      - { name: requested_face_amount_cents, type: integer, source: input, description: "Requested death benefit (face) in cents" }
      - { name: rating_class, type: enum, source: computed, description: "Derived rating class from questionnaire + tobacco", constraints: "one of STANDARD | TOBACCO | SUBSTANDARD | DECLINE" }
      - { name: attained_age, type: integer, source: computed, description: "Whole-year attained age of the applicant on the application's created_at date" }
      - { name: quoted_monthly_premium_cents, type: integer, source: computed, description: "Premium computed at APPROVED via the premium_rate calculation; 0 until approved" }
      - { name: decline_reason, type: enum, source: system, description: "Populated when DECLINED", constraints: "one of AGE_OUT_OF_BAND | KNOCKOUT_CONDITION | FACE_OUT_OF_RANGE | null" }
      - { name: status, type: enum, source: system, description: "Underwriting lifecycle", constraints: "DRAFT -> SUBMITTED -> {APPROVED, REFERRED, DECLINED}; REFERRED -> {APPROVED, DECLINED}; APPROVED -> ISSUED; terminal: ISSUED, DECLINED, WITHDRAWN" }

  - name: HealthQuestionnaire
    parent: Application
    common_fields: false
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this questionnaire answers" }
      - { name: terminal_illness, type: boolean, source: input, description: "Knockout answer: diagnosed terminal illness / hospice" }
      - { name: aids_hiv, type: boolean, source: input, description: "Knockout answer: AIDS/HIV diagnosis" }
      - { name: nursing_home_confined, type: boolean, source: input, description: "Knockout answer: currently confined to nursing home" }
      - { name: major_condition_last_2y, type: boolean, source: input, description: "Graded-trigger answer: cancer/heart/stroke treatment within 2 years (forces GRADED_BENEFIT eligibility on a LEVEL plan, or SUBSTANDARD class)" }
      - { name: knockout_triggered, type: boolean, source: computed, description: "true if any of terminal_illness, aids_hiv, nursing_home_confined is true" }

  # ---- The policy and its children ----------------------------------------
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; the application that produced this policy" }
      - { name: product_plan_id, type: string, source: system, description: "FK -> ProductPlan.id; pinned plan at issue" }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; the insured" }
      - { name: policyholder_user_id, type: string, source: input, description: "Opaque Policyholder user id who owns/services this policy (set at issue, equals the X-User-ID of the owning Policyholder)" }
      - { name: face_amount_cents, type: integer, source: system, description: "Death benefit face, pinned from the application at issue" }
      - { name: monthly_premium_cents, type: integer, source: system, description: "Monthly premium pinned at issue from the application quote" }
      - { name: benefit_type, type: enum, source: system, description: "Pinned from plan at issue", constraints: "GUARANTEED_ISSUE | GRADED_BENEFIT | LEVEL_BENEFIT" }
      - { name: issue_date, type: datetime, source: system, description: "ISO 8601 timestamp the policy was issued; graded/contestability windows are measured from this" }
      - { name: paid_through_date, type: datetime, source: computed, description: "Exclusive upper bound of contiguous covered coverage; equals issue_date when no premium yet posted" }
      - { name: due_date, type: datetime, source: computed, description: "Next premium due date = paid_through_date; grace runs grace_period_days past this" }
      - { name: coverage_status, type: enum, source: system, description: "Coverage dimension (independent of payment_status)", constraints: "PENDING -> ACTIVE -> {LAPSED, TERMINATED, SURRENDERED}; LAPSED -> ACTIVE (reinstatement); terminal: TERMINATED, SURRENDERED, RESCINDED" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension (independent of coverage_status)", constraints: "CURRENT | GRACE | DELINQUENT" }
      - { name: total_premiums_paid_cents, type: integer, source: computed, description: "Sum of POSTED PremiumPayment.amount_cents for this policy minus REVERSED ones; conserved invariant for reversal" }
      - { name: gross_cash_value_cents, type: integer, source: computed, description: "Guaranteed cash value accrued from in-force whole-years past vesting; ignores loans" }
      - { name: outstanding_loan_balance_cents, type: integer, source: computed, description: "Sum of principal + accrued interest over all ACTIVE PolicyLoans" }
      - { name: net_cash_value_cents, type: integer, source: computed, description: "gross_cash_value_cents - outstanding_loan_balance_cents (floored at 0)" }

  - name: Beneficiary
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy this beneficiary is designated on" }
      - { name: full_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: relationship, type: enum, source: input, description: "Relationship to insured", constraints: "one of SPOUSE | CHILD | SIBLING | PARENT | ESTATE | OTHER" }
      - { name: share_pct, type: integer, source: input, description: "Whole-percent share of the residual death benefit (after any funeral-home assignment); active beneficiary shares must sum to exactly 100" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> REVOKED", constraints: "ACTIVE | REVOKED" }

  - name: FuneralHomeAssignment
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy assigned to a funeral home" }
      - { name: funeral_home_name, type: string, source: input, description: "Assignee funeral home" }
      - { name: assigned_benefit_cents, type: integer, source: input, description: "Fixed dollar amount of the death benefit assigned to the funeral home (paid first, off the top, before residual beneficiary split)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RELEASED", constraints: "ACTIVE | RELEASED" }

  - name: PremiumPayment
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Premium amount tendered in cents" }
      - { name: coverage_start, type: datetime, source: input, description: "Inclusive start of the coverage interval this payment buys (half-open [coverage_start, coverage_end))" }
      - { name: coverage_end, type: datetime, source: input, description: "Exclusive end of the coverage interval this payment buys" }
      - { name: posted_date, type: datetime, source: system, description: "Logical-clock timestamp the payment was posted" }
      - { name: status, type: enum, source: system, description: "POSTED -> REVERSED", constraints: "POSTED | REVERSED" }

  - name: PolicyLoan
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy borrowed against" }
      - { name: expected_policy_version, type: integer, source: input, description: "OCC guard: the Policy.version the client last observed; rejected if stale (loan draws on shared cash value)" }
      - { name: principal_cents, type: integer, source: input, description: "Loan principal disbursed in cents" }
      - { name: disbursed_date, type: datetime, source: system, description: "Logical-clock timestamp the loan was disbursed; interest accrues from here" }
      - { name: settled_date, type: datetime, source: system, description: "Logical-clock timestamp the loan was fully repaid (SETTLED); null while ACTIVE" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Simple interest at loan_apr from disbursed_date to current clock on the principal" }
      - { name: repaid_principal_cents, type: integer, source: system, description: "Cumulative principal repaid", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE -> {SETTLED, CALLED}; CALLED -> SETTLED", constraints: "ACTIVE | SETTLED | CALLED" }

  # ---- Claims --------------------------------------------------------------
  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy a death benefit is claimed against" }
      - { name: date_of_death, type: datetime, source: input, description: "Date of death (ISO 8601 date); compared to graded/contestability windows measured from Policy.issue_date" }
      - { name: manner_of_death, type: enum, source: input, description: "Accidental deaths bypass the graded period; natural deaths inside the graded window pay the graded benefit", constraints: "one of NATURAL | ACCIDENTAL" }
      - { name: gross_benefit_cents, type: integer, source: computed, description: "Death benefit before loan offset, via the claim_payout calculation (graded vs guaranteed variant)" }
      - { name: loan_offset_cents, type: integer, source: computed, description: "Outstanding loan balance deducted from the payout at approval" }
      - { name: net_payout_cents, type: integer, source: computed, description: "gross_benefit_cents - loan_offset_cents (floored at 0)" }
      - { name: payout_basis, type: enum, source: computed, description: "Which payout variant fired", constraints: "one of FULL_FACE | GRADED_REFUND | null" }
      - { name: denial_reason, type: enum, source: system, description: "Populated when DENIED", constraints: "one of MISREPRESENTATION | POLICY_NOT_IN_FORCE | EXCLUDED_CAUSE | null" }
      - { name: status, type: enum, source: system, description: "FILED -> UNDER_REVIEW -> {APPROVED, DENIED, CONTESTING}; CONTESTING -> {APPROVED, DENIED}; terminal: APPROVED, DENIED" }

  - name: DeathCertificate
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim this certificate substantiates" }
      - { name: certificate_number, type: string, source: input, description: "Official certificate number" }
      - { name: certified_cause, type: enum, source: input, description: "Cause classification on the certificate", constraints: "one of ILLNESS | ACCIDENT | HOMICIDE | SUICIDE | UNDETERMINED" }
      - { name: verified, type: boolean, source: input, description: "Whether the examiner verified the certificate as authentic" }

  - name: LedgerEntry
    parent: Policy
    common_fields: false
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy whose ledger this entry belongs to" }
      - { name: entry_type, type: enum, source: system, description: "Append-only money/coverage event", constraints: "one of PREMIUM_POSTED | PREMIUM_REVERSED | LOAN_DISBURSED | LOAN_REPAID | CASH_VALUE_ACCRUED | BENEFIT_PAID | LOAN_OFFSET" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents (credits positive, debits negative)" }
      - { name: balance_after_cents, type: integer, source: system, description: "Net cash value after this entry" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp of the event" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Application: branching fork-join with a revert into REFERRED --------
  - entity: Application
    initial_state: DRAFT
    terminal_states: [ISSUED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Underwriter
        preconditions:
          - "Application has exactly one HealthQuestionnaire (ERR_QUESTIONNAIRE_MISSING)"
          - "requested_face_amount_cents falls inside some ProductPlan.face_tiers tier (else DECLINED with FACE_OUT_OF_RANGE is NOT raised here; see automatic decline below)"
        side_effects:
          - "Compute attained_age from Applicant.date_of_birth vs Application.created_at"
          - "Auto-evaluate simplified-issue: if knockout_triggered OR attained_age out of [min_issue_age, max_issue_age] OR face out of range, machine auto-advances SUBMITTED -> DECLINED (see next transition); else routes to APPROVED or REFERRED"

      - from: SUBMITTED
        to: DECLINED
        trigger: "system (automatic at submit when a hard knockout fires)"
        actor: system
        preconditions:
          - "HealthQuestionnaire.knockout_triggered is true OR attained_age < ProductPlan.min_issue_age OR attained_age > ProductPlan.max_issue_age OR requested_face_amount_cents outside all face_tiers"
        side_effects:
          - "Set decline_reason: KNOCKOUT_CONDITION if knockout, AGE_OUT_OF_BAND if age, FACE_OUT_OF_RANGE if face (knockout checked before age, age before face)"

      - from: SUBMITTED
        to: REFERRED
        trigger: "system (automatic at submit when a soft flag fires and no knockout)"
        actor: system
        preconditions:
          - "No knockout AND age in band AND face in range AND HealthQuestionnaire.major_condition_last_2y is true on a LEVEL_BENEFIT plan"
        side_effects:
          - "Mark for manual underwriting; no premium quoted yet"

      - from: SUBMITTED
        to: APPROVED
        trigger: "system (automatic at submit when clean) OR POST /applications/{id}/approve"
        actor: system | Underwriter
        preconditions:
          - "No knockout AND age in [min_issue_age, max_issue_age] AND face in range AND not REFERRED"
        side_effects:
          - "Compute rating_class (TOBACCO if Applicant.tobacco_use, else STANDARD; SUBSTANDARD if major_condition_last_2y on GRADED/GUARANTEED plan)"
          - "Compute quoted_monthly_premium_cents via premium_rate calculation"

      - from: REFERRED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: Underwriter
        preconditions:
          - "Application is REFERRED (ERR_INVALID_STATE)"
        side_effects:
          - "Compute rating_class and quoted_monthly_premium_cents via premium_rate calculation"

      - from: REFERRED
        to: DECLINED
        trigger: "POST /applications/{id}/decline"
        actor: Underwriter
        preconditions:
          - "Application is REFERRED (ERR_INVALID_STATE)"
        side_effects:
          - "Set decline_reason = KNOCKOUT_CONDITION"

      - from: APPROVED
        to: ISSUED
        trigger: "POST /applications/{id}/issue"
        actor: PolicyAdmin
        preconditions:
          - "Application is APPROVED (ERR_INVALID_STATE)"
          - "Request supplies policyholder_user_id (ERR_VALIDATION)"
        side_effects:
          - "CASCADE depth-2: create a Policy (coverage_status=PENDING, payment_status=CURRENT) pinning face_amount_cents, monthly_premium_cents, benefit_type, applicant_id, product_plan_id"
          - "Set Policy.issue_date = current clock; set paid_through_date = issue_date; set due_date = issue_date"
          - "Policy auto-advances PENDING -> ACTIVE on issue"
          - "Append LedgerEntry CASH_VALUE_ACCRUED with amount 0, balance_after 0"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Underwriter | PolicyAdmin
        preconditions: []
        side_effects: []

  # ---- Policy: PARALLEL dimensions (coverage_status x payment_status) +
  #      CYCLIC (ACTIVE <-> LAPSED via lapse/reinstatement) ------------------
  - entity: Policy
    initial_state: PENDING
    terminal_states: [TERMINATED, SURRENDERED, RESCINDED]
    transitions:
      # coverage dimension
      - from: PENDING
        to: ACTIVE
        trigger: "system (on Application issue)"
        actor: system
        preconditions: []
        side_effects:
          - "coverage_status=ACTIVE, payment_status=CURRENT"

      - from: ACTIVE
        to: LAPSED
        trigger: "POST /policies/{id}/lapse OR system (clock advance past due_date + grace_period_days with payment_status=DELINQUENT)"
        actor: PolicyAdmin | system
        preconditions:
          - "Policy.coverage_status is ACTIVE (ERR_INVALID_STATE)"
          - "current clock >= due_date + grace_period_days (ERR_GRACE_NOT_EXPIRED) when triggered manually"
        side_effects:
          - "coverage_status=LAPSED, payment_status=DELINQUENT"
          - "CASCADE depth-3 step 2: each ACTIVE PolicyLoan on this policy transitions ACTIVE -> CALLED (loan called due on lapse)"
          - "Open reinstatement window [lapse instant, lapse instant + reinstatement_window_days]"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /policies/{id}/reinstate"
        actor: PolicyAdmin
        preconditions:
          - "Policy.coverage_status is LAPSED (ERR_INVALID_STATE)"
          - "current clock <= lapse instant + reinstatement_window_days (ERR_REINSTATEMENT_WINDOW_CLOSED)"
          - "All back-premium PremiumPayments posted so paid_through_date >= current due cycle (ERR_BACK_PREMIUM_DUE)"
        side_effects:
          - "coverage_status=ACTIVE, payment_status=CURRENT"
          - "Each CALLED PolicyLoan transitions CALLED -> ACTIVE (loan reinstated)"
          - "graded/contestability windows are NOT reset (measured from original issue_date)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "system (on Claim approval, death-benefit paid)"
        actor: system
        preconditions: []
        side_effects:
          - "coverage_status=TERMINATED"
          - "CASCADE depth-3 step 3: each ACTIVE or CALLED PolicyLoan transitions to SETTLED (balance netted against the death benefit as loan_offset)"

      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /policies/{id}/surrender"
        actor: Policyholder | PolicyAdmin
        preconditions:
          - "Policy.coverage_status is ACTIVE (ERR_INVALID_STATE)"
          - "Whole policy-years in force >= cash_value_vesting_years (ERR_CASH_VALUE_NOT_VESTED)"
          - "No FILED/UNDER_REVIEW/CONTESTING Claim exists for this policy (ERR_CLAIM_IN_PROGRESS)"
        side_effects:
          - "coverage_status=SURRENDERED"
          - "Compute net surrender value via net_surrender_value calculation; each ACTIVE PolicyLoan -> SETTLED"
          - "Append LedgerEntry BENEFIT_PAID for the surrender amount"

      - from: ACTIVE
        to: RESCINDED
        trigger: "system (on Claim denial for MISREPRESENTATION inside contestability window)"
        actor: system
        preconditions:
          - "date_of_death within contestability_period_months of issue_date"
        side_effects:
          - "coverage_status=RESCINDED; premiums refundable per carrier policy (out of scope for payout)"

      # payment dimension (independent of coverage dimension)
      - from: CURRENT
        to: GRACE
        trigger: "system (clock advance past due_date, within grace_period_days)"
        actor: system
        preconditions:
          - "current clock > due_date AND current clock < due_date + grace_period_days"
        side_effects:
          - "payment_status=GRACE; coverage_status unchanged (remains ACTIVE — parallel dimension)"

      - from: GRACE
        to: DELINQUENT
        trigger: "system (clock advance to/past due_date + grace_period_days)"
        actor: system
        preconditions:
          - "current clock >= due_date + grace_period_days"
        side_effects:
          - "payment_status=DELINQUENT (coverage_status still ACTIVE until lapse fires)"

      - from: GRACE
        to: CURRENT
        trigger: "system (on PremiumPayment post that advances paid_through_date past current clock)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status=CURRENT"

      - from: DELINQUENT
        to: CURRENT
        trigger: "system (on reinstatement back-premium post)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_status=CURRENT"

  # ---- PolicyLoan: ACTIVE -> {SETTLED, CALLED}; CALLED -> SETTLED ----------
  - entity: PolicyLoan
    initial_state: ACTIVE
    terminal_states: [SETTLED]
    transitions:
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /policy-loans/{id}/repay (full repayment)"
        actor: Policyholder | PolicyAdmin
        preconditions:
          - "Repayment amount >= principal_cents - repaid_principal_cents + accrued_interest_cents (ERR_LOAN_UNDERPAID)"
        side_effects:
          - "status=SETTLED, settled_date=current clock"
          - "outstanding_loan_balance_cents recomputed on Policy; net_cash_value_cents restored (compensating invariant)"
          - "Append LedgerEntry LOAN_REPAID (+principal)"

      - from: ACTIVE
        to: CALLED
        trigger: "system (on Policy lapse)"
        actor: system
        preconditions: []
        side_effects:
          - "status=CALLED (loan called due; interest continues to accrue)"

      - from: CALLED
        to: SETTLED
        trigger: "POST /policy-loans/{id}/repay OR system (on Claim approval netting)"
        actor: Policyholder | PolicyAdmin | system
        preconditions: []
        side_effects:
          - "status=SETTLED, settled_date=current clock"

  # ---- PremiumPayment: POSTED -> REVERSED (compensating action) -------------
  - entity: PremiumPayment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /premium-payments/{id}/reverse"
        actor: PolicyAdmin
        preconditions:
          - "PremiumPayment is POSTED (ERR_INVALID_STATE)"
        side_effects:
          - "status=REVERSED; recompute Policy.total_premiums_paid_cents and paid_through_date back to their pre-post values (compensating invariant)"
          - "Append LedgerEntry PREMIUM_REVERSED"

  # ---- Claim: branching fork-join with CONTESTING investigation branch -----
  - entity: Claim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/start-review"
        actor: ClaimsExaminer
        preconditions:
          - "A DeathCertificate exists for the claim (ERR_DEATH_CERTIFICATE_MISSING)"
        side_effects:
          - "Compute provisional gross_benefit_cents via claim_payout calculation (graded vs guaranteed variant) and payout_basis"

      - from: UNDER_REVIEW
        to: CONTESTING
        trigger: "POST /claims/{id}/contest"
        actor: ClaimsExaminer
        preconditions:
          - "date_of_death within contestability_period_months of Policy.issue_date (ERR_OUTSIDE_CONTESTABILITY)"
        side_effects:
          - "Mark claim for misrepresentation investigation"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsExaminer
        preconditions:
          - "Policy.coverage_status is ACTIVE (ERR_POLICY_NOT_IN_FORCE)"
          - "DeathCertificate.verified is true (ERR_CERTIFICATE_NOT_VERIFIED)"
        side_effects:
          - "Finalize gross_benefit_cents and payout_basis; set loan_offset_cents = Policy.outstanding_loan_balance_cents; net_payout_cents = gross - offset (floored 0)"
          - "CASCADE depth-3 step 1: Policy ACTIVE -> TERMINATED (which then settles loans — see Policy machine)"
          - "Append LedgerEntry BENEFIT_PAID and (if offset>0) LOAN_OFFSET"

      - from: CONTESTING
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsExaminer
        preconditions:
          - "DeathCertificate.verified is true (ERR_CERTIFICATE_NOT_VERIFIED)"
          - "Policy.coverage_status is ACTIVE (ERR_POLICY_NOT_IN_FORCE)"
        side_effects:
          - "Same finalize + cascade as UNDER_REVIEW -> APPROVED"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsExaminer
        preconditions: []
        side_effects:
          - "Set denial_reason from request (POLICY_NOT_IN_FORCE | EXCLUDED_CAUSE); net_payout_cents=0"

      - from: CONTESTING
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsExaminer
        preconditions: []
        side_effects:
          - "Set denial_reason=MISREPRESENTATION; if within contestability window, Policy ACTIVE -> RESCINDED; net_payout_cents=0"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: loan-disburse-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policy-loans"
    occ_field: "expected_policy_version"
    description: |
      Disbursing a PolicyLoan against a Policy whose version has advanced since
      the client last observed it is rejected. A loan draws on the shared net
      cash value; if another loan (or a premium post / reinstatement that bumped
      the policy) has already moved that figure, the current writer's view of the
      available cash value is stale and the disbursement must re-read first.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- premium_rate: combinatorial mode (a) — >=3 inputs, tiered selection,
  #      nested min/max, conditional branch on rating class --------------------
  - name: premium_rate
    trigger: "Application APPROVED (POST /applications/{id}/approve or auto-approve at submit)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: face_amount_cents, attained_age, rating_class, ProductPlan rates/tiers.
      face_units = face_amount_cents / 100000           # number of $1000 units (face in cents / 100000)
      age_factor = age_factor of the band where min_age <= attained_age <= max_age   # from ProductPlan.age_bands
      tier_load_pct = tier_load_pct of the face_tier where min_face_cents <= face <= max_face_cents
      class_mult = 1.00 if rating_class == STANDARD
                 = 1.50 if rating_class == TOBACCO
                 = 2.00 if rating_class == SUBSTANDARD
      raw = base_monthly_rate_per_1000_cents * face_units * age_factor
      loaded = raw * (1 + tier_load_pct)
      premium_cents = round_half_up( loaded * class_mult )
      # Evaluation order is pinned: raw -> apply tier load -> apply class multiplier -> round ONCE at the end.
    input_set: "the single Application being approved; ProductPlan pinned by product_plan_id"
    constants:
      CLASS_MULT_STANDARD: 1.00
      CLASS_MULT_TOBACCO: 1.50
      CLASS_MULT_SUBSTANDARD: 2.00
    precision: "round_half_up to whole cents, applied exactly once after all multipliers"

  # ---- claim_payout: DUAL-VARIANT (graded vs guaranteed) AND combinatorial
  #      mode (b) — nested rounding where order is pinned (per-payment interest
  #      then sum, NOT sum then interest) ------------------------------------
  - name: claim_payout
    trigger: "Claim start-review (provisional) and Claim approve (final)"
    algorithm: forward_looking
    formula: |
      months_in_force = whole months from Policy.issue_date to Claim.date_of_death
      within_graded = (Policy.benefit_type in {GRADED_BENEFIT, LEVEL_BENEFIT-with-graded})
                      AND months_in_force < ProductPlan.graded_period_months
                      AND Claim.manner_of_death == NATURAL
      if NOT within_graded:
        payout_basis = FULL_FACE
        gross_benefit_cents = Policy.face_amount_cents          # guaranteed full-face variant
      else:
        payout_basis = GRADED_REFUND                            # graded variant
        # Refund premiums paid + simple interest. ROUNDING ORDER IS PINNED:
        # compute interest per POSTED (non-reversed) PremiumPayment, round each
        # to whole cents, THEN sum — NOT sum-then-round.
        for each POSTED PremiumPayment p (exclude REVERSED):
          days = (Claim.date_of_death - p.posted_date) in whole days, floored at 0
          interest_p = round_half_up( p.amount_cents * graded_refund_apr * days / 365 )
          refund += p.amount_cents + interest_p
        gross_benefit_cents = refund
      # ACCIDENTAL deaths always pay FULL_FACE regardless of graded window.
    input_set: "POSTED (non-REVERSED) PremiumPayments for the claim's policy"
    constants:
      DAYS_PER_YEAR: 365
    precision: "round_half_up; per-payment interest rounded to cents BEFORE summation (pinned order)"
    variants:
      - name: guaranteed_full_face
        when: "death is ACCIDENTAL, OR outside graded window, OR benefit_type GUARANTEED_ISSUE after graded window, OR LEVEL_BENEFIT outside graded"
        difference: "pays Policy.face_amount_cents in full"
      - name: graded_refund
        when: "NATURAL death inside the graded window on a GRADED/LEVEL graded plan"
        difference: "pays sum of premiums paid + per-payment simple interest (NOT full face)"

  # ---- net_surrender_value: DUAL-VARIANT on a DIFFERENT entity domain (Policy
  #      cash value, not Claim) AND combinatorial mode (c) — circular-looking
  #      dependency: surrender charge is keyed on a tier of GROSS cash value,
  #      then subtracted from gross; loan balance also nets out; order pinned --
  - name: net_surrender_value
    trigger: "Policy surrender (POST /policies/{id}/surrender)"
    algorithm: constraint_propagation
    formula: |
      # Step 1: gross cash value (independent of loans).
      whole_years = floor( whole policy-years from issue_date to current clock )
      vested_years = max(0, whole_years - cash_value_vesting_years)
      face_units = face_amount_cents / 100000
      gross_cash_value_cents = cash_value_factor_per_1000_cents * face_units * vested_years
      # Step 2: surrender charge is keyed on a tier of the GROSS value (circular-
      # looking: charge depends on gross, applied to gross). EVALUATION ORDER PINNED:
      # resolve gross FIRST, select tier by gross, THEN apply charge, THEN net loans.
      charge_pct = charge_pct of surrender_charge_tiers tier where
                   min_gross_cents <= gross_cash_value_cents <= max_gross_cents
      charge_cents = round_half_up( gross_cash_value_cents * charge_pct )
      after_charge = gross_cash_value_cents - charge_cents
      # Step 3: net out outstanding loan balance.
      net_surrender_cents = max(0, after_charge - Policy.outstanding_loan_balance_cents)
    input_set: "the single Policy being surrendered and its ACTIVE PolicyLoans"
    constants:
      DAYS_PER_YEAR: 365
    precision: "round_half_up on the charge; final value floored at 0"
    variants:
      - name: gross_cash_value
        when: "displayed on Policy.gross_cash_value_cents and used for loan limits"
        difference: "ignores surrender charge and loan balance"
      - name: net_surrender_proceeds
        when: "amount actually paid out on surrender"
        difference: "subtracts the gross-keyed surrender charge AND the outstanding loan balance"

  # ---- loan_interest: simple-interest accrual on outstanding loan principal --
  - name: loan_interest
    trigger: "read of PolicyLoan.accrued_interest_cents; loan repay; claim loan_offset"
    algorithm: aggregation
    formula: |
      outstanding_principal = principal_cents - repaid_principal_cents
      days = (current clock - disbursed_date) in whole days, floored at 0
      accrued_interest_cents = round_half_up( outstanding_principal * loan_apr * days / 365 )
      loan_balance_cents = outstanding_principal + accrued_interest_cents
    input_set: "the single PolicyLoan"
    constants:
      DAYS_PER_YEAR: 365
    precision: "round_half_up to whole cents"

  # ---- death_benefit_split: waterfall — funeral home off the top, residual
  #      split across ACTIVE beneficiaries by share_pct -----------------------
  - name: death_benefit_split
    trigger: "Claim approve (allocation of net_payout_cents)"
    algorithm: waterfall_allocation
    formula: |
      pool = Claim.net_payout_cents
      # Bucket 1 (priority): ACTIVE FuneralHomeAssignment, paid off the top.
      fh_paid = min(pool, sum of ACTIVE FuneralHomeAssignment.assigned_benefit_cents)
      residual = pool - fh_paid
      # Bucket 2: residual split across ACTIVE Beneficiaries by share_pct.
      # Round each share DOWN; allocate the remainder cents one-by-one to
      # beneficiaries ordered by created_at ASC (deterministic; never by id).
      for each ACTIVE Beneficiary b (ordered created_at ASC):
        b_share = floor( residual * b.share_pct / 100 )
      remainder = residual - sum(b_share)
      distribute remainder one cent at a time to beneficiaries in created_at ASC order
    input_set: "ACTIVE FuneralHomeAssignments and ACTIVE Beneficiaries on the policy"
    constants: {}
    precision: "floor per-beneficiary; remainder cents allocated by created_at ASC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "On a Policyholder-scoped mutation, X-User-ID must equal Policy.policyholder_user_id"
    error_id: ERR_NOT_POLICY_OWNER
    http_status: 403
    applies_to: "POST /policies/{id}/surrender, POST /policy-loans (as Policyholder), POST /policy-loans/{id}/repay (as Policyholder)"

  - priority: 5
    category: state
    check: "Target resource is in a state where the transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, amounts > 0, enums valid, share_pct in 1..100"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all create/mutation endpoints

  # ---- Claim filing: PRIORITY CONFLICT pair #1 (state vs business_temporal) -
  - priority: 7
    category: state
    check: "Claim may be filed only when Policy.coverage_status is ACTIVE or LAPSED-within-reinstatement (not TERMINATED/SURRENDERED/RESCINDED/PENDING)"
    error_id: ERR_POLICY_NOT_IN_FORCE
    http_status: 409
    applies_to: "POST /claims"

  - priority: 8
    category: business_temporal
    check: "Claim.date_of_death must be >= Policy.issue_date (cannot predate coverage)"
    error_id: ERR_DEATH_BEFORE_ISSUE
    http_status: 422
    applies_to: "POST /claims"

  # ---- Beneficiary designation: PRIORITY CONFLICT pair #2
  #      (business_referential vs business_constraint) ----------------------
  - priority: 9
    category: business_referential
    check: "Beneficiary may only be added to a Policy whose coverage_status is ACTIVE or LAPSED (not terminal)"
    error_id: ERR_POLICY_NOT_DESIGNABLE
    http_status: 409
    applies_to: "POST /policies/{id}/beneficiaries, POST /policies/{id}/funeral-home-assignment"

  - priority: 10
    category: business_constraint
    check: "After the write, sum of ACTIVE Beneficiary.share_pct on the policy must be <= 100 (incremental designation; remainder defaults to ESTATE at payout). Exactly-100 is enforced separately at claim approval."
    error_id: ERR_SHARES_EXCEED_100
    http_status: 422
    applies_to: "POST /policies/{id}/beneficiaries"

  # ---- Loan & surrender fiscal checks (lowest priority) ------------------
  - priority: 11
    category: business_temporal
    check: "Loan cooldown: new loan disbursed_date must be >= prior SETTLED loan.settled_date + loan_cooldown_days"
    error_id: ERR_LOAN_COOLDOWN_OVERLAP
    http_status: 409
    applies_to: "POST /policy-loans"

  - priority: 12
    category: business_fiscal
    check: "Outstanding loan + new principal must be <= max_loan_to_cash_value_pct * net_cash_value_cents; and policy must be past cash_value_vesting_years"
    error_id: ERR_LOAN_EXCEEDS_CASH_VALUE
    http_status: 422
    applies_to: "POST /policy-loans"

  - priority: 13
    category: business_temporal
    check: "PremiumPayment coverage interval [coverage_start, coverage_end) must not overlap an existing POSTED payment's interval on the same policy (adjacency where prior.coverage_end == new.coverage_start is allowed)"
    error_id: ERR_COVERAGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /premium-payments"

  - priority: 14
    category: business_constraint
    check: "PremiumPayment coverage_start must be < coverage_end"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /premium-payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving; default 2026-01-01T00:00:00Z) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads the fixed startup default 2026-01-01T00:00:00Z (never real wall-clock). All grace/graded/contestability/reinstatement/interest windows are measured against this clock."
    roles: [PolicyAdmin, Underwriter, ClaimsExaminer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Logical clock = to_iso8601"
      - "Recompute payment_status / coverage_status auto-transitions for all policies whose grace/lapse thresholds are now crossed"

  - method: GET
    path: "/_clock"
    description: "Read the current logical clock value"
    roles: [PolicyAdmin, Underwriter, ClaimsExaminer, Policyholder]
    code: 200
    input: []
    output: null
    side_effects: []

  # ---- ProductPlan ---------------------------------------------------------
  - method: POST
    path: "/product-plans"
    description: "Create a ProductPlan (config)"
    roles: [PolicyAdmin]
    code: 201
    input: ["name", "benefit_type", "min_issue_age?", "max_issue_age?", "graded_period_months?", "contestability_period_months?", "graded_refund_apr?", "base_monthly_rate_per_1000_cents?", "face_tiers", "age_bands", "cash_value_factor_per_1000_cents?", "cash_value_vesting_years?", "max_loan_to_cash_value_pct?", "loan_apr?", "loan_cooldown_days?", "surrender_charge_tiers", "grace_period_days?", "reinstatement_window_days?"]
    output: ProductPlan
    side_effects: []

  - method: GET
    path: "/product-plans/{id}"
    description: "Get a ProductPlan"
    roles: [PolicyAdmin, Underwriter, ClaimsExaminer, Policyholder]
    code: 200
    input: []
    output: ProductPlan
    side_effects: []

  - method: GET
    path: "/product-plans"
    description: "List ProductPlans"
    roles: [PolicyAdmin, Underwriter, ClaimsExaminer, Policyholder]
    code: 200
    input: ["benefit_type?"]
    output: "ProductPlan[]"
    side_effects: []

  # ---- Applicant -----------------------------------------------------------
  - method: POST
    path: "/applicants"
    description: "Create an Applicant"
    roles: [Underwriter, PolicyAdmin]
    code: 201
    input: [full_name, date_of_birth, gender, tobacco_use, state_code]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/applicants/{id}"
    description: "Get an Applicant"
    roles: [Underwriter, PolicyAdmin, ClaimsExaminer]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # ---- Application ----------------------------------------------------------
  - method: POST
    path: "/applications"
    description: "Create a DRAFT Application"
    roles: [Underwriter, PolicyAdmin]
    code: 201
    input: [applicant_id, product_plan_id, requested_face_amount_cents]
    output: Application
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/applications/{id}"
    description: "Get an Application"
    roles: [Underwriter, PolicyAdmin, ClaimsExaminer]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List Applications, filterable by applicant_id or product_plan_id (FK reverse-reachability)"
    roles: [Underwriter, PolicyAdmin]
    code: 200
    input: ["applicant_id?", "product_plan_id?", "status?"]
    output: "Application[]"
    side_effects: []

  - method: POST
    path: "/applications/{id}/questionnaire"
    description: "Attach the simplified-issue HealthQuestionnaire to an Application"
    roles: [Underwriter, PolicyAdmin]
    code: 201
    input: [terminal_illness, aids_hiv, nursing_home_confined, major_condition_last_2y]
    output: HealthQuestionnaire
    side_effects: ["compute knockout_triggered"]

  - method: GET
    path: "/health-questionnaires/{id}"
    description: "Get a HealthQuestionnaire"
    roles: [Underwriter, PolicyAdmin, ClaimsExaminer]
    code: 200
    input: []
    output: HealthQuestionnaire
    side_effects: []

  - method: GET
    path: "/health-questionnaires"
    description: "List HealthQuestionnaires filtered by application_id (FK reverse-reachability)"
    roles: [Underwriter, PolicyAdmin, ClaimsExaminer]
    code: 200
    input: ["application_id?"]
    output: "HealthQuestionnaire[]"
    side_effects: []

  - method: POST
    path: "/applications/{id}/submit"
    description: "Submit an Application for simplified-issue auto-adjudication"
    roles: [Underwriter]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Compute attained_age; auto-route SUBMITTED -> {DECLINED | REFERRED | APPROVED}"
      - "On APPROVED: compute rating_class and quoted_monthly_premium_cents (premium_rate)"

  - method: POST
    path: "/applications/{id}/approve"
    description: "Manually approve a REFERRED Application"
    roles: [Underwriter]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> APPROVED, compute rating_class + quoted_monthly_premium_cents"]

  - method: POST
    path: "/applications/{id}/decline"
    description: "Manually decline a REFERRED Application"
    roles: [Underwriter]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> DECLINED, decline_reason set"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "Withdraw a DRAFT Application"
    roles: [Underwriter, PolicyAdmin]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> WITHDRAWN"]

  - method: POST
    path: "/applications/{id}/issue"
    description: "Issue a Policy from an APPROVED Application (CASCADE depth-2)"
    roles: [PolicyAdmin]
    code: 201
    input: [policyholder_user_id]
    output: Policy
    side_effects:
      - "status -> ISSUED; create Policy (PENDING -> ACTIVE), pin face/premium/benefit_type, set issue_date/paid_through_date/due_date = clock"
      - "Append LedgerEntry CASH_VALUE_ACCRUED (0)"

  # ---- Policy --------------------------------------------------------------
  - method: GET
    path: "/policies/{id}"
    description: "Get a Policy (with computed cash-value/loan/coverage fields)"
    roles: [PolicyAdmin, ClaimsExaminer, Policyholder, Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["recompute gross/net cash value, outstanding_loan_balance, paid_through_date, due_date"]

  - method: GET
    path: "/policies"
    description: "List Policies, filterable by application_id / product_plan_id / applicant_id / policyholder_user_id (FK reverse-reachability)"
    roles: [PolicyAdmin, ClaimsExaminer, Underwriter]
    code: 200
    input: ["application_id?", "product_plan_id?", "applicant_id?", "policyholder_user_id?", "coverage_status?"]
    output: "Policy[]"
    side_effects: []

  - method: POST
    path: "/policies/{id}/lapse"
    description: "Lapse a Policy for non-payment (CASCADE depth-3 step 2: calls loans due)"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "coverage_status=LAPSED, payment_status=DELINQUENT"
      - "each ACTIVE PolicyLoan -> CALLED"

  - method: POST
    path: "/policies/{id}/reinstate"
    description: "Reinstate a LAPSED Policy within the reinstatement window (cyclic LAPSED -> ACTIVE)"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "coverage_status=ACTIVE, payment_status=CURRENT; each CALLED loan -> ACTIVE"

  - method: POST
    path: "/policies/{id}/surrender"
    description: "Surrender a vested Policy for net surrender value"
    roles: [Policyholder, PolicyAdmin]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "coverage_status=SURRENDERED; compute net_surrender_value; settle ACTIVE loans; LedgerEntry BENEFIT_PAID"

  # ---- Beneficiary & FuneralHomeAssignment (Policy children) ---------------
  - method: POST
    path: "/policies/{id}/beneficiaries"
    description: "Add a Beneficiary to a Policy (active shares must sum to 100)"
    roles: [PolicyAdmin, Policyholder]
    code: 201
    input: [full_name, relationship, share_pct]
    output: Beneficiary
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/policies/{id}/beneficiaries"
    description: "List a Policy's Beneficiaries (FK reverse-reachability, sub-resource form)"
    roles: [PolicyAdmin, Policyholder, ClaimsExaminer]
    code: 200
    input: ["status?"]
    output: "Beneficiary[]"
    side_effects: []

  - method: POST
    path: "/policies/{id}/beneficiaries/{beneficiaryId}/revoke"
    description: "Revoke a Beneficiary"
    roles: [PolicyAdmin, Policyholder]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["status=REVOKED"]

  - method: POST
    path: "/policies/{id}/funeral-home-assignment"
    description: "Assign part of the death benefit to a funeral home (off-the-top payee)"
    roles: [PolicyAdmin, Policyholder]
    code: 201
    input: [funeral_home_name, assigned_benefit_cents]
    output: FuneralHomeAssignment
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/policies/{id}/funeral-home-assignments"
    description: "List a Policy's FuneralHomeAssignments (FK reverse-reachability, sub-resource form)"
    roles: [PolicyAdmin, Policyholder, ClaimsExaminer]
    code: 200
    input: ["status?"]
    output: "FuneralHomeAssignment[]"
    side_effects: []

  # ---- PremiumPayment ------------------------------------------------------
  - method: POST
    path: "/premium-payments"
    description: "Post a PremiumPayment buying a coverage interval (advances paid_through_date)"
    roles: [PolicyAdmin, Policyholder]
    code: 201
    input: [policy_id, amount_cents, coverage_start, coverage_end]
    output: PremiumPayment
    side_effects:
      - "status=POSTED, posted_date=clock; recompute Policy.paid_through_date/due_date/total_premiums_paid_cents"
      - "If payment_status was GRACE/DELINQUENT and paid_through_date now past clock: payment_status -> CURRENT"
      - "Append LedgerEntry PREMIUM_POSTED"

  - method: GET
    path: "/premium-payments/{id}"
    description: "Get a PremiumPayment"
    roles: [PolicyAdmin, Policyholder, ClaimsExaminer]
    code: 200
    input: []
    output: PremiumPayment
    side_effects: []

  - method: GET
    path: "/premium-payments"
    description: "List PremiumPayments filtered by policy_id (FK reverse-reachability)"
    roles: [PolicyAdmin, Policyholder, ClaimsExaminer]
    code: 200
    input: ["policy_id?", "status?"]
    output: "PremiumPayment[]"
    side_effects: []

  - method: POST
    path: "/premium-payments/{id}/reverse"
    description: "Reverse a POSTED PremiumPayment (compensating action — premiums-paid ledger conserved)"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: PremiumPayment
    side_effects:
      - "status=REVERSED; recompute Policy.paid_through_date/total_premiums_paid_cents back to pre-post value"
      - "Append LedgerEntry PREMIUM_REVERSED"

  # ---- PolicyLoan (OCC on Policy.version) ----------------------------------
  - method: POST
    path: "/policy-loans"
    description: "Disburse a PolicyLoan against net cash value (OCC-guarded on Policy.version)"
    roles: [Policyholder, PolicyAdmin]
    code: 201
    input: [policy_id, expected_policy_version, principal_cents]
    output: PolicyLoan
    side_effects:
      - "status=ACTIVE, disbursed_date=clock"
      - "increments Policy.version by 1; recompute Policy.outstanding_loan_balance_cents/net_cash_value_cents"
      - "Append LedgerEntry LOAN_DISBURSED"

  - method: GET
    path: "/policy-loans/{id}"
    description: "Get a PolicyLoan (with computed accrued_interest_cents)"
    roles: [PolicyAdmin, Policyholder, ClaimsExaminer]
    code: 200
    input: []
    output: PolicyLoan
    side_effects: ["recompute accrued_interest_cents (loan_interest)"]

  - method: GET
    path: "/policy-loans"
    description: "List PolicyLoans filtered by policy_id (FK reverse-reachability)"
    roles: [PolicyAdmin, Policyholder, ClaimsExaminer]
    code: 200
    input: ["policy_id?", "status?"]
    output: "PolicyLoan[]"
    side_effects: []

  - method: POST
    path: "/policy-loans/{id}/repay"
    description: "Repay a PolicyLoan in full (compensating action — cash-value invariant restored)"
    roles: [Policyholder, PolicyAdmin]
    code: 200
    input: [amount_cents]
    output: PolicyLoan
    side_effects:
      - "status=SETTLED, settled_date=clock; recompute Policy.net_cash_value_cents/outstanding_loan_balance_cents"
      - "Append LedgerEntry LOAN_REPAID"

  # ---- Claim & DeathCertificate --------------------------------------------
  - method: POST
    path: "/claims"
    description: "File a death Claim against a Policy"
    roles: [ClaimsExaminer, PolicyAdmin]
    code: 201
    input: [policy_id, date_of_death, manner_of_death]
    output: Claim
    side_effects: ["status=FILED"]

  - method: GET
    path: "/claims/{id}"
    description: "Get a Claim (with computed payout fields)"
    roles: [ClaimsExaminer, PolicyAdmin, Policyholder]
    code: 200
    input: []
    output: Claim
    side_effects: ["recompute provisional gross/net payout if UNDER_REVIEW/CONTESTING"]

  - method: GET
    path: "/claims"
    description: "List Claims filtered by policy_id (FK reverse-reachability)"
    roles: [ClaimsExaminer, PolicyAdmin]
    code: 200
    input: ["policy_id?", "status?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/claims/{id}/death-certificate"
    description: "Attach a DeathCertificate to a Claim"
    roles: [ClaimsExaminer, PolicyAdmin]
    code: 201
    input: [certificate_number, certified_cause, verified]
    output: DeathCertificate
    side_effects: []

  - method: GET
    path: "/death-certificates/{id}"
    description: "Get a DeathCertificate"
    roles: [ClaimsExaminer, PolicyAdmin]
    code: 200
    input: []
    output: DeathCertificate
    side_effects: []

  - method: GET
    path: "/death-certificates"
    description: "List DeathCertificates filtered by claim_id (FK reverse-reachability)"
    roles: [ClaimsExaminer, PolicyAdmin]
    code: 200
    input: ["claim_id?"]
    output: "DeathCertificate[]"
    side_effects: []

  - method: POST
    path: "/claims/{id}/start-review"
    description: "Move a Claim FILED -> UNDER_REVIEW; compute provisional payout"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["compute provisional gross_benefit_cents + payout_basis (claim_payout)"]

  - method: POST
    path: "/claims/{id}/contest"
    description: "Move a Claim UNDER_REVIEW -> CONTESTING (misrepresentation investigation, contestability window)"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["mark for investigation"]

  - method: POST
    path: "/claims/{id}/approve"
    description: "Approve a Claim (CASCADE depth-3 step 1: terminates policy, settles loans, allocates benefit)"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "Finalize gross_benefit_cents/payout_basis; loan_offset_cents=Policy.outstanding_loan_balance_cents; net_payout_cents=gross-offset"
      - "Policy ACTIVE -> TERMINATED; each ACTIVE/CALLED loan -> SETTLED; death_benefit_split allocation"
      - "Append LedgerEntry BENEFIT_PAID (+ LOAN_OFFSET if offset>0)"

  - method: POST
    path: "/claims/{id}/deny"
    description: "Deny a Claim (UNDER_REVIEW or CONTESTING)"
    roles: [ClaimsExaminer]
    code: 200
    input: [denial_reason]
    output: Claim
    side_effects:
      - "status=DENIED, denial_reason set, net_payout_cents=0"
      - "If from CONTESTING within contestability window: Policy ACTIVE -> RESCINDED"

  # ---- LedgerEntry (append-only read) --------------------------------------
  - method: GET
    path: "/ledger-entries/{id}"
    description: "Get a single LedgerEntry"
    roles: [PolicyAdmin, ClaimsExaminer, Policyholder]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  - method: GET
    path: "/ledger-entries"
    description: "List a Policy's append-only LedgerEntries (FK reverse-reachability)"
    roles: [PolicyAdmin, ClaimsExaminer, Policyholder]
    code: 200
    input: ["policy_id?", "entry_type?"]
    output: "LedgerEntry[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth / existence / validation
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, non-positive amount, invalid enum, share_pct out of 1..100, coverage_start >= coverage_end" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state permitting this transition" }
  - { id: ERR_NOT_POLICY_OWNER, http: 403, condition: "Policyholder X-User-ID does not match Policy.policyholder_user_id on an owner-scoped action" }

  # application underwriting
  - { id: ERR_QUESTIONNAIRE_MISSING, http: 409, condition: "Submit attempted before a HealthQuestionnaire is attached" }

  # policy lifecycle
  - { id: ERR_GRACE_NOT_EXPIRED, http: 409, condition: "Manual lapse attempted before due_date + grace_period_days" }
  - { id: ERR_REINSTATEMENT_WINDOW_CLOSED, http: 409, condition: "Reinstatement attempted after lapse + reinstatement_window_days" }
  - { id: ERR_BACK_PREMIUM_DUE, http: 409, condition: "Reinstatement attempted before back-premiums posted to current cycle" }
  - { id: ERR_CASH_VALUE_NOT_VESTED, http: 409, condition: "Surrender/loan attempted before cash_value_vesting_years elapsed" }
  - { id: ERR_CLAIM_IN_PROGRESS, http: 409, condition: "Surrender attempted while a non-terminal Claim exists on the policy" }

  # beneficiary / funeral home
  - { id: ERR_POLICY_NOT_DESIGNABLE, http: 409, condition: "Beneficiary/funeral-home write attempted on a terminal-coverage policy" }
  - { id: ERR_SHARES_EXCEED_100, http: 422, condition: "Active beneficiary share_pct sums to more than 100 after the write" }

  # premium payments
  - { id: ERR_COVERAGE_PERIOD_OVERLAP, http: 409, condition: "Premium coverage interval overlaps an existing POSTED interval (adjacency allowed)" }

  # loans
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_policy_version does not match current Policy.version on loan disbursement (OCC)" }
  - { id: ERR_LOAN_EXCEEDS_CASH_VALUE, http: 422, condition: "Outstanding + new loan principal exceeds max_loan_to_cash_value_pct of net cash value" }
  - { id: ERR_LOAN_COOLDOWN_OVERLAP, http: 409, condition: "New loan disbursed within loan_cooldown_days of the prior loan's settled_date" }
  - { id: ERR_LOAN_UNDERPAID, http: 422, condition: "Repayment amount less than outstanding principal + accrued interest" }

  # claims
  - { id: ERR_POLICY_NOT_IN_FORCE, http: 409, condition: "Claim filed/approved against a policy whose coverage is not in force" }
  - { id: ERR_DEATH_BEFORE_ISSUE, http: 422, condition: "date_of_death precedes Policy.issue_date" }
  - { id: ERR_DEATH_CERTIFICATE_MISSING, http: 409, condition: "start-review attempted before a DeathCertificate is attached" }
  - { id: ERR_CERTIFICATE_NOT_VERIFIED, http: 409, condition: "Claim approval attempted while DeathCertificate.verified is false" }
  - { id: ERR_OUTSIDE_CONTESTABILITY, http: 409, condition: "Contest attempted for a death outside the contestability window" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Underwriter
    description: "Owns the application/underwriting surface: creates applicants & applications, attaches questionnaires, submits, approves/declines/withdraws."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/approve"
      - "POST /applications/{id}/decline"
    shared_operations:
      - "POST /applicants (with PolicyAdmin)"
      - "POST /applications (with PolicyAdmin)"
      - "POST /applications/{id}/questionnaire (with PolicyAdmin)"
      - "POST /applications/{id}/withdraw (with PolicyAdmin)"

  - name: PolicyAdmin
    description: "Owns policy servicing: issues policies, lapse/reinstate, premium posting/reversal, beneficiary & funeral-home admin, loan admin."
    identity: opaque
    exclusive_operations:
      - "POST /product-plans"
      - "POST /applications/{id}/issue"
      - "POST /policies/{id}/lapse"
      - "POST /policies/{id}/reinstate"
      - "POST /premium-payments/{id}/reverse"
    shared_operations:
      - "POST /premium-payments (with Policyholder)"
      - "POST /policies/{id}/beneficiaries (with Policyholder)"
      - "POST /policies/{id}/funeral-home-assignment (with Policyholder)"
      - "POST /policy-loans (with Policyholder)"
      - "POST /policy-loans/{id}/repay (with Policyholder)"
      - "POST /policies/{id}/surrender (with Policyholder)"
      - "POST /claims (with ClaimsExaminer)"

  - name: ClaimsExaminer
    description: "Owns the claims surface: files/reviews/contests/approves/denies claims, attaches death certificates."
    identity: opaque
    exclusive_operations:
      - "POST /claims/{id}/start-review"
      - "POST /claims/{id}/contest"
      - "POST /claims/{id}/approve"
      - "POST /claims/{id}/deny"
    shared_operations:
      - "POST /claims (with PolicyAdmin)"
      - "POST /claims/{id}/death-certificate (with PolicyAdmin)"

  - name: Policyholder
    description: "The policy owner. Acts only on policies whose policyholder_user_id equals their X-User-ID. Pays premiums, manages beneficiaries, takes/repays loans, surrenders."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /premium-payments (with PolicyAdmin)"
      - "POST /policies/{id}/beneficiaries (with PolicyAdmin)"
      - "POST /policies/{id}/beneficiaries/{beneficiaryId}/revoke (with PolicyAdmin)"
      - "POST /policies/{id}/funeral-home-assignment (with PolicyAdmin)"
      - "POST /policy-loans (with PolicyAdmin)"
      - "POST /policy-loans/{id}/repay (with PolicyAdmin)"
      - "POST /policies/{id}/surrender (with PolicyAdmin)"
