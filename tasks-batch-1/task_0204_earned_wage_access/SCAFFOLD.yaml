# =============================================================================
# Scaffold: earned-wage-access benchmark seed tables (Expert difficulty)
# §1.0–§1.7. The §1.8 Difficulty Design and §1.9 Corner Design live in their
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml and SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Earned Wage Access / On-Demand Pay: employer time feed, available-earnings
  calculation, advance limit/cap, payday repayment/recoup, optional
  tip/expedite fee, cooling-off between advances, employer reconciliation,
  default handling

domain_name: earned-wage-access
api_prefix: ""   # flat topology: every entity is a top-level collection /<plural>/{id}

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4) — Expert band
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # available-earnings (forward gross-accrual) vs payday recoup (chronological waterfall)
    - rate_threshold_triggers         # cap breakpoints, per-period advance count, default aging
    - cascading_side_effects          # advance settle -> worker counters -> reconciliation drift -> employer posture
    - optimistic_concurrency          # CREATE-with-supersede on Advance against a stale Worker.version

  entity_topology: flat
  # Every entity is a top-level collection with FK references in the body
  # (employer_id, worker_id, pay_period_id, advance_id, repayment_batch_id);
  # no nesting in URL paths. Employer is the logical aggregate root but is
  # referenced by FK, not by URL ancestry.

  state_machine_shape: cyclic
  # PayPeriod is cyclic (OPEN<->LOCKED reopen loop + DISBURSED epoch checkpoint);
  # Advance is branching with revert (DISBURSED -> {RECOUPING, DEFAULTED} and
  # DEFAULTED -> RECOUPING write-back loop); Worker carries parallel dimensions
  # (employment_status × advance_eligibility evolve independently on one row).

  relationship_patterns:
    - one_to_many       # Employer -> Worker/PayPeriod; PayPeriod -> TimeEntry; Advance -> Repayment
    - cross_aggregate   # Advance references both PayPeriod and Worker; Repayment crosses Advance×RepaymentBatch
    - many_to_many      # RepaymentBatch recoups many Advances; an Advance accrues many Repayments

  role_model: segregation_of_duties
  # The user who APPROVES an Advance (PayrollOfficer) MUST NOT be the user who
  # POSTS the RepaymentBatch nor SIGNS the ReconciliationStatement for the same
  # pay period — compliance-driven separation. Worker is self-service.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: state_code, type: string, source: input, description: "US state of payroll (e.g., CA, TX)" }
      - { name: pay_frequency, type: enum, source: input, description: "Pay cadence", constraints: "one of {WEEKLY, BIWEEKLY, SEMIMONTHLY}" }
      - { name: funding_balance_cents, type: integer, source: input, default: 0, description: "Prefunded pool the employer uses to bankroll worker advances; debited by recoup_target_cents on disbursement (employer reserves principal+fee), credited by recoup_target_cents on settle/recoup so funding_balance_cents + outstanding_principal_cents is conserved" }
      - { name: max_advance_pct_of_available, type: number, source: input, default: 0.50, description: "Ceiling fraction of a worker's net available earnings that may be advanced this pay period", constraints: "0 < x <= 1.0" }
      - { name: per_period_advance_cap_count, type: integer, source: input, default: 3, description: "Max number of DISBURSED advances per worker per pay period", constraints: ">= 1" }
      - { name: cooling_off_hours, type: integer, source: input, default: 24, description: "Minimum hours that must elapse between one advance disbursement and the next request for the same worker", constraints: ">= 0" }
      - { name: posture, type: enum, source: computed, description: "Derived funding/compliance posture gating new disbursements: HEALTHY | RESTRICTED | FROZEN; RESTRICTED when funding_balance_cents below outstanding exposure, FROZEN when any reconciliation statement for a DISBURSED pay period is in DISCREPANCY" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "Sum of principal_outstanding_cents across all this employer's Advances not in {SETTLED, WRITTEN_OFF}" }

  - name: AdvanceLimitPolicy
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: tier, type: enum, source: input, description: "Tenure tier this policy governs", constraints: "one of {PROBATION, STANDARD, SENIOR}" }
      - { name: min_tenure_days, type: integer, source: input, description: "Minimum worker tenure_days to fall in this tier (inclusive lower bound)", constraints: ">= 0" }
      - { name: per_advance_floor_cents, type: integer, source: input, default: 1000, description: "Smallest principal a single advance may request" }
      - { name: per_advance_ceiling_cents, type: integer, source: input, description: "Largest principal a single advance may request regardless of available earnings" }
      - { name: cumulative_period_ceiling_cents, type: integer, source: input, description: "Largest total principal a worker in this tier may have DISBURSED-or-outstanding within one pay period" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: expedite_flat_fee_cents, type: integer, source: input, default: 199, description: "Flat fee charged when a worker chooses INSTANT disbursement speed" }
      - { name: expedite_pct_fee, type: number, source: input, default: 0.0, description: "Additional percent-of-principal fee for INSTANT disbursement", constraints: "0 <= x <= 0.05" }
      - { name: max_total_fee_cents, type: integer, source: input, default: 1500, description: "Hard cap on total (expedite + tip) fee per advance" }
      - { name: tip_allowed, type: boolean, source: input, default: true, description: "Whether voluntary worker tips are accepted" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED" }

  - name: PayPeriod
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: period_index, type: integer, source: system, description: "Monotonic per-employer counter assigned at creation, starting at 0" }
      - { name: start_at, type: datetime, source: input, description: "Inclusive period start (UTC); the period occupies the half-open interval [start_at, end_at) and must not overlap any other non-DISBURSED period for the same employer" }
      - { name: end_at, type: datetime, source: input, description: "Exclusive period end (UTC); payday is end_at; abutting periods (prev.end_at == next.start_at) are allowed (half-open, no overlap)", constraints: "must be strictly after start_at" }
      - { name: gross_accrued_cents, type: integer, source: computed, description: "Canonical period gross = round_half_up( sum over POSTED TimeEntry rows of (hours_worked * worker.hourly_rate_cents) ). Sum-then-round (one rounding at the end), NOT the sum of the per-entry display field TimeEntry.gross_earned_cents — the two can differ by cents; this field and available_earnings always use sum-then-round" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> LOCKED -> DISBURSED; LOCKED may reopen to OPEN" }
      - { name: locked_at, type: datetime, source: system, default: null, description: "Server clock when last LOCKED (cleared on reopen)" }
      - { name: disbursed_at, type: datetime, source: system, default: null, description: "Server clock when payday recoup epoch ran" }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: external_payroll_ref, type: string, source: input, description: "Employer-side payroll identifier; unique per employer among non-TERMINATED workers" }
      - { name: full_name, type: string, source: input, description: "Worker name" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Pay rate per hour in cents", constraints: ">= 0" }
      - { name: hire_date, type: datetime, source: input, description: "Employment start (UTC); drives tenure_days" }
      - { name: tenure_days, type: integer, source: computed, description: "floor((server_clock - hire_date) / 1 day); selects AdvanceLimitPolicy tier" }
      - { name: employment_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | TERMINATED (one parallel dimension)" }
      - { name: advance_eligibility, type: enum, source: system, default: "ELIGIBLE", description: "ELIGIBLE | ON_HOLD (independent parallel dimension). ON_HOLD iff the worker has >= 1 Advance in {DEFAULTED, WRITTEN_OFF}; returns to ELIGIBLE only when the worker has zero Advances in {DEFAULTED, WRITTEN_OFF}. A manual-recoup that drives a DEFAULTED advance to SETTLED removes the DEFAULTED row and can clear the hold; a write-off keeps the advance in {WRITTEN_OFF} and so SUSTAINS the hold (the debt was never repaid)." }
      - { name: period_advance_count, type: integer, source: computed, description: "Count of this worker's Advances in {DISBURSED, RECOUPING, DEFAULTED} whose pay_period_id is the employer's current non-DISBURSED PayPeriod" }
      - { name: net_available_earnings_cents, type: integer, source: computed, description: "Forward-looking available-earnings figure for the current OPEN/LOCKED pay period (see calculations.available_earnings)" }
      - { name: lifetime_advanced_cents, type: integer, source: computed, description: "Sum of principal_cents across all this worker's Advances ever DISBURSED" }

  - name: TimeEntry
    parent: null
    common_fields: false
    fields:
      - { name: pay_period_id, type: string, source: input, description: "FK -> PayPeriod.id" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; worker.employer_id must equal pay_period.employer_id" }
      - { name: shift_start_at, type: datetime, source: input, description: "Inclusive shift start (UTC); must fall within [pay_period.start_at, pay_period.end_at)" }
      - { name: shift_end_at, type: datetime, source: input, description: "Inclusive shift end (UTC); must be strictly after shift_start_at and within the period" }
      - { name: hours_worked, type: number, source: input, description: "Hours on this entry; must equal (shift_end_at - shift_start_at) in hours to within 0.01h", constraints: "0 < hours <= 24" }
      - { name: gross_earned_cents, type: integer, source: computed, description: "Per-entry display value = round_half_up(hours_worked * worker.hourly_rate_cents). DISPLAY ONLY — earnings aggregates (PayPeriod.gross_accrued_cents, available_earnings) recompute from raw hours*rate with a single final rounding, never by summing this field" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | VOIDED; only POSTED entries count toward earnings and toward shift-overlap detection" }

  - name: Advance
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id" }
      - { name: pay_period_id, type: string, source: input, description: "FK -> PayPeriod.id; must be the worker employer's current non-DISBURSED period" }
      - { name: requested_principal_cents, type: integer, source: input, description: "Principal the worker asks for, before eligibility clamping", constraints: ">= 1" }
      - { name: principal_cents, type: integer, source: computed, description: "Approved principal after applying tier ceilings and available-earnings cap; may be < requested_principal_cents" }
      - { name: disbursement_speed, type: enum, source: input, default: "STANDARD", description: "STANDARD | INSTANT; INSTANT incurs expedite fee" }
      - { name: tip_cents, type: integer, source: input, default: 0, description: "Voluntary worker tip", constraints: ">= 0" }
      - { name: expedite_fee_cents, type: integer, source: computed, description: "Computed expedite fee (0 for STANDARD); see calculations.advance_fee" }
      - { name: total_fee_cents, type: integer, source: computed, description: "Capped sum of expedite_fee_cents + tip_cents; see calculations.advance_fee" }
      - { name: disbursed_amount_cents, type: integer, source: computed, description: "Cash paid to the worker = principal_cents (fees are recouped on top, never deducted from the worker payout); the employer's funding pool is debited by recoup_target_cents, not by this figure" }
      - { name: recoup_target_cents, type: integer, source: computed, description: "Total owed back at payday = principal_cents + total_fee_cents" }
      - { name: amount_recouped_cents, type: integer, source: computed, default: 0, description: "Cumulative principal+fee recovered via Repayment rows" }
      - { name: principal_outstanding_cents, type: integer, source: computed, default: 0, description: "recoup_target_cents - amount_recouped_cents while not terminal" }
      - { name: requested_at, type: datetime, source: system, description: "Server clock at REQUESTED creation; cooling-off measured from prior advance's disbursed_at to this" }
      - { name: disbursed_at, type: datetime, source: system, default: null, description: "Server clock when moved to DISBURSED; anchors cooling-off for the NEXT advance" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED -> APPROVED -> DISBURSED -> RECOUPING -> SETTLED; DISBURSED/RECOUPING -> DEFAULTED -> RECOUPING (write-back) / WRITTEN_OFF; REQUESTED -> DECLINED" }

  - name: RepaymentBatch
    parent: null
    common_fields: true
    fields:
      - { name: pay_period_id, type: string, source: input, description: "FK -> PayPeriod.id" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: total_recouped_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents across this batch's Repayment rows" }
      - { name: advance_count, type: integer, source: computed, default: 0, description: "Distinct Advances this batch touched" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID of the PayrollOfficer who posted the batch; SoD check vs approver" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> POSTED -> RECONCILED; DRAFT -> CANCELLED" }

  - name: Repayment
    parent: null
    common_fields: false
    fields:
      - { name: advance_id, type: string, source: input, description: "FK -> Advance.id" }
      - { name: repayment_batch_id, type: string, source: input, description: "FK -> RepaymentBatch.id" }
      - { name: amount_cents, type: integer, source: computed, description: "Amount applied to this advance by the batch waterfall; see calculations.payday_recoup" }
      - { name: applied_to, type: enum, source: computed, description: "Whether this slice covered FEE or PRINCIPAL (fees recouped before principal)", constraints: "one of {FEE, PRINCIPAL}" }

  - name: ReconciliationStatement
    parent: null
    common_fields: true
    fields:
      - { name: pay_period_id, type: string, source: input, description: "FK -> PayPeriod.id" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: expected_recoup_cents, type: integer, source: computed, description: "Sum of recoup_target_cents over Advances in this period that reached DISBURSED or beyond (see calculations.reconciliation)" }
      - { name: actual_recouped_cents, type: integer, source: computed, description: "Sum of total_recouped_cents over POSTED RepaymentBatches for this period" }
      - { name: written_off_cents, type: integer, source: computed, description: "Sum of principal_outstanding_cents over this period's Advances that reached WRITTEN_OFF" }
      - { name: drift_cents, type: integer, source: computed, description: "expected_recoup_cents - actual_recouped_cents - written_off_cents; the conserved-quantity invariant requires this to be 0 for a clean statement" }
      - { name: outcome, type: enum, source: computed, description: "CLEAN when drift_cents == 0 else DISCREPANCY" }
      - { name: signed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer who signed; SoD vs approver and poster" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> SIGNED; DRAFT may recompute in place" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: PayPeriod
    initial_state: OPEN
    terminal_states: [DISBURSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /pay-periods/{payPeriodId}/lock"
        actor: PayrollOfficer
        preconditions:
          - "Employer.posture != FROZEN (ERR_EMPLOYER_FROZEN)"
        side_effects:
          - "locked_at = server clock"
          - "Recompute gross_accrued_cents over POSTED TimeEntry rows"
        note: "Locking freezes the time feed; new TimeEntry POSTs are rejected while LOCKED."

      - from: LOCKED
        to: OPEN
        trigger: "POST /pay-periods/{payPeriodId}/reopen"
        actor: PayrollOfficer
        preconditions:
          - "No RepaymentBatch for this period is POSTED or RECONCILED (ERR_PERIOD_HAS_POSTED_BATCH)"
        side_effects:
          - "locked_at = null"
        note: "Cyclic loop OPEN<->LOCKED; reopen allows late TimeEntry corrections before payday."

      - from: LOCKED
        to: DISBURSED
        trigger: "POST /pay-periods/{payPeriodId}/run-payday"
        actor: PayrollOfficer
        preconditions:
          - "Exactly one RepaymentBatch for this period is in POSTED status (ERR_NO_POSTED_BATCH)"
          - "Employer.posture != FROZEN (ERR_EMPLOYER_FROZEN)"
        side_effects:
          - "disbursed_at = server clock"
          - "For every Advance in this period still in RECOUPING with principal_outstanding_cents > 0: transition Advance RECOUPING -> DEFAULTED (cascade hop 1)"
          - "Each DEFAULTED Advance sets its Worker.advance_eligibility = ON_HOLD (cascade hop 2)"
          - "Recompute the period's ReconciliationStatement (creates DRAFT if absent) so drift_cents reflects defaults (cascade hop 3)"
          - "If the recomputed statement.outcome == DISCREPANCY, recompute Employer.posture -> FROZEN (cascade hop 4)"

  - entity: Advance
    initial_state: REQUESTED
    terminal_states: [SETTLED, DECLINED, WRITTEN_OFF]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /advances/{advanceId}/approve"
        actor: PayrollOfficer
        preconditions:
          - "Worker.employment_status == ACTIVE (ERR_WORKER_NOT_ACTIVE)"
          - "Worker.advance_eligibility == ELIGIBLE (ERR_WORKER_ON_HOLD)"
          - "Employer.posture in {HEALTHY, RESTRICTED} (ERR_EMPLOYER_FROZEN)"
          - "Cooling-off satisfied: (server_clock - worker's most-recent DISBURSED advance.disbursed_at) >= Employer.cooling_off_hours, or no prior DISBURSED advance (ERR_COOLING_OFF_ACTIVE)"
          - "Worker.period_advance_count < Employer.per_period_advance_cap_count (ERR_PERIOD_CAP_REACHED)"
          - "computed principal_cents >= matched AdvanceLimitPolicy.per_advance_floor_cents (ERR_BELOW_FLOOR)"
        side_effects:
          - "Compute principal_cents via calculations.principal_clamp (clamps requested against tier ceilings, cumulative period ceiling, and available-earnings cap)"
          - "Compute expedite_fee_cents, total_fee_cents, recoup_target_cents via calculations.advance_fee"
          - "disbursed_amount_cents = principal_cents"

      - from: REQUESTED
        to: DECLINED
        trigger: "POST /advances/{advanceId}/decline"
        actor: PayrollOfficer
        preconditions: []
        side_effects:
          - "principal_cents = 0; principal_outstanding_cents = 0"

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /advances/{advanceId}/disburse"
        actor: PayrollOfficer
        preconditions:
          - "Employer.funding_balance_cents >= recoup_target_cents (ERR_INSUFFICIENT_FUNDING)"
          - "Employer.posture in {HEALTHY, RESTRICTED} (ERR_EMPLOYER_FROZEN)"
        side_effects:
          - "disbursed_at = server clock (anchors cooling-off for this worker's NEXT advance)"
          - "Employer.funding_balance_cents -= recoup_target_cents (ledger debit reserving principal+fee)"
          - "principal_outstanding_cents = recoup_target_cents"
          - "Recompute Worker.lifetime_advanced_cents, Worker.period_advance_count, Employer.outstanding_principal_cents"
          - "Recompute Employer.posture (may flip HEALTHY -> RESTRICTED when funding falls below outstanding exposure)"

      - from: DISBURSED
        to: RECOUPING
        trigger: "system (first Repayment row applied to this advance via a POSTED RepaymentBatch)"
        actor: system
        preconditions:
          - "amount_recouped_cents > 0 after the batch waterfall"
        side_effects:
          - "Recompute amount_recouped_cents, principal_outstanding_cents"

      - from: RECOUPING
        to: SETTLED
        trigger: "system (Repayment application drives principal_outstanding_cents to 0)"
        actor: system
        preconditions:
          - "principal_outstanding_cents == 0"
        side_effects:
          - "Employer.funding_balance_cents += recoup_target_cents (ledger credit; conserves the funding pool)"
          - "Recompute Employer.outstanding_principal_cents and Employer.posture (may flip RESTRICTED -> HEALTHY)"
          - "Recompute Worker.advance_eligibility: if the worker now has zero Advances in {DEFAULTED, WRITTEN_OFF}, set ELIGIBLE (a fully-recovered default clears the hold)"

      - from: DISBURSED
        to: DEFAULTED
        trigger: "system (run-payday closes the period with this advance never recouped)"
        actor: system
        preconditions:
          - "principal_outstanding_cents > 0 at payday"
        side_effects:
          - "Worker.advance_eligibility = ON_HOLD"
          - "Employer.outstanding_principal_cents unchanged (principal still owed)"

      - from: RECOUPING
        to: DEFAULTED
        trigger: "system (run-payday closes the period with this advance partially recouped)"
        actor: system
        preconditions:
          - "principal_outstanding_cents > 0 at payday"
        side_effects:
          - "Worker.advance_eligibility = ON_HOLD"

      - from: DEFAULTED
        to: RECOUPING
        trigger: "POST /advances/{advanceId}/manual-recoup"
        actor: PayrollOfficer
        preconditions:
          - "Employer.posture != FROZEN unless this is the recovery that will clear the discrepancy (ERR_EMPLOYER_FROZEN)"
          - "amount_cents in body > 0 and <= principal_outstanding_cents (ERR_OVER_RECOUP)"
        side_effects:
          - "Create a Repayment row tied to the period's POSTED-or-prior batch; amount_recouped_cents += amount; principal_outstanding_cents -= amount"
          - "Recompute the period's ReconciliationStatement.drift_cents (DEFAULTED write-back hop)"
          - "If outstanding reaches 0: re-evaluate to SETTLED via the RECOUPING->SETTLED path"

      - from: DEFAULTED
        to: WRITTEN_OFF
        trigger: "POST /advances/{advanceId}/write-off"
        actor: ComplianceOfficer
        preconditions:
          - "principal_outstanding_cents > 0 (ERR_NOTHING_TO_WRITE_OFF)"
          - "Period has been DISBURSED (ERR_PERIOD_NOT_DISBURSED)"
        side_effects:
          - "written-off amount = principal_outstanding_cents; principal_outstanding_cents = 0"
          - "Worker.advance_eligibility stays ON_HOLD (advance moves DEFAULTED -> WRITTEN_OFF, which is still in the {DEFAULTED, WRITTEN_OFF} penalty set, so the hold is not cleared)"
          - "Recompute the period's ReconciliationStatement.written_off_cents and drift_cents (write-off counts as resolution, not actual cash)"
          - "Employer.outstanding_principal_cents decreases by the written-off amount"

  - entity: Worker
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /workers/{workerId}/suspend"
        actor: PayrollOfficer
        preconditions: []
        side_effects: []
        note: "employment_status dimension; SUSPENDED blocks new approvals but does not touch advance_eligibility."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /workers/{workerId}/reinstate"
        actor: PayrollOfficer
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /workers/{workerId}/terminate"
        actor: PayrollOfficer
        preconditions:
          - "Worker has no Advance in {DISBURSED, RECOUPING, DEFAULTED} (ERR_WORKER_HAS_OPEN_ADVANCE)"
        side_effects: []

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /workers/{workerId}/terminate"
        actor: PayrollOfficer
        preconditions:
          - "Worker has no Advance in {DISBURSED, RECOUPING, DEFAULTED} (ERR_WORKER_HAS_OPEN_ADVANCE)"
        side_effects: []
    note: "advance_eligibility (ELIGIBLE<->ON_HOLD) is a parallel dimension driven by system default/recovery transitions, not by these actor calls. ON_HOLD iff the worker has >= 1 Advance in {DEFAULTED, WRITTEN_OFF}; it clears to ELIGIBLE only when that set is empty (manual-recoup to SETTLED clears it; write-off keeps it because WRITTEN_OFF remains in the set)."

  - entity: RepaymentBatch
    initial_state: DRAFT
    terminal_states: [POSTED, RECONCILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /repayment-batches/{batchId}/post"
        actor: PayrollOfficer
        preconditions:
          - "PayPeriod.status == LOCKED (ERR_PERIOD_NOT_LOCKED)"
          - "Acting user must NOT be the approver of any Advance in this period (ERR_SEGREGATION_OF_DUTIES)"
          - "No other RepaymentBatch for this period is POSTED or RECONCILED (ERR_BATCH_ALREADY_POSTED)"
        side_effects:
          - "expected_<repaymentbatch>_version OCC guard"
          - "Run calculations.payday_recoup: allocate each touched Advance's recoup_target via fee-then-principal waterfall, creating Repayment rows"
          - "Each Advance with a Repayment moves DISBURSED -> RECOUPING (cascade); those driven to 0 outstanding move RECOUPING -> SETTLED (further cascade, crediting funding pool)"
          - "Recompute total_recouped_cents, advance_count; posted_by_user_id = X-User-ID"

      - from: POSTED
        to: RECONCILED
        trigger: "system (run-payday DISBURSES the period after this batch posted)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /repayment-batches/{batchId}/cancel"
        actor: PayrollOfficer
        preconditions: []
        side_effects: []

  - entity: ReconciliationStatement
    initial_state: DRAFT
    terminal_states: [SIGNED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /reconciliation-statements/{statementId}/sign"
        actor: ComplianceOfficer
        preconditions:
          - "PayPeriod.status == DISBURSED (ERR_PERIOD_NOT_DISBURSED)"
          - "Acting user must NOT be the poster of the period's RepaymentBatch and must NOT be the approver of any Advance in the period (ERR_SEGREGATION_OF_DUTIES)"
          - "outcome == CLEAN, i.e., drift_cents == 0 (ERR_STATEMENT_NOT_CLEAN)"
        side_effects:
          - "signed_by_user_id = X-User-ID"
          - "Recompute Employer.posture (a CLEAN signed statement can lift FROZEN back to HEALTHY/RESTRICTED if no other DISCREPANCY remains)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: advance-create-stale-worker
    parent_entity: Worker
    write_endpoint: "POST /advances"
    occ_field: "expected_worker_version"
    description: |
      Creating a new Advance against a Worker whose version has advanced since
      the client last observed it is rejected with a stale-version error. A new
      advance request legitimately succeeds on a fresh read of the worker, but
      once a prior advance against the same worker has been DISBURSED, the
      worker's computed counters (period_advance_count, net_available_earnings_cents,
      lifetime_advanced_cents) and version have moved; a request still carrying
      the pre-disbursement version is therefore operating on a stale eligibility
      snapshot and is refused so the cap/available-earnings checks are not
      evaluated against outdated figures.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: batch-post-stale-batch
    parent_entity: RepaymentBatch
    write_endpoint: "POST /repayment-batches/{batchId}/post"
    occ_field: "expected_repaymentbatch_version"
    description: |
      Posting a RepaymentBatch whose version has advanced since the client last
      observed it (for example because the draft was recomputed or another line
      was staged) is rejected. The post legitimately succeeds on a fresh read of
      the batch, but a stale version means the client is posting against an
      out-of-date view of which advances the waterfall will touch, so it is
      refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: available_earnings
    trigger: "computed on read of Worker.net_available_earnings_cents and at Advance approval"
    algorithm: forward_looking
    formula: |
      # Forward-looking accrual: project the worker's net earned-to-date for the
      # employer's current non-DISBURSED pay period, then net out fees+principal
      # already committed to outstanding advances in that same period.
      period = employer's current PayPeriod with status in {OPEN, LOCKED}
      gross_earned = round_half_up( sum over POSTED TimeEntry rows for (worker, period) of
                                    (hours_worked * worker.hourly_rate_cents) )
      # Statutory access fraction of gross is what may be advanced:
      accessible = floor( gross_earned * employer.max_advance_pct_of_available )
      committed  = sum of recoup_target_cents over this worker's Advances in
                   {APPROVED, DISBURSED, RECOUPING, DEFAULTED} whose pay_period_id == period.id
      net_available = max(0, accessible - committed)
      return net_available
    input_set: "POSTED TimeEntry rows in the current OPEN/LOCKED period; Advances in {APPROVED, DISBURSED, RECOUPING, DEFAULTED} for that period reduce availability"
    constants: {}
    precision: "integer cents; round_half_up only at the gross_earned rounding step, floor for the access fraction"
    variants:
      - name: gross_then_round
        when: "computing gross_earned"
        difference: "Round the SUM of (hours*rate) once (sum-then-round), NOT per TimeEntry; per-entry rounding then summing can differ by cents and is the wrong order."

  - name: principal_clamp
    trigger: "Advance REQUESTED -> APPROVED"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial clamp: requested principal is reduced by FOUR ceilings,
      # evaluated in this pinned order; the binding (smallest) ceiling wins.
      tier   = AdvanceLimitPolicy for employer with status == ACTIVE where
               worker.tenure_days >= min_tenure_days, choosing the policy with the
               GREATEST min_tenure_days that still satisfies the bound; tie (equal
               min_tenure_days) broken by policy.created_at ASC. If no ACTIVE policy
               qualifies, approval fails with ERR_BELOW_FLOOR (no tier => principal 0).
      c1 = tier.per_advance_ceiling_cents
      c2 = tier.cumulative_period_ceiling_cents
           - (sum of principal_cents over this worker's Advances in
              {APPROVED, DISBURSED, RECOUPING, DEFAULTED} for the same period)
      c3 = worker.net_available_earnings_cents   # already nets committed advances
      principal_cents = max(0, min(requested_principal_cents, c1, c2, c3))
      # Floor check happens AFTER the clamp as an approval precondition, not here.
    input_set: "Matched AdvanceLimitPolicy by tenure tier; prior same-period advances for c2; available earnings for c3"
    constants: {}
    precision: "integer cents; all four candidates are integer cents, min() is exact"
    variants:
      - name: cumulative_excludes_fees
        when: "computing c2"
        difference: "The cumulative period ceiling counts principal_cents only, NOT fees; recoup_target (principal+fee) is used for c3's committed netting inside available_earnings but NOT for c2."

  - name: advance_fee
    trigger: "Advance REQUESTED -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial fee with cap interaction across two fee components.
      if disbursement_speed == STANDARD:
        expedite_fee_cents = 0
      else:  # INSTANT
        expedite_fee_cents = fee_schedule.expedite_flat_fee_cents
                           + round_half_up(principal_cents * fee_schedule.expedite_pct_fee)
      tip = tip_cents if fee_schedule.tip_allowed else 0   # tips ignored when not allowed
      raw_total = expedite_fee_cents + tip
      # Cap applies to the COMBINED fee; when capped, the expedite fee is paid
      # first and the tip is what gets trimmed (worker-favorable: voluntary tip
      # absorbs the cap, never the mandatory expedite fee).
      if raw_total > fee_schedule.max_total_fee_cents:
        total_fee_cents = fee_schedule.max_total_fee_cents
        # tip effectively reduced to (cap - expedite_fee_cents), floored at 0
      else:
        total_fee_cents = raw_total
      recoup_target_cents = principal_cents + total_fee_cents
    input_set: "Active FeeSchedule for the employer; disbursement_speed, tip_cents, principal_cents on the advance"
    constants: {}
    precision: "integer cents; round_half_up on the percent component before summing (round-then-sum order pinned)"
    variants:
      - name: cap_trims_tip_not_expedite
        when: "raw_total > max_total_fee_cents"
        difference: "Cap reduces the tip portion first; expedite fee is never reduced. If expedite_fee_cents alone exceeds the cap, total_fee_cents = max_total_fee_cents and tip contributes 0."

  - name: payday_recoup
    trigger: "RepaymentBatch DRAFT -> POSTED"
    algorithm: waterfall_allocation
    formula: |
      # Chronological waterfall: process the period's recoupable Advances in
      # ascending disbursed_at (tie-break Advance.created_at ASC), and within
      # each advance pay FEE before PRINCIPAL. Available cash is the worker's
      # net pay this period; the employer recoups up to gross pay accrued.
      candidates = Advances in {DISBURSED, RECOUPING} for this period,
                   sorted by (disbursed_at ASC, created_at ASC)
      # Per-worker recoup ceiling protects net pay: the employer may recoup at most
      # the same statutory access fraction of the worker's gross this period that it
      # allowed to be advanced — the rest is the worker's protected take-home.
      for each distinct worker among candidates:
        per_worker_cap[worker] = floor(worker.gross_accrued_for_period
                                       * employer.max_advance_pct_of_available)
        already[worker] = 0
      for adv in candidates:
        room = max(0, per_worker_cap[adv.worker] - already[adv.worker])
        owed = adv.recoup_target_cents - adv.amount_recouped_cents
        take = min(owed, room)
        # Split `take` fee-first:
        fee_owed = max(0, adv.total_fee_cents - fee_recouped_so_far(adv))
        fee_slice = min(take, fee_owed)
        principal_slice = take - fee_slice
        if fee_slice > 0: create Repayment(amount=fee_slice, applied_to=FEE)
        if principal_slice > 0: create Repayment(amount=principal_slice, applied_to=PRINCIPAL)
        adv.amount_recouped_cents += take
        already[adv.worker] += take
      # Any advance still with principal_outstanding_cents > 0 after the batch
      # remains RECOUPING (or DISBURSED if take==0) until run-payday, which
      # DEFAULTS it.
    input_set: "Advances in {DISBURSED, RECOUPING} for the period; per-worker recoup cap = floor(gross_accrued * max_advance_pct_of_available); fee-before-principal split order"
    constants: {}
    precision: "integer cents; floor on the per_worker recoup cap"
    variants:
      - name: fee_before_principal
        when: "splitting each advance's take"
        difference: "Fees recoup before principal. Contrast with available_earnings which nets full recoup_target — recoup ORDER (fee-first) differs from netting (whole target), so the two algorithms treat the same advance differently."

  - name: reconciliation
    trigger: "RepaymentBatch POST, run-payday, manual-recoup, write-off, statement recompute"
    algorithm: aggregation
    formula: |
      period = the statement's PayPeriod
      expected_recoup_cents = sum of recoup_target_cents over Advances in this
                              period whose status reached DISBURSED-or-beyond,
                              i.e., status in {DISBURSED, RECOUPING, DEFAULTED,
                              SETTLED, WRITTEN_OFF}
      actual_recouped_cents = sum of total_recouped_cents over RepaymentBatches
                              for this period in status in {POSTED, RECONCILED}
      written_off_cents     = sum of (recoup_target_cents - amount_recouped_cents
                              captured at write-off) over this period's Advances
                              in status WRITTEN_OFF
      drift_cents = expected_recoup_cents - actual_recouped_cents - written_off_cents
      outcome = CLEAN if drift_cents == 0 else DISCREPANCY
    input_set: "Advances DISBURSED-or-beyond for expected; POSTED/RECONCILED batches for actual; WRITTEN_OFF advances for write-offs"
    constants: {}
    precision: "integer cents; exact subtraction"
    variants:
      - name: writeoff_counts_as_resolution
        when: "computing drift after a write-off"
        difference: "Written-off principal is subtracted from expected (counts as resolved), so a write-off can move outcome DISCREPANCY -> CLEAN even though no cash was recouped — distinct from a manual-recoup which adds to actual_recouped instead."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth, check: "Role permitted for this operation per §1.7 RBAC", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence, check: "All path resources exist, validated left-to-right (employer before pay-period before worker, advance, batch, statement)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4,  category: business_referential, check: "Body FK targets exist and belong to the same employer (worker_id, pay_period_id, advance_id, repayment_batch_id resolve and share employer_id)", error_id: ERR_CROSS_EMPLOYER_REFERENCE, http_status: 422, applies_to: "POST /advances, POST /repayment-batches, POST /time-entries" }
  - { priority: 5,  category: existence, check: "Request body has all required fields with correct types (enums in allowed set, numbers in range)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 6,  category: state, check: "Target resource is in a state from which this transition is defined in §1.2", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 7,  category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /advances, POST /repayment-batches/{batchId}/post" }
  - { priority: 8,  category: business_safety, check: "Segregation of duties: poster/signer is not the approver of any advance in the period, and signer is not the poster", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /repayment-batches/{batchId}/post, POST /reconciliation-statements/{statementId}/sign" }
  - { priority: 9,  category: business_safety, check: "Employer.posture != FROZEN for disbursement-class operations (lock, run-payday, advance approve/disburse)", error_id: ERR_EMPLOYER_FROZEN, http_status: 409, applies_to: "POST /pay-periods/{payPeriodId}/lock, POST /pay-periods/{payPeriodId}/run-payday, POST /advances/{advanceId}/approve, POST /advances/{advanceId}/disburse" }
  - { priority: 10, category: business_constraint, check: "Worker.employment_status == ACTIVE for advance approval", error_id: ERR_WORKER_NOT_ACTIVE, http_status: 409, applies_to: "POST /advances/{advanceId}/approve" }
  - { priority: 11, category: business_constraint, check: "Worker.advance_eligibility == ELIGIBLE for advance approval", error_id: ERR_WORKER_ON_HOLD, http_status: 409, applies_to: "POST /advances/{advanceId}/approve" }
  - { priority: 12, category: business_temporal, check: "Cooling-off elapsed: server_clock - latest DISBURSED advance.disbursed_at >= cooling_off_hours", error_id: ERR_COOLING_OFF_ACTIVE, http_status: 409, applies_to: "POST /advances/{advanceId}/approve" }
  - { priority: 13, category: business_constraint, check: "Worker.period_advance_count < employer.per_period_advance_cap_count", error_id: ERR_PERIOD_CAP_REACHED, http_status: 409, applies_to: "POST /advances/{advanceId}/approve" }
  - { priority: 14, category: business_temporal, check: "TimeEntry shift [shift_start_at, shift_end_at] within [pay_period.start_at, pay_period.end_at), shift_end_at strictly after shift_start_at, period is OPEN, and hours_worked equals the shift span (±0.01h)", error_id: ERR_TIME_ENTRY_OUT_OF_WINDOW, http_status: 422, applies_to: "POST /time-entries" }
  - { priority: 14.5, category: business_temporal, check: "New TimeEntry shift (closed interval [shift_start_at, shift_end_at]) must not overlap, and must be separated by >= MIN_REST_GAP_MINUTES (30) from, any POSTED TimeEntry of the same worker (closed-interval + rest-buffer semantics)", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "POST /time-entries" }
  - { priority: 14.7, category: business_temporal, check: "New PayPeriod half-open interval [start_at, end_at) must not overlap any other non-DISBURSED PayPeriod of the same employer (abutting endpoints allowed)", error_id: ERR_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /pay-periods" }
  - { priority: 15, category: business_constraint, check: "Clamped principal_cents >= matched tier.per_advance_floor_cents", error_id: ERR_BELOW_FLOOR, http_status: 422, applies_to: "POST /advances/{advanceId}/approve" }
  - { priority: 16, category: business_constraint, check: "manual-recoup / staged amount > 0 and <= principal_outstanding_cents", error_id: ERR_OVER_RECOUP, http_status: 422, applies_to: "POST /advances/{advanceId}/manual-recoup" }
  - { priority: 17, category: business_fiscal, check: "Employer.funding_balance_cents >= recoup_target_cents at disburse (pool reserves principal+fee)", error_id: ERR_INSUFFICIENT_FUNDING, http_status: 402, applies_to: "POST /advances/{advanceId}/disburse" }
  - { priority: 18, category: business_constraint, check: "external_payroll_ref unique per employer among non-TERMINATED workers", error_id: ERR_DUPLICATE_PAYROLL_REF, http_status: 409, applies_to: "POST /workers" }
  - { priority: 19, category: business_constraint, check: "Exactly one POSTED batch exists for a period before run-payday; none already POSTED when posting a new one", error_id: ERR_BATCH_ALREADY_POSTED, http_status: 409, applies_to: "POST /repayment-batches/{batchId}/post" }
  - { priority: 20, category: business_fiscal, check: "Statement.drift_cents == 0 (outcome CLEAN) before signing", error_id: ERR_STATEMENT_NOT_CLEAN, http_status: 409, applies_to: "POST /reconciliation-statements/{statementId}/sign" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Employer ----
  - { method: POST, path: "/employers", description: "Create an employer (funding pool + advance policy knobs)", roles: [PlatformAdmin], code: 201, input: ["legal_name", "state_code", "pay_frequency", "funding_balance_cents?", "max_advance_pct_of_available?", "per_period_advance_cap_count?", "cooling_off_hours?"], output: Employer, side_effects: ["posture initialized HEALTHY", "outstanding_principal_cents = 0"] }
  - { method: GET, path: "/employers/{employerId}", description: "Fetch employer with computed posture and exposure", roles: [PlatformAdmin, PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: Employer }
  - { method: GET, path: "/employers", description: "List employers (paginated)", roles: [PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Employer[]" }
  - { method: POST, path: "/employers/{employerId}/funding-deposits", description: "Top up the employer funding pool", roles: [PlatformAdmin], code: 200, input: ["amount_cents"], output: Employer, side_effects: ["funding_balance_cents += amount_cents", "recompute posture (may lift RESTRICTED)"] }

  # ---- AdvanceLimitPolicy (flat, employer_id in body / filter) ----
  - { method: POST, path: "/advance-policies", description: "Define a tier's advance limit policy (archives the prior ACTIVE policy for the same employer+tier)", roles: [PlatformAdmin], code: 201, input: ["employer_id", "tier", "min_tenure_days", "per_advance_floor_cents?", "per_advance_ceiling_cents", "cumulative_period_ceiling_cents"], output: AdvanceLimitPolicy, side_effects: ["prior ACTIVE AdvanceLimitPolicy for the same employer_id+tier -> ARCHIVED"] }
  - { method: GET, path: "/advance-policies/{policyId}", description: "Fetch an advance policy", roles: [PlatformAdmin, PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: AdvanceLimitPolicy }
  - { method: GET, path: "/advance-policies", description: "List advance policies filtered by employer_id (FK reverse-reachability for AdvanceLimitPolicy.employer_id)", roles: [PlatformAdmin, PayrollOfficer, ComplianceOfficer], code: 200, input: ["employer_id?", "limit?", "offset?"], output: "AdvanceLimitPolicy[]" }

  # ---- FeeSchedule (flat) ----
  - { method: POST, path: "/fee-schedules", description: "Define the employer fee schedule (archives prior ACTIVE one for that employer)", roles: [PlatformAdmin], code: 201, input: ["employer_id", "expedite_flat_fee_cents?", "expedite_pct_fee?", "max_total_fee_cents?", "tip_allowed?"], output: FeeSchedule, side_effects: ["prior ACTIVE FeeSchedule for the employer -> ARCHIVED"] }
  - { method: GET, path: "/fee-schedules/{feeScheduleId}", description: "Fetch a fee schedule", roles: [PlatformAdmin, PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: FeeSchedule }
  - { method: GET, path: "/fee-schedules", description: "List fee schedules filtered by employer_id (FK reverse-reachability for FeeSchedule.employer_id)", roles: [PlatformAdmin, PayrollOfficer, ComplianceOfficer], code: 200, input: ["employer_id?", "limit?", "offset?"], output: "FeeSchedule[]" }

  # ---- PayPeriod (flat) ----
  - { method: POST, path: "/pay-periods", description: "Open a new pay period (assigns next period_index); rejects interval overlap with another non-DISBURSED period of the employer", roles: [PayrollOfficer], code: 201, input: ["employer_id", "start_at", "end_at"], output: PayPeriod, side_effects: ["period_index = next per-employer counter", "status = OPEN"] }
  - { method: GET, path: "/pay-periods/{payPeriodId}", description: "Fetch a pay period with gross_accrued_cents", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: PayPeriod }
  - { method: GET, path: "/pay-periods", description: "List pay periods filtered by employer_id (FK reverse-reachability for PayPeriod.employer_id)", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: ["employer_id?", "limit?", "offset?"], output: "PayPeriod[]" }
  - { method: POST, path: "/pay-periods/{payPeriodId}/lock", description: "Lock the time feed (OPEN -> LOCKED)", roles: [PayrollOfficer], code: 200, input: [], output: PayPeriod, side_effects: ["locked_at set", "recompute gross_accrued_cents"] }
  - { method: POST, path: "/pay-periods/{payPeriodId}/reopen", description: "Reopen for corrections (LOCKED -> OPEN)", roles: [PayrollOfficer], code: 200, input: [], output: PayPeriod, side_effects: ["locked_at = null"] }
  - { method: POST, path: "/pay-periods/{payPeriodId}/run-payday", description: "Close the period: default un-recouped advances, recompute reconciliation, possibly freeze employer (LOCKED -> DISBURSED)", roles: [PayrollOfficer], code: 200, input: [], output: PayPeriod, side_effects: ["disbursed_at set", "RECOUPING/DISBURSED-with-outstanding advances -> DEFAULTED (cascade)", "defaulted advances' workers -> ON_HOLD (cascade)", "recompute ReconciliationStatement (cascade)", "DISCREPANCY -> Employer.posture FROZEN (cascade)", "POSTED batch -> RECONCILED"] }

  # ---- Worker (flat) ----
  - { method: POST, path: "/workers", description: "Register a worker", roles: [PayrollOfficer], code: 201, input: ["employer_id", "external_payroll_ref", "full_name", "hourly_rate_cents", "hire_date"], output: Worker, side_effects: ["employment_status = ACTIVE", "advance_eligibility = ELIGIBLE"] }
  - { method: GET, path: "/workers/{workerId}", description: "Fetch a worker with computed tenure, counters, available earnings", roles: [PayrollOfficer, ComplianceOfficer, Worker], code: 200, input: [], output: Worker }
  - { method: GET, path: "/workers", description: "List workers filtered by employer_id (FK reverse-reachability for Worker.employer_id)", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: ["employer_id?", "external_payroll_ref?", "limit?", "offset?"], output: "Worker[]" }
  - { method: POST, path: "/workers/{workerId}/suspend", description: "Suspend a worker (ACTIVE -> SUSPENDED)", roles: [PayrollOfficer], code: 200, input: [], output: Worker }
  - { method: POST, path: "/workers/{workerId}/reinstate", description: "Reinstate a worker (SUSPENDED -> ACTIVE)", roles: [PayrollOfficer], code: 200, input: [], output: Worker }
  - { method: POST, path: "/workers/{workerId}/terminate", description: "Terminate a worker (-> TERMINATED)", roles: [PayrollOfficer], code: 200, input: [], output: Worker, side_effects: ["frees external_payroll_ref for reuse"] }

  # ---- TimeEntry (flat) ----
  - { method: POST, path: "/time-entries", description: "Post a time entry (shift) into a period's feed; rejects shift overlap / rest-buffer violation for the worker", roles: [PayrollOfficer], code: 201, input: ["pay_period_id", "worker_id", "shift_start_at", "shift_end_at", "hours_worked"], output: TimeEntry, side_effects: ["gross_earned_cents = round_half_up(hours*rate)", "recompute PayPeriod.gross_accrued_cents and Worker.net_available_earnings_cents"] }
  - { method: GET, path: "/time-entries/{timeEntryId}", description: "Fetch a time entry", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: TimeEntry }
  - { method: GET, path: "/time-entries", description: "List time entries filtered by pay_period_id and/or worker_id (FK reverse-reachability for TimeEntry.pay_period_id and TimeEntry.worker_id)", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: ["pay_period_id?", "worker_id?", "limit?", "offset?"], output: "TimeEntry[]" }
  - { method: POST, path: "/time-entries/{timeEntryId}/void", description: "Void a posted time entry", roles: [PayrollOfficer], code: 200, input: [], output: TimeEntry, side_effects: ["status = VOIDED", "recompute period and worker earnings"] }

  # ---- Advance (flat) ----
  - { method: POST, path: "/advances", description: "Worker requests an advance (REQUESTED); OCC against the worker's observed version", roles: [Worker, PayrollOfficer], code: 201, input: ["worker_id", "pay_period_id", "requested_principal_cents", "disbursement_speed?", "tip_cents?", "expected_worker_version"], output: Advance, side_effects: ["employer_id set from worker", "requested_at = server clock", "status = REQUESTED", "increments Worker.version by 1"] }
  - { method: GET, path: "/advances/{advanceId}", description: "Fetch an advance with computed fees, recoup target, outstanding", roles: [Worker, PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: Advance }
  - { method: GET, path: "/advances", description: "List advances filtered by worker_id, pay_period_id, or employer_id (FK reverse-reachability for Advance.worker_id, Advance.pay_period_id, Advance.employer_id)", roles: [PayrollOfficer, ComplianceOfficer, Worker], code: 200, input: ["worker_id?", "pay_period_id?", "employer_id?", "limit?", "offset?"], output: "Advance[]" }
  - { method: POST, path: "/advances/{advanceId}/approve", description: "Approve & price an advance (REQUESTED -> APPROVED): clamp principal, compute fees", roles: [PayrollOfficer], code: 200, input: [], output: Advance, side_effects: ["principal_cents clamp", "expedite_fee_cents, total_fee_cents, recoup_target_cents computed", "disbursed_amount_cents = principal_cents"] }
  - { method: POST, path: "/advances/{advanceId}/decline", description: "Decline a requested advance (REQUESTED -> DECLINED)", roles: [PayrollOfficer], code: 200, input: [], output: Advance }
  - { method: POST, path: "/advances/{advanceId}/disburse", description: "Disburse cash to worker (APPROVED -> DISBURSED): debit funding pool by recoup_target, anchor cooling-off", roles: [PayrollOfficer], code: 200, input: [], output: Advance, side_effects: ["disbursed_at set", "funding_balance_cents -= recoup_target_cents", "principal_outstanding_cents = recoup_target_cents", "recompute worker counters and employer posture (cascade)"] }
  - { method: POST, path: "/advances/{advanceId}/manual-recoup", description: "Manually recover from a DEFAULTED advance (DEFAULTED -> RECOUPING; SETTLED if outstanding hits 0)", roles: [PayrollOfficer], code: 200, input: ["amount_cents"], output: Advance, side_effects: ["create Repayment row", "amount_recouped_cents += amount", "recompute statement drift (cascade)", "possible -> SETTLED crediting funding pool"] }
  - { method: POST, path: "/advances/{advanceId}/write-off", description: "Write off an unrecoverable DEFAULTED advance (DEFAULTED -> WRITTEN_OFF)", roles: [ComplianceOfficer], code: 200, input: [], output: Advance, side_effects: ["written_off amount = principal_outstanding_cents", "principal_outstanding_cents = 0", "recompute statement written_off_cents & drift (cascade)", "outstanding_principal_cents decreases"] }

  # ---- RepaymentBatch (flat) ----
  - { method: POST, path: "/repayment-batches", description: "Open a draft recoup batch for a period", roles: [PayrollOfficer], code: 201, input: ["pay_period_id"], output: RepaymentBatch, side_effects: ["employer_id set from period", "status = DRAFT"] }
  - { method: GET, path: "/repayment-batches/{batchId}", description: "Fetch a batch with computed totals", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: RepaymentBatch }
  - { method: GET, path: "/repayment-batches", description: "List batches filtered by pay_period_id or employer_id (FK reverse-reachability for RepaymentBatch.pay_period_id and RepaymentBatch.employer_id)", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: ["pay_period_id?", "employer_id?", "limit?", "offset?"], output: "RepaymentBatch[]" }
  - { method: POST, path: "/repayment-batches/{batchId}/post", description: "Post the batch (DRAFT -> POSTED): run payday-recoup waterfall, cascade advances to RECOUPING/SETTLED; SoD enforced; OCC on batch version", roles: [PayrollOfficer], code: 200, input: ["expected_repaymentbatch_version"], output: RepaymentBatch, side_effects: ["run calculations.payday_recoup, create Repayment rows", "advances DISBURSED -> RECOUPING -> SETTLED cascade", "SETTLED advances credit funding pool", "total_recouped_cents, advance_count computed", "posted_by_user_id = X-User-ID", "increments RepaymentBatch.version by 1"] }
  - { method: POST, path: "/repayment-batches/{batchId}/cancel", description: "Cancel a draft batch (DRAFT -> CANCELLED)", roles: [PayrollOfficer], code: 200, input: [], output: RepaymentBatch }

  # ---- Repayment (flat read; created only by waterfall / manual-recoup) ----
  - { method: GET, path: "/repayments/{repaymentId}", description: "Fetch a single repayment row", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: Repayment }
  - { method: GET, path: "/repayments", description: "List repayment rows filtered by advance_id or repayment_batch_id (FK reverse-reachability for Repayment.advance_id and Repayment.repayment_batch_id)", roles: [PayrollOfficer, ComplianceOfficer, Worker], code: 200, input: ["advance_id?", "repayment_batch_id?", "limit?", "offset?"], output: "Repayment[]" }

  # ---- ReconciliationStatement (flat) ----
  - { method: POST, path: "/reconciliation-statements", description: "Create or recompute a period's reconciliation statement (DRAFT)", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: ["pay_period_id"], output: ReconciliationStatement, side_effects: ["employer_id set from period", "compute expected/actual/written_off/drift/outcome", "DRAFT recompute only (idempotent on an unsigned statement)"] }
  - { method: GET, path: "/reconciliation-statements/{statementId}", description: "Fetch a reconciliation statement", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: [], output: ReconciliationStatement }
  - { method: GET, path: "/reconciliation-statements", description: "List statements filtered by pay_period_id or employer_id (FK reverse-reachability for ReconciliationStatement.pay_period_id and ReconciliationStatement.employer_id)", roles: [PayrollOfficer, ComplianceOfficer], code: 200, input: ["pay_period_id?", "employer_id?", "limit?", "offset?"], output: "ReconciliationStatement[]" }
  - { method: POST, path: "/reconciliation-statements/{statementId}/sign", description: "Sign a CLEAN statement (DRAFT -> SIGNED): SoD enforced, may lift employer FROZEN", roles: [ComplianceOfficer], code: 200, input: [], output: ReconciliationStatement, side_effects: ["signed_by_user_id = X-User-ID", "recompute Employer.posture (may lift FROZEN)"] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server clock for deterministic tenure/cooling-off/payday tests", roles: [PlatformAdmin], code: 200, input: ["to_iso8601"], output: null, side_effects: ["server clock pinned to to_iso8601 for all subsequent server-stamped fields and elapsed-time checks"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, enum out of range, or numeric out of declared bounds" }
  - { id: ERR_CROSS_EMPLOYER_REFERENCE, http: 422, condition: "Body FK target exists but belongs to a different employer (or worker/pay_period employers mismatch)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Actor would perform two duties that must be separated (approver vs poster vs signer) in the same period" }
  - { id: ERR_EMPLOYER_FROZEN, http: 409, condition: "Employer.posture == FROZEN blocks disbursement-class operations" }
  - { id: ERR_WORKER_NOT_ACTIVE, http: 409, condition: "Worker.employment_status != ACTIVE at advance approval" }
  - { id: ERR_WORKER_ON_HOLD, http: 409, condition: "Worker.advance_eligibility == ON_HOLD at advance approval" }
  - { id: ERR_COOLING_OFF_ACTIVE, http: 409, condition: "Cooling-off window has not elapsed since the worker's last DISBURSED advance" }
  - { id: ERR_PERIOD_CAP_REACHED, http: 409, condition: "Worker already at per_period_advance_cap_count advances this period" }
  - { id: ERR_TIME_ENTRY_OUT_OF_WINDOW, http: 422, condition: "shift outside [start_at, end_at), shift_end_at not after shift_start_at, hours_worked mismatched to shift span, or pay period not OPEN" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift overlaps or is within the rest-buffer of an existing POSTED shift for the same worker" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "New pay period interval overlaps an existing non-DISBURSED period for the same employer" }
  - { id: ERR_BELOW_FLOOR, http: 422, condition: "Clamped principal fell below the matched tier's per_advance_floor_cents" }
  - { id: ERR_OVER_RECOUP, http: 422, condition: "Recoup amount is <= 0 or exceeds principal_outstanding_cents" }
  - { id: ERR_INSUFFICIENT_FUNDING, http: 402, condition: "Employer funding pool cannot cover the disbursement" }
  - { id: ERR_DUPLICATE_PAYROLL_REF, http: 409, condition: "external_payroll_ref already used by a non-TERMINATED worker for this employer" }
  - { id: ERR_BATCH_ALREADY_POSTED, http: 409, condition: "Another RepaymentBatch for the period is already POSTED/RECONCILED" }
  - { id: ERR_NO_POSTED_BATCH, http: 409, condition: "run-payday requires exactly one POSTED batch for the period" }
  - { id: ERR_PERIOD_NOT_LOCKED, http: 409, condition: "Posting a batch requires the period in LOCKED status" }
  - { id: ERR_PERIOD_HAS_POSTED_BATCH, http: 409, condition: "Reopen blocked because a batch for the period is POSTED/RECONCILED" }
  - { id: ERR_PERIOD_NOT_DISBURSED, http: 409, condition: "Operation (write-off, sign) requires the period to have been DISBURSED" }
  - { id: ERR_NOTHING_TO_WRITE_OFF, http: 409, condition: "Write-off attempted on an advance with no outstanding principal" }
  - { id: ERR_WORKER_HAS_OPEN_ADVANCE, http: 409, condition: "Terminate blocked while the worker has a DISBURSED/RECOUPING/DEFAULTED advance" }
  - { id: ERR_STATEMENT_NOT_CLEAN, http: 409, condition: "Sign attempted while statement.drift_cents != 0 (DISCREPANCY)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: provisions employers, policies, fee schedules, funding; controls the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /employers"
      - "GET /employers"
      - "POST /employers/{employerId}/funding-deposits"
      - "POST /advance-policies"
      - "POST /fee-schedules"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /employers/{employerId}"
      - "GET /advance-policies"
      - "GET /fee-schedules"

  - name: PayrollOfficer
    description: "Employer-side payroll operator: manages periods, time feed, workers, approves/disburses advances, posts recoup batches. SoD: approver of an advance cannot post that period's batch nor sign its statement."
    identity: opaque
    exclusive_operations:
      - "POST /pay-periods"
      - "POST /pay-periods/{payPeriodId}/lock"
      - "POST /pay-periods/{payPeriodId}/reopen"
      - "POST /pay-periods/{payPeriodId}/run-payday"
      - "POST /workers"
      - "POST /workers/{workerId}/suspend"
      - "POST /workers/{workerId}/reinstate"
      - "POST /workers/{workerId}/terminate"
      - "POST /time-entries"
      - "POST /time-entries/{timeEntryId}/void"
      - "POST /advances/{advanceId}/approve"
      - "POST /advances/{advanceId}/decline"
      - "POST /advances/{advanceId}/disburse"
      - "POST /advances/{advanceId}/manual-recoup"
      - "POST /repayment-batches"
      - "POST /repayment-batches/{batchId}/post"
      - "POST /repayment-batches/{batchId}/cancel"
    shared_operations:
      - "GET /employers/{employerId}"
      - "POST /advances"
      - "GET /advances/{advanceId}"
      - "GET /advances"
      - "GET /repayments"
      - "POST /reconciliation-statements"
      - "GET /reconciliation-statements/{statementId}"
      - "GET /reconciliation-statements"
      - "GET /pay-periods/{payPeriodId}"
      - "GET /pay-periods"
      - "GET /workers/{workerId}"
      - "GET /workers"
      - "GET /time-entries"
      - "GET /advance-policies"
      - "GET /fee-schedules"
      - "GET /repayment-batches/{batchId}"
      - "GET /repayment-batches"
      - "GET /repayments/{repaymentId}"

  - name: ComplianceOfficer
    description: "Employer-side controller: signs reconciliation statements and writes off bad debt. SoD: cannot be the period's batch poster nor an advance approver in the period being signed."
    identity: opaque
    exclusive_operations:
      - "POST /advances/{advanceId}/write-off"
      - "POST /reconciliation-statements/{statementId}/sign"
    shared_operations:
      - "GET /employers/{employerId}"
      - "GET /advances/{advanceId}"
      - "GET /advances"
      - "GET /repayments"
      - "POST /reconciliation-statements"
      - "GET /reconciliation-statements/{statementId}"
      - "GET /reconciliation-statements"
      - "GET /pay-periods/{payPeriodId}"
      - "GET /pay-periods"
      - "GET /workers/{workerId}"
      - "GET /workers"
      - "GET /time-entries"
      - "GET /advance-policies"
      - "GET /fee-schedules"
      - "GET /repayment-batches/{batchId}"
      - "GET /repayment-batches"
      - "GET /repayments/{repaymentId}"

  - name: Worker
    description: "Self-service worker: requests advances against own earnings, views own advances/repayments/profile. X-User-ID equals the acting Worker.id; ownership enforced on self-targeted reads and on advance creation (worker_id must equal X-User-ID)."
    identity: "entity_backed:Worker"
    exclusive_operations: []
    shared_operations:
      - "POST /advances"
      - "GET /advances/{advanceId}"
      - "GET /advances"
      - "GET /repayments"
      - "GET /workers/{workerId}"
