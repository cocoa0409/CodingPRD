            - "Second call HTTP 201 with ${doc_ok} == true and ${plan_end} == 2028-08-01T00:00:00Z (window_start + 31 months, exclusive)"
            - "${err_window} == ERR_WCSH_WINDOW_CLOSED with HTTP 422 because the clock 2028-09-01 is at or past ${plan_end}"
            - "WorkingCapitalPlan.${plan_id}.status is still DRAFT and QOZBusiness.${biz_id}.wcsh_protected_amount == 0.00 (an unactivated plan shelters nothing)"

      - name: improvement_aggregation_group_key_invalid_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - entities.ImprovementProject.group_key
          - errors[ERR_AGGREGATION_GROUP_INVALID]
        distinguishing_aspect: "group_key is declared OPTIONAL in §1.5, so its conditional requirement is priority 30's business rule (422) rather than the schema check at priority 4 (400). All three limbs are exercised: AGGREGATED_GROUP without a key, ASSET_BY_ASSET with a key, and a key shared across two different funds."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Group Fund A", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
