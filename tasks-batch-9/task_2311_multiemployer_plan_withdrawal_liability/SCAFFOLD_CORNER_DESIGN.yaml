              payload: { liability_assessment_id: "${la_id}", grounds_summary: "The plan's 7 percent interest assumption is unreasonable.", challenged_assumption: "INTEREST_RATE", proposed_interest_rate_bps: 450 }
              as: EmployerRepresentative
