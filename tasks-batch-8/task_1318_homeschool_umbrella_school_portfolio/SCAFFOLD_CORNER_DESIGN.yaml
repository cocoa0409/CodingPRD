# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Homeschool Umbrella School & Portfolio Review
# Breadth walk of SCAFFOLD.yaml §1.1–§1.7 per claim-extraction-guide.
# Stubs (excluded_because) point at the §1.8 instance that already covers them.
# Canonical fixture year: 2026-08-01..2027-05-31; NOI deadline 2026-09-15;
# portfolio due 2027-04-30; report due 2027-06-15; mid-year 2027-01-15.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_family_missing_required_district_code_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Family.fields.district_code", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /families without district_code is rejected 400; the missing field is required with no default."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /families", payload: { display_name: "No District" }, as: Parent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (HTTP 400)"

      - name: academic_year_defaults_applied
        claim_type: defaults
        grounds: ["entities.AcademicYear.fields.testing_grades", "entities.AcademicYear.fields.required_instructional_days", "entities.AcademicYear.fields.required_minutes_elementary", "entities.AcademicYear.fields.required_minutes_secondary"]
        distinguishing_aspect: "Omitting the four optional config fields yields the documented defaults, and a new year starts in PLANNING."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id, tg: $.data.testing_grades, rd: $.data.required_instructional_days, rme: $.data.required_minutes_elementary, rms: $.data.required_minutes_secondary, st: $.data.status } }
          assert:
            - "testing_grades == [3, 5, 8, 11]"
            - "required_instructional_days == 180"
            - "required_minutes_elementary == 54000"
            - "required_minutes_secondary == 59400"
            - "status == PLANNING and version == 1"

      - name: enrollment_initial_state_and_testing_flag
        claim_type: initial_state
        grounds: ["entities.Enrollment.fields.enrollment_status", "entities.Enrollment.fields.testing_required", "calculations.testing_requirement"]
        distinguishing_aspect: "A new enrollment starts REGISTERED / GOOD_STANDING with zeroed counters; testing_required is computed from grade membership in testing_grades (grade 5 -> true, grade 4 -> false)."
        test_recipe:
          setup: ["year OPEN; one family with two students"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Init", district_code: "D-30" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Five", date_of_birth: "2015-01-01" }, as: Parent, as_user_id: "${fam}", captures: { stu5: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Four", date_of_birth: "2016-01-01" }, as: Parent, as_user_id: "${fam}", captures: { stu4: $.data.id } }
          trigger:
            - { call: "POST /students/${stu5}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 5 }, as: Parent, as_user_id: "${fam}", captures: { e5: $.data.id, s5: $.data.enrollment_status, t5: $.data.testing_required, pd5: $.data.provisional_days_counted } }
            - { call: "POST /students/${stu4}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { e4: $.data.id, t4: $.data.testing_required, st4: $.data.compliance_standing } }
          assert:
            - "grade-5 enrollment: enrollment_status == REGISTERED, compliance_standing == GOOD_STANDING, testing_required == true, testing_satisfied == false, provisional_days_counted == 0, certified_minutes_credited == 0"
            - "grade-4 enrollment: testing_required == false (4 not in [3,5,8,11])"

      - name: create_family_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Family.fields.fee_balance_cents", "entities.Family.fields.fee_status"]
        distinguishing_aspect: "Client-supplied fee_balance_cents and fee_status are ignored; the server computes 0 and CURRENT."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /families", payload: { display_name: "Fam X", district_code: "D-31", fee_balance_cents: 5000, fee_status: "OVERDUE" }, as: Parent, captures: { bal: $.data.fee_balance_cents, fstat: $.data.fee_status } }
          assert:
            - "fee_balance_cents == 0 (input 5000 ignored)"
            - "fee_status == CURRENT (input OVERDUE ignored)"

      - name: get_nonexistent_enrollment_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID hits priority-4 existence and returns 404."
        test_recipe:
          setup: ["empty DB (no enrollment exists)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /enrollments/12345678-1234-1234-1234-123456789abc", payload: {}, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: parent_cannot_read_other_family
        claim_type: parent_relationships
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP_MISMATCH]", "roles[Parent]"]
        distinguishing_aspect: "Parent role is entity_backed:Family; X-User-ID of family A reading family B's record yields 403 ownership mismatch (multi-family isolation)."
        test_recipe:
          setup: ["families A and B exist"]
          setup_api_calls:
            - { call: "POST /families", payload: { display_name: "Fam A", district_code: "D-32" }, as: Parent, captures: { famA: $.data.id } }
            - { call: "POST /families", payload: { display_name: "Fam B", district_code: "D-33" }, as: Parent, captures: { famB: $.data.id } }
          trigger:
            - { call: "GET /families/${famB}", payload: {}, as: Parent, as_user_id: "${famA}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OWNERSHIP_MISMATCH (HTTP 403)"

      - name: list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more per the fixed envelope (default limit 10, page 1 of 3 classes -> has_more true, page 2 at offset 2 -> has_more false)."
        test_recipe:
          setup: ["year exists with three co-op classes"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "P1", subject: "Art", grade_min: 0, grade_max: 12, meeting_day: "MON", meeting_start_minutes: 540, meeting_end_minutes: 600, start_date: "2026-09-01", end_date: "2026-12-15", capacity: 5, fee_base_cents: 1000, materials_fee_cents: 0 }, as: Registrar }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "P2", subject: "Art", grade_min: 0, grade_max: 12, meeting_day: "TUE", meeting_start_minutes: 540, meeting_end_minutes: 600, start_date: "2026-09-01", end_date: "2026-12-15", capacity: 5, fee_base_cents: 1000, materials_fee_cents: 0 }, as: Registrar }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "P3", subject: "Art", grade_min: 0, grade_max: 12, meeting_day: "WED", meeting_start_minutes: 540, meeting_end_minutes: 600, start_date: "2026-09-01", end_date: "2026-12-15", capacity: 5, fee_base_cents: 1000, materials_fee_cents: 0 }, as: Registrar }
          trigger:
            - { call: "GET /academic-years/${yr}/coop-classes?limit=2&offset=0", payload: {}, as: Registrar }
            - { call: "GET /academic-years/${yr}/coop-classes?limit=2&offset=2", payload: {}, as: Registrar }
          assert:
            - "page 1: total_count == 3, has_more == true, exactly 2 items"
            - "page 2 (offset 2): has_more == false, exactly 1 item"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: notice_full_lifecycle_with_refile_cycle
        claim_type: valid_transition
        grounds: ["state_machines.NoticeOfIntent.DRAFT_to_FILED", "state_machines.NoticeOfIntent.FILED_to_RETURNED", "state_machines.NoticeOfIntent.RETURNED_to_FILED", "state_machines.NoticeOfIntent.FILED_to_ACKNOWLEDGED", "entities.NoticeOfIntent.fields.refile_count"]
        distinguishing_aspect: "DRAFT->FILED->RETURNED->FILED->ACKNOWLEDGED walks the refile cycle; refile_count increments exactly once; a file attempt on ACKNOWLEDGED is then rejected as an invalid transition."
        test_recipe:
          setup: ["year OPEN; family; student; enrollment REGISTERED"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Noi", district_code: "D-34" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Noi", date_of_birth: "2016-02-02" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-34" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
          trigger:
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}", captures: { s1: $.data.status, rc1: $.data.refile_count } }
            - { call: "POST /notices/${noi}/return", payload: { returned_reason: "missing signature page" }, as: Registrar, captures: { s2: $.data.status, rr: $.data.returned_reason } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}", captures: { s3: $.data.status, rc2: $.data.refile_count, rr2: $.data.returned_reason } }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar, captures: { s4: $.data.status, ack: $.data.acknowledged_at } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}", captures: { err: $.data.error_id } }
          assert:
            - "first file: status FILED, refile_count == 0"
            - "return: status RETURNED, returned_reason == 'missing signature page'"
            - "refile: status FILED, refile_count == 1, returned_reason cleared to null"
            - "acknowledge: status ACKNOWLEDGED, acknowledged_at != null"
            - "file on ACKNOWLEDGED: error_id == ERR_INVALID_STATE_TRANSITION (HTTP 409)"

      - name: notice_acknowledge_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.NoticeOfIntent", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "FILED is the only source state for acknowledge; DRAFT -> ACKNOWLEDGED is rejected 409."
        test_recipe:
          setup: ["year OPEN; family; student; enrollment; notice in DRAFT"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam D", district_code: "D-35" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid D", date_of_birth: "2016-03-03" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-35" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
          trigger:
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (HTTP 409); notice stays DRAFT"

      - name: withdrawn_enrollment_rejects_activation
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Enrollment.enrollment_status", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "WITHDRAWN is terminal: withdraw from REGISTERED then activate is rejected 409; cascades archived nothing (no notice/plan existed)."
        test_recipe:
          setup: ["year OPEN; family; student; enrollment REGISTERED then WITHDRAWN"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam W", district_code: "D-36" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid W", date_of_birth: "2016-04-04" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/withdraw", payload: { reason: "moving" }, as: Parent, as_user_id: "${fam}", captures: { wst: $.data.enrollment_status } }
          trigger:
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "withdraw response enrollment_status == WITHDRAWN"
            - "activate: error_id == ERR_INVALID_STATE_TRANSITION (HTTP 409)"

      - name: duplicate_portfolio_create_rejected
        claim_type: invalid_transition
        grounds: ["errors[ERR_PORTFOLIO_ALREADY_EXISTS]", "entities.Portfolio.fields.enrollment_id"]
        distinguishing_aspect: "Exactly one Portfolio per enrollment; the second create returns 409 ERR_PORTFOLIO_ALREADY_EXISTS."
        test_recipe:
          setup: ["year OPEN; family; student; enrollment REGISTERED; portfolio already created"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam P", district_code: "D-37" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid P", date_of_birth: "2016-05-05" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/portfolios", payload: {}, as: Parent, as_user_id: "${fam}", captures: { por: $.data.id } }
          trigger:
            - { call: "POST /enrollments/${enr}/portfolios", payload: {}, as: Parent, as_user_id: "${fam}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PORTFOLIO_ALREADY_EXISTS (HTTP 409)"

      - name: evaluation_accepted_requires_min_scores
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_EVALUATION_SCORE_OUTCOME_MISMATCH]", "state_machines.Portfolio.SUBMITTED_to_ACCEPTED", "entities.Evaluation.fields.subject_scores"]
        distinguishing_aspect: "overall_outcome ACCEPTED with any subject score < 2 is rejected 422; the portfolio stays SUBMITTED."
        test_recipe:
          setup: ["year OPEN; family; grade-4 student; enrollment ACTIVE; portfolio SUBMITTED (attempt 1)"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam E", district_code: "D-38" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid E", date_of_birth: "2016-06-06" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-38" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/portfolios", payload: {}, as: Parent, as_user_id: "${fam}", captures: { por: $.data.id } }
            - { call: "POST /portfolios/${por}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
          trigger:
            - { call: "POST /portfolios/${por}/evaluations", payload: { overall_outcome: "ACCEPTED", subject_scores: [ { subject: "READING", score: 3 }, { subject: "WRITING", score: 3 }, { subject: "MATH", score: 1 }, { subject: "SCIENCE", score: 3 }, { subject: "SOCIAL_STUDIES", score: 3 } ] }, as: Reviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
            - { call: "GET /portfolios/${por}", payload: {}, as: Registrar, captures: { pst: $.data.status } }
          assert:
            - "error_id == ERR_EVALUATION_SCORE_OUTCOME_MISMATCH (HTTP 422; MATH score 1 < 2)"
            - "Portfolio.${por}.status still == SUBMITTED (no evaluation row persisted)"

      - name: record_attendance_requires_administered_session
        claim_type: precondition_enforcement
        grounds: ["state_machines.TestRegistration.REGISTERED_to_ATTENDED", "errors[ERR_EXAM_SESSION_NOT_OPEN]"]
        distinguishing_aspect: "record-attendance on a registration whose session is still REGISTRATION_OPEN (not ADMINISTERED) returns 409 ERR_EXAM_SESSION_NOT_OPEN."
        test_recipe:
          setup: ["year OPEN; family; grade-5 student; enrollment ACTIVE; session REGISTRATION_OPEN with the student registered"]
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam S", district_code: "D-39" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid S", date_of_birth: "2015-07-07" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 5 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-39" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
