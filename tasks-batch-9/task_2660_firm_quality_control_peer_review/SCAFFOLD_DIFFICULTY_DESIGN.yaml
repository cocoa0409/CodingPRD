            - "the response body carries exactly one error_id"
            - "GET /quality-reviews?engagement_id=${e1_id} returns exactly 0 rows"
            - "Engagement.${e1_id}.workflow_state == REPORT_RELEASED"
            - "Engagement.${e1_id}.eqr_concurred_at == null"
            - "Partner.${p_rev_id}.open_eqr_count == 0"

      - name: selection_firm_mismatch_referential_check_outranks_scope_hours_fiscal_check
        grounds:
          - validations[priority=31]
          - validations[priority=61]
          - errors[ERR_ENGAGEMENT_FIRM_MISMATCH]
          - errors[ERR_SCOPE_HOURS_EXCEEDED]
          - calculations.peer_review_hours_scope
          - concurrency_rules[peer-review-selection-stale-review]
        distinguishing_aspect: |
          A different pair on a different endpoint: business_referential (priority 31) versus
          business_fiscal (priority 61). The selected engagement belongs to another firm AND its
          200 committed hours exceed the review's 16 unallocated hours, so the single returned error
          must be ERR_ENGAGEMENT_FIRM_MISMATCH, never ERR_SCOPE_HOURS_EXCEEDED, and unallocated_hours
          must remain exactly 16.
        test_recipe:
          setup:
            - "Firm A 'Norwell Ash LLP' (aa_hours_last_year 400, no released engagements) has a PeerReview assigned to PeerReviewer 'Kestrel Peer Review PC' and scoped, giving must_select_categories [] and total_scope_hours 16 with unallocated_hours 16."
            - "Firm B 'Osier Ridge LLP' is a separate firm with its own engagement partner and one AUDIT engagement with period_end 2024-06-30."
            - "The caller holds Firm A's PeerReview version as returned by the scope call."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Norwell Ash LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_a_id: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { reviewer_firm_name: "Kestrel Peer Review PC", license_state: "CA", qualified_categories: [], max_concurrent_reviews: 2, experience_hours: 5000 }
              as: PeerReviewCommittee
              captures: { rv1_id: $.data.id }
            - call: "POST /firms/${firm_a_id}/peer-reviews"
              payload: { review_type: "SYSTEM_REVIEW", year_end: "2026-12-31", scheduled_window_start: "2026-09-01", scheduled_window_end: "2026-09-15" }
              as: PeerReviewCommittee
              captures: { pr_id: $.data.id }
            - call: "POST /peer-reviews/${pr_id}/reviewer-assignment"
              payload: { reviewer_id: "${rv1_id}" }
              as: PeerReviewCommittee
            - call: "POST /peer-reviews/${pr_id}/scope"
              payload: {}
              as: PeerReviewer
              as_user_id: "${rv1_id}"
              captures: { pr_v: $.data.version }
            - call: "POST /firms"
              payload: { legal_name: "Osier Ridge LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_b_id: $.data.id }
            - call: "POST /firms/${firm_b_id}/partners"
              payload: { full_name: "Tarn Wilde", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_epb_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_b_id}", client_name: "Pell Textiles", engagement_type: "AUDIT", period_end: "2024-06-30", engagement_partner_id: "${p_epb_id}" }
              as: EngagementPartner
              as_user_id: "${p_epb_id}"
              captures: { e_b_id: $.data.id }
          trigger:
            - call: "POST /peer-reviews/${pr_id}/selections"
              payload: { engagement_id: "${e_b_id}", hours_committed: 200, is_scope_limitation: false, expected_peer_review_version: "${pr_v}" }
              as: PeerReviewer
              as_user_id: "${rv1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_ENGAGEMENT_FIRM_MISMATCH"
            - "the trigger does not return ERR_SCOPE_HOURS_EXCEEDED"
            - "the response body carries exactly one error_id"
            - "PeerReview.${pr_id}.total_scope_hours == 16"
            - "PeerReview.${pr_id}.unallocated_hours == 16"
            - "PeerReview.${pr_id}.state == SCOPE_SET"
            - "GET /peer-review-selections?peer_review_id=${pr_id} returns exactly 0 rows"
            - "PeerReviewer.${rv1_id}.committed_hours_balance == 0"

      - name: reviewer_window_conflict_temporal_check_outranks_capacity_constraint_check
        grounds:
          - validations[priority=43]
          - validations[priority=51]
          - errors[ERR_REVIEWER_WINDOW_CONFLICT]
          - errors[ERR_REVIEWER_AT_CAPACITY]
          - calculations.peer_reviewer_selection
          - entities.PeerReviewer.fields.max_concurrent_reviews
        distinguishing_aspect: |
          The third pinned pair, on a third endpoint: business_temporal (priority 43) versus
          business_constraint (priority 51). The named reviewer is simultaneously at capacity
          (active_review_count 1 == max_concurrent_reviews 1) and window-conflicted (the new window
          starts 2026-09-16, inside the existing window's end 2026-09-15 extended by the 5-day travel
          buffer to 2026-09-20). The single returned error must be ERR_REVIEWER_WINDOW_CONFLICT, and
          the second review must stay SCHEDULED with assigned_reviewer_id null.
        test_recipe:
          setup:
            - "Firm 'Pentland Row LLP' licensed in CA."
            - "PeerReviewer 'Kestrel Peer Review PC' is licensed in CA with max_concurrent_reviews 1 and accepts_out_of_state false."
            - "PeerReview PR1 for year_end 2025-12-31 with window 2026-09-01..2026-09-15 has already been assigned to that reviewer, so active_review_count is 1 and PR1 is in state PLANNING (pre-report)."
            - "PeerReview PR2 for year_end 2026-12-31 with window 2026-09-16..2026-09-30 is still SCHEDULED."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Pentland Row LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /peer-reviewers"
              payload: { reviewer_firm_name: "Kestrel Peer Review PC", license_state: "CA", accepts_out_of_state: false, qualified_categories: [], max_concurrent_reviews: 1, experience_hours: 5000 }
              as: PeerReviewCommittee
              captures: { rv1_id: $.data.id }
            - call: "POST /firms/${firm_id}/peer-reviews"
              payload: { review_type: "SYSTEM_REVIEW", year_end: "2025-12-31", scheduled_window_start: "2026-09-01", scheduled_window_end: "2026-09-15" }
              as: PeerReviewCommittee
              captures: { pr1_id: $.data.id }
            - call: "POST /peer-reviews/${pr1_id}/reviewer-assignment"
              payload: { reviewer_id: "${rv1_id}" }
              as: PeerReviewCommittee
            - call: "POST /firms/${firm_id}/peer-reviews"
              payload: { review_type: "SYSTEM_REVIEW", year_end: "2026-12-31", scheduled_window_start: "2026-09-16", scheduled_window_end: "2026-09-30" }
              as: PeerReviewCommittee
              captures: { pr2_id: $.data.id }
          trigger:
            - call: "POST /peer-reviews/${pr2_id}/reviewer-assignment"
              payload: { reviewer_id: "${rv1_id}" }
              as: PeerReviewCommittee
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_REVIEWER_WINDOW_CONFLICT"
            - "the trigger does not return ERR_REVIEWER_AT_CAPACITY"
            - "the response body carries exactly one error_id"
            - "PeerReview.${pr2_id}.state == SCHEDULED"
            - "PeerReview.${pr2_id}.assigned_reviewer_id == null"
            - "PeerReviewer.${rv1_id}.active_review_count == 1"
            - "PeerReview.${pr1_id}.assigned_reviewer_id == ${rv1_id}"
            - "Firm.${firm_id}.unassigned_review_flag == false"

  # =====================================================================
  # Rule 6 - boundary_precision_check
  # Three metrics on three endpoints: empty-set coverage percentage, an
  # exact calendar-day cooling-off floor, and the inclusive 7.00 acceptance
  # threshold with its 6.99 neighbour.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: must_select_coverage_reads_exactly_100_00_on_the_empty_eligible_set
        grounds:
          - calculations.must_select_coverage_pct
          - state_machines.InternalInspection.SELECTION_COMPLETE_to_CONCLUDED
          - entities.InternalInspection.fields.must_select_eligible_count
          - entities.InternalInspection.fields.must_select_coverage_pct
          - entities.InternalInspection.fields.deficiency_severity_index
          - errors[ERR_MUST_SELECT_COVERAGE_INCOMPLETE]
          - errors[ERR_NO_ELIGIBLE_ENGAGEMENTS]
        distinguishing_aspect: |
          Empty-set boundary on the coverage percentage: with must_select_eligible_count 0 the
          percentage is exactly 100.00 (not 0.00 and not null), so SELECTION_COMPLETE -> CONCLUDED is
          allowed with engagements_selected_count 0, deficiency_severity_index 0.00 and
          severity_index_basis ENGAGEMENT_WEIGHTED, while SELECTION_COMPLETE -> IN_PROGRESS on the same
          empty cycle is refused with ERR_NO_ELIGIBLE_ENGAGEMENTS.
        test_recipe:
          setup:
            - "Firm 'Quillon Marsh LLP' has a QC director but no Engagement rows at all, so the 2024 selection pool is empty."
            - "InternalInspection 2024 with target_engagement_count 3 has run its selector and sits in state SELECTION_COMPLETE with zero selections."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Quillon Marsh LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /firms/${firm_id}/internal-inspections"
              payload: { inspection_year: 2024, target_engagement_count: 3 }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { insp_id: $.data.id }
            - call: "POST /internal-inspections/${insp_id}/selections"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
          trigger:
            - call: "POST /internal-inspections/${insp_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { blocked_error: $.data.error_id }
            - call: "POST /internal-inspections/${insp_id}/transitions"
              payload: { to_state: "CONCLUDED" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_NO_ELIGIBLE_ENGAGEMENTS"
            - "InternalInspection.${insp_id}.engagements_selected_count == 0"
            - "InternalInspection.${insp_id}.must_select_eligible_count == 0"
            - "InternalInspection.${insp_id}.must_select_selected_count == 0"
            - "InternalInspection.${insp_id}.must_select_coverage_pct == 100.00"
            - "InternalInspection.${insp_id}.state == CONCLUDED"
            - "InternalInspection.${insp_id}.deficiency_severity_index == 0.00"
            - "InternalInspection.${insp_id}.severity_index_basis == ENGAGEMENT_WEIGHTED"
            - "InternalInspection.${insp_id}.concluded_at != null"
            - "GET /inspection-selections?inspection_id=${insp_id} returns exactly 0 rows"

      - name: cooling_off_730_days_passes_while_729_days_is_refused
        grounds:
          - calculations.eqr_reviewer_eligibility
          - validations[priority=38]
          - errors[ERR_COOLING_OFF_NOT_MET]
          - entities.EngagementQualityReview.fields.cooling_off_days_at_assignment
          - entities.Partner.fields.prior_engagement_team_clients
          - concurrency_rules[eqr-assign-stale-engagement]
        distinguishing_aspect: |
          A different metric on a different endpoint: the cooling-off floor is measured in whole
          calendar days and is inclusive at 730. An exit_date of 2022-07-01 against period_end
          2024-06-30 is exactly 730 days and the assignment succeeds with
          cooling_off_days_at_assignment 730; an exit_date one day later (2022-07-02, 729 days) on an
          otherwise identical engagement is refused with ERR_COOLING_OFF_NOT_MET. An off-by-one or a
          month-arithmetic implementation flips one of the two calls.
        test_recipe:
          setup:
            - "Firm 'Rushmere Kell LLP' with engagement partner Eli Parch, QC director Quinn Cade and EQ reviewer Sable Ord (designations ['EQ_REVIEWER'], cpe_hours_last_3y 200, no independence conflicts)."
            - "Sable Ord's prior_engagement_team_clients holds exactly two rows: Kite Co with exit_date 2022-07-01 and Marlow Co with exit_date 2022-07-02."
            - "Engagements 'Kite Co' and 'Marlow Co' are both AUDIT with period_end 2024-06-30 and both sit in workflow_state FIELDWORK; the caller holds each engagement's current version."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Rushmere Kell LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Eli Parch", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Sable Ord", cpa_license_state: "CA", designations: ["EQ_REVIEWER"], cpe_hours_last_3y: 200, prior_engagement_team_clients: [{ client_name: "Kite Co", exit_date: "2022-07-01" }, { client_name: "Marlow Co", exit_date: "2022-07-02" }] }
              as: SystemAdmin
              captures: { p_rev_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Kite Co", engagement_type: "AUDIT", period_end: "2024-06-30", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_v: $.data.version }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Marlow Co", engagement_type: "AUDIT", period_end: "2024-06-30", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /engagements/${e2_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e2_v: $.data.version }
          trigger:
            - call: "POST /engagements/${e1_id}/quality-reviews"
              payload: { reviewer_partner_id: "${p_rev_id}", objectivity_attested: true, expected_engagement_version: "${e1_v}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { eqr1_id: $.data.id }
            - call: "POST /engagements/${e2_id}/quality-reviews"
              payload: { reviewer_partner_id: "${p_rev_id}", objectivity_attested: true, expected_engagement_version: "${e2_v}" }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
              captures: { boundary_error: $.data.error_id }
          assert:
            - "the first trigger call returns HTTP 201"
            - "EngagementQualityReview.${eqr1_id}.state == ASSIGNED"
            - "EngagementQualityReview.${eqr1_id}.cooling_off_days_at_assignment == 730"
            - "EngagementQualityReview.${eqr1_id}.objectivity_attested == true"
            - "the second trigger call returns HTTP 409 with error_id ERR_COOLING_OFF_NOT_MET"
            - "GET /quality-reviews?engagement_id=${e2_id} returns exactly 0 rows"
            - "Partner.${p_rev_id}.open_eqr_count == 1"
            - "Engagement.${e2_id}.workflow_state == FIELDWORK"

      - name: acceptance_threshold_7_00_is_inclusive_while_6_99_is_refused
        grounds:
          - calculations.remediation_acceptance_score
          - state_machines.RemediationPlan.SUBMITTED_to_ACCEPTED
          - errors[ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD]
          - entities.RemediationPlan.fields.acceptance_score
          - entities.RemediationPlan.fields.raw_completeness
          - concurrency_rules[remediation-plan-create-stale-finding]
        distinguishing_aspect: |
          A third metric on a third endpoint: the acceptance gate is inclusive at exactly 7.00 to the
          cent. Two sibling plans on the same inspection cycle, both with depth_score 9.00, 4 of 5
          actions complete and no lateness, differ only in action_specificity_score (4.00 versus 3.97):
          the first scores raw_completeness 7.00 and is ACCEPTED, the second scores 6.99 (round_half_up
          of 6.9895) and is refused with ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD while staying SUBMITTED.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z; both plans have target_completion_date 2026-12-31, so late_days is 0 and no penalty applies."
            - "Firm 'Sedgewick Lowe LLP' with engagement partner Eli Parch, QC director Quinn Cade and managing partner Mona Prine."
            - "One AUDIT engagement is REPORT_RELEASED and the 2024 InternalInspection is IN_PROGRESS with that single selection."
            - "Two InspectionFindings on that selection are each classified DEFICIENCY / ISOLATED and each has a VALIDATED FISHBONE RootCauseAnalysis with contributing_factor_count 3, so both depth_scores are 9.00."
            - "Plan A (finding one) has action_count 5 and action_specificity_score 4.00; Plan B (finding two) has action_count 5 and action_specificity_score 3.97. Both are owned by Mona Prine and are in state DRAFTED."
          setup_api_calls:
            - call: "POST /firms"
              payload: { legal_name: "Sedgewick Lowe LLP", state_code: "CA", aa_hours_last_year: 400, peer_review_year_end: "2026-12-31" }
              as: SystemAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Eli Parch", cpa_license_state: "CA", designations: ["ENGAGEMENT_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_ep1_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Quinn Cade", cpa_license_state: "CA", designations: ["QC_DIRECTOR"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_qc_id: $.data.id }
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Mona Prine", cpa_license_state: "CA", designations: ["MANAGING_PARTNER"], cpe_hours_last_3y: 200 }
              as: SystemAdmin
              captures: { p_own_id: $.data.id }
            - call: "POST /engagements"
              payload: { firm_id: "${firm_id}", client_name: "Alder Foods", engagement_type: "AUDIT", period_end: "2024-06-30", engagement_partner_id: "${p_ep1_id}" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${p_ep1_id}"
            - call: "POST /engagements/${e1_id}/workflow-transitions"
              payload: { to_state: "REPORT_RELEASED" }
