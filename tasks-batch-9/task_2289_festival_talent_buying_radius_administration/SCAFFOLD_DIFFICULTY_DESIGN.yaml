# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2289 Festival Talent Buying & Radius
# Administration. 9 rule_ids x 3 instances = 27 instances.
# Every numeric assert below was executed against the §1.3 formulas and their
# constants before being written as a literal.
# Shared fixture arithmetic (Festival "Harbor Lights", talent_budget_cents
# 10000000, contingency_reserve_pct 0.05):
#   allocatable_budget_cents = 10000000 - round_half_up(500000.0) = 9500000
#   HEADLINER 0.50 -> 4750000 | MID_CARD 0.30 -> 2850000 | EMERGING 0.20 -> 1900000
#   remainder 0, so no remainder-assignment ambiguity in the shared fixture;
#   instances that need the waterfall remainder path re-size the budget locally.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: rider_scope_variant_divergence_on_booking
        grounds:
          - calculations.rider_cost_estimate
          - entities.Booking.fields.rider_proposed_cents
          - entities.Booking.fields.rider_estimate_cents
          - entities.RiderItem.fields.line_cost_cents
        distinguishing_aspect: |
          This instance is cost accounting on the Booking entity domain: PROPOSED_SCOPE and
          CONTRACTED_SCOPE read the same six RiderItem rows and return 880243 versus 640243,
          a 240000-cent delta produced by three structurally different exclusions (an
          undecided line, a promoter-provided line zeroed, and a hospitality line capped).
        test_recipe:
          setup:
            - "Festival Harbor Lights with three allocated tiers, one flagship stage, one ELECTRONIC act with draw_score 72."
            - "One accepted booking at guarantee 1800000 whose rider carries six lines: two plain approvals, one substitution, one promoter-provided approval, one still-PROPOSED line and one rejection."
            - "Logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.50, max_slots: 2, genre_focus: "ELECTRONIC" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.30, max_slots: 3, genre_focus: "MIXED" }
              as: TalentBuyer
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.20, max_slots: 4, genre_focus: "MIXED" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_main_id: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a_id: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a_id}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 1800000, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_a_id: $.data.id }
            - call: "POST /festival-ops/offers/${offer_a_id}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_a_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_a_id}"
              captures: { booking_a_id: $.data.id }
            - call: "POST /festival-ops/bookings/${booking_a_id}/rider-items"
              payload: { category: "TECHNICAL", description: "Line array supplement", quantity: 2, unit_cost_cents: 125000, is_promoter_provided: false }
              as: ArtistRep
              as_user_id: "${artist_a_id}"
              captures: { line1_id: $.data.id }
            - call: "POST /festival-ops/bookings/${booking_a_id}/rider-items"
              payload: { category: "HOSPITALITY", description: "Dressing room build-out", quantity: 4, unit_cost_cents: 60000, is_promoter_provided: false }
              as: ArtistRep
              as_user_id: "${artist_a_id}"
              captures: { line2_id: $.data.id }
            - call: "POST /festival-ops/bookings/${booking_a_id}/rider-items"
              payload: { category: "TRAVEL", description: "Crew ground transfers", quantity: 3, unit_cost_cents: 83333, is_promoter_provided: false }
              as: ArtistRep
              as_user_id: "${artist_a_id}"
              captures: { line3_id: $.data.id }
            - call: "POST /festival-ops/bookings/${booking_a_id}/rider-items"
              payload: { category: "TECHNICAL", description: "House console upgrade", quantity: 1, unit_cost_cents: 90000, is_promoter_provided: true }
              as: ArtistRep
              as_user_id: "${artist_a_id}"
              captures: { line4_id: $.data.id }
            - call: "POST /festival-ops/bookings/${booking_a_id}/rider-items"
              payload: { category: "HOSPITALITY", description: "Post-show catering", quantity: 2, unit_cost_cents: 30000, is_promoter_provided: false }
              as: ArtistRep
              as_user_id: "${artist_a_id}"
              captures: { line5_id: $.data.id }
            - call: "POST /festival-ops/bookings/${booking_a_id}/rider-items"
              payload: { category: "TRAVEL", description: "Charter upgrade", quantity: 1, unit_cost_cents: 50000, is_promoter_provided: false }
              as: ArtistRep
              as_user_id: "${artist_a_id}"
              captures: { line6_id: $.data.id }
            - call: "POST /festival-ops/rider-items/${line1_id}/decision"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /festival-ops/rider-items/${line2_id}/decision"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /festival-ops/rider-items/${line3_id}/decision"
              payload: { decision: "SUBSTITUTED", substitute_unit_cost_cents: 71501 }
              as: ProductionManager
            - call: "POST /festival-ops/rider-items/${line4_id}/decision"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /festival-ops/rider-items/${line6_id}/decision"
              payload: { decision: "REJECTED" }
              as: ProductionManager
          trigger:
            - call: "GET /festival-ops/bookings/${booking_a_id}/rider-estimate"
              payload: { variant: "BOTH" }
              as: BusinessAffairs
          assert:
            - "response data.proposed_scope_cents == 880243"
            - "response data.contracted_scope_cents == 640243"
            - "response data.variant_delta_cents == 240000"
            - "response data.capped_line_count == 1"
            - "response data.zeroed_line_count == 1"
            - "RiderItem.${line3_id}.line_cost_cents == 240243"
            - "Booking.${booking_a_id}.rider_proposed_cents == 880243"
            - "Booking.${booking_a_id}.rider_estimate_cents == 640243"
            - "Booking.${booking_a_id}.contract_status == PENDING_RIDER because RiderItem.${line5_id}.approval_status is still PROPOSED"

      - name: artist_risk_variant_divergence_on_roster
        grounds:
          - calculations.artist_radius_risk_score
          - entities.Artist.fields.strict_risk_score
          - entities.Artist.fields.adjudicated_risk_score
          - validations[priority=41]
        distinguishing_aspect: |
          This instance is risk scoring on the Artist entity domain, not cost accounting on a
          Booking: with three unadjudicated CONFLICT reports and one adjudicated VIOLATION the
          STRICT variant returns 65 and reports blocked == true while ADJUDICATED returns 29
          and blocked == false, and only the ADJUDICATED value gates validation priority 41.
        test_recipe:
          setup:
            - "One ELECTRONIC act with draw_score 80 carrying an ACTIVE 150-mile radius clause for 2026-10-05..2027-01-04 out of an issued offer."
            - "Four Portland competing performances inside that clause (distance 145.41 miles), one of them adjudicated VIOLATION and three left REPORTED."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.00, max_slots: 2, genre_focus: "ELECTRONIC" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_main_id: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 80, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a_id: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a_id}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 2000000, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04", exclusivity_scope: "FULL" }
              as: TalentBuyer
              captures: { offer_a_id: $.data.id }
            - call: "POST /festival-ops/offers/${offer_a_id}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/competing-performances"
              payload: { artist_id: "${artist_a_id}", venue_city: "Portland", venue_latitude: 45.5152, venue_longitude: -122.6784, performance_date: "2026-11-20", is_ticketed: true, is_festival: false, announced_capacity: 3000 }
              as: BusinessAffairs
              captures: { perf1_id: $.data.id }
            - call: "POST /festival-ops/competing-performances"
              payload: { artist_id: "${artist_a_id}", venue_city: "Portland", venue_latitude: 45.5152, venue_longitude: -122.6784, performance_date: "2026-11-21", is_ticketed: true, is_festival: false, announced_capacity: 3000 }
              as: BusinessAffairs
              captures: { perf2_id: $.data.id }
            - call: "POST /festival-ops/competing-performances"
              payload: { artist_id: "${artist_a_id}", venue_city: "Portland", venue_latitude: 45.5152, venue_longitude: -122.6784, performance_date: "2026-11-22", is_ticketed: true, is_festival: false, announced_capacity: 3000 }
              as: BusinessAffairs
              captures: { perf3_id: $.data.id }
            - call: "POST /festival-ops/competing-performances"
              payload: { artist_id: "${artist_a_id}", venue_city: "Portland", venue_latitude: 45.5152, venue_longitude: -122.6784, performance_date: "2026-11-23", is_ticketed: true, is_festival: false, announced_capacity: 3000 }
              as: BusinessAffairs
              captures: { perf4_id: $.data.id }
            - call: "POST /festival-ops/competing-performances/${perf1_id}/adjudicate"
              payload: { finding: "VIOLATION", finding_note: "Portland date inside the Seattle radius" }
              as: BusinessAffairs
          trigger:
            - call: "GET /festival-ops/artists/${artist_a_id}/radius-risk"
              payload: { variant: "STRICT" }
              as: TalentBuyer
            - call: "GET /festival-ops/artists/${artist_a_id}/radius-risk"
              payload: { variant: "ADJUDICATED" }
              as: TalentBuyer
          assert:
            - "STRICT response data.risk_score == 65 (12*3 reported + 25*1 breach + draw_penalty 4)"
            - "STRICT response data.blocked == true"
            - "ADJUDICATED response data.risk_score == 29 (25*1 breach + draw_penalty 4)"
            - "ADJUDICATED response data.blocked == false"
            - "both responses data.reported_conflict_count == 3 and data.radius_breach_count == 1"
            - "Artist.${artist_a_id}.strict_risk_score == 65 and Artist.${artist_a_id}.adjudicated_risk_score == 29"
            - "CompetingPerformance.${perf4_id}.conflict_assessment == CONFLICT with distance_to_market_miles == 145.41"

      - name: deposit_recovery_contractual_versus_actual_chronological
        grounds:
          - calculations.deposit_recovery
          - entities.Booking.fields.contractual_recovery_cents
          - entities.Booking.fields.actual_recovered_cents
          - state_machines.PaymentInstallment.CLAWBACK_PENDING_to_RECOVERED
        distinguishing_aspect: |
          A third domain again — cash recovery on the Booking money ledger: CONTRACTUAL
          returns 1080000 (900000 deposit at party_pct 1.00 plus 180000 liquidated damages at
          0.10 of the 1800000 guarantee) while ACTUAL_CHRONOLOGICAL replays only the RECOVERED
          installments and returns 900000, a permanent 180000 gap no clawback can close.
        setup_note: "Placed under dual_variant_calc as a third instance; the pairing that satisfies the different-entity-domain clause is rider_scope_variant_divergence_on_booking (cost) versus artist_risk_variant_divergence_on_roster (risk)."
        test_recipe:
          setup:
            - "One accepted booking at guarantee 1800000, deposit installment 900000 due 2026-08-31, released 2026-08-25 and paid in full."
            - "Clock advanced to 2026-11-20 (14 days before event_start_date 2026-12-04) and the booking cancelled by the ARTIST."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.00, max_slots: 2, genre_focus: "ELECTRONIC" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_main_id: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a_id: $.data.id }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest_id}", artist_id: "${artist_a_id}", budget_tier_id: "${tier_head_id}", stage_id: "${stage_main_id}", guarantee_cents: 1800000, production_fee_cents: 0, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-05T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_a_id: $.data.id }
            - call: "POST /festival-ops/offers/${offer_a_id}/issue"
              payload: {}
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_a_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${artist_a_id}"
              captures: { booking_a_id: $.data.id }
            - call: "GET /festival-ops/bookings/${booking_a_id}/payment-installments"
              payload: { installment_type: "DEPOSIT" }
              as: FinanceController
              captures: { dep_id: "$.data[0].id" }
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T09:00:00Z" }
              as: FinanceController
            - call: "POST /festival-ops/payment-installments/${dep_id}/release"
              payload: {}
              as: FinanceController
            - call: "POST /festival-ops/payment-installments/${dep_id}/mark-paid"
              payload: { paid_amount_cents: 900000 }
              as: FinanceController
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-11-20T12:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/bookings/${booking_a_id}/cancel"
              payload: { cancelling_party: "ARTIST", cancellation_reason: "Artist illness" }
              as: BusinessAffairs
          trigger:
            - call: "POST /festival-ops/payment-installments/${dep_id}/clawback"
              payload: { recovered_cents: 900000 }
              as: FinanceController
          assert:
            - "Booking.${booking_a_id}.contractual_recovery_cents == 1080000"
            - "Booking.${booking_a_id}.actual_recovered_cents == 900000"
            - "the two variants differ by exactly 180000, the liquidated-damages component no installment carried"
            - "PaymentInstallment.${dep_id}.status == RECOVERED with recovered_cents == 900000"
            - "Booking.${booking_a_id}.settlement_status == RECOVERED"
            - "a second clawback of 1 cent on ${dep_id} is rejected with ERR_INVALID_INSTALLMENT_STATE (409) because RECOVERED is terminal"

  - rule_id: combinatorial_formula
    instances:

      - name: guarantee_ceiling_nested_min_max
        grounds:
          - calculations.offer_guarantee_ceiling
          - calculations.genre_balance_share
          - entities.Offer.fields.guarantee_ceiling_cents
          - entities.Offer.fields.genre_balance_factor
          - validations[priority=73]
        distinguishing_aspect: |
          Mode (a): five independent inputs (tier_headroom, festival_headroom, draw_score,
          BASE_FLOOR_CENTS and the genre share) combine through a max() nested inside a floor()
          nested inside a three-way min(), with a three-branch conditional selecting the factor.
          The three triggers make a different input bind each time — BASE_FLOOR_CENTS via the
          inner max (425000), tier_headroom via the outer min (1900000), and the scaled draw
          component as the rejecting bound (2375000) — so any implementation that reorders the
          nesting or picks a different branch produces a different literal on at least one.
        test_recipe:
          setup:
            - "Canonical Harbor Lights fixture: allocatable 9500000 across HEADLINER 4750000 / MID_CARD 2850000 / EMERGING 1900000."
            - "Two ELECTRONIC headliners accepted at 1500000 each, so committed_budget_cents is 3000000 and the ELECTRONIC share is 3000000/9500000 = 0.3158, inside the 0.30..0.40 band that selects factor 0.85."
            - "Three further DRAFT offers on the 2026-12-06 day of the flagship stage: a draw-4 ELECTRONIC act, a draw-95 ROCK act and a draw-95 HIP_HOP act."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest_id: $.data.id, fest_v: $.data.version }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.50, max_slots: 2, genre_focus: "ELECTRONIC" }
              as: TalentBuyer
              captures: { tier_head_id: $.data.id }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.30, max_slots: 3, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_mid_id: $.data.id }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest_id}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.20, max_slots: 4, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_emg_id: $.data.id }
            - call: "POST /festival-ops/festivals/${fest_id}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest_id}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_main_id: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a1: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Glass Harbor Inc", performing_name: "Glass Harbor", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 150 }
              as: TalentBuyer
              captures: { artist_a2: $.data.id }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Tidal Kid LLC", performing_name: "Tidal Kid", primary_genre: "ELECTRONIC", agency: "Foghorn Agency", draw_score: 4, default_radius_miles: 50 }
              as: TalentBuyer
