          setup:
            - "an APPROVED plan with one ADOPTED NEW item on a BETTER option plan for the Metro A cluster (sales_index 11500)"
            - "three DRAFT overlays on that cluster sharing the window 2026-08-05 .. 2026-08-31: CLIMATE 10500, DEMOGRAPHIC 10750 and VOLUME 11000"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
