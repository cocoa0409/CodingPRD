              as: TaproomStaff
          trigger:
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "GROWLER_64OZ", price_cents: 2200, container_sanitized: true, sanitizer_ppm: 90, contact_time_seconds: 90, attested_by_user_id: "u_taproom_1", label_fields: { brand_name: "Ridgeline IPA", abv_statement: "6.8% ALC/VOL", net_contents: "64 FL OZ", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL", fill_date: "2026-08-01" } }
              as: TaproomStaff
              as_user_id: "u_taproom_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_SANITATION_BELOW_STANDARD"
            - "error_id != ERR_SEGREGATION_OF_DUTIES"
            - "error_id != ERR_GROWLER_LABEL_INCOMPLETE"
            - "GET /taproom-pours filtered by this keg returns total_count 0 - the FAIL verdict was not persisted"
            - "KegAsset.${keg_id}.poured_volume_oz == 0.00"
            - "KegAsset.${keg_id}.remaining_volume_oz == 1984.00"
            - "KegAsset.${keg_id}.state == TAPPED (unchanged)"

