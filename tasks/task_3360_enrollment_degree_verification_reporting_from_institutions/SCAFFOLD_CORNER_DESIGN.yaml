        distinguishing_aspect: "A DIRECTORY_BLOCK with effective_to 2026-12-01 blocks DEGREE creation at 2026-11-15 (ERR_PRIVACY_BLOCKED); at exactly 2026-12-01 the directive flips EXPIRED (now >= effective_to) and the identical create succeeds."
