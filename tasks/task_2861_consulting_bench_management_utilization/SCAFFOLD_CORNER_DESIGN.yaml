              as_user_id: "${c1_id}"
              captures: { own_assignments: $.data_count }
          assert:
            - "all four clock calls return 200 — POST /_clock/set_current_utc is shared by every opaque role"
            - "${pg_posture} == \"OPEN\", ${d1_status} == \"QUALIFYING\", ${up_status} == \"OPEN\" and ${sa_prof} == 4: each owning role's write succeeded with its declared side effects"
            - "${own_read_id} == ${c1_id} with ${own_availability} == \"BENCH\", ${own_period_count} == 1 and ${own_assignments} == 0 — the Consultant's own reads all return 200"
            - "the same GET /assignments?consultant_id=${c1_id} returns 200 for SalesLead, ResourceManager, PracticePartner and FinanceController as well — five roles, one shared read"

      - name: same_user_id_cannot_decide_what_it_requested_whatever_role_it_wears
        claim_type: Segregation of duties
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - errors[ERR_APPROVAL_TIER_INSUFFICIENT]
          - roles.FinanceController.shared_operations
          - calculations.discount_tier_and_margin
        distinguishing_aspect: "Segregation of duties is keyed on X-User-ID and NOT on the role header: user u-alice, who requested the discount as SalesLead, is still refused when they come back as FinanceController, while a DIFFERENT FinanceController user decides the very same row successfully — and the independent tier check refuses a different-user PracticePartner on the L2_FINANCE row, proving the two gates are separate."
        test_recipe:
          setup:
            - "A QUALIFIED demand with standard rate 250.00 and requested rate 250.00, no assignments, min_proficiency_level 3."
            - "u-alice requests a 200.00 rate as SalesLead: discount_pct = round(100*(250.00-200.00)/250.00,2) = 20.00 > TIER_L1_MAX_PCT 15.0 so required_tier = L2_FINANCE; the LEVEL_FLOOR variant applies (nothing staffed) with blended_cost 80.00 and projected_margin_pct = round(100*(200.00-80.00)/200.00,2) = 60.00 >= 20.0, so S6 does not escalate and S7 leaves the row PENDING."
          setup_api_calls:
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-17", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 250.00 }
              as: SalesLead
              as_user_id: "u-alice"
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
              as_user_id: "u-alice"
              captures: { d1_v: $.data.version }
            - call: "POST /discount-approvals"
              payload: { demand_opportunity_id: "${d1_id}", requested_rate_usd_per_hour: 200.00, expected_opportunity_version: "${d1_v}" }
              as: SalesLead
              as_user_id: "u-alice"
              captures: { da_id: $.data.id, da_tier: $.data.required_tier, da_status: $.data.status, da_requested_by: $.data.requested_by_user_id, da_margin: $.data.projected_margin_pct }
          trigger:
            - call: "POST /discount-approvals/${da_id}/decide"
              payload: { decision: "APPROVED" }
              as: FinanceController
              as_user_id: "u-alice"
              captures: { err_self: $.data.error_id }
            - call: "POST /discount-approvals/${da_id}/decide"
              payload: { decision: "APPROVED" }
              as: PracticePartner
              as_user_id: "u-bob"
              captures: { err_tier: $.data.error_id }
            - call: "POST /discount-approvals/${da_id}/decide"
              payload: { decision: "APPROVED" }
              as: FinanceController
              as_user_id: "u-carol"
              captures: { da_status2: $.data.status, da_decided_by: $.data.decided_by_user_id }
            - call: "GET /demand-opportunities/${d1_id}"
              as: SalesLead
              as_user_id: "u-alice"
              captures: { d1_approved: $.data.approved_rate_usd_per_hour, d1_effective: $.data.effective_rate_usd_per_hour, d1_booked: $.data.booked_realization_pct }
          assert:
            - "${da_tier} == \"L2_FINANCE\", ${da_status} == \"PENDING\", ${da_requested_by} == \"u-alice\" and ${da_margin} == 60.00"
            - "${err_self} == ERR_SELF_APPROVAL_FORBIDDEN with HTTP 409 — u-alice's role header says FinanceController, which satisfies the tier, so only the user identity can be the reason"
            - "${err_tier} == ERR_APPROVAL_TIER_INSUFFICIENT with HTTP 403 for u-bob: a different user, refused purely on tier, which is how we know priority 19 and priority 20 are two distinct gates"
            - "the third call returns 200 with ${da_status2} == \"APPROVED\" and ${da_decided_by} == \"u-carol\" — same role as the refused u-alice, different id, accepted"
            - "${d1_approved} == 200.00, ${d1_effective} == 200.00 and ${d1_booked} == round(100*200.00/250.00,2) == 80.00 — the cascade ran only on the accepted decision"

  - section: cross-cutting complexity layers
