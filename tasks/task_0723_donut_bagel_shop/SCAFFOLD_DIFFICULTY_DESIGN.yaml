# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Donut & Bagel Shop — 9 rules x >= 2 instances. All asserts are pre-computed
# literals. All setup_api_calls/trigger chains resolve to §1.5 endpoints.
# Default logical clock = 2026-03-01T00:00:00Z (per /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reconcile_expected_forward_vs_actual_chronological
        grounds:
          - calculations.reconcile_day
          - entities.ProductionDay.fields.expected_full_value_cents
          - entities.ProductionDay.fields.gross_sales_cents
          - entities.ProductionDay.fields.reconciliation_variance_cents
          - state_machines.ProductionDay.CUTOFF_to_RECONCILED
        distinguishing_aspect: |
          On ProductionDay, the forward-looking baseline expected_full_value_cents=4500 (baked_qty*unit_price)
          diverges from the chronological actual gross_sales_cents=2970, yielding reconciliation_variance_cents=1035.
        test_recipe:
          setup:
            - "Product GLAZED (unit 150, dozen 1500, bulk_threshold 24, bulk 110, cost 45)."
            - "ProductionDay D1 with one GLAZED batch par 30 / baked 30; day in SELLING."
            - "Retail order A: 20 GLAZED full-price PAID (2700); batch marked down; order B: 3 GLAZED marked_down PAID (270); batch swept (wasted 7); day moved to CUTOFF."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-02", delivery_cutoff_utc: "2026-03-02T20:00:00Z" }
              as: ShopAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /production-days/${d1_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 30 }
              as: BakeManager
              captures: { b1_id: $.data.id }
            - call: "POST /production-days/${d1_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d1_id}/bake-batches/${b1_id}/bake"
              payload: { baked_qty: 30 }
              as: BakeManager
            - call: "POST /production-days/${d1_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d1_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 20, marked_down: false } ] }
              as: Cashier
              captures: { oa_id: $.data.id }
            - call: "POST /production-days/${d1_id}/retail-orders/${oa_id}/pay"
              payload: {}
              as: Cashier
            - call: "POST /production-days/${d1_id}/bake-batches/${b1_id}/markdown"
              payload: {}
              as: Cashier
            - call: "POST /production-days/${d1_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 3, marked_down: true } ] }
              as: Cashier
              captures: { ob_id: $.data.id }
            - call: "POST /production-days/${d1_id}/retail-orders/${ob_id}/pay"
              payload: {}
              as: Cashier
            - call: "POST /production-days/${d1_id}/bake-batches/${b1_id}/sweep"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d1_id}/close-cutoff"
              payload: {}
              as: ShopAdmin
            - call: "GET /production-days/${d1_id}"
              payload: {}
              as: BakeManager
              captures: { d1_ver: $.data.version }
          trigger:
            - call: "POST /production-days/${d1_id}/reconcile"
              payload: { expected_production_day_version: "${d1_ver}" }
              as: BakeManager
          assert:
            - "ProductionDay.${d1_id}.status == RECONCILED"
            - "ProductionDay.${d1_id}.expected_full_value_cents == 4500"
            - "ProductionDay.${d1_id}.gross_sales_cents == 2970"
            - "ProductionDay.${d1_id}.markdown_loss_cents == 180"
            - "ProductionDay.${d1_id}.waste_cost_cents == 315"
            - "ProductionDay.${d1_id}.reconciliation_variance_cents == 1035"

      - name: wholesale_amount_sum_then_round_vs_per_line_round
        grounds:
          - calculations.wholesale_delivery_amount
          - entities.WholesaleDelivery.fields.amount_cents
          - state_machines.WholesaleDelivery.SCHEDULED_to_PICKED
        distinguishing_aspect: |
          On WholesaleDelivery, sum-then-round amount_cents=242 for lines GLAZED qty1(150)+EVERYTHING qty1(135) at
          discount 0.15 differs from the per-line-then-round result (128+115=243); the scaffold pins sum-then-round=242.
        test_recipe:
          setup:
            - "Products GLAZED (unit 150) and EVERYTHING (unit 135). WholesaleAccount discount 0.15."
            - "StandingOrder with lines GLAZED qty 1 + EVERYTHING qty 1. ProductionDay OPEN with future cutoff."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "EVERYTHING", name: "Everything Bagel", category: "BAGEL", unit_price_cents: 135, dozen_price_cents: 1350, bulk_threshold: 24, bulk_unit_price_cents: 100, unit_cost_cents: 42 }
              as: ShopAdmin
              captures: { every_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Cafe Bleu", discount_pct: 0.15, credit_limit_cents: 100000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", delivery_dow: 0, line_items: [ { product_id: "${glazed_id}", qty: 1 }, { product_id: "${every_id}", qty: 1 } ] }
              as: ShopAdmin
              captures: { so_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-03", delivery_cutoff_utc: "2026-03-03T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /production-days/${d_id}/wholesale-deliveries"
              payload: { standing_order_id: "${so_id}", route_window_start: "2026-03-03T08:00:00Z", route_window_end: "2026-03-03T09:00:00Z" }
              as: ShopAdmin
              captures: { del_id: $.data.id }
          assert:
            - "WholesaleDelivery.${del_id}.amount_cents == 242"
            - "WholesaleDelivery.${del_id}.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: line_price_tiered_bulk_vs_dozen_selection
        grounds:
          - calculations.line_price
          - entities.Product.fields.bulk_threshold
          - entities.Product.fields.dozen_price_cents
          - entities.RetailOrder.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (a): line_price selects among 3 inputs (qty, dozen tier, bulk tier) non-linearly — qty 13 GLAZED
          uses dozen+remainder (1650) while qty 24 flips the whole line to the flat bulk rate (2640), not 3000.
        test_recipe:
          setup:
            - "Product GLAZED (unit 150, dozen 1500, bulk_threshold 24, bulk 110)."
            - "ProductionDay SELLING with one GLAZED batch baked 40."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-04", delivery_cutoff_utc: "2026-03-04T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 40 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 40 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
          trigger:
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 13, marked_down: false } ] }
              as: Cashier
              captures: { o13_id: $.data.id }
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 24, marked_down: false } ] }
              as: Cashier
              captures: { o24_id: $.data.id }
          assert:
            - "RetailOrder.${o13_id}.subtotal_cents == 1650"
            - "RetailOrder.${o24_id}.subtotal_cents == 2640"

      - name: wholesale_amount_nested_rounding_order_pinned
        grounds:
          - calculations.wholesale_delivery_amount
          - entities.WholesaleDelivery.fields.amount_cents
          - entities.WholesaleAccount.fields.discount_pct
        distinguishing_aspect: |
          Mode (b): nested-rounding order is pinned to sum-then-round — discount applied to the summed raw 285
          then rounded once = 242, which differs from round-per-line-then-sum = 243.
        test_recipe:
          setup:
            - "Products GLAZED (unit 150) + EVERYTHING (unit 135); WholesaleAccount discount 0.15."
            - "StandingOrder lines GLAZED qty 1 + EVERYTHING qty 1; ProductionDay OPEN with future cutoff."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "EVERYTHING", name: "Everything Bagel", category: "BAGEL", unit_price_cents: 135, dozen_price_cents: 1350, bulk_threshold: 24, bulk_unit_price_cents: 100, unit_cost_cents: 42 }
              as: ShopAdmin
              captures: { every_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Cafe Bleu", discount_pct: 0.15, credit_limit_cents: 100000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", delivery_dow: 0, line_items: [ { product_id: "${glazed_id}", qty: 1 }, { product_id: "${every_id}", qty: 1 } ] }
              as: ShopAdmin
              captures: { so_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-05", delivery_cutoff_utc: "2026-03-05T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /production-days/${d_id}/wholesale-deliveries"
              payload: { standing_order_id: "${so_id}", route_window_start: "2026-03-05T08:00:00Z", route_window_end: "2026-03-05T09:00:00Z" }
              as: ShopAdmin
              captures: { del_id: $.data.id }
          assert:
            - "WholesaleDelivery.${del_id}.amount_cents == 242"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: retail_order_branching_paid_to_void_or_refund
        grounds:
          - state_machines.RetailOrder.PAID_to_VOIDED
          - state_machines.RetailOrder.PAID_to_REFUNDED
          - entities.RetailOrder.fields.status
        distinguishing_aspect: |
          RetailOrder branches from PAID into two distinct terminal states (VOIDED via Cashier, REFUNDED via ShopAdmin)
          with divergent actors but the same compensation set; a PAID order reaches exactly one branch.
        test_recipe:
          setup:
            - "Two PAID retail orders on a SELLING day, each 12 GLAZED (subtotal 1500)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-06", delivery_cutoff_utc: "2026-03-06T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 48 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 48 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 12, marked_down: false } ] }
              as: Cashier
              captures: { ov_id: $.data.id }
            - call: "POST /production-days/${d_id}/retail-orders/${ov_id}/pay"
              payload: {}
              as: Cashier
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 12, marked_down: false } ] }
              as: Cashier
              captures: { or_id: $.data.id }
            - call: "POST /production-days/${d_id}/retail-orders/${or_id}/pay"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /production-days/${d_id}/retail-orders/${ov_id}/void"
              payload: {}
              as: Cashier
            - call: "POST /production-days/${d_id}/retail-orders/${or_id}/refund"
              payload: {}
              as: ShopAdmin
          assert:
            - "RetailOrder.${ov_id}.status == VOIDED"
            - "RetailOrder.${or_id}.status == REFUNDED"
            - "BakeBatch.${b_id}.remaining_qty == 48"

      - name: standing_order_cyclic_active_pause_active
        grounds:
          - state_machines.StandingOrder.ACTIVE_to_PAUSED
          - state_machines.StandingOrder.PAUSED_to_ACTIVE
          - entities.StandingOrder.fields.status
        distinguishing_aspect: |
          StandingOrder cycles ACTIVE -> PAUSED -> ACTIVE on the same row, returning to a non-terminal prior state;
          this is a different entity than the RetailOrder branching instance.
        test_recipe:
          setup:
            - "WholesaleAccount with an ACTIVE StandingOrder."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Cafe Bleu", discount_pct: 0.15, credit_limit_cents: 100000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", delivery_dow: 2, line_items: [ { product_id: "${glazed_id}", qty: 12 } ] }
              as: ShopAdmin
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /standing-orders/${so_id}/pause"
              payload: {}
              as: ShopAdmin
              captures: { paused_status: $.data.status }
            - call: "POST /standing-orders/${so_id}/resume"
              payload: {}
              as: ShopAdmin
          assert:
            - "StandingOrder.${so_id}.status after pause == PAUSED"
            - "StandingOrder.${so_id}.status after resume == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: retail_pay_punch_then_reward_conversion_depth3
        grounds:
          - state_machines.RetailOrder.CART_to_PAID
          - calculations.loyalty_punch
          - entities.LoyaltyAccount.fields.punch_count
          - entities.LoyaltyAccount.fields.reward_balance_cents
        distinguishing_aspect: |
          Depth-3 chain: paying order2 (A) increments LoyaltyAccount.punch_count from 9 to 10 (B), and that
          increment itself crosses PUNCHES_PER_REWARD, triggering conversion to reward_balance_cents += 1200 with
          punch_count reset to 0 (C). Each link is caused by the previous, not by the pay action directly.
        test_recipe:
          setup:
            - "LoyaltyAccount whose punch_count has been driven to 9 by a prior PAID order of 108 GLAZED (9 dozens)."
            - "Day SELLING with a GLAZED batch baked 120."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { phone: "555-0001", name: "Reg Ular" }
              as: Cashier
              captures: { loy_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-07", delivery_cutoff_utc: "2026-03-07T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/bake-batches"
              payload: { product_id: "${glazed_id}", par_qty: 120 }
              as: BakeManager
              captures: { b_id: $.data.id }
            - call: "POST /production-days/${d_id}/start-baking"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/bake-batches/${b_id}/bake"
              payload: { baked_qty: 120 }
              as: BakeManager
            - call: "POST /production-days/${d_id}/open-sales"
              payload: {}
              as: BakeManager
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 108, marked_down: false } ], loyalty_account_id: "${loy_id}" }
              as: Cashier
              captures: { o1_id: $.data.id }
            - call: "POST /production-days/${d_id}/retail-orders/${o1_id}/pay"
              payload: {}
              as: Cashier
            - call: "POST /production-days/${d_id}/retail-orders"
              payload: { line_items: [ { product_id: "${glazed_id}", qty: 12, marked_down: false } ], loyalty_account_id: "${loy_id}" }
              as: Cashier
              captures: { o2_id: $.data.id }
          trigger:
            - call: "POST /production-days/${d_id}/retail-orders/${o2_id}/pay"
              payload: {}
              as: Cashier
          assert:
            - "LoyaltyAccount.${loy_id}.punch_count == 0"
            - "LoyaltyAccount.${loy_id}.reward_balance_cents == 1200"

      - name: delivery_invoice_bumps_account_outstanding_depth2
        grounds:
          - state_machines.WholesaleDelivery.DELIVERED_to_INVOICED
          - calculations.wholesale_outstanding_balance
          - entities.WholesaleAccount.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (invoice): delivery DELIVERED->INVOICED (A) causes
          WholesaleAccount.outstanding_balance_cents to rise by amount_cents 3264 (B). Distinct from the loyalty
          cascade's CART_to_PAID origin.
        test_recipe:
          setup:
            - "WholesaleAccount discount 0.15, credit_limit 100000; StandingOrder GLAZED qty24 + SESAME qty12 (amount 3264)."
            - "Delivery scheduled on a day, picked and delivered."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SESAME", name: "Sesame Bagel", category: "BAGEL", unit_price_cents: 120, dozen_price_cents: 1200, bulk_threshold: 24, bulk_unit_price_cents: 95, unit_cost_cents: 40 }
              as: ShopAdmin
              captures: { sesame_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Cafe Bleu", discount_pct: 0.15, credit_limit_cents: 100000 }
              as: ShopAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${acct_id}", delivery_dow: 3, line_items: [ { product_id: "${glazed_id}", qty: 24 }, { product_id: "${sesame_id}", qty: 12 } ] }
              as: ShopAdmin
              captures: { so_id: $.data.id }
            - call: "POST /production-days"
              payload: { business_date: "2026-03-08", delivery_cutoff_utc: "2026-03-08T20:00:00Z" }
              as: ShopAdmin
              captures: { d_id: $.data.id }
            - call: "POST /production-days/${d_id}/wholesale-deliveries"
              payload: { standing_order_id: "${so_id}", route_window_start: "2026-03-08T08:00:00Z", route_window_end: "2026-03-08T09:00:00Z" }
              as: ShopAdmin
              captures: { del_id: $.data.id }
            - call: "POST /production-days/${d_id}/wholesale-deliveries/${del_id}/pick"
              payload: {}
              as: RouteDriver
            - call: "POST /production-days/${d_id}/wholesale-deliveries/${del_id}/deliver"
              payload: {}
              as: RouteDriver
          trigger:
            - call: "POST /production-days/${d_id}/wholesale-deliveries/${del_id}/invoice"
              payload: {}
              as: ShopAdmin
          assert:
            - "WholesaleDelivery.${del_id}.status == INVOICED"
            - "WholesaleAccount.${acct_id}.outstanding_balance_cents == 3264"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invoice_state_vs_credit_state_wins
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - state_machines.WholesaleDelivery.DELIVERED_to_INVOICED
        distinguishing_aspect: |
          Pair (state p6 vs business_fiscal p12): a delivery still SCHEDULED (not DELIVERED) whose amount would also
          breach credit returns ERR_DELIVERY_INVALID_STATE, not ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "WholesaleAccount credit_limit 100 (tiny); StandingOrder amount 3264; delivery left SCHEDULED (never picked/delivered)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GLAZED", name: "Glazed Donut", category: "DONUT", unit_price_cents: 150, dozen_price_cents: 1500, bulk_threshold: 24, bulk_unit_price_cents: 110, unit_cost_cents: 45 }
              as: ShopAdmin
              captures: { glazed_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SESAME", name: "Sesame Bagel", category: "BAGEL", unit_price_cents: 120, dozen_price_cents: 1200, bulk_threshold: 24, bulk_unit_price_cents: 95, unit_cost_cents: 40 }
              as: ShopAdmin
              captures: { sesame_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "Cafe Bleu", discount_pct: 0.15, credit_limit_cents: 100 }
              as: ShopAdmin
