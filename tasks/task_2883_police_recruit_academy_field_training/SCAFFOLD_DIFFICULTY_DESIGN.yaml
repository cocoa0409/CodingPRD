          - state_machines.FieldTrainingRotation.ACTIVE_to_REMEDIAL
          - endpoints[GET /academy-classes/{classId}/attrition-analysis]
        distinguishing_aspect: |
          Different entity domain from the hours variant and a different divergence
          mechanism: both variants read the same four non-voided ObservationReport rows,
          but TERMINAL_WEIGHTED buckets the last 3 at 0.60 against the earlier 1 at 0.40
