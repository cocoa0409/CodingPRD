scenario: "2229. Youth Orchestra Audition & Seating (youth symphony organization): audition scheduling with repertoire requirements, excerpt lists and blind panel evaluation, ensemble placement across skill-tiered orchestras with instrumentation balance constraints, seating assignment within sections including principal chair designation and rotation policy, tuition assessment with financial aid and instrument loan programs, rehearsal attendance policy with excused absence procedures and performance eligibility, concert programming with soloist selection and guest artist coordination, tour and festival participation with fundraising and chaperone requirements, member retention, graduation and alumni engagement"
domain_name: "youth-orchestra-audition-seating"
# Flat topology: every business collection is a top-level path (/seasons, /members,
# /auditions, /placements, /seat-assignments, /tuition-accounts, /ensemble-events,
# /event-participations, ...). There is no single owning resource path, so the
# prefix is empty and sub-resources hang off their parent collection directly.
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # All 13 entities are peer top-level collections linked by explicit foreign keys;
  # no entity is addressed through a nested ownership chain in its own URL.

  state_machine_shape: parallel
  # Member (enrollment_status x standing_status), TuitionAccount (billing_status x
  # aid_status) and EventParticipation (attendance_status x performance_eligibility x
  # tour_status) each carry independent state dimensions on one row; Audition
  # (SCORED -> REVISION_REQUESTED -> SCHEDULED), TuitionAccount aid dimension
  # (RESCINDED -> REQUESTED) and EnsembleEvent (PROGRAMMED -> SOLOIST_VACANT ->
  # PROGRAMMED) additionally close cycles; Placement forks at creation into
  # OFFERED vs WAITLISTED with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Season -> Ensemble -> SectionQuota; EnsembleEvent -> EventParticipation
    - many_to_many         # PanelScore is the Panelist x Audition junction; EventParticipation is the Member x EnsembleEvent junction
    - self_referential     # SeatAssignment.predecessor_assignment_id -> SeatAssignment.id (chair rotation chain)
    - cross_aggregate      # TuitionAccount.season_id and Placement.ensemble_id cross the audition aggregate boundary

  role_model: segregation_of_duties
  # The FinanceOfficer who reviewed an aid request (aid_reviewed_by_user_id) may not
  # be the officer who executes the award run that funds it; Panelists submit blind
  # rubric scores but may never adjudicate; the ArtisticDirector adjudicates and
  # offers placements but may never record attendance or move money.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human label for the season, e.g. "2026-2027 Season".
        constraints: 1..120 chars
      - name: year_label
        type: string
        source: input
        description: Fiscal/artistic year label used on invoices, e.g. "2026-27".
      - name: status
        type: enum
        source: system
        description: Season lifecycle stage gating audition, placement and season operations.
        default: PLANNING
        constraints: "PLANNING | AUDITIONS_OPEN | PLACEMENT | IN_SEASON | CLOSED"
      - name: audition_window_start
        type: datetime
        source: input
        description: Inclusive earliest instant an AuditionSlot may start.
      - name: audition_window_end
        type: datetime
        source: input
        description: Exclusive latest instant an AuditionSlot may end.
      - name: tuition_base_cents
        type: integer
        source: input
        description: Season base tuition in whole cents before tier multiplier.
        constraints: ">= 1"
      - name: tuition_due_at
        type: datetime
        source: input
        description: Instant after which a TuitionAccount with balance_cents > 0 becomes DELINQUENT.
      - name: aid_budget_cents
        type: integer
        source: input
        description: Total financial-aid pool for the season in whole cents.
        constraints: ">= 0"
      - name: aid_committed_cents
        type: integer
        source: computed
        description: Sum of TuitionAccount.aid_awarded_cents over accounts of this season whose aid_status == APPROVED.
        default: 0
      - name: aid_available_cents
        type: integer
        source: computed
        description: aid_budget_cents - aid_committed_cents; the conserved-quantity companion field.
        default: 0
      - name: ensemble_count
        type: integer
        source: computed
        description: Count of Ensemble rows with season_id == this season.
        default: 0
      - name: seated_ensemble_count
        type: integer
        source: computed
        description: Count of Ensemble rows of this season whose roster_state == SEATED.
        default: 0

  - name: Ensemble
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season this skill-tiered orchestra belongs to.
      - name: name
        type: string
        source: input
        description: Orchestra name, e.g. "Youth Symphony".
      - name: tier
        type: enum
        source: input
        description: Skill tier; also selects the tuition multiplier and the audition score band.
        constraints: "SYMPHONY | PHILHARMONIC | CONCERT_ORCHESTRA"
      - name: min_total_size
        type: integer
        source: input
        description: Minimum seated players required before roster_state may become SEATED.
        constraints: ">= 1"
      - name: max_total_size
        type: integer
        source: input
        description: Hard cap on seated players across all section quotas.
        constraints: ">= min_total_size"
      - name: rehearsal_weekday
        type: enum
        source: input
        description: Weekly rehearsal day for this ensemble.
        constraints: "MON | TUE | WED | THU | FRI | SAT | SUN"
      - name: roster_state
        type: enum
        source: system
        description: Derived roster posture; FORMING until every SectionQuota is FULL, then SEATED, then CLOSED when the season closes.
        default: FORMING
        constraints: "FORMING | SEATED | CLOSED"
      - name: seated_count
        type: integer
        source: computed
        description: Sum of SectionQuota.filled_count over this ensemble's quotas.
        default: 0
      - name: offered_count
        type: integer
        source: computed
        description: Count of Placement rows for this ensemble whose status == OFFERED.
        default: 0

  - name: SectionQuota
    parent: null
    common_fields: true
    fields:
      - name: ensemble_id
        type: string
        source: input
        description: FK -> Ensemble.id; the orchestra whose instrumentation this row balances.
      - name: instrument
        type: enum
        source: input
        description: Instrument this section seats; unique per (ensemble_id, instrument).
        constraints: "VIOLIN | VIOLA | CELLO | BASS | FLUTE | OBOE | CLARINET | BASSOON | HORN | TRUMPET | TROMBONE | PERCUSSION"
      - name: min_count
        type: integer
        source: input
        description: Instrumentation-balance floor; below this the section is UNDERFILLED.
        constraints: ">= 0"
      - name: target_count
        type: integer
        source: input
        description: Balanced instrumentation target; reaching it flips balance_state to FULL.
        constraints: ">= min_count and >= 1"
      - name: max_count
        type: integer
        source: input
        description: Hard seat cap for the section.
        constraints: ">= target_count"
      - name: principal_required
        type: boolean
        source: input
        description: Whether chair 1 of this section carries the principal designation.
        default: true
      - name: rotation_policy
        type: enum
        source: input
        description: ROTATING sections may run chair rotation; FIXED sections reject rotation runs.
        default: ROTATING
        constraints: "ROTATING | FIXED"
      - name: filled_count
        type: integer
        source: computed
        description: Count of SeatAssignment rows for this quota whose status == ACTIVE.
        default: 0
      - name: balance_state
        type: enum
        source: system
        description: UNDERFILLED while filled_count < min_count, BALANCED while min_count <= filled_count < target_count, FULL at filled_count >= target_count.
        default: UNDERFILLED
        constraints: "UNDERFILLED | BALANCED | FULL"
      - name: rotation_cycle_index
        type: integer
        source: system
        description: Number of completed chair-rotation runs on this section.
        default: 0

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Musician's legal name.
      - name: primary_instrument
        type: enum
        source: input
        description: Instrument the musician auditions and is seated on; must match the SectionQuota instrument.
        constraints: "same enum as SectionQuota.instrument"
      - name: instrument_class
        type: enum
        source: computed
        description: STRING for VIOLIN/VIOLA/CELLO/BASS, PERCUSSION for PERCUSSION, WIND for all others; selects the instrument-loan fee.
        constraints: "STRING | WIND | PERCUSSION"
      - name: grade_level
        type: integer
        source: input
        description: School grade level.
        constraints: "4..12"
      - name: graduation_year
        type: integer
        source: input
        description: Expected high-school graduation year; drives graduation and alumni engagement.
        constraints: ">= 2026"
      - name: years_in_org
        type: integer
        source: input
        description: Completed prior seasons in the organization; feeds the aid need score, the loyalty credit and the chair tie-break.
        default: 0
        constraints: "0..12"
      - name: household_income_band
        type: enum
        source: input
        description: Declared income band selecting the aid cap percentage and need-score points.
        constraints: "BAND_A | BAND_B | BAND_C"
      - name: sibling_enrolled
        type: boolean
        source: input
        description: Whether a sibling is enrolled; grants the sibling discount and 8 need-score points.
        default: false
      - name: alumni_engagement_opt_in
        type: boolean
        source: input
        description: Whether the musician consents to alumni outreach after graduation.
        default: false
      - name: enrollment_status
        type: enum
        source: system
        description: First independent state dimension - membership lifecycle.
        default: PROSPECT
        constraints: "PROSPECT | ENROLLED | GRADUATED | WITHDRAWN | ALUMNI"
      - name: standing_status
        type: enum
        source: system
        description: Second independent state dimension - good standing; precedence when both causes hold is FINANCIAL_HOLD > ATTENDANCE_PROBATION > CLEAR.
        default: CLEAR
        constraints: "CLEAR | ATTENDANCE_PROBATION | FINANCIAL_HOLD"
      - name: unexcused_absence_count
        type: integer
        source: computed
        description: Count of EventParticipation rows for this member with attendance_status == UNEXCUSED_ABSENT.
        default: 0
      - name: tardy_count
        type: integer
        source: computed
        description: Count of EventParticipation rows for this member with attendance_status == TARDY.
        default: 0
      - name: effective_unexcused_count
        type: integer
        source: computed
        description: unexcused_absence_count + floor(tardy_count / 3); the probation trigger metric.
        default: 0
      - name: probation_baseline_count
        type: integer
        source: system
        description: Value of effective_unexcused_count at the moment standing_status was last cleared from ATTENDANCE_PROBATION; probation re-fires only when effective_unexcused_count - probation_baseline_count >= 3.
        default: 0

  - name: Panelist
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Adjudicator name shown on panel rosters.
      - name: instrument_expertise
        type: enum
        source: input
        description: Instrument family the adjudicator is qualified to score.
        constraints: "same enum as SectionQuota.instrument"
      - name: panel_role
        type: enum
        source: input
        description: ADJUDICATOR scores blind; CHAIR scores blind and may sign the panel sheet.
        default: ADJUDICATOR
        constraints: "ADJUDICATOR | CHAIR"
      - name: conflict_member_ids
        type: array
        source: input
        description: Array of Member.id values the adjudicator privately teaches; scoring any of them is a blind-panel integrity violation.
        default: []
      - name: available_for_panels
        type: boolean
        source: input
        description: Whether the adjudicator may be listed on new AuditionSlot panels.
        default: true

  - name: AuditionSlot
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season whose audition window bounds this slot.
      - name: room_code
        type: string
        source: input
        description: Physical audition room; the resource whose occupancy is buffered.
        constraints: 1..16 chars
      - name: start_at
        type: datetime
        source: input
        description: Slot start instant (inclusive).
      - name: end_at
        type: datetime
        source: input
        description: Slot end instant (exclusive); must be > start_at.
      - name: panelist_ids
        type: array
        source: input
        description: Array of Panelist.id values seated on this blind panel; only these may submit scores for auditions in this slot.
        constraints: "2..5 distinct ids, each with available_for_panels == true"
      - name: instrument_focus
        type: enum
        source: input
        description: Instrument this slot auditions; must equal the member's primary_instrument.
        constraints: "same enum as SectionQuota.instrument"
      - name: required_excerpt_codes
        type: array
        source: input
        description: Array of excerpt code strings every audition scheduled into this slot must have declared.
        default: []
      - name: quorum_required
        type: integer
        source: input
        description: Number of submitted PanelScore rows that flips the audition to SCORED.
        default: 3
        constraints: "2..5 and <= len(panelist_ids)"
      - name: capacity
        type: integer
        source: input
        description: Maximum auditions schedulable into this slot.
        default: 1
        constraints: "1..8"
      - name: booked_count
        type: integer
        source: computed
        description: Count of Audition rows whose slot_id == this slot and status IN {SCHEDULED, SCORED, REVISION_REQUESTED, ADJUDICATED}.
        default: 0
      - name: status
        type: enum
        source: system
        description: OPEN while booked_count < capacity, FULL at booked_count >= capacity.
        default: OPEN
        constraints: "OPEN | FULL"

  - name: Audition
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the auditioning musician.
      - name: season_id
        type: string
        source: input
        description: FK -> Season.id; the season being auditioned for.
      - name: slot_id
        type: string
        source: system
        description: FK -> AuditionSlot.id; null until scheduled, re-pointed on each revision round.
        default: null
      - name: declared_program
        type: string
        source: input
        description: Solo repertoire the musician declares.
        constraints: 1..200 chars
      - name: excerpt_ids
        type: array
        source: input
        description: Array of excerpt code strings the musician prepared; must cover the slot's required_excerpt_codes.
        constraints: "1..6 distinct codes"
      - name: scale_attested
        type: boolean
        source: input
        description: Whether the required scale set was attested at registration.
        default: false
      - name: blind_code
        type: string
        source: system
        description: Opaque panel-facing label (e.g. "CELLO-014") shown instead of the member's name.
      - name: status
        type: enum
        source: system
        description: Audition lifecycle; SCORED may cycle back to SCHEDULED through REVISION_REQUESTED.
        default: REQUESTED
        constraints: "REQUESTED | SCHEDULED | SCORED | REVISION_REQUESTED | ADJUDICATED"
      - name: revision_round
        type: integer
        source: system
        description: Completed re-audition rounds; capped by MAX_REVISION_ROUNDS.
        default: 0
      - name: submitted_score_count
        type: integer
        source: computed
        description: Count of PanelScore rows for this audition in the current revision_round.
        default: 0
      - name: composite_provisional_score
        type: number
        source: computed
        description: Blind provisional composite (plain mean of panelist weighted totals), 2 decimals; null before quorum.
        default: null
      - name: composite_final_score
        type: number
        source: computed
        description: Adjudicated final composite (trimmed mean when 4+ scores), 2 decimals; null before adjudication.
        default: null
      - name: tier_recommendation
        type: enum
        source: computed
        description: Tier band derived from composite_final_score; null before adjudication.
        default: null
        constraints: "SYMPHONY | PHILHARMONIC | CONCERT_ORCHESTRA | NOT_PLACED"

  - name: PanelScore
    parent: null
    common_fields: false
    fields:
      - name: audition_id
        type: string
        source: input
        description: FK -> Audition.id; the blind audition scored.
      - name: panelist_id
        type: string
        source: input
        description: FK -> Panelist.id; the adjudicator submitting this sheet.
      - name: revision_round
        type: integer
        source: system
        description: Snapshot of Audition.revision_round at submission; scores from earlier rounds are excluded from composites.
        default: 0
      - name: tone_score
        type: integer
        source: input
        description: Tone rubric score.
        constraints: "0..25"
      - name: rhythm_score
        type: integer
        source: input
        description: Rhythm rubric score.
        constraints: "0..25"
      - name: intonation_score
        type: integer
        source: input
        description: Intonation rubric score.
        constraints: "0..25"
      - name: sight_reading_score
        type: integer
        source: input
        description: Sight-reading rubric score.
        constraints: "0..25"
      - name: weighted_total
        type: number
        source: computed
        description: Per-criterion weighted total on a 0..100 basis, 2 decimals; see calculations.panelist_weighted_total.
      - name: blind
        type: boolean
        source: system
        description: Always true - the adjudicator saw Audition.blind_code, never Member.legal_name.
        default: true

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: audition_id
        type: string
        source: input
        description: FK -> Audition.id; the adjudicated audition this offer is based on.
      - name: member_id
        type: string
        source: system
        description: FK -> Member.id; copied from the audition at creation.
      - name: ensemble_id
        type: string
        source: input
        description: FK -> Ensemble.id; the orchestra being offered.
      - name: offer_kind
        type: enum
        source: input
        description: OFFER creates the row in OFFERED, WAITLIST creates it in WAITLISTED - the creation fork.
        constraints: "OFFER | WAITLIST"
      - name: status
        type: enum
        source: system
        description: Placement lifecycle; ACCEPTED seats the player, RELEASED marks a vacated seat.
        constraints: "OFFERED | WAITLISTED | ACCEPTED | DECLINED | EXPIRED | WITHDRAWN | RELEASED"
      - name: waitlist_rank
        type: integer
        source: computed
        description: 1-based promotion order among WAITLISTED rows of the same (ensemble_id, instrument); null for OFFER rows.
        default: null
      - name: offer_expires_at
        type: datetime
        source: input
        description: Instant at or after which the offer-expiry sweep expires an OFFERED row; required when offer_kind == OFFER.
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant the offer was accepted; null otherwise.
        default: null
      - name: instrument_loan_requested
        type: boolean
        source: system
        description: Whether the family requested an organization instrument at acceptance.
        default: false
      - name: instrument_class_loaned
        type: enum
        source: system
        description: Instrument class of the loaned instrument; null when no loan was requested.
        default: null
        constraints: "STRING | WIND | PERCUSSION"

  - name: SeatAssignment
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: system
        description: FK -> Placement.id; the accepted placement that created this seat.
      - name: section_quota_id
        type: string
        source: system
        description: FK -> SectionQuota.id; the section this chair belongs to.
      - name: member_id
        type: string
        source: system
        description: FK -> Member.id; denormalized seat holder.
      - name: predecessor_assignment_id
        type: string
        source: system
        description: FK -> SeatAssignment.id; the ROTATED_OUT row this row replaced, null for the first row of a rotation chain.
        default: null
      - name: chair_number
        type: integer
        source: computed
        description: 1-based chair within the section; the set of chair_number values over ACTIVE rows of a section is always exactly {1..filled_count}.
      - name: is_principal
        type: boolean
        source: computed
        description: True when chair_number == 1 and the section's principal_required is true.
        default: false
      - name: ranking_score
        type: number
        source: computed
        description: Snapshot of the placement's Audition.composite_final_score used as the chair sort key.
      - name: rotation_cycle_index
        type: integer
        source: system
        description: Rotation generation this row belongs to; equals the section's rotation_cycle_index when created.
        default: 0
      - name: status
        type: enum
        source: system
        description: ACTIVE seats count toward filled_count; ROTATED_OUT is superseded by a successor row; VACATED is released.
        default: ACTIVE
        constraints: "ACTIVE | ROTATED_OUT | VACATED"

  - name: TuitionAccount
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: FK -> Member.id; the billed musician.
      - name: season_id
        type: string
        source: system
        description: FK -> Season.id; the billed season; unique per (member_id, season_id).
      - name: ensemble_tier
        type: enum
        source: system
        description: Snapshot of the offered ensemble's tier, selecting the tuition multiplier.
        constraints: "SYMPHONY | PHILHARMONIC | CONCERT_ORCHESTRA"
      - name: assessment_variant
        type: enum
        source: system
        description: Which tuition variant produced the current assessed_cents.
        default: PRELIMINARY
        constraints: "PRELIMINARY | FINAL"
      - name: assessed_cents
        type: integer
        source: computed
        description: Tier-adjusted tuition after component discounts; see calculations.tuition_assessment.
        default: 0
      - name: sibling_discount_cents
        type: integer
        source: computed
        description: Rounded sibling-discount component, 0 under the PRELIMINARY variant.
        default: 0
      - name: loyalty_credit_cents
        type: integer
        source: computed
        description: Rounded multi-year loyalty component, 0 under the PRELIMINARY variant.
        default: 0
      - name: aid_requested_cents
        type: integer
        source: input
        description: Aid amount the family requested.
        default: 0
      - name: aid_awarded_cents
        type: integer
        source: computed
        description: Amount granted by the season aid award run.
        default: 0
      - name: aid_effective_cents
        type: integer
        source: computed
        description: Aid actually credited against balance_cents. While assessment_variant == PRELIMINARY it equals aid_awarded_cents (uncapped); at FINAL assessment it is re-derived under the income-band cap and the surplus is returned to Season.aid_available_cents.
        default: 0
      - name: instrument_loan_fee_cents
        type: integer
        source: computed
        description: Loan program fee by instrument class; never offset by aid.
        default: 0
      - name: payments_total_cents
        type: integer
        source: computed
        description: Sum of accepted payment amounts on this account.
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: assessed_cents - aid_effective_cents + instrument_loan_fee_cents - payments_total_cents.
        default: 0
      - name: billing_status
        type: enum
        source: system
        description: First independent dimension - billing posture.
        default: PENDING_ASSESSMENT
        constraints: "PENDING_ASSESSMENT | CURRENT | DELINQUENT | PAID_IN_FULL"
      - name: aid_status
        type: enum
        source: system
        description: Second independent dimension - aid workflow; RESCINDED may cycle back to REQUESTED.
        default: NONE
        constraints: "NONE | REQUESTED | UNDER_REVIEW | APPROVED | DENIED | RESCINDED"
      - name: aid_need_score
        type: integer
        source: computed
        description: Waterfall ordering score; see calculations.aid_need_score.
        default: 0
      - name: aid_reviewed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the FinanceOfficer who moved the request to UNDER_REVIEW; not a foreign key.
        default: null
      - name: aid_awarded_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the FinanceOfficer who executed the funding run; not a foreign key.
        default: null
      - name: aid_denial_reason
        type: enum
        source: system
        description: Why the waterfall denied the request.
        default: NONE
        constraints: "NONE | INSUFFICIENT_BUDGET | BELOW_MIN_AWARD"

  - name: EnsembleEvent
    parent: null
    common_fields: true
    fields:
      - name: ensemble_id
        type: string
        source: input
        description: FK -> Ensemble.id; the orchestra whose calendar carries this event.
      - name: kind
        type: enum
        source: input
        description: REHEARSAL rows feed the attendance index; the other three are performance kinds.
        constraints: "REHEARSAL | CONCERT | TOUR_PERFORMANCE | FESTIVAL"
      - name: start_at
        type: datetime
        source: input
        description: Event start instant (inclusive).
      - name: end_at
        type: datetime
        source: input
        description: Event end instant (exclusive); must be > start_at.
      - name: venue_code
        type: string
        source: input
        description: Venue or hall label.
      - name: is_dress_rehearsal
        type: boolean
        source: input
        description: Marks this REHEARSAL as the dress rehearsal of its ensemble.
        default: false
      - name: dress_rehearsal_required
        type: boolean
        source: input
        description: When true on a performance event, missing the latest dress rehearsal makes a member INELIGIBLE.
        default: false
      - name: eligibility_window_start
        type: datetime
        source: input
        description: Inclusive start of the rehearsal window scanned by the attendance index; required for performance kinds.
        default: null
      - name: soloist_selection_mode
        type: enum
        source: input
        description: AUTO_SELECT lets the server pick the soloist via calculations.soloist_selection; MANUAL requires an explicit soloist_member_id in the programming body; NONE programs the event with no soloist.
        default: AUTO_SELECT
        constraints: "AUTO_SELECT | MANUAL | NONE"
      - name: soloist_member_id
        type: string
        source: system
        description: FK -> Member.id; server-selected soloist, null until programming runs and again after a probation cascade.
        default: null
      - name: guest_artist_name
        type: string
        source: system
        description: Guest artist engaged for this event; null when none.
        default: null
      - name: guest_artist_fee_cents
        type: integer
        source: system
        description: Contracted guest-artist fee in cents; capped by GUEST_ARTIST_FEE_CAP_CENTS.
        default: 0
      - name: programming_state
        type: enum
        source: system
        description: DRAFT until programmed; SOLOIST_VACANT when the selected soloist loses eligibility; may return to PROGRAMMED on a re-run.
        default: DRAFT
        constraints: "DRAFT | PROGRAMMED | SOLOIST_VACANT"
      - name: tour_cost_share_cents
        type: integer
        source: input
        description: Per-member tour cost share for TOUR_PERFORMANCE and FESTIVAL events.
        default: 0
      - name: chaperone_required
        type: boolean
        source: input
        description: Whether a confirmed chaperone is a tour-readiness precondition.
        default: false
      - name: participation_count
        type: integer
        source: computed
        description: Count of EventParticipation rows for this event.
        default: 0

  - name: EventParticipation
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> EnsembleEvent.id; the rehearsal, concert, tour or festival.
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; the participating musician; unique per (event_id, member_id).
      - name: attendance_status
        type: enum
        source: system
        description: First dimension - attendance and the excused-absence procedure.
        default: NOT_RECORDED
        constraints: "NOT_RECORDED | PRESENT | TARDY | ABSENCE_UNVERIFIED | EXCUSE_PENDING | EXCUSED_ABSENT | UNEXCUSED_ABSENT"
      - name: excuse_reason_code
        type: enum
        source: system
        description: Reason submitted with the excuse request.
        default: NONE
        constraints: "NONE | ILLNESS | ACADEMIC_CONFLICT | FAMILY | TRANSPORT"
      - name: excuse_documentation_ref
        type: string
        source: system
        description: Documentation reference supplied with the excuse request.
        default: null
      - name: excuse_decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the RegistrarStaff who decided the excuse; not a foreign key.
        default: null
      - name: performance_eligibility
        type: enum
        source: system
        description: Second dimension - concert/tour performance eligibility.
        default: UNREVIEWED
        constraints: "UNREVIEWED | ELIGIBLE | INELIGIBLE"
      - name: ineligibility_reason
        type: enum
        source: system
        description: Why eligibility was refused or revoked.
        default: NONE
        constraints: "NONE | ATTENDANCE_INDEX_BELOW_THRESHOLD | DRESS_REHEARSAL_MISSED | MEMBER_ON_PROBATION"
      - name: attendance_index
        type: number
        source: computed
        description: Weighted rehearsal attendance percentage, 2 decimals; null until an eligibility review runs.
        default: null
      - name: fundraising_credited_cents
        type: integer
        source: computed
        description: Cumulative fundraising credited against this member's tour cost share.
        default: 0
      - name: fundraising_shortfall_cents
        type: integer
        source: computed
        description: max(0, event.tour_cost_share_cents - fundraising_credited_cents).
        default: 0
      - name: chaperone_name
        type: string
        source: system
        description: Chaperone submitted for this tour participation.
        default: null
      - name: chaperone_background_check_ref
        type: string
        source: system
        description: Background-check reference for the chaperone.
        default: null
      - name: chaperone_confirmed
        type: boolean
        source: computed
        description: True when both chaperone_name and chaperone_background_check_ref are present.
        default: false
      - name: tour_status
        type: enum
        source: system
        description: Third dimension - tour readiness; NOT_APPLICABLE for REHEARSAL and CONCERT events.
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | PENDING | READY"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Season
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: AUDITIONS_OPEN
        trigger: "POST /seasons/{seasonId}/advance-status with to_status=AUDITIONS_OPEN"
        actor: ArtisticDirector
        preconditions:
          - "ensemble_count >= 1"
          - "every Ensemble of this season has at least one SectionQuota row"
        side_effects:
          - "increments Season.version by 1"
      - from: AUDITIONS_OPEN
        to: PLACEMENT
        trigger: "POST /seasons/{seasonId}/advance-status with to_status=PLACEMENT"
        actor: ArtisticDirector
        preconditions:
          - "no Audition with season_id == this season has status IN {SCORED, REVISION_REQUESTED}"
        side_effects:
          - "increments Season.version by 1"
        note: "REQUESTED and SCHEDULED auditions may remain; they simply can no longer reach SCORED because scheduling is closed."
      - from: PLACEMENT
        to: IN_SEASON
        trigger: "POST /seasons/{seasonId}/advance-status with to_status=IN_SEASON"
        actor: ArtisticDirector
        preconditions:
          - "seated_ensemble_count == ensemble_count"
        side_effects:
          - "increments Season.version by 1"
      - from: PLACEMENT
        to: IN_SEASON
        trigger: "system: final hop of the placement-acceptance cascade (see Placement OFFERED_to_ACCEPTED)"
        actor: system
        preconditions:
          - "the Ensemble that just reached roster_state == SEATED was the last of this season, i.e. seated_ensemble_count == ensemble_count after that hop"
        side_effects:
          - "sets Season.status = IN_SEASON"
          - "increments Season.version by 1"
        note: "Auto-transition; hop 4 of transitive cascade `placement_accept_seats_to_season`."
      - from: IN_SEASON
        to: CLOSED
        trigger: "POST /seasons/{seasonId}/advance-status with to_status=CLOSED"
        actor: ArtisticDirector
        preconditions:
          - "no TuitionAccount with season_id == this season has billing_status == DELINQUENT"
        side_effects:
          - "hop 1: every Ensemble of this season with roster_state IN {FORMING, SEATED} -> CLOSED"
          - "hop 2: because those ensembles closed, every Member holding an ACTIVE SeatAssignment in them whose graduation_year == the season's closing year (year part of tuition_due_at) and whose enrollment_status == ENROLLED -> GRADUATED"
          - "hop 3: because those members became GRADUATED, each one with alumni_engagement_opt_in == true -> ALUMNI"
          - "increments Season.version by 1"

  - entity: Ensemble
    initial_state: FORMING
    terminal_states: [CLOSED]
    transitions:
      - from: FORMING
        to: SEATED
        trigger: "system: a SectionQuota of this ensemble reached balance_state == FULL"
        actor: system
        preconditions:
          - "every SectionQuota of this ensemble has balance_state == FULL"
          - "seated_count >= min_total_size"
        side_effects:
          - "sets Ensemble.roster_state = SEATED"
          - "increments Ensemble.version by 1"
          - "re-evaluates Season.seated_ensemble_count, which may advance Season.status from PLACEMENT to IN_SEASON"
        note: "Hop 3 of transitive cascade `placement_accept_seats_to_season`."
      - from: SEATED
        to: FORMING
        trigger: "system: a SectionQuota of this ensemble left balance_state == FULL after a seat was vacated"
        actor: system
        preconditions:
          - "at least one SectionQuota of this ensemble has balance_state != FULL"
        side_effects:
          - "sets Ensemble.roster_state = FORMING"
          - "decrements Season.seated_ensemble_count"
          - "increments Ensemble.version by 1"
      - from: FORMING
        to: CLOSED
        trigger: "system: Season IN_SEASON -> CLOSED cascade"
        actor: system
        preconditions: ["Season.status == CLOSED"]
        side_effects: ["increments Ensemble.version by 1"]
      - from: SEATED
        to: CLOSED
        trigger: "system: Season IN_SEASON -> CLOSED cascade"
        actor: system
        preconditions: ["Season.status == CLOSED"]
        side_effects: ["increments Ensemble.version by 1"]

  - entity: SectionQuota
    initial_state: UNDERFILLED
    terminal_states: []
    transitions:
      - from: UNDERFILLED
        to: BALANCED
        trigger: "system: filled_count increased by a seat creation"
        actor: system
        preconditions: ["filled_count >= min_count", "filled_count < target_count"]
        side_effects: ["increments SectionQuota.version by 1"]
      - from: BALANCED
        to: FULL
        trigger: "system: filled_count increased by a seat creation"
        actor: system
        preconditions: ["filled_count >= target_count"]
        side_effects:
          - "increments SectionQuota.version by 1"
          - "re-evaluates the owning Ensemble.roster_state, which may flip FORMING -> SEATED"
        note: "Hop 2 of transitive cascade `placement_accept_seats_to_season`."
      - from: UNDERFILLED
        to: FULL
        trigger: "system: filled_count increased by a seat creation on a section whose min_count == target_count"
        actor: system
        preconditions: ["filled_count >= target_count"]
        side_effects:
          - "increments SectionQuota.version by 1"
          - "re-evaluates the owning Ensemble.roster_state, which may flip FORMING -> SEATED"
      - from: FULL
        to: BALANCED
        trigger: "system: filled_count decreased by POST /seat-assignments/{seatId}/vacate"
        actor: system
        preconditions: ["filled_count < target_count", "filled_count >= min_count"]
        side_effects:
          - "increments SectionQuota.version by 1"
          - "re-evaluates the owning Ensemble.roster_state, which may flip SEATED -> FORMING"
      - from: BALANCED
        to: UNDERFILLED
        trigger: "system: filled_count decreased by POST /seat-assignments/{seatId}/vacate"
        actor: system
        preconditions: ["filled_count < min_count"]
        side_effects: ["increments SectionQuota.version by 1"]
      - from: FULL
        to: UNDERFILLED
        trigger: "system: filled_count decreased by POST /seat-assignments/{seatId}/vacate on a section whose min_count == target_count"
        actor: system
        preconditions: ["filled_count < min_count"]
        side_effects:
          - "increments SectionQuota.version by 1"
          - "re-evaluates the owning Ensemble.roster_state, which may flip SEATED -> FORMING"

  - entity: Audition
    initial_state: REQUESTED
    terminal_states: [ADJUDICATED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /auditions/{auditionId}/schedule"
        actor: RegistrarStaff
        preconditions:
          - "Season.status == AUDITIONS_OPEN for Audition.season_id"
          - "Member.standing_status == CLEAR (cross-entity gate; ATTENDANCE_PROBATION and FINANCIAL_HOLD both block scheduling)"
          - "AuditionSlot.season_id == Audition.season_id"
          - "AuditionSlot.instrument_focus == Member.primary_instrument"
          - "AuditionSlot.start_at >= Season.audition_window_start and AuditionSlot.end_at <= Season.audition_window_end"
          - "AuditionSlot.start_at > logical clock now"
          - "AuditionSlot.status == OPEN (booked_count < capacity)"
          - "Audition.scale_attested == true and set(AuditionSlot.required_excerpt_codes) is a subset of set(Audition.excerpt_ids)"
        side_effects:
          - "sets Audition.slot_id and increments AuditionSlot.booked_count by 1"
          - "sets AuditionSlot.status = FULL when booked_count >= capacity"
          - "increments Audition.version and AuditionSlot.version by 1 each"
      - from: REVISION_REQUESTED
        to: SCHEDULED
        trigger: "POST /auditions/{auditionId}/schedule (re-audition round)"
        actor: RegistrarStaff
        preconditions:
          - "same preconditions as REQUESTED -> SCHEDULED"
          - "Audition.revision_round <= MAX_REVISION_ROUNDS"
        side_effects:
          - "sets Audition.slot_id to the new slot and increments the new AuditionSlot.booked_count by 1"
          - "increments Audition.version by 1"
        note: "Closes the cycle SCORED -> REVISION_REQUESTED -> SCHEDULED -> SCORED."
      - from: SCHEDULED
        to: SCORED
        trigger: "system: the quorum-th PanelScore of the current revision_round is submitted via POST /auditions/{auditionId}/panel-scores"
        actor: system
        preconditions:
          - "submitted_score_count >= AuditionSlot.quorum_required"
        side_effects:
          - "computes Audition.composite_provisional_score via calculations.audition_composite variant PROVISIONAL"
          - "increments Audition.version by 1"
      - from: SCORED
        to: ADJUDICATED
        trigger: "POST /auditions/{auditionId}/adjudicate"
        actor: ArtisticDirector
        preconditions:
          - "Season.status IN {AUDITIONS_OPEN, PLACEMENT}"
          - "submitted_score_count >= AuditionSlot.quorum_required"
        side_effects:
          - "computes Audition.composite_final_score via calculations.audition_composite variant FINAL"
          - "computes Audition.tier_recommendation via calculations.tier_recommendation"
          - "increments Audition.version by 1"
      - from: SCORED
        to: REVISION_REQUESTED
        trigger: "POST /auditions/{auditionId}/request-revision"
        actor: ArtisticDirector
        preconditions:
          - "Season.status == AUDITIONS_OPEN"
          - "Audition.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "increments Audition.revision_round by 1 and clears composite_provisional_score to null"
          - "decrements the previous AuditionSlot.booked_count by 1 and sets that slot's status back to OPEN when booked_count < capacity"
          - "clears Audition.slot_id to null; PanelScore rows of earlier rounds are retained but excluded from all composites"
          - "increments Audition.version and the released AuditionSlot.version by 1 each"

  - entity: Placement
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN, RELEASED]
    transitions:
      - from: "(creation)"
        to: OFFERED
        trigger: "POST /placements with offer_kind=OFFER"
        actor: ArtisticDirector
        preconditions:
          - "Season.status == PLACEMENT for Ensemble.season_id (cross-entity gate)"
          - "Audition.status == ADJUDICATED and Audition.season_id == Ensemble.season_id"
          - "Ensemble.tier is at or below Audition.tier_recommendation in the band order SYMPHONY > PHILHARMONIC > CONCERT_ORCHESTRA; tier_recommendation == NOT_PLACED admits no offer"
          - "a SectionQuota exists for (Ensemble.id, Member.primary_instrument)"
          - "that SectionQuota.filled_count + count of OFFERED placements on the same (ensemble_id, instrument) < SectionQuota.max_count"
          - "no other Placement for the same (member_id, ensemble_id) has status IN {OFFERED, WAITLISTED, ACCEPTED}"
          - "expected_ensemble_version equals Ensemble.version"
          - "offer_expires_at is present and > logical clock now"
        side_effects:
          - "increments Ensemble.offered_count by 1 and increments Ensemble.version by 1"
          - "creates a TuitionAccount for (member_id, Ensemble.season_id) with ensemble_tier snapshot and billing_status PENDING_ASSESSMENT when none exists"
          - "sets Placement.member_id from Audition.member_id"
      - from: "(creation)"
        to: WAITLISTED
        trigger: "POST /placements with offer_kind=WAITLIST"
        actor: ArtisticDirector
        preconditions:
          - "Season.status == PLACEMENT for Ensemble.season_id"
          - "Audition.status == ADJUDICATED and Audition.season_id == Ensemble.season_id"
          - "Ensemble.tier is at or below Audition.tier_recommendation"
          - "a SectionQuota exists for (Ensemble.id, Member.primary_instrument)"
          - "no other Placement for the same (member_id, ensemble_id) has status IN {OFFERED, WAITLISTED, ACCEPTED}"
          - "expected_ensemble_version equals Ensemble.version"
        side_effects:
          - "sets waitlist_rank = 1 + count of WAITLISTED placements on the same (ensemble_id, instrument)"
          - "increments Ensemble.version by 1"
          - "does NOT change Ensemble.offered_count and does NOT create a TuitionAccount"
        note: "Divergent branch: the OFFER fork reserves capacity and opens a billing account, the WAITLIST fork does neither. offer_expires_at is ignored on this branch."
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /placements/{placementId}/accept"
        actor: Guardian
        preconditions:
          - "logical clock now < Placement.offer_expires_at"
          - "Member.standing_status != FINANCIAL_HOLD"
          - "the member's TuitionAccount for this season has billing_status != DELINQUENT (cross-entity gate)"
          - "SectionQuota.filled_count < SectionQuota.max_count"
          - "Ensemble.seated_count < Ensemble.max_total_size"
        side_effects:
          - "sets accepted_at from the logical clock; records instrument_loan_requested / instrument_class_loaned from the request"
          - "hop 1: creates a SeatAssignment (status ACTIVE, rotation_cycle_index = SectionQuota.rotation_cycle_index, ranking_score = Audition.composite_final_score), re-runs calculations.chair_ranking over the section, and increments SectionQuota.filled_count by 1"
          - "hop 2: because filled_count reached target_count, SectionQuota.balance_state advances to FULL"
          - "hop 3: because every SectionQuota of the ensemble is now FULL and seated_count >= min_total_size, Ensemble.roster_state advances FORMING -> SEATED"
          - "hop 4: because that was the season's last unseated ensemble, Season.status advances PLACEMENT -> IN_SEASON"
          - "sets Member.enrollment_status = ENROLLED when it was PROSPECT"
          - "runs calculations.tuition_assessment variant PRELIMINARY on the member's TuitionAccount and sets billing_status = CURRENT"
          - "decrements Ensemble.offered_count by 1 and increments Ensemble.version by 1"
          - "every other Placement of the same member in the same season with status IN {OFFERED, WAITLISTED} -> WITHDRAWN (conditional cascade; ACCEPTED and terminal rows untouched)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /placements/{placementId}/decline"
        actor: Guardian
        preconditions: []
        side_effects:
          - "decrements Ensemble.offered_count by 1 and increments Ensemble.version by 1"
          - "runs calculations.waitlist_promotion for (ensemble_id, instrument); the selected WAITLISTED row transitions to OFFERED with offer_expires_at = now + WAITLIST_OFFER_TTL_HOURS"
      - from: OFFERED
        to: EXPIRED
        trigger: "system: POST /seasons/{seasonId}/offer-expiry-sweep with logical clock now >= offer_expires_at"
        actor: system
        preconditions: ["logical clock now >= Placement.offer_expires_at"]
        side_effects:
          - "decrements Ensemble.offered_count by 1 and increments Ensemble.version by 1"
          - "runs calculations.waitlist_promotion for (ensemble_id, instrument)"
      - from: WAITLISTED
        to: OFFERED
        trigger: "system: calculations.waitlist_promotion selected this row after a DECLINED, EXPIRED or RELEASED sibling"
        actor: system
        preconditions:
          - "this row is the promotion winner for its (ensemble_id, instrument)"
          - "SectionQuota.filled_count + count of OFFERED placements on the same (ensemble_id, instrument) < SectionQuota.max_count"
        side_effects:
          - "sets offer_expires_at = logical clock now + WAITLIST_OFFER_TTL_HOURS and clears waitlist_rank to null"
          - "increments Ensemble.offered_count by 1"
          - "creates a TuitionAccount for (member_id, season_id) when none exists"
          - "dense-renumbers waitlist_rank of the remaining WAITLISTED rows of that (ensemble_id, instrument)"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /placements/{placementId}/decline on a WAITLISTED row"
        actor: Guardian
        preconditions: []
        side_effects:
          - "dense-renumbers waitlist_rank of the remaining WAITLISTED rows of that (ensemble_id, instrument)"
          - "increments Ensemble.version by 1"
        note: "Divergent branch: declining from WAITLISTED runs no promotion because no seat capacity was freed."
      - from: ACCEPTED
        to: RELEASED
        trigger: "system: POST /seat-assignments/{seatId}/vacate on this placement's ACTIVE seat"
        actor: system
        preconditions: ["the placement's SeatAssignment had status == ACTIVE"]
        side_effects:
          - "decrements SectionQuota.filled_count by 1 and re-runs calculations.chair_ranking over the remaining ACTIVE seats"
          - "re-evaluates SectionQuota.balance_state and Ensemble.roster_state"
          - "runs calculations.waitlist_promotion for (ensemble_id, instrument)"
          - "increments Ensemble.version by 1"

  - entity: Member
    initial_state: "PROSPECT (enrollment_status) x CLEAR (standing_status)"
    terminal_states: [ALUMNI, WITHDRAWN]
    transitions:
      # ---- dimension 1: enrollment_status ----
      - from: PROSPECT
        to: ENROLLED
        trigger: "system: POST /placements/{placementId}/accept succeeded for this member"
        actor: system
        preconditions: ["enrollment_status == PROSPECT"]
        side_effects: ["increments Member.version by 1"]
        note: "dimension: enrollment_status. Independent of standing_status, which is untouched here."
      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /members/{memberId}/status-transition with dimension=ENROLLMENT, to_status=GRADUATED"
        actor: RegistrarStaff
        preconditions:
          - "no TuitionAccount of this member has billing_status == DELINQUENT"
        side_effects:
          - "every ACTIVE SeatAssignment of this member -> VACATED with the full vacate cascade (quota filled_count, chair renumbering, ensemble roster_state, waitlist promotion)"
          - "increments Member.version by 1"
        note: "dimension: enrollment_status. The same target state is also reachable as hop 2 of the Season CLOSED cascade."
      - from: ENROLLED
        to: GRADUATED
        trigger: "system: hop 2 of the Season IN_SEASON -> CLOSED cascade for a member whose graduation_year matches the closing year"
        actor: system
        preconditions: ["Season.status == CLOSED", "Member.graduation_year == closing year"]
        side_effects: ["increments Member.version by 1"]
      - from: GRADUATED
        to: ALUMNI
        trigger: "POST /members/{memberId}/status-transition with dimension=ENROLLMENT, to_status=ALUMNI"
        actor: RegistrarStaff
        preconditions: ["alumni_engagement_opt_in == true"]
        side_effects: ["increments Member.version by 1"]
      - from: GRADUATED
        to: ALUMNI
        trigger: "system: hop 3 of the Season IN_SEASON -> CLOSED cascade for a member with alumni_engagement_opt_in == true"
        actor: system
        preconditions: ["alumni_engagement_opt_in == true"]
        side_effects: ["increments Member.version by 1"]
      - from: PROSPECT
        to: WITHDRAWN
        trigger: "POST /members/{memberId}/status-transition with dimension=ENROLLMENT, to_status=WITHDRAWN"
        actor: RegistrarStaff
        preconditions: []
        side_effects:
          - "every Placement of this member with status IN {OFFERED, WAITLISTED} -> WITHDRAWN"
          - "increments Member.version by 1"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /members/{memberId}/status-transition with dimension=ENROLLMENT, to_status=WITHDRAWN"
        actor: RegistrarStaff
        preconditions: []
        side_effects:
          - "every Placement of this member with status IN {OFFERED, WAITLISTED} -> WITHDRAWN"
          - "every ACTIVE SeatAssignment of this member -> VACATED with the full vacate cascade"
          - "increments Member.version by 1"
      # ---- dimension 2: standing_status ----
      - from: CLEAR
        to: ATTENDANCE_PROBATION
        trigger: "system: an attendance mutation raised effective_unexcused_count"
        actor: system
        preconditions:
          - "effective_unexcused_count - probation_baseline_count >= UNEXCUSED_PROBATION_THRESHOLD"
          - "standing_status == CLEAR"
        side_effects:
          - "hop 3 of cascade `unexcused_absence_probation_cascade`: every EventParticipation of this member whose event kind IN {CONCERT, TOUR_PERFORMANCE, FESTIVAL} and event.start_at > logical clock now and performance_eligibility != INELIGIBLE -> INELIGIBLE with ineligibility_reason = MEMBER_ON_PROBATION, and tour_status READY -> PENDING"
          - "increments Member.version by 1"
        note: "dimension: standing_status. enrollment_status is untouched, so an ENROLLED member can sit on probation."
      - from: ATTENDANCE_PROBATION
        to: CLEAR
        trigger: "POST /members/{memberId}/status-transition with dimension=STANDING, to_status=CLEAR"
        actor: RegistrarStaff
        preconditions:
          - "no TuitionAccount of this member has billing_status == DELINQUENT"
        side_effects:
          - "sets probation_baseline_count = effective_unexcused_count (reset mechanism: the next probation needs UNEXCUSED_PROBATION_THRESHOLD further effective absences)"
          - "increments Member.version by 1"
      - from: CLEAR
        to: FINANCIAL_HOLD
        trigger: "system: a TuitionAccount of this member became DELINQUENT"
        actor: system
        preconditions: ["at least one TuitionAccount of this member has billing_status == DELINQUENT"]
        side_effects: ["increments Member.version by 1"]
      - from: ATTENDANCE_PROBATION
        to: FINANCIAL_HOLD
        trigger: "system: a TuitionAccount of this member became DELINQUENT while on attendance probation"
        actor: system
        preconditions: ["at least one TuitionAccount of this member has billing_status == DELINQUENT"]
        side_effects: ["increments Member.version by 1"]
        note: "Precedence FINANCIAL_HOLD > ATTENDANCE_PROBATION; the probation cause is remembered through probation_baseline_count."
      - from: FINANCIAL_HOLD
        to: CLEAR
        trigger: "system: a payment or aid award left no DELINQUENT account for this member"
        actor: system
        preconditions:
          - "no TuitionAccount of this member has billing_status == DELINQUENT"
          - "effective_unexcused_count - probation_baseline_count < UNEXCUSED_PROBATION_THRESHOLD"
        side_effects: ["increments Member.version by 1"]
      - from: FINANCIAL_HOLD
        to: ATTENDANCE_PROBATION
        trigger: "system: a payment cleared the delinquency but the attendance cause still holds"
        actor: system
        preconditions:
          - "no TuitionAccount of this member has billing_status == DELINQUENT"
          - "effective_unexcused_count - probation_baseline_count >= UNEXCUSED_PROBATION_THRESHOLD"
        side_effects: ["increments Member.version by 1"]

  - entity: TuitionAccount
    initial_state: "PENDING_ASSESSMENT (billing_status) x NONE (aid_status)"
    terminal_states: []
    transitions:
      # ---- dimension 1: billing_status ----
      - from: PENDING_ASSESSMENT
        to: CURRENT
        trigger: "system: POST /placements/{placementId}/accept ran the preliminary tuition assessment"
        actor: system
        preconditions: ["assessed_cents > 0"]
        side_effects: ["increments TuitionAccount.version by 1"]
        note: "dimension: billing_status."
      - from: CURRENT
        to: DELINQUENT
        trigger: "system: any balance recomputation (finalize-assessment, payment, aid award, aid rescind) observed logical clock now >= Season.tuition_due_at with balance_cents > 0"
        actor: system
        preconditions: ["balance_cents > 0", "logical clock now >= Season.tuition_due_at"]
        side_effects:
          - "sets Member.standing_status = FINANCIAL_HOLD (cross-entity hop)"
          - "increments TuitionAccount.version by 1"
      - from: PAID_IN_FULL
        to: CURRENT
        trigger: "system: a FINAL assessment or an aid rescission raised balance_cents above 0 before the due date"
        actor: system
        preconditions: ["balance_cents > 0", "logical clock now < Season.tuition_due_at"]
        side_effects: ["increments TuitionAccount.version by 1"]
      - from: PAID_IN_FULL
        to: DELINQUENT
        trigger: "system: a FINAL assessment or an aid rescission raised balance_cents above 0 on or after the due date"
        actor: system
        preconditions: ["balance_cents > 0", "logical clock now >= Season.tuition_due_at"]
        side_effects:
          - "sets Member.standing_status = FINANCIAL_HOLD"
          - "increments TuitionAccount.version by 1"
      - from: CURRENT
        to: PAID_IN_FULL
        trigger: "POST /tuition-accounts/{accountId}/payments that brings balance_cents to <= 0"
        actor: Guardian
        preconditions: ["balance_cents <= 0 after the payment"]
        side_effects: ["increments TuitionAccount.version by 1"]
      - from: DELINQUENT
        to: PAID_IN_FULL
        trigger: "POST /tuition-accounts/{accountId}/payments that brings balance_cents to <= 0"
        actor: Guardian
        preconditions: ["balance_cents <= 0 after the payment"]
        side_effects:
          - "re-evaluates Member.standing_status, releasing FINANCIAL_HOLD when no other account of the member is DELINQUENT"
          - "increments TuitionAccount.version by 1"
      - from: DELINQUENT
        to: CURRENT
        trigger: "system: an aid award or FINAL assessment left balance_cents > 0 but the account is no longer past due because Season.tuition_due_at was moved forward is NOT possible; this transition fires only when balance_cents > 0 and logical clock now < Season.tuition_due_at after a recomputation"
        actor: system
        preconditions: ["balance_cents > 0", "logical clock now < Season.tuition_due_at"]
        side_effects:
          - "re-evaluates Member.standing_status"
          - "increments TuitionAccount.version by 1"
      # ---- dimension 2: aid_status ----
      - from: NONE
        to: REQUESTED
        trigger: "POST /tuition-accounts/{accountId}/aid-request"
        actor: Guardian
        preconditions:
          - "aid_requested_cents > 0 and aid_requested_cents <= assessed_cents"
          - "Season.status IN {PLACEMENT, IN_SEASON}"
        side_effects: ["increments TuitionAccount.version by 1"]
        note: "dimension: aid_status."
      - from: DENIED
        to: REQUESTED
        trigger: "POST /tuition-accounts/{accountId}/aid-request (re-application)"
        actor: Guardian
        preconditions: ["aid_requested_cents > 0 and aid_requested_cents <= assessed_cents"]
        side_effects:
          - "resets aid_denial_reason to NONE"
          - "increments TuitionAccount.version by 1"
      - from: RESCINDED
        to: REQUESTED
        trigger: "POST /tuition-accounts/{accountId}/aid-request (re-application after a rescission)"
        actor: Guardian
        preconditions: ["aid_requested_cents > 0 and aid_requested_cents <= assessed_cents"]
        side_effects:
          - "clears aid_reviewed_by_user_id and aid_awarded_by_user_id to null"
          - "increments TuitionAccount.version by 1"
        note: "Closes the aid cycle APPROVED -> RESCINDED -> REQUESTED -> UNDER_REVIEW -> APPROVED."
      - from: REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /tuition-accounts/{accountId}/aid-review"
        actor: FinanceOfficer
        preconditions: ["Season.aid_budget_cents > 0"]
        side_effects:
          - "records aid_reviewed_by_user_id = acting X-User-ID"
          - "computes aid_need_score via calculations.aid_need_score"
          - "increments TuitionAccount.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system: POST /seasons/{seasonId}/aid-award-run granted this account grant_cents >= MIN_AWARD_CENTS"
        actor: system
        preconditions: ["grant_cents >= MIN_AWARD_CENTS"]
        side_effects:
          - "sets aid_awarded_cents = grant_cents, aid_effective_cents = grant_cents (uncapped while assessment_variant == PRELIMINARY) and aid_awarded_by_user_id = the acting officer"
          - "increments Season.aid_committed_cents by grant_cents and decrements Season.aid_available_cents by the same amount"
          - "recomputes balance_cents and re-evaluates billing_status"
          - "increments TuitionAccount.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system: POST /seasons/{seasonId}/aid-award-run computed grant_cents < MIN_AWARD_CENTS for this account"
        actor: system
        preconditions: ["grant_cents < MIN_AWARD_CENTS"]
        side_effects:
          - "sets aid_awarded_cents = 0 and aid_denial_reason = INSUFFICIENT_BUDGET when remaining budget was the binding constraint, else BELOW_MIN_AWARD"
          - "leaves Season.aid_committed_cents unchanged so the remaining budget flows to the next applicant"
          - "increments TuitionAccount.version by 1"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /tuition-accounts/{accountId}/aid-rescind"
        actor: FinanceOfficer
        preconditions: ["aid_awarded_cents > 0"]
        side_effects:
          - "hop 1: sets aid_awarded_cents = 0 and aid_effective_cents = 0, decrements Season.aid_committed_cents by the account's aid_effective_cents as it stood before the rescission (the amount actually committed to this account, which is the capped figure once the FINAL assessment has run), increments Season.aid_available_cents by the same amount, and recomputes balance_cents upward"
          - "hop 2: because balance_cents > 0 and the logical clock is at or past Season.tuition_due_at, billing_status advances to DELINQUENT"
          - "hop 3: because the account went DELINQUENT, Member.standing_status advances CLEAR -> FINANCIAL_HOLD"
          - "increments TuitionAccount.version and Season.version by 1 each"

  - entity: SeatAssignment
    initial_state: ACTIVE
    terminal_states: [ROTATED_OUT, VACATED]
    transitions:
      - from: ACTIVE
        to: ROTATED_OUT
        trigger: "POST /section-quotas/{quotaId}/rotate-chairs"
        actor: ArtisticDirector
        preconditions:
          - "SectionQuota.rotation_policy == ROTATING"
          - "Ensemble.roster_state == SEATED (cross-entity gate)"
          - "SectionQuota.filled_count >= 2"
          - "expected_ensemble_version equals Ensemble.version"
        side_effects:
          - "for each ACTIVE row of the section a successor SeatAssignment is created with predecessor_assignment_id = the ROTATED_OUT row's id, rotation_cycle_index = old index + 1, and chair_number rotated per calculations.chair_rotation"
          - "increments SectionQuota.rotation_cycle_index by 1; SectionQuota.filled_count is unchanged because exactly one ACTIVE successor replaces each ACTIVE predecessor"
          - "increments Ensemble.version by 1"
      - from: ACTIVE
        to: VACATED
        trigger: "POST /seat-assignments/{seatId}/vacate"
        actor: ArtisticDirector
        preconditions:
          - "status == ACTIVE"
          - "Placement.status == ACCEPTED"
        side_effects:
          - "transitions the owning Placement ACCEPTED -> RELEASED with its full cascade (quota filled_count, chair renumbering, ensemble roster_state, waitlist promotion)"
          - "increments SeatAssignment.version by 1"

  - entity: EnsembleEvent
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PROGRAMMED
        trigger: "POST /ensemble-events/{eventId}/programming"
        actor: ArtisticDirector
        preconditions:
          - "kind IN {CONCERT, TOUR_PERFORMANCE, FESTIVAL}"
          - "when soloist_selection_mode == AUTO_SELECT the candidate pool of calculations.soloist_selection is non-empty"
          - "guest_artist_fee_cents <= GUEST_ARTIST_FEE_CAP_CENTS when a guest artist is supplied"
        side_effects:
          - "sets soloist_member_id to the winner of calculations.soloist_selection when soloist_selection_mode == AUTO_SELECT"
          - "records guest_artist_name and guest_artist_fee_cents when supplied"
          - "increments EnsembleEvent.version by 1"
      - from: PROGRAMMED
        to: SOLOIST_VACANT
        trigger: "system: hop 4 of cascade `unexcused_absence_probation_cascade` revoked the selected soloist's eligibility"
        actor: system
        preconditions:
          - "soloist_member_id is the member whose EventParticipation for this event just became INELIGIBLE"
        side_effects:
          - "clears soloist_member_id to null"
          - "increments EnsembleEvent.version by 1"
      - from: SOLOIST_VACANT
        to: PROGRAMMED
        trigger: "POST /ensemble-events/{eventId}/programming (re-run after a vacancy)"
        actor: ArtisticDirector
        preconditions:
          - "the candidate pool of calculations.soloist_selection is non-empty"
        side_effects:
          - "sets soloist_member_id to the new winner"
          - "increments EnsembleEvent.version by 1"
        note: "Closes the cycle PROGRAMMED -> SOLOIST_VACANT -> PROGRAMMED."

  - entity: EventParticipation
    initial_state: "NOT_RECORDED (attendance_status) x UNREVIEWED (performance_eligibility) x NOT_APPLICABLE|PENDING (tour_status)"
    terminal_states: [EXCUSED_ABSENT, UNEXCUSED_ABSENT]
    transitions:
      # ---- dimension 1: attendance_status ----
      - from: NOT_RECORDED
        to: PRESENT
        trigger: "POST /event-participations/{participationId}/attendance with attendance_status=PRESENT"
        actor: RegistrarStaff
        preconditions: ["logical clock now >= EnsembleEvent.start_at"]
        side_effects: ["increments EventParticipation.version by 1"]
        note: "dimension: attendance_status."
      - from: NOT_RECORDED
        to: TARDY
        trigger: "POST /event-participations/{participationId}/attendance with attendance_status=TARDY"
        actor: RegistrarStaff
        preconditions: ["logical clock now >= EnsembleEvent.start_at"]
        side_effects:
          - "increments Member.tardy_count by 1 and recomputes Member.effective_unexcused_count = unexcused_absence_count + floor(tardy_count / 3)"
          - "may advance Member.standing_status CLEAR -> ATTENDANCE_PROBATION when the recomputed effective count crosses the threshold"
          - "increments EventParticipation.version by 1"
      - from: NOT_RECORDED
        to: ABSENCE_UNVERIFIED
        trigger: "POST /event-participations/{participationId}/attendance with attendance_status=ABSENCE_UNVERIFIED"
        actor: RegistrarStaff
        preconditions: ["logical clock now >= EnsembleEvent.start_at"]
        side_effects: ["increments EventParticipation.version by 1"]
      - from: NOT_RECORDED
        to: UNEXCUSED_ABSENT
        trigger: "POST /event-participations/{participationId}/attendance with attendance_status=UNEXCUSED_ABSENT"
        actor: RegistrarStaff
        preconditions: ["logical clock now >= EnsembleEvent.start_at"]
        side_effects:
          - "hop 1: increments Member.unexcused_absence_count by 1 and recomputes effective_unexcused_count"
          - "hop 2: when effective_unexcused_count - probation_baseline_count >= UNEXCUSED_PROBATION_THRESHOLD, Member.standing_status advances CLEAR -> ATTENDANCE_PROBATION"
          - "hop 3: because the member went on probation, future performance EventParticipations of that member become INELIGIBLE"
          - "hop 4: because a revoked participation belonged to an event whose soloist_member_id is that member, that event's programming_state advances PROGRAMMED -> SOLOIST_VACANT and soloist_member_id is cleared"
          - "increments EventParticipation.version by 1"
      - from: ABSENCE_UNVERIFIED
        to: EXCUSE_PENDING
        trigger: "POST /event-participations/{participationId}/excuse-request"
        actor: Guardian
        preconditions:
          - "logical clock now < EnsembleEvent.end_at + EXCUSE_REQUEST_WINDOW_HOURS"
        side_effects:
          - "records excuse_reason_code and excuse_documentation_ref"
          - "increments EventParticipation.version by 1"
      - from: EXCUSE_PENDING
        to: EXCUSED_ABSENT
        trigger: "POST /event-participations/{participationId}/excuse-decision with decision=APPROVED"
        actor: RegistrarStaff
        preconditions: []
        side_effects:
          - "records excuse_decided_by_user_id"
          - "increments EventParticipation.version by 1"
      - from: EXCUSE_PENDING
        to: UNEXCUSED_ABSENT
        trigger: "POST /event-participations/{participationId}/excuse-decision with decision=DENIED"
        actor: RegistrarStaff
        preconditions: []
        side_effects:
          - "records excuse_decided_by_user_id"
          - "hop 1: increments Member.unexcused_absence_count by 1 and recomputes effective_unexcused_count"
          - "hop 2: when effective_unexcused_count - probation_baseline_count >= UNEXCUSED_PROBATION_THRESHOLD, Member.standing_status advances CLEAR -> ATTENDANCE_PROBATION"
          - "hop 3: because the member went on probation, every EventParticipation of that member on a future performance event becomes INELIGIBLE with ineligibility_reason = MEMBER_ON_PROBATION and tour_status READY -> PENDING"
          - "hop 4: because one of those revoked participations belongs to an event whose soloist_member_id is that member, that event's programming_state advances PROGRAMMED -> SOLOIST_VACANT and soloist_member_id is cleared to null"
          - "increments EventParticipation.version by 1"
        note: "Trigger of transitive cascade `excuse_denial_probation_cascade` (depth 4)."
      # ---- dimension 2: performance_eligibility ----
      - from: UNREVIEWED
        to: ELIGIBLE
        trigger: "POST /event-participations/{participationId}/eligibility-review"
        actor: ArtisticDirector
        preconditions:
          - "EnsembleEvent.kind IN {CONCERT, TOUR_PERFORMANCE, FESTIVAL} (cross-entity gate)"
          - "calculations.attendance_eligibility_index yields attendance_index >= ATTENDANCE_ELIGIBILITY_THRESHOLD"
          - "when EnsembleEvent.dress_rehearsal_required, the member's participation on the latest is_dress_rehearsal REHEARSAL of that ensemble inside the window has attendance_status == PRESENT"
          - "Member.standing_status != ATTENDANCE_PROBATION"
        side_effects:
          - "stores attendance_index and sets ineligibility_reason = NONE"
          - "increments EventParticipation.version by 1"
        note: "dimension: performance_eligibility."
      - from: UNREVIEWED
        to: INELIGIBLE
        trigger: "POST /event-participations/{participationId}/eligibility-review"
        actor: ArtisticDirector
        preconditions:
          - "EnsembleEvent.kind IN {CONCERT, TOUR_PERFORMANCE, FESTIVAL}"
          - "at least one of the three eligibility conditions failed"
        side_effects:
          - "stores attendance_index and sets ineligibility_reason to ATTENDANCE_INDEX_BELOW_THRESHOLD, DRESS_REHEARSAL_MISSED or MEMBER_ON_PROBATION (first failing condition in that order)"
          - "increments EventParticipation.version by 1"
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "system: hop 3 of cascade `excuse_denial_probation_cascade` or `unexcused_absence_probation_cascade`"
        actor: system
        preconditions: ["Member.standing_status == ATTENDANCE_PROBATION", "EnsembleEvent.start_at > logical clock now"]
        side_effects:
          - "sets ineligibility_reason = MEMBER_ON_PROBATION"
          - "sets tour_status = PENDING when it was READY"
          - "increments EventParticipation.version by 1"
      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "POST /event-participations/{participationId}/eligibility-review (re-review after the member's standing was cleared)"
        actor: ArtisticDirector
        preconditions:
          - "all three eligibility conditions now hold"
        side_effects:
          - "clears ineligibility_reason to NONE"
          - "increments EventParticipation.version by 1"
        note: "Closes the eligibility cycle ELIGIBLE -> INELIGIBLE -> ELIGIBLE."
      # ---- dimension 3: tour_status ----
      - from: PENDING
        to: READY
        trigger: "POST /event-participations/{participationId}/tour-requirements"
        actor: Guardian
        preconditions:
          - "EnsembleEvent.kind IN {TOUR_PERFORMANCE, FESTIVAL}"
          - "fundraising_credited_cents >= EnsembleEvent.tour_cost_share_cents (i.e. fundraising_shortfall_cents == 0)"
          - "chaperone_confirmed == true when EnsembleEvent.chaperone_required"
          - "performance_eligibility == ELIGIBLE"
        side_effects:
          - "recomputes fundraising_shortfall_cents and chaperone_confirmed"
          - "increments EventParticipation.version by 1"
        note: "dimension: tour_status."
      - from: READY
        to: PENDING
        trigger: "system: the member's performance_eligibility was revoked by a probation cascade"
        actor: system
        preconditions: ["performance_eligibility == INELIGIBLE"]
        side_effects: ["increments EventParticipation.version by 1"]

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: placement-offer-stale-ensemble
    parent_entity: Ensemble
    write_endpoint: "POST /placements"
    occ_field: "expected_ensemble_version"
    description: |
      Creating a Placement against an Ensemble whose version has advanced since
      the client last read it is rejected. This captures the case where another
      writer already created an offer or waitlist row on the same ensemble -
      which legitimately consumes section capacity and bumps Ensemble.version -
      so the current writer's view of offered_count, seated_count and section
      fill is stale and its own capacity arithmetic can no longer be trusted.
    error_id: ERR_STALE_ENSEMBLE_VERSION
    http_status: 412

  - rule_id: chair-rotation-stale-ensemble
    parent_entity: Ensemble
    write_endpoint: "POST /section-quotas/{quotaId}/rotate-chairs"
    occ_field: "expected_ensemble_version"
    description: |
      Running a chair rotation against an Ensemble whose version has advanced
      since the client last read it is rejected. A rotation permutes chairs over
      the exact set of ACTIVE seats the caller believed the section held; any
      intervening acceptance, vacate or rotation legitimately re-seats the
      section and bumps Ensemble.version, making the caller's chair map stale.
    error_id: ERR_STALE_ENSEMBLE_VERSION
    http_status: 412

  - rule_id: aid-award-run-stale-season
    parent_entity: Season
    write_endpoint: "POST /seasons/{seasonId}/aid-award-run"
    occ_field: "expected_season_version"
    description: |
      Executing the aid award waterfall against a Season whose version has
      advanced since the client last read it is rejected. Another award run,
      rescission or budget-affecting assessment legitimately changes
      aid_committed_cents and bumps Season.version, so the officer's view of
      aid_available_cents - the amount the waterfall distributes - is stale.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: panelist_weighted_total
    trigger: "On POST /auditions/{auditionId}/panel-scores, before the row is persisted."
    algorithm: weighted_scoring
    formula: |
      weighted_total =
        round_half_up(
            tone_score        * WEIGHT_TONE
          + rhythm_score      * WEIGHT_RHYTHM
          + intonation_score  * WEIGHT_INTONATION
          + sight_reading_score * WEIGHT_SIGHT_READING, 2)
      # The four weights sum to 4.0 and each rubric score is 0..25, so
      # weighted_total is on a 0.00..100.00 basis. Weights are applied to the
      # raw integer rubric scores; no intermediate value is rounded.
    input_set: "The four rubric integers of the single PanelScore row being submitted."
    constants:
      WEIGHT_TONE: 1.2
      WEIGHT_RHYTHM: 1.0
      WEIGHT_INTONATION: 1.0
      WEIGHT_SIGHT_READING: 0.8
    precision: "2 decimal places, round_half_up"

  - name: audition_composite
    trigger: |
      PROVISIONAL variant: when the quorum-th PanelScore of the current
      revision_round lands (Audition SCHEDULED -> SCORED).
      FINAL variant: on POST /auditions/{auditionId}/adjudicate (SCORED -> ADJUDICATED).
    algorithm: aggregation
    formula: |
      S = [ ps.weighted_total for ps in PanelScore
            where ps.audition_id == audition.id
              and ps.revision_round == audition.revision_round ]

      # PROVISIONAL - plain mean over every submitted sheet
      composite_provisional_score = round_half_up(sum(S) / len(S), 2)

      # FINAL - conditional symmetric trim, then mean
      if len(S) >= TRIM_MIN_SCORE_COUNT:
          drop exactly one row holding max(S) and exactly one row holding min(S);
          when several rows tie on the extreme value, drop the one with the
          earliest created_at (never the id)
          T = S with those two rows removed
      else:
          T = S
      composite_final_score = round_half_up(sum(T) / len(T), 2)
    input_set: |
      Only PanelScore rows whose revision_round equals the audition's CURRENT
      revision_round. Sheets from superseded rounds stay in the database and are
      excluded from both variants; this is what makes REVISION_REQUESTED
      observable in the composite.
    constants:
      TRIM_MIN_SCORE_COUNT: 4
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Stored in composite_provisional_score the moment quorum is reached."
        difference: "Plain arithmetic mean of every sheet, no trimming, regardless of len(S)."
      - name: FINAL
        when: "Stored in composite_final_score at adjudication."
        difference: |
          Drops one high and one low sheet when len(S) >= 4, so for identical
          sheets the two variants diverge whenever the discarded extremes are not
          symmetric about the mean. Worked fixture: sheets 81.80 / 94.60 / 66.60 /
          82.40 give PROVISIONAL 81.35 and FINAL 82.10.

  - name: tier_recommendation
    trigger: "On POST /auditions/{auditionId}/adjudicate, immediately after composite_final_score is stored."
    algorithm: threshold
    formula: |
      if composite_final_score >= TIER_BAND_SYMPHONY:          SYMPHONY
      elif composite_final_score >= TIER_BAND_PHILHARMONIC:    PHILHARMONIC
      elif composite_final_score >= TIER_BAND_CONCERT:         CONCERT_ORCHESTRA
      else:                                                    NOT_PLACED
      # All three comparisons are inclusive (>=) on the 2-decimal composite.
      # 62.50 recommends CONCERT_ORCHESTRA; 62.49 recommends NOT_PLACED.
    input_set: "The audition's own composite_final_score."
    constants:
      TIER_BAND_SYMPHONY: 85.00
      TIER_BAND_PHILHARMONIC: 75.00
      TIER_BAND_CONCERT: 62.50
    precision: "Compared at 2 decimal places; no further rounding."

  - name: tuition_assessment
    trigger: |
      PRELIMINARY variant: inside POST /placements/{placementId}/accept, which
      creates the TuitionAccount.
      FINAL variant: on POST /tuition-accounts/{accountId}/finalize-assessment.
    algorithm: tiered_pricing
    formula: |
      multiplier  = TIER_MULTIPLIER[account.ensemble_tier]
      gross_cents = round_half_up(season.tuition_base_cents * multiplier, 0)

      # ---- PRELIMINARY ----
      sibling_discount_cents = 0
      loyalty_credit_cents   = 0
      assessed_cents         = gross_cents

      # ---- FINAL (pinned rounding order: round EACH component to whole cents,
      #      THEN subtract; never sum the exact components and round once) ----
      sibling_discount_cents = member.sibling_enrolled
                               ? round_half_up(gross_cents * SIBLING_DISCOUNT_PCT, 0) : 0
      loyalty_years          = min(member.years_in_org, LOYALTY_MAX_YEARS)
      loyalty_credit_cents   = loyalty_years >= 1
                               ? round_half_up(gross_cents * LOYALTY_CREDIT_PCT_PER_YEAR
                                                          * loyalty_years, 0) : 0
      assessed_cents         = gross_cents - sibling_discount_cents - loyalty_credit_cents

      instrument_loan_fee_cents = placement.instrument_loan_requested
                                  ? LOAN_FEE[placement.instrument_class_loaned] : 0
      balance_cents = assessed_cents - aid_effective_cents
                      + instrument_loan_fee_cents - payments_total_cents
    input_set: |
      The Season's tuition_base_cents, the tier snapshot on the account, and the
      Member's sibling_enrolled / years_in_org. The loan fee comes from the
      accepted Placement and is never offset by aid.
    constants:
      TIER_MULTIPLIER: { SYMPHONY: 1.25, PHILHARMONIC: 1.00, CONCERT_ORCHESTRA: 0.80 }
      SIBLING_DISCOUNT_PCT: 0.10
      LOYALTY_CREDIT_PCT_PER_YEAR: 0.015
      LOYALTY_MAX_YEARS: 4
      LOAN_FEE: { STRING: 4500, WIND: 6500, PERCUSSION: 9000 }
    precision: |
      Whole cents, round_half_up, applied per component in the order written
      above. Worked fixture proving the order is observable: gross_cents 123223
      with sibling_enrolled and years_in_org 1 gives exact components 12322.30
      and 1848.345 -> rounded 12322 and 1848 -> assessed 109053. Summing the
      exact components first (14170.645 -> 14171) would yield 109052.
    variants:
      - name: PRELIMINARY
        when: "Set at acceptance, while the family's discount evidence is unverified."
        difference: "Both discount components are forced to 0, so assessed_cents == gross_cents."
      - name: FINAL
        when: "Set by finalize-assessment once discounts are verified."
        difference: |
          Subtracts the two independently rounded components, applies the
          income-band aid cap (see aid_cap_application) and re-derives
          balance_cents, which can flip billing_status in either direction.

  - name: aid_cap_application
    trigger: "Inside POST /tuition-accounts/{accountId}/finalize-assessment, after assessed_cents is recomputed."
    algorithm: threshold
    formula: |
      # Until the FINAL assessment runs, aid_effective_cents == aid_awarded_cents
      # (the award is credited uncapped). This calculation re-derives it:
      cap_cents           = round_half_up(assessed_cents * AID_CAP_PCT[member.household_income_band], 0)
      aid_effective_cents = min(aid_awarded_cents, cap_cents)
      surplus_cents       = aid_awarded_cents - aid_effective_cents
      # The capped surplus is returned to the season pool, preserving
      # aid_committed_cents + aid_available_cents == aid_budget_cents:
      season.aid_committed_cents -= surplus_cents
      season.aid_available_cents += surplus_cents
    input_set: "The account's own aid_awarded_cents plus the member's household_income_band."
    constants:
      AID_CAP_PCT: { BAND_A: 0.60, BAND_B: 0.40, BAND_C: 0.25 }
    precision: "Whole cents, round_half_up. Fixture: assessed 109053 with BAND_C gives cap 27263 (exact 27263.25)."

  - name: aid_need_score
    trigger: "On POST /tuition-accounts/{accountId}/aid-review, stored as the waterfall sort key."
    algorithm: weighted_scoring
    formula: |
      score = BAND_POINTS[member.household_income_band]
            + (member.sibling_enrolled ? 8 : 0)
            + 3 * min(member.years_in_org, 5)
            + (placement.instrument_loan_requested ? 6 : 0)
            + TIER_POINTS[account.ensemble_tier]
    input_set: "The account's member and tier snapshot plus the member's accepted Placement."
    constants:
      BAND_POINTS: { BAND_A: 40, BAND_B: 25, BAND_C: 10 }
      TIER_POINTS: { SYMPHONY: 5, PHILHARMONIC: 3, CONCERT_ORCHESTRA: 1 }
    precision: "Integer, no rounding."

  - name: aid_award_waterfall
    trigger: "On POST /seasons/{seasonId}/aid-award-run."
    algorithm: waterfall_allocation
    formula: |
      queue = accounts of this season with aid_status == UNDER_REVIEW,
              ordered by aid_need_score DESC,
                         assessed_cents DESC,
                         created_at ASC          # never id
      per_member_ceiling = round_half_up(season.aid_budget_cents * PER_MEMBER_AID_SHARE, 0)
      remaining = season.aid_available_cents

      for account in queue:                      # strict sequential waterfall
          grant = min(account.aid_requested_cents, per_member_ceiling, remaining)
          if grant >= MIN_AWARD_CENTS:
              account.aid_awarded_cents = grant
              account.aid_status        = APPROVED
              remaining               -= grant
              season.aid_committed_cents += grant
          else:
              account.aid_awarded_cents = 0
              account.aid_status        = DENIED
              account.aid_denial_reason = (remaining < MIN_AWARD_CENTS)
                                          ? INSUFFICIENT_BUDGET : BELOW_MIN_AWARD
              # remaining is NOT decremented - a denial leaves the money in the
              # pool for the applicants behind it. Clamping the grant BEFORE the
              # floor test, rather than committing then reversing, is what makes
              # the later applicants' outcomes order-observable.
      season.aid_available_cents = season.aid_budget_cents - season.aid_committed_cents
    input_set: |
      Only accounts in aid_status == UNDER_REVIEW. REQUESTED accounts (never
      reviewed) and APPROVED/DENIED/RESCINDED accounts are skipped, so a
      second run redistributes only what the first run left over.
    constants:
      PER_MEMBER_AID_SHARE: 0.30
      MIN_AWARD_CENTS: 5000
    precision: |
      Whole cents. Fixture with aid_budget_cents 100000 (ceiling 30000):
      requests 30000 / 40000 / 38000 / 3000 / 20000 in queue order award
      30000, 30000, 30000, 0 (DENIED BELOW_MIN_AWARD - 3000 < 5000, budget
      untouched), then 10000 to the fifth applicant from the surviving
      remainder. aid_committed_cents ends at 100000, aid_available_cents at 0.

  - name: chair_ranking
    trigger: "Whenever a section's ACTIVE SeatAssignment set changes: acceptance, vacate, waitlist promotion, rotation."
    algorithm: chronological
    formula: |
      active = [ s for s in SeatAssignment
                 where s.section_quota_id == quota.id and s.status == ACTIVE ]
      order  = active sorted by ranking_score DESC,
                                member.years_in_org DESC,
                                s.created_at ASC        # never id
      for index, s in enumerate(order):  s.chair_number = index + 1
      s.is_principal = (s.chair_number == 1 and quota.principal_required)
      # Invariant: the multiset of chair_number over ACTIVE rows of a section is
      # exactly {1 .. filled_count}, so sum(chair_number) == n*(n+1)/2 always.
    input_set: "ACTIVE SeatAssignment rows of the one section; ROTATED_OUT and VACATED rows keep their historical chair_number and are excluded."
    constants: {}
    precision: "Integer chair numbers, contiguous from 1, no gaps."

  - name: chair_rotation
    trigger: "On POST /section-quotas/{quotaId}/rotate-chairs."
    algorithm: constraint_propagation
    formula: |
      n = quota.filled_count                       # >= 2 required
      for each ACTIVE row p of the section:
          p.status = ROTATED_OUT
          create successor s with
              placement_id, section_quota_id, member_id, ranking_score copied from p,
              predecessor_assignment_id = p.id,
              rotation_cycle_index      = p.rotation_cycle_index + 1,
              chair_number              = (p.chair_number == 1) ? n : p.chair_number - 1,
              is_principal              = (chair_number == 1 and quota.principal_required),
              status                    = ACTIVE
      quota.rotation_cycle_index += 1
      # The permutation is a single cycle: the principal steps back to the last
      # chair and every other player advances one chair. Because exactly one
      # ACTIVE successor replaces each ACTIVE predecessor, filled_count and the
      # chair multiset {1..n} are both conserved; balance_state cannot move.
      # chair_ranking is NOT re-applied after a rotation - the rotated order is
      # authoritative until the ACTIVE set changes again.
    input_set: "ACTIVE SeatAssignment rows of one ROTATING section."
    constants: {}
    precision: "Integer chair numbers; conserved multiset {1..filled_count}."

  - name: attendance_eligibility_index
    trigger: "On POST /event-participations/{participationId}/eligibility-review."
    algorithm: aggregation
    formula: |
      perf   = the participation's EnsembleEvent          # a performance kind
      rehe   = [ e for e in EnsembleEvent
                 where e.ensemble_id == perf.ensemble_id
                   and e.kind == REHEARSAL
                   and e.start_at >= perf.eligibility_window_start
                   and e.start_at <  perf.start_at ]
      rows   = [ this member's EventParticipation for each e in rehe
                 whose attendance_status != NOT_RECORDED ]
      if len(rows) == 0:  attendance_index = 0.00
      else:
        attendance_index = round_half_up(100 * sum(ATTENDANCE_WEIGHT[r.attendance_status])
                                             / len(rows), 2)
      eligible = attendance_index >= ATTENDANCE_ELIGIBILITY_THRESHOLD
    input_set: |
      REHEARSAL events of the SAME ensemble inside the half-open window
      [eligibility_window_start, perf.start_at). NOT_RECORDED rows are excluded
      from BOTH numerator and denominator; EXCUSE_PENDING and ABSENCE_UNVERIFIED
      stay in the denominator with weight 0.0, so an undecided excuse hurts.
    constants:
      ATTENDANCE_WEIGHT:
        PRESENT: 1.0
        TARDY: 0.5
        EXCUSED_ABSENT: 0.75
        ABSENCE_UNVERIFIED: 0.0
        EXCUSE_PENDING: 0.0
        UNEXCUSED_ABSENT: 0.0
      ATTENDANCE_ELIGIBILITY_THRESHOLD: 80.00
    precision: |
      2 decimal places, round_half_up, compared with >=. Fixtures: 4 PRESENT +
      1 UNEXCUSED_ABSENT over 5 counted rows = 80.00 exactly -> ELIGIBLE;
      4 PRESENT + 1 EXCUSED_ABSENT + 1 UNEXCUSED_ABSENT over 6 counted rows =
      79.17 (exact 79.1666...) -> INELIGIBLE.

  - name: effective_unexcused_count
    trigger: "After every attendance mutation and every excuse decision on any EventParticipation of the member."
    algorithm: threshold
    formula: |
      unexcused_absence_count  = count(participations of member with attendance_status == UNEXCUSED_ABSENT)
      tardy_count              = count(participations of member with attendance_status == TARDY)
      effective_unexcused_count = unexcused_absence_count
                                + floor(tardy_count / TARDY_TO_ABSENCE_RATIO)
      on_probation = (effective_unexcused_count - probation_baseline_count)
                     >= UNEXCUSED_PROBATION_THRESHOLD
    input_set: "Every EventParticipation of the member across all events and ensembles of the season."
    constants:
      TARDY_TO_ABSENCE_RATIO: 3
      UNEXCUSED_PROBATION_THRESHOLD: 3
    precision: |
      Integer, floor division on the tardy conversion. Boundary: 2 tardies
      contribute 0, the 3rd tardy contributes 1. probation_baseline_count is the
      reset mechanism - clearing standing pins the baseline at the current
      effective count, so probation needs 3 FURTHER effective absences.

  - name: soloist_selection
    trigger: "On POST /ensemble-events/{eventId}/programming when soloist_selection_mode == AUTO_SELECT."
    algorithm: weighted_scoring
    formula: |
      pool = [ m for m in Member where
                 m has an ACTIVE SeatAssignment in a SectionQuota of event.ensemble_id
                 and m.standing_status == CLEAR
                 and the EventParticipation (event.id, m.id) exists
                     with performance_eligibility == ELIGIBLE
                 and m is NOT already soloist_member_id of another EnsembleEvent
                     of the same ensemble whose programming_state == PROGRAMMED ]
      if pool is empty:  reject with ERR_NO_ELIGIBLE_SOLOIST
      winner = pool sorted by seat.is_principal DESC,
                             seat.ranking_score DESC,
                             m.years_in_org DESC,
                             participation.attendance_index DESC,
                             seat.created_at ASC        # never id
               first row
    input_set: |
      Only currently-seated, currently-eligible, currently-CLEAR members of this
      ensemble. The exclusion clause is the retry semantics: after a
      SOLOIST_VACANT re-run the previous winner is out of the pool only if it is
      still the soloist of some other PROGRAMMED event - a cleared soloist_member_id
      makes the member selectable again.
    constants: {}
    precision: "Deterministic total order; every tie-break is a stored field, with created_at as the final fallback."

  - name: waitlist_promotion
    trigger: |
      Whenever a section loses a claim on a seat: a Placement leaves OFFERED for
      DECLINED or EXPIRED, or an ACCEPTED placement is RELEASED by a seat vacate.
    algorithm: chronological
    formula: |
      section = the SectionQuota of (vacating placement's ensemble_id,
                                    member.primary_instrument)
      queue   = [ p for p in Placement where p.ensemble_id == section.ensemble_id
                    and p.status == WAITLISTED
                    and p.member.primary_instrument == section.instrument ]
                ordered by audition.composite_final_score DESC,
                           p.created_at ASC              # never id
      for index, p in enumerate(queue):  p.waitlist_rank = index + 1
      if queue is non-empty and section.filled_count + ensemble.offered_count
                                < section.max_count:
          head = queue[0]
          head.status           = OFFERED
          head.offer_expires_at = clock_now + OFFER_TTL_HOURS
          head.waitlist_rank    = null
          re-rank the remainder from 1
    input_set: "WAITLISTED placements of the same ensemble whose member plays the vacated section's instrument; WITHDRAWN rows are excluded permanently."
    constants:
      OFFER_TTL_HOURS: 72
    precision: "Integer 1-based ranks, contiguous, recomputed on every queue mutation."

  - name: room_slot_overlap
    trigger: "On POST /audition-slots and on POST /auditions/{auditionId}/schedule (which may move an audition to another slot)."
    algorithm: interval_merge
    formula: |
      # Room occupancy is BUFFERED on both sides by the turnover time.
      conflict(a, b) := a.room_code == b.room_code
                     and a.start_at < b.end_at   + ROOM_TURNOVER_BUFFER_MINUTES
                     and b.start_at < a.end_at   + ROOM_TURNOVER_BUFFER_MINUTES
      # Two slots separated by EXACTLY 15 minutes do not conflict (the buffered
      # comparison is strict), 14 minutes do.
    input_set: "All AuditionSlot rows sharing room_code within the season."
    constants:
      ROOM_TURNOVER_BUFFER_MINUTES: 15
    precision: "Minute resolution; the buffered comparison is strict (<), so a gap exactly equal to the buffer is legal."

  - name: member_event_overlap
    trigger: "On POST /event-participations."
    algorithm: interval_merge
    formula: |
      # A member's own calendar uses PLAIN half-open intervals - no buffer.
      conflict(x, y) := x.member_id == y.member_id
                     and x.event.start_at < y.event.end_at
                     and y.event.start_at < x.event.end_at
      # Back-to-back events where one ends exactly when the next starts
      # (x.end_at == y.start_at) do NOT conflict.
    input_set: "All EventParticipation rows of the same member whose events are not CANCELLED (no cancellation exists in this domain, so: all of them)."
    constants: {}
    precision: "Half-open [start_at, end_at); zero-length touching is legal."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
# Priority bands, and the pinned inter-band order that makes multi-violation
# requests deterministic:
#   1-7    protocol      (auth -> role -> ownership -> path -> body -> body FK -> paging)
#   20-29  state         (target resource's own state machine)
#   30     concurrency   (OCC on the parent's version)
#   40-49  cross-entity  (a DIFFERENT entity's state gates this write)
#   50-55  safety / SoD / blind-panel integrity
#   56     business_temporal   (window containment)
#   60-66  business_referential + uniqueness + per-row constraint
#   70-72  business_constraint (interval overlap on a shared resource)
#   80-84  business_fiscal
#   90-92  capacity / quota
# Deliberate cross-band pairs exercised by SCAFFOLD_DIFFICULTY_DESIGN Rule 5:
#   state(22) beats fiscal(80); safety(54) beats fiscal(83);
#   temporal(56) beats constraint(70); referential(60) beats constraint(66).

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the five declared roles."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the endpoint's roles list in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: |
      Ownership for entity-backed roles. Guardian (identity entity_backed:Member):
      X-User-ID must equal the Member.id reached from the target resource
      (Audition.member_id, Placement.member_id, TuitionAccount.member_id,
      EventParticipation.member_id) and must equal the member_id in the body of
      POST /auditions. Panelist (identity entity_backed:Panelist): X-User-ID must
      equal the panelist_id in the body of POST /auditions/{auditionId}/panel-scores.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /auditions, POST /placements/{placementId}/accept, POST /placements/{placementId}/decline, POST /auditions/{auditionId}/panel-scores, POST /tuition-accounts/{accountId}/aid-request, POST /tuition-accounts/{accountId}/payments, POST /event-participations/{participationId}/excuse-request, POST /event-participations/{participationId}/tour-requirements"

  - priority: 4
    category: existence
    check: |
      Every id in the path exists, validated left-to-right. One error per
      resource family: ERR_SEASON_NOT_FOUND, ERR_ENSEMBLE_NOT_FOUND,
      ERR_SECTION_QUOTA_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_PANELIST_NOT_FOUND,
      ERR_AUDITION_SLOT_NOT_FOUND, ERR_AUDITION_NOT_FOUND,
      ERR_PANEL_SCORE_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND,
      ERR_SEAT_ASSIGNMENT_NOT_FOUND, ERR_TUITION_ACCOUNT_NOT_FOUND,
      ERR_ENSEMBLE_EVENT_NOT_FOUND, ERR_PARTICIPATION_NOT_FOUND.
    error_id: ERR_<RESOURCE>_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: |
      Body schema: every required input field of §1.5 is present, every enum
      value is a declared member, every integer is inside its §1.1 constraint
      range, every datetime parses as ISO-8601 UTC, and end_at > start_at where
      both are supplied. Also covers array cardinality (panelist_ids 2..5
      distinct, excerpt_ids 1..6 distinct) and quorum_required <= len(panelist_ids).
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 6
    category: existence
    check: |
      Every FK supplied in the request BODY resolves to an existing row
      (season_id, ensemble_id, member_id, slot_id, audition_id, panelist_id,
      event_id, soloist_member_id), reported with that resource family's
      NOT_FOUND error.
    error_id: ERR_<RESOURCE>_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK body fields"

  - priority: 7
    category: existence
    check: "limit is an integer 1..100 and offset is an integer >= 0 on every list endpoint."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  # ---------------- 20-29 state preconditions on the target itself -----------
  - priority: 20
    category: state
    check: "POST /seasons/{seasonId}/advance-status: to_status is the declared successor of the season's current status (PLANNING->AUDITIONS_OPEN->PLACEMENT->IN_SEASON->CLOSED); no skipping and no reversal."
    error_id: ERR_INVALID_SEASON_TRANSITION
    http_status: 409
    applies_to: "POST /seasons/{seasonId}/advance-status"

  - priority: 21
    category: state
    check: |
      The target row is in a state that admits the requested action:
      schedule requires Audition.status IN {REQUESTED, REVISION_REQUESTED};
      panel-scores requires SCHEDULED; adjudicate requires SCORED;
      request-revision requires SCORED; accept/decline require Placement.status
      IN {OFFERED, WAITLISTED} per the endpoint; vacate requires
      SeatAssignment.status == ACTIVE; excuse-request requires
      attendance_status == ABSENCE_UNVERIFIED; excuse-decision requires
      EXCUSE_PENDING; attendance requires NOT_RECORDED.
    error_id: ERR_INVALID_STATE_FOR_OPERATION
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 22
    category: state
    check: |
      Aid workflow state: aid-request requires aid_status IN {NONE, DENIED,
      RESCINDED}; aid-review requires REQUESTED; aid-rescind requires APPROVED.
      This band deliberately outranks the fiscal band, so an over-sized request
      on an already-APPROVED account reports the state error, not the fiscal one.
    error_id: ERR_AID_REQUEST_NOT_ALLOWED_IN_STATE
    http_status: 409
    applies_to: "POST /tuition-accounts/{accountId}/aid-request, POST /tuition-accounts/{accountId}/aid-review, POST /tuition-accounts/{accountId}/aid-rescind"

  - priority: 23
    category: state
    check: "POST /members/{memberId}/status-transition: (dimension, to_status) is a declared transition out of the member's current value on that dimension; ALUMNI is only reachable from GRADUATED and only with alumni_engagement_opt_in == true."
    error_id: ERR_INVALID_MEMBER_TRANSITION
    http_status: 409
    applies_to: "POST /members/{memberId}/status-transition"

  - priority: 24
    category: state
    check: "POST /auditions/{auditionId}/request-revision: revision_round < MAX_REVISION_ROUNDS (2). The third revision request on the same audition is refused."
    error_id: ERR_MAX_REVISION_ROUNDS_REACHED
    http_status: 409
    applies_to: "POST /auditions/{auditionId}/request-revision"

  - priority: 25
    category: state
    check: "POST /ensemble-events/{eventId}/programming: programming_state IN {DRAFT, SOLOIST_VACANT} and kind != REHEARSAL."
    error_id: ERR_EVENT_NOT_PROGRAMMABLE
    http_status: 409
    applies_to: "POST /ensemble-events/{eventId}/programming"

  # ---------------- 30 optimistic concurrency -------------------------------
  - priority: 30
    category: state
    check: "expected_ensemble_version equals the current Ensemble.version (POST /placements, POST /section-quotas/{quotaId}/rotate-chairs)."
    error_id: ERR_STALE_ENSEMBLE_VERSION
    http_status: 412
    applies_to: "POST /placements, POST /section-quotas/{quotaId}/rotate-chairs"

  - priority: 31
    category: state
    check: "expected_season_version equals the current Season.version (POST /seasons/{seasonId}/aid-award-run)."
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412
    applies_to: "POST /seasons/{seasonId}/aid-award-run"

  # ---------------- 40-49 cross-entity state dependency ---------------------
  - priority: 40
    category: state
    check: "POST /audition-slots and POST /auditions/{auditionId}/schedule require the Season.status == AUDITIONS_OPEN; POST /auditions requires Season.status IN {PLANNING, AUDITIONS_OPEN}."
    error_id: ERR_SEASON_NOT_ACCEPTING_AUDITIONS
    http_status: 409
    applies_to: "POST /audition-slots, POST /auditions, POST /auditions/{auditionId}/schedule"

  - priority: 41
    category: state
    check: "POST /placements requires Season.status == PLACEMENT and Ensemble.roster_state == FORMING; a SEATED or CLOSED ensemble accepts no further offers or waitlist rows."
    error_id: ERR_ENSEMBLE_NOT_ACCEPTING_PLACEMENTS
    http_status: 409
    applies_to: "POST /placements"

  - priority: 42
    category: state
    check: "POST /placements requires the referenced Audition.status == ADJUDICATED with tier_recommendation != NOT_PLACED."
    error_id: ERR_AUDITION_NOT_ADJUDICATED
    http_status: 409
    applies_to: "POST /placements"

  - priority: 43
    category: state
    check: "POST /section-quotas/{quotaId}/rotate-chairs requires the owning Ensemble.roster_state == SEATED. A FORMING ensemble cannot rotate chairs even when the section itself is FULL."
    error_id: ERR_ENSEMBLE_NOT_SEATED
    http_status: 409
    applies_to: "POST /section-quotas/{quotaId}/rotate-chairs"

  - priority: 44
    category: state
    check: "POST /event-participations/{participationId}/eligibility-review requires the EnsembleEvent.kind IN {CONCERT, TOUR_PERFORMANCE, FESTIVAL}; rehearsals have no performance eligibility. POST /event-participations/{participationId}/tour-requirements requires kind IN {TOUR_PERFORMANCE, FESTIVAL}."
    error_id: ERR_EVENT_KIND_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /event-participations/{participationId}/eligibility-review, POST /event-participations/{participationId}/tour-requirements"

  - priority: 45
    category: state
    check: "POST /members/{memberId}/status-transition to GRADUATED, and POST /seasons/{seasonId}/advance-status to CLOSED, both require that no TuitionAccount in scope has billing_status == DELINQUENT."
    error_id: ERR_DELINQUENT_ACCOUNT_BLOCKS_CLOSE
    http_status: 409
    applies_to: "POST /members/{memberId}/status-transition, POST /seasons/{seasonId}/advance-status"

  - priority: 46
    category: state
    check: "POST /seasons/{seasonId}/advance-status to IN_SEASON requires seated_ensemble_count == ensemble_count; to PLACEMENT requires no Audition of the season in status SCORED or REVISION_REQUESTED; to AUDITIONS_OPEN requires ensemble_count >= 1 and every ensemble to own at least one SectionQuota."
    error_id: ERR_SEASON_PRECONDITION_UNMET
    http_status: 409
    applies_to: "POST /seasons/{seasonId}/advance-status"

  - priority: 47
    category: state
    check: "POST /tuition-accounts/{accountId}/finalize-assessment requires assessment_variant == PRELIMINARY (the FINAL assessment is computed once) and the member's Placement.status == ACCEPTED."
    error_id: ERR_ASSESSMENT_ALREADY_FINAL
    http_status: 409
    applies_to: "POST /tuition-accounts/{accountId}/finalize-assessment"

  # ---------------- 50-55 safety / SoD / blind-panel integrity --------------
  - priority: 50
    category: business_safety
    check: "POST /auditions/{auditionId}/panel-scores: the acting Panelist's conflict_member_ids must not contain the audition's member_id. Blind-panel integrity outranks the duplicate-score check at priority 62."
    error_id: ERR_PANEL_CONFLICT_OF_INTEREST
    http_status: 403
    applies_to: "POST /auditions/{auditionId}/panel-scores"

  - priority: 51
    category: business_safety
    check: "POST /auditions/{auditionId}/panel-scores: the acting panelist_id appears in the audition's current AuditionSlot.panelist_ids and that panelist's instrument_expertise equals the slot's instrument_focus."
    error_id: ERR_PANELIST_NOT_ON_PANEL
    http_status: 403
    applies_to: "POST /auditions/{auditionId}/panel-scores"

  - priority: 52
    category: business_safety
    check: "POST /seasons/{seasonId}/aid-award-run: the acting X-User-ID must not equal aid_reviewed_by_user_id on ANY account in the run queue. Segregation of duties: the officer who reviewed a request may not fund it."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /seasons/{seasonId}/aid-award-run"

  - priority: 53
    category: business_safety
    check: "POST /event-participations/{participationId}/excuse-decision: the acting X-User-ID must not equal the X-User-ID that recorded the absence in a prior attendance call on the same participation, and must not equal excuse_decided_by_user_id from an earlier decision."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /event-participations/{participationId}/excuse-decision"

  - priority: 54
    category: business_safety
    check: "POST /ensemble-events/{eventId}/programming with soloist_selection_mode == MANUAL: the supplied soloist_member_id must hold an ACTIVE SeatAssignment in this ensemble, have standing_status == CLEAR, and have performance_eligibility == ELIGIBLE on this event."
    error_id: ERR_SOLOIST_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /ensemble-events/{eventId}/programming"

  - priority: 55
    category: business_safety
    check: "POST /ensemble-events/{eventId}/programming with soloist_selection_mode == AUTO_SELECT: calculations.soloist_selection must yield a non-empty candidate pool."
    error_id: ERR_NO_ELIGIBLE_SOLOIST
    http_status: 422
    applies_to: "POST /ensemble-events/{eventId}/programming"

  # ---------------- 56 temporal window containment --------------------------
  - priority: 56
    category: business_temporal
    check: |
      Window containment against the logical clock and the season calendar:
      POST /audition-slots requires season.audition_window_start <= start_at and
      end_at <= season.audition_window_end (half-open on the upper bound);
      POST /event-participations/{participationId}/attendance requires the
      logical clock to be at or after event.start_at;
      POST /event-participations/{participationId}/excuse-request requires the
      logical clock to be strictly before event.end_at + 48h.
      This band outranks the interval-overlap band at 70, so a slot that is both
      outside the audition window and double-books its room reports the window error.
    error_id: ERR_SLOT_OUTSIDE_AUDITION_WINDOW
    http_status: 422
    applies_to: "POST /audition-slots, POST /event-participations/{participationId}/attendance, POST /event-participations/{participationId}/excuse-request"

  - priority: 57
    category: business_temporal
    check: "POST /event-participations/{participationId}/attendance before event.start_at is refused with ERR_EVENT_NOT_STARTED; POST /event-participations/{participationId}/excuse-request at or after event.end_at + EXCUSE_REQUEST_WINDOW_HOURS is refused with ERR_EXCUSE_WINDOW_CLOSED."
    error_id: ERR_EXCUSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /event-participations/{participationId}/attendance, POST /event-participations/{participationId}/excuse-request"

  # ---------------- 60-66 referential / uniqueness / per-row constraint -----
  - priority: 60
    category: business_referential
    check: "POST /auditions/{auditionId}/schedule: the slot's instrument_focus equals the member's primary_instrument and the slot's season_id equals the audition's season_id."
    error_id: ERR_SLOT_INSTRUMENT_MISMATCH
    http_status: 422
    applies_to: "POST /auditions/{auditionId}/schedule"

  - priority: 61
    category: business_referential
    check: "POST /auditions/{auditionId}/schedule: the audition's excerpt_ids cover every code in the slot's required_excerpt_codes, and scale_attested is true when required_excerpt_codes is non-empty."
    error_id: ERR_REPERTOIRE_REQUIREMENTS_UNMET
    http_status: 422
    applies_to: "POST /auditions/{auditionId}/schedule"

  - priority: 62
    category: business_referential
    check: "Uniqueness: one PanelScore per (audition_id, panelist_id, revision_round); one SectionQuota per (ensemble_id, instrument); one TuitionAccount per (member_id, season_id); one EventParticipation per (event_id, member_id); one non-terminal Audition per (member_id, season_id); at most one Placement per (audition_id, ensemble_id) in a non-terminal status."
    error_id: "ERR_DUPLICATE_PANEL_SCORE | ERR_DUPLICATE_SECTION_QUOTA | ERR_DUPLICATE_TUITION_ACCOUNT | ERR_DUPLICATE_PARTICIPATION | ERR_DUPLICATE_AUDITION | ERR_DUPLICATE_PLACEMENT (one per tuple, same priority)"
    http_status: 409
    applies_to: "POST /auditions/{auditionId}/panel-scores, POST /section-quotas, POST /auditions, POST /event-participations, POST /placements"

  - priority: 63
    category: business_referential
    check: "POST /placements: the ensemble's tier must equal the audition's tier_recommendation, or the tier_recommendation must be strictly above the ensemble's tier (a musician may be offered a lower tier, never a higher one)."
    error_id: ERR_TIER_ABOVE_RECOMMENDATION
    http_status: 422
    applies_to: "POST /placements"

  - priority: 64
    category: business_referential
    check: "POST /placements: the target Ensemble must own a SectionQuota whose instrument equals the member's primary_instrument."
    error_id: ERR_NO_SECTION_FOR_INSTRUMENT
    http_status: 422
    applies_to: "POST /placements"

  - priority: 65
    category: business_constraint
    check: "POST /section-quotas/{quotaId}/rotate-chairs: rotation_policy == ROTATING and filled_count >= 2. A FIXED section, or a section holding fewer than two ACTIVE seats, cannot rotate."
    error_id: ERR_ROTATION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /section-quotas/{quotaId}/rotate-chairs"

  - priority: 66
    category: business_constraint
    check: "POST /auditions/{auditionId}/schedule: the slot's booked_count < capacity (slot status must be OPEN)."
    error_id: ERR_AUDITION_SLOT_FULL
    http_status: 409
    applies_to: "POST /auditions/{auditionId}/schedule"

  # ---------------- 70-72 interval overlap on a shared resource -------------
  - priority: 70
    category: business_constraint
    check: "POST /audition-slots: no other AuditionSlot in the same room_code may satisfy calculations.room_slot_overlap (15-minute buffer on both sides, strict comparison, so a gap of exactly 15 minutes is legal)."
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /audition-slots"

  - priority: 71
    category: business_constraint
    check: "POST /event-participations: the member may not already participate in another EnsembleEvent whose [start_at, end_at) half-open interval overlaps this event's. Back-to-back events sharing an instant do NOT conflict (no buffer on a member's own calendar)."
    error_id: ERR_MEMBER_EVENT_CONFLICT
    http_status: 409
    applies_to: "POST /event-participations"

  - priority: 72
    category: business_constraint
    check: "POST /audition-slots: every id in panelist_ids has available_for_panels == true and no panelist appears on another slot whose buffered interval overlaps this one."
    error_id: ERR_PANELIST_UNAVAILABLE
    http_status: 409
    applies_to: "POST /audition-slots"

  # ---------------- 80-84 fiscal --------------------------------------------
  - priority: 80
    category: business_fiscal
    check: "POST /tuition-accounts/{accountId}/aid-request: 0 < aid_requested_cents <= assessed_cents. Ranked BELOW the aid state band at 22 on purpose."
    error_id: ERR_AID_REQUEST_EXCEEDS_ASSESSMENT
    http_status: 422
    applies_to: "POST /tuition-accounts/{accountId}/aid-request"

  - priority: 81
    category: business_fiscal
    check: "POST /tuition-accounts/{accountId}/aid-review: Season.aid_budget_cents > 0; a season with no aid pool cannot open reviews."
    error_id: ERR_NO_AID_BUDGET
    http_status: 422
    applies_to: "POST /tuition-accounts/{accountId}/aid-review"

  - priority: 82
    category: business_fiscal
    check: "POST /tuition-accounts/{accountId}/payments: amount_cents >= 1 and amount_cents <= balance_cents. Overpayment is refused rather than credited."
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /tuition-accounts/{accountId}/payments"

  - priority: 83
    category: business_fiscal
    check: "POST /ensemble-events/{eventId}/programming: guest_artist_fee_cents <= GUEST_ARTIST_FEE_CAP_CENTS (500000) and guest_artist_name is present whenever guest_artist_fee_cents > 0."
    error_id: ERR_GUEST_ARTIST_FEE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /ensemble-events/{eventId}/programming"

  - priority: 84
    category: business_fiscal
    check: "POST /event-participations/{participationId}/tour-requirements: tour_status may only reach READY when fundraising_shortfall_cents == 0 and, when event.chaperone_required, chaperone_confirmed is true."
    error_id: ERR_TOUR_REQUIREMENTS_UNMET
    http_status: 422
    applies_to: "POST /event-participations/{participationId}/tour-requirements"

  # ---------------- 90-92 capacity / quota ----------------------------------
  - priority: 90
    category: business_constraint
    check: "POST /placements with offer_kind == OFFER: for the member's section, filled_count + count(OFFERED placements for that section) < max_count, and for the ensemble, seated_count + offered_count < max_total_size. A WAITLIST row is exempt from both."
    error_id: ERR_SECTION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /placements"

  - priority: 91
    category: business_constraint
    check: "POST /placements/{placementId}/accept: the section still has filled_count < max_count at acceptance time; an offer whose section filled up while the offer sat open is refused."
    error_id: ERR_SECTION_FULL_AT_ACCEPTANCE
    http_status: 409
    applies_to: "POST /placements/{placementId}/accept"

  - priority: 92
    category: business_constraint
    check: "POST /event-participations: the member holds an ACTIVE SeatAssignment in a SectionQuota of the event's ensemble; non-members of the ensemble cannot be added to its calendar."
    error_id: ERR_MEMBER_NOT_IN_ENSEMBLE
    http_status: 422
    applies_to: "POST /event-participations"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# Reverse-reachability convention: every FK declared in §1.1 is discoverable
# through the child's filtered list endpoint (`GET /<children>` carrying the FK
# field as an optional query input and returning `<Child>[]`). Cascade-created
# rows - SeatAssignment and TuitionAccount, which no client ever POSTs - are
# reachable only that way.

endpoints:
  # ------------------------- test-driving surface --------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock, which every deadline, window and expiry
      rule reads. Before the first call the logical clock reads exactly
      2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["No entity is mutated; subsequent requests evaluate offer expiry, tuition due dates, attendance windows and excuse windows against the new instant."]

  # ------------------------------- Season ---------------------------------
  - method: POST
    path: "/seasons"
    description: "Creates a season in PLANNING."
    roles: [ArtisticDirector]
    code: 201
    input: [name, year_label, audition_window_start, audition_window_end, tuition_base_cents, tuition_due_at, aid_budget_cents]
    output: Season
    side_effects: ["status = PLANNING", "aid_committed_cents = 0 and aid_available_cents = aid_budget_cents", "ensemble_count = seated_ensemble_count = 0", "version = 1"]

  - method: GET
    path: "/seasons/{seasonId}"
    description: "Reads one season with its derived aid and ensemble counters."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: GET
    path: "/seasons"
    description: "Lists seasons, newest created_at first."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Season[]
    side_effects: []

  - method: POST
    path: "/seasons/{seasonId}/advance-status"
    description: "Advances the season one step along PLANNING -> AUDITIONS_OPEN -> PLACEMENT -> IN_SEASON -> CLOSED."
    roles: [ArtisticDirector]
    code: 200
    input: [to_status]
    output: Season
    side_effects: ["On CLOSED: hop 1 sets every Ensemble of the season to roster_state CLOSED; hop 2 graduates matching ENROLLED members; hop 3 moves opted-in GRADUATED members to ALUMNI", "increments Season.version"]

  - method: POST
    path: "/seasons/{seasonId}/offer-expiry-sweep"
    description: "Ops-run checkpoint: expires every OFFERED placement of the season whose offer_expires_at is at or before the logical clock, then promotes the waitlist head of each freed section."
    roles: [RegistrarStaff]
    code: 200
    input: []
    output: { expired_count: integer, promoted_count: integer }
    side_effects: ["OFFERED -> EXPIRED per placement", "calculations.waitlist_promotion runs per freed section, moving the head WAITLISTED row to OFFERED with a fresh 72h offer_expires_at", "increments Ensemble.version once per affected ensemble"]

  - method: POST
    path: "/seasons/{seasonId}/aid-award-run"
    description: "Executes calculations.aid_award_waterfall over every UNDER_REVIEW account of the season."
    roles: [FinanceOfficer]
    code: 200
    input: [expected_season_version]
    output: { approved_count: integer, denied_count: integer, aid_committed_cents: integer, aid_available_cents: integer }
    side_effects: ["Per account: aid_status -> APPROVED with aid_awarded_cents, or -> DENIED with aid_denial_reason", "Season.aid_committed_cents / aid_available_cents updated so their sum stays equal to aid_budget_cents", "each funded account's balance_cents recomputed, which may flip billing_status and the member's standing_status", "increments Season.version"]

  # ------------------------------ Ensemble --------------------------------
  - method: POST
    path: "/ensembles"
    description: "Creates a skill-tiered orchestra inside a season."
    roles: [ArtisticDirector]
    code: 201
    input: [season_id, name, tier, min_total_size, max_total_size, rehearsal_weekday]
    output: Ensemble
    side_effects: ["roster_state = FORMING", "increments Season.ensemble_count and Season.version"]

  - method: GET
    path: "/ensembles/{ensembleId}"
    description: "Reads one ensemble with seated_count and offered_count."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: Ensemble
    side_effects: []

  - method: GET
    path: "/ensembles"
    description: "Lists ensembles; filter by season_id for the reverse FK walk."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["season_id?", "roster_state?", "tier?", "limit?", "offset?"]
    output: Ensemble[]
    side_effects: []

  # ---------------------------- SectionQuota ------------------------------
  - method: POST
    path: "/section-quotas"
    description: "Declares an instrumentation section and its balance targets on an ensemble."
    roles: [ArtisticDirector]
    code: 201
    input: [ensemble_id, instrument, min_count, target_count, max_count, "principal_required?", "rotation_policy?"]
    output: SectionQuota
    side_effects: ["balance_state = UNDERFILLED when min_count > 0, else BALANCED", "filled_count = 0, rotation_cycle_index = 0", "increments Ensemble.version"]

  - method: GET
    path: "/section-quotas/{quotaId}"
    description: "Reads one section quota with filled_count and balance_state."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: SectionQuota
    side_effects: []

  - method: GET
    path: "/section-quotas"
    description: "Lists section quotas; filter by ensemble_id for the reverse FK walk."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["ensemble_id?", "instrument?", "balance_state?", "limit?", "offset?"]
    output: SectionQuota[]
    side_effects: []

  - method: POST
    path: "/section-quotas/{quotaId}/rotate-chairs"
    description: "Runs one chair-rotation cycle over the section's ACTIVE seats per calculations.chair_rotation. OCC-guarded on the owning Ensemble."
    roles: [ArtisticDirector]
    code: 200
    input: [expected_ensemble_version]
    output: SectionQuota
    side_effects: ["every ACTIVE SeatAssignment -> ROTATED_OUT with an ACTIVE successor carrying predecessor_assignment_id and the rotated chair_number", "increments SectionQuota.rotation_cycle_index", "filled_count and balance_state are conserved", "increments Ensemble.version"]

  # ------------------------------- Member ---------------------------------
  - method: POST
    path: "/members"
    description: "Registers a musician as a PROSPECT with CLEAR standing."
    roles: [RegistrarStaff]
    code: 201
    input: [legal_name, primary_instrument, grade_level, graduation_year, household_income_band, "years_in_org?", "sibling_enrolled?", "alumni_engagement_opt_in?"]
    output: Member
    side_effects: ["instrument_class computed from primary_instrument", "enrollment_status = PROSPECT, standing_status = CLEAR", "all attendance counters and probation_baseline_count = 0"]

  - method: GET
    path: "/members/{memberId}"
    description: "Reads one musician. Panelists are excluded from this endpoint: reading legal_name would break blind evaluation."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Guardian]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "Lists musicians. Excluded from the Panelist role for the same blind-panel reason."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Guardian]
    code: 200
    input: ["enrollment_status?", "standing_status?", "primary_instrument?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{memberId}/status-transition"
    description: "Drives one of the member's two independent state dimensions (dimension = ENROLLMENT or STANDING)."
    roles: [RegistrarStaff]
    code: 200
    input: [dimension, to_status]
    output: Member
    side_effects: ["ENROLLMENT to GRADUATED or WITHDRAWN vacates every ACTIVE seat with the full vacate cascade and withdraws open placements", "STANDING to CLEAR pins probation_baseline_count to the current effective_unexcused_count", "increments Member.version"]

  # ------------------------------ Panelist --------------------------------
  - method: POST
    path: "/panelists"
    description: "Registers an adjudicator, including the members they privately teach."
    roles: [ArtisticDirector]
    code: 201
    input: [display_name, instrument_expertise, "panel_role?", "conflict_member_ids?", "available_for_panels?"]
    output: Panelist
    side_effects: []

  - method: GET
    path: "/panelists/{panelistId}"
    description: "Reads one adjudicator."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: Panelist
    side_effects: []

  - method: GET
    path: "/panelists"
    description: "Lists adjudicators."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["instrument_expertise?", "available_for_panels?", "limit?", "offset?"]
    output: Panelist[]
    side_effects: []

  # ---------------------------- AuditionSlot ------------------------------
  - method: POST
    path: "/audition-slots"
    description: "Opens a blind-panel audition slot in a room, inside the season's audition window, with a buffered room-occupancy check."
    roles: [RegistrarStaff]
    code: 201
    input: [season_id, room_code, start_at, end_at, panelist_ids, instrument_focus, "required_excerpt_codes?", "quorum_required?", "capacity?"]
    output: AuditionSlot
    side_effects: ["status = OPEN, booked_count = 0", "runs calculations.room_slot_overlap against every other slot in the same room_code"]

  - method: GET
    path: "/audition-slots/{slotId}"
    description: "Reads one slot with booked_count and status."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: AuditionSlot
    side_effects: []

  - method: GET
    path: "/audition-slots"
    description: "Lists slots; filter by season_id for the reverse FK walk."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["season_id?", "room_code?", "instrument_focus?", "status?", "limit?", "offset?"]
    output: AuditionSlot[]
    side_effects: []

  # ------------------------------ Audition --------------------------------
  - method: POST
    path: "/auditions"
    description: "Registers an audition request with declared repertoire and prepared excerpts. Guardian acts as the member."
    roles: [Guardian, RegistrarStaff]
    code: 201
    input: [member_id, season_id, declared_program, excerpt_ids, "scale_attested?"]
    output: Audition
    side_effects: ["status = REQUESTED, revision_round = 0, slot_id = null", "blind_code generated from primary_instrument plus a per-instrument sequence"]

  - method: GET
    path: "/auditions/{auditionId}"
    description: "Reads one audition, including both composite variants and the tier recommendation."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: Audition
    side_effects: []

  - method: GET
    path: "/auditions"
    description: "Lists auditions; filter by member_id, season_id or slot_id for the reverse FK walk."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["member_id?", "season_id?", "slot_id?", "status?", "limit?", "offset?"]
    output: Audition[]
    side_effects: []

  - method: POST
    path: "/auditions/{auditionId}/schedule"
    description: "Books the audition into a slot, enforcing repertoire coverage, instrument match, window and slot capacity. Also used to re-book a REVISION_REQUESTED audition."
    roles: [RegistrarStaff]
    code: 200
    input: [slot_id]
    output: Audition
    side_effects: ["status REQUESTED|REVISION_REQUESTED -> SCHEDULED and slot_id set", "increments the new slot's booked_count and may flip its status to FULL", "on a re-book, decrements the previous slot's booked_count and may flip it back to OPEN"]

  - method: POST
    path: "/auditions/{auditionId}/panel-scores"
    description: "Submits one blind rubric sheet. The panelist sees blind_code only."
    roles: [Panelist]
    code: 201
    input: [panelist_id, tone_score, rhythm_score, intonation_score, sight_reading_score]
    output: PanelScore
    side_effects: ["weighted_total computed via calculations.panelist_weighted_total", "revision_round snapshotted from the audition", "increments Audition.submitted_score_count", "when submitted_score_count reaches the slot's quorum_required the audition advances SCHEDULED -> SCORED and composite_provisional_score is stored"]

  - method: POST
    path: "/auditions/{auditionId}/adjudicate"
    description: "Closes a SCORED audition: computes the FINAL trimmed composite and the tier recommendation."
    roles: [ArtisticDirector]
    code: 200
    input: []
    output: Audition
    side_effects: ["composite_final_score via the FINAL variant of calculations.audition_composite", "tier_recommendation via calculations.tier_recommendation", "status SCORED -> ADJUDICATED"]

  - method: POST
    path: "/auditions/{auditionId}/request-revision"
    description: "Sends a SCORED audition back for a re-audition round, releasing its slot booking."
    roles: [ArtisticDirector]
    code: 200
    input: []
    output: Audition
    side_effects: ["status SCORED -> REVISION_REQUESTED", "increments revision_round so the existing PanelScore rows fall out of the composite input set", "clears composite_provisional_score to null", "decrements the previous slot's booked_count and may flip it back to OPEN"]

  # ----------------------------- PanelScore -------------------------------
  - method: GET
    path: "/panel-scores/{scoreId}"
    description: "Reads one immutable rubric sheet."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: PanelScore
    side_effects: []

  - method: GET
    path: "/panel-scores"
    description: "Lists rubric sheets; filter by audition_id or panelist_id for the reverse FK walk."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["audition_id?", "panelist_id?", "revision_round?", "limit?", "offset?"]
    output: PanelScore[]
    side_effects: []

  # ------------------------------ Placement -------------------------------
  - method: POST
    path: "/placements"
    description: "Offers or waitlists an adjudicated musician into an ensemble. The creation fork: offer_kind decides the initial state and which side effects fire. OCC-guarded on the Ensemble."
    roles: [ArtisticDirector]
    code: 201
    input: [audition_id, ensemble_id, offer_kind, expected_ensemble_version, "offer_expires_at?"]
    output: Placement
    side_effects: ["OFFER: status = OFFERED, waitlist_rank = null, increments Ensemble.offered_count, consumes section capacity", "WAITLIST: status = WAITLISTED, waitlist_rank assigned by calculations.waitlist_promotion, offered_count untouched, no capacity consumed", "member_id copied from the audition", "increments Ensemble.version"]

  - method: GET
    path: "/placements/{placementId}"
    description: "Reads one placement with its waitlist rank and loan flags."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/placements"
    description: "Lists placements; filter by audition_id, member_id or ensemble_id for the reverse FK walk."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["audition_id?", "member_id?", "ensemble_id?", "status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: POST
    path: "/placements/{placementId}/accept"
    description: "Accepts an open offer. Seats the player, optionally takes an organization instrument on loan, and opens the tuition account with a PRELIMINARY assessment."
    roles: [Guardian]
    code: 200
    input: ["instrument_loan_requested?"]
    output: Placement
    side_effects: ["status OFFERED -> ACCEPTED, accepted_at stamped from the logical clock", "Member.enrollment_status PROSPECT -> ENROLLED", "creates the SeatAssignment (chair_number and is_principal from calculations.chair_ranking)", "hop 1 increments SectionQuota.filled_count; hop 2 may flip balance_state to FULL; hop 3 may flip Ensemble.roster_state to SEATED; hop 4 may flip Season.status PLACEMENT -> IN_SEASON", "creates the TuitionAccount with the PRELIMINARY tuition variant and the loan fee", "increments Ensemble.version"]

  - method: POST
    path: "/placements/{placementId}/decline"
    description: "Declines an open offer, or withdraws a waitlisted claim."
    roles: [Guardian]
    code: 200
    input: []
    output: Placement
    side_effects: ["OFFERED -> DECLINED: decrements Ensemble.offered_count and runs calculations.waitlist_promotion on the freed section", "WAITLISTED -> WITHDRAWN: no promotion, the remaining queue is re-ranked", "increments Ensemble.version"]

  # ---------------------------- SeatAssignment ----------------------------
  - method: GET
    path: "/seat-assignments/{seatId}"
    description: "Reads one chair, including its rotation generation and predecessor link."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: SeatAssignment
    side_effects: []

  - method: GET
    path: "/seat-assignments"
    description: "Lists chairs; the only discovery channel for cascade-created seats. Filter by section_quota_id, placement_id, member_id or predecessor_assignment_id."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["section_quota_id?", "placement_id?", "member_id?", "predecessor_assignment_id?", "status?", "limit?", "offset?"]
    output: SeatAssignment[]
    side_effects: []

  - method: POST
    path: "/seat-assignments/{seatId}/vacate"
    description: "Releases a chair mid-season, running the full vacate cascade."
    roles: [ArtisticDirector]
    code: 200
    input: []
    output: SeatAssignment
    side_effects: ["status ACTIVE -> VACATED", "owning Placement ACCEPTED -> RELEASED", "decrements SectionQuota.filled_count, re-runs calculations.chair_ranking so the remaining chairs stay contiguous from 1, may demote balance_state, may flip Ensemble.roster_state SEATED -> FORMING", "runs calculations.waitlist_promotion on the freed section", "increments Ensemble.version"]

  # ---------------------------- TuitionAccount ----------------------------
  - method: GET
    path: "/tuition-accounts/{accountId}"
    description: "Reads one tuition account with both assessment components, the aid trail and the balance."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: TuitionAccount
    side_effects: []

  - method: GET
    path: "/tuition-accounts"
    description: "Lists tuition accounts; the only discovery channel for cascade-created accounts. Filter by member_id or season_id."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["member_id?", "season_id?", "billing_status?", "aid_status?", "limit?", "offset?"]
    output: TuitionAccount[]
    side_effects: []

  - method: POST
    path: "/tuition-accounts/{accountId}/finalize-assessment"
    description: "Switches the account from the PRELIMINARY to the FINAL tuition variant, applying the two independently rounded discount components and the income-band aid cap."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: TuitionAccount
    side_effects: ["assessment_variant PRELIMINARY -> FINAL", "sibling_discount_cents and loyalty_credit_cents rounded and subtracted in the pinned order", "aid_effective_cents = min(aid_awarded_cents, income-band cap) with the surplus returned to Season.aid_available_cents", "balance_cents recomputed, which may move billing_status to CURRENT, DELINQUENT or PAID_IN_FULL and the member's standing_status with it"]

  - method: POST
    path: "/tuition-accounts/{accountId}/aid-request"
    description: "Family applies for financial aid, or re-applies after a denial or rescission."
    roles: [Guardian]
    code: 200
    input: [aid_requested_cents]
    output: TuitionAccount
    side_effects: ["aid_status NONE|DENIED|RESCINDED -> REQUESTED", "clears aid_denial_reason and, from RESCINDED, the two officer user-id fields"]

  - method: POST
    path: "/tuition-accounts/{accountId}/aid-review"
    description: "Finance officer opens the request for funding and records the need score."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: TuitionAccount
    side_effects: ["aid_status REQUESTED -> UNDER_REVIEW", "aid_need_score computed via calculations.aid_need_score", "aid_reviewed_by_user_id recorded from X-User-ID - the segregation-of-duties anchor for the award run"]

  - method: POST
    path: "/tuition-accounts/{accountId}/aid-rescind"
    description: "Withdraws an approved award, returning the money to the season pool."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: TuitionAccount
    side_effects: ["aid_status APPROVED -> RESCINDED, aid_awarded_cents and aid_effective_cents set to 0", "Season.aid_committed_cents decreases and aid_available_cents increases by the same amount, conserving their sum", "balance_cents rises, which may flip billing_status to DELINQUENT and cascade the member to FINANCIAL_HOLD", "increments Season.version"]

  - method: POST
    path: "/tuition-accounts/{accountId}/payments"
    description: "Records a family payment against the account."
    roles: [Guardian]
    code: 201
    input: [amount_cents]
    output: TuitionAccount
    side_effects: ["increments payments_total_cents and lowers balance_cents", "billing_status may move to PAID_IN_FULL, or DELINQUENT -> CURRENT", "re-evaluates the member's standing_status, possibly releasing FINANCIAL_HOLD to CLEAR or back to ATTENDANCE_PROBATION"]

  # ---------------------------- EnsembleEvent -----------------------------
  - method: POST
    path: "/ensemble-events"
    description: "Puts a rehearsal, concert, tour performance or festival on an ensemble's calendar."
    roles: [ArtisticDirector]
    code: 201
    input: [ensemble_id, kind, start_at, end_at, venue_code, "is_dress_rehearsal?", "dress_rehearsal_required?", "eligibility_window_start?", "soloist_selection_mode?", "tour_cost_share_cents?", "chaperone_required?"]
    output: EnsembleEvent
    side_effects: ["programming_state = DRAFT", "participation_count = 0"]

  - method: GET
    path: "/ensemble-events/{eventId}"
    description: "Reads one calendar event with its programming state and soloist."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: EnsembleEvent
    side_effects: []

  - method: GET
    path: "/ensemble-events"
    description: "Lists calendar events; filter by ensemble_id or soloist_member_id for the reverse FK walk."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["ensemble_id?", "soloist_member_id?", "kind?", "programming_state?", "limit?", "offset?"]
    output: EnsembleEvent[]
    side_effects: []

  - method: POST
    path: "/ensemble-events/{eventId}/programming"
    description: "Programs a performance: selects the soloist (server-side under AUTO_SELECT, caller-supplied under MANUAL) and engages any guest artist. Re-runnable after a SOLOIST_VACANT."
    roles: [ArtisticDirector]
    code: 200
    input: ["soloist_member_id?", "guest_artist_name?", "guest_artist_fee_cents?"]
    output: EnsembleEvent
    side_effects: ["programming_state DRAFT|SOLOIST_VACANT -> PROGRAMMED", "soloist_member_id set from calculations.soloist_selection under AUTO_SELECT, from the body under MANUAL, left null under NONE", "guest_artist_name and guest_artist_fee_cents recorded under the fee cap"]

  # -------------------------- EventParticipation --------------------------
  - method: POST
    path: "/event-participations"
    description: "Rosters a seated member onto one calendar event, rejecting calendar collisions on the member's own timeline."
    roles: [RegistrarStaff]
    code: 201
    input: [event_id, member_id]
    output: EventParticipation
    side_effects: ["attendance_status = NOT_RECORDED, performance_eligibility = UNREVIEWED", "tour_status = PENDING for TOUR_PERFORMANCE and FESTIVAL, NOT_APPLICABLE otherwise", "runs calculations.member_event_overlap", "increments EnsembleEvent.participation_count"]

  - method: GET
    path: "/event-participations/{participationId}"
    description: "Reads one participation row across all three of its state dimensions."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: []
    output: EventParticipation
    side_effects: []

  - method: GET
    path: "/event-participations"
    description: "Lists participation rows; filter by event_id or member_id for the reverse FK walk."
    roles: [ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian]
    code: 200
    input: ["event_id?", "member_id?", "attendance_status?", "performance_eligibility?", "tour_status?", "limit?", "offset?"]
    output: EventParticipation[]
    side_effects: []

  - method: POST
    path: "/event-participations/{participationId}/attendance"
    description: "Records attendance once the event has started."
    roles: [RegistrarStaff]
    code: 200
    input: [attendance_status]
    output: EventParticipation
    side_effects: ["attendance_status NOT_RECORDED -> PRESENT | TARDY | ABSENCE_UNVERIFIED | UNEXCUSED_ABSENT", "recomputes Member.tardy_count, unexcused_absence_count and effective_unexcused_count", "may fire the probation cascade: Member -> ATTENDANCE_PROBATION, future performance participations -> INELIGIBLE, affected events -> SOLOIST_VACANT"]

  - method: POST
    path: "/event-participations/{participationId}/excuse-request"
    description: "Family submits an excuse for an unverified absence, inside the 48-hour window after the event ends."
    roles: [Guardian]
    code: 200
    input: [excuse_reason_code, "excuse_documentation_ref?"]
    output: EventParticipation
    side_effects: ["attendance_status ABSENCE_UNVERIFIED -> EXCUSE_PENDING", "records excuse_reason_code and excuse_documentation_ref"]

  - method: POST
    path: "/event-participations/{participationId}/excuse-decision"
    description: "Registrar approves or denies a pending excuse. Segregated from whoever recorded the absence."
    roles: [RegistrarStaff]
    code: 200
    input: [decision]
    output: EventParticipation
    side_effects: ["APPROVED: EXCUSE_PENDING -> EXCUSED_ABSENT, counters untouched", "DENIED: EXCUSE_PENDING -> UNEXCUSED_ABSENT and the 4-hop probation cascade fires (member counters -> ATTENDANCE_PROBATION -> future performance participations INELIGIBLE and tour_status READY -> PENDING -> affected events PROGRAMMED -> SOLOIST_VACANT)", "records excuse_decided_by_user_id"]

  - method: POST
    path: "/event-participations/{participationId}/eligibility-review"
    description: "Computes the weighted rehearsal attendance index for a performance and grants or refuses performance eligibility."
    roles: [ArtisticDirector]
    code: 200
    input: []
    output: EventParticipation
    side_effects: ["attendance_index stored from calculations.attendance_eligibility_index", "performance_eligibility -> ELIGIBLE or INELIGIBLE with ineligibility_reason", "an ELIGIBLE result makes the member a soloist candidate; an INELIGIBLE result on a tour drops tour_status READY -> PENDING"]

  - method: POST
    path: "/event-participations/{participationId}/tour-requirements"
    description: "Family credits fundraising and registers a chaperone toward tour readiness."
    roles: [Guardian]
    code: 200
    input: ["fundraising_amount_cents?", "chaperone_name?", "chaperone_background_check_ref?"]
    output: EventParticipation
    side_effects: ["increments fundraising_credited_cents and recomputes fundraising_shortfall_cents", "sets chaperone_name / chaperone_background_check_ref and derives chaperone_confirmed", "tour_status PENDING -> READY once the shortfall is zero, the chaperone requirement is satisfied and performance_eligibility == ELIGIBLE"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  # ---- protocol / auth ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role absent, or X-User-Role is not one of ArtisticDirector, RegistrarStaff, FinanceOfficer, Panelist, Guardian."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's §1.5 roles - e.g. a Panelist calling GET /members, or a Guardian calling POST /placements."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acted on someone else's resource: Guardian X-User-ID != the target's member_id, or Panelist X-User-ID != the submitted panelist_id."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, undeclared enum value, out-of-range integer, unparseable datetime, end_at <= start_at, array cardinality violated, or quorum_required > len(panelist_ids)."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset < 0 on a list endpoint."

  # ---- existence ----
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "seasonId in the path, or season_id in the body, matches no Season."
  - id: ERR_ENSEMBLE_NOT_FOUND
    http: 404
    condition: "ensembleId in the path, or ensemble_id in the body, matches no Ensemble."
  - id: ERR_SECTION_QUOTA_NOT_FOUND
    http: 404
    condition: "quotaId in the path matches no SectionQuota."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "memberId in the path, or member_id / soloist_member_id in the body, matches no Member."
  - id: ERR_PANELIST_NOT_FOUND
    http: 404
    condition: "panelistId in the path, or panelist_id / an element of panelist_ids in the body, matches no Panelist."
  - id: ERR_AUDITION_SLOT_NOT_FOUND
    http: 404
    condition: "slotId in the path, or slot_id in the body, matches no AuditionSlot."
  - id: ERR_AUDITION_NOT_FOUND
    http: 404
    condition: "auditionId in the path, or audition_id in the body, matches no Audition."
  - id: ERR_PANEL_SCORE_NOT_FOUND
    http: 404
    condition: "scoreId in the path matches no PanelScore."
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placementId in the path matches no Placement."
  - id: ERR_SEAT_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "seatId in the path matches no SeatAssignment."
  - id: ERR_TUITION_ACCOUNT_NOT_FOUND
    http: 404
    condition: "accountId in the path matches no TuitionAccount."
  - id: ERR_ENSEMBLE_EVENT_NOT_FOUND
    http: 404
    condition: "eventId in the path, or event_id in the body, matches no EnsembleEvent."
  - id: ERR_PARTICIPATION_NOT_FOUND
    http: 404
    condition: "participationId in the path matches no EventParticipation."

  # ---- state ----
  - id: ERR_INVALID_SEASON_TRANSITION
    http: 409
    condition: "to_status is not the declared successor of the season's current status (skip-ahead or reversal)."
  - id: ERR_INVALID_STATE_FOR_OPERATION
    http: 409
    condition: "The target row's own state does not admit the requested action - scoring an unscheduled audition, adjudicating twice, accepting a DECLINED offer, vacating a ROTATED_OUT seat, deciding an excuse that was never requested, recording attendance twice."
  - id: ERR_AID_REQUEST_NOT_ALLOWED_IN_STATE
    http: 409
    condition: "aid-request on an account whose aid_status is REQUESTED, UNDER_REVIEW or APPROVED; aid-review on an account not REQUESTED; aid-rescind on an account not APPROVED."
  - id: ERR_INVALID_MEMBER_TRANSITION
    http: 409
    condition: "(dimension, to_status) is not a declared transition out of the member's current value on that dimension, including ALUMNI without alumni_engagement_opt_in."
  - id: ERR_MAX_REVISION_ROUNDS_REACHED
    http: 409
    condition: "request-revision when revision_round is already at MAX_REVISION_ROUNDS (2)."
  - id: ERR_EVENT_NOT_PROGRAMMABLE
    http: 409
    condition: "programming on a REHEARSAL, or on an event already in programming_state PROGRAMMED."
  - id: ERR_ASSESSMENT_ALREADY_FINAL
    http: 409
    condition: "finalize-assessment on an account whose assessment_variant is already FINAL, or whose placement is not ACCEPTED."

  # ---- concurrency ----
  - id: ERR_STALE_ENSEMBLE_VERSION
    http: 412
    condition: "expected_ensemble_version does not equal the current Ensemble.version on POST /placements or POST /section-quotas/{quotaId}/rotate-chairs."
  - id: ERR_STALE_SEASON_VERSION
    http: 412
    condition: "expected_season_version does not equal the current Season.version on POST /seasons/{seasonId}/aid-award-run."

  # ---- cross-entity state ----
  - id: ERR_SEASON_NOT_ACCEPTING_AUDITIONS
    http: 409
    condition: "Slot creation or audition scheduling attempted while Season.status != AUDITIONS_OPEN, or audition registration while the season is past AUDITIONS_OPEN."
  - id: ERR_ENSEMBLE_NOT_ACCEPTING_PLACEMENTS
    http: 409
    condition: "POST /placements while Season.status != PLACEMENT or Ensemble.roster_state != FORMING."
  - id: ERR_AUDITION_NOT_ADJUDICATED
    http: 409
    condition: "POST /placements referencing an audition that is not ADJUDICATED, or whose tier_recommendation is NOT_PLACED."
  - id: ERR_ENSEMBLE_NOT_SEATED
    http: 409
    condition: "rotate-chairs while the owning Ensemble.roster_state != SEATED."
  - id: ERR_EVENT_KIND_NOT_ELIGIBLE
    http: 409
    condition: "eligibility-review on a REHEARSAL, or tour-requirements on a REHEARSAL or CONCERT."
  - id: ERR_DELINQUENT_ACCOUNT_BLOCKS_CLOSE
    http: 409
    condition: "Graduating a member, clearing a member's standing, or closing a season while a TuitionAccount in scope is DELINQUENT."
  - id: ERR_SEASON_PRECONDITION_UNMET
    http: 409
    condition: "advance-status to AUDITIONS_OPEN with no ensemble or an ensemble lacking any SectionQuota; to PLACEMENT with a SCORED or REVISION_REQUESTED audition still open; to IN_SEASON with seated_ensemble_count < ensemble_count."

  # ---- safety / segregation of duties / blind panel ----
  - id: ERR_PANEL_CONFLICT_OF_INTEREST
    http: 403
    condition: "The submitting Panelist's conflict_member_ids contains the audition's member_id. Outranks the duplicate-score check."
  - id: ERR_PANELIST_NOT_ON_PANEL
    http: 403
    condition: "The submitting panelist_id is not in the audition's slot panelist_ids, or its instrument_expertise differs from the slot's instrument_focus."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The officer who reviewed an aid request tried to execute the award run that funds it, or the registrar who recorded an absence tried to decide its excuse."
  - id: ERR_SOLOIST_NOT_ELIGIBLE
    http: 422
    condition: "MANUAL programming named a soloist who is unseated, not CLEAR, or not ELIGIBLE on this event."
  - id: ERR_NO_ELIGIBLE_SOLOIST
    http: 422
    condition: "AUTO_SELECT programming found an empty candidate pool."

  # ---- temporal ----
  - id: ERR_SLOT_OUTSIDE_AUDITION_WINDOW
    http: 422
    condition: "A slot's start_at is before the season's audition_window_start or its end_at is after audition_window_end. Outranks the room-overlap check."
  - id: ERR_EVENT_NOT_STARTED
    http: 422
    condition: "Attendance recorded while the logical clock is strictly before event.start_at."
  - id: ERR_EXCUSE_WINDOW_CLOSED
    http: 422
    condition: "An excuse request submitted at or after event.end_at + EXCUSE_REQUEST_WINDOW_HOURS (48h)."

  # ---- referential / uniqueness ----
  - id: ERR_SLOT_INSTRUMENT_MISMATCH
    http: 422
    condition: "The slot's instrument_focus differs from the member's primary_instrument, or the slot belongs to another season."
  - id: ERR_REPERTOIRE_REQUIREMENTS_UNMET
    http: 422
    condition: "The audition's excerpt_ids miss at least one of the slot's required_excerpt_codes, or scale_attested is false while the slot requires excerpts."
  - id: ERR_DUPLICATE_PANEL_SCORE
    http: 409
    condition: "A PanelScore already exists for (audition_id, panelist_id, revision_round)."
  - id: ERR_DUPLICATE_SECTION_QUOTA
    http: 409
    condition: "A SectionQuota already exists for (ensemble_id, instrument)."
  - id: ERR_DUPLICATE_TUITION_ACCOUNT
    http: 409
    condition: "A TuitionAccount already exists for (member_id, season_id) when a second acceptance would open one."
  - id: ERR_DUPLICATE_PARTICIPATION
    http: 409
    condition: "An EventParticipation already exists for (event_id, member_id)."
  - id: ERR_DUPLICATE_AUDITION
    http: 409
    condition: "A non-terminal Audition already exists for (member_id, season_id)."
  - id: ERR_DUPLICATE_PLACEMENT
    http: 409
    condition: "A non-terminal Placement already exists for (audition_id, ensemble_id)."
  - id: ERR_TIER_ABOVE_RECOMMENDATION
    http: 422
    condition: "The target ensemble's tier is above the audition's tier_recommendation."
  - id: ERR_NO_SECTION_FOR_INSTRUMENT
    http: 422
    condition: "The target ensemble owns no SectionQuota for the member's primary_instrument."

  # ---- constraint / overlap ----
  - id: ERR_ROTATION_NOT_PERMITTED
    http: 422
    condition: "rotate-chairs on a FIXED section, or on a section with fewer than two ACTIVE seats."
  - id: ERR_AUDITION_SLOT_FULL
    http: 409
    condition: "The target slot's booked_count already equals its capacity."
  - id: ERR_ROOM_DOUBLE_BOOKED
    http: 409
    condition: "Another slot in the same room_code overlaps once the 15-minute turnover buffer is applied to both sides."
  - id: ERR_MEMBER_EVENT_CONFLICT
    http: 409
    condition: "The member already participates in an event whose half-open [start_at, end_at) interval overlaps this one. Exactly back-to-back events do not conflict."
  - id: ERR_PANELIST_UNAVAILABLE
    http: 409
    condition: "A requested panelist has available_for_panels == false, or is already seated on a buffered-overlapping slot."

  # ---- fiscal ----
  - id: ERR_AID_REQUEST_EXCEEDS_ASSESSMENT
    http: 422
    condition: "aid_requested_cents <= 0 or greater than the account's assessed_cents."
  - id: ERR_NO_AID_BUDGET
    http: 422
    condition: "aid-review on a season whose aid_budget_cents is 0."
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents < 1 or greater than the current balance_cents."
  - id: ERR_GUEST_ARTIST_FEE_CAP_EXCEEDED
    http: 422
    condition: "guest_artist_fee_cents above GUEST_ARTIST_FEE_CAP_CENTS (500000), or a fee supplied with no guest_artist_name."
  - id: ERR_TOUR_REQUIREMENTS_UNMET
    http: 422
    condition: "tour-requirements would leave a fundraising shortfall, or a required chaperone unconfirmed, or the participation not ELIGIBLE - so tour_status cannot reach READY."

  # ---- capacity / quota ----
  - id: ERR_SECTION_CAPACITY_EXCEEDED
    http: 409
    condition: "An OFFER would push the section's filled_count + open offers to max_count, or the ensemble's seated_count + offered_count to max_total_size."
  - id: ERR_SECTION_FULL_AT_ACCEPTANCE
    http: 409
    condition: "The section reached max_count while the offer sat open, so the acceptance cannot be seated."
  - id: ERR_MEMBER_NOT_IN_ENSEMBLE
    http: 422
    condition: "The member holds no ACTIVE SeatAssignment in any SectionQuota of the event's ensemble."

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
# Segregation of duties, three ways:
#   - the FinanceOfficer who reviewed an aid request cannot fund it;
#   - the RegistrarStaff who recorded an absence cannot decide its excuse;
#   - artistic judgement (ArtisticDirector), attendance bookkeeping
#     (RegistrarStaff) and money (FinanceOfficer) never overlap.

roles:
  - name: ArtisticDirector
    description: "Owns artistic judgement: seasons, ensembles, instrumentation, adjudication, placements, chairs, programming and performance eligibility. Never records attendance and never moves money."
    identity: opaque
    exclusive_operations:
      - "POST /seasons"
      - "POST /seasons/{seasonId}/advance-status"
      - "POST /ensembles"
      - "POST /section-quotas"
      - "POST /section-quotas/{quotaId}/rotate-chairs"
      - "POST /panelists"
      - "POST /auditions/{auditionId}/adjudicate"
      - "POST /auditions/{auditionId}/request-revision"
      - "POST /placements"
      - "POST /seat-assignments/{seatId}/vacate"
      - "POST /ensemble-events"
      - "POST /ensemble-events/{eventId}/programming"
      - "POST /event-participations/{participationId}/eligibility-review"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint, including GET /members and GET /members/{memberId}"

  - name: RegistrarStaff
    description: "Owns the audition calendar, membership records and attendance bookkeeping, plus the ops-run offer-expiry sweep. Never adjudicates and never moves money."
    identity: opaque
    exclusive_operations:
      - "POST /seasons/{seasonId}/offer-expiry-sweep"
      - "POST /members"
      - "POST /members/{memberId}/status-transition"
      - "POST /audition-slots"
      - "POST /auditions/{auditionId}/schedule"
      - "POST /event-participations"
      - "POST /event-participations/{participationId}/attendance"
      - "POST /event-participations/{participationId}/excuse-decision"
    shared_operations:
      - "POST /auditions (shared with Guardian; staff may register on a family's behalf)"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint, including GET /members and GET /members/{memberId}"

  - name: FinanceOfficer
    description: "Owns tuition finalization and the financial-aid workflow. Cannot create members, cannot adjudicate, and cannot fund a request they personally reviewed."
    identity: opaque
    exclusive_operations:
      - "POST /seasons/{seasonId}/aid-award-run"
      - "POST /tuition-accounts/{accountId}/finalize-assessment"
      - "POST /tuition-accounts/{accountId}/aid-review"
      - "POST /tuition-accounts/{accountId}/aid-rescind"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint, including GET /members and GET /members/{memberId}"

  - name: Panelist
    description: "Blind adjudicator. Submits rubric sheets against blind_code and is deliberately barred from the Member endpoints so legal_name never reaches the panel."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /auditions/{auditionId}/panel-scores"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint EXCEPT GET /members and GET /members/{memberId}"

  - name: Guardian
    description: "Acts as the musician's household. Registers auditions, accepts or declines offers, applies for aid, pays tuition, files excuses and satisfies tour requirements - always only for their own member id."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /placements/{placementId}/accept"
      - "POST /placements/{placementId}/decline"
      - "POST /tuition-accounts/{accountId}/aid-request"
      - "POST /tuition-accounts/{accountId}/payments"
      - "POST /event-participations/{participationId}/excuse-request"
      - "POST /event-participations/{participationId}/tour-requirements"
    shared_operations:
      - "POST /auditions (shared with RegistrarStaff)"
      - "POST /_clock/set_current_utc"
      - "every GET endpoint, including GET /members/{memberId}"
