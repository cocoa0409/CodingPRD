          - entities.GamesEdition.fields.final_impact_cents
        excluded_because:
          difficulty_instance: economic_impact_provisional_versus_final_divergence
          rationale: "That §1.8 instance runs both variants over the same edition and asserts the divergence literals, which is precisely the Variant Divergence claim."

