            - call: "POST /api/denial-cases/${den_id}/appeals"
              payload: { appeal_level: 1, argument_summary: "Filed after upheld peer-to-peer." }
              as: AppealsCoordinator
              captures: { app_id: $.data.id }
          assert:
            - "While the conference is SCHEDULED: error_id == ERR_DENIAL_NOT_FINAL with http 409"
            - "After UPHELD completion the denial returns to OPEN (DenialCase.${den_id}.status == OPEN) and the appeal succeeds: AppealCase.${app_id}.status == FILED"
            - "DenialCase.${den_id}.status == APPEAL_FILED after the successful filing"

  - rule_id: resource_temporal_overlap
    instances:
      - name: advisor_calendar_buffer_overlap
        grounds:
          - validations[priority=20]
          - entities.PeerToPeerConference.fields.scheduled_start_at
        distinguishing_aspect: |
          Interval semantics: minute-granularity conference intervals on the Physician advisor calendar with a mandatory 15-minute clearance buffer — a 14-minute gap is rejected while an exactly-15-minute gap succeeds; resource is the advisor, not the case.
        test_recipe:
          setup:
            - "Two Medicare cases, each with an authorization denied at 2026-08-02T12:00:00Z; advisor calendar already holds 2026-08-03T10:00-10:30 from case A"
