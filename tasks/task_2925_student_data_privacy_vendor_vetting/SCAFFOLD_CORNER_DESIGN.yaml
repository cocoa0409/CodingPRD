            - "VendorIncident.${inc_id}.vendor_id == ${v_id} and incident_type == UNAUTHORIZED_DISCLOSURE"
            - "VendorIncident.${inc_id}.detected_at == 2026-07-31T12:00:00.000Z and affected_student_count == 30 and max_data_tier == 3"
            - "VendorIncident.${inc_id}.severity == MODERATE and notification_due_at == 2026-08-02T12:00:00.000Z"
            - "VendorIncident.${inc_id}.response_status == REPORTED and notification_status == PENDING and reported_at == 2026-08-01T00:00:00.000Z"
            - "Vendor.${v_id}.open_incident_count == 1, risk_score == 8.00, privacy_posture == RESTRICTED"
            - "GET /telemetry-detections filtered by linked_incident_id ${inc_id} returns total_count 1"

      - name: reauthorization_action_endpoint_supersede_chain
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /catalog-entries/{entryId}/reauthorize]
        excluded_because:
          difficulty_instance: vendor_risk_live_vs_reauthorization_diverge
          rationale: "That §1.8 dual_variant_calc instance already drives the whole reauthorize action end to end — the predecessor becoming SUPERSEDED, the successor's inherited band and adjacent effective_from, the snapshotted published_review_score and both risk variants — so a separate endpoint-level instance would repeat it; validations[priority=15] (ERR_CATALOG_ENTRY_NOT_RENEWABLE) is covered in the errors section."

  - section: errors
    instances:

      - name: every_not_found_error_id_is_individually_triggerable
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_SUBPROCESSOR_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_TEACHER_NOT_FOUND]
          - errors[ERR_ANALYST_NOT_FOUND]
          - errors[ERR_REQUEST_NOT_FOUND]
          - errors[ERR_REVIEW_NOT_FOUND]
          - errors[ERR_COMMITMENT_NOT_FOUND]
          - errors[ERR_CATALOG_ENTRY_NOT_FOUND]
          - errors[ERR_DETECTION_NOT_FOUND]
          - errors[ERR_INCIDENT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: |
          Each entity family owns a DISTINCT 404 id: the same syntactically valid but unknown
          UUID must produce ERR_VENDOR_NOT_FOUND on /vendors, ERR_SUBPROCESSOR_NOT_FOUND on
          /subprocessors, and so on for all eleven families. An implementation with one
          generic 404 (or one that reuses the parent's id for a child lookup) fails on the
          very first divergent pair.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; the database is otherwise empty, so no id can accidentally resolve."
            - "The probe id 00000000-0000-4000-8000-000000000000 is a well-formed v4 UUID that was never issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
          trigger:
            - call: "GET /vendors/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_vendor: $.data.error_id }
            - call: "GET /subprocessors/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_sub: $.data.error_id }
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_app: $.data.error_id }
            - call: "GET /teachers/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_teacher: $.data.error_id }
            - call: "GET /privacy-analysts/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_analyst: $.data.error_id }
            - call: "GET /application-requests/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_request: $.data.error_id }
            - call: "GET /data-practice-reviews/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_review: $.data.error_id }
            - call: "GET /data-element-commitments/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_commitment: $.data.error_id }
            - call: "GET /catalog-entries/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_entry: $.data.error_id }
            - call: "GET /telemetry-detections/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_detection: $.data.error_id }
            - call: "GET /vendor-incidents/00000000-0000-4000-8000-000000000000"
              as: PrivacyOfficeAdmin
              captures: { err_incident: $.data.error_id }
          assert:
            - "every trigger call: status == 404 with the standard error envelope (error_id, message, non-null error_id)"
            - "${err_vendor} == ERR_VENDOR_NOT_FOUND"
            - "${err_sub} == ERR_SUBPROCESSOR_NOT_FOUND"
            - "${err_app} == ERR_APPLICATION_NOT_FOUND"
            - "${err_teacher} == ERR_TEACHER_NOT_FOUND"
            - "${err_analyst} == ERR_ANALYST_NOT_FOUND"
            - "${err_request} == ERR_REQUEST_NOT_FOUND"
