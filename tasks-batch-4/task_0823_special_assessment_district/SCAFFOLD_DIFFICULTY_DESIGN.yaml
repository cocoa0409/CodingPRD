              as: DistrictAdministrator
              captures: { bo2: "$.data.id" }
          trigger:
            - call: "POST /bonds/${bo2}/issue"
              payload: {}
              as: DistrictAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_BOND_TERM_OVERLAP"
            - "ImprovementBond.${bo2}.status == AUTHORIZED"

  # =========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: principal_conservation_under_payment_then_reversal
        grounds:
          - state_machines.Installment.DUE_to_PAID
          - entities.Parcel.fields.remaining_principal_cents
          - entities.AssessmentDistrict.fields.total_apportioned_principal_cents
        distinguishing_aspect: "Invariant: sum over parcels of remaining_principal_cents PLUS principal paid to date == district.total_apportioned_principal_cents (10000000). Paying P1's year-1 installment drops remaining to 5522973; reversing the payment restores it to 6000000, leaving the conserved MONEY quantity unchanged."
        test_recipe:
          setup:
            - "District DCP FORMED with P1(bu60)=6000000 and P2(bu40)=4000000; bond term 10 issued at 2026-07-01; clock at 2027-07-01 so year-1 installments are DUE."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DCP", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 10000000 }
              as: DistrictAdministrator
              captures: { dcp: "$.data.id" }
            - call: "POST /districts/${dcp}/parcels"
              payload: { apn: "CP-1", owner_name: "O1", benefit_units: 60 }
              as: DistrictAdministrator
              captures: { p1: "$.data.id" }
            - call: "POST /districts/${dcp}/parcels"
              payload: { apn: "CP-2", owner_name: "O2", benefit_units: 40 }
              as: DistrictAdministrator
              captures: { p2: "$.data.id" }
            - call: "POST /districts/${dcp}/open-protest"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dcp}/close-hearing"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dcp}/rolls"
              payload: { method: "BENEFIT_UNITS" }
              as: DistrictAdministrator
              captures: { rcp: "$.data.id" }
            - call: "POST /rolls/${rcp}/confirm"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /districts/${dcp}/bonds"
              payload: { issuance_date: "2026-07-01T00:00:00Z", coupon_rate_bps: 500, term_years: 10, reserve_fund_pct: 0.10 }
              as: DistrictAdministrator
              captures: { bcp: "$.data.id" }
            - call: "POST /bonds/${bcp}/issue"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /installments"
              payload: { parcel_id: "${p1}", installment_year: 1 }
              as: Auditor
              captures: { icp: "$.data[0].id" }
            - call: "POST /installments/${icp}/payments"
              payload: { amount_cents: 777027, payment_date: "2027-07-01T00:00:00Z", paid_by: "O1" }
              as: CountyTreasurer
              captures: { paycp: "$.data.id" }
          trigger:
            - call: "POST /payments/${paycp}/reverse"
              payload: {}
              as: CountyTreasurer
          assert:
            - "Parcel.${p1}.remaining_principal_cents == 6000000"
            - "Parcel.${p2}.remaining_principal_cents == 4000000"
            - "Parcel.${p1}.remaining_principal_cents + Parcel.${p2}.remaining_principal_cents == 10000000"

      - name: benefit_unit_conservation_under_subdivide_then_consolidate
        grounds:
          - state_machines.Parcel.ACTIVE_to_SUBDIVIDED
          - state_machines.Parcel.SUBDIVIDED_to_ACTIVE
          - calculations.subdivision_reallocation
        distinguishing_aspect: "Invariant: the sum of benefit_units over the district's non-terminal parcels is conserved (== 60). Subdividing P1(60) into children 40+20 keeps the sum 60; consolidating restores P1 to benefit_units 60 and status ACTIVE — a different conserved quantity (BENEFIT UNITS) than money."
        test_recipe:
          setup:
            - "District DSU has parcel P1 with benefit_units 60 (ACTIVE); P1 subdivided into children 40 and 20."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "DSU", formation_method: "BENEFIT_UNITS", total_project_cost_cents: 6000000 }
              as: DistrictAdministrator
              captures: { dsu: "$.data.id" }
            - call: "POST /districts/${dsu}/parcels"
              payload: { apn: "SU-1", owner_name: "O1", benefit_units: 60 }
              as: DistrictAdministrator
              captures: { p1: "$.data.id" }
            - call: "POST /parcels/${p1}/subdivide"
              payload: { children: [ { apn: "SU-1-a", owner_name: "O1a", benefit_units: 40 }, { apn: "SU-1-b", owner_name: "O1b", benefit_units: 20 } ] }
              as: DistrictAdministrator
          trigger:
            - call: "POST /parcels/${p1}/consolidate"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "Parcel.${p1}.status == ACTIVE"
            - "Parcel.${p1}.benefit_units == 60"
            - "Every child parcel with parent_parcel_id == ${p1} has status == WITHDRAWN"
