          assert:
            - "the CONSOLIDATED-with-site attempt is HTTP 422 with data.error_id == ERR_BILLING_MODE_MISMATCH"
            - "the PER_SITE-without-site attempt is HTTP 422 with data.error_id == ERR_BILLING_MODE_MISMATCH"
            - "the PER_SITE-with-a-foreign-site attempt is HTTP 422 with data.error_id == ERR_SITE_NOT_IN_ACCOUNT - the mode is satisfied, only ownership fails"
            - "the CONSOLIDATED-with-a-foreign-site attempt violates BOTH rules and returns ERR_SITE_NOT_IN_ACCOUNT (priority 35) rather than ERR_BILLING_MODE_MISMATCH (priority 36)"
            - "the two correctly scoped drafts are HTTP 201: ${invA_id} with site_id == null and ${invB_id} with site_id == ${siteB_id}"
            - "no invoice row was written by any of the four rejections: GET /ocs/consolidated-invoices returns total_count == 2 at the end"

      - name: corner_visit_line_family_checks_stocking_duplication_and_reported_quantities
        claim_type: aggregate_validation
        grounds:
