# =============================================================================
# Task 1975 — Fireworks Display Permitting & Show Operations (licensed pyrotechnics operator)
# Scaffold seed tables: §1.0–§1.7
# =============================================================================

scenario: |
  1975. Fireworks Display Permitting & Show Operations (licensed pyrotechnics operator): licensed operator & crew certification, permit application with site plan & fallout zone calculation, fire department approval & standby requirement, product inventory, magazine storage & transport documentation, weather/wind criteria & go-no-go decision, spectator perimeter & security staffing, misfire/dud disposal protocol, post-show site sweep & incident reporting

domain_name: fireworks-display-ops
api_prefix: /pyro

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_band: expert_plus
  note: |
    Deliberately dense surface: 13 tightly-coupled entities, 46 endpoints
    (12 are FK reverse-reachability GETs mandated by §1.5), 29 error codes,
    8 state machines (3 cyclic). Difficulty is concentrated in cross-entity
    gating, dual-variant calculations, and ordered validation priorities.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# List ordering convention (applies to every list endpoint in §1.5): rows are
# returned in created_at ASC order (oldest first). Deterministic; never id-keyed.
list_ordering: "created_at ASC on all list endpoints"

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business name of the pyrotechnics operator" }
      - { name: atf_license_number, type: string, source: input, description: "ATF explosives license number; unique across operators" }
      - { name: license_class, type: enum, source: input, description: "DISPLAY_1_3G | PROXIMATE_1_4G" }
      - { name: license_valid_from, type: datetime, source: input, description: "License validity window start (inclusive)" }
      - { name: license_expires_at, type: datetime, source: input, description: "License validity window end (inclusive): a show whose scheduled_start_at equals this instant is still covered" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }
      - { name: suspended_reason, type: string, source: system, description: "Reason recorded at suspension; null while ACTIVE", default: null }

  - name: CrewMember
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; owning operator (path operator on create)" }
      - { name: full_name, type: string, source: input, description: "Crew member legal name" }
      - { name: cert_level, type: enum, source: input, description: "TRAINEE | SHOOTER | LEAD_OPERATOR" }
      - { name: cert_expires_at, type: datetime, source: input, description: "Certification expiry; must be > current clock at creation" }
      - { name: hazmat_endorsed, type: boolean, source: input, default: false, description: "CDL hazmat endorsement flag" }

  - name: DisplayEvent
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; set from the authenticated Operator on create" }
      - { name: venue_id, type: string, source: input, description: "Venue identifier used for cross-event scheduling conflicts" }
      - { name: venue_name, type: string, source: input, description: "Human-readable venue name" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Show window start; must be strictly after the current clock at creation" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Show window end; must be strictly after scheduled_start_at" }
      - { name: declared_max_shell_diameter_in, type: number, source: input, description: "Declared largest aerial shell diameter (inches); drives provisional fallout radius; must be > 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | STANDBY_CONFIRMED | READY | IN_PROGRESS | SHOW_COMPLETE | SWEEP_VERIFIED | CLOSED | DENIED | CANCELLED" }
      - { name: weather_decision, type: enum, source: system, default: "PENDING", description: "Parallel state dimension: PENDING | GO | NO_GO" }
      - { name: cancellation_reason, type: enum, source: system, description: "OPERATOR | WEATHER_NO_GO | OPERATOR_SUSPENDED; null unless CANCELLED", default: null }
      - { name: termination_reason, type: enum, source: system, description: "COMPLETED | DUD_HALT; null unless SHOW_COMPLETE or later", default: null }
      - { name: standby_confirmed_at, type: datetime, source: system, description: "Clock time when fire standby was confirmed; null until then", default: null }
      - { name: standby_confirmed_by, type: string, source: system, description: "FireMarshal X-User-ID who confirmed standby", default: null }
      - { name: show_completed_at, type: datetime, source: system, description: "Clock time of SHOW_COMPLETE transition", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Clock time of automatic CLOSED transition", default: null }
      - { name: dud_count, type: integer, source: computed, default: 0, description: "Count of MisfireRecords for this event (LOGGED or DISPOSED)" }
      - { name: fired_count, type: integer, source: computed, default: 0, description: "Sum of EXPEND movement quantities for this event" }
      - { name: final_fallout_radius_ft, type: integer, source: computed, description: "Wind-adjusted final fallout radius stored on successful GO decision", default: null }
      - { name: final_standby_fee_cents, type: integer, source: computed, description: "Final fire-standby fee computed at CLOSED transition", default: null }

  - name: SitePlan
    parent: DisplayEvent
    common_fields: true
    fields:
      - { name: display_event_id, type: string, source: system, description: "FK -> DisplayEvent.id; parent display (path parameter)" }
      - { name: diagram_ref, type: string, source: input, description: "Reference to the uploaded site diagram" }
      - { name: launch_area_width_ft, type: number, source: input, description: "Launch area width; must be > 0" }
      - { name: launch_area_length_ft, type: number, source: input, description: "Launch area length; must be > 0" }
      - { name: spectator_boundary_ft, type: integer, source: input, description: "Distance from launch point to spectator area; must be >= required_spectator_distance_ft" }
      - { name: spectator_arc_center_deg, type: integer, source: input, description: "Compass bearing (0-359) of the spectator area center from the launch point" }
      - { name: nearest_structure_ft, type: integer, source: input, description: "Distance to nearest occupied structure; must be >= required_spectator_distance_ft" }
      - { name: required_spectator_distance_ft, type: integer, source: computed, description: "Provisional RSD = 70 x declared_max_shell_diameter_in of the parent event, computed at creation" }
      - { name: status, type: enum, source: system, default: "CURRENT", description: "CURRENT | SUPERSEDED — creating a new plan supersedes the prior CURRENT plan" }

  - name: PermitApplication
    parent: DisplayEvent
    common_fields: true
    fields:
      - { name: display_event_id, type: string, source: system, description: "FK -> DisplayEvent.id; parent display (path parameter)" }
      - { name: site_plan_id, type: string, source: input, description: "FK -> SitePlan.id; the plan under review (re-pinned on resubmit)" }
      - { name: site_plan_version, type: integer, source: system, description: "Version of the referenced SitePlan pinned at submission time" }
      - { name: standby_engines, type: integer, source: input, description: "Fire engine standby count requested; >= 1" }
      - { name: planned_hours, type: integer, source: computed, description: "ceil((scheduled_end_at - scheduled_start_at) / 3600 seconds)" }
      - { name: provisional_standby_fee_cents, type: integer, source: computed, description: "STANDBY_BASE_FEE_CENTS + planned_hours x STANDBY_HOURLY_RATE_CENTS + standby_engines x ENGINE_SURCHARGE_CENTS" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "FireMarshal X-User-ID who approved/denied", default: null }
      - { name: decision_note, type: string, source: system, description: "Reviewer note from the latest decision", default: null }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of INFO_REQUESTED -> SUBMITTED resubmission cycles" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | INFO_REQUESTED | APPROVED | DENIED | WITHDRAWN" }

  - name: Magazine
    parent: Operator
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; owning operator (authenticated caller)" }
      - { name: name, type: string, source: input, description: "Magazine label" }
      - { name: atf_magazine_permit, type: string, source: input, description: "ATF magazine permit reference" }
      - { name: magazine_type, type: enum, source: input, description: "INDOOR | OUTDOOR" }
      - { name: capacity_new_lbs, type: number, source: input, description: "Net explosive weight capacity in lbs; > 0; 2 decimal places" }
      - { name: current_new_lbs, type: number, source: computed, default: 0, description: "Sum of (qty_at_magazine x new_per_unit_lbs) over batches stored here; 2 decimal places, round_half_up" }
      - { name: inspection_due_at, type: datetime, source: input, description: "Next inspection deadline" }
      - { name: posture, type: enum, source: computed, description: "ACTIVE while clock <= inspection_due_at; LAPSED when clock > inspection_due_at" }

  - name: ProductBatch
    parent: Magazine
    common_fields: true
    fields:
      - { name: magazine_id, type: string, source: system, description: "FK -> Magazine.id; storage magazine (path parameter)" }
      - { name: product_name, type: string, source: input, description: "Product name" }
      - { name: un_number, type: string, source: input, description: "UN dangerous goods number, e.g. UN0335" }
      - { name: shell_diameter_in, type: number, source: input, description: "Shell diameter inches; drives final fallout radius; > 0" }
      - { name: quantity_units, type: integer, source: input, description: "Units received into the magazine; > 0" }
      - { name: new_per_unit_lbs, type: number, source: input, description: "Net explosive weight per unit; > 0; 2 decimal places" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number" }
      - { name: quantity_remaining, type: integer, source: computed, description: "= quantity_units - qty_expended" }
      - { name: qty_at_magazine, type: integer, source: computed, description: "Units physically in the magazine" }
      - { name: qty_at_show, type: integer, source: computed, description: "Net units checked out to shows (sum CHECK_OUT - RETURN across events)" }
      - { name: qty_expended, type: integer, source: computed, default: 0, description: "Units fired (EXPEND movements)" }
      - { name: status, type: enum, source: system, default: "IN_MAGAZINE", description: "IN_MAGAZINE | CHECKED_OUT | DEPLETED | QUARANTINED" }

  - name: InventoryMovement
    parent: ProductBatch
    common_fields: false
    fields:
      - { name: product_batch_id, type: string, source: system, description: "FK -> ProductBatch.id; batch moved (path parameter)" }
      - { name: display_event_id, type: string, source: input, description: "FK -> DisplayEvent.id; event the movement serves" }
      - { name: movement_type, type: enum, source: input, description: "CHECK_OUT | RETURN | EXPEND" }
      - { name: quantity, type: integer, source: input, description: "Units moved; must be > 0" }
      - { name: driver_name, type: string, source: input, description: "Transport manifest driver; required iff movement_type == CHECK_OUT" }
      - { name: vehicle_placard, type: string, source: input, description: "Vehicle placard code; required iff movement_type == CHECK_OUT" }
      - { name: cdl_hazmat_endorsed, type: boolean, source: input, description: "Driver hazmat endorsement; required iff CHECK_OUT and must be true" }
      - { name: auto_generated, type: boolean, source: system, default: false, description: "True when created by a cancellation cascade" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recorder (or 'system' when auto_generated)" }

  - name: WeatherReading
    parent: DisplayEvent
    common_fields: false
    fields:
      - { name: display_event_id, type: string, source: system, description: "FK -> DisplayEvent.id; parent display (path parameter)" }
      - { name: wind_speed_mph, type: number, source: input, description: "Sustained wind speed; >= 0; 1 decimal place" }
      - { name: gust_mph, type: number, source: input, description: "Peak gust speed; >= 0; 1 decimal place" }
      - { name: wind_direction_deg, type: integer, source: input, description: "Direction wind comes FROM, compass degrees 0-359" }
      - { name: precipitation, type: boolean, source: input, description: "Active precipitation flag" }
      - { name: source, type: enum, source: input, description: "ON_SITE_ANEMOMETER | NWS" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recorder" }

  - name: SecurityPost
    parent: DisplayEvent
    common_fields: true
    fields:
      - { name: display_event_id, type: string, source: system, description: "FK -> DisplayEvent.id; parent display (path parameter)" }
      - { name: post_label, type: string, source: input, description: "Human label, unique within the event" }
      - { name: arc_degrees, type: integer, source: input, description: "Arc coverage of this post, 1-360 degrees" }
      - { name: radius_ft, type: integer, source: input, description: "Perimeter radius; must be >= the CURRENT site plan's required_spectator_distance_ft" }
      - { name: required_guards, type: integer, source: computed, description: "max(1, ceil((2 x pi x radius_ft x arc_degrees/360) / GUARD_SPACING_FT)); no intermediate rounding" }
      - { name: assigned_guards, type: integer, source: system, default: 0, description: "Guards assigned via /assign" }
      - { name: status, type: enum, source: system, default: "UNSTAFFED", description: "UNSTAFFED | STAFFED | SECURED | RELEASED" }

  - name: MisfireRecord
    parent: DisplayEvent
    common_fields: true
    fields:
      - { name: display_event_id, type: string, source: system, description: "FK -> DisplayEvent.id; parent display (path parameter)" }
      - { name: product_batch_id, type: string, source: input, description: "FK -> ProductBatch.id; batch the dud shell came from" }
      - { name: shell_description, type: string, source: input, description: "Description of the dud shell" }
      - { name: location_note, type: string, source: input, description: "Where the dud landed", default: null }
      - { name: logged_by_crew_id, type: string, source: system, description: "X-User-ID of the logging CrewMember/Operator" }
      - { name: soak_until, type: datetime, source: computed, description: "created_at + SOAK_MINUTES; disposal allowed at or after this instant (inclusive)" }
      - { name: disposal_method, type: enum, source: system, description: "SOAK_CRUSH | BURN_PIT | RETURN_TO_SUPPLIER; set on dispose", default: null }
      - { name: disposed_at, type: datetime, source: system, description: "Clock time of disposal", default: null }
      - { name: status, type: enum, source: system, default: "LOGGED", description: "LOGGED | DISPOSED" }

  - name: SweepRecord
    parent: DisplayEvent
    common_fields: true
    fields:
      - { name: display_event_id, type: string, source: system, description: "FK -> DisplayEvent.id; parent display (path parameter)" }
      - { name: sweep_type, type: enum, source: input, description: "NIGHT_SWEEP | DAWN_RECHECK" }
      - { name: area_clear, type: boolean, source: input, description: "True when the sweep found the fallout area clear" }
      - { name: notes, type: string, source: input, description: "Sweep notes", default: null }
      - { name: swept_by_crew_id, type: string, source: system, description: "X-User-ID of the sweeping CrewMember" }
      - { name: verified_by_user_id, type: string, source: system, description: "FireMarshal X-User-ID who verified", default: null }
      - { name: verdict, type: enum, source: system, default: "PENDING", description: "PENDING | VERIFIED | REJECTED" }

  - name: IncidentReport
    parent: DisplayEvent
    common_fields: true
    fields:
      - { name: display_event_id, type: string, source: system, description: "FK -> DisplayEvent.id; parent display (path parameter)" }
      - { name: incident_type, type: enum, source: input, description: "INJURY | FIRE | PROPERTY_DAMAGE | DUD_OFFSITE | CROWD_BREACH" }
      - { name: severity, type: enum, source: input, description: "MINOR | SERIOUS | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text incident description" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the reporter" }
      - { name: reported_by_role, type: string, source: system, description: "X-User-Role of the reporter" }
      - { name: resolution_note, type: string, source: system, description: "Resolution recorded at close", default: null }
      - { name: closed_by_user_id, type: string, source: system, description: "FireMarshal X-User-ID who closed the report", default: null }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Operator
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pyro/operators/{id}/suspend"
        actor: SystemAdmin
        preconditions:
          - "operator.status == ACTIVE"
        side_effects:
          - "suspended_reason := request.reason"
          - "Every DisplayEvent of this operator with status in {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, STANDBY_CONFIRMED, READY} -> CANCELLED with cancellation_reason=OPERATOR_SUSPENDED (full cancel side effects fire per event: security posts -> RELEASED, non-terminal PermitApplications -> WITHDRAWN, auto-RETURN InventoryMovements for net checked-out product, magazine current_new_lbs recompute)"
        note: "Cascade root of the operator-suspension chain (depth 3: Operator -> DisplayEvent -> InventoryMovement -> Magazine recompute)."

  - entity: DisplayEvent
    initial_state: DRAFT
    terminal_states: [CLOSED, DENIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pyro/displays/{id}/permit-applications"
        actor: Operator
        preconditions:
          - "event.status == DRAFT"
          - "at least one SitePlan with status CURRENT exists for the event (none -> ERR_INVALID_STATE)"
          - "no other PermitApplication of this event in {SUBMITTED, INFO_REQUESTED} (ERR_DUPLICATE_APPLICATION)"
          - "operator license covers scheduled_start_at (ERR_LICENSE_EXPIRED)"
        side_effects:
          - "PermitApplication created in SUBMITTED; site_plan_version pinned"
          - "planned_hours and provisional_standby_fee_cents computed (c_standby_fee provisional variant)"
          - "increments DisplayEvent.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pyro/permit-applications/{id}/approve"
        actor: FireMarshal
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.status := APPROVED; reviewed_by_user_id := marshal X-User-ID; decision_note recorded"
          - "increments DisplayEvent.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pyro/permit-applications/{id}/deny"
        actor: FireMarshal
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.status := DENIED; reviewed_by_user_id and decision_note recorded"
          - "increments DisplayEvent.version by 1"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /pyro/permit-applications/{id}/request-info"
        actor: FireMarshal
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.status := INFO_REQUESTED; decision_note recorded"
          - "increments DisplayEvent.version by 1"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /pyro/permit-applications/{id}/resubmit"
        actor: Operator
        preconditions:
          - "application.status == INFO_REQUESTED"
          - "request.site_plan_id references a SitePlan of this event with status CURRENT (ERR_SCOPE_MISMATCH / ERR_INVALID_STATE)"
        side_effects:
          - "application.status := SUBMITTED; revision_count += 1; site_plan_id + site_plan_version re-pinned"
          - "increments DisplayEvent.version by 1"
        note: "Revision loop: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED (cyclic)."

      - from: APPROVED
        to: STANDBY_CONFIRMED
        trigger: "POST /pyro/displays/{id}/standby-confirm"
        actor: FireMarshal
        preconditions:
          - "event.status == APPROVED"
          - "segregation of duties: standby-confirm X-User-ID != the APPROVED application's reviewed_by_user_id (ERR_SOD_VIOLATION)"
          - "standby_engines_on_site == application.standby_engines (ERR_VALIDATION)"
        side_effects:
          - "standby_confirmed_at := clock; standby_confirmed_by := marshal X-User-ID"
          - "increments DisplayEvent.version by 1"

      - from: STANDBY_CONFIRMED
        to: READY
        trigger: "POST /pyro/displays/{id}/ready"
        actor: Operator
        preconditions:
          - "event.status == STANDBY_CONFIRMED"
          - "at least one SecurityPost exists and every SecurityPost of the event has status SECURED (ERR_SECURITY_NOT_SECURED)"
          - "at least one CrewMember of the operator with cert_level == LEAD_OPERATOR and cert_expires_at >= scheduled_start_at (ERR_CERT_NOT_VALID)"
          - "net checked-out product for the event (sum CHECK_OUT - sum RETURN) > 0 (ERR_NO_PRODUCT_ON_SITE)"
        side_effects:
          - "increments DisplayEvent.version by 1"

      - from: READY
        to: IN_PROGRESS
        trigger: "POST /pyro/displays/{id}/go-no-go with decision=GO"
        actor: Operator
        preconditions:
          - "event.status == READY"
          - "OCC: expected_display_event_version == event.version (ERR_STALE_VERSION)"
          - "latest WeatherReading (by created_at) fails limits: wind_speed_mph >= WIND_SUSTAINED_LIMIT_MPH or gust_mph >= WIND_GUST_LIMIT_MPH or precipitation == true -> ERR_WEATHER_NO_GO"
          - "no WeatherReading exists, or clock - latest.created_at > WEATHER_VALIDITY_MIN minutes -> ERR_WEATHER_STALE"
          - "clock < scheduled_start_at - GO_NO_GO_WINDOW_MIN minutes or clock > scheduled_end_at -> ERR_SHOW_WINDOW_NOT_OPEN"
          - "wind_adjusted_fallout(base from allocated shells) <= CURRENT site plan spectator_boundary_ft (ERR_FALLOUT_EXCEEDS_BOUNDARY)"
        side_effects:
          - "weather_decision := GO; final_fallout_radius_ft := computed wind-adjusted radius"
          - "increments DisplayEvent.version by 1"

      - from: READY
        to: CANCELLED
        trigger: "POST /pyro/displays/{id}/go-no-go with decision=NO_GO, or POST /pyro/displays/{id}/cancel"
        actor: Operator
        preconditions:
          - "event.status == READY (NO_GO) or in {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, STANDBY_CONFIRMED, READY} (cancel)"
          - "OCC on go-no-go: expected_display_event_version == event.version"
        side_effects:
          - "cancellation_reason := WEATHER_NO_GO (NO_GO) or OPERATOR (cancel); weather_decision := NO_GO on the NO_GO path"
          - "SecurityPosts in {UNSTAFFED, STAFFED, SECURED} -> RELEASED"
          - "auto-RETURN InventoryMovements (auto_generated=true) for every batch with qty_at_show > 0 attributed to this event; magazine current_new_lbs recomputed per return"
          - "non-terminal PermitApplications -> WITHDRAWN"
          - "increments DisplayEvent.version by 1"

      - from: IN_PROGRESS
        to: SHOW_COMPLETE
        trigger: "POST /pyro/displays/{id}/complete-show, or system auto-halt when dud_count reaches c_dud_halt_threshold"
        actor: Operator | system
        preconditions:
          - "event.status == IN_PROGRESS"
        side_effects:
          - "show_completed_at := clock; termination_reason := COMPLETED (manual) or DUD_HALT (auto)"
          - "increments DisplayEvent.version by 1"

      - from: SHOW_COMPLETE
        to: SWEEP_VERIFIED
        trigger: "POST /pyro/sweeps/{id}/verify with verdict=VERIFIED"
        actor: FireMarshal
        preconditions:
          - "sweep.verdict == PENDING and sweep.display_event_id == event.id"
        side_effects:
          - "sweep.verdict := VERIFIED; verified_by_user_id := marshal X-User-ID"
          - "SecurityPosts in {UNSTAFFED, STAFFED, SECURED} -> RELEASED"
          - "auto-close evaluation (see SWEEP_VERIFIED -> CLOSED)"
          - "increments DisplayEvent.version by 1"

      - from: SWEEP_VERIFIED
        to: CLOSED
        trigger: "system (automatic) — evaluated after every sweep verify, incident close, and RETURN movement"
        actor: system
        preconditions:
          - "no IncidentReport of the event with status FILED"
          - "net checked-out product for the event (sum CHECK_OUT - sum RETURN - sum EXPEND) == 0"
        side_effects:
          - "closed_at := clock; final_standby_fee_cents := c_standby_fee final variant"
          - "increments DisplayEvent.version by 1"

      - from: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | STANDBY_CONFIRMED"
        to: CANCELLED
        trigger: "POST /pyro/displays/{id}/cancel, or system cascade from Operator suspension"
        actor: Operator | system
        preconditions:
          - "event.status in the from set"
        side_effects:
          - "cancellation_reason := OPERATOR (manual) or OPERATOR_SUSPENDED (cascade)"
          - "SecurityPosts in {UNSTAFFED, STAFFED, SECURED} -> RELEASED"
          - "auto-RETURN InventoryMovements for net checked-out product; magazine current_new_lbs recomputed"
          - "non-terminal PermitApplications -> WITHDRAWN"
          - "increments DisplayEvent.version by 1"

  - entity: PermitApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pyro/permit-applications/{id}/approve"
        actor: FireMarshal
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["DisplayEvent -> APPROVED (see DisplayEvent machine)"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pyro/permit-applications/{id}/deny"
        actor: FireMarshal
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["DisplayEvent -> DENIED (terminal)"]
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /pyro/permit-applications/{id}/request-info"
        actor: FireMarshal
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["DisplayEvent -> REVISION_REQUESTED"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /pyro/permit-applications/{id}/resubmit"
        actor: Operator
        preconditions: ["application.status == INFO_REQUESTED", "site_plan_id is CURRENT for this event"]
        side_effects: ["DisplayEvent -> SUBMITTED; revision_count += 1"]
        note: "Cyclic review loop."
      - from: "SUBMITTED | INFO_REQUESTED"
        to: WITHDRAWN
        trigger: "system (event cancelled or operator suspended)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProductBatch
    initial_state: IN_MAGAZINE
    terminal_states: [DEPLETED, QUARANTINED]
    transitions:
      - from: IN_MAGAZINE
        to: CHECKED_OUT
        trigger: "system (CHECK_OUT movement makes qty_at_show > 0)"
        actor: system
        preconditions: []
        side_effects: ["Magazine.current_new_lbs recomputed (c_magazine_mass)"]
      - from: CHECKED_OUT
        to: IN_MAGAZINE
        trigger: "system (RETURN movement makes qty_at_show == 0 and quantity_remaining > 0)"
        actor: system
        preconditions: []
        side_effects: ["Magazine.current_new_lbs recomputed"]
        note: "Return loop: IN_MAGAZINE -> CHECKED_OUT -> IN_MAGAZINE (cyclic)."
      - from: "IN_MAGAZINE | CHECKED_OUT"
        to: DEPLETED
        trigger: "system (EXPEND movement makes quantity_remaining == 0)"
        actor: system
        preconditions: []
        side_effects: ["Magazine.current_new_lbs recomputed"]
      - from: "IN_MAGAZINE | CHECKED_OUT"
        to: QUARANTINED
        trigger: "POST /pyro/batches/{id}/quarantine"
        actor: Operator | FireMarshal
        preconditions: ["batch.status in {IN_MAGAZINE, CHECKED_OUT}"]
        side_effects: ["All subsequent movements on this batch are rejected (ERR_BATCH_QUARANTINED)"]

  - entity: SecurityPost
    initial_state: UNSTAFFED
    terminal_states: [RELEASED]
    transitions:
      - from: UNSTAFFED
        to: STAFFED
        trigger: "POST /pyro/security-posts/{id}/assign (0 < assigned_guards < required_guards)"
        actor: Operator
        preconditions: ["post.status in {UNSTAFFED, STAFFED}"]
        side_effects: ["assigned_guards += 1"]
      - from: "UNSTAFFED | STAFFED"
        to: SECURED
        trigger: "system (assign makes assigned_guards >= required_guards)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Threshold auto-transition at assigned_guards == required_guards (inclusive >=)."
      - from: "UNSTAFFED | STAFFED | SECURED"
        to: RELEASED
        trigger: "system (event CANCELLED, or sweep verdict VERIFIED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MisfireRecord
    initial_state: LOGGED
    terminal_states: [DISPOSED]
    transitions:
      - from: LOGGED
        to: DISPOSED
        trigger: "POST /pyro/misfires/{id}/dispose"
        actor: Operator
        preconditions:
          - "misfire.status == LOGGED"
          - "event.status in {SHOW_COMPLETE, SWEEP_VERIFIED} (ERR_INVALID_STATE)"
          - "clock >= soak_until (ERR_SOAK_INCOMPLETE)"
        side_effects:
          - "disposal_method and disposed_at recorded"
          - "sweep-creation reconciliation gate unblocked for this misfire"

  - entity: SweepRecord
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /pyro/sweeps/{id}/verify with verdict=VERIFIED"
        actor: FireMarshal
        preconditions: ["sweep.verdict == PENDING"]
        side_effects: ["DisplayEvent SHOW_COMPLETE -> SWEEP_VERIFIED; posts -> RELEASED; auto-close evaluation"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /pyro/sweeps/{id}/verify with verdict=REJECTED"
        actor: FireMarshal
        preconditions: ["sweep.verdict == PENDING"]
        side_effects: ["DisplayEvent stays SHOW_COMPLETE; a new SweepRecord may be created (re-sweep loop)"]

  - entity: IncidentReport
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: CLOSED
        trigger: "POST /pyro/incidents/{id}/close"
        actor: FireMarshal
        preconditions:
          - "incident.status == FILED"
          - "segregation of duties: close X-User-ID != reported_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "resolution_note and closed_by_user_id recorded"
          - "auto-close evaluation on the parent DisplayEvent"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: site-plan-supersede-stale-version
    parent_entity: DisplayEvent
    write_endpoint: "POST /pyro/displays/{id}/site-plans"
    occ_field: expected_display_event_version
    description: |
      Creating a SitePlan supersedes the event's prior CURRENT plan. If the
      DisplayEvent's version has advanced since the client last observed it,
      the client is superseding a plan it never saw; the request is rejected
      with ERR_STALE_VERSION so the client re-reads the event first.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: go-no-go-stale-event-view
    parent_entity: DisplayEvent
    write_endpoint: "POST /pyro/displays/{id}/go-no-go"
    occ_field: expected_display_event_version
    description: |
      A GO decision is only valid against the exact event version the shooter
      reviewed. If the DisplayEvent's version has advanced since the client's
      last read (e.g. another authorized write mutated the event), the
      decision is rejected with ERR_STALE_VERSION and must be re-evaluated
      against the fresh event state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: c_fallout_base
    trigger: "SitePlan creation (provisional variant); go-no-go GO decision (final variant)"
    algorithm: threshold
    formula: |
      provisional_required_spectator_distance_ft = SPECTATOR_FT_PER_SHELL_INCH * event.declared_max_shell_diameter_in
      final_base_radius_ft = SPECTATOR_FT_PER_SHELL_INCH * max(shell_diameter_in over ProductBatches with qty_at_show > 0 for this event)
      SitePlan creation rejects when spectator_boundary_ft < provisional RSD or nearest_structure_ft < provisional RSD.
    input_set: "provisional: parent DisplayEvent.declared_max_shell_diameter_in. final: batches with net qty_at_show > 0 attributed to the event at GO time"
    constants:
      SPECTATOR_FT_PER_SHELL_INCH: 70
    precision: "integer feet; diameters with fractional inches produce round_half_up to integer feet"
    variants:
      - name: provisional
        when: "SitePlan creation; stored on SitePlan.required_spectator_distance_ft"
        difference: "uses declared_max_shell_diameter_in from the permit application data"
      - name: final
        when: "go-no-go GO; stored on DisplayEvent.final_fallout_radius_ft after wind adjustment (c_wind_adjusted_fallout)"
        difference: "uses the max diameter of product actually checked out to the show; identical site data yields a different radius whenever allocated stock differs from the declaration"

  - name: c_wind_adjusted_fallout
    trigger: "go-no-go GO decision, after c_fallout_base final variant"
    algorithm: constraint_propagation
    formula: |
      downwind_deg = (latest_reading.wind_direction_deg + 180) % 360
      delta = smallest angular distance in [0,180] between spectator_arc_center_deg (CURRENT SitePlan) and downwind_deg
      if latest_reading.wind_speed_mph < DRIFT_THRESHOLD_MPH: adjusted = base
      else:
        factor = min(1 + (wind_speed_mph - DRIFT_THRESHOLD_MPH) * DRIFT_FACTOR_PER_MPH, DRIFT_FACTOR_CAP)
        if delta <= 45: adjusted = base * factor
        elif delta <= 135: adjusted = base * (1 + (factor - 1) / 2)
        else: adjusted = base
      adjusted_ft = round_half_up(adjusted) to integer feet
      GO also requires adjusted_ft <= spectator_boundary_ft (else ERR_FALLOUT_EXCEEDS_BOUNDARY)
    input_set: "latest WeatherReading by created_at; CURRENT SitePlan; final base radius"
    constants:
      DRIFT_THRESHOLD_MPH: 8
      DRIFT_FACTOR_PER_MPH: 0.05
      DRIFT_FACTOR_CAP: 1.5
    precision: "integer feet, round_half_up; no intermediate rounding of factor"

  - name: c_standby_fee
    trigger: "PermitApplication creation (provisional variant); DisplayEvent CLOSED transition (final variant)"
    algorithm: tiered_pricing
    formula: |
      provisional (at application creation):
        planned_hours = ceil((scheduled_end_at - scheduled_start_at) / 3600 seconds)
        provisional_standby_fee_cents = STANDBY_BASE_FEE_CENTS + planned_hours * STANDBY_HOURLY_RATE_CENTS + standby_engines * ENGINE_SURCHARGE_CENTS
      final (at CLOSED):
        elapsed_minutes = ceil((closed_at - standby_confirmed_at) / 60 seconds)
        hours_line_cents = round_half_up(elapsed_minutes * STANDBY_HOURLY_RATE_CENTS / 60)   # PINNED: minute-prorate, then round this line item half-up to whole cents
        final_standby_fee_cents = STANDBY_BASE_FEE_CENTS + hours_line_cents + standby_engines * ENGINE_SURCHARGE_CENTS  # then sum integer line items
      # Forbidden alternative: rounding elapsed time up to whole hours before multiplying
      # (ceil(elapsed_minutes/60) * rate) — produces a different, larger fee.
    input_set: "provisional: event scheduled window + application standby_engines. final: standby_confirmed_at and closed_at timestamps + standby_engines of the APPROVED application"
    constants:
      STANDBY_BASE_FEE_CENTS: 25000
      STANDBY_HOURLY_RATE_CENTS: 14500
      ENGINE_SURCHARGE_CENTS: 30000
    precision: "integer cents, round_half_up applied per line item before summation"
    variants:
      - name: provisional
        when: "PermitApplication creation"
        difference: "ceil-hour estimate on the scheduled window; stored on PermitApplication.provisional_standby_fee_cents"
      - name: final
        when: "DisplayEvent auto-close"
        difference: "minute-prorated actuals with per-line rounding; identical schedule data yields a different fee whenever actual standby elapsed time differs from the planned window"

  - name: c_allocation_rsd_gate
    trigger: "InventoryMovement CHECK_OUT creation"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency, evaluation order PINNED:
      #   allocating a batch mutates the set that the gating RSD is computed from,
      #   and the RSD gates the allocation. The server evaluates in this exact order:
      candidate_max_diameter = max(
          max(shell_diameter_in over batches with qty_at_show > 0 for this event, default 0),
          candidate_batch.shell_diameter_in)
      candidate_rsd_ft = round_half_up(SPECTATOR_FT_PER_SHELL_INCH * candidate_max_diameter)
      if candidate_rsd_ft > CURRENT SitePlan.spectator_boundary_ft: reject ERR_FALLOUT_EXCEEDS_BOUNDARY
      else: movement is recorded; batch qty_at_show increases (which may raise the gate for the NEXT allocation)
    input_set: "batches with net qty_at_show > 0 for this event plus the candidate batch; CURRENT SitePlan of the event"
    constants:
      SPECTATOR_FT_PER_SHELL_INCH: 70
    precision: "integer feet, round_half_up"

  - name: c_batch_quantities
    trigger: "every InventoryMovement write (including auto-generated cascade returns)"
    algorithm: aggregation
    formula: |
      For movement batch B and event E, quantity q:
        CHECK_OUT: B.qty_at_magazine -= q; B.qty_at_show += q
        RETURN:    B.qty_at_show -= q; B.qty_at_magazine += q
        EXPEND:    B.qty_at_show -= q; B.qty_expended += q
      B.quantity_remaining = B.quantity_units - B.qty_expended
      INVARIANT (batch unit accountability): at all times,
        B.quantity_units == B.qty_at_magazine + B.qty_at_show + B.qty_expended
      Movement legality: CHECK_OUT requires q <= B.qty_at_magazine; RETURN requires
        q <= B.qty_at_show attributed to event E; EXPEND requires q <= B.qty_at_show attributed to event E.
      Status recompute: quantity_remaining == 0 -> DEPLETED; else qty_at_show > 0 -> CHECKED_OUT; else IN_MAGAZINE (unless QUARANTINED).
    input_set: "all InventoryMovements of the batch; per-event attribution via display_event_id"
    precision: "integer units"

  - name: c_magazine_mass
    trigger: "batch creation; every InventoryMovement affecting a batch stored in the magazine"
    algorithm: aggregation
    formula: |
      Magazine.current_new_lbs = round_half_up_2dp(sum(B.qty_at_magazine * B.new_per_unit_lbs
          over all ProductBatches B with B.magazine_id == magazine.id))
      INVARIANT (magazine mass conservation): a CHECK_OUT(q) followed by a RETURN(q) of the
        same batch leaves current_new_lbs bit-identical to its pre-CHECK_OUT value.
      Intake gate on batch creation: current_new_lbs + quantity_units * new_per_unit_lbs <= capacity_new_lbs
        (inclusive; exact fit allowed), else ERR_MAGAZINE_CAPACITY_EXCEEDED.
    input_set: "non-QUARANTINED... all batches of the magazine regardless of status (QUARANTINED stock still physically occupies the magazine)"
    precision: "2 decimal places, round_half_up"

  - name: c_required_guards
    trigger: "SecurityPost creation"
    algorithm: threshold
    formula: |
      arc_length_ft = 2 * pi * radius_ft * (arc_degrees / 360)   # no intermediate rounding; pi = 3.141592653589793
      required_guards = max(1, ceil(arc_length_ft / GUARD_SPACING_FT))
      Post auto-transitions to SECURED when assigned_guards >= required_guards (inclusive equality secures).
    input_set: "the SecurityPost's own radius_ft and arc_degrees"
    constants:
      GUARD_SPACING_FT: 100
    precision: "integer guards via ceil; arc_length unrounded until the division"

  - name: c_dud_halt_threshold
    trigger: "MisfireRecord creation"
    algorithm: threshold
    formula: |
      event.dud_count += 1
      halt_threshold = max(DUD_HALT_MIN, ceil(event.fired_count * DUD_RATE_LIMIT))
      # fired_count is evaluated BEFORE this misfire (EXPEND movements only; misfires do not change fired_count)
      if event.dud_count >= halt_threshold and event.status == IN_PROGRESS:
        event -> SHOW_COMPLETE with termination_reason = DUD_HALT (auto-halt)
    input_set: "MisfireRecords of the event; EXPEND InventoryMovements of the event"
    constants:
      DUD_HALT_MIN: 2
      DUD_RATE_LIMIT: 0.05
    precision: "integer counts"

  - name: c_weather_windows
    trigger: "go-no-go decision evaluation"
    algorithm: threshold
    formula: |
      reading_fresh = (clock - latest_reading.created_at) <= WEATHER_VALIDITY_MIN minutes   # inclusive: exactly 30:00 is fresh
      decision_window_open = (clock >= scheduled_start_at - GO_NO_GO_WINDOW_MIN minutes) and (clock <= scheduled_end_at)  # both bounds inclusive
      go_limits_ok = (wind_speed_mph < WIND_SUSTAINED_LIMIT_MPH) and (gust_mph < WIND_GUST_LIMIT_MPH) and (precipitation == false)
      # limits are strict: sustained exactly 20.0 or gust exactly 25.0 fails GO criteria
    input_set: "latest WeatherReading by created_at; event scheduled window; current clock"
    constants:
      WEATHER_VALIDITY_MIN: 30
      GO_NO_GO_WINDOW_MIN: 60
      WIND_SUSTAINED_LIMIT_MPH: 20
      WIND_GUST_LIMIT_MPH: 25
    precision: "second-precision timestamp comparison; 1-decimal wind comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "Request schema: required fields present (including conditional manifest fields when movement_type == CHECK_OUT), types valid, enum members valid, quantities and diameters > 0, scheduled_end_at > scheduled_start_at, scheduled_start_at in the future, no undeclared payload fields"
    error_id: "ERR_VALIDATION | ERR_INVALID_QUANTITY"
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right; body-referenced ids (site_plan_id, product_batch_id, display_event_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "Entity-backed ownership (Operator role only): the Operator caller owns the target aggregate (display.operator_id == X-User-ID; magazine/batch via magazine.operator_id; child resources via their parent display). CrewMember cross-operator references are NOT handled here — they surface at priority 9 as ERR_SCOPE_MISMATCH"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "all scoped endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_display_event_version equals current DisplayEvent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pyro/displays/{id}/site-plans, POST /pyro/displays/{id}/go-no-go"
  - priority: 7
    category: state
    check: "State-machine preconditions: transition listed for the entity's current state; operator ACTIVE (ERR_OPERATOR_SUSPENDED); magazine posture ACTIVE for intake (ERR_MAGAZINE_LAPSED); event approved before product movement (ERR_PERMIT_NOT_APPROVED); no second non-terminal application (ERR_DUPLICATE_APPLICATION). Within this tier on permit-application creation, ERR_DUPLICATE_APPLICATION is evaluated before the generic event-state check (so a second application on a SUBMITTED event returns ERR_DUPLICATE_APPLICATION, not ERR_INVALID_STATE)"
    error_id: "ERR_INVALID_STATE | ERR_OPERATOR_SUSPENDED | ERR_MAGAZINE_LAPSED | ERR_PERMIT_NOT_APPROVED | ERR_DUPLICATE_APPLICATION"
    http_status: 409
    applies_to: "state transition endpoints, batch creation, movements, permit application creation"
  - priority: 8
    category: business_safety
    check: "Safety/compliance: batch not QUARANTINED (ERR_BATCH_QUARANTINED); fallout/RSD fits boundary and structures (ERR_FALLOUT_EXCEEDS_BOUNDARY); weather GO limits (ERR_WEATHER_NO_GO); segregation of duties (ERR_SOD_VIOLATION)"
    error_id: "ERR_BATCH_QUARANTINED | ERR_FALLOUT_EXCEEDS_BOUNDARY | ERR_WEATHER_NO_GO | ERR_SOD_VIOLATION"
    http_status: 409
    applies_to: "movements, site plans, go-no-go, standby-confirm, incident close"
  - priority: 9
    category: business_referential
    check: "Cross-scope references: referenced site plan belongs to this display; batch's operator matches the event's operator; crew recorder belongs to the event's operator"
    error_id: ERR_SCOPE_MISMATCH
    http_status: 422
    applies_to: "permit application create/resubmit, movements, weather readings, sweeps, misfires"
  - priority: 10
    category: business_temporal
    check: "Temporal rules: license contains show date inclusive (ERR_LICENSE_EXPIRED); cert valid at creation and covering show date for LEAD crew (ERR_CERT_NOT_VALID); weather reading fresh (ERR_WEATHER_STALE); soak elapsed (ERR_SOAK_INCOMPLETE); decision window open (ERR_SHOW_WINDOW_NOT_OPEN); venue booking buffer (ERR_VENUE_CONFLICT)"
    error_id: "ERR_LICENSE_EXPIRED | ERR_CERT_NOT_VALID | ERR_WEATHER_STALE | ERR_SOAK_INCOMPLETE | ERR_SHOW_WINDOW_NOT_OPEN | ERR_VENUE_CONFLICT"
    http_status: 409
    applies_to: "display create, permit application create, crew create, ready, go-no-go, misfire dispose"
  - priority: 11
    category: business_constraint
    check: "Capacity/aggregate/compliance constraints: magazine intake capacity inclusive (ERR_MAGAZINE_CAPACITY_EXCEEDED); movement quantity available (ERR_INSUFFICIENT_PRODUCT); readiness aggregate gates (ERR_SECURITY_NOT_SECURED, ERR_NO_PRODUCT_ON_SITE); sweep reconciliation (ERR_SWEEP_RECONCILE_FAILED); manifest compliance (ERR_MANIFEST_NOT_COMPLIANT)"
    error_id: "ERR_MAGAZINE_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_PRODUCT | ERR_SECURITY_NOT_SECURED | ERR_NO_PRODUCT_ON_SITE | ERR_SWEEP_RECONCILE_FAILED | ERR_MANIFEST_NOT_COMPLIANT"
    http_status: 409
    applies_to: "batch creation, movements, ready, sweeps"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/pyro/_clock/set_current_utc"
    description: "Test-driving logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the server NEVER falls back to wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["recomputes clock-derived postures (Magazine.posture)"]

  - method: POST
    path: "/pyro/operators"
    description: "Register a licensed pyrotechnics operator"
    roles: [SystemAdmin]
    code: 201
    input: [legal_name, atf_license_number, license_class, license_valid_from, license_expires_at]
    output: Operator
    side_effects: ["status=ACTIVE, version=1"]

  - method: GET
    path: "/pyro/operators/{id}"
    description: "Get an operator"
    roles: [SystemAdmin, Operator]
    code: 200
    input: []
    output: Operator
    side_effects: []

  - method: POST
    path: "/pyro/operators/{id}/suspend"
    description: "Suspend an operator; cascades cancellation across its non-terminal displays"
    roles: [SystemAdmin]
    code: 200
    input: [reason]
    output: Operator
    side_effects: ["Operator -> SUSPENDED; per-event cancel cascade (see Operator state machine)"]

  - method: POST
    path: "/pyro/operators/{id}/crew-members"
    description: "Register a certified crew member under an operator"
    roles: [Operator]
    code: 201
    input: [full_name, cert_level, cert_expires_at, "hazmat_endorsed?"]
    output: CrewMember
    side_effects: ["path operator id must equal X-User-ID"]

  - method: GET
    path: "/pyro/operators/{id}/crew-members"
    description: "List an operator's crew (reverse reachability for CrewMember.operator_id)"
    roles: [Operator, SystemAdmin]
    code: 200
    input: ["cert_level?", "limit?", "offset?"]
    output: CrewMember[]
    side_effects: []

  - method: POST
    path: "/pyro/displays"
    description: "Create a display event (DRAFT)"
    roles: [Operator]
    code: 201
    input: [venue_id, venue_name, scheduled_start_at, scheduled_end_at, declared_max_shell_diameter_in]
    output: DisplayEvent
    side_effects: ["status=DRAFT, weather_decision=PENDING, dud_count=0, fired_count=0; venue buffer conflict check; license containment check"]

  - method: GET
    path: "/pyro/displays/{id}"
    description: "Get a display event"
    roles: [Operator, FireMarshal, CrewMember, SystemAdmin]
    code: 200
    input: []
    output: DisplayEvent
    side_effects: []

  - method: GET
    path: "/pyro/displays"
    description: "List display events (reverse reachability for DisplayEvent.operator_id)"
    roles: [Operator, FireMarshal, SystemAdmin]
    code: 200
    input: ["operator_id?", "status?", "limit?", "offset?"]
    output: DisplayEvent[]
    side_effects: []

  - method: POST
    path: "/pyro/displays/{id}/standby-confirm"
    description: "FireMarshal confirms fire-watch standby on site (SoD vs approving marshal)"
    roles: [FireMarshal]
    code: 200
    input: [standby_engines_on_site, "note?"]
    output: DisplayEvent
    side_effects: ["DisplayEvent APPROVED -> STANDBY_CONFIRMED; increments DisplayEvent.version by 1"]

  - method: POST
    path: "/pyro/displays/{id}/ready"
    description: "Operator declares the show ready; enforces security/crew/product gates"
    roles: [Operator]
    code: 200
    input: []
    output: DisplayEvent
    side_effects: ["DisplayEvent STANDBY_CONFIRMED -> READY; increments DisplayEvent.version by 1"]

  - method: POST
    path: "/pyro/displays/{id}/go-no-go"
    description: "Weather go/no-go decision (OCC-guarded). GO -> IN_PROGRESS; NO_GO -> CANCELLED (WEATHER_NO_GO)"
    roles: [Operator]
    code: 200
    input: [decision, expected_display_event_version]
    output: DisplayEvent
    side_effects: ["weather_decision set; on GO stores final_fallout_radius_ft; on NO_GO runs cancel cascade; increments DisplayEvent.version by 1"]

  - method: POST
    path: "/pyro/displays/{id}/complete-show"
    description: "Mark firing complete (IN_PROGRESS -> SHOW_COMPLETE, termination_reason=COMPLETED)"
    roles: [Operator]
    code: 200
    input: []
    output: DisplayEvent
    side_effects: ["show_completed_at set; increments DisplayEvent.version by 1"]

  - method: POST
    path: "/pyro/displays/{id}/cancel"
    description: "Operator cancels a non-terminal, pre-show event"
    roles: [Operator]
    code: 200
    input: ["reason?"]
    output: DisplayEvent
    side_effects: ["cancel cascade: posts RELEASED, applications WITHDRAWN, auto-RETURN movements, magazine recompute; increments DisplayEvent.version by 1"]

  - method: POST
    path: "/pyro/displays/{id}/site-plans"
    description: "Create a site plan; supersedes the prior CURRENT plan (OCC-guarded)"
    roles: [Operator]
    code: 201
    input: [diagram_ref, launch_area_width_ft, launch_area_length_ft, spectator_boundary_ft, spectator_arc_center_deg, nearest_structure_ft, expected_display_event_version]
    output: SitePlan
    side_effects: ["required_spectator_distance_ft computed (c_fallout_base provisional); prior CURRENT plan -> SUPERSEDED; increments DisplayEvent.version by 1"]

  - method: GET
    path: "/pyro/displays/{id}/site-plans"
    description: "List site plans of a display (reverse reachability)"
    roles: [Operator, FireMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: SitePlan[]
    side_effects: []

  - method: POST
    path: "/pyro/displays/{id}/permit-applications"
    description: "Submit a permit application; transitions the event DRAFT -> SUBMITTED"
    roles: [Operator]
    code: 201
    input: [site_plan_id, standby_engines]
    output: PermitApplication
    side_effects: ["site_plan_version pinned; planned_hours + provisional_standby_fee_cents computed; DisplayEvent -> SUBMITTED; increments DisplayEvent.version by 1"]

  - method: GET
    path: "/pyro/displays/{id}/permit-applications"
    description: "List permit applications of a display (reverse reachability)"
    roles: [Operator, FireMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: GET
    path: "/pyro/permit-applications/{id}"
    description: "Get a permit application"
    roles: [Operator, FireMarshal]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []

  - method: GET
    path: "/pyro/permit-applications"
    description: "List permit applications (reverse reachability for PermitApplication.site_plan_id)"
    roles: [Operator, FireMarshal]
    code: 200
    input: ["site_plan_id?", "display_event_id?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []

  - method: POST
    path: "/pyro/permit-applications/{id}/approve"
    description: "FireMarshal approves the application (event -> APPROVED)"
    roles: [FireMarshal]
    code: 200
    input: ["decision_note?"]
    output: PermitApplication
    side_effects: ["reviewed_by_user_id recorded; DisplayEvent -> APPROVED"]

  - method: POST
    path: "/pyro/permit-applications/{id}/deny"
    description: "FireMarshal denies the application (event -> DENIED, terminal)"
    roles: [FireMarshal]
    code: 200
    input: [decision_note]
    output: PermitApplication
    side_effects: ["DisplayEvent -> DENIED"]

  - method: POST
    path: "/pyro/permit-applications/{id}/request-info"
    description: "FireMarshal requests revisions (application INFO_REQUESTED; event REVISION_REQUESTED)"
    roles: [FireMarshal]
    code: 200
    input: [decision_note]
    output: PermitApplication
    side_effects: ["DisplayEvent -> REVISION_REQUESTED"]

  - method: POST
    path: "/pyro/permit-applications/{id}/resubmit"
    description: "Operator resubmits after revisions (INFO_REQUESTED -> SUBMITTED; revision_count += 1)"
    roles: [Operator]
    code: 200
    input: [site_plan_id]
    output: PermitApplication
    side_effects: ["site_plan_id + version re-pinned; DisplayEvent -> SUBMITTED"]

  - method: POST
    path: "/pyro/magazines"
    description: "Register a storage magazine"
    roles: [Operator]
    code: 201
    input: [name, atf_magazine_permit, magazine_type, capacity_new_lbs, inspection_due_at]
    output: Magazine
    side_effects: ["current_new_lbs=0, posture=ACTIVE"]

  - method: GET
    path: "/pyro/magazines/{id}"
    description: "Get a magazine (includes derived posture and current_new_lbs)"
    roles: [Operator]
    code: 200
    input: []
    output: Magazine
    side_effects: []

  - method: GET
    path: "/pyro/magazines"
    description: "List magazines (reverse reachability for Magazine.operator_id)"
    roles: [Operator]
    code: 200
    input: ["operator_id?", "limit?", "offset?"]
    output: Magazine[]
    side_effects: []

  - method: POST
    path: "/pyro/magazines/{id}/batches"
    description: "Receive a product batch into a magazine (capacity + posture gated)"
    roles: [Operator]
    code: 201
    input: [product_name, un_number, shell_diameter_in, quantity_units, new_per_unit_lbs, lot_number]
    output: ProductBatch
    side_effects: ["current_new_lbs recomputed; batch status IN_MAGAZINE, qty_at_magazine=quantity_units"]

  - method: GET
    path: "/pyro/magazines/{id}/batches"
    description: "List batches in a magazine (reverse reachability)"
    roles: [Operator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProductBatch[]
    side_effects: []

  - method: GET
    path: "/pyro/batches/{id}"
    description: "Get a product batch"
    roles: [Operator]
    code: 200
    input: []
    output: ProductBatch
    side_effects: []

  - method: POST
    path: "/pyro/batches/{id}/quarantine"
    description: "Quarantine a batch (terminal); all movements blocked"
    roles: [Operator, FireMarshal]
    code: 200
    input: [reason]
    output: ProductBatch
    side_effects: ["batch -> QUARANTINED"]

  - method: POST
    path: "/pyro/batches/{id}/movements"
    description: "Record a CHECK_OUT / RETURN / EXPEND movement (transport manifest required for CHECK_OUT)"
    roles: [Operator]
    code: 201
    input: [movement_type, quantity, display_event_id, "driver_name?", "vehicle_placard?", "cdl_hazmat_endorsed?"]
    output: InventoryMovement
    side_effects: ["c_batch_quantities + c_magazine_mass applied; batch status recompute; allocation RSD gate on CHECK_OUT; fired_count updated on EXPEND; auto-close evaluation on RETURN"]

  - method: GET
    path: "/pyro/batches/{id}/movements"
    description: "List movements of a batch (reverse reachability)"
    roles: [Operator]
    code: 200
    input: ["limit?", "offset?"]
    output: InventoryMovement[]
    side_effects: []

  - method: GET
    path: "/pyro/displays/{id}/movements"
    description: "List movements serving a display (reverse reachability)"
    roles: [Operator, FireMarshal]
    code: 200
    input: ["movement_type?", "limit?", "offset?"]
    output: InventoryMovement[]
    side_effects: []

  - method: POST
    path: "/pyro/displays/{id}/weather-readings"
    description: "Append a weather reading (observed_at = server clock); allowed on any non-terminal event state — crews log weather throughout setup"
    roles: [CrewMember, Operator]
    code: 201
    input: [wind_speed_mph, gust_mph, wind_direction_deg, precipitation, source]
    output: WeatherReading
    side_effects: ["recorded_by_user_id set from X-User-ID"]

  - method: GET
    path: "/pyro/displays/{id}/weather-readings"
    description: "List weather readings of a display (reverse reachability)"
    roles: [Operator, CrewMember, FireMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: WeatherReading[]
    side_effects: []

  - method: POST
    path: "/pyro/displays/{id}/security-posts"
    description: "Create a perimeter security post; required_guards computed"
    roles: [Operator]
    code: 201
    input: [post_label, arc_degrees, radius_ft]
    output: SecurityPost
    side_effects: ["required_guards computed (c_required_guards); status UNSTAFFED"]

  - method: GET
    path: "/pyro/displays/{id}/security-posts"
    description: "List security posts of a display (reverse reachability)"
    roles: [Operator, FireMarshal]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SecurityPost[]
    side_effects: []

  - method: POST
    path: "/pyro/security-posts/{id}/assign"
    description: "Assign one guard; auto-SECURED when assigned_guards reaches required_guards"
    roles: [Operator]
    code: 200
    input: [guard_name, guard_company]
    output: SecurityPost
    side_effects: ["assigned_guards += 1; threshold auto-transition to SECURED"]

  - method: POST
    path: "/pyro/displays/{id}/misfires"
    description: "Log a misfire/dud during the show"
    roles: [CrewMember, Operator]
    code: 201
    input: [product_batch_id, shell_description, "location_note?"]
    output: MisfireRecord
    side_effects: ["soak_until = created_at + 15min; event.dud_count += 1; c_dud_halt_threshold auto-halt evaluation; increments DisplayEvent.version by 1"]

  - method: GET
    path: "/pyro/displays/{id}/misfires"
    description: "List misfire records of a display (reverse reachability)"
    roles: [Operator, FireMarshal, CrewMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MisfireRecord[]
    side_effects: []

  - method: GET
    path: "/pyro/batches/{id}/misfires"
    description: "List misfire records tied to a batch (reverse reachability)"
    roles: [Operator, FireMarshal]
    code: 200
    input: ["limit?", "offset?"]
    output: MisfireRecord[]
    side_effects: []

  - method: POST
    path: "/pyro/misfires/{id}/dispose"
    description: "Dispose of a soaked dud (LOGGED -> DISPOSED)"
    roles: [Operator]
    code: 200
    input: [disposal_method]
    output: MisfireRecord
    side_effects: ["disposed_at set; soak + event-state gates enforced"]

  - method: POST
    path: "/pyro/displays/{id}/sweeps"
    description: "Record a post-show sweep (requires all misfires DISPOSED)"
    roles: [CrewMember]
    code: 201
    input: [sweep_type, area_clear, "notes?"]
    output: SweepRecord
    side_effects: ["swept_by_crew_id set; verdict PENDING"]

  - method: GET
    path: "/pyro/displays/{id}/sweeps"
    description: "List sweeps of a display (reverse reachability)"
    roles: [Operator, FireMarshal, CrewMember]
    code: 200
    input: ["limit?", "offset?"]
    output: SweepRecord[]
    side_effects: []

  - method: POST
    path: "/pyro/sweeps/{id}/verify"
    description: "FireMarshal verifies or rejects a sweep; VERIFIED drives event SWEEP_VERIFIED and auto-close evaluation"
    roles: [FireMarshal]
    code: 200
    input: [verdict, "note?"]
    output: SweepRecord
    side_effects: ["on VERIFIED: event -> SWEEP_VERIFIED, posts RELEASED, auto-close evaluation"]

  - method: POST
    path: "/pyro/displays/{id}/incidents"
    description: "File an incident report"
    roles: [Operator, CrewMember, FireMarshal]
    code: 201
    input: [incident_type, severity, description]
    output: IncidentReport
    side_effects: ["status FILED; reported_by recorded"]

  - method: GET
    path: "/pyro/displays/{id}/incidents"
    description: "List incident reports of a display (reverse reachability)"
    roles: [Operator, FireMarshal, CrewMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []

  - method: POST
    path: "/pyro/incidents/{id}/close"
    description: "FireMarshal closes an incident (SoD: closer != reporter)"
    roles: [FireMarshal]
    code: 200
    input: [resolution_note]
    output: IncidentReport
    side_effects: ["status CLOSED; auto-close evaluation on the parent event"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller does not own the target aggregate" }
  - { id: ERR_VALIDATION, http: 400, condition: "Schema/type/enum/unknown-field/window-order violation; standby_engines_on_site mismatch; scheduled_start not in the future" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "Movement quantity or count field <= 0" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_display_event_version != current DisplayEvent.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state that permits the requested transition/action" }
  - { id: ERR_OPERATOR_SUSPENDED, http: 409, condition: "Acting operator is SUSPENDED" }
  - { id: ERR_MAGAZINE_LAPSED, http: 409, condition: "Magazine posture LAPSED (inspection overdue); intake blocked" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "Product movement attempted before the event's permit is APPROVED" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "A PermitApplication in SUBMITTED or INFO_REQUESTED already exists for the event" }
  - { id: ERR_BATCH_QUARANTINED, http: 409, condition: "Movement attempted on a QUARANTINED batch" }
  - { id: ERR_FALLOUT_EXCEEDS_BOUNDARY, http: 422, condition: "Required/adjusted fallout distance exceeds spectator boundary or structure distance" }
  - { id: ERR_WEATHER_NO_GO, http: 422, condition: "GO requested but latest reading breaches wind/gust/precipitation limits" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: same user id performed the gated prior step" }
  - { id: ERR_SCOPE_MISMATCH, http: 422, condition: "Referenced entity belongs to a different operator/display scope" }
  - { id: ERR_LICENSE_EXPIRED, http: 409, condition: "Operator license window does not contain scheduled_start_at (inclusive)" }
  - { id: ERR_CERT_NOT_VALID, http: 409, condition: "Crew cert expired at creation, or no LEAD_OPERATOR crew cert covers the show date at ready" }
  - { id: ERR_WEATHER_STALE, http: 409, condition: "No weather reading, or latest reading older than 30 minutes (exclusive)" }
  - { id: ERR_SOAK_INCOMPLETE, http: 409, condition: "Dud disposal attempted before soak_until (15 minutes after logging)" }
  - { id: ERR_SHOW_WINDOW_NOT_OPEN, http: 409, condition: "Go-no-go outside [scheduled_start - 60min, scheduled_end] (inclusive)" }
  - { id: ERR_VENUE_CONFLICT, http: 409, condition: "Venue booking with a 120-minute trailing buffer overlaps another non-terminal event at the same venue" }
  - { id: ERR_MAGAZINE_CAPACITY_EXCEEDED, http: 422, condition: "Intake would push current_new_lbs over capacity_new_lbs (exact fit allowed)" }
  - { id: ERR_INSUFFICIENT_PRODUCT, http: 409, condition: "Movement quantity exceeds available units (at magazine / at show for the event)" }
  - { id: ERR_SECURITY_NOT_SECURED, http: 409, condition: "Ready gate: zero posts or any post not SECURED" }
  - { id: ERR_NO_PRODUCT_ON_SITE, http: 409, condition: "Ready gate: net checked-out product for the event is zero" }
  - { id: ERR_SWEEP_RECONCILE_FAILED, http: 422, condition: "Sweep attempted while any misfire of the event is still LOGGED" }
  - { id: ERR_MANIFEST_NOT_COMPLIANT, http: 422, condition: "CHECK_OUT manifest non-compliant: cdl_hazmat_endorsed false" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform authority: registers and suspends operators, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /pyro/operators"
      - "POST /pyro/operators/{id}/suspend"
      - "POST /pyro/_clock/set_current_utc"
    shared_operations:
      - "GET /pyro/operators/{id}"
      - "GET /pyro/operators/{id}/crew-members"
      - "GET /pyro/displays/{id}"
  - name: Operator
    description: "Licensed pyrotechnics operator; owns displays, magazines, batches, and all show-day decisions"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /pyro/displays, POST /pyro/displays/{id}/site-plans, POST /pyro/displays/{id}/permit-applications, POST /pyro/permit-applications/{id}/resubmit"
      - "POST /pyro/displays/{id}/ready, POST /pyro/displays/{id}/go-no-go, POST /pyro/displays/{id}/complete-show, POST /pyro/displays/{id}/cancel"
      - "POST /pyro/magazines, POST /pyro/magazines/{id}/batches, POST /pyro/batches/{id}/movements"
      - "POST /pyro/displays/{id}/security-posts, POST /pyro/security-posts/{id}/assign"
      - "POST /pyro/misfires/{id}/dispose"
      - "POST /pyro/operators/{id}/crew-members"
    shared_operations:
      - "GET endpoints for own aggregates; POST /pyro/batches/{id}/quarantine (with FireMarshal); weather/misfire/incident creation (with CrewMember/FireMarshal as listed per endpoint)"
  - name: FireMarshal
    description: "Fire authority reviewer: permit decisions, standby confirmation, sweep verification, incident closure, quarantine"
    identity: opaque
    exclusive_operations:
      - "POST /pyro/permit-applications/{id}/approve, /deny, /request-info"
      - "POST /pyro/displays/{id}/standby-confirm"
      - "POST /pyro/sweeps/{id}/verify"
      - "POST /pyro/incidents/{id}/close"
    shared_operations:
      - "GET endpoints under displays/magazines/batches; POST /pyro/batches/{id}/quarantine; POST /pyro/displays/{id}/incidents"
  - name: CrewMember
    description: "Certified crew of an operator: logs weather, misfires, and sweeps; may file incidents"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /pyro/displays/{id}/sweeps"
    shared_operations:
      - "POST /pyro/displays/{id}/weather-readings, POST /pyro/displays/{id}/misfires, POST /pyro/displays/{id}/incidents, GET read endpoints as listed"
