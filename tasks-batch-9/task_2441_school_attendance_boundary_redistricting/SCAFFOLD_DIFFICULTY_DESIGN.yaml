      assert:
      - 'Call 1 returns HTTP 201: the only probe start is 2027-01-01 and units_in_window is 5.0 * 12 == 60.00 <= cap 90'
      - 'Call 2 returns HTTP 201: probes at 2027-01-01 and 2027-07-01 both yield round_half_up(60 + 5.0 * (179 / 30), 2) == 89.83, still <= cap 90'
      - 'Call 3 returns HTTP 409 with error_id == ERR_AREA_ABSORPTION_EXCEEDED: the 2027-04-01 probe yields 45.00 + 44.8333... + 40.00 == 129.83 > cap 90, even though ''Cypress Bend'' contributes only 40 units in total'
