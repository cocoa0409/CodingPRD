            - "the stale-version request returns 412 with error_id == ERR_STALE_VERSION"
            - "the fresh-version request returns 201 with ListingAgreement.${agreement_fresh}.status == DRAFT"
            - "GET /listing-agreements?region_id=${region_id} returns exactly 1 row"

      - name: err_invalid_state_is_asserted_by_a_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_STATE
        excluded_because:
          difficulty_instance: tour_requires_client_in_assigned_state
          rationale: "The cross-entity ERR_INVALID_STATE path is asserted there, and separately by four corner instances (tour cancel from COMPLETED, survey double answer, transaction close from ASSIGNED, listing accept-offer after CLOSED)."

      - name: err_no_eligible_agent_is_asserted_by_a_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NO_ELIGIBLE_AGENT
        excluded_because:
          difficulty_instance: first_assignment_boundary_at_floor_versus_ceil
          rationale: "Asserted as the empty-candidate-pool outcome of that boundary instance."

      - name: err_region_capacity_exceeded_is_asserted_by_a_difficulty_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REGION_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: referral_priority_6a_referential_out_ranks_8_fiscal
