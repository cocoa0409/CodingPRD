# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header absent, or the role is not recognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "the acting role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "a path resource id does not resolve; a zone code that does not exist also resolves here" }
  - { id: ERR_WRITE_FROZEN, http: 409, condition: "an operation writing an enrollment is attempted while Property.posture is WRITE_FROZEN" }
  - { id: ERR_RISK_ZONE_FROZEN, http: 409, condition: "an attach is attempted while the bound RiskZone.freeze_active is true" }
  - { id: ERR_POSTURE_REFERRAL_REQUIRED, http: 409, condition: "a submit is attempted while Property.posture is REFERRAL_REQUIRED" }
  - { id: ERR_AGENCY_NOT_OF_RECORD, http: 403, condition: "the acting agency in X-User-ID does not equal Enrollment.agency_id on a producer-scoped write" }
  - { id: ERR_AGENCY_INACTIVE, http: 409, condition: "a submit or recall is attempted for an agency whose active flag is false" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state from which the requested transition is declared" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_property_version does not equal the current Property.version" }
  - { id: ERR_NOTICE_PERIOD_INSUFFICIENT, http: 422, condition: "notice_period_days is not strictly greater than required_notice_days, or the policy is younger than 60 days at issue" }
  - { id: ERR_MITIGATION_LAPSED, http: 422, condition: "a mitigation requirement is verified after its due_on" }
  - { id: ERR_SCHEDULED_VALUE_CAP, http: 422, condition: "the aggregate scheduled personal property value would exceed 60 percent of Property.total_insured_value_cents" }
  - { id: ERR_COVERAGE_ABOVE_APPRAISAL, http: 422, condition: "the reported indemnity exceeds the applicable replacement-cost limit and the provision is EXTENDED or NONE" }
  - { id: ERR_COVERAGE_BELOW_REQUIRED, http: 422, condition: "Enrollment.dwelling_coverage_cents is below Enrollment.required_dwelling_coverage_cents at attach" }
  - { id: ERR_GROUND_NOT_ACTIONABLE, http: 422, condition: "a concentration-driven action is attempted when the ground is not CONCENTRATION_REVIEW or the zone band is below CRITICAL" }
  - { id: ERR_VALUATION_STALE, http: 422, condition: "Enrollment.valuation_fingerprint does not equal the property's current approved dwelling, contents and scheduled values" }
  - { id: ERR_APPRAISAL_DOC_MISMATCH, http: 422, condition: "the substantiating AppraisalDocument belongs to a different property or its item_class does not match the scheduled item type" }
  - { id: ERR_APPRAISAL_CURRENCY_EXPIRED, http: 422, condition: "the substantiating AppraisalDocument is EXPIRED, or its appraised value is below the item's declared value" }
  - { id: ERR_ENROLLMENT_NOT_BOUND, http: 409, condition: "a claim is reviewed against an enrollment that is not ATTACHED" }
  - { id: ERR_ZONE_EVENT_INACTIVE, http: 422, condition: "a defence dispatch is requested or acked while the zone event is not ACTIVE" }
  - { id: ERR_NO_ELIGIBLE_VENDOR, http: 422, condition: "a vendor poll finds no REQUESTED dispatch whose zone event is ACTIVE" }
  - { id: ERR_APPRAISAL_PROVISION_BASELINE, http: 422, condition: "a valuation provision is attempted when the superseded baseline is below 1.25x the provision value, or no approved appraisal exists" }
  - { id: ERR_APPRAISAL_METHOD_INVALID, http: 422, condition: "an appraisal is approved with a valuation method other than SITE_MEASURED" }
  - { id: ERR_BRANCH_CAPITAL_INSUFFICIENT, http: 422, condition: "a reopen is requested at a branch whose mitigated_loss_multiplier is above 1.00, meaning the zone baseline it would inherit has not been capitalised" }
  - { id: ERR_CLAIM_BELOW_DEDUCTIBLE, http: 422, condition: "a claim's reported indemnity is less than or equal to the deductible that would be applied, so there is nothing to settle" }
  - { id: ERR_INCOMPATIBLE_ENDORSEMENT, http: 422, condition: "an endorsement is attached to an enrollment whose replacement provision conflicts with it" }
  - { id: ERR_CONSULTATION_SLOT_CONFLICT, http: 409, condition: "a risk consultation booking overlaps an existing non-CANCELLED consultation of the same consultant on a half-open interval" }
  - { id: ERR_ZONE_DISPATCH_CAPACITY, http: 422, condition: "a vendor poll would place a third overlapping dispatch assignment in the same zone within a 24-hour window" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required input field is missing, an enum value is outside its declared set, or a numeric constraint is violated" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:
  - name: Underwriter
    description: "Binding authority: reviews and approves appraisals, derives posture, approves and attaches enrollments, imposes and waives mitigation requirements, decides non-renewal, and dispatches defence vendors."
    identity: opaque
    exclusive_operations:
      - "POST /hnw/properties/{id}/posture-eval"
      - "POST /hnw/appraisals/{id}/approve"
      - "POST /hnw/appraisals/{id}/provision"
      - "POST /hnw/enrollments/{id}/attach"
      - "POST /hnw/wildfire-events/vendors/poll"
      - "POST /hnw/non-renewal-notices/{id}/issue"
      - "POST /hnw/risk-zones/{id}/check_concentration"
    shared_operations:
      - "POST /hnw/properties"
      - "POST /hnw/properties/{id}/appraisals"
      - "GET /hnw/properties/{id}/appraisals"
      - "POST /hnw/properties/{id}/appraisal-documents"
      - "POST /hnw/properties/{id}/scheduled-items"
      - "POST /hnw/scheduled-items/{id}/approve"
      - "POST /hnw/properties/{id}/mitigation-requirements"
      - "GET /hnw/properties/{id}/mitigation-requirements"
      - "POST /hnw/wildfire-events/dispatches/{dispatch_id}/advance"

  - name: AgencyProducer
    description: "Agent-produced business role. Submits and withdraws enrollments on behalf of the agency of record, books risk consultations, files scheduled property, acknowledges or releases defence vendors, and withdraws appraisals."
    identity: entity_backed:Agency
    exclusive_operations:
      - "POST /hnw/appraisals/{id}/withdraw"
      - "POST /hnw/enrollments/{id}/submit"
      - "POST /hnw/enrollments/{id}/recall"
      - "POST /hnw/wildfire-events/properties/{id}/dispatch-ack"
    shared_operations:
      - "POST /hnw/properties/{id}/enrollments"
      - "POST /hnw/risk-consultations/{id}/cancel"
      - "POST /hnw/properties/{id}/scheduled-items"
      - "POST /hnw/scheduled-items/{id}/refresh-appraisal"
      - "POST /hnw/properties/{id}/risk-consultations"
      - "GET /hnw/enrollments"

  - name: ClaimsAdjuster
    description: "Handles first-party losses: reports, reviews, approves, settles and pays claims, and sets the specialty-restoration override."
    identity: opaque
    exclusive_operations:
      - "POST /hnw/enrollments/{id}/claims"
      - "POST /hnw/claims/{id}/approve"
      - "POST /hnw/claims/{id}/settle"
      - "POST /hnw/claims/{id}/pay"
      - "POST /hnw/claims/{id}/deny"
    shared_operations:
      - "GET /hnw/claims"
      - "POST /hnw/claims/{id}/review"

  - name: RiskConsultant
    description: "Delivers the complimentary risk consulting visit, issues the resulting report and imposes the recommended mitigation requirement, then verifies completed mitigation work."
    identity: opaque
    exclusive_operations:
      - "POST /hnw/mitigation-requirements/{id}/verify"
      - "POST /hnw/risk-consultations/{id}/complete"
      - "POST /hnw/risk-consultations/{id}/revisit"
      - "POST /hnw/risk-consultations/{id}/report"
    shared_operations:
      - "POST /hnw/properties/{id}/mitigation-requirements"
      - "POST /hnw/properties/{id}/risk-consultations"
      - "GET /hnw/properties/{id}/mitigation-requirements"

  - name: PlatformAdmin
    description: "Operator role owning reference configuration (zones, agencies, the logical clock) and read access across the portfolio."
    identity: opaque
    exclusive_operations:
      - "POST /hnw/_clock/set_current_utc"
      - "POST /hnw/risk-zones"
      - "POST /hnw/agencies"
      - "POST /hnw/agencies/{id}/set-active"
    shared_operations:
      - "GET /hnw/risk-zones"
      - "GET /hnw/agencies"
      - "GET /hnw/properties"
      - "GET /hnw/enrollments"
      - "GET /hnw/claims"
      - "GET /hnw/enrollments/{id}/non-renewal-notices"

  - name: ComplianceReporter
    description: "Non-writing regulatory audience that reads zones, properties, enrollments and non-renewal notices for the catastrophe-concentration filing."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /hnw/risk-zones"
      - "GET /hnw/risk-zones/{id}"
      - "GET /hnw/properties"
      - "GET /hnw/properties/{id}"
      - "GET /hnw/enrollments"
      - "GET /hnw/enrollments/{id}"
      - "GET /hnw/enrollments/{id}/non-renewal-notices"
      - "GET /hnw/claims"

  - name: Anonymous
    description: "Unauthenticated caller used to exercise the priority-1 authentication gate."
    identity: opaque
    exclusive_operations: []
    shared_operations: []
