# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3012_white_label_delivery_as_service_fulfillment
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# The first instances define YAML anchors (&c_*) for the shared base chain
# (clock -> merchant -> activate -> store -> policy -> activate policy ->
# courier -> quote -> order -> accept -> ready -> batch -> dispatch -> pickup
# -> transit -> deliver); later instances alias them (*c_*).
# Base chain parameters: merchant billing 100000, split 50, late_credit_enabled
# true; store (0,0) radius 20000 UTC; policy P1 (see difficulty file header);
# surge default 1.0; quote dropoff (0.02,0) value 5000 pickup 09:00 (quoted
# fee 500); promised 2026-09-01T02:00:00Z; batch window [00:30,01:30];
# delivered at 01:00:00Z on time.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: merchant_create_applies_defaults_and_response_envelope
        claim_type: Defaults
        grounds:
          - entities.Merchant.fields.default_refund_split_merchant_pct
          - entities.Merchant.fields.late_credit_enabled
          - entities.Merchant.fields.credit_balance_cents
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Omitting both optional config fields stores the declared defaults (split 50, late_credit_enabled true), computed credit_balance_cents initializes to 0, status is system-set ONBOARDING with version 1, and the success envelope carries meta.api_request_id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_merchant
              call: "POST /merchants"
              payload: { name: "Corner Merchant", billing_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Merchant.${m_id}.status == ONBOARDING and version == 1"
            - "Merchant.${m_id}.default_refund_split_merchant_pct == 50"
            - "Merchant.${m_id}.late_credit_enabled == true"
            - "Merchant.${m_id}.credit_balance_cents == 0"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: store_create_get_roundtrip_and_active_default
        claim_type: Creation
        grounds:
          - entities.MerchantStore
          - endpoints.POST_/merchants/{id}/stores
        distinguishing_aspect: "Store created under the merchant comes back ACTIVE by default with all input fields round-tripping through GET /stores/{id}, and the sub-resource list GET /merchants/{id}/stores contains exactly that row."
        test_recipe:
          setup:
            - "Logical clock set; merchant exists (ONBOARDING)."
          setup_api_calls:
            - *c_clock
            - *c_merchant
          trigger:
            - &c_activate
              call: "POST /merchants/${m_id}/activate"
              payload: {}
              as: PlatformAdmin
            - &c_store
              call: "POST /merchants/${m_id}/stores"
              payload: { name: "Corner Store", address_text: "1 Origin Way", lat: 0.0, lng: 0.0, delivery_radius_m: 20000, timezone: "UTC" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "GET /stores/${s_id}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
          assert:
            - "MerchantStore.${s_id}.status == ACTIVE and version == 1"
            - "MerchantStore.${s_id}.delivery_radius_m == 20000 and timezone == UTC"
            - "GET /merchants/${m_id}/stores returns exactly 1 row"

      - name: pricing_policy_create_starts_draft_and_lists
        claim_type: Retrieval
        grounds:
          - entities.PricingPolicy.fields.status
          - endpoints.GET_/merchants/{id}/pricing-policies
        distinguishing_aspect: "A created policy is DRAFT (never client-chosen), and the filtered list with status=DRAFT returns it while status=ACTIVE returns zero rows."
        test_recipe:
          setup:
            - "Logical clock set; merchant ACTIVE with store."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
          trigger:
            - &c_policy
              call: "POST /merchants/${m_id}/pricing-policies"
              payload: { distance_bands: [{max_m: 3000, base_cents: 500, per_100m_cents: 0}, {max_m: 8000, base_cents: 500, per_100m_cents: 25}, {max_m: 15000, base_cents: 1750, per_100m_cents: 40}], value_tiers: [{min_order_value_cents: 10000, surcharge_cents: 200}, {min_order_value_cents: 50000, surcharge_cents: 500}], peak_windows: [{start_local_hhmm: "11:00", end_local_hhmm: "14:00"}, {start_local_hhmm: "17:00", end_local_hhmm: "21:00"}], peak_uplift_pct: 0.25, surge_passthrough_pct: 0.5, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { p_id: $.data.id }
          assert:
            - "PricingPolicy.${p_id}.status == DRAFT and version == 1"
            - "GET /merchants/${m_id}/pricing-policies?status=DRAFT returns 1 row"
            - "GET /merchants/${m_id}/pricing-policies?status=ACTIVE returns 0 rows"

      - name: quote_computed_components_at_band_c
        claim_type: Computed Fields
        grounds:
          - entities.DeliveryQuote.fields.distance_m
          - entities.DeliveryQuote.fields.band_fee_cents
          - calculations.delivery_fee
        distinguishing_aspect: "Band C with a fractional remainder: dropoff (0.072,0) computes distance_m 8015 via the pinned Manhattan-planar formula; band fee = 1750 + ceil(15/100)*40 = 1790; off-peak and below the value tier so peak_uplift 0, surcharge 0, surge 0 at multiplier 1.0, quoted 1790; quote pins pricing_policy_id and valid_until 15 minutes out."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; merchant ACTIVE with store and policy P1 ACTIVE; surge default 1.0."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - &c_mgetv
              call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformAdmin
              captures: { m_v: $.data.version }
            - &c_pact
              call: "POST /merchants/${m_id}/pricing-policies/${p_id}/activate"
              payload: { expected_merchant_version: "${m_v}" }
              as: Merchant
              as_user_id: "${m_id}"
          trigger:
            - &c_quotec
              call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.072, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { qc_id: $.data.id }
          assert:
            - "DeliveryQuote.${qc_id}.distance_m == 8015"
            - "DeliveryQuote.${qc_id}.band_fee_cents == 1790"
            - "DeliveryQuote.${qc_id}.value_surcharge_cents == 0 and peak_uplift_cents == 0 and surge_component_cents == 0"
            - "DeliveryQuote.${qc_id}.quoted_fee_cents == 1790"
            - "DeliveryQuote.${qc_id}.pricing_policy_id == ${p_id} and status == ACTIVE"
            - "DeliveryQuote.${qc_id}.valid_until == 2026-09-01T00:15:00Z"

      - name: order_create_with_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.DeliveryOrder.fields.fulfillment_status
          - entities.DeliveryOrder.fields.merchant_id
        distinguishing_aspect: "fulfillment_status, billing_status, merchant_id and version are system/computed: a create body smuggling fulfillment_status DELIVERED and version 99 is ignored — the order persists QUOTED / PENDING with version 1 and merchant_id copied from the quote."
        test_recipe:
          setup:
            - "Base chain through an ACTIVE quote for dropoff (0.02,0)."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - &c_quote1
              call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q1}", customer_reference: "CO-1", idempotency_key: "co-1", fulfillment_status: "DELIVERED", version: 99 }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o1: $.data.id }
          assert:
            - "the response status is 201"
            - "DeliveryOrder.${o1}.fulfillment_status == QUOTED and billing_status == PENDING"
            - "DeliveryOrder.${o1}.version == 1"
            - "DeliveryOrder.${o1}.merchant_id == ${m_id} and quoted_fee_cents == 500"

      - name: tracking_event_is_append_only_without_version
        claim_type: Immutability
        grounds:
          - entities.TrackingEvent
          - endpoints.POST_/delivery-orders/{id}/tracking-events
        distinguishing_aspect: "TrackingEvent declares common_fields false: the created event carries id, created_at and system-stamped occurred_at equal to the logical clock, no version field anywhere in the response, and no update or delete endpoint exists for it."
        test_recipe:
          setup:
            - "Base chain through order created (QUOTED)."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_quote1
            - &c_order1
              call: "POST /delivery-orders"
              payload: { quote_id: "${q1}", customer_reference: "CO-1", idempotency_key: "co-1" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /delivery-orders/${o1}/tracking-events"
              payload: { event_type: "NOTE", note: "customer called", visibility: "INTERNAL_ONLY" }
              as: Courier
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { te_id: $.data.id }
          assert:
            - "the response status is 201"
            - "TrackingEvent.${te_id} response carries id, created_at and occurred_at but no version field"
            - "TrackingEvent.${te_id}.occurred_at == 2026-09-01T00:00:00Z (logical clock at emission)"
            - "TrackingEvent.${te_id}.delivery_order_id == ${o1} and visibility == INTERNAL_ONLY"
            - "GET /delivery-orders/${o1}/tracking-events as Merchant returns 0 rows (INTERNAL_ONLY hidden from branded feed)"

      - name: delivery_orders_list_pagination_and_status_filter
        claim_type: Listing
        grounds:
          - endpoints.GET_/delivery-orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three QUOTED orders, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row has_more false; fulfillment_status=ACCEPTED returns 0 — total_count spans the filtered set, not the page."
        test_recipe:
          setup:
            - "Base chain through policy ACTIVE and courier unused; three quotes consumed into three orders, none accepted."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_quote1
            - *c_order1
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "11 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q2: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q2}", customer_reference: "CO-2", idempotency_key: "co-2" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "12 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q3: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q3}", customer_reference: "CO-3", idempotency_key: "co-3" }
              as: Merchant
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /delivery-orders"
              payload: { merchant_id: "${m_id}", fulfillment_status: "QUOTED", limit: 2, offset: 0 }
              as: Merchant
              as_user_id: "${m_id}"
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /delivery-orders?merchant_id=${m_id}&fulfillment_status=QUOTED&limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /delivery-orders?merchant_id=${m_id}&fulfillment_status=ACCEPTED returns 0 rows with total_count == 0"
            - "GET /delivery-orders?merchant_id=${m_id} with no pagination params defaults limit 10 offset 0 and returns 3 rows"

      - name: store_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.MerchantStore.fields.delivery_radius_m
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "delivery_radius_m is required input with no default; omitting it is a 400 ERR_INVALID_REQUEST and no store row is persisted."
        test_recipe:
          setup:
            - "Logical clock set; merchant ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
          trigger:
            - call: "POST /merchants/${m_id}/stores"
              payload: { name: "No Radius", address_text: "1 Origin Way", lat: 0.0, lng: 0.0, timezone: "UTC" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /merchants/${m_id}/stores returns 0 rows"

      - name: order_get_with_unknown_id_returns_order_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/delivery-orders/{id}
          - errors.ERR_DELIVERY_ORDER_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated order id returns the entity-specific 404 ERR_DELIVERY_ORDER_NOT_FOUND with the error envelope, not a generic 404 and not a 400."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /delivery-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_DELIVERY_ORDER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: batch_create_checks_body_foreign_keys_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations.priority_4
          - endpoints.POST_/delivery-batches
          - errors.ERR_STORE_NOT_FOUND
          - errors.ERR_COURIER_NOT_FOUND
        distinguishing_aspect: "POST /delivery-batches declares input order store_id, courier_id, order_ids; with both store_id and courier_id unknown the 404 is ERR_STORE_NOT_FOUND (first-declared), and with only courier_id unknown it is ERR_COURIER_NOT_FOUND."
        test_recipe:
          setup:
            - "Base chain through store and policy ACTIVE; courier created (known id)."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - &c_courier
              call: "POST /couriers"
              payload: { name: "Corner Courier", max_active_deliveries: 4 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v0: $.data.version }
          trigger:
            - call: "POST /delivery-batches"
              payload: { store_id: "00000000-0000-4000-8000-000000000001", courier_id: "00000000-0000-4000-8000-000000000002", order_ids: [], dispatch_window_start: "2026-09-01T00:30:00Z", dispatch_window_end: "2026-09-01T01:30:00Z", expected_courier_version: "${c_v0}" }
              as: PlatformAdmin
              captures: { err_both: $.data.error_id }
            - call: "POST /delivery-batches"
              payload: { store_id: "${s_id}", courier_id: "00000000-0000-4000-8000-000000000002", order_ids: [], dispatch_window_start: "2026-09-01T00:30:00Z", dispatch_window_end: "2026-09-01T01:30:00Z", expected_courier_version: "${c_v0}" }
              as: PlatformAdmin
              captures: { err_courier: $.data.error_id }
          assert:
            - "first request: 404 and err_both == ERR_STORE_NOT_FOUND"
            - "second request: 404 and err_courier == ERR_COURIER_NOT_FOUND"
            - "GET /delivery-batches?store_id=${s_id} returns 0 rows"

      - name: quote_create_rejects_out_of_enum_and_type_mismatch
        claim_type: Type Constraints
        grounds:
          - validations.priority_8
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A non-numeric order_value_cents (string 'lots') is a 400 ERR_INVALID_REQUEST type error; the same payload with a valid numeric type but dropoff beyond the last band (0.2 -> 22264m > 15000) instead reaches the business constraint ERR_OUTSIDE_DELIVERY_RADIUS — distinct errors for type vs business failures."
        test_recipe:
          setup:
            - "Base chain through policy ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
          trigger:
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: "lots", pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { err_type: $.data.error_id }
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.2, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { err_band: $.data.error_id }
          assert:
            - "type-mismatch request: 400 and err_type == ERR_INVALID_REQUEST"
            - "beyond-band request: 409 and err_band == ERR_OUTSIDE_DELIVERY_RADIUS"
            - "GET /delivery-quotes?merchant_id=${m_id} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: quote_consumed_by_order_and_second_use_rejected
        claim_type: Valid Transition
        grounds:
          - state_machines.DeliveryQuote.ACTIVE_to_CONSUMED
          - errors.ERR_QUOTE_EXPIRED
        distinguishing_aspect: "Creating an order flips the quote to CONSUMED; a second order create against the same quote id fails 409 ERR_QUOTE_EXPIRED (non-ACTIVE) and no second order is persisted."
        test_recipe:
          setup:
            - "Base chain through order o1 created from quote q1."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_quote1
            - *c_order1
          trigger:
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q1}", customer_reference: "CO-2", idempotency_key: "co-2" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "GET /delivery-quotes/${q1}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
          assert:
            - "second create: 409 and err == ERR_QUOTE_EXPIRED"
            - "DeliveryQuote.${q1}.status == CONSUMED"
            - "GET /delivery-orders?merchant_id=${m_id} returns exactly 1 row"

      - name: order_happy_path_full_chain_and_batch_auto_complete
        claim_type: Valid Transition
        grounds:
          - state_machines.DeliveryOrder
          - state_machines.DeliveryBatch.DISPATCHED_to_COMPLETED
        distinguishing_aspect: "The full forward chain QUOTED->ACCEPTED->READY_FOR_PICKUP->PICKED_UP->IN_TRANSIT->DELIVERED succeeds with billing PENDING->AUTHORIZED->SETTLED, and the last order completing flips the parent batch DISPATCHED->COMPLETED automatically."
        test_recipe:
          setup:
            - "Base chain through order created and courier created."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - *c_courier
            - *c_quote1
            - *c_order1
          trigger:
            - &c_accept
              call: "POST /delivery-orders/${o1}/accept"
              payload: { promised_at: "2026-09-01T02:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
            - &c_ready
              call: "POST /delivery-orders/${o1}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - &c_batch
              call: "POST /delivery-batches"
              payload: { store_id: "${s_id}", courier_id: "${c_id}", order_ids: ["${o1}"], dispatch_window_start: "2026-09-01T00:30:00Z", dispatch_window_end: "2026-09-01T01:30:00Z", expected_courier_version: "${c_v0}" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - &c_dispatch
              call: "POST /delivery-batches/${b_id}/dispatch"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - &c_pickup
              call: "POST /delivery-orders/${o1}/confirm-pickup"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - &c_transit
              call: "POST /delivery-orders/${o1}/start-transit"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - &c_clock1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:00:00Z" }
              as: PlatformAdmin
            - &c_deliver
              call: "POST /delivery-orders/${o1}/complete-delivery"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "GET /delivery-orders/${o1}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "GET /delivery-batches/${b_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "DeliveryOrder.${o1}.fulfillment_status == DELIVERED and billing_status == SETTLED"
            - "DeliveryOrder.${o1}.delivered_at == 2026-09-01T01:00:00Z and late_credit_cents == 0"
            - "DeliveryOrder.${o1}.merchant_invoice_cents == 500 (surge 1.0 throughout: quoted == final == invoice)"
            - "Merchant.${m_id}.billing_balance_cents == 99500"
            - "DeliveryBatch.${b_id}.status == COMPLETED (auto-transition on last terminal order)"
            - "DeliveryOrder.${o1}.batch_fee_share_cents == 550 (400 + 150*1)"

      - name: pickup_without_dispatched_batch_returns_invalid_state
        claim_type: Invalid Transitions
