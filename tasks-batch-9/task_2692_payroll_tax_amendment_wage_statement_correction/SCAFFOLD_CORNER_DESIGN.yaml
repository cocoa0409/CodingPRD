          assert:
            - "HTTP status is 422"
            - "error_id is ERR_PRIOR_YEAR_WINDOW_CLOSED"
            - "GET /corrected-wage-statements?correction_case_id=${case_id} returns total_count == 0"
            - "CorrectionCase.${case_id}.statement_status is still STMT_PENDING"
            - "Employee.${e1_id}.active_statement_count == 0"
            - "the refusal is the window rule and not the reportable-delta rule: the same fixture would have produced a -400000 wage delta"

