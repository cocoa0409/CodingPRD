          assert:
            - "after issuance Party.${own_id}.units_held == 22 and certificates_held_count == 1; Party.${dev_id}.units_held == 0 and certificates_held_count == 0"
            - "after the split Party.${own_id}.units_held is still 22 while certificates_held_count == 2 — a split redistributes units across two rows and mints none"
            - "the proposal prices 8 units at appraised_reference_cents 10123448 with price_deviation_bps == -122, inside the band"
            - "the settlement returns 200 with program_fee_cents == 275000 (275 bps tier), equity_surcharge_cents == 0 (UNDERSERVED origin), net_to_seller_cents == 9725000"
            - "after the settlement Party.${own_id}.units_held == 14 with certificates_held_count == 1, and Party.${dev_id}.units_held == 8 with certificates_held_count == 1"
            - "cash after settlement: Party.${own_id}.cash_balance_cents == 9725000, Party.${dev_id}.cash_balance_cents == 0, Party.${bank_id}.fee_revenue_cents == 275000"
            - "Party.${own_id}.version and Party.${dev_id}.version are unchanged by the settlement — the recompute of the holdings counters does not touch the OCC version"
            - "after retiring all 14 remaining units Certificate.${cert_id}.lifecycle_status == RETIRED, units_retired == 14, units_remaining == 0"
            - "the delete-of-source reconciliation: Party.${own_id}.units_held == 0 and certificates_held_count == 0, while Party.${dev_id} is untouched at 8 / 1"
            - "ConservationEasement.${eas_id}.units_issued_total == 22, units_retired == 14, units_outstanding == 8 — equal to the sum of units_held across all parties"

      - name: cascading_side_effects_layer_is_covered_by_the_certification_cascade_instance
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.SeveranceApplication.APPROVED_to_CERTIFIED
          - state_machines.SendingArea.ACTIVE_to_CLOSED
        distinguishing_aspect: "The layer's own claim: an N-level chain verified end to end, with the ordering of the links observable in one response."
        excluded_because:
          difficulty_instance: certification_cascades_parcel_to_area_closure_to_sibling_suspension
          rationale: "That §1.8 transitive_cascade instance walks the four-link chain (parcel FULLY_SEVERED -> easement recorded and certificate issued -> sending area cap exhausted and CLOSED -> sibling application SUSPENDED) inside the single certify response and asserts each link plus the ordering. A separate §1.9 recipe would repeat it with fewer assertions."

      - name: dual_variant_layer_is_covered_by_the_allocation_formula_variant_instance
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.parcel_baseline_allocation.variants
        distinguishing_aspect: "The layer's own claim: both declared variants produce their expected results on identical inputs and the delta is exact."
        excluded_because:
          difficulty_instance: parcel_allocation_v1_net_acre_vs_v2_gross_discounted
          rationale: "That §1.8 dual_variant_calculation instance registers the same parcel geometry under a V1_NET_ACRE area and a V2_GROSS_DISCOUNTED area and asserts 22 against 23 with the one-unit delta explained, which is exactly this layer's claim."

      - name: rate_threshold_layer_is_covered_by_the_fee_tier_boundary_instance
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.settlement_split.constants
        distinguishing_aspect: "The layer's own claim: a cumulative money threshold tested exactly at its boundary, with the tier read off the correct base."
        excluded_because:
          difficulty_instance: settlement_fee_tier_keyed_on_gross_not_on_net_mode_c
          rationale: "That §1.8 threshold_boundary instance settles at gross 5000000 and 5000001 and asserts 350 bps against 275 bps, proving both the inclusive upper bound and that the tier is keyed on gross rather than on the post-surcharge figure."

  # ===========================================================================
  # §1.9.9 Consistency Model — consistency_model: immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_cascade_effect_is_readable_the_instant_the_response_returns
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_severance_applications_id_certify
          - entities.CertificateTransfer
          - entities.SendingParcel.fields.parcel_status
        distinguishing_aspect: "consistency_model is immediate, so nothing in this program is allowed to lag: the certify response body must already carry the issued certificate, and a GET issued immediately afterwards against every entity the cascade touched — application, parcel, easement, area, transfer log, and both list endpoints — must agree with it. No re-read, retry, or settling delay may be required, and a refused call must be invisible to every reader."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one LANDOWNER party"
            - "ACTIVE SA-EAST with sending_cap_units 200; parcel APN-001 (100.00 / 22.00 / PRIME / 2), baseline 22"
            - "a severance application for all 22 units, screened and APPROVED by rev-1"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: { recording_note: "easement recorded at the county" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
            - call: "GET /tdr/sending-parcels/${parcel_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /tdr/conservation-easements/${eas_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /tdr/sending-areas/${sa_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /tdr/certificate-transfers"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "the certify response is 201 and already carries the full certificate: serial_number 'TDR-SA-EAST-00001', units_face 22, units_remaining 22, lifecycle_status ISSUED, market_status HELD, generation 1, holder_party_id ${own_id}, conservation_easement_id ${eas_id}, issued_at 2026-08-10T00:00:00Z"
            - "the immediate GET of the parcel shows parcel_status FULLY_SEVERED, severed_units 22, remaining_units 0, easement_status RECORDED, restricted_acres 100.00 — no second call was needed to make the cascade appear"
            - "the immediate GET of the easement shows recording_status RECORDED, compliance_status COMPLIANT, units_issued_total 22, units_outstanding 22, recorded_at 2026-08-10T00:00:00Z"
            - "the immediate GET of the sending area shows severed_units_total 22 and issued_certificate_count 1 with status still ACTIVE (22 of a 200-unit cap)"
            - "the immediate GET of the transfer log lists exactly one row: transfer_type ISSUANCE, certificate_id ${cert_id}, seq_no 1, to_party_id ${own_id}, units 22, price_cents null"
            - "GET /tdr/severance-applications/${app_id} shows status CERTIFIED with certified_by_user_id admin-1 and issued_certificate_id ${cert_id}"
            - "Party.${own_id}.units_held == 22 and certificates_held_count == 1 on the very next read — the denormalized holdings do not lag"
            - "GET /tdr/certificates?holder_party_id=${own_id} returns total_count 1 and GET /tdr/conservation-easements?recording_status=RECORDED returns total_count 1 — filtered lists are consistent with the same write"
            - "a second POST /tdr/severance-applications/${app_id}/certify returns 409 ERR_APPLICATION_NOT_APPROVED and every one of the reads above is byte-identical afterwards — a refused write is invisible to readers"
