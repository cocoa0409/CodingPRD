              captures: { inv_id: "$.data.id" }
          assert:
            - "movement_bps == 2000 ((2400000 - 2000000) * 10000 / 2000000) and adjustment_pct_bps == round_half_up(2000 * 6000 / 10000) == 1200, below the 1500 cap"
            - "on acceptance Account.${acct_id}.green_price_factor_bps == 11200 and green_index_baseline_micros is re-based to 2400000"
            - "visit 1's COFFEE line kept effective_unit_price_micros == 4500000 and its CREAMER line 2000000"
            - "visit 2's COFFEE line carries effective_unit_price_micros == 5040000 while its CREAMER line is STILL 2000000 - the factor only touches green_coffee_linked products"
            - "the invoice's four PRODUCT lines are 4500, 2000, 5040 and 2000 cents: the visit-1 COFFEE line is not repriced to 5040, proving invoice assembly reuses the snapshot"
            - "pre_freight_total_cents == 13540, allied_category_count == 1 so allied_discount_bps == 0, freight_cents == 2500 (13540 < 50000), total_cents == 16040 and line_count == 5"

      - name: corner_par_sizing_diverges_between_the_two_consumption_models
        claim_type: variant_divergence
