            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-06" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/portfolios", payload: {}, as: Parent, as_user_id: "${fam}", captures: { por: $.data.id } }
          trigger:
            - { call: "POST /portfolios/${por}/submit", payload: {}, as: Parent, as_user_id: "${fam}", captures: { att1: $.data.attempt_count } }
            - { call: "POST /portfolios/${por}/evaluations", payload: { overall_outcome: "REMEDIATION_REQUIRED", subject_scores: [ { subject: "READING", score: 1 }, { subject: "WRITING", score: 1 }, { subject: "MATH", score: 1 }, { subject: "SCIENCE", score: 1 }, { subject: "SOCIAL_STUDIES", score: 1 } ] }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /portfolios/${por}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /portfolios/${por}/evaluations", payload: { overall_outcome: "REMEDIATION_REQUIRED", subject_scores: [ { subject: "READING", score: 1 }, { subject: "WRITING", score: 1 }, { subject: "MATH", score: 1 }, { subject: "SCIENCE", score: 1 }, { subject: "SOCIAL_STUDIES", score: 1 } ] }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /portfolios/${por}/submit", payload: {}, as: Parent, as_user_id: "${fam}", captures: { att3: $.data.attempt_count } }
            - { call: "POST /portfolios/${por}/evaluations", payload: { overall_outcome: "REMEDIATION_REQUIRED", subject_scores: [ { subject: "READING", score: 1 }, { subject: "WRITING", score: 1 }, { subject: "MATH", score: 1 }, { subject: "SCIENCE", score: 1 }, { subject: "SOCIAL_STUDIES", score: 1 } ] }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "GET /portfolios/${por}", payload: {}, as: Registrar, captures: { p_st: $.data.status, p_att: $.data.attempt_count, p_dec: $.data.decided_at } }
            - { call: "GET /enrollments/${enr}", payload: {}, as: Registrar, captures: { e_std: $.data.compliance_standing } }
