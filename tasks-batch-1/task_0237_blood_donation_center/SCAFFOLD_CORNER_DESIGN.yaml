          - "errors[ERR_INVALID_DEFERRAL_DURATION]"
        distinguishing_aspect: "Creating a PERMANENT deferral that carries duration_days -> ERR_INVALID_DEFERRAL_DURATION (422)."
        test_recipe:
          setup: ["A donor exists."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
