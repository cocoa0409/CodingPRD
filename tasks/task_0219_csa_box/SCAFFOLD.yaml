    description: "List waitlist entries; filter by season, member, share type, or site."
    roles: [FarmManager, DeliveryCoordinator, Member, PlatformAdmin]
    code: 200
    input: ["season_id?", "member_id?", "share_type_id?", "requested_site_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
