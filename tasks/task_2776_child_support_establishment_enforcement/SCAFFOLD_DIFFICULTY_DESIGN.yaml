            - "Clock at 2026-08-01T00:00:00Z."
            - "DIRECT_APPLICATION case, child_count 2, tanf_assistance false; CP income 200000 (MN), NCP income 300000 (TX), both VERIFIED_WAGE_RECORD; NCP LOCATED."
