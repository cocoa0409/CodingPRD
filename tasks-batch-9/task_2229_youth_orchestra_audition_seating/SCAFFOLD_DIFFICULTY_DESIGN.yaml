# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Grounded entirely in SCAFFOLD.yaml §1.1-§1.7. Every numeric assert below was
# computed by executing the referenced §1.3 formula against the pinned fixture
# inputs. Logical clock starts at 2026-08-01T00:00:00Z per §1.5.

scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: audition_composite_provisional_vs_final_diverge
        grounds:
          - calculations.audition_composite
          - calculations.panelist_weighted_total
          - entities.Audition.fields.composite_provisional_score
          - entities.Audition.fields.composite_final_score
          - state_machines.Audition.SCHEDULED_to_SCORED
          - state_machines.Audition.SCORED_to_ADJUDICATED
        distinguishing_aspect: |
          This dual variant lives in the ARTISTIC EVALUATION domain (Audition
          scoring): the PROVISIONAL variant is a plain mean over all four sheets
          (81.35) while the FINAL variant trims the single highest and single
          lowest sheet (82.10) - the same four PanelScore rows produce two
          different numbers on the same Audition row.
        test_recipe:
          setup:
            - "One season in AUDITIONS_OPEN with a 4-panelist VIOLIN slot whose quorum_required is 4."
            - "One VIOLIN member with a SCHEDULED audition in that slot and no PanelScore rows yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Ada Strings", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1 }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel One", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Two", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p2_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Three", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p3_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Four", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p4_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T10:30:00Z", panelist_ids: ["${p1_id}", "${p2_id}", "${p3_id}", "${p4_id}"], instrument_focus: "VIOLIN", quorum_required: 4, capacity: 4 }
              as: RegistrarStaff
              captures: { slot_id: "$.data.id" }
            - call: "POST /auditions"
              payload: { member_id: "${m1_id}", season_id: "${season_id}", declared_program: "Bruch Concerto mvt I", excerpt_ids: ["EX1"], scale_attested: true }
              as: Guardian
              as_user_id: "${m1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /auditions/${a1_id}/schedule"
              payload: { slot_id: "${slot_id}" }
              as: RegistrarStaff
          trigger:
            - call: "POST /auditions/${a1_id}/panel-scores"
              payload: { panelist_id: "${p1_id}", tone_score: 22, rhythm_score: 20, intonation_score: 21, sight_reading_score: 18 }
              as: Panelist
              as_user_id: "${p1_id}"
            - call: "POST /auditions/${a1_id}/panel-scores"
              payload: { panelist_id: "${p2_id}", tone_score: 25, rhythm_score: 24, intonation_score: 23, sight_reading_score: 22 }
              as: Panelist
              as_user_id: "${p2_id}"
            - call: "POST /auditions/${a1_id}/panel-scores"
              payload: { panelist_id: "${p3_id}", tone_score: 18, rhythm_score: 17, intonation_score: 16, sight_reading_score: 15 }
              as: Panelist
              as_user_id: "${p3_id}"
            - call: "POST /auditions/${a1_id}/panel-scores"
              payload: { panelist_id: "${p4_id}", tone_score: 21, rhythm_score: 22, intonation_score: 20, sight_reading_score: 19 }
              as: Panelist
              as_user_id: "${p4_id}"
              captures: { ps4_weighted: "$.data.weighted_total" }
            - call: "POST /auditions/${a1_id}/adjudicate"
              payload: {}
              as: ArtisticDirector
          assert:
            - "The four PanelScore.weighted_total values are exactly 81.80, 94.60, 66.60, 82.40"
            - "Audition.${a1_id}.status == ADJUDICATED"
            - "Audition.${a1_id}.composite_provisional_score == 81.35"
            - "Audition.${a1_id}.composite_final_score == 82.10"
            - "composite_final_score - composite_provisional_score == 0.75 (the two variants disagree on identical input)"
            - "Audition.${a1_id}.tier_recommendation == PHILHARMONIC"
            - "Audition.${a1_id}.submitted_score_count == 4"

      - name: tuition_preliminary_vs_final_assessment_diverge
        grounds:
          - calculations.tuition_assessment
          - entities.TuitionAccount.fields.assessment_variant
          - entities.TuitionAccount.fields.assessed_cents
          - entities.TuitionAccount.fields.sibling_discount_cents
          - entities.TuitionAccount.fields.loyalty_credit_cents
          - state_machines.TuitionAccount.PENDING_ASSESSMENT_to_CURRENT
        distinguishing_aspect: |
          This dual variant lives in the BILLING domain on a different entity
          (TuitionAccount, not Audition) and on a different metric (cents, not a
          score): the PRELIMINARY variant zeroes both discount components and
          assesses 123223, the FINAL variant subtracts the two independently
          rounded components and assesses 109053 for the very same member.
        test_recipe:
          setup:
            - "Season with tuition_base_cents 123223 and a PHILHARMONIC ensemble (tier multiplier 1.00), so gross_cents is exactly 123223."
            - "Member with sibling_enrolled true and years_in_org 1, holding an ACCEPTED placement and therefore a PRELIMINARY tuition account."
