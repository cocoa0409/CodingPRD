          - validations.priority_38_ERR_CHEMICAL_PARITY_VIOLATION
          - validations.priority_39_ERR_CLEANING_TOO_EARLY
          - calculations.chemical_cycle_dosing
          - calculations.line_compliance_projection
          - endpoints.POST_cleaning_cycles
        distinguishing_aspect: |
          P36 (crew credential) vs P38 (chemistry history) on
          POST /cleaning-cycles. Both rules are violated by the same body
          because the line's last_chemical_type is already CAUSTIC AND the
          assigned technician is not caustic_certified; the credential error
          wins. Re-logging the same CAUSTIC chemistry from a certified
          technician's own visit isolates P38, and switching to ACID clears
