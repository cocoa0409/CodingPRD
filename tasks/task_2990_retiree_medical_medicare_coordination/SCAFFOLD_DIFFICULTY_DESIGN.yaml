      - name: determination_certified_appeal_reversal_cycle
        grounds:
          - state_machines.EligibilityDetermination.CERTIFIED_to_UNDER_APPEAL
          - state_machines.EligibilityDetermination.UNDER_APPEAL_to_CERTIFIED
          - entities.EligibilityDetermination.fields.outcome
          - entities.EligibilityDetermination.fields.appeal_decision
          - entities.Retiree.fields.eligibility_status
          - validations[priority=19]
        distinguishing_aspect: |
          EligibilityDetermination is cyclic, not linear: the same row traverses
          CERTIFIED -> UNDER_APPEAL -> CERTIFIED twice in one test, and the two
          returns differ - a REVERSE decision flips outcome from INELIGIBLE to
          ELIGIBLE while an UPHOLD decision returns to the same state leaving
          outcome ELIGIBLE untouched, so the destination state alone does not
          determine the observable result.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-20T00:00:00Z."
            - "PlanYear 2027 in status OPEN."
            - "Retiree R3 exists with credited_service_months 143, so service_years 11, age_years_at_retirement 63 and points 74."
            - "R3 holds a determination in status CERTIFIED with outcome INELIGIBLE, and Retiree.eligibility_status is INELIGIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
