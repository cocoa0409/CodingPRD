        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z and the standards are declared (LEVEL_II min volume 300, LEVEL_III min volume 500)."
            - "Regional NICU A is a REGIONAL_CENTER with annual_admission_volume 400; Community Hospital B is a COMMUNITY unit with annual_admission_volume 300."
          setup_api_calls:
            - *c_clock
            - *c_std1
            - *c_std2
            - *c_std3
            - *c_unit_a
            - *c_unit_b
