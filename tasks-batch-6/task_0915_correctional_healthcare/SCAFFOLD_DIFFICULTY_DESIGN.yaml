  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_records_preempts_dot_observation_check
        grounds:
          - "validations[priority=7]"
          - "validations[priority=20]"
          - "errors[ERR_RECORDS_FROZEN]"
          - "errors[ERR_DOT_OBSERVATION_REQUIRED]"
        distinguishing_aspect: |
          Category pair `state` (priority 7, ERR_RECORDS_FROZEN) versus `business_safety`
          (priority 20, ERR_DOT_OBSERVATION_REQUIRED): one request violates both and the
          records write-gate wins; lifting the freeze exposes the safety error underneath.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One inmate with an ACTIVE DOT order carrying one SCHEDULED dose."
            - "The inmate's records_state set to FROZEN by a litigation hold, custody_status still IN_CUSTODY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
              payload: { booking_number: "B-1110", full_name: "Nico Osei", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z", admission_type: "NEW_BOOKING" }
              as: IntakeOfficer
              captures: { inm: $.data.id, inm_v1: $.data.version }
            - call: "POST /medication-orders"
              payload: { inmate_id: "${inm}", drug_name: "Sertraline", drug_class: "PSYCHOTROPIC", route_mode: "DOT", doses_per_day: 1, start_date: "2026-05-01T00:00:00Z", end_date: "2026-05-10T00:00:00Z", expected_inmate_version: "${inm_v1}" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ord: $.data.id }
            - call: "POST /medication-orders/${ord}/administrations"
              payload: { scheduled_at: "2026-05-01T08:00:00Z" }
              as: Nurse
              as_user_id: "u-nurse-1"
              captures: { adm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates/${inm}/records-freeze"
              payload: {}
              as: HealthServicesAdmin
          trigger:
            - call: "POST /medication-administrations/${adm}/record"
              payload: { outcome: "ADMINISTERED" }
              as: Nurse
              as_user_id: "u-nurse-1"
            - call: "POST /inmates/${inm}/records-unfreeze"
              payload: {}
              as: HealthServicesAdmin
            - call: "POST /medication-administrations/${adm}/record"
              payload: { outcome: "ADMINISTERED" }
              as: Nurse
              as_user_id: "u-nurse-1"
          assert:
            - "The first trigger call returns 409 with error_id ERR_RECORDS_FROZEN, not ERR_DOT_OBSERVATION_REQUIRED"
            - "The third trigger call returns 422 with error_id ERR_DOT_OBSERVATION_REQUIRED"
            - "MedicationAdministration.${adm}.outcome == SCHEDULED"
            - "MedicationOrder.${ord}.adherence_pct == 0.00"

      - name: order_not_active_preempts_segregation_of_duties
        grounds:
          - "validations[priority=17]"
          - "validations[priority=23]"
          - "errors[ERR_ORDER_NOT_ACTIVE]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: |
          A DIFFERENT category pair from the freeze conflict: `business_referential`
          (priority 17, ERR_ORDER_NOT_ACTIVE) versus `business_safety` (priority 23,
          ERR_SEGREGATION_OF_DUTIES). The same request violates both because the order is
          HELD and the acting X-User-ID equals the prescriber; the referential error wins.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T08:00:00Z."
            - "An ACTIVE DOT order written by user u-101 acting as Provider, then placed on HOLD."
            - "One SCHEDULED dose under that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthServicesAdmin
            - call: "POST /inmates"
