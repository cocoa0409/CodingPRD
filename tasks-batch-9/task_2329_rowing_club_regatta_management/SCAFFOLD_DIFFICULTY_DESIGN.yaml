  - rule_id: boundary_precision_check
    instances:
      - name: cold_water_strict_lt_vs_inclusive_combined_sum_lte
        grounds:
          - calculations.water_posture_evaluation
          - entities.WaterConditionReading.fields.cold_water_flag
          - entities.WaterConditionReading.fields.posture
        distinguishing_aspect: |
          Two readings posted through POST /boathouse/water-condition-readings straddle the two
          deliberately different comparison operators on the same metric family: water_temp_c
          exactly 12.8 is NOT cold because that test is strictly `<`, while a water+air sum of
          exactly 30.0 IS cold because that test is inclusive `<=`, flipping the posture from OPEN
          to RESTRICTED.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one member acting as SafetyOfficer; no sessions, hulls or regattas required"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Sam Officer", tier: "COMPETITIVE", body_weight_kg: 80.0, club_roles: [], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { officer_id: $.data.id }
          trigger:
            - call: "POST /boathouse/water-condition-readings"
              payload: { observed_at: "2026-08-01T05:00:00Z", air_temp_c: 25.0, water_temp_c: 12.8, wind_speed_kt: 5.0, visibility_m: 3000, traffic_pattern: "STANDARD_COUNTERCLOCKWISE" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { reading_edge_id: $.data.id }
            - call: "POST /boathouse/water-condition-readings"
              payload: { observed_at: "2026-08-01T05:30:00Z", air_temp_c: 17.1, water_temp_c: 12.9, wind_speed_kt: 5.0, visibility_m: 3000, traffic_pattern: "STANDARD_COUNTERCLOCKWISE" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { reading_sum_id: $.data.id }
          assert:
            - "WaterConditionReading.${reading_edge_id}.cold_water_flag == false (12.8 < 12.8 is false and 12.8 + 25.0 == 37.8 is not <= 30.0)"
            - "WaterConditionReading.${reading_edge_id}.posture == OPEN"
            - "WaterConditionReading.${reading_sum_id}.cold_water_flag == true (12.9 + 17.1 == 30.0 satisfies the inclusive <= test even though 12.9 clears the 12.8 strict test)"
            - "WaterConditionReading.${reading_sum_id}.posture == RESTRICTED"
            - "both readings carry no version field, being an immutable common_fields: false entity"

      - name: coxswain_deadweight_strict_gt_boundary_pass_and_fail
        grounds:
          - calculations.coxswain_deadweight_check
          - entities.LineupSeat.fields.deadweight_kg
          - entities.LineupSeat.fields.weigh_in_status
          - validations[priority=38]
          - state_machines.RegattaEntry.SUBMITTED_to_LINEUP_DECLARED
        distinguishing_aspect: |
          A different metric on a different endpoint (POST /boathouse/lineup-seats/{id}/weigh-in):
          a coxswain weighed at exactly 40.0 kg produces deadweight 15.0 which PASSES because the
          comparison is strictly `>` MAX_ENTRY_DEADWEIGHT_KG, while 39.9 kg produces 15.1 and
          FAILS, demoting only the failing entry.
        test_recipe:
          setup:
            - "one coach, one race official, two certified coxswains, four rowers with current swim tests (shared across both entries), two 4+ hulls"
            - "one HOME regatta with entry_deadline_at 2026-08-10T00:00:00Z and the weigh-in window 2026-08-12T06:00:00Z..07:00:00Z"
            - "two 4+ entries submitted at clock 2026-08-01T00:00:00Z (total_fee_cents 13500 each), each with its coxswain seat in weigh_in_status PENDING"
            - "clock moved to 2026-08-12T06:30:00Z, inside the half-open weigh-in window"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Olga Official", tier: "RECREATIONAL", body_weight_kg: 68.0, club_roles: [] }
              as: ClubAdmin
