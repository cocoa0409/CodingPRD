            - { call: "POST /promotional-offers/${pr_b}/publish", payload: {}, as: PricingAnalyst, captures: { err_b: $.data.error_id } }
            - { call: "POST /promotional-offers", payload: { product_id: "${p_ovp}", market_code: "US-WEST", promo_rate_bp: 450, promo_term_days: 30, enrollment_start: "2026-09-01", enrollment_end: "2026-09-15", min_opening_balance_cents: 0, rollover_treatment: "ROLL_TO_SHEET" }, as: PricingAnalyst, captures: { pr_c: $.data.id } }
            - { call: "POST /promotional-offers/${pr_c}/publish", payload: {}, as: PricingAnalyst, captures: { pr_c_st: $.data.status } }
          assert:
            - "P2 start 2026-08-31 == P1 end 2026-08-31: publish rejected with ERR_PROMO_WINDOW_OVERLAP (closed intervals touch)"
            - "P3 start 2026-09-01 (one day later): publish succeeds, status SCHEDULED"

  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: exception_apply_revoke_restores_sheet_rate
        grounds:
          - state_machines.ExceptionPricingRequest.APPROVED_to_APPLIED
          - state_machines.ExceptionPricingRequest.APPLIED_to_REVOKED
          - calculations.effective_account_rate
        distinguishing_aspect: |
          Conserved quantity: the account's sheet-derived rate value. Apply (150 -> 175) paired
          with its compensating REVOKE returns current_rate_bp to exactly 150 and clears all
          exception fields — no drift from the round-trip.
        test_recipe:
          setup:
            - "P-CCI (SAVINGS, term 0, WHOLE_BALANCE, cap 500) with EFFECTIVE single-tier sheet [0,unbounded)@150 in US-WEST (effective 2026-08-15, lead 7, floor 0)"
            - "Account AC 1,000,000 (sheet rate 150); exception X1 request 175 (delta 25, BRANCH tier) APPROVED by a different banker"
          setup_api_calls:
            - { call: "POST /deposit-products", payload: { product_code: "CCI", product_class: "SAVINGS", term_months: 0, tier_application: "WHOLE_BALANCE", rate_cap_bp: 500, allows_promos: true, allows_exceptions: true }, as: OperationsAdmin, captures: { p_cci: $.data.id } }
            - { call: "POST /rate-sheets", payload: { product_id: "${p_cci}", market_code: "US-WEST", effective_date: "2026-08-15", disclosure_lead_days: 7, margin_floor_bp: 0, tiers: [ { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: -1, rate_bp: 150, projected_balance_cents: 1000000 } ] }, as: PricingAnalyst, captures: { s_cci: $.data.id } }
            - { call: "POST /rate-sheets/${s_cci}/submit", payload: {}, as: PricingAnalyst }
            - { call: "POST /rate-sheets/${s_cci}/review-decision", payload: { decision: "APPROVE" }, as: PricingCommittee }
            - { call: "POST /rate-sheets/${s_cci}/schedule", payload: {}, as: PricingAnalyst }
            - { call: "GET /rate-deployments", payload: { sheet_id: "${s_cci}" }, as: ChannelOperator, captures: { d0: "$.data[0].id", d1: "$.data[1].id", d2: "$.data[2].id", d3: "$.data[3].id" } }
            - { call: "POST /rate-deployments/${d0}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d1}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d2}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "POST /rate-deployments/${d3}/execution", payload: { action: "DEPLOY" }, as: ChannelOperator }
            - { call: "GET /disclosure-notices", payload: { sheet_id: "${s_cci}" }, as: ComplianceOfficer, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id", n3: "$.data[3].id" } }
            - { call: "POST /disclosure-notices/${n0}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n1}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n2}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /disclosure-notices/${n3}/resolution", payload: { action: "SEND" }, as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: OperationsAdmin }
            - { call: "POST /rate-sheets/${s_cci}/activate", payload: {}, as: PricingAnalyst }
            - { call: "POST /deposit-accounts", payload: { customer_ref: "CCI1", product_id: "${p_cci}", market_code: "US-WEST", opening_balance_cents: 1000000, channel: "BRANCH" }, as: BranchBanker, captures: { ac: $.data.id, ac_rate0: $.data.current_rate_bp } }
            - { call: "POST /exception-pricing-requests", payload: { account_id: "${ac}", sheet_id: "${s_cci}", requested_rate_bp: 175, term_days: 60 }, as: BranchBanker, as_user_id: "banker-1", captures: { x1: $.data.id } }
            - { call: "POST /exception-pricing-requests/${x1}/decision", payload: { decision: "APPROVE" }, as: BranchBanker, as_user_id: "banker-2" }
          trigger:
            - { call: "POST /exception-pricing-requests/${x1}/apply", payload: {}, as: BranchBanker, as_user_id: "banker-1", captures: { x1_st: $.data.status } }
            - { call: "GET /deposit-accounts/${ac}/rate-quote", payload: {}, as: BranchBanker, captures: { q_applied: $.data.current_rate_bp, q_applied_rs: $.data.rate_source } }
            - { call: "POST /exception-pricing-requests/${x1}/decision", payload: { decision: "REVOKE" }, as: PricingCommittee, as_user_id: "committee-9", captures: { x1_st2: $.data.status } }
            - { call: "GET /deposit-accounts/${ac}/rate-quote", payload: {}, as: BranchBanker, captures: { q_revoked: $.data.current_rate_bp, q_revoked_rs: $.data.rate_source, q_revoked_xr: $.data.exception_rate_bp } }
          assert:
            - "before apply: current_rate_bp == 150 (pure sheet rate)"
            - "after apply: X1 APPLIED; account rate_source == EXCEPTION, current_rate_bp == 175"
            - "after REVOKE: X1 REVOKED; account rate_source == SHEET, exception_rate_bp == null"
            - "INVARIANT: post-revoke current_rate_bp == 150 == pre-apply value — apply+revoke conserves the sheet-derived rate"

