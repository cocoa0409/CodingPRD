              as: Customer
              as_user_id: "${c10_id}"
              captures: { o10_id: $.data.id }
            - call: "POST /orders/${o10_id}/lines"
              payload: { item_id: "${ch10_id}", quantity: 5 }
              as: Customer
              as_user_id: "${c10_id}"
              captures: { o10_v: $.data.version }
            - call: "POST /orders/${o10_id}/confirm"
              payload: { expected_order_version: "${o10_v}" }
              as: Customer
              as_user_id: "${c10_id}"
              captures: { o10_v_conf: $.data.version }
          trigger:
            - call: "POST /orders/${o10_id}/deposit/settle"
              payload: { disposition: "FORFEIT", forfeit_amount_cents: 999999, expected_order_version: "${o10_v_conf}", reason: "over" }
              as: DepositAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_NOT_RETURNED"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: inventory_capacity_exact_boundary_on_confirm
        grounds:
          - validations[priority=8]
          - calculations.deposit_held_balance
          - entities.CatalogItem.fields.total_units
        distinguishing_aspect: |
          Aggregate-capacity boundary on POST /orders/{id}/confirm: with total_units=100
          and 60 units already RESERVED over an overlapping window, a 40-unit line
          (60+40==100) confirms, but a 41-unit line (60+41==101 > 100) is rejected with
          ERR_INVENTORY_UNAVAILABLE. Exact >= total_units cutover.
        test_recipe:
          setup:
            - "CatalogItem CHAIRB (total_units=100, daily=200, disc=0, deposit_per_unit=0, requires_coi=false). Customer C11."
            - "Order OA reserves 60 chairs over 2026-06-01..2026-06-03 (CONFIRMED)."
            - "Order OB reserves 41 chairs over 2026-06-03..2026-06-05 (overlaps OA on Jun 3): 60+41=101 > 100."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-B", name: "Chair B", category: "CHAIR", total_units: 100, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { chb_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c11@x.com", full_name: "C Eleven", phone: "555-0011" }
              as: RentalAgent
              captures: { c11_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c11_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-03T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c11_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /orders/${oa_id}/lines"
              payload: { item_id: "${chb_id}", quantity: 60 }
              as: Customer
              as_user_id: "${c11_id}"
              captures: { oa_v: $.data.version }
            - call: "POST /orders/${oa_id}/confirm"
              payload: { expected_order_version: "${oa_v}" }
              as: Customer
              as_user_id: "${c11_id}"
            - call: "POST /orders"
              payload: { customer_id: "${c11_id}", fulfillment: "WILL_CALL", event_start: "2026-06-03T00:00:00.000Z", event_end: "2026-06-05T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c11_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /orders/${ob_id}/lines"
              payload: { item_id: "${chb_id}", quantity: 41 }
              as: Customer
              as_user_id: "${c11_id}"
              captures: { ob_v: $.data.version }
          trigger:
            - call: "POST /orders/${ob_id}/confirm"
              payload: { expected_order_version: "${ob_v}" }
              as: Customer
              as_user_id: "${c11_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVENTORY_UNAVAILABLE"

      - name: big_event_surcharge_unit_threshold_boundary
        grounds:
          - calculations.delivery_fee
          - entities.RentalOrder.fields.delivery_fee_cents
        distinguishing_aspect: |
          Different metric (unit-count threshold, not aggregate capacity) and different
          observation channel (delivery_fee on confirm): 99 units => no surcharge
          (fee 5000 LOCAL base), 100 units => +4000 surcharge (fee 9000). Exact
          BIG_EVENT_UNIT_THRESHOLD=100 cutover.
        test_recipe:
          setup:
            - "CatalogItem CHAIRC (total_units=200, daily=200, disc=0, deposit_per_unit=0, requires_coi=false). Customer C12; Venue V12 (LOCAL)."
            - "DELIVERY order OC (1 day) with 99 chairs => subtotal 99*200=19800 (<200000), units 99 (<100) => delivery_fee = LOCAL base 5000, no surcharge."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-C", name: "Chair C", category: "CHAIR", total_units: 200, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { chc_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c12@x.com", full_name: "C Twelve", phone: "555-0012" }
              as: RentalAgent
              captures: { c12_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c12_id}", name: "Hall 12", address: "12 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c12_id}"
              captures: { v12_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c12_id}", venue_id: "${v12_id}", fulfillment: "DELIVERY", event_start: "2026-06-22T00:00:00.000Z", event_end: "2026-06-22T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c12_id}"
              captures: { oc_id: $.data.id }
            - call: "POST /orders/${oc_id}/lines"
              payload: { item_id: "${chc_id}", quantity: 99 }
              as: Customer
              as_user_id: "${c12_id}"
              captures: { oc_v: $.data.version }
          trigger:
            - call: "POST /orders/${oc_id}/confirm"
              payload: { expected_order_version: "${oc_v}" }
              as: Customer
              as_user_id: "${c12_id}"
          assert:
            - "RentalOrder.${oc_id}.delivery_fee_cents == 5000"
            - "RentalOrder.${oc_id}.rental_subtotal_cents == 19800"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_requires_venue_coi_valid
        grounds:
          - validations[priority=7]
          - calculations.venue_coi_status
          - state_machines.InsuranceCertificate.field=status.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Entity pair RentalOrder -> Venue/InsuranceCertificate: a requires_coi line
          can only be confirmed when the order's Venue has an APPROVED COI covering
          the event window; a SUBMITTED-only COI yields coi_status=PENDING and confirm
          fails with ERR_COI_REQUIRED.
        test_recipe:
          setup:
            - "CatalogItem TENT3 (requires_coi=true, total_units=5, daily=30000, disc=0, deposit_per_unit=0). Customer C13; Venue V13 (LOCAL)."
            - "A SUBMITTED (not approved) COI covering the window => coi_status PENDING."
            - "DELIVERY order O13 (2026-08-10..2026-08-10), one tent line."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "TENT-3", name: "Tent 3", category: "TENT", total_units: 5, daily_rate_cents: 30000, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: true }
              as: RentalAgent
              captures: { tent3_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c13@x.com", full_name: "C Thirteen", phone: "555-0013" }
              as: RentalAgent
              captures: { c13_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c13_id}", name: "Hall 13", address: "13 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c13_id}"
              captures: { v13_id: $.data.id }
            - call: "POST /venues/${v13_id}/certificates"
              payload: { carrier_name: "Acme", coverage_start: "2026-08-09T00:00:00.000Z", coverage_end: "2026-08-12T00:00:00.000Z", coverage_amount_cents: 100000000 }
              as: Customer
              as_user_id: "${c13_id}"
              captures: { coi13_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c13_id}", venue_id: "${v13_id}", fulfillment: "DELIVERY", event_start: "2026-08-10T00:00:00.000Z", event_end: "2026-08-10T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c13_id}"
              captures: { o13_id: $.data.id }
            - call: "POST /orders/${o13_id}/lines"
              payload: { item_id: "${tent3_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c13_id}"
              captures: { o13_v: $.data.version }
          trigger:
            - call: "POST /orders/${o13_id}/confirm"
              payload: { expected_order_version: "${o13_v}" }
              as: Customer
              as_user_id: "${c13_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_COI_REQUIRED"

      - name: order_fulfill_requires_dropoff_run_completed
        grounds:
          - validations[priority=11]
          - state_machines.RentalOrder.field=booking_status.CONFIRMED_to_FULFILLED
          - state_machines.DeliveryRun.field=status.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Entity pair RentalOrder -> DeliveryRun (different pair from instance 1): a
          DELIVERY order can move CONFIRMED->FULFILLED only after its DROP_OFF
          DeliveryRun is COMPLETED; a still-SCHEDULED run blocks fulfill with
          ERR_DELIVERY_NOT_COMPLETED.
        test_recipe:
          setup:
            - "CatalogItem CHAIR14 (total_units=20, daily=200, deposit_per_unit=0). Customer C14; Venue V14 (LOCAL). Crew CR14."
            - "DELIVERY order O14 (2026-07-05..2026-07-05) confirmed (1 chair). DROP_OFF run R14 scheduled but NOT completed."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-14", name: "Chair 14", category: "CHAIR", total_units: 20, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { ch14_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c14@x.com", full_name: "C Fourteen", phone: "555-0014" }
              as: RentalAgent
              captures: { c14_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c14_id}", name: "Hall 14", address: "14 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c14_id}"
              captures: { v14_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c14_id}", venue_id: "${v14_id}", fulfillment: "DELIVERY", event_start: "2026-07-05T00:00:00.000Z", event_end: "2026-07-05T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c14_id}"
              captures: { o14_id: $.data.id }
            - call: "POST /orders/${o14_id}/lines"
              payload: { item_id: "${ch14_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c14_id}"
              captures: { o14_v: $.data.version }
            - call: "POST /orders/${o14_id}/confirm"
              payload: { expected_order_version: "${o14_v}" }
              as: Customer
              as_user_id: "${c14_id}"
            - call: "POST /crews"
              payload: { name: "Truck 14", turnaround_minutes: 0 }
              as: RentalAgent
              captures: { cr14_id: $.data.id }
            - call: "POST /delivery-runs"
              payload: { order_id: "${o14_id}", leg: "DROP_OFF", crew_id: "${cr14_id}", window_start: "2026-07-05T08:00:00.000Z", window_end: "2026-07-05T09:00:00.000Z" }
              as: RentalAgent
              captures: { r14_id: $.data.id }
          trigger:
            - call: "POST /orders/${o14_id}/fulfill"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DELIVERY_NOT_COMPLETED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inventory_closed_interval_aggregate_capacity_overlap
        grounds:
          - validations[priority=8]
          - entities.OrderLine.fields.reserved_window_start
          - entities.CatalogItem.fields.total_units
        distinguishing_aspect: |
          CatalogItem inventory uses CLOSED inclusive-day intervals with AGGREGATE
          capacity: two orders whose [event_start,event_end] day spans share even one
          day sum their reserved quantities against total_units. Order A (Jun1-3, 80
          units) and Order B (Jun3-5, 30 units) share Jun3 => 80+30=110 > total_units
          100 => ERR_INVENTORY_UNAVAILABLE.
        test_recipe:
          setup:
            - "CatalogItem CHAIRD (total_units=100, daily=200, deposit_per_unit=0, requires_coi=false). Customer C15."
            - "Order OD1 reserves 80 chairs Jun1-3 (CONFIRMED). Order OD2 reserves 30 chairs Jun3-5 (overlaps Jun3)."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-D", name: "Chair D", category: "CHAIR", total_units: 100, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { chd_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c15@x.com", full_name: "C Fifteen", phone: "555-0015" }
              as: RentalAgent
              captures: { c15_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c15_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-03T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c15_id}"
              captures: { od1_id: $.data.id }
            - call: "POST /orders/${od1_id}/lines"
              payload: { item_id: "${chd_id}", quantity: 80 }
              as: Customer
              as_user_id: "${c15_id}"
              captures: { od1_v: $.data.version }
            - call: "POST /orders/${od1_id}/confirm"
              payload: { expected_order_version: "${od1_v}" }
              as: Customer
              as_user_id: "${c15_id}"
            - call: "POST /orders"
              payload: { customer_id: "${c15_id}", fulfillment: "WILL_CALL", event_start: "2026-06-03T00:00:00.000Z", event_end: "2026-06-05T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c15_id}"
              captures: { od2_id: $.data.id }
            - call: "POST /orders/${od2_id}/lines"
              payload: { item_id: "${chd_id}", quantity: 30 }
              as: Customer
              as_user_id: "${c15_id}"
              captures: { od2_v: $.data.version }
          trigger:
            - call: "POST /orders/${od2_id}/confirm"
              payload: { expected_order_version: "${od2_v}" }
              as: Customer
              as_user_id: "${c15_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVENTORY_UNAVAILABLE"

      - name: crew_half_open_plus_turnaround_buffer_overlap
        grounds:
          - validations[priority=9]
          - entities.Crew.fields.turnaround_minutes
          - state_machines.DeliveryRun.field=status.ATTEMPTED_to_SCHEDULED
        distinguishing_aspect: |
          Crew runs use HALF-OPEN [window_start,window_end) intervals with an ADDITIVE
          turnaround buffer and SINGLE occupancy (one run at a time) — different
          interval arithmetic and a different resource (Crew, not CatalogItem). With
          turnaround=60, a run [09:00,10:00) conflicts with a second [10:30,11:30)
          because 10:00+60min=11:00 > 10:30.
        test_recipe:
          setup:
            - "Crew CR16 (turnaround_minutes=60). Customer C16; two DELIVERY orders O16a,O16b each confirmed with 1 chair."
            - "Run RA on CR16 [2026-07-10 09:00, 10:00) SCHEDULED. Second run RB [10:30, 11:30) on CR16 must conflict."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-16", name: "Chair 16", category: "CHAIR", total_units: 50, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { ch16_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c16@x.com", full_name: "C Sixteen", phone: "555-0016" }
              as: RentalAgent
              captures: { c16_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c16_id}", name: "Hall 16", address: "16 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c16_id}"
              captures: { v16_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c16_id}", venue_id: "${v16_id}", fulfillment: "DELIVERY", event_start: "2026-07-10T00:00:00.000Z", event_end: "2026-07-10T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c16_id}"
              captures: { o16a_id: $.data.id }
            - call: "POST /orders/${o16a_id}/lines"
              payload: { item_id: "${ch16_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c16_id}"
              captures: { o16a_v: $.data.version }
            - call: "POST /orders/${o16a_id}/confirm"
              payload: { expected_order_version: "${o16a_v}" }
              as: Customer
              as_user_id: "${c16_id}"
            - call: "POST /orders"
              payload: { customer_id: "${c16_id}", venue_id: "${v16_id}", fulfillment: "DELIVERY", event_start: "2026-07-10T00:00:00.000Z", event_end: "2026-07-10T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c16_id}"
              captures: { o16b_id: $.data.id }
            - call: "POST /orders/${o16b_id}/lines"
              payload: { item_id: "${ch16_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c16_id}"
              captures: { o16b_v: $.data.version }
            - call: "POST /orders/${o16b_id}/confirm"
              payload: { expected_order_version: "${o16b_v}" }
              as: Customer
              as_user_id: "${c16_id}"
            - call: "POST /crews"
              payload: { name: "Truck 16", turnaround_minutes: 60 }
              as: RentalAgent
              captures: { cr16_id: $.data.id }
            - call: "POST /delivery-runs"
              payload: { order_id: "${o16a_id}", leg: "DROP_OFF", crew_id: "${cr16_id}", window_start: "2026-07-10T09:00:00.000Z", window_end: "2026-07-10T10:00:00.000Z" }
              as: RentalAgent
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /delivery-runs"
              payload: { order_id: "${o16b_id}", leg: "DROP_OFF", crew_id: "${cr16_id}", window_start: "2026-07-10T10:30:00.000Z", window_end: "2026-07-10T11:30:00.000Z" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_CREW_WINDOW_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_ledger_hold_then_release_conserves_balance
        grounds:
          - calculations.deposit_held_balance
          - state_machines.RentalOrder.field=settlement_status.DEPOSIT_HELD_to_DEPOSIT_RELEASED
          - entities.DepositLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = deposit held balance. Invariant: after a HOLD followed
          by its compensating full RELEASE, held_balance_cents == sum(HOLD) -
          sum(RELEASE) - sum(FORFEIT) == 0. Confirm holds 1000, cancel releases 1000,
          net held == 0 with no drift.
        test_recipe:
          setup:
            - "CatalogItem CHAIR17 (total_units=20, daily=200, deposit_per_unit=200). Customer C17."
            - "WILL_CALL order O17 (1 day, 5 chairs) CONFIRMED: HOLD ledger entry 1000, held_balance=1000."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-17", name: "Chair 17", category: "CHAIR", total_units: 20, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 200, requires_coi: false }
              as: RentalAgent
              captures: { ch17_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c17@x.com", full_name: "C Seventeen", phone: "555-0017" }
              as: RentalAgent
              captures: { c17_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c17_id}", fulfillment: "WILL_CALL", event_start: "2026-06-25T00:00:00.000Z", event_end: "2026-06-25T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c17_id}"
              captures: { o17_id: $.data.id }
            - call: "POST /orders/${o17_id}/lines"
              payload: { item_id: "${ch17_id}", quantity: 5 }
              as: Customer
              as_user_id: "${c17_id}"
              captures: { o17_v: $.data.version }
            - call: "POST /orders/${o17_id}/confirm"
              payload: { expected_order_version: "${o17_v}" }
              as: Customer
              as_user_id: "${c17_id}"
              captures: { o17_v_conf: $.data.version }
          trigger:
            - call: "POST /orders/${o17_id}/cancel"
              payload: { expected_order_version: "${o17_v_conf}" }
              as: Customer
              as_user_id: "${c17_id}"
          assert:
            - "RentalOrder.${o17_id}.settlement_status == DEPOSIT_RELEASED"
            - "Customer.${c17_id}.account_credit_cents == 1000"
            - "GET /orders/${o17_id}/deposit-ledger entries net to held_balance 0 (one HOLD 1000, one RELEASE 1000)"

      - name: inventory_units_reserve_then_release_conserves_availability
        grounds:
          - state_machines.RentalOrder.field=booking_status.CONFIRMED_to_CANCELLED
          - entities.OrderLine.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Conserved quantity = available inventory units over a window (DIFFERENT from
          deposit cents). Invariant: confirm reserves N units (line RESERVED), cancel
          releases them (line RELEASED), so available_units over the window returns to
          its pre-confirm value (total_units) with no leaked reservation.
        test_recipe:
          setup:
            - "CatalogItem CHAIR18 (total_units=40, daily=200, deposit_per_unit=0). Customer C18."
            - "WILL_CALL order O18 (Jun 1-2) reserves 40 chairs (CONFIRMED): available over Jun1-2 becomes 0."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-18", name: "Chair 18", category: "CHAIR", total_units: 40, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { ch18_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c18@x.com", full_name: "C Eighteen", phone: "555-0018" }
              as: RentalAgent
              captures: { c18_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c18_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-02T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c18_id}"
              captures: { o18_id: $.data.id }
            - call: "POST /orders/${o18_id}/lines"
              payload: { item_id: "${ch18_id}", quantity: 40 }
              as: Customer
              as_user_id: "${c18_id}"
              captures: { o18_v: $.data.version }
            - call: "POST /orders/${o18_id}/confirm"
              payload: { expected_order_version: "${o18_v}" }
              as: Customer
              as_user_id: "${c18_id}"
              captures: { o18_v_conf: $.data.version }
          trigger:
            - call: "POST /orders/${o18_id}/cancel"
              payload: { expected_order_version: "${o18_v_conf}" }
              as: Customer
              as_user_id: "${c18_id}"
            - call: "GET /catalog-items/${ch18_id}/availability"
              payload: { window_start: "2026-06-01T00:00:00.000Z", window_end: "2026-06-02T00:00:00.000Z" }
              as: RentalAgent
              captures: { avail_after: $.data.available_units }
          assert:
            - "RentalOrder.${o18_id}.booking_status == CANCELLED"
            - "availability.available_units == 40"
            - "availability.reserved_units == 0"
