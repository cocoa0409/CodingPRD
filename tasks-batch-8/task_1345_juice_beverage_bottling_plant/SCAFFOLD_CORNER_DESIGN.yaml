          trigger:
            - { call: "POST /v1/bottling-lines/${line_id}/set-maintenance", payload: {}, as: PlantManager, captures: { err_maint: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run1}/cancel", payload: {}, as: ProductionPlanner }
