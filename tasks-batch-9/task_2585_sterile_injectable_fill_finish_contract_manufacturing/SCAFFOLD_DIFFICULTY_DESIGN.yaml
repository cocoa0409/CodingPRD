  - rule_id: transitive_cascade
    instances:

      - name: media_fill_failure_five_level_freeze_and_component_restoration
        grounds:
          - state_machines.MediaFill.status.INCUBATING_to_FAILED
          - state_machines.FillingSuite.aseptic_qualification_status.QUALIFIED_to_INVALIDATED
          - state_machines.BatchOrder.production_status.SETUP_to_SUSPENDED
          - state_machines.ComponentReservation.status.RESERVED_to_RELEASED
          - state_machines.ComponentLot.status.EXHAUSTED_to_RELEASED
          - calculations.suite_posture
          - calculations.suite_committed_minutes
          - calculations.media_fill_outcome
        distinguishing_aspect: |
          One POST /media-fills/{id}/read with contaminated_units 2 propagates through five
          distinct entity types in one request — MediaFill -> FillingSuite (INVALIDATED, posture
          FROZEN) -> BatchOrder (SETUP -> SUSPENDED) -> ComponentReservation (RESERVED ->
          RELEASED) -> ComponentLot (EXHAUSTED -> RELEASED with quantity_available restored to
          10560) — and the cascade is conditional at level 2: the two QUALIFIED operator
