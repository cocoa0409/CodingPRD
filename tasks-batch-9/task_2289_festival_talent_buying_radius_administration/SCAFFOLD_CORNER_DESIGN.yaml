          Three approved lines separate the two constants: TRAVEL_ESCALATION_PCT is a
          step-1 per-line multiplier (3 * 118750 * 1.12 = 399000 exactly, so the escalation
          is visible in line_cost_cents itself), while HOSPITALITY_LINE_CAP_CENTS is a
          step-3 variant-only clamp (the 200000 hospitality line keeps line_cost_cents
          200000 but contributes only 150000 to CONTRACTED_SCOPE). The TECHNICAL line is
          escalation-free and uncapped, so proposed 849000 and contracted 799000 differ by
          exactly the 50000 clamp.
