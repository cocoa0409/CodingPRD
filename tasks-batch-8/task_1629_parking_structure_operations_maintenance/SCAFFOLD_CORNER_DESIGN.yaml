          grace_minutes: 15
          first_hour_cents: 1
          additional_hour_cents: 1
          daily_max_cents: 10
          event_flat_cents: 1
          lost_ticket_daily_cents: 10
          effective_from: '2026-08-01T00:00:00Z'
        as: GateDevice
        as_user_id: ${dev}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_FORBIDDEN_ROLE 403
  - name: security_officer_cannot_fund_projects
    claim_type: role_denied
    grounds:
    - validations[priority=2]
    - roles.FacilityManager
    distinguishing_aspect: SecurityOfficer calling fund is denied; funding is FacilityManager-exclusive.
    test_recipe:
      setup:
      - Facility with one PROPOSED project
      setup_api_calls:
