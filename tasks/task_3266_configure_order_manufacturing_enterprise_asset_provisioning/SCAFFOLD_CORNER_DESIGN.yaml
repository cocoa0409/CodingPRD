            - "every row's serial_number is non-null and unique and its asset_tag starts with 'FE-'"
            - "row employee refs are exactly { EMP-A, EMP-B } and asset_status == IN_TRANSIT"

      - name: drop_ship_destination_sum_must_equal_qty
        claim_type: conditional_action
        grounds: ['validations[priority=19]', 'errors[ERR_INVALID_ORDER_QUANTITY]', 'endpoints[POST /api/orders/{id}/deployment-waves]']
        distinguishing_aspect: "For DROP_SHIP_EMPLOYEES lines the per-employee units across waves must cover the line qty exactly; a wave whose destinations total 2 against a 1-unit line is rejected."
        test_recipe:
          setup: ["order with one DROP_SHIP_EMPLOYEES line of qty 1, submitted"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "EE2", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { ee2_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "EEL2", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { ee2_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "EEC2", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { ee2_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${ee2_l}", component_id: "${ee2_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${ee2_a}"
                chassis_model_id: "${ee2_l}"
                component_selections: [{ component_id: "${ee2_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${ee2_a}"
              captures: { ee2_cf: $.data.id }
            - { call: "POST /api/configurations/${ee2_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${ee2_a}", captures: { ee2_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${ee2_a}", po_number: "PO-EE2" }, as: CustomerUser, as_user_id: "${ee2_a}", captures: { ee2_o: $.data.id } }
            - { call: "POST /api/orders/${ee2_o}/lines", payload: { configuration_id: "${ee2_cf}", qty: 1, ship_to_mode: "DROP_SHIP_EMPLOYEES" }, as: CustomerUser, as_user_id: "${ee2_a}" }
            - { call: "POST /api/orders/${ee2_o}/submit", payload: { expected_configuration_version: "${ee2_cv}" }, as: CustomerUser, as_user_id: "${ee2_a}" }
          trigger:
            - call: "POST /api/orders/${ee2_o}/deployment-waves"
              payload:
                wave_label: "WBAD"
                ship_window_start: "2026-09-05T00:00:00Z"
                ship_window_end: "2026-09-10T00:00:00Z"
                destinations: [{ employee_ref: "E1", address: "1 A St", units: 2 }]
              as: AccountManager
              captures: { ee2_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ORDER_QUANTITY (422)   # destinations total 2 exceeds line qty 1"

      - name: unlock_configuration_in_use_rejected
        claim_type: conditional_action
        grounds: ['validations[priority=9]', 'errors[ERR_CONFIGURATION_IN_USE]', state_machines.Configuration.LOCKED_to_DRAFT]
        distinguishing_aspect: "A locked configuration referenced by a live (SUBMITTED) order cannot be unlocked — the cross-entity referential gate protects in-flight builds."
        test_recipe:
          setup: ["locked program, published template, locked configuration; order submitted referencing it"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "EE3", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { ee3_a: $.data.id } }
            - { call: "POST /api/accounts/${ee3_a}/programs", payload: { name: "P3", asset_tag_prefix: "FE", custom_image_ref: "img-std" }, as: AccountManager, captures: { ee3_p: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "EEL3", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { ee3_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "EEC3", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { ee3_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${ee3_l}", component_id: "${ee3_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/programs/${ee3_p}/templates"
              payload:
                name: "T3"
                chassis_model_id: "${ee3_l}"
                pinned_components: [{ component_id: "${ee3_c}", revision: "A01", qty: 1 }]
              as: AccountManager
              captures: { ee3_t: $.data.id }
            - { call: "POST /api/templates/${ee3_t}/publish", payload: {}, as: AccountManager }
            - { call: "POST /api/programs/${ee3_p}/lock", payload: {}, as: AccountManager }
            - call: "POST /api/configurations"
              payload:
                account_id: "${ee3_a}"
                chassis_model_id: "${ee3_l}"
                component_selections: [{ component_id: "${ee3_c}", qty: 1 }]
                template_id: "${ee3_t}"
              as: CustomerUser
              as_user_id: "${ee3_a}"
              captures: { ee3_cf: $.data.id }
            - { call: "POST /api/configurations/${ee3_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${ee3_a}" }
            - { call: "POST /api/configurations/${ee3_cf}/lock", payload: {}, as: AccountManager, captures: { ee3_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${ee3_a}", po_number: "PO-EE3" }, as: CustomerUser, as_user_id: "${ee3_a}", captures: { ee3_o: $.data.id } }
            - { call: "POST /api/orders/${ee3_o}/lines", payload: { configuration_id: "${ee3_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${ee3_a}" }
            - { call: "POST /api/orders/${ee3_o}/submit", payload: { expected_configuration_version: "${ee3_cv}" }, as: CustomerUser, as_user_id: "${ee3_a}" }
          trigger:
            - { call: "POST /api/configurations/${ee3_cf}/unlock", payload: {}, as: AccountManager, captures: { ee3_err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONFIGURATION_IN_USE (409)"
            - "Configuration.${ee3_cf}.status == LOCKED"

  # ===========================================================================
  # Section 6 — Errors
  # ===========================================================================
  - section: errors
    instances:
      - name: build_out_of_sequence_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=12]', 'errors[ERR_BUILD_OUT_OF_SEQUENCE]']
        distinguishing_aspect: "Two ALLOCATED jobs exist; starting the later-created one violates the min-sequence-rank rule while starting the earlier one succeeds."
        test_recipe:
          setup: ["account; chassis; component stock 20; one configuration validated; TWO orders each qty 1 submitted in sequence (O-A first, O-B second); both jobs allocated"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "ER1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { er1_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "ERL1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { er1_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "ERC1", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 20, revision: "A01" }, as: PlatformAdmin, captures: { er1_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${er1_l}", component_id: "${er1_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${er1_a}"
                chassis_model_id: "${er1_l}"
                component_selections: [{ component_id: "${er1_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${er1_a}"
              captures: { er1_cf: $.data.id }
            - { call: "POST /api/configurations/${er1_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${er1_a}", captures: { er1_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${er1_a}", po_number: "PO-ER1A" }, as: CustomerUser, as_user_id: "${er1_a}", captures: { er1_oa: $.data.id } }
            - { call: "POST /api/orders/${er1_oa}/lines", payload: { configuration_id: "${er1_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${er1_a}" }
            - { call: "POST /api/orders/${er1_oa}/submit", payload: { expected_configuration_version: "${er1_cv}" }, as: CustomerUser, as_user_id: "${er1_a}" }
            - { call: "POST /api/orders", payload: { account_id: "${er1_a}", po_number: "PO-ER1B" }, as: CustomerUser, as_user_id: "${er1_a}", captures: { er1_ob: $.data.id } }
            - { call: "POST /api/orders/${er1_ob}/lines", payload: { configuration_id: "${er1_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${er1_a}" }
            - { call: "GET /api/configurations/${er1_cf}", payload: {}, as: CustomerUser, as_user_id: "${er1_a}", captures: { er1_cv2: $.data.version } }
            - { call: "POST /api/orders/${er1_ob}/submit", payload: { expected_configuration_version: "${er1_cv2}" }, as: CustomerUser, as_user_id: "${er1_a}" }
            - call: "GET /api/orders/${er1_oa}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                er1_ja: $.data[0].id
            - call: "GET /api/orders/${er1_ob}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                er1_jb: $.data[0].id
            - { call: "POST /api/build-jobs/${er1_ja}/allocate", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${er1_jb}/allocate", payload: {}, as: FactoryOps }
          trigger:
            - { call: "POST /api/build-jobs/${er1_jb}/start", payload: {}, as: FactoryOps, captures: { er1_err: $.data.error_id } }
          assert:
            - "error_id == ERR_BUILD_OUT_OF_SEQUENCE (422)   # job of the later order is not min-rank"
            - "BuildJob.${er1_jb}.status == ALLOCATED"

      - name: program_lock_violation_error
        claim_type: violation_to_error
        grounds: ['validations[priority=8]', 'errors[ERR_PROGRAM_LOCK_VIOLATION]']
        distinguishing_aspect: "Pure business_constraint path (state gate passes): locking a VALIDATED configuration whose program is still OPEN fails with ERR_PROGRAM_LOCK_VIOLATION — unlike the §1.8 dual-failure instance, no state violation is present here."
        test_recipe:
          setup: ["program OPEN (never locked); published template; configuration from template VALIDATED"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "ER2", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { er2_a: $.data.id } }
            - { call: "POST /api/accounts/${er2_a}/programs", payload: { name: "P2", asset_tag_prefix: "FE", custom_image_ref: "img-std" }, as: AccountManager, captures: { er2_p: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "ERL2", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { er2_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "ERC2", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { er2_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${er2_l}", component_id: "${er2_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/programs/${er2_p}/templates"
              payload:
                name: "T2"
                chassis_model_id: "${er2_l}"
                pinned_components: [{ component_id: "${er2_c}", revision: "A01", qty: 1 }]
              as: AccountManager
              captures: { er2_t: $.data.id }
            - { call: "POST /api/templates/${er2_t}/publish", payload: {}, as: AccountManager }
            - call: "POST /api/configurations"
              payload:
                account_id: "${er2_a}"
                chassis_model_id: "${er2_l}"
                component_selections: [{ component_id: "${er2_c}", qty: 1 }]
                template_id: "${er2_t}"
              as: CustomerUser
              as_user_id: "${er2_a}"
              captures: { er2_cf: $.data.id }
            - { call: "POST /api/configurations/${er2_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${er2_a}" }
          trigger:
            - { call: "POST /api/configurations/${er2_cf}/lock", payload: {}, as: AccountManager, captures: { er2_err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_LOCK_VIOLATION (422)   # program OPEN, configuration VALIDATED so the state gate passes"
            - "Configuration.${er2_cf}.status == VALIDATED"

      - name: wave_release_on_hold_order_rejected
        claim_type: violation_to_error
        grounds: ['errors[ERR_SHORTAGE_PENDING]', state_machines.Order]
        distinguishing_aspect: "ERR_SHORTAGE_PENDING fires when a wave release is attempted while the order sits ON_HOLD with a PENDING substitution — the shortage freeze blocks shipment even though release is otherwise well-formed."
        test_recipe:
          setup: ["order ON_HOLD via shortage-blocked job with PENDING substitution; a PLANNED wave exists (created before the shortage)"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "ER3", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { er3_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "ERL3", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { er3_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "ER3S1", kind: "STORAGE", price_cents: 5000, lead_time_days: 3, stock_on_hand: 0, revision: "A01" }, as: PlatformAdmin, captures: { er3_s1: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "ER3S2", kind: "STORAGE", price_cents: 7000, lead_time_days: 3, stock_on_hand: 50, revision: "A01" }, as: PlatformAdmin, captures: { er3_s2: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${er3_l}", component_id: "${er3_s1}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${er3_l}", component_id: "${er3_s2}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${er3_a}"
                chassis_model_id: "${er3_l}"
                component_selections: [{ component_id: "${er3_s1}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${er3_a}"
              captures: { er3_cf: $.data.id }
            - { call: "POST /api/configurations/${er3_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${er3_a}", captures: { er3_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${er3_a}", po_number: "PO-ER3" }, as: CustomerUser, as_user_id: "${er3_a}", captures: { er3_o: $.data.id } }
            - { call: "POST /api/orders/${er3_o}/lines", payload: { configuration_id: "${er3_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${er3_a}" }
            - { call: "POST /api/orders/${er3_o}/submit", payload: { expected_configuration_version: "${er3_cv}" }, as: CustomerUser, as_user_id: "${er3_a}" }
            - call: "POST /api/orders/${er3_o}/deployment-waves"
              payload:
                wave_label: "W1"
                ship_window_start: "2026-09-02T00:00:00Z"
                ship_window_end: "2026-09-20T00:00:00Z"
                destinations: [{ employee_ref: "HQ", address: "1 Main St", units: 1 }]
              as: AccountManager
              captures: { er3_w: $.data.id }
            - call: "GET /api/orders/${er3_o}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                er3_j: $.data[0].id
            - { call: "POST /api/build-jobs/${er3_j}/allocate", payload: {}, as: FactoryOps }
          trigger:
            - { call: "POST /api/deployment-waves/${er3_w}/release", payload: {}, as: AccountManager, captures: { er3_err: $.data.error_id } }
          assert:
            - "error_id == ERR_SHORTAGE_PENDING (409)   # ON_HOLD order with PENDING substitution freezes wave release"
            - "DeploymentWave.${er3_w}.status == PLANNED"

      - name: error_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Error responses carry meta.api_request_id, response_type == 'error', and data.error_id/data.message exactly — no other top-level keys."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin }
          assert:
            - "response_type == 'error'"
            - "data.error_id == 'ERR_NOT_FOUND' and data.message is a non-empty string"
            - "meta.api_request_id present"

