              captures: { e_arm_b_reject: "$.data.error_id" }
            - call: "POST /disclosure/dissemination-engagements/${eng_a}/acknowledge-calendar"
              payload: { last_calendar_ack_date: "2026-08-01" }
              as: DisseminationAgent
              as_user_id: "${eng_b}"
              captures: { e_arm_c: "$.data.error_id" }
            - call: "POST /disclosure/dissemination-engagements/${eng_b}/acknowledge-calendar"
              payload: { last_calendar_ack_date: "2026-08-01" }
              as: DisseminationAgent
              as_user_id: "${eng_b}"
              captures: { ack_date: "$.data.last_calendar_ack_date", ack_lapse: "$.data.monitoring_lapse_days" }
            - call: "POST /disclosure/filings/${filing_a}/confirm"
              payload: { repository_receipt_id: "EMMA-RCPT-90003" }
              as: DisseminationAgent
              as_user_id: "${eng_a}"
              captures: { conf_status: "$.data.status", conf_receipt: "$.data.repository_receipt_id" }
          assert:
            - "${notice_a_status} == MATERIAL"
            - "${e_role_submit} == ERR_UNAUTHORIZED (403) and ${e_role_confirm} == ERR_UNAUTHORIZED (403) — repository traffic is closed to every human role"
            - "${e_arm_a} == ERR_AGENT_NOT_ENGAGED (403) — engagement B is ACTIVE and real, but its undertaking_id is undertaking B while the filing's subject belongs to undertaking A"
            - "${sub_status} == SUBMITTED, ${sub_eng} == \"${eng_a}\", ${sub_attempts} == 1"
            - "${e_arm_b} == ERR_AGENT_NOT_ENGAGED and ${e_arm_b_reject} == ERR_AGENT_NOT_ENGAGED — arm (b) demands an exact match against submitting_engagement_id, so an ACTIVE stranger cannot carry the repository's answer"
            - "${e_arm_c} == ERR_AGENT_NOT_ENGAGED — arm (c) demands X-User-ID == the {id} path segment"
            - "${ack_date} == \"2026-08-01\" and ${ack_lapse} == 0 — acknowledging one's OWN calendar succeeds"
            - "${conf_status} == CONFIRMED with ${conf_receipt} == \"EMMA-RCPT-90003\" — receipts 90001 and 90002 were never stored because those calls failed, so they remain available"

      - name: missing_or_unknown_identity_headers_are_refused_before_anything_else
        claim_type: role_exclusive_operations
        grounds:
          - validations.priority_1
          - validations.priority_2
          - validations.priority_3
        distinguishing_aspect: >-
          Priority 1 is the outermost gate, so every one of these probes must return
          ERR_UNAUTHENTICATED (401) even though each would otherwise fail for a different reason
          further down: an unparseable path id (priority 3), a wrong role (priority 2) or a
          malformed body (priority 5). An implementation that authenticates inside the handler,
          after id resolution, returns 404 for the third probe and fails.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue exists so that the authenticated control call has a real target."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
          trigger:
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: "<X-User-Role header omitted entirely>"
              as_user_id: "fd-1"
              captures: { e_no_role: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: "TrusteeBank (not one of the four §1.7 roles)"
              as_user_id: "fd-1"
              captures: { e_bad_role: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: "<X-User-Role header omitted entirely>"
              as_user_id: "fd-1"
              captures: { e_no_role_no_row: "$.data.error_id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: ""
              captures: { e_empty_user: "$.data.error_id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "13-45" }
              as: "<X-User-ID header omitted entirely>"
              as_user_id: ""
              captures: { e_no_user_bad_body: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { ok_status: "$.data.status" }
          assert:
            - "${e_no_role} == ERR_UNAUTHENTICATED (401) and ${e_bad_role} == ERR_UNAUTHENTICATED (401) — an unrecognised role value is an authentication failure at priority 1, not an authorization failure at priority 2"
            - "${e_no_role_no_row} == ERR_UNAUTHENTICATED (401), NOT ERR_ISSUE_NOT_FOUND — priority 1 precedes priority 3"
            - "${e_empty_user} == ERR_UNAUTHENTICATED (401) — a present but empty X-User-ID does not authenticate"
            - "${e_no_user_bad_body} == ERR_UNAUTHENTICATED (401), NOT ERR_INVALID_REQUEST — priority 1 precedes priority 5 even for a plainly malformed month-day"
            - "${ok_status} == OUTSTANDING — the same GET with both headers present succeeds"

      - name: the_officer_who_attested_content_may_not_assemble_the_cycle
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_12
          - state_machines[CycleContentItem].DRAFT->READY
          - state_machines[AnnualReportCycle].DRAFTING->READY_TO_FILE
        distinguishing_aspect: >-
          Both users hold the identical DisclosureOfficer role, so authorization alone cannot
          separate them — only the X-User-ID comparison against attested_by_user_id can. The
          comparison must scan EVERY non-VOID item, so an assembler who attested just one of two
          items is still refused, and it must be checked at priority 12, ahead of the readiness
          checks at 25 and 26, so the error is ERR_SEGREGATION_OF_DUTIES rather than a content
          complaint. The reopen path also matters: clearing attested_by_user_id to null must
          genuinely free the assembly for the original attester once someone else re-attests.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking carrying two requirements, AUDITED_FINANCIALS 7000 (requires_audit_opinion) and OPERATING_DATA_TABLE 3000, and one FY2026 cycle."
            - "Officer off-prep attests the financials item; officer off-asm attests the operating-data item."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 7000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_fin: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 3000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_ops: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req_fin}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_fin: "$.data[0].id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req_ops}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_ops: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_fin}"
              payload: { audit_opinion_type: "UNMODIFIED", data_as_of_date: "2026-06-30", source_document_ref: "CAFR-FY2026.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "PATCH /disclosure/cycle-content-items/${item_ops}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.xlsx" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_fin}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { fin_attester: "$.data.attested_by_user_id", fin_status: "$.data.status" }
            - call: "POST /disclosure/cycle-content-items/${item_ops}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
              captures: { ops_attester: "$.data.attested_by_user_id", cyc_status_ready: "$.data.status" }
          trigger:
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_sod_prep: "$.data.error_id" }
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
              captures: { e_sod_asm: "$.data.error_id" }
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-third"
              captures: { asm_status: "$.data.status", asm_by: "$.data.assembled_by_user_id", asm_score: "$.data.completeness_score_pct" }
          assert:
            - "${fin_attester} == \"off-prep\", ${fin_status} == READY and ${ops_attester} == \"off-asm\""
            - "${e_sod_prep} == ERR_SEGREGATION_OF_DUTIES (403) — off-prep attested one of the two items"
            - "${e_sod_asm} == ERR_SEGREGATION_OF_DUTIES (403) — the rule scans EVERY non-VOID item, not only the first"
            - "${asm_status} == READY_TO_FILE, ${asm_by} == \"off-third\" and ${asm_score} == 100.00 — a third officer who attested nothing may assemble, and the two READY items at weights 7000 and 3000 with multiplier 1.0 sum to exactly 100.00"

      - name: the_reviewer_who_ran_the_lookback_may_not_post_the_statement
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_13
          - state_machines[OfficialStatement].COMPLIANCE_REVIEW->POSTED
          - state_machines[OfficialStatement].COMPLIANCE_REVIEW->COMPLIANCE_REVIEW
        distinguishing_aspect: >-
          reviewed_by_user_id is OVERWRITTEN by each re-review, so the segregation rule aims at a
          moving target: after rev-1 reviews, rev-1 cannot post but rev-2 can; if rev-2 then
          re-reviews, the permission flips and rev-2 becomes the barred party while rev-1 is freed.
          An implementation that records only the first reviewer, or that keeps a set of all
          reviewers, gets one of the two halves wrong.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking and no FailureToFileEvent rows, so the required disclosure set is empty and adequacy is ADEQUATE with disclosed_event_ids = []."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/official-statements"
              payload: { issue_id: "${issue_id}", dated_date: "2026-09-15" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { os_id: "$.data.id", os_status0: "$.data.status", os_policy: "$.data.lookback_policy" }
          trigger:
            - call: "POST /disclosure/official-statements/${os_id}/compliance-review"
              payload: { disclosed_event_ids: [] }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { r1_status: "$.data.status", r1_by: "$.data.reviewed_by_user_id", r1_req_count: "$.data.required_disclosure_event_count", r1_adequacy: "$.data.disclosure_adequacy" }
            - call: "POST /disclosure/official-statements/${os_id}/post"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_sod_1: "$.data.error_id" }
            - call: "POST /disclosure/official-statements/${os_id}/compliance-review"
              payload: { disclosed_event_ids: [] }
              as: ComplianceReviewer
              as_user_id: "rev-2"
              captures: { r2_status: "$.data.status", r2_by: "$.data.reviewed_by_user_id" }
            - call: "POST /disclosure/official-statements/${os_id}/post"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-2"
              captures: { e_sod_2: "$.data.error_id" }
            - call: "POST /disclosure/official-statements/${os_id}/post"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { p_status: "$.data.status", p_by: "$.data.posted_by_user_id", p_at: "$.data.posted_at", p_reviewer: "$.data.reviewed_by_user_id" }
          assert:
            - "${os_status0} == DRAFT and ${os_policy} == STRICT_FIVE_YEAR (the declared default)"
            - "${r1_status} == COMPLIANCE_REVIEW, ${r1_by} == \"rev-1\", ${r1_req_count} == 0 and ${r1_adequacy} == ADEQUATE"
            - "${e_sod_1} == ERR_SEGREGATION_OF_DUTIES (403) — and NOT ERR_DISCLOSURE_INADEQUATE, since priority 13 precedes priority 32 and adequacy already holds"
            - "${r2_status} == COMPLIANCE_REVIEW and ${r2_by} == \"rev-2\" — the self-loop overwrites the reviewer"
            - "${e_sod_2} == ERR_SEGREGATION_OF_DUTIES (403) — rev-2 is now the barred party"
            - "${p_status} == POSTED, ${p_by} == \"rev-1\", ${p_at} == 2026-08-01T00:00:00Z and ${p_reviewer} == \"rev-2\" — rev-1 was freed by the re-review, proving the check reads the CURRENT reviewed_by_user_id rather than a history of reviewers"

  - section: cross_cutting_complexity_layers
    instances:

      - name: filing_creation_rejects_a_stale_view_of_the_issue
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.filing-create-stale-issue
          - validations.priority_7
          - endpoints.POST_/disclosure/filings
        distinguishing_aspect: >-
          §1.2.1 rule filing-create-stale-issue guards POST /disclosure/filings with
          expected_issue_version. The version the client must supply advances for reasons that have
          nothing to do with filings — here a rating action recorded against the same issue — so a
          drafting client that never re-read the issue is refused with ERR_ISSUE_VERSION_STALE
          (412). Priority 7 also outranks the subject-state check at priority 28, so a stale version
          on a filing whose subject is not even fileable still reports the staleness first.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking, one notice determined MATERIAL and one notice left DETERMINATION_PENDING."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { notice_ok: "$.data.id" }
            - call: "POST /disclosure/material-event-notices/${notice_ok}/determine"
              payload: { determination: "MATERIAL", determination_note: "Successor trustee appointed." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { notice_ok_status: "$.data.status" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "MERGER_OR_SALE", occurrence_date: "2026-07-29" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { notice_pending: "$.data.id", notice_pending_status: "$.data.status" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { v_obs: "$.data.version" }
          trigger:
            - call: "POST /disclosure/bond-issues/${issue_id}/rating-actions"
              payload: { rating_agency: "MOODYS", prior_rating: "Aa2", new_rating: "Aa3", occurrence_date: "2026-07-30", expected_issue_version: "${v_obs}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { rc_notice: "$.data.id", rc_type: "$.data.event_type" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { v_new: "$.data.version", cur_rating: "$.data.current_rating" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_ok}", expected_issue_version: "${v_obs}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_pending}", expected_issue_version: "${v_obs}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_stale_before_subject: "$.data.error_id" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_pending}", expected_issue_version: "${v_new}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_subject: "$.data.error_id" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_ok}", expected_issue_version: "${v_new}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { f_status: "$.data.status", f_ver: "$.data.version", f_attempts: "$.data.submission_attempt_count" }
          assert:
            - "${notice_ok_status} == MATERIAL and ${notice_pending_status} == DETERMINATION_PENDING"
            - "${rc_type} == RATING_CHANGE — the rating action mints its own per-se notice; ${cur_rating} == \"Aa3\""
            - "${v_new} == ${v_obs} + 1 — the rating action bumped the issue by exactly one"
            - "${e_stale} == ERR_ISSUE_VERSION_STALE with HTTP 412"
            - "${e_stale_before_subject} == ERR_ISSUE_VERSION_STALE, NOT ERR_FILING_SUBJECT_MISMATCH — priority 7 precedes priority 28 even though the DETERMINATION_PENDING notice is genuinely unfileable"
            - "${e_subject} == ERR_FILING_SUBJECT_MISMATCH (422) — with the version now correct, the subject complaint finally surfaces, proving the previous probe was not silently mis-ordered"
            - "${f_status} == DRAFT, ${f_ver} == 1 and ${f_attempts} == 0 — the correct version succeeds; no filing was created by any of the three failed attempts"

      - name: rating_actions_serialize_on_the_issue_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.rating-action-stale-issue
          - validations.priority_7
          - endpoints.POST_/disclosure/bond-issues/{id}/rating-actions
        distinguishing_aspect: >-
          Two rating agencies acting on the same stale read is the exact lost-update this rule
          exists to stop: the second writer would silently overwrite current_rating without ever
          having seen the value it replaces. The stale attempt must leave BOTH the rating fields and
          the issue version untouched, and it must not mint a RATING_CHANGE notice — a 412 that
          still creates the per-se notice is the subtle failure this corner catches.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with no rating recorded yet."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /disclosure/bond-issues/${issue_id}/rating-actions"
              payload: { rating_agency: "MOODYS", prior_rating: "Aa2", new_rating: "Aa3", occurrence_date: "2026-07-30", expected_issue_version: "${v1}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { n1: "$.data.id", n1_type: "$.data.event_type", n1_status: "$.data.status", n1_deadline: "$.data.filing_deadline_date" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { v2: "$.data.version", rating2: "$.data.current_rating", agency2: "$.data.current_rating_agency" }
            - call: "POST /disclosure/bond-issues/${issue_id}/rating-actions"
              payload: { rating_agency: "SP", prior_rating: "AA", new_rating: "AA-", occurrence_date: "2026-07-31", expected_issue_version: "${v1}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { v_after_fail: "$.data.version", rating_after_fail: "$.data.current_rating", agency_after_fail: "$.data.current_rating_agency" }
            - call: "GET /disclosure/material-event-notices?issue_id=${issue_id}&event_type=RATING_CHANGE"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { rc_count_after_fail: "$.total_count" }
            - call: "POST /disclosure/bond-issues/${issue_id}/rating-actions"
              payload: { rating_agency: "SP", prior_rating: "AA", new_rating: "AA-", occurrence_date: "2026-07-31", expected_issue_version: "${v_after_fail}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { n2: "$.data.id", n2_status: "$.data.status" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { v3: "$.data.version", rating3: "$.data.current_rating", agency3: "$.data.current_rating_agency" }
            - call: "GET /disclosure/material-event-notices?issue_id=${issue_id}&event_type=RATING_CHANGE"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { rc_count_final: "$.total_count" }
          assert:
            - "${n1_type} == RATING_CHANGE, ${n1_status} == MATERIAL (per se, no determination needed) and ${n1_deadline} == \"2026-08-13\" — ten business days from 2026-07-30 over no holidays"
            - "${v2} == ${v1} + 1, ${rating2} == \"Aa3\", ${agency2} == MOODYS"
            - "${e_stale} == ERR_ISSUE_VERSION_STALE with HTTP 412"
            - "${v_after_fail} == ${v2}, ${rating_after_fail} == \"Aa3\", ${agency_after_fail} == MOODYS and ${rc_count_after_fail} == 1 — the refused write left no trace at all: no version bump, no overwritten rating, and no second RATING_CHANGE notice"
            - "${n2_status} == MATERIAL, ${v3} == ${v2} + 1, ${rating3} == \"AA-\", ${agency3} == SP and ${rc_count_final} == 2 — the retry with the observed version succeeds and the two notices coexist"

      - name: engagement_creation_reports_staleness_before_undertaking_state
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.engagement-create-stale-undertaking
          - validations.priority_7
          - validations.priority_10
          - state_machines[DisseminationEngagement].ACTIVE->TERMINATED
        distinguishing_aspect: >-
          This is the only rule guarded by expected_undertaking_version, and it is the only one
          whose write endpoint is ALSO covered by the parent-state gate at priority 10. The
          suspension both bumps the version and closes the gate, so the same request can violate
          both rules at once — and priority 7 must win, yielding 412 ERR_UNDERTAKING_VERSION_STALE
          rather than 409 ERR_UNDERTAKING_NOT_ACTIVE. Once reinstated and current, creation succeeds
          and supersedes the prior engagement with termination_reason SUPERSEDED rather than
          ISSUER_TERMINATED.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking and no engagement yet."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /disclosure/undertakings/${und_id}/suspend"
              payload: { suspended_reason: "Awaiting the audit; agent selection paused." }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { s_status: "$.data.status", v2: "$.data.version" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Meridian Disclosure Services", effective_date: "2026-07-20", expiration_date: "2027-06-30", retainer_cents: 250000, expected_undertaking_version: "${v1}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_stale_wins: "$.data.error_id" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Meridian Disclosure Services", effective_date: "2026-07-20", expiration_date: "2027-06-30", retainer_cents: 250000, expected_undertaking_version: "${v2}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_not_active: "$.data.error_id" }
            - call: "POST /disclosure/undertakings/${und_id}/reinstate"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { r_status: "$.data.status", v3: "$.data.version" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Meridian Disclosure Services", effective_date: "2026-07-20", expiration_date: "2027-06-30", retainer_cents: 250000, expected_undertaking_version: "${v2}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_stale_again: "$.data.error_id" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Meridian Disclosure Services", effective_date: "2026-07-20", expiration_date: "2027-06-30", retainer_cents: 250000, expected_undertaking_version: "${v3}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng1: "$.data.id", eng1_status: "$.data.status", eng1_invoice: "$.data.invoice_total_cents" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { v4: "$.data.version" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Keystone Filing Agents", effective_date: "2026-08-01", expiration_date: "2027-06-30", retainer_cents: 400000, expected_undertaking_version: "${v4}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng2: "$.data.id", eng2_status: "$.data.status" }
            - call: "GET /disclosure/dissemination-engagements/${eng1}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng1_after: "$.data.status", eng1_reason: "$.data.termination_reason", eng1_superseded_by: "$.data.superseded_by_engagement_id", eng1_invoice_frozen: "$.data.invoice_total_cents" }
          assert:
            - "${s_status} == SUSPENDED and ${v2} == ${v1} + 1"
            - "${e_stale_wins} == ERR_UNDERTAKING_VERSION_STALE with HTTP 412 — NOT ERR_UNDERTAKING_NOT_ACTIVE, because priority 7 precedes priority 10 even though both rules are violated by this single request"
            - "${e_not_active} == ERR_UNDERTAKING_NOT_ACTIVE (409) — with the version corrected the state gate is what remains, confirming the previous probe really did have two live defects"
            - "${r_status} == ACTIVE and ${v3} == ${v2} + 1 — the reinstatement itself invalidated the version the caller had just been told to use"
            - "${e_stale_again} == ERR_UNDERTAKING_VERSION_STALE (412)"
            - "${eng1_status} == ACTIVE with ${eng1_invoice} == 0 — no filing has been billed yet, so no invoice floor is applied at creation"
            - "${eng2_status} == ACTIVE, and ${eng1_after} == TERMINATED with ${eng1_reason} == SUPERSEDED, ${eng1_superseded_by} == \"${eng2}\" and ${eng1_invoice_frozen} == 0 — the supersession cascade fires from a plain creation, and it must NOT stamp ISSUER_TERMINATED"

      - name: confirmation_cascade_spans_five_entities
        claim_type: cascading_side_effects
        grounds:
          - state_machines[Filing].SUBMITTED->CONFIRMED
          - state_machines[AnnualReportCycle].FILING_IN_PROGRESS->FILED_LATE
        excluded_because:
          difficulty_instance: late_confirmation_cascades_five_hops_into_official_statement_adequacy
          rationale: >-
            That instance already walks the full five-hop chain end to end — filing, cycle,
            failure event, undertaking score and posture, agent invoice, and finally the
            official statement's adequacy — and checks hop ordering, so a second
            cascading_side_effects corner would only restate it.

      - name: timeliness_variants_disagree_on_the_same_filing
        claim_type: dual_variant_calculation
        grounds:
          - calculations.cycle_timeliness_assessment
          - calculations.official_statement_disclosure_lookback
        excluded_because:
          difficulty_instance: cycle_timeliness_submission_basis_vs_confirmation_basis_divergence
          rationale: >-
            Both dual-variant calculations already have dedicated difficulty instances — that one
            for the timeliness basis and official_statement_lookback_strict_five_year_vs_remediated_excluded
            for the lookback policy — each running the same data through both variants and checking
            the delta.

      - name: derived_counters_survive_reversal_without_drift
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.undertaking_open_obligation_count
          - calculations.dissemination_agent_invoice
        excluded_because:
          difficulty_instance: cycle_withdrawal_restores_the_open_obligation_count_exactly
          rationale: >-
            Reconciliation after a reversal is exactly that instance's subject, and
            confirmed_correction_conserves_billable_filing_count_and_invoice_total covers the
            invoice half of the same layer, so both reversal directions are already pinned.

  - section: consistency_model
    instances:

      - name: every_cascade_hop_is_readable_on_the_very_next_call
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[Filing].SUBMITTED->CONFIRMED
          - calculations.dissemination_agent_invoice
        distinguishing_aspect: >-
          The consistency model is immediate, and §1.5 offers no recompute, refresh or reconcile
          endpoint — the only dated batch is the calendar sweep, which is deliberately NOT called
          here. So a single confirm must leave the notice, the undertaking's obligation count and
          the engagement's invoice already correct: any implementation that defers derived-field
          maintenance to the next sweep reads back a stale obligation count and a zero invoice.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking, one ACTIVE engagement at retainer 250000, one notice occurring 2026-07-28 determined MATERIAL, and one DRAFT MATERIAL_EVENT_NOTICE filing for it."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_v: "$.data.version" }
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Meridian Disclosure Services", effective_date: "2026-07-20", expiration_date: "2027-06-30", retainer_cents: 250000, expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_id: "$.data.id", eng_billable0: "$.data.billable_filing_count", eng_invoice0: "$.data.invoice_total_cents" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { notice_id: "$.data.id", notice_deadline: "$.data.filing_deadline_date" }
            - call: "POST /disclosure/material-event-notices/${notice_id}/determine"
              payload: { determination: "MATERIAL", determination_note: "Successor trustee appointed." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { notice_status: "$.data.status" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { open_before: "$.data.open_obligation_count" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { issue_v: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${notice_id}", expected_issue_version: "${issue_v}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { filing_id: "$.data.id" }
            - call: "POST /disclosure/filings/${filing_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { sub_status: "$.data.status", sub_at: "$.data.submitted_at" }
          trigger:
            - call: "POST /disclosure/filings/${filing_id}/confirm"
              payload: { repository_receipt_id: "EMMA-RCPT-77001" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { c_status: "$.data.status", c_receipt: "$.data.repository_receipt_id", c_confirmed_at: "$.data.repository_confirmed_at", c_ver: "$.data.version" }
            - call: "GET /disclosure/material-event-notices/${notice_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { n_status_after: "$.data.status", n_filed_filing: "$.data.filed_filing_id", n_days_late: "$.data.days_late" }
            - call: "GET /disclosure/dissemination-engagements/${eng_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_billable1: "$.data.billable_filing_count", eng_invoice1: "$.data.invoice_total_cents" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { open_after: "$.data.open_obligation_count", posture_after: "$.data.compliance_posture", score_after: "$.data.disclosure_risk_score" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_open_events: "$.data.open_material_event_count" }
          assert:
            - "${notice_deadline} == \"2026-08-11\" — ten business days from 2026-07-28; ${notice_status} == MATERIAL; ${open_before} == 1; ${eng_billable0} == 0 and ${eng_invoice0} == 0"
            - "${sub_status} == SUBMITTED with ${sub_at} == 2026-08-01T00:00:00Z"
            - "${c_status} == CONFIRMED, ${c_receipt} == \"EMMA-RCPT-77001\", ${c_confirmed_at} == 2026-08-01T00:00:00Z and ${c_ver} == 3 — one bump for the submit and one for the confirm"
            - "${n_status_after} == FILED_TIMELY with ${n_filed_filing} == \"${filing_id}\" and ${n_days_late} == 0 — 2026-08-01 is on or before the 2026-08-11 deadline"
            - "${eng_billable1} == 1 and ${eng_invoice1} == 300000 — the invoice is already at the MIN_ANNUAL_FEE floor on the very next read, with no sweep in between"
            - "${open_after} == 0, ${posture_after} == COMPLIANT and ${score_after} == 0.00"
            - "${issue_open_events} == 0 — the issue-level derived counter moved in the same request too"

      - name: a_withdrawal_is_fully_visible_in_its_own_response_body
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[AnnualReportCycle].DRAFTING->WITHDRAWN
          - state_machines[CycleContentItem].READY->VOID
        distinguishing_aspect: >-
          Here the immediacy claim is made against the WRITE's own response body rather than a
          follow-up GET: the withdraw response must already report status WITHDRAWN and
          completeness_score_pct 0.00, even though the score depends on child rows that the same
          request voided. An implementation that serializes the cycle before running the child
          cascade returns the pre-cascade score of 100.00 and only converges on the next read —
          a violation of the immediate model that a GET-only test cannot see.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking, a single 10000-bp OPERATING_DATA_TABLE requirement, and one FY2026 cycle whose only item has been prepared and attested (score 100.00)."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.xlsx" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_ready: "$.data.status" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { score_before: "$.data.completeness_score_pct" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { open_before: "$.data.open_obligation_count" }
          trigger:
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/withdraw"
              payload: { withdrawal_reason: "Fiscal year restated; the cycle will be reopened under corrected periods." }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { w_status: "$.data.status", w_score: "$.data.completeness_score_pct", w_reason: "$.data.withdrawal_reason", w_ver: "$.data.version" }
            - call: "GET /disclosure/cycle-content-items/${item_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_after: "$.data.status", item_ready_after: "$.data.readiness_factor", item_attester_after: "$.data.attested_by_user_id" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { open_after: "$.data.open_obligation_count", weight_after: "$.data.content_weight_bp_total" }
            - call: "GET /disclosure/annual-report-cycles?undertaking_id=${und_id}&status=WITHDRAWN"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { withdrawn_total: "$.total_count" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { score_reread: "$.data.completeness_score_pct", status_reread: "$.data.status" }
          assert:
            - "${item_ready} == READY, ${score_before} == 100.00 and ${open_before} == 1"
            - "${w_status} == WITHDRAWN, ${w_score} == 0.00 in the WITHDRAW RESPONSE ITSELF, ${w_reason} echoes the supplied text and ${w_ver} == 2"
            - "${item_after} == VOID with ${item_ready_after} == 0.0, while ${item_attester_after} == \"off-prep\" is preserved for the audit trail"
            - "${open_after} == 0 and ${weight_after} == 10000 — the obligation count moved immediately, but the undertaking's declared requirement set is untouched by a cycle withdrawal"
            - "${withdrawn_total} == 1 — the list index reflects the new status on the next call, with no reindex step"
            - "${score_reread} == 0.00 and ${status_reread} == WITHDRAWN — the re-read equals what the write already returned, i.e. nothing converged after the fact"
