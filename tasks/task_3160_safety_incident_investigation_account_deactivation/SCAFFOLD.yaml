# =============================================================================
# PRD Benchmark Scaffold — §1.0 through §1.7
# Task: task_3160_safety_incident_investigation_account_deactivation
# Scenario: Safety Incident Investigation & Account Deactivation (Uber)
#
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) and §1.9 (SCAFFOLD_CORNER_DESIGN.yaml)
# deliberately live in sibling files; neither key appears below.
# =============================================================================

# §1.0 Response Envelope — FIXED, emitted verbatim.
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

scenario: |
  Safety Incident Investigation & Account Deactivation (Uber): incident report intake from riders, drivers and third parties with severity classification, evidence gathering including trip data, in-app messages, ratings history and law enforcement contact, interim account holds during investigation with communication constraints, deactivation decision criteria by incident category with graduated outcomes, appeal process with review by a separate team and reinstatement conditions, mandatory reporting of certain incident categories to regulators and safety report publication, repeat pattern detection across accounts and devices, driver background rescreening cadence and continuous criminal monitoring

domain_name: "safety-incident-investigation-account-deactivation"
api_prefix: "/safety"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Posture-driven gating"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Contagion / risk propagation"
    - "Scheduled / deferred actions"
  entity_topology: "graph"
  state_machine_shape: "compound"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "self_referential"
    - "polymorphic"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: account_type
        type: enum
        source: input
        description: "Whether this account acts as a rider or a driver on the platform"
        constraints: "one of RIDER, DRIVER"
      - name: home_region_code
        type: string
        source: input
        description: "Two-letter operating region used for regulator routing and reporting thresholds"
        constraints: "immutable after creation"
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the rider or driver"
      - name: contact_email
        type: string
        source: input
        description: "Contact address used for account-safety notices; uniqueness scope is (contact_email, home_region_code)"
      - name: status
        type: enum
        source: computed
        description: "Account lifecycle standing, driven by the account state machine and by cascades from incident outcomes"
        default: "ACTIVE"
        constraints: "one of ACTIVE, UNDER_HOLD, PENDING_DECISION, RESTRICTED, DEACTIVATED, APPEAL_PENDING, REINSTATED"
      - name: safety_posture
        type: enum
        source: computed
        description: "Derived posture over the account's status and member enforcement actions; gates every child operation. FROZEN when account.status == 'APPEAL_PENDING'; RESTRICTED when account.status == 'RESTRICTED' or account.standing_enforcement_count >= 1; OPEN otherwise. Recomputed after every incident and enforcement mutation."
        default: "OPEN"
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: risk_score
        type: number
        source: computed
        description: "Contagion-propagated safety risk score on a 0-1000 clamped scale"
        default: 0
        constraints: "0 <= risk_score <= 1000"
      - name: risk_tier
        type: enum
        source: computed
        description: "Risk band derived from risk_score plus cumulative-severity escape hatch"
        default: "TIER_LOW"
        constraints: "one of TIER_LOW, TIER_ELEVATED, TIER_HIGH, TIER_SEVERE"
      - name: standing_enforcement_count
        type: integer
        source: computed
        description: "Number of the account's enforcement actions whose enforcement_status is IN {ACTIVE, MANDATORY_REPORTED, APPEAL_PENDING}"
        default: 0
        constraints: ">= 0"
      - name: deactivation_count
        type: integer
        source: computed
        description: "Number of the account's enforcement actions with outcome DEACTIVATED, counting every reinstatement generation"
        default: 0
        constraints: ">= 0"
      - name: three_year_drift_last_run_index
        type: integer
        source: system
        description: "Drift-run index at which this account was last evaluated for 3-year deactivation-policy drift; initialized to the Account's newly stamped policy_generation_index"
        default: 0
        constraints: "initialized to Account.policy_generation_index at creation"
      - name: prior_reinstatement_count
        type: integer
        source: computed
        description: "Number of completed reinstatements recorded against this account without an intervening deactivation"
        default: 0
        constraints: ">= 0"
      - name: policy_generation_index
        type: integer
        source: system
        description: "Snapshot of the PlatformPolicy.knob_generation_index that governs this account's thresholds; evaluated for 3-year drift when the policy generation advances past three_year_drift_last_run_index by a multiple of 3"
        default: 0

  # ---------------------------------------------------------------------------
  - name: DeviceCluster
    parent: null
    common_fields: true
    fields:
      - name: cluster_key
        type: string
        source: input
        description: "Stable operator-supplied identity of a shared-handset or device-farm group"
        constraints: "unique; may not be changed after creation"
      - name: region_code
        type: string
        source: input
        description: "Two-letter region the cluster operates in"
      - name: aggregate_cluster_risk
        type: number
        source: computed
        description: "Sum over every member account of the cluster, including members whose status is DEACTIVATED or REINSTATED, of that account's NON-CLUSTER risk components clamp(incident_risk + enforcement_risk, 0, 1000); the cluster term is deliberately excluded from the aggregate so the aggregate is well-defined without a fixed point"
        constraints: ">= 0, unbounded above"
        default: 0
        constraints: ">= 0, unbounded above"
      - name: clustered_actor_incident_count
        type: integer
        source: computed
        description: "Count of SafetyIncident records belonging to this cluster's member accounts whose severity is IN {S3, S4} and whose incident_status is IN {OPEN, INVESTIGATING, PENDING_DECISION, MANDATORY_REPORTED_BLOCKED, DECIDED}"
        default: 0
      - name: cluster_risk_generation_index
        type: integer
        source: system
        description: "Policy generation at which aggregate_cluster_risk was last recomputed; an advancing PlatformPolicy.knob_generation_index to a multiple of 2 marks this cluster for a stale-risk recompute"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Cluster standing, driven by the DeviceCluster state machine"
        default: "OPEN"
        constraints: "one of OPEN, WATCHLIST, BANNED"

  # ---------------------------------------------------------------------------
  - name: AccountDeviceLink
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account observed on the device fingerprint"
      - name: device_cluster_id
        type: string
        source: input
        description: "FK -> DeviceCluster.id; the cluster the fingerprint resolves to"
      - name: fingerprint_hash
        type: string
        source: input
        description: "Opaque device fingerprint hash that resolved to the cluster"
      - name: first_seen_at
        type: datetime
        source: system
        description: "Timestamp the link was first observed; stamped from the logical clock at link creation"
      - name: last_seen_at
        type: datetime
        source: computed
        description: "Timestamp of the most recent incident observation on this link; drives the 180-day dormancy boundary and is admitted as cluster evidence only inside the 180-day window ending at last_seen_at"
      - name: link_status
        type: enum
        source: computed
        description: "Whether the link still counts toward cluster attribution"
        default: "LINKED"
        constraints: "one of LINKED, DORMANT, SEVERED"

  # ---------------------------------------------------------------------------
  - name: Trip
    parent: Account
    common_fields: true
    fields:
      - name: rider_account_id
        type: string
        source: input
        description: "FK -> Account.id; the rider account on the trip"
      - name: driver_account_id
        type: string
        source: input
        description: "FK -> Account.id; the driver account on the trip"
      - name: region_code
        type: string
        source: input
        description: "Two-letter region the trip took place in"
      - name: requested_at
        type: datetime
        source: input
        description: "Dispatch request instant, supplied from the logical clock by the test surface"
      - name: completed_at
        type: datetime
        source: system
        description: "Completion instant stamped from the logical clock by the trip-completion endpoint; null while status is IN {REQUESTED, COMPLETED_PENDING}"
      - name: status
        type: enum
        source: computed
        description: "Trip lifecycle state"
        default: "REQUESTED"
        constraints: "one of REQUESTED, COMPLETED_PENDING, COMPLETED, CANCELLED"
      - name: in_app_message_count
        type: integer
        source: input
        description: "Number of in-app messages exchanged; admitted as evidence only when >= 1"
        default: 0
      - name: law_enforcement_contact_logged
        type: boolean
        source: input
        description: "Whether a law-enforcement contact was logged for this trip during intake"
        default: false

  # ---------------------------------------------------------------------------
  - name: SafetyIncident
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account whose conduct the incident concerns, and the parent whose version gates decision and appeal writes"
      - name: referenced_trip_id
        type: string
        source: input
        optional: true
        description: "FK -> Trip.id; the trip the incident arose from; may be null when no trip is involved"
      - name: reporter_type
        type: enum
        source: input
        description: "Who filed the incident report"
        constraints: "one of RIDER, DRIVER, THIRD_PARTY"
      - name: reporter_account_id
        type: string
        source: input
        optional: true
        description: "FK -> Account.id; the reporting account for RIDER and DRIVER reporters and null for THIRD_PARTY"
      - name: incident_category
        type: enum
        source: input
        description: "Classified category of the report; selects the decision-criteria row"
        constraints: "one of PHYSICAL_ASSAULT, SEXUAL_MISCONDUCT, HARASSMENT, SAFETY_VIOLATION, FRAUD_IDENTITY, DISCRIMINATION, PROPERTY_DAMAGE"
      - name: severity
        type: enum
        source: computed
        description: "Derived severity band combining category base level with intake aggravators S3_INJURY and S3_LAW_ENFORCEMENT_SEVERITY"
        default: "S1"
        constraints: "one of S1, S2, S3, S4"
      - name: aggravator_codes
        type: array
        source: input
        description: "Intake aggravator codes that escalate the severity band; S3_INJURY and S3_LAW_ENFORCEMENT_SEVERITY each add one escalation level"
        default: []
        constraints: "members in S3_INJURY, S3_LAW_ENFORCEMENT_SEVERITY; each code counted at most once"
      - name: derivative_severity_flagged
        type: boolean
        source: system
        description: "True only when the applied severity was escalated from S4 to S4, i.e. the computed band reached S4 (floor would have clamped) and at least one S3 aggravator code was applied"
        default: false
      - name: incident_status
        type: enum
        source: computed
        description: "Investigation lifecycle state, including the mandatory-report branch"
        default: "OPEN"
        constraints: "one of OPEN, INVESTIGATING, PENDING_DECISION, MANDATORY_REPORTED_BLOCKED, DECIDED, APPEAL_PENDING, APPEAL_UPHELD, APPEAL_OVERTURNED, WITHDRAWN"
      - name: decision_category
        type: enum
        source: computed
        description: "Outcome class committed by the decision endpoint"
        default: "PENDING"
        constraints: "one of PENDING, NO_ACTION, WARNING, RESTRICTED, DEACTIVATED"
      - name: decided_at
        type: datetime
        source: system
        description: "Instant the decision was committed; null before DECIDED"
      - name: decision_basis
        type: string
        source: input
        optional: true
        description: "Written rationale from the deciding SafetyInvestigator; at least 20 characters"
      - name: decision_evidence_score
        type: number
        source: computed
        description: "Snapshot of the incident's continuous evidence score at the instant the decision was committed; drives the deactivation threshold and the regression penalty"
        default: 0
      - name: decision_support
        type: number
        source: computed
        description: "Snapshot of the incident's support evidence score at the instant the decision was committed"
        default: 0
      - name: decision_distinct_evidence_sources
        type: integer
        source: computed
        description: "Snapshot of the count of distinct evidence source types at the instant the decision was committed"
        default: 0
      - name: appeal_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the SafetyAppealReviewer who committed the appeal outcome; null until an appeal outcome is committed. Must differ from the recorded decision_maker_user_id."
      - name: decision_maker_user_id
        type: string
        source: system
        description: "X-User-ID of the SafetyInvestigator who committed the decision; null before DECIDED. The thrown_on_appeal validation compares this against appeal_reviewer_user_id."
      - name: prior_incident_count_at_intake
        type: integer
        source: system
        description: "Count of the account's other SafetyIncident records created strictly before this incident's created_at; frozen at intake for a tamper-evident audit basis"
        default: 0
      - name: cluster_risk_multiplier_pct
        type: integer
        source: computed
        description: "Cluster risk multiplier applied to this incident's aggregate risk contribution. At intake the subject account's AccountDeviceLink rows are deduplicated by device_cluster_id keeping the row with the greatest last_seen_at (ties by created_at ASC); among the surviving rows with link_status IN {'LINKED','DORMANT'} the one with the greatest last_seen_at (ties by created_at ASC) resolves the cluster, and the value is clamp(100 + floor(aggregate_cluster_risk / 50), 100, 300). When no such row exists the multiplier is the 100 floor and no cluster term participates."
        default: 100

  # ---------------------------------------------------------------------------
  - name: IncidentEvidence
    parent: SafetyIncident
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> SafetyIncident.id; the incident this evidence is gathered for"
      - name: evidence_type
        type: enum
        source: input
        description: "Type of gathered evidence"
        constraints: "one of TRIP_DATA, IN_APP_MESSAGE, RATINGS_HISTORY, LAW_ENFORCEMENT_CONTACT, DEVICE_LINK, EXTERNAL_RECORD"
      - name: source_entity_id
        type: string
        source: input
        optional: true
        description: "Opaque id of the source artifact: a Trip.id for TRIP_DATA, an AccountDeviceLink.id for DEVICE_LINK, a Trip.id for IN_APP_MESSAGE, the subject Account.id for RATINGS_HISTORY, null for LAW_ENFORCEMENT_CONTACT and EXTERNAL_RECORD"
      - name: evidence_weight
        type: enum
        source: input
        description: "Mechanical weight class of this evidence item, consumed by the evidence-score calculation"
        constraints: "one of WEAK, STANDARD, STRONG, DISPOSITIVE"
      - name: evidence_status
        type: enum
        source: computed
        description: "Admissibility state of the evidence item"
        default: "PENDING"
        constraints: "one of PENDING, INCLUDED, EXCLUDED"
      - name: recorded_at
        type: datetime
        source: system
        description: "Instant the evidence was recorded from the logical clock; the deterministic ordering key for the evidence score"
      - name: exclusion_reason
        type: string
        source: computed
        description: "Why the item was dropped from the evidence score; null while evidence_status is IN {PENDING, INCLUDED}"

  # ---------------------------------------------------------------------------
  - name: EnforcementAction
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account the enforcement action applies to"
      - name: incident_id
        type: string
        source: input
        optional: true
        description: "FK -> SafetyIncident.id; the incident that produced this action and the parent whose version gates the appeal write"
      - name: outcome
        type: enum
        source: computed
        description: "Graduated enforcement outcome copied from the originating SafetyIncident.decision_category at creation; never client-supplied and never NONE"
        constraints: "one of WARNING, RESTRICTED, DEACTIVATED"
      - name: enforcement_status
        type: enum
        source: computed
        description: "Enforcement lifecycle state, including the mandatory-report gate and the appeal revert path"
        default: "DRAFT"
        constraints: "one of DRAFT, ACTIVE, MANDATORY_REPORTED, APPEAL_PENDING, REVERTED, EXPIRED"
      - name: effective_at
        type: datetime
        source: system
        description: "Instant the enforcement action took effect; stamped from the logical clock when the action moves to ACTIVE"
      - name: review_due_at
        type: datetime
        source: system
        description: "effective_at plus the 180-day review interval, used by the scheduled review sweep"
      - name: expires_at
        type: datetime
        source: system
        description: "effective_at plus the 365-day restriction horizon, used by the scheduled expiry sweep"
      - name: appeal_deadline_at
        type: datetime
        source: system
        description: "decided_at plus the 30-day appeal window; appeals filed at or after this instant are rejected"
      - name: decision_made_at
        type: datetime
        source: system
        description: "decided_at of the originating SafetyIncident, copied onto the action for the appeal-deadline rule"
      - name: last_applied_appeal_deadline
        type: datetime
        source: computed
        description: "Singleton-window buffer holding the appeal_deadline_at of the last appeal request that actually committed; used to keep a REVERTED action's deadline deterministic without a per-appeal child entity"
      - name: reinstatement_generation
        type: integer
        source: computed
        description: "Monotonic counter of how many times this action has been reinstated"
        default: 0
      - name: rehabilitation_credit
        type: integer
        source: computed
        description: "Free-of-incident completed-trip credit toward reinstatement; recomputed as the count of the subject account's COMPLETED trips whose completed_at is at or after the enforcement action's effective_at"
        default: 0
      - name: regulator_report_required
        type: boolean
        source: computed
        description: "True when the linked incident's incident_category is IN {PHYSICAL_ASSAULT, SEXUAL_MISCONDUCT} and the linked incident's severity is IN {S3, S4}"
        default: false
      - name: cluster_watchlist_triggered
        type: boolean
        source: system
        description: "True only when the mandatory-report commit cascade escalated the linked DeviceCluster from OPEN to WATCHLIST on its first crossing; false when the crossing was already reached"
        default: false

  # ---------------------------------------------------------------------------
  - name: RegulatorReport
    parent: SafetyIncident
    common_fields: true
    fields:
      - name: incident_id
        type: string
        source: input
        description: "FK -> SafetyIncident.id; the incident being reported"
      - name: region_code
        type: string
        source: input
        description: "Two-letter region the report is filed in; taken from the incident's subject Account.home_region_code"
      - name: report_channel
        type: enum
        source: input
        description: "Regulatory channel the report is filed through; REGULATOR_PORTAL is the channel the decision cascade files through and LAW_ENFORCEMENT is the channel the liaison files through directly"
        constraints: "one of REGULATOR_PORTAL, LAW_ENFORCEMENT"
      - name: filing_basis
        type: enum
        source: input
        description: "Why the report is being filed at intake"
        constraints: "one of PENDING, ROLLUP_THRESHOLD, ALWAYS_LAW_ENFORCEMENT, BLOCKED_WINDOW_TRIGGER"
      - name: filed_at
        type: datetime
        source: system
        description: "Instant the report was accepted into the filing queue"
      - name: report_status
        type: enum
        source: computed
        description: "Report lifecycle state; the window-open transition lets a BLOCKED report unblock retroactively"
        default: "BACKLOG"
        constraints: "one of BACKLOG, BLOCKED, FILED"

  # ---------------------------------------------------------------------------
  - name: BackgroundCheck
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the driver account the background check covers"
      - name: check_kind
        type: enum
        source: input
        description: "Which screening program this record belongs to"
        constraints: "one of CONTINUOUS_MONITOR, RESCREEN"
      - name: scheduled_due_at
        type: datetime
        source: system
        description: "For RESCREEN records, the instant the hand-run due sweep evaluates; base is the account's previous completed background-check completion instant, or the account created_at when none exists, plus floor((drift_index - 1)/3) * 548 days"
      - name: trigger_source
        type: enum
        source: computed
        description: "What caused this review record to exist; CONTINUOUS is written by the account-creation synthesis and CADENCE by the rescreen sweep"
        constraints: "one of CONTINUOUS, CADENCE"
      - name: triggered_by_incident_id
        type: string
        source: input
        optional: true
        description: "FK -> SafetyIncident.id; reserved for incident-triggered reviews and left null by both the account-creation synthesis and the rescreen sweep"
      - name: completed_at
        type: datetime
        source: system
        description: "Instant the review was completed; null while check_status is IN {SCHEDULED, IN_REVIEW}"
      - name: adjudication
        type: enum
        source: computed
        description: "Screening verdict, driving the account-status cascade"
        default: "PENDING"
        constraints: "one of PENDING, CLEAR, ADVERSE, INCONCLUSIVE"
      - name: adverse_reason_code
        type: string
        source: input
        optional: true
        description: "Structured reason code, required when adjudication is ADVERSE"
      - name: monitor_generation
        type: integer
        source: computed
        description: "Policy generation index on which this CONTINUOUS_MONITOR record was opened or last bumped"
        default: 0
      - name: check_status
        type: enum
        source: computed
        description: "Review lifecycle state"
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, IN_REVIEW, COMPLETED"

  # ---------------------------------------------------------------------------
  - name: PlatformPolicy
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: "Two-letter region the policy values apply to"
      - name: sd_floor_severity
        type: enum
        source: input
        description: "Severity band at or above which the deactivation-plus-refusal combination is prohibited"
        constraints: "one of S1, S2, S3, S4"
      - name: sd_floor_enabled
        type: boolean
        source: input
        description: "Whether the segregation-of-duties floor rule is armed for this region"
        default: true
      - name: rollup_window_days
        type: integer
        source: input
        description: "Length in days of the historical rollup window measured back from each incident's created_at; the window is closed-open [created_at - N days, created_at)"
        default: 30
      - name: rollup_threshold
        type: integer
        source: input
        description: "Minimum count of historical qualifying incidents in the rollup window that triggers a region rollup regulator report"
        default: 3
      - name: cluster_watchlist_threshold
        type: integer
        source: input
        description: "Minimum count of clustered S3/S4 incidents that escalates a DeviceCluster to WATCHLIST"
        default: 2
      - name: cluster_purge_threshold
        type: number
        source: input
        description: "Minimum aggregate_cluster_risk a WATCHLIST cluster must reach to escalate to BANNED"
        default: 2400
      - name: escalation_enabled
        type: boolean
        source: input
        description: "Whether the WATCHLIST-to-BANNED purge arm is enabled for this region"
        default: true
      - name: expedite_appeal_baseline_count
        type: integer
        source: input
        description: "Prior-incident count at intake at or above which an incident is appealed through the expedited track"
        default: 5
      - name: expedite_review_days
        type: integer
        source: input
        description: "Review interval for expedited appeals; the appeal decision is due at appeal_committed_at plus this many days"
        default: 14
      - name: standard_review_days
        type: integer
        source: input
        description: "Review interval for standard appeals"
        default: 30
      - name: appeal_window_days
        type: integer
        source: input
        description: "Length of the appeal window measured forward from decided_at; an appeal filed at or after this instant is rejected"
        default: 30
      - name: rescreen_refresh_days
        type: integer
        source: input
        description: "Per-drift-step refresh in days for driver background rescreening cadence"
        default: 548
      - name: continuous_monitor_ack_deadline_days
        type: integer
        source: input
        description: "Days a continuous-monitor review must be acknowledged within before the region's unacknowledged-review count climbs"
        default: 7
      - name: review_generation_index
        type: integer
        source: input
        description: "Monotonic index over the periodicity knobs (rollup_window_days, rollup_threshold, cluster_watchlist_threshold, cluster_purge_threshold, rescreen_refresh_days, continuous_monitor_ack_deadline_days, expedite_appeal_baseline_count, expedite_review_days, standard_review_days, appeal_window_days, sd_floor_severity); the SECOND update of any of these fields in a region increments this index"
        default: 1
      - name: knob_generation_index
        type: integer
        source: input
        description: "Monotonic index over the policy knobs that may change at any frequency (sd_floor_enabled, escalation_enabled); the 3-year drift helper and the cluster stale-risk helper both read this counter"
        default: 1

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Account
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: UNDER_HOLD
        trigger: "POST /incidents/{incidentId}/hold (system-actor transition)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'OPEN'"
          - "incident.severity IN {'S3','S4'}"
          - "incident.account_id == account.id"
        side_effects:
          - "account.status=UNDER_HOLD"
          - "incident.incident_status=INVESTIGATING"
          - "account.risk_score propagated by the risk_contagion_propagation calculation over all member incidents"
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /incidents/{incidentId}/decision with decision_category RESTRICTED"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'INVESTIGATING'"
          - "account.status == 'ACTIVE'"
        side_effects:
          - "account.status=RESTRICTED"
          - "incident.incident_status=DECIDED"
          - "incident.decision_category=RESTRICTED"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /incidents/{incidentId}/decision with decision_category DEACTIVATED"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'INVESTIGATING'"
          - "account.status == 'ACTIVE'"
          - "the subject account has no in-flight appeal: COUNT(EnforcementAction WHERE account_id == account.id AND enforcement_status IN {'ACTIVE','MANDATORY_REPORTED','APPEAL_PENDING'}) == 0"
        side_effects:
          - "account.status=DEACTIVATED"
          - "account.deactivation_count += 1"
          - "account.risk_score recomputed"
          - "incident.incident_status=DECIDED and incident.decision_category=DEACTIVATED"
          - "EnforcementAction{outcome=DEACTIVATED} created with enforcement_status=DRAFT, then ACTIVE or MANDATORY_REPORTED, setting effective_at, appeal_deadline_at, expires_at and review_due_at"
      - from: UNDER_HOLD
        to: PENDING_DECISION
        trigger: "POST /incidents/{incidentId}/evidence/accept (system-actor transition on the final outstanding evidence resolution)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'INVESTIGATING'"
          - "no IncidentEvidence row for the incident has evidence_status == 'PENDING'"
        side_effects:
          - "incident.incident_status=PENDING_DECISION"
          - "incident.decision_evidence_score=evidence_admissibility_score(incident) recomputed over INCLUDED and EXCLUDED rows"
          - "incident.decision_support=support_evidence_score(incident) recomputed"
          - "incident.decision_distinct_evidence_sources = COUNT(DISTINCT evidence_type OVER IncidentEvidence WHERE incident_id == incident.id AND evidence_status == 'INCLUDED')"
          - "account.status=PENDING_DECISION"
      - from: RESTRICTED
        to: UNDER_HOLD
        trigger: "POST /incidents/{incidentId}/hold (system-actor transition on a repeat incident)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'OPEN'"
          - "incident.severity IN {'S3','S4'}"
          - "incident.account_id == account.id"
        side_effects:
          - "account.status=UNDER_HOLD"
          - "incident.incident_status=INVESTIGATING"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
      - from: UNDER_HOLD
        to: ACTIVE
        trigger: "POST /incidents/{incidentId}/hold/release (system-actor transition when the account holds no standing enforcement action)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'INVESTIGATING'"
          - "incident.severity IN {'S3','S4'}"
          - "COUNT(EnforcementAction WHERE account_id == account.id AND enforcement_status IN {'ACTIVE','MANDATORY_REPORTED'}) == 0"
        side_effects:
          - "account.status=ACTIVE"
          - "incident.incident_status=OPEN"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
      - from: UNDER_HOLD
        to: RESTRICTED
        trigger: "POST /incidents/{incidentId}/hold/release (system-actor transition when the account still holds a standing ACTIVE enforcement action)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'INVESTIGATING'"
          - "incident.severity IN {'S3','S4'}"
          - "COUNT(EnforcementAction WHERE account_id == account.id AND enforcement_status IN {'ACTIVE','MANDATORY_REPORTED'}) >= 1"
        side_effects:
          - "account.status=RESTRICTED"
          - "incident.incident_status=OPEN"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
      - from: RESTRICTED
        to: PENDING_DECISION
        trigger: "POST /incidents/{incidentId}/evidence/accept (system-actor transition on the final outstanding evidence resolution for a repeat incident)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'INVESTIGATING'"
          - "no IncidentEvidence row for the incident has evidence_status == 'PENDING'"
        side_effects:
          - "incident.incident_status=PENDING_DECISION"
          - "incident.decision_evidence_score=evidence_admissibility_score(incident)"
          - "incident.decision_support=support_evidence_score(incident)"
          - "incident.decision_distinct_evidence_sources = COUNT(DISTINCT evidence_type OVER IncidentEvidence WHERE incident_id == incident.id AND evidence_status == 'INCLUDED')"
          - "account.status=PENDING_DECISION"
      - from: PENDING_DECISION
        to: RESTRICTED
        trigger: "POST /incidents/{incidentId}/decision with decision_category RESTRICTED"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'PENDING_DECISION'"
          - "account.status == 'PENDING_DECISION'"
        side_effects:
          - "account.status=RESTRICTED"
          - "incident.incident_status=DECIDED and incident.decision_category=RESTRICTED"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
          - "EnforcementAction{outcome=RESTRICTED} created with enforcement_status=DRAFT then ACTIVE, setting effective_at, expires_at, review_due_at and appeal_deadline_at"
      - from: PENDING_DECISION
        to: DEACTIVATED
        trigger: "POST /incidents/{incidentId}/decision with decision_category DEACTIVATED"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'PENDING_DECISION'"
          - "account.status == 'PENDING_DECISION'"
          - "the subject account has no in-flight appeal: COUNT(EnforcementAction WHERE account_id == account.id AND enforcement_status IN {'ACTIVE','MANDATORY_REPORTED','APPEAL_PENDING'}) == 0"
        side_effects:
          - "account.status=DEACTIVATED"
          - "account.deactivation_count += 1"
          - "account.risk_score recomputed"
          - "incident.incident_status=DECIDED and incident.decision_category=DEACTIVATED"
          - "EnforcementAction{outcome=DEACTIVATED} created with enforcement_status=DRAFT then ACTIVE or MANDATORY_REPORTED; regulator_report_required computed; when regime == ALWAYS_LAW_ENFORCEMENT a RegulatorReport is created and the action enters MANDATORY_REPORTED"
      - from: PENDING_DECISION
        to: RESTRICTED
        trigger: "POST /incidents/{incidentId}/decision with decision_category WARNING (system-actor transition writing the restricted posture)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'PENDING_DECISION'"
          - "account.status == 'PENDING_DECISION'"
        side_effects:
          - "account.status=RESTRICTED"
          - "incident.incident_status=DECIDED and incident.decision_category=WARNING"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
          - "EnforcementAction{outcome=WARNING} created with enforcement_status=DRAFT then ACTIVE"
      - from: PENDING_DECISION
        to: ACTIVE
        trigger: "POST /incidents/{incidentId}/decision with decision_category NO_ACTION (system-actor transition)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'PENDING_DECISION'"
          - "account.status == 'PENDING_DECISION'"
          - "incident.decision_support < 2.0"
        side_effects:
          - "account.status=ACTIVE"
          - "incident.incident_status=DECIDED and incident.decision_category=NO_ACTION"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /enforcement-actions/expiry-sweep (system transition; skipped for accounts with status == 'APPEAL_PENDING')"
        actor: system
        preconditions:
          - "the account's enforcement action has enforcement_status == 'ACTIVE'"
          - "clock >= enforcement_action.expires_at"
          - "account.status == 'RESTRICTED' (an APPEAL_PENDING account is skipped)"
          - "account does not currently sit at risk_tier == 'TIER_SEVERE'"
        side_effects:
          - "account.status=ACTIVE"
          - "enforcement_action.enforcement_status=EXPIRED"
          - "account.standing_enforcement_count -= 1"
          - "account.safety_posture recalculated"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
      - from: RESTRICTED
        to: DEACTIVATED
        trigger: "POST /enforcement-actions/expiry-sweep (system transition; a tier regression whose recomputed risk_tier == 'TIER_SEVERE' flips the expiry into a deactivation)"
        actor: system
        preconditions:
          - "the account's enforcement action has enforcement_status == 'ACTIVE'"
          - "clock >= enforcement_action.expires_at"
          - "account.status == 'RESTRICTED'"
          - "account.risk_tier == 'TIER_SEVERE'"
        side_effects:
          - "account.status=DEACTIVATED"
          - "account.deactivation_count += 1"
          - "enforcement_action.enforcement_status=EXPIRED"
          - "account.standing_enforcement_count -= 1"
          - "account.safety_posture recalculated"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
          - "EnforcementAction{outcome=DEACTIVATED, enforcement_status=ACTIVE} created with effective_at, appeal_deadline_at, expires_at and review_due_at stamped"
      - from: RESTRICTED
        to: DEACTIVATED
        trigger: "POST /incidents/{incidentId}/decision with decision_category DEACTIVATED (a subsequent incident committed while the account is RESTRICTED)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'PENDING_DECISION'"
          - "account.status == 'RESTRICTED'"
          - "the subject account has no in-flight appeal: COUNT(EnforcementAction WHERE account_id == account.id AND enforcement_status IN {'ACTIVE','MANDATORY_REPORTED','APPEAL_PENDING'}) == 0"
        side_effects:
          - "account.status=DEACTIVATED"
          - "account.deactivation_count += 1"
          - "account.risk_score recomputed"
          - "EnforcementAction{outcome=DEACTIVATED} created with enforcement_status=DRAFT then ACTIVE or MANDATORY_REPORTED"
      - from: DEACTIVATED
        to: APPEAL_PENDING
        trigger: "POST /incidents/{incidentId}/appeals (system-actor transition on the appeal write)"
        actor: SafetyAppealReviewer
        preconditions:
          - "incident.incident_status == 'DECIDED'"
          - "count of AppealEligibleIncident rows for the incident is exactly 1"
          - "clock < enforcement_action.appeal_deadline_at"
        side_effects:
          - "incident.incident_status=APPEAL_PENDING"
          - "account.status=APPEAL_PENDING"
          - "enforcement_action.enforcement_status=APPEAL_PENDING"
          - "enforcement_action.last_applied_appeal_deadline=appeal request arrival instant plus policy.appeal_window_days"
          - "the account's March 1 safety-report appearance is not reversed until the appeal outcome commits"
      - from: APPEAL_PENDING
        to: REINSTATED
        trigger: "POST /regulator-reports/attempt (system transition; the account is dropped from a consumer safety report while an appeal is pending)"
        actor: system
        preconditions:
          - "account.status == 'APPEAL_PENDING'"
          - "a RegulatorReport exists for the account's incident with report_channel == 'REGULATOR_PORTAL' and report_status == 'FILED'"
          - "attempt instant is at or after the report's published instant plus 365 days"
        side_effects:
          - "account.status=REINSTATED"
          - "the account is omitted from the newly published consumer safety report"
      - from: APPEAL_PENDING
        to: APPEAL_PENDING
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication UPHELD (cyclic revision round)"
        actor: SafetyAppealReviewer
        preconditions:
          - "incident.incident_status == 'APPEAL_PENDING'"
          - "clock >= enforcement_action.last_applied_appeal_deadline"
        side_effects:
          - "enforcement_action.enforcement_status=REVERTED"
          - "account.status=DEACTIVATED"
          - "account.deactivation_count += 1"
          - "incident.incident_status=APPEAL_UPHELD"
          - "the SafetyAppealReviewer may request a further review round, which re-enters DEACTIVATED and APPEAL_PENDING without changing the outcome"
      - from: APPEAL_PENDING
        to: ACTIVE
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication OVERTURNED (system-actor transition)"
        actor: SafetyAppealReviewer
        preconditions:
          - "incident.incident_status == 'APPEAL_PENDING'"
        side_effects:
          - "account.status=ACTIVE"
          - "account.prior_reinstatement_count += 1"
          - "incident.incident_status=APPEAL_OVERTURNED"
          - "enforcement_action.enforcement_status=REVERTED and enforcement_action.reinstatement_generation += 1"
          - "the account is dropped from the next published consumer safety report"
          - "risk_score reverts toward the incident-free baseline and must equal the pre-incident baseline exactly"

  # ---------------------------------------------------------------------------
  - entity: SafetyIncident
    initial_state: OPEN
    terminal_states: [DECIDED, APPEAL_UPHELD, APPEAL_OVERTURNED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /incidents/{incidentId}/hold"
        actor: SafetyInvestigator
        preconditions:
          - "incident.severity IN {'S3','S4'}"
          - "subject account.status == 'ACTIVE'"
        side_effects:
          - "account.status=UNDER_HOLD"
          - "the account's member announcements for the interval are suppressed"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /incidents/{incidentId}/withdraw"
        actor: SafetyOperationsLead
        preconditions:
          - "incident.decision_category == 'PENDING'"
          - "incident.severity == 'S1'"
        side_effects:
          - "incident.incident_status=WITHDRAWN"
          - "no EnforcementAction is created"
      - from: INVESTIGATING
        to: PENDING_DECISION
        trigger: "POST /incidents/{incidentId}/evidence/accept (system transition once the last PENDING evidence item resolves)"
        actor: SafetyInvestigator
        preconditions:
          - "no IncidentEvidence row for the incident has evidence_status == 'PENDING'"
          - "at least one IncidentEvidence row exists for the incident with evidence_status == 'INCLUDED'"
        side_effects:
          - "incident.decision_evidence_score=evidence_admissibility_score(incident)"
          - "incident.decision_support=support_evidence_score(incident)"
          - "incident.decision_distinct_evidence_sources = COUNT(DISTINCT evidence_type OVER IncidentEvidence WHERE incident_id == incident.id AND evidence_status == 'INCLUDED')"
          - "account.status=PENDING_DECISION"
      - from: INVESTIGATING
        to: OPEN
        trigger: "POST /incidents/{incidentId}/hold/release"
        actor: SafetyInvestigator
        preconditions:
          - "no EnforcementAction exists for the incident with enforcement_status IN {'ACTIVE','MANDATORY_REPORTED'}"
        side_effects:
          - "account.status=ACTIVE"
          - "the account's member announcements resume"
      - from: INVESTIGATING
        to: WITHDRAWN
        trigger: "POST /incidents/{incidentId}/withdraw"
        actor: SafetyOperationsLead
        preconditions:
          - "incident.decision_category == 'PENDING'"
          - "incident.severity == 'S2'"
        side_effects:
          - "incident.incident_status=WITHDRAWN"
          - "account.status=ACTIVE"
      - from: PENDING_DECISION
        to: MANDATORY_REPORTED_BLOCKED
        trigger: "POST /incidents/{incidentId}/decision with decision_category DEACTIVATED on an ALWAYS_LAW_ENFORCEMENT incident that sits inside an active regulator blocked window"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_category IN {'PHYSICAL_ASSAULT','SEXUAL_MISCONDUCT'}"
          - "incident.severity IN {'S3','S4'}"
          - "a RegulatorReport exists for the incident with report_status == 'BLOCKED'"
        side_effects:
          - "incident.incident_status=MANDATORY_REPORTED_BLOCKED"
          - "issue loop: the second decision attempt from this state with decision_category DEACTIVATED is rejected with ERR_REGULATOR_REPORT_BLOCKED while the linked report remains BLOCKED"
          - "when the report's window opens (regulator_report_window_open), the report moves to FILED and the single permitted hold-then-DECIDED cycle resumes through INVESTIGATING"
      - from: PENDING_DECISION
        to: DECIDED
        trigger: "POST /incidents/{incidentId}/decision"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'PENDING_DECISION'"
          - "the linked RegulatorReport, if any, has report_status == 'FILED'"
        side_effects:
          - "incident.incident_status=DECIDED"
          - "incident.decided_at stamped from the logical clock"
          - "account.status updated per the graduated decision-criteria matrix"
          - "EnforcementAction{outcome=incident.decision_category} created in enforcement_status=DRAFT"
          - "mandatory_report_commit cascade runs: when regulator_report_required is true the RegulatorReport moves BACKLOG to FILED and the enforcement action moves to MANDATORY_REPORTED; when the linked DeviceCluster has clustered_actor_incident_count >= policy.cluster_watchlist_threshold and cluster status == 'OPEN' the cluster moves OPEN to WATCHLIST and enforcement_action.cluster_watchlist_triggered is set true; when the cluster status == 'WATCHLIST' and aggregate_cluster_risk >= policy.cluster_purge_threshold and the linked account's risk_tier IN {'TIER_HIGH','TIER_SEVERE'} the cluster moves WATCHLIST to BANNED"
      - from: WITHDRAWN
        to: WITHDRAWN
        trigger: "POST /incidents/{incidentId}/decision (terminal lockdown: no decision may be committed against a withdrawn incident)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'WITHDRAWN'"
        side_effects:
          - "no transition occurs; the request is rejected with ERR_INVALID_STATE and no EnforcementAction is created"
      - from: DECIDED
        to: DECIDED
        trigger: "POST /incidents/{incidentId}/hold (terminal lockdown: an interim hold cannot be placed on an incident that has already been decided)"
        actor: SafetyInvestigator
        preconditions:
          - "incident.incident_status == 'DECIDED'"
        side_effects:
          - "no transition occurs; the request is rejected with ERR_INVALID_STATE and the account status is left unchanged"
      - from: DECIDED
        to: APPEAL_PENDING
        trigger: "POST /incidents/{incidentId}/appeals"
        actor: SafetyAppealReviewer
        preconditions:
          - "incident.decision_category == 'DEACTIVATED'"
          - "clock < appeal_deadline_at"
        side_effects:
          - "incident.incident_status=APPEAL_PENDING"
          - "account.status=APPEAL_PENDING"
          - "enforcement_action.enforcement_status=APPEAL_PENDING"
      - from: APPEAL_PENDING
        to: APPEAL_UPHELD
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication UPHELD"
        actor: SafetyAppealReviewer
        preconditions:
          - "the appeal reviewer X-User-ID differs from the incident's decision_maker_user_id"
          - "enforcement_action.rehabilitation_credit < 1"
        side_effects:
          - "incident.incident_status=APPEAL_UPHELD"
          - "account.status=DEACTIVATED"
          - "enforcement_action.enforcement_status=REVERTED"
      - from: APPEAL_UPHELD
        to: APPEAL_PENDING
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication UPHELD on a superseding decision revision"
        actor: SafetyAppealReviewer
        preconditions:
          - "the incident already carries a committed appeal outcome and clock >= enforcement_action.last_applied_appeal_deadline"
          - "enforcement_action.rehabilitation_credit < 1"
        side_effects:
          - "incident.incident_status=APPEAL_PENDING"
          - "enforcement_action.enforcement_status=APPEAL_PENDING"
          - "account.status=APPEAL_PENDING"
      - from: APPEAL_PENDING
        to: APPEAL_OVERTURNED
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication OVERTURNED"
        actor: SafetyAppealReviewer
        preconditions:
          - "the appeal reviewer X-User-ID differs from the incident's decision_maker_user_id"
          - "enforcement_action.rehabilitation_credit >= 1"
        side_effects:
          - "incident.incident_status=APPEAL_OVERTURNED"
          - "account.status=ACTIVE and account.prior_reinstatement_count += 1"
          - "enforcement_action.enforcement_status=REVERTED and enforcement_action.reinstatement_generation += 1"
      - from: APPEAL_UPHELD
        to: APPEAL_OVERTURNED
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication OVERTURNED on a superseding reinstatement request"
        actor: SafetyAppealReviewer
        preconditions:
          - "enforcement_action.rehabilitation_credit >= 1"
        side_effects:
          - "incident.incident_status=APPEAL_OVERTURNED"
          - "account.status=ACTIVE and account.prior_reinstatement_count += 1"
          - "enforcement_action.enforcement_status=REVERTED and enforcement_action.reinstatement_generation += 1"

  # ---------------------------------------------------------------------------
  - entity: EnforcementAction
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /incidents/{incidentId}/decision (system-actor transition when regulator_report_required is false)"
        actor: SafetyInvestigator
        preconditions:
          - "the linked incident moved to DECIDED"
          - "regulator_report_required == false"
        side_effects:
          - "effective_at=incident.decided_at"
          - "appeal_deadline_at=effective_at plus policy.appeal_window_days"
          - "expires_at=effective_at plus 365 days"
          - "review_due_at=effective_at plus 180 days"
          - "decision_made_at=incident.decided_at"
          - "account.standing_enforcement_count += 1 when enforcement_status IN {'ACTIVE','MANDATORY_REPORTED','APPEAL_PENDING'}"
          - "account.safety_posture recalculated"
          - "when outcome == 'DEACTIVATED' and account.deactivation_count >= 2 the case enters the publisher queue for the next March 1 consumer safety report"
      - from: DRAFT
        to: MANDATORY_REPORTED
        trigger: "POST /incidents/{incidentId}/decision (system-actor transition when regulator_report_required is true)"
        actor: SafetyInvestigator
        preconditions:
          - "the linked incident moved to DECIDED"
          - "regulator_report_required == true"
        side_effects:
          - "the RegulatorReport for the incident moves BACKLOG to FILED"
          - "effective_at, appeal_deadline_at, expires_at, review_due_at and decision_made_at stamped"
          - "account.standing_enforcement_count += 1"
          - "account.safety_posture recalculated"
          - "when the linked DeviceCluster has clustered_actor_incident_count >= policy.cluster_watchlist_threshold and cluster status == 'OPEN' the cluster moves OPEN to WATCHLIST and cluster_watchlist_triggered=true"
          - "when the linked DeviceCluster status == 'WATCHLIST' and aggregate_cluster_risk >= policy.cluster_purge_threshold and the account's risk_tier IN {'TIER_HIGH','TIER_SEVERE'} the cluster moves WATCHLIST to BANNED"
      - from: ACTIVE
        to: APPEAL_PENDING
        trigger: "POST /incidents/{incidentId}/appeals"
        actor: SafetyAppealReviewer
        preconditions:
          - "clock < appeal_deadline_at"
          - "the linked incident's decision_category == 'DEACTIVATED'"
        side_effects:
          - "account.status=APPEAL_PENDING"
          - "account.safety_posture=FROZEN"
          - "last_applied_appeal_deadline=appeal arrival instant plus policy.appeal_window_days"
      - from: ACTIVE
        to: APPEAL_PENDING
        trigger: "POST /incidents/{incidentId}/appeals (system-actor transition on a WARNING or RESTRICTED action)"
        actor: SafetyAppealReviewer
        preconditions:
          - "clock < appeal_deadline_at"
          - "the linked incident's decision_category IN {'WARNING','RESTRICTED'}"
        side_effects:
          - "account.status=APPEAL_PENDING"
          - "account.safety_posture=FROZEN"
          - "last_applied_appeal_deadline=appeal arrival instant plus policy.appeal_window_days"
      - from: MANDATORY_REPORTED
        to: MANDATORY_REPORTED
        trigger: "POST /regulator-reports/window-open (guard row: the linked report's blocked window must clear before the action may leave MANDATORY_REPORTED)"
        actor: RegulatorLiaison
        preconditions:
          - "the linked RegulatorReport has report_status == 'BLOCKED'"
        side_effects:
          - "no transition occurs while the linked report remains BLOCKED; the action stays MANDATORY_REPORTED and the account stays DEACTIVATED"
      - from: APPEAL_PENDING
        to: REVERTED
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication OVERTURNED on a WARNING or RESTRICTED action"
        actor: SafetyAppealReviewer
        preconditions:
          - "the linked incident's decision_category IN {'WARNING','RESTRICTED'}"
        side_effects:
          - "account.standing_enforcement_count -= 1"
          - "account.safety_posture recalculated"
      - from: MANDATORY_REPORTED
        to: REVERTED
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication OVERTURNED (system-actor transition for regulator-reportable actions)"
        actor: SafetyAppealReviewer
        preconditions:
          - "the appeal reviewer X-User-ID differs from the incident's decision_maker_user_id"
          - "enforcement_action.rehabilitation_credit >= 1"
          - "the linked RegulatorReport has report_status == 'FILED'"
        side_effects:
          - "enforcement_action.rehabilitation_credit -= 1"
          - "rehabilitation_credit recomputed as COUNT(Trip WHERE account_id == account.id AND status == 'COMPLETED' AND completed_at >= effective_at)"
          - "account.standing_enforcement_count -= 1"
      - from: ACTIVE
        to: REVERTED
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication OVERTURNED (system-actor transition)"
        actor: SafetyAppealReviewer
        preconditions:
          - "enforcement_action.rehabilitation_credit >= 1"
        side_effects:
          - "enforcement_action.rehabilitation_credit -= 1"
          - "rehabilitation_credit recomputed as COUNT(Trip WHERE account_id == account.id AND status == 'COMPLETED' AND completed_at >= effective_at)"
          - "account.standing_enforcement_count -= 1"
          - "account.safety_posture recalculated"
      - from: ACTIVE
        to: REVERTED
        trigger: "POST /incidents/{incidentId}/appeals/outcome with adjudication UPHELD (system-actor transition renaming an expired appeal to a formal rejection)"
        actor: SafetyAppealReviewer
        preconditions:
          - "clock >= enforcement_action.last_applied_appeal_deadline"
        side_effects:
          - "enforcement_action.rehabilitation_credit -= 1 (floored at 0)"
          - "account.standing_enforcement_count += 1 when the action returns to ACTIVE"
          - "the account remains DEACTIVATED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /enforcement-actions/expiry-sweep (system transition)"
        actor: system
        preconditions:
          - "clock >= expires_at"
          - "the account does not currently sit at risk_tier == 'TIER_SEVERE'"
        side_effects:
          - "account.status=ACTIVE"
          - "account.standing_enforcement_count -= 1"
          - "account.safety_posture recalculated"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /enforcement-actions/expiry-sweep (system transition; a tier regression whose recomputed risk_tier == 'TIER_SEVERE' deactivates the account instead of restoring it)"
        actor: system
        preconditions:
          - "clock >= expires_at"
          - "the account's recomputed risk_tier == 'TIER_SEVERE'"
        side_effects:
          - "account.status=DEACTIVATED"
          - "account.deactivation_count += 1"
          - "account.standing_enforcement_count -= 1"
          - "account.safety_posture recalculated"
          - "EnforcementAction{outcome=DEACTIVATED, enforcement_status=ACTIVE} created"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /enforcement-actions/review-tick (cyclic review round; effective_at is left untouched)"
        actor: system
        preconditions:
          - "clock >= review_due_at"
        side_effects:
          - "review_due_at += 180 days"
          - "the peer EnforcementAction on the same account whose effective_at is strictly earlier is re-checked and receives its own review_due_at += 180 days"
          - "the account's March 1 safety-report appearance is re-evaluated"

  # ---------------------------------------------------------------------------
  - entity: DeviceCluster
    initial_state: OPEN
    terminal_states: [BANNED]
    transitions:
      - from: OPEN
        to: WATCHLIST
        trigger: "POST /incidents/{incidentId}/decision (system-actor transition on the mandatory_report_commit cascade)"
        actor: system
        preconditions:
          - "clustered_actor_incident_count >= policy.cluster_watchlist_threshold"
          - "cluster status == 'OPEN'"
        side_effects:
          - "enforcement_action.cluster_watchlist_triggered=true ONLY on the first crossing; a subsequent crossing when the cluster is already WATCHLIST leaves the flag false"
          - "every member AccountDeviceLink whose link_status IN {'LINKED','DORMANT'} has link_status set to 'SEVERED'"
          - "the same rule subsumes the staleness drain: because a LINKED row older than 180 days is already DORMANT and a DORMANT row older than 365 days is already SEVERED, no separate newest-link arithmetic is required and every stale-but-superseded row is severed by this single clause"
          - "a BANNED cluster rejects any new AccountDeviceLink targeting it with ERR_CLUSTER_BANNED; pre-existing links are preserved rather than deleted"
      - from: WATCHLIST
        to: BANNED
        trigger: "POST /incidents/{incidentId}/decision (system-actor transition on the mandatory_report_commit cascade)"
        actor: system
        preconditions:
          - "aggregate_cluster_risk >= policy.cluster_purge_threshold"
          - "the linked account's risk_tier IN {'TIER_HIGH','TIER_SEVERE'}"
          - "policy.escalation_enabled == true"
        side_effects:
          - "cluster status=BANNED; new AccountDeviceLink rows targeting the cluster are rejected with ERR_CLUSTER_BANNED"
          - "every member account still reachable through the cluster is deactivation-eligible with outcome DEACTIVATED, including accounts whose only rows are SEVERED"
          - "when policy.escalation_enabled is false the WATCHLIST_to_BANNED edge is unavailable and the cluster remains WATCHLIST"
      - from: OPEN
        to: OPEN
        trigger: "POST /account-device-links (guard row: a link may only be recorded against a cluster whose status is OPEN or WATCHLIST)"
        actor: SafetyInvestigator
        preconditions:
          - "the target cluster.status IN {'OPEN'}"
        side_effects:
          - "no cluster transition occurs; the link is stored and the cluster remains OPEN"
      - from: WATCHLIST
        to: WATCHLIST
        trigger: "POST /account-device-links (guard row: a link may only be recorded against a cluster whose status is OPEN or WATCHLIST)"
        actor: SafetyInvestigator
        preconditions:
          - "the target cluster.status IN {'WATCHLIST'}"
        side_effects:
          - "no cluster transition occurs; the link is stored and the cluster remains WATCHLIST"
      - from: BANNED
        to: BANNED
        trigger: "POST /account-device-links (guard row: a link against a BANNED cluster is rejected before any row is written)"
        actor: SafetyInvestigator
        preconditions:
          - "the target cluster.status == 'BANNED'"
        side_effects:
          - "no link is stored; the request is rejected with ERR_CLUSTER_BANNED and the cluster remains BANNED"
      - from: WATCHLIST
        to: OPEN
        trigger: "POST /clusters/{clusterId}/stabilize (system-actor transition after 180 consecutive days with no new clustered S3/S4 incident)"
        actor: SafetyOperationsLead
        preconditions:
          - "clock >= the instant 180 days after the cluster's newest clustered S3/S4 incident created_at"
          - "aggregate_cluster_risk < policy.cluster_purge_threshold"
        side_effects:
          - "cluster status=OPEN"
          - "every member AccountDeviceLink with link_status == 'SEVERED' is restored to 'LINKED'"
          - "aggregate_cluster_risk recomputed and cluster_risk_generation_index stamped to the current knob_generation_index"

  # ---------------------------------------------------------------------------
  - entity: BackgroundCheck
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_REVIEW
        trigger: "POST /background-checks/{checkId}/acknowledge"
        actor: BackgroundReviewer
        preconditions:
          - "clock >= scheduled_due_at - policy.continuous_monitor_ack_deadline_days days"
        side_effects:
          - "check_status=IN_REVIEW"
          - "the region's unacknowledged-review count is decremented"
      - from: IN_REVIEW
        to: COMPLETED
        trigger: "POST /background-checks/{checkId}/adjudicate"
        actor: BackgroundReviewer
        preconditions:
          - "adjudication IN {'CLEAR','ADVERSE','INCONCLUSIVE'}"
          - "when adjudication == 'ADVERSE' the adverse_reason_code is present"
        side_effects:
          - "completed_at stamped from the logical clock"
          - "when adjudication == 'ADVERSE' the account is deactivation-eligible: account.status=DEACTIVATED and account.deactivation_count += 1"
          - "when adjudication == 'INCONCLUSIVE' the account risk_score is incremented by 30"
          - "when adjudication == 'CLEAR' the account risk_score is decremented by 15, floored at 0"
          - "account.risk_score propagated by the risk_contagion_propagation calculation"
      - from: COMPLETED
        to: SCHEDULED
        trigger: "POST /background-checks/rescreen-sweep (cyclic rescreen round creating the next SCHEDULED review)"
        actor: system
        preconditions:
          - "clock >= scheduled_due_at"
          - "the account's status IN {'ACTIVE','RESTRICTED','UNDER_HOLD'}"
        side_effects:
          - "a new BackgroundCheck{check_kind=RESCREEN, trigger_source=CADENCE, check_status=SCHEDULED} is created with scheduled_due_at = this completed_at plus floor((drift_index - 1)/3) * policy.rescreen_refresh_days"
          - "the account's three_year_drift_last_run_index is set to the drift_index at which the review was evaluated"

  # ---------------------------------------------------------------------------
  - entity: AccountDeviceLink
    initial_state: LINKED
    terminal_states: [SEVERED]
    transitions:
      - from: LINKED
        to: DORMANT
        trigger: "POST /account-device-links/dormancy-sweep (system transition)"
        actor: system
        preconditions:
          - "clock >= last_seen_at plus 180 days"
        side_effects:
          - "link_status=DORMANT"
          - "the link stops counting toward the cluster's clustered_actor_incident_count"
      - from: DORMANT
        to: SEVERED
        trigger: "POST /account-device-links/dormancy-sweep (system transition on a second 180-day interval)"
        actor: system
        preconditions:
          - "clock >= last_seen_at plus 365 days"
        side_effects:
          - "link_status=SEVERED"
      - from: LINKED
        to: SEVERED
        trigger: "POST /incidents/{incidentId}/decision (system-actor transition on the cluster WATCHLIST escalation)"
        actor: system
        preconditions:
          - "the linked DeviceCluster moved OPEN to WATCHLIST in this request"
        side_effects:
          - "link_status=SEVERED"
      - from: SEVERED
        to: LINKED
        trigger: "POST /clusters/{clusterId}/stabilize (system-actor transition)"
        actor: SafetyOperationsLead
        preconditions:
          - "the linked DeviceCluster moved WATCHLIST to OPEN in this request"
        side_effects:
          - "link_status=LINKED"

  # ---------------------------------------------------------------------------
  - entity: RegulatorReport
    initial_state: BACKLOG
    terminal_states: [FILED]
    transitions:
      - from: BACKLOG
        to: FILED
        trigger: "POST /incidents/{incidentId}/decision (system-actor transition when report_channel == 'REGULATOR_PORTAL')"
        actor: SafetyInvestigator
        preconditions:
          - "the linked incident moved to DECIDED"
        side_effects:
          - "report_status=FILED"
          - "filed_at stamped from the logical clock"
          - "the linked EnforcementAction moves DRAFT to MANDATORY_REPORTED"
      - from: BACKLOG
        to: BLOCKED
        trigger: "POST /incidents/{incidentId}/decision (system-actor transition inside an active regulator window block for an ALWAYS_LAW_ENFORCEMENT report)"
        actor: SafetyInvestigator
        preconditions:
          - "filing_basis == 'ALWAYS_LAW_ENFORCEMENT'"
          - "the decision instant falls inside the region's regulator window block"
        side_effects:
          - "report_status=BLOCKED"
          - "the linked incident moves PENDING_DECISION to MANDATORY_REPORTED_BLOCKED when the decision category is DEACTIVATED"
      - from: BLOCKED
        to: FILED
        trigger: "POST /regulator-reports/window-open (system transition when the region's blocked window closes)"
        actor: RegulatorLiaison
        preconditions:
          - "the region's regulator window block has closed at the report's region_code"
        side_effects:
          - "report_status=FILED"
          - "filed_at stamped from the logical clock"
          - "the linked incident returns to DECIDED-eligible: its incident_status moves MANDATORY_REPORTED_BLOCKED to PENDING_DECISION"
          - "the linked EnforcementAction moves DRAFT to MANDATORY_REPORTED"
      - from: BACKLOG
        to: FILED
        trigger: "POST /regulator-reports/rollup-sweep (system transition when the region rollup threshold is met)"
        actor: system
        preconditions:
          - "COUNT(SafetyIncident WHERE account_id == incident.account_id AND created_at >= incident.created_at minus policy.rollup_window_days days AND created_at < incident.created_at AND severity IN {'S3','S4'}) >= policy.rollup_threshold"
          - "the incident's subject Account.status IN {'DEACTIVATED','RESTRICTED','UNDER_HOLD','PENDING_DECISION','APPEAL_PENDING'}"
          - "no RegulatorReport already exists for the same (subject_account_id, region_code) pair"
        side_effects:
          - "report_status=FILED and filed_at stamped from the logical clock"
          - "issuance invariant: for every subject Account, COUNT(RegulatorReport WHERE region_code == account.home_region_code AND filing_basis IN {'ROLLUP_THRESHOLD','ALWAYS_LAW_ENFORCEMENT','BLOCKED_WINDOW_TRIGGER'}) <= 1; reports carrying filing_basis PENDING are exempt, so an intake-basis report may be filed on a first incident with zero qualifying historical incidents"

  # ---------------------------------------------------------------------------
  - entity: Trip
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: COMPLETED_PENDING
        trigger: "POST /trips/{tripId}/complete-start"
        actor: Driver
        preconditions:
          - "trip.driver_account_id == acting driver account id"
          - "the acting driver account.status IN {'ACTIVE','RESTRICTED'}"
        side_effects:
          - "status=COMPLETED_PENDING"
      - from: COMPLETED_PENDING
        to: COMPLETED
        trigger: "POST /trips/{tripId}/complete"
        actor: Driver
        preconditions:
          - "trip.status == 'COMPLETED_PENDING'"
        side_effects:
          - "completed_at stamped from the logical clock"
          - "both the rider account's and the driver account's risk_score are decremented by 2, floored at 0"
          - "for each of the two member accounts, COUNT(Trip WHERE account_id == that account AND status == 'COMPLETED' AND completed_at >= that account's open EnforcementAction.effective_at) is recomputed onto rehabilitation_credit"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /trips/{tripId}/cancel"
        actor: Rider
        preconditions:
          - "trip.status == 'REQUESTED'"
          - "trip.rider_account_id == acting rider account id"
        side_effects:
          - "status=CANCELLED and completed_at stays null"

  # ---------------------------------------------------------------------------
  - entity: PlatformPolicy
    initial_state: PUBLISHED
    terminal_states: []
    transitions:
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "PATCH /platform-policies/{policyId} (cyclic policy revision round)"
        actor: PlatformAdmin
        preconditions:
          - "every patched quantity is a non-negative integer or boolean"
        side_effects:
          - "when ANY of rollup_window_days, rollup_threshold, cluster_watchlist_threshold, cluster_purge_threshold, rescreen_refresh_days, continuous_monitor_ack_deadline_days, expedite_appeal_baseline_count, expedite_review_days, standard_review_days, appeal_window_days or sd_floor_severity is patched and the policy is non-null, policy.review_generation_index += 1 and clock += 1 day"
          - "when a later re-patch touches ONLY fields in that same periodicity family, policy.review_generation_index += 1 again and clock += 1 day; a re-patch touching only sd_floor_enabled or escalation_enabled never bumps review_generation_index"
          - "when EITHER sd_floor_enabled or escalation_enabled is patched and the policy is non-null, policy.knob_generation_index += 1"
          - "every Account in the policy's region_code is marked policy-drift-stale and receives policy_generation_index = policy.knob_generation_index"
          - "every BackgroundCheck of a member account is re-anchored: its scheduled_due_at is recomputed from its anchor completion instant using the new rescreen_refresh_days and a drift_index equal to the current review_generation_index"

# =============================================================================
# Table 2b: Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: incident-decision-stale-account
    parent_entity: SafetyIncident
    write_endpoint: "POST /incidents/{incidentId}/decision"
    occ_field: "expected_incident_version"
    description: |
      Committing an incident decision against a SafetyIncident whose version has
      advanced since the client last observed it is rejected. This captures the
      case where the incident's parent account has just been returned to ACTIVE
      by a hold release (legitimately superseding the in-flight investigation
      posture) and the deciding investigator's view of the incident is therefore
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enforcement-expiry-stale-account
    parent_entity: Account
    write_endpoint: "POST /enforcement-actions/expiry-sweep"
    occ_field: "expected_account_version"
    description: |
      Running the restriction-expiry sweep against an Account whose version has
      advanced since the caller last observed it is rejected. This captures the
      case where a support operator has just adjudicated a separate
      rehabilitation credit on the account (legitimately superseding the
      enforcement ledger the sweep was planned from) and the sweep's view of the
      account is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: appeal-outcome-stale-incident
    parent_entity: SafetyIncident
    write_endpoint: "POST /incidents/{incidentId}/appeals/outcome"
    occ_field: "expected_incident_version"
    description: |
      Committing an appeal outcome against a SafetyIncident whose version has
      advanced since the reviewing team last observed it is rejected. This
      captures the case where a hold release has legitimately returned the
      incident to OPEN under the separate-team review (superseding the
      pending-appeal posture) and the reviewer's view of the incident is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cluster-stabilize-stale-cluster
    parent_entity: DeviceCluster
    write_endpoint: "POST /clusters/{clusterId}/stabilize"
    occ_field: "expected_cluster_version"
    description: |
      Stabilizing a DeviceCluster whose version has advanced since the
      operations lead last observed it is rejected. This captures the case where
      a new member link has legitimately re-joined the cluster (superseding the
      severance set the stabilization was planned against) and the lead's view
      of the cluster is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: regulator-window-stale-report
    parent_entity: RegulatorReport
    write_endpoint: "POST /regulator-reports/window-open"
    occ_field: "expected_report_version"
    description: |
      Opening the regulator filing window against a RegulatorReport whose
      version has advanced since the liaison last observed it is rejected. This
      captures the case where the rollup sweep has legitimately already filed
      the same report (superseding the backlog item the window-open was planned
      against) and the liaison's view of the report is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: policy-revision-stale-region
    parent_entity: PlatformPolicy
    write_endpoint: "PATCH /platform-policies/{policyId}"
    occ_field: "expected_policy_version"
    description: |
      Revising regional policy values against a PlatformPolicy whose version has
      advanced since the administrator last observed it is rejected. This
      captures the case where a later patch has legitimately already changed a
      periodicity knob (superseding the region state the revision was planned
      against) and the administrator's view of the policy is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: incident_severity_classification
    trigger: "POST /incidents at intake; re-evaluated by PATCH /incidents/{incidentId}/severity when aggravator_codes change before a hold is placed"
    algorithm: threshold
    formula: |
      SEVERITY_BASE = {
        "PHYSICAL_ASSAULT": 4, "SEXUAL_MISCONDUCT": 4, "HARASSMENT": 2,
        "SAFETY_VIOLATION": 2, "FRAUD_IDENTITY": 2, "DISCRIMINATION": 2,
        "PROPERTY_DAMAGE": 1
      }
      AGGRAVATOR_LEVELS = {"S3_INJURY": 1, "S3_LAW_ENFORCEMENT_SEVERITY": 1}
      applied_levels = sum(AGGRAVATOR_LEVELS[code] for code in aggravator_codes)
      raw_level = SEVERITY_BASE[incident_category] + applied_levels
      band_level = min(raw_level, 4)
      severity = "S" + str(max(band_level, 1))
      applied_count = count of aggravator_codes entries in AGGRAVATOR_LEVELS, counting each code at most once
      derivative_severity_flagged = (raw_level >= 4 AND applied_count >= 1)
      # the flag is TRUE exactly on the saturated-to-S4 branch: the floor band already
      # reached S4 and at least one aggravator level was therefore consumed by clamping.
    input_set: "A single SafetyIncident at intake; aggravator_codes is deduplicated by code and each code contributes its level once"
    constants:
      BAND_MAX_LEVEL: 4
      BAND_MIN_LEVEL: 1
    precision: "exact integer band level; no rounding"
    variants:
      - name: band_from_category_then_aggravators
        when: "the intake request supplies aggravator_codes"
        difference: "category base level is added to the aggravator levels and the sum is clamped to 4; an S4 category with any aggravator saturates and sets derivative_severity_flagged"
      - name: floor_band_from_category_and_prior_count
        when: "the intake request supplies aggravator_codes as an empty set"
        difference: "the band floors at S2 whenever prior_incident_count_at_intake >= 2 and the category base level is 1, yielding S2 instead of the S1 the base level alone would produce"

  # ---------------------------------------------------------------------------
  - name: evidence_admissibility_score
    trigger: "POST /incidents/{incidentId}/evidence/accept; the value is frozen into SafetyIncident.decision_evidence_score at the PENDING_DECISION transition"
    algorithm: weighted_scoring
    formula: |
      # Rounding order is pinned: each admitted item is rounded to 3 decimals individually,
      # the admitted items are summed, and the sum is rounded to 2 decimals AT THE END.
      # The per-item weights are evaluated in the inclusive-exclusive band
      # [lower_bound, upper_bound) — that is, >= lower and < upper.
      WEIGHTS = [(0.75, 0.40, "WEAK"), (0.90, 0.70, "STANDARD"), (0.95, 1.00, "STRONG"), (0.95, 1.50, "DISPOSITIVE")]
      admitted = [e for e in IncidentEvidence where e.incident_id == incident.id
                  and e.evidence_status != "EXCLUDED"
                  and not is_stale(e)]
      per_item(e):
        reliability = 0.75 if e.evidence_type == "EXTERNAL_RECORD"
                      else 0.90 if e.evidence_type in {"IN_APP_MESSAGE","RATINGS_HISTORY"}
                      else 0.95
        base = {"WEAK": 0.40, "STANDARD": 0.70, "STRONG": 1.00, "DISPOSITIVE": 1.50}[e.evidence_weight]
        type_cap = 0.80 if e.evidence_type in {"IN_APP_MESSAGE","RATINGS_HISTORY"}
                   else 0.70 if e.evidence_type == "LAW_ENFORCEMENT_CONTACT"
                   else 1.00
        value = round(reliability * base, 3)
        return (value, type_cap)
      raw_contribution = sum(value for value, cap in [per_item(e) for e in admitted])
      required_distinct_sources = ceil(severity_level(incident.severity) * 0.5)   # S1→1, S2→1, S3→2, S4→2
      fulfillment_ratio = raw_contribution / required_distinct_sources
      missing_sources = max(0, required_distinct_sources - COUNT(DISTINCT evidence_type over admitted))
      CAP_PENALTY = 0.15 * missing_sources
      cap_ceiling = sum(cap for value, cap in [per_item(e) for e in admitted])
      weighted_average_type_cap = mean(cap for value, cap in [per_item(e) for e in admitted])
      continuous_score = round(min(round(raw_contribution, 3) - CAP_PENALTY, cap_ceiling), 2)
      applied_evidence_cap = cap_ceiling
      # a DISPOSITIVE item is promotable to score 3.00 only when
      #   confidence_ratio = raw_contribution / (0.95 * 1.50) >= 0.80
      #   AND COUNT(DISTINCT evidence_type over admitted) >= 2
      # otherwise it contributes its capped per-item value and a reducible flag is set
      support_score = COUNT(DISTINCT evidence_type over admitted
                            where evidence_type IN {"TRIP_DATA","RATINGS_HISTORY","LAW_ENFORCEMENT_CONTACT"})
      # NOTE: raw_contribution and continuous_score are the two readings pinned by the
      # `per_item_rounded_then_summed` / `raw_sum_then_capped` variants below.
    input_set: "IncidentEvidence rows for the incident whose evidence_status != 'EXCLUDED', with two unconditional exclusions applied before weighting: a LAW_ENFORCEMENT_CONTACT item with source_entity_id null is EXCLUDED with exclusion_reason STALE_SOURCE, and an IN_APP_MESSAGE item whose source Trip has in_app_message_count == 0 is EXCLUDED with exclusion_reason NO_MESSAGE_HISTORY. Staleness: a DEVICE_LINK item whose source AccountDeviceLink.last_seen_at is strictly earlier than clock minus 180 days is EXCLUDED with exclusion_reason STALE_LINK."
    constants:
      RELIABILITY_DEFAULT: 0.95
      RELIABILITY_EXTERNAL_RECORD: 0.75
      RELIABILITY_MESSAGE_OR_RATINGS: 0.90
      CAP_IN_APP_MESSAGE: 0.80
      CAP_RATINGS_HISTORY: 0.80
      CAP_LAW_ENFORCEMENT_CONTACT: 0.70
      CAP_PENALTY_PER_MISSING_SOURCE: 0.15
      DISPOSITIVE_PROMOTION_SCORE: 3.00
      DISPOSITIVE_CONFIDENCE_FLOOR: 0.80
      DISPOSITIVE_MIN_DISTINCT_SOURCES: 2
      STALE_LINK_MAX_AGE_DAYS: 180
    precision: "per-item round_half_up to 3 decimals, then sum, then round_half_up to 2 decimals"
    variants:
      - name: per_item_rounded_then_summed
        when: "the default evidence_score read path and the PENDING_DECISION freeze"
        difference: "each admitted item is rounded to 3 decimals before summing and the cap and penalty are applied to the rounded sum; the final value is rounded to 2 decimals"
      - name: raw_sum_then_capped
        when: "the incident summary projection used for investigator triage"
        difference: "the same items are summed unrounded and only the final value is rounded to 2 decimals, so the two readings of the same evidence set diverge by up to 0.02 whenever per-item third decimals are non-zero"

  # ---------------------------------------------------------------------------
  - name: risk_contagion_propagation
    trigger: "POST /incidents (intake), POST /incidents/{incidentId}/hold, POST /incidents/{incidentId}/hold/release, POST /incidents/{incidentId}/decision, POST /incidents/{incidentId}/appeals/outcome, POST /trips/{tripId}/complete, POST /background-checks/{checkId}/adjudicate"
    algorithm: contagion_propagation
    formula: |
      BASE = {"S1": 20, "S2": 60, "S3": 140, "S4": 260}[incident.severity]
      decay_factor(incident, now) = 1.00 if (now - incident.created_at) < 90 days
                                    0.50 if (now - incident.created_at) < 180 days
                                    0.00 otherwise
      effective_contribution(i) = BASE[i.severity] * decay_factor(i, now) * (i.cluster_risk_multiplier_pct / 100)
      incident_risk = sum(effective_contribution(i) for i in SafetyIncident
                          where i.account_id == account.id
                          and i.incident_status IN {"OPEN","INVESTIGATING","PENDING_DECISION","MANDATORY_REPORTED_BLOCKED","DECIDED"}
                          and i.severity IN {"S2","S3","S4"}
                          and NOT (i.incident_status == "DECIDED" AND i.decision_category == "WARNING"))
      enforcement_risk = sum(180 for a in EnforcementAction
                             where a.account_id == account.id
                             and a.enforcement_status IN {"ACTIVE","MANDATORY_REPORTED","APPEAL_PENDING"})
      cluster_risk = 0.25 * cluster.aggregate_cluster_risk where cluster = link_argmax_cluster(account) resolves
      # cluster.aggregate_cluster_risk sums each member account's (incident_risk + enforcement_risk)
      # and NOT the member's risk_score, so the aggregate never includes a cluster term of its own.
      # link_argmax_cluster(account): dedupe AccountDeviceLink rows by device_cluster_id keeping the row with
      # the greatest last_seen_at; ties broken by created_at ASC; the cluster is the device_cluster_id of the
      # surviving row whose link_status IN {"LINKED","DORMANT"} with the greatest last_seen_at, ties by created_at ASC;
      # when no such row exists the term is 0.
      raw_score = incident_risk + enforcement_risk + cluster_risk
      account.risk_score = min(1000, max(0, round(raw_score, 2)))
      sev_A = MAX over SafetyIncident where account_id == account.id and severity IN {"S3","S4"} of severity_level   # 0 when none
      sev_B = MAX over SafetyIncident where account_id == account.id and severity IN {"S3","S4"}
              and incident_status IN {"OPEN","INVESTIGATING","PENDING_DECISION","MANDATORY_REPORTED_BLOCKED"} of severity_level
      escalated = (sev_A >= 3 and sev_B is null and account.risk_score < 400)
      account.risk_tier = TIER_SEVERE if (account.risk_score >= 640 or escalated)
                          else TIER_HIGH if account.risk_score >= 420
                          else TIER_ELEVATED if account.risk_score >= 210
                          else TIER_LOW
    input_set: "All SafetyIncident rows for the account with incident_status IN {OPEN, INVESTIGATING, PENDING_DECISION, MANDATORY_REPORTED_BLOCKED, DECIDED} and severity IN {S2, S3, S4}; DECIDED rows whose decision_category is WARNING are additionally excluded. All EnforcementAction rows for the account with enforcement_status IN {ACTIVE, MANDATORY_REPORTED, APPEAL_PENDING}."
    constants:
      BASE_S1: 20
      BASE_S2: 60
      BASE_S3: 140
      BASE_S4: 260
      DECAY_STEP_1_DAYS: 90
      DECAY_STEP_2_DAYS: 180
      DECAY_FACTOR_STEP_1: 0.50
      DECAY_FACTOR_STEP_2: 0.00
      ENFORCEMENT_ACTIVE_WEIGHT: 180
      CLUSTER_TERM_COEFFICIENT: 0.25
      SCORE_CEILING: 1000
      SCORE_FLOOR: 0
      TIER_SEVERE_CUTOFF: 640
      TIER_HIGH_CUTOFF: 420
      TIER_ELEVATED_CUTOFF: 210
      TIER_SEVERE_RESCUE_SCORE_CEILING: 400
      CLEAR_ADJUDICATION_CREDIT: 15
      INCONCLUSIVE_ADJUDICATION_DEBIT: 30
      COMPLETED_TRIP_CREDIT: 2
    precision: "2 decimal places, round_half_up, applied once to raw_score before clamping"
    variants:
      - name: exit_inclusive_at_90_days
        when: "the incubation - the additive reading used by the incident intake response"
        difference: "at exactly 90 days after incident.created_at decay_factor is 1.00, so an S3 incident contributes 140.00 rather than the 70.00 the discrete-step reading would give"
      - name: exit_exclusive_at_90_days
        when: "the incubation - the discrete-step reading used by the periodic cluster recompute"
        difference: "at exactly 90 days after incident.created_at decay_factor is 0.50, so the same S3 incident contributes 70.00 instead of 140.00; the two readings are 70.00 apart for a single S3 incident"

  # ---------------------------------------------------------------------------
  - name: deactivation_decision_criteria
    trigger: "POST /incidents/{incidentId}/decision; the DEPARTED branch is re-evaluated by POST /trips/{tripId}/complete, which recomputes rehabilitation_credit as COUNT(Trip WHERE account_id == action.account_id AND status == 'COMPLETED' AND completed_at >= action.effective_at)"
    algorithm: threshold
    formula: |
      # tiered application order is pinned: category-tier floor is applied FIRST, then the
      # continuous-evidence overrides are applied in ascending threshold order
      # (2.50, then 4.00), each override raising but never lowering the floor result.
      tier_floor(category) =
        DEACTIVATED  if category IN {"PHYSICAL_ASSAULT","SEXUAL_MISCONDUCT"}
        RESTRICTED   if category IN {"HARASSMENT","DISCRIMINATION"} and incident.decision_support >= 2.0
        DEACTIVATED  if category == "HARASSMENT"
                     and COUNT over SafetyIncident where account_id == incident.account_id
                         and created_at < incident.created_at and severity IN {"S3","S4"} >= 2
        DEACTIVATED  if category == "FRAUD_IDENTITY"
                     and investigation_scope_ratio >= 0.70
        DEACTIVATED  if category == "SAFETY_VIOLATION"
                     and COUNT over SafetyIncident where account_id == incident.account_id
                         and created_at < incident.created_at and severity IN {"S3","S4"} >= 3
        WARNING      if category == "PROPERTY_DAMAGE" and incident.decision_evidence_score >= 1.50
        NO_ACTION    if category IN {"SAFETY_VIOLATION","FRAUD_IDENTITY","PROPERTY_DAMAGE","DISCRIMINATION","HARASSMENT"}
        # investigation_scope_ratio = COUNT over SafetyIncident where account_id == incident.account_id
        #                             and created_at >= incident.created_at - 30 days
        #                             and created_at <  incident.created_at
        investigation_scope_ratio = that_count / 5
      if incident.decision_evidence_score >= 4.00
         or (incident.decision_evidence_score >= 2.50 and incident.decision_distinct_evidence_sources >= 2):
        decision = DEACTIVATED
      elif incident.decision_evidence_score >= 2.50 and incident.decision_distinct_evidence_sources < 2:
        decision = max_by_order(tier_floor, RESTRICTED)
      else:
        decision = tier_floor
    input_set: "SafetyIncident.decision_evidence_score, decision_support and decision_distinct_evidence_sources are frozen at the PENDING_DECISION transition over the evidence set admitted by evidence_admissibility_score; the category tier is read from incident_category with no additional filtering"
    constants:
      SCORE_DEACTIVATION: 4.00
      SCORE_PROVISIONAL_DEACTIVATION: 2.50
      MIN_DISTINCT_SOURCES: 2
      HARRASSMENT_PRIOR_S3_S4_COUNT: 2
      SAFETY_VIOLATION_PRIOR_S3_S4_COUNT: 3
      INVESTIGATION_SCOPE_DIVISOR: 5
      INVESTIGATION_SCOPE_RATIO_FLOOR: 0.70
      PROPERTY_DAMAGE_WARNING_SCORE: 1.50
      WARNING_SUPPORT_FLOOR: 2.0
    precision: "exact comparison at the stated constants; no rounding applied to the frozen evidence score"
    variants:
      - name: evidence_threshold_then_category_floor
        when: "the continuous-score overrides apply (decision_evidence_score >= 2.50)"
        difference: "a PHYSICAL_ASSAULT incident with score 3.99 and only 1 distinct source resolves to RESTRICTED, because the provisional override holds the tier floor at RESTRICTED - it does NOT escape to DEACTIVATED"
      - name: category_floor_then_evidence_threshold
        when: "the category floor is read on its own for the same incident"
        difference: "a PHYSICAL_ASSAULT incident with the identical score and source count resolves to DEACTIVATED on the floor alone; the two readings of the same incident differ by exactly one decision tier"

  # ---------------------------------------------------------------------------
  - name: graduated_account_deactivation_rollup
    trigger: "POST /incidents/rollup-sweep; the region-window re-publish branch is honoured by POST /regulator-reports/attempt, which steps one window at a time and re-publishes the report whenever the window in which the account currently sits changes"
    algorithm: chronological
    formula: |
      # ordered pass over the subject account's SafetyIncident rows with
      # incident_status IN {"DECIDED","APPEAL_UPHELD"} and severity IN {"S3","S4"},
      # sorted by decided_at ASC, then created_at ASC, then category_rank ASC
      # (category_rank = PHYSICAL_ASSAULT 0, SEXUAL_MISCONDUCT 1, HARASSMENT 2,
      #  SAFETY_VIOLATION 3, FRAUD_IDENTITY 4, DISCRIMINATION 5, PROPERTY_DAMAGE 6).
      idx = 0
      for incident in ordered:
        if incident.severity == "S4" and idx == 0:
          rollup = "PERMANENT_DEACTIVATION"
        elif incident.severity == "S4" and idx == 1:
          rollup = "SIX_MONTH_RESTRICTION"
        elif incident.severity == "S4" and idx == 2:
          rollup = "TWELVE_MONTH_RESTRICTION"
        elif incident.severity == "S3" and idx == 0:
          rollup = "THIRTY_DAY_SUSPENSION"
        elif incident.severity == "S3" and idx == 1:
          rollup = "TWELVE_MONTH_SUSPENSION"
        else:
          rollup = "PERMANENT_DEACTIVATION"
        idx += 1
      # the FIRST entry of the ordered set is the only one that seeds the standing
      # rollup; every later entry overwrites the standing rollup but MUST NOT advance
      # idx arithmetic, which is why idx is a running counter and not the ordinal of
      # the entry that produced the standing outcome.
    input_set: "The subject account's SafetyIncident rows with incident_status IN {DECIDED, APPEAL_UPHELD} and severity IN {S3, S4}; decision_category is read only for the entry that produces the standing rollup. Multiple entries sharing a decided_at are ordered by created_at ASC, then category_rank ASC."
    constants:
      ROLLUP_COUNT: 5
      ROLLUP_CATEGORY_RANK_PHYSICAL_ASSAULT: 0
      ROLLUP_CATEGORY_RANK_SEXUAL_MISCONDUCT: 1
      ROLLUP_CATEGORY_RANK_HARASSMENT: 2
      ROLLUP_CATEGORY_RANK_SAFETY_VIOLATION: 3
      ROLLUP_CATEGORY_RANK_FRAUD_IDENTITY: 4
      ROLLUP_CATEGORY_RANK_DISCRIMINATION: 5
      ROLLUP_CATEGORY_RANK_PROPERTY_DAMAGE: 6
    precision: "exact ordinal selection; no rounding"
    variants:
      - name: running_counter_over_all_entries
        when: "the audit rollup that reasons about how many S3/S4 decided incidents the account has ever accumulated"
        difference: "idx counts every entry in the ordered set, so an account with three S4 incidents and one S3 incident reaches PERMANENT_DEACTIVATION regardless of how the entries interleave in time"
      - name: distinct_decided_at_ordinal
        when: "the standing-rollup reading that buckets entries by their decided_at day"
        difference: "entries that share a decided_at day are collapsed into one ordinal step, so the same four incidents can terminate at TWELVE_MONTH_SUSPENSION instead of PERMANENT_DEACTIVATION"

  # ---------------------------------------------------------------------------
  - name: regulator_report_rollup_threshold
    trigger: "POST /regulator-reports/rollup-sweep; re-evaluated by POST /trips/{tripId}/complete when the triggering count lands on the boundary"
    algorithm: threshold
    formula: |
      window_start = incident.created_at - policy.rollup_window_days days
      window_end   = incident.created_at
      qualifying_count = COUNT over SafetyIncident i
                         where i.account_id == incident.account_id
                         and (i.created_at == window_start OR i.created_at > window_start)
                         and i.created_at < window_end
                         and i.severity IN {"S3","S4"}
      current_incident_counted = (incident.severity IN {"S3","S4"})
      rollup_required = (qualifying_count >= policy.rollup_threshold)
      # the window is closed-open [window_start, window_end): an S3/S4 incident created at
      # exactly clock - 30 days at 00:00:00Z IS counted, and one created at exactly
      # window_end (that is, at the same instant as the triggering incident) is NOT.
    input_set: "All SafetyIncident rows for the subject account created in the closed-open window [incident.created_at - rollup_window_days days, incident.created_at) whose severity IN {S3, S4}; the triggering incident itself is outside the window and is tracked separately by current_incident_counted."
    constants:
      DEFAULT_ROLLUP_WINDOW_DAYS: 30
      DEFAULT_ROLLUP_THRESHOLD: 3
    precision: "exact integer comparison; no rounding"
    variants:
      - name: closed_open_window
        when: "the regulator report rollup (default reading)"
        difference: "an incident created exactly at window_start is counted and one at window_end is not, producing a count of 3 and a report at the threshold boundary"
      - name: closed_closed_window
        when: "the audit reconstruction used by RegulatorLiaison reporting review"
        difference: "both ends are counted, producing a count of 4 for the same three historical incidents plus one tie instant, so the account crosses the threshold one incident earlier than the report path shows"

  # ---------------------------------------------------------------------------
  - name: risk_tier_regression_from_restriction_expiry
    trigger: "POST /enforcement-actions/expiry-sweep when the sweep candidate's action would move ACTIVE to EXPIRED"
    algorithm: threshold
    formula: |
      # evaluation order pinned: the account post-expiry score is projected FIRST with the
      # expiring enforcement action removed from BOTH the score and the tier floor,
      # then the tier floor is recomputed, and only then is the projected tier compared.
      projected_score = clamp(score_without_expiring_action - 30, 0, 1000)
      projected_tier  = tier_from_score(projected_score)
      regression      = (tier_from_score(account.risk_score) == "TIER_SEVERE" and projected_tier != "TIER_SEVERE")
      # regression is true only when the pre-sweep tier is exactly TIER_SEVERE and the
      # projected tier is any other band; a pre-sweep TIER_HIGH that projects to
      # TIER_ELEVATED is NOT a regression.
      if regression:
        account.status = DEACTIVATED
        account.deactivation_count += 1
      else:
        account.status = ACTIVE
      # BOTH branches decrement account.standing_enforcement_count by exactly 1.
    input_set: "The expiring EnforcementAction row and the subject Account's SafetyIncident and EnforcementAction rows excluding the expiring action itself; the projection subtracts the risk_score is recomputed with the DECAY_STEP policy constants unchanged"
    constants:
      EXPIRY_SIMULATION_PENALTY: 30
      TIER_SEVERE_CUTOFF: 640
      TIER_HIGH_CUTOFF: 420
      TIER_ELEVATED_CUTOFF: 210
    precision: "2 decimal places, round_half_up on the projected score before the tier comparison"
    variants:
      - name: floor_projection_at_the_severe_cutoff
        when: "the default expiry-sweep reading"
        difference: "a projected score of exactly 640.00 yields TIER_SEVERE and therefore no regression: the expiry restores the account to ACTIVE"
      - name: exit_projection_at_the_severe_cutoff
        when: "the audit reading that treats the band as open at the cutoff"
        difference: "the same projected score of 640.00 falls out of TIER_SEVERE, so the account is deactivated instead of restored - the two readings differ by the whole expiry outcome"

  # ---------------------------------------------------------------------------
  - name: rescreen_cadence_projection
    trigger: "POST /background-checks/rescreen-sweep; re-derived by POST /config/advance, which bumps the review generation index and re-anchors every member account's BackgroundCheck.scheduled_due_at"
    algorithm: scheduled_deferred
    formula: |
      drift_index = policy.review_generation_index
      drift_steps = floor((drift_index - 1) / 3)
      ANCHOR_DAYS = 548
      refresh_days = (drift_steps + 1) * policy.rescreen_refresh_days
      base = most recent COMPLETED BackgroundCheck.completed_at for the account
             when one exists, else the account's created_at
      projected_due_at = base + refresh_days days
      due = clock >= projected_due_at
      # drift step 1 covers drift_index 1,2,3; step 2 covers 4,5,6; and so on.
    input_set: "The account's BackgroundCheck rows; only rows with check_status == 'COMPLETED' participate as an anchor, and the anchor is the row with the greatest completed_at, ties broken by created_at ASC"
    constants:
      ANCHOR_DAYS: 548
      DRIFT_INDEX_DIVISOR: 3
      RESCREEN_INTERVAL_DAYS: 548
    precision: "integer day arithmetic from the stored ISO timestamps; no fractional days"
    variants:
      - name: floor_drift_step
        when: "the standard rescreen cadence"
        difference: "review_generation_index 3 stays on drift step 1 and produces a due date 548 days after the anchor"
      - name: ceil_drift_step
        when: "the conservative compliance reading used in regulator reporting"
        difference: "review_generation_index 3 rounds to drift step 1 by ceil((3-1)/3) = 1 as well, but review_generation_index 4 rounds to drift step 1 by ceil((4-1)/3) = 1 whereas floor gives 1 too; the divergence appears at review_generation_index 7, where ceil gives 2 and floor gives 2 as well - the two readings coincide, and the pinned reading is the floor form"

  # ---------------------------------------------------------------------------
  - name: appeal_review_deadline
    trigger: "POST /incidents/{incidentId}/appeals (stamps the deadline bucket on commit) and POST /incidents/{incidentId}/appeals/outcome (compares the commit instant against it; a non-early outcome is rejected with ERR_APPEAL_NOT_ELIGIBLE)"
    algorithm: scheduled_deferred
    formula: |
      track = "EXPEDITED" if incident.prior_incident_count_at_intake >= policy.expedite_appeal_baseline_count
              else "STANDARD"
      review_days = policy.expedite_review_days if track == "EXPEDITED" else policy.standard_review_days
      appeal_window_check = (appeal_arrival_instant < enforcement_action.appeal_deadline_at)
      review_due_at = appeal_committed_at + review_days days
      early_eligible = clock >= review_due_at
      # appeal_committed_at is the arrival instant of the FIRST appeal request that
      # actually committed (that is: whose appeal_window_check held).
    input_set: "The subject SafetyIncident's frozen prior_incident_count_at_intake and the linked EnforcementAction's decided_at and appeal_deadline_at; the policy values are read from the subject account's home region code"
    constants:
      DEFAULT_EXPEDITE_APPEAL_BASELINE_COUNT: 5
      DEFAULT_EXPEDITE_REVIEW_DAYS: 14
      DEFAULT_STANDARD_REVIEW_DAYS: 30
      DEFAULT_APPEAL_WINDOW_DAYS: 30
    precision: "integer day arithmetic from the stamped ISO timestamps; no fractional days"
    variants:
      - name: standard_track
        when: "prior_incident_count_at_intake < policy.expedite_appeal_baseline_count"
        difference: "the review is due 30 days after the appeal commit instant, so an outcome committed 15 days later is refused with ERR_APPEAL_NOT_ELIGIBLE"
      - name: expedited_track
        when: "prior_incident_count_at_intake >= policy.expedite_appeal_baseline_count"
        difference: "the review is due 14 days after the same commit instant, so the identical 15-day-later outcome is accepted - the two tracks disagree on the eligibility of the very same request"

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present on every request; a request with no X-User-Role is rejected before any resource work"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role declared in X-User-Role is not permitted for the operation; unknown role strings are treated as unauthorised rather than unauthenticated"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "The target resource does not exist for GET /accounts/{id}, GET /incidents/{incidentId}, GET /enforcement-actions/{actionId}, GET /background-checks/{checkId} and GET /platform-policies/{policyId}"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /accounts/{id}, GET /incidents/{incidentId}, GET /enforcement-actions/{actionId}, GET /background-checks/{checkId}, GET /platform-policies/{policyId}"

  - priority: 4
    category: existence
    check: "The referenced incident does not exist on POST /incidents/{incidentId}/hold, /hold/release, /withdraw, /evidence/accept, /decision, /appeals and /appeals/outcome"
    error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /incidents/{incidentId}/hold, POST /incidents/{incidentId}/hold/release, POST /incidents/{incidentId}/withdraw, POST /incidents/{incidentId}/evidence/accept, POST /incidents/{incidentId}/decision, POST /incidents/{incidentId}/appeals, POST /incidents/{incidentId}/appeals/outcome"

  - priority: 5
    category: existence
    check: "The referenced trip does not exist on POST /trips/{tripId}/complete-start, /complete and /cancel"
    error_id: ERR_TRIP_NOT_FOUND
    http_status: 404
    applies_to: "POST /trips/{tripId}/complete-start, POST /trips/{tripId}/complete, POST /trips/{tripId}/cancel"

  - priority: 6
    category: state
    check: "The endpoint's target entity is not in a state from which the requested transition is declared; other work in the same request is suppressed and the state error wins over every later check"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /incidents/{incidentId}/hold, POST /incidents/{incidentId}/hold/release, POST /incidents/{incidentId}/withdraw, POST /incidents/{incidentId}/evidence/accept, POST /incidents/{incidentId}/decision, POST /incidents/{incidentId}/appeals, POST /incidents/{incidentId}/appeals/outcome, POST /trips/{tripId}/complete, POST /enforcement-actions/expiry-sweep"

  - priority: 7
    category: state
    check: "The idempotency guard fires on an in-flight or committed appeal: a second POST /incidents/{incidentId}/appeals while the incident sits at APPEAL_PENDING or already shows a committed appeal outcome is rejected, so exactly one appeal record can be in flight per incident and the account.safety_posture stays FROZEN"
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    applies_to: "POST /incidents/{incidentId}/appeals"

  - priority: 8
    category: state
    check: "The interim hold cannot be placed because the account is currently APPEAL_PENDING: communication suppression is only permitted for accounts that are ACTIVE, so an account already inside the appeal process is refused before the hold writes anything"
    error_id: ERR_HOLD_BLOCKED_BY_APPEAL
    http_status: 409
    applies_to: "POST /incidents/{incidentId}/hold"

  - priority: 9
    category: business_temporal
    check: "The incident severity is below the S3 floor required to open an interim hold"
    error_id: ERR_SEVERITY_BELOW_HOLD_FLOOR
    http_status: 422
    applies_to: "POST /incidents/{incidentId}/hold"

  - priority: 10
    category: business_temporal
    check: "The appeal is filed at or after the enforcement action's appeal_deadline_at, which is the decision instant plus policy.appeal_window_days"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /incidents/{incidentId}/appeals"

  - priority: 11
    category: business_temporal
    check: "The appeal outcome is committed before the review deadline: clock is strictly before appeal_committed_at plus policy.expedite_review_days on the EXPEDITED track, or plus policy.standard_review_days on the STANDARD track, and the appeal is rejected unless commit_early is true"
    error_id: ERR_APPEAL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /incidents/{incidentId}/appeals/outcome"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: the appeal reviewer X-User-ID equals the incident's recorded decision_maker_user_id, and the region's PlatformPolicy has sd_floor_enabled true with sd_floor_severity at or below the incident's severity band"
    error_id: ERR_THROWN_ON_APPEAL
    http_status: 422
    applies_to: "POST /incidents/{incidentId}/appeals/outcome"

  - priority: 13
    category: business_safety
    check: "The mandatory regulator-report gate blocks the write when the linked RegulatorReport still sits at BLOCKED inside an active regulator window block, even when the linked enforcement action is otherwise in a legal state for the request"
    error_id: ERR_REGULATOR_REPORT_BLOCKED
    http_status: 409
    applies_to: "POST /incidents/{incidentId}/decision, POST /regulator-reports/attempt"

  - priority: 14
    category: business_safety
    check: "The account cannot be deactivated while it carries an in-flight appeal, that is while COUNT(EnforcementAction WHERE account_id == account.id AND enforcement_status IN {ACTIVE, MANDATORY_REPORTED, APPEAL_PENDING}) > 0"
    error_id: ERR_IN_FLIGHT_APPEAL
    http_status: 409
    applies_to: "POST /incidents/{incidentId}/decision, POST /background-checks/{checkId}/adjudicate, POST /enforcement-actions/expiry-sweep"

  - priority: 15
    category: business_constraint
    check: "A new AccountDeviceLink targets a DeviceCluster whose status is BANNED, so the ban continues to hold against freshly observed fingerprints and pre-existing links are left untouched"
    error_id: ERR_CLUSTER_BANNED
    http_status: 422
    applies_to: "POST /account-device-links"

  - priority: 16
    category: business_constraint
    check: "OPTIMISTIC CONCURRENCY: the client's expected version of the write endpoint's parent entity does not match the parent's current version, so the write is refused as stale"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /incidents/{incidentId}/decision, POST /incidents/{incidentId}/appeals/outcome, POST /enforcement-actions/expiry-sweep, POST /clusters/{clusterId}/stabilize, POST /regulator-reports/window-open, PATCH /platform-policies/{policyId}"

  - priority: 17
    category: business_referential
    check: "The referenced trip does not involve both the incident's subject account and the reported counterparty account, so the trip cannot be attached as TRIP_DATA or IN_APP_MESSAGE evidence for the incident"
    error_id: ERR_TRIP_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /incidents/{incidentId}/evidence"

  - priority: 18
    category: business_constraint
    check: "The incident references a prior incident or a DeviceCluster from a different operating region, so cross-region evidence and precedence chains are refused"
    error_id: ERR_CROSS_REGION_REFERENCE
    http_status: 422
    applies_to: "POST /incidents/{incidentId}/evidence, POST /account-device-links"

  - priority: 19
    category: business_referential
    check: "A THIRD_PARTY incident report was submitted with reporter_account_id populated, or a RIDER or DRIVER report was submitted with reporter_account_id left null"
    error_id: ERR_REPORTER_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /incidents"

  - priority: 20
    category: business_constraint
    check: "At adjudication time an ADVERSE background-check verdict arrives with no adverse_reason_code"
    error_id: ERR_ADVERSE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /background-checks/{checkId}/adjudicate"

  - priority: 21
    category: business_fiscal
    check: "The monthly safety-report appearance cap for the region is already consumed by accounts whose deactivation_count is at or above 2, so the newly deactivation-eligible account is not queued into this month's consumer safety report and the cap decrements rather than the write failing"
    error_id: ERR_MONTHLY_REPORT_CAP_REACHED
    http_status: 422
    applies_to: "POST /incidents/{incidentId}/decision, POST /background-checks/{checkId}/adjudicate"

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:

  # --- Clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default time is 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["logical clock advances to the supplied instant"]

  # --- Account ---
