scenario: |
  Generate task harder than expert level!

  2431. Conveyor System Manufacturing & Integration (material handling systems integrator): concept design from customer throughput requirements with simulation of flow and bottlenecks, equipment selection across belt, roller, sortation and merge components with capacity ratings, controls architecture with programmable logic, scanning and warehouse system interfaces, fabrication and staging with pre-assembly and factory acceptance testing, site installation sequencing with existing operations continuing during phased cutover, commissioning with throughput ramp testing and acceptance criteria, spare parts provisioning and service contract with response commitments, change orders from customer scope evolution and post-acceptance performance disputes

domain_name: conveyor-integration-delivery
api_prefix: ""

complexity_profile:
  difficulty_level: expert_plus          # §0.4 Expert band, deliberately at the top of it (14 entities, 45 endpoints, 4+ non-linear machines)
  primary_archetype: graph_constraint    # the conveyor line is a DAG of segments; sustainable throughput and the bottleneck are a topological min over derated capacities
  secondary_archetype: multi_party_negotiation  # change-order rounds between integrator and customer, plus post-acceptance dispute with joint retest
  complexity_layers:
    - dual_variant_calculation           # deterministic vs availability-degraded simulation; nameplate vs observed-availability damages
    - cascading_side_effects             # change-order approval and FAT scrapping each propagate 3-4 hops
    - optimistic_concurrency             # OCC on Project.version and FabricationLot.version
    - rate_threshold_triggers            # escalation tiers, ramp targets, FAT attempt cap, damages cap, SLA breach

  entity_topology: graph
  # ConveyorSegment nodes + FlowLink edges form a DAG (many-to-many via the edge entity, cycle-rejecting);
  # everything else hangs off Project by FK, so the shape is a graph core with a flat FK rim — deliberately
  # NOT the hybrid tree that dominates prior scaffolds.

  state_machine_shape: parallel
  # Project carries two independent dimensions (delivery_status x commercial_status) that evolve on the same row;
  # FabricationLot (FAT_FAILED->FABRICATING), ChangeOrder (REVISION_REQUESTED->SUBMITTED), SiteZone
  # (CUTOVER_IN_PROGRESS->LIVE_LEGACY) and CutoverWindow (BLOCKED_STALE_DESIGN->SCHEDULED) are cyclic;
  # PerformanceDispute is branching with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Project -> segments, lots, zones, windows, ramps, change orders, spare lines
    - many_to_many         # FlowLink is the junction between ConveyorSegment rows (from_segment_id / to_segment_id)
    - self_referential     # ConveyorSegment reaches other ConveyorSegment rows through FlowLink; cycles are rejected
    - cross_aggregate      # CutoverWindow binds a shop-side FabricationLot to a site-side SiteZone

  role_model: segregation_of_duties
  # Five peer operator roles; additionally the ProjectDirector who issues an AcceptanceCertificate MUST NOT be
  # the same X-User-ID that recorded the passing 100% commissioning ramp step.

  consistency_model: immediate
  # Every cascade (design invalidation, window blocking, lot holding, share transfer, ledger recompute) is applied
  # inside the triggering request; no read-time reconciliation, no deferred jobs.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: customer_name
        type: string
        source: input
        description: "Distribution-center owner buying the conveyor system."
      - name: facility_code
        type: string
        source: input
        description: "Customer site identifier, e.g. 'DC-ATL-04'."
      - name: customer_rep_user_id
        type: string
        source: input
        description: "Opaque operator id of the customer representative allowed to act as CustomerRep on this project (compared against X-User-ID, never against any entity id)."
      - name: required_throughput_cph
        type: integer
        source: input
        description: "Contractual sustained system throughput in cartons per hour."
        constraints: ">= 1"
      - name: contract_base_cents
        type: integer
        source: input
        description: "Pre-escalation base contract price in cents."
        constraints: ">= 1"
      - name: authorized_ceiling_cents
        type: integer
        source: input
        description: "Customer-authorized maximum contract_value_cents; change-order approval is rejected above it."
        constraints: ">= contract_base_cents"
      - name: escalation_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.contract_value_recompute; tier fee keyed on the pre-fee subtotal."
      - name: contract_value_cents
        type: integer
        source: computed
        description: "Output of calculations.contract_value_recompute; subtotal + escalation_fee_cents."
      - name: spares_budget_cents
        type: integer
        source: input
        description: "Fixed pool available to fund SparePartLine stock; conserved quantity of the spares invariant."
        constraints: ">= 0"
      - name: spares_allocated_cents
        type: integer
        source: computed
        description: "Sum of SparePartLine.allocated_cents for lines with status IN {ALLOCATED, PARTIAL} on this project."
        default: 0
      - name: spares_unallocated_cents
        type: integer
        source: computed
        description: "Residual of the waterfall; initialised to spares_budget_cents."
      - name: service_tier
        type: enum
        source: input
        description: "Service contract coverage tier."
        constraints: "one of BASIC | PREMIUM | CRITICAL"
      - name: response_sla_minutes
        type: integer
        source: computed
        description: "Derived from service_tier via constants SLA_MINUTES_BY_TIER (BASIC=480, PREMIUM=240, CRITICAL=60)."
      - name: design_version
        type: integer
        source: computed
        description: "Monotonic counter of design mutations (segment create/patch, flow-link create, scope-bearing change-order approval). Distinct from the OCC `version` field."
        default: 1
      - name: delivery_status
        type: enum
        source: computed
        description: "Delivery dimension of the parallel state machine."
        default: DESIGN
        constraints: "one of DESIGN | DESIGN_FROZEN | IN_FABRICATION | REBASELINE_REQUIRED | CUTOVER | COMMISSIONING | ACCEPTED"
      - name: commercial_status
        type: enum
        source: computed
        description: "Commercial dimension of the parallel state machine; evolves independently of delivery_status."
        default: CLEAN
        constraints: "one of CLEAN | CHANGE_PENDING | DISPUTED | SETTLED"
      - name: legacy_share_bps
        type: integer
        source: computed
        description: "Basis points of facility throughput still running on the legacy (pre-project) material handling. Conserved quantity: legacy + in_transition + cutover == 10000."
        default: 10000
      - name: in_transition_share_bps
        type: integer
        source: computed
        description: "Basis points held by zones whose cutover window is IN_PROGRESS."
        default: 0
      - name: cutover_share_bps
        type: integer
        source: computed
        description: "Basis points running on the new system (zones with ops_status CUTOVER_COMPLETE)."
        default: 0
      - name: design_frozen_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent successful design freeze; null while delivery_status == DESIGN."
      - name: acceptance_ready
        type: boolean
        source: computed
        description: "True iff a PASS CommissioningRamp exists for each step_pct in {50, 75, 100} AND every SiteZone of the project has ops_status == CUTOVER_COMPLETE."
        default: false

  - name: ConveyorSegment
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning integration project."
      - name: segment_code
        type: string
        source: input
        description: "Business identifier of the segment, unique within the project (e.g. 'IB-01')."
      - name: equipment_class
        type: enum
        source: input
        description: "Selected equipment family, drives the class derate branch of the simulation."
        constraints: "one of BELT | ROLLER | SORTATION | MERGE"
      - name: rated_capacity_cph
        type: integer
        source: input
        description: "Vendor nameplate capacity in cartons per hour."
        constraints: ">= 1"
      - name: availability_pct
        type: integer
        source: input
        description: "Expected mechanical availability as a whole percent, used only by the DEGRADED_AVAILABILITY variant."
        constraints: "1..100"
      - name: source_share_bps
        type: integer
        source: input
        description: "Basis points of offered facility flow that enter the line at this segment. Required when the segment has no inbound FlowLink; MUST be null otherwise."
        constraints: "null or 1..10000"
      - name: inbound_link_count
        type: integer
        source: computed
        description: "Count of FlowLink rows with to_segment_id == this segment id."
        default: 0
      - name: outbound_link_count
        type: integer
        source: computed
        description: "Count of FlowLink rows with from_segment_id == this segment id."
        default: 0
      - name: flow_share_bps
        type: integer
        source: computed
        description: "Basis points of offered flow traversing this segment, propagated in topological order by calculations.line_throughput_simulation. Refreshed on every POST /projects/{id}/simulations and reflects that run's method."
        default: 0
      - name: derated_capacity_cph
        type: integer
        source: computed
        description: "Step-2 output of calculations.line_throughput_simulation for this segment (availability derate then class derate) under the method of the most recent SimulationRun for the project."
        default: 0

  - name: FlowLink
    parent: Project
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the DAG both endpoints belong to."
      - name: from_segment_id
        type: string
        source: input
        description: "FK -> ConveyorSegment.id; upstream node."
      - name: to_segment_id
        type: string
        source: input
        description: "FK -> ConveyorSegment.id; downstream node."
      - name: split_share_bps
        type: integer
        source: input
        description: "Basis points of the upstream segment's flow routed over this edge. All outbound edges of a segment MUST sum to exactly 10000."
        constraints: "1..10000"

  - name: SimulationRun
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; simulated project."
      - name: method
        type: enum
        source: input
        description: "Which variant of calculations.line_throughput_simulation was executed."
        constraints: "one of DETERMINISTIC_STEADY_STATE | DEGRADED_AVAILABILITY"
      - name: design_version_at_run
        type: integer
        source: computed
        description: "Snapshot of Project.design_version at run time; a run whose snapshot differs from the project's current design_version can never gate a design freeze."
      - name: effective_throughput_cph
        type: integer
        source: computed
        description: "Sustainable system throughput = min over segments of floor(derated_capacity_cph * 10000 / flow_share_bps)."
      - name: bottleneck_segment_code
        type: string
        source: computed
        description: "segment_code of the argmin segment (business code, not an id)."
      - name: bottleneck_availability_pct
        type: integer
        source: computed
        description: "availability_pct of the bottleneck segment; carried onto AcceptanceCertificate for the observed-availability damages variant."
      - name: shortfall_cph
        type: integer
        source: computed
        description: "max(0, Project.required_throughput_cph - effective_throughput_cph)."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the run."
        default: COMPLETE
        constraints: "one of COMPLETE | SUPERSEDED | STALE"

  - name: StagingBay
    parent: null
    common_fields: true
    fields:
      - name: bay_code
        type: string
        source: input
        description: "Shop floor pre-assembly bay label."
      - name: concurrent_capacity
        type: integer
        source: input
        description: "Maximum number of FabricationLot occupancies that may cover any single instant, counting closed-interval endpoints."
        constraints: ">= 1"

  - name: FabricationLot
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose segments this lot pre-assembles."
      - name: staging_bay_id
        type: string
        source: input
        description: "FK -> StagingBay.id; bay the lot occupies while staged."
      - name: lot_code
        type: string
        source: input
        description: "Shop traveller number."
      - name: segment_codes
        type: array
        source: input
        description: "Array of ConveyorSegment.segment_code strings on the same project covered by this lot; each element MUST resolve within the project."
      - name: occupancy_start_utc
        type: datetime
        source: input
        description: "Inclusive start of the bay occupancy interval."
      - name: occupancy_end_utc
        type: datetime
        source: input
        description: "Inclusive end of the bay occupancy interval; MUST be strictly after occupancy_start_utc."
      - name: fat_target_cph
        type: integer
        source: computed
        description: "ceil(Project.required_throughput_cph * FAT_MARGIN_PCT / 100), snapshotted at lot creation."
      - name: fat_attempt_count
        type: integer
        source: computed
        description: "Number of FatTest rows recorded against this lot."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Shop lifecycle with a rework cycle and a design-hold branch."
        default: PLANNED
        constraints: "one of PLANNED | FABRICATING | STAGED | FAT_PASSED | FAT_FAILED | HOLD | INSTALLED | SCRAPPED"

  - name: FatTest
    parent: FabricationLot
    common_fields: false
    fields:
      - name: fabrication_lot_id
        type: string
        source: input
        description: "FK -> FabricationLot.id; lot under factory acceptance test."
      - name: attempt_no
        type: integer
        source: computed
        description: "FabricationLot.fat_attempt_count + 1 at the moment of recording."
      - name: measured_cph
        type: integer
        source: input
        description: "Throughput measured on the shop test loop."
        constraints: ">= 0"
      - name: defect_count
        type: integer
        source: input
        description: "Punch-list defects found during the test."
        constraints: ">= 0"
      - name: target_cph_at_test
        type: integer
        source: computed
        description: "Snapshot of FabricationLot.fat_target_cph when the test was recorded."
      - name: result
        type: enum
        source: computed
        description: "PASS iff measured_cph >= target_cph_at_test AND defect_count <= FAT_MAX_DEFECTS; otherwise FAIL."
        constraints: "one of PASS | FAIL"

  - name: SiteZone
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose facility this zone belongs to."
      - name: zone_code
        type: string
        source: input
        description: "Facility zone label, e.g. 'Z-INBOUND'."
      - name: throughput_share_bps
        type: integer
        source: input
        description: "Basis points of facility throughput this zone carries; shares of all zones on a project MUST total 10000 before the first cutover window may start."
        constraints: "1..10000"
      - name: protected_shift_start_minute
        type: integer
        source: input
        description: "Minute-of-day (UTC) at which the customer's continuing operations shift starts; the protected window is [start, end) and recurs daily."
        constraints: "0..1439"
      - name: protected_shift_end_minute
        type: integer
        source: input
        description: "Minute-of-day (UTC) at which the protected shift ends; MUST be strictly greater than protected_shift_start_minute."
        constraints: "1..1440"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Symmetric quiet pad required between two cutover windows on this zone."
        constraints: ">= 0"
      - name: ops_status
        type: enum
        source: computed
        description: "Which system is carrying this zone's flow."
        default: LIVE_LEGACY
        constraints: "one of LIVE_LEGACY | CUTOVER_IN_PROGRESS | CUTOVER_COMPLETE"

  - name: CutoverWindow
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project being cut over."
      - name: site_zone_id
        type: string
        source: input
        description: "FK -> SiteZone.id; zone taken out of legacy service during the window."
      - name: fabrication_lot_id
        type: string
        source: input
        description: "FK -> FabricationLot.id; lot installed during the window."
      - name: start_utc
        type: datetime
        source: input
        description: "Inclusive start of the installation window; interval semantics are half-open [start_utc, end_utc)."
      - name: end_utc
        type: datetime
        source: input
        description: "Exclusive end of the installation window; MUST be strictly after start_utc."
      - name: status
        type: enum
        source: computed
        description: "Window lifecycle including a design-block cycle and two cancellation branches."
        default: SCHEDULED
        constraints: "one of SCHEDULED | BLOCKED_STALE_DESIGN | IN_PROGRESS | COMPLETED | ABORTED | CANCELLED_LOT_SCRAPPED"
      - name: abort_reason
        type: string
        source: input
        description: "Free-text reason captured on POST /cutover-windows/{id}/abort; null otherwise."
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the window moved to IN_PROGRESS."
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the window reached COMPLETED, ABORTED or CANCELLED_LOT_SCRAPPED."

  - name: CommissioningRamp
    parent: Project
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project being commissioned."
      - name: step_pct
        type: enum
        source: input
        description: "Ramp step being demonstrated."
        constraints: "one of 50 | 75 | 100"
      - name: measured_cph
        type: integer
        source: input
        description: "Sustained throughput observed during the step."
        constraints: ">= 0"
      - name: sustained_minutes
        type: integer
        source: input
        description: "Minutes the measured rate was held."
        constraints: ">= 0"
      - name: target_cph
        type: integer
        source: computed
        description: "ceil(Project.required_throughput_cph * step_pct / 100)."
      - name: min_sustained_minutes
        type: integer
        source: computed
        description: "RAMP_SUSTAIN_MINUTES[step_pct] (50 -> 30, 75 -> 60, 100 -> 120)."
      - name: verdict
        type: enum
        source: computed
        description: "PASS iff measured_cph >= target_cph AND sustained_minutes >= min_sustained_minutes; otherwise FAIL."
        constraints: "one of PASS | FAIL"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SiteManager who recorded the step; feeds the segregation-of-duties check at certificate issuance."

  - name: AcceptanceCertificate
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; accepted project."
      - name: accepted_throughput_cph
        type: integer
        source: computed
        description: "measured_cph of the PASS CommissioningRamp with step_pct == 100 having the greatest created_at."
      - name: bottleneck_availability_pct
        type: integer
        source: computed
        description: "bottleneck_availability_pct of the project's SimulationRun with method == DEGRADED_AVAILABILITY and status == COMPLETE."
      - name: retention_amount_cents
        type: integer
        source: computed
        description: "round_half_up(Project.contract_value_cents * RETENTION_BPS / 10000), snapshotted at issuance."
      - name: retention_release_cents
        type: integer
        source: computed
        description: "Retention actually released to the integrator; 0 at issuance, set when a dispute resolves."
        default: 0
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the issuing ProjectDirector."
      - name: dispute_deadline_utc
        type: datetime
        source: computed
        description: "created_at + DISPUTE_WINDOW_DAYS days; disputes filed after it are rejected."
      - name: status
        type: enum
        source: computed
        description: "Acceptance lifecycle."
        default: ISSUED
        constraints: "one of ISSUED | DISPUTED | UPHELD | REVISED"

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose scope is changing."
      - name: title
        type: string
        source: input
        description: "Short scope description."
      - name: scope_delta_cph
        type: integer
        source: input
        description: "Throughput scope change in cartons per hour; a non-zero value reopens the design on approval. Project.required_throughput_cph is never modified by a change order — the engineer must re-simulate the revised topology against the original requirement."
      - name: price_delta_cents
        type: integer
        source: input
        description: "Signed price change in cents applied to the contract subtotal on approval."
      - name: schedule_delta_days
        type: integer
        source: input
        description: "Signed schedule impact in days, recorded for the customer record."
      - name: round_no
        type: integer
        source: computed
        description: "Negotiation round; starts at 1 and increments on each REQUEST_REVISION decision."
        default: 1
      - name: decision_comment
        type: string
        source: input
        description: "Customer comment supplied with the review decision; null before any decision."
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CustomerRep who recorded the latest decision."
      - name: status
        type: enum
        source: computed
        description: "Negotiation lifecycle with a revision cycle."
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED"

  - name: SparePartLine
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose spares pool funds this line."
      - name: part_no
        type: string
        source: input
        description: "Manufacturer part number."
      - name: criticality
        type: enum
        source: input
        description: "Provisioning class; MINOR lines are never funded by the waterfall."
        constraints: "one of CRITICAL | MAJOR | MINOR"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Unit price in cents."
        constraints: ">= 1"
      - name: min_stock_qty
        type: integer
        source: input
        description: "Recommended on-site stock quantity."
        constraints: ">= 1"
      - name: lead_time_days
        type: integer
        source: input
        description: "Replenishment lead time; longer lead time is funded first within a criticality class."
        constraints: ">= 0"
      - name: requested_cents
        type: integer
        source: computed
        description: "unit_cost_cents * min_stock_qty."
      - name: weighted_target_cents
        type: integer
        source: computed
        description: "round_half_up(requested_cents * COVERAGE_FACTOR_BPS[criticality] / 10000), rounded per line BEFORE any summation."
      - name: allocated_cents
        type: integer
        source: computed
        description: "Cents actually funded by the most recent provisioning run."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Funding outcome of the most recent provisioning run."
        default: DRAFT
        constraints: "one of DRAFT | ALLOCATED | PARTIAL | UNFUNDED"

  - name: PerformanceDispute
    parent: AcceptanceCertificate
    common_fields: true
    fields:
      - name: acceptance_certificate_id
        type: string
        source: input
        description: "FK -> AcceptanceCertificate.id; certificate being disputed."
      - name: claimed_cph
        type: integer
        source: input
        description: "Throughput the customer claims the installed system actually sustains."
        constraints: ">= 0"
      - name: damages_basis
        type: enum
        source: input
        description: "Which variant of calculations.liquidated_damages binds the settlement."
        constraints: "one of NAMEPLATE | OBSERVED_AVAILABILITY"
      - name: provisional_nameplate_cents
        type: integer
        source: computed
        description: "NAMEPLATE variant evaluated on claimed_cph at filing time."
      - name: provisional_observed_cents
        type: integer
        source: computed
        description: "OBSERVED_AVAILABILITY variant evaluated on claimed_cph at filing time."
      - name: bound_provisional_cents
        type: integer
        source: computed
        description: "The one of the two provisional figures selected by damages_basis."
      - name: retest_measured_cph
        type: integer
        source: computed
        description: "Throughput measured during the joint retest; null while OPEN."
      - name: final_damages_cents
        type: integer
        source: computed
        description: "Bound variant re-evaluated on retest_measured_cph; null while OPEN."
      - name: sla_credit_cents
        type: integer
        source: computed
        description: "Service-response credit added when the joint retest lands later than Project.response_sla_minutes after filing; null while OPEN."
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the filing CustomerRep."
      - name: retest_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SiteManager who recorded the joint retest; null while OPEN."
      - name: retest_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the joint retest; null while OPEN."
      - name: status
        type: enum
        source: computed
        description: "Dispute lifecycle; the two resolutions carry different side-effect sets."
        default: OPEN
        constraints: "one of OPEN | RESOLVED_UPHELD | RESOLVED_CREDITED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Project
    dimension: delivery_status
    note: "Dimension 1 of 2 on the same row. Evolves independently of commercial_status: a project may be ACCEPTED while commercial_status is DISPUTED, and a DISPUTED project keeps making delivery transitions."
    initial_state: DESIGN
    terminal_states: [ACCEPTED]
    transitions:
      - from: DESIGN
        to: DESIGN_FROZEN
        trigger: "POST /projects/{id}/design-freeze"
        actor: ProjectDirector
        preconditions:
          - "project has >= 1 ConveyorSegment"
          - "sum(source_share_bps) over segments with inbound_link_count == 0 equals exactly 10000, else ERR_SOURCE_SHARE_INVALID"
          - "for every segment with outbound_link_count >= 1, sum(split_share_bps) of its outbound FlowLinks equals exactly 10000, else ERR_SPLIT_SHARE_INVALID"
          - "there exists a SimulationRun with project_id == this project, method == DEGRADED_AVAILABILITY, status == COMPLETE and design_version_at_run == Project.design_version, else ERR_SIMULATION_STALE_OR_MISSING"
          - "that run's effective_throughput_cph >= Project.required_throughput_cph, else ERR_THROUGHPUT_SHORTFALL"
        side_effects:
          - "set Project.design_frozen_at to the current logical clock"
          - "increment Project.version by 1"
      - from: DESIGN_FROZEN
        to: IN_FABRICATION
        trigger: "system — first FabricationLot of the project leaves PLANNED (POST /fabrication-lots/{id}/start-fabrication)"
        actor: system
        preconditions: ["Project.delivery_status == DESIGN_FROZEN"]
        side_effects: ["increment Project.version by 1"]
      - from: IN_FABRICATION
        to: CUTOVER
        trigger: "system — first CutoverWindow of the project enters IN_PROGRESS (POST /cutover-windows/{id}/start)"
        actor: system
        preconditions: ["Project.delivery_status == IN_FABRICATION"]
        side_effects: ["increment Project.version by 1"]
      - from: CUTOVER
        to: COMMISSIONING
        trigger: "system — bubble-up when every SiteZone of the project has ops_status == CUTOVER_COMPLETE (POST /cutover-windows/{id}/complete)"
        actor: system
        preconditions: ["every SiteZone with project_id == this project has ops_status == CUTOVER_COMPLETE"]
        side_effects: ["increment Project.version by 1"]
      - from: COMMISSIONING
        to: ACCEPTED
        trigger: "POST /acceptance-certificates"
        actor: ProjectDirector
        preconditions:
          - "Project.acceptance_ready == true, else ERR_ACCEPTANCE_PREREQ_NOT_MET"
          - "Project.commercial_status == CLEAN, else ERR_OPEN_CHANGE_ORDER"
          - "X-User-ID differs from recorded_by_user_id of the PASS step_pct == 100 CommissioningRamp, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "create AcceptanceCertificate with status ISSUED, retention_amount_cents, accepted_throughput_cph and bottleneck_availability_pct"
          - "increment Project.version by 1"
      - from: DESIGN_FROZEN
        to: DESIGN
        trigger: "system — cascade link 1 of transitive_cascade/change_order_reopens_design: ChangeOrder SUBMITTED -> APPROVED with scope_delta_cph != 0"
        actor: system
        preconditions: ["approved ChangeOrder.scope_delta_cph != 0"]
        side_effects:
          - "increment Project.design_version by 1 (this design_version change is what invalidates simulations in cascade link 2)"
          - "clear Project.design_frozen_at"
          - "increment Project.version by 1"
      - from: IN_FABRICATION
        to: DESIGN
        trigger: "system — same cascade as DESIGN_FROZEN -> DESIGN, from IN_FABRICATION"
        actor: system
        preconditions: ["approved ChangeOrder.scope_delta_cph != 0"]
        side_effects: ["increment Project.design_version by 1", "clear Project.design_frozen_at", "increment Project.version by 1"]
      - from: CUTOVER
        to: DESIGN
        trigger: "system — same cascade as DESIGN_FROZEN -> DESIGN, from CUTOVER"
        actor: system
        preconditions: ["approved ChangeOrder.scope_delta_cph != 0"]
        side_effects: ["increment Project.design_version by 1", "clear Project.design_frozen_at", "increment Project.version by 1"]
      - from: REBASELINE_REQUIRED
        to: DESIGN
        trigger: "system — same cascade as DESIGN_FROZEN -> DESIGN, from REBASELINE_REQUIRED"
        actor: system
        preconditions: ["approved ChangeOrder.scope_delta_cph != 0"]
        side_effects: ["increment Project.design_version by 1", "clear Project.design_frozen_at", "increment Project.version by 1"]
      - from: IN_FABRICATION
        to: REBASELINE_REQUIRED
        trigger: "system — cascade link 3 of transitive_cascade/fat_scrap_unwinds_cutover: at least one CutoverWindow of the project moved SCHEDULED -> CANCELLED_LOT_SCRAPPED in link 2"
        actor: system
        preconditions: ["Project.delivery_status == IN_FABRICATION"]
        side_effects: ["increment Project.version by 1"]
      - from: REBASELINE_REQUIRED
        to: IN_FABRICATION
        trigger: "system — a replacement FabricationLot is created for the project (POST /fabrication-lots)"
        actor: system
        preconditions: ["Project.delivery_status == REBASELINE_REQUIRED"]
        side_effects: ["increment Project.version by 1"]
        note: "Closes the rebaseline cycle IN_FABRICATION -> REBASELINE_REQUIRED -> IN_FABRICATION."

  - entity: Project
    dimension: commercial_status
    note: "Dimension 2 of 2 on the same row. No transition here reads or writes delivery_status."
    initial_state: CLEAN
    terminal_states: [SETTLED]
    transitions:
      - from: CLEAN
        to: CHANGE_PENDING
        trigger: "system — POST /change-orders/{id}/submit"
        actor: system
        preconditions: ["Project.commercial_status == CLEAN"]
        side_effects: ["increment Project.version by 1"]
      - from: CHANGE_PENDING
        to: CLEAN
        trigger: "system — POST /change-orders/{id}/review-decision with decision APPROVE or REJECT, when no ChangeOrder of the project remains in {SUBMITTED, REVISION_REQUESTED}"
        actor: system
        preconditions: ["count of ChangeOrder with project_id == this project and status IN {SUBMITTED, REVISION_REQUESTED} is 0 after the decision"]
        side_effects: ["increment Project.version by 1"]
      - from: CHANGE_PENDING
        to: CHANGE_PENDING
        trigger: "system — POST /change-orders/{id}/review-decision with decision REQUEST_REVISION, or an APPROVE/REJECT that still leaves an open ChangeOrder"
        actor: system
        preconditions: ["count of ChangeOrder with project_id == this project and status IN {SUBMITTED, REVISION_REQUESTED} is >= 1 after the decision"]
        side_effects: ["increment Project.version by 1"]
        note: "Self-loop: the commercial dimension stays CHANGE_PENDING across negotiation rounds."
      - from: CLEAN
        to: DISPUTED
        trigger: "system — POST /performance-disputes"
        actor: system
        preconditions: ["Project.commercial_status == CLEAN"]
        side_effects: ["increment Project.version by 1"]
      - from: DISPUTED
        to: SETTLED
        trigger: "system — POST /performance-disputes/{id}/joint-retest (either resolution branch)"
        actor: system
        preconditions: ["Project.commercial_status == DISPUTED"]
        side_effects: ["increment Project.version by 1"]

  - entity: SimulationRun
    initial_state: COMPLETE
    terminal_states: [SUPERSEDED, STALE]
    transitions:
      - from: COMPLETE
        to: SUPERSEDED
        trigger: "system — a newer SimulationRun with the same project_id and method reaches COMPLETE (POST /projects/{id}/simulations)"
        actor: system
        preconditions: ["the older run's status == COMPLETE"]
        side_effects: ["increment the superseded run's version by 1"]
      - from: COMPLETE
        to: STALE
        trigger: "system — Project.design_version changes (POST /segments, PATCH /segments/{id}, POST /flow-links, or cascade link 2 of transitive_cascade/change_order_reopens_design)"
        actor: system
        preconditions: ["the run's design_version_at_run != the project's new design_version"]
        side_effects:
          - "increment the run's version by 1"
          - "cascade link 3: every CutoverWindow of the project with status SCHEDULED becomes BLOCKED_STALE_DESIGN because no non-stale simulation remains"

  - entity: FabricationLot
    initial_state: PLANNED
    terminal_states: [INSTALLED, SCRAPPED]
    transitions:
      - from: PLANNED
        to: FABRICATING
        trigger: "POST /fabrication-lots/{id}/start-fabrication"
        actor: ShopSupervisor
        preconditions: ["Project.delivery_status IN {DESIGN_FROZEN, IN_FABRICATION}, else ERR_DESIGN_NOT_FROZEN"]
        side_effects:
          - "if Project.delivery_status == DESIGN_FROZEN then Project.delivery_status becomes IN_FABRICATION"
          - "increment FabricationLot.version by 1"
      - from: FAT_FAILED
        to: FABRICATING
        trigger: "POST /fabrication-lots/{id}/start-fabrication (rework)"
        actor: ShopSupervisor
        preconditions: ["FabricationLot.fat_attempt_count < FAT_MAX_ATTEMPTS"]
        side_effects: ["increment FabricationLot.version by 1"]
        note: "Rework cycle FAT_FAILED -> FABRICATING -> STAGED -> FAT_FAILED."
      - from: FABRICATING
        to: STAGED
        trigger: "POST /fabrication-lots/{id}/stage"
        actor: ShopSupervisor
        preconditions: ["FabricationLot.status == FABRICATING, else ERR_LOT_INVALID_STATE"]
        side_effects: ["increment FabricationLot.version by 1"]
      - from: STAGED
        to: FAT_PASSED
        trigger: "POST /fat-tests producing result PASS"
        actor: ShopSupervisor
        preconditions:
          - "expected_fabrication_lot_version equals FabricationLot.version, else ERR_STALE_LOT_VERSION"
          - "measured_cph >= FabricationLot.fat_target_cph AND defect_count <= FAT_MAX_DEFECTS"
        side_effects:
          - "create FatTest with result PASS and attempt_no = fat_attempt_count + 1"
          - "increment FabricationLot.fat_attempt_count by 1"
          - "increment FabricationLot.version by 1"
      - from: STAGED
        to: FAT_FAILED
        trigger: "POST /fat-tests producing result FAIL with attempt_no < FAT_MAX_ATTEMPTS"
        actor: ShopSupervisor
        preconditions: ["expected_fabrication_lot_version equals FabricationLot.version"]
        side_effects:
          - "create FatTest with result FAIL"
          - "increment FabricationLot.fat_attempt_count by 1"
          - "increment FabricationLot.version by 1"
      - from: STAGED
        to: SCRAPPED
        trigger: "POST /fat-tests producing result FAIL with attempt_no == FAT_MAX_ATTEMPTS"
        actor: ShopSupervisor
        preconditions: ["expected_fabrication_lot_version equals FabricationLot.version"]
        side_effects:
          - "create FatTest with result FAIL and attempt_no == 3"
          - "cascade link 1 of transitive_cascade/fat_scrap_unwinds_cutover: FabricationLot.status becomes SCRAPPED"
          - "cascade link 2 (caused by the lot being SCRAPPED): every CutoverWindow with fabrication_lot_id == this lot and status SCHEDULED becomes CANCELLED_LOT_SCRAPPED, releasing its zone reservation"
          - "cascade link 3 (caused by link 2's window cancellation): Project.delivery_status IN_FABRICATION becomes REBASELINE_REQUIRED"
          - "increment FabricationLot.version by 1"
      - from: STAGED
        to: HOLD
        trigger: "system — cascade link 4 of transitive_cascade/change_order_reopens_design (a CutoverWindow referencing this lot became BLOCKED_STALE_DESIGN in link 3)"
        actor: system
        preconditions: ["a CutoverWindow with fabrication_lot_id == this lot moved SCHEDULED -> BLOCKED_STALE_DESIGN in this request"]
        side_effects: ["increment FabricationLot.version by 1"]
      - from: FAT_PASSED
        to: HOLD
        trigger: "system — cascade link 4 of transitive_cascade/change_order_reopens_design, from FAT_PASSED"
        actor: system
        preconditions: ["a CutoverWindow with fabrication_lot_id == this lot moved SCHEDULED -> BLOCKED_STALE_DESIGN in this request"]
        side_effects: ["increment FabricationLot.version by 1"]
        note: "A held lot loses its FAT credit and must be re-tested from STAGED."
      - from: HOLD
        to: STAGED
        trigger: "system — POST /projects/{id}/simulations produces a COMPLETE DEGRADED_AVAILABILITY run with design_version_at_run == Project.design_version and effective_throughput_cph >= Project.required_throughput_cph"
        actor: system
        preconditions: ["a CutoverWindow referencing this lot moved BLOCKED_STALE_DESIGN -> SCHEDULED in this request"]
        side_effects: ["increment FabricationLot.version by 1"]
      - from: FAT_PASSED
        to: INSTALLED
        trigger: "system — POST /cutover-windows/{id}/complete"
        actor: system
        preconditions: ["the completing CutoverWindow.fabrication_lot_id == this lot"]
        side_effects: ["increment FabricationLot.version by 1"]

  - entity: CutoverWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED, CANCELLED_LOT_SCRAPPED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cutover-windows/{id}/start"
        actor: SiteManager
        preconditions:
          - "CutoverWindow.status == SCHEDULED — the target resource's own state is checked BEFORE any relative's state: status BLOCKED_STALE_DESIGN yields ERR_WINDOW_BLOCKED_STALE_DESIGN, any other non-SCHEDULED status yields ERR_WINDOW_INVALID_STATE"
          - "FabricationLot.status == FAT_PASSED, else ERR_LOT_NOT_FAT_PASSED (cross-entity dependency CutoverWindow -> FabricationLot)"
          - "SiteZone.ops_status == LIVE_LEGACY, else ERR_ZONE_NOT_READY"
          - "sum(throughput_share_bps) over all SiteZone of the project == 10000, else ERR_ZONE_SHARE_INCOMPLETE"
          - "current logical clock >= start_utc AND < end_utc, else ERR_WINDOW_NOT_DUE"
        side_effects:
          - "SiteZone.ops_status becomes CUTOVER_IN_PROGRESS"
          - "Project.legacy_share_bps decreases by SiteZone.throughput_share_bps and Project.in_transition_share_bps increases by the same amount"
          - "if Project.delivery_status == IN_FABRICATION then it becomes CUTOVER"
          - "set started_at to the current logical clock; increment CutoverWindow.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cutover-windows/{id}/complete"
        actor: SiteManager
        preconditions: ["CutoverWindow.status == IN_PROGRESS, else ERR_WINDOW_INVALID_STATE"]
        side_effects:
          - "SiteZone.ops_status becomes CUTOVER_COMPLETE"
          - "Project.in_transition_share_bps decreases by SiteZone.throughput_share_bps and Project.cutover_share_bps increases by the same amount"
          - "FabricationLot.status FAT_PASSED becomes INSTALLED"
          - "if every SiteZone of the project is CUTOVER_COMPLETE then Project.delivery_status CUTOVER becomes COMMISSIONING"
          - "set closed_at; increment CutoverWindow.version by 1"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /cutover-windows/{id}/abort"
        actor: SiteManager
        preconditions: ["CutoverWindow.status == IN_PROGRESS, else ERR_WINDOW_INVALID_STATE"]
        side_effects:
          - "SiteZone.ops_status returns to LIVE_LEGACY"
          - "Project.in_transition_share_bps decreases by SiteZone.throughput_share_bps and Project.legacy_share_bps increases by the same amount, restoring the conserved share total with zero drift"
          - "store abort_reason; set closed_at; increment CutoverWindow.version by 1"
        note: "Compensating action for SCHEDULED -> IN_PROGRESS."
      - from: SCHEDULED
        to: BLOCKED_STALE_DESIGN
        trigger: "system — cascade link 3 of transitive_cascade/change_order_reopens_design (every COMPLETE SimulationRun of the project became STALE in link 2)"
        actor: system
        preconditions: ["no SimulationRun of the project has status COMPLETE with design_version_at_run == Project.design_version"]
        side_effects:
          - "increment CutoverWindow.version by 1"
          - "cascade link 4 (caused by this blocking): the referenced FabricationLot in STAGED or FAT_PASSED becomes HOLD"
      - from: BLOCKED_STALE_DESIGN
        to: SCHEDULED
        trigger: "system — POST /projects/{id}/simulations produces a compliant COMPLETE DEGRADED_AVAILABILITY run for the current design_version"
        actor: system
        preconditions: ["the new run's effective_throughput_cph >= Project.required_throughput_cph"]
        side_effects:
          - "increment CutoverWindow.version by 1"
          - "the referenced FabricationLot in HOLD returns to STAGED"
        note: "Closes the design-block cycle SCHEDULED -> BLOCKED_STALE_DESIGN -> SCHEDULED."
      - from: SCHEDULED
        to: CANCELLED_LOT_SCRAPPED
        trigger: "system — cascade link 2 of transitive_cascade/fat_scrap_unwinds_cutover (the referenced FabricationLot became SCRAPPED in link 1)"
        actor: system
        preconditions: ["FabricationLot.status == SCRAPPED"]
        side_effects:
          - "set closed_at; increment CutoverWindow.version by 1"
          - "cascade link 3 (caused by this cancellation): Project.delivery_status IN_FABRICATION becomes REBASELINE_REQUIRED"

  - entity: SiteZone
    initial_state: LIVE_LEGACY
    terminal_states: [CUTOVER_COMPLETE]
    transitions:
      - from: LIVE_LEGACY
        to: CUTOVER_IN_PROGRESS
        trigger: "system — POST /cutover-windows/{id}/start"
        actor: system
        preconditions: ["SiteZone.ops_status == LIVE_LEGACY"]
        side_effects: ["increment SiteZone.version by 1"]
      - from: CUTOVER_IN_PROGRESS
        to: CUTOVER_COMPLETE
        trigger: "system — POST /cutover-windows/{id}/complete"
        actor: system
        preconditions: ["SiteZone.ops_status == CUTOVER_IN_PROGRESS"]
        side_effects: ["increment SiteZone.version by 1"]
      - from: CUTOVER_IN_PROGRESS
        to: LIVE_LEGACY
        trigger: "system — POST /cutover-windows/{id}/abort"
        actor: system
        preconditions: ["SiteZone.ops_status == CUTOVER_IN_PROGRESS"]
        side_effects: ["increment SiteZone.version by 1"]
        note: "Cycle LIVE_LEGACY -> CUTOVER_IN_PROGRESS -> LIVE_LEGACY; the zone may be re-attempted with a new window."

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/submit"
        actor: ProjectDirector
        preconditions: ["ChangeOrder.status == DRAFT, else ERR_CHANGE_ORDER_INVALID_STATE"]
        side_effects:
          - "Project.commercial_status CLEAN becomes CHANGE_PENDING"
          - "increment ChangeOrder.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/submit (resubmission in the same round)"
        actor: ProjectDirector
        preconditions: ["ChangeOrder.status == REVISION_REQUESTED"]
        side_effects: ["increment ChangeOrder.version by 1"]
        note: "Negotiation cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /change-orders/{id}/review-decision with decision REQUEST_REVISION"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == Project.customer_rep_user_id, else ERR_NOT_PROJECT_CUSTOMER"
          - "expected_project_version equals Project.version, else ERR_STALE_PROJECT_VERSION"
          - "round_no + 1 <= CHANGE_ORDER_MAX_ROUNDS, else ERR_CHANGE_ORDER_ROUND_LIMIT"
        side_effects:
          - "increment ChangeOrder.round_no by 1"
          - "store decision_comment and reviewed_by_user_id"
          - "increment Project.version by 1 and ChangeOrder.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /change-orders/{id}/review-decision with decision REJECT"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == Project.customer_rep_user_id"
          - "expected_project_version equals Project.version"
        side_effects:
          - "Project.commercial_status returns to CLEAN when no other ChangeOrder of the project is in {SUBMITTED, REVISION_REQUESTED}"
          - "Project.contract_value_cents is NOT recomputed"
          - "increment Project.version by 1 and ChangeOrder.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /change-orders/{id}/review-decision with decision APPROVE"
        actor: CustomerRep
        preconditions:
          - "X-User-ID == Project.customer_rep_user_id"
          - "expected_project_version equals Project.version, else ERR_STALE_PROJECT_VERSION"
          - "the recomputed Project.contract_value_cents <= Project.authorized_ceiling_cents, else ERR_CONTRACT_CEILING_EXCEEDED"
        side_effects:
          - "run calculations.contract_value_recompute: refresh Project.escalation_fee_cents and Project.contract_value_cents"
          - "Project.commercial_status returns to CLEAN when no other ChangeOrder of the project is in {SUBMITTED, REVISION_REQUESTED}"
          - "cascade link 1 (scope_delta_cph != 0 only): Project.design_version increments by 1 and delivery_status returns to DESIGN"
          - "cascade link 2 (caused by the design_version change): every SimulationRun of the project with status COMPLETE becomes STALE"
          - "cascade link 3 (caused by the simulations being STALE): every CutoverWindow of the project with status SCHEDULED becomes BLOCKED_STALE_DESIGN"
          - "cascade link 4 (caused by the windows being blocked): every FabricationLot referenced by those windows in STAGED or FAT_PASSED becomes HOLD"
          - "increment Project.version by 1 and ChangeOrder.version by 1"
        note: "A pure-price change order (scope_delta_cph == 0) recomputes money only — links 1..4 do not fire."

  - entity: AcceptanceCertificate
    initial_state: ISSUED
    terminal_states: [UPHELD, REVISED]
    transitions:
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /performance-disputes"
        actor: CustomerRep
        preconditions:
          - "AcceptanceCertificate.status == ISSUED, else ERR_CERTIFICATE_ALREADY_DISPUTED"
          - "current logical clock <= dispute_deadline_utc, else ERR_DISPUTE_WINDOW_EXPIRED"
          - "X-User-ID == Project.customer_rep_user_id, else ERR_NOT_PROJECT_CUSTOMER"
        side_effects:
          - "create PerformanceDispute with both provisional variants computed"
          - "Project.commercial_status CLEAN becomes DISPUTED"
          - "increment AcceptanceCertificate.version by 1"
      - from: DISPUTED
        to: UPHELD
        trigger: "system — POST /performance-disputes/{id}/joint-retest yielding final_damages_cents == 0"
        actor: system
        preconditions: ["PerformanceDispute.status == OPEN"]
        side_effects:
          - "retention_release_cents becomes retention_amount_cents (full release)"
          - "increment AcceptanceCertificate.version by 1"
      - from: DISPUTED
        to: REVISED
        trigger: "system — POST /performance-disputes/{id}/joint-retest yielding final_damages_cents > 0"
        actor: system
        preconditions: ["PerformanceDispute.status == OPEN"]
        side_effects:
          - "retention_release_cents becomes max(0, retention_amount_cents - final_damages_cents - sla_credit_cents)"
          - "increment AcceptanceCertificate.version by 1"

  - entity: PerformanceDispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_CREDITED]
    transitions:
      - from: OPEN
        to: RESOLVED_UPHELD
        trigger: "POST /performance-disputes/{id}/joint-retest with retest_measured_cph implying zero damages"
        actor: SiteManager
        preconditions:
          - "PerformanceDispute.status == OPEN, else ERR_DISPUTE_INVALID_STATE"
          - "final_damages_cents computed from the bound variant == 0"
        side_effects:
          - "store retest_measured_cph, retest_by_user_id, retest_recorded_at, sla_credit_cents and final_damages_cents = 0"
          - "AcceptanceCertificate becomes UPHELD with retention_release_cents = retention_amount_cents"
          - "Project.commercial_status becomes SETTLED"
          - "increment PerformanceDispute.version by 1"
      - from: OPEN
        to: RESOLVED_CREDITED
        trigger: "POST /performance-disputes/{id}/joint-retest with retest_measured_cph implying positive damages"
        actor: SiteManager
        preconditions:
          - "PerformanceDispute.status == OPEN"
          - "final_damages_cents computed from the bound variant > 0"
        side_effects:
          - "store retest_measured_cph, retest_by_user_id, retest_recorded_at, sla_credit_cents and final_damages_cents"
          - "AcceptanceCertificate becomes REVISED with retention_release_cents = max(0, retention_amount_cents - final_damages_cents - sla_credit_cents)"
          - "Project.commercial_status becomes SETTLED"
          - "increment PerformanceDispute.version by 1"
        note: "Branch fork with divergent side-effect sets: UPHELD releases retention in full, REVISED nets damages and the SLA credit out of it."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: change-order-decision-stale-project
    parent_entity: Project
    write_endpoint: "POST /change-orders/{id}/review-decision"
    occ_field: "expected_project_version"
    description: |
      Recording a customer decision against a Project whose version has advanced since the
      client last observed it is rejected. This captures the case where another decision has
      already been recorded on a sibling change order — legitimately superseding the pricing
      baseline the current decision was reasoned about — so the caller's view of
      contract_value_cents and ceiling headroom is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: spares-provisioning-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/spares-provisioning"
    occ_field: "expected_project_version"
    description: |
      Running the spares waterfall against a Project whose version has advanced since the
      client last observed it is rejected. A provisioning run legitimately supersedes the prior
      allocation, so a caller whose view predates another run (or a contract-value change that
      moved the budget baseline) is working from a stale pool.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: fat-test-stale-lot
    parent_entity: FabricationLot
    write_endpoint: "POST /fat-tests"
    occ_field: "expected_fabrication_lot_version"
    description: |
      Recording a factory acceptance test against a FabricationLot whose version has advanced
      since the client last observed it is rejected. A newer test legitimately supersedes the
      previous attempt result, so the caller's view of attempt count and lot status is stale.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: line_throughput_simulation
    trigger: "POST /projects/{id}/simulations (also refreshes ConveyorSegment.flow_share_bps and ConveyorSegment.derated_capacity_cph)"
    algorithm: topological
    formula: |
      # Step 0 — graph shape (already guaranteed acyclic by ERR_FLOW_CYCLE at edge creation)
      sources        = segments with inbound_link_count == 0
      require sum(source_share_bps over sources) == 10000            else ERR_SOURCE_SHARE_INVALID
      for every segment with outbound_link_count >= 1:
        require sum(split_share_bps over its outbound FlowLinks) == 10000  else ERR_SPLIT_SHARE_INVALID

      # Step 1 — flow share propagation, visiting nodes in topological order
      #           (ties in topological order broken by created_at ASC; ids never participate)
      flow_share_bps(source) = source_share_bps
      flow_share_bps(node)   = sum over inbound links L of
                                 floor(flow_share_bps(L.from) * L.split_share_bps / 10000)

      # Step 2 — capacity derate, applied in exactly this order, flooring after each substep
      cap = rated_capacity_cph
      if method == DEGRADED_AVAILABILITY:                     # variant switch, substep 2a
          cap = floor(cap * availability_pct / 100)
      if equipment_class == MERGE:                            # substep 2b, branch on class
          cap = floor(cap * (10000 - MERGE_DERATE_BPS_PER_EXTRA_INPUT * (inbound_link_count - 1)) / 10000)
      elif equipment_class == SORTATION and outbound_link_count >= 3:
          cap = floor(cap * (10000 - SORTATION_DIVERT_LOSS_BPS) / 10000)
      derated_capacity_cph = cap                              # BELT and ROLLER take no class derate

      # Step 3 — per-segment sustainable system rate, then the system minimum
      segment_system_rate = floor(derated_capacity_cph * 10000 / flow_share_bps)
      effective_throughput_cph = min over all segments of segment_system_rate
      bottleneck              = argmin segment; ties broken by lower derated_capacity_cph,
                                then earlier created_at (never by id)
      bottleneck_segment_code       = bottleneck.segment_code
      bottleneck_availability_pct   = bottleneck.availability_pct
      shortfall_cph = max(0, Project.required_throughput_cph - effective_throughput_cph)
    input_set: "Every ConveyorSegment with project_id == the project (no status filter — segments have no lifecycle) and every FlowLink with project_id == the project. Segments of other projects and links of other projects are excluded."
    constants:
      MERGE_DERATE_BPS_PER_EXTRA_INPUT: 400
      SORTATION_DIVERT_LOSS_BPS: 300
      SORTATION_DIVERT_MIN_OUTBOUND: 3
    precision: "Integer cartons per hour; floor at substeps 2a, 2b, step 1 and step 3 as written. No other rounding."
    variants:
      - name: DETERMINISTIC_STEADY_STATE
        when: "method == DETERMINISTIC_STEADY_STATE — the concept-design nameplate view sold to the customer"
        difference: "Substep 2a is skipped entirely: availability_pct never enters the arithmetic, so every segment contributes its full nameplate capacity."
      - name: DEGRADED_AVAILABILITY
        when: "method == DEGRADED_AVAILABILITY — the conservative basis that gates POST /projects/{id}/design-freeze"
        difference: "Substep 2a multiplies each segment by availability_pct/100 and floors before the class derate, which can move the bottleneck to a different segment and always yields effective_throughput_cph <= the deterministic value."

  - name: contract_value_recompute
    trigger: "POST /projects (initial value) and the ChangeOrder SUBMITTED -> APPROVED transition"
    algorithm: threshold
    formula: |
      # Circular-looking by construction: the escalation fee is keyed on a value tier, and the
      # contract value contains the fee. The evaluation order below is PINNED — the tier is
      # ALWAYS keyed on the pre-fee subtotal, never on contract_value_cents.
      subtotal_cents = Project.contract_base_cents
                     + sum(price_delta_cents of ChangeOrder rows with project_id == this project
                           and status == APPROVED, including the order being approved in this request)
      tier_bps = ESCALATION_TIER_1_BPS if subtotal_cents <= ESCALATION_TIER_1_MAX_CENTS
            else ESCALATION_TIER_2_BPS if subtotal_cents <= ESCALATION_TIER_2_MAX_CENTS
            else ESCALATION_TIER_3_BPS
      escalation_fee_cents = round_half_up(subtotal_cents * tier_bps / 10000)
      contract_value_cents = subtotal_cents + escalation_fee_cents
      # ceiling gate (fiscal validation, priority 15)
      reject with ERR_CONTRACT_CEILING_EXCEEDED if contract_value_cents > Project.authorized_ceiling_cents
    input_set: "ChangeOrder rows with status == APPROVED only. DRAFT, SUBMITTED, REVISION_REQUESTED and REJECTED orders never enter the subtotal."
    constants:
      ESCALATION_TIER_1_MAX_CENTS: 250000000
      ESCALATION_TIER_1_BPS: 150
      ESCALATION_TIER_2_MAX_CENTS: 500000000
      ESCALATION_TIER_2_BPS: 220
      ESCALATION_TIER_3_BPS: 300
    precision: "Whole cents, round_half_up on the fee only; the subtotal is an exact integer sum."
    variants: []

  - name: spares_budget_waterfall
    trigger: "POST /projects/{id}/spares-provisioning"
    algorithm: waterfall_allocation
    formula: |
      # Compensating reset first, so the run is idempotent in the conserved quantity.
      for every SparePartLine of the project with status IN {ALLOCATED, PARTIAL, UNFUNDED}:
          allocated_cents = 0; status = DRAFT
      Project.spares_allocated_cents   = 0
      Project.spares_unallocated_cents = Project.spares_budget_cents

      candidates = SparePartLine rows with project_id == this project
                   AND status == DRAFT
                   AND criticality IN {CRITICAL, MAJOR}          # MINOR is never funded
      reject with ERR_NO_FUNDABLE_SPARE_LINES if candidates is empty
      order candidates by: criticality rank ASC (CRITICAL=0, MAJOR=1),
                           then lead_time_days DESC,
                           then created_at ASC                    # never by id
      remaining = Project.spares_budget_cents
      for line in candidates (in that order):
          requested_cents       = unit_cost_cents * min_stock_qty
          # ROUNDING ORDER IS PINNED: round each line's weighted target to whole cents FIRST,
          # then accumulate. Summing requested_cents and rounding the total afterwards is WRONG
          # and can differ by a cent per rounded line.
          weighted_target_cents = round_half_up(requested_cents
                                    * COVERAGE_FACTOR_BPS[criticality] / 10000)
          allocated_cents       = min(weighted_target_cents, remaining)
          remaining            -= allocated_cents
          status = ALLOCATED if allocated_cents == weighted_target_cents and allocated_cents > 0
              else PARTIAL   if 0 < allocated_cents < weighted_target_cents
              else UNFUNDED
      Project.spares_allocated_cents   = sum(allocated_cents over candidates)
      Project.spares_unallocated_cents = remaining
      # invariant, checked after every run:
      #   spares_budget_cents == spares_allocated_cents + spares_unallocated_cents
    input_set: "SparePartLine rows with project_id == this project, status == DRAFT after the reset, and criticality IN {CRITICAL, MAJOR}. MINOR lines are excluded and keep status DRAFT with allocated_cents 0."
    constants:
      COVERAGE_FACTOR_BPS_CRITICAL: 10000
      COVERAGE_FACTOR_BPS_MAJOR: 6000
      COVERAGE_FACTOR_BPS_MINOR: 0        # MINOR lines are never funded, so their weighted_target_cents is 0 at creation
    precision: "Whole cents, round_half_up per line before summation; the residual `remaining` absorbs every fraction so no cent is created or destroyed."
    variants: []

  - name: ramp_step_evaluation
    trigger: "POST /commissioning-ramps"
    algorithm: threshold
    formula: |
      target_cph            = ceil(Project.required_throughput_cph * step_pct / 100)
      min_sustained_minutes = RAMP_SUSTAIN_MINUTES[step_pct]
      verdict = PASS if (measured_cph >= target_cph AND sustained_minutes >= min_sustained_minutes)
                else FAIL
      # sequencing gate (state validation, priority 8)
      reject with ERR_RAMP_SEQUENCE_VIOLATION unless every lower step_pct in {50, 75}
        that precedes this step already has a CommissioningRamp with verdict == PASS
    input_set: "CommissioningRamp rows with project_id == this project and verdict == PASS are the only rows that satisfy the sequencing gate; FAIL rows never unlock the next step."
    constants:
      RAMP_SUSTAIN_MINUTES_50: 30
      RAMP_SUSTAIN_MINUTES_75: 60
      RAMP_SUSTAIN_MINUTES_100: 120
    precision: "Integer cartons per hour; ceil on target_cph. Both comparisons are inclusive (>=), so measured_cph exactly equal to target_cph PASSES."
    variants: []

  - name: fat_result_evaluation
    trigger: "POST /fat-tests"
    algorithm: threshold
    formula: |
      target_cph_at_test = FabricationLot.fat_target_cph      # = ceil(required_throughput_cph * FAT_MARGIN_PCT / 100)
      attempt_no         = FabricationLot.fat_attempt_count + 1
      result = PASS if (measured_cph >= target_cph_at_test AND defect_count <= FAT_MAX_DEFECTS)
               else FAIL
      next_lot_status = FAT_PASSED if result == PASS
                   else SCRAPPED   if attempt_no == FAT_MAX_ATTEMPTS
                   else FAT_FAILED
    input_set: "The single FabricationLot named by fabrication_lot_id; FatTest rows only supply the attempt counter through FabricationLot.fat_attempt_count."
    constants:
      FAT_MARGIN_PCT: 105
      FAT_MAX_DEFECTS: 2
      FAT_MAX_ATTEMPTS: 3
    precision: "Integer cartons per hour; ceil on fat_target_cph at lot creation."
    variants: []

  - name: liquidated_damages
    trigger: "POST /performance-disputes (both provisional figures) and POST /performance-disputes/{id}/joint-retest (final figure, bound variant only)"
    algorithm: tiered_pricing
    formula: |
      # `observed_cph` is claimed_cph at filing and retest_measured_cph at joint retest.
      basis_cph = observed_cph                                   # NAMEPLATE variant
      basis_cph = floor(observed_cph * 100
                        / AcceptanceCertificate.bottleneck_availability_pct)   # OBSERVED_AVAILABILITY variant
      shortfall_pct = max(0, floor((Project.required_throughput_cph - basis_cph) * 100
                                   / Project.required_throughput_cph))
      raw_cents = round_half_up(Project.contract_value_cents
                                * shortfall_pct * LD_BPS_PER_SHORTFALL_PCT / 10000)
      cap_cents = round_half_up(Project.contract_value_cents * LD_CAP_BPS / 10000)
      damages_cents = min(raw_cents, cap_cents)
    input_set: "The single AcceptanceCertificate named by acceptance_certificate_id and its Project. contract_value_cents is read live from the Project; bottleneck_availability_pct is the certificate's snapshot, so later design edits cannot move a settled figure."
    constants:
      LD_BPS_PER_SHORTFALL_PCT: 50
      LD_CAP_BPS: 500
    precision: "Whole cents; floor on basis_cph and on shortfall_pct (whole percentage points only), round_half_up on the money."
    variants:
      - name: NAMEPLATE
        when: "PerformanceDispute.damages_basis == NAMEPLATE — the customer's reading: the contract promised required_throughput_cph at the meter"
        difference: "basis_cph is the observed rate unmodified, so every carton of measured shortfall is chargeable."
      - name: OBSERVED_AVAILABILITY
        when: "PerformanceDispute.damages_basis == OBSERVED_AVAILABILITY — the integrator's reading: the promise was capacity at the bottleneck's design availability"
        difference: "basis_cph is grossed up by the certificate's bottleneck_availability_pct before the shortfall percentage is taken, which shrinks (and often zeroes) the whole-percentage-point shortfall and therefore the damages tier."

  - name: sla_response_credit
    trigger: "POST /performance-disputes/{id}/joint-retest"
    algorithm: threshold
    formula: |
      response_sla_minutes = SLA_MINUTES_BY_TIER[Project.service_tier]
      elapsed_minutes = floor((retest_recorded_at - PerformanceDispute.created_at) / 60 seconds)
      sla_credit_cents = round_half_up(Project.contract_value_cents * SLA_BREACH_BPS / 10000)
                         if elapsed_minutes > response_sla_minutes else 0
    input_set: "The single PerformanceDispute and its Project; elapsed time is measured on the logical clock, never on wall-clock time."
    constants:
      SLA_MINUTES_BY_TIER_BASIC: 480
      SLA_MINUTES_BY_TIER_PREMIUM: 240
      SLA_MINUTES_BY_TIER_CRITICAL: 60
      SLA_BREACH_BPS: 25
    precision: "Whole cents, round_half_up. The comparison is strict (>), so an elapsed time exactly equal to response_sla_minutes yields no credit."
    variants: []

  - name: acceptance_retention
    trigger: "POST /acceptance-certificates, and refreshed by the PerformanceDispute resolution branches"
    algorithm: aggregation
    formula: |
      accepted_throughput_cph = measured_cph of the CommissioningRamp with project_id == this project,
                                verdict == PASS and step_pct == 100, ordered by created_at DESC, first row
      retention_amount_cents  = round_half_up(Project.contract_value_cents * RETENTION_BPS / 10000)
      dispute_deadline_utc    = created_at + DISPUTE_WINDOW_DAYS days
      retention_release_cents = 0                                     # at issuance
      # on dispute resolution:
      retention_release_cents = retention_amount_cents                            if UPHELD branch
      retention_release_cents = max(0, retention_amount_cents
                                       - final_damages_cents - sla_credit_cents)  if REVISED branch
    input_set: "CommissioningRamp rows with project_id == this project, verdict == PASS and step_pct == 100 (FAIL rows and lower steps excluded); the window is the whole project history, and the tie-break when several PASS 100% rows exist is greatest created_at."
    constants:
      RETENTION_BPS: 500
      DISPUTE_WINDOW_DAYS: 30
    precision: "Whole cents, round_half_up; retention_release_cents is floored at 0. dispute_deadline_utc is an exact 30-day offset on the logical clock, and the filing comparison is inclusive (<=)."
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "when the acting role is CustomerRep, X-User-ID equals Project.customer_rep_user_id of the project reached through the target resource"
    error_id: ERR_NOT_PROJECT_CUSTOMER
    http_status: 403
    applies_to: "POST /change-orders/{id}/review-decision, POST /performance-disputes"
  - priority: 4
    category: existence
    check: "every path-templated resource exists, validated left to right"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id (per-entity code: ERR_PROJECT_NOT_FOUND, ERR_SEGMENT_NOT_FOUND, ERR_FLOW_LINK_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_WINDOW_NOT_FOUND, ERR_CHANGE_ORDER_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_DISPUTE_NOT_FOUND)"
  - priority: 5
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, enums in range, integers within their declared constraints, occupancy_end_utc > occupancy_start_utc, end_utc > start_utc, protected_shift_end_minute > protected_shift_start_minute"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 6
    category: existence
    check: "every id referenced in the request body exists (project_id, from_segment_id, to_segment_id, staging_bay_id, site_zone_id, fabrication_lot_id, acceptance_certificate_id), and every element of segment_codes resolves to a ConveyorSegment of the same project (ERR_SEGMENT_NOT_FOUND)"
    error_id: ERR_ZONE_NOT_FOUND
    http_status: 404
    applies_to: "POST /segments, POST /flow-links, POST /fabrication-lots, POST /cutover-windows, POST /commissioning-ramps, POST /site-zones, POST /spare-part-lines, POST /performance-disputes, POST /acceptance-certificates"
  - priority: 7
    category: state
    check: "OCC: expected_project_version equals Project.version / expected_fabrication_lot_version equals FabricationLot.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /change-orders/{id}/review-decision, POST /projects/{id}/spares-provisioning, POST /fat-tests (ERR_STALE_LOT_VERSION)"
  - priority: 8
    category: state
    check: "the target resource and its gating relatives are in a state that admits this operation: ERR_PROJECT_NOT_IN_DESIGN (segment/link mutation outside delivery_status DESIGN), ERR_DESIGN_NOT_FROZEN (lot creation or start before freeze), ERR_SIMULATION_STALE_OR_MISSING (freeze without a current COMPLETE DEGRADED_AVAILABILITY run), ERR_LOT_INVALID_STATE, ERR_LOT_SCRAPPED, ERR_LOT_NOT_FAT_PASSED, ERR_ZONE_NOT_READY, ERR_WINDOW_INVALID_STATE, ERR_WINDOW_BLOCKED_STALE_DESIGN, ERR_WINDOW_NOT_DUE, ERR_CHANGE_ORDER_INVALID_STATE, ERR_CHANGE_ORDER_ROUND_LIMIT, ERR_PROJECT_NOT_COMMISSIONING, ERR_RAMP_SEQUENCE_VIOLATION, ERR_ACCEPTANCE_PREREQ_NOT_MET, ERR_OPEN_CHANGE_ORDER, ERR_CERTIFICATE_ALREADY_DISPUTED, ERR_DISPUTE_INVALID_STATE"
    error_id: ERR_LOT_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: business_safety
    check: "segregation of duties: the X-User-ID issuing an AcceptanceCertificate differs from recorded_by_user_id of the PASS step_pct == 100 CommissioningRamp"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /acceptance-certificates"
  - priority: 10
    category: business_safety
    check: "uniqueness of segment_code within a project"
    error_id: ERR_DUPLICATE_SEGMENT_CODE
    http_status: 409
    applies_to: "POST /segments"
  - priority: 11
    category: business_safety
    check: "continuing-operations protection: [start_utc, end_utc) must not intersect any daily occurrence of the zone's protected shift [protected_shift_start_minute, protected_shift_end_minute) in UTC minutes-of-day"
    error_id: ERR_PROTECTED_SHIFT_COLLISION
    http_status: 422
    applies_to: "POST /cutover-windows"
  - priority: 12
    category: business_temporal
    check: "resource occupancy overlap: (a) on a SiteZone, reject when new.start_utc < existing.end_utc + buffer_minutes AND existing.start_utc < new.end_utc + buffer_minutes over windows with status IN {SCHEDULED, BLOCKED_STALE_DESIGN, IN_PROGRESS} (ERR_ZONE_WINDOW_OVERLAP); (b) on a StagingBay, reject when any instant is covered by more than concurrent_capacity closed occupancy intervals [occupancy_start_utc, occupancy_end_utc] of lots with status NOT IN {SCRAPPED, INSTALLED} (ERR_STAGING_BAY_CAPACITY_EXCEEDED)"
    error_id: ERR_ZONE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /cutover-windows, POST /fabrication-lots (ERR_STAGING_BAY_CAPACITY_EXCEEDED)"
  - priority: 13
    category: business_referential
    check: "cross-aggregate coherence: CutoverWindow.site_zone_id and CutoverWindow.fabrication_lot_id must both belong to CutoverWindow.project_id; FlowLink.from_segment_id and FlowLink.to_segment_id must both belong to FlowLink.project_id; PerformanceDispute must target a certificate of the acting customer's project"
    error_id: ERR_CROSS_PROJECT_REFERENCE
    http_status: 422
    applies_to: "POST /cutover-windows, POST /flow-links, POST /performance-disputes"
  - priority: 14
    category: business_constraint
    check: "graph and share integrity: a new FlowLink must not create a cycle (ERR_FLOW_CYCLE); source shares must total 10000 (ERR_SOURCE_SHARE_INVALID); each segment's outbound split shares must total 10000 (ERR_SPLIT_SHARE_INVALID); zone shares must total 10000 before the first window starts (ERR_ZONE_SHARE_INCOMPLETE); simulation shortfall blocks the freeze (ERR_THROUGHPUT_SHORTFALL)"
    error_id: ERR_FLOW_CYCLE
    http_status: 422
    applies_to: "POST /flow-links, POST /projects/{id}/simulations, POST /projects/{id}/design-freeze, POST /cutover-windows/{id}/start"
  - priority: 15
    category: business_fiscal
    check: "money gates, evaluated last: recomputed contract_value_cents must not exceed authorized_ceiling_cents (ERR_CONTRACT_CEILING_EXCEEDED); a provisioning run needs at least one DRAFT line with criticality IN {CRITICAL, MAJOR} (ERR_NO_FUNDABLE_SPARE_LINES)"
    error_id: ERR_CONTRACT_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /change-orders/{id}/review-decision, POST /projects/{id}/spares-provisioning"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- projects ---------------------------------------------------------
  - method: POST
    path: "/projects"
    description: "Open an integration project from the customer's throughput requirement; seeds the contract ledger and the spares pool."
    roles: [ProjectDirector]
    code: 201
    input: [customer_name, facility_code, customer_rep_user_id, required_throughput_cph, contract_base_cents, authorized_ceiling_cents, spares_budget_cents, service_tier]
    output: Project
    side_effects:
      - "run calculations.contract_value_recompute with no approved change orders (escalation_fee_cents, contract_value_cents)"
      - "set response_sla_minutes from service_tier, design_version 1, delivery_status DESIGN, commercial_status CLEAN"
      - "set legacy_share_bps 10000, in_transition_share_bps 0, cutover_share_bps 0, spares_unallocated_cents = spares_budget_cents"
  - method: GET
    path: "/projects/{id}"
    description: "Read a project including both status dimensions, the contract ledger, the share ledger and the spares ledger."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/projects/{id}/design-freeze"
    description: "Freeze the concept design once a current availability-degraded simulation clears the required throughput."
    roles: [ProjectDirector]
    code: 200
    input: []
    output: Project
    side_effects:
      - "Project.delivery_status DESIGN -> DESIGN_FROZEN"
      - "set design_frozen_at from the logical clock"
      - "increments Project.version by 1"
  - method: POST
    path: "/projects/{id}/simulations"
    description: "Run a flow-and-bottleneck simulation with the requested method; supersedes the prior COMPLETE run of the same method and releases design-blocked cutover windows when the run is compliant."
    roles: [DesignEngineer]
    code: 201
    input: [method]
    output: SimulationRun
    side_effects:
      - "run calculations.line_throughput_simulation; refresh every ConveyorSegment.flow_share_bps and derated_capacity_cph"
      - "prior COMPLETE SimulationRun of the same method -> SUPERSEDED"
      - "if method == DEGRADED_AVAILABILITY and design_version_at_run == Project.design_version and effective_throughput_cph >= required_throughput_cph: CutoverWindow BLOCKED_STALE_DESIGN -> SCHEDULED, then each referenced FabricationLot HOLD -> STAGED"
  - method: GET
    path: "/projects/{id}/simulation-runs"
    description: "List simulation runs of a project, newest first by created_at DESC."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["method?", "status?", "limit?", "offset?"]
    output: SimulationRun[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/spares-provisioning"
    description: "Release prior allocations and re-run the spares waterfall across the project's fundable part lines."
    roles: [ProjectDirector]
    code: 200
    input: [expected_project_version]
    output: Project
    side_effects:
      - "reset every ALLOCATED/PARTIAL/UNFUNDED SparePartLine of the project to DRAFT with allocated_cents 0"
      - "run calculations.spares_budget_waterfall; write allocated_cents and status per line"
      - "refresh Project.spares_allocated_cents and spares_unallocated_cents"
      - "increments Project.version by 1"
  - method: GET
    path: "/projects/{id}/spare-part-lines"
    description: "List the project's spare part lines with their funding outcome."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["criticality?", "status?", "limit?", "offset?"]
    output: SparePartLine[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/segments"
    description: "List the project's conveyor segments with their simulated flow share and derated capacity."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["equipment_class?", "limit?", "offset?"]
    output: ConveyorSegment[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/site-zones"
    description: "List the project's facility zones with their cutover posture."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: SiteZone[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/commissioning-ramps"
    description: "List the project's commissioning ramp steps with their computed targets and verdicts."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["step_pct?", "limit?", "offset?"]
    output: CommissioningRamp[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/change-orders"
    description: "List the project's change orders with their negotiation round and status."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/acceptance-certificates"
    description: "List the project's acceptance certificates."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: AcceptanceCertificate[]
    side_effects: []

  # --- design surface ---------------------------------------------------
  - method: POST
    path: "/segments"
    description: "Add a conveyor segment (equipment selection with capacity rating) to a project still in design."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, segment_code, equipment_class, rated_capacity_cph, availability_pct, "source_share_bps?"]
    output: ConveyorSegment
    side_effects:
      - "increment Project.design_version by 1 and Project.version by 1"
      - "every COMPLETE SimulationRun of the project -> STALE"
  - method: PATCH
    path: "/segments/{id}"
    description: "Revise a segment's capacity rating, availability or source share while the project is in design."
    roles: [DesignEngineer]
    code: 200
    input: ["rated_capacity_cph?", "availability_pct?", "source_share_bps?"]
    output: ConveyorSegment
    side_effects:
      - "increment Project.design_version by 1 and Project.version by 1"
      - "every COMPLETE SimulationRun of the project -> STALE"
      - "increments ConveyorSegment.version by 1"
  - method: GET
    path: "/segments/{id}"
    description: "Read one conveyor segment."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: []
    output: ConveyorSegment
    side_effects: []
  - method: POST
    path: "/flow-links"
    description: "Connect two segments with a routed share of flow; rejects any edge that would close a cycle."
    roles: [DesignEngineer]
    code: 201
    input: [project_id, from_segment_id, to_segment_id, split_share_bps]
    output: FlowLink
    side_effects:
      - "increment from_segment.outbound_link_count and to_segment.inbound_link_count by 1"
      - "increment Project.design_version by 1 and Project.version by 1"
      - "every COMPLETE SimulationRun of the project -> STALE"
  - method: GET
    path: "/flow-links/{id}"
    description: "Read one flow link."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: []
    output: FlowLink
    side_effects: []
  - method: GET
    path: "/flow-links"
    description: "List flow links filtered by project or by either endpoint segment."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["project_id?", "from_segment_id?", "to_segment_id?", "limit?", "offset?"]
    output: FlowLink[]
    side_effects: []

  # --- shop surface -----------------------------------------------------
  - method: POST
    path: "/staging-bays"
    description: "Register a pre-assembly bay with its concurrent occupancy capacity."
    roles: [ShopSupervisor]
    code: 201
    input: [bay_code, concurrent_capacity]
    output: StagingBay
    side_effects: []
  - method: POST
    path: "/fabrication-lots"
    description: "Plan a pre-assembly lot in a staging bay for a frozen design; enforces closed-interval bay capacity."
    roles: [ShopSupervisor]
    code: 201
    input: [project_id, lot_code, staging_bay_id, segment_codes, occupancy_start_utc, occupancy_end_utc]
    output: FabricationLot
    side_effects:
      - "snapshot fat_target_cph = ceil(Project.required_throughput_cph * 105 / 100)"
      - "if Project.delivery_status == REBASELINE_REQUIRED it returns to IN_FABRICATION"
      - "increments Project.version by 1"
  - method: GET
    path: "/fabrication-lots/{id}"
    description: "Read one fabrication lot including its FAT target, attempt count and version."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: []
    output: FabricationLot
    side_effects: []
  - method: GET
    path: "/fabrication-lots"
    description: "List fabrication lots filtered by project, staging bay or status."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["project_id?", "staging_bay_id?", "status?", "limit?", "offset?"]
    output: FabricationLot[]
    side_effects: []
  - method: POST
    path: "/fabrication-lots/{id}/start-fabrication"
    description: "Release the lot to the shop floor, either the first time or as rework after a failed FAT."
    roles: [ShopSupervisor]
    code: 200
    input: []
    output: FabricationLot
    side_effects:
      - "FabricationLot PLANNED|FAT_FAILED -> FABRICATING"
      - "Project.delivery_status DESIGN_FROZEN -> IN_FABRICATION on the first lot"
      - "increments FabricationLot.version by 1"
  - method: POST
    path: "/fabrication-lots/{id}/stage"
    description: "Move a fabricated lot into staging, ready for factory acceptance testing."
    roles: [ShopSupervisor]
    code: 200
    input: []
    output: FabricationLot
    side_effects:
      - "FabricationLot FABRICATING -> STAGED"
      - "increments FabricationLot.version by 1"
  - method: POST
    path: "/fat-tests"
    description: "Record a factory acceptance test against a staged lot; the third failure scraps the lot and unwinds its cutover."
    roles: [ShopSupervisor]
    code: 201
    input: [fabrication_lot_id, expected_fabrication_lot_version, measured_cph, defect_count]
    output: FatTest
    side_effects:
      - "run calculations.fat_result_evaluation; persist result and attempt_no"
      - "FabricationLot STAGED -> FAT_PASSED | FAT_FAILED | SCRAPPED"
      - "on SCRAPPED: SCHEDULED CutoverWindow rows of this lot -> CANCELLED_LOT_SCRAPPED, then Project.delivery_status IN_FABRICATION -> REBASELINE_REQUIRED"
      - "increments FabricationLot.version by 1"
  - method: GET
    path: "/fabrication-lots/{id}/fat-tests"
    description: "List the append-only factory acceptance test history of a lot, oldest first by created_at ASC."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: FatTest[]
    side_effects: []

  # --- site surface -----------------------------------------------------
  - method: POST
    path: "/site-zones"
    description: "Declare a facility zone with its throughput share, protected operating shift and inter-window buffer."
    roles: [SiteManager]
    code: 201
    input: [project_id, zone_code, throughput_share_bps, protected_shift_start_minute, protected_shift_end_minute, buffer_minutes]
    output: SiteZone
    side_effects: ["increments Project.version by 1"]
  - method: POST
    path: "/cutover-windows"
    description: "Schedule a phased cutover window binding a lot to a zone outside the customer's protected shift and clear of other windows' buffers."
    roles: [SiteManager]
    code: 201
    input: [project_id, site_zone_id, fabrication_lot_id, start_utc, end_utc]
    output: CutoverWindow
    side_effects: ["increments Project.version by 1"]
  - method: GET
    path: "/cutover-windows/{id}"
    description: "Read one cutover window."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: []
    output: CutoverWindow
    side_effects: []
  - method: GET
    path: "/cutover-windows"
    description: "List cutover windows filtered by project, zone, lot or status."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["project_id?", "site_zone_id?", "fabrication_lot_id?", "status?", "limit?", "offset?"]
    output: CutoverWindow[]
    side_effects: []
  - method: POST
    path: "/cutover-windows/{id}/start"
    description: "Take the zone off the legacy system and begin installation; moves its throughput share into transition."
    roles: [SiteManager]
    code: 200
    input: []
    output: CutoverWindow
    side_effects:
      - "CutoverWindow SCHEDULED -> IN_PROGRESS, SiteZone LIVE_LEGACY -> CUTOVER_IN_PROGRESS"
      - "Project share ledger: legacy_share_bps -> in_transition_share_bps by the zone's share"
      - "Project.delivery_status IN_FABRICATION -> CUTOVER"
      - "increments CutoverWindow.version by 1"
  - method: POST
    path: "/cutover-windows/{id}/complete"
    description: "Hand the zone over to the new system, install the lot and bubble the project up to commissioning when every zone is live."
    roles: [SiteManager]
    code: 200
    input: []
    output: CutoverWindow
    side_effects:
      - "CutoverWindow IN_PROGRESS -> COMPLETED, SiteZone -> CUTOVER_COMPLETE, FabricationLot FAT_PASSED -> INSTALLED"
      - "Project share ledger: in_transition_share_bps -> cutover_share_bps"
      - "Project.delivery_status CUTOVER -> COMMISSIONING when every zone is CUTOVER_COMPLETE"
      - "increments CutoverWindow.version by 1"
  - method: POST
    path: "/cutover-windows/{id}/abort"
    description: "Roll the zone back to the legacy system mid-installation; the compensating action for start."
    roles: [SiteManager]
    code: 200
    input: [abort_reason]
    output: CutoverWindow
    side_effects:
      - "CutoverWindow IN_PROGRESS -> ABORTED, SiteZone -> LIVE_LEGACY"
      - "Project share ledger: in_transition_share_bps -> legacy_share_bps, restoring the 10000 bps split exactly"
      - "increments CutoverWindow.version by 1"
  - method: POST
    path: "/commissioning-ramps"
    description: "Record a throughput ramp step during commissioning; the step verdict is computed, not supplied."
    roles: [SiteManager]
    code: 201
    input: [project_id, step_pct, measured_cph, sustained_minutes]
    output: CommissioningRamp
    side_effects:
      - "run calculations.ramp_step_evaluation; persist target_cph, min_sustained_minutes, verdict, recorded_by_user_id"
      - "refresh Project.acceptance_ready"
      - "increments Project.version by 1"

  # --- commercial surface -----------------------------------------------
  - method: POST
    path: "/change-orders"
    description: "Draft a change order capturing customer scope evolution with its price and schedule impact."
    roles: [ProjectDirector]
    code: 201
    input: [project_id, title, scope_delta_cph, price_delta_cents, schedule_delta_days]
    output: ChangeOrder
    side_effects: ["increments Project.version by 1"]
  - method: POST
    path: "/change-orders/{id}/submit"
    description: "Send a drafted or revision-requested change order to the customer for decision."
    roles: [ProjectDirector]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "ChangeOrder DRAFT|REVISION_REQUESTED -> SUBMITTED"
      - "Project.commercial_status CLEAN -> CHANGE_PENDING"
      - "increments ChangeOrder.version by 1 and Project.version by 1"
  - method: POST
    path: "/change-orders/{id}/review-decision"
    description: "Record the customer's decision; approval reprices the contract and, for scope-bearing orders, reopens the design and unwinds staged work."
    roles: [CustomerRep]
    code: 200
    input: [decision, expected_project_version, "decision_comment?"]
    output: ChangeOrder
    side_effects:
      - "ChangeOrder SUBMITTED -> APPROVED | REJECTED | REVISION_REQUESTED"
      - "on APPROVE: run calculations.contract_value_recompute"
      - "on APPROVE with scope_delta_cph != 0: Project.design_version +1 and delivery_status -> DESIGN; COMPLETE SimulationRun -> STALE; SCHEDULED CutoverWindow -> BLOCKED_STALE_DESIGN; referenced STAGED|FAT_PASSED FabricationLot -> HOLD"
      - "Project.commercial_status CHANGE_PENDING -> CLEAN when no open change order remains"
      - "increments Project.version by 1"
  - method: GET
    path: "/change-orders/{id}"
    description: "Read one change order including its negotiation round."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: POST
    path: "/spare-part-lines"
    description: "Add a recommended spare part line to the project's provisioning list."
    roles: [ProjectDirector]
    code: 201
    input: [project_id, part_no, criticality, unit_cost_cents, min_stock_qty, lead_time_days]
    output: SparePartLine
    side_effects:
      - "compute requested_cents and weighted_target_cents; status DRAFT with allocated_cents 0"
      - "increments Project.version by 1"
  - method: POST
    path: "/acceptance-certificates"
    description: "Issue the acceptance certificate once every ramp step passed and every zone is live; blocked when the issuer recorded the final ramp step."
    roles: [ProjectDirector]
    code: 201
    input: [project_id]
    output: AcceptanceCertificate
    side_effects:
      - "run calculations.acceptance_retention (accepted_throughput_cph, retention_amount_cents, dispute_deadline_utc)"
      - "snapshot bottleneck_availability_pct from the COMPLETE DEGRADED_AVAILABILITY SimulationRun"
      - "Project.delivery_status COMMISSIONING -> ACCEPTED"
      - "increments Project.version by 1"
  - method: GET
    path: "/acceptance-certificates/{id}"
    description: "Read one acceptance certificate including the retention ledger."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: []
    output: AcceptanceCertificate
    side_effects: []
  - method: POST
    path: "/performance-disputes"
    description: "File a post-acceptance performance dispute; both damages variants are computed and the declared basis binds the settlement."
    roles: [CustomerRep]
    code: 201
    input: [acceptance_certificate_id, claimed_cph, damages_basis]
    output: PerformanceDispute
    side_effects:
      - "run calculations.liquidated_damages twice (provisional_nameplate_cents, provisional_observed_cents) and select bound_provisional_cents"
      - "AcceptanceCertificate ISSUED -> DISPUTED, Project.commercial_status CLEAN -> DISPUTED"
      - "increments AcceptanceCertificate.version by 1"
  - method: POST
    path: "/performance-disputes/{id}/joint-retest"
    description: "Record the joint retest that settles the dispute; nets liquidated damages and any SLA response credit against retention."
    roles: [SiteManager]
    code: 200
    input: [retest_measured_cph]
    output: PerformanceDispute
    side_effects:
      - "run calculations.liquidated_damages on the bound variant and calculations.sla_response_credit"
      - "PerformanceDispute OPEN -> RESOLVED_UPHELD | RESOLVED_CREDITED"
      - "AcceptanceCertificate DISPUTED -> UPHELD | REVISED with retention_release_cents refreshed"
      - "Project.commercial_status DISPUTED -> SETTLED"
      - "increments PerformanceDispute.version by 1"
  - method: GET
    path: "/acceptance-certificates/{id}/disputes"
    description: "List the performance disputes filed against a certificate."
    roles: [ProjectDirector, DesignEngineer, ShopSupervisor, SiteManager, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: PerformanceDispute[]
    side_effects: []

  # --- test-driving surface --------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window and SLA rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z and it never falls back to real wall-clock time."
    roles: [ProjectDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock advances or rewinds to the supplied instant; no entity is mutated"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_PROJECT_CUSTOMER
    http: 403
    condition: "CustomerRep X-User-ID differs from Project.customer_rep_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "certificate issuer X-User-ID equals recorded_by_user_id of the PASS 100% commissioning ramp step"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, enum out of range, integer outside its declared constraint, or an inverted interval"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "project id in path or body does not exist"
  - id: ERR_SEGMENT_NOT_FOUND
    http: 404
    condition: "segment id in path or body, or a segment_codes element, does not resolve within the project"
  - id: ERR_FLOW_LINK_NOT_FOUND
    http: 404
    condition: "flow link id in path does not exist"
  - id: ERR_STAGING_BAY_NOT_FOUND
    http: 404
    condition: "staging_bay_id does not exist"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "fabrication lot id in path or body does not exist"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "site_zone_id does not exist"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "cutover window id in path does not exist"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "change order id in path does not exist"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "acceptance certificate id in path or body does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "performance dispute id in path does not exist"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal Project.version"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_fabrication_lot_version does not equal FabricationLot.version"
  - id: ERR_PROJECT_NOT_IN_DESIGN
    http: 409
    condition: "segment or flow-link mutation attempted while Project.delivery_status != DESIGN"
  - id: ERR_DUPLICATE_SEGMENT_CODE
    http: 409
    condition: "segment_code already used on the same project"
  - id: ERR_SIMULATION_STALE_OR_MISSING
    http: 409
    condition: "no SimulationRun with method DEGRADED_AVAILABILITY, status COMPLETE and design_version_at_run == Project.design_version exists"
  - id: ERR_THROUGHPUT_SHORTFALL
    http: 422
    condition: "the gating simulation's effective_throughput_cph is below Project.required_throughput_cph"
  - id: ERR_DESIGN_NOT_FROZEN
    http: 409
    condition: "fabrication lot creation or release attempted while Project.delivery_status is DESIGN or REBASELINE_REQUIRED without a frozen design"
  - id: ERR_LOT_INVALID_STATE
    http: 409
    condition: "lot transition attempted from a state that does not admit it (e.g. stage from PLANNED, FAT test from HOLD)"
  - id: ERR_LOT_SCRAPPED
    http: 409
    condition: "any lot operation attempted after the lot reached SCRAPPED"
  - id: ERR_LOT_NOT_FAT_PASSED
    http: 409
    condition: "cutover window start attempted while the referenced lot is not FAT_PASSED"
  - id: ERR_ZONE_NOT_READY
    http: 409
    condition: "cutover window start attempted while the zone's ops_status is not LIVE_LEGACY"
  - id: ERR_WINDOW_INVALID_STATE
    http: 409
    condition: "window transition attempted from a state that does not admit it (start from IN_PROGRESS, complete or abort from SCHEDULED, anything from a terminal state)"
  - id: ERR_WINDOW_BLOCKED_STALE_DESIGN
    http: 409
    condition: "cutover window start attempted while the window is BLOCKED_STALE_DESIGN"
  - id: ERR_WINDOW_NOT_DUE
    http: 409
    condition: "cutover window start attempted while the logical clock is outside [start_utc, end_utc)"
  - id: ERR_PROTECTED_SHIFT_COLLISION
    http: 422
    condition: "the requested window intersects a daily occurrence of the zone's protected operating shift"
  - id: ERR_ZONE_WINDOW_OVERLAP
    http: 409
    condition: "the requested window collides with another live window on the same zone once both are padded by buffer_minutes"
  - id: ERR_STAGING_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested closed occupancy interval would push some instant above the bay's concurrent_capacity"
  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 422
    condition: "a referenced zone, lot, segment or certificate belongs to a different project than the one named in the request"
  - id: ERR_FLOW_CYCLE
    http: 422
    condition: "the requested flow link would close a cycle in the project's DAG"
  - id: ERR_SPLIT_SHARE_INVALID
    http: 422
    condition: "a segment's outbound split_share_bps values do not total exactly 10000 at simulation time"
  - id: ERR_SOURCE_SHARE_INVALID
    http: 422
    condition: "source segments' source_share_bps values do not total exactly 10000 at simulation time, or a source segment has no share while a non-source segment has one"
  - id: ERR_ZONE_SHARE_INCOMPLETE
    http: 422
    condition: "cutover window start attempted while the project's SiteZone throughput_share_bps values do not total 10000"
  - id: ERR_CHANGE_ORDER_INVALID_STATE
    http: 409
    condition: "submit attempted on a non-DRAFT/non-REVISION_REQUESTED order, or a decision recorded on a non-SUBMITTED order"
  - id: ERR_CHANGE_ORDER_ROUND_LIMIT
    http: 409
    condition: "REQUEST_REVISION would push round_no above CHANGE_ORDER_MAX_ROUNDS (3)"
  - id: ERR_CONTRACT_CEILING_EXCEEDED
    http: 422
    condition: "the recomputed contract_value_cents would exceed Project.authorized_ceiling_cents"
  - id: ERR_PROJECT_NOT_COMMISSIONING
    http: 409
    condition: "a commissioning ramp step was recorded while Project.delivery_status != COMMISSIONING"
  - id: ERR_RAMP_SEQUENCE_VIOLATION
    http: 409
    condition: "a ramp step was recorded before every lower step reached verdict PASS"
  - id: ERR_ACCEPTANCE_PREREQ_NOT_MET
    http: 409
    condition: "certificate issuance attempted while Project.acceptance_ready is false"
  - id: ERR_OPEN_CHANGE_ORDER
    http: 409
    condition: "certificate issuance attempted while a change order of the project is SUBMITTED or REVISION_REQUESTED"
  - id: ERR_CERTIFICATE_ALREADY_DISPUTED
    http: 409
    condition: "a dispute was filed against a certificate whose status is not ISSUED"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "a dispute was filed after the certificate's dispute_deadline_utc"
  - id: ERR_DISPUTE_INVALID_STATE
    http: 409
    condition: "a joint retest was recorded against a dispute that is no longer OPEN"
  - id: ERR_NO_FUNDABLE_SPARE_LINES
    http: 422
    condition: "a provisioning run found no DRAFT spare part line with criticality CRITICAL or MAJOR"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProjectDirector
    description: "Integrator-side commercial owner: opens projects, freezes design, drafts and submits change orders, provisions spares, issues acceptance certificates, drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /projects"
      - "POST /projects/{id}/design-freeze"
      - "POST /projects/{id}/spares-provisioning"
      - "POST /spare-part-lines"
      - "POST /change-orders"
      - "POST /change-orders/{id}/submit"
      - "POST /acceptance-certificates"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
    note: "Segregation of duties: the X-User-ID issuing a certificate MUST differ from the X-User-ID that recorded the passing 100% ramp step, even though the two operations belong to different roles."
  - name: DesignEngineer
    description: "Owns concept design: equipment selection, flow topology and bottleneck simulation."
    identity: opaque
    exclusive_operations:
      - "POST /segments"
      - "PATCH /segments/{id}"
      - "POST /flow-links"
      - "POST /projects/{id}/simulations"
    shared_operations: ["all GET endpoints"]
  - name: ShopSupervisor
    description: "Owns fabrication and staging: bays, lots, lot progression and factory acceptance tests."
    identity: opaque
    exclusive_operations:
      - "POST /staging-bays"
      - "POST /fabrication-lots"
      - "POST /fabrication-lots/{id}/start-fabrication"
      - "POST /fabrication-lots/{id}/stage"
      - "POST /fat-tests"
    shared_operations: ["all GET endpoints"]
  - name: SiteManager
    description: "Owns site installation and commissioning: zones, cutover windows, ramp steps and the joint retest of a dispute."
    identity: opaque
    exclusive_operations:
      - "POST /site-zones"
      - "POST /cutover-windows"
      - "POST /cutover-windows/{id}/start"
      - "POST /cutover-windows/{id}/complete"
      - "POST /cutover-windows/{id}/abort"
      - "POST /commissioning-ramps"
      - "POST /performance-disputes/{id}/joint-retest"
    shared_operations: ["all GET endpoints"]
  - name: CustomerRep
    description: "Customer-side representative: records change-order decisions and files post-acceptance performance disputes. Bound to a single project by Project.customer_rep_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /change-orders/{id}/review-decision"
      - "POST /performance-disputes"
    shared_operations: ["all GET endpoints"]
