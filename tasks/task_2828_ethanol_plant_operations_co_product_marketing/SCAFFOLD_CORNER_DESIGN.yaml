              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${hidx} == 100.0 and ${eff} == 2.850 (no starch bonus at 54.0, no health penalty, no interventions)"
            - "${gal} == 2679.00, ${ddgs} == 7.990, ${oil} == 564.00"
            - "${rb_status} == GENERATED, ${rb_count} == 2732 (floor of 2679.00 * 1.02 = 2732.58) and rin_year == 2026"
            - "${err_id} == ERR_INVALID_RIN_STATE with HTTP 409, not ERR_SHIPMENT_NOT_INVOICED"
            - "RinBatch.${rb_id}.retired_at == null and Plant.${plant_id}.rin_retired_count == 0 while rin_generated_count == 2732"

      - name: submission_with_an_uncertified_predecessor_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PREDECESSOR_NOT_CERTIFIED]
          - validations[priority=43]
        distinguishing_aspect: |
          The predecessor check runs at submit, not at registration: CP-2 is
          created successfully while CP-1 is still DRAFT, and only the submit
          call returns ERR_PREDECESSOR_NOT_CERTIFIED 422.
        test_recipe:
          setup:
            - "Plant exists; carbon project CP-1 is DRAFT and CP-2 names CP-1 as its predecessor."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000 }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/carbon-projects"
              payload: { project_code: "CP-1", project_name: "Combined heat and power retrofit", project_type: "CHP", claimed_reduction_g_per_mj: 8.000, certification_tier: "FULL" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { cp1_id: $.data.id }
            - call: "POST /ethanol-ops/carbon-projects"
              payload: { project_code: "CP-2", project_name: "Corn oil extraction upgrade", project_type: "PROCESS_EFFICIENCY", claimed_reduction_g_per_mj: 2.500, certification_tier: "FULL", predecessor_project_id: "${cp1_id}" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { cp2_id: $.data.id, pred: $.data.predecessor_project_id, vs2: $.data.verification_status }
          trigger:
            - call: "POST /ethanol-ops/carbon-projects/${cp2_id}/submit"
              payload: { verification_body: "Prairie Verification Services" }
              as: ComplianceOfficer
              as_user_id: "co-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${pred} == ${cp1_id} and ${vs2} == DRAFT — registration accepted the uncertified predecessor"
            - "${err_id} == ERR_PREDECESSOR_NOT_CERTIFIED with HTTP 422"
            - "CarbonProject.${cp2_id}.verification_status stays DRAFT with verification_body null and submitted_at null"
            - "GET /ethanol-ops/carbon-projects?predecessor_project_id=${cp1_id} returns exactly the CP-2 row"

      - name: crush_margin_read_before_any_marks_are_posted_rejected
        claim_type: error_triggerable
