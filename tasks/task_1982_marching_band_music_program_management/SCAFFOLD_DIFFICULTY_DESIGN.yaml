# =============================================================================
# §1.8 Scaffold Difficulty Design — Task 1982 marching band program
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rental_fee_flat_vs_prorated_divergence
        grounds:
          - calculations.rental_fee_accrual
          - entities.InstrumentAssignment.fields.accrued_fee_cents
          - entities.InstrumentAssignment.fields.fee_variant
        distinguishing_aspect: |
          Entity domain: InstrumentAssignment (fiscal accrual). The SAME 14-day
          checkout→due window yields accrued_fee_cents 4000 under PRORATED and
          15000 under FLAT — two valid variants, different results.
        test_recipe:
          setup:
            - "Program P-PRO (rental_fee_mode PRORATED) with enrolled student SA and available instrument IA; Program P-FLAT (rental_fee_mode FLAT) with enrolled student SB and available instrument IB; logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "Fall PRO", rental_fee_mode: "PRORATED", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog_pro: $.data.id } }
            - { call: "POST /band/programs/${prog_pro}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog_pro}", full_name: "Ann Pro", grade: 10, section: "BRASS" }, as: BandDirector, captures: { stu_a: $.data.id } }
            - { call: "POST /band/students/${stu_a}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog_pro}", serial_number: "SN-PRO-1", instrument_type: "TRUMPET", replacement_value_cents: 80000 }, as: EquipmentManager, captures: { inst_a: $.data.id } }
            - { call: "POST /band/programs", payload: { season_name: "Fall FLAT", rental_fee_mode: "FLAT", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog_flat: $.data.id } }
            - { call: "POST /band/programs/${prog_flat}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog_flat}", full_name: "Bob Flat", grade: 11, section: "BRASS" }, as: BandDirector, captures: { stu_b: $.data.id } }
            - { call: "POST /band/students/${stu_b}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog_flat}", serial_number: "SN-FLAT-1", instrument_type: "TRUMPET", replacement_value_cents: 80000 }, as: EquipmentManager, captures: { inst_b: $.data.id } }
          trigger:
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu_a}", instrument_id: "${inst_a}", due_date: "2026-08-15T00:00:00Z" }, as: EquipmentManager, captures: { asg_a: $.data.id, fee_a: $.data.accrued_fee_cents } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu_b}", instrument_id: "${inst_b}", due_date: "2026-08-15T00:00:00Z" }, as: EquipmentManager, captures: { asg_b: $.data.id, fee_b: $.data.accrued_fee_cents } }
          assert:
            - "InstrumentAssignment.${asg_a}.accrued_fee_cents == 4000 (ceil(14/7)=2 weeks * 2000)"
            - "InstrumentAssignment.${asg_a}.fee_variant == PRORATED"
            - "InstrumentAssignment.${asg_b}.accrued_fee_cents == 15000"
            - "InstrumentAssignment.${asg_b}.fee_variant == FLAT"
            - "fee_a != fee_b for identical windows"
      - name: audition_raw_vs_rank_normalized_divergence
        grounds:
          - calculations.audition_composite_score
          - entities.AuditionEntry.fields.composite_score
          - entities.AuditionEntry.fields.rank
        distinguishing_aspect: |
          Entity domain: Audition (weighted scoring) — different domain from
          InstrumentAssignment above. Identical judge inputs yield RAW_WEIGHTED
          composites 80.0 vs 85.0 (entry2 wins) but RANK_NORMALIZED borda 1 vs 1
          (tie → entry1 wins by created_at), so the two variants place different
          performers in chair 1.
        test_recipe:
          setup:
            - "Program P-RAW (scoring_mode RAW_WEIGHTED) and program P-RNK (scoring_mode RANK_NORMALIZED); each with BRASS audition (chair_capacity 1), enrolled students S1/S2, entries E1 (created first) / E2, judge scores E1: J1(100,100,100), J2(60,60,60); E2: J1(80,80,80), J2(90,90,90); scores finalized"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "RAW", scoring_mode: "RAW_WEIGHTED", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog_raw: $.data.id } }
            - { call: "POST /band/programs/${prog_raw}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog_raw}", full_name: "R1", grade: 10, section: "BRASS" }, as: BandDirector, captures: { s1_raw: $.data.id } }
            - { call: "POST /band/students/${s1_raw}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog_raw}", full_name: "R2", grade: 11, section: "BRASS" }, as: BandDirector, captures: { s2_raw: $.data.id } }
            - { call: "POST /band/students/${s2_raw}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/auditions", payload: { program_id: "${prog_raw}", section: "BRASS", chair_capacity: 1 }, as: BandDirector, captures: { aud_raw: $.data.id } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud_raw}", student_id: "${s1_raw}" }, as: BandDirector, captures: { e1_raw: $.data.id } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud_raw}", student_id: "${s2_raw}" }, as: BandDirector, captures: { e2_raw: $.data.id } }
            - { call: "POST /band/audition-entries/${e1_raw}/scores", payload: { judge_id: "J1", musicianship: 100, marching: 100, leadership: 100 }, as: BandDirector }
            - { call: "POST /band/audition-entries/${e1_raw}/scores", payload: { judge_id: "J2", musicianship: 60, marching: 60, leadership: 60 }, as: BandDirector }
            - { call: "POST /band/audition-entries/${e2_raw}/scores", payload: { judge_id: "J1", musicianship: 80, marching: 80, leadership: 80 }, as: BandDirector }
            - { call: "POST /band/audition-entries/${e2_raw}/scores", payload: { judge_id: "J2", musicianship: 90, marching: 90, leadership: 90 }, as: BandDirector }
            - { call: "POST /band/auditions/${aud_raw}/finalize-scores", payload: {}, as: BandDirector, captures: { aud_raw_v: $.data.version } }
            - { call: "POST /band/programs", payload: { season_name: "RNK", scoring_mode: "RANK_NORMALIZED", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog_rnk: $.data.id } }
            - { call: "POST /band/programs/${prog_rnk}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog_rnk}", full_name: "K1", grade: 10, section: "BRASS" }, as: BandDirector, captures: { s1_rnk: $.data.id } }
            - { call: "POST /band/students/${s1_rnk}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog_rnk}", full_name: "K2", grade: 11, section: "BRASS" }, as: BandDirector, captures: { s2_rnk: $.data.id } }
            - { call: "POST /band/students/${s2_rnk}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/auditions", payload: { program_id: "${prog_rnk}", section: "BRASS", chair_capacity: 1 }, as: BandDirector, captures: { aud_rnk: $.data.id } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud_rnk}", student_id: "${s1_rnk}" }, as: BandDirector, captures: { e1_rnk: $.data.id } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud_rnk}", student_id: "${s2_rnk}" }, as: BandDirector, captures: { e2_rnk: $.data.id } }
            - { call: "POST /band/audition-entries/${e1_rnk}/scores", payload: { judge_id: "J1", musicianship: 100, marching: 100, leadership: 100 }, as: BandDirector }
            - { call: "POST /band/audition-entries/${e1_rnk}/scores", payload: { judge_id: "J2", musicianship: 60, marching: 60, leadership: 60 }, as: BandDirector }
            - { call: "POST /band/audition-entries/${e2_rnk}/scores", payload: { judge_id: "J1", musicianship: 80, marching: 80, leadership: 80 }, as: BandDirector }
            - { call: "POST /band/audition-entries/${e2_rnk}/scores", payload: { judge_id: "J2", musicianship: 90, marching: 90, leadership: 90 }, as: BandDirector }
            - { call: "POST /band/auditions/${aud_rnk}/finalize-scores", payload: {}, as: BandDirector, captures: { aud_rnk_v: $.data.version } }
          trigger:
            - { call: "POST /band/auditions/${aud_raw}/placements", payload: { expected_audition_version: "${aud_raw_v}" }, as: BandDirector }
            - { call: "POST /band/auditions/${aud_rnk}/placements", payload: { expected_audition_version: "${aud_rnk_v}" }, as: BandDirector }
            - { call: "GET /band/audition-entries/${e1_raw}", payload: {}, as: Any, captures: { c1_raw: $.data.composite_score } }
            - { call: "GET /band/audition-entries/${e2_raw}", payload: {}, as: Any, captures: { c2_raw: $.data.composite_score } }
          assert:
            - "AuditionEntry.${e1_raw}.composite_score == 80.0 and .rank == 2"
            - "AuditionEntry.${e2_raw}.composite_score == 85.0 and .rank == 1"
            - "AuditionEntry.${e1_rnk}.composite_score == 1 and .rank == 1 (borda tie broken by created_at ASC)"
            - "AuditionEntry.${e2_rnk}.composite_score == 1 and .rank == 2"
            - "ChairPlacement(audition ${aud_raw}, chair_number 1).entry_id == ${e2_raw} while ChairPlacement(audition ${aud_rnk}, chair_number 1).entry_id == ${e1_rnk} — identical inputs, different winners"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: audition_single_judge_penalty_branch
        grounds:
          - calculations.audition_composite_score
          - entities.AuditionEntry.fields.composite_score
        distinguishing_aspect: |
          Mode (a): >=3 inputs (musicianship, marching, leadership, judge_count)
          with a conditional branch — a single-judge entry takes the 0.95
          SINGLE_JUDGE_PENALTY: 0.5*80+0.3*90+0.2*70 = 81 -> 81*0.95 = 76.95.
        test_recipe:
          setup:
            - "Program (RAW_WEIGHTED), audition BRASS capacity 2, one enrolled student with one entry scored by exactly one judge (80, 90, 70)"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "SJ", scoring_mode: "RAW_WEIGHTED", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Solo", grade: 12, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/auditions", payload: { program_id: "${prog}", section: "BRASS", chair_capacity: 2 }, as: BandDirector, captures: { aud: $.data.id } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud}", student_id: "${stu}" }, as: BandDirector, captures: { ent: $.data.id } }
            - { call: "POST /band/audition-entries/${ent}/scores", payload: { judge_id: "J1", musicianship: 80, marching: 90, leadership: 70 }, as: BandDirector }
          trigger:
            - { call: "POST /band/auditions/${aud}/finalize-scores", payload: {}, as: BandDirector }
            - { call: "GET /band/audition-entries/${ent}", payload: {}, as: Any }
          assert:
            - "AuditionEntry.${ent}.composite_score == 76.95"
            - "AuditionEntry.${ent}.rank == 1"
      - name: cleaning_batch_per_line_rounding_order
        grounds:
          - calculations.cleaning_batch_cost
          - entities.CleaningBatch.fields.total_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — pinned per-line
          round_half_up then sum. 11 garments (2x JACKET/BIBBERS/SHAKO/PLUME/
          GLOVES + 1 SHAKO) at 15% tier: per-line 4635 vs sum-then-round 4633;
          the scaffold pins 4635.
        test_recipe:
          setup:
            - "Program; 3 enrolled students; 11 garments issued (S1: JACKET, BIBBERS, SHAKO, PLUME, GLOVES; S2: same five; S3: SHAKO) and all returned with soiling NORMAL; batch containing all 11 sent then received"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "CL", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "U1", grade: 9, section: "WOODWIND" }, as: BandDirector, captures: { s1: $.data.id } }
            - { call: "POST /band/students/${s1}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "U2", grade: 10, section: "WOODWIND" }, as: BandDirector, captures: { s2: $.data.id } }
            - { call: "POST /band/students/${s2}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "U3", grade: 11, section: "WOODWIND" }, as: BandDirector, captures: { s3: $.data.id } }
            - { call: "POST /band/students/${s3}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "JACKET", size_label: "M" }, as: EquipmentManager, captures: { g1: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "BIBBERS", size_label: "M" }, as: EquipmentManager, captures: { g2: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "SHAKO", size_label: "7" }, as: EquipmentManager, captures: { g3: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "SHAKO", size_label: "7" }, as: EquipmentManager, captures: { g3b: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "PLUME", size_label: "STD" }, as: EquipmentManager, captures: { g4: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "GLOVES", size_label: "M" }, as: EquipmentManager, captures: { g5: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "JACKET", size_label: "L" }, as: EquipmentManager, captures: { g6: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "BIBBERS", size_label: "L" }, as: EquipmentManager, captures: { g7: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "SHAKO", size_label: "8" }, as: EquipmentManager, captures: { g8: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "SHAKO", size_label: "8" }, as: EquipmentManager, captures: { g8b: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "PLUME", size_label: "STD" }, as: EquipmentManager, captures: { g9: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "GLOVES", size_label: "L" }, as: EquipmentManager, captures: { g10: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "SHAKO", size_label: "9" }, as: EquipmentManager, captures: { g11: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s1}", uniform_id: "${g1}" }, as: EquipmentManager, captures: { ua1: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s1}", uniform_id: "${g2}" }, as: EquipmentManager, captures: { ua2: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s1}", uniform_id: "${g3}" }, as: EquipmentManager, captures: { ua3: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s1}", uniform_id: "${g4}" }, as: EquipmentManager, captures: { ua4: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s1}", uniform_id: "${g5}" }, as: EquipmentManager, captures: { ua5: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s2}", uniform_id: "${g6}" }, as: EquipmentManager, captures: { ua6: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s2}", uniform_id: "${g7}" }, as: EquipmentManager, captures: { ua7: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s2}", uniform_id: "${g8}" }, as: EquipmentManager, captures: { ua8: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s2}", uniform_id: "${g9}" }, as: EquipmentManager, captures: { ua9: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s2}", uniform_id: "${g10}" }, as: EquipmentManager, captures: { ua10: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${s3}", uniform_id: "${g11}" }, as: EquipmentManager, captures: { ua11: $.data.id } }
            - { call: "POST /band/uniform-assignments/${ua1}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua2}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua3}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua4}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua5}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua6}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua7}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua8}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua9}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua10}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments/${ua11}/return", payload: { soiling_level: "NORMAL" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches", payload: { program_id: "${prog}" }, as: EquipmentManager, captures: { batch: $.data.id } }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g1}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g2}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g3}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g4}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g5}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g6}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g7}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g8}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g9}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g10}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/items", payload: { uniform_id: "${g11}" }, as: EquipmentManager }
            - { call: "POST /band/cleaning-batches/${batch}/send", payload: {}, as: EquipmentManager }
          trigger:
            - { call: "POST /band/cleaning-batches/${batch}/receive", payload: {}, as: EquipmentManager }
            - { call: "GET /band/students/${s1}", payload: {}, as: Any }
          assert:
            - "CleaningBatch.${batch}.garment_count == 11"
            - "CleaningBatch.${batch}.discount_pct == 0.15"
            - "CleaningBatch.${batch}.total_cost_cents == 4635 (per-line: 2*(765+595+383+255+128)+383)"
            - "Student.${s1}.account_balance_cents == 2126 (765+595+383+255+128)"
            - "Student.${s3}.account_balance_cents == 383"
            - "Uniform.${g1}.status == IN_STORAGE and cleaning_count == 1"
      - name: trip_finalize_pinned_evaluation_order
        grounds:
          - calculations.trip_cost_share
          - entities.Trip.fields.subsidy_applied_cents
          - entities.TripEnrollment.fields.final_share_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order —
          subsidy sized off GROSS (not net) and division happens AFTER subsidy
          subtraction: gross 100000, pool 20000, cap round_half_up(0.25*100000)
          = 25000 -> subsidy 20000 -> net 80000 -> share round_half_up(80000/7)
          = 11429. Any other order yields a different share.
        test_recipe:
          setup:
            - "Program with subsidy_pool_cents 20000; outdoor COMPETITION event; trip (estimated 90000, capacity 10, departure 2026-09-01T00:00:00Z) with roster open; 7 enrolled students each trip-enrolled, fully paid at their provisional share (90000, 45000, 30000, 22500, 18000, 15000, 12857) and CONFIRMED; truck charter linked to the event; roster locked"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "TR", music_budget_cents: 100000, repair_budget_cents: 50000, subsidy_pool_cents: 20000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY-STADIUM", starts_at: "2026-09-01T15:00:00Z", ends_at: "2026-09-01T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, evt_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${evt_v}", capacity: 10, estimated_cost_cents: 90000, departure_at: "2026-09-01T06:00:00Z" }, as: BandDirector, captures: { trip: $.data.id } }
            - { call: "POST /band/trips/${trip}/open-roster", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "T1", grade: 9, section: "BRASS" }, as: BandDirector, captures: { s1: $.data.id } }
            - { call: "POST /band/students/${s1}/enroll", payload: {}, as: BandDirector }
