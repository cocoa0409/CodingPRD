      - name: unpaid_period_threshold_lapses_at_three_and_resets_on_full_payment
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.delinquency_progression
          - state_machines.Enrollment
          - endpoints[POST /retiree-benefits/premium-invoices/{invoice_id}/payments]
          - endpoints[POST /_ops/daily-run]
        distinguishing_aspect: |
          LAPSE_THRESHOLD_PERIODS is inclusive and cumulative, so two
          consecutive unpaid periods leave the enrollment SUSPENDED and
          DELINQUENT but very much alive, and the third one lapses it. The
          counter is also resettable: clearing the only PAST_DUE invoice in full
