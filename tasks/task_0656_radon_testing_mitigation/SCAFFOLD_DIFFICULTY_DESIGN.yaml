  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_crew_window_half_open_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_CREW_WINDOW_CONFLICT]
          - entities.MitigationJob.fields.install_start_utc
          - entities.MitigationJob.fields.install_end_utc
        distinguishing_aspect: |
          Crew install windows are half-open [start,end): a second job whose window
          [11:00,15:00) overlaps an existing SCHEDULED window [08:00,12:00) for the
          same crew is rejected ERR_CREW_WINDOW_CONFLICT, while an adjacent window
          starting exactly at 12:00 would be allowed — adjacency-aware interval
          arithmetic on the MitigationCrew resource.
        test_recipe:
          setup:
            - "Crew CW1 has job J1 SCHEDULED with window [2026-04-03T08:00Z, 2026-04-03T12:00Z)."
