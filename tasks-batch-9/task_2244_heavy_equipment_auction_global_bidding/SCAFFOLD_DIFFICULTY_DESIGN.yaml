              captures: { slot1_id: "$.data.id" }
          trigger:
            - call: "POST /loadout-slots/${slot1_id}/cancel"
              payload: { outcome: "CANCELLED", cancel_reason: "transport rescheduled by the buyer" }
              as: Bidder
              as_user_id: "${bidder_us_id}"
            - call: "GET /invoices/${inv1_id}"
              payload: {}
              as: Bidder
              as_user_id: "${bidder_us_id}"
