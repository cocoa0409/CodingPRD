  - section: rbac
    instances:
      - name: rbac_grower_cannot_create_product
        claim_type: rbac_denied
        grounds:
          - roles.BranchAdmin
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Product creation is BranchAdmin-exclusive; the Grower role is denied with 403."
        test_recipe:
          setup: ["grower exists (entity-backed identity)"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "RBAC Farms", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE (403)"

      - name: rbac_plant_operator_cannot_approve_nmp
        claim_type: rbac_denied
        grounds:
          - roles.ComplianceOfficer
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "NMP approval is ComplianceOfficer-exclusive; PlantOperator is denied even for a valid SUBMITTED plan."
        test_recipe:
          setup: ["grower, field, NMP in SUBMITTED"]
          setup_api_calls:
