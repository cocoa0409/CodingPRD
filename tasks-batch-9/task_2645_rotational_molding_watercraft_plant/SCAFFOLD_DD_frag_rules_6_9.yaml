            - "${po_v3} == ${po_v2}"
            - "the 10:30:00 attempt returns HTTP 201 and ${w_mold} == ${mold} — the SAME mould is reselected because the span is half-open at the upper end and carries NO changeover buffer; note that 10:15:00 would have satisfied the arm rule yet still collided with this mould"
