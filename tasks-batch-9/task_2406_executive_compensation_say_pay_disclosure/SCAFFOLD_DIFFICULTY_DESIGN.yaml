# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: executive-compensation-say-on-pay  (api_prefix /exec-comp)
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
#
# Canonical fixture reused across instances (all literals pinned here):
#   ACME  issuer  revenue 10,000,000,000  mcap 20,000,000,000  price 50.00  ceo_tdc 15,000,000
#   BRVO          revenue  8,000,000,000  mcap 16,000,000,000  price 40.00  ceo_tdc 12,000,000
#   CHRL          revenue 12,000,000,000  mcap 30,000,000,000  price 60.00  ceo_tdc 18,000,000
#   DLTA          revenue 20,000,000,000  mcap 40,000,000,000  price 80.00  ceo_tdc 24,000,000
#   ECHO          revenue  6,000,000,000  mcap 10,000,000,000  price 30.00  ceo_tdc  9,000,000
#   CEO Dana Reyes  base_salary_usd 1,200,000  sti_target_pct 150.00  ->  fixed_leg_usd 3,000,000.00
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: raw_median_vs_size_adjusted_benchmark_diverge_on_one_peer_set
        grounds:
          - calculations.benchmark_target_tdc
          - calculations.peer_group_medians
          - entities.PeerGroup.fields.benchmark_basis
          - entities.PeerGroup.fields.benchmark_target_tdc_raw_usd
          - entities.PeerGroup.fields.benchmark_target_tdc_adjusted_usd
          - entities.PeerGroup.fields.benchmark_target_tdc_usd
          - state_machines.PeerGroup.DRAFT_to_SCREENED
        distinguishing_aspect: |
          Variant divergence lives in the PeerGroup benchmarking domain: over the identical four-peer set the
          RAW_MEDIAN variant nearest-ranks the peers' unadjusted ceo_tdc_usd and selects 12,000,000.00, while the
          SIZE_ADJUSTED variant scales each peer by its clamped issuer/peer revenue factor, which reorders the
          list and selects 14,999,400.00 — a 2,999,400.00 delta from the same inputs.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default."
            - "ACME is the issuer; BRVO, CHRL, DLTA and ECHO are registered peers with the canonical fixture numbers."
            - "Two DRAFT peer groups over the SAME four peers: PG-RAW with benchmark_basis RAW_MEDIAN and PG-ADJ with benchmark_basis SIZE_ADJUSTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Charlie Holdings", ticker: "CHRL", is_issuer: false, gics_sector: "TECH", revenue_usd: 12000000000, market_cap_usd: 30000000000, share_price_usd: 60.00, ceo_tdc_usd: 18000000 }
              as: CompConsultant
              captures: { charl_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Delta Systems", ticker: "DLTA", is_issuer: false, gics_sector: "TECH", revenue_usd: 20000000000, market_cap_usd: 40000000000, share_price_usd: 80.00, ceo_tdc_usd: 24000000 }
              as: CompConsultant
              captures: { delta_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Echo Labs", ticker: "ECHO", is_issuer: false, gics_sector: "TECH", revenue_usd: 6000000000, market_cap_usd: 10000000000, share_price_usd: 30.00, ceo_tdc_usd: 9000000 }
              as: CompConsultant
              captures: { echo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pgraw_id: $.data.id, pgraw_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgraw_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgraw_v0}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pgraw_id}"
              as: CompConsultant
              captures: { pgraw_v1: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgraw_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgraw_v1}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pgraw_id}"
              as: CompConsultant
              captures: { pgraw_v2: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgraw_id}/members"
              payload: { peer_company_id: "${delta_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgraw_v2}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pgraw_id}"
              as: CompConsultant
              captures: { pgraw_v3: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgraw_id}/members"
              payload: { peer_company_id: "${echo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgraw_v3}" }
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "SIZE_ADJUSTED" }
              as: CompConsultant
              captures: { pgadj_id: $.data.id, pgadj_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgadj_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgadj_v0}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pgadj_id}"
              as: CompConsultant
              captures: { pgadj_v1: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgadj_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgadj_v1}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pgadj_id}"
              as: CompConsultant
              captures: { pgadj_v2: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgadj_id}/members"
              payload: { peer_company_id: "${delta_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgadj_v2}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pgadj_id}"
              as: CompConsultant
              captures: { pgadj_v3: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pgadj_id}/members"
              payload: { peer_company_id: "${echo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pgadj_v3}" }
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/peer-groups/${pgraw_id}/screen"
              payload: {}
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pgadj_id}/screen"
              payload: {}
              as: CompConsultant
          assert:
            - "PeerGroup.${pgraw_id}.benchmark_target_tdc_raw_usd == 12000000.00"
            - "PeerGroup.${pgraw_id}.benchmark_target_tdc_adjusted_usd == 14999400.00"
            - "PeerGroup.${pgraw_id}.benchmark_target_tdc_usd == 12000000.00"
            - "PeerGroup.${pgadj_id}.benchmark_target_tdc_raw_usd == 12000000.00"
            - "PeerGroup.${pgadj_id}.benchmark_target_tdc_adjusted_usd == 14999400.00"
            - "PeerGroup.${pgadj_id}.benchmark_target_tdc_usd == 14999400.00"
            - "PeerGroup.${pgadj_id}.benchmark_target_tdc_usd - PeerGroup.${pgraw_id}.benchmark_target_tdc_usd == 2999400.00"
            - "PeerGroup.${pgraw_id}.median_revenue_usd == 10000000000.00 and PeerGroup.${pgraw_id}.median_market_cap_usd == 23000000000.00"
            - "PeerGroup.${pgraw_id}.median_revenue_usd (mean-of-middles, 10000000000.00) != PeerGroup.${pgraw_id}.benchmark_target_tdc_raw_usd's nearest-rank selection method — the two percentile methods are distinct by design"
            - "PeerGroup.${pgraw_id}.accepted_member_count == 4 and PeerGroup.${pgraw_id}.size_fit_score == 100.00"
            - "PeerGroup.${pgraw_id}.status == SCREENED and PeerGroup.${pgadj_id}.status == SCREENED"

      - name: realized_versus_realizable_pay_diverge_on_identical_awards
        grounds:
          - calculations.realized_and_realizable_pay
          - calculations.pay_for_performance_alignment
          - entities.PayoutAward.fields.realized_value_usd
          - entities.PayoutAward.fields.realizable_value_usd
          - entities.PayProgram.fields.realized_pay_total_usd
          - entities.PayProgram.fields.realizable_pay_total_usd
          - endpoints[GET /exec-comp/pay-programs/{id}/pay-for-performance]
        distinguishing_aspect: |
          Variant divergence lives in the PayoutAward/PayProgram domain (not the PeerGroup domain): with both awards
          still GRANTED the REALIZED variant reports 0.00 because nothing has been delivered, while the REALIZABLE
          variant marks the PSU grant to the issuer's refreshed 60.00 share price and applies the certified 130.00
          annual-incentive factor, reporting 8,340,000.00 for the same two rows.
        test_recipe:
          setup:
            - "Canonical five-company fixture with an APPROVED four-peer RAW_MEDIAN group (benchmark_target_tdc_usd 12,000,000.00)."
            - "PayProgram P1 for fiscal 2026, mix 15.00/25.00/60.00, lti_performance_share_pct 60.00, tsr_percentile_rank 30.00, meeting_date 2027-05-12T00:00:00Z, COMMITTEE_APPROVED."
            - "Two ANNUAL_INCENTIVE metrics (ADJ_EPS weight 60.00 curve 4/5/6 LINEAR; COST_RATIO weight 40.00 curve 0.70/0.65/0.60 STEP) both CERTIFIED with achieved 5.50 and 0.63."
            - "Two GRANTED awards for the CEO: an ANNUAL_INCENTIVE opportunity and a LONG_TERM_PSU grant of 100,000 units at 50.00."
            - "ACME's share price is then refreshed to 60.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Charlie Holdings", ticker: "CHRL", is_issuer: false, gics_sector: "TECH", revenue_usd: 12000000000, market_cap_usd: 30000000000, share_price_usd: 60.00, ceo_tdc_usd: 18000000 }
              as: CompConsultant
              captures: { charl_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Delta Systems", ticker: "DLTA", is_issuer: false, gics_sector: "TECH", revenue_usd: 20000000000, market_cap_usd: 40000000000, share_price_usd: 80.00, ceo_tdc_usd: 24000000 }
              as: CompConsultant
              captures: { delta_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Echo Labs", ticker: "ECHO", is_issuer: false, gics_sector: "TECH", revenue_usd: 6000000000, market_cap_usd: 10000000000, share_price_usd: 30.00, ceo_tdc_usd: 9000000 }
              as: CompConsultant
              captures: { echo_id: $.data.id }
            - call: "POST /exec-comp/companies/${acme_id}/executives"
              payload: { full_name: "Dana Reyes", role_title: "CEO", is_neo: true, base_salary_usd: 1200000, sti_target_pct: 150.00 }
              as: CompConsultant
              captures: { ceo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v1: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${charl_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v1}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v2: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${delta_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v2}" }
              as: CompConsultant
            - call: "GET /exec-comp/peer-groups/${pg_id}"
              as: CompConsultant
              captures: { pg_v3: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${echo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v3}" }
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/screen"
              payload: {}
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/approve"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/pay-programs"
              payload: { issuer_company_id: "${acme_id}", peer_group_id: "${pg_id}", ceo_executive_id: "${ceo_id}", fiscal_year: 2026, salary_pct: 15.00, sti_pct: 25.00, lti_pct: 60.00, lti_performance_share_pct: 60.00, sti_max_multiple: 2.0, tsr_percentile_rank: 30.00, meeting_date: "2027-05-12T00:00:00Z" }
              as: CompConsultant
              captures: { pp_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/incentive-metrics"
              payload: { metric_code: "ADJ_EPS", vehicle: "ANNUAL_INCENTIVE", direction: "HIGHER_IS_BETTER", weight_pct: 60.00, threshold_value: 4.00, target_value: 5.00, maximum_value: 6.00, threshold_payout_pct: 50.00, target_payout_pct: 100.00, maximum_payout_pct: 200.00, interpolation: "LINEAR" }
              as: CompConsultant
              captures: { m1_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/incentive-metrics"
              payload: { metric_code: "COST_RATIO", vehicle: "ANNUAL_INCENTIVE", direction: "LOWER_IS_BETTER", weight_pct: 40.00, threshold_value: 0.70, target_value: 0.65, maximum_value: 0.60, interpolation: "STEP" }
              as: CompConsultant
              captures: { m2_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/approve"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/pay-programs/${pp_id}/payout-awards"
              payload: { executive_id: "${ceo_id}", vehicle: "ANNUAL_INCENTIVE" }
              as: CompConsultant
              captures: { ai_award_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/payout-awards"
              payload: { executive_id: "${ceo_id}", vehicle: "LONG_TERM_PSU", units_granted: 100000, grant_price_usd: 50.00 }
              as: CompConsultant
              captures: { psu_award_id: $.data.id }
            - call: "POST /exec-comp/incentive-metrics/${m1_id}/results"
              payload: { as_reported_value: 5.50 }
              as: CompConsultant
            - call: "POST /exec-comp/incentive-metrics/${m2_id}/results"
              payload: { as_reported_value: 0.63 }
              as: CompConsultant
            - call: "POST /exec-comp/incentive-metrics/${m1_id}/certify-result"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/incentive-metrics/${m2_id}/certify-result"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
          trigger:
            - call: "POST /exec-comp/companies/${acme_id}/market-data"
              payload: { share_price_usd: 60.00 }
              as: CompConsultant
            - call: "GET /exec-comp/pay-programs/${pp_id}/pay-for-performance"
              as: CompCommitteeChair
          assert:
            - "PayoutAward.${ai_award_id}.status == GRANTED and PayoutAward.${ai_award_id}.certified_factor_pct == 130.00"
            - "PayoutAward.${ai_award_id}.realized_value_usd == 0.00"
            - "PayoutAward.${ai_award_id}.realizable_value_usd == 2340000.00"
            - "PayoutAward.${psu_award_id}.realized_value_usd == 0.00"
            - "PayoutAward.${psu_award_id}.realizable_value_usd == 6000000.00"
            - "PayProgram.${pp_id}.realized_pay_total_usd == 0.00"
            - "PayProgram.${pp_id}.realizable_pay_total_usd == 8340000.00"
            - "GET /exec-comp/pay-programs/${pp_id}/pay-for-performance returns realized_pay_total_usd 0.00, realizable_pay_total_usd 8340000.00, pay_percentile_rank 0.00, tsr_percentile_rank 30.00, degree_of_alignment 30.00, alignment_status ALIGNED, accepted_peer_count 4"
            - "PayoutAward.${psu_award_id}.realizable_value_usd was 5000000.00 before the market-data refresh and 6000000.00 after — the REALIZED variant is unchanged at 0.00 across the same refresh"

  # =========================================================================
  # Instances below reuse the MINI fixture: ACME issuer + BRVO as the single
  # accepted peer. A one-peer RAW_MEDIAN group nearest-ranks to BRVO's
  # ceo_tdc_usd, so benchmark_target_tdc_usd == 12,000,000.00 — identical to the
  # four-peer group — while keeping every setup chain short.
  #   PeerGroup(MINI): accepted_member_count 1, median_revenue_usd 8,000,000,000.00,
  #   median_market_cap_usd 16,000,000,000.00, size_fit_score 80.00.
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payout_curve_branch_matrix_across_direction_and_interpolation
        grounds:
          - calculations.metric_payout_factor
          - calculations.annual_incentive_payout
          - entities.IncentiveMetric.fields.direction
          - entities.IncentiveMetric.fields.interpolation
          - entities.IncentiveMetric.fields.payout_factor_pct
          - state_machines.IncentiveMetric.RESULT_SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          Mode (a) conditional-branch matrix: metric_payout_factor selects one of eight branches from the
          direction x interpolation x band combination, and the four metrics of this program land on four
          different branches from three achievement values — 150.00 (HIGHER/LINEAR interpolated above target),
          50.00 (HIGHER/STEP at the threshold step), 140.00 (LOWER/LINEAR interpolated past target) and
          200.00 (LOWER/STEP at the maximum step) — which no single formula path can produce.
        test_recipe:
          setup:
            - "MINI fixture: ACME issuer, BRVO single accepted peer, APPROVED peer group with benchmark_target_tdc_usd 12,000,000.00."
            - "PayProgram P1 COMMITTEE_APPROVED with four ANNUAL_INCENTIVE metrics at weight 25.00 each, covering all four direction x interpolation combinations."
            - "One GRANTED ANNUAL_INCENTIVE award for the CEO with target_amount_usd 1,800,000.00."
            - "Achievements submitted: ADJ_EPS 5.50, REVENUE_GROWTH 4.50, COST_RATIO 0.63, ROIC 0.59."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/companies/${acme_id}/executives"
              payload: { full_name: "Dana Reyes", role_title: "CEO", is_neo: true, base_salary_usd: 1200000, sti_target_pct: 150.00 }
              as: CompConsultant
              captures: { ceo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/screen"
              payload: {}
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/approve"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
            - call: "POST /exec-comp/pay-programs"
              payload: { issuer_company_id: "${acme_id}", peer_group_id: "${pg_id}", ceo_executive_id: "${ceo_id}", fiscal_year: 2026, salary_pct: 15.00, sti_pct: 25.00, lti_pct: 60.00, lti_performance_share_pct: 60.00, sti_max_multiple: 2.0, tsr_percentile_rank: 30.00, meeting_date: "2027-05-12T00:00:00Z" }
              as: CompConsultant
              captures: { pp_id: $.data.id }
            - call: "POST /exec-comp/pay-programs/${pp_id}/incentive-metrics"
              payload: { metric_code: "ADJ_EPS", vehicle: "ANNUAL_INCENTIVE", direction: "HIGHER_IS_BETTER", weight_pct: 25.00, threshold_value: 4.00, target_value: 5.00, maximum_value: 6.00, threshold_payout_pct: 50.00, target_payout_pct: 100.00, maximum_payout_pct: 200.00, interpolation: "LINEAR" }
              as: CompConsultant
