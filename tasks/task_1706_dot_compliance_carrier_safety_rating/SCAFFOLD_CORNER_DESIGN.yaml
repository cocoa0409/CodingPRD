          trigger:
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "392.2", severity_weight: 2, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_status: $.data.status } }
            - { call: "POST /safety/drug-alcohol-tests", payload: { driver_id: "${d_id}", test_type: "PRE_EMPLOYMENT", substance: "DRUG", collected_at: "2026-07-01T00:00:00Z" }, as: SafetyManager, as_user_id: "sm-1", captures: { t_status: $.data.status, t_lab: $.data.lab_result, t_verdict: $.data.mro_verdict } }
            - { call: "POST /safety/document-records", payload: { carrier_id: "${c_id}", document_type: "TRAINING_CERTIFICATE", filed_at: "2026-01-01T00:00:00Z" }, as: SafetyManager, captures: { doc_status: $.data.status } }
