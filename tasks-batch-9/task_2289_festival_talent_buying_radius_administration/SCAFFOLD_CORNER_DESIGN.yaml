        grounds:
          - state_machines.Booking.dimension.contract_status
          - state_machines.Booking.dimension.settlement_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_parallel_contract_and_settlement_dimensions
          rationale: "That instance walks both dimensions on one row and asserts the combined state after each step, which is the parallel-shape claim in full."

      - name: locked_wave_falls_back_to_planned_when_last_assignment_cancels
        claim_type: side_effect_execution
        grounds:
          - state_machines.AnnouncementWave.transitions.LOCKED_to_PLANNED
          - endpoints[POST /festival-ops/bookings/{id}/cancel]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_booking_depth4_release_cascade
          rationale: "Hop 4 of that cascade is exactly this fallback: assignment_count reaching 0 drives LOCKED -> PLANNED, asserted there."

      - name: advance_packet_submit_return_resubmit_cycle_is_bounded
        claim_type: idempotency
        grounds:
          - state_machines.AdvancePacket.transitions.RETURNED_to_SUBMITTED
          - validations[priority 65]
          - errors[ERR_ADVANCE_SUBMISSIONS_EXHAUSTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / advance_packet_return_resubmit_cycle
          rationale: "That instance drives the loop to its third submission and asserts the fourth is ERR_ADVANCE_SUBMISSIONS_EXHAUSTED."

      - name: offer_issue_counter_revise_cycle_is_bounded
        claim_type: valid_transition
        grounds:
          - state_machines.Offer.transitions.COUNTERED_to_ISSUED
          - validations[priority 66]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / offer_negotiation_cycle_bounded_at_three_rounds
          rationale: "That instance runs three promoter revisions and asserts the fourth is refused, covering both the cycle edge and its terminator."

  - section: calculations
    instances:

      - name: tier_waterfall_remainder_assigned_to_lowest_rank
        claim_type: correct_result
        grounds:
          - calculations.tier_allocation_waterfall
          - endpoints[POST /festival-ops/festivals/{id}/allocate-tiers]
          - entities.BudgetTier.fields.allocation_cents
        distinguishing_aspect: |
          A budget of 999999 with a zero reserve makes every per-tier product fractional
          (499999.5 / 299999.7 / 199999.8), so the pinned floor-then-remainder order is
          observable: the floors are 499999 / 299999 / 199999 summing to 999997, and the
          whole 2-cent remainder lands on tier_rank 1 (500001), never spread across the
          three tiers and never re-floored. round_half_up per tier would have produced
          500000 / 300000 / 200000 and overspent the budget by one cent.
        test_recipe:
          setup:
            - "Festival with talent_budget_cents 999999 and contingency_reserve_pct 0.00, so allocatable_budget_cents == 999999."
            - "Three tiers at 0.50 / 0.30 / 0.20 in tier_rank order 1, 2, 3."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
