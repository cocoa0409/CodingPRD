            - call: "POST /sleep-consulting/cases/${case_id}/troubleshooting-sessions"
              payload: { session_type: "REGRESSION", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", expected_package_version: "${pkg_v}" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { s1_id: $.data.id }
            - call: "GET /sleep-consulting/packages/${pkg_id}"
              as: Parent
              as_user_id: "${fam_id}"
              captures: { pkg_v2: $.data.version }
          trigger:
            - call: "POST /sleep-consulting/cases/${case_id}/troubleshooting-sessions"
              payload: { session_type: "TRAVEL", scheduled_start: "2026-08-10T11:10:00Z", scheduled_end: "2026-08-10T12:10:00Z", expected_package_version: "${pkg_v2}" }
