  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: csed_suspension_open_interval_overlap_rejected
        grounds:
          - validations[priority=12]
          - entities.CsedSuspension.fields.start_at
          - errors[ERR_OVERLAPPING_SUSPENSION]
        distinguishing_aspect: >
          Half-open interval geometry on the CsedSuspension resource (TaxPeriod-scoped):
          opening a second suspension with start_at inside an existing OPEN interval on the
          same period is rejected with ERR_OVERLAPPING_SUSPENSION. Adjacency
          (start_at == a closed interval's end_at) would be allowed; this differs from the
          closed-with-buffer agreement-window geometry below.
        test_recipe:
          setup:
            - "Account, one period assessed 1000000 on 2024-01-15; clock 2024-04-15; one OPEN CsedSuspension on the period with start_at 2024-04-15 (end_at null)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "OvlA Co", tin: "100000080", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
            - call: "POST /collections/csed-suspensions"
              payload: { tax_period_id: "${period_id}", reason: "MANUAL", start_at: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
          trigger:
            - call: "POST /collections/csed-suspensions"
              payload: { tax_period_id: "${period_id}", reason: "MANUAL", start_at: "2024-05-01T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_OVERLAPPING_SUSPENSION"

      - name: agreement_active_window_buffer_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.InstallmentAgreement.fields.active_from
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
        distinguishing_aspect: >
          Closed-interval-with-buffer geometry on the InstallmentAgreement resource
          (TaxAccount-scoped): approving a second agreement whose [active_from, active_to]
          window is within AGREEMENT_BUFFER_DAYS of an already-APPROVED agreement's window
          on the same account is rejected with ERR_AGREEMENT_WINDOW_OVERLAP. Distinct
          resource and distinct interval semantics (buffer, not half-open adjacency).
        test_recipe:
          setup:
            - "Account, one period assessed 1000000 on 2024-01-15; clock 2024-04-15."
            - "A first agreement APPROVED with window [2024-04-15, 2024-10-15]; the first agreement is then DEFAULTED so the conflicting-resolution check passes but its window still occupies the account for overlap purposes... see note."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "OvlB Co", tin: "100000081", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "DIRECT_DEBIT", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-04-15T00:00:00.000Z", active_to: "2024-10-15T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr1: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v1: $.data.version }
            - call: "POST /collections/installment-agreements/${agr1}/approve"
              payload: { expected_tax_account_version: "${acct_v1}" }
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements/${agr1}/record-missed-debit"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements/${agr1}/record-missed-debit"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "LONG_TERM", payment_method: "MANUAL", monthly_payment_cents: 200000, term_months: 6, active_from: "2024-09-01T00:00:00.000Z", active_to: "2025-03-01T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr2: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /collections/installment-agreements/${agr2}/approve"
              payload: { expected_tax_account_version: "${acct_v2}" }
              as: RevenueOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_AGREEMENT_WINDOW_OVERLAP"
        note: >
          The window-overlap check (priority 9) considers the union of all
          {APPROVED, REINSTATED, DEFAULTED}-history windows recorded on the account; agr1's
          [2024-04-15,2024-10-15] window remains a recorded occupation, and agr2's
          [2024-09-01,2025-03-01] falls within the buffer, so the conflicting-resolution
          check (no ACTIVE agreement, since agr1 is DEFAULTED) passes while the
          window-overlap check fires.

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: csed_day_conservation_on_suspension_close
        grounds:
          - calculations.csed_date
          - state_machines.CsedSuspension.OPEN_to_CLOSED
          - entities.TaxPeriod.fields.csed_date
        distinguishing_aspect: >
          Conserved quantity = total statute days on a TaxPeriod. Opening a suspension
          (forward) and closing it (compensating) leaves csed_date == assessment_date +
          3653 days + sum(closed days_counted). Opening 2024-01-15->2024-04-15 (91 days)
          then closing folds exactly 91 days: csed_date moves from 2034-01-15 to
          2034-04-16, no day lost or double-counted.
        test_recipe:
          setup:
            - "Account, one period assessed 1000000 on 2024-01-15 (csed 2034-01-15); clock 2024-04-15."
            - "One CsedSuspension OPEN on the period with start_at 2024-01-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "ConA Co", tin: "100000090", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
            - call: "POST /collections/csed-suspensions"
              payload: { tax_period_id: "${period_id}", reason: "MANUAL", start_at: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { susp_id: $.data.id }
          trigger:
            - call: "POST /collections/csed-suspensions/${susp_id}/close"
              payload: { end_at: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
          assert:
            - "CsedSuspension.${susp_id}.days_counted == 91"
            - "TaxPeriod.${period_id}.csed_date == 2034-04-16T00:00:00.000Z"
            - "TaxAccount.${acct}.csed_protection_count == 0"

      - name: balance_conservation_on_payment_then_oic_abatement
        grounds:
          - calculations.payment_allocation
          - calculations.account_total_balance
          - state_machines.OfferInCompromise.EVALUATING_to_ACCEPTED
        distinguishing_aspect: >
          Conserved quantity = account dollars resolved. A partial MANUAL payment of
          300000 reduces total_balance_cents from 1033000 to 733000 (forward); accepting an
          OIC then abates the remaining balance, posting an OIC_LUMP_SUM Payment and zeroing
          all non-SATISFIED periods so total_balance_cents == 0. Dollars-resolved =
          300000 (paid) + 733000 (abated) == the original 1033000, no drift. Distinct
          conserved quantity (money) from the statute-days invariant above.
        test_recipe:
          setup:
            - "Account, one period assessed 1000000 on 2024-01-15; clock 2024-04-15; recompute -> balance 1033000."
            - "A 300000 MANUAL payment posted (balance 733000). An OIC offer 18500000 >= rcp moved to EVALUATING by a different officer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-04-15T00:00:00.000Z" }
              as: RevenueOfficer
            - call: "POST /collections/tax-accounts"
              payload: { taxpayer_name: "ConB Co", tin: "100000091", filing_status: "BUSINESS", monthly_disposable_income_cents: 300000 }
              as: RevenueOfficer
              captures: { acct: $.data.id }
            - call: "POST /collections/tax-periods"
              payload: { tax_account_id: "${acct}", tax_year: 2023, assessed_tax_cents: 1000000, assessment_date: "2024-01-15T00:00:00.000Z" }
              as: RevenueOfficer
              captures: { period_id: $.data.id }
            - call: "POST /collections/tax-accounts/${acct}/recompute"
              payload: {}
              as: RevenueOfficer
            - call: "POST /collections/payments"
              payload: { tax_account_id: "${acct}", amount_cents: 300000, payment_source: "MANUAL", tax_period_id: "${period_id}" }
              as: RevenueOfficer
            - call: "POST /collections/offers"
              payload: { tax_account_id: "${acct}", offer_amount_cents: 18500000, net_realizable_equity_cents: 500000 }
              as: RevenueOfficer
              as_user_id: "officer-sub-91"
              captures: { offer_id: $.data.id }
            - call: "POST /collections/offers/${offer_id}/begin-evaluation"
              payload: {}
              as: CaseReviewer
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /collections/offers/${offer_id}/accept"
              payload: { expected_tax_account_version: "${acct_v}" }
              as: CaseReviewer
              as_user_id: "reviewer-acc-91"
          assert:
            - "Before accept: TaxAccount.${acct}.total_balance_cents == 733000"
            - "After accept: TaxAccount.${acct}.total_balance_cents == 0"
            - "TaxPeriod.${period_id}.period_status == ABATED"
