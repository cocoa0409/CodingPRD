  - rule_id: cross_entity_state_dependency
    instances:

      - name: mortgage_close_blocked_until_build_site_leaves_safety_hold_and_completes
        entity_pair: "MortgageApplication (dependent) -> BuildSite (governing)"
        grounds:
          - state_machines.MortgageApplication.status.CLEARED_TO_CLOSE_to_CLOSED
          - state_machines.BuildSite.readiness_status.UNDER_CONSTRUCTION_to_SAFETY_HOLD
          - state_machines.BuildSite.readiness_status.SAFETY_HOLD_to_UNDER_CONSTRUCTION
          - state_machines.BuildSite.readiness_status.UNDER_CONSTRUCTION_to_COMPLETED
          - validations[priority=37]
          - errors.ERR_SITE_NOT_COMPLETED
          - entities.BuildSite.fields.readiness_status
          - entities.BuildSite.fields.pre_hold_readiness_status
          - entities.MortgageApplication.fields.status
          - calculations.subsidy_pool_ledger
        distinguishing_aspect: |
          The MortgageApplication CLEARED_TO_CLOSE -> CLOSED transition lists
          the governing entity's state as a precondition verbatim:
          "status == CLEARED_TO_CLOSE", "BuildSite.readiness_status ==
          COMPLETED", "the household's HOMEBUYER_CORE EducationEnrollment
          status == COMPLETED AND expires_on > logical clock now",
          "ApplicantHousehold.sweat_equity_satisfied == true". Everything on the
          application's own side is already true and stays fixed across both
          probes; only the BuildSite moves. Placing a safety hold from
          UNDER_CONSTRUCTION (preconditions verbatim: "readiness_status ==
          UNDER_CONSTRUCTION", "safety_posture == CLEAR") drives
          readiness_status to SAFETY_HOLD and the close is refused with
          ERR_SITE_NOT_COMPLETED at priority 37 while the application sits
          untouched in CLEARED_TO_CLOSE. Releasing the hold restores
          UNDER_CONSTRUCTION because pre_hold_readiness_status ==
          UNDER_CONSTRUCTION, then FINAL_INSPECTION lands COMPLETED
          (preconditions verbatim: "readiness_status == UNDER_CONSTRUCTION",
          "no ConstructionShift of this site has status IN {SCHEDULED, OPEN,
          LOCKED}", "assigned_household_id is not null" — satisfied because the
          only shift was cancelled in setup and the application create pinned
          assigned_household_id) and the identical close call now succeeds. The
          ledger move is pre-computed: subsidy_committed_cents 1950000 -> 0,
          subsidy_disbursed_cents 0 -> 1950000, subsidy_available_cents =
          5000000 - 0 - 1950000 = 3050000.
        test_recipe:
          setup:
            - "One AffiliateProgram with subsidy_pool_cents 5000000, sweat_equity_base_hours_required 12, committee_quorum 2."
            - "One ApplicantHousehold with a single ACTIVE APPLICANT member, so adult_occupant_count is 1 and sweat_equity_required_hours freezes at min(500, 12 + 50 * max(0, 1 - 1)) = 12; it reaches SELECTED on a FINAL composite of 91.0, then PARTNERSHIP_ACTIVE with partnership_readiness CLOSING_READY."
            - "One HOMEBUYER_CORE EducationEnrollment COMPLETED on 2026-08-01T00:00:00.000Z with expires_on 2028-07-31T00:00:00.000Z, i.e. still far in the future."
            - "One SweatEquityEntry for 12 hours of CONSTRUCTION work on 2026-08-04, verified by fsc-1 and credited, so sweat_equity_credited_hours is 12.0 and sweat_equity_satisfied is true."
            - "One MortgageApplication approved by officer-2 and then carried to CLEARED_TO_CLOSE by the readiness cascade, with silent_second_amount_cents 1950000 and subsidy_committed_cents 1950000."
            - "The BuildSite is at readiness_status UNDER_CONSTRUCTION with safety_posture CLEAR: its single shift was opened, staffed with one confirmed general volunteer, LOCKED (which moved the site off READY_TO_BUILD) and then CANCELLED, so no shift remains in {SCHEDULED, OPEN, LOCKED} and the volunteer's assigned_hours_committed is back to 0.00."
            - "Logical clock at 2026-08-05T00:00:00.000Z."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_app_id: $.data.id } }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
