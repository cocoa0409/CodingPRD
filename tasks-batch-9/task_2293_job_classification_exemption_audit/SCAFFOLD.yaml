# =============================================================================
# task_2293 — Job Classification & Exemption Audit
# §1.0–§1.7 seed tables. Single source of truth for PRD / tests / implementation.
# =============================================================================

scenario: |
  2293. Job Classification & Exemption Audit (human resources compliance team): job description
  inventory with actual duties validation through manager and incumbent interviews, exemption
  analysis under executive, administrative, professional, computer and outside sales tests with
  salary threshold checks, state-specific exemption variations and higher salary thresholds,
  misclassification risk scoring by job family with prioritized remediation, reclassification
  implementation with pay structure conversion, overtime eligibility communication and employee
  relations planning, back-wage exposure estimation and voluntary correction decisions,
  independent contractor classification review under applicable tests, ongoing job change
  triggers requiring re-analysis

domain_name: job-classification-exemption-audit

# Flat topology: every entity is a root-level collection; parentage is expressed through
# foreign keys in the request body, never through nested URL ownership. There is therefore
# no shared path prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation      # back-wage method HALF_TIME vs FULL_RATE; risk SCREENING vs EVIDENCE_WEIGHTED
    - rate_threshold_triggers       # federal/state weekly salary floors, duty-percentage floors, HCE floor
    - cascading_side_effects        # determination and job-change cascades run 4–6 hops deep
    - optimistic_concurrency        # OCC on Position.version and ReclassificationCase.version

  entity_topology: flat
  # Twelve peer collections linked by FK fields in request bodies. No nested resource paths;
  # child discovery happens through parent sub-resource GETs that return arrays.

  state_machine_shape: cyclic
  # ExemptionAnalysis: DRAFT→SUBMITTED→RETURNED→SUBMITTED revision loop, plus
  # NONEXEMPT_DETERMINED→RETURNED rescission loop.
  secondary_state_machine_shape: parallel
  # ReclassificationCase carries two independent state dimensions on one row —
  # pay_conversion_status and communication_status — whose conjunction derives case_status.

  relationship_patterns:
    - one_to_many          # AuditProject→JobFamily→Position→{DutyStatement, Interview, ExemptionAnalysis, ...}
    - self_referential     # JobFamily.parent_family_id → JobFamily.id
    - cross_aggregate      # ReclassificationCase preconditions read VoluntaryCorrection and BackWageEstimate

  role_model: segregation_of_duties
  # The X-User-ID that authored an ExemptionAnalysis may not review it; the X-User-ID that
  # proposed a VoluntaryCorrection may not decide it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: AuditProject
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Audit engagement name" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year under audit", constraints: "2000..2100" }
      - { name: lookback_policy, type: enum, source: input, default: "STANDARD_2Y", description: "Back-wage lookback policy", constraints: "STANDARD_2Y | WILLFUL_3Y" }
      - { name: status, type: enum, source: system, default: "PLANNING", description: "Engagement lifecycle stage", constraints: "PLANNING | FIELDWORK | REMEDIATION | CLOSED" }
      - { name: remediation_posture, type: enum, source: computed, description: "Derived gate over child operations; see calculations.project_remediation_posture", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: open_misclassified_headcount, type: integer, source: computed, description: "Conserved quantity: sum of Position.incumbent_count over Positions of this project whose classification_status == MISCLASSIFIED" }
      - { name: total_back_wage_exposure_cents, type: integer, source: computed, description: "Sum of BackWageEstimate.total_exposure_cents over estimates whose status == ACTIVE and whose case's Position belongs to this project" }
      - { name: converted_annual_payroll_delta_cents, type: integer, source: computed, description: "Conserved quantity: sum of ReclassificationCase.cost_delta_cents over cases of this project whose pay_conversion_status == CONVERTED" }
      - { name: committed_correction_cents, type: integer, source: computed, description: "Sum of VoluntaryCorrection.approved_amount_cents over corrections of this project whose status == APPROVED" }

  - name: StateRule
    parent: null
    common_fields: false
    description_note: "Configuration entity. Immutable once created; keyed by state_code."
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter jurisdiction code; unique across StateRule rows", constraints: "exactly 2 uppercase letters" }
      - { name: min_weekly_salary_cents, type: integer, source: input, description: "State weekly salary floor for white-collar exemptions", constraints: ">= 0" }
      - { name: hce_annual_cents, type: integer, source: input, default: 0, description: "State highly-compensated-employee annual floor; effective floor is max(this, FEDERAL_HCE_ANNUAL_CENTS)", constraints: ">= 0" }
      - { name: duties_test_variant, type: enum, source: input, description: "Which duties floor this state applies", constraints: "FEDERAL | QUANTITATIVE_50PCT | STRICT_ENUM" }
      - { name: computer_exemption_recognized, type: boolean, source: input, default: true, description: "Whether the state recognizes the computer-employee exemption" }
      - { name: outside_sales_recognized, type: boolean, source: input, default: true, description: "Whether the state recognizes the outside-sales exemption" }
      - { name: hce_shortcut_recognized, type: boolean, source: input, default: true, description: "Whether the state recognizes the HCE abbreviated duties test" }
      - { name: ic_test, type: enum, source: input, description: "Independent-contractor test applied for engagements in this state", constraints: "ABC | ECONOMIC_REALITY | COMMON_LAW" }
      - { name: liquidated_damages_multiplier, type: number, source: input, default: 1.0, description: "Multiplier applied to gross back-wage exposure to derive liquidated damages", constraints: "0.0..3.0" }
      - { name: reclass_notice_days, type: integer, source: input, default: 14, description: "Minimum calendar days between a reclassification notice and the case effective_date", constraints: ">= 0" }
      - { name: back_wage_lookback_weeks_override, type: integer, source: input, default: null, description: "State statutory lookback in weeks; when non-null the effective lookback is max(policy weeks, this value)", constraints: "null or >= 1" }

  - name: JobFamily
    parent: AuditProject
    common_fields: true
    fields:
      - { name: audit_project_id, type: string, source: input, description: "FK -> AuditProject.id; the engagement this family is inventoried under" }
      - { name: parent_family_id, type: string, source: input, default: null, description: "FK -> JobFamily.id; optional parent family. Self-referential; a family never inherits its parent's risk_score" }
      - { name: name, type: string, source: input, description: "Job family display name" }
      - { name: code, type: string, source: input, description: "Family code; unique within audit_project_id" }
      - { name: risk_variant, type: enum, source: computed, description: "Which risk algorithm produced risk_score; see calculations.job_family_risk_score", constraints: "SCREENING | EVIDENCE_WEIGHTED" }
      - { name: risk_score, type: integer, source: computed, description: "Headcount-weighted misclassification risk, 0..100" }
      - { name: risk_tier, type: enum, source: computed, description: "Banding of risk_score", constraints: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: family_headcount, type: integer, source: computed, description: "Sum of incumbent_count over Positions in the risk population of this family" }
      - { name: open_misclassified_count, type: integer, source: computed, description: "Count of Positions with job_family_id == this id and classification_status == MISCLASSIFIED" }
      - { name: remediation_priority_rank, type: integer, source: computed, default: null, description: "1-based prioritization rank assigned when the project enters REMEDIATION; null before that" }

  - name: Position
    parent: JobFamily
    common_fields: true
    fields:
      - { name: job_family_id, type: string, source: input, description: "FK -> JobFamily.id; the family this job description belongs to" }
      - { name: title, type: string, source: input, description: "Job title as published" }
      - { name: job_code, type: string, source: input, description: "Job code; unique within job_family_id" }
      - { name: current_fls_status, type: enum, source: input, description: "Classification as currently administered on payroll; rewritten by pay-conversion and revert-pay-conversion", constraints: "EXEMPT | NONEXEMPT" }
      - { name: claimed_exemption_test, type: enum, source: input, description: "Exemption the employer currently relies on", constraints: "EXECUTIVE | ADMINISTRATIVE | PROFESSIONAL | COMPUTER | OUTSIDE_SALES | NONE" }
      - { name: annual_salary_cents, type: integer, source: input, description: "Annual base compensation in cents; rewritten only by a SALARY_CHANGE JobChangeTrigger", constraints: "> 0" }
      - { name: salary_basis, type: enum, source: input, description: "How the incumbent is paid", constraints: "SALARY | HOURLY | FEE | COMMISSION" }
      - { name: work_state_code, type: string, source: input, description: "Jurisdiction code resolved against StateRule.state_code; no matching StateRule row means the federal-only baseline applies. Rewritten only by a STATE_CHANGE JobChangeTrigger", constraints: "exactly 2 uppercase letters" }
      - { name: incumbent_count, type: integer, source: input, description: "Number of employees in this job", constraints: ">= 1" }
      - { name: avg_weekly_hours, type: number, source: input, description: "Employer-reported average weekly hours", constraints: "0..168" }
      - { name: requires_advanced_degree, type: boolean, source: input, default: false, description: "Whether the job requires a prolonged course of specialized intellectual instruction" }
      - { name: works_primarily_offsite, type: boolean, source: input, default: false, description: "Whether the incumbent customarily works away from the employer's place of business" }
      - { name: weekly_salary_cents, type: integer, source: computed, description: "floor(annual_salary_cents / 52)" }
      - { name: self_reported_exempt_pct_override, type: number, source: system, default: null, description: "Set by a DUTIES_CHANGE JobChangeTrigger; when non-null it replaces the DutyStatement-derived exempt percentage" }
      - { name: self_reported_exempt_pct, type: number, source: computed, description: "self_reported_exempt_pct_override when non-null, else sum of DutyStatement.claimed_time_pct where is_exempt_duty == true" }
      - { name: primary_duty_pct, type: number, source: computed, description: "Validated exempt-duty percentage, one decimal place; see calculations.duties_corroboration" }
      - { name: validated_weekly_hours, type: number, source: computed, description: "max of the two ATTESTED interviews' reported_weekly_hours when duties_validation_status != PENDING, else avg_weekly_hours" }
      - { name: corroborated_supervises_headcount, type: integer, source: computed, description: "min of the two ATTESTED interviews' supervises_headcount; 0 when duties_validation_status == PENDING" }
      - { name: corroborated_hire_fire_influence, type: boolean, source: computed, description: "logical AND of the two ATTESTED interviews' has_hire_fire_influence; false when duties_validation_status == PENDING" }
      - { name: duties_validation_status, type: enum, source: computed, description: "Interview corroboration state", constraints: "PENDING | CORROBORATED | CONFLICTED" }
      - { name: classification_status, type: enum, source: computed, description: "Audit finding state; driven by ExemptionAnalysis and ReclassificationCase transitions", constraints: "UNREVIEWED | VALIDATED_EXEMPT | CONFIRMED_NONEXEMPT | MISCLASSIFIED | RECLASSIFIED" }
      - { name: overtime_eligible, type: boolean, source: computed, description: "true exactly when current_fls_status == NONEXEMPT" }

  - name: DutyStatement
    parent: Position
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the job description this duty line belongs to" }
      - { name: duty_code, type: string, source: input, description: "Short duty identifier" }
      - { name: description, type: string, source: input, description: "Narrative duty description" }
      - { name: claimed_time_pct, type: number, source: input, description: "Employer-claimed share of work time; the sum across a Position may not exceed 100", constraints: "0..100" }
      - { name: is_exempt_duty, type: boolean, source: input, description: "Whether the employer classifies this duty as exempt work" }
      - { name: discretion_level, type: enum, source: input, default: "NONE", description: "Degree of discretion exercised; the ADMINISTRATIVE gate requires at least one exempt duty at INDEPENDENT_JUDGMENT", constraints: "NONE | ROUTINE | INDEPENDENT_JUDGMENT" }

  - name: Interview
    parent: Position
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the job description under interview" }
      - { name: respondent_type, type: enum, source: input, description: "Whose account this interview captures; at most one non-VOIDED interview per (position_id, respondent_type)", constraints: "MANAGER | INCUMBENT" }
      - { name: respondent_ref, type: string, source: input, description: "Opaque reference to the interviewee" }
      - { name: interviewer_user_id, type: string, source: input, description: "Opaque id of the interviewer whose calendar is the contended resource" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Interview window start, inclusive" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Interview window end, exclusive", constraints: "> scheduled_start_at" }
      - { name: reported_exempt_duty_pct, type: number, source: system, default: null, description: "Respondent's account of exempt-duty share; recorded at complete", constraints: "0..100" }
      - { name: reported_weekly_hours, type: number, source: system, default: null, description: "Respondent's account of weekly hours; recorded at complete", constraints: "0..168" }
      - { name: supervises_headcount, type: integer, source: system, default: null, description: "Respondent's account of employees supervised", constraints: ">= 0" }
      - { name: has_hire_fire_influence, type: boolean, source: system, default: null, description: "Respondent's account of hire/fire influence" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical clock at complete" }
      - { name: attested_at, type: datetime, source: system, default: null, description: "Logical clock at attest" }
      - { name: void_reason, type: string, source: system, default: null, description: "Why the interview was voided; set to CHANGE_TRIGGER_DUTIES for cascade voids" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "Interview lifecycle", constraints: "SCHEDULED | COMPLETED | ATTESTED | VOIDED" }

  - name: ExemptionAnalysis
    parent: Position
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the job description being analysed" }
      - { name: applied_test, type: enum, source: input, description: "Exemption test this analysis evaluates; may differ from Position.claimed_exemption_test", constraints: "EXECUTIVE | ADMINISTRATIVE | PROFESSIONAL | COMPUTER | OUTSIDE_SALES" }
      - { name: analyst_user_id, type: string, source: system, description: "X-User-ID of the ComplianceAnalyst who created the analysis" }
      - { name: reviewer_user_id, type: string, source: system, default: null, description: "X-User-ID of the ClassificationReviewer who last returned or determined it" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Incremented on every RETURNED -> SUBMITTED resubmission" }
      - { name: weekly_salary_cents_snapshot, type: integer, source: computed, description: "Position.weekly_salary_cents as of the most recent submit" }
      - { name: primary_duty_pct_snapshot, type: number, source: computed, description: "Position.primary_duty_pct as of the most recent submit" }
      - { name: applicable_salary_floor_cents, type: integer, source: computed, description: "max(FEDERAL_MIN_WEEKLY_SALARY_CENTS, StateRule.min_weekly_salary_cents) for the Position's work_state_code" }
      - { name: applicable_duty_floor_pct, type: number, source: computed, description: "50.0 for FEDERAL and QUANTITATIVE_50PCT variants, 60.0 for STRICT_ENUM" }
      - { name: salary_threshold_source, type: enum, source: computed, description: "STATE when the state floor strictly exceeds the federal floor, else FEDERAL", constraints: "FEDERAL | STATE" }
      - { name: federal_pass, type: boolean, source: computed, description: "Whether the analysis passes under the federal baseline alone" }
      - { name: state_pass, type: boolean, source: computed, description: "Whether the analysis passes under the resolved state variation" }
      - { name: hce_shortcut_applied, type: boolean, source: computed, description: "Whether the highly-compensated abbreviated duties test carried the determination" }
      - { name: outcome, type: enum, source: computed, description: "Determination the analysis supports", constraints: "EXEMPT | NONEXEMPT | INDETERMINATE" }
      - { name: return_reason, type: string, source: system, default: null, description: "Reviewer's reason on the most recent return or rescission" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Analysis lifecycle", constraints: "DRAFT | SUBMITTED | RETURNED | EXEMPT_CONFIRMED | NONEXEMPT_DETERMINED | SUPERSEDED" }

  - name: ReclassificationCase
    parent: Position
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the job being reclassified" }
      - { name: effective_date, type: string, source: input, description: "First day the new pay structure applies, ISO date; closed-interval start" }
      - { name: effective_end_date, type: string, source: input, description: "Last day of the reclassification window, ISO date; closed-interval end", constraints: ">= effective_date" }
      - { name: conversion_method, type: enum, source: input, description: "Pay structure conversion algorithm", constraints: "SALARY_DIV_2080 | COST_NEUTRAL_WITH_OT" }
      - { name: expected_weekly_hours, type: number, source: system, default: null, description: "Hours assumption supplied at pay-conversion", constraints: "0..168" }
      - { name: converted_hourly_rate_cents, type: integer, source: computed, default: null, description: "Hourly rate produced by conversion_method; null until CONVERTED and cleared on revert" }
      - { name: projected_annual_cost_cents, type: integer, source: computed, default: null, description: "Annual cost implied by the ROUNDED converted_hourly_rate_cents" }
      - { name: cost_delta_cents, type: integer, source: computed, default: null, description: "projected_annual_cost_cents - Position.annual_salary_cents" }
      - { name: notice_channel, type: string, source: system, default: null, description: "Channel of the most recent notice" }
      - { name: notice_sent_at, type: datetime, source: system, default: null, description: "Logical clock when the notice was last sent" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Logical clock at acknowledgement" }
      - { name: acknowledged_by_ref, type: string, source: system, default: null, description: "Opaque reference to the acknowledging employee" }
      - { name: escalation_reason, type: string, source: system, default: null, description: "Employee-relations escalation reason" }
      - { name: exposure_cents, type: integer, source: computed, description: "total_exposure_cents of this case's BackWageEstimate whose status == ACTIVE; 0 when the case has none" }
      - { name: pay_conversion_status, type: enum, source: system, default: "PENDING", description: "First independent state dimension", constraints: "PENDING | CONVERTED | REVERTED" }
      - { name: communication_status, type: enum, source: system, default: "NOT_STARTED", description: "Second independent state dimension", constraints: "NOT_STARTED | NOTICE_SENT | ACKNOWLEDGED | ESCALATED" }
      - { name: case_status, type: enum, source: computed, description: "COMPLETED exactly when pay_conversion_status == CONVERTED and communication_status == ACKNOWLEDGED, else OPEN", constraints: "OPEN | COMPLETED" }

  - name: BackWageEstimate
    parent: ReclassificationCase
    common_fields: true
    fields:
      - { name: reclassification_case_id, type: string, source: input, description: "FK -> ReclassificationCase.id; the case this exposure estimate belongs to" }
      - { name: method, type: enum, source: input, description: "Overtime valuation method", constraints: "HALF_TIME | FULL_RATE" }
      - { name: lookback_weeks, type: integer, source: computed, description: "max(policy weeks from AuditProject.lookback_policy, StateRule.back_wage_lookback_weeks_override or 0)" }
      - { name: weekly_ot_hours, type: number, source: computed, description: "max(0, Position.validated_weekly_hours - STANDARD_WORKWEEK_HOURS)" }
      - { name: week_ot_cents, type: integer, source: computed, description: "Per-workweek overtime pay, rounded half-up to whole cents BEFORE any multiplication" }
      - { name: gross_exposure_cents, type: integer, source: computed, description: "week_ot_cents * lookback_weeks * Position.incumbent_count" }
      - { name: liquidated_damages_cents, type: integer, source: computed, description: "round_half_up(gross_exposure_cents * StateRule.liquidated_damages_multiplier)" }
      - { name: total_exposure_cents, type: integer, source: computed, description: "gross_exposure_cents + liquidated_damages_cents" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Only one ACTIVE estimate exists per case; a newer estimate supersedes the prior", constraints: "ACTIVE | SUPERSEDED" }

  - name: VoluntaryCorrection
    parent: ReclassificationCase
    common_fields: true
    fields:
      - { name: reclassification_case_id, type: string, source: input, description: "FK -> ReclassificationCase.id; the case this correction decision governs" }
      - { name: decision, type: enum, source: input, description: "Correction posture proposed", constraints: "SELF_CORRECT_FULL | SELF_CORRECT_PARTIAL | DEFER | AGENCY_SUPERVISED" }
      - { name: proposed_amount_cents, type: integer, source: input, description: "Amount the proposer recommends paying", constraints: ">= 0" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposer; the decider must differ" }
      - { name: approved_amount_cents, type: integer, source: system, default: null, description: "Amount authorized at APPROVE", constraints: ">= 0" }
      - { name: approver_user_id, type: string, source: system, default: null, description: "X-User-ID of the LegalCounsel who decided" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason recorded at REJECT" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "Decision lifecycle", constraints: "PROPOSED | APPROVED | REJECTED" }

  - name: ContractorReview
    parent: AuditProject
    common_fields: true
    fields:
      - { name: audit_project_id, type: string, source: input, description: "FK -> AuditProject.id; the engagement this vendor review sits under" }
      - { name: vendor_name, type: string, source: input, description: "Engaged party name" }
      - { name: engagement_state_code, type: string, source: input, description: "Jurisdiction code resolved against StateRule.state_code to select the applicable test; no matching StateRule row means ECONOMIC_REALITY" }
      - { name: free_from_control, type: boolean, source: input, default: null, description: "ABC prong A" }
      - { name: outside_usual_course, type: boolean, source: input, default: null, description: "ABC prong B" }
      - { name: independent_trade, type: boolean, source: input, default: null, description: "ABC prong C" }
      - { name: economic_reality_factors, type: object, source: input, default: null, description: "Six booleans: control_by_worker, opportunity_for_profit_or_loss, worker_investment, relationship_is_project_based, skill_and_initiative, not_integral_to_business" }
      - { name: behavioral_control_score, type: integer, source: input, default: null, description: "Common-law behavioral factor", constraints: "0..5" }
      - { name: financial_control_score, type: integer, source: input, default: null, description: "Common-law financial factor", constraints: "0..5" }
      - { name: relationship_score, type: integer, source: input, default: null, description: "Common-law relationship factor", constraints: "0..5" }
      - { name: applied_ic_test, type: enum, source: computed, description: "Test selected from the engagement state", constraints: "ABC | ECONOMIC_REALITY | COMMON_LAW" }
      - { name: ic_score, type: integer, source: computed, default: null, description: "Numeric score for ECONOMIC_REALITY (0..6) and COMMON_LAW (0..30); null for ABC" }
      - { name: outcome, type: enum, source: computed, description: "Classification the test supports", constraints: "CONTRACTOR | EMPLOYEE | INDETERMINATE" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Review lifecycle; the three FINALIZED_* states carry divergent side effects", constraints: "DRAFT | FINALIZED_CONTRACTOR | FINALIZED_EMPLOYEE | FINALIZED_INDETERMINATE" }

  - name: JobChangeTrigger
    parent: Position
    common_fields: false
    description_note: "Append-only event log. Never mutated after creation; carries only id and created_at."
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the job that changed" }
      - { name: trigger_type, type: enum, source: input, description: "Kind of job change recorded", constraints: "SALARY_CHANGE | DUTIES_CHANGE | REPORTING_CHANGE | STATE_CHANGE | FLSA_THRESHOLD_UPDATE" }
      - { name: new_annual_salary_cents, type: integer, source: input, default: null, description: "Required for SALARY_CHANGE", constraints: "> 0" }
      - { name: new_exempt_duty_pct, type: number, source: input, default: null, description: "Required for DUTIES_CHANGE", constraints: "0..100" }
      - { name: new_supervises_headcount, type: integer, source: input, default: null, description: "Required for REPORTING_CHANGE", constraints: ">= 0" }
      - { name: new_work_state_code, type: string, source: input, default: null, description: "Required for STATE_CHANGE", constraints: "exactly 2 uppercase letters" }
      - { name: requires_reanalysis, type: boolean, source: computed, description: "Whether this change forces the Position's analyses to be superseded; see calculations.reanalysis_requirement" }
      - { name: reason_code, type: enum, source: computed, description: "Why re-analysis was or was not required", constraints: "SALARY_CROSSED_THRESHOLD | DUTY_DELTA_EXCEEDED | EXEC_SUPERVISION_LOST | JURISDICTION_FLOOR_CHANGED | THRESHOLD_UPDATE_MANDATED | NO_REANALYSIS_REQUIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- AuditProject
  # Shape: cyclic. REMEDIATION can fall back to FIELDWORK when new unreviewed
  # positions are inventoried, so the engagement is not a one-way pipeline.
  - entity: AuditProject
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: FIELDWORK
        trigger: "POST /audit-projects/{id}/status with target_status=FIELDWORK"
        actor: ProgramAdmin
        preconditions:
          - "at least one JobFamily exists with audit_project_id == project.id"
        side_effects:
          - "increments AuditProject.version by 1"
        note: "Interview completion is gated on this state; see validations priority 7."

      - from: FIELDWORK
        to: REMEDIATION
        trigger: "POST /audit-projects/{id}/status with target_status=REMEDIATION"
        actor: ProgramAdmin
        preconditions:
          - "every Position under this project has classification_status != UNREVIEWED, else ERR_PROJECT_STAGE_PRECONDITION_UNMET"
        side_effects:
          - "assigns JobFamily.remediation_priority_rank to every family of this project, 1-based, ordered by risk_score DESC, then family_headcount DESC, then created_at ASC"
          - "increments AuditProject.version by 1"

      - from: REMEDIATION
        to: FIELDWORK
        trigger: "POST /audit-projects/{id}/status with target_status=FIELDWORK"
        actor: ProgramAdmin
        preconditions:
          - "at least one Position under this project has classification_status == UNREVIEWED, else ERR_PROJECT_STAGE_PRECONDITION_UNMET"
        side_effects:
          - "clears JobFamily.remediation_priority_rank to null on every family of this project"
          - "increments AuditProject.version by 1"
        note: "Cycle edge. A DUTIES_CHANGE JobChangeTrigger returns a Position to UNREVIEWED, which re-opens fieldwork."

      - from: REMEDIATION
        to: CLOSED
        trigger: "POST /audit-projects/{id}/status with target_status=CLOSED"
        actor: ProgramAdmin
        preconditions:
          - "no Position under this project has classification_status == MISCLASSIFIED, else ERR_PROJECT_NOT_READY_TO_CLOSE"
          - "every ReclassificationCase under this project has case_status == COMPLETED, else ERR_PROJECT_NOT_READY_TO_CLOSE"
          - "every VoluntaryCorrection under this project has status in {APPROVED, REJECTED}, else ERR_PROJECT_NOT_READY_TO_CLOSE"
          - "no ContractorReview under this project has status == DRAFT, else ERR_PROJECT_NOT_READY_TO_CLOSE"
        side_effects:
          - "increments AuditProject.version by 1"

  # ------------------------------------------------------------------- Interview
  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /interviews/{id}/complete"
        actor: ComplianceAnalyst
        preconditions:
          - "the Position's JobFamily's AuditProject.status == FIELDWORK, else ERR_PROJECT_STAGE_INVALID"
        side_effects:
          - "records reported_exempt_duty_pct, reported_weekly_hours, supervises_headcount, has_hire_fire_influence from the request body"
          - "sets completed_at to the current logical clock"
          - "increments Interview.version by 1"

      - from: COMPLETED
        to: ATTESTED
        trigger: "POST /interviews/{id}/attest"
        actor: ComplianceAnalyst
        preconditions:
          - "interview.completed_at is not null, else ERR_INTERVIEW_NOT_STARTED"
        side_effects:
          - "sets attested_at to the current logical clock"
          - "recomputes Position.duties_validation_status, primary_duty_pct, validated_weekly_hours, corroborated_supervises_headcount, corroborated_hire_fire_influence via calculations.duties_corroboration"
          - "recomputes JobFamily.risk_score, risk_tier, risk_variant, family_headcount via calculations.job_family_risk_score"
          - "increments Interview.version, Position.version, JobFamily.version by 1"

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /interviews/{id}/void"
        actor: ClassificationReviewer
        preconditions: []
        side_effects:
          - "sets void_reason from the request body"
          - "frees the interviewer_user_id calendar window for later bookings"
          - "increments Interview.version by 1"

      - from: COMPLETED
        to: VOIDED
        trigger: "POST /interviews/{id}/void"
        actor: ClassificationReviewer
        preconditions: []
        side_effects:
          - "sets void_reason from the request body"
          - "recomputes Position.duties_validation_status and dependent derived fields"
          - "increments Interview.version and Position.version by 1"

      - from: ATTESTED
        to: VOIDED
        trigger: "POST /interviews/{id}/void, or system cascade from POST /job-change-triggers when requires_reanalysis == true and trigger_type == DUTIES_CHANGE"
        actor: ClassificationReviewer | system
        preconditions: []
        side_effects:
          - "sets void_reason (CHANGE_TRIGGER_DUTIES for the system cascade)"
          - "recomputes Position.duties_validation_status to PENDING when fewer than two ATTESTED interviews remain, and recomputes primary_duty_pct, validated_weekly_hours, corroborated_supervises_headcount, corroborated_hire_fire_influence"
          - "recomputes JobFamily.risk_score, risk_tier, risk_variant"
          - "increments Interview.version, Position.version, JobFamily.version by 1"

  # ----------------------------------------------------------- ExemptionAnalysis
  # Shape: cyclic (primary). RETURNED -> SUBMITTED is a revision loop with an
  # incrementing counter; EXEMPT_CONFIRMED/NONEXEMPT_DETERMINED -> RETURNED is a
  # compensating rescission loop that reverses the determination's side effects.
  - entity: ExemptionAnalysis
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /exemption-analyses/{id}/submit"
        actor: ComplianceAnalyst
        preconditions:
          - "Position.duties_validation_status != PENDING, else ERR_DUTIES_NOT_CORROBORATED"
        side_effects:
          - "snapshots Position.weekly_salary_cents and Position.primary_duty_pct onto the analysis"
          - "evaluates calculations.exemption_test_evaluation, writing applicable_salary_floor_cents, applicable_duty_floor_pct, salary_threshold_source, federal_pass, state_pass, hce_shortcut_applied, outcome"
          - "increments ExemptionAnalysis.version by 1"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /exemption-analyses/{id}/return"
        actor: ClassificationReviewer
        preconditions:
          - "X-User-ID != analysis.analyst_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets reviewer_user_id and return_reason"
          - "increments ExemptionAnalysis.version by 1"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /exemption-analyses/{id}/submit"
        actor: ComplianceAnalyst
        preconditions:
          - "Position.duties_validation_status != PENDING, else ERR_DUTIES_NOT_CORROBORATED"
        side_effects:
          - "increments revision_round by 1"
          - "re-snapshots and re-evaluates calculations.exemption_test_evaluation against current Position values"
          - "increments ExemptionAnalysis.version by 1"
        note: "Cycle edge. The revision loop is unbounded; revision_round is the observable loop counter."

      - from: SUBMITTED
        to: EXEMPT_CONFIRMED
        trigger: "POST /exemption-analyses/{id}/determine"
        actor: ClassificationReviewer
        preconditions:
          - "X-User-ID != analysis.analyst_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "analysis.outcome == EXEMPT"
        side_effects:
          - "sets reviewer_user_id"
          - "sets Position.classification_status to VALIDATED_EXEMPT"
          - "recomputes JobFamily.risk_score, risk_tier, family_headcount, open_misclassified_count"
          - "recomputes AuditProject.remediation_posture and open_misclassified_headcount"
          - "increments ExemptionAnalysis.version, Position.version, JobFamily.version, AuditProject.version by 1"

      - from: SUBMITTED
        to: NONEXEMPT_DETERMINED
        trigger: "POST /exemption-analyses/{id}/determine"
        actor: ClassificationReviewer
        preconditions:
          - "X-User-ID != analysis.analyst_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "analysis.outcome == NONEXEMPT"
        side_effects:
          - "sets reviewer_user_id"
          - "sets Position.classification_status to MISCLASSIFIED when Position.current_fls_status == EXEMPT, else to CONFIRMED_NONEXEMPT"
          - "recomputes JobFamily.open_misclassified_count, risk_score, risk_tier (status_risk contribution MISCLASSIFICATION_STATUS_RISK now applies)"
          - "recomputes AuditProject.open_misclassified_headcount and remediation_posture"
          - "increments ExemptionAnalysis.version, Position.version, JobFamily.version, AuditProject.version by 1"
        note: "Head of the depth-4 determination cascade; see difficulty rule transitive_cascade."

      - from: EXEMPT_CONFIRMED
        to: RETURNED
        trigger: "POST /exemption-analyses/{id}/return"
        actor: ClassificationReviewer
        preconditions:
          - "X-User-ID != analysis.analyst_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "no ReclassificationCase exists for the Position with pay_conversion_status == CONVERTED, else ERR_RECLASS_ALREADY_CONVERTED"
        side_effects:
          - "reverts Position.classification_status to UNREVIEWED"
          - "recomputes JobFamily and AuditProject derived fields"
          - "increments ExemptionAnalysis.version, Position.version, JobFamily.version, AuditProject.version by 1"
        note: "Compensating rescission. Restores every derived value the determination changed."

      - from: NONEXEMPT_DETERMINED
        to: RETURNED
        trigger: "POST /exemption-analyses/{id}/return"
        actor: ClassificationReviewer
        preconditions:
          - "X-User-ID != analysis.analyst_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "no ReclassificationCase exists for the Position with pay_conversion_status == CONVERTED, else ERR_RECLASS_ALREADY_CONVERTED"
        side_effects:
          - "reverts Position.classification_status to UNREVIEWED"
          - "decrements JobFamily.open_misclassified_count and recomputes risk_score, risk_tier"
          - "recomputes AuditProject.open_misclassified_headcount and remediation_posture"
          - "increments ExemptionAnalysis.version, Position.version, JobFamily.version, AuditProject.version by 1"
        note: "Compensating rescission for the conserved quantity AuditProject.open_misclassified_headcount."

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system cascade from POST /job-change-triggers when requires_reanalysis == true"
        actor: system
        preconditions: []
        side_effects:
          - "increments ExemptionAnalysis.version by 1"

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system cascade from POST /job-change-triggers when requires_reanalysis == true"
        actor: system
        preconditions: []
        side_effects:
          - "increments ExemptionAnalysis.version by 1"

      - from: RETURNED
        to: SUPERSEDED
        trigger: "system cascade from POST /job-change-triggers when requires_reanalysis == true"
        actor: system
        preconditions: []
        side_effects:
          - "increments ExemptionAnalysis.version by 1"

      - from: EXEMPT_CONFIRMED
        to: SUPERSEDED
        trigger: "system cascade from POST /job-change-triggers when requires_reanalysis == true"
        actor: system
        preconditions: []
        side_effects:
          - "reverts Position.classification_status to UNREVIEWED"
          - "increments ExemptionAnalysis.version and Position.version by 1"

      - from: NONEXEMPT_DETERMINED
        to: SUPERSEDED
        trigger: "system cascade from POST /job-change-triggers when requires_reanalysis == true"
        actor: system
        preconditions: []
        side_effects:
          - "reverts Position.classification_status to UNREVIEWED"
          - "decrements JobFamily.open_misclassified_count and recomputes risk_score, risk_tier"
          - "recomputes AuditProject.open_misclassified_headcount and remediation_posture"
          - "increments ExemptionAnalysis.version, Position.version, JobFamily.version, AuditProject.version by 1"

  # ------------------------------------ ReclassificationCase, dimension 1 of 2
  # Shape: parallel dimensions. pay_conversion_status and communication_status
  # advance independently on the same row; case_status is their conjunction.
  - entity: ReclassificationCase
    dimension: pay_conversion_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CONVERTED
        trigger: "POST /reclassification-cases/{id}/pay-conversion"
        actor: CompensationManager
        preconditions:
          - "Position.classification_status == MISCLASSIFIED, else ERR_POSITION_NOT_MISCLASSIFIED"
          - "when case.exposure_cents >= VOLUNTARY_CORRECTION_MANDATORY_CENTS, an APPROVED VoluntaryCorrection exists for this case, else ERR_VOLUNTARY_CORRECTION_REQUIRED"
        side_effects:
          - "records expected_weekly_hours from the request body"
          - "computes converted_hourly_rate_cents, projected_annual_cost_cents, cost_delta_cents via calculations.pay_structure_conversion"
          - "sets Position.current_fls_status to NONEXEMPT, making overtime_eligible true, and classification_status to RECLASSIFIED"
          - "adds cost_delta_cents to AuditProject.converted_annual_payroll_delta_cents"
          - "recomputes JobFamily.open_misclassified_count, risk_score, risk_tier and AuditProject.remediation_posture"
          - "increments ReclassificationCase.version, Position.version, JobFamily.version, AuditProject.version by 1"

      - from: CONVERTED
        to: REVERTED
        trigger: "POST /reclassification-cases/{id}/revert-pay-conversion"
        actor: CompensationManager
        preconditions:
          - "case.communication_status != ACKNOWLEDGED, else ERR_CASE_ALREADY_COMPLETED"
        side_effects:
          - "clears converted_hourly_rate_cents, projected_annual_cost_cents, cost_delta_cents to null"
          - "subtracts the previous cost_delta_cents from AuditProject.converted_annual_payroll_delta_cents"
          - "sets Position.current_fls_status back to EXEMPT, making overtime_eligible false, and classification_status back to MISCLASSIFIED"
          - "recomputes JobFamily and AuditProject derived fields"
          - "increments ReclassificationCase.version, Position.version, JobFamily.version, AuditProject.version by 1"
        note: "Compensating transition for the conserved quantity AuditProject.converted_annual_payroll_delta_cents."

      - from: REVERTED
        to: CONVERTED
        trigger: "POST /reclassification-cases/{id}/pay-conversion"
        actor: CompensationManager
        preconditions:
          - "Position.classification_status == MISCLASSIFIED, else ERR_POSITION_NOT_MISCLASSIFIED"
          - "when case.exposure_cents >= VOLUNTARY_CORRECTION_MANDATORY_CENTS, an APPROVED VoluntaryCorrection exists for this case, else ERR_VOLUNTARY_CORRECTION_REQUIRED"
        side_effects:
          - "recomputes the conversion with the newly supplied expected_weekly_hours"
          - "re-adds the new cost_delta_cents to AuditProject.converted_annual_payroll_delta_cents"
          - "increments ReclassificationCase.version, Position.version, JobFamily.version, AuditProject.version by 1"
        note: "Cycle edge on the pay dimension."

  # ------------------------------------ ReclassificationCase, dimension 2 of 2
  - entity: ReclassificationCase
    dimension: communication_status
    initial_state: NOT_STARTED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: NOT_STARTED
        to: NOTICE_SENT
        trigger: "POST /reclassification-cases/{id}/communication with action=SEND_NOTICE"
        actor: EmployeeRelationsLead
        preconditions:
          - "days between the current logical clock date and case.effective_date >= StateRule.reclass_notice_days for the Position's work_state_code, else ERR_NOTICE_WINDOW_TOO_SHORT"
        side_effects:
          - "sets notice_channel and notice_sent_at"
          - "increments ReclassificationCase.version by 1"

      - from: NOTICE_SENT
        to: ACKNOWLEDGED
        trigger: "POST /reclassification-cases/{id}/communication with action=ACKNOWLEDGE"
        actor: EmployeeRelationsLead
        preconditions: []
        side_effects:
          - "sets acknowledged_at and acknowledged_by_ref"
          - "recomputes case_status to COMPLETED when pay_conversion_status == CONVERTED"
          - "increments ReclassificationCase.version by 1"

      - from: NOTICE_SENT
        to: ESCALATED
        trigger: "POST /reclassification-cases/{id}/communication with action=ESCALATE"
        actor: EmployeeRelationsLead
        preconditions: []
        side_effects:
          - "sets escalation_reason"
          - "increments ReclassificationCase.version by 1"

      - from: ESCALATED
        to: NOTICE_SENT
        trigger: "POST /reclassification-cases/{id}/communication with action=SEND_NOTICE"
        actor: EmployeeRelationsLead
        preconditions:
          - "days between the current logical clock date and case.effective_date >= StateRule.reclass_notice_days for the Position's work_state_code, else ERR_NOTICE_WINDOW_TOO_SHORT"
        side_effects:
          - "clears escalation_reason to null and refreshes notice_sent_at"
          - "increments ReclassificationCase.version by 1"
        note: "Cycle edge on the communication dimension."

      - from: ESCALATED
        to: ACKNOWLEDGED
        trigger: "POST /reclassification-cases/{id}/communication with action=ACKNOWLEDGE"
        actor: EmployeeRelationsLead
        preconditions: []
        side_effects:
          - "sets acknowledged_at and acknowledged_by_ref, clears escalation_reason"
          - "recomputes case_status to COMPLETED when pay_conversion_status == CONVERTED"
          - "increments ReclassificationCase.version by 1"

  # ------------------------------------------------------------ Position (derived)
  # Shape: compound. Position.classification_status is never set by a direct
  # endpoint; every edge below is a consequence of another entity's transition.
  - entity: Position
    dimension: classification_status
    initial_state: UNREVIEWED
    terminal_states: []
    transitions:
      - from: UNREVIEWED
        to: VALIDATED_EXEMPT
        trigger: "system cascade from POST /exemption-analyses/{id}/determine with outcome EXEMPT"
        actor: system
        preconditions: []
        side_effects: ["recomputes JobFamily and AuditProject derived fields"]

      - from: UNREVIEWED
        to: MISCLASSIFIED
        trigger: "system cascade from POST /exemption-analyses/{id}/determine with outcome NONEXEMPT while current_fls_status == EXEMPT"
        actor: system
        preconditions: []
        side_effects: ["increments JobFamily.open_misclassified_count and adds incumbent_count to AuditProject.open_misclassified_headcount"]

      - from: UNREVIEWED
        to: CONFIRMED_NONEXEMPT
        trigger: "system cascade from POST /exemption-analyses/{id}/determine with outcome NONEXEMPT while current_fls_status == NONEXEMPT"
        actor: system
        preconditions: []
        side_effects: ["removes the Position from the JobFamily risk population, changing family_headcount"]
        note: "Already paid as nonexempt: the finding is confirmatory, so no exposure and no remediation."

      - from: MISCLASSIFIED
        to: RECLASSIFIED
        trigger: "system cascade from POST /reclassification-cases/{id}/pay-conversion"
        actor: system
        preconditions: []
        side_effects: ["decrements JobFamily.open_misclassified_count and removes the Position from the risk population"]

      - from: RECLASSIFIED
        to: MISCLASSIFIED
        trigger: "system cascade from POST /reclassification-cases/{id}/revert-pay-conversion"
        actor: system
        preconditions: []
        side_effects: ["restores JobFamily.open_misclassified_count and the AuditProject headcount"]

      - from: VALIDATED_EXEMPT
        to: UNREVIEWED
        trigger: "system cascade from POST /exemption-analyses/{id}/return on an EXEMPT_CONFIRMED analysis, or from POST /job-change-triggers with requires_reanalysis == true"
        actor: system
        preconditions: []
        side_effects: ["recomputes JobFamily and AuditProject derived fields"]

      - from: MISCLASSIFIED
        to: UNREVIEWED
        trigger: "system cascade from POST /exemption-analyses/{id}/return on a NONEXEMPT_DETERMINED analysis, or from POST /job-change-triggers with requires_reanalysis == true"
        actor: system
        preconditions: []
        side_effects: ["decrements JobFamily.open_misclassified_count and subtracts incumbent_count from AuditProject.open_misclassified_headcount"]

      - from: CONFIRMED_NONEXEMPT
        to: UNREVIEWED
        trigger: "system cascade from POST /job-change-triggers with requires_reanalysis == true"
        actor: system
        preconditions: []
        side_effects: ["returns the Position to the JobFamily risk population"]

  # ----------------------------------------------------------- VoluntaryCorrection
  - entity: VoluntaryCorrection
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /voluntary-corrections/{id}/decision with disposition=APPROVE"
        actor: LegalCounsel
        preconditions:
          - "X-User-ID != correction.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "approved_amount_cents <= LEGAL_COUNSEL_AUTHORITY_CAP_CENTS, else ERR_APPROVAL_AUTHORITY_EXCEEDED"
          - "when decision == SELF_CORRECT_FULL, approved_amount_cents >= case.exposure_cents, else ERR_CORRECTION_AMOUNT_BELOW_EXPOSURE"
        side_effects:
          - "sets approved_amount_cents and approver_user_id"
          - "adds approved_amount_cents to AuditProject.committed_correction_cents"
          - "increments VoluntaryCorrection.version and AuditProject.version by 1"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /voluntary-corrections/{id}/decision with disposition=REJECT"
        actor: LegalCounsel
        preconditions:
          - "X-User-ID != correction.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets rejection_reason and approver_user_id"
          - "increments VoluntaryCorrection.version by 1"

  # -------------------------------------------------------------- ContractorReview
  # Shape: branching with divergent side effects per branch.
  - entity: ContractorReview
    initial_state: DRAFT
    terminal_states: [FINALIZED_CONTRACTOR, FINALIZED_EMPLOYEE, FINALIZED_INDETERMINATE]
    transitions:
      - from: DRAFT
        to: FINALIZED_CONTRACTOR
        trigger: "POST /contractor-reviews/{id}/finalize"
        actor: ClassificationReviewer
        preconditions:
          - "review.outcome == CONTRACTOR"
        side_effects:
          - "increments ContractorReview.version by 1"

      - from: DRAFT
        to: FINALIZED_EMPLOYEE
        trigger: "POST /contractor-reviews/{id}/finalize"
        actor: ClassificationReviewer
        preconditions:
          - "review.outcome == EMPLOYEE"
        side_effects:
          - "raises AuditProject.remediation_posture to at least RESTRICTED"
          - "increments ContractorReview.version and AuditProject.version by 1"
        note: "Only this branch touches the project posture."

      - from: DRAFT
        to: FINALIZED_INDETERMINATE
        trigger: "POST /contractor-reviews/{id}/finalize"
        actor: ClassificationReviewer
        preconditions:
          - "review.outcome == INDETERMINATE"
        side_effects:
          - "increments ContractorReview.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: analysis-create-stale-position
    parent_entity: Position
    write_endpoint: "POST /exemption-analyses"
    occ_field: "expected_position_version"
    description: |
      Creating an ExemptionAnalysis against a Position whose version has advanced
      since the client last observed it is rejected. The product deliberately
      permits a newer analysis to stand alongside prior rounds, so nothing in the
      state machine rejects the second create on its own; the stale version is the
      only signal that the analyst's view of the duties, salary and jurisdiction
      inputs is no longer the one the analysis would be evaluated against.
    error_id: ERR_STALE_POSITION_VERSION
    http_status: 412

  - rule_id: estimate-create-stale-case
    parent_entity: ReclassificationCase
    write_endpoint: "POST /back-wage-estimates"
    occ_field: "expected_reclassification_case_version"
    description: |
      Creating a BackWageEstimate against a ReclassificationCase whose version has
      advanced since the client last observed it is rejected. A new estimate
      legitimately supersedes the prior ACTIVE one, so a second sequential create
      would otherwise succeed; the stale version signals that the case's exposure
      inputs moved after the client read them.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Global conventions:
#   round_half_up(x)      -> nearest integer, .5 away from zero
#   round_half_up(x, 1)   -> nearest tenth, .05 away from zero
#   floor(x)              -> largest integer <= x
#   No calculation, ordering, tie-break or selector anywhere below reads `id`.
#   Where a fallback ordering is needed it is `created_at` ASC.
# =============================================================================
calculations:

  - name: duties_corroboration
    trigger: "On POST /interviews/{id}/attest and POST /interviews/{id}/void; recomputes the Position's validated duty fields"
    algorithm: weighted_scoring
    formula: |
      mgr = the Interview with position_id == position.id, respondent_type == MANAGER, status == ATTESTED
      inc = the Interview with position_id == position.id, respondent_type == INCUMBENT, status == ATTESTED

      self_reported_exempt_pct =
          position.self_reported_exempt_pct_override            if that field is not null
          else sum(ds.claimed_time_pct for ds in DutyStatement
                   where ds.position_id == position.id and ds.is_exempt_duty == true)

      if mgr is null or inc is null:
          duties_validation_status = PENDING
          primary_duty_pct = round_half_up(self_reported_exempt_pct, 1)
          validated_weekly_hours = position.avg_weekly_hours
          corroborated_supervises_headcount = 0
          corroborated_hire_fire_influence = false
      else:
          spread = abs(mgr.reported_exempt_duty_pct - inc.reported_exempt_duty_pct)
          if spread > CORROBORATION_SPREAD_MAX_PCT:
              duties_validation_status = CONFLICTED
              # conservative: the audit adopts the lower of the two accounts
              primary_duty_pct = round_half_up(min(mgr.reported_exempt_duty_pct,
                                                   inc.reported_exempt_duty_pct), 1)
          else:
              duties_validation_status = CORROBORATED
              primary_duty_pct = round_half_up(
                  (mgr.reported_exempt_duty_pct * MANAGER_WEIGHT_PCT
                   + inc.reported_exempt_duty_pct * INCUMBENT_WEIGHT_PCT) / 100, 1)
          validated_weekly_hours = max(mgr.reported_weekly_hours, inc.reported_weekly_hours)
          corroborated_supervises_headcount = min(mgr.supervises_headcount, inc.supervises_headcount)
          corroborated_hire_fire_influence = mgr.has_hire_fire_influence and inc.has_hire_fire_influence
    input_set: "Interviews with status == ATTESTED only. SCHEDULED, COMPLETED and VOIDED interviews are excluded, so voiding an ATTESTED interview drops the Position back to PENDING."
    constants:
      CORROBORATION_SPREAD_MAX_PCT: 15.0
      MANAGER_WEIGHT_PCT: 40
      INCUMBENT_WEIGHT_PCT: 60
    precision: "primary_duty_pct to 1 decimal place, round_half_up. Boundary is exclusive: spread == 15.0 is CORROBORATED, spread == 15.1 is CONFLICTED."

  - name: exemption_test_evaluation
    trigger: "On POST /exemption-analyses/{id}/submit (DRAFT -> SUBMITTED and RETURNED -> SUBMITTED)"
    algorithm: threshold
    formula: |
      # ---- jurisdiction resolution -------------------------------------------
      st = the StateRule with state_code == position.work_state_code, or null
      state_min_weekly   = st.min_weekly_salary_cents if st else FEDERAL_MIN_WEEKLY_SALARY_CENTS
      state_hce_annual   = st.hce_annual_cents        if st else 0
      duties_variant     = st.duties_test_variant     if st else FEDERAL
      computer_ok_state  = st.computer_exemption_recognized if st else true
      outside_ok_state   = st.outside_sales_recognized      if st else true
      hce_ok_state       = st.hce_shortcut_recognized       if st else true

      applicable_salary_floor_cents = max(FEDERAL_MIN_WEEKLY_SALARY_CENTS, state_min_weekly)
      applicable_duty_floor_pct     = 60.0 if duties_variant == STRICT_ENUM else FEDERAL_PRIMARY_DUTY_MIN_PCT
      salary_threshold_source       = STATE if state_min_weekly > FEDERAL_MIN_WEEKLY_SALARY_CENTS else FEDERAL

      weekly_salary_cents = floor(position.annual_salary_cents / 52)
      hourly_rate_cents   = floor(position.annual_salary_cents / ANNUAL_HOURS_DIVISOR)
      hce_floor_cents     = max(FEDERAL_HCE_ANNUAL_CENTS, state_hce_annual)

      # ---- per-test duties gate (jurisdiction-independent part) ---------------
      duties_gate(applied_test) =
        EXECUTIVE      -> position.corroborated_supervises_headcount >= EXECUTIVE_MIN_SUPERVISED
                          and position.corroborated_hire_fire_influence == true
        ADMINISTRATIVE -> exists ds in DutyStatement where ds.position_id == position.id
                          and ds.is_exempt_duty == true
                          and ds.discretion_level == INDEPENDENT_JUDGMENT
        PROFESSIONAL   -> position.requires_advanced_degree == true
        COMPUTER       -> true
        OUTSIDE_SALES  -> position.works_primarily_offsite == true

      # ---- salary leg, evaluated twice against two different floors -----------
      salary_ok(floor_cents) =
        true                                          if applied_test == OUTSIDE_SALES
        else weekly_salary_cents >= floor_cents        if position.salary_basis != HOURLY
        else hourly_rate_cents >= COMPUTER_HOURLY_MIN_CENTS
             if applied_test == COMPUTER and position.salary_basis == HOURLY
        else false

      # ---- duties leg, evaluated twice against two different floors -----------
      duties_ok(floor_pct) =
        true                                                if applied_test == OUTSIDE_SALES
        else position.primary_duty_pct >= floor_pct and duties_gate(applied_test)

      # ---- jurisdiction recognition leg --------------------------------------
      recognized_state =
        computer_ok_state if applied_test == COMPUTER
        else outside_ok_state if applied_test == OUTSIDE_SALES
        else true

      # ---- HCE abbreviated duties shortcut ----------------------------------
      hce_eligible = position.annual_salary_cents >= hce_floor_cents
                     and weekly_salary_cents >= FEDERAL_MIN_WEEKLY_SALARY_CENTS
                     and position.primary_duty_pct >= HCE_MIN_DUTY_PCT
                     and applied_test in {EXECUTIVE, ADMINISTRATIVE, PROFESSIONAL}

      # ---- the two passes ----------------------------------------------------
      federal_pass = (salary_ok(FEDERAL_MIN_WEEKLY_SALARY_CENTS)
                      and duties_ok(FEDERAL_PRIMARY_DUTY_MIN_PCT))
                     or hce_eligible

      state_pass   = recognized_state
                     and salary_ok(applicable_salary_floor_cents)
                     and ( duties_ok(applicable_duty_floor_pct)
                           or (hce_eligible and hce_ok_state) )

      hce_shortcut_applied = hce_eligible and not duties_ok(FEDERAL_PRIMARY_DUTY_MIN_PCT)

      # ---- outcome -----------------------------------------------------------
      outcome =
        INDETERMINATE   if position.duties_validation_status == PENDING
        else EXEMPT     if federal_pass and state_pass
        else NONEXEMPT
    input_set: "The Position's own fields plus its DutyStatements plus the single StateRule matching work_state_code. A Position in a state with no StateRule row is evaluated on the federal baseline alone, in which case federal_pass and state_pass necessarily agree."
    constants:
      FEDERAL_MIN_WEEKLY_SALARY_CENTS: 84400
      FEDERAL_HCE_ANNUAL_CENTS: 13200000
      FEDERAL_PRIMARY_DUTY_MIN_PCT: 50.0
      HCE_MIN_DUTY_PCT: 20.0
      COMPUTER_HOURLY_MIN_CENTS: 2763
      EXECUTIVE_MIN_SUPERVISED: 2
      ANNUAL_HOURS_DIVISOR: 2080
    precision: "Salary comparisons are integer-cent, inclusive at the floor (weekly == floor passes). Duty comparisons are on one-decimal percentages, inclusive at the floor (49.9 fails a 50.0 floor, 50.0 passes)."
    variants:
      - name: federal_baseline_leg
        when: "Always computed; produces federal_pass"
        difference: "Uses FEDERAL_MIN_WEEKLY_SALARY_CENTS and FEDERAL_PRIMARY_DUTY_MIN_PCT, ignores state recognition flags, and honors the HCE shortcut unconditionally."
      - name: state_variation_leg
        when: "Always computed; produces state_pass"
        difference: "Uses applicable_salary_floor_cents and applicable_duty_floor_pct, requires the state to recognize the exemption at all, and honors the HCE shortcut only when hce_shortcut_recognized is true. A Position can therefore pass federally and fail on the state leg, which yields NONEXEMPT."

  - name: back_wage_exposure
    trigger: "On POST /back-wage-estimates"
    algorithm: aggregation
    formula: |
      case     = the ReclassificationCase this estimate belongs to
      position = the Position of that case
      project  = the AuditProject of that Position's JobFamily
      st       = the StateRule with state_code == position.work_state_code, or null

      policy_weeks = LOOKBACK_WEEKS_WILLFUL if project.lookback_policy == WILLFUL_3Y
                     else LOOKBACK_WEEKS_STANDARD
      lookback_weeks = max(policy_weeks, (st.back_wage_lookback_weeks_override or 0) if st else 0)

      weekly_salary_cents = floor(position.annual_salary_cents / 52)
      weekly_ot_hours     = max(0, position.validated_weekly_hours - STANDARD_WORKWEEK_HOURS)

      if method == FULL_RATE:
          regular_rate = weekly_salary_cents / STANDARD_WORKWEEK_HOURS
          week_ot_cents = round_half_up(weekly_ot_hours * regular_rate * 1.5)
      else:   # HALF_TIME (fluctuating workweek): salary already paid straight time
          regular_rate = weekly_salary_cents / position.validated_weekly_hours
          week_ot_cents = round_half_up(weekly_ot_hours * regular_rate * 0.5)

      # ROUNDING ORDER IS PINNED. week_ot_cents is rounded to whole cents BEFORE
      # multiplication. Computing the unrounded weekly figure, multiplying by
      # lookback_weeks * incumbent_count and rounding once at the end ("sum then
      # round") is FORBIDDEN and produces a different, incorrect total.
      gross_exposure_cents = week_ot_cents * lookback_weeks * position.incumbent_count
      liquidated_damages_cents = round_half_up(
          gross_exposure_cents * ((st.liquidated_damages_multiplier if st else 0.0)))
      total_exposure_cents = gross_exposure_cents + liquidated_damages_cents
    input_set: "A single ReclassificationCase and its Position. The prior ACTIVE estimate for the same case is set to SUPERSEDED; only the ACTIVE estimate contributes to ReclassificationCase.exposure_cents and to the project rollup."
    constants:
      STANDARD_WORKWEEK_HOURS: 40
      LOOKBACK_WEEKS_STANDARD: 104
      LOOKBACK_WEEKS_WILLFUL: 156
    precision: "Whole cents, round_half_up, applied per workweek then multiplied. Never round after aggregating."
    variants:
      - name: FULL_RATE
        when: "method == FULL_RATE: the salary is held to cover 40 hours only"
        difference: "regular_rate divides the weekly salary by 40 and overtime is valued at 1.5x, so the exposure grows as hours rise."
      - name: HALF_TIME
        when: "method == HALF_TIME: the salary is held to cover all hours worked"
        difference: "regular_rate divides the weekly salary by validated_weekly_hours and overtime is valued at 0.5x. For identical inputs this yields a strictly smaller exposure than FULL_RATE whenever validated_weekly_hours > 40."

  - name: job_family_risk_score
    trigger: "On any change to a Position's primary_duty_pct, validated_weekly_hours, annual_salary_cents, work_state_code or classification_status; and on Position creation"
    algorithm: weighted_scoring
    formula: |
      # ---- population --------------------------------------------------------
      pop = [ p for p in Position
              where p.job_family_id == family.id
              and p.classification_status not in {CONFIRMED_NONEXEMPT, RECLASSIFIED} ]
      # Child families are scored independently: a family NEVER absorbs the
      # positions or the score of a family whose parent_family_id points at it.

      family_headcount = sum(p.incumbent_count for p in pop)
      open_misclassified_count = count(p for p in Position
                                       where p.job_family_id == family.id
                                       and p.classification_status == MISCLASSIFIED)

      if family_headcount == 0:
          risk_variant = EVIDENCE_WEIGHTED
          risk_score = 0
          risk_tier = LOW
          stop            # empty family: no division, no premium

      # ---- per-position risk -------------------------------------------------
      for p in pop:
          floor_cents = the applicable_salary_floor_cents for p (see exemption_test_evaluation)
          floor_pct   = the applicable_duty_floor_pct for p    (see exemption_test_evaluation)

          margin_pct = p.primary_duty_pct - floor_pct
          duty_risk  = clamp(0, 40, round_half_up(40 - margin_pct * 2))

          weekly = floor(p.annual_salary_cents / 52)
          salary_risk = 0  if weekly >= round_half_up(floor_cents * 1.15)
                        else 15 if weekly >= floor_cents
                        else 30

          hours_risk = min(20, round_half_up(max(0, p.validated_weekly_hours - STANDARD_WORKWEEK_HOURS) * 2))

          status_risk = MISCLASSIFICATION_STATUS_RISK if p.classification_status == MISCLASSIFIED else 0

          position_risk[p] = min(100, duty_risk + salary_risk + hours_risk + status_risk)

      # ---- variant selection and roll-up -------------------------------------
      risk_variant = SCREENING if any(p.duties_validation_status == PENDING for p in pop)
                     else EVIDENCE_WEIGHTED
      premium = SCREENING_UNCERTAINTY_PREMIUM if risk_variant == SCREENING else 0

      weighted = sum(position_risk[p] * p.incumbent_count for p in pop) / family_headcount
      risk_score = min(100, round_half_up(weighted + premium))

      risk_tier = CRITICAL if risk_score >= 75
                  else HIGH if risk_score >= 55
                  else MEDIUM if risk_score >= 30
                  else LOW
    input_set: "Positions of this family only, excluding CONFIRMED_NONEXEMPT (finding is confirmatory, no remaining risk) and RECLASSIFIED (already remediated). Positions of child families are never included."
    constants:
      STANDARD_WORKWEEK_HOURS: 40
      MISCLASSIFICATION_STATUS_RISK: 25
      SCREENING_UNCERTAINTY_PREMIUM: 12
    precision: "Integer 0..100. Each component is rounded half-up individually, then summed and capped at 100 per position; the headcount-weighted mean is rounded half-up once after the premium is added."
    variants:
      - name: SCREENING
        when: "At least one Position in the population still has duties_validation_status == PENDING"
        difference: "Adds SCREENING_UNCERTAINTY_PREMIUM (12) to the weighted mean before rounding, because unvalidated duties understate risk. Same underlying Positions therefore score 12 points higher than under EVIDENCE_WEIGHTED."
      - name: EVIDENCE_WEIGHTED
        when: "Every Position in the population has duties_validation_status in {CORROBORATED, CONFLICTED}"
        difference: "No premium; the score is the pure headcount-weighted mean of position_risk."

  - name: pay_structure_conversion
    trigger: "On POST /reclassification-cases/{id}/pay-conversion"
    algorithm: constraint_propagation
    formula: |
      annual = position.annual_salary_cents
      h      = case.expected_weekly_hours
      ot_h   = max(0, h - STANDARD_WORKWEEK_HOURS)

      # EVALUATION ORDER IS PINNED. The cost-neutral rate and the projected cost
      # appear mutually dependent (the rate is chosen so the cost equals the old
      # salary, and the cost is a function of the rate). The dependency is broken
      # in exactly this order and no other:
      #   step 1: solve the rate in CLOSED FORM from the UNROUNDED annual salary
      #   step 2: round the rate to whole cents
      #   step 3: recompute the projected annual cost FROM THE ROUNDED RATE
      #   step 4: the delta is projected cost minus the original annual salary
      # Because step 3 consumes the rounded rate, cost_delta_cents is generally
      # non-zero even for COST_NEUTRAL_WITH_OT. Iterating steps 1-3 to drive the
      # delta to zero is FORBIDDEN.

      if conversion_method == SALARY_DIV_2080:
          converted_hourly_rate_cents = round_half_up(annual / ANNUAL_HOURS_DIVISOR)
      else:   # COST_NEUTRAL_WITH_OT
          denom_hours = STANDARD_WORKWEEK_HOURS + 1.5 * ot_h
          converted_hourly_rate_cents = round_half_up(annual / (52 * denom_hours))

      r = converted_hourly_rate_cents
      projected_annual_cost_cents = round_half_up(
          52 * (STANDARD_WORKWEEK_HOURS * r + ot_h * 1.5 * r))
      cost_delta_cents = projected_annual_cost_cents - annual
    input_set: "The Position's annual_salary_cents and the expected_weekly_hours supplied on the pay-conversion call. Nothing else is read; validated_weekly_hours is deliberately NOT used, because the conversion is a forward-looking pay design, not a historical measurement."
    constants:
      STANDARD_WORKWEEK_HOURS: 40
      ANNUAL_HOURS_DIVISOR: 2080
    precision: "Whole cents, round_half_up. The rate is rounded before the projected cost is computed."
    variants:
      - name: SALARY_DIV_2080
        when: "conversion_method == SALARY_DIV_2080"
        difference: "Rate is annual / 2080 with no regard for overtime, so the projected cost exceeds the old salary whenever expected_weekly_hours > 40 and cost_delta_cents is positive."
      - name: COST_NEUTRAL_WITH_OT
        when: "conversion_method == COST_NEUTRAL_WITH_OT"
        difference: "Rate is discounted by the overtime premium embedded in denom_hours, so the projected cost lands within one rounding step of the old salary and cost_delta_cents is near zero (and may be negative)."

  - name: contractor_classification
    trigger: "On POST /contractor-reviews (evaluated at create; the finalize call only asserts the outcome)"
    algorithm: threshold
    formula: |
      st = the StateRule with state_code == review.engagement_state_code, or null
      applied_ic_test = st.ic_test if st else ECONOMIC_REALITY

      if applied_ic_test == ABC:
          # all three prongs are required; failure of any one prong means employee
          ic_score = null
          outcome = CONTRACTOR if (free_from_control and outside_usual_course and independent_trade)
                    else EMPLOYEE
          # ABC admits no INDETERMINATE result.
      elif applied_ic_test == ECONOMIC_REALITY:
          f = review.economic_reality_factors
          ic_score = count of true values among
              [ f.control_by_worker, f.opportunity_for_profit_or_loss, f.worker_investment,
                f.relationship_is_project_based, f.skill_and_initiative, f.not_integral_to_business ]
          outcome = CONTRACTOR     if ic_score >= 5
                    else EMPLOYEE  if ic_score <= 2
                    else INDETERMINATE
      else:   # COMMON_LAW
          ic_score = review.behavioral_control_score * 3
                     + review.financial_control_score * 2
                     + review.relationship_score * 1
          outcome = CONTRACTOR     if ic_score >= 20
                    else EMPLOYEE  if ic_score <= 11
                    else INDETERMINATE
    input_set: "The ContractorReview's own fields plus the single StateRule matching engagement_state_code. Required inputs differ by test; supplying the wrong set yields ERR_IC_TEST_INPUTS_MISSING."
    constants:
      ABC_PRONGS_REQUIRED: 3
      ECONOMIC_REALITY_CONTRACTOR_MIN: 5
      ECONOMIC_REALITY_EMPLOYEE_MAX: 2
      COMMON_LAW_CONTRACTOR_MIN: 20
      COMMON_LAW_EMPLOYEE_MAX: 11
      COMMON_LAW_BEHAVIORAL_WEIGHT: 3
      COMMON_LAW_FINANCIAL_WEIGHT: 2
      COMMON_LAW_RELATIONSHIP_WEIGHT: 1
    precision: "Integer scores. Band edges are inclusive: ic_score 20 is CONTRACTOR, 19 is INDETERMINATE, 12 is INDETERMINATE, 11 is EMPLOYEE."

  - name: project_remediation_posture
    trigger: "On every transition that changes a Position.classification_status, a JobFamily.risk_tier, or a ContractorReview.status"
    algorithm: threshold
    formula: |
      families = JobFamily where audit_project_id == project.id
      positions = Position where job_family_id in families

      open_misclassified_headcount = sum(p.incumbent_count for p in positions
                                         where p.classification_status == MISCLASSIFIED)

      if any(f.risk_tier == CRITICAL and f.open_misclassified_count >= 1 for f in families):
          remediation_posture = FROZEN
      elif any(p.classification_status == MISCLASSIFIED for p in positions)
           or any(r.status == FINALIZED_EMPLOYEE for r in ContractorReview
                  where r.audit_project_id == project.id):
          remediation_posture = RESTRICTED
      else:
          remediation_posture = OPEN
    input_set: "All JobFamilies, Positions and ContractorReviews of the project. Evaluated top-down: the FROZEN test is checked first and short-circuits."
    constants:
      MISCLASSIFICATION_STATUS_RISK: 25
    precision: "N/A (enum)"

  - name: reanalysis_requirement
    trigger: "On POST /job-change-triggers"
    algorithm: constraint_propagation
    formula: |
      p  = the Position named by position_id
      st = the StateRule with state_code == p.work_state_code, or null

      old_floor_cents = max(FEDERAL_MIN_WEEKLY_SALARY_CENTS,
                            st.min_weekly_salary_cents if st else FEDERAL_MIN_WEEKLY_SALARY_CENTS)
      old_weekly = floor(p.annual_salary_cents / 52)

      if trigger_type == SALARY_CHANGE:
          new_weekly = floor(new_annual_salary_cents / 52)
          # only a change that moves the position across the applicable floor matters
          requires_reanalysis = (old_weekly >= old_floor_cents) != (new_weekly >= old_floor_cents)
          reason_code = SALARY_CROSSED_THRESHOLD if requires_reanalysis else NO_REANALYSIS_REQUIRED

      elif trigger_type == DUTIES_CHANGE:
          requires_reanalysis = abs(new_exempt_duty_pct - p.primary_duty_pct) >= REANALYSIS_DUTY_DELTA_PCT
          reason_code = DUTY_DELTA_EXCEEDED if requires_reanalysis else NO_REANALYSIS_REQUIRED

      elif trigger_type == REPORTING_CHANGE:
          requires_reanalysis = (p.claimed_exemption_test == EXECUTIVE
                                 and new_supervises_headcount < EXECUTIVE_MIN_SUPERVISED)
          reason_code = EXEC_SUPERVISION_LOST if requires_reanalysis else NO_REANALYSIS_REQUIRED

      elif trigger_type == STATE_CHANGE:
          ns = the StateRule with state_code == new_work_state_code, or null
          new_floor_cents = max(FEDERAL_MIN_WEEKLY_SALARY_CENTS,
                                ns.min_weekly_salary_cents if ns else FEDERAL_MIN_WEEKLY_SALARY_CENTS)
          old_floor_pct = 60.0 if (st and st.duties_test_variant == STRICT_ENUM) else FEDERAL_PRIMARY_DUTY_MIN_PCT
          new_floor_pct = 60.0 if (ns and ns.duties_test_variant == STRICT_ENUM) else FEDERAL_PRIMARY_DUTY_MIN_PCT
          requires_reanalysis = (new_floor_cents != old_floor_cents) or (new_floor_pct != old_floor_pct)
          reason_code = JURISDICTION_FLOOR_CHANGED if requires_reanalysis else NO_REANALYSIS_REQUIRED

      else:   # FLSA_THRESHOLD_UPDATE
          requires_reanalysis = true
          reason_code = THRESHOLD_UPDATE_MANDATED

      # ---- side effects when requires_reanalysis is true ---------------------
      # 1. write the changed attribute onto the Position:
      #      SALARY_CHANGE   -> annual_salary_cents := new_annual_salary_cents
      #      DUTIES_CHANGE   -> self_reported_exempt_pct_override := new_exempt_duty_pct
      #      STATE_CHANGE    -> work_state_code := new_work_state_code
      #      REPORTING_CHANGE / FLSA_THRESHOLD_UPDATE -> no attribute write
      # 2. every ExemptionAnalysis of the Position whose status != SUPERSEDED
      #    transitions to SUPERSEDED
      # 3. Position.classification_status := UNREVIEWED
      # 4. for DUTIES_CHANGE only: every ATTESTED Interview of the Position
      #    transitions to VOIDED with void_reason CHANGE_TRIGGER_DUTIES, which
      #    forces duties_validation_status back to PENDING
      # 5. duties_corroboration, job_family_risk_score and
      #    project_remediation_posture are recomputed in that order
      #
      # When requires_reanalysis is false the trigger row is still created and
      # NO attribute write and NO cascade occurs.
    input_set: "The Position, the StateRule for its current work_state_code, and (for STATE_CHANGE) the StateRule for the proposed code."
    constants:
      REANALYSIS_DUTY_DELTA_PCT: 10.0
      FEDERAL_MIN_WEEKLY_SALARY_CENTS: 84400
      FEDERAL_PRIMARY_DUTY_MIN_PCT: 50.0
      EXECUTIVE_MIN_SUPERVISED: 2
    precision: "Duty delta compared at 1 decimal place, inclusive: a delta of exactly 10.0 requires re-analysis."

  - name: project_exposure_rollup
    trigger: "On POST /back-wage-estimates, on any Position.classification_status change, and on any VoluntaryCorrection decision"
    algorithm: aggregation
    formula: |
      total_back_wage_exposure_cents =
          sum( e.total_exposure_cents
               for e in BackWageEstimate
               where e.status == ACTIVE
               and the Position of e's ReclassificationCase belongs to this project
               and that Position.classification_status in {MISCLASSIFIED, RECLASSIFIED} )

      converted_annual_payroll_delta_cents =
          sum( c.cost_delta_cents
               for c in ReclassificationCase of this project
               where c.pay_conversion_status == CONVERTED )

      committed_correction_cents =
          sum( v.approved_amount_cents
               for v in VoluntaryCorrection of this project
               where v.status == APPROVED )
    input_set: "Only ACTIVE BackWageEstimates count toward exposure, and only while the underlying Position is MISCLASSIFIED or RECLASSIFIED. Rescinding a determination back to UNREVIEWED therefore drops the exposure out of the rollup without deleting the estimate."
    constants:
      VOLUNTARY_CORRECTION_MANDATORY_CENTS: 5000000
      LEGAL_COUNSEL_AUTHORITY_CAP_CENTS: 25000000
    precision: "Whole cents; pure integer summation, no rounding."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the first violated rule determines the response and no later rule runs)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles AND is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource named by a path parameter exists, validated left to right"
    error_id: ERR_AUDIT_PROJECT_NOT_FOUND | ERR_JOB_FAMILY_NOT_FOUND | ERR_POSITION_NOT_FOUND | ERR_INTERVIEW_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_RECLASS_CASE_NOT_FOUND | ERR_CORRECTION_NOT_FOUND | ERR_CONTRACTOR_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Request body conforms to the endpoint's input schema: required fields present, types correct, enum values within the declared set, numeric values within the declared range, scheduled_end_at > scheduled_start_at, effective_end_date >= effective_date, and the per-trigger_type required field present on POST /job-change-triggers"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: existence
    check: "Every entity referenced by a foreign-key field in the request body exists"
    error_id: ERR_AUDIT_PROJECT_NOT_FOUND | ERR_JOB_FAMILY_NOT_FOUND | ERR_POSITION_NOT_FOUND | ERR_RECLASS_CASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /job-families, POST /positions, POST /duty-statements, POST /interviews, POST /exemption-analyses, POST /reclassification-cases, POST /back-wage-estimates, POST /voluntary-corrections, POST /contractor-reviews, POST /job-change-triggers"

  - priority: 6
    category: business_safety
    check: "The AuditProject's remediation_posture permits the requested write. FROZEN blocks all three inventory creates; RESTRICTED blocks creating a Position into a JobFamily whose risk_tier is HIGH or CRITICAL."
    error_id: ERR_PROJECT_POSTURE_FROZEN | ERR_POSTURE_RESTRICTED_FAMILY
    http_status: 409
    applies_to: "POST /job-families, POST /positions, POST /contractor-reviews"

  - priority: 7
    category: state
    check: "The AuditProject is in the stage this operation requires: FIELDWORK to book or to complete a duties-validation interview; and, on the status endpoint, the requested target_status is a declared transition from the project's current status with its preconditions met"
    error_id: ERR_PROJECT_STAGE_INVALID | ERR_PROJECT_STAGE_PRECONDITION_UNMET | ERR_PROJECT_NOT_READY_TO_CLOSE
    http_status: 409
    applies_to: "POST /audit-projects/{id}/status, POST /interviews, POST /interviews/{id}/complete"

  - priority: 8
    category: state
    check: "The target entity's current state has a declared transition for this trigger (including the outcome-matching guard on determine and finalize, and completed_at presence on attest)"
    error_id: ERR_INVALID_STATE_TRANSITION | ERR_INTERVIEW_NOT_STARTED | ERR_RECLASS_ALREADY_CONVERTED | ERR_CASE_ALREADY_COMPLETED
    http_status: 409
    applies_to: "POST /interviews/{id}/complete, POST /interviews/{id}/attest, POST /interviews/{id}/void, POST /exemption-analyses/{id}/submit, POST /exemption-analyses/{id}/return, POST /exemption-analyses/{id}/determine, POST /reclassification-cases/{id}/pay-conversion, POST /reclassification-cases/{id}/revert-pay-conversion, POST /reclassification-cases/{id}/communication, POST /voluntary-corrections/{id}/decision, POST /contractor-reviews/{id}/finalize"

  - priority: 9
    category: state
    check: "The supplied expected_<parent>_version equals the parent entity's current version (§1.2.1)"
    error_id: ERR_STALE_POSITION_VERSION | ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /exemption-analyses, POST /back-wage-estimates"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from ExemptionAnalysis.analyst_user_id on return and determine, and from VoluntaryCorrection.proposed_by_user_id on decision"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /exemption-analyses/{id}/return, POST /exemption-analyses/{id}/determine, POST /voluntary-corrections/{id}/decision"

  - priority: 11
    category: business_safety
    check: "The Position's duties_validation_status is not PENDING, i.e. both a MANAGER and an INCUMBENT interview have been attested"
    error_id: ERR_DUTIES_NOT_CORROBORATED
    http_status: 409
    applies_to: "POST /exemption-analyses/{id}/submit"

  - priority: 12
    category: business_referential
    check: "Cross-entity prerequisites hold: the Position is MISCLASSIFIED before pay conversion, and an APPROVED VoluntaryCorrection exists when the case's exposure_cents reaches VOLUNTARY_CORRECTION_MANDATORY_CENTS"
    error_id: ERR_POSITION_NOT_MISCLASSIFIED | ERR_VOLUNTARY_CORRECTION_REQUIRED
    http_status: 409
    applies_to: "POST /reclassification-cases/{id}/pay-conversion"

  - priority: 13
    category: business_constraint
    check: "Uniqueness and allocation constraints: JobFamily.code unique within audit_project_id; Position.job_code unique within job_family_id; StateRule.state_code globally unique; at most one non-VOIDED Interview per (position_id, respondent_type); the sum of DutyStatement.claimed_time_pct for a Position does not exceed 100; the independent-contractor inputs required by the applicable test are all supplied"
    error_id: ERR_DUPLICATE_CODE | ERR_DUPLICATE_INTERVIEW_RESPONDENT | ERR_DUTY_TIME_OVERALLOCATED | ERR_IC_TEST_INPUTS_MISSING
    http_status: 409
    applies_to: "POST /state-rules, POST /job-families, POST /positions, POST /duty-statements, POST /interviews, POST /contractor-reviews"

  - priority: 14
    category: business_temporal
    check: "The interviewer's calendar is free: the half-open window [scheduled_start_at, scheduled_end_at) must not intersect the window of any Interview with the same interviewer_user_id and status in {SCHEDULED, COMPLETED, ATTESTED}, evaluated across all projects. Zero buffer: back-to-back windows that share an endpoint are permitted."
    error_id: ERR_INTERVIEWER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /interviews"

  - priority: 15
    category: business_temporal
    check: "The reclassification window is clear for the Position: the closed interval [effective_date, effective_end_date] must be separated from every existing case's closed interval on the same Position by strictly more than RECLASS_WINDOW_BUFFER_DAYS calendar days"
    error_id: ERR_RECLASS_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /reclassification-cases"

  - priority: 16
    category: business_constraint
    check: "Reclassification wave capacity: at most MAX_CONCURRENT_RECLASS_PER_FAMILY cases with pay_conversion_status in {PENDING, CONVERTED} may have intersecting windows within one JobFamily"
    error_id: ERR_RECLASS_WAVE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /reclassification-cases"

  - priority: 17
    category: business_temporal
    check: "The notice lead time reaches the jurisdiction's minimum: the calendar days from the current logical clock date to the case's effective_date is at least StateRule.reclass_notice_days"
    error_id: ERR_NOTICE_WINDOW_TOO_SHORT
    http_status: 409
    applies_to: "POST /reclassification-cases/{id}/communication"

  - priority: 18
    category: business_fiscal
    check: "The approver is within authority: approved_amount_cents does not exceed LEGAL_COUNSEL_AUTHORITY_CAP_CENTS"
    error_id: ERR_APPROVAL_AUTHORITY_EXCEEDED
    http_status: 409
    applies_to: "POST /voluntary-corrections/{id}/decision"

  - priority: 19
    category: business_fiscal
    check: "A SELF_CORRECT_FULL correction is funded: approved_amount_cents is at least the case's exposure_cents"
    error_id: ERR_CORRECTION_AMOUNT_BELOW_EXPOSURE
    http_status: 409
    applies_to: "POST /voluntary-corrections/{id}/decision"

# =============================================================================
# §1.5 API Endpoint Table
#
# Every path parameter is literally `{id}` and refers to the resource named by
# the immediately preceding collection segment. All list endpoints accept the
# standard `limit` / `offset` pagination inputs and return rows ordered by
# `created_at` ASC (never by `id`).
# =============================================================================
endpoints:

  # ------------------------------------------------------------- test harness
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every date and datetime comparison in the domain reads. The default logical clock before any call to this endpoint is 2026-08-01T00:00:00Z."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["all subsequent notice-window, interview-window and reclassification-window comparisons read the new value"]

  # ---------------------------------------------------------------- StateRule
  - method: POST
    path: "/state-rules"
    description: "Registers a jurisdiction's exemption variation: salary floors, duties-test variant, recognition flags, independent-contractor test, liquidated-damages multiplier, notice lead time and statutory lookback"
    roles: [ProgramAdmin]
    code: 201
    input: [state_code, min_weekly_salary_cents, duties_test_variant, ic_test, "hce_annual_cents?", "computer_exemption_recognized?", "outside_sales_recognized?", "hce_shortcut_recognized?", "liquidated_damages_multiplier?", "reclass_notice_days?", "back_wage_lookback_weeks_override?"]
    output: StateRule
    side_effects: ["no cascade; already-computed ExemptionAnalysis rows are not re-evaluated"]

  - method: GET
    path: "/state-rules"
    description: "Lists registered jurisdiction rules, ordered by created_at ASC"
    roles: &all_roles [ProgramAdmin, ComplianceAnalyst, ClassificationReviewer, CompensationManager, EmployeeRelationsLead, LegalCounsel, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: StateRule[]
    side_effects: []

  # ------------------------------------------------------------- AuditProject
  - method: POST
    path: "/audit-projects"
    description: "Opens a classification audit engagement in PLANNING"
    roles: [ProgramAdmin]
    code: 201
    input: [name, fiscal_year, "lookback_policy?"]
    output: AuditProject
    side_effects: ["initializes remediation_posture to OPEN and every rollup counter to 0"]

  - method: GET
    path: "/audit-projects/{id}"
    description: "Returns one audit project including its derived posture and rollups"
    roles: *all_roles
    code: 200
    input: []
    output: AuditProject
    side_effects: []

  - method: POST
    path: "/audit-projects/{id}/status"
    description: "Advances or rewinds the engagement stage; target_status selects the transition (FIELDWORK, REMEDIATION or CLOSED)"
    roles: [ProgramAdmin]
    code: 200
    input: [target_status]
    output: AuditProject
    side_effects: ["assigns or clears JobFamily.remediation_priority_rank", "increments AuditProject.version by 1"]

  - method: GET
    path: "/audit-projects/{id}/job-families"
    description: "Lists the job families inventoried under this engagement, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: JobFamily[]
    side_effects: []

  - method: GET
    path: "/audit-projects/{id}/contractor-reviews"
    description: "Lists the independent-contractor reviews under this engagement, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: ContractorReview[]
    side_effects: []

  # ---------------------------------------------------------------- JobFamily
  - method: POST
    path: "/job-families"
    description: "Creates a job family under an engagement, optionally beneath a parent family"
    roles: [ProgramAdmin]
    code: 201
    input: [audit_project_id, name, code, "parent_family_id?"]
    output: JobFamily
    side_effects: ["initializes risk_score to 0, risk_tier to LOW, risk_variant to EVIDENCE_WEIGHTED, family_headcount to 0, open_misclassified_count to 0, remediation_priority_rank to null"]

  - method: GET
    path: "/job-families/{id}"
    description: "Returns one job family with its current risk score, tier, variant and remediation rank"
    roles: *all_roles
    code: 200
    input: []
    output: JobFamily
    side_effects: []

  - method: GET
    path: "/job-families/{id}/child-families"
    description: "Lists the families whose parent_family_id is this family, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: JobFamily[]
    side_effects: []

  - method: GET
    path: "/job-families/{id}/positions"
    description: "Lists the positions inventoried in this family, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: Position[]
    side_effects: []

  # ----------------------------------------------------------------- Position
  - method: POST
    path: "/positions"
    description: "Adds a job description to the inventory in UNREVIEWED classification status"
    roles: [ProgramAdmin]
    code: 201
    input: [job_family_id, title, job_code, current_fls_status, claimed_exemption_test, annual_salary_cents, salary_basis, work_state_code, incumbent_count, avg_weekly_hours, "requires_advanced_degree?", "works_primarily_offsite?"]
    output: Position
    side_effects: ["computes weekly_salary_cents, self_reported_exempt_pct (0 with no duty statements), primary_duty_pct, validated_weekly_hours, duties_validation_status (PENDING), overtime_eligible", "recomputes the JobFamily risk score, tier, variant and headcount", "recomputes AuditProject.remediation_posture", "increments JobFamily.version and AuditProject.version by 1"]

  - method: GET
    path: "/positions/{id}"
    description: "Returns one position with every derived duty, salary and classification field"
    roles: *all_roles
    code: 200
    input: []
    output: Position
    side_effects: []

  - method: GET
    path: "/positions/{id}/duty-statements"
    description: "Lists the duty statements of this position, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: DutyStatement[]
    side_effects: []

  - method: GET
    path: "/positions/{id}/interviews"
    description: "Lists the manager and incumbent interviews of this position, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: Interview[]
    side_effects: []

  - method: GET
    path: "/positions/{id}/exemption-analyses"
    description: "Lists the exemption analyses of this position across all revision rounds, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: ExemptionAnalysis[]
    side_effects: []

  - method: GET
    path: "/positions/{id}/reclassification-cases"
    description: "Lists the reclassification cases of this position, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: ReclassificationCase[]
    side_effects: []

  - method: GET
    path: "/positions/{id}/job-change-triggers"
    description: "Lists the append-only job change events recorded against this position, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: JobChangeTrigger[]
    side_effects: []

  # ------------------------------------------------------------- DutyStatement
  - method: POST
    path: "/duty-statements"
    description: "Adds a duty line to a job description; the claimed time percentages of a position may not exceed 100 in total"
    roles: [ComplianceAnalyst]
    code: 201
    input: [position_id, duty_code, description, claimed_time_pct, is_exempt_duty, "discretion_level?"]
    output: DutyStatement
    side_effects: ["recomputes Position.self_reported_exempt_pct and, while duties_validation_status is PENDING, Position.primary_duty_pct", "recomputes the JobFamily risk score and tier", "increments Position.version and JobFamily.version by 1"]

  # ----------------------------------------------------------------- Interview
  - method: POST
    path: "/interviews"
    description: "Books a duties-validation interview with a manager or an incumbent in SCHEDULED status; the engagement must be in FIELDWORK"
    roles: [ComplianceAnalyst]
    code: 201
    input: [position_id, respondent_type, respondent_ref, interviewer_user_id, scheduled_start_at, scheduled_end_at]
    output: Interview
    side_effects: ["reserves the half-open window on the interviewer's calendar across all projects"]

  - method: GET
    path: "/interviews/{id}"
    description: "Returns one interview with its reported figures and lifecycle timestamps"
    roles: *all_roles
    code: 200
    input: []
    output: Interview
    side_effects: []

  - method: POST
    path: "/interviews/{id}/complete"
    description: "Records the respondent's account of duties, hours, supervision and hire/fire influence"
    roles: [ComplianceAnalyst]
    code: 200
    input: [reported_exempt_duty_pct, reported_weekly_hours, supervises_headcount, has_hire_fire_influence]
    output: Interview
    side_effects: ["sets completed_at from the logical clock", "increments Interview.version by 1"]

  - method: POST
    path: "/interviews/{id}/attest"
    description: "Attests the completed interview, which feeds it into the duties corroboration calculation"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: Interview
    side_effects: ["sets attested_at from the logical clock", "recomputes Position.duties_validation_status, primary_duty_pct, validated_weekly_hours, corroborated_supervises_headcount, corroborated_hire_fire_influence", "recomputes JobFamily.risk_score, risk_tier, risk_variant, family_headcount", "recomputes AuditProject.remediation_posture", "increments Interview.version, Position.version, JobFamily.version, AuditProject.version by 1"]

  - method: POST
    path: "/interviews/{id}/void"
    description: "Voids an interview, releasing the interviewer's window and withdrawing the account from corroboration"
    roles: [ClassificationReviewer]
    code: 200
    input: [void_reason]
    output: Interview
    side_effects: ["recomputes Position duty fields, which returns duties_validation_status to PENDING when fewer than two ATTESTED interviews remain", "recomputes JobFamily.risk_score, risk_tier, risk_variant", "increments Interview.version, Position.version, JobFamily.version by 1"]

  # ---------------------------------------------------------- ExemptionAnalysis
  - method: POST
    path: "/exemption-analyses"
    description: "Opens a DRAFT exemption analysis for one of the five white-collar tests. Requires the position version the analyst last observed (§1.2.1 analysis-create-stale-position)."
    roles: [ComplianceAnalyst]
    code: 201
    input: [position_id, applied_test, expected_position_version]
    output: ExemptionAnalysis
    side_effects: ["records analyst_user_id from X-User-ID", "increments Position.version by 1"]

  - method: GET
    path: "/exemption-analyses/{id}"
    description: "Returns one exemption analysis with both jurisdictional legs and the resulting outcome"
    roles: *all_roles
    code: 200
    input: []
    output: ExemptionAnalysis
    side_effects: []

  - method: POST
    path: "/exemption-analyses/{id}/submit"
    description: "Submits the analysis for review, snapshotting the position inputs and evaluating the federal and state legs"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: ExemptionAnalysis
    side_effects: ["writes weekly_salary_cents_snapshot, primary_duty_pct_snapshot, applicable_salary_floor_cents, applicable_duty_floor_pct, salary_threshold_source, federal_pass, state_pass, hce_shortcut_applied, outcome", "increments revision_round by 1 when resubmitting from RETURNED", "increments ExemptionAnalysis.version by 1"]

  - method: POST
    path: "/exemption-analyses/{id}/return"
    description: "Returns a submitted analysis to the analyst, or rescinds a determination already made, reversing every derived field the determination changed"
    roles: [ClassificationReviewer]
    code: 200
    input: [return_reason]
    output: ExemptionAnalysis
    side_effects: ["sets reviewer_user_id and return_reason", "when rescinding, reverts Position.classification_status to UNREVIEWED and restores JobFamily.open_misclassified_count, risk_score, risk_tier and AuditProject.open_misclassified_headcount, remediation_posture, total_back_wage_exposure_cents", "increments ExemptionAnalysis.version, Position.version, JobFamily.version, AuditProject.version by 1"]

  - method: POST
    path: "/exemption-analyses/{id}/determine"
    description: "Records the reviewer's determination; the target state is chosen by the analysis outcome (EXEMPT_CONFIRMED or NONEXEMPT_DETERMINED) and INDETERMINATE cannot be determined"
    roles: [ClassificationReviewer]
    code: 200
    input: []
    output: ExemptionAnalysis
    side_effects: ["sets reviewer_user_id", "sets Position.classification_status", "recomputes JobFamily.open_misclassified_count, risk_score, risk_tier, family_headcount", "recomputes AuditProject.open_misclassified_headcount and remediation_posture", "increments ExemptionAnalysis.version, Position.version, JobFamily.version, AuditProject.version by 1"]

  # ------------------------------------------------------ ReclassificationCase
  - method: POST
    path: "/reclassification-cases"
    description: "Opens a reclassification window for a position, with the pay dimension in PENDING and the communication dimension in NOT_STARTED"
    roles: [CompensationManager]
    code: 201
    input: [position_id, effective_date, effective_end_date, conversion_method]
    output: ReclassificationCase
    side_effects: ["initializes exposure_cents to 0 and case_status to OPEN"]

  - method: GET
    path: "/reclassification-cases/{id}"
    description: "Returns one reclassification case with both state dimensions, the conversion figures and the current exposure"
    roles: *all_roles
    code: 200
    input: []
    output: ReclassificationCase
    side_effects: []

  - method: POST
    path: "/reclassification-cases/{id}/pay-conversion"
    description: "Converts the position's pay structure using the case's conversion_method and the supplied hours assumption"
    roles: [CompensationManager]
    code: 200
    input: [expected_weekly_hours]
    output: ReclassificationCase
    side_effects: ["computes converted_hourly_rate_cents, projected_annual_cost_cents, cost_delta_cents", "sets Position.current_fls_status to NONEXEMPT and classification_status to RECLASSIFIED, making overtime_eligible true", "adds cost_delta_cents to AuditProject.converted_annual_payroll_delta_cents", "recomputes JobFamily and AuditProject derived fields", "increments ReclassificationCase.version, Position.version, JobFamily.version, AuditProject.version by 1"]

  - method: POST
    path: "/reclassification-cases/{id}/revert-pay-conversion"
    description: "Reverses a completed pay conversion, restoring the exempt pay structure and removing the delta from the engagement rollup"
    roles: [CompensationManager]
    code: 200
    input: []
    output: ReclassificationCase
    side_effects: ["clears converted_hourly_rate_cents, projected_annual_cost_cents, cost_delta_cents", "subtracts the previous cost_delta_cents from AuditProject.converted_annual_payroll_delta_cents", "sets Position.current_fls_status back to EXEMPT and classification_status back to MISCLASSIFIED", "recomputes JobFamily and AuditProject derived fields", "increments ReclassificationCase.version, Position.version, JobFamily.version, AuditProject.version by 1"]

  - method: POST
    path: "/reclassification-cases/{id}/communication"
    description: "Drives the employee-relations dimension; action selects SEND_NOTICE, ACKNOWLEDGE or ESCALATE"
    roles: [EmployeeRelationsLead]
    code: 200
    input: [action, "notice_channel?", "acknowledged_by_ref?", "escalation_reason?"]
    output: ReclassificationCase
    side_effects: ["sets notice_channel and notice_sent_at, or acknowledged_at and acknowledged_by_ref, or escalation_reason", "recomputes case_status", "increments ReclassificationCase.version by 1"]

  - method: GET
    path: "/reclassification-cases/{id}/back-wage-estimates"
    description: "Lists the back-wage estimates of this case including superseded ones, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: BackWageEstimate[]
    side_effects: []

  - method: GET
    path: "/reclassification-cases/{id}/voluntary-corrections"
    description: "Lists the voluntary correction proposals of this case, ordered by created_at ASC"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: VoluntaryCorrection[]
    side_effects: []

  # --------------------------------------------------------- BackWageEstimate
  - method: POST
    path: "/back-wage-estimates"
    description: "Estimates back-wage exposure for a reclassification case under the half-time or full-rate method. Requires the case version the estimator last observed (§1.2.1 estimate-create-stale-case)."
    roles: [CompensationManager]
    code: 201
    input: [reclassification_case_id, method, expected_reclassification_case_version]
    output: BackWageEstimate
    side_effects: ["sets the previous ACTIVE estimate of the case to SUPERSEDED", "computes lookback_weeks, weekly_ot_hours, week_ot_cents, gross_exposure_cents, liquidated_damages_cents, total_exposure_cents", "refreshes ReclassificationCase.exposure_cents and AuditProject.total_back_wage_exposure_cents", "increments ReclassificationCase.version by 1"]

  # ------------------------------------------------------ VoluntaryCorrection
  - method: POST
    path: "/voluntary-corrections"
    description: "Proposes a voluntary correction posture and amount for a reclassification case"
    roles: [CompensationManager, LegalCounsel]
    code: 201
    input: [reclassification_case_id, decision, proposed_amount_cents]
    output: VoluntaryCorrection
    side_effects: ["records proposed_by_user_id from X-User-ID, which the decider may not match"]

  - method: POST
    path: "/voluntary-corrections/{id}/decision"
    description: "Approves or rejects a proposed correction; disposition selects APPROVE or REJECT"
    roles: [LegalCounsel]
    code: 200
    input: [disposition, "approved_amount_cents?", "rejection_reason?"]
    output: VoluntaryCorrection
    side_effects: ["sets approver_user_id and either approved_amount_cents or rejection_reason", "on approval adds approved_amount_cents to AuditProject.committed_correction_cents", "increments VoluntaryCorrection.version and AuditProject.version by 1"]

  # --------------------------------------------------------- ContractorReview
  - method: POST
    path: "/contractor-reviews"
    description: "Opens a DRAFT independent-contractor review; the applicable test is selected from the engagement state and the outcome is computed at create"
    roles: [ComplianceAnalyst]
    code: 201
    input: [audit_project_id, vendor_name, engagement_state_code, "free_from_control?", "outside_usual_course?", "independent_trade?", "economic_reality_factors?", "behavioral_control_score?", "financial_control_score?", "relationship_score?"]
    output: ContractorReview
    side_effects: ["computes applied_ic_test, ic_score and outcome"]

  - method: POST
    path: "/contractor-reviews/{id}/finalize"
    description: "Finalizes the review into the terminal state matching its computed outcome"
    roles: [ClassificationReviewer]
    code: 200
    input: []
    output: ContractorReview
    side_effects: ["on the FINALIZED_EMPLOYEE branch only, raises AuditProject.remediation_posture to at least RESTRICTED", "increments ContractorReview.version by 1"]

  # --------------------------------------------------------- JobChangeTrigger
  - method: POST
    path: "/job-change-triggers"
    description: "Records an ongoing job change against a position and evaluates whether it forces re-analysis; when it does, the whole analysis history of the position is superseded"
    roles: [ComplianceAnalyst]
    code: 201
    input: [position_id, trigger_type, "new_annual_salary_cents?", "new_exempt_duty_pct?", "new_supervises_headcount?", "new_work_state_code?"]
    output: JobChangeTrigger
    side_effects: ["computes requires_reanalysis and reason_code", "when requires_reanalysis is true: writes the changed attribute onto the Position, supersedes every non-SUPERSEDED ExemptionAnalysis of the Position, returns Position.classification_status to UNREVIEWED, voids every ATTESTED Interview of the Position for DUTIES_CHANGE, then recomputes the Position duty fields, the JobFamily risk score and tier, and the AuditProject posture and rollups", "increments Position.version, JobFamily.version, AuditProject.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-Role or X-User-ID header absent or empty" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "X-User-Role is unknown or is not listed in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, enum value outside the declared set, numeric value outside range, scheduled_end_at <= scheduled_start_at, effective_end_date < effective_date, effective_date in the past, or the per-trigger_type required field absent" }
  - { id: ERR_AUDIT_PROJECT_NOT_FOUND, http: 404, condition: "The audit project named in the path or in audit_project_id does not exist" }
  - { id: ERR_JOB_FAMILY_NOT_FOUND, http: 404, condition: "The job family named in the path or in job_family_id or parent_family_id does not exist" }
  - { id: ERR_POSITION_NOT_FOUND, http: 404, condition: "The position named in the path or in position_id does not exist" }
  - { id: ERR_INTERVIEW_NOT_FOUND, http: 404, condition: "The interview named in the path does not exist" }
  - { id: ERR_ANALYSIS_NOT_FOUND, http: 404, condition: "The exemption analysis named in the path does not exist" }
  - { id: ERR_RECLASS_CASE_NOT_FOUND, http: 404, condition: "The reclassification case named in the path or in reclassification_case_id does not exist" }
  - { id: ERR_CORRECTION_NOT_FOUND, http: 404, condition: "The voluntary correction named in the path does not exist" }
  - { id: ERR_CONTRACTOR_REVIEW_NOT_FOUND, http: 404, condition: "The contractor review named in the path does not exist" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "StateRule.state_code already registered, JobFamily.code already used within the engagement, or Position.job_code already used within the family" }
  - { id: ERR_DUPLICATE_INTERVIEW_RESPONDENT, http: 409, condition: "A non-VOIDED interview already exists for this position and respondent_type" }
  - { id: ERR_DUTY_TIME_OVERALLOCATED, http: 409, condition: "Adding the duty statement would push the position's total claimed_time_pct above 100" }
  - { id: ERR_IC_TEST_INPUTS_MISSING, http: 409, condition: "The independent-contractor inputs the applicable test requires were not all supplied: the three ABC prongs, the six economic-reality factors, or the three common-law scores" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "No declared transition exists from the entity's current state for this trigger, including determining an INDETERMINATE analysis or finalizing into a branch that does not match the computed outcome" }
  - { id: ERR_INTERVIEW_NOT_STARTED, http: 409, condition: "Attest was called on an interview whose completed_at is null" }
  - { id: ERR_PROJECT_STAGE_INVALID, http: 409, condition: "The engagement is not in the stage this operation requires, or target_status is not a declared transition from the engagement's current status" }
  - { id: ERR_PROJECT_STAGE_PRECONDITION_UNMET, http: 409, condition: "The requested stage transition is declared but its preconditions do not hold: no job family exists for PLANNING to FIELDWORK, an UNREVIEWED position remains for FIELDWORK to REMEDIATION, or none remains for REMEDIATION back to FIELDWORK" }
  - { id: ERR_PROJECT_NOT_READY_TO_CLOSE, http: 409, condition: "Closure was requested while a MISCLASSIFIED position, an incomplete reclassification case, an undecided voluntary correction, or a DRAFT contractor review remains" }
  - { id: ERR_PROJECT_POSTURE_FROZEN, http: 409, condition: "The engagement's remediation_posture is FROZEN, which blocks creating job families, positions and contractor reviews" }
  - { id: ERR_POSTURE_RESTRICTED_FAMILY, http: 409, condition: "The engagement's remediation_posture is RESTRICTED and the target job family's risk_tier is HIGH or CRITICAL" }
  - { id: ERR_STALE_POSITION_VERSION, http: 412, condition: "expected_position_version does not equal the position's current version" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_reclassification_case_version does not equal the case's current version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting X-User-ID authored the analysis being reviewed, or proposed the correction being decided" }
  - { id: ERR_DUTIES_NOT_CORROBORATED, http: 409, condition: "Submit was called while the position's duties_validation_status is PENDING" }
  - { id: ERR_INTERVIEWER_DOUBLE_BOOKED, http: 409, condition: "The requested half-open window intersects another window already reserved for the same interviewer_user_id" }
  - { id: ERR_RECLASS_WINDOW_CONFLICT, http: 409, condition: "The requested closed reclassification window is not separated from an existing window on the same position by more than RECLASS_WINDOW_BUFFER_DAYS days" }
  - { id: ERR_RECLASS_WAVE_CAPACITY_EXCEEDED, http: 409, condition: "The job family already has MAX_CONCURRENT_RECLASS_PER_FAMILY unreverted cases whose windows intersect the requested one" }
  - { id: ERR_POSITION_NOT_MISCLASSIFIED, http: 409, condition: "Pay conversion was requested for a position whose classification_status is not MISCLASSIFIED" }
  - { id: ERR_VOLUNTARY_CORRECTION_REQUIRED, http: 409, condition: "Pay conversion was requested on a case whose exposure_cents reaches VOLUNTARY_CORRECTION_MANDATORY_CENTS with no APPROVED voluntary correction" }
  - { id: ERR_RECLASS_ALREADY_CONVERTED, http: 409, condition: "A determination was rescinded while a reclassification case for the position is already CONVERTED" }
  - { id: ERR_CASE_ALREADY_COMPLETED, http: 409, condition: "Revert was requested on a case whose communication_status is ACKNOWLEDGED" }
  - { id: ERR_NOTICE_WINDOW_TOO_SHORT, http: 409, condition: "The days from the logical clock date to the case's effective_date are fewer than the jurisdiction's reclass_notice_days" }
  - { id: ERR_APPROVAL_AUTHORITY_EXCEEDED, http: 409, condition: "approved_amount_cents exceeds LEGAL_COUNSEL_AUTHORITY_CAP_CENTS" }
  - { id: ERR_CORRECTION_AMOUNT_BELOW_EXPOSURE, http: 409, condition: "A SELF_CORRECT_FULL correction was approved for less than the case's exposure_cents" }

# =============================================================================
# §1.7 RBAC Matrix
#
# role_model: segregation_of_duties. All seven roles are operational identities,
# so every `identity:` is `opaque`; the scaffold stores opaque ids on entities
# (analyst_user_id, reviewer_user_id, interviewer_user_id, proposed_by_user_id,
# approver_user_id) but never requires one to equal any entity's `id`.
# =============================================================================
roles:

  - name: ProgramAdmin
    description: "Owns the engagement skeleton: jurisdiction rules, the engagement itself, its stage, the job-family tree and the job-description inventory"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /state-rules"
      - "POST /audit-projects"
      - "POST /audit-projects/{id}/status"
      - "POST /job-families"
      - "POST /positions"
    shared_operations: ["all GET endpoints"]

  - name: ComplianceAnalyst
    description: "Performs fieldwork: documents duties, runs manager and incumbent interviews, authors exemption analyses, screens contractors and logs job changes"
    identity: opaque
    exclusive_operations:
      - "POST /duty-statements"
      - "POST /interviews"
      - "POST /interviews/{id}/complete"
      - "POST /interviews/{id}/attest"
      - "POST /exemption-analyses"
      - "POST /exemption-analyses/{id}/submit"
      - "POST /contractor-reviews"
      - "POST /job-change-triggers"
    shared_operations: ["all GET endpoints"]

  - name: ClassificationReviewer
    description: "Independent reviewer: returns or determines analyses authored by someone else, voids unreliable interviews, finalizes contractor reviews"
    identity: opaque
    exclusive_operations:
      - "POST /exemption-analyses/{id}/return"
      - "POST /exemption-analyses/{id}/determine"
      - "POST /interviews/{id}/void"
      - "POST /contractor-reviews/{id}/finalize"
    shared_operations: ["all GET endpoints"]

  - name: CompensationManager
    description: "Designs and executes the pay-structure conversion and quantifies back-wage exposure"
    identity: opaque
    exclusive_operations:
      - "POST /reclassification-cases"
      - "POST /reclassification-cases/{id}/pay-conversion"
      - "POST /reclassification-cases/{id}/revert-pay-conversion"
      - "POST /back-wage-estimates"
    shared_operations: ["POST /voluntary-corrections", "all GET endpoints"]

  - name: EmployeeRelationsLead
    description: "Runs the overtime-eligibility communication and employee-relations plan for each case"
    identity: opaque
    exclusive_operations:
      - "POST /reclassification-cases/{id}/communication"
    shared_operations: ["all GET endpoints"]

  - name: LegalCounsel
    description: "Decides voluntary correction posture within a delegated monetary authority; may also propose"
    identity: opaque
    exclusive_operations:
      - "POST /voluntary-corrections/{id}/decision"
    shared_operations: ["POST /voluntary-corrections", "all GET endpoints"]

  - name: Auditor
    description: "Read-only external reviewer of the whole engagement"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
