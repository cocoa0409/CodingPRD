        claim_type: violation_to_error
        grounds: ["validations[priority=30]", "errors[ERR_NOT_TERMINABLE]"]
        distinguishing_aspect: "A fund holding units cannot terminate, and a pool with a non-TERMINATED fund cannot terminate — both ERR_NOT_TERMINABLE; the guards reference different child sets."
