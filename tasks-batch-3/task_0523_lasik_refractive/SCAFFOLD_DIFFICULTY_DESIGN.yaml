            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 500000, term_months: 1, apr_bps: 0 }
              as: Coordinator
            - call: "POST /refractive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/bookings"
              payload: { suite_id: "${suite_id}", surgeon_id: "${surg_id}", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T10:00:00Z", expected_case_version: "${case1_v}" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/consent"
              payload: { drops_regimen_started: true, signed_by_patient_id: "${pat1}" }
              as: Patient
              as_user_id: "${pat1}"
            - call: "POST /refractive/cases/${case1}/operate"
              payload: {}
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/heal"
              payload: { final_uncorrected_va: 0.5 }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 545, topography_k_max: 44.0, refractive_error_diopters: 1.5 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rescr: $.data.id }
            - call: "POST /refractive/screenings/${rescr}/submit"
              payload: {}
              as: Optometrist
