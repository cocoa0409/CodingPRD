      - name: setting_the_clock_to_its_current_value_is_rejected_and_one_second_later_is_accepted
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_CLOCK_MUST_ADVANCE]"
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: |
          The comparison is strict, so re-asserting the current instant is an error rather
          than a no-op. Because every deadline in this domain is computed from the logical
          clock, a clock that could be re-set to its own value (or backwards) would let a
          caller re-open a closed review window.
        test_recipe:
          setup:
            - "A plan exists and the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err_same: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T23:59:59Z" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err_backwards: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cur: "$.data.current_utc", prev: "$.data.previous_utc" }
          assert:
            - "Re-asserting the same instant: HTTP 422 with data.error_id == \"ERR_CLOCK_MUST_ADVANCE\"."
            - "Moving backwards: HTTP 422 with data.error_id == \"ERR_CLOCK_MUST_ADVANCE\"."
            - "One second forward: HTTP 200 with cur == \"2026-08-01T00:00:01Z\" and prev == \"2026-08-01T00:00:00Z\"."

