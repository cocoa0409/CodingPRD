              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Fin", email: "fin@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/caregivers/${cg_id}/availability"
              payload: { availability_status: "AVAILABLE" }
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "P1", care_type: "ONE_TIME", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp1: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp1}", agreed_rate_cents: 2000, scheduled_start: "2026-04-01T08:00:00Z", scheduled_end: "2026-04-01T14:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk1: $.data.id }
            - call: "POST /marketplace/bookings/${bk1}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-04-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/sessions"
              payload: { booking_id: "${bk1}" }
              as: PlatformAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /marketplace/sessions/${s1}/clock-in"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-04-01T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sessions/${s1}/clock-out"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/job-postings"
