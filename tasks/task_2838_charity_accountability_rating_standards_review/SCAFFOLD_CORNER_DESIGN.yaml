          - entities.DimensionScore.fields.normalized_score
          - calculations.dimension_raw_points
          - calculations.composite_score_with_penalty
        distinguishing_aspect: |
          weight_applied and weighted_contribution are computed fields that
          mirror the FINAL variant only, so an excluded dimension stores
          0.0000 / 0.00 even though the provisional arithmetic counted it at its
          declared weight. Proving that requires a fixture where the two
          variants disagree, which is a depth claim rather than a breadth one.
        excluded_because:
          difficulty_instance: provisional_vs_final_composite_diverge_on_zero_completeness_impact
          rationale: |
            That difficulty instance already asserts weight_applied 0.4706 /
            0.2941 / 0.2353 on the three surviving rows and 0.0000 with
            weighted_contribution 0.00 on the excluded IMPACT row, against
            weighted_sum_provisional 70.88 which still charged IMPACT at 0.15.
            A separate breadth instance would restate the same fixture with a
            weaker assertion.
