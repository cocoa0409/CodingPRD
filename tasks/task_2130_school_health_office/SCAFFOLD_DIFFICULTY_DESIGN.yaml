              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "INJURY", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id, triage_first: $.data.triage_score }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Scraped knee, cleaned and dressed" }
