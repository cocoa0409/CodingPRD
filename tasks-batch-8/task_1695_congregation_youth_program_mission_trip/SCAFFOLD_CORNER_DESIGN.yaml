            - { call: "POST /youth-ministry/registrations/${reg}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfc: $.data.id} }
