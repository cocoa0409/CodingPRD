            - "Patient.${pt_id}.vacation_exceptions_used_this_year is still 0 — a refused decision consumes no allowance"
            - "APPROVE_PAYER_OVERRIDE on the same request returns the same error id, even though the plan sets allows_payer_vacation_override true"
            - "discontinuing ${rx_ctrl} first would let the identical decide call succeed, since priority 19 reads only ACTIVE prescriptions"

