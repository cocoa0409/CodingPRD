              captures: { r_fin: $.data.final_royalty_cents }
            - call: "GET /licensing/license-agreements/${ag_id}"
              as: LicensingAnalyst
              captures: { ag_cum: $.data.cumulative_accepted_base_cents, ag_pool: $.data.undistributed_pool_cents, ag_rec: $.data.cumulative_recognized_revenue_cents }
          assert:
            - "captured r_fin == 5000 (visible in the accept response itself)"
            - "captured ag_cum == 100000, ag_rec == 5000, ag_pool == 5000 (all updated immediately)"
