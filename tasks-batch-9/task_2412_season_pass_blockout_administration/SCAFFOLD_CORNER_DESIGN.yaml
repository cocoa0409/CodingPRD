              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_oct}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { res_oct: "$.data.id" }
            - call: "POST /pass-programs/${prog}/billing-runs"
              payload: { as_of_date: "2026-10-02" }
              as: ProgramAdmin
          trigger:
            - call: "POST /pass-programs/${prog}/billing-runs"
              payload: { as_of_date: "2026-11-02" }
              as: ProgramAdmin
          assert:
            - "the setup run at 2026-10-02 returned missed_installment_count 2, delinquent_pass_count 1, defaulted_pass_count 0, suspended_pass_count 1, no_show_reservation_count 1, released_reservation_count 1"
            - "after the setup run: GET /reservations/${res_sep} → data.status == 'NO_SHOW' (its day is before as_of_date) and GET /reservations/${res_oct} → data.status == 'CANCELLED_BY_SUSPENSION'"
            - "trigger response data.missed_installment_count == 1 (only the 2026-11-01 row), data.defaulted_pass_count == 1, data.suspended_pass_count == 0"
            - "GET /installments?payment_plan_id=${plan_a} → data[0].status == 'MISSED', data[1].status == 'MISSED', data[2].status == 'MISSED', data[3].status == 'SCHEDULED' (due 2026-12-01 is still future)"
            - "GET /payment-plans/${plan_a} → data.missed_count == 3 and data.settled_count == 0"
            - "GET /season-passes/${pass_a} → data.billing_status == 'DEFAULTED', data.pass_status == 'SUSPENDED', data.suspension_count == 1"
            - "GET /park-days/${day_sep} → data.no_show_count == 1 and data.reserved_count == 0; GET /park-days/${day_oct} → data.released_count == 1 and data.reserved_count == 0"

      - name: payment_plan_amortization_correct_result
        claim_type: correct_result
        grounds:
          - calculations.payment_plan_amortization
        excluded_because:
          difficulty_instance: combinatorial_formula / plan_amortization_residual_on_final_installment
          rationale: "Known inputs (30000 / 6000 / 7) to expected outputs (25500, 3643 x 6, 3642) are asserted there with the sum invariant."

      - name: payment_plan_amortization_precision
        claim_type: precision
        grounds:
          - calculations.payment_plan_amortization
        excluded_because:
          difficulty_instance: boundary_precision_check / plan_installment_rounds_half_up_at_exact_half_cent
          rationale: "The round_half_up-at-exactly-.5 case and the residual that absorbs it are asserted there."

      - name: upgrade_settlement_total_correct_result
        claim_type: correct_result
        grounds:
          - calculations.upgrade_settlement_total
        excluded_because:
          difficulty_instance: combinatorial_formula / upgrade_settlement_order_credit_cap_then_fee_tier
          rationale: "The full six-step worked example, including that permuting steps 3 and 5 changes the fee, is asserted there."

      - name: upgrade_credit_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.upgrade_credit
        excluded_because:
          difficulty_instance: dual_variant_calc / upgrade_credit_paid_to_date_vs_prorated_diverge
          rationale: "Same data, both variants, and the 750-cent delta between the resulting totals are asserted there."

      - name: pass_sharing_risk_score_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.pass_sharing_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / sharing_risk_gate_cluster_vs_rolling_window_diverge
          rationale: "The 65-versus-35 divergence on identical visit history, and the auto-open that follows only the GATE_CLUSTER variant, are asserted there."

      - name: park_day_capacity_posture_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.park_day_capacity_posture
        excluded_because:
          difficulty_instance: boundary_precision_check / park_day_peak_threshold_at_exactly_85_percent
          rationale: "threshold-minus-epsilon, exactly-threshold and the move back down are asserted there on the same day."

      - name: program_revenue_analysis_forfeit_set_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.program_revenue_analysis
        excluded_because:
          difficulty_instance: transitive_cascade / substantiated_sharing_case_revokes_pass_terminates_plan_forfeits_revenue
          rationale: "The REVOKED pass leaving the REVENUE SET for the FORFEIT SET (base 0, forfeited 5625) is asserted there."

  # ===========================================================================
  # Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: role_check_at_priority_three_precedes_schema_check_at_priority_four
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - endpoints[POST /pass-programs]
        distinguishing_aspect: "A GateAgent posting a program with an unknown field and a missing required field violates both rule 3 and rule 4; the response must be the 403 from the lower priority number, never the 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /pass-programs"
              payload: { park_name: "Summit Ridge", mascot: "Otter" }
              as: GateAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED', not 400 ERR_INVALID_REQUEST"
            - "the same body sent as ProgramAdmin returns 400 with data.error_id == 'ERR_INVALID_REQUEST' (rule 4 is reached only once rule 3 passes)"
            - "GET /pass-programs → data.total_count == 0"

      - name: list_endpoint_limit_above_one_hundred_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[GET /park-days]
        distinguishing_aspect: "Pagination bounds are enforced at priority 5 on list endpoints: limit 101, limit 0 and offset -1 are each 400, while limit 100 is accepted, so the maximum is an inclusive bound."
        test_recipe:
          setup:
            - "One program with a single park day."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-01", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
          trigger:
            - call: "GET /park-days?limit=101"
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /park-days?limit=0 and GET /park-days?offset=-1 each return 400 ERR_INVALID_REQUEST"
            - "GET /park-days?limit=100 returns 200 with data.limit == 100 and data.total_count == 1"
            - "GET /park-days?day_class=SUNNY returns 400 ERR_INVALID_REQUEST (filter value outside its enum)"

      - name: reservation_for_a_past_park_day_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=72]
          - errors[ERR_PARK_DAY_IN_PAST]
          - endpoints[POST /reservations]
        distinguishing_aspect: "The past-date guard compares ParkDay.calendar_date against the logical clock's calendar date, so the very same day that was reservable at 2026-08-01 is refused once the clock passes it, and the same-day case (calendar_date == today) is still allowed."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE and two STANDARD park days 2026-09-10 and 2026-09-20."
            - "A processed ACTIVE BRONZE pass bought PAY_IN_FULL."
            - "Logical clock moved to 2026-09-20T08:00:00Z."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-10", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_early: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-20", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_today: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_early}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == 'ERR_PARK_DAY_IN_PAST'"
            - "GET /park-days/${day_early} → data.reserved_count == 0 and data.grant_count == 0"
            - "the same call against ${day_today} (calendar_date == the clock's date) returns 201 with data.status == 'CONFIRMED'"

      - name: reservation_with_empty_arrival_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=73]
          - errors[ERR_ARRIVAL_WINDOW_INVALID]
          - endpoints[POST /reservations]
        distinguishing_aspect: "The window is half-open, so it must be non-empty: end == start is refused just as end < start is, while a one-minute window [10:00, 10:01) is accepted."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE, one STANDARD park day 2026-09-15, and a processed ACTIVE BRONZE pass bought PAY_IN_FULL."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-15", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_915: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${day_915}", arrival_window_start: "11:00", arrival_window_end: "11:00" }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == 'ERR_ARRIVAL_WINDOW_INVALID'"
            - "the same call with arrival_window_end '10:00' (earlier than the start) also returns ERR_ARRIVAL_WINDOW_INVALID"
            - "the same call with arrival_window_start '10:00' and arrival_window_end '10:01' returns 201 with data.status == 'CONFIRMED'"
            - "GET /park-days/${day_915} → data.reserved_count == 1 after the accepted call (the two refused calls left no trace)"

      - name: peak_day_reservation_quota_is_an_aggregate_across_days
        claim_type: aggregate_validation
        grounds:
          - validations[priority=92]
          - entities.PassTier.fields.peak_reservation_quota
          - errors[ERR_RESERVATION_QUOTA_EXCEEDED]
          - endpoints[POST /reservations]
        distinguishing_aspect: "Each of the three reservations is individually legal — three different PEAK days, each with four free slots — but BRONZE's peak_reservation_quota of 2 counts CONFIRMED reservations across the whole calendar, so only the third call fails."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE (peak_reservation_quota 2)."
            - "Three PEAK park days 2026-09-10, 2026-09-11 and 2026-09-12, each capacity_total 40 / forecast 36 → 0.9000 PEAK, reservation_slot_capacity 4, window_slot_capacity 2."
            - "A processed ACTIVE BRONZE pass bought PAY_IN_FULL already holding CONFIRMED reservations on the first two days."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-10", capacity_total: 40, forecast_attendance: 36 }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-11", capacity_total: 40, forecast_attendance: 36 }
              as: ProgramAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-12", capacity_total: 40, forecast_attendance: 36 }
              as: ProgramAdmin
              captures: { p3: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id" }
            - call: "POST /season-passes/${pass_a}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${p1}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { r1: "$.data.id" }
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${p2}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { r2: "$.data.id" }
          trigger:
            - call: "POST /reservations"
              payload: { season_pass_id: "${pass_a}", park_day_id: "${p3}", arrival_window_start: "09:00", arrival_window_end: "12:00" }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == 'ERR_RESERVATION_QUOTA_EXCEEDED' (not ERR_PARK_DAY_CAPACITY_FULL: priority 92 is reached first and the day had 4 free slots)"
            - "GET /park-days/${p3} → data.reserved_count == 0, data.remaining_slot_count == 4, data.grant_count == 0"
            - "after POST /reservations/${r1}/cancel the same third call returns 201 (the quota counts only CONFIRMED rows)"

      - name: visit_reservation_requirement_applies_only_when_the_tier_flag_is_set
        claim_type: conditional_validation
        grounds:
          - validations[priority=93]
          - entities.PassTier.fields.reservation_required_on_peak
          - errors[ERR_RESERVATION_REQUIRED]
          - endpoints[POST /visits]
        distinguishing_aspect: "On one and the same PEAK day the rule fires for the BRONZE holder (reservation_required_on_peak true, no reservation) and stays silent for the GOLD holder (flag false), so the guard is keyed on the entering pass's tier configuration and not on the day."
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED BRONZE (flag true) and GOLD (flag false)."
            - "PEAK park day 2026-09-15 (capacity_total 40, forecast_attendance 36 → 0.9000)."
            - "Two holders, each with a processed ACTIVE pass bought PAY_IN_FULL: one BRONZE, one GOLD. Neither holds a reservation."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /pass-tiers/${gold}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-09-15", capacity_total: 40, forecast_attendance: 36 }
              as: ProgramAdmin
              captures: { day_915: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ben Holder", email: "ben@example.com", date_of_birth: "1988-06-11" }
              as: PassOfficeClerk
              captures: { holder_b: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_bronze: "$.data.id" }
            - call: "POST /season-passes/${pass_bronze}/process"
              payload: { photo_hash: "sha256:aaa", government_id_last4: "1234" }
              as: PassOfficeClerk
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${gold}", passholder_id: "${holder_b}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_gold: "$.data.id" }
            - call: "POST /season-passes/${pass_gold}/process"
              payload: { photo_hash: "sha256:bbb", government_id_last4: "5678" }
              as: PassOfficeClerk
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SEASON_ACTIVE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_bronze}", park_day_id: "${day_915}", entry_at: "2026-09-15T10:00:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { err: "$.data.error_id" }
            - call: "POST /visits"
              payload: { season_pass_id: "${pass_gold}", park_day_id: "${day_915}", entry_at: "2026-09-15T10:05:00Z", gate_code: "NORTH", photo_match: "MATCH" }
              as: GateAgent
              captures: { visit_gold: "$.data.id" }
          assert:
            - "first trigger: HTTP 422 with data.error_id == 'ERR_RESERVATION_REQUIRED'"
            - "second trigger: HTTP 201 with data.status == 'OPEN' and data.reservation_id == null"
            - "GET /season-passes/${pass_bronze} → data.visit_count == 0; GET /season-passes/${pass_gold} → data.visit_count == 1"
            - "GET /park-days/${day_915} → data.redeemed_count == 0 (an unreserved entry redeems nothing)"
            - "GET /passholders/${holder_b} → data.sharing_risk_score == 0 (GATE_CLUSTER on a PEAK day: 40 * (1 - 1) + 25 * 0)"

      - name: second_live_pass_for_the_same_passholder_in_one_program_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=81]
          - errors[ERR_DUPLICATE_ACTIVE_PASS]
          - endpoints[POST /season-passes]
        distinguishing_aspect: "The uniqueness scope is (passholder, program, live pass_status): a second BRONZE sale to the same holder in the same program is refused, but the same holder may buy in a different program, and the refusal is by status set rather than by tier."
        test_recipe:
          setup:
            - "Program A in SALES_OPEN with PUBLISHED BRONZE and GOLD; program B in SALES_OPEN with its own PUBLISHED tier."
            - "One holder already owning a PENDING_PROCESSING BRONZE pass in program A."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog_a: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog_a}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
