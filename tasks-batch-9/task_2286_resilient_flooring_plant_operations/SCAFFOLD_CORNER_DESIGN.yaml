            - "${wc1_after_arm1} == TRIAGE — the join does NOT fire after one arm; ${wc1_mat} == DEFECT_CONFIRMED and ${wc1_field_null} == null"
            - "${wc1_after_arm2} == ADJUDICATION_READY — the join fires exactly when the last required arm is answered"
            - "${wc1_final} == APPROVED, ${wc1_variant} == STEPPED_SCHEDULE, ${wc1_months} == 36, replacement_value_cents == 53550 (25.50 * 2100), labor_allowance_cents == 0 and ${wc1_amount} == 42840 (elapsed_years 3 -> the 80% step)"
            - "a second claim on the same batch with claim_type DIMENSIONAL_MOVEMENT gets required_reviews == [FIELD] and reaches ADJUDICATION_READY after a single review call — the fork width follows claim_type"

