scenario: |
  P2P Small Business Lending (Funding Circle style): borrower scoring (Plaid data feed),
  tiered interest rates, investor portfolio diversification, default/Charge-off,
  repayment allocation, SEC compliance disclosure.

  A peer-to-peer marketplace for small business loans. Borrowers connect a Plaid
  data feed, receive a tiered risk grade and interest rate, post a LoanListing
  that accredited investors fund in fractional Investments. Once fully funded
  the listing originates into a Loan with a monthly Installment schedule.
  Borrower Payments are allocated waterfall-style (fees → interest → principal
  → late fees) and distributed pro-rata to investors. Delinquency cascades into
  Default and Charge-Off, with investor losses booked. Every public-facing
  state transition emits a SEC Regulation Crowdfunding disclosure record that
  cannot be edited after publication; the platform's portfolio-diversification
  rule caps any one investor's exposure to any one borrower.

domain_name: p2p-business-lending
api_prefix: /platforms

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation       # provisional vs final risk grade; forward-looking vs chronological loss
    - cascading_side_effects         # default → charge-off → investor loss + disclosure
    - rate_threshold_triggers        # DTI / grade / delinquency thresholds
    - waterfall_allocation           # repayment allocation order
    - compliance_audit_trail         # SEC disclosure append-only log

  entity_topology: hybrid
  state_machine_shape: branching       # listing fork: FUNDED vs WITHDRAWN; loan: CURRENT/DELINQUENT/DEFAULT/CHARGED_OFF
  relationship_patterns:
    - one_to_many                      # Platform → Borrowers; Listing → Investments
    - many_to_many                     # Investors ↔ Loans via Investment
    - cross_aggregate                  # Disclosure references any entity
  role_model: segregation_of_duties    # ComplianceOfficer cannot originate loans; Borrower cannot self-invest
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Platform
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Platform display name" }
      - { name: currency, type: string, source: input, default: "USD", description: "Single ISO-4217 currency for the platform" }
      - { name: clock_day_index, type: integer, source: system, default: 0, description: "Deterministic test clock; increments only via POST /platforms/{id}/advance_clock" }
      - { name: origination_fee_bps, type: integer, source: input, default: 300, description: "Origination fee in basis points charged on loan principal at FUNDED→ACTIVE" }
      - { name: servicing_fee_bps, type: integer, source: input, default: 100, description: "Annual servicing fee bps deducted from each interest distribution" }
      - { name: late_fee_cents, type: integer, source: input, default: 2500, description: "Flat late fee per delinquent installment" }
      - { name: max_borrower_concentration_bps, type: integer, source: input, default: 1000, description: "Investor diversification cap: an investor's pledges to one borrower cannot exceed this fraction of their committed capital (bps of 10000)" }

  - name: Borrower
    parent: Platform
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: system, description: "Parent platform id" }
      - { name: legal_name, type: string, source: input, description: "Small-business legal name" }
      - { name: ein, type: string, source: input, description: "Employer Identification Number, unique per platform" }
      - { name: annual_revenue_cents, type: integer, source: input, description: "Self-reported annual revenue (input to provisional grade)" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested loan principal (used to bound DTI on next listing)" }
      - { name: plaid_snapshot_id, type: string, source: system, default: null, description: "Most recent PlaidSnapshot id used in final grading; null until first snapshot" }
      - { name: provisional_grade, type: enum, source: computed, description: "A | B | C | D | E — computed from self-reported revenue alone" }
      - { name: final_grade, type: enum, source: computed, description: "A | B | C | D | E | UNGRADED — computed from Plaid snapshot once attached" }
      - { name: status, type: enum, source: system, description: "PENDING_KYC | APPROVED | SUSPENDED | BANNED" }
    constraints: "ein unique per platform; status BANNED is terminal"

  - name: PlaidSnapshot
    parent: Borrower
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Immutable snapshot id (UUID)" }
      - { name: created_at, type: datetime, source: system, description: "Snapshot creation time (ISO 8601 UTC)" }
      - { name: borrower_id, type: string, source: system, description: "Owning Borrower id" }
      - { name: pulled_on_day_index, type: integer, source: system, description: "Platform.clock_day_index at the time of pull" }
      - { name: deposits_last_90d_cents, type: integer, source: input, description: "Sum of inbound deposits over the last 90 days as reported by Plaid" }
      - { name: avg_daily_balance_cents, type: integer, source: input, description: "Average daily balance over the snapshot window" }
      - { name: nsf_count_last_90d, type: integer, source: input, description: "Count of NSF events in the last 90 days" }
      - { name: existing_debt_service_cents, type: integer, source: input, description: "Monthly debt service from connected accounts" }

  - name: LoanListing
    parent: Borrower
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: system, description: "Owning Borrower id" }
      - { name: platform_id, type: string, source: system, description: "Parent platform id" }
      - { name: principal_cents, type: integer, source: input, description: "Requested principal in cents (positive integer)" }
      - { name: term_months, type: integer, source: input, description: "Loan term in months (12, 24, 36, 48, or 60)" }
      - { name: grade_at_listing, type: enum, source: computed, description: "Snapshot of borrower's final_grade at OPEN; locks until WITHDRAWN" }
      - { name: interest_rate_bps, type: integer, source: computed, description: "Locked annual interest rate in bps, derived from grade and term" }
      - { name: pledged_cents, type: integer, source: computed, default: 0, description: "Sum of Investment.amount_cents in COMMITTED or higher state" }
      - { name: funding_deadline_day_index, type: integer, source: system, description: "= Platform.clock_day_index at OPEN + 14" }
      - { name: status, type: enum, source: system, description: "OPEN | FUNDED | ORIGINATED | WITHDRAWN | EXPIRED" }
    constraints: "Only one OPEN or FUNDED listing per borrower at a time"

  - name: Investor
    parent: Platform
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: system, description: "Parent platform id" }
      - { name: display_name, type: string, source: input, description: "Investor display name" }
      - { name: accreditation_status, type: enum, source: input, description: "ACCREDITED | NON_ACCREDITED" }
      - { name: committed_capital_cents, type: integer, source: input, description: "Self-declared committed capital; baseline for diversification cap" }
      - { name: cash_balance_cents, type: integer, source: computed, default: 0, description: "Uncommitted cash available for new Investments" }
      - { name: outstanding_principal_cents, type: integer, source: computed, default: 0, description: "Sum of unpaid principal across active loans" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Investment
    parent: LoanListing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "LoanListing id" }
      - { name: investor_id, type: string, source: system, description: "Investor id" }
      - { name: amount_cents, type: integer, source: input, description: "Pledged amount; must be >= 2500 cents and a multiple of 100" }
      - { name: status, type: enum, source: system, description: "COMMITTED | RELEASED | CONVERTED | LOST" }
      - { name: share_bps, type: integer, source: computed, default: 0, description: "= round((amount_cents * 10000) / Loan.principal_cents) once CONVERTED; 0 otherwise" }
    constraints: "An Investor cannot invest in their own borrower (same platform); diversification cap enforced at create"

  - name: Loan
    parent: LoanListing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "Source LoanListing id" }
      - { name: borrower_id, type: string, source: system, description: "Owning Borrower id" }
      - { name: platform_id, type: string, source: system, description: "Parent platform id" }
      - { name: principal_cents, type: integer, source: system, description: "= LoanListing.principal_cents at origination" }
      - { name: interest_rate_bps, type: integer, source: system, description: "= LoanListing.interest_rate_bps at origination" }
      - { name: term_months, type: integer, source: system, description: "= LoanListing.term_months at origination" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Standard amortized payment; rounded half-up to cents" }
      - { name: principal_outstanding_cents, type: integer, source: computed, description: "Remaining principal; decreases as Payments allocate" }
      - { name: accrued_late_fees_cents, type: integer, source: computed, default: 0, description: "Uncollected late fees" }
      - { name: charged_off_loss_cents, type: integer, source: computed, default: 0, description: "Loss booked at CHARGED_OFF; 0 prior" }
      - { name: consecutive_missed_installments, type: integer, source: computed, default: 0, description: "Running count reset on a fully-curing Payment" }
      - { name: origination_day_index, type: integer, source: system, description: "Platform.clock_day_index at FUNDED→ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DELINQUENT | DEFAULT | CHARGED_OFF | PAID_OFF" }

  - name: Installment
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "Owning Loan id" }
      - { name: sequence_number, type: integer, source: system, description: "1-indexed installment ordinal" }
      - { name: due_day_index, type: integer, source: system, description: "Loan.origination_day_index + sequence_number * 30" }
      - { name: scheduled_principal_cents, type: integer, source: system, description: "Principal portion of the amortized payment" }
      - { name: scheduled_interest_cents, type: integer, source: system, description: "Interest portion of the amortized payment" }
      - { name: paid_principal_cents, type: integer, source: computed, default: 0, description: "Cumulative principal received against this installment" }
      - { name: paid_interest_cents, type: integer, source: computed, default: 0, description: "Cumulative interest received against this installment" }
      - { name: paid_fees_cents, type: integer, source: computed, default: 0, description: "Cumulative late fees and servicing fees received" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DUE | PAID | LATE | WAIVED" }

  - name: Payment
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "Owning Loan id" }
      - { name: borrower_id, type: string, source: system, description: "Owning Borrower id" }
      - { name: amount_cents, type: integer, source: input, description: "Total payment amount (positive integer cents)" }
      - { name: received_on_day_index, type: integer, source: system, description: "Platform.clock_day_index at create" }
      - { name: allocation, type: object, source: computed, description: "Breakdown { fees_cents, interest_cents, principal_cents, late_fees_cents, unallocated_cents }" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED" }

  - name: Disclosure
    parent: Platform
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Immutable disclosure id" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: platform_id, type: string, source: system, description: "Parent platform id" }
      - { name: subject_type, type: enum, source: system, description: "BORROWER | LISTING | LOAN | INVESTMENT" }
      - { name: subject_id, type: string, source: system, description: "Foreign key to referenced subject entity" }
      - { name: kind, type: enum, source: system, description: "LISTING_OPENED | LISTING_FUNDED | LOAN_ORIGINATED | DELINQUENCY_NOTICE | DEFAULT_NOTICE | CHARGE_OFF_NOTICE | MATERIAL_AMENDMENT" }
      - { name: payload, type: object, source: system, description: "Snapshot of disclosed fields at emission; immutable" }
      - { name: published, type: boolean, source: system, default: false, description: "False = DRAFT, True = PUBLISHED (terminal)" }
      - { name: published_on_day_index, type: integer, source: system, default: null, description: "Set when published transitions to true" }

  - name: ComplianceOfficer
    parent: Platform
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: system, description: "Parent platform id" }
      - { name: display_name, type: string, source: input, description: "Officer display name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Borrower
    initial_state: PENDING_KYC
    terminal_states: [BANNED]
    transitions:
      - from: PENDING_KYC
        to: APPROVED
        trigger: POST /platforms/{platformId}/borrowers/{borrowerId}/approve
        actor: ComplianceOfficer
        preconditions:
          - "Borrower must have at least one PlaidSnapshot attached (ERR_NO_PLAID_SNAPSHOT)"
          - "final_grade must not be UNGRADED (ERR_BORROWER_UNGRADED)"
        side_effects:
          - "Recompute final_grade from latest PlaidSnapshot"

      - from: APPROVED
        to: SUSPENDED
        trigger: POST /platforms/{platformId}/borrowers/{borrowerId}/suspend
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Any OPEN LoanListing of this borrower transitions to WITHDRAWN"
          - "Any Investment.status COMMITTED on those listings transitions to RELEASED; investor cash_balance_cents refunded"

      - from: SUSPENDED
        to: APPROVED
        trigger: POST /platforms/{platformId}/borrowers/{borrowerId}/reinstate
        actor: ComplianceOfficer
        preconditions:
          - "No Loan currently in CHARGED_OFF status owned by this borrower (ERR_BORROWER_HAS_LOSSES)"
        side_effects: []

      - from: APPROVED
        to: BANNED
        trigger: POST /platforms/{platformId}/borrowers/{borrowerId}/ban
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Cascade-WITHDRAW any OPEN listings (refund COMMITTED investments → cash_balance_cents)"

      - from: SUSPENDED
        to: BANNED
        trigger: POST /platforms/{platformId}/borrowers/{borrowerId}/ban
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: LoanListing
    initial_state: OPEN
    terminal_states: [ORIGINATED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OPEN
        to: FUNDED
        trigger: "system (on Investment create that brings pledged_cents == principal_cents)"
        actor: system
        preconditions:
          - "pledged_cents == principal_cents"
        side_effects:
          - "Emit Disclosure { kind: LISTING_FUNDED } in DRAFT"

      - from: FUNDED
        to: ORIGINATED
        trigger: POST /platforms/{platformId}/listings/{listingId}/originate
        actor: PlatformOperator
        preconditions:
          - "Borrower.status == APPROVED (ERR_BORROWER_NOT_APPROVED)"
          - "All Investment.status on this listing are COMMITTED (ERR_LISTING_INTEGRITY)"
        side_effects:
          - "Create Loan with principal_cents, interest_rate_bps, term_months copied from listing"
          - "Generate term_months Installments with due_day_index = origination_day_index + n*30"
          - "Compute monthly_payment_cents via amortization formula"
          - "Each Investment.status COMMITTED → CONVERTED; compute share_bps"
          - "Borrower receives net principal (principal_cents - origination_fee); investors' cash_balance_cents already debited at COMMITTED"
          - "Emit Disclosure { kind: LOAN_ORIGINATED } in DRAFT"

      - from: OPEN
        to: WITHDRAWN
        trigger: POST /platforms/{platformId}/listings/{listingId}/withdraw
        actor: Borrower | PlatformOperator
        preconditions: []
        side_effects:
          - "All Investment.status COMMITTED → RELEASED; investor cash_balance_cents refunded"

      - from: OPEN
        to: EXPIRED
        trigger: "system (during advance_clock if Platform.clock_day_index > funding_deadline_day_index AND pledged_cents < principal_cents)"
        actor: system
        preconditions:
          - "pledged_cents < principal_cents"
        side_effects:
          - "All Investment.status COMMITTED → RELEASED; investor cash_balance_cents refunded"

  - entity: Investment
    initial_state: COMMITTED
    terminal_states: [RELEASED, LOST]
    transitions:
      - from: COMMITTED
        to: RELEASED
        trigger: "system (LoanListing → WITHDRAWN or EXPIRED, or Borrower → SUSPENDED/BANNED)"
        actor: system
        preconditions: []
        side_effects:
          - "Investor.cash_balance_cents += amount_cents (refund)"

      - from: COMMITTED
        to: CONVERTED
        trigger: "system (LoanListing → ORIGINATED)"
        actor: system
        preconditions: []
        side_effects:
          - "share_bps = round((amount_cents * 10000) / Loan.principal_cents)"
          - "Investor.outstanding_principal_cents += amount_cents"

      - from: CONVERTED
        to: LOST
        trigger: "system (Loan → CHARGED_OFF)"
        actor: system
        preconditions: []
        side_effects:
          - "Investor.outstanding_principal_cents -= remaining_share_principal_cents"
    note: "RELEASED and LOST are terminal; CONVERTED may persist alongside an ACTIVE/DEFAULT loan."

  - entity: Loan
    initial_state: ACTIVE
    terminal_states: [CHARGED_OFF, PAID_OFF]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (during advance_clock when an Installment.due_day_index < clock_day_index AND its allocation has not satisfied scheduled_principal + scheduled_interest)"
        actor: system
        preconditions:
          - "consecutive_missed_installments transitions from 0 to >=1"
        side_effects:
          - "Affected Installment.status DUE → LATE"
          - "Loan.accrued_late_fees_cents += Platform.late_fee_cents per newly-LATE installment"
          - "Emit Disclosure { kind: DELINQUENCY_NOTICE } in DRAFT"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "system (on Payment.status POSTED that brings consecutive_missed_installments back to 0)"
        actor: system
        preconditions:
          - "All previously-LATE installments now PAID"
        side_effects: []

      - from: DELINQUENT
        to: DEFAULT
        trigger: "system (during advance_clock when consecutive_missed_installments >= 3)"
        actor: system
        preconditions:
          - "consecutive_missed_installments >= 3"
        side_effects:
          - "Emit Disclosure { kind: DEFAULT_NOTICE } in DRAFT"

      - from: DEFAULT
        to: CHARGED_OFF
        trigger: "system (during advance_clock when consecutive_missed_installments >= 5)"
        actor: system
        preconditions:
          - "consecutive_missed_installments >= 5"
        side_effects:
          - "charged_off_loss_cents = principal_outstanding_cents + accrued_late_fees_cents"
          - "principal_outstanding_cents → 0"
          - "Each CONVERTED Investment on this loan: status → LOST; Investor.outstanding_principal_cents decremented by that investor's share of charged_off_loss_cents"
          - "Remaining Installments transition to WAIVED"
          - "Emit Disclosure { kind: CHARGE_OFF_NOTICE } in DRAFT"

      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (on Payment that drives principal_outstanding_cents to 0 AND all Installments PAID or WAIVED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DELINQUENT
        to: PAID_OFF
        trigger: "system (Payment satisfies all overdue + remaining principal)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system (advance_clock crosses due_day_index)"
        actor: system
        preconditions:
          - "Platform.clock_day_index >= due_day_index AND Installment unpaid"
        side_effects: []

      - from: DUE
        to: LATE
        trigger: "system (advance_clock when Platform.clock_day_index > due_day_index + 5 grace days AND not fully paid)"
        actor: system
        preconditions:
          - "Platform.clock_day_index > due_day_index + 5"
        side_effects:
          - "Loan.accrued_late_fees_cents += Platform.late_fee_cents"
          - "Loan.consecutive_missed_installments += 1 (this is the trigger for Loan ACTIVE→DELINQUENT)"

      - from: DUE
        to: PAID
        trigger: "system (Payment allocation closes paid_principal + paid_interest >= scheduled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LATE
        to: PAID
        trigger: "system (Payment allocation closes scheduled_principal + scheduled_interest + accrued_late_fee)"
        actor: system
        preconditions: []
        side_effects:
          - "If this was the oldest LATE installment and no LATE installments remain: Loan.consecutive_missed_installments = 0"

      - from: LATE
        to: WAIVED
        trigger: "system (Loan → CHARGED_OFF)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DUE
        to: WAIVED
        trigger: "system (Loan → CHARGED_OFF)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: WAIVED
        trigger: "system (Loan → CHARGED_OFF)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Disclosure
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /platforms/{platformId}/disclosures/{disclosureId}/publish
        actor: ComplianceOfficer
        preconditions:
          - "Caller role MUST be ComplianceOfficer (segregation of duties: PlatformOperator cannot publish their own disclosure)"
          - "Disclosure.payload is non-empty"
        side_effects:
          - "published = true; published_on_day_index = Platform.clock_day_index"
          - "Immutable after this point (any field change → ERR_DISCLOSURE_LOCKED)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two investors invest in the same listing simultaneously, both bringing pledged_cents == principal_cents"
    guarantee: "Exactly one Investment succeeds in driving the listing to FUNDED; the other is rejected because the remaining capacity is zero"
    error_id: ERR_LISTING_OVERSUBSCRIBED
    http_status: 409
    serialization: "First-writer-wins on LoanListing.pledged_cents; the loser's amount would exceed principal_cents - pledged_cents"

  - scenario: "Borrower withdraws a listing at the same instant a final Investment fully funds it"
    guarantee: "Exactly one operation wins; loser receives ERR_INVALID_STATE_TRANSITION"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    serialization: "First-writer-wins on LoanListing.status; once status leaves OPEN, the loser sees the wrong from-state"

  - scenario: "Two ComplianceOfficer users publish the same DRAFT Disclosure concurrently"
    guarantee: "At most one publish succeeds; second sees the disclosure already PUBLISHED"
    error_id: ERR_DISCLOSURE_LOCKED
    http_status: 409
    serialization: "First-writer-wins on Disclosure.published"

  - scenario: "Borrower posts a Payment at the same moment a system advance_clock charges off the loan"
    guarantee: "Payment is rejected against a CHARGED_OFF loan; the clock advance wins"
    error_id: ERR_LOAN_NOT_PAYABLE
    http_status: 409
    serialization: "Last-status-wins on Loan.status; clock-driven CHARGED_OFF freezes the loan ledger"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: borrower_provisional_grade
    trigger: "Borrower create (POST /platforms/{platformId}/borrowers)"
    algorithm: weighted_scoring
    formula: |
      score_self =  0.6 * normalize(annual_revenue_cents, [50_000_00 .. 5_000_000_00])
                  + 0.4 * (1 - normalize(requested_amount_cents, [10_000_00 .. 500_000_00]))
      # normalize clamps to [0, 1]
      if score_self >= 0.80: 'A'
      elif score_self >= 0.65: 'B'
      elif score_self >= 0.50: 'C'
      elif score_self >= 0.35: 'D'
      else: 'E'
    input_set: "Borrower's self-reported fields only (no PlaidSnapshot)"
    precision: "score rounded to 4 decimals, round_half_up; band thresholds use '>=' (inclusive lower bound)"

  - name: borrower_final_grade
    trigger: "PlaidSnapshot attach (POST /platforms/{platformId}/borrowers/{borrowerId}/plaid_snapshots) and on Borrower approve"
    algorithm: weighted_scoring
    formula: |
      # Uses the borrower's LATEST PlaidSnapshot
      cashflow      = clamp(deposits_last_90d_cents / 90, 0, 100_000_00)
      reserves      = clamp(avg_daily_balance_cents,      0, 250_000_00)
      nsf_penalty   = clamp(nsf_count_last_90d * 0.10,    0, 0.50)
      dti           = (existing_debt_service_cents * 12) / max(annual_revenue_cents, 1)
      # DTI is computed against self-reported revenue — this is the dual-variant divergence point
      score_plaid = 0.35 * (cashflow      / 100_000_00)
                  + 0.30 * (reserves      / 250_000_00)
                  + 0.25 * (1 - clamp(dti, 0, 1))
                  + 0.10 * (1 - nsf_penalty)
      if score_plaid >= 0.80: 'A'
      elif score_plaid >= 0.65: 'B'
      elif score_plaid >= 0.50: 'C'
      elif score_plaid >= 0.35: 'D'
      else: 'E'
    input_set: "Latest PlaidSnapshot for the borrower; if none exists, final_grade is UNGRADED"
    precision: "score rounded to 4 decimals, round_half_up; band thresholds use '>=' (inclusive lower bound)"
    variants:
      - name: provisional_vs_final_divergence
        when: "Same borrower with self-reported revenue $1,000,000 but Plaid-pulled cashflow ~$5,000/month"
        difference: "Provisional yields 'A' (revenue is large), final yields 'D' or 'E' (cashflow is low) — listing's grade_at_listing is locked from final_grade"

  - name: tiered_interest_rate
    trigger: "LoanListing create (POST /platforms/{platformId}/borrowers/{borrowerId}/listings)"
    algorithm: tiered_pricing
    formula: |
      base_bps = { 'A': 600, 'B': 900, 'C': 1300, 'D': 1800, 'E': 2400 }[grade_at_listing]
      term_premium_bps = max(0, (term_months - 24)) * 10
      # 10 bps per month over 24 months
      interest_rate_bps = base_bps + term_premium_bps
    constants:
      BASE_BPS_TABLE: { A: 600, B: 900, C: 1300, D: 1800, E: 2400 }
      TERM_PREMIUM_BPS_PER_MONTH_OVER_24: 10
    precision: "interest_rate_bps is an integer (no rounding needed since inputs are integers)"

  - name: monthly_amortized_payment
    trigger: "Loan creation (LoanListing FUNDED → ORIGINATED)"
    algorithm: forward_looking
    formula: |
      r = interest_rate_bps / 10000 / 12   # monthly rate
      n = term_months
      P = principal_cents
      if r == 0:
        monthly_payment_cents = round_half_up(P / n)
      else:
        monthly_payment_cents = round_half_up(P * r * (1+r)**n / ((1+r)**n - 1))
      # The LAST installment absorbs any residual cents from rounding (true-up)
      scheduled_principal_cents[k] = round_half_up(P_remaining * r ...) ; computed per-installment via standard amortization schedule;
      sum(scheduled_principal_cents) MUST equal principal_cents exactly.
    precision: "Round each installment principal/interest half-up to cents; last installment carries residual ±cents so sum matches principal exactly"

  - name: payment_waterfall_allocation
    trigger: "Payment create (POST /platforms/{platformId}/loans/{loanId}/payments)"
    algorithm: waterfall_allocation
    formula: |
      remaining = amount_cents
      # Step 1: servicing fee = round_half_up(scheduled_interest_due * servicing_fee_bps / 10000) — taken from interest portion before distribution
      # Step 2: late fees on currently-LATE installments (oldest first)
      # Step 3: scheduled interest on overdue installments (oldest first), then current
      # Step 4: scheduled principal on overdue installments (oldest first), then current
      # Step 5: prepayment principal on next upcoming installment (no penalty)
      # If a step's bucket exceeds remaining, allocate min(bucket, remaining) and stop.
      # Allocation order is PINNED — fees → interest → principal → late_fees? No: late_fees come BEFORE scheduled interest.
      # FINAL ORDER (pinned): servicing_fee → late_fees → scheduled_interest → scheduled_principal → prepayment_principal → unallocated
    input_set: "Loan's LATE installments first (oldest sequence_number), then DUE, then SCHEDULED for prepayment"
    constants:
      ROUNDING: "round_half_up to integer cents at each bucket"
    precision: "Each bucket allocation rounded to cents at the time it is applied; remaining carries forward exactly"
    variants:
      - name: oldest_first_vs_proportional
        when: "Payment amount is less than total overdue interest across two LATE installments"
        difference: "OLDEST-FIRST (pinned): full interest on the oldest LATE installment, partial on the next. Proportional split would produce different paid_interest_cents per installment; the scaffold pins oldest-first."

  - name: investor_diversification_check
    trigger: "Investment create (POST /platforms/{platformId}/listings/{listingId}/investments)"
    algorithm: aggregation
    formula: |
      borrower_exposure_cents =
          sum of Investment.amount_cents WHERE
            Investment.investor_id == requesting_investor.id AND
            Investment.status IN {COMMITTED, CONVERTED} AND
            Investment.listing.borrower_id == this_listing.borrower_id
        + this_new_amount_cents
      cap_cents = floor(Investor.committed_capital_cents * Platform.max_borrower_concentration_bps / 10000)
      ALLOWED iff borrower_exposure_cents <= cap_cents
    input_set: "Investments in COMMITTED or CONVERTED status only (RELEASED/LOST excluded)"
    precision: "Integer cents; '<=' is INCLUSIVE — boundary at exactly cap_cents is allowed"

  - name: charge_off_loss_distribution
    trigger: "Loan → CHARGED_OFF transition"
    algorithm: chronological
    formula: |
      total_loss = principal_outstanding_cents + accrued_late_fees_cents
      # Distribute pro-rata by share_bps, oldest investment first as tie-break
      # PINNED ORDER: sort investments by (created_at ASC, id ASC).
      For each CONVERTED Investment in that order:
        gross_share = round_half_up(total_loss * share_bps / 10000)
        actual_share = min(gross_share, remaining_loss)
        remaining_loss -= actual_share
        Investor.outstanding_principal_cents -= actual_share
      # Any residual cents from rounding land on the LAST investment in the iteration (created_at DESC tail)
    input_set: "CONVERTED Investments on this Loan only (RELEASED/LOST excluded)"
    precision: "round_half_up to cents per investor; residual rounded to last investor so total distributed equals total_loss exactly"
    variants:
      - name: forward_looking_vs_chronological_loss
        when: "At CHARGE_OFF moment, comparing expected_loss (forward-looking from default day) vs realized_loss (chronological waterfall replay)"
        difference: "Forward-looking computes loss as remaining_amortized_principal at default day; chronological replays the actual Payment ledger and may yield lower realized_loss if partial payments reduced principal between DEFAULT and CHARGE_OFF. The scaffold pins charged_off_loss_cents = chronological (ledger-based principal_outstanding_cents at the CHARGE_OFF moment)."

  - name: disclosure_payload_assembly
    trigger: "Any state transition that lists 'Emit Disclosure' in side_effects"
    algorithm: projection
    formula: |
      payload = snapshot of (subject's public-facing fields) AT TRANSITION TIME
      For LISTING_OPENED: { principal_cents, interest_rate_bps, term_months, grade_at_listing }
      For LISTING_FUNDED: { principal_cents, interest_rate_bps, investor_count }
      For LOAN_ORIGINATED: { principal_cents, interest_rate_bps, term_months, monthly_payment_cents, origination_fee_cents }
      For DELINQUENCY_NOTICE: { principal_outstanding_cents, consecutive_missed_installments, accrued_late_fees_cents }
      For DEFAULT_NOTICE: { principal_outstanding_cents, consecutive_missed_installments }
      For CHARGE_OFF_NOTICE: { charged_off_loss_cents, investor_count }
    input_set: "Subject entity's current field values at the moment the transition commits"
    precision: "Snapshot is by-value, not by-reference; subsequent field changes do NOT mutate the disclosure"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers MUST be present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller role MUST be in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every {id} in the URL path MUST resolve to an existing resource (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: state
    check: "Target resource MUST be in a state from which the requested transition is allowed (per §1.2)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "All state-changing endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: PlatformOperator cannot publish a Disclosure; ComplianceOfficer cannot originate a Loan; Borrower cannot self-invest"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "publish, originate, investments create"

  - priority: 6
    category: business_referential
    check: "Investment.investor.platform_id MUST equal Investment.listing.platform_id; cross-platform investing disallowed"
    error_id: ERR_CROSS_PLATFORM_INVESTMENT
    http_status: 409
    applies_to: "investments create"

  - priority: 7
    category: business_constraint
    check: "Investor diversification cap (see calculations.investor_diversification_check): borrower exposure MUST NOT exceed committed_capital * max_borrower_concentration_bps/10000"
    error_id: ERR_DIVERSIFICATION_CAP_EXCEEDED
    http_status: 409
    applies_to: "investments create"

  - priority: 8
    category: business_fiscal
    check: "Investor.cash_balance_cents MUST be >= proposed amount_cents at Investment create"
    error_id: ERR_INSUFFICIENT_CASH
    http_status: 409
    applies_to: "investments create"

  - priority: 9
    category: business_constraint
    check: "Investment.amount_cents on a listing MUST NOT cause pledged_cents > principal_cents (oversubscription forbidden)"
    error_id: ERR_LISTING_OVERSUBSCRIBED
    http_status: 409
    applies_to: "investments create"

  - priority: 10
    category: business_temporal
    check: "LoanListing creation requires Borrower.status == APPROVED AND no existing OPEN/FUNDED listing for that borrower"
    error_id: ERR_BORROWER_NOT_LISTABLE
    http_status: 409
    applies_to: "listings create"

  - priority: 11
    category: business_safety
    check: "Borrower MUST have at least one PlaidSnapshot AND final_grade != UNGRADED before approve"
    error_id: ERR_NO_PLAID_SNAPSHOT
    http_status: 409
    applies_to: "borrowers approve"

  - priority: 12
    category: business_constraint
    check: "Payment.amount_cents MUST be positive AND Loan.status IN {ACTIVE, DELINQUENT, DEFAULT} (not CHARGED_OFF or PAID_OFF)"
    error_id: ERR_LOAN_NOT_PAYABLE
    http_status: 409
    applies_to: "payments create"

  - priority: 13
    category: business_referential
    check: "Disclosure.publish MUST be called on a DRAFT disclosure whose subject is still in the state that created it (subject has not since terminated); otherwise ERR_DISCLOSURE_STALE"
    error_id: ERR_DISCLOSURE_STALE
    http_status: 409
    applies_to: "disclosures publish"

  - priority: 14
    category: business_constraint
    check: "Disclosure once PUBLISHED is immutable — any PATCH/PUT/DELETE returns ERR_DISCLOSURE_LOCKED"
    error_id: ERR_DISCLOSURE_LOCKED
    http_status: 409
    applies_to: "disclosures update/delete"

  - priority: 15
    category: business_constraint
    check: "Borrower ban / suspend is blocked if borrower has any Loan in CHARGED_OFF that has not been disclosed via PUBLISHED CHARGE_OFF_NOTICE — ban semantics distinct from suspend"
    error_id: ERR_BORROWER_HAS_LOSSES
    http_status: 409
    applies_to: "borrowers reinstate"

  - priority: 16
    category: business_constraint
    check: "Borrower.ein uniqueness within Platform"
    error_id: ERR_DUPLICATE_EIN
    http_status: 409
    applies_to: "borrowers create"

  - priority: 17
    category: business_constraint
    check: "Investment.amount_cents MUST be >= 2500 cents AND a multiple of 100 cents"
    error_id: ERR_INVESTMENT_DENOMINATION
    http_status: 422
    applies_to: "investments create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform ---
  - method: POST
    path: "/platforms"
    description: "Create a Platform"
    roles: [PlatformOperator]
    code: 201
    input: ["name", "currency?", "origination_fee_bps?", "servicing_fee_bps?", "late_fee_cents?", "max_borrower_concentration_bps?"]
    output: Platform
    side_effects: ["clock_day_index = 0"]

  - method: GET
    path: "/platforms/{platformId}"
    description: "Get a Platform"
    roles: [PlatformOperator, ComplianceOfficer, Borrower, Investor]
    code: 200
    input: []
    output: Platform
    side_effects: []

  - method: POST
    path: "/platforms/{platformId}/advance_clock"
    description: "Advance the deterministic test clock by N days; runs all system-driven transitions in order"
    roles: [PlatformOperator]
    code: 200
    input: [days]
    output: Platform
    side_effects:
      - "clock_day_index += days"
      - "For each affected entity, run system transitions in order: Installment SCHEDULED→DUE, then DUE→LATE; then Loan ACTIVE→DELINQUENT, DELINQUENT→DEFAULT, DEFAULT→CHARGED_OFF; then LoanListing OPEN→EXPIRED"
      - "Emit corresponding Disclosure drafts"

  # --- Borrower ---
  - method: POST
    path: "/platforms/{platformId}/borrowers"
    description: "Create a Borrower (status starts PENDING_KYC)"
    roles: [PlatformOperator]
    code: 201
    input: [legal_name, ein, annual_revenue_cents, requested_amount_cents]
    output: Borrower
    side_effects:
      - "Compute provisional_grade from self-reported revenue"
      - "final_grade = UNGRADED"

  - method: GET
    path: "/platforms/{platformId}/borrowers/{borrowerId}"
    description: "Get a Borrower"
    roles: [PlatformOperator, ComplianceOfficer, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: POST
    path: "/platforms/{platformId}/borrowers/{borrowerId}/plaid_snapshots"
    description: "Attach a new (immutable) Plaid snapshot to a borrower"
    roles: [PlatformOperator]
    code: 201
    input: [deposits_last_90d_cents, avg_daily_balance_cents, nsf_count_last_90d, existing_debt_service_cents]
    output: PlaidSnapshot
    side_effects:
      - "Borrower.plaid_snapshot_id = new snapshot's id (latest wins)"
      - "Recompute Borrower.final_grade via borrower_final_grade calculation"

  - method: POST
    path: "/platforms/{platformId}/borrowers/{borrowerId}/approve"
    description: "ComplianceOfficer approves a PENDING_KYC borrower"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Borrower
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/platforms/{platformId}/borrowers/{borrowerId}/suspend"
    description: "Suspend a borrower (forces cascade WITHDRAW of OPEN listings)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Borrower
    side_effects:
      - "status → SUSPENDED"
      - "Cascade: OPEN listings → WITHDRAWN; COMMITTED investments → RELEASED with refund"

  - method: POST
    path: "/platforms/{platformId}/borrowers/{borrowerId}/reinstate"
    description: "Reinstate a SUSPENDED borrower back to APPROVED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Borrower
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/platforms/{platformId}/borrowers/{borrowerId}/ban"
    description: "Permanently ban a borrower"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Borrower
    side_effects:
      - "status → BANNED (terminal)"
      - "Cascade: OPEN listings → WITHDRAWN; COMMITTED investments → RELEASED"

  # --- Investor ---
  - method: POST
    path: "/platforms/{platformId}/investors"
    description: "Create an Investor"
    roles: [PlatformOperator]
    code: 201
    input: [display_name, accreditation_status, committed_capital_cents]
    output: Investor
    side_effects: ["cash_balance_cents = 0; outstanding_principal_cents = 0; status = ACTIVE"]

  - method: GET
    path: "/platforms/{platformId}/investors/{investorId}"
    description: "Get an Investor"
    roles: [PlatformOperator, ComplianceOfficer, Investor]
    code: 200
    input: []
    output: Investor
    side_effects: []

  - method: POST
    path: "/platforms/{platformId}/investors/{investorId}/deposits"
    description: "Add cash to an investor's account (simulates external funding)"
    roles: [PlatformOperator]
    code: 200
    input: [amount_cents]
    output: Investor
    side_effects: ["cash_balance_cents += amount_cents"]

  # --- LoanListing ---
  - method: POST
    path: "/platforms/{platformId}/borrowers/{borrowerId}/listings"
    description: "Create a LoanListing for an APPROVED borrower"
    roles: [Borrower, PlatformOperator]
    code: 201
    input: [principal_cents, term_months]
    output: LoanListing
    side_effects:
      - "Snapshot grade_at_listing = Borrower.final_grade"
      - "Compute interest_rate_bps via tiered_interest_rate calculation"
      - "funding_deadline_day_index = Platform.clock_day_index + 14"
      - "Emit Disclosure { kind: LISTING_OPENED } in DRAFT"

  - method: GET
    path: "/platforms/{platformId}/listings/{listingId}"
    description: "Get a LoanListing"
    roles: [PlatformOperator, ComplianceOfficer, Borrower, Investor]
    code: 200
    input: []
    output: LoanListing
    side_effects: []

  - method: GET
    path: "/platforms/{platformId}/listings"
    description: "List LoanListings (filterable)"
    roles: [PlatformOperator, ComplianceOfficer, Borrower, Investor]
    code: 200
    input: ["borrower_id?", "status?", "grade?", "limit?", "offset?"]
    output: "LoanListing[]"
    side_effects: []

  - method: POST
    path: "/platforms/{platformId}/listings/{listingId}/withdraw"
    description: "Borrower (or operator) withdraws an OPEN listing"
    roles: [Borrower, PlatformOperator]
    code: 200
    input: []
    output: LoanListing
    side_effects:
      - "status → WITHDRAWN"
      - "All COMMITTED investments → RELEASED with refund"

  - method: POST
    path: "/platforms/{platformId}/listings/{listingId}/originate"
    description: "Originate a FUNDED listing into a Loan"
    roles: [PlatformOperator]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "Create Loan with copied terms"
      - "Generate Installments[] via monthly_amortized_payment"
      - "All COMMITTED investments on listing → CONVERTED"
      - "Compute per-investment share_bps"
      - "Emit Disclosure { kind: LOAN_ORIGINATED } in DRAFT"

  # --- Investment ---
  - method: POST
    path: "/platforms/{platformId}/listings/{listingId}/investments"
    description: "Investor pledges into an OPEN listing"
    roles: [Investor]
    code: 201
    input: [amount_cents]
    output: Investment
    side_effects:
      - "Decrement Investor.cash_balance_cents by amount_cents"
      - "Add to LoanListing.pledged_cents"
      - "If pledged_cents == principal_cents: listing → FUNDED; emit Disclosure { kind: LISTING_FUNDED } in DRAFT"

  - method: GET
    path: "/platforms/{platformId}/investments/{investmentId}"
    description: "Get an Investment"
    roles: [PlatformOperator, ComplianceOfficer, Investor]
    code: 200
    input: []
    output: Investment
    side_effects: []

  - method: GET
    path: "/platforms/{platformId}/investors/{investorId}/investments"
    description: "List an investor's investments (filterable)"
    roles: [PlatformOperator, ComplianceOfficer, Investor]
    code: 200
    input: ["status?", "loan_id?", "limit?", "offset?"]
    output: "Investment[]"
    side_effects: []

  # --- Loan / Installment ---
  - method: GET
    path: "/platforms/{platformId}/loans/{loanId}"
    description: "Get a Loan"
    roles: [PlatformOperator, ComplianceOfficer, Borrower, Investor]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/platforms/{platformId}/loans/{loanId}/installments"
    description: "List a Loan's Installments"
    roles: [PlatformOperator, ComplianceOfficer, Borrower, Investor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Installment[]"
    side_effects: []

  # --- Payment ---
  - method: POST
    path: "/platforms/{platformId}/loans/{loanId}/payments"
    description: "Borrower makes a payment against a loan"
    roles: [Borrower, PlatformOperator]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects:
      - "Run payment_waterfall_allocation"
      - "Update Installments and Loan totals"
      - "If consecutive_missed_installments reaches 0: Loan may transition DELINQUENT→ACTIVE"
      - "If principal_outstanding_cents == 0: Loan → PAID_OFF"

  - method: GET
    path: "/platforms/{platformId}/payments/{paymentId}"
    description: "Get a Payment (including its allocation breakdown)"
    roles: [PlatformOperator, ComplianceOfficer, Borrower, Investor]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # --- Disclosure ---
  - method: GET
    path: "/platforms/{platformId}/disclosures/{disclosureId}"
    description: "Get a Disclosure"
    roles: [PlatformOperator, ComplianceOfficer, Borrower, Investor]
    code: 200
    input: []
    output: Disclosure
    side_effects: []

  - method: GET
    path: "/platforms/{platformId}/disclosures"
    description: "List Disclosures (filterable)"
    roles: [PlatformOperator, ComplianceOfficer, Borrower, Investor]
    code: 200
    input: ["subject_type?", "subject_id?", "kind?", "published?", "limit?", "offset?"]
    output: "Disclosure[]"
    side_effects: []

  - method: POST
    path: "/platforms/{platformId}/disclosures/{disclosureId}/publish"
    description: "ComplianceOfficer publishes (locks) a DRAFT Disclosure"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Disclosure
    side_effects: ["published = true; published_on_day_index set; record becomes immutable"]

  # --- Compliance Officer (RBAC subject) ---
  - method: POST
    path: "/platforms/{platformId}/compliance_officers"
    description: "Register a ComplianceOfficer"
    roles: [PlatformOperator]
    code: 201
    input: [display_name]
    output: ComplianceOfficer
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/platforms/{platformId}/compliance_officers/{officerId}"
    description: "Get a ComplianceOfficer"
    roles: [PlatformOperator, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceOfficer
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / existence ---
  - id: ERR_MISSING_USER_CONTEXT
    http: 400
    condition: "X-User-Role or X-User-ID header missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is not permitted for the endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path parameter does not resolve to a persisted resource within the parent"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, or path/body id mismatch"

  # --- State ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Target resource is not in a state from which the requested transition is allowed"

  # --- Segregation of duties ---
  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "Role attempted an action prohibited by segregation of duties (e.g., PlatformOperator publishing a disclosure, Borrower investing in own listing, ComplianceOfficer originating a loan)"

  # --- Borrower ---
  - id: ERR_DUPLICATE_EIN
    http: 409
    condition: "Another Borrower on this Platform already uses this EIN"

  - id: ERR_NO_PLAID_SNAPSHOT
    http: 409
    condition: "Approve attempted but borrower has no PlaidSnapshot yet"

  - id: ERR_BORROWER_UNGRADED
    http: 409
    condition: "Borrower final_grade is UNGRADED (or grading inputs missing)"

  - id: ERR_BORROWER_NOT_APPROVED
    http: 409
    condition: "Operation requires borrower in APPROVED status"

  - id: ERR_BORROWER_NOT_LISTABLE
    http: 409
    condition: "Borrower already has an OPEN/FUNDED listing, or status not APPROVED"

  - id: ERR_BORROWER_HAS_LOSSES
    http: 409
    condition: "Reinstate blocked because borrower has at least one Loan in CHARGED_OFF"

  # --- Listing / Investment ---
  - id: ERR_LISTING_OVERSUBSCRIBED
    http: 409
    condition: "Investment.amount_cents would push pledged_cents > principal_cents"

  - id: ERR_LISTING_INTEGRITY
    http: 409
    condition: "Originate attempted while some Investment on the listing is not COMMITTED"

  - id: ERR_DIVERSIFICATION_CAP_EXCEEDED
    http: 409
    condition: "Investor's borrower exposure would exceed committed_capital * max_borrower_concentration_bps/10000"

  - id: ERR_CROSS_PLATFORM_INVESTMENT
    http: 409
    condition: "Investor and listing belong to different platforms"

  - id: ERR_INSUFFICIENT_CASH
    http: 409
    condition: "Investor.cash_balance_cents < requested investment amount"

  - id: ERR_INVESTMENT_DENOMINATION
    http: 422
    condition: "Investment amount below minimum (2500 cents) or not a multiple of 100 cents"

  # --- Loan / Payment ---
  - id: ERR_LOAN_NOT_PAYABLE
    http: 409
    condition: "Loan is CHARGED_OFF or PAID_OFF; cannot accept further payments"

  # --- Disclosure ---
  - id: ERR_DISCLOSURE_LOCKED
    http: 409
    condition: "Disclosure already PUBLISHED and is immutable"

  - id: ERR_DISCLOSURE_STALE
    http: 409
    condition: "Disclosure subject has materially changed state since the DRAFT was emitted; publish refused"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformOperator
    description: "Operates the platform: creates borrowers/investors, attaches Plaid snapshots, advances clock, originates loans, posts payments on behalf of borrower"
    identity: opaque
    exclusive_operations:
      - "POST /platforms — create platform"
      - "POST /platforms/{id}/advance_clock — advance test clock"
      - "POST .../borrowers — create borrower"
      - "POST .../borrowers/{id}/plaid_snapshots — attach Plaid snapshot"
      - "POST .../investors — create investor"
      - "POST .../investors/{id}/deposits — credit investor cash"
      - "POST .../listings/{id}/originate — originate FUNDED listing into Loan"
      - "POST .../compliance_officers — register compliance officer"
    shared_operations:
      - "POST .../borrowers/{id}/listings — create listing (shared with Borrower)"
      - "POST .../listings/{id}/withdraw — withdraw listing (shared with Borrower)"
      - "POST .../loans/{id}/payments — post payment (shared with Borrower)"
      - "GET endpoints"

  - name: ComplianceOfficer
    description: "Approves/suspends/bans borrowers; publishes disclosures. Cannot originate loans (segregation of duties)."
    identity: entity_backed:ComplianceOfficer
    exclusive_operations:
      - "POST .../borrowers/{id}/approve"
      - "POST .../borrowers/{id}/suspend"
      - "POST .../borrowers/{id}/reinstate"
      - "POST .../borrowers/{id}/ban"
      - "POST .../disclosures/{id}/publish"
    shared_operations:
      - "GET endpoints"

  - name: Borrower
    description: "Owns their borrower record; can create listings, withdraw their own listings, post payments on their own loans."
    identity: entity_backed:Borrower
    exclusive_operations: []
    shared_operations:
      - "POST .../borrowers/{borrowerId}/listings — own borrower only (ownership: X-User-ID == Borrower.id)"
      - "POST .../listings/{listingId}/withdraw — own listings only"
      - "POST .../loans/{loanId}/payments — own loans only"
      - "GET endpoints scoped to own borrower/loan/listing"

  - name: Investor
    description: "Owns their investor record; can invest in listings (subject to diversification + cash + denomination checks)."
    identity: entity_backed:Investor
    exclusive_operations:
      - "POST .../listings/{listingId}/investments — invest in a listing (own investor only)"
    shared_operations:
      - "GET endpoints scoped to own investor/investment"
