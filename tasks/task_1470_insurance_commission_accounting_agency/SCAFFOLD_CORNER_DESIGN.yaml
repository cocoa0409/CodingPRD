            - "EARNED_ADJUSTMENT amount_cents == 1200000"
            - "Producer is NOT suspended (status == ACTIVE)"

      - name: direct_bill_bind_creates_no_invoice
        claim_type: input_set_filtering
        grounds: ["state_machines.Policy.QUOTED_to_ACTIVE", "entities.PremiumInvoice.fields.policy_id"]
        distinguishing_aspect: "Input-set filtering by billing_type: binding a DIRECT_BILL policy creates zero PremiumInvoices and does not touch any carrier trust balance."
        test_recipe:
