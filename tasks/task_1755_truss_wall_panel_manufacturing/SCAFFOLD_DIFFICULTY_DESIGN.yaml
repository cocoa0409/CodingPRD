  - rule_id: resource_temporal_overlap
    instances:
      - name: crane_slot_pairwise_buffer_rule
        grounds:
          - calculations.crane_slot_feasibility
          - validations[priority=21]
          - state_machines.CraneSlot.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          CraneResource bookings use pairwise buffered half-open interval arithmetic:
          an 11:00-13:00 request intersecting a BOOKED 10:00-12:00 slot is rejected;
          cancelling the existing slot frees the interval so the identical rebook
          succeeds — CANCELLED slots occupy nothing, unlike the boundary instance's
          adjacency-exactness focus.
        test_recipe:
          setup:
            - "Crane CR-C ACTIVE with slot 2026-08-12 10:00-12:00 BOOKED"
          setup_api_calls:
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-C", capacity_lbs: 8000, crane_class: "STANDARD", hourly_rate_cents: 15000 }, as: PlantManager, captures: { cr: $.data.id, cr_v: $.data.version } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T12:00:00Z", expected_crane_version: "${cr_v}" }, as: ProductionPlanner, captures: { s1: $.data.id } }
          trigger:
            - { call: "GET /plant/cranes/${cr}", as: PlantManager, captures: { cr_v2: $.data.version } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-12T11:00:00Z", end_at: "2026-08-12T13:00:00Z", expected_crane_version: "${cr_v2}" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /plant/crane-slots/${s1}/transition", payload: { to_state: "CANCELLED" }, as: ProductionPlanner }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-12T11:00:00Z", end_at: "2026-08-12T13:00:00Z", expected_crane_version: "${cr_v2}" }, as: ProductionPlanner, captures: { s2: $.data.id } }
          assert:
            - "intersecting 11:00-13:00 vs BOOKED 10:00-12:00 rejected: ${err} == ERR_CRANE_SLOT_OVERLAP"
            - "after CANCELLED: identical 11:00-13:00 rebook ACCEPTED (CraneSlot.${s2} created) — CANCELLED slots occupy no interval"
            - "CraneSlot.${s1}.status == CANCELLED; CraneSlot.${s2}.status == BOOKED"

      - name: jobsite_daily_drop_capacity
        grounds:
          - validations[priority=32]
          - entities.CustomerAccount.fields.max_drops_per_day
        distinguishing_aspect: |
          Different resource and different interval semantics than the crane rule: the
          jobsite imposes AGGREGATE daily capacity (max 2 loads per scheduled_date per
          job) over CLOSED delivery-window dates — two loads may share 2026-08-21 (no
          pairwise exclusion), the third same-date load is rejected, and a 2026-08-27
          load proves window_end inclusivity.
        test_recipe:
          setup:
            - "Customer max_drops_per_day 2; job window [2026-08-20, 2026-08-27] CONFIRMED; no loads yet"
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 100000000, delivery_terms: "DELIVERED", max_drops_per_day: 2 }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Drops Job", jobsite_address: "17 Cottonwood Rd", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 500000 }, as: PlantManager, captures: { job: $.data.id } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager }
          trigger:
            - { call: "POST /plant/jobs/${job}/loads", payload: { scheduled_date: "2026-08-21T00:00:00Z", planned_weight_est_lbs: 5000 }, as: ShippingCoordinator, captures: { l1: $.data.id } }
            - { call: "POST /plant/jobs/${job}/loads", payload: { scheduled_date: "2026-08-21T00:00:00Z", planned_weight_est_lbs: 5000 }, as: ShippingCoordinator, captures: { l2: $.data.id } }
            - { call: "POST /plant/jobs/${job}/loads", payload: { scheduled_date: "2026-08-21T00:00:00Z", planned_weight_est_lbs: 5000 }, as: ShippingCoordinator, captures: { err_cap: $.data.error_id } }
            - { call: "POST /plant/jobs/${job}/loads", payload: { scheduled_date: "2026-08-22T00:00:00Z", planned_weight_est_lbs: 5000 }, as: ShippingCoordinator, captures: { l3: $.data.id } }
            - { call: "POST /plant/jobs/${job}/loads", payload: { scheduled_date: "2026-08-27T00:00:00Z", planned_weight_est_lbs: 5000 }, as: ShippingCoordinator, captures: { l4: $.data.id } }
            - { call: "POST /plant/jobs/${job}/loads", payload: { scheduled_date: "2026-08-28T00:00:00Z", planned_weight_est_lbs: 5000 }, as: ShippingCoordinator, captures: { err_win: $.data.error_id } }
          assert:
            - "two loads sharing 2026-08-21 ACCEPTED (aggregate capacity 2, no pairwise exclusion): ${l1} and ${l2} created PLANNED"
            - "third load on 2026-08-21 rejected: ${err_cap} == ERR_DROPS_PER_DAY_EXCEEDED"
            - "same load moved to 2026-08-22 ACCEPTED: ${l3} created (capacity is per-date)"
            - "2026-08-27 load ACCEPTED (closed window end inclusive): ${l4} created"
            - "2026-08-28 load rejected: ${err_win} == ERR_OUTSIDE_DELIVERY_WINDOW"

  - rule_id: compensating_invariant
    instances:
      - name: lot_board_feet_conservation
        grounds:
          - entities.InventoryLot.fields.available_bf
          - state_machines.MaterialReservation.RESERVED_to_CONSUMED
          - state_machines.MaterialReservation.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: board feet. At every step available_bf + reserved_bf +
          consumed_bf + scrapped_bf == received_board_feet (500.00), and the
          reserve(126.00) -> consume -> reserve(100.00) -> release round trip leaves
          available_bf at exactly 374.00 — the release compensates its reserve with
          zero drift.
        test_recipe:
          setup:
            - "Lumber lot lot6 L2X6 MSR received 500.00 bf, ACTIVE"
          setup_api_calls:
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X6", lumber_grade: "SPF_MSR2400", received_board_feet: 500.0, unit_cost_cents_per_bf: 900 }, as: InventoryManager, captures: { lot6: $.data.id, lot6_v: $.data.version } }
          trigger:
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot6}", reserved_bf: 126.00, expected_lot_version: "${lot6_v}" }, as: ProductionPlanner, captures: { r1: $.data.id } }
            - { call: "GET /plant/inventory-lots/${lot6}", as: InventoryManager, captures: { av1: $.data.available_bf, rv1: $.data.reserved_bf, lv3: $.data.version } }
            - { call: "POST /plant/material-reservations/${r1}/consume", as: InventoryManager }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot6}", reserved_bf: 100.00, expected_lot_version: "${lv3}" }, as: ProductionPlanner, captures: { r2: $.data.id } }
            - { call: "POST /plant/material-reservations/${r2}/release", as: InventoryManager }
            - { call: "GET /plant/inventory-lots/${lot6}", as: InventoryManager, captures: { av2: $.data.available_bf, rv2: $.data.reserved_bf, cv2: $.data.consumed_bf, sv2: $.data.scrapped_bf } }
          assert:
            - "after reserve 126.00: available_bf == 374.00, reserved_bf == 126.00 (sum 500.00)"
            - "after consume: reserved_bf == 0, consumed_bf == 126.00 (sum still 500.00 — consume shifts, never leaks)"
            - "after reserve 100.00 then release (compensating pair): available_bf == 374.00 exactly, reserved_bf == 0"
            - "final: available_bf 374.00 + reserved_bf 0 + consumed_bf 126.00 + scrapped_bf 0 == received 500.00"
            - "MaterialReservation.${r2}.status == RELEASED; MaterialReservation.${r1}.status == CONSUMED"

      - name: claim_waterfall_conservation_and_void_reversal
        grounds:
          - calculations.claim_settlement_waterfall
          - state_machines.DamageClaim.SETTLED_to_VOID
          - entities.Job.fields.credit_issued_cents
        distinguishing_aspect: |
          Conserved quantity: money (integer cents). The waterfall pins buckets +
          residual == approved_cap (50661) exactly; settle then void is the
          compensating pair on Job.credit_issued_cents: 0 -> 10661 -> 0 with zero drift.
          Distinct conserved quantity from the board-feet instance.
        test_recipe:
          setup:
            - "Claim preamble (as claim_cap_vs_settlement_divergence) through decide APPROVE_CREDIT 0.30: approved_cap_cents 50661, claim APPROVED_CREDIT"
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 100000000, delivery_terms: "DELIVERED", storage_free_days: 2, storage_daily_fee_cents: 15000, storage_fee_cap_cents: 300000, max_drops_per_day: 2 }, as: PlantManager, captures: { cust: $.data.id } }
