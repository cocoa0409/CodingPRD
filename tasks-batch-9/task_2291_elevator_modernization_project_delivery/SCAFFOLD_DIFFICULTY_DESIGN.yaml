  - rule_id: resource_temporal_overlap
    instances:
      - name: staging_yard_pointwise_additive_capacity_with_legal_adjacency
        grounds:
          - calculations.staging_interval_capacity
          - calculations.staging_interval_capacity.variants.SEQUENTIAL_HOLDS
          - errors.ERR_STAGING_CAPACITY_EXCEEDED
          - entities.ModernizationProject.fields.staging_area_sqft
        distinguishing_aspect: |
          The staging yard is an ADDITIVE, POINTWISE resource over HALF-OPEN intervals
          [hold_start, hold_end): a hold that starts exactly when another ends is legal and may
          reuse the same footage, while a hold that straddles the seam is measured against the
          pointwise peak and rejected. Interval semantics: half_open / additive_pointwise.
          Resource entity: StagingReservation against ModernizationProject.staging_area_sqft.
        test_recipe:
          setup:
            - "One project with staging_area_sqft 1000."
            - "One car with an APPROVED ScopeOption carrying three ProcurementOrders (CONTROLLER, MACHINE, DOOR_OPERATOR), all in status ORDERED, each with required_staging_sqft 600."
            - "One existing HELD StagingReservation A of 600 sqft over 2026-08-05T00:00:00Z..2026-08-10T00:00:00Z on the CONTROLLER order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false, inspection_lead_days: 10, witness_test_required: false, reinspection_extension_hours: 24, permit_surcharge_pct: 0.0000 }
              as: SystemOperator
              captures: { j_id: $.data.id }
