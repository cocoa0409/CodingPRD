              as_user_id: "trustee-1"
            - call: "POST /draw-requests/${long_id}/fund"
              payload: { funding_date: "2026-09-20T00:00:00Z" }
              as: BondTrustee
              as_user_id: "trustee-1"
              captures: { err_negarb: $.data.error_id }
            - call: "GET /bond-issues/${bond_id}"
              payload: {}
              as: BondTrustee
              as_user_id: "trustee-1"
              captures: { bond_v2: $.data.version }
            - call: "POST /draw-requests"
              payload: { bond_issue_id: "${bond_id}", draw_number: 2, period_start: "2027-03-15T00:00:00Z", period_end: "2027-04-14T00:00:00Z", requested_amount_cents: 100000000, expected_bond_issue_version: "${bond_v2}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { short_id: $.data.id }
            - call: "POST /draw-requests/${short_id}/decision"
              payload: { decision: "APPROVE", approved_amount_cents: 100000000 }
              as: BondTrustee
              as_user_id: "trustee-1"
            - call: "POST /draw-requests/${short_id}/fund"
              payload: { funding_date: "2027-03-20T00:00:00Z" }
              as: BondTrustee
              as_user_id: "trustee-1"
              captures: { short_accrual: $.data.negative_arbitrage_accrual_cents }
            - call: "POST /bond-issues/${bond_id}/operating-months"
              payload: { month_index: 1, noi_cents: 18000000, debt_service_cents: 15000000, occupied_units: 3 }
              as: Developer
