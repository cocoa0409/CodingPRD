# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Nail Salon & Spa
# Nine Difficulty Rules (§0.5), >= 2 instances each (>= 18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: technician_earning_commission_vs_booth_per_appointment
        grounds:
          - calculations.technician_earning
          - entities.Technician.fields.pay_model
          - entities.Technician.fields.commission_pct
          - state_machines.Appointment.IN_SERVICE_to_COMPLETED
        distinguishing_aspect: "Same 6000c subtotal yields technician_earning_cents=3600 under COMMISSION (round_half_up(6000*0.60)) but 6000 under BOOTH_RENT — divergence lives on the Technician entity domain."
        test_recipe:
          setup:
            - "Clock at 2026-03-01T12:00:00Z."
            - "One CLEAN station, one gel-manicure menu item (4500c, requires_sterile_station=false), one paraffin add-on (1500c)."
            - "Two technicians: COMMISSION pct 0.40, and BOOTH_RENT; each with own client; both appointments driven to IN_SERVICE with subtotal 6000c (service 4500 + add-on 1500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-1", requires_autoclave: false }
              as: SalonManager
              captures: { st1: $.data.id }
            - call: "POST /stations"
              payload: { name: "Mani-1b", requires_autoclave: false }
              as: SalonManager
              captures: { st2: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Gel Manicure", category: "MANICURE", duration_minutes: 45, base_price_cents: 4500, loyalty_points_award: 10, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "Paraffin Dip", price_cents: 1500, extra_minutes: 10 }
              as: SalonManager
              captures: { addon: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Comm Tech", license_number: "LIC-C1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st1}" }
              as: SalonManager
              captures: { tc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Booth Tech", license_number: "LIC-B1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "BOOTH_RENT", booth_rent_cents: 5000, home_station_id: "${st1}" }
              as: SalonManager
              captures: { tb: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client C", email: "cc@x.com" }
              as: FrontDesk
              captures: { cc: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client B", email: "cb@x.com" }
              as: FrontDesk
              captures: { cb: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${cc}", technician_id: "${tc}", station_id: "${st1}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-03-01T13:00:00Z" }
              as: FrontDesk
              captures: { ac: $.data.id, ac_v: $.data.version }
            - call: "POST /appointments/${ac}/add-ons"
              payload: { add_on_id: "${addon}", expected_appointment_version: "${ac_v}" }
              as: FrontDesk
            - call: "POST /appointments/${ac}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${ac}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${ac}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tc}"
              captures: { ac_v2: $.data.version }
            - call: "POST /appointments"
              payload: { client_id: "${cb}", technician_id: "${tb}", station_id: "${st2}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-03-01T15:00:00Z" }
              as: FrontDesk
              captures: { ab: $.data.id, ab_v: $.data.version }
            - call: "POST /appointments/${ab}/add-ons"
              payload: { add_on_id: "${addon}", expected_appointment_version: "${ab_v}" }
              as: FrontDesk
            - call: "POST /appointments/${ab}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${ab}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${ab}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tb}"
              captures: { ab_v2: $.data.version }
          trigger:
            - call: "POST /appointments/${ac}/checkout"
              payload: { expected_appointment_version: "${ac_v2}" }
              as: FrontDesk
              captures: { ac_earn: $.data.technician_earning_cents }
            - call: "POST /appointments/${ab}/checkout"
              payload: { expected_appointment_version: "${ab_v2}" }
              as: FrontDesk
              captures: { ab_earn: $.data.technician_earning_cents }
          assert:
            - "Appointment.${ac}.technician_earning_cents == 3600"
            - "Appointment.${ab}.technician_earning_cents == 6000"

      - name: no_show_strike_decay_vs_loyalty_accrual_distinct_domains
        grounds:
          - calculations.strike_decay
          - calculations.checkout_settlement
          - entities.Client.fields.active_no_show_strikes
          - entities.Client.fields.loyalty_points_balance
        distinguishing_aspect: "Strike decay is a time-driven step function on Client.active_no_show_strikes (subtraction over elapsed windows), while loyalty accrual is an event-driven increment on Client.loyalty_points_balance — two valid 'current value' algorithms on different conserved Client quantities."
        test_recipe:
          setup:
            - "Clock 2026-04-01T00:00:00Z. Client X has 2 raw strikes from a NO_SHOW at 2026-02-01T00:00:00Z (59 days earlier -> 1 window decayed since STRIKE_DECAY_DAYS=30, so 1 elapsed full window? 59/30 floor = 1 -> effective 1)."
            - "Same client also completes a gel manicure (loyalty_points_award 10) so loyalty_points_balance goes 0 -> 10 by accrual."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-2", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Gel Mani Decay", category: "MANICURE", duration_minutes: 30, base_price_cents: 4500, loyalty_points_award: 10, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech D", license_number: "LIC-D1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client X", email: "cx@x.com" }
              as: FrontDesk
              captures: { cx: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${cx}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-02-01T01:00:00Z" }
              as: FrontDesk
              captures: { a1: $.data.id }
            - call: "POST /appointments/${a1}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T02:00:00Z" }
              as: SalonManager
            - call: "POST /appointments/${a1}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { client_id: "${cx}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-02-01T03:00:00Z" }
              as: FrontDesk
              captures: { a2: $.data.id }
            - call: "POST /appointments/${a2}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T05:00:00Z" }
              as: SalonManager
            - call: "POST /appointments/${a2}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: SalonManager
          trigger:
            - call: "GET /clients/${cx}"
              payload: {}
              as: FrontDesk
              captures: { strikes_now: $.data.active_no_show_strikes }
            - call: "POST /appointments"
              payload: { client_id: "${cx}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-04-01T10:00:00Z" }
              as: FrontDesk
              captures: { a3: $.data.id, a3_v: $.data.version }
            - call: "POST /appointments/${a3}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a3}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a3}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { a3_v2: $.data.version }
            - call: "POST /appointments/${a3}/checkout"
              payload: { expected_appointment_version: "${a3_v2}" }
              as: FrontDesk
              captures: { loy: $.data.total_charged_cents }
          assert:
            - "Client.${cx}.active_no_show_strikes == 1"
            - "Client.${cx}.loyalty_points_balance == 10"
            - "Client.${cx}.deposit_required == false"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: checkout_waterfall_three_input_nonlinear
        grounds:
          - calculations.checkout_settlement
          - entities.Appointment.fields.deposit_paid_cents
          - entities.Appointment.fields.loyalty_points_redeemed
          - entities.GiftCard.fields.balance_cents
        distinguishing_aspect: "Mode (a) non-linear: total_charged = max(0, gross - deposit) then min(gift,after_loyalty) — three inputs (deposit 2000, loyalty 50pts=500c, gift 3000) with nested min/max produce total_charged_cents=500 and gift drawn to 0; reordering the waterfall changes the result."
        test_recipe:
          setup:
            - "Clock 2026-05-01T12:00:00Z. CLEAN station, gel manicure 4500c + paraffin 1500c = 6000c subtotal."
            - "Client with deposit held 2000c, loyalty balance 60pts, gift card balance 3000c; appointment IN_SERVICE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-W", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Gel Mani W", category: "MANICURE", duration_minutes: 45, base_price_cents: 4500, loyalty_points_award: 0, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "Paraffin W", price_cents: 1500, extra_minutes: 0 }
              as: SalonManager
              captures: { addon: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech W", license_number: "LIC-W1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client W", email: "cw@x.com" }
              as: FrontDesk
              captures: { cw: $.data.id }
            - call: "POST /gift-cards"
              payload: { code: "GC-W-001", initial_balance_cents: 3000, purchaser_client_id: "${cw}" }
              as: FrontDesk
              captures: { gc: $.data.id }
            - call: "POST /_inject/client_state"
              payload: { client_id: "${cw}", loyalty_points_balance: 60 }
              as: SalonManager
            - call: "POST /appointments"
              payload: { client_id: "${cw}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-05-01T13:00:00Z" }
              as: FrontDesk
              captures: { a: $.data.id, a_v: $.data.version }
            - call: "POST /appointments/${a}/add-ons"
              payload: { add_on_id: "${addon}", expected_appointment_version: "${a_v}" }
              as: FrontDesk
            - call: "POST /_inject/appointment_deposit"
              payload: { appointment_id: "${a}", deposit_due_cents: 2000 }
              as: SalonManager
            - call: "POST /appointments/${a}/pay-deposit"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { a_v2: $.data.version }
          trigger:
            - call: "POST /appointments/${a}/checkout"
              payload: { expected_appointment_version: "${a_v2}", loyalty_points_redeemed: 50, gift_card_id: "${gc}" }
              as: FrontDesk
              captures: { charged: $.data.total_charged_cents }
          assert:
            - "Appointment.${a}.total_charged_cents == 500"
            - "Client.${cw}.loyalty_points_balance == 10"
            - "GiftCard.${gc}.balance_cents == 0"
            - "GiftCard.${gc}.status == DEPLETED"

      - name: statement_sum_then_round_vs_per_line_rounding_order
        grounds:
          - calculations.statement_payout
          - calculations.technician_earning
          - entities.CommissionStatement.fields.technician_payout_cents
        distinguishing_aspect: "Mode (b) rounding order: two 333c appointments under commission_pct=0.35 give per-line earnings 216+216=432, but statement SUM-THEN-ROUND gives round_half_up(666*0.65)=433 — the scaffold pins sum-then-round at the statement, so technician_payout_cents=433 != 432."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. COMMISSION tech pct 0.35. Two completed appointments each subtotal 333c (custom-priced service)."
            - "DRAFT statement window [2026-06-01,2026-06-02)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-R", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Mini Touch-up", category: "MANICURE", duration_minutes: 15, base_price_cents: 333, loyalty_points_award: 0, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech R", license_number: "LIC-R1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.35, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client R", email: "cr@x.com" }
              as: FrontDesk
              captures: { cr: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${cr}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-06-01T10:00:00Z" }
              as: FrontDesk
              captures: { r1: $.data.id }
            - call: "POST /appointments/${r1}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${r1}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${r1}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { r1_v: $.data.version }
            - call: "POST /appointments/${r1}/checkout"
              payload: { expected_appointment_version: "${r1_v}" }
              as: FrontDesk
            - call: "POST /appointments"
              payload: { client_id: "${cr}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-06-01T12:00:00Z" }
              as: FrontDesk
              captures: { r2: $.data.id }
            - call: "POST /appointments/${r2}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${r2}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${r2}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { r2_v: $.data.version }
            - call: "POST /appointments/${r2}/checkout"
              payload: { expected_appointment_version: "${r2_v}" }
              as: FrontDesk
            - call: "POST /commission-statements"
              payload: { technician_id: "${t}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-02T00:00:00Z" }
              as: SalonManager
              captures: { stmt: $.data.id }
          trigger:
            - call: "POST /commission-statements/${stmt}/settle"
              payload: {}
              as: SalonManager
              captures: { payout: $.data.technician_payout_cents }
          assert:
            - "CommissionStatement.${stmt}.gross_service_cents == 666"
            - "CommissionStatement.${stmt}.technician_payout_cents == 433"
            - "CommissionStatement.${stmt}.swept_appointment_count == 2"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_parallel_booking_and_payment_dimensions
        grounds:
          - state_machines.Appointment.UNPAID_to_DEPOSIT_HELD
          - state_machines.Appointment.REQUESTED_to_CONFIRMED
          - entities.Appointment.fields.booking_status
          - entities.Appointment.fields.payment_status
        distinguishing_aspect: "Appointment carries two independent state axes: payment_status reaches DEPOSIT_HELD via pay-deposit while booking_status is still REQUESTED, then booking_status advances to CONFIRMED independently — parallel dimensions on the Appointment entity."
        test_recipe:
          setup:
            - "Clock 2026-03-10T00:00:00Z. Deposit-required client (2 active strikes). Appointment REQUESTED with deposit_due_cents=2000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-P", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Classic Mani P", category: "MANICURE", duration_minutes: 30, base_price_cents: 3000, loyalty_points_award: 0, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech P", license_number: "LIC-P1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client P", email: "cp@x.com" }
              as: FrontDesk
              captures: { cp: $.data.id }
            - call: "POST /_inject/client_state"
              payload: { client_id: "${cp}", active_no_show_strikes: 2, last_no_show_at: "2026-03-09T00:00:00Z" }
              as: SalonManager
            - call: "POST /appointments"
              payload: { client_id: "${cp}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-03-10T13:00:00Z" }
              as: FrontDesk
              captures: { a: $.data.id }
          trigger:
            - call: "POST /appointments/${a}/pay-deposit"
              payload: {}
              as: FrontDesk
              captures: { pstat: $.data.payment_status, bstat: $.data.booking_status }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
              captures: { bstat2: $.data.booking_status, pstat2: $.data.payment_status }
          assert:
            - "after pay-deposit Appointment.${a}.payment_status == DEPOSIT_HELD and Appointment.${a}.booking_status == REQUESTED"
            - "after confirm Appointment.${a}.booking_status == CONFIRMED and Appointment.${a}.payment_status == DEPOSIT_HELD"
            - "Appointment.${a}.deposit_due_cents == 2000"

      - name: gift_card_cyclic_active_depleted_active
        grounds:
          - state_machines.GiftCard.ACTIVE_to_DEPLETED
          - state_machines.GiftCard.DEPLETED_to_ACTIVE
          - entities.GiftCard.fields.balance_cents
          - entities.GiftCard.fields.status
        distinguishing_aspect: "GiftCard cycles ACTIVE->DEPLETED (checkout draws balance to 0) ->ACTIVE (the appointment that drew it is refunded, restoring balance>0) — a genuine A->B->A cycle on the GiftCard entity, distinct from any other machine."
        test_recipe:
          setup:
            - "Clock 2026-03-15T12:00:00Z. Gift card balance 4500c exactly covers a 4500c gel manicure; checkout draws it to 0 -> DEPLETED; later the appointment is refunded via cancel-after-settle path (gift restored)."
            - "Refund is exercised via POST /appointments/{id}/refund-settled which restores the gift draw."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T12:00:00Z" }
              as: SalonManager
            - call: "POST /stations"
              payload: { name: "Mani-GC", requires_autoclave: false }
              as: SalonManager
              captures: { st: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Gel Mani GC", category: "MANICURE", duration_minutes: 45, base_price_cents: 4500, loyalty_points_award: 0, requires_sterile_station: false }
              as: SalonManager
              captures: { svc: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tech GC", license_number: "LIC-GC1", license_expiry: "2027-01-01T00:00:00Z", pay_model: "COMMISSION", commission_pct: 0.40, home_station_id: "${st}" }
              as: SalonManager
              captures: { t: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client GC", email: "cgc@x.com" }
              as: FrontDesk
              captures: { c: $.data.id }
            - call: "POST /gift-cards"
              payload: { code: "GC-CYC-1", initial_balance_cents: 4500 }
              as: FrontDesk
              captures: { gc: $.data.id }
            - call: "POST /appointments"
              payload: { client_id: "${c}", technician_id: "${t}", station_id: "${st}", service_item_id: "${svc}", origin: "APPOINTMENT", start_at: "2026-03-15T13:00:00Z" }
              as: FrontDesk
              captures: { a: $.data.id }
            - call: "POST /appointments/${a}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${t}"
              captures: { a_v: $.data.version }
