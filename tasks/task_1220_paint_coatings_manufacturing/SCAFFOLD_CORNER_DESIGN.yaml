              as: PlantManager
              captures: { cu1: $.data.id }
            - call: "POST /coatings/orders"
              payload: { customer_id: "${cu1}", destination_state_code: "AZ", rush_flag: true, lines: [ { formula_id: "${f1}", gallons: 10, size_code: "GALLON" } ] }
              as: Dealer
