  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_denied_reopen_cycle
        grounds:
          - state_machines.Dispute.OPEN_to_UNDER_REVIEW
          - state_machines.Dispute.UNDER_REVIEW_to_DENIED
          - state_machines.Dispute.DENIED_to_OPEN
          - state_machines.Dispute.UNDER_REVIEW_to_UPHELD
          - entities.Dispute.fields.reopen_count
          - validations[priority=44]
          - calculations.paid_miles_determination
