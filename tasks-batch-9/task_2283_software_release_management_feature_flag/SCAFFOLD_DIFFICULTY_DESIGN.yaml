  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: deployment_window_cooldown_buffer_rejects_overlap_but_admits_adjacency
        grounds:
          - validations[priority=33]
          - errors[ERR_DEPLOYMENT_WINDOW_CONFLICT]
          - entities.Environment.fields.cooldown_minutes
          - entities.Deployment.fields.window_start_at
        distinguishing_aspect: |
          Half-open occupancy with a trailing 30-minute cooldown on Environment: DEP1 [02:00, 04:00)
          occupies [02:00, 04:30), so a window starting 04:15 is rejected with
          ERR_DEPLOYMENT_WINDOW_CONFLICT while a window starting exactly at 04:30 is accepted, proving
          the buffer end is exclusive.
        test_recipe:
          setup:
            - "Environment prod-us: tier PROD, window hours 2..6, cooldown_minutes 30, no blackout."
            - "Release 2026.08.1 cut at clock 2026-08-08T00:00:00Z."
            - "DEP1 reserved for 2026-08-10T02:00Z..04:00Z and left SCHEDULED (SCHEDULED still occupies the window)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6, cooldown_minutes: 30, requires_compliance_evidence: false }
              as: PlatformAdmin
