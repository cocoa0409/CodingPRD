  - section: endpoints
    instances:
      - name: round_create_stamps_deadline_and_flips_case
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/reemployment/mediation-rounds
          - entities.MediationRound.fields.response_deadline
          - state_machines.ReemploymentCase.ASSIGNED_to_AWAITING_RESPONSE
        distinguishing_aspect: "Creating a round assigns round_number 1, stamps response_deadline exactly 14 days after creation (2026-09-15T00:00:00Z), flips the case ASSIGNED -> AWAITING_RESPONSE and bumps the case version."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman assigned to the case."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
