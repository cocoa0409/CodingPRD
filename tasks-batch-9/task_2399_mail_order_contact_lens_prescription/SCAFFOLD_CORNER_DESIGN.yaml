          - state_machines.order_fulfillment_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_two_state_dimensions_advance_independently
          rationale: "The named §1.8 instance already drives both Order dimensions apart and back, asserting the four combined states."

      - name: correction_round_loop_bound_stub
        claim_type: cyclic
        grounds:
          - state_machines.prescription_lifecycle.CORRECTION_PENDING_to_PENDING_VERIFICATION
          - errors[ERR_MAX_VERIFICATION_ROUNDS]
        excluded_because:
          difficulty_instance: non_linear_state_machine / prescription_correction_loop_returns_to_pending_verification
          rationale: "The named §1.8 instance walks the CORRECTED loop back into PENDING_VERIFICATION and pins the round counter that bounds it."

