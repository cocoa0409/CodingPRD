        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_netting_hourly_versus_monthly_diverges_by_50_00
          rationale: "The same §1.8 instance asserts that the variant comes from the period's own netting_method snapshot, taken from the deal's settlement_frequency at period creation and never re-read afterwards."

      - name: contract_price_tier_boundaries_and_two_dimensional_premium
        claim_type: tiered_pricing
        grounds:
          - calculations.deal_contract_price
        excluded_because:
          difficulty_instance: combinatorial_formula / contract_price_tier_selected_from_escalated_base_not_final_price
          rationale: "The named §1.8 instance walks the tier edge with two escalation paths that straddle PRICE_TIER_MID_MIN and asserts the tier-dependent shape premium and basis adder assembled in the declared order."

      - name: attribute_allocation_largest_remainder_and_tie_break
        claim_type: waterfall_allocation
        grounds:
          - calculations.attribute_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / attribute_allocation_largest_remainder_conserves_batch_of_103_and_105
          rationale: "The named §1.8 instance exercises the leftover hand-out order and the remainder / allocated_mw / created_at tie-break chain on two batch sizes that conserve exactly."

      - name: credit_tier_threshold_at_exactly_62_00
        claim_type: threshold
        grounds:
