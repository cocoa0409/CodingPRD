scenario: |
  Generate task harder than expert level!

  2604. Trade Finance Letter of Credit Issuance (bank trade finance operations): applicant credit facility allocation and collateral for issuance, credit terms drafting with documentary requirements, incoterm alignment and expiry/latest shipment dates, advising and confirmation bank selection with country risk assessment, amendment processing with beneficiary consent requirements, document examination against the credit with discrepancy identification within the examination period, discrepancy waiver request to the applicant and refusal notice timing, payment, acceptance or negotiation and reimbursement claims, sanctions and dual-use goods screening on documents

domain_name: trade-finance-letter-of-credit-issuance

# Empty prefix: this is a flat/graph topology with 9 peer top-level collections
# (/applicants, /facilities, /banks, /beneficiaries, /credits, /presentations,
# /amendments, /waiver-requests, /settlement-claims). No single top-level
# resource owns the graph, so no shared prefix is declared.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - ops_run_checkpoint

  entity_topology: graph
  # graph: DocumentaryCredit is a 5-way junction (Applicant, Beneficiary,
  # CreditFacility, advising Bank, confirming Bank); FacilityAllocation is a
  # junction between CreditFacility and DocumentaryCredit; ScreeningCheck is a
  # polymorphic-scope child pointing at both DocumentaryCredit and Presentation.

  state_machine_shape: cyclic
  # DocumentaryCredit.status cycles ISSUED -> AMENDMENT_PENDING -> ISSUED for
  # every amendment negotiation round, and ON_HOLD -> APPROVED when facility
  # headroom is restored. Presentation carries two parallel dimensions
  # (examination_status x settlement_status). Amendment is a branching fork-join
  # with divergent side-effect sets per branch (ACCEPTED vs REJECTED vs
  # EXPIRED_NO_CONSENT).

  relationship_patterns:
    - one_to_many          # DocumentaryCredit -> DocumentaryRequirement / Amendment / Presentation
    - many_to_many         # FacilityAllocation joins CreditFacility <-> DocumentaryCredit over amendment rounds
    - polymorphic          # ScreeningCheck.scope selects which parent (credit vs presentation) drives its inputs
    - cross_aggregate      # Presentation settlement mutates CreditFacility exposure two aggregates away

  role_model: segregation_of_duties
  # Amendment drafting vs amendment issuance must be different X-User-IDs;
  # sanctions screening vs sanctions release must be different X-User-IDs.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the §0.4 Expert band on surface count (14 entities /
  # 52 endpoints) because the scenario enumerates nine distinct operational
  # workflows that each own irreducible state. See "design adjudications" note
  # at the bottom of this file.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =========================================================================
# §1.1 Entity-Relationship Table
# =========================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the importer applying for credits"
        constraints: "1..200 chars, non-blank"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of incorporation"
        constraints: "exactly 2 uppercase letters"
      - name: industry_code
        type: string
        source: input
        description: "Internal industry classification code"
        constraints: "4 digits"
      - name: internal_risk_grade
        type: enum
        source: input
        description: "Bank internal obligor grade assigned at onboarding"
        constraints: "one of {AAA, AA, A, BBB, BB, B, CCC}"
      - name: kyc_status
        type: enum
        source: input
        description: "Outcome of the KYC/onboarding file recorded at creation"
        constraints: "one of {PENDING, CLEARED, REJECTED}"
      - name: sanctions_flag
        type: boolean
        source: input
        description: "True when the applicant appears on an internal watch list"
        default: false
      - name: status
        type: enum
        source: system
        description: "Applicant relationship lifecycle state"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}; only ACTIVE is produced by POST /applicants; SUSPENDED/CLOSED are produced by the facility cascade in §1.2"
      - name: onboarded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CreditOfficer who created the record (opaque operator id)"

  - name: CreditFacility
    parent: Applicant
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the obligor whose limit this facility carries"
      - name: currency
        type: string
        source: input
        description: "ISO 4217 currency of the facility limit"
        constraints: "exactly 3 uppercase letters"
      - name: limit_cents
        type: integer
        source: input
        description: "Approved facility limit in minor units"
        constraints: ">= 100000"
      - name: collateral_required_pct
        type: integer
        source: input
        description: "Percentage of a credit's gross exposure that must be collateralised before it can reduce the allocation"
        constraints: "0..100 inclusive"
      - name: collateral_posted_cents
        type: integer
        source: computed
        description: "Running sum of accepted collateral postings minus releases; see calculations.collateral_posted_ledger"
        default: 0
      - name: allocated_cents
        type: integer
        source: computed
        description: "Sum of (allocated_cents + charge_cents) over FacilityAllocation rows for this facility whose status == OPEN; see calculations.facility_exposure_ledger"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "limit_cents - allocated_cents; may not go negative"
      - name: restrict_threshold_cents
        type: integer
        source: computed
        description: "floor(limit_cents * FACILITY_RESTRICT_PCT / 100); the allocated_cents level at which utilisation_posture flips to RESTRICTED"
      - name: utilisation_posture
        type: enum
        source: computed
        description: "OPEN when allocated_cents < restrict_threshold_cents; RESTRICTED when allocated_cents >= restrict_threshold_cents and status != CLOSED; FROZEN when status == CLOSED"
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
        default: OPEN
      - name: status
        type: enum
        source: system
        description: "Facility lifecycle state; gates credit issuance"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"
      - name: facility_expiry_date
        type: string
        source: input
        description: "Last date (YYYY-MM-DD, inclusive) on which this facility may support a new issuance"
      - name: suspended_reason
        type: enum
        source: system
        description: "Why the facility left ACTIVE"
        default: null
        constraints: "one of {null, RESTRICT_THRESHOLD_BREACH, MANUAL_SUSPENSION}"

  - name: FacilityAllocation
    parent: CreditFacility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> CreditFacility.id; the facility whose limit this row occupies"
      - name: credit_id
        type: string
        source: input
        description: "FK -> DocumentaryCredit.id; the credit that caused this occupation"
      - name: allocated_cents
        type: integer
        source: computed
        description: "Committed exposure reserved for the credit; output of calculations.credit_allocation_exposure variant committed_issuance"
      - name: charge_cents
        type: integer
        source: computed
        description: "Issuance commission plus confirmation charge booked against the facility for this credit; output of calculations.issuance_charges"
        default: 0
      - name: released_cents
        type: integer
        source: computed
        description: "Amount given back to the facility when status flipped to RELEASED; equals allocated_cents + charge_cents at release time"
        default: 0
      - name: basis
        type: enum
        source: system
        description: "Why this allocation row exists"
        constraints: "one of {COMMITTED_ISSUANCE, AMENDED_INCREASE, AMENDED_DECREASE}"
      - name: status
        type: enum
        source: system
        description: "OPEN rows count toward CreditFacility.allocated_cents; RELEASED rows do not"
        default: OPEN
        constraints: "one of {OPEN, RELEASED}"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status flipped to RELEASED"
        default: null

  - name: Bank
    parent: null
    common_fields: true
    fields:
      - name: bank_name
        type: string
        source: input
        description: "Correspondent bank legal name"
        constraints: "1..200 chars, non-blank"
      - name: swift_bic
        type: string
        source: input
        description: "SWIFT BIC; unique across Bank rows"
        constraints: "8 or 11 uppercase alphanumerics; unique"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of the bank"
        constraints: "exactly 2 uppercase letters"
      - name: country_risk_score
        type: integer
        source: input
        description: "Country risk assessment of the bank's jurisdiction; higher is riskier"
        constraints: "0..100 inclusive"
      - name: credit_rating
        type: enum
        source: input
        description: "External rating band used by the confirming-bank selector"
        constraints: "one of {AA, A, BBB, BB}"
      - name: confirmation_appetite_cents
        type: integer
        source: input
        description: "Maximum peak concurrent confirmed exposure the bank will carry"
        constraints: ">= 0"
      - name: confirming_line_used_cents
        type: integer
        source: computed
        description: "Peak concurrent occupancy of this bank's confirming line; output of calculations.confirming_line_peak_occupancy"
        default: 0
      - name: eligibility_score
        type: integer
        source: computed
        description: "Ranking score used by the confirming-bank selector; output of calculations.confirming_bank_selection"
        default: 0
      - name: sanctions_flag
        type: boolean
        source: input
        description: "True when the bank is watch-listed; disqualifies it from advising and confirming"
        default: false
      - name: status
        type: enum
        source: system
        description: "Bank relationship state"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - name: beneficiary_name
        type: string
        source: input
        description: "Exporter legal name"
        constraints: "1..200 chars, non-blank"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of the exporter"
        constraints: "exactly 2 uppercase letters"
      - name: nominated_bank_id
        type: string
        source: input
        description: "FK -> Bank.id; the beneficiary's bank, always an acceptable presenting bank"
      - name: sanctions_flag
        type: boolean
        source: input
        description: "True when the beneficiary is watch-listed"
        default: false
      - name: status
        type: enum
        source: system
        description: "Beneficiary state"
        default: ACTIVE
        constraints: "one of {ACTIVE, BLOCKED}; BLOCKED is produced by the CREDIT_PARTIES screening cascade in §1.2"

  - name: DocumentaryCredit
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> Applicant.id; the party for whose account the credit is issued"
      - name: beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; the party in whose favour the credit is issued"
      - name: facility_id
        type: string
        source: input
        description: "FK -> CreditFacility.id; the facility that carries this credit's exposure"
      - name: advising_bank_id
        type: string
        source: input
        description: "FK -> Bank.id; the bank that advises the credit to the beneficiary"
      - name: confirming_bank_id
        type: string
        source: system
        description: "FK -> Bank.id; set by POST /credits/{id}/confirmation-requests, null while confirmation_status == UNCONFIRMED"
        default: null
      - name: currency
        type: string
        source: input
        description: "ISO 4217 currency of the credit; must equal CreditFacility.currency"
        constraints: "exactly 3 uppercase letters"
      - name: amount_cents
        type: integer
        source: input
        description: "Nominal credit amount in minor units"
        constraints: ">= 100000"
      - name: tolerance_pct
        type: integer
        source: input
        description: "Upward drawing tolerance on the nominal amount"
        default: 0
        constraints: "0..10 inclusive"
      - name: available_by
        type: enum
        source: input
        description: "How the credit is available to the beneficiary; drives the settlement variant"
        constraints: "one of {SIGHT_PAYMENT, ACCEPTANCE, NEGOTIATION, DEFERRED_PAYMENT}"
      - name: tenor_days
        type: integer
        source: input
        description: "Usance tenor in days from presentation; must be 0 when available_by == SIGHT_PAYMENT and >= 1 otherwise"
        default: 0
        constraints: "0..360 inclusive"
      - name: incoterm
        type: enum
        source: input
        description: "Delivery term governing the underlying sale"
        constraints: "one of {EXW, FCA, FOB, CFR, CIF, CPT, CIP, DAP, DPU, DDP}"
      - name: incoterm_place
        type: string
        source: input
        description: "Named place required alongside the incoterm (port of loading for FOB/CFR/CIF, destination for DAP/DDP)"
        constraints: "1..120 chars, non-blank"
      - name: partial_shipment_allowed
        type: boolean
        source: input
        description: "Whether partial shipments are permitted under the credit"
        default: false
      - name: transhipment_allowed
        type: boolean
        source: input
        description: "Whether transhipment is permitted under the credit"
        default: false
      - name: latest_shipment_date
        type: string
        source: input
        description: "Latest permitted date of shipment (YYYY-MM-DD, inclusive)"
      - name: expiry_date
        type: string
        source: input
        description: "Expiry date of the credit for presentation (YYYY-MM-DD, inclusive)"
      - name: expiry_place
        type: string
        source: input
        description: "Place of expiry where documents must be presented"
        constraints: "1..120 chars, non-blank"
      - name: presentation_period_days
        type: integer
        source: input
        description: "Days after the date of shipment within which documents must be presented"
        constraints: "1..30 inclusive"
      - name: presentation_deadline_date
        type: string
        source: computed
        description: "min(expiry_date, latest_shipment_date + presentation_period_days) as YYYY-MM-DD; see calculations.presentation_window"
      - name: issue_date
        type: string
        source: system
        description: "Logical-clock date on which status became ISSUED (YYYY-MM-DD)"
        default: null
      - name: status
        type: enum
        source: system
        description: "Primary lifecycle dimension of the credit"
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_CREDIT_APPROVAL, APPROVED, ON_HOLD, ISSUED, AMENDMENT_PENDING, UTILISED, EXPIRED, CANCELLED}"
      - name: confirmation_status
        type: enum
        source: system
        description: "Second, independent lifecycle dimension of the credit; evolves without changing status"
        default: UNCONFIRMED
        constraints: "one of {UNCONFIRMED, CONFIRMATION_REQUESTED, CONFIRMED, CONFIRMATION_DECLINED}"
      - name: provisional_allocation_cents
        type: integer
        source: computed
        description: "Draft-time exposure estimate; output of calculations.credit_allocation_exposure variant provisional_draft. Never debits the facility"
        default: 0
      - name: max_drawable_cents
        type: integer
        source: computed
        description: "floor(amount_cents * (100 + tolerance_pct) / 100); the ceiling on cumulative drawings"
      - name: gross_exposure_cents
        type: integer
        source: computed
        description: "max_drawable_cents + tenor_addon_cents; output of calculations.credit_allocation_exposure step 3"
        default: 0
      - name: committed_allocation_cents
        type: integer
        source: computed
        description: "gross_exposure_cents net of eligible collateral credit; equals FacilityAllocation.allocated_cents for the OPEN row of this credit"
        default: 0
      - name: commission_bps_applied
        type: integer
        source: computed
        description: "Commission tier basis points selected from gross_exposure_cents alone; see calculations.issuance_charges evaluation order step 2"
        default: 0
      - name: base_commission_cents
        type: integer
        source: computed
        description: "Issuance commission; output of calculations.issuance_charges step 3"
        default: 0
      - name: confirmation_charge_cents
        type: integer
        source: computed
        description: "Confirmation charge booked when confirmation_status became CONFIRMED; output of calculations.issuance_charges step 4"
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: "base_commission_cents + confirmation_charge_cents"
        default: 0
      - name: chargeable_utilisation_cents
        type: integer
        source: computed
        description: "committed_allocation_cents + total_charge_cents; the amount this credit occupies on the facility. Explicitly NOT an input to commission tier selection"
        default: 0
      - name: reserved_cents
        type: integer
        source: computed
        description: "Sum of Presentation.drawn_amount_cents over live presentations of this credit; see calculations.credit_drawable_ledger"
        default: 0
      - name: drawn_settled_cents
        type: integer
        source: computed
        description: "Sum of Presentation.drawn_amount_cents over presentations whose settlement_status is in {PAID, NEGOTIATED, REIMBURSED}"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "max_drawable_cents - reserved_cents - drawn_settled_cents"
        default: 0
      - name: amendment_seq
        type: integer
        source: computed
        description: "Count of Amendment rows for this credit whose status == ACCEPTED"
        default: 0
      - name: confirmation_window_start
        type: string
        source: computed
        description: "Half-open start of this credit's occupation of the confirming bank's line; equals issue_date (YYYY-MM-DD, inclusive)"
        default: null
      - name: confirmation_window_end
        type: string
        source: computed
        description: "Half-open end of this credit's occupation of the confirming bank's line; equals expiry_date + presentation_period_days (YYYY-MM-DD, EXCLUSIVE)"
        default: null
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TradeFinanceOfficer who created the draft (opaque operator id)"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TradeFinanceOfficer who issued the credit (opaque operator id)"
        default: null
      - name: cancelled_reason
        type: string
        source: system
        description: "Free-text reason recorded on cancellation"
        default: null

  - name: DocumentaryRequirement
    parent: DocumentaryCredit
    common_fields: true
    fields:
      - name: credit_id
        type: string
        source: input
        description: "FK -> DocumentaryCredit.id; the credit whose terms require this document"
      - name: doc_type
        type: enum
        source: input
        description: "Document the beneficiary must present"
        constraints: "one of {COMMERCIAL_INVOICE, BILL_OF_LADING, AIR_WAYBILL, INSURANCE_CERTIFICATE, PACKING_LIST, CERTIFICATE_OF_ORIGIN, INSPECTION_CERTIFICATE, DRAFT_BILL_OF_EXCHANGE}; unique per (credit_id, doc_type)"
      - name: originals_required
        type: integer
        source: input
        description: "Number of originals that must be presented"
        constraints: "0..5 inclusive"
      - name: copies_required
        type: integer
        source: input
        description: "Number of copies that must be presented"
        constraints: "0..5 inclusive"
      - name: issuer_constraint
        type: string
        source: input
        description: "Who must issue the document (e.g. 'any insurance company', 'chamber of commerce')"
        constraints: "0..120 chars"
      - name: is_mandatory
        type: boolean
        source: input
        description: "When true, absence of this doc_type in a presentation raises a MISSING_DOCUMENT discrepancy"
        default: true
      - name: amended_in_seq
        type: integer
        source: system
        description: "amendment_seq at which this requirement was added or last altered; 0 for original credit terms"
        default: 0

  - name: Amendment
    parent: DocumentaryCredit
    common_fields: true
    fields:
      - name: credit_id
        type: string
        source: input
        description: "FK -> DocumentaryCredit.id; the credit being amended"
      - name: seq
        type: integer
        source: computed
        description: "1 + count of Amendment rows for this credit created before this one, ordered by created_at ASC"
      - name: change_set
        type: object
        source: input
        description: "Map of DocumentaryCredit field name -> new value; keys restricted to {amount_cents, tolerance_pct, expiry_date, latest_shipment_date, incoterm, incoterm_place, presentation_period_days, partial_shipment_allowed, transhipment_allowed}"
        constraints: "1..5 keys; every key in the allowed set"
      - name: reason
        type: string
        source: input
        description: "Narrative reason for the amendment"
        constraints: "1..500 chars, non-blank"
      - name: requires_beneficiary_consent
        type: boolean
        source: computed
        description: "True when change_set touches any key in {amount_cents, expiry_date, latest_shipment_date, incoterm, presentation_period_days} in a way that reduces the beneficiary's rights; see calculations.amendment_consent_requirement"
      - name: status
        type: enum
        source: system
        description: "Amendment lifecycle; branching fork with divergent side-effect sets"
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, PENDING_CONSENT, ACCEPTED, REJECTED, EXPIRED_NO_CONSENT, SUPERSEDED}"
      - name: consent_window_start
        type: string
        source: computed
        description: "Closed-interval start of the consent window (YYYY-MM-DD, inclusive); the logical-clock date at which status became ISSUED"
        default: null
      - name: consent_deadline_date
        type: string
        source: computed
        description: "Closed-interval end of the consent window (YYYY-MM-DD, inclusive); consent_window_start + AMENDMENT_CONSENT_DAYS"
        default: null
      - name: window_end_effective
        type: string
        source: computed
        description: "consent_deadline_date while status is in {ISSUED, PENDING_CONSENT}; the resolution date once status is in {ACCEPTED, REJECTED, EXPIRED_NO_CONSENT, SUPERSEDED}. This is the value the cooling-off overlap rule compares against"
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the amendment reached a terminal status"
        default: null
      - name: amendment_fee_cents
        type: integer
        source: computed
        description: "Flat AMENDMENT_FEE_CENTS, plus the delta commission when change_set increases amount_cents; see calculations.issuance_charges variant amendment_recharge"
        default: 0
      - name: exposure_delta_cents
        type: integer
        source: computed
        description: "committed_allocation_cents after applying change_set minus the value before; positive for increases, negative for decreases"
        default: 0
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TradeFinanceOfficer who created the amendment draft (opaque operator id)"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TradeFinanceOfficer who issued the amendment; must differ from drafted_by_user_id"
        default: null

  - name: Presentation
    parent: DocumentaryCredit
    common_fields: true
    fields:
      - name: credit_id
        type: string
        source: input
        description: "FK -> DocumentaryCredit.id; the credit the documents are presented under"
      - name: presenting_bank_id
        type: string
        source: input
        description: "FK -> Bank.id; the bank forwarding the documents; must equal X-User-ID of the CorrespondentBank caller"
      - name: cover_letter_reference
        type: string
        source: input
        description: "Presenting bank's covering-schedule reference"
        constraints: "0..60 chars"
        default: null
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant at which POST /presentations was accepted"
      - name: received_date
        type: string
        source: computed
        description: "Date part of received_at (YYYY-MM-DD); the 'day of presentation' for examination-period arithmetic"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant at which examination_status became UNDER_EXAMINATION"
        default: null
      - name: document_count
        type: integer
        source: computed
        description: "Count of PresentedDocument rows for this presentation, frozen at submit time"
        default: 0
      - name: drawn_amount_cents
        type: integer
        source: computed
        description: "Sum of PresentedDocument.invoice_amount_cents over rows whose doc_type == COMMERCIAL_INVOICE, frozen at submit time"
        default: 0
      - name: examination_status
        type: enum
        source: system
        description: "First independent dimension: where the documents stand against the credit"
        default: RECEIVED
        constraints: "one of {RECEIVED, UNDER_EXAMINATION, COMPLYING, DISCREPANT, WAIVER_REQUESTED, REFUSED, PRECLUDED}"
      - name: settlement_status
        type: enum
        source: system
        description: "Second independent dimension: where the money stands. Evolves without changing examination_status"
        default: UNSETTLED
        constraints: "one of {UNSETTLED, CLAIM_LODGED, PAID, ACCEPTED, MATURED, NEGOTIATED, REIMBURSED, VOID}"
      - name: examination_deadline
        type: datetime
        source: computed
        description: "End of the examination period; output of calculations.examination_period_deadline. Format YYYY-MM-DDT23:59:59.999Z"
        default: null
      - name: discrepancy_count
        type: integer
        source: computed
        description: "Count of Discrepancy rows for this presentation whose status != WAIVED"
        default: 0
      - name: refusal_notice_sent_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the refusal notice was despatched"
        default: null
      - name: disposal_instruction
        type: enum
        source: input
        description: "Instruction given to the presenter in the refusal notice"
        default: null
        constraints: "one of {null, HOLD_AT_DISPOSAL, RETURN_TO_PRESENTER}"
      - name: maturity_date
        type: string
        source: computed
        description: "received_date + DocumentaryCredit.tenor_days (YYYY-MM-DD); null when tenor_days == 0"
        default: null
      - name: examined_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DocumentExaminer who concluded the examination (opaque operator id)"
        default: null

  - name: PresentedDocument
    parent: Presentation
    common_fields: false
    fields:
      - name: presentation_id
        type: string
        source: input
        description: "FK -> Presentation.id; the presentation this document belongs to"
      - name: doc_type
        type: enum
        source: input
        description: "Type of the presented document"
        constraints: "one of {COMMERCIAL_INVOICE, BILL_OF_LADING, AIR_WAYBILL, INSURANCE_CERTIFICATE, PACKING_LIST, CERTIFICATE_OF_ORIGIN, INSPECTION_CERTIFICATE, DRAFT_BILL_OF_EXCHANGE}"
      - name: originals_presented
        type: integer
        source: input
        description: "Number of originals tendered"
        constraints: "0..5 inclusive"
      - name: copies_presented
        type: integer
        source: input
        description: "Number of copies tendered"
        constraints: "0..5 inclusive"
      - name: issue_date
        type: string
        source: input
        description: "Date on the face of the document (YYYY-MM-DD)"
      - name: shipment_date
        type: string
        source: input
        description: "On-board / dispatch date; required for BILL_OF_LADING and AIR_WAYBILL, null otherwise (YYYY-MM-DD)"
        default: null
      - name: invoice_amount_cents
        type: integer
        source: input
        description: "Invoiced value in minor units; non-zero only for COMMERCIAL_INVOICE"
        default: 0
      - name: goods_description
        type: string
        source: input
        description: "Goods description as it appears on the document; screened against CONTROLLED_KEYWORDS"
        constraints: "0..500 chars"
        default: ""
      - name: hs_code
        type: string
        source: input
        description: "Harmonised System tariff code; first four digits screened against DUAL_USE_HS_PREFIXES"
        constraints: "0 or 6..10 digits"
        default: ""
      - name: consignee_country
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of the consignee; screened against SANCTIONED_COUNTRY_CODES"
        constraints: "exactly 2 uppercase letters, or empty"
        default: ""
      - name: transit_country_codes
        type: array
        source: input
        description: "ISO 3166-1 alpha-2 codes of transit/transhipment countries; screened against SANCTIONED_COUNTRY_CODES then HIGH_RISK_TRANSIT_CODES"
        default: []
      - name: issuer_name
        type: string
        source: input
        description: "Party that issued the document"
        constraints: "0..200 chars"
        default: ""

  - name: Discrepancy
    parent: Presentation
    common_fields: true
    fields:
      - name: presentation_id
        type: string
        source: input
        description: "FK -> Presentation.id; the presentation this discrepancy was raised against"
      - name: code
        type: enum
        source: input
        description: "Standard discrepancy code cited in the refusal notice"
        constraints: "one of {LATE_SHIPMENT, LATE_PRESENTATION, CREDIT_EXPIRED, MISSING_DOCUMENT, INSUFFICIENT_ORIGINALS, INVOICE_OVERDRAWN, GOODS_DESCRIPTION_MISMATCH, INCOTERM_MISMATCH, INSURANCE_UNDERVALUED, TRANSHIPMENT_NOT_ALLOWED}; unique per (presentation_id, code)"
      - name: severity
        type: enum
        source: input
        description: "MATERIAL discrepancies cannot be waived by the applicant; MINOR ones can"
        constraints: "one of {MATERIAL, MINOR}"
      - name: description
        type: string
        source: input
        description: "Examiner's narrative of the defect"
        constraints: "1..500 chars, non-blank"
      - name: status
        type: enum
        source: system
        description: "Whether the discrepancy still stands"
        default: IDENTIFIED
        constraints: "one of {IDENTIFIED, WAIVED, UPHELD}"
      - name: raised_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DocumentExaminer who raised it (opaque operator id)"

  - name: WaiverRequest
    parent: Presentation
    common_fields: true
    fields:
      - name: presentation_id
        type: string
        source: input
        description: "FK -> Presentation.id; the discrepant presentation the waiver is sought for"
      - name: discrepancy_codes
        type: array
        source: input
        description: "Discrepancy codes submitted to the applicant for waiver; every element must match an IDENTIFIED Discrepancy of this presentation with severity == MINOR"
        constraints: "1..10 elements, no duplicates"
      - name: requested_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the waiver request was raised"
      - name: deadline_at
        type: datetime
        source: computed
        description: "requested_at date + WAIVER_RESPONSE_DAYS at 23:59:59.999Z; also bounded by Presentation.examination_deadline (whichever is earlier)"
      - name: status
        type: enum
        source: system
        description: "Applicant's answer"
        default: PENDING
        constraints: "one of {PENDING, GRANTED, DENIED, EXPIRED}"
      - name: responded_at
        type: datetime
        source: system
        description: "Logical-clock instant of the applicant's answer"
        default: null
      - name: applicant_note
        type: string
        source: input
        description: "Applicant's narrative accompanying the decision"
        constraints: "0..500 chars"
        default: null
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DocumentExaminer who raised the request (opaque operator id)"

  - name: SettlementClaim
    parent: Presentation
    common_fields: true
    fields:
      - name: presentation_id
        type: string
        source: input
        description: "FK -> Presentation.id; the presentation being claimed for"
      - name: claim_type
        type: enum
        source: input
        description: "Form of settlement claimed; must be the form matching DocumentaryCredit.available_by (see validations priority 24)"
        constraints: "one of {PAYMENT, ACCEPTANCE, NEGOTIATION, DEFERRED_PAYMENT, REIMBURSEMENT}"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Amount claimed by the presenting bank; must equal Presentation.drawn_amount_cents"
        constraints: ">= 1"
      - name: variant_applied
        type: enum
        source: computed
        description: "Which calculations.settlement_proceeds variant produced net_proceeds_cents"
        default: null
        constraints: "one of {null, SIGHT_HONOUR, NEGOTIATION_UNDER_DISCOUNT, ACCEPTANCE_AT_MATURITY}"
      - name: commission_bps_applied
        type: integer
        source: computed
        description: "SIGHT_COMMISSION_BPS or NEGOTIATION_COMMISSION_BPS, selected from DocumentaryCredit.available_by"
        default: 0
      - name: commission_cents
        type: integer
        source: computed
        description: "round_half_up(drawn_amount_cents * commission_bps_applied / 10000)"
        default: 0
      - name: discount_cents
        type: integer
        source: computed
        description: "Discount charge for usance settlement; 0 for SIGHT_HONOUR"
        default: 0
      - name: doc_examination_fee_cents
        type: integer
        source: computed
        description: "Per-document fees rounded individually THEN summed; see calculations.settlement_proceeds step 2"
        default: 0
      - name: days_to_maturity
        type: integer
        source: computed
        description: "(Presentation.maturity_date - settlement date) in whole days; 0 for SIGHT_HONOUR"
        default: 0
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "drawn_amount_cents - commission_cents - discount_cents - doc_examination_fee_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle"
        default: LODGED
        constraints: "one of {LODGED, SETTLED, REJECTED}"
      - name: settled_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status became SETTLED"
        default: null
      - name: settled_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TradeFinanceOfficer who settled the claim (opaque operator id)"
        default: null

  - name: ScreeningCheck
    parent: null
    common_fields: true
    fields:
      - name: credit_id
        type: string
        source: input
        description: "FK -> DocumentaryCredit.id; always set, including for document-scope checks (taken from the presentation's credit)"
      - name: presentation_id
        type: string
        source: input
        description: "FK -> Presentation.id; set only when scope == PRESENTED_DOCUMENTS, null for CREDIT_PARTIES"
        default: null
      - name: scope
        type: enum
        source: input
        description: "Which population was screened; selects the scoring inputs"
        constraints: "one of {CREDIT_PARTIES, PRESENTED_DOCUMENTS}"
      - name: country_hits
        type: integer
        source: computed
        description: "Count of SANCTIONED_COUNTRY_CODES matches on consignee_country and transit_country_codes (document scope) or party country_code (credit scope)"
        default: 0
      - name: dual_use_hits
        type: integer
        source: computed
        description: "Count of documents whose hs_code starts with a DUAL_USE_HS_PREFIXES entry"
        default: 0
      - name: keyword_hits
        type: integer
        source: computed
        description: "Count of documents whose goods_description contains a CONTROLLED_KEYWORDS entry (case-insensitive substring)"
        default: 0
      - name: transit_hits
        type: integer
        source: computed
        description: "Count of HIGH_RISK_TRANSIT_CODES matches across transit_country_codes of all documents"
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: "Weighted sum; output of calculations.sanctions_dual_use_score"
        default: 0
      - name: result
        type: enum
        source: system
        description: "Screening outcome; gates settlement"
        default: PENDING
        constraints: "one of {PENDING, CLEAR, HIT_PENDING_REVIEW, BLOCKED, RELEASED, ESCALATED}"
      - name: screened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who ran the screening, or the literal 'system' when created by the issue cascade"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who reviewed a HIT_PENDING_REVIEW; must differ from screened_by_user_id"
        default: null
      - name: review_note
        type: string
        source: input
        description: "Reviewer's rationale"
        constraints: "0..500 chars"
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the review decision"
        default: null

# =========================================================================
# §1.2 State Machine Table
# Ten machines. DocumentaryCredit and Presentation each carry TWO independent
# dimensions (declared as two entries per entity, distinguished by `dimension:`).
# =========================================================================
state_machines:
  - entity: DocumentaryCredit
    dimension: status
    initial_state: DRAFT
    terminal_states: [UTILISED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_CREDIT_APPROVAL
        trigger: "POST /credits/{id}/submit-for-approval"
        actor: TradeFinanceOfficer
        preconditions:
          - "DocumentaryCredit.status == DRAFT"
          - "At least one DocumentaryRequirement exists for this credit with doc_type == COMMERCIAL_INVOICE and is_mandatory == true, else ERR_INCOTERM_DOCUMENT_MISMATCH"
          - "At least one DocumentaryRequirement exists with doc_type IN {BILL_OF_LADING, AIR_WAYBILL}, else ERR_INCOTERM_DOCUMENT_MISMATCH"
          - "When incoterm IN {CIF, CIP}, a DocumentaryRequirement with doc_type == INSURANCE_CERTIFICATE and is_mandatory == true exists, else ERR_INCOTERM_DOCUMENT_MISMATCH"
        side_effects:
          - "Recompute DocumentaryCredit.provisional_allocation_cents via calculations.credit_allocation_exposure variant provisional_draft (no facility debit)"
          - "Increments DocumentaryCredit.version by 1"
      - from: PENDING_CREDIT_APPROVAL
        to: DRAFT
        trigger: "POST /credits/{id}/approve with decision == RETURN_TO_DRAFT"
        actor: CreditOfficer
        preconditions:
          - "DocumentaryCredit.status == PENDING_CREDIT_APPROVAL"
        side_effects:
          - "Increments DocumentaryCredit.version by 1"
        note: "Revision loop: a returned draft can be resubmitted, so DRAFT -> PENDING_CREDIT_APPROVAL -> DRAFT may repeat without bound."
      - from: PENDING_CREDIT_APPROVAL
        to: APPROVED
        trigger: "POST /credits/{id}/approve with decision == APPROVE"
        actor: CreditOfficer
        preconditions:
          - "DocumentaryCredit.status == PENDING_CREDIT_APPROVAL"
          - "X-User-ID != DocumentaryCredit.drafted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Applicant.kyc_status == CLEARED for DocumentaryCredit.applicant_id, else ERR_APPLICANT_KYC_NOT_CLEARED"
          - "CreditFacility.status == ACTIVE for DocumentaryCredit.facility_id, else ERR_FACILITY_NOT_ACTIVE"
        side_effects:
          - "Increments DocumentaryCredit.version by 1"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /credits/{id}/issue"
        actor: TradeFinanceOfficer
        preconditions:
          - "DocumentaryCredit.status == APPROVED"
          - "CreditFacility.status == ACTIVE for DocumentaryCredit.facility_id, else ERR_FACILITY_NOT_ACTIVE (cross-entity gate)"
          - "CreditFacility.facility_expiry_date >= logical clock date, else ERR_FACILITY_EXPIRED"
          - "Bank.status == ACTIVE and Bank.sanctions_flag == false for advising_bank_id, else ERR_ADVISING_BANK_INELIGIBLE"
          - "calculations.credit_allocation_exposure variant committed_issuance output plus calculations.issuance_charges total_charge_cents <= CreditFacility.available_cents, else ERR_FACILITY_LIMIT_EXCEEDED"
          - "calculations.sanctions_dual_use_score over the credit parties yields result != BLOCKED, else ERR_SANCTIONS_BLOCK"
        side_effects:
          - "Set issue_date = logical clock date, issued_by_user_id = X-User-ID, status = ISSUED"
          - "Compute gross_exposure_cents, committed_allocation_cents, commission_bps_applied, base_commission_cents, total_charge_cents, chargeable_utilisation_cents, max_drawable_cents, presentation_deadline_date, confirmation_window_start = issue_date, confirmation_window_end = expiry_date + presentation_period_days (exclusive)"
          - "Create a ScreeningCheck row with scope = CREDIT_PARTIES, credit_id = this credit, presentation_id = null, screened_by_user_id = 'system'; its result is CLEAR or HIT_PENDING_REVIEW (a BLOCKED score aborts the whole request and persists nothing)"
          - "CASCADE HOP 1: create FacilityAllocation{facility_id, credit_id, basis = COMMITTED_ISSUANCE, status = OPEN, allocated_cents = committed_allocation_cents, charge_cents = total_charge_cents}"
          - "CASCADE HOP 2 (caused by HOP 1, not by this request): the new OPEN FacilityAllocation row re-drives calculations.facility_exposure_ledger, so CreditFacility.allocated_cents rises by chargeable_utilisation_cents and CreditFacility.available_cents falls by the same amount; CreditFacility.version increments by 1"
          - "CASCADE HOP 3 (caused by HOP 2): the new CreditFacility.allocated_cents value, if >= CreditFacility.restrict_threshold_cents, itself flips utilisation_posture OPEN -> RESTRICTED and CreditFacility.status ACTIVE -> SUSPENDED with suspended_reason = RESTRICT_THRESHOLD_BREACH"
          - "CASCADE HOP 4 (caused by HOP 3): the facility suspension itself moves every sibling DocumentaryCredit with the same facility_id whose status == APPROVED (excluding this credit) to ON_HOLD, processed in created_at ASC order, incrementing each sibling's version by 1"
          - "Increments DocumentaryCredit.version by 1"
      - from: APPROVED
        to: ON_HOLD
        trigger: "system event: CreditFacility.status ACTIVE -> SUSPENDED with suspended_reason == RESTRICT_THRESHOLD_BREACH (cascade hop 4 of a sibling issuance, or of an accepted amendment increase)"
        actor: system
        preconditions:
          - "DocumentaryCredit.status == APPROVED"
          - "DocumentaryCredit.facility_id == the suspended facility's id"
        side_effects:
          - "Increments DocumentaryCredit.version by 1"
        note: "ON_HOLD is reachable ONLY from APPROVED and returns ONLY to APPROVED, so no prior-state memory field is needed."
      - from: ON_HOLD
        to: APPROVED
        trigger: "system event: CreditFacility.status SUSPENDED -> ACTIVE with suspended_reason == RESTRICT_THRESHOLD_BREACH"
        actor: system
        preconditions:
          - "DocumentaryCredit.status == ON_HOLD"
          - "DocumentaryCredit.facility_id == the reinstated facility's id"
        side_effects:
          - "Increments DocumentaryCredit.version by 1"
      - from: ISSUED
        to: AMENDMENT_PENDING
        trigger: "POST /amendments/{id}/issue when Amendment.requires_beneficiary_consent == true"
        actor: TradeFinanceOfficer
        preconditions:
          - "DocumentaryCredit.status == ISSUED"
        side_effects:
          - "Increments DocumentaryCredit.version by 1"
      - from: AMENDMENT_PENDING
        to: ISSUED
        trigger: "POST /amendments/{id}/consent (either decision), or POST /_ops/run-expiry-sweep expiring the consent window"
        actor: BeneficiaryUser | system
        preconditions:
          - "DocumentaryCredit.status == AMENDMENT_PENDING"
          - "No other Amendment of this credit remains in status PENDING_CONSENT after this transition"
        side_effects:
          - "On ACCEPTED only: apply Amendment.change_set to the credit and run cascade hops 1-4 of calculations.facility_exposure_ledger (see Amendment ACCEPTED transition)"
          - "On REJECTED or EXPIRED_NO_CONSENT: credit fields are byte-identical to their pre-amendment values; only status and version change"
          - "Increments DocumentaryCredit.version by 1"
        note: "This edge closes the cycle ISSUED -> AMENDMENT_PENDING -> ISSUED, which may repeat once per amendment round."
      - from: ISSUED
        to: UTILISED
        trigger: "system event: a SettlementClaim settles and leaves DocumentaryCredit.available_cents == 0"
        actor: system
        preconditions:
          - "DocumentaryCredit.status == ISSUED"
          - "DocumentaryCredit.available_cents == 0"
          - "No Presentation of this credit has examination_status IN {RECEIVED, UNDER_EXAMINATION, DISCREPANT, WAIVER_REQUESTED}"
        side_effects:
          - "Increments DocumentaryCredit.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_ops/run-expiry-sweep"
        actor: system
        preconditions:
          - "DocumentaryCredit.status == ISSUED"
          - "logical clock date > DocumentaryCredit.presentation_deadline_date (which is min(expiry_date, latest_shipment_date + presentation_period_days) and therefore never later than expiry_date)"
          - "DocumentaryCredit.reserved_cents == 0"
        side_effects:
          - "Release the OPEN FacilityAllocation row of this credit (status -> RELEASED, released_cents = allocated_cents + charge_cents, released_at = clock instant)"
          - "CASCADE: CreditFacility.allocated_cents falls by released_cents; if it drops below restrict_threshold_cents and suspended_reason == RESTRICT_THRESHOLD_BREACH, CreditFacility.status SUSPENDED -> ACTIVE, which in turn returns ON_HOLD siblings to APPROVED"
          - "Increments DocumentaryCredit.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /credits/{id}/cancel"
        actor: TradeFinanceOfficer
        preconditions:
          - "DocumentaryCredit.status == APPROVED"
        side_effects:
          - "Set cancelled_reason; increments DocumentaryCredit.version by 1"
        note: "No beneficiary consent needed: an unissued credit creates no beneficiary rights."
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /credits/{id}/cancel"
        actor: TradeFinanceOfficer
        preconditions:
          - "DocumentaryCredit.status == ON_HOLD"
        side_effects:
          - "Set cancelled_reason; increments DocumentaryCredit.version by 1"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /credits/{id}/cancel with a non-null beneficiary_consent_reference"
        actor: TradeFinanceOfficer
        preconditions:
          - "DocumentaryCredit.status == ISSUED"
          - "beneficiary_consent_reference is present and non-blank, else ERR_BENEFICIARY_CONSENT_REQUIRED"
          - "DocumentaryCredit.reserved_cents == 0 and drawn_settled_cents == 0, else ERR_CREDIT_HAS_LIVE_PRESENTATION"
        side_effects:
          - "COMPENSATING ACTION for the issuance cascade: the OPEN FacilityAllocation row flips to RELEASED with released_cents = allocated_cents + charge_cents and released_at = clock instant"
          - "CASCADE HOP 2 (caused by the release): CreditFacility.allocated_cents falls by exactly released_cents, restoring the pre-issuance value; CreditFacility.version increments by 1"
          - "CASCADE HOP 3 (caused by HOP 2): if allocated_cents < restrict_threshold_cents and suspended_reason == RESTRICT_THRESHOLD_BREACH, CreditFacility.status SUSPENDED -> ACTIVE and utilisation_posture RESTRICTED -> OPEN"
          - "CASCADE HOP 4 (caused by HOP 3): every ON_HOLD sibling credit on that facility returns to APPROVED in created_at ASC order"
          - "Set cancelled_reason; increments DocumentaryCredit.version by 1"

  - entity: DocumentaryCredit
    dimension: confirmation_status
    initial_state: UNCONFIRMED
    terminal_states: []
    transitions:
      - from: UNCONFIRMED
        to: CONFIRMATION_REQUESTED
        trigger: "POST /credits/{id}/confirmation-requests"
        actor: TradeFinanceOfficer
        preconditions:
          - "DocumentaryCredit.status IN {ISSUED, AMENDMENT_PENDING}, else ERR_CREDIT_NOT_ISSUED"
          - "DocumentaryCredit.confirmation_status == UNCONFIRMED"
          - "The resolved confirming bank has status == ACTIVE and sanctions_flag == false, else ERR_CONFIRMING_BANK_INELIGIBLE"
          - "The resolved confirming bank's country_risk_score <= MAX_CONFIRM_COUNTRY_RISK, else ERR_CONFIRMING_BANK_INELIGIBLE"
          - "The resolved confirming bank's id != DocumentaryCredit.advising_bank_id is NOT required; the advising bank may also confirm"
          - "calculations.confirming_line_peak_occupancy including this credit's window <= Bank.confirmation_appetite_cents, else ERR_CONFIRMING_LINE_WINDOW_FULL"
        side_effects:
          - "Set DocumentaryCredit.confirming_bank_id to the supplied or selected bank; confirmation_status = CONFIRMATION_REQUESTED"
          - "Recompute Bank.confirming_line_used_cents for the selected bank; increments Bank.version by 1"
          - "DocumentaryCredit.status is NOT touched by this dimension"
          - "Increments DocumentaryCredit.version by 1"
      - from: CONFIRMATION_REQUESTED
        to: CONFIRMED
        trigger: "POST /credits/{id}/confirmation-responses with decision == CONFIRM"
        actor: CorrespondentBank
        preconditions:
          - "DocumentaryCredit.confirmation_status == CONFIRMATION_REQUESTED"
          - "X-User-ID == DocumentaryCredit.confirming_bank_id, else ERR_PRINCIPAL_NOT_PARTY"
        side_effects:
          - "Compute confirmation_charge_cents via calculations.issuance_charges step 4 and add it to total_charge_cents and chargeable_utilisation_cents"
          - "CASCADE: the OPEN FacilityAllocation row's charge_cents rises by confirmation_charge_cents, which itself raises CreditFacility.allocated_cents by the same amount, which itself may flip the facility posture and hold APPROVED siblings"
          - "Increments DocumentaryCredit.version by 1"
      - from: CONFIRMATION_REQUESTED
        to: CONFIRMATION_DECLINED
        trigger: "POST /credits/{id}/confirmation-responses with decision == DECLINE"
        actor: CorrespondentBank
        preconditions:
          - "DocumentaryCredit.confirmation_status == CONFIRMATION_REQUESTED"
          - "X-User-ID == DocumentaryCredit.confirming_bank_id, else ERR_PRINCIPAL_NOT_PARTY"
          - "declined_reason is present and non-blank, else ERR_INVALID_REQUEST"
        side_effects:
          - "Set confirming_bank_id = null; recompute the declining Bank.confirming_line_used_cents (its occupation is removed); increments that Bank.version by 1"
          - "Increments DocumentaryCredit.version by 1"
      - from: CONFIRMATION_DECLINED
        to: CONFIRMATION_REQUESTED
        trigger: "POST /credits/{id}/confirmation-requests (retry with a different bank)"
        actor: TradeFinanceOfficer
        preconditions:
          - "DocumentaryCredit.confirmation_status == CONFIRMATION_DECLINED"
          - "Same eligibility, country-risk and confirming-line window preconditions as the UNCONFIRMED -> CONFIRMATION_REQUESTED edge"
        side_effects:
          - "Same as the UNCONFIRMED -> CONFIRMATION_REQUESTED edge"
        note: "Closes the retry cycle CONFIRMATION_REQUESTED -> CONFIRMATION_DECLINED -> CONFIRMATION_REQUESTED. When the selector runs on a retry, the previously declining bank is excluded from the candidate set."

  - entity: CreditFacility
    dimension: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: CreditFacility.allocated_cents recomputed to a value >= restrict_threshold_cents (cascade hop 3 of credit issuance, confirmation, or accepted amendment increase)"
        actor: system
        preconditions:
          - "CreditFacility.status == ACTIVE"
          - "CreditFacility.allocated_cents >= CreditFacility.restrict_threshold_cents"
        side_effects:
          - "Set suspended_reason = RESTRICT_THRESHOLD_BREACH and utilisation_posture = RESTRICTED"
          - "CASCADE: every APPROVED DocumentaryCredit on this facility moves to ON_HOLD in created_at ASC order"
          - "Increments CreditFacility.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /facilities/{id}/status-changes with action == SUSPEND"
        actor: CreditOfficer
        preconditions:
          - "CreditFacility.status == ACTIVE"
        side_effects:
          - "Set suspended_reason = MANUAL_SUSPENSION; utilisation_posture is recomputed but NOT forced to RESTRICTED"
          - "CASCADE: every APPROVED DocumentaryCredit on this facility moves to ON_HOLD in created_at ASC order"
          - "Increments CreditFacility.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: CreditFacility.allocated_cents recomputed to a value < restrict_threshold_cents"
        actor: system
        preconditions:
          - "CreditFacility.status == SUSPENDED"
          - "CreditFacility.suspended_reason == RESTRICT_THRESHOLD_BREACH"
          - "CreditFacility.allocated_cents < CreditFacility.restrict_threshold_cents"
        side_effects:
          - "Set suspended_reason = null and utilisation_posture = OPEN"
          - "CASCADE: every ON_HOLD DocumentaryCredit on this facility returns to APPROVED in created_at ASC order"
          - "Increments CreditFacility.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /facilities/{id}/status-changes with action == REINSTATE"
        actor: CreditOfficer
        preconditions:
          - "CreditFacility.status == SUSPENDED"
          - "CreditFacility.suspended_reason == MANUAL_SUSPENSION, else ERR_FACILITY_STILL_RESTRICTED (a threshold breach can only be cleared by releasing exposure)"
        side_effects:
          - "Set suspended_reason = null"
          - "CASCADE: every ON_HOLD DocumentaryCredit on this facility returns to APPROVED in created_at ASC order"
          - "Increments CreditFacility.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /facilities/{id}/status-changes with action == CLOSE"
        actor: CreditOfficer
        preconditions:
          - "CreditFacility.status == ACTIVE"
          - "CreditFacility.allocated_cents == 0, else ERR_FACILITY_HAS_OPEN_ALLOCATION"
        side_effects:
          - "Set utilisation_posture = FROZEN"
          - "Increments CreditFacility.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /facilities/{id}/status-changes with action == CLOSE"
        actor: CreditOfficer
        preconditions:
          - "CreditFacility.status == SUSPENDED"
          - "CreditFacility.allocated_cents == 0, else ERR_FACILITY_HAS_OPEN_ALLOCATION"
        side_effects:
          - "Set utilisation_posture = FROZEN"
          - "Increments CreditFacility.version by 1"

  - entity: FacilityAllocation
    dimension: status
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: "system event: DocumentaryCredit reaches CANCELLED or EXPIRED, or an accepted Amendment supersedes this allocation row"
        actor: system
        preconditions:
          - "FacilityAllocation.status == OPEN"
        side_effects:
          - "Set released_cents = allocated_cents + charge_cents and released_at = logical clock instant"
          - "CASCADE: CreditFacility.allocated_cents falls by released_cents (facility_exposure_ledger recompute)"
          - "Increments FacilityAllocation.version by 1"
        note: "An amendment that changes exposure RELEASES the prior OPEN row and OPENS a fresh row with basis AMENDED_INCREASE or AMENDED_DECREASE, so the ledger invariant never sees a partial write."

  - entity: Amendment
    dimension: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, EXPIRED_NO_CONSENT, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /credits/{id}/amendments creates a newer Amendment for the same credit while this one is still DRAFT"
        actor: system
        preconditions:
          - "Amendment.status == DRAFT"
        side_effects:
          - "Set resolved_at = logical clock instant and window_end_effective = the clock date"
          - "Increments Amendment.version by 1"
        note: "This legitimate supersede is exactly why POST /credits/{id}/amendments is OCC-guarded on the credit's version (see §1.2.1)."
      - from: DRAFT
        to: ISSUED
        trigger: "POST /amendments/{id}/issue"
        actor: TradeFinanceOfficer
        preconditions:
          - "Amendment.status == DRAFT"
          - "DocumentaryCredit.status IN {ISSUED, AMENDMENT_PENDING}, else ERR_CREDIT_NOT_ISSUED"
          - "X-User-ID != Amendment.drafted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "calculations.amendment_window_overlap finds no conflicting Amendment window on the same credit, else ERR_AMENDMENT_WINDOW_CONFLICT"
        side_effects:
          - "Set issued_by_user_id = X-User-ID, seq, consent_window_start = logical clock date, consent_deadline_date = consent_window_start + AMENDMENT_CONSENT_DAYS, window_end_effective = consent_deadline_date"
          - "Compute requires_beneficiary_consent, exposure_delta_cents and amendment_fee_cents"
          - "Immediately continue to PENDING_CONSENT or to ACCEPTED (see the two edges below); ISSUED is never observable as a resting state"
          - "Increments Amendment.version by 1"
      - from: ISSUED
        to: PENDING_CONSENT
        trigger: "system event, inside the same POST /amendments/{id}/issue request, when requires_beneficiary_consent == true"
        actor: system
        preconditions:
          - "Amendment.status == ISSUED"
          - "Amendment.requires_beneficiary_consent == true"
        side_effects:
          - "CASCADE: DocumentaryCredit.status ISSUED -> AMENDMENT_PENDING (no credit terms change yet)"
          - "Increments Amendment.version by 1"
      - from: ISSUED
        to: ACCEPTED
        trigger: "system event, inside the same POST /amendments/{id}/issue request, when requires_beneficiary_consent == false"
        actor: system
        preconditions:
          - "Amendment.status == ISSUED"
          - "Amendment.requires_beneficiary_consent == false"
        side_effects:
          - "Apply change_set to the credit immediately; run the same side-effect set as the PENDING_CONSENT -> ACCEPTED edge"
          - "DocumentaryCredit.status stays ISSUED throughout (it never enters AMENDMENT_PENDING on this branch)"
          - "Increments Amendment.version by 1"
        note: "Fork with divergent side-effect sets: the consent-required branch parks the credit in AMENDMENT_PENDING and defers every field change; the consent-free branch mutates the credit and the facility ledger inside the issue request."
      - from: PENDING_CONSENT
        to: ACCEPTED
        trigger: "POST /amendments/{id}/consent with decision == ACCEPT"
        actor: BeneficiaryUser
        preconditions:
          - "Amendment.status == PENDING_CONSENT"
          - "X-User-ID == DocumentaryCredit.beneficiary_id of Amendment.credit_id, else ERR_PRINCIPAL_NOT_PARTY"
          - "logical clock date <= Amendment.consent_deadline_date, else ERR_CONSENT_WINDOW_CLOSED"
        side_effects:
          - "Set resolved_at, window_end_effective = the clock date, status = ACCEPTED"
          - "Apply change_set to DocumentaryCredit; recompute max_drawable_cents, presentation_deadline_date, confirmation_window_end; amendment_seq += 1; status AMENDMENT_PENDING -> ISSUED"
          - "CASCADE HOP 1 (caused by the applied change_set): re-run calculations.credit_allocation_exposure; the credit's OPEN FacilityAllocation row flips to RELEASED and a new OPEN row is created with basis = AMENDED_INCREASE when exposure_delta_cents > 0, otherwise AMENDED_DECREASE (a zero delta takes the AMENDED_DECREASE label), charge_cents = amendment_fee_cents plus the retained prior charges"
          - "CASCADE HOP 2 (caused by HOP 1): CreditFacility.allocated_cents recomputes from the new OPEN row set"
          - "CASCADE HOP 3 (caused by HOP 2): the new allocated_cents crosses restrict_threshold_cents in either direction and flips CreditFacility.status / utilisation_posture accordingly"
          - "CASCADE HOP 4 (caused by HOP 3): APPROVED siblings move to ON_HOLD, or ON_HOLD siblings return to APPROVED, in created_at ASC order"
          - "Increments Amendment.version by 1"
      - from: PENDING_CONSENT
        to: REJECTED
        trigger: "POST /amendments/{id}/consent with decision == REJECT"
        actor: BeneficiaryUser
        preconditions:
          - "Amendment.status == PENDING_CONSENT"
          - "X-User-ID == DocumentaryCredit.beneficiary_id of Amendment.credit_id, else ERR_PRINCIPAL_NOT_PARTY"
          - "logical clock date <= Amendment.consent_deadline_date, else ERR_CONSENT_WINDOW_CLOSED"
        side_effects:
          - "Set resolved_at, window_end_effective = the clock date, status = REJECTED"
          - "DocumentaryCredit.status AMENDMENT_PENDING -> ISSUED; NO credit field, NO FacilityAllocation row and NO CreditFacility field changes (divergent from the ACCEPTED branch)"
          - "Amendment.amendment_fee_cents is set to 0 (no fee is charged for a rejected amendment)"
          - "Increments Amendment.version by 1"
      - from: PENDING_CONSENT
        to: EXPIRED_NO_CONSENT
        trigger: "POST /_ops/run-expiry-sweep"
        actor: system
        preconditions:
          - "Amendment.status == PENDING_CONSENT"
          - "logical clock date > Amendment.consent_deadline_date"
        side_effects:
          - "Set resolved_at = clock instant, window_end_effective = Amendment.consent_deadline_date, amendment_fee_cents = 0"
          - "DocumentaryCredit.status AMENDMENT_PENDING -> ISSUED with no field changes"
          - "Increments Amendment.version by 1"

  - entity: Presentation
    dimension: examination_status
    initial_state: RECEIVED
    terminal_states: [COMPLYING, REFUSED, PRECLUDED]
    transitions:
      - from: RECEIVED
        to: UNDER_EXAMINATION
        trigger: "POST /presentations/{id}/submit"
        actor: CorrespondentBank
        preconditions:
          - "Presentation.examination_status == RECEIVED"
          - "X-User-ID == Presentation.presenting_bank_id, else ERR_PRINCIPAL_NOT_PARTY"
          - "count of PresentedDocument rows for this presentation >= 1, else ERR_PRESENTATION_INCOMPLETE"
          - "logical clock date <= DocumentaryCredit.presentation_deadline_date, else ERR_PRESENTATION_WINDOW_CLOSED"
          - "Sum of COMMERCIAL_INVOICE invoice_amount_cents <= DocumentaryCredit.available_cents, else ERR_CREDIT_DRAWABLE_EXCEEDED"
        side_effects:
          - "Freeze document_count and drawn_amount_cents; set submitted_at, maturity_date (null when tenor_days == 0)"
          - "Compute examination_deadline via calculations.examination_period_deadline"
          - "CASCADE: DocumentaryCredit.reserved_cents rises by drawn_amount_cents and available_cents falls by the same amount (credit_drawable_ledger recompute); DocumentaryCredit.version increments by 1"
          - "Increments Presentation.version by 1"
      - from: UNDER_EXAMINATION
        to: COMPLYING
        trigger: "POST /presentations/{id}/conclude-examination"
        actor: DocumentExaminer
        preconditions:
          - "Presentation.examination_status == UNDER_EXAMINATION"
          - "Presentation.discrepancy_count == 0"
          - "logical clock instant <= Presentation.examination_deadline, else ERR_EXAMINATION_PERIOD_EXPIRED"
        side_effects:
          - "Set examined_by_user_id = X-User-ID"
          - "Increments Presentation.version by 1"
      - from: UNDER_EXAMINATION
        to: DISCREPANT
        trigger: "POST /presentations/{id}/conclude-examination"
        actor: DocumentExaminer
        preconditions:
          - "Presentation.examination_status == UNDER_EXAMINATION"
          - "Presentation.discrepancy_count >= 1"
          - "logical clock instant <= Presentation.examination_deadline, else ERR_EXAMINATION_PERIOD_EXPIRED"
        side_effects:
          - "Set examined_by_user_id = X-User-ID"
          - "Increments Presentation.version by 1"
      - from: DISCREPANT
        to: WAIVER_REQUESTED
        trigger: "POST /presentations/{id}/waiver-requests"
        actor: DocumentExaminer
        preconditions:
          - "Presentation.examination_status == DISCREPANT"
          - "Every code in discrepancy_codes matches a Discrepancy of this presentation with status == IDENTIFIED and severity == MINOR, else ERR_DISCREPANCY_CODE_UNKNOWN"
          - "No WaiverRequest of this presentation is in status PENDING, else ERR_LIVE_REQUEST_EXISTS"
        side_effects:
          - "Create the WaiverRequest with deadline_at = min(requested_at date + WAIVER_RESPONSE_DAYS at 23:59:59.999Z, Presentation.examination_deadline)"
          - "Increments Presentation.version by 1"
      - from: WAIVER_REQUESTED
        to: COMPLYING
        trigger: "POST /waiver-requests/{id}/respond with decision == GRANT"
        actor: ApplicantUser
        preconditions:
          - "Presentation.examination_status == WAIVER_REQUESTED"
          - "WaiverRequest.status == PENDING"
          - "X-User-ID == DocumentaryCredit.applicant_id of the presentation's credit, else ERR_PRINCIPAL_NOT_PARTY"
          - "logical clock instant <= WaiverRequest.deadline_at, else ERR_WAIVER_WINDOW_CLOSED"
          - "Every Discrepancy of this presentation with status == IDENTIFIED is cited in WaiverRequest.discrepancy_codes, else the presentation returns to DISCREPANT instead (see note)"
        side_effects:
          - "Every cited Discrepancy moves IDENTIFIED -> WAIVED; discrepancy_count recomputes to 0"
          - "Increments Presentation.version by 1"
        note: "A partial waiver leaves at least one IDENTIFIED discrepancy, so the presentation lands on the WAIVER_REQUESTED -> DISCREPANT edge instead of this one."
      - from: WAIVER_REQUESTED
        to: DISCREPANT
        trigger: "POST /waiver-requests/{id}/respond with decision == DENY, a partial GRANT that leaves an IDENTIFIED discrepancy, or POST /_ops/run-expiry-sweep expiring the waiver deadline"
        actor: ApplicantUser | system
        preconditions:
          - "Presentation.examination_status == WAIVER_REQUESTED"
          - "WaiverRequest.status == PENDING"
        side_effects:
          - "On DENY or expiry: every cited Discrepancy moves IDENTIFIED -> UPHELD; discrepancy_count is unchanged (UPHELD rows still count)"
          - "Increments Presentation.version by 1"
        note: "Closes the cycle DISCREPANT -> WAIVER_REQUESTED -> DISCREPANT; a second waiver request for the remaining codes is permitted while the examination period is still open."
      - from: DISCREPANT
        to: REFUSED
        trigger: "POST /presentations/{id}/refuse"
        actor: DocumentExaminer
        preconditions:
          - "Presentation.examination_status == DISCREPANT"
          - "Presentation.discrepancy_count >= 1"
          - "logical clock instant <= Presentation.examination_deadline, else ERR_EXAMINATION_PERIOD_EXPIRED"
          - "No WaiverRequest of this presentation is in status PENDING, else ERR_LIVE_REQUEST_EXISTS"
        side_effects:
          - "Set refusal_notice_sent_at = clock instant, disposal_instruction from the request body; every IDENTIFIED Discrepancy moves to UPHELD"
          - "CASCADE HOP 1 (caused by examination_status becoming REFUSED): Presentation.settlement_status UNSETTLED -> VOID"
          - "CASCADE HOP 2 (caused by HOP 1): the VOID settlement removes this presentation from the credit_drawable_ledger live set, so DocumentaryCredit.reserved_cents falls by drawn_amount_cents"
          - "CASCADE HOP 3 (caused by HOP 2): the new reserved_cents value re-derives DocumentaryCredit.available_cents = max_drawable_cents - reserved_cents - drawn_settled_cents, restoring the exact pre-submit value; DocumentaryCredit.version increments by 1"
          - "CreditFacility.allocated_cents is explicitly NOT touched: facility exposure is committed at issuance, not at drawing"
          - "Increments Presentation.version by 1"
      - from: UNDER_EXAMINATION
        to: PRECLUDED
        trigger: "POST /_ops/run-expiry-sweep"
        actor: system
        preconditions:
          - "Presentation.examination_status == UNDER_EXAMINATION"
          - "logical clock instant > Presentation.examination_deadline"
        side_effects:
          - "The bank is precluded from claiming the documents are non-complying; the presentation is treated as complying for settlement purposes"
          - "Increments Presentation.version by 1"
      - from: DISCREPANT
        to: PRECLUDED
        trigger: "POST /_ops/run-expiry-sweep"
        actor: system
        preconditions:
          - "Presentation.examination_status == DISCREPANT"
          - "Presentation.refusal_notice_sent_at IS null"
          - "logical clock instant > Presentation.examination_deadline"
        side_effects:
          - "Every IDENTIFIED Discrepancy stays IDENTIFIED (it is on record but no longer actionable)"
          - "Increments Presentation.version by 1"
      - from: WAIVER_REQUESTED
        to: PRECLUDED
        trigger: "POST /_ops/run-expiry-sweep"
        actor: system
        preconditions:
          - "Presentation.examination_status == WAIVER_REQUESTED"
          - "logical clock instant > Presentation.examination_deadline"
        side_effects:
          - "The open WaiverRequest moves PENDING -> EXPIRED in the same sweep, processed before the preclusion flip"
          - "Increments Presentation.version by 1"

  - entity: Presentation
    dimension: settlement_status
    initial_state: UNSETTLED
    terminal_states: [PAID, NEGOTIATED, REIMBURSED, VOID]
    transitions:
      - from: UNSETTLED
        to: CLAIM_LODGED
        trigger: "POST /presentations/{id}/settlement-claims"
        actor: CorrespondentBank
        preconditions:
          - "Presentation.settlement_status == UNSETTLED"
          - "Presentation.examination_status IN {COMPLYING, PRECLUDED}, else ERR_PRESENTATION_NOT_COMPLYING"
          - "X-User-ID == Presentation.presenting_bank_id, else ERR_PRINCIPAL_NOT_PARTY"
          - "Presentation.presenting_bank_id IN {DocumentaryCredit.advising_bank_id, DocumentaryCredit.confirming_bank_id, Beneficiary.nominated_bank_id}, else ERR_BANK_NOT_NOMINATED"
          - "claim_type matches DocumentaryCredit.available_by per validations priority 24, else ERR_CLAIM_TYPE_MISMATCH"
          - "claimed_amount_cents == Presentation.drawn_amount_cents, else ERR_CLAIM_AMOUNT_MISMATCH"
          - "That ScreeningCheck.result != BLOCKED, else ERR_SANCTIONS_BLOCK"
        side_effects:
          - "Create the SettlementClaim with status = LODGED and all fee/proceeds fields still 0"
          - "Increments Presentation.version by 1"
      - from: CLAIM_LODGED
        to: PAID
        trigger: "POST /settlement-claims/{id}/settle when SettlementClaim.claim_type == PAYMENT"
        actor: TradeFinanceOfficer
        preconditions:
          - "Presentation.settlement_status == CLAIM_LODGED"
          - "SettlementClaim.status == LODGED"
          - "The latest ScreeningCheck with scope == PRESENTED_DOCUMENTS for this presentation has result IN {CLEAR, RELEASED}; HIT_PENDING_REVIEW gives ERR_SCREENING_NOT_CLEARED (409), ESCALATED gives ERR_DUAL_USE_ESCALATED (409) and BLOCKED gives ERR_SANCTIONS_BLOCK (403)"
        side_effects:
          - "Compute variant_applied = SIGHT_HONOUR and the fee/proceeds fields via calculations.settlement_proceeds; set status = SETTLED, settled_at, settled_by_user_id"
          - "CASCADE: DocumentaryCredit.drawn_settled_cents rises by drawn_amount_cents while reserved_cents falls by the same amount, so available_cents is unchanged by settlement"
          - "CASCADE: if the resulting DocumentaryCredit.available_cents == 0 and no live presentation remains, DocumentaryCredit.status ISSUED -> UTILISED"
          - "Increments Presentation.version by 1"
      - from: CLAIM_LODGED
        to: NEGOTIATED
        trigger: "POST /settlement-claims/{id}/settle when SettlementClaim.claim_type == NEGOTIATION"
        actor: TradeFinanceOfficer
        preconditions:
          - "Presentation.settlement_status == CLAIM_LODGED"
          - "SettlementClaim.status == LODGED"
          - "The latest ScreeningCheck with scope == PRESENTED_DOCUMENTS for this presentation has result IN {CLEAR, RELEASED}; HIT_PENDING_REVIEW gives ERR_SCREENING_NOT_CLEARED (409), ESCALATED gives ERR_DUAL_USE_ESCALATED (409) and BLOCKED gives ERR_SANCTIONS_BLOCK (403)"
        side_effects:
          - "Compute variant_applied = NEGOTIATION_UNDER_DISCOUNT and the fee/proceeds fields via calculations.settlement_proceeds; set status = SETTLED, settled_at, settled_by_user_id"
          - "CASCADE: DocumentaryCredit.drawn_settled_cents rises by drawn_amount_cents while reserved_cents falls by the same amount"
          - "Increments Presentation.version by 1"
      - from: CLAIM_LODGED
        to: ACCEPTED
        trigger: "POST /settlement-claims/{id}/settle when SettlementClaim.claim_type IN {ACCEPTANCE, DEFERRED_PAYMENT}"
        actor: TradeFinanceOfficer
        preconditions:
          - "Presentation.settlement_status == CLAIM_LODGED"
          - "SettlementClaim.status == LODGED"
          - "Presentation.maturity_date IS NOT null, else ERR_INVALID_REQUEST"
          - "The latest ScreeningCheck with scope == PRESENTED_DOCUMENTS for this presentation has result IN {CLEAR, RELEASED}; HIT_PENDING_REVIEW gives ERR_SCREENING_NOT_CLEARED (409), ESCALATED gives ERR_DUAL_USE_ESCALATED (409) and BLOCKED gives ERR_SANCTIONS_BLOCK (403)"
        side_effects:
          - "Compute variant_applied = ACCEPTANCE_AT_MATURITY and the fee/proceeds fields via calculations.settlement_proceeds; set status = SETTLED, settled_at, settled_by_user_id"
          - "DocumentaryCredit.reserved_cents is NOT released: the bank's undertaking runs until maturity"
          - "Increments Presentation.version by 1"
      - from: ACCEPTED
        to: MATURED
        trigger: "POST /_ops/run-expiry-sweep"
        actor: system
        preconditions:
          - "Presentation.settlement_status == ACCEPTED"
          - "logical clock date >= Presentation.maturity_date"
        side_effects:
          - "Increments Presentation.version by 1"
      - from: MATURED
        to: CLAIM_LODGED
        trigger: "POST /presentations/{id}/settlement-claims with claim_type == REIMBURSEMENT"
        actor: CorrespondentBank
        preconditions:
          - "Presentation.settlement_status == MATURED"
          - "X-User-ID == Presentation.presenting_bank_id, else ERR_PRINCIPAL_NOT_PARTY"
          - "claimed_amount_cents == Presentation.drawn_amount_cents, else ERR_CLAIM_AMOUNT_MISMATCH"
        side_effects:
          - "Create a second SettlementClaim with claim_type = REIMBURSEMENT, status = LODGED"
          - "Increments Presentation.version by 1"
        note: "Second visit to CLAIM_LODGED: the settlement dimension is cyclic through CLAIM_LODGED for usance credits."
      - from: CLAIM_LODGED
        to: REIMBURSED
        trigger: "POST /settlement-claims/{id}/settle when SettlementClaim.claim_type == REIMBURSEMENT"
        actor: TradeFinanceOfficer
        preconditions:
          - "Presentation.settlement_status == CLAIM_LODGED"
          - "SettlementClaim.status == LODGED"
          - "The latest ScreeningCheck with scope == PRESENTED_DOCUMENTS for this presentation has result IN {CLEAR, RELEASED}; HIT_PENDING_REVIEW gives ERR_SCREENING_NOT_CLEARED (409), ESCALATED gives ERR_DUAL_USE_ESCALATED (409) and BLOCKED gives ERR_SANCTIONS_BLOCK (403)"
        side_effects:
          - "Compute variant_applied = SIGHT_HONOUR with discount_cents = 0 (the discount was already taken at acceptance); set status = SETTLED"
          - "CASCADE: DocumentaryCredit.drawn_settled_cents rises by drawn_amount_cents and reserved_cents falls by the same amount"
          - "Increments Presentation.version by 1"
      - from: UNSETTLED
        to: VOID
        trigger: "system event: Presentation.examination_status DISCREPANT -> REFUSED"
        actor: system
        preconditions:
          - "Presentation.settlement_status == UNSETTLED"
        side_effects:
          - "CASCADE: DocumentaryCredit.reserved_cents falls by drawn_amount_cents (cascade hop 2 of the refusal chain)"
          - "Increments Presentation.version by 1"
        note: "The two dimensions are independent everywhere else: submit/conclude/waiver moves examination_status with settlement_status pinned at UNSETTLED, and settle moves settlement_status with examination_status pinned at COMPLYING."

  - entity: WaiverRequest
    dimension: status
    initial_state: PENDING
    terminal_states: [GRANTED, DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /waiver-requests/{id}/respond with decision == GRANT"
        actor: ApplicantUser
        preconditions:
          - "WaiverRequest.status == PENDING"
          - "X-User-ID == DocumentaryCredit.applicant_id of the presentation's credit, else ERR_PRINCIPAL_NOT_PARTY"
          - "logical clock instant <= WaiverRequest.deadline_at, else ERR_WAIVER_WINDOW_CLOSED"
        side_effects:
          - "Set responded_at, applicant_note; cited Discrepancy rows move IDENTIFIED -> WAIVED"
          - "CASCADE: Presentation.examination_status moves to COMPLYING when discrepancy_count reaches 0, otherwise back to DISCREPANT"
          - "Increments WaiverRequest.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /waiver-requests/{id}/respond with decision == DENY"
        actor: ApplicantUser
        preconditions:
          - "WaiverRequest.status == PENDING"
          - "X-User-ID == DocumentaryCredit.applicant_id of the presentation's credit, else ERR_PRINCIPAL_NOT_PARTY"
          - "logical clock instant <= WaiverRequest.deadline_at, else ERR_WAIVER_WINDOW_CLOSED"
        side_effects:
          - "Set responded_at, applicant_note; cited Discrepancy rows move IDENTIFIED -> UPHELD"
          - "CASCADE: Presentation.examination_status WAIVER_REQUESTED -> DISCREPANT"
          - "Increments WaiverRequest.version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /_ops/run-expiry-sweep"
        actor: system
        preconditions:
          - "WaiverRequest.status == PENDING"
          - "logical clock instant > WaiverRequest.deadline_at"
        side_effects:
          - "Cited Discrepancy rows move IDENTIFIED -> UPHELD"
          - "CASCADE: Presentation.examination_status WAIVER_REQUESTED -> DISCREPANT"
          - "Increments WaiverRequest.version by 1"

  - entity: ScreeningCheck
    dimension: result
    initial_state: PENDING
    terminal_states: [CLEAR, BLOCKED, RELEASED, ESCALATED]
    transitions:
      - from: PENDING
        to: CLEAR
        trigger: "system event inside POST /presentations/{id}/screenings or the credit-issuance cascade"
        actor: system
        preconditions:
          - "calculations.sanctions_dual_use_score risk_score < SANCTIONS_REVIEW_SCORE"
        side_effects:
          - "Persist country_hits, dual_use_hits, keyword_hits, transit_hits, risk_score"
          - "Increments ScreeningCheck.version by 1"
      - from: PENDING
        to: HIT_PENDING_REVIEW
        trigger: "system event inside POST /presentations/{id}/screenings or the credit-issuance cascade"
        actor: system
        preconditions:
          - "SANCTIONS_REVIEW_SCORE <= risk_score < SANCTIONS_BLOCK_SCORE"
        side_effects:
          - "Persist the hit counters and risk_score"
          - "Increments ScreeningCheck.version by 1"
      - from: PENDING
        to: BLOCKED
        trigger: "system event inside POST /presentations/{id}/screenings"
        actor: system
        preconditions:
          - "risk_score >= SANCTIONS_BLOCK_SCORE"
        side_effects:
          - "Persist the hit counters and risk_score"
          - "CASCADE: when scope == PRESENTED_DOCUMENTS, Beneficiary.status of the credit's beneficiary moves ACTIVE -> BLOCKED, which itself bars that beneficiary from being named on any new credit"
          - "Increments ScreeningCheck.version by 1"
        note: "For scope == CREDIT_PARTIES a BLOCKED score aborts POST /credits/{id}/issue with ERR_SANCTIONS_BLOCK and no ScreeningCheck row is persisted."
      - from: HIT_PENDING_REVIEW
        to: RELEASED
        trigger: "POST /screening-checks/{id}/review with decision == RELEASE"
        actor: ComplianceOfficer
        preconditions:
          - "ScreeningCheck.result == HIT_PENDING_REVIEW"
          - "X-User-ID != ScreeningCheck.screened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Set reviewed_by_user_id, reviewed_at, review_note"
          - "Increments ScreeningCheck.version by 1"
      - from: HIT_PENDING_REVIEW
        to: BLOCKED
        trigger: "POST /screening-checks/{id}/review with decision == BLOCK"
        actor: ComplianceOfficer
        preconditions:
          - "ScreeningCheck.result == HIT_PENDING_REVIEW"
          - "X-User-ID != ScreeningCheck.screened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Set reviewed_by_user_id, reviewed_at, review_note"
          - "CASCADE: when scope == PRESENTED_DOCUMENTS, Beneficiary.status ACTIVE -> BLOCKED"
          - "Increments ScreeningCheck.version by 1"
      - from: HIT_PENDING_REVIEW
        to: ESCALATED
        trigger: "POST /screening-checks/{id}/review with decision == ESCALATE"
        actor: ComplianceOfficer
        preconditions:
          - "ScreeningCheck.result == HIT_PENDING_REVIEW"
          - "X-User-ID != ScreeningCheck.screened_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Set reviewed_by_user_id, reviewed_at, review_note"
          - "This is the THIRD branch of the review fork and its side-effect set is deliberately different from both siblings: unlike RELEASE it does not unblock settlement, and unlike BLOCK it does NOT cascade to Beneficiary.status - the beneficiary stays ACTIVE and the presentation stays settleable-in-principle, only barred pending an external licence decision"
          - "Increments ScreeningCheck.version by 1"
        note: "ESCALATED is terminal: the dual-use question has left the bank's hands, so there is no edge back to HIT_PENDING_REVIEW. Settlement attempts return ERR_DUAL_USE_ESCALATED (409)."

  - entity: Discrepancy
    dimension: status
    initial_state: IDENTIFIED
    terminal_states: [WAIVED, UPHELD]
    transitions:
      - from: IDENTIFIED
        to: WAIVED
        trigger: "system event: WaiverRequest PENDING -> GRANTED citing this code"
        actor: system
        preconditions:
          - "Discrepancy.status == IDENTIFIED"
          - "Discrepancy.severity == MINOR"
        side_effects:
          - "CASCADE: Presentation.discrepancy_count recomputes (WAIVED rows are excluded)"
          - "Increments Discrepancy.version by 1"
      - from: IDENTIFIED
        to: UPHELD
        trigger: "system event: WaiverRequest PENDING -> DENIED or PENDING -> EXPIRED citing this code, or Presentation DISCREPANT -> REFUSED"
        actor: system
        preconditions:
          - "Discrepancy.status == IDENTIFIED"
        side_effects:
          - "Presentation.discrepancy_count is unchanged (UPHELD rows still count)"
          - "Increments Discrepancy.version by 1"

# =========================================================================
# §1.2.1 Concurrency Rules
# Only true races survive the serial-observability filter: both entries below
# describe a CREATE that the product spec allows to legitimately supersede or
# stack on a prior one, so a second strictly-sequential request would succeed
# on its own merits. OCC on the parent's `version` is the only mechanism used.
# =========================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-credit
    parent_entity: DocumentaryCredit
    write_endpoint: "POST /credits/{id}/amendments"
    occ_field: "expected_credit_version"
    description: |
      Creating an Amendment against a DocumentaryCredit whose version has
      advanced since the client last read it is rejected. This is the
      supersede case: a newer DRAFT amendment legitimately moves any prior
      DRAFT amendment of the same credit to SUPERSEDED (see the Amendment
      DRAFT -> SUPERSEDED transition), so a writer holding a stale view of
      the credit would silently discard an amendment it never saw.
    error_id: ERR_STALE_CREDIT_VERSION
    http_status: 412

  - rule_id: collateral-posting-stale-facility
    parent_entity: CreditFacility
    write_endpoint: "POST /facilities/{id}/collateral-postings"
    occ_field: "expected_facility_version"
    description: |
      Posting collateral against a CreditFacility whose version has advanced
      since the client last read it is rejected. Collateral postings stack
      additively and a second sequential posting would succeed on its own
      merits, so nothing in §1.2 or §1.4 can reject it; only a stale-version
      check can, and the check matters because the facility's version also
      advances whenever an issuance cascade recomputes allocated_cents, which
      changes how much collateral credit a given posting will actually buy.
    error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412

# =========================================================================
# §1.3 Calculation Rules Table
# All money is integer minor units (cents). `round_half_up(x)` rounds an exact
# rational to the nearest integer cent, .5 away from zero. `floor_div(a, b)`
# is integer floor division. No calculation anywhere in this scaffold reads
# an entity `id`; every order-sensitive step sorts on domain fields and falls
# back to `created_at ASC`.
# =========================================================================
calculations:
  - name: credit_allocation_exposure
    trigger: "POST /credits (draft estimate), POST /credits/{id}/submit-for-approval (re-estimate), POST /credits/{id}/issue (committed figure), and the Amendment PENDING_CONSENT -> ACCEPTED / ISSUED -> ACCEPTED transitions (re-committed figure)"
    algorithm: threshold
    formula: |
      # step 1 - drawable ceiling
      max_drawable_cents = floor_div(amount_cents * (100 + tolerance_eff_pct), 100)

      # step 2 - usance risk add-on (whole months, rounded UP)
      tenor_months      = 0 if available_by == 'SIGHT_PAYMENT' else ceil(tenor_eff_days / 30)
      tenor_addon_cents = floor_div(max_drawable_cents * TENOR_RISK_BPS_PER_MONTH * tenor_months, 10000)

      # step 3 - gross exposure
      gross_exposure_cents = max_drawable_cents + tenor_addon_cents

      # step 4 - eligible collateral credit: the SMALLER of what the applicant
      #          actually posted (after advance-rate haircut) and what the
      #          facility's collateral policy will recognise for this exposure
      collateral_cap_posted_cents = floor_div(CreditFacility.collateral_posted_cents * COLLATERAL_ADVANCE_RATE_PCT, 100)
      collateral_cap_policy_cents = floor_div(gross_exposure_cents * CreditFacility.collateral_required_pct, 100)
      collateral_credit_cents     = min(collateral_cap_posted_cents, collateral_cap_policy_cents)

      # step 5 - net allocation
      committed_allocation_cents = gross_exposure_cents - collateral_credit_cents
    input_set: "Exactly one DocumentaryCredit plus the CreditFacility named by its facility_id. CreditFacility.collateral_posted_cents is read at the instant of the calculation (postings accepted later do not retroactively shrink an existing allocation). No other credit's figures enter."
    constants:
      TENOR_RISK_BPS_PER_MONTH: 25
      COLLATERAL_ADVANCE_RATE_PCT: 90
    precision: "integer cents; floor_div everywhere in this rule (never round_half_up), so the bank never under-reserves"
    variants:
      - name: provisional_draft
        when: "Runs on POST /credits and POST /credits/{id}/submit-for-approval; output is written to DocumentaryCredit.provisional_allocation_cents"
        difference: "tolerance_eff_pct = 0 and tenor_eff_days = 0 regardless of the credit's declared tolerance_pct / tenor_days, because a draft is not yet an undertaking. NOTHING is written to FacilityAllocation and CreditFacility.allocated_cents is untouched."
      - name: committed_issuance
        when: "Runs on POST /credits/{id}/issue and on every accepted Amendment; output is written to DocumentaryCredit.committed_allocation_cents and to FacilityAllocation.allocated_cents"
        difference: "tolerance_eff_pct = tolerance_pct and tenor_eff_days = tenor_days, so both the upward drawing tolerance and the usance add-on are reserved. For identical inputs this returns a strictly larger number than provisional_draft whenever tolerance_pct > 0 or tenor_days > 0."

  - name: issuance_charges
    trigger: "POST /credits/{id}/issue (steps 1-3 and 5), POST /credits/{id}/confirmation-responses with decision == CONFIRM (step 4), Amendment -> ACCEPTED (variant amendment_recharge)"
    algorithm: tiered_pricing
    formula: |
      # ---- PINNED EVALUATION ORDER -------------------------------------
      # This rule LOOKS circular: the facility is occupied by
      # chargeable_utilisation_cents = committed_allocation_cents + total_charge_cents,
      # and it is tempting to select the commission tier from that occupied
      # amount. The order below is normative and must not be re-arranged.
      #
      # 1. gross_exposure_cents comes from credit_allocation_exposure step 3
      #    and depends ONLY on credit fields + facility collateral policy.
      # 2. The commission tier is selected from gross_exposure_cents ALONE.
      #    It is NOT selected from committed_allocation_cents, NOT from
      #    chargeable_utilisation_cents, and NOT from any total that already
      #    contains a charge.
      # 3. base_commission_cents is computed with that tier.
      # 4. confirmation_charge_cents is computed from gross_exposure_cents and
      #    the confirming Bank.country_risk_score - never from a total.
      # 5. total_charge_cents and chargeable_utilisation_cents are computed
      #    LAST and feed nothing above them.
      # ------------------------------------------------------------------

      validity_days = (date(expiry_date) - date(issue_date)).days + 1        # both ends inclusive
      quarters      = ceil(validity_days / DAYS_PER_QUARTER)                  # minimum 1

      if   gross_exposure_cents <= COMMISSION_TIER_1_CAP_CENTS: commission_bps_applied = COMMISSION_TIER_1_BPS
      elif gross_exposure_cents <= COMMISSION_TIER_2_CAP_CENTS: commission_bps_applied = COMMISSION_TIER_2_BPS
      else:                                                     commission_bps_applied = COMMISSION_TIER_3_BPS

      base_commission_cents = max(
          MIN_COMMISSION_CENTS,
          round_half_up(gross_exposure_cents * commission_bps_applied * quarters / 10000))

      if confirming_bank_id IS null or confirmation_status != 'CONFIRMED':
          confirmation_charge_cents = 0
      else:
          confirm_bps = CONFIRM_BASE_BPS + Bank.country_risk_score * CONFIRM_RISK_BPS_PER_POINT
          confirmation_charge_cents = round_half_up(gross_exposure_cents * confirm_bps * quarters / 10000)

      total_charge_cents           = base_commission_cents + confirmation_charge_cents
      chargeable_utilisation_cents = committed_allocation_cents + total_charge_cents
    input_set: "One DocumentaryCredit; the confirming Bank only when confirmation_status == CONFIRMED. quarters uses the credit's own issue_date and expiry_date, both ends inclusive."
    constants:
      COMMISSION_TIER_1_CAP_CENTS: 5000000
      COMMISSION_TIER_2_CAP_CENTS: 50000000
      COMMISSION_TIER_1_BPS: 15
      COMMISSION_TIER_2_BPS: 10
      COMMISSION_TIER_3_BPS: 7
      MIN_COMMISSION_CENTS: 25000
      CONFIRM_BASE_BPS: 20
      CONFIRM_RISK_BPS_PER_POINT: 1
      DAYS_PER_QUARTER: 90
      AMENDMENT_FEE_CENTS: 7500
    precision: "2 decimal places already implied by integer cents; round_half_up applied once per charge component, never to a running total"
    variants:
      - name: amendment_recharge
        when: "An Amendment reaches ACCEPTED"
        difference: "amendment_fee_cents = AMENDMENT_FEE_CENTS when exposure_delta_cents <= 0; when exposure_delta_cents > 0 it is AMENDMENT_FEE_CENTS + round_half_up(exposure_delta_cents * recharge_bps * quarters_remaining / 10000) where quarters_remaining = ceil(((date(expiry_date) - clock date).days + 1) / DAYS_PER_QUARTER) and recharge_bps is selected by the same three-tier ladder keyed on the NEW gross_exposure_cents alone. recharge_bps is a LOCAL value used only to price this fee - it is never written back to DocumentaryCredit.commission_bps_applied, which keeps the tier chosen at issuance for the life of the credit. The fee is computed once, when the amendment is issued, and is not recomputed if the beneficiary later rejects it."

  - name: settlement_proceeds
    trigger: "POST /settlement-claims/{id}/settle"
    algorithm: waterfall_allocation
    formula: |
      # step 1 - commission (single round on the whole drawn amount)
      commission_bps_applied = SIGHT_COMMISSION_BPS if DocumentaryCredit.available_by == 'SIGHT_PAYMENT'
                               else NEGOTIATION_COMMISSION_BPS
      commission_cents = round_half_up(drawn_amount_cents * commission_bps_applied / 10000)

      # step 2 - PINNED ROUNDING ORDER: round EACH document's fee to whole
      #          cents FIRST, then sum the rounded values. Summing the exact
      #          per-document amounts and rounding once at the end is WRONG and
      #          differs by up to (document_count / 2) cents.
      doc_examination_fee_cents = 0
      for d in PresentedDocument rows of this presentation, ordered by created_at ASC:
          if d.doc_type == 'COMMERCIAL_INVOICE':
              doc_examination_fee_cents += round_half_up(d.invoice_amount_cents * DOC_FEE_BPS / 10000)
          else:
              doc_examination_fee_cents += DOC_FLAT_FEE_CENTS

      # step 3 - discount charge (usance only)
      if variant == 'SIGHT_HONOUR':
          days_to_maturity = 0
          discount_cents   = 0
      else:
          days_to_maturity = (date(Presentation.maturity_date) - clock date).days
          discount_cents   = round_half_up(drawn_amount_cents * DISCOUNT_RATE_BPS * days_to_maturity
                                           / (10000 * DISCOUNT_DAY_BASIS))

      # step 4 - waterfall: charges are deducted from the drawn amount in the
      #          fixed order commission -> discount -> document fees, and the
      #          net can never go below zero
      net_proceeds_cents = drawn_amount_cents - commission_cents - discount_cents - doc_examination_fee_cents
      if net_proceeds_cents < 0: raise ERR_CHARGES_EXCEED_PROCEEDS
    input_set: "One Presentation, all of its PresentedDocument rows (every row contributes a fee, not only invoices), and its DocumentaryCredit. drawn_amount_cents is the value frozen at submit time, not a re-sum at settlement time."
    constants:
      SIGHT_COMMISSION_BPS: 12
      NEGOTIATION_COMMISSION_BPS: 20
      DISCOUNT_RATE_BPS: 450
      DISCOUNT_DAY_BASIS: 360
      DOC_FEE_BPS: 5
      DOC_FLAT_FEE_CENTS: 3500
    precision: "integer cents; round_half_up applied once per document and once per charge component (step 2's per-document rounding is the pinned order)"
    variants:
      - name: SIGHT_HONOUR
        when: "SettlementClaim.claim_type == PAYMENT (credit available_by == SIGHT_PAYMENT), or claim_type == REIMBURSEMENT"
        difference: "commission_bps_applied = SIGHT_COMMISSION_BPS (12) and discount_cents = 0. For an identical presentation this yields a strictly larger net_proceeds_cents than NEGOTIATION_UNDER_DISCOUNT."
      - name: NEGOTIATION_UNDER_DISCOUNT
        when: "SettlementClaim.claim_type == NEGOTIATION (credit available_by == NEGOTIATION)"
        difference: "commission_bps_applied = NEGOTIATION_COMMISSION_BPS (20) and discount_cents is charged for the whole run from the settlement date to maturity_date on a 360-day basis. Same drawn amount, same documents, materially smaller proceeds."
      - name: ACCEPTANCE_AT_MATURITY
        when: "SettlementClaim.claim_type IN {ACCEPTANCE, DEFERRED_PAYMENT}"
        difference: "Identical arithmetic to NEGOTIATION_UNDER_DISCOUNT, but DocumentaryCredit.reserved_cents is NOT released and drawn_settled_cents is NOT increased until the REIMBURSEMENT claim settles after maturity."

  - name: facility_exposure_ledger
    trigger: "Every FacilityAllocation insert, charge_cents change, or OPEN -> RELEASED flip (i.e. cascade hop 2 of issuance, confirmation, amendment acceptance, cancellation and expiry)"
    algorithm: aggregation
    formula: |
      CreditFacility.allocated_cents =
          SUM(FacilityAllocation.allocated_cents + FacilityAllocation.charge_cents)
          OVER FacilityAllocation rows WHERE facility_id == this facility
                                         AND status == 'OPEN'
      CreditFacility.available_cents        = CreditFacility.limit_cents - CreditFacility.allocated_cents
      CreditFacility.restrict_threshold_cents = floor_div(CreditFacility.limit_cents * FACILITY_RESTRICT_PCT, 100)
      CreditFacility.utilisation_posture =
          'FROZEN'     if CreditFacility.status == 'CLOSED'
          else 'RESTRICTED' if CreditFacility.allocated_cents >= CreditFacility.restrict_threshold_cents
          else 'OPEN'
    input_set: "FacilityAllocation rows of this facility with status == OPEN. RELEASED rows are excluded entirely - their released_cents is a historical record only. Rows are summed in created_at ASC order; the sum is order-independent but the order is pinned so that any intermediate overflow check is reproducible."
    constants:
      FACILITY_RESTRICT_PCT: 95
    precision: "exact integers; no rounding occurs in this rule, which is what makes the conservation invariant hold to the cent"

  - name: credit_drawable_ledger
    trigger: "POST /presentations/{id}/submit, POST /settlement-claims/{id}/settle, Presentation settlement_status -> VOID, and every accepted Amendment that changes amount_cents or tolerance_pct"
    algorithm: aggregation
    formula: |
      LIVE_SET   = Presentation rows of this credit WHERE settlement_status IN {'UNSETTLED','CLAIM_LODGED','ACCEPTED','MATURED'}
                                                     AND examination_status IN {'UNDER_EXAMINATION','COMPLYING','DISCREPANT','WAIVER_REQUESTED','PRECLUDED'}
      SETTLED_SET = Presentation rows of this credit WHERE settlement_status IN {'PAID','NEGOTIATED','REIMBURSED'}

      DocumentaryCredit.reserved_cents      = SUM(drawn_amount_cents) OVER LIVE_SET
      DocumentaryCredit.drawn_settled_cents = SUM(drawn_amount_cents) OVER SETTLED_SET
      DocumentaryCredit.available_cents     = max_drawable_cents - reserved_cents - drawn_settled_cents
    input_set: "Presentation rows of this credit only. A presentation in examination_status == RECEIVED has not yet frozen drawn_amount_cents and is excluded from both sets; a presentation whose settlement_status == VOID is excluded from both sets, which is exactly what makes refusal a clean compensating action."
    constants: {}
    precision: "exact integers; available_cents is never allowed to be negative (the submit precondition rejects the drawing first)"

  - name: collateral_posted_ledger
    trigger: "POST /facilities/{id}/collateral-postings"
    algorithm: aggregation
    formula: |
      CreditFacility.collateral_posted_cents = previous value + amount_cents      # amount_cents may be negative (a release)
      reject with ERR_COLLATERAL_RELEASE_EXCEEDS_POSTED when the result would be < 0
      reject with ERR_COLLATERAL_RELEASE_BLOCKED when amount_cents < 0 and the release would leave
             collateral_posted_cents below SUM(collateral_credit_cents) already granted to OPEN allocations
    input_set: "One CreditFacility; postings are applied in arrival order (created_at ASC of the accepted requests)"
    constants: {}
    precision: "exact integers"

  - name: examination_period_deadline
    trigger: "POST /presentations/{id}/submit"
    algorithm: interval_merge
    formula: |
      # EXAMINATION_BANKING_DAYS banking days FOLLOWING the day of presentation.
      # A banking day is Monday..Friday. There is no holiday calendar - Saturday
      # and Sunday are the only non-banking days, so the rule is fully
      # reproducible from the date alone.
      d = date(Presentation.received_date)
      counted = 0
      while counted < EXAMINATION_BANKING_DAYS:
          d = d + 1 day
          if weekday(d) NOT IN {SATURDAY, SUNDAY}: counted = counted + 1
      Presentation.examination_deadline = d at 23:59:59.999Z      # CLOSED upper bound
    input_set: "One Presentation's received_date. The day of presentation itself is never counted, even when it is a banking day."
    constants:
      EXAMINATION_BANKING_DAYS: 5
      WAIVER_RESPONSE_DAYS: 2
    precision: "millisecond; the deadline instant itself is INSIDE the period (a refusal notice stamped exactly 23:59:59.999Z on the fifth banking day is timely; 23:59:59.999Z + 1ms is not)"

  - name: presentation_window
    trigger: "POST /credits/{id}/issue and every accepted Amendment that changes expiry_date, latest_shipment_date or presentation_period_days"
    algorithm: interval_merge
    formula: |
      shipment_cutoff_date          = date(latest_shipment_date) + presentation_period_days
      presentation_deadline_date    = min(date(expiry_date), shipment_cutoff_date)   # CLOSED upper bound
      confirmation_window_start     = date(issue_date)                              # inclusive
      confirmation_window_end       = date(expiry_date) + presentation_period_days   # EXCLUSIVE
      reject at POST /credits with ERR_SHIPMENT_AFTER_EXPIRY when latest_shipment_date > expiry_date
    input_set: "One DocumentaryCredit's own date fields"
    constants: {}
    precision: "whole days; presentation_deadline_date is inclusive, confirmation_window_end is exclusive - the two windows deliberately use different boundary conventions"

  - name: confirming_line_peak_occupancy
    trigger: "POST /credits/{id}/confirmation-requests (as an admission check) and POST /credits/{id}/confirmation-responses (recompute after the outcome)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics with AGGREGATE capacity: a bank's line is
      # sized against the PEAK concurrent occupancy, computed by a sweep over
      # interval endpoints, not against any pairwise comparison and not against
      # a lifetime total.
      OCCUPATIONS = DocumentaryCredit rows WHERE confirming_bank_id == this bank
                                            AND confirmation_status IN {'CONFIRMATION_REQUESTED','CONFIRMED'}
                                            AND status IN {'ISSUED','AMENDMENT_PENDING','UTILISED'}
      # each occupation contributes weight gross_exposure_cents over
      # [confirmation_window_start, confirmation_window_end)   -- END EXCLUSIVE
      events = []
      for o in OCCUPATIONS + (the candidate credit, when this is an admission check):
          events.append((o.confirmation_window_start, +o.gross_exposure_cents))
          events.append((o.confirmation_window_end,   -o.gross_exposure_cents))
      sort events by (date ASC, delta ASC)          # -x sorts before +x on the SAME date,
                                                    # which is what makes the interval half-open:
                                                    # an occupation ending on date D frees the line
                                                    # before an occupation starting on date D takes it
      running = 0; peak = 0
      for (date, delta) in events: running += delta; peak = max(peak, running)
      Bank.confirming_line_used_cents = peak
      admission check: reject with ERR_CONFIRMING_LINE_WINDOW_FULL when peak > Bank.confirmation_appetite_cents
    input_set: "All DocumentaryCredit rows naming this bank as confirming_bank_id with confirmation_status IN {CONFIRMATION_REQUESTED, CONFIRMED} and status IN {ISSUED, AMENDMENT_PENDING, UTILISED}. CANCELLED, EXPIRED and CONFIRMATION_DECLINED credits release their occupation immediately."
    constants:
      MAX_CONFIRM_COUNTRY_RISK: 60
    precision: "exact integers; the admission check uses `peak > appetite` so peak == appetite is admitted"

  - name: amendment_window_overlap
    trigger: "POST /amendments/{id}/issue"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a symmetric COOLING-OFF BUFFER, evaluated
      # PAIRWISE against every other amendment of the same credit. Contrast
      # with confirming_line_peak_occupancy: touching endpoints DO collide here,
      # and there is no capacity to aggregate - one conflicting neighbour is
      # enough.
      new_start = clock date
      new_end   = new_start + AMENDMENT_CONSENT_DAYS                        # inclusive
      for a in Amendment rows WHERE credit_id == this credit AND id != this amendment,
               ordered by created_at ASC:
          if a.status == 'SUPERSEDED': continue                            # never occupied a window
          other_start = a.consent_window_start
          other_end   = a.window_end_effective        # consent_deadline_date while live,
                                                      # resolution date once terminal
          if other_start IS null: continue                                  # still DRAFT
          if new_start <= other_end + AMENDMENT_COOLING_OFF_DAYS
             AND new_end >= other_start - AMENDMENT_COOLING_OFF_DAYS:
              raise ERR_AMENDMENT_WINDOW_CONFLICT
    input_set: "Amendment rows of the same credit with consent_window_start IS NOT null and status != SUPERSEDED. Terminal amendments still occupy their window up to window_end_effective plus the buffer, which is what enforces the cooling-off period between negotiation rounds."
    constants:
      AMENDMENT_CONSENT_DAYS: 10
      AMENDMENT_COOLING_OFF_DAYS: 2
    precision: "whole days; both interval ends are inclusive and the buffer is applied to both ends"

  - name: confirming_bank_selection
    trigger: "POST /credits/{id}/confirmation-requests when confirming_bank_id is omitted from the request body"
    algorithm: weighted_scoring
    formula: |
      # (a) ELIGIBILITY FILTER - explicit predicate over Bank fields
      CANDIDATES = Bank rows WHERE status == 'ACTIVE'
                               AND sanctions_flag == false
                               AND country_risk_score <= MAX_CONFIRM_COUNTRY_RISK
                               AND country_code != Beneficiary.country_code of this credit
                               AND id != every Bank that has already returned
                                   decision == DECLINE on this credit
                                   (i.e. this bank is excluded on retry)
                               AND confirming_line_peak_occupancy(bank, including this credit)
                                   <= bank.confirmation_appetite_cents

      # (b) RANKING EXPRESSION - over Bank fields only, higher wins
      rating_points = {AA: 100, A: 75, BBB: 50, BB: 25}[credit_rating]
      eligibility_score = (100 - country_risk_score) * COUNTRY_WEIGHT + rating_points * RATING_WEIGHT

      # (c) TIE-BREAK, applied in order
      #     1. lower country_risk_score wins
      #     2. earlier created_at wins            (never `id`)
      # (d) EMPTY CANDIDATE SET
      #     raise ERR_NO_ELIGIBLE_CONFIRMING_BANK (422). There is no deferred
      #     queue: the credit stays UNCONFIRMED / CONFIRMATION_DECLINED.
    input_set: "All Bank rows, filtered by (a). The credit's own Beneficiary.country_code and the set of banks that previously declined this credit are the only non-Bank inputs."
    constants:
      COUNTRY_WEIGHT: 6
      RATING_WEIGHT: 4
      MAX_CONFIRM_COUNTRY_RISK: 60
    precision: "integer score; no rounding"

  - name: sanctions_dual_use_score
    trigger: "POST /presentations/{id}/screenings (scope PRESENTED_DOCUMENTS) and the POST /credits/{id}/issue cascade (scope CREDIT_PARTIES)"
    algorithm: weighted_scoring
    formula: |
      if scope == 'PRESENTED_DOCUMENTS':
          country_hits  = count of PresentedDocument rows of this presentation where
                          consignee_country IN SANCTIONED_COUNTRY_CODES
                          OR any element of transit_country_codes IN SANCTIONED_COUNTRY_CODES
                          (a document with several such matches counts ONCE)
          dual_use_hits = count of PresentedDocument rows whose hs_code first 4 characters
                          are in DUAL_USE_HS_PREFIXES
          keyword_hits  = count of PresentedDocument rows whose lowercased goods_description
                          contains any CONTROLLED_KEYWORDS entry as a substring
          transit_hits  = count of (document, transit code) pairs where the transit code is in
                          HIGH_RISK_TRANSIT_CODES and NOT in SANCTIONED_COUNTRY_CODES
      else:   # CREDIT_PARTIES
          country_hits  = count of parties among {Applicant, Beneficiary, advising Bank}
                          whose country_code IN SANCTIONED_COUNTRY_CODES,
                          PLUS 1 for each of those parties whose sanctions_flag == true
          dual_use_hits = 0; keyword_hits = 0; transit_hits = 0

      risk_score = min(SCORE_CAP,
                         COUNTRY_HIT_WEIGHT   * country_hits
                       + DUAL_USE_HIT_WEIGHT  * dual_use_hits
                       + KEYWORD_HIT_WEIGHT   * keyword_hits
                       + TRANSIT_HIT_WEIGHT   * transit_hits)

      result = 'BLOCKED'            if risk_score >= SANCTIONS_BLOCK_SCORE
               else 'HIT_PENDING_REVIEW' if risk_score >= SANCTIONS_REVIEW_SCORE
               else 'CLEAR'
    input_set: "For PRESENTED_DOCUMENTS: every PresentedDocument row of the presentation, including non-invoice documents. For CREDIT_PARTIES: exactly the applicant, the beneficiary and the advising bank of the credit (the confirming bank is screened separately at confirmation time via the ERR_CONFIRMING_BANK_INELIGIBLE precondition)."
    constants:
      SANCTIONED_COUNTRY_CODES: ["IR", "KP", "SY", "CU"]
      HIGH_RISK_TRANSIT_CODES: ["AE", "HK", "TR"]
      DUAL_USE_HS_PREFIXES: ["8471", "8542", "9013", "2811"]
      CONTROLLED_KEYWORDS: ["centrifuge", "maraging", "gyroscope"]
      COUNTRY_HIT_WEIGHT: 100
      DUAL_USE_HIT_WEIGHT: 60
      KEYWORD_HIT_WEIGHT: 40
      TRANSIT_HIT_WEIGHT: 20
      SANCTIONS_REVIEW_SCORE: 40
      SANCTIONS_BLOCK_SCORE: 100
      SCORE_CAP: 200
    precision: "integer score; both thresholds are inclusive lower bounds (>=), so 40 reviews and 100 blocks"

  - name: amendment_consent_requirement
    trigger: "POST /amendments/{id}/issue"
    algorithm: constraint_propagation
    formula: |
      # Bank product rule (deliberate, and narrower than a blanket
      # "all amendments need consent"): a change that can only IMPROVE the
      # beneficiary's position takes effect on issuance; anything that reduces
      # the beneficiary's rights is held for consent.
      requires_beneficiary_consent = true when ANY of the following holds for change_set:
        - 'amount_cents'              present and new < DocumentaryCredit.amount_cents
        - 'tolerance_pct'             present and new < DocumentaryCredit.tolerance_pct
        - 'expiry_date'               present and new < DocumentaryCredit.expiry_date
        - 'latest_shipment_date'      present and new < DocumentaryCredit.latest_shipment_date
        - 'presentation_period_days'  present and new < DocumentaryCredit.presentation_period_days
        - 'incoterm'                  present and new != DocumentaryCredit.incoterm
        - 'incoterm_place'            present and new != DocumentaryCredit.incoterm_place
        - 'partial_shipment_allowed'  present and new == false and current == true
        - 'transhipment_allowed'      present and new == false and current == true
      otherwise false

      exposure_delta_cents = credit_allocation_exposure(committed_issuance, credit AFTER change_set)
                             - DocumentaryCredit.committed_allocation_cents
    input_set: "One Amendment's change_set compared field-by-field against the current DocumentaryCredit values. Keys whose new value equals the current value are ignored entirely (a no-op key never triggers consent)."
    constants: {}
    precision: "boolean; exposure_delta_cents in exact integer cents"

# =========================================================================
# §1.4 Validation Rules (ordered)
# The ladder is evaluated strictly by ascending `priority`. Ties inside one
# priority are broken left-to-right in payload/path order.
#
# DOMAIN-SPECIFIC ORDERING DECISION (this is the interesting part of the
# ladder and is deliberately NOT the generic ordering):
#   business_safety (20)  BEFORE  business_temporal (22)
#                         BEFORE  business_constraint (23)
#                         BEFORE  business_referential (24)
#                         BEFORE  business_fiscal (26)
# Rationale: a sanctions or dual-use block is an absolute legal prohibition -
# the bank must refuse before it tells the presenter anything about which
# document was wrong, whether a bank was nominated, or whether the facility
# had headroom. Fiscal capacity is the LAST thing checked, because a facility
# breach is a curable commercial condition while a sanctions hit is not.
# =========================================================================
validations:
  # ---- 1: authentication -------------------------------------------------
  - priority: 1
    category: auth
    rule: "X-User-ID and X-User-Role headers are both present and non-empty on every endpoint including reads"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  # ---- 2: authorization --------------------------------------------------
  - priority: 2
    category: authorization
    rule: "X-User-Role is one of the eight declared roles AND appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 2
    category: authorization
    rule: "For entity_backed roles the acting principal owns the addressed row: ApplicantUser's X-User-ID equals the credit's applicant_id; BeneficiaryUser's X-User-ID equals the credit's beneficiary_id; CorrespondentBank's X-User-ID equals the presenting_bank_id (or the confirming_bank_id on a confirmation response)"
    error_id: ERR_PRINCIPAL_NOT_PARTY
    http_status: 403
    applies_to: "POST /credits/{id}/confirmation-responses, POST /amendments/{id}/consent, POST /waiver-requests/{id}/respond, POST /presentations, POST /presentations/{id}/documents, POST /presentations/{id}/submit, POST /presentations/{id}/settlement-claims"
  - priority: 2
    category: authorization
    rule: "Segregation of duties: X-User-ID must differ from the recorded author of the step being approved (Amendment.drafted_by_user_id on amendment issuance, DocumentaryCredit.drafted_by_user_id on credit approval, ScreeningCheck.screened_by_user_id on screening review)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /credits/{id}/approve, POST /amendments/{id}/issue, POST /screening-checks/{id}/review"

  # ---- 3: shape / existence ---------------------------------------------
  - priority: 3
    category: schema
    rule: "Every field marked required in the endpoint's input is present, of the declared JSON type, and any enum-valued field carries a declared member; integer money and day-count fields are non-negative unless the field explicitly permits a negative (collateral posting amount_cents)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 3
    category: existence
    rule: "Every path id and every FK in the payload resolves to an existing row, checked path-id first and then payload FKs in declaration order"
    error_id: "ERR_APPLICANT_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_BANK_NOT_FOUND | ERR_BENEFICIARY_NOT_FOUND | ERR_CREDIT_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_PRESENTATION_NOT_FOUND | ERR_WAIVER_REQUEST_NOT_FOUND | ERR_SCREENING_CHECK_NOT_FOUND | ERR_SETTLEMENT_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id or FK payload field"

  # ---- 4: state preconditions -------------------------------------------
  - priority: 4
    category: state
    rule: "The addressed row is in a state from which the requested transition exists in its §1.2 machine"
    error_id: "ERR_CREDIT_NOT_DRAFT | ERR_CREDIT_NOT_APPROVED | ERR_CREDIT_NOT_ISSUED | ERR_CREDIT_TERMINAL | ERR_PRESENTATION_NOT_EXAMINABLE | ERR_PRESENTATION_ALREADY_CONCLUDED | ERR_AMENDMENT_NOT_DRAFT | ERR_AMENDMENT_NOT_PENDING_CONSENT | ERR_WAIVER_NOT_PENDING | ERR_CLAIM_NOT_LODGED | ERR_FACILITY_NOT_ACTIVE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 4
    category: state
    rule: "Cross-entity state dependency: the transition's guard on a DIFFERENT entity holds - issuance requires CreditFacility.status == ACTIVE and utilisation_posture != FROZEN; settlement requires the presentation's newest PRESENTED_DOCUMENTS ScreeningCheck to be CLEAR or RELEASED, and a check still sitting at HIT_PENDING_REVIEW returns ERR_SCREENING_NOT_CLEARED here (the BLOCKED and ESCALATED results are deliberately EXCLUDED from this rule - they are adjudicated by the business_safety pair ERR_SANCTIONS_BLOCK / ERR_DUAL_USE_ESCALATED at priority 20, which is the only place a screening result maps to a 403 or to the dual-use error); amendment consent requires the parent credit to still be ISSUED or AMENDMENT_PENDING"
    error_id: "ERR_FACILITY_NOT_ACTIVE | ERR_SCREENING_NOT_CLEARED | ERR_CREDIT_NOT_ISSUED"
    http_status: 409
    applies_to: "POST /credits/{id}/issue, POST /settlement-claims/{id}/settle, POST /amendments/{id}/consent"
  - priority: 4
    category: concurrency
    rule: "expected_credit_version / expected_facility_version equals the addressed parent's current version"
    error_id: "ERR_STALE_CREDIT_VERSION | ERR_STALE_FACILITY_VERSION"
    http_status: 412
    applies_to: "POST /credits/{id}/amendments, POST /facilities/{id}/collateral-postings"

  # ---- 20: business_safety (compliance - absolute prohibition) -----------
  - priority: 20
    category: business_safety
    rule: "No party or document tied to the operation sits behind a BLOCKED ScreeningCheck, and no directly named party carries sanctions_flag == true"
    error_id: ERR_SANCTIONS_BLOCK
    http_status: 403
    applies_to: "POST /credits, POST /credits/{id}/issue, POST /credits/{id}/confirmation-requests, POST /presentations/{id}/submit, POST /presentations/{id}/settlement-claims, POST /settlement-claims/{id}/settle, POST /amendments/{id}/issue"
  - priority: 20
    category: business_safety
    rule: "A presentation whose PRESENTED_DOCUMENTS screening returned HIT_PENDING_REVIEW cannot be concluded, waived or settled until a ComplianceOfficer has reviewed it"
    error_id: ERR_SCREENING_REVIEW_PENDING
    http_status: 409
    applies_to: "POST /presentations/{id}/conclude-examination, POST /presentations/{id}/waiver-requests, POST /settlement-claims/{id}/settle"
  - priority: 20
    category: business_safety
    rule: "A dual-use hit on any presented document requires an explicit ComplianceOfficer decision recorded as RELEASED; an ESCALATED screening never permits settlement"
    error_id: ERR_DUAL_USE_ESCALATED
    http_status: 409
    applies_to: "POST /settlement-claims/{id}/settle"

  # ---- 22: business_temporal (windows, deadlines, clock) ----------------
  - priority: 22
    category: business_temporal
    rule: "latest_shipment_date <= expiry_date at credit creation and after every amendment; expiry_date is strictly after issue_date"
    error_id: ERR_SHIPMENT_AFTER_EXPIRY
    http_status: 422
    applies_to: "POST /credits, POST /credits/{id}/amendments, POST /amendments/{id}/issue"
  - priority: 22
    category: business_temporal
    rule: "A presentation is submitted on or before the credit's presentation_deadline_date = min(expiry_date, latest_shipment_date + presentation_period_days), inclusive of that date"
    error_id: ERR_PRESENTATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /presentations/{id}/submit"
  - priority: 22
    category: business_temporal
    rule: "A refusal notice or an examination conclusion is stamped at or before Presentation.examination_deadline (five banking days following the day of presentation, inclusive to 23:59:59.999Z); past that instant the bank is PRECLUDED and can no longer refuse"
    error_id: ERR_EXAMINATION_PERIOD_EXPIRED
    http_status: 409
    applies_to: "POST /presentations/{id}/conclude-examination, POST /presentations/{id}/refuse, POST /presentations/{id}/discrepancies"
  - priority: 22
    category: business_temporal
    rule: "A waiver response arrives on or before WaiverRequest.deadline_at (inclusive); a refusal that relies on an unanswered waiver may only be issued after that deadline has passed"
    error_id: ERR_WAIVER_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /waiver-requests/{id}/respond"
  - priority: 22
    category: business_temporal
    rule: "A beneficiary consent arrives on or before Amendment.consent_deadline_date (inclusive)"
    error_id: ERR_CONSENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /amendments/{id}/consent"
  - priority: 22
    category: business_temporal
    rule: "A confirmation request falls inside the credit's half-open confirmation window [confirmation_window_start, confirmation_window_end)"
    error_id: ERR_CONFIRMATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /credits/{id}/confirmation-requests"
  - priority: 22
    category: business_temporal
    rule: "The requested clock instant is not earlier than the current logical clock value (the clock never moves backwards)"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  # ---- 23: business_constraint (overlap, capacity, uniqueness) ----------
  - priority: 23
    category: business_constraint
    rule: "Amendment consent windows on one credit do not overlap, including the symmetric two-day cooling-off buffer on both ends (closed intervals)"
    error_id: ERR_AMENDMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /amendments/{id}/issue"
  - priority: 23
    category: business_constraint
    rule: "The confirming bank's peak concurrent occupancy over half-open confirmation windows, including the candidate credit, does not exceed Bank.confirmation_appetite_cents (peak == appetite is admitted)"
    error_id: ERR_CONFIRMING_LINE_WINDOW_FULL
    http_status: 409
    applies_to: "POST /credits/{id}/confirmation-requests"
  - priority: 23
    category: business_constraint
    rule: "A named confirming bank is eligible: status ACTIVE, sanctions_flag false, country_risk_score <= 60, and not domiciled in the beneficiary's own country"
    error_id: ERR_CONFIRMING_BANK_INELIGIBLE
    http_status: 422
    applies_to: "POST /credits/{id}/confirmation-requests"
  - priority: 23
    category: business_constraint
    rule: "Automatic selection found at least one eligible confirming bank"
    error_id: ERR_NO_ELIGIBLE_CONFIRMING_BANK
    http_status: 422
    applies_to: "POST /credits/{id}/confirmation-requests"
  - priority: 23
    category: business_constraint
    rule: "A credit carries at least one COMMERCIAL_INVOICE documentary requirement and at least one transport document requirement before it may be submitted for approval; a CIF or CIP incoterm additionally requires an INSURANCE_CERTIFICATE requirement, and a FOB, FCA or EXW incoterm forbids one"
    error_id: ERR_INCOTERM_DOCUMENT_MISMATCH
    http_status: 422
    applies_to: "POST /credits/{id}/submit-for-approval, POST /amendments/{id}/issue"
  - priority: 23
    category: business_constraint
    rule: "A presentation carries at least one PresentedDocument row before submission, and every mandatory DocumentaryRequirement of the credit is answered by at least one document of the matching doc_type with originals_presented >= required_originals"
    error_id: ERR_PRESENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /presentations/{id}/submit"
  - priority: 23
    category: business_constraint
    rule: "swift_bic is unique across banks; (applicant legal_name, country_code) is unique across applicants; a Discrepancy code is unique within one presentation"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /banks, POST /applicants, POST /presentations/{id}/discrepancies"
  - priority: 23
    category: business_constraint
    rule: "At most one live WaiverRequest exists per presentation, and at most one live SettlementClaim exists per presentation"
    error_id: ERR_LIVE_REQUEST_EXISTS
    http_status: 409
    applies_to: "POST /presentations/{id}/waiver-requests, POST /presentations/{id}/settlement-claims"
  - priority: 23
    category: business_constraint
    rule: "An amendment change_set is non-empty after no-op keys are discarded, and every key it names is an amendable credit field"
    error_id: ERR_EMPTY_CHANGE_SET
    http_status: 422
    applies_to: "POST /credits/{id}/amendments"

  # ---- 24: business_referential (party/instrument coherence) ------------
  - priority: 24
    category: business_referential
    rule: "SettlementClaim.claim_type matches the credit's available_by: SIGHT_PAYMENT admits PAYMENT and REIMBURSEMENT; NEGOTIATION admits NEGOTIATION and REIMBURSEMENT; ACCEPTANCE admits ACCEPTANCE and REIMBURSEMENT; DEFERRED_PAYMENT admits DEFERRED_PAYMENT and REIMBURSEMENT"
    error_id: ERR_CLAIM_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /presentations/{id}/settlement-claims"
  - priority: 24
    category: business_referential
    rule: "The presenting bank is a nominated bank for the credit: presenting_bank_id equals the beneficiary's nominated_bank_id, the credit's advising_bank_id, or the credit's confirming_bank_id"
    error_id: ERR_BANK_NOT_NOMINATED
    http_status: 422
    applies_to: "POST /presentations"
  - priority: 24
    category: business_referential
    rule: "The named CreditFacility belongs to the named applicant and is denominated in the credit's currency (ERR_FACILITY_APPLICANT_MISMATCH); separately, its facility_expiry_date is not before the credit's expiry_date (ERR_FACILITY_EXPIRED)"
    error_id: "ERR_FACILITY_APPLICANT_MISMATCH | ERR_FACILITY_EXPIRED"
    http_status: 422
    applies_to: "POST /credits"
  - priority: 24
    category: business_referential
    rule: "Every discrepancy code raised is drawn from the credit's own documentary requirements or the fixed UCP discrepancy code list, and a waiver request names only discrepancy codes that actually exist with status IDENTIFIED on that presentation"
    error_id: ERR_DISCREPANCY_CODE_UNKNOWN
    http_status: 422
    applies_to: "POST /presentations/{id}/discrepancies, POST /presentations/{id}/waiver-requests"
  - priority: 24
    category: business_referential
    rule: "claimed_amount_cents equals the presentation's frozen drawn_amount_cents"
    error_id: ERR_CLAIM_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /presentations/{id}/settlement-claims"

  # ---- 26: business_fiscal (money capacity - checked LAST) --------------
  - priority: 26
    category: business_fiscal
    rule: "The committed allocation plus issuance charges fits inside CreditFacility.available_cents (equality is admitted: allocation == available_cents succeeds)"
    error_id: ERR_FACILITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /credits/{id}/issue, POST /amendments/{id}/consent, POST /credits/{id}/confirmation-responses"
  - priority: 26
    category: business_fiscal
    rule: "A presentation's drawn amount fits inside DocumentaryCredit.available_cents at submit time (equality is admitted)"
    error_id: ERR_CREDIT_DRAWABLE_EXCEEDED
    http_status: 422
    applies_to: "POST /presentations/{id}/submit"
  - priority: 26
    category: business_fiscal
    rule: "Charges never exceed the drawn amount at settlement (net_proceeds_cents >= 0)"
    error_id: ERR_CHARGES_EXCEED_PROCEEDS
    http_status: 422
    applies_to: "POST /settlement-claims/{id}/settle"
  - priority: 26
    category: business_fiscal
    rule: "A negative collateral posting never drives collateral_posted_cents below zero, nor below the collateral credit already granted to OPEN allocations"
    error_id: "ERR_COLLATERAL_RELEASE_EXCEEDS_POSTED | ERR_COLLATERAL_RELEASE_BLOCKED"
    http_status: 422
    applies_to: "POST /facilities/{id}/collateral-postings"

# ---- Deliberate priority conflicts (Rule 5 material) --------------------
# (i)  state(4) vs business_fiscal(26)
#      POST /credits/{id}/issue on a credit still in DRAFT whose committed
#      allocation also exceeds facility headroom -> ERR_CREDIT_NOT_APPROVED
#      (409) is returned, NOT ERR_FACILITY_LIMIT_EXCEEDED (422).
# (ii) business_safety(20) vs business_referential(24)
#      POST /presentations/{id}/settlement-claims on a presentation whose
#      documents screened BLOCKED, sent with a claim_type the credit's
#      available_by does not admit -> ERR_SANCTIONS_BLOCK (403) is returned,
#      NOT ERR_CLAIM_TYPE_MISMATCH (422).

# =========================================================================
# §1.5 Endpoint Table
# api_prefix is "" so every collection lives at the root and each entity is
# reverse-reachable from its own `GET /<collection>/{id}` or from a parent's
# sub-resource list.
# =========================================================================
endpoints:
  # ------------------------------ reads (20) -----------------------------
  - method: GET
    path: "/applicants/{id}"
    purpose: "Fetch one applicant with its KYC and sanctions posture"
    roles: [CreditOfficer, TradeFinanceOfficer, ComplianceOfficer, DocumentExaminer, ApplicantUser]
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/applicants/{id}/facilities"
    purpose: "List the credit facilities carried by one applicant, ordered created_at ASC"
    roles: [CreditOfficer, TradeFinanceOfficer, ComplianceOfficer, ApplicantUser]
    input: ["status?", "limit?", "offset?"]
    output: CreditFacility[]
    side_effects: []
  - method: GET
    path: "/facilities/{id}"
    purpose: "Fetch one facility with its live exposure ledger and utilisation posture"
    roles: [CreditOfficer, TradeFinanceOfficer, ComplianceOfficer, ApplicantUser]
    input: []
    output: CreditFacility
    side_effects: []
  - method: GET
    path: "/facilities/{id}/allocations"
    purpose: "List the allocations sitting on one facility, ordered created_at ASC"
    roles: [CreditOfficer, TradeFinanceOfficer, ComplianceOfficer]
    input: ["status?", "credit_id?", "limit?", "offset?"]
    output: FacilityAllocation[]
    side_effects: []
  - method: GET
    path: "/banks/{id}"
    purpose: "Fetch one bank with its country risk score, rating and confirming-line occupancy"
    roles: [CreditOfficer, TradeFinanceOfficer, ComplianceOfficer, DocumentExaminer, CorrespondentBank]
    input: []
    output: Bank
    side_effects: []
  - method: GET
    path: "/banks"
    purpose: "List banks with filters, ordered eligibility_score DESC then country_risk_score ASC then created_at ASC"
    roles: [CreditOfficer, TradeFinanceOfficer, ComplianceOfficer]
    input: ["country_code?", "status?", "max_country_risk_score?", "credit_rating?", "limit?", "offset?"]
    output: Bank[]
    side_effects: []
  - method: GET
    path: "/beneficiaries/{id}"
    purpose: "Fetch one beneficiary with its nominated bank"
    roles: [TradeFinanceOfficer, CreditOfficer, ComplianceOfficer, DocumentExaminer, BeneficiaryUser]
    input: []
    output: Beneficiary
    side_effects: []
  - method: GET
    path: "/beneficiaries"
    purpose: "List beneficiaries with filters, ordered created_at ASC"
    roles: [TradeFinanceOfficer, CreditOfficer, ComplianceOfficer]
    input: ["nominated_bank_id?", "country_code?", "status?", "limit?", "offset?"]
    output: Beneficiary[]
    side_effects: []
  - method: GET
    path: "/credits/{id}"
    purpose: "Fetch one documentary credit with both status dimensions, its exposure figures, charges and drawable ledger"
    roles: [TradeFinanceOfficer, CreditOfficer, ComplianceOfficer, DocumentExaminer, ApplicantUser, BeneficiaryUser, CorrespondentBank]
    input: []
    output: DocumentaryCredit
    side_effects: []
  - method: GET
    path: "/credits"
    purpose: "List documentary credits with filters, ordered created_at ASC"
    roles: [TradeFinanceOfficer, CreditOfficer, ComplianceOfficer, DocumentExaminer]
    input: ["applicant_id?", "beneficiary_id?", "facility_id?", "advising_bank_id?", "confirming_bank_id?", "status?", "confirmation_status?", "limit?", "offset?"]
    output: DocumentaryCredit[]
    side_effects: []
  - method: GET
    path: "/credits/{id}/documentary-requirements"
    purpose: "List the documentary requirements drafted into one credit, ordered created_at ASC"
    roles: [TradeFinanceOfficer, CreditOfficer, DocumentExaminer, ComplianceOfficer, BeneficiaryUser, CorrespondentBank]
    input: ["doc_type?", "is_mandatory?", "limit?", "offset?"]
    output: DocumentaryRequirement[]
    side_effects: []
  - method: GET
    path: "/credits/{id}/amendments"
    purpose: "List the amendments of one credit, ordered seq ASC"
    roles: [TradeFinanceOfficer, CreditOfficer, ComplianceOfficer, ApplicantUser, BeneficiaryUser]
    input: ["status?", "requires_beneficiary_consent?", "limit?", "offset?"]
    output: Amendment[]
    side_effects: []
  - method: GET
    path: "/credits/{id}/allocations"
    purpose: "List the facility allocations raised by one credit, ordered created_at ASC"
    roles: [TradeFinanceOfficer, CreditOfficer, ComplianceOfficer]
    input: ["status?", "limit?", "offset?"]
    output: FacilityAllocation[]
    side_effects: []
  - method: GET
    path: "/credits/{id}/screening-checks"
    purpose: "List every screening check attached to one credit, both CREDIT_PARTIES and PRESENTED_DOCUMENTS scopes, ordered created_at ASC"
    roles: [ComplianceOfficer, TradeFinanceOfficer, CreditOfficer, DocumentExaminer]
    input: ["scope?", "result?", "presentation_id?", "limit?", "offset?"]
    output: ScreeningCheck[]
    side_effects: []
  - method: GET
    path: "/presentations/{id}"
    purpose: "Fetch one presentation with both its examination and settlement dimensions and its examination deadline"
    roles: [DocumentExaminer, TradeFinanceOfficer, ComplianceOfficer, CreditOfficer, CorrespondentBank, BeneficiaryUser, ApplicantUser]
    input: []
    output: Presentation
    side_effects: []
  - method: GET
    path: "/presentations"
    purpose: "List presentations with filters, ordered created_at ASC"
    roles: [DocumentExaminer, TradeFinanceOfficer, ComplianceOfficer, CreditOfficer]
    input: ["credit_id?", "presenting_bank_id?", "examination_status?", "settlement_status?", "limit?", "offset?"]
    output: Presentation[]
    side_effects: []
  - method: GET
    path: "/presentations/{id}/documents"
    purpose: "List the documents presented under one presentation, ordered created_at ASC (PresentedDocument rows are immutable and carry no version)"
    roles: [DocumentExaminer, ComplianceOfficer, TradeFinanceOfficer, CorrespondentBank]
    input: ["doc_type?", "limit?", "offset?"]
    output: PresentedDocument[]
    side_effects: []
  - method: GET
    path: "/presentations/{id}/discrepancies"
    purpose: "List the discrepancies raised against one presentation, ordered created_at ASC"
    roles: [DocumentExaminer, TradeFinanceOfficer, ComplianceOfficer, ApplicantUser, CorrespondentBank]
    input: ["status?", "severity?", "limit?", "offset?"]
    output: Discrepancy[]
    side_effects: []
  - method: GET
    path: "/presentations/{id}/waiver-requests"
    purpose: "List the discrepancy waiver requests sent to the applicant for one presentation, ordered created_at ASC"
    roles: [DocumentExaminer, TradeFinanceOfficer, ComplianceOfficer, ApplicantUser]
    input: ["status?", "limit?", "offset?"]
    output: WaiverRequest[]
    side_effects: []
  - method: GET
    path: "/presentations/{id}/settlement-claims"
    purpose: "List the reimbursement / payment / acceptance / negotiation claims lodged on one presentation, ordered created_at ASC"
    roles: [TradeFinanceOfficer, DocumentExaminer, ComplianceOfficer, CorrespondentBank]
    input: ["status?", "claim_type?", "limit?", "offset?"]
    output: SettlementClaim[]
    side_effects: []

  # --------------------- writes: parties and facilities ------------------
  - method: POST
    path: "/applicants"
    purpose: "Onboard an applicant (the party asking the bank to issue a credit)"
    roles: [CreditOfficer]
    input: ["legal_name", "country_code", "industry_code", "internal_risk_grade", "kyc_status", "sanctions_flag?"]
    output: Applicant
    side_effects:
      - "status := ACTIVE; onboarded_by_user_id := X-User-ID"
      - "rejects a duplicate (legal_name, country_code) pair with ERR_DUPLICATE_KEY (409)"
  - method: POST
    path: "/applicants/{id}/facilities"
    purpose: "Open a trade finance credit facility for an applicant"
    roles: [CreditOfficer]
    input: ["currency", "limit_cents", "collateral_required_pct", "facility_expiry_date"]
    output: CreditFacility
    side_effects:
      - "status := ACTIVE; collateral_posted_cents := 0; allocated_cents := 0"
      - "available_cents := limit_cents; restrict_threshold_cents := floor_div(limit_cents * 95, 100); utilisation_posture := OPEN"
  - method: POST
    path: "/facilities/{id}/collateral-postings"
    purpose: "Post (positive amount_cents) or release (negative amount_cents) collateral against a facility under optimistic concurrency control"
    roles: [CreditOfficer]
    input: ["amount_cents", "expected_facility_version", "posting_note?"]
    output: CreditFacility
    side_effects:
      - "collateral_posted_cents := previous + amount_cents; version increments"
      - "OCC: expected_facility_version must equal the facility's current version, else ERR_STALE_FACILITY_VERSION (412)"
      - "a release that would drive collateral_posted_cents below zero returns ERR_COLLATERAL_RELEASE_EXCEEDS_POSTED (422); one that would strand collateral already credited to OPEN allocations returns ERR_COLLATERAL_RELEASE_BLOCKED (422)"
      - "does NOT retroactively change committed_allocation_cents on already-issued credits"
  - method: POST
    path: "/facilities/{id}/status-changes"
    purpose: "Suspend, reactivate or close a facility"
    roles: [CreditOfficer]
    input: ["action", "reason?"]
    output: CreditFacility
    side_effects:
      - "action SUSPEND: ACTIVE -> SUSPENDED, suspended_reason := MANUAL_SUSPENSION; every APPROVED credit on the facility cascades to ON_HOLD in created_at ASC order"
      - "action REINSTATE: SUSPENDED -> ACTIVE only when allocated_cents < restrict_threshold_cents, else ERR_FACILITY_STILL_RESTRICTED (409); every ON_HOLD credit on the facility returns to APPROVED in created_at ASC order"
      - "action CLOSE: -> CLOSED (terminal) only when no OPEN FacilityAllocation remains, else ERR_FACILITY_HAS_OPEN_ALLOCATION (409); utilisation_posture := FROZEN"
  - method: POST
    path: "/banks"
    purpose: "Register a correspondent bank usable as an advising, confirming or presenting bank"
    roles: [CreditOfficer]
    input: ["bank_name", "swift_bic", "country_code", "country_risk_score", "credit_rating", "confirmation_appetite_cents", "sanctions_flag?"]
    output: Bank
    side_effects:
      - "status := ACTIVE; confirming_line_used_cents := 0"
      - "eligibility_score := (100 - country_risk_score) * 6 + rating_points * 4, rating_points from {AA:100, A:75, BBB:50, BB:25}"
      - "rejects a duplicate swift_bic with ERR_DUPLICATE_KEY (409)"
  - method: PATCH
    path: "/banks/{id}"
    purpose: "Update a bank's risk posture, appetite, rating or sanctions flag"
    roles: [CreditOfficer, ComplianceOfficer]
    input: ["status?", "sanctions_flag?", "country_risk_score?", "confirmation_appetite_cents?", "credit_rating?"]
    output: Bank
    side_effects:
      - "eligibility_score is re-derived from the new country_risk_score and credit_rating"
      - "does NOT retroactively unwind confirmations already CONFIRMED; the bank simply stops being eligible for new confirmation requests"
  - method: POST
    path: "/beneficiaries"
    purpose: "Register a beneficiary (exporter) together with the bank nominated in its favour"
    roles: [TradeFinanceOfficer]
    input: ["beneficiary_name", "country_code", "nominated_bank_id", "sanctions_flag?"]
    output: Beneficiary
    side_effects:
      - "status := ACTIVE"
      - "nominated_bank_id must resolve to an existing Bank, else ERR_BANK_NOT_FOUND (404)"

  # --------------------- writes: credit drafting and issuance ------------
  - method: POST
    path: "/credits"
    purpose: "Draft a documentary credit: parties, amount, availability, incoterm and the expiry / latest shipment date pair"
    roles: [TradeFinanceOfficer]
    input: ["applicant_id", "beneficiary_id", "facility_id", "advising_bank_id", "currency", "amount_cents", "available_by", "incoterm", "incoterm_place", "latest_shipment_date", "expiry_date", "expiry_place", "presentation_period_days", "tolerance_pct?", "tenor_days?", "partial_shipment_allowed?", "transhipment_allowed?"]
    output: DocumentaryCredit
    side_effects:
      - "status := DRAFT; confirmation_status := UNCONFIRMED; amendment_seq := 0; drafted_by_user_id := X-User-ID"
      - "max_drawable_cents := floor_div(amount_cents * (100 + tolerance_pct), 100)"
      - "provisional_allocation_cents := credit_allocation_exposure variant provisional_draft (tolerance and tenor forced to zero); NO FacilityAllocation row is created and CreditFacility.allocated_cents is unchanged"
      - "presentation_deadline_date := min(expiry_date, latest_shipment_date + presentation_period_days)"
      - "rejects latest_shipment_date > expiry_date with ERR_SHIPMENT_AFTER_EXPIRY (422)"
      - "rejects a facility that belongs to another applicant or is denominated in a different currency with ERR_FACILITY_APPLICANT_MISMATCH (422), and a facility whose facility_expiry_date is before the credit's expiry_date with ERR_FACILITY_EXPIRED (422)"
      - "rejects when applicant, beneficiary or advising bank carries sanctions_flag == true with ERR_SANCTIONS_BLOCK (403)"
      - "available_by == SIGHT_PAYMENT forces tenor_days to 0; any other availability requires tenor_days > 0, else ERR_INVALID_REQUEST (422)"
  - method: POST
    path: "/credits/{id}/documentary-requirements"
    purpose: "Draft one documentary requirement (the documents the beneficiary must present) into a DRAFT credit"
    roles: [TradeFinanceOfficer]
    input: ["doc_type", "originals_required", "copies_required", "issuer_constraint", "is_mandatory?"]
    output: DocumentaryRequirement
    side_effects:
      - "amended_in_seq := 0 for requirements drafted before issuance"
      - "only permitted while the credit is DRAFT, else ERR_CREDIT_NOT_DRAFT (409)"
      - "provisional_allocation_cents is NOT affected by documentary requirements"
  - method: POST
    path: "/credits/{id}/submit-for-approval"
    purpose: "Send a drafted credit to the credit officer for facility approval"
    roles: [TradeFinanceOfficer]
    input: ["submission_note?"]
    output: DocumentaryCredit
    side_effects:
      - "status: DRAFT -> PENDING_CREDIT_APPROVAL"
      - "provisional_allocation_cents is re-derived (variant provisional_draft) against the facility's collateral posture as at submission"
      - "rejects a credit with no COMMERCIAL_INVOICE requirement or no transport requirement, and enforces the incoterm/insurance pairing, with ERR_INCOTERM_DOCUMENT_MISMATCH (422)"
  - method: POST
    path: "/credits/{id}/approve"
    purpose: "Credit officer decision on the facility allocation for a pending credit"
    roles: [CreditOfficer]
    input: ["decision", "approval_note?"]
    output: DocumentaryCredit
    side_effects:
      - "decision APPROVE: PENDING_CREDIT_APPROVAL -> APPROVED. No facility debit yet - approval grants permission, issuance consumes the limit."
      - "decision RETURN_TO_DRAFT: PENDING_CREDIT_APPROVAL -> DRAFT (the cyclic edge that lets terms be re-drafted)"
      - "segregation of duties: X-User-ID must differ from drafted_by_user_id, else ERR_SEGREGATION_OF_DUTIES (403)"
  - method: POST
    path: "/credits/{id}/issue"
    purpose: "Issue the credit: commit the facility allocation, price the commission, screen the parties and open the presentation window"
    roles: [TradeFinanceOfficer]
    input: ["issue_note?"]
    output: DocumentaryCredit
    side_effects:
      - "status: APPROVED -> ISSUED; issue_date := clock date; issued_by_user_id := X-User-ID"
      - "committed_allocation_cents / gross_exposure_cents := credit_allocation_exposure variant committed_issuance"
      - "commission_bps_applied, base_commission_cents, total_charge_cents, chargeable_utilisation_cents := issuance_charges (tier keyed on gross_exposure_cents alone)"
      - "confirmation_window_start := issue_date; confirmation_window_end := expiry_date + presentation_period_days (exclusive)"
      - "CASCADE HOP 1 - creates FacilityAllocation(status OPEN, basis COMMITTED_ISSUANCE, allocated_cents, charge_cents := total_charge_cents)"
      - "CASCADE HOP 2 - caused by hop 1: CreditFacility.allocated_cents / available_cents re-derived by facility_exposure_ledger"
      - "CASCADE HOP 3 - caused by hop 2: when allocated_cents >= restrict_threshold_cents the facility flips utilisation_posture to RESTRICTED and status ACTIVE -> SUSPENDED with suspended_reason RESTRICT_THRESHOLD_BREACH"
      - "CASCADE HOP 4 - caused by hop 3: every sibling credit on that facility in status APPROVED moves to ON_HOLD in created_at ASC order"
      - "creates a ScreeningCheck(scope CREDIT_PARTIES) over the applicant, beneficiary and advising bank; a BLOCKED result aborts the whole issuance with ERR_SANCTIONS_BLOCK (403) and no allocation is written"
      - "rejects when CreditFacility.status != ACTIVE or utilisation_posture == FROZEN with ERR_FACILITY_NOT_ACTIVE (409)"
      - "rejects when the credit is not APPROVED with ERR_CREDIT_NOT_APPROVED (409) - this state check outranks the fiscal headroom check"
      - "rejects when chargeable_utilisation_cents > CreditFacility.available_cents with ERR_FACILITY_LIMIT_EXCEEDED (422); exact equality is admitted"

  # --------------------- writes: advising and confirmation ---------------
  - method: POST
    path: "/credits/{id}/confirmation-requests"
    purpose: "Ask a correspondent bank to add its confirmation; when confirming_bank_id is omitted the selector policy picks one"
    roles: [TradeFinanceOfficer]
    input: ["confirming_bank_id?", "request_note?"]
    output: DocumentaryCredit
    side_effects:
      - "confirmation_status: UNCONFIRMED -> CONFIRMATION_REQUESTED, or CONFIRMATION_DECLINED -> CONFIRMATION_REQUESTED (the cyclic retry edge)"
      - "confirming_bank_id := the named bank, or the confirming_bank_selection winner when omitted"
      - "the selected bank's confirming_line_used_cents is re-derived by confirming_line_peak_occupancy"
      - "a bank that already returned DECLINE on this credit is excluded from automatic selection"
      - "rejects an ineligible named bank (not ACTIVE, sanctions_flag true, country_risk_score > 60, or domiciled in the beneficiary's country) with ERR_CONFIRMING_BANK_INELIGIBLE (422)"
      - "rejects when the peak concurrent occupancy including this credit exceeds Bank.confirmation_appetite_cents with ERR_CONFIRMING_LINE_WINDOW_FULL (409); peak == appetite is admitted"
      - "rejects when automatic selection finds no eligible bank with ERR_NO_ELIGIBLE_CONFIRMING_BANK (422)"
      - "rejects when the clock sits outside [confirmation_window_start, confirmation_window_end) with ERR_CONFIRMATION_WINDOW_CLOSED (422)"
  - method: POST
    path: "/credits/{id}/confirmation-responses"
    purpose: "The nominated confirming bank accepts or declines to add its confirmation"
    roles: [CorrespondentBank]
    input: ["decision", "declined_reason?"]
    output: DocumentaryCredit
    side_effects:
      - "decision CONFIRM: confirmation_status CONFIRMATION_REQUESTED -> CONFIRMED; confirmation_charge_cents is priced from gross_exposure_cents and the confirming bank's country_risk_score; total_charge_cents and chargeable_utilisation_cents grow; the credit's OPEN FacilityAllocation.charge_cents is raised and the facility ledger is re-derived (which can itself trip the RESTRICTED / SUSPENDED cascade)"
      - "decision DECLINE: confirmation_status CONFIRMATION_REQUESTED -> CONFIRMATION_DECLINED; confirming_bank_id := null; the bank's confirming_line_used_cents is released; declined_reason is recorded so the bank is excluded from later automatic selection on this credit"
      - "the acting principal's X-User-ID must equal the credit's confirming_bank_id, else ERR_PRINCIPAL_NOT_PARTY (403)"
      - "rejects when the added confirmation charge would breach facility headroom with ERR_FACILITY_LIMIT_EXCEEDED (422)"
  - method: POST
    path: "/credits/{id}/cancel"
    purpose: "Cancel a credit and release everything it holds"
    roles: [TradeFinanceOfficer]
    input: ["reason", "beneficiary_consent_reference?"]
    output: DocumentaryCredit
    side_effects:
      - "status: DRAFT | PENDING_CREDIT_APPROVAL | APPROVED | ON_HOLD | ISSUED -> CANCELLED (terminal); cancelled_reason := reason"
      - "cancelling an ISSUED credit requires beneficiary_consent_reference (an irrevocable undertaking cannot be withdrawn unilaterally), else ERR_BENEFICIARY_CONSENT_REQUIRED (422)"
      - "COMPENSATION - every OPEN FacilityAllocation of the credit flips to RELEASED with released_cents := allocated_cents + charge_cents and released_at := now; the facility ledger is re-derived, restoring CreditFacility.allocated_cents to its exact pre-issuance value"
      - "COMPENSATION - when the facility falls back below restrict_threshold_cents its posture returns to OPEN, status SUSPENDED -> ACTIVE and every ON_HOLD sibling credit returns to APPROVED in created_at ASC order"
      - "any live confirmation occupation is released and the confirming bank's confirming_line_used_cents is re-derived"
      - "rejects when any live presentation exists (examination_status not in {REFUSED} and settlement_status not in {VOID, PAID, NEGOTIATED, REIMBURSED}) with ERR_CREDIT_HAS_LIVE_PRESENTATION (409)"

  # --------------------- writes: amendments ------------------------------
  - method: POST
    path: "/credits/{id}/amendments"
    purpose: "Draft an amendment to an issued credit under optimistic concurrency control on the credit"
    roles: [TradeFinanceOfficer]
    input: ["change_set", "reason", "expected_credit_version"]
    output: Amendment
    side_effects:
      - "status := DRAFT; seq := 1 + the number of Amendment rows that already exist for this credit (a strictly monotone per-credit counter, never reused even when an earlier amendment was rejected, lapsed or superseded); drafted_by_user_id := X-User-ID"
      - "requires_beneficiary_consent := amendment_consent_requirement over change_set vs the credit's current values"
      - "exposure_delta_cents := the committed_issuance exposure of the amended credit minus committed_allocation_cents"
      - "OCC: expected_credit_version must equal DocumentaryCredit.version, else ERR_STALE_CREDIT_VERSION (412)"
      - "rejects a change_set that is empty once no-op keys are discarded, or that names a non-amendable field, with ERR_EMPTY_CHANGE_SET (422)"
      - "permitted only while the credit is ISSUED or AMENDMENT_PENDING, else ERR_CREDIT_NOT_ISSUED (409)"
      - "the credit's version increments (drafting an amendment is a write on the credit), so a second amendment drafted from the same captured version is rejected"
  - method: POST
    path: "/amendments/{id}/issue"
    purpose: "Issue the amendment: either apply it immediately or open the beneficiary consent window"
    roles: [TradeFinanceOfficer]
    input: ["issue_note?"]
    output: Amendment
    side_effects:
      - "on BOTH branches, before the fork: consent_window_start := clock date; consent_deadline_date := clock date + AMENDMENT_CONSENT_DAYS (10); window_end_effective := consent_deadline_date. Every issued amendment owns an interval, which is what amendment_window_overlap compares - a consent-free amendment is not exempt from the cooling-off buffer"
      - "requires_beneficiary_consent == false: status DRAFT -> ISSUED -> ACCEPTED in one call (a favourable amendment binds on issuance); window_end_effective is immediately pulled back to the clock date because the window closed the instant it opened; the change_set is applied to the credit and the exposure / charge recompute cascade runs"
      - "requires_beneficiary_consent == true: status DRAFT -> ISSUED -> PENDING_CONSENT; window_end_effective stays at consent_deadline_date; the credit moves ISSUED -> AMENDMENT_PENDING and the change_set is NOT applied"
      - "amendment_fee_cents := issuance_charges variant amendment_recharge"
      - "segregation of duties: X-User-ID must differ from drafted_by_user_id, else ERR_SEGREGATION_OF_DUTIES (403)"
      - "rejects when the consent window (closed interval, plus the symmetric 2-day cooling-off buffer) touches another live or resolved amendment window on the same credit with ERR_AMENDMENT_WINDOW_CONFLICT (409)"
      - "rejects a change_set that would push latest_shipment_date past expiry_date with ERR_SHIPMENT_AFTER_EXPIRY (422), or that would break the incoterm/insurance document pairing with ERR_INCOTERM_DOCUMENT_MISMATCH (422)"
  - method: POST
    path: "/amendments/{id}/consent"
    purpose: "The beneficiary accepts or rejects an amendment that reduces its rights"
    roles: [BeneficiaryUser]
    input: ["decision", "note?"]
    output: Amendment
    side_effects:
      - "decision ACCEPT: status PENDING_CONSENT -> ACCEPTED; resolved_at := now; window_end_effective := clock date (the window closes early, which is what the cooling-off buffer is measured from)"
      - "CASCADE HOP 1 (ACCEPT) - the change_set is applied to DocumentaryCredit; amendment_seq := seq; status AMENDMENT_PENDING -> ISSUED; exactly these fields are re-derived: presentation_deadline_date and the confirmation window (calculations.presentation_window), max_drawable_cents / gross_exposure_cents / committed_allocation_cents (credit_allocation_exposure variant committed_issuance), chargeable_utilisation_cents and available_cents. commission_bps_applied, base_commission_cents, confirmation_charge_cents and total_charge_cents are NOT re-priced by an amendment - the commission is earned once at issuance and only amendment_fee_cents is added on top"
      - "CASCADE HOP 2 (ACCEPT) - caused by hop 1: the allocation is re-cut, never edited in place. The credit's existing OPEN FacilityAllocation flips to RELEASED with released_cents := its own allocated_cents + charge_cents and released_at := the clock instant, and ONE new row is opened with allocated_cents := the credit's new committed_allocation_cents, charge_cents := the released row's charge_cents + Amendment.amendment_fee_cents, basis := AMENDED_INCREASE when exposure_delta_cents > 0 else AMENDED_DECREASE (a zero delta takes AMENDED_DECREASE). Note the deliberate asymmetry: the amendment fee occupies the facility through charge_cents, but the credit's own chargeable_utilisation_cents stays committed_allocation_cents + total_charge_cents per the pinned issuance_charges order and therefore EXCLUDES amendment fees"
      - "CASCADE HOP 3 (ACCEPT) - caused by hop 2: CreditFacility.allocated_cents / available_cents / utilisation_posture are re-derived by facility_exposure_ledger"
      - "CASCADE HOP 4 (ACCEPT) - caused by hop 3: crossing restrict_threshold_cents upward suspends the facility and holds its APPROVED siblings; falling back below it reactivates the facility and returns its ON_HOLD siblings to APPROVED, both in created_at ASC order"
      - "decision REJECT: status PENDING_CONSENT -> REJECTED; resolved_at := now; window_end_effective := clock date; the credit returns AMENDMENT_PENDING -> ISSUED on its ORIGINAL terms and nothing is applied"
      - "the acting principal's X-User-ID must equal the credit's beneficiary_id, else ERR_PRINCIPAL_NOT_PARTY (403)"
      - "rejects a response after consent_deadline_date with ERR_CONSENT_WINDOW_CLOSED (409)"
      - "rejects when the accepted amendment's new exposure breaches facility headroom with ERR_FACILITY_LIMIT_EXCEEDED (422); the amendment stays PENDING_CONSENT"

  # --------------------- writes: presentation and examination ------------
  - method: POST
    path: "/presentations"
    purpose: "Open a presentation file under an issued credit on behalf of a nominated bank"
    roles: [CorrespondentBank]
    input: ["credit_id", "presenting_bank_id", "cover_letter_reference?"]
    output: Presentation
    side_effects:
      - "examination_status := RECEIVED; settlement_status := UNSETTLED; received_at := now; received_date := clock date; document_count := 0; drawn_amount_cents := 0"
      - "examination_deadline stays null until submit - the five banking days run from the day the documents are actually presented as a complete set"
      - "rejects when the credit is not ISSUED or AMENDMENT_PENDING with ERR_CREDIT_NOT_ISSUED (409)"
      - "rejects when presenting_bank_id is neither the beneficiary's nominated bank, nor the credit's advising bank, nor its confirming bank, with ERR_BANK_NOT_NOMINATED (422)"
      - "the acting principal's X-User-ID must equal presenting_bank_id, else ERR_PRINCIPAL_NOT_PARTY (403)"
  - method: POST
    path: "/presentations/{id}/documents"
    purpose: "Add one document to a presentation file (invoice, transport, insurance, certificate, draft)"
    roles: [CorrespondentBank]
    input: ["doc_type", "originals_presented", "copies_presented", "issue_date", "shipment_date?", "invoice_amount_cents?", "goods_description?", "hs_code?", "consignee_country?", "transit_country_codes?", "issuer_name?"]
    output: PresentedDocument
    side_effects:
      - "PresentedDocument rows are immutable: no version field, no update endpoint, no delete endpoint"
      - "Presentation.document_count increments"
      - "only permitted while examination_status == RECEIVED, else ERR_PRESENTATION_NOT_EXAMINABLE (409)"
      - "invoice_amount_cents is required (> 0) when doc_type == COMMERCIAL_INVOICE, else ERR_INVALID_REQUEST (422)"
  - method: POST
    path: "/presentations/{id}/submit"
    purpose: "Declare the presentation complete: freeze the drawn amount, reserve it against the credit and start the examination clock"
    roles: [CorrespondentBank]
    input: ["submission_note?"]
    output: Presentation
    side_effects:
      - "examination_status: RECEIVED -> UNDER_EXAMINATION; submitted_at := now; received_date := clock date at submission"
      - "drawn_amount_cents := SUM of invoice_amount_cents over COMMERCIAL_INVOICE documents, frozen from here on"
      - "maturity_date := clock date + DocumentaryCredit.tenor_days when available_by != SIGHT_PAYMENT, else null"
      - "examination_deadline := examination_period_deadline (five banking days FOLLOWING received_date, at 23:59:59.999Z)"
      - "creates a ScreeningCheck(scope PRESENTED_DOCUMENTS) scored by sanctions_dual_use_score; a BLOCKED result aborts the submit with ERR_SANCTIONS_BLOCK (403) and the presentation stays RECEIVED"
      - "DocumentaryCredit.reserved_cents / available_cents are re-derived by credit_drawable_ledger"
      - "rejects a presentation with zero documents, or one that leaves a mandatory documentary requirement unanswered, with ERR_PRESENTATION_INCOMPLETE (422)"
      - "rejects when the clock is past presentation_deadline_date with ERR_PRESENTATION_WINDOW_CLOSED (422)"
      - "rejects when drawn_amount_cents > DocumentaryCredit.available_cents with ERR_CREDIT_DRAWABLE_EXCEEDED (422); exact equality is admitted"
  - method: GET
    path: "/presentations/{id}/screenings"
    purpose: "List the screening checks raised against one presentation's documents, newest last, ordered created_at ASC"
    roles: [ComplianceOfficer, DocumentExaminer, TradeFinanceOfficer, CreditOfficer]
    input: ["result?", "limit?", "offset?"]
    output: ScreeningCheck[]
    side_effects: []
  - method: POST
    path: "/presentations/{id}/screenings"
    purpose: "Re-run sanctions and dual-use screening over the presented documents"
    roles: [ComplianceOfficer]
    input: ["scope", "screening_note?"]
    output: ScreeningCheck
    side_effects:
      - "creates a new ScreeningCheck row (screening history is append-only); screened_by_user_id := X-User-ID"
      - "country_hits, dual_use_hits, keyword_hits, transit_hits and risk_score are computed by sanctions_dual_use_score; result := BLOCKED at >= 100, HIT_PENDING_REVIEW at >= 40, else CLEAR"
      - "the newest ScreeningCheck for a scope is the one the settlement guard reads"
  - method: POST
    path: "/screening-checks/{id}/review"
    purpose: "Compliance adjudication of a screening hit"
    roles: [ComplianceOfficer]
    input: ["decision", "review_note?"]
    output: ScreeningCheck
    side_effects:
      - "decision RELEASE: result HIT_PENDING_REVIEW -> RELEASED; reviewed_by_user_id := X-User-ID; reviewed_at := now"
      - "decision BLOCK: result HIT_PENDING_REVIEW -> BLOCKED (terminal); every live presentation and claim under the check is frozen"
      - "decision ESCALATE: result HIT_PENDING_REVIEW -> ESCALATED (terminal); settlement stays barred with ERR_DUAL_USE_ESCALATED (409)"
      - "segregation of duties: X-User-ID must differ from screened_by_user_id, else ERR_SEGREGATION_OF_DUTIES (403)"
      - "only a HIT_PENDING_REVIEW check is reviewable, else ERR_SCREENING_NOT_REVIEWABLE (409)"
  - method: POST
    path: "/presentations/{id}/discrepancies"
    purpose: "Record one discrepancy found on examination of the documents against the credit"
    roles: [DocumentExaminer]
    input: ["code", "severity", "description"]
    output: Discrepancy
    side_effects:
      - "status := IDENTIFIED; raised_by_user_id := X-User-ID; Presentation.discrepancy_count increments; Presentation.examined_by_user_id := X-User-ID"
      - "only permitted while examination_status == UNDER_EXAMINATION, else ERR_PRESENTATION_NOT_EXAMINABLE (409)"
      - "rejects once the clock is past examination_deadline with ERR_EXAMINATION_PERIOD_EXPIRED (409)"
      - "rejects a code already recorded on this presentation with ERR_DUPLICATE_KEY (409)"
      - "rejects a code outside the credit's own requirements and the fixed UCP list with ERR_DISCREPANCY_CODE_UNKNOWN (422)"
  - method: POST
    path: "/presentations/{id}/conclude-examination"
    purpose: "Close the examination: the documents either comply or are discrepant"
    roles: [DocumentExaminer]
    input: ["conclusion_note?"]
    output: Presentation
    side_effects:
      - "discrepancy_count == 0: examination_status UNDER_EXAMINATION -> COMPLYING"
      - "discrepancy_count > 0: examination_status UNDER_EXAMINATION -> DISCREPANT"
      - "rejects once the clock is past examination_deadline with ERR_EXAMINATION_PERIOD_EXPIRED (409) - the presentation must instead be swept to PRECLUDED"
      - "rejects while the newest PRESENTED_DOCUMENTS screening sits at HIT_PENDING_REVIEW with ERR_SCREENING_REVIEW_PENDING (409)"
  - method: POST
    path: "/presentations/{id}/waiver-requests"
    purpose: "Ask the applicant to waive named discrepancies"
    roles: [DocumentExaminer]
    input: ["discrepancy_codes", "request_note?"]
    output: WaiverRequest
    side_effects:
      - "status := PENDING; requested_at := now; deadline_at := now + 2 days; requested_by_user_id := X-User-ID"
      - "examination_status: DISCREPANT -> WAIVER_REQUESTED"
      - "the named discrepancies stay IDENTIFIED for the duration of the window - §1.2 only moves them on the response"
      - "requesting a waiver does NOT extend Presentation.examination_deadline - the five banking days keep running, which is the trap"
      - "rejects when a live WaiverRequest already exists with ERR_LIVE_REQUEST_EXISTS (409)"
      - "rejects codes that are not IDENTIFIED discrepancies on this presentation with ERR_DISCREPANCY_CODE_UNKNOWN (422)"
  - method: POST
    path: "/waiver-requests/{id}/respond"
    purpose: "The applicant waives or refuses to waive the discrepancies"
    roles: [ApplicantUser]
    input: ["decision", "applicant_note?"]
    output: WaiverRequest
    side_effects:
      - "decision GRANT: status PENDING -> GRANTED; the named discrepancies move IDENTIFIED -> WAIVED; the presentation's examination_status becomes COMPLYING and it may be settled"
      - "decision DENY: status PENDING -> DENIED; the named discrepancies move IDENTIFIED -> UPHELD; examination_status returns WAIVER_REQUESTED -> DISCREPANT (the cyclic edge)"
      - "responded_at := now"
      - "the acting principal's X-User-ID must equal the credit's applicant_id, else ERR_PRINCIPAL_NOT_PARTY (403)"
      - "rejects a response after deadline_at with ERR_WAIVER_WINDOW_CLOSED (409); the request must instead be swept to EXPIRED"
  - method: POST
    path: "/presentations/{id}/refuse"
    purpose: "Send the single refusal notice: hold the documents at the presenter's disposal and release the drawing"
    roles: [DocumentExaminer]
    input: ["disposal_instruction", "refusal_note?"]
    output: Presentation
    side_effects:
      - "examination_status: DISCREPANT -> REFUSED (terminal); refusal_notice_sent_at := now; disposal_instruction is recorded"
      - "CASCADE HOP 1 - settlement_status: UNSETTLED -> VOID"
      - "CASCADE HOP 2 - caused by hop 1: the presentation leaves the live set, so DocumentaryCredit.reserved_cents falls by exactly drawn_amount_cents"
      - "CASCADE HOP 3 - caused by hop 2: DocumentaryCredit.available_cents is re-derived to exactly its pre-submit value"
      - "CreditFacility.allocated_cents is deliberately NOT touched: the credit itself remains outstanding and keeps occupying the facility"
      - "rejects once the clock is past examination_deadline with ERR_EXAMINATION_PERIOD_EXPIRED (409) - the bank is preclusion-barred and must honour"
      - "the presentation must be DISCREPANT; a presentation still in WAIVER_REQUESTED returns ERR_WAIVER_RESPONSE_PENDING (409) rather than the generic state error"
      - "only one refusal notice per presentation; a second call returns ERR_PRESENTATION_ALREADY_CONCLUDED (409)"

  # --------------------- writes: settlement and reimbursement ------------
  - method: POST
    path: "/presentations/{id}/settlement-claims"
    purpose: "The presenting bank lodges a payment, acceptance, negotiation, deferred-payment or reimbursement claim"
    roles: [CorrespondentBank]
    input: ["claim_type", "claimed_amount_cents", "claim_note?"]
    output: SettlementClaim
    side_effects:
      - "status := LODGED; Presentation.settlement_status UNSETTLED -> CLAIM_LODGED (or ACCEPTED -> CLAIM_LODGED for a post-maturity REIMBURSEMENT claim)"
      - "variant_applied := SIGHT_HONOUR | NEGOTIATION_UNDER_DISCOUNT | ACCEPTANCE_AT_MATURITY, derived from claim_type and the credit's available_by"
      - "requires examination_status IN {COMPLYING, PRECLUDED} - a precluded bank has lost the right to refuse and must honour - else ERR_PRESENTATION_NOT_COMPLYING (409)"
      - "rejects when the newest PRESENTED_DOCUMENTS screening is BLOCKED with ERR_SANCTIONS_BLOCK (403) - this safety check outranks the claim_type coherence check"
      - "rejects a claim_type the credit's available_by does not admit with ERR_CLAIM_TYPE_MISMATCH (422)"
      - "rejects claimed_amount_cents != Presentation.drawn_amount_cents with ERR_CLAIM_AMOUNT_MISMATCH (422)"
      - "rejects when a live SettlementClaim already exists with ERR_LIVE_REQUEST_EXISTS (409)"
      - "the acting principal's X-User-ID must equal the presentation's presenting_bank_id, else ERR_PRINCIPAL_NOT_PARTY (403)"
  - method: POST
    path: "/settlement-claims/{id}/settle"
    purpose: "Settle the claim: price commission, discount and per-document examination fees and pay out the net proceeds"
    roles: [TradeFinanceOfficer]
    input: ["settlement_note?"]
    output: SettlementClaim
    side_effects:
      - "status LODGED -> SETTLED; settled_at := now; settled_by_user_id := X-User-ID"
      - "commission_cents, discount_cents, doc_examination_fee_cents, days_to_maturity and net_proceeds_cents := settlement_proceeds for variant_applied (document fees are rounded PER DOCUMENT then summed)"
      - "variant SIGHT_HONOUR with claim_type PAYMENT: Presentation.settlement_status CLAIM_LODGED -> PAID; the drawing moves from reserved_cents to drawn_settled_cents"
      - "variant NEGOTIATION_UNDER_DISCOUNT: settlement_status CLAIM_LODGED -> NEGOTIATED; the drawing moves from reserved_cents to drawn_settled_cents"
      - "variant ACCEPTANCE_AT_MATURITY: settlement_status CLAIM_LODGED -> ACCEPTED; the drawing STAYS in reserved_cents until the post-maturity REIMBURSEMENT claim settles, which then moves settlement_status MATURED -> REIMBURSED"
      - "DocumentaryCredit.status ISSUED -> UTILISED once available_cents == 0 (equivalently reserved_cents == 0 and drawn_settled_cents == max_drawable_cents) and no Presentation of the credit is still in examination_status IN {RECEIVED, UNDER_EXAMINATION, DISCREPANT, WAIVER_REQUESTED}"
      - "rejects while the newest PRESENTED_DOCUMENTS screening is not CLEAR or RELEASED: HIT_PENDING_REVIEW gives ERR_SCREENING_NOT_CLEARED (409), ESCALATED gives ERR_DUAL_USE_ESCALATED (409), BLOCKED gives ERR_SANCTIONS_BLOCK (403). ERR_SCREENING_REVIEW_PENDING is NOT used here - it belongs to conclude-examination and waiver-requests only"
      - "rejects when net_proceeds_cents would be negative with ERR_CHARGES_EXCEED_PROCEEDS (422)"

  # --------------------- writes: clock and operational sweep -------------
  - method: POST
    path: "/_clock/set_current_utc"
    purpose: "Advance the deterministic logical clock that every deadline, window and date derivation reads. The service starts at 2026-08-01T00:00:00Z and this endpoint is the ONLY way the clock moves."
    roles: [SystemOperator]
    input: ["to_iso8601"]
    output: null
    side_effects:
      - "sets the logical now; the startup default is 2026-08-01T00:00:00Z"
      - "no entity is mutated - deadlines are only re-evaluated when a sweep or a write runs"
      - "rejects an instant earlier than the current logical clock with ERR_CLOCK_REGRESSION (422)"
  - method: POST
    path: "/_ops/run-expiry-sweep"
    purpose: "Deterministic operational sweep that applies every clock-driven transition in one pass"
    roles: [SystemOperator]
    input: ["dry_run?"]
    output:
      credits_expired: integer
      presentations_precluded: integer
      waiver_requests_expired: integer
      amendments_lapsed: integer
      allocations_released: integer
      facilities_reactivated: integer
    side_effects:
      - "PASS 1 - every Presentation whose examination_deadline has passed while examination_status IN {UNDER_EXAMINATION, DISCREPANT, WAIVER_REQUESTED} moves to PRECLUDED: the bank lost its right to refuse and must honour, so the drawing STAYS reserved"
      - "PASS 2 - every WaiverRequest past deadline_at while PENDING moves to EXPIRED and its discrepancies move IDENTIFIED -> UPHELD"
      - "PASS 3 - every Amendment past consent_deadline_date while PENDING_CONSENT moves to EXPIRED_NO_CONSENT, window_end_effective := consent_deadline_date, and its credit returns AMENDMENT_PENDING -> ISSUED on the original terms"
      - "PASS 4 - every DocumentaryCredit whose presentation_deadline_date is strictly before the clock date, in status ISSUED, with reserved_cents == 0 moves to EXPIRED (terminal), releasing its OPEN FacilityAllocation and any confirmation occupation. Only ISSUED is scanned: PASS 3 has already returned every AMENDMENT_PENDING credit whose consent window lapsed to ISSUED, so the same sweep still catches it"
      - "PASS 5 - facility ledgers are re-derived; facilities that fell back below restrict_threshold_cents return SUSPENDED -> ACTIVE and their ON_HOLD credits return to APPROVED, in created_at ASC order"
      - "passes run in the fixed order 1..5 and each pass processes its rows in created_at ASC order, so the sweep is fully deterministic and idempotent (a second sweep at the same clock returns all zeros)"
      - "dry_run == true reports the counts without mutating anything"

# =========================================================================
# §1.6 Error Catalog
# Every entry is triggerable by at least one §1.8 or §1.9 scenario. The
# catalog is larger than the Expert band's 18-30 because the scenario carries
# nine independent operational workflows (facility, drafting, approval,
# issuance, confirmation, amendment, examination, waiver/refusal, settlement)
# each with its own guard set - see the expert_plus note in complexity_profile.
# =========================================================================
errors:
  # ---- authentication / authorization ----
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers are required"
    trigger: "X-User-ID or X-User-Role missing or empty on any endpoint"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role is not permitted to perform this operation"
    trigger: "X-User-Role is unknown, or not listed in the endpoint's roles"
  - error_id: ERR_PRINCIPAL_NOT_PARTY
    http_status: 403
    message: "The acting principal is not a party to this instrument"
    trigger: "An entity_backed role's X-User-ID does not match the applicant_id, beneficiary_id, confirming_bank_id or presenting_bank_id it is acting for"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The same user cannot both prepare and approve this step"
    trigger: "X-User-ID equals DocumentaryCredit.drafted_by_user_id on approve, Amendment.drafted_by_user_id on amendment issue, or ScreeningCheck.screened_by_user_id on screening review"

  # ---- shape ----
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    message: "Request payload is invalid"
    trigger: "A required input field is missing, has the wrong JSON type, carries an undeclared enum member, is negative where non-negative is required, or violates a field-pair rule (SIGHT_PAYMENT with tenor_days > 0; a usance availability with tenor_days == 0; COMMERCIAL_INVOICE with invoice_amount_cents <= 0)"

  # ---- existence ----
  - error_id: ERR_APPLICANT_NOT_FOUND
    http_status: 404
    message: "Applicant not found"
    trigger: "An applicant path id or applicant_id FK does not resolve"
  - error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    message: "Credit facility not found"
    trigger: "A facility path id or facility_id FK does not resolve"
  - error_id: ERR_BANK_NOT_FOUND
    http_status: 404
    message: "Bank not found"
    trigger: "A bank path id, nominated_bank_id, advising_bank_id, confirming_bank_id or presenting_bank_id does not resolve"
  - error_id: ERR_BENEFICIARY_NOT_FOUND
    http_status: 404
    message: "Beneficiary not found"
    trigger: "A beneficiary path id or beneficiary_id FK does not resolve"
  - error_id: ERR_CREDIT_NOT_FOUND
    http_status: 404
    message: "Documentary credit not found"
    trigger: "A credit path id or credit_id FK does not resolve"
  - error_id: ERR_AMENDMENT_NOT_FOUND
    http_status: 404
    message: "Amendment not found"
    trigger: "An amendment path id does not resolve"
  - error_id: ERR_PRESENTATION_NOT_FOUND
    http_status: 404
    message: "Presentation not found"
    trigger: "A presentation path id or presentation_id FK does not resolve"
  - error_id: ERR_WAIVER_REQUEST_NOT_FOUND
    http_status: 404
    message: "Waiver request not found"
    trigger: "A waiver-request path id does not resolve"
  - error_id: ERR_SETTLEMENT_CLAIM_NOT_FOUND
    http_status: 404
    message: "Settlement claim not found"
    trigger: "A settlement-claim path id does not resolve"
  - error_id: ERR_SCREENING_CHECK_NOT_FOUND
    http_status: 404
    message: "Screening check not found"
    trigger: "A screening-check path id does not resolve"

  # ---- state preconditions ----
  - error_id: ERR_CREDIT_NOT_DRAFT
    http_status: 409
    message: "Credit terms can only be edited while the credit is a draft"
    trigger: "POST /credits/{id}/documentary-requirements or submit-for-approval on a credit whose status is not DRAFT"
  - error_id: ERR_CREDIT_NOT_APPROVED
    http_status: 409
    message: "Credit must be approved before it can be issued"
    trigger: "POST /credits/{id}/issue on a credit whose status is not APPROVED (this outranks the facility headroom check)"
  - error_id: ERR_CREDIT_NOT_ISSUED
    http_status: 409
    message: "Operation requires an issued credit"
    trigger: "Drafting an amendment, opening a presentation, or consenting to an amendment when the credit's status is not ISSUED or AMENDMENT_PENDING"
  - error_id: ERR_CREDIT_TERMINAL
    http_status: 409
    message: "Credit is in a terminal state"
    trigger: "Any transition attempted on a credit in EXPIRED, CANCELLED or UTILISED"
  - error_id: ERR_CREDIT_HAS_LIVE_PRESENTATION
    http_status: 409
    message: "Credit cannot be cancelled while a presentation is live"
    trigger: "POST /credits/{id}/cancel while a presentation on that credit is neither REFUSED nor settled/void"
  - error_id: ERR_AMENDMENT_NOT_DRAFT
    http_status: 409
    message: "Amendment has already been issued"
    trigger: "POST /amendments/{id}/issue on an amendment whose status is not DRAFT"
  - error_id: ERR_AMENDMENT_NOT_PENDING_CONSENT
    http_status: 409
    message: "Amendment is not awaiting beneficiary consent"
    trigger: "POST /amendments/{id}/consent on an amendment whose status is not PENDING_CONSENT"
  - error_id: ERR_PRESENTATION_NOT_EXAMINABLE
    http_status: 409
    message: "Presentation is not in an examinable state"
    trigger: "Adding a document to a presentation that is no longer RECEIVED, or raising a discrepancy on one that is not UNDER_EXAMINATION"
  - error_id: ERR_PRESENTATION_ALREADY_CONCLUDED
    http_status: 409
    message: "Examination has already been concluded for this presentation"
    trigger: "A second conclude-examination or a second refuse call on the same presentation"
  - error_id: ERR_PRESENTATION_NOT_COMPLYING
    http_status: 409
    message: "A claim can only be lodged against complying documents"
    trigger: "POST /presentations/{id}/settlement-claims while examination_status is not COMPLYING"
  - error_id: ERR_WAIVER_NOT_PENDING
    http_status: 409
    message: "Waiver request is no longer pending"
    trigger: "POST /waiver-requests/{id}/respond on a request already GRANTED, DENIED or EXPIRED"
  - error_id: ERR_WAIVER_RESPONSE_PENDING
    http_status: 409
    message: "A waiver response is still awaited"
    trigger: "POST /presentations/{id}/refuse while a WaiverRequest is PENDING and inside its window"
  - error_id: ERR_CLAIM_NOT_LODGED
    http_status: 409
    message: "Settlement claim is not in a settleable state"
    trigger: "POST /settlement-claims/{id}/settle on a claim that is not LODGED"
  - error_id: ERR_FACILITY_NOT_ACTIVE
    http_status: 409
    message: "Credit facility is not active"
    trigger: "POST /credits/{id}/issue when the facility's status is not ACTIVE or its utilisation_posture is FROZEN"
  - error_id: ERR_FACILITY_STILL_RESTRICTED
    http_status: 409
    message: "Facility cannot be reactivated while it remains over the restriction threshold"
    trigger: "REINSTATE while allocated_cents >= restrict_threshold_cents"
  - error_id: ERR_FACILITY_HAS_OPEN_ALLOCATION
    http_status: 409
    message: "Facility cannot be closed while allocations remain open"
    trigger: "CLOSE while at least one FacilityAllocation on the facility is OPEN"
  - error_id: ERR_SCREENING_NOT_REVIEWABLE
    http_status: 409
    message: "Only a pending screening hit can be reviewed"
    trigger: "POST /screening-checks/{id}/review on a check whose result is not HIT_PENDING_REVIEW"

  # ---- concurrency ----
  - error_id: ERR_STALE_CREDIT_VERSION
    http_status: 412
    message: "Credit has been modified since it was read"
    trigger: "POST /credits/{id}/amendments with expected_credit_version != DocumentaryCredit.version"
  - error_id: ERR_STALE_FACILITY_VERSION
    http_status: 412
    message: "Credit facility has been modified since it was read"
    trigger: "POST /facilities/{id}/collateral-postings with expected_facility_version != CreditFacility.version"

  # ---- business_safety (priority 20) ----
  - error_id: ERR_SANCTIONS_BLOCK
    http_status: 403
    message: "Operation is blocked by sanctions screening"
    trigger: "A named party carries sanctions_flag == true, or the governing ScreeningCheck result is BLOCKED (risk_score >= 100). Outranks referential, constraint and fiscal checks."
  - error_id: ERR_SCREENING_REVIEW_PENDING
    http_status: 409
    message: "A screening hit is awaiting compliance review"
    trigger: "POST /presentations/{id}/conclude-examination or POST /presentations/{id}/waiver-requests while the newest PRESENTED_DOCUMENTS ScreeningCheck sits at HIT_PENDING_REVIEW (40 <= risk_score < 100); settlement uses ERR_SCREENING_NOT_CLEARED for the same result"
  - error_id: ERR_DUAL_USE_ESCALATED
    http_status: 409
    message: "Dual-use goods screening has been escalated and settlement is barred"
    trigger: "POST /settlement-claims/{id}/settle while the governing ScreeningCheck result is ESCALATED"
  - error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 409
    message: "Screening has not been cleared for this presentation"
    trigger: "POST /settlement-claims/{id}/settle while the newest PRESENTED_DOCUMENTS ScreeningCheck sits at HIT_PENDING_REVIEW - the priority-4 cross-entity guard; BLOCKED and ESCALATED are excluded from this rule and raise ERR_SANCTIONS_BLOCK / ERR_DUAL_USE_ESCALATED instead"
  - error_id: ERR_APPLICANT_KYC_NOT_CLEARED
    http_status: 422
    message: "Applicant KYC is not cleared"
    trigger: "POST /credits with an applicant whose kyc_status is not CLEARED"
  - error_id: ERR_ADVISING_BANK_INELIGIBLE
    http_status: 422
    message: "Advising bank is not eligible"
    trigger: "POST /credits naming an advising bank that is not ACTIVE or carries sanctions_flag == true"

  # ---- business_temporal (priority 22) ----
  - error_id: ERR_SHIPMENT_AFTER_EXPIRY
    http_status: 422
    message: "Latest shipment date cannot fall after the credit expiry date"
    trigger: "POST /credits, or an amendment, where latest_shipment_date > expiry_date, or expiry_date <= issue_date"
  - error_id: ERR_PRESENTATION_WINDOW_CLOSED
    http_status: 422
    message: "The presentation period has closed"
    trigger: "POST /presentations/{id}/submit after presentation_deadline_date = min(expiry_date, latest_shipment_date + presentation_period_days)"
  - error_id: ERR_EXAMINATION_PERIOD_EXPIRED
    http_status: 409
    message: "The examination period has elapsed and the bank is precluded from refusing"
    trigger: "Raising a discrepancy, concluding examination, or sending a refusal notice after examination_deadline (five banking days following the day of presentation, inclusive to 23:59:59.999Z)"
  - error_id: ERR_WAIVER_WINDOW_CLOSED
    http_status: 409
    message: "The waiver response window has closed"
    trigger: "POST /waiver-requests/{id}/respond after WaiverRequest.deadline_at"
  - error_id: ERR_CONSENT_WINDOW_CLOSED
    http_status: 409
    message: "The beneficiary consent window has closed"
    trigger: "POST /amendments/{id}/consent after Amendment.consent_deadline_date"
  - error_id: ERR_CONFIRMATION_WINDOW_CLOSED
    http_status: 422
    message: "The confirmation window for this credit is closed"
    trigger: "POST /credits/{id}/confirmation-requests when the clock falls outside the half-open [confirmation_window_start, confirmation_window_end)"
  - error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    message: "The logical clock cannot move backwards"
    trigger: "POST /_clock/set_current_utc with to_iso8601 earlier than the current logical clock"

  # ---- business_constraint (priority 23) ----
  - error_id: ERR_AMENDMENT_WINDOW_CONFLICT
    http_status: 409
    message: "Amendment consent window conflicts with another amendment on this credit"
    trigger: "POST /amendments/{id}/issue where the closed consent interval, widened by the symmetric two-day cooling-off buffer, touches another amendment's window on the same credit"
  - error_id: ERR_CONFIRMING_LINE_WINDOW_FULL
    http_status: 409
    message: "Confirming bank's line is fully occupied over the requested window"
    trigger: "POST /credits/{id}/confirmation-requests where the peak concurrent occupancy over half-open windows, including the candidate, exceeds Bank.confirmation_appetite_cents"
  - error_id: ERR_CONFIRMING_BANK_INELIGIBLE
    http_status: 422
    message: "Named confirming bank is not eligible to confirm this credit"
    trigger: "The named bank is not ACTIVE, carries sanctions_flag == true, has country_risk_score > 60, or is domiciled in the beneficiary's own country"
  - error_id: ERR_NO_ELIGIBLE_CONFIRMING_BANK
    http_status: 422
    message: "No eligible confirming bank is available"
    trigger: "POST /credits/{id}/confirmation-requests with confirming_bank_id omitted and an empty candidate pool"
  - error_id: ERR_INCOTERM_DOCUMENT_MISMATCH
    http_status: 422
    message: "Documentary requirements do not match the credit's incoterm"
    trigger: "Submitting for approval, or issuing an amendment, with no COMMERCIAL_INVOICE requirement, no transport requirement, a CIF/CIP incoterm lacking an INSURANCE_CERTIFICATE requirement, or an FOB/FCA/EXW incoterm carrying one"
  - error_id: ERR_PRESENTATION_INCOMPLETE
    http_status: 422
    message: "Presentation does not answer every mandatory documentary requirement"
    trigger: "POST /presentations/{id}/submit with zero documents, or leaving a mandatory requirement unanswered, or with fewer originals than originals_required"
  - error_id: ERR_DUPLICATE_KEY
    http_status: 409
    message: "A record with this key already exists"
    trigger: "A duplicate swift_bic, a duplicate (legal_name, country_code) applicant pair, or a discrepancy code repeated on one presentation"
  - error_id: ERR_LIVE_REQUEST_EXISTS
    http_status: 409
    message: "A live request of this kind already exists"
    trigger: "A second live WaiverRequest or a second live SettlementClaim on the same presentation"
  - error_id: ERR_EMPTY_CHANGE_SET
    http_status: 422
    message: "Amendment change set is empty or names a field that cannot be amended"
    trigger: "POST /credits/{id}/amendments where every key is a no-op against current values, or a key is outside the amendable field set"

  # ---- business_referential (priority 24) ----
  - error_id: ERR_CLAIM_TYPE_MISMATCH
    http_status: 422
    message: "Claim type is not admitted by the credit's availability"
    trigger: "POST /presentations/{id}/settlement-claims with a claim_type the credit's available_by does not admit (e.g. NEGOTIATION under a SIGHT_PAYMENT credit)"
  - error_id: ERR_BANK_NOT_NOMINATED
    http_status: 422
    message: "Presenting bank is not nominated under this credit"
    trigger: "POST /presentations where presenting_bank_id is neither the beneficiary's nominated bank, nor the advising bank, nor the confirming bank"
  - error_id: ERR_FACILITY_APPLICANT_MISMATCH
    http_status: 422
    message: "Credit facility does not belong to this applicant or is in another currency"
    trigger: "POST /credits where the facility's applicant_id differs from the credit's applicant_id, or its currency differs from the credit's currency"
  - error_id: ERR_FACILITY_EXPIRED
    http_status: 422
    message: "Credit facility expires before the credit does"
    trigger: "POST /credits where CreditFacility.facility_expiry_date is earlier than the credit's expiry_date"
  - error_id: ERR_DISCREPANCY_CODE_UNKNOWN
    http_status: 422
    message: "Discrepancy code is not recognised for this credit"
    trigger: "Raising a code outside the credit's requirements and the fixed UCP list, or naming in a waiver request a code that is not an IDENTIFIED discrepancy on the presentation"
  - error_id: ERR_CLAIM_AMOUNT_MISMATCH
    http_status: 422
    message: "Claimed amount does not match the presented drawing"
    trigger: "POST /presentations/{id}/settlement-claims with claimed_amount_cents != Presentation.drawn_amount_cents"
  - error_id: ERR_BENEFICIARY_CONSENT_REQUIRED
    http_status: 422
    message: "Cancelling an issued credit requires the beneficiary's consent"
    trigger: "POST /credits/{id}/cancel on an ISSUED credit without beneficiary_consent_reference"

  # ---- business_fiscal (priority 26) ----
  - error_id: ERR_FACILITY_LIMIT_EXCEEDED
    http_status: 422
    message: "Operation exceeds the applicant's credit facility limit"
    trigger: "Issuance, confirmation pricing, or amendment acceptance where the required allocation plus charges exceeds CreditFacility.available_cents; exact equality is admitted"
  - error_id: ERR_CREDIT_DRAWABLE_EXCEEDED
    http_status: 422
    message: "Drawing exceeds the amount still available under the credit"
    trigger: "POST /presentations/{id}/submit where drawn_amount_cents > DocumentaryCredit.available_cents; exact equality is admitted"
  - error_id: ERR_CHARGES_EXCEED_PROCEEDS
    http_status: 422
    message: "Charges exceed the drawn amount"
    trigger: "POST /settlement-claims/{id}/settle where commission + discount + document fees would exceed drawn_amount_cents"
  - error_id: ERR_COLLATERAL_RELEASE_EXCEEDS_POSTED
    http_status: 422
    message: "Collateral release exceeds the amount posted"
    trigger: "POST /facilities/{id}/collateral-postings with a negative amount_cents that would drive collateral_posted_cents below zero"
  - error_id: ERR_COLLATERAL_RELEASE_BLOCKED
    http_status: 422
    message: "Collateral release would strand collateral already credited to open allocations"
    trigger: "POST /facilities/{id}/collateral-postings with a negative amount_cents that would leave collateral_posted_cents below the collateral credit already granted to OPEN allocations"

# =========================================================================
# §1.7 RBAC Matrix
# role_model: segregation_of_duties. Every request carries X-User-ID and
# X-User-Role. For an entity_backed role the X-User-ID header IS the id of the
# backing row the principal acts for (e.g. an ApplicantUser sends the
# Applicant.id, a CorrespondentBank sends the Bank.id); ownership checks compare
# that header against the addressed instrument. Opaque roles send a free-form
# operator id used only for segregation-of-duties comparisons. There is NO hierarchical override - a CreditOfficer cannot
# do a TradeFinanceOfficer's work and vice versa.
# =========================================================================
roles:
  - name: CreditOfficer
    backing: opaque
    description: "Owns applicant onboarding, facility limits, collateral and the credit approval decision. Never drafts or issues a credit."
    exclusive_operations:
      - "POST /applicants"
      - "POST /applicants/{id}/facilities"
      - "POST /facilities/{id}/collateral-postings"
      - "POST /facilities/{id}/status-changes"
      - "POST /banks"
      - "POST /credits/{id}/approve"
    shared_operations:
      - "PATCH /banks/{id} (shared with ComplianceOfficer)"
      - "all GET reads on applicants, facilities, banks, credits, presentations, allocations and screening checks"
    segregation_rules:
      - "POST /credits/{id}/approve requires X-User-ID != DocumentaryCredit.drafted_by_user_id, else ERR_SEGREGATION_OF_DUTIES (403)"
  - name: TradeFinanceOfficer
    backing: opaque
    description: "Drafts credit terms and documentary requirements, issues credits, requests confirmations, drafts and issues amendments, settles claims. Cannot approve its own credits and cannot set facility limits."
    exclusive_operations:
      - "POST /beneficiaries"
      - "POST /credits"
      - "POST /credits/{id}/documentary-requirements"
      - "POST /credits/{id}/submit-for-approval"
      - "POST /credits/{id}/issue"
      - "POST /credits/{id}/confirmation-requests"
      - "POST /credits/{id}/cancel"
      - "POST /credits/{id}/amendments"
      - "POST /amendments/{id}/issue"
      - "POST /settlement-claims/{id}/settle"
    shared_operations:
      - "all GET reads on applicants, facilities, banks, beneficiaries, credits, amendments, presentations, documents, discrepancies, waiver requests, claims and screening checks"
    segregation_rules:
      - "POST /amendments/{id}/issue requires X-User-ID != Amendment.drafted_by_user_id, else ERR_SEGREGATION_OF_DUTIES (403)"
  - name: DocumentExaminer
    backing: opaque
    description: "Examines presented documents against the credit inside the five-banking-day period: raises discrepancies, concludes examination, requests waivers, sends the single refusal notice. Cannot settle and cannot amend."
    exclusive_operations:
      - "POST /presentations/{id}/discrepancies"
      - "POST /presentations/{id}/conclude-examination"
      - "POST /presentations/{id}/waiver-requests"
      - "POST /presentations/{id}/refuse"
    shared_operations:
      - "GET reads on credits, documentary requirements, presentations, documents, discrepancies, waiver requests, claims, banks, beneficiaries, applicants and screening checks"
  - name: ComplianceOfficer
    backing: opaque
    description: "Runs and adjudicates sanctions and dual-use screening, and maintains bank risk posture. Cannot issue, examine or settle."
    exclusive_operations:
      - "POST /presentations/{id}/screenings"
      - "POST /screening-checks/{id}/review"
    shared_operations:
      - "PATCH /banks/{id} (shared with CreditOfficer)"
      - "GET reads on applicants, facilities, banks, beneficiaries, credits, amendments, presentations, documents, discrepancies, waiver requests, claims and screening checks"
    segregation_rules:
      - "POST /screening-checks/{id}/review requires X-User-ID != ScreeningCheck.screened_by_user_id, else ERR_SEGREGATION_OF_DUTIES (403)"
  - name: ApplicantUser
    backing: "entity_backed:Applicant"
    description: "Acts for one applicant. Its only write is the discrepancy waiver decision."
    exclusive_operations:
      - "POST /waiver-requests/{id}/respond"
    shared_operations:
      - "GET /applicants/{id}, GET /applicants/{id}/facilities, GET /facilities/{id}, GET /credits/{id}, GET /credits/{id}/amendments, GET /presentations/{id}, GET /presentations/{id}/discrepancies, GET /presentations/{id}/waiver-requests - all scoped to its own applicant_id"
    scoping_rules:
      - "X-User-ID must equal the applicant_id reachable from the addressed row, else ERR_PRINCIPAL_NOT_PARTY (403)"
  - name: BeneficiaryUser
    backing: "entity_backed:Beneficiary"
    description: "Acts for one beneficiary (the exporter). Its only write is the amendment consent decision."
    exclusive_operations:
      - "POST /amendments/{id}/consent"
    shared_operations:
      - "GET /beneficiaries/{id}, GET /credits/{id}, GET /credits/{id}/documentary-requirements, GET /credits/{id}/amendments, GET /presentations/{id} - all scoped to its own beneficiary_id"
    scoping_rules:
      - "X-User-ID must equal the credit's beneficiary_id, else ERR_PRINCIPAL_NOT_PARTY (403)"
  - name: CorrespondentBank
    backing: "entity_backed:Bank"
    description: "Acts for one bank in its advising, confirming or presenting capacity: responds to confirmation requests, opens presentations, adds documents, submits, lodges claims."
    exclusive_operations:
      - "POST /credits/{id}/confirmation-responses"
      - "POST /presentations"
      - "POST /presentations/{id}/documents"
      - "POST /presentations/{id}/submit"
      - "POST /presentations/{id}/settlement-claims"
    shared_operations:
      - "GET /banks/{id}, GET /credits/{id}, GET /credits/{id}/documentary-requirements, GET /presentations/{id}, GET /presentations/{id}/documents, GET /presentations/{id}/discrepancies, GET /presentations/{id}/settlement-claims"
    scoping_rules:
      - "On a confirmation response X-User-ID must equal DocumentaryCredit.confirming_bank_id; on presentation writes it must equal Presentation.presenting_bank_id, else ERR_PRINCIPAL_NOT_PARTY (403)"
  - name: SystemOperator
    backing: opaque
    description: "Drives the deterministic logical clock and the operational expiry sweep. Has no business write authority at all."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-expiry-sweep"
    shared_operations: []
