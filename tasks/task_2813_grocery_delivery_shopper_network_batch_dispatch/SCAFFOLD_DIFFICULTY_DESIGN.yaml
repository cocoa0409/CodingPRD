          - entities.Batch.fields.shop_window_start
        distinguishing_aspect: |
          Resource = Shopper time, interval semantics = HALF-OPEN
          [shop_window_start, delivery_deadline + 15 min) with the turnaround buffer on the END
          only: a second batch whose window starts at 11:10 collides with a held batch whose
          deadline is 11:00 purely because of the buffer, while a start of exactly 11:15 would
          not collide (strict <).
