            - { call: "POST /api/party-profiles", payload: { full_name: "Adv R", university_id: "U-ADVR-1", role_type: "EXTERNAL", email: "advr@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advr_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["OTHER_SEX_BASED"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
            - call: "POST /api/cases/${case_id}/investigator-assignments"
              payload: { investigator_id: "${inv_id}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { asg_id: $.data.id }
            - { call: "POST /api/investigator-assignments/${asg_id}/accept", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { v1: $.data.version } }
            - call: "POST /api/cases/${case_id}/evidence-packets"
              payload: { expected_case_version: "${v1}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { pkt_id: $.data.id }
            - { call: "POST /api/evidence-packets/${pkt_id}/attach-report", payload: { investigative_report_summary: "Narrative" }, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/release", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "COMPLAINANT", response_text: "ok" }, as: Party, as_user_id: "${comp_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "RESPONDENT", response_text: "ok" }, as: Party, as_user_id: "${resp_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/finalize", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/cases/${case_id}/advisor-appointments", payload: { party_side: "COMPLAINANT", advisor_id: "${advc_id}" }, as: Party, as_user_id: "${comp_id}" }
            - { call: "POST /api/cases/${case_id}/advisor-appointments", payload: { party_side: "RESPONDENT", advisor_id: "${advr_id}" }, as: Party, as_user_id: "${resp_id}" }
            - call: "POST /api/cases/${case_id}/hearings"
              payload: { decision_maker_id: "${dm_id}", scheduled_at: "2026-09-01T10:00:00Z", estimated_duration_minutes: 60, modality: "VIRTUAL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { hr_id: $.data.id }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:00:00Z" }, as: CaseAdministrator }
            - { call: "POST /api/hearings/${hr_id}/convene", as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "POST /api/hearings/${hr_id}/close-cross-exam", as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { v_obs: $.data.version } }
          trigger:
            - call: "POST /api/cases/${case_id}/determinations"
              payload: { responsibility_finding: "RESPONSIBLE", standard_of_evidence: "PREPONDERANCE", rationale: "Draft one", expected_case_version: "${v_obs}" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { det1: $.data.id }
            - call: "POST /api/cases/${case_id}/determinations"
              payload: { responsibility_finding: "RESPONSIBLE", standard_of_evidence: "PREPONDERANCE", rationale: "Draft two stale", expected_case_version: "${v_obs}" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { err: $.data.error_id }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { v_fresh: $.data.version } }
            - call: "POST /api/cases/${case_id}/determinations"
              payload: { responsibility_finding: "NOT_RESPONSIBLE", standard_of_evidence: "PREPONDERANCE", rationale: "Draft two fresh", expected_case_version: "${v_fresh}" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { det2: $.data.id }
            - { call: "GET /api/determinations/${det1}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { d1_st: $.data.status } }
          assert:
            - "second draft with the stale version rejected 412 ERR_STALE_CASE_VERSION"
            - "retry with the fresh version succeeds: Determination.${det2}.status == DRAFT"
            - "first draft Determination.${det1}.status == SUPERSEDED (create-with-supersede semantics applied to the winner's retry)"

  # ==========================================================================
  # Section: consistency_model
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_response_and_reads
        claim_type: immediate
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the terminate response itself shows TERMINATED, and the very next reads (measure GET, case GET) reflect the new state and decremented counter with no lag or reconciliation delay."
        test_recipe:
          setup: ["case with one ACTIVE measure"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - call: "POST /api/cases/${case_id}/supportive-measures"
              payload: { measure_type: "COUNSELING", party_side: "COMPLAINANT", description: "Counseling", effective_from: "2026-08-01T00:00:00Z" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { m_id: $.data.id }
          trigger:
            - { call: "POST /api/supportive-measures/${m_id}/terminate", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { m_st: $.data.status, m_ver: $.data.version } }
            - { call: "GET /api/supportive-measures/${m_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { cnt: $.data.active_supportive_measure_count } }
          assert:
            - "terminate response body already shows status TERMINATED with version incremented to 2 (mutation visible in the same response)"
            - "immediately following GETs agree: measure TERMINATED, case.active_supportive_measure_count == 0"
