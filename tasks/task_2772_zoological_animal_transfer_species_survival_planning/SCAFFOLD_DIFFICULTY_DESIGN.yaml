  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: execute_cascade_four_links_to_cycle_closed
        grounds:
          - state_machines.TransferAgreement.ACCEPTED_to_EXECUTED
          - state_machines.Animal.HELD_to_RESERVED
          - state_machines.PopulationRecommendation.ENDORSED_to_FULFILLED
          - state_machines.SpeciesProgram.PUBLISHED_to_CYCLE_CLOSED
          - calculations.program_recommendation_rollup
          - calculations.holding_slot_occupancy
        distinguishing_aspect: |
          One execute call propagates four links across four different entities:
          agreement -> animal location_status -> recommendation status ->
          species program open_recommendation_count -> plan_status CYCLE_CLOSED. The fourth link
          is conditional on the recomputed count reaching 0, so a test that only checks the
          agreement and the animal passes while the program is left stale.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default for accession and negotiation, then moved to 2026-08-10T09:00:00Z."
            - "Exactly one recommendation exists in the published plan, so open_recommendation_count is 1 before the trigger."
            - "The agreement is ACCEPTED with ownership_disposition OWNERSHIP_TRANSFER."
