  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- Instance 1: trip void restores lifetime_safe_miles (odometer conserved) ----
      - name: trip_void_restores_lifetime_safe_miles
        grounds:
          - state_machines.Trip.ACCEPTED_to_VOIDED
          - state_machines.Trip.OPEN_to_ACCEPTED
          - entities.Driver.fields.lifetime_safe_miles
        distinguishing_aspect: |
          Conserved quantity = Driver.lifetime_safe_miles. Accepting a 30-mile policy trip adds
          30; voiding it subtracts exactly 30, restoring lifetime_safe_miles to its pre-accept
          value (the invariant: lifetime_safe_miles == sum of distance_miles over ACCEPTED trips).
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; policy P bound; driver.lifetime_safe_miles == 0 (enrollment trips are not policy-bound and do not count)"
            - "One policy trip T of 30 miles accepted -> lifetime_safe_miles == 30; no statement settled over its period"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: UnderwritingOps
            - call: "POST /rate-plans"
