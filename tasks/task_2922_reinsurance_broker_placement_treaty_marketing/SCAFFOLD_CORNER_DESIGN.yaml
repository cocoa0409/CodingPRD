          - entities.ClaimAdvocacy.fields.collectible_minor
          - entities.ClaimAdvocacy.fields.arbitration_cost_minor
        distinguishing_aspect: |
          The four buckets are evaluated in order and the narrowest one binds, differently per layer
          type. On the QUOTA_SHARE layer the subject amount is a percentage of the ground-up loss
          (100,000,000 * 40% = 40,000,000) and nothing narrower applies. On the CATASTROPHE layer the
          subject amount is excess of the attachment (2,600,000,000 - 2,000,000,000 = 600,000,000) but
          the agreed per-event SUBLIMIT of 250,000,000 binds ahead of both the limit and the
          aggregate. Notification erodes nothing, and the dispute overlay then subtracts only the
          unsettled part of the dispute.
