              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r1_id: $.data.id }
            - call: "POST /farm-network/routes/${r1_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 4 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/routes/${r1_id}/stops/1/collect"
              payload: { collected_cases: 4, laid_start_date: "2026-09-06", laid_end_date: "2026-09-07" }
              as: PlantOperator
              captures: { lot1_id: $.data.id }
            - call: "POST /farm-network/lots/${lot1_id}/grade"
              payload: { quality_score: 90 }
              as: QualityManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-09", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r2_id: $.data.id }
            - call: "POST /farm-network/routes/${r2_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 2 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/routes/${r2_id}/stops/1/collect"
              payload: { collected_cases: 2, laid_start_date: "2026-09-07", laid_end_date: "2026-09-08" }
              as: PlantOperator
              captures: { lot2_id: $.data.id }
            - call: "POST /farm-network/lots/${lot2_id}/grade"
              payload: { quality_score: 60 }
              as: QualityManager
          trigger:
            - call: "POST /farm-network/lots/${lot1_id}/cartons"
              payload: { carton_count: 40, pack_size: "LARGE" }
              as: PlantOperator
            - call: "POST /farm-network/lots/${lot1_id}/cartons"
              payload: { carton_count: 80, pack_size: "LARGE" }
              as: PlantOperator
            - call: "POST /farm-network/lots/${lot2_id}/resolve-hold"
              payload: { disposition: "REJECT" }
              as: QualityManager
            - call: "GET /farm-network/lots/${lot1_id}"
              as: QualityManager
            - call: "GET /farm-network/lots/${lot2_id}"
              as: QualityManager
          assert:
            - "after pack 40: L1 remaining 80 + packed 40 + destroyed 0 == received 120"
            - "after pack 80: L1 status == PACKED, remaining 0 + packed 120 + destroyed 0 == received 120"
            - "after reject: L2 remaining 0 + packed 0 + destroyed 60 == received 60 (destruction is the compensating action that preserves the invariant)"

      - name: route_case_conservation_add_collect_skip
        grounds:
          - calculations.route_load_reconciliation
          - entities.CollectionRoute.fields.available_cases
        distinguishing_aspect: |
          Conserved quantity = route case capacity (different conserved quantity than lot
          dozens): capacity_cases == committed_cases + available_cases after every forward
          action (stop add, over/under-collect) and its compensating action (skip restores
          the full planned_cases).
        test_recipe:
          setup:
            - "ACTIVE farms A and B (B's audit completed at 10:00 for clock monotonicity)"
            - "route R capacity 10 on 2026-09-08"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Farm Alpha", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { fa_id: $.data.id }
