              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/examine"
              as: StateExaminer
              as_user_id: "shared-1"
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              as: StateApprover
              as_user_id: "shared-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SOD_VIOLATION"
            - "Claim.${claim_id}.status == UNDER_REVIEW"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown X-User-Role is rejected ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /holders"
              payload: { legal_name: "X", incorporation_state: "NY", holder_type: "BANK" }
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  # Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_report_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-add-property-stale-report]
          - errors[ERR_STALE_REPORT_VERSION]
        distinguishing_aspect: "After one successful add bumps the report to version 2, a second add carrying the pre-add version (${rep_v0}=1) is rejected ERR_STALE_REPORT_VERSION (412)."
        test_recipe:
          setup: ["A DRAFT CA report (version 1) and two DORMANT no-DD CA properties."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "A", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_a_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "B", owner_last_known_state: "CA", amount_cents: 60000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_b_id: $.data.id }
            - call: "POST /properties/${prop_a_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /properties/${prop_b_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v0: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_a_id}", expected_report_version: "${rep_v0}" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { rep_v1: $.data.version }
          trigger:
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_b_id}", expected_report_version: "${rep_v0}" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_REPORT_VERSION"
            - "HolderReport.${report_id}.property_count == 1"

      - name: report_version_increments_on_successful_add
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-add-property-stale-report]", entities.HolderReport.version]
        distinguishing_aspect: "A successful add-property increments HolderReport.version from 1 to 2; the correct expected_report_version succeeds."
        test_recipe:
          setup: ["A DRAFT CA report (version 1) and one DORMANT no-DD CA property."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "A", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_a_id: $.data.id }
            - call: "POST /properties/${prop_a_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v0: $.data.version }
          trigger:
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_a_id}", expected_report_version: "${rep_v0}" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { rep_v1: $.data.version }
          assert:
            - "HolderReport.${report_id}.version == 2"
            - "HolderReport.${report_id}.property_count == 1"
            - "HolderReport.${report_id}.total_remitted_cents == 50000"

  # ===========================================================================
  # Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_properties_pagination_envelope
        claim_type: listing
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /properties returns an array envelope with total_count and has_more; filtering by holder_id restricts results."
        test_recipe:
          setup: ["One holder with two ACTIVE properties."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "A", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "B", owner_last_known_state: "CA", amount_cents: 60000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
          trigger:
            - call: "GET /properties?holder_id=${holder_id}&limit=10&offset=0"
              as: StateAdmin
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.data length == 2"

      - name: evidence_reverse_reachable_via_claim_subresource
        claim_type: fk_integrity
        grounds: [entities.EvidenceDocument.claim_id, endpoints]
        distinguishing_aspect: "GET /claims/{id}/evidence returns the EvidenceDocument[] uploaded for that claim (FK reverse-reachability)."
        test_recipe:
          setup: ["An OWNER claim in NEEDS_EVIDENCE with one uploaded evidence document."]
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane", ssn_last4: "1234", address_state: "CA", email: "j@x.com" }
              as: StateAdmin
