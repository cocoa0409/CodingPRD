        distinguishing_aspect: "The DRAFT -> PENDING_APPROVAL -> DRAFT loop is a genuine cycle with a memory-clearing side effect: revise nulls submitted_by_user_id, so a DIFFERENT designer's re-submit changes who is barred from approving, and the same program traverses the loop twice with a monotonically rising version."
        test_recipe:
          setup:
