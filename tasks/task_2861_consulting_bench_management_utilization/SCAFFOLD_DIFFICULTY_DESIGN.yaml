              captures: { pc_id: $.data.id }
            - call: "POST /reskilling-programs"
              payload: { skill_id: "${sk_id}", target_proficiency_level: 5, cohort_start_on: "2026-09-15", cohort_end_on: "2026-09-30", seat_capacity: 2 }
              as: ResourceManager
              captures: { pok_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
            - call: "GET /consultants/${c1_id}"
              payload: {}
              as: ResourceManager
              captures: { c1_v: $.data.version }
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 100.00, start_date: "2026-09-01", end_date: "2026-09-15", category: "BILLABLE", expected_consultant_version: "${c1_v}" }
              as: ResourceManager
              captures: { a1_id: $.data.id }
            - call: "POST /assignments/${a1_id}/confirm"
              payload: {}
              as: ResourceManager
          trigger:
            - call: "POST /reskilling-programs/${pc_id}/enrollments"
              payload: { consultant_id: "${c1_id}" }
              as: ResourceManager
              captures: { err_id: $.data.error_id }
            - call: "POST /reskilling-programs/${pok_id}/enrollments"
              payload: { consultant_id: "${c1_id}" }
              as: ResourceManager
              captures: { bs_id: $.data.id, bs_state: $.data.state }
          assert:
            - "before the trigger: Consultant.${c1_id}.allocated_pct == 0.00, availability_status == BENCH, and GET /bench-spells?consultant_id=${c1_id} returns 1 row in ESCALATED_L1 with age_days == 14"
            - "Assignment.${a1_id}.status == CONFIRMED with confirmed_on == 2026-08-17 and bill_rate_usd_per_hour == 240.00"
            - "the PC enrolment returned 409 with ${err_id} == ERR_COHORT_CONFLICTS_WITH_ASSIGNMENT — the inclusive cohort day 2026-09-14 lies inside [2026-09-01, 2026-09-15)"
            - "ReskillingProgram.${pc_id}.seats_taken == 0 after the rejection"
            - "the POK enrolment returned 200 with ${bs_state} == RESKILLING for BenchSpell ${bs_id}: cohort_start_on 2026-09-15 equals the assignment's EXCLUSIVE end_date, so the two windows are disjoint"
            - "ReskillingProgram.${pok_id}.seats_taken == 1 and BenchSpell.${bs_id}.reskilling_program_id == ${pok_id}"
            - "Consultant.${c1_id}.availability_status == RESKILLING while Assignment.${a1_id}.status is STILL CONFIRMED — the future assignment is not disturbed by the enrolment"
            - "DemandOpportunity.${d1_id}.covered_internal_fte == 1.00 and staffing_status == COVERED, unchanged by the enrolment"

  - rule_id: compensating_invariant
    instances:

      - name: utilization_hour_classification_conserved_across_release
        grounds:
          - calculations.utilization_period_metrics
          - entities.UtilizationPeriod.fields.billable_hours
          - entities.UtilizationPeriod.fields.investment_hours
          - entities.UtilizationPeriod.fields.bench_hours
          - entities.UtilizationPeriod.fields.net_available_hours
          - state_machines.Assignment.CONFIRMED_to_RELEASED
          - endpoints[POST /assignments/{id}/release]
        distinguishing_aspect: |
          Conserved quantity = HOURS inside one UtilizationPeriod: billable_hours +
          investment_hours + bench_hours must equal net_available_hours before and after the
          release, so the 120.00 hours the release takes out of billable must reappear in bench
          to the cent — no hour may be created, destroyed or double-counted by the compensation.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group, one CLOUD_ARCH skill, one consultant (cost 120.00) with an ACTIVE proficiency-4 assertion."
            - "One QUALIFIED / INTERNAL demand 2026-08-03..2026-08-28 for 1.00 FTE, standard 250.00 / requested 240.00."
            - "One CONFIRMED 100.00% BILLABLE assignment over [2026-08-03, 2026-08-29) — the whole 20-workday period."
            - "One OPEN UtilizationPeriod over the INCLUSIVE range 2026-08-03..2026-08-28 with holiday_hours 0.00, so capacity_hours == net_available_hours == 160.00 and every hour is billable at the start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00 }
              as: ResourceManager
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4 }
              as: ResourceManager
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "INTERNAL" }
              as: ResourceManager
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 100.00, start_date: "2026-08-03", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v1}" }
              as: ResourceManager
              captures: { a1_id: $.data.id }
            - call: "POST /assignments/${a1_id}/confirm"
              payload: {}
              as: ResourceManager
            - call: "POST /consultants/${c1_id}/utilization-periods"
              payload: { period_start_on: "2026-08-03", period_end_on: "2026-08-28", holiday_hours: 0.00 }
              as: FinanceController
              captures: { up1_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ResourceManager
            - call: "POST /assignments/${a1_id}/release"
              payload: { reason: "client descoped the workstream" }
              as: ResourceManager
          assert:
            - "before the release: UtilizationPeriod.${up1_id}.capacity_hours == 160.00, net_available_hours == 160.00, billable_hours == 160.00, investment_hours == 0.00, bench_hours == 0.00 — the identity holds at 160.00 + 0.00 + 0.00 == 160.00"
            - "before the release: utilization_pct_target_basis == 100.00 and utilization_pct_available_basis == 100.00"
            - "after the release: Assignment.${a1_id}.status == RELEASED with released_on == 2026-08-10"
            - "after the release: UtilizationPeriod.${up1_id}.billable_hours == 40.00 — only the 5 workdays 2026-08-03..2026-08-07 fall inside the EXCLUSIVE effective end 2026-08-10"
            - "after the release: UtilizationPeriod.${up1_id}.bench_hours == 120.00 and investment_hours == 0.00"
            - "the invariant is exact: 40.00 + 0.00 + 120.00 == 160.00 == net_available_hours, and capacity_hours is STILL 160.00 — the 120.00 hours moved bucket, they did not vanish"
            - "hour_overallocated == false both before and after"
            - "after the release: utilization_pct_target_basis == 25.00, utilization_pct_available_basis == 25.00 and variance_pp == -50.00"
            - "the compensation also ran on the other side of the cascade: Consultant.${c1_id}.allocated_pct == 0.00, availability_status == BENCH, a new BenchSpell is open in MONITORING with started_on == 2026-08-10, and DemandOpportunity.${d1_id}.covered_internal_fte == 0.00 with open_fte == 1.00"

      - name: opportunity_fte_coverage_conserved_across_placement_terminate
        grounds:
          - calculations.demand_coverage
          - entities.DemandOpportunity.fields.covered_internal_fte
          - entities.DemandOpportunity.fields.covered_external_fte
          - entities.DemandOpportunity.fields.open_fte
          - entities.SubcontractorFirm.fields.active_placements_count
          - state_machines.DemandOpportunity.PARTIALLY_COVERED_to_EXTERNAL_SOURCING
          - endpoints[POST /external-placements/{id}/terminate]
        distinguishing_aspect: |
          Conserved quantity = FTE across one demand's coverage identity: covered_internal_fte +
          covered_external_fte + open_fte must equal required_fte 2.00 at every observation, so
          terminating the only placement has to hand exactly 1.00 FTE back to open_fte while
          also freeing the firm's slot and rolling staffing_status back to EXTERNAL_SOURCING.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. One NA group with external_sourcing_cap_pct 100.00 and no consultants (posture OPEN)."
            - "One CLOUD_ARCH skill; one QUALIFIED / EXTERNAL demand for 2.00 FTE, 2026-08-03..2026-08-28."
            - "One APPROVED NA firm with max_concurrent_placements 2 and pass_through 150.00."
            - "One APPROVED placement P1 of 1.00 FTE over the CLOSED interval [2026-08-03, 2026-08-28], leaving the demand half covered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA", external_sourcing_cap_pct: 100.00 }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Globex Bank", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 2.00, win_probability_pct: 70, start_date: "2026-08-03", end_date: "2026-08-28", industry_code: "BANKING", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 240.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "EXTERNAL" }
              as: ResourceManager
            - call: "POST /subcontractor-firms"
              payload: { name: "NorthStar Partners", geo_code: "NA", max_concurrent_placements: 2, pass_through_rate_usd_per_hour: 150.00 }
              as: PracticePartner
              captures: { f1_id: $.data.id }
            - call: "POST /external-placements"
              payload: { subcontractor_firm_id: "${f1_id}", demand_opportunity_id: "${d1_id}", fte: 1.00, start_date: "2026-08-03", end_date: "2026-08-28" }
              as: ResourceManager
              captures: { p1_id: $.data.id }
            - call: "POST /external-placements/${p1_id}/approve"
              payload: {}
              as: PracticePartner
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PracticePartner
            - call: "POST /external-placements/${p1_id}/terminate"
              payload: {}
              as: PracticePartner
          assert:
            - "before the terminate: DemandOpportunity.${d1_id}.covered_internal_fte == 0.00, covered_external_fte == 1.00, open_fte == 1.00 — the identity holds at 0.00 + 1.00 + 1.00 == 2.00 == required_fte"
            - "before the terminate: staffing_status == PARTIALLY_COVERED and SubcontractorFirm.${f1_id}.active_placements_count == 1"
            - "after the terminate: ExternalPlacement.${p1_id}.status == TERMINATED with terminated_on == 2026-08-10"
            - "after the terminate: covered_external_fte == 0.00 and open_fte == 2.00 — the identity still holds at 0.00 + 0.00 + 2.00 == 2.00, with the released FTE landing entirely in open_fte"
            - "after the terminate: staffing_status == EXTERNAL_SOURCING, not INTERNAL_STAFFING — the compensation rolls back along the EXTERNAL branch the demand was committed to"
            - "SubcontractorFirm.${f1_id}.active_placements_count == 0 — the concurrency slot is freed for the whole CLOSED interval, so a fresh 1.00 FTE placement over the identical dates is approvable afterwards"
            - "DemandOpportunity.${d1_id}.staffing_mode is STILL EXTERNAL and pipeline_status is STILL QUALIFIED — the rollback touches coverage, not the branch selection or the pipeline"
            - "no ExternalPlacement row was deleted: GET /external-placements?demand_opportunity_id=${d1_id} returns total_count == 1 with the TERMINATED row still readable"
