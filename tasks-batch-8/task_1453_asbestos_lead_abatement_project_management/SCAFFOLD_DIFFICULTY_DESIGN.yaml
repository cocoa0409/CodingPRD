            - { call: "POST /abatement/manifests", payload: { project_id: "${p_id}", facility_id: "${f_id}", bags_count: 1, gross_weight_lbs: 2003 }, as: Supervisor, as_user_id: "${w_sup}", captures: { m1_id: "$.data.id" } }
