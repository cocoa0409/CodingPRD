        grounds:
          - endpoints.POST_/mills/{millId}/allocation-runs
        distinguishing_aspect: "The allocation selector's empty-pool fallback is a defined no-op (assigned_orders 0, assigned_tons 0), not an error — no CONFIRMED orders means nothing to do."
        test_recipe:
          setup: ["Default logical clock. One mill, no orders."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/allocation-runs"
              payload: {}
              as: Scheduler
          assert:
            - "the response status is 200 with assigned_orders == 0 and assigned_tons == 0"

      - name: power_waiver_duplicate_scope_rejected
        claim_type: conditional_action
        grounds:
          - validations[priority=20]
          - errors.ERR_WAIVER_DUPLICATE
        distinguishing_aspect: "The (scope, scope_id) uniqueness guard: a second HEAT waiver for the same heat is 409 ERR_WAIVER_DUPLICATE, while a waiver for a DIFFERENT heat succeeds — the key is the pair, not the scope."
        test_recipe:
          setup: ["Default logical clock. Mill with two heats H1, H2 PLANNED."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-W1", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_1: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-W2", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T14:00:00Z" }
              as: MillOperator
              captures: { heat_2: $.data.id }
            - call: "POST /mills/${mill_id}/power-waivers"
              payload: { scope: "HEAT", scope_id: "${heat_1}", reason: "first waiver" }
              as: EnergyDispatcher
          trigger:
            - call: "POST /mills/${mill_id}/power-waivers"
              payload: { scope: "HEAT", scope_id: "${heat_1}", reason: "duplicate attempt" }
              as: EnergyDispatcher
              captures: { err_dup: $.data.error_id }
            - call: "POST /mills/${mill_id}/power-waivers"
              payload: { scope: "HEAT", scope_id: "${heat_2}", reason: "different heat" }
              as: EnergyDispatcher
              captures: { waiver_2: $.data.id }
          assert:
            - "the duplicate rejects: err_dup == ERR_WAIVER_DUPLICATE"
            - "the different-heat waiver succeeds (201, waiver_2 captured)"

      - name: campaign_commit_and_order_confirm_occ_guards
        claim_type: conditional_action
        grounds:
          - concurrency_rules[campaign-commit-stale-campaign]
          - concurrency_rules[order-confirm-stale-order]
