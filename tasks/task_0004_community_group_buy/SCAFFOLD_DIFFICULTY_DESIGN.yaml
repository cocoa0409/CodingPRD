# =============================================================================
# Test Targeting Index — Community Group-Buying Platform (v1)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules
# defined in §0.5 of the prd-bench-scaffold-generator skill.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations on different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_total_provisional_vs_final
        grounds:
          - calculations.order_total
          - calculations.discount_tier_selection
          - state_machines.Order.payment_status.PENDING_PAY_to_PAID
          - state_machines.GroupBuyCampaign.FORMING_to_SUCCEEDED
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.settled_total_cents
        distinguishing_aspect: |
          Same Order entity domain (cost-accounting on Order) carries TWO
          divergent total computations: provisional_total_cents pinned at pay
          time uses the discount tier qualified by participant_count at that
          moment, while settled_total_cents pinned at campaign close uses the
          final tier qualified by the close-time participant_count. With
          subtotal=1000, discount_tiers=[{min:1, bp:500}, {min:2, bp:1500}],
          and an Order paid as the first participant (count=1) followed by a
          second pay that lifts count to 2 before close, provisional=950 and
          settled=850 — two different cents on identical Order rows.
        test_recipe:
          setup:
            - "POST /communities -> C1 (region_code='RC1')"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /customers {community_id: C1, display_name: 'Cust2'} -> Cust2"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "POST /communities/{C1}/group-leaders {display_name: 'L1'} -> L1"
            - "POST /group-leaders/{L1}/approve  (L1.status = ACTIVE)"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku: 'SKUA', cold_chain_required: false, unit_price_cents: 1000, discount_tiers: [{min_participants:1, discount_basis_points:500}, {min_participants:2, discount_basis_points:1500}], opens_at_period: 0, deadline_period: 100} -> K1"
            - "Auth as Cust1: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust1, line_items: [{sku:'SKUA', unit_price_cents:1000, quantity:1}]} -> O1 (subtotal_cents = 1000)"
            - "Auth as Cust1: POST /orders/{O1}/pay  (Order.provisional_discount_basis_points = 500, provisional_total_cents = 950 pinned)"
            - "Auth as Cust2: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust2, line_items: [{sku:'SKUA', unit_price_cents:1000, quantity:1}]} -> O2"
            - "Auth as Cust2: POST /orders/{O2}/pay  (participant_count -> 2; O2.provisional_total_cents pinned at 850)"
          trigger:
            - "Auth as L1: POST /group-buy-campaigns/{K1}/close  (campaign -> SUCCEEDED, settled_tier_index=1, settled_discount_basis_points=1500)"
            - "GET /orders/{O1}"
          assert:
            - "Order(O1).provisional_total_cents == 950"
            - "Order(O1).settled_total_cents == 850"
            - "Order(O1).provisional_total_cents != Order(O1).settled_total_cents"
            - "Order(O1).provisional_discount_basis_points == 500"
            - "GroupBuyCampaign(K1).settled_discount_basis_points == 1500"

      - name: leader_chronic_vs_acute_risk_score
        grounds:
          - calculations.leader_chronic_risk_score
          - calculations.leader_acute_risk_score
          - entities.GroupLeader.fields.chronic_risk_score
          - entities.GroupLeader.fields.acute_risk_score
          - state_machines.RiskAlert.OPEN_to_CONFIRMED
        distinguishing_aspect: |
          Different entity domain from order_total_provisional_vs_final:
          GroupLeader (risk-scoring on a leader) instead of Order
          (cost-accounting). Same input — one CONFIRMED BOT_ORDER risk alert
          targeting a single Order owned by leader L1 — produces TWO different
          score values because the two algorithms divide by different
          windowed denominators (30-period vs 5-period) and use different
          weight vectors and a 1.5× acute multiplier. With one alert created
          at period 0 and current_period=0: chronic raw = 0.30 * 1/30 * 100
          = 1.00; acute raw = 0.50 * 1/5 * 100 * 1.5 = 15.00.
        test_recipe:
          setup:
            - "POST /communities -> C1"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "POST /communities/{C1}/group-leaders {display_name: 'L1'} -> L1"
            - "POST /group-leaders/{L1}/approve"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku: 'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 0, deadline_period: 100} -> K1"
            - "Auth as Cust1: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust1, line_items: [{sku:'SKUA', unit_price_cents:100, quantity:1}]} -> O1  (campaign.leader_id == L1)"
            - "POST /risk-alerts {alert_type: 'BOT_ORDER', target_kind: 'ORDER', target_id: O1, severity: 'LOW'} -> A1  (created_period_index = 0)"
            - "POST /risk-alerts/{A1}/confirm"
          trigger:
            - "POST /_sweep/recompute-risk"
            - "GET /group-leaders/{L1}"
          assert:
            - "GroupLeader(L1).chronic_risk_score == 1.00"
            - "GroupLeader(L1).acute_risk_score == 15.00"
            - "GroupLeader(L1).chronic_risk_score != GroupLeader(L1).acute_risk_score"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas in different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: tiered_rebate_3input_nonlinear
        grounds:
          - calculations.tiered_rebate
          - state_machines.GroupBuyCampaign.FORMING_to_SUCCEEDED
          - entities.CommissionEntry.fields.gross_rebate_cents
          - entities.GroupBuyCampaign.fields.cross_community_partner_leader_ids
        distinguishing_aspect: |
          Mode (a) — formula with 3 non-trivially interacting inputs producing
          non-linear output: order_settled_total_cents, primary_tier, and
          secondary_tier interact via additive bonus rate inside the PRIMARY
          branch and via a 15% cap. With order_settled_total=10000 cents,
          primary_tier=1 (PRIMARY_RATE_BP=800), secondary_tier=2 (SECONDARY
          BONUS_BP=100 because cross-community partner is tier-2), the
          PRIMARY beneficiary's gross_rebate_cents = floor(10000 * 900 /
          10000) = 900. Removing the cross-community partner would change
          gross_rate_bp to 800 → gross=800 — i.e. the third input materially
          shifts the result, demonstrating non-linear 3-input interaction.
        test_recipe:
          setup:
            - "POST /communities -> C1 (region 'RC1')"
            - "POST /communities -> C2 (region 'RC2')"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "POST /communities/{C1}/group-leaders {display_name: 'L1'} -> L1  (tier=1)"
            - "POST /group-leaders/{L1}/approve  (L1 ACTIVE, tier=1)"
            - "POST /communities/{C2}/group-leaders {display_name: 'LP_root'} -> LP_root"
            - "POST /group-leaders/{LP_root}/approve  (LP_root tier=1)"
            - "POST /communities/{C2}/group-leaders {parent_leader_id: LP_root, display_name: 'L2'} -> L2  (tier=2 because parent tier+1)"
            - "POST /group-leaders/{L2}/approve  (L2 ACTIVE, tier=2)"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {cross_community_partner_leader_ids: [L2], supplier_id: S1, sku: 'SKUA', cold_chain_required: false, unit_price_cents: 10000, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 0, deadline_period: 100} -> K1"
            - "Auth as Cust1: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust1, line_items: [{sku:'SKUA', unit_price_cents:10000, quantity:1}]} -> O1  (subtotal_cents = 10000)"
            - "Auth as Cust1: POST /orders/{O1}/pay"
          trigger:
            - "Auth as L1: POST /group-buy-campaigns/{K1}/close  (campaign SUCCEEDED, settled_total_cents on O1 = 10000, CommissionEntry rows generated for L1 PRIMARY and L2 SECONDARY)"
            - "Auth as L1: GET /group-leaders/{L1}/commission-entries"
          assert:
            - "Exactly one CommissionEntry exists with leader_id=L1 and order_id=O1"
            - "CommissionEntry(leader=L1, order=O1).leader_role == 'PRIMARY'"
            - "CommissionEntry(leader=L1, order=O1).gross_rebate_cents == 900"

      - name: tax_withholding_round_per_line_then_sum
        grounds:
          - calculations.tax_withholding
          - calculations.tiered_rebate
          - entities.CommissionEntry.fields.tax_withholding_cents
          - entities.CommissionEntry.fields.net_rebate_cents
          - entities.Order.fields.line_items
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: for an Order
          with two line_items each weight 100 (subtotal=200), L1 tier=1 PRIMARY
          (no partner), gross_rebate = floor(200*800/10000) = 16. Distributing
          to lines: 8 + 8. Per-line withholding = round_half_up(8 * 700/10000)
          = round_half_up(0.56) = 1, twice → tax_withholding = 1 + 1 = 2.
          The alternative (sum-then-round) would compute round_half_up(16 *
          700/10000) = round_half_up(1.12) = 1 — different cents. The
          scaffold pins per-line round, then sum.
        test_recipe:
          setup:
            - "POST /communities -> C1"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "POST /communities/{C1}/group-leaders {display_name: 'L1'} -> L1  (tier=1)"
            - "POST /group-leaders/{L1}/approve"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku: 'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 0, deadline_period: 100} -> K1"
            - "Auth as Cust1: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust1, line_items: [{sku:'SKUA', unit_price_cents:100, quantity:1}, {sku:'SKUA', unit_price_cents:100, quantity:1}]} -> O1  (subtotal_cents = 200, two lines)"
            - "Auth as Cust1: POST /orders/{O1}/pay"
          trigger:
            - "Auth as L1: POST /group-buy-campaigns/{K1}/close  (Order.settled_total_cents = 200; CommissionEntry generated for L1 PRIMARY)"
            - "Auth as L1: GET /group-leaders/{L1}/commission-entries"
          assert:
            - "CommissionEntry(leader=L1, order=O1).gross_rebate_cents == 16"
            - "CommissionEntry(leader=L1, order=O1).tax_withholding_cents == 2"
            - "CommissionEntry(leader=L1, order=O1).net_rebate_cents == 14"

  # ===========================================================================
  # Rule 3 — Non-linear state machines on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: after_sales_evidence_loop
        grounds:
          - state_machines.AfterSalesCase.UNDER_REVIEW_to_EVIDENCE_REQUESTED
          - state_machines.AfterSalesCase.EVIDENCE_REQUESTED_to_UNDER_REVIEW
          - entities.AfterSalesCase.fields.evidence_round
        distinguishing_aspect: |
          AfterSalesCase has a CYCLIC sub-machine: UNDER_REVIEW ↔
          EVIDENCE_REQUESTED. The cycle is gated by evidence_round < 2, so
          the loop terminates at evidence_round = 2 — a non-linear shape
          (cycle plus loop-cap). After two complete revolutions, the system
          must reject a third request-evidence with ERR_INVALID_STATE because
          the precondition evidence_round < 2 fails.
        test_recipe:
          setup:
            - "Build an Order O1 through to fulfillment_status=PICKED_UP via the standard pipeline (community, customer, leader, supplier, warehouse, succeeded campaign, plan-shipments, dispatch, arrive-at-pickup, pickup-confirm)"
            - "Auth as Cust1: POST /orders/{O1}/after-sales-cases {case_type: 'REFUND_ONLY', requested_amount_cents: <= O1.settled_total_cents>} -> AS1  (status=FILED)"
            - "Auth as CustomerService: POST /after-sales/{AS1}/start-review  (UNDER_REVIEW, evidence_round=0)"
            - "Auth as CustomerService: POST /after-sales/{AS1}/request-evidence  (EVIDENCE_REQUESTED)"
            - "Auth as Cust1: POST /after-sales/{AS1}/submit-evidence  (UNDER_REVIEW, evidence_round=1)"
            - "Auth as CustomerService: POST /after-sales/{AS1}/request-evidence  (EVIDENCE_REQUESTED)"
            - "Auth as Cust1: POST /after-sales/{AS1}/submit-evidence  (UNDER_REVIEW, evidence_round=2)"
          trigger:
            - "Auth as CustomerService: POST /after-sales/{AS1}/request-evidence  (precondition evidence_round < 2 fails)"
          assert:
            - "Trigger response: HTTP 409, error_id == 'ERR_INVALID_STATE'"
            - "GET /after-sales/{AS1}: status == 'UNDER_REVIEW', evidence_round == 2"

      - name: order_parallel_payment_fulfillment
        grounds:
          - state_machines.Order.payment_status.PENDING_PAY_to_PAID
          - state_machines.Order.payment_status.PAID_to_SETTLED
          - state_machines.Order.fulfillment_status.NOT_PLANNED_to_PLANNED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries TWO PARALLEL state dimensions on one row:
          payment_status and fulfillment_status evolve independently. After
          pay+close, payment_status=SETTLED with fulfillment_status=NOT_PLANNED
          (non-terminal); planning shipments advances fulfillment_status to
          PLANNED while payment_status stays SETTLED — neither dimension
          subsumes the other. (Different entity from after_sales_evidence_loop:
          Order vs AfterSalesCase.)
        test_recipe:
          setup:
            - "POST /communities -> C1 (region_code='RC1')"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "POST /suppliers/{S1}/warehouses {name: 'W1', region_code: 'RC1', cold_chain_capable: false, handling_periods: 1} -> W1"
            - "POST /communities/{C1}/pickup-points {name: 'P1', capacity_packages: 5, cold_storage_capable: false} -> P1"
            - "POST /communities/{C1}/group-leaders {display_name: 'L1'} -> L1; POST /group-leaders/{L1}/approve"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku: 'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 0, deadline_period: 100} -> K1"
            - "Auth as Cust1: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust1, line_items: [{sku:'SKUA', unit_price_cents:100, quantity:1}]} -> O1  (PENDING_PAY, NOT_PLANNED)"
            - "Auth as Cust1: POST /orders/{O1}/pay  (PAID, NOT_PLANNED)"
            - "Auth as L1: POST /group-buy-campaigns/{K1}/close  (Order O1 -> SETTLED, NOT_PLANNED)"
          trigger:
            - "Auth as S1: POST /orders/{O1}/plan-shipments {shipment_plan: [{pickup_point_id: P1, line_units: [{sku:'SKUA', quantity:1}]}]}"
            - "GET /orders/{O1}"
          assert:
            - "Order(O1).payment_status == 'SETTLED'"
            - "Order(O1).fulfillment_status == 'PLANNED'"
            - "Order's two state fields evolve along independent axes — payment_status reached SETTLED while fulfillment_status only just left NOT_PLANNED, and neither implies the other"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: after_sales_refund_to_clawback_chain
        grounds:
          - state_machines.AfterSalesCase.UNDER_REVIEW_to_RESOLVED_REFUND_ONLY
          - state_machines.Order.payment_status.SETTLED_to_REFUND_PENDING
          - state_machines.CommissionEntry.PENDING_to_PENDING_CLAWBACK
          - entities.Payout.fields.total_amount_cents
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /after-sales/{caseId}/resolve
          outcome=REFUND_ONLY. Hops: AfterSalesCase mutates → Order
          (REFUND_PENDING) mutates → CommissionEntry (PENDING_CLAWBACK)
          mutates → Payout (total_amount_cents recomputed to exclude the
          clawed entry). Each link is *caused* by the previous mutation —
          /resolve does not directly mutate Payout; the Payout total update
          is downstream of the entry's clawback flag. With a single bundled
          entry of net_rebate=744, the Payout's total_amount_cents goes from
          744 to 0.
        test_recipe:
          setup:
            - "Build through to a SUCCEEDED campaign K1 with order O1 paid for Cust1, leader L1 tier=1 PRIMARY, supplier S1 with warehouse W1, pickup point P1, line_items=[{sku:'SKUA', unit_price_cents:100, quantity:1}], discount_tiers=[{min_participants:1, bp:0}], so settled_total_cents=100 and the L1 PRIMARY CommissionEntry E1 has gross_rebate=floor(100*800/10000)=8, tax_withholding=round_half_up(8*700/10000)=1, net_rebate=7"
            - "Plan, dispatch, arrive-at-pickup, pickup-confirm O1 (fulfillment_status=PICKED_UP)"
            - "Auth as PlatformAdmin: POST /group-leaders/{L1}/payouts {target_period_index: <= E1.payout_target_period_index>} -> P1_payout (status=SCHEDULED, bundled_entry_ids contains E1, total_amount_cents == 7)"
            - "Auth as Cust1: POST /orders/{O1}/after-sales-cases {case_type: 'REFUND_ONLY', requested_amount_cents: 100} -> AS1"
            - "Auth as CustomerService: POST /after-sales/{AS1}/start-review"
          trigger:
            - "Auth as CustomerService: POST /after-sales/{AS1}/resolve {outcome: 'REFUND_ONLY'}"
            - "Auth as L1: GET /group-leaders/{L1}/commission-entries"
            - "Auth as PlatformAdmin: GET /payouts/{P1_payout}"
          assert:
            - "AfterSalesCase(AS1).status == 'RESOLVED_REFUND_ONLY'"
            - "Order(O1).payment_status == 'REFUND_PENDING'  (note: not yet REFUNDED — that finalization is gated on POST /_sweep/run-payouts)"
            - "CommissionEntry(E1).status == 'PENDING_CLAWBACK'"
            - "Payout(P1_payout).total_amount_cents == 0  (recomputed: only bundled entry was clawed, total drops from 7 to 0)"
            - "Payout(P1_payout).status == 'SCHEDULED' (still pre-mature)"

      - name: leader_suspend_to_order_cascade
        grounds:
          - state_machines.RiskAlert.OPEN_to_CONFIRMED
          - state_machines.GroupLeader.ACTIVE_to_SUSPENDED
          - state_machines.GroupBuyCampaign.FORMING_to_FAILED
          - state_machines.Order.payment_status.SETTLED_to_REFUND_PENDING
        distinguishing_aspect: |
          Depth-3 cascade from a *different* originating trigger than
          after_sales_refund_to_clawback_chain — POST /risk-alerts/{alertId}
          /confirm rather than POST /after-sales/{caseId}/resolve. Hops:
          RiskAlert (CONFIRMED) → GroupLeader (SUSPENDED) → GroupBuyCampaign
          (FORMING -> FAILED, by the suspend cascade) → Order (PAID ->
          REFUND_PENDING + fulfillment_status -> CANCELLED, by the campaign
          FAILED cascade). Each link is caused by the previous mutation, not
          by the original alert confirmation.
        test_recipe:
          setup:
            - "POST /communities -> C1"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "POST /communities/{C1}/group-leaders {display_name: 'L1'} -> L1"
            - "POST /group-leaders/{L1}/approve  (L1 ACTIVE)"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku: 'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 0, deadline_period: 100} -> K1  (FORMING)"
            - "Auth as Cust1: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust1, line_items: [{sku:'SKUA', unit_price_cents:100, quantity:1}]} -> O1"
            - "Auth as Cust1: POST /orders/{O1}/pay  (PAID)"
            - "Auth as PlatformAdmin: POST /risk-alerts {alert_type: 'LEADER_SUPPLIER_COLLUSION', target_kind: 'GROUP_LEADER', target_id: L1, supporting_supplier_id: S1, severity: 'HIGH'} -> A1  (status=OPEN)"
          trigger:
            - "Auth as PlatformAdmin: POST /risk-alerts/{A1}/confirm"
            - "GET /group-leaders/{L1}; GET /group-buy-campaigns/{K1}; GET /orders/{O1}"
          assert:
            - "RiskAlert(A1).status == 'CONFIRMED'"
            - "GroupLeader(L1).status == 'SUSPENDED'"
            - "GroupBuyCampaign(K1).status == 'FAILED'"
            - "Order(O1).payment_status == 'REFUND_PENDING'"
            - "Order(O1).fulfillment_status == 'CANCELLED'"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: campaign_state_vs_flash_stock_priority
        grounds:
          - validations[priority=8.5]
          - validations[priority=17]
          - errors.ERR_FLASH_CAMPAIGN_NOT_OPEN
          - errors.ERR_FLASH_STOCK_DEPLETED
        distinguishing_aspect: |
          Category pair: (state, business_constraint). When a customer
          attempts POST /flash-campaigns/{id}/purchase against a campaign
          whose stock is exhausted (status=EXHAUSTED) — both validations
          fail simultaneously: state check (status != OPEN) at priority 8.5
          AND anti-oversell check (remaining_units < requested) at priority
          17. The lower priority number wins, so the response is
          ERR_FLASH_CAMPAIGN_NOT_OPEN (state), NOT
          ERR_FLASH_STOCK_DEPLETED (business_constraint).
        test_recipe:
          setup:
            - "POST /communities -> C1"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /customers {community_id: C1, display_name: 'Cust2'} -> Cust2"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "Auth as PlatformAdmin: POST /suppliers/{S1}/flash-campaigns {sku: 'SKUF', cold_chain_required: false, unit_price_cents: 100, tier_caps: [{tier:0, max_units:10}], total_stock: 1, opens_at_period: 0, closes_at_period: 100} -> FC1 (status=OPEN, remaining_units=1)"
            - "Auth as Cust1: POST /flash-campaigns/{FC1}/purchase {requested_units: 1}  (succeeds; FC1.remaining_units=0, status=EXHAUSTED)"
          trigger:
            - "Auth as Cust2: POST /flash-campaigns/{FC1}/purchase {requested_units: 1}  (both state and stock checks would fail; state check has higher priority)"
          assert:
            - "Trigger response: HTTP 409"
            - "Trigger response: error_id == 'ERR_FLASH_CAMPAIGN_NOT_OPEN'  (NOT 'ERR_FLASH_STOCK_DEPLETED')"

      - name: cold_chain_safety_vs_warehouse_referential
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors.ERR_COLD_CHAIN_REQUIRED
          - errors.ERR_NO_WAREHOUSE_AVAILABLE
        distinguishing_aspect: |
          Different category pair from the previous instance:
          (business_safety, business_referential). When a Supplier has a
          single warehouse that is BOTH cold-incapable AND status=DISABLED,
          POST /orders/{orderId}/plan-shipments for a cold-chain SKU has
          two checks fire simultaneously: priority 9 cold-chain safety
          (no cold-capable warehouse exists for this supplier) AND
          priority 10 referential (no ACTIVE warehouse in candidate set).
          Lower priority wins, so the response is ERR_COLD_CHAIN_REQUIRED
          (safety), NOT ERR_NO_WAREHOUSE_AVAILABLE.
        test_recipe:
          setup:
            - "POST /communities -> C1 (region_code='RC1')"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "Auth as PlatformAdmin: POST /suppliers/{S1}/warehouses {name: 'W_disabled', region_code: 'RC1', cold_chain_capable: false, handling_periods: 1, cold_handling_periods: 1, initial_status: 'DISABLED'} -> W1  (Warehouse.status=DISABLED, cold_chain_capable=false; supplier S1 has no other warehouses, so no cold-capable Warehouse exists at all and no ACTIVE Warehouse exists either)"
            - "POST /communities/{C1}/pickup-points {name: 'P1', capacity_packages: 5, cold_storage_capable: true} -> P1"
            - "POST /communities/{C1}/group-leaders {display_name: 'L1'} -> L1; POST /group-leaders/{L1}/approve"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku: 'COLD1', cold_chain_required: true, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 0, deadline_period: 100} -> K1"
            - "Auth as Cust1: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust1, line_items: [{sku:'COLD1', unit_price_cents:100, quantity:1}]} -> O1"
            - "Auth as Cust1: POST /orders/{O1}/pay"
            - "Auth as L1: POST /group-buy-campaigns/{K1}/close  (K1 SUCCEEDED, O1.payment_status=SETTLED)"
          trigger:
            - "Auth as S1: POST /orders/{O1}/plan-shipments {shipment_plan: [{pickup_point_id: P1, line_units: [{sku:'COLD1', quantity:1}]}]}"
          assert:
            - "Trigger response: HTTP 422"
            - "Trigger response: error_id == 'ERR_COLD_CHAIN_REQUIRED'  (NOT 'ERR_NO_WAREHOUSE_AVAILABLE')"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: discount_tier_threshold_inclusive
        grounds:
          - calculations.discount_tier_selection
          - state_machines.GroupBuyCampaign.FORMING_to_SUCCEEDED
          - entities.GroupBuyCampaign.fields.settled_tier_index
          - entities.GroupBuyCampaign.fields.settled_discount_basis_points
        distinguishing_aspect: |
          The boundary `min_participants <= participant_count` is INCLUSIVE
          (>=). With discount_tiers=[{min:5, bp:1000}, {min:10, bp:2000}]
          and exactly 5 paid participants at close, the close must select
          tier 0 (bp=1000), NOT no-tier (bp=0). An off-by-one
          implementation that used > would fail the close to "no tier
          qualifies → discount=0". This is a numeric-threshold-crossing
          boundary on participant_count, exercised at POST /group-buy-
          campaigns/{campaignId}/close.
        test_recipe:
          setup:
            - "POST /communities -> C1; POST /suppliers {name: 'S1'} -> S1"
            - "Create 5 customers Cust1..Cust5 in C1"
            - "POST /communities/{C1}/group-leaders {display_name: 'L1'} -> L1; POST /group-leaders/{L1}/approve"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku: 'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:5, discount_basis_points:1000}, {min_participants:10, discount_basis_points:2000}], opens_at_period: 0, deadline_period: 100} -> K1"
            - "For each Cust_i: POST /group-buy-campaigns/{K1}/orders + POST /orders/{O_i}/pay  (5 paid orders total; participant_count=5)"
          trigger:
            - "Auth as L1: POST /group-buy-campaigns/{K1}/close"
            - "GET /group-buy-campaigns/{K1}"
          assert:
            - "GroupBuyCampaign(K1).status == 'SUCCEEDED'"
            - "GroupBuyCampaign(K1).settled_tier_index == 0"
            - "GroupBuyCampaign(K1).settled_discount_basis_points == 1000  (exactly tier 0 fires at participant_count == 5; >= boundary)"

      - name: pickup_point_capacity_inclusive_full_rejects
        grounds:
          - validations[priority=11]
          - state_machines.Shipment.DISPATCHED_to_AT_PICKUP
          - entities.PickupPoint.fields.capacity_packages
          - entities.PickupPoint.fields.held_package_count
        distinguishing_aspect: |
          Different metric (collection-size / capacity counter rather than
          numeric threshold) and different endpoint (POST /shipments/
          {shipmentId}/arrive-at-pickup) than the previous instance. The
          rule `held_package_count + 1 <= capacity_packages` permits exactly
          held=capacity (the boundary), and rejects any further arrival.
          With capacity_packages=1, the first arrival succeeds (0+1=1 ≤ 1)
          and the second is rejected (1+1=2 > 1) with
          ERR_PICKUP_POINT_AT_CAPACITY.
        test_recipe:
          setup:
            - "Build through to a SUCCEEDED campaign K1 with TWO paid+SETTLED orders O1 and O2 from two customers, supplier S1 with warehouse W1, leader L1, in community C1 with PickupPoint P1 (capacity_packages=1, cold_storage_capable=false)"
            - "Auth as S1: POST /orders/{O1}/plan-shipments to P1 -> Shipment SH1 (PLANNED)"
            - "Auth as S1: POST /orders/{O2}/plan-shipments to P1 -> Shipment SH2 (PLANNED)"
            - "Auth as S1: POST /shipments/{SH1}/dispatch  (DISPATCHED)"
            - "Auth as S1: POST /shipments/{SH2}/dispatch  (DISPATCHED)"
            - "Auth as S1: POST /shipments/{SH1}/arrive-at-pickup  (succeeds; PickupPoint.held_package_count = 1, exactly == capacity)"
          trigger:
            - "Auth as S1: POST /shipments/{SH2}/arrive-at-pickup"
            - "GET /pickup-points/{P1}/summary"
          assert:
            - "Trigger response: HTTP 409"
            - "Trigger response: error_id == 'ERR_PICKUP_POINT_AT_CAPACITY'"
            - "PickupPoint(P1).held_package_count == 1  (unchanged after rejected second arrival)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_pickup_requires_shipments_at_pickup
        grounds:
          - state_machines.Order.fulfillment_status.AT_PICKUP_to_PICKED_UP
          - state_machines.Shipment.AT_PICKUP_to_MIS_PICK
          - state_machines.Shipment.MIS_PICK_to_RECONCILED
        distinguishing_aspect: |
          Entity pair: Order ↔ Shipment. POST /orders/{orderId}/pickup-
          confirm transitions Order.fulfillment_status from AT_PICKUP to
          PICKED_UP, but its precondition demands every child Shipment be
          in {AT_PICKUP, RECONCILED}. If any child is in MIS_PICK, the
          transition rejects with ERR_INVALID_STATE — the Order's valid
          transitions depend on a sibling Shipment's state.
        test_recipe:
          setup:
            - "Build through to a SUCCEEDED campaign K1 with paid+SETTLED order O1 from Cust1, plan, dispatch, and arrive a single Shipment SH1 at PickupPoint P1 (Order.fulfillment_status=AT_PICKUP, SH1.status=AT_PICKUP)"
            - "Auth as PickupOperator: POST /shipments/{SH1}/report-mispick  (SH1.status=MIS_PICK; Order.fulfillment_status remains AT_PICKUP because the Order auto-transitioned earlier when SH1 first reached AT_PICKUP)"
          trigger:
            - "Auth as Cust1: POST /orders/{O1}/pickup-confirm  (precondition 'all child Shipments in {AT_PICKUP, RECONCILED}' fails because SH1 is MIS_PICK)"
            - "GET /orders/{O1}"
          assert:
            - "Trigger response: HTTP 409"
            - "Trigger response: error_id == 'ERR_INVALID_STATE'"
            - "Order(O1).fulfillment_status == 'AT_PICKUP'  (unchanged)"

      - name: payout_mature_requires_no_pending_clawback
        grounds:
          - state_machines.Payout.SCHEDULED_to_MATURED
          - state_machines.CommissionEntry.PENDING_to_PENDING_CLAWBACK
          - validations[priority=20]
        distinguishing_aspect: |
          Different entity pair from order_pickup_requires_shipments_at_pickup:
          Payout ↔ CommissionEntry. The /_sweep/run-payouts sweep transitions
          a SCHEDULED Payout to MATURED only when no bundled CommissionEntry
          is in {PENDING_CLAWBACK, CLAWED_BACK}. If any bundled entry has
          flipped to PENDING_CLAWBACK after a refund-related cascade, the
          Payout remains SCHEDULED — its valid transitions depend on its
          children CommissionEntries' state.
        test_recipe:
          setup:
            - "Build through to a SUCCEEDED campaign with paid+SETTLED order O1, leader L1, single PRIMARY CommissionEntry E1 in PENDING with payout_target_period_index=N"
            - "Auth as PlatformAdmin: POST /group-leaders/{L1}/payouts {target_period_index: N} -> Payout P1 (SCHEDULED, bundled_entry_ids=[E1])"
            - "Plan, dispatch, arrive, pickup-confirm O1 (fulfillment_status=PICKED_UP)"
            - "Auth as Cust1: POST /orders/{O1}/after-sales-cases {case_type: 'REFUND_ONLY', requested_amount_cents: O1.settled_total_cents} -> AS1"
            - "Auth as CustomerService: POST /after-sales/{AS1}/start-review; POST /after-sales/{AS1}/resolve {outcome: 'REFUND_ONLY'}  (E1 -> PENDING_CLAWBACK)"
            - "Auth as PlatformAdmin: POST /_clock/advance {by_periods: N + 1}  (system_period_index >= target_period_index)"
          trigger:
            - "Auth as PlatformAdmin: POST /_sweep/run-payouts"
            - "Auth as PlatformAdmin: GET /payouts/{P1}"
            - "Auth as L1: GET /group-leaders/{L1}/commission-entries"
          assert:
            - "Payout(P1).status == 'SCHEDULED'  (NOT 'MATURED'; the PENDING_CLAWBACK / CLAWED_BACK bundled entry blocks maturation)"
            - "CommissionEntry(E1).status IN ('PENDING_CLAWBACK', 'CLAWED_BACK')"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: pickup_consolidation_buffered_closed_interval
        grounds:
          - validations[priority=13]
          - concurrency_rules[ConsolidationBatch buffered overlap]
          - entities.ConsolidationBatch.fields.window_start_period
          - entities.ConsolidationBatch.fields.window_end_period
          - errors.ERR_CONSOLIDATION_WINDOW_OVERLAP
        distinguishing_aspect: |
          Resource: PickupPoint. Interval semantics: CLOSED interval
          [window_start_period, window_end_period] PLUS a buffer of 1
          period on each side (effective range
          [start - 1, end + 1], also closed). Two batches with effective
          ranges sharing a single integer period are considered to overlap
          and the second is rejected. With B1=[3,5] (effective [2,6]) and
          B2=[6,10] (effective [5,11]), they share period 5 and 6 → reject.
        test_recipe:
          setup:
            - "Build through to TWO paid+SETTLED orders O1, O2 in a SUCCEEDED campaign with planned, dispatched, and AT_PICKUP shipments SH1 and SH2 at PickupPoint P1 (capacity_packages>=2)"
            - "Auth as PickupOperator: POST /pickup-points/{P1}/consolidation-batches {window_start_period: 3, window_end_period: 5, shipment_ids: [SH1]} -> B1  (effective range [2,6])"
          trigger:
            - "Auth as PickupOperator: POST /pickup-points/{P1}/consolidation-batches {window_start_period: 6, window_end_period: 10, shipment_ids: [SH2]}  (effective range [5,11], overlaps B1 at periods 5 and 6)"
          assert:
            - "Trigger response: HTTP 409"
            - "Trigger response: error_id == 'ERR_CONSOLIDATION_WINDOW_OVERLAP'"

      - name: campaign_per_community_sku_half_open_interval
        grounds:
          - validations[priority=14]
          - concurrency_rules[campaign window registration]
          - entities.GroupBuyCampaign.fields.opens_at_period
          - entities.GroupBuyCampaign.fields.deadline_period
          - errors.ERR_COMMUNITY_CAMPAIGN_OVERLAP
        distinguishing_aspect: |
          Different resource (Community + SKU pair) and different interval
          semantics (HALF-OPEN [opens_at_period, deadline_period), with NO
          buffer) than pickup_consolidation_buffered_closed_interval.
          Adjacent windows are permitted: a campaign K1 with deadline=10
          and a campaign K2 with opens_at=10 do NOT overlap because the
          first interval excludes period 10. A campaign K3 with opens_at=9
          (within [0,10)) does overlap and is rejected.
        test_recipe:
          setup:
            - "POST /communities -> C1; POST /suppliers {name:'S1'} -> S1"
            - "POST /communities/{C1}/group-leaders {display_name:'L1'} -> L1; POST /group-leaders/{L1}/approve"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku:'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 0, deadline_period: 10} -> K1"
          trigger:
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku:'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 10, deadline_period: 20}  (adjacent — should succeed)"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku:'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 9, deadline_period: 19}  (overlaps K1 on period 9 — should reject)"
          assert:
            - "First trigger response (opens_at=10): HTTP 201 (adjacent half-open windows allowed)"
            - "Second trigger response (opens_at=9): HTTP 409, error_id == 'ERR_COMMUNITY_CAMPAIGN_OVERLAP'"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: flash_inventory_conservation
        grounds:
          - calculations.fairness_weighted_flash_allocation
          - state_machines.Order.payment_status.SETTLED_to_REFUND_PENDING
          - entities.FlashCampaign.fields.locked_units
          - entities.FlashCampaign.fields.allocated_units
          - entities.FlashCampaign.fields.remaining_units
          - entities.FlashCampaign.fields.total_stock
        distinguishing_aspect: |
          Conserved quantity: physical INVENTORY UNITS. The invariant
          locked_units + allocated_units + remaining_units == total_stock
          must hold both before and after a forward action (POST /flash-
          campaigns/{id}/purchase) paired with its compensating action
          (POST /orders/{orderId}/cancel for the resulting FLASH order).
          With total_stock=10, after purchasing 3 then cancelling, the
          three counters must satisfy 0 + 0 + 10 == 10.
        test_recipe:
          setup:
            - "POST /communities -> C1"
            - "POST /customers {community_id: C1, display_name: 'Cust1'} -> Cust1"
            - "POST /suppliers {name: 'S1'} -> S1"
            - "Auth as PlatformAdmin: POST /suppliers/{S1}/flash-campaigns {sku: 'FLASHA', cold_chain_required: false, unit_price_cents: 100, tier_caps: [{tier:0, max_units:5}], total_stock: 10, opens_at_period: 0, closes_at_period: 100} -> FC1"
            - "Auth as Cust1: POST /flash-campaigns/{FC1}/purchase {requested_units: 3} -> Order O1  (FLASH order; FC1.allocated_units=3, remaining_units=7)"
          trigger:
            - "Auth as Cust1: POST /orders/{O1}/cancel"
            - "Auth as PlatformAdmin: GET /flash-campaigns/{FC1}"
            - "GET /orders/{O1}"
          assert:
            - "Order(O1).payment_status == 'REFUNDED'"
            - "Order(O1).fulfillment_status == 'CANCELLED'"
            - "FlashCampaign(FC1).locked_units == 0"
            - "FlashCampaign(FC1).allocated_units == 0"
            - "FlashCampaign(FC1).remaining_units == 10"
            - "FlashCampaign(FC1).locked_units + FlashCampaign(FC1).allocated_units + FlashCampaign(FC1).remaining_units == FlashCampaign(FC1).total_stock  (= 10, invariant preserved across forward + compensating action)"

      - name: commission_money_conservation
        grounds:
          - calculations.tiered_rebate
          - calculations.tax_withholding
          - state_machines.CommissionEntry.PENDING_to_PENDING_CLAWBACK
          - entities.CommissionEntry.fields.net_rebate_cents
        distinguishing_aspect: |
          Different conserved quantity than flash_inventory_conservation:
          MONEY (cents) rather than physical units. For an Order O1 whose
          settled_total_cents=100 generates a single L1 PRIMARY
          CommissionEntry E1 with gross_rebate=8, tax_withholding=1, and
          net_rebate=7, the sum of net_rebate_cents over CommissionEntry
          rows derived from O1 is invariant under the refund cascade —
          before refund (status=PENDING) the sum is 7 cents; after the
          REFUND_ONLY resolve (status=PENDING_CLAWBACK) the sum is still 7
          cents. The forward action's accounting trail is preserved by
          the compensating action; only the entry's lifecycle status changes.
        test_recipe:
          setup:
            - "POST /communities -> C1; POST /customers {community_id:C1, display_name:'Cust1'} -> Cust1; POST /suppliers {name:'S1'} -> S1"
            - "POST /communities/{C1}/group-leaders {display_name:'L1'} -> L1 (tier=1); POST /group-leaders/{L1}/approve"
            - "Auth as L1: POST /group-leaders/{L1}/group-buy-campaigns {supplier_id: S1, sku:'SKUA', cold_chain_required: false, unit_price_cents: 100, discount_tiers: [{min_participants:1, discount_basis_points:0}], opens_at_period: 0, deadline_period: 100} -> K1"
            - "Auth as Cust1: POST /group-buy-campaigns/{K1}/orders {customer_id: Cust1, line_items: [{sku:'SKUA', unit_price_cents:100, quantity:1}]} -> O1  (subtotal_cents=100)"
            - "Auth as Cust1: POST /orders/{O1}/pay"
            - "Auth as L1: POST /group-buy-campaigns/{K1}/close  (campaign SUCCEEDED; CommissionEntry E1 generated for L1 PRIMARY: gross=8, tax=1, net=7)"
            - "Auth as L1: GET /group-leaders/{L1}/commission-entries  -> records sum_before"
            - "Build through to fulfillment_status=PICKED_UP for O1 (plan, dispatch, arrive, pickup-confirm)"
            - "Auth as Cust1: POST /orders/{O1}/after-sales-cases {case_type: 'REFUND_ONLY', requested_amount_cents: 100} -> AS1"
            - "Auth as CustomerService: POST /after-sales/{AS1}/start-review"
          trigger:
            - "Auth as CustomerService: POST /after-sales/{AS1}/resolve {outcome: 'REFUND_ONLY'}"
            - "Auth as L1: GET /group-leaders/{L1}/commission-entries"
          assert:
            - "Sum of CommissionEntry.net_rebate_cents for entries with order_id == O1 == 7  (before refund: status=PENDING)"
            - "After resolve, CommissionEntry(E1).status == 'PENDING_CLAWBACK'"
            - "After resolve, sum of CommissionEntry.net_rebate_cents for entries with order_id == O1 == 7  (unchanged across the compensating action — only status changed)"
            - "CommissionEntry(E1).net_rebate_cents == 7  (specific value preserved)"
