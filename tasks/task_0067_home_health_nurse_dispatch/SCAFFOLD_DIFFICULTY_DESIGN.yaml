  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: clinician_visit_half_open_overlap_touching_allowed
        grounds:
          - validations[priority=13]
          - entities.Visit.fields.scheduled_start
          - entities.Visit.fields.scheduled_end
        distinguishing_aspect: |
          Visit overlap uses pure half-open [start,end) arithmetic with NO buffer: a second visit starting exactly at
          the first's end (touching endpoints) is allowed, but a visit overlapping the interior is rejected ERR_CLINICIAN_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Clock 2026-02-01; WOUND config active."
            - "Episode ACTIVE; one RN visit SCHEDULED 09:00-10:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
