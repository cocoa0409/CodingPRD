            - call: "POST /placements/${placement_az_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_az_v: $.data.version }
            - call: "POST /policies"
              payload: { placement_id: "${placement_az_id}", carrier_id: "${carrier_id}", policy_number: "SL-2026-0500", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 130010, policy_fee_cents: 0, broker_fee_cents: 0, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_az_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { policy_az_id: $.data.id }
          trigger:
            - call: "POST /policies/${policy_az_id}/calculate-tax"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
          assert:
            - "the response status is 200"
            - "Policy.${policy_az_id}.taxable_premium_cents == 130010"
            - "GET /policies/${policy_az_id}/allocations returns exactly 1 row with allocation_pct == 1.0 and allocated_premium_cents == 130010"
            - "that allocation row has tax_cents == 6501, not 6500"
            - "that allocation row has stamping_fee_cents == 325"
            - "Policy.${policy_az_id}.total_tax_cents == 6501 and total_stamping_fee_cents == 325"

      - name: diligent_search_count_excludes_wrong_state_wrong_reason_and_invalidated_rows
        claim_type: Input Set Filtering
        grounds:
          - calculations.diligent_search_sufficiency
          - endpoints.POST_/declinations/{id}/invalidate
          - errors.ERR_DILIGENT_SEARCH_INSUFFICIENT
        distinguishing_aspect: "Three independent filters run on the same declination set at once: a NOT_LICENSED_FOR_CLASS reason, a state_code that is not the placement's home state, and a row moved to INVALIDATED are each dropped. Five declinations on file therefore count as two, one short of TX's minimum of three."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; brokerage licensed in TX, all three programs on file, a TX-home placement in SEARCH_IN_PROGRESS carrying five declinations: two clean TX rows, one TX row with reason_code NOT_LICENSED_FOR_CLASS, one NV row, and one TX row that has been invalidated by the compliance officer."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Brazos Admitted Fire", state_code: "TX", reason_code: "NOT_LICENSED_FOR_CLASS", declined_on: "2026-07-16T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Silver State Admitted Mutual", state_code: "NV", reason_code: "NO_APPETITE", declined_on: "2026-07-18T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_id}/declinations"
              payload: { admitted_carrier_name: "Colorado River Casualty", state_code: "TX", reason_code: "CAPACITY", declined_on: "2026-07-20T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { doomed_declination_id: $.data.id }
            - call: "POST /declinations/${doomed_declination_id}/invalidate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
          trigger:
            - call: "POST /placements/${placement_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_DILIGENT_SEARCH_INSUFFICIENT"
            - "Placement.${placement_id}.status is still SEARCH_IN_PROGRESS"
            - "GET /placements/${placement_id}/declinations returns 5 rows in total"
            - "Declination.${doomed_declination_id}.status == INVALIDATED"
            - "after one more clean TX declination with reason_code UNDERWRITING declined_on 2026-07-22, complete-search returns 200 and Placement.${placement_id}.status == SEARCH_COMPLETE"

      - name: allocated_multi_versus_home_state_single_variant_corner
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: premium_tax_allocated_multi_versus_home_state_single_diverge
          rationale: "The two premium-tax variants, their divergent totals on identical inputs, and the pinning of allocation_method_applied at issuance are the entire subject of that Difficulty instance."

      - name: initial_review_versus_recertification_variant_corner
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: market_security_score_initial_versus_recertification_diverge
          rationale: "The INITIAL_REVIEW / RECERTIFICATION divergence, the drift penalty and the pinned rating_at_review inputs it reads are fully covered there."

      - name: per_row_then_sum_rounding_order_corner
        claim_type: Precision
        excluded_because:
          difficulty_instance: premium_tax_rounding_is_per_allocation_row_then_summed
          rationale: "The pinned rounding order — round each allocation row then sum, never sum then round — is demonstrated there with a fixture engineered so the two orders differ by one cent."

      - name: return_premium_minimum_earned_floor_corner
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: return_premium_minimum_earned_floor_overrides_the_type_calculation
          rationale: "All three cancellation types and the minimum-earned-premium floor that overrides them are covered instance-by-instance there, including the case where the floor does not bite."

      - name: endorsement_four_stage_evaluation_order_corner
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: endorsement_adjustment_evaluation_order_is_pinned_through_four_stages
          rationale: "The pinned four-stage evaluation order of the endorsement tax adjustment, and the pinned-rate reuse it depends on, are exhaustively covered there."

      - name: home_state_waterfall_corner
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: home_state_ignores_a_zero_value_principal_place_of_business_row
          rationale: "The home_state_determination waterfall — strictly-positive PPB row, then greatest insured value, then alphabetical tie-break, and ERR_HOME_STATE_INDETERMINATE on an all-zero schedule — is covered there."

      - name: the_late_filing_penalty_floor_beats_the_percentage_term
        claim_type: Constants Applied
        grounds:
          - calculations.filing_batch_totals
          - entities.FilingBatch.fields.penalty_cents
          - entities.StateProgram.fields.filing_deadline_days
        distinguishing_aspect: "The penalty is max(round_half_up(total_tax x LATE_PENALTY_PCT), LATE_PENALTY_FLOOR_CENTS), so on a small batch the flat floor dominates: 10% of 16571 is 1657, well under the 2500-cent floor, and the batch owes 2500. Lateness is judged against the clock at PREPARE, while the lines keep the 2026-08 period_key they were stamped with at creation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z while the base TX-home policy is placed and its tax calculated, so its TX line is stamped period_key 2026-08."
            - "An OPEN FilingBatch on the TX MONTHLY program keyed 2026-08, then the clock advanced to 2026-10-01T00:00:00Z — one day past the 2026-09-30 deadline — before the batch is prepared."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
            - *k_calc_tax
            - call: "POST /filing-batches"
              payload: { state_program_id: "${tx_program_id}", broker_id: "${broker_id}", period_key: "2026-08" }
              as: TaxFiler
              as_user_id: "tf-nina"
              captures: { late_batch_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: Any
          trigger:
            - call: "POST /filing-batches/${late_batch_id}/prepare"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
          assert:
            - "the response status is 200 and FilingBatch.${late_batch_id}.status == PREPARED"
            - "FilingBatch.${late_batch_id}.line_count == 1, total_tax_cents == 16571 and total_stamping_fee_cents == 512"
            - "FilingBatch.${late_batch_id}.due_date == 2026-09-30T23:59:59.999Z and late == true"
            - "FilingBatch.${late_batch_id}.penalty_cents == 2500 — the 2500-cent floor, not the 1657-cent percentage term"
            - "FilingBatch.${late_batch_id}.total_due_cents == 19583"

      - name: alien_trust_fund_points_boundary_corner
        claim_type: Constants Applied
        excluded_because:
          difficulty_instance: alien_carrier_trust_fund_minimum_is_inclusive_at_the_threshold
          rationale: "The ALIEN_TRUST_MIN_CENTS comparison being inclusive, and the 15-point swing it causes across the APPROVE/CONDITION band edge, are covered there at both sides of the threshold."

  # ===========================================================================
  - section: validations
    instances:

      - name: a_suspended_brokerage_cannot_begin_a_diligent_search
        claim_type: Violation → Error
        grounds:
          - validations.priority_10_business_safety
          - endpoints.POST_/brokers/{id}/suspend
          - errors.ERR_BROKER_SUSPENDED
        distinguishing_aspect: "Suspending the brokerage does not touch its existing DRAFT placements, but the next begin-search on one of them is rejected 409 ERR_BROKER_SUSPENDED — the check reads the Broker row at request time, not a flag copied onto the Placement."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; a brokerage licensed in TX with one DRAFT placement, then the brokerage suspended by the platform admin."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_placement
            - call: "POST /brokers/${broker_id}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /placements/${placement_id}/begin-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_BROKER_SUSPENDED"
            - "Broker.${broker_id}.status == SUSPENDED"
            - "Placement.${placement_id}.status is still DRAFT"
            - "Placement.${placement_id}.version is unchanged"

      - name: an_export_list_risk_completes_the_search_with_zero_declinations
        claim_type: Satisfaction → Pass
        grounds:
          - calculations.diligent_search_sufficiency
          - entities.Placement.fields.is_export_list_risk
          - entities.StateProgram.fields.export_list_exempts_search
        distinguishing_aspect: "TX sets export_list_exempts_search true, so a placement flagged is_export_list_risk completes its diligent search with ZERO declinations — the waiver bypasses the count entirely rather than lowering the minimum. The same zero-declination placement in a CA-home program, where the flag is false, would be rejected."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; a brokerage licensed in TX, all three programs on file, and a TX-home placement created with is_export_list_risk true and moved to SEARCH_IN_PROGRESS with no declinations recorded."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - call: "POST /placements"
              payload: { insured_name: "Permian Export Risk LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: true, state_exposures: [{ state_code: "TX", insured_value_cents: 300000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { export_placement_id: $.data.id }
            - call: "POST /placements/${export_placement_id}/begin-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
          trigger:
            - call: "POST /placements/${export_placement_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
          assert:
            - "the response status is 200"
            - "Placement.${export_placement_id}.status == SEARCH_COMPLETE"
            - "Placement.${export_placement_id}.declination_count == 0"
            - "Placement.${export_placement_id}.diligent_search_completed_at == 2026-08-01T00:00:00Z"
            - "GET /placements/${export_placement_id}/declinations returns 0 rows"

      - name: a_home_state_without_a_stamping_office_needs_no_stamping_submission
        claim_type: Conditional validation
        grounds:
          - state_machines.Policy.stamping_status.initial_state
          - entities.StateProgram.fields.stamping_office_required
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "stamping_status is initialised from the HOME state's stamping_office_required, so an NV-home policy is born NOT_REQUIRED — a terminal state. Submitting it to a stamping office is 409 ERR_INVALID_STATE even though compliance_status and tax_status are both satisfied, and every NV allocation row carries stamping_fee_cents 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; a brokerage licensed in NV, all three programs on file, Atlas APPROVED and white-listed in NV, and an NV-home policy issued off a placement with two NV declinations, with notices affixed and tax calculated."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - call: "POST /brokers/${broker_id}/licenses"
              payload: { state_code: "NV", license_number: "SL-NV-4004", license_type: "SURPLUS_LINES", expires_on: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${nv_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-nv"
            - call: "POST /placements"
              payload: { insured_name: "Silver State Fabricators LLC", principal_place_of_business_state: "NV", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "NV", insured_value_cents: 300000000 }] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_nv_id: $.data.id }
            - call: "POST /placements/${placement_nv_id}/begin-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_nv_id}/declinations"
              payload: { admitted_carrier_name: "Comstock Admitted Mutual", state_code: "NV", reason_code: "NO_APPETITE", declined_on: "2026-07-10T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_nv_id}/declinations"
              payload: { admitted_carrier_name: "Washoe Standard Insurance", state_code: "NV", reason_code: "CAPACITY", declined_on: "2026-07-12T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${placement_nv_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { placement_nv_v: $.data.version }
            - call: "POST /policies"
              payload: { placement_id: "${placement_nv_id}", carrier_id: "${carrier_id}", policy_number: "SL-2026-0600", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 1000000, policy_fee_cents: 25000, broker_fee_cents: 50000, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_nv_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { policy_nv_id: $.data.id }
            - call: "POST /policies/${policy_nv_id}/affix-notices"
              payload: { notice_codes: ["NV-SL"] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /policies/${policy_nv_id}/calculate-tax"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
          trigger:
            - call: "POST /policies/${policy_nv_id}/submit-stamping"
              payload: {}
              as: TaxFiler
              as_user_id: "tf-nina"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id is neither ERR_NOTICES_NOT_AFFIXED nor ERR_TAX_NOT_CALCULATED — both of those preconditions are satisfied"
            - "Policy.${policy_nv_id}.stamping_status is still NOT_REQUIRED and stamping_submitted_at is null"
            - "Policy.${policy_nv_id}.home_state == NV and total_stamping_fee_cents == 0"
            - "Policy.${policy_nv_id}.total_tax_cents == 35875"
            - "the single NV allocation row has stamping_fee_cents == 0 even though NV declares a stamping_fee_rate of 0.0040"

      - name: state_check_versus_referential_check_priority_corner
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: policy_issue_state_check_pre_empts_carrier_referential_checks
          rationale: "The priority-9 state check pre-empting the priority-12 and priority-13 carrier checks on a triple-violating POST /policies is exactly that Difficulty instance's subject."

