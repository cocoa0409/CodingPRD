scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: provider_creation_auto_creates_zeroed_abrasion_profile
        claim_type: creation
        grounds:
          - entities.ProviderAbrasionProfile.fields.provider_id
          - entities.ProviderAbrasionProfile.fields.tier
        distinguishing_aspect: "POST /providers returns 201 and the 1:1 ProviderAbrasionProfile exists immediately with zeroed counters, tier LOW, monitor_only false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-E1", name: "Entity Prov" }, as: PlanAdmin, captures: { pe_id: $.data.id, pe_status: $.data.status } }
          trigger:
            - { call: "GET /payment-integrity/abrasion-profiles", payload: { provider_id: "${pe_id}" }, as: Any, captures: { prof_tier: "$.data[0].tier", prof_std: "$.data[0].standard_index", prof_reg: "$.data[0].regulatory_index", prof_mon: "$.data[0].monitor_only", prof_ibr: "$.data[0].open_ibr_count", prof_conf: "$.data[0].confirmed_count" } }
          assert:
            - "Provider.${pe_id}.status == ACTIVE (default applied)"
            - "exactly one ProviderAbrasionProfile exists with provider_id == ${pe_id}"
            - "standard_index == 0, regulatory_index == 0, tier == LOW, monitor_only == false, open_ibr_count == 0, confirmed_count == 0"

      - name: create_claim_missing_required_member_id
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the input-source field member_id is rejected with ERR_INVALID_REQUEST (400) before any existence or state check runs."
        test_recipe:
          setup: ["provider exists"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-E2", name: "Req Prov" }, as: PlanAdmin, captures: { pe2_id: $.data.id } }
          trigger:
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "X1", provider_id: "${pe2_id}", claim_type: PROFESSIONAL, total_billed_cents: 1000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pe2_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 400"
            - "no Claim row is created"

      - name: claim_line_units_defaults_to_one
        claim_type: defaults
        grounds:
          - entities.ClaimLine.fields.units
        distinguishing_aspect: "Omitting units on line creation persists the declared default 1."
        test_recipe:
          setup: ["provider with one RECEIVED claim (total 5000)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-E3", name: "Def Prov" }, as: PlanAdmin, captures: { pe3_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "D1", provider_id: "${pe3_id}", member_id: "M-D1", claim_type: PROFESSIONAL, total_billed_cents: 5000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pe3_id}", captures: { cd1_id: $.data.id } }
          trigger:
            - { call: "POST /payment-integrity/claims/${cd1_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 5000 }, as: Provider, as_user_id: "${pe3_id}", captures: { ln_units: $.data.units, ln_status_id: $.data.id } }
          assert:
            - "ClaimLine.${ln_status_id}.units == 1 (server default, not client-supplied)"

      - name: create_claim_rejects_injected_computed_field
        claim_type: computed_fields
        grounds:
          - entities.Claim.fields.allowed_amount_cents
          - validations[priority=4]
        distinguishing_aspect: "allowed_amount_cents is source:computed; a client supplying it on create is rejected with ERR_INVALID_REQUEST (unknown field), proving the value cannot be smuggled in."
        test_recipe:
          setup: ["provider exists"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-E4", name: "Inj Prov" }, as: PlanAdmin, captures: { pe4_id: $.data.id } }
          trigger:
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "X2", provider_id: "${pe4_id}", member_id: "M-X2", claim_type: PROFESSIONAL, total_billed_cents: 1000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z", allowed_amount_cents: 999999 }, as: Provider, as_user_id: "${pe4_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, http 400"

      - name: get_missing_entities_return_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROVIDER_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_EDIT_RULE_NOT_FOUND]
          - errors[ERR_EDIT_VERSION_NOT_FOUND]
          - errors[ERR_EDIT_HIT_NOT_FOUND]
          - errors[ERR_REVIEW_TASK_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_IBR_NOT_FOUND]
          - errors[ERR_INPATIENT_REVIEW_NOT_FOUND]
          - errors[ERR_SAVINGS_PERIOD_NOT_FOUND]
          - errors[ERR_VENDOR_EDIT_NOT_FOUND]
        distinguishing_aspect: "Every single-resource GET on a well-formed but absent UUID returns its entity-specific 404 error_id (existence priority 5), never a generic 500."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /payment-integrity/providers/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/claims/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/edit-rules/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/edit-versions/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/edit-hits/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/review-tasks/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/disputes/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/itemized-bill-reviews/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/inpatient-reviews/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/savings-periods/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
            - { call: "GET /payment-integrity/vendor-edits/00000000-0000-0000-0000-000000000000", payload: {}, as: Any }
          assert:
            - "each GET returns http 404 with the entity-specific error_id: ERR_PROVIDER_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_EDIT_RULE_NOT_FOUND, ERR_EDIT_VERSION_NOT_FOUND, ERR_EDIT_HIT_NOT_FOUND, ERR_REVIEW_TASK_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_IBR_NOT_FOUND, ERR_INPATIENT_REVIEW_NOT_FOUND, ERR_SAVINGS_PERIOD_NOT_FOUND, ERR_VENDOR_EDIT_NOT_FOUND respectively"
  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: edit_version_starts_in_draft
        claim_type: initial_state
        grounds: [state_machines.EditVersion.initial_state]
        distinguishing_aspect: "A newly created EditVersion is DRAFT with version_number 1 and created_by_user_id taken from the header."
        test_recipe:
          setup: ["edit rule exists"]
          setup_api_calls:
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "INIT-01", category: POLICY, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { ri_id: $.data.id } }
          trigger:
            - { call: "POST /payment-integrity/edit-rules/${ri_id}/versions", payload: { severity: MONITOR, applies_to_claim_types: [PROFESSIONAL], logic_expression: "watch", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-7, captures: { vi_status: $.data.status, vi_num: $.data.version_number, vi_creator: $.data.created_by_user_id } }
          assert:
            - "EditVersion.status == DRAFT, version_number == 1, created_by_user_id == librarian-7"

      - name: approve_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.EditVersion.PENDING_APPROVAL_to_ACTIVE
          - errors[ERR_EDIT_VERSION_NOT_APPROVABLE]
        distinguishing_aspect: "Approve is declared only from PENDING_APPROVAL; invoking it on a DRAFT version (with a correct OCC version, so priority 6 passes) fails at the state check."
        test_recipe:
          setup: ["edit rule with one DRAFT version"]
          setup_api_calls:
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "INV-01", category: POLICY, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rj_id: $.data.id, rj_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rj_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vj_id: $.data.id } }
          trigger:
            - { call: "POST /payment-integrity/edit-versions/${vj_id}/approve", payload: { expected_edit_rule_version: "${rj_v}" }, as: EditApprover, as_user_id: approver-1, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_EDIT_VERSION_NOT_APPROVABLE, http 409"
            - "EditVersion.${vj_id}.status remains DRAFT"

      - name: retired_version_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EditVersion.terminal_states
          - errors[ERR_EDIT_VERSION_NOT_APPROVABLE]
        distinguishing_aspect: "RETIRED is terminal: suspend, reactivate, and retire itself on a RETIRED version all fail; no side effects fire."
        test_recipe:
          setup: ["edit rule with one ACTIVE version, never fired (no FIRED hits)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "TERM-01", category: POLICY, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rk_id: $.data.id, rk_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rk_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vk_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vk_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vk_id}/approve", payload: { expected_edit_rule_version: "${rk_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/edit-versions/${vk_id}/retire", payload: {}, as: EditApprover, as_user_id: approver-1, captures: { vk_st: $.data.status } }
          trigger:
            - { call: "POST /payment-integrity/edit-versions/${vk_id}/suspend", payload: {}, as: EditApprover, as_user_id: approver-1, captures: { err1: $.data.error_id } }
            - { call: "POST /payment-integrity/edit-versions/${vk_id}/reactivate", payload: {}, as: EditApprover, as_user_id: approver-1, captures: { err2: $.data.error_id } }
            - { call: "POST /payment-integrity/edit-versions/${vk_id}/retire", payload: {}, as: EditApprover, as_user_id: approver-1, captures: { err3: $.data.error_id } }
          assert:
            - "version reaches RETIRED (vk_st == RETIRED)"
            - "all three post-terminal actions return ERR_EDIT_VERSION_NOT_APPROVABLE (409)"

      - name: review_task_second_decide_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ReviewTask.IN_REVIEW_to_DECIDED
          - errors[ERR_REVIEW_TASK_NOT_DECIDABLE]
        distinguishing_aspect: "DECIDED is terminal for tasks: repeating the same decide call is rejected, not silently re-applied (no double release of dollars)."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim one 30000 line; hit FIRED; task assigned to rev-1"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-SM1", name: "Task Prov" }, as: PlanAdmin, captures: { psm_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "TASK-01", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rsm_id: $.data.id, rsm_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rsm_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vsm_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vsm_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vsm_id}/approve", payload: { expected_edit_rule_version: "${rsm_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "SM1", provider_id: "${psm_id}", member_id: "M-SM1", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${psm_id}", captures: { csm_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${csm_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${psm_id}" }
            - { call: "POST /payment-integrity/claims/${csm_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${csm_id}" }, as: Any, captures: { tsm_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tsm_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tsm_id}/decide", payload: { outcome: OVERRIDE }, as: Reviewer, as_user_id: rev-1 }
          trigger:
            - { call: "POST /payment-integrity/review-tasks/${tsm_id}/decide", payload: { outcome: OVERRIDE }, as: Reviewer, as_user_id: rev-1, captures: { err_id: $.data.error_id } }
            - { call: "GET /payment-integrity/claims/${csm_id}", payload: {}, as: Any, captures: { csm_al: $.data.allowed_amount_cents } }
          assert:
            - "second decide returns error_id == ERR_REVIEW_TASK_NOT_DECIDABLE (409)"
            - "Claim.${csm_id}.allowed_amount_cents == 30000 (release applied exactly once)"

      - name: escalated_task_requires_senior_assignee
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReviewTask.IN_REVIEW_to_ESCALATED
          - state_machines.ReviewTask.ESCALATED_to_IN_REVIEW
          - errors[ERR_SENIOR_REVIEW_REQUIRED]
        distinguishing_aspect: "After escalate, assign with assignee_role Reviewer fails with ERR_SENIOR_REVIEW_REQUIRED; assign with assignee_role SeniorReviewer succeeds and only the senior assignee can decide."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim one 30000 line; task assigned to rev-1 (IN_REVIEW)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-SM2", name: "Esc Prov" }, as: PlanAdmin, captures: { psc_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "ESC-01", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rsc_id: $.data.id, rsc_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rsc_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vsc_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vsc_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vsc_id}/approve", payload: { expected_edit_rule_version: "${rsc_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "SM2", provider_id: "${psc_id}", member_id: "M-SM2", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${psc_id}", captures: { csc2_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${csc2_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${psc_id}" }
            - { call: "POST /payment-integrity/claims/${csc2_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${csc2_id}" }, as: Any, captures: { tsc2_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tsc2_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tsc2_id}/escalate", payload: { reason: "needs senior" }, as: Reviewer, as_user_id: rev-1, captures: { esc_st: $.data.status, esc_rs: $.data.requires_senior } }
          trigger:
            - { call: "POST /payment-integrity/review-tasks/${tsc2_id}/assign", payload: { reviewer_user_id: "rev-2", assignee_role: Reviewer }, as: SeniorReviewer, as_user_id: senior-1, captures: { err_id: $.data.error_id } }
            - { call: "POST /payment-integrity/review-tasks/${tsc2_id}/assign", payload: { reviewer_user_id: "senior-9", assignee_role: SeniorReviewer }, as: SeniorReviewer, as_user_id: senior-1, captures: { asg_st: $.data.status } }
            - { call: "POST /payment-integrity/review-tasks/${tsc2_id}/decide", payload: { outcome: UPHOLD }, as: SeniorReviewer, as_user_id: senior-9, captures: { dec_st: $.data.status } }
          assert:
            - "escalate sets status ESCALATED and requires_senior == true"
            - "assign to a Reviewer assignee fails with ERR_SENIOR_REVIEW_REQUIRED (403)"
            - "assign to a SeniorReviewer assignee moves the task to IN_REVIEW"
            - "decide by the senior assignee succeeds (DECIDED, outcome UPHOLD)"

      - name: clean_claim_screens_straight_to_ready_to_pay
        claim_type: valid_transition
        grounds: [state_machines.Claim.RECEIVED_to_READY_TO_PAY]
        distinguishing_aspect: "A claim with no hits, no reviews, and no high-dollar flag transitions RECEIVED -> READY_TO_PAY in the single run-edits call with allowed == billed."
        test_recipe:
          setup: ["provider; claim one 12345 line; no edit rules exist"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-SM3", name: "Clean Prov" }, as: PlanAdmin, captures: { pcl_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "CL1", provider_id: "${pcl_id}", member_id: "M-CL1", claim_type: PROFESSIONAL, total_billed_cents: 12345, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pcl_id}", captures: { ccl_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${ccl_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 12345 }, as: Provider, as_user_id: "${pcl_id}" }
          trigger:
            - { call: "POST /payment-integrity/claims/${ccl_id}/run-edits", payload: {}, as: PlanAdmin, captures: { cl_st: $.data.status, cl_al: $.data.allowed_amount_cents, cl_hd: $.data.high_dollar_flag } }
          assert:
            - "Claim.${ccl_id}.status == READY_TO_PAY, allowed_amount_cents == 12345, denied_amount_cents == 0, high_dollar_flag == false, readmission_flag == false"
            - "determined_at is set (dispute window anchor exists even on the clean path)"

      - name: run_edits_twice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim.RECEIVED_to_PENDED
          - errors[ERR_CLAIM_NOT_SCREENABLE]
        distinguishing_aspect: "run-edits is declared only from RECEIVED; a second run-edits on the same (now terminal-or-pended) claim fails with ERR_CLAIM_NOT_SCREENABLE."
        test_recipe:
          setup: ["provider; clean claim screened to READY_TO_PAY"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-SM4", name: "Re Prov" }, as: PlanAdmin, captures: { pre_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "RE1", provider_id: "${pre_id}", member_id: "M-RE1", claim_type: PROFESSIONAL, total_billed_cents: 5000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pre_id}", captures: { cre_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cre_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 5000 }, as: Provider, as_user_id: "${pre_id}" }
            - { call: "POST /payment-integrity/claims/${cre_id}/run-edits", payload: {}, as: PlanAdmin }
          trigger:
            - { call: "POST /payment-integrity/claims/${cre_id}/run-edits", payload: {}, as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "second run-edits returns error_id == ERR_CLAIM_NOT_SCREENABLE (409)"

      - name: dispute_create_on_pended_claim_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=7]
          - errors[ERR_DISPUTE_NOT_OPEN]
        distinguishing_aspect: "A dispute requires a finalized claim and a CONFIRMED hit; on a PENDED claim whose hit is still FIRED the create fails with ERR_DISPUTE_NOT_OPEN even with a correct OCC version."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim one 30000 line screened -> PENDED, hit FIRED, task PENDING (never assigned)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-SM5", name: "Pend Prov" }, as: PlanAdmin, captures: { ppd_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "PEND-01", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rpd_id: $.data.id, rpd_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rpd_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vpd_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vpd_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vpd_id}/approve", payload: { expected_edit_rule_version: "${rpd_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "PD1", provider_id: "${ppd_id}", member_id: "M-PD1", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${ppd_id}", captures: { cpd_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cpd_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${ppd_id}" }
            - { call: "POST /payment-integrity/claims/${cpd_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/claims/${cpd_id}", payload: {}, as: Any, captures: { cpd_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${cpd_id}/edit-hits", payload: {}, as: Any, captures: { hpd_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /payment-integrity/claims/${cpd_id}/disputes", payload: { edit_hit_id: "${hpd_id}", reason: "too early", expected_claim_version: "${cpd_v}" }, as: Provider, as_user_id: "${ppd_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_DISPUTE_NOT_OPEN (409): claim PENDED and hit FIRED, not CONFIRMED"

      - name: suspended_edit_does_not_fire
        claim_type: side_effect_execution
        grounds:
          - state_machines.EditVersion.ACTIVE_to_SUSPENDED
          - state_machines.Claim.RECEIVED_to_READY_TO_PAY
        distinguishing_aspect: "Screening eligibility filters on version status == ACTIVE; a SUSPENDED version produces zero hits, so the claim screens clean to READY_TO_PAY."
        test_recipe:
          setup: ["provider; edit ACTIVE then manually suspended; claim one 30000 line"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-SM6", name: "Susp Prov" }, as: PlanAdmin, captures: { psu_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "SUSP-01", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rsu_id: $.data.id, rsu_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rsu_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vsu_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vsu_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vsu_id}/approve", payload: { expected_edit_rule_version: "${rsu_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/edit-versions/${vsu_id}/suspend", payload: {}, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "SU1", provider_id: "${psu_id}", member_id: "M-SU1", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${psu_id}", captures: { csu_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${csu_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${psu_id}" }
          trigger:
            - { call: "POST /payment-integrity/claims/${csu_id}/run-edits", payload: {}, as: PlanAdmin, captures: { csu_st: $.data.status } }
            - { call: "GET /payment-integrity/claims/${csu_id}/edit-hits", payload: {}, as: Any }
          assert:
            - "Claim.${csu_id}.status == READY_TO_PAY with allowed_amount_cents == 30000"
            - "GET edit-hits for ${csu_id} returns an empty array (total_count 0)"

      - name: retire_version_with_fired_hits_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EditVersion.ACTIVE_to_RETIRED
          - errors[ERR_EDIT_VERSION_IN_USE]
        distinguishing_aspect: "Retire is blocked while any FIRED hit pins the version (referential protection of in-flight claims); once the hit resolves the same retire succeeds."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim screened -> hit FIRED (task PENDING)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-SM7", name: "Ret Prov" }, as: PlanAdmin, captures: { prt_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "RET-01", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rrt_id: $.data.id, rrt_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rrt_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vrt_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vrt_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vrt_id}/approve", payload: { expected_edit_rule_version: "${rrt_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "RT1", provider_id: "${prt_id}", member_id: "M-RT1", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${prt_id}", captures: { crt_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${crt_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${prt_id}" }
            - { call: "POST /payment-integrity/claims/${crt_id}/run-edits", payload: {}, as: PlanAdmin }
          trigger:
            - { call: "POST /payment-integrity/edit-versions/${vrt_id}/retire", payload: {}, as: EditApprover, as_user_id: approver-1, captures: { err_id: $.data.error_id } }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${crt_id}" }, as: Any, captures: { trt_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${trt_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${trt_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/edit-versions/${vrt_id}/retire", payload: {}, as: EditApprover, as_user_id: approver-1, captures: { rt_st: $.data.status } }
          assert:
            - "first retire fails with ERR_EDIT_VERSION_IN_USE (409) while the hit is FIRED"
            - "after the hit resolves CONFIRMED, retire succeeds: EditVersion.${vrt_id}.status == RETIRED"

      - name: ibr_expire_before_due_rejected_then_expires
        claim_type: invalid_transition
        grounds:
          - state_machines.ItemizedBillReview.REQUESTED_to_EXPIRED
          - errors[ERR_IBR_NOT_YET_EXPIRABLE]
        distinguishing_aspect: "expire is temporal-gated: at requested_at + 0 days it fails with ERR_IBR_NOT_YET_EXPIRABLE; past due_at (requested_at + 30 days) it succeeds and releases the claim gate."
        test_recipe:
          setup: ["provider; high-dollar claim (10000000) screened -> PENDED with auto IBR (due 2026-08-31 at default clock)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-SM8", name: "Exp Prov" }, as: PlanAdmin, captures: { pex_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "EX1", provider_id: "${pex_id}", member_id: "M-EX1", claim_type: PROFESSIONAL, total_billed_cents: 10000000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pex_id}", captures: { cex_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cex_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 10000000 }, as: Provider, as_user_id: "${pex_id}" }
            - { call: "POST /payment-integrity/claims/${cex_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/itemized-bill-reviews", payload: { claim_id: "${cex_id}" }, as: Any, captures: { iex_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /payment-integrity/itemized-bill-reviews/${iex_id}/expire", payload: {}, as: PlanAdmin, captures: { err_id: $.data.error_id } }
            - { call: "POST /payment-integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /payment-integrity/itemized-bill-reviews/${iex_id}/expire", payload: {}, as: PlanAdmin, captures: { iex_st: $.data.status } }
            - { call: "GET /payment-integrity/claims/${cex_id}", payload: {}, as: Any, captures: { cex_st: $.data.status } }
          assert:
            - "expire at 2026-08-01 (<= due_at 2026-08-31) fails with ERR_IBR_NOT_YET_EXPIRABLE (422)"
            - "expire at 2026-09-01 succeeds: IBR status == EXPIRED"
            - "Claim.${cex_id}.status == READY_TO_PAY (last gate closed, allowed 10000000 > 0)"

      - name: readmission_denial_cascades_to_claim_denial
        claim_type: side_effect_execution
        grounds:
          - state_machines.InpatientReview.FINDINGS_RECORDED_to_DECIDED
          - state_machines.Claim.DETERMINED_to_DENIED
          - calculations.readmission_detection
        distinguishing_aspect: "A READMISSION review decided DENIED_READMISSION zeroes the claim's allowed amount; combined with the DRG_VALIDATION review closing NO_CHANGE, the bubble-up lands the claim in DENIED."
        test_recipe:
          setup:
            - "Provider PRM; member M-RM; prior inpatient claim (discharge 2026-07-05) screened and its DRG review decided NO_CHANGE -> READY_TO_PAY"
            - "New inpatient claim same member, admission 2026-07-20 (gap 15 <= 30): run-edits auto-creates DRG_VALIDATION and READMISSION reviews (prior_claim_id = prior claim, gap_days 15)"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-RM", name: "Readm Prov" }, as: PlanAdmin, captures: { prm_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "RM0", provider_id: "${prm_id}", member_id: "M-RM", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 500000, service_from: "2026-07-01T00:00:00Z", service_to: "2026-07-05T00:00:00Z", admission_date: "2026-07-01T00:00:00Z", discharge_date: "2026-07-05T00:00:00Z", drg_code: "193", discharge_disposition: HOME }, as: Provider, as_user_id: "${prm_id}", captures: { crm0_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${crm0_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 500000 }, as: Provider, as_user_id: "${prm_id}" }
            - { call: "POST /payment-integrity/claims/${crm0_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/inpatient-reviews", payload: { claim_id: "${crm0_id}", review_type: DRG_VALIDATION }, as: Any, captures: { rrm0_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/inpatient-reviews/${rrm0_id}/record-findings", payload: {}, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/inpatient-reviews/${rrm0_id}/decide", payload: { outcome: NO_CHANGE }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "RM1", provider_id: "${prm_id}", member_id: "M-RM", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 400000, service_from: "2026-07-20T00:00:00Z", service_to: "2026-07-24T00:00:00Z", admission_date: "2026-07-20T00:00:00Z", discharge_date: "2026-07-24T00:00:00Z", drg_code: "193", discharge_disposition: HOME }, as: Provider, as_user_id: "${prm_id}", captures: { crm1_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${crm1_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 400000 }, as: Provider, as_user_id: "${prm_id}" }
            - { call: "POST /payment-integrity/claims/${crm1_id}/run-edits", payload: {}, as: PlanAdmin, captures: { crm1_flag: $.data.readmission_flag } }
            - { call: "GET /payment-integrity/inpatient-reviews", payload: { claim_id: "${crm1_id}", review_type: READMISSION }, as: Any, captures: { rrm1_id: "$.data[0].id", rrm1_gap: "$.data[0].gap_days", rrm1_prior: "$.data[0].prior_claim_id" } }
            - { call: "GET /payment-integrity/inpatient-reviews", payload: { claim_id: "${crm1_id}", review_type: DRG_VALIDATION }, as: Any, captures: { rrm1d_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/inpatient-reviews/${rrm1d_id}/record-findings", payload: {}, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/inpatient-reviews/${rrm1d_id}/decide", payload: { outcome: NO_CHANGE }, as: SeniorReviewer, as_user_id: senior-1 }
          trigger:
            - { call: "POST /payment-integrity/inpatient-reviews/${rrm1_id}/record-findings", payload: {}, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/inpatient-reviews/${rrm1_id}/decide", payload: { outcome: DENIED_READMISSION }, as: SeniorReviewer, as_user_id: senior-1, captures: { rrm1_out: $.data.outcome, rrm1_delta: $.data.payment_delta_cents } }
            - { call: "GET /payment-integrity/claims/${crm1_id}", payload: {}, as: Any, captures: { crm1_st: $.data.status, crm1_al: $.data.allowed_amount_cents, crm1_dn: $.data.denied_amount_cents } }
          assert:
            - "Claim.${crm1_id}.readmission_flag == true; READMISSION review has prior_claim_id == ${crm0_id} and gap_days == 15"
            - "decide DENIED_READMISSION sets payment_delta_cents == -(allowed before decision) == -950000 (DRG 193 at LOS 4: base 950000, no outlier)"
            - "Claim.${crm1_id}.status == DENIED with allowed_amount_cents == 0 and denied_amount_cents == initial_allowed_cents == 950000"
  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: readmission_window_inclusive_30_exclusive_31
        claim_type: boundary
        grounds:
          - calculations.readmission_detection
          - entities.InpatientReview.fields.gap_days
        distinguishing_aspect: "The 30-day window is inclusive: gap exactly 30 flags a READMISSION review with gap_days == 30; gap 31 against the same prior discharge flags nothing (and a still-PENDED claim is excluded from the candidate set)."
        test_recipe:
          setup:
            - "Provider PRW; member M-RW; prior inpatient claim P0 discharged 2026-07-01, screened, DRG review decided NO_CHANGE -> READY_TO_PAY"
            - "Claim X: same member, admission 2026-07-31 (gap 30)"
            - "Claim Y: same member, admission 2026-08-01 (gap 31 vs P0; claim X is PENDED so not a candidate)"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-RW", name: "Window Prov" }, as: PlanAdmin, captures: { prw_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "RW0", provider_id: "${prw_id}", member_id: "M-RW", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 500000, service_from: "2026-06-28T00:00:00Z", service_to: "2026-07-01T00:00:00Z", admission_date: "2026-06-28T00:00:00Z", discharge_date: "2026-07-01T00:00:00Z", drg_code: "193", discharge_disposition: HOME }, as: Provider, as_user_id: "${prw_id}", captures: { crw0_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${crw0_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 500000 }, as: Provider, as_user_id: "${prw_id}" }
            - { call: "POST /payment-integrity/claims/${crw0_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/inpatient-reviews", payload: { claim_id: "${crw0_id}", review_type: DRG_VALIDATION }, as: Any, captures: { rrw0_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/inpatient-reviews/${rrw0_id}/record-findings", payload: {}, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/inpatient-reviews/${rrw0_id}/decide", payload: { outcome: NO_CHANGE }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "RWX", provider_id: "${prw_id}", member_id: "M-RW", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 400000, service_from: "2026-07-31T00:00:00Z", service_to: "2026-08-02T00:00:00Z", admission_date: "2026-07-31T00:00:00Z", discharge_date: "2026-08-02T00:00:00Z", drg_code: "193", discharge_disposition: HOME }, as: Provider, as_user_id: "${prw_id}", captures: { crwx_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${crwx_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 400000 }, as: Provider, as_user_id: "${prw_id}" }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "RWY", provider_id: "${prw_id}", member_id: "M-RW", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 400000, service_from: "2026-08-01T00:00:00Z", service_to: "2026-08-03T00:00:00Z", admission_date: "2026-08-01T00:00:00Z", discharge_date: "2026-08-03T00:00:00Z", drg_code: "193", discharge_disposition: HOME }, as: Provider, as_user_id: "${prw_id}", captures: { crwy_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${crwy_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 400000 }, as: Provider, as_user_id: "${prw_id}" }
          trigger:
            - { call: "POST /payment-integrity/claims/${crwx_id}/run-edits", payload: {}, as: PlanAdmin, captures: { x_flag: $.data.readmission_flag } }
            - { call: "GET /payment-integrity/inpatient-reviews", payload: { claim_id: "${crwx_id}", review_type: READMISSION }, as: Any, captures: { x_gap: "$.data[0].gap_days", x_prior: "$.data[0].prior_claim_id" } }
            - { call: "POST /payment-integrity/claims/${crwy_id}/run-edits", payload: {}, as: PlanAdmin, captures: { y_flag: $.data.readmission_flag } }
            - { call: "GET /payment-integrity/inpatient-reviews", payload: { claim_id: "${crwy_id}", review_type: READMISSION }, as: Any }
          assert:
            - "Claim.${crwx_id}.readmission_flag == true; its READMISSION review has gap_days == 30 and prior_claim_id == ${crw0_id}"
            - "Claim.${crwy_id}.readmission_flag == false and zero READMISSION reviews exist for it (gap 31; PENDED claim X excluded from candidates)"

      - name: drg_outlier_cap_binds_at_twenty_percent
        claim_type: correct_result
        grounds:
          - calculations.drg_base_payment
        distinguishing_aspect: "Outlier add-on is capped: DRG 470 at LOS 20 would naively add (20-10)*50000 = 500000, but the 20% cap binds at 300000, so payment is 1800000 — exercising the nested min() branch not covered by the difficulty instance."
        test_recipe:
          setup: ["provider; inpatient claim DRG 470, admission 2026-07-01, discharge 2026-07-21 (LOS 20), HOME, billed 3000000"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-OC", name: "Cap Prov" }, as: PlanAdmin, captures: { poc_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "OC1", provider_id: "${poc_id}", member_id: "M-OC1", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 3000000, service_from: "2026-07-01T00:00:00Z", service_to: "2026-07-21T00:00:00Z", admission_date: "2026-07-01T00:00:00Z", discharge_date: "2026-07-21T00:00:00Z", drg_code: "470", discharge_disposition: HOME }, as: Provider, as_user_id: "${poc_id}", captures: { coc_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${coc_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 3000000 }, as: Provider, as_user_id: "${poc_id}" }
          trigger:
            - { call: "POST /payment-integrity/claims/${coc_id}/run-edits", payload: {}, as: PlanAdmin, captures: { coc_ia: $.data.initial_allowed_cents } }
          assert:
            - "Claim.${coc_id}.initial_allowed_cents == 1800000 (base 1500000 + capped outlier 300000, not 2000000)"

      - name: attribution_internal_first_waterfall_zeroes_vendor_duplication
        claim_type: correct_result
        grounds:
          - calculations.edit_savings_attribution
          - entities.EditHit.fields.attributed_savings_cents
          - entities.EditHit.fields.vendor_edit_id
        distinguishing_aspect: "Internal-first waterfall: when an INTERNAL edit and a mapped VENDOR edit fire on the same 50000-cent line, the internal hit is attributed 50000 and the vendor hit 0 — duplication avoidance keeps claim.denied at 50000, never 100000."
        test_recipe:
          setup:
            - "Provider PWF; INTERNAL edit rule RI (DENY, PROFESSIONAL) ACTIVE"
            - "VENDOR edit rule RV (DENY, PROFESSIONAL) ACTIVE; VendorEdit record mapped to RV with comparison_status DUPLICATE (conflict_policy INTERNAL_FIRST)"
            - "Claim with one 50000 line screened"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-WF", name: "Waterfall Prov" }, as: PlanAdmin, captures: { pwf_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "WF-INT", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rwi_id: $.data.id, rwi_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rwi_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vwi_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vwi_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vwi_id}/approve", payload: { expected_edit_rule_version: "${rwi_v}" }, as: EditApprover, as_user_id: approver-1 }
