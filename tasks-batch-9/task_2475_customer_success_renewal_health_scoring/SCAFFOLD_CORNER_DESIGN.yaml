            - "One ACTIVE CXO SponsorContact who is the economic buyer, so exec_engagement_score is 50.00 before the outcome is recorded."
            - "One SCHEDULED ExecutiveEngagement for that sponsor, start_at 2026-07-20T15:00:00Z (inside the 180-day exec window), end_at 2026-07-20T16:00:00Z."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/sponsor-contacts"
