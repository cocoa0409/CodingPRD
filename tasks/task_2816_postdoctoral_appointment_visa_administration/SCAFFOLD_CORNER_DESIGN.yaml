              as_user_id: "${p52_a_id}"
            - call: "GET /appointments/${a52_a_id}/export-control-reviews"
              payload: { status: "QUEUED" }
              as: ExportControlReviewer
              captures: { ecr52_id: "$.data[0].id" }
            - call: "POST /export-control-reviews/${ecr52_id}/decision"
              payload: { restricted_party_hit: false, controlled_technology_flag: false }
              as: ExportControlReviewer
              as_user_id: "ecr_rev_17"
            - call: "POST /appointments/${a52_a_id}/activate"
              payload: {}
