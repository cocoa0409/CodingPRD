              as: FacilityManager
              captures: { ten1: $.data.id }
            - call: "POST /tenants"
              payload: { email: "t15b@x.com", full_name: "T 15 B", state_code: "TX" }
              as: FacilityManager
              captures: { ten2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten1}", start_date: "2026-04-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { l1: $.data.id }
            - call: "POST /leases/${l1}/activate"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", tenant_id: "${ten2}", start_date: "2026-05-01T00:00:00Z", billing_day: 1, insurance_required: false }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "Second lease create error_id == ERR_UNIT_OCCUPANCY_OVERLAP (closed-interval intersection with the open-ended active lease)"

      - name: overlap_insurance_coverage_half_open_adjacency_allowed
        grounds:
          - validations[priority=10]
          - entities.InsurancePolicy.fields.coverage_start
          - entities.InsurancePolicy.fields.coverage_end
          - endpoints["POST /insurance-policies"]
        distinguishing_aspect: |
          Different resource (Lease-as-insurance-subject) and different interval semantics: HALF-OPEN
          [coverage_start, coverage_end). Adjacency (new start == prior end) is ALLOWED, unlike the
          closed unit-occupancy rule; only a genuine interior intersection raises ERR_COVERAGE_OVERLAP.
        test_recipe:
          setup:
            - "Lease with policy P1 [2026-04-01, 2026-07-01) cancelled to set coverage_end=2026-07-01. A second policy starting exactly 2026-07-01 is adjacent (allowed); one starting 2026-06-15 overlaps."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "F16", state_code: "TX", climate_premium_pct: 0.20, lien_default_days: 90, late_fee_grace_days: 5, late_fee_cents: 2000 }
              as: FacilityManager
              captures: { fac_id: $.data.id }
