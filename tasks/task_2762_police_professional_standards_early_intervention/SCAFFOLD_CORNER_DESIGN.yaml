              as_user_id: "${cmdr_id}"
            - call: "POST /complaints/${cb_id}/investigations"
              payload: { opening_note: "File B opened." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { inv_cb_id: $.data.id, inv_cb_v: $.data.version }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "File C: reports not filed.", incident_datetime: "2026-07-17T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { cc_id: $.data.id }
            - call: "POST /complaints/${cc_id}/allegations"
              payload: { subject_officer_id: "${subj_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "File C allegation.", offense_class: "C" }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /complaints/${cc_id}/investigations"
              payload: { opening_note: "File C opened." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { inv_cc_id: $.data.id, inv_cc_v: $.data.version }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "File D: internal affairs investigator accused of delay.", incident_datetime: "2026-07-18T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${ia_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { cd_id: $.data.id }
            - call: "POST /complaints/${cd_id}/allegations"
              payload: { subject_officer_id: "${inv_c_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "File D allegation against Calder.", offense_class: "C" }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /complaints/${cd_id}/investigations"
              payload: { opening_note: "File D opened." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { inv_cd_id: $.data.id, inv_cd_v: $.data.version }
          trigger:
            - call: "POST /investigations/${inv_ca_id}/assignments"
              payload: { expected_investigation_version: "${inv_ca_v}", assignment_note: "Selector picks for file A." }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /investigations/${inv_cb_id}/assignments"
              payload: { expected_investigation_version: "${inv_cb_v}", assignment_note: "Selector picks for file B." }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /investigations/${inv_cc_id}/assignments"
              payload: { expected_investigation_version: "${inv_cc_v}", assignment_note: "Selector picks for file C." }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /investigations/${inv_cd_id}/assignments"
              payload: { expected_investigation_version: "${inv_cd_v}", assignment_note: "Selector has nobody left for file D." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { err_pool: "$.data.error_id" }
          assert:
            - "call 1: HTTP 200 with Investigation.${inv_ca_id}.assigned_investigator_officer_id == ${inv_a_id} (open_case_load ties at 0, certification_level ties at 3, badge_number IA-101 sorts before IA-102)"
            - "call 2: HTTP 200 with Investigation.${inv_cb_id}.assigned_investigator_officer_id == ${inv_b_id} (Ahn now carries 1, so Briggs and Calder tie at 0 and certification_level 3 beats 2)"
            - "call 3: HTTP 200 with Investigation.${inv_cc_id}.assigned_investigator_officer_id == ${inv_c_id} (Calder is the only candidate at open_case_load 0; key 1 outranks the certification key)"
            - "call 4: HTTP 422 with ${err_pool} == ERR_NO_ELIGIBLE_INVESTIGATOR (Calder is the subject and Ahn and Briggs share the subject's unit); Investigation.${inv_cd_id}.status stays UNASSIGNED, assignment_count stays 0 and version stays ${inv_cd_v}"
            - "Officer.${inv_a_id}.open_case_load == 1, Officer.${inv_b_id}.open_case_load == 1, Officer.${inv_c_id}.open_case_load == 1"
            - "Officer.${cmdr_id}.open_case_load == 0 (is_investigator false keeps the commander out of every pool)"
            - "each accepted assignment left its Investigation in ASSIGNED with assignment_count == 1 and version == 2"

      - name: the_investigation_window_constants_are_selected_by_classification
        claim_type: Constants Applied
        grounds:
          - calculations.investigation_window
          - calculations.complaint_classification_and_routing
          - entities.Investigation.fields.statutory_days
          - entities.Investigation.fields.required_certification_level
        distinguishing_aspect: |
          STATUTORY_DAYS_BY_CLASSIFICATION and REQUIRED_CERTIFICATION_BY_CLASSIFICATION are
          three-row maps and the row is chosen by the complaint's classification, not by the
          allegation's offense_class or by the intake channel. Three complaints received on the
          same instant must therefore carry three different due dates computed from received_at
          — 180, 121 and 90 whole days — and three different certification bars.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z, so all three complaints share received_at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit, one PATROL_DIVISION unit with intake_enabled true, Commander Reyes, Sergeant Doyle and Officer Vance exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-09-16T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { intake_channel: "PUBLIC", narrative: "Wrist injured during a takedown.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: true, reported_allegation_types: ["EXCESSIVE_FORCE"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Dana Ruiz", complainant_contact: "dana@example.org", complainant_demographic_code: "DG_B" }
              as: Complainant
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/allegations"
