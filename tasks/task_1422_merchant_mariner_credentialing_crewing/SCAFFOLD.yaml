  - method: POST
    path: "/vessels/{id}/decommission"
    description: "ACTIVE|LAID_UP -> DECOMMISSIONED; retires slots, supersedes rotation plan"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: ["status -> DECOMMISSIONED", "ManningSlots -> RETIRED", "ACTIVE rotation plan -> SUPERSEDED", "increments Vessel.version by 1"]
