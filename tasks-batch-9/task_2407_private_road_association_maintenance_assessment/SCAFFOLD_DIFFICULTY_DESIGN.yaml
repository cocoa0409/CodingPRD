  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: quorum_and_adoption_exact_equality_adopt_while_one_bp_short_rejects
        grounds:
          - "calculations.vote_threshold_resolution"
          - "state_machines.SpecialAssessmentProposal.BALLOTING_to_ADOPTED"
          - "state_machines.SpecialAssessmentProposal.BALLOTING_to_REJECTED"
          - "entities.SpecialAssessmentProposal.fields.quorum_met"
        distinguishing_aspect: >
          Both comparisons in vote_threshold_resolution are inclusive
          cross-multiplied integers, and this instance lands one proposal exactly
          on both of them at once (counted 2 of eligible 4 gives
          2*10000 == 4*5000 for quorum, and yes 1 of counted 2 gives
          1*10000 == 2*5000 for adoption at GRADING's 5000 bps) so it must
          ADOPT, while a second proposal sits one basis point short of PAVING's
          deliberately non-two-thirds 6667 bps (yes 2 of counted 3 gives
          20000 < 20001) so it must REJECT. An implementation using
          `>` instead of `>=`, or a float ratio (0.5 >= 0.5 works, but
          2/3 = 0.6666666 vs 0.6667 and 6667/10000 = 0.6667 collide under
          float), flips exactly one of the two outcomes. The paired design means
          neither a uniformly strict nor a uniformly loose comparison passes.
        test_recipe:
          setup: |
            Build a four-parcel association (QUORUM_4) on one segment with
            quorum_bps 5000, default_voting_basis PER_PARCEL and reserve_target
            1000000: P1 290 ft RESIDENTIAL_YEAR_ROUND (290 units), P2 400 ft
            SEASONAL (240), P3 250 ft AGRICULTURAL (200), P4 300 ft
            RESIDENTIAL_YEAR_ROUND (300), so U is 1030. Levy an FY2027
            FRONTAGE_WEIGHTED roll for 4120000 cents, which divides exactly:
            4000 cents per unit gives 1160000 / 960000 / 800000 / 1200000 with
            total_levied 4120000 and unallocated_residual 0, and credits
            618000 to the reserve. All four members are GOOD_STANDING, so every
            proposal snapshots eligible_weight_total 4. Draft proposal A as
            GRADING for 1500000 EQUAL_SHARE and proposal B as PAVING for
            1500000 EQUAL_SHARE (both under ESCALATION_COST_CENTS, so no cost
            bump), open balloting on both to close 2026-11-01, then cast: on A
            only m1 YES and m2 NO; on B m1 YES, m2 YES and m3 NO. Each cast is
            written against a freshly re-read proposal version because every
            cast bumps it.
