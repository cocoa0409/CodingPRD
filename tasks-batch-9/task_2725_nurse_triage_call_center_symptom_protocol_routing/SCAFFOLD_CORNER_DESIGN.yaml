            - "${nurse_id_seen} == ${call_id}"
            - "${charge_id} == ${call_id}"
            - "${auditor_id} == ${call_id}"
            - "${liaison_id} == ${call_id}"
            - "${admin_status} == INTAKE"
            - "${liaison_caller} == +14155550100"
            - "${protocol_total} == 1"

