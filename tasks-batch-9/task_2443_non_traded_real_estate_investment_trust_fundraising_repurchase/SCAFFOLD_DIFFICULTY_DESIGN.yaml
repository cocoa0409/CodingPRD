# =============================================================================
# task_2443 — Non-Traded REIT Fundraising & Repurchase
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
#
# 22 instances across the nine §0.5 Difficulty Rules (>= 2 per rule).
# Every numeric literal in `assert:` was computed by executing the relevant
# §1.3 `formula:` against the pinned setup values.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: nav_pre_accrual_vs_official_transaction_price
        grounds:
          - calculations.nav_per_share
          - entities.NavRecord.fields.nav_per_share_pre_accrual_cents
          - entities.NavRecord.fields.nav_per_share_cents
          - entities.NavRecord.fields.accrued_distribution_payable_cents
          - concurrency_rules[nav-create-stale-share-class]
        distinguishing_aspect: |
          One NavRecord row carries two per-share figures computed from the same
          gross_asset_value_cents and share count: the disclosure variant ignores
          declared-but-unpaid distributions while the official variant subtracts
          them, so a single DECLARED declaration of 96500 cents forces
          nav_per_share_pre_accrual_cents (984) and nav_per_share_cents (979) to
          differ by exactly 5 cents on the same record.
        test_recipe:
          setup:
            - "Offering 'Cornerstone Income REIT' EFFECTIVE, escrow BROKEN, minimum 20000000 cents, initial price 1000 cents."
            - "One share class T (300 bps selling commission, 50 bps dealer manager fee) with 193000000 e4 shares outstanding from two accepted 10000000-cent subscriptions."
            - "One DECLARED DistributionDeclaration at 5 cents per share with record_date 2026-08-31, total_declared_cents 96500, unpaid."
            - "Logical clock at 2026-09-02T00:00:00Z so the August valuation period has fully elapsed."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Cornerstone Income REIT", minimum_offering_amount_cents: 20000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 5 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "T", upfront_selling_commission_bps: 300, dealer_manager_fee_bps: 50, annual_distribution_fee_bps: 850, distribution_fee_cap_bps: 875, converts_to_class_code: "I" }
              as: SponsorOperator
              captures: { sc_t_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Meridian Securities LLC", crd_number: "CRD-100001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 500, suitability_documentation_required: true }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Avery Nolan", email: "avery.nolan@example.com", state_code: "TX", net_worth_cents: 500000000, annual_income_cents: 100000000 }
              as: SponsorOperator
              captures: { inv_a_id: $.data.id }
            - call: "POST /investors/${inv_a_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-A-2026-08" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Blake Ortiz", email: "blake.ortiz@example.com", state_code: "TX", net_worth_cents: 500000000, annual_income_cents: 100000000 }
              as: SponsorOperator
              captures: { inv_b_id: $.data.id }
            - call: "POST /investors/${inv_b_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-B-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_t_id}", investor_id: "${inv_a_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 10000000 }
              as: SponsorOperator
              captures: { sub_a_id: $.data.id }
            - call: "POST /subscriptions/${sub_a_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_t_id}", investor_id: "${inv_b_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 10000000 }
              as: SponsorOperator
              captures: { sub_b_id: $.data.id }
            - call: "POST /subscriptions/${sub_b_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: SponsorOperator
            - call: "GET /offerings/${off_id}"
              as: SponsorOperator
              captures: { off_v: $.data.version }
            - call: "POST /distribution-declarations"
              payload: { offering_id: "${off_id}", record_date: "2026-08-31", payment_date: "2026-09-15", declared_per_share_cents: 5, gaap_net_income_cents: 60000, adjusted_cash_flow_cents: 96500, board_uncovered_acknowledgement: false, expected_offering_version: "${off_v}" }
              as: SponsorOperator
              captures: { decl_id: $.data.id }
            - call: "GET /share-classes/${sc_t_id}"
              as: SponsorOperator
              captures: { sc_t_v: $.data.version }
          trigger:
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_t_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", gross_asset_value_cents: 20000000, other_liabilities_cents: 1000000, expected_share_class_version: "${sc_t_v}" }
              as: SponsorOperator
              captures: { nav_id: $.data.id }
          assert:
            - "NavRecord.${nav_id}.shares_outstanding_e4_snapshot == 193000000"
            - "NavRecord.${nav_id}.accrued_distribution_payable_cents == 96500"
            - "NavRecord.${nav_id}.nav_per_share_pre_accrual_cents == 984"
            - "NavRecord.${nav_id}.nav_per_share_cents == 979"
            - "NavRecord.${nav_id}.nav_per_share_pre_accrual_cents - NavRecord.${nav_id}.nav_per_share_cents == 5"
            - "NavRecord.${nav_id}.variance_bps == 0"
            - "NavRecord.${nav_id}.status == \"DRAFT\""
            - "DistributionDeclaration.${decl_id}.total_declared_cents == 96500"

      - name: distribution_coverage_gaap_basis_vs_cash_flow_basis
        grounds:
          - calculations.distribution_declaration_total_and_coverage
          - entities.DistributionDeclaration.fields.coverage_ratio_gaap_bps
          - entities.DistributionDeclaration.fields.coverage_ratio_cash_bps
          - entities.DistributionDeclaration.fields.return_of_capital_bps
          - entities.DistributionDeclaration.fields.gaap_return_of_capital_bps
          - validations[priority=10]
        distinguishing_aspect: |
          The identical total_declared_cents of 150000 is measured against two
          different numerators on one row, yielding coverage_ratio_gaap_bps 6000
          against coverage_ratio_cash_bps 9000 and therefore two different
          return-of-capital disclosures (4000 bps GAAP versus 1000 bps cash), and
          only the cash-flow variant gates the board-acknowledgement rule.
        test_recipe:
          setup:
            - "Offering 'Harborline Diversified REIT' EFFECTIVE, escrow BROKEN, minimum 30000000 cents, initial price 1000 cents."
            - "One zero-fee share class I with 300000000 e4 shares outstanding from three accepted 10000000-cent subscriptions."
