            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "shared 77", pack_code_date: "2026-07-02T00:00:00Z" }, captures: { cp: "$.data.id", st: "$.data.product_identification_status", lot: "$.data.lot_id" } }
            - { call: "GET /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { lot_id: "${lotb}" }, captures: { tc: "$.total_count" } }
          assert:
