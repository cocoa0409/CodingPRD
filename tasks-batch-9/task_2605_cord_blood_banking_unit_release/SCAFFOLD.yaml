    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/cbb/reservations"
    description: "Paginated reservation list; the unit_id / superseded_by_reservation_id / confirmatory_test_id filters make every Reservation foreign key reverse-reachable. Default order created_at ASC."
    roles: [TransplantCenter, MedicalDirector, RegistryOperator, PlatformAdmin]
    code: 200
    input: ["unit_id?", "superseded_by_reservation_id?", "confirmatory_test_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: GET
    path: "/cbb/storage-tanks"
    description: "Paginated tank list with status and class filters; default order created_at ASC."
    roles: [FacilitiesEngineer, ProcessingTechnologist, MedicalDirector, PlatformAdmin]
    code: 200
    input: ["status?", "tank_class?", "limit?", "offset?"]
    output: StorageTank[]
    side_effects: []
  # ---------- computed reads ----------
  - method: GET
    path: "/cbb/units/search"
    description: "Ranked unit search for a prospective patient. Applies the unit_search_ranking eligibility filter, ranks by the PRE_CRYO dose DESC with cd34 DESC then created_at ASC as tie-breaks, and returns an empty data array (never an error) when nothing qualifies."
    roles: [TransplantCenter, RegistryOperator, MedicalDirector, PlatformAdmin]
    code: 200
    input: [program_scope, patient_weight_kg, "required_hla_match_count?", "min_dose_x1e7_per_kg?", "limit?", "offset?"]
    output: "{ data: { unit_id: string, unit_registry_code: string, program_type: string, potency_grade: string, post_processing_tnc_millions: integer, post_processing_cd34_thousands: integer, post_processing_viability_pct: number, pre_cryo_dose_x1e7_per_kg: number, tank_code: string }[], total_count: integer, has_more: boolean }"
    side_effects: [unit_search_ranking]
  - method: GET
    path: "/cbb/reservations/{id}/release-summary"
    description: "Derived pre-flight summary for a release: both dose variants, the confirmatory recovery, every release gate's pass/fail, and the settlement the release would post. Read-only — evaluating it never mutates anything."
    roles: [TransplantCenter, MedicalDirector, PlatformAdmin]
    code: 200
    input: []
    output: "{ reservation_id: string, unit_id: string, pre_cryo_dose_x1e7_per_kg: number, post_thaw_dose_x1e7_per_kg: number, confirmatory_recovery_pct: number, dose_gate_passed: boolean, confirmatory_test_present: boolean, maternal_result: string, tank_status: string, account_balance_cents: integer, projected_settlement_total_cents: integer, blocking_error_id: string }"
    side_effects: [nucleated_cell_dose, disposition_settlement, account_balance_reconciliation]
  # ---------- enrollment and consent ----------
  - method: POST
    path: "/cbb/enrollments"
    description: "Register an expectant parent. lifecycle_status starts CONSENT_PENDING and consent_status starts PENDING."
    roles: [IntakeCoordinator, PlatformAdmin]
    code: 201
    input: [program_type, primary_parent_name, expected_delivery_date, collection_site_code, "research_use_authorized?", "hla_typing_consent?"]
    output: Enrollment
    side_effects: ["lifecycle_status := CONSENT_PENDING", "consent_status := PENDING", "consent_version := 0", "consent_amendment_count := 0"]
  - method: POST
    path: "/cbb/enrollments/{id}/consent"
    description: "Sign consent, either the initial signature (PENDING -> CONSENTED, lifecycle CONSENT_PENDING -> ACTIVE) or the re-signature that closes an open amendment (AMENDMENT_PENDING -> CONSENTED)."
    roles: [ParentGuardian, IntakeCoordinator, PlatformAdmin]
    code: 200
    input: [consent_document_hash, "research_use_authorized?", "hla_typing_consent?"]
    output: Enrollment
    side_effects: ["consent_status := CONSENTED", "consent_version += 1", "consent_signed_at := clock", "lifecycle_status CONSENT_PENDING -> ACTIVE on the first signature", "HELD collection kits return to DISPATCHED", "SUSPENDED registry listings return to ACTIVE when the suspension reason was CONSENT_AMENDMENT_PENDING"]
  - method: POST
    path: "/cbb/enrollments/{id}/consent-amendment"
    description: "Open a consent amendment. Blocked once consent_amendment_count has reached MAX_CONSENT_AMENDMENTS (3)."
    roles: [ParentGuardian, IntakeCoordinator, PlatformAdmin]
    code: 200
    input: [amendment_reason_code]
    output: Enrollment
    side_effects: ["consent_status := AMENDMENT_PENDING", "consent_amendment_count += 1", "DISPATCHED collection kits move to HELD with hold_reason_code CONSENT_AMENDMENT_PENDING", "ACTIVE registry listings move to SUSPENDED with suspension_reason_code CONSENT_AMENDMENT_PENDING"]
  - method: POST
    path: "/cbb/enrollments/{id}/withdraw"
    description: "Withdraw the enrollment. Terminal for the enrollment and compensating for everything downstream of it."
    roles: [ParentGuardian, IntakeCoordinator, PlatformAdmin]
    code: 200
    input: [withdrawal_reason_code]
    output: Enrollment
    side_effects: ["lifecycle_status := WITHDRAWN", "consent_status := REVOKED", "non-terminal collection kits move to RETURNED", "ACTIVE and SUSPENDED registry listings move to WITHDRAWN", "non-terminal reservations move to CANCELLED", "ISSUED / PAST_DUE / DELINQUENT invoices move to VOID", "StorageAccount balance_cents recomputed to 0", "tank occupied_slots recomputed for every tank that held a unit of this enrollment"]
  # ---------- storage account and billing ----------
  - method: POST
    path: "/cbb/storage-accounts"
    description: "Open a private family storage account for a consented enrollment. At most one account per enrollment."
    roles: [BillingAdministrator, PlatformAdmin]
    code: 201
    input: [enrollment_id, billing_contact_email, plan_term_years, prepaid_through_date]
    output: StorageAccount
    side_effects: ["status := ACTIVE", "balance_cents := 0", "lifetime_paid_cents := 0", "paid_through_date := prepaid_through_date"]
  - method: POST
    path: "/cbb/storage-invoices"
    description: "Issue a storage invoice for a billing period. Lines are rounded individually before they are summed (storage_invoice_total)."
    roles: [BillingAdministrator, PlatformAdmin]
    code: 201
    input: [account_id, billing_period_start, billing_period_end, prorated_days]
    output: StorageInvoice
    side_effects: [storage_invoice_total, account_balance_reconciliation, "status := ISSUED", "due_date := billing_period_start + 30 days"]
  - method: POST
    path: "/cbb/storage-invoices/{id}/payments"
    description: "Post a payment against an invoice. Paying the residual in full moves the invoice to PAID, and clearing the account's whole balance restores a PAST_DUE / DELINQUENT / ABANDONMENT_NOTICE account to ACTIVE and un-flags PENDING_ABANDONMENT units."
    roles: [BillingAdministrator, ParentGuardian, PlatformAdmin]
    code: 200
    input: [amount_cents, payment_reference]
    output: StorageInvoice
    side_effects: [account_balance_reconciliation, "amount_paid_cents += amount_cents", "invoice -> PAID when the residual reaches 0", "lifetime_paid_cents += amount_cents", "account returns to ACTIVE when balance_cents reaches 0", "PENDING_ABANDONMENT units return to PRIVATE_STORED"]
  # ---------- kit dispatch and collection ----------
  - method: POST
    path: "/cbb/collection-kits"
    description: "Dispatch a collection kit to a consented enrollment; expires_at := dispatched_at + KIT_SHELF_LIFE_DAYS (120)."
    roles: [IntakeCoordinator, PlatformAdmin]
    code: 201
    input: [enrollment_id, kit_lot_code, courier_tracking_code]
    output: CollectionKit
    side_effects: ["status := DISPATCHED", "dispatched_at := clock", "expires_at := clock + 120 days", "enrollment lifecycle_status ACTIVE -> KIT_DISPATCHED"]
  - method: POST
    path: "/cbb/collections"
    description: "Record a collection at delivery against a dispatched kit. net_volume_ml is computed from the two input volumes."
    roles: [CollectionSite, PlatformAdmin]
    code: 201
    input: [kit_id, collected_at, collection_volume_ml, anticoagulant_volume_ml, delivery_mode]
    output: Collection
    side_effects: [collection_net_volume, "status := COLLECTED", "kit status -> USED", "enrollment lifecycle_status KIT_DISPATCHED -> COLLECTED"]
  - method: POST
    path: "/cbb/collections/{id}/receive"
    description: "Receive the collection at the processing laboratory. Enforces the 48.0-hour window on the exact elapsed time and the closed transport-temperature range, then synthesizes the CordBloodUnit (discoverable only via GET /cbb/collections/{id}/units)."
    roles: [ProcessingTechnologist, PlatformAdmin]
    code: 201
    input: [transport_temp_c]
    output: Collection
    side_effects: [collection_transit_hours, "status := RECEIVED", "received_at := clock", "hours_to_receipt persisted", "a CordBloodUnit is created with processing_status RECEIVED, availability_status UNAVAILABLE, eligibility_status PENDING and program_type copied from the enrollment", "storage_account_id is set on the unit when the enrollment owns an account"]
  - method: POST
    path: "/cbb/collections/{id}/reject"
    description: "Reject a collection that has not yet been received. reason_code selects the terminal state: LATE -> REJECTED_LATE, TEMP -> REJECTED_TEMP, VOLUME -> REJECTED_VOLUME, CONTAMINATION -> DISCARDED."
    roles: [ProcessingTechnologist, MedicalDirector, PlatformAdmin]
    code: 200
    input: [reason_code, "note?"]
    output: Collection
    side_effects: ["status := the terminal state selected by reason_code", "rejection_reason_code := reason_code", "no CordBloodUnit is created"]
  # ---------- maternal screening ----------
  - method: POST
    path: "/cbb/maternal-screenings"
    description: "Record a maternal infectious-disease panel. status and overall_result are derived by maternal_panel_result; a panel drawn outside the +/-7-day delivery window lands in INVALID and never governs eligibility."
    roles: [MedicalDirector, IntakeCoordinator, PlatformAdmin]
    code: 201
    input: [enrollment_id, collected_at, hiv_result, hbv_result, hcv_result, htlv_result, syphilis_result, "cmv_result?"]
    output: MaternalScreening
    side_effects: [maternal_panel_result, "valid_until := collected_at + 180 days"]
  - method: PATCH
    path: "/cbb/maternal-screenings/{id}"
    description: "Amend individual markers of a PENDING or COMPLETED panel (confirmatory NAT results arrive days later). Re-deriving the panel to REACTIVE cascades to the unit, its listing and its holds."
    roles: [MedicalDirector, PlatformAdmin]
    code: 200
    input: ["hiv_result?", "hbv_result?", "hcv_result?", "htlv_result?", "syphilis_result?", "cmv_result?", "nat_confirmed?"]
    output: MaternalScreening
    side_effects: [maternal_panel_result, unit_eligibility_determination, "units of the enrollment move to eligibility_status INELIGIBLE with reason MATERNAL_REACTIVE when the panel becomes REACTIVE", "ACTIVE and MATCHED registry listings move to SUSPENDED with suspension_reason_code MATERNAL_REACTIVE", "PENDING_CONFIRMATORY reservations move to CANCELLED with cancellation_reason_code MATERNAL_REACTIVE"]
  # ---------- processing ----------
  - method: POST
    path: "/cbb/processing-runs"
    description: "Open a volume-reduction run on a received unit. pre_volume_ml and pre_tnc_millions are frozen from the collection's net volume and the operator's pre-count at run creation."
    roles: [ProcessingTechnologist, PlatformAdmin]
    code: 201
    input: [unit_id, method, pre_tnc_millions]
    output: ProcessingRun
    side_effects: ["status := IN_PROGRESS", "started_at := clock", "pre_volume_ml := Collection.net_volume_ml", "operator_user_id := X-User-ID", "unit processing_status RECEIVED -> PROCESSING"]
  - method: POST
    path: "/cbb/processing-runs/{id}/complete"
    description: "Close a processing run. outcome COMPLETED drives the unit to VOLUME_REDUCED; outcome FAILED returns it to RECEIVED so a second run can be opened."
    roles: [ProcessingTechnologist, PlatformAdmin]
    code: 200
    input: [outcome, post_volume_ml, post_tnc_millions]
    output: ProcessingRun
    side_effects: [volume_reduction_recovery, "status := COMPLETED or FAILED", "completed_at := clock", "unit processing_status := VOLUME_REDUCED (COMPLETED) or RECEIVED (FAILED)", "unit post_processing_volume_ml := post_volume_ml on COMPLETED"]
  - method: POST
    path: "/cbb/quality-tests"
    description: "Record a cell-count / viability test. test_kind POST_PROCESSING recomputes the unit's counts and quality_acceptance_score; test_kind CONFIRMATORY with a reservation_id computes the POST_THAW dose and, when it passes, links itself as that reservation's confirmatory_test_id. The row is immutable once written."
    roles: [ProcessingTechnologist, PlatformAdmin]
    code: 201
    input: [unit_id, test_kind, tnc_millions, cd34_thousands, viability_pct, volume_ml, sterility_result, "reservation_id?"]
    output: QualityTest
    side_effects: [quality_test_outcome, unit_quality_acceptance_score, nucleated_cell_dose, "performed_by_user_id := X-User-ID", "unit post_processing_tnc_millions / cd34_thousands / viability_pct := the POST_PROCESSING values", "reservation.confirmatory_test_id := this test id and reservation post_thaw_dose_x1e7_per_kg persisted when test_kind == CONFIRMATORY and outcome == PASS"]
  - method: POST
    path: "/cbb/units/{id}/eligibility-determination"
    description: "Medical-director eligibility determination over the maternal panel and the unit's POST_PROCESSING test. Segregation of duties: the determining director must not be the user who performed that test."
    roles: [MedicalDirector, PlatformAdmin]
    code: 200
    input: ["decision_note?"]
    output: CordBloodUnit
    side_effects: [unit_eligibility_determination, "eligibility_status := ELIGIBLE | INELIGIBLE | INDETERMINATE", "eligibility_reason_code set", "eligibility_determined_by_user_id := X-User-ID"]
  - method: POST
    path: "/cbb/units/{id}/cryopreserve"
    description: "Cryopreserve an eligible, volume-reduced unit into a tank slot. Enforces tank capacity, tank status, the half-open maintenance window on freeze_at and the rolling 30-day excursion budget."
    roles: [ProcessingTechnologist, PlatformAdmin]
    code: 200
    input: [tank_id, slot_code, freeze_at]
    output: CordBloodUnit
    side_effects: [tank_slot_occupancy, cumulative_excursion_minutes_30d, "processing_status := CRYOPRESERVED", "cryopreserved_at := freeze_at", "tank_id and slot_code persisted", "tank occupied_slots += 1", "availability_status := PRIVATE_STORED (PRIVATE_FAMILY) or stays UNAVAILABLE (PUBLIC_DONATION, which becomes LISTED only via POST /cbb/registry-listings)"]
  # ---------- registry ----------
  - method: POST
    path: "/cbb/registry-listings"
    description: "Publish a cryopreserved public-donation unit on a registry. Requires the unit's current version in expected_unit_version, HLA typing consent, a non-reactive maternal panel and counts clearing the public listing thresholds. potency_grade is frozen at publication."
    roles: [RegistryOperator, PlatformAdmin]
    code: 201
    input: [unit_id, registry_code, hla_a, hla_b, hla_drb1, expected_unit_version]
    output: RegistryListing
    side_effects: [registry_potency_grade, "listing_status := ACTIVE", "listed_at := clock", "unit availability_status UNAVAILABLE -> LISTED", "unit version += 1"]
  - method: POST
    path: "/cbb/registry-listings/{id}/suspend"
    description: "Registry desk temporarily pulls an ACTIVE listing (pending HLA re-typing or a registry audit). The listing becomes SUSPENDED with suspension_reason_code REGISTRY_HOLD and its unit returns to availability_status UNAVAILABLE, which is the only state in which a duplicate publication attempt is adjudicated by validations[priority 23] rather than by priority 9."
    roles: [RegistryOperator, PlatformAdmin]
    code: 200
    input: ["suspension_note?"]
    output: RegistryListing
    side_effects: ["listing_status := SUSPENDED", "suspension_reason_code := REGISTRY_HOLD", "unit availability_status LISTED -> UNAVAILABLE", "unit version += 1", "PENDING_CONFIRMATORY reservations on that unit := CANCELLED with cancellation_reason_code LISTING_SUSPENDED", "tank occupied_slots unchanged"]
  - method: POST
    path: "/cbb/registry-listings/{id}/resume"
    description: "Return a REGISTRY_HOLD listing to the registry. Only a REGISTRY_HOLD suspension may be resumed manually - a UNIT_QUARANTINED, MATERNAL_REACTIVE, SCREENING_EXPIRED or CONSENT_AMENDMENT_PENDING suspension is lifted only by its own compensating cascade, and attempting it here is ERR_INVALID_LISTING_STATE."
    roles: [RegistryOperator, PlatformAdmin]
    code: 200
    input: []
    output: RegistryListing
    side_effects: ["listing_status := ACTIVE", "suspension_reason_code := null", "unit availability_status UNAVAILABLE -> LISTED", "unit version += 1", "potency_grade unchanged"]
  # ---------- tanks and temperature ----------
  - method: POST
    path: "/cbb/storage-tanks"
    description: "Commission a cryogenic storage tank. occupied_slots starts at 0 and cumulative_excursion_minutes_30d at 0."
    roles: [FacilitiesEngineer, PlatformAdmin]
    code: 201
    input: [tank_code, tank_class, capacity_slots, "maintenance_window_start?", "maintenance_window_end?"]
    output: StorageTank
    side_effects: ["status := ONLINE", "occupied_slots := 0", "cumulative_excursion_minutes_30d := 0"]
  - method: POST
    path: "/cbb/storage-tanks/{id}/temperature-readings"
    description: "Post a temperature reading. A reading strictly above ALARM_THRESHOLD_C (-150.0) drives the tank to ALARM, opens a TemperatureExcursion and fires the four-level quarantine cascade; a reading at or below the threshold only refreshes last_temperature_c."
    roles: [FacilitiesEngineer, PlatformAdmin]
    code: 200
    input: [reading_c, reading_at]
    output: StorageTank
    side_effects: ["last_temperature_c := reading_c", "last_reading_at := reading_at", "tank status ONLINE -> ALARM when reading_c > -150.0", "a TemperatureExcursion is opened in status OPEN with detected_at := reading_at (discoverable via GET /cbb/storage-tanks/{id}/temperature-excursions)", "every non-terminal unit in the tank moves to availability_status QUARANTINED with quarantine_reason_code EXCURSION_OPEN, created_at ASC", "each such unit's ACTIVE registry listing moves to SUSPENDED with suspension_reason_code UNIT_QUARANTINED", "each suspended listing's PENDING_CONFIRMATORY reservations move to CANCELLED with cancellation_reason_code LISTING_SUSPENDED"]
  - method: POST
    path: "/cbb/temperature-excursions/{id}/acknowledge"
    description: "Acknowledge an open excursion. Acknowledging within MAX_ACK_MINUTES (30) of detection yields ACKNOWLEDGED; the nightly run escalates an unacknowledged excursion past that window."
    roles: [FacilitiesEngineer, PlatformAdmin]
    code: 200
    input: ["acknowledgement_note?"]
    output: TemperatureExcursion
    side_effects: ["status := ACKNOWLEDGED", "acknowledged_at := clock", "acknowledged_by_user_id := X-User-ID"]
  - method: POST
    path: "/cbb/temperature-excursions/{id}/resolve"
    description: "Resolve an acknowledged or escalated excursion. disposition NO_IMPACT or REQUALIFY compensates the quarantine cascade exactly (units and listings return to their pre-alarm states); disposition TOTAL_LOSS keeps the units quarantined, withdraws their listings and takes the tank OFFLINE."
    roles: [MedicalDirector, FacilitiesEngineer, PlatformAdmin]
    code: 200
    input: [disposition, peak_temperature_c]
    output: TemperatureExcursion
    side_effects: [cumulative_excursion_minutes_30d, "status := RESOLVED (NO_IMPACT/REQUALIFY) or CLOSED_LOSS (TOTAL_LOSS)", "resolved_at := clock", "duration_minutes := floor(resolved_at - detected_at in whole minutes)", "tank ALARM -> ONLINE on NO_IMPACT/REQUALIFY, ALARM -> OFFLINE on TOTAL_LOSS", "QUARANTINED units return to PRIVATE_STORED or LISTED on NO_IMPACT/REQUALIFY, created_at ASC", "SUSPENDED listings return to ACTIVE on NO_IMPACT/REQUALIFY and move to WITHDRAWN on TOTAL_LOSS", "tank cumulative_excursion_minutes_30d recomputed"]
  # ---------- reservation and release ----------
  - method: POST
    path: "/cbb/reservations"
    description: "Place a hold on an eligible unit. Requires the unit's current version in expected_unit_version, computes the PRE_CRYO dose, and rejects a hold whose 24-hour-buffered window touches an incumbent hold."
    roles: [TransplantCenter, PlatformAdmin]
    code: 201
    input: [unit_id, requesting_center_name, patient_weight_kg, patient_hla_match_count, hold_from, hold_until, expected_unit_version]
    output: Reservation
    side_effects: [reservation_hold_conflict, nucleated_cell_dose, "status := PENDING_CONFIRMATORY", "requesting_center_user_id := X-User-ID", "pre_cryo_dose_x1e7_per_kg computed, dose_variant_applied := PRE_CRYO", "unit version += 1"]
  - method: POST
    path: "/cbb/reservations/{id}/confirm"
    description: "Confirm a hold within CONFIRM_WINDOW_HOURS (72) of its creation. Reserves the unit, matches its listing and declines every sibling pending hold on the same unit."
    roles: [TransplantCenter, PlatformAdmin]
    code: 200
    input: [intended_transplant_date]
    output: Reservation
    side_effects: ["status := CONFIRMED", "unit availability_status := RESERVED", "ACTIVE listing := MATCHED", "sibling PENDING_CONFIRMATORY reservations := DECLINED with superseded_by_reservation_id set"]
  - method: POST
    path: "/cbb/reservations/{id}/decline"
    description: "Transplant centre declines its own pending hold. Fork branch B: no inventory state is touched."
    roles: [TransplantCenter, PlatformAdmin]
    code: 200
    input: [reason_code]
    output: Reservation
    side_effects: ["status := DECLINED", "cancellation_reason_code := reason_code", "no change to the unit, its listing or the tank"]
  - method: POST
    path: "/cbb/reservations/{id}/release"
    description: "Release a confirmed unit for transplant. Gated on the POST_THAW dose, a linked passing confirmatory test, a non-reactive maternal panel, an ONLINE tank, a zero account balance and segregation of duties against the eligibility determiner. Posts the disposition settlement."
    roles: [MedicalDirector, PlatformAdmin]
    code: 200
    input: ["release_note?"]
    output: Reservation
    side_effects: [nucleated_cell_dose, storage_fee_assessment, disposition_settlement, tank_slot_occupancy, "status := RELEASED", "released_at := clock", "dose_variant_applied := POST_THAW", "settlement_total_cents persisted on the reservation and mirrored to StorageAccount.last_settlement_total_cents", "unit availability_status := RELEASED with disposition_reason TRANSPLANT_RELEASED", "listing := WITHDRAWN", "tank occupied_slots -= 1", "enrollment lifecycle_status -> CLOSED when this was its last live unit"]
  - method: POST
    path: "/cbb/reservations/{id}/cancel"
    description: "Cancel a confirmed hold. Compensating edge: the unit returns to LISTED or PRIVATE_STORED, the listing returns to ACTIVE, and tank occupancy is provably unchanged."
    roles: [TransplantCenter, PlatformAdmin]
    code: 200
    input: [reason_code]
    output: Reservation
    side_effects: ["status := CANCELLED", "cancellation_reason_code := reason_code", "unit availability_status := LISTED (PUBLIC_DONATION) or PRIVATE_STORED (PRIVATE_FAMILY)", "MATCHED listing := ACTIVE", "tank occupied_slots unchanged"]
  - method: POST
    path: "/cbb/units/{id}/dispose"
    description: "Dispose of a unit (abandonment, quality failure, requested destruction or research diversion). Terminal on every unit axis; frees the tank slot and posts the disposition settlement on the storage account."
    roles: [MedicalDirector, PlatformAdmin]
    code: 200
    input: [reason, "note?"]
    output: CordBloodUnit
    side_effects: [storage_fee_assessment, disposition_settlement, tank_slot_occupancy, "processing_status := DISCARDED", "availability_status := DISPOSED", "disposition_reason := reason", "disposed_at := clock", "tank occupied_slots -= 1", "ACTIVE / SUSPENDED / MATCHED listings := WITHDRAWN", "non-terminal reservations := CANCELLED with cancellation_reason_code UNIT_DISPOSED", "StorageAccount.last_settlement_total_cents posted; account := CLOSED when reason == ABANDONED_NONPAYMENT and outstanding invoices := WRITTEN_OFF", "enrollment lifecycle_status -> CLOSED when this was its last live unit"]
  # ---------- operations ----------
  - method: POST
    path: "/cbb/ops/nightly-run"
    description: "Deterministic nightly batch evaluated against the logical clock: kit expiry, screening expiry, reservation confirm-window expiry, excursion escalation, tank maintenance entry/exit, invoice delinquency advance and the account abandonment ladder. Each row advances at most one stage per run; rows are processed in the pinned orders declared in §1.3."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ kits_expired: integer, screenings_expired: integer, reservations_expired: integer, excursions_escalated: integer, tanks_entered_maintenance: integer, tanks_exited_maintenance: integer, invoices_advanced_past_due: integer, invoices_advanced_delinquent: integer, accounts_advanced: integer, units_flagged_pending_abandonment: integer }"
    side_effects: [delinquency_stage_advance, cumulative_excursion_minutes_30d, unit_eligibility_determination, account_balance_reconciliation, "DISPATCHED / HELD kits past expires_at := EXPIRED", "COMPLETED screenings past valid_until := EXPIRED and their units := INDETERMINATE with reason SCREENING_EXPIRED", "PENDING_CONFIRMATORY reservations past the 72-hour window := EXPIRED", "OPEN excursions past MAX_ACK_MINUTES := ESCALATED", "tanks entering / leaving their maintenance window", "invoice and account delinquency ladder with late fees", "PRIVATE_STORED units of a newly DELINQUENT account := PENDING_ABANDONMENT and their PENDING_CONFIRMATORY reservations := DECLINED"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock, which every deadline, expiry and window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["the logical clock is set; no entity is mutated and no cascade fires until the next business call or nightly run"]

errors:
  # ---- authentication and authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the ten declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not in the addressed endpoint's allowed-role set"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a ParentGuardian addressed an enrollment (or a row reachable from it) that is not its own, or a TransplantCenter addressed a reservation it did not create"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the MedicalDirector determining eligibility also performed the unit's POST_PROCESSING quality test, or the MedicalDirector releasing the unit is the one who determined its eligibility"
  # ---- request shape ----
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "malformed body, missing required field, undeclared enum member, numeric value outside its declared range, or non-RFC3339 timestamp"
  # ---- existence ----
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "no Enrollment matches the supplied path or body enrollment_id"
  - id: ERR_STORAGE_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no StorageAccount matches the supplied path or body account_id"
  - id: ERR_KIT_NOT_FOUND
    http: 404
    condition: "no CollectionKit matches the supplied path or body kit_id"
  - id: ERR_COLLECTION_NOT_FOUND
    http: 404
    condition: "no Collection matches the supplied path or body collection_id"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "no CordBloodUnit matches the supplied path or body unit_id"
  - id: ERR_PROCESSING_RUN_NOT_FOUND
    http: 404
    condition: "no ProcessingRun matches the supplied run_id"
  - id: ERR_QUALITY_TEST_NOT_FOUND
    http: 404
    condition: "no QualityTest matches the supplied test_id or confirmatory_test_id filter value"
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "no MaternalScreening matches the supplied screening_id"
  - id: ERR_TANK_NOT_FOUND
    http: 404
    condition: "no StorageTank matches the supplied path or body tank_id"
  - id: ERR_EXCURSION_NOT_FOUND
    http: 404
    condition: "no TemperatureExcursion matches the supplied excursion_id"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "no RegistryListing matches the supplied listing_id"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "no StorageInvoice matches the supplied invoice_id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no Reservation matches the supplied path or body reservation_id"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not equal the addressed CordBloodUnit's current version at POST /cbb/reservations or POST /cbb/registry-listings"
  # ---- state preconditions ----
  - id: ERR_INVALID_ENROLLMENT_STATE
    http: 409
    condition: "the enrollment's lifecycle_status or consent_status does not admit the requested transition (e.g. consenting a WITHDRAWN enrollment, amending a consent that is still PENDING)"
  - id: ERR_INVALID_KIT_STATE
    http: 409
    condition: "the kit is not DISPATCHED when a collection is recorded against it (HELD, USED, EXPIRED or RETURNED)"
  - id: ERR_INVALID_COLLECTION_STATE
    http: 409
    condition: "the collection is not COLLECTED when receipt or rejection is attempted"
  - id: ERR_INVALID_UNIT_STATE
    http: 409
    condition: "the unit's processing_status or availability_status does not admit the requested transition (e.g. cryopreserving a RECEIVED unit, reserving a QUARANTINED or PENDING_ABANDONMENT unit, disposing an already DISPOSED unit)"
  - id: ERR_INVALID_RUN_STATE
    http: 409
    condition: "the processing run is not IN_PROGRESS when completion is attempted"
  - id: ERR_INVALID_EXCURSION_STATE
    http: 409
    condition: "the excursion is not OPEN or ESCALATED at acknowledge time, or not ACKNOWLEDGED or ESCALATED at resolve time"
  - id: ERR_INVALID_RESERVATION_STATE
    http: 409
    condition: "the reservation is not PENDING_CONFIRMATORY at confirm/decline time, or not CONFIRMED at release/cancel time"
  - id: ERR_INVALID_INVOICE_STATE
    http: 409
    condition: "a payment was posted against an invoice in status PAID, VOID or WRITTEN_OFF"
  # ---- consent ----
  - id: ERR_INVALID_LISTING_STATE
    http: 409
    condition: "the addressed RegistryListing is not in a state that admits the requested action (suspending a listing that is not ACTIVE, or resuming a listing that is not SUSPENDED or whose suspension_reason_code is not REGISTRY_HOLD)"
  - id: ERR_CONSENT_NOT_CURRENT
    http: 409
    condition: "the owning enrollment's consent_status is not CONSENTED (PENDING, AMENDMENT_PENDING or REVOKED) when a downstream operation is attempted"
  - id: ERR_CONSENT_AMENDMENT_LIMIT
    http: 409
    condition: "a new consent amendment was requested while consent_amendment_count already equals MAX_CONSENT_AMENDMENTS (3)"
  # ---- maternal screening and safety ----
  - id: ERR_MATERNAL_SCREENING_INCOMPLETE
    http: 409
    condition: "the enrollment has no MaternalScreening in status COMPLETED with a valid_until in the future"
  - id: ERR_MATERNAL_SCREENING_REACTIVE
    http: 422
    condition: "the governing COMPLETED MaternalScreening has overall_result REACTIVE"
  - id: ERR_STERILITY_POSITIVE
    http: 422
    condition: "the unit's POST_PROCESSING quality test recorded sterility_result POSITIVE or PENDING"
  - id: ERR_NO_QUALITY_TEST
    http: 409
    condition: "the unit has no QualityTest with test_kind POST_PROCESSING (empty input set for the acceptance score)"
  - id: ERR_CONFIRMATORY_TEST_REQUIRED
    http: 409
    condition: "release was attempted while the reservation's confirmatory_test_id is null"
  - id: ERR_UNIT_NOT_ELIGIBLE
    http: 409
    condition: "the unit's eligibility_status is PENDING, INELIGIBLE or INDETERMINATE when reservation, listing or release is attempted"
  - id: ERR_DOSE_BELOW_MINIMUM
    http: 422
    condition: "post_thaw_dose_x1e7_per_kg is below MIN_RELEASE_DOSE_X1E7 (2.50) at release"
  - id: ERR_QUALITY_BELOW_PUBLIC_THRESHOLD
    http: 422
    condition: "a public listing was attempted with tnc below 900 million, cd34 below 1500 thousand, or viability below 85.0 percent"
  # ---- constraints and uniqueness ----
  - id: ERR_PROGRAM_TYPE_MISMATCH
    http: 422
    condition: "a PRIVATE_FAMILY unit was offered for registry listing, a StorageAccount was opened on a PUBLIC_DONATION enrollment, or an invoice was issued for an account whose unit is PUBLIC_DONATION"
  - id: ERR_DUPLICATE_STORAGE_ACCOUNT
    http: 409
    condition: "the enrollment already owns a StorageAccount"
  - id: ERR_DUPLICATE_ACTIVE_LISTING
    http: 409
    condition: "the unit already has a RegistryListing in status ACTIVE or SUSPENDED"
  - id: ERR_KIT_EXPIRED
    http: 409
    condition: "the kit's expires_at is in the past at collection or at receipt"
  # ---- temporal ----
  - id: ERR_PROCESSING_WINDOW_EXCEEDED
    http: 422
    condition: "the exact elapsed hours from collected_at to receipt exceed MAX_HOURS_COLLECTION_TO_RECEIPT (48.0); exactly 48.0 is accepted"
  - id: ERR_TRANSPORT_TEMP_OUT_OF_RANGE
    http: 422
    condition: "transport_temp_c falls outside the closed range [2.0, 30.0]"
  - id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http: 409
    condition: "freeze_at falls inside the tank's half-open maintenance window [start, end); freeze_at == end is accepted, freeze_at == start is not"
  - id: ERR_HOLD_WINDOW_CONFLICT
    http: 409
    condition: "the requested hold, widened by RESERVATION_HOLD_BUFFER_HOURS (24) on each side, touches an incumbent PENDING_CONFIRMATORY or CONFIRMED hold on the same unit; a gap of exactly 24 hours is accepted"
  - id: ERR_CONFIRMATION_WINDOW_EXPIRED
    http: 409
    condition: "confirm was attempted more than CONFIRM_WINDOW_HOURS (72) after the reservation was created"
  # ---- capacity and facility ----
  - id: ERR_TANK_CAPACITY_EXCEEDED
    http: 409
    condition: "the target tank's occupied_slots already equals or exceeds capacity_slots"
  - id: ERR_TANK_NOT_OPERATIONAL
    http: 409
    condition: "the target tank's status is ALARM, OFFLINE or MAINTENANCE at cryopreservation, or the holding tank is not ONLINE (ALARM, MAINTENANCE or OFFLINE) at release"
  - id: ERR_EXCURSION_LIMIT_EXCEEDED
    http: 409
    condition: "the tank's cumulative_excursion_minutes_30d exceeds CUMULATIVE_EXCURSION_LIMIT_MINUTES (120); exactly 120 is still admissible"
  # ---- fiscal ----
  - id: ERR_ACCOUNT_DELINQUENT
    http: 402
    condition: "the unit's StorageAccount is DELINQUENT, ABANDONMENT_NOTICE or ABANDONED when a reservation or listing is attempted"
  - id: ERR_OUTSTANDING_BALANCE
    http: 402
    condition: "the unit's StorageAccount has a non-zero balance_cents at release"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "a payment's amount_cents exceeds the invoice residual (amount_due_cents - amount_paid_cents)"

roles:
  - name: IntakeCoordinator
    description: "Bank-side intake staff: registers expectant parents, captures consent on their behalf, dispatches collection kits and files maternal panels."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/enrollments", "POST /cbb/collection-kits"]
    shared_operations: ["POST /cbb/enrollments/{id}/consent", "POST /cbb/enrollments/{id}/consent-amendment", "POST /cbb/enrollments/{id}/withdraw", "POST /cbb/maternal-screenings", "GET /cbb/enrollments", "GET /cbb/enrollments/{id}", "GET /cbb/enrollments/{id}/collection-kits", "GET /cbb/enrollments/{id}/maternal-screenings", "GET /cbb/collection-kits/{id}", "GET /cbb/maternal-screenings/{id}"]
  - name: ParentGuardian
    description: "The enrolling parent. X-User-ID is the Enrollment id, and every read or write is scoped to that enrollment and the rows reachable from it."
    identity: "entity_backed:Enrollment"
    exclusive_operations: []
    shared_operations: ["POST /cbb/enrollments/{id}/consent", "POST /cbb/enrollments/{id}/consent-amendment", "POST /cbb/enrollments/{id}/withdraw", "POST /cbb/storage-invoices/{id}/payments", "GET /cbb/enrollments/{id}", "GET /cbb/enrollments/{id}/storage-accounts", "GET /cbb/enrollments/{id}/collection-kits", "GET /cbb/enrollments/{id}/maternal-screenings", "GET /cbb/storage-accounts/{id}", "GET /cbb/storage-accounts/{id}/units", "GET /cbb/storage-accounts/{id}/storage-invoices", "GET /cbb/storage-invoices/{id}", "GET /cbb/collection-kits/{id}", "GET /cbb/maternal-screenings/{id}", "GET /cbb/units/{id}"]
  - name: CollectionSite
    description: "Delivery-suite staff who record the collection event at birth; cannot receive, process or judge the unit."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/collections"]
    shared_operations: ["GET /cbb/collections/{id}", "GET /cbb/collection-kits/{id}", "GET /cbb/collection-kits/{id}/collections", "GET /cbb/enrollments/{id}/collection-kits"]
  - name: ProcessingTechnologist
    description: "Laboratory technologist: receives or rejects collections, runs volume reduction, records quality tests and cryopreserves units. Never determines eligibility or releases."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/collections/{id}/receive", "POST /cbb/processing-runs", "POST /cbb/processing-runs/{id}/complete", "POST /cbb/quality-tests", "POST /cbb/units/{id}/cryopreserve"]
    shared_operations: ["POST /cbb/collections/{id}/reject", "GET /cbb/collections/{id}", "GET /cbb/collections/{id}/units", "GET /cbb/units/{id}", "GET /cbb/units/{id}/processing-runs", "GET /cbb/units/{id}/quality-tests", "GET /cbb/processing-runs/{id}", "GET /cbb/quality-tests/{id}", "GET /cbb/storage-tanks", "GET /cbb/storage-tanks/{id}", "GET /cbb/storage-tanks/{id}/units"]
  - name: MedicalDirector
    description: "Medical authority: determines eligibility, releases units for transplant, disposes units and adjudicates excursion dispositions. Segregation of duties forbids the same director from both determining and releasing a given unit, and forbids the tester from determining."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/units/{id}/eligibility-determination", "POST /cbb/reservations/{id}/release", "POST /cbb/units/{id}/dispose", "PATCH /cbb/maternal-screenings/{id}"]
    shared_operations: ["POST /cbb/collections/{id}/reject", "POST /cbb/maternal-screenings", "POST /cbb/temperature-excursions/{id}/resolve", "GET /cbb/units/search", "GET /cbb/units/{id}", "GET /cbb/units/{id}/quality-tests", "GET /cbb/units/{id}/registry-listings", "GET /cbb/reservations", "GET /cbb/reservations/{id}", "GET /cbb/reservations/{id}/release-summary", "GET /cbb/enrollments/{id}/maternal-screenings", "GET /cbb/storage-tanks/{id}", "GET /cbb/storage-tanks/{id}/temperature-excursions", "GET /cbb/temperature-excursions/{id}"]
  - name: RegistryOperator
    description: "Public-registry desk: publishes eligible public-donation units and monitors listing status. Cannot touch private billing or medical decisions."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/registry-listings", "POST /cbb/registry-listings/{id}/suspend", "POST /cbb/registry-listings/{id}/resume"]
    shared_operations: ["GET /cbb/registry-listings/{id}", "GET /cbb/units/{id}/registry-listings", "GET /cbb/units/search", "GET /cbb/units/{id}", "GET /cbb/reservations", "GET /cbb/reservations/{id}"]
  - name: TransplantCenter
    description: "External transplant centre: searches, holds, confirms, declines and cancels reservations for its own patients. X-User-ID is an opaque centre identifier recorded on the reservation as requesting_center_user_id."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/reservations", "POST /cbb/reservations/{id}/confirm", "POST /cbb/reservations/{id}/decline", "POST /cbb/reservations/{id}/cancel"]
    shared_operations: ["GET /cbb/units/search", "GET /cbb/units/{id}", "GET /cbb/units/{id}/quality-tests", "GET /cbb/quality-tests/{id}", "GET /cbb/registry-listings/{id}", "GET /cbb/reservations", "GET /cbb/reservations/{id}", "GET /cbb/reservations/{id}/release-summary"]
  - name: BillingAdministrator
    description: "Private-storage billing desk: opens accounts, issues invoices and posts payments. Cannot make medical or registry decisions."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/storage-accounts", "POST /cbb/storage-invoices"]
    shared_operations: ["POST /cbb/storage-invoices/{id}/payments", "GET /cbb/enrollments", "GET /cbb/enrollments/{id}", "GET /cbb/enrollments/{id}/storage-accounts", "GET /cbb/storage-accounts/{id}", "GET /cbb/storage-accounts/{id}/units", "GET /cbb/storage-accounts/{id}/storage-invoices", "GET /cbb/storage-invoices/{id}", "GET /cbb/units/{id}"]
  - name: FacilitiesEngineer
    description: "Cryogenic facilities engineer: commissions tanks, posts temperature readings and acknowledges excursions. May resolve an excursion only jointly with the medical director's disposition authority (shared operation)."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/storage-tanks", "POST /cbb/storage-tanks/{id}/temperature-readings", "POST /cbb/temperature-excursions/{id}/acknowledge"]
    shared_operations: ["POST /cbb/temperature-excursions/{id}/resolve", "GET /cbb/storage-tanks", "GET /cbb/storage-tanks/{id}", "GET /cbb/storage-tanks/{id}/units", "GET /cbb/storage-tanks/{id}/temperature-excursions", "GET /cbb/temperature-excursions/{id}"]
  - name: PlatformAdmin
    description: "Operator of record. May call every business endpoint plus the nightly batch and the logical-clock test-driving endpoint; still bound by every state, safety and segregation-of-duties rule."
    identity: "opaque"
    exclusive_operations: ["POST /cbb/ops/nightly-run", "POST /_clock/set_current_utc"]
    shared_operations: ["every other endpoint declared in §1.5"]
