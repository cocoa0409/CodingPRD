  # =======================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: packaging_complete_cascades_batch_to_tank_to_license
        grounds:
          - state_machines.PackagingRun.SCHEDULED_to_COMPLETED
          - state_machines.FermentationBatch.READY_to_PACKAGED
          - state_machines.Tank
          - entities.LicensePermit.fields.volume_used_liters
        distinguishing_aspect: |
          Depth-3 chain rooted at POST /packaging-runs/{id}/complete:
          (1) PackagingRun COMPLETED -> FermentationBatch.volume_liters
          decremented (mutation on B); (2) when that decrement reaches 0,
          FermentationBatch auto-transitions READY->PACKAGED (mutation on C
          caused by B's mutation, not the original action); (3) PACKAGED
          triggers Tank.status -> EMPTY and Tank.current_batch_id=null
          (mutation on D caused by C). Separately LicensePermit.
          volume_used_liters is incremented (ledger sync).
        test_recipe:
          setup:
            - "fb6 READY in tank t6 with volume=50 L (small so single run drains)"
            - "pr6 SCHEDULED drawing all 50 L"
            - "lic6 NY_FARM_CIDERY ACTIVE cap=100000, used=0"
