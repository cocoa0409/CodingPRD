            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 40, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ob: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ob}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { obv: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ob}/allocate", payload: { quantity: 40, expected_order_version: "${obv}" }, as: FarmManager }
