        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[checkout-stale-order]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "After a line is added (Order.version advances), a checkout carrying the pre-add expected_order_version is rejected with ERR_STALE_ORDER_VERSION (412)."
        test_recipe:
          setup: ["a CART order; capture version v0 BEFORE adding a line, then add a line so version advances to v0+1"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "occ@x.com", full_name: "Occ" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WOCC", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "OCCP", title: "OCCP", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id, v0: $.data.version }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${v0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "response.data.error_id == ERR_STALE_ORDER_VERSION  # v0 is stale after the add-line bumped version"

      - name: occ_stale_return_version_on_approve_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[approve-stale-return]", "errors[ERR_STALE_RETURN_VERSION]"]
        distinguishing_aspect: "Approving a ReturnAuthorization with a stale expected_return_version (one below its current version) returns ERR_STALE_RETURN_VERSION (412)."
        test_recipe:
          setup: ["a REQUESTED RMA; capture its version v then approve with v-1 (deliberate stale)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "occr@x.com", full_name: "OccR" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WOCR", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "OCRP", title: "OCRP", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ol_id: $.data.id }
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
            - call: "GET /order-lines/${ol_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res_id}", qty: 1 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOperator
            - call: "POST /orders/${ord_id}/returns"
              payload: { reason: "NO_LONGER_WANTED", resolution: "REFUND", lines: [{ order_line_id: "${ol_id}", return_qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_id: $.data.id, rma_v: $.data.version }
          trigger:
            - call: "POST /returns/${rma_id}/approve"
              payload: { expected_return_version: "${rma_v} - 1" }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412"
            - "response.data.error_id == ERR_STALE_RETURN_VERSION  # rma_v - 1 is a stale version"

      - name: version_increments_on_every_order_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Order.fields.version]
        distinguishing_aspect: "Each successful mutation (add line, checkout, capture) increments Order.version by exactly 1: created v1 → +line v2 → checkout v3 → capture v4."
        test_recipe:
          setup: ["a fresh order put through add-line, checkout, capture"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "vi@x.com", full_name: "Vi" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WVI", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "VIP", title: "VIP", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id, v_created: $.data.version }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v_after_line: $.data.version }
          trigger:
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${v_after_line}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v_after_checkout: $.data.version }
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
              captures: { v_after_capture: $.data.version }
          assert:
            - "v_created == 1; v_after_line == 2; v_after_checkout == 3; v_after_capture == 4"

      - name: cascade_ship_chain_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Shipment]
        excluded_because:
          difficulty_instance: transitive_cascade / ship_cascades_reservation_commit_to_inventory_to_fulfillment_depth3
          rationale: "The §1.8 instance already verifies the 3-level ship cascade end to end."

      - name: derived_store_credit_reconciliation_after_settle
        claim_type: derived_field_reconciliation
        grounds: [entities.Customer.fields.store_credit_cents]
        excluded_because:
          difficulty_instance: transitive_cascade / settle_store_credit_cascades_refund_to_ledger_to_customer_balance_depth3
          rationale: "The §1.8 cascade asserts Customer.store_credit_cents reconciles to 2968 after a STORE_CREDIT settle."

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_checkout_totals_in_same_response
        claim_type: immediate
        grounds: [calculations.order_totals, entities.Order.fields.grand_total_cents]
        distinguishing_aspect: "Checkout's own 200 response already carries the recomputed grand_total_cents (immediate consistency), no re-read needed."
        test_recipe:
          setup: ["a single-line cart unit 3000 qty1 tax0 promo0"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "im@x.com", full_name: "Im" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "WIM", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "IMP", title: "IMP", unit_price_cents: 3000, tax_rate_bps: 0, return_window_days: 30 }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", promo_flat_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { grand: $.data.grand_total_cents, ship: $.data.shipping_fee_cents }
          assert:
            - "checkout response Order.grand_total_cents == 3999  # subtotal 3000 < 5000 → standard ship 999; tax 0"
            - "Order.${ord_id}.shipping_fee_cents == 999"
