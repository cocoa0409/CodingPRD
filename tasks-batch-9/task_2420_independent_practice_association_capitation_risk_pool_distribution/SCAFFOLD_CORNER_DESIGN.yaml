            - "the replay with expected_physician_version 3 returns HTTP 412 with ${err_stale_phys} == \"ERR_STALE_PHYSICIAN_VERSION\" (not ERR_STALE_ENROLLEE_VERSION, and not a 409 duplicate)"
            - "${sc_x2a_status_after_reject} == \"DRAFT\" — the rejected create superseded nothing"
            - "the retry with expected_physician_version 4 returns 201, ${sc_x2a_status_final} == \"SUPERSEDED\" and ${p_x2_v5} == 5"

      - name: stop_loss_attachment_is_cumulative_across_claims_and_resets_on_void
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.stop_loss_recovery
          - validations.priority_26_ERR_STOP_LOSS_NOT_ATTACHED
          - state_machines.DownstreamClaim.PAID_to_VOIDED
        distinguishing_aspect: |
          The attachment is a *cumulative* threshold over the enrollee's PAID
          claims in one pool, not a per-claim threshold. Two claims of 6000 and
          5000 against an attachment of 10000 each sit below the line, yet the
          second one pierces it: the recovery attempted after claim A alone must
          be rejected with ERR_STOP_LOSS_NOT_ATTACHED, and the one attempted
          after claim B must compute excess 1000 -> recovery 900. Voiding claim B
          walks the accumulator back down and re-arms the gate, so a third
          attempt is rejected again — an implementation that latches
          "attachment pierced" as a one-way flag fails the reset half.
        test_recipe:
          setup:
            - "Agreement AGR_X4 (stop_loss_attachment_cents 10000, reinsurance_recovery_bps 9000) ACTIVE with a PROFESSIONAL 2026 pool, one ACTIVE physician and one assigned enrollee."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Cumulative Attachment Health", payer_tax_id: "94-3000084", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 10000, institutional_pool_share_bps: 0, quality_withhold_bps: 0, stop_loss_attachment_cents: 10000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_x4: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_x4}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_x4}/risk-pools"
              payload: { pool_type: "PROFESSIONAL", pool_year_start: "2026-01-01T00:00:00Z", pool_year_end: "2026-12-31T23:59:59Z" }
              as: IpaAdmin
              captures: { pool_x4: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_x4}/physicians"
              payload: { npi: "6500000001", full_name: "Dr Cumulative", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_x4: "$.data.id" }
            - call: "POST /ipa/physicians/${p_x4}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_x4}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_x4}/enrollees"
              payload: { external_member_id: "X4-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_x4: "$.data.id", e_x4_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_x4}", physician_id: "${p_x4}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_x4_v}" }
              as: NetworkManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_x4}", enrollee_id: "${e_x4}", attributed_physician_id: "${p_x4}", pool_type: "PROFESSIONAL", downstream_provider_name: "Cumulative Clinic", billed_cents: 6000, service_date: "2026-07-10T00:00:00Z" }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
              captures: { clm_x4a: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_x4a}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 6000 }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
            - call: "POST /ipa/downstream-claims/${clm_x4a}/state"
              payload: { to_state: "PAID" }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
            - call: "POST /ipa/stop-loss-recoveries"
              payload: { pool_id: "${pool_x4}", enrollee_id: "${e_x4}" }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
              captures: { err_below: "$.data.error_id" }
            - call: "POST /ipa/downstream-claims"
              payload: { agreement_id: "${agr_x4}", enrollee_id: "${e_x4}", attributed_physician_id: "${p_x4}", pool_type: "PROFESSIONAL", downstream_provider_name: "Cumulative Clinic", billed_cents: 5000, service_date: "2026-07-20T00:00:00Z" }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
              captures: { clm_x4b: "$.data.id" }
            - call: "POST /ipa/downstream-claims/${clm_x4b}/state"
              payload: { to_state: "ADJUDICATED_APPROVED", allowed_cents: 5000 }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
            - call: "POST /ipa/downstream-claims/${clm_x4b}/state"
              payload: { to_state: "PAID" }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
            - call: "GET /ipa/enrollees/${e_x4}"
              as: ClaimsExaminer
              captures: { e_x4_cum: "$.data.cumulative_paid_claims_cents" }
            - call: "GET /ipa/risk-pools/${pool_x4}"
              as: ClaimsExaminer
              captures: { pool_x4_eligible: "$.data.stop_loss_eligible_enrollee_count" }
            - call: "POST /ipa/stop-loss-recoveries"
              payload: { pool_id: "${pool_x4}", enrollee_id: "${e_x4}" }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
              captures: { rec_x4_attachment: "$.data.attachment_cents", rec_x4_eligible: "$.data.eligible_paid_cents", rec_x4_excess: "$.data.excess_cents", rec_x4_recovery: "$.data.recovery_cents" }
            - call: "POST /ipa/downstream-claims/${clm_x4b}/state"
              payload: { to_state: "VOIDED" }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
            - call: "GET /ipa/enrollees/${e_x4}"
              as: ClaimsExaminer
              captures: { e_x4_cum_after_void: "$.data.cumulative_paid_claims_cents" }
            - call: "GET /ipa/risk-pools/${pool_x4}"
              as: ClaimsExaminer
              captures: { pool_x4_eligible_after_void: "$.data.stop_loss_eligible_enrollee_count", pool_x4_paid_after_void: "$.data.paid_claims_cents" }
            - call: "POST /ipa/stop-loss-recoveries"
              payload: { pool_id: "${pool_x4}", enrollee_id: "${e_x4}" }
              as: ClaimsExaminer
              as_user_id: "user-claims-x4"
              captures: { err_after_void: "$.data.error_id" }
          assert:
            - "${err_below} == \"ERR_STOP_LOSS_NOT_ATTACHED\" with HTTP 422 — 6000 alone is below the 10000 attachment"
            - "${e_x4_cum} == 11000 and ${pool_x4_eligible} == 1 — the second PAID claim pierces the attachment for the first time"
            - "${rec_x4_attachment} == 10000, ${rec_x4_eligible} == 11000, ${rec_x4_excess} == 1000, ${rec_x4_recovery} == 900 (1000 * 9000 / 10000)"
            - "${e_x4_cum_after_void} == 6000, ${pool_x4_paid_after_void} == 6000 and ${pool_x4_eligible_after_void} == 0 — the void recomputes, it does not latch"
            - "${err_after_void} == \"ERR_STOP_LOSS_NOT_ATTACHED\" — the threshold gate is re-armed after the accumulator falls back below it"

      - name: deficit_flag_threshold_is_evaluated_strictly_above_9500_bps
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: pool_deficit_flag_strict_greater_at_9500_bps
          rationale: |
            The instantaneous-threshold half of this layer is the deficit gate,
            and the §1.8 boundary_precision_check instance already walks
            loss_ratio_bps to 9499 / 9500 / 9501 and asserts deficit_flag false /
            false / true together with the capitation_posture consequence. A
            corner duplicate would re-run the same three-point walk.

      - name: five_level_funding_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: enrollment_file_post_funding_cascade_depth_five
          rationale: |
            The deepest chain in the scaffold (file POSTED -> remittance ->
            agreement accrual and withheld balance -> pool funding and member
            months -> enrollee net_pmpm ledger) is exactly the §1.8
            transitive_cascade instance, which asserts every level including the
            two that no direct request touches. Repeating it as a corner claim
            adds no coverage.

      - name: ledger_cascade_is_order_sensitive_and_survives_a_reversal
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: claim_payment_ledger_cascade_depth_four
          rationale: |
            The ordering-sensitivity and partial-reversal aspects of the claim
            payment chain (paid_cents -> pool paid ledger -> loss ratio ->
            deficit flag -> posture) are the substance of the §1.8
            transitive_cascade instance for claims, which also checks that the
            VOIDED compensation unwinds every level in reverse.

      - name: both_capitation_reconciliation_variants_are_exercised_on_one_roster
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: capitation_reconciliation_variant_divergence_on_remittance
          rationale: |
            §1.8's dual_variant_calc instance already posts the same roster under
            ROSTER_SNAPSHOT and MEMBER_MONTH_PRORATION agreements and asserts the
            divergent expected_capitation_cents plus the resulting variance sign
            flip, which is precisely this layer's claim.

      - name: both_ibnr_variants_are_exercised_on_one_paid_triangle
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: ibnr_reserve_variant_divergence_on_risk_pool
          rationale: |
            The second dual-variant rule is covered by the §1.8 instance that
            reserves the same pool under COMPLETION_FACTOR and PMPM_LOSS_RATIO
            and asserts both reserve amounts and the delta between them.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: created_row_is_fully_computed_in_its_own_response_and_immediately_listable
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.member_pmpm_components
          - endpoints.GET_/ipa/enrollees
        distinguishing_aspect: |
          Under an immediate consistency model the create response must already
          carry the computed PMPM components (gross 20000, withhold 1400, net
          18600 at a 700 bps withhold) rather than zeros that a later job fills
          in, and the list read issued in the very next request must already show
          both rows with total_count 2, has_more false and created_at ASC order.
          An implementation that computes derived fields lazily on first GET, or
          whose list index lags the write, fails here even though a delayed
          re-read would pass.
        test_recipe:
          setup:
            - "Agreement AGR_X5 ACTIVE with quality_withhold_bps 700 and no enrollees."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Immediate Health", payer_tax_id: "94-3000085", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_x5: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_x5}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
          trigger:
            - call: "POST /ipa/delegation-agreements/${agr_x5}/enrollees"
              payload: { external_member_id: "X5-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_x5a: "$.data.id", e_x5a_gross: "$.data.gross_pmpm_cents", e_x5a_withhold: "$.data.withhold_cents", e_x5a_net: "$.data.net_pmpm_cents", e_x5a_cum: "$.data.cumulative_paid_claims_cents" }
            - call: "GET /ipa/enrollees"
              payload: { agreement_id: "${agr_x5}", limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { list1_first_id: "$.data[0].id" }
            - call: "POST /ipa/delegation-agreements/${agr_x5}/enrollees"
              payload: { external_member_id: "X5-0002", age_band: "SENIOR", benefit_tier: "POS", risk_score_bps: 12000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_x5b: "$.data.id", e_x5b_gross: "$.data.gross_pmpm_cents", e_x5b_net: "$.data.net_pmpm_cents" }
            - call: "GET /ipa/enrollees"
              payload: { agreement_id: "${agr_x5}", limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { list2_first_id: "$.data[0].id", list2_second_id: "$.data[1].id" }
            - call: "GET /ipa/enrollees"
              payload: { agreement_id: "${agr_x5}", age_band: "SENIOR", limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { list3_first_id: "$.data[0].id" }
          assert:
            - "${e_x5a_gross} == 20000, ${e_x5a_withhold} == 1400, ${e_x5a_net} == 18600 and ${e_x5a_cum} == 0 — all computed inside the create response"
            - "${e_x5b_gross} == 36000 (20000 * 14500 / 10000 * 12000 / 10000 = 34800, + 1200 POS add) and ${e_x5b_net} == 33480 (withhold 2520)"
            - "the first list read returns meta pagination total_count 1, has_more false and ${list1_first_id} == \"${e_x5a}\" with no delay or retry"
            - "the second list read returns total_count 2, has_more false, ${list2_first_id} == \"${e_x5a}\" and ${list2_second_id} == \"${e_x5b}\" — created_at ASC"
            - "the filtered read returns total_count 1 and ${list3_first_id} == \"${e_x5b}\""

      - name: pool_ledger_is_readable_immediately_after_the_paying_write
        claim_type: immediate
        excluded_because:
          difficulty_instance: claim_payment_ledger_cascade_depth_four
          rationale: |
            The strongest immediate-consistency claim in this domain is that a
            four-level ledger cascade is fully observable in the reads that
            directly follow the PAID transition. The §1.8 transitive_cascade
            instance asserts exactly that, level by level and with no re-read
            tolerance, so a separate corner instance would restate it.
