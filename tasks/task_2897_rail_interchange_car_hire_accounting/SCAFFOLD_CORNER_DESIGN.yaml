# =============================================================================
# §1.9 Scaffold Corner Design — task_2897_rail_interchange_car_hire_accounting
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7. `section:` values and `claim_type:` values are taken verbatim from
# that guide; nothing is invented. Corners already asserted by a
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance appear as `excluded_because:` stubs.
#
# Reused fixture vocabulary (identical to §1.8):
#   railroads BN "Bear Northern Railway", CX "Coast Express Lines",
#             NS "North Summit RR"
#   car type  XM: PER_DIEM, free_time_hours 4, per_diem_rate_cents 2350,
#             tier2_threshold_days 2, tier2_per_diem_rate_cents 3100,
#             mileage_rate_millicents_per_mile 2350, loaded_mileage_only true
#   car type  HR: HOURLY, free_time_hours 4, hourly_rate_cents 150,
#             mileage_rate_millicents_per_mile 2350, loaded_mileage_only false
#   junction  JCT-CHI (CX, BN)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: railroad_creation_returns_201_with_envelope_and_all_fields
        claim_type: Creation
        grounds:
          - entities.Railroad
          - endpoints.POST_car-hire_railroads
          - response_envelope
        distinguishing_aspect: "POST with only the two required fields returns 201, the success envelope, a server-minted unprefixed UUID id, version 1, and every computed field seeded to its zero value (foreign_car_balance 0, per_diem_exposure_cents 0, owned_car_count 0)."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its server start value 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
          assert:
            - "HTTP 201 and the body is the declared success envelope with a `data` object"
            - "Railroad.${bn_id}.reporting_mark == BN and name == 'Bear Northern Railway'"
            - "Railroad.${bn_id}.status == ACTIVE and per_diem_credit_limit_cents == 100000000"
            - "Railroad.${bn_id}.foreign_car_balance == 0, per_diem_exposure_cents == 0, owned_car_count == 0"
            - "Railroad.${bn_id}.version == 1 and id is a bare UUID with no type prefix"
            - "Railroad.${bn_id}.created_at == 2026-08-01T00:00:00.000Z and updated_at == created_at"

      - name: car_retrieval_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Car
          - endpoints.GET_car-hire_cars_id
        distinguishing_aspect: "GET /car-hire/cars/{car_id} returns exactly what POST stored, including the three state dimensions seeded at creation and current_handling_road_id defaulted from initial_handling_road_id."
        test_recipe:
          setup:
            - "Railroads BN and CX exist; car type XM exists; CX owns car CX 100001 with initial_handling_road_id CX."
          setup_api_calls:
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
          trigger:
            - call: "GET /car-hire/cars/${car_id}"
              payload: {}
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { echoed_id: "$.data.id" }
          assert:
            - "HTTP 200 and echoed_id == ${car_id}"
            - "Car.${car_id}.car_mark == 'CX 100001', car_type_id == ${xm_id}, owner_road_id == ${cx_id}, current_handling_road_id == ${cx_id}"
            - "Car.${car_id} == (custody_status ON_HOME_ROAD, mechanical_status SERVICEABLE, routing_status NO_OBLIGATION)"
            - "Car.${car_id}.cumulative_mileage == 0, prescribed_return_junction_id == null, bad_order_since == null, version == 1"

      - name: interchange_events_listing_filters_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_car-hire_interchange-events
          - entities.InterchangeEvent
        distinguishing_aspect: "The list read honours car_id filtering together with limit/offset: three events for one car returned with limit 2 give 2 rows on the first page and 1 on the second, ordered by interchange_at ASC, and a total_count of 3 independent of the page."
        test_recipe:
          setup:
            - "Railroads BN and CX; car type XM; junction JCT-CHI; two CX-owned cars."
            - "Car 1 has two events (delivery to BN at 2026-08-24T00:00:00Z and return at 2026-08-26T00:00:00Z) and one further delivery at 2026-08-27T00:00:00Z; car 2 has one event, which must not appear in the filtered read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-27T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car1_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100002", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car2_id: "$.data.id" }
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car1_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-24T00:00:00Z", odometer_miles: 100, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car1_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-26T00:00:00Z", odometer_miles: 200, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car1_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-27T00:00:00Z", odometer_miles: 260, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car2_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-25T00:00:00Z", odometer_miles: 50, load_status: "EMPTY" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
          trigger:
            - call: "GET /car-hire/interchange-events?car_id=${car1_id}&limit=2&offset=0"
              payload: {}
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /car-hire/interchange-events?car_id=${car1_id}&limit=2&offset=2"
              payload: {}
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "page 1 returns exactly 2 rows with total_count 3 and has_more true"
            - "page 2 returns exactly 1 row with total_count 3 and has_more false"
            - "the three rows across both pages are ordered by interchange_at ASC: 2026-08-24T00:00:00Z, 2026-08-26T00:00:00Z, 2026-08-27T00:00:00Z"
            - "page1_first_id is the 2026-08-24T00:00:00Z event and page2_first_id is the 2026-08-27T00:00:00Z event"
            - "car 2's 2026-08-25T00:00:00Z event appears on neither page"

      - name: car_get_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_CAR_NOT_FOUND
          - validations.priority_5_path_not_found
          - endpoints.GET_car-hire_cars_id
        distinguishing_aspect: "A syntactically valid but unused UUID in the path yields 404 ERR_CAR_NOT_FOUND with the error envelope, not 200 with a null body and not 400."
        test_recipe:
          setup:
            - "Railroads BN and CX and car type XM exist so the request is fully authorised; no Car row has the probed id."
          setup_api_calls:
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
          trigger:
            - call: "GET /car-hire/cars/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and err == ERR_CAR_NOT_FOUND"
            - "the response body is the declared error envelope carrying error_id and message"

      - name: interchange_event_missing_required_load_status_rejected
        claim_type: Required Fields
        grounds:
          - validations.priority_6_ERR_INVALID_REQUEST
          - endpoints.POST_car-hire_interchange-events
          - entities.InterchangeEvent.fields.load_status
        distinguishing_aspect: "load_status has source input with no default, so omitting it returns 400 ERR_INVALID_REQUEST at priority 6 — before any referential (priority 8) or business (priority 17+) rule can be evaluated, and no InterchangeEvent row is created."
        test_recipe:
          setup:
            - "Railroads BN and CX; car type XM; junction JCT-CHI; one CX-owned car; the clock reads 2026-08-24T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-24T00:00:00Z", odometer_miles: 100 }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and err == ERR_INVALID_REQUEST"
            - "GET /car-hire/interchange-events?car_id=${car_id} returns 0 rows"
            - "Car.${car_id}.custody_status is still ON_HOME_ROAD"

      - name: railroad_created_without_optional_fields_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Railroad.fields.status
          - entities.Railroad.fields.per_diem_credit_limit_cents
          - global_constants.DEFAULT_PER_DIEM_CREDIT_LIMIT_CENTS
        distinguishing_aspect: "Omitting the two optional inputs yields status ACTIVE and per_diem_credit_limit_cents 100000000; supplying them explicitly overrides both, proving the values are defaults rather than hard-coded."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { default_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines", status: "SUSPENDED", per_diem_credit_limit_cents: 25000 }
              as: ClearinghouseAdmin
              captures: { explicit_id: "$.data.id" }
          assert:
            - "Railroad.${default_id}.status == ACTIVE and per_diem_credit_limit_cents == 100000000"
            - "Railroad.${explicit_id}.status == SUSPENDED and per_diem_credit_limit_cents == 25000"

      - name: movement_money_fields_are_computed_not_accepted_as_input
        claim_type: Computed Fields
        grounds:
          - entities.CarHireMovement.fields.gross_hire_cents
          - calculations.hire_time_component
          - calculations.hire_mileage_component
          - endpoints.POST_car-hire_interchange-events
        distinguishing_aspect: "CarHireMovement has no POST endpoint at all: its rows and every money field appear only as a side effect of interchange capture. A 48.00-hour LOADED segment with 100 miles yields chargeable_hours 44.00, chargeable_days 2, time_component_cents 4700, mileage_component_cents 235 and gross_hire_cents 4935 with no client input anywhere in the chain."
        test_recipe:
          setup:
            - "Railroads BN and CX; car type XM; junction JCT-CHI; CX-owned car delivered to BN at 2026-08-24T00:00:00Z (odometer 1000) and returned at 2026-08-26T00:00:00Z (odometer 1100)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-24T00:00:00Z", odometer_miles: 1000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
          trigger:
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-26T00:00:00Z", odometer_miles: 1100, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "GET /car-hire/hire-movements?car_id=${car_id}&handling_road_id=${bn_id}&status=CLOSED"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { mv_id: "$.data[0].id" }
          assert:
            - "CarHireMovement.${mv_id} == (chargeable_hours 44.00, chargeable_days 2, time_component_cents 4700, mileage_component_cents 235, gross_hire_cents 4935, reclaim_credit_cents 0, reverse_route_penalty_cents 0, net_hire_cents 4935)"
            - "CarHireMovement.${mv_id}.hire_liable == true, start_odometer_miles == 1000, end_odometer_miles == 1100"
            - "no endpoint in §1.5 accepts any of these fields as input"

      - name: car_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Car
          - endpoints.POST_car-hire_cars
          - validations.priority_6_ERR_INVALID_REQUEST
        distinguishing_aspect: "id, created_at, updated_at, version and the three status dimensions are system-sourced; a POST body that also carries id and custody_status is rejected with 400 ERR_INVALID_REQUEST rather than silently honouring or silently dropping the client values."
        test_recipe:
          setup:
            - "Railroad CX and car type XM exist."
          setup_api_calls:
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", id: "11111111-1111-4111-8111-111111111111", custody_status: "ON_FOREIGN_ROAD", version: 9 }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and err == ERR_INVALID_REQUEST"
            - "GET /car-hire/cars?owner_road_id=${cx_id} returns 0 rows"
            - "no Car row exists with id 11111111-1111-4111-8111-111111111111"

      - name: interchange_event_invalid_enum_value_rejected
        claim_type: Type Constraints
        grounds:
          - validations.priority_7_ERR_INVALID_ENUM_VALUE
          - entities.InterchangeEvent.fields.load_status
          - errors.ERR_INVALID_ENUM_VALUE
        distinguishing_aspect: "load_status is constrained to {LOADED, EMPTY}; the value 'PARTIAL' is well-formed JSON of the right type, so it must fail at priority 7 with 422 ERR_INVALID_ENUM_VALUE, distinct from the 400 ERR_INVALID_REQUEST raised when the key is absent altogether."
        test_recipe:
          setup:
            - "Railroads BN and CX; car type XM; junction JCT-CHI; one CX-owned car; the clock reads 2026-08-24T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-24T00:00:00Z", odometer_miles: 100, load_status: "PARTIAL" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 and err == ERR_INVALID_ENUM_VALUE"
            - "GET /car-hire/interchange-events?car_id=${car_id} returns 0 rows"

      - name: interchange_event_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.InterchangeEvent
          - endpoints.GET_car-hire_interchange-events_id
          - state_machines.InterchangeEvent
        distinguishing_aspect: "InterchangeEvent is declared common_fields: false, so the stored row exposes id and created_at but no updated_at and no version, and §1.5 offers no PATCH/PUT/DELETE for it — a mis-logged event can only be replaced through a CorrectionRequest, which supersedes rather than edits."
