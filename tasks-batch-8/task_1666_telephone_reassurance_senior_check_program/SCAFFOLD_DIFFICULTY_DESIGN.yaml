            - { call: "POST /api/participants", payload: { full_name: "P2", date_of_birth: "1950-11-02", phone: "555-2302", address: "2 Bnd Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p2: $.data.id } }
            - { call: "POST /api/participants/${p2}/emergency-contacts", payload: { full_name: "KP2", phone: "555-2303", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p2}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants", payload: { full_name: "P3", date_of_birth: "1950-11-03", phone: "555-2304", address: "3 Bnd Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p3: $.data.id } }
            - { call: "POST /api/participants/${p3}/emergency-contacts", payload: { full_name: "KP3", phone: "555-2305", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p3}/submit-review", payload: {}, as: IntakeWorker }
