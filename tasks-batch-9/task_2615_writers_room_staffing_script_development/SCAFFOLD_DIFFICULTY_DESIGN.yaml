              as: Showrunner
              as_user_id: "${sr}"
          assert:
            - "Trigger call 1 ([2026-09-14, 2026-09-28) overlaps [2026-09-01, 2026-09-15) by one day) returns 409 ERR_WRITER_WINDOW_CONFLICT"
            - "Trigger call 2 ([2026-09-15, 2026-09-29) touches the first seat's end_date) returns 201 with RoomSeat.${s2}.status == OFFERED"
            - "RoomSeat.${s2}.weekly_compensation_cents == 600000 and prorated_commitment_cents == 1200000 (14 days = exactly 2 weeks)"
            - "Trigger call 4 ([2026-09-28, 2026-09-30) overlaps the OFFERED seat ${s2}) returns 409 ERR_WRITER_WINDOW_CONFLICT"
            - "GET /room-seats?writer_id=${w1} returns exactly 2 rows, ${s1} CONFIRMED and ${s2} OFFERED"
            - "AvailabilityWindow.${aw1}.status == CONSUMED with consumed_by_seat_id == ${s1}; AvailabilityWindow.${aw2}.status == OPEN (an offer alone does not consume a window)"
            - "WritersRoom.${rm}.filled_seat_count == 2, confirmed_seat_count == 1, open_seat_count == 1, seat_subtotal_weekly_cents == 600000, weekly_burn_cents == 800000"

      - name: production_unit_shoot_windows_need_a_symmetric_two_day_turnaround_buffer
        grounds:
          - validations.priority_67_business_constraint
          - errors.ERR_PRODUCTION_UNIT_CONFLICT
          - entities.GuildAgreement.fields.turnaround_buffer_days
          - entities.Episode.fields.production_unit
          - entities.Episode.fields.production_start_date
          - entities.Episode.fields.shoot_days
          - endpoints.POST_/seasons/{season_id}/episodes
        distinguishing_aspect: |
          A second temporal resource with different geometry from the seat calendar: the shoot window is
          CLOSED ([start, start + shoot_days - 1 day]) and is expanded by turnaround_buffer_days on BOTH
          sides, and the exclusion applies only within one production_unit. E1 = UNIT_A on 2026-11-02 for
          8 shoot days occupies 11-02..11-09, so 11-11 (exactly end + buffer) still conflicts while 11-12
          does not, a UNIT_B episode on the identical dates is unaffected, and an episode placed BEFORE E1
          (10-25..11-01, whose end + buffer reaches 11-03) conflicts too, proving the check is symmetric
          rather than only forward-looking.
        test_recipe:
          setup:
            - "Agreement AG with turnaround_buffer_days 2; season SE with episode_order 8."
            - "Episode E1 exists: episode_number 1, UNIT_A, production_start_date 2026-11-02, shoot_days 8, so its closed shoot window is 2026-11-02..2026-11-09 and its buffered window is 2026-10-31..2026-11-11."
            - "No room or assignment is needed: this rule is evaluated at episode creation."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Nightfall S1", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, guarantee_application_mode: "FORWARD_COMMIT", staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { se: "$.data.id" }
            - call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 1, length_format: "ONE_HOUR", production_unit: "UNIT_A", production_start_date: "2026-11-02T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep1: "$.data.id" }
          trigger:
            - call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 2, length_format: "ONE_HOUR", production_unit: "UNIT_A", production_start_date: "2026-11-11T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
            - call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 2, length_format: "ONE_HOUR", production_unit: "UNIT_A", production_start_date: "2026-11-12T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep2: "$.data.id" }
            - call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 3, length_format: "ONE_HOUR", production_unit: "UNIT_B", production_start_date: "2026-11-02T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
              captures: { ep3: "$.data.id" }
            - call: "POST /seasons/${se}/episodes"
              payload: { episode_number: 4, length_format: "ONE_HOUR", production_unit: "UNIT_A", production_start_date: "2026-10-25T00:00:00Z", shoot_days: 8 }
              as: StudioExecutive
          assert:
            - "Trigger call 1 returns 409 ERR_PRODUCTION_UNIT_CONFLICT (new.start 2026-11-11 <= existing.end 2026-11-09 + 2 days AND existing.start 2026-11-02 <= new.end 2026-11-18 + 2 days)"
            - "Trigger call 2 returns 201: 2026-11-12 is one day past the buffered edge, and Episode.${ep2}.production_unit == UNIT_A"
            - "Trigger call 3 returns 201 even though its dates are identical to ${ep1}, because the rule is scoped to a single production_unit"
            - "Trigger call 4 returns 409 ERR_PRODUCTION_UNIT_CONFLICT (the new window 2026-10-25..2026-11-01 sits BEFORE ${ep1} and its buffered end 2026-11-03 still reaches existing.start 2026-11-02)"
            - "GET /episodes?season_id=${se} returns exactly 3 rows (${ep1}, ${ep2}, ${ep3}); neither refused call created an episode"
            - "Re-issuing trigger call 2 verbatim now returns 409 ERR_DUPLICATE_EPISODE_NUMBER, not ERR_PRODUCTION_UNIT_CONFLICT (uniqueness at priority 68 is reached before the unit rule at priority 67 is satisfied)"

  - rule_id: compensating_invariant
    instances:
      - name: void_restores_season_committed_fee_and_drives_the_assignment_ledger_sum_to_zero
        grounds:
          - calculations.fee_ledger_conservation
          - calculations.fee_ledger_conservation.formula
          - calculations.guarantee_slot_conservation
          - entities.FeeLedgerEntry.fields.entry_type
          - entities.FeeLedgerEntry.fields.amount_cents
          - entities.Season.fields.script_fee_committed_cents
          - entities.RoomSeat.fields.guarantee_slots_remaining
          - state_machines.ScriptAssignment.transitions.to_VOID
          - state_machines.Episode.script_readiness.transitions.IN_PROGRESS_to_NOT_STARTED
          - endpoints.POST_/script-assignments/{assignment_id}/void
        distinguishing_aspect: |
          Two conserved quantities are checked around one compensating operation on an APPEND-ONLY
          ledger: the money (Season.script_fee_committed_cents must return to the byte-identical 0 it
          held before the create, and the assignment's own signed ledger sum must be exactly 0 across
          three surviving entries) and the guarantee slot COUNT (the seat's guarantee_slots_remaining
          must return to 1, with consumed back to 0). No entry may be deleted or mutated, so a naive
          implementation that "undoes" by removing rows breaks the append-only claim while one that only
          fixes the season total leaves the seat's slot permanently consumed.
