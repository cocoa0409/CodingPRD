              captures: { debt_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T23:59:59Z" }
              as: TreasurySupervisor
          trigger:
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { err_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: TreasurySupervisor
            - call: "POST /debts/${debt_1}/activate"
              payload: {}
              as: CreditorAnalyst
              as_user_id: "${cred_fed}"
              captures: { debt_1_status: $.data.status }
          assert:
            - "at 2026-09-30T23:59:59Z (one second short of 30 days): 409 with error_id == ERR_NOTICE_WINDOW_NOT_ELAPSED"
            - "at exactly 2026-10-01T00:00:00Z (notice_sent_at + 30 days): activation succeeds and Debt.${debt_1}.status == ACTIVE — the boundary is inclusive (>=)"
            - "Debt.${debt_1}.version advanced by exactly 1 across the successful activation (the failed attempt mutated nothing)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: state_debt_activate_requires_agreement
        grounds:
          - state_machines.Debt.NOTICED_to_ACTIVE
          - state_machines.ReciprocalAgreement.DRAFT_to_ACTIVE
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - endpoints.POST /debts/{debtId}/activate
        distinguishing_aspect: "Entity pair Debt x ReciprocalAgreement: a STATE creditor's debt cannot leave NOTICED unless an ACTIVE agreement covering (state_code, FED_TO_STATE scope) spans the current clock; activation fails before the agreement exists and again once the clock reaches its exclusive effective_until. The sibling dependency crosses RefundClaim x Offset."
        test_recipe:
          setup:
