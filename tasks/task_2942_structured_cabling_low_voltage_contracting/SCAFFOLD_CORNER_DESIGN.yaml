          setup:
            - "Project RVT1 with segment PS-P (EMT_CONDUIT, 573.0 sq mm, shared_with_power true, power_separation_mm 25)"
            - "Three cable types: shielded CAT6A d 8.5 (area 56.75), unshielded CAT6A d 7.9 (area 49.02) and OS2_SMF d 2.0 (area 3.14)"
            - "One link per cable type, all in project RVT1"
