  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_offer_cascade_to_cohort_accounting
        grounds:
          - state_machines.Offer.PENDING_to_ACCEPTED
          - state_machines.Application.OFFERED_to_ENROLLED
          - state_machines.AgeCohort.OPEN_to_FULL
          - entities.AgeCohort.fields.filled_slots
        distinguishing_aspect: |
          Depth-3 cascade: accept mutates Offer (->ACCEPTED), which mutates Application (->ENROLLED),
          which creates Enrollment (ACTIVE), which mutates AgeCohort accounting (filled_slots +1,
          reserved_slots -1). Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Application AB OFFERED with a PENDING offer in a funded_slots=2 cohort (reserved 1, filled 0)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { coh_v: "$.data.version" }
          trigger:
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${coh_v}" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { off_status: "$.data.status" }
            - call: "GET /applications/${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { app_status: "$.data.status" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { filled: "$.data.filled_slots", reserved: "$.data.reserved_slots" }
          assert:
            - "${off_status} == \"ACCEPTED\""
            - "${app_status} == \"ENROLLED\""
            - "${filled} == 1"
            - "${reserved} == 0"

      - name: decline_offer_cascade_releases_reservation
        grounds:
          - state_machines.Offer.PENDING_to_DECLINED
          - state_machines.Application.OFFERED_to_WAITLISTED
          - entities.AgeCohort.fields.reserved_slots
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (decline): decline mutates Offer (->DECLINED),
          which mutates Application (->WAITLISTED), which mutates AgeCohort reserved_slots (-1) and
          restores available_slots.
        test_recipe:
          setup:
            - "Application AB OFFERED with a PENDING offer in a funded_slots=2 cohort (reserved 1, available 1)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
          trigger:
            - call: "POST /offers/${offer_id}/decline"
              payload: {}
              as: Family
              as_user_id: "${fam_id}"
              captures: { off_status: "$.data.status" }
            - call: "GET /applications/${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { app_status: "$.data.status" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { reserved: "$.data.reserved_slots", avail: "$.data.available_slots" }
          assert:
            - "${off_status} == \"DECLINED\""
            - "${app_status} == \"WAITLISTED\""
            - "${reserved} == 0"
            - "${avail} == 2"

