# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Window & Fenestration Manufacturing
# All setup chains replay from empty DB against SCAFFOLD.yaml §1.5.
# Standard catalog fixtures used across instances:
#   V200: VINYL, base 1500/ui, min_bill 3.0, max_ui 120, upcharge 40, lead 10/25, frame_w 20
#   A050: ALUMINUM_CLAD, base 1999/ui, min_bill 1.0, max_ui 100, upcharge 33, lead 12/20, frame_w 20
#   GP1: LP2-ARG, 2-pane ALUMINUM, target 95 / min 90, u 0.28, shgc 0.40, 900c/sqft, ig_w 20
#   GP3: LP2-AZ, 2-pane ALUMINUM, target 90 / min 85, u 0.31, shgc 0.23, 700c/sqft, ig_w 20
#   MN rule: u<=0.30, shgc<=0.55, from 2025-01-01 (open-ended)
#   AZ rule: u<=0.32, shgc<=0.25, from 2025-01-01 (open-ended)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: nfrc_provisional_vs_certified_rating_divergence
        grounds:
          - calculations.nfrc_rating
          - entities.EnergyLabel.fields.basis
          - state_machines.EnergyLabel.PROVISIONAL_to_CERTIFIED
        distinguishing_aspect: |
          EnergyLabel domain dual variant: identical window data rated twice —
          PROVISIONAL (catalog 0.28) vs CERTIFIED (worst-unit measured argon
          derate: 0.28 + (95-90)*0.002 + 0.01 = 0.30). Same inputs, two valid
          bases, different U-factors; the warranty_coverage instance carries
          the second entity domain for this rule.
        test_recipe:
          setup:
            - "MN rule, V200, GP1, dealer MN; order 2026-08-02 with one RECTANGLE 40x60 qty2 GP1 line"
            - "Label PROVISIONAL with u_factor 0.28 at line creation"
            - "Order released to wave W (cap 10/500, 2026-09-01), wave released, both IG units GAS_FILLED"
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 2, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { line: $.data.id } }
            - { call: "GET /fenestration/order-lines/${line}/energy-label", as: PlantManager, captures: { prov_u: $.data.0.u_factor } }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { wave: $.data.id } }
            - { call: "POST /fenestration/production-waves/${wave}/open", as: ProductionLead }
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv: $.data.version } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ord}", expected_wave_version: "${wv}" }, as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/lock", as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/release", as: ProductionLead }
            - { call: "GET /fenestration/order-lines/${line}/ig-units", as: ProductionLead, captures: { u0: $.data.0.id, u1: $.data.1.id } }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u1}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u1}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u1}/advance", as: ProductionLead }
          trigger:
            - { call: "POST /fenestration/ig-units/${u0}/qc-check", payload: { argon_measured_pct: 95 }, as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u1}/qc-check", payload: { argon_measured_pct: 90 }, as: ProductionLead }
            - { call: "GET /fenestration/order-lines/${line}/energy-label", as: PlantManager, captures: { cert_u: $.data.0.u_factor, cert_basis: $.data.0.basis, cert_shgc: $.data.0.shgc } }
            - { call: "GET /fenestration/orders/${ord}", as: PlantManager, captures: { o_prod: $.data.production_status, o_comp: $.data.compliance_status } }
          assert:
            - "provisional u_factor == 0.28 (captured ${prov_u})"
            - "certified basis == CERTIFIED and certified u_factor == 0.30 (worst-unit argon min(95,90)=90: 0.28+(95-90)*0.002+0.01)"
            - "certified shgc == 0.40 (unchanged by fill)"
            - "OrderLine.${line}.status == COMPLETED"
            - "WindowOrder.${ord}.production_status == COMPLETED and compliance_status == CERTIFIED"

      - name: warranty_component_vs_whole_unit_coverage_divergence
        grounds:
          - calculations.warranty_coverage
          - entities.WarrantyClaim.fields.coverage_variant
          - entities.WarrantyClaim.fields.coverage_pct
        distinguishing_aspect: |
          WarrantyClaim domain dual variant (different entity domain from the
          EnergyLabel instance): same order, same failure date (8 years elapsed)
          — COMPONENT variant on HARDWARE (10y window) yields coverage_pct 100,
          WHOLE_UNIT variant on GRID yields 40 (100-20*(8-5)). Two valid
          warranty interpretations produce different coverage for one timeline.
        test_recipe:
          setup:
            - "MN rule, V200, GP1, dealer MN; order 2026-08-02, one RECTANGLE 40x60 qty1 line (line_total 165003)"
            - "Order produced (qc at 95), shipped on rack, delivered with clock at 2026-09-05"
            - "Clock advanced to 2034-09-06 (8 years after delivery)"
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { line: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { wave: $.data.id } }
            - { call: "POST /fenestration/production-waves/${wave}/open", as: ProductionLead }
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv: $.data.version } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ord}", expected_wave_version: "${wv}" }, as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/lock", as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/release", as: ProductionLead }
            - { call: "GET /fenestration/order-lines/${line}/ig-units", as: ProductionLead, captures: { u0: $.data.0.id } }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u0}/qc-check", payload: { argon_measured_pct: 95 }, as: ProductionLead }
            - { call: "POST /fenestration/shipping-racks", payload: { rack_code: "R1", slot_capacity: 5 }, as: ShippingCoordinator, captures: { rack: $.data.id } }
            - { call: "POST /fenestration/shipping-racks/${rack}/reservations", payload: { order_id: "${ord}", load_date: "2026-09-02T00:00:00Z", ship_date: "2026-09-05T00:00:00Z" }, as: ShippingCoordinator, captures: { res: $.data.id } }
            - { call: "POST /fenestration/rack-reservations/${res}/load", payload: { order_line_id: "${line}" }, as: ShippingCoordinator }
            - { call: "POST /fenestration/rack-reservations/${res}/ship", as: ShippingCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlantManager }
            - { call: "POST /fenestration/orders/${ord}/confirm-delivery", as: PlantManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2034-09-06T00:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /fenestration/warranty-claims", payload: { order_id: "${ord}", order_line_id: "${line}", component: "HARDWARE", coverage_variant: "COMPONENT", failure_date: "2034-09-06T00:00:00Z", description: "lock failed" }, as: PlantManager, captures: { cov_comp: $.data.coverage_pct } }
            - { call: "POST /fenestration/warranty-claims", payload: { order_id: "${ord}", order_line_id: "${line}", component: "GRID", coverage_variant: "WHOLE_UNIT", failure_date: "2034-09-06T00:00:00Z", description: "grid detached" }, as: PlantManager, captures: { cov_whole: $.data.coverage_pct } }
          assert:
            - "COMPONENT HARDWARE claim coverage_pct == 100 (8 < 10-year window)"
            - "WHOLE_UNIT GRID claim coverage_pct == 40 (100 - 20*(8-5))"
            - "Both claims status == SUBMITTED; same failure_date, divergent coverage proves variant divergence"

  - rule_id: combinatorial_formula
    instances:
      - name: line_pricing_multi_input_nonlinear
        grounds:
          - calculations.line_pricing
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — united-inch base
          times conditional shape multiplier (ARCH +40%), max() minimum-billable
          glazing, per-unit grid/hardware adders, quantity multiplication.
          ARCH 36x48 qty2 V200/GP1/COLONIAL/BRUSHED_NICKEL => 384160 cents.
        test_recipe:
          setup: ["V200 and GP1 exist; dealer; DRAFT order 2026-08-02"]
          setup_api_calls:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "ARCH", width_in: 36, height_in: 48, quantity: 2, grid_style: "COLONIAL", hardware_finish: "BRUSHED_NICKEL" }, as: PlantManager, captures: { line: $.data.id, total: $.data.line_total_cents, ui: $.data.united_inches, glaz: $.data.glazing_sqft, bill: $.data.billable_sqft, lead: $.data.lead_time_days } }
          assert:
            - "united_inches == 84; glazing_sqft == 10.2 (36*48/144*0.85); billable_sqft == 10.2 (max vs min_billable 3.0)"
            - "line_total_cents == 384160  (per-unit 84*1500*1.40 + 10.2*900 + 4000 + 2500 = 192080, x2)"
            - "lead_time_days == 25 (special shape)"

      - name: order_subtotal_per_line_rounding_order
        grounds:
          - calculations.order_subtotal_aggregation
          - calculations.line_pricing
        distinguishing_aspect: |
          Mode (b): nested rounding order — scaffold pins round-per-line-then-sum.
          A050 ARCH 13x13 qty1 GP1: per-unit raw 70025.42 -> line 70025; two
          lines sum to 140050. Sum-then-round would give 140051 — one cent
          discriminates the rounding order.
        test_recipe:
          setup: ["A050 (base 1999, min_bill 1.0, upcharge 33) and GP1 exist; dealer; DRAFT order"]
          setup_api_calls:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "A050", frame_material: "ALUMINUM_CLAD", base_rate_cents_per_ui: 1999, min_billable_sqft: 1.0, max_united_inches: 100, special_shape_upcharge_pct: 33, lead_time_standard_days: 12, lead_time_special_shape_days: 20, frame_warranty_years: 20 }, as: PlantEngineer, captures: { a050: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${a050}", glass_package_id: "${gp1}", shape: "ARCH", width_in: 13, height_in: 13, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { l1: $.data.id, t1: $.data.line_total_cents } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${a050}", glass_package_id: "${gp1}", shape: "ARCH", width_in: 13, height_in: 13, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { l2: $.data.id, t2: $.data.line_total_cents } }
            - { call: "GET /fenestration/orders/${ord}", as: PlantManager, captures: { sub: $.data.subtotal_cents } }
          assert:
            - "each line_total_cents == 70025 (raw 70025.42 rounded per line)"
            - "WindowOrder.${ord}.subtotal_cents == 140050, NOT 140051 (per-line-round-then-sum pinned)"

      - name: volume_discount_tier_keyed_on_prediscount_subtotal
        grounds:
          - calculations.volume_discount
          - entities.WindowOrder.fields.discount_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — discount tier keys on the
          PRE-discount subtotal (pinned evaluation order). Subtotal 2145039 is
          in the 8% tier; the post-discount total 1973436 would fall in the 5%
          tier, so a naive post-discount implementation produces a different total.
        test_recipe:
          setup: ["V200, GP1, dealer; DRAFT order with one RECTANGLE 40x60 qty13 GP1 line (165003 x 13 = 2145039)"]
          setup_api_calls:
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 13, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager }
          trigger:
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager, captures: { sub: $.data.subtotal_cents, disc: $.data.discount_cents, tot: $.data.total_price_cents } }
          assert:
            - "subtotal_cents == 2145039"
            - "discount_cents == 171603 (8% of PRE-discount subtotal, round_half_up of 171603.12)"
            - "total_price_cents == 1973436 — proves tier keyed pre-discount (post-discount keying would give 5%)"

  - rule_id: non_linear_state_machine
    instances:
      - name: ig_unit_remake_cycle_entity_loop
        grounds:
          - state_machines.IGUnit.QUEUED_to_GLASS_CUT
          - state_machines.IGUnit.GAS_FILLED_to_BROKEN
          - state_machines.OrderLine.IN_PRODUCTION_to_GLASS_HOLD
          - state_machines.OrderLine.GLASS_HOLD_to_IN_PRODUCTION
        distinguishing_aspect: |
          IGUnit machine is cyclic at entity level: QUEUED->GLASS_CUT->SEALED->
          GAS_FILLED->BROKEN, then a remake unit re-enters QUEUED (remake_of_id
          chain); the broken original stays terminally BROKEN. The paired
          WarrantyClaim instance carries the second non-linear machine on a
          different entity.
        test_recipe:
          setup:
            - "MN rule, V200, GP1, dealer; order with one RECTANGLE 40x60 qty1 line, confirmed, wave (cap 10/500, 2026-09-01) assigned+locked+released"
            - "IG unit u0 advanced to GAS_FILLED"
          setup_api_calls:
            - { call: "POST /fenestration/energy-code-rules", payload: { state_code: "MN", max_u_factor: 0.30, max_shgc: 0.55, effective_from: "2025-01-01T00:00:00Z" }, as: PlantEngineer }
            - { call: "POST /fenestration/catalog-series", payload: { series_code: "V200", frame_material: "VINYL", base_rate_cents_per_ui: 1500, min_billable_sqft: 3.0, max_united_inches: 120, special_shape_upcharge_pct: 40, lead_time_standard_days: 10, lead_time_special_shape_days: 25, frame_warranty_years: 20 }, as: PlantEngineer, captures: { v200: $.data.id } }
            - { call: "POST /fenestration/glass-packages", payload: { code: "LP2-ARG", pane_count: 2, spacer_type: "ALUMINUM", argon_target_pct: 95, argon_min_pct: 90, catalog_u_factor: 0.28, catalog_shgc: 0.40, price_per_sqft_cents: 900, ig_warranty_years: 20 }, as: PlantEngineer, captures: { gp1: $.data.id } }
            - { call: "POST /fenestration/dealers", payload: { name: "NorthStar", ship_to_state_code: "MN" }, as: PlantManager, captures: { dealer: $.data.id } }
            - { call: "POST /fenestration/orders", payload: { dealer_id: "${dealer}", order_date: "2026-08-02T00:00:00Z" }, as: PlantManager, captures: { ord: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/lines", payload: { series_id: "${v200}", glass_package_id: "${gp1}", shape: "RECTANGLE", width_in: 40, height_in: 60, quantity: 1, grid_style: "NONE", hardware_finish: "STANDARD" }, as: PlantManager, captures: { line: $.data.id } }
            - { call: "POST /fenestration/orders/${ord}/confirm", as: PlantManager }
            - { call: "POST /fenestration/production-waves", payload: { wave_date: "2026-09-01T00:00:00Z", capacity_units: 10, capacity_glass_sqft: 500 }, as: ProductionLead, captures: { wave: $.data.id } }
            - { call: "POST /fenestration/production-waves/${wave}/open", as: ProductionLead }
            - { call: "GET /fenestration/production-waves/${wave}", as: ProductionLead, captures: { wv: $.data.version } }
            - { call: "POST /fenestration/production-waves/${wave}/assignments", payload: { order_id: "${ord}", expected_wave_version: "${wv}" }, as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/lock", as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/release", as: ProductionLead }
            - { call: "GET /fenestration/order-lines/${line}/ig-units", as: ProductionLead, captures: { u0: $.data.0.id } }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${u0}/advance", as: ProductionLead }
          trigger:
            - { call: "POST /fenestration/ig-units/${u0}/report-breakage", payload: { break_cause: "HANDLING" }, as: ProductionLead }
            - { call: "GET /fenestration/ig-units", payload: { remake_of_id: "${u0}" }, as: ProductionLead, captures: { rm: $.data.0.id } }
            - { call: "POST /fenestration/production-waves/${wave}/lock", as: ProductionLead }
            - { call: "POST /fenestration/production-waves/${wave}/release", as: ProductionLead }
            - { call: "POST /fenestration/order-lines/${line}/resume-production", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${rm}/advance", as: ProductionLead }
            - { call: "POST /fenestration/ig-units/${rm}/advance", as: ProductionLead }
