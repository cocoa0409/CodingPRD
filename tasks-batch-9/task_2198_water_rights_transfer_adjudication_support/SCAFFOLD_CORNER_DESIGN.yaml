            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-002", priority_date: "1912-06-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: STOCKWATER, place_of_use_acres: 40.00, authorized_diversion_af: 100.00, authorized_rate_cfs: 1.500}, as: BasinAdjudicator, captures: {wr2: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: BasinAdjudicator}
            - {call: "POST /water-rights/${wr}/activate", as: BasinAdjudicator}
            - {call: "POST /decree-dockets", payload: {basin_code: "BASIN-01", docket_number: "DKT-2198-A", claim_filing_deadline: "2026-06-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dkt: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dkt}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {clm: "$.data.id"}}
