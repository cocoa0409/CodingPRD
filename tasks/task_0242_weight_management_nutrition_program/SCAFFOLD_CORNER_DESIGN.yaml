            - "response error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "IntakeAssessment.${iid}.status == UNDER_REVIEW"

      - name: clinician_cannot_create_enrollment
        claim_type: peer_roles
        grounds: [roles, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "A Clinician calling ProgramAdmin-exclusive POST /wm/enrollments -> ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["Member with APPROVED intake, active plan."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c22@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
          trigger:
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: Clinician, captures: { eid: $.data.error_id } }
          assert:
            - "response error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: missing_user_context_header_rejected
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with an unknown/invalid X-User-Role value -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: NotARole, captures: { eid: $.data.error_id } }
          assert:
            - "HTTP status == 401"
            - "response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_weighin_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[weighin-create-stale-enrollment]", entities.Enrollment.fields.version]
        distinguishing_aspect: "Posting a weigh-in with expected_enrollment_version equal to the current enrollment.version succeeds (201) and bumps version by 1."
        test_recipe:
          setup: ["ACTIVE enrollment; version observed via GET."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c23@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin, captures: { ev: $.data.version } }
          trigger:
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr}", weight_kg: 93, counts: true, expected_enrollment_version: "${ev}" }, as: Coach, captures: { wid: $.data.id } }
            - { call: "GET /wm/enrollments/${enr}", payload: {}, as: ProgramAdmin, captures: { ev2: $.data.version } }
          assert:
            - "the weigh-in POST returns HTTP 201"
            - "Enrollment.${enr}.version increased by exactly 1 from ${ev}"

      - name: occ_stale_version_weighin_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[weighin-create-stale-enrollment]", "errors[ERR_STALE_ENROLLMENT_VERSION]"]
        distinguishing_aspect: "After a first counted weigh-in bumps the version, a second weigh-in carrying the pre-bump version (${ev}) is rejected ERR_STALE_ENROLLMENT_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE enrollment; first counted weigh-in advances version; second uses the now-stale version."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c24@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}" }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin, captures: { ev: $.data.version } }
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr}", weight_kg: 93, counts: true, expected_enrollment_version: "${ev}" }, as: Coach }
          trigger:
            - { call: "POST /wm/weigh-ins", payload: { enrollment_id: "${enr}", weight_kg: 92, counts: true, expected_enrollment_version: "${ev}" }, as: Coach, captures: { eid: $.data.error_id } }
          assert:
            - "HTTP status == 412"
            - "response error_id == ERR_STALE_ENROLLMENT_VERSION"

      - name: void_invoice_credits_member_balance_derived_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [state_machines.Invoice.ISSUED_to_VOID, entities.Member.fields.account_balance_cents, entities.Enrollment.fields.cycles_billed]
        distinguishing_aspect: "Voiding a cycle_index 1 invoice (subtotal 6000) credits member.account_balance_cents by 6000 and decrements cycles_billed back to 1."
        test_recipe:
          setup: ["ACTIVE enrollment with a cycle_index 1 ISSUED invoice (subtotal 6000) generated after clock advance."]
          setup_api_calls:
            - { call: "POST /wm/programs", payload: { name: "P" }, as: ProgramAdmin, captures: { pid: $.data.id } }
            - { call: "POST /wm/programs/${pid}/clock-set", payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }, as: ProgramAdmin }
            - { call: "POST /wm/plans", payload: { program_id: "${pid}", tier: "COACHING", name: "C", monthly_fee_cents: 6000 }, as: ProgramAdmin, captures: { plid: $.data.id } }
            - { call: "POST /wm/members", payload: { program_id: "${pid}", full_name: "M", email: "c25@x.com", height_cm: 170 }, as: ProgramAdmin, captures: { mid: $.data.id } }
            - { call: "POST /wm/intake-assessments", payload: { member_id: "${mid}", weight_kg: 95 }, as: Member, as_user_id: "${mid}", captures: { iid: $.data.id } }
            - { call: "POST /wm/intake-assessments/${iid}/submit", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /wm/intake-assessments/${iid}/start-review", payload: {}, as: Clinician }
            - { call: "POST /wm/intake-assessments/${iid}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/enrollments", payload: { member_id: "${mid}", plan_id: "${plid}", intake_assessment_id: "${iid}", cycle_length_days: 30 }, as: ProgramAdmin, captures: { enr: $.data.id } }
            - { call: "POST /wm/enrollments/${enr}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /wm/programs/${pid}/clock-set", payload: { to_iso8601: "2026-01-31T00:00:00.000Z" }, as: ProgramAdmin }
            - { call: "POST /wm/enrollments/${enr}/bill-next-cycle", payload: {}, as: BillingAgent, captures: { inv1: $.data.id } }
          trigger:
            - { call: "POST /wm/invoices/${inv1}/void", payload: {}, as: BillingAgent }
            - { call: "GET /wm/members/${mid}", payload: {}, as: ProgramAdmin, captures: { bal: $.data.account_balance_cents } }
          assert:
            - "Member.${mid}.account_balance_cents == 6000"
            - "Enrollment.${enr}.cycles_billed == 1"

