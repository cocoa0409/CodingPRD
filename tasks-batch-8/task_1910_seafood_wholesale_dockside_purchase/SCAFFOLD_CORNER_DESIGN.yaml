      - name: sm_quote_auto_expires_on_clock_advance
        claim_type: side_effect_execution
        grounds:
          - "state_machines.MarketQuote.PUBLISHED_to_EXPIRED"
          - 'endpoints."POST /_clock/set_current_utc"'
        distinguishing_aspect: "System transition: advancing the logical clock past quote_date expires PUBLISHED quotes; DRAFT quotes are untouched."
        test_recipe:
          setup: ["PUBLISHED quote for 2026-08-01 and a DRAFT quote for 2026-08-03"]
          setup_api_calls:
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-01", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q1_id: $.data.id } }
            - { call: "POST /market-quotes/${q1_id}/publish", payload: { expected_species_version: "${sp_v}" }, as: OperationsManager }
            - { call: "POST /market-quotes", payload: { species_id: "${sp_id}", grade: "GRADE_A", quote_date: "2026-08-03", price_per_kg_cents: 1200 }, as: OperationsManager, captures: { q2_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: OperationsManager }
          assert:
            - "MarketQuote.${q1_id}.status == EXPIRED (quote_date 2026-08-01 has passed)"
            - "MarketQuote.${q2_id}.status == DRAFT (drafts do not expire)"

