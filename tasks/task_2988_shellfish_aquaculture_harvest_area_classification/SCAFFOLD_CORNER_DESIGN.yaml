        grounds:
          - roles[FarmOperator]
          - roles[ShellfishControlAuthority].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Classification is exclusive to the ShellfishControlAuthority: the identical payload is
          refused with 403 for a FarmOperator and accepted for the authority, so the denial is about
          the role alone and not about the request body or the area's data support.
