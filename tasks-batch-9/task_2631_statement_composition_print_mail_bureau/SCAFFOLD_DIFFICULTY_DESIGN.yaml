            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-SL", name: "Southline Savings Trust", sla_turnaround_hours: 96, sla_penalty_rate_cents_per_hour: 2500, sla_penalty_cap_cents: 500000, dr_readiness_required: false }
              as: BureauAdmin
              captures: { sl_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${sl_client_id}", template_code: "T-SL", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { sl_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${sl_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${sl_client_id}", file_name: "sl-cycle-01.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 200000 }
              as: ClientLiaison
              captures: { sl_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${sl_file_id}", account_ref: "ACC1001", sequence_no: 1, statement_amount_cents: 100000, address_line1: "18 Riverside Terrace", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "1234" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${sl_file_id}", account_ref: "ACC1002", sequence_no: 2, statement_amount_cents: 100000, address_line1: "19 Riverside Terrace", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "1235" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${sl_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${sl_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-SL", capabilities: ["DUPLEX", "COLOR", "INSERT"], sheets_per_hour: 600, daily_sheet_capacity: 9000, changeover_buffer_minutes: 30 }
              as: BureauAdmin
              captures: { sl_line_id: "$.data.id" }
            - call: "POST /bureau/entry-facilities"
              payload: { facility_code: "EF-SL", facility_type: "NDC", tray_capacity_per_window: 10, discount_bp_first_class: 0, discount_bp_marketing: 0 }
              as: BureauAdmin
              captures: { sl_facility_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${sl_file_id}", template_id: "${sl_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { sl_job_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${sl_job_id}/presort"
              payload: {}
              as: CompositionOperator
            - call: "GET /bureau/mail-pieces?composition_job_id=${sl_job_id}"
              payload: {}
              as: IntegrityAuditor
              captures: { sl_p1_id: "$.data[0].id", sl_p1_bar: "$.data[0].imb_barcode", sl_p2_id: "$.data[1].id", sl_p2_bar: "$.data[1].imb_barcode" }
            - call: "GET /bureau/presort-batches?composition_job_id=${sl_job_id}"
              payload: {}
              as: PostageController
              captures: { sl_batch_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T08:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/composition-jobs/${sl_job_id}/schedule"
              payload: { window_start: "2026-08-06T09:00:00Z", press_line_id: "${sl_line_id}" }
              as: ProductionScheduler
              captures: { sl_run_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/print-runs/${sl_run_id}/start"
