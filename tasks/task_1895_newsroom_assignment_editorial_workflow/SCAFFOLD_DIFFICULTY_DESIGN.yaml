            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NewsDirector }
            - { call: "POST /newsroom/pitches", payload: { title: "Park profile", summary: "Profile of a city park", desk: FEATURES, deadline_at: "2026-08-04T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
