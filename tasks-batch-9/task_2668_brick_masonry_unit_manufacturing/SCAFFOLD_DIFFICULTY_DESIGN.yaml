  # =======================================================================
  # RULE 7 - cross_entity_state_dependency
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: production_run_and_kiln_run_creation_require_qualified_formulation
        grounds:
          - validations[priority=28]
          - state_machines.BodyFormulation.DRAFT_to_QUALIFIED
          - endpoints["POST /production-runs"]
          - endpoints["POST /kiln-runs"]
        distinguishing_aspect: |
          The dependency is a plain STATUS-ENUM read on a parent aggregate, evaluated at
          CHILD CREATION time on two different endpoints: neither a ProductionRun nor a
          KilnRun may be opened while its BodyFormulation is still DRAFT, and both start
          working the instant the formulation is qualified - the child rows themselves do
          not exist yet, so there is nothing to roll back. The other instance in this
          rule depends on a parent that is ALREADY in its permitting state and fails
          anyway because of a derived timestamp, and it gates a transition on an existing
          row rather than a creation.
        test_recipe:
          setup:
            - "Plant P1 ACTIVE with PIT-CLAY-A and PIT-SHALE-B"
            - "Kiln K1 with 5 positions and KilnCar C1 with capacity 12000"
            - "Formulation F1 has both components at 50.00 percent, so component_share_total_pct is 100.00, but it is deliberately left in DRAFT"
