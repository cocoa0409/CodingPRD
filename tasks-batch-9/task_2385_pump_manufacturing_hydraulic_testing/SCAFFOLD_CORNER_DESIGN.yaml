  # =====================================================================
  # validations
  # =====================================================================
  - section: validations
    instances:
      - name: duplicate_foundry_code_returns_duplicate_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_CODE]
          - entities.Foundry.fields.foundry_code
        distinguishing_aspect: |
          foundry_code is declared unique; a second create with the same code must return 409
          ERR_DUPLICATE_CODE and must leave exactly one Foundry row, even though every other field
          differs.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH already exists."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "Rival Iron Works", approved_alloys: ["CN7M"], concurrent_pour_capacity: 9 }
              as: PlatformAdmin
          assert:
            - "HTTP status is 409 with error_id ERR_DUPLICATE_CODE"
            - "GET /foundries returns total_count == 1"
            - "Foundry.${f1_id}.name is still North Iron Works and concurrent_pour_capacity is still 2"
      - name: selection_above_config_temperature_limit_returns_temperature_limit_exceeded
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors[ERR_TEMPERATURE_LIMIT_EXCEEDED]
          - entities.MaterialSealConfig.fields.max_temp_c
        distinguishing_aspect: |
          MSC-CI-P11 is rated to 120.0 C; a duty at 130.0 C must be refused with 422 before any state
          moves, because the seal face material, not the hydraulics, is the limiting component.
        test_recipe:
          setup:
            - "MaterialSealConfig MSC-CI-P11 is rated max_temp_c 120.0."
            - "DutyApplication APP-1003 is OPEN at 265.0 m3/h, 74.0 m and process_temp_c 130.0."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
