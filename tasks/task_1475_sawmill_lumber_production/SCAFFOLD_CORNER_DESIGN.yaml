            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 20, sawdust_tons: 10, bark_tons: 8 }, as: Sawyer }
          trigger:
