# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Merchant Chargeback Representment (acquirer side)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: ratio_posted_excludes_reversed_vs_gross_includes
        grounds:
          - calculations.chargeback_ratio
          - entities.RatioSnapshot.fields.count_ratio_bps
          - entities.RatioSnapshot.fields.gross_count_ratio_bps
          - state_machines.Chargeback.RECEIVED_to_REVERSED
        distinguishing_aspect: |
          Dual variant on the Merchant ratio-monitoring domain: over identical
          underlying data, the POSTED basis excludes the REVERSED chargeback
          (count_ratio_bps == 80) while the GROSS basis includes it
          (gross_count_ratio_bps == 90); enrollment evaluation consumes POSTED,
          so no VDMP enrollment is created even though GROSS is at threshold.
        test_recipe:
          setup:
            - "VISA merchant with 1000 July sales of 10000 cents each"
            - "9 chargebacks received 2026-07-15 against sales S-0001..S-0009, one of which (NC-9) is then REVERSED before the sweep"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT, DELIVERY_PROOF], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Ratio M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 1000, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z", external_ref_prefix: "S" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0001", network_case_id: "NC-1", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0002", network_case_id: "NC-2", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0003", network_case_id: "NC-3", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0004", network_case_id: "NC-4", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0005", network_case_id: "NC-5", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0006", network_case_id: "NC-6", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0007", network_case_id: "NC-7", reason_code: "10.4", amount_cents: 5000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0008", network_case_id: "NC-8", reason_code: "10.4", amount_cents: 5000 } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "S-0009", network_case_id: "NC-9", reason_code: "10.4", amount_cents: 5000 }
              captures: { cb9_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb9_id}/reverse", as: AcquirerOps, payload: {} }
          trigger:
            - call: "POST /acquirer/ops/advance-month"
              as: AcquirerOps
              payload: { period_month: "2026-07", merchant_id: "${m_id}" }
              captures: { sweep_created: $.data.snapshots_created }
            - call: "GET /acquirer/merchants/${m_id}/ratio-snapshots"
              as: AcquirerOps
              captures: { posted_bps: "$.data[0].count_ratio_bps", gross_bps: "$.data[0].gross_count_ratio_bps", posted_count: "$.data[0].chargeback_count", gross_count: "$.data[0].gross_chargeback_count" }
            - call: "GET /acquirer/program-enrollments"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}" }
              captures: { enr_list: $.data }
            - call: "GET /acquirer/merchants/${m_id}"
              as: AcquirerOps
              captures: { current_ratio: $.data.current_count_ratio_bps }
          assert:
            - "sweep_created == 1"
            - "posted_count == 8 (REVERSED excluded) and gross_count == 9 (REVERSED included)"
            - "posted_bps == 80 and gross_bps == 90 over the identical data set"
            - "current_ratio == 80 (POSTED basis surfaces on the merchant)"
            - "len(enr_list) == 0 (POSTED 80 < VDMP_STANDARD 90 threshold; GROSS 90 must not enroll)"

      - name: reserve_target_fixed_tier_vs_exposure_based
        grounds:
          - calculations.reserve_target
          - entities.Merchant.fields.reserve_mode
          - entities.ReserveAccount.fields.target_cents
        distinguishing_aspect: |
          Dual variant on the ReserveAccount risk domain (different entity domain
          from the ratio instance): over identical data, FIXED_TIER yields
          target_cents == 150000 (rate floor only) while EXPOSURE_BASED yields
          target_cents == 600000 (max(rate floor, 2 x open exposure)) — selected
          by Merchant.reserve_mode, switched live via an OCC-guarded patch.
        test_recipe:
          setup:
            - "STANDARD merchant, reserve_rate_bps 1000, reserve_mode FIXED_TIER (default)"
            - "100 sales of 10000 cents plus one 500000-cent sale, all occurred 2026-07-25 (inside the trailing-90d window at the default clock 2026-08-01)"
            - "one open chargeback of 300000 cents against the large sale (funds_status MERCHANT_DEBITED, so it is in the open-exposure set)"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Reserve M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 1000 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 100, amount_cents: 10000, occurred_at: "2026-07-25T00:00:00Z", external_ref_prefix: "B" } }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "BIG-1", network: VISA, amount_cents: 500000, occurred_at: "2026-07-25T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "BIG-1", network_case_id: "NC-B1", reason_code: "10.4", amount_cents: 300000 } }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_id: "$.data[0].id", target_fixed: "$.data[0].target_cents", held_pre: "$.data[0].held_cents" }
            - call: "GET /acquirer/merchants/${m_id}"
              as: RiskOfficer
              captures: { m_v: $.data.version }
          trigger:
            - call: "PATCH /acquirer/merchants/${m_id}/reserve-policy"
              as: RiskOfficer
              payload: { reserve_mode: EXPOSURE_BASED, expected_merchant_version: "${m_v}" }
            - call: "GET /acquirer/reserve-accounts/${ra_id}"
              as: RiskOfficer
              captures: { target_exposure: $.data.target_cents, held_post: $.data.held_cents }
          assert:
            - "target_fixed == 150000 (round_half_up(1000 bps x 1500000 trailing sales / 10000); exposure ignored under FIXED_TIER)"
            - "target_exposure == 600000 (max(150000, 2 x 300000) — same data, variant-selected divergence)"
            - "held_pre == 150000 and held_post == 150000 (target recompute creates no ledger entries; STANDARD merchant has no receipt holdback)"

  - rule_id: combinatorial_formula
    instances:
      - name: program_fine_tiered_escalation_ladder
        grounds:
          - calculations.program_fine_schedule
          - calculations.program_threshold_evaluation
          - entities.FeeAssessment.fields.amount_cents
        distinguishing_aspect: |
          Mode (a): the fine combines >= 3 inputs (program base, months_over_count,
          enrollment status) with tiered multiplier selection (1.0 / 1.5 / 2.0 at
          months_over 3|4 and 6|7) and a status conditional (ACTIVE only) — the
          month-3 fine is 250000 while the month-4 fine is 375000 on identical
          over-threshold data, proving the tier step rather than a linear rate.
        test_recipe:
          setup:
            - "VISA merchant over the VDMP_STANDARD threshold (1000 bps, 5 chargebacks per 50 sales) for four consecutive months 2026-04..2026-07"
            - "enrollment auto-created by the first sweep; stays ACTIVE (no remediation plan)"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Fine M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            # ---- month 2026-04 ----
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 50, amount_cents: 10000, occurred_at: "2026-04-10T00:00:00Z", external_ref_prefix: "A4" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-04-15T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A4-0001", network_case_id: "NC-0401", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A4-0002", network_case_id: "NC-0402", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A4-0003", network_case_id: "NC-0403", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A4-0004", network_case_id: "NC-0404", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A4-0005", network_case_id: "NC-0405", reason_code: "10.4", amount_cents: 1000 } }
            - call: "POST /acquirer/ops/advance-month"
              as: AcquirerOps
              payload: { period_month: "2026-04", merchant_id: "${m_id}" }
              captures: { enr_created: $.data.enrollments_created, fines_04: $.data.fines_assessed }
            - call: "GET /acquirer/program-enrollments"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { enr_id: "$.data[0].id" }
            # ---- month 2026-05 ----
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 50, amount_cents: 10000, occurred_at: "2026-05-10T00:00:00Z", external_ref_prefix: "A5" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-05-15T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A5-0001", network_case_id: "NC-0501", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A5-0002", network_case_id: "NC-0502", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A5-0003", network_case_id: "NC-0503", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A5-0004", network_case_id: "NC-0504", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A5-0005", network_case_id: "NC-0505", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-05", merchant_id: "${m_id}" } }
            # ---- month 2026-06 ----
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 50, amount_cents: 10000, occurred_at: "2026-06-10T00:00:00Z", external_ref_prefix: "A6" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-06-15T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A6-0001", network_case_id: "NC-0601", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A6-0002", network_case_id: "NC-0602", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A6-0003", network_case_id: "NC-0603", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A6-0004", network_case_id: "NC-0604", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A6-0005", network_case_id: "NC-0605", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-06", merchant_id: "${m_id}" } }
            # ---- month 2026-07 ----
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 50, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z", external_ref_prefix: "A7" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A7-0001", network_case_id: "NC-0701", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A7-0002", network_case_id: "NC-0702", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A7-0003", network_case_id: "NC-0703", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A7-0004", network_case_id: "NC-0704", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "A7-0005", network_case_id: "NC-0705", reason_code: "10.4", amount_cents: 1000 } }
          trigger:
            - { call: "POST /acquirer/ops/advance-month", as: AcquirerOps, payload: { period_month: "2026-07", merchant_id: "${m_id}" } }
            - call: "GET /acquirer/fee-assessments"
              as: FinanceOps
              payload: { enrollment_id: "${enr_id}" }
              captures: { fine_1: "$.data[0].amount_cents", fine_2: "$.data[1].amount_cents", fine_3: "$.data[2].amount_cents", fine_4: "$.data[3].amount_cents", fine_kinds: "$.data[3].kind" }
            - call: "GET /acquirer/program-enrollments/${enr_id}"
              as: RiskOfficer
              captures: { months_over: $.data.months_over_count, enr_status: $.data.status }
          assert:
            - "enr_created == 1 and fines_04 == 1 (enrolling sweep assesses the month-1 fine)"
            - "months_over == 4 and enr_status == ACTIVE"
            - "fine_1 == 250000 and fine_2 == 250000 and fine_3 == 250000 (multiplier 1.0 while months_over_count <= 3)"
            - "fine_4 == 375000 (multiplier 1.5 at months_over_count 4..6: 250000 x 1.5) — tier step, not linear growth"
            - "fine_kinds == PROGRAM_FINE and every listed fee has assessed_by_user_id == 'system'"

      - name: reserve_hold_per_entry_rounding_order
        grounds:
          - calculations.reserve_hold_rounding
          - entities.ReserveLedgerEntry.fields.amount_cents
          - entities.ReserveAccount.fields.held_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-entry-then-sum,
          so two 999-cent sales at 333 bps hold round_half_up(33.2667)=33 each and
          held_cents == 66; the forbidden sum-then-round order would give
          round_half_up(66.5334)=67. The aggregate-rounded reserve TARGET on the
          same data is 67, so a correct implementation must hold 66 while targeting 67.
        test_recipe:
          setup:
            - "STANDARD merchant, reserve_rate_bps 333, reserve_mode FIXED_TIER"
            - "two 999-cent VISA sales occurred 2026-07-25"
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Round M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 333 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "R-1", network: VISA, amount_cents: 999, occurred_at: "2026-07-25T00:00:00Z" } }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "R-2", network: VISA, amount_cents: 999, occurred_at: "2026-07-25T00:00:00Z" } }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_id: "$.data[0].id", held: "$.data[0].held_cents", target: "$.data[0].target_cents" }
          trigger:
            - call: "GET /acquirer/reserve-accounts/${ra_id}/ledger-entries"
              as: RiskOfficer
              captures: { entry_1: "$.data[0].amount_cents", entry_2: "$.data[1].amount_cents" }
            - call: "GET /acquirer/merchants/${m_id}"
              as: RiskOfficer
              captures: { clearing: $.data.clearing_balance_cents }
          assert:
            - "entry_1 == 33 and entry_2 == 33 (each per-entry hold is round_half_up(999 x 333 / 10000) = 33)"
            - "held == 66 (sum of rounded entries; the sum-then-round value 67 is the pinned-wrong alternative)"
            - "target == 67 (aggregate target formula rounds once: round_half_up(333 x 1998 / 10000) = 67)"
            - "clearing == 1932 (2 x (999 - 33))"

      - name: program_fine_uses_post_increment_months_over
        grounds:
          - calculations.program_fine_schedule
          - entities.ProgramEnrollment.fields.months_over_count
        distinguishing_aspect: |
          Mode (c): circular-looking evaluation order — the month-4 fine depends on
          months_over_count, which itself is incremented by the same sweep's
          over-threshold verdict; the pinned order (post snapshot -> increment ->
          then price the fine) yields 375000 for the 4th over month, whereas
          pricing from the pre-increment count would yield 250000.
        test_recipe:
          setup:
            - "MASTERCARD merchant over the ECM threshold (10 chargebacks per 100 sales = 1000 bps, count 10) for four consecutive months 2026-04..2026-07"
            - "first sweep creates the ECM enrollment; sweeps 2-4 increment months_over_count"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: MASTERCARD, reason_code: "4853", category: CONSUMER_DISPUTE, required_evidence_types: [SIGNED_AGREEMENT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 3000, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Fine MC", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: MASTERCARD, count: 100, amount_cents: 10000, occurred_at: "2026-04-10T00:00:00Z", external_ref_prefix: "M4" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-04-15T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "M4-0001", network_case_id: "MC-0401", reason_code: "4853", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "M4-0002", network_case_id: "MC-0402", reason_code: "4853", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "M4-0003", network_case_id: "MC-0403", reason_code: "4853", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "M4-0004", network_case_id: "MC-0404", reason_code: "4853", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "M4-0005", network_case_id: "MC-0405", reason_code: "4853", amount_cents: 1000 } }
