          Integer case-count boundary on POST /farm-network/routes/{id}/stops (a different
          metric and endpoint than the bird-capacity ratio): a stop of exactly 4 planned cases
          on a capacity-4 route is accepted (available becomes 0), and one more case on a
          second stop is rejected with ERR_ROUTE_CAPACITY_EXCEEDED.
        test_recipe:
