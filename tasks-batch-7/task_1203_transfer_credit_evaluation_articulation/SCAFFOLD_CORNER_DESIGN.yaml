  # ==================================================================
  - section: endpoints
    instances:
      - name: guide_entries_snapshot_immune_to_later_agreement_edits
        claim_type: computed_read
        grounds:
          - "endpoints[GET /api/transfer-guides/{id}/entries]"
          - "entities.TransferGuide.fields.pinned_agreement_version"
          - "entities.TransferGuide.fields.is_stale"
        distinguishing_aspect: "Version-pinning: the entries read serves the equivalency set as of the pinned agreement version; an equivalency added AFTER publish bumps the agreement version, is absent from the pinned snapshot, and flips is_stale to true."
        test_recipe:
          setup: ["partner; agreement ACTIVE with equivalency EQ1 (M-101); guide published, pinning the agreement at version 3 (create=1, activate=2, EQ1 create=3); then EQ2 (M-102) added under OCC, bumping the agreement to version 4"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Pin College", institution_code: "PI", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin, captures: { eq1: "$.data.id" } }
            - { call: "POST /api/transfer-guides", payload: { partner_institution_id: "${p_id}", catalog_year: 2026 }, as: RegistrarAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /api/transfer-guides/${g_id}/publish", as: RegistrarAdmin, captures: { g_pin_v: "$.data.pinned_agreement_version" } }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v2: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-102", external_title: "Calc II", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v2}" }, as: RegistrarAdmin, captures: { eq2: "$.data.id" } }
