            - "ReviewRequest.${req1}.status == QUEUED and ReviewRequest.${req2}.status == QUEUED"
            - "Campaign.${camp}.credits_consumed == 0 and Campaign.${camp}.billing_cost == 0.00"

  # =========================================================================
  # Endpoints
