            The finalize action, its PROVISIONAL -> VERIFIED transition and the FINAL-variant
            recomputation of tier_code, coinsurance_rate, monthly_cap_cents, insurance_offset_cents
            and final_monthly_fee_cents are all driven by that §1.8 instance, which additionally
            proves already-accrued visits are not re-priced. A §1.9 action-endpoint test would repeat
            the same call sequence.

