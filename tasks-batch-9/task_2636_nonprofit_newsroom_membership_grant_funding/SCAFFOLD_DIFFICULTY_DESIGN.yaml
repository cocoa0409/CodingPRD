              payload: { funder_id: "${f_id}", contact_type: "EDITORIAL_DIRECTION_REQUEST", occurred_at: "2026-08-01T00:00:00Z", summary: "Program officer asked the newsroom to drop the utility-rate story.", coverage_area_id: "${ca_id}" }
