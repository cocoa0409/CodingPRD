      - name: driver_pay_variant_divergence
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: trip_pay_planned_accrual_vs_final_settlement_diverge_by_detention
          rationale: "The §1.8 dual_variant_calc instance already runs both variants over one trip through GET /fleet/trips/{trip_id}/pay-preview and asserts the per-component divergence (identical mileage and activity, hourly 0 vs the detention amount) plus the reconciliation onto Trip.driver_pay_cents at completion. A corner instance could only restate the same two calls."

      - name: driver_pay_guarantee_floor_and_bonus_nesting
        claim_type: Correct Result
        excluded_because:
          difficulty_instance: trip_pay_mode_a_nested_bonus_detention_and_guarantee_floor_compose
          rationale: "The §1.8 combinatorial_formula instance already pins the whole pinned evaluation order - mileage, activity, detention past the 30-minute grace, the backhaul bonus computed on (mileage + activity) only, and the guarantee makeup compared against the ROUNDED subtotal - with literal cent values for every component. Any corner-level `Constants Applied` probe of DETENTION_GRACE_MINUTES or backhaul_bonus_pct is a strict subset of it."

      - name: trip_plan_totals_rounding_order
        claim_type: Precision
        excluded_because:
          difficulty_instance: trip_plan_totals_mode_b_per_stop_ceiling_before_aggregation
          rationale: "The §1.8 combinatorial_formula instance already forces the per-stop ceil()-then-sum order with a fixture whose sum-then-ceil reading differs by a whole minute, and asserts both the per-stop service_minutes and the trip aggregate. Restating the precision claim here would duplicate that fixture."

      - name: cost_benchmark_variant_divergence
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: domicile_benchmark_fully_allocated_vs_incremental_variable_diverge
          rationale: "The §1.8 dual_variant_calc instance already calls GET /fleet/domiciles/{domicile_id}/cost-benchmark under both variants over the same window and asserts the fixed-cost delta, both per-unit divisions and the sign flip of advantage_cents_per_case, which is the complete Table 3 dual-variant claim set for this calculation."

  # ===========================================================================
  - section: validations
    instances:

      - name: dock_hours_are_checked_before_the_delivery_window
        claim_type: Cascading Validation
        grounds:
          - calculations.dock_hours_and_window_fit
          - errors.ERR_DOCK_HOURS_VIOLATION
          - errors.ERR_DELIVERY_WINDOW_VIOLATION
        distinguishing_aspect: "The two temporal fits are ordered inside one calculation: a stop occupying [06:00, 07:15] at a store open 08:00-17:00 breaks BOTH the dock hours and the order's 09:00 window, and reports ERR_DOCK_HOURS_VIOLATION. Only when the occupation sits inside the dock day does the same plan call fall through to ERR_DELIVERY_WINDOW_VIOLATION."
        test_recipe:
          setup:
            - "Store S-5001 opens at minute 480 and closes at minute 1020 with 2 docks and a 600 cases/hour crew, so a 600-case delivery occupies 75 minutes."
            - "TRIP-V1A is staffed and stopped at [06:00, 07:15] against an order whose window opens at 09:00 - both fits fail."
            - "TRIP-V1B is staffed and stopped at [09:30, 10:45] against an order whose window opens at 11:00 - only the window fails. Each trip owns its own driver, tractor and trailer."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
