  - rule_id: non_linear_state_machine
    instances:
      - name: subscriber_parallel_delivery_and_qualification_dimensions
        grounds:
          - state_machines.Subscriber.DELIVERABLE_to_UNDELIVERABLE
          - state_machines.Subscriber.UNDELIVERABLE_to_REMOVED
          - state_machines.Subscriber.QUALIFIED_to_REQUALIFICATION_REQUIRED
          - entities.Subscriber.fields.delivery_status
          - entities.Subscriber.fields.qualification_status
          - entities.HygieneRun.fields.undeliverable_threshold
        distinguishing_aspect: |
          Two independent state dimensions on one row advance at different sweeps: the first sweep
          moves delivery_status DELIVERABLE -> UNDELIVERABLE while qualification_status stays
          QUALIFIED (a qualified recipient can be undeliverable), and only the second sweep, once
          undeliverable_count reaches the threshold, moves delivery_status to REMOVED AND drags
          qualification_status to REQUALIFICATION_REQUIRED. Non-linear because the same trigger
          produces different transitions depending on an accumulated counter, not on the state alone.
        test_recipe:
          setup:
            - "publication with undeliverable_restrict_pct 5.00 and all three qualification rules"
            - "recipient SD: 950 PAID copies, left UNQUALIFIED (counters include unqualified recipients)"
            - "recipient SE: 50 CONTROLLED copies, verified QUALIFIED and DELIVERABLE at the default clock 2026-08-01"
            - "clock still at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Utility Operations Monthly", frequency: "MONTHLY", industry_code: "UTILITIES", undeliverable_restrict_pct: 5.00 }
              as: CirculationManager
              as_user_id: "mgr-01"
