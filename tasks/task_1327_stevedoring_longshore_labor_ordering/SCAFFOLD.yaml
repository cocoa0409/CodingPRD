    side_effects: []
  - method: GET
    path: "/api/damage-claims/{id}"
    description: "Get a damage claim"
    roles: [StevedoreAdmin, StevedoreSuperintendent, GangForeman, ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: POST
    path: "/api/damage-claims/{id}/decide"
    description: "Accept (with fault_pct) or deny a REPORTED claim; segregation of duties enforced"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "fault_pct?"]
    output: DamageClaim
    side_effects: ["status -> ACCEPTED or DENIED", "decided_by_user_id recorded"]
  - method: POST
    path: "/api/damage-claims/{id}/settle"
    description: "Settle an ACCEPTED claim; computes final fault-weighted liability"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["status -> SETTLED", "final_stevedore_liability_cents computed"]

  # --- SafetyIncident ---
  - method: POST
    path: "/api/safety-incidents"
    description: "Report a safety incident; may flip vessel work_posture and cascade to SUSPENDED"
    roles: [StevedoreSuperintendent, GangForeman]
    code: 201
    input: [vessel_call_id, scope, severity, description, "gang_order_id?"]
    output: SafetyIncident
    side_effects: ["status=REPORTED", "work_posture recomputed", "FULL_STOPPAGE cascades WORKING gang orders -> SUSPENDED (suspension_count += 1, equipment released)"]
  - method: GET
    path: "/api/safety-incidents"
    description: "List safety incidents (FK reverse-reachability for vessel_call_id and gang_order_id)"
    roles: [StevedoreAdmin, StevedoreSuperintendent, GangForeman]
    code: 200
    input: ["vessel_call_id?", "gang_order_id?", "status?", "limit?", "offset?"]
    output: SafetyIncident[]
    side_effects: []
  - method: GET
    path: "/api/safety-incidents/{id}"
    description: "Get a safety incident"
    roles: [StevedoreAdmin, StevedoreSuperintendent, GangForeman]
    code: 200
    input: []
    output: SafetyIncident
    side_effects: []
  - method: POST
    path: "/api/safety-incidents/{id}/clear"
    description: "Clear an incident (REPORTED -> CLEARED); posture recomputes; suspended gangs stay suspended"
    roles: [StevedoreSuperintendent]
    code: 200
    input: []
    output: SafetyIncident
    side_effects: ["status -> CLEARED", "work_posture recomputed"]

  # --- TimesheetEntry ---
  - method: POST
    path: "/api/timesheet-entries"
    description: "Foreman enters a worker's hours for a gang order"
    roles: [GangForeman]
    code: 201
    input: [gang_order_id, worker_id, work_minutes, "meal_break_taken?"]
    output: TimesheetEntry
    side_effects: ["status=DRAFT", "rate_cents_snapshot copied from worker"]
  - method: GET
    path: "/api/timesheet-entries"
    description: "List timesheets (FK reverse-reachability for gang_order_id and worker_id)"
    roles: [StevedoreAdmin, StevedoreSuperintendent, GangForeman, PayrollClerk]
    code: 200
    input: ["gang_order_id?", "worker_id?", "status?", "limit?", "offset?"]
    output: TimesheetEntry[]
    side_effects: []
  - method: GET
    path: "/api/timesheet-entries/{id}"
    description: "Get a timesheet"
    roles: [StevedoreAdmin, StevedoreSuperintendent, GangForeman, PayrollClerk]
    code: 200
    input: []
    output: TimesheetEntry
    side_effects: []
  - method: POST
    path: "/api/timesheet-entries/{id}/submit"
    description: "Submit a DRAFT or REJECTED timesheet"
    roles: [GangForeman]
    code: 200
    input: []
    output: TimesheetEntry
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id recorded"]
  - method: POST
    path: "/api/timesheet-entries/{id}/approve"
    description: "Approve a SUBMITTED timesheet; computes pay breakdown; segregation of duties enforced"
    roles: [PayrollClerk]
    code: 200
    input: []
    output: TimesheetEntry
    side_effects: ["status -> APPROVED", "straight/ot/dt/meal_penalty minutes and gross_pay_cents computed", "bonus_cents attached from gang order"]
  - method: POST
    path: "/api/timesheet-entries/{id}/reject"
    description: "Reject a SUBMITTED timesheet"
    roles: [PayrollClerk]
    code: 200
    input: []
    output: TimesheetEntry
    side_effects: ["status -> REJECTED"]

  # --- Invoice ---
  - method: POST
    path: "/api/invoices"
    description: "Create a provisional DRAFT invoice for a vessel call (allowed once vessel is BERTHED or later)"
    roles: [BillingClerk]
    code: 201
    input: [vessel_call_id]
    output: Invoice
    side_effects: ["status=DRAFT, rate_variant=PROVISIONAL", "provisional lines computed per invoice_calculation"]
  - method: GET
    path: "/api/invoices"
    description: "List invoices (FK reverse-reachability for vessel_call_id)"
    roles: [StevedoreAdmin, StevedoreSuperintendent, BillingClerk]
    code: 200
    input: ["vessel_call_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/api/invoices/{id}"
    description: "Get an invoice"
    roles: [StevedoreAdmin, StevedoreSuperintendent, BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: PATCH
    path: "/api/invoices/{id}"
    description: "Apply a manual adjustment (DRAFT stays DRAFT; DISPUTED -> FINALIZED); OCC-guarded"
    roles: [BillingClerk]
    code: 200
    input: [adjustment_cents, reason, expected_invoice_version]
    output: Invoice
    side_effects: ["adjustment_total_cents += adjustment_cents", "totals recomputed", "DISPUTED -> FINALIZED", "increments Invoice.version by 1"]
  - method: POST
    path: "/api/invoices/{id}/finalize"
    description: "Recompute a DRAFT invoice from actuals (DRAFT -> FINALIZED; requires vessel COMPLETED)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["rate_variant PROVISIONAL -> FINAL", "all lines recomputed from actuals"]
  - method: POST
    path: "/api/invoices/{id}/issue"
    description: "Issue a FINALIZED invoice (credit-limit gate)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> ISSUED"]
  - method: POST
    path: "/api/invoices/{id}/record-payment"
    description: "Record a payment against an ISSUED invoice; PAID when balance reaches 0"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["amount_paid_cents += amount_cents", "remaining_balance_cents recomputed", "status -> PAID when remaining == 0"]
  - method: POST
    path: "/api/invoices/{id}/dispute"
    description: "Dispute an ISSUED invoice"
    roles: [BillingClerk]
    code: 200
    input: [dispute_reason]
    output: Invoice
    side_effects: ["status -> DISPUTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, unknown enum member, or out-of-range numeric value" }
  - { id: ERR_CARGO_PLAN_REQUIRED, http: 400, condition: "Vessel create with planned_moves == 0 AND planned_tons == 0" }
  - { id: ERR_SHIFT_WINDOW_INVALID, http: 400, condition: "Shift end <= start, or duration > 960 minutes" }
  - { id: ERR_FAULT_PCT_OUT_OF_RANGE, http: 400, condition: "fault_pct outside 0..100 (or missing on an ACCEPTED decision)" }
  - { id: ERR_STALE_GANG_ORDER_VERSION, http: 412, condition: "expected_gang_order_version does not match the gang order's current version (OCC)" }
  - { id: ERR_STALE_WORKER_VERSION, http: 412, condition: "expected_worker_version does not match the worker's current version (OCC)" }
  - { id: ERR_STALE_INVOICE_VERSION, http: 412, condition: "expected_invoice_version does not match the invoice's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity state does not permit the requested transition (generic state precondition)" }
  - { id: ERR_SHIFT_NOT_OPEN_FOR_ORDERS, http: 409, condition: "Gang-order create against a ShiftWindow not in OPEN_FOR_ORDERS" }
  - { id: ERR_INVOICE_NOT_FINALIZABLE, http: 409, condition: "Invoice finalize while vessel call is not COMPLETED" }
  - { id: ERR_WORK_STOPPAGE_ACTIVE, http: 409, condition: "Vessel work_posture blocks the operation (FULL_STOPPAGE: dispatch-batch/check-in/start-work; PARTIAL_STOPPAGE: start-work)" }
  - { id: ERR_NO_EQUIPMENT_ASSIGNED, http: 409, condition: "start-work while assigned_equipment_ok is false" }
  - { id: ERR_WORKER_NOT_ON_GANG, http: 422, condition: "Timesheet for a worker without an assignment on the gang order in {CHECKED_IN, WORKING, COMPLETED}" }
  - { id: ERR_WORKER_DOUBLE_BOOKED, http: 409, condition: "Worker already assigned (OFFERED/CHECKED_IN/WORKING) to another gang order whose shift window overlaps (half-open)" }
  - { id: ERR_EQUIPMENT_WINDOW_CONFLICT, http: 409, condition: "Equipment unit booking violates the 30-minute buffered-window rule against an existing RESERVED/ACTIVE assignment" }
  - { id: ERR_MOVE_PERIOD_OVERLAP, http: 409, condition: "Move-record period overlaps another RECORDED period on the same gang order (half-open)" }
  - { id: ERR_TIMESHEET_EXCEEDS_SHIFT, http: 422, condition: "work_minutes exceeds shift duration minutes + 120" }
  - { id: ERR_GANG_FULL, http: 409, condition: "Check-in while filled_headcount == required_headcount" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 409, condition: "Equipment assignment create against a unit whose status is DOWN (ASSIGNED units accept further disjoint bookings subject to the buffered-window rule)" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Worker registration_number already exists" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim decider equals reporter, or timesheet approver equals submitter" }
  - { id: ERR_INVOICE_CREDIT_LIMIT, http: 402, condition: "Issue with total_cents exceeding the vessel call's credit_limit_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "record-payment amount_cents greater than remaining_balance_cents" }
  - { id: ERR_WORKER_INELIGIBLE, http: 409, condition: "Forced worker_ids entry fails dispatch eligibility (status not ACTIVE, wrong classification, or prior NO_SHOW/BUMPED exclusion on this gang order)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StevedoreAdmin
    description: "Stevedore company administrator; registers vessels, workers, and equipment; repairs units"
    identity: opaque
    exclusive_operations:
      - "POST /api/vessel-calls"
      - "POST /api/workers"
      - "PATCH /api/workers/{id}"
      - "POST /api/equipment-units"
      - "POST /api/equipment-units/{id}/repair-complete"
    shared_operations: ["All GET list/detail endpoints"]
  - name: StevedoreSuperintendent
    description: "Port superintendent; owns shift scheduling, gang ordering, equipment booking, safety incidents"
    identity: opaque
    exclusive_operations:
      - "POST /api/vessel-calls/{id}/berth, /complete, /cancel"
      - "POST /api/shift-windows and /open-for-orders, /start"
      - "POST /api/gang-orders, PATCH /api/gang-orders/{id}, POST /api/gang-orders/{id}/cancel"
      - "POST /api/equipment-assignments, /release"
      - "POST /api/safety-incidents/{id}/clear"
    shared_operations: ["All GET list/detail endpoints", "POST /api/safety-incidents (shared with GangForeman)"]
  - name: LaborHallDispatcher
    description: "Union labor-hall dispatcher; runs dispatch batches and manages assignment lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /api/gang-orders/{id}/dispatch-batch"
      - "POST /api/dispatch-assignments/{id}/check-in, /complete, /no-show, /bump"
    shared_operations: ["All GET list/detail endpoints"]
  - name: GangForeman
    description: "Working foreman (a registered Worker); logs moves and hours, reports damage and breakdowns, starts/completes gang work"
    identity: "entity_backed:Worker"
    exclusive_operations:
      - "POST /api/gang-orders/{id}/start-work, /complete"
      - "POST /api/move-records, /void"
      - "POST /api/damage-claims"
      - "POST /api/equipment-assignments/{id}/report-breakdown"
      - "POST /api/timesheet-entries, /submit"
    shared_operations: ["All GET list/detail endpoints", "POST /api/safety-incidents (shared with StevedoreSuperintendent)"]
  - name: ClaimsAdjuster
    description: "Independent claims adjudicator; must not adjudicate claims they reported (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/damage-claims/{id}/decide, /settle"
    shared_operations: ["All GET list/detail endpoints"]
  - name: PayrollClerk
    description: "Payroll clerk; approves/rejects timesheets; must not approve timesheets they submitted (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/timesheet-entries/{id}/approve, /reject"
    shared_operations: ["All GET list/detail endpoints"]
  - name: BillingClerk
    description: "Billing clerk; owns invoice lifecycle from draft to payment"
    identity: opaque
    exclusive_operations:
      - "POST /api/invoices, PATCH /api/invoices/{id}"
      - "POST /api/invoices/{id}/finalize, /issue, /record-payment, /dispute"
    shared_operations: ["All GET list/detail endpoints"]
