    code: 200
    input: []
    output: SchoolAllocation
    side_effects: []
  - method: POST
    path: "/title-i/school-allocations/{id}/certify"
    description: "Certify a PENDING allocation (requires grant ALLOCATED)"
    roles: [FederalProgramsDirector]
    code: 200
    input: []
    output: SchoolAllocation
    side_effects: ["allocation PENDING->CERTIFIED"]

  # --- SetAside ---
  - method: GET
    path: "/title-i/set-asides"
    description: "List set-asides (FK reverse lookup from DistrictGrant)"
    roles: [FederalProgramsDirector, ComplianceAnalyst, SEAMonitor, PrivateSchoolOmbudsman]
