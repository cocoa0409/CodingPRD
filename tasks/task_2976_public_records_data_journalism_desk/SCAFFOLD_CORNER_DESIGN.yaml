          Eight refusals spanning every status class the catalogue uses - 401, 403, 404, 400, 409, 412,
          402 and 422 - are driven against one fixture so the envelope can be compared side by side.
          The claim is that the shape never changes with the class: each body carries a non-empty
          error_id and message, the eight error_ids are pairwise distinct, and the numeric status matches
          the catalogue rather than collapsing business refusals into a generic 400.
