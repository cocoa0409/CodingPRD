            - "rung D GET /engagements/${eng}: response.data.scope_creep_pct == 0.4000"
            - "rung D GET /engagements/${eng}: response.data.creep_escalation_level == ESCALATED"
            - "rung D trailing POST /engagements/${eng}/time-logs: response.status == 409"
            - "rung D trailing POST /engagements/${eng}/time-logs: response.error.id == ERR_SCOPE_BREACH_THRESHOLD"

      - name: cycle_posture_floors_on_integer_slot_lattice
        grounds:
          - calculations.cycle_posture
          - calculations.cycle_posture.constants.RESTRICTED_FLOOR
          - calculations.cycle_posture.constants.FROZEN_FLOOR
          - validations.priority_51
          - validations.priority_52
        distinguishing_aspect: |
          The only boundary family in this rule whose input is an INTEGER lattice: with
          capacity_slot_total 10 the utilization_ratio can only take the values k/10, so
          "just below" and "just above" mean exactly one slot, and there is no rounding
          freedom at all - which is precisely why an implementation that writes > instead of
          >= has nowhere to hide. It is also the only family where the two floors carry
          DIFFERENT errors on DIFFERENT endpoint sets (priority 51 covers match and accept,
          priority 52 covers match only) and where crossing the floor is self-inflicted: the
          very offer created by a legal ROUTINE match is what flips the cycle to RESTRICTED.

          Arithmetic (capacity_slot_total 10, slots_committed counts Engagement rows in
          {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED}, slots_reserved counts MatchOffer
          rows in OFFERED):
            ARM A  7 committed + 0 reserved -> round(7 / 10, 4)  = 0.7000 -> OPEN
                   slots_available = max(0, 10 - 7 - 0) = 3
                   after the ROUTINE match creates one OFFERED offer:
                   round((7 + 1) / 10, 4) = 0.8000 -> RESTRICTED, slots_available = 2
            ARM B  8 committed + 0 reserved -> round(8 / 10, 4)  = 0.8000 -> RESTRICTED
                   (0.8000 >= 0.8000, inclusive: ROUTINE is refused, ELEVATED is not)
                   after the ELEVATED match: round((8 + 1) / 10, 4) = 0.9000 -> RESTRICTED
            ARM C 10 committed + 0 reserved -> round(10 / 10, 4) = 1.0000 -> FROZEN
                   slots_available = max(0, 10 - 10 - 0) = 0
                   after one handoff releases its slot: round(9 / 10, 4) = 0.9000 -> RESTRICTED
          Priority ordering pinned by ARM C: in FROZEN a CRITICAL request must still fail, and
          it must fail with priority 51 ERR_CYCLE_CAPACITY_FROZEN (409) rather than priority 52
          ERR_CYCLE_RESTRICTED_URGENCY - the urgency escape hatch exists only in RESTRICTED.
          Conversely in ARM B a ROUTINE request fails priority 52 while the cycle is nowhere
          near FROZEN, and slots_available is still 2, so an implementation that gates on
          slots_available rather than on the ratio band passes ARM C and fails ARM B.

          ARM D is the trap the FROZEN floor hides: 9 committed + 1 OFFERED also reaches
          round(10 / 10, 4) = 1.0000 -> FROZEN, but entering FROZEN withdraws every OFFERED
          offer in the cycle, which removes the reservation that produced the 1.0000 in the
          first place; the immediately recomputed ratio is round(9 / 10, 4) = 0.9000, so the
          cycle settles at RESTRICTED with the offer WITHDRAWN. FROZEN is therefore only
          stable when it is reached through committed slots (ARM C), and the two arms must
          not be conflated.
