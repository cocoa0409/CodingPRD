          setup:
            - "Violation codes FSP-300 (CRITICAL, base_points 4.0, fine_cents_base 30000) and IMP-200 (MAJOR, base_points 6.0, fine_cents_base 12000) are published."
            - "One establishment 'Glow Salon' has a FINALIZED ROUTINE inspection scoring 55.00 with final_outcome FAIL, inspected by insp-001."
            - "One ESTABLISHMENT-subject citation on that inspection is ISSUED with assessed_fine_cents 52000, administrative_fee_cents 4160, total_due_cents 56160 and hearing_round_count 0."
            - "The logical clock stays at its startup default 2026-08-01T00:00:00Z throughout, so every contest lands inside the 30-day window."
