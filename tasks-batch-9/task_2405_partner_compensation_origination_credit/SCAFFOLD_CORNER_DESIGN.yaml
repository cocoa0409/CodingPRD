              captures: { c1: "$.data.id" }
            - call: "POST /comp/partners"
              payload: { full_name: "Wat Two", practice_group: "IP", compensation_model: "FORMULA", admission_year: 2005, is_committee_member: true, evaluation_required: false }
              as: CycleAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /comp/cycles/${cy}/advance"
