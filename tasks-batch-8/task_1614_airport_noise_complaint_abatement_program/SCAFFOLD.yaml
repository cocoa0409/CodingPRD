  - { method: GET, path: "/noise-program/noise-studies/{studyId}", description: "Get a study", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: [], output: NoiseStudy, side_effects: [] }
