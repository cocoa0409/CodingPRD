            - "the cascade then sets Deal.${deal_id}.contract_price_usd_per_mwh 0.01, exposure_usd 613.20 = round(61320.00 * 0.01, 2) and credit_support_required_usd 0.00, and credit_status stays APPROVED because a 0.00 requirement is still covered"

      - name: condition_precedent_resolution_after_its_deadline_or_cure_window_is_refused
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CP_DEADLINE_PASSED]
          - validations.priority_18_ERR_CP_DEADLINE_PASSED
          - endpoints.POST_/ppa/conditions-precedent/{id}/resolution
          - calculations.cp_template_selection
        distinguishing_aspect: |
          The three conditions minted by one execute call carry three DIFFERENT deadlines
          (270, 540 and 720 days from the clock), so a single clock position of
          2027-05-01 makes PERMITTING late while INTERCONNECTION is still perfectly
          curable - the deadline is per-condition, not per-deal. The same error code also
          guards the re-cure window from the other side: failing the late condition sets
          cure_deadline to clock + 15 days, and a RECURE attempted after that instant is
          refused by the same rule rather than by the FAILED-state gate.
