              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-BLOCKBASIS", contract_basis: "BLOCK", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2026, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_a}" }
              as: GrowerRelationsManager
              captures: { alloc_a: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_b}" }
              as: GrowerRelationsManager
              captures: { alloc_b: $.data.id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "GET /grower-relations/contract-block-allocations/${alloc_a}"
              payload: {}
              as: GrowerRelationsManager
            - call: "GET /grower-relations/contract-block-allocations/${alloc_b}"
              payload: {}
              as: GrowerRelationsManager
          assert:
            - "The accept returns 200 with cap_scope == \"PER_BLOCK\""
            - "contract_cap_tons == 55.000 (40.000 + 15.000) and hard_cap_tons == 60.500 (55.000 * 1.10)"
            - "Allocation A: block_cap_tons == 40.000 and block_hard_cap_tons == 44.000"
            - "Allocation B: block_cap_tons == 15.000 and block_hard_cap_tons == 16.500 — its own 10 pct band, not a share of the contract's"
            - "Both allocated_acres are null: the BLOCK basis forbids the field, so the caps came from the blocks' acres x expected_yield_tons_per_acre"
            - "committed_tons and contracted_yield_tons_per_acre are both null on the contract"

