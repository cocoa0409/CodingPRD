      - name: consume_cascades_reorder_point_then_auto_stock_order
        grounds:
          - state_machines.WorkOrderPartLine.RESERVED_to_CONSUMED
          - entities.Part.fields.replenishment_status
          - entities.ReplenishmentOrder.fields.auto_generated
          - calculations.part_criticality_and_stocking_policy
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger — the consume transition: consuming 82 units
          drops on_hand to 4 (hop 1), which drops available_units to 4 at or below the
          reorder_point_units 5 written by classification and flips replenishment_status
          (hop 2), which is what causes a STOCK ReplenishmentOrder for
