    entity: ProgramProposal
    purpose: "Tally the current review_round, write composite_score and decline_majority, and route the proposal to APPROVED (creating the Program), REVISION_REQUESTED or DECLINED. Guarded by expected_proposal_version because a late ballot changes both the score and the decline-majority test."
    roles: [ProgramDirector]
    input: [expected_proposal_version]
    output: ProgramProposal
    status: 200
    errors: [ERR_VALIDATION, ERR_STALE_PROPOSAL_VERSION, ERR_PROPOSAL_NOT_IN_REVIEW, ERR_QUORUM_NOT_MET, ERR_PROGRAM_ALREADY_EXISTS, ERR_PROPOSAL_NOT_FOUND, ERR_UNAUTHORIZED]

