  - name: participant_terminate_then_reinstate_conserves_pool_points_and_shares
    grounds:
    - §1.2 RoyaltyParticipant ACTIVE -> TERMINATED -> ACTIVE (reinstate)
    - §1.3 royalty_pool_share_pct (4dp share per ACTIVE participant)
    - §1.1 Production.total_pool_points
    distinguishing_aspect: |
      Termination changes the denominator of every other participant's share and
      reinstatement must restore it exactly. With points 4/3/2 the shares are
      0.4445/0.3333/0.2222; terminating RP3 makes them 0.5714/0.4286/0.0000 over a
      denominator of 7; reinstating RP3 must return all three to the original values and
      total_pool_points to 9. An implementation that caches shares at creation never moves
      them; one that leaves TERMINATED participants in the denominator never reaches
      0.5714; one that recomputes on terminate but not on reinstate leaves RP3 at 0.0000.
    test_recipe:
      setup:
      - |-
        BASE chain on POOL basis through RUNNING with the three standard participants
        (4/3/2 points). The pre-termination share report is read, then RP3 is terminated
        and the report is read again.
      setup_api_calls:
      - call: POST /theatres
        payload:
