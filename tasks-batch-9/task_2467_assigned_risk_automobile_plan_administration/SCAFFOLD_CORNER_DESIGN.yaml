        grounds:
          - errors[ERR_CARRIER_SCOPE_FORBIDDEN]
          - errors[ERR_PRODUCER_SCOPE_FORBIDDEN]
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=5][error_id=ERR_CARRIER_SCOPE_FORBIDDEN]
          - validations[priority=5][error_id=ERR_PRODUCER_SCOPE_FORBIDDEN]
          - roles[ServicingCarrier].shared_operations
