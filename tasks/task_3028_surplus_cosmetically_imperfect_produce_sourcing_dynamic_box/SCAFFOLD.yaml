# =============================================================================
# PRD Benchmark Scaffold — §1.0–§1.7
# Task: task_3028_surplus_cosmetically_imperfect_produce_sourcing_dynamic_box
# Domain: surplus / cosmetically-imperfect produce sourcing + dynamic box build
# =============================================================================

scenario: |
  Surplus and Cosmetically Imperfect Produce Sourcing & Dynamic Box Build (Misfits Market): opportunistic sourcing of surplus, off-spec and short-dated produce and grocery with variable availability, dynamic box construction where each customer's box is built from what was actually procured against preference and allergy filters, per-item pricing displayed against conventional retail with substantiation, order window cutoffs and regional fulfillment center assignment, cold-chain packing with insulation and coolant selection by lane and season, quality credit issuance for spoiled arrivals with photo evidence, supplier relationship management for irregular lots, subscription cadence with skip and pause behavior

domain_name: "surplus-imperfect-produce-dynamic-box"
api_prefix: "/produce"

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_deferred_actions
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_level: expert
  entity_count: 11
  state_machine_count: 8
  calculation_count: 10
  validation_count: 12
  endpoint_count: 47
  error_code_count: 21
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Customer: the box subscriber -------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Subscriber email address; unique across all Customers" }
      - { name: full_name, type: string, source: input, description: "Subscriber display name" }
      - { name: service_region, type: enum, source: input, description: "Region the subscriber lives in; the first key of fulfillment-center assignment", constraints: "enum {NE, MW, SO, WE}" }
      - { name: home_fulfillment_center_id, type: string, source: input_and_computed, description: "FK -> FulfillmentCenter.id; an explicit value supplied at registration is honoured, otherwise the regional assignment rule assigns one and it is never rewritten" }
      - { name: dietary_allergy_codes, type: array, source: input, description: "Allergy codes that must never appear in a built box; empty array means no allergies; sorted ascending for comparison", default: "[]" }
      - { name: grandfathered_service_fee, type: boolean, source: input, description: "When true the flat service fee is waived for this Customer's boxes", default: false }

  # --- FulfillmentCenter ------------------------------------------------------------
  - name: FulfillmentCenter
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Human-readable center code; unique across all centers" }
      - { name: name, type: string, source: input, description: "Center display name" }
      - { name: region, type: enum, source: input, description: "Region served by this center; several active centers may share one region, and the regional assignment rule chooses among them", constraints: "enum {NE, MW, SO, WE}" }
      - { name: is_active, type: boolean, source: input, description: "Accepting new assignments and orders", default: true }
      - { name: insulation_profile, type: enum, source: input, description: "Insulation grade packed at this center", constraints: "enum {LIGHT, MEDIUM, HEAVY}" }
      - { name: serving_cycle_index, type: integer, source: system, description: "Owning cycles currently in BUILDING status at this center", default: 0 }
      - { name: max_concurrent_building_cycles, type: integer, source: input, description: "Capacity of simultaneously BUILDING cycles, 1..100", default: 1, constraints: "integer >= 1 and <= 100" }
      - { name: forward_posture, type: enum, source: computed, description: "Derived aggregate gating all build and pack operations at this center", constraints: "enum {OPEN, CONSTRAINED, DEGRADED}" }
      - { name: open_claim_count, type: integer, source: computed, description: "Count of QualityClaims at this center whose status is IN_REVIEW or UNDER_REVIEW" }

  # --- Supplier ---------------------------------------------------------------------
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier legal name; unique across all Suppliers" }
      - { name: region, type: enum, source: input, description: "Sourcing region the supplier ships from", constraints: "enum {NE, MW, SO, WE}" }
      - { name: relationship_status, type: enum, source: computed, description: "Derived supplier relationship tier from the reliability score", constraints: "enum {PREFERRED, STANDARD, ON_WATCH, SUSPENDED}" }
      - { name: reliability_score_bp, type: integer, source: computed, description: "Weighted on-time / acceptance / quality score in basis points, 0..10000" }
      - { name: lots_awarded_total, type: integer, source: computed, description: "Count of SupplyLots awarded to this supplier, lifetime" }
      - { name: lots_accepted_total, type: integer, source: computed, description: "Count of awarded SupplyLots that cleared make-ready QC, lifetime" }
      - { name: lots_on_time_total, type: integer, source: computed, description: "Count of awarded SupplyLots whose arrived_at is not after the awarded ready_date, lifetime" }
      - { name: claims_upheld_total, type: integer, source: computed, description: "Count of QualityClaims resolved UPHELD against lots from this supplier, lifetime" }
      - { name: status, type: enum, source: system, description: "Administrative supplier standing", constraints: "enum {ACTIVE, SUSPENDED}" }

  # --- SupplyLot: one procured surplus lot -------------------------------------------
  - name: SupplyLot
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the supplier that offered this lot" }
      - { name: fulfillment_center_id, type: string, source: input, description: "FK -> FulfillmentCenter.id; the lane the lot is sourced into" }
      - { name: product_name, type: string, source: input, description: "Display name of the produce or grocery item" }
      - { name: category, type: enum, source: input, description: "Product category; drives preference matching and credit citations", constraints: "enum {FRUIT, VEGETABLE, DAIRY, BAKERY, PANTRY, BEVERAGE}" }
      - { name: procurement_grade, type: enum, source: input, description: "Why the lot is discounted", constraints: "enum {OFF_SPEC, SURPLUS, SHORT_DATED, COSMETIC}" }
      - { name: unit_weight_grams, type: integer, source: input, description: "Weight of one unit in grams; drives billing weight apportionment" }
      - { name: quantity_available, type: integer, source: input, description: "Units currently on hand at the lane, decremented by every build" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Procured cost of one unit in cents" }
      - { name: harvest_date, type: string, source: input, description: "ISO 8601 UTC date the produce was harvested" }
      - { name: shelf_life_days, type: integer, source: computed, description: "Whole days from harvest_date to expiry_date, inclusive of neither boundary" }
      - { name: expiry_date, type: input_and_computed, source: input, description: "ISO 8601 UTC date the lot expires; supplier-declared at creation and recomputed from the category shelf-life matrix when the lot is awarded" }
      - { name: allergen_codes, type: array, source: input, description: "Allergen codes present in this lot; empty array means allergen-free; sorted ascending for comparison", default: "[]" }
      - { name: preference_tags, type: array, source: input, description: "Preference tags this lot can satisfy; sorted ascending for comparison" }
      - { name: preference_eligible, type: boolean, source: computed, description: "True when preference_tags contains at least one element" }
      - { name: billing_weight_grams, type: integer, source: computed, description: "Unit weight used for billing, never below the fruit minimum" }
      - { name: display_price_cents, type: computed, description: "Per-item displayed price in cents, computed by the display-price rule" }
      - { name: ready_date, type: string, source: input, description: "ISO 8601 UTC date the supplier promised the lot would arrive at make-ready" }
      - { name: status, type: enum, source: system, description: "Procurement lifecycle status", constraints: "enum {QUOTED, AWARDED, READY, COMMITTED, DEPLETED, EXPIRED}" }
      - { name: quality_status, type: enum, source: computed, description: "Derived make-ready quality outcome; gates whether the lot may be drawn into boxes", constraints: "enum {PENDING_INSPECTION, PASS, INVESTIGATION, REJECTED}" }
      - { name: arrived_at, type: string, source: system, description: "ISO 8601 UTC timestamp stamped when the lot enters make-ready inspection; null before then" }

  # --- SourcingBid: one supplier's offer against one lot ------------------------------
  - name: SourcingBid
    parent: null
    common_fields: true
    fields:
      - { name: supply_lot_id, type: string, source: input, description: "FK -> SupplyLot.id; the lot being bid on" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the bidding supplier" }
      - { name: bid_unit_cost_cents, type: integer, source: input, description: "Offered cost of one unit in cents" }
      - { name: quantity_offered, type: integer, source: input, description: "Units the supplier can make available" }
      - { name: status, type: enum, source: system, description: "Bid lifecycle status", constraints: "enum {PENDING, SHORTLISTED, SELECTED, NOT_SELECTED, WITHDRAWN}" }

  # --- ConventionalQuote: substantiation evidence for the retail comparison ------------
  - name: ConventionalQuote
    parent: null
    common_fields: true
    fields:
      - { name: supply_lot_id, type: string, source: input, description: "FK -> SupplyLot.id; the lot whose display price is being substantiated" }
      - { name: retailer_label, type: string, source: input, description: "Name of the conventional retailer the reference price came from" }
      - { name: source_url, type: string, source: input, description: "URL of the captured reference price" }
      - { name: captured_at, type: string, source: input, description: "ISO 8601 UTC timestamp the reference price was captured" }
      - { name: conventional_unit_price_cents, type: integer, source: input, description: "Conventional retail price of one comparable unit in cents" }
      - { name: barcode_gtin, type: string, source: input, description: "GTIN-14 barcode consulted for the comparison; exactly 14 digits" }
      - { name: grade_equivalent, type: boolean, source: input, description: "True when the comparable unit is the same procurement grade as the lot", default: false }
      - { name: source_count, type: integer, source: computed, description: "Number of substantiating sources of this lot's grade, capped at the substantiation maximum" }
      - { name: is_primary, type: boolean, source: computed, description: "True on the deterministic primary source of its lot; exactly one primary per lot" }
      - { name: substantiation_status, type: enum, source: computed, description: "Derived substantiation outcome", constraints: "enum {UNSUBSTANTIATED, SUBSTANTIATED}" }

  # --- BoxOrder: one customer's box for one service cycle ------------------------------
  - name: BoxOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscribing customer" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; the subscription that generated this order" }
      - { name: serving_cycle_index, type: integer, source: input, description: "Monotonic cycle number this box belongs to, starting at 1" }
      - { name: fulfillment_center_id, type: string, source: computed, description: "FK -> FulfillmentCenter.id; copied from the customer's home center at creation" }
      - { name: routing_region, type: enum, source: computed, description: "Region used for cold-chain lane selection; mirrors the assigned center's region", constraints: "enum {NE, MW, SO, WE}" }
      - { name: cuisine_preference, type: enum, source: input, description: "Requested box flavour", constraints: "enum {STANDARD, FRUIT_FORWARD, VEGGIE_FORWARD, BAKERY_FORWARD, PANTRY_FORWARD}" }
      - { name: status, type: enum, source: system, description: "Box lifecycle status; the fulfillment dimension", constraints: "enum {DRAFT, AWAITING_WINDOW, READY_TO_BUILD, BUILDING, REROUTED, CRASHED, PACKED, SHIPPED}" }
      - { name: pricing_status, type: enum, source: system, description: "Independent pricing dimension on the same row", constraints: "enum {UNPRICED, PRICED, REVISED}" }
      - { name: lines_total_cents, type: integer, source: computed, description: "Sum of display_price_cents over the box's qualifiable build items" }
      - { name: weight_total_grams, type: integer, source: computed, description: "Sum of billed_unit_weight_grams over the box's remaining build items" }
      - { name: conventional_total_cents, type: integer, source: computed, description: "Weight-apportioned conventional retail equivalent of the whole box" }
      - { name: order_discount_cents, type: integer, source: computed, description: "Rate-based order discount, zero below the gating subtotal" }
      - { name: service_fee_cents, type: computed, description: "Flat service fee, waived for grandfathered accounts" }
      - { name: subtotal_cents, type: computed, description: "Discounted merchandise subtotal; only the base of the sales-tax tier" }
      - { name: tax_cents, type: computed, description: "Sales tax on the subtotal tier only" }
      - { name: shipped_total_cents, type: computed, description: "Customer-facing total: subtotal + tax + service fee" }
      - { name: ready_deadline, type: string, source: computed, description: "ISO 8601 UTC instant the order must reach READY_TO_BUILD" }
      - { name: build_deadline, type: string, source: computed, description: "ISO 8601 UTC instant the build must complete" }
      - { name: cutoff_met, type: boolean, source: computed, description: "True when created_at is strictly before ready_deadline" }
      - { name: build_blocked, type: boolean, source: computed, description: "True when the owning center's forward_posture is not OPEN" }
      - { name: cold_chain_selected, type: boolean, source: computed, description: "True once a cold-chain pack exists for this order" }
      - { name: credit_cents_issued, type: computed, description: "Lifetime quality credits issued against this order" }
      - { name: allocation_used_cents, type: integer, source: computed, description: "Lifetime allocation drawn against this order by the allocation cascade" }

  # --- BoxBuildItem: one physical line inside a built box -------------------------------
  - name: BoxBuildItem
    parent: null
    common_fields: true
    fields:
      - { name: box_order_id, type: string, source: input, description: "FK -> BoxOrder.id; the box this line belongs to" }
      - { name: supply_lot_id, type: string, source: input, description: "FK -> SupplyLot.id; the lot the line was drawn from" }
      - { name: category, type: enum, source: input, description: "Category copied from the supply lot at build time", constraints: "enum {FRUIT, VEGETABLE, DAIRY, BAKERY, PANTRY, BEVERAGE}" }
      - { name: units, type: integer, source: input, description: "Units of the lot placed in the box" }
      - { name: billed_unit_weight_grams, type: integer, source: computed, description: "Frozen billing weight per unit at build time" }
      - { name: line_price_cents, type: computed, description: "Displayed line price in cents for this build item" }
      - { name: item_type, type: enum, source: system, description: "How the line entered the box", constraints: "enum {PREFERENCE, FILLER, RETAINED}" }
      - { name: status, type: enum, source: computed, description: "Line lifecycle status", constraints: "enum {INCLUDED, REMOVED}" }
      - { name: allocation_credited_cents, type: computed, description: "Allocation dollars consumed by this line's preference asset" }

  # --- ColdChainPack: the cold-chain decision for one order ----------------------------
  - name: ColdChainPack
    parent: null
    common_fields: true
    fields:
      - { name: box_order_id, type: string, source: input, description: "FK -> BoxOrder.id; the box being packed" }
      - { name: lane_fulfillment_center_id, type: string, source: input, description: "FK -> FulfillmentCenter.id; the center the lane runs from" }
      - { name: cold_item_weight_grams, type: computed, description: "Weight of the box's cold-chain-eligible items, non-cold weight force-added" }
      - { name: insulation_grade, type: enum, source: computed, description: "Selected insulation grade", constraints: "enum {LIGHT, MEDIUM, HEAVY}" }
      - { name: coolant_units, type: computed, description: "Whole coolant units selected by the cold-chain rule" }
      - { name: lane_transit_days, type: integer, source: computed, description: "Transit days for the lane at the center's current forward_posture" }
      - { name: selection_status, type: enum, source: computed, description: "Cold-chain selection outcome", constraints: "enum {SELECTED, NOT_REQUIRED}" }

  # --- QualityClaim: a spoiled-arrival credit request ----------------------------------
  - name: QualityClaim
    parent: null
    common_fields: true
    fields:
      - { name: box_order_id, type: string, source: input, description: "FK -> BoxOrder.id; the order the credit is claimed against" }
      - { name: box_build_item_id, type: string, source: input, description: "FK -> BoxBuildItem.id; the specific line claimed spoiled" }
      - { name: supply_lot_id, type: string, source: computed, description: "FK -> SupplyLot.id; derived from the claimed build item" }
      - { name: reason_code, type: enum, source: input, description: "Why the arrival was spoiled", constraints: "enum {SPOILED, DAMAGED, MISSING_ITEM, TEMPERATURE_ABUSE}" }
      - { name: photo_url, type: string, source: input, description: "Photo evidence URL; must end in .jpg .jpeg .png .webp or .heic" }
      - { name: requested_credit_cents, type: integer, source: input, description: "Credit requested by the customer in cents" }
      - { name: credited_cents, type: computed, description: "Credit actually issued in cents; zero until the claim is UPHELD" }
      - { name: status, type: enum, source: system, description: "Claim lifecycle status", constraints: "enum {IN_REVIEW, UNDER_REVIEW, CLOSED, UPHELD, REJECTED}" }
      - { name: outcome, type: enum, source: input, description: "Reviewer decision; null until reviewed", constraints: "enum {UPHELD, REJECTED, null}" }
      - { name: cited_lot_quality_status, type: enum, source: computed, description: "Snapshot of the cited lot's quality_status taken when the claim was created", constraints: "enum {PENDING_INSPECTION, PASS, INVESTIGATION, REJECTED}" }

  # --- Subscription: cadence row --------------------------------------------------------
  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the subscribing customer" }
      - { name: cadence, type: enum, source: input, description: "Delivery cadence whose periods equal the cycle index", constraints: "enum {WEEKLY, BIWEEKLY, MONTHLY}" }
      - { name: home_fulfillment_center_id, type: string, source: computed, description: "FK -> FulfillmentCenter.id; copied from the customer's home center" }
      - { name: serving_cycle_index, type: integer, source: system, description: "Current service cycle number, starting at 1", default: 1 }
      - { name: skipped_cycle_index, type: integer, source: computed, description: "Cycle explicitly skipped by the customer; null when none, cleared on resume" }
      - { name: skipped_on, type: string, source: system, description: "ISO 8601 UTC timestamp the most recent skip was recorded; null when none" }
      - { name: paused_at, type: string, source: system, description: "ISO 8601 UTC timestamp the subscription was paused; null when not paused" }
      - { name: resumed_at, type: string, source: system, description: "ISO 8601 UTC timestamp the subscription was last resumed; null when never resumed" }
      - { name: pause_count, type: integer, source: computed, description: "Number of hops this subscription has entered PAUSED, 0..4" }
      - { name: status, type: enum, source: system, description: "Subscription lifecycle status", constraints: "enum {ACTIVE, SKIPPED, AUTO_SKIPPED, PAUSED, CANCELLED}" }
      - { name: cancellation_reason, type: enum, source: input, description: "Reason recorded when the subscription is cancelled", constraints: "enum {CUSTOMER_REQUEST, NONPAYMENT, null}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- SourcingBid: branching fork-join with three joins ---------------------
  - entity: SourcingBid
    field: status
    initial_state: PENDING
    terminal_states: [SELECTED, NOT_SELECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: SHORTLISTED
        trigger: "POST /supply-lots/{id}/award with bidder_quota == 1"
        actor: PlatformAdmin
        preconditions:
          - "The lot is in AWARDED status"
          - "The bid's supplier status is ACTIVE"
        side_effects:
          - "The sole shortlisted bid is immediately joined: SourcingBid.status -> SELECTED"
          - "SupplyLot.status -> READY"
      - from: SHORTLISTED
        to: SELECTED
        trigger: "POST /supply-lots/{id}/award with bidder_quota >= 2 (top-ranked branch)"
        actor: PlatformAdmin
        preconditions:
          - "The lot is in AWARDED status"
          - "Bid is the highest-ranked of the shortlist by the allocation selector"
        side_effects:
          - "SupplyLot.status -> READY"
          - "All other shortlisted bids -> NOT_SELECTED"
      - from: SHORTLISTED
        to: NOT_SELECTED
        trigger: "POST /supply-lots/{id}/award with bidder_quota >= 2 (non-top-ranked branch)"
        actor: PlatformAdmin
        preconditions:
          - "The lot is in AWARDED status"
          - "Bid is not the highest-ranked of the shortlist"
        side_effects:
          - "Frees the supplier to re-bid on a future lot; no lot mutation"
      - from: PENDING
        to: NOT_SELECTED
        trigger: "POST /supply-lots/{id}/award when the lot is already READY"
        actor: PlatformAdmin
        preconditions:
          - "The lot is not in AWARDED status"
        side_effects:
          - "No lot mutation; the erroneous award attempt is recorded as a non-selected bid"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /sourcing-bids/{id}/withdraw"
        actor: Supplier
        preconditions:
          - "Bid status is PENDING"
        side_effects: []
      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "POST /sourcing-bids/{id}/withdraw"
        actor: Supplier
        preconditions:
          - "Bid status is SHORTLISTED"
          - "No award has been executed against the owning lot"
        side_effects:
          - "The bid leaves the shortlist candidate set immediately"

  # ---- SupplyLot: linear procurement pipeline with a QC gate ------------------
  - entity: SupplyLot
    field: status
    initial_state: QUOTED
    terminal_states: [COMMITTED, DEPLETED, EXPIRED]
    transitions:
      - from: QUOTED
        to: AWARDED
        trigger: "POST /supply-lots/{id}/award"
        actor: PlatformAdmin
        preconditions:
          - "At least one SourcingBid for this lot is in PENDING status"
        side_effects:
          - "Recomputes SupplyLot.expiry_date from the award shelf-life matrix and SupplyLot.shelf_life_days"
          - "SupplyLot.expiry_date recompute triggers the subscription shelf-life cascade"
          - "SourcingBid.status -> SHORTLISTED for up to bidder_quota bids"
          - "SourcingBid.status -> NOT_SELECTED for every remaining PENDING bid"
      - from: AWARDED
        to: READY
        trigger: "POST /supply-lots/{id}/award (selected-bid join) or POST /supply-lots/{id}/make-ready"
        actor: PlatformAdmin
        preconditions:
          - "SupplyLot.quality_status == PASS"
        side_effects:
          - "SupplyLot.arrived_at -> current logical clock"
          - "Recomputes Supplier.reliability_score_bp from the lifetime counters"
          - "Supplier.reliability_score_bp recompute triggers Supplier.relationship_status"
      - from: READY
        to: COMMITTED
        trigger: "POST /box-orders/{id}/finalize"
        actor: Customer
        preconditions:
          - "No READY_TO_BUILD, BUILDING or REROUTED order of the lot's fulfillment center has an unallocated remainder"
        side_effects:
          - "Reserves units against the allocation plan"
      - from: READY
        to: DEPLETED
        trigger: "POST /box-orders/{id}/build when every unit has been consumed"
        actor: FulfillmentOperator
        preconditions:
          - "SupplyLot.quality_status == PASS"
          - "No READY_TO_BUILD, BUILDING or REROUTED order of the lot's fulfillment center has an unallocated remainder"
        side_effects:
          - "Lot is removed from every future build candidate set"

  # ---- SupplyLot quality dimension: derived posture on the same entity --------
  - entity: SupplyLot
    field: quality_status
    initial_state: PENDING_INSPECTION
    terminal_states: [PASS, REJECTED]
    transitions:
      - from: PENDING_INSPECTION
        to: PASS
        trigger: "POST /supply-lots/{id}/make-ready"
        actor: PlatformAdmin
        preconditions:
          - "Supplier.status == ACTIVE"
          - "No QualityClaim citing any lot of this lot's fulfillment center is in UNDER_REVIEW status"
        side_effects:
          - "Recomputes FulfillmentCenter.open_claim_count for the lane"
          - "FulfillmentCenter.open_claim_count recompute triggers FulfillmentCenter.forward_posture"
      - from: PASS
        to: INVESTIGATION
        trigger: "POST /quality-claims/{id}/review with outcome REJECTED"
        actor: PlatformAdmin
        preconditions:
          - "The claim cites a build item drawn from this lot"
          - "No other claim citing this lot is already UNDER_REVIEW"
        side_effects:
          - "Recomputes FulfillmentCenter.open_claim_count for the lane"
          - "FulfillmentCenter.open_claim_count recompute triggers FulfillmentCenter.forward_posture"
      - from: INVESTIGATION
        to: PASS
        trigger: "POST /quality-claims/{id}/review with outcome UPHELD"
        actor: PlatformAdmin
        preconditions:
          - "The claim citing this lot is in UNDER_REVIEW status"
        side_effects:
          - "Recomputes FulfillmentCenter.open_claim_count for the lane"
          - "FulfillmentCenter.open_claim_count recompute triggers FulfillmentCenter.forward_posture"
      - from: INVESTIGATION
        to: REJECTED
        trigger: "system (a second claim citing a lot already in INVESTIGATION is UPHELD)"
        actor: system
        preconditions:
          - "The lot's quality_status is INVESTIGATION"
          - "The newly upheld claim cites this same lot"
        side_effects:
          - "Every SupplyLot of the same supplier and lane whose status is QUOTED or AWARDED -> EXPIRED"
          - "SupplyLot.status rows flipping to EXPIRED recompute Supplier.reliability_score_bp"

  # ---- FulfillmentCenter forward posture: derived aggregate -------------------
  - entity: FulfillmentCenter
    field: forward_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CONSTRAINED
        trigger: "system (the center's serving_cycle_index reaches its cap)"
        actor: system
        preconditions:
          - "serving_cycle_index >= max_concurrent_building_cycles"
        side_effects:
          - "Rejects POST /box-orders and POST /box-orders/{id}/build at this center with ERR_CENTER_FORWARD_LOCKED"
          - "POST /box-orders/{id}/finalize remains admitted, so the counter can still be advanced"
      - from: CONSTRAINED
        to: OPEN
        trigger: "system (serving_cycle_index drops strictly below the cap)"
        actor: system
        preconditions:
          - "serving_cycle_index < max_concurrent_building_cycles"
        side_effects:
          - "Re-admits new orders and builds at this center"
      - from: CONSTRAINED
        to: DEGRADED
        trigger: "system (the center's serving_cycle_index passes its cap)"
        actor: system
        preconditions:
          - "serving_cycle_index >= max_concurrent_building_cycles + 1"
        side_effects:
          - "Rejects POST /box-orders and POST /box-orders/{id}/build at this center with ERR_CENTER_FORWARD_LOCKED"
          - "Every BoxOrder of this center whose status is BUILDING, READY_TO_BUILD or AWAITING_WINDOW -> REROUTED"
          - "BoxOrder rows flipping to REROUTED have every BoxBuildItem -> REMOVED and every lot's quantity_available restored by the removed units"
          - "ColdChainPack rows of those orders recompute lane_transit_days and re-select insulation and coolant"
      - from: DEGRADED
        to: CONSTRAINED
        trigger: "system (serving_cycle_index falls back to the cap)"
        actor: system
        preconditions:
          - "serving_cycle_index < max_concurrent_building_cycles + 1"
        side_effects:
          - "REROUTED orders remain REROUTED; no automatic return to READY_TO_BUILD"

  # ---- BoxOrder: branching with revert ----------------------------------------
  - entity: BoxOrder
    field: status
    initial_state: DRAFT
    terminal_states: [PACKED, SHIPPED]
    transitions:
      - from: DRAFT
        to: AWAITING_WINDOW
        trigger: "POST /box-orders/{id}/finalize"
        actor: Customer
        preconditions:
          - "cutoff_met == true"
          - "The owning center's forward_posture is not DEGRADED"
        side_effects:
          - "Increments the owning center's serving_cycle_index"
          - "Increments Subscription.serving_cycle_index by one full cadence period"
          - "The center's serving_cycle_index increment triggers FulfillmentCenter.forward_posture"
      - from: AWAITING_WINDOW
        to: READY_TO_BUILD
        trigger: "system (logical clock reaches ready_deadline)"
        actor: system
        preconditions:
          - "No READY_TO_BUILD, BUILDING or REROUTED order of the same center has an unallocated remainder"
        side_effects:
          - "Recomputes SupplyLot.quality_status gate for every lot in the candidate set"
      - from: READY_TO_BUILD
        to: DRAFT
        trigger: "system (logical clock reaches build_deadline before the build completes)"
        actor: system
        preconditions:
          - "No BoxBuildItem of this order has status INCLUDED"
        side_effects:
          - "Decrements the owning center's serving_cycle_index by one"
          - "Decrements Subscription.serving_cycle_index by one full cadence period"
          - "The center's serving_cycle_index decrement triggers FulfillmentCenter.forward_posture"
      - from: AWAITING_WINDOW
        to: REROUTED
        trigger: "system (owning center enters DEGRADED)"
        actor: system
        preconditions:
          - "FulfillmentCenter.forward_posture of the owning center == DEGRADED"
        side_effects:
          - "BoxOrder.build_blocked -> true"
          - "Every ColdChainPack of this order recomputes lane_transit_days and re-selects insulation and coolant"
      - from: READY_TO_BUILD
        to: REROUTED
        trigger: "system (owning center enters DEGRADED) or system (build deadline passes)"
        actor: system
        preconditions:
          - "FulfillmentCenter.forward_posture of the owning center == DEGRADED"
        side_effects:
          - "Every BoxBuildItem of this order -> REMOVED"
          - "The removals trigger reprice_box_lines, leaving pricing_status REVISED"
      - from: BUILDING
        to: REROUTED
        trigger: "system (owning center enters DEGRADED) or POST /box-orders/{id}/crash-out"
        actor: "system or PlatformAdmin"
        preconditions:
          - "FulfillmentCenter.forward_posture of the owning center == DEGRADED, or the acting PlatformAdmin has cited a cold-chain failure"
        side_effects:
          - "Every BoxBuildItem of this order -> REMOVED"
          - "Every cited lot's quantity_available is restored by the removed line's units"
          - "The removals trigger reprice_box_lines, leaving pricing_status REVISED and lines_total_cents 0"
      - from: REROUTED
        to: READY_TO_BUILD
        trigger: "POST /box-orders/{id}/build after the owning center leaves DEGRADED"
        actor: FulfillmentOperator
        preconditions:
          - "FulfillmentCenter.forward_posture of the owning center is not DEGRADED"
          - "cutoff_met == true"
        side_effects:
          - "BoxOrder.build_blocked -> false"
      - from: READY_TO_BUILD
        to: BUILDING
        trigger: "POST /box-orders/{id}/build"
        actor: FulfillmentOperator
        preconditions:
          - "BoxOrder.build_deadline is not before the logical clock"
          - "cutoff_met == true"
        side_effects:
          - "Builds up to six BoxBuildItems by the allocation cascade"
          - "Every included line decrements SupplyLot.quantity_available and §1.3 lot pricing"
          - "Recomputes BoxOrder.lines_total_cents, weight_total_grams, subtotal_cents, tax_cents, shipped_total_cents"
          - "The line insertion triggers reprice_box_lines and pricing_status -> PRICED"
      - from: BUILDING
        to: CRASHED
        trigger: "POST /box-orders/{id}/crash-out"
        actor: PlatformAdmin
        preconditions:
          - "BoxOrder.status is BUILDING"
        side_effects:
          - "BoxOrder.build_blocked -> true; the order keeps its build lines so a later claim has a build item to cite"
      - from: BUILDING
        to: PACKED
        trigger: "POST /box-orders/{id}/pack"
        actor: FulfillmentOperator
        preconditions:
          - "The owning center's forward_posture is not DEGRADED"
          - "Subscription.status in {ACTIVE, SKIPPED, AUTO_SKIPPED}"
        side_effects:
          - "Selects insulation grade and coolant units by lane and season"
          - "Creates exactly one ColdChainPack for the order"
          - "BoxOrder.cold_chain_selected -> true"
          - "Decrements the owning center's serving_cycle_index by one"
          - "Decrements Subscription.serving_cycle_index by one full cadence period"
      - from: REROUTED
        to: DRAFT
        trigger: "POST /box-orders/{id}/reroute-back"
        actor: PlatformAdmin
        preconditions:
          - "FulfillmentCenter.forward_posture of the owning center is not DEGRADED"
        side_effects:
          - "BoxOrder.build_blocked -> false"

  # ---- QualityClaim: branching with rework ------------------------------------
  - entity: QualityClaim
    field: status
    initial_state: IN_REVIEW
    terminal_states: [CLOSED, UPHELD, REJECTED]
    transitions:
      - from: IN_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /quality-claims/{id}/review with outcome REJECTED"
        actor: PlatformAdmin
        preconditions:
          - "The claim's created_at is strictly more than CLAIM_WINDOW_DAYS_ESCALATION after the cited BoxBuildItem's created_at"
          - "At least one QualityClaim citing the same supply lot was UPHELD strictly earlier in time"
        side_effects:
          - "SupplyLot.quality_status -> INVESTIGATION"
          - "Recomputes FulfillmentCenter.open_claim_count"
          - "FulfillmentCenter.open_claim_count recompute triggers FulfillmentCenter.forward_posture"
      - from: IN_REVIEW
        to: UPHELD
        trigger: "POST /quality-claims/{id}/review with outcome UPHELD"
        actor: PlatformAdmin
        preconditions:
          - "Claim's cited BoxBuildItem status is INCLUDED"
          - "SupplyLot.quality_status of the cited lot is PASS"
        side_effects:
          - "credited_cents -> the capped issued-credit formula"
          - "Increments Supplier.claims_upheld_total"
          - "Supplier.claims_upheld_total increment triggers Supplier.reliability_score_bp"
          - "Supplier.reliability_score_bp recompute triggers Supplier.relationship_status"
      - from: IN_REVIEW
        to: CLOSED
        trigger: "POST /quality-claims/{id}/review"
        actor: PlatformAdmin
        preconditions:
          - "Claim's created_at is at least CLAIM_WINDOW_DAYS before the current logical clock"
        side_effects:
          - "credited_cents stays zero; the claim is closed without a credit"
          - "Cited BoxBuildItem remains INCLUDED"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /quality-claims/{id}/review with outcome UPHELD"
        actor: PlatformAdmin
        preconditions:
          - "Claim cites a box whose status is PACKED or SHIPPED"
        side_effects:
          - "credited_cents -> the capped issued-credit formula"
          - "SupplyLot.quality_status of the cited lot -> PASS"
          - "Increments Supplier.claims_upheld_total"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /quality-claims/{id}/review with outcome REJECTED"
        actor: PlatformAdmin
        preconditions:
          - "SupplyLot.quality_status of the cited lot is INVESTIGATION"
        side_effects:
          - "credited_cents stays zero"
          - "SupplyLot.quality_status of the cited lot -> REJECTED"
          - "Recomputes FulfillmentCenter.open_claim_count"
      - from: REJECTED
        to: IN_REVIEW
        trigger: "POST /quality-claims/{id}/reopen"
        actor: PlatformAdmin
        preconditions:
          - "The cited lot's status is not EXPIRED"
        side_effects:
          - "Re-enters the archive; a fresh review decision is required"

  # ---- BoxOrder pricing dimension: parallel axis on the same row --------------
  - entity: BoxOrder
    field: pricing_status
    initial_state: UNPRICED
    terminal_states: []
    transitions:
      - from: UNPRICED
        to: PRICED
        trigger: "POST /box-orders/{id}/build (first lines inserted)"
        actor: FulfillmentOperator
        preconditions:
          - "BoxOrder.status is BUILDING"
        side_effects:
          - "lines_total_cents, subtotal_cents, tax_cents and shipped_total_cents are stamped"
      - from: PRICED
        to: REVISED
        trigger: "system (a planned line was retired after the first pricing pass)"
        actor: system
        preconditions:
          - "At least one planned line was retired to status REMOVED after the first pricing pass"
        side_effects:
          - "lines_total_cents re-derives from the INCLUDED lines only, and advance_provisional_delta records the difference"
          - "The resulting total is legitimately lower than the provisional reading"

  # ---- Subscription: cyclic cadence with skip and pause -----------------------
  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SKIPPED
        trigger: "POST /subscriptions/{id}/skip"
        actor: Customer
        preconditions:
          - "skipped_cycle_index < serving_cycle_index + 4"
        side_effects:
          - "skipped_cycle_index -> serving_cycle_index + 1"
          - "skipped_on -> current logical clock"
      - from: SKIPPED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume, or system (logical clock reaches the start of skipped_cycle_index)"
        actor: Customer
        preconditions:
          - "The logical clock has reached the start of skipped_cycle_index"
        side_effects:
          - "skipped_cycle_index -> null; skipped_on -> null"
      - from: ACTIVE
        to: AUTO_SKIPPED
        trigger: "POST /supply-lots/{id}/award (awarded shelf life strictly below the subscription shelf-life floor)"
        actor: system
        preconditions:
          - "SupplyLot.shelf_life_days < SUBSCRIPTION_MIN_SHELF_LIFE_DAYS"
        side_effects:
          - "skipped_cycle_index -> serving_cycle_index + 1"
      - from: AUTO_SKIPPED
        to: ACTIVE
        trigger: "system (logical clock reaches the start of skipped_cycle_index)"
        actor: system
        preconditions:
          - "The logical clock has reached the start of skipped_cycle_index"
        side_effects:
          - "skipped_cycle_index -> null"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer
        preconditions:
          - "pause_count < MAX_PAUSE_HOPS"
        side_effects:
          - "pause_count -> pause_count + 1; paused_at -> current logical clock"
      - from: SKIPPED
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer
        preconditions:
          - "pause_count < MAX_PAUSE_HOPS"
        side_effects:
          - "pause_count -> pause_count + 1; paused_at -> current logical clock"
      - from: AUTO_SKIPPED
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer
        preconditions:
          - "pause_count < MAX_PAUSE_HOPS"
        side_effects:
          - "pause_count -> pause_count + 1; paused_at -> current logical clock"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Customer
        preconditions:
          - "resumed_at is null or the logical clock is strictly after resumed_at"
        side_effects:
          - "resumed_at -> current logical clock; paused_at -> null"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /box-orders (a paused subscription may still receive a one-off order)"
        actor: Customer
        preconditions:
          - "The customer's subscription is the order's subscription_id candidate"
        side_effects:
          - "AUTO_SKIPPED -> ACTIVE; skipped_cycle_index -> null"
      - from: [ACTIVE, SKIPPED, AUTO_SKIPPED, PAUSED]
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions:
          - "No BoxOrder of this subscription has status BUILDING"
        side_effects:
          - "cancellation_reason is recorded; every DRAFT order of the subscription is abandoned"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-skip-stale-version
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/skip"
    occ_field: "expected_subscription_version"
    description: |
      A skip request carrying a Subscription version older than the one the
      client last observed is rejected: the subscription's plan has already
      advanced (a resume, a pause, or a server-side auto-skip changed it since
      the client read the row), so the client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: box-order-finalize-stale-version
    parent_entity: BoxOrder
    write_endpoint: "POST /box-orders/{id}/finalize"
    occ_field: "expected_box_order_version"
    description: |
      Finalising an order against a BoxOrder version older than the client's
      last read is rejected, because the cascade from a build or a reprice has
      legitimately rewritten the order's pricing and readiness fields since the
      client captured its view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: advance_box_order_pricing
    trigger: "POST /box-orders/{id}/finalize"
    algorithm: chronological
    formula: |
      # Lines are committed in the order the build plan gives them and priced
      # per line with round_half_up. A line that would take the running box unit
      # count past BOX_UNIT_TARGET is retired (status REMOVED) immediately after
      # the first pricing pass, and that is the only retiral path.
      for line in plan order:
          line_price_cents = round(line.billed_unit_weight_grams * lot.display_price_cents / 1000)
      PROVISIONAL lines_total_cents = sum(line_price_cents over every planned line)
      FINAL       lines_total_cents = sum(line_price_cents over lines whose status == INCLUDED)
      advance_provisional_delta = PROVISIONAL - FINAL
      weight_total_grams = sum(billed_unit_weight_grams over INCLUDED lines)
      The order's customer-visible total always uses FINAL.
      constants:
        ROUNDING_MODE: ROUND_HALF_UP
        BOX_UNIT_TARGET: 10
        SERVICE_FEE_CENTS: 599
        TAX_RATE: 0.05
        ORDER_DISCOUNT_GATE_CENTS: 5000
        ORDER_DISCOUNT_RATE: 0.10
    input_set: "Every line carried by the build plan, before retiral; the FINAL reading keeps only status INCLUDED rows"
    precision: "2 decimal places, round_half_up applied once per line under both readings"
    variants:
      - name: provisional_before_retiral
        when: "the delta report, advance_provisional_delta"
        difference: "Prices the plan before the over-target line is retired, so it overstates the total by exactly the retired line's line_price_cents"
      - name: final_after_retiral
        when: "the customer-facing shipped_total_cents"
        difference: "Prices only the lines that survive retiral, so it is the lower of the two readings whenever any line is retired"

  - name: display_price_markup
    trigger: "POST /supply-lots/{id}/make-ready and every GET of a SupplyLot"
    algorithm: tiered_pricing
    formula: |
      resolved_grade = quote.grade_equivalent ? lot.procurement_grade : 'CONVENTIONAL'
      multiplier = GRADE_RETAIL_MULTIPLIER[resolved_grade]
      base_cents = round(lot.unit_cost_cents * multiplier)          # round_half_up to whole cents
      per_unit_floor(cents) = round(lot.unit_cost_cents * FLOOR_MULTIPLIER[lot.category])
      display_price_cents = max(per_unit_floor(cents), base_cents)
      constants:
        GRADE_RETAIL_MULTIPLIER: {OFF_SPEC: 1.50, SURPLUS: 1.60, SHORT_DATED: 1.75, COSMETIC: 1.80, CONVENTIONAL: 1.40}
        FLOOR_MULTIPLIER: {FRUIT: 1.25, VEGETABLE: 1.25, DAIRY: 1.20, BAKERY: 1.35, PANTRY: 1.30, BEVERAGE: 1.30}
    input_set: "A SupplyLot plus its deterministic primary ConventionalQuote; when no quote exists the grade resolves to CONVENTIONAL"
    precision: "2 decimal places, round_half_up via ratio_round on the ratio (unit_cost_cents * multiplier) / 100"
    variants:
      - name: same_grade_reference
        when: "a quote tagged grade_equivalent exists"
        difference: "Multiplies by the lot's own procurement grade, which is the base case"
      - name: conventional_grade_reference
        when: "no quote tagged grade_equivalent exists"
        difference: "Falls back to the CONVENTIONAL multiplier when a non-equivalent quote exists, and to the same value when none exists"

  - name: billing_weight_apportion
    trigger: "POST /box-orders/{id}/build"
    algorithm: aggregation
    formula: |
      billed_unit_weight_grams = max(lot.unit_weight_grams, MIN_BILLING_WEIGHT_GRAMS[lot.category])
      constants:
        MIN_BILLING_WEIGHT_GRAMS: {FRUIT: 120, VEGETABLE: 120, DAIRY: 150, BAKERY: 200, PANTRY: 100, BEVERAGE: 300}
    input_set: "SupplyLot rows with quality_status PASS that the allocation cascade actually draws into the box"
    precision: "integer grams"
    variants:
      - name: actual_reference
        when: "diagnostics and the delta report"
        difference: "Uses lot.unit_weight_grams exactly, ignoring the per-category floor"
      - name: floor_equivalent
        when: "the customer-facing billed weight"
        difference: "Clamps to the per-category floor, so light items are billed at the floor"

  - name: retail_equivalent_average
    trigger: "GET /box-orders/{id}, POST /box-orders/{id}/build, POST /box-orders/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      conventional_total_cents = round(
        lines_total_cents * (sum(billed_unit_weight_grams * primary_quote_price_cents)
                             / sum(billed_unit_weight_grams * display_price_cents)))
      primary_quote_price_cents = the price of the lot's primary ConventionalQuote;
        when the lot has no quote at all, substitute display_price_cents for that line
        without clamping, and mark the box statistic as advisory.
      constants:
        ADVISORY_WHEN_UNQUOTED: true
        SAVE_PERCENT_FLOOR: 0
    input_set: "BoxBuildItem rows of the order with status INCLUDED and their cited lots' primary quotes"
    precision: "2 decimal places, round_half_up, applied once to the weighted ratio product"

  - name: placeholder_first_shortfall
    trigger: "POST /box-orders/{id}/build"
    algorithm: waterfall_allocation
    formula: |
      # Round 1: draw the visible placeholder into the box first.
      Weights before any line is confirmed:
        base_need = sum(lot.billing_weight_grams for the order's UNCONFIRMED placeholder lines)
        recalled  = PLACEHOLDER_BASE_NEED_GRAMS[category] * (1 + SHORTFALL_RATE)
      Round 2: fill the residual need, and only then deduct the recalled units.
      drawable = lots with quality_status == PASS
                      and quantity_available >= MIN_UNITS_PER_LINE(=2)
                      and allergen_codes disjoint from customer.dietary_allergy_codes
                      and status == READY
      deducted_units = units actually committed for the placeholder in round 1,
                       capped at recalled - placeholder_base_need(category)
      Builder choices: (a) ignore the deduction entirely and commit every drawable
      unit the residual needs, so available is overstated by the deduction;
      (b) deduct the recalled units BEFORE the residual fill, so legitimately
      drawable units are lost when a category pool is scarce. The scaffold pins
      (a): the deduction is applied only after the residual fill, so the two
      choices differ exactly when the category pool is fully drawn.
      constants:
        PLACEHOLDER_BASE_NEED_GRAMS: {FRUIT: 1200, VEGETABLE: 1200, DAIRY: 900, BAKERY: 800, PANTRY: 600, BEVERAGE: 2400}
        SHORTFALL_RATE: 0.10
    input_set: "Round-1 placeholder commitments plus the round-2 residual draw against the same category pool"
    precision: "integer grams and integer units; the deduction is applied once, after round 2"

  - name: allocate_box_lines
    trigger: "POST /box-orders/{id}/build"
    algorithm: waterfall_allocation
    formula: |
      # Two entry paths, both pinned:
      # (i) an explicit line_plan is honoured in the order given — each planned
      #     line is committed and priced in plan order, and any line that would
      #     take the running unit count past BOX_UNIT_TARGET is retired
      #     immediately after the first pricing pass;
      # (ii) with no plan, the class waterfall below fills the box.
      # Under (ii) the preference classes are drawn in fixed order; every class
      # is capped, and any unspent shortfall carries forward to the next class.
      pool = capped_pool(center, lot.category)
      cap_preference = ceil(0.60 * BOX_UNIT_TARGET)          # 6 units
      cap_filler     = ceil(0.20 * BOX_UNIT_TARGET)          # 2 units
      cap_specialty  = BOX_UNIT_TARGET - cap_preference - cap_filler   # 2 units
      for klass in [PREFERENCE_SET, PREFERENCE_ANY, FILLER, SPECIALTY]:
          take(kind) = min(remaining(pool), cap(kind) + unspent_from_earlier_classes)
          eligible = lots with quality_status == PASS
                     and quantity_available >= MIN_UNITS_PER_LINE(=2)
                     and allergen_codes disjoint from customer.dietary_allergy_codes
                     and status == READY
          rank(eligible) by (preference_tag_specificity DESC,
                             shelf_life_days DESC,
                             unit_cost_cents ASC,
                             lot.created_at ASC)
      constants:
        MIN_UNITS_PER_LINE: 2
        MAX_LINES_PER_BOX: 6
        BOX_UNIT_TARGET: 10
        PREFERENCE_RATIO: 0.60
        FILLER_RATIO: 0.20
        SPECIALTY_RATIO: 0.20
      input_set: "SupplyLot rows in the order's fulfillment center with quality_status PASS and status READY, before allergy filtering"
      precision: "integer units and integer cents"
      variants:
        - name: tiered_waterfall
          when: "the box is built at all"
          difference: "Fills PREFERENCE_SET then PREFERENCE_ANY then FILLER then SPECIALTY in order, each capped by its water-fill share"
        - name: rounding_remainder_to_last_class
          when: "ceil() allocations do not sum to the pool"
          difference: "The final class absorbs the rounding remainder, so specialty lines carry up to two units more than the 20 percent share"

  - name: cap_quality_credit
    trigger: "POST /quality-claims/{id}/review with outcome UPHELD"
    algorithm: threshold
    formula: |
      unit_credit = FLAT_UNIT_CREDIT_CENTS[claim.reason_code] * line.units * GRADE_MULTIPLIER[lot.procurement_grade]
      credited_cents = min(
          unit_credit,
          round(0.75 * line.line_price_cents),
          claim.requested_credit_cents + min(claim.requested_credit_cents, PER_CLAIM_GRACE_CENTS))
      constants:
        FLAT_UNIT_CREDIT_CENTS: {SPOILED: 300, DAMAGED: 350, MISSING_ITEM: 300, TEMPERATURE_ABUSE: 400}
        GRADE_MULTIPLIER: {OFF_SPEC: 1.00, SURPLUS: 1.00, SHORT_DATED: 1.10, COSMETIC: 1.15}
        PER_CLAIM_GRACE_CENTS: 200
        CLAIM_WINDOW_DAYS: 7
        CLAIM_WINDOW_DAYS_ESCALATION: 7
    input_set: "A QualityClaim whose cited BoxBuildItem has status INCLUDED and whose lot quality_status is PASS"
    precision: "2 decimal places, round_half_up applied to the line cap before the min chain"
    variants:
      - name: cap_then_grace
        when: "always, and this is the value written to credited_cents"
        difference: "Takes the 75 percent line cap first and then the grace ceiling, so whichever ceiling is lower wins"
      - name: grace_then_cap
        when: "the reconciliation report exposes it as credit_ceiling_delta_cents"
        difference: "Takes the grace ceiling first and then the 75 percent line cap as a floor, so it returns the larger of the two ceilings"

  - name: reliability_score
    trigger: "POST /supply-lots/{id}/make-ready, POST /supply-lots/{id}/award, POST /quality-claims/{id}/review"
    algorithm: weighted_scoring
    formula: |
      on_time_bp   = round(10000 * lots_on_time_total / lots_awarded_total)
      acceptance_bp = round(10000 * lots_accepted_total / lots_awarded_total)
      quality_bp   = round(10000 * (lots_accepted_total - claims_upheld_total) / lots_accepted_total)
      reliability_score_bp = round(0.40 * on_time_bp + 0.40 * acceptance_bp + 0.20 * quality_bp)
      Denominator guards: when lots_accepted_total == 0, quality_bp is pinned to 10000.
      relationship_status = PREFERRED if score >= 9000, STANDARD if score >= 7500,
                            ON_WATCH if score >= 6000, SUSPENDED if score < 6000
      constants:
        ON_TIME_WEIGHT: 0.40
        ACCEPTANCE_WEIGHT: 0.40
        QUALITY_WEIGHT: 0.20
        PREFERRED_FLOOR_BP: 9000
        STANDARD_FLOOR_BP: 7500
        ON_WATCH_FLOOR_BP: 6000
    input_set: "Lifetime counters on Supplier at the moment of the triggering transition"
    precision: "integer basis points, round_half_up on each ratio before weighting"
    variants:
      - name: lifetime_counters
        when: "always, and this is the value written to reliability_score_bp"
        difference: "Divides by lots_awarded_total counted over the supplier's whole history, so one early bad lot is diluted by every later good one"
      - name: trailing_window_counters
        when: "the supplier relationship report exposes it as trailing_90d_reliability_score_bp"
        difference: "Divides by the lots awarded within the 90 logical days before the trigger, so an old bad lot falls out of the denominator entirely"

  - name: regional_center_assignment
    trigger: "POST /customers/register (only when home_fulfillment_center_id is omitted), PUT /fulfillment-centers/{id}"
    algorithm: constraint_propagation
    formula: |
      candidates = FulfillmentCenter rows with is_active == true and region == customer.service_region
      ranked = candidates sorted by (code ASC)
      winner = ranked[0]
      Side effects: Customer.home_fulfillment_center_id = winner.id;
                    every Subscription of the customer is re-pinned to winner.id.
      This DEFAULT variant is the one in force on both customer registration and center mutation.
      constants:
        ASSIGNMENT_STRATEGY: "LEAST_LOADED_THEN_CODE"
    input_set: "FulfillmentCenter rows in the customer's service_region with is_active true"
    precision: "n/a (identifier selection)"
    variants:
      - name: default_least_loaded_then_code
        when: "always, on POST /customers/register and on PUT /fulfillment-centers/{id}"
        difference: "Fills the active centers of a region in code order so load spreads across the whole region; a one-center region therefore receives every customer of that region"
      - name: legacy_single_nearest_center
        when: "the legacy behavior retained for the migration report"
        difference: "Pins every customer of a region to the first active center created in that region, so the center chosen at signup never moves afterwards"

  - name: cold_chain_selection
    trigger: "POST /box-orders/{id}/pack"
    algorithm: threshold
    formula: |
      cold_item_weight_grams = sum(
          billed_unit_weight_grams for lines whose category in {FRUIT, VEGETABLE, DAIRY}
      ) + (sum(billed_unit_weight_grams for every other line) == 0 ? 250 : 0)
      lane_transit_days = LANE_TRANSIT_DAYS[order.routing_region]
                          + (center.forward_posture == DEGRADED ? 1 : 0)
      required = cold_item_weight_grams >= COLD_WEIGHT_REQUIRED_GRAMS
      insulated = order.routing_region in {WE, SO}
                  and lane_transit_days >= INSULATED_TRANSIT_MIN_DAYS
      if not required: insulation_grade = LIGHT; coolant_units = 0; selection_status = NOT_REQUIRED
      elif insulated:
          if lane_transit_days >= 4: insulation_grade = HEAVY; coolant_units = ceil(cold_item_weight_grams / COOLANT_UNIT_DIVISOR)
          else:                     insulation_grade = MEDIUM; coolant_units = ceil(cold_item_weight_grams / COOLANT_UNIT_DIVISOR)
      else:                         insulation_grade = MEDIUM; coolant_units = 2
      At a center whose forward_posture is DEGRADED the coolant load is exactly doubled.
      constants:
        LANE_TRANSIT_DAYS: {NE: 2, MW: 3, SO: 3, WE: 4}
        COLD_WEIGHT_REQUIRED_GRAMS: 1200
        INSULATED_TRANSIT_MIN_DAYS: 3
        COOLANT_UNIT_DIVISOR: 1500
    input_set: "BoxBuildItem rows of the order with status INCLUDED at the moment of packing"
    precision: "integer grams, integer transit days, integer coolant units via ceil"

  - name: order_window_plan
    trigger: "POST /box-orders, POST /box-orders/{id}/finalize, POST /box-orders/{id}/build"
    algorithm: threshold
    formula: |
      ready_deadline = start_of_service_cycle(order.serving_cycle_index)
                       - CUTOFF_LEAD_HOURS[center.region] hours
      cutoff_met = order.created_at < ready_deadline          # STRICTLY before
      build_deadline = start_of_service_cycle(order.serving_cycle_index)
                       + (center.forward_posture == DEGRADED
                          ? 2 * BUILD_WINDOW_HOURS
                          : BUILD_WINDOW_HOURS)
      within_build_window = now <= build_deadline             # at the deadline is still inside
      build_blocked = center.forward_posture != OPEN
      constants:
        CUTOFF_LEAD_HOURS: {NE: 36, MW: 48, SO: 48, WE: 60}
        BUILD_WINDOW_HOURS: 72
        HOURS_PER_CYCLE: {WEEKLY: 168, BIWEEKLY: 336, MONTHLY: 720}
    input_set: "The order, its subscription cadence, and the owning center's region and forward_posture"
    precision: "integer hours; instants are ISO 8601 UTC with three fractional digits"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role is one of Customer, Supplier, FulfillmentOperator, PlatformAdmin, Anonymous; when the role is entity-backed the X-User-ID resolves to a persisted instance of that entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role is permitted for the operation; entity-backed roles may only mutate resources they own (Customer owns BoxOrder and Subscription rows whose customer_id equals X-User-ID; Supplier owns SourcingBid rows whose supplier_id equals X-User-ID; FulfillmentOperator owns BoxOrder rows whose fulfillment_center_id equals X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request shape: every field the endpoint declares as required is present, every supplied enum member is a declared member, and barcode_gtin is exactly 14 digits"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "Path resources exist, checked left to right in path order; body foreign keys exist, checked in the order the endpoint's input list declares them"
    error_id: ERR_CUSTOMER_NOT_FOUND | ERR_BOX_ORDER_NOT_FOUND | ERR_BUILD_ITEM_NOT_FOUND | ERR_SUPPLY_LOT_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_FULFILLMENT_CENTER_NOT_FOUND | ERR_BID_NOT_FOUND
    http_status: 404
    applies_to: "all path and body references"

  - priority: 5
    category: state
    check: "The request's expected_<parent>_version equals the parent entity's current version (OCC, checked before the from-state test within this row), and the target resource is in a state that admits the requested transition or operation; BoxOrder rows whose status is CRASHED admit no further build, pack or finalize transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /produce/box-orders/{id}/finalize, POST /produce/box-orders/{id}/build, POST /produce/box-orders/{id}/pack, POST /produce/box-orders/{id}/reroute-back, POST /produce/subscriptions/{id}/resume, POST /produce/supply-lots/{id}/award, POST /produce/quality-claims/{id}/review"

  - priority: 6
    category: business_safety
    check: "Allergen exclusion: no lot whose allergen_codes intersect the customer's dietary_allergy_codes may be drawn into or remain inside a box"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: "POST /produce/box-orders/{id}/build, POST /produce/box-orders/{id}/finalize"

  - priority: 7
    category: business_safety
    check: "Credibility guard: a QualityClaim with requested_credit_cents == 0 is refused as not credible before any lot quality assessment"
    error_id: ERR_CLAIM_NOT_CREDIBLE
    http_status: 422
    applies_to: "POST /produce/quality-claims/{id}/review"

  - priority: 8
    category: business_temporal
    check: "Order cutoff: the order must have been created strictly before its ready_deadline"
    error_id: ERR_ORDER_CUTOFF_MISSED
    http_status: 422
    applies_to: "POST /produce/box-orders/{id}/finalize"

  - priority: 9
    category: business_constraint
    check: "Fulfillment-center forward posture permit: the owning center's forward_posture must be OPEN for order creation and for build start"
    error_id: ERR_CENTER_FORWARD_LOCKED
    http_status: 409
    applies_to: "POST /produce/box-orders, POST /produce/box-orders/{id}/build, POST /produce/box-orders/{id}/finalize"

  - priority: 10
    category: business_constraint
    check: "Substantiation requirement: a lot with a ConventionalQuote row must have at least one source of the lot's own procurement grade and no more than three sources before any display-price comparison on it is treated as substantiated"
    error_id: ERR_SUBSTANTIATION_REQUIRED
    http_status: 422
    applies_to: "POST /produce/conventional-quotes/{id}/substantiate, POST /produce/supply-lots/{id}/make-ready"

  - priority: 11
    category: business_constraint
    check: "Lot quality gate: only lots whose quality_status is PASS may be drawn into boxes or committed"
    error_id: ERR_LOT_QUALITY_HOLD
    http_status: 409
    applies_to: "POST /produce/box-orders/{id}/build, POST /produce/box-orders/{id}/finalize"

  - priority: 12
    category: business_constraint
    check: "Subscription cadence eligibility: the subscription must not be PAUSED or CANCELLED for a cycle-bound order, and the order may not duplicate an existing serving_cycle_index for the same subscription"
    error_id: ERR_SUBSCRIPTION_INELIGIBLE
    http_status: 409
    applies_to: "POST /produce/box-orders"

  - priority: 13
    category: business_constraint
    check: "Photo evidence: a QualityClaim must carry a photo_url whose path ends with an accepted image extension"
    error_id: ERR_CLAIM_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /produce/box-orders/{id}/quality-claims"

  - priority: 14
    category: business_fiscal
    check: "Single-use eligibility: a BoxOrder may be packed at most once per serving cycle; a second pack against an already-packed order is refused"
    error_id: ERR_ALREADY_ALLOCATED
    http_status: 409
    applies_to: "POST /produce/box-orders/{id}/pack"

  - priority: 15
    category: business_referential
    check: "Regional center availability: registration requires at least one active fulfillment center in the customer's service_region"
    error_id: ERR_NO_CENTER_AVAILABLE
    http_status: 422
    applies_to: "POST /produce/customers/register"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock -------------------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock. Before any call the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; the default sits at or before every default fixture date."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["Stamps the server's logical clock; every deadline, expiry and window rule reads this value"]

  # --- Customers ----------------------------------------------------------------
  - method: POST
    path: "/produce/customers/register"
    description: "Register a subscriber; assigns the home fulfillment center"
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [email, full_name, service_region, "home_fulfillment_center_id?", "dietary_allergy_codes?", "grandfathered_service_fee?"]
    output: Customer
    side_effects:
      - "When home_fulfillment_center_id is omitted, runs regional_center_assignment and stamps Customer.home_fulfillment_center_id; an explicit value is honoured unchanged"
      - "Rejects with ERR_NO_CENTER_AVAILABLE when the region has no active center"

  - method: GET
    path: "/produce/customers/{id}"
    description: "Read a subscriber"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/produce/customers"
    description: "List subscribers, optionally filtered by home center or service region"
    roles: [PlatformAdmin]
    code: 200
    input: ["home_fulfillment_center_id?", "service_region?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/produce/customers/{id}/box-orders"
    description: "List a customer's box orders"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: BoxOrder[]
    side_effects: []

  # --- Subscriptions ------------------------------------------------------------
  - method: POST
    path: "/produce/subscriptions"
    description: "Open a subscription for a customer"
    roles: [PlatformAdmin]
    code: 201
    input: [customer_id, cadence]
    output: Subscription
    side_effects:
      - "status=ACTIVE; serving_cycle_index=1; pause_count=0"
      - "home_fulfillment_center_id copied from the customer"

  - method: GET
    path: "/produce/subscriptions/{id}"
    description: "Read a subscription"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/produce/subscriptions/{id}/box-orders"
    description: "List the box orders a subscription has generated"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: BoxOrder[]
    side_effects: []

  - method: GET
    path: "/produce/subscriptions"
    description: "List subscriptions, optionally filtered by home center, cadence or status"
    roles: [PlatformAdmin]
    code: 200
    input: ["home_fulfillment_center_id?", "cadence?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/produce/subscriptions"
    description: "List subscriptions, optionally filtered"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/produce/customers/{id}/subscriptions"
    description: "List a customer's subscriptions"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/produce/subscriptions/{id}/skip"
    description: "Skip the next service cycle"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects:
      - "status -> SKIPPED; skipped_cycle_index -> serving_cycle_index + 1"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/produce/subscriptions/{id}/pause"
    description: "Pause the subscription"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> PAUSED; pause_count++"]

  - method: POST
    path: "/produce/subscriptions/{id}/resume"
    description: "Resume the subscription"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> ACTIVE; resumed_at stamped; skipped_cycle_index -> null"]

  - method: POST
    path: "/produce/subscriptions/{id}/cancel"
    description: "Cancel the subscription"
    roles: [Customer, PlatformAdmin]
    code: 200
    input: ["cancellation_reason?"]
    output: Subscription
    side_effects: ["status -> CANCELLED; DRAFT orders abandoned"]

  # --- Fulfillment centers -------------------------------------------------------
  - method: POST
    path: "/produce/fulfillment-centers"
    description: "Create a regional fulfillment center"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, region, "is_active?", insulation_profile, "max_concurrent_building_cycles?"]
    output: FulfillmentCenter
    side_effects: ["forward_posture=OPEN; serving_cycle_index=0; open_claim_count=0"]

  - method: GET
    path: "/produce/fulfillment-centers/{id}"
    description: "Read a fulfillment center"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FulfillmentCenter
    side_effects: []

  - method: GET
    path: "/produce/fulfillment-centers"
    description: "List fulfillment centers"
    roles: [PlatformAdmin]
    code: 200
    input: ["region?", "is_active?", "limit?", "offset?"]
    output: FulfillmentCenter[]
    side_effects: []

  - method: PUT
    path: "/produce/fulfillment-centers/{id}"
    description: "Update a fulfillment center and re-pin its region's subscribers"
    roles: [PlatformAdmin]
    code: 200
    input: ["is_active?", "insulation_profile?", "max_concurrent_building_cycles?", expected_fulfillment_center_version]
    output: FulfillmentCenter
    side_effects:
      - "runs regional_center_assignment for every Customer of this region"
      - "increments FulfillmentCenter.version by 1"

  - method: POST
    path: "/produce/fulfillment-centers/{id}/advance-cycle"
    description: "Close and roll the center's build cycle, decrementing its serving cycle index"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_fulfillment_center_version]
    output: FulfillmentCenter
    side_effects:
      - "serving_cycle_index -> max(0, serving_cycle_index - 1)"
      - "recomputes FulfillmentCenter.forward_posture from the counter"
      - "increments FulfillmentCenter.version by 1"

  - method: GET
    path: "/produce/fulfillment-centers/{id}/lots"
    description: "List the supply lots sourced into a center's lane"
    roles: [PlatformAdmin, FulfillmentOperator]
    code: 200
    input: []
    output: SupplyLot[]
    side_effects: []

  - method: GET
    path: "/produce/fulfillment-centers/{id}/cold-chain-packs"
    description: "List cold-chain packs packed at a center"
    roles: [PlatformAdmin, FulfillmentOperator]
    code: 200
    input: []
    output: ColdChainPack[]
    side_effects: []

  - method: GET
    path: "/produce/fulfillment-centers/{id}/customers"
    description: "List the subscribers whose home center is this center"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/produce/fulfillment-centers/{id}/subscriptions"
    description: "List the subscriptions pinned to this center"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/produce/fulfillment-centers/{id}/sourcing-bids"
    description: "List bids recorded against lots sourced into this center's lane"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SourcingBid[]
    side_effects: []

  - method: GET
    path: "/produce/fulfillment-centers/{id}/box-orders"
    description: "List the box orders served by this center"
    roles: [PlatformAdmin, FulfillmentOperator]
    code: 200
    input: ["status?"]
    output: BoxOrder[]
    side_effects: []

  # --- Suppliers ------------------------------------------------------------------
  - method: POST
    path: "/produce/suppliers"
    description: "Onboard a supplier"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region]
    output: Supplier
    side_effects: ["status=ACTIVE; reliability_score_bp=10000; relationship_status=PREFERRED"]

  - method: GET
    path: "/produce/suppliers/{id}"
    description: "Read a supplier"
    roles: [Supplier, PlatformAdmin]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/produce/suppliers"
    description: "List suppliers"
    roles: [PlatformAdmin]
    code: 200
    input: ["region?", "relationship_status?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []

  - method: GET
    path: "/produce/suppliers/{id}/sourcing-bids"
    description: "List the bids a supplier has placed across lots"
    roles: [Supplier, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: SourcingBid[]
    side_effects: []

  # --- Supply lots ------------------------------------------------------------------
  - method: POST
    path: "/produce/suppliers/{supplier_id}/lots"
    description: "List a new surplus lot offered by a supplier"
    roles: [Supplier, PlatformAdmin]
    code: 201
    input: [fulfillment_center_id, product_name, category, procurement_grade, unit_weight_grams, quantity_available, unit_cost_cents, harvest_date, expiry_date, "allergen_codes?", "preference_tags?", ready_date]
    output: SupplyLot
