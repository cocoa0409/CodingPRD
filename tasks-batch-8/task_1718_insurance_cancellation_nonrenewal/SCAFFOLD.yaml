    roles: [Underwriter, Policyholder]
    code: 201
    input: [policy_id, ground_code, expected_policy_version]
    output: CancellationCase
    side_effects:
      - "status -> PENDING_APPROVAL; requested_on_date = current clock date; requested_by_role = caller role"
      - "Compute return_method and earliest_effective_date"
      - "increments Policy.version by 1"
  - method: GET
    path: "/carrier/cancellation-cases/{caseId}"
    description: "Get a CancellationCase"
    roles: [ComplianceOfficer, Underwriter, Policyholder]
    code: 200
    input: []
