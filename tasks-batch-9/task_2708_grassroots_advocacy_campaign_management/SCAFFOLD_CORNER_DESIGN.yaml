            - "POST /advocacy/message-variants/{unknown}/submit -> response status == 404 with error_id == ERR_VARIANT_NOT_FOUND"
            - "POST /advocacy/coalition-partners/{unknown}/withdraw -> response status == 404 with error_id == ERR_PARTNER_NOT_FOUND"
            - "GET /advocacy/supporters/{unknown} -> response status == 404 with error_id == ERR_SUPPORTER_NOT_FOUND"
