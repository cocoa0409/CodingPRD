scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dormancy_date_basis_divergence
        grounds:
          - calculations.dormancy_date
          - entities.Property.dormancy_date
          - entities.PropertyType.dormancy_basis
        distinguishing_aspect: >
          Same property dates fed to two PropertyTypes yield different dormancy_date: the
          LAST_ACTIVITY basis anchors on last_activity_date (2020-01-01 -> 2023-01-01) while the
          ISSUANCE basis anchors on issue_date (2018-06-01 -> 2021-06-01). This is a Property-domain
          calc, distinct from the Claim-domain recovery_fee variant.
        test_recipe:
          setup:
            - "Two property types: AC01 (LAST_ACTIVITY) and MO02 (ISSUANCE), both 3-year dormancy."
            - "Two properties under the same holder carrying identical last_activity_date and issue_date, one per type."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: true, due_diligence_required: true, due_diligence_min_days: 60 }
              as: StateAdmin
              captures: { pt_activity_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_issuance_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_activity_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 100000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2018-06-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_activity_id: $.data.id, dd_activity: $.data.dormancy_date }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_issuance_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 100000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2018-06-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_issuance_id: $.data.id, dd_issuance: $.data.dormancy_date }
          trigger:
            - call: "GET /properties/${prop_issuance_id}"
              as: Holder
              as_user_id: "${holder_id}"
              captures: { dd_issuance_read: $.data.dormancy_date }
          assert:
            - "Property.${prop_activity_id}.dormancy_date == 2023-01-01T00:00:00Z"
            - "Property.${prop_issuance_id}.dormancy_date == 2021-06-01T00:00:00Z"
            - "Property.${prop_activity_id}.dormancy_date != Property.${prop_issuance_id}.dormancy_date"

      - name: recovery_fee_provisional_vs_final
        grounds:
          - calculations.recovery_fee
          - entities.Claim.provisional_fee_cents
          - entities.Claim.fee_cents
        distinguishing_aspect: >
          For the SAME claim the provisional fee (round(0.10 * face 100000) = 10000, at filing) differs
          from the final fee (round(0.10 * remitted 106000) = 10600, at approval) because interest of 6000
          accrued between face and remittance. This is a Claim-domain calc, distinct from the Property-domain
          dormancy_date variant.
        test_recipe:
          setup:
            - "An interest-bearing property (face 100000) escheated to CA with remitted_amount_cents 106000."
            - "A FIRM-filed claim on it with contract_fee_pct 0.10, examined and about to be approved."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: true, due_diligence_required: true, due_diligence_min_days: 60 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane Doe", ssn_last4: "1234", address_state: "CA", email: "jane@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /recovery-firms"
              payload: { legal_name: "FindIt LLC", registered_state: "CA", license_number: "L1", max_fee_pct: 0.10 }
              as: StateAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 100000, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /properties/${prop_id}/notices"
              payload: { method: "MAIL" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: StateAdmin
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 106000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "FIRM", recovery_firm_id: "${firm_id}", contract_fee_pct: 0.10 }
              as: RecoveryAgent
              as_user_id: "${firm_id}"
              captures: { claim_id: $.data.id, prov_fee: $.data.provisional_fee_cents }
            - call: "POST /claims/${claim_id}/examine"
              as: StateExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              as: StateApprover
              as_user_id: "appr-1"
              captures: { final_fee: $.data.fee_cents }
          assert:
            - "Claim.${claim_id}.provisional_fee_cents == 10000"
            - "Claim.${claim_id}.fee_cents == 10600"
            - "Claim.${claim_id}.provisional_fee_cents != Claim.${claim_id}.fee_cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: report_total_round_per_line_then_sum
        grounds:
          - calculations.report_total_remitted
          - calculations.escheat_remittance_amount
          - entities.HolderReport.total_remitted_cents
        distinguishing_aspect: >
          Mode (b) nested rounding: two interest-bearing properties with raw remittances 106010.6 and
          106540.6. Rounding per-property first then summing yields 106011 + 106541 = 212552, whereas
          summing raw then rounding once yields round(212551.2) = 212551. The scaffold pins per-line-then-sum,
          so total_remitted_cents MUST equal 212552.
        test_recipe:
          setup:
            - "A DRAFT CA report with two AC01 (interest-bearing, 3y) properties attached, faces 100010 and 100510."
            - "Logical clock at 2026-07-15 so years_dormant == 3 for both (interest factor 0.06)."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: true, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "A A", owner_last_known_state: "CA", amount_cents: 100010, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_a_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "C C", owner_last_known_state: "CA", amount_cents: 100510, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_c_id: $.data.id }
            - call: "POST /properties/${prop_a_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /properties/${prop_c_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: StateAdmin
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v0: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_a_id}", expected_report_version: "${rep_v0}" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { rep_v1: $.data.version }
          trigger:
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_c_id}", expected_report_version: "${rep_v1}" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { total_after: $.data.total_remitted_cents }
          assert:
            - "HolderReport.${report_id}.total_remitted_cents == 212552"
            - "HolderReport.${report_id}.property_count == 2"

      - name: claim_payout_waterfall_eval_order
        grounds:
          - calculations.claim_payout_waterfall
          - entities.Claim.fee_cents
          - entities.Claim.admin_deduction_cents
          - entities.Claim.net_payout_cents
        distinguishing_aspect: >
          Mode (c) circular-looking evaluation order: admin_deduction is keyed on post_fee (= claim_amount - fee),
          which depends on fee, which depends on claim_amount. For claim_amount 1000000, fee 100000, post_fee 900000
          (> 100000 threshold) selects the ADMIN_PCT branch: admin 4500, net 895500. Pinned order fee->post_fee->admin->net.
        test_recipe:
          setup:
            - "A non-interest MO02 property (face 1000000, ISSUANCE, no due diligence) escheated to CA with remitted 1000000."
            - "A FIRM claim on it (contract_fee_pct 0.10) examined and ready to approve."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Big Owner", ssn_last4: "9999", address_state: "CA", email: "big@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /recovery-firms"
              payload: { legal_name: "FindIt LLC", registered_state: "CA", license_number: "L1", max_fee_pct: 0.10 }
              as: StateAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Big Owner", owner_last_known_state: "CA", amount_cents: 1000000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 1000000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "FIRM", recovery_firm_id: "${firm_id}", contract_fee_pct: 0.10 }
              as: RecoveryAgent
              as_user_id: "${firm_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/examine"
              as: StateExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /claims/${claim_id}/approve"
              as: StateApprover
              as_user_id: "appr-1"
              captures: { fee: $.data.fee_cents, admin: $.data.admin_deduction_cents, net: $.data.net_payout_cents }
          assert:
            - "Claim.${claim_id}.claim_amount_cents == 1000000"
            - "Claim.${claim_id}.fee_cents == 100000"
            - "Claim.${claim_id}.admin_deduction_cents == 4500"
            - "Claim.${claim_id}.net_payout_cents == 895500"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_evidence_review_cycle
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_NEEDS_EVIDENCE
          - state_machines.Claim.NEEDS_EVIDENCE_to_UNDER_REVIEW
          - entities.EvidenceDocument.status
        distinguishing_aspect: >
          Cyclic shape on Claim: UNDER_REVIEW -> NEEDS_EVIDENCE -> (accept evidence, resubmit) -> UNDER_REVIEW,
          revisiting a previously-occupied state. Distinct entity from the HolderReport revise loop.
        test_recipe:
          setup:
            - "An OWNER claim on an escheated CA property, examined (UNDER_REVIEW), then moved to NEEDS_EVIDENCE."
            - "One accepted evidence document exists for the claim."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Jane Doe", ssn_last4: "1234", address_state: "CA", email: "jane@x.com" }
              as: StateAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 50000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/accept"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims"
              payload: { property_id: "${prop_id}", claimant_owner_id: "${owner_id}", filed_by: "OWNER" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/examine"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims/${claim_id}/request-evidence"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /claims/${claim_id}/evidence"
              payload: { doc_type: "GOV_ID" }
              as: Owner
              as_user_id: "${owner_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /claims/${claim_id}/evidence/${doc_id}/review"
              payload: { decision: "ACCEPTED" }
              as: StateExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /claims/${claim_id}/resubmit"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { status_after: $.data.status }
          assert:
            - "Claim.${claim_id}.status == UNDER_REVIEW"
            - "EvidenceDocument.${doc_id}.status == ACCEPTED"

      - name: report_reject_revise_loop
        grounds:
          - state_machines.HolderReport.UNDER_AUDIT_to_REJECTED
          - state_machines.HolderReport.REJECTED_to_DRAFT
          - entities.HolderReport.status
        distinguishing_aspect: >
          Branching-with-revert on HolderReport: UNDER_AUDIT forks to REJECTED, then REJECTED -> DRAFT
          returns the report to an earlier state so it can be resubmitted. Distinct entity from the Claim cycle.
        test_recipe:
          setup:
            - "A CA report submitted, moved UNDER_AUDIT, then REJECTED by the examiner."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "MO02", name: "Money Order", dormancy_period_years: 3, dormancy_basis: "ISSUANCE", interest_bearing: false, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 50000, last_activity_date: "2020-01-01T00:00:00Z", issue_date: "2020-01-01T00:00:00Z" }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/evaluate-dormancy"
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports"
              payload: { holder_id: "${holder_id}", report_state: "CA", report_period_year: 2026 }
              as: Holder
              as_user_id: "${holder_id}"
              captures: { report_id: $.data.id, rep_v: $.data.version }
            - call: "POST /reports/${report_id}/add-property"
              payload: { property_id: "${prop_id}", expected_report_version: "${rep_v}" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/submit"
              payload: { declared_total_cents: 50000 }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /reports/${report_id}/begin-review"
              as: StateExaminer
              as_user_id: "exam-1"
            - call: "POST /reports/${report_id}/reject"
              as: StateExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /reports/${report_id}/revise"
              as: Holder
              as_user_id: "${holder_id}"
              captures: { status_after: $.data.status }
          assert:
            - "HolderReport.${report_id}.status == DRAFT"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: report_accept_escheat_custody
        grounds:
          - state_machines.HolderReport.UNDER_AUDIT_to_ACCEPTED
          - state_machines.Property.REPORTED_to_ESCHEATED
          - entities.StateAccount.custody_balance_cents
          - entities.LedgerEntry.entry_type
        distinguishing_aspect: >
          Depth-3 cascade triggered by report accept: Report ACCEPTED -> attached Property REPORTED->ESCHEATED
          (link caused by accept) -> LedgerEntry REMIT_IN and StateAccount.custody_balance_cents += 106000
          (link caused by the property escheating). Distinct trigger from claim pay.
        test_recipe:
          setup:
            - "A CA report UNDER_AUDIT with one interest-bearing property (face 100000) attached; clock at 2026-07-15."
          setup_api_calls:
            - call: "POST /holders"
              payload: { legal_name: "Acme Bank", incorporation_state: "NY", holder_type: "BANK" }
              as: StateAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /property-types"
              payload: { code: "AC01", name: "Savings", dormancy_period_years: 3, dormancy_basis: "LAST_ACTIVITY", interest_bearing: true, due_diligence_required: false, due_diligence_min_days: 0 }
              as: StateAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /state-accounts"
              payload: { state_code: "CA" }
              as: StateAdmin
              captures: { sa_ca_id: $.data.id }
            - call: "POST /properties"
              payload: { holder_id: "${holder_id}", property_type_id: "${pt_id}", owner_name: "Jane Doe", owner_last_known_state: "CA", amount_cents: 100000, last_activity_date: "2020-01-01T00:00:00Z" }
              as: Holder
