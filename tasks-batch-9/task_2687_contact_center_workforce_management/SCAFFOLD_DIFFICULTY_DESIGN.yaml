      - name: ot_accept_bounded_by_labor_agreement_max_weekly
        grounds:
          - validations.priority_120
          - errors.ERR_MAX_WEEKLY_HOURS_EXCEEDED
          - entities.LaborAgreement.fields.max_weekly_hours
          - calculations.overtime_cost_tiered
          - state_machines.IntradayAction.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          The same 1.0-hour OT offer on the same 7.5-hour shift is legal or illegal purely because
          of a third entity: the agent's LaborAgreement. Under LA-TIGHT (max_weekly_hours 8.0) the
          acceptance is refused with ERR_MAX_WEEKLY_HOURS_EXCEEDED and the cycle's OT spend stays
          0; under LA-CORE (45.0) the identical acceptance books 3600 cents at the 1.50 tier. An
          implementation that hard-codes a weekly ceiling, or reads it from the agent instead of
          the agreement, cannot produce both outcomes.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two agreements: LA-TIGHT (max_weekly_hours 8.0) and LA-CORE (45.0), both min_rest_hours 11."
            - "Cycle W37-CAP at REQUIREMENTS_LOCKED with ot_budget_cents 1000000; FG-A with the 2026-09-07 grid."
            - "Agent E-TIGHT under LA-TIGHT and agent E-CORE under LA-CORE, both skills [VOICE_EN], 2400 cents/hour, each with a PUBLISHED 08:00-16:00 shift on 2026-09-07 (7.50 paid hours)."
