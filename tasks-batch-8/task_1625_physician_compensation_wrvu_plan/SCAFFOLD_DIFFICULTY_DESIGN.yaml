  - rule_id: non_linear_state_machine
    instances:
      - name: capture_parallel_state_dimensions
        grounds:
          - state_machines.ProductionCapture.POSTED_to_VALIDATED
          - state_machines.ProductionCapture.VALIDATED_to_LOCKED
          - state_machines.ProductionCapture.CREDITED_to_REVERSED
          - entities.ProductionCapture.fields.capture_status
          - entities.ProductionCapture.fields.credit_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (ProductionCapture): statement finalization moves
          capture_status VALIDATED -> LOCKED while credit_status stays CREDITED; a later accepted
          dispute moves credit_status CREDITED -> REVERSED while capture_status stays LOCKED.
          The two axes provably evolve independently.
        test_recipe:
          setup:
            - "ACTIVE plan (single tier T1 0@4500c), physician PH EFFECTIVE agreement, capture CAP (99213 x 10 = 9.70 wRVU, served 2026-02-10) validated"
            - "Statement ST for 2026-02 generated (includes CAP) and moved to UNDER_REVIEW"
