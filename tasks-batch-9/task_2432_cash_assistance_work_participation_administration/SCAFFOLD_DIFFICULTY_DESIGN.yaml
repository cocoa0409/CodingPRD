            - "SupportiveServiceAuthorization.${auth_1_id}.authorized_amount_cents == 45000"
            - "the fourth trigger call returns HTTP 201 and SupportiveServiceAuthorization.${auth_3_id}.fiscal_year == 2027"

      - name: revoking_a_hardship_extension_restores_the_state_clock_months_it_shielded
        grounds:
          - calculations.time_limit_clock
          - state_machines.TimeLimitExtension.status
          - entities.Household.fields.state_clock_months_used
          - entities.Household.fields.extension_months_used
        distinguishing_aspect: |
          The conserved quantity is a month count, not money:
          (state_clock_months_used - prior_state_clock_months) + extension_months_used
          == issued_countable_months == 3 must hold as 3 + 0, then 1 + 2 after the
          grant, then 3 + 0 again after the revoke, while
          federal_clock_months_used stays at 3 throughout because state-funded
          extension months never stop the federal clock.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with no prior assistance record is ACTIVE with 2026-08, 2026-09 and 2026-10 all issued, so state_clock_months_used is 3, federal_clock_months_used is 3, extension_months_used is 0 and issued_countable_months is 3."
            - "A REQUESTED HARDSHIP_DISABILITY extension asks for 2 months starting 2026-09."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Invariant Two Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 40000, month_1_cents: 40000, month_2_cents: 40000, month_3_cents: 40000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_id: $.data.id }
            - call: "POST /income-sources/${inc_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-09" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { tlm_sep_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-10" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { tlm_oct_id: $.data.id }
            - call: "POST /cases/${case_id}/extensions"
              payload: { extension_type: "HARDSHIP_DISABILITY", months_requested: 2, first_effective_month: "2026-09" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { ext_id: $.data.id }
          trigger:
            - call: "POST /extensions/${ext_id}/grant"
              payload: { months_granted: 2 }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
            - call: "POST /extensions/${ext_id}/revoke"
              payload: { revocation_reason: "MEDICAL_REVIEW_CLEARED" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
          assert:
            - "Household.${hh_id}.issued_countable_months == 3 before the first trigger call"
            - "Household.${hh_id}.state_clock_months_used == 3 before the first trigger call"
            - "the first trigger call returns HTTP 200"
            - "TimeLimitExtension.${ext_id}.status == GRANTED after the first trigger call"
            - "TimeLimitExtension.${ext_id}.last_effective_month == \"2026-10\" after the first trigger call"
            - "Household.${hh_id}.state_clock_months_used == 1 after the first trigger call"
            - "Household.${hh_id}.extension_months_used == 2 after the first trigger call"
            - "Household.${hh_id}.federal_clock_months_used == 3 after the first trigger call"
            - "Household.${hh_id}.issued_countable_months == 3 after the first trigger call"
            - "TimeLimitMonth.${tlm_sep_id}.state_clock_countable == false after the first trigger call"
            - "TimeLimitMonth.${tlm_sep_id}.federal_clock_countable == true after the first trigger call"
            - "TimeLimitMonth.${tlm_sep_id}.non_countable_reason == GRANTED_EXTENSION after the first trigger call"
            - "the second trigger call returns HTTP 200"
            - "TimeLimitExtension.${ext_id}.status == REVOKED after the second trigger call"
            - "TimeLimitExtension.${ext_id}.months_granted == 0 after the second trigger call"
            - "Household.${hh_id}.state_clock_months_used == 3 after the second trigger call"
            - "Household.${hh_id}.extension_months_used == 0 after the second trigger call"
            - "Household.${hh_id}.federal_clock_months_used == 3 after the second trigger call"
            - "TimeLimitMonth.${tlm_oct_id}.state_clock_countable == true after the second trigger call"
            - "TimeLimitMonth.${tlm_oct_id}.non_countable_reason == NONE after the second trigger call"
            - "AssistanceCase.${case_id}.benefit_status == ACTIVE after the second trigger call"

      - name: recoupment_reversal_returns_the_overpayment_ledger_to_its_established_balance
        grounds:
          - calculations.overpayment_establishment
          - state_machines.Overpayment.status
          - entities.RecoveryTransaction.fields.signed_amount_cents
          - concurrency_rules[recovery-txn-stale-overpayment]
        distinguishing_aspect: |
          The conserved quantity is the ledger identity
          established_amount_cents == balance_cents + total_recovered_cents, which
          must hold as 30000 == 30000 + 0, then 30000 == 18000 + 12000, then
          30000 == 30000 + 0 again after the reversal, with the reversal stored as
          signed_amount_cents -12000 rather than by deleting the original row. Each
          write is guarded by expected_overpayment_version, so the reversal must
          echo the version produced by the cash payment.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 is ACTIVE with 2026-08 issued and benefit_amount_cents 17000."
            - "A CLIENT_ERROR overpayment for months_covered [2026-08] with computation_method GROSS and gross_amount_cents 30000 has been ESTABLISHED by fo-1, so established_amount_cents is 30000, monthly_recoupment_cents is 1700, total_recovered_cents is 0 and balance_cents is 30000."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Invariant Three Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 40000, month_1_cents: 40000, month_2_cents: 40000, month_3_cents: 40000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_e_id: $.data.id }
            - call: "POST /income-sources/${inc_e_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/income-sources"
              payload: { source_type: "UNEARNED_CHILD_SUPPORT", gross_monthly_cents: 20000, month_1_cents: 20000, month_2_cents: 20000, month_3_cents: 20000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { inc_cs_id: $.data.id }
            - call: "POST /income-sources/${inc_cs_id}/verify"
              payload: { verification_status: "VERIFIED" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /overpayments"
              payload: { case_id: "${case_id}", claim_type: "CLIENT_ERROR", months_covered: ["2026-08"], gross_amount_cents: 30000, computation_method: "GROSS", offsetting_underpayment_cents: 5000 }
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { op_id: $.data.id }
            - call: "POST /overpayments/${op_id}/establish"
              payload: {}
              as: FiscalOfficer
              as_user_id: "fo-1"
            - call: "GET /overpayments/${op_id}"
              payload: {}
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { op_v1: $.data.version }
          trigger:
            - call: "POST /overpayments/${op_id}/recovery-transactions"
              payload: { method: "CASH_PAYMENT", amount_cents: 12000, applied_month: "2026-09", expected_overpayment_version: "${op_v1}" }
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { txn_pay_id: $.data.id }
            - call: "GET /overpayments/${op_id}"
              payload: {}
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { op_v2: $.data.version }
            - call: "POST /overpayments/${op_id}/recovery-transactions"
              payload: { method: "RECOUPMENT_REVERSAL", amount_cents: 12000, applied_month: "2026-10", expected_overpayment_version: "${op_v2}" }
              as: FiscalOfficer
              as_user_id: "fo-1"
              captures: { txn_rev_id: $.data.id }
          assert:
            - "Overpayment.${op_id}.established_amount_cents == 30000 before the first trigger call"
            - "Overpayment.${op_id}.monthly_recoupment_cents == 1700 before the first trigger call"
            - "the first trigger call returns HTTP 201"
            - "RecoveryTransaction.${txn_pay_id}.signed_amount_cents == 12000"
            - "Overpayment.${op_id}.total_recovered_cents == 12000 after the first trigger call"
            - "Overpayment.${op_id}.balance_cents == 18000 after the first trigger call"
            - "Overpayment.${op_id}.status == IN_RECOVERY after the first trigger call"
            - "the third trigger call returns HTTP 201"
            - "RecoveryTransaction.${txn_rev_id}.signed_amount_cents == -12000"
            - "Overpayment.${op_id}.total_recovered_cents == 0 after the third trigger call"
            - "Overpayment.${op_id}.balance_cents == 30000 after the third trigger call"
            - "Overpayment.${op_id}.status == IN_RECOVERY after the third trigger call"
            - "GET /overpayments/${op_id}/recovery-transactions returns total_count 2"
