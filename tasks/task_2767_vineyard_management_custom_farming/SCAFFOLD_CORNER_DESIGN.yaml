              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /blocks/${b1_id}/pest-observations"
              payload: { pest_code: "POWDERY_MILDEW", incidence_pct: 6.0, severity_index: 2.0, scouting_note: "First scouting round" }
              as: Agronomist
              as_user_id: "u-ag-1"
              captures: { po_a: $.data.id, po_a_at: $.data.observed_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:30:00Z" }
