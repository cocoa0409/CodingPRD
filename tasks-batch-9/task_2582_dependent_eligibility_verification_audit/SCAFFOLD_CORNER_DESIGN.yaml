              payload: { relationship_type: "CHILD_BIOLOGICAL", full_name: "Nia Reyes", date_of_birth: "2014-07-02", monthly_cost_cents: 30500 }
              as: ProgramAdmin
              captures: { dep2_id: "$.data.id" }
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "CHILD_BIOLOGICAL", phase: "AUDIT", acceptable_proof_types: ["BIRTH_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 0, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "GET /audit-cases"
              payload: { program_id: "${prog_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
              captures: { case1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /amnesty-removals"
              payload: { dependent_id: "${dep2_id}", case_id: "${case1_id}", reason_code: "AGE_LIMIT_EXCEEDED", attestation_signed: true }
              as: Employee
              as_user_id: "${emp1_id}"
            - call: "GET /audit-cases/${case1_id}"
              as: ProgramAdmin
            - call: "GET /dependents/${dep2_id}"
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
          assert:
            - "First call: HTTP status == 201, response data.coverage_end_date == 2026-09-30, response data.recorded_at == 2026-09-10T00:00:00.000Z, response data.penalty_waived == true, response data.claims_recovery_waived == true, response data.audited_savings_contribution_cents == 91500 (30500 * (12 - 9))"
            - "Second call: response data.status == IN_PROGRESS, response data.unverified_dependent_count == 1, response data.in_scope_dependent_count == 2"
            - "Third call: response data.coverage_status == AMNESTY_REMOVED and response data.coverage_end_date == 2026-09-30"
            - "Fourth call: response data.amnesty_removed_count == 1, response data.pending_dependent_count == 1, response data.provisional_annual_savings_cents == 366000 (30500 * 12; PROVISIONAL annualises every removal) and response data.audited_annual_savings_cents == 91500 (prorated from the 2026-09-30 coverage end)"
            - "All four responses reflect the write with no sweep call in between - nothing is deferred to a background pass"
