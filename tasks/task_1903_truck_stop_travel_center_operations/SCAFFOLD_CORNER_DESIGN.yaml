        distinguishing_aspect: "A T1 contract carrying discount 0.06 exceeds its tier margin 0.02: authorizing against it fails ERR_CONTRACT_DISCOUNT_SHORTFALL even though the arithmetic would still yield a positive price (283 - 6 = 277)."
