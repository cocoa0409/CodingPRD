# =============================================================================
# Task 1982 — Marching Band & Music Program Management (high school band program)
# Scaffold seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1982. Marching Band & Music Program Management (high school band program): instrument inventory & student assignment/rental fee, uniform fitting, issuance & cleaning cycle, rehearsal & competition calendar with travel, music licensing & arrangement purchase, section leader/audition & chair placement, booster fundraising & trip payment tracking, transportation & equipment truck logistics, weather contingency & practice cancellation

domain_name: marching-band-program
api_prefix: /band

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FK references; all collections top-level under /band
  state_machine_shape: parallel    # TripEnrollment carries payment_status x attendance_status; other machines are cyclic/branching
  relationship_patterns:
    - one_to_many
    - many_to_many                 # TripEnrollment, InstrumentAssignment, UniformAssignment, AuditionEntry are junction entities
    - cross_aggregate
  role_model: segregation_of_duties  # arrangement approver != creator; BandDirector otherwise superset
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (18 entities)
# =============================================================================
entities:
  - name: BandProgram
    parent: null
    common_fields: true
    fields:
      - { name: season_name, type: string, source: input, description: "Human-readable season label, e.g. 'Fall 2026'" }
      - { name: status, type: enum, source: system, description: "SETUP | ENROLLMENT_OPEN | SEASON_ACTIVE | CLOSED" }
      - { name: rental_fee_mode, type: enum, source: input, default: "FLAT", description: "FLAT | PRORATED — selects rental_fee_accrual variant; snapshotted onto each InstrumentAssignment at creation" }
      - { name: scoring_mode, type: enum, source: input, default: "RAW_WEIGHTED", description: "RAW_WEIGHTED | RANK_NORMALIZED — selects audition_composite_score variant; snapshotted onto each Audition at creation" }
      - { name: music_budget_cents, type: integer, source: input, description: "Total budget for arrangement purchases" }
      - { name: repair_budget_cents, type: integer, source: input, description: "Total budget for instrument repairs" }
      - { name: subsidy_pool_cents, type: integer, source: input, default: 0, description: "Booster-funded pool used to subsidize trip cost shares" }
      - { name: delinquency_grace_cents, type: integer, source: input, default: 2500, description: "Balance threshold; student is delinquent iff account_balance_cents > this value (equality is NOT delinquent)" }
      - { name: music_spent_cents, type: integer, source: computed, description: "Sum of cost_cents over MusicArrangements of this program with status IN {LICENSED_ACTIVE, EXPIRED}" }
      - { name: repair_spent_cents, type: integer, source: computed, description: "Sum of repair_cost_cents over all complete-maintenance calls for instruments of this program" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: grade, type: integer, source: input, description: "School grade 9-12" }
      - { name: section, type: enum, source: input, description: "WOODWIND | BRASS | PERCUSSION | GUARD" }
      - { name: is_section_leader, type: boolean, source: system, default: false, description: "Set true only via designate-leader; gates SectionLeader-role operations" }
      - { name: enrollment_status, type: enum, source: system, description: "APPLIED | ENROLLED | SUSPENDED | WITHDRAWN" }
      - { name: account_balance_cents, type: integer, source: computed, description: "Σ debit-kind Payments − Σ credit-kind Payments + Σ REFUND Payments for this student; positive = student owes program; negative = credit balance" }
      - { name: is_delinquent, type: boolean, source: computed, description: "true iff account_balance_cents > program.delinquency_grace_cents (strictly greater)" }

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: serial_number, type: string, source: input, description: "Unique per program" }
      - { name: instrument_type, type: string, source: input, description: "e.g. TRUMPET, SNARE, SOUSAPHONE" }
      - { name: condition_grade, type: enum, source: input, default: "GOOD", description: "EXCELLENT | GOOD | FAIR | POOR | UNPLAYABLE" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Declared replacement value" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHECKED_OUT | RETURN_PENDING_INSPECTION | IN_MAINTENANCE | RETIRED" }

  - name: InstrumentAssignment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; borrower" }
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; borrowed instrument" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OVERDUE | RETURNED" }
      - { name: checkout_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: due_date, type: datetime, source: input, description: "Return-by instant; must be strictly after checkout" }
      - { name: returned_at, type: datetime, source: system, description: "Logical clock time at return; null until returned" }
      - { name: fee_variant, type: enum, source: system, description: "FLAT | PRORATED — copied from BandProgram.rental_fee_mode at creation" }
      - { name: accrued_fee_cents, type: integer, source: computed, description: "Rental fee per rental_fee_accrual; FLAT = 15000, PRORATED = ceil(days(checkout→due)/7) * 2000, min 1 week" }
      - { name: late_fee_cents, type: integer, source: computed, description: "0 until return; on return while OVERDUE = ceil(days(due→return)/7) * 500" }

  - name: Uniform
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: garment_type, type: enum, source: input, description: "JACKET | BIBBERS | SHAKO | PLUME | GLOVES" }
      - { name: size_label, type: string, source: input, description: "e.g. M, 42R" }
      - { name: status, type: enum, source: system, description: "IN_STORAGE | ISSUED | RETURNED_DIRTY | AT_CLEANER | RETIRED" }
      - { name: cleaning_batch_id, type: string, source: system, description: "FK -> CleaningBatch.id; set when added to a batch, cleared at receive; null otherwise" }
      - { name: cleaning_count, type: integer, source: computed, default: 0, description: "Number of completed cleaning cycles" }

  - name: UniformAssignment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; wearer" }
      - { name: uniform_id, type: string, source: input, description: "FK -> Uniform.id; garment issued" }
      - { name: status, type: enum, source: system, description: "ISSUED | RETURNED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time at issuance" }
      - { name: returned_at, type: datetime, source: system, description: "Logical clock time at return; null until returned" }
      - { name: soiling_level, type: enum, source: system, description: "NORMAL | HEAVY — recorded at return" }
      - { name: cleaning_fee_cents, type: integer, source: computed, description: "0 until the garment's CleaningBatch is received; then the garment's per-line cost" }

  - name: CleaningBatch
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: status, type: enum, source: system, description: "OPEN | SENT | RECONCILED" }
      - { name: garment_count, type: integer, source: computed, description: "Number of uniforms currently attached" }
      - { name: discount_pct, type: number, source: computed, description: "Volume discount tier chosen at receive: 1-10 garments 0.00, 11-30 0.15, 31+ 0.25" }
      - { name: total_cost_cents, type: integer, source: computed, description: "Sum of per-line costs at receive; per-line = round_half_up(base_price * (1 - discount_pct)) + (HEAVY ? 200 : 0)" }

  - name: MusicArrangement
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: title, type: string, source: input, description: "Chart title" }
      - { name: arranger, type: string, source: input, description: "Arranger name" }
      - { name: license_type, type: enum, source: input, description: "STANDARD | CUSTOM_ARRANGEMENT | COMPETITION_EXCERPT" }
      - { name: cost_cents, type: integer, source: input, description: "Purchase price" }
      - { name: rights_end, type: datetime, source: input, description: "License rights expiry; must be in the future at creation" }
      - { name: status, type: enum, source: system, description: "QUOTED | APPROVED | LICENSED_ACTIVE | EXPIRED | REJECTED" }
      - { name: creator_user_id, type: string, source: system, description: "X-User-ID of creator (segregation-of-duties reference)" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of approver; must differ from creator_user_id" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: event_type, type: enum, source: input, description: "REHEARSAL | SECTIONAL | COMPETITION | PERFORMANCE | FUNDRAISER" }
      - { name: facility, type: string, source: input, description: "Venue label, e.g. STADIUM, GYM, BAND_ROOM" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (ISO8601)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (ISO8601); must be strictly after starts_at" }
      - { name: is_outdoor, type: boolean, source: input, description: "Only outdoor events may enter WEATHER_WATCH" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | WEATHER_WATCH | INDOOR_RELOCATED | POSTPONED | COMPLETED | CANCELLED" }

  - name: Trip
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; the competition/performance traveled to" }
      - { name: program_id, type: string, source: system, description: "FK -> BandProgram.id; copied from the linked event" }
      - { name: status, type: enum, source: system, description: "PLANNING | ROSTER_OPEN | ROSTER_LOCKED | FINALIZED | COMPLETED | CANCELLED | SUPERSEDED" }
      - { name: capacity, type: integer, source: input, description: "Seat count; enrollment with attendance IN {REGISTERED, CONFIRMED} may equal capacity (inclusive), beyond it new enrollments become WAITLISTED" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Forward-looking gross cost estimate" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Final gross cost, supplied at finalize" }
      - { name: subsidy_applied_cents, type: integer, source: computed, description: "min(program.subsidy_pool_cents, round_half_up(0.25 * actual_cost_cents)) computed at finalize; 0 before" }
      - { name: departure_at, type: datetime, source: input, description: "Departure instant; refund tiers key off (departure_at − now)" }
      - { name: registered_count, type: integer, source: computed, description: "Enrollments with attendance_status IN {REGISTERED, CONFIRMED}" }
      - { name: confirmed_count, type: integer, source: computed, description: "Enrollments with attendance_status == CONFIRMED" }

  - name: TripEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id; the trip" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the traveler" }
      - { name: attendance_status, type: enum, source: system, description: "REGISTERED | WAITLISTED | CONFIRMED | EXCUSED | ATTENDED | NO_SHOW" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PARTIAL | PAID | REFUNDED — derived: UNPAID iff net_paid==0, PAID iff net_paid >= amount_due_cents AND amount_due_cents > 0, PARTIAL otherwise; REFUNDED set on trip cancel/full excuse refund" }
      - { name: provisional_share_cents, type: integer, source: computed, description: "Snapshot at creation: round_half_up(trip.estimated_cost_cents / registered_count_after_this_enrollment); 0 for WAITLISTED" }
      - { name: amount_due_cents, type: integer, source: computed, description: "provisional_share_cents until trip finalize, then final_share_cents; 0 for WAITLISTED/EXCUSED" }
      - { name: final_share_cents, type: integer, source: computed, description: "At finalize: round_half_up((actual_cost_cents − subsidy_applied_cents) / confirmed_count); null before" }
      - { name: net_paid_cents, type: integer, source: computed, description: "Σ PAYMENT − Σ REFUND over Payments linked to this enrollment" }
      - { name: refunded_cents, type: integer, source: computed, description: "Σ REFUND Payments linked to this enrollment" }

  - name: Payment
    parent: null
    common_fields: false   # append-only ledger: id + created_at only
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; ledger account" }
      - { name: kind, type: enum, source: input, description: "Client-postable: PAYMENT | REFUND | WAIVER | MANUAL_DEBIT. System-only (rejected on POST): RENTAL_FEE_DEBIT | LATE_FEE_DEBIT | CLEANING_FEE_DEBIT | TRIP_SHARE_DEBIT | FUNDRAISING_CREDIT" }
      - { name: amount_cents, type: integer, source: input, description: "Positive integer amount" }
      - { name: trip_enrollment_id, type: string, source: input, description: "FK -> TripEnrollment.id; optional link for trip payments/refunds" }
      - { name: fundraiser_id, type: string, source: system, description: "FK -> Fundraiser.id; set on FUNDRAISING_CREDIT rows" }
      - { name: reference_payment_id, type: string, source: input, description: "FK -> Payment.id; required when kind == REFUND or WAIVER (the row being compensated)" }
      - { name: allocations, type: array, source: computed, description: "For kind == PAYMENT: waterfall allocation over outstanding debits ordered by debit created_at ASC, tie amount_cents ASC; list of {debit_payment_id, applied_cents}; empty when no outstanding debits" }
      - { name: note, type: string, source: input, description: "Free-text annotation" }

  - name: Fundraiser
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: name, type: string, source: input, description: "Fundraiser label" }
      - { name: goal_cents, type: integer, source: input, description: "Target amount" }
      - { name: status, type: enum, source: system, description: "OPEN | CREDITED" }
      - { name: raised_cents, type: integer, source: system, description: "Supplied at close" }
      - { name: allocated_credit_cents, type: integer, source: computed, description: "Σ FUNDRAISING_CREDIT rows posted at close; equals raised_cents exactly (largest-remainder allocation is lossless)" }

  - name: Audition
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: section, type: enum, source: input, description: "WOODWIND | BRASS | PERCUSSION | GUARD" }
      - { name: chair_capacity, type: integer, source: input, description: "Number of seated chairs; top-ranked entries up to capacity receive chair_number, remainder are alternates" }
      - { name: scoring_mode, type: enum, source: system, description: "RAW_WEIGHTED | RANK_NORMALIZED — copied from BandProgram.scoring_mode at creation" }
      - { name: status, type: enum, source: system, description: "SCORING_OPEN | SCORES_FINALIZED | PLACEMENTS_PUBLISHED | UNDER_CHALLENGE" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock time of latest placements publish; challenge window is 7 days" }

  - name: AuditionEntry
    parent: null
    common_fields: true
    fields:
      - { name: audition_id, type: string, source: input, description: "FK -> Audition.id; the audition" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the performer" }
      - { name: judge_scores, type: array, source: system, description: "List of {judge_id, musicianship, marching, leadership}; one row per judge, judge_id unique per entry" }
      - { name: composite_score, type: number, source: computed, description: "Per audition_composite_score variant of the parent audition's scoring_mode; null until finalize-scores" }
      - { name: rank, type: integer, source: computed, description: "1-based rank by composite DESC, tie-break entry created_at ASC; null until finalize-scores" }

  - name: ChairPlacement
    parent: null
    common_fields: true
    fields:
      - { name: audition_id, type: string, source: system, description: "FK -> Audition.id; the audition" }
      - { name: entry_id, type: string, source: system, description: "FK -> AuditionEntry.id; the placed entry" }
      - { name: chair_number, type: integer, source: computed, description: "1-based seat; null when is_alternate" }
      - { name: is_alternate, type: boolean, source: computed, description: "true when rank > chair_capacity" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED" }

  - name: TruckCharter
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> BandProgram.id; owning program" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; optional event the charter serves" }
      - { name: vehicle_label, type: string, source: input, description: "Vehicle identifier, e.g. TRUCK-1; overlap checks are per vehicle_label" }
      - { name: status, type: enum, source: system, description: "RESERVED | LOADED | DEPARTED | RETURNED | CANCELLED" }
      - { name: capacity_weight_lb, type: integer, source: input, description: "Inclusive max: total loaded weight must be <= this" }
      - { name: capacity_volume_cuft, type: integer, source: input, description: "Inclusive max: total loaded volume must be <= this" }
      - { name: window_start, type: datetime, source: input, description: "Reservation window start" }
      - { name: window_end, type: datetime, source: input, description: "Reservation window end; strictly after window_start" }
      - { name: loaded_weight_lb, type: integer, source: computed, description: "Σ weight_lb over loads" }
      - { name: loaded_volume_cuft, type: integer, source: computed, description: "Σ volume_cuft over loads" }

  - name: TruckLoad
    parent: null
    common_fields: false   # append-only manifest rows: id + created_at only
    fields:
      - { name: charter_id, type: string, source: input, description: "FK -> TruckCharter.id; the charter" }
      - { name: instrument_id, type: string, source: input, description: "FK -> Instrument.id; optional — when present the instrument must not be RETIRED or IN_MAINTENANCE" }
      - { name: description, type: string, source: input, description: "Manifest line, e.g. '12 equipment trunks'" }
      - { name: weight_lb, type: integer, source: input, description: "Positive weight" }
      - { name: volume_cuft, type: integer, source: input, description: "Positive volume" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BandProgram
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ENROLLMENT_OPEN
        trigger: "POST /band/programs/{id}/advance {to_state: ENROLLMENT_OPEN}"
        actor: BandDirector
        preconditions: ["status == SETUP (else ERR_PROGRAM_NOT_IN_REQUIRED_STATE)"]
        side_effects: ["version incremented"]
      - from: ENROLLMENT_OPEN
        to: SEASON_ACTIVE
        trigger: "POST /band/programs/{id}/advance {to_state: SEASON_ACTIVE}"
        actor: BandDirector
        preconditions: ["status == ENROLLMENT_OPEN"]
        side_effects: ["version incremented"]
      - from: SEASON_ACTIVE
        to: CLOSED
        trigger: "POST /band/programs/{id}/advance {to_state: CLOSED}"
        actor: BandDirector
        preconditions:
          - "status == SEASON_ACTIVE"
          - "No InstrumentAssignment with status IN {ACTIVE, OVERDUE} (ERR_PROGRAM_HAS_OPEN_OBLIGATIONS)"
          - "No UniformAssignment with status == ISSUED (ERR_PROGRAM_HAS_OPEN_OBLIGATIONS)"
          - "No Trip with status IN {PLANNING, ROSTER_OPEN, ROSTER_LOCKED, FINALIZED} (ERR_PROGRAM_HAS_OPEN_OBLIGATIONS)"
        side_effects: ["version incremented"]

  - entity: Student
    initial_state: APPLIED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: APPLIED
        to: ENROLLED
        trigger: "POST /band/students/{id}/enroll"
        actor: "BandDirector | AssistantDirector"
        preconditions: ["enrollment_status == APPLIED (else ERR_INVALID_STATE)"]
        side_effects: ["version incremented"]
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /band/students/{id}/suspend"
        actor: BandDirector
        preconditions: ["enrollment_status == ENROLLED (else ERR_INVALID_STATE)"]
        side_effects: ["version incremented"]
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /band/students/{id}/reinstate"
        actor: BandDirector
        preconditions:
          - "enrollment_status == SUSPENDED (else ERR_INVALID_STATE)"
          - "account_balance_cents <= program.delinquency_grace_cents (else ERR_STUDENT_DELINQUENT_FEES)"
        side_effects: ["version incremented"]
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /band/students/{id}/withdraw"
        actor: BandDirector
        preconditions: ["enrollment_status IN {ENROLLED, SUSPENDED}"]
        side_effects:
          - "Each InstrumentAssignment with status IN {ACTIVE, OVERDUE} → RETURNED (forced; late_fee_cents computed against due_date as of clock; any late fee posted as LATE_FEE_DEBIT); its Instrument → RETURN_PENDING_INSPECTION"
          - "Each UniformAssignment with status == ISSUED → RETURNED with soiling_level NORMAL; its Uniform → RETURNED_DIRTY"
          - "Each TripEnrollment with attendance_status IN {REGISTERED, CONFIRMED} → EXCUSED, refund per refund_tier_of_withdrawal (trip cancel policy: tiered by days to departure) posted as REFUND Payment; freed seat triggers waitlist_promotion"
          - "Student.version incremented; account_balance_cents recomputed"

  - entity: Instrument
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: CHECKED_OUT
        trigger: "system (POST /band/instrument-assignments creation)"
        actor: system
        preconditions: ["status == AVAILABLE (else ERR_INSTRUMENT_NOT_AVAILABLE)"]
        side_effects: []
      - from: CHECKED_OUT
        to: RETURN_PENDING_INSPECTION
        trigger: "system (POST /band/instrument-assignments/{id}/return or forced return via student withdraw)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURN_PENDING_INSPECTION
        to: AVAILABLE
        trigger: "system (return with inspection_result == PASS)"
        actor: system
        preconditions: []
        side_effects: ["condition_grade unchanged"]
      - from: RETURN_PENDING_INSPECTION
        to: IN_MAINTENANCE
        trigger: "system (return with inspection_result == FAIL)"
        actor: system
        preconditions: []
        side_effects: ["condition_grade degraded one step (GOOD→FAIR→POOR→UNPLAYABLE floor)"]
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /band/instruments/{id}/complete-maintenance"
        actor: EquipmentManager
        preconditions:
          - "status == IN_MAINTENANCE (else ERR_INVALID_STATE)"
          - "program.repair_spent_cents + repair_cost_cents <= program.repair_budget_cents (else ERR_REPAIR_BUDGET_EXCEEDED)"
        side_effects:
          - "condition_grade restored to GOOD if it had degraded below GOOD"
          - "program.repair_spent_cents += repair_cost_cents"
          - "version incremented"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /band/instruments/{id}/retire"
        actor: EquipmentManager
        preconditions: ["status == AVAILABLE (CHECKED_OUT → ERR_INSTRUMENT_CHECKED_OUT; RETIRED → ERR_INSTRUMENT_RETIRED)"]
        side_effects: ["version incremented"]
      - from: IN_MAINTENANCE
        to: RETIRED
        trigger: "POST /band/instruments/{id}/retire"
        actor: EquipmentManager
        preconditions: ["status == IN_MAINTENANCE"]
        side_effects: ["version incremented"]

  - entity: InstrumentAssignment
    initial_state: ACTIVE
    terminal_states: [RETURNED]
    transitions:
      - from: ACTIVE
        to: OVERDUE
        trigger: "system (evaluated when logical clock advances past due_date with assignment still ACTIVE; applied on clock set and on read)"
        actor: system
        preconditions: ["now > due_date"]
        side_effects: []
      - from: OVERDUE
        to: ACTIVE
        trigger: "POST /band/instrument-assignments/{id}/renew"
        actor: EquipmentManager
        preconditions:
          - "status IN {ACTIVE, OVERDUE} (else ERR_ASSIGNMENT_NOT_ACTIVE)"
          - "new_due_date > due_date (else ERR_DUE_DATE_INVALID)"
        side_effects:
          - "due_date := new_due_date"
          - "PRORATED variant: accrued_fee_cents recomputed over (checkout_at → new_due_date); accrued delta posted as RENTAL_FEE_DEBIT"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /band/instrument-assignments/{id}/return"
        actor: EquipmentManager
        preconditions: ["status IN {ACTIVE, OVERDUE} (else ERR_ASSIGNMENT_NOT_ACTIVE)"]
        side_effects:
          - "returned_at := now"
          - "if OVERDUE: late_fee_cents = ceil(days(due_date→now)/7) * 500 posted as LATE_FEE_DEBIT"
          - "Instrument → RETURN_PENDING_INSPECTION, then PASS → AVAILABLE / FAIL → IN_MAINTENANCE"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /band/instrument-assignments/{id}/return"
        actor: EquipmentManager
        preconditions: ["status IN {ACTIVE, OVERDUE}"]
        side_effects: ["same as ACTIVE → RETURNED including late fee"]

  - entity: Uniform
    initial_state: IN_STORAGE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STORAGE
        to: ISSUED
        trigger: "system (POST /band/uniform-assignments creation)"
        actor: system
        preconditions: ["status == IN_STORAGE (else ERR_UNIFORM_NOT_ISSUABLE)"]
        side_effects: []
      - from: ISSUED
        to: RETURNED_DIRTY
        trigger: "system (POST /band/uniform-assignments/{id}/return or forced return via student withdraw)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED_DIRTY
        to: AT_CLEANER
        trigger: "system (POST /band/cleaning-batches/{id}/send on a batch containing this garment)"
        actor: system
        preconditions: ["cleaning_batch_id set (added while batch OPEN)"]
        side_effects: []
      - from: AT_CLEANER
        to: IN_STORAGE
        trigger: "system (POST /band/cleaning-batches/{id}/receive)"
        actor: system
        preconditions: []
        side_effects: ["cleaning_count += 1", "cleaning_batch_id := null"]
      - from: IN_STORAGE
        to: RETIRED
        trigger: "POST /band/uniforms/{id}/retire"
        actor: EquipmentManager
        preconditions: ["status == IN_STORAGE (else ERR_UNIFORM_NOT_ISSUABLE)"]
        side_effects: ["version incremented"]

  - entity: UniformAssignment
    initial_state: ISSUED
    terminal_states: [RETURNED]
    transitions:
      - from: ISSUED
        to: RETURNED
        trigger: "POST /band/uniform-assignments/{id}/return"
        actor: EquipmentManager
        preconditions: ["status == ISSUED (else ERR_UNIFORM_ASSIGNMENT_NOT_ISSUED)"]
        side_effects:
          - "returned_at := now; soiling_level := input"
          - "Uniform → RETURNED_DIRTY"
          - "cleaning_fee_cents stays 0 until the containing CleaningBatch is received"

  - entity: CleaningBatch
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: SENT
        trigger: "POST /band/cleaning-batches/{id}/send"
        actor: EquipmentManager
        preconditions:
          - "status == OPEN (else ERR_BATCH_NOT_OPEN)"
          - "garment_count >= 1 (else ERR_BATCH_EMPTY)"
        side_effects: ["each attached Uniform → AT_CLEANER", "version incremented"]
      - from: SENT
        to: RECONCILED
        trigger: "POST /band/cleaning-batches/{id}/receive"
        actor: EquipmentManager
        preconditions: ["status == SENT (else ERR_BATCH_NOT_SENT)"]
        side_effects:
          - "cleaning_batch_cost computed (tier by garment_count; per-line round_half_up then sum)"
          - "per garment: UniformAssignment.cleaning_fee_cents := line cost; CLEANING_FEE_DEBIT Payment posted to that student; Uniform → IN_STORAGE"
          - "total_cost_cents set; version incremented"

  - entity: MusicArrangement
    initial_state: QUOTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: QUOTED
        to: APPROVED
        trigger: "POST /band/arrangements/{id}/approve"
        actor: BandDirector
        preconditions:
          - "status == QUOTED (else ERR_ARRANGEMENT_NOT_QUOTED)"
          - "X-User-ID != creator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approver_user_id := X-User-ID", "version incremented"]
      - from: QUOTED
        to: REJECTED
        trigger: "POST /band/arrangements/{id}/reject"
        actor: BandDirector
        preconditions:
          - "status == QUOTED"
          - "X-User-ID != creator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["version incremented"]
      - from: APPROVED
        to: LICENSED_ACTIVE
        trigger: "POST /band/arrangements/{id}/purchase"
        actor: BoosterTreasurer
        preconditions:
          - "status == APPROVED (else ERR_ARRANGEMENT_NOT_APPROVED)"
          - "program.music_spent_cents + cost_cents <= program.music_budget_cents (else ERR_MUSIC_BUDGET_EXCEEDED)"
        side_effects:
          - "program.music_spent_cents += cost_cents"
          - "version incremented"
      - from: LICENSED_ACTIVE
        to: EXPIRED
        trigger: "system (evaluated when logical clock advances past rights_end; applied on clock set and on read)"
        actor: system
        preconditions: ["now > rights_end"]
        side_effects: ["music_spent_cents unchanged (money already spent)"]

  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: WEATHER_WATCH
        trigger: "POST /band/events/{id}/weather-watch"
        actor: "BandDirector | AssistantDirector"
        preconditions:
          - "status == SCHEDULED (else ERR_EVENT_NOT_SCHEDULED)"
          - "is_outdoor == true (else ERR_EVENT_NOT_OUTDOOR)"
        side_effects: ["version incremented"]
      - from: WEATHER_WATCH
        to: INDOOR_RELOCATED
        trigger: "POST /band/events/{id}/relocate-indoor"
        actor: "BandDirector | AssistantDirector"
        preconditions: ["status == WEATHER_WATCH (else ERR_EVENT_NOT_SCHEDULED)"]
        side_effects:
          - "facility := input facility; is_outdoor := false"
          - "facility_conflict_check re-run against the new facility (ERR_FACILITY_CONFLICT)"
          - "version incremented"
      - from: SCHEDULED
        to: POSTPONED
        trigger: "POST /band/events/{id}/postpone"
        actor: "BandDirector | AssistantDirector"
        preconditions: ["status IN {SCHEDULED, WEATHER_WATCH, POSTPONED} (else ERR_EVENT_TERMINAL)"]
        side_effects: ["version incremented; times unchanged until reschedule"]
      - from: POSTPONED
        to: SCHEDULED
        trigger: "POST /band/events/{id}/postpone with new_starts_at/new_ends_at"
        actor: "BandDirector | AssistantDirector"
        preconditions:
          - "status IN {SCHEDULED, WEATHER_WATCH, POSTPONED}"
          - "new window valid (ERR_EVENT_WINDOW_INVALID) and conflict-free (ERR_FACILITY_CONFLICT)"
        side_effects: ["starts_at/ends_at := new window", "version incremented"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /band/events/{id}/complete"
        actor: "BandDirector | AssistantDirector"
        preconditions: ["status IN {SCHEDULED, WEATHER_WATCH, INDOOR_RELOCATED} (else ERR_EVENT_TERMINAL)"]
        side_effects: ["version incremented"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /band/events/{id}/cancel"
        actor: BandDirector
        preconditions: ["status IN {SCHEDULED, WEATHER_WATCH, INDOOR_RELOCATED, POSTPONED} (else ERR_EVENT_TERMINAL)"]
        side_effects:
          - "Linked Trip with status IN {PLANNING, ROSTER_OPEN, ROSTER_LOCKED, FINALIZED} → CANCELLED"
          - "That cancellation itself cascades: each of its TripEnrollments with attendance_status IN {REGISTERED, CONFIRMED, WAITLISTED} → EXCUSED; payment_status → REFUNDED where net_paid > 0; REFUND Payment of net_paid_cents posted per affected enrollment; affected Students' account_balance_cents recomputed"
          - "version incremented"

  - entity: Trip
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED, SUPERSEDED]
    transitions:
      - from: PLANNING
        to: SUPERSEDED
        trigger: "system (POST /band/trips creates a replacement trip for the same event)"
        actor: system
        preconditions: ["existing trip for the event is in PLANNING"]
        side_effects: []
      - from: PLANNING
        to: ROSTER_OPEN
        trigger: "POST /band/trips/{id}/open-roster"
        actor: "BandDirector | AssistantDirector"
        preconditions: ["status == PLANNING (else ERR_TRIP_ROSTER_NOT_OPEN)"]
        side_effects: ["version incremented"]
      - from: ROSTER_OPEN
        to: ROSTER_LOCKED
        trigger: "POST /band/trips/{id}/lock-roster"
        actor: "BandDirector | AssistantDirector"
        preconditions:
          - "status == ROSTER_OPEN (else ERR_TRIP_ROSTER_NOT_OPEN)"
          - "At least one TruckCharter with event_id == this trip's event_id and status IN {RESERVED, LOADED, DEPARTED, RETURNED} exists (else ERR_CHARTER_REQUIRED)"
        side_effects: ["version incremented; roster frozen"]
      - from: ROSTER_LOCKED
        to: FINALIZED
        trigger: "POST /band/trips/{id}/finalize"
        actor: BoosterTreasurer
        preconditions: ["status == ROSTER_LOCKED (else ERR_TRIP_NOT_LOCKED)"]
        side_effects:
          - "trip_cost_share FINAL variant evaluated (pinned order: freeze confirmed set → gross := actual_cost_cents → subsidy := min(subsidy_pool, 25% cap) → net := gross − subsidy → share := round_half_up(net / confirmed_count))"
          - "each CONFIRMED enrollment: final_share_cents set, amount_due_cents := final_share_cents, TRIP_SHARE_DEBIT posted to student, payment_status recomputed"
          - "version incremented"
      - from: FINALIZED
        to: COMPLETED
        trigger: "POST /band/trips/{id}/complete"
        actor: "BandDirector | AssistantDirector"
        preconditions:
          - "status == FINALIZED (else ERR_TRIP_NOT_LOCKED)"
          - "every enrollment attendance_status IN {ATTENDED, NO_SHOW, EXCUSED} (else ERR_UNRESOLVED_ENROLLMENTS_EXIST)"
        side_effects: ["version incremented"]
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /band/trips/{id}/cancel OR system (linked event cancelled)"
        actor: "BandDirector | system"
        preconditions: ["status IN {PLANNING, ROSTER_OPEN, ROSTER_LOCKED, FINALIZED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "each enrollment attendance IN {REGISTERED, CONFIRMED, WAITLISTED} → EXCUSED"
          - "enrollments with net_paid_cents > 0: REFUND Payment of net_paid_cents posted; payment_status → REFUNDED"
          - "student balances recomputed"

  - entity: TripEnrollment
    initial_state: REGISTERED
    terminal_states: [EXCUSED, ATTENDED, NO_SHOW]
    transitions:
      - from: REGISTERED
        to: WAITLISTED
        trigger: "system (creation when trip registered_count == capacity already)"
        actor: system
        preconditions: []
        side_effects: ["provisional_share_cents := 0", "amount_due_cents := 0"]
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system (waitlist_promotion when a seat frees)"
        actor: system
        preconditions: ["earliest created_at among WAITLISTED enrollments of the trip"]
        side_effects: ["provisional_share_cents recomputed per formula", "amount_due_cents := provisional_share_cents"]
      - from: REGISTERED
        to: CONFIRMED
        trigger: "POST /band/trip-enrollments/{id}/confirm"
        actor: "BandDirector | AssistantDirector"
        preconditions:
          - "attendance_status == REGISTERED (else ERR_ENROLLMENT_NOT_CONFIRMABLE)"
          - "trip.status IN {ROSTER_OPEN, ROSTER_LOCKED} (else ERR_TRIP_ROSTER_NOT_OPEN)"
          - "payment_status == PAID (else ERR_ENROLLMENT_NOT_PAID)"
        side_effects: ["trip.confirmed_count recomputed"]
      - from: REGISTERED
        to: EXCUSED
        trigger: "POST /band/trip-enrollments/{id}/excuse OR system (withdraw / trip cancel)"
        actor: "BandDirector | AssistantDirector | Student | system"
        preconditions: ["attendance_status IN {REGISTERED, CONFIRMED} (else ERR_ENROLLMENT_TERMINAL)"]
        side_effects:
          - "refund = round_half_up(net_paid_cents * refund_pct(days_to_departure)); posted as REFUND Payment when > 0"
          - "payment_status → REFUNDED when refund == net_paid and net_paid > 0"
          - "waitlist_promotion on the trip"
      - from: CONFIRMED
        to: EXCUSED
        trigger: "POST /band/trip-enrollments/{id}/excuse OR system"
        actor: "BandDirector | AssistantDirector | Student | system"
        preconditions: ["attendance_status IN {REGISTERED, CONFIRMED}"]
        side_effects: ["same as REGISTERED → EXCUSED"]
      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /band/trip-enrollments/{id}/mark-attendance {outcome: ATTENDED}"
        actor: "BandDirector | AssistantDirector"
        preconditions: ["attendance_status == CONFIRMED", "trip.status == FINALIZED (else ERR_TRIP_NOT_LOCKED)"]
        side_effects: []
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /band/trip-enrollments/{id}/mark-attendance {outcome: NO_SHOW}"
        actor: "BandDirector | AssistantDirector"
        preconditions: ["attendance_status == CONFIRMED", "trip.status == FINALIZED"]
        side_effects: ["NO_SHOW forfeits all refund rights — negative-space rule: no REFUND may be posted against a NO_SHOW enrollment"]

  - entity: Fundraiser
    initial_state: OPEN
    terminal_states: [CREDITED]
    transitions:
      - from: OPEN
        to: CREDITED
        trigger: "POST /band/fundraisers/{id}/close"
        actor: BoosterTreasurer
        preconditions: ["status == OPEN (else ERR_FUNDRAISER_NOT_OPEN)"]
        side_effects:
          - "fundraiser_credit_allocation (largest remainder) computed"
          - "one FUNDRAISING_CREDIT Payment posted per participant"
          - "allocated_credit_cents == raised_cents (lossless)"

  - entity: Audition
    initial_state: SCORING_OPEN
    terminal_states: []
    transitions:
      - from: SCORING_OPEN
        to: SCORES_FINALIZED
        trigger: "POST /band/auditions/{id}/finalize-scores"
        actor: BandDirector
        preconditions:
          - "status IN {SCORING_OPEN, UNDER_CHALLENGE} (else ERR_AUDITION_NOT_SCORING)"
          - "every AuditionEntry has >= 1 judge score (else ERR_SCORES_INCOMPLETE)"
        side_effects:
          - "audition_composite_score variant (per scoring_mode) computed per entry; rank assigned (composite DESC, tie created_at ASC)"
          - "version incremented"
      - from: SCORES_FINALIZED
        to: PLACEMENTS_PUBLISHED
        trigger: "POST /band/auditions/{id}/placements"
        actor: BandDirector
        preconditions:
          - "status == SCORES_FINALIZED (else ERR_AUDITION_SCORES_NOT_FINAL)"
          - "expected_audition_version == current version (else ERR_STALE_VERSION)"
        side_effects:
          - "prior PUBLISHED ChairPlacements of this audition → SUPERSEDED"
          - "new ChairPlacement rows: rank <= chair_capacity → chair_number := rank, is_alternate false; else is_alternate true, chair_number null"
          - "published_at := now; version incremented"
      - from: PLACEMENTS_PUBLISHED
        to: UNDER_CHALLENGE
        trigger: "POST /band/auditions/{id}/challenge"
        actor: SectionLeader
        preconditions:
          - "status == PLACEMENTS_PUBLISHED (else ERR_AUDITION_NOT_PUBLISHED)"
          - "acting student's is_section_leader == true AND student.section == audition.section (else ERR_SECTION_LEADER_REQUIRED)"
          - "now <= published_at + 7 days (else ERR_CHALLENGE_WINDOW_EXPIRED)"
        side_effects: ["version incremented"]
      - from: UNDER_CHALLENGE
        to: SCORES_FINALIZED
        trigger: "POST /band/auditions/{id}/finalize-scores (re-finalization after additional judge scores)"
        actor: BandDirector
        preconditions: ["status IN {SCORING_OPEN, UNDER_CHALLENGE}"]
        side_effects: ["composites + ranks recomputed; version incremented"]

  - entity: TruckCharter
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: LOADED
        trigger: "system (first POST /band/truck-charters/{id}/loads succeeds)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADED
        to: DEPARTED
        trigger: "POST /band/truck-charters/{id}/depart"
        actor: EquipmentManager
        preconditions:
          - "status == LOADED (else ERR_CHARTER_NOT_LOADABLE)"
          - "loaded_weight_lb >= 1 (else ERR_CHARTER_EMPTY)"
        side_effects: ["version incremented"]
      - from: DEPARTED
        to: RETURNED
        trigger: "POST /band/truck-charters/{id}/return"
        actor: EquipmentManager
        preconditions: ["status == DEPARTED (else ERR_INVALID_STATE)"]
        side_effects: ["version incremented"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /band/truck-charters/{id}/cancel"
        actor: EquipmentManager
        preconditions: ["status IN {RESERVED, LOADED} (else ERR_INVALID_STATE)"]
        side_effects: ["version incremented"]
      - from: LOADED
        to: CANCELLED
        trigger: "POST /band/truck-charters/{id}/cancel"
        actor: EquipmentManager
        preconditions: ["status IN {RESERVED, LOADED}"]
        side_effects: ["loads retained on record (append-only)"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved via OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: program-config-update-stale-version
    parent_entity: BandProgram
    write_endpoint: "PATCH /band/programs/{id}"
    occ_field: expected_program_version
    description: |
      Updating a BandProgram whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just patched budgets/thresholds (legitimately superseding the prior
      configuration) and the current writer's view of the program is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: trip-create-supersede-stale-event
    parent_entity: Event
    write_endpoint: "POST /band/trips"
    occ_field: expected_event_version
    description: |
      Creating a Trip against an Event whose version has advanced since the
      client last observed it is rejected. Creating a trip legitimately
      supersedes the event's existing PLANNING trip (old trip → SUPERSEDED),
      so a writer acting on a stale event view is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: placements-publish-supersede-stale-audition
    parent_entity: Audition
    write_endpoint: "POST /band/auditions/{id}/placements"
    occ_field: expected_audition_version
    description: |
      Publishing chair placements for an Audition whose version has advanced
      since the client last observed it is rejected. A publish legitimately
      supersedes the audition's prior PUBLISHED placement set, so a writer
      acting on a stale audition view is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_fee_accrual
    trigger: "InstrumentAssignment creation; renewal (PRORATED re-accrual over extended window)"
    algorithm: forward_looking
    formula: |
      days = ceil((due_date - checkout_at) / 86400)
      weeks = max(1, ceil(days / 7))
      variant FLAT:     accrued_fee_cents = SEMESTER_FLAT_FEE_CENTS
      variant PRORATED: accrued_fee_cents = weeks * WEEKLY_RATE_CENTS
      RENTAL_FEE_DEBIT Payment of accrued_fee_cents posted at creation.
    input_set: "the new assignment only; fee_variant snapshotted from BandProgram.rental_fee_mode at creation"
    constants:
      SEMESTER_FLAT_FEE_CENTS: 15000
      WEEKLY_RATE_CENTS: 2000
    precision: "integer cents; ceil for week counting"
    variants:
      - name: FLAT
        when: "program.rental_fee_mode == FLAT"
        difference: "whole-semester fee regardless of checkout/due window"
      - name: PRORATED
        when: "program.rental_fee_mode == PRORATED"
        difference: "ceil-week accrual; identical window yields a different amount (e.g. 14-day window: 4000 vs 15000)"

  - name: late_fee_accrual
    trigger: "return of an OVERDUE InstrumentAssignment (incl. forced return on withdraw)"
    algorithm: threshold
    formula: |
      if returned_at <= due_date: late_fee_cents = 0
      else: late_fee_cents = ceil((returned_at - due_date) / 86400 / 7) * LATE_FEE_PER_WEEK_CENTS
      posted as LATE_FEE_DEBIT when > 0
    input_set: "the returned assignment"
    constants:
      LATE_FEE_PER_WEEK_CENTS: 500
    precision: "integer cents"

  - name: cleaning_batch_cost
    trigger: "POST /band/cleaning-batches/{id}/receive"
    algorithm: tiered_pricing
    formula: |
      count = garment_count (garments attached to the batch)
      discount_pct = 0.00 if count <= 10; 0.15 if 11 <= count <= 30; 0.25 if count >= 31
      base(garment) = BASE_PRICE[garment_type]
      PINNED ROUNDING ORDER (per-line then sum):
        per garment line = round_half_up(base * (1 - discount_pct)) + (soiling_level == HEAVY ? HEAVY_SOILING_SURCHARGE_CENTS : 0)
        total_cost_cents = Σ lines
      (The alternative order — sum bases then apply discount then round once — is FORBIDDEN;
       e.g. 6 SHAKO + 6 PLUME at 15%: per-line 6*383 + 6*255 = 3828 vs sum-then-round 3825.)
    input_set: "uniforms attached to the batch at receive time"
    constants:
      BASE_PRICE_JACKET_CENTS: 900
      BASE_PRICE_BIBBERS_CENTS: 700
      BASE_PRICE_SHAKO_CENTS: 450
      BASE_PRICE_PLUME_CENTS: 300
      BASE_PRICE_GLOVES_CENTS: 150
      HEAVY_SOILING_SURCHARGE_CENTS: 200
    precision: "round_half_up per line to integer cents, then sum"

  - name: trip_cost_share
    trigger: "enrollment creation/waitlist promotion (PROVISIONAL); POST /band/trips/{id}/finalize (FINAL)"
    algorithm: waterfall_allocation
    formula: |
      PROVISIONAL (per enrollment at creation/promotion):
        provisional_share_cents = round_half_up(trip.estimated_cost_cents / registered_count_after_this_enrollment)
      FINAL (at finalize) — circular-looking dependency resolved by PINNED EVALUATION ORDER:
        (1) freeze confirmed set := enrollments with attendance_status == CONFIRMED at lock/finalize
        (2) gross := actual_cost_cents
        (3) subsidy_applied_cents := min(program.subsidy_pool_cents, round_half_up(SUBSIDY_CAP_PCT * gross))
        (4) net := gross - subsidy_applied_cents
        (5) final_share_cents := round_half_up(net / confirmed_count)   # confirmed_count >= 1 required
        Dividing before subtracting subsidy, or sizing subsidy off net instead of gross, is FORBIDDEN.
      At finalize each CONFIRMED enrollment gets TRIP_SHARE_DEBIT of final_share_cents.
    input_set: "FINAL: only enrollments with attendance_status == CONFIRMED; WAITLISTED/EXCUSED excluded"
    constants:
      SUBSIDY_CAP_PCT: 0.25
    precision: "round_half_up to integer cents"
    variants:
      - name: PROVISIONAL
        when: "before finalize"
        difference: "estimated cost divided over current roster snapshot; e.g. estimated 90000 over 7 → 12857"
      - name: FINAL
        when: "at finalize"
        difference: "actual cost net of capped subsidy over confirmed only; e.g. actual 100000, pool 20000, 7 confirmed → 11429"

  - name: refund_tier_of_withdrawal
    trigger: "TripEnrollment excuse (manual, withdraw cascade, trip cancel cascade)"
    algorithm: threshold
    formula: |
      days = floor((trip.departure_at - now) / 86400)
      refund_pct = 1.00 if days >= 14; 0.50 if 7 <= days < 14; 0.00 if days < 7
      refund_cents = round_half_up(net_paid_cents * refund_pct)
      Boundary: exactly 14 days → 100%; exactly 7 days → 50%; NO_SHOW enrollments forfeit refund (negative space).
    input_set: "the excused enrollment"
    constants:
      FULL_REFUND_DAYS: 14
      HALF_REFUND_DAYS: 7
    precision: "round_half_up to integer cents"

  - name: account_balance_aggregation
    trigger: "every Payment post (client or system)"
    algorithm: aggregation
    formula: |
      DEBIT_KINDS  = {MANUAL_DEBIT, RENTAL_FEE_DEBIT, LATE_FEE_DEBIT, CLEANING_FEE_DEBIT, TRIP_SHARE_DEBIT}
      CREDIT_KINDS = {PAYMENT, WAIVER, FUNDRAISING_CREDIT}
      account_balance_cents = Σ DEBIT_KINDS.amount − Σ CREDIT_KINDS.amount + Σ REFUND.amount
      is_delinquent = account_balance_cents > program.delinquency_grace_cents   # strict >, equality is NOT delinquent
    input_set: "all Payment rows of the student (ledger is append-only; no deletions)"
    precision: "integer cents"

  - name: payment_allocation_waterfall
    trigger: "POST /band/payments with kind == PAYMENT"
    algorithm: waterfall_allocation
    formula: |
      outstanding debits = debit-kind Payments of the student where amount_cents > Σ allocations applied to them
      order: created_at ASC, tie-break amount_cents ASC (never id)
      walk in order, applying min(remaining, outstanding) to each; store per-debit applied_cents in allocations[]
      any remainder stays unallocated credit on the account
    input_set: "student's debit-kind Payment rows with outstanding remainder"
    precision: "integer cents"

  - name: fundraiser_credit_allocation
    trigger: "POST /band/fundraisers/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      H = Σ participant hours; for each participant i:
        raw_i = raised_cents * h_i / H;  base_i = floor(raw_i);  frac_i = raw_i - base_i
      remainder = raised_cents - Σ base_i
      distribute remainder one cent at a time to participants ordered by frac_i DESC,
      tie-break Student.created_at ASC (never id)
      allocated_credit_cents == raised_cents (lossless)
    input_set: "participant_hours from the close payload; each student must be ENROLLED (else ERR_STUDENT_NOT_ENROLLED)"
    precision: "integer cents; floor for base share"

  - name: audition_composite_score
    trigger: "POST /band/auditions/{id}/finalize-scores"
    algorithm: weighted_scoring
    formula: |
      per judge j: weighted_j = 0.5*musicianship + 0.3*marching + 0.2*leadership
      variant RAW_WEIGHTED:
        if judge_count == 1: composite = round_half_up(weighted_1 * SINGLE_JUDGE_PENALTY, 2)
        if judge_count == 2: composite = round_half_up(mean(weighted_j), 2)
        if judge_count >= 3: drop the single lowest weighted_j, composite = round_half_up(mean(rest), 2)
      variant RANK_NORMALIZED:
        per judge: rank entries by weighted_j DESC (tie-break entry created_at ASC);
        borda_j = num_entries - rank_j;  composite = Σ borda_j
      Both variants share inputs but routinely disagree (e.g. two judges, entries
      (100/60) vs (80/90): RAW → 80.0 vs 85.0; RANK → 1 vs 1 tie resolved by created_at).
    input_set: "AuditionEntries of the audition with >= 1 judge score"
    constants:
      W_MUSICIANSHIP: 0.5
      W_MARCHING: 0.3
      W_LEADERSHIP: 0.2
      SINGLE_JUDGE_PENALTY: 0.95
    precision: "round_half_up to 2 decimals (RAW); integer borda points (RANK)"
    variants:
      - name: RAW_WEIGHTED
        when: "audition.scoring_mode == RAW_WEIGHTED"
        difference: "mean of weighted judge scores with drop-lowest / single-judge penalty branches"
      - name: RANK_NORMALIZED
        when: "audition.scoring_mode == RANK_NORMALIZED"
        difference: "per-judge Borda ranking; judge score magnitude is discarded"

  - name: chair_placement_assignment
    trigger: "POST /band/auditions/{id}/placements"
    algorithm: aggregation
    formula: |
      order entries by rank ASC (rank computed: composite DESC, tie entry created_at ASC)
      entries with rank <= audition.chair_capacity: chair_number := rank, is_alternate := false
      entries with rank > chair_capacity: chair_number := null, is_alternate := true
      prior PUBLISHED ChairPlacements of this audition → SUPERSEDED
    input_set: "all AuditionEntries of the audition"

  - name: waitlist_promotion
    trigger: "seat freed on a trip (excuse or withdraw of a REGISTERED/CONFIRMED enrollment)"
    algorithm: aggregation
    formula: |
      candidate set: enrollments of the trip with attendance_status == WAITLISTED
      ranking: created_at ASC (never id)
      promote exactly one (the first) if registered_count < trip.capacity after the freeing;
      on promotion recompute provisional_share_cents = round_half_up(estimated_cost_cents / registered_count_after_promotion)
      empty candidate set → no-op
    input_set: "WAITLISTED enrollments of the trip"

  - name: facility_conflict_check
    trigger: "POST /band/events; POST /band/events/{id}/postpone; POST /band/events/{id}/relocate-indoor"
    algorithm: interval_merge
    formula: |
      HALF-OPEN semantics [starts_at, ends_at): adjacency is ALLOWED (back-to-back events legal).
      conflict iff same program AND same facility AND other.status IN {SCHEDULED, WEATHER_WATCH, INDOOR_RELOCATED}
                 AND new.starts_at < other.ends_at AND other.starts_at < new.ends_at
      → ERR_FACILITY_CONFLICT
    input_set: "events of the same program + facility in non-terminal, non-postponed states"

  - name: vehicle_window_check
    trigger: "POST /band/truck-charters"
    algorithm: interval_merge
    formula: |
      BUFFERED semantics: adjacency is FORBIDDEN (loading buffer required).
      BUFFER = 7200 seconds (2 h) applied to both ends of existing reservations.
      conflict iff same program AND same vehicle_label AND other.status IN {RESERVED, LOADED, DEPARTED}
                 AND new.window_start < other.window_end + BUFFER AND other.window_start - BUFFER < new.window_end
      → ERR_VEHICLE_WINDOW_CONFLICT
    input_set: "charters of the same program + vehicle_label in active states"
    constants:
      LOADING_BUFFER_SECONDS: 7200

  - name: truck_capacity_check
    trigger: "POST /band/truck-charters/{id}/loads"
    algorithm: threshold
    formula: |
      new_weight = loaded_weight_lb + load.weight_lb
      new_volume = loaded_volume_cuft + load.volume_cuft
      if new_weight > capacity_weight_lb → ERR_TRUCK_OVERWEIGHT   # equality allowed (inclusive)
      if new_volume > capacity_volume_cuft → ERR_TRUCK_OVERVOLUME # weight checked before volume
    input_set: "existing loads of the charter"

  - name: music_budget_check
    trigger: "POST /band/arrangements/{id}/purchase"
    algorithm: aggregation
    formula: |
      music_spent_cents = Σ cost_cents of arrangements with status IN {LICENSED_ACTIVE, EXPIRED}
      if music_spent_cents + this.cost_cents > music_budget_cents → ERR_MUSIC_BUDGET_EXCEEDED  # equality allowed
    input_set: "arrangements of the program in spent states (QUOTED/APPROVED/REJECTED excluded)"

  - name: program_posture_gate
    trigger: "all mutating endpoints under a program scope"
    algorithm: constraint_propagation
    formula: |
      child creates (students/instruments/uniforms/events/arrangements/auditions/fundraisers/batches/charters)
        require program.status IN {ENROLLMENT_OPEN, SEASON_ACTIVE} → else ERR_PROGRAM_NOT_IN_REQUIRED_STATE
      no child creates in SETUP or CLOSED

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Ownership: role Student may act only on resources whose student_id == X-User-ID; role SectionLeader additionally requires the acting Student's is_section_leader == true and section match where the endpoint is section-scoped"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /band/trip-enrollments (Student), POST /band/trip-enrollments/{id}/excuse (Student), POST /band/auditions/{id}/challenge"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Body FK references exist (student_id, instrument_id, uniform_id, trip_id, audition_id, charter_id, event_id, reference_payment_id, participant student ids)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all creation endpoints with body FKs"
  - priority: 6
    category: state
    check: "Program posture gate: child creation requires program.status IN {ENROLLMENT_OPEN, SEASON_ACTIVE}"
    error_id: ERR_PROGRAM_NOT_IN_REQUIRED_STATE
    http_status: 409
    applies_to: "POST /band/students, /band/instruments, /band/uniforms, /band/events, /band/arrangements, /band/auditions, /band/fundraisers, /band/cleaning-batches, /band/truck-charters"
  - priority: 7
    category: state
    check: "Target entity is in the state required by the transition (assignment ACTIVE/OVERDUE, batch OPEN/SENT, arrangement QUOTED/APPROVED, event non-terminal, trip phase, audition phase, charter phase, enrollment non-terminal)"
    error_id: "domain-specific state errors (ERR_INSTRUMENT_NOT_AVAILABLE, ERR_BATCH_NOT_OPEN, ...); fallback ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: business_safety
    check: "Instrument with condition_grade == UNPLAYABLE may not be assigned; truck load may not exceed weight/volume capacity (inclusive equality allowed; weight before volume)"
    error_id: "ERR_INSTRUMENT_UNPLAYABLE | ERR_TRUCK_OVERWEIGHT | ERR_TRUCK_OVERVOLUME"
    http_status: 422
    applies_to: "POST /band/instrument-assignments, POST /band/truck-charters/{id}/loads"
  - priority: 9
    category: business_temporal
    check: "Window sanity: event ends_at > starts_at; charter window_end > window_start; assignment due_date strictly after checkout (now); arrangement rights_end in future; audition challenge within 7 days of published_at"
    error_id: "ERR_EVENT_WINDOW_INVALID | ERR_DUE_DATE_INVALID | ERR_LICENSE_WINDOW_INVALID | ERR_CHALLENGE_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "windowed creates/actions"
  - priority: 10
    category: business_constraint
    check: "Uniqueness/conflict: facility half-open overlap; vehicle buffered overlap; serial_number unique per program; one judge score per (entry, judge); score fields 0-100; one non-terminal trip per event supersede rule; duplicate trip enrollment for same student; one ISSUED garment per (student, garment_type); one ACTIVE instrument assignment per (student, instrument_type); weather-watch only on outdoor events"
    error_id: "ERR_FACILITY_CONFLICT | ERR_VEHICLE_WINDOW_CONFLICT | ERR_SERIAL_NUMBER_TAKEN | ERR_DUPLICATE_SCORE | ERR_SCORE_OUT_OF_RANGE | ERR_EVENT_HAS_ACTIVE_TRIP | ERR_ENROLLMENT_DUPLICATE | ERR_GARMENT_TYPE_ALREADY_ISSUED | ERR_INSTRUMENT_TYPE_ALREADY_ASSIGNED | ERR_EVENT_NOT_OUTDOOR"
    http_status: 409
    applies_to: "creation and scheduling endpoints"
  - priority: 11
    category: business_referential
    check: "Linked entities in required states: student ENROLLED (not APPLIED/SUSPENDED/WITHDRAWN) for assignments/enrollments/entries; PLUME requires same student currently ISSUED a SHAKO; trip lock requires an active TruckCharter for the event; audition SCORES_FINALIZED for publish; load's instrument not RETIRED/IN_MAINTENANCE"
    error_id: "ERR_STUDENT_NOT_ENROLLED | ERR_MATCHING_GARMENT_REQUIRED | ERR_CHARTER_REQUIRED | ERR_AUDITION_SCORES_NOT_FINAL | ERR_LOAD_INSTRUMENT_INVALID"
    http_status: 409
    applies_to: "cross-entity operations"
  - priority: 12
    category: business_fiscal
    check: "Money last: student not delinquent for new obligations; budgets not exceeded (music, repair); refund amount <= student net cash paid; payment amount_cents > 0"
    error_id: "ERR_STUDENT_DELINQUENT_FEES | ERR_MUSIC_BUDGET_EXCEEDED | ERR_REPAIR_BUDGET_EXCEEDED | ERR_REFUND_EXCEEDS_PAID | ERR_INVALID_REQUEST"
    http_status: 402
    applies_to: "POST /band/instrument-assignments, POST /band/trip-enrollments, purchase/complete-maintenance, POST /band/payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- BandProgram ---
  - { method: POST, path: "/band/programs", description: "Create a band program (season)", roles: [BandDirector], code: 201, input: [season_name, music_budget_cents, repair_budget_cents, "rental_fee_mode?", "scoring_mode?", "subsidy_pool_cents?", "delinquency_grace_cents?"], output: BandProgram, side_effects: ["status SETUP; computed aggregates 0"] }
  - { method: GET, path: "/band/programs", description: "List programs", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "BandProgram[]", side_effects: [] }
  - { method: GET, path: "/band/programs/{id}", description: "Get a program", roles: [Any], code: 200, input: [], output: BandProgram, side_effects: [] }
  - { method: PATCH, path: "/band/programs/{id}", description: "Update program config with OCC", roles: [BandDirector], code: 200, input: [expected_program_version, "music_budget_cents?", "repair_budget_cents?", "subsidy_pool_cents?", "delinquency_grace_cents?", "rental_fee_mode?", "scoring_mode?"], output: BandProgram, side_effects: ["increments BandProgram.version by 1; ERR_STALE_VERSION on version mismatch"] }
  - { method: POST, path: "/band/programs/{id}/advance", description: "Advance program lifecycle", roles: [BandDirector], code: 200, input: [to_state], output: BandProgram, side_effects: ["status transition; close gated on open obligations"] }

  # --- Student ---
  - { method: POST, path: "/band/students", description: "Register a student (starts APPLIED)", roles: [BandDirector, AssistantDirector], code: 201, input: [program_id, full_name, grade, section], output: Student, side_effects: [] }
  - { method: GET, path: "/band/students", description: "List students", roles: [Any], code: 200, input: ["program_id?", "section?", "enrollment_status?", "limit?", "offset?"], output: "Student[]", side_effects: [] }
  - { method: GET, path: "/band/students/{id}", description: "Get a student", roles: [Any], code: 200, input: [], output: Student, side_effects: [] }
  - { method: POST, path: "/band/students/{id}/enroll", description: "APPLIED → ENROLLED", roles: [BandDirector, AssistantDirector], code: 200, input: [], output: Student, side_effects: ["enrollment_status → ENROLLED"] }
  - { method: POST, path: "/band/students/{id}/suspend", description: "ENROLLED → SUSPENDED", roles: [BandDirector], code: 200, input: [], output: Student, side_effects: ["enrollment_status → SUSPENDED"] }
  - { method: POST, path: "/band/students/{id}/reinstate", description: "SUSPENDED → ENROLLED (requires balance <= grace)", roles: [BandDirector], code: 200, input: [], output: Student, side_effects: ["enrollment_status → ENROLLED"] }
  - { method: POST, path: "/band/students/{id}/withdraw", description: "Withdraw student; cascades forced returns, excuses, refunds", roles: [BandDirector], code: 200, input: [], output: Student, side_effects: ["instrument assignments forced RETURNED; uniform assignments forced RETURNED; trip enrollments EXCUSED with tiered refunds; waitlist promotions"] }
  - { method: POST, path: "/band/students/{id}/designate-leader", description: "Mark student as section leader", roles: [BandDirector], code: 200, input: [], output: Student, side_effects: ["is_section_leader := true"] }
  - { method: GET, path: "/band/students/{id}/ledger", description: "Student's payment ledger", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "Payment[]", side_effects: [] }

  # --- Instrument ---
  - { method: POST, path: "/band/instruments", description: "Add instrument to inventory", roles: [EquipmentManager], code: 201, input: [program_id, serial_number, instrument_type, replacement_value_cents, "condition_grade?"], output: Instrument, side_effects: ["status AVAILABLE"] }
  - { method: GET, path: "/band/instruments", description: "List instruments", roles: [Any], code: 200, input: ["program_id?", "status?", "instrument_type?", "limit?", "offset?"], output: "Instrument[]", side_effects: [] }
  - { method: GET, path: "/band/instruments/{id}", description: "Get an instrument", roles: [Any], code: 200, input: [], output: Instrument, side_effects: [] }
  - { method: POST, path: "/band/instruments/{id}/retire", description: "Retire an instrument (terminal, irreversible)", roles: [EquipmentManager], code: 200, input: [], output: Instrument, side_effects: ["status → RETIRED"] }
  - { method: POST, path: "/band/instruments/{id}/complete-maintenance", description: "Finish repair; debits repair budget", roles: [EquipmentManager], code: 200, input: [repair_cost_cents], output: Instrument, side_effects: ["status → AVAILABLE", "repair_spent_cents += repair_cost_cents"] }

  # --- InstrumentAssignment ---
  - { method: POST, path: "/band/instrument-assignments", description: "Check out an instrument to a student; posts RENTAL_FEE_DEBIT", roles: [EquipmentManager], code: 201, input: [student_id, instrument_id, due_date], output: InstrumentAssignment, side_effects: ["rental_fee_accrual; instrument → CHECKED_OUT; RENTAL_FEE_DEBIT posted"] }
  - { method: GET, path: "/band/instrument-assignments", description: "List instrument assignments", roles: [Any], code: 200, input: ["student_id?", "instrument_id?", "status?", "limit?", "offset?"], output: "InstrumentAssignment[]", side_effects: [] }
  - { method: GET, path: "/band/instrument-assignments/{id}", description: "Get an instrument assignment", roles: [Any], code: 200, input: [], output: InstrumentAssignment, side_effects: [] }
  - { method: POST, path: "/band/instrument-assignments/{id}/return", description: "Return with inspection result", roles: [EquipmentManager], code: 200, input: [inspection_result], output: InstrumentAssignment, side_effects: ["late fee if OVERDUE; instrument → AVAILABLE (PASS) or IN_MAINTENANCE (FAIL)"] }
  - { method: POST, path: "/band/instrument-assignments/{id}/renew", description: "Extend due date; PRORATED re-accrual", roles: [EquipmentManager], code: 200, input: [new_due_date], output: InstrumentAssignment, side_effects: ["due_date extended; PRORATED accrued delta posted as RENTAL_FEE_DEBIT; OVERDUE → ACTIVE"] }

  # --- Uniform ---
  - { method: POST, path: "/band/uniforms", description: "Add a garment", roles: [EquipmentManager], code: 201, input: [program_id, garment_type, size_label], output: Uniform, side_effects: ["status IN_STORAGE"] }
  - { method: GET, path: "/band/uniforms", description: "List garments", roles: [Any], code: 200, input: ["program_id?", "status?", "garment_type?", "cleaning_batch_id?", "limit?", "offset?"], output: "Uniform[]", side_effects: [] }
  - { method: GET, path: "/band/uniforms/{id}", description: "Get a garment", roles: [Any], code: 200, input: [], output: Uniform, side_effects: [] }
  - { method: POST, path: "/band/uniforms/{id}/retire", description: "Retire a garment", roles: [EquipmentManager], code: 200, input: [], output: Uniform, side_effects: ["status → RETIRED"] }

  # --- UniformAssignment ---
  - { method: POST, path: "/band/uniform-assignments", description: "Issue a garment (fitting → issuance)", roles: [EquipmentManager], code: 201, input: [student_id, uniform_id], output: UniformAssignment, side_effects: ["uniform → ISSUED; per-type uniqueness; PLUME requires SHAKO"] }
  - { method: GET, path: "/band/uniform-assignments", description: "List uniform assignments", roles: [Any], code: 200, input: ["student_id?", "uniform_id?", "status?", "limit?", "offset?"], output: "UniformAssignment[]", side_effects: [] }
  - { method: GET, path: "/band/uniform-assignments/{id}", description: "Get a uniform assignment", roles: [Any], code: 200, input: [], output: UniformAssignment, side_effects: [] }
  - { method: POST, path: "/band/uniform-assignments/{id}/return", description: "Return a garment with soiling level", roles: [EquipmentManager], code: 200, input: [soiling_level], output: UniformAssignment, side_effects: ["uniform → RETURNED_DIRTY"] }

  # --- CleaningBatch ---
  - { method: POST, path: "/band/cleaning-batches", description: "Open a cleaning batch", roles: [EquipmentManager], code: 201, input: [program_id], output: CleaningBatch, side_effects: [] }
  - { method: GET, path: "/band/cleaning-batches", description: "List batches", roles: [Any], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "CleaningBatch[]", side_effects: [] }
  - { method: GET, path: "/band/cleaning-batches/{id}", description: "Get a batch", roles: [Any], code: 200, input: [], output: CleaningBatch, side_effects: [] }
  - { method: POST, path: "/band/cleaning-batches/{id}/items", description: "Attach a RETURNED_DIRTY garment while batch OPEN", roles: [EquipmentManager], code: 201, input: [uniform_id], output: CleaningBatch, side_effects: ["garment_count += 1; uniform.cleaning_batch_id set"] }
  - { method: POST, path: "/band/cleaning-batches/{id}/send", description: "Send batch to cleaner", roles: [EquipmentManager], code: 200, input: [], output: CleaningBatch, side_effects: ["garments → AT_CLEANER"] }
  - { method: POST, path: "/band/cleaning-batches/{id}/receive", description: "Receive + reconcile: tiered cost, per-student cleaning debits, garments back to storage", roles: [EquipmentManager], code: 200, input: [], output: CleaningBatch, side_effects: ["cleaning_batch_cost; CLEANING_FEE_DEBIT per garment; uniforms → IN_STORAGE; status → RECONCILED"] }

  # --- MusicArrangement ---
  - { method: POST, path: "/band/arrangements", description: "Request an arrangement/license quote", roles: [BandDirector, AssistantDirector, SectionLeader], code: 201, input: [program_id, title, arranger, license_type, cost_cents, rights_end], output: MusicArrangement, side_effects: ["creator_user_id := X-User-ID"] }
  - { method: GET, path: "/band/arrangements", description: "List arrangements", roles: [Any], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "MusicArrangement[]", side_effects: [] }
  - { method: GET, path: "/band/arrangements/{id}", description: "Get an arrangement", roles: [Any], code: 200, input: [], output: MusicArrangement, side_effects: [] }
  - { method: POST, path: "/band/arrangements/{id}/approve", description: "Approve a quote (approver != creator)", roles: [BandDirector], code: 200, input: [], output: MusicArrangement, side_effects: ["status → APPROVED"] }
  - { method: POST, path: "/band/arrangements/{id}/reject", description: "Reject a quote (rejecter != creator)", roles: [BandDirector], code: 200, input: [], output: MusicArrangement, side_effects: ["status → REJECTED"] }
  - { method: POST, path: "/band/arrangements/{id}/purchase", description: "Purchase approved arrangement against music budget", roles: [BoosterTreasurer], code: 200, input: [], output: MusicArrangement, side_effects: ["status → LICENSED_ACTIVE; music_spent_cents += cost_cents"] }

  # --- Event ---
  - { method: POST, path: "/band/events", description: "Schedule a rehearsal/competition/etc.", roles: [BandDirector, AssistantDirector], code: 201, input: [program_id, event_type, facility, starts_at, ends_at, is_outdoor], output: Event, side_effects: ["facility_conflict_check (half-open)"] }
  - { method: GET, path: "/band/events", description: "List events", roles: [Any], code: 200, input: ["program_id?", "facility?", "status?", "event_type?", "limit?", "offset?"], output: "Event[]", side_effects: [] }
  - { method: GET, path: "/band/events/{id}", description: "Get an event", roles: [Any], code: 200, input: [], output: Event, side_effects: [] }
  - { method: POST, path: "/band/events/{id}/weather-watch", description: "SCHEDULED → WEATHER_WATCH (outdoor only)", roles: [BandDirector, AssistantDirector], code: 200, input: [], output: Event, side_effects: [] }
  - { method: POST, path: "/band/events/{id}/relocate-indoor", description: "WEATHER_WATCH → INDOOR_RELOCATED", roles: [BandDirector, AssistantDirector], code: 200, input: [facility], output: Event, side_effects: ["facility swap; conflict re-check"] }
  - { method: POST, path: "/band/events/{id}/postpone", description: "Postpone / reschedule with new window", roles: [BandDirector, AssistantDirector], code: 200, input: [new_starts_at, new_ends_at], output: Event, side_effects: ["POSTPONED → SCHEDULED with new window"] }
  - { method: POST, path: "/band/events/{id}/cancel", description: "Cancel event; cascades trip cancellation and refunds", roles: [BandDirector], code: 200, input: [], output: Event, side_effects: ["trip cascade: enrollments EXCUSED, REFUND payments, balance recompute"] }
  - { method: POST, path: "/band/events/{id}/complete", description: "Mark event completed", roles: [BandDirector, AssistantDirector], code: 200, input: [], output: Event, side_effects: [] }

  # --- Trip ---
  - { method: POST, path: "/band/trips", description: "Plan a trip for an event (OCC on event; supersedes existing PLANNING trip)", roles: [BandDirector, AssistantDirector], code: 201, input: [event_id, expected_event_version, capacity, estimated_cost_cents, departure_at], output: Trip, side_effects: ["increments Event.version by 1; existing PLANNING trip for event → SUPERSEDED; ERR_EVENT_HAS_ACTIVE_TRIP if existing trip beyond PLANNING"] }
  - { method: GET, path: "/band/trips", description: "List trips", roles: [Any], code: 200, input: ["event_id?", "program_id?", "status?", "limit?", "offset?"], output: "Trip[]", side_effects: [] }
  - { method: GET, path: "/band/trips/{id}", description: "Get a trip", roles: [Any], code: 200, input: [], output: Trip, side_effects: [] }
  - { method: POST, path: "/band/trips/{id}/open-roster", description: "PLANNING → ROSTER_OPEN", roles: [BandDirector, AssistantDirector], code: 200, input: [], output: Trip, side_effects: [] }
  - { method: POST, path: "/band/trips/{id}/lock-roster", description: "ROSTER_OPEN → ROSTER_LOCKED (requires truck charter for event)", roles: [BandDirector, AssistantDirector], code: 200, input: [], output: Trip, side_effects: ["roster frozen"] }
  - { method: POST, path: "/band/trips/{id}/finalize", description: "Compute FINAL shares; post TRIP_SHARE_DEBITs", roles: [BoosterTreasurer], code: 200, input: [actual_cost_cents], output: Trip, side_effects: ["trip_cost_share FINAL; subsidy_applied_cents set; debits posted"] }
  - { method: POST, path: "/band/trips/{id}/cancel", description: "Cancel trip; refunds all net-paid enrollments", roles: [BandDirector], code: 200, input: [], output: Trip, side_effects: ["enrollments EXCUSED; REFUND payments; payment_status → REFUNDED"] }
  - { method: POST, path: "/band/trips/{id}/complete", description: "FINALIZED → COMPLETED (all attendance resolved)", roles: [BandDirector, AssistantDirector], code: 200, input: [], output: Trip, side_effects: [] }

  # --- TripEnrollment ---
  - { method: POST, path: "/band/trip-enrollments", description: "Enroll a student in a trip (Student role: self only)", roles: [BandDirector, AssistantDirector, Student], code: 201, input: [trip_id, student_id], output: TripEnrollment, side_effects: ["provisional share snapshot; WAITLISTED when roster full; delinquency gate"] }
  - { method: GET, path: "/band/trip-enrollments", description: "List enrollments", roles: [Any], code: 200, input: ["trip_id?", "student_id?", "payment_status?", "attendance_status?", "limit?", "offset?"], output: "TripEnrollment[]", side_effects: [] }
  - { method: GET, path: "/band/trip-enrollments/{id}", description: "Get an enrollment", roles: [Any], code: 200, input: [], output: TripEnrollment, side_effects: [] }
  - { method: POST, path: "/band/trip-enrollments/{id}/confirm", description: "REGISTERED → CONFIRMED (requires PAID)", roles: [BandDirector, AssistantDirector], code: 200, input: [], output: TripEnrollment, side_effects: [] }
  - { method: POST, path: "/band/trip-enrollments/{id}/excuse", description: "Excuse with tiered refund; triggers waitlist promotion", roles: [BandDirector, AssistantDirector, Student], code: 200, input: [], output: TripEnrollment, side_effects: ["refund per refund_tier; waitlist_promotion"] }
  - { method: POST, path: "/band/trip-enrollments/{id}/mark-attendance", description: "CONFIRMED → ATTENDED | NO_SHOW after finalize", roles: [BandDirector, AssistantDirector], code: 200, input: [outcome], output: TripEnrollment, side_effects: ["NO_SHOW forfeits refund rights"] }

  # --- Payment ---
  - { method: POST, path: "/band/payments", description: "Post a ledger entry (PAYMENT runs the waterfall allocation)", roles: [BoosterTreasurer], code: 201, input: [student_id, kind, amount_cents, "trip_enrollment_id?", "reference_payment_id?", "note?"], output: Payment, side_effects: ["account_balance recomputed; payment_status of linked enrollment recomputed"] }
  - { method: GET, path: "/band/payments", description: "List ledger rows", roles: [Any], code: 200, input: ["student_id?", "trip_enrollment_id?", "fundraiser_id?", "kind?", "reference_payment_id?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: GET, path: "/band/payments/{id}", description: "Get a ledger row", roles: [Any], code: 200, input: [], output: Payment, side_effects: [] }

  # --- Fundraiser ---
  - { method: POST, path: "/band/fundraisers", description: "Create a fundraiser", roles: [BoosterTreasurer], code: 201, input: [program_id, name, goal_cents], output: Fundraiser, side_effects: [] }
  - { method: GET, path: "/band/fundraisers", description: "List fundraisers", roles: [Any], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "Fundraiser[]", side_effects: [] }
  - { method: GET, path: "/band/fundraisers/{id}", description: "Get a fundraiser", roles: [Any], code: 200, input: [], output: Fundraiser, side_effects: [] }
  - { method: POST, path: "/band/fundraisers/{id}/close", description: "Close and allocate credits (largest remainder)", roles: [BoosterTreasurer], code: 200, input: [raised_cents, participant_hours], output: Fundraiser, side_effects: ["FUNDRAISING_CREDIT rows posted; allocated_credit_cents == raised_cents"] }

  # --- Audition / AuditionEntry / ChairPlacement ---
  - { method: POST, path: "/band/auditions", description: "Create an audition for a section", roles: [BandDirector, AssistantDirector], code: 201, input: [program_id, section, chair_capacity], output: Audition, side_effects: ["scoring_mode snapshotted from program"] }
  - { method: GET, path: "/band/auditions", description: "List auditions", roles: [Any], code: 200, input: ["program_id?", "section?", "status?", "limit?", "offset?"], output: "Audition[]", side_effects: [] }
  - { method: GET, path: "/band/auditions/{id}", description: "Get an audition", roles: [Any], code: 200, input: [], output: Audition, side_effects: [] }
  - { method: POST, path: "/band/auditions/{id}/finalize-scores", description: "Compute composites and ranks", roles: [BandDirector], code: 200, input: [], output: Audition, side_effects: ["audition_composite_score; rank assignment; version incremented"] }
  - { method: POST, path: "/band/auditions/{id}/placements", description: "Publish chair placements (OCC; supersedes prior publish)", roles: [BandDirector], code: 200, input: [expected_audition_version], output: Audition, side_effects: ["increments Audition.version by 1; ChairPlacement rows created; prior PUBLISHED → SUPERSEDED"] }
  - { method: POST, path: "/band/auditions/{id}/challenge", description: "Section leader challenges published placements within 7 days", roles: [SectionLeader], code: 200, input: [entry_id, "reason?"], output: Audition, side_effects: ["status → UNDER_CHALLENGE"] }
  - { method: POST, path: "/band/audition-entries", description: "Enter a student into an audition", roles: [BandDirector, AssistantDirector], code: 201, input: [audition_id, student_id], output: AuditionEntry, side_effects: [] }
  - { method: GET, path: "/band/audition-entries", description: "List audition entries", roles: [Any], code: 200, input: ["audition_id?", "student_id?", "limit?", "offset?"], output: "AuditionEntry[]", side_effects: [] }
  - { method: GET, path: "/band/audition-entries/{id}", description: "Get an entry", roles: [Any], code: 200, input: [], output: AuditionEntry, side_effects: [] }
  - { method: POST, path: "/band/audition-entries/{id}/scores", description: "Submit one judge's rubric scores", roles: [BandDirector, AssistantDirector], code: 201, input: [judge_id, musicianship, marching, leadership], output: AuditionEntry, side_effects: ["judge_scores appended; unique judge_id per entry"] }
  - { method: GET, path: "/band/chair-placements", description: "List chair placements", roles: [Any], code: 200, input: ["audition_id?", "entry_id?", "status?", "limit?", "offset?"], output: "ChairPlacement[]", side_effects: [] }
  - { method: GET, path: "/band/chair-placements/{id}", description: "Get a placement", roles: [Any], code: 200, input: [], output: ChairPlacement, side_effects: [] }

  # --- TruckCharter / TruckLoad ---
  - { method: POST, path: "/band/truck-charters", description: "Reserve a vehicle (buffered overlap check)", roles: [EquipmentManager], code: 201, input: [program_id, vehicle_label, capacity_weight_lb, capacity_volume_cuft, window_start, window_end, "event_id?"], output: TruckCharter, side_effects: ["vehicle_window_check (2h buffer)"] }
  - { method: GET, path: "/band/truck-charters", description: "List charters", roles: [Any], code: 200, input: ["program_id?", "event_id?", "status?", "vehicle_label?", "limit?", "offset?"], output: "TruckCharter[]", side_effects: [] }
  - { method: GET, path: "/band/truck-charters/{id}", description: "Get a charter", roles: [Any], code: 200, input: [], output: TruckCharter, side_effects: [] }
  - { method: POST, path: "/band/truck-charters/{id}/loads", description: "Add a manifest load (capacity checked, weight before volume)", roles: [EquipmentManager], code: 201, input: [description, weight_lb, volume_cuft, "instrument_id?"], output: TruckLoad, side_effects: ["first load: charter → LOADED; loaded_* recomputed"] }
  - { method: GET, path: "/band/truck-loads", description: "List manifest loads", roles: [Any], code: 200, input: ["charter_id?", "instrument_id?", "limit?", "offset?"], output: "TruckLoad[]", side_effects: [] }
  - { method: GET, path: "/band/truck-loads/{id}", description: "Get a load", roles: [Any], code: 200, input: [], output: TruckLoad, side_effects: [] }
  - { method: POST, path: "/band/truck-charters/{id}/depart", description: "LOADED → DEPARTED", roles: [EquipmentManager], code: 200, input: [], output: TruckCharter, side_effects: [] }
  - { method: POST, path: "/band/truck-charters/{id}/return", description: "DEPARTED → RETURNED", roles: [EquipmentManager], code: 200, input: [], output: TruckCharter, side_effects: [] }
  - { method: POST, path: "/band/truck-charters/{id}/cancel", description: "Cancel charter before departure", roles: [EquipmentManager], code: 200, input: [], output: TruckCharter, side_effects: [] }

  # --- Test-driving clock ---
  - { method: POST, path: "/band/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Advancing the clock evaluates time-based transitions (assignment OVERDUE, license EXPIRED) lazily on set and on read.", roles: [BandDirector], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["time-based transitions evaluated"] }

