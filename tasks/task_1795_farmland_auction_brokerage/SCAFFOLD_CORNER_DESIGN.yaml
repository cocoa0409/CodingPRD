        distinguishing_aspect: "The 24-month comparable window is inclusive at clock-24mo: a sale dated exactly 2024-08-01 with clock 2026-08-01 counts (comparable_count 1), a sale one second older is excluded; with zero eligible comps the valuation read fails ERR_NO_COMPARABLES."
        test_recipe:
          setup: ["NE listing with tract T1; NE comparables Cb (sale exactly 2024-08-01T00:00:00Z) and Co (2024-07-31T23:59:59Z); second listing in KS with a tract and no comparables at all; clock at default 2026-08-01T00:00:00Z"]
