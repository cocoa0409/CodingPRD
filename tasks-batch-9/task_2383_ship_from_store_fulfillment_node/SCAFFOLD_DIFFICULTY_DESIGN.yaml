  - rule_id: boundary_precision_check
    instances:
      - name: routing_run_flips_at_available_to_promise_exactly_zero
        grounds:
          - calculations.store_available_to_promise
          - calculations.routing_node_selection_waterfall
          - entities.RoutingCandidate.fields.ineligible_reason
        distinguishing_aspect: |
          Metric 1 = StoreInventory.available_to_promise_units at endpoint
          POST /orders/{order_id}/routing-runs: on_hand 5 / safety 5 gives ATP exactly 0, which
          fails filter clause 8 (>= 1) and yields RoutingRun status NO_ELIGIBLE_NODE, while an
          adjustment to safety 4 gives ATP exactly 1 and the very same run commits - so an
          implementation using ATP > 0 versus ATP >= 0 is separated by one unit.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; S1 is the only node; SKU-A row has on_hand_units 5 and safety_stock_units 5, so available_to_promise_units is exactly 0."
            - "O1 is a GROUND zone-4 order with one line SKU-A x1 and no RoutingRun yet (routing_status UNROUTED)."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/store-inventories"
              payload: { store_id: "${s1}", sku_id: "${sku_a}", on_hand_units: 5, safety_stock_units: 5 }
              as: NetworkPlanner
              captures: { inv1: "$.data.id", inv1_v: "$.data.version" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-5401", customer_ref: "C-18", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T16:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
            - call: "POST /fulfillment-network/orders/${o1}/lines"
              payload: { sku_id: "${sku_a}", quantity: 1, unit_price_cents: 4500 }
              as: CustomerCare
