            - { call: "POST /fleet/buses", payload: { fleet_number: "CF2", vin: "VINCF2", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b2: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "CF1A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "CF1B" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/campaigns", payload: { code: "CMP-FR", title: "Frozen scope demo", model_year_from: 2020, model_year_to: 2022, labor_hours_per_bus: 2, deadline_date: "2026-12-31" }, as: FleetManager, captures: { c1: $.data.id } }
            - { call: "POST /fleet/campaigns/${c1}/events", payload: { event_type: "ACTIVATE" }, as: FleetManager }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CAMPAIGN", priority: "ROUTINE", campaign_id: "${c1}", planned_start_date: "2026-08-03", planned_end_date: "2026-08-04", estimated_labor_hours: 2, estimated_cost_cents: 13000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv1}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
