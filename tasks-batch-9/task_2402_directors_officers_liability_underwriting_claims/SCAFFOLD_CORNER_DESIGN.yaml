  - section: endpoints
    instances:
      - name: ops_run_on_an_empty_portfolio_reports_zero_of_everything
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /dno/ops-runs]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The epoch advancer is the only endpoint that sweeps nine different entity families at
          once, so it must be safe on an empty portfolio: every counter reads 0, the echoed
          current_utc equals the logical clock rather than wall-clock time, and the epoch still
          advances on a run that changed nothing. A run that omits a counter from the envelope, or
          that returns real time, fails here before any business logic is exercised.
        test_recipe:
          setup:
            - "Completely empty database; no clock call has been made, so the logical clock reads the 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /dno/ops-runs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dno/ops-runs"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the first ops run is 200 and data.current_utc == \"2026-08-01T00:00:00Z\" — the startup default of the logical clock, never wall-clock time"
            - "all nine counters on the first run are 0: activated_policy_count, expired_policy_count, delinquent_policy_count, lapsed_quote_count, expired_submission_count, reverted_submission_count, lapsed_circumstance_report_count, expired_runoff_count and, in the same envelope, no error"
            - "the clock call is 200 and the second ops run echoes data.current_utc == \"2027-01-15T00:00:00Z\""
            - "the second run also reports all nine counters as 0, and its data.epoch equals the first run's epoch plus exactly 1 — the epoch advances even when nothing changed"
      - name: quote_read_returns_the_full_premium_stack
