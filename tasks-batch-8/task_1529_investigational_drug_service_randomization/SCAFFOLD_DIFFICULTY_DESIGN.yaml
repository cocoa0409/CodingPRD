            - { call: "POST /api/shipments", payload: { lot_id: "${lot}", site_id: "${site}", kit_numbers: ["K-X1", "K-X2"], units_per_kit: 10 }, as: SponsorAdmin, captures: { k1: "$.data[0].id", k2: "$.data[1].id" } }
