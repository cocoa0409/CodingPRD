            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - *c_order
            - *c_propose
            - call: "GET /enforcement/consent-orders/${order_id}/comment-periods"
              payload: {}
              as: StaffAttorney
              captures: { period_id: "$.data[0].id" }
          trigger:
            - call: "POST /enforcement/comment-periods/${period_id}/comments"
              payload: { author_email: "watcher@public.org", body: "Support the order as drafted." }
              as: PlatformAdmin
          assert:
            - "the response status is 201 and the period's comment_count == 1"
            - "comments[0].author_email == \"watcher@public.org\" and comments[0].body == \"Support the order as drafted.\""
            - "comments[0].submitted_at == 2026-09-01T00:00:00Z (logical clock, not wall clock)"
            - "the period remains OPEN with closes_at == 2026-10-01T00:00:00Z"

