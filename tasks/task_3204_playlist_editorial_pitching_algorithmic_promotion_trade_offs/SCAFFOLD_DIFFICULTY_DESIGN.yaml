          Interval semantics — discrete-slot occupation with a grace class on
          PlaylistPlacement: only ACTIVE/REINSTATED rows occupy (playlist, slot)
          ; a ROTATED_OUT row in the same slot never blocks its own or a new
          row's activation, whereas a foreign ACTIVE row in the slot rejects
