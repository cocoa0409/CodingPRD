      - name: spec_revision_stale_blocks_recipe_activation_after_a_spec_change
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=29]
          - errors[ERR_SPEC_REVISION_STALE]
          - entities.BlendRecipe.fields.spec_revision_pinned
