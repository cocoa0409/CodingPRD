        distinguishing_aspect: "Entity-backed ownership: provider B's X-User-ID does not equal the claim's provider_id, so the line add fails with ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["providers A and B; claim owned by A in RECEIVED"]
