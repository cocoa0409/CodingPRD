    roles: [PolicyAdmin]
    code: 201
    input: [legal_name, country_code, industry_code]
    output: Advertiser
    side_effects: ["identity_status and business_standing_status default to PENDING, industry_authorization_status to NOT_REQUIRED, political_eligibility_status to NOT_REQUESTED, account_status to ACTIVE"]

  - method: GET
    path: "/ad-policy/advertisers/{id}"
    description: "Read one advertiser including account_status, both points balances and severity_index"
    roles: [PolicyAdmin, PolicyReviewer, IntegrityAnalyst, Advertiser]
    code: 200
    input: []
    output: Advertiser
    side_effects: []

  - method: POST
    path: "/ad-policy/advertisers/{id}/verifications"
    description: "Record a verification outcome on one axis: dimension in {IDENTITY, BUSINESS_STANDING, INDUSTRY_AUTHORIZATION, POLITICAL_ELIGIBILITY}; outcome in {VERIFIED, FAILED, PENDING, GRANTED, DENIED, ELIGIBLE, INELIGIBLE} constrained to that axis' enum"
    roles: [PolicyAdmin]
    code: 200
    input: [dimension, outcome, "evidence_ref?"]
    output: Advertiser
    side_effects: ["writes the matching status field on the advertiser", "increments Advertiser.version by 1"]

  - method: POST
    path: "/ad-policy/advertisers/{id}/enforcement-actions"
