            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/in-fleeting-tasks/${t_r_prep}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/vehicles/${veh_rank}/usage"
              payload: { odometer_km: 60000, rented_days_delta: 180, available_days_delta: 243, revenue_cents_delta: 990000 }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
          trigger:
            - call: "GET /fleet/vehicles/${veh_rank}/channel-recommendation"
              payload: {}
              as: RemarketingManager
              as_user_id: "u-rm-1"
            - call: "POST /fleet/remarketing-channels/${ch_retail}/suspend"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "GET /fleet/vehicles/${veh_rank}/channel-recommendation"
              payload: {}
              as: RemarketingManager
              as_user_id: "u-rm-1"
          assert:
            - "the first read returns eligible_channel_count 2 with recommended_channel_id \"${ch_retail}\", recommended_channel_code \"RETAIL_LOT\" and projected_net_proceeds_cents 1704401"
            - "the same read reports the auction's projection as 1476598, so the ranking is a strict integer DESC comparison and the 227803 cent gap is not a rounding artefact"
            - "RETAIL_LOT wins despite carrying a 56000 cent reconditioning line, because its 1.08 multiplier adds 279040 cents of gross over the auction's 0.92"
            - "after the suspend, the second read returns eligible_channel_count 1 with recommended_channel_id \"${ch_auction}\" and projected_net_proceeds_cents 1476598 - a SUSPENDED channel never enters the candidate pool"
            - "GET /fleet/vehicles/${veh_rank} is byte-identical across the two reads apart from nothing at all: the re-rank came entirely from the channel row"
            - "the tie-break contract is ASC expected_days_to_sell then ASC created_at, and RemarketingChannel.id is never consulted"

      - name: constants_are_read_from_the_declared_tables_not_inlined
        excluded_because:
          difficulty_instance: redistribution_surcharge_tier_selected_on_base_haul_not_total
          rationale: "The `Constants Applied` claim - threshold and multiplier values taken from the calculation's `constants` block - is asserted there for all seven redistribution constants at once (the two tier ceilings, the three tier percentages, HANDLING_FLAT_CENTS 7500 and TRANSPORT_PAYBACK_DAYS 45), including the 199 km / 200 km pair that pins which subtotal drives the tier lookup."

      - name: per_line_round_half_up_precision_is_honoured
        excluded_because:
          difficulty_instance: consignment_net_proceeds_per_line_rounding_before_summation
          rationale: "The `Precision` claim - declared decimal places and rounding mode honoured - is the entire subject of that instance: it pins round_half_up per cost line before summation and shows the forbidden sum-then-round order differing by exactly one cent (225235 vs 225234)."

      - name: valuation_input_set_excludes_ineligible_channels
        excluded_because:
          difficulty_instance: channel_pool_empties_one_kilometre_past_hard_mileage_band
          rationale: "The `Input Set Filtering` claim - only entities passing the declared filter enter the computation - is asserted there through excluded_channel_codes: PROGRAM_REPURCHASE is dropped for a RISK program at both odometer readings, and RETAIL_LOT drops out one kilometre past the hard band, emptying the pool."

      - name: ledger_aggregation_is_correct_after_add_and_after_reversal
        excluded_because:
          difficulty_instance: recondition_ledger_returns_to_zero_after_consignment_withdrawal
          rationale: "The `aggregation` algorithm row - running total correct after an add and correct after a reversal - is covered there end to end: total_recondition_cents rises to 48913 on the RECONDITION_COST post and returns to exactly 0 after the -48913 RECONDITION_REVERSAL, with both rows retained."

      - name: tiered_pricing_boundaries_and_marginal_rate
        excluded_because:
          difficulty_instance: redistribution_surcharge_tier_selected_on_base_haul_not_total
          rationale: "The `tiered_pricing` algorithm row - each tier boundary tested, marginal versus average rate, cross-tier straddling - is covered there: base hauls of 49750 and 50000 cents sit either side of SURCHARGE_TIER_1_CEILING_CENTS, and the 596 km case exercises tier 3, proving the whole base is charged at one tier rather than straddling."

      - name: forward_looking_metrics_include_the_whole_pipeline
        excluded_because:
          difficulty_instance: fleet_plan_forward_planned_vs_chronological_actual_divergence
          rationale: "The `forward_looking` algorithm row - pending plus confirmed included, re-evaluated when pending items change - is covered there: the IN_FLEETING vehicle sits in the planned denominator but not the actual one, which is what makes utilization_pct_planned 0.1957 while utilization_pct_actual is 0.7407."

      - name: chronological_ordering_of_observed_counters
        excluded_because:
          difficulty_instance: fleet_plan_forward_planned_vs_chronological_actual_divergence
          rationale: "The `chronological` algorithm row - processing order matters and out-of-order creation still yields the correct result - is covered by the CHRONOLOGICAL_ACTUAL variant in that instance, whose denominators are observed available-day totals at the evaluation instant rather than creation-ordered."

      - name: dual_variant_divergence_on_identical_inputs
        excluded_because:
          difficulty_instance: vehicle_residual_program_guarantee_vs_policy_schedule_divergence
          rationale: "The `Variant Divergence` claim - same data, two variants, verified delta - is asserted there as 2236000 versus 1900000 on byte-identical cost, odometer and dates, a delta of exactly 336000."

      - name: dual_variant_selection_by_program_type
        excluded_because:
          difficulty_instance: vehicle_residual_program_guarantee_vs_policy_schedule_divergence
          rationale: "The `Variant Selection` claim - the correct variant applied in the correct context - is asserted there through applied_variant: PROGRAM_GUARANTEE for the PROGRAM vehicle and POLICY_SCHEDULE for the RISK vehicle, with both figures exposed on both vehicles so selection is separable from computation."

      - name: variant_reconciliation_delta_on_switch
        excluded_because:
          difficulty_instance: vehicle_residual_program_guarantee_vs_policy_schedule_divergence
          rationale: "The `Reconciliation` claim has no switching context in this scaffold: the applied variant is pinned by ManufacturerProgram.program_type at purchase and there is no endpoint that changes a vehicle's program, so no provisional-to-final delta is ever posted. The nearest testable content - the exact 336000 cent gap that a hypothetical switch would have to post - is asserted in that instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: second_market_with_the_same_code_returns_409_duplicate_market_code
        claim_type: violation_to_error
        grounds:
          - validations[priority 9 ERR_DUPLICATE_MARKET_CODE]
        distinguishing_aspect: "Market.code uniqueness is GLOBAL, not scoped to a region, so a second ATL in a different region with a different name still collides; the code is the entity-specific ERR_DUPLICATE_MARKET_CODE at 409, not a 422 schema error."
        test_recipe:
          setup:
            - "One market with code ATL in region EAST."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
          trigger:
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta West", region: "WEST", transport_hub_distance_km: 50, transfer_cost_per_km_cents: 200, storage_cost_per_day_cents: 600, prep_capacity_per_day: 1, registration_lead_days: 5 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { dup_error: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DUPLICATE_MARKET_CODE\""
            - "GET /fleet/markets reports total_count 1 and GET /fleet/markets/${mkt_atl} still reports name \"Atlanta\" and version 1"

      - name: distinct_market_codes_both_persist_and_the_rule_stays_quiet
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 9 ERR_DUPLICATE_MARKET_CODE]
        distinguishing_aspect: "The satisfaction half of the same rule: two markets that differ ONLY in code both persist, which proves the uniqueness key is code alone and not the (code, region) pair or the name."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_a: $.data.id }
            - call: "POST /fleet/markets"
              payload: { code: "ATL2", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_b: $.data.id }
          assert:
            - "both calls return HTTP 201 and ${mkt_a} != ${mkt_b}"
            - "GET /fleet/markets reports total_count 2, and GET /fleet/markets with code \"ATL\" reports total_count 1"

      - name: min_holding_period_gate_applies_only_to_the_program_repurchase_channel
        claim_type: conditional_validation
        grounds:
          - validations[priority 16 ERR_MIN_HOLDING_PERIOD_NOT_MET]
          - state_machines[Vehicle] IN_SERVICE -> HELD_FOR_SALE
        distinguishing_aspect: "The rule is conditional on the CHANNEL, not on the vehicle: the identical 90-day-old PROGRAM vehicle is refused for PROGRAM_REPURCHASE at priority 16 and accepted for AUCTION in the next call, and because 16 precedes 18 the refusal names the holding period rather than the generic eligibility code."
        test_recipe:
          setup:
            - "One PROGRAM program with min_holding_days 180; one ATL market; ACTIVE MID-2026 policy."
            - "Two channels: PROGRAM_REPURCHASE (multiplier 1.00, no recondition) and AUCTION."
            - "One vehicle IN_SERVICE at 2026-01-15T00:00:00Z; the consignment attempts happen at 2026-04-15T00:00:00Z, exactly 90 days later, which is below the 180-day minimum."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
