  # ===========================================================================
  # Rule 8 - resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: mobile_buffered_interval_overlap
        grounds:
          - state_machines.WorkOrder.ACCEPTED_to_SCHEDULED
          - errors[ERR_MOBILE_BUFFER_VIOLATION]
          - entities.GlassShop.fields.mobile_unit_count
        distinguishing_aspect: |
          Interval semantics: MOBILE uses a right-buffered half-open interval
          [start, end + 45min) counted against mobile_unit_count concurrent
          overlaps. Two mobile jobs whose raw windows do not overlap but whose
          buffered extensions do (10:00-11:00 and 11:30-12:30 with a single
          mobile unit) collide; the same geometry without the 45-minute buffer
          would pass.
