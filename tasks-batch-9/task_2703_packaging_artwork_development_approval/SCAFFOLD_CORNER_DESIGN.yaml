      - name: settlement_and_scrap_payloads_missing_their_branch_fields_are_400s_not_state_changes
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=17]
          - endpoints[POST /error-escapes/{id}/settle]
          - endpoints[POST /inventory-runouts/{id}/disposition]
          - endpoints[GET /inventory-runouts]
          - entities.ErrorEscape.fields.actual_expedite_freight_cents
          - entities.ErrorEscape.fields.resolution
          - entities.InventoryRunout.fields.units_scrapped
          - entities.InventoryRunout.fields.units_reworked
          - entities.InventoryRunout.fields.disposition
          - state_machines.InventoryRunout.MONITORING_to_RUNOUT_COMPLETE
        distinguishing_aspect: |
          Both endpoints branch on a discriminator that makes optional fields
          mandatory, and each branch is a distinct way to earn the same error id:
          resolution SETTLED needs all THREE actual invoice amounts (so supplying two
          of three must still be a 400 - the freight line is a real line in the FINAL
          variant and defaulting it to 0 silently changes the money), and disposition
          SCRAP needs units_scrapped and units_reworked (which the conservation rule
          then checks). Neither refusal may advance a state machine, and the closing
          RUNOUT disposition - the branch where those two fields are legitimately
          absent - must succeed with 200, proving the requirement is
          branch-conditional rather than blanket.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "A US CARTON asset whose v1 was approved and then superseded by an approved v2, so v1 is OBSOLETE_PENDING and eligible for both an escape and a runout."
            - "Printer Cascade Print Co created CERTIFIED with recovery_liability_cap_cents 5000000."
            - "An escape over 4000 units discovered at DISTRIBUTION (a LATE stage, investigation fee 150000), apportioned PRINTER / 1.00, with a raised claim of 4000*42 == 168000 + 4000*7 == 28000 + 0 + 150000 == 346000, so it sits in RECOVERY_CLAIMED."
            - "A runout over v1 with on_hand_qty 5000 and weekly_usage_qty 1000, then one depletion record of 5000 units for the week of 2026-08-03, so the runout is MONITORING with remaining_qty 0 and actual_runout_date 2026-08-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
