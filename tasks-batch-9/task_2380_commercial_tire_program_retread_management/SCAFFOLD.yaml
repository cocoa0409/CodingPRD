  - method: POST
    path: "/retread-lines/{line_id}/status"
    description: "Takes a production line down for maintenance or returns it to service. A DOWN line rejects both new scheduling and job starts but keeps existing slots booked."
    roles: [DealerAdmin]
    code: 200
