            - call: "POST /api/revenue-routings"
              payload: { content_item_id: "${i_q}", stream_type: "AD", gross_revenue_cents: 10000, expected_content_item_version: "${i_qv}" }
              as: PlatformAdmin
              captures: { r_q: $.data.id }
            - call: "GET /api/channels/${ch_q}"
              payload: {}
