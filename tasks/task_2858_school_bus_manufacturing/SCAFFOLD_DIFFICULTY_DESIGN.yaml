  - rule_id: cross_entity_state_dependency
    instances:

      - name: slot_commit_gated_by_production_line_maintenance_state
        grounds:
          - validations[priority=30]
          - errors[ERR_LINE_DOWN_FOR_MAINTENANCE]
          - state_machines.ProductionLine.RUNNING_to_DOWN_FOR_MAINTENANCE
          - state_machines.BuildSlot.PLANNED_to_COMMITTED
          - calculations.line_capacity_ledger
        distinguishing_aspect: |
          The slot's own status is a perfectly valid PLANNED and its window is legal, yet the commit is
          refused because a different aggregate — the ProductionLine — is DOWN_FOR_MAINTENANCE. Planning
          a slot on a down line is still allowed (only committing is blocked), and the identical commit
          call succeeds once the line returns to RUNNING, with no change to the slot itself.
        test_recipe:
          setup:
            - "TYPE_C_CONV + DSL-100, PUBLISHED TX 2026-2027 profile, a 1-unit order promised 2026-12-01 with its BusUnit minted"
            - "ProductionLine L-B1 (TYPE_C, horizon 30 slot-days, changeover buffer 3), then moved to DOWN_FOR_MAINTENANCE"
            - "BuildSlot [2026-09-07, 2026-09-14) planned on that line while it is down (planning is legal)"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
