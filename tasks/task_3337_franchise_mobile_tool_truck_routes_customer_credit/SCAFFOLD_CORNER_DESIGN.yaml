          assert:
            - "the duplicate filing captures ${dup_error} == ERR_ROUTE_CODE_DUPLICATE"
            - "the duplicate filing http status is 409"
            - "the second franchisee still holds no routes"

      - name: validation_shop_zip_must_belong_to_route_territory
        claim_type: cross_entity_validation
        grounds: ["validations[priority=12]", "errors[ERR_SHOP_ZIP_NOT_IN_TERRITORY]", entities.ShopLocation.fields.zip_code, entities.Route.fields.zip_codes]
        distinguishing_aspect: "A shop's zip_code must be a member of the owning route's zip_codes set: 75002 is accepted on a route covering [75001, 75002] and refused with ERR_SHOP_ZIP_NOT_IN_TERRITORY on a route covering only [75001]."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; routes R1 (zip_codes [75001]) and R2 (zip_codes [75001, 75002]) both created"]
