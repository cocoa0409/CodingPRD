            - "cert_total == 1000  (link 2: void -> period certified recompute; only T2 remains)"
            - "cert_rate == 0.00  (0 diverted of 1000)"
            - "rebate_est == 0  (T1's 10000c accrual reversed by the void)"
            - "standing == PROBATION  (one non-terminal CRITICAL event)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: validate_rejected_future_ticket_state_wins
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_TICKET_NOT_PENDING]
          - errors[ERR_TICKET_DATE_FUTURE]
        distinguishing_aspect: |
          Category pair state (p6) vs business_temporal (p10): the ticket is
          REJECTED (violates validate's PENDING precondition) AND its ticket_date
          2026-08-20 is later than the clock date 2026-08-10; the state-category
          error ERR_TICKET_NOT_PENDING must win over ERR_TICKET_DATE_FUTURE.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; T1 with future ticket_date 2026-08-20, created PENDING then REJECTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site PC", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-20", external_ticket_ref: "PC-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/reject"
              payload: { reason: "scale calibration overdue" }
              as: DataSteward
          trigger:
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TICKET_NOT_PENDING  (state priority 6 beats business_temporal priority 10; ERR_TICKET_DATE_FUTURE must NOT be returned)"
            - "WeightTicket.${t1_id}.validation_status == REJECTED  (unchanged)"

      - name: activate_contract_overlap_wins_over_rate_cap
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_CONTRACT_STREAM_OVERLAP]
          - errors[ERR_REBATE_RATE_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_constraint (p8) vs business_fiscal (p11): the
          activating contract both overlaps an ACTIVE same-stream contract and
          carries a rebate rate above the site policy cap; the constraint error
          ERR_CONTRACT_STREAM_OVERLAP must win over ERR_REBATE_RATE_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Site (max_rebate_rate_per_ton_cents 12000); vendor ACTIVE"
            - "C1 CARDBOARD [2026-01-01,2026-12-31] ACTIVE"
            - "C2 CARDBOARD [2026-06-01,2027-05-31] rebate 15000c/ton DRAFT — overlaps C1 AND exceeds the cap"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site OV", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "CARDBOARD", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "CARDBOARD", rebate_per_ton_cents: 15000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-06-01", window_end: "2027-05-31" }
              as: SustainabilityManager
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /contracts/${c2_id}/activate"
              payload: {}
              as: SustainabilityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTRACT_STREAM_OVERLAP  (constraint priority 8 beats fiscal priority 11; ERR_REBATE_RATE_CAP_EXCEEDED must NOT be returned)"
            - "VendorContract.${c2_id}.status == DRAFT  (unchanged)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: zero_waste_threshold_exactly_90
        grounds:
          - calculations.certification_threshold
          - state_machines.CertificationApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Metric diversion_rate at the >= 90.0 ZERO_WASTE boundary, reached via
          the decide endpoint: a certified rate of exactly 90.00 (9 lbs diverted
          of 10) satisfies the inclusive threshold and the approval succeeds.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN"
            - "T1 RECYCLING net 9 lbs VALIDATED; T2 LANDFILL net 1 lb VALIDATED; period CLOSED -> certified rate 90.00"
            - "DRAFT application for ZERO_WASTE against the closed period, submitted by mgr-1, under review"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site ZW", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 10, tare_weight_lbs: 1, ticket_date: "2026-08-05", external_ticket_ref: "ZW-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "LANDFILL", gross_weight_lbs: 2, tare_weight_lbs: 1, ticket_date: "2026-08-05", external_ticket_ref: "ZW-T2" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /tickets/${t2_id}/validate"
              payload: {}
              as: DataSteward
            - call: "POST /scorecard_periods/${period_id}/close"
              payload: {}
              as: CertificationOfficer
            - call: "POST /certification_applications"
              payload: { site_id: "${site_id}", level_requested: "ZERO_WASTE", reporting_period_id: "${period_id}", expected_site_version: "${site_v}" }
              as: SustainabilityManager
              captures: { app_id: $.data.id }
            - call: "POST /certification_applications/${app_id}/submit"
              payload: {}
              as: SustainabilityManager
              as_user_id: "mgr-1"
            - call: "POST /certification_applications/${app_id}/start_review"
              payload: {}
              as: CertificationOfficer
          trigger:
            - call: "POST /certification_applications/${app_id}/decide"
              payload: { outcome: "APPROVED" }
              as: CertificationOfficer
              as_user_id: "officer-1"
              captures: { app_status: $.data.status }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: CertificationOfficer
              captures: { tier: $.data.certification_tier }
          assert:
            - "ScorecardPeriod.${period_id}.diversion_rate_certified_pct == 90.00  (exactly at the inclusive boundary)"
            - "app_status == APPROVED  (>= 90.0 passes; a > 90 reading would wrongly reject)"
            - "tier == ZERO_WASTE"

      - name: close_period_zero_validated_tickets
        grounds:
          - calculations.diversion_rate
          - calculations.goal_evaluation
          - state_machines.ScorecardPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Metric total validated weight at the empty-set boundary, reached via the
          close endpoint: with zero VALIDATED tickets the rate must be the pinned
          0.00 (no division error), settled amounts 0, and the contained
          DIVERSION_RATE goal evaluates MISSED (0.00 >= 80 is false).
        test_recipe:
          setup:
            - "Site; period [2026-08-01,2026-09-01) OPEN with no tickets; ACTIVE goal DIVERSION_RATE target 80 window [2026-08-01,2026-09-01)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site EZ", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /goals"
              payload: { site_id: "${site_id}", metric: "DIVERSION_RATE", target_value: 80, window_start: "2026-08-01", window_end: "2026-09-01" }
              as: SustainabilityManager
              captures: { goal_id: $.data.id }
          trigger:
            - call: "POST /scorecard_periods/${period_id}/close"
              payload: {}
              as: CertificationOfficer
            - call: "GET /goals/${goal_id}"
              payload: {}
              as: CertificationOfficer
              captures: { goal_status: $.data.status }
          assert:
            - "ScorecardPeriod.${period_id}.status == CLOSED"
            - "ScorecardPeriod.${period_id}.total_waste_lbs_validated == 0"
            - "ScorecardPeriod.${period_id}.diversion_rate_certified_pct == 0.00  (pinned zero-denominator result, not an error)"
            - "ScorecardPeriod.${period_id}.rebate_settled_cents == 0"
            - "ScorecardPeriod.${period_id}.cost_avoided_cents == 0"
            - "goal_status == MISSED"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_reporting_period_closed
        grounds:
          - state_machines.CertificationApplication.DRAFT_to_SUBMITTED
          - validations[priority=9]
          - errors[ERR_PERIOD_NOT_CLOSED]
        distinguishing_aspect: |
          Entity pair CertificationApplication -> ScorecardPeriod: submit is
          gated on the referenced reporting period being CLOSED; while the period
          is OPEN the transition is rejected even though the application itself
          is in a valid DRAFT state.
        test_recipe:
          setup:
            - "Site; period [2026-08-01,2026-09-01) still OPEN; DRAFT application referencing it"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site XD", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id }
            - call: "POST /certification_applications"
              payload: { site_id: "${site_id}", level_requested: "BRONZE", reporting_period_id: "${period_id}", expected_site_version: "${site_v}" }
              as: SustainabilityManager
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /certification_applications/${app_id}/submit"
              payload: {}
              as: SustainabilityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERIOD_NOT_CLOSED"
            - "CertificationApplication.${app_id}.status == DRAFT  (unchanged)"

      - name: contract_activate_requires_vendor_active
        grounds:
          - state_machines.VendorContract.DRAFT_to_ACTIVE
          - validations[priority=9]
          - errors[ERR_VENDOR_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair VendorContract -> Vendor: activation is gated on the
          referenced vendor being ACTIVE; with the vendor SUSPENDED the DRAFT
          contract cannot activate — a different entity pair than the
          application/period dependency.
        test_recipe:
          setup:
            - "Site; vendor SUSPENDED; contract DRAFT referencing that vendor"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site XV", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /vendors/${vendor_id}/set_status"
              payload: { to_status: "SUSPENDED" }
              as: CertificationOfficer
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "CARDBOARD", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VENDOR_NOT_ACTIVE"
            - "VendorContract.${contract_id}.status == DRAFT  (unchanged)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_window_closed_interval_touch
        grounds:
          - state_machines.VendorContract.DRAFT_to_ACTIVE
          - errors[ERR_CONTRACT_STREAM_OVERLAP]
        distinguishing_aspect: |
          Resource VendorContract with CLOSED interval semantics: a new contract
          whose window_start 2026-12-31 merely touches the existing ACTIVE
          contract's window_end 2026-12-31 IS an overlap and is rejected, while a
          strictly later window activates fine.
        test_recipe:
          setup:
            - "Site; vendor; C1 MIXED_RECYCLABLES [2026-01-01,2026-12-31] ACTIVE"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site TO", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 9000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-12-31", window_end: "2027-06-30" }
              as: SustainabilityManager
              captures: { c2_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 9000, contamination_penalty_per_ton_cents: 2000, window_start: "2027-01-01", window_end: "2027-06-30" }
              as: SustainabilityManager
              captures: { c3_id: $.data.id }
          trigger:
            - call: "POST /contracts/${c2_id}/activate"
              payload: {}
              as: SustainabilityManager
              captures: { err: $.data.error_id }
            - call: "POST /contracts/${c3_id}/activate"
              payload: {}
              as: SustainabilityManager
              captures: { c3_status: $.data.status }
          assert:
            - "err == ERR_CONTRACT_STREAM_OVERLAP  (endpoint touch counts under closed-interval semantics)"
            - "VendorContract.${c2_id}.status == DRAFT"
            - "c3_status == ACTIVE  (2027-01-01 is strictly after 2026-12-31: disjoint)"

      - name: goal_window_half_open_adjacency
        grounds:
          - errors[ERR_GOAL_WINDOW_OVERLAP]
          - entities.SiteGoal.fields.window_end
        distinguishing_aspect: |
          Resource SiteGoal with HALF-OPEN [start, end) semantics — the dual of
          the contract rule: a goal starting exactly at the existing goal's
          window_end is ADJACENT, not overlapping, and is accepted, while a goal
          starting one day earlier is rejected. Different entity and different
          interval arithmetic than the contract instance.
        test_recipe:
          setup:
            - "Site; ACTIVE goal G1 DIVERSION_RATE [2026-01-01,2026-07-01)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site GO", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /goals"
              payload: { site_id: "${site_id}", metric: "DIVERSION_RATE", target_value: 80, window_start: "2026-01-01", window_end: "2026-07-01" }
              as: SustainabilityManager
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /goals"
              payload: { site_id: "${site_id}", metric: "DIVERSION_RATE", target_value: 85, window_start: "2026-07-01", window_end: "2027-01-01" }
              as: SustainabilityManager
              captures: { g2_status: $.data.status }
            - call: "POST /goals"
              payload: { site_id: "${site_id}", metric: "DIVERSION_RATE", target_value: 90, window_start: "2026-06-30", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { err: $.data.error_id }
          assert:
            - "g2_status == ACTIVE  (adjacency at 2026-07-01 allowed under half-open semantics)"
            - "err == ERR_GOAL_WINDOW_OVERLAP  (2026-06-30 < 2026-07-01 overlaps G1)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: validate_then_void_conserves_validated_pounds
        grounds:
          - state_machines.WeightTicket.PENDING_to_VALIDATED
          - state_machines.WeightTicket.VALIDATED_to_VOIDED
          - calculations.diversion_rate
        distinguishing_aspect: |
          Conserved quantity is certified MASS: total_waste_lbs_validated ==
          sum(net_weight_lbs over VALIDATED in-window tickets). Validate (+2000)
          paired with void (-2000) returns the period to exactly its prior value
          with no drift.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE; period OPEN; T1 RECYCLING net 2000 PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site IM", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id, base_total: $.data.total_waste_lbs_validated }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 3000, tare_weight_lbs: 1000, ticket_date: "2026-08-05", external_ticket_ref: "IM-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { total_after_validate: $.data.total_waste_lbs_validated, diverted_after_validate: $.data.diverted_lbs_validated }
            - call: "POST /tickets/${t1_id}/void"
              payload: { reason: "duplicate scale record" }
              as: DataSteward
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { total_after_void: $.data.total_waste_lbs_validated, diverted_after_void: $.data.diverted_lbs_validated }
          assert:
            - "base_total == 0"
            - "total_after_validate == 2000"
            - "diverted_after_validate == 2000"
            - "total_after_void == 0  (forward + compensating action leaves certified mass unchanged)"
            - "diverted_after_void == 0"
            - "total_after_void == base_total"

      - name: validate_then_void_conserves_rebate_cents
        grounds:
          - state_machines.WeightTicket.PENDING_to_VALIDATED
          - state_machines.WeightTicket.VALIDATED_to_VOIDED
          - calculations.ticket_rebate_estimate
        distinguishing_aspect: |
          Conserved quantity is accrued rebate MONEY: rebate_estimate_cents ==
          sum(estimate over VALIDATED diverted in-window tickets). Validate
          (+20000c for a clean 2-ton ticket) paired with void returns the accrual
          to exactly zero — a different conserved quantity than certified mass.
        test_recipe:
          setup:
            - "Clock 2026-08-10; site; vendor; contract ACTIVE (rebate 10000c/ton); period OPEN; T1 RECYCLING net 4000 lbs pct 3 PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /sites"
              payload: { name: "Site IC", landfill_tip_fee_per_ton_cents: 5500, max_rebate_rate_per_ton_cents: 12000 }
              as: SustainabilityManager
              captures: { site_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "HaulerCo", vendor_type: "HAULER" }
              as: CertificationOfficer
              captures: { vendor_id: $.data.id }
            - call: "POST /contracts"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", material_stream: "MIXED_RECYCLABLES", rebate_per_ton_cents: 10000, contamination_penalty_per_ton_cents: 2000, window_start: "2026-01-01", window_end: "2026-12-31" }
              as: SustainabilityManager
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: SustainabilityManager
            - call: "POST /scorecard_periods"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2026-09-01" }
              as: CertificationOfficer
              captures: { period_id: $.data.id, base_rebate: $.data.rebate_estimate_cents }
            - call: "POST /tickets"
              payload: { site_id: "${site_id}", vendor_id: "${vendor_id}", contract_id: "${contract_id}", material_stream: "MIXED_RECYCLABLES", disposal_route: "RECYCLING", gross_weight_lbs: 5000, tare_weight_lbs: 1000, contamination_pct: 3, ticket_date: "2026-08-05", external_ticket_ref: "IC-T1" }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /tickets/${t1_id}/validate"
              payload: {}
              as: DataSteward
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { rebate_after_validate: $.data.rebate_estimate_cents }
            - call: "POST /tickets/${t1_id}/void"
              payload: { reason: "wrong contract referenced" }
              as: DataSteward
            - call: "GET /scorecard_periods/${period_id}"
              payload: {}
              as: CertificationOfficer
              captures: { rebate_after_void: $.data.rebate_estimate_cents }
          assert:
            - "base_rebate == 0"
            - "rebate_after_validate == 20000  (2t * 10000c * factor 1.0, pct 3 < 5, no penalty)"
            - "rebate_after_void == 0  (accrual reversed exactly; no residual cents)"
            - "rebate_after_void == base_rebate"
