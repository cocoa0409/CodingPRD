              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /orders/${ord_w5_id}/confirm"
              payload: { expected_production_day_version: "${day0904_v}" }
              as: RouteOpsManager
            - *c_clock0904
            - call: "POST /production-days/${day0904_id}/close"
              payload: {}
