            - "http_status == 403"

  # ------------------------------------------------ cross_cutting_complexity_layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: campaign_patch_increments_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[campaign-edit-stale-version]", entities.Campaign.fields.version]
        distinguishing_aspect: "PATCH /campaigns/{id} with the correct expected_campaign_version succeeds and increments version 1 -> 2."
        test_recipe:
          setup: ["A DRAFT campaign at version 1."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id, camp_v: $.data.version }
          trigger:
            - call: "PATCH /campaigns/${camp_id}"
              payload: { story: "Updated story", expected_campaign_version: "${camp_v}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { new_v: $.data.version }
          assert:
            - "Campaign.${camp_id}.version == 2"

      - name: campaign_edit_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[campaign-edit-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /campaigns/{id} carrying a version captured before publish (now stale) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A campaign whose version was captured at 1, then advanced to 2 by publish."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 500000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id, camp_v_old: $.data.version }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "PATCH /campaigns/${camp_id}"
              payload: { story: "Stale edit", expected_campaign_version: "${camp_v_old}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: payout_create_stale_campaign_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payout-create-stale-campaign]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second payout carrying the campaign version observed before the first payout (which advanced version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Verified campaign with net-100000 donation; version captured, then a first payout created (version advanced)."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 1000000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v_old: $.data.version }
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 1000, expected_campaign_version: "${camp_v_old}" }
              as: Organizer
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 1000, expected_campaign_version: "${camp_v_old}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "http_status == 412"

      - name: payout_reverse_decrements_paid_out
        claim_type: cascading_side_effects
        grounds: [state_machines.Payout.PAID_to_REVERSED, entities.Campaign.fields.paid_out_cents, entities.Beneficiary.fields.total_paid_out_cents]
        distinguishing_aspect: "Reversing a PAID payout of 1000 decrements Campaign.paid_out_cents and Beneficiary.total_paid_out_cents back to 0 (compensation)."
        test_recipe:
          setup: ["Verified campaign, net-100000 donation, a payout of 1000 taken to PAID."]
          setup_api_calls:
            - call: "POST /organizers"
              payload: { display_name: "O", email: "o@x.com" }
              as: Guest
              captures: { org_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { legal_name: "B", email: "b@x.com" }
              as: Guest
              captures: { ben_id: $.data.id }
            - call: "POST /donors"
              payload: { display_name: "D", email: "d@x.com" }
              as: Guest
              captures: { donor_id: $.data.id }
            - call: "POST /beneficiaries/${ben_id}/withdrawal-setup"
              payload: { stripe_account_ref: "acct_test" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/submit-verification"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /beneficiaries/${ben_id}/approve-verification"
              payload: {}
              as: TrustSafetyAgent
            - call: "POST /campaigns"
              payload: { beneficiary_id: "${ben_id}", title: "T", story: "S", goal_cents: 1000000, category: "MEDICAL" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${donor_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
            - call: "POST /payouts"
              payload: { campaign_id: "${camp_id}", amount_cents: 1000, expected_campaign_version: "${camp_v}" }
              as: Organizer
              as_user_id: "${org_id}"
              captures: { payout_id: $.data.id }
            - call: "POST /payouts/${payout_id}/process"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payouts/${payout_id}/settle"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /payouts/${payout_id}/reverse"
              payload: {}
              as: TrustSafetyAgent
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Organizer
              as_user_id: "${org_id}"
              captures: { paid: $.data.paid_out_cents }
          assert:
            - "Payout.${payout_id}.status == REVERSED"
            - "Campaign.${camp_id}.paid_out_cents == 0"
            - "Beneficiary.${ben_id}.total_paid_out_cents == 0"

