            - "HOP 2: Order.${order_id}.fulfillment_status == NEW while pricing_status stays PROVISIONAL and total_cents stays 121155 (4000 lb at 30 with the 1.5% tier and 2.5% fuel)"
            - "HOP 3: RouteStop.${stop_id}.status == CANCELLED and DeliveryRoute.${route_id}.stop_count == 0, planned_load_lb == 0, utilization_pct == 0.00"
            - "HOP 4: DeliveryRoute.${route_id}.status == PLANNING and allergen_class_lock == NONE and RouteStop.${stop_id}.sequence_no == 0"
