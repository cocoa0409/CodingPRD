# =============================================================================
# SCAFFOLD — Weigh Station Bypass & Fleet Compliance Service
# (PrePass/Drivewyze-style bypass program: enrollment, credentialing, decision
#  events, per-state rules engine, per-vehicle subscription billing, ROI)
# =============================================================================

scenario: |
  Weigh Station Bypass & Fleet Compliance Service (PrePass/Drivewyze style service): carrier enrollment & safety-score eligibility, transponder/app provisioning per vehicle, bypass decision events & audit trail, weight & credential verification data feeds, state participation differences & rules engine, subscription billing per vehicle, inspection reduction reporting & ROI, deactivation on safety-score change

domain_name: weigh-station-bypass
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers      # ISS posture tiers + per-state refusal thresholds + rate caps + deterministic screen, all boundary-pinned
    - derived_field_reconciliation # Carrier posture/credit_balance/latest_* reconciled from append-only feeds and ledger
    - optimistic_concurrency       # OCC on Carrier.version (snapshot post, override request) and StateProgramConfig.version (rules patch)
    - cascading_side_effects       # safety-score change -> posture -> carrier suspension -> credential suspension -> subscription pause -> ledger/billing effects
  entity_topology: flat            # peer collections under /api, FK-linked in bodies; no nested write paths
  state_machine_shape: cyclic      # dominant shape; branching (dispute fork + appeal cycle) and parallel (subscription lifecycle x payment standing) also present
  relationship_patterns:
    - one_to_many                  # Carrier -> Vehicle -> BypassCredential; Carrier -> Subscription/Invoice/Snapshot
    - cross_aggregate              # BypassEvent FKs Vehicle/Station/Carrier; decision reads through Station -> StateProgramConfig
  role_model: segregation_of_duties # override request (CarrierManager) vs decide (ComplianceOfficer); dispute first review vs appeal review must be different officers
  consistency_model: immediate     # all cascade effects visible in the triggering request's response / subsequent GETs

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: dot_number, type: string, source: input, description: "USDOT number; globally unique (ERR_DUPLICATE_DOT_NUMBER)" }
      - { name: legal_name, type: string, source: input, description: "Carrier legal name" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: eligibility_status, type: enum, source: computed, default: NOT_EVALUATED, description: "NOT_EVALUATED | ELIGIBLE | CONDITIONAL | INELIGIBLE; posture derived from latest SafetyScoreSnapshot + in-force EligibilityOverride (calc carrier_eligibility_posture)" }
      - { name: latest_snapshot_id, type: string, source: system, description: "Pointer to SafetyScoreSnapshot.id (parent-side derived pointer, not a child FK): the snapshot with max effective_date (tie: latest created_at); null until first snapshot" }
      - { name: latest_iss_score, type: integer, source: computed, description: "iss_score of latest snapshot; null until first snapshot" }
      - { name: latest_safety_rating, type: enum, source: computed, description: "SATISFACTORY | CONDITIONAL | UNSATISFACTORY of latest snapshot; null until first snapshot" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over credit_ledger entries; recomputed on every ledger append" }
      - { name: credit_ledger, type: array, source: system, default: "[]", description: "Append-only embedded ledger entries {amount_cents (signed int), reason: DISPUTE_OVERTURN_CREDIT | INVOICE_CREDIT_APPLICATION, reference_id, recorded_at}; entries never mutated or removed" }
      - { name: closed_billing_periods, type: array, source: system, default: "[]", description: "Period labels 'YYYY-MM' already closed by close-billing-period; uniqueness guard for invoice generation" }

  - name: StateProgramConfig
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter state code; globally unique (ERR_DUPLICATE_STATE_CONFIG)" }
      - { name: participation_status, type: enum, source: system, default: PILOT, description: "PILOT | PARTICIPATING | SUSPENDED; transitions via PATCH (PILOT->PARTICIPATING, PILOT->SUSPENDED, PARTICIPATING<->SUSPENDED)" }
      - { name: iss_refusal_threshold, type: integer, source: input, default: 75, constraints: "50..100", description: "Per-state refusal line: carrier latest_iss_score >= threshold => PULL_IN reason ISS_ABOVE_STATE_THRESHOLD" }
      - { name: random_pull_in_rate_bps, type: integer, source: input, default: 0, constraints: "0..10000", description: "Deterministic screen rate; N = floor(10000/bps); every Nth approach per (station, calendar day) is pulled in; 0 disables" }
      - { name: bypass_rate_cap_bps, type: integer, source: input, default: 10000, constraints: "1..10000", description: "Max share of approaches per (carrier, state, calendar month) that may be bypassed; CONDITIONAL carriers use floor(cap/2)" }
      - { name: hazmat_bypass_allowed, type: boolean, source: input, default: false, description: "Whether hazmat loads may receive bypass in this state" }
      - { name: requires_weight_clearance, type: boolean, source: input, default: true, description: "Whether a WIM weight reading within tolerance is mandatory for bypass" }
      - { name: credential_sets_required, type: array, source: input, default: "[IFTA, IRP, UCR]", description: "Subset of [IFTA, IRP, UCR, HOS_LOG] that must be present in credentials_presented" }

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: state_program_config_id, type: string, source: input, description: "FK -> StateProgramConfig.id; state rules governing this station" }
      - { name: station_code, type: string, source: input, description: "Station code; globally unique (ERR_DUPLICATE_STATION_CODE)" }
      - { name: station_type, type: enum, source: input, description: "FIXED_SCALE | WIM_ONLY | MOBILE_PATROL (MOBILE_PATROL never bypasses)" }
      - { name: supported_channel, type: enum, source: input, description: "TRANSPONDER | MOBILE_APP | BOTH" }
      - { name: operational_status, type: enum, source: system, default: OPERATIONAL, description: "OPERATIONAL | CLOSED_TEMP | CLOSED_PERM; OPERATIONAL<->CLOSED_TEMP, ->CLOSED_PERM; CLOSED_PERM terminal" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; owning carrier (immutable)" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number; globally unique (ERR_DUPLICATE_VIN)" }
      - { name: plate_number, type: string, source: input, description: "License plate" }
      - { name: plate_state, type: string, source: input, description: "Plate jurisdiction" }
      - { name: home_state_code, type: string, source: input, description: "Vehicle home state; drives PILOT surcharge on invoice lines" }
      - { name: gvwr_lbs, type: integer, source: input, constraints: "> 0", description: "Registered gross vehicle weight rating in lbs; basis of weight clearance" }
      - { name: hazmat_endorsed, type: boolean, source: input, default: false, description: "Whether vehicle is hazmat-endorsed" }
      - { name: service_status, type: enum, source: system, default: IN_SERVICE, description: "IN_SERVICE | OUT_OF_SERVICE | RETIRED; IN_SERVICE<->OUT_OF_SERVICE via PATCH, ->RETIRED terminal" }

  - name: BypassCredential
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; provisioned vehicle" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; denormalized from vehicle at creation for scoping/filtering" }
      - { name: device_type, type: enum, source: input, description: "TRANSPONDER | MOBILE_APP; at most one credential per (vehicle, device_type) with status in {PROVISIONED, ACTIVE, SUSPENDED} (ERR_CREDENTIAL_TYPE_ALREADY_ACTIVE)" }
      - { name: device_serial, type: string, source: input, description: "Device/app serial; globally unique (ERR_DUPLICATE_DEVICE_SERIAL)" }
      - { name: status, type: enum, source: system, default: PROVISIONED, description: "PROVISIONED | ACTIVE | SUSPENDED | DEACTIVATED; PROVISIONED->ACTIVE, ACTIVE->SUSPENDED, SUSPENDED->ACTIVE, any-non-terminal->DEACTIVATED (terminal)" }
      - { name: status_reason, type: enum, source: system, default: NONE, description: "NONE | MANUAL | SAFETY_INELIGIBLE | VEHICLE_RETIRED | CARRIER_TERMINATED; recorded on SUSPENDED/DEACTIVATED transitions" }

  - name: VehicleSubscription
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; billed carrier" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; subscribed vehicle" }
      - { name: service_start_date, type: string, source: input, description: "First billable/service date (YYYY-MM-DD), inclusive; must be >= today and <= service_end_date (ERR_INVALID_DATE_RANGE)" }
      - { name: service_end_date, type: string, source: input, description: "Last service date (YYYY-MM-DD), INCLUSIVE — closed-interval semantics; overlap with another non-CLOSED subscription of the same vehicle is rejected (ERR_SUBSCRIPTION_WINDOW_OVERLAP), and adjacency (start == existing end) IS a conflict" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | PAUSED | CLOSED; SCHEDULED if start_date > today else ACTIVE at creation" }
      - { name: payment_standing, type: enum, source: system, default: CURRENT, description: "CURRENT | PAST_DUE; parallel dimension independent of status; PAST_DUE set by past-due invoice sweep, cleared when no PAST_DUE invoices remain" }
      - { name: paused_at, type: string, source: system, description: "Date (YYYY-MM-DD) current pause began; null unless status == PAUSED" }
      - { name: paused_days_current_period, type: integer, source: system, default: 0, description: "Accumulated paused days in the current open billing period; incremented on resume, consulted and reset at billing close" }
      - { name: closed_reason, type: enum, source: system, description: "CANCELLED | EXPIRED | TERMINATED_CARRIER | VEHICLE_RETIRED; null unless CLOSED" }

  - name: SafetyScoreSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; scored carrier" }
      - { name: iss_score, type: integer, source: input, constraints: "0..100 (ERR_INVALID_ISS_SCORE)", description: "FMCSA-style ISS score, higher is worse" }
      - { name: safety_rating, type: enum, source: input, description: "SATISFACTORY | CONDITIONAL | UNSATISFACTORY" }
      - { name: source, type: enum, source: input, description: "FMCSA_FEED | MANUAL_AUDIT" }
      - { name: effective_date, type: string, source: input, description: "YYYY-MM-DD the score takes effect; must be <= today (ERR_FUTURE_EFFECTIVE_DATE)" }
      - { name: expected_carrier_version, type: integer, source: input, description: "OCC: must equal Carrier.version at write time (ERR_STALE_VERSION)" }

  - name: BypassEvent
    parent: null
    common_fields: false
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; approaching vehicle" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; approached station" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; denormalized from vehicle at creation (immutable audit copy)" }
      - { name: approach_at, type: string, source: input, description: "ISO8601 UTC of approach; must be <= now (ERR_FUTURE_APPROACH) and >= now - 48h (ERR_STALE_APPROACH); (vehicle_id, station_id, approach_at) unique (ERR_DUPLICATE_BYPASS_EVENT)" }
      - { name: measured_weight_lbs, type: integer, source: input, description: "WIM weight reading; null/absent when WIM unavailable" }
      - { name: credentials_presented, type: array, source: input, default: "[]", description: "Subset of [IFTA, IRP, UCR, HOS_LOG] verified at roadside" }
      - { name: hazmat_load, type: boolean, source: input, default: false, description: "Whether the load is hazmat" }
      - { name: decision, type: enum, source: computed, description: "BYPASS_GRANTED | PULL_IN; output of bypass_decision_evaluation; immutable" }
      - { name: decision_reasons, type: array, source: computed, description: "Empty for BYPASS_GRANTED; exactly one reason code (first failing check in pinned order) for PULL_IN" }
      - { name: selected_credential_id, type: string, source: system, description: "Credential chosen by the selector (channel-compatible, TRANSPONDER preferred over MOBILE_APP, created_at ASC tie-break); null when none ACTIVE" }
      - { name: ruleset_version, type: integer, source: system, description: "StateProgramConfig.version pinned at decision time; later config patches never alter recorded events" }
      - { name: weight_verified, type: boolean, source: computed, description: "true iff measured_weight_lbs is non-null and <= gvwr + floor(gvwr * WIM_TOLERANCE_BPS / 10000); see calculation" }
      - { name: credentials_complete, type: boolean, source: computed, description: "true iff credential_sets_required ⊆ credentials_presented" }
      - { name: screen_index, type: integer, source: system, description: "If RANDOM_SCREEN fired: the per-(station, day) approach ordinal that triggered it; else null" }
      - { name: cap_granted_before, type: integer, source: system, description: "Bypasses already granted for (carrier, state, month-of-approach_at) before this event" }
      - { name: cap_total_before, type: integer, source: system, description: "Total prior approaches for (carrier, state, month-of-approach_at) before this event" }

  - name: BypassDispute
    parent: null
    common_fields: true
    fields:
      - { name: bypass_event_id, type: string, source: input, description: "FK -> BypassEvent.id; disputed event; at most one dispute with status in {OPENED, UPHELD, APPEALED} per event (ERR_DISPUTE_ALREADY_OPEN)" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; denormalized from event at creation" }
      - { name: reason, type: string, source: input, description: "Free-text dispute reason" }
      - { name: claimed_credit_cents, type: integer, source: input, constraints: "1..100000 (ERR_CREDIT_AMOUNT_OUT_OF_RANGE)", description: "Credit the carrier claims for a wrongful PULL_IN" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED -> UPHELD | OVERTURNED; UPHELD -> APPEALED; APPEALED -> UPHELD_FINAL | OVERTURNED; terminal: OVERTURNED, UPHELD_FINAL" }
      - { name: first_reviewer_id, type: string, source: system, description: "X-User-ID of officer who adjudicated from OPENED" }
      - { name: appeal_reviewer_id, type: string, source: system, description: "X-User-ID of officer who adjudicated from APPEALED; must differ from first_reviewer_id (ERR_SEGREGATION_OF_DUTIES)" }
      - { name: granted_credit_cents, type: integer, source: system, description: "Credit granted on OVERTURNED (= adjudicate input credit_amount_cents, default claimed_credit_cents); null otherwise" }
      - { name: adjudicated_at, type: string, source: system, description: "ISO8601 of latest adjudication" }

  - name: EligibilityOverride
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; override subject" }
      - { name: reason, type: string, source: input, description: "Justification for the waiver" }
      - { name: start_date, type: string, source: input, description: "First in-force date (YYYY-MM-DD), inclusive; half-open window [start_date, end_date)" }
      - { name: end_date, type: string, source: input, description: "Window end (YYYY-MM-DD), EXCLUSIVE; must be > start_date (ERR_INVALID_DATE_RANGE); back-to-back windows (next.start == prev.end) are allowed" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> APPROVED | REJECTED; APPROVED -> ACTIVE (clock reaches start_date) | REVOKED; ACTIVE -> EXPIRED (clock reaches end_date) | REVOKED | STALE (newer snapshot posted); terminal: REJECTED, REVOKED, EXPIRED, STALE" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding ComplianceOfficer" }
      - { name: approved_against_snapshot_id, type: string, source: system, description: "FK -> SafetyScoreSnapshot.id; snapshot pinned at APPROVE time (carrier.latest_snapshot_id then); a newer snapshot flips ACTIVE override to STALE" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; billed carrier" }
      - { name: period_year, type: integer, source: input, description: "Billing period year" }
      - { name: period_month, type: integer, source: input, constraints: "1..12", description: "Billing period month" }
      - { name: lines, type: array, source: computed, description: "Per-subscription lines {vehicle_id, subscription_id, tier_rate_cents, surcharge_cents, billable_days, line_net_cents}; line_net rounded HALF_UP per line, then summed" }
      - { name: billed_line_count, type: integer, source: computed, description: "Number of billed lines; tier basis (1-10 TIER_1, 11-50 TIER_2, 51+ TIER_3)" }
      - { name: tier_applied, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3; average-rate application — one rate applies to ALL lines" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of line_net_cents over lines" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "min(carrier credit_balance_cents, gross_cents) at close; appended as negative ledger entry" }
      - { name: amount_due_cents, type: integer, source: computed, description: "gross_cents - credit_applied_cents" }
      - { name: due_date, type: string, source: computed, description: "First day of month after period + 14 days (e.g., period 2026-08 -> 2026-09-15)" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED -> PAID (record-payment of exact amount_due, or credit auto-apply) | PAST_DUE (clock passes due_date); PAST_DUE -> PAID" }
      - { name: issued_at, type: string, source: system, description: "ISO8601 issuance timestamp" }

  - name: InspectionReport
    parent: null
    common_fields: false
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; inspected carrier" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; inspected vehicle" }
      - { name: inspection_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3" }
      - { name: inspected_at, type: string, source: input, description: "ISO8601 UTC; must be <= now (ERR_FUTURE_INSPECTION)" }
      - { name: violations_found, type: integer, source: input, constraints: ">= 0", description: "Count of violations cited" }
      - { name: out_of_service_order, type: boolean, source: input, default: false, description: "Whether an out-of-service order was issued" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    initial_state: ENROLLED
    terminal_states: [TERMINATED]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /api/carriers/{carrierId}/transition {to_status: ACTIVE}"
        actor: ComplianceOfficer
        preconditions:
          - "eligibility_status IN {ELIGIBLE, CONDITIONAL} (ERR_CARRIER_INELIGIBLE_FOR_APPROVAL if INELIGIBLE or NOT_EVALUATED)"
        side_effects:
          - "increments Carrier.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/carriers/{carrierId}/transition {to_status: ACTIVE}"
        actor: ComplianceOfficer
        preconditions:
          - "eligibility_status != INELIGIBLE (ERR_CARRIER_STILL_INELIGIBLE)"
        side_effects:
          - "increments Carrier.version by 1"
          - "credentials SUSPENDED with status_reason SAFETY_INELIGIBLE stay SUSPENDED (manual per-credential reactivation required)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/carriers/{carrierId}/transition {to_status: SUSPENDED}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increments Carrier.version by 1"
          - "manual suspension does NOT cascade to credentials or subscriptions (safety deactivation flows through the posture machine instead)"
      - from: ENROLLED
        to: TERMINATED
        trigger: "POST /api/carriers/{carrierId}/transition {to_status: TERMINATED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "every non-DEACTIVATED BypassCredential -> DEACTIVATED (status_reason CARRIER_TERMINATED)"
          - "every VehicleSubscription in {SCHEDULED, ACTIVE, PAUSED} -> CLOSED (closed_reason TERMINATED_CARRIER; service_end_date := today if later than today)"
          - "every EligibilityOverride in {REQUESTED, APPROVED, ACTIVE} -> REVOKED"
          - "increments Carrier.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/carriers/{carrierId}/transition {to_status: TERMINATED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "same cascade as ENROLLED -> TERMINATED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/carriers/{carrierId}/transition {to_status: TERMINATED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "same cascade as ENROLLED -> TERMINATED"
    note: "ACTIVE<->SUSPENDED is a manual ComplianceOfficer loop (unlimited cycles); TERMINATED is PlatformAdmin-only and terminal. PlatformAdmin requesting to_status ACTIVE or ComplianceOfficer requesting TERMINATED -> ERR_FORBIDDEN_ROLE. Safety-driven deactivation does NOT touch this machine — it flows through the eligibility_status posture machine onto credentials/subscriptions."

  - entity: Carrier
    initial_state: NOT_EVALUATED
    terminal_states: []
    field: eligibility_status
    note: "Derived posture machine (parallel dimension on Carrier, orthogonal to lifecycle status). All transitions are system-computed by carrier_eligibility_posture; no direct API."
    transitions:
      - from: NOT_EVALUATED
        to: ELIGIBLE
        trigger: "system (first SafetyScoreSnapshot posted: rating SATISFACTORY and iss_score < 50)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOT_EVALUATED
        to: CONDITIONAL
        trigger: "system (first snapshot: rating CONDITIONAL, or rating SATISFACTORY with 50 <= iss_score < 75)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOT_EVALUATED
        to: INELIGIBLE
        trigger: "system (first snapshot: rating UNSATISFACTORY or iss_score >= 75)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ELIGIBLE
        to: CONDITIONAL
        trigger: "system (new latest snapshot degrades into CONDITIONAL band and no in-force override)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONDITIONAL
        to: ELIGIBLE
        trigger: "system (new latest snapshot improves, or an EligibilityOverride becomes in-force — ACTIVE with start_date <= today < end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONDITIONAL
        to: INELIGIBLE
        trigger: "system (new latest snapshot: UNSATISFACTORY or iss_score >= 75; or override leaves force — EXPIRED / REVOKED / STALE — while latest snapshot is in INELIGIBLE band)"
        actor: system
        preconditions: []
        side_effects:
          - "SAFETY DEACTIVATION CASCADE: every BypassCredential of this carrier in ACTIVE -> SUSPENDED (status_reason SAFETY_INELIGIBLE)"
          - "each such credential suspension pauses its vehicle's VehicleSubscription: status ACTIVE -> PAUSED, paused_at := today"
          - "increments Carrier.version by 1"
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "system (new latest snapshot in INELIGIBLE band and no in-force override; or override leaves force while snapshot is INELIGIBLE)"
        actor: system
        preconditions: []
        side_effects:
          - "SAFETY DEACTIVATION CASCADE: every BypassCredential of this carrier in ACTIVE -> SUSPENDED (status_reason SAFETY_INELIGIBLE)"
          - "each such credential suspension pauses its vehicle's VehicleSubscription: status ACTIVE -> PAUSED, paused_at := today"
          - "increments Carrier.version by 1"
      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "system (new latest snapshot improves to ELIGIBLE band, or EligibilityOverride becomes in-force)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INELIGIBLE
        to: CONDITIONAL
        trigger: "system (new latest snapshot improves to CONDITIONAL band)"
        actor: system
        preconditions: []
        side_effects: []
    note2: "An in-force EligibilityOverride forces posture ELIGIBLE regardless of snapshot band. Version pinning: decide-APPROVE records approved_against_snapshot_id := carrier.latest_snapshot_id at that instant; when a NEWER snapshot later becomes carrier latest, the override flips ACTIVE -> STALE (terminal) and posture is recomputed from the new snapshot without it — the safety deactivation cascade fires if the recomputed posture is INELIGIBLE. Also note: Carrier.status is NOT auto-changed by posture; a SUSPENDED carrier with recovered posture needs a manual ComplianceOfficer reinstate, and an ACTIVE carrier with INELIGIBLE posture keeps its lifecycle status but all its credentials are SUSPENDED and all its bypass approaches pull in (check 5)."

  - entity: StateProgramConfig
    initial_state: PILOT
    terminal_states: []
    field: participation_status
    transitions:
      - from: PILOT
        to: PARTICIPATING
        trigger: "PATCH /api/state-program-configs/{configId} {participation_status: PARTICIPATING, expected_state_program_config_version}"
        actor: StateProgramManager
        preconditions: ["OCC version match (ERR_STALE_VERSION)"]
        side_effects: ["increments StateProgramConfig.version by 1"]
      - from: PILOT
        to: SUSPENDED
        trigger: "PATCH /api/state-program-configs/{configId} {participation_status: SUSPENDED, ...}"
        actor: StateProgramManager
        preconditions: ["OCC version match"]
        side_effects: ["increments version by 1"]
      - from: PARTICIPATING
        to: SUSPENDED
        trigger: "PATCH /api/state-program-configs/{configId} {participation_status: SUSPENDED, ...}"
        actor: StateProgramManager
        preconditions: ["OCC version match"]
        side_effects: ["increments version by 1"]
      - from: SUSPENDED
        to: PARTICIPATING
        trigger: "PATCH /api/state-program-configs/{configId} {participation_status: PARTICIPATING, ...}"
        actor: StateProgramManager
        preconditions: ["OCC version match"]
        side_effects: ["increments version by 1"]
    note: "SUSPENDED -> PILOT and PARTICIPATING -> PILOT are forbidden (ERR_INVALID_STATE_TRANSITION). Ruleset field patches (thresholds/rates/flags) are allowed from any participation_status and always bump version; BypassEvent.ruleset_version pins the version used."

  - entity: Station
    initial_state: OPERATIONAL
    terminal_states: [CLOSED_PERM]
    field: operational_status
    transitions:
      - from: OPERATIONAL
        to: CLOSED_TEMP
        trigger: "PATCH /api/stations/{stationId} {operational_status: CLOSED_TEMP}"
        actor: StateProgramManager
        preconditions: []
        side_effects: []
      - from: CLOSED_TEMP
        to: OPERATIONAL
        trigger: "PATCH /api/stations/{stationId} {operational_status: OPERATIONAL}"
        actor: StateProgramManager
        preconditions: []
        side_effects: []
      - from: OPERATIONAL
        to: CLOSED_PERM
        trigger: "PATCH /api/stations/{stationId} {operational_status: CLOSED_PERM}"
        actor: StateProgramManager
        preconditions: []
        side_effects: []
      - from: CLOSED_TEMP
        to: CLOSED_PERM
        trigger: "PATCH /api/stations/{stationId} {operational_status: CLOSED_PERM}"
        actor: StateProgramManager
        preconditions: []
        side_effects: []

  - entity: Vehicle
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    field: service_status
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "PATCH /api/vehicles/{vehicleId} {service_status: OUT_OF_SERVICE}"
        actor: CarrierManager
        preconditions: ["acting CarrierManager owns vehicle.carrier_id (ERR_CARRIER_OWNERSHIP_MISMATCH)"]
        side_effects: []
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "PATCH /api/vehicles/{vehicleId} {service_status: IN_SERVICE}"
        actor: CarrierManager
        preconditions: ["ownership"]
        side_effects: []
      - from: IN_SERVICE
        to: RETIRED
        trigger: "PATCH /api/vehicles/{vehicleId} {service_status: RETIRED}"
        actor: CarrierManager
        preconditions: ["ownership"]
        side_effects:
          - "vehicle's non-DEACTIVATED BypassCredentials -> DEACTIVATED (status_reason VEHICLE_RETIRED)"
          - "vehicle's VehicleSubscriptions in {SCHEDULED, ACTIVE, PAUSED} -> CLOSED (closed_reason VEHICLE_RETIRED; service_end_date := today if later)"
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "PATCH /api/vehicles/{vehicleId} {service_status: RETIRED}"
        actor: CarrierManager
        preconditions: ["ownership"]
        side_effects: ["same cascade as IN_SERVICE -> RETIRED"]

  - entity: BypassCredential
    initial_state: PROVISIONED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /api/bypass-credentials/{credentialId}/transition {to_status: ACTIVE}"
        actor: CarrierManager
        preconditions:
          - "ownership (ERR_CARRIER_OWNERSHIP_MISMATCH)"
          - "Carrier.status == ACTIVE (ERR_CARRIER_NOT_ACTIVE)"
          - "Carrier.eligibility_status IN {ELIGIBLE, CONDITIONAL} (ERR_CARRIER_NOT_BYPASS_ELIGIBLE)"
          - "Vehicle.service_status == IN_SERVICE (ERR_VEHICLE_NOT_IN_SERVICE)"
          - "a VehicleSubscription for this vehicle with status IN {ACTIVE, PAUSED}, window covering today exists (ERR_NO_ACTIVE_SUBSCRIPTION); if carrier has any PAST_DUE invoice or the covering subscription's payment_standing == PAST_DUE: ERR_CARRIER_PAST_DUE"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/bypass-credentials/{credentialId}/transition {to_status: SUSPENDED} (status_reason MANUAL) OR system (carrier posture INELIGIBLE cascade, status_reason SAFETY_INELIGIBLE)"
        actor: CarrierManager | system
        preconditions: ["ownership for manual"]
        side_effects:
          - "vehicle's VehicleSubscription in ACTIVE -> PAUSED (paused_at := today) — billing follows service"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/bypass-credentials/{credentialId}/transition {to_status: ACTIVE}"
        actor: CarrierManager
        preconditions:
          - "same gate set as PROVISIONED -> ACTIVE (carrier ACTIVE, posture ELIGIBLE/CONDITIONAL, vehicle IN_SERVICE, covering ACTIVE/CURRENT subscription)"
        side_effects:
          - "vehicle's VehicleSubscription in PAUSED -> ACTIVE; paused_days_current_period += (today - paused_at); paused_at := null"
      - from: PROVISIONED
        to: DEACTIVATED
        trigger: "POST /api/bypass-credentials/{credentialId}/transition {to_status: DEACTIVATED} (MANUAL) OR system cascades (VEHICLE_RETIRED, CARRIER_TERMINATED)"
        actor: CarrierManager | system
        preconditions: ["ownership for manual"]
        side_effects: []
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST .../transition {to_status: DEACTIVATED} (MANUAL) OR system cascades"
        actor: CarrierManager | system
        preconditions: ["ownership for manual"]
        side_effects:
          - "if transitioned manually or by cascade while subscription ACTIVE: subscription -> PAUSED only for SAFETY_INELIGIBLE; MANUAL deactivation leaves subscription ACTIVE (carrier keeps paying until cancel)"
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST .../transition {to_status: DEACTIVATED} (MANUAL) OR system cascades"
        actor: CarrierManager | system
        preconditions: ["ownership for manual"]
        side_effects: []
    note: "Reactivate loop ACTIVE->SUSPENDED->ACTIVE is unlimited; each cycle accrues paused days on the subscription."

  - entity: VehicleSubscription
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    note: "PARALLEL dimensions: status (lifecycle) x payment_standing (CURRENT | PAST_DUE) evolve independently on one row."
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (materialization sweep: logical clock set to >= service_start_date via POST /api/_clock/set_current_utc, or carrier billing close)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "system (credential suspension cascade — service stop)"
        actor: system
        preconditions: []
        side_effects: ["paused_at := today"]
      - from: PAUSED
        to: ACTIVE
        trigger: "system (credential reactivation)"
        actor: system
        preconditions: []
        side_effects: ["paused_days_current_period += (today - paused_at); paused_at := null"]
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /api/vehicle-subscriptions/{subscriptionId}/cancel OR system (CARRIER_TERMINATED / VEHICLE_RETIRED / EXPIRED when end_date passed before start)"
        actor: CarrierManager | system
        preconditions: ["ownership for cancel"]
        side_effects: ["closed_reason set; service_end_date := today if later than today"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/vehicle-subscriptions/{subscriptionId}/cancel OR system (CARRIER_TERMINATED / VEHICLE_RETIRED / EXPIRED via clock sweep when today > service_end_date)"
        actor: CarrierManager | system
        preconditions: ["ownership for cancel"]
        side_effects:
          - "closed_reason set (CANCELLED for manual)"
          - "if PAUSED at close time, paused_days_current_period += (today - paused_at) before closing"
      - from: PAUSED
        to: CLOSED
        trigger: "POST .../cancel OR system cascades/expiry"
        actor: CarrierManager | system
        preconditions: ["ownership for cancel"]
        side_effects: ["paused_days_current_period += (today - paused_at); paused_at := null; closed_reason set"]
    payment_standing_transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system (past-due sweep at clock-set or billing close: any carrier invoice ISSUED with due_date < today flips to PAST_DUE)"
        actor: system
        preconditions: []
        side_effects: ["blocks new subscriptions (ERR_CARRIER_PAST_DUE) and credential activation/reactivation on the covering subscription"]
      - from: PAST_DUE
        to: CURRENT
        trigger: "system (no PAST_DUE invoices remain for carrier — via record-payment or credit auto-apply)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EligibilityOverride
    initial_state: REQUESTED
    terminal_states: [REJECTED, REVOKED, EXPIRED, STALE]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/eligibility-overrides/{overrideId}/decide {outcome: APPROVE}"
        actor: ComplianceOfficer
        preconditions:
          - "carrier.latest_snapshot_id is non-null (ERR_NO_SAFETY_SNAPSHOT)"
          - "window does not overlap another REQUESTED/APPROVED/ACTIVE override of the same carrier under half-open [start_date, end_date) semantics (ERR_OVERRIDE_WINDOW_OVERLAP)"
        side_effects:
          - "approved_against_snapshot_id := carrier.latest_snapshot_id (version pin)"
          - "decided_by := X-User-ID"
          - "if start_date <= today: immediately becomes ACTIVE and posture recomputes (override in force)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/eligibility-overrides/{overrideId}/decide {outcome: REJECT}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["decided_by := X-User-ID"]
      - from: APPROVED
        to: ACTIVE
        trigger: "system (clock sweep: today >= start_date)"
        actor: system
        preconditions: []
        side_effects: ["posture recompute: override in force => ELIGIBLE (may lift INELIGIBLE; carrier stays SUSPENDED until manual reinstate)"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /api/eligibility-overrides/{overrideId}/decide {outcome: REVOKE} OR system (carrier terminated)"
        actor: ComplianceOfficer | system
        preconditions: []
        side_effects: ["posture recompute if it had been forced ELIGIBLE... (APPROVED-not-yet-active never forced posture; no-op)"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/eligibility-overrides/{overrideId}/decide {outcome: REVOKE} OR system (carrier terminated)"
        actor: ComplianceOfficer | system
        preconditions: []
        side_effects: ["posture recompute without override; if result INELIGIBLE and carrier ACTIVE -> SUSPENDED cascade"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep: today >= end_date)"
        actor: system
        preconditions: []
        side_effects: ["posture recompute without override; possible INELIGIBLE -> carrier SUSPENDED cascade"]
      - from: ACTIVE
        to: STALE
        trigger: "system (a SafetyScoreSnapshot newer than approved_against_snapshot_id becomes carrier latest)"
        actor: system
        preconditions: []
        side_effects: ["posture recompute from new snapshot without override; possible INELIGIBLE -> carrier SUSPENDED cascade"]

  - entity: BypassDispute
    initial_state: OPENED
    terminal_states: [OVERTURNED, UPHELD_FINAL]
    transitions:
      - from: OPENED
        to: UPHELD
        trigger: "POST /api/bypass-disputes/{disputeId}/adjudicate {outcome: UPHELD}"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["first_reviewer_id := X-User-ID; adjudicated_at := now"]
      - from: OPENED
        to: OVERTURNED
        trigger: "POST /api/bypass-disputes/{disputeId}/adjudicate {outcome: OVERTURNED, credit_amount_cents?}"
        actor: ComplianceOfficer
        preconditions: ["credit_amount_cents, if present, IN 1..100000 and <= claimed_credit_cents (ERR_CREDIT_AMOUNT_OUT_OF_RANGE)"]
        side_effects:
          - "first_reviewer_id := X-User-ID; granted_credit_cents := credit_amount_cents or claimed_credit_cents"
          - "append Carrier.credit_ledger entry {amount_cents: +granted_credit_cents, reason: DISPUTE_OVERTURN_CREDIT, reference_id: dispute id}"
          - "Carrier.credit_balance_cents recomputed (= ledger sum); increments Carrier.version by 1 (once per adjudication regardless of how many ledger entries the sweep appends)"
          - "credit auto-apply sweep: iterate carrier's unpaid invoices (status IN {ISSUED, PAST_DUE}) ordered by issued_at ASC then created_at ASC; while credit_balance_cents >= invoice.amount_due_cents: append ledger entry {-amount_due_cents, INVOICE_CREDIT_APPLICATION, reference_id: invoice id}, invoice -> PAID, recompute balance"
          - "after sweep, if no PAST_DUE invoices remain: carrier's subscriptions payment_standing PAST_DUE -> CURRENT"
      - from: UPHELD
        to: APPEALED
        trigger: "POST /api/bypass-disputes/{disputeId}/appeal"
        actor: CarrierManager
        preconditions: ["ownership"]
        side_effects: []
      - from: APPEALED
        to: UPHELD_FINAL
        trigger: "POST /api/bypass-disputes/{disputeId}/adjudicate {outcome: UPHELD}"
        actor: ComplianceOfficer
        preconditions: ["X-User-ID != first_reviewer_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["appeal_reviewer_id := X-User-ID"]
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /api/bypass-disputes/{disputeId}/adjudicate {outcome: OVERTURNED, credit_amount_cents?}"
        actor: ComplianceOfficer
        preconditions: ["X-User-ID != first_reviewer_id (ERR_SEGREGATION_OF_DUTIES)", "credit bounds"]
        side_effects: ["appeal_reviewer_id := X-User-ID", "same credit ledger + auto-apply cascade as OPENED -> OVERTURNED"]

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{invoiceId}/record-payment {amount_cents} (must equal amount_due_cents: ERR_PAYMENT_AMOUNT_MISMATCH) OR system (credit auto-apply full coverage; also at close time when amount_due_cents == 0 because credit covered gross in full)"
        actor: FinanceAdmin | system
        preconditions: []
        side_effects: ["if no PAST_DUE invoices remain for carrier: subscriptions payment_standing -> CURRENT"]
      - from: ISSUED
        to: PAST_DUE
        trigger: "system (past-due sweep at clock-set or carrier billing close: due_date < today)"
        actor: system
        preconditions: []
        side_effects: ["carrier's VehicleSubscriptions in {SCHEDULED, ACTIVE, PAUSED}: payment_standing CURRENT -> PAST_DUE"]
      - from: PAST_DUE
        to: PAID
        trigger: "POST /api/invoices/{invoiceId}/record-payment {amount_cents} OR system (credit auto-apply)"
        actor: FinanceAdmin | system
        preconditions: []
        side_effects: ["if no PAST_DUE invoices remain: subscriptions payment_standing -> CURRENT"]
    note: "record-payment on PAID invoice: ERR_INVOICE_NOT_PAYABLE. Partial or mismatched amounts: ERR_PAYMENT_AMOUNT_MISMATCH."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; each passes the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: snapshot-post-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /api/safety-score-snapshots"
    occ_field: expected_carrier_version
    description: |
      Posting a SafetyScoreSnapshot against a Carrier whose version has advanced
      since the client last observed it is rejected. Feed submissions are ordered
      by the OCC token so a writer operating on a stale carrier view (e.g., one
      taken before another snapshot restructured eligibility) cannot silently
      reorder the score history.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: override-request-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /api/eligibility-overrides"
    occ_field: expected_carrier_version
    description: |
      Creating an EligibilityOverride against a Carrier whose version has advanced
      since the client last observed it is rejected; the requester must re-read the
      carrier (and thereby re-confirm the posture it is appealing) before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: config-patch-stale-config
    parent_entity: StateProgramConfig
    write_endpoint: "PATCH /api/state-program-configs/{configId}"
    occ_field: expected_state_program_config_version
    description: |
      Patching a StateProgramConfig whose version has advanced since the client
      last observed it is rejected, so two rule edits cannot silently interleave;
      the loser re-reads the config and re-applies on the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: carrier_eligibility_posture
    trigger: "SafetyScoreSnapshot created; EligibilityOverride decided APPROVE / entering force (clock sweep) / leaving force (EXPIRED, REVOKED, STALE)"
    algorithm: threshold
    formula: |
      Inputs: carrier.latest snapshot S (max effective_date; tie -> latest created_at),
              override O = carrier's EligibilityOverride with status == ACTIVE and start_date <= today < end_date.
      1. If O exists: posture := ELIGIBLE.
      2. Else if S is null: posture := NOT_EVALUATED.
      3. Else if S.safety_rating == UNSATISFACTORY or S.iss_score >= ISS_INELIGIBLE_FLOOR (75): posture := INELIGIBLE.
      4. Else if S.safety_rating == CONDITIONAL or S.iss_score >= ISS_CONDITIONAL_FLOOR (50): posture := CONDITIONAL.
      5. Else: posture := ELIGIBLE.
      On transition INTO INELIGIBLE: if carrier.status == ACTIVE -> SUSPENDED cascade (see Carrier machine).
      Boundaries are inclusive-lower: iss 75.0 => INELIGIBLE; iss 74 => CONDITIONAL; iss 50 => CONDITIONAL; iss 49 => ELIGIBLE.
    input_set: "latest SafetyScoreSnapshot per carrier; EligibilityOverride rows of that carrier with status == ACTIVE"
    constants:
      ISS_CONDITIONAL_FLOOR: 50
      ISS_INELIGIBLE_FLOOR: 75
    precision: "integer scores; exact >= comparisons"

  - name: bypass_decision_evaluation
    trigger: "POST /api/bypass-events (per approach)"
    algorithm: threshold
    formula: |
      Evaluate checks in PINNED order; first failing check => PULL_IN with that single reason code; else BYPASS_GRANTED with empty reasons.
        1. station.operational_status != OPERATIONAL -> STATION_NOT_OPERATIONAL
        2. station.station_type == MOBILE_PATROL -> STATION_TYPE_NO_BYPASS
        3. config.participation_status == SUSPENDED -> STATE_NOT_PARTICIPATING
        4. carrier.status != ACTIVE -> CARRIER_NOT_ACTIVE
        5. carrier.eligibility_status IN {INELIGIBLE, NOT_EVALUATED} -> CARRIER_INELIGIBLE
        6. carrier.latest_iss_score >= config.iss_refusal_threshold -> ISS_ABOVE_STATE_THRESHOLD
        7. vehicle.service_status != IN_SERVICE -> VEHICLE_OUT_OF_SERVICE
        8. no BypassCredential of vehicle with status == ACTIVE -> NO_ACTIVE_CREDENTIAL
        9. credential selector: candidates = ACTIVE credentials of the vehicle; if station.supported_channel != BOTH, drop candidates whose device_type != supported_channel; if emptied -> CHANNEL_UNSUPPORTED. Selection: in PILOT configs MOBILE_APP is preferred, otherwise TRANSPONDER is preferred; final tie-break created_at ASC (never id). If config.participation_status == PILOT and the selected credential is not MOBILE_APP -> PILOT_APP_ONLY
       10. hazmat_load == true and config.hazmat_bypass_allowed == false -> HAZMAT_NOT_PERMITTED
       11. weight enforcement: if measured_weight_lbs is non-null and measured_weight_lbs > vehicle.gvwr_lbs + floor(vehicle.gvwr_lbs * WIM_TOLERANCE_BPS / 10000) -> OVERWEIGHT (enforced whenever a reading exists, regardless of requires_weight_clearance);
           else if config.requires_weight_clearance == true and measured_weight_lbs is null -> WEIGHT_NOT_CLEARED
       12. config.credential_sets_required not subset of credentials_presented -> CREDENTIALS_INCOMPLETE
       13. deterministic_random_screen fires -> RANDOM_SCREEN
       14. bypass_rate_cap_check fails -> RATE_CAP_EXCEEDED
      Record ruleset_version := config.version; cap_granted_before / cap_total_before := pre-decision counters;
      weight_verified := (measured_weight_lbs non-null and measured_weight_lbs <= limit); credentials_complete := required subset present.
      Counters for the (carrier, state, month(approach_at)) bucket and the (station, day(approach_at)) screen ordinal
      are incremented AFTER the decision, exactly once per created event.
    input_set: "the created event's vehicle, station, station.state_program_config, vehicle.carrier; prior BypassEvents in the (carrier,state,month) and (station,day) buckets"
    constants:
      WIM_TOLERANCE_BPS: 500
    precision: "integer lbs and bps; strict > for overweight (exactly at limit clears)"

  - name: deterministic_random_screen
    trigger: "check 13 of bypass_decision_evaluation"
    algorithm: chronological
    formula: |
      If config.random_pull_in_rate_bps == 0: screen never fires.
      Else N := floor(10000 / random_pull_in_rate_bps); ordinal := 1 + count of prior BypassEvents
      for the same station with day(approach_at) == day(this.approach_at);
      screen fires iff ordinal % N == 0; screen_index := ordinal when fired.
      (bps 5000 -> N=2: every 2nd approach; bps 500 -> N=20: every 20th.)
    input_set: "prior BypassEvents of the same station with same calendar day of approach_at, in creation order"
    constants: {}
    precision: "integer ordinal; modulo equality"

  - name: bypass_rate_cap_check
    trigger: "check 14 of bypass_decision_evaluation"
    algorithm: threshold
    formula: |
      g := cap_granted_before (prior BYPASS_GRANTED for (carrier, state, month(approach_at)));
      t := cap_total_before (prior events in same bucket);
      cap := config.bypass_rate_cap_bps; if carrier.eligibility_status == CONDITIONAL: cap := floor(cap / 2).
      Grant is allowed iff (g + 1) * 10000 <= cap * (t + 1)   [integer arithmetic; equality ALLOWS the bypass].
      EVALUATION ORDER IS PINNED: counters are read before the decision, the decision is computed, and only then
      are g/t incremented — the check is self-referential on post-decision counters expressed via pre-decision values.
    input_set: "prior BypassEvents of same carrier at stations of same config with month(approach_at) equal"
    constants: {}
    precision: "pure integer comparison; no floats"

  - name: subscription_period_invoice
    trigger: "POST /api/carriers/{carrierId}/close-billing-period"
    algorithm: tiered_pricing
    formula: |
      Let period P = [first, last] of (period_year, period_month), D = days in month, today = logical clock date.
      Reject if P not fully elapsed (last >= today: ERR_BILLING_PERIOD_NOT_CLOSABLE) or already in carrier.closed_billing_periods (ERR_BILLING_PERIOD_ALREADY_CLOSED).
      LINES: for each VehicleSubscription of carrier whose window [service_start_date, min(service_end_date, today)] intersects P
      (any status except one CLOSED with closed_reason EXPIRED before P — i.e., window disjoint):
        overlap := [max(start, first), min(end, last)]; overlap_days := max(0, min - max + 1)  [inclusive]
        paused := paused_days_current_period + (status == PAUSED ? (last - paused_at + 1) : 0), intersected with overlap
        billable_days := overlap_days - paused
        surcharge_cents := 200 if a StateProgramConfig exists for vehicle.home_state_code and its participation_status == PILOT at close time, else 0
      TIER: billed_line_count = number of lines with overlap_days > 0; tier by count: 1-10 -> TIER_1 rate 1799; 11-50 -> TIER_2 rate 1599; 51+ -> TIER_3 rate 1399.
      AVERAGE-RATE application: the single tier rate applies to EVERY line (not marginal).
      ROUNDING ORDER (pinned): line_net_cents := round_half_up((tier_rate_cents + surcharge_cents) * billable_days / D) per line; gross_cents := SUM(line_net_cents).
      credit_applied_cents := min(carrier.credit_balance_cents, gross_cents); append ledger {-credit_applied_cents, INVOICE_CREDIT_APPLICATION} if > 0;
      amount_due_cents := gross_cents - credit_applied_cents; due_date := date(first day of next month) + 14 days.
      Then: reset paused counters on all carrier subscriptions (paused_days_current_period := 0; if PAUSED, paused_at stays);
      append 'YYYY-MM' to closed_billing_periods; run past-due sweep for this carrier; increment Carrier.version by 1.
      Lines with billable_days == 0 are included with line_net_cents 0 only if overlap_days > 0; zero-billable lines still count toward billed_line_count.
    input_set: "all VehicleSubscriptions of carrier whose effective window intersects period P"
    constants:
      TIER_1_RATE_CENTS: 1799
      TIER_2_RATE_CENTS: 1599
      TIER_3_RATE_CENTS: 1399
      TIER_1_MAX_LINES: 10
      TIER_2_MAX_LINES: 50
      PILOT_SURCHARGE_CENTS: 200
      NET_TERMS_DAYS: 14
    precision: "round_half_up per line, then integer sum; the 11th line lowers the rate for ALL lines"
    variants:
      - name: final_at_close
        when: "POST close-billing-period (persisted)"
        difference: "chronological actual days only; billable_days reflect realized pause intervals"
      - name: provisional_preview
        when: "GET /api/carriers/{id}/invoice-preview (not persisted)"
        difference: "forward-looking: ACTIVE subscriptions project billing through period end (billable_to_date + remaining window days); PAUSED project zero further billable days; SCHEDULED with start inside P project (last - start + 1) days; tier from projected line count"

  - name: provisional_invoice_projection
    trigger: "GET /api/carriers/{carrierId}/invoice-preview?period_year&period_month (defaults: current period)"
    algorithm: forward_looking
    formula: |
      Same line/tier/rounding rules as subscription_period_invoice, but billable days are PROJECTED:
        ACTIVE: billable := days from max(start, first) through min(end, last) minus paused days to date (assumes active through period end).
        PAUSED: billable := overlap days up to paused_at only (assumes paused through period end).
        SCHEDULED with service_start_date inside P: billable := (min(end, last) - start + 1) (assumes on-time activation).
      Preview never mutates state and never applies credit (credit_applied_cents reported as the min that WOULD apply given current balance).
      For identical data mid-period, preview (projection) and close (actual) differ whenever pause/activation events occur after preview day.
    input_set: "same set as subscription_period_invoice, evaluated as of today"
    constants:
      TIER_1_RATE_CENTS: 1799
      TIER_2_RATE_CENTS: 1599
      TIER_3_RATE_CENTS: 1399
      PILOT_SURCHARGE_CENTS: 200
    precision: "round_half_up per line, then sum"

  - name: roi_report
    trigger: "GET /api/carriers/{carrierId}/roi-report?period_year&period_month&variant"
    algorithm: aggregation
    formula: |
      Events bucketed by month(approach_at) == (period_year, period_month), carrier match:
        total_approaches, bypasses_granted, pull_ins (partition: total == granted + pulled),
        verified_bypasses := BYPASS_GRANTED events with weight_verified == true AND credentials_complete == true.
      bypass_rate_bps := total == 0 ? 0 : floor(granted * 10000 / total).
      variant STANDARD: counted_bypasses := bypasses_granted.
      variant CONSERVATIVE: counted_bypasses := verified_bypasses.
      estimated_savings_cents := counted_bypasses * AVOIDED_COST_PER_BYPASS_CENTS.
      subscription_fees_cents := gross_cents of the carrier's Invoice for the period; 0 if none.
      roi_bps := subscription_fees_cents == 0 ? null : round_half_up((estimated_savings_cents - subscription_fees_cents) * 10000 / subscription_fees_cents).
      inspections_recorded := InspectionReports of carrier with month(inspected_at) == period.
      inspection_reduction_bps := total_approaches == 0 ? 0 : floor(bypasses_granted * 10000 / total_approaches)  [equals bypass_rate_bps; bypasses are avoided inspections].
    input_set: "BypassEvents + InspectionReports of carrier within month(approach_at/inspected_at); Invoice of period"
    constants:
      AVOIDED_COST_PER_BYPASS_CENTS: 1275
    precision: "integer bps, floor for rates, round_half_up for roi_bps; null roi when fees == 0"
    variants:
      - name: standard
        when: "variant=STANDARD (default)"
        difference: "counts every BYPASS_GRANTED as an avoided inspection"
      - name: conservative
        when: "variant=CONSERVATIVE"
        difference: "counts only BYPASS_GRANTED events that are weight_verified AND credentials_complete; identical data yields lower-or-equal savings whenever any granted bypass was unverified"

  - name: credit_balance_reconciliation
    trigger: "every append to Carrier.credit_ledger (dispute overturn grant; invoice close application; dispute auto-apply sweep)"
    algorithm: aggregation
    formula: |
      credit_balance_cents := SUM(entry.amount_cents) over all credit_ledger entries (signed).
      Ledger is append-only; balance is recomputed (never incrementally adjusted) after every append.
      INVARIANT: at every observable instant, credit_balance_cents == SUM(credit_ledger.amount_cents).
    input_set: "carrier.credit_ledger entries"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is in the endpoint's role list (for /api/carriers/{id}/transition: ACTIVE requires ComplianceOfficer, TERMINATED requires PlatformAdmin)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Entity-backed ownership: CarrierManager's X-User-ID must equal the carrier_id of every resource in scope (path or body). For body-carrier_id endpoints the comparison is direct; for path-id endpoints (vehicles, credentials, subscriptions, disputes) ownership resolves through the target resource — if that resource does not exist, ownership is unresolvable and the existence check (priority 4) produces the 404."
    error_id: ERR_CARRIER_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /api/vehicles; PATCH /api/vehicles/{id}; POST /api/bypass-credentials; POST /api/bypass-credentials/{id}/transition; POST /api/vehicle-subscriptions; POST /api/vehicle-subscriptions/{id}/cancel; POST /api/bypass-disputes; POST /api/bypass-disputes/{id}/appeal; POST /api/eligibility-overrides"
  - priority: 4
    category: existence
    check: "Path and body referenced resources exist, validated left-to-right (carrier, config, station, vehicle, credential, event, dispute, override, subscription, invoice)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_CARRIER_NOT_FOUND, ERR_STATE_PROGRAM_CONFIG_NOT_FOUND, ERR_STATION_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_CREDENTIAL_NOT_FOUND, ERR_BYPASS_EVENT_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_OVERRIDE_NOT_FOUND, ERR_SUBSCRIPTION_NOT_FOUND, ERR_INVOICE_NOT_FOUND)"
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target resource is in a valid from-state for the requested transition (per-machine transition lists; includes terminal lockdown and same-state no-op rejection)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all transition endpoints: /api/carriers/{id}/transition, PATCH config/station/vehicle, /api/bypass-credentials/{id}/transition, /api/vehicle-subscriptions/{id}/cancel, dispute adjudicate/appeal, override decide, invoice record-payment"
  - priority: 6
    category: state
    check: "OCC: expected_*_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/safety-score-snapshots; POST /api/eligibility-overrides; PATCH /api/state-program-configs/{id}"
  - priority: 7
    category: business_safety
    check: "Carrier approve-enrollment requires eligibility_status IN {ELIGIBLE, CONDITIONAL} (NOT_EVALUATED or INELIGIBLE rejected)"
    error_id: ERR_CARRIER_INELIGIBLE_FOR_APPROVAL
    http_status: 422
    applies_to: "POST /api/carriers/{id}/transition {to_status: ACTIVE} from ENROLLED"
  - priority: 8
    category: business_safety
    check: "Carrier reinstate requires eligibility_status != INELIGIBLE"
    error_id: ERR_CARRIER_STILL_INELIGIBLE
    http_status: 422
    applies_to: "POST /api/carriers/{id}/transition {to_status: ACTIVE} from SUSPENDED"
  - priority: 9
    category: business_safety
    check: "Carrier lifecycle allows child writes: carrier must be ACTIVE to create vehicles, credentials, subscriptions, disputes; override requests are allowed for ENROLLED/ACTIVE/SUSPENDED carriers and rejected only for TERMINATED"
    error_id: ERR_CARRIER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/vehicles; POST /api/bypass-credentials; POST /api/vehicle-subscriptions; POST /api/bypass-disputes; POST /api/bypass-credentials/{id}/transition; POST /api/eligibility-overrides (TERMINATED only)"
  - priority: 10
    category: business_safety
    check: "Credential activation/reactivation requires carrier eligibility_status IN {ELIGIBLE, CONDITIONAL}"
    error_id: ERR_CARRIER_NOT_BYPASS_ELIGIBLE
    http_status: 422
    applies_to: "POST /api/bypass-credentials/{id}/transition {to_status: ACTIVE}"
  - priority: 11
    category: business_safety
    check: "Credential activation/reactivation requires vehicle.service_status == IN_SERVICE"
    error_id: ERR_VEHICLE_NOT_IN_SERVICE
    http_status: 409
    applies_to: "POST /api/bypass-credentials/{id}/transition {to_status: ACTIVE}"
  - priority: 12
    category: business_referential
    check: "Override request and APPROVE require carrier.latest_snapshot_id non-null"
    error_id: ERR_NO_SAFETY_SNAPSHOT
    http_status: 422
    applies_to: "POST /api/eligibility-overrides; POST /api/eligibility-overrides/{id}/decide {outcome: APPROVE}"
  - priority: 13
    category: business_temporal
    check: "Date-range sanity: override end_date > start_date; subscription service_start_date >= today and service_start_date <= service_end_date; snapshot effective_date <= today; bypass event approach_at <= now (ERR_FUTURE_APPROACH) and >= now - 48h (ERR_STALE_APPROACH); inspection inspected_at <= now (ERR_FUTURE_INSPECTION); billing period fully elapsed (ERR_BILLING_PERIOD_NOT_CLOSABLE)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /api/eligibility-overrides; POST /api/vehicle-subscriptions; POST /api/safety-score-snapshots; POST /api/bypass-events; POST /api/inspection-reports; POST /api/carriers/{id}/close-billing-period"
  - priority: 14
    category: business_temporal
    check: "Override window overlap per carrier, HALF-OPEN [start_date, end_date): new window overlapping any REQUESTED/APPROVED/ACTIVE override rejected; adjacency (start == existing end) allowed"
    error_id: ERR_OVERRIDE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/eligibility-overrides"
  - priority: 15
    category: business_temporal
    check: "Subscription window overlap per vehicle, CLOSED [start, end] inclusive: new window overlapping any non-CLOSED subscription of the same vehicle rejected; adjacency (start == existing end) IS a conflict"
    error_id: ERR_SUBSCRIPTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/vehicle-subscriptions"
  - priority: 16
    category: business_temporal
    check: "Dispute target checks, in order: (i) event decision must be PULL_IN (ERR_EVENT_NOT_DISPUTABLE, 422) — a BYPASS_GRANTED event has nothing to dispute; (ii) dispute must be opened within DISPUTE_WINDOW_DAYS (30) of the event's approach_at, i.e. (today - date(approach_at)) <= 30 (ERR_DISPUTE_WINDOW_EXPIRED, 422)"
    error_id: ERR_EVENT_NOT_DISPUTABLE
    http_status: 422
    applies_to: "POST /api/bypass-disputes"
  - priority: 17
    category: business_constraint
    check: "Range/format checks: iss_score 0..100 (ERR_INVALID_ISS_SCORE); claimed_credit_cents and adjudicate credit_amount_cents in 1..100000 and amount <= claimed (ERR_CREDIT_AMOUNT_OUT_OF_RANGE); enum members valid; required fields present; gvwr_lbs > 0; period_month 1..12"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 18
    category: business_constraint
    check: "Uniqueness: dot_number, vin, device_serial, state_code, station_code, (vehicle_id, station_id, approach_at) for events, one open dispute per event, one non-terminal credential per (vehicle, device_type), billing period not already closed"
    error_id: "ERR_DUPLICATE_DOT_NUMBER | ERR_DUPLICATE_VIN | ERR_DUPLICATE_DEVICE_SERIAL | ERR_DUPLICATE_STATE_CONFIG | ERR_DUPLICATE_STATION_CODE | ERR_DUPLICATE_BYPASS_EVENT | ERR_DISPUTE_ALREADY_OPEN | ERR_CREDENTIAL_TYPE_ALREADY_ACTIVE | ERR_BILLING_PERIOD_ALREADY_CLOSED"
    http_status: 409
    applies_to: "creation endpoints and close-billing-period"
  - priority: 19
    category: business_constraint
    check: "Segregation of duties: appeal adjudication requires X-User-ID != first_reviewer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/bypass-disputes/{id}/adjudicate from APPEALED"
  - priority: 20
    category: business_fiscal
    check: "Credential activation/reactivation requires a covering subscription (status IN {ACTIVE, PAUSED}, window covers today); PAUSED covering subscription auto-resumes on successful activation"
    error_id: ERR_NO_ACTIVE_SUBSCRIPTION
    http_status: 402
    applies_to: "POST /api/bypass-credentials/{id}/transition {to_status: ACTIVE}"
  - priority: 21
    category: business_fiscal
    check: "Carrier with any PAST_DUE invoice is blocked from new subscriptions and credential (re)activation (standing gate)"
    error_id: ERR_CARRIER_PAST_DUE
    http_status: 402
    applies_to: "POST /api/vehicle-subscriptions; POST /api/bypass-credentials/{id}/transition {to_status: ACTIVE}"
  - priority: 22
    category: business_fiscal
    check: "record-payment amount must equal amount_due_cents exactly (no partial/overpayment); invoice must be ISSUED or PAST_DUE"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 400
    applies_to: "POST /api/invoices/{id}/record-payment"
  - priority: 23
    category: business_fiscal
    check: "record-payment on an already-PAID invoice"
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /api/invoices/{id}/record-payment"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; declared per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock. STARTUP DEFAULT (mandatory): before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Setting the clock runs the materialization sweep: (1) EligibilityOverride APPROVED->ACTIVE when today >= start_date, ACTIVE->EXPIRED when today >= end_date (with posture recompute + possible safety cascade); (2) VehicleSubscription SCHEDULED->ACTIVE when today >= service_start_date, and ACTIVE/PAUSED/SCHEDULED->CLOSED (EXPIRED) when today > service_end_date; (3) Invoice ISSUED->PAST_DUE when due_date < today (with payment_standing propagation to the carrier's subscriptions)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, overrides_activated: integer, overrides_expired: integer, subscriptions_activated: integer, subscriptions_expired: integer, invoices_marked_past_due: integer }"
    side_effects: ["materialization sweep as described"]

  # --- Carrier ---
  - method: POST
    path: "/api/carriers"
    description: "Onboard a carrier (status ENROLLED, eligibility_status NOT_EVALUATED)"
    roles: [PlatformAdmin]
    code: 201
    input: [dot_number, legal_name]
    output: Carrier
    side_effects: ["status ENROLLED; eligibility_status NOT_EVALUATED; credit_balance_cents 0; credit_ledger []; closed_billing_periods []"]
  - method: GET
    path: "/api/carriers/{carrierId}"
    description: "Get one carrier incl. posture, credit_balance_cents, credit_ledger, closed_billing_periods, version"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/api/carriers/{carrierId}/transition"
    description: "Lifecycle transition: ACTIVE (approve from ENROLLED / reinstate from SUSPENDED, ComplianceOfficer), SUSPENDED (manual suspend from ACTIVE, ComplianceOfficer), TERMINATED (PlatformAdmin, from any non-terminal)"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: [to_status]
    output: Carrier
    side_effects: ["Carrier state machine transitions incl. terminate cascade to credentials/subscriptions/overrides; increments Carrier.version by 1"]
  - method: POST
    path: "/api/carriers/{carrierId}/close-billing-period"
    description: "Close a fully-elapsed calendar month for this carrier: compute final invoice (subscription_period_invoice), apply credit, issue Invoice (ISSUED), run past-due sweep, reset pause counters"
    roles: [FinanceAdmin]
    code: 201
    input: [period_year, period_month]
    output: Invoice
    side_effects: ["Invoice created ISSUED with computed lines/gross/credit_applied/amount_due/due_date (amount_due_cents == 0 -> immediately PAID); ledger entry for credit application; 'YYYY-MM' appended to closed_billing_periods; subscriptions paused_days_current_period reset; past-due sweep; increments Carrier.version by 1"]
  - method: GET
    path: "/api/carriers/{carrierId}/invoice-preview"
    description: "Provisional (forward-looking) invoice projection for a period (defaults to current period); never persists"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["period_year?", "period_month?"]
    output: "{ lines: array, billed_line_count: integer, tier_applied: string, gross_cents: integer, credit_applied_cents: integer, amount_due_cents: integer, period_year: integer, period_month: integer }"
    side_effects: []
  - method: GET
    path: "/api/carriers/{carrierId}/roi-report"
    description: "Inspection-reduction & ROI report for a period; variant STANDARD (default) or CONSERVATIVE"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: [period_year, period_month, "variant?"]
    output: "{ period_year: integer, period_month: integer, variant: string, total_approaches: integer, bypasses_granted: integer, pull_ins: integer, verified_bypasses: integer, bypass_rate_bps: integer, estimated_savings_cents: integer, subscription_fees_cents: integer, roi_bps: integer, inspections_recorded: integer, inspection_reduction_bps: integer }"
    side_effects: []

  # --- StateProgramConfig & Station ---
  - method: POST
    path: "/api/state-program-configs"
    description: "Create a per-state rules config (participation_status PILOT initially)"
    roles: [StateProgramManager]
    code: 201
    input: [state_code, "iss_refusal_threshold?", "random_pull_in_rate_bps?", "bypass_rate_cap_bps?", "hazmat_bypass_allowed?", "requires_weight_clearance?", "credential_sets_required?"]
    output: StateProgramConfig
    side_effects: ["participation_status := PILOT"]
  - method: PATCH
    path: "/api/state-program-configs/{configId}"
    description: "Patch rules fields and/or participation_status (OCC: expected_state_program_config_version required; bumps version; BypassEvents pin ruleset_version so patches are never retroactive)"
    roles: [StateProgramManager]
    code: 200
    input: [expected_state_program_config_version, "iss_refusal_threshold?", "random_pull_in_rate_bps?", "bypass_rate_cap_bps?", "hazmat_bypass_allowed?", "requires_weight_clearance?", "credential_sets_required?", "participation_status?"]
    output: StateProgramConfig
    side_effects: ["increments StateProgramConfig.version by 1"]
  - method: POST
    path: "/api/stations"
    description: "Register a weigh station under a state config"
    roles: [StateProgramManager]
    code: 201
    input: [state_program_config_id, station_code, station_type, supported_channel]
    output: Station
    side_effects: ["operational_status := OPERATIONAL"]
  - method: GET
    path: "/api/stations"
    description: "List stations; filters state_program_config_id, operational_status"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["state_program_config_id?", "operational_status?", "limit?", "offset?"]
    output: "Station[]"
    side_effects: []
  - method: PATCH
    path: "/api/stations/{stationId}"
    description: "Transition station operational_status (OPERATIONAL<->CLOSED_TEMP, ->CLOSED_PERM)"
    roles: [StateProgramManager]
    code: 200
    input: [operational_status]
    output: Station
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/api/vehicles"
    description: "Register a vehicle for a carrier (carrier must be ACTIVE)"
    roles: [CarrierManager]
    code: 201
    input: [carrier_id, vin, plate_number, plate_state, home_state_code, gvwr_lbs, "hazmat_endorsed?"]
    output: Vehicle
    side_effects: ["service_status := IN_SERVICE"]
  - method: GET
    path: "/api/vehicles"
    description: "List vehicles; filters carrier_id, service_status"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "service_status?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []
  - method: PATCH
    path: "/api/vehicles/{vehicleId}"
    description: "Transition service_status (IN_SERVICE<->OUT_OF_SERVICE, ->RETIRED with credential/subscription cascade)"
    roles: [CarrierManager]
    code: 200
    input: [service_status]
    output: Vehicle
    side_effects: ["RETIRED cascades: credentials -> DEACTIVATED (VEHICLE_RETIRED); subscriptions -> CLOSED (VEHICLE_RETIRED)"]

  # --- BypassCredential ---
  - method: POST
    path: "/api/bypass-credentials"
    description: "Provision a transponder/app credential for a vehicle (carrier must be ACTIVE; one non-terminal credential per vehicle+device_type)"
    roles: [CarrierManager]
    code: 201
    input: [vehicle_id, device_type, device_serial]
    output: BypassCredential
    side_effects: ["status := PROVISIONED; carrier_id denormalized from vehicle"]
  - method: GET
    path: "/api/bypass-credentials"
    description: "List credentials; filters carrier_id, vehicle_id, status"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: "BypassCredential[]"
    side_effects: []
  - method: POST
    path: "/api/bypass-credentials/{credentialId}/transition"
    description: "Credential lifecycle: to_status ACTIVE (gates: carrier ACTIVE, posture ELIGIBLE/CONDITIONAL, vehicle IN_SERVICE, covering subscription with status IN {ACTIVE, PAUSED} and payment_standing CURRENT — PAUSED covering subscription auto-resumes), SUSPENDED (manual), DEACTIVATED (terminal)"
    roles: [CarrierManager]
    code: 200
    input: [to_status]
    output: BypassCredential
    side_effects: ["SUSPENDED (any cause) pauses the vehicle's ACTIVE subscription; reactivation (SUSPENDED->ACTIVE) resumes it and accrues paused days"]

  # --- SafetyScoreSnapshot ---
  - method: POST
    path: "/api/safety-score-snapshots"
    description: "Post a safety-score feed snapshot (OCC on Carrier.version); recomputes posture and fires safety deactivation cascade on INELIGIBLE; flips in-force overrides pinning an older snapshot to STALE"
    roles: [SafetyDataFeed]
    code: 201
    input: [carrier_id, iss_score, safety_rating, source, effective_date, expected_carrier_version]
    output: SafetyScoreSnapshot
    side_effects: ["carrier latest_* fields updated; carrier_eligibility_posture recomputed; on entry to INELIGIBLE: credentials ACTIVE->SUSPENDED (SAFETY_INELIGIBLE), their subscriptions ACTIVE->PAUSED; ACTIVE EligibilityOverride whose approved_against_snapshot_id is no longer latest -> STALE; increments Carrier.version by 1"]
  - method: GET
    path: "/api/safety-score-snapshots"
    description: "List snapshots; filter carrier_id"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "limit?", "offset?"]
    output: "SafetyScoreSnapshot[]"
    side_effects: []

  # --- BypassEvent ---
  - method: POST
    path: "/api/bypass-events"
    description: "Record a roadside approach; runs bypass_decision_evaluation and persists the immutable decision + reason + ruleset_version + counter snapshots (audit trail)"
    roles: [TelematicsGateway]
    code: 201
    input: [vehicle_id, station_id, approach_at, "measured_weight_lbs?", "credentials_presented?", "hazmat_load?"]
    output: BypassEvent
    side_effects: ["(carrier, state, month) cap counters and (station, day) screen ordinal increment exactly once, after decision"]
  - method: GET
    path: "/api/bypass-events"
    description: "List events; filters carrier_id, vehicle_id, station_id, decision"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "vehicle_id?", "station_id?", "decision?", "limit?", "offset?"]
    output: "BypassEvent[]"
    side_effects: []

  # --- BypassDispute ---
  - method: POST
    path: "/api/bypass-disputes"
    description: "Open a dispute on a PULL_IN event (within 30 days of approach_at; one open dispute per event)"
    roles: [CarrierManager]
    code: 201
    input: [bypass_event_id, reason, claimed_credit_cents]
    output: BypassDispute
    side_effects: ["status := OPENED; carrier_id denormalized from event"]
  - method: GET
    path: "/api/bypass-disputes"
    description: "List disputes; filters carrier_id, bypass_event_id, status"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "bypass_event_id?", "status?", "limit?", "offset?"]
    output: "BypassDispute[]"
    side_effects: []
  - method: POST
    path: "/api/bypass-disputes/{disputeId}/adjudicate"
    description: "Officer decision from OPENED or APPEALED: outcome UPHELD or OVERTURNED (optional credit_amount_cents <= claimed). Appeal review requires a different officer (SoD). OVERTURNED grants credit and runs auto-apply sweep."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "credit_amount_cents?"]
    output: BypassDispute
    side_effects: ["on OVERTURNED: ledger +credit entry, credit_balance recompute, invoice auto-apply sweep (oldest unpaid first), payment_standing recovery"]
  - method: POST
    path: "/api/bypass-disputes/{disputeId}/appeal"
    description: "Appeal an UPHELD dispute (carrier); moves to APPEALED for second review"
    roles: [CarrierManager]
    code: 200
    input: []
    output: BypassDispute
    side_effects: []

  # --- EligibilityOverride ---
  - method: POST
    path: "/api/eligibility-overrides"
    description: "Request a temporary eligibility waiver (OCC on Carrier.version); carrier must not be TERMINATED (ERR_CARRIER_NOT_ACTIVE); carrier must have at least one SafetyScoreSnapshot (ERR_NO_SAFETY_SNAPSHOT); half-open window [start_date, end_date); overlap with REQUESTED/APPROVED/ACTIVE override of same carrier rejected"
    roles: [CarrierManager]
    code: 201
    input: [carrier_id, reason, start_date, end_date, expected_carrier_version]
    output: EligibilityOverride
    side_effects: ["status := REQUESTED; increments Carrier.version by 1"]
  - method: GET
    path: "/api/eligibility-overrides"
    description: "List overrides; filters carrier_id, status"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "status?", "approved_against_snapshot_id?", "limit?", "offset?"]
    output: "EligibilityOverride[]"
    side_effects: []
  - method: POST
    path: "/api/eligibility-overrides/{overrideId}/decide"
    description: "Officer decision: APPROVE or REJECT from REQUESTED; REVOKE from APPROVED or ACTIVE. APPROVE pins approved_against_snapshot_id := carrier.latest_snapshot_id."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: EligibilityOverride
    side_effects: ["APPROVE with start_date <= today: immediately ACTIVE + posture recompute; REVOKE/EXPIRE of in-force override: posture recompute + possible safety cascade"]

  # --- VehicleSubscription ---
  - method: POST
    path: "/api/vehicle-subscriptions"
    description: "Subscribe a vehicle (closed-interval window; overlap with non-CLOSED subscription of same vehicle rejected; carrier must be ACTIVE and not PAST_DUE)"
    roles: [CarrierManager]
    code: 201
    input: [carrier_id, vehicle_id, service_start_date, service_end_date]
    output: VehicleSubscription
    side_effects: ["status := ACTIVE if start_date <= today else SCHEDULED; payment_standing := CURRENT"]
  - method: GET
    path: "/api/vehicle-subscriptions"
    description: "List subscriptions; filters carrier_id, vehicle_id, status, payment_standing"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "vehicle_id?", "status?", "payment_standing?", "limit?", "offset?"]
    output: "VehicleSubscription[]"
    side_effects: []
  - method: POST
    path: "/api/vehicle-subscriptions/{subscriptionId}/cancel"
    description: "Cancel immediately: CLOSED (CANCELLED), service_end_date := today if later"
    roles: [CarrierManager]
    code: 200
    input: []
    output: VehicleSubscription
    side_effects: ["if PAUSED: accrue open pause interval into paused_days_current_period before close"]

  # --- Invoice ---
  - method: GET
    path: "/api/invoices"
    description: "List invoices; filters carrier_id, status"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/api/invoices/{invoiceId}/record-payment"
    description: "Record full payment (amount must equal amount_due_cents exactly); ISSUED/PAST_DUE -> PAID"
    roles: [FinanceAdmin]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["if no PAST_DUE invoices remain for carrier: subscriptions payment_standing PAST_DUE -> CURRENT"]

  # --- InspectionReport ---
  - method: POST
    path: "/api/inspection-reports"
    description: "Post an actual roadside inspection record (feed); feeds ROI reporting"
    roles: [SafetyDataFeed]
    code: 201
    input: [carrier_id, vehicle_id, inspection_level, inspected_at, violations_found, "out_of_service_order?"]
    output: InspectionReport
    side_effects: []
  - method: GET
    path: "/api/inspection-reports"
    description: "List inspection reports; filters carrier_id, vehicle_id"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: ["carrier_id?", "vehicle_id?", "limit?", "offset?"]
    output: "InspectionReport[]"
    side_effects: []

  # --- Single-resource GETs (read-back + entity collection anchors) ---
  - method: GET
    path: "/api/state-program-configs/{configId}"
    description: "Get one state config (incl. current version for OCC)"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: StateProgramConfig
    side_effects: []
  - method: GET
    path: "/api/stations/{stationId}"
    description: "Get one station"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: GET
    path: "/api/vehicles/{vehicleId}"
    description: "Get one vehicle"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/api/bypass-credentials/{credentialId}"
    description: "Get one credential"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: BypassCredential
    side_effects: []
  - method: GET
    path: "/api/vehicle-subscriptions/{subscriptionId}"
    description: "Get one subscription (incl. pause counters)"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: VehicleSubscription
    side_effects: []
  - method: GET
    path: "/api/safety-score-snapshots/{snapshotId}"
    description: "Get one snapshot"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: SafetyScoreSnapshot
    side_effects: []
  - method: GET
    path: "/api/bypass-events/{eventId}"
    description: "Get one bypass event (immutable record)"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: BypassEvent
    side_effects: []
  - method: GET
    path: "/api/bypass-disputes/{disputeId}"
    description: "Get one dispute"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: BypassDispute
    side_effects: []
  - method: GET
    path: "/api/eligibility-overrides/{overrideId}"
    description: "Get one override"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
    output: EligibilityOverride
    side_effects: []
  - method: GET
    path: "/api/invoices/{invoiceId}"
    description: "Get one invoice with lines"
    roles: [PlatformAdmin, StateProgramManager, ComplianceOfficer, CarrierManager, SafetyDataFeed, TelematicsGateway, FinanceAdmin]
    code: 200
    input: []
