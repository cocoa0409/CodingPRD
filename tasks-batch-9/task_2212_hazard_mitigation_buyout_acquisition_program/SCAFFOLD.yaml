roles:
  - role: ProgramAdministrator
    identity: opaque
    description: |
      The grant program administrator (state or federal). Holds every approval, funding and
      reversal authority. X-User-ID is an opaque administrator identifier that the SoD-2 bar on
      project approval and the ledger reversal audit trail read.
    exclusive_operations:
      - "POST /mitigation-projects"
      - "POST /mitigation-projects/{project_id}/return"
      - "POST /mitigation-projects/{project_id}/approve"
      - "POST /mitigation-projects/{project_id}/closeout"
      - "POST /benefit-cost-analyses/{bca_id}/validate"
      - "POST /purchase-offers/{offer_id}/expire"
      - "POST /relocation-cases/{case_id}/resolve-claim"
      - "POST /closing-records/{closing_id}/fund"
      - "POST /demolition-contractors"
      - "POST /demolition-contractors/{contractor_id}/status"
      - "POST /deed-restrictions/{restriction_id}/terminate"
      - "POST /dob-records/{dob_record_id}/reverse"
      - "POST /program-income-entries/{entry_id}/reverse"
    shared_operations:
      - "every GET endpoint"
    sod_bars:
      - "SoD-2: may not approve a project whose benefit-cost analysis this same X-User-ID validated"

  - role: SubrecipientCoordinator
    identity: "entity_backed:MitigationProject"
    description: |
      The local government subrecipient's buyout coordinator. X-User-ID MUST equal the id of the
      MitigationProject this coordinator administers; a coordinator acting on any entity that
      resolves to a different project id (Parcel.project_id, Appraisal -> Parcel.project_id,
      PurchaseOffer -> Parcel.project_id, ClosingRecord -> Parcel.project_id,
      DemolitionWorkOrder -> Parcel.project_id, UtilityDisconnection -> work order -> Parcel.project_id,
      DeedRestriction -> Parcel.project_id, ProgramIncomeLedgerEntry.project_id) receives
      ERR_UNAUTHORIZED. This makes the coordinator role project-scoped.
    exclusive_operations:
      - "POST /mitigation-projects/{project_id}/submit"
      - "POST /mitigation-projects/{project_id}/benefit-cost-analyses"
      - "POST /mitigation-projects/{project_id}/parcels"
      - "POST /parcels/{parcel_id}/participation"
      - "POST /parcel-adjacencies"
      - "POST /parcels/{parcel_id}/dob-records"
      - "POST /parcels/{parcel_id}/purchase-offers"
      - "POST /purchase-offers/{offer_id}/present"
      - "POST /purchase-offers/{offer_id}/owner-response"
      - "POST /purchase-offers/{offer_id}/withdraw"
      - "POST /parcels/{parcel_id}/closing-records"
      - "POST /closing-records/{closing_id}/record"
      - "POST /parcels/{parcel_id}/demolition-work-orders"
      - "POST /demolition-work-orders/{work_order_id}/start"
      - "POST /demolition-work-orders/{work_order_id}/complete"
      - "POST /demolition-work-orders/{work_order_id}/utility-disconnections"
      - "POST /utility-disconnections/{disconnection_id}/resolve"
      - "POST /mitigation-projects/{project_id}/program-income-entries"
    shared_operations:
      - "every GET endpoint"

  - role: StaffAppraiser
    identity: opaque
    description: |
      The staff or fee appraiser who determines the pre-event fair market value and authors INITIAL
      appraisals. X-User-ID is recorded on Appraisal.appraiser_user_id and is the subject of the
      SoD-1 bar. Only the author may submit their own appraisal.
    exclusive_operations:
      - "POST /parcels/{parcel_id}/pre-event-value"
      - "POST /parcels/{parcel_id}/appraisals with appraisal_type == INITIAL"
    shared_operations:
      - "POST /appraisals/{appraisal_id}/submit (only for an appraisal this X-User-ID authored)"
      - "GET /mitigation-projects, GET /mitigation-projects/{project_id}, GET /parcels, GET /parcels/{parcel_id}, GET /appraisals, GET /appraisals/{appraisal_id}"

  - role: ReviewAppraiser
    identity: opaque
    description: |
      The review appraiser who authors REVIEW appraisals and renders the review decision that
      establishes the parcel value. Subject to SoD-1 on both legs: may review neither their own
      appraisal nor an appraisal authored by the staff appraiser whose INITIAL appraisal is under
      review.
    exclusive_operations:
      - "POST /parcels/{parcel_id}/appraisals with appraisal_type == REVIEW"
      - "POST /appraisals/{appraisal_id}/review-decision"
    shared_operations:
      - "POST /appraisals/{appraisal_id}/submit (only for an appraisal this X-User-ID authored)"
      - "GET /mitigation-projects, GET /mitigation-projects/{project_id}, GET /parcels, GET /parcels/{parcel_id}, GET /appraisals, GET /appraisals/{appraisal_id}"
    sod_bars:
      - "SoD-1: X-User-ID may equal neither Appraisal.appraiser_user_id nor the reviewed INITIAL Appraisal.appraiser_user_id"

  - role: RelocationSpecialist
    identity: opaque
    description: |
      The relocation specialist responsible for federal relocation-law obligations: opening cases,
      determining eligibility, computing replacement housing and rental assistance for owner
      occupants and tenants, submitting claims and lodging appeals. Cannot pay a claim - only the
      ProgramAdministrator can.
    exclusive_operations:
      - "POST /parcels/{parcel_id}/relocation-cases"
      - "POST /relocation-cases/{case_id}/determine-eligibility"
      - "POST /relocation-cases/{case_id}/submit-claim"
      - "POST /relocation-cases/{case_id}/appeal"
    shared_operations:
      - "GET /mitigation-projects, GET /mitigation-projects/{project_id}, GET /parcels, GET /parcels/{parcel_id}, GET /purchase-offers, GET /purchase-offers/{offer_id}, GET /relocation-cases, GET /relocation-cases/{case_id}"

  - role: ComplianceMonitor
    identity: opaque
    description: |
      The long-term monitoring compliance officer. Inspects perpetual open-space parcels, reports
      prohibited uses, records cures and fails demolition clearance inspections. X-User-ID is
      recorded on MonitoringInspection.inspector_user_id and copied to
      DeedRestriction.violation_reported_by_user_id, which is the subject of the SoD-3 bar.
    exclusive_operations:
      - "POST /deed-restrictions/{restriction_id}/monitoring-inspections"
      - "POST /deed-restrictions/{restriction_id}/cure"
      - "POST /demolition-work-orders/{work_order_id}/fail-inspection"
    shared_operations:
      - "every GET endpoint"
    sod_bars:
      - "SoD-3: may not record the cure of a violation this same X-User-ID reported"
