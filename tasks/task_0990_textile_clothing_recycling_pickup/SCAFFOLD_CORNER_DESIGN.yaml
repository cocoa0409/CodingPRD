  # ===========================================================================
  - section: rbac
    instances:
      - name: sensor_gateway_cannot_create_pickup
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "SensorGateway's exclusive scope is fill readings: POST /pickup-requests as SensorGateway -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Zone Z; resident R"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone RB1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Yus Y", email: "yus@x.com", address: "52 Fir St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests"
              payload: {}
              as: SensorGateway
              captures: { err: $.data.error_id }
          assert:
            - "403 with ${id} == ERR_UNAUTHORIZED"

      - name: sponsor_manager_cannot_topup_other_fund
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_UNAUTHORIZED]", entities.SponsorFund]
        distinguishing_aspect: "SponsorManager identity is the fund id: manager of F1 (zone Z1) topping up F2 (zone Z2) -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Zones Z1, Z2 each with a fund: F1 and F2"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone RB2a" }
              as: ZoneOperator
              captures: { z1: $.data.id }
            - call: "POST /service-zones"
              payload: { name: "Zone RB2b" }
              as: ZoneOperator
              captures: { z2: $.data.id }
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 10000 }
              as: ZoneOperator
              captures: { f1: $.data.id }
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "GreenThread", initial_cents: 20000 }
              as: ZoneOperator
              captures: { f2: $.data.id }
          trigger:
            - call: "POST /sponsor-funds/${id}/topups"
              payload: { amount_cents: 1000 }
              as: SponsorManager
              as_user_id: "${id}"
              captures: { err: $.data.error_id }
          assert:
            - "403 with ${id} == ERR_UNAUTHORIZED; F2 funded_total_cents stays 20000"

      - name: driver_cannot_collect_unassigned_pickup
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=2]", entities.PickupRequest.fields.driver_id]
        distinguishing_aspect: "Pickup is ROUTED to drv-1; drv-2's mark-collected -> 403 ERR_UNAUTHORIZED (assigned-driver binding), before any state check."
        test_recipe:
