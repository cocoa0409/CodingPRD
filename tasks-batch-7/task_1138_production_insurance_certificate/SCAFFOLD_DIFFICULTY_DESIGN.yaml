      - name: certificate_window_upper_exclusive_boundary
        grounds:
          - calculations.certificate_coverage_window_validate
          - validations[priority=15]
        distinguishing_aspect: |
          Empty/zero-quantity edge: location_end == policy.expiry_date is
          NOT allowed (half-open policy window excludes its upper bound),
          while location_end == principal_photography_end + 30 days IS
          allowed. Different metric (datetime boundary vs numeric threshold),
          different endpoint.
        test_recipe:
          setup:
            - "Production ACTIVE with GL policy BOUND, expiry_date=2026-12-31T00:00:00Z"
          setup_api_calls:
