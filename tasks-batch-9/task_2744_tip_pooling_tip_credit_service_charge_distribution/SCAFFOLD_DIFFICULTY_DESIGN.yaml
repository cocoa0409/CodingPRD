              as: PayrollPreparer
              captures: { shift_a_id: $.data.id }
            - call: "POST /shifts/${shift_a_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_a_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-05T00:00:00Z", start_at: "2026-08-05T16:00:00Z", end_at: "2026-08-06T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_b_id: $.data.id }
