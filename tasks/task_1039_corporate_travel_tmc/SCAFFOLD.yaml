  # --- Invoice ---
  - method: POST
    path: "/tmc/invoices"
    description: "Create a vendor Invoice with lines (RECEIVED)"
    roles: [FinanceOfficer]
    code: 201
    input: [vendor_id, billing_period, invoiced_total_cents, lines]
    output: Invoice
    side_effects: ["status=RECEIVED; InvoiceLine rows created from lines[]"]

  - method: GET
    path: "/tmc/invoices/{id}"
    description: "Get an Invoice"
    roles: [TravelManager, FinanceOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/tmc/invoices"
    description: "List Invoices (reverse-reachability for Invoice.vendor_id)"
    roles: [TravelManager, FinanceOfficer]
    code: 200
    input: ["vendor_id?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/tmc/invoices/{id}/reconcile"
    description: "Reconcile an invoice; RECEIVED -> RECONCILED (variance 0) or DISPUTED"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["compute reconciled_total_cents/variance_cents and per-line match (calc invoice_reconciliation)"]

  - method: POST
    path: "/tmc/invoices/{id}/resolve-dispute"
    description: "Resolve a DISPUTED invoice by supplying a corrected billed total"
    roles: [FinanceOfficer]
    code: 200
    input: [adjusted_invoiced_total_cents]
    output: Invoice
    side_effects: ["invoiced_total_cents := adjusted_invoiced_total_cents; variance recomputed; status -> RECONCILED if variance 0"]

  - method: POST
    path: "/tmc/invoices/{id}/pay"
    description: "Mark a RECONCILED invoice PAID"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> PAID"]

  # --- InvoiceLine ---
  - method: GET
    path: "/tmc/invoice-lines/{id}"
    description: "Get an InvoiceLine"
    roles: [TravelManager, FinanceOfficer]
    code: 200
    input: []
    output: InvoiceLine
    side_effects: []

  - method: GET
    path: "/tmc/invoice-lines"
    description: "List InvoiceLines (reverse-reachability for InvoiceLine.invoice_id / booking_id)"
    roles: [TravelManager, FinanceOfficer]
    code: 200
    input: ["invoice_id?", "booking_id?", "match_status?"]
    output: "InvoiceLine[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, non-positive amount/count, block_size < 1" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that allows this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_trip_request_version does not match the TripRequest's current version" }
  - { id: ERR_SELF_APPROVAL, http: 403, condition: "Approver is the trip's own traveler (segregation of duties)" }
  - { id: ERR_TRAVELER_SUSPENDED, http: 409, condition: "Owning traveler is SUSPENDED for submit or booking" }
  - { id: ERR_ADVANCE_PURCHASE_VIOLATION, http: 409, condition: "Booking departure is fewer than policy.advance_purchase_days whole days after now" }
  - { id: ERR_TRAVELER_DOUBLE_BOOKED, http: 409, condition: "Traveler already has a TICKETED booking overlapping the segment interval" }
  - { id: ERR_RATE_UNAVAILABLE, http: 409, condition: "NegotiatedRate not ACTIVE / outside validity window, or Vendor INACTIVE" }
  - { id: ERR_CREDIT_UNAVAILABLE, http: 409, condition: "Redeemed credit is expired/redeemed/void, not owned by traveler, or wrong vendor" }
  - { id: ERR_POLICY_VIOLATION, http: 409, condition: "HOTEL booking fare_cents exceeds policy.max_hotel_nightly_cents" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping group blocks + new block_size exceed vendor.capacity" }
  - { id: ERR_APPROVAL_REQUIRED, http: 409, condition: "Booking attempted on a trip that is not APPROVED/BOOKED" }
  - { id: ERR_APPROVAL_RANK_TOO_LOW, http: 409, condition: "Approver grade insufficient to clear the PENDING_EXEC step" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TravelManager
    description: "Travel program admin: configures policies, vendors, negotiated rates, group blocks; suspends/reactivates travelers; runs sweeps."
    identity: opaque
    exclusive_operations:
      - "POST /tmc/travel-policies"
      - "POST /tmc/travelers"
      - "POST /tmc/travelers/{id}/suspend"
      - "POST /tmc/travelers/{id}/reactivate"
      - "POST /tmc/vendors"
      - "POST /tmc/vendors/{id}/deactivate"
      - "POST /tmc/negotiated-rates"
      - "POST /tmc/group-bookings"
      - "POST /tmc/group-bookings/{id}/confirm"
      - "POST /tmc/group-bookings/{id}/release"
      - "POST /tmc/group-bookings/{id}/cancel"
      - "POST /tmc/maintenance/run-sweep"
    shared_operations:
      - "POST /_clock/set_current_utc (with FinanceOfficer, System)"
      - "POST /tmc/trip-requests/{id}/cancel (with Traveler)"
      - "GET reads across the /tmc namespace"

  - name: Traveler
    description: "An employee who owns TripRequests and Bookings. Acts only on their own resources (X-User-ID == Traveler.id)."
    identity: "entity_backed:Traveler"
    exclusive_operations:
      - "POST /tmc/trip-requests"
      - "POST /tmc/trip-requests/{id}/submit"
      - "POST /tmc/bookings"
      - "POST /tmc/bookings/{id}/exchange"
      - "POST /tmc/bookings/{id}/cancel"
    shared_operations:
      - "POST /tmc/trip-requests/{id}/cancel (with TravelManager)"
      - "GET reads across the /tmc namespace"

  - name: Approver
    description: "A Traveler of MANAGER/EXECUTIVE/VIP grade acting as an approver. May not approve/reject their own trip (segregation of duties)."
    identity: "entity_backed:Traveler"
    exclusive_operations:
      - "POST /tmc/trip-requests/{id}/approve"
      - "POST /tmc/trip-requests/{id}/reject"
    shared_operations:
      - "GET reads across the /tmc namespace"

  - name: FinanceOfficer
    description: "Handles vendor invoicing and reconciliation. Purely operational (opaque id)."
    identity: opaque
    exclusive_operations:
      - "POST /tmc/invoices"
      - "POST /tmc/invoices/{id}/reconcile"
      - "POST /tmc/invoices/{id}/resolve-dispute"
      - "POST /tmc/invoices/{id}/pay"
    shared_operations:
      - "POST /_clock/set_current_utc (with TravelManager, System)"
      - "GET /tmc/vendors/{id}/savings-report (with TravelManager)"
      - "GET reads across the /tmc namespace"

  - name: System
    description: "Automation identity for time-driven sweeps and cascaded transitions."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /tmc/maintenance/run-sweep (with TravelManager)"
