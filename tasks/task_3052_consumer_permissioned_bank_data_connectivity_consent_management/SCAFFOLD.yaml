# =============================================================================
# PRD Benchmark Seed Tables — Consumer-Permissioned Bank Data Connectivity &
# Consent Management (Plaid-style)
# =============================================================================

scenario: |
  Consumer-Permissioned Bank Data Connectivity & Consent Management (Plaid):
  institution connectivity through credential-based and token-based methods with
  migration to bank application programming interfaces, consumer consent capture
  specifying data scopes, recipients and duration with revocation, data product
  tiering across balance, transaction, identity, income and asset reports,
  connection health monitoring with institution-level breakage detection and
  re-authentication prompts, downstream recipient onboarding with use-case
  review and data minimization requirements, refresh cadence and webhook
  delivery for new transactions, data deletion requests propagating to
  recipients, institution agreements governing rate limits and permitted fields

domain_name: bank-data-connectivity-consent
api_prefix: "/"

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: event_sourcing
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution display name", constraints: "non-empty, unique per platform" }
      - { name: supported_methods, type: array, source: input, description: "Enum set of connection methods this institution supports: CREDENTIALS | OAUTH_TOKEN | BANK_API", constraints: "non-empty subset of {CREDENTIALS, OAUTH_TOKEN, BANK_API}" }
      - { name: target_method, type: enum, source: input, description: "Migration target connectivity method: BANK_API | OAUTH_TOKEN", constraints: "must be a member of supported_methods" }
      - { name: migration_window_start, type: datetime, source: input, description: "Start (inclusive) of the institution's API migration window" }
      - { name: migration_window_end, type: datetime, source: input, description: "End (inclusive) of the institution's API migration window", constraints: "must be strictly after migration_window_start" }
      - { name: migration_state, type: enum, source: system, description: "NOT_STARTED | IN_PROGRESS | COMPLETE", default: "NOT_STARTED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEGRADED | BROKEN — derived posture computed from breakage events within the rolling window", default: "ACTIVE" }
      - { name: connectivity_mode, type: enum, source: computed, description: "Credential-era legacy mode vs bank-API mode. LEGACY_MODE while migration_state = NOT_STARTED; HYBRID while IN_PROGRESS; API_ONLY once COMPLETE" }

  - name: InstitutionAgreement
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; owning institution" }
      - { name: rate_limit_per_hour, type: integer, source: input, description: "Maximum RefreshJob executions permitted against this institution per rolling hour", constraints: ">= 1" }
      - { name: permitted_fields_by_scope, type: object, source: input, description: "Map of data scope (BALANCE | TRANSACTIONS | IDENTITY | INCOME | ASSETS) to array of field names the institution permits to be returned", constraints: "each scope key must be a declared DataScope; field arrays non-empty" }
      - { name: active, type: boolean, source: input, description: "Whether this agreement row is the currently governing one for its institution", default: true, constraints: "at most one ACTIVE agreement per institution" }

  - name: Recipient
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Downstream recipient display name", constraints: "non-empty, unique per platform" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | SUSPENDED | REJECTED", default: "PENDING_REVIEW" }
      - { name: declared_use_case, type: string, source: input, description: "Free-text description of the recipient's declared data use case" }
      - { name: minimization_policy, type: enum, source: input, description: "Required data-minimization level for the recipient: STRICT | STANDARD | BROAD", constraints: "STRICT forbids IDENTITY/INCOME/ASSETS scopes; STANDARD permits IDENTITY additionally; BROAD permits all scopes" }

  - name: ConsentRecord
    parent: Recipient
    common_fields: true
    fields:
      - { name: recipient_id, type: string, source: input, description: "FK -> Recipient.id; downstream recipient covered by this consent" }
      - { name: consumer_ref, type: string, source: input, description: "Opaque consumer identifier supplied by the integrating client", constraints: "non-empty; pair (consumer_ref, recipient_id, data_scopes set) unique among non-terminal consents" }
      - { name: data_scopes, type: array, source: input, description: "Set of data scopes consented: subset of {BALANCE, TRANSACTIONS, IDENTITY, INCOME, ASSETS}", constraints: "non-empty" }
      - { name: expires_at, type: datetime, source: input, description: "Consent expiry instant (exclusive); after this the consent is auto-expired by the clock" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | EXPIRED | SUPERSEDED", default: "ACTIVE" }
      - { name: revoked_at, type: datetime, source: system, description: "Timestamp of consumer revocation; null unless status = REVOKED", default: null }

  - name: Connection
    parent: Institution
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; institution this connection links to" }
      - { name: consumer_ref, type: string, source: input, description: "Opaque consumer identifier", constraints: "non-empty" }
      - { name: consent_id, type: string, source: input, description: "FK -> ConsentRecord.id; consent under which this connection operates", constraints: "consent must be ACTIVE at creation and at every refresh/read" }
      - { name: method, type: enum, source: input, description: "Connectivity method used: CREDENTIALS | OAUTH_TOKEN | BANK_API", constraints: "must be in the institution's supported_methods at creation" }
      - { name: status, type: enum, source: system, description: "PENDING_AUTH | ACTIVE | REAUTH_REQUIRED | BROKEN | MIGRATING | DISCONNECTED", default: "PENDING_AUTH" }
      - { name: reauth_not_before, type: datetime, source: system, description: "Cooldown instant before which a reauth attempt is rejected", default: null }
      - { name: reauth_cooldown_seconds, type: integer, source: input, description: "Minimum seconds between a failed reauth and the next allowed reauth attempt", default: 0 }
      - { name: consecutive_failures, type: integer, source: system, description: "Count of consecutive refresh failures on this connection", default: 0 }
      - { name: last_refreshed_at, type: datetime, source: system, description: "Timestamp of the most recent SUCCEEDED refresh; null if never refreshed", default: null }

  - name: DataScopeGrant
    parent: ConsentRecord
    common_fields: false
    fields:
      - { name: consent_id, type: string, source: system, description: "FK -> ConsentRecord.id; consent this grant row belongs to" }
      - { name: scope, type: enum, source: system, description: "One of BALANCE | TRANSACTIONS | IDENTITY | INCOME | ASSETS; materialized per consent scope at consent creation" }

  - name: DataProductTier
    parent: null
    common_fields: true
    fields:
      - { name: tier_name, type: string, source: input, description: "Human label of the product tier", constraints: "unique" }
      - { name: scopes_included, type: array, source: input, description: "Set of data scopes this tier authorizes a recipient to request", constraints: "non-empty subset of {BALANCE, TRANSACTIONS, IDENTITY, INCOME, ASSETS}" }
      - { name: rate_class, type: enum, source: input, description: "Refresh-cost class of the tier: LOW | MEDIUM | HIGH — combined with recipient tiering to price refreshes" }
      - { name: active, type: boolean, source: input, description: "Whether new enrollments may use this tier", default: true }

  - name: RefreshJob
    parent: Connection
    common_fields: true
    fields:
      - { name: connection_id, type: string, source: input, description: "FK -> Connection.id; connection being refreshed" }
      - { name: kind, type: enum, source: input, description: "FULL | INCREMENTAL", default: "FULL" }
      - { name: status, type: enum, source: system, description: "QUEUED | SUCCEEDED | FAILED", default: "QUEUED" }
      - { name: attempt_count, type: integer, source: system, description: "Number of execution attempts (each failure increments)", default: 0 }
      - { name: requested_at, type: datetime, source: system, description: "Clock time when the job was enqueued" }
      - { name: executed_at, type: datetime, source: system, description: "Clock time of the latest execution attempt; null until first attempt", default: null }
      - { name: failure_reason, type: enum, source: system, description: "TRANSIENT | INSTITUTION_DOWN | CREDENTIALS_INVALID | RATE_LIMITED; set on FAILED", default: null }
      - { name: new_transaction_count, type: integer, source: input, description: "For SUCCEEDED jobs with TRANSACTIONS scope: number of new transactions surfaced (drives webhook emission)", default: 0 }

  - name: WebhookEvent
    parent: Connection
    common_fields: false
    fields:
      - { name: connection_id, type: string, source: system, description: "FK -> Connection.id; connection the event belongs to" }
      - { name: recipient_id, type: string, source: system, description: "FK -> Recipient.id; delivery target (from the consent's recipient)" }
      - { name: event_type, type: enum, source: system, description: "TRANSACTIONS_AVAILABLE | REAUTH_REQUIRED | CONSENT_REVOKED | CONSENT_EXPIRED | DATA_DELETED | CONNECTION_MIGRATED | INSTITUTION_BROKEN" }
      - { name: payload, type: object, source: system, description: "Event-specific payload (e.g. new_transaction_count for TRANSACTIONS_AVAILABLE)" }
      - { name: delivery_attempts, type: integer, source: system, description: "Count of delivery attempts", default: 0 }
      - { name: delivered_at, type: datetime, source: system, description: "Clock time of successful delivery; null until delivered", default: null }

  - name: BreakageEvent
    parent: Institution
    common_fields: false
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; institution the breakage counts against" }
      - { name: connection_id, type: string, source: system, description: "FK -> Connection.id; connection whose refresh failure produced this event" }
      - { name: kind, type: enum, source: system, description: "TRANSIENT | INSTITUTION_DOWN | CREDENTIALS_INVALID | RATE_LIMITED" }
      - { name: occurred_at, type: datetime, source: system, description: "Clock time of the failure" }

  - name: DataDeletionRequest
    parent: ConsentRecord
    common_fields: true
    fields:
      - { name: consent_id, type: string, source: input, description: "FK -> ConsentRecord.id; consent whose downstream data must be purged" }
      - { name: status, type: enum, source: system, description: "PENDING | PROPAGATING | ACKED_BY_ALL | COMPLETED", default: "PENDING" }
      - { name: requested_at, type: datetime, source: system, description: "Clock time of consumer deletion request" }
      - { name: completed_at, type: datetime, source: system, description: "Clock time when every recipient acknowledgement arrived; null until then", default: null }
      - { name: acked_recipient_ids, type: array, source: system, description: "Recipient ids that have acknowledged the purge", default: "[]" }

  - name: RecipientTierAssignment
    parent: Recipient
    common_fields: true
    fields:
      - { name: recipient_id, type: string, source: input, description: "FK -> Recipient.id; recipient being enrolled" }
      - { name: tier_id, type: string, source: input, description: "FK -> DataProductTier.id; tier enrolled into", constraints: "tier must be active at enrollment" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED", default: "ACTIVE", constraints: "at most one ACTIVE assignment per recipient" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: actor_role, type: string, source: system, description: "Role that performed the action (from X-User-Role header)" }
      - { name: action, type: string, source: system, description: "Endpoint/action identifier (e.g. consent.revoke, connection.reauth)" }
      - { name: entity_type, type: string, source: system, description: "Entity type acted upon" }
      - { name: entity_id, type: string, source: system, description: "Entity id acted upon" }
      - { name: occurred_at, type: datetime, source: system, description: "Clock time of the action" }
      - { name: detail, type: object, source: system, description: "Structured detail (old/new status, error ids, etc.)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Recipient
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /recipients/{recipientId}/review with decision=APPROVE"
        actor: ComplianceReviewer
        preconditions:
          - "Recipient status == PENDING_REVIEW"
          - "The reviewing ComplianceReviewer's X-User-ID differs from the PlatformAdmin who created the recipient (segregation of duties)"
        side_effects:
          - "AuditLog entry recipient.approve"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /recipients/{recipientId}/review with decision=REJECT"
        actor: ComplianceReviewer
        preconditions:
          - "Recipient status == PENDING_REVIEW"
          - "Reviewer id differs from creator id"
        side_effects:
          - "All of the recipient's ACTIVE ConsentRecords -> REVOKED (with revoked_at = clock)"
          - "For each such consent, all its Connections in {PENDING_AUTH, ACTIVE, REAUTH_REQUIRED, BROKEN, MIGRATING} -> DISCONNECTED"
          - "AuditLog entry recipient.reject"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /recipients/{recipientId}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Recipient status == APPROVED"
        side_effects:
          - "All ACTIVE ConsentRecords of this recipient -> REVOKED (revoked_at = clock)"
          - "Cascade: every consent revocation disconnects that consent's Connections (non-DISCONNECTED -> DISCONNECTED)"
          - "Each consent revocation emits WebhookEvent CONSENT_REVOKED to the recipient"
          - "The recipient's ACTIVE RecipientTierAssignment -> ENDED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /recipients/{recipientId}/review with decision=APPROVE on a SUSPENDED recipient"
        actor: ComplianceReviewer
        preconditions:
          - "Recipient status == SUSPENDED"
          - "Reviewer id differs from the PlatformAdmin who suspended"
        side_effects:
          - "AuditLog entry recipient.reinstate"
      - from: REJECTED
        to: APPROVED
        trigger: "POST /recipients/{recipientId}/review with decision=APPROVE on a REJECTED recipient (appeal)"
        actor: ComplianceReviewer
        preconditions:
          - "Recipient status == REJECTED"
          - "Reviewer id differs from the original reviewer who rejected"
        side_effects: []
      - from: APPROVED
        to: REJECTED
        trigger: "POST /recipients/{recipientId}/review with decision=REJECT on an APPROVED recipient"
        actor: ComplianceReviewer
        preconditions:
          - "Recipient status == APPROVED"
          - "Reviewer id differs from the approving reviewer"
        side_effects:
          - "Same revocation cascade as recipient.suspend (consents REVOKED, connections DISCONNECTED, tier ENDED, CONSENT_REVOKED webhooks)"

  - entity: ConsentRecord
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /consents/{consentId}/revoke"
        actor: Consumer
        preconditions:
          - "Consent status == ACTIVE"
          - "X-User-ID (Consumer) == consent.consumer_ref"
        side_effects:
          - "revoked_at = clock"
          - "Every Connection of this consent in {PENDING_AUTH, ACTIVE, REAUTH_REQUIRED, BROKEN, MIGRATING} -> DISCONNECTED"
          - "Each disconnected connection drops its last_refreshed_at visibility (reads after revoke return 410-style ERR_CONSENT_REVOKED for data endpoints)"
          - "WebhookEvent CONSENT_REVOKED emitted to the consent's recipient per connection"
          - "AuditLog entry consent.revoke"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: evaluated on any access, and eagerly by POST /_clock/set_current_utc sweep, when clock >= expires_at)"
        actor: system
        preconditions:
          - "clock >= expires_at"
        side_effects:
          - "Same cascade as REVOKED: connections DISCONNECTED"
          - "WebhookEvent CONSENT_EXPIRED emitted to recipient per connection"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /recipients/{recipientId}/consents — when a new consent is created for the same (consumer_ref, recipient_id) pair, every prior ACTIVE consent for that pair is superseded"
        actor: system
        preconditions: []
        side_effects:
          - "Superseded consent's connections are re-pointed to the new consent if the new consent's scopes are a superset of the old; otherwise the connections -> DISCONNECTED"
          - "WebhookEvent emitted on re-point (CONNECTION_MIGRATED) or disconnect (CONSENT_REVOKED) accordingly"

  - entity: Connection
    initial_state: PENDING_AUTH
    terminal_states: [DISCONNECTED]
    transitions:
      - from: PENDING_AUTH
        to: ACTIVE
        trigger: "POST /connections/{connectionId}/complete_auth"
        actor: Consumer
        preconditions:
          - "Connection status == PENDING_AUTH"
          - "Consent is ACTIVE and not past expires_at"
          - "Institution migration gate: if method == CREDENTIALS and institution.connectivity_mode == API_ONLY -> reject"
          - "Agreement gate: consent's scopes all present in the ACTIVE InstitutionAgreement.permitted_fields_by_scope keys"
        side_effects:
          - "consecutive_failures = 0"
          - "Initial RefreshJob (kind=FULL) auto-created and executed synchronously; on success status stays ACTIVE, on INSTITUTION_DOWN failure status -> BROKEN"
      - from: ACTIVE
        to: REAUTH_REQUIRED
        trigger: "system (a RefreshJob FAILED with failure_reason == CREDENTIALS_INVALID)"
        actor: system
        preconditions: []
        side_effects:
          - "reauth_not_before = clock + reauth_cooldown_seconds"
          - "WebhookEvent REAUTH_REQUIRED emitted to recipient"
      - from: REAUTH_REQUIRED
        to: ACTIVE
        trigger: "POST /connections/{connectionId}/reauth"
        actor: Consumer
        preconditions:
          - "Connection status == REAUTH_REQUIRED"
          - "Institution status != BROKEN (re-auth is futile during an institution-level outage)"
          - "clock >= reauth_not_before"
          - "Consent ACTIVE"
        side_effects:
          - "consecutive_failures = 0"
          - "reauth_not_before = null"
      - from: ACTIVE
        to: BROKEN
        trigger: "system (a RefreshJob FAILED with failure_reason == INSTITUTION_DOWN and consecutive_failures reaches 2)"
        actor: system
        preconditions: []
        side_effects:
          - "BreakageEvent appended for institution"
          - "Institution.status recomputed (health check) — may degrade the institution posture"
      - from: BROKEN
        to: ACTIVE
        trigger: "POST /connections/{connectionId}/reauth"
        actor: Consumer
        preconditions:
          - "Connection status == BROKEN"
          - "Institution status != BROKEN"
          - "clock >= reauth_not_before (if set)"
          - "Consent ACTIVE"
        side_effects:
          - "consecutive_failures = 0"
      - from: BROKEN
        to: REAUTH_REQUIRED
        trigger: "POST /connections/{connectionId}/reauth with valid=false (failed reauth attempt)"
        actor: Consumer
        preconditions:
          - "Connection status in {BROKEN, REAUTH_REQUIRED}"
        side_effects:
          - "reauth_not_before = clock + reauth_cooldown_seconds"
      - from: ACTIVE
        to: MIGRATING
        trigger: "POST /connections/{connectionId}/migrate"
        actor: Consumer
        preconditions:
          - "Connection status == ACTIVE"
          - "method != institution.target_method"
          - "clock within institution migration window: migration_window_start <= clock <= migration_window_end"
          - "institution.migration_state == IN_PROGRESS"
        side_effects:
          - "method = institution.target_method"
      - from: MIGRATING
        to: ACTIVE
        trigger: "POST /connections/{connectionId}/complete_auth (re-proof under new method)"
        actor: Consumer
        preconditions:
          - "Connection status == MIGRATING"
          - "Consent ACTIVE"
        side_effects:
          - "WebhookEvent CONNECTION_MIGRATED emitted to recipient"
      - from: MIGRATING
        to: REAUTH_REQUIRED
        trigger: "system (migration proof attempt fails)"
        actor: system
        preconditions: []
        side_effects:
          - "reauth_not_before = clock + reauth_cooldown_seconds"
      - from: PENDING_AUTH
        to: DISCONNECTED
        trigger: "consent terminal transition (revoked/expired/superseded-nonsuperset) or recipient suspension/rejection"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DISCONNECTED
        trigger: "consent terminal transition or recipient suspension/rejection"
        actor: system
        preconditions: []
        side_effects: []
      - from: REAUTH_REQUIRED
        to: DISCONNECTED
        trigger: "consent terminal transition or recipient suspension/rejection"
        actor: system
        preconditions: []
        side_effects: []
      - from: BROKEN
        to: DISCONNECTED
        trigger: "consent terminal transition or recipient suspension/rejection"
        actor: system
        preconditions: []
        side_effects: []
      - from: MIGRATING
        to: DISCONNECTED
        trigger: "consent terminal transition or recipient suspension/rejection"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RefreshJob
    initial_state: QUEUED
    terminal_states: [SUCCEEDED, FAILED]
    transitions:
      - from: QUEUED
        to: SUCCEEDED
        trigger: "POST /connections/{connectionId}/refresh (executes synchronously)"
        actor: Consumer
        preconditions:
          - "Connection status in {ACTIVE, MIGRATING}"
          - "Consent ACTIVE and not expired"
          - "Institution status != BROKEN"
          - "Rate limit: count of RefreshJob executions (any status) for this institution within the trailing 3600 seconds < ACTIVE agreement.rate_limit_per_hour"
          - "Refresh cadence: if kind == INCREMENTAL, clock - connection.last_refreshed_at >= 3600 seconds (only if last_refreshed_at is set)"
        side_effects:
          - "executed_at = clock; attempt_count += 1"
          - "connection.last_refreshed_at = clock"
          - "connection.consecutive_failures = 0"
          - "If TRANSACTIONS in consent scopes and new_transaction_count > 0: WebhookEvent TRANSACTIONS_AVAILABLE emitted to recipient with payload.new_transaction_count"
      - from: QUEUED
        to: FAILED
        trigger: "POST /connections/{connectionId}/refresh with failure_reason in payload, or forced by gate outcomes"
        actor: Consumer
        preconditions:
          - "Same reachability gates as the SUCCEEDED path; the outcome is selected by the caller-provided failure_reason (test-driving via the simulated institution)"
        side_effects:
          - "executed_at = clock; attempt_count += 1"
          - "connection.consecutive_failures += 1"
          - "BreakageEvent appended for institution with kind = failure_reason"
          - "If failure_reason == CREDENTIALS_INVALID: connection -> REAUTH_REQUIRED (see Connection machine)"
          - "If failure_reason == INSTITUTION_DOWN and consecutive_failures reaches 2: connection -> BROKEN"
          - "Institution.status recomputed from rolling-window breakage counts"

  - entity: DataDeletionRequest
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: PROPAGATING
        trigger: "POST /consents/{consentId}/deletion_requests creation"
        actor: Consumer
        preconditions:
          - "Consent in {ACTIVE, REVOKED, EXPIRED}"
          - "No other non-COMPLETED DataDeletionRequest for this consent"
        side_effects:
          - "WebhookEvent DATA_DELETED emitted to every recipient that ever held this consent's data (the consent's recipient)"
          - "If the consent is still ACTIVE it is immediately REVOKED (revoked_at = clock) with the full revocation cascade"
      - from: PROPAGATING
        to: ACKED_BY_ALL
        trigger: "POST /deletion_requests/{requestId}/ack — when the last required recipient ack arrives"
        actor: Recipient
        preconditions:
          - "Request status == PROPAGATING"
          - "The acknowledging recipient has not already acked"
        side_effects:
          - "recipient id appended to acked_recipient_ids"
      - from: PROPAGATING
        to: PROPAGATING
        trigger: "POST /deletion_requests/{requestId}/ack — non-final ack (still waiting on others)"
        actor: Recipient
        preconditions:
          - "Request status == PROPAGATING"
        side_effects:
          - "recipient id appended to acked_recipient_ids"
      - from: ACKED_BY_ALL
        to: COMPLETED
        trigger: "system (immediately after last ack; completed_at = clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Consent's DataScopeGrants are logically purged (grant reads return empty sets)"
          - "AuditLog entry deletion.completed"

  - entity: Institution
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DEGRADED
        trigger: "system (rolling-window breakage recomputation: breakage count in trailing 86400s >= 3 and < 5)"
        actor: system
        preconditions: []
        side_effects:
          - "Reads of connection data for this institution still allowed; new PENDING_AUTH connections allowed"
      - from: DEGRADED
        to: BROKEN
        trigger: "system (breakage count in trailing 86400s >= 5)"
        actor: system
        preconditions: []
        side_effects:
          - "All of the institution's connections in {ACTIVE, MIGRATING} -> REAUTH_REQUIRED (institution-level re-auth prompt)"
          - "WebhookEvent INSTITUTION_BROKEN emitted to every affected connection's recipient"
          - "RefreshJobs for this institution are rejected while status == BROKEN"
      - from: BROKEN
        to: ACTIVE
        trigger: "POST /institutions/{institutionId}/recover (operator action after institution fix)"
        actor: PlatformAdmin
        preconditions:
          - "Institution status == BROKEN"
        side_effects:
          - "Breakage window counters reset (past BreakageEvents no longer count)"
          - "Connections moved to REAUTH_REQUIRED by the breakage stay REAUTH_REQUIRED (consumers must re-auth individually)"
      - from: DEGRADED
        to: ACTIVE
        trigger: "system (breakage count in trailing window falls below 3 because old events aged out of the window — evaluated lazily on each recompute and on /_clock/set_current_utc)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: BROKEN
        trigger: "system (single-step jump when breakage count jumps from < 3 to >= 5 in the window, e.g. a burst of failures)"
        actor: system
        preconditions: []
        side_effects:
          - "Same side effects as DEGRADED -> BROKEN"

  - entity: InstitutionMigration (logical; state stored on Institution.migration_state)
    initial_state: NOT_STARTED
    terminal_states: [COMPLETE]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /institutions/{institutionId}/migration/start"
        actor: PlatformAdmin
        preconditions:
          - "migration_state == NOT_STARTED"
          - "clock >= migration_window_start and clock <= migration_window_end"
          - "target_method is a member of supported_methods"
        side_effects:
          - "connectivity_mode recomputed -> HYBRID"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /institutions/{institutionId}/migration/complete"
        actor: PlatformAdmin
        preconditions:
          - "migration_state == IN_PROGRESS"
          - "Every non-DISCONNECTED Connection of the institution has method == target_method"
        side_effects:
          - "connectivity_mode -> API_ONLY"
          - "CREDENTIALS-method connections that remain are force-DISCONNECTED is NOT allowed — completion is blocked instead (see precondition)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: consent-create-stale-recipient
    parent_entity: Recipient
    write_endpoint: "POST /recipients/{recipientId}/consents"
    occ_field: "expected_recipient_version"
    description: |
      Creating a ConsentRecord against a Recipient whose version has advanced
      since the client last observed it is rejected. The recipient's version
      advances on review/suspend cascades, so a consent create built on a stale
      view (e.g. captured before a suspension that revoked all consents) is
      rejected as stale rather than silently binding to a changed recipient.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: agreement-create-stale-institution
    parent_entity: Institution
    write_endpoint: "POST /institutions/{institutionId}/agreements"
    occ_field: "expected_institution_version"
    description: |
      Creating a new InstitutionAgreement against an Institution whose version
      has advanced since the client last observed it is rejected, since the
      create supersedes the previously ACTIVE agreement and must not be built
      on a stale institutional view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: institution_health_status
    trigger: "After every RefreshJob failure (BreakageEvent appended), after institution recover, and lazily on any read of Institution.status (aging out)"
    algorithm: threshold
    formula: |
      window = BreakageEvents where institution_id == I.id
               and occurred_at >= clock - 86400
               and occurred_at > I.last_recovered_at (or all if never recovered)
      n = count(window)
      if n >= 5: status = BROKEN
      elif n >= 3: status = DEGRADED
      else: status = ACTIVE
    constants:
      DEGRADED_THRESHOLD: 3
      BROKEN_THRESHOLD: 5
      WINDOW_SECONDS: 86400
    precision: "integer count; boundary evaluated with >= (exactly 3 is DEGRADED, exactly 5 is BROKEN)"
    variants:
      - name: inclusive_window
        when: "default evaluation"
        difference: "Events exactly 86400 seconds old still count (occurred_at >= clock - 86400)"
      - name: post_recover_reset
        when: "after POST /institutions/{id}/recover"
        difference: "Events at or before last_recovered_at are excluded, so status recomputes to ACTIVE immediately after recovery"

  - name: consent_scope_coverage
    trigger: "On Connection create/complete_auth and on DataProductTier enrollment"
    algorithm: aggregation
    formula: |
      uncovered = [s for s in consent.data_scopes
                   if s not in agreement.permitted_fields_by_scope.keys()]
      if uncovered: reject with ERR_AGREEMENT_SCOPE_NOT_PERMITTED (connection)
      recipient-side: requested = consent.data_scopes
      allowed_by_tier = tier.scopes_included
      forbidden_by_policy = policy_forbidden_scopes(recipient.minimization_policy)
      effective_denied = (requested - allowed_by_tier) | (requested & forbidden_by_policy)
      if effective_denied: reject with ERR_SCOPE_EXCEEDS_TIER or ERR_SCOPE_VIOLATES_MINIMIZATION
    input_set: "Consent.data_scopes vs ACTIVE InstitutionAgreement.permitted_fields_by_scope keys vs RecipientTierAssignment.tier.scopes_included vs minimization policy map"
    constants:
      STRICT_FORBIDDEN: "[IDENTITY, INCOME, ASSETS]"
      STANDARD_FORBIDDEN: "[INCOME, ASSETS]"
      BROAD_FORBIDDEN: "[]"
    precision: "set semantics; empty uncovered set passes"
    variants:
      - name: strict_policy
        when: "recipient.minimization_policy == STRICT"
        difference: "IDENTITY is also forbidden, so an IDENTITY-only consent is rejected for STRICT recipients but allowed for STANDARD recipients with an IDENTITY tier"

  - name: refresh_rate_limit_window
    trigger: "On every POST /connections/{id}/refresh before execution"
    algorithm: chronological
    formula: |
      executions = RefreshJobs where connection.institution_id == I.id
                   and executed_at >= clock - 3600
      if count(executions) >= agreement.rate_limit_per_hour:
        reject with ERR_RATE_LIMITED (no attempt recorded)
    input_set: "RefreshJobs of ALL connections of the institution executed within the trailing 3600 seconds, regardless of job status"
    constants:
      WINDOW_SECONDS: 3600
    precision: ">= comparison: when count == rate_limit_per_hour exactly, the refresh is rejected"

  - name: refresh_cadence_gate
    trigger: "On POST /connections/{id}/refresh with kind == INCREMENTAL"
    algorithm: threshold
    formula: |
      if connection.last_refreshed_at is null: pass (first refresh may be INCREMENTAL)
      elapsed = clock - connection.last_refreshed_at
      if elapsed < 3600: reject with ERR_REFRESH_TOO_SOON
    input_set: "single connection's last_refreshed_at vs clock"
    constants:
      MIN_INTERVAL_SECONDS: 3600
    precision: "elapsed exactly 3600 passes (< comparison); 3599 fails"

  - name: connection_monthly_refresh_cost
    trigger: "Computed read: GET /connections/{id}/cost_summary"
    algorithm: tiered_pricing
    formula: |
      jobs = RefreshJobs of this connection with status == SUCCEEDED
             and executed_at within the current calendar month (UTC, [month_start, month_end))
      units = sum over jobs of UNIT_COST[tier.rate_class][job.kind]
      UNIT_COST: LOW: {FULL: 2, INCREMENTAL: 1}; MEDIUM: {FULL: 4, INCREMENTAL: 2}; HIGH: {FULL: 8, INCREMENTAL: 3}
      free_allowance = FREE_UNITS[rate_class]  (LOW: 10, MEDIUM: 20, HIGH: 40)
      billable = max(0, units - free_allowance)
      cost_cents = billable * 100
    input_set: "SUCCEEDED RefreshJobs of the connection in the current UTC calendar month; rate_class from the recipient's ACTIVE tier assignment at read time"
    constants:
      UNIT_COST_LOW_FULL: 2
      UNIT_COST_LOW_INCREMENTAL: 1
      UNIT_COST_MEDIUM_FULL: 4
      UNIT_COST_MEDIUM_INCREMENTAL: 2
      UNIT_COST_HIGH_FULL: 8
      UNIT_COST_HIGH_INCREMENTAL: 3
      FREE_UNITS_LOW: 10
      FREE_UNITS_MEDIUM: 20
      FREE_UNITS_HIGH: 40
    precision: "integer units and cents; no fractional rounding"
    variants:
      - name: estimated_provisional
        when: "include_pending=true on the cost_summary read"
        difference: "Month-to-date units are grossed up by the projected remaining weekly cadence refreshes: projected_units = units + UNIT_COST[rate_class][FULL] * ceil((month_end - clock) / 604800), where month_end is the first instant of the next UTC calendar month; billable_units and cost_cents are then recomputed on projected_units with the same free_allowance. The provisional figure therefore strictly exceeds the finalized figure whenever the current month has remaining days"

  - name: reauth_cooldown_gate
    trigger: "On POST /connections/{id}/reauth"
    algorithm: threshold
    formula: |
      if connection.reauth_not_before is null: pass
      if clock < connection.reauth_not_before: reject with ERR_REAUTH_COOLDOWN
    input_set: "connection.reauth_not_before vs clock"
    precision: "clock exactly equal to reauth_not_before passes (< comparison)"

  - name: deletion_propagation_progress
    trigger: "On every POST /deletion_requests/{id}/ack"
    algorithm: aggregation
    formula: |
      required = set of distinct recipient_ids that received a DATA_DELETED webhook for this request
      acked = set(request.acked_recipient_ids)
      remaining = required - acked
      if remaining is empty and request.status == PROPAGATING: status -> ACKED_BY_ALL then -> COMPLETED
    input_set: "WebhookEvents of type DATA_DELETED tied to this request vs acked_recipient_ids"
    precision: "set semantics"

  - name: webhook_fanout_count
    trigger: "On consent revocation/expiry (per-connection CONSENT_REVOKED/CONSENT_EXPIRED emission)"
    algorithm: aggregation
    formula: |
      events_emitted = count(connections of consent where connection.status != DISCONNECTED before the transition)
      # one webhook per affected connection, to the consent's single recipient
    input_set: "Consent's connections in non-terminal states at transition time"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (institution, recipient, consent, connection, agreement, tier, refresh job, deletion request), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_safety
    check: "Segregation of duties on recipient review: reviewer X-User-ID must differ from the prior decision actor (creator/suspender/original reviewer)"
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /recipients/{recipientId}/review"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition (recipient reviewable, consent ACTIVE for revoke/connection ops, connection in correct from-state, deletion request PROPAGATING for ack)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "Optimistic concurrency: expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /recipients/{recipientId}/consents, POST /institutions/{institutionId}/agreements"

  - priority: 7
    category: business_safety
    check: "Consent gating: consent must be ACTIVE and clock < expires_at for connection create/complete_auth/refresh/reauth/migrate"
    error_id: ERR_CONSENT_NOT_ACTIVE
    http_status: 422
    applies_to: "connection create, complete_auth, refresh, reauth, migrate"

  - priority: 8
    category: business_safety
    check: "Parent operability: recipient must be APPROVED to create consents or tier assignments; institution must not be BROKEN for new connections, refreshes, or consumer reauth (an institution-level outage blocks re-auth attempts until the operator recovers the institution)"
    error_id: ERR_PARENT_NOT_OPERABLE
    http_status: 422
    applies_to: "consent create, tier assignment create, connection create, refresh, reauth"

  - priority: 9
    category: business_safety
    check: "Data minimization: consent scopes must not violate recipient minimization policy at consent creation"
    error_id: ERR_SCOPE_VIOLATES_MINIMIZATION
    http_status: 422
    applies_to: "POST /recipients/{recipientId}/consents"

  - priority: 10
    category: business_constraint
    check: "Tier coverage: consent scopes must be covered by the recipient's ACTIVE tier's scopes_included at consent creation"
    error_id: ERR_SCOPE_EXCEEDS_TIER
    http_status: 422
    applies_to: "POST /recipients/{recipientId}/consents"

  - priority: 11
    category: business_constraint
    check: "Agreement coverage: connection consent's scopes must all be keys of the ACTIVE agreement's permitted_fields_by_scope"
    error_id: ERR_AGREEMENT_SCOPE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /institutions/{institutionId}/connections, POST /connections/{id}/complete_auth"

  - priority: 12
    category: business_temporal
    check: "Migration window: migrate only while migration_state == IN_PROGRESS and clock within [migration_window_start, migration_window_end]"
    error_id: ERR_MIGRATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /connections/{id}/migrate, POST /institutions/{id}/migration/start"

  - priority: 13
    category: business_temporal
    check: "Reauth cooldown: clock >= connection.reauth_not_before when set"
    error_id: ERR_REAUTH_COOLDOWN
    http_status: 422
    applies_to: "POST /connections/{id}/reauth"

  - priority: 14
    category: business_fiscal
    check: "Institution rate limit: executions within trailing 3600s < agreement.rate_limit_per_hour"
    error_id: ERR_RATE_LIMITED
    http_status: 429
    applies_to: "POST /connections/{id}/refresh"

  - priority: 15
    category: business_temporal
    check: "Refresh cadence: INCREMENTAL refresh requires elapsed >= 3600 since last_refreshed_at"
    error_id: ERR_REFRESH_TOO_SOON
    http_status: 422
    applies_to: "POST /connections/{id}/refresh"

  - priority: 16
    category: business_constraint
    check: "Connectivity method legality: connection.method in institution.supported_methods; CREDENTIALS method rejected once connectivity_mode == API_ONLY"
    error_id: ERR_METHOD_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /institutions/{institutionId}/connections, POST /connections/{id}/complete_auth"

  - priority: 17
    category: business_constraint
    check: "Uniqueness: at most one ACTIVE InstitutionAgreement per institution; at most one ACTIVE RecipientTierAssignment per recipient; no duplicate non-terminal consent for same (consumer_ref, recipient_id, data_scopes set); no duplicate non-COMPLETED DataDeletionRequest per consent; institution/recipient names unique"
    error_id: ERR_DUPLICATE_ACTIVE
    http_status: 409
    applies_to: "agreement create, tier assignment create, consent create, deletion request create, institution create, recipient create"

  - priority: 18
    category: business_constraint
    check: "Migration completion gate: all non-DISCONNECTED connections must already be on target_method"
    error_id: ERR_MIGRATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /institutions/{id}/migration/complete"

  - priority: 19
    category: business_constraint
    check: "Deletion ack integrity: acknowledging recipient must be one of the required (webhook-targeted) recipients and must not have acked already"
    error_id: ERR_ACK_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /deletion_requests/{id}/ack"

  - priority: 20
    category: existence
    check: "Field-level input validity: enums within declared sets, datetimes parseable, integers in range, required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any call the clock reads exactly this instant and never falls back to wall-clock. Advancing the clock triggers the lazy consent-expiry sweep and institution status aging recomputation."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string, expired_consent_ids: string[] }"
    side_effects:
      - "ConsentRecords with clock >= expires_at -> EXPIRED (with full cascade)"
      - "Institution statuses recomputed (window aging)"

  # --- Institutions ---
  - method: POST
    path: "/institutions"
    description: "Create an Institution"
    roles: [PlatformAdmin]
    code: 201
    input: [name, supported_methods, target_method, migration_window_start, migration_window_end]
    output: Institution
    side_effects: ["migration_state=NOT_STARTED, status=ACTIVE, connectivity_mode=LEGACY_MODE"]

  - method: GET
    path: "/institutions"
    description: "List institutions (paginated; optional status filter)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Institution[]"
    side_effects: []

  - method: GET
    path: "/institutions/{institutionId}"
    description: "Get an institution (recomputes lazy status from aged breakage window)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: []
    output: Institution
    side_effects: ["lazily recompute status if window contents changed"]

  - method: POST
    path: "/institutions/{institutionId}/recover"
    description: "Recover a BROKEN institution (operator action)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Institution
    side_effects:
      - "status -> ACTIVE; breakage counters reset (last_recovered_at = clock)"
      - "increments Institution.version by 1"

  - method: POST
    path: "/institutions/{institutionId}/migration/start"
    description: "Start the institution's migration to bank APIs"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Institution
    side_effects:
      - "migration_state -> IN_PROGRESS; connectivity_mode -> HYBRID"
      - "increments Institution.version by 1"

  - method: POST
    path: "/institutions/{institutionId}/migration/complete"
    description: "Complete migration; requires all non-DISCONNECTED connections on target_method"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Institution
    side_effects:
      - "migration_state -> COMPLETE; connectivity_mode -> API_ONLY"
      - "increments Institution.version by 1"

  # --- InstitutionAgreements ---
  - method: POST
    path: "/institutions/{id}/agreements"
    description: "Create an InstitutionAgreement; supersedes the previously ACTIVE agreement (old one becomes inactive). OCC-guarded on Institution.version."
    roles: [PlatformAdmin]
    code: 201
    input: [rate_limit_per_hour, permitted_fields_by_scope, expected_institution_version]
    output: InstitutionAgreement
    side_effects:
      - "prior ACTIVE agreement for the institution -> active=false"
      - "increments Institution.version by 1"

  - method: GET
    path: "/institutions/{id}/agreements"
    description: "List agreements of an institution (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: "InstitutionAgreement[]"
    side_effects: []

  - method: GET
    path: "/institutions/{id}/breakage_events"
    description: "List breakage events of an institution (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "BreakageEvent[]"
    side_effects: []

  # --- Recipients ---
  - method: POST
    path: "/recipients"
    description: "Create a Recipient (starts PENDING_REVIEW)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, declared_use_case, minimization_policy]
    output: Recipient
    side_effects: ["status=PENDING_REVIEW"]

  - method: GET
    path: "/recipients"
    description: "List recipients (paginated; optional status filter)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Recipient[]"
    side_effects: []

  - method: GET
    path: "/recipients/{recipientId}"
    description: "Get a recipient"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: []
    output: Recipient
    side_effects: []

  - method: POST
    path: "/recipients/{recipientId}/review"
    description: "Approve or reject a recipient (PENDING_REVIEW, SUSPENDED, REJECTED, or APPROVED per transition table); segregation of duties enforced"
    roles: [ComplianceReviewer]
    code: 200
    input: [decision]
    output: Recipient
    side_effects:
      - "decision=APPROVE: status -> APPROVED; decision=REJECT: status -> REJECTED with full revocation cascade"
      - "increments Recipient.version by 1"

  - method: POST
    path: "/recipients/{recipientId}/suspend"
    description: "Suspend an APPROVED recipient; revokes all its consents and disconnects their connections"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Recipient
    side_effects:
      - "status -> SUSPENDED; all ACTIVE consents -> REVOKED; their connections -> DISCONNECTED; tier assignment -> ENDED; CONSENT_REVOKED webhooks"
      - "increments Recipient.version by 1"

  # --- DataProductTiers ---
  - method: POST
    path: "/tiers"
    description: "Create a DataProductTier"
    roles: [PlatformAdmin]
    code: 201
    input: [tier_name, scopes_included, rate_class, "active?"]
    output: DataProductTier
    side_effects: []

  - method: GET
    path: "/tiers"
    description: "List data product tiers"
    roles: [PlatformAdmin, ComplianceReviewer, Recipient]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: "DataProductTier[]"
    side_effects: []

  - method: GET
    path: "/tiers/{tierId}"
    description: "Get a tier"
    roles: [PlatformAdmin, ComplianceReviewer, Recipient]
    code: 200
    input: []
    output: DataProductTier
    side_effects: []

  - method: POST
    path: "/recipients/{recipientId}/tier_assignments"
    description: "Enroll an APPROVED recipient into a tier; ends any prior ACTIVE assignment"
    roles: [PlatformAdmin]
    code: 201
    input: [tier_id]
    output: RecipientTierAssignment
    side_effects: ["prior ACTIVE assignment -> ENDED"]

  - method: GET
    path: "/recipients/{id}/tier_assignments"
    description: "List tier assignments of a recipient (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RecipientTierAssignment[]"
    side_effects: []

  # --- Consents ---
  - method: POST
    path: "/recipients/{recipientId}/consents"
    description: "Capture consumer consent for a recipient. Supersedes prior ACTIVE consents for the same (consumer_ref, recipient_id) pair. OCC-guarded on Recipient.version."
    roles: [Consumer]
    code: 201
    input: [consumer_ref, data_scopes, expires_at, expected_recipient_version]
    output: ConsentRecord
    side_effects:
      - "status=ACTIVE; DataScopeGrant rows materialized per scope"
      - "prior ACTIVE consents for the pair -> SUPERSEDED with connection re-point/disconnect cascade"
      - "increments Recipient.version by 1"

  - method: GET
    path: "/consents"
    description: "List consents (filtered by consumer_ref and/or recipient_id; FK reverse reachability for DataScopeGrant via /consents/{id}/grants)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["consumer_ref?", "recipient_id?", "status?", "limit?", "offset?"]
    output: "ConsentRecord[]"
    side_effects: ["lazy expiry: consents past expires_at flip to EXPIRED on read sweep"]

  - method: GET
    path: "/consents/{consentId}"
    description: "Get a consent (lazy expiry applied)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["lazy expiry if past expires_at"]

  - method: POST
    path: "/consents/{consentId}/revoke"
    description: "Consumer revokes consent; disconnects all its connections and emits webhooks"
    roles: [Consumer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects:
      - "status -> REVOKED; revoked_at = clock"
      - "connections -> DISCONNECTED; CONSENT_REVOKED webhooks per connection"

  - method: GET
    path: "/recipients/{id}/consents"
    description: "List consents addressed to a recipient (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConsentRecord[]"
    side_effects: []

  - method: GET
    path: "/consents/{id}/connections"
    description: "List connections operating under a consent (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Connection[]"
    side_effects: []

  - method: GET
    path: "/consents/{id}/grants"
    description: "List DataScopeGrant rows of a consent (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["limit?", "offset?"]
    output: "DataScopeGrant[]"
    side_effects: []

  # --- Connections ---
  - method: POST
    path: "/institutions/{institutionId}/connections"
    description: "Create a Connection under a consent at an institution"
    roles: [Consumer]
    code: 201
    input: [consumer_ref, consent_id, method, "reauth_cooldown_seconds?"]
    output: Connection
    side_effects: ["status=PENDING_AUTH; consecutive_failures=0"]

  - method: GET
    path: "/connections"
    description: "List connections (filtered by institution_id, consent_id, consumer_ref, status)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["institution_id?", "consent_id?", "consumer_ref?", "status?", "limit?", "offset?"]
    output: "Connection[]"
    side_effects: []

  - method: GET
    path: "/connections/{connectionId}"
    description: "Get a connection"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: []
    output: Connection
    side_effects: []

  - method: GET
    path: "/institutions/{institutionId}/connections"
    description: "List connections of an institution (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Connection[]"
    side_effects: []

  - method: POST
    path: "/connections/{connectionId}/complete_auth"
    description: "Complete authentication for a PENDING_AUTH or MIGRATING connection; runs the initial synchronous refresh"
    roles: [Consumer]
    code: 200
    input: ["simulate_failure?"]
    output: Connection
    side_effects:
      - "PENDING_AUTH -> ACTIVE (or BROKEN if initial refresh institution-down twice)"
      - "MIGRATING -> ACTIVE with CONNECTION_MIGRATED webhook"
      - "initial RefreshJob (FULL) created and executed"

  - method: POST
    path: "/connections/{connectionId}/reauth"
    description: "Re-authenticate a REAUTH_REQUIRED or BROKEN connection after cooldown"
    roles: [Consumer]
    code: 200
    input: [valid]
    output: Connection
    side_effects:
      - "valid=true: -> ACTIVE, consecutive_failures=0, reauth_not_before=null"
      - "valid=false: stays/-> REAUTH_REQUIRED, reauth_not_before = clock + cooldown"

  - method: POST
    path: "/connections/{connectionId}/migrate"
    description: "Migrate an ACTIVE connection to the institution's target_method within the migration window"
    roles: [Consumer]
    code: 200
    input: []
    output: Connection
    side_effects:
      - "status -> MIGRATING; method = institution.target_method"

  - method: POST
    path: "/connections/{connectionId}/refresh"
    description: "Execute a refresh synchronously. Optional failure_reason drives the simulated institution outcome; absent means success."
    roles: [Consumer]
    code: 200
    input: [kind, "failure_reason?", "new_transaction_count?"]
    output: RefreshJob
    side_effects:
      - "RefreshJob executed (SUCCEEDED or FAILED)"
      - "on success: last_refreshed_at=clock, consecutive_failures=0, TRANSACTIONS_AVAILABLE webhook when new_transaction_count > 0 and TRANSACTIONS consented"
      - "on failure: consecutive_failures += 1, BreakageEvent appended, possible REAUTH_REQUIRED/BROKEN transitions, institution status recompute"

  - method: GET
    path: "/connections/{id}/refresh_jobs"
    description: "List refresh jobs of a connection (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RefreshJob[]"
    side_effects: []

  - method: GET
    path: "/connections/{connectionId}/cost_summary"
    description: "Computed read of monthly refresh cost per connection_monthly_refresh_cost; include_pending selects the provisional variant"
    roles: [PlatformAdmin, Consumer, Recipient]
    code: 200
    input: ["include_pending?"]
    output: "{ units: integer, billable_units: integer, cost_cents: integer, rate_class: string }"
    side_effects: []

  # --- Webhooks ---
  - method: GET
    path: "/connections/{id}/webhook_events"
    description: "List webhook events of a connection (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: "WebhookEvent[]"
    side_effects: []

  - method: GET
    path: "/recipients/{id}/webhook_events"
    description: "List webhook events targeted at a recipient (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Recipient]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: "WebhookEvent[]"
    side_effects: []

  - method: GET
    path: "/connections/{id}/breakage_events"
    description: "List breakage events produced by a connection's failed refreshes (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["limit?", "offset?"]
    output: "BreakageEvent[]"
    side_effects: []

  - method: GET
    path: "/tiers/{id}/tier_assignments"
    description: "List recipient tier assignments enrolled in a tier (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Recipient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RecipientTierAssignment[]"
    side_effects: []

  - method: POST
    path: "/webhook_events/{webhookEventId}/deliver"
    description: "Mark a webhook delivered (simulated delivery channel)"
    roles: [Recipient]
    code: 200
    input: []
    output: WebhookEvent
    side_effects: ["delivered_at = clock; delivery_attempts += 1"]

  # --- Data deletion ---
  - method: POST
    path: "/consents/{consentId}/deletion_requests"
    description: "Consumer requests deletion of data shared under a consent; propagates to recipients"
    roles: [Consumer]
    code: 201
    input: []
    output: DataDeletionRequest
    side_effects:
      - "status PENDING -> PROPAGATING; DATA_DELETED webhook to the consent's recipient"
      - "if consent still ACTIVE: consent -> REVOKED with full cascade"

  - method: GET
    path: "/consents/{id}/deletion_requests"
    description: "List deletion requests of a consent (FK reverse reachability)"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: ["limit?", "offset?"]
    output: "DataDeletionRequest[]"
    side_effects: []

  - method: GET
    path: "/deletion_requests/{requestId}"
    description: "Get a deletion request"
    roles: [PlatformAdmin, ComplianceReviewer, Consumer, Recipient]
    code: 200
    input: []
    output: DataDeletionRequest
    side_effects: []

  - method: POST
    path: "/deletion_requests/{requestId}/ack"
    description: "Recipient acknowledges a deletion request; last ack completes it"
    roles: [Recipient]
    code: 200
    input: []
    output: DataDeletionRequest
    side_effects:
      - "recipient appended to acked_recipient_ids"
      - "when all required acks present: -> ACKED_BY_ALL -> COMPLETED (completed_at = clock)"

  # --- Audit ---
  - method: GET
    path: "/audit_logs"
    description: "List audit log entries (filtered by entity_type/entity_id)"
    roles: [PlatformAdmin, ComplianceReviewer]
    code: 200
    input: ["entity_type?", "entity_id?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID for an entity-backed role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Field-level input invalid: bad enum, unparseable datetime, missing required field, out-of-range integer" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state that does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "Segregation of duties violated: reviewer is the same user as the prior decision actor" }
  - { id: ERR_CONSENT_NOT_ACTIVE, http: 422, condition: "Consent is not ACTIVE (revoked/expired/superseded) or is past expires_at" }
  - { id: ERR_SCOPE_VIOLATES_MINIMIZATION, http: 422, condition: "Consent scopes violate the recipient's minimization policy (e.g. IDENTITY under STRICT)" }
  - { id: ERR_SCOPE_EXCEEDS_TIER, http: 422, condition: "Consent scopes not covered by the recipient's ACTIVE tier scopes_included" }
  - { id: ERR_AGREEMENT_SCOPE_NOT_PERMITTED, http: 422, condition: "Consent scopes not all present in the ACTIVE InstitutionAgreement permitted_fields_by_scope keys" }
  - { id: ERR_METHOD_NOT_SUPPORTED, http: 422, condition: "Connection method not in institution.supported_methods, or CREDENTIALS used while connectivity_mode == API_ONLY" }
  - { id: ERR_MIGRATION_WINDOW_CLOSED, http: 422, condition: "Migration action outside [migration_window_start, migration_window_end] or migration_state != IN_PROGRESS" }
  - { id: ERR_MIGRATION_INCOMPLETE, http: 422, condition: "Migration completion attempted while non-DISCONNECTED connections still on a non-target method" }
  - { id: ERR_REAUTH_COOLDOWN, http: 422, condition: "Reauth attempted before connection.reauth_not_before" }
  - { id: ERR_RATE_LIMITED, http: 429, condition: "Institution refresh executions within trailing 3600s reached agreement.rate_limit_per_hour" }
  - { id: ERR_REFRESH_TOO_SOON, http: 422, condition: "INCREMENTAL refresh within 3600s of last_refreshed_at" }
  - { id: ERR_DUPLICATE_ACTIVE, http: 409, condition: "Duplicate ACTIVE agreement/assignment/consent or non-COMPLETED deletion request, or duplicate institution/recipient name" }
  - { id: ERR_PARENT_NOT_OPERABLE, http: 422, condition: "Parent not operable: recipient not APPROVED for consent/tier creation, or institution BROKEN for new connection/refresh" }
  - { id: ERR_ACK_NOT_REQUIRED, http: 422, condition: "Deletion ack from a recipient that is not a required ack target or that already acked" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: manages institutions, agreements, tiers, recipients lifecycle (create/suspend/recover/migration), and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /institutions — create institution"
      - "POST /institutions/{id}/recover — recover broken institution"
      - "POST /institutions/{id}/migration/start — start migration"
      - "POST /institutions/{id}/migration/complete — complete migration"
      - "POST /institutions/{id}/agreements — create agreement"
      - "POST /recipients — create recipient"
      - "POST /recipients/{id}/suspend — suspend recipient"
      - "POST /tiers — create tier"
      - "POST /recipients/{id}/tier_assignments — enroll recipient in tier"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET endpoints (institutions, recipients, tiers, consents, connections, refresh jobs, webhooks, deletion requests, agreements, breakage events, audit logs, cost summary)"

  - name: ComplianceReviewer
    description: "Compliance reviewer: approves/rejects recipients with segregation-of-duties constraints; read access for oversight"
    identity: opaque
    exclusive_operations:
      - "POST /recipients/{id}/review — approve or reject recipient"
    shared_operations:
      - "GET endpoints (institutions, recipients, tiers, consents, connections, refresh jobs, webhooks, deletion requests, agreements, breakage events, audit logs)"

  - name: Consumer
    description: "End consumer whose bank data is shared. X-User-ID equals consumer_ref; ownership checks compare X-User-ID to consent/connection consumer_ref"
    identity: opaque
    exclusive_operations:
      - "POST /recipients/{id}/consents — capture consent"
      - "POST /consents/{id}/revoke — revoke consent"
      - "POST /institutions/{id}/connections — create connection"
      - "POST /connections/{id}/complete_auth — complete authentication"
      - "POST /connections/{id}/reauth — re-authenticate"
      - "POST /connections/{id}/migrate — migrate connection method"
      - "POST /connections/{id}/refresh — execute refresh"
      - "POST /consents/{id}/deletion_requests — request data deletion"
    shared_operations:
      - "GET own consents/connections/refresh jobs/webhook events/deletion requests/cost summary"

  - name: Recipient
    description: "Downstream data recipient (entity-backed). X-User-ID equals the Recipient.id it acts as"
    identity: "entity_backed:Recipient"
    exclusive_operations:
      - "POST /deletion_requests/{id}/ack — acknowledge deletion"
      - "POST /webhook_events/{id}/deliver — mark webhook delivered"
    shared_operations:
      - "GET own recipient record, consents addressed to it, webhook events targeted at it, tiers"
