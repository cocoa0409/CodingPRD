scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: employee_creation_applies_system_defaults
        claim_type: defaults
        grounds: ["entities.Employee"]
        distinguishing_aspect: "POST /api/employees with only required inputs yields availability_status=AVAILABLE, cumulative_duty_minutes_month=0, fatigue_score=0, version=1 — system/computed defaults applied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
          trigger:
            - call: "POST /api/employees"
              payload: { employee_number: "E0001", full_name: "Default Dan", craft: "BRAKEMAN", seniority_date: "2020-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id, avail: $.data.availability_status, cum: $.data.cumulative_duty_minutes_month, fat: $.data.fatigue_score, ver: $.data.version }
          assert:
            - "captured avail == AVAILABLE"
            - "captured cum == 0"
            - "captured fat == 0.0"
            - "captured ver == 1"

      - name: employee_duplicate_employee_number_rejected
        claim_type: violation_to_error
        grounds: ["entities.Employee.fields.employee_number", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second POST /api/employees reusing an existing employee_number is rejected ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["one employee with employee_number E0002 exists"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0002", full_name: "First", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
          trigger:
            - call: "POST /api/employees"
              payload: { employee_number: "E0002", full_name: "Second", craft: "ENGINEER", seniority_date: "2011-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DUPLICATE"

      - name: employee_get_not_found
        claim_type: not_found
        grounds: ["entities.Employee", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/employees/{uuid-that-does-not-exist} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/employees/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CrewManager
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_NOT_FOUND"

      - name: employee_invalid_craft_enum_rejected
        claim_type: type_constraint
        grounds: ["entities.Employee.fields.craft", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "craft='DISPATCHER' is outside the declared enum set -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/employees"
              payload: { employee_number: "E0003", full_name: "Bad Craft", craft: "DISPATCHER", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: employee_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Employee.fields.seniority_date", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required seniority_date -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/employees"
              payload: { employee_number: "E0004", full_name: "No Seniority", craft: "CONDUCTOR", home_terminal: "CHI" }
              as: CrewManager
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: rest_period_open_row_shape_after_tieup
        claim_type: immutability
        grounds: ["entities.RestPeriod"]
        distinguishing_aspect: "RestPeriod is common_fields: false (no updated_at/version); after tie-up the row reads rest_status=OPEN with rest_end null, and there is no PUT/PATCH/DELETE endpoint for it."
        test_recipe:
          setup: ["Employee E tied up after a 300-minute tour (one OPEN RestPeriod exists)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0005", full_name: "Rest Ruth", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-C1", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "Y-CHI-C1", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-02T06:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /api/calls/${call_id}/accept"
              payload: { expected_job_version: "${job_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/on-duty"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T11:00:00Z" }
              as: CrewManager
            - call: "POST /api/assignments/${asg_id}/tie-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "GET /api/rest-periods?employee_id=${emp_id}"
              payload: {}
              as: CrewManager
              captures: { rp_status: "$.data[0].rest_status", rp_end: "$.data[0].rest_end" }
          assert:
            - "captured rp_status == OPEN"
            - "captured rp_end == null"

      - name: fk_reverse_reachability_job_calls
        claim_type: parent_relationships
        grounds: ["entities.Call.fields.job_id"]
        distinguishing_aspect: "GET /api/jobs/{id}/calls returns exactly the Call rows whose job_id matches (sub-resource reverse reachability)."
        test_recipe:
          setup: ["Job J with one issued call"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0006", full_name: "FK Fiona", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-C2", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHI-C2", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-03T08:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
          trigger:
            - call: "GET /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { listed_call: "$.data[0].id" }
          assert:
            - "captured listed_call == ${call_id}"

      - name: pagination_defaults_on_employee_list
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "GET /api/employees with 12 employees and no params returns exactly 10 rows (default limit 10) with total_count=12 and has_more=true; offset=10 returns the remaining 2 with has_more=false."
        test_recipe:
          setup: ["12 employees created"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0001", full_name: "Pg One", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0002", full_name: "Pg Two", craft: "CONDUCTOR", seniority_date: "2010-01-02T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0003", full_name: "Pg Three", craft: "CONDUCTOR", seniority_date: "2010-01-03T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0004", full_name: "Pg Four", craft: "CONDUCTOR", seniority_date: "2010-01-04T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0005", full_name: "Pg Five", craft: "CONDUCTOR", seniority_date: "2010-01-05T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0006", full_name: "Pg Six", craft: "CONDUCTOR", seniority_date: "2010-01-06T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0007", full_name: "Pg Seven", craft: "CONDUCTOR", seniority_date: "2010-01-07T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0008", full_name: "Pg Eight", craft: "CONDUCTOR", seniority_date: "2010-01-08T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0009", full_name: "Pg Nine", craft: "CONDUCTOR", seniority_date: "2010-01-09T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0010", full_name: "Pg Ten", craft: "CONDUCTOR", seniority_date: "2010-01-10T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0011", full_name: "Pg Eleven", craft: "CONDUCTOR", seniority_date: "2010-01-11T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "P0012", full_name: "Pg Twelve", craft: "CONDUCTOR", seniority_date: "2010-01-12T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
          trigger:
            - call: "GET /api/employees"
              payload: {}
              as: CrewManager
          assert:
            - "first page returns 10 rows (default limit), total_count == 12, has_more == true"
            - "a follow-up GET /api/employees?offset=10 returns 2 rows, has_more == false"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: call_terminal_declined_cannot_be_rescinded
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Call", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: rescind on a DECLINED call -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Call C offered to E then declined by E"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0101", full_name: "Term Tom", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-C3", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHI-C3", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-03T08:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /api/calls/${call_id}/decline"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /api/calls/${call_id}/rescind"
              payload: {}
              as: CrewCaller
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: call_expiry_sweep_on_clock_advance
        claim_type: valid_transition
        grounds: ["state_machines.Call.OFFERED_to_EXPIRED"]
        distinguishing_aspect: "Advancing the logical clock past expires_at (offered_at + 120 minutes) auto-transitions the OFFERED call to EXPIRED and penalty-rotates the employee's slot to the board tail."
        test_recipe:
          setup: ["Board with E1(pos1), E2(pos2); Call C1 -> E1 OFFERED at 2026-08-01T00:00:00Z; no response"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0102", full_name: "Exp Eddy", craft: "CONDUCTOR", seniority_date: "2009-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp1_id: $.data.id }
            - call: "POST /api/employees"
              payload: { employee_number: "E0103", full_name: "Exp Fran", craft: "CONDUCTOR", seniority_date: "2012-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp2_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-C4", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 2 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp1_id}" }
              as: CrewManager
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp2_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHI-C4", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-04T08:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id, call_emp: $.data.employee_id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:01Z" }
              as: CrewManager
              captures: { expired_ids: $.data.expired_call_ids }
            - call: "GET /api/calls?job_id=${job_id}"
              payload: {}
              as: CrewCaller
              captures: { call_status: "$.data[0].call_status" }
            - call: "GET /api/extra-board-slots?board_id=${board_id}&employee_id=${emp1_id}"
              payload: {}
              as: CrewManager
              captures: { e1_pos: "$.data[0].standing_position" }
          assert:
            - "captured call_emp == ${emp1_id} (first-out position 1 called first)"
            - "captured call_status == EXPIRED"
            - "captured e1_pos == 2 (penalty rotation moved E1 to the tail)"

      - name: assignment_marked_up_cannot_tieup
        claim_type: invalid_transition
        grounds: ["state_machines.Assignment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "tie-up is declared only from ON_DUTY; calling it on a MARKED_UP assignment -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Assignment A in MARKED_UP"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0104", full_name: "Inv Ivan", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-C5", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHI-C5", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-03T08:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /api/calls/${call_id}/accept"
              payload: { expected_job_version: "${job_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /api/assignments/${asg_id}/tie-up"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"

      - name: assignment_layoff_reopens_seat_and_frees_employee
        claim_type: side_effect_execution
        grounds: ["state_machines.Assignment.MARKED_UP_to_LAID_OFF"]
        distinguishing_aspect: "Lay-off before report_time: job.filled_count decrements 1 -> 0, the FILLED job drops back to CALLING, employee returns to AVAILABLE, and no RestPeriod opens (duty never started)."
        test_recipe:
          setup: ["Job J crew_required=1 FILLED via E's accepted call; clock still before report_time"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0105", full_name: "Layoff Lois", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-C6", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHI-C6", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-03T08:00:00Z", crew_required: 1 }
              as: CrewManager
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /api/jobs/${job_id}/calls"
              payload: {}
              as: CrewCaller
              captures: { call_id: $.data.id }
            - call: "POST /api/calls/${call_id}/accept"
              payload: { expected_job_version: "${job_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /api/assignments/${asg_id}/lay-off"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { asg_status: $.data.assignment_status }
            - call: "GET /api/jobs/${job_id}"
              payload: {}
              as: CrewManager
              captures: { job_status: $.data.job_status, filled: $.data.filled_count }
            - call: "GET /api/employees/${emp_id}"
              payload: {}
              as: CrewManager
              captures: { emp_status: $.data.availability_status }
          assert:
            - "captured asg_status == LAID_OFF"
            - "captured job_status == CALLING and filled == 0"
            - "captured emp_status == AVAILABLE"
            - "GET /api/rest-periods?employee_id=${emp_id} returns an empty list"

      - name: assignment_layoff_at_report_time_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Assignment.MARKED_UP_to_LAID_OFF", "errors[ERR_TEMPORAL_WINDOW]"]
        distinguishing_aspect: "Lay-off at now == job.report_time fails the strict now < report_time precondition -> ERR_TEMPORAL_WINDOW (422)."
        test_recipe:
          setup: ["Assignment A MARKED_UP for a job reporting 2026-08-03T08:00:00Z; clock at exactly report_time"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
            - call: "POST /api/employees"
              payload: { employee_number: "E0106", full_name: "Late Larry", craft: "CONDUCTOR", seniority_date: "2010-01-01T00:00:00Z", home_terminal: "CHI" }
              as: CrewManager
              captures: { emp_id: $.data.id }
            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-C7", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp_id}" }
              as: CrewManager
            - call: "POST /api/jobs"
              payload: { job_symbol: "M-CHI-C7", craft: "CONDUCTOR", origin_terminal: "CHI", report_time: "2026-08-03T08:00:00Z", crew_required: 1 }
              as: CrewManager
