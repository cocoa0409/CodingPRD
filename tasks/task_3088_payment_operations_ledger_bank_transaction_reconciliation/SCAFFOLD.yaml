  side_effects: []
- method: POST
  path: /payment-orders/{id}/approve
  description: Release an order from PENDING_APPROVAL; refused when the approver is also the initiator
  roles:
  - PaymentApprover
  code: 200
  input:
  - expected_payment_order_version
  output: PaymentOrder
  side_effects:
  - status = APPROVED; approver_user_id = X-User-ID
  - Every pending ReleaseRequest whose initiator_user_id equals this approver is denied
  - increments PaymentOrder.version by 1
  - 'AuditEvent appended: action=payment_order.approved'
- method: POST
  path: /payment-orders/{id}/cancel
  description: Cancel an order that is still awaiting approval; a cancel against an order that already left PENDING_APPROVAL
    returns ERR_ALREADY_TERMINAL once it is in one of the four terminal statuses
  roles:
  - PaymentInitiator
  code: 200
  input: []
  output: PaymentOrder
  side_effects:
  - status = CANCELLED
  - Counterparty.status = RESTRICTED
  - increments PaymentOrder.version by 1
- method: POST
  path: /payment-orders/{id}/dispatch
  description: Move an APPROVED order into its rail-specific dispatched state, booking the originating and fee legs
  roles:
  - PaymentApprover
  code: 200
  input:
  - expected_payment_order_version
  output: PaymentOrder
  side_effects:
  - status = ACH_DISPATCHED | WIRE_DISPATCHED | RTP_DISPATCHED | CHECK_DISPATCHED selected by rail
  - ORIGINATING and FEE Transactions created per rail_fee_schedule
  - A ReleaseRequest is created for the linked counterparty in request_state PENDING
  - PaymentOrder.settlement_status = IN_SETTLEMENT
  - increments PaymentOrder.version by 1
  - 'AuditEvent appended: action=payment_order.dispatched'
- method: POST
  path: /payment-orders/{id}/mark_in_flight
  description: Join the rail branch into the shared in-flight state
  roles:
  - PaymentOpsAnalyst
  code: 200
  input: []
  output: PaymentOrder
  side_effects:
  - status = IN_FLIGHT
- method: POST
  path: /payment-orders/{id}/settle
  description: 'Settle an in-flight order: the ledger legs move to the posted book and the release request is satisfied'
  roles:
  - PaymentOpsAnalyst
  code: 200
  input: []
  output: PaymentOrder
  side_effects:
  - status = SETTLED; PaymentOrder.settlement_status = SETTLED
  - Legs of this order move settlement_status IN_SETTLEMENT -> SETTLED
  - The linked ReleaseRequest becomes SATISFIED
  - Ledger.posted_balance_cents recomputed
  - ExceptionItem of kind FAILED_PAYMENT auto-resolves when its payment order settles
- method: POST
  path: /payment-orders/{id}/return
  description: Return an in-flight order with a rail return code, booking the compensating legs and raising the
    return exception
  roles:
  - PaymentOpsAnalyst
  code: 200
  input:
  - return_reason
  - expected_payment_order_version
  output: PaymentOrder
  side_effects:
  - status = RETURNED; return_reason recorded
  - RETURN legs created with net_effect_cents = -(leg.net_effect_cents)
  - A paired FEE leg of 25 cents is booked alongside every RETURN leg
  - An ExceptionItem of kind RETURN is raised in status OPEN
  - increments PaymentOrder.version by 1
  - 'AuditEvent appended: action=payment_order.returned'
- method: POST
  path: /payment-orders/{id}/reverse
  description: Reverse an order that has settled at least once, booking a reversal leg in the posted book
  roles:
  - PaymentOpsAnalyst
  code: 200
  input:
  - expected_payment_order_version
  output: PaymentOrder
  side_effects:
  - status = REVERSED
  - A REVERSAL Transaction is created POSTED and SETTLED
  - Ledger.posted_balance_cents recomputed
  - The linked ReleaseRequest becomes DECLINED
  - increments PaymentOrder.version by 1
- method: POST
  path: /payment-orders/{id}/fail
  description: Fail an in-flight order before settlement so its legs leave the posted book eligibility
  roles:
  - PaymentOpsAnalyst
  code: 200
  input:
  - failure_reason
  output: PaymentOrder
  side_effects:
  - PaymentOrder.settlement_status = FAILED
  - Legs return to settlement_status UNSETTLED
  - An ExceptionItem of kind FAILED_PAYMENT is raised in status OPEN
  - 'AuditEvent appended: action=payment_order.failed'
- method: POST
  path: /ledgers/{id}/transactions
  description: Book a manual ledger entry; the ledger segment is validated before the body's foreign keys, and the
    posting is refused with ERR_BALANCE_WOULD_GO_NEGATIVE when it would drive posted_balance_cents below zero on
