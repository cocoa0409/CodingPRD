            - "GET /fleet/trip-stops/${stop_r1b_id} returns service_minutes == 58"
            - "93 + 58 == 151, confirming the ceiling was applied per stop and not to the aggregate"
            - "Trip.${trip_r1_id}.total_miles == 100 and planned_delivery_cases == 1400"

      - name: backhaul_margin_mode_c_pre_commission_tier_breaks_the_circular_dependency
        grounds:
          - calculations.backhaul_contribution_margin
          - entities.BackhaulOffer.fields.tier_margin_pct
          - entities.BackhaulOffer.fields.commission_cents
          - entities.BackhaulOffer.fields.contribution_margin_cents
          - entities.BackhaulOffer.fields.margin_pct
        distinguishing_aspect: |
          MODE (c) - SELF-REFERENTIAL-LOOKING CHAIN BROKEN BY A PINNED STEP
          ORDER. The commission rate is selected by a margin tier, yet the
          commission is itself subtracted to produce the reported margin. The
          contract breaks the loop by keying step 8 on the PRE-commission
          tier_margin_pct (0.2139, above the 0.20 tier) rather than on the
          reported margin_pct (0.1539, below it). Offer B1 therefore pays a 6%
          commission of 3240 and reports contribution_margin_cents 8310; the
          circular reading pays 3% (1620) and reports 9930 with margin_pct
          0.1839. Neither the rounding boundary of mode (b) nor the nested
          maxima of mode (a) are involved.
        test_recipe:
          setup:
            - "Store S-1001 exists purely as the offer's destination."
            - "Offer B1 economics: revenue_cents 54000, cases 400, deadhead_miles 42, loaded_miles 168, temperature_mode DRY."
            - "Expected chain: incremental_miles 210; line_haul 210*185 = 38850; handling 400*9 = 3600; reefer 0; variable_cost 42450; gross_margin 54000 - 42450 = 11550; tier_margin_pct round(11550/54000, 4) = 0.2139 >= 0.20 so commission_pct 0.06; commission 3240; contribution_margin 8310; margin_pct round(8310/54000, 4) = 0.1539."
            - "Control offer B2 (revenue 60000, 300 cases, 30 deadhead + 200 loaded, REFRIGERATED) exercises the low tier and the reefer surcharge: line_haul 42550, handling 2700, reefer 200*22 = 4400, variable_cost 49650, gross_margin 10350, tier_margin_pct 0.1725 < 0.20 so commission_pct 0.03, commission 1800, contribution_margin 8550, margin_pct 0.1425."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-1001", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 240, dock_close_minute: 1320 }
              as: FleetPlanner
              captures: { store_s1_id: $.data.id }
          trigger:
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "VENDOR_PICKUP", shipper_name: "ACME MILLS", origin_region_code: "MIDWEST", dest_store_id: "${store_s1_id}", revenue_cents: 54000, cases: 400, weight_lbs: 9000, deadhead_miles: 42, loaded_miles: 168, temperature_mode: "DRY", pickup_window_start: "2026-08-03T11:30:00Z", pickup_window_end: "2026-08-03T13:00:00Z", offer_expires_at: "2026-08-06T00:00:00Z" }
              as: FleetPlanner
              captures: { b1_vc: $.data.variable_cost_cents, b1_gm: $.data.gross_margin_cents, b1_tier: $.data.tier_margin_pct, b1_com: $.data.commission_cents, b1_cm: $.data.contribution_margin_cents, b1_mp: $.data.margin_pct }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "THIRD_PARTY", shipper_name: "NORTHSTAR COLD", origin_region_code: "MIDWEST", dest_store_id: "${store_s1_id}", revenue_cents: 60000, cases: 300, weight_lbs: 8000, deadhead_miles: 30, loaded_miles: 200, temperature_mode: "REFRIGERATED", pickup_window_start: "2026-08-04T09:00:00Z", pickup_window_end: "2026-08-04T15:00:00Z", offer_expires_at: "2026-08-06T00:00:00Z" }
              as: FleetPlanner
              captures: { b2_vc: $.data.variable_cost_cents, b2_gm: $.data.gross_margin_cents, b2_tier: $.data.tier_margin_pct, b2_com: $.data.commission_cents, b2_cm: $.data.contribution_margin_cents, b2_mp: $.data.margin_pct }
          assert:
            - "${b1_vc} == 42450"
            - "${b1_gm} == 11550"
            - "${b1_tier} == 0.2139"
            - "${b1_com} == 3240 (NOT 1620)"
            - "${b1_cm} == 8310 (NOT 9930)"
            - "${b1_mp} == 0.1539 (NOT 0.1839)"
            - "${b2_vc} == 49650"
            - "${b2_gm} == 10350"
            - "${b2_tier} == 0.1725"
            - "${b2_com} == 1800"
            - "${b2_cm} == 8550"
            - "${b2_mp} == 0.1425"
            - "both offers are created with status == PROPOSED and review_round == 0"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: trip_settlement_dimension_cycles_while_plan_dimension_stays_terminal
        grounds:
          - state_machines.Trip[plan_status]
          - state_machines.Trip[settlement_status]
          - entities.Trip.fields.plan_status
          - entities.Trip.fields.settlement_status
          - endpoints[POST /fleet/trips/{trip_id}/re-accrue]
        distinguishing_aspect: |
          PARALLEL + CYCLIC on the Trip entity. plan_status sits in its terminal
          COMPLETED state for the whole test while settlement_status walks the
          full loop ACCRUED -> SETTLED -> DISPUTED -> ADJUSTED -> ACCRUED and
          arrives back where it started. A linear reading of "COMPLETED is
          terminal" would reject the four settlement writes; a single-dimension
          reading would let the settlement writes disturb plan_status. Both
          dimensions are asserted after every step.
        test_recipe:
          setup:
            - "Fixture F1 fully executed with pay plan MILE-A: TRIP-1 is COMPLETED / ACCRUED and carries exactly one ACCRUED DriverPayStatement of 28244 cents."
            - "Re-accrual minutes 340 drive / 600 duty give detention 600 - 505 - 30 = 65 minutes, hourly 65 * 42 = 2730, and a new gross of 21294 + 5900 + 2730 = 29924 on the SAME pinned plan version."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
