            - "CombinationSale.${combo_a}.floor_price_cents == 150000"
            - "CombinationSale.${combo_a}.min_allowed_price_cents == 135000, not the 142500 that keying the band on the discounted value would produce"
            - "CombinationSale.${combo_a}.combined_case_price_cents == 135000 is accepted because the comparison against min_allowed_price_cents is inclusive"
            - "CombinationSale.${combo_a}.status == ACTIVE"

  - rule_id: non_linear_state_machine
    instances:
      - name: price_schedule_returns_to_draft_and_resubmission_after_deadline_turns_late
        grounds:
          - state_machines.PriceSchedule.SUBMITTED_to_DRAFT
          - state_machines.PriceSchedule.DRAFT_to_SUBMITTED
          - calculations.late_filing_determination
          - entities.PriceSchedule.fields.return_count
          - entities.Wholesaler.fields.late_filing_penalty_accrued_cents
        distinguishing_aspect: |
          The PriceSchedule machine is cyclic: SUBMITTED returns to DRAFT and the same DRAFT_to_SUBMITTED trigger
          fires a second time, and because the clock has crossed the posting deadline in between, the second pass
          through the identical transition produces a different outcome (is_late true, 250000 accrued) than the first.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults (posting_deadline_day 10, late_filing_penalty_cents 250000)."
            - "Wholesaler A with a filing agent and an APPROVED brand Rio Reserve."
            - "Draft schedule for posting month 2026-09 carrying one item, so its deadline instant is 2026-09-10T23:59:59.999Z."
            - "The schedule is submitted on time and then returned for correction, so it is DRAFT again with return_count 1."
            - "The clock is advanced to 2026-09-15T00:00:00Z, which is past the deadline instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
              payload: { state_code: "TX", program_name: "Texas Price Posting Program" }
              as: ComplianceOfficer
              captures: { prog_tx: $.data.id }
            - call: "POST /wholesalers"
              payload: { license_number: "W-1001", legal_name: "Lone Star Distributing", state_program_id: "${prog_tx}" }
              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
              as: ComplianceOfficer
            - call: "POST /price-schedules"
              payload: { wholesaler_id: "${wh_a}", state_program_id: "${prog_tx}", posting_month: "2026-09" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { sched_a: $.data.id }
            - call: "POST /price-schedule-items"
              payload: { schedule_id: "${sched_a}", brand_id: "${brand_a}", size_ml: 750, bottles_per_case: 12, case_price_cents: 120000, unit_price_cents: 11000 }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { item_a: $.data.id }
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { first_is_late: $.data.is_late }
            - call: "POST /price-schedules/${sched_a}/return-for-correction"
              payload: { return_reason: "Case and unit prices transposed on the 750 ml line." }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /price-schedules/${sched_a}/submit"
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { second_is_late: $.data.is_late, second_status: $.data.status }
          assert:
            - "the first submission returned is_late == false because 2026-08-01T00:00:00Z precedes the 2026-09-10T23:59:59.999Z deadline"
            - "PriceSchedule.${sched_a}.status == SUBMITTED after the second submission"
            - "PriceSchedule.${sched_a}.return_count == 1"
            - "PriceSchedule.${sched_a}.is_late == true after the second submission"
            - "PriceSchedule.${sched_a}.filed_at == 2026-09-15T00:00:00.000Z"
            - "Wholesaler.${wh_a}.late_filing_count == 1"
            - "Wholesaler.${wh_a}.late_filing_penalty_accrued_cents == 250000"
            - "Wholesaler.${wh_a}.penalty_exposure_cents == 250000"
            - "PriceScheduleItem.${item_a}.status == DRAFT because submission does not post items"

      - name: hold_amendment_accept_and_reject_branches_write_disjoint_side_effect_sets
        grounds:
          - state_machines.HoldAmendment.PENDING_to_ACCEPTED
          - state_machines.HoldAmendment.PENDING_to_REJECTED
          - entities.PriceScheduleItem.fields.amendment_count
          - entities.Wholesaler.fields.frivolous_amendment_count
          - calculations.tier_discounted_case_price
        distinguishing_aspect: |
          The HoldAmendment machine branches out of PENDING into two terminal-facing states whose side-effect sets are
          disjoint: ACCEPTED rewrites the item's prices and recomputes its tier to 103500 while leaving the
          wholesaler untouched, and REJECTED leaves every price alone while incrementing the wholesaler's
          frivolous_amendment_count — a different entity than the accept branch touches.
