# =============================================================================
# §1.9 Scaffold Corner Design — Task 2967 (Label Distribution Deal & Recoupment
# Accounting). Breadth probe: every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already cover. Corners that
# §1.8 already asserts appear as `excluded_because:` stubs with no test_recipe.
#
# Section names are the nine sections of references/claim-extraction-guide.md;
# claim_type values are the snake_case forms of that section's own table rows.
#
# Shared actor ids used by every recipe below (identical to §1.8):
#   LabelAdmin          -> "label-admin-01"
#   BusinessAffairs     -> "biz-affairs-01"
#   RoyaltyAnalyst      -> "analyst-01"
#   DistributionPartner -> ${dist_id}   (the Distributor row's own id)
#   Artist              -> ${artist_id} (the Artist row's own id)
#
# The logical clock reads 2026-08-01T00:00:00Z before any /_clock call, so a
# recipe that does not care about time omits the clock call entirely.
#
# MISSING_ID, used wherever a fabricated-but-well-formed id is required:
#   00000000-0000-4000-8000-000000000000
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: deal_creation_and_retrieval_round_trip
        claim_type: creation
        grounds:
          - endpoints[POST /distribution-deals]
          - endpoints[GET /distribution-deals/{id}]
          - entities.DistributionDeal
          - response_envelope.success
        distinguishing_aspect: |
          A DISTRIBUTION_FEE deal created with every required field returns 201 with the six
          ledger fields at their declared defaults and version 1, and the immediately following
          GET returns byte-identical business values. Falsified if any ledger field is absent,
          non-zero, or if the GET disagrees with the create response.
        test_recipe:
          setup:
            - "one Distributor exists"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US", "GB"], cross_collateralized: true, advance_amount_cents: 200000, marketing_budget_cents: 500000, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id, deal_v1: $.data.version }
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
          assert:
            - "the create call returns HTTP 201 with meta.api_request_id present, response_type == \"object\" and the entity under data"
            - "data.status == \"DRAFT\", data.executed_at == null, data.advance_payment_reference == null, data.termination_effective_date == null, data.post_term_collection_end_date == null"
            - "the six ledger fields are all zero-valued: advance_recouped_cents == 0, unrecouped_advance_cents == 0, net_receipts_to_date_cents == 0, post_recoupment_net_receipts_cents == 0, marketing_committed_cents == 0, recoupment_status == \"UNRECOUPED\""
            - "the four common fields are present and ${deal_v1} == 1, with created_at and updated_at both ISO 8601 UTC with exactly three fractional digits"
            - "the three unused deal_type fee fields are null: profit_share_label_pct == null, services_fee_pct == null, services_monthly_fee_cents == null"
            - "the GET returns HTTP 200 with data.id == ${deal_id}, data.version == ${deal_v1}, territory_codes == [\"US\", \"GB\"] and every field equal to the create response"

      - name: deal_listing_pagination_metadata_and_distributor_filter
        claim_type: listing
        grounds:
          - endpoints[GET /distribution-deals]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three deals on distributor A and one on distributor B; the distributor_id filter and
          the limit/offset window compose, so total_count reports the FILTERED cardinality (3)
          and not the table cardinality (4), and has_more flips exactly once across the window.
        test_recipe:
          setup:
            - "two Distributors, three DRAFT deals on the first and one DRAFT deal on the second"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_a_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Harbourside Physical", legal_entity: "Harbourside Physical Ltd" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_b_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_a_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_a_id}", deal_type: "PROFIT_SHARE", profit_share_label_pct: 0.6000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_a_id}", deal_type: "LABEL_SERVICES", services_fee_pct: 0.1000, services_monthly_fee_cents: 25000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_b_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.2000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["GB"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          trigger:
            - call: "GET /distribution-deals"
              payload: { distributor_id: "${dist_a_id}", limit: 2, offset: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /distribution-deals"
              payload: { distributor_id: "${dist_a_id}", limit: 2, offset: 2 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /distribution-deals"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /distribution-deals"
              payload: { distributor_id: "${dist_a_id}", status: "EXECUTED" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "page 1 returns response_type == \"array\" with exactly 2 rows, limit == 2, offset == 0, total_count == 3 and has_more == true"
            - "page 2 returns exactly 1 row, offset == 2, total_count == 3 and has_more == false"
            - "every row on both pages has distributor_id == ${dist_a_id}; the fourth deal on ${dist_b_id} never appears"
            - "the unfiltered, unparameterised call returns limit == 10, offset == 0, total_count == 4 and has_more == false"
            - "the status == EXECUTED filter returns 0 rows with total_count == 0 and has_more == false — all four deals are DRAFT"

      - name: not_found_ids_across_every_templated_read
        claim_type: not_found
        grounds:
          - validations[priority 3 existence]
          - errors[ERR_DEAL_NOT_FOUND]
          - errors[ERR_RELEASE_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_MARKETING_SPEND_NOT_FOUND]
          - errors[ERR_REVENUE_REPORT_NOT_FOUND]
          - errors[ERR_PHYSICAL_RUN_NOT_FOUND]
          - errors[ERR_STATEMENT_NOT_FOUND]
          - errors[ERR_DISTRIBUTOR_NOT_FOUND]
          - errors[ERR_ARTIST_NOT_FOUND]
        distinguishing_aspect: |
          Each templated GET returns its OWN entity-specific 404 code, never a generic one:
          nine different error_id values from nine paths, all with a well-formed but unused
          UUID. Falsified if any path answers with a shared ERR_NOT_FOUND or with 400.
        test_recipe:
          setup:
            - "an empty database — no row carries the fabricated id"
          setup_api_calls: []
          trigger:
            - call: "GET /distributors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /artists/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /distribution-deals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /releases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /artist-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /marketing-spends/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /dsp-revenue-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /physical-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /artist-statements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "every one of the nine calls returns HTTP 404 with response_type == \"error\""
            - "the nine data.error_id values are, in call order: ERR_DISTRIBUTOR_NOT_FOUND, ERR_ARTIST_NOT_FOUND, ERR_DEAL_NOT_FOUND, ERR_RELEASE_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_MARKETING_SPEND_NOT_FOUND, ERR_REVENUE_REPORT_NOT_FOUND, ERR_PHYSICAL_RUN_NOT_FOUND, ERR_STATEMENT_NOT_FOUND"
            - "each error body carries a non-empty data.message and no data.id"

      - name: required_input_field_omission_rejected
        claim_type: required_fields
        grounds:
          - validations[priority 5 business_constraint ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /distribution-deals]
          - endpoints[POST /releases]
        distinguishing_aspect: |
          Every §1.5 `input:` token without a trailing `?` is genuinely required: omitting
          deal_type, territory_codes or advance_amount_cents on deal creation, and upc or
          formats on release creation, each yields 400 ERR_INVALID_REQUEST and persists nothing.
        test_recipe:
          setup:
            - "one Distributor, one Artist and one DRAFT deal exist so the release calls fail on schema and not on FK resolution"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", title: "No Barcode", planned_release_date: "2026-02-01", formats: ["DIGITAL"] }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345679131", title: "No Formats", planned_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /distribution-deals"
              payload: { distributor_id: "${dist_id}" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /releases"
              payload: { deal_id: "${deal_id}" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "all five negative calls return HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the missing tokens are exactly the ones §1.5 declares without a trailing question mark: deal_type, territory_codes, advance_amount_cents on the deal, upc and formats on the release"
            - "GET /distribution-deals?distributor_id=${dist_id} still reports total_count == 1 — no partial deal was persisted"
            - "GET /releases?deal_id=${deal_id} reports total_count == 0 — neither rejected release exists"

      - name: optional_input_defaults_applied_on_omission
        claim_type: defaults
        grounds:
          - entities.Distributor.fields.default_returns_reserve_pct
          - entities.DistributionDeal.fields.objection_window_days
          - entities.DistributionDeal.fields.post_term_collection_days
          - entities.Release.fields.advance_share_cents
          - entities.StreamRateCard.fields.effective_to
          - entities.PhysicalRun.fields.returns_reserve_pct
        distinguishing_aspect: |
          Six declared defaults land from three different mechanisms in one chain: two literal
          numeric defaults (30 / 180), a literal 0, a literal 0.2000, a null default that means
          "open-ended", and one INHERITED default that is copied from the parent Distributor
          (0.2000) rather than from a constant.
        test_recipe:
          setup:
            - "nothing pre-exists; every optional token below is omitted from its payload"
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 100000, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345679148", title: "Defaults", planned_release_date: "2026-02-01", formats: ["VINYL"] }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /physical-runs"
              payload: { release_id: "${rel1_id}", distributor_id: "${dist_id}", units_planned: 1000, unit_manufacturing_cost_cents: 250, window_start: "2026-04-01", window_end: "2026-06-30" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "the distributor response has default_returns_reserve_pct == 0.2000 and active_deal_count == 0"
            - "the deal response has objection_window_days == 30 and post_term_collection_days == 180"
            - "the release response has advance_share_cents == 0"
            - "the rate-card response has effective_to == null, which the §1.4 overlap rule reads as an open-ended upper edge"
            - "the physical-run response has returns_reserve_pct == 0.2000, INHERITED from Distributor.default_returns_reserve_pct rather than from a hard-coded constant"
            - "the physical-run response also has status == \"PLANNED\", reserve_status == \"HELD\", units_manufactured == 0, units_shipped == 0 and units_returned == 0"

      - name: computed_and_system_fields_are_server_owned_on_creation
        claim_type: computed_fields
        grounds:
          - entities.DistributionDeal.fields.status
          - entities.DistributionDeal.fields.recoupment_status
          - entities.Distributor.fields.active_deal_count
          - entities.Artist.fields.lifetime_paid_cents
          - entities.MarketingSpend.fields.recoupability
          - entities.ArtistAgreement.fields.active_royalty_rate_pct
        distinguishing_aspect: |
          Every `source: computed` / `source: system` field is present and server-derived on the
          creation response even though §1.5's `input:` list gives the client no way to supply it
          — including MarketingSpend.recoupability, which is a FUNCTION of the submitted category
          (PUBLICITY => NON_RECOUPABLE) rather than a constant default.
        test_recipe:
          setup:
            - "one Distributor, one Artist, one DRAFT deal and one PLANNED release"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 100000, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345679155", title: "Server Owned", planned_release_date: "2026-02-01", formats: ["DIGITAL"] }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
          trigger:
            - call: "POST /marketing-spends"
              payload: { release_id: "${rel1_id}", category: "PUBLICITY", amount_cents: 25000, vendor: "Northlight Media" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /marketing-spends"
              payload: { release_id: "${rel1_id}", category: "VIDEO_PRODUCTION", amount_cents: 25000, vendor: "Northlight Media" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /artist-agreements"
              payload: { artist_id: "${artist_id}", release_id: "${rel1_id}", royalty_rate_pct: 0.1200, escalated_royalty_rate_pct: 0.1800, advance_amount_cents: 30000, recording_costs_cents: 20000, recording_recoupable_pct: 0.5000, marketing_recoup_share_pct: 0.5000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /distributors/${dist_id}"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "GET /artists/${artist_id}"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "the PUBLICITY spend comes back with recoupability == \"NON_RECOUPABLE\", status == \"DRAFT\", requested_by_user_id == null, decided_by_user_id == null, approved_at == null, settled_amount_cents == null"
            - "the VIDEO_PRODUCTION spend comes back with recoupability == \"HALF_RECOUPABLE\" — the same endpoint derives a different value from the same-shaped payload"
            - "the agreement comes back with status == \"DRAFT\", active_royalty_rate_pct == null, unrecouped_artist_advance_cents == 0 and unrecouped_recording_cents == 0: activation, not creation, seeds the ledgers"
            - "GET /distributors/${dist_id} reports active_deal_count == 0 because the only deal is DRAFT, which is outside {EXECUTED, TERMINATION_NOTICE, POST_TERM_COLLECTION}"
            - "GET /artists/${artist_id} reports lifetime_paid_cents == 0 and unrecouped_advance_total_cents == 0 because the agreement is still DRAFT"
            - "the deal response's status == \"DRAFT\" and recoupment_status == \"UNRECOUPED\" were never supplied by the client: §1.5's input list contains neither token"

      - name: type_and_range_constraints_rejected_on_input
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.DistributionDeal.fields.distribution_fee_pct
          - entities.Release.fields.upc
          - entities.Release.fields.formats
          - entities.StreamRateCard.fields.tier
          - entities.MarketingSpend.fields.amount_cents
        distinguishing_aspect: |
          Six distinct schema shapes all funnel to the same 400 ERR_INVALID_REQUEST: a
          percentage above its declared ceiling, a percentage with two decimals instead of four,
          a mis-ordered date pair, an out-of-length upc, an empty array, and an unknown enum
          member. Falsified if any of them is silently coerced or answered with 422.
        test_recipe:
          setup:
            - "one Distributor, one Artist and one DRAFT deal exist"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345679223", title: "Constraint Probe", planned_release_date: "2026-02-01", formats: ["DIGITAL"] }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
          trigger:
            - call: "POST /distribution-deals"
