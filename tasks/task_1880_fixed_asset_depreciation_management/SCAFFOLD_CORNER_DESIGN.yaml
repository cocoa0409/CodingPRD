  - section: errors
    instances:
      - name: error_period_gap_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PERIOD_GAP]"
        excluded_because:
          difficulty_instance: depreciation_run_period_slot_rules
          rationale: "ERR_PERIOD_GAP / ERR_DUPLICATE_RUN_PERIOD / ERR_PERIOD_ALREADY_POSTED are all triggered there."

      - name: error_impairment_review_open_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_IMPAIRMENT_REVIEW_OPEN]"
        excluded_because:
          difficulty_instance: impairment_review_open_window_exclusivity
          rationale: "Second-create-while-OPEN is asserted there."

      - name: error_below_threshold_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BELOW_CAPITALIZATION_THRESHOLD]"
        excluded_because:
          difficulty_instance: capitalize_at_exact_threshold_succeeds
          rationale: "The 249999-below case fires ERR_BELOW_CAPITALIZATION_THRESHOLD there; the component variant fires it in component_below_threshold_rejected."

