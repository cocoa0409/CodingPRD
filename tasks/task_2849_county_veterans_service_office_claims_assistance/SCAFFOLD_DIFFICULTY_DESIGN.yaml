              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "1985-01-01", claimed_service_end: "1989-12-31", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "HOLD_DISCREPANCY", reason: "Service dates contradict the NPRC extract." }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/discharge-documents/${doc}/resubmit"
              payload: { claimed_service_start: "2001-09-11", claimed_service_end: "2001-12-09", claimed_character_of_service: "HONORABLE" }
