              as: Archivist
              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "AV-VAULT", temperature_c: 11.0, relative_humidity_pct: 34.0, max_overlapping_migration_jobs: 2 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "Learning and Development", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 10 }
              as: Archivist
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "TRAIN-TAPE-1", unit_count: 10, condition_grade: "GOOD", original_format: "MAGNETIC_TAPE", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "L&D transfer with tape inventory", transfer_instrument_reference: "IT-2026-061" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
            - call: "POST /preservation-plans"
              payload: { storage_zone_id: "${zone_id}", plan_name: "Training Film Digitisation", budget_cents: 100000 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { plan_id: $.data.id }
            - call: "POST /preservation-plans/${plan_id}/activate"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-a"
            - call: "POST /migration-jobs"
              payload: { preservation_plan_id: "${plan_id}", archival_item_id: "${item_id}", target_format: "PRESERVATION_MKV", units: 10, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-20T00:00:00Z" }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { job_id: $.data.id }
            - call: "POST /migration-jobs/${job_id}/approve"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-b"
            - call: "POST /migration-jobs/${job_id}/start"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-b"
          trigger:
            - call: "POST /migration-jobs/${job_id}/complete"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-b"
          assert:
            - "MigrationJob.${job_id}.status == COMPLETED"
            - "MigrationJob.${job_id}.committed_cost_cents == 46000"
            - "ArchivalItem.${item_id}.status == ACCESSIONED"
            - "ArchivalItem.${item_id}.preservation_format == PRESERVATION_MKV"
            - "ArchivalItem.${item_id}.digital_surrogate_available == true"
            - "PreservationPlan.${plan_id}.at_risk_unit_count == 0"
            - "PreservationPlan.${plan_id}.status == SATISFIED"
            - "PreservationPlan.${plan_id}.budget_committed_cents == 0"
            - "PreservationPlan.${plan_id}.budget_spent_cents == 46000"

      - name: deaccession_approval_three_hop_description_staleness_cascade
        grounds:
          - state_machines.DeaccessionProposal.DUALLY_CLEARED_to_APPROVED
          - state_machines.ArchivalItem.ACCESSIONED_to_PENDING_DISPOSITION
          - state_machines.FindingAid.PUBLISHED_to_NEEDS_REVISION
          - state_machines.AccessRequest.APPROVED_to_REVALIDATION_REQUIRED
          - entities.DeaccessionProposal.fields.stale_finding_aid_count
          - entities.DeaccessionProposal.fields.revalidated_request_count
        distinguishing_aspect: |
          Depth 3, triggered by deaccession approval, and it runs the description chain
          rather than the hold chain: the item goes PENDING_DISPOSITION (hop 1); because
          the accession now contains a stale item every PUBLISHED FindingAid on it drops
          to NEEDS_REVISION (hop 2); because that aid is no longer published every
          APPROVED AccessRequest citing it drops to REVALIDATION_REQUIRED (hop 3). The
          affected request asks for a DIFFERENT item than the one being deaccessioned,
          so the only route to it is through the finding aid. Both counters must be
          exactly 1, and the deaccessioned item is not the requested item.
        test_recipe:
          setup:
            - "One Accession processed into two ACCESSIONED ArchivalItems: item-A (unit_count 2, INTERNAL) and item-B (unit_count 4, PUBLIC)."
            - "A PUBLISHED FindingAid on that accession with described_item_count 2 and stale_item_count 0."
            - "An AccessRequest by an INTERNAL_BUSINESS Requester citing that finding aid and requesting ONLY item-A; screened GRANT_FULL and approved at FULL scope, so post_screen_risk_score is 10 + 15 = 25 and service_fee_cents is 0 + 2500 = 2500."
            - "A DeaccessionProposal on item-B, route DESTRUCTION, units 4, cleared by both LegalCounsel and ArchivesDirector so it sits in DUALLY_CLEARED."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "STALE-01", retention_years: 9, disposition_action: "DESTROY", legal_citation: "Collections Policy 7.4", min_appraisal_score_for_permanent: 68.00 }
