# =============================================================================
# Scaffold: Streaming Bundle Entitlement, Cross-Service Billing & Retention
# Domain: Disney+/Hulu-style duo bundle — one biller, entitlements provisioned
# across two services, standalone→bundle migration with proration and
# grandfathered pricing, account linking with per-service profiles, tier
# mismatch handling, third-party biller constraints, interdependent
# cancellation, retention offers, per-service revenue allocation.
# =============================================================================

scenario: |
  Streaming Bundle Entitlement, Cross-Service Billing & Retention (Disney+ and
  Hulu bundle): bundle purchase through one biller with entitlement provisioning
  across separate services, subscriber migration from standalone plans into a
  bundle with proration and grandfathered pricing, account linking where two
  services keep distinct profiles, watchlists and parental controls, tier
  combinations across ad-supported and ad-free with mismatch handling,
  third-party billing through app stores and distributors that constrain upgrade
  paths, cancellation flows where cancelling one component determines the fate
  of the other, retention offers with discount duration and eligibility limits,
  revenue allocation between services for reporting.

domain_name: streaming-bundle-entitlement
api_prefix: /streaming

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  entity_count: 12
  state_machine_count: 9
  calculation_count: 9
  validation_layers: 8
  endpoint_count: 46
  error_code_count: 30
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: false
    fields:
      - { name: plan_code, type: string, source: input, description: "Unique plan code, e.g. DPLUS_ADS, DPLUS_PREMIUM, HULU_ADS, HULU_PREMIUM, DUO_ADS, DUO_PREMIUM" }
      - { name: plan_kind, type: enum, source: input, description: "STANDALONE | BUNDLE" }
      - { name: service_scope, type: array, source: input, description: "Services covered: subset of [DPLUS, HULU]; BUNDLE plans MUST list both" }
      - { name: ad_tier, type: enum, source: input, description: "AD_SUPPORTED | AD_FREE; tier of the plan as a whole" }
      - { name: monthly_price_cents, type: integer, source: input, description: "Standard monthly list price in cents" }
      - { name: component_weights, type: object, source: input, description: "BUNDLE only: revenue allocation weights per service, e.g. {DPLUS: 0.45, HULU: 0.55}; weights MUST sum to exactly 1.0; null for STANDALONE" }
      - { name: allow_app_store_billing, type: boolean, source: input, description: "Whether this plan may be sold through APP_STORE billers" }
      - { name: allow_distributor_billing, type: boolean, source: input, description: "Whether this plan may be sold through DISTRIBUTOR billers" }
      - { name: is_legacy, type: boolean, source: input, description: "Legacy plans cannot be newly purchased but grandfathered subscribers keep them", default: false }

  - name: SubscriberAccount
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Subscriber login email; unique across all SubscriberAccounts" }
      - { name: full_name, type: string, source: input, description: "Subscriber display name" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED; starts ACTIVE" }
      - { name: grandfathered_price_cents, type: integer, source: system, description: "Locked-in monthly price from original subscription start; null until first ACTIVE subscription; never re-locked once set unless account has zero surviving subscriptions" }
      - { name: grandfathered_plan_code, type: string, source: system, description: "Plan code whose price is locked in grandfathered_price_cents" }
      - { name: retention_redemption_count, type: integer, source: computed, description: "Lifetime count of RetentionRedemptions in ACTIVE or EXPIRED (not VOIDED) status; drives eligibility limits" }
      - { name: account_credit_cents, type: integer, source: computed, description: "Credit balance from migration proration over-credit; never negative; applied to next invoices" }

  - name: ServiceProfile
    parent: SubscriberAccount
    common_fields: true
    fields:
      - { name: subscriber_account_id, type: string, source: system, description: "FK -> SubscriberAccount.id; owning subscriber" }
      - { name: service, type: enum, source: input, description: "DPLUS | HULU; one profile per (account, service) pair, unique" }
      - { name: profile_status, type: enum, source: system, description: "LINKED | SUSPENDED | UNLINKED; starts LINKED" }
      - { name: maturity_rating_cap, type: enum, source: input, description: "Parental control ceiling: TV_Y | TV_G | TV_PG | TV_14 | TV_MA", default: TV_MA }
      - { name: kids_mode, type: boolean, source: input, description: "Kids profile flag; when true, maturity_rating_cap is forced to TV_PG regardless of input", default: false }
      - { name: watchlist_count, type: integer, source: computed, description: "Denormalized count of WatchlistItem rows on this profile; maintained on add/remove" }

  - name: WatchlistItem
    parent: ServiceProfile
    common_fields: false
    fields:
      - { name: service_profile_id, type: string, source: system, description: "FK -> ServiceProfile.id; owning profile" }
      - { name: title_id, type: string, source: input, description: "Catalog title identifier; unique per profile" }
      - { name: title_maturity, type: enum, source: input, description: "TV_Y | TV_G | TV_PG | TV_14 | TV_MA; maturity of the title being added" }

  - name: BillingAccount
    parent: SubscriberAccount
    common_fields: true
    fields:
      - { name: subscriber_account_id, type: string, source: system, description: "FK -> SubscriberAccount.id; one BillingAccount per subscriber" }
      - { name: biller_type, type: enum, source: input, description: "PLATFORM | APP_STORE | DISTRIBUTOR; who collects money. Immutable after creation." }
      - { name: biller_reference, type: string, source: input, description: "External biller reference (store receipt id / distributor account id); 'platform' for PLATFORM" }
      - { name: billing_status, type: enum, source: system, description: "CURRENT | PAST_DUE | HARD_FAILED; starts CURRENT" }
      - { name: period_start, type: datetime, source: system, description: "Start of current billing period (ISO 8601); set at first invoice" }
      - { name: period_end, type: datetime, source: system, description: "End of current billing period; period is [period_start, period_end), exactly 30 days for PLATFORM, exactly 31 days for APP_STORE/DISTRIBUTOR" }
      - { name: consecutive_failure_count, type: integer, source: system, description: "Consecutive failed renewal attempts in current period; resets to 0 on success", default: 0 }

  - name: Subscription
    parent: SubscriberAccount
    common_fields: true
    fields:
      - { name: subscriber_account_id, type: string, source: system, description: "FK -> SubscriberAccount.id; owner" }
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id; biller that collects for this subscription" }
      - { name: plan_code, type: string, source: input, description: "FK -> Plan.plan_code; current plan" }
      - { name: lifecycle_status, type: enum, source: system, description: "PENDING_ENTITLEMENT | ACTIVE | PAST_DUE | CANCEL_SCHEDULED | CANCELLED | MIGRATED_OUT; independent of billing_status dimension" }
      - { name: billing_dimension, type: enum, source: system, description: "PAID_UP | GRACE | UNPAID; parallel state dimension tracking money, orthogonal to lifecycle_status" }
      - { name: price_cents, type: integer, source: computed, description: "Effective monthly price: grandfathered_price_cents when the subscriber's grandfathered_plan_code equals plan_code, else Plan.monthly_price_cents, minus any ACTIVE retention discount (see retention_effective_price)" }
      - { name: retention_discount_cents, type: integer, source: computed, description: "Monthly discount from the ACTIVE RetentionRedemption on this subscription; 0 when none" }
      - { name: migration_id, type: string, source: system, description: "FK -> Migration.id; set when this subscription was created by or consumed by a migration; null otherwise" }
      - { name: pending_plan_code, type: string, source: system, description: "Scheduled downgrade/upgrade plan code taking effect at next renewal; null when no pending change" }
      - { name: cancel_effective_at, type: datetime, source: system, description: "When lifecycle_status is CANCEL_SCHEDULED, the instant cancellation takes effect (== period_end); null otherwise" }

  - name: Entitlement
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; source subscription" }
      - { name: service_profile_id, type: string, source: system, description: "FK -> ServiceProfile.id; the per-service profile this entitlement grants access to" }
      - { name: service, type: enum, source: system, description: "DPLUS | HULU; must equal the ServiceProfile's service and be in the plan's service_scope" }
      - { name: entitlement_status, type: enum, source: system, description: "PROVISIONING | ACTIVE | SUSPENDED | REVOKED" }
      - { name: mismatch_flag, type: boolean, source: system, description: "True when the profile was linked with a tier mismatch that the subscriber has not yet resolved; a mismatched entitlement provisions ACTIVE but is flagged", default: false }

  - name: Migration
    parent: SubscriberAccount
    common_fields: true
    fields:
      - { name: subscriber_account_id, type: string, source: system, description: "FK -> SubscriberAccount.id" }
      - { name: from_subscription_id, type: string, source: system, description: "FK -> Subscription.id; standalone subscription consumed by this migration" }
      - { name: to_subscription_id, type: string, source: system, description: "FK -> Subscription.id; bundle subscription created by this migration; null until migration CONFIRMED" }
      - { name: target_plan_code, type: string, source: input, description: "FK -> Plan.plan_code; BUNDLE plan being migrated into" }
      - { name: migration_status, type: enum, source: system, description: "QUOTED | CONFIRMED | VOIDED" }
      - { name: proration_credit_cents, type: integer, source: computed, description: "Unused-portion credit computed by migration_proration at QUOTE time (chronological variant) and recomputed (forward_looking variant) at CONFIRM" }
      - { name: proration_method_used, type: enum, source: system, description: "CHRONOLOGICAL_REMAINING | FORWARD_LOOKING_PERIOD; which variant produced proration_credit_cents" }

  - name: RetentionOffer
    parent: null
    common_fields: false
    fields:
      - { name: offer_code, type: string, source: input, description: "Unique offer code" }
      - { name: discount_cents, type: integer, source: input, description: "Monthly discount in cents while the redemption is ACTIVE" }
      - { name: duration_months, type: integer, source: input, description: "Number of renewals the discount survives; must be >= 1" }
      - { name: max_redemptions_per_account, type: integer, source: input, description: "Lifetime cap per SubscriberAccount across ACTIVE+EXPIRED redemptions of THIS offer" }
      - { name: eligible_biller_types, type: array, source: input, description: "Biller types this offer may be applied to, subset of [PLATFORM, APP_STORE, DISTRIBUTOR]" }
      - { name: eligible_plan_kinds, type: array, source: input, description: "Plan kinds this offer may apply to, subset of [STANDALONE, BUNDLE]" }
      - { name: offer_status, type: enum, source: input, description: "OPEN | RETIRED; RETIRED offers reject new redemptions but do not affect existing ones", default: OPEN }

  - name: RetentionRedemption
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; subscription the discount is applied to" }
      - { name: subscriber_account_id, type: string, source: system, description: "FK -> SubscriberAccount.id; denormalized owner for eligibility counting" }
      - { name: offer_code, type: string, source: input, description: "FK -> RetentionOffer.offer_code" }
      - { name: redemption_status, type: enum, source: system, description: "ACTIVE | EXPIRED | VOIDED" }
      - { name: months_remaining, type: integer, source: computed, description: "Renewals left before auto-expiry; initialized to offer.duration_months; decremented on each successful renewal of the host subscription" }

  - name: Invoice
    parent: BillingAccount
    common_fields: true
    fields:
      - { name: billing_account_id, type: string, source: system, description: "FK -> BillingAccount.id" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; subscription billed (one invoice per subscription per period)" }
      - { name: invoice_status, type: enum, source: system, description: "ISSUED | PAID | FAILED | VOIDED" }
      - { name: invoice_kind, type: enum, source: system, description: "INITIAL | RENEWAL | MIGRATION_ADJUSTMENT" }
      - { name: gross_cents, type: integer, source: computed, description: "Subscription price_cents for the period before credits" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Account credit consumed on this invoice; min(account_credit_cents, gross_cents)" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - credit_applied_cents; amount actually collected" }
      - { name: period_start, type: datetime, source: system, description: "Billed period start" }
      - { name: period_end, type: datetime, source: system, description: "Billed period end (exclusive)" }

  - name: RevenueAllocation
    parent: Invoice
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: service, type: enum, source: system, description: "DPLUS | HULU; the service this allocation row credits" }
      - { name: allocated_cents, type: integer, source: computed, description: "Share of invoice net_cents credited to this service, per revenue_allocation rule (weighted split with pinned rounding); STANDALONE invoices have exactly one row equal to net_cents" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SubscriberAccount
    field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /streaming/subscriber-accounts/{id}/suspend"
        actor: "Support or PlatformAdmin"
        preconditions:
          - "account_status == ACTIVE"
        side_effects:
          - "Every Subscription of this account in ACTIVE or PAST_DUE lifecycle has all of its Entitlements moved ACTIVE -> SUSPENDED (cascade hop 1)"
          - "Each Entitlement suspension whose ServiceProfile then has zero ACTIVE entitlements moves that ServiceProfile LINKED -> SUSPENDED (cascade hop 2)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /streaming/subscriber-accounts/{id}/reactivate"
        actor: "Support or PlatformAdmin"
        preconditions:
          - "account_status == SUSPENDED"
          - "No Subscription of this account with lifecycle_status == PAST_DUE"
        side_effects:
          - "Every SUSPENDED Entitlement whose Subscription is in ACTIVE lifecycle moves SUSPENDED -> ACTIVE (cascade hop 1)"
          - "Each reactivated Entitlement moves its ServiceProfile SUSPENDED -> LINKED when the profile has no other blocking condition (cascade hop 2)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /streaming/subscriber-accounts/{id}/close"
        actor: "Subscriber (self), Support, or PlatformAdmin"
        preconditions:
          - "No Subscription in PENDING_ENTITLEMENT, ACTIVE, PAST_DUE, or CANCEL_SCHEDULED lifecycle (all must be CANCELLED or MIGRATED_OUT first)"
        side_effects:
          - "All ServiceProfiles of the account move LINKED or SUSPENDED -> UNLINKED"
          - "All OPEN RetentionRedemptions (status ACTIVE) on the account's subscriptions move ACTIVE -> VOIDED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /streaming/subscriber-accounts/{id}/close"
        actor: "Support or PlatformAdmin"
        preconditions:
          - "No Subscription in PENDING_ENTITLEMENT, ACTIVE, PAST_DUE, or CANCEL_SCHEDULED lifecycle"
        side_effects:
          - "All ServiceProfiles of the account move LINKED or SUSPENDED -> UNLINKED"
          - "All ACTIVE RetentionRedemptions on the account's subscriptions move ACTIVE -> VOIDED"

  - entity: ServiceProfile
    field: profile_status
    initial_state: LINKED
    terminal_states: [UNLINKED]
    transitions:
      - from: LINKED
        to: SUSPENDED
        trigger: "system (cascade: last ACTIVE Entitlement on this profile was revoked or suspended)"
        actor: system
        preconditions:
          - "Count of Entitlements on this profile in ACTIVE status == 0 after the triggering cascade hop"
        side_effects: []
        note: "Bubble-up compound transition; never directly invocable."
      - from: SUSPENDED
        to: LINKED
        trigger: "system (cascade: an Entitlement on this profile returned to ACTIVE)"
        actor: system
        preconditions:
          - "Count of Entitlements on this profile in ACTIVE status >= 1 after the triggering cascade hop"
        side_effects: []
      - from: LINKED
        to: UNLINKED
        trigger: "POST /streaming/service-profiles/{id}/unlink"
        actor: "Subscriber (owner), Support, or PlatformAdmin"
        preconditions:
          - "No Entitlement on this profile in PROVISIONING or ACTIVE status (SUSPENDED entitlements are revoked as a side effect)"
        side_effects:
          - "All SUSPENDED Entitlements on this profile move SUSPENDED -> REVOKED"
          - "WatchlistItems of this profile are retained (readable history) but the profile leaves all bundle/standalone access evaluation"
      - from: SUSPENDED
        to: UNLINKED
        trigger: "POST /streaming/service-profiles/{id}/unlink"
        actor: "Subscriber (owner), Support, or PlatformAdmin"
        preconditions:
          - "No Entitlement on this profile in PROVISIONING or ACTIVE status"
        side_effects:
          - "All SUSPENDED Entitlements on this profile move SUSPENDED -> REVOKED"

  - entity: BillingAccount
    field: billing_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system (POST /streaming/_billing/run_renewal with outcome FAILED)"
        actor: system
        preconditions:
          - "Renewal attempt for the current period failed"
        side_effects:
          - "consecutive_failure_count incremented by 1"
          - "The renewed Subscription's billing_dimension moves PAID_UP -> GRACE and lifecycle_status moves ACTIVE -> PAST_DUE (cascade hop 1)"
          - "All ACTIVE Entitlements of that Subscription move ACTIVE -> SUSPENDED (cascade hop 2)"
          - "Each ServiceProfile left with zero ACTIVE entitlements moves LINKED -> SUSPENDED (cascade hop 3)"
      - from: PAST_DUE
        to: CURRENT
        trigger: "system (POST /streaming/invoices/{id}/retry-payment succeeds, or POST /streaming/_billing/run_renewal with outcome SUCCEEDED)"
        actor: "Subscriber (owner), DistributorOps, Support, or system"
        preconditions:
          - "A FAILED invoice on this BillingAccount is paid, or a renewal retry succeeds"
        side_effects:
          - "consecutive_failure_count reset to 0"
          - "The Subscription's billing_dimension moves GRACE -> PAID_UP and lifecycle_status moves PAST_DUE -> ACTIVE (cascade hop 1)"
          - "All SUSPENDED Entitlements of that Subscription move SUSPENDED -> ACTIVE (cascade hop 2)"
          - "Each affected ServiceProfile moves SUSPENDED -> LINKED when it again has >= 1 ACTIVE entitlement (cascade hop 3)"
      - from: PAST_DUE
        to: HARD_FAILED
        trigger: "system (POST /streaming/_billing/run_renewal with outcome FAILED while consecutive_failure_count == MAX_RENEWAL_FAILURES - 1)"
        actor: system
        preconditions:
          - "consecutive_failure_count + 1 >= MAX_RENEWAL_FAILURES (3)"
        side_effects:
          - "consecutive_failure_count incremented by 1"
          - "The Subscription's lifecycle_status moves PAST_DUE -> CANCELLED with cancel_effective_at == null (immediate) and billing_dimension GRACE -> UNPAID (cascade hop 1)"
          - "All Entitlements of that Subscription in ACTIVE or SUSPENDED move -> REVOKED (cascade hop 2)"
          - "Each ServiceProfile left with zero ACTIVE entitlements moves LINKED -> SUSPENDED (cascade hop 3)"
          - "Any ACTIVE RetentionRedemption on the Subscription moves ACTIVE -> VOIDED (cascade hop 2, parallel branch)"

  - entity: Subscription
    field: lifecycle_status
    initial_state: PENDING_ENTITLEMENT
    terminal_states: [CANCELLED, MIGRATED_OUT]
    transitions:
      - from: PENDING_ENTITLEMENT
        to: ACTIVE
        trigger: "system (compound: every Entitlement spawned by this subscription has reached ACTIVE)"
        actor: system
        preconditions:
          - "Count of Entitlements of this Subscription in PROVISIONING == 0"
          - "Count of Entitlements of this Subscription in ACTIVE == |plan.service_scope|"
        side_effects:
          - "If the subscriber has grandfathered_price_cents == null, lock grandfathered_plan_code := plan_code and grandfathered_price_cents := Plan.monthly_price_cents (grandfathered_price_lock calculation)"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (renewal failure cascade from BillingAccount)"
        actor: system
        preconditions:
          - "BillingAccount renewal for this subscription failed"
        side_effects:
          - "billing_dimension moves PAID_UP -> GRACE (parallel dimension transition)"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "system (payment recovery: retry-payment success or renewal retry success)"
        actor: "Subscriber (owner), DistributorOps, Support, or system"
        preconditions:
          - "The FAILED invoice for the current period became PAID, or a retry renewal succeeded"
        side_effects:
          - "billing_dimension moves GRACE -> PAID_UP"
      - from: ACTIVE
        to: CANCEL_SCHEDULED
        trigger: "POST /streaming/subscriptions/{id}/cancel"
        actor: "Subscriber (owner), Support, or PlatformAdmin"
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "If BillingAccount.biller_type == APP_STORE or DISTRIBUTOR: allowed (the biller is notified) — but see validation: APP_STORE-billed subscriptions may not cancel with immediate_effect=true"
        side_effects:
          - "cancel_effective_at := BillingAccount.period_end when immediate_effect=false, else current logical clock time"
          - "Interdependent component rule: cancelling a BUNDLE subscription schedules ALL of its entitlements for revocation at cancel_effective_at; cancelling a STANDALONE subscription never touches any other subscription (no implicit bundle breakup)"
      - from: PAST_DUE
        to: CANCEL_SCHEDULED
        trigger: "POST /streaming/subscriptions/{id}/cancel"
        actor: "Subscriber (owner), Support, or PlatformAdmin"
        preconditions:
          - "lifecycle_status == PAST_DUE"
          - "immediate_effect must be false (a past-due subscription cancels only at period end)"
        side_effects:
          - "cancel_effective_at := BillingAccount.period_end"
      - from: CANCEL_SCHEDULED
        to: ACTIVE
        trigger: "POST /streaming/subscriptions/{id}/rescind-cancellation"
        actor: "Subscriber (owner), Support, or PlatformAdmin"
        preconditions:
          - "Current logical clock time < cancel_effective_at"
          - "billing_dimension != UNPAID"
        side_effects:
          - "cancel_effective_at := null"
      - from: CANCEL_SCHEDULED
        to: CANCELLED
        trigger: "system (logical clock reaches cancel_effective_at) or POST /streaming/subscriptions/{id}/cancel with immediate_effect=true already at period end"
        actor: system
        preconditions:
          - "Current logical clock time >= cancel_effective_at"
        side_effects:
          - "All Entitlements of this Subscription in ACTIVE or SUSPENDED move -> REVOKED (cascade hop 1)"
          - "Each ServiceProfile left with zero ACTIVE entitlements moves LINKED -> SUSPENDED (cascade hop 2)"
          - "Any ACTIVE RetentionRedemption on this Subscription moves ACTIVE -> VOIDED (cascade hop 1, parallel branch)"
          - "billing_dimension moves -> UNPAID"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "system (HARD_FAILED cascade from BillingAccount)"
        actor: system
        preconditions:
          - "BillingAccount reached HARD_FAILED for this subscription's period"
        side_effects:
          - "billing_dimension moves GRACE -> UNPAID"
      - from: ACTIVE
        to: MIGRATED_OUT
        trigger: "system (POST /streaming/migrations/{id}/confirm on a Migration whose from_subscription_id == this subscription)"
        actor: "Subscriber (owner), Support, or PlatformAdmin"
        preconditions:
          - "A QUOTED Migration references this subscription and is being confirmed"
        side_effects:
          - "All Entitlements of this Subscription move ACTIVE -> REVOKED (cascade hop 1)"
          - "The new bundle Subscription is created in PENDING_ENTITLEMENT with entitlements spawned per target plan scope (cascade hop 1, parallel branch)"
          - "proration credit is posted to SubscriberAccount.account_credit_cents (ledger sync)"

  - entity: Subscription
    field: billing_dimension
    initial_state: PAID_UP
    terminal_states: [UNPAID]
    transitions:
      - from: PAID_UP
        to: GRACE
        trigger: "system (renewal failure)"
        actor: system
        preconditions:
          - "lifecycle_status == ACTIVE"
        side_effects: []
        note: "Parallel dimension — see lifecycle_status machine for coupled transitions."
      - from: GRACE
        to: PAID_UP
        trigger: "system (payment recovered)"
        actor: "Subscriber (owner), DistributorOps, Support, or system"
        preconditions:
          - "Current logical clock time < period_end + GRACE_DAYS (7) — recovery inside the grace window restores PAID_UP"
        side_effects: []
      - from: GRACE
        to: UNPAID
        trigger: "system (HARD_FAILED or cancellation finalized)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Entitlement
    field: entitlement_status
    initial_state: PROVISIONING
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONING
        to: ACTIVE
        trigger: "system (synchronous provisioning at subscription creation / migration confirm)"
        actor: system
        preconditions:
          - "ServiceProfile.profile_status == LINKED"
          - "Entitlement.service is in the subscription plan's service_scope"
        side_effects:
          - "Bubble-up: when all sibling entitlements of the Subscription are ACTIVE, Subscription moves PENDING_ENTITLEMENT -> ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (account suspension or renewal-failure cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Bubble-up: if this was the last ACTIVE entitlement on its ServiceProfile, profile moves LINKED -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (account reactivation or payment recovery cascade)"
        actor: system
        preconditions:
          - "Hosting Subscription lifecycle_status == ACTIVE or PAST_DUE-recovering"
          - "ServiceProfile.profile_status != UNLINKED"
        side_effects:
          - "Bubble-up: ServiceProfile moves SUSPENDED -> LINKED when applicable"
      - from: ACTIVE
        to: REVOKED
        trigger: "system (cancellation finalized, migration confirmed, HARD_FAILED, or profile unlink)"
        actor: system
        preconditions: []
        side_effects:
          - "Bubble-up: ServiceProfile moves LINKED -> SUSPENDED when zero ACTIVE entitlements remain"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (cancellation finalized, migration confirmed, HARD_FAILED, or profile unlink)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Migration
    field: migration_status
    initial_state: QUOTED
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /streaming/migrations/{id}/confirm"
        actor: "Subscriber (owner), Support, or PlatformAdmin"
        preconditions:
          - "from-subscription lifecycle_status == ACTIVE"
          - "Current logical clock time < from-subscription BillingAccount.period_end (quote valid only inside the quoted period — closed interval at period_end: confirming exactly at period_end is rejected)"
          - "target plan is a BUNDLE plan and BillingAccount.biller_type permits it (plan.allow_app_store_billing for APP_STORE, plan.allow_distributor_billing for DISTRIBUTOR)"
          - "expected_migration_version == Migration.version (OCC)"
        side_effects:
          - "Recompute proration with the FORWARD_LOOKING_PERIOD variant; proration_credit_cents and proration_method_used updated (dual-variant reconciliation — the QUOTED value used CHRONOLOGICAL_REMAINING)"
          - "from-subscription moves ACTIVE -> MIGRATED_OUT; its entitlements REVOKED (cascade hop 1)"
          - "New bundle Subscription created (PENDING_ENTITLEMENT) with entitlements spawned and synchronously provisioned ACTIVE (cascade hop 2), which bubbles the new Subscription to ACTIVE (cascade hop 3)"
          - "proration_credit_cents posted to SubscriberAccount.account_credit_cents (ledger sync)"
          - "A MIGRATION_ADJUSTMENT Invoice of gross_cents = 0 and credit_applied_cents = 0 is issued as the audit anchor"
          - "Migration.version incremented by 1"
      - from: QUOTED
        to: VOIDED
        trigger: "POST /streaming/migrations/{id}/void or system (from-subscription left ACTIVE before confirm)"
        actor: "Subscriber (owner), Support, PlatformAdmin, or system"
        preconditions: []
        side_effects:
          - "No ledger movement; QUOTED proration is discarded"

  - entity: RetentionRedemption
    field: redemption_status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (successful renewal decrements months_remaining to exactly 0)"
        actor: system
        preconditions:
          - "months_remaining == 0 after decrement"
        side_effects:
          - "Host Subscription.retention_discount_cents recomputed to 0 and price_cents recomputed (retention_effective_price)"
      - from: ACTIVE
        to: VOIDED
        trigger: "system (host subscription CANCELLED or MIGRATED_OUT, or account CLOSED, or HARD_FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "Host Subscription.retention_discount_cents recomputed to 0 and price_cents recomputed"
        note: "VOIDED redemptions do NOT count toward RetentionOffer.max_redemptions_per_account; EXPIRED ones do."

  - entity: Invoice
    field: invoice_status
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "system (successful initial charge or renewal collection)"
        actor: system
        preconditions: []
        side_effects:
          - "RevenueAllocation rows created for the invoice per revenue_allocation calculation (one row per service in scope)"
          - "BillingAccount period advanced (period_start := period_end; period_end += 30 days PLATFORM / 31 days APP_STORE/DISTRIBUTOR) for RENEWAL invoices"
          - "Host RetentionRedemption months_remaining decremented by 1 for RENEWAL invoices (may trigger EXPIRED)"
      - from: ISSUED
        to: FAILED
        trigger: "system (collection failed)"
        actor: system
        preconditions: []
        side_effects:
          - "BillingAccount CURRENT -> PAST_DUE cascade (see BillingAccount machine)"
      - from: FAILED
        to: PAID
        trigger: "POST /streaming/invoices/{id}/retry-payment"
        actor: "Subscriber (owner), DistributorOps, Support, or PlatformAdmin"
        preconditions:
          - "invoice_status == FAILED"
          - "Current logical clock time < BillingAccount.period_end + GRACE_DAYS (7)"
          - "BillingAccount.billing_status != HARD_FAILED"
        side_effects:
          - "BillingAccount PAST_DUE -> CURRENT recovery cascade (see BillingAccount machine)"
          - "RevenueAllocation rows created for the invoice"
      - from: ISSUED
        to: VOIDED
        trigger: "system (superseded by migration adjustment or subscription cancelled before period start)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-change-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /streaming/subscriptions/{id}/plan-change"
    occ_field: "expected_subscription_version"
    description: |
      A plan change against a Subscription whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just applied a retention redemption, scheduled a cancellation,
      or completed a plan change (each legitimately mutating the subscription)
      and the current writer's view of the subscription is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: migration-confirm-stale-migration
    parent_entity: Migration
    write_endpoint: "POST /streaming/migrations/{id}/confirm"
    occ_field: "expected_migration_version"
    description: |
      Confirming a Migration whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      already re-quoted or voided the migration and the confirming writer's
      view of the migration is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: migration_proration
    trigger: "Migration quote (POST /streaming/migrations) and re-evaluated at Migration confirm (POST /streaming/migrations/{id}/confirm)"
    algorithm: forward_looking
    formula: |
      # Two valid variants of "unused portion credit" for the from-subscription.
      # Both use day-granularity against the logical clock; periods are
      # half-open [period_start, period_end).
      days_total = (period_end - period_start).days            # 30 PLATFORM, 31 APP_STORE/DISTRIBUTOR
      monthly = effective_monthly_price(from_subscription)     # grandfathered price if locked, else plan list price
      Variant CHRONOLOGICAL_REMAINING (used at QUOTE time):
        days_elapsed = (now - period_start).days               # floor to whole days
        days_remaining = days_total - days_elapsed
        credit = floor(monthly * days_remaining / days_total)  # integer cents, round DOWN per line
      Variant FORWARD_LOOKING_PERIOD (used at CONFIRM time):
        # Re-derives from the confirm instant AND subtracts any credit already
        # consumed by intervening invoices (ISSUED or PAID) since the quote.
        days_elapsed = (now - period_start).days
        days_remaining = days_total - days_elapsed
        base = floor(monthly * days_remaining / days_total)
        consumed = sum(invoice.credit_applied_cents for invoices of this
                       subscription with period_start >= quote_created_at)
        credit = max(0, base - consumed)
    input_set: "from-subscription's BillingAccount period fields, plan/grandfathered price, logical clock; for the CONFIRM variant additionally all invoices of the from-subscription issued since the Migration row's created_at"
    constants:
      PLATFORM_PERIOD_DAYS: 30
      THIRD_PARTY_PERIOD_DAYS: 31
    precision: "integer cents; floor on the per-day proration"
    variants:
      - name: CHRONOLOGICAL_REMAINING
        when: "Migration creation (quote)"
        difference: "Snapshot at quote instant; ignores later invoice activity; proration_method_used recorded as CHRONOLOGICAL_REMAINING"
      - name: FORWARD_LOOKING_PERIOD
        when: "Migration confirm"
        difference: "Re-derives at confirm instant and subtracts credit already consumed by intervening invoices; produces a DIFFERENT (<=) value than the quote whenever the clock advanced or a renewal consumed credit; proration_method_used recorded as FORWARD_LOOKING_PERIOD"

  - name: retention_effective_price
    trigger: "RetentionRedemption creation (POST /streaming/subscriptions/{id}/retention-redemptions), redemption EXPIRED/VOIDED, grandfathered lock change, or plan-change"
    algorithm: threshold
    formula: |
      # Combinatorial, mode (a): >=3 inputs with non-linear interaction.
      base = (SubscriberAccount.grandfathered_price_cents
              if SubscriberAccount.grandfathered_plan_code == Subscription.plan_code
              and SubscriberAccount.grandfathered_price_cents is not null
              else Plan.monthly_price_cents)
      active = sum(r.discount_cents_for_offer for r in RetentionRedemption
                   where r.subscription_id == this.id and r.redemption_status == ACTIVE)
      # Stacking cap: total discount may not exceed MAX_DISCOUNT_PCT of base.
      capped_discount = min(active, floor(base * MAX_DISCOUNT_PCT / 100))
      price_cents = base - capped_discount
      retention_discount_cents = capped_discount
      # Floor rule: price_cents may not fall below MIN_PRICE_CENTS.
      if price_cents < MIN_PRICE_CENTS:
          retention_discount_cents = base - MIN_PRICE_CENTS
          price_cents = MIN_PRICE_CENTS
    input_set: "Subscription.plan_code, owning SubscriberAccount grandfathered fields, Plan.monthly_price_cents, ACTIVE RetentionRedemptions of the subscription joined to their RetentionOffer.discount_cents"
    constants:
      MAX_DISCOUNT_PCT: 60
      MIN_PRICE_CENTS: 100
    precision: "integer cents; floor on the percentage cap"
    variants: []

  - name: grandfathered_price_lock
    trigger: "First time a SubscriberAccount's subscription reaches ACTIVE (bubble-up from entitlement provisioning)"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency, evaluation order pinned (mode c):
      #   Subscription.price_cents depends on grandfathered_price_cents,
      #   but grandfathered_price_cents is locked FROM the plan list price
      #   at the moment the first subscription activates.
      # Pinned order: (1) lock reads Plan.monthly_price_cents of the
      # activating subscription's plan; (2) the lock is written; (3) only
      # then is price_cents recomputed by retention_effective_price.
      if SubscriberAccount.grandfathered_price_cents is null:
          SubscriberAccount.grandfathered_plan_code = Subscription.plan_code
          SubscriberAccount.grandfathered_price_cents = Plan.monthly_price_cents
      # The lock is never re-derived while any subscription of the account is
      # in PENDING_ENTITLEMENT, ACTIVE, PAST_DUE, or CANCEL_SCHEDULED.
      # When all subscriptions are terminal (CANCELLED or MIGRATED_OUT), a
      # subsequent new subscription reaching ACTIVE re-locks at its plan's
      # CURRENT list price.
    input_set: "activating Subscription, its Plan, owning SubscriberAccount"
    constants: {}
    precision: "integer cents"
    variants:
      - name: relock_after_full_churn
        when: "All prior subscriptions terminal before the new one activates"
        difference: "The lock is refreshed to the new plan's current list price instead of preserving the stale lock"

  - name: revenue_allocation
    trigger: "Invoice transitions ISSUED -> PAID or FAILED -> PAID"
    algorithm: waterfall_allocation
    formula: |
      # Weighted split with pinned rounding order (mode b):
      #   allocate per-service FIRST (round half-up per row), and force the
      #   LAST row (HULU when both services present) to absorb the remainder
      #   so the rows always sum exactly to net_cents.
      # "Sum then round" would produce different cents; the scaffold pins
      # per-row rounding with remainder absorption.
      if plan is STANDALONE:
          single row: allocated_cents = invoice.net_cents
      else:
          dplus_raw = net_cents * weight[DPLUS]
          dplus = round_half_up(dplus_raw)          # integer cents
          hulu  = net_cents - dplus                 # remainder absorbed by LAST row
          rows = [(DPLUS, dplus), (HULU, hulu)]
      # Tie/ordering determinism: services processed in the fixed order
      # [DPLUS, HULU]; HULU always absorbs the remainder.
    input_set: "Invoice.net_cents, Plan.component_weights of the billed subscription's plan"
    constants: {}
    precision: "integer cents; round_half_up on the non-remainder row(s)"
    variants: []

  - name: watchlist_maturity_gate
    trigger: "POST /streaming/service-profiles/{id}/watchlist-items"
    algorithm: threshold
    formula: |
      # Boundary-precision gate: a title may be added iff
      #   rank(title_maturity) <= rank(effective_cap)
      # where effective_cap = TV_PG when kids_mode is true (forced, ignoring
      # the stored maturity_rating_cap), else maturity_rating_cap.
      # Rank order: TV_Y=0 < TV_G=1 < TV_PG=2 < TV_14=3 < TV_MA=4.
      # Boundary: title_maturity EXACTLY equal to the cap is ALLOWED (<=).
      rank = {TV_Y: 0, TV_G: 1, TV_PG: 2, TV_14: 3, TV_MA: 4}
      effective_cap = TV_PG if profile.kids_mode else profile.maturity_rating_cap
      allowed = rank[title_maturity] <= rank[effective_cap]
    input_set: "ServiceProfile.kids_mode, ServiceProfile.maturity_rating_cap, input title_maturity"
    constants:
      RANK_TV_Y: 0
      RANK_TV_G: 1
      RANK_TV_PG: 2
      RANK_TV_14: 3
      RANK_TV_MA: 4
    precision: "exact integer rank comparison"
    variants: []

  - name: tier_mismatch_resolution
    trigger: "Account linking (POST /streaming/subscriber-accounts/{id}/service-profiles) when the account already holds subscriptions whose plan ad_tier differs across the linked services, and re-evaluated on plan-change"
    algorithm: constraint_propagation
    formula: |
      # When two ServiceProfiles (DPLUS and HULU) are LINKED on one account
      # and the entitlements they carry derive from subscriptions whose plan
      # ad_tier disagree (one AD_SUPPORTED, one AD_FREE — possible after a
      # migration that upgrades only the bundle while a legacy standalone
      # survives, or vice versa), the system flags every entitlement of the
      # LOWER tier service: mismatch_flag = true.
      # A mismatched entitlement still provisions ACTIVE (soft mismatch), but
      # plan-change to a tier that restores agreement clears mismatch_flag on
      # all entitlements of that profile.
      # If BOTH subscriptions are bundles of the same plan, no mismatch can
      # exist by construction (one plan, one tier).
    input_set: "all ACTIVE Entitlements of the account joined to their Subscription.plan_code -> Plan.ad_tier"
    constants: {}
    precision: "n/a (boolean derivation)"
    variants: []

  - name: bundle_breakup_fate
    trigger: "Cancellation finalize or migration confirm on a subscription"
    algorithm: constraint_propagation
    formula: |
      # Interdependent cancellation: the fate of each entitlement is derived
      # from WHICH subscription is cancelled.
      # Rule 1: cancelling (finalizing) a BUNDLE subscription revokes ALL of
      #   its entitlements at cancel_effective_at — both services die together.
      # Rule 2: cancelling a STANDALONE subscription revokes only its own
      #   single-service entitlement; any bundle subscription on the same
      #   account is untouched.
      # Rule 3: when an account holds BOTH a bundle and a standalone of the
      #   same service (allowed for legacy accounts), the ServiceProfile
      #   stays LINKED as long as >= 1 ACTIVE entitlement of that service
      #   remains, from ANY source subscription.
    input_set: "cancelling/finalizing Subscription, all entitlements grouped by service, sibling subscriptions of the same account"
    constants: {}
    precision: "n/a (set derivation)"
    variants: []

  - name: renewal_collection
    trigger: "POST /streaming/_billing/run_renewal (test-driving endpoint advancing the billing cycle) for a BillingAccount whose period_end <= logical clock"
    algorithm: chronological
    formula: |
      # Process subscriptions of the BillingAccount in chronological order of
      # Subscription.created_at ASC (tie-break: created_at then nothing else —
      # created_at is the only permitted fallback). For each due subscription:
      #   gross = retention_effective_price(subscription)
      #   credit_applied = min(account_credit_cents, gross)
      #   net = gross - credit_applied
      #   account_credit_cents -= credit_applied
      #   invoice issued (INITIAL for first period else RENEWAL)
      # outcome SUCCEEDED: invoice -> PAID; period advanced by
      #   PLATFORM_PERIOD_DAYS (30) for PLATFORM, THIRD_PARTY_PERIOD_DAYS (31)
      #   for APP_STORE/DISTRIBUTOR; retention months_remaining decremented.
      # outcome FAILED: invoice -> FAILED; BillingAccount PAST_DUE cascade.
      # Boundary: period_end <= now means due (closed interval at period_end).
    input_set: "all Subscriptions of the BillingAccount in lifecycle ACTIVE (billing_dimension PAID_UP) whose BillingAccount.period_end <= now"
    constants:
      PLATFORM_PERIOD_DAYS: 30
      THIRD_PARTY_PERIOD_DAYS: 31
      GRACE_DAYS: 7
      MAX_RENEWAL_FAILURES: 3
    precision: "integer cents"
    variants: []

  - name: retention_eligibility
    trigger: "POST /streaming/subscriptions/{id}/retention-redemptions"
    algorithm: threshold
    formula: |
      # Eligibility conjunction (all must hold):
      #   1. offer.offer_status == OPEN
      #   2. subscription lifecycle_status == ACTIVE (not PAST_DUE, not CANCEL_SCHEDULED)
      #   3. billing_account.biller_type in offer.eligible_biller_types
      #   4. plan.plan_kind in offer.eligible_plan_kinds
      #   5. count(RetentionRedemption of this offer for this account in
      #      {ACTIVE, EXPIRED}) < offer.max_redemptions_per_account
      #      (VOIDED redemptions do NOT count — boundary: count == max - 1
      #      succeeds, count == max fails)
      #   6. No other RetentionRedemption on THIS subscription is ACTIVE
    input_set: "RetentionOffer, Subscription, BillingAccount, Plan, account-wide RetentionRedemptions filtered by offer_code and status in {ACTIVE, EXPIRED}"
    constants: {}
    precision: "exact integer comparison"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For Subscriber role: X-User-ID must equal the id of the SubscriberAccount that owns the addressed resource (ownership check)"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "all subscriber-scoped endpoints"

  - priority: 4
    category: existence
    check: "Path-template resources exist, validated left-to-right (account before profile before watchlist-item; subscription before redemption)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Referenced plan_code / offer_code / foreign keys in the request body exist"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "creation and action endpoints taking plan_code, offer_code, profile ids"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the operation (per §1.2 from-states); e.g. cancel requires ACTIVE or PAST_DUE, rescind requires CANCEL_SCHEDULED, retry requires FAILED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "SubscriberAccount.account_status == ACTIVE for any new subscription, migration quote, retention redemption, or service-profile creation"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /streaming/subscriptions, POST /streaming/migrations, POST /streaming/subscriptions/{id}/retention-redemptions, POST /streaming/subscriber-accounts/{id}/service-profiles"

  - priority: 8
    category: business_safety
    check: "Parental-control gate: watchlist_maturity_gate allows the add (title_maturity rank <= effective cap rank, boundary inclusive)"
    error_id: ERR_MATURITY_RATING_EXCEEDED
    http_status: 422
    applies_to: "POST /streaming/service-profiles/{id}/watchlist-items"

  - priority: 9
    category: business_constraint
    check: "ServiceProfile uniqueness: at most one profile per (subscriber_account_id, service) with profile_status != UNLINKED"
    error_id: ERR_DUPLICATE_PROFILE
    http_status: 409
    applies_to: "POST /streaming/subscriber-accounts/{id}/service-profiles"

  - priority: 10
    category: business_constraint
    check: "WatchlistItem uniqueness: title_id unique per ServiceProfile"
    error_id: ERR_DUPLICATE_WATCHLIST_ITEM
    http_status: 409
    applies_to: "POST /streaming/service-profiles/{id}/watchlist-items"

  - priority: 11
    category: business_constraint
    check: "BUNDLE plan must have service_scope == [DPLUS, HULU] (both services, any order) and component_weights summing to exactly 1.0 (within 1e-9); STANDALONE plan must have exactly one service in scope"
    error_id: ERR_INVALID_PLAN_SHAPE
    http_status: 422
    applies_to: "POST /streaming/plans"

  - priority: 12
    category: business_temporal
    check: "Migration confirm must occur strictly before the from-subscription's period_end (now < period_end; confirming at exactly period_end is rejected)"
    error_id: ERR_MIGRATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /streaming/migrations/{id}/confirm"

  - priority: 13
    category: business_temporal
    check: "Rescind-cancellation is only reachable while the subscription is CANCEL_SCHEDULED; because the clock-set finalize converts CANCEL_SCHEDULED -> CANCELLED at cancel_effective_at, a late rescind is rejected by the state check (priority 6) with ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /streaming/subscriptions/{id}/rescind-cancellation"

  - priority: 14
    category: business_temporal
    check: "Invoice retry-payment within grace: now < period_end + GRACE_DAYS (7); boundary: at exactly period_end + 7 days, retry is rejected"
    error_id: ERR_GRACE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /streaming/invoices/{id}/retry-payment"

  - priority: 15
    category: business_constraint
    check: "Third-party billing constraints: for BillingAccount.biller_type == APP_STORE, target plan.allow_app_store_billing must be true; for DISTRIBUTOR, target plan.allow_distributor_billing must be true. Applies to subscription creation, plan-change, and migration into the plan"
    error_id: ERR_BILLER_PLAN_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /streaming/subscriptions, POST /streaming/subscriptions/{id}/plan-change, POST /streaming/migrations"

  - priority: 16
    category: business_constraint
    check: "Third-party upgrade constraint: APP_STORE-billed subscriptions may only plan-change between plans of the SAME plan_kind (STANDALONE->STANDALONE or BUNDLE->BUNDLE); cross-kind upgrades must go through a Migration (PLATFORM) or are impossible for APP_STORE"
    error_id: ERR_BILLER_UPGRADE_PATH_BLOCKED
    http_status: 422
    applies_to: "POST /streaming/subscriptions/{id}/plan-change"

  - priority: 17
    category: business_constraint
    check: "APP_STORE-billed subscriptions may not be cancelled with immediate_effect=true (store controls refund timing); only period-end cancellation is permitted"
    error_id: ERR_IMMEDIATE_CANCEL_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /streaming/subscriptions/{id}/cancel"

  - priority: 18
    category: business_constraint
    check: "Migration source must be a STANDALONE plan subscription and target a BUNDLE plan; migrating a BUNDLE subscription or into a STANDALONE plan is rejected"
    error_id: ERR_MIGRATION_SHAPE
    http_status: 422
    applies_to: "POST /streaming/migrations"

  - priority: 19
    category: business_constraint
    check: "Retention eligibility per retention_eligibility calculation (all six clauses)"
    error_id: ERR_RETENTION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /streaming/subscriptions/{id}/retention-redemptions"

  - priority: 20
    category: business_fiscal
    check: "Plan monthly_price_cents must be >= MIN_PRICE_CENTS (100); RetentionOffer.discount_cents must be >= 1 and duration_months >= 1"
    error_id: ERR_INVALID_PRICING
    http_status: 422
    applies_to: "POST /streaming/plans, POST /streaming/retention-offers"

  - priority: 21
    category: business_referential
    check: "Account close requires no non-terminal subscriptions (see SubscriberAccount machine preconditions)"
    error_id: ERR_ACTIVE_SUBSCRIPTIONS_REMAIN
    http_status: 409
    applies_to: "POST /streaming/subscriber-accounts/{id}/close"

  - priority: 22
    category: business_referential
    check: "Profile unlink requires no PROVISIONING or ACTIVE entitlements on the profile"
    error_id: ERR_PROFILE_HAS_ACTIVE_ENTITLEMENTS
    http_status: 409
    applies_to: "POST /streaming/service-profiles/{id}/unlink"

  - priority: 23
    category: business_constraint
    check: "Required input fields present and well-typed (email format, enum membership, integer cents, ISO 8601 datetimes)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 24
    category: state
    check: "OCC: expected_subscription_version / expected_migration_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /streaming/subscriptions/{id}/plan-change, POST /streaming/migrations/{id}/confirm"
    note: "Checked after existence and state preconditions, before any side effect executes."

  - priority: 25
    category: business_constraint
    check: "Subscription uniqueness gate: an account may hold at most one subscription in a non-terminal lifecycle per plan_code"
    error_id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION
    http_status: 409
    applies_to: "POST /streaming/subscriptions"

  - priority: 26
    category: business_fiscal
    check: "Bundle plan price must be strictly less than the sum of its implied component standalone prices is NOT enforced; instead: monthly_price_cents of a BUNDLE plan must be > 0 and component weights each in (0, 1)"
    error_id: ERR_INVALID_PLAN_SHAPE
    http_status: 422
    applies_to: "POST /streaming/plans"

  - priority: 27
    category: state
    check: "Mutating operations on resources owned by a CLOSED SubscriberAccount are rejected (reads still allowed)"
    error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "all subscriber-scoped mutating endpoints"

  - priority: 28
    category: business_constraint
    check: "SubscriberAccount email is globally unique across all accounts"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /streaming/subscriber-accounts"

  - priority: 29
    category: business_constraint
    check: "Plan with is_legacy=true may not be newly purchased (existing grandfathered subscribers keep it; plan-change TO a legacy plan is also rejected unless the subscriber's grandfathered_plan_code equals that plan_code)"
    error_id: ERR_PLAN_LEGACY_ONLY
    http_status: 422
    applies_to: "POST /streaming/subscriptions, POST /streaming/subscriptions/{id}/plan-change"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/streaming/_clock/set_current_utc"
    description: "Advance the logical clock. Server startup default time is 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to real wall-clock time. The clock is monotonic: setting it backwards is rejected."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["system transitions gated on the logical clock fire: CANCEL_SCHEDULED -> CANCELLED when now >= cancel_effective_at"]

  # --- plans (config) ---
  - method: POST
    path: "/streaming/plans"
    description: "Create a plan (standalone or bundle)"
    roles: [PlatformAdmin]
    code: 201
    input:
      - plan_code
      - plan_kind
      - service_scope
      - ad_tier
      - monthly_price_cents
      - component_weights?
      - allow_app_store_billing
      - allow_distributor_billing
      - is_legacy?
    output: Plan
    side_effects: []
  - method: GET
    path: "/streaming/plans"
    description: "List plans with pagination"
    roles: [PlatformAdmin, Support, DistributorOps, Subscriber]
    code: 200
    input:
      - plan_kind?
      - is_legacy?
      - limit?
      - offset?
    output: Plan[]
    side_effects: []
  - method: GET
    path: "/streaming/plans/{id}"
    description: "Get one plan by plan_code (id path segment is the plan_code)"
    roles: [PlatformAdmin, Support, DistributorOps, Subscriber]
    code: 200
    input: []
    output: Plan
    side_effects: []

  # --- subscriber accounts ---
  - method: POST
    path: "/streaming/subscriber-accounts"
    description: "Register a subscriber account"
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: SubscriberAccount
    side_effects: []
  - method: GET
    path: "/streaming/subscriber-accounts/{id}"
    description: "Get a subscriber account"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input: []
    output: SubscriberAccount
    side_effects: []
  - method: GET
    path: "/streaming/subscriber-accounts"
    description: "List subscriber accounts (admin/support)"
    roles: [Support, PlatformAdmin]
    code: 200
    input:
      - account_status?
      - limit?
      - offset?
    output: SubscriberAccount[]
    side_effects: []
  - method: POST
    path: "/streaming/subscriber-accounts/{id}/suspend"
    description: "Suspend an account (cascades to entitlements and profiles)"
    roles: [Support, PlatformAdmin]
    code: 200
    input: []
    output: SubscriberAccount
    side_effects: ["SubscriberAccount ACTIVE -> SUSPENDED cascade (see §1.2)"]
  - method: POST
    path: "/streaming/subscriber-accounts/{id}/reactivate"
    description: "Reactivate a suspended account"
    roles: [Support, PlatformAdmin]
    code: 200
    input: []
    output: SubscriberAccount
    side_effects: ["SubscriberAccount SUSPENDED -> ACTIVE cascade (see §1.2)"]
  - method: POST
    path: "/streaming/subscriber-accounts/{id}/close"
    description: "Close an account; requires all subscriptions terminal"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input: []
    output: SubscriberAccount
    side_effects: ["SubscriberAccount -> CLOSED cascade (see §1.2)"]

  # --- service profiles (account linking) ---
  - method: POST
    path: "/streaming/subscriber-accounts/{id}/service-profiles"
    description: "Link a service profile (one per service per account); triggers tier_mismatch_resolution"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 201
    input:
      - service
      - maturity_rating_cap?
      - kids_mode?
    output: ServiceProfile
    side_effects: ["kids_mode=true forces maturity_rating_cap := TV_PG", "tier_mismatch_resolution re-evaluated"]
  - method: GET
    path: "/streaming/subscriber-accounts/{id}/service-profiles"
    description: "List an account's service profiles"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input:
      - service?
      - profile_status?
      - limit?
      - offset?
    output: ServiceProfile[]
    side_effects: []
  - method: GET
    path: "/streaming/service-profiles/{id}"
    description: "Get one service profile"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input: []
    output: ServiceProfile
    side_effects: []
  - method: POST
    path: "/streaming/service-profiles/{id}/unlink"
    description: "Unlink a service profile (requires no PROVISIONING/ACTIVE entitlements)"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input: []
    output: ServiceProfile
    side_effects: ["ServiceProfile -> UNLINKED; SUSPENDED entitlements revoked"]
  - method: PATCH
    path: "/streaming/service-profiles/{id}"
    description: "Update parental controls (maturity_rating_cap, kids_mode); kids_mode=true forces cap to TV_PG"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input:
      - maturity_rating_cap?
      - kids_mode?
    output: ServiceProfile
    side_effects: ["kids_mode=true forces maturity_rating_cap := TV_PG"]

  # --- watchlist ---
  - method: POST
    path: "/streaming/service-profiles/{id}/watchlist-items"
    description: "Add a title to a profile's watchlist; maturity gate enforced"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 201
    input: [title_id, title_maturity]
    output: WatchlistItem
    side_effects: ["ServiceProfile.watchlist_count incremented by 1"]
  - method: GET
    path: "/streaming/service-profiles/{id}/watchlist-items"
    description: "List a profile's watchlist"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input:
      - title_maturity?
      - limit?
      - offset?
    output: WatchlistItem[]
    side_effects: []
  - method: DELETE
    path: "/streaming/service-profiles/{id}/watchlist-items/{item_id}"
    description: "Remove a watchlist item"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 204
    input: []
    output: null
    side_effects: ["ServiceProfile.watchlist_count decremented by 1"]

  # --- billing accounts ---
  - method: POST
    path: "/streaming/subscriber-accounts/{id}/billing-accounts"
    description: "Create the account's billing relationship (exactly one per subscriber); biller_type immutable"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 201
    input: [biller_type, biller_reference]
    output: BillingAccount
    side_effects: []
  - method: GET
    path: "/streaming/subscriber-accounts/{id}/billing-accounts"
    description: "List the account's billing accounts (0 or 1 element)"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - billing_status?
      - limit?
      - offset?
    output: BillingAccount[]
    side_effects: []
  - method: GET
    path: "/streaming/billing-accounts/{id}"
    description: "Get one billing account"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: []
    output: BillingAccount
    side_effects: []

  # --- subscriptions ---
  - method: POST
    path: "/streaming/subscriptions"
    description: "Purchase a subscription through a billing account; spawns entitlements per plan service_scope, provisions them synchronously, issues the INITIAL invoice, and (when all entitlements provision) activates the subscription"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 201
    input:
      - subscriber_account_id
      - billing_account_id
      - plan_code
      - dplus_service_profile_id?
      - hulu_service_profile_id?
    output: Subscription
    side_effects:
      - "Entitlements created (one per service in plan.service_scope) and provisioned PROVISIONING -> ACTIVE"
      - "Subscription bubbles PENDING_ENTITLEMENT -> ACTIVE when all entitlements ACTIVE"
      - "grandfathered_price_lock runs on first activation"
      - "INITIAL Invoice issued and immediately PAID (collection simulated inline); RevenueAllocation rows created"
      - "BillingAccount period initialized: period_start := now, period_end := now + 30 days (PLATFORM) or 31 days (APP_STORE/DISTRIBUTOR)"
  - method: GET
    path: "/streaming/subscriptions/{id}"
    description: "Get one subscription"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/streaming/subscriptions"
    description: "List subscriptions with filters"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - subscriber_account_id?
      - billing_account_id?
      - plan_code?
      - lifecycle_status?
      - migration_id?
      - limit?
      - offset?
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/streaming/subscriptions/{id}/plan-change"
    description: "Change plan (OCC on Subscription.version). Same-kind only for APP_STORE billers; grandfathered price reapplies iff new plan_code == grandfathered_plan_code"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: [new_plan_code, expected_subscription_version]
    output: Subscription
    side_effects:
      - "increments Subscription.version by 1"
      - "price_cents recomputed via retention_effective_price"
      - "Entitlements reconciled to new plan service_scope: missing services spawn new ACTIVE entitlements; services no longer in scope have entitlements REVOKED"
      - "tier_mismatch_resolution re-evaluated"
  - method: POST
    path: "/streaming/subscriptions/{id}/cancel"
    description: "Cancel a subscription; period-end by default, immediate optionally (not for APP_STORE)"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - immediate_effect?
    output: Subscription
    side_effects: ["lifecycle ACTIVE/PAST_DUE -> CANCEL_SCHEDULED (or finalize path per §1.2)", "interdependent component rule per bundle_breakup_fate"]
  - method: POST
    path: "/streaming/subscriptions/{id}/rescind-cancellation"
    description: "Rescind a scheduled cancellation before cancel_effective_at"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: []
    output: Subscription
    side_effects: ["cancel_effective_at := null; lifecycle CANCEL_SCHEDULED -> ACTIVE"]

  # --- entitlements ---
  - method: GET
    path: "/streaming/subscriptions/{id}/entitlements"
    description: "List entitlements of a subscription"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - service?
      - entitlement_status?
      - limit?
      - offset?
    output: Entitlement[]
    side_effects: []
  - method: GET
    path: "/streaming/service-profiles/{id}/entitlements"
    description: "List entitlements granted to a profile (from any subscription)"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - entitlement_status?
      - limit?
      - offset?
    output: Entitlement[]
    side_effects: []
  - method: GET
    path: "/streaming/entitlements/{id}"
    description: "Get one entitlement"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: []
    output: Entitlement
    side_effects: []

  # --- migrations ---
  - method: POST
    path: "/streaming/migrations"
    description: "Quote a standalone->bundle migration; computes CHRONOLOGICAL_REMAINING proration"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 201
    input: [from_subscription_id, target_plan_code]
    output: Migration
    side_effects: ["migration_proration CHRONOLOGICAL_REMAINING variant computed and stored"]
  - method: GET
    path: "/streaming/migrations/{id}"
    description: "Get one migration"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: []
    output: Migration
    side_effects: []
  - method: GET
    path: "/streaming/migrations"
    description: "List migrations with filters"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - subscriber_account_id?
      - from_subscription_id?
      - to_subscription_id?
      - migration_status?
      - limit?
      - offset?
    output: Migration[]
    side_effects: []
  - method: POST
    path: "/streaming/migrations/{id}/confirm"
    description: "Confirm a quoted migration (OCC on Migration.version); recomputes proration via FORWARD_LOOKING_PERIOD"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: [expected_migration_version]
    output: Migration
    side_effects: ["increments Migration.version by 1", "Migration QUOTED -> CONFIRMED cascade (see §1.2)"]
  - method: POST
    path: "/streaming/migrations/{id}/void"
    description: "Void a quoted migration"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: []
    output: Migration
    side_effects: ["Migration QUOTED -> VOIDED"]

  # --- retention ---
  - method: POST
    path: "/streaming/retention-offers"
    description: "Create a retention offer"
    roles: [PlatformAdmin]
    code: 201
    input:
      - offer_code
      - discount_cents
      - duration_months
      - max_redemptions_per_account
      - eligible_biller_types
      - eligible_plan_kinds
      - offer_status?
    output: RetentionOffer
    side_effects: []
  - method: GET
    path: "/streaming/retention-offers"
    description: "List retention offers"
    roles: [PlatformAdmin, Support]
    code: 200
    input:
      - offer_status?
      - limit?
      - offset?
    output: RetentionOffer[]
    side_effects: []
  - method: GET
    path: "/streaming/retention-offers/{id}"
    description: "Get one offer by offer_code (id path segment is the offer_code)"
    roles: [PlatformAdmin, Support]
    code: 200
    input: []
    output: RetentionOffer
    side_effects: []
  - method: POST
    path: "/streaming/subscriptions/{id}/retention-redemptions"
    description: "Apply a retention offer to a subscription; eligibility per retention_eligibility"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 201
    input: [offer_code]
    output: RetentionRedemption
    side_effects: ["months_remaining := offer.duration_months", "Subscription.retention_discount_cents and price_cents recomputed (retention_effective_price)"]
  - method: GET
    path: "/streaming/subscriptions/{id}/retention-redemptions"
    description: "List redemptions of a subscription"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input:
      - redemption_status?
      - limit?
      - offset?
    output: RetentionRedemption[]
    side_effects: []
  - method: GET
    path: "/streaming/subscriber-accounts/{id}/retention-redemptions"
    description: "List redemptions across all of an account's subscriptions"
    roles: [Subscriber, Support, PlatformAdmin]
    code: 200
    input:
      - redemption_status?
      - offer_code?
      - limit?
      - offset?
    output: RetentionRedemption[]
    side_effects: []
  - method: GET
    path: "/streaming/subscriptions/{id}/invoices"
    description: "List invoices billed for one subscription"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - invoice_status?
      - invoice_kind?
      - limit?
      - offset?
    output: Invoice[]
    side_effects: []

  # --- invoices & revenue ---
  - method: GET
    path: "/streaming/billing-accounts/{id}/invoices"
    description: "List invoices of a billing account"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - invoice_status?
      - invoice_kind?
      - limit?
      - offset?
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/streaming/invoices/{id}"
    description: "Get one invoice"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/streaming/invoices/{id}/revenue-allocations"
    description: "List revenue allocation rows of an invoice"
    roles: [Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - service?
      - limit?
      - offset?
    output: RevenueAllocation[]
    side_effects: []
  - method: POST
    path: "/streaming/invoices/{id}/retry-payment"
    description: "Retry a FAILED invoice within the grace window"
    roles: [Subscriber, Support, PlatformAdmin, DistributorOps]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice FAILED -> PAID recovery cascade (see §1.2 BillingAccount)"]
  - method: GET
    path: "/streaming/revenue-report"
    description: "Aggregate revenue allocation per service over a closed window [from_iso8601, to_iso8601); only PAID invoices contribute"
    roles: [Support, PlatformAdmin, DistributorOps]
    code: 200
    input:
      - from_iso8601
      - to_iso8601
      - service?
    output: { total_cents: integer, per_service: object, invoice_count: integer }
    side_effects: []

  # --- billing run (test-driving) ---
  - method: POST
    path: "/streaming/_billing/run_renewal"
    description: "Test-driving endpoint: run the renewal collection for one BillingAccount whose period is due (period_end <= now), with a forced outcome; drives renewal_collection calculation and all failure/recovery cascades"
    roles: [PlatformAdmin]
    code: 200
    input: [billing_account_id, outcome]
    output: { invoice_id: string, invoice_status: string, billing_status: string }
    side_effects: ["renewal_collection calculation; BillingAccount and Subscription cascades per §1.2"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint per §1.5 roles" }
  - { id: ERR_FORBIDDEN_NOT_OWNER, http: 403, condition: "Subscriber role acting on a resource owned by a different SubscriberAccount" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template resource id does not exist (checked left-to-right)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-referenced plan_code, offer_code, profile id, subscription id, or billing account id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed type, bad enum value, or malformed ISO 8601" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state does not permit the operation (e.g. cancel of a CANCELLED subscription, retry of a PAID invoice, confirm of a VOIDED migration)" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "SubscriberAccount not ACTIVE for operations requiring an active account" }
  - { id: ERR_ACCOUNT_CLOSED, http: 409, condition: "Any operation on a CLOSED account's resources other than reads" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch on expected_subscription_version or expected_migration_version" }
  - { id: ERR_DUPLICATE_PROFILE, http: 409, condition: "A non-UNLINKED ServiceProfile already exists for (account, service)" }
  - { id: ERR_DUPLICATE_WATCHLIST_ITEM, http: 409, condition: "title_id already present on the profile's watchlist" }
  - { id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION, http: 409, condition: "Account already holds a non-terminal subscription for the same plan_code" }
  - { id: ERR_DUPLICATE_BILLING_ACCOUNT, http: 409, condition: "Subscriber already has a BillingAccount" }
  - { id: ERR_MATURITY_RATING_EXCEEDED, http: 422, condition: "title_maturity rank exceeds the profile's effective parental-control cap" }
  - { id: ERR_INVALID_PLAN_SHAPE, http: 422, condition: "BUNDLE plan missing a service, bad weights (not summing to 1.0), non-positive price, or STANDALONE plan with multi-service scope" }
  - { id: ERR_INVALID_PRICING, http: 422, condition: "monthly_price_cents < 100, discount_cents < 1, or duration_months < 1" }
  - { id: ERR_BILLER_PLAN_NOT_ALLOWED, http: 422, condition: "Plan not sellable through this biller_type (allow_app_store_billing / allow_distributor_billing false)" }
  - { id: ERR_BILLER_UPGRADE_PATH_BLOCKED, http: 422, condition: "APP_STORE-billed subscription attempting a cross-kind plan change (STANDALONE<->BUNDLE)" }
  - { id: ERR_IMMEDIATE_CANCEL_NOT_ALLOWED, http: 422, condition: "immediate_effect=true requested for an APP_STORE-billed subscription" }
  - { id: ERR_MIGRATION_SHAPE, http: 422, condition: "Migration source is not a STANDALONE-plan subscription or target is not a BUNDLE plan" }
  - { id: ERR_MIGRATION_WINDOW_CLOSED, http: 422, condition: "Confirm attempted at or after the from-subscription's period_end" }
  - { id: ERR_MIGRATION_SOURCE_NOT_ACTIVE, http: 409, condition: "From-subscription lifecycle_status != ACTIVE at quote time (confirm-time staleness surfaces as ERR_INVALID_STATE)" }
  - { id: ERR_RETENTION_NOT_ELIGIBLE, http: 422, condition: "Any retention_eligibility clause fails (offer RETIRED, wrong biller, wrong plan kind, cap reached, subscription not ACTIVE, existing ACTIVE redemption)" }
  - { id: ERR_GRACE_WINDOW_CLOSED, http: 422, condition: "retry-payment attempted at or after period_end + GRACE_DAYS" }
  - { id: ERR_ACTIVE_SUBSCRIPTIONS_REMAIN, http: 409, condition: "Account close attempted while non-terminal subscriptions exist" }
  - { id: ERR_PROFILE_HAS_ACTIVE_ENTITLEMENTS, http: 409, condition: "Unlink attempted on a profile with PROVISIONING or ACTIVE entitlements" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc to a timestamp earlier than the current logical clock" }
  - { id: ERR_RENEWAL_NOT_DUE, http: 422, condition: "run_renewal for a BillingAccount whose period_end > now" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Registration with an email already held by another SubscriberAccount" }
  - { id: ERR_PLAN_LEGACY_ONLY, http: 422, condition: "New purchase or plan-change into an is_legacy plan by a non-grandfathered subscriber" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registration only"
    identity: "opaque"
    exclusive_operations: ["POST /streaming/subscriber-accounts"]
    shared_operations: []
  - name: Subscriber
    description: "The end customer; X-User-ID equals their SubscriberAccount id"
    identity: "entity_backed:SubscriberAccount"
    exclusive_operations: []
    shared_operations:
      - "Read own account/profiles/subscriptions/invoices/entitlements/redemptions"
      - "Create billing account, subscriptions, migrations, redemptions, watchlist items on own account"
      - "Cancel/rescind/plan-change own subscriptions; retry own failed invoices; confirm/void own migrations"
      - "Close own account; unlink own profiles; update own parental controls"
  - name: Support
    description: "Customer-service operator; can act on any account except creating offers/plans and driving clock/renewals"
    identity: "opaque"
    exclusive_operations: ["POST /streaming/subscriber-accounts/{id}/suspend", "POST /streaming/subscriber-accounts/{id}/reactivate"]
    shared_operations:
      - "All Subscriber shared operations on any account"
      - "List accounts; read revenue report"
  - name: DistributorOps
    description: "Third-party distributor operator managing distributor-billed subscriptions; cannot create plans/offers or drive the clock"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "Create billing accounts and subscriptions (distributor channel)"
      - "Plan-change, cancel, retry-payment on subscriptions"
      - "Read subscriptions, invoices, revenue report"
  - name: PlatformAdmin
    description: "Full operator; superset of all roles"
    identity: "opaque"
    exclusive_operations:
      - "POST /streaming/plans"
      - "POST /streaming/retention-offers"
      - "POST /streaming/_clock/set_current_utc"
      - "POST /streaming/_billing/run_renewal"
    shared_operations: ["All Support and DistributorOps operations"]
