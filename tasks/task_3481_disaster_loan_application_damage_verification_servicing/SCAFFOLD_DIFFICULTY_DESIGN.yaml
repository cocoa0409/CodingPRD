  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_conserve_principal_stock
        grounds:
          - calculations.payment_allocation_calc
          - state_machines.Payment.POSTED_to_REVERSED
          - entities.Loan.fields.outstanding_balance_cents
        distinguishing_aspect: "Conserved quantity is the loan's principal stock (outstanding_balance_cents + total_principal_paid_cents): a 10000000-cent payment moves 71104 cents from outstanding into principal_paid (sum invariant 11250000 throughout), and the compensating reverse restores every touched field — outstanding 11250000, principal_paid 0, accrued interest 28896, last_accrual_date 2026-11-01."
        test_recipe:
          setup:
            - "Fixture A homeowner loan; T1 (2500000) and T2 (8750000) both released on 2026-11-01 (outstanding 11250000, accrued 0, last_accrual_date 2026-11-01, next_due 2027-12-01); clock advanced to 2026-12-01 (exactly 30 days of accrual)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }] }
