    instances:
      - name: luc_determination_supersedes_the_prior_active_row_for_the_same_variant
        claim_type: Action endpoint
        grounds:
          - state_machines.LucDetermination.ACTIVE_to_SUPERSEDED
          - endpoints[POST /political-ads/elections/{id}/luc-determinations]
          - entities.LucDetermination.fields.status
        distinguishing_aspect: "A second PROVISIONAL determination for the same election and rate class flips the first row to SUPERSEDED and leaves exactly one ACTIVE row, while the election's version advances from 1 to 2 to 3."
        test_recipe:
          setup: ["One station with a PRIMARY election on 2026-09-15 and one MORNING rate class at posted_rate_cents 12345, with no spots at all so both determinations fall back to 7407."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
