              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule_m: $.data.id }
            - call: "POST /placement-rules/${rule_m}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /sections"
              payload: { course_id: "${c_read}", term_code: "2026FA", room_code: "R770", meets_start_at: "2026-09-01T09:00:00Z", meets_end_at: "2026-09-01T10:00:00Z", seat_capacity: 5 }
              as: Registrar
