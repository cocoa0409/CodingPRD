        constraints: "one of {CANARY, EXPANDED, GENERAL}"
        default: null
      - name: results
        type: array
        source: system
        description: "Append-only per-vehicle rollout results: list of {vehicle_id: string, result: SUCCESS|FAILED, reported_at: datetime}; one entry per vehicle (duplicates rejected)"
        default: []
      - name: succeeded_count
        type: integer
        source: computed
