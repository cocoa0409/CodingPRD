              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${canc_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/bind"
              payload: {}
              as: UnderwritingAgent
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 65000 }
              as: Policyholder
              as_user_id: "ph-1"
            - call: "POST /policies/${policy_id}/activate-coverage"
              payload: {}
              as: UnderwritingAgent
          trigger:
            - call: "POST /policies/${policy_id}/cancel"
              payload: {}
              as: Policyholder
              as_user_id: "ph-999"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_POLICY_OWNER"
            - "http_status == 403"
            - "Policy.${policy_id}.lifecycle_status == IN_FORCE"

      - name: missing_user_context_header_rejected
        claim_type: Cannot perform other role exclusive op
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_USER_CONTEXT]
        distinguishing_aspect: "Creating a policy without X-User-Role/X-User-ID headers → ERR_MISSING_USER_CONTEXT (401)."
        test_recipe:
          setup: ["Empty DB; request sent with no user-context headers."]
          setup_api_calls: []
          trigger:
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_MISSING_USER_CONTEXT"
            - "http_status == 401"

