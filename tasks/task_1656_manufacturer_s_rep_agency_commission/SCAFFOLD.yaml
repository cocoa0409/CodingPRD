    side_effects: ["all prior rows replaced by OVERRIDE rows (role=OVERRIDE, is_override=true); per-line share_bp must sum to exactly 10000; only while commission_status == ATTRIBUTED (ERR_SPLITS_LOCKED once ACCRUED); Rep caller must currently hold a split row on the order; increments Order.version by 1"]

