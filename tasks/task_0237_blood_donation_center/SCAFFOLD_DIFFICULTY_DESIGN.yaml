            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${donor_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}" }
              as: IntakeNurse
              captures: { appt_id: $.data.id }
            - call: "POST /blood-bank/deferrals"
              payload: { donor_id: "${donor_id}", category: "MEDICATION", kind: "TEMPORARY", reason: "on antibiotics", duration_days: 14 }
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/appointments/${appt_id}/check-in"
              payload: {}
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DONOR_NOT_ELIGIBLE"
            - "Donor.${donor_id}.eligibility_status == TEMP_DEFERRED"
            - "Appointment.${appt_id}.status == SCHEDULED (transition rejected)"

      - name: donation_release_blocked_by_severe_adverse_reaction
        grounds:
          - state_machines.Donation.COLLECTED_to_RELEASABLE
          - validations[priority=9]
          - entities.AdverseReaction.fields.severity
          - errors[ERR_SEVERE_REACTION_BLOCKS_RELEASE]
        distinguishing_aspect: >
          Donation's COLLECTED->RELEASABLE transition depends on the
          AdverseReaction's severity (entity pair Donation->AdverseReaction): a
          SEVERE reaction blocks release even on a NEGATIVE panel. Different
          entity pair than appointment->donor.
        test_recipe:
          setup:
            - "A COLLECTED donation with a labeled unit has a SEVERE AdverseReaction logged. A NEGATIVE test result must be rejected."
          setup_api_calls:
