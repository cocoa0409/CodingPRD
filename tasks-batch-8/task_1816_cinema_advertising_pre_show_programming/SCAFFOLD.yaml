# =============================================================================
# Task 1816 — Cinema Advertising & Pre-Show Programming (National CineMedia style)
# Seed tables: §1.0–§1.7. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  1816. Cinema Advertising & Pre-Show Programming (National CineMedia style): screen
  inventory by theater/auditorium & attendance forecast, pre-show reel assembly &
  timing, advertiser category exclusivity, delivery to theaters & playback
  verification, attendance-based impression billing & audit, local vs national
  advertiser allocation, film rating-based placement rules, campaign reporting &
  make-good

domain_name: cinema-advertising-preshow
api_prefix: /network

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite reel seconds + national/local pools competed for
  secondary_archetype: compliance_audit      # playback verification, attendance audit, SoD-controlled billing
  complexity_layers:
    - optimistic_concurrency                 # OCC on PreShowReel.version and Invoice.version
    - cascading_side_effects                 # playlog/audit -> slot -> campaign aggregates
    - dual_variant_calculation               # forecast variants; provisional vs audited billing; STRICT/LENIENT make-good
    - rate_threshold_triggers                # make-good 5% under-delivery threshold; pool capacity breakpoints
  entity_topology: flat                      # peer entities joined by FK references, no nested ownership tree
  state_machine_shape: mixed                 # cyclic (Campaign, PreShowReel, AttendanceReport) + parallel (Invoice) + branching (ReelSlot, MakeGoodCredit)
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # ReelSlot joins Campaign aggregate and PreShowReel aggregate
  role_model: segregation_of_duties          # creator != approver; issuer != certifier; reporter != auditor; proposer != reviewer
  consistency_model: immediate               # every mutation + cascade visible in the same request's response
  entity_count: 12
  state_machine_count: 6
  calculation_count: 7
  validation_layers: 11
  endpoint_count: 50
  error_code_count: 35
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all parents null, FK fields below)
# =============================================================================
entities:
  - name: Theater
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Theater display name" }
      - { name: market_tier, type: enum, source: input, description: "MAJOR_METRO | REGIONAL | SMALL_MARKET — drives forecast occupancy constant" }
      - { name: theater_status, type: enum, source: system, description: "ACTIVE | DARK", default: ACTIVE }

  - name: Screen
    parent: null
    common_fields: true
    fields:
      - { name: theater_id, type: string, source: input, description: "FK -> Theater.id; owning theater" }
      - { name: auditorium_label, type: string, source: input, description: "Auditorium label, e.g. 'Auditorium 7'" }
      - { name: seat_count, type: integer, source: input, description: "Installed seats; forecast base", constraints: "> 0" }
      - { name: screen_status, type: enum, source: system, description: "ONLINE | OFFLINE", default: ONLINE }

  - name: Feature
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Film title" }
      - { name: content_rating, type: enum, source: input, description: "G | PG | PG13 | R | NC17 — drives rating-based placement rules and forecast demand factor" }
      - { name: runtime_minutes, type: integer, source: input, description: "Feature runtime; drives showtime overlap buffer window", constraints: "> 0" }
      - { name: release_date, type: string, source: input, description: "ISO date YYYY-MM-DD of theatrical release; opening-week window is [release_date, release_date+7d] inclusive" }

  - name: Showtime
    parent: null
    common_fields: true
    fields:
      - { name: screen_id, type: string, source: input, description: "FK -> Screen.id; auditorium airing the feature" }
      - { name: feature_id, type: string, source: input, description: "FK -> Feature.id; film shown" }
      - { name: starts_at, type: datetime, source: input, description: "UTC start of the feature presentation; pre-show reel airs in the window before it" }
      - { name: daypart, type: enum, source: computed, description: "MATINEE if starts_at UTC hour < 17 else EVENING" }
      - { name: forecast_attendance, type: integer, source: computed, description: "floor(seat_count x OCCUPANCY[market_tier] x DAYPART_FACTOR x RATING_DEMAND x opening_multiplier); see calculations.forecast_attendance" }
      - { name: actual_attendance, type: integer, source: computed, description: "From latest ACCEPTED AttendanceReport.reported_attendance, or AUDITED report's audited_attendance; null until any report is ACCEPTED/AUDITED", default: null }

  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Advertiser display name" }
      - { name: advertiser_type, type: enum, source: input, description: "NATIONAL | LOCAL — selects which reel seconds pool its slots draw from" }
      - { name: category, type: enum, source: input, description: "AUTOMOTIVE | QSR | RETAIL | ENTERTAINMENT | TECH | ALCOHOL | POLITICAL — drives category exclusivity and rating placement" }
      - { name: advertiser_status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_id, type: string, source: input, description: "FK -> Advertiser.id; buying advertiser" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: flight_start_date, type: string, source: input, description: "ISO date; slots may only air on showtimes with date >= flight_start_date" }
      - { name: flight_end_date, type: string, source: input, description: "ISO date; slots may only air on showtimes with date <= flight_end_date", constraints: ">= flight_start_date" }
      - { name: contracted_impressions, type: integer, source: input, description: "Contracted attendance-impression total for make-good measurement", constraints: "> 0" }
      - { name: cpm_cents, type: integer, source: input, description: "Rate in cents per 1000 impressions", constraints: "> 0" }
      - { name: budget_cents, type: integer, source: input, description: "Cap on reserved estimated spend from active slots", constraints: "> 0" }
      - { name: partial_credit_mode, type: enum, source: input, description: "STRICT (PARTIAL playback counts 0.5x attendance) | LENIENT (PARTIAL counts full attendance)", default: STRICT }
      - { name: campaign_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | COMPLETED | CANCELED", default: DRAFT }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; SoD: approver must differ" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver, null until approved", default: null }
      - { name: reserved_estimated_cents, type: integer, source: computed, description: "Sum of ReelSlot.estimated_cost_cents over this campaign's slots in RESERVED or CONFIRMED", default: 0 }
      - { name: delivered_impressions, type: integer, source: computed, description: "Sum of ReelSlot.attributed_impressions over this campaign's PLAYED slots (null contributions count as 0)", default: 0 }

  - name: PreShowReel
    parent: null
    common_fields: true
    fields:
      - { name: showtime_id, type: string, source: system, description: "FK -> Showtime.id; exactly one reel per showtime, auto-created ASSEMBLING with the showtime" }
      - { name: reel_status, type: enum, source: system, description: "ASSEMBLING | LOCKED | IN_TRANSIT | DELIVERY_FAILED | DELIVERED | RECONCILED", default: ASSEMBLING }
      - { name: capacity_seconds, type: integer, source: system, description: "Total pre-show timeline length", default: 1200 }
      - { name: national_pool_seconds, type: integer, source: system, description: "Seconds reservable by NATIONAL advertisers", default: 720 }
      - { name: local_pool_seconds, type: integer, source: system, description: "Seconds reservable by LOCAL advertisers", default: 480 }
      - { name: national_used_seconds, type: integer, source: computed, description: "Sum of duration_seconds of non-CANCELED slots whose campaign advertiser is NATIONAL", default: 0 }
      - { name: local_used_seconds, type: integer, source: computed, description: "Sum of duration_seconds of non-CANCELED slots whose campaign advertiser is LOCAL", default: 0 }

  - name: ReelSlot
    parent: null
    common_fields: true
    fields:
      - { name: reel_id, type: string, source: input, description: "FK -> PreShowReel.id; containing reel (path)" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign airing the creative" }
      - { name: start_offset_seconds, type: integer, source: input, description: "Half-open timeline start within the reel", constraints: ">= 0" }
      - { name: duration_seconds, type: integer, source: input, description: "Creative length; occupies [start_offset_seconds, start_offset_seconds+duration_seconds)", constraints: "> 0" }
      - { name: slot_status, type: enum, source: system, description: "RESERVED | CONFIRMED | PLAYED | MISSED | CANCELED", default: RESERVED }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Snapshot at creation: round_half_up(showtime.forecast_attendance x campaign.cpm_cents / 1000)" }
      - { name: play_factor, type: number, source: computed, description: "null until playback; VERIFIED -> 1.0; PARTIAL -> 0.5 (STRICT campaign) or 1.0 (LENIENT campaign); FAILED -> 0.0", default: null }
      - { name: attributed_impressions, type: integer, source: computed, description: "floor(showtime.actual_attendance x play_factor) when PLAYED and actual_attendance known; else null", default: null }

  - name: PlayLog
    parent: null
    common_fields: false   # append-only playback verification event: id + created_at only
    fields:
      - { name: slot_id, type: string, source: input, description: "FK -> ReelSlot.id; the slot this playback record verifies (path); at most one PlayLog per slot" }
      - { name: outcome, type: enum, source: input, description: "VERIFIED | PARTIAL | FAILED" }
      - { name: played_at, type: datetime, source: system, description: "Logical clock value at record time" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of recorder (TheaterOps)" }
      - { name: reported_by_theater_id, type: string, source: system, description: "Theater resolved from X-User-ID" }

  - name: AttendanceReport
    parent: null
    common_fields: true
    fields:
      - { name: showtime_id, type: string, source: input, description: "FK -> Showtime.id; showtime being reported (path)" }
      - { name: reported_attendance, type: integer, source: input, description: "Theater-reported attendance", constraints: ">= 0" }
      - { name: audited_attendance, type: integer, source: input, description: "Auditor-established attendance; set at audit, may revise reported value", constraints: ">= 0, null until AUDITED" }
      - { name: report_status, type: enum, source: system, description: "SUBMITTED | DISPUTED | ACCEPTED | AUDITED", default: SUBMITTED }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of reporter (TheaterOps user id == Theater.id); SoD: auditor must differ" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of NetworkOps reviewer, null until review", default: null }
      - { name: audited_by_user_id, type: string, source: system, description: "X-User-ID of Auditor, null until audit", default: null }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; billed campaign (path)" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; invoice covers slots on showtimes with date >= period_start_date" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; invoice covers slots on showtimes with date <= period_end_date", constraints: ">= period_start_date" }
      - { name: billing_status, type: enum, source: system, description: "DRAFT | ISSUED | SETTLED | VOID (parallel dimension 1)", default: DRAFT }
      - { name: audit_status, type: enum, source: system, description: "UNAUDITED | CERTIFIED (parallel dimension 2)", default: UNAUDITED }
      - { name: provisional_impressions, type: integer, source: computed, description: "Snapshot at creation: sum of showtime.forecast_attendance over this campaign's RESERVED/CONFIRMED/PLAYED slots on showtimes dated in period" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Snapshot at creation: per-line round_half_up(forecast x cpm_cents / 1000), then summed" }
      - { name: audited_impressions, type: integer, source: computed, description: "At certification: sum of ReelSlot.attributed_impressions over PLAYED slots in period", default: null }
      - { name: audited_amount_cents, type: integer, source: computed, description: "At certification: per-line round_half_up(attributed x cpm_cents / 1000), then summed", default: null }
      - { name: applied_credit_cents, type: integer, source: computed, description: "Sum of APPLIED MakeGoodCredit.credit_cents against this invoice", default: 0 }
      - { name: final_amount_cents, type: integer, source: computed, description: "audited_amount_cents - applied_credit_cents once CERTIFIED; null while UNAUDITED", default: null }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of issuer, null until issued; SoD: certifier must differ", default: null }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying Auditor, null until certified", default: null }

  - name: MakeGoodCredit
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; certified invoice the credit is posted against (path)" }
      - { name: shortfall_impressions, type: integer, source: computed, description: "max(0, campaign.contracted_impressions - campaign.delivered_impressions) at proposal time" }
      - { name: under_delivery_pct, type: number, source: computed, description: "shortfall_impressions / campaign.contracted_impressions at proposal time" }
      - { name: credit_cents, type: integer, source: computed, description: "min(round_half_up(shortfall_impressions x cpm_cents x 1.10 / 1000), invoice.audited_amount_cents)" }
      - { name: credit_status, type: enum, source: system, description: "PROPOSED | APPROVED | DECLINED | APPLIED", default: PROPOSED }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposing Auditor; SoD: reviewer must differ" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing Auditor, null until review", default: null }
      - { name: applied_by_user_id, type: string, source: system, description: "X-User-ID of applying SalesManager, null until applied", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    field: campaign_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELED]
    shape: cyclic  # SUBMITTED -> REJECTED -> DRAFT revision loop
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /network/campaigns/{campaign_id}/submit"
        actor: SalesManager
        preconditions: ["campaign in DRAFT"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /network/campaigns/{campaign_id}/approve"
        actor: SalesManager
        preconditions:
          - "X-User-ID != campaign.created_by_user_id (segregation of duties)"
          - "advertiser.advertiser_status == ACTIVE"
        side_effects: ["sets approved_by_user_id"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network/campaigns/{campaign_id}/reject"
        actor: SalesManager
        preconditions: ["X-User-ID != campaign.created_by_user_id (segregation of duties)"]
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "PATCH /network/campaigns/{campaign_id} (any edit reopens the campaign)"
        actor: SalesManager
        preconditions: ["campaign in REJECTED"]
        side_effects: ["increments Campaign.version by 1"]
      - from: [DRAFT, SUBMITTED]
        to: CANCELED
        trigger: "POST /network/campaigns/{campaign_id}/cancel"
        actor: SalesManager
        preconditions: ["no ReelSlot of this campaign in RESERVED or CONFIRMED (else ERR_CAMPAIGN_HAS_ACTIVE_SLOTS)"]
        side_effects: []
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /network/campaigns/{campaign_id}/complete"
        actor: SalesManager
        preconditions:
          - "every ReelSlot of this campaign is in PLAYED, MISSED, or CANCELED (else ERR_CAMPAIGN_HAS_ACTIVE_SLOTS)"
          - "no Invoice of this campaign in DRAFT or ISSUED (else ERR_CAMPAIGN_HAS_OPEN_INVOICES)"
        side_effects: []
      - from: APPROVED
        to: CANCELED
        trigger: "POST /network/campaigns/{campaign_id}/cancel"
        actor: SalesManager
        preconditions: ["no ReelSlot of this campaign in RESERVED or CONFIRMED (else ERR_CAMPAIGN_HAS_ACTIVE_SLOTS)"]
        side_effects: []

  - entity: PreShowReel
    field: reel_status
    initial_state: ASSEMBLING
    terminal_states: [RECONCILED]
    shape: cyclic  # DELIVERY_FAILED -> IN_TRANSIT redelivery loop
    transitions:
      - from: ASSEMBLING
        to: LOCKED
        trigger: "POST /network/reels/{reel_id}/lock"
        actor: NetworkOps
        preconditions:
          - "expected_reel_version matches reel.version (OCC)"
          - "at least one slot in RESERVED (else ERR_REEL_NOT_LOCKABLE)"
        side_effects:
          - "every RESERVED slot -> CONFIRMED"
          - "increments PreShowReel.version by 1"
      - from: LOCKED
        to: IN_TRANSIT
        trigger: "POST /network/reels/{reel_id}/dispatch"
        actor: NetworkOps
        preconditions: []
        side_effects: []
      - from: DELIVERY_FAILED
        to: IN_TRANSIT
        trigger: "POST /network/reels/{reel_id}/dispatch (redelivery retry)"
        actor: NetworkOps
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /network/reels/{reel_id}/acknowledge-delivery with outcome=DELIVERED"
        actor: TheaterOps
        preconditions:
          - "logical clock < reel.showtime.starts_at (else ERR_DELIVERY_LATE)"
          - "X-User-ID resolves to the theater owning the reel's showtime's screen"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERY_FAILED
        trigger: "POST /network/reels/{reel_id}/acknowledge-delivery with outcome=FAILED"
        actor: TheaterOps
        preconditions: ["X-User-ID resolves to the theater owning the reel's showtime's screen"]
        side_effects: []
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /network/reels/{reel_id}/reconcile"
        actor: NetworkOps
        preconditions: ["every CONFIRMED slot has transitioned to PLAYED or MISSED (else ERR_REEL_NOT_RECONCILABLE)"]
        side_effects: []

  - entity: ReelSlot
    field: slot_status
    initial_state: RESERVED
    terminal_states: [PLAYED, MISSED, CANCELED]
    shape: branching  # CONFIRMED forks to PLAYED or MISSED with divergent side effects
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "system (reel lock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: CANCELED
        trigger: "POST /network/slots/{slot_id}/cancel"
        actor: SalesManager
        preconditions: ["reel still ASSEMBLING (locked slots cannot be canceled)"]
        side_effects:
          - "reel pool seconds released (national_used_seconds or local_used_seconds -= duration_seconds)"
          - "campaign.reserved_estimated_cents -= slot.estimated_cost_cents"
          - "increments PreShowReel.version by 1"
      - from: CONFIRMED
        to: PLAYED
        trigger: "POST /network/slots/{slot_id}/playlogs with outcome=VERIFIED or PARTIAL"
        actor: TheaterOps
        preconditions: ["logical clock >= reel.showtime.starts_at (else ERR_PLAYLOG_BEFORE_SHOWTIME)"]
        side_effects:
          - "sets slot.play_factor (1.0 VERIFIED; 0.5 or 1.0 PARTIAL per campaign.partial_credit_mode)"
          - "sets slot.attributed_impressions when showtime.actual_attendance known"
          - "recomputes campaign.delivered_impressions (slot attribution -> campaign aggregate)"
      - from: CONFIRMED
        to: MISSED
        trigger: "POST /network/slots/{slot_id}/playlogs with outcome=FAILED"
        actor: TheaterOps
        preconditions: ["logical clock >= reel.showtime.starts_at (else ERR_PLAYLOG_BEFORE_SHOWTIME)"]
        side_effects:
          - "sets slot.play_factor = 0.0 and attributed_impressions = 0"
          - "recomputes campaign.delivered_impressions (drops this slot's contribution)"

  - entity: AttendanceReport
    field: report_status
    initial_state: SUBMITTED
    terminal_states: [AUDITED]
    shape: cyclic  # SUBMITTED -> DISPUTED -> SUBMITTED resubmission loop
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /network/attendance-reports/{report_id}/review with decision=ACCEPT"
        actor: NetworkOps
        preconditions: []
        side_effects:
          - "showtime.actual_attendance := reported_attendance"
          - "cascade: recompute attributed_impressions of PLAYED slots on this showtime"
          - "cascade: recompute delivered_impressions of each affected campaign"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /network/attendance-reports/{report_id}/review with decision=DISPUTE"
        actor: NetworkOps
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /network/attendance-reports/{report_id}/resubmit with new reported_attendance"
        actor: TheaterOps
        preconditions: ["X-User-ID resolves to the theater owning the report's showtime's screen"]
        side_effects: ["clears reviewed_by_user_id"]
      - from: ACCEPTED
        to: AUDITED
        trigger: "POST /network/attendance-reports/{report_id}/audit"
        actor: Auditor
        preconditions: ["X-User-ID != report.reported_by_user_id (segregation of duties)"]
        side_effects:
          - "showtime.actual_attendance := audited_attendance (may revise downward or upward)"
          - "cascade: recompute attributed_impressions of PLAYED slots on this showtime from the new actual_attendance"
          - "cascade: recompute delivered_impressions of each affected campaign"

  - entity: Invoice
    field: "billing_status x audit_status"
    initial_state: "DRAFT x UNAUDITED"
    terminal_states: [SETTLED, VOID]
    shape: parallel  # two independent state dimensions with guarded interactions
    transitions:
      - from: "billing=DRAFT"
        to: "billing=ISSUED"
        trigger: "POST /network/invoices/{invoice_id}/issue"
        actor: SalesManager
        preconditions: []
        side_effects: ["sets issued_by_user_id"]
      - from: "audit=UNAUDITED, billing=ISSUED"
        to: "audit=CERTIFIED"
        trigger: "POST /network/invoices/{invoice_id}/certify"
        actor: Auditor
        preconditions:
          - "billing_status == ISSUED (else ERR_INVOICE_NOT_CERTIFIABLE)"
          - "X-User-ID != invoice.issued_by_user_id (segregation of duties)"
          - "every ReelSlot of the campaign on showtimes dated in period is PLAYED or MISSED (else ERR_INVOICE_NOT_CERTIFIABLE)"
          - "every showtime carrying an in-period slot has latest AttendanceReport in ACCEPTED or AUDITED (else ERR_INVOICE_NOT_CERTIFIABLE)"
        side_effects:
          - "computes audited_impressions and audited_amount_cents (per-line rounding)"
          - "sets final_amount_cents := audited_amount_cents"
          - "sets certified_by_user_id"
      - from: "billing=ISSUED"
        to: "billing=SETTLED"
        trigger: "POST /network/invoices/{invoice_id}/settle"
        actor: SalesManager
        preconditions:
          - "audit_status == CERTIFIED (else ERR_INVOICE_NOT_SETTLABLE)"
          - "no MakeGoodCredit of this invoice in PROPOSED or APPROVED (else ERR_INVOICE_NOT_SETTLABLE)"
        side_effects: []
      - from: "billing=DRAFT or ISSUED, audit=UNAUDITED"
        to: "billing=VOID"
        trigger: "POST /network/invoices/{invoice_id}/void"
        actor: SalesManager
        preconditions: ["audit_status == UNAUDITED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []

  - entity: MakeGoodCredit
    field: credit_status
    initial_state: PROPOSED
    terminal_states: [APPLIED, DECLINED]
    shape: branching
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /network/make-goods/{make_good_id}/review with decision=APPROVE"
        actor: Auditor
        preconditions: ["X-User-ID != make_good.proposed_by_user_id (segregation of duties)"]
        side_effects: ["sets reviewed_by_user_id"]
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /network/make-goods/{make_good_id}/review with decision=DECLINE"
        actor: Auditor
        preconditions: ["X-User-ID != make_good.proposed_by_user_id (segregation of duties)"]
        side_effects: ["sets reviewed_by_user_id"]
      - from: APPROVED
        to: APPLIED
        trigger: "POST /network/make-goods/{make_good_id}/apply"
        actor: SalesManager
        preconditions:
          - "expected_invoice_version matches invoice.version (OCC)"
          - "invoice.billing_status == ISSUED and invoice.audit_status == CERTIFIED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "invoice.applied_credit_cents += credit_cents"
          - "invoice.final_amount_cents -= credit_cents (invariant: final + applied == audited)"
          - "sets applied_by_user_id"
          - "increments Invoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: reel-slot-add-stale-reel
    parent_entity: PreShowReel
    write_endpoint: "POST /network/reels/{reel_id}/slots"
    occ_field: expected_reel_version
    description: |
      Adding a ReelSlot to a PreShowReel whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just added or canceled a slot (legitimately mutating the
      assembly) and the current writer's capacity/offset view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reel-lock-stale-reel
    parent_entity: PreShowReel
    write_endpoint: "POST /network/reels/{reel_id}/lock"
    occ_field: expected_reel_version
    description: |
      Locking a PreShowReel whose version has advanced since the client last
      observed it is rejected; the client may otherwise lock an assembly that
      no longer matches what it reviewed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: credit-apply-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /network/make-goods/{make_good_id}/apply"
    occ_field: expected_invoice_version
    description: |
      Applying a MakeGoodCredit against an Invoice whose version has advanced
      since the client last observed it is rejected; the client may otherwise
      post a credit against final_amount_cents it has not seen.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: forecast_attendance
    trigger: "showtime creation; recomputed only if screen/feature/starts_at were mutable (they are not) — snapshot at creation"
    algorithm: forward_looking
    formula: |
      base = seat_count x OCCUPANCY[theater.market_tier]
      daypart = MATINEE if starts_at UTC hour < 17 else EVENING
      variant multiplier = OPENING_WEEK_MULTIPLIER if (showtime_date - feature.release_date) in [0, OPENING_WEEK_DAYS] days else 1.0
      forecast_attendance = floor(base x DAYPART_FACTOR[daypart] x RATING_DEMAND[feature.content_rating] x multiplier)
    input_set: "the showtime's screen.seat_count, screen.theater.market_tier, starts_at, feature.content_rating, feature.release_date"
    constants:
      OCCUPANCY_MAJOR_METRO: 0.40
      OCCUPANCY_REGIONAL: 0.32
      OCCUPANCY_SMALL_MARKET: 0.25
      DAYPART_FACTOR_MATINEE: 0.80
      DAYPART_FACTOR_EVENING: 1.20
      RATING_DEMAND_G: 0.90
      RATING_DEMAND_PG: 1.00
      RATING_DEMAND_PG13: 1.10
      RATING_DEMAND_R: 1.05
      RATING_DEMAND_NC17: 0.70
      OPENING_WEEK_DAYS: 7
      OPENING_WEEK_MULTIPLIER: 1.25
    precision: "integer, floor after all multiplications"
    variants:
      - name: STANDARD
        when: "showtime date is outside [release_date, release_date+7d]"
        difference: "multiplier = 1.0"
      - name: OPENING_WEEK
        when: "showtime date within [release_date, release_date+7d] inclusive"
        difference: "multiplier = 1.25 applied before floor"

  - name: slot_estimated_cost
    trigger: "ReelSlot creation (snapshot); campaign.reserved_estimated_cents maintained as slots are added/canceled"
    algorithm: aggregation
    formula: |
      estimated_cost_cents = round_half_up(showtime.forecast_attendance x campaign.cpm_cents / 1000)
      campaign.reserved_estimated_cents = sum(estimated_cost_cents) over slots in {RESERVED, CONFIRMED}
    input_set: "the new slot's showtime forecast and campaign rate"
    precision: "integer cents, round_half_up"

  - name: provisional_invoice_amount
    trigger: "invoice creation (POST /network/campaigns/{campaign_id}/invoices) — snapshot fields"
    algorithm: aggregation
    formula: |
      lines = campaign's ReelSlots with slot_status in {RESERVED, CONFIRMED, PLAYED}
              whose reel.showtime date d satisfies period_start_date <= d <= period_end_date
      provisional_impressions = sum over lines of showtime.forecast_attendance
      per line: line_cents = round_half_up(showtime.forecast_attendance x campaign.cpm_cents / 1000)
      provisional_amount_cents = sum of line_cents
    input_set: "campaign slots in {RESERVED, CONFIRMED, PLAYED} on showtimes dated within [period_start_date, period_end_date] inclusive; MISSED and CANCELED slots excluded"
    precision: "integer cents; rounding order pinned: round each line first, then sum (NOT sum-then-round)"

  - name: audited_invoice_amount
    trigger: "invoice certification (POST /network/invoices/{invoice_id}/certify)"
    algorithm: aggregation
    formula: |
      lines = campaign's ReelSlots with slot_status == PLAYED
              whose reel.showtime date d satisfies period_start_date <= d <= period_end_date
      audited_impressions = sum over lines of slot.attributed_impressions
      per line: line_cents = round_half_up(slot.attributed_impressions x campaign.cpm_cents / 1000)
      audited_amount_cents = sum of line_cents
    input_set: "PLAYED slots in period only; MISSED slots contribute nothing; certification blocked unless every in-period slot is PLAYED/MISSED and every carrying showtime has an ACCEPTED or AUDITED attendance report"
    precision: "integer cents; rounding order pinned: round each line first, then sum"

  - name: attributed_impressions
    trigger: "PlayLog creation, and recomputed when the showtime's actual_attendance changes (attendance accept or audit)"
    algorithm: threshold
    formula: |
      play_factor = 1.0 if outcome == VERIFIED
                  = 0.5 if outcome == PARTIAL and campaign.partial_credit_mode == STRICT
                  = 1.0 if outcome == PARTIAL and campaign.partial_credit_mode == LENIENT
                  = 0.0 if outcome == FAILED
      attributed_impressions = floor(showtime.actual_attendance x play_factor) when actual_attendance is not null, else null
    input_set: "the slot, its campaign's partial_credit_mode, the showtime's actual_attendance"
    precision: "integer, floor"
    variants:
      - name: STRICT
        when: "campaign.partial_credit_mode == STRICT"
        difference: "PARTIAL playback attributes half attendance (floor)"
      - name: LENIENT
        when: "campaign.partial_credit_mode == LENIENT"
        difference: "PARTIAL playback attributes full attendance"

  - name: make_good_credit
    trigger: "make-good proposal (POST /network/invoices/{invoice_id}/make-goods)"
    algorithm: threshold
    formula: |
      shortfall_impressions = max(0, campaign.contracted_impressions - campaign.delivered_impressions)
      under_delivery_pct = shortfall_impressions / campaign.contracted_impressions
      eligible iff under_delivery_pct > MAKE_GOOD_THRESHOLD_PCT   # strictly greater; exactly 0.05 is NOT eligible
      credit_cents = min(round_half_up(shortfall_impressions x campaign.cpm_cents x MAKE_GOOD_MULTIPLIER / 1000),
                         invoice.audited_amount_cents)
    input_set: "campaign contracted_impressions, campaign.delivered_impressions and cpm_cents at proposal time; the certified invoice's audited_amount_cents as cap"
    constants:
      MAKE_GOOD_THRESHOLD_PCT: 0.05
      MAKE_GOOD_MULTIPLIER: 1.10
    precision: "integer cents, round_half_up; pct compared in exact rational arithmetic"

  - name: pool_capacity_check
    trigger: "ReelSlot creation"
    algorithm: aggregation
    formula: |
      pool = national if campaign.advertiser.advertiser_type == NATIONAL else local
      new_used = reel.<pool>_used_seconds + duration_seconds
      reject ERR_POOL_CAPACITY_EXCEEDED if new_used > reel.<pool>_pool_seconds
      (capacity_seconds == national_pool_seconds + local_pool_seconds == 1200, so the
       pool check is always the binding one; there is no separate total-capacity error)
    input_set: "non-CANCELED slots of the reel, grouped by advertiser_type"
    constants:
      REEL_CAPACITY_SECONDS: 1200
      NATIONAL_POOL_SECONDS: 720
      LOCAL_POOL_SECONDS: 480
    precision: "integer seconds; boundary: new_used == pool_seconds is ALLOWED (strict > rejects)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role in {NetworkOps, SalesManager, TheaterOps, Auditor}"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "TheaterOps scope: X-User-ID must equal the Theater.id that owns the target showtime's screen (acknowledge-delivery, playlogs, attendance-reports, resubmit)"
    error_id: ERR_THEATER_SCOPE_MISMATCH
    http_status: 403
    applies_to: "POST /network/reels/{id}/acknowledge-delivery; POST /network/slots/{id}/playlogs; POST /network/showtimes/{id}/attendance-reports; POST /network/attendance-reports/{id}/resubmit"
  - priority: 4
    category: existence
    check: "Request shape: required fields present, types valid, enum values in-domain, date fields ISO, period_end_date >= period_start_date, flight_end_date >= flight_start_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 5
    category: existence
    check: "Path ids exist, validated left-to-right; body FK ids (campaign_id, feature_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: auth
    check: "Segregation of duties: approve/reject require X-User-ID != created_by_user_id; certify requires != issued_by_user_id; audit requires != reported_by_user_id; make-good review requires != proposed_by_user_id"
    error_id: "ERR_SOD_APPROVER_IS_CREATOR | ERR_SOD_CERTIFIER_IS_ISSUER | ERR_SOD_AUDITOR_IS_REPORTER | ERR_SOD_REVIEWER_IS_PROPOSER"
    http_status: 403
    applies_to: "approve, reject, certify, audit, make-good review endpoints"
  - priority: 7
    category: state
    check: "State preconditions per §1.2 (within a single request, the resource in the URL path is checked before body-referenced resources: reel state before campaign state on slot creation). PlayLog creation ordering: an existing PlayLog for the slot yields ERR_PLAYLOG_ALREADY_RECORDED; otherwise a slot not in CONFIRMED yields ERR_PLAYLOG_SLOT_NOT_CONFIRMED"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_CAMPAIGN_NOT_BOOKABLE | ERR_REEL_NOT_ASSEMBLING | ERR_REEL_NOT_LOCKABLE | ERR_REEL_NOT_RECONCILABLE | ERR_CAMPAIGN_HAS_ACTIVE_SLOTS | ERR_CAMPAIGN_HAS_OPEN_INVOICES | ERR_PLAYLOG_SLOT_NOT_CONFIRMED | ERR_ATTENDANCE_NOT_AUDITABLE | ERR_INVOICE_NOT_CERTIFIABLE | ERR_INVOICE_NOT_SETTLABLE | ERR_MAKE_GOOD_NOT_REVIEWABLE"
    http_status: 409
    applies_to: "state transition endpoints; also make-good proposal requires invoice CERTIFIED with no make-good in PROPOSED or APPROVED (else ERR_INVALID_STATE_TRANSITION)"
  - priority: 8
    category: business_safety
    check: "Rating-based placement: ALCOHOL advertiser category only on showtimes whose feature.content_rating in {R, NC17}; POLITICAL only on {PG13, R, NC17}; other categories unrestricted"
    error_id: ERR_RATING_PLACEMENT_VIOLATION
    http_status: 422
    applies_to: "POST /network/reels/{reel_id}/slots"
  - priority: 9
    category: business_constraint
    check: "Constraint tier for slot creation, evaluated in this order: (a) category exclusivity — no other non-CANCELED slot in the reel whose campaign advertiser shares the category; (b) interval overlap — [start_offset, start_offset+duration) must not intersect another non-CANCELED slot's half-open interval (touching endpoints allowed); (c) pool capacity (pools sum to capacity_seconds, so the pool check is always binding). Also: showtime overlap on a screen (buffered, TURNAROUND_MINUTES=30 — conflict iff new_start < existing_end+30m AND existing_start < new_end+30m, end=start+runtime; gap exactly 30m is allowed); duplicate open attendance report (exists report in SUBMITTED or ACCEPTED); invoice period overlap with a non-VOID invoice of the same campaign"
    error_id: "ERR_CATEGORY_EXCLUSIVITY_CONFLICT | ERR_SLOT_INTERVAL_OVERLAP | ERR_POOL_CAPACITY_EXCEEDED | ERR_SHOWTIME_OVERLAP | ERR_DUPLICATE_OPEN_ATTENDANCE_REPORT | ERR_INVOICE_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "slot/showtime/playlog/attendance-report/invoice creation"
  - priority: 10
    category: business_temporal
    check: "Temporal tier: slot's showtime date within [flight_start_date, flight_end_date]; delivery acknowledgment before showtime starts_at; playlog at or after starts_at"
    error_id: "ERR_OUTSIDE_FLIGHT_WINDOW | ERR_DELIVERY_LATE | ERR_PLAYLOG_BEFORE_SHOWTIME"
    http_status: 422
    applies_to: "slot creation, acknowledge-delivery, playlog creation"
  - priority: 11
    category: business_fiscal
    check: "Fiscal tier (last): campaign.reserved_estimated_cents + new slot.estimated_cost_cents <= campaign.budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /network/reels/{reel_id}/slots"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/network/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [NetworkOps]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Master data ---
  - method: POST
    path: "/network/theaters"
    description: "Create a theater"
    roles: [NetworkOps]
    code: 201
    input: [name, market_tier]
    output: Theater
    side_effects: ["theater_status=ACTIVE"]
  - method: GET
    path: "/network/theaters/{theater_id}"
    description: "Get a theater"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Theater
    side_effects: []
  - method: POST
    path: "/network/theaters/{id}/screens"
    description: "Add a screen (auditorium) to a theater"
    roles: [NetworkOps]
    code: 201
    input: [auditorium_label, seat_count]
    output: Screen
    side_effects: ["screen_status=ONLINE"]
  - method: GET
    path: "/network/screens/{screen_id}"
    description: "Get a screen"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Screen
    side_effects: []
  - method: GET
    path: "/network/theaters/{id}/screens"
    description: "List a theater's screens"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Screen[]
    side_effects: []
  - method: POST
    path: "/network/features"
    description: "Register a film"
    roles: [NetworkOps]
    code: 201
    input: [title, content_rating, runtime_minutes, release_date]
    output: Feature
    side_effects: []
  - method: GET
    path: "/network/features/{feature_id}"
    description: "Get a feature"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Feature
    side_effects: []
  - method: POST
    path: "/network/screens/{screen_id}/showtimes"
    description: "Schedule a showtime on a screen; auto-creates its empty ASSEMBLING PreShowReel; rejects buffered overlap on the screen"
    roles: [NetworkOps]
    code: 201
    input: [feature_id, starts_at]
    output: Showtime
    side_effects:
      - "computes daypart and forecast_attendance (forecast_attendance calculation)"
      - "creates PreShowReel(showtime_id) in ASSEMBLING with capacity 1200 / pools 720+480, version 1"
  - method: GET
    path: "/network/showtimes/{showtime_id}"
    description: "Get a showtime"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Showtime
    side_effects: []
  - method: GET
    path: "/network/showtimes"
    description: "List showtimes with optional filters"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: ["screen_id?", "feature_id?"]
    output: Showtime[]
    side_effects: []
  - method: GET
    path: "/network/showtimes/{id}/reel"
    description: "Get the showtime's pre-show reel (array of 0-1)"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: PreShowReel[]
    side_effects: []
  - method: GET
    path: "/network/reels/{reel_id}"
    description: "Get a reel (includes version for OCC)"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: PreShowReel
    side_effects: []

  # --- Advertisers & campaigns ---
  - method: POST
    path: "/network/advertisers"
    description: "Create an advertiser"
    roles: [SalesManager]
    code: 201
    input: [name, advertiser_type, category]
    output: Advertiser
    side_effects: ["advertiser_status=ACTIVE"]
  - method: GET
    path: "/network/advertisers/{advertiser_id}"
    description: "Get an advertiser"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Advertiser
    side_effects: []
  - method: POST
    path: "/network/campaigns"
    description: "Create a campaign in DRAFT"
    roles: [SalesManager]
    code: 201
    input: [advertiser_id, name, flight_start_date, flight_end_date, contracted_impressions, cpm_cents, budget_cents, "partial_credit_mode?"]
    output: Campaign
    side_effects: ["campaign_status=DRAFT; created_by_user_id from X-User-ID"]
  - method: GET
    path: "/network/campaigns/{campaign_id}"
    description: "Get a campaign"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: GET
    path: "/network/advertisers/{id}/campaigns"
    description: "List an advertiser's campaigns"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Campaign[]
    side_effects: []
  - method: PATCH
    path: "/network/campaigns/{campaign_id}"
    description: "Edit a campaign; only in DRAFT or REJECTED; editing a REJECTED campaign reopens it to DRAFT"
    roles: [SalesManager]
    code: 200
    input: ["name?", "flight_start_date?", "flight_end_date?", "contracted_impressions?", "cpm_cents?", "budget_cents?", "partial_credit_mode?"]
    output: Campaign
    side_effects: ["REJECTED -> DRAFT when applied in REJECTED; increments Campaign.version by 1"]
  - method: POST
    path: "/network/campaigns/{campaign_id}/submit"
    description: "Submit a DRAFT campaign for approval"
    roles: [SalesManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["campaign_status -> SUBMITTED"]
  - method: POST
    path: "/network/campaigns/{campaign_id}/approve"
    description: "Approve a SUBMITTED campaign; approver must differ from creator (SoD)"
    roles: [SalesManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["campaign_status -> APPROVED; sets approved_by_user_id"]
  - method: POST
    path: "/network/campaigns/{campaign_id}/reject"
    description: "Reject a SUBMITTED campaign; rejecter must differ from creator (SoD)"
    roles: [SalesManager]
    code: 200
    input: ["reason?"]
    output: Campaign
    side_effects: ["campaign_status -> REJECTED"]
  - method: POST
    path: "/network/campaigns/{campaign_id}/cancel"
    description: "Cancel a campaign in DRAFT, SUBMITTED, or APPROVED with no RESERVED/CONFIRMED slots"
    roles: [SalesManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["campaign_status -> CANCELED"]
  - method: POST
    path: "/network/campaigns/{campaign_id}/complete"
    description: "Complete an APPROVED campaign once all slots are terminal and no open invoices"
    roles: [SalesManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["campaign_status -> COMPLETED"]

  # --- Reel slots & reel lifecycle ---
  - method: POST
    path: "/network/reels/{reel_id}/slots"
    description: "Reserve a slot in an ASSEMBLING reel (OCC on reel version)"
    roles: [SalesManager]
    code: 201
    input: [campaign_id, start_offset_seconds, duration_seconds, expected_reel_version]
    output: ReelSlot
    side_effects:
      - "computes slot.estimated_cost_cents (slot_estimated_cost)"
      - "campaign.reserved_estimated_cents += estimated_cost_cents"
      - "reel pool used seconds += duration_seconds (pool_capacity_check)"
      - "increments PreShowReel.version by 1"
  - method: GET
    path: "/network/slots/{slot_id}"
    description: "Get a slot"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: ReelSlot
    side_effects: []
  - method: GET
    path: "/network/slots"
    description: "List slots with optional filters"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: ["reel_id?", "campaign_id?"]
    output: ReelSlot[]
    side_effects: []
  - method: POST
    path: "/network/slots/{slot_id}/cancel"
    description: "Cancel a RESERVED slot while the reel is still ASSEMBLING"
    roles: [SalesManager]
    code: 200
    input: []
    output: ReelSlot
    side_effects:
      - "slot_status -> CANCELED; pool seconds and campaign.reserved_estimated_cents released"
      - "increments PreShowReel.version by 1"
  - method: POST
    path: "/network/reels/{reel_id}/lock"
    description: "Lock an ASSEMBLING reel (OCC on reel version); all RESERVED slots become CONFIRMED"
    roles: [NetworkOps]
    code: 200
    input: [expected_reel_version]
    output: PreShowReel
    side_effects: ["reel_status -> LOCKED; slots RESERVED -> CONFIRMED; increments PreShowReel.version by 1"]
  - method: POST
    path: "/network/reels/{reel_id}/dispatch"
    description: "Dispatch a LOCKED reel to the theater; also redelivers from DELIVERY_FAILED"
    roles: [NetworkOps]
    code: 200
    input: []
    output: PreShowReel
    side_effects: ["reel_status -> IN_TRANSIT"]
  - method: POST
    path: "/network/reels/{reel_id}/acknowledge-delivery"
    description: "Theater acknowledges delivery (outcome=DELIVERED) or reports failure (outcome=FAILED); must occur before showtime start"
    roles: [TheaterOps]
    code: 200
    input: [outcome]
    output: PreShowReel
    side_effects: ["reel_status -> DELIVERED or DELIVERY_FAILED"]
  - method: POST
    path: "/network/reels/{reel_id}/reconcile"
    description: "Reconcile a DELIVERED reel once every CONFIRMED slot has a PlayLog outcome"
    roles: [NetworkOps]
    code: 200
    input: []
    output: PreShowReel
    side_effects: ["reel_status -> RECONCILED"]

  # --- Playback verification & attendance ---
  - method: POST
    path: "/network/slots/{id}/playlogs"
    description: "Record playback outcome for a CONFIRMED slot; at most one PlayLog per slot"
    roles: [TheaterOps]
    code: 201
    input: [outcome]
    output: PlayLog
    side_effects:
      - "slot CONFIRMED -> PLAYED (VERIFIED/PARTIAL) or MISSED (FAILED); sets play_factor and attributed_impressions (attributed_impressions calculation)"
      - "cascade: recompute campaign.delivered_impressions"
  - method: GET
    path: "/network/slots/{id}/playlogs"
    description: "List a slot's playlogs (array of 0-1)"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: PlayLog[]
    side_effects: []
  - method: POST
    path: "/network/showtimes/{id}/attendance-reports"
    description: "Theater submits actual attendance for a showtime"
    roles: [TheaterOps]
    code: 201
    input: [reported_attendance]
    output: AttendanceReport
    side_effects: ["report_status=SUBMITTED; reported_by_user_id from X-User-ID"]
  - method: GET
    path: "/network/showtimes/{id}/attendance-reports"
    description: "List a showtime's attendance reports"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: AttendanceReport[]
    side_effects: []
  - method: POST
    path: "/network/attendance-reports/{report_id}/review"
    description: "NetworkOps accepts (actual_attendance takes effect) or disputes a SUBMITTED report"
    roles: [NetworkOps]
    code: 200
    input: [decision]
    output: AttendanceReport
    side_effects: ["ACCEPT: report -> ACCEPTED, showtime.actual_attendance := reported_attendance, recompute slot attributions and campaign.delivered_impressions; DISPUTE: report -> DISPUTED"]
  - method: POST
    path: "/network/attendance-reports/{report_id}/resubmit"
    description: "Theater resubmits a DISPUTED report with a corrected figure (report returns to SUBMITTED)"
    roles: [TheaterOps]
    code: 200
    input: [reported_attendance]
    output: AttendanceReport
    side_effects: ["report_status DISPUTED -> SUBMITTED; clears reviewed_by_user_id"]
  - method: POST
    path: "/network/attendance-reports/{report_id}/audit"
    description: "Auditor establishes final audited attendance (may revise); auditor must differ from reporter (SoD)"
    roles: [Auditor]
    code: 200
    input: [audited_attendance]
    output: AttendanceReport
    side_effects: ["report -> AUDITED; showtime.actual_attendance := audited_attendance; recompute slot attributions and campaign.delivered_impressions"]

  # --- Billing: invoices & make-goods ---
  - method: POST
    path: "/network/campaigns/{id}/invoices"
    description: "Generate a DRAFT invoice with provisional forecast-based snapshot for a period"
    roles: [SalesManager]
    code: 201
    input: [period_start_date, period_end_date]
    output: Invoice
    side_effects: ["computes provisional_impressions and provisional_amount_cents (provisional_invoice_amount); billing_status=DRAFT, audit_status=UNAUDITED"]
  - method: GET
    path: "/network/invoices/{invoice_id}"
    description: "Get an invoice (includes version for OCC)"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/network/campaigns/{id}/invoices"
    description: "List a campaign's invoices"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/network/invoices/{invoice_id}/issue"
    description: "Issue a DRAFT invoice"
    roles: [SalesManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["billing_status DRAFT -> ISSUED; sets issued_by_user_id"]
  - method: POST
    path: "/network/invoices/{invoice_id}/certify"
    description: "Auditor certifies an ISSUED invoice: computes audited amounts (per-line rounding); certifier must differ from issuer (SoD)"
    roles: [Auditor]
    code: 200
    input: []
    output: Invoice
    side_effects: ["audit_status UNAUDITED -> CERTIFIED; computes audited_impressions, audited_amount_cents, final_amount_cents (audited_invoice_amount)"]
  - method: POST
    path: "/network/invoices/{invoice_id}/settle"
    description: "Settle an ISSUED + CERTIFIED invoice with no open make-goods"
    roles: [SalesManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["billing_status ISSUED -> SETTLED"]
  - method: POST
    path: "/network/invoices/{invoice_id}/void"
    description: "Void a DRAFT or ISSUED invoice while still UNAUDITED"
    roles: [SalesManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["billing_status -> VOID"]
  - method: POST
    path: "/network/invoices/{id}/make-goods"
    description: "Auditor proposes an under-delivery make-good credit against a CERTIFIED invoice"
    roles: [Auditor]
    code: 201
    input: []
    output: MakeGoodCredit
    side_effects: ["computes shortfall_impressions, under_delivery_pct, credit_cents (make_good_credit); credit_status=PROPOSED; sets proposed_by_user_id"]
  - method: GET
    path: "/network/invoices/{id}/make-goods"
    description: "List an invoice's make-good credits"
    roles: [NetworkOps, SalesManager, TheaterOps, Auditor]
    code: 200
    input: []
    output: MakeGoodCredit[]
    side_effects: []
  - method: POST
    path: "/network/make-goods/{make_good_id}/review"
    description: "Second Auditor approves or declines a PROPOSED make-good; reviewer must differ from proposer (SoD)"
    roles: [Auditor]
    code: 200
    input: [decision]
    output: MakeGoodCredit
    side_effects: ["credit_status -> APPROVED or DECLINED; sets reviewed_by_user_id"]
  - method: POST
    path: "/network/make-goods/{make_good_id}/apply"
    description: "SalesManager applies an APPROVED make-good to its invoice (OCC on invoice version)"
    roles: [SalesManager]
    code: 200
    input: [expected_invoice_version]
    output: MakeGoodCredit
    side_effects: ["credit_status -> APPLIED; invoice.applied_credit_cents += credit_cents; invoice.final_amount_cents -= credit_cents; increments Invoice.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing or role not in the declared set" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_THEATER_SCOPE_MISMATCH, http: 403, condition: "TheaterOps X-User-ID does not equal the Theater.id owning the target showtime's screen" }
  - { id: ERR_SOD_APPROVER_IS_CREATOR, http: 403, condition: "Campaign approve/reject by the same X-User-ID that created the campaign" }
  - { id: ERR_SOD_CERTIFIER_IS_ISSUER, http: 403, condition: "Invoice certify by the same X-User-ID that issued it" }
  - { id: ERR_SOD_AUDITOR_IS_REPORTER, http: 403, condition: "Attendance audit by the same X-User-ID that reported it" }
  - { id: ERR_SOD_REVIEWER_IS_PROPOSER, http: 403, condition: "Make-good review by the same X-User-ID that proposed it" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, malformed date, period_end before period_start, flight_end before flight_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger not valid from the resource's current state (generic)" }
  - { id: ERR_CAMPAIGN_NOT_BOOKABLE, http: 409, condition: "Slot creation against a campaign not in APPROVED" }
  - { id: ERR_CAMPAIGN_HAS_ACTIVE_SLOTS, http: 409, condition: "Cancel/complete blocked by slots in RESERVED or CONFIRMED" }
  - { id: ERR_CAMPAIGN_HAS_OPEN_INVOICES, http: 409, condition: "Complete blocked by an invoice in DRAFT or ISSUED" }
  - { id: ERR_REEL_NOT_ASSEMBLING, http: 409, condition: "Slot creation/cancel against a reel not in ASSEMBLING" }
  - { id: ERR_REEL_NOT_LOCKABLE, http: 409, condition: "Lock against a non-ASSEMBLING reel or a reel with zero RESERVED slots" }
  - { id: ERR_REEL_NOT_RECONCILABLE, http: 409, condition: "Reconcile while any CONFIRMED slot lacks a PlayLog" }
  - { id: ERR_PLAYLOG_SLOT_NOT_CONFIRMED, http: 409, condition: "PlayLog against a slot not in CONFIRMED" }
  - { id: ERR_PLAYLOG_ALREADY_RECORDED, http: 409, condition: "Second PlayLog for the same slot" }
  - { id: ERR_ATTENDANCE_NOT_AUDITABLE, http: 409, condition: "Audit against a report not in ACCEPTED" }
  - { id: ERR_DUPLICATE_OPEN_ATTENDANCE_REPORT, http: 409, condition: "New report while one exists in SUBMITTED or ACCEPTED for the showtime" }
  - { id: ERR_INVOICE_NOT_CERTIFIABLE, http: 409, condition: "Certify preconditions unmet (not ISSUED, slots lacking playlogs, attendance not accepted/audited)" }
  - { id: ERR_INVOICE_NOT_SETTLABLE, http: 409, condition: "Settle while audit_status != CERTIFIED or a make-good is PROPOSED/APPROVED" }
  - { id: ERR_INVOICE_PERIOD_OVERLAP, http: 409, condition: "Invoice period overlaps an existing non-VOID invoice of the same campaign" }
  - { id: ERR_MAKE_GOOD_NOT_REVIEWABLE, http: 409, condition: "Review/apply against a make-good not in the required state (PROPOSED for review, APPROVED for apply)" }
  - { id: ERR_RATING_PLACEMENT_VIOLATION, http: 422, condition: "Advertiser category forbidden for the showtime feature's content_rating" }
  - { id: ERR_CATEGORY_EXCLUSIVITY_CONFLICT, http: 409, condition: "Another non-CANCELED slot in the reel carries the same advertiser category" }
  - { id: ERR_SLOT_INTERVAL_OVERLAP, http: 409, condition: "Half-open slot interval intersects an existing non-CANCELED slot interval in the reel" }
  - { id: ERR_POOL_CAPACITY_EXCEEDED, http: 422, condition: "Slot would push its national/local pool beyond pool seconds (strict >)" }
  - { id: ERR_SHOWTIME_OVERLAP, http: 409, condition: "New showtime violates the screen's buffered-overlap rule (TURNAROUND_MINUTES=30)" }
  - { id: ERR_OUTSIDE_FLIGHT_WINDOW, http: 422, condition: "Slot's showtime date outside the campaign flight window" }
  - { id: ERR_DELIVERY_LATE, http: 422, condition: "Delivery acknowledgment at or after showtime starts_at" }
  - { id: ERR_PLAYLOG_BEFORE_SHOWTIME, http: 422, condition: "PlayLog recorded before the showtime starts_at" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Slot's estimated cost would push reserved_estimated_cents over budget_cents" }
  - { id: ERR_MAKE_GOOD_THRESHOLD_NOT_MET, http: 422, condition: "Under-delivery pct not strictly greater than 0.05 at make-good proposal" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: NetworkOps
    description: "Network operations: master data (theaters, screens, features, showtimes), reel lock/dispatch/reconcile, attendance review, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /network/theaters; POST /network/theaters/{id}/screens; POST /network/features; POST /network/screens/{id}/showtimes"
      - "POST /network/reels/{id}/lock; POST /network/reels/{id}/dispatch; POST /network/reels/{id}/reconcile"
      - "POST /network/attendance-reports/{id}/review"
      - "POST /network/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: SalesManager
    description: "Ad sales: advertisers, campaigns, slot reservations, invoicing, make-good application"
    identity: opaque
    exclusive_operations:
      - "POST /network/advertisers; POST /network/campaigns; PATCH /network/campaigns/{id}"
      - "POST /network/campaigns/{id}/submit|approve|reject|cancel|complete"
      - "POST /network/reels/{id}/slots; POST /network/slots/{id}/cancel"
      - "POST /network/campaigns/{id}/invoices; POST /network/invoices/{id}/issue|settle|void"
      - "POST /network/make-goods/{id}/apply"
    shared_operations: ["all GET endpoints"]
  - name: TheaterOps
    description: "Theater-side operator scoped to one theater: delivery acknowledgment, playback logs, attendance reports"
    identity: "entity_backed:Theater"
    exclusive_operations:
      - "POST /network/reels/{id}/acknowledge-delivery"
      - "POST /network/slots/{id}/playlogs"
      - "POST /network/showtimes/{id}/attendance-reports; POST /network/attendance-reports/{id}/resubmit"
    shared_operations: ["all GET endpoints"]
  - name: Auditor
    description: "Independent auditor: attendance audit, invoice certification, make-good proposal and review"
    identity: opaque
    exclusive_operations:
      - "POST /network/attendance-reports/{id}/audit"
      - "POST /network/invoices/{id}/certify"
      - "POST /network/invoices/{id}/make-goods; POST /network/make-goods/{id}/review"
    shared_operations: ["all GET endpoints"]
