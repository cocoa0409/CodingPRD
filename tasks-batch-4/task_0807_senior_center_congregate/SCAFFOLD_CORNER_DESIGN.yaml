  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_grant_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[funded-service-create-stale-grant]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a FundedService with expected_grant_award_version equal to the pre-activation version (now stale after activate bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Participant; grant created (version captured at DRAFT) then activated so its version advanced."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Occ1", birth_date: "1945-09-09T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p: "$.data.id" }
            - call: "POST /grant-awards"
              payload: { title: "IIID", oaa_title: "IIID", category: "WELLNESS", authorized_cents: 2000 }
              as: CenterAdmin
              captures: { g: "$.data.id", g_v0: "$.data.version" }
            - call: "POST /grant-awards/${g}/activate"
              payload: {}
              as: CenterAdmin
          trigger:
            - call: "POST /funded-services"
              payload: { participant_id: "${p}", category: "WELLNESS", quantity: 1, service_date: "2026-03-02T00:00:00Z", grant_award_id: "${g}", expected_grant_award_version: "${g_v0}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
      - name: corner_occ_stale_service_day_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[meal-reservation-create-stale-day]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a MealReservation with expected_service_day_version equal to the day's create-version after another reservation has advanced it returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["OPEN day capacity 10; version captured at create; one reservation by p1 advances the version; p2 reserves with the stale version."]
          setup_api_calls:
            - call: "POST /participants"
              payload: { full_name: "Occ2a", birth_date: "1944-10-10T00:00:00Z", gender: "FEMALE", ethnicity: "NON_HISPANIC", race: "WHITE", poverty_status: "AT_OR_ABOVE", lives_alone: true, rural: false, veteran: false }
              as: CenterAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "Occ2b", birth_date: "1943-11-11T00:00:00Z", gender: "MALE", ethnicity: "NON_HISPANIC", race: "BLACK", poverty_status: "BELOW", lives_alone: false, rural: false, veteran: true }
              as: CenterAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-30T12:00:00Z", site_name: "Main Hall", capacity: 10 }
              as: CenterAdmin
              captures: { sd: "$.data.id", v0: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p1}", expected_service_day_version: "${v0}" }
              as: Coordinator
              captures: { r1: "$.data.id" }
          trigger:
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p2}", expected_service_day_version: "${v0}" }
              as: Coordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

  # =========================================================================
  # excluded_because stubs — corners already exercised by §1.8 instances
  # =========================================================================
  - section: errors
    instances:
      - name: corner_error_room_double_booked
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROOM_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: rt_room_half_open_adjacency_allowed
          rationale: "The interior-overlap rejection with ERR_ROOM_DOUBLE_BOOKED is asserted by the named §1.8 resource_temporal_overlap instance."
      - name: corner_error_vehicle_unavailable
        claim_type: violation_to_error
        grounds: ["errors[ERR_VEHICLE_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: rt_vehicle_buffered_turnaround
          rationale: "The buffered-turnaround rejection with ERR_VEHICLE_UNAVAILABLE is asserted by the named §1.8 resource_temporal_overlap instance."
      - name: corner_error_meal_capacity_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEAL_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: bp_meal_capacity_exact_reserved_lt_capacity
          rationale: "ERR_MEAL_CAPACITY_EXCEEDED at the exact reserved_count==capacity boundary is asserted by the named §1.8 boundary_precision_check instance."
      - name: corner_error_signup_closed
        claim_type: violation_to_error
        grounds: ["errors[ERR_SIGNUP_CLOSED]"]
        excluded_because:
          difficulty_instance: pp_temporal_vs_constraint_signup_closed_and_full
          rationale: "ERR_SIGNUP_CLOSED (post-start signup) is asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: corner_error_grant_not_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_GRANT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: ce_funded_service_requires_grant_active
          rationale: "ERR_GRANT_NOT_ACTIVE against a DRAFT grant is asserted by the named §1.8 cross_entity_state_dependency instance."
      - name: corner_error_session_not_scheduled
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_NOT_SCHEDULED]"]
        excluded_because:
          difficulty_instance: ce_transport_approve_requires_session_scheduled
          rationale: "ERR_SESSION_NOT_SCHEDULED on approving a request whose linked session is CANCELLED is asserted by the named §1.8 cross_entity_state_dependency instance."
