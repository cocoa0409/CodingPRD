          setup:
            - "Concession at OPERATIONS, concessionaire ACTIVE, PERSISTENT_BREACH_POINTS_THRESHOLD 500."
            - "One VERIFIED ServicePeriod carrying a single ISSUED 600-point DeductionEvent, so deduction_points_ytd == 600 and persistent_breach_flag == true."
            - "Logical clock at 2027-04-02T00:00:00Z and CURE_PERIOD_DAYS == 90."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
