              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /surgical-cases/${case_id}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 2, airway_class_recorded: 2, comorbidity_count: 0, expected_case_version: "${case_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
