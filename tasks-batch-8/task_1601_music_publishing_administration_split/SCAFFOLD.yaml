# =============================================================================
# SCAFFOLD.yaml — Music Publishing Administration & Split Management
# §1.0–§1.7 only. Difficulty design (§1.8) and corner design (§1.9) live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Music Publishing Administration & Split Management (music publisher administration): song registration with societies & unique identifiers, writer/publisher split documentation & conflict resolution, royalty collection across income types & territories, statement processing & writer distribution, sub-publishing agreement & retention, copyright registration & termination rights tracking, audit of licensee reporting, advance recoupment"

domain_name: music-publishing-administration-split
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph          # flat URLs, FK web incl. self-reference and polymorphic source
  state_machine_shape: cyclic     # dominant shape; also parallel dims (Work) and compound (SplitSet)
  relationship_patterns:
    - one_to_many
    - many_to_many               # Work <-> Writer via SplitLine inside SplitSet
    - self_referential           # Work.parent_work_id (derivative works)
    - polymorphic                # RoyaltyStatement.source_id -> Society | Licensee | SubPublisher
    - cross_aggregate            # AllocationLine pins SplitLine of another aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Writer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Writer legal name" }
      - { name: ipi_number, type: string, source: input, description: "IPI/CAE interested-party identifier", constraints: "unique across all writers; 9-13 chars" }
      - { name: pro_affiliation, type: enum, source: input, description: "Performing rights organization affiliation", constraints: "ASCAP | BMI | SESAC | PRS | GEMA | SACEM | NONE" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lifecycle status", constraints: "ACTIVE | SUSPENDED" }
      - { name: payable_balance_cents, type: integer, source: computed, default: 0, description: "Net royalties owed to writer, awaiting distribution; input ignored" }
      - { name: advance_outstanding_cents, type: integer, source: computed, default: 0, description: "Sum of outstanding_cents over this writer's PAID/RECOUPING advances; input ignored" }
      - { name: lifetime_earned_cents, type: integer, source: computed, default: 0, description: "Sum of final_amount_cents over this writer's FINAL AllocationLine rows; input ignored" }

  - name: Work
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Primary work title" }
      - { name: alternate_titles, type: array, source: input, default: [], description: "Alternate title spellings" }
      - { name: parent_work_id, type: string, source: input, description: "FK -> Work.id; set for derivative works (samples/arrangements), null for originals", constraints: "must reference an existing Work; may not form a cycle (no update endpoint exists, so acyclic by construction)" }
      - { name: work_code, type: string, source: system, description: "Server-minted sequential publisher work number, format W-000001, W-000002, ...; unique" }
      - { name: iswc, type: string, source: system, default: null, description: "International Standard Work Code; set once when a PRO-type SocietyRegistration reaches REGISTERED via register call carrying iswc" }
      - { name: grant_date, type: datetime, source: input, description: "Date of the original publishing grant; drives termination window projection" }
      - { name: registration_status, type: enum, source: system, default: UNREGISTERED, description: "Society-registration dimension", constraints: "UNREGISTERED | PENDING_SOCIETY | REGISTERED" }
      - { name: copyright_status, type: enum, source: system, default: UNFILED, description: "Copyright-office dimension (parallel to registration_status)", constraints: "UNFILED | FILED | COPCO_REGISTERED | TERMINATED" }
      - { name: total_collected_cents, type: integer, source: computed, default: 0, description: "Sum of gross_cents over StatementLines matched to this work whose statement status IN {FINALIZED, DISTRIBUTED}" }
      - { name: total_distributed_cents, type: integer, source: computed, default: 0, description: "Sum of gross_cents over StatementLines matched to this work whose statement status == DISTRIBUTED" }

  - name: Society
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Society display name" }
      - { name: code, type: string, source: input, description: "Short society code", constraints: "unique" }
      - { name: society_type, type: enum, source: input, description: "Society kind", constraints: "PRO | MECHANICAL | COLLECTION" }
      - { name: territory_code, type: string, source: input, description: "Home territory (ISO-style code or WORLD)" }

  - name: SocietyRegistration
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id" }
      - { name: society_id, type: string, source: input, description: "FK -> Society.id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Registration lifecycle", constraints: "DRAFT | SUBMITTED | ACKNOWLEDGED | REGISTERED | REJECTED" }
      - { name: society_work_number, type: string, source: system, default: null, description: "Society-assigned work number captured at acknowledge" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason captured at reject" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of latest submit" }
      - { name: registered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of registration" }

  - name: SplitSet
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id" }
      - { name: revision_index, type: integer, source: system, description: "Per-work creation sequence starting at 1 (order key: creation order per work)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Negotiation lifecycle (compound over child SplitLine states)", constraints: "DRAFT | PENDING_CONFIRMATIONS | DISPUTED | CONFIRMED | SUPERSEDED | CANCELLED" }
      - { name: writer_pool_total_bp, type: integer, source: computed, default: 0, description: "Sum of share_bp over WRITER lines" }
      - { name: publisher_pool_total_bp, type: integer, source: computed, default: 0, description: "Sum of share_bp over PUBLISHER lines" }
      - { name: dispute_reason, type: string, source: system, default: null, description: "Reason from the first line-level rejection that moved the set to DISPUTED" }

  - name: SplitLine
    parent: null
    common_fields: true
    fields:
      - { name: split_set_id, type: string, source: system, description: "FK -> SplitSet.id" }
      - { name: participant_type, type: enum, source: input, description: "Which pool this line belongs to", constraints: "WRITER | PUBLISHER" }
      - { name: writer_id, type: string, source: input, default: null, description: "FK -> Writer.id; required when participant_type == WRITER, must be null otherwise" }
      - { name: publisher_name, type: string, source: input, default: null, description: "Publisher display name; required when participant_type == PUBLISHER, must be null otherwise" }
      - { name: share_bp, type: integer, source: input, description: "Share of this pool in basis points (10000 = 100%)", constraints: "integer >= 1" }
      - { name: confirmation_status, type: enum, source: system, default: PENDING, description: "Per-party confirmation", constraints: "PENDING | CONFIRMED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "Reason captured at reject" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of confirmation" }

  - name: SubPublisher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sub-publisher organization name" }
      - { name: home_territory_code, type: string, source: input, description: "Home territory of the sub-publisher" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lifecycle status", constraints: "ACTIVE | SUSPENDED" }

  - name: SubPublishingAgreement
    parent: null
    common_fields: true
    fields:
      - { name: sub_publisher_id, type: string, source: input, description: "FK -> SubPublisher.id" }
      - { name: territory_codes, type: array, source: input, description: "Territories covered; non-empty list of codes" }
      - { name: income_types, type: array, source: input, description: "Income types covered; non-empty subset of PERFORMANCE | MECHANICAL | SYNC | PRINT | OTHER" }
      - { name: retention_bp, type: integer, source: input, description: "Share of gross the sub-publisher retains", constraints: "1..5000 basis points" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage start (inclusive), half-open interval start" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage end (exclusive), half-open interval end; must be > effective_from" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Agreement lifecycle", constraints: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }

  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Licensee name" }
      - { name: licensee_type, type: enum, source: input, description: "Kind of licensee", constraints: "STREAMING | LABEL | SYNC_HOUSE | OTHER" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: input, description: "Kind of reporting source", constraints: "SOCIETY | LICENSEE | SUB_PUBLISHER" }
      - { name: source_id, type: string, source: input, description: "Polymorphic reference resolved via source_type: Society.id when SOCIETY, Licensee.id when LICENSEE, SubPublisher.id when SUB_PUBLISHER; existence validated at create (ERR_NOT_FOUND)" }
      - { name: income_type, type: enum, source: input, description: "Income classification", constraints: "PERFORMANCE | MECHANICAL | SYNC | PRINT | OTHER" }
      - { name: territory_code, type: string, source: input, description: "Territory this statement covers" }
      - { name: period_start, type: datetime, source: input, description: "Earning period start (inclusive bound of a closed interval)" }
      - { name: period_end, type: datetime, source: input, description: "Earning period end (inclusive bound of a closed interval); must be >= period_start" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Header-declared gross; must equal the sum of line gross_cents at allocate (tie-out)" }
      - { name: amends_statement_id, type: string, source: input, default: null, description: "FK -> RoyaltyStatement.id; when set this statement is an amendment that supersedes the referenced FINALIZED statement" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Processing lifecycle", constraints: "RECEIVED | MATCHING_REVIEW | ALLOCATED | FINALIZED | DISTRIBUTED | SUPERSEDED | REJECTED" }
      - { name: retained_cents, type: integer, source: computed, default: 0, description: "Total sub-publisher retention across lines (recomputed at allocate and finalize)" }
      - { name: suspense_cents, type: integer, source: computed, default: 0, description: "Unmatched income held back: always 0 while ALLOCATED (provisional spread), equals unmatched gross at FINALIZED" }
      - { name: allocated_total_cents, type: integer, source: computed, default: 0, description: "Sum of allocation amounts at the current stage (provisional at ALLOCATED, final at FINALIZED)" }

  - name: StatementLine
    parent: null
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: system, description: "FK -> RoyaltyStatement.id" }
      - { name: line_number, type: integer, source: input, description: "Line ordinal within the statement", constraints: "unique per statement; >= 1" }
      - { name: reported_title, type: string, source: input, description: "Title as reported by the source" }
      - { name: reported_iswc, type: string, source: input, default: null, description: "ISWC hint as reported (nullable)" }
      - { name: reported_work_code, type: string, source: input, default: null, description: "Publisher work-code hint as reported (nullable)" }
      - { name: gross_cents, type: integer, source: input, description: "Reported gross for this line", constraints: "integer >= 1" }
      - { name: work_id, type: string, source: system, default: null, description: "FK -> Work.id; null until matched" }
      - { name: match_status, type: enum, source: system, default: UNMATCHED, description: "Match state", constraints: "UNMATCHED | AUTO_MATCHED | MANUAL_MATCHED" }

  - name: AllocationLine
    parent: null
    common_fields: true
    fields:
      - { name: statement_line_id, type: string, source: system, description: "FK -> StatementLine.id" }
      - { name: split_line_id, type: string, source: system, description: "FK -> SplitLine.id; version-pinned to the SplitSet that was CONFIRMED at allocation time" }
      - { name: statement_id, type: string, source: system, description: "FK -> RoyaltyStatement.id (denormalized for filtering)" }
      - { name: writer_id, type: string, source: system, default: null, description: "FK -> Writer.id; null for PUBLISHER participant rows (denormalized for filtering)" }
      - { name: participant_type, type: enum, source: system, description: "Copied from the referenced SplitLine", constraints: "WRITER | PUBLISHER" }
      - { name: provisional_amount_cents, type: integer, source: computed, default: 0, description: "Amount computed at ALLOCATED stage (provisional variant: unmatched income spread included)" }
      - { name: final_amount_cents, type: integer, source: computed, default: null, description: "Amount computed at FINALIZED stage (final variant: unmatched income to suspense); null until finalize" }
      - { name: advance_applied_cents, type: integer, source: computed, default: 0, description: "Portion of final_amount_cents diverted to advance recoupment at finalize" }
      - { name: net_payable_cents, type: integer, source: computed, default: 0, description: "final_amount_cents - advance_applied_cents; credited to writer payable at finalize" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "Allocation lifecycle", constraints: "PROVISIONAL | FINAL | REVERSED" }

  - name: Advance
    parent: null
    common_fields: true
    fields:
      - { name: writer_id, type: string, source: input, description: "FK -> Writer.id" }
      - { name: agreement_ref, type: string, source: input, description: "External contract reference" }
      - { name: amount_cents, type: integer, source: input, description: "Advance principal", constraints: "integer >= 1" }
      - { name: recoup_rate_bp, type: integer, source: input, default: 10000, description: "Share of each writer allocation diverted to recoupment", constraints: "1..10000 basis points" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Advance lifecycle", constraints: "DRAFT | APPROVED | PAID | RECOUPING | RECOUPED | CANCELLED" }
      - { name: recouped_cents, type: integer, source: computed, default: 0, description: "Cumulative recouped amount" }
      - { name: outstanding_cents, type: integer, source: computed, default: 0, description: "Unrecouped balance; set to amount_cents at pay, drawn down by recoupment, restored by reversal" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of disbursement" }

  - name: DistributionRun
    parent: null
    common_fields: true
    fields:
      - { name: period_label, type: string, source: input, description: "Human label of the distribution period", constraints: "unique" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Run lifecycle", constraints: "OPEN | CALCULATED | APPROVED | PAID" }
      - { name: calculated_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at calculate (drives segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at approve" }
      - { name: writer_payouts, type: array, source: computed, default: [], description: "Snapshot list of { writer_id, amount_cents } for writers with payable_balance_cents >= 2500 at calculate time, ordered by Writer.created_at ASC" }
      - { name: included_statement_ids, type: array, source: computed, default: [], description: "Ids of all FINALIZED statements at calculate time, ordered by RoyaltyStatement.created_at ASC" }
      - { name: total_payable_cents, type: integer, source: computed, default: 0, description: "Sum of writer_payouts amounts" }

  - name: LicenseeAudit
    parent: null
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id" }
      - { name: period_start, type: datetime, source: input, description: "Audit period start (inclusive bound of a closed interval)" }
      - { name: period_end, type: datetime, source: input, description: "Audit period end (inclusive bound of a closed interval); must be >= period_start" }
      - { name: valuation_method, type: enum, source: input, description: "Claim valuation variant", constraints: "ACTUAL_SHORTFALL | EXTRAPOLATED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Audit lifecycle", constraints: "OPEN | FIELDWORK | FINDINGS_ISSUED | UNDER_APPEAL | SETTLED | CLOSED" }
      - { name: actual_shortfall_cents, type: integer, source: input, default: null, description: "Proven underreported amount, supplied at issue-findings", constraints: "integer >= 0 when present" }
      - { name: sampled_base_cents, type: integer, source: input, default: null, description: "Reported base inside the audited sample; required when valuation_method == EXTRAPOLATED", constraints: "integer >= 1 when present" }
      - { name: reported_base_cents, type: integer, source: input, default: null, description: "Total reported base for the period; required when valuation_method == EXTRAPOLATED and must be >= sampled_base_cents" }
      - { name: claim_amount_cents, type: integer, source: computed, default: null, description: "Claim computed at issue-findings per valuation_method" }
      - { name: settlement_cents, type: integer, source: input, default: null, description: "Agreed settlement captured at settle", constraints: "integer >= 0 when present" }

  - name: TerminationClaim
    parent: null
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> Work.id" }
      - { name: statute_basis, type: enum, source: input, description: "Statutory basis of the termination claim", constraints: "SEC_203 | SEC_304" }
      - { name: intended_effective_date, type: datetime, source: input, description: "Intended termination effective date; must satisfy window_open_date < intended_effective_date <= window_close_date" }
      - { name: window_open_date, type: datetime, source: computed, description: "grant_date + 35 calendar years" }
      - { name: window_close_date, type: datetime, source: computed, description: "grant_date + 40 calendar years" }
      - { name: notice_earliest_date, type: datetime, source: computed, description: "intended_effective_date - 10 calendar years" }
      - { name: notice_latest_date, type: datetime, source: computed, description: "intended_effective_date - 2 calendar years" }
      - { name: notice_ref, type: string, source: system, default: null, description: "Notice reference captured at file-notice" }
      - { name: notice_filed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of notice filing" }
      - { name: status, type: enum, source: system, default: TRACKING, description: "Claim lifecycle; NOTICE_WINDOW_OPEN and LAPSED are lazily derived from the logical clock on every read and before every action", constraints: "TRACKING | NOTICE_WINDOW_OPEN | NOTICE_FILED | EFFECTIVE | LAPSED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Writer
    initial_state: ACTIVE
    terminal_states: []
    note: "Single-dimension lifecycle; suspension gates advance approval (cross-entity precondition)."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /writers/{id}/suspend"
        actor: PublisherAdmin
        preconditions: []
        side_effects: ["Writer.version incremented"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /writers/{id}/reactivate"
        actor: PublisherAdmin
        preconditions: []
        side_effects: ["Writer.version incremented"]

  - entity: Work
    initial_state: "UNREGISTERED (registration_status) / UNFILED (copyright_status)"
    terminal_states: ["copyright_status == TERMINATED (registration dimension has no terminal state)"]
    note: "PARALLEL DIMENSIONS on one entity: registration_status and copyright_status evolve independently. Both are driven cross-entity: registration_status by SocietyRegistration transitions (bubble-up), copyright_status by filing endpoints and by TerminationClaim EFFECTIVE."
    transitions:
      - from: "registration_status == UNREGISTERED"
        to: "registration_status == PENDING_SOCIETY"
        trigger: "system (a SocietyRegistration for this work enters SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: ["Work.version incremented"]
      - from: "registration_status == PENDING_SOCIETY"
        to: "registration_status == REGISTERED"
        trigger: "system (any SocietyRegistration for this work enters REGISTERED)"
        actor: system
        preconditions: []
        side_effects: ["If that registration's society has society_type == PRO and Work.iswc is null and the register call carried iswc: set Work.iswc", "Work.version incremented"]
      - from: "registration_status == PENDING_SOCIETY"
        to: "registration_status == UNREGISTERED"
        trigger: "system (a rejection leaves no SocietyRegistration for this work with status IN {DRAFT, SUBMITTED, ACKNOWLEDGED, REGISTERED})"
        actor: system
        preconditions: []
        side_effects: ["Work.version incremented"]
      - from: "copyright_status == UNFILED"
        to: "copyright_status == FILED"
        trigger: "POST /works/{id}/file-copyright"
        actor: CopyrightSpecialist
        preconditions: ["work.copyright_status == UNFILED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["Work.version incremented"]
      - from: "copyright_status == FILED"
        to: "copyright_status == COPCO_REGISTERED"
        trigger: "POST /works/{id}/register-copyright"
        actor: CopyrightSpecialist
        preconditions: ["work.copyright_status == FILED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["Work.version incremented"]
      - from: "copyright_status IN {UNFILED, FILED, COPCO_REGISTERED}"
        to: "copyright_status == TERMINATED"
        trigger: "system (a TerminationClaim for this work enters EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Every SplitSet of this work with status IN {DRAFT, PENDING_CONFIRMATIONS, DISPUTED} -> CANCELLED"
          - "Each such cancellation cascades: that set's SplitLines with confirmation_status == PENDING -> REJECTED (system), rejection_reason = 'WORK_RIGHTS_TERMINATED'"
          - "Work.version incremented"

  - entity: SocietyRegistration
    initial_state: DRAFT
    terminal_states: [REGISTERED]
    note: "CYCLIC: REJECTED -> SUBMITTED resubmission loop. Registration drives Work.registration_status (bubble-up)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /society-registrations/{id}/submit"
        actor: CopyrightSpecialist
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "Work of work_id has copyright_status != TERMINATED (else ERR_WORK_RIGHTS_TERMINATED)"
          - "A SplitSet of that work with status == CONFIRMED exists (else ERR_NO_CONFIRMED_SPLIT_SET)"
        side_effects:
          - "submitted_at = logical clock now"
          - "If work.registration_status == UNREGISTERED: work.registration_status -> PENDING_SOCIETY"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /society-registrations/{id}/acknowledge"
        actor: CopyrightSpecialist
        preconditions: ["status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["society_work_number = input society_work_number"]
      - from: ACKNOWLEDGED
        to: REGISTERED
        trigger: "POST /society-registrations/{id}/register"
        actor: CopyrightSpecialist
        preconditions: ["status == ACKNOWLEDGED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "registered_at = logical clock now"
          - "work.registration_status -> REGISTERED"
          - "If society.society_type == PRO and work.iswc is null and input iswc provided: work.iswc = input iswc"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /society-registrations/{id}/reject"
        actor: CopyrightSpecialist
        preconditions: ["status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "rejection_reason = input reason"
          - "If no other SocietyRegistration of this work has status IN {DRAFT, SUBMITTED, ACKNOWLEDGED, REGISTERED}: work.registration_status -> UNREGISTERED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /society-registrations/{id}/submit"
        actor: CopyrightSpecialist
        preconditions:
          - "status == REJECTED (else ERR_INVALID_STATE_TRANSITION)"
          - "Work of work_id has copyright_status != TERMINATED (else ERR_WORK_RIGHTS_TERMINATED)"
          - "A SplitSet of that work with status == CONFIRMED exists (else ERR_NO_CONFIRMED_SPLIT_SET)"
        side_effects:
          - "rejection_reason = null"
          - "submitted_at = logical clock now"
          - "If work.registration_status == UNREGISTERED: work.registration_status -> PENDING_SOCIETY"

  - entity: SplitSet
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CANCELLED]
    note: "CYCLIC negotiation loop DRAFT -> PENDING_CONFIRMATIONS -> DISPUTED -> DRAFT, and COMPOUND: status is derived from child SplitLine confirmation states (bubble-up). SUPERSEDED is applied to the previously CONFIRMED set when a newer set confirms."
    transitions:
      - from: DRAFT
        to: PENDING_CONFIRMATIONS
        trigger: "POST /split-sets/{id}/submit"
        actor: PublisherAdmin
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "Work of work_id has copyright_status != TERMINATED (else ERR_WORK_RIGHTS_TERMINATED)"
        side_effects: []
      - from: PENDING_CONFIRMATIONS
        to: CONFIRMED
        trigger: "system (the last PENDING SplitLine of this set becomes CONFIRMED)"
        actor: system
        preconditions: ["All SplitLines of this set have confirmation_status == CONFIRMED"]
        side_effects:
          - "Any other SplitSet of the same work with status == CONFIRMED -> SUPERSEDED"
          - "Work.version incremented"
      - from: PENDING_CONFIRMATIONS
        to: DISPUTED
        trigger: "system (any SplitLine of this set becomes REJECTED)"
        actor: system
        preconditions: []
        side_effects: ["dispute_reason = the rejecting line's rejection_reason"]
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /split-sets/{id}/revise"
        actor: PublisherAdmin
        preconditions: ["status == DISPUTED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "All existing SplitLines of this set are deleted and replaced by the input lines, each with confirmation_status = PENDING"
          - "dispute_reason = null"
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system (a newer SplitSet of the same work becomes CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "DRAFT | PENDING_CONFIRMATIONS | DISPUTED"
        to: CANCELLED
        trigger: "system (work.copyright_status becomes TERMINATED)"
        actor: system
        preconditions: []
        side_effects: ["SplitLines of this set with confirmation_status == PENDING -> REJECTED (system), rejection_reason = 'WORK_RIGHTS_TERMINATED'"]

  - entity: SplitLine
    initial_state: PENDING
    terminal_states: [CONFIRMED, REJECTED]
    note: "Line transitions are only valid while the parent SplitSet is PENDING_CONFIRMATIONS, except the system REJECTED cascade on cancellation."
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /split-lines/{id}/confirm"
        actor: "Writer (own WRITER line: X-User-ID == line.writer_id, else ERR_SPLIT_LINE_OWNERSHIP_MISMATCH) | PublisherAdmin (PUBLISHER lines)"
        preconditions:
          - "Parent SplitSet status == PENDING_CONFIRMATIONS (else ERR_INVALID_STATE_TRANSITION)"
          - "If line.participant_type == WRITER: caller must be Writer role with X-User-ID == line.writer_id (else ERR_SPLIT_LINE_OWNERSHIP_MISMATCH); PublisherAdmin may not confirm WRITER lines"
          - "If line.participant_type == PUBLISHER: caller must be PublisherAdmin (else ERR_SPLIT_LINE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "confirmed_at = logical clock now"
          - "If all lines of the parent set are now CONFIRMED: parent SplitSet -> CONFIRMED (which supersedes the previously CONFIRMED set of the work, if any)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /split-lines/{id}/reject"
        actor: "Writer (own WRITER line) | PublisherAdmin (PUBLISHER lines)"
        preconditions:
          - "Parent SplitSet status == PENDING_CONFIRMATIONS (else ERR_INVALID_STATE_TRANSITION)"
          - "Same ownership rules as confirm (else ERR_SPLIT_LINE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "rejection_reason = input reason"
          - "Parent SplitSet -> DISPUTED, dispute_reason = input reason"

  - entity: RoyaltyStatement
    initial_state: RECEIVED
    terminal_states: [DISTRIBUTED, REJECTED, SUPERSEDED]
    note: "BRANCHING pipeline with amendment supersede branch. Creation with amends_statement_id performs the supersede of the target statement and rolls back its financial effects."
    transitions:
      - from: RECEIVED
        to: MATCHING_REVIEW
        trigger: "POST /royalty-statements/{id}/match"
        actor: RoyaltyAnalyst
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_STATE_TRANSITION)"
          - "Statement has at least 1 line (else ERR_EMPTY_STATEMENT)"
        side_effects:
          - "Auto-match pass over UNMATCHED lines: candidates = Works where (line.reported_iswc non-null and work.iswc == line.reported_iswc) OR (line.reported_work_code non-null and work.work_code == line.reported_work_code); eligibility filter work.registration_status == REGISTERED; ranking: iswc-matched candidates rank above work_code-matched candidates; tie-break work.created_at ASC; empty candidate set leaves the line UNMATCHED"
          - "Matched lines: work_id set, match_status = AUTO_MATCHED"
      - from: MATCHING_REVIEW
        to: ALLOCATED
        trigger: "POST /royalty-statements/{id}/allocate"
        actor: RoyaltyAnalyst
        preconditions:
          - "status == MATCHING_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "Statement has at least 1 line (else ERR_EMPTY_STATEMENT)"
          - "sum(line.gross_cents) == gross_amount_cents (else ERR_GROSS_MISMATCH)"
          - "At least 1 line has match_status != UNMATCHED (else ERR_NO_MATCHED_LINES)"
          - "Every MATCHED line's work has a SplitSet with status == CONFIRMED (else ERR_NO_CONFIRMED_SPLIT_SET)"
        side_effects:
          - "For each matched line: sub_publisher_retention (calculation) determines retained_cents share"
          - "provisional_unmatched_spread (calculation): unmatched gross spread pro-rata over matched lines"
          - "split_pool_allocation (calculation) creates AllocationLine rows (status PROVISIONAL) pinned to the currently CONFIRMED SplitSet of each matched work"
          - "statement.retained_cents, suspense_cents (= 0 at this stage), allocated_total_cents recomputed"
      - from: ALLOCATED
        to: FINALIZED
        trigger: "POST /royalty-statements/{id}/finalize"
        actor: RoyaltyAnalyst
        preconditions: ["status == ALLOCATED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "Recompute allocations under the final variant: unmatched gross -> suspense_cents (no spread); AllocationLine.final_amount_cents set, status PROVISIONAL -> FINAL"
          - "writer_recoupment_waterfall (calculation) per WRITER AllocationLine: advance_applied_cents and net_payable_cents set"
          - "Each advance application mutates Advance.recouped_cents/outstanding_cents; a PAID advance receiving its first application -> RECOUPING; an advance whose outstanding_cents reaches exactly 0 -> RECOUPED"
          - "Each affected Writer: payable_balance_cents += net_payable_cents; advance_outstanding_cents and lifetime_earned_cents recomputed; Writer.version incremented"
          - "Each matched Work: total_collected_cents recomputed"
          - "statement.retained_cents, suspense_cents, allocated_total_cents recomputed"
      - from: FINALIZED
        to: DISTRIBUTED
        trigger: "system (a DistributionRun that included this statement reaches PAID)"
        actor: system
        preconditions: []
        side_effects: ["Each matched Work: total_distributed_cents recomputed"]
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (POST /royalty-statements with amends_statement_id == this statement's id)"
        actor: system
        preconditions: ["Target statement status == FINALIZED (else ERR_AMENDED_STATEMENT_NOT_FINAL; if target already SUPERSEDED, ERR_STATEMENT_ALREADY_SUPERSEDED)"]
        side_effects:
          - "This statement's AllocationLines with status == FINAL -> REVERSED"
          - "Reverse the recoupment waterfall for this statement in reverse chronological order of application: each advance_applied_cents is credited back to the originating Advance (recouped_cents -= applied, outstanding_cents += applied); a RECOUPED advance with recouped_cents > 0 -> RECOUPING; a RECOUPING advance with recouped_cents == 0 -> PAID"
          - "Each affected Writer: payable_balance_cents -= net_payable_cents of reversed lines; advance_outstanding_cents and lifetime_earned_cents recomputed"
          - "Each matched Work: total_collected_cents recomputed"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /royalty-statements/{id}/reject"
        actor: RoyaltyAnalyst
        preconditions: ["status == RECEIVED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []

  - entity: Advance
    initial_state: DRAFT
    terminal_states: [RECOUPED, CANCELLED]
    note: "CYCLIC: RECOUPED -> RECOUPING and RECOUPING -> PAID reversal transitions (driven by statement supersede) reopen a closed advance."
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /advances/{id}/approve"
        actor: FinanceManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "Writer of writer_id has status == ACTIVE (else ERR_WRITER_NOT_ACTIVE)"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /advances/{id}/pay"
        actor: FinanceManager
        preconditions: ["status == APPROVED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "paid_at = logical clock now; outstanding_cents = amount_cents"
          - "Writer.advance_outstanding_cents recomputed; Writer.version incremented"
      - from: PAID
        to: RECOUPING
        trigger: "system (first recoupment application with outstanding_cents still > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECOUPING
        to: RECOUPED
        trigger: "system (recoupment application leaves outstanding_cents == 0 exactly)"
        actor: system
        preconditions: []
        side_effects: ["Writer.advance_outstanding_cents recomputed"]
      - from: RECOUPED
        to: RECOUPING
        trigger: "system (a reversal leaves 0 < recouped_cents < amount_cents)"
        actor: system
        preconditions: []
        side_effects: ["Writer.advance_outstanding_cents recomputed"]
      - from: RECOUPING
        to: PAID
        trigger: "system (a reversal leaves recouped_cents == 0)"
        actor: system
        preconditions: []
        side_effects: ["Writer.advance_outstanding_cents recomputed"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /advances/{id}/cancel"
        actor: FinanceManager
        preconditions: ["status IN {DRAFT, APPROVED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /advances/{id}/cancel"
        actor: FinanceManager
        preconditions: ["status IN {DRAFT, APPROVED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []

  - entity: DistributionRun
    initial_state: OPEN
    terminal_states: [PAID]
    note: "Ops-run checkpoint with revert (CALCULATED -> OPEN) and segregation of duties between calculate and approve."
    transitions:
      - from: OPEN
        to: CALCULATED
        trigger: "POST /distribution-runs/{id}/calculate"
        actor: RoyaltyAnalyst
        preconditions: ["status == OPEN (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "distribution_run_snapshot (calculation): writer_payouts, included_statement_ids, total_payable_cents captured"
          - "calculated_by_user_id = X-User-ID of caller"
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /distribution-runs/{id}/approve"
        actor: FinanceManager
        preconditions:
          - "status == CALCULATED (else ERR_INVALID_STATE_TRANSITION)"
          - "Segregation of duties: caller's X-User-ID != calculated_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Staleness: no RoyaltyStatement with status == FINALIZED exists whose id is not in included_statement_ids (else ERR_STALE_DISTRIBUTION_RUN)"
        side_effects: ["approved_by_user_id = X-User-ID of caller"]
      - from: APPROVED
        to: PAID
        trigger: "POST /distribution-runs/{id}/pay"
        actor: FinanceManager
        preconditions: ["status == APPROVED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "For each entry in writer_payouts: Writer.payable_balance_cents -= amount_cents; Writer.version incremented"
          - "Every statement in included_statement_ids: status FINALIZED -> DISTRIBUTED"
          - "Each matched Work of those statements: total_distributed_cents recomputed"
      - from: CALCULATED
        to: OPEN
        trigger: "POST /distribution-runs/{id}/reopen"
        actor: RoyaltyAnalyst
        preconditions: ["status == CALCULATED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["writer_payouts = [], included_statement_ids = [], total_payable_cents = 0, calculated_by_user_id = null"]

  - entity: LicenseeAudit
    initial_state: OPEN
    terminal_states: [SETTLED, CLOSED]
    note: "CYCLIC appeal loop: FINDINGS_ISSUED -> UNDER_APPEAL -> FINDINGS_ISSUED (amended findings recompute claim_amount_cents)."
    transitions:
      - from: OPEN
        to: FIELDWORK
        trigger: "POST /licensee-audits/{id}/begin-fieldwork"
        actor: Auditor
        preconditions: ["status == OPEN (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: FIELDWORK
        to: FINDINGS_ISSUED
        trigger: "POST /licensee-audits/{id}/issue-findings"
        actor: Auditor
        preconditions:
          - "status IN {FIELDWORK, UNDER_APPEAL} (else ERR_INVALID_STATE_TRANSITION)"
          - "If valuation_method == EXTRAPOLATED: sampled_base_cents present and >= 1 and reported_base_cents present and >= sampled_base_cents (else ERR_AUDIT_SAMPLE_BASE_INVALID)"
        side_effects: ["claim_amount_cents = audit_claim_valuation (calculation)"]
      - from: UNDER_APPEAL
        to: FINDINGS_ISSUED
        trigger: "POST /licensee-audits/{id}/issue-findings"
        actor: Auditor
        preconditions: ["Same as FIELDWORK -> FINDINGS_ISSUED"]
        side_effects: ["claim_amount_cents recomputed from the new inputs"]
      - from: FINDINGS_ISSUED
        to: UNDER_APPEAL
        trigger: "POST /licensee-audits/{id}/appeal"
        actor: Auditor
        preconditions: ["status == FINDINGS_ISSUED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: FINDINGS_ISSUED
        to: SETTLED
        trigger: "POST /licensee-audits/{id}/settle"
        actor: FinanceManager
        preconditions: ["status == FINDINGS_ISSUED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["settlement_cents = input settlement_cents"]
      - from: "OPEN | FIELDWORK"
        to: CLOSED
        trigger: "POST /licensee-audits/{id}/close"
        actor: Auditor
        preconditions: ["status IN {OPEN, FIELDWORK} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []

  - entity: SubPublishingAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    note: "EXPIRED is lazily derived: an ACTIVE agreement behaves as EXPIRED (and reports EXPIRED on read) once logical clock now >= effective_to."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sub-publishing-agreements/{id}/activate"
        actor: PublisherAdmin
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "SubPublisher of sub_publisher_id has status == ACTIVE (else ERR_SUB_PUBLISHER_NOT_ACTIVE)"
          - "Coverage overlap check (half-open [effective_from, effective_to)): no other agreement with status == ACTIVE whose territory_codes intersect this one's AND whose income_types intersect this one's AND (other.effective_from < this.effective_to AND this.effective_from < other.effective_to) (else ERR_COVERAGE_OVERLAP); touching intervals (other.effective_to == this.effective_from) do NOT overlap"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /sub-publishing-agreements/{id}/terminate"
        actor: PublisherAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy: logical clock now >= effective_to, evaluated on read and before any dependent calculation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TerminationClaim
    initial_state: TRACKING
    terminal_states: [EFFECTIVE, LAPSED, REJECTED]
    note: "NOTICE_WINDOW_OPEN / LAPSED are lazily derived from the logical clock: TRACKING behaves as NOTICE_WINDOW_OPEN once now >= window_open_date; a claim in TRACKING-or-NOTICE_WINDOW_OPEN behaves as LAPSED once now > window_close_date (if never NOTICE_FILED). Derived status is evaluated on every read and before every action."
    transitions:
      - from: TRACKING
        to: NOTICE_WINDOW_OPEN
        trigger: "system (lazy: logical clock now >= window_open_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOTICE_WINDOW_OPEN
        to: NOTICE_FILED
        trigger: "POST /termination-claims/{id}/file-notice"
        actor: CopyrightSpecialist
        preconditions:
          - "Derived status == NOTICE_WINDOW_OPEN (else ERR_INVALID_STATE_TRANSITION; if the window has not opened yet, ERR_TERMINATION_WINDOW_NOT_OPEN)"
          - "notice_earliest_date <= now <= notice_latest_date (else ERR_NOTICE_DEADLINE_PASSED when now > notice_latest_date)"
          - "Work of work_id has copyright_status != TERMINATED (else ERR_WORK_RIGHTS_TERMINATED)"
        side_effects: ["notice_filed_at = logical clock now; notice_ref = input notice_ref"]
      - from: NOTICE_WINDOW_OPEN
        to: LAPSED
        trigger: "system (lazy: logical clock now > window_close_date and never NOTICE_FILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NOTICE_FILED
        to: EFFECTIVE
        trigger: "POST /termination-claims/{id}/make-effective"
        actor: CopyrightSpecialist
        preconditions:
          - "status == NOTICE_FILED (else ERR_INVALID_STATE_TRANSITION)"
          - "logical clock now >= intended_effective_date (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Work.copyright_status -> TERMINATED (which cascades: non-terminal SplitSets of the work -> CANCELLED; their PENDING SplitLines -> REJECTED)"
      - from: NOTICE_FILED
        to: REJECTED
        trigger: "POST /termination-claims/{id}/reject"
        actor: CopyrightSpecialist
        preconditions: ["status == NOTICE_FILED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: split-set-create-stale-work
    parent_entity: Work
    write_endpoint: "POST /split-sets"
    occ_field: expected_work_version
    description: |
      Creating a SplitSet against a Work whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just created a revision (or a confirmation cascade superseded
      the previously CONFIRMED set) and the current writer's view of the work
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: advance-create-stale-writer
    parent_entity: Writer
    write_endpoint: "POST /advances"
    occ_field: expected_writer_version
    description: |
      Creating an Advance against a Writer whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just created an advance (which legitimately coexists with the
      prior one) and the current writer's view of the writer is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: split_pool_allocation
    trigger: "POST /royalty-statements/{id}/allocate (provisional) and POST /royalty-statements/{id}/finalize (final); runs per matched StatementLine"
    algorithm: tiered_pricing
    formula: |
      Inputs: line effective gross E (see provisional_unmatched_spread for the
      provisional-stage effective gross; at final stage E = line.gross_cents),
      retention R (see sub_publisher_retention), the CONFIRMED SplitSet of the
      matched work (version-pinned at allocation time).
      1. net = E - R
      2. Pool split (PINNED ORDER — this nesting order is normative):
         writer_pool   = floor(net * WRITER_POOL_BP / 10000)
         publisher_pool = net - writer_pool        # odd remainder cent goes to publisher pool
      3. Per pool, per SplitLine of that pool (per-line floor THEN remainder):
         line_amount_i = floor(pool * share_bp_i / 10000)
         remainder = pool - sum(line_amount_i)
         Distribute remainder one cent at a time to lines ordered by
         share_bp DESC, tie-break SplitLine.created_at ASC; each line receives
         at most one cent per pass; repeat passes until remainder == 0.
      4. One AllocationLine per SplitLine: amount = line_amount_i (+ remainder cents).
         Creation order (pins created_at ordering): per matched StatementLine in
         StatementLine.created_at ASC order; within a line, WRITER-pool rows
         first (SplitLine.created_at ASC), then PUBLISHER-pool rows.
    input_set: "StatementLines of the statement with match_status IN {AUTO_MATCHED, MANUAL_MATCHED}; SplitLines of the work's CONFIRMED SplitSet"
    constants:
      WRITER_POOL_BP: 5000
    precision: "integer cents; floor division at every step; remainder order pinned in step 3"
    variants:
      - name: provisional
        when: "statement allocate (status -> ALLOCATED)"
        difference: "E includes the line's share of unmatched-income spread (see provisional_unmatched_spread); result stored in AllocationLine.provisional_amount_cents; statement.suspense_cents = 0"
      - name: final
        when: "statement finalize (status -> FINALIZED)"
        difference: "E = line.gross_cents exactly (no spread); unmatched gross accumulates into statement.suspense_cents; result stored in AllocationLine.final_amount_cents"

  - name: sub_publisher_retention
    trigger: "runs inside split_pool_allocation for each matched StatementLine, at allocate and at finalize"
    algorithm: threshold
    formula: |
      Selector (deterministic): agreements with status == ACTIVE (lazily
      excluding EXPIRED) whose territory_codes contain statement.territory_code
      AND whose income_types contain statement.income_type AND
      effective_from <= statement.period_end < effective_to (half-open).
      At most one can exist (coverage-overlap rule); if none: R = 0.
      If found: R = floor(E * retention_bp / 10000)  where E is the same
      effective gross used by split_pool_allocation for this line.
      Retention is computed per line, then summed into statement.retained_cents.
    input_set: "SubPublishingAgreements (selector above) x matched StatementLines of the statement"
    constants:
      MAX_RETENTION_BP: 5000
    precision: "integer cents, floor per line"

  - name: provisional_unmatched_spread
    trigger: "POST /royalty-statements/{id}/allocate only (provisional stage)"
    algorithm: waterfall_allocation
    formula: |
      unmatched_total = sum(gross_cents of lines with match_status == UNMATCHED)
      matched_total   = sum(gross_cents of matched lines)
      If unmatched_total == 0: every matched line's spread_add = 0.
      Else per matched line i:
        spread_add_i = floor(unmatched_total * gross_i / matched_total)
        remainder = unmatched_total - sum(spread_add_i)
        Distribute remainder one cent at a time to matched lines ordered by
        gross_cents DESC, tie-break StatementLine.created_at ASC.
      Provisional effective gross E_i = gross_i + spread_add_i.
      DUAL VARIANT: at finalize this spread is NOT applied; unmatched_total
      becomes statement.suspense_cents instead. Identical statement data yields
      different per-writer amounts between the two stages.
    input_set: "all StatementLines of the statement, partitioned by match_status"
    precision: "integer cents, floor; remainder order pinned"

  - name: writer_recoupment_waterfall
    trigger: "POST /royalty-statements/{id}/finalize, per WRITER AllocationLine"
    algorithm: waterfall_allocation
    formula: |
      remaining = AllocationLine.final_amount_cents
      For the line's writer, iterate advances with status IN {PAID, RECOUPING}
      ordered by paid_at ASC, tie-break Advance.created_at ASC:
        if remaining == 0: stop
        budget  = floor(remaining * advance.recoup_rate_bp / 10000)
        applied = min(budget, advance.outstanding_cents)
        advance.recouped_cents    += applied
        advance.outstanding_cents -= applied
        remaining -= applied
        advance status updates: PAID -> RECOUPING on first application;
        RECOUPING -> RECOUPED when outstanding_cents == 0 exactly.
      AllocationLine.advance_applied_cents = final_amount_cents - remaining
      AllocationLine.net_payable_cents     = remaining
      Writer.payable_balance_cents += remaining
      INVARIANT (per advance in {PAID, RECOUPING, RECOUPED}):
        amount_cents == recouped_cents + outstanding_cents
      Reversal (statement supersede) replays the statement's applications in
      reverse chronological order, crediting each advance back; the same
      invariant MUST hold after every reversal.
    input_set: "WRITER AllocationLine rows of the finalizing statement; the writer's advances with status IN {PAID, RECOUPING}"
    precision: "integer cents, floor for budget"

  - name: audit_claim_valuation
    trigger: "POST /licensee-audits/{id}/issue-findings"
    algorithm: weighted_scoring
    formula: |
      DUAL VARIANT over identical findings inputs:
      ACTUAL_SHORTFALL: claim_amount_cents = actual_shortfall_cents
      EXTRAPOLATED:     claim_amount_cents = floor(actual_shortfall_cents * reported_base_cents / sampled_base_cents)
      (Precondition for EXTRAPOLATED: sampled_base_cents >= 1 and
       reported_base_cents >= sampled_base_cents, else ERR_AUDIT_SAMPLE_BASE_INVALID.)
    input_set: "the LicenseeAudit's own findings fields"
    precision: "integer cents, floor"

  - name: termination_window_projection
    trigger: "POST /termination-claims (at create)"
    algorithm: projection
    formula: |
      Let G = work.grant_date (date part). Calendar-year arithmetic (month/day
      preserved; Feb 29 clamps to Feb 28 in non-leap target years):
        window_open_date     = G + 35 years
        window_close_date    = G + 40 years
        notice_earliest_date = intended_effective_date - 10 years
        notice_latest_date   = intended_effective_date - 2 years
      Create-time validation: window_open_date < intended_effective_date <=
      window_close_date (else ERR_EFFECTIVE_DATE_OUTSIDE_WINDOW).
    input_set: "the referenced Work's grant_date and the input intended_effective_date"
    constants:
      WINDOW_OPEN_YEARS: 35
      WINDOW_CLOSE_YEARS: 40
      NOTICE_EARLIEST_YEARS: 10
      NOTICE_LATEST_YEARS: 2
    precision: "calendar dates, UTC"

  - name: distribution_run_snapshot
    trigger: "POST /distribution-runs/{id}/calculate"
    algorithm: threshold
    formula: |
      eligible writers = Writers with payable_balance_cents >= MIN_PAYOUT_CENTS
      (INCLUSIVE boundary: exactly MIN_PAYOUT_CENTS is paid).
      writer_payouts = [{writer_id, amount_cents = payable_balance_cents}] for
      eligible writers, ordered by Writer.created_at ASC.
      included_statement_ids = ids of all RoyaltyStatements with status ==
      FINALIZED, ordered by RoyaltyStatement.created_at ASC.
      total_payable_cents = sum(amount_cents over writer_payouts).
    input_set: "all Writers (threshold filter above); all FINALIZED RoyaltyStatements"
    constants:
      MIN_PAYOUT_CENTS: 2500
    precision: "integer cents"

  - name: work_royalty_rollup
    trigger: "statement finalize, statement supersede, distribution-run pay"
    algorithm: aggregation
    formula: |
      Per matched Work:
        total_collected_cents   = sum(gross_cents of StatementLines matched to
          this work whose statement status IN {FINALIZED, DISTRIBUTED})
        total_distributed_cents = sum(gross_cents of StatementLines matched to
          this work whose statement status == DISTRIBUTED)
      Recomputed in full (not incrementally) on every trigger; SUPERSEDED and
      REJECTED statements contribute nothing.
    input_set: "StatementLines joined to their RoyaltyStatement, filtered by statement status as above"
    precision: "integer cents"

  - name: writer_balance_rollup
    trigger: "advance pay, statement finalize (recoupment), statement supersede (reversal), distribution-run pay"
    algorithm: aggregation
    formula: |
      Per affected Writer:
        advance_outstanding_cents = sum(outstanding_cents over Advances with
          status IN {PAID, RECOUPING})
        lifetime_earned_cents = sum(final_amount_cents over AllocationLines
          with writer_id == writer and status == FINAL)
        payable_balance_cents is a running balance: += net_payable_cents at
          finalize, -= net_payable_cents at reversal, -= payout amount at
          distribution-run pay. It is recomputed from FINAL minus REVERSED
          minus PAID-payouts whenever a rollup trigger fires; the recomputed
          value MUST equal the running balance.
    input_set: "the writer's Advances and AllocationLines; DistributionRun payouts naming the writer"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must be permitted on this endpoint; resource-ownership checks: Writer callers may only confirm/reject their OWN WRITER SplitLines (X-User-ID == line.writer_id) and may only read their own earnings-summary"
    error_id: "ERR_FORBIDDEN_FOR_ROLE | ERR_SPLIT_LINE_OWNERSHIP_MISMATCH"
    http_status: 403
    applies_to: "all endpoints (ownership clause: split-line confirm/reject, writer earnings-summary)"

  - priority: 3
    category: existence
    check: "Path ids and body references must exist, validated left-to-right; polymorphic RoyaltyStatement.source_id resolved per source_type (Society/Licensee/SubPublisher); Work.parent_work_id; amends_statement_id; line work_id on manual match"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present; enum membership; integer ranges; effective_from < effective_to; period_start <= period_end; lines line_number unique per statement; writer_id present iff participant_type == WRITER; publisher_name present iff participant_type == PUBLISHER"
    error_id: "ERR_VALIDATION | ERR_INVALID_DATE_RANGE"
    http_status: 422
    applies_to: "all create/action endpoints with payloads"

  - priority: 5
    category: state
    check: "State-machine preconditions of the target entity AND cross-entity state gates: registration submit requires a CONFIRMED SplitSet on the work; amendment create requires target FINALIZED (ERR_AMENDED_STATEMENT_NOT_FINAL; if target SUPERSEDED, ERR_STATEMENT_ALREADY_SUPERSEDED — checked in this order); line confirm/reject requires parent set PENDING_CONFIRMATIONS"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_NO_CONFIRMED_SPLIT_SET | ERR_AMENDED_STATEMENT_NOT_FINAL | ERR_STATEMENT_ALREADY_SUPERSEDED"
    http_status: 409
    applies_to: "all action endpoints; POST /royalty-statements when amends_statement_id set"

  - priority: 6
    category: business_safety
    check: "Rights/compliance gates: no SplitSet create/submit or registration submit on a TERMINATED work; termination effective date inside window; notice filed within [notice_earliest_date, notice_latest_date]; distribution approve caller != calculated_by_user_id"
    error_id: "ERR_WORK_RIGHTS_TERMINATED | ERR_EFFECTIVE_DATE_OUTSIDE_WINDOW | ERR_TERMINATION_WINDOW_NOT_OPEN | ERR_NOTICE_DEADLINE_PASSED | ERR_SEGREGATION_OF_DUTIES"
    http_status: "409 | 403"
    applies_to: "POST /split-sets, split-set submit, registration submit, termination-claim create/file-notice, distribution-run approve"

  - priority: 7
    category: business_referential
    check: "Referenced entities must be in a good status: agreement activate requires SubPublisher ACTIVE; advance approve requires Writer ACTIVE; manual line match requires Work.registration_status == REGISTERED"
    error_id: "ERR_SUB_PUBLISHER_NOT_ACTIVE | ERR_WRITER_NOT_ACTIVE | ERR_WORK_NOT_REGISTERED"
    http_status: 409
    applies_to: "agreement activate, advance approve, statement-line match"

  - priority: 8
    category: business_temporal
    check: "Interval conflicts: agreement coverage overlap (half-open, adjacency allowed) at activate; audit period overlap per licensee (closed inclusive, shared boundary date counts) at create; statement period overlap per (source_type, source_id, income_type, territory_code) against statements with status NOT IN {REJECTED, SUPERSEDED}, excluding the amends target (closed inclusive)"
    error_id: "ERR_COVERAGE_OVERLAP | ERR_AUDIT_PERIOD_OVERLAP | ERR_STATEMENT_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "agreement activate, audit create, statement create"

  - priority: 9
    category: business_constraint
    check: "Aggregate/duplicate constraints: split writer pool sums exactly 10000 bp AND publisher pool sums exactly 10000 bp; every share_bp >= 1; no duplicate writer_id and no duplicate publisher_name within one SplitSet; at most one SocietyRegistration per (work_id, society_id) with status IN {DRAFT, SUBMITTED, ACKNOWLEDGED, REGISTERED}; EXTRAPOLATED audit requires sampled_base_cents >= 1 and reported_base_cents >= sampled_base_cents"
    error_id: "ERR_SPLIT_SUM_INVALID | ERR_ZERO_SHARE_LINE | ERR_DUPLICATE_SPLIT_PARTICIPANT | ERR_DUPLICATE_SOCIETY_REGISTRATION | ERR_AUDIT_SAMPLE_BASE_INVALID"
    http_status: "422 | 409"
    applies_to: "POST /split-sets, split-set revise, society-registration create, audit issue-findings"

  - priority: 10
    category: business_fiscal
    check: "Money tie-outs and checkpoint staleness: statement allocate requires sum(line gross) == gross_amount_cents and >= 1 line and >= 1 matched line; distribution approve requires no FINALIZED statement outside included_statement_ids"
    error_id: "ERR_GROSS_MISMATCH | ERR_EMPTY_STATEMENT | ERR_NO_MATCHED_LINES | ERR_STALE_DISTRIBUTION_RUN"
    http_status: 409
    applies_to: "statement match/allocate, distribution-run approve"

  - priority: 11
    category: business_fiscal
    check: "Optimistic concurrency: expected_work_version must equal Work.version (POST /split-sets); expected_writer_version must equal Writer.version (POST /advances)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /split-sets, POST /advances"

