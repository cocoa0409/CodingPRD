# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2499_correspondent_banking_respondent_due_diligence
# Depth index: every instance is a worked, fully-numeric probe of one of the
# nine §0.5 Difficulty Rules, grounded only in SCAFFOLD.yaml §1.1-§1.7.
# Every chain starts from an empty database; the logical clock reads exactly
# 2026-08-01T00:00:00Z unless a call moves it via POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: control_score_onboarding_self_credit_vs_refresh_assessed_only_same_respondent
        grounds:
          - calculations.control_score
          - entities.DueDiligenceQuestionnaire.fields.computed_control_score
          - entities.DueDiligenceQuestionnaire.fields.control_score_variant
          - entities.RespondentBank.fields.control_score
          - entities.ControlAssessment.fields.assessed_rating
          - validations[priority=33]
          - state_machines.RespondentBank.dd_state.PROSPECT_to_DD_IN_PROGRESS
          - state_machines.RespondentBank.dd_state.PENDING_COMMITTEE_to_APPROVED
        distinguishing_aspect: |
          Variant divergence lives in the ControlAssessment rating source: with the same eight
          self_rating=5 rows and the same three analyst overlays, ONBOARDING_PROVISIONAL credits
          self_rating for every un-overlaid domain and lands on the CAP_ONE_MAJOR ceiling (78.80
          raw -> 75.00), while REFRESH_FINAL ignores self_rating entirely and scores the same
          domains at their assessed_rating only (30.80, cap inert) - a 44.20-point gap on the
          same respondent, and it is the questionnaire/ControlAssessment entity domain (the
          paired wind_down_cap instance below uses the ClosurePlan domain).
        test_recipe:
          setup: >
            One JurisdictionProfile DE (PERMITTED, basel 4.0, corridor weight 1.00). One
            RespondentBank moved PROSPECT -> DD_IN_PROGRESS by licensing verification, carrying
            questionnaire v1 with all eight ControlAssessment rows at self_rating 5 and analyst
            overlays on GOVERNANCE (2), SANCTIONS_SCREENING (3, MAJOR) and AUDIT (1); v1 is
            already ASSESSED under ONBOARDING_PROVISIONAL. The respondent carries one VERIFIED
            natural-person owner at 100.00% in DE, is scored under ONBOARDING_PROVISIONAL
            (inherent 8.00 + 0 + 0 + 6 = 14.00, control_score 75.00, control_credit
            round(55/80*0.45, 4) = 0.3094, residual round(14.00*0.6906, 2) = 9.67, risk_rating LOW)
            and is then APPROVED by the committee, which is what makes REFRESH_FINAL the only
            admissible control_score variant (it is accepted while dd_state IN {APPROVED,
            REFRESH_DUE, UNDER_REFRESH, REFRESH_OVERDUE, RESTRICTED}, and ONBOARDING_PROVISIONAL is
            accepted only while dd_state IN {PROSPECT, DD_IN_PROGRESS, PENDING_COMMITTEE}).
            Questionnaire v2 is then built with byte-identical self_ratings plus an assessed_rating
            on all eight domains (priority 33 demands a full assessed set for REFRESH_FINAL).
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Rhein Handelsbank AG", swift_bic: "RHEIDEFFXXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 4500000.00, expected_monthly_count: 300 }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { r_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${r_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${r_id}/beneficial-owners", payload: { owner_name: "Rhein Handels Holding", owner_type: "NATURAL_PERSON", ownership_pct: 100.00, country_of_residence: "DE", is_pep: false }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { r_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${r_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${r_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { rv1: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${r_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${rv1}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q1_id: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q1_gov: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q1_ss: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/control-assessments", payload: { control_domain: "TRAINING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/control-assessments", payload: { control_domain: "AUDIT", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q1_aud: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${r_id}" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q1_gov}", payload: { assessed_rating: 2 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q1_ss}", payload: { assessed_rating: 3, gap_severity: "MAJOR" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q1_aud}", payload: { assessed_rating: 1 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/questionnaires/${q1_id}/assessment-decision", payload: { action: "ASSESS", variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${r_id}/risk-assessment", payload: { variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${r_id}/approval", payload: { action: "APPROVE" }, as: CommitteeApprover, as_user_id: "user-committee-01" }
            - { call: "GET /correspondent-banking/respondents/${r_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { rv2: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${r_id}/questionnaires", payload: { questionnaire_version: 2, expected_respondent_version: "${rv2}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_id: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_gov: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_kyc: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_tm: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_ss: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_pep: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/control-assessments", payload: { control_domain: "TRAINING", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_trn: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/control-assessments", payload: { control_domain: "AUDIT", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_aud: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 5 }, as: RespondentContact, as_user_id: "${r_id}", captures: { q2_nst: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${r_id}" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q2_gov}", payload: { assessed_rating: 2 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q2_ss}", payload: { assessed_rating: 3, gap_severity: "MAJOR" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q2_aud}", payload: { assessed_rating: 1 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q2_kyc}", payload: { assessed_rating: 1 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q2_tm}", payload: { assessed_rating: 1 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q2_pep}", payload: { assessed_rating: 1 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q2_trn}", payload: { assessed_rating: 1 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "PATCH /correspondent-banking/control-assessments/${q2_nst}", payload: { assessed_rating: 1 }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
          trigger:
            - { call: "POST /correspondent-banking/questionnaires/${q2_id}/assessment-decision", payload: { action: "ASSESS", variant: "REFRESH_FINAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
          assert:
            - "trigger HTTP status == 200"
            - "DueDiligenceQuestionnaire.${q1_id}.control_score_variant == ONBOARDING_PROVISIONAL"
            - "DueDiligenceQuestionnaire.${q1_id}.computed_control_score == 75.00   # raw 78.80 = round((0.10*2+0.18*5+0.20*5+0.22*3+0.10*5+0.05*5+0.08*1+0.07*5)*20.0, 2); one MAJOR row -> min(78.80, CAP_ONE_MAJOR 75.00)"
            - "DueDiligenceQuestionnaire.${q2_id}.control_score_variant == REFRESH_FINAL"
            - "DueDiligenceQuestionnaire.${q2_id}.computed_control_score == 30.80   # round((0.10*2+0.18*1+0.20*1+0.22*3+0.10*1+0.05*1+0.08*1+0.07*1)*20.0, 2) = 30.80; cap 75.00 inert"
            - "RespondentBank.${r_id}.control_score == 30.80"
            - "DueDiligenceQuestionnaire.${q1_id}.state == ASSESSED"
            - "DueDiligenceQuestionnaire.${q2_id}.state == ASSESSED"
            - "ControlAssessment.${q2_ss}.remediation_required == true"
            - "ControlAssessment.${q2_kyc}.self_rating == 5 and ControlAssessment.${q2_kyc}.assessed_rating == 1   # REFRESH_FINAL credited 1, not 5"
            - "RespondentBank.${r_id}.dd_state == APPROVED   # the variant gate is dd_state-driven: ONBOARDING_PROVISIONAL on this questionnaire would be refused here, and REFRESH_FINAL would have been refused on v1"
            - "before the trigger: RespondentBank.${r_id}.control_score == 75.00 and RespondentBank.${r_id}.control_credit == 0.3094 and RespondentBank.${r_id}.residual_risk_score == 9.67 and RespondentBank.${r_id}.risk_rating == LOW"

      - name: wind_down_cap_forward_projection_vs_capped_three_period_chronological_mean
        grounds:
          - calculations.wind_down_cap
          - calculations.notice_period_days
          - calculations.monitoring_threshold_calibration
          - entities.ClosurePlan.fields.cap_basis
          - entities.ClosurePlan.fields.wind_down_cap_usd
          - entities.ActivityObservation.fields.aggregate_usd
        distinguishing_aspect: |
          Two ClosurePlan rows with the identical notice period (COMMERCIAL, 90 days, zero
          obligation, 3.0 months) and the identical declared expected_monthly_volume_usd of
          4500000.00 diverge only by cap_basis: FORWARD_PROJECTED yields 8100000.00 from the
          declared volume while CHRONOLOGICAL_ACTUAL yields 8833500.00 from the mean of the last
          three distinct observation months after each month is capped at 1.25 x
          aggregate_usd_threshold - the ClosurePlan entity domain, distinct from the
          questionnaire/ControlAssessment domain of the control_score instance above.
        test_recipe:
          setup: >
            JurisdictionProfile DE with corridor_risk_weight 1.00 and basel_aml_index 4.0
            (jurisdiction_risk_points 8.00). Respondent A is licensed and scored once under
            ONBOARDING_PROVISIONAL with eight self_rating=4 domains, giving control_score 80.00,
            control_credit 0.3375, inherent_risk_score 20.00, residual 13.25 and risk_rating LOW
            - which satisfies the PROVISIONAL -> CALIBRATED precondition risk_rating != UNRATED
            while still selecting rating_factor 1.30. It owns a CALIBRATED
            TransactionMonitoringProfile over the CLOSED
            interval 2026-01-01T00:00:00Z..2026-12-31T00:00:00Z with one DE corridor expecting
            4000000.00 USD / 200 payments and tolerance 0.15, giving corridor threshold
            5980000.00, aggregate_usd_threshold 6578000.00 and hold_threshold_usd 657800.00.
            Four monthly observations exist (2026-04 1000000.00, 2026-05 3000000.00, 2026-06
            9500000.00, 2026-07 3500000.00); only the last three months feed the chronological
            basis and 2026-06 is clipped to the per-period cap 8222500.00. Respondent B is
            created with the identical expected_monthly_volume_usd and no observations at all,
            and its FORWARD_PROJECTED plan is already APPROVED. Respondent A's
            CHRONOLOGICAL_ACTUAL plan sits in PENDING_APPROVAL awaiting the trigger.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Rhein Handelsbank AG", swift_bic: "RHEIDEFFXXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 4500000.00, expected_monthly_count: 300 }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { a_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${a_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${a_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { av0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${a_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${av0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${a_id}", captures: { qa_id: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 4 }, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 4 }, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 4 }, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 4 }, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/control-assessments", payload: { control_domain: "PEP_HANDLING", self_rating: 4 }, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/control-assessments", payload: { control_domain: "TRAINING", self_rating: 4 }, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/control-assessments", payload: { control_domain: "AUDIT", self_rating: 4 }, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/control-assessments", payload: { control_domain: "NESTED_CONTROLS", self_rating: 4 }, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/submission", payload: {}, as: RespondentContact, as_user_id: "${a_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${qa_id}/assessment-decision", payload: { action: "ASSESS", variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${a_id}/risk-assessment", payload: { variant: "ONBOARDING_PROVISIONAL" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${a_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { av1: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${a_id}/monitoring-profiles", payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", tolerance_pct: 0.15, expected_corridors: [ { jurisdiction_code: "DE", expected_monthly_usd: 4000000.00, expected_monthly_count: 200 } ], expected_respondent_version: "${av1}" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { prof_id: $.data.id } }
            - { call: "POST /correspondent-banking/monitoring-profiles/${prof_id}/calibration", payload: { action: "CALIBRATE" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/monitoring-profiles/${prof_id}/observations", payload: { period_month: "2026-04", corridor_jurisdiction_code: "DE", aggregate_usd: 1000000.00, txn_count: 10, distinct_downstream_count: 0 }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/monitoring-profiles/${prof_id}/observations", payload: { period_month: "2026-05", corridor_jurisdiction_code: "DE", aggregate_usd: 3000000.00, txn_count: 10, distinct_downstream_count: 0 }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/monitoring-profiles/${prof_id}/observations", payload: { period_month: "2026-06", corridor_jurisdiction_code: "DE", aggregate_usd: 9500000.00, txn_count: 10, distinct_downstream_count: 0 }, as: PlatformAdmin, captures: { obs_jun: $.data.id } }
            - { call: "POST /correspondent-banking/monitoring-profiles/${prof_id}/observations", payload: { period_month: "2026-07", corridor_jurisdiction_code: "DE", aggregate_usd: 3500000.00, txn_count: 10, distinct_downstream_count: 0 }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents/${a_id}/closure-plans", payload: { termination_reason: "COMMERCIAL", cap_basis: "CHRONOLOGICAL_ACTUAL", original_obligation_cents: 0 }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { plan_a: $.data.id } }
            - { call: "POST /correspondent-banking/closure-plans/${plan_a}/submission", payload: {}, as: FIGRelationshipManager, as_user_id: "user-rm-01" }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Bayern Aussenhandelsbank AG", swift_bic: "BAYEDEFFXXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 4500000.00, expected_monthly_count: 300 }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { b_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${b_id}/closure-plans", payload: { termination_reason: "COMMERCIAL", cap_basis: "FORWARD_PROJECTED", original_obligation_cents: 0 }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { plan_b: $.data.id } }
            - { call: "POST /correspondent-banking/closure-plans/${plan_b}/submission", payload: {}, as: FIGRelationshipManager, as_user_id: "user-rm-01" }
            - { call: "POST /correspondent-banking/closure-plans/${plan_b}/approval", payload: { action: "APPROVE" }, as: CommitteeApprover, as_user_id: "user-committee-01" }
          trigger:
            - { call: "POST /correspondent-banking/closure-plans/${plan_a}/approval", payload: { action: "APPROVE" }, as: CommitteeApprover, as_user_id: "user-committee-01" }
          assert:
            - "trigger HTTP status == 200"
            - "RespondentBank.${a_id}.risk_rating == LOW   # residual 13.25 = round(round(20.00*(1-0.3375),2)+0.00, 2)"
            - "TransactionMonitoringProfile.${prof_id}.calibration_state == CALIBRATED"
            - "TransactionMonitoringProfile.${prof_id}.aggregate_usd_threshold == 6578000.00  # round(round(clamp(4000000.00*1.15*1.30/1.00,10000.00,500000000.00),2)*1.10, 2)"
            - "TransactionMonitoringProfile.${prof_id}.hold_threshold_usd == 657800.00"
            - "ClosurePlan.${plan_b}.notice_period_days == 90"
            - "ClosurePlan.${plan_b}.cap_basis == FORWARD_PROJECTED"
            - "ClosurePlan.${plan_b}.wind_down_cap_usd == 8100000.00   # round(4500000.00 * (90/30.0) * 0.60, 2)"
            - "ClosurePlan.${plan_a}.notice_period_days == 90"
