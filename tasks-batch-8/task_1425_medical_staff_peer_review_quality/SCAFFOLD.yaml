scenario: |
  Medical Staff Peer Review & Quality (hospital peer review committee): case referral & screening criteria, reviewer assignment with conflict avoidance, scoring of care appropriateness & opportunities for improvement, committee deliberation & final rating, provider notification & response opportunity, trend tracking across cases & focused review trigger, external review referral, confidentiality/privilege protection

domain_name: medical-staff-peer-review
api_prefix: /peer-review

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: multi-party negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Provider full legal name. Non-empty."
      - name: specialty
        type: enum
        source: input
        description: "Clinical specialty; used by reviewer_eligibility_and_ranking to order same-specialty candidates first."
        constraints: "One of INTERNAL_MEDICINE, SURGERY, CARDIOLOGY, PEDIATRICS, EMERGENCY_MEDICINE, ANESTHESIOLOGY, OBSTETRICS, PSYCHIATRY"

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the clinician who sits on the committee. At most one ACTIVE CommitteeMember row per Provider."
      - name: specialty
        type: enum
        source: computed
        description: "Denormalized from Provider[provider_id].specialty at creation; client-supplied value ignored."
        constraints: "Same enum as Provider.specialty"
      - name: member_role
        type: enum
        source: input
        description: "Committee role. CHAIR is required to screen-adjacent committee actions: finalize-deliberation, committee-review, finalize-after-response."
        constraints: "One of MEMBER, CHAIR"
      - name: status
        type: enum
        source: system
        description: "ACTIVE members are eligible for assignment; INACTIVE members are excluded from reviewer_eligibility_and_ranking and cannot be assigned."
        default: ACTIVE
        constraints: "One of ACTIVE, INACTIVE"
      - name: reliability_completed_count
        type: integer
        source: system
        description: "Number of this member's ReviewAssignment rows in status SUBMITTED. Incremented on submit; never decremented; ranking tie input for reviewer_eligibility_and_ranking."
        default: 0

  - name: ConflictDeclaration
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> CommitteeMember.id; the conflicted committee member."
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider this member is conflicted against."
      - name: conflict_type
        type: enum
        source: input
        description: "Nature of the conflict."
        constraints: "One of PRIOR_TREATING, FAMILY, FINANCIAL, SUPERVISORY, OTHER"
      - name: source
        type: enum
        source: system
        description: "SELF_DECLARED when posted by the member; AUTO_CASE_RESOLVED when created by the case-resolution cascade for each reviewer with a SUBMITTED assignment on the resolved case."
        constraints: "One of SELF_DECLARED, AUTO_CASE_RESOLVED"

  - name: ReviewCase
    parent: null
    common_fields: true
    fields:
      - name: subject_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider whose care is under review."
      - name: referral_source
        type: enum
        source: input
        description: "Intake channel for the referral."
        constraints: "One of INCIDENT_REPORT, PATIENT_COMPLAINT, STAFF_REFERRAL, INSURER_INQUIRY, OTHER"
      - name: referred_at
        type: datetime
        source: input
        description: "Timestamp the referring party logged the concern (ISO 8601 UTC)."
      - name: description
        type: string
        source: input
        description: "Free-text referral narrative. Non-empty."
      - name: status
        type: enum
        source: system
        description: "Case lifecycle state (see state_machines.ReviewCase)."
        default: REFERRED
        constraints: "One of REFERRED, SCREENED_IN, SCREENED_OUT, ASSIGNED, IN_REVIEW, DELIBERATION, NOTIFIED, RESPONDED, COMMITTEE_REVIEW, CLOSED, EXTERNAL_REVIEW"
      - name: screened_out_reason
        type: enum
        source: system
        description: "Set only when screened with decision SCREEN_OUT; null otherwise."
        constraints: "One of DUPLICATE, FRIVOLOUS, OUT_OF_SCOPE, OTHER; nullable"
      - name: screened_out_at
        type: datetime
        source: system
        description: "Clock timestamp at which the case entered SCREENED_OUT; null otherwise. Feeds referral_cooldown_window."
      - name: focus_group_id
        type: string
        source: system
        description: "FK -> FocusGroup.id; nullable. Stamped when the case reaches CLOSED or EXTERNAL_REVIEW while the subject has an ACTIVE FocusedReview with at least one FocusGroup; the selected group is the one with the fewest attached cases, tie broken by created_at ASC. Remains null when no ACTIVE FocusedReview or no groups exist."
      - name: closure_basis
        type: enum
        source: system
        description: "POST_RESPONSE when closed via finalize-after-response; NO_RESPONSE when closed via close-no-response; null until CLOSED."
        constraints: "One of POST_RESPONSE, NO_RESPONSE; nullable"
      - name: closed_at
        type: datetime
        source: system
        description: "Clock timestamp at which the case entered CLOSED; null otherwise."

  - name: ReviewAssignment
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ReviewCase.id; the case under review (taken from the path)."
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> CommitteeMember.id; the assigned reviewer."
      - name: sequence
        type: integer
        source: computed
        description: "1-based ordinal of this assignment within the case: count of all existing ReviewAssignment rows for the case (any status, including WAIVED) + 1 at creation. Never reused."
      - name: status
        type: enum
        source: system
        description: "PENDING until submitted; WAIVED by the member-deactivation cascade. WAIVED rows free their slot toward the per-case cap of 3 non-WAIVED assignments."
        default: PENDING
        constraints: "One of PENDING, SUBMITTED, WAIVED"
      - name: care_appropriateness_score
        type: integer
        source: input
        description: "Reviewer score of care appropriateness, integer 1 (unacceptable) to 5 (fully appropriate). Null until submit; rewritten by revise."
        constraints: "1..5; nullable"
      - name: ofi_score
        type: integer
        source: input
        description: "Opportunities-for-improvement severity, integer 1..5 (5 = most severe). Null when the reviewer identifies no opportunity."
        constraints: "1..5; nullable"
      - name: submitted_at
        type: datetime
        source: system
        description: "Clock timestamp of first submit; null while PENDING. Not modified by revise."

  - name: CaseNote
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> ReviewCase.id; the case annotated (taken from the path)."
      - name: author_member_id
        type: string
        source: system
        description: "FK -> CommitteeMember.id; set from the X-User-ID header of the acting CommitteeMember."
      - name: body
        type: string
        source: input
        description: "Privileged committee note text. Non-empty. Never visible to the Provider role."
      - name: note_type
        type: enum
        source: input
        description: "GENERAL or DELIBERATION classification."
        default: GENERAL
        constraints: "One of GENERAL, DELIBERATION"

  - name: Deliberation
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ReviewCase.id; exactly one Deliberation per case, created by the auto-open cascade when the third distinct assignment is submitted."
      - name: status
        type: enum
        source: system
        description: "OPEN while the case is in DELIBERATION; FINALIZED after finalize-deliberation."
        default: OPEN
        constraints: "One of OPEN, FINALIZED"
      - name: rating
        type: enum
        source: computed
        description: "Committee final rating computed by committee_rating_aggregation from the three submitted assignments at finalize time; recomputed by finalize-after-response. Null while OPEN."
        constraints: "One of APPROPRIATE, MINOR_OFI, MAJOR_OFI, UNACCEPTABLE; nullable"
      - name: rationale_note
        type: string
        source: input
        description: "CHAIR-supplied rationale captured at finalize-deliberation; nullable."
      - name: reconsideration_note
        type: string
        source: input
        description: "CHAIR-supplied note captured at finalize-after-response; nullable."
      - name: opened_at
        type: datetime
        source: system
        description: "Clock timestamp when the Deliberation auto-opened."
      - name: finalized_at
        type: datetime
        source: system
        description: "Clock timestamp of finalize-deliberation; null while OPEN. provider_trend_metrics keys rated-case window membership on this field."
      - name: reconsidered_at
        type: datetime
        source: system
        description: "Clock timestamp of finalize-after-response; null unless the response loop completed."

  - name: ProviderNotification
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ReviewCase.id; exactly one notification per case, created by the finalize-deliberation cascade."
      - name: sent_at
        type: datetime
        source: system
        description: "Clock timestamp when the case entered NOTIFIED."
      - name: response_deadline
        type: datetime
        source: computed
        description: "notification_response_window: sent_at + 14 days exactly. Responses accepted while current logical time <= response_deadline (inclusive)."

  - name: ProviderResponse
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ReviewCase.id; at most one response per case (taken from the path)."
      - name: response_text
        type: string
        source: input
        description: "Provider's written response to the committee rating. Non-empty."
      - name: submitted_at
        type: datetime
        source: system
        description: "Clock timestamp of submission."

  - name: ExternalReferral
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: system
        description: "FK -> ReviewCase.id; the case referred to an external review body (taken from the path)."
      - name: reason
        type: string
        source: input
        description: "Why the committee escalated to external review. Non-empty."
      - name: referred_at
        type: datetime
        source: system
        description: "Clock timestamp of the referral."

  - name: FocusedReview
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider under focused review. At most one ACTIVE FocusedReview per Provider at any time (half-open interval semantics: a new one may open at the exact instant the prior one closed)."
      - name: trigger_type
        type: enum
        source: system
        description: "AUTOMATIC when created by focused_review_trigger_evaluation on a case resolution; MANUAL when opened by the QualityDirector."
        constraints: "One of AUTOMATIC, MANUAL"
      - name: basis
        type: string
        source: input
        description: "Free-text basis for a MANUAL opening; null for AUTOMATIC (snapshot carries the evidence)."
      - name: trigger_snapshot
        type: object
        source: computed
        description: "For AUTOMATIC: { window_start, window_end, rated_case_count, avg_care_appropriateness, major_ofi_case_count, unacceptable_case_count } captured at trigger time. Null for MANUAL."
      - name: status
        type: enum
        source: system
        description: "ACTIVE while the focused review runs; CLOSED by the QualityDirector."
        default: ACTIVE
        constraints: "One of ACTIVE, CLOSED"
      - name: opened_at
        type: datetime
        source: system
        description: "Clock timestamp of creation."
      - name: closed_at
        type: datetime
        source: system
        description: "Clock timestamp of closure; null while ACTIVE."
      - name: resolution_note
        type: string
        source: input
        description: "QualityDirector's resolution summary captured at close; required by close endpoint."

  - name: FocusGroup
    parent: null
    common_fields: true
    fields:
      - name: focus_id
        type: string
        source: input
        description: "FK -> FocusedReview.id; the focused review this group serves (taken from the path)."
      - name: name
        type: string
        source: input
        description: "Group display name. Non-empty."

  - name: FocusGroupMember
    parent: null
    common_fields: false
    fields:
      - name: focus_group_id
        type: string
        source: system
        description: "FK -> FocusGroup.id (taken from the path)."
      - name: member_id
        type: string
        source: input
        description: "FK -> CommitteeMember.id; must be an ACTIVE member at add time. At most one membership row per (focus_group_id, member_id)."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ReviewCase
    initial_state: REFERRED
    terminal_states: [SCREENED_OUT, CLOSED, EXTERNAL_REVIEW]
    transitions:
      - from: REFERRED
        to: SCREENED_IN
        trigger: "POST /peer-review/cases/{id}/screen with decision=SCREEN_IN"
        actor: QualityDirector
        preconditions:
          - "case.status == REFERRED"
        side_effects:
          - "case.status = SCREENED_IN; case.version += 1; case.updated_at refreshed"
      - from: REFERRED
        to: SCREENED_OUT
        trigger: "POST /peer-review/cases/{id}/screen with decision=SCREEN_OUT"
        actor: QualityDirector
        preconditions:
          - "case.status == REFERRED"
          - "screened_out_reason present in request body (else ERR_SCREEN_OUT_REASON_REQUIRED)"
        side_effects:
          - "case.status = SCREENED_OUT; case.screened_out_reason set; case.screened_out_at = current clock; case.version += 1"
          - "arms referral_cooldown_window: subsequent POST /peer-review/cases for the same subject_provider_id is rejected while screened_out_at > current clock - 30 days"
      - from: SCREENED_IN
        to: ASSIGNED
        trigger: "POST /peer-review/cases/{id}/assignments (first assignment created)"
        actor: PeerReviewCoordinator
        preconditions:
          - "case.status == SCREENED_IN"
        side_effects:
          - "case.status = ASSIGNED; case.version += 1"
      - from: ASSIGNED
        to: IN_REVIEW
        trigger: "POST /peer-review/assignments/{id}/submit (first submission on the case)"
        actor: CommitteeMember
        preconditions:
          - "case.status == ASSIGNED"
          - "assignment.status == PENDING"
        side_effects:
          - "case.status = IN_REVIEW; case.version += 1"
      - from: IN_REVIEW
        to: DELIBERATION
        trigger: "POST /peer-review/assignments/{id}/submit (third distinct submitted assignment)"
        actor: system
        preconditions:
          - "case.status == IN_REVIEW"
          - "count of SUBMITTED ReviewAssignment rows for the case == 3 after this submission"
        side_effects:
          - "case.status = DELIBERATION; case.version += 1"
          - "cascade link 2 (caused by case entering DELIBERATION): create Deliberation row for the case with status OPEN, opened_at = current clock, rating = null"
      - from: DELIBERATION
        to: NOTIFIED
        trigger: "POST /peer-review/cases/{id}/finalize-deliberation"
        actor: CommitteeMember
        preconditions:
          - "case.status == DELIBERATION"
          - "acting member's member_role == CHAIR (else ERR_CHAIR_REQUIRED)"
          - "focus panel quorum: if the subject provider has an ACTIVE FocusedReview, at least 2 of the case's SUBMITTED reviewers must be members of at least one FocusGroup of that FocusedReview (else ERR_FOCUS_PANEL_QUORUM_NOT_MET)"
        side_effects:
          - "committee_rating_aggregation runs over the 3 SUBMITTED assignments; Deliberation.rating set; Deliberation.status = FINALIZED; Deliberation.finalized_at = current clock; Deliberation.rationale_note stored"
          - "case.status = NOTIFIED; case.version += 1"
          - "cascade link 2 (caused by case entering NOTIFIED): create ProviderNotification with sent_at = current clock, response_deadline = sent_at + 14 days"
      - from: NOTIFIED
        to: RESPONDED
        trigger: "POST /peer-review/cases/{id}/response"
        actor: Provider
        preconditions:
          - "case.status == NOTIFIED"
          - "acting provider id == case.subject_provider_id (else ERR_FORBIDDEN_RESOURCE)"
          - "current clock <= notification.response_deadline (else ERR_RESPONSE_WINDOW_CLOSED)"
        side_effects:
          - "create ProviderResponse with submitted_at = current clock"
          - "case.status = RESPONDED; case.version += 1"
      - from: RESPONDED
        to: COMMITTEE_REVIEW
        trigger: "POST /peer-review/cases/{id}/committee-review"
        actor: CommitteeMember
        preconditions:
          - "case.status == RESPONDED"
          - "acting member's member_role == CHAIR (else ERR_CHAIR_REQUIRED)"
        side_effects:
          - "case.status = COMMITTEE_REVIEW; case.version += 1"
      - from: COMMITTEE_REVIEW
        to: CLOSED
        trigger: "POST /peer-review/cases/{id}/finalize-after-response"
        actor: CommitteeMember
        preconditions:
          - "case.status == COMMITTEE_REVIEW"
          - "acting member's member_role == CHAIR (else ERR_CHAIR_REQUIRED)"
        side_effects:
          - "committee_rating_aggregation re-runs over the current 3 SUBMITTED assignments (picks up any revise edits); Deliberation.rating updated; Deliberation.reconsideration_note stored; Deliberation.reconsidered_at = current clock; Deliberation.version += 1"
          - "cascade link 1: case.status = CLOSED; case.closure_basis = POST_RESPONSE; case.closed_at = current clock; case.version += 1"
          - "cascade link 2 (caused by case entering CLOSED): provider_trend_metrics recomputed for case.subject_provider_id, then focused_review_trigger_evaluation runs"
          - "cascade link 3 (caused by the trigger evaluation): if any threshold predicate is true and the provider has no ACTIVE FocusedReview, create FocusedReview with trigger_type = AUTOMATIC and trigger_snapshot = current metrics; if one is already ACTIVE, no row is created"
          - "case-resolution cascade: for each SUBMITTED ReviewAssignment on this case, create ConflictDeclaration(member_id = assignment.reviewer_id, provider_id = case.subject_provider_id, source = AUTO_CASE_RESOLVED) unless an identical (member_id, provider_id) declaration already exists"
          - "if the provider has an ACTIVE FocusedReview with at least one FocusGroup: stamp case.focus_group_id = the group with fewest attached cases (tie-break created_at ASC); else leave null"
      - from: NOTIFIED
        to: CLOSED
        trigger: "POST /peer-review/cases/{id}/close-no-response"
        actor: QualityDirector
        preconditions:
          - "case.status == NOTIFIED"
          - "current clock > notification.response_deadline (else ERR_RESPONSE_WINDOW_OPEN)"
        side_effects:
          - "case.status = CLOSED; case.closure_basis = NO_RESPONSE; case.closed_at = current clock; case.version += 1"
          - "same cascade chain as COMMITTEE_REVIEW -> CLOSED: trend recompute -> focused_review_trigger_evaluation -> optional AUTOMATIC FocusedReview; AUTO_CASE_RESOLVED ConflictDeclarations for SUBMITTED reviewers; focus_group_id stamping"
      - from: DELIBERATION
        to: EXTERNAL_REVIEW
        trigger: "POST /peer-review/cases/{id}/refer-external"
        actor: QualityDirector
        preconditions:
          - "case.status == DELIBERATION"
        side_effects:
          - "create ExternalReferral with referred_at = current clock and reason from request"
          - "case.status = EXTERNAL_REVIEW; case.version += 1"
          - "trend recompute + focused_review_trigger_evaluation run; the referred case has rating = null so it is excluded from the rated set"
          - "AUTO_CASE_RESOLVED ConflictDeclarations for SUBMITTED reviewers; focus_group_id stamping (same rules as closure cascade)"
      - from: COMMITTEE_REVIEW
        to: EXTERNAL_REVIEW
        trigger: "POST /peer-review/cases/{id}/refer-external"
        actor: QualityDirector
        preconditions:
          - "case.status == COMMITTEE_REVIEW"
        side_effects:
          - "same as DELIBERATION -> EXTERNAL_REVIEW except the case carries a FINALIZED rating, so it enters the rated set of provider_trend_metrics keyed on Deliberation.finalized_at"

  - entity: ReviewAssignment
    initial_state: PENDING
    terminal_states: [SUBMITTED, WAIVED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /peer-review/assignments/{id}/submit"
        actor: CommitteeMember
        preconditions:
          - "assignment.status == PENDING"
          - "acting member id == assignment.reviewer_id (else ERR_FORBIDDEN_RESOURCE)"
          - "case.status IN {ASSIGNED, IN_REVIEW} (else ERR_INVALID_STATE / ERR_ALREADY_TERMINAL)"
          - "expected_case_version == case.version (else ERR_STALE_VERSION)"
          - "care_appropriateness_score integer in 1..5; ofi_score, when present, integer in 1..5 (else ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "assignment.status = SUBMITTED; assignment.submitted_at = current clock; scores stored; assignment.version += 1"
          - "reviewer CommitteeMember.reliability_completed_count += 1; member.version += 1"
          - "case.version += 1; if this is the first submission: case.status ASSIGNED -> IN_REVIEW; if this is the third distinct submission: case.status IN_REVIEW -> DELIBERATION and Deliberation auto-created"
      - from: PENDING
        to: WAIVED
        trigger: "system cascade from POST /peer-review/committee-members/{id}/deactivate"
        actor: system
        preconditions:
          - "assignment.status == PENDING"
          - "assignment.reviewer_id == the deactivated member"
        side_effects:
          - "assignment.status = WAIVED; assignment.version += 1"
          - "housing case.version += 1 and case.updated_at refreshed (no case status change; a WAIVED slot may be refilled by a new assignment)"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /peer-review/assignments/{id}/revise"
        actor: CommitteeMember
        preconditions:
          - "assignment.status == SUBMITTED"
          - "acting member id == assignment.reviewer_id (else ERR_FORBIDDEN_RESOURCE)"
          - "case.status == COMMITTEE_REVIEW (else ERR_INVALID_STATE)"
          - "care_appropriateness_score integer in 1..5; ofi_score, when present, integer in 1..5 (else ERR_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "assignment.care_appropriateness_score and assignment.ofi_score overwritten; assignment.version += 1; assignment.submitted_at unchanged"
          - "case.version += 1; reliability_completed_count NOT incremented (revision is not a new submission)"

  - entity: CommitteeMember
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /peer-review/committee-members/{id}/deactivate"
        actor: QualityDirector
        preconditions:
          - "member.status == ACTIVE"
        side_effects:
          - "member.status = INACTIVE; member.version += 1"
          - "cascade: every PENDING ReviewAssignment with reviewer_id == member.id flips to WAIVED (each housing case.version += 1)"
          - "member.reliability_completed_count unchanged; SUBMITTED assignments unchanged"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /peer-review/committee-members/{id}/activate"
        actor: QualityDirector
        preconditions:
          - "member.status == INACTIVE"
          - "no other CommitteeMember row with the same provider_id is ACTIVE (else ERR_MEMBER_ALREADY_ACTIVE_FOR_PROVIDER)"
        side_effects:
          - "member.status = ACTIVE; member.version += 1"
          - "no retroactive un-waiver: previously WAIVED assignments stay WAIVED"

  - entity: Deliberation
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /peer-review/cases/{id}/finalize-deliberation"
        actor: CommitteeMember
        preconditions:
          - "case.status == DELIBERATION"
          - "acting member's member_role == CHAIR"
        side_effects:
          - "rating computed by committee_rating_aggregation; status = FINALIZED; finalized_at = current clock; version += 1"

  - entity: FocusedReview
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /peer-review/focused-reviews/{id}/close"
        actor: QualityDirector
        preconditions:
          - "focused_review.status == ACTIVE"
          - "resolution_note present in request body (else ERR_VALIDATION)"
        side_effects:
          - "status = CLOSED; closed_at = current clock; resolution_note stored; version += 1"
          - "existing FocusGroup rows persist; new FocusGroup creation and member additions under a CLOSED review are rejected (ERR_INVALID_STATE)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-case
    parent_entity: ReviewCase
    write_endpoint: "POST /peer-review/cases/{id}/assignments"
    occ_field: expected_case_version
    description: |
      Creating a ReviewAssignment against a ReviewCase whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just added a reviewer (which
      legitimately consumes one of the three non-WAIVED slots) and the
      current writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: assignment-submit-stale-case
    parent_entity: ReviewCase
    write_endpoint: "POST /peer-review/assignments/{id}/submit"
    occ_field: expected_case_version
    description: |
      Submitting a score against a ReviewCase whose version has advanced
      since the reviewer last observed it is rejected. This captures the
      case where another reviewer's submission has just advanced the case
      (status flip and/or deliberation auto-open) and the current
      submission is therefore based on a stale view of the case.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: committee_rating_aggregation
    trigger: "Runs at finalize-deliberation (DELIBERATION -> NOTIFIED) and re-runs at finalize-after-response (COMMITTEE_REVIEW -> CLOSED) over the case's three SUBMITTED ReviewAssignment rows."
    algorithm: severity_precedence_mapping
    formula: |
      Let C = [care_appropriateness_score of the 3 SUBMITTED assignments].
      Let O = [ofi_score of the 3 SUBMITTED assignments where ofi_score IS NOT NULL].
      Evaluate in order; first match wins:
        1. count(c in C : c == 1) >= 1                      -> UNACCEPTABLE
        2. count(c in C : c <= 2) >= 2 OR count(o in O : o >= 4) >= 2 -> MAJOR_OFI
        3. count(c in C : c <= 2) == 1 OR count(o in O : o >= 4) == 1 OR |O| >= 1 -> MINOR_OFI
        4. otherwise                                       -> APPROPRIATE
    input_set: "Exactly the ReviewAssignment rows of the case with status SUBMITTED at evaluation time (always 3; deliberation cannot open otherwise). WAIVED and PENDING rows excluded."
    constants:
      UNACCEPTABLE_SCORE: 1
      LOW_SCORE_CEILING: 2
      MAJOR_OFI_FLOOR: 4
      ASSIGNMENTS_PER_CASE: 3
    precision: "integer scoring; no rounding"
    variants:
      - name: majority_vote_rating
        when: "Documented alternative the committee rejected; never applied by the server."
        difference: "Bands each reviewer's care score (1 -> UNACCEPTABLE, 2 -> MAJOR_OFI, 3..4 with any OFI -> MINOR_OFI, else APPROPRIATE) and takes the modal band. Diverges from the pinned rule: C=[1,5,5], O=[] yields APPROPRIATE under majority_vote_rating but UNACCEPTABLE under the pinned severity-precedence rule."

  - name: provider_trend_metrics
    trigger: "Recomputed when a case enters CLOSED or EXTERNAL_REVIEW, and on every GET /peer-review/providers/{id}/quality-trend."
    algorithm: aggregation
    formula: |
      Let RATED = all ReviewCase rows with subject_provider_id == provider,
        status IN {CLOSED, EXTERNAL_REVIEW}, a FINALIZED Deliberation with
        rating IS NOT NULL, and Deliberation.finalized_at in the half-open
        window (now - 365 days, now] (strictly after now-365d, at or before now).
      per_case_avg(c) = round_half_up(mean of the 3 SUBMITTED care_appropriateness_score values of case c, 2 decimal places)
      rated_case_count = |RATED|
      avg_care_appropriateness = round_half_up(mean of per_case_avg(c) over c in RATED, 2 decimal places); null when rated_case_count == 0
      major_ofi_case_count = count(c in RATED : rating == MAJOR_OFI)
      unacceptable_case_count = count(c in RATED : rating == UNACCEPTABLE)
      Rounding order is pinned: round each per-case mean first, then average
      the rounded per-case means. Averaging raw score sums first is a rejected
      interpretation (e.g. cases (3,3,3) and (3,3,2): pinned 2.84 vs raw 2.83).
    input_set: "Only rated cases as defined above. SCREENED_OUT cases, cases without a FINALIZED rating, and cases whose finalized_at falls outside the window are excluded."
    constants:
      TREND_WINDOW_DAYS: 365
    precision: "2 decimal places, round_half_up, per-case mean rounded before the window mean"
    variants:
      - name: score_mean_trend
        when: "Documented alternative interpretation of 'trend average'; never applied by the server."
        difference: "Averages every submitted care_appropriateness_score in the window directly (score-mean) instead of averaging per-case means (case-mean). Diverges whenever case score spreads differ: cases (3,3,3) and (3,3,2) give case-mean 2.84 vs score-mean 2.83."

  - name: focused_review_trigger_evaluation
    trigger: "Runs immediately after every provider_trend_metrics recompute that was caused by a case entering CLOSED or EXTERNAL_REVIEW."
    algorithm: threshold
    formula: |
      Using the freshly computed provider_trend_metrics values, fire when ANY
      predicate holds (OR semantics):
        rated_case_count >= 3
        avg_care_appropriateness < 3.0        (only when rated_case_count > 0)
        major_ofi_case_count >= 1
        unacceptable_case_count >= 1
      If firing AND the provider has no FocusedReview with status ACTIVE:
      create FocusedReview(trigger_type = AUTOMATIC, opened_at = now,
      trigger_snapshot = { window_start, window_end, rated_case_count,
      avg_care_appropriateness, major_ofi_case_count, unacceptable_case_count }).
      If an ACTIVE FocusedReview already exists, create nothing.
    input_set: "The provider_trend_metrics output for the subject provider at the instant of case resolution."
    constants:
      CASE_COUNT_THRESHOLD: 3
      AVG_THRESHOLD: 3.0
      MAJOR_OFI_COUNT_THRESHOLD: 1
      UNACCEPTABLE_COUNT_THRESHOLD: 1
    precision: "threshold comparisons on the rounded values produced by provider_trend_metrics"

  - name: reviewer_eligibility_and_ranking
    trigger: "Runs on GET /peer-review/cases/{id}/reviewer-candidates; the same eligibility predicates gate POST /peer-review/cases/{id}/assignments as validation errors."
    algorithm: selector_ranking
    formula: |
      Eligibility filter (candidate set), all required:
        member.status == ACTIVE
        member.provider_id != case.subject_provider_id
        no ConflictDeclaration row with member_id == member.id AND provider_id == case.subject_provider_id
        no ReviewAssignment row with case_id == case.id AND reviewer_id == member.id AND status != WAIVED
      Ranking expression (ASC unless noted):
        1. same_specialty: 0 when member.specialty == subject Provider.specialty else 1
        2. reliability_completed_count DESC
        3. created_at ASC   (final tie-break; id is never used)
      Empty-pool fallback: return an empty list (HTTP 200), never an error.
    input_set: "All CommitteeMember rows."
    constants:
      SAME_SPECIALTY_FIRST: 0
    precision: "not numeric"

  - name: notification_response_window
    trigger: "Evaluated on POST /peer-review/cases/{id}/response and POST /peer-review/cases/{id}/close-no-response."
    algorithm: threshold
    formula: |
      response_deadline = notification.sent_at + 14 days (exact second arithmetic)
      POST response:              accepted iff current_clock <= response_deadline; else ERR_RESPONSE_WINDOW_CLOSED
      POST close-no-response:     accepted iff current_clock >  response_deadline; else ERR_RESPONSE_WINDOW_OPEN
      At current_clock == response_deadline exactly, response is accepted and close-no-response is rejected.
    input_set: "The single ProviderNotification row of the case."
    constants:
      RESPONSE_WINDOW_DAYS: 14
    precision: "second-precision ISO 8601 comparison"

  - name: referral_cooldown_window
    trigger: "Evaluated on POST /peer-review/cases."
    algorithm: threshold
    formula: |
      Let S = the most recent ReviewCase (by screened_out_at) with
        subject_provider_id == payload.subject_provider_id AND status == SCREENED_OUT.
      If S exists and S.screened_out_at > current_clock - 30 days, reject with
      ERR_DUPLICATE_REFERRAL_WINDOW. A referral made exactly 30 days after the
      screen-out (S.screened_out_at == current_clock - 30 days) is allowed.
    input_set: "ReviewCase rows of the subject provider with status SCREENED_OUT."
    constants:
      REFERRAL_COOLDOWN_DAYS: 30
    precision: "second-precision ISO 8601 comparison"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role. Missing or unknown -> reject."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles."
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-template ids resolve to existing rows, left to right; then body FK ids (reviewer_id, provider_id, member_id, subject_provider_id), left to right."
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all (variant error per resource: ERR_PROVIDER_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_CONFLICT_NOT_FOUND, ERR_FOCUSED_REVIEW_NOT_FOUND, ERR_FOCUS_GROUP_NOT_FOUND, ERR_MEMBERSHIP_NOT_FOUND)"
  - priority: 4
    category: auth
    check: "Ownership/scope: Provider role may only touch ReviewCase rows where subject_provider_id == X-User-ID; CommitteeMember may only declare/rescind own conflicts, submit/revise own assignments; chair-only endpoints require acting member.member_role == CHAIR."
    error_id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    applies_to: "scoped endpoints (variant ERR_CHAIR_REQUIRED for finalize-deliberation, committee-review, finalize-after-response)"
  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition exists. If the current state is terminal (case in SCREENED_OUT/CLOSED/EXTERNAL_REVIEW), the terminal variant is returned."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (terminal variant ERR_ALREADY_TERMINAL)"
  - priority: 6
    category: state
    check: "OCC: expected_case_version, when required by the endpoint, equals the case's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /peer-review/cases/{id}/assignments, POST /peer-review/assignments/{id}/submit"
  - priority: 7
    category: business_safety
    check: "Peer-review conflict avoidance on assignment creation, in this order: reviewer member.status == ACTIVE (ERR_REVIEWER_INACTIVE); reviewer.provider_id != case.subject_provider_id (ERR_REVIEWER_IS_SUBJECT); no ConflictDeclaration (member_id == reviewer_id, provider_id == case.subject_provider_id) exists (ERR_REVIEWER_CONFLICT_DECLARED)."
    error_id: ERR_REVIEWER_CONFLICT_DECLARED
    http_status: 422
    applies_to: "POST /peer-review/cases/{id}/assignments"
  - priority: 8
    category: business_constraint
    check: "Input shape and per-resource constraint checks: required fields present, enums valid, datetimes well-formed (ERR_VALIDATION); SCREEN_OUT without screened_out_reason (ERR_SCREEN_OUT_REASON_REQUIRED); scores in 1..5 (ERR_SCORE_OUT_OF_RANGE); reviewer not already non-WAIVED-assigned to the case (ERR_REVIEWER_ALREADY_ASSIGNED); case has fewer than 3 non-WAIVED assignments (ERR_CASE_FULLY_ASSIGNED); no other ACTIVE membership for the provider on member create/activate (ERR_MEMBER_ALREADY_ACTIVE_FOR_PROVIDER); no duplicate (member_id, provider_id) conflict declaration (ERR_CONFLICT_ALREADY_DECLARED); no duplicate group membership (ERR_DUPLICATE_FOCUS_MEMBER); focus panel quorum on finalize-deliberation (ERR_FOCUS_PANEL_QUORUM_NOT_MET)."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints (variant errors and statuses as listed: 400 for ERR_VALIDATION/ERR_SCREEN_OUT_REASON_REQUIRED; 422 for ERR_SCORE_OUT_OF_RANGE/ERR_REVIEWER_ALREADY_ASSIGNED; 409 for ERR_CASE_FULLY_ASSIGNED/ERR_MEMBER_ALREADY_ACTIVE_FOR_PROVIDER/ERR_CONFLICT_ALREADY_DECLARED/ERR_DUPLICATE_FOCUS_MEMBER/ERR_FOCUS_PANEL_QUORUM_NOT_MET)"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: referral cooldown (ERR_DUPLICATE_REFERRAL_WINDOW); response within deadline (ERR_RESPONSE_WINDOW_CLOSED); close-no-response only after deadline (ERR_RESPONSE_WINDOW_OPEN)."
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /peer-review/cases, POST /peer-review/cases/{id}/response, POST /peer-review/cases/{id}/close-no-response (statuses: 409 for ERR_DUPLICATE_REFERRAL_WINDOW and ERR_RESPONSE_WINDOW_OPEN; 422 for ERR_RESPONSE_WINDOW_CLOSED)"
  - priority: 10
    category: business_referential
    check: "Aggregate uniqueness: at most one ACTIVE FocusedReview per provider on manual open (ERR_FOCUSED_REVIEW_ALREADY_ACTIVE)."
    error_id: ERR_FOCUSED_REVIEW_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /peer-review/focused-reviews"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Providers ---
  - method: POST
    path: "/peer-review/providers"
    description: "Register a provider (medical staff roster entry)."
    roles: [QualityDirector]
    code: 201
    input: [full_name, specialty]
    output: Provider
    side_effects: []
  - method: GET
    path: "/peer-review/providers"
    description: "List providers."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember, Provider]
    code: 200
    input: ["specialty?", "limit?", "offset?"]
    output: "Provider[]"
    side_effects: []
  - method: GET
    path: "/peer-review/providers/{id}"
    description: "Get one provider."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/peer-review/providers/{id}/cases"
    description: "List cases for a subject provider. Provider role may only list its own id (else ERR_FORBIDDEN_RESOURCE)."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember, Provider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ReviewCase[]"
    side_effects: []
  - method: GET
    path: "/peer-review/providers/{id}/conflict-declarations"
    description: "List conflict declarations naming this provider."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConflictDeclaration[]"
    side_effects: []
  - method: GET
    path: "/peer-review/providers/{id}/focused-reviews"
    description: "List focused reviews for a provider."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FocusedReview[]"
    side_effects: []
  - method: GET
    path: "/peer-review/providers/{id}/quality-trend"
    description: "Computed trend metrics per provider_trend_metrics over the trailing 365-day window (now-365d, now], plus trigger evaluation flags. Read-only; never creates a FocusedReview."
    roles: [QualityDirector, PeerReviewCoordinator]
    code: 200
    input: []
    output:
      provider_id: string
      window_start: datetime
      window_end: datetime
      rated_case_count: integer
      avg_care_appropriateness: "number|null"
      major_ofi_case_count: integer
      unacceptable_case_count: integer
      focused_review_would_trigger: boolean
      active_focused_review_id: "string|null"
    side_effects: []

  # --- Committee Members ---
  - method: POST
    path: "/peer-review/committee-members"
    description: "Seat a provider on the peer review committee. Rejected when another ACTIVE membership exists for the same provider (ERR_MEMBER_ALREADY_ACTIVE_FOR_PROVIDER)."
    roles: [QualityDirector]
    code: 201
    input: [provider_id, member_role]
    output: CommitteeMember
    side_effects: ["specialty denormalized from Provider; status = ACTIVE; reliability_completed_count = 0"]
  - method: GET
    path: "/peer-review/committee-members"
    description: "List committee members."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["provider_id?", "status?", "member_role?", "specialty?", "limit?", "offset?"]
    output: "CommitteeMember[]"
    side_effects: []
  - method: GET
    path: "/peer-review/committee-members/{id}"
    description: "Get one committee member."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: []
  - method: POST
    path: "/peer-review/committee-members/{id}/deactivate"
    description: "Deactivate a member. All of the member's PENDING assignments flip to WAIVED (each housing case.version increments); SUBMITTED assignments and reliability_completed_count are untouched."
    roles: [QualityDirector]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: ["member.status = INACTIVE; member.version += 1", "PENDING assignments -> WAIVED; each affected case.version += 1"]
  - method: POST
    path: "/peer-review/committee-members/{id}/activate"
    description: "Reactivate an INACTIVE member. Rejected when another ACTIVE membership exists for the same provider (ERR_MEMBER_ALREADY_ACTIVE_FOR_PROVIDER). WAIVED assignments are not restored."
    roles: [QualityDirector]
    code: 200
    input: []
    output: CommitteeMember
    side_effects: ["member.status = ACTIVE; member.version += 1"]
  - method: POST
    path: "/peer-review/committee-members/{id}/conflict-declarations"
    description: "Member self-declares a conflict with a provider. Acting member must equal {id} (else ERR_FORBIDDEN_RESOURCE); duplicate (member_id, provider_id) rejected (ERR_CONFLICT_ALREADY_DECLARED)."
    roles: [CommitteeMember]
    code: 201
    input: [provider_id, conflict_type]
    output: ConflictDeclaration
    side_effects: ["source = SELF_DECLARED"]
  - method: GET
    path: "/peer-review/committee-members/{id}/conflict-declarations"
    description: "List a member's conflict declarations."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConflictDeclaration[]"
    side_effects: []
  - method: DELETE
    path: "/peer-review/conflict-declarations/{id}"
    description: "Rescind a conflict declaration (hard delete). Only the declaring member may rescind (else ERR_FORBIDDEN_RESOURCE)."
    roles: [CommitteeMember]
    code: 204
    input: []
    output: null
    side_effects: ["row removed; the member becomes eligible for future assignments against that provider's cases"]
  - method: GET
    path: "/peer-review/committee-members/{id}/assignments"
    description: "List a member's review assignments."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ReviewAssignment[]"
    side_effects: []
  - method: GET
    path: "/peer-review/committee-members/{id}/notes"
    description: "List case notes authored by a member."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "CaseNote[]"
    side_effects: []
  - method: GET
    path: "/peer-review/committee-members/{id}/focus-group-memberships"
    description: "List a member's focus group memberships."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "FocusGroupMember[]"
    side_effects: []

  # --- Review Cases ---
  - method: POST
    path: "/peer-review/cases"
    description: "Refer a provider for peer review. Rejected while a referral cooldown is armed: the subject's most recent SCREENED_OUT case has screened_out_at > current clock - 30 days (ERR_DUPLICATE_REFERRAL_WINDOW)."
    roles: [PeerReviewCoordinator]
    code: 201
    input: [subject_provider_id, referral_source, referred_at, description]
    output: ReviewCase
    side_effects: ["status = REFERRED"]
  - method: GET
    path: "/peer-review/cases"
    description: "List review cases."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["status?", "subject_provider_id?", "focus_group_id?", "limit?", "offset?"]
    output: "ReviewCase[]"
    side_effects: []
  - method: GET
    path: "/peer-review/cases/{id}"
    description: "Get one case. Provider role may only read its own cases (else ERR_FORBIDDEN_RESOURCE)."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember, Provider]
    code: 200
    input: []
    output: ReviewCase
    side_effects: []
  - method: POST
    path: "/peer-review/cases/{id}/screen"
    description: "Screen a REFERRED case. decision=SCREEN_IN moves to SCREENED_IN; decision=SCREEN_OUT requires screened_out_reason, stamps screened_out_at, and arms the 30-day referral cooldown."
    roles: [QualityDirector]
    code: 200
    input: [decision, "screened_out_reason?"]
    output: ReviewCase
    side_effects: ["status transition per state_machines.ReviewCase; case.version += 1"]
  - method: GET
    path: "/peer-review/cases/{id}/reviewer-candidates"
    description: "Ranked eligible reviewer candidates per reviewer_eligibility_and_ranking (ACTIVE, not the subject, no declared conflict, not already non-WAIVED-assigned; same-specialty first, then reliability_completed_count DESC, then created_at ASC). Empty pool returns 200 with an empty list."
    roles: [PeerReviewCoordinator, QualityDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "CommitteeMember[]"
    side_effects: []
  - method: POST
    path: "/peer-review/cases/{id}/assignments"
    description: "Assign a reviewer to a case. OCC-guarded by expected_case_version. Eligibility rules per priority 7; case must be in SCREENED_IN, ASSIGNED, or IN_REVIEW with fewer than 3 non-WAIVED assignments."
    roles: [PeerReviewCoordinator]
    code: 201
    input: [reviewer_id, expected_case_version]
    output: ReviewAssignment
    side_effects: ["assignment created PENDING with sequence = existing assignment count (any status) + 1", "case.version += 1", "first assignment on a SCREENED_IN case flips it to ASSIGNED"]
  - method: GET
    path: "/peer-review/cases/{id}/assignments"
    description: "List assignments of a case, ordered by sequence ASC."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ReviewAssignment[]"
    side_effects: []
  - method: GET
    path: "/peer-review/assignments/{id}"
    description: "Get one assignment."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []
  - method: POST
    path: "/peer-review/assignments/{id}/submit"
    description: "Assigned reviewer submits care appropriateness (1..5) and optional OFI score (1..5). OCC-guarded by expected_case_version. First submission flips ASSIGNED -> IN_REVIEW; third distinct submission flips IN_REVIEW -> DELIBERATION and auto-creates the Deliberation."
    roles: [CommitteeMember]
    code: 200
    input: [care_appropriateness_score, "ofi_score?", expected_case_version]
    output: ReviewAssignment
    side_effects: ["assignment SUBMITTED; submitted_at stamped; assignment.version += 1", "reviewer reliability_completed_count += 1; member.version += 1", "case.version += 1 plus any status transition and Deliberation auto-create"]
  - method: POST
    path: "/peer-review/assignments/{id}/revise"
    description: "Original reviewer revises scores after reading the provider response. Allowed only while the case is in COMMITTEE_REVIEW and the assignment is SUBMITTED. Does not change reliability_completed_count."
    roles: [CommitteeMember]
    code: 200
    input: [care_appropriateness_score, "ofi_score?"]
    output: ReviewAssignment
    side_effects: ["scores overwritten; assignment.version += 1; case.version += 1"]
  - method: POST
    path: "/peer-review/cases/{id}/notes"
    description: "Add a privileged committee note. Allowed while case.status IN {ASSIGNED, IN_REVIEW, DELIBERATION, NOTIFIED, RESPONDED, COMMITTEE_REVIEW}. author_member_id is stamped from X-User-ID. Never exposed to the Provider role."
    roles: [CommitteeMember]
    code: 201
    input: [body, "note_type?"]
    output: CaseNote
    side_effects: []
  - method: GET
    path: "/peer-review/cases/{id}/notes"
    description: "List privileged notes of a case."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "CaseNote[]"
    side_effects: []
  - method: GET
    path: "/peer-review/cases/{id}/deliberation"
    description: "Get the case's Deliberation (list of 0 or 1)."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: []
    output: "Deliberation[]"
    side_effects: []
  - method: POST
    path: "/peer-review/cases/{id}/finalize-deliberation"
    description: "CHAIR finalizes deliberation: committee_rating_aggregation computes the rating, the Deliberation is FINALIZED, the case moves to NOTIFIED, and the ProviderNotification is created with response_deadline = sent_at + 14 days. Enforces the focus panel quorum when the subject has an ACTIVE FocusedReview."
    roles: [CommitteeMember]
    code: 200
    input: ["rationale_note?"]
    output: Deliberation
    side_effects: ["Deliberation FINALIZED with computed rating", "case.status = NOTIFIED; case.version += 1", "ProviderNotification created"]
  - method: GET
    path: "/peer-review/cases/{id}/notifications"
    description: "Get the case's notification (list of 0 or 1). Provider role may only read notifications of its own cases."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember, Provider]
    code: 200
    input: []
    output: "ProviderNotification[]"
    side_effects: []
  - method: POST
    path: "/peer-review/cases/{id}/response"
    description: "Subject provider responds to the committee rating. Only while NOTIFIED and current clock <= response_deadline (inclusive)."
    roles: [Provider]
    code: 201
    input: [response_text]
    output: ProviderResponse
    side_effects: ["ProviderResponse created", "case.status = RESPONDED; case.version += 1"]
  - method: GET
    path: "/peer-review/cases/{id}/response"
    description: "Get the case's provider response (list of 0 or 1). Provider role may only read responses of its own cases."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember, Provider]
    code: 200
    input: []
    output: "ProviderResponse[]"
    side_effects: []
  - method: POST
    path: "/peer-review/cases/{id}/committee-review"
    description: "CHAIR marks the provider response as committee-reviewed; case moves RESPONDED -> COMMITTEE_REVIEW, opening the score-revision window."
    roles: [CommitteeMember]
    code: 200
    input: []
    output: ReviewCase
    side_effects: ["case.status = COMMITTEE_REVIEW; case.version += 1"]
  - method: POST
    path: "/peer-review/cases/{id}/finalize-after-response"
    description: "CHAIR closes the response loop: committee_rating_aggregation re-runs over current scores, Deliberation.rating updated, case -> CLOSED with closure_basis = POST_RESPONSE. Triggers the resolution cascade (trend recompute, focused_review_trigger_evaluation, AUTO_CASE_RESOLVED conflict declarations, focus_group_id stamping)."
    roles: [CommitteeMember]
    code: 200
    input: ["reconsideration_note?"]
    output: Deliberation
    side_effects: ["rating recomputed; Deliberation.version += 1", "case CLOSED; case.version += 1", "trend/trigger cascade", "AUTO_CASE_RESOLVED declarations", "focus_group_id stamping"]
  - method: POST
    path: "/peer-review/cases/{id}/close-no-response"
    description: "QualityDirector closes a NOTIFIED case whose response deadline has passed (current clock > response_deadline). Same resolution cascade as finalize-after-response."
    roles: [QualityDirector]
    code: 200
    input: []
    output: ReviewCase
    side_effects: ["case CLOSED with closure_basis = NO_RESPONSE; case.version += 1", "trend/trigger cascade", "AUTO_CASE_RESOLVED declarations", "focus_group_id stamping"]
  - method: POST
    path: "/peer-review/cases/{id}/refer-external"
    description: "QualityDirector refers the case to an external review body from DELIBERATION or COMMITTEE_REVIEW. Creates the ExternalReferral record and runs the resolution cascade."
    roles: [QualityDirector]
    code: 201
    input: [reason]
    output: ExternalReferral
    side_effects: ["ExternalReferral created", "case.status = EXTERNAL_REVIEW; case.version += 1", "trend/trigger cascade", "AUTO_CASE_RESOLVED declarations", "focus_group_id stamping"]
  - method: GET
    path: "/peer-review/cases/{id}/external-referrals"
    description: "List external referrals of a case (0 or 1)."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: []
    output: "ExternalReferral[]"
    side_effects: []

  # --- Focused Reviews & Focus Groups ---
  - method: POST
    path: "/peer-review/focused-reviews"
    description: "QualityDirector manually opens a focused review (trigger_type = MANUAL). Rejected when the provider already has an ACTIVE FocusedReview (ERR_FOCUSED_REVIEW_ALREADY_ACTIVE); half-open semantics permit opening at the exact instant a prior one closed."
    roles: [QualityDirector]
    code: 201
    input: [provider_id, "basis?"]
    output: FocusedReview
    side_effects: ["status = ACTIVE; opened_at = current clock"]
  - method: GET
    path: "/peer-review/focused-reviews"
    description: "List focused reviews."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["provider_id?", "status?", "limit?", "offset?"]
    output: "FocusedReview[]"
    side_effects: []
  - method: GET
    path: "/peer-review/focused-reviews/{id}"
    description: "Get one focused review."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: []
    output: FocusedReview
    side_effects: []
  - method: POST
    path: "/peer-review/focused-reviews/{id}/close"
    description: "Close an ACTIVE focused review. Groups persist; further group creation/member additions under a CLOSED review are rejected."
    roles: [QualityDirector]
    code: 200
    input: [resolution_note]
    output: FocusedReview
    side_effects: ["status = CLOSED; closed_at = current clock; version += 1"]
  - method: POST
    path: "/peer-review/focused-reviews/{id}/focus-groups"
    description: "Create a focus group under an ACTIVE focused review."
    roles: [QualityDirector]
    code: 201
    input: [name]
    output: FocusGroup
    side_effects: []
  - method: GET
    path: "/peer-review/focused-reviews/{id}/focus-groups"
    description: "List focus groups of a focused review."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "FocusGroup[]"
    side_effects: []
  - method: GET
    path: "/peer-review/focus-groups/{id}"
    description: "Get one focus group."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: []
    output: FocusGroup
    side_effects: []
  - method: GET
    path: "/peer-review/focus-groups/{id}/cases"
    description: "List cases stamped into this focus group."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReviewCase[]"
    side_effects: []
  - method: POST
    path: "/peer-review/focus-groups/{id}/members"
    description: "Add an ACTIVE committee member to a focus group. Rejected when the member is INACTIVE (ERR_REVIEWER_INACTIVE), the parent focused review is CLOSED (ERR_INVALID_STATE), or the membership already exists (ERR_DUPLICATE_FOCUS_MEMBER)."
    roles: [QualityDirector]
    code: 201
    input: [member_id]
    output: FocusGroupMember
    side_effects: []
  - method: GET
    path: "/peer-review/focus-groups/{id}/members"
    description: "List members of a focus group."
    roles: [QualityDirector, PeerReviewCoordinator, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "FocusGroupMember[]"
    side_effects: []
  - method: DELETE
    path: "/peer-review/focus-groups/{id}/members/{memberId}"
    description: "Remove a member from a focus group. 404 ERR_MEMBERSHIP_NOT_FOUND when no membership row exists."
    roles: [QualityDirector]
    code: 204
    input: []
    output: null
    side_effects: ["membership row removed"]

  # --- Test-driving clock ---
  - method: POST
    path: "/peer-review/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO 8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [QualityDirector]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: datetime
    side_effects: ["logical clock set; all subsequent timestamps, deadlines, windows, and cooldowns evaluate against it"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not a declared role."
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Acting role is not in the endpoint's roles list."
  - id: ERR_FORBIDDEN_RESOURCE
    http: 403
    condition: "Role is permitted but the target resource is out of scope: Provider touching a case not its own; member declaring/rescinding another member's conflict; member submitting/revising another member's assignment."
  - id: ERR_CHAIR_REQUIRED
    http: 403
    condition: "finalize-deliberation, committee-review, or finalize-after-response attempted by a member whose member_role != CHAIR."
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "Provider id in path or body does not resolve."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "CommitteeMember id in path or body does not resolve."
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "ReviewCase id in path does not resolve."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "ReviewAssignment id in path does not resolve."
  - id: ERR_CONFLICT_NOT_FOUND
    http: 404
    condition: "ConflictDeclaration id in path does not resolve."
  - id: ERR_FOCUSED_REVIEW_NOT_FOUND
    http: 404
    condition: "FocusedReview id in path does not resolve."
  - id: ERR_FOCUS_GROUP_NOT_FOUND
    http: 404
    condition: "FocusGroup id in path does not resolve."
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "No FocusGroupMember row for the (groupId, memberId) pair on delete."
  - id: ERR_VALIDATION
    http: 400
    condition: "Required field missing, enum value invalid, datetime malformed, or string field empty."
  - id: ERR_SCREEN_OUT_REASON_REQUIRED
    http: 400
    condition: "POST screen with decision=SCREEN_OUT but no screened_out_reason."
  - id: ERR_SCORE_OUT_OF_RANGE
    http: 422
    condition: "care_appropriateness_score or ofi_score present but not an integer in 1..5."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition exists (and is not terminal)."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Action attempted on a case in a terminal state (SCREENED_OUT, CLOSED, EXTERNAL_REVIEW)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_case_version does not equal the case's current version (OCC per §1.2.1)."
  - id: ERR_REVIEWER_INACTIVE
    http: 422
    condition: "Assignment or focus-group addition naming an INACTIVE CommitteeMember."
  - id: ERR_REVIEWER_IS_SUBJECT
    http: 422
    condition: "Assignment reviewer_id's provider_id equals the case's subject_provider_id."
  - id: ERR_REVIEWER_CONFLICT_DECLARED
    http: 422
    condition: "A ConflictDeclaration (member_id == reviewer_id, provider_id == case.subject_provider_id) exists."
  - id: ERR_REVIEWER_ALREADY_ASSIGNED
    http: 422
    condition: "The reviewer already holds a non-WAIVED assignment on this case."
  - id: ERR_CASE_FULLY_ASSIGNED
    http: 409
    condition: "The case already has 3 non-WAIVED assignments."
  - id: ERR_MEMBER_ALREADY_ACTIVE_FOR_PROVIDER
    http: 409
    condition: "Create/activate of a CommitteeMember while another ACTIVE membership exists for the same provider."
  - id: ERR_CONFLICT_ALREADY_DECLARED
    http: 409
    condition: "A ConflictDeclaration with the same (member_id, provider_id) already exists."
  - id: ERR_DUPLICATE_FOCUS_MEMBER
    http: 409
    condition: "The member is already in the focus group."
  - id: ERR_FOCUS_PANEL_QUORUM_NOT_MET
    http: 409
    condition: "finalize-deliberation while the subject has an ACTIVE FocusedReview and fewer than 2 of the case's SUBMITTED reviewers belong to any FocusGroup of that review."
  - id: ERR_DUPLICATE_REFERRAL_WINDOW
    http: 409
    condition: "New case for a subject whose most recent SCREENED_OUT case has screened_out_at > current clock - 30 days."
  - id: ERR_RESPONSE_WINDOW_CLOSED
    http: 422
    condition: "Provider response attempted after response_deadline (current clock > deadline)."
  - id: ERR_RESPONSE_WINDOW_OPEN
    http: 409
    condition: "close-no-response attempted at or before response_deadline (current clock <= deadline)."
  - id: ERR_FOCUSED_REVIEW_ALREADY_ACTIVE
    http: 409
    condition: "Manual focused-review open while the provider already has an ACTIVE FocusedReview."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: QualityDirector
    description: "Hospital quality director; owns the roster, screening decisions, external referrals, focused reviews, focus groups, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /peer-review/providers"
      - "POST /peer-review/committee-members and activate/deactivate"
      - "POST /peer-review/cases/{id}/screen"
      - "POST /peer-review/cases/{id}/close-no-response"
      - "POST /peer-review/cases/{id}/refer-external"
      - "POST /peer-review/focused-reviews and close"
      - "POST /peer-review/focused-reviews/{id}/focus-groups"
      - "POST/DELETE /peer-review/focus-groups/{id}/members"
      - "POST /peer-review/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints (full read access across the surface)"
  - name: PeerReviewCoordinator
    description: "Committee coordinator; runs intake (case referral) and reviewer assignment logistics. Cannot screen, score, finalize, or refer externally."
    identity: opaque
    exclusive_operations:
      - "POST /peer-review/cases"
      - "POST /peer-review/cases/{id}/assignments"
    shared_operations:
      - "GET case/member/assignment/note/deliberation/notification/response/focus reads"
      - "GET /peer-review/cases/{id}/reviewer-candidates"
      - "GET /peer-review/providers/{id}/quality-trend"
  - name: CommitteeMember
    description: "Seated committee member (X-User-ID equals the CommitteeMember id). Reviews cases, declares own conflicts, writes privileged notes; CHAIR members additionally finalize deliberations and drive the response loop. Segregation of duties: a member may never review a case whose subject is their own provider identity, nor one they are conflicted against."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /peer-review/committee-members/{id}/conflict-declarations (self only)"
      - "DELETE /peer-review/conflict-declarations/{id} (self only)"
      - "POST /peer-review/assignments/{id}/submit (own assignments only)"
      - "POST /peer-review/assignments/{id}/revise (own assignments only)"
      - "POST /peer-review/cases/{id}/notes"
      - "POST /peer-review/cases/{id}/finalize-deliberation (CHAIR only)"
      - "POST /peer-review/cases/{id}/committee-review (CHAIR only)"
      - "POST /peer-review/cases/{id}/finalize-after-response (CHAIR only)"
    shared_operations:
      - "GET case/member/assignment/note/deliberation/notification/response/focus reads"
  - name: Provider
    description: "Medical staff provider (X-User-ID equals the Provider id). May read only its own cases, notifications, and responses, and may submit the single response to its own NOTIFIED case. All committee-privileged content (notes, deliberations, assignments, trends) is denied."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /peer-review/cases/{id}/response (own cases only)"
    shared_operations:
      - "GET /peer-review/providers and /peer-review/providers/{id}"
      - "GET /peer-review/providers/{id}/cases (own id only)"
      - "GET /peer-review/cases/{id}, GET .../notifications, GET .../response (own cases only)"
