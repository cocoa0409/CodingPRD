            - "ACCEPTED AgencyRequest of DOE with base_budget_cents 9000000000 carrying one RECOMMENDED EXPANSION DecisionPackage of 500000000 cents backed by a PerformanceMeasure"
            - "ACCEPTED AgencyRequest of DOH with base_budget_cents 1 and no packages"
            - "Cycle advanced to phase EXECUTIVE_PREP with one APPROVED ExecutiveRecommendation of 9500000000 cents on the DOE request"
