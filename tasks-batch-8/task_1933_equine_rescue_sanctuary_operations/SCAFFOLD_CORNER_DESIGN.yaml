            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad Two", contact_email: "a2@x.com", experience_level: NOVICE, has_stall_facility: false }, as: Adopter, captures: { ad2: $.data.id } }
          trigger:
            - { call: "GET /rescue-ops/adopters/${ad1}", as: Adopter, as_user_id: "${ad1}", captures: { got: $.data.id } }
            - { call: "GET /rescue-ops/adopters/${ad2}", as: Adopter, as_user_id: "${ad1}", captures: { err: $.data.error_id } }
          assert:
            - "got == ${ad1} (self read allowed)"
            - "err == ERR_FORBIDDEN (cross-adopter read denied)"

