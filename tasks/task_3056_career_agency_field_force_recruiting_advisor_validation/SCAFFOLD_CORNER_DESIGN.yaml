              payload: { advisor_id: "${adv_lead_id}", product_line: "LIFE", license_number: "WI-LIFE-8001", effective_date: "2026-01-01T00:00:00Z", expires_at: "2027-12-31T00:00:00Z", appointment_required: true }
              as: LicensingCoordinator
              captures: { lic_id: $.data.id }
            - call: "POST /agency/product-licenses/${lic_id}/activate"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/carrier-appointments"
              payload: { advisor_id: "${adv_lead_id}", requires_license_id: "${lic_id}", carrier_name: "Northwestern Mutual", state_code: "WI", requested_date: "2026-01-05T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /agency/carrier-appointments/${appt_id}/approve"
              payload: {}
              as: LicensingCoordinator
