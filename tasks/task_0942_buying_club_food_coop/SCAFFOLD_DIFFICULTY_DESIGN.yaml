  - name: route_turnaround_buffer_rejects_a_second_cycle_inside_48_hours
    grounds:
    - validations[priority=37]
    - errors[ERR_ROUTE_WINDOW_CONFLICT]
    - boundary_semantics.route_turnaround
    - state_machines.DropRun.OPEN_to_MERGED
    - entities.RouteRun.fields.route_id
    distinguishing_aspect: 'Interval semantics two, on the Route resource rather than the Item: adjacency is not enough here. Two cycle windows collide unless a 48-hour turnaround separates them, so a cycle opening 2026-05-26 is refused while one opening exactly 2026-05-27 is admitted.'
    test_recipe:
      setup:
      - North Route already hosts the May cycle, whose window runs 2026-05-05 to 2026-05-25.
