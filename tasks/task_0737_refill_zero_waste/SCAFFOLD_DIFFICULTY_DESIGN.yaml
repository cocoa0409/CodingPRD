            - "HTTP status == 409"
            - "captured err == ERR_ALLERGEN_CONFLICT"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bulk_tier_at_exactly_threshold
        grounds:
          - calculations.refill_line_price
          - entities.Product.fields.bulk_tier_threshold_g
        distinguishing_aspect: >
          Numeric threshold boundary on the weight metric via the fill endpoint: net_weight_g exactly
          1000 == bulk_tier_threshold_g selects the bulk rate 30 (>= boundary), giving 300c; 999 would
          have used the unit rate 40.
        test_recipe:
          setup:
            - "BASIC member; Oats product (unit 40, bulk 30 at >=1000); station; Oats bin on_hand 5000; BYO container tare 200; order with one PROVISIONAL line, order FILLING"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m10@x.com", full_name: "M Ten", membership_tier: "BASIC" }, as: StoreClerk, captures: { m10: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m10}" }, as: StoreClerk, captures: { c10: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m10}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o10: "$.data.id" } }
            - { call: "POST /v1/orders/${o10}/lines", payload: { product_id: "${p_oats}", container_id: "${c10}", estimated_gross_g: 1200 }, as: StoreClerk, captures: { l10: "$.data.id" } }
            - { call: "POST /v1/orders/${o10}/start-fill", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/refill-lines/${l10}/fill", payload: { gross_weight_g: 1200, measured_tare_g: 200 }, as: StoreClerk, captures: { price: "$.data.line_price_cents" } }
          assert:
            - "RefillLine.${l10}.net_weight_g == 1000"
            - "RefillLine.${l10}.line_price_cents == 300"
            - "captured price == 300"

      - name: empty_order_start_fill_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_EMPTY_ORDER]
        distinguishing_aspect: >
          Empty-collection boundary on a different endpoint (start-fill): starting a fill on an order with
          zero non-VOIDED lines returns ERR_EMPTY_ORDER (422); a distinct metric (line count == 0) from the
          numeric weight threshold of the sibling instance.
        test_recipe:
          setup:
            - "Member; station; CART order with NO lines"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m11@x.com", full_name: "M Eleven" }, as: StoreClerk, captures: { m11: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m11}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o11: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders/${o11}/start-fill", payload: {}, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 422"
            - "captured err == ERR_EMPTY_ORDER"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fill_blocked_by_quarantined_bin
        grounds:
          - state_machines.RefillLine.PROVISIONAL_to_FINAL
          - entities.BulkBin.fields.status
        distinguishing_aspect: >
          Entity pair RefillLine(Order) -> BulkBin: a line's PROVISIONAL->FINAL fill depends on the
          resolved bin's status; a recount that reveals shrink 1000 (> SHRINK_QUARANTINE_G 200) sets the
          bin QUARANTINED, so the fill returns ERR_BIN_QUARANTINED.
        test_recipe:
          setup:
            - "Member; Oats product; station; Oats bin (last_recount 5000) recounted to physical 4000 -> last_shrink_g 1000 -> QUARANTINED; BYO container tare 200; order with one PROVISIONAL line, order FILLING"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m12@x.com", full_name: "M Twelve" }, as: StoreClerk, captures: { m12: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 100, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/bins/${b_oats}/recount", payload: { physical_g: 4000 }, as: InventoryManager, captures: { shrink: "$.data.last_shrink_g", binstat: "$.data.status" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m12}" }, as: StoreClerk, captures: { c12: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m12}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o12: "$.data.id" } }
            - { call: "POST /v1/orders/${o12}/lines", payload: { product_id: "${p_oats}", container_id: "${c12}", estimated_gross_g: 500 }, as: StoreClerk, captures: { l12: "$.data.id" } }
            - { call: "POST /v1/orders/${o12}/start-fill", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/refill-lines/${l12}/fill", payload: { gross_weight_g: 500, measured_tare_g: 200 }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "captured shrink == 1000"
            - "captured binstat == QUARANTINED"
            - "HTTP status == 409"
            - "captured err == ERR_BIN_QUARANTINED"

      - name: dispatch_blocked_by_order_not_ready
        grounds:
          - state_machines.Delivery.SCHEDULED_to_DISPATCHED
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: >
          Entity pair Delivery -> Order (distinct from the RefillLine->BulkBin pair): a delivery's
          SCHEDULED->DISPATCHED depends on the order being FILLED + CAPTURED; a CART order yields
          ERR_DELIVERY_ORDER_NOT_READY.
        test_recipe:
          setup:
            - "Member; station; CART order (never filled); vehicle; SCHEDULED delivery for that order"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m13@x.com", full_name: "M Thirteen" }, as: StoreClerk, captures: { m13: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m13}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z", fulfillment_channel: "DELIVERY" }, as: StoreClerk, captures: { o13: "$.data.id" } }
            - { call: "POST /v1/delivery-vehicles", payload: { plate: "VAN-2", capacity_orders: 5 }, as: InventoryManager, captures: { v13: "$.data.id" } }
            - { call: "POST /v1/deliveries", payload: { order_id: "${o13}", vehicle_id: "${v13}", window_start_at: "2026-03-02T12:00:00Z", window_end_at: "2026-03-02T13:00:00Z" }, as: StoreClerk, captures: { d13: "$.data.id" } }
          trigger:
            - { call: "POST /v1/deliveries/${d13}/dispatch", payload: {}, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP status == 422"
            - "captured err == ERR_DELIVERY_ORDER_NOT_READY"
            - "Delivery.${d13}.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_window_halfopen_adjacency_ok_overlap_rejected
        grounds:
          - validations[priority=7]
          - entities.Order.fields.fill_window_start_at
        distinguishing_aspect: >
          Half-open interval semantics with zero buffer on RefillStation: an order window whose start
          equals another window's end (adjacent) is accepted, but a window that strictly overlaps is
          rejected with ERR_STATION_SESSION_OVERLAP.
        test_recipe:
          setup:
            - "Member; station S1; order A occupying window [09:00,10:00) on S1"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m14@x.com", full_name: "M Fourteen" }, as: StoreClerk, captures: { m14: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m14}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { oA: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders", payload: { member_id: "${m14}", station_id: "${s1}", fill_window_start_at: "2026-03-02T10:00:00Z", fill_window_end_at: "2026-03-02T11:00:00Z" }, as: StoreClerk, captures: { oB: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m14}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:30:00Z", fill_window_end_at: "2026-03-02T10:30:00Z" }, as: StoreClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent order B was created (captured oB is a non-empty id)"
            - "HTTP status of the overlapping create == 409"
            - "captured err == ERR_STATION_SESSION_OVERLAP"

      - name: vehicle_window_closed_buffer_boundary
        grounds:
          - validations[priority=7]
          - entities.Delivery.fields.window_start_at
        distinguishing_aspect: >
          Closed-interval-plus-buffer semantics on DeliveryVehicle (distinct from the station's half-open
          zero-buffer): a delivery window starting only 29 min after another ends is rejected
          (ERR_VEHICLE_WINDOW_CONFLICT), while a 30-min gap (== TURNAROUND_BUFFER_MIN) is accepted.
        test_recipe:
          setup:
            - "Member; station; three CART orders oA/oB/oC (non-overlapping station windows); one vehicle; delivery D1 for oA on window [10:00,11:00]"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m15@x.com", full_name: "M Fifteen" }, as: StoreClerk, captures: { m15: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m15}", station_id: "${s1}", fill_window_start_at: "2026-03-05T08:00:00Z", fill_window_end_at: "2026-03-05T08:30:00Z" }, as: StoreClerk, captures: { oA: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m15}", station_id: "${s1}", fill_window_start_at: "2026-03-05T08:30:00Z", fill_window_end_at: "2026-03-05T09:00:00Z" }, as: StoreClerk, captures: { oB: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m15}", station_id: "${s1}", fill_window_start_at: "2026-03-05T09:00:00Z", fill_window_end_at: "2026-03-05T09:30:00Z" }, as: StoreClerk, captures: { oC: "$.data.id" } }
            - { call: "POST /v1/delivery-vehicles", payload: { plate: "VAN-3", capacity_orders: 5 }, as: InventoryManager, captures: { v15: "$.data.id" } }
            - { call: "POST /v1/deliveries", payload: { order_id: "${oA}", vehicle_id: "${v15}", window_start_at: "2026-03-05T10:00:00Z", window_end_at: "2026-03-05T11:00:00Z" }, as: StoreClerk, captures: { d1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/deliveries", payload: { order_id: "${oB}", vehicle_id: "${v15}", window_start_at: "2026-03-05T11:29:00Z", window_end_at: "2026-03-05T12:00:00Z" }, as: StoreClerk, captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/deliveries", payload: { order_id: "${oC}", vehicle_id: "${v15}", window_start_at: "2026-03-05T11:30:00Z", window_end_at: "2026-03-05T12:15:00Z" }, as: StoreClerk, captures: { d3: "$.data.id" } }
          assert:
            - "HTTP status of the 29-min-gap create == 409"
            - "captured err == ERR_VEHICLE_WINDOW_CONFLICT"
            - "the 30-min-gap delivery was created (captured d3 is a non-empty id)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: grams_conserved_fill_then_void
        grounds:
          - state_machines.RefillLine.PROVISIONAL_to_FINAL
          - state_machines.RefillLine.FINAL_to_VOIDED
          - entities.BulkBin.fields.on_hand_g
        distinguishing_aspect: >
          Conserved quantity = mass (grams): a FINAL fill decrements bin.on_hand_g by net 300 (5000 -> 4700)
          and the compensating void re-increments by the same 300 (4700 -> 5000), leaving on_hand_g at the
          recount baseline 5000 with zero drift.
        test_recipe:
          setup:
            - "Member; Oats product; station; Oats bin on_hand 5000 (reorder 1000); BYO container tare 200; order with one line filled FINAL to net 300 (bin on_hand now 4700); order still UNPAID"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m16@x.com", full_name: "M Sixteen" }, as: StoreClerk, captures: { m16: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m16}" }, as: StoreClerk, captures: { c16: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m16}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o16: "$.data.id" } }
            - { call: "POST /v1/orders/${o16}/lines", payload: { product_id: "${p_oats}", container_id: "${c16}", estimated_gross_g: 500 }, as: StoreClerk, captures: { l16: "$.data.id" } }
            - { call: "POST /v1/orders/${o16}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${l16}/fill", payload: { gross_weight_g: 500, measured_tare_g: 200 }, as: StoreClerk }
          trigger:
            - { call: "POST /v1/refill-lines/${l16}/void", payload: {}, as: StoreClerk, captures: { st: "$.data.pricing_stage" } }
          assert:
            - "before void BulkBin.${b_oats}.on_hand_g == 4700"
            - "RefillLine.${l16}.pricing_stage == VOIDED"
            - "after void BulkBin.${b_oats}.on_hand_g == 5000"

      - name: deposit_float_conserved_commit_then_refund
        grounds:
          - calculations.deposit_float
          - entities.Member.fields.deposit_liability_cents
          - entities.Member.fields.wallet_balance_cents
        distinguishing_aspect: >
          Conserved quantity = deposit float (money, distinct from the grams instance): checkout commits
          +150 to deposit_liability, the compensating return refunds -150 liability and +150 wallet, so the
          invariant sum(IN_USE container deposits) == sum(member deposit_liability) holds (150 then 0) and
          the member is made whole.
        test_recipe:
          setup:
            - "Member; Oats product; station; Oats bin on_hand 5000; GLASS_500 container (deposit 150) issued to member; order filled + checked out so container IN_USE, member deposit_liability 150, wallet 0"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m17@x.com", full_name: "M Seventeen" }, as: StoreClerk, captures: { m17: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "GLASS_500", declared_tare_g: 250 }, as: StoreClerk, captures: { c17: "$.data.id" } }
            - { call: "POST /v1/containers/${c17}/issue", payload: { member_id: "${m17}" }, as: StoreClerk }
            - { call: "POST /v1/orders", payload: { member_id: "${m17}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o17: "$.data.id" } }
            - { call: "POST /v1/orders/${o17}/lines", payload: { product_id: "${p_oats}", container_id: "${c17}", estimated_gross_g: 750 }, as: StoreClerk, captures: { l17: "$.data.id" } }
            - { call: "POST /v1/orders/${o17}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${l17}/fill", payload: { gross_weight_g: 750, measured_tare_g: 250 }, as: StoreClerk }
            - { call: "POST /v1/orders/${o17}/checkout", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/containers/${c17}/return", payload: {}, as: StoreClerk, captures: { st: "$.data.status" } }
          assert:
            - "before return Member.${m17}.deposit_liability_cents == 150"
            - "before return Member.${m17}.wallet_balance_cents == 0"
            - "captured st == RETURNED"
            - "after return Member.${m17}.wallet_balance_cents == 150"
            - "after return Member.${m17}.deposit_liability_cents == 0"
