              as: StoreOptician
              as_user_id: "0a000000-0000-4000-8000-000000000001"
              captures: { case2_id: $.data.id }
          trigger:
            - call: "POST /remake-cases/${case1_id}/adjudicate"
              payload: { adjudication_method: "TOLERANCE_DELTA" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
              captures: { c1_pct: $.data.lab_share_pct, c1_resp: $.data.responsibility, c1_cb: $.data.lab_chargeback_cents }
            - call: "POST /remake-cases/${case2_id}/adjudicate"
