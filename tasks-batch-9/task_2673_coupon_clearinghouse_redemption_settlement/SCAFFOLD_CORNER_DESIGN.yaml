              payload: { legal_name: "Unauthorised Onboarding" }
              as: SettlementOfficer
              as_user_id: "so-1"
            - call: "POST /manufacturer-invoices/00000000-0000-4000-8000-000000000000/fund"
              payload: { amount_cents: 10 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1: 403 with error.code == \"ERR_FORBIDDEN_ROLE\" — verify-count is IntakeClerk-exclusive"
            - "trigger call 2: 200 with data.intake_status == \"COUNT_VERIFIED\" — the identical body from the right role"
            - "trigger call 5: 403 ERR_FORBIDDEN_ROLE — finalize is FraudAnalyst-exclusive, refused before the sample-readiness check"
            - "trigger call 6: 200 with data.status == \"VALIDATED\", gross_face_value_cents 50, handling_fee_cents 7"
            - "trigger call 7: 403 ERR_FORBIDDEN_ROLE — rescoring is FraudAnalyst-exclusive, refused before the OCC check on the version token captured in setup"
            - "trigger call 8: 403 ERR_FORBIDDEN_ROLE — onboarding is admin-exclusive, so the denial runs in both directions"
            - "trigger call 9: 403 ERR_FORBIDDEN_ROLE — funding is Manufacturer-exclusive, and the priority-2 check answers before the unknown invoice id would 404"

      - name: entity_backed_callers_are_confined_to_their_own_rows
        claim_type: peer_roles
        grounds:
          - validations.priority_4.ERR_NOT_RESOURCE_OWNER
          - roles.Retailer
          - roles.Manufacturer
        distinguishing_aspect: |
          The ownership gate is priority 4, above every business rule, and it is
          scoped by the acting X-User-ID rather than by the role name: retailer B
          holds the Retailer role yet cannot file a dispute on retailer A's lot or
          post POS data for A, and manufacturer B cannot read A's invoice. The
          opaque staff roles are exempt, so the same reads succeed for the
          SettlementOfficer.
