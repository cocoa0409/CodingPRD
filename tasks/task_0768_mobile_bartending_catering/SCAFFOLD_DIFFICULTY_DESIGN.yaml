              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-02T00:30:00Z", shift_end: "2026-06-02T04:00:00Z", role_on_event: "BACK", expected_event_version: "${ev_b_v}" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BARTENDER_DOUBLE_BOOKED"

      - name: kit_reservation_no_buffer_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_KIT_DOUBLE_BOOKED]
          - entities.KitReservation.fields.reserve_start
        distinguishing_aspect: "BarKit resource, NO-BUFFER half-open interval semantics: two overlapping [reserve_start, reserve_end) windows on the same kit collide (ERR_KIT_DOUBLE_BOOKED), but exact adjacency (end == start) would be allowed — geometrically different from the bartender's buffered rule."
