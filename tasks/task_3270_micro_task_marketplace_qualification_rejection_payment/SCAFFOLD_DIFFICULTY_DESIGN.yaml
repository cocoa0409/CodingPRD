            - "hop 4: Assignment.${a3}.status == EXPIRED and Worker.${w3}.expired_count == 1"

      - name: approval_to_worker_rate_to_system_qualification_grant
        grounds:
          - state_machines.Assignment.transitions.SUBMITTED_to_APPROVED
          - calculations.qualification_gate_snapshot
          - entities.QualificationType.fields.auto_assign_threshold_pct
          - errors.ERR_QUALIFICATION_REQUIRED
        distinguishing_aspect: "One approval raises the worker's approval rate, which triggers the rate-threshold cascade that mints a CASCADE WorkerQualification via the system qualification type, which in turn opens a qualification-gated HIT to that worker only."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Qualification type AccuracyGate (auto threshold 80, default score 70)."
            - "HIT A (1 slot, no quals) plus HIT B (1 slot, requires AccuracyGate). W1 accepts and is approved on A; W2 (no reviews) has no grant."
