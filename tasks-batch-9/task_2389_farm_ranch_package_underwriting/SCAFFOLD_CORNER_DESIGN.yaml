            - "FarmPolicy.${pol_id} reports endorsement_premium_cents 0, base_premium_cents 144000, total_premium_cents 269200 and cat_load_cents still 125200"
            - "FarmPolicy.${pol_id}.version == 4 (rating, approval, rescission)"

      - name: corner_inspection_completion_only_by_assigned_inspector
        claim_type: precondition_enforcement
        grounds: ["state_machines.Inspection[SCHEDULED->COMPLETED]", "validations[priority=6]", "errors.ERR_NOT_ASSIGNED_INSPECTOR"]
        distinguishing_aspect: "A second LossControlSpecialist holds the right role but not the assignment: completing a peer's inspection is ERR_NOT_ASSIGNED_INSPECTOR (403), and the assigned inspector then completes the very same row."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy, two ACTIVE Inspectors, one SCHEDULED inspection assigned to the first"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
            - *k_item
            - *k_inspector
            - &k_inspector2
              call: "POST /inspectors"
              payload: { full_name: "Lee Whitfield", region_code: "KS-CENTRAL" }
              as: PlatformAdmin
              captures: { insp2_id: $.data.id }
            - *k_inspection
          trigger:
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "peer attempt", findings: [] }
              as: LossControlSpecialist
              as_user_id: "${insp2_id}"
              captures: { e_peer: $.data.error_id }
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "housekeeping acceptable, no findings", findings: [] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { done_status: $.data.status, done_hazard: $.data.hazard_score }
          assert:
            - "the peer attempt returns HTTP 403 ERR_NOT_ASSIGNED_INSPECTOR and leaves Inspection.${ins_id2} SCHEDULED with completed_at null"
            - "the assigned inspector's call sets status COMPLETED, completed_at 2026-08-15T00:00:00Z, hazard_score 10 (INITIAL base, empty findings) and recommendation_count 0"
            - "no Recommendation row exists and FarmPolicy.${pol_id}.compliance_status moved NOT_INSPECTED -> COMPLIANT because nothing is unresolved"
            - "the policy's uw_status is still DRAFT — the compliance axis moved on its own"

      - name: corner_completion_and_reinspection_are_not_repeatable
        claim_type: idempotency
        grounds: ["state_machines.Inspection[SCHEDULED->COMPLETED]", "state_machines.Inspection[COMPLETED->SCHEDULED]", "errors.ERR_INSPECTION_STATE_INVALID"]
        distinguishing_aspect: "The inspection cycle alternates strictly: completing a COMPLETED row and re-inspecting a SCHEDULED row both return ERR_INSPECTION_STATE_INVALID (409), and the reinspection in between preserves the old hazard score and recommendation rows."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy, one ACTIVE Inspector with the default 480-minute capacity, one SCHEDULED inspection of 120 minutes on 2026-08-16"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
            - *k_item
            - *k_inspector
            - *k_inspection
          trigger:
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "guarding missing on the PTO shaft", findings: [{ severity: "MAJOR", description: "Install PTO shield", due_date: "2026-09-30" }] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { c1_hazard: $.data.hazard_score }
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "again", findings: [] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { e_c2: $.data.error_id }
            - call: "POST /inspections/${ins_id2}/reinspection"
              payload: { scheduled_for: "2026-08-20T09:00:00Z", duration_minutes: 60 }
              as: ComplianceOfficer
              captures: { r1_status: $.data.status, r1_type: $.data.inspection_type }
            - call: "POST /inspections/${ins_id2}/reinspection"
              payload: { scheduled_for: "2026-08-21T09:00:00Z", duration_minutes: 60 }
              as: Underwriter
              captures: { e_r2: $.data.error_id }
          assert:
            - "the first completion sets hazard_score 22 (INITIAL 10 + MAJOR 12), recommendation_count 1 and creates one OPEN Recommendation at sequence_no 1 with due_date 2026-09-30"
            - "the second completion returns HTTP 409 ERR_INSPECTION_STATE_INVALID and creates no further Recommendation (recommendation_count stays 1)"
            - "the reinspection succeeds: status back to SCHEDULED, inspection_type RE_INSPECTION, scheduled_for 2026-08-20T09:00:00Z, duration_minutes 60, completed_at null, hazard_score still 22 and the existing Recommendation untouched"
            - "the second reinspection returns HTTP 409 ERR_INSPECTION_STATE_INVALID and leaves scheduled_for at 2026-08-20T09:00:00Z"
            - "FarmPolicy.${pol_id}.compliance_status is RECS_OPEN throughout and does not move on the reinspection"

      - name: corner_recommendation_reject_loop_then_accept_clears_compliance
        claim_type: valid_transition
        grounds: ["state_machines.Recommendation[SUBMITTED->OPEN]", "state_machines.Recommendation[SUBMITTED->VERIFIED]", "state_machines.FarmPolicy.compliance_status[RECS_OPEN->COMPLIANT]", "errors.ERR_RECOMMENDATION_STATE_INVALID"]
        distinguishing_aspect: "The remediation loop OPEN -> SUBMITTED -> OPEN -> SUBMITTED -> VERIFIED keeps evidence_note across the rejection, only the final ACCEPT flips the policy to COMPLIANT, and both routes then refuse the VERIFIED row with ERR_RECOMMENDATION_STATE_INVALID (409)."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy, one Inspector, one inspection completed with a single MAJOR finding (hazard 22, compliance RECS_OPEN)"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
            - *k_item
            - *k_inspector
            - *k_inspection
            - &k_complete_major
              call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "guarding missing on the PTO shaft", findings: [{ severity: "MAJOR", description: "Install PTO shield", due_date: "2026-09-30" }] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { maj_hazard: $.data.hazard_score }
            - call: "GET /inspections/${ins_id2}/recommendations"
              as: ComplianceOfficer
              captures: { rec_id: "$.data[0].id" }
          trigger:
            - call: "POST /recommendations/${rec_id}/evidence"
              payload: { evidence_note: "shield ordered", completed_date: "2026-08-16" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { s1: $.data.status }
            - call: "POST /recommendations/${rec_id}/review"
              payload: { decision: "REJECT", review_note: "photo does not show the installed shield" }
              as: ComplianceOfficer
              captures: { s2: $.data.status }
            - call: "POST /recommendations/${rec_id}/evidence"
              payload: { evidence_note: "shield installed, photo attached", completed_date: "2026-08-18" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { s3: $.data.status }
            - call: "POST /recommendations/${rec_id}/review"
              payload: { decision: "ACCEPT", review_note: "verified" }
              as: ComplianceOfficer
              captures: { s4: $.data.status }
            - call: "POST /recommendations/${rec_id}/evidence"
              payload: { evidence_note: "more photos", completed_date: "2026-08-19" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_ev: $.data.error_id }
            - call: "POST /recommendations/${rec_id}/review"
              payload: { decision: "WAIVE", review_note: "never mind" }
              as: ComplianceOfficer
              captures: { e_rev: $.data.error_id }
          assert:
            - "the statuses walk SUBMITTED -> OPEN -> SUBMITTED -> VERIFIED and Recommendation.${rec_id}.version == 5"
            - "after the REJECT the row is OPEN again but evidence_note 'shield ordered' and completed_date 2026-08-16 are retained, and reviewed_by_user_id is set"
            - "FarmPolicy.${pol_id}.compliance_status stays RECS_OPEN through the first three calls and becomes COMPLIANT only on the ACCEPT"
            - "the trailing evidence and review calls both return HTTP 409 ERR_RECOMMENDATION_STATE_INVALID with the row left VERIFIED"
            - "the policy's uw_status never leaves DRAFT and no premium figure moves"

      - name: corner_wc_verification_precondition_matrix
        claim_type: precondition_enforcement
        grounds: ["state_machines.LaborProfile[PENDING_PROOF->VERIFIED]", "errors.ERR_WC_PROOF_MISSING", "errors.ERR_WC_PROOF_EXPIRED", "validations[priority=13]", "validations[priority=14]"]
        distinguishing_aspect: "wc-verification enforces its three preconditions in priority order on the same profile: blank proof fields -> ERR_WC_PROOF_MISSING (422, priority 13), an expiry before the clock date -> ERR_WC_PROOF_EXPIRED (422, priority 14), and only a complete unexpired proof reaches VERIFIED."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one DRAFT policy, a labor profile at (4, 4, 0) = 6.00 exposure units in PENDING_PROOF with no proof fields"
