          Conserved quantity: money (cents). Interrupting a PER_DAY day at 225 of 450 planned
          minutes yields net 250000 + credit_granted 250000; the replacement day completing a
          full window yields final 500000 with credit_applied 250000 -> net 250000.
          source.net + replacement.net == 500000 == day_rate_cents exactly. Distinct conserved
          quantity from the scan-count sibling.
