              as: SalesManager
              captures: { bk_near_id: $.data.id, bk_near_v1: $.data.version }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_rr_id}", space_id: "${sp_bc_id}", event_name: "Rotary Summer Gala", event_class: "LOCAL_EVENT", move_in_start_date: "2028-06-08", show_start_date: "2028-06-10", show_end_date: "2028-06-12", move_out_end_date: "2028-06-13" }
              as: SalesManager
