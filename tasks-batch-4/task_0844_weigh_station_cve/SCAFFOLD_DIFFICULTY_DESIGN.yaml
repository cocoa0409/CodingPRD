      - name: carrier_unpaid_fines_issue_dismiss
        grounds:
          - entities.Carrier.fields.unpaid_fines_cents
          - state_machines.Citation.CONTESTED_to_DISMISSED
          - entities.Citation.fields.assessed_fine_cents
        distinguishing_aspect: "Conserved quantity carrier.unpaid_fines_cents (dollars): issuing an OVERWEIGHT citation debits 145000 and dismissing it credits exactly 145000, returning the balance to 0 — a monetary invariant distinct from the bay-minutes one."
        test_recipe:
          setup:
            - "Active carrier; overweight inspection finalized OOS; an OVERWEIGHT citation (145000) issued and contested."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-R", legal_name: "Romeo Rigs", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
