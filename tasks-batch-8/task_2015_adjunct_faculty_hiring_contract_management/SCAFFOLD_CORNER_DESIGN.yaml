              as: PayrollOfficer
              captures: { p2: $.data.id }
            - { call: "POST /adjunct-hr/payroll-periods/${p2}/lock", payload: {}, as: PayrollOfficer }
          trigger:
            - call: "POST /adjunct-hr/payroll-periods/${p1}/close"
              payload: {}
              as: PayrollOfficer
              captures: { err1: $.data.error_id }
            - call: "POST /adjunct-hr/payroll-periods/${p2}/close"
              payload: {}
              as: PayrollOfficer
              captures: { err2: $.data.error_id }
          assert:
