  - rule_id: non_linear_state_machine
    instances:

      - name: case_parallel_dimensions_join_before_remediation
        grounds:
          - state_machines.CorrectionCase.FILING_IN_PROGRESS_to_FILING_COMPLETE
          - state_machines.CorrectionCase.STMT_PENDING_to_STMT_ISSUED
          - state_machines.CorrectionCase.OPEN_to_REMEDIATION_PENDING
          - entities.CorrectionCase.fields.filing_status
          - entities.CorrectionCase.fields.statement_status
        distinguishing_aspect: |
          CorrectionCase carries four independent state dimensions: the filing dimension reaches
          its terminal FILING_COMPLETE while the statement dimension is still STMT_PENDING, and
          the case's own status stays OPEN until the statement dimension also advances — so the
          same entity is simultaneously finished on one axis and unfinished on another, and the
          join fires only on the second axis's transition.
