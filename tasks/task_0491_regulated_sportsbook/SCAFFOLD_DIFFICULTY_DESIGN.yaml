            - call: "GET /accounts/${acct}"
              payload: {}
              as: Bettor
              as_user_id: "${acct}"
              captures: { v3: $.data.version, cash_before: $.data.cash_balance_cents, bonus_before: $.data.bonus_balance_cents }
            - call: "POST /accounts/${acct}/geo-checks"
              payload: { detected_state: "NJ", accuracy_meters: 20 }
              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "AWAY", american_odds: 200 }
              as: TradingOps
              captures: { sel: $.data.id }
            - call: "POST /bets"
              payload: { account_id: "${acct}", bet_type: "SINGLE", stake_cents: 10000, stake_bucket: "CASH", legs: [{ selection_id: "${sel}" }], bonus_grant_id: "${grant}", expected_account_version: "${v3}" }
              as: Bettor
