# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules × 2 instances = 18 instances. Every setup_api_calls chain replays
# from empty-DB using only §1.5 endpoints; every ${var} is bound by an earlier
# captures: line in the same instance.
scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: seat_forecast_aggregate_vs_walk_diverge
        grounds:
          - calculations.class_seat_forecast
          - entities.TrainingClass.fields.projected_completions_aggregate
          - entities.TrainingClass.fields.projected_completions_walk
        distinguishing_aspect: |
          Entity domain TrainingClass: with 3 active enrollments at attrition 0.25
          (two IN_PROGRESS at GROUND_SCHOOL, one TENTATIVE), variant
          aggregate_projection yields floor(3 * 0.75) = 2 while variant
          per_enrollment_walk yields round_half_up(0.90 + 0.90 + 0.75) =
          round_half_up(2.55) = 3 — the two variants disagree on identical data.
        test_recipe:
          setup:
            - "Class cap 10, attrition 0.25, IN_SESSION with 3 active enrollments: e1 and e2 IN_PROGRESS phase GROUND_SCHOOL (survival 0.90 each), e3 TENTATIVE (survival 0.75)"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "A320", name: "Airbus A320", simulator_cost_per_hour_cents: 45000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Ann Ace", email: "ann@x.com", license_number: "L001", total_flight_hours: 3200 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap1}", request_type: "PRIA" }, as: Recruiter, captures: { rr1: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 34 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Bob Bay", email: "bob@x.com", license_number: "L002", total_flight_hours: 2900 }, as: Recruiter, captures: { ap2: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap2}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap2}", request_type: "PRIA" }, as: Recruiter, captures: { rr2: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr2}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr2}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr2}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap2}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 41 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap2}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Cid Cox", email: "cid@x.com", license_number: "L003", total_flight_hours: 2100 }, as: Recruiter, captures: { ap3: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap3}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap3}", request_type: "PRIA" }, as: Recruiter, captures: { rr3: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr3}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr3}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr3}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap3}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 29 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap3}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.25 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cls_v: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${cls_v}" }, as: TrainingCoordinator, captures: { en1: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en1}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cls_v2: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap2}", training_class_id: "${cls}", expected_training_class_version: "${cls_v2}" }, as: TrainingCoordinator, captures: { en2: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en2}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cls_v3: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap3}", training_class_id: "${cls}", expected_training_class_version: "${cls_v3}" }, as: TrainingCoordinator, captures: { en3: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en1}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en2}/start", payload: {}, as: TrainingCoordinator }
            # End state: e1 IN_PROGRESS phase GROUND_SCHOOL (0.90), e2 IN_PROGRESS
            # phase GROUND_SCHOOL (0.90), e3 TENTATIVE (1 - 0.25 = 0.75).
            # walk = round_half_up(0.90 + 0.90 + 0.75) = round_half_up(2.55) = 3
            # aggregate = floor(3 * 0.75) = floor(2.25) = 2  ->  diverge 3 vs 2.
          trigger:
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { agg: $.data.projected_completions_aggregate, walk: $.data.projected_completions_walk, active: $.data.active_enrollment_count } }
          assert:
            - "TrainingClass.${cls}.active_enrollment_count == 3"
            - "TrainingClass.${cls}.max_seats_sellable == 12"
            - "TrainingClass.${cls}.projected_completions_aggregate == 2"
            - "TrainingClass.${cls}.projected_completions_walk == 3"
            - "TrainingClass.${cls}.projected_completions_walk != TrainingClass.${cls}.projected_completions_aggregate"
      - name: footprint_provisional_vs_final_after_withdrawal
        grounds:
          - calculations.training_footprint_cost
          - entities.Applicant.fields.ledger_balance_cents
          - entities.CostLedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Entity domain Applicant/CostLedger (different from the TrainingClass seat
          domain): after one COMPLETED ground-school session (150000 cents) and a
          withdrawal that books a -150000 REVERSAL, variant provisional yields
          150000 - 150000 = 0 while variant final recomputes gross consumption
          from source events and yields 150000 — same data, two valid algorithms,
          different money.
        test_recipe:
          setup:
            - "Cleared applicant enrolled and IN_PROGRESS in an IN_SESSION class; one GROUND_SCHOOL SESSION event COMPLETED (billed 150000); then the enrollment is withdrawn (books REVERSAL -150000)"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "B737", name: "Boeing 737", simulator_cost_per_hour_cents: 45000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Dee Day", email: "dee@x.com", license_number: "L010", total_flight_hours: 2600 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap1}", request_type: "PRIA" }, as: Recruiter, captures: { rr1: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 33 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cls_v: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${cls_v}" }, as: TrainingCoordinator, captures: { en1: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en1}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en1}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Gus Ground", instructor_type: "GROUND", daily_max_sessions: 6 }, as: TrainingCoordinator, captures: { ins_g: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_g}", phase: "GROUND_SCHOOL", event_type: "SESSION", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: TrainingCoordinator, captures: { ev1: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev1}/complete", payload: { score: 88 }, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en1}/withdraw", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/applicants/${ap1}", payload: {}, as: Recruiter, captures: { bal: $.data.ledger_balance_cents } }
          trigger:
            - { call: "GET /pilot-training/applicants/${ap1}/training-footprint", payload: {}, as: CrewScheduler, captures: { prov: $.data.provisional_total_cents, fin: $.data.final_total_cents } }
          assert:
            - "footprint.provisional_total_cents == 0"
            - "footprint.final_total_cents == 150000"
            - "Applicant.${ap1}.ledger_balance_cents == 0"
            - "footprint.provisional_total_cents != footprint.final_total_cents"

  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes: (b) nested rounding, (c) pinned order)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: footprint_per_line_rounding_before_sum
        grounds:
          - calculations.training_footprint_cost
        distinguishing_aspect: |
          Mode (b) nested rounding: two SIMULATOR sessions of 2.5 hours each at
          45001 cents/hour price to round_half_up(112502.5) = 112503 per line;
          the footprint total is 150000 (ground SESSION) + 150000 (ground
          MILESTONE) + 112503 + 112503 = 525006; the rejected sum-then-round
          order would yield 525005 — the pinned per-line-then-sum order is
          observable in the cents digit.
        test_recipe:
          setup:
            - "Equipment sim rate 45001 cents/hour; enrollment IN_PROGRESS; one GROUND_SCHOOL SESSION completed (150000) and two SIMULATOR SESSION events of exactly 2.5h each completed after the GROUND_SCHOOL milestone advances the phase"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "E190", name: "Embraer 190", simulator_cost_per_hour_cents: 45001, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Eli Ebb", email: "eli@x.com", license_number: "L020", total_flight_hours: 3100 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap1}", request_type: "PRIA" }, as: Recruiter, captures: { rr1: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 30 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cls_v: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${cls_v}" }, as: TrainingCoordinator, captures: { en1: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en1}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en1}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Hal Ground", instructor_type: "GROUND", daily_max_sessions: 6 }, as: TrainingCoordinator, captures: { ins_g: $.data.id } }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Ivy Sim", instructor_type: "SIMULATOR", daily_max_sessions: 6 }, as: TrainingCoordinator, captures: { ins_s: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_g}", phase: "GROUND_SCHOOL", event_type: "SESSION", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: TrainingCoordinator, captures: { ev_g: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev_g}/complete", payload: { score: 91 }, as: TrainingCoordinator }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_g}", phase: "GROUND_SCHOOL", event_type: "MILESTONE", scheduled_start: "2026-08-10T13:00:00Z", scheduled_end: "2026-08-10T15:00:00Z" }, as: TrainingCoordinator, captures: { ev_gm: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T13:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev_gm}/complete", payload: { score: 85 }, as: TrainingCoordinator }
            - { call: "POST /pilot-training/simulator-slots", payload: { equipment_id: "${eq_id}", start_at: "2026-08-11T08:00:00Z", end_at: "2026-08-11T18:00:00Z" }, as: TrainingCoordinator, captures: { slot: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_s}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "SESSION", scheduled_start: "2026-08-11T08:00:00Z", scheduled_end: "2026-08-11T10:30:00Z" }, as: TrainingCoordinator, captures: { ev_s1: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-11T08:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev_s1}/complete", payload: { score: 90 }, as: TrainingCoordinator }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_s}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "SESSION", scheduled_start: "2026-08-11T11:00:00Z", scheduled_end: "2026-08-11T13:30:00Z" }, as: TrainingCoordinator, captures: { ev_s2: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-11T11:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev_s2}/complete", payload: { score: 87 }, as: TrainingCoordinator }
          trigger:
            - { call: "GET /pilot-training/applicants/${ap1}/training-footprint?variant=provisional", payload: {}, as: CrewScheduler, captures: { prov: $.data.provisional_total_cents } }
          assert:
            - "TrainingEvent.${ev_s1}.billed_amount_cents == 112503"
            - "TrainingEvent.${ev_s2}.billed_amount_cents == 112503"
            - "footprint.provisional_total_cents == 525006 (150000 + 150000 + 112503 + 112503)"
      - name: seat_gate_pinned_evaluation_order_after_attrition_patch
        grounds:
          - calculations.class_seat_forecast
          - concurrency_rules[class-attrition-patch-stale]
          - entities.TrainingClass.fields.over_committed
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the seat gate depends on
          max_seats_sellable, which depends on base_attrition_rate, whose PATCH
          validity is read against over_committed, which itself derives from
          max_seats_sellable. With cap 2 and attrition 0.50 the ceiling is
          floor(2*1.5)=3, so exactly 3 TENTATIVE enrollments fill the class; a
          PATCH to 0.10 drops the ceiling to floor(2*1.1)=2 and flips
          over_committed to true, so the NEXT enrollment create fails
          ERR_CLASS_FULL — proving recomputation precedes subsequent gating.
        test_recipe:
          setup:
            - "Class cap 2 attrition 0.50 OPEN with exactly 3 TENTATIVE enrollments (max_seats_sellable 3, full but not over_committed); attrition PATCHed to 0.10 -> max_seats_sellable 2 -> over_committed true"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "B777", name: "Boeing 777", simulator_cost_per_hour_cents: 50000, ioe_hours_required: 12, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "P01", email: "p01@x.com", license_number: "L101", total_flight_hours: 2000 }, as: Recruiter, captures: { ap01: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap01}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap01}", request_type: "PRIA" }, as: Recruiter, captures: { rr01: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr01}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr01}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr01}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap01}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 30 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap01}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "P02", email: "p02@x.com", license_number: "L102", total_flight_hours: 2000 }, as: Recruiter, captures: { ap02: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap02}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap02}", request_type: "PRIA" }, as: Recruiter, captures: { rr02: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr02}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr02}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr02}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap02}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 30 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap02}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "P03", email: "p03@x.com", license_number: "L103", total_flight_hours: 2000 }, as: Recruiter, captures: { ap03: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap03}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap03}", request_type: "PRIA" }, as: Recruiter, captures: { rr03: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr03}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr03}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr03}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap03}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 30 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap03}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 2, base_attrition_rate: 0.50 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            # Enroll the 3 cleared applicants, refreshing the OCC version each time.
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { v1: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap01}", training_class_id: "${cls}", expected_training_class_version: "${v1}" }, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap02}", training_class_id: "${cls}", expected_training_class_version: "${v2}" }, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { v3: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap03}", training_class_id: "${cls}", expected_training_class_version: "${v3}" }, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { v_now: $.data.version, sellable_pre: $.data.max_seats_sellable } }
            # PATCH attrition 0.50 -> 0.10 under OCC: ceiling floor(2*1.5)=3 -> floor(2*1.1)=2
            - { call: "PATCH /pilot-training/training-classes/${cls}", payload: { base_attrition_rate: 0.10, expected_training_class_version: "${v_now}" }, as: TrainingCoordinator, captures: { oc: $.data.over_committed, sellable_post: $.data.max_seats_sellable, v_post: $.data.version } }
          trigger:
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap01}", training_class_id: "${cls}", expected_training_class_version: "${v_post}" }, as: TrainingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "setup: TrainingClass.${cls}.max_seats_sellable before PATCH == 3"
            - "after PATCH TrainingClass.${cls}.max_seats_sellable == 2"
            - "after PATCH TrainingClass.${cls}.over_committed == true"
            - "trigger call returns error_id == ERR_CLASS_FULL (seat gate, priority 17, fires even with a fresh OCC version)"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_retraining_loop_cycle
        grounds:
          - state_machines.Enrollment.IN_PROGRESS_to_REMEDIATION
          - state_machines.Enrollment.REMEDIATION_to_IN_PROGRESS
          - state_machines.Checkride.SCHEDULED_to_COMPLETED_FAIL
        distinguishing_aspect: |
          Entity Enrollment: a genuine cycle IN_PROGRESS -> REMEDIATION ->
          IN_PROGRESS (not a linear pipeline) — a failed checkride cascades the
          enrollment into REMEDIATION, a passing remediation milestone plus
          resume returns it to IN_PROGRESS, and failed_attempts increments to 1.
        test_recipe:
          setup:
            - "Applicant cleared, enrolled, class IN_SESSION, enrollment IN_PROGRESS and advanced to current_phase CHECKRIDE (GROUND_SCHOOL + SIMULATOR milestones passed); one CHECK_AIRMAN instructor distinct from event instructors; first checkride recorded FAIL; remediation SIMULATOR milestone passed after entering REMEDIATION"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "A321", name: "Airbus A321", simulator_cost_per_hour_cents: 45000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
