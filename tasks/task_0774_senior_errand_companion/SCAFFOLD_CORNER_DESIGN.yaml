        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", roles.Caregiver]
        distinguishing_aspect: "A Caregiver calling POST /care/clients (a CareCoordinator-exclusive op) returns ERR_UNAUTHORIZED (403)."
