          - errors[ERR_INVALID_STATE_TRANSITION]
          - entities.Tutor.fields.assigned_weekly_hours
        distinguishing_aspect: "Replaying ACTIVATE on an already ACTIVE assignment returns 409 ERR_INVALID_STATE_TRANSITION and, critically, does not add its weekly_hours a second time: assigned_weekly_hours stays 2.00 rather than 4.00."
        test_recipe:
          setup:
