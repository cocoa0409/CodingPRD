  - section: errors
    instances:

      - name: unknown_ids_return_entity_specific_not_found_codes
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EVALUATOR_NOT_FOUND]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_OBSERVATION_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Each entity family reports its own 404 code rather than a shared generic one: evaluators, cycles, observations, improvement plans and appeals each map to their declared error_id."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /evaluators/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: HrAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /evaluation-cycles/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: HrAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /observations/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: HrAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /improvement-plans/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: HrAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /appeals/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: HrAdmin
              captures: { e5: $.data.error_id }
          assert:
            - "Every response has HTTP status 404 and response_type == error"
            - "The evaluator lookup returns ERR_EVALUATOR_NOT_FOUND"
            - "The cycle lookup returns ERR_CYCLE_NOT_FOUND"
            - "The observation lookup returns ERR_OBSERVATION_NOT_FOUND"
            - "The improvement-plan lookup returns ERR_PLAN_NOT_FOUND"
            - "The appeal lookup returns ERR_APPEAL_NOT_FOUND"

      - name: duplicate_employee_number_is_rejected_as_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_EMPLOYEE_NUMBER]
          - entities.Educator.fields.employee_number
        distinguishing_aspect: "employee_number is unique district-wide, not per school: reusing E-J101 in a second school still returns ERR_DUPLICATE_EMPLOYEE_NUMBER (409)."
        test_recipe:
          setup: ["Two schools; one educator with employee_number E-J101 in the first school."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_a: $.data.id }
            - call: "POST /schools"
              payload: { name: "Grant Middle", code: "GMS", level: "MIDDLE", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_b: $.data.id }
            - call: "POST /educators"
              payload: { school_id: "${sch_a}", employee_number: "E-J101", full_name: "First Holder", service_start_date: "2024-08-15" }
              as: HrAdmin
              captures: { edu1: $.data.id }
          trigger:
            - call: "POST /educators"
              payload: { school_id: "${sch_b}", employee_number: "E-J101", full_name: "Second Holder", service_start_date: "2025-08-15" }
              as: HrAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "error_id == ERR_DUPLICATE_EMPLOYEE_NUMBER"
            - "GET /educators filtered by school_id ${sch_b} returns an empty array"
            - "Educator.${edu1}.employee_number == E-J101 is unchanged"

  # =========================================================================
  - section: rbac
    instances:

      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request carrying no X-User-Role and no X-User-ID is rejected with ERR_UNAUTHENTICATED (401) before existence is evaluated, even when the path names a real resource."
        test_recipe:
          setup: ["One school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln High", code: "LHS", level: "HIGH", evaluation_budget_allocated_cents: 100000 }
              as: HrAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "GET /schools/${sch_id}"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 401"
            - "error_id == ERR_UNAUTHENTICATED"
            - "the response body carries no School fields"

      - name: teacher_cannot_open_an_evaluation_cycle
        claim_type: role_denied
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.HrAdmin.exclusive_operations
        distinguishing_aspect: "POST /evaluation-cycles is an HrAdmin-exclusive operation; a Teacher acting as their own Educator receives ERR_UNAUTHORIZED (403) and no cycle is created."
        test_recipe:
          setup: ["One policy, one school and one educator exist."]
          setup_api_calls:
            - call: "POST /evaluation-policies"
              payload: { school_year: "2026-2027" }
              as: HrAdmin
              captures: { pol_id: $.data.id }
