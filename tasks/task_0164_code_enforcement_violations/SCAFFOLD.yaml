# =============================================================================
# Code Enforcement & Violations — PRD benchmark scaffold (§1.0–§1.7)
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  164. Code Enforcement & Violations: complaint/inspection, violation notice/citation,
  compliance deadline, re-inspection, fine accrual/lien, abatement (board-up/demolition),
  hearing/appeal, repeat-offender escalation

domain_name: code-enforcement-violations
api_prefix: ""   # flat top-level collections; every resource is reachable at /<collection>/{id}

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers          # daily fine accrual; repeat-offender escalation breakpoints
    - cascading_side_effects           # citation -> overdue -> fine accrual -> lien -> abatement
    - dual_variant_calculation         # provisional vs settlement fine; provisional vs final lien
    - optimistic_concurrency           # OCC on Case.version for lien recording

  entity_topology: flat
  # Peer top-level collections joined by foreign keys (no nesting in URL paths).
  # Case is the logical aggregate root, but every entity (Complaint, Inspection,
  # ViolationNotice, Reinspection, Fine, Hearing, AbatementOrder, Lien) is its own
  # top-level collection referencing its parent by an FK in the request body.

  state_machine_shape: branching
  # ViolationNotice forks ISSUED -> {COMPLIED, OVERDUE, CONTESTED}; Hearing cycles via CONTINUED;
  # Case posture is compound (derived from children). Multiple non-linear machines.

  relationship_patterns:
    - one_to_many          # Case -> ViolationNotice; ViolationNotice -> Fine/Reinspection/Hearing
    - cross_aggregate      # ViolationNotice references Property/Owner across the Case tree
    - polymorphic          # Fine.source_kind references CITATION vs ABATEMENT_COST origins

  role_model: peer_roles
  # CodeOfficer (field inspection + citation), HearingOfficer (adjudication),
  # FinanceClerk (fines/liens), Registrant (the cited owner, entity_backed), PlatformAdmin (config/clock).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Owner legal name" }
      - { name: mailing_email, type: string, source: input, description: "Owner contact email; also the registrant login identity" }
      - { name: repeat_tier, type: enum, source: computed, description: "FIRST | REPEAT | CHRONIC — escalation tier derived by repeat_offender_score over UPHELD/COMPLIED ViolationNotices in the rolling window. Constraint: one of {FIRST, REPEAT, CHRONIC}" }
      - { name: prior_violation_count, type: integer, source: computed, description: "Count of this owner's ViolationNotices in {COMPLIED, UPHELD} with effective_date within the rolling window ending at current clock" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; the owner of record for this parcel" }
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number; unique among non-archived Property", constraints: "unique across Property where status != ARCHIVED" }
      - { name: street_address, type: string, source: input, description: "Situs address of the parcel" }
      - { name: occupancy, type: enum, source: input, description: "OCCUPIED | VACANT — affects abatement eligibility. Constraint: one of {OCCUPIED, VACANT}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED. Constraint: one of {ACTIVE, ARCHIVED}", default: ACTIVE }

  - name: FeeSchedule
    parent: null
    common_fields: false
    fields:
      - { name: violation_class, type: enum, source: input, description: "MINOR | MAJOR | HAZARD — the citation class this schedule prices. Constraint: one of {MINOR, MAJOR, HAZARD}" }
      - { name: base_fine_cents, type: integer, source: input, description: "Base penalty assessed at citation issuance, in cents" }
      - { name: daily_accrual_cents, type: integer, source: input, description: "Per-day accrual charged for each whole day a notice is OVERDUE, in cents (pre-multiplier)" }
      - { name: max_total_cents, type: integer, source: input, description: "Hard cap on the per-notice accrued fine total (base + accrual), in cents" }
      - { name: cure_days, type: integer, source: input, description: "Number of whole days granted to cure from notice effective_date before OVERDUE begins" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the parcel this enforcement case concerns" }
      - { name: opened_by_user_id, type: string, source: system, description: "Opaque CodeOfficer X-User-ID that opened the case" }
      - { name: posture, type: enum, source: computed, description: "INTAKE | ACTIVE | ABATEMENT | LIENED | CLOSED — compound posture derived by case_posture from child notices, abatement, and lien. Constraint: one of {INTAKE, ACTIVE, ABATEMENT, LIENED, CLOSED}" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of provisional fine_total_cents over this case's ViolationNotices not in {DISMISSED, SETTLED}, plus recorded abatement_cost_cents, minus payments_applied_cents" }
      - { name: payments_applied_cents, type: integer, source: system, description: "Cumulative payments posted against this case, in cents", default: 0 }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp the case reached CLOSED; null while open", default: null }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this complaint is filed under" }
      - { name: reporter_kind, type: enum, source: input, description: "RESIDENT | ANONYMOUS | OFFICER_OBSERVED. Constraint: one of {RESIDENT, ANONYMOUS, OFFICER_OBSERVED}" }
      - { name: narrative, type: string, source: input, description: "Free-text description of the alleged violation" }
      - { name: status, type: enum, source: system, description: "RECEIVED | TRIAGED | DISMISSED — complaint lifecycle. Constraint: one of {RECEIVED, TRIAGED, DISMISSED}", default: RECEIVED }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this inspection belongs to" }
      - { name: kind, type: enum, source: input, description: "INITIAL | REINSPECTION — INITIAL confirms a complaint; REINSPECTION verifies compliance against a notice. Constraint: one of {INITIAL, REINSPECTION}" }
      - { name: notice_id, type: string, source: input, description: "FK -> ViolationNotice.id; required when kind=REINSPECTION, null for INITIAL", default: null }
      - { name: outcome, type: enum, source: system, description: "PENDING | VIOLATION_FOUND | NO_VIOLATION | COMPLIANT | NON_COMPLIANT — set on submit. Constraint: one of {PENDING, VIOLATION_FOUND, NO_VIOLATION, COMPLIANT, NON_COMPLIANT}", default: PENDING }
      - { name: inspected_on, type: datetime, source: system, description: "Clock timestamp captured when the inspection outcome is submitted; null while PENDING", default: null }

  - name: ViolationNotice
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the parent enforcement case" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; copied from the case's property owner at issuance (repeat-offender subject)" }
      - { name: source_inspection_id, type: string, source: input, description: "FK -> Inspection.id; the VIOLATION_FOUND inspection that substantiates this notice" }
      - { name: violation_class, type: enum, source: input, description: "MINOR | MAJOR | HAZARD — selects the FeeSchedule row. Constraint: one of {MINOR, MAJOR, HAZARD}" }
      - { name: escalation_multiplier, type: number, source: computed, description: "Repeat-offender multiplier frozen at issuance from the owner's repeat_tier (FIRST=1.0, REPEAT=1.5, CHRONIC=2.0)" }
      - { name: effective_date, type: datetime, source: system, description: "Clock timestamp at issuance; cure window and accrual are measured from here; null before ISSUED", default: null }
      - { name: compliance_deadline, type: datetime, source: computed, description: "effective_date + FeeSchedule.cure_days whole days; the last instant before OVERDUE accrual begins" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | COMPLIED | OVERDUE | CONTESTED | UPHELD | DISMISSED | SETTLED — lifecycle. Constraint: one of {DRAFT, ISSUED, COMPLIED, OVERDUE, CONTESTED, UPHELD, DISMISSED, SETTLED}", default: DRAFT }
      - { name: fine_total_cents, type: integer, source: computed, description: "Provisional accrued fine for this notice computed by fine_accrual (base + capped daily accrual) * escalation_multiplier, recomputed on read against the current clock while OVERDUE; frozen at the settlement variant once COMPLIED/UPHELD/DISMISSED/SETTLED" }
      - { name: days_overdue, type: integer, source: computed, description: "Whole days between compliance_deadline and the accrual-as-of instant (current clock while OVERDUE; frozen instant otherwise); floor at 0" }

  - name: Reinspection
    parent: null
    common_fields: true
    fields:
      - { name: notice_id, type: string, source: input, description: "FK -> ViolationNotice.id; the notice being re-inspected for compliance" }
      - { name: requested_by_user_id, type: string, source: system, description: "Opaque CodeOfficer X-User-ID that scheduled the re-inspection" }
      - { name: result, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED — PASSED cures the notice, FAILED keeps it OVERDUE. Constraint: one of {SCHEDULED, PASSED, FAILED}", default: SCHEDULED }
      - { name: result_on, type: datetime, source: system, description: "Clock timestamp when the re-inspection result was recorded; null while SCHEDULED", default: null }

  - name: Fine
    parent: null
    common_fields: true
    fields:
      - { name: notice_id, type: string, source: system, description: "FK -> ViolationNotice.id; the notice this ledger line belongs to" }
      - { name: source_kind, type: enum, source: system, description: "CITATION | ABATEMENT_COST — CITATION is the penalty ledger, ABATEMENT_COST captures recovered abatement expense. Constraint: one of {CITATION, ABATEMENT_COST}" }
      - { name: assessed_cents, type: integer, source: computed, description: "Frozen amount of this ledger line at the point it was finalized, in cents" }
      - { name: settlement_status, type: enum, source: system, description: "OPEN | SETTLED | WAIVED — OPEN accrues toward the lien, SETTLED/WAIVED do not. Constraint: one of {OPEN, SETTLED, WAIVED}", default: OPEN }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: notice_id, type: string, source: system, description: "FK -> ViolationNotice.id; the contested notice under appeal" }
      - { name: requested_by_user_id, type: string, source: system, description: "Owner.id of the registrant who filed the appeal (entity_backed)" }
      - { name: scheduled_for, type: datetime, source: input, description: "Clock timestamp the hearing is set for; must be at or after the contest filing instant" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD_UPHELD | HELD_DISMISSED | CONTINUED — CONTINUED re-opens scheduling. Constraint: one of {SCHEDULED, HELD_UPHELD, HELD_DISMISSED, CONTINUED}", default: SCHEDULED }
      - { name: continuance_count, type: integer, source: system, description: "Number of times this hearing has been CONTINUED; capped at 2", default: 0 }

  - name: AbatementOrder
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case authorizing abatement" }
      - { name: action_kind, type: enum, source: input, description: "BOARD_UP | DEMOLITION — DEMOLITION requires VACANT occupancy and a HAZARD-class upheld notice. Constraint: one of {BOARD_UP, DEMOLITION}" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Contractor estimate authorized at order creation, in cents" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Actual invoiced contractor cost recorded on completion, in cents", default: null }
      - { name: status, type: enum, source: system, description: "ORDERED | IN_PROGRESS | COMPLETED | CANCELLED. Constraint: one of {ORDERED, IN_PROGRESS, COMPLETED, CANCELLED}", default: ORDERED }

  - name: Lien
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case whose unpaid balance is liened" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; the parcel the lien encumbers, copied from the case at recording" }
      - { name: principal_cents, type: integer, source: computed, description: "Frozen lien principal = open citation fines + recovered abatement cost at recording, computed by lien_amount" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Frozen administrative fee component of the lien, computed by lien_amount from the tiered rate on principal" }
      - { name: total_cents, type: integer, source: computed, description: "principal_cents + admin_fee_cents — the recorded lien total" }
      - { name: status, type: enum, source: system, description: "PENDING | RECORDED | RELEASED | FORECLOSED. Constraint: one of {PENDING, RECORDED, RELEASED, FORECLOSED}", default: PENDING }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Case: compound posture derived from children ----
  - entity: Case
    field: posture
    initial_state: INTAKE
    terminal_states: [CLOSED]
    derivation: |
      Compound posture recomputed after every child mutation (complaint triage, notice
      issuance/resolution, abatement order, lien recording, payment), in priority order:
        1) CLOSED  if closed_at is set (manual close after all notices terminal and balance == 0).
        2) LIENED  if any Lien for this case is in status RECORDED.
        3) ABATEMENT if any AbatementOrder for this case is in {ORDERED, IN_PROGRESS}.
        4) ACTIVE  if any ViolationNotice for this case is in {ISSUED, OVERDUE, CONTESTED, UPHELD}.
        5) INTAKE  otherwise (only complaints/inspections so far, or all notices terminal-benign).
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /notices (issue) — auto-derived"
        actor: system
        preconditions: ["a ViolationNotice for this case enters ISSUED"]
        side_effects: ["recompute case_posture", "recompute outstanding_balance_cents"]
      - from: ACTIVE
        to: ABATEMENT
        trigger: "POST /abatement-orders — auto-derived"
        actor: system
        preconditions: ["an AbatementOrder enters ORDERED"]
        side_effects: ["recompute case_posture"]
      - from: ABATEMENT
        to: LIENED
        trigger: "POST /liens — auto-derived"
        actor: system
        preconditions: ["a Lien enters RECORDED"]
        side_effects: ["recompute case_posture", "Case.outstanding_balance_cents recomputed"]
      - from: ACTIVE
        to: LIENED
        trigger: "POST /liens — auto-derived (no abatement path)"
        actor: system
        preconditions: ["a Lien enters RECORDED"]
        side_effects: ["recompute case_posture"]
      - from: LIENED
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: FinanceClerk
        preconditions:
          - "all ViolationNotice for this case are in {COMPLIED, DISMISSED, SETTLED}"
          - "Case.outstanding_balance_cents == 0 (lien must be RELEASED or fines SETTLED) (ERR_BALANCE_OUTSTANDING)"
        side_effects: ["closed_at = current clock", "recompute case_posture -> CLOSED"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: FinanceClerk
        preconditions:
          - "all ViolationNotice for this case are in {COMPLIED, DISMISSED, SETTLED}"
          - "Case.outstanding_balance_cents == 0 (ERR_BALANCE_OUTSTANDING)"
        side_effects: ["closed_at = current clock"]

  # ---- ViolationNotice: branching with revert + contest cycle (non-linear) ----
  - entity: ViolationNotice
    initial_state: DRAFT
    terminal_states: [COMPLIED, DISMISSED, SETTLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /notices"
        actor: CodeOfficer
        preconditions:
          - "source_inspection_id refers to an Inspection on this case with outcome=VIOLATION_FOUND (ERR_NO_SUBSTANTIATION)"
          - "a FeeSchedule row exists for violation_class (ERR_FEE_SCHEDULE_MISSING)"
        side_effects:
          - "effective_date = current clock"
          - "escalation_multiplier frozen from Owner.repeat_tier via repeat_offender_score"
          - "compliance_deadline = effective_date + FeeSchedule.cure_days days"
          - "create Fine(source_kind=CITATION, settlement_status=OPEN) sized by fine_accrual base"
          - "recompute case_posture (INTAKE->ACTIVE)"
          - "recompute Case.outstanding_balance_cents"
      - from: ISSUED
        to: COMPLIED
        trigger: "POST /reinspections/{id}/result (PASSED)"
        actor: CodeOfficer
        preconditions: ["current clock <= compliance_deadline (cured within window)", "Reinspection.result set to PASSED"]
        side_effects:
          - "fine_total_cents frozen at settlement variant (no overdue accrual)"
          - "CITATION Fine.settlement_status -> SETTLED if assessed_cents == base only; else remains OPEN"
          - "recompute case_posture"
      - from: ISSUED
        to: OVERDUE
        trigger: "system clock crosses compliance_deadline (lazy, evaluated on read/transition)"
        actor: system
        preconditions: ["current clock > compliance_deadline", "no PASSED Reinspection recorded"]
        side_effects:
          - "fine_total_cents begins provisional daily accrual via fine_accrual"
          - "days_overdue recomputed on each read"
      - from: OVERDUE
        to: COMPLIED
        trigger: "POST /reinspections/{id}/result (PASSED)"
        actor: CodeOfficer
        preconditions: ["Reinspection.result set to PASSED"]
        side_effects:
          - "fine_total_cents frozen at settlement variant as-of the Reinspection.result_on instant"
          - "recompute Case.outstanding_balance_cents"
          - "recompute case_posture"
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /notices/{id}/contest"
        actor: Registrant
        preconditions:
          - "acting Registrant owns the case's Property (ERR_NOT_NOTICE_OWNER)"
          - "current clock <= compliance_deadline (ERR_CONTEST_WINDOW_CLOSED)"
          - "scheduled_for >= HEARING_BUFFER_DAYS from any active Hearing on the same case (ERR_HEARING_SLOT_CONFLICT)"
        side_effects:
          - "accrual paused (fine_total_cents frozen at provisional-as-of-contest)"
          - "create Hearing(status=SCHEDULED)"
      - from: OVERDUE
        to: CONTESTED
        trigger: "POST /notices/{id}/contest"
        actor: Registrant
        preconditions:
          - "acting Registrant owns the case's Property (ERR_NOT_NOTICE_OWNER)"
          - "current clock <= compliance_deadline + GRACE_CONTEST_DAYS (ERR_CONTEST_WINDOW_CLOSED)"
        side_effects:
          - "accrual paused (fine_total_cents frozen at provisional-as-of-contest)"
          - "create Hearing(status=SCHEDULED)"
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /hearings/{id}/decide (UPHELD)"
        actor: HearingOfficer
        preconditions: ["Hearing.status SCHEDULED", "decision=UPHELD"]
        side_effects:
          - "accrual resumes; fine_total_cents = provisional accrual bridging the paused contest interval (fine_accrual settlement variant as-of decision)"
          - "CITATION Fine.assessed_cents := frozen fine_total_cents (Fine stays OPEN)"
          - "recompute Case.outstanding_balance_cents"
          - "recompute case_posture"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /hearings/{id}/decide (DISMISSED)"
        actor: HearingOfficer
        preconditions: ["Hearing.status SCHEDULED", "decision=DISMISSED"]
        side_effects:
          - "CITATION Fine.settlement_status -> WAIVED (compensating: removes this notice's fine from outstanding)"
          - "fine_total_cents frozen to 0"
          - "recompute Case.outstanding_balance_cents (debit removed)"
          - "recompute case_posture"
      - from: UPHELD
        to: SETTLED
        trigger: "POST /cases/{id}/payments (covers this notice's open fines)"
        actor: FinanceClerk
        preconditions: ["all OPEN Fine for this notice covered by the payment allocation"]
        side_effects:
          - "CITATION Fine.settlement_status -> SETTLED"
          - "recompute Case.outstanding_balance_cents"
      - from: OVERDUE
        to: SETTLED
        trigger: "POST /cases/{id}/payments (covers this notice's open fines)"
        actor: FinanceClerk
        preconditions: ["all OPEN Fine for this notice covered by the payment allocation"]
        side_effects:
          - "fine_total_cents frozen at settlement variant as-of payment instant"
          - "CITATION Fine.settlement_status -> SETTLED"
          - "recompute Case.outstanding_balance_cents"

  # ---- Hearing: branching with continuance cycle (non-linear, different entity) ----
  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD_UPHELD, HELD_DISMISSED]
    transitions:
      - from: SCHEDULED
        to: HELD_UPHELD
        trigger: "POST /hearings/{id}/decide (UPHELD)"
        actor: HearingOfficer
        preconditions: ["current clock >= scheduled_for (ERR_HEARING_NOT_RIPE)"]
        side_effects: ["parent ViolationNotice CONTESTED -> UPHELD"]
      - from: SCHEDULED
        to: HELD_DISMISSED
        trigger: "POST /hearings/{id}/decide (DISMISSED)"
        actor: HearingOfficer
        preconditions: ["current clock >= scheduled_for (ERR_HEARING_NOT_RIPE)"]
        side_effects: ["parent ViolationNotice CONTESTED -> DISMISSED"]
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /hearings/{id}/continue"
        actor: HearingOfficer
        preconditions: ["continuance_count < MAX_CONTINUANCES (ERR_CONTINUANCE_LIMIT)"]
        side_effects: ["continuance_count += 1"]
      - from: CONTINUED
        to: SCHEDULED
        trigger: "POST /hearings/{id}/reschedule"
        actor: HearingOfficer
        preconditions: ["new scheduled_for >= current clock (ERR_HEARING_NOT_RIPE)"]
        side_effects: ["scheduled_for updated to new value"]

  # ---- AbatementOrder: linear with cancel revert ----
  - entity: AbatementOrder
    initial_state: ORDERED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ORDERED
        to: IN_PROGRESS
        trigger: "POST /abatement-orders/{id}/start"
        actor: CodeOfficer
        preconditions: ["Case posture is ABATEMENT or ACTIVE"]
        side_effects: ["recompute case_posture"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /abatement-orders/{id}/complete"
        actor: CodeOfficer
        preconditions: ["actual_cost_cents provided (ERR_MISSING_ACTUAL_COST)"]
        side_effects:
          - "create Fine(source_kind=ABATEMENT_COST, assessed_cents=actual_cost_cents, settlement_status=OPEN) on the case's most recent UPHELD/OVERDUE notice"
          - "recompute Case.outstanding_balance_cents (abatement cost added)"
          - "recompute case_posture"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /abatement-orders/{id}/cancel"
        actor: CodeOfficer
        preconditions: ["order not yet IN_PROGRESS"]
        side_effects: ["recompute case_posture"]

  # ---- Lien: linear lifecycle ----
  - entity: Lien
    initial_state: PENDING
    terminal_states: [RELEASED, FORECLOSED]
    transitions:
      - from: PENDING
        to: RECORDED
        trigger: "POST /liens"
        actor: FinanceClerk
        preconditions:
          - "expected_case_version matches Case.version (ERR_STALE_VERSION) [OCC]"
          - "Case.outstanding_balance_cents > 0 (ERR_NOTHING_TO_LIEN)"
          - "no existing Lien for this case in {PENDING, RECORDED} (ERR_LIEN_ALREADY_EXISTS)"
        side_effects:
          - "freeze every OPEN CITATION Fine on an OVERDUE/UPHELD notice: Fine.assessed_cents := that notice's settlement fine_total_cents as-of the recording instant (Fine stays OPEN)"
          - "principal_cents, admin_fee_cents, total_cents frozen by lien_amount over the now-frozen OPEN Fine ledger lines"
          - "property_id copied from Case.property_id"
          - "recompute case_posture (-> LIENED)"
          - "increments Case.version by 1"
      - from: RECORDED
        to: RELEASED
        trigger: "POST /liens/{id}/release"
        actor: FinanceClerk
        preconditions: ["Case.payments_applied_cents >= Lien.total_cents (ERR_BALANCE_OUTSTANDING)"]
        side_effects:
          - "all OPEN CITATION/ABATEMENT_COST Fine on the case -> SETTLED"
          - "recompute Case.outstanding_balance_cents (-> 0)"
          - "recompute case_posture"
      - from: RECORDED
        to: FORECLOSED
        trigger: "POST /liens/{id}/foreclose"
        actor: FinanceClerk
        preconditions: ["current clock >= Lien.created_at + FORECLOSURE_WAIT_DAYS days (ERR_FORECLOSURE_NOT_RIPE)"]
        side_effects: ["recompute case_posture"]

  # ---- Complaint: short linear triage ----
  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [DISMISSED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /complaints/{id}/triage"
        actor: CodeOfficer
        preconditions: ["narrative present"]
        side_effects: ["enables INITIAL inspection scheduling"]
      - from: RECEIVED
        to: DISMISSED
        trigger: "POST /complaints/{id}/dismiss"
        actor: CodeOfficer
        preconditions: ["no Inspection with outcome=VIOLATION_FOUND linked to this complaint's case"]
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — true races only (OCC on parent version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: lien-record-stale-case
    parent_entity: Case
    write_endpoint: "POST /liens"
    occ_field: "expected_case_version"
    description: |
      Recording a Lien against a Case whose version has advanced since the client
      last observed it is rejected. A lien freezes principal_cents from the case's
      outstanding_balance_cents; if another writer has just posted a payment or
      waived a fine (each of which bumps Case.version and changes the balance), the
      current writer's view of the case is stale and the frozen principal would be
      wrong. The stale-version check rejects the second create deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fine_accrual
    trigger: "ViolationNotice read while OVERDUE; freeze on COMPLIED/UPHELD/DISMISSED/SETTLED transitions"
    algorithm: chronological
    formula: |
      Let fs = FeeSchedule row for notice.violation_class.
      days_overdue = max(0, whole_days_between(notice.compliance_deadline, as_of_instant))
        where whole_days_between(a,b) = floor((b - a) / 86400 seconds); negative -> 0.
      raw_accrual_cents = fs.base_fine_cents + fs.daily_accrual_cents * days_overdue
      capped_pre_mult_cents = min(raw_accrual_cents, fs.max_total_cents)
      # ROUNDING ORDER (PINNED): apply the escalation multiplier AFTER the cap, then
      # round the single product half-up to the nearest cent. Do NOT round per-day.
      fine_total_cents = round_half_up(capped_pre_mult_cents * notice.escalation_multiplier)
    input_set: "single notice; days_overdue counts only whole elapsed days strictly after compliance_deadline"
    constants:
      GRACE_CONTEST_DAYS: 3
      HEARING_BUFFER_DAYS: 7    # min whole-day gap between two active Hearings on the same case (ERR_HEARING_SLOT_CONFLICT)
      MAX_CONTINUANCES: 2
    precision: "integer cents; round_half_up applied exactly once to the (capped * multiplier) product"
    variants:
      - name: provisional
        when: "notice.status == OVERDUE (recomputed on every read)"
        difference: "as_of_instant = current clock; total grows each day until cap"
      - name: settlement
        when: "notice transitions to COMPLIED/UPHELD/DISMISSED/SETTLED, or contest pauses accrual"
        difference: "as_of_instant frozen to the transition instant (Reinspection.result_on, hearing decision, payment, or contest filing); value never changes afterward"

  - name: repeat_offender_score
    trigger: "ViolationNotice issuance (DRAFT->ISSUED); Owner read"
    algorithm: weighted_scoring
    formula: |
      window_start = current_clock - ROLLING_WINDOW_DAYS days.
      prior_violation_count = count of Owner's ViolationNotices N where
        N.status IN {COMPLIED, UPHELD}
        AND N.effective_date >= window_start
        AND N.effective_date <= current_clock
        AND N.id != the notice being issued.
      # Tiered selection (>= boundaries pinned):
      repeat_tier =
        CHRONIC if prior_violation_count >= CHRONIC_THRESHOLD     (>= 4)
        REPEAT  if prior_violation_count >= REPEAT_THRESHOLD      (>= 2)
        FIRST   otherwise.
      escalation_multiplier = { FIRST: 1.0, REPEAT: 1.5, CHRONIC: 2.0 }[repeat_tier]
    input_set: "Owner's terminal-or-upheld notices across all the owner's properties within the rolling window"
    constants:
      ROLLING_WINDOW_DAYS: 365
      REPEAT_THRESHOLD: 2
      CHRONIC_THRESHOLD: 4
    precision: "integer count; multiplier is exact decimal 1.0/1.5/2.0"
    variants:
      - name: at_issuance
        when: "notice DRAFT->ISSUED — multiplier frozen onto the notice"
        difference: "evaluated once and stored as ViolationNotice.escalation_multiplier; never re-evaluated for that notice"
      - name: live_tier
        when: "Owner GET — reported as Owner.repeat_tier"
        difference: "evaluated against the current clock each read; may differ from any frozen notice multiplier"

  - name: lien_amount
    trigger: "Lien recording (PENDING->RECORDED)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER PINNED (circular-looking: admin_fee depends on principal,
      # principal must be summed first):
      open_citation_cents = sum of Fine.assessed_cents for the case's Fines where
        source_kind == CITATION AND settlement_status == OPEN.
      open_abatement_cents = sum of Fine.assessed_cents for the case's Fines where
        source_kind == ABATEMENT_COST AND settlement_status == OPEN.
      principal_cents = open_citation_cents + open_abatement_cents
      # admin_fee tier is keyed on principal_cents AFTER it is fully summed:
      admin_rate = 0.05 if principal_cents <  ADMIN_TIER_CENTS        (< 500000)
                   0.10 if principal_cents >= ADMIN_TIER_CENTS         (>= 500000)
      admin_fee_cents = round_half_up(principal_cents * admin_rate)
      total_cents = principal_cents + admin_fee_cents
    input_set: "all OPEN Fine ledger lines on the case at the recording instant; SETTLED/WAIVED excluded"
    constants:
      ADMIN_TIER_CENTS: 500000
      FORECLOSURE_WAIT_DAYS: 90
    precision: "integer cents; round_half_up on the admin_fee product; principal is an exact sum"
    variants:
      - name: provisional_balance
        when: "Case GET — outstanding_balance_cents preview"
        difference: "uses live provisional fine_total_cents for OVERDUE notices (grows with clock); no admin fee"
      - name: final_recorded
        when: "Lien PENDING->RECORDED — frozen onto the Lien"
        difference: "snapshots OPEN Fine.assessed_cents (already frozen) and adds the tiered admin fee; never changes after recording"

  - name: case_posture
    trigger: "any case child mutation (notice issue/resolve, abatement order, lien record/release, payment, close)"
    algorithm: priority_rules
    formula: |
      1) CLOSED   if Case.closed_at is set.
      2) LIENED   if any Lien for the case has status == RECORDED.
      3) ABATEMENT if any AbatementOrder for the case has status IN {ORDERED, IN_PROGRESS}.
      4) ACTIVE   if any ViolationNotice for the case has status IN {ISSUED, OVERDUE, CONTESTED, UPHELD}.
      5) INTAKE   otherwise.
    input_set: "the case's child notices, abatement orders, and liens at evaluation time"
    precision: "exact enum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the path exists (validated left-to-right) and child belongs to the named parent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "entity-backed Registrant acting on a notice must own the case's Property (X-User-ID == Property.owner_id)"
    error_id: ERR_NOT_NOTICE_OWNER
    http_status: 403
    applies_to: "POST /notices/{id}/contest"

  - priority: 5
    category: existence
    check: "referenced FK in body resolves (owner_id, property_id, case_id, source_inspection_id, notice_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /properties, POST /cases, POST /complaints, POST /inspections, POST /notices, POST /reinspections, POST /abatement-orders, POST /liens"

  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_constraint
    check: "issuing a notice requires a substantiating Inspection with outcome=VIOLATION_FOUND on the same case"
    error_id: ERR_NO_SUBSTANTIATION
    http_status: 422
    applies_to: "POST /notices"

  - priority: 8
    category: business_constraint
    check: "a FeeSchedule row must exist for the notice's violation_class"
    error_id: ERR_FEE_SCHEDULE_MISSING
    http_status: 422
    applies_to: "POST /notices"

  - priority: 9
    category: business_safety
    check: "DEMOLITION abatement requires Property.occupancy == VACANT and a HAZARD-class notice on the case in {OVERDUE, UPHELD}"
    error_id: ERR_DEMOLITION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /abatement-orders"

  - priority: 9b
    category: business_temporal
    check: |
      Property single-active-Case occupancy (interval semantics: exclusive half-open occupancy
      [opened_at, closed_at) — the prior case's CLOSED instant frees the property, so back-to-back
      cases are allowed, but two open intervals may never overlap). Opening a Case on a Property that
      already has a Case with posture != CLOSED is rejected.
    error_id: ERR_PROPERTY_HAS_OPEN_CASE
    http_status: 409
    applies_to: "POST /cases"

  - priority: 10
    category: business_temporal
    check: "contest must be filed within the contest window (ISSUED: <= compliance_deadline; OVERDUE: <= compliance_deadline + GRACE_CONTEST_DAYS)"
    error_id: ERR_CONTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /notices/{id}/contest"

  - priority: 10b
    category: business_temporal
    check: |
      Hearing buffer window (interval semantics: minimum-gap buffer between point-events on the same
      case — a new Hearing.scheduled_for must be at least HEARING_BUFFER_DAYS whole days away, in either
      direction, from the scheduled_for of any other Hearing on the same case in {SCHEDULED, CONTINUED};
      adjacency within the buffer is forbidden, distinguishing it from the exclusive-occupancy semantics
      of ERR_PROPERTY_HAS_OPEN_CASE).
    error_id: ERR_HEARING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /notices/{id}/contest, POST /hearings/{id}/reschedule"

  - priority: 11
    category: business_temporal
    check: "a hearing may be decided only at/after scheduled_for; reschedule target must be >= current clock"
    error_id: ERR_HEARING_NOT_RIPE
    http_status: 422
    applies_to: "POST /hearings/{id}/decide, POST /hearings/{id}/reschedule"

  - priority: 12
    category: business_constraint
    check: "a hearing cannot be continued more than MAX_CONTINUANCES times"
    error_id: ERR_CONTINUANCE_LIMIT
    http_status: 422
    applies_to: "POST /hearings/{id}/continue"

  - priority: 13
    category: business_temporal
    check: "foreclosure may proceed only after FORECLOSURE_WAIT_DAYS from lien recording"
    error_id: ERR_FORECLOSURE_NOT_RIPE
    http_status: 422
    applies_to: "POST /liens/{id}/foreclose"

  - priority: 14
    category: business_referential
    check: "at most one Lien per case in {PENDING, RECORDED}"
    error_id: ERR_LIEN_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /liens"

  - priority: 15
    category: business_fiscal
    check: "a lien may be recorded only when Case.outstanding_balance_cents > 0"
    error_id: ERR_NOTHING_TO_LIEN
    http_status: 422
    applies_to: "POST /liens"

  - priority: 16
    category: concurrency
    check: "expected_case_version must equal current Case.version on lien recording"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /liens"

  - priority: 17
    category: business_fiscal
    check: "closing a case or releasing a lien requires Case.outstanding_balance_cents == 0 / payments cover the lien total"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /cases/{id}/close, POST /liens/{id}/release"

  - priority: 18
    category: business_constraint
    check: "completing an abatement order requires actual_cost_cents in the body"
    error_id: ERR_MISSING_ACTUAL_COST
    http_status: 422
    applies_to: "POST /abatement-orders/{id}/complete"

  - priority: 19
    category: business_referential
    check: "parcel_number must be unique across non-ARCHIVED Property"
    error_id: ERR_DUPLICATE_PARCEL
    http_status: 409
    applies_to: "POST /properties"

  - priority: 20
    category: business_constraint
    check: "a REINSPECTION inspection requires notice_id referencing an ISSUED/OVERDUE notice on the same case"
    error_id: ERR_REINSPECTION_TARGET_INVALID
    http_status: 422
    applies_to: "POST /inspections"

  - priority: 21
    category: validation
    check: "request body missing a required field or enum value out of range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST/PATCH

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Config / clock (PlatformAdmin) ----
  - method: POST
    path: "/fee-schedules"
    description: "Create a FeeSchedule row for a violation_class"
    roles: [PlatformAdmin]
    code: 201
    input: [violation_class, base_fine_cents, daily_accrual_cents, max_total_cents, cure_days]
    output: FeeSchedule
    side_effects: []
  - method: GET
    path: "/fee-schedules"
    description: "List FeeSchedule rows (filter by violation_class)"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk]
    code: 200
    input: ["violation_class?", "limit?", "offset?"]
    output: FeeSchedule[]
    side_effects: []
  - method: POST
    path: "/_clock/set"
    description: "Test-driving: set the server's current UTC clock to an absolute instant"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["all lazy OVERDUE/accrual evaluations use this clock"]

  # ---- Owner ----
  - method: POST
    path: "/owners"
    description: "Register a property Owner (also the registrant identity)"
    roles: [PlatformAdmin, CodeOfficer]
    code: 201
    input: [full_name, mailing_email]
    output: Owner
    side_effects: ["repeat_tier=FIRST, prior_violation_count=0"]
  - method: GET
    path: "/owners/{id}"
    description: "Get an Owner with live repeat_tier and prior_violation_count"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: []
    output: Owner
    side_effects: ["repeat_offender_score live_tier variant evaluated on read"]

  # ---- Property ----
  - method: POST
    path: "/properties"
    description: "Create a Property parcel owned by an Owner"
    roles: [PlatformAdmin, CodeOfficer]
    code: 201
    input: [owner_id, parcel_number, street_address, occupancy]
    output: Property
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/properties/{id}"
    description: "Get a Property"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties"
    description: "List Properties; reverse-reachability for Property.owner_id"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk]
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # ---- Case ----
  - method: POST
    path: "/cases"
    description: "Open an enforcement Case on a Property"
    roles: [CodeOfficer]
    code: 201
    input: [property_id]
    output: Case
    side_effects: ["posture=INTAKE", "outstanding_balance_cents=0", "opened_by_user_id from X-User-ID"]
  - method: GET
    path: "/cases/{id}"
    description: "Get a Case with live posture and outstanding_balance_cents"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: []
    output: Case
    side_effects: ["case_posture and provisional outstanding_balance recomputed on read"]
  - method: GET
    path: "/cases"
    description: "List Cases; reverse-reachability for Case.property_id"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/close"
    description: "Close a case once all notices terminal and balance is 0"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Case
    side_effects: ["closed_at set", "posture -> CLOSED"]
  - method: POST
    path: "/cases/{id}/payments"
    description: "Post a payment against the case, allocating to OPEN fines oldest-first"
    roles: [FinanceClerk]
    code: 201
    input: [amount_cents, expected_case_version]
    output: Case
    side_effects:
      - "payments_applied_cents += amount_cents"
      - "allocate to OPEN CITATION/ABATEMENT_COST Fine ordered by Fine.created_at ASC; fully covered notices -> SETTLED"
      - "recompute outstanding_balance_cents and case_posture"
      - "increments Case.version by 1"

  # ---- Complaint ----
  - method: POST
    path: "/complaints"
    description: "File a complaint under a case (case_id in body)"
    roles: [CodeOfficer, Registrant]
    code: 201
    input: [case_id, reporter_kind, narrative]
    output: Complaint
    side_effects: ["status=RECEIVED"]
  - method: GET
    path: "/cases/{id}/complaints"
    description: "List a case's complaints (sub-resource reverse-reachability for Complaint.case_id)"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/complaints/{id}/triage"
    description: "Triage a received complaint"
    roles: [CodeOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> TRIAGED"]
  - method: POST
    path: "/complaints/{id}/dismiss"
    description: "Dismiss a received complaint"
    roles: [CodeOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> DISMISSED"]

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Schedule an INITIAL or REINSPECTION inspection (case_id in body)"
    roles: [CodeOfficer]
    code: 201
    input: [case_id, kind, "notice_id?"]
    output: Inspection
    side_effects: ["outcome=PENDING"]
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List inspections; reverse-reachability for Inspection.case_id and Inspection.notice_id"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk]
    code: 200
    input: ["case_id?", "notice_id?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/submit"
    description: "Submit an inspection outcome"
    roles: [CodeOfficer]
    code: 200
    input: [outcome]
    output: Inspection
    side_effects: ["inspected_on = current clock", "outcome set; REINSPECTION COMPLIANT may cure linked notice"]

  # ---- ViolationNotice ----
  - method: POST
    path: "/notices"
    description: "Issue a ViolationNotice substantiated by an inspection (case_id in body)"
    roles: [CodeOfficer]
    code: 201
    input: [case_id, source_inspection_id, violation_class]
    output: ViolationNotice
    side_effects:
      - "status DRAFT->ISSUED in one call"
      - "effective_date, compliance_deadline set"
      - "owner_id copied from the case's property owner"
      - "escalation_multiplier frozen via repeat_offender_score at_issuance"
      - "create CITATION Fine"
      - "recompute case_posture and outstanding_balance_cents"
      - "increments Case.version by 1"
  - method: GET
    path: "/notices/{id}"
    description: "Get a notice with live fine_total_cents and days_overdue"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: []
    output: ViolationNotice
    side_effects: ["lazy ISSUED->OVERDUE evaluation; provisional fine_accrual on read"]
  - method: GET
    path: "/notices"
    description: "List notices; reverse-reachability for ViolationNotice.case_id, owner_id, source_inspection_id"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: ["case_id?", "owner_id?", "source_inspection_id?", "limit?", "offset?"]
    output: ViolationNotice[]
    side_effects: []
  - method: POST
    path: "/notices/{id}/contest"
    description: "Registrant contests a notice, opening a hearing"
    roles: [Registrant]
    code: 201
    input: [scheduled_for]
    output: Hearing
    side_effects: ["notice -> CONTESTED", "accrual paused", "create Hearing(SCHEDULED)"]

  # ---- Reinspection ----
  - method: POST
    path: "/reinspections"
    description: "Schedule a re-inspection of a notice for compliance (notice_id in body)"
    roles: [CodeOfficer]
    code: 201
    input: [notice_id]
    output: Reinspection
    side_effects: ["result=SCHEDULED"]
  - method: GET
    path: "/notices/{id}/reinspections"
    description: "List a notice's re-inspections (sub-resource reverse-reachability for Reinspection.notice_id)"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: ["limit?", "offset?"]
    output: Reinspection[]
    side_effects: []
  - method: POST
    path: "/reinspections/{id}/result"
    description: "Record a re-inspection result (PASSED cures the notice)"
    roles: [CodeOfficer]
    code: 200
    input: [result]
    output: Reinspection
    side_effects:
      - "result_on = current clock"
      - "PASSED: notice ISSUED/OVERDUE -> COMPLIED, freeze settlement fine_accrual"
      - "recompute case_posture and outstanding_balance_cents"

  # ---- Fine ----
  - method: GET
    path: "/notices/{id}/fines"
    description: "List a notice's fine ledger lines (sub-resource reverse-reachability for Fine.notice_id)"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: ["limit?", "offset?"]
    output: Fine[]
    side_effects: []

  # ---- Hearing ----
  - method: GET
    path: "/hearings/{id}"
    description: "Get a hearing"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, HearingOfficer, Registrant]
    code: 200
    input: []
    output: Hearing
    side_effects: []
  - method: GET
    path: "/notices/{id}/hearings"
    description: "List a notice's hearings (sub-resource reverse-reachability for Hearing.notice_id)"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, HearingOfficer, Registrant]
    code: 200
    input: ["limit?", "offset?"]
    output: Hearing[]
    side_effects: []
  - method: POST
    path: "/hearings/{id}/decide"
    description: "Adjudicate a hearing UPHELD or DISMISSED"
    roles: [HearingOfficer]
    code: 200
    input: [decision]
    output: Hearing
    side_effects:
      - "UPHELD: notice CONTESTED->UPHELD, accrual resumes (settlement bridge)"
      - "DISMISSED: notice CONTESTED->DISMISSED, CITATION Fine WAIVED, balance debit removed"
      - "recompute case_posture and outstanding_balance_cents"
  - method: POST
    path: "/hearings/{id}/continue"
    description: "Continue (postpone) a scheduled hearing"
    roles: [HearingOfficer]
    code: 200
    input: []
    output: Hearing
    side_effects: ["status -> CONTINUED", "continuance_count += 1"]
  - method: POST
    path: "/hearings/{id}/reschedule"
    description: "Reschedule a continued hearing"
    roles: [HearingOfficer]
    code: 200
    input: [scheduled_for]
    output: Hearing
    side_effects: ["status -> SCHEDULED", "scheduled_for updated"]

  # ---- AbatementOrder ----
  - method: POST
    path: "/abatement-orders"
    description: "Order abatement (board-up or demolition) (case_id in body)"
    roles: [CodeOfficer]
    code: 201
    input: [case_id, action_kind, estimated_cost_cents]
    output: AbatementOrder
    side_effects: ["status=ORDERED", "recompute case_posture (-> ABATEMENT)"]
  - method: GET
    path: "/abatement-orders/{id}"
    description: "Get an abatement order"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: []
  - method: GET
    path: "/cases/{id}/abatement-orders"
    description: "List a case's abatement orders (sub-resource reverse-reachability for AbatementOrder.case_id)"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: AbatementOrder[]
    side_effects: []
  - method: POST
    path: "/abatement-orders/{id}/start"
    description: "Start an ordered abatement"
    roles: [CodeOfficer]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/abatement-orders/{id}/complete"
    description: "Complete abatement and capture actual cost into the ledger"
    roles: [CodeOfficer]
    code: 200
    input: [actual_cost_cents]
    output: AbatementOrder
    side_effects:
      - "status -> COMPLETED"
      - "create ABATEMENT_COST Fine(assessed_cents=actual_cost_cents)"
      - "recompute outstanding_balance_cents and case_posture"
  - method: POST
    path: "/abatement-orders/{id}/cancel"
    description: "Cancel an ordered (not yet started) abatement"
    roles: [CodeOfficer]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: ["status -> CANCELLED", "recompute case_posture"]

  # ---- Lien ----
  - method: POST
    path: "/liens"
    description: "Record a lien for the case's outstanding balance (case_id in body; OCC on Case.version)"
    roles: [FinanceClerk]
    code: 201
    input: [case_id, expected_case_version]
    output: Lien
    side_effects:
      - "principal_cents, admin_fee_cents, total_cents frozen via lien_amount final_recorded"
      - "status=RECORDED"
      - "property_id copied from case"
      - "recompute case_posture (-> LIENED)"
      - "increments Case.version by 1"
  - method: GET
    path: "/liens/{id}"
    description: "Get a lien"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: []
    output: Lien
    side_effects: []
  - method: GET
    path: "/liens"
    description: "List liens; reverse-reachability for Lien.case_id and Lien.property_id"
    roles: [PlatformAdmin, CodeOfficer, FinanceClerk, Registrant]
    code: 200
    input: ["case_id?", "property_id?", "limit?", "offset?"]
    output: Lien[]
    side_effects: []
  - method: POST
    path: "/liens/{id}/release"
    description: "Release a recorded lien once paid in full"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Lien
    side_effects: ["status -> RELEASED", "all OPEN Fine -> SETTLED", "recompute balance and posture"]
  - method: POST
    path: "/liens/{id}/foreclose"
    description: "Foreclose a recorded lien after the waiting period"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Lien
    side_effects: ["status -> FORECLOSED", "recompute case_posture"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "a path id does not exist or child not under named parent" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "a body FK (owner_id/property_id/source_inspection_id/notice_id) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required body field or enum value out of range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition not defined from the resource's current state" }
  - { id: ERR_NOT_NOTICE_OWNER, http: 403, condition: "Registrant acting on a notice does not own the case's Property" }
  - { id: ERR_NO_SUBSTANTIATION, http: 422, condition: "notice issuance without a VIOLATION_FOUND inspection on the case" }
  - { id: ERR_FEE_SCHEDULE_MISSING, http: 422, condition: "no FeeSchedule row for the notice's violation_class" }
  - { id: ERR_DEMOLITION_NOT_PERMITTED, http: 422, condition: "DEMOLITION ordered without VACANT occupancy and a HAZARD notice in {OVERDUE, UPHELD}" }
  - { id: ERR_CONTEST_WINDOW_CLOSED, http: 422, condition: "contest filed after the allowed contest window" }
  - { id: ERR_HEARING_NOT_RIPE, http: 422, condition: "hearing decided before scheduled_for, or reschedule target in the past" }
  - { id: ERR_CONTINUANCE_LIMIT, http: 422, condition: "hearing continued more than MAX_CONTINUANCES times" }
  - { id: ERR_FORECLOSURE_NOT_RIPE, http: 422, condition: "foreclosure attempted before FORECLOSURE_WAIT_DAYS elapsed" }
  - { id: ERR_LIEN_ALREADY_EXISTS, http: 409, condition: "a Lien for the case is already PENDING or RECORDED" }
  - { id: ERR_NOTHING_TO_LIEN, http: 422, condition: "lien recording attempted with Case.outstanding_balance_cents == 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version != current Case.version on lien recording" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 409, condition: "close/release attempted with nonzero outstanding balance or unpaid lien" }
  - { id: ERR_MISSING_ACTUAL_COST, http: 422, condition: "abatement completion without actual_cost_cents" }
  - { id: ERR_DUPLICATE_PARCEL, http: 409, condition: "parcel_number already exists on a non-ARCHIVED Property" }
  - { id: ERR_REINSPECTION_TARGET_INVALID, http: 422, condition: "REINSPECTION inspection notice_id missing or not ISSUED/OVERDUE on the same case" }
  - { id: ERR_PROPERTY_HAS_OPEN_CASE, http: 409, condition: "opening a Case on a Property that already has a non-CLOSED Case (exclusive-occupancy overlap)" }
  - { id: ERR_HEARING_SLOT_CONFLICT, http: 409, condition: "a Hearing.scheduled_for falls within HEARING_BUFFER_DAYS of another active Hearing on the same case (buffer overlap)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator: seeds fee schedules, manages the clock, registers owners/properties"
    identity: opaque
    exclusive_operations:
      - "POST /fee-schedules"
      - "POST /_clock/set"
    shared_operations:
      - "POST /owners"
      - "POST /properties"
      - "GET (all read endpoints)"

  - name: CodeOfficer
    description: "Field inspector: opens cases, triages complaints, inspects, issues notices, orders abatement"
    identity: opaque
    exclusive_operations:
      - "POST /cases"
      - "POST /complaints/{id}/triage"
      - "POST /complaints/{id}/dismiss"
      - "POST /inspections"
      - "POST /inspections/{id}/submit"
      - "POST /notices"
      - "POST /reinspections"
      - "POST /reinspections/{id}/result"
      - "POST /abatement-orders"
      - "POST /abatement-orders/{id}/start"
      - "POST /abatement-orders/{id}/complete"
      - "POST /abatement-orders/{id}/cancel"
    shared_operations:
      - "POST /owners"
      - "POST /properties"
      - "POST /complaints"
      - "GET (all read endpoints)"

  - name: HearingOfficer
    description: "Adjudicator: decides, continues, and reschedules contested-notice hearings"
    identity: opaque
    exclusive_operations:
      - "POST /hearings/{id}/decide"
      - "POST /hearings/{id}/continue"
      - "POST /hearings/{id}/reschedule"
    shared_operations:
      - "GET /hearings/{id}"
      - "GET /notices/{id}/hearings"

  - name: FinanceClerk
    description: "Fiscal officer: posts payments, records/releases/forecloses liens, closes cases"
    identity: opaque
    exclusive_operations:
      - "POST /cases/{id}/payments"
      - "POST /liens"
      - "POST /liens/{id}/release"
      - "POST /liens/{id}/foreclose"
      - "POST /cases/{id}/close"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Registrant
    description: "Cited owner acting on own notices: files complaints and contests notices"
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /notices/{id}/contest"
    shared_operations:
      - "POST /complaints"
      - "GET (read endpoints for own owner/property/case/notice/lien/hearing)"
