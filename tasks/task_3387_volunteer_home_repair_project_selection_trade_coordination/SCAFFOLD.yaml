    roles: [AffiliateStaff]
    code: 200
    input: [status]
    output: MaterialOrder
    side_effects: ["DELIVERED: spent += total", "RETURNED from DELIVERED: spent -= total (refund); posture recompute throughout"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/rebuild/warranty-claims"
    description: "File a warranty claim on a completed repair within the 12-month window"
    roles: [Homeowner, AffiliateStaff]
    code: 201
    input: [project_id, description, claim_amount_cents]
    output: WarrantyClaim
    side_effects: ["status SUBMITTED; window and ownership checks"]

  - method: GET
    path: "/rebuild/warranty-claims"
    description: "List warranty claims; filter by project"
    roles: [Any]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/rebuild/warranty-claims/{claimId}"
    description: "Get one warranty claim"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: PATCH
    path: "/rebuild/warranty-claims/{claimId}"
    description: "Drive claim transitions: APPROVED (with payout_cents) | DENIED | RESOLVED"
    roles: [AffiliateStaff]
    code: 200
    input: [status, "payout_cents?", "resolution_note?"]
    output: WarrantyClaim
    side_effects: ["APPROVED: reserve cap enforced", "RESOLVED: spent += payout"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. All date-sensitive rules (event_date, training validity, warranty window, credential expiry) evaluate against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog (45 codes)
# =============================================================================
errors:
  # --- Authentication & ownership ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role is not in the endpoint's roles list, or a role-specific field rule is violated (e.g. Homeowner setting a status other than WITHDRAWN, Volunteer setting safety_training_completed_on)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed identity mismatch: Homeowner not the application owner, TradePartner not the order's contractor, Volunteer not the enrollment owner or event team leader, SponsorRep not the commitment's sponsor" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, enum value outside the declared set, numeric range violated (household_size 1..8, amounts > 0, max_volunteers >= 1, est_high >= est_low), or team-leader flag on a non-eligible volunteer" }

  # --- Existence ---
  - { id: ERR_FUNDING_CYCLE_NOT_FOUND, http: 404, condition: "funding cycle id does not exist" }
  - { id: ERR_SELECTION_RUN_NOT_FOUND, http: 404, condition: "selection run id does not exist" }
  - { id: ERR_SPONSOR_NOT_FOUND, http: 404, condition: "sponsor id does not exist" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "commitment id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "assessment id does not exist" }
  - { id: ERR_SCOPE_ITEM_NOT_FOUND, http: 404, condition: "scope item id does not exist (including elements of scope_item_ids)" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "project id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "event id does not exist" }
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "volunteer id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollment id does not exist" }
  - { id: ERR_CONTRACTOR_NOT_FOUND, http: 404, condition: "trade contractor id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "trade work order id does not exist" }
  - { id: ERR_MATERIAL_ORDER_NOT_FOUND, http: 404, condition: "material order id does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "warranty claim id does not exist" }

  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_funding_cycle_version or expected_project_version does not match the parent's current version" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic from-state violation for any state machine (including terminal lockdown, IN_BUILD cancellation ban, completion gates)" }
  - { id: ERR_CYCLE_NOT_SELECTION_OPEN, http: 409, condition: "Selection-run create/apply requires the cycle in SELECTION_OPEN" }
  - { id: ERR_EVENT_NOT_PUBLISHED, http: 409, condition: "Enrollment requires the event in PUBLISHED" }
  - { id: ERR_EVENT_NOT_LOCKABLE, http: 409, condition: "LOCK requires an active team-leader enrollment and project readiness_posture == READY" }
  - { id: ERR_PROJECT_NOT_COMPLETED, http: 409, condition: "Warranty claim requires the project in WARRANTY_ACTIVE" }

  # --- Safety ---
  - { id: ERR_VOLUNTEER_NOT_ELIGIBLE, http: 409, condition: "Volunteer lacks a signed waiver, has lapsed/missing safety training (> 365 days), or is DEACTIVATED" }
  - { id: ERR_CONTRACTOR_NOT_QUALIFIED, http: 422, condition: "Contractor not ACTIVE, or license/insurance expires before the visit date" }

  # --- Temporal ---
  - { id: ERR_EVENT_DATE_PAST, http: 422, condition: "event_date is before the logical clock date" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "visit_end not strictly after visit_start; scheduled_on before clock date; follow_up before completed_on" }
  - { id: ERR_TRADE_WINDOW_CONFLICT, http: 409, condition: "Half-open visit-window overlap with another SCHEDULED/IN_PROGRESS order of the same contractor (adjacency permitted)" }
  - { id: ERR_VOLUNTEER_DOUBLE_BOOKED, http: 409, condition: "Volunteer already holds an active enrollment on another event with the same calendar event_date" }
  - { id: ERR_CONTRACTOR_DAY_CAPACITY, http: 409, condition: "Contractor already has max_concurrent_jobs distinct work orders on that calendar day" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Claim filed after warranty_valid_until (12 calendar months after completion, inclusive boundary)" }

  # --- Constraint ---
  - { id: ERR_EVENT_AT_CAPACITY, http: 409, condition: "Active enrollment count already equals max_volunteers (the enrollment reaching equality succeeds; the next fails)" }
  - { id: ERR_TEAM_LEADER_ALREADY_ASSIGNED, http: 409, condition: "Event already has an active is_team_leader enrollment" }
  - { id: ERR_TRADE_MISMATCH, http: 422, condition: "Covered scope items include a volunteer_performable item or a required_trade different from the contractor's trade" }
  - { id: ERR_SCOPE_ITEM_ALREADY_COVERED, http: 409, condition: "A scope item is already covered by another work order not in CANCELLED" }
  - { id: ERR_PERMIT_REQUIRED, http: 422, condition: "Approving a work order whose covered items require a permit without supplying permit_number" }
  - { id: ERR_SCOPE_ITEM_NOT_DROPPABLE, http: 422, condition: "Dropping a scope item covered by a non-terminal work order" }
  - { id: ERR_INCOME_LIMIT_EXCEEDED, http: 422, condition: "household_income_cents * 100 > 80 * AMI for the household size" }
  - { id: ERR_VERIFICATION_INCOMPLETE, http: 422, condition: "ownership_doc_provided or occupancy_doc_provided is false at verification" }

  # --- Fiscal ---
  - { id: ERR_INSUFFICIENT_FUNDING, http: 402, condition: "Material-order total exceeds the cycle's available_cents" }
  - { id: ERR_ENVELOPE_EXCEEDED, http: 402, condition: "Scope-amendment envelope delta exceeds available_cents, or a PAID invoice exceeds the project's reserved_balance_cents" }
  - { id: ERR_WARRANTY_CAP_EXCEEDED, http: 402, condition: "payout_cents exceeds the remaining warranty reserve (8% of reconciled cost, capped at 250000 cents)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Affiliate platform operator: cycle and sponsor administration, contractor registry, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /rebuild/funding-cycles, PATCH /rebuild/funding-cycles/{id}"
      - "POST /rebuild/sponsors"
      - "POST /rebuild/trade-contractors, PATCH /rebuild/trade-contractors/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /rebuild/funding-cycles/{id}/selection-runs (with AffiliateStaff)"
      - "GET endpoints (via Any)"

  - name: AffiliateStaff
    description: "Program staff: verification, assessment scheduling, selection application, project/event/material/warranty administration"
    identity: opaque
    exclusive_operations:
      - "POST /rebuild/selection-runs/{id}/apply"
      - "PATCH /rebuild/commitments/{id}"
      - "PATCH /rebuild/applications/{id} (all transitions except the Homeowner-withdrawal path)"
      - "POST /rebuild/assessments, PATCH /rebuild/assessments/{id} (with Assessor)"
      - "PATCH /rebuild/projects/{id}, POST /rebuild/projects/{id}/scope-amendments"
      - "POST /rebuild/events, PATCH /rebuild/events/{id}"
      - "POST /rebuild/trade-work-orders, POST .../schedule, POST .../inspect, PATCH (staff transitions)"
      - "POST /rebuild/material-orders, PATCH /rebuild/material-orders/{id}"
      - "PATCH /rebuild/warranty-claims/{id}"
      - "PATCH /rebuild/volunteers/{id} (safety_training_completed_on, status)"
    shared_operations:
      - "POST /rebuild/applications, POST /rebuild/commitments, POST /rebuild/enrollments, PATCH /rebuild/enrollments/{id}"
      - "GET endpoints (via Any)"

  - name: Assessor
    description: "Field assessor: records findings and proposed scopes"
    identity: opaque
    exclusive_operations:
      - "POST /rebuild/assessments/{id}/complete"
    shared_operations:
      - "PATCH /rebuild/assessments/{id} (with AffiliateStaff)"
      - "GET endpoints (via Any)"

  - name: Homeowner
    description: "Applicant homeowner; X-User-ID equals the HomeownerApplication id"
    identity: "entity_backed:HomeownerApplication"
    exclusive_operations:
      - "POST /rebuild/warranty-claims (own project only, with AffiliateStaff)"
    shared_operations:
      - "GET /rebuild/applications/{id} (own only)"
      - "PATCH /rebuild/applications/{id} with status=WITHDRAWN (own only)"
      - "GET endpoints (via Any)"

  - name: Volunteer
    description: "Registered volunteer; X-User-ID equals the Volunteer id"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "PATCH /rebuild/volunteers/{id} waiver_signed_on (own record only)"
    shared_operations:
      - "POST /rebuild/enrollments (self only), PATCH /rebuild/enrollments/{id} (own WITHDRAWN/re-ENROLLED; CHECKED_IN as the event's team leader)"
      - "GET endpoints (via Any)"

  - name: TradePartner
    description: "Licensed contractor representative; X-User-ID equals the TradeContractor id"
    identity: "entity_backed:TradeContractor"
    exclusive_operations:
      - "PATCH /rebuild/trade-work-orders/{id} with status=QUOTED (quote_cents) or INVOICED (invoice_cents), own orders only"
    shared_operations:
      - "GET endpoints (via Any)"

  - name: SponsorRep
    description: "Corporate sponsor representative; X-User-ID equals the Sponsor id"
    identity: "entity_backed:Sponsor"
    exclusive_operations:
      - "POST /rebuild/commitments for own sponsor (with AffiliateStaff)"
    shared_operations:
      - "GET endpoints (via Any)"

  - name: Anonymous
    description: "Unauthenticated caller; may only submit applications and register as a volunteer"
    identity: opaque
    exclusive_operations:
      - "POST /rebuild/volunteers"
    shared_operations:
      - "POST /rebuild/applications (with AffiliateStaff)"

  - name: Any
    description: "Shared pseudo-role: any caller presenting a declared role EXCEPT Anonymous (which is unauthenticated) may use these endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
