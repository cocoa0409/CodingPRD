  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_panel_create_with_stale_product_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[panel-create-stale-product]
          - validations[priority=13]
          - errors[ERR_STALE_PRODUCT_VERSION]
        distinguishing_aspect: "The Product OCC guard: a version captured before an unrelated PATCH is stale, the refused create leaves the version untouched, and the same body succeeds once the freshly read version is presented."
        test_recipe:
          setup:
            - "One DRAFT product read at version 1, then renamed so its version is 2 while the client still holds 1."
          setup_api_calls:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Magnesium Glycinate", net_quantity_g: 120, servings_per_container: 60 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "GET /supplement-compliance/products/${prod_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { stale_v: $.data.version }
            - call: "PATCH /supplement-compliance/products/${prod_id}"
              payload: { brand_name: "NutraCore Labs" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
          trigger:
            - call: "POST /supplement-compliance/label-panels"
              payload: { product_id: "${prod_id}", expected_product_version: "${stale_v}", panel_format: "STANDARD", serving_size_text: "2 capsules", serving_weight_g: 2.0, servings_per_container_declared: 60, effective_from: "2026-09-01", effective_until: "2026-12-31", declared_warning_codes: ["PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { err: $.data.error_id }
            - call: "GET /supplement-compliance/products/${prod_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { fresh_v: $.data.version }
            - call: "POST /supplement-compliance/label-panels"
              payload: { product_id: "${prod_id}", expected_product_version: "${fresh_v}", panel_format: "STANDARD", serving_size_text: "2 capsules", serving_weight_g: 2.0, servings_per_container_declared: 60, effective_from: "2026-09-01", effective_until: "2026-12-31", declared_warning_codes: ["PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { panel_id: $.data.id }
          assert:
            - "the stale create returns HTTP 412 with error_id == ERR_STALE_PRODUCT_VERSION"
            - "the intervening read shows Product.${prod_id}.version == 2, unchanged by the refused create (a rejected write bumps nothing)"
            - "the retried create returns HTTP 201 with panel_status == DRAFT, panel_lines_required == null and panel_lines_allowed == null until validation"
