    description: "Get an appraisal by id (flat convenience route)"
    roles: [WorkoutOfficer, SpecialAssetsManager, AppraisalDesk, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: []
    output: CollateralAppraisal
    side_effects: []

  - method: GET
    path: "/appraisals"
    description: "Filtered list of appraisals (reverse-reachability for CollateralAppraisal.collateral_id)"
    roles: [WorkoutOfficer, SpecialAssetsManager, AppraisalDesk, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: ["collateral_id?", "limit?", "offset?"]
    output: "CollateralAppraisal[]"
    side_effects: []

  - method: GET
    path: "/impairments/{assessmentId}"
    description: "Get an impairment assessment by id (flat convenience route)"
    roles: [WorkoutOfficer, SpecialAssetsManager, CreditCommittee, LoanAccounting, PortfolioAnalyst, SystemAdmin]
    code: 200
    input: []
    output: ImpairmentAssessment
