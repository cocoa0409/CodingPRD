  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_life_threatening_record_reaches_sweep_urgency_five_links
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_IN_PROGRESS
          - calculations.property_readiness_posture
          - entities.Property.fields.readiness_posture
          - entities.WorkOrder.fields.priority_tier
          - entities.WorkOrder.fields.due_at
          - entities.SelfAssessmentSweep.fields.urgent_work_order_count
        distinguishing_aspect: |
          A single POST /inspections/{id}/deficiencies has to travel five entities:
          Deficiency created (link 1) -> Inspection area points and life_threatening_count
          recomputed (link 2) -> Property.open_life_threatening_count and readiness_posture
          RESTRICTED (link 3) -> every OPEN WorkOrder of the property raised to URGENT with
          due_at pulled in 24 hours (link 4) -> the owning SelfAssessmentSweep's
          urgent_work_order_count and version updated (link 5). Link 4 and link 5 touch a sweep
          that the request never names, and the work order predates the inspection entirely.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard with LT_GAS and SEV_WINDOW."
            - "Property Maple Court with unit 101, and an IN_PROGRESS sweep carrying one OPEN ROUTINE work order from a SEV_WINDOW finding observed 2026-08-03T09:00:00.000Z with due_at 2026-09-02T09:00:00.000Z."
            - "An inspection of the same property in IN_PROGRESS with unit 101 GRANTED; the property is READY at that point because one open SEVERE deficiency is below the WATCH floor of 5."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
