          The cash gate is STRICT: departing requires cash_on_hand_cents <
          cash_limit_cents, so a driver holding exactly 2900 against a 2900 limit
          is blocked with HTTP 402, and a single one-cent safe drop taking the
          balance to 2899 unblocks the very same call. The boundary is on a
