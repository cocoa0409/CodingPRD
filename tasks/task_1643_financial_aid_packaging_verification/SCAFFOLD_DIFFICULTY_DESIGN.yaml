  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict across different category pairs.
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_pj_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Category pair (state vs business_safety): a PJ approve call on a case
          still in SUBMITTED by the user who would also be the reviewer violates
          both priority 5 (ERR_INVALID_STATE) and priority 7 (segregation);
          priority 5 must win because state preconditions outrank business rules.
        test_recipe:
          setup:
