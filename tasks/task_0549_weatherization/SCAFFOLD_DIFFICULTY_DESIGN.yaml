          ScopeItem PROPOSED->APPROVED depends on the referenced EnergyAudit being APPROVED; with the
          audit only SUBMITTED, approve is rejected with ERR_AUDIT_NOT_APPROVED (ScopeItem -> EnergyAudit).
        test_recipe:
