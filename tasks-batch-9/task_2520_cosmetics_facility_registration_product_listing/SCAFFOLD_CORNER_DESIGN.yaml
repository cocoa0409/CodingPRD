              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan"
              payload: { corrective_summary: "Wholesale retrieval of lot LOT-A", distribution_depth: "WHOLESALE" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_v1: $.data.version }
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "WHOLESALE", expected_recall_action_version: "${ra_v1}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd1_id: $.data.id }
            - call: "POST /cosmetics/withdrawals/${wd1_id}/records-production"
              payload: { distribution_record_ids: ["${rec_id}"] }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { wd1_count: $.data.records_produced_count, wd1_units: $.data.shipped_units_total }
            - call: "GET /cosmetics/recall-actions/${ra_id}"
              payload: {}
