            - "DispositionOrder.${disp_md}.status remains APPROVED (not EXECUTED)"
            - "the DESTRUCTION execute returns 200 EXECUTED with recovered_value_cents == 0"
            - "after destruction: Warehouse.${wh_id}.quarantined_units == 5 (only the markdown-blocked 5 remain)"

