# =============================================================================
# task_0532_utility_locate — §1.8 Scaffold Difficulty Design
# Nine Difficulty Rules (§0.5) × ≥2 instances = 18 instances total.
# All setup_api_calls/trigger chains use only §1.5 endpoints.
# Logical clock default before any set_current_utc is 2026-05-01T00:00:00Z (Fri).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sla_due_emergency_vs_normal_ticket_time
        grounds:
          - calculations.sla_due_at
          - entities.LocateTicket.fields.sla_due_at
          - state_machines.LocateTicket.INTAKE_to_SUBMITTED
        distinguishing_aspect: |
          Same submit clock 2026-05-01T00:00:00Z on the LocateTicket domain: an EMERGENCY
          ticket resolves sla_due_at to 2026-05-01T02:00:00Z (flat 2h) while a NORMAL ticket
          resolves to 2026-05-05T00:00:00Z (2 business days, skipping Sat/Sun) — divergent
          outputs from identical inputs.
        test_recipe:
          setup:
            - "One ACTIVE excavator; one ACTIVE member whose service_polygon covers dig_polygon."
            - "Clock at default 2026-05-01T00:00:00Z (Friday)."
            - "One EMERGENCY ticket and one NORMAL (white-lined) ticket, both submitted at the default clock."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "dig@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "emergency main break" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { emerg_ticket_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "NORMAL", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "normal trench", is_white_lined: true }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { normal_ticket_id: $.data.id }
          trigger:
            - call: "POST /locate-tickets/${emerg_ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { emerg_due: $.data.sla_due_at }
            - call: "POST /locate-tickets/${normal_ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { normal_due: $.data.sla_due_at }
          assert:
            - "LocateTicket.${emerg_ticket_id}.sla_due_at == '2026-05-01T02:00:00Z'"
            - "LocateTicket.${normal_ticket_id}.sla_due_at == '2026-05-05T00:00:00Z'"
            - "LocateTicket.${emerg_ticket_id}.sla_due_at != LocateTicket.${normal_ticket_id}.sla_due_at"

      - name: damage_liability_marked_vs_no_marks
        grounds:
          - calculations.liability_apportionment
          - entities.DamageReport.fields.excavator_liability_cents
          - state_machines.DamageReport.FILED_to_UNDER_REVIEW
        distinguishing_aspect: |
          On the DamageReport (money) domain, identical repair_cost_cents=10000 apportions to
          excavator_liability_cents=2500 when a mark-out was in force and dug_within_marks=true,
          but to 10000 when markout_id is null — a different subject and formula from the SLA time
          dual-variant.
        test_recipe:
          setup:
            - "One excavator, one member, one CLOSED ticket with a COMPLETE mark-out (for the marked report)."
            - "Two damage reports on the same ticket: one citing the mark-out with dug_within_marks=true, one with no mark-out."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d2@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina Tech", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_v: $.data.version }
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${ticket_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${ticket_id}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /locate-assignments/${asg_id}/en-route"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${ticket_id}", marks_count: 5 }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk_id: $.data.id }
            - call: "POST /mark-outs/${mk_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /damage-reports"
              payload: { ticket_id: "${ticket_id}", member_utility_id: "${mem_id}", repair_cost_cents: 10000, dug_within_marks: true, markout_id: "${mk_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { dr_marked_id: $.data.id }
            - call: "POST /damage-reports"
              payload: { ticket_id: "${ticket_id}", member_utility_id: "${mem_id}", repair_cost_cents: 10000, dug_within_marks: false }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { dr_nomarks_id: $.data.id }
          trigger:
            - call: "POST /damage-reports/${dr_marked_id}/review"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /damage-reports/${dr_nomarks_id}/review"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
          assert:
            - "DamageReport.${dr_marked_id}.excavator_liability_cents == 2500"
            - "DamageReport.${dr_marked_id}.member_liability_cents == 7500"
            - "DamageReport.${dr_nomarks_id}.excavator_liability_cents == 10000"
            - "DamageReport.${dr_nomarks_id}.member_liability_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assignment_sla_three_input_nonlinear
        grounds:
          - calculations.assignment_sla
          - entities.LocateAssignment.fields.sla_deadline_at
          - entities.UtilityNotification.fields.is_high_priority
        distinguishing_aspect: |
          Mode (a): assignment_sla combines 3 inputs non-linearly — EMERGENCY selects member
          emergency_contact_minutes=60, GAS high-priority multiplies by 0.5 (ceil -> 30), and
          because tech load < LOAD_THRESHOLD no slack is added: sla_deadline_at = dispatched_at + 30min.
        test_recipe:
          setup:
            - "GAS (high-priority) member; tech with 0 active assignments; EMERGENCY ticket cleared and dispatched at default clock."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d3@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 }, emergency_contact_minutes: 60 }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina Tech", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${ticket_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${ticket_id}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id, deadline: $.data.sla_deadline_at }
          assert:
            - "LocateAssignment.${asg_id}.sla_deadline_at == '2026-05-01T00:30:00Z'"

      - name: sla_due_normal_business_day_skip_order
        grounds:
          - calculations.sla_due_at
          - entities.LocateTicket.fields.sla_due_at
        distinguishing_aspect: |
          Mode (c): sla_due_at for a NORMAL ticket has a pinned iteration order — advancing day by
          day and decrementing the business-day counter only on Mon-Fri. Submitting Friday
          2026-05-01T00:00:00Z lands on Tuesday 2026-05-05T00:00:00Z, not Sunday 2026-05-03; the
          weekend-skip evaluation order is what makes the value well-defined.
        test_recipe:
          setup:
            - "One member covering the dig site; one white-lined NORMAL ticket submitted at the default Friday clock."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d4@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Water Co", facility_type: "WATER", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "NORMAL", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "trench", is_white_lined: true }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { due: $.data.sla_due_at }
          assert:
            - "LocateTicket.${ticket_id}.sla_due_at == '2026-05-05T00:00:00Z'"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: markout_refresh_cycle_complete_to_superseded
        grounds:
          - state_machines.MarkOut.COMPLETE_to_SUPERSEDED
          - state_machines.MarkOut.IN_PROGRESS_to_COMPLETE
          - entities.MarkOut.fields.is_refresh
        distinguishing_aspect: |
          MarkOut is cyclic on the re-mark loop: a COMPLETE mark-out returns to being replaced
          (COMPLETE -> SUPERSEDED) when a fresh mark-out completes, while the new one is COMPLETE —
          a loop within the MarkOut entity distinct from any linear pipeline.
        test_recipe:
          setup:
            - "Ticket MARKED with a first COMPLETE mark-out mk1; a refresh mark-out mk2 created and completed."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d5@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${ticket_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${ticket_id}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /locate-assignments/${asg_id}/en-route"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${ticket_id}", marks_count: 4 }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk1_id: $.data.id }
            - call: "POST /mark-outs/${mk1_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { ticket_v: $.data.version }
            - call: "GET /locate-tickets/${ticket_id}"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { ticket_v2: $.data.version }
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${ticket_id}", marks_count: 6, supersedes_markout_id: "${mk1_id}", expected_ticket_version: "${ticket_v2}" }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk2_id: $.data.id }
          trigger:
            - call: "POST /mark-outs/${mk2_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk2_status: $.data.status }
          assert:
            - "MarkOut.${mk1_id}.status == 'SUPERSEDED'"
            - "MarkOut.${mk2_id}.status == 'COMPLETE'"
            - "MarkOut.${mk2_id}.is_refresh == true"

      - name: damage_report_branching_settle_or_dispute
        grounds:
          - state_machines.DamageReport.UNDER_REVIEW_to_SETTLED
          - state_machines.DamageReport.UNDER_REVIEW_to_DISPUTED
          - state_machines.DamageReport.FILED_to_UNDER_REVIEW
        distinguishing_aspect: |
          DamageReport branches at UNDER_REVIEW into two divergent terminals with different actors
          and side-effect sets: FacilityOwner settle -> SETTLED vs Excavator dispute -> DISPUTED —
          a fork on a different entity than MarkOut's cycle.
        test_recipe:
          setup:
            - "Two damage reports, both FILED then reviewed (UNDER_REVIEW) on the same ticket."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d6@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /damage-reports"
              payload: { ticket_id: "${ticket_id}", member_utility_id: "${mem_id}", repair_cost_cents: 4000, dug_within_marks: false }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { dr1_id: $.data.id }
            - call: "POST /damage-reports"
              payload: { ticket_id: "${ticket_id}", member_utility_id: "${mem_id}", repair_cost_cents: 4000, dug_within_marks: false }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { dr2_id: $.data.id }
            - call: "POST /damage-reports/${dr1_id}/review"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /damage-reports/${dr2_id}/review"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /damage-reports/${dr1_id}/settle"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { dr1_status: $.data.status }
            - call: "POST /damage-reports/${dr2_id}/dispute"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { dr2_status: $.data.status }
          assert:
            - "DamageReport.${dr1_id}.status == 'SETTLED'"
            - "DamageReport.${dr2_id}.status == 'DISPUTED'"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: positive_response_bubbles_ticket_all_clear_then_markable
        grounds:
          - state_machines.UtilityNotification.PENDING_to_CLEAR
          - state_machines.LocateTicket.SUBMITTED_to_RESPONSES_COMPLETE
          - calculations.response_posture
        distinguishing_aspect: |
          Depth-3 cascade from a positive-response trigger: POST /positive-responses mutates the
          Notification (CLEAR); that mutation drives ticket.open_response_count to 0 which itself
          bubbles the ticket SUBMITTED -> RESPONSES_COMPLETE and recomputes response_posture ->
          ALL_CLEAR. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "Submitted ticket with a single PENDING notification."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d7@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${ticket_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
          trigger:
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "GET /locate-tickets/${ticket_id}"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { posture: $.data.response_posture, tstatus: $.data.status, orc: $.data.open_response_count }
          assert:
            - "UtilityNotification.${note_id}.response_status == 'CLEAR'"
            - "LocateTicket.${ticket_id}.open_response_count == 0"
            - "LocateTicket.${ticket_id}.response_posture == 'ALL_CLEAR'"
            - "LocateTicket.${ticket_id}.status == 'RESPONSES_COMPLETE'"

      - name: markout_complete_bubbles_ticket_marked_and_window
        grounds:
          - state_machines.MarkOut.IN_PROGRESS_to_COMPLETE
          - state_machines.LocateTicket.RESPONSES_COMPLETE_to_MARKED
          - calculations.dig_window
        distinguishing_aspect: |
          Depth-2 cascade from a distinct trigger (POST /mark-outs/{id}/complete): completing the
          mark-out sets markout_completed_at, and that mutation itself bubbles the ticket
          RESPONSES_COMPLETE -> MARKED and sets dig_window_expires_at = completed_at + 21 days.
          Different originating transition from the response-bubble cascade.
        test_recipe:
          setup:
            - "Ticket RESPONSES_COMPLETE (single CLEAR notification), assignment EN_ROUTE, mark-out IN_PROGRESS, clock at default."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "d8@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /locate-tickets/${ticket_id}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${ticket_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
