  - rule_id: resource_temporal_overlap
    instances:

      - name: transfer_hold_half_open_exclusion
        grounds:
          - state_machines.VehicleHold
          - entities.TransferRequest.fields.hold_expires_at
          - errors.ERR_VEHICLE_ALREADY_HELD
        distinguishing_aspect: "Half-open interval semantics on resource Vehicle: the transfer hold occupies [creation, hold_expires_at) — a second transfer request during the hold is rejected ERR_VEHICLE_ALREADY_HELD, but a request made after HOLD_EXPIRED (clock exactly at hold_expires_at, expiry inclusive) succeeds, so adjacency at the expiry instant is permitted."
