  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: research_plan_revision_loop_cycle
        grounds:
          - state_machines.ResearchPlan.DRAFT_to_SUBMITTED
          - state_machines.ResearchPlan.SUBMITTED_to_UNDER_REVIEW
          - state_machines.ResearchPlan.UNDER_REVIEW_to_REVISION_REQUIRED
          - state_machines.ResearchPlan.REVISION_REQUIRED_to_DRAFT
        distinguishing_aspect: |
          Cyclic machine on ResearchPlan: DRAFT→SUBMITTED→UNDER_REVIEW→REVISION_REQUIRED→
          (PUT plan_text)→DRAFT→SUBMITTED again; review_cycle_count increments on each
          entry to UNDER_REVIEW and approved_plan_version is cleared on the loop-back,
          so a second approval pins the NEW version.
        test_recipe:
          setup:
            - "Edition REGISTRATION_OPEN; Mentor M1 with project P (human subjects); ResearchPlan RP for P; EthicsReviewer R (distinct mentor id RM)"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Cycle Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "BME", name: "Biomed", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Proj", email: "mp@x.com" }
              as: FairDirector
              captures: { mp: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Rev", email: "mr@x.com" }
              as: FairDirector
              captures: { mr: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "Human Subjects Study", team_size: 2, involves_human_subjects: true, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${mp}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/research-plans"
              payload: { project_id: "${p}", plan_text: "v1 plan", risk_level: "MODERATE" }
              as: Mentor
              as_user_id: "${mp}"
              captures: { rp: $.data.id }
          trigger:
            - call: "POST /science-fair/research-plans/${rp}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mp}"
            - call: "POST /science-fair/research-plans/${rp}/begin-review"
              payload: {}
              as: EthicsReviewer
            - call: "POST /science-fair/research-plans/${rp}/decisions"
              payload: { reviewer_mentor_id: "${mr}", decision: "REQUEST_REVISION", rationale: "needs consent form" }
              as: EthicsReviewer
            - call: "PUT /science-fair/research-plans/${rp}"
              payload: { plan_text: "v2 plan with consent" }
              as: Mentor
              as_user_id: "${mp}"
            - call: "POST /science-fair/research-plans/${rp}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mp}"
            - call: "POST /science-fair/research-plans/${rp}/begin-review"
              payload: {}
              as: EthicsReviewer
            - call: "POST /science-fair/research-plans/${rp}/decisions"
              payload: { reviewer_mentor_id: "${mr}", decision: "APPROVE" }
              as: EthicsReviewer
          assert:
            - "ResearchPlan.${rp}.status == APPROVED"
            - "ResearchPlan.${rp}.review_cycle_count == 2"
            - "ResearchPlan.${rp}.approved_plan_version == ResearchPlan.${rp}.version (pinned at the SECOND approval, not the first)"
            - "Project.${p}.ethics_status == APPROVED"
      - name: project_parallel_dimensions_independent
        grounds:
          - state_machines.Project
          - entities.Project.fields.registration_status
          - entities.Project.fields.inspection_status
          - entities.Project.fields.judging_status
        distinguishing_aspect: |
          Parallel state dimensions on a single Project entity: registration_status,
          inspection_status, and judging_status evolve independently — a project can
          be CONFIRMED × SCHEDULED × ASSIGNED, and a FAIL inspection flips
          registration_status to WITHDRAWN while judging history remains queryable.
          This is a different entity (Project) from the ResearchPlan cycle instance.
        test_recipe:
          setup:
            - "Edition driven to JUDGING with project P CONFIRMED, booth assigned (SCHEDULED), one judge ASSIGNED (judging_status=ASSIGNED)"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Parallel Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "PHYS", name: "Physics", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor P", email: "mp@x.com" }
              as: FairDirector
              captures: { men: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "Para Project", team_size: 1, involves_human_subjects: false, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${men}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${men}"
            - call: "POST /science-fair/fair-editions/${ed}/close-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/booth-assignments"
              payload: { hall: "B", booth_number: 7, inspection_window_start: "2026-08-01T00:00:00Z", inspection_window_end: "2026-08-10T00:00:00Z" }
              as: OperationsLead
            - call: "POST /science-fair/fair-editions/${ed}/begin-judging"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/judges"
              payload: { fair_edition_id: "${ed}", full_name: "JX", max_assignments: 5 }
              as: FairDirector
              captures: { jx: $.data.id }
            - call: "POST /science-fair/judges/${jx}/activate"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects/${p}/judging-assignments"
              payload: { judge_id: "${jx}" }
              as: FairDirector
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /science-fair/projects/${p}/inspection-result"
              payload: { result: "FAIL" }
              as: SafetyInspector
          assert:
            - "Project.${p}.inspection_status == FAILED"
            - "Project.${p}.registration_status == WITHDRAWN (cascade from failed inspection)"
            - "Project.${p}.judging_status == ASSIGNED (judging dimension untouched by inspection cascade — parallel dimensions evolve independently)"
            - "JudgingAssignment.${asg}.status == ASSIGNED (assignment row not cascaded)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ethics_reject_cascades_plan_to_project_withdrawal
        grounds:
          - state_machines.ResearchPlan.UNDER_REVIEW_to_REJECTED
          - state_machines.Project
        distinguishing_aspect: |
          Depth-2 cascade triggered by the ethics decision: EthicsReview POST →
          ResearchPlan.status = REJECTED (link 1) → parent Project.ethics_status =
          REJECTED and Project.registration_status = WITHDRAWN (link 2, caused by
          link 1's plan rejection, not by the HTTP call directly mutating the project).
        test_recipe:
          setup:
            - "Edition REGISTRATION_OPEN; project P (animal subjects) SUBMITTED with ethics_status PENDING; plan RP UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Cascade Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "BME", name: "Biomed", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Proj", email: "mp@x.com" }
              as: FairDirector
              captures: { mp: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor Rev", email: "mr@x.com" }
              as: FairDirector
              captures: { mr: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "Animal Study", team_size: 1, involves_human_subjects: false, involves_animal_subjects: true }
              as: Mentor
              as_user_id: "${mp}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/research-plans"
              payload: { project_id: "${p}", plan_text: "animal plan", risk_level: "HIGH" }
              as: Mentor
              as_user_id: "${mp}"
              captures: { rp: $.data.id }
            - call: "POST /science-fair/research-plans/${rp}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mp}"
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mp}"
            - call: "POST /science-fair/research-plans/${rp}/begin-review"
              payload: {}
              as: EthicsReviewer
          trigger:
            - call: "POST /science-fair/research-plans/${rp}/decisions"
              payload: { reviewer_mentor_id: "${mr}", decision: "REJECT", rationale: "no IACUC approval" }
              as: EthicsReviewer
          assert:
            - "ResearchPlan.${rp}.status == REJECTED"
            - "Project.${p}.ethics_status == REJECTED"
            - "Project.${p}.registration_status == WITHDRAWN (cascaded from plan rejection)"
      - name: failed_inspection_cascades_project_to_editing_gating
        grounds:
          - state_machines.Project
          - state_machines.FairEdition.REGISTRATION_CLOSED_to_JUDGING
        distinguishing_aspect: |
          Depth-3 cascade from the inspection FAIL trigger: inspection-result FAIL →
          Project.inspection_status = FAILED (link 1) → Project.registration_status =
          WITHDRAWN (link 2, caused by link 1) → edition-level begin-judging gate
          re-evaluates because the withdrawn project no longer counts against the
          CONFIRMED-uninspected precondition (link 3, the gate outcome flips).
          Different trigger from the ethics-decision cascade.
        test_recipe:
          setup:
            - "Edition REGISTRATION_CLOSED with two projects: PA (CONFIRMED, booth SCHEDULED) and PB (CONFIRMED, booth SCHEDULED)"
            - "begin-judging is initially allowed only if all CONFIRMED projects are inspected; PB will FAIL inspection"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "Gate Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "CHEM", name: "Chem", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
