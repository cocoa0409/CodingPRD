      - name: platform_form_mismatch_outranks_content_disclosure_not_authorized
        grounds:
          - validations[priority=39]
          - validations[priority=44]
          - errors.ERR_PLATFORM_FORM_MISMATCH
          - errors.ERR_CONTENT_DISCLOSURE_NOT_AUTHORIZED
          - calculations.platform_authority_precedence
        distinguishing_aspect: |
          A CONTENT_ACCESS submission on an estate whose only authority is the statutory default
          (CATALOG_ONLY) violates priority 44, and after the provider changes its form_code it ALSO
          violates priority 39; the SUBMIT must report ERR_PLATFORM_FORM_MISMATCH, and only after the
          form_code is restored does the identical SUBMIT report
          ERR_CONTENT_DISCLOSURE_NOT_AUTHORIZED — so the two errors are distinguished by ordering,
          not by the request body, which never changes.
        test_recipe:
          setup:
