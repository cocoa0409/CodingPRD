            - { call: "POST /service-requests", payload: { customer_id: "${cst}", category_id: "${cat}", zip_code: "94016", description: "d", budget_cents: 15000 }, as: Customer, as_user_id: "${cst}", captures: { sr: "$.data.id", sr_v1: "$.data.version" } }
