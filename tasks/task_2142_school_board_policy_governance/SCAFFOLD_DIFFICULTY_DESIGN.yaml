  - rule_id: non_linear_state_machine
    instances:

      - name: policy_version_failed_second_reading_returns_to_draft
        grounds:
          - state_machines.PolicyVersion.FIRST_READING_PASSED_to_DRAFT
          - state_machines.PolicyVersion.DRAFT_to_FIRST_READING_PASSED
          - entities.PolicyVersion.fields.reading_count
          - entities.PolicyVersion.fields.first_reading_meeting_id
          - calculations.vote_tally_outcome
        distinguishing_aspect: |
          A genuine A->B->A cycle on PolicyVersion: DRAFT -> FIRST_READING_PASSED -> DRAFT. A failed
          second reading is not a terminal rejection; it resets reading_count to 0 and clears
          first_reading_meeting_id so the whole two-meeting cycle must be run again. The cycle lives
          on PolicyVersion, a different entity from the Meeting whose two axes carry the other
          non-linear instance.
        test_recipe:
          setup:
            - "Five SEATED trustees; bm1 holds office PRESIDENT."
            - "Policy BP-4119, REQUIRED_BY_LAW, with one version pv1."
            - "Meeting M1 (REGULAR, 2026-09-10T18:00:00Z) heard the first reading of pv1 and passed it 3 yes / 1 no / 1 abstain, so pv1 is FIRST_READING_PASSED with reading_count 1 and first_reading_meeting_id == M1."
            - "M1 is ADJOURNED with minutes DRAFTED and then APPROVED at meeting M2."
            - "Meeting M2 (REGULAR, 2026-09-24T18:00:00Z) is OPEN and carries the POSTED second-reading item ai2 for pv1."
