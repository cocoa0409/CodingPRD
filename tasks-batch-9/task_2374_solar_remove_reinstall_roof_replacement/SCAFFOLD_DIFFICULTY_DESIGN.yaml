          - state_machines.HardwareUnit.REMOVED_to_STORED
          - state_machines.HardwareUnit.UNINSPECTED_to_SERVICEABLE
          - state_machines.HardwareUnit.SERVICEABLE_to_DAMAGED
          - entities.HardwareUnit.fields.handling_status
          - entities.HardwareUnit.fields.condition_grade
