  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: expo_assignment_half_open_overlap_vs_adjacency
        grounds:
          - validations[priority=52]
          - errors[ERR_EXPO_OVERLAP]
          - state_machines.ExpoAssignment.ASSIGNED_to_ENDED
        distinguishing_aspect: "Expo assignment uses half-open [start_at,end_at) windows on the Animal's schedule: an interior overlap (expo B 07-11..07-13 vs A 07-10..07-12) is rejected with ERR_EXPO_OVERLAP, while an adjacent window (expo C 07-12..07-14 touching A's end) is accepted."
        test_recipe:
          setup:
            - "Animal AVAILABLE; three SCHEDULED expos A[07-10,07-12), B[07-11,07-13), C[07-12,07-14), each venue_capacity 10."
            - "Animal already ASSIGNED to expo A."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Bearded Dragon", scientific_name: "Pogona vitticeps", is_regulated: false, permit_class: "NONE", min_quarantine_days: 0, warranty_days: 14, care_temp_low_c: 24, care_temp_high_c: 40, care_humidity_low_pct: 20, care_humidity_high_pct: 40, feed_interval_days: 1, care_feeder_type: "DUBIA" }
              as: StoreManager
              captures: { sp_id: $.data.id }
