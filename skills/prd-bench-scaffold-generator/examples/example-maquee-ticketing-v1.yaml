# =============================================================================
# Example: maquee-ticketing benchmark seed tables (v1)
# Marquee Ticketing API
# =============================================================================

scenario: |
  Event ticketing platform for organizers who sell tickets through multiple sellers,
  manage ticket transfers, and handle gate scanning. Workspaces contain events with
  inventory pools. Orders go through draft, submit, approval, payment, and remedy
  flows. Admissions are issued on payment and support transfers and gate scans.
  Considerations: workspace posture (OPEN/REVIEW/HALT), pool capacity and
  overallocation, manager approval for premium/high-value/custom-price orders,
  per-actor holdings limits, pool transfer and refund policies, event cancellation
  cascades, idempotency, and optimistic concurrency via If-Match/version.

domain_name: maquee-ticketing
api_prefix: /workspaces

# =============================================================================
# Table 1: Complexity Profile
# =============================================================================
complexity_profile:
  entity_count: 5
  state_machine_count: 4
  calculation_count: 5
  validation_layers: 7
  endpoint_count: 22
  error_code_count: 27
  role_count: 6

# =============================================================================
# Table 2: Entity Relationship Table
# =============================================================================
entities:
  - name: Workspace
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique workspace identifier" }
      - { name: name, type: string, source: input, description: "Workspace name" }
      - { name: settlement_currency, type: string, source: input, description: "Currency code (e.g., USD)" }
      - { name: posture, type: enum, source: computed, description: "OPEN | REVIEW | HALT — derived from system state" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Event
    parent: Workspace
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique event identifier" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: starts_at_local, type: string, source: input, description: "Start time (informational string)" }
      - { name: max_tickets_per_actor, type: integer, source: input, description: "Max valid tickets per actor for this event" }
      - { name: status, type: enum, source: system, description: "DRAFT | ONSALE | PAUSED | CLOSED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Pool
    parent: Event
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique pool identifier" }
      - { name: label, type: string, source: input, description: "Pool label (e.g., GA, VIP)" }
      - { name: kind, type: enum, source: input, description: "STANDARD | PREMIUM | BOX" }
      - { name: price_cents, type: integer, source: input, description: "Ticket price in cents" }
      - { name: currency, type: string, source: input, description: "Must match workspace settlement_currency" }
      - { name: capacity_total, type: integer, source: input, description: "Total pool capacity" }
      - { name: holdback_qty, type: integer, source: input, description: "Inventory held off market" }
      - { name: refund_policy, type: enum, source: input, description: "REFUNDABLE | CREDIT_ONLY | FINAL_SALE" }
      - { name: transfer_policy, type: enum, source: input, description: "OPEN | ONCE | NONE" }
      - { name: pool_holdings_limit, type: integer, source: input, required: false, description: "Optional per-pool cap, still bounded by event cap" }
      - { name: quantity_held, type: integer, source: computed, description: "Tickets on checkout hold" }
      - { name: quantity_sold, type: integer, source: computed, description: "Tickets sold (paid)" }
      - { name: quantity_available, type: integer, source: computed, description: "Remaining tickets available" }
      - { name: is_overallocated, type: boolean, source: computed, description: "True if sold + held > capacity_total - holdback_qty" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Order
    parent: Workspace
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique order identifier" }
      - { name: event_id, type: string, source: input, description: "Associated event" }
      - { name: buyer_actor_id, type: string, source: system, description: "From X-User-ID header" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVAL_REQUIRED | APPROVED | PAID | CANCELLED | REFUNDED | CREDITED | MIXED" }
      - { name: lines, type: array, source: input, description: "Array of {pool_id, quantity, unit_price_cents?}" }
      - { name: currency, type: string, source: computed, description: "From workspace settlement_currency" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of line totals" }
      - { name: admission_ids, type: array, source: system, description: "Issued admission IDs, populated after payment" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Admission
    parent: Workspace
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique admission identifier" }
      - { name: event_id, type: string, source: system, description: "Associated event" }
      - { name: pool_id, type: string, source: system, description: "Associated pool" }
      - { name: order_id, type: string, source: system, description: "Associated order" }
      - { name: holder_actor_id, type: string, source: system, description: "Current ticket holder" }
      - { name: transfer_count, type: integer, source: system, description: "Number of transfers, starts at 0" }
      - { name: state, type: enum, source: system, description: "ACTIVE | SCANNED | VOIDED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

# =============================================================================
# Table 3: State Machine Table
# =============================================================================
state_machines:
  - entity: Workspace
    field: posture
    initial_state: OPEN
    terminal_states: []
    note: "Posture is derived/recalculated, not directly set"
    transitions:
      - from: OPEN
        to: HALT
        trigger: "system (cancelled event has unresolved paid orders)"
        actor: system
        preconditions:
          - "At least one cancelled event with orders still in PAID status"
        side_effects:
          - "New sales and ticket movement blocked"
          - "Cleanup (refunds, cancels, capacity fixes) and gate scanning still allowed"

      - from: OPEN
        to: REVIEW
        trigger: "system (paused event, overallocated pool, or approval-required order exists)"
        actor: system
        preconditions:
          - "Any event is PAUSED, any pool is_overallocated, or any order is APPROVAL_REQUIRED"
        side_effects:
          - "Checkout becomes conservative: orders require manager approval"
          - "Transfers beyond transfer_count=1 are blocked"

      - from: HALT
        to: OPEN
        trigger: "system (last paid order for cancelled events is remedied)"
        actor: system
        preconditions:
          - "No cancelled events with PAID orders remaining"
        side_effects: []

      - from: REVIEW
        to: OPEN
        trigger: "system (all review conditions cleared)"
        actor: system
        preconditions:
          - "No PAUSED events, no overallocated pools, no APPROVAL_REQUIRED orders"
        side_effects: []

  - entity: Event
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ONSALE
        trigger: "POST .../events/{event_id}/on_sale"
        actor: ORGANIZER
        preconditions: []
        side_effects: []

      - from: ONSALE
        to: PAUSED
        trigger: "POST .../events/{event_id}/pause"
        actor: ORGANIZER
        preconditions: []
        side_effects:
          - "Sales paused: orders can be read and cancelled but not submitted or paid"

      - from: PAUSED
        to: ONSALE
        trigger: "POST .../events/{event_id}/on_sale"
        actor: ORGANIZER
        preconditions: []
        side_effects: []

      - from: ONSALE
        to: CLOSED
        trigger: "POST .../events/{event_id}/close"
        actor: ORGANIZER
        preconditions: []
        side_effects:
          - "Sales and transfers stop, scans continue"

      - from: PAUSED
        to: CLOSED
        trigger: "POST .../events/{event_id}/close"
        actor: ORGANIZER
        preconditions: []
        side_effects: []

      - from: [DRAFT, ONSALE, PAUSED, CLOSED]
        to: CANCELLED
        trigger: "POST .../events/{event_id}/cancel"
        actor: ORGANIZER
        preconditions: []
        side_effects:
          - "Non-paid orders for event → CANCELLED automatically"
          - "Paid orders remain PAID until remedied"
          - "Cancelling an already-CANCELLED event is a no-op success"
        note: "Cancelled event with unresolved paid orders → workspace HALT"

  - entity: Order
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED, REFUNDED, CREDITED, MIXED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST .../orders/{order_id}/submit"
        actor: SELLER
        preconditions:
          - "At least one line (ERR_BAD_REQUEST if empty)"
          - "Event is ONSALE"
          - "Workspace not HALT"
          - "No overallocated pools referenced"
        side_effects:
          - "Hold placed on pool inventory (quantity_held increases)"

      - from: DRAFT
        to: APPROVAL_REQUIRED
        trigger: "POST .../orders/{order_id}/submit (approval conditions met)"
        actor: SELLER
        preconditions:
          - "Workspace is REVIEW, or line uses custom price, or line references PREMIUM/BOX pool, or total_cents >= 100000"
        side_effects:
          - "Hold placed on pool inventory"

      - from: APPROVAL_REQUIRED
        to: APPROVED
        trigger: "POST .../orders/{order_id}/approve"
        actor: MANAGER
        preconditions: []
        side_effects: []

      - from: [SUBMITTED, APPROVED]
        to: PAID
        trigger: "POST .../orders/{order_id}/pay"
        actor: SELLER
        preconditions:
          - "Holdings limits not exceeded"
          - "No overallocated pools referenced"
        side_effects:
          - "Pool inventory shifts from held to sold"
          - "Admissions issued"

      - from: [DRAFT, SUBMITTED, APPROVAL_REQUIRED, APPROVED]
        to: CANCELLED
        trigger: "POST .../orders/{order_id}/cancel"
        actor: SELLER
        preconditions:
          - "Order is not PAID"
        side_effects:
          - "Held inventory released"

      - from: PAID
        to: REFUNDED
        trigger: "POST .../orders/{order_id}/refund (all lines refundable)"
        actor: MANAGER
        preconditions:
          - "Scanned tickets cannot be refunded"
        side_effects:
          - "Admissions voided, sold inventory released"

      - from: PAID
        to: CREDITED
        trigger: "POST .../orders/{order_id}/refund (all lines credit-only)"
        actor: MANAGER
        preconditions: []
        side_effects:
          - "Admissions voided, sold inventory released"

      - from: PAID
        to: MIXED
        trigger: "POST .../orders/{order_id}/refund (mix of refund and credit)"
        actor: MANAGER
        preconditions: []
        side_effects:
          - "Admissions voided, sold inventory released"

  - entity: Admission
    field: state
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: SCANNED
        trigger: "POST .../admissions/{admission_id}/scan"
        actor: GATE
        preconditions:
          - "Event is ONSALE, PAUSED, or CLOSED (not DRAFT or CANCELLED)"
          - "Scans work even in HALT posture"
        side_effects:
          - "Records scanned_by_actor_id"

      - from: ACTIVE
        to: VOIDED
        trigger: "system (order refunded/credited/mixed)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 4: Calculation Rules Table
# =============================================================================
calculations:
  - name: quantity_available
    trigger: "order submit, pay, cancel, refund, pool adjust"
    algorithm: aggregation
    formula: |
      quantity_available = capacity_total - holdback_qty - quantity_sold - quantity_held
      If quantity_available < 0, pool is overallocated.

  - name: is_overallocated
    trigger: "any change to sold, held, capacity, or holdback"
    algorithm: threshold
    formula: |
      is_overallocated = (quantity_sold + quantity_held) > (capacity_total - holdback_qty)
    note: "Overallocated pools block checkout (ERR_POOL_OVERALLOCATED) and push workspace to REVIEW"

  - name: total_cents
    trigger: "lines update"
    algorithm: aggregation
    formula: |
      total_cents = sum(line.quantity * line.unit_price_cents for each line)
      If unit_price_cents omitted on a line, pool's current price_cents is used.

  - name: workspace_posture
    trigger: "event lifecycle changes, order moves, capacity changes"
    algorithm: derived
    formula: |
      if any cancelled event has PAID orders: HALT
      else if any event PAUSED, or any pool overallocated, or any order APPROVAL_REQUIRED: REVIEW
      else: OPEN

  - name: holdings_check
    trigger: "order pay, admission transfer"
    algorithm: limit
    formula: |
      Count valid tickets (non-VOIDED admissions) held by the actor for the event.
      Must not exceed event's max_tickets_per_actor.
      Pool-level pool_holdings_limit also applies (still bounded by event cap).
    note: "Checked at payment and transfer-receive time"

# =============================================================================
# Table 5: Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: headers
    check: "X-User-Role and X-User-ID must be present"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: all endpoints

  - priority: 1
    category: headers
    check: "Idempotency-Key required on all POST requests"
    error_id: ERR_MISSING_IDEMPOTENCY_KEY
    http_status: 400
    applies_to: all POST endpoints

  - priority: 1
    category: headers
    check: "If-Match required on any call that changes an existing object"
    error_id: ERR_MISSING_IF_MATCH
    http_status: 400
    applies_to: all mutation endpoints on existing resources

  - priority: 2
    category: existence
    check: "Resource must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3
    category: auth
    check: "Role must be authorized for this operation"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 4
    category: posture
    check: "Workspace posture allows the operation"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 400
    applies_to: "sales and ticket movement (not cleanup or gate scans)"

  - priority: 5
    category: concurrency
    check: "If-Match matches current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: all mutation endpoints on existing resources

  - priority: 6
    category: state
    check: "Resource is in valid state for requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: state transition endpoints

  - priority: 7
    category: business
    check: "Business rules (capacity, budget, limits, brand safety, policies)"
    error_id: varies
    http_status: varies
    applies_to: "submit, pay, adjust, transfer, refund, scan"

response_envelope:
  success: |
    (no standard envelope defined)
  error: |
    (no standard envelope defined)
  pagination_fields: []
  pagination_defaults: {}

# =============================================================================
# Table 6: API Endpoint Table (22 endpoints)
# =============================================================================
endpoints:
  # --- Workspace ---
  - method: POST
    path: "/workspaces"
    description: "Create workspace"
    roles: [ORGANIZER]
    code: 201
    input: [name, settlement_currency]
    output: Workspace
    side_effects: ["posture=OPEN"]

  - method: GET
    path: "/workspaces/{workspace_id}"
    description: "Read workspace (includes posture)"
    roles: [Any]
    code: 200
    input: []
    output: Workspace
    side_effects: []

  # --- Events ---
  - method: POST
    path: "/workspaces/{workspace_id}/events"
    description: "Create event"
    roles: [ORGANIZER]
    code: 201
    input: [title, starts_at_local, max_tickets_per_actor]
    output: Event
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/workspaces/{workspace_id}/events/{event_id}"
    description: "Read event"
    roles: [Any]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: POST
    path: "/workspaces/{workspace_id}/events/{event_id}/on_sale"
    description: "Put event on sale (or resume from paused)"
    roles: [ORGANIZER]
    code: 200
    input: []
    output: Event
    side_effects: ["status → ONSALE"]

  - method: POST
    path: "/workspaces/{workspace_id}/events/{event_id}/pause"
    description: "Pause event sales"
    roles: [ORGANIZER]
    code: 200
    input: []
    output: Event
    side_effects: ["status → PAUSED"]

  - method: POST
    path: "/workspaces/{workspace_id}/events/{event_id}/close"
    description: "Close event"
    roles: [ORGANIZER]
    code: 200
    input: []
    output: Event
    side_effects: ["status → CLOSED"]

  - method: POST
    path: "/workspaces/{workspace_id}/events/{event_id}/cancel"
    description: "Cancel event"
    roles: [ORGANIZER]
    code: 200
    input: []
    output: Event
    side_effects: ["status → CANCELLED, non-paid orders cancelled, HALT if paid orders unresolved"]

  # --- Pools ---
  - method: POST
    path: "/workspaces/{workspace_id}/events/{event_id}/pools"
    description: "Create pool"
    roles: [ORGANIZER]
    code: 201
    input: [label, kind, price_cents, currency, capacity_total, holdback_qty, refund_policy, transfer_policy, "pool_holdings_limit?"]
    output: Pool
    side_effects: []

  - method: GET
    path: "/workspaces/{workspace_id}/events/{event_id}/pools/{pool_id}"
    description: "Read pool (includes quantity_*)"
    roles: [Any]
    code: 200
    input: []
    output: Pool
    side_effects: []

  - method: POST
    path: "/workspaces/{workspace_id}/events/{event_id}/pools/{pool_id}/adjust"
    description: "Adjust pool capacity/holdback/price"
    roles: [ORGANIZER]
    code: 200
    input: [capacity_delta, holdback_delta, "new_price_cents?", note]
    output: Pool
    side_effects:
      - "Capacity and holdback adjusted"
      - "Price change only allowed in DRAFT or PAUSED event (ERR_POOL_PRICE_CHANGE_BLOCKED if ONSALE)"
      - "Capacity cannot drop below sold count (ERR_CAPACITY_FLOOR)"

  # --- Orders ---
  - method: POST
    path: "/workspaces/{workspace_id}/orders"
    description: "Create order (single event)"
    roles: [SELLER]
    code: 201
    input: [event_id]
    output: Order
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/workspaces/{workspace_id}/orders/{order_id}"
    description: "Read order"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: PUT
    path: "/workspaces/{workspace_id}/orders/{order_id}/lines"
    description: "Replace draft order lines"
    roles: [SELLER]
    code: 200
    input: [lines]
    output: Order
    side_effects: ["Lines replaced atomically, total_cents recalculated"]

  - method: POST
    path: "/workspaces/{workspace_id}/orders/{order_id}/submit"
    description: "Submit order (place inventory hold)"
    roles: [SELLER]
    code: 200
    input: []
    output: Order
    side_effects: ["status → SUBMITTED or APPROVAL_REQUIRED, pool holds placed"]

  - method: POST
    path: "/workspaces/{workspace_id}/orders/{order_id}/approve"
    description: "Approve order requiring approval"
    roles: [MANAGER]
    code: 200
    input: []
    output: Order
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/workspaces/{workspace_id}/orders/{order_id}/pay"
    description: "Pay order (issue admissions)"
    roles: [SELLER]
    code: 200
    input: []
    output: Order
    side_effects: ["status → PAID, pool held → sold, admissions issued"]

  - method: POST
    path: "/workspaces/{workspace_id}/orders/{order_id}/cancel"
    description: "Cancel unpaid order"
    roles: [SELLER]
    code: 200
    input: []
    output: Order
    side_effects: ["status → CANCELLED, held inventory released"]

  - method: POST
    path: "/workspaces/{workspace_id}/orders/{order_id}/refund"
    description: "Refund/credit paid order"
    roles: [MANAGER]
    code: 200
    input: [reason]
    output: Order
    side_effects:
      - "status → REFUNDED, CREDITED, or MIXED based on pool refund_policy"
      - "Admissions voided, sold inventory released"
      - "After event CLOSED: only reason=FRAUD or EVENT_CANCELLED allowed"
      - "Scanned tickets cannot be refunded"

  # --- Admissions ---
  - method: GET
    path: "/workspaces/{workspace_id}/admissions/{admission_id}"
    description: "Read admission"
    roles: [Any]
    code: 200
    input: []
    output: Admission
    side_effects: []

  - method: POST
    path: "/workspaces/{workspace_id}/admissions/{admission_id}/transfer"
    description: "Transfer admission to new holder"
    roles: [SELLER, MANAGER]
    code: 200
    input: [new_holder_actor_id]
    output: Admission
    side_effects:
      - "holder_actor_id updated, transfer_count incremented"
      - "Blocked by pool transfer_policy (NONE blocks, ONCE allows one transfer)"
      - "Event must be ONSALE or PAUSED (CLOSED/CANCELLED block transfers)"
      - "In REVIEW: transfers beyond transfer_count=1 blocked"
      - "In HALT: all transfers blocked"
      - "Holdings limit checked for receiver"

  - method: POST
    path: "/workspaces/{workspace_id}/admissions/{admission_id}/scan"
    description: "Scan admission at gate"
    roles: [GATE]
    code: 200
    input: []
    output: Admission
    side_effects:
      - "state → SCANNED, scanned_by_actor_id recorded"
      - "Allowed for ONSALE, PAUSED, CLOSED events (not DRAFT or CANCELLED)"
      - "Works in HALT posture"

# =============================================================================
# Table 7: Error Code Catalogue (26 error codes)
# =============================================================================
errors:
  # --- Request Validation ---
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed request, missing required fields, empty lines on submit"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource does not exist"

  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "Role not authorized for this operation"

  # --- Idempotency & Concurrency ---
  - id: ERR_MISSING_IDEMPOTENCY_KEY
    http: 400
    condition: "POST request missing Idempotency-Key header"

  - id: ERR_IDEMPOTENCY_REPLAY_MISMATCH
    http: 409
    condition: "Idempotency key reused with different payload"

  - id: ERR_MISSING_IF_MATCH
    http: 400
    condition: "Mutation on existing object missing If-Match header"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match does not match resource's current version"

  # --- Posture ---
  - id: ERR_POSTURE_BLOCKED
    http: 400
    condition: "Workspace posture blocks this operation (HALT or REVIEW restriction)"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in valid state for requested transition"

  # --- Event ---
  - id: ERR_EVENT_NOT_SELLING
    http: 409
    condition: "Event is not ONSALE; checkout-related operations blocked"

  # --- Pool ---
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Insufficient pool capacity for the order"

  - id: ERR_CAPACITY_FLOOR
    http: 409
    condition: "Cannot reduce capacity below already-sold tickets"

  - id: ERR_CURRENCY_MISMATCH
    http: 400
    condition: "Pool currency does not match workspace settlement_currency"

  - id: ERR_POOL_PRICE_CHANGE_BLOCKED
    http: 409
    condition: "Price changes blocked while event is ONSALE"

  - id: ERR_POOL_OVERALLOCATED
    http: 409
    condition: "Pool is overallocated; checkout blocked on this pool"

  # --- Order ---
  - id: ERR_APPROVAL_REQUIRED
    http: 409
    condition: "Order requires manager approval before payment"

  - id: ERR_ORDER_NOT_READY
    http: 409
    condition: "Order not in a payable state (not SUBMITTED or APPROVED)"

  - id: ERR_LINE_EVENT_MISMATCH
    http: 400
    condition: "Line references a pool not belonging to the order's event"

  - id: ERR_LINE_DUPLICATE
    http: 400
    condition: "Same pool_id appears twice in one order's lines"

  # --- Refund ---
  - id: ERR_REFUND_NOT_ALLOWED
    http: 409
    condition: "Refund not allowed (scanned ticket, or post-close non-fraud/non-cancellation reason)"

  - id: ERR_REMEDY_REASON_REQUIRED
    http: 400
    condition: "Remedy reason required for refunds after event closed or cancelled"

  # --- Transfer ---
  - id: ERR_POOL_TRANSFER_BLOCKED
    http: 409
    condition: "Pool transfer_policy blocks this transfer (NONE, or ONCE exceeded)"

  - id: ERR_NOT_HOLDER
    http: 403
    condition: "Actor is not the current holder of the admission"

  - id: ERR_HOLDINGS_LIMIT_EXCEEDED
    http: 409
    condition: "Transfer or payment would exceed actor's holdings limit for the event"

  # --- Admission ---
  - id: ERR_ADMISSION_ALREADY_SCANNED
    http: 409
    condition: "Admission has already been scanned"

  - id: ERR_ADMISSION_VOIDED
    http: 409
    condition: "Admission is voided; cannot scan or transfer"

  - id: ERR_SCAN_NOT_ALLOWED
    http: 409
    condition: "Scan not allowed for this event status (DRAFT or CANCELLED)"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: ORGANIZER
    description: "Event organizer; manages workspaces, events, pools"
    exclusive_operations:
      - "POST /workspaces — Create workspace"
      - "POST .../events — Create event"
      - "POST .../events/{id}/on_sale — Put event on sale"
      - "POST .../events/{id}/pause — Pause event"
      - "POST .../events/{id}/close — Close event"
      - "POST .../events/{id}/cancel — Cancel event"
      - "POST .../pools — Create pool"
      - "POST .../pools/{id}/adjust — Adjust pool"

  - name: SELLER
    description: "Ticket seller; manages orders and can transfer admissions"
    exclusive_operations:
      - "POST .../orders — Create order"
      - "PUT .../orders/{id}/lines — Replace draft lines"
      - "POST .../orders/{id}/submit — Submit order"
      - "POST .../orders/{id}/pay — Pay order"
      - "POST .../orders/{id}/cancel — Cancel order"

  - name: MANAGER
    description: "Manager; approves orders and handles refunds, can transfer"
    exclusive_operations:
      - "POST .../orders/{id}/approve — Approve order"
      - "POST .../orders/{id}/refund — Refund/credit order"

  - name: GATE
    description: "Gate device; scans admissions"
    exclusive_operations:
      - "POST .../admissions/{id}/scan — Scan admission"

  - name: AUDITOR
    description: "Read-only access for audit purposes"
    exclusive_operations: []

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /workspaces/{id} — Read workspace"
      - "GET .../events/{id} — Read event"
      - "GET .../pools/{id} — Read pool"
      - "GET .../orders/{id} — Read order"
      - "GET .../admissions/{id} — Read admission"
