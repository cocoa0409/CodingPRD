            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh2: $.data.id, hh2_v: $.data.version } }
            - { call: "POST /households", payload: { address_line: "3 Pine St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh3: $.data.id, hh3_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh1}", season_year: 2026, expected_household_version: "${hh1_v}" }, as: Resident, as_user_id: "${hh1}", captures: { sub1: $.data.id } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh2}", season_year: 2026, expected_household_version: "${hh2_v}" }, as: Resident, as_user_id: "${hh2}", captures: { sub2: $.data.id } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh3}", season_year: 2026, expected_household_version: "${hh3_v}" }, as: Resident, as_user_id: "${hh3}", captures: { sub3: $.data.id } }
            - { call: "POST /subscriptions/${sub1}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh1}" }
            - { call: "POST /subscriptions/${sub2}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh2}" }
            - { call: "POST /subscriptions/${sub3}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh3}" }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 2, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub1}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub1}", route_id: "${route_a}", service_date: "2026-05-11" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t2: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub1}", route_id: "${route_a}", service_date: "2026-05-18" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t3: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub1}", route_id: "${route_a}", service_date: "2026-05-25" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t4: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub2}", route_id: "${route_a}", service_date: "2026-05-25" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { u1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-18T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t1}", result: "TAGGED_REJECTED", violation_codes: ["PLASTIC_BAG"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t2}", result: "TAGGED_REJECTED", violation_codes: ["FOOD_WASTE"] }, as: FieldInspector, as_user_id: "insp_1" }
