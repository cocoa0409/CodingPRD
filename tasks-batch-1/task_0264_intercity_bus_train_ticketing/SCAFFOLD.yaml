# =============================================================================
# Intercity Bus & Train Ticketing — seed tables (SCAFFOLD.yaml)
# Amtrak/Greyhound-style: route/schedule & seat inventory, fare class & dynamic
# pricing, reserved vs open seating, transfer/connection, refund/exchange &
# credit, pass/multi-ride, baggage, accessibility seating.
# Difficulty: Expert
# =============================================================================

scenario: |
  Intercity Bus & Train Ticketing (Amtrak/Greyhound style): route/schedule & seat
  inventory, fare class & dynamic pricing, reserved vs open seating,
  transfer/connection, refund/exchange & credit, pass/multi-ride, baggage,
  accessibility seating.

domain_name: intercity-ticketing
api_prefix: /v1

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation        # refund-cash vs travel-credit on a Booking
    - rate_threshold_triggers         # load-factor + advance-window pricing tiers
    - cascading_side_effects          # ServiceDate cancellation -> Booking -> Ticket -> Pass restore
    - optimistic_concurrency          # OCC on ServiceDate.version for seat-claim races
    - derived_field_reconciliation    # seat-inventory counters reconciled on every hold/sale/release

  entity_topology: hybrid
  # Operator -> Route -> ServiceDate is a hierarchy; Booking/BookingLeg/Ticket/
  # RefundCreditNote/BaggageItem/AccessibilityRequest are flat peers carrying FKs
  # across the hierarchy (Booking references ServiceDate via its legs; a TravelPass
  # is a Passenger-scoped peer redeemed across many ServiceDates).

  state_machine_shape: parallel
  # Booking carries TWO independent state axes (booking_status x payment_status);
  # ServiceDate has a cyclic lifecycle (SCHEDULED<->DELAYED, OPEN<->SUSPENDED);
  # plus linear-with-revert machines on Ticket, RefundCreditNote, TravelPass.

  relationship_patterns:
    - one_to_many        # Operator->Route->ServiceDate; Booking->BookingLeg
    - cross_aggregate    # BookingLeg references ServiceDate + FareClass across aggregates
    - polymorphic        # RefundCreditNote.origin_kind references Booking or BookingLeg

  role_model: peer_roles
  # Passenger owns own Bookings/Passes; ScheduleManager owns Routes/ServiceDates;
  # FareAnalyst owns FareClasses/pricing config; GateAgent scans Tickets;
  # SupportAgent (opaque) handles refunds/exchanges/overrides.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Carrier name (e.g., 'Coastliner Rail')" }
      - { name: mode, type: enum, source: input, description: "RAIL | BUS — transport mode for all routes under this operator", constraints: "one of {RAIL, BUS}" }
      - { name: default_connection_buffer_min, type: integer, source: input, default: 30, description: "Minimum minutes required between an inbound leg arrival and the next leg departure on a multi-leg booking", constraints: ">= 0" }
      - { name: exchange_fee_cents, type: integer, source: input, default: 1000, description: "Flat fee charged on a same-booking leg exchange", constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: FareClass
    parent: Operator
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; owning operator" }
      - { name: code, type: enum, source: input, description: "ECONOMY | BUSINESS — fare tier", constraints: "one of {ECONOMY, BUSINESS}" }
      - { name: seating_mode, type: enum, source: input, description: "RESERVED | OPEN — RESERVED requires a specific seat_number per leg; OPEN counts capacity only", constraints: "one of {RESERVED, OPEN}" }
      - { name: surcharge_cents, type: integer, source: input, default: 0, description: "Flat surcharge added AFTER demand+advance multipliers (BUSINESS typically > 0)", constraints: ">= 0" }
      - { name: refundable, type: boolean, source: input, default: true, description: "If false, only TRAVEL_CREDIT (never CASH) refunds are permitted on legs of this class" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED — RETIRED classes cannot be referenced by new legs", default: ACTIVE, constraints: "one of {ACTIVE, RETIRED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: Route
    parent: Operator
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; owning operator" }
      - { name: origin_code, type: string, source: input, description: "3-letter station/terminal code of origin (e.g., 'NYP')" }
      - { name: destination_code, type: string, source: input, description: "3-letter station/terminal code of destination (e.g., 'BOS')" }
      - { name: depart_minute_of_day, type: integer, source: input, description: "Scheduled departure as minutes-from-midnight (informational, drives connection-buffer math)", constraints: "0..1439" }
      - { name: arrive_minute_of_day, type: integer, source: input, description: "Scheduled arrival as minutes-from-midnight; if < depart it indicates next-day arrival", constraints: "0..1439" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED — service dates can be created only on PUBLISHED routes", default: DRAFT, constraints: "one of {DRAFT, PUBLISHED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: ServiceDate
    parent: Route
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; the scheduled route this trip instance realizes" }
      - { name: departure_date, type: string, source: input, description: "Calendar date of departure, 'YYYY-MM-DD'; combined with route depart_minute drives advance-window pricing" }
      - { name: seats_total, type: integer, source: input, description: "Physical seat capacity for this trip instance", constraints: ">= 1" }
      - { name: base_fare_cents, type: integer, source: input, description: "Pre-multiplier base fare in cents for this trip instance", constraints: ">= 0" }
      - { name: seats_held, type: integer, source: computed, description: "Seats currently on unconfirmed hold (booking_status=HELD legs)", default: 0 }
      - { name: seats_sold, type: integer, source: computed, description: "Seats on confirmed/paid bookings (booking_status=CONFIRMED legs)", default: 0 }
      - { name: seats_available, type: integer, source: computed, description: "seats_total - seats_held - seats_sold; never negative" }
      - { name: load_factor, type: number, source: computed, description: "seats_sold / seats_total, computed from CONFIRMED legs only, used for demand pricing tier" }
      - { name: lifecycle, type: enum, source: system, description: "SCHEDULED | DELAYED | DEPARTED | CANCELLED — operational lifecycle", default: SCHEDULED, constraints: "one of {SCHEDULED, DELAYED, DEPARTED, CANCELLED}" }
      - { name: sales, type: enum, source: system, description: "OPEN | SUSPENDED — independent sales gate; new holds require OPEN", default: OPEN, constraints: "one of {OPEN, SUSPENDED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. seat-counter recompute" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1; bumps on every hold/sale/release/lifecycle change" }

  - name: Passenger
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Passenger legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique among Passengers" }
      - { name: needs_accessibility, type: boolean, source: input, default: false, description: "Self-declared flag; informational, does not itself reserve accessible seating" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: TravelPass
    parent: Passenger
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: passenger_id, type: string, source: system, description: "FK -> Passenger.id; the pass holder" }
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; pass is redeemable only on this operator's service dates" }
      - { name: rides_total, type: integer, source: input, description: "Total rides bundled in this multi-ride pass", constraints: ">= 1" }
      - { name: rides_consumed, type: integer, source: computed, description: "Rides redeemed by pass-funded booking legs; restored on refund", default: 0 }
      - { name: rides_remaining, type: integer, source: computed, description: "rides_total - rides_consumed; never negative" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED — EXHAUSTED when rides_remaining hits 0", default: ACTIVE, constraints: "one of {ACTIVE, EXHAUSTED, EXPIRED}" }
      - { name: expires_on, type: string, source: input, description: "Calendar date 'YYYY-MM-DD' after which the pass is EXPIRED and cannot fund new legs" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. ride restore" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1; bumps on redeem/restore" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: passenger_id, type: string, source: system, description: "FK -> Passenger.id; the booking owner" }
      - { name: booking_status, type: enum, source: system, description: "HELD | CONFIRMED | CANCELLED | EXCHANGED — fulfillment axis (parallel to payment_status)", default: HELD, constraints: "one of {HELD, CONFIRMED, CANCELLED, EXCHANGED}" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED | CREDITED — settlement axis (parallel to booking_status)", default: UNPAID, constraints: "one of {UNPAID, PAID, REFUNDED, CREDITED}" }
      - { name: funding_kind, type: enum, source: input, description: "CASH | PASS — CASH bookings are priced & paid in cents; PASS bookings redeem TravelPass rides", default: CASH, constraints: "one of {CASH, PASS}" }
      - { name: pass_id, type: string, source: input, required: false, description: "FK -> TravelPass.id; required when funding_kind=PASS, forbidden otherwise" }
      - { name: total_fare_cents, type: integer, source: computed, description: "Sum of leg fare_cents at confirm time for CASH bookings; 0 for PASS bookings" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Amount actually captured at PAID; basis for refund/credit math", default: 0 }
      - { name: hold_expires_at, type: datetime, source: system, description: "UTC instant the HELD booking auto-expires if not confirmed (set on create from clock + HOLD_TTL_MIN)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascaded state changes" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: BookingLeg
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; owning booking" }
      - { name: service_date_id, type: string, source: input, description: "FK -> ServiceDate.id; the trip instance this leg occupies" }
      - { name: fare_class_id, type: string, source: input, description: "FK -> FareClass.id; fare tier & seating mode for this leg" }
      - { name: leg_order, type: integer, source: input, description: "1-based position of this leg within the booking's journey (used for connection-buffer ordering)", constraints: ">= 1" }
      - { name: seat_number, type: string, source: input, required: false, description: "Assigned seat label (e.g., '12A'); required when fare class seating_mode=RESERVED, forbidden when OPEN" }
      - { name: fare_cents, type: integer, source: computed, description: "Per-leg dynamic price = round_half_up(base_fare_cents * demand_multiplier * advance_factor) + surcharge_cents; 0 for PASS bookings" }
      - { name: leg_state, type: enum, source: system, description: "ACTIVE | RELEASED — RELEASED when its booking is CANCELLED/EXCHANGED, freeing inventory", default: ACTIVE, constraints: "one of {ACTIVE, RELEASED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: Ticket
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; owning booking" }
      - { name: booking_leg_id, type: string, source: system, description: "FK -> BookingLeg.id; the leg this ticket admits travel on" }
      - { name: barcode, type: string, source: system, description: "Server-issued scan token, unique per ticket" }
      - { name: state, type: enum, source: system, description: "ISSUED | SCANNED | VOID — issued at confirm, scanned at gate, voided on refund/cancel", default: ISSUED, constraints: "one of {ISSUED, SCANNED, VOID}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: BaggageItem
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; owning booking" }
      - { name: weight_kg, type: number, source: input, description: "Checked-bag weight in kilograms", constraints: "> 0" }
      - { name: fee_cents, type: integer, source: computed, description: "Overweight fee: 0 if weight_kg <= FREE_BAG_KG, else round_half_up((weight_kg - FREE_BAG_KG) * OVERWEIGHT_RATE_CENTS_PER_KG)" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: AccessibilityRequest
    parent: BookingLeg
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: booking_leg_id, type: string, source: system, description: "FK -> BookingLeg.id; the leg the accommodation applies to" }
      - { name: accommodation, type: enum, source: input, description: "WHEELCHAIR_SPACE | COMPANION_SEAT | SERVICE_ANIMAL — kind of accessible accommodation", constraints: "one of {WHEELCHAIR_SPACE, COMPANION_SEAT, SERVICE_ANIMAL}" }
      - { name: status, type: enum, source: system, description: "REQUESTED | GRANTED | DENIED — GRANTED reserves one accessible slot on the leg's service date", default: REQUESTED, constraints: "one of {REQUESTED, GRANTED, DENIED}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1" }

  - name: RefundCreditNote
    parent: Booking
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; the booking this settlement document records" }
      - { name: settlement_kind, type: enum, source: system, description: "CASH | TRAVEL_CREDIT — which refund variant produced this note", constraints: "one of {CASH, TRAVEL_CREDIT}" }
      - { name: gross_cents, type: integer, source: system, description: "total_paid_cents of the booking at settlement time" }
      - { name: penalty_cents, type: integer, source: system, description: "Withheld penalty: round_half_up(gross_cents * penalty_pct) per the chosen variant" }
      - { name: net_cents, type: integer, source: system, description: "gross_cents - penalty_cents; the cash refunded or credit issued" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; settlement instant (append-only, immutable)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # --------- ServiceDate: cyclic operational lifecycle + parallel sales gate ---------
  - entity: ServiceDate
    field: lifecycle
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELAYED
        trigger: "POST /v1/service-dates/{id}/delay"
        actor: ScheduleManager
        preconditions: ["lifecycle == SCHEDULED"]
        side_effects: ["increments ServiceDate.version by 1"]
        note: "Delay is reversible (cyclic)."
      - from: DELAYED
        to: SCHEDULED
        trigger: "POST /v1/service-dates/{id}/restore"
        actor: ScheduleManager
        preconditions: ["lifecycle == DELAYED"]
        side_effects: ["increments ServiceDate.version by 1"]
      - from: [SCHEDULED, DELAYED]
        to: DEPARTED
        trigger: "POST /v1/service-dates/{id}/depart"
        actor: ScheduleManager
        preconditions: ["lifecycle IN {SCHEDULED, DELAYED}"]
        side_effects:
          - "sales := SUSPENDED"
          - "increments ServiceDate.version by 1"
        note: "Departure freezes the trip; new holds impossible thereafter."
      - from: [SCHEDULED, DELAYED]
        to: CANCELLED
        trigger: "POST /v1/service-dates/{id}/cancel"
        actor: ScheduleManager
        preconditions: ["lifecycle IN {SCHEDULED, DELAYED}"]
        side_effects:
          - "sales := SUSPENDED"
          - "For every ACTIVE BookingLeg whose service_date_id == this id, the leg's Booking is force-cancelled: Booking.booking_status := CANCELLED (cascade hop 1)"
          - "Each force-cancelled Booking releases ALL its legs: BookingLeg.leg_state := RELEASED (cascade hop 2)"
          - "Each released leg's Ticket (if state==ISSUED) -> VOID and seat counters recomputed (cascade hop 3)"
          - "If the force-cancelled Booking was PAID-CASH, a CASH RefundCreditNote is created with penalty_pct=0 (full refund) and Booking.payment_status := REFUNDED (cascade hop 3, fiscal)"
          - "If the force-cancelled Booking was PASS-funded, the TravelPass.rides_consumed is decremented by the booking's redeemed leg count and rides_remaining recomputed (cascade hop 3, conserved-quantity restore)"
          - "increments ServiceDate.version by 1"
        note: "Depth-3 cascade: cancel ServiceDate -> cancel Bookings -> release legs/void tickets/restore pass rides."

  - entity: ServiceDate
    field: sales
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /v1/service-dates/{id}/suspend-sales"
        actor: ScheduleManager
        preconditions: ["sales == OPEN", "lifecycle NOT IN {DEPARTED, CANCELLED}"]
        side_effects: ["increments ServiceDate.version by 1"]
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /v1/service-dates/{id}/resume-sales"
        actor: ScheduleManager
        preconditions: ["sales == SUSPENDED", "lifecycle NOT IN {DEPARTED, CANCELLED}"]
        side_effects: ["increments ServiceDate.version by 1"]
        note: "Sales gate is cyclic and independent of lifecycle (parallel dimension)."

  # --------- Booking: parallel dimensions booking_status x payment_status ---------
  - entity: Booking
    field: booking_status
    initial_state: HELD
    terminal_states: [CANCELLED, EXCHANGED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /v1/bookings/{id}/confirm"
        actor: Passenger
        preconditions:
          - "booking_status == HELD"
          - "hold not expired: clock_now < hold_expires_at"
          - "every leg's ServiceDate.sales == OPEN AND lifecycle IN {SCHEDULED, DELAYED}"
          - "for each leg, that ServiceDate.seats_available >= 1 at confirm time (re-checked; cross-entity dependency)"
          - "multi-leg connection buffer satisfied for adjacent legs (see calc connection_buffer_ok)"
          - "expected_service_date_version matches each referenced ServiceDate.version (OCC)"
        side_effects:
          - "Each leg's ServiceDate moves one seat from held to sold: seats_held -=1, seats_sold +=1, counters & load_factor recomputed (cross-entity ledger sync)"
          - "Booking.total_fare_cents finalized = sum of leg fare_cents (CASH) or 0 (PASS)"
          - "One Ticket per leg issued in state ISSUED with a fresh barcode"
          - "increments Booking.version by 1; increments each referenced ServiceDate.version by 1"
        note: "Confirm consumes the held seats; payment_status axis advances separately via /pay."
      - from: HELD
        to: CANCELLED
        trigger: "POST /v1/bookings/{id}/cancel"
        actor: Passenger
        preconditions: ["booking_status == HELD"]
        side_effects:
          - "Every ACTIVE leg -> RELEASED; each leg's ServiceDate.seats_held -=1, counters recomputed"
          - "If PASS-funded: TravelPass.rides_consumed -= redeemed leg count, rides_remaining recomputed, status re-derived (conserved-quantity restore)"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/bookings/{id}/cancel"
        actor: Passenger
        preconditions:
          - "booking_status == CONFIRMED"
          - "no Ticket on this booking is in state SCANNED (cross-entity dependency: Booking->Ticket)"
        side_effects:
          - "Every ACTIVE leg -> RELEASED; each ServiceDate.seats_sold -=1, counters & load_factor recomputed (ledger sync)"
          - "Every ISSUED Ticket -> VOID"
          - "If payment_status==PAID and funding_kind==CASH: produce refund/credit per /cancel refund_destination (see payment_status machine)"
          - "If PASS-funded: TravelPass rides restored (rides_consumed -= leg count) — conserved quantity"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: EXCHANGED
        trigger: "POST /v1/bookings/{id}/exchange"
        actor: Passenger
        preconditions:
          - "booking_status == CONFIRMED"
          - "funding_kind == CASH"
          - "no Ticket is SCANNED"
          - "the target ServiceDate.sales == OPEN AND lifecycle IN {SCHEDULED, DELAYED} AND seats_available >= 1 (cross-entity dependency)"
          - "expected_booking_version matches Booking.version (OCC on Booking)"
        side_effects:
          - "Old leg -> RELEASED; old ServiceDate.seats_sold -=1, counters recomputed"
          - "A NEW Booking is created (CONFIRMED, PAID) holding the replacement leg on the target ServiceDate; new ServiceDate.seats_sold +=1"
          - "amount settled = new_leg_fare - old_total_paid + Operator.exchange_fee_cents (see calc exchange_amount)"
          - "Old Booking.booking_status := EXCHANGED (terminal); old Tickets -> VOID"
          - "increments old Booking.version by 1; increments both ServiceDate versions by 1"

  - entity: Booking
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /v1/bookings/{id}/pay"
        actor: Passenger
        preconditions:
          - "booking_status == CONFIRMED"
          - "funding_kind == CASH"
          - "payment_status == UNPAID"
        side_effects:
          - "Booking.total_paid_cents := Booking.total_fare_cents"
          - "increments Booking.version by 1"
        note: "PASS bookings skip /pay; confirm sets payment_status directly (see note below)."
      - from: UNPAID
        to: CREDITED
        trigger: "system (PASS booking confirmed) or POST /v1/bookings/{id}/cancel with refund_destination=TRAVEL_CREDIT on a still-UNPAID CASH booking is rejected"
        actor: system
        preconditions: ["funding_kind == PASS", "booking_status transitions HELD->CONFIRMED"]
        side_effects: ["payment_status := CREDITED is NOT used for PASS; PASS confirmed bookings stay payment_status=UNPAID with total_paid_cents=0"]
        note: "Documentation guard only — PASS bookings remain UNPAID; this row exists to pin that CREDITED is reachable solely via the PAID->CREDITED refund path below, not via PASS confirm."
      - from: PAID
        to: REFUNDED
        trigger: "POST /v1/bookings/{id}/cancel (refund_destination=CASH) or system (ServiceDate cancellation cascade)"
        actor: Passenger | system
        preconditions:
          - "payment_status == PAID"
          - "the booking's fare classes are all refundable==true for a passenger-initiated CASH refund (cross-entity dependency: Booking->FareClass); system cascade refund bypasses this and always issues CASH at penalty_pct=0"
        side_effects:
          - "Create CASH RefundCreditNote with gross=total_paid_cents, penalty=round_half_up(gross*cancel_penalty_pct), net=gross-penalty (compensating action for /pay)"
          - "payment_status := REFUNDED"
          - "increments Booking.version by 1"
      - from: PAID
        to: CREDITED
        trigger: "POST /v1/bookings/{id}/cancel (refund_destination=TRAVEL_CREDIT)"
        actor: Passenger
        preconditions: ["payment_status == PAID"]
        side_effects:
          - "Create TRAVEL_CREDIT RefundCreditNote with gross=total_paid_cents, penalty=round_half_up(gross*credit_penalty_pct), net=gross-penalty (more lenient variant)"
          - "payment_status := CREDITED"
          - "increments Booking.version by 1"
        note: "CREDITED chosen when refund_destination=TRAVEL_CREDIT; CASH refunds blocked when any leg's FareClass.refundable==false (then only TRAVEL_CREDIT allowed)."

  # --------- Ticket: linear-with-revert ---------
  - entity: Ticket
    field: state
    initial_state: ISSUED
    terminal_states: [VOID]
    transitions:
      - from: ISSUED
        to: SCANNED
        trigger: "POST /v1/tickets/{id}/scan"
        actor: GateAgent
        preconditions:
          - "state == ISSUED"
          - "the Ticket's BookingLeg.service_date_id ServiceDate.lifecycle IN {SCHEDULED, DELAYED, DEPARTED} (cross-entity dependency: Ticket->ServiceDate)"
        side_effects: ["increments Ticket.version by 1"]
      - from: ISSUED
        to: VOID
        trigger: "system (booking cancelled/exchanged or service date cancelled)"
        actor: system
        preconditions: ["state == ISSUED"]
        side_effects: ["increments Ticket.version by 1"]

  # --------- TravelPass: ride-pool with restore + auto-exhaust ---------
  - entity: TravelPass
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (pass-funded booking confirm consumes the last remaining ride)"
        actor: system
        preconditions: ["status == ACTIVE", "rides_remaining becomes 0 after this redemption"]
        side_effects: ["increments TravelPass.version by 1"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (a pass-funded booking is cancelled, restoring rides)"
        actor: system
        preconditions: ["status == EXHAUSTED", "rides_remaining becomes > 0 after restore"]
        side_effects: ["increments TravelPass.version by 1"]
        note: "Restore can reactivate an EXHAUSTED pass (revert)."
      - from: [ACTIVE, EXHAUSTED]
        to: EXPIRED
        trigger: "POST /v1/_clock/set_current_utc advancing the clock past expires_on, observed on next redemption attempt"
        actor: system
        preconditions: ["clock date > expires_on"]
        side_effects: ["increments TravelPass.version by 1"]
        note: "EXPIRED is terminal; expired passes cannot fund new legs."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: confirm-stale-service-date
    parent_entity: ServiceDate
    write_endpoint: "POST /v1/bookings/{id}/confirm"
    occ_field: "expected_service_date_version"
    description: |
      Confirming a Booking against a ServiceDate whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has already confirmed a booking that consumed the last available seat
      (legitimately advancing the ServiceDate) and the current writer's view of the
      service date — and therefore of seats_available — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: exchange-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /v1/bookings/{id}/exchange"
    occ_field: "expected_booking_version"
    description: |
      Exchanging a leg on a Booking whose version has advanced since the client last
      observed it is rejected. This captures the case where another operation already
      mutated the booking (e.g., a prior exchange or a partial settlement legitimately
      bumped Booking.version) and the current exchange request carries a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: leg_fare_cents
    trigger: "Booking confirm (HELD->CONFIRMED); fare locked at confirm time per leg"
    algorithm: tiered_pricing
    formula: |
      # demand_multiplier from the leg's ServiceDate load_factor (CONFIRMED legs only),
      # measured BEFORE this booking's seats are moved to sold:
      lf = service_date.seats_sold / service_date.seats_total
      if   lf <  0.5: demand_multiplier = 1.00
      elif lf <  0.8: demand_multiplier = 1.25     # tier is lower-inclusive: lf>=0.5 enters here
      else:           demand_multiplier = 1.60     # lf>=0.8
      # advance_factor from whole days between clock date and (departure_date):
      d = floor_days(departure_date - clock_now_date)   # calendar-day difference, >= 0
      if   d >= 14: advance_factor = 0.90
      elif d >=  7: advance_factor = 1.00
      elif d >=  3: advance_factor = 1.15
      else:         advance_factor = 1.40              # 0 <= d < 3
      raw = service_date.base_fare_cents * demand_multiplier * advance_factor
      leg_fare_cents = round_half_up(raw) + fare_class.surcharge_cents   # PER-LINE rounding, see total_fare_cents
    input_set: "Per BookingLeg; demand from its ServiceDate's CONFIRMED-leg load factor; advance from clock vs departure_date; surcharge from leg's FareClass."
    constants:
      DEMAND_TIER_MID: 0.5
      DEMAND_TIER_HIGH: 0.8
      DEMAND_MULT_LOW: 1.00
      DEMAND_MULT_MID: 1.25
      DEMAND_MULT_HIGH: 1.60
      ADV_DAYS_EARLY: 14
      ADV_DAYS_MID: 7
      ADV_DAYS_LATE: 3
      ADV_FACTOR_EARLY: 0.90
      ADV_FACTOR_MID: 1.00
      ADV_FACTOR_LATE: 1.15
      ADV_FACTOR_LAST: 1.40
    precision: "round_half_up to whole cents; rounding applied per leg, before adding surcharge"
    variants:
      - name: pass_funded
        when: "Booking.funding_kind == PASS"
        difference: "leg_fare_cents := 0; no demand/advance math; one TravelPass ride consumed instead"

  - name: total_fare_cents
    trigger: "Booking confirm — aggregates the locked per-leg fares"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round each leg first (in leg_fare_cents), THEN sum the rounded cents.
      # 'round per leg then sum' is the chosen order; 'sum raw then round once' is NOT used.
      total_fare_cents = sum(leg.fare_cents for leg in booking.legs where leg.leg_state == ACTIVE)
    input_set: "All ACTIVE legs of the booking at confirm time."
    constants: {}
    precision: "Inputs are already-rounded integer cents; summation is exact."

  - name: cancel_settlement
    trigger: "Booking PAID->REFUNDED or PAID->CREDITED on /v1/bookings/{id}/cancel"
    algorithm: threshold
    formula: |
      # days-before-departure measured at cancel time against the EARLIEST leg's ServiceDate departure_date:
      dbd = floor_days(min_leg_departure_date - clock_now_date)
      if   dbd >= 7: base_penalty_pct = 0.00
      elif dbd >= 1: base_penalty_pct = 0.25
      else:          base_penalty_pct = 0.50          # same-day, 0 <= dbd < 1
      gross = booking.total_paid_cents
      # CASH variant:   penalty_pct = base_penalty_pct
      # CREDIT variant: penalty_pct = max(0.0, base_penalty_pct - 0.10)   # credit is 10pp more lenient, floored at 0
      penalty_cents = round_half_up(gross * penalty_pct)
      net_cents = gross - penalty_cents
    input_set: "The booking's total_paid_cents; dbd from clock vs earliest ACTIVE leg's ServiceDate.departure_date."
    constants:
      PENALTY_FREE_DAYS: 7
      PENALTY_MID_DAYS: 1
      PENALTY_PCT_MID: 0.25
      PENALTY_PCT_LAST: 0.50
      CREDIT_LENIENCY_PCT: 0.10
    precision: "round_half_up to whole cents on the penalty; net is exact subtraction"
    variants:
      - name: cash_refund
        when: "refund_destination == CASH (requires all legs' FareClass.refundable == true) OR system cascade (penalty_pct forced 0)"
        difference: "penalty_pct = base_penalty_pct; settlement_kind=CASH; payment_status -> REFUNDED"
      - name: travel_credit
        when: "refund_destination == TRAVEL_CREDIT (always permitted)"
        difference: "penalty_pct = max(0, base_penalty_pct - 0.10); settlement_kind=TRAVEL_CREDIT; payment_status -> CREDITED — different ENTITY-LEVEL outcome and a different number than cash for identical inputs"

  - name: exchange_amount
    trigger: "Booking CONFIRMED->EXCHANGED on /v1/bookings/{id}/exchange"
    algorithm: aggregation
    formula: |
      # new_leg_fare is computed via leg_fare_cents against the TARGET ServiceDate (fresh demand+advance).
      # circular-looking dependency resolved by PINNED evaluation order:
      #   step 1: compute new_leg_fare from target ServiceDate (independent of the old booking)
      #   step 2: amount_due = new_leg_fare - old_booking.total_paid_cents + operator.exchange_fee_cents
      #   step 3: if amount_due < 0 the surplus is issued as a TRAVEL_CREDIT note (never negative cash)
      new_leg_fare = leg_fare_cents(target_service_date, target_fare_class)
      amount_due = new_leg_fare - old_booking.total_paid_cents + operator.exchange_fee_cents
    input_set: "old booking total_paid_cents; target ServiceDate fare; operator exchange_fee_cents."
    constants: {}
    precision: "integer cents throughout; new_leg_fare already rounded by leg_fare_cents"

  - name: baggage_fee_cents
    trigger: "BaggageItem creation (POST /v1/bookings/{id}/baggage)"
    algorithm: threshold
    formula: |
      if weight_kg <= FREE_BAG_KG:
        fee_cents = 0
      else:
        fee_cents = round_half_up((weight_kg - FREE_BAG_KG) * OVERWEIGHT_RATE_CENTS_PER_KG)
    input_set: "Single BaggageItem.weight_kg vs free allowance."
    constants:
      FREE_BAG_KG: 23.0
      OVERWEIGHT_RATE_CENTS_PER_KG: 500
    precision: "round_half_up to whole cents; boundary at exactly 23.0 kg yields fee 0"

  - name: seat_inventory
    trigger: "Any leg hold (booking create), confirm, cancel, exchange, or ServiceDate cascade"
    algorithm: aggregation
    formula: |
      seats_held    = count(BookingLeg where service_date_id==sd.id AND leg_state==ACTIVE AND booking.booking_status==HELD)
      seats_sold    = count(BookingLeg where service_date_id==sd.id AND leg_state==ACTIVE AND booking.booking_status==CONFIRMED)
      seats_available = sd.seats_total - seats_held - seats_sold          # invariant: >= 0
      load_factor   = sd.seats_sold / sd.seats_total                       # only CONFIRMED count toward demand pricing
    input_set: "All ACTIVE BookingLegs on the ServiceDate, partitioned by their Booking's booking_status."
    constants: {}
    precision: "integer seat counts; load_factor is an exact rational used only for tier comparison"

  - name: pass_rides
    trigger: "PASS booking confirm (consume) and cancel/cascade (restore)"
    algorithm: aggregation
    formula: |
      rides_consumed   = sum over CONFIRMED-or-terminal-non-restored pass-funded bookings of their ACTIVE leg count
      rides_remaining  = rides_total - rides_consumed                      # invariant: >= 0
      # status re-derived: rides_remaining==0 -> EXHAUSTED ; >0 -> ACTIVE (unless EXPIRED by clock)
    input_set: "Pass-funded bookings redeeming this TravelPass."
    constants: {}
    precision: "integer ride counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every referenced resource in the path/body exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "Acting Passenger owns the target Booking/Pass (X-User-ID == passenger_id)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "Passenger-scoped mutations on bookings, passes, baggage"

  - priority: 5
    category: business_constraint
    check: "Request body field types/enums valid and required fields present (e.g., seat_number presence matches seating_mode; pass_id presence matches funding_kind)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_referential
    check: "Cross-entity state precondition holds (e.g., ServiceDate.sales==OPEN & lifecycle ok for confirm; no SCANNED ticket for cancel/exchange; FareClass.status==ACTIVE for new legs)"
    error_id: ERR_PRECONDITION_NOT_MET
    http_status: 409
    applies_to: "confirm, cancel, exchange, scan, baggage add, accessibility grant"

  - priority: 8
    category: business_temporal
    check: "HELD booking not expired (clock_now < hold_expires_at) at confirm; pass not EXPIRED (clock date <= expires_on) at redemption"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "confirm, pass-funded booking create"

  - priority: 9
    category: business_temporal
    check: "Multi-leg connection buffer satisfied: leg(n+1).departure_minute - leg(n).arrival_minute >= operator.default_connection_buffer_min (with next-day rollover) for adjacent legs ordered by leg_order"
    error_id: ERR_CONNECTION_TOO_TIGHT
    http_status: 409
    applies_to: "booking create (multi-leg), confirm"

  - priority: 10
    category: business_safety
    check: "Accessibility accommodation availability: GRANTED accommodations on a ServiceDate must not exceed ACCESSIBLE_SLOTS_PER_SERVICE_DATE"
    error_id: ERR_ACCESSIBILITY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /v1/accessibility-requests/{id}/grant"

  - priority: 11
    category: business_constraint
    check: "Reserved-seat uniqueness: a RESERVED seat_number on a ServiceDate is not already occupied by another ACTIVE leg (adjacency/exact-collision interval semantics on discrete seat slots)"
    error_id: ERR_SEAT_TAKEN
    http_status: 409
    applies_to: "booking create, confirm, exchange (RESERVED legs)"

  - priority: 12
    category: business_constraint
    check: "Refund eligibility: passenger CASH refund requires every leg's FareClass.refundable==true; otherwise only TRAVEL_CREDIT permitted"
    error_id: ERR_REFUND_NOT_ALLOWED
    http_status: 409
    applies_to: "cancel with refund_destination=CASH"

  - priority: 13
    category: business_fiscal
    check: "Seat capacity: a hold or confirm requires the ServiceDate.seats_available >= requested seats (aggregate quota)"
    error_id: ERR_SOLD_OUT
    http_status: 409
    applies_to: "booking create, confirm"

  - priority: 14
    category: business_fiscal
    check: "Pass balance: a PASS-funded booking requires rides_remaining >= leg count at confirm"
    error_id: ERR_PASS_DEPLETED
    http_status: 409
    applies_to: "pass-funded booking confirm"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "confirm (ServiceDate.version), exchange (Booking.version)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock (test-driving) ----
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the server's current UTC instant (drives advance-window pricing, hold expiry, pass expiry, penalty tiers)"
    roles: [SupportAgent]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock set to to_iso8601 for all subsequent time-dependent logic"]

  # ---- Operator ----
  - method: POST
    path: "/v1/operators"
    description: "Create a carrier"
    roles: [ScheduleManager]
    code: 201
    input: [name, mode, "default_connection_buffer_min?", "exchange_fee_cents?"]
    output: Operator
    side_effects: ["version=1"]

  - method: GET
    path: "/v1/operators/{operator_id}"
    description: "Read operator"
    roles: [ScheduleManager, FareAnalyst, Passenger, GateAgent, SupportAgent]
    code: 200
    input: []
    output: Operator
    side_effects: []

  # ---- FareClass ----
  - method: POST
    path: "/v1/fare-classes"
    description: "Create a fare class under an operator"
    roles: [FareAnalyst]
    code: 201
    input: [operator_id, code, seating_mode, "surcharge_cents?", "refundable?"]
    output: FareClass
    side_effects: ["status=ACTIVE, version=1"]

  - method: GET
    path: "/v1/fare-classes"
    description: "List fare classes, filterable by operator (reverse-reachability for FareClass.operator_id)"
    roles: [FareAnalyst, ScheduleManager, Passenger, SupportAgent]
    code: 200
    input: ["operator_id?", "limit?", "offset?"]
    output: FareClass[]
    side_effects: []

  - method: GET
    path: "/v1/fare-classes/{fare_class_id}"
    description: "Read a fare class"
    roles: [FareAnalyst, ScheduleManager, Passenger, SupportAgent]
    code: 200
    input: []
    output: FareClass
    side_effects: []

  - method: POST
    path: "/v1/fare-classes/{fare_class_id}/retire"
    description: "Retire a fare class (no new legs may reference it)"
    roles: [FareAnalyst]
    code: 200
    input: []
    output: FareClass
    side_effects: ["status -> RETIRED, version+1"]

  # ---- Route ----
  - method: POST
    path: "/v1/routes"
    description: "Create a route under an operator"
    roles: [ScheduleManager]
    code: 201
    input: [operator_id, origin_code, destination_code, depart_minute_of_day, arrive_minute_of_day]
    output: Route
    side_effects: ["status=DRAFT, version=1"]

  - method: GET
    path: "/v1/routes"
    description: "List routes, filterable by operator (reverse-reachability for Route.operator_id)"
    roles: [ScheduleManager, FareAnalyst, Passenger, SupportAgent]
    code: 200
    input: ["operator_id?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: GET
    path: "/v1/routes/{route_id}"
    description: "Read a route"
    roles: [ScheduleManager, FareAnalyst, Passenger, SupportAgent]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/v1/routes/{route_id}/publish"
    description: "Publish a route so service dates can be scheduled on it"
    roles: [ScheduleManager]
    code: 200
    input: []
    output: Route
    side_effects: ["status -> PUBLISHED, version+1"]

  # ---- ServiceDate ----
  - method: POST
    path: "/v1/service-dates"
    description: "Schedule a service date (trip instance) on a PUBLISHED route"
    roles: [ScheduleManager]
    code: 201
    input: [route_id, departure_date, seats_total, base_fare_cents]
    output: ServiceDate
    side_effects: ["lifecycle=SCHEDULED, sales=OPEN, seat counters initialized, version=1"]

  - method: GET
    path: "/v1/service-dates"
    description: "List service dates, filterable by route (reverse-reachability for ServiceDate.route_id)"
    roles: [ScheduleManager, FareAnalyst, Passenger, SupportAgent]
    code: 200
    input: ["route_id?", "limit?", "offset?"]
    output: ServiceDate[]
    side_effects: []

  - method: GET
    path: "/v1/service-dates/{service_date_id}"
    description: "Read a service date including live seat counters and load_factor"
    roles: [ScheduleManager, FareAnalyst, Passenger, GateAgent, SupportAgent]
    code: 200
    input: []
    output: ServiceDate
    side_effects: []

  - method: POST
    path: "/v1/service-dates/{service_date_id}/delay"
    description: "Mark a service date DELAYED"
    roles: [ScheduleManager]
    code: 200
    input: []
    output: ServiceDate
    side_effects: ["lifecycle -> DELAYED, version+1"]

  - method: POST
    path: "/v1/service-dates/{service_date_id}/restore"
    description: "Restore a DELAYED service date to SCHEDULED"
    roles: [ScheduleManager]
    code: 200
    input: []
    output: ServiceDate
    side_effects: ["lifecycle -> SCHEDULED, version+1"]

  - method: POST
    path: "/v1/service-dates/{service_date_id}/depart"
    description: "Mark a service date DEPARTED (freezes inventory, suspends sales)"
    roles: [ScheduleManager]
    code: 200
    input: []
    output: ServiceDate
    side_effects: ["lifecycle -> DEPARTED, sales -> SUSPENDED, version+1"]

  - method: POST
    path: "/v1/service-dates/{service_date_id}/cancel"
    description: "Cancel a service date (depth-3 cascade: cancel bookings, release legs, void tickets, refund/restore)"
    roles: [ScheduleManager]
    code: 200
    input: []
    output: ServiceDate
    side_effects:
      - "lifecycle -> CANCELLED, sales -> SUSPENDED"
      - "cascade: affected Bookings CANCELLED, legs RELEASED, tickets VOID, CASH bookings full-refunded, pass rides restored"
      - "version+1 (and version bumps on every affected Booking/Pass/Ticket)"

  - method: POST
    path: "/v1/service-dates/{service_date_id}/suspend-sales"
    description: "Suspend sales on a service date (parallel sales gate)"
    roles: [ScheduleManager]
    code: 200
    input: []
    output: ServiceDate
    side_effects: ["sales -> SUSPENDED, version+1"]

  - method: POST
    path: "/v1/service-dates/{service_date_id}/resume-sales"
    description: "Resume sales on a service date"
    roles: [ScheduleManager]
    code: 200
    input: []
    output: ServiceDate
    side_effects: ["sales -> OPEN, version+1"]

  # ---- Passenger ----
  - method: POST
    path: "/v1/passengers"
    description: "Register a passenger"
    roles: [SupportAgent, Passenger]
    code: 201
    input: [full_name, email, "needs_accessibility?"]
    output: Passenger
    side_effects: ["version=1"]

  - method: GET
    path: "/v1/passengers/{passenger_id}"
    description: "Read a passenger"
    roles: [Passenger, SupportAgent]
    code: 200
    input: []
    output: Passenger
    side_effects: []

  # ---- TravelPass ----
  - method: POST
    path: "/v1/passes"
    description: "Issue a multi-ride travel pass to a passenger"
    roles: [SupportAgent]
    code: 201
    input: [passenger_id, operator_id, rides_total, expires_on]
    output: TravelPass
    side_effects: ["status=ACTIVE, rides_consumed=0, version=1"]

  - method: GET
    path: "/v1/passes"
    description: "List travel passes, filterable by passenger or operator (reverse-reachability for TravelPass.passenger_id and TravelPass.operator_id)"
    roles: [Passenger, SupportAgent]
    code: 200
    input: ["passenger_id?", "operator_id?", "limit?", "offset?"]
    output: TravelPass[]
    side_effects: []

  - method: GET
    path: "/v1/passes/{pass_id}"
    description: "Read a travel pass (rides_remaining, status)"
    roles: [Passenger, SupportAgent]
    code: 200
    input: []
    output: TravelPass
    side_effects: []

  # ---- Booking ----
  - method: POST
    path: "/v1/bookings"
    description: "Create a HELD booking with one or more legs (places seat holds, computes hold_expires_at)"
    roles: [Passenger]
    code: 201
    input: [passenger_id, "funding_kind?", "pass_id?", legs]
    output: Booking
    side_effects:
      - "booking_status=HELD, payment_status=UNPAID"
      - "one BookingLeg per legs[] entry (each carries service_date_id, fare_class_id, leg_order, seat_number?)"
      - "each leg's ServiceDate.seats_held +=1, counters recomputed, that ServiceDate.version+1"
      - "hold_expires_at := clock_now + HOLD_TTL_MIN"
    note: "legs is an array of {service_date_id, fare_class_id, leg_order, seat_number?}."

  - method: GET
    path: "/v1/bookings/{booking_id}"
    description: "Read a booking (both status axes, totals)"
    roles: [Passenger, SupportAgent, GateAgent]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/v1/bookings"
    description: "List bookings, filterable by passenger or pass (reverse-reachability for Booking.passenger_id and Booking.pass_id)"
    roles: [Passenger, SupportAgent]
    code: 200
    input: ["passenger_id?", "pass_id?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/v1/bookings/{booking_id}/confirm"
    description: "Confirm a HELD booking: lock fares, move seats held->sold, issue tickets (OCC on each ServiceDate)"
    roles: [Passenger]
    code: 200
    input: [expected_service_date_version]
    output: Booking
    side_effects:
      - "booking_status -> CONFIRMED; total_fare_cents finalized"
      - "each ServiceDate seats_held-1/seats_sold+1, load_factor recomputed, ServiceDate.version+1"
      - "one Ticket per leg issued (ISSUED); PASS bookings consume rides (Pass.version+1)"
      - "Booking.version+1"
    note: "expected_service_date_version pins the version of the (single) referenced ServiceDate the client last observed; multi-leg bookings must observe one shared version baseline."

  - method: POST
    path: "/v1/bookings/{booking_id}/pay"
    description: "Capture payment for a CONFIRMED CASH booking"
    roles: [Passenger]
    code: 200
    input: []
    output: Booking
    side_effects: ["payment_status -> PAID, total_paid_cents := total_fare_cents, Booking.version+1"]

  - method: POST
    path: "/v1/bookings/{booking_id}/cancel"
    description: "Cancel a HELD or CONFIRMED booking; PAID bookings settle via refund_destination"
    roles: [Passenger, SupportAgent]
    code: 200
    input: ["refund_destination?"]
    output: Booking
    side_effects:
      - "booking_status -> CANCELLED; legs RELEASED; inventory recomputed; tickets VOID"
      - "if PAID & refund_destination=CASH -> REFUNDED + CASH RefundCreditNote; if TRAVEL_CREDIT -> CREDITED + TRAVEL_CREDIT note"
      - "if PASS-funded -> pass rides restored"
      - "Booking.version+1; affected ServiceDate.version+1"
    note: "refund_destination in {CASH, TRAVEL_CREDIT}; required only when payment_status==PAID; CASH requires all legs refundable."

  - method: POST
    path: "/v1/bookings/{booking_id}/exchange"
    description: "Exchange the leg of a CONFIRMED CASH booking onto a different ServiceDate (OCC on Booking)"
    roles: [Passenger, SupportAgent]
    code: 200
    input: [target_service_date_id, target_fare_class_id, "target_seat_number?", expected_booking_version]
    output: Booking
    side_effects:
      - "old Booking -> EXCHANGED (terminal); old leg RELEASED; old tickets VOID"
      - "new CONFIRMED+PAID Booking created on target ServiceDate; new ticket issued"
      - "amount settled = new_leg_fare - old_total_paid + exchange_fee_cents (surplus -> TRAVEL_CREDIT note)"
      - "both ServiceDate.version+1; old Booking.version+1"

  # ---- BookingLeg ----
  - method: GET
    path: "/v1/legs"
    description: "List booking legs, filterable by booking, service date, or fare class (reverse-reachability for BookingLeg.booking_id, BookingLeg.service_date_id, BookingLeg.fare_class_id)"
    roles: [Passenger, SupportAgent, GateAgent]
    code: 200
    input: ["booking_id?", "service_date_id?", "fare_class_id?", "limit?", "offset?"]
    output: BookingLeg[]
    side_effects: []

  - method: GET
    path: "/v1/legs/{booking_leg_id}"
    description: "Read a single booking leg (fare, seat, state)"
    roles: [Passenger, SupportAgent, GateAgent]
    code: 200
    input: []
    output: BookingLeg
    side_effects: []

  # ---- Ticket ----
  - method: GET
    path: "/v1/tickets"
    description: "List tickets, filterable by booking or leg (reverse-reachability for Ticket.booking_id and Ticket.booking_leg_id)"
    roles: [Passenger, SupportAgent, GateAgent]
    code: 200
    input: ["booking_id?", "booking_leg_id?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: GET
    path: "/v1/tickets/{ticket_id}"
    description: "Read a ticket"
    roles: [Passenger, SupportAgent, GateAgent]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: POST
    path: "/v1/tickets/{ticket_id}/scan"
    description: "Scan a ticket at the gate"
    roles: [GateAgent]
    code: 200
    input: []
    output: Ticket
    side_effects: ["state -> SCANNED, Ticket.version+1"]

  # ---- Baggage ----
  - method: POST
    path: "/v1/bookings/{booking_id}/baggage"
    description: "Add a checked baggage item to a booking (computes overweight fee)"
    roles: [Passenger, SupportAgent]
    code: 201
    input: [weight_kg]
    output: BaggageItem
    side_effects: ["fee_cents computed, version=1"]

  - method: GET
    path: "/v1/baggage"
    description: "List baggage items, filterable by booking (reverse-reachability for BaggageItem.booking_id)"
    roles: [Passenger, SupportAgent]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: BaggageItem[]
    side_effects: []

  - method: GET
    path: "/v1/baggage/{baggage_item_id}"
    description: "Read a baggage item"
    roles: [Passenger, SupportAgent]
    code: 200
    input: []
    output: BaggageItem
    side_effects: []

  # ---- Accessibility ----
  - method: POST
    path: "/v1/legs/{booking_leg_id}/accessibility-requests"
    description: "Request an accessibility accommodation on a leg"
    roles: [Passenger, SupportAgent]
    code: 201
    input: [accommodation]
    output: AccessibilityRequest
    side_effects: ["status=REQUESTED, version=1"]

  - method: GET
    path: "/v1/accessibility-requests"
    description: "List accessibility requests, filterable by leg (reverse-reachability for AccessibilityRequest.booking_leg_id)"
    roles: [Passenger, SupportAgent]
    code: 200
    input: ["booking_leg_id?", "limit?", "offset?"]
    output: AccessibilityRequest[]
    side_effects: []

  - method: GET
    path: "/v1/accessibility-requests/{accessibility_request_id}"
    description: "Read an accessibility request"
    roles: [Passenger, SupportAgent]
    code: 200
    input: []
    output: AccessibilityRequest
    side_effects: []

  - method: POST
    path: "/v1/accessibility-requests/{accessibility_request_id}/grant"
    description: "Grant an accessibility accommodation (reserves one accessible slot on the service date)"
    roles: [SupportAgent]
    code: 200
    input: []
    output: AccessibilityRequest
    side_effects: ["status -> GRANTED (if slots available, else ERR_ACCESSIBILITY_UNAVAILABLE), version+1"]

  - method: POST
    path: "/v1/accessibility-requests/{accessibility_request_id}/deny"
    description: "Deny an accessibility accommodation"
    roles: [SupportAgent]
    code: 200
    input: []
    output: AccessibilityRequest
    side_effects: ["status -> DENIED, version+1"]

  # ---- RefundCreditNote ----
  - method: GET
    path: "/v1/settlement-notes"
    description: "List settlement (refund/credit) notes, filterable by booking (reverse-reachability for RefundCreditNote.booking_id)"
    roles: [Passenger, SupportAgent]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: RefundCreditNote[]
    side_effects: []

  - method: GET
    path: "/v1/settlement-notes/{settlement_note_id}"
    description: "Read a settlement note (immutable)"
    roles: [Passenger, SupportAgent]
    code: 200
    input: []
    output: RefundCreditNote
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting passenger is not the owner of the target booking/pass" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body, bad enum, missing required field, or seat_number/pass_id presence mismatch with mode/funding" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_PRECONDITION_NOT_MET, http: 409, condition: "Cross-entity precondition failed (sales not OPEN, lifecycle wrong, SCANNED ticket blocks cancel/exchange, RETIRED fare class, route not PUBLISHED)" }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "HELD booking past hold_expires_at at confirm" }
  - { id: ERR_CONNECTION_TOO_TIGHT, http: 409, condition: "Adjacent legs violate the operator connection buffer" }
  - { id: ERR_SEAT_TAKEN, http: 409, condition: "RESERVED seat_number already occupied by another ACTIVE leg on the service date" }
  - { id: ERR_SOLD_OUT, http: 409, condition: "ServiceDate has no available seats for the requested hold/confirm" }
  - { id: ERR_REFUND_NOT_ALLOWED, http: 409, condition: "CASH refund requested but a leg's FareClass is non-refundable" }
  - { id: ERR_PASS_DEPLETED, http: 409, condition: "Pass-funded booking requires more rides than rides_remaining" }
  - { id: ERR_PASS_EXPIRED, http: 409, condition: "TravelPass is EXPIRED (clock date past expires_on) at redemption" }
  - { id: ERR_ACCESSIBILITY_UNAVAILABLE, http: 409, condition: "No accessible slots remain on the service date to grant" }
  - { id: ERR_FARE_CLASS_RETIRED, http: 409, condition: "Booking leg references a RETIRED fare class" }
  - { id: ERR_ROUTE_NOT_PUBLISHED, http: 409, condition: "Service date scheduled on a route that is not PUBLISHED" }
  - { id: ERR_NOT_PAID, http: 409, condition: "Refund/exchange requires a PAID booking but it is not paid" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Passenger email already registered" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset out of allowed bounds" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ScheduleManager
    description: "Owns operators, routes, and service-date scheduling/lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /v1/operators — create operator"
      - "POST /v1/routes — create route"
      - "POST /v1/routes/{id}/publish — publish route"
      - "POST /v1/service-dates — schedule service date"
      - "POST /v1/service-dates/{id}/delay|restore|depart|cancel|suspend-sales|resume-sales — lifecycle & sales control"
    shared_operations:
      - "GET reads on operators, routes, service-dates, fare-classes"

  - name: FareAnalyst
    description: "Owns fare-class configuration and pricing parameters"
    identity: opaque
    exclusive_operations:
      - "POST /v1/fare-classes — create fare class"
      - "POST /v1/fare-classes/{id}/retire — retire fare class"
    shared_operations:
      - "GET reads on fare-classes, routes, service-dates, operators"

  - name: Passenger
    description: "End user who books travel, pays, cancels, exchanges, manages baggage/accessibility on own resources"
    identity: "entity_backed:Passenger"
    exclusive_operations:
      - "POST /v1/bookings — create booking (own passenger_id)"
      - "POST /v1/bookings/{id}/confirm|pay — confirm/pay own booking"
    shared_operations:
      - "POST /v1/passengers — self-register"
      - "POST /v1/bookings/{id}/cancel|exchange — shared with SupportAgent"
      - "POST /v1/bookings/{id}/baggage — add baggage (shared)"
      - "POST /v1/legs/{id}/accessibility-requests — request accommodation (shared)"
      - "GET reads on own bookings, legs, tickets, passes, baggage, settlement-notes"

  - name: GateAgent
    description: "Scans tickets at boarding gates"
    identity: opaque
    exclusive_operations:
      - "POST /v1/tickets/{id}/scan — scan a ticket"
    shared_operations:
      - "GET reads on tickets, bookings, legs, service-dates"

  - name: SupportAgent
    description: "Operational agent: registers passengers, issues passes, grants/denies accessibility, handles refunds/exchanges on behalf of passengers"
    identity: opaque
    exclusive_operations:
      - "POST /v1/passes — issue travel pass"
      - "POST /v1/accessibility-requests/{id}/grant|deny — adjudicate accommodations"
      - "POST /v1/_clock/set_current_utc — set server clock (test/ops)"
    shared_operations:
      - "POST /v1/passengers — register passenger (shared with Passenger)"
      - "POST /v1/bookings/{id}/cancel|exchange|baggage — assist passengers"
      - "POST /v1/legs/{id}/accessibility-requests — file accommodation on behalf"
      - "GET reads across passengers, bookings, passes, settlement-notes"
