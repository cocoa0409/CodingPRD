            - "err1 == ERR_TRADE_NOT_EXPIRED (expire at 2026-08-06 <= t2 deadline 2026-08-11)"
            - "err2 == ERR_SETTLEMENT_WINDOW_EXPIRED (settle at 2026-08-12 > deadline)"
