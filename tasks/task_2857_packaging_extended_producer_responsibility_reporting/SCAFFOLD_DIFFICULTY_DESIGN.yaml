              as_user_id: "reg-1"
            - call: "POST /epr/registrations/${reg_or_id}/submit"
              payload: {}
              as: ProducerComplianceOfficer
              as_user_id: "${pp_id}"
          assert:
            - "At the threshold: Registration.${reg_ca_id}.exemption_status == OBLIGATED with assessed_group_revenue_usd == 5000000 and assessed_group_weight_kg == 10.500 and exemption_basis_applied == GROUP_LEVEL"
            - "One dollar below: Registration.${reg_or_id}.exemption_status == EXEMPT_SMALL_PRODUCER with assessed_group_revenue_usd == 4999999 and assessed_group_weight_kg == 10.500"
            - "Registration.${reg_ca_id}.exemption_status is still OBLIGATED after the restatement: the exemption verdict is frozen at submit time and is not recomputed"
            - "POST /epr/reports with registration_id ${reg_or_id} is rejected with ERR_EXEMPT_REGISTRATION_CANNOT_REPORT once that registration is accepted, while the same call on ${reg_ca_id} is allowed"
            - "Producer.${pq_id}.status == DRAFT after the restatement, and neither of PP's registrations was suspended by it"

