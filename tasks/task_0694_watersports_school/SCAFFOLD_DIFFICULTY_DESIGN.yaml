# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0694_watersports_school — 9 rules x 2 instances = 18 instances
# All `${var}` trace to an earlier captures: in the same instance.
# All formula-derived asserts are literals precomputed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: enrollment_estimate_vs_final_diverge_on_attended_group_size
        grounds:
          - calculations.enrollment_estimate_price
          - calculations.enrollment_final_price
          - entities.Enrollment.fields.estimated_price_cents
          - entities.Enrollment.fields.final_price_cents
          - state_machines.Enrollment.progress_status.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          The forward-looking estimate uses the booked party_size=4 (20% group tier) over
          all planned sessions, while the chronological final uses each session's ACTUAL
          attended group size=1 (0% group tier) — same enrollment, two algorithms, 16000 vs 20000.
        test_recipe:
          setup:
            - "School OPEN; LESSON course; level base_price_cents=10000, max_students_per_instructor=2, min_age=0, requires_swim_test=false, required_equipment_type=NONE."
            - "Student with SIGNED waiver; enrollment planned_sessions=2, party_size=4, no membership; PAID."
            - "Two scheduled sessions; student is the only attendee of each, checked in and attended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Wave Academy" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "Surf Basics", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 2, base_price_cents: 10000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Mia", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stu}", signed_by: "Mia", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stu}", course_level_id: "${lvl}", planned_sessions: 2, party_size: 4 }
              as: SchoolAdmin
              captures: { enr: $.data.id, est: $.data.estimated_price_cents }
            - call: "POST /enrollments/${enr}/pay"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-05T09:00:00Z", ends_at: "2026-03-05T10:00:00Z", tide_window_start: "2026-03-05T08:00:00Z", tide_window_end: "2026-03-05T12:00:00Z", capacity: 6 }
              as: SchoolAdmin
              captures: { ses1: $.data.id, ses1v: $.data.version }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-06T09:00:00Z", ends_at: "2026-03-06T10:00:00Z", tide_window_start: "2026-03-06T08:00:00Z", tide_window_end: "2026-03-06T12:00:00Z", capacity: 6 }
              as: SchoolAdmin
              captures: { ses2: $.data.id, ses2v: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${ses1}", enrollment_id: "${enr}", expected_session_version: "${ses1v}" }
              as: SchoolAdmin
              captures: { bk1: $.data.id }
            - call: "POST /bookings"
              payload: { session_id: "${ses2}", enrollment_id: "${enr}", expected_session_version: "${ses2v}" }
              as: SchoolAdmin
              captures: { bk2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:30:00Z" }
              as: SchoolAdmin
            - call: "POST /sessions/${ses1}/start"
              payload: {}
              as: SchoolAdmin
            - call: "POST /bookings/${bk1}/check-in"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${ses1}/complete"
              payload: {}
              as: SchoolAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T08:30:00Z" }
              as: SchoolAdmin
            - call: "POST /sessions/${ses2}/start"
              payload: {}
              as: SchoolAdmin
            - call: "POST /bookings/${bk2}/check-in"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${ses2}/complete"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /enrollments/${enr}/complete"
              payload: {}
              as: SchoolAdmin
              captures: { fin: $.data.final_price_cents }
          assert:
            - "Enrollment.${enr}.estimated_price_cents == 16000"
            - "Enrollment.${enr}.final_price_cents == 20000"
            - "Enrollment.${enr}.estimated_price_cents != Enrollment.${enr}.final_price_cents"

      - name: rental_fee_vs_refund_diverge_across_equipment_and_enrollment_domains
        grounds:
          - calculations.rental_fee
          - calculations.enrollment_refund
          - entities.RentalAgreement.fields.rental_fee_cents
          - entities.Enrollment.fields.refund_cents
          - state_machines.Enrollment.payment_status.PAID_to_REFUNDED
        distinguishing_aspect: |
          Two valid cost algorithms on DIFFERENT entity domains: tiered marginal rental_fee on
          RentalAgreement (3h@rate1000 -> 2500) versus lead-time waterfall refund on Enrollment
          (estimate 16000, earliest session 48h out -> 16000). Different subjects, different shapes.
        test_recipe:
          setup:
            - "Clock at 2026-03-01T00:00:00Z. Equipment BOARD hourly_rate_cents=1000, deposit_cents=5000."
            - "Rental window 3h -> tiered fee 2500. Separately a paid, withdrawn enrollment estimate 16000 with earliest remaining session 48h out -> full refund 16000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Tide School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "Surf Basics", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 2, base_price_cents: 10000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Mia", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stu}", signed_by: "Mia", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /equipment"
              payload: { school_id: "${sch}", equipment_type: "BOARD", asset_tag: "B-1", hourly_rate_cents: 1000, deposit_cents: 5000 }
              as: SchoolAdmin
              captures: { eq: $.data.id, eqv: $.data.version }
            - call: "POST /rentals"
              payload: { school_id: "${sch}", student_id: "${stu}", equipment_item_id: "${eq}", starts_at: "2026-03-02T09:00:00Z", ends_at: "2026-03-02T12:00:00Z", expected_equipment_version: "${eqv}" }
              as: SchoolAdmin
              captures: { rent: $.data.id, fee: $.data.rental_fee_cents }
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stu}", course_level_id: "${lvl}", planned_sessions: 2, party_size: 4 }
              as: SchoolAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/pay"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-03T00:00:00Z", ends_at: "2026-03-03T01:00:00Z", tide_window_start: "2026-03-02T23:00:00Z", tide_window_end: "2026-03-03T03:00:00Z", capacity: 6 }
              as: SchoolAdmin
              captures: { ses: $.data.id, sesv: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${ses}", enrollment_id: "${enr}", expected_session_version: "${sesv}" }
              as: SchoolAdmin
            - call: "POST /enrollments/${enr}/withdraw"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /enrollments/${enr}/refund"
              payload: {}
              as: SchoolAdmin
              captures: { refund: $.data.refund_cents }
          assert:
            - "RentalAgreement.${rent}.rental_fee_cents == 2500"
            - "Enrollment.${enr}.refund_cents == 16000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_fee_tiered_marginal_three_inputs
        grounds:
          - calculations.rental_fee
          - entities.RentalAgreement.fields.rental_fee_cents
          - entities.EquipmentItem.fields.hourly_rate_cents
        distinguishing_aspect: |
          Mode (a): non-linear formula with >=3 inputs (hours, rate, tier breakpoints) and nested
          min/max tier selection — 10h@rate1000 = 2*1000 + 6*500 + 2*250 = 5500, NOT average rate.
        test_recipe:
          setup:
            - "Clock default. Equipment KAYAK hourly_rate_cents=1000, deposit_cents=0. Rental window 10h."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Tier School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Leo", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /equipment"
              payload: { school_id: "${sch}", equipment_type: "KAYAK", asset_tag: "K-1", hourly_rate_cents: 1000, deposit_cents: 0 }
              as: SchoolAdmin
              captures: { eq: $.data.id, eqv: $.data.version }
          trigger:
            - call: "POST /rentals"
              payload: { school_id: "${sch}", student_id: "${stu}", equipment_item_id: "${eq}", starts_at: "2026-03-02T00:00:00Z", ends_at: "2026-03-02T10:00:00Z", expected_equipment_version: "${eqv}" }
              as: SchoolAdmin
              captures: { rent: $.data.id, fee: $.data.rental_fee_cents }
          assert:
            - "RentalAgreement.${rent}.rental_fee_cents == 5500"
            - "RentalAgreement.${rent}.deposit_held_cents == 0"

      - name: enrollment_final_price_round_per_line_then_sum
        grounds:
          - calculations.enrollment_final_price
          - entities.Enrollment.fields.final_price_cents
          - state_machines.Enrollment.progress_status.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Mode (b): rounding-order pinned — final rounds EACH attended-session line to cents,
          sums (9000+9000+10000=28000), then applies PREMIUM 15% and rounds once (23800);
          round-per-line vs sum-then-round differ here.
        test_recipe:
          setup:
            - "PREMIUM member; base_price_cents=10000; student attends 3 sessions with actual attended group sizes 2,2,1 (10%,10%,0% group tiers)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /schools"
              payload: { name: "Round School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SAIL", title: "Sail Basics", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 6, base_price_cents: 10000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Ana", certified_disciplines: ["SAIL"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Tom", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stuA: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stuA}", signed_by: "Tom", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /memberships"
              payload: { student_id: "${stuA}", tier: "PREMIUM" }
              as: SchoolAdmin
              captures: { memA: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Bea", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stuB: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stuB}", signed_by: "Bea", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stuA}", course_level_id: "${lvl}", membership_id: "${memA}", planned_sessions: 3, party_size: 2 }
              as: SchoolAdmin
              captures: { enrA: $.data.id }
            - call: "POST /enrollments/${enrA}/pay"
              payload: {}
              as: SchoolAdmin
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stuB}", course_level_id: "${lvl}", planned_sessions: 3, party_size: 2 }
              as: SchoolAdmin
              captures: { enrB: $.data.id }
            - call: "POST /enrollments/${enrB}/pay"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-05T09:00:00Z", ends_at: "2026-03-05T10:00:00Z", tide_window_start: "2026-03-05T08:00:00Z", tide_window_end: "2026-03-05T12:00:00Z", capacity: 6 }
              as: SchoolAdmin
              captures: { s1: $.data.id, s1v: $.data.version }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-06T09:00:00Z", ends_at: "2026-03-06T10:00:00Z", tide_window_start: "2026-03-06T08:00:00Z", tide_window_end: "2026-03-06T12:00:00Z", capacity: 6 }
              as: SchoolAdmin
              captures: { s2: $.data.id, s2v: $.data.version }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-07T09:00:00Z", ends_at: "2026-03-07T10:00:00Z", tide_window_start: "2026-03-07T08:00:00Z", tide_window_end: "2026-03-07T12:00:00Z", capacity: 6 }
              as: SchoolAdmin
              captures: { s3: $.data.id, s3v: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${s1}", enrollment_id: "${enrA}", expected_session_version: "${s1v}" }
              as: SchoolAdmin
              captures: { a1: $.data.id, s1v2: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${s1}", enrollment_id: "${enrB}", expected_session_version: "${s1v2}" }
              as: SchoolAdmin
              captures: { b1: $.data.id }
            - call: "POST /bookings"
              payload: { session_id: "${s2}", enrollment_id: "${enrA}", expected_session_version: "${s2v}" }
              as: SchoolAdmin
              captures: { a2: $.data.id, s2v2: $.data.version }
            - call: "POST /bookings"
              payload: { session_id: "${s2}", enrollment_id: "${enrB}", expected_session_version: "${s2v2}" }
              as: SchoolAdmin
              captures: { b2: $.data.id }
            - call: "POST /bookings"
              payload: { session_id: "${s3}", enrollment_id: "${enrA}", expected_session_version: "${s3v}" }
              as: SchoolAdmin
              captures: { a3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:30:00Z" }
              as: SchoolAdmin
            - call: "POST /sessions/${s1}/start"
              payload: {}
              as: SchoolAdmin
            - call: "POST /bookings/${a1}/check-in"
              payload: {}
              as: SchoolAdmin
            - call: "POST /bookings/${b1}/check-in"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${s1}/complete"
              payload: {}
              as: SchoolAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T08:30:00Z" }
              as: SchoolAdmin
            - call: "POST /sessions/${s2}/start"
              payload: {}
              as: SchoolAdmin
            - call: "POST /bookings/${a2}/check-in"
              payload: {}
              as: SchoolAdmin
            - call: "POST /bookings/${b2}/check-in"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${s2}/complete"
              payload: {}
              as: SchoolAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T08:30:00Z" }
              as: SchoolAdmin
            - call: "POST /sessions/${s3}/start"
              payload: {}
              as: SchoolAdmin
            - call: "POST /bookings/${a3}/check-in"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${s3}/complete"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /enrollments/${enrA}/complete"
              payload: {}
              as: SchoolAdmin
              captures: { fin: $.data.final_price_cents }
          assert:
            - "Enrollment.${enrA}.final_price_cents == 23800"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: session_cyclic_scheduled_weatherhold_loop
        grounds:
          - state_machines.Session.status.SCHEDULED_to_WEATHER_HOLD
          - state_machines.Session.status.WEATHER_HOLD_to_SCHEDULED
          - entities.Session.fields.status
        distinguishing_aspect: |
          Session is CYCLIC: SCHEDULED->WEATHER_HOLD->SCHEDULED->WEATHER_HOLD returns to a
          previously visited state (a true loop), not a linear A->B->C pipeline.
        test_recipe:
          setup:
            - "One SCHEDULED session under an OPEN school, no storm advisory."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cycle School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /instructors"
              payload: { school_id: "${sch}", full_name: "Kai", certified_disciplines: ["SURF"] }
              as: SchoolAdmin
              captures: { inst: $.data.id }
            - call: "POST /sessions"
              payload: { school_id: "${sch}", course_level_id: "${lvl}", instructor_id: "${inst}", starts_at: "2026-03-10T09:00:00Z", ends_at: "2026-03-10T10:00:00Z", tide_window_start: "2026-03-10T08:00:00Z", tide_window_end: "2026-03-10T12:00:00Z", capacity: 4 }
              as: SchoolAdmin
              captures: { ses: $.data.id }
            - call: "POST /sessions/${ses}/weather-hold"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${ses}/clear-hold"
              payload: {}
              as: SchoolAdmin
            - call: "POST /sessions/${ses}/weather-hold"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /sessions/${ses}/clear-hold"
              payload: {}
              as: SchoolAdmin
              captures: { st: $.data.status }
          assert:
            - "Session.${ses}.status == SCHEDULED"

      - name: enrollment_parallel_progress_and_payment_dimensions
        grounds:
          - state_machines.Enrollment.progress_status.ACTIVE_to_WITHDRAWN
          - state_machines.Enrollment.payment_status.UNPAID_to_PAID
          - entities.Enrollment.fields.progress_status
          - entities.Enrollment.fields.payment_status
        distinguishing_aspect: |
          Enrollment carries TWO independent state axes on one row: progress_status advances to
          WITHDRAWN while payment_status independently advances to PAID — neither transition gates
          the other's enum, proving parallel dimensions.
        test_recipe:
          setup:
            - "An ACTIVE/UNPAID enrollment with a SIGNED-waiver student, no age/swim gating."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Par School" }
              as: SchoolAdmin
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", discipline: "SURF", title: "C", kind: "LESSON" }
              as: SchoolAdmin
              captures: { crs: $.data.id }
            - call: "POST /levels"
              payload: { course_id: "${crs}", rank: 1, name: "L1", max_students_per_instructor: 4, base_price_cents: 5000, min_age: 0, requires_swim_test: false, required_equipment_type: "NONE" }
              as: SchoolAdmin
              captures: { lvl: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Mia", birthdate: "2000-01-01" }
              as: SchoolAdmin
              captures: { stu: $.data.id }
            - call: "POST /waivers"
              payload: { student_id: "${stu}", signed_by: "Mia", expires_at: "2026-12-31T00:00:00Z" }
              as: SchoolAdmin
            - call: "POST /enrollments"
              payload: { school_id: "${sch}", student_id: "${stu}", course_level_id: "${lvl}", planned_sessions: 1, party_size: 1 }
              as: SchoolAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/pay"
              payload: {}
              as: SchoolAdmin
          trigger:
            - call: "POST /enrollments/${enr}/withdraw"
              payload: {}
              as: SchoolAdmin
              captures: { ps: $.data.progress_status, pay: $.data.payment_status }
          assert:
            - "Enrollment.${enr}.progress_status == WITHDRAWN"
            - "Enrollment.${enr}.payment_status == PAID"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: enrollment_withdraw_cancels_booking_recomputes_session_ratio_depth3
