  # ---------------------------------------------------------------------------
  # Section 5 — Endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: standard_crud
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /students with limit=2 over 3 rows returns exactly 2 data rows with total_count 3 and has_more true; offset=2 returns the final row with has_more false."
        test_recipe:
          setup: ["three registered students"]
          setup_api_calls:
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
            - call: "POST /students"
              payload: { external_ref: "S-2", full_name: "Ben", grade_level: 11, family_id: "fam-b" }
              as: Bookkeeper
            - call: "POST /students"
              payload: { external_ref: "S-3", full_name: "Cid", grade_level: 12, family_id: "fam-c" }
              as: Bookkeeper
          trigger:
            - call: "GET /students?limit=2&offset=0"
              as: Bookkeeper
          assert:
            - "Page 1: data length == 2, total_count == 3, has_more == true"
            - "GET /students?limit=2&offset=2 returns data length == 1, total_count == 3, has_more == false"
      - name: get_roundtrip_echoes_fields
        claim_type: standard_crud
        grounds: [entities.Student, endpoints]
        distinguishing_aspect: "GET /students/{id} returns exactly the stored external_ref, full_name, grade_level, family_id."
        test_recipe:
          setup: ["one registered student"]
          setup_api_calls:
            - call: "POST /students"
              payload: { external_ref: "SIS-99", full_name: "Ada Lovelace", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /students/${s_id}"
              as: FamilyMember
              captures: { ref: $.data.external_ref, grade: $.data.grade_level }
          assert:
            - "${ref} == SIS-99 and ${grade} == 10"
      - name: summary_computed_read_consistent
        claim_type: computed_read
        grounds: [calculations.waiver_stacking, calculations.allocation_waterfall]
        distinguishing_aspect: "GET summary returns assessed 5000, waived 2500, paid 1000, balance 1500, open_case_count 0 after a 50% waiver approval and a 1000-cent settlement — matching the account entity fields."
        test_recipe:
          setup: ["OPEN year; waiverable fee 5000; program 50% approved; enrollment assessment 5000 with waived 2500; payment 1000 settled"]
          setup_api_calls:
            - call: "POST /school-years"
              payload: { label: "2026-27", start_date: "2026-08-01", end_date: "2027-06-30", refund_full_days: 2, refund_partial_days: 10, partial_refund_pct_bp: 5000, payment_plan_min_cents: 1000, payment_plan_max_installments: 6, writeoff_max_cents: 100000, aging_interval_days: 10, graduation_hold_threshold_cents: 5000 }
              as: Bookkeeper
