        distinguishing_aspect: "The recovery boundary is exact equality: at 99 of 100 recovered the close is rejected (ERR_RECOVERY_INCOMPLETE) and the recall stays RECOVERING; the 100th unit makes close succeed, releases the quarantined bottle to RETURNED_DIRTY, and lifts the plant posture back to GREEN."
        test_recipe:
          setup: ["Plant with released lot (produced 100); bottle b filled from the lot; recall created over the lot (b QUARANTINED, posture BREACH)"]
