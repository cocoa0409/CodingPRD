      - name: corner_immediate_consistency_clock_move_is_visible_on_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /warranty/_clock/set_current_utc]
          - calculations.service_contract_recognition
        distinguishing_aspect: "A logical-clock move is a write like any other: the very next read of every clock-derived field — contract recognition, deferred balance and vintage exposure — reflects the new instant with no lag or refresh step."
        test_recipe:
          setup:
            - "ProductFamily FAM-CC with a 12-month STRAIGHT_LINE contract of 480000 cents sold 2026-01-01 and one vintage expiring 2026-10-31."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-CC", name: "Clock Consistency Platform", launch_date: "2025-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 12000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_cc_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_cc_id}", vintage_code: "CC-MY2025", units_shipped: 400, ship_period_code: "2025-Q1", warranty_expiry_date: "2026-10-31" }
              as: WarrantyAnalyst
              captures: { vin_cc_id: $.data.id }
            - call: "POST /warranty/service-contracts"
              payload: { family_id: "${fam_cc_id}", contract_number: "SC-CC-01", sold_date: "2026-01-01", term_months: 12, total_contract_price_cents: 480000, recognition_method: "STRAIGHT_LINE" }
              as: WarrantyAnalyst
              captures: { sc_cc_id: $.data.id }
          trigger:
            - call: "GET /warranty/service-contracts/${sc_cc_id}"
              payload: {}
              as: WarrantyAnalyst
            - call: "POST /warranty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /warranty/service-contracts/${sc_cc_id}"
              payload: {}
              as: WarrantyAnalyst
            - call: "GET /warranty/vintages/${vin_cc_id}"
              payload: {}
              as: WarrantyAnalyst
          assert:
            - "The first trigger call reports months_elapsed == 7, recognized_revenue_cents == 280000 and deferred_revenue_cents == 200000 at the 2026-08-01 default clock"
            - "The third trigger call, issued immediately after the clock move, reports months_elapsed == 10, recognized_revenue_cents == 400000 and deferred_revenue_cents == 80000"
            - "The fourth trigger call reports ProductVintage.${vin_cc_id}.exposure_status == EXPIRED, having been ACTIVE before the clock move"
            - "recognized_revenue_cents + deferred_revenue_cents + refunded_revenue_cents == 480000 both before and after the move"
