  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_gated_by_participant_enrollment
        grounds:
          - state_machines.Participant.ENROLLED_to_SUSPENDED
          - errors[ERR_PARTICIPANT_NOT_ENROLLED]
        distinguishing_aspect: |
          Pair CallAssignment x Participant: creating an assignment for a SUSPENDED participant
          fails with ERR_PARTICIPANT_NOT_ENROLLED; after resume restores ENROLLED the identical
          request succeeds. Distinct pair from assignment_gated_by_volunteer_confidentiality
          (CallAssignment x VolunteerCaller) and referral_submit_gated_by_call_log_flag
          (ServiceReferral x CallLog).
        test_recipe:
          setup:
            - "Program; participant enrolled with MON 09:00-11:00 schedule then suspended; certified volunteer with MON availability"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 5, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator }
            - { call: "POST /api/participants", payload: { full_name: "Gate P", date_of_birth: "1951-12-01", phone: "555-2600", address: "1 Gate Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { p_id: $.data.id } }
            - { call: "POST /api/participants/${p_id}/emergency-contacts", payload: { full_name: "KG", phone: "555-2601", relationship: "son", contact_rank: "PRIMARY" }, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/submit-review", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/approve", payload: {}, as: IntakeWorker }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "09:00", window_end: "11:00" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers", payload: { full_name: "Vol G", phone: "555-2602" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "SAFETY_PROTOCOL", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "LISTENING_SKILLS", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/training-records", payload: { module: "MANDATED_REPORTING", completed_at: "2026-07-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/confidentiality-agreements", payload: { policy_version: "v2026.1", valid_until: "2027-08-01T00:00:00Z" }, as: VolunteerCaller, as_user_id: "${v_id}" }
            - { call: "POST /api/volunteers/${v_id}/certify", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/volunteers/${v_id}/availability-windows", payload: { weekday: "MON", window_start: "08:00", window_end: "17:00", effective_from: "2026-08-01" }, as: ProgramCoordinator }
            - { call: "POST /api/participants/${p_id}/suspend", payload: { reason: "vacation" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "09:00", window_end: "09:30" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /api/participants/${p_id}/resume", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/call-assignments", payload: { participant_id: "${p_id}", volunteer_id: "${v_id}", scheduled_date: "2026-08-03", window_start: "10:00", window_end: "10:30" }, as: ProgramCoordinator, captures: { a_ok: $.data.id, a_ok_status: $.data.status } }
          assert:
            - "err == ERR_PARTICIPANT_NOT_ENROLLED while Participant.${p_id}.status == SUSPENDED"
            - "After resume (status ENROLLED), the same-shape request succeeds: a_ok_status == SCHEDULED"
            - "Resume also auto-created the 09:00-09:30 assignment via the selector, so the manual 10:00 slot is conflict-free"

      - name: assignment_gated_by_volunteer_confidentiality
        grounds:
          - state_machines.ConfidentialityAgreement.ACTIVE_to_REVOKED
          - errors[ERR_CONFIDENTIALITY_NOT_CURRENT]
          - validations[priority=8]
        distinguishing_aspect: |
          Pair CallAssignment x VolunteerCaller (via ConfidentialityAgreement currency): with the
          volunteer's only agreement REVOKED, assignment creation fails with
          ERR_CONFIDENTIALITY_NOT_CURRENT even though the volunteer is still status ACTIVE; after
          the volunteer signs a fresh agreement on the current policy version, creation succeeds.
