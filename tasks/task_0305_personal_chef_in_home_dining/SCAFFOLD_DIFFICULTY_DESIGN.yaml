# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Personal Chef & In-Home Dining Booking — Expert
#
# 9 Difficulty Rules × 2 instances = 18 instances.
# Every ${var} traces to a captures: binding earlier in the same instance.
# Every formula-derived assert literal was computed by code against §1.3.
#
# Shared conventions used across instances:
#   - Clock pinned via POST /_clock/set before any lead-time-sensitive flow.
#   - Canonical chef "menu A": base_price_per_guest_cents=9000,
#     estimated_ingredient_per_guest_cents=4000  -> party 6 yields:
#       labor=54000, est_subtotal=24000 (tier MID -> rate 0.18),
#       est_grocery=28320, travel(ZONE_A)=5000, quote=87320, deposit=26196.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: Booking ingredient — estimated vs actual ----
      - name: booking_ingredient_estimated_vs_actual_divergence
        grounds:
          - calculations.estimated_grocery_total
          - calculations.actual_grocery_total
          - calculations.quote_total
          - entities.Booking.fields.estimated_grocery_total_cents
          - entities.Booking.fields.actual_grocery_total_cents
          - state_machines.GroceryRun.OPEN_to_FINALIZED
        distinguishing_aspect: |
          On the Booking domain: estimated_grocery_total_cents (menu per-guest estimate,
          rounded once) and actual_grocery_total_cents (receipt line items, per-line
          round-then-sum) coexist on the same booking and feed quote_total differently —
          estimated 28320 before finalize, actual 29500 after, so quote_total moves 87320->88500.
        test_recipe:
          setup:
            - "Active chef with menu A and ZONE_A travel zone; confirmed booking for party 6 (estimated grocery 28320, quote 87320)."
            - "Grocery run finalized with receipt lines summing 25000 raw at locked rate 0.18 producing actual grocery 29500."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef A", home_base_zip: "94101", equipment_inventory: ["SOUS_VIDE"], prep_buffer_minutes: 90, max_bookings_per_day: 2 }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Tasting A", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12, allergen_tags: [], required_equipment: [] }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client X", email: "x@ex.com", allergen_restrictions: [], dietary_pattern: "OMNIVORE" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94103", event_start_utc: "2026-08-15T18:00:00Z", event_end_utc: "2026-08-15T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { est_grocery: $.data.estimated_grocery_total_cents, quote_pre: $.data.quote_total_cents }
            - call: "POST /grocery-runs"
              payload: { booking_id: "${booking_id}", line_items: [{ label: "produce", actual_cost_cents: 10000 }, { label: "protein", actual_cost_cents: 10000 }, { label: "dairy", actual_cost_cents: 5000 }] }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { gr_id: $.data.id }
          trigger:
            - call: "POST /grocery-runs/${gr_id}/finalize"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { actual_grocery: $.data.raw_actual_subtotal_cents }
          assert:
            - "Booking.${booking_id}.estimated_grocery_total_cents == 28320"
            - "Booking.${booking_id}.actual_grocery_total_cents == 29500"
            - "Booking.${booking_id}.quote_total_cents == 88500"
            - "Booking.${booking_id}.actual_grocery_total_cents != Booking.${booking_id}.estimated_grocery_total_cents"

      # ---- Instance 2: Chef reliability — projected vs settled ----
      - name: chef_reliability_projected_vs_settled_divergence
        grounds:
          - calculations.chef_settled_reliability
          - calculations.chef_projected_reliability
          - entities.Chef.fields.settled_reliability_score
          - entities.Chef.fields.projected_reliability_score
          - state_machines.Booking.REQUESTED_to_DECLINED
          - state_machines.Booking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          On the Chef domain (NOT the Booking ingredient domain): settled (chronological,
          terminal-only) = 42 while projected (forward-looking, +10 per CONFIRMED) = 62 for
          the same chef with one DECLINED terminal booking and two CONFIRMED bookings.
        test_recipe:
          setup:
            - "Active chef who declined one booking (settled basis 42) and has two CONFIRMED bookings (projected adds 2*10)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef R", home_base_zip: "94101", equipment_inventory: [], max_bookings_per_day: 5 }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Basic", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /clients"
              payload: { full_name: "Client R", email: "r@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-10T18:00:00Z", event_end_utc: "2026-08-10T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { b_decl: $.data.id }
            - call: "POST /bookings/${b_decl}/decline"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-11T18:00:00Z", event_end_utc: "2026-08-11T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { b_c1: $.data.id }
            - call: "GET /chefs/${chef_id}"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { v_after_decline: $.data.version }
            - call: "POST /bookings/${b_c1}/confirm"
              payload: { expected_chef_version: "${v_after_decline}" }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "GET /chefs/${chef_id}"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94110", event_start_utc: "2026-08-12T18:00:00Z", event_end_utc: "2026-08-12T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { b_c2: $.data.id }
          trigger:
            - call: "POST /bookings/${b_c2}/confirm"
              payload: { expected_chef_version: "${v2}" }
              as: Chef
              as_user_id: "${chef_id}"
          assert:
            - "Chef.${chef_id}.settled_reliability_score == 42"
            - "Chef.${chef_id}.projected_reliability_score == 62"
            - "Chef.${chef_id}.projected_reliability_score != Chef.${chef_id}.settled_reliability_score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Instance 1: mode (a) tiered markup rate selection (>=3 inputs, tier branch) ----
      - name: grocery_markup_tier_selection_mode_a
        grounds:
          - calculations.grocery_markup_selection
          - calculations.estimated_grocery_total
          - entities.Booking.fields.locked_markup_rate
          - entities.MenuPackage.fields.estimated_ingredient_per_guest_cents
        distinguishing_aspect: |
          Mode (a): rate is selected by a 3-input non-linear branch
          (estimated_ingredient_per_guest_cents * party_size compared to TIER ceilings).
          party 6 * 4000 = 24000 -> MID tier 0.18; the same menu at party 4 (16000) would
          select 0.25 — a conditional tier selection, not a single linear formula.
        test_recipe:
          setup:
            - "Active chef + menu A; confirmed booking party 6 selects the 0.18 MID tier."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef M", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Tasting A", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client M", email: "m@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94115", event_start_utc: "2026-08-20T18:00:00Z", event_end_utc: "2026-08-20T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { rate: $.data.locked_markup_rate }
          assert:
            - "Booking.${booking_id}.locked_markup_rate == 0.18"
            - "Booking.${booking_id}.labor_total_cents == 54000"
            - "Booking.${booking_id}.estimated_grocery_total_cents == 28320"
            - "Booking.${booking_id}.quote_total_cents == 87320"

      # ---- Instance 2: mode (b) per-line round-then-sum (rounding order pinned) ----
      - name: actual_grocery_per_line_round_then_sum_mode_b
        grounds:
          - calculations.actual_grocery_total
          - entities.GroceryRun.fields.line_items
          - entities.GroceryRun.fields.raw_actual_subtotal_cents
          - entities.Booking.fields.actual_grocery_total_cents
          - state_machines.GroceryRun.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Mode (b) (distinct from instance 1's tier selection): with locked rate 0.25 and
          three lines (1010, 2030, 3050), per-line round-then-sum = 1263+2538+3813 = 7614,
          whereas sum-then-round of 6090*1.25 = 7613. The scaffold pins round-then-sum, so
          actual_grocery_total_cents MUST equal 7614 (not 7613).
        test_recipe:
          setup:
            - "Active chef + low-volume menu (est per-guest 2000); confirmed booking party 5 (est subtotal 10000 -> rate 0.25), grocery run with the three trap lines."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef B", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Small Plates", base_price_per_guest_cents: 8000, estimated_ingredient_per_guest_cents: 2000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 4000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client B", email: "b@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 5, service_zip: "94117", event_start_utc: "2026-08-22T18:00:00Z", event_end_utc: "2026-08-22T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { rate: $.data.locked_markup_rate }
            - call: "POST /grocery-runs"
              payload: { booking_id: "${booking_id}", line_items: [{ label: "l1", actual_cost_cents: 1010 }, { label: "l2", actual_cost_cents: 2030 }, { label: "l3", actual_cost_cents: 3050 }] }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { gr_id: $.data.id }
          trigger:
            - call: "POST /grocery-runs/${gr_id}/finalize"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { raw_sub: $.data.raw_actual_subtotal_cents }
          assert:
            - "Booking.${booking_id}.locked_markup_rate == 0.25"
            - "GroceryRun.${gr_id}.raw_actual_subtotal_cents == 6090"
            - "Booking.${booking_id}.actual_grocery_total_cents == 7614"
            - "Booking.${booking_id}.quote_total_cents == 51614"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Instance 1: Booking parallel dimensions (lifecycle × payment) ----
      - name: booking_parallel_lifecycle_and_payment_axes
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - state_machines.Booking.UNPAID_to_DEPOSIT_PAID
          - entities.Booking.fields.lifecycle_status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Two independent state axes on ONE Booking row evolve separately: paying the deposit
          advances payment_status UNPAID->DEPOSIT_PAID while lifecycle_status stays CONFIRMED
          (a payment never moves the lifecycle axis), proving parallel dimensions.
        test_recipe:
          setup:
            - "Confirmed booking party 6 (deposit 26196); deposit then paid."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef P", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Tasting A", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /menus/${menu_id}/publish"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /travel-zones"
              payload: { chef_id: "${chef_id}", zone_code: "ZONE_A", zip_prefixes: ["941"], travel_fee_cents: 5000 }
              as: Chef
              as_user_id: "${chef_id}"
            - call: "POST /chefs/${chef_id}/activate"
              payload: {}
              as: Chef
              as_user_id: "${chef_id}"
              captures: { chef_v1: $.data.version }
            - call: "POST /clients"
              payload: { full_name: "Client P", email: "p@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /bookings"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 6, service_zip: "94120", event_start_utc: "2026-08-25T18:00:00Z", event_end_utc: "2026-08-25T22:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_chef_version: "${chef_v1}" }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { deposit_due: $.data.deposit_due_cents }
          trigger:
            - call: "POST /payments"
              payload: { booking_id: "${booking_id}", kind: "DEPOSIT", amount_cents: 26196 }
              as: Client
              as_user_id: "${client_id}"
              captures: { pay_id: $.data.id }
          assert:
            - "Booking.${booking_id}.payment_status == DEPOSIT_PAID"
            - "Booking.${booking_id}.lifecycle_status == CONFIRMED"
            - "Booking.${booking_id}.amount_captured_cents == 26196"
            - "Booking.${booking_id}.balance_due_cents == 61124"

      # ---- Instance 2: RecurringPlan cyclic ACTIVE<->PAUSED ----
      - name: recurring_plan_cyclic_active_paused_active
        grounds:
          - state_machines.RecurringPlan.ACTIVE_to_PAUSED
          - state_machines.RecurringPlan.PAUSED_to_ACTIVE
          - entities.RecurringPlan.fields.status
        distinguishing_aspect: |
          On the RecurringPlan entity (distinct from Booking): the status axis cycles
          ACTIVE -> PAUSED -> ACTIVE, a genuine cycle (A->B->A), not a one-way linear pipeline.
        test_recipe:
          setup:
            - "Active recurring plan."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef C", home_base_zip: "94101" }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Weekly", base_price_per_guest_cents: 7000, estimated_ingredient_per_guest_cents: 3000, min_party_size: 2, max_party_size: 8 }
              as: Chef
              as_user_id: "${chef_id}"
              captures: { menu_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client C", email: "c@ex.com" }
              as: Client
              captures: { client_id: $.data.id }
            - call: "POST /recurring-plans"
              payload: { chef_id: "${chef_id}", client_id: "${client_id}", menu_package_id: "${menu_id}", party_size: 4, service_zip: "94110", weekday: 2, event_start_time_utc: "18:00:00", duration_minutes: 180, cadence_weeks: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /recurring-plans/${plan_id}/pause"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /recurring-plans/${plan_id}/resume"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { st: $.data.status }
          assert:
            - "RecurringPlan.${plan_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- Instance 1: depth-3 cancel -> void grocery run -> re-pin quote ----
      - name: cancel_voids_grocery_run_repins_quote_depth3
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.GroceryRun.FINALIZED_to_VOIDED
          - calculations.quote_total
          - calculations.actual_grocery_total
          - entities.Booking.fields.actual_grocery_total_cents
          - entities.Booking.fields.quote_total_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by booking cancel: (1) Booking->CANCELLED causes
          (2) FINALIZED GroceryRun -> VOIDED, which itself causes
          (3) Booking.actual_grocery_total_cents -> 0 and quote_total re-pinned to the
          estimated basis (87320). Each hop is caused by the prior, not by the cancel directly.
        test_recipe:
          setup:
            - "Confirmed party-6 booking with a FINALIZED grocery run (actual 29500, quote 88500); event far enough out for a full refund."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chefs"
              payload: { display_name: "Chef D3", home_base_zip: "94101", equipment_inventory: ["SOUS_VIDE"] }
              as: Chef
              captures: { chef_id: $.data.id }
            - call: "POST /menus"
              payload: { chef_id: "${chef_id}", title: "Tasting A", base_price_per_guest_cents: 9000, estimated_ingredient_per_guest_cents: 4000, min_party_size: 2, max_party_size: 12 }
              as: Chef
              as_user_id: "${chef_id}"
