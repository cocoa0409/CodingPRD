        grounds:
          - state_machines.TradeAreaModel.DRAFT_to_LOCKED
          - state_machines.SalesForecast.DRAFT_to_SUPERSEDED
          - state_machines.CommitteeReview.OPEN_to_EXPIRED
          - state_machines.Site.IN_COMMITTEE_to_MODELED
