  - section: state_machines
    instances:
      - name: corner_sm_new_package_starts_draft_on_both_parallel_axes
        claim_type: Initial State
        grounds:
          - state_machines.StartupPackage.negotiation_status.initial_state
          - state_machines.StartupPackage.spend_status.initial_state
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "StartupPackage carries two independent state dimensions; a freshly created row must sit at the initial state of BOTH - negotiation_status DRAFT and spend_status NOT_YET_AVAILABLE - with negotiation_round 1."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { sm1_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${sm1_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { sm1_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${sm1_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { sm1_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${sm1_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { sm1_fac: $.data.id }
          trigger:
            - call: "POST /startup-packages"
              payload: { faculty_id: "${sm1_fac}", package_kind: "INITIAL", dean_unit_id: "${sm1_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { sm1_pkg: $.data.id }
          assert:
            - "StartupPackage.${sm1_pkg}.negotiation_status == DRAFT"
            - "StartupPackage.${sm1_pkg}.spend_status == NOT_YET_AVAILABLE"
            - "StartupPackage.${sm1_pkg}.negotiation_round == 1 and activated_on == null and closed_out_on == null"
            - "StartupPackage.${sm1_pkg}.proposed_by_user_id == null and endorsed_by_user_id == null and approved_by_user_id == null"

      - name: corner_sm_submit_advances_draft_to_submitted_and_stamps_proposer
        claim_type: Valid Transition
        grounds:
          - state_machines.StartupPackage.transitions.DRAFT_to_SUBMITTED
          - endpoints.POST_startup_packages_id_submit
        distinguishing_aspect: "The DRAFT -> SUBMITTED edge fires when both preconditions hold, stamps proposed_by_user_id from the X-User-ID header (not from any payload field), bumps version, and leaves the spend axis at NOT_YET_AVAILABLE."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member and one DRAFT package of 20000000 whose single EQUIPMENT tranche is exactly 20000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { sm2_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${sm2_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { sm2_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${sm2_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { sm2_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${sm2_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { sm2_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${sm2_fac}", package_kind: "INITIAL", dean_unit_id: "${sm2_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { sm2_pkg: $.data.id, sm2_v0: $.data.version }
            - call: "POST /startup-packages/${sm2_pkg}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
              captures: { sm2_tr: $.data.id }
          trigger:
            - call: "POST /startup-packages/${sm2_pkg}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
          assert:
            - "response code is 200 and StartupPackage.${sm2_pkg}.negotiation_status == SUBMITTED"
            - "StartupPackage.${sm2_pkg}.proposed_by_user_id == U-DEANOFFICE-1 (taken from the X-User-ID header; submit declares no payload fields at all)"
            - "StartupPackage.${sm2_pkg}.version == ${sm2_v0} + 1"
            - "StartupPackage.${sm2_pkg}.spend_status is still NOT_YET_AVAILABLE - the two axes move independently"
            - "CommitmentTranche.${sm2_tr}.status is still SCHEDULED and opened_on == null; submitting commits no money"
            - "FundingUnit.${sm2_dept}.reserved_cents == 0 and available_pool_cents == 400000000"

      - name: corner_sm_approve_from_draft_is_rejected_with_package_state_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.StartupPackage.transitions.DEAN_REVIEW_to_APPROVED
          - validations.priority_17_ERR_PACKAGE_STATE_INVALID
        distinguishing_aspect: "APPROVED is reachable only from DEAN_REVIEW; calling /approve while the package is still DRAFT (skipping submit and endorse entirely) returns 409 ERR_PACKAGE_STATE_INVALID and reserves nothing, so the approval chain cannot be short-circuited."
        test_recipe:
          setup:
            - "MINI-UNITS plus one CANDIDATE faculty member and one DRAFT package of 20000000 with a matching single EQUIPMENT tranche; the package has never been submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { sm3_col: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${sm3_col}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { sm3_dept: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${sm3_col}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { sm3_dean: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${sm3_dept}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { sm3_fac: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${sm3_fac}", package_kind: "INITIAL", dean_unit_id: "${sm3_dean}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 20000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { sm3_pkg: $.data.id }
            - call: "POST /startup-packages/${sm3_pkg}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 20000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
          trigger:
            - call: "POST /startup-packages/${sm3_pkg}/approve"
              payload: {}
              as: Dean
              as_user_id: "${sm3_col}"
          assert:
            - "response code is 409 with error_id ERR_PACKAGE_STATE_INVALID"
