            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "Main", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 1000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQZ", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s_eqz: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s_eib: $.data.id } }
