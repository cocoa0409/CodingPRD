# =============================================================================
# Task 1250: Underground Storage Tank Compliance & Testing Services
# UST testing contractor: tank/piping inventory & test schedule, leak detector
# & tightness test execution, release detection records & regulatory
# submission, cathodic protection surveys, spill bucket/overfill inspection,
# deficiency correction & re-test, operator training class A/B/C, state fund
# & release reporting.
# =============================================================================

scenario: |
  Underground Storage Tank Compliance & Testing Services (UST testing contractor):
  tank/piping inventory & test schedule, line leak detector & tightness test
  execution, release detection record & regulatory submission, cathodic
  protection survey, spill bucket/overfill inspection, deficiency correction &
  re-test, operator training class A/B/C, state fund & release reporting.

domain_name: ust-compliance
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: facility_name, type: string, source: input, description: "Display name of the regulated site" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the site" }
      - { name: owner_account_id, type: string, source: system, description: "Opaque X-User-ID of the FacilityOwner who created the facility; ownership anchor for owner-gated operations" }
      - { name: annual_fee_paid_through, type: datetime, source: input, description: "State fund annual fee paid-through timestamp; fund eligibility requires this >= current clock" }
      - { name: fund_program_election, type: enum, source: input, default: PER_OCCURRENCE, description: "State fund coverage election; constraints: PER_OCCURRENCE | AGGREGATE" }
      - { name: posture_score, type: integer, source: computed, default: 100, description: "Compliance score 0..100 per calculations.compliance_posture_score" }
      - { name: compliance_posture, type: enum, source: computed, default: COMPLIANT, description: "Derived from posture_score; constraints: COMPLIANT (>=85) | DEFICIENT (>=60) | NON_COMPLIANT (<60)" }
      - { name: fund_cap_remaining_cents, type: integer, source: computed, default: 100000000, description: "Fiscal-year fund cap remaining; starts at FUND_YEAR_CAP_CENTS; reserved on claim submit, released on withdraw/deny" }
      - { name: fund_year_deductible_remaining_cents, type: integer, source: computed, default: 2000000, description: "AGGREGATE-election deductible pool remaining this fund year; consumed on claim APPROVED/PARTIALLY_APPROVED" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> ACTIVE -> CLOSED" }

  - name: TankSystem
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; owning site" }
      - { name: tank_tag, type: string, source: input, description: "Operator-facing tank label; unique per facility" }
      - { name: substance, type: enum, source: input, description: "GASOLINE | DIESEL | KEROSENE | USED_OIL" }
      - { name: capacity_gallons, type: integer, source: input, description: "Nominal capacity; MANUAL_GAUGING mode requires capacity_gallons <= 2000" }
      - { name: installed_on, type: datetime, source: input, description: "Installation date; baseline for first test due dates" }
      - { name: tank_construction, type: enum, source: input, description: "STEEL | FRP | COMPOSITE" }
      - { name: piping_type, type: enum, source: input, description: "PRESSURIZED | SUCTION | GRAVITY" }
      - { name: release_detection_mode, type: enum, source: input, description: "INTERSTITIAL_MONITORING | ATG_INVENTORY | MANUAL_GAUGING" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> IN_SERVICE <-> TEMPORARILY_CLOSED -> PERMANENTLY_CLOSED" }

  - name: Component
    parent: TankSystem
    common_fields: true
    fields:
      - { name: tank_system_id, type: string, source: input, description: "FK -> TankSystem.id; owning tank system" }
      - { name: component_type, type: enum, source: input, description: "SPILL_BUCKET | OVERFILL_DEVICE | LINE_LEAK_DETECTOR | CATHODIC_PROTECTION" }
      - { name: install_date, type: datetime, source: input, description: "Component installation date" }
      - { name: serial_no, type: string, source: input, description: "Manufacturer serial number" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE -> DEFICIENT -> IN_SERVICE (on verify) ; IN_SERVICE -> OUT_OF_SERVICE (on tank permanent closure)" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician display name" }
      - { name: endorsements, type: array, source: input, description: "Array of endorsement enums: TIGHTNESS_TESTER | LLD_TESTER | CP_TESTER | INSPECTOR; gates which service_type the technician may be scheduled for" }
      - { name: trainer, type: boolean, source: input, default: false, description: "Whether the technician may issue operator TrainingRecords" }
      - { name: active, type: boolean, source: system, default: true, description: "Inactive technicians cannot be scheduled" }

  - name: ServiceOrder
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; site being serviced" }
      - { name: tank_system_id, type: string, source: input, description: "FK -> TankSystem.id; tank under test; must belong to facility_id" }
      - { name: component_id, type: string, source: input, description: "FK -> Component.id; required for CP_SURVEY, LLD_FUNCTION, SPILL_OVERFILL_INSPECTION; must be null for TANK_TIGHTNESS and LINE_TIGHTNESS", constraints: "conditionally required" }
      - { name: service_type, type: enum, source: input, description: "TANK_TIGHTNESS | LINE_TIGHTNESS | LLD_FUNCTION | CP_SURVEY | SPILL_OVERFILL_INSPECTION" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; assigned at schedule time" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled window start (UTC); half-open interval start" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled window end (UTC); exclusive bound; must be > window_start" }
      - { name: line_items, type: array, source: input, description: "Quote lines: [{description, qty (number, may be fractional), unit_price_cents (integer)}]" }
      - { name: quote_total_cents, type: integer, source: computed, description: "Per calculations.service_quote_total: round each line half-up to cents, sum, add MOBILIZATION_FLAT_CENTS" }
      - { name: result_outcome, type: enum, source: system, default: NONE, description: "NONE | PASS | FAIL | INCONCLUSIVE; copied from latest ResultRecord on the order" }
      - { name: performed_by_technician_id, type: string, source: system, description: "FK -> Technician.id; set at start transition to the acting technician; segregation anchor" }
      - { name: certified_by_technician_id, type: string, source: system, description: "FK -> Technician.id; set at certify; must differ from performed_by_technician_id" }
      - { name: linked_deficiency_id, type: string, source: input, description: "FK -> Deficiency.id; marks this order as the re-test for that deficiency; must belong to same tank_system_id", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> SCHEDULED -> IN_PROGRESS -> UNDER_REVIEW -> CERTIFIED ; UNDER_REVIEW -> IN_PROGRESS (rework) ; REQUESTED/SCHEDULED -> CANCELLED" }

  - name: ResultRecord
    parent: ServiceOrder
    common_fields: false
    fields:
      - { name: service_order_id, type: string, source: system, description: "FK -> ServiceOrder.id; order this reading belongs to" }
      - { name: readings, type: object, source: input, description: "Type-specific measurements; tightness: {leak_rate_gph}; CP: {instant_off_mv, polarized_mv, native_mv, valid_contact, criterion}; LLD: {detects_simulated_leak}; spill/overfill: {visual_cracks_found, drain_test_hold_minutes, overfill_activates_pct}" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL | INCONCLUSIVE per calculations.test_result_determination / cp_survey_determination" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock timestamp when results were recorded" }

  - name: Deficiency
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: tank_system_id, type: string, source: system, description: "FK -> TankSystem.id; tank the deficiency is against" }
      - { name: component_id, type: string, source: system, description: "FK -> Component.id; set when the failed service order targeted a component; null for tank-level failures and sweep-created rows", constraints: "nullable" }
      - { name: source_service_order_id, type: string, source: system, description: "FK -> ServiceOrder.id; failing order for TEST_FAILURE origin; null for CLOSE_SWEEP origin", constraints: "nullable" }
      - { name: verified_by_service_order_id, type: string, source: system, description: "FK -> ServiceOrder.id; certifying re-test order that closed the deficiency; null until VERIFIED_CLOSED", constraints: "nullable" }
      - { name: origin, type: enum, source: system, description: "TEST_FAILURE | CLOSE_SWEEP" }
      - { name: period_month, type: string, source: system, description: "YYYY-MM of the missing release-detection record; set only for CLOSE_SWEEP origin (dedupe key with tank_system_id)", constraints: "nullable" }
      - { name: severity, type: enum, source: system, description: "CRITICAL (tank/line tightness FAIL) | MAJOR (CP, LLD, spill/overfill FAIL) | MINOR (sweep gap)" }
      - { name: description, type: string, source: system, description: "Human-readable deficiency summary" }
      - { name: correction_deadline, type: datetime, source: computed, description: "created_at + SEVERITY_DAYS[severity] (CRITICAL 7d, MAJOR 30d, MINOR 90d); fixed at creation" }
      - { name: escalated_at, type: datetime, source: system, description: "Set when the deficiency transitions to ESCALATED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN -> CORRECTION_ORDERED -> CORRECTED -> RE_TEST_SCHEDULED -> VERIFIED_CLOSED ; overdue -> ESCALATED -> CORRECTION_ORDERED ; RE_TEST_SCHEDULED -> CORRECTION_ORDERED (fail) / -> CORRECTED (cancel)" }

  - name: RegulatorySubmission
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: submission_type, type: enum, source: input, description: "MONTHLY_RELEASE_DETECTION | TEST_REPORT | RELEASE_NOTIFICATION" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM; required iff submission_type == MONTHLY_RELEASE_DETECTION", constraints: "conditionally required" }
      - { name: release_detection_record_ids, type: array, source: input, description: "FK list -> ReleaseDetectionRecord.id; required iff MONTHLY_RELEASE_DETECTION; all must belong to facility tanks and matching period_month", constraints: "conditionally required" }
      - { name: service_order_ids, type: array, source: input, description: "FK list -> ServiceOrder.id; required iff TEST_REPORT; all must be CERTIFIED and belong to facility", constraints: "conditionally required" }
      - { name: release_event_id, type: string, source: input, description: "FK -> ReleaseEvent.id; required iff RELEASE_NOTIFICATION; must belong to facility", constraints: "conditionally required" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submit transition; null while DRAFT", constraints: "nullable" }
      - { name: is_late, type: boolean, source: computed, description: "For MONTHLY_RELEASE_DETECTION: submitted_at > period due timestamp (10th of following month 23:59:59.999Z); false otherwise" }
      - { name: state_reviewer_note, type: string, source: system, description: "Note recorded by StateRegulator on reject", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACCEPTED | REJECTED ; REJECTED -> DRAFT (amend)" }

  - name: ReleaseDetectionRecord
    parent: TankSystem
    common_fields: true
    fields:
      - { name: tank_system_id, type: string, source: input, description: "FK -> TankSystem.id" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM; unique per tank_system_id" }
      - { name: method, type: enum, source: system, description: "Copied from tank release_detection_mode at creation: INTERSTITIAL_MONITORING | ATG_INVENTORY | MANUAL_GAUGING" }
      - { name: readings_summary, type: object, source: input, description: "Free-form monthly monitoring summary" }
      - { name: status, type: enum, source: system, description: "RECORDED -> SUBMITTED -> ACCEPTED ; SUBMITTED -> RECORDED (submission rejected)" }

  - name: OperatorPerson
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Operator display name" }
      - { name: operator_class, type: enum, source: input, description: "A | B | C" }
      - { name: status, type: enum, source: system, description: "DESIGNATED -> ACTIVE ; ACTIVE -> LAPSED (cert expired) ; LAPSED -> ACTIVE (new valid cert) ; DESIGNATED/ACTIVE/LAPSED -> REVOKED" }

  - name: TrainingRecord
    parent: OperatorPerson
    common_fields: false
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> OperatorPerson.id; trainee" }
      - { name: instructor_technician_id, type: string, source: system, description: "FK -> Technician.id; acting trainer from X-User-ID; must have trainer == true" }
      - { name: course_class, type: enum, source: input, description: "A | B | C; must equal the operator's operator_class" }
      - { name: completed_at, type: datetime, source: input, description: "Course completion timestamp; must be <= current clock" }
      - { name: expires_at, type: datetime, source: computed, description: "completed_at + VALIDITY_MONTHS[course_class] (A 36, B 36, C 12); valid iff current clock < expires_at" }

  - name: ReleaseEvent
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: tank_system_id, type: string, source: input, description: "FK -> TankSystem.id; source tank when known", constraints: "nullable" }
      - { name: discovered_at, type: datetime, source: input, description: "When the release was first suspected" }
      - { name: source_description, type: string, source: input, description: "Free-text description of the suspected source" }
      - { name: report_deadline, type: datetime, source: computed, description: "discovered_at + 24 hours" }
      - { name: reported_to_state_at, type: datetime, source: system, description: "Logical clock when StateRegulator confirms or dismisses; null until then", constraints: "nullable" }
      - { name: late_notification, type: boolean, source: computed, description: "true iff reported_to_state_at > report_deadline" }
      - { name: status, type: enum, source: system, description: "SUSPECTED -> CONFIRMED -> CLEANUP_IN_PROGRESS -> CLOSED ; SUSPECTED -> DISMISSED" }

  - name: StateFundClaim
    parent: Facility
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: release_event_id, type: string, source: input, description: "FK -> ReleaseEvent.id; must belong to same facility and be CONFIRMED, CLEANUP_IN_PROGRESS, or CLOSED" }
      - { name: expense_lines, type: array, source: input, description: "Cleanup expenses: [{description, amount_cents (integer > 0)}]; must be non-empty" }
      - { name: deductible_applied_cents, type: integer, source: computed, description: "Per calculations.fund_reimbursement_amount variant" }
      - { name: eligible_amount_cents, type: integer, source: computed, description: "sum(expense_lines) - deductible_applied_cents, floored at 0" }
      - { name: payable_amount_cents, type: integer, source: computed, description: "Variant-dependent gross payable BEFORE cap; cap enforced at submit" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Set by StateRegulator at adjudicate; equals payable on APPROVED, input value on PARTIALLY_APPROVED, 0 on DENIED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | PARTIALLY_APPROVED | DENIED ; DRAFT/SUBMITTED -> WITHDRAWN" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Facility
    initial_state: REGISTERED
    terminal_states: [CLOSED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: POST /facilities/{id}/activate
        actor: FacilityOwner
        preconditions:
          - "Caller owns the facility (X-User-ID == owner_account_id, ERR_NOT_RESOURCE_OWNER)"
          - "At least one TankSystem exists for the facility (ERR_NO_TANK_REGISTERED)"
        side_effects:
          - "Facility.version increments by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: POST /facilities/{id}/close
        actor: FacilityOwner
        preconditions:
          - "Caller owns the facility (ERR_NOT_RESOURCE_OWNER)"
          - "Every TankSystem of the facility is PERMANENTLY_CLOSED (ERR_TANKS_NOT_CLOSED)"
        side_effects:
          - "All ServiceOrders of the facility in REQUESTED or SCHEDULED -> CANCELLED; any such order with linked_deficiency_id in RE_TEST_SCHEDULED moves that Deficiency -> CORRECTED"
          - "All OperatorPersons of the facility in DESIGNATED/ACTIVE/LAPSED -> REVOKED"
          - "Facility.version increments by 1"

  - entity: TankSystem
    initial_state: REGISTERED
    terminal_states: [PERMANENTLY_CLOSED]
    transitions:
      - from: REGISTERED
        to: IN_SERVICE
        trigger: POST /tank-systems/{id}/place-in-service
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "Parent Facility.status == ACTIVE (ERR_FACILITY_NOT_ACTIVE)"
        side_effects:
          - "TankSystem.version increments by 1"
      - from: IN_SERVICE
        to: TEMPORARILY_CLOSED
        trigger: POST /tank-systems/{id}/close (closure_type=TEMPORARY) or system cascade (CRITICAL deficiency opened, or linked ReleaseEvent CONFIRMED)
        actor: FacilityOwner | system
        preconditions:
          - "Manual path: caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "All ServiceOrders on this tank in REQUESTED or SCHEDULED -> CANCELLED (release/CRITICAL-deficiency cascades only; manual close cancels too)"
          - "Each cancelled order with linked_deficiency_id whose Deficiency is RE_TEST_SCHEDULED moves that Deficiency -> CORRECTED"
          - "TankSystem.version increments by 1"
      - from: TEMPORARILY_CLOSED
        to: IN_SERVICE
        trigger: POST /tank-systems/{id}/return-to-service
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "No Deficiency on this tank with severity CRITICAL and status in {OPEN, CORRECTION_ORDERED, ESCALATED} (ERR_CRITICAL_DEFICIENCY_OPEN); CORRECTED and RE_TEST_SCHEDULED do not block (correction applied, verification pending)"
          - "No ReleaseEvent on this tank with status in {SUSPECTED, CONFIRMED, CLEANUP_IN_PROGRESS} (ERR_OPEN_RELEASE_ON_TANK)"
        side_effects:
          - "TankSystem.version increments by 1"
      - from: IN_SERVICE
        to: PERMANENTLY_CLOSED
        trigger: POST /tank-systems/{id}/close (closure_type=PERMANENT)
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "All Components of this tank in IN_SERVICE or DEFICIENT -> OUT_OF_SERVICE"
          - "All ServiceOrders on this tank in REQUESTED or SCHEDULED -> CANCELLED; linked RE_TEST_SCHEDULED Deficiencies -> CORRECTED"
          - "TankSystem.version increments by 1"
      - from: TEMPORARILY_CLOSED
        to: PERMANENTLY_CLOSED
        trigger: POST /tank-systems/{id}/close (closure_type=PERMANENT)
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Same cascades as IN_SERVICE -> PERMANENTLY_CLOSED"
          - "TankSystem.version increments by 1"

  - entity: Component
    initial_state: IN_SERVICE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: IN_SERVICE
        to: DEFICIENT
        trigger: "system (a Deficiency referencing this component is opened by a FAIL result)"
        actor: system
        preconditions: []
        side_effects:
          - "Component.version increments by 1"
      - from: DEFICIENT
        to: IN_SERVICE
        trigger: "system (the Deficiency referencing this component reaches VERIFIED_CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Component.version increments by 1"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system (parent TankSystem -> PERMANENTLY_CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Component.version increments by 1"
      - from: DEFICIENT
        to: OUT_OF_SERVICE
        trigger: "system (parent TankSystem -> PERMANENTLY_CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Component.version increments by 1"

  - entity: ServiceOrder
    initial_state: REQUESTED
    terminal_states: [CERTIFIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: POST /service-orders/{id}/schedule
        actor: ContractorAdmin
        preconditions:
          - "Order status == REQUESTED (ERR_ORDER_NOT_REQUESTED)"
          - "TankSystem.status == IN_SERVICE (ERR_TANK_NOT_IN_SERVICE)"
          - "Technician exists, is active, and holds the endorsement mapped from service_type (ERR_ENDORSEMENT_MISSING)"
          - "window_end > window_start (ERR_INVALID_WINDOW)"
          - "Technician has no SCHEDULED/IN_PROGRESS order whose [window_start, window_end) half-open interval overlaps the requested one; adjacency (end == start) is allowed (ERR_TECHNICIAN_DOUBLE_BOOKED)"
          - "For TANK_TIGHTNESS: no other TANK_TIGHTNESS order on the same tank in SCHEDULED/IN_PROGRESS/CERTIFIED whose window ends less than TANK_STABILIZATION_HOURS (8h) before the requested window_start, or starts less than 8h after the requested window_end (ERR_TANK_STABILIZATION_WINDOW)"
        side_effects:
          - "technician_id, window set on the order"
          - "If linked_deficiency_id set and that Deficiency status == CORRECTED: Deficiency -> RE_TEST_SCHEDULED"
          - "ServiceOrder.version increments by 1"
      - from: REQUESTED
        to: REQUESTED
        trigger: PUT /service-orders/{id}
        actor: ContractorAdmin
        preconditions:
          - "expected_service_order_version == current version (ERR_STALE_VERSION)"
          - "When line_items change: quote re-validated; when window/technician change on a SCHEDULED order, endorsement/overlap/buffer checks re-run"
        side_effects:
          - "quote_total_cents recomputed when line_items provided"
          - "ServiceOrder.version increments by 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: PUT /service-orders/{id}
        actor: ContractorAdmin
        preconditions:
          - "expected_service_order_version == current version (ERR_STALE_VERSION)"
          - "Endorsement/overlap/buffer checks re-run against the merged new values (ERR_ENDORSEMENT_MISSING, ERR_TECHNICIAN_DOUBLE_BOOKED, ERR_TANK_STABILIZATION_WINDOW, ERR_INVALID_WINDOW)"
        side_effects:
          - "quote_total_cents recomputed when line_items provided"
          - "ServiceOrder.version increments by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /service-orders/{id}/start
        actor: Technician
        preconditions:
          - "Order status == SCHEDULED (ERR_ORDER_NOT_SCHEDULED)"
          - "X-User-ID == technician_id on the order (ERR_NOT_RESOURCE_OWNER)"
          - "window_start <= current clock <= window_end (ERR_OUTSIDE_SERVICE_WINDOW)"
        side_effects:
          - "performed_by_technician_id = X-User-ID"
          - "ServiceOrder.version increments by 1"
      - from: IN_PROGRESS
        to: UNDER_REVIEW
        trigger: POST /service-orders/{id}/results
        actor: Technician
        preconditions:
          - "Order status == IN_PROGRESS (ERR_ORDER_NOT_IN_PROGRESS)"
          - "X-User-ID == performed_by_technician_id (ERR_NOT_RESOURCE_OWNER)"
          - "readings object conforms to the schema for service_type (ERR_INVALID_REQUEST)"
        side_effects:
          - "Create immutable ResultRecord with computed outcome (calculations.test_result_determination / cp_survey_determination)"
          - "result_outcome = outcome of the new ResultRecord"
          - "On outcome FAIL (service_type TANK_TIGHTNESS or LINE_TIGHTNESS): create Deficiency(severity CRITICAL, origin TEST_FAILURE, source_service_order_id = this order) AND create ReleaseEvent(SUSPECTED, discovered_at = now, tank_system_id = this tank); the new CRITICAL Deficiency then moves this TankSystem -> TEMPORARILY_CLOSED, which cancels this tank's REQUESTED/SCHEDULED orders (a linked re-test cancellation moves its Deficiency RE_TEST_SCHEDULED -> CORRECTED)"
          - "On outcome FAIL (service_type CP_SURVEY, LLD_FUNCTION, SPILL_OVERFILL_INSPECTION): create Deficiency(severity MAJOR, origin TEST_FAILURE); the referenced Component -> DEFICIENT"
          - "Suppression rule: when the order has linked_deficiency_id, a FAIL outcome creates NO new Deficiency and NO new ReleaseEvent — the linked Deficiency loops at certify time instead (RE_TEST_SCHEDULED -> CORRECTION_ORDERED on certified FAIL)"
          - "On any Deficiency creation: recompute Facility.posture_score and compliance_posture (calculations.compliance_posture_score)"
          - "ServiceOrder.version increments by 1"
      - from: UNDER_REVIEW
        to: CERTIFIED
        trigger: POST /service-orders/{id}/certify
        actor: ComplianceReviewer
        preconditions:
          - "Order status == UNDER_REVIEW (ERR_ORDER_NOT_UNDER_REVIEW)"
          - "X-User-ID != performed_by_technician_id (ERR_SELF_CERTIFICATION)"
        side_effects:
          - "certified_by_technician_id = X-User-ID"
          - "If linked_deficiency_id set and that Deficiency status == RE_TEST_SCHEDULED: outcome PASS -> Deficiency VERIFIED_CLOSED (verified_by_service_order_id = this order; referenced Component -> IN_SERVICE; Facility posture recomputed); outcome FAIL -> Deficiency CORRECTION_ORDERED; outcome INCONCLUSIVE -> Deficiency stays RE_TEST_SCHEDULED"
          - "ServiceOrder.version increments by 1"
      - from: UNDER_REVIEW
        to: IN_PROGRESS
        trigger: POST /service-orders/{id}/return-for-correction
        actor: ComplianceReviewer
        preconditions:
          - "Order status == UNDER_REVIEW (ERR_ORDER_NOT_UNDER_REVIEW)"
        side_effects:
          - "result_outcome stays as recorded; prior ResultRecords remain immutable"
          - "ServiceOrder.version increments by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: POST /service-orders/{id}/cancel or system cascade (tank closure, facility closure, release confirmation)
        actor: ContractorAdmin | system
        preconditions:
          - "Manual path: order status in {REQUESTED, SCHEDULED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If linked_deficiency_id set and that Deficiency status == RE_TEST_SCHEDULED: Deficiency -> CORRECTED"
          - "ServiceOrder.version increments by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /service-orders/{id}/cancel or system cascade
        actor: ContractorAdmin | system
        preconditions:
          - "Manual path: order status in {REQUESTED, SCHEDULED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If linked_deficiency_id set and that Deficiency status == RE_TEST_SCHEDULED: Deficiency -> CORRECTED"
          - "ServiceOrder.version increments by 1"

  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED]
    transitions:
      - from: OPEN
        to: CORRECTION_ORDERED
        trigger: POST /deficiencies/{id}/order-correction
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "Deficiency status in {OPEN, ESCALATED} (ERR_DEFICIENCY_NOT_OPEN)"
        side_effects:
          - "Deficiency.version increments by 1"
      - from: ESCALATED
        to: CORRECTION_ORDERED
        trigger: POST /deficiencies/{id}/order-correction
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "Deficiency status in {OPEN, ESCALATED} (ERR_DEFICIENCY_NOT_OPEN)"
        side_effects:
          - "Deficiency.version increments by 1"
      - from: CORRECTION_ORDERED
        to: CORRECTED
        trigger: POST /deficiencies/{id}/mark-corrected
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "Deficiency status == CORRECTION_ORDERED (ERR_DEFICIENCY_NOT_ORDERED)"
        side_effects:
          - "Deficiency.version increments by 1"
      - from: CORRECTED
        to: RE_TEST_SCHEDULED
        trigger: "system (a ServiceOrder with linked_deficiency_id == this deficiency is scheduled)"
        actor: system
        preconditions: []
        side_effects:
          - "Deficiency.version increments by 1"
      - from: RE_TEST_SCHEDULED
        to: VERIFIED_CLOSED
        trigger: "system (the linked ServiceOrder is CERTIFIED with outcome PASS)"
        actor: system
        preconditions: []
        side_effects:
          - "verified_by_service_order_id = certifying order"
          - "Referenced Component (if any) -> IN_SERVICE"
          - "Facility posture_score/compliance_posture recomputed (deficiency exits the open set)"
          - "Deficiency.version increments by 1"
      - from: RE_TEST_SCHEDULED
        to: CORRECTION_ORDERED
        trigger: "system (the linked ServiceOrder is CERTIFIED with outcome FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Facility posture_score recomputed"
          - "Deficiency.version increments by 1"
      - from: RE_TEST_SCHEDULED
        to: CORRECTED
        trigger: "system (the linked ServiceOrder is CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Deficiency.version increments by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "system (monthly close: current clock > correction_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "escalated_at = current clock"
          - "Facility posture_score recomputed (ESCALATED extra penalty)"
          - "Deficiency.version increments by 1"
      - from: CORRECTION_ORDERED
        to: ESCALATED
        trigger: "system (monthly close: current clock > correction_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "escalated_at = current clock; Facility posture_score recomputed"
          - "Deficiency.version increments by 1"
      - from: CORRECTED
        to: ESCALATED
        trigger: "system (monthly close: current clock > correction_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "escalated_at = current clock; Facility posture_score recomputed"
          - "Deficiency.version increments by 1"
      - from: RE_TEST_SCHEDULED
        to: ESCALATED
        trigger: "system (monthly close: current clock > correction_deadline)"
        actor: system
        preconditions: []
        side_effects:
          - "escalated_at = current clock; Facility posture_score recomputed"
          - "Deficiency.version increments by 1"

  - entity: RegulatorySubmission
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /submissions/{id}/submit
        actor: ComplianceReviewer
        preconditions:
          - "Submission status == DRAFT (ERR_SUBMISSION_NOT_DRAFT)"
        side_effects:
          - "submitted_at = current clock; is_late computed (monthly type: submitted_at > due timestamp of period_month)"
          - "Bundled ReleaseDetectionRecords -> SUBMITTED"
          - "RegulatorySubmission.version increments by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /submissions/{id}/accept
        actor: StateRegulator
        preconditions:
          - "Submission status == SUBMITTED (ERR_SUBMISSION_NOT_SUBMITTED)"
        side_effects:
          - "Bundled ReleaseDetectionRecords -> ACCEPTED"
          - "RegulatorySubmission.version increments by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /submissions/{id}/reject
        actor: StateRegulator
        preconditions:
          - "Submission status == SUBMITTED (ERR_SUBMISSION_NOT_SUBMITTED)"
        side_effects:
          - "state_reviewer_note = input note"
          - "Bundled ReleaseDetectionRecords -> RECORDED (compensation)"
          - "RegulatorySubmission.version increments by 1"
      - from: REJECTED
        to: DRAFT
        trigger: POST /submissions/{id}/amend
        actor: ComplianceReviewer
        preconditions:
          - "Submission status == REJECTED (ERR_SUBMISSION_NOT_REJECTED)"
          - "expected_submission_version == current version (ERR_STALE_VERSION)"
          - "Provided bundle fields re-validated against the same type rules as creation (ERR_BUNDLE_ITEM_MISMATCH, ERR_INVALID_REQUEST)"
        side_effects:
          - "Replaced bundle fields stored; submitted_at reset to null; is_late reset to false"
          - "RegulatorySubmission.version increments by 1"

  - entity: ReleaseDetectionRecord
    initial_state: RECORDED
    terminal_states: [ACCEPTED]
    transitions:
      - from: RECORDED
        to: SUBMITTED
        trigger: "system (record bundled into a MONTHLY_RELEASE_DETECTION submission that is submitted)"
        actor: system
        preconditions: []
        side_effects:
          - "ReleaseDetectionRecord.version increments by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system (parent submission ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "ReleaseDetectionRecord.version increments by 1"
      - from: SUBMITTED
        to: RECORDED
        trigger: "system (parent submission REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "ReleaseDetectionRecord.version increments by 1"

  - entity: OperatorPerson
    initial_state: DESIGNATED
    terminal_states: [REVOKED]
    transitions:
      - from: DESIGNATED
        to: ACTIVE
        trigger: POST /operators/{id}/activate
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "Operator status in {DESIGNATED, LAPSED} (ERR_OPERATOR_NOT_ACTIVATABLE)"
          - "A TrainingRecord exists for this operator with course_class == operator_class; the VALID one is selected as max completed_at, tie-break max created_at; if none exists ERR_TRAINING_MISSING; if the selected record has expires_at <= current clock ERR_TRAINING_EXPIRED"
        side_effects:
          - "Facility posture_score recomputed"
          - "OperatorPerson.version increments by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: POST /operators/{id}/activate
        actor: FacilityOwner
        preconditions:
          - "Same as DESIGNATED -> ACTIVE"
        side_effects:
          - "Facility posture_score recomputed"
          - "OperatorPerson.version increments by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "system (monthly close: selected latest TrainingRecord for the operator's class has expires_at <= current clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Facility posture_score recomputed (LAPSED penalty)"
          - "OperatorPerson.version increments by 1"
      - from: DESIGNATED
        to: REVOKED
        trigger: POST /operators/{id}/revoke or system (facility closure)
        actor: FacilityOwner | system
        preconditions:
          - "Manual path: caller owns the parent facility (ERR_NOT_RESOURCE_OWNER); status not already REVOKED (ERR_OPERATOR_NOT_ACTIVATABLE is not used here; revoking an ACTIVE/LAPSED/DESIGNATED operator always succeeds)"
        side_effects:
          - "Facility posture_score recomputed"
          - "OperatorPerson.version increments by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: POST /operators/{id}/revoke or system (facility closure)
        actor: FacilityOwner | system
        preconditions:
          - "Manual path: caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Facility posture_score recomputed"
          - "OperatorPerson.version increments by 1"
      - from: LAPSED
        to: REVOKED
        trigger: POST /operators/{id}/revoke or system (facility closure)
        actor: FacilityOwner | system
        preconditions:
          - "Manual path: caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Facility posture_score recomputed"
          - "OperatorPerson.version increments by 1"

  - entity: ReleaseEvent
    initial_state: SUSPECTED
    terminal_states: [DISMISSED, CLOSED]
    transitions:
      - from: SUSPECTED
        to: CONFIRMED
        trigger: POST /release-events/{id}/confirm
        actor: StateRegulator
        preconditions:
          - "ReleaseEvent status == SUSPECTED (ERR_RELEASE_NOT_SUSPECTED)"
        side_effects:
          - "reported_to_state_at = current clock; late_notification computed vs report_deadline"
          - "Linked TankSystem (if tank_system_id set and tank not PERMANENTLY_CLOSED) -> TEMPORARILY_CLOSED; that closure cancels the tank's REQUESTED/SCHEDULED ServiceOrders; each cancelled order with a linked RE_TEST_SCHEDULED Deficiency moves that Deficiency -> CORRECTED"
          - "Facility posture_score recomputed (CONFIRMED keeps the open-release penalty)"
          - "ReleaseEvent.version increments by 1"
      - from: SUSPECTED
        to: DISMISSED
        trigger: POST /release-events/{id}/dismiss
        actor: StateRegulator
        preconditions:
          - "ReleaseEvent status == SUSPECTED (ERR_RELEASE_NOT_SUSPECTED)"
        side_effects:
          - "reported_to_state_at = current clock; late_notification computed"
          - "Facility posture_score recomputed (release exits the open set)"
          - "ReleaseEvent.version increments by 1"
      - from: CONFIRMED
        to: CLEANUP_IN_PROGRESS
        trigger: POST /release-events/{id}/begin-cleanup
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "ReleaseEvent status == CONFIRMED (ERR_RELEASE_NOT_CONFIRMED)"
        side_effects:
          - "ReleaseEvent.version increments by 1"
      - from: CLEANUP_IN_PROGRESS
        to: CLOSED
        trigger: POST /release-events/{id}/close
        actor: StateRegulator
        preconditions:
          - "ReleaseEvent status == CLEANUP_IN_PROGRESS (ERR_RELEASE_NOT_CLEANUP)"
        side_effects:
          - "Facility posture_score recomputed (release exits the open set)"
          - "ReleaseEvent.version increments by 1"

  - entity: StateFundClaim
    initial_state: DRAFT
    terminal_states: [APPROVED, PARTIALLY_APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /fund-claims/{id}/submit
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "Claim status == DRAFT (ERR_CLAIM_NOT_DRAFT)"
          - "payable_amount_cents <= Facility.fund_cap_remaining_cents (ERR_FUND_CAP_EXCEEDED)"
        side_effects:
          - "Facility.fund_cap_remaining_cents -= payable_amount_cents (reservation)"
          - "StateFundClaim.version increments by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /fund-claims/{id}/withdraw
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "Claim status in {DRAFT, SUBMITTED} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects:
          - "StateFundClaim.version increments by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /fund-claims/{id}/withdraw
        actor: FacilityOwner
        preconditions:
          - "Caller owns the parent facility (ERR_NOT_RESOURCE_OWNER)"
          - "Claim status in {DRAFT, SUBMITTED} (ERR_CLAIM_NOT_WITHDRAWABLE)"
        side_effects:
          - "Facility.fund_cap_remaining_cents += payable_amount_cents (reservation released — compensating action)"
          - "StateFundClaim.version increments by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /fund-claims/{id}/adjudicate (decision=APPROVED)
        actor: StateRegulator
        preconditions:
          - "Claim status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "approved_amount_cents = payable_amount_cents (reservation consumed)"
          - "If facility election == AGGREGATE: fund_year_deductible_remaining_cents -= deductible_applied_cents"
          - "StateFundClaim.version increments by 1"
      - from: SUBMITTED
        to: PARTIALLY_APPROVED
        trigger: POST /fund-claims/{id}/adjudicate (decision=PARTIALLY_APPROVED, approved_amount_cents input)
        actor: StateRegulator
        preconditions:
          - "Claim status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "0 < approved_amount_cents < payable_amount_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "Facility.fund_cap_remaining_cents += (payable_amount_cents - approved_amount_cents) (unused reservation released)"
          - "If facility election == AGGREGATE: fund_year_deductible_remaining_cents -= deductible_applied_cents"
          - "StateFundClaim.version increments by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: POST /fund-claims/{id}/adjudicate (decision=DENIED)
        actor: StateRegulator
        preconditions:
          - "Claim status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "approved_amount_cents = 0"
          - "Facility.fund_cap_remaining_cents += payable_amount_cents (reservation released)"
          - "StateFundClaim.version increments by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-update-stale-version
    parent_entity: ServiceOrder
    write_endpoint: "PUT /service-orders/{id}"
    occ_field: expected_service_order_version
    description: |
      Updating a ServiceOrder (line items, window, technician) whose version
      has advanced since the client last observed it is rejected. This covers
      the case where another dispatcher has already edited the order and the
      current writer's view of the order is therefore stale; both edits are
      otherwise legitimate for an order in REQUESTED or SCHEDULED.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: submission-amend-stale-version
    parent_entity: RegulatorySubmission
    write_endpoint: "POST /submissions/{id}/amend"
    occ_field: expected_submission_version
    description: |
      Amending a REJECTED RegulatorySubmission whose version has advanced
      since the client last observed it is rejected; the client must re-read
      the submission (including any state_reviewer_note written later) and
      re-issue the amendment against the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: service_quote_total
    trigger: "ServiceOrder creation and any PUT /service-orders/{id} that supplies line_items"
    algorithm: aggregation
    formula: |
      For each line in line_items:
        line_cents = round_half_up(qty * unit_price_cents)   # per-line rounding FIRST
      subtotal = sum(line_cents over all lines)              # sum of already-rounded lines
      quote_total_cents = subtotal + MOBILIZATION_FLAT_CENTS
      Note: rounding per line then summing is the pinned order; summing exact
      products then rounding once yields different cents and is incorrect.
    input_set: "line_items of the ServiceOrder being created or updated"
    constants:
      MOBILIZATION_FLAT_CENTS: 15000
    precision: "integer cents; per-line round_half_up to 0 decimals, then integer sum"
    variants: []

  - name: test_result_determination
    trigger: "POST /service-orders/{id}/results for service_type TANK_TIGHTNESS, LINE_TIGHTNESS, LLD_FUNCTION, SPILL_OVERFILL_INSPECTION (CP_SURVEY uses cp_survey_determination)"
    algorithm: threshold
    formula: |
      TANK_TIGHTNESS / LINE_TIGHTNESS:
        PASS iff readings.leak_rate_gph <= TIGHTNESS_PASS_GPH (0.100); a reading
        of exactly 0.100 PASSES (inclusive bound); otherwise FAIL.
      LLD_FUNCTION:
        PASS iff readings.detects_simulated_leak == true; else FAIL.
      SPILL_OVERFILL_INSPECTION:
        PASS iff readings.visual_cracks_found == false
          AND readings.drain_test_hold_minutes >= SPILL_HOLD_MINUTES (5, inclusive)
          AND readings.overfill_activates_pct <= OVERFILL_MAX_PCT (95.0, inclusive);
        else FAIL.
      No type under this rule yields INCONCLUSIVE.
    input_set: "readings object of the ResultRecord being created"
    constants:
      TIGHTNESS_PASS_GPH: 0.100
      SPILL_HOLD_MINUTES: 5
      OVERFILL_MAX_PCT: 95.0
    precision: "leak_rate_gph compared at 3 decimal places; overfill_activates_pct at 1 decimal place"
    variants: []

  - name: cp_survey_determination
    trigger: "POST /service-orders/{id}/results for service_type CP_SURVEY"
    algorithm: threshold
    formula: |
      If readings.valid_contact == false: outcome = INCONCLUSIVE (voltages ignored).
      Otherwise apply the variant selected by readings.criterion:
        INSTANT_OFF: PASS iff readings.instant_off_mv <= -850 (at least 850 mV of
          cathodic polarization; exactly -850 PASSES).
        POLARIZATION_SHIFT: shift_mv = readings.native_mv - readings.polarized_mv;
          PASS iff shift_mv >= 100 (exactly 100 PASSES).
      Otherwise FAIL.
    input_set: "readings {instant_off_mv, polarized_mv, native_mv, valid_contact, criterion} of the ResultRecord"
    constants:
      INSTANT_OFF_THRESHOLD_MV: -850
      POLARIZATION_SHIFT_MIN_MV: 100
    precision: "integer millivolts"
    variants:
      - name: INSTANT_OFF
        when: "readings.criterion == INSTANT_OFF"
        difference: "pass criterion uses only instant_off_mv against the -850 mV bound"
      - name: POLARIZATION_SHIFT
        when: "readings.criterion == POLARIZATION_SHIFT"
        difference: "pass criterion uses native_mv - polarized_mv >= 100 mV formation shift; identical voltage triples can PASS here while FAILING under INSTANT_OFF"

  - name: test_schedule_projection
    trigger: "GET /tank-systems/{id}/test-schedule"
    algorithm: forward_looking
    formula: |
      For the tank, emit one item per applicable test_type:
        TANK_TIGHTNESS: required unless release_detection_mode == INTERSTITIAL_MONITORING;
          interval = 12 months if ATG_INVENTORY, 60 months if MANUAL_GAUGING.
        LINE_TIGHTNESS: required iff piping_type == PRESSURIZED; interval 12 months.
        LLD_FUNCTION: required iff a Component of type LINE_LEAK_DETECTOR exists on the tank; interval 12 months.
        CP_SURVEY: required iff a Component of type CATHODIC_PROTECTION exists on the tank; interval 36 months.
        SPILL_OVERFILL_INSPECTION: required iff a Component of type SPILL_BUCKET or OVERFILL_DEVICE exists; interval 36 months.
      due_at for each = (latest CERTIFIED ServiceOrder of that type on this tank,
        by window_end ASC tie-break created_at ASC).window_end + interval;
        if none, installed_on + interval.
      Items sorted by due_at ASC, tie-break test_type name ASC.
    input_set: "the TankSystem, its Components, and its CERTIFIED ServiceOrders"
    constants:
      ATG_TIGHTNESS_INTERVAL_MONTHS: 12
      MANUAL_GAUGING_TIGHTNESS_INTERVAL_MONTHS: 60
      LINE_TIGHTNESS_INTERVAL_MONTHS: 12
      LLD_FUNCTION_INTERVAL_MONTHS: 12
      CP_SURVEY_INTERVAL_MONTHS: 36
      SPILL_OVERFILL_INTERVAL_MONTHS: 36
    precision: "date arithmetic at whole-month granularity anchored to the source timestamp's day"
    variants: []

  - name: compliance_posture_score
    trigger: "Deficiency opened/verified/escalated/de-escalated, ReleaseEvent created/confirmed/dismissed/closed, OperatorPerson lapsed/activated/revoked, monthly close"
    algorithm: weighted_scoring
    formula: |
      score = 100
      For each Deficiency of the facility with status in {OPEN, CORRECTION_ORDERED, CORRECTED, RE_TEST_SCHEDULED, ESCALATED}:
        score -= SEVERITY_WEIGHT[severity]   # CRITICAL 25, MAJOR 15, MINOR 5
        if status == ESCALATED: score -= ESCALATED_EXTRA (5)
      For each ReleaseEvent of the facility with status in {SUSPECTED, CONFIRMED, CLEANUP_IN_PROGRESS}:
        score -= OPEN_RELEASE_WEIGHT (10)
      For each OperatorPerson of the facility with status == LAPSED:
        score -= LAPSED_OPERATOR_WEIGHT (5)
      score = min(100, max(0, score))          # floor/ceiling clamp
      compliance_posture = COMPLIANT if score >= 85, DEFICIENT if 60 <= score < 85,
        NON_COMPLIANT if score < 60.
    input_set: "all Deficiencies, ReleaseEvents, and OperatorPersons of the Facility (VERIFIED_CLOSED deficiencies and DISMISSED/CLOSED releases excluded)"
    constants:
      CRITICAL_WEIGHT: 25
      MAJOR_WEIGHT: 15
      MINOR_WEIGHT: 5
      ESCALATED_EXTRA: 5
      OPEN_RELEASE_WEIGHT: 10
      LAPSED_OPERATOR_WEIGHT: 5
      COMPLIANT_MIN: 85
      DEFICIENT_MIN: 60
    precision: "integer points"
    variants: []

  - name: deficiency_deadline
    trigger: "Deficiency creation"
    algorithm: threshold
    formula: |
      correction_deadline = created_at + SEVERITY_DAYS[severity] * 24h
      A deficiency whose current clock > correction_deadline and whose status is
      not VERIFIED_CLOSED is overdue and escalates at the next monthly close.
    input_set: "the Deficiency being created"
    constants:
      CRITICAL_DAYS: 7
      MAJOR_DAYS: 30
      MINOR_DAYS: 90
    precision: "timestamp comparison, strict >"
    variants: []

  - name: fund_reimbursement_amount
    trigger: "StateFundClaim creation (POST /fund-claims)"
    algorithm: waterfall_allocation
    formula: |
      Let S = sum(amount_cents over expense_lines).
      PER_OCCURRENCE variant (facility.fund_program_election == PER_OCCURRENCE):
        deductible_applied_cents = min(S, OCCURRENCE_DEDUCTIBLE_CENTS)
        eligible_amount_cents = max(0, S - deductible_applied_cents)
        payable_amount_cents = round_half_up(eligible_amount_cents * COINSURANCE_RATE)
      AGGREGATE variant (facility.fund_program_election == AGGREGATE):
        deductible_applied_cents = min(S, fund_year_deductible_remaining_cents)
        eligible_amount_cents = S - deductible_applied_cents
        payable_amount_cents = eligible_amount_cents      # 100% after aggregate deductible
      payable_amount_cents is the GROSS payable; the fund-year cap is enforced
      separately at submit time (ERR_FUND_CAP_EXCEEDED when payable > cap remaining).
    input_set: "expense_lines of the claim; facility election and fund_year_deductible_remaining_cents"
    constants:
      OCCURRENCE_DEDUCTIBLE_CENTS: 1000000
      AGGREGATE_YEAR_DEDUCTIBLE_CENTS: 2000000
      COINSURANCE_RATE: 0.90
      FUND_YEAR_CAP_CENTS: 100000000
    precision: "integer cents; single round_half_up on the coinsurance product"
    variants:
      - name: PER_OCCURRENCE
        when: "facility.fund_program_election == PER_OCCURRENCE"
        difference: "fixed per-occurrence deductible 1000000 then 90% coinsurance"
      - name: AGGREGATE
        when: "facility.fund_program_election == AGGREGATE"
        difference: "deductible drawn from a per-fund-year pool (starts 2000000, consumed on approval), then 100% payout; identical expense_lines yield a different payable than PER_OCCURRENCE"

  - name: training_certificate_expiry
    trigger: "TrainingRecord creation (computes expires_at); operator activate; monthly close lapse sweep"
    algorithm: threshold
    formula: |
      expires_at = completed_at + VALIDITY_MONTHS[course_class] months
      A record is VALID iff current clock < expires_at (strictly); at exactly
      expires_at the record is expired.
    input_set: "the TrainingRecord and the logical clock"
    constants:
      VALIDITY_MONTHS_A: 36
      VALIDITY_MONTHS_B: 36
      VALIDITY_MONTHS_C: 12
    precision: "timestamp comparison, strict <"
    variants: []

  - name: monthly_close_sweep
    trigger: "POST /facilities/{id}/run-monthly-close"
    algorithm: aggregation
    formula: |
      Requires current clock >= first instant of (period_month + 1 month) + 10 days,
      i.e. >= YYYY-(M+1)-11T00:00:00Z (ERR_CLOSE_TOO_EARLY otherwise); records for
      period_month are on time iff recorded while clock <= YYYY-(M+1)-10T23:59:59.999Z.
      Sweep, in pinned order:
        1. Missing records: for each TankSystem of the facility with status in
           {IN_SERVICE, TEMPORARILY_CLOSED} ordered by created_at ASC: if no
           ReleaseDetectionRecord exists with (tank_system_id, period_month),
           create Deficiency(origin CLOSE_SWEEP, severity MINOR, period_month,
           tank_system_id) unless one with the same (tank_system_id, origin,
           period_month) already exists (idempotent re-run).
        2. Operator lapse: each ACTIVE OperatorPerson whose latest TrainingRecord
           (max completed_at, tie-break max created_at) for their class has
           expires_at <= clock -> LAPSED.
        3. Escalation: each Deficiency of the facility with clock >
           correction_deadline and status in {OPEN, CORRECTION_ORDERED, CORRECTED,
           RE_TEST_SCHEDULED} -> ESCALATED.
        4. Recompute posture_score and compliance_posture once, after steps 1-3.
      Returns counts {deficiencies_created, operators_lapsed, deficiencies_escalated,
      posture_score, compliance_posture}.
    input_set: "Facility, its non-closed TankSystems, ReleaseDetectionRecords, OperatorPersons, Deficiencies; the logical clock"
    constants:
      RECORD_DUE_DAY_OF_NEXT_MONTH: 10
    precision: "whole-day boundary at 00:00:00Z on day 11 of the following month"
    variants: []

  - name: release_report_deadline
    trigger: "ReleaseEvent creation; confirm/dismiss"
    algorithm: threshold
    formula: |
      report_deadline = discovered_at + 24h
      On confirm or dismiss: reported_to_state_at = clock;
      late_notification = reported_to_state_at > report_deadline (strict).
    input_set: "the ReleaseEvent and the logical clock"
    constants:
      REPORT_WINDOW_HOURS: 24
    precision: "timestamp comparison, strict >"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The caller's role must be in the endpoint's roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership: FacilityOwner-gated operations require X-User-ID == the parent Facility.owner_account_id; Technician start/results require X-User-ID == the order's technician"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-gated facility/tank/deficiency/operator/release/fund endpoints; service-order start and results"

  - priority: 4
    category: existence
    check: "Path ids must exist (validated left-to-right); body FK references (facility_id, tank_system_id, component_id, technician_id, operator_id, release_event_id, linked_deficiency_id, bundled ids) must exist"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_TANK_SYSTEM_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_SERVICE_ORDER_NOT_FOUND | ERR_RESULT_RECORD_NOT_FOUND | ERR_DEFICIENCY_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_RECORD_NOT_FOUND | ERR_OPERATOR_NOT_FOUND | ERR_TRAINING_RECORD_NOT_FOUND | ERR_RELEASE_EVENT_NOT_FOUND | ERR_FUND_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for the requested transition (facility ACTIVE, tank IN_SERVICE, order/deficiency/submission/claim/release/operator from-state)"
    error_id: "ERR_FACILITY_NOT_ACTIVE | ERR_TANK_NOT_IN_SERVICE | ERR_ORDER_NOT_REQUESTED | ERR_ORDER_NOT_SCHEDULED | ERR_ORDER_NOT_IN_PROGRESS | ERR_ORDER_NOT_UNDER_REVIEW | ERR_ORDER_NOT_CANCELLABLE | ERR_ORDER_NOT_EDITABLE | ERR_DEFICIENCY_NOT_OPEN | ERR_DEFICIENCY_NOT_ORDERED | ERR_SUBMISSION_NOT_DRAFT | ERR_SUBMISSION_NOT_SUBMITTED | ERR_SUBMISSION_NOT_REJECTED | ERR_RELEASE_NOT_SUSPECTED | ERR_RELEASE_NOT_CONFIRMED | ERR_RELEASE_NOT_CLEANUP | ERR_CLAIM_NOT_DRAFT | ERR_CLAIM_NOT_SUBMITTED | ERR_CLAIM_NOT_WITHDRAWABLE | ERR_OPERATOR_NOT_ACTIVATABLE | ERR_TANKS_NOT_CLOSED | ERR_NO_TANK_REGISTERED"
    http_status: 409
    applies_to: "transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: certifying technician must differ from performed_by_technician_id"
    error_id: ERR_SELF_CERTIFICATION
    http_status: 403
    applies_to: "POST /service-orders/{id}/certify"

  - priority: 7
    category: business_safety
    check: "Technician must hold the endorsement mapped from service_type (TANK_TIGHTNESS/LINE_TIGHTNESS -> TIGHTNESS_TESTER, LLD_FUNCTION -> LLD_TESTER, CP_SURVEY -> CP_TESTER, SPILL_OVERFILL_INSPECTION -> INSPECTOR) and be active"
    error_id: ERR_ENDORSEMENT_MISSING
    http_status: 422
    applies_to: "POST /service-orders/{id}/schedule, PUT /service-orders/{id}"

  - priority: 8
    category: business_safety
    check: "Training issuance: instructor technician must have trainer == true; course_class must equal the operator's operator_class"
    error_id: "ERR_INSTRUCTOR_NOT_TRAINER | ERR_CLASS_MISMATCH"
    http_status: 422
    applies_to: "POST /training-records"

  - priority: 9
    category: business_safety
    check: "Posture gate: facility compliance_posture must not be NON_COMPLIANT to open a fund claim"
    error_id: ERR_FACILITY_POSTURE_BLOCKS_CLAIM
    http_status: 422
    applies_to: "POST /fund-claims"

  - priority: 10
    category: business_constraint
    check: "Uniqueness: tank_tag unique per facility; ReleaseDetectionRecord (tank_system_id, period_month) unique"
    error_id: "ERR_DUPLICATE_TANK_TAG | ERR_DUPLICATE_RECORD"
    http_status: 409
    applies_to: "POST /tank-systems, POST /release-detection-records"

  - priority: 11
    category: business_temporal
    check: "Window validity: window_end must be strictly after window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /service-orders/{id}/schedule, PUT /service-orders/{id}"

  - priority: 12
    category: business_temporal
    check: "Technician half-open overlap: no other SCHEDULED/IN_PROGRESS order for the technician whose [window_start, window_end) intersects; touching endpoints allowed"
    error_id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /service-orders/{id}/schedule, PUT /service-orders/{id}"

  - priority: 13
    category: business_temporal
    check: "Tank stabilization buffer: two TANK_TIGHTNESS orders on one tank must be separated by >= 8h between a prior order's window_end and the new window_start (and symmetrically); exactly 8h is allowed"
    error_id: ERR_TANK_STABILIZATION_WINDOW
    http_status: 409
    applies_to: "POST /service-orders/{id}/schedule, PUT /service-orders/{id}"

  - priority: 14
    category: business_temporal
    check: "Start gate: order may start only while window_start <= clock <= window_end"
    error_id: ERR_OUTSIDE_SERVICE_WINDOW
    http_status: 422
    applies_to: "POST /service-orders/{id}/start"

  - priority: 15
    category: business_temporal
    check: "Period rules: monthly close requires clock >= day 11 of the month after period_month; release-detection period_month must not be after the current clock's month; release-detection record creation requires the tank's status in {IN_SERVICE, TEMPORARILY_CLOSED}"
    error_id: "ERR_CLOSE_TOO_EARLY | ERR_FUTURE_PERIOD | ERR_TANK_NOT_IN_SERVICE"
    http_status: 422
    applies_to: "POST /facilities/{id}/run-monthly-close, POST /release-detection-records"

  - priority: 16
    category: business_temporal
    check: "Training validity at operator activate: a TrainingRecord for the class must exist (ERR_TRAINING_MISSING) and the selected latest record must have expires_at > clock (ERR_TRAINING_EXPIRED)"
    error_id: "ERR_TRAINING_MISSING | ERR_TRAINING_EXPIRED"
    http_status: 422
    applies_to: "POST /operators/{id}/activate"

  - priority: 17
    category: business_referential
    check: "Cross-references must align: tank belongs to facility (ERR_TANK_FACILITY_MISMATCH); component belongs to the order's tank and its type matches service_type, present iff CP_SURVEY/LLD_FUNCTION/SPILL_OVERFILL_INSPECTION (ERR_COMPONENT_MISMATCH); linked deficiency belongs to the same tank and has status in {OPEN, CORRECTION_ORDERED, CORRECTED} (ERR_DEFICIENCY_LINK_INVALID); submission bundle items belong to the facility and match type rules (ERR_BUNDLE_ITEM_MISMATCH); claim release belongs to the same facility (ERR_CLAIM_RELEASE_MISMATCH)"
    error_id: "ERR_TANK_FACILITY_MISMATCH | ERR_COMPONENT_MISMATCH | ERR_DEFICIENCY_LINK_INVALID | ERR_BUNDLE_ITEM_MISMATCH | ERR_CLAIM_RELEASE_MISMATCH"
    http_status: 422
    applies_to: "POST /service-orders, POST /submissions, POST /submissions/{id}/amend, POST /fund-claims"

  - priority: 18
    category: business_fiscal
    check: "Fund gates: claim creation requires release CONFIRMED/CLEANUP_IN_PROGRESS/CLOSED (ERR_CLAIM_RELEASE_NOT_CONFIRMED), annual_fee_paid_through >= clock (ERR_FEES_NOT_CURRENT), and payable_amount_cents <= fund_cap_remaining_cents (ERR_FUND_CAP_EXCEEDED, re-checked at submit)"
    error_id: "ERR_CLAIM_RELEASE_NOT_CONFIRMED | ERR_FEES_NOT_CURRENT | ERR_FUND_CAP_EXCEEDED"
    http_status: 402
    applies_to: "POST /fund-claims, POST /fund-claims/{id}/submit"

  - priority: 19
    category: business_constraint
    check: "OCC: expected_service_order_version / expected_submission_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /service-orders/{id}, POST /submissions/{id}/amend"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any call, the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ContractorAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Facility ---
  - method: POST
    path: "/facilities"
    description: "Register a facility; owner_account_id is set from the caller's X-User-ID"
    roles: [FacilityOwner]
    code: 201
    input: [facility_name, state_code, annual_fee_paid_through, "fund_program_election?"]
    output: Facility
    side_effects:
      - "status = REGISTERED; posture_score = 100; compliance_posture = COMPLIANT; fund_cap_remaining_cents = FUND_YEAR_CAP_CENTS; fund_year_deductible_remaining_cents = AGGREGATE_YEAR_DEDUCTIBLE_CENTS"

  - method: GET
    path: "/facilities"
    description: "List facilities"
    roles: [Any]
    code: 200
    input: ["state_code?", "owner_account_id?", "status?", "limit?", "offset?"]
    output: "Facility[]"
    side_effects: []

  - method: GET
    path: "/facilities/{id}"
    description: "Get one facility (posture fields are current as of the latest recompute)"
    roles: [Any]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/facilities/{id}/activate"
    description: "REGISTERED -> ACTIVE; requires at least one TankSystem"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: Facility
    side_effects: ["Facility.status -> ACTIVE; version increments by 1"]

  - method: POST
    path: "/facilities/{id}/close"
    description: "ACTIVE -> CLOSED; requires every tank PERMANENTLY_CLOSED"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: Facility
    side_effects:
      - "REQUESTED/SCHEDULED ServiceOrders of the facility -> CANCELLED (linked RE_TEST_SCHEDULED deficiencies -> CORRECTED)"
      - "OperatorPersons of the facility -> REVOKED"
      - "Facility.status -> CLOSED; version increments by 1"

  - method: POST
    path: "/facilities/{id}/run-monthly-close"
    description: "Ops-run checkpoint for one facility and period_month per calculations.monthly_close_sweep; requires facility status ACTIVE (ERR_FACILITY_NOT_ACTIVE)"
    roles: [ContractorAdmin]
    code: 200
    input: [period_month]
    output: { deficiencies_created: integer, operators_lapsed: integer, deficiencies_escalated: integer, posture_score: integer, compliance_posture: string }
    side_effects:
      - "Creates MINOR CLOSE_SWEEP deficiencies for missing release-detection records (idempotent per tank+period)"
      - "Lapses ACTIVE operators whose latest class cert is expired"
      - "Escalates overdue non-terminal deficiencies"
      - "Recomputes Facility.posture_score and compliance_posture"

  # --- TankSystem ---
  - method: POST
    path: "/tank-systems"
    description: "Register a tank system for a facility (MANUAL_GAUGING requires capacity_gallons <= 2000)"
    roles: [FacilityOwner]
    code: 201
    input: [facility_id, tank_tag, substance, capacity_gallons, installed_on, tank_construction, piping_type, release_detection_mode]
    output: TankSystem
    side_effects: ["status = REGISTERED"]

  - method: GET
    path: "/tank-systems"
    description: "List tank systems"
    roles: [Any]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: "TankSystem[]"
    side_effects: []

  - method: GET
    path: "/tank-systems/{id}"
    description: "Get one tank system"
    roles: [Any]
    code: 200
    input: []
    output: TankSystem
    side_effects: []

  - method: GET
    path: "/tank-systems/{id}/test-schedule"
    description: "Projected test due dates per calculations.test_schedule_projection"
    roles: [Any]
    code: 200
    input: []
    output: { tank_system_id: string, items: array }
    side_effects: []

  - method: POST
    path: "/tank-systems/{id}/place-in-service"
    description: "REGISTERED -> IN_SERVICE; facility must be ACTIVE"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: TankSystem
    side_effects: ["TankSystem.status -> IN_SERVICE; version increments by 1"]

  - method: POST
    path: "/tank-systems/{id}/close"
    description: "IN_SERVICE/TEMPORARILY_CLOSED -> TEMPORARILY_CLOSED (closure_type=TEMPORARY) or -> PERMANENTLY_CLOSED (closure_type=PERMANENT)"
    roles: [FacilityOwner]
    code: 200
    input: [closure_type]
    output: TankSystem
    side_effects:
      - "On TEMPORARY or PERMANENT: REQUESTED/SCHEDULED orders on the tank -> CANCELLED (linked RE_TEST_SCHEDULED deficiencies -> CORRECTED)"
      - "On PERMANENT: Components IN_SERVICE/DEFICIENT -> OUT_OF_SERVICE"
      - "TankSystem.version increments by 1"

  - method: POST
    path: "/tank-systems/{id}/return-to-service"
    description: "TEMPORARILY_CLOSED -> IN_SERVICE; blocked by open CRITICAL deficiency or open release on the tank"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: TankSystem
    side_effects: ["TankSystem.status -> IN_SERVICE; version increments by 1"]

  # --- Component ---
  - method: POST
    path: "/components"
    description: "Add a component (spill bucket, overfill device, LLD, cathodic protection) to a tank"
    roles: [FacilityOwner]
    code: 201
    input: [tank_system_id, component_type, install_date, serial_no]
    output: Component
    side_effects: ["status = IN_SERVICE"]

  - method: GET
    path: "/components"
    description: "List components"
    roles: [Any]
    code: 200
    input: ["tank_system_id?", "component_type?", "status?", "limit?", "offset?"]
    output: "Component[]"
    side_effects: []

  - method: GET
    path: "/components/{id}"
    description: "Get one component"
    roles: [Any]
    code: 200
    input: []
    output: Component
    side_effects: []

  # --- Technician ---
  - method: POST
    path: "/technicians"
    description: "Register a contractor technician with endorsements"
    roles: [ContractorAdmin]
    code: 201
    input: [full_name, endorsements, "trainer?"]
    output: Technician
    side_effects: ["active = true"]

  - method: GET
    path: "/technicians"
    description: "List technicians"
    roles: [Any]
    code: 200
    input: ["endorsement?", "active?", "limit?", "offset?"]
    output: "Technician[]"
    side_effects: []

  - method: GET
    path: "/technicians/{id}"
    description: "Get one technician"
    roles: [Any]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # --- ServiceOrder ---
  - method: POST
    path: "/service-orders"
    description: "Create a service order (quote_total_cents computed per calculations.service_quote_total)"
    roles: [ContractorAdmin]
    code: 201
    input: [facility_id, tank_system_id, service_type, line_items, "component_id?", "linked_deficiency_id?"]
    output: ServiceOrder
    side_effects:
      - "status = REQUESTED; result_outcome = NONE"
      - "quote_total_cents computed (round per line half-up, sum, add MOBILIZATION_FLAT_CENTS)"

  - method: GET
    path: "/service-orders"
    description: "List service orders"
    roles: [Any]
    code: 200
    input: ["facility_id?", "tank_system_id?", "component_id?", "technician_id?", "linked_deficiency_id?", "performed_by_technician_id?", "certified_by_technician_id?", "status?", "limit?", "offset?"]
    output: "ServiceOrder[]"
    side_effects: []

  - method: GET
    path: "/service-orders/{id}"
    description: "Get one service order"
    roles: [Any]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []

  - method: POST
    path: "/service-orders/{id}/schedule"
    description: "REQUESTED -> SCHEDULED; assigns technician and window; runs endorsement/overlap/buffer checks"
    roles: [ContractorAdmin]
    code: 200
    input: [technician_id, window_start, window_end]
    output: ServiceOrder
    side_effects:
      - "status -> SCHEDULED; technician_id and window stored"
      - "If linked_deficiency_id set and that Deficiency is CORRECTED: Deficiency -> RE_TEST_SCHEDULED"
      - "ServiceOrder.version increments by 1"

  - method: PUT
    path: "/service-orders/{id}"
    description: "Edit line_items/window/technician of a REQUESTED or SCHEDULED order (OCC on expected_service_order_version)"
    roles: [ContractorAdmin]
    code: 200
    input: [expected_service_order_version, "line_items?", "window_start?", "window_end?", "technician_id?"]
    output: ServiceOrder
    side_effects:
      - "quote_total_cents recomputed when line_items provided"
      - "Endorsement/overlap/buffer/window checks re-run against merged values"
      - "ServiceOrder.version increments by 1"

  - method: POST
    path: "/service-orders/{id}/start"
    description: "SCHEDULED -> IN_PROGRESS; only the assigned technician, inside the window"
    roles: [Technician]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["performed_by_technician_id = caller; status -> IN_PROGRESS; version increments by 1"]

  - method: POST
    path: "/service-orders/{id}/results"
    description: "IN_PROGRESS -> UNDER_REVIEW; creates an immutable ResultRecord with computed outcome and fires the FAIL cascades"
    roles: [Technician]
    code: 200
    input: [readings]
    output: ServiceOrder
    side_effects:
      - "ResultRecord created (outcome per test_result_determination / cp_survey_determination); result_outcome updated"
      - "Tightness FAIL: CRITICAL Deficiency + SUSPECTED ReleaseEvent created; tank -> TEMPORARILY_CLOSED with order-cancel cascade"
      - "Component-test FAIL: MAJOR Deficiency created; Component -> DEFICIENT"
      - "Facility posture recomputed on any Deficiency creation"
      - "ServiceOrder.version increments by 1"

  - method: POST
    path: "/service-orders/{id}/certify"
    description: "UNDER_REVIEW -> CERTIFIED; reviewer must differ from performer (segregation of duties)"
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: ServiceOrder
    side_effects:
      - "certified_by_technician_id = caller; status -> CERTIFIED"
      - "Linked re-test resolution: PASS -> Deficiency VERIFIED_CLOSED (Component restored, posture recomputed); FAIL -> Deficiency CORRECTION_ORDERED"
      - "ServiceOrder.version increments by 1"

  - method: POST
    path: "/service-orders/{id}/return-for-correction"
    description: "UNDER_REVIEW -> IN_PROGRESS (rework loop); prior ResultRecords remain immutable"
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status -> IN_PROGRESS; version increments by 1"]

  - method: POST
    path: "/service-orders/{id}/cancel"
    description: "REQUESTED/SCHEDULED -> CANCELLED"
    roles: [ContractorAdmin]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status -> CANCELLED; linked RE_TEST_SCHEDULED Deficiency -> CORRECTED; version increments by 1"]

  # --- ResultRecord ---
  - method: GET
    path: "/result-records"
    description: "List result records; list ordering is pinned to created_at ASC (oldest first) so multi-record rework history replays deterministically"
    roles: [Any]
    code: 200
    input: ["service_order_id?", "outcome?", "limit?", "offset?"]
    output: "ResultRecord[]"
    side_effects: []

  - method: GET
    path: "/result-records/{id}"
    description: "Get one result record"
    roles: [Any]
    code: 200
    input: []
    output: ResultRecord
    side_effects: []

  # --- Deficiency ---
  - method: GET
    path: "/deficiencies"
    description: "List deficiencies"
    roles: [Any]
    code: 200
    input: ["facility_id?", "tank_system_id?", "component_id?", "source_service_order_id?", "verified_by_service_order_id?", "status?", "severity?", "limit?", "offset?"]
    output: "Deficiency[]"
    side_effects: []

  - method: GET
    path: "/deficiencies/{id}"
    description: "Get one deficiency"
    roles: [Any]
    code: 200
    input: []
    output: Deficiency
    side_effects: []

  - method: POST
    path: "/deficiencies/{id}/order-correction"
    description: "OPEN/ESCALATED -> CORRECTION_ORDERED"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: Deficiency
    side_effects: ["status -> CORRECTION_ORDERED; version increments by 1"]

  - method: POST
    path: "/deficiencies/{id}/mark-corrected"
    description: "CORRECTION_ORDERED -> CORRECTED"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: Deficiency
    side_effects: ["status -> CORRECTED; version increments by 1"]

  # --- RegulatorySubmission ---
  - method: POST
    path: "/submissions"
    description: "Create a DRAFT regulatory submission with a type-specific bundle"
    roles: [ComplianceReviewer]
    code: 201
    input: [facility_id, submission_type, "period_month?", "release_detection_record_ids?", "service_order_ids?", "release_event_id?"]
    output: RegulatorySubmission
    side_effects: ["status = DRAFT; bundle references validated per type"]

  - method: GET
    path: "/submissions"
    description: "List submissions"
    roles: [Any]
    code: 200
    input: ["facility_id?", "submission_type?", "release_event_id?", "status?", "limit?", "offset?"]
    output: "RegulatorySubmission[]"
    side_effects: []

  - method: GET
    path: "/submissions/{id}"
    description: "Get one submission"
    roles: [Any]
    code: 200
    input: []
    output: RegulatorySubmission
    side_effects: []

  - method: POST
    path: "/submissions/{id}/submit"
    description: "DRAFT -> SUBMITTED; stamps submitted_at and computes is_late; bundled records -> SUBMITTED"
    roles: [ComplianceReviewer]
    code: 200
    input: []
    output: RegulatorySubmission
    side_effects: ["submitted_at = clock; is_late computed; bundled ReleaseDetectionRecords -> SUBMITTED; version increments by 1"]

  - method: POST
    path: "/submissions/{id}/accept"
    description: "SUBMITTED -> ACCEPTED; bundled records -> ACCEPTED"
    roles: [StateRegulator]
    code: 200
    input: []
    output: RegulatorySubmission
    side_effects: ["status -> ACCEPTED; bundled ReleaseDetectionRecords -> ACCEPTED; version increments by 1"]

  - method: POST
    path: "/submissions/{id}/reject"
    description: "SUBMITTED -> REJECTED with note; bundled records -> RECORDED"
    roles: [StateRegulator]
    code: 200
    input: [note]
    output: RegulatorySubmission
    side_effects: ["status -> REJECTED; state_reviewer_note stored; bundled ReleaseDetectionRecords -> RECORDED; version increments by 1"]

  - method: POST
    path: "/submissions/{id}/amend"
    description: "REJECTED -> DRAFT with replacement bundle fields (OCC on expected_submission_version)"
    roles: [ComplianceReviewer]
    code: 200
    input: [expected_submission_version, "period_month?", "release_detection_record_ids?", "service_order_ids?", "release_event_id?"]
    output: RegulatorySubmission
    side_effects: ["status -> DRAFT; submitted_at reset to null; is_late reset to false; version increments by 1"]

  # --- ReleaseDetectionRecord ---
  - method: POST
    path: "/release-detection-records"
    description: "Record a monthly release-detection record for a tank; unique per (tank, period_month)"
    roles: [FacilityOwner]
    code: 201
    input: [tank_system_id, period_month, readings_summary]
    output: ReleaseDetectionRecord
    side_effects: ["status = RECORDED; method copied from tank release_detection_mode"]

  - method: GET
    path: "/release-detection-records"
    description: "List release detection records"
    roles: [Any]
    code: 200
    input: ["tank_system_id?", "period_month?", "status?", "limit?", "offset?"]
    output: "ReleaseDetectionRecord[]"
    side_effects: []

  - method: GET
    path: "/release-detection-records/{id}"
    description: "Get one release detection record"
    roles: [Any]
    code: 200
    input: []
    output: ReleaseDetectionRecord
    side_effects: []

  # --- OperatorPerson ---
  - method: POST
    path: "/operators"
    description: "Designate a Class A/B/C operator for a facility"
    roles: [FacilityOwner]
    code: 201
    input: [facility_id, full_name, operator_class]
    output: OperatorPerson
    side_effects: ["status = DESIGNATED"]

  - method: GET
    path: "/operators"
    description: "List operators"
    roles: [Any]
    code: 200
    input: ["facility_id?", "operator_class?", "status?", "limit?", "offset?"]
    output: "OperatorPerson[]"
    side_effects: []

  - method: GET
    path: "/operators/{id}"
    description: "Get one operator"
    roles: [Any]
    code: 200
    input: []
    output: OperatorPerson
    side_effects: []

  - method: POST
    path: "/operators/{id}/activate"
    description: "DESIGNATED/LAPSED -> ACTIVE; requires a valid (unexpired) TrainingRecord for the operator's class"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: OperatorPerson
    side_effects: ["status -> ACTIVE; Facility posture recomputed; version increments by 1"]

  - method: POST
    path: "/operators/{id}/revoke"
    description: "DESIGNATED/ACTIVE/LAPSED -> REVOKED (terminal)"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: OperatorPerson
    side_effects: ["status -> REVOKED; Facility posture recomputed; version increments by 1"]

  # --- TrainingRecord ---
  - method: POST
    path: "/training-records"
    description: "Issue a training certificate to an operator; instructor is the calling trainer Technician"
    roles: [Technician]
    code: 201
    input: [operator_id, course_class, completed_at]
    output: TrainingRecord
    side_effects: ["instructor_technician_id = caller; expires_at computed per calculations.training_certificate_expiry"]

  - method: GET
    path: "/training-records"
    description: "List training records"
    roles: [Any]
    code: 200
    input: ["operator_id?", "instructor_technician_id?", "course_class?", "limit?", "offset?"]
    output: "TrainingRecord[]"
    side_effects: []

  - method: GET
    path: "/training-records/{id}"
    description: "Get one training record"
    roles: [Any]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []

  # --- ReleaseEvent ---
  - method: POST
    path: "/release-events"
    description: "Report a suspected release; report_deadline = discovered_at + 24h"
    roles: [FacilityOwner]
    code: 201
    input: [facility_id, "tank_system_id?", discovered_at, source_description]
    output: ReleaseEvent
    side_effects: ["status = SUSPECTED; report_deadline computed; Facility posture recomputed"]

  - method: GET
    path: "/release-events"
    description: "List release events"
    roles: [Any]
    code: 200
    input: ["facility_id?", "tank_system_id?", "status?", "limit?", "offset?"]
    output: "ReleaseEvent[]"
    side_effects: []

  - method: GET
    path: "/release-events/{id}"
    description: "Get one release event"
    roles: [Any]
    code: 200
    input: []
    output: ReleaseEvent
    side_effects: []

  - method: POST
    path: "/release-events/{id}/confirm"
    description: "SUSPECTED -> CONFIRMED; cascades: tank TEMPORARILY_CLOSED -> scheduled orders CANCELLED -> linked re-test deficiencies CORRECTED"
    roles: [StateRegulator]
    code: 200
    input: []
    output: ReleaseEvent
    side_effects:
      - "reported_to_state_at = clock; late_notification computed"
      - "Linked TankSystem -> TEMPORARILY_CLOSED; its REQUESTED/SCHEDULED ServiceOrders -> CANCELLED; their linked RE_TEST_SCHEDULED Deficiencies -> CORRECTED"
      - "Facility posture recomputed; version increments by 1"

  - method: POST
    path: "/release-events/{id}/dismiss"
    description: "SUSPECTED -> DISMISSED"
    roles: [StateRegulator]
    code: 200
    input: []
    output: ReleaseEvent
    side_effects: ["reported_to_state_at = clock; late_notification computed; Facility posture recomputed; version increments by 1"]

  - method: POST
    path: "/release-events/{id}/begin-cleanup"
    description: "CONFIRMED -> CLEANUP_IN_PROGRESS"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: ReleaseEvent
    side_effects: ["status -> CLEANUP_IN_PROGRESS; version increments by 1"]

  - method: POST
    path: "/release-events/{id}/close"
    description: "CLEANUP_IN_PROGRESS -> CLOSED"
    roles: [StateRegulator]
    code: 200
    input: []
    output: ReleaseEvent
    side_effects: ["status -> CLOSED; Facility posture recomputed; version increments by 1"]

  # --- StateFundClaim ---
  - method: POST
    path: "/fund-claims"
    description: "Create a DRAFT state fund claim against a confirmed release; computes deductible/eligible/payable per facility election"
    roles: [FacilityOwner]
    code: 201
    input: [facility_id, release_event_id, expense_lines]
    output: StateFundClaim
    side_effects: ["deductible_applied_cents, eligible_amount_cents, payable_amount_cents computed per calculations.fund_reimbursement_amount; status = DRAFT"]

  - method: GET
    path: "/fund-claims"
    description: "List fund claims"
    roles: [Any]
    code: 200
    input: ["facility_id?", "release_event_id?", "status?", "limit?", "offset?"]
    output: "StateFundClaim[]"
    side_effects: []

  - method: GET
    path: "/fund-claims/{id}"
    description: "Get one fund claim"
    roles: [Any]
    code: 200
    input: []
    output: StateFundClaim
    side_effects: []

  - method: POST
    path: "/fund-claims/{id}/submit"
    description: "DRAFT -> SUBMITTED; reserves payable_amount_cents against the facility fund-year cap"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: StateFundClaim
    side_effects: ["Facility.fund_cap_remaining_cents -= payable_amount_cents; version increments by 1"]

  - method: POST
    path: "/fund-claims/{id}/withdraw"
    description: "DRAFT/SUBMITTED -> WITHDRAWN; releases any reservation"
    roles: [FacilityOwner]
    code: 200
    input: []
    output: StateFundClaim
    side_effects: ["If was SUBMITTED: Facility.fund_cap_remaining_cents += payable_amount_cents; version increments by 1"]

  - method: POST
    path: "/fund-claims/{id}/adjudicate"
    description: "SUBMITTED -> APPROVED | PARTIALLY_APPROVED | DENIED"
    roles: [StateRegulator]
    code: 200
    input: [decision, "approved_amount_cents?"]
    output: StateFundClaim
    side_effects:
      - "APPROVED: approved_amount_cents = payable_amount_cents; reservation consumed"
      - "PARTIALLY_APPROVED: cap remaining += (payable - approved_amount_cents)"
      - "DENIED: approved_amount_cents = 0; cap remaining += payable_amount_cents"
      - "AGGREGATE election: fund_year_deductible_remaining_cents -= deductible_applied_cents on APPROVED/PARTIALLY_APPROVED"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, malformed value, bad enum, bad month format, empty expense_lines, or type-incompatible readings object" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller's role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "FacilityOwner does not own the facility, or technician is not the order's assigned/performed technician" }
  - { id: ERR_SELF_CERTIFICATION, http: 403, condition: "Certifying technician equals performed_by_technician_id" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id not found" }
  - { id: ERR_TANK_SYSTEM_NOT_FOUND, http: 404, condition: "TankSystem id not found" }
  - { id: ERR_COMPONENT_NOT_FOUND, http: 404, condition: "Component id not found" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id not found" }
  - { id: ERR_SERVICE_ORDER_NOT_FOUND, http: 404, condition: "ServiceOrder id not found" }
  - { id: ERR_RESULT_RECORD_NOT_FOUND, http: 404, condition: "ResultRecord id not found" }
  - { id: ERR_DEFICIENCY_NOT_FOUND, http: 404, condition: "Deficiency id not found" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "RegulatorySubmission id not found" }
  - { id: ERR_RECORD_NOT_FOUND, http: 404, condition: "ReleaseDetectionRecord id not found" }
  - { id: ERR_OPERATOR_NOT_FOUND, http: 404, condition: "OperatorPerson id not found" }
  - { id: ERR_TRAINING_RECORD_NOT_FOUND, http: 404, condition: "TrainingRecord id not found" }
  - { id: ERR_RELEASE_EVENT_NOT_FOUND, http: 404, condition: "ReleaseEvent id not found" }
  - { id: ERR_FUND_CLAIM_NOT_FOUND, http: 404, condition: "StateFundClaim id not found" }
  - { id: ERR_FACILITY_NOT_ACTIVE, http: 409, condition: "Operation requires facility status ACTIVE" }
  - { id: ERR_NO_TANK_REGISTERED, http: 409, condition: "Facility activation requires at least one TankSystem" }
  - { id: ERR_TANKS_NOT_CLOSED, http: 409, condition: "Facility closure requires all tanks PERMANENTLY_CLOSED" }
  - { id: ERR_TANK_NOT_IN_SERVICE, http: 409, condition: "Operation requires tank status IN_SERVICE (schedule), or tank is PERMANENTLY_CLOSED (record creation)" }
  - { id: ERR_ORDER_NOT_REQUESTED, http: 409, condition: "Schedule requires order status REQUESTED" }
  - { id: ERR_ORDER_NOT_SCHEDULED, http: 409, condition: "Start requires order status SCHEDULED" }
  - { id: ERR_ORDER_NOT_IN_PROGRESS, http: 409, condition: "Results require order status IN_PROGRESS" }
  - { id: ERR_ORDER_NOT_UNDER_REVIEW, http: 409, condition: "Certify/return-for-correction require order status UNDER_REVIEW" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires order status REQUESTED or SCHEDULED" }
  - { id: ERR_ORDER_NOT_EDITABLE, http: 409, condition: "PUT requires order status REQUESTED or SCHEDULED" }
  - { id: ERR_DEFICIENCY_NOT_OPEN, http: 409, condition: "order-correction requires deficiency status OPEN or ESCALATED" }
  - { id: ERR_DEFICIENCY_NOT_ORDERED, http: 409, condition: "mark-corrected requires deficiency status CORRECTION_ORDERED" }
  - { id: ERR_SUBMISSION_NOT_DRAFT, http: 409, condition: "submit requires submission status DRAFT" }
  - { id: ERR_SUBMISSION_NOT_SUBMITTED, http: 409, condition: "accept/reject require submission status SUBMITTED" }
  - { id: ERR_SUBMISSION_NOT_REJECTED, http: 409, condition: "amend requires submission status REJECTED" }
  - { id: ERR_RELEASE_NOT_SUSPECTED, http: 409, condition: "confirm/dismiss require release status SUSPECTED" }
  - { id: ERR_RELEASE_NOT_CONFIRMED, http: 409, condition: "begin-cleanup requires release status CONFIRMED" }
  - { id: ERR_RELEASE_NOT_CLEANUP, http: 409, condition: "close requires release status CLEANUP_IN_PROGRESS" }
  - { id: ERR_CLAIM_NOT_DRAFT, http: 409, condition: "submit requires claim status DRAFT" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "adjudicate requires claim status SUBMITTED" }
  - { id: ERR_CLAIM_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires claim status DRAFT or SUBMITTED" }
  - { id: ERR_OPERATOR_NOT_ACTIVATABLE, http: 409, condition: "activate requires operator status DESIGNATED or LAPSED" }
  - { id: ERR_CRITICAL_DEFICIENCY_OPEN, http: 409, condition: "return-to-service blocked by an open CRITICAL deficiency on the tank" }
  - { id: ERR_OPEN_RELEASE_ON_TANK, http: 409, condition: "return-to-service blocked by a SUSPECTED/CONFIRMED/CLEANUP_IN_PROGRESS release on the tank" }
  - { id: ERR_DUPLICATE_TANK_TAG, http: 409, condition: "tank_tag already exists within the facility" }
  - { id: ERR_DUPLICATE_RECORD, http: 409, condition: "A ReleaseDetectionRecord already exists for (tank_system_id, period_month)" }
  - { id: ERR_TECHNICIAN_DOUBLE_BOOKED, http: 409, condition: "Technician has a SCHEDULED/IN_PROGRESS order whose half-open window intersects the requested window" }
  - { id: ERR_TANK_STABILIZATION_WINDOW, http: 409, condition: "A TANK_TIGHTNESS order on the same tank sits within the 8h stabilization buffer of the requested window" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end must be strictly after window_start" }
  - { id: ERR_OUTSIDE_SERVICE_WINDOW, http: 422, condition: "Order start outside [window_start, window_end]" }
  - { id: ERR_CLOSE_TOO_EARLY, http: 422, condition: "Monthly close for period_month requires clock >= day 11 of the following month" }
  - { id: ERR_FUTURE_PERIOD, http: 422, condition: "period_month is after the current clock's month" }
  - { id: ERR_ENDORSEMENT_MISSING, http: 422, condition: "Technician lacks the endorsement mapped from service_type or is inactive" }
  - { id: ERR_INSTRUCTOR_NOT_TRAINER, http: 422, condition: "Issuing technician has trainer == false" }
  - { id: ERR_CLASS_MISMATCH, http: 422, condition: "course_class differs from the operator's operator_class" }
  - { id: ERR_TRAINING_MISSING, http: 422, condition: "No TrainingRecord exists for the operator's class" }
  - { id: ERR_TRAINING_EXPIRED, http: 422, condition: "Latest class TrainingRecord has expires_at <= clock" }
  - { id: ERR_MODE_NOT_ALLOWED_FOR_CAPACITY, http: 422, condition: "MANUAL_GAUGING release detection requires capacity_gallons <= 2000" }
  - { id: ERR_TANK_FACILITY_MISMATCH, http: 422, condition: "tank_system_id does not belong to the referenced facility" }
  - { id: ERR_COMPONENT_MISMATCH, http: 422, condition: "component_id missing for component-level service types, present for tightness types, not on the order's tank, or wrong component_type for the service_type" }
  - { id: ERR_DEFICIENCY_LINK_INVALID, http: 422, condition: "linked_deficiency_id belongs to a different tank or its status is not OPEN/CORRECTION_ORDERED/CORRECTED" }
  - { id: ERR_BUNDLE_ITEM_MISMATCH, http: 422, condition: "Submission bundle missing for its type, contains items of another facility, or items in the wrong state (e.g., non-CERTIFIED orders, wrong period)" }
  - { id: ERR_CLAIM_RELEASE_MISMATCH, http: 422, condition: "release_event_id belongs to a different facility" }
  - { id: ERR_CLAIM_RELEASE_NOT_CONFIRMED, http: 402, condition: "Fund claim requires release status CONFIRMED, CLEANUP_IN_PROGRESS, or CLOSED" }
  - { id: ERR_FEES_NOT_CURRENT, http: 402, condition: "annual_fee_paid_through is before the current clock" }
  - { id: ERR_FUND_CAP_EXCEEDED, http: 402, condition: "payable_amount_cents exceeds facility fund_cap_remaining_cents" }
  - { id: ERR_FACILITY_POSTURE_BLOCKS_CLAIM, http: 422, condition: "Facility compliance_posture is NON_COMPLIANT" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FacilityOwner
    description: "UST owner/operator organization; owns its facilities and drives tank registration, corrections, operator designation, monthly records, release reporting, and fund claims"
    identity: opaque
    exclusive_operations:
      - "POST /facilities"
      - "POST /facilities/{id}/activate, POST /facilities/{id}/close"
      - "POST /tank-systems, POST /tank-systems/{id}/place-in-service, POST /tank-systems/{id}/close, POST /tank-systems/{id}/return-to-service"
      - "POST /components"
      - "POST /deficiencies/{id}/order-correction, POST /deficiencies/{id}/mark-corrected"
      - "POST /release-detection-records"
      - "POST /operators, POST /operators/{id}/activate, POST /operators/{id}/revoke"
      - "POST /release-events, POST /release-events/{id}/begin-cleanup"
      - "POST /fund-claims, POST /fund-claims/{id}/submit, POST /fund-claims/{id}/withdraw"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: ContractorAdmin
    description: "Testing contractor back office; registers technicians, dispatches and edits service orders, runs monthly close checkpoints, manages the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /technicians"
      - "POST /service-orders, POST /service-orders/{id}/schedule, PUT /service-orders/{id}, POST /service-orders/{id}/cancel"
      - "POST /facilities/{id}/run-monthly-close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: Technician
    description: "Field tester; starts assigned orders inside their window and records test readings; trainer-endorsed technicians issue operator training certificates"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /service-orders/{id}/start (as assigned technician)"
      - "POST /service-orders/{id}/results (as performing technician)"
      - "POST /training-records (requires trainer == true)"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: ComplianceReviewer
    description: "QA/certifying officer of the contractor; certifies or returns reviewed orders (never their own field work), and files regulatory submissions"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /service-orders/{id}/certify (must differ from performer)"
      - "POST /service-orders/{id}/return-for-correction"
      - "POST /submissions, POST /submissions/{id}/submit, POST /submissions/{id}/amend"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: StateRegulator
    description: "State UST program authority; accepts/rejects submissions, confirms/dismisses/closes releases, adjudicates fund claims"
    identity: opaque
    exclusive_operations:
      - "POST /submissions/{id}/accept, POST /submissions/{id}/reject"
      - "POST /release-events/{id}/confirm, POST /release-events/{id}/dismiss, POST /release-events/{id}/close"
      - "POST /fund-claims/{id}/adjudicate"
    shared_operations:
      - "All GET list/detail endpoints"

  - name: Any
    description: "Read-only access shared by every authenticated role"
    identity: opaque
    shared_operations:
      - "All GET list/detail endpoints"
