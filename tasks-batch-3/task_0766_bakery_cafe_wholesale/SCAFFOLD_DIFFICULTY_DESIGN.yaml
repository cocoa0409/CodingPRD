              as: Manager
              captures: { route_id: $.data.id }
            - call: "POST /delivery-routes/${route_id}/stops"
              payload: { delivery_order_id: "${order_id}", sequence: 1, arrival_window_start: "2026-06-12T08:00:00Z", arrival_window_end: "2026-06-12T09:00:00Z" }
