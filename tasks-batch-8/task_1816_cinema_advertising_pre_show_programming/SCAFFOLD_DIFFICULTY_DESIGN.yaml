          trigger:
            - { call: "POST /network/invoices/${inv_id}/certify", payload: {}, as: Auditor, as_user_id: "aud-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /network/attendance-reports/${ar_id}/review", payload: { decision: ACCEPT }, as: NetworkOps }
            - { call: "POST /network/invoices/${inv_id}/certify", payload: {}, as: Auditor, as_user_id: "aud-1", captures: { audit_after: "$.data.audit_status" } }
