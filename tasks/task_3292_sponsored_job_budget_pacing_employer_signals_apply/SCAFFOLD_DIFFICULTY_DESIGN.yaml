            - "link 3: PacingHold.${hold_ch1}.status == RELEASED and PacingHold.${hold_ch2}.status == RELEASED"
            - "Campaign.${camp_ch}.held_cents == 0 after the holds released"

      - name: employer_suspension_cascade_reaches_postings_campaigns_and_holds
        grounds:
          - state_machines.Employer.ACTIVE_to_SUSPENDED
          - state_machines.JobPosting.ACTIVE_to_SUSPENDED
          - state_machines.SponsoredJob.ELIGIBLE_to_PAUSED
        distinguishing_aspect: "A depth-3 chain from the fraud-suspension transition: including the employer (link 1), its postings move to SUSPENDED and its campaign to PAUSED (link 2), and those transitions pause the sponsored jobs (link 3), which releases their ACTIVE pacing holds (link 4)."
