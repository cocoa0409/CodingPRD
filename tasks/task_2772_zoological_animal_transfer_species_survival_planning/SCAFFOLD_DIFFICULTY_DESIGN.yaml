  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: accept_gated_on_receiving_institution_accreditation
        grounds:
          - validations[priority=60, error_id=ERR_INSTITUTION_NOT_ACCREDITED]
          - state_machines.TransferAgreement.OFFERED_to_ACCEPTED
          - state_machines.Institution.ACCREDITED_to_SUSPENDED
          - endpoints[PATCH /institutions/{institutionId}]
          - errors[ERR_INSTITUTION_NOT_ACCREDITED]
        distinguishing_aspect: |
          The gate lives on a third entity that the agreement only references: an OFFERED agreement
          whose own fields are all valid cannot be accepted while the RECEIVING Institution sits in
          SUSPENDED, and the very same call succeeds once the accreditation body restores that
          institution. Nothing about the agreement row changes between the two attempts.
        test_recipe:
          setup:
            - "Clock left at its 2026-08-01T00:00:00Z default."
            - "Base fixture through an endorsed recommendation and an OFFERED agreement on M1."
            - "Harbor Bay Zoo, the receiving institution, is then patched to SUSPENDED."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
