              captures: { est_b_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_b_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_hi_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/dispatch-assignments/${asg_b_id}/confirm"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "confirm response status code == 409"
            - "confirm response data.error_id == ERR_SKILL_INSUFFICIENT"
            - "confirm response data.error_id != ERR_TECH_DOUBLE_BOOKED"

