  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_safety_beats_state_on_self_qa_fail_after_resolution
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_SOD_SELF_REVIEW]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          Pair business_safety (p6) vs state (p8): a qa_fail call where the
          acting user == complaint.owner_user_id AND the complaint is in
          RESOLVED (wrong from-state) MUST surface ERR_SOD_SELF_REVIEW —
          the safety category outranks the state check.
        test_recipe:
          setup:
            - "Complaint created by user_intake_4 and fully RESOLVED; an OPEN QualityReview held by reviewer user_qa_4 is not required for the negative path — the SoD check fires first regardless"
            - "Acting QAReviewer uses X-User-ID == complaint.owner_user_id"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "DD-PLUS", display_name: "Direct Deposit Plus" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "SVC.DIRECT_DEPOSIT" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CUST-601", channel_code: "WEB", product_code: "DD-PLUS", category_code: "SVC.DIRECT_DEPOSIT", narrative: "DD posting delay" }
              as: CaseHandler
              as_user_id: "user_dual_1"
              captures: { c9_id: $.data.id }
            - call: "POST /complaint-office/complaints/${c9_id}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c9_id}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c9_id}/rcas"
              payload: { verdict: "NOT_SUBSTANTIATED", linked_product_code: "DD-PLUS", process_step: "ACH_POST" }
              as: CaseHandler
              captures: { rca9_id: $.data.id }
            - call: "POST /complaint-office/rcas/${rca9_id}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c9_id}/draft_response"
              payload: { response_text: "Explained posting schedule." }
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c9_id}/submit_for_qa"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${c9_id}/quality-reviews"
              payload: { window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-09T00:00:00Z" }
              as: QAReviewer
              as_user_id: "user_qa_4"
              captures: { qr9_id: $.data.id }
            - call: "POST /complaint-office/quality-reviews/${qr9_id}/complete"
              payload: { outcome: "PASS" }
              as: QAReviewer
              as_user_id: "user_qa_4"
            - call: "POST /complaint-office/complaints/${c9_id}/resolve"
              payload: {}
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/complaints/${c9_id}/qa_fail"
              payload: {}
              as: QAReviewer
              as_user_id: "user_dual_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_SOD_SELF_REVIEW"
            - "response error_id != ERR_INVALID_STATE_TRANSITION"
            - "Complaint.${c9_id}.status == RESOLVED (unchanged)"

      - name: referential_template_beats_constraint_rca_on_draft_response
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - errors[ERR_TEMPLATE_NOT_ACTIVE]
          - errors[ERR_RCA_REQUIRED]
        distinguishing_aspect: |
          Pair business_referential (p10) vs business_constraint (p15) — a
          different category pair from instance 1's safety-vs-state: a
          draft_response call on an INVESTIGATING complaint that has NO
          completed RCA (violates p15) AND carries a response_template_key
          whose template is still DRAFT (violates p10) MUST surface
          ERR_TEMPLATE_NOT_ACTIVE because referential integrity outranks the
          workflow constraint in §1.4's ordering.
        test_recipe:
          setup:
            - "Complaint in INVESTIGATING with no RCA at all"
            - "A ResponseTemplate for the complaint's (channel, category) pair exists but remains DRAFT (never published)"
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "WIR-DOM", display_name: "Domestic Wire" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
