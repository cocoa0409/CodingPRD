# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Accounts Payable Vendor Master & Payment Fraud Controls
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: vendor_create_applies_defaults
        claim_type: creation_defaults
        grounds: ["entities.Vendor.fields.payment_terms_days", "entities.Vendor.fields.status", "entities.Vendor.fields.duplicate_review_required"]
        distinguishing_aspect: "Minimal POST /vendors persists input fields verbatim and applies system defaults: DRAFT, payment_terms_days 30, discount pct 0 / window 0, duplicate_review_required false, version 1, created_by_user_id from the header."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "Default Depot", tax_id: "20-0000001", remit_email: "ap@dd.com", phone: "+1-555-2000", address_line1: "30 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
          assert:
            - "Vendor.${v_id}: status == DRAFT, payment_terms_days == 30, early_pay_discount_pct == 0, discount_window_days == 0, duplicate_review_required == false, version == 1, created_by_user_id == u-vs-01"

      - name: vendor_create_missing_tax_id_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required tax_id fails shape validation with ERR_INVALID_REQUEST (400) before any duplicate screening runs."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "No Taxid", remit_email: "ap@nt.com", phone: "+1-555-2001", address_line1: "31 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: vendor_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown vendor id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vendors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Auditor
              as_user_id: "u-aud-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: vendor_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints.\"GET /vendors\""]
        distinguishing_aspect: "Pagination defaults and fields: limit=2 over 3 vendors returns total_count 3 and has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup: ["Three vendors created"]
          setup_api_calls:
            - { call: "POST /vendors", payload: { legal_name: "Page One", tax_id: "20-0000002", remit_email: "a@p1.com", phone: "+1-555-2002", address_line1: "1 A St", city: "Springfield", country: "US" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors", payload: { legal_name: "Page Two", tax_id: "20-0000003", remit_email: "a@p2.com", phone: "+1-555-2003", address_line1: "2 A St", city: "Springfield", country: "US" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors", payload: { legal_name: "Page Three", tax_id: "20-0000004", remit_email: "a@p3.com", phone: "+1-555-2004", address_line1: "3 A St", city: "Springfield", country: "US" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
          trigger:
            - { call: "GET /vendors", payload: { limit: 2, offset: 0 }, as: Auditor, as_user_id: "u-aud-01" }
            - { call: "GET /vendors", payload: { limit: 2, offset: 2 }, as: Auditor, as_user_id: "u-aud-01" }
          assert:
            - "Page 1: len(data) == 2, total_count == 3, has_more == true"
            - "Page 2: len(data) == 1, total_count == 3, has_more == false"

      - name: payment_net_amount_includes_wire_fee
        claim_type: computed_fields
        grounds: ["entities.Payment.fields.net_amount_cents", "calculations.payment_run_totals"]
        distinguishing_aspect: "On a WIRE run with a discountless vendor, net_amount_cents == amount_cents + WIRE_FEE_CENTS (2500) and the run total carries the fee — the computed field, not client input, drives totals."
        test_recipe:
          setup:
            - "Aged vendor 'Wire Works' (no discount), GLOBAL t1 rule, invoice 100000 APPROVED, WIRE run scheduled 2026-08-05"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Wire Works", tax_id: "20-0000005", remit_email: "ap@ww.com", phone: "+1-555-2005", address_line1: "32 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { v_ver: $.data.version } }
            - call: "POST /vendors/${v_id}/bank-accounts"
              payload: { account_number: "000777888999", routing_number: "021000021", account_holder_name: "Wire Works", is_primary: true, expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { ba_id: $.data.id }
            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { cb_code: "$.data[0].verification_code" } }
            - { call: "POST /bank-accounts/${ba_id}/confirm-verification", payload: { verification_code: "${cb_code}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9501", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - { call: "POST /payment-runs", payload: { scheduled_date: "2026-08-05", payment_method: "WIRE" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /payment-runs/${run_id}/invoices", payload: { invoice_id: "${inv_id}" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { pay_id: $.data.id } }
            - { call: "POST /payment-runs/${run_id}/compile", payload: {}, as: TreasuryAnalyst, as_user_id: "u-ta-01" }
          assert:
            - "Payment.${pay_id}: fee_cents == 2500, discount_applied_cents == 0, net_amount_cents == 102500"
            - "PaymentRun.${run_id}.total_amount_cents == 102500"

      - name: audit_trail_records_master_data_changes
        claim_type: computed_fields
        grounds: ["entities.AuditEvent", "endpoints.\"GET /audit-events\""]
        distinguishing_aspect: "Creating then PATCHing a vendor writes AuditEvent rows (CREATE, then UPDATE per field with old/new values and actor identity) retrievable via the filtered audit endpoint."
        test_recipe:
          setup: ["Vendor 'Audit Alley' in DRAFT"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Audit Alley", tax_id: "20-0000006", remit_email: "ap@aa.com", phone: "+1-555-2006", address_line1: "33 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id, v_ver: $.data.version }
          trigger:
            - { call: "PATCH /vendors/${v_id}", payload: { phone: "+1-555-9999", expected_vendor_version: "${v_ver}" }, as: VendorSpecialist, as_user_id: "u-vs-02" }
            - { call: "GET /audit-events", payload: { entity_type: "Vendor", entity_id: "${v_id}" }, as: Auditor, as_user_id: "u-aud-01" }
          assert:
            - "Audit events for the vendor include event_type CREATE (actor u-vs-01) and an UPDATE with field_name phone, old_value '+1-555-2006', new_value '+1-555-9999', actor_user_id u-vs-02"
            - "Vendor version after PATCH == 2"

      - name: callback_verification_code_server_minted_with_expiry
        claim_type: system_fields
        grounds: ["entities.CallbackVerification.fields.verification_code", "entities.CallbackVerification.fields.expires_at", "calculations.callback_attempt_policy"]
        distinguishing_aspect: "Bank-account creation mints a PENDING verification whose code and expires_at (created + 48h exactly) are server-generated and readable for the simulated callback."
        test_recipe:
          setup: ["Vendor DRAFT; clock at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Callback Crafts", tax_id: "20-0000007", remit_email: "ap@cc2.com", phone: "+1-555-2007", address_line1: "34 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id, v_ver: $.data.version }
          trigger:
            - { call: "POST /vendors/${v_id}/bank-accounts", payload: { account_number: "000888999000", routing_number: "021000021", account_holder_name: "Callback Crafts", is_primary: true, expected_vendor_version: "${v_ver}" }, as: VendorSpecialist, as_user_id: "u-vs-01", captures: { ba_id: $.data.id } }
            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01" }
          assert:
            - "Exactly one verification: status PENDING, attempts == 0, verification_code present (6 digits), expires_at == 2026-08-03T00:00:00Z"
            - "VendorBankAccount.${ba_id}.status == PENDING_VERIFICATION and Vendor version incremented to 2"

      - name: merged_vendor_reachable_via_fk_filters
        claim_type: parent_relationships
        grounds: ["entities.Vendor.fields.merged_into_vendor_id", "entities.VendorMergeRecord"]
        distinguishing_aspect: "After a merge, the MERGED source is found via GET /vendors?merged_into_vendor_id=<survivor> and the VendorMergeRecord via its survivor filter — reverse reachability of both self-FK and record FKs."
        test_recipe:
          setup: ["Survivor ACTIVE; source DRAFT"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Survivor Stone", tax_id: "20-0000008", remit_email: "ap@ss.com", phone: "+1-555-2008", address_line1: "35 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { surv_id: $.data.id }
            - { call: "POST /vendors/${surv_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${surv_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${surv_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { surv_ver: $.data.version } }
            - call: "POST /vendors"
              payload: { legal_name: "Survivor Stone Duplicate", tax_id: "20-0000009", remit_email: "ap@ssd.com", phone: "+1-555-2009", address_line1: "36 Fir St", city: "Springfield", country: "US", duplicate_acknowledged: true }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { dup_id: $.data.id }
          trigger:
            - { call: "POST /vendors/${surv_id}/merge", payload: { duplicate_vendor_id: "${dup_id}", expected_vendor_version: "${surv_ver}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "GET /vendors", payload: { merged_into_vendor_id: "${surv_id}" }, as: Auditor, as_user_id: "u-aud-01" }
            - { call: "GET /vendor-merge-records", payload: { survivor_vendor_id: "${surv_id}" }, as: Auditor, as_user_id: "u-aud-01" }
          assert:
            - "GET /vendors?merged_into_vendor_id: exactly [${dup_id}] with status MERGED"
            - "Merge record: survivor ${surv_id}, merged ${dup_id}, invoices_repointed_count == 0, bank_accounts_disabled_count == 0, match_score recorded (Dice of the two names, 4dp)"
        # Note: Dice('Survivor Stone', 'Survivor Stone Duplicate') == 0.7097 < 0.7500, so the create is clean; duplicate_acknowledged is accepted but not required and duplicate_review_required stays false.

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: merged_vendor_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Vendor", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Once MERGED, every action endpoint on that vendor (e.g. suspend) is rejected with ERR_INVALID_STATE_TRANSITION; terminal states accept no transitions."
        test_recipe:
          setup: ["Survivor ACTIVE; source DRAFT merged into it"]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { legal_name: "Terminal Tom", tax_id: "20-0000010", remit_email: "ap@tt.com", phone: "+1-555-2010", address_line1: "37 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { surv_id: $.data.id }
            - { call: "POST /vendors/${surv_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${surv_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${surv_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { surv_ver: $.data.version } }
            - call: "POST /vendors"
              payload: { legal_name: "Terminal Tom Copy", tax_id: "20-0000011", remit_email: "ap@ttc.com", phone: "+1-555-2011", address_line1: "38 Fir St", city: "Springfield", country: "US", duplicate_acknowledged: true }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { dup_id: $.data.id }
            - { call: "POST /vendors/${surv_id}/merge", payload: { duplicate_vendor_id: "${dup_id}", expected_vendor_version: "${surv_ver}" }, as: VendorManager, as_user_id: "u-vm-01" }
          trigger:
            - call: "POST /vendors/${dup_id}/suspend"
              payload: { reason: "should fail" }
              as: VendorManager
              as_user_id: "u-vm-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (MERGED is terminal)"

      - name: invoice_approve_before_submit_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Invoice", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Approve on a RECEIVED (never submitted) invoice fails with ERR_INVALID_STATE_TRANSITION; approval_round is still 0 and required_tier null."
        test_recipe:
          setup: ["GLOBAL t1 rule; ACTIVE vendor; invoice RECEIVED"]
          setup_api_calls:
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Early Eagle", tax_id: "20-0000012", remit_email: "ap@ee.com", phone: "+1-555-2012", address_line1: "39 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9601", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/approve"
              payload: { tier: 1 }
              as: APSupervisor
              as_user_id: "u-sup-01"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION; invoice stays RECEIVED with approval_round == 0 and required_tier null"

      - name: run_uncompile_and_revoke_approval_branch
        claim_type: valid_transition_branch
        grounds: ["state_machines.PaymentRun.COMPILED_to_DRAFT", "state_machines.PaymentRun.APPROVED_to_COMPILED"]
        distinguishing_aspect: "The run machine branches backward: COMPILED -> DRAFT via uncompile and APPROVED -> COMPILED via revoke-approval, clearing approved_by_user_id."
        test_recipe:
          setup: ["Aged vendor, approved invoice 100000, run with one payment"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Branch Brook", tax_id: "20-0000013", remit_email: "ap@bb2.com", phone: "+1-555-2013", address_line1: "40 Fir St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { v_ver: $.data.version } }
            - call: "POST /vendors/${v_id}/bank-accounts"
              payload: { account_number: "000999000111", routing_number: "021000021", account_holder_name: "Branch Brook", is_primary: true, expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { ba_id: $.data.id }
            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { cb_code: "$.data[0].verification_code" } }
            - { call: "POST /bank-accounts/${ba_id}/confirm-verification", payload: { verification_code: "${cb_code}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9701", amount_cents: 100000, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv_id: $.data.id }
            - { call: "POST /invoices/${inv_id}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv_id}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - { call: "POST /payment-runs", payload: { scheduled_date: "2026-08-05", payment_method: "CHECK" }, as: TreasuryAnalyst, as_user_id: "u-ta-01", captures: { run_id: $.data.id } }
            - { call: "POST /payment-runs/${run_id}/invoices", payload: { invoice_id: "${inv_id}" }, as: TreasuryAnalyst, as_user_id: "u-ta-01" }
          trigger:
            - { call: "POST /payment-runs/${run_id}/compile", payload: {}, as: TreasuryAnalyst, as_user_id: "u-ta-01" }
            - { call: "POST /payment-runs/${run_id}/uncompile", payload: {}, as: TreasuryAnalyst, as_user_id: "u-ta-01" }
            - { call: "POST /payment-runs/${run_id}/compile", payload: {}, as: TreasuryAnalyst, as_user_id: "u-ta-01" }
            - { call: "POST /payment-runs/${run_id}/approve", payload: {}, as: TreasuryManager, as_user_id: "u-tm-01" }
            - { call: "POST /payment-runs/${run_id}/revoke-approval", payload: {}, as: TreasuryManager, as_user_id: "u-tm-01" }
          assert:
            - "Sequence DRAFT->COMPILED->DRAFT->COMPILED->APPROVED->COMPILED all succeed"
            - "After revoke: status == COMPILED and approved_by_user_id == null; payment still PENDING, invoice still IN_PAYMENT_RUN"

      - name: payment_void_after_release_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Payment", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "POST /payments/{id}/void on a RELEASED payment fails — manual removal exists only pre-release."
        test_recipe:
          setup: ["Full chain: aged vendor, invoice 100000, run released"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
