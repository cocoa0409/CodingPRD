  - rule_id: transitive_cascade
    instances:
      - name: annual_fail_cascade_depth4
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - state_machines.RegistrationCertificate.ACTIVE_to_REVOKED
          - "state_machines.ElevatorUnit.equipment_status.IN_SERVICE_to_OUT_OF_SERVICE"
          - state_machines.ServiceCall.DISPATCHED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 cascade from POST record-result (ANNUAL, FAILED): inspection FAILED ->
          certificate REVOKED -> unit registration SUSPENDED + equipment OUT_OF_SERVICE ->
          the unit's DISPATCHED service call CANCELLED. Each hop is caused by the previous
          hop, not by the original trigger.
        test_recipe:
          setup:
            - "Unit IN_SERVICE/REGISTERED with ACTIVE certificate and ACTIVE STANDARD contract"
            - "REPAIR service call DISPATCHED to the CET installer"
            - "ANNUAL inspection SCHEDULED for the QEI inspector, clock past scheduled_start"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
