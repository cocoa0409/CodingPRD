# =============================================================================
# §1.9 SCAFFOLD CORNER DESIGN — Breadth Probe
# Newborn Hearing Screening & Follow-Up Tracking (task 2606)
# Walks references/claim-extraction-guide.md section by section against this
# scaffold's §1.1-§1.7. Corners already carried by §1.8 appear as
# excluded_because stubs naming the covering instance.
# All chains start from an empty DB with the logical clock at its startup
# default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:
      - name: create_facility_returns_201_with_computed_ledger_fields_initialised
        claim_type: creation
        grounds:
          - entities.Facility
          - endpoints.POST_facilities
          - entities.Facility.fields.navigation_budget_units_remaining
        distinguishing_aspect: "A brand-new Facility comes back 201 with every declared field present and its computed ledger fields seeded: budget remaining == total, penalty balance 0, posture COMPLIANT, both scores null."
        test_recipe:
          setup:
            - "Empty database, clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /facilities"
              payload: { name: "Riverside Birth Hospital", facility_type: "BIRTH_HOSPITAL", region_code: "R1", navigation_budget_units_total: 60 }
              as: ProgramAdmin
              captures: { f_id: "$.data.id" }
          assert:
            - "HTTP 201 and response_type == object"
            - "Facility.${f_id}.name == 'Riverside Birth Hospital', facility_type == BIRTH_HOSPITAL, region_code == R1"
            - "Facility.${f_id}.navigation_budget_units_total == 60 and navigation_budget_units_remaining == 60"
            - "Facility.${f_id}.penalty_points_balance == 0, manual_adjustment_points_total == 0, reporting_compliance_status == COMPLIANT"
            - "Facility.${f_id}.performance_score == null, encounter_basis_performance_score == null, last_closed_period_label == null, version == 1"

      - name: get_provider_returns_stored_row_for_every_reader_role
        claim_type: retrieval
        grounds:
          - entities.Provider
          - endpoints.GET_providers_id
        distinguishing_aspect: "GET /providers/{id} echoes the stored row exactly, including the derived open_task_count of 0 for a freshly created navigator."
        test_recipe:
          setup:
            - "One AUDIOLOGY_CLINIC facility with one navigator provider created with explicit languages and max_open_tasks."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R2" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "NAVIGATOR", full_name: "Nia Ortiz", region_code: "R2", languages: ["EN", "ES"], max_open_tasks: 3 }
              as: FacilityAdmin
              as_user_id: "${ac_id}"
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "GET /providers/${p_id}"
              payload: {}
              as: ProgramAuditor
          assert:
            - "HTTP 200 and Provider.${p_id}.facility_id == ${ac_id}, provider_type == NAVIGATOR, full_name == 'Nia Ortiz', region_code == R2"
            - "Provider.${p_id}.languages == ['EN', 'ES'], max_open_tasks == 3, credential_status == ACTIVE, open_task_count == 0"

      - name: list_infants_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_infants
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three infants with limit 2 return two rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false. total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1 and three INPATIENT infants born 2026-08-01T01:00:00Z, 02:00:00Z and 03:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T01:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-1", guardian_contact_phone: "5552001" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T02:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-2", guardian_contact_phone: "5552002" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T03:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-3", guardian_contact_phone: "5552003" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
          trigger:
            - call: "GET /infants"
              payload: { birth_facility_id: "${bh_id}", limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /infants"
              payload: { birth_facility_id: "${bh_id}", limit: 2, offset: 2 }
              as: ProgramAdmin
          assert:
            - "First page: response_type == array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: 1 row, total_count == 3, has_more == false, offset == 2"
            - "Every row's birth_facility_id == ${bh_id}"

      - name: get_unknown_infant_returns_infant_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_infants_id
          - errors.ERR_INFANT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown id on GET /infants/{id} returns 404 ERR_INFANT_NOT_FOUND, not 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /infants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == ERR_INFANT_NOT_FOUND and response_type == error"

      - name: create_infant_missing_birth_datetime_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_infants
          - validations.priority_3_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required birth_datetime (source input, no default) returns 400 ERR_INVALID_REQUEST and creates no Infant row, while the optional fields around it stay omittable."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-X", guardian_contact_phone: "5552101" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /infants?birth_facility_id=${bh_id} returns total_count == 0"

      - name: omitted_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Facility.fields.navigation_budget_units_total
          - entities.Provider.fields.max_open_tasks
          - entities.Provider.fields.credential_status
          - entities.Infant.fields.preferred_language
          - entities.Infant.fields.guardian_consent_status
        distinguishing_aspect: "With every optional input omitted, the row materialises with budget total 40, max_open_tasks 5, credential_status ACTIVE, preferred_language EN, interpreter_required false, nicu_stay_days 0 and guardian_consent_status GRANTED."
        test_recipe:
          setup:
            - "Nothing but the clock; the facility, provider and infant are all created with the minimum required body."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /facilities"
              payload: { name: "BC1", facility_type: "BIRTHING_CENTER", region_code: "R3" }
              as: ProgramAdmin
              captures: { bc_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bc_id}", provider_type: "SCREENER", full_name: "S9", region_code: "R3" }
              as: ProgramAdmin
              captures: { s9_id: "$.data.id" }
            - call: "POST /infants"
              payload: { birth_facility_id: "${bc_id}", birth_datetime: "2026-08-01T02:00:00Z", birth_setting: "BIRTHING_CENTER", gestational_age_weeks: 38, guardian_name: "G-9", guardian_contact_phone: "5552201" }
              as: FacilityScreener
              as_user_id: "${s9_id}"
              captures: { i9_id: "$.data.id" }
          assert:
            - "Facility.${bc_id}.navigation_budget_units_total == 40 and navigation_budget_units_remaining == 40"
            - "Provider.${s9_id}.max_open_tasks == 5, credential_status == ACTIVE, languages == ['EN']"
            - "Infant.${i9_id}.preferred_language == EN, interpreter_required == false, nicu_stay_days == 0, guardian_consent_status == GRANTED, discharge_datetime == null"
            - "Infant.${i9_id}.screening_status == NOT_SCREENED, intervention_status == NOT_APPLICABLE, ltf_risk_score == 8 (BIRTHING_CENTER setting points, no active episode) and priority_band == LOW"

      - name: encounter_overall_result_and_age_days_are_computed_not_accepted
        claim_type: computed_fields
        grounds:
          - calculations.overall_screening_result
          - entities.ScreeningEncounter.fields.overall_result
          - entities.ScreeningEncounter.fields.age_days_at_encounter
          - entities.ScreeningEncounter.fields.before_discharge
        distinguishing_aspect: "overall_result is derived from the two ear results (PASS + REFER -> REFER), age_days_at_encounter from birth to performed_at (2 days), and before_discharge from encounter_type plus the absent discharge stamp — none of the three is an input field."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1 and infant born 2026-08-01T00:00:00Z; clock advanced to 2026-08-03T12:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-C", guardian_contact_phone: "5552301" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { ic_id: "$.data.id" }
          trigger:
            - call: "POST /screening-encounters"
              payload: { infant_id: "${ic_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-08-03T00:00:00Z", left_ear_result: "PASS", right_ear_result: "REFER" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { enc_id: "$.data.id" }
          assert:
            - "ScreeningEncounter.${enc_id}.overall_result == REFER (any REFER ear makes the encounter REFER)"
            - "ScreeningEncounter.${enc_id}.age_days_at_encounter == 2"
            - "ScreeningEncounter.${enc_id}.before_discharge == true (BIRTH_ADMISSION with no discharge recorded)"
            - "Infant.${ic_id}.screening_status == REFERRED and exactly one RESCREEN FollowUpEpisode exists in PENDING_SCHEDULING with benchmark_days == 30 and due_date == 2026-08-31T00:00:00Z"

      - name: system_fields_are_server_generated_and_client_values_ignored
        claim_type: system_fields
        grounds:
          - entities.Facility
          - endpoints.POST_facilities
        distinguishing_aspect: "id, created_at, updated_at and version are stamped by the server; a client-supplied id in the body is ignored rather than honoured, and version starts at 1."
        test_recipe:
          setup:
            - "Empty database with the clock pinned to 2026-08-01T00:00:00Z so created_at is predictable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /facilities"
              payload: { name: "EI-North", facility_type: "EI_PROGRAM", region_code: "R4" }
              as: ProgramAdmin
              captures: { f2_id: "$.data.id", f2_created: "$.data.created_at" }
          assert:
            - "Facility.${f2_id}.id is server-generated and non-empty; created_at == 2026-08-01T00:00:00Z and updated_at == created_at"
            - "Facility.${f2_id}.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response envelope"

      - name: invalid_birth_setting_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Infant.fields.birth_setting
          - validations.priority_3_ERR_INVALID_REQUEST
        distinguishing_aspect: "birth_setting outside {INPATIENT, BIRTHING_CENTER, OUT_OF_HOSPITAL, HOME_BIRTH} is rejected 400 ERR_INVALID_REQUEST before any FK or business check runs, and gestational_age_weeks outside 20..45 is rejected the same way."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; clock 2026-08-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T02:00:00Z", birth_setting: "BIRTH_CENTRE", gestational_age_weeks: 39, guardian_name: "G-E", guardian_contact_phone: "5552401" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T02:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 19, guardian_name: "G-E", guardian_contact_phone: "5552401" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { err_id2: "$.data.error_id" }
          assert:
            - "Bad enum: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Out-of-range gestational_age_weeks 19: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /infants?birth_facility_id=${bh_id} returns total_count == 0"

      - name: screening_encounter_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ScreeningEncounter
          - endpoints.GET_screening_encounters_id
        distinguishing_aspect: "ScreeningEncounter is declared common_fields: false — §1.5 exposes only POST and GET for it, the response carries no version/updated_at, and a correction is expressed by a new row chained through prior_encounter_id."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1, infant born 2026-08-01T00:00:00Z, and one BIRTH_ADMISSION REFER encounter recorded at 2026-08-01T04:00:00Z."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-I", guardian_contact_phone: "5552501" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { ii_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${ii_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-08-01T04:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { enc1_id: "$.data.id" }
          trigger:
            - call: "GET /screening-encounters/${enc1_id}"
              payload: {}
              as: ProgramAuditor
            - call: "POST /screening-encounters"
              payload: { infant_id: "${ii_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "SURVEILLANCE", method: "OAE", performed_at: "2026-08-01T05:00:00Z", left_ear_result: "PASS", right_ear_result: "PASS", prior_encounter_id: "${enc1_id}" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { enc2_id: "$.data.id" }
          assert:
            - "GET /screening-encounters/${enc1_id} returns no version field and no updated_at field (common_fields: false)"
            - "ScreeningEncounter.${enc1_id} is unchanged: left_ear_result == REFER, overall_result == REFER"
            - "ScreeningEncounter.${enc2_id}.prior_encounter_id == ${enc1_id} — the correction is a new appended row"
            - "GET /screening-encounters?infant_id=${ii_id} returns total_count == 2"

      - name: create_provider_under_unknown_facility_returns_facility_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Provider.fields.facility_id
          - validations.priority_6_existence_foreign_keys
          - errors.ERR_FACILITY_NOT_FOUND
        distinguishing_aspect: "Flat topology means the parent arrives as a body FK: an unknown facility_id on POST /providers returns 404 ERR_FACILITY_NOT_FOUND, and the same body succeeds once the facility exists."
        test_recipe:
          setup:
            - "Empty database with the clock at its default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /providers"
              payload: { facility_id: "00000000-0000-4000-8000-0000000000ff", provider_type: "AUDIOLOGIST", full_name: "A-ghost", region_code: "R1" }
              as: ProgramAdmin
              captures: { err_id: "$.data.error_id" }
            - call: "POST /facilities"
              payload: { name: "AC2", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac2_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac2_id}", provider_type: "AUDIOLOGIST", full_name: "A-real", region_code: "R1" }
              as: ProgramAdmin
              captures: { pr_id: "$.data.id" }
          assert:
            - "Unknown parent: HTTP 404 with data.error_id == ERR_FACILITY_NOT_FOUND"
            - "GET /facilities/${ac2_id}/providers returns total_count == 1 with the single row id == ${pr_id}"
            - "Provider.${pr_id}.facility_id == ${ac2_id}"

  - section: state_machines
    instances:
      - name: episode_pending_scheduling_to_scheduled_on_booking
        claim_type: valid_transition
        grounds:
          - state_machines.FollowUpEpisode.PENDING_SCHEDULING_to_SCHEDULED
          - endpoints.POST_rescreen_appointments
        distinguishing_aspect: "The home-birth capture episode moves PENDING_SCHEDULING -> SCHEDULED on the first booking, and attempt_count is re-derived to 1 by the BOOKED appointment."
        test_recipe:
          setup:
            - "MW1 (MIDWIFE_PRACTICE, R1) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with audiologist A1 and navigator N1; clock 2026-08-01T06:00:00Z; HOME_BIRTH infant born 2026-08-01T00:00:00Z auto-opens an INITIAL_SCREEN episode; one RESCREEN slot on 2026-08-05."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "MW1", facility_type: "MIDWIFE_PRACTICE", region_code: "R1" }
              as: ProgramAdmin
              captures: { mw_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${mw_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "NAVIGATOR", full_name: "N1", region_code: "R1" }
              as: ProgramAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${mw_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "HOME_BIRTH", gestational_age_weeks: 39, guardian_name: "G-H", guardian_contact_phone: "5553001" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
