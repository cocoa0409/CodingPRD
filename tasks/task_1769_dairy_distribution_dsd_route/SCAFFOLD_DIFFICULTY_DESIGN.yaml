            - "Trip T1 case_capacity 50; order O1 (20 units, window 08:00-08:30) CONFIRMED"
            - "Order O2 (40 units, window 08:35-09:00) PLANNED — creation reserves 40 cases (loaded_cases becomes 60 > 50) and its window sits 5 minutes after O1's end"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
