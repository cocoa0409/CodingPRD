# =============================================================================
# SCAFFOLD.yaml — task_3491_payment_network_rule_making_enforcement_risk_framework
# Payment Network Rule Making, Enforcement & Risk Framework
# =============================================================================

scenario: |
  Payment Network Rule Making, Enforcement & Risk Framework (Nacha): rule development through a member voting process with ballots, effective dates and implementation guidance, transaction code definitions governing authorization requirements, return timeframes and warranty obligations for each entry class, return rate thresholds for unauthorized and administrative returns with inquiry and enforcement processes, risk management framework requirements for originating institutions including originator due diligence and exposure limits, account validation requirements for internet-initiated debits with acceptable verification methods, rules enforcement through a national system with fines and escalating consequences for repeated violations, same-day settlement windows with limits and cutoff requirements, audit requirements and annual compliance attestation for participants

domain_name: payment-network-rulemaking
api_prefix: /network

complexity_profile:
  primary_archetype: multi-party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — do not edit)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the member institution" }
      - { name: participant_type, type: enum, source: input, description: "ODFI | RDFI | BOTH — originating side, receiving side, or both", constraints: "enum {ODFI, RDFI, BOTH}" }
      - { name: routing_number, type: string, source: input, description: "9-character routing transit number; unique across all participants", constraints: "exactly 9 ASCII digits; unique network-wide" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | TERMINATED", constraints: "enum {ONBOARDING, ACTIVE, SUSPENDED, TERMINATED}" }
      - { name: current_period, type: string, source: computed, description: "YYYY-MM of the month in which fees were last accrued; null until first settlement accrual" }
      - { name: current_period_fees_cents, type: integer, source: computed, description: "Accumulated network settlement fees for current_period; resets to 0 on first accrual of a new calendar month" }

  - name: Originator
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; set from X-User-ID of the creating ParticipantOfficer" }
      - { name: legal_name, type: string, source: input, description: "Third-party sender legal name" }
      - { name: risk_tier, type: enum, source: input, description: "Originator due-diligence risk tier", constraints: "enum {LOW, STANDARD, HIGH}" }
      - { name: exposure_limit_cents, type: integer, source: input, description: "Maximum permitted contingent exposure in cents; must be > 0; mutable only via PATCH exposure-limit (OCC)" }
      - { name: committed_exposure_cents, type: integer, source: computed, description: "Sum of amount_cents over this originator's entries with status ORIGINATED" }
      - { name: contingent_exposure_cents, type: integer, source: computed, description: "committed_exposure_cents + sum of amount_cents over entries with status SETTLED whose return window (settled_date + transaction_code.return_timeframe_banking_days, banking days) has not expired as of the logical clock" }
      - { name: status, type: enum, source: system, description: "PENDING_DUE_DILIGENCE | APPROVED | SUSPENDED | TERMINATED", constraints: "enum {PENDING_DUE_DILIGENCE, APPROVED, SUSPENDED, TERMINATED}" }

  - name: TransactionCode
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Standard entry class code, e.g. WEB, PPD, TEL, CCD; unique network-wide", constraints: "2-3 uppercase letters; unique network-wide" }
      - { name: entry_class, type: enum, source: input, description: "DEBIT | CREDIT", constraints: "enum {DEBIT, CREDIT}" }
      - { name: authorization_requirement, type: enum, source: input, description: "Authorization form the entry class demands", constraints: "enum {WRITTEN_SIGNED, ORAL_RECORDED, IMPLIED, NONE}" }
      - { name: return_timeframe_banking_days, type: integer, source: input, description: "Banking days (Mon-Fri, no holiday calendar) after settled_date during which a return is accepted; must be >= 1" }
      - { name: account_validation_required, type: boolean, source: input, description: "True for internet-initiated debits: first debit to a receiver account requires a VALID AccountValidation" }
      - { name: warranty_obligations, type: string, source: input, description: "Free-text warranty summary the ODFI gives the network for this entry class" }

  - name: SettlementWindow
    parent: null
    common_fields: false
    fields:
      - { name: window_code, type: string, source: input, description: "Window identifier W1 | W2 | W3; unique network-wide", constraints: "enum-like string; unique network-wide" }
      - { name: cutoff_time_utc, type: string, source: input, description: "Daily cutoff in HH:MM (24h, UTC); entries settle only in runs at or after the cutoff" }
      - { name: per_entry_limit_cents, type: integer, source: input, description: "Maximum amount_cents for a same-day entry assigned to this window; amounts equal to the limit are allowed" }
      - { name: odfi_window_cap_cents, type: integer, source: input, description: "Maximum aggregate same-day amount_cents per originating participant per window per calendar day; an entry that would bring the running total exactly to the cap is allowed" }

  - name: RuleProposal
    parent: null
    common_fields: true
    fields:
      - { name: transaction_code_id, type: string, source: input, description: "FK -> TransactionCode.id; the entry class this rule change governs" }
      - { name: title, type: string, source: input, description: "Short rule title" }
      - { name: summary, type: string, source: input, description: "Rule text summary and implementation guidance abstract" }
      - { name: effective_date, type: string, source: input, description: "ISO date YYYY-MM-DD on which the rule takes effect once PASSED; must be strictly after the creation date" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMMENT_OPEN | BALLOTING | PASSED | REJECTED | RETURNED_FOR_REWORK | EFFECTIVE | SUPERSEDED", constraints: "enum {DRAFT, COMMENT_OPEN, BALLOTING, PASSED, REJECTED, RETURNED_FOR_REWORK, EFFECTIVE, SUPERSEDED}" }
      - { name: outcome, type: enum, source: computed, description: "PASSED_QUORUM | REJECTED_VOTE | REJECTED_NO_QUORUM; null until close-ballot", constraints: "enum {PASSED_QUORUM, REJECTED_VOTE, REJECTED_NO_QUORUM} or null" }
      - { name: comment_opened_at, type: datetime, source: system, description: "Logical-clock timestamp when comment period opened; null until then" }
      - { name: ballot_opened_at, type: datetime, source: system, description: "Logical-clock timestamp when balloting opened; null until then" }
      - { name: yea_count, type: integer, source: computed, description: "Live count of CAST/LOCKED ballots with vote YEA" }
      - { name: nay_count, type: integer, source: computed, description: "Live count of CAST/LOCKED ballots with vote NAY" }
      - { name: abstain_count, type: integer, source: computed, description: "Live count of CAST/LOCKED ballots with vote ABSTAIN" }

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - { name: rule_proposal_id, type: string, source: system, description: "FK -> RuleProposal.id; taken from the cast path" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; set from X-User-ID of the casting VotingDelegate" }
      - { name: vote, type: enum, source: input, description: "YEA | NAY | ABSTAIN", constraints: "enum {YEA, NAY, ABSTAIN}" }
      - { name: status, type: enum, source: system, description: "CAST | LOCKED — LOCKED when the proposal's ballot closes", constraints: "enum {CAST, LOCKED}" }
      - { name: cast_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent cast or recast" }

  - name: GuidanceDocument
    parent: null
    common_fields: true
    fields:
      - { name: rule_proposal_id, type: string, source: input, description: "FK -> RuleProposal.id; the EFFECTIVE rule this guidance interprets" }
      - { name: transaction_code_id, type: string, source: input, description: "FK -> TransactionCode.id; must equal the referenced rule proposal's transaction_code_id" }
      - { name: title, type: string, source: input, description: "Guidance title" }
      - { name: body_ref, type: string, source: input, description: "Opaque reference to the guidance text (e.g. document store key)" }
      - { name: effective_from, type: string, source: input, description: "ISO date YYYY-MM-DD, inclusive start of the guidance's effective window" }
      - { name: effective_until, type: string, source: input, description: "ISO date YYYY-MM-DD, EXCLUSIVE end of the effective window; null means open-ended", constraints: "null or strictly after effective_from" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED", constraints: "enum {PUBLISHED, SUPERSEDED}" }

  - name: PaymentEntry
    parent: null
    common_fields: true
    fields:
      - { name: originator_id, type: string, source: input, description: "FK -> Originator.id; the third-party sender" }
      - { name: originating_participant_id, type: string, source: system, description: "FK -> Participant.id; copied from the originator's participant_id at creation" }
      - { name: transaction_code_id, type: string, source: input, description: "FK -> TransactionCode.id" }
      - { name: settlement_window_id, type: string, source: computed, description: "FK -> SettlementWindow.id; the window the entry is assigned to. Required in input when same_day is true; server-assigned (earliest-cutoff window, tie-break window.created_at ASC) when same_day is false" }
      - { name: amount_cents, type: integer, source: input, description: "Entry amount in cents; must be > 0" }
      - { name: receiver_account_number_hash, type: string, source: input, description: "Stable hash of the receiver's account number; account validation is keyed on it" }
      - { name: receiver_name, type: string, source: input, description: "Receiver display name" }
      - { name: authorization_type, type: enum, source: input, description: "Authorization form the originator obtained; must exactly equal the transaction code's authorization_requirement unless that requirement is NONE", constraints: "enum {WRITTEN_SIGNED, ORAL_RECORDED, IMPLIED, NONE}" }
      - { name: same_day, type: boolean, source: input, description: "True requests same-day settlement through an explicit settlement_window_id; default false" , default: false }
      - { name: entry_fee_cents, type: integer, source: computed, description: "Network fee for this entry per calculation network_settlement_fee; null until settled" }
      - { name: status, type: enum, source: system, description: "ORIGINATED | SETTLED | RETURNED | CANCELLED", constraints: "enum {ORIGINATED, SETTLED, RETURNED, CANCELLED}" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock timestamp of settlement; null until SETTLED" }
      - { name: settled_date, type: string, source: system, description: "ISO date (UTC) of settlement; return deadlines are computed from it; null until SETTLED" }

  - name: ReturnRecord
    parent: null
    common_fields: false
    fields:
      - { name: payment_entry_id, type: string, source: system, description: "FK -> PaymentEntry.id; taken from the return path" }
      - { name: returning_participant_id, type: string, source: system, description: "FK -> Participant.id; set from X-User-ID of the returning ParticipantOfficer; must differ from the entry's originating_participant_id" }
      - { name: reason_code, type: enum, source: input, description: "UNAUTHORIZED_DEBIT | AUTHORIZATION_REVOKED | INSUFFICIENT_FUNDS | INVALID_ACCOUNT | STOP_PAYMENT", constraints: "enum {UNAUTHORIZED_DEBIT, AUTHORIZATION_REVOKED, INSUFFICIENT_FUNDS, INVALID_ACCOUNT, STOP_PAYMENT}" }
      - { name: reason_class, type: enum, source: computed, description: "Derived from reason_code: UNAUTHORIZED_DEBIT/AUTHORIZATION_REVOKED -> UNAUTHORIZED; INSUFFICIENT_FUNDS/INVALID_ACCOUNT -> ADMINISTRATIVE; STOP_PAYMENT -> OTHER", constraints: "enum {UNAUTHORIZED, ADMINISTRATIVE, OTHER}" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock timestamp of the return" }

  - name: AccountValidation
    parent: null
    common_fields: false
    fields:
      - { name: originator_id, type: string, source: input, description: "FK -> Originator.id" }
      - { name: account_number_hash, type: string, source: input, description: "Receiver account hash being validated" }
      - { name: method, type: enum, source: input, description: "Acceptable verification method", constraints: "enum {MICRO_DEPOSIT, PRENOTE, COMMERCIAL_SERVICE, PRIOR_HISTORY}" }
      - { name: validated_until, type: string, source: computed, description: "ISO date = creation date + 365 days; validation is VALID while the logical clock date is <= validated_until" }
      - { name: status, type: enum, source: computed, description: "VALID | EXPIRED — derived from validated_until vs the logical clock on every read", constraints: "enum {VALID, EXPIRED}" }

  - name: ReturnRateSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the originating institution measured" }
      - { name: period, type: string, source: input, description: "Measurement period YYYY-MM; one snapshot per participant per period", constraints: "format YYYY-MM" }
      - { name: forward_count, type: integer, source: computed, description: "Entries of this participant with settled_date inside period (settlement-basis denominator)" }
      - { name: origination_forward_count, type: integer, source: computed, description: "Entries of this participant created inside period (origination-basis denominator)" }
      - { name: unauth_return_count, type: integer, source: computed, description: "ReturnRecords created inside period with reason_class UNAUTHORIZED (settlement-basis numerator)" }
      - { name: admin_return_count, type: integer, source: computed, description: "ReturnRecords created inside period with reason_class ADMINISTRATIVE" }
      - { name: other_return_count, type: integer, source: computed, description: "ReturnRecords created inside period with reason_class OTHER" }
      - { name: origination_unauth_count, type: integer, source: computed, description: "ReturnRecords created inside period whose entry was created inside period, class UNAUTHORIZED (origination-basis numerator)" }
      - { name: origination_admin_count, type: integer, source: computed, description: "Same basis as origination_unauth_count, class ADMINISTRATIVE" }
      - { name: settlement_unauth_rate, type: number, source: computed, description: "unauth_return_count / forward_count, 4 decimal places round_half_up; 0.0 when forward_count == 0" }
      - { name: settlement_admin_rate, type: number, source: computed, description: "admin_return_count / forward_count, 4dp round_half_up; 0.0 when forward_count == 0" }
      - { name: settlement_overall_rate, type: number, source: computed, description: "(unauth+admin+other) / forward_count, 4dp round_half_up; 0.0 when forward_count == 0" }
      - { name: origination_unauth_rate, type: number, source: computed, description: "origination_unauth_count / origination_forward_count, 4dp round_half_up; 0.0 when denominator == 0" }
      - { name: origination_admin_rate, type: number, source: computed, description: "origination_admin_count / origination_forward_count, 4dp round_half_up; 0.0 when denominator == 0" }
      - { name: unauth_breach, type: boolean, source: computed, description: "true iff forward_count > 0 AND unauth_return_count * 100 > forward_count * 10 (strictly greater than 10%)" }
      - { name: admin_breach, type: boolean, source: computed, description: "true iff forward_count > 0 AND admin_return_count * 100 > forward_count * 20 (strictly greater than 20%)" }
      - { name: overall_breach, type: boolean, source: computed, description: "true iff forward_count > 0 AND (unauth+admin+other) * 100 > forward_count * 25 (strictly greater than 25%)" }
      - { name: status, type: enum, source: system, description: "COMPUTED — immutable once created", constraints: "enum {COMPUTED}" }

  - name: InquiryCase
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; copied from the triggering snapshot" }
      - { name: return_rate_snapshot_id, type: string, source: system, description: "FK -> ReturnRateSnapshot.id; the breaching snapshot" }
      - { name: return_class, type: enum, source: system, description: "UNAUTHORIZED | ADMINISTRATIVE | OVERALL — which threshold breached", constraints: "enum {UNAUTHORIZED, ADMINISTRATIVE, OVERALL}" }
      - { name: response_deadline, type: datetime, source: system, description: "creation timestamp + 14 days (logical clock)" }
      - { name: response_text, type: string, source: input, description: "Participant's remediation response; null until respond", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPENED | RESPONSE_SUBMITTED | RESOLVED | ESCALATED", constraints: "enum {OPENED, RESPONSE_SUBMITTED, RESOLVED, ESCALATED}" }

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the sanctioned institution" }
      - { name: inquiry_case_id, type: string, source: input, description: "FK -> InquiryCase.id; null when the action is filed directly (e.g. late attestation) rather than escalated from an inquiry", constraints: "nullable" }
      - { name: violation_code, type: enum, source: input, description: "EXCESSIVE_UNAUTHORIZED_RETURNS | EXCESSIVE_ADMINISTRATIVE_RETURNS | MISSING_ACCOUNT_VALIDATION | LATE_ATTESTATION | AUDIT_NONCOMPLIANCE", constraints: "enum {EXCESSIVE_UNAUTHORIZED_RETURNS, EXCESSIVE_ADMINISTRATIVE_RETURNS, MISSING_ACCOUNT_VALIDATION, LATE_ATTESTATION, AUDIT_NONCOMPLIANCE}" }
      - { name: escalation_tier, type: integer, source: computed, description: "min(count of this participant's prior EnforcementActions with status IN {UPHELD, PAID} at creation time, 3)" }
      - { name: fine_base_cents, type: integer, source: computed, description: "Per calculation enforcement_fine_schedule: BASE_BY_TIER[escalation_tier] * type multiplier, computed at issuance" }
      - { name: fine_total_cents, type: integer, source: computed, description: "Total due including late accrual, computed at the PAID transition; null until PAID", constraints: "nullable" }
      - { name: escalated_by_user_id, type: string, source: system, description: "X-User-ID of the PlatformAdmin who escalated the parent inquiry; null for directly filed actions. Segregation of duties: that user may not drive this action to UPHELD", constraints: "nullable" }
      - { name: issued_date, type: string, source: system, description: "ISO date (logical clock) of issuance; late accrual starts 30 days later" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of the PAID transition; null until PAID", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ISSUED | CONTESTED | UPHELD | WITHDRAWN | PAID", constraints: "enum {ISSUED, CONTESTED, UPHELD, WITHDRAWN, PAID}" }

  - name: ComplianceAttestation
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the attesting institution" }
      - { name: period_year, type: integer, source: input, description: "Calendar year under attestation; one attestation per participant per period_year" }
      - { name: due_date, type: string, source: computed, description: "ISO date = (period_year + 1)-03-01" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent SUBMITTED transition; null until first submission", constraints: "nullable" }
      - { name: late_submission, type: boolean, source: computed, description: "true iff the accepting submission's date is strictly after due_date; set on the SUBMITTED transition, default false" }
      - { name: attestation_text, type: string, source: input, description: "Attestation statement supplied at submission", constraints: "nullable until submission" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | ACCEPTED | REJECTED | OVERDUE — OVERDUE is derived lazily: any read/write of the attestation while PENDING and logical date > due_date flips it to OVERDUE", constraints: "enum {PENDING, SUBMITTED, ACCEPTED, REJECTED, OVERDUE}" }

  - name: AuditReport
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the audited institution" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive start of the audit engagement window" }
      - { name: end_date, type: string, source: input, description: "ISO date, INCLUSIVE end of the engagement window; must be >= start_date", constraints: ">= start_date" }
      - { name: findings_count, type: integer, source: input, description: "Number of audit findings, supplied on the COMPLETED transition; must be >= 0; null until then", constraints: "nullable" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Auditor who created the engagement. Segregation of duties: that user may not drive this audit to COMPLETED" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID of the Auditor completing the audit; null until COMPLETED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "enum {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Participant
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /network/participants/{id}/transition {to_state: ACTIVE}"
        actor: PlatformAdmin
        preconditions: ["Participant status is ONBOARDING"]
        side_effects: ["Participant becomes ballot-eligible and may originate/return entries"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /network/participants/{id}/transition {to_state: SUSPENDED} OR automatic side effect of an EnforcementAction reaching UPHELD with cumulative upheld/paid count >= 3"
        actor: PlatformAdmin
        preconditions: ["Participant status is ACTIVE"]
        side_effects:
          - "CASCADE link 1: every Originator of this participant with status APPROVED transitions to SUSPENDED"
          - "CASCADE link 2 (via link 1): every PaymentEntry of each such originator with status ORIGINATED transitions to CANCELLED, and each cancellation releases the entry's amount from the originator's committed_exposure_cents and contingent_exposure_cents"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /network/participants/{id}/transition {to_state: ACTIVE}"
        actor: PlatformAdmin
        preconditions:
          - "Participant status is SUSPENDED"
          - "No EnforcementAction of this participant has status IN {ISSUED, CONTESTED} (ERR_UNRESOLVED_ENFORCEMENT)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /network/participants/{id}/transition {to_state: TERMINATED}"
        actor: PlatformAdmin
        preconditions: ["Participant status is ACTIVE"]
        side_effects: ["All Originators of this participant with status IN {PENDING_DUE_DILIGENCE, APPROVED, SUSPENDED} transition to TERMINATED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /network/participants/{id}/transition {to_state: TERMINATED}"
        actor: PlatformAdmin
        preconditions: ["Participant status is SUSPENDED"]
        side_effects: ["All Originators of this participant with status IN {PENDING_DUE_DILIGENCE, APPROVED, SUSPENDED} transition to TERMINATED"]

  - entity: Originator
    initial_state: PENDING_DUE_DILIGENCE
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_DUE_DILIGENCE
        to: APPROVED
        trigger: "POST /network/originators/{id}/transition {to_state: APPROVED}"
        actor: ParticipantOfficer
        preconditions:
          - "Originator status is PENDING_DUE_DILIGENCE"
          - "Originator's participant status is ACTIVE (ERR_PARTICIPANT_NOT_ACTIVE)"
          - "X-User-ID equals originator.participant_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /network/originators/{id}/transition {to_state: SUSPENDED} OR cascade from Participant suspension"
        actor: ParticipantOfficer
        preconditions: ["Originator status is APPROVED"]
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /network/originators/{id}/transition {to_state: APPROVED}"
        actor: ParticipantOfficer
        preconditions:
          - "Originator status is SUSPENDED"
          - "Originator's participant status is ACTIVE (ERR_PARTICIPANT_NOT_ACTIVE)"
        side_effects: []
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /network/originators/{id}/transition {to_state: TERMINATED} OR cascade from Participant termination"
        actor: ParticipantOfficer
        preconditions: ["Originator status is APPROVED"]
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /network/originators/{id}/transition {to_state: TERMINATED} OR cascade from Participant termination"
        actor: ParticipantOfficer
        preconditions: ["Originator status is SUSPENDED"]
        side_effects: []
      - from: PENDING_DUE_DILIGENCE
        to: TERMINATED
        trigger: "POST /network/originators/{id}/transition {to_state: TERMINATED} OR cascade from Participant termination"
        actor: ParticipantOfficer
        preconditions: ["Originator status is PENDING_DUE_DILIGENCE"]
        side_effects: []

  - entity: RuleProposal
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: COMMENT_OPEN
        trigger: "POST /network/rule-proposals/{id}/transition {to_state: COMMENT_OPEN}"
        actor: PlatformAdmin
        preconditions: ["Proposal status is DRAFT"]
        side_effects: ["comment_opened_at := logical clock now"]
      - from: COMMENT_OPEN
        to: BALLOTING
        trigger: "POST /network/rule-proposals/{id}/transition {to_state: BALLOTING}"
        actor: PlatformAdmin
        preconditions:
          - "Proposal status is COMMENT_OPEN"
          - "Logical clock date >= comment_opened_at date + 30 days (ERR_COMMENT_PERIOD_TOO_SHORT)"
        side_effects: ["ballot_opened_at := logical clock now"]
      - from: BALLOTING
        to: PASSED
        trigger: "POST /network/rule-proposals/{id}/close-ballot when calculation ballot_outcome_tally yields PASSED_QUORUM"
        actor: PlatformAdmin
        preconditions:
          - "Proposal status is BALLOTING"
          - "Logical clock date >= ballot_opened_at date + 14 days (ERR_BALLOT_PERIOD_NOT_CLOSED)"
        side_effects:
          - "outcome := PASSED_QUORUM; closed tallies frozen"
          - "All ballots of this proposal with status CAST transition to LOCKED"
      - from: BALLOTING
        to: REJECTED
        trigger: "POST /network/rule-proposals/{id}/close-ballot when ballot_outcome_tally yields REJECTED_VOTE or REJECTED_NO_QUORUM"
        actor: PlatformAdmin
        preconditions: ["Same as BALLOTING -> PASSED"]
        side_effects:
          - "outcome := REJECTED_VOTE or REJECTED_NO_QUORUM"
          - "All ballots of this proposal with status CAST transition to LOCKED"
      - from: BALLOTING
        to: RETURNED_FOR_REWORK
        trigger: "POST /network/rule-proposals/{id}/transition {to_state: RETURNED_FOR_REWORK}"
        actor: PlatformAdmin
        preconditions: ["Proposal status is BALLOTING"]
        side_effects: ["All ballots of this proposal with status CAST transition to LOCKED"]
      - from: RETURNED_FOR_REWORK
        to: DRAFT
        trigger: "POST /network/rule-proposals/{id}/transition {to_state: DRAFT}"
        actor: PlatformAdmin
        preconditions: ["Proposal status is RETURNED_FOR_REWORK"]
        side_effects: ["yea_count, nay_count, abstain_count reset to 0; outcome reset to null"]
      - from: PASSED
        to: EFFECTIVE
        trigger: "POST /network/rule-proposals/{id}/transition {to_state: EFFECTIVE}"
        actor: PlatformAdmin
        preconditions:
          - "Proposal status is PASSED"
          - "Logical clock date >= effective_date (ERR_EFFECTIVE_DATE_NOT_REACHED)"
        side_effects:
          - "Every OTHER RuleProposal with the same transaction_code_id and status EFFECTIVE transitions to SUPERSEDED"
      - from: PASSED
        to: RETURNED_FOR_REWORK
        trigger: "POST /network/rule-proposals/{id}/transition {to_state: RETURNED_FOR_REWORK}"
        actor: PlatformAdmin
        preconditions: ["Proposal status is PASSED"]
        side_effects: []

  - entity: Ballot
    initial_state: CAST
    terminal_states: [LOCKED]
    transitions:
      - from: CAST
        to: CAST
        trigger: "PATCH /network/ballots/{id} {vote: <new vote>} — recast"
        actor: VotingDelegate
        preconditions:
          - "Ballot status is CAST"
          - "Ballot's rule proposal status is BALLOTING (ERR_INVALID_STATE)"
          - "X-User-ID equals ballot.participant_id (ERR_FORBIDDEN)"
          - "New vote differs from current vote (ERR_VOTE_UNCHANGED)"
        side_effects:
          - "cast_at := logical clock now"
          - "Proposal tallies updated: old vote's counter decremented, new vote's counter incremented (total cast count unchanged)"
      - from: CAST
        to: LOCKED
        trigger: "system — any close-ballot or RETURNED_FOR_REWORK transition on the parent proposal"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GuidanceDocument
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system — creation of another GuidanceDocument for the same transaction_code_id with supersede_prior=true whose window overlaps this one"
        actor: system
        preconditions: []
        side_effects: ["TransactionCode.version increments by 1"]

  - entity: PaymentEntry
    initial_state: ORIGINATED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: ORIGINATED
        to: SETTLED
        trigger: "POST /network/settlement-windows/{id}/run-settlement for the window this entry is assigned to"
        actor: PlatformAdmin
        preconditions:
          - "Entry status is ORIGINATED"
          - "Entry's settlement_window_id equals the run window"
          - "Logical clock time >= window cutoff_time_utc on the run day (ERR_WINDOW_NOT_CLOSED, enforced on the run call)"
        side_effects:
          - "settled_at := now; settled_date := logical date"
          - "entry_fee_cents := network_settlement_fee(entry); originating participant's current_period_fees_cents accrues the fee (resetting to 0 first when settlement month differs from participant.current_period, then current_period := settlement month)"
          - "Originator committed_exposure_cents decreases by amount_cents (the amount moves into the contingent, returnable set); contingent_exposure_cents unchanged by this transition"
      - from: ORIGINATED
        to: CANCELLED
        trigger: "POST /network/payment-entries/{id}/cancel OR cascade from participant suspension"
        actor: ParticipantOfficer
        preconditions:
          - "Entry status is ORIGINATED"
          - "Manual cancel: X-User-ID equals entry.originating_participant_id (ERR_FORBIDDEN)"
        side_effects:
          - "Originator committed_exposure_cents and contingent_exposure_cents each decrease by amount_cents (compensating invariant: originate + cancel restores exposure)"
      - from: SETTLED
        to: RETURNED
        trigger: "POST /network/payment-entries/{id}/returns"
        actor: ParticipantOfficer
        preconditions:
          - "Entry status is SETTLED (ERR_ENTRY_NOT_SETTLED)"
          - "Logical banking-day count from settled_date to today <= transaction_code.return_timeframe_banking_days (ERR_RETURN_WINDOW_EXPIRED)"
          - "X-User-ID != entry.originating_participant_id (ERR_RETURN_PARTICIPANT_CONFLICT)"
          - "Returning participant status is ACTIVE (ERR_PARTICIPANT_NOT_ACTIVE)"
        side_effects:
          - "CASCADE link 1: a ReturnRecord is created with reason_class derived from reason_code"
          - "CASCADE link 2 (via link 1): the entry's amount leaves the returnable set, so the originator's contingent_exposure_cents decreases by amount_cents"

  - entity: InquiryCase
    initial_state: OPENED
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: OPENED
        to: RESPONSE_SUBMITTED
        trigger: "POST /network/inquiry-cases/{id}/respond {response_text}"
        actor: ParticipantOfficer
        preconditions:
          - "Inquiry status is OPENED"
          - "X-User-ID equals inquiry.participant_id (ERR_FORBIDDEN)"
        side_effects: ["response_text recorded"]
      - from: RESPONSE_SUBMITTED
        to: RESOLVED
        trigger: "POST /network/inquiry-cases/{id}/resolve"
        actor: PlatformAdmin
        preconditions: ["Inquiry status is RESPONSE_SUBMITTED"]
        side_effects: []
      - from: OPENED
        to: ESCALATED
        trigger: "POST /network/inquiry-cases/{id}/escalate"
        actor: PlatformAdmin
        preconditions:
          - "Inquiry status is OPENED"
          - "Logical clock now > response_deadline (ERR_RESPONSE_DEADLINE_NOT_PASSED)"
        side_effects:
          - "Creates an EnforcementAction: participant_id and return_class-derived violation_code copied (UNAUTHORIZED -> EXCESSIVE_UNAUTHORIZED_RETURNS, ADMINISTRATIVE -> EXCESSIVE_ADMINISTRATIVE_RETURNS, OVERALL -> EXCESSIVE_UNAUTHORIZED_RETURNS), inquiry_case_id set, escalated_by_user_id := X-User-ID, status ISSUED"
      - from: RESPONSE_SUBMITTED
        to: ESCALATED
        trigger: "POST /network/inquiry-cases/{id}/escalate"
        actor: PlatformAdmin
        preconditions: ["Inquiry status is RESPONSE_SUBMITTED"]
        side_effects: ["Same EnforcementAction creation as OPENED -> ESCALATED"]

  - entity: EnforcementAction
    initial_state: ISSUED
    terminal_states: [WITHDRAWN, PAID]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /network/enforcement-actions/{id}/transition {to_state: CONTESTED}"
        actor: PlatformAdmin
        preconditions: ["Action status is ISSUED"]
        side_effects: []
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /network/enforcement-actions/{id}/transition {to_state: UPHELD}"
        actor: PlatformAdmin
        preconditions:
          - "Action status is CONTESTED"
          - "escalated_by_user_id is null OR X-User-ID != escalated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If the participant's cumulative count of actions with status IN {UPHELD, PAID} (this action included) >= 3, the participant transitions ACTIVE -> SUSPENDED with the full Participant-suspension cascade (originators -> SUSPENDED, their ORIGINATED entries -> CANCELLED with exposure release)"
      - from: ISSUED
        to: UPHELD
        trigger: "POST /network/enforcement-actions/{id}/transition {to_state: UPHELD}"
        actor: PlatformAdmin
        preconditions:
          - "Action status is ISSUED"
          - "escalated_by_user_id is null OR X-User-ID != escalated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["Same suspension cascade as CONTESTED -> UPHELD"]
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /network/enforcement-actions/{id}/transition {to_state: WITHDRAWN}"
        actor: PlatformAdmin
        preconditions: ["Action status is ISSUED"]
        side_effects: []
      - from: CONTESTED
        to: WITHDRAWN
        trigger: "POST /network/enforcement-actions/{id}/transition {to_state: WITHDRAWN}"
        actor: PlatformAdmin
        preconditions: ["Action status is CONTESTED"]
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /network/enforcement-actions/{id}/transition {to_state: PAID}"
        actor: PlatformAdmin
        preconditions: ["Action status is ISSUED"]
        side_effects:
          - "fine_total_cents := min(fine_base_cents + LATE_DAILY_CENTS * max(0, (paid date - issued_date).days - 30), 100000000); paid_at := now"
      - from: UPHELD
        to: PAID
        trigger: "POST /network/enforcement-actions/{id}/transition {to_state: PAID}"
        actor: PlatformAdmin
        preconditions: ["Action status is UPHELD"]
        side_effects: ["Same fine_total_cents computation as ISSUED -> PAID"]

  - entity: ComplianceAttestation
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /network/attestations/{id}/transition {to_state: SUBMITTED, attestation_text}"
        actor: ParticipantOfficer
        preconditions:
          - "Attestation status is PENDING or OVERDUE"
          - "X-User-ID equals attestation.participant_id (ERR_FORBIDDEN)"
        side_effects: ["submitted_at := now; late_submission := (logical date > due_date)"]
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /network/attestations/{id}/transition {to_state: SUBMITTED, attestation_text}"
        actor: ParticipantOfficer
        preconditions: ["Same as PENDING -> SUBMITTED"]
        side_effects: ["submitted_at := now; late_submission := true (date necessarily past due_date)"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /network/attestations/{id}/transition {to_state: SUBMITTED, attestation_text}"
        actor: ParticipantOfficer
        preconditions: ["Same as PENDING -> SUBMITTED"]
        side_effects: ["submitted_at := now; late_submission recomputed against due_date"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /network/attestations/{id}/transition {to_state: ACCEPTED}"
        actor: PlatformAdmin
        preconditions:
          - "Attestation status is SUBMITTED"
          - "No EnforcementAction of this participant has status IN {ISSUED, CONTESTED} (ERR_UNRESOLVED_ENFORCEMENT)"
          - "The participant has at least one AuditReport with status COMPLETED and end_date >= (period_year)-01-01 (ERR_AUDIT_REQUIRED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network/attestations/{id}/transition {to_state: REJECTED}"
        actor: PlatformAdmin
        preconditions: ["Attestation status is SUBMITTED"]
        side_effects: []

  - entity: AuditReport
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /network/audits/{id}/transition {to_state: IN_PROGRESS}"
        actor: Auditor
        preconditions:
          - "Audit status is SCHEDULED"
          - "Logical date >= start_date (ERR_AUDIT_NOT_STARTED)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /network/audits/{id}/transition {to_state: COMPLETED, findings_count}"
        actor: Auditor
        preconditions:
          - "Audit status is IN_PROGRESS"
          - "Logical date >= start_date"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["completed_by_user_id := X-User-ID"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /network/audits/{id}/transition {to_state: CANCELLED}"
        actor: Auditor
        preconditions: ["Audit status is SCHEDULED"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: occ-exposure-limit-update
    parent_entity: Originator
    write_endpoint: "PATCH /network/originators/{id}/exposure-limit"
    occ_field: expected_originator_version
    description: |
      Updating an Originator's exposure_limit_cents is rejected when the
      request's expected_originator_version does not equal the originator's
      current version. Entry origination, settlement, cancellation, and
      returns all advance the originator's version as they move exposure,
      so a limit update written against a previously observed version is
      stale and must be rejected rather than applied over moved ground.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-guidance-supersede
    parent_entity: TransactionCode
    write_endpoint: "POST /network/guidance-documents"
    occ_field: expected_transaction_code_version
    description: |
      Creating a GuidanceDocument with supersede_prior=true retires the
      overlapping PUBLISHED guidance of the same transaction code; the
      request is rejected when expected_transaction_code_version does not
      equal the transaction code's current version, because a prior
      supersede has already advanced it and the caller's view of which
      guidance is current is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ballot_outcome_tally
    trigger: "POST /network/rule-proposals/{id}/close-ballot"
    algorithm: threshold
    formula: |
      eligible := count(Participant where status == ACTIVE at close time)
      cast := count(Ballot of this proposal with status CAST)
      quorum_met := cast >= ceil(eligible * QUORUM_NUM / QUORUM_DEN)
      if not quorum_met: outcome = REJECTED_NO_QUORUM
      else:
        non_abstain := yea_count + nay_count
        if non_abstain == 0: outcome = REJECTED_VOTE
        elif yea_count * APPROVAL_DEN >= non_abstain * APPROVAL_NUM: outcome = PASSED_QUORUM
        else: outcome = REJECTED_VOTE
      # integer cross-multiplication only; no floating point, no rounding
    input_set: "Ballots with status CAST belonging to the proposal at close time; Participants with status ACTIVE at close time"
    constants:
      QUORUM_NUM: 1
      QUORUM_DEN: 2
      APPROVAL_NUM: 2
      APPROVAL_DEN: 3
    precision: "exact integer arithmetic; rational comparisons via cross-multiplication"

  - name: return_rate_computation
    trigger: "POST /network/return-rate-snapshots (computes and freezes a ReturnRateSnapshot)"
    algorithm: aggregation
    formula: |
      forward_count := count(entries of participant with settled_date in period)
      origination_forward_count := count(entries of participant with created date in period)
      unauth_return_count := count(ReturnRecords created in period, class UNAUTHORIZED, entry owned by participant)
      admin_return_count / other_return_count likewise for their classes
      origination_unauth_count := count(ReturnRecords created in period, class UNAUTHORIZED, whose entry's created date is in period)
      origination_admin_count likewise
      settlement_unauth_rate := round_half_up(unauth_return_count / forward_count, 4) or 0.0 if forward_count == 0
      settlement_admin_rate / settlement_overall_rate likewise
      origination_unauth_rate / origination_admin_rate likewise over origination denominators
      unauth_breach := forward_count > 0 AND unauth_return_count * 100 > forward_count * 10
      admin_breach  := forward_count > 0 AND admin_return_count * 100 > forward_count * 20
      overall_breach := forward_count > 0 AND (unauth+admin+other)_return_count * 100 > forward_count * 25
      # breach comparisons are exact integer cross-multiplication; strictly greater than
    input_set: "PaymentEntry with originating_participant_id = participant; ReturnRecord whose payment_entry belongs to that participant. Period boundary: a timestamp is in period YYYY-MM iff its UTC year-month equals period (settled_date for denominators, returned_at for settlement numerators, entry created date for origination basis)."
    constants:
      UNAUTH_THRESHOLD_PCT: 10
      ADMIN_THRESHOLD_PCT: 20
      OVERALL_THRESHOLD_PCT: 25
      INQUIRY_RESPONSE_DAYS: 14
    precision: "rates 4 decimal places round_half_up; breach flags by exact integer comparison (no float)"
    variants:
      - name: settlement_basis
        when: "Official threshold basis — drives unauth_breach/admin_breach/overall_breach and therefore inquiry auto-opening"
        difference: "Numerator counts returns received in the period regardless of when the underlying entry was originated; denominator counts entries settled in the period"
      - name: origination_basis
        when: "Recorded on the same snapshot for enforcement severity review"
        difference: "Numerator counts only returns whose underlying entry was originated in the period; denominator counts entries originated in the period — a late-arriving return of an old entry moves settlement_basis but not origination_basis"

  - name: exposure_position
    trigger: "On every PaymentEntry creation (admission check), and recomputed on settle / cancel / return / cascade-cancel"
    algorithm: forward_looking
    formula: |
      committed := sum(amount_cents of originator's entries with status ORIGINATED)
      returnable := sum(amount_cents of originator's entries with status SETTLED
                       whose return deadline (settled_date + code.return_timeframe_banking_days,
                       banking days Mon-Fri) is >= today's logical date)
      contingent := committed + returnable
      admission of a candidate entry of amount A:
        step 1: compute contingent BEFORE adding the candidate (pinned evaluation order)
        step 2: admit iff contingent + A <= exposure_limit_cents
        # pinned order resolves the circular-looking dependency between the
        # exposure figure and the entry that would itself change the figure
    input_set: "Entries of the originator; statuses ORIGINATED (committed) and SETTLED-with-unexpired-window (returnable) only; RETURNED and CANCELLED entries contribute 0"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: committed_basis
        when: "Reported as committed_exposure_cents on the Originator resource"
        difference: "Counts only ORIGINATED entries; a settled-but-still-returnable entry drops out of this figure"
      - name: contingent_basis
        when: "Used by the admission check and reported as contingent_exposure_cents"
        difference: "Adds the returnable SETTLED entries, so the same book of business reads higher until return windows expire"

  - name: enforcement_fine_schedule
    trigger: "EnforcementAction creation (fine_base_cents) and the -> PAID transition (fine_total_cents)"
    algorithm: tiered_pricing
    formula: |
      tier := min(count(prior actions of participant with status IN {UPHELD, PAID} at creation), 3)
      mult := 1.0 if participant_type == ODFI else 0.5 if RDFI else 1.5  # BOTH
      fine_base_cents := min(BASE_BY_TIER[tier] * mult, STATUTORY_CAP_CENTS)
      at PAID: days_overdue := max(0, (paid_date - issued_date).days - LATE_GRACE_DAYS)
      fine_total_cents := min(fine_base_cents + LATE_DAILY_CENTS * days_overdue, STATUTORY_CAP_CENTS)
    input_set: "EnforcementActions of the same participant; participant_type of the participant; logical dates"
    constants:
      BASE_BY_TIER: [5000000, 10000000, 25000000, 50000000]
      LATE_GRACE_DAYS: 30
      LATE_DAILY_CENTS: 100000
      STATUTORY_CAP_CENTS: 100000000
    precision: "integer cents; tier*mult products are exact integers for all three multipliers"

  - name: network_settlement_fee
    trigger: "Per entry at the ORIGINATED -> SETTLED transition; accrued onto Participant.current_period_fees_cents"
    algorithm: aggregation
    formula: |
      per entry: raw := amount_cents * FEE_NUM / FEE_DEN
      entry_fee_cents := max(round_half_up(raw), MIN_FEE_CENTS) + (SAME_DAY_SURCHARGE_CENTS if same_day else 0)
      # PINNED ROUNDING ORDER: round per entry, THEN sum into the period accumulator.
      # (Sum-then-round across entries is a different, rejected reading.)
      participant accrual: if settlement month != participant.current_period:
          current_period := settlement month; current_period_fees_cents := 0
        then current_period_fees_cents += entry_fee_cents
    input_set: "The single settling entry; the originating participant's current_period accumulator"
    constants:
      FEE_NUM: 5
      FEE_DEN: 10000000
      MIN_FEE_CENTS: 1
      SAME_DAY_SURCHARGE_CENTS: 50
    precision: "round_half_up to integer cents per entry before accumulation"

  - name: same_day_window_assignment
    trigger: "POST /network/payment-entries with same_day=true (eligibility check) and same_day=false (automatic assignment)"
    algorithm: threshold
    formula: |
      eligible window for a same_day entry requesting window W:
        now time < W.cutoff_time_utc today (else ERR_WINDOW_CUTOFF_PASSED)
        amount_cents <= W.per_entry_limit_cents (else ERR_SAME_DAY_ENTRY_LIMIT_EXCEEDED; equal is allowed)
        odfi_used := sum(amount_cents of this participant's same-day entries assigned to W
                         with status IN {ORIGINATED, SETTLED} created on today's logical date)
        odfi_used + amount_cents <= W.odfi_window_cap_cents (else ERR_WINDOW_CAPACITY_EXCEEDED; exactly-at-cap allowed)
      automatic assignment for same_day=false:
        candidate set := all SettlementWindows
        rank by cutoff_time_utc ASC; tie-break by window created_at ASC
        pick the first candidate (the earliest-cutoff window)
    input_set: "SettlementWindows; the participant's same-day entries created on the current logical date with status IN {ORIGINATED, SETTLED}"
    constants: {}
    precision: "integer cents; time comparison HH:MM UTC to the minute"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules)
# =============================================================================
validations:
- priority: 1
  category: auth
  check: X-User-Role and X-User-ID headers present; X-User-Role is a declared role
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all
- priority: 2
  category: auth
  check: The declared role is listed for this endpoint; for entity_backed roles acting on owned resources, X-User-ID equals
    the owning participant id (originator create/transition/limit-patch, entry create/cancel, ballot cast/recast, inquiry
    respond, attestation submit)
  error_id: ERR_FORBIDDEN
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: 'Request shape: required fields present, enums in range, amount_cents > 0, dates parse, effective_date strictly after
    creation date, effective_until null or after effective_from, end_date >= start_date, exposure_limit_cents > 0'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all
- priority: 4
  category: existence
  check: 'Every id referenced in the path or body exists: participant, originator, transaction code, settlement window, rule
    proposal, ballot, guidance document, payment entry, snapshot, inquiry, enforcement action, attestation, audit'
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all
- priority: 5
  category: existence
  check: routing_number on participant create and code on transaction-code create are unique network-wide; one Ballot per
    (rule_proposal_id, participant_id); one ReturnRateSnapshot per (participant_id, period); one ComplianceAttestation per
    (participant_id, period_year)
  error_id: ERR_DUPLICATE_RESOURCE
  http_status: 409
  applies_to: POST /network/participants, POST /network/transaction-codes, POST /network/rule-proposals/{id}/ballots, POST
    /network/return-rate-snapshots, POST /network/attestations
- priority: 6
  category: state
  check: Target entity is in a state that permits the requested transition, per the §1.2 state machines (wrong from-state)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all transition / action endpoints
- priority: 7
  category: state
  check: 'Entry create: the originator''s participant status is ACTIVE; return create: the returning participant status is
    ACTIVE; ballot cast: the voting participant status is ACTIVE; originator approve/reinstate: its participant is ACTIVE'
  error_id: ERR_PARTICIPANT_NOT_ACTIVE
  http_status: 409
  applies_to: POST /network/payment-entries, POST /network/payment-entries/{id}/returns, POST /network/rule-proposals/{id}/ballots,
    POST /network/originators/{id}/transition
- priority: 8
  category: state
  check: 'Entry create: the originator status is APPROVED'
  error_id: ERR_ORIGINATOR_NOT_APPROVED
  http_status: 409
  applies_to: POST /network/payment-entries
- priority: 9
  category: state
  check: 'Return create: the entry status is SETTLED'
  error_id: ERR_ENTRY_NOT_SETTLED
  http_status: 409
  applies_to: POST /network/payment-entries/{id}/returns
- priority: 10
  category: business_safety
  check: 'Entry create on a transaction code with account_validation_required=true: a VALID AccountValidation exists for (originator_id,
    receiver_account_number_hash) — validated_until >= logical date'
  error_id: ERR_ACCOUNT_VALIDATION_REQUIRED
  http_status: 422
  applies_to: POST /network/payment-entries
- priority: 11
  category: business_safety
  check: 'Segregation of duties: UPHELD transition refused when escalated_by_user_id is non-null and equals X-User-ID; audit
    COMPLETED refused when X-User-ID equals created_by_user_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /network/enforcement-actions/{id}/transition, POST /network/audits/{id}/transition
- priority: 12
  category: business_constraint
  check: 'Entry create: authorization_type equals the transaction code''s authorization_requirement, unless the requirement
    is NONE (any authorization_type accepted)'
  error_id: ERR_AUTHORIZATION_REQUIREMENT_VIOLATION
  http_status: 422
  applies_to: POST /network/payment-entries
- priority: 13
  category: business_constraint
  check: 'Return create: X-User-ID differs from the entry''s originating_participant_id'
  error_id: ERR_RETURN_PARTICIPANT_CONFLICT
  http_status: 422
  applies_to: POST /network/payment-entries/{id}/returns
- priority: 14
  category: business_constraint
  check: 'Guidance create: no PUBLISHED guidance of the same transaction_code_id has an effective window overlapping the new
    [effective_from, effective_until) half-open window (shared endpoint date is NOT an overlap), unless supersede_prior=true'
  error_id: ERR_GUIDANCE_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /network/guidance-documents
- priority: 15
  category: business_constraint
  check: 'Guidance create: rule_proposal.status is EFFECTIVE and the body''s transaction_code_id equals the proposal''s transaction_code_id'
  error_id: ERR_PROPOSAL_NOT_EFFECTIVE
  http_status: 409
  applies_to: POST /network/guidance-documents
- priority: 16
  category: business_constraint
  check: 'Audit create: no other AuditReport of the same participant with status IN {SCHEDULED, IN_PROGRESS} has a CLOSED
    interval [start_date, end_date] intersecting the new one (sharing a boundary date IS an overlap)'
  error_id: ERR_AUDIT_WINDOW_OVERLAP
  http_status: 409
  applies_to: POST /network/audits
- priority: 17
  category: business_constraint
  check: 'Recast: the new vote differs from the ballot''s current vote'
  error_id: ERR_VOTE_UNCHANGED
  http_status: 422
  applies_to: PATCH /network/ballots/{id}
- priority: 18
  category: business_temporal
  check: 'Return create: banking days (Mon-Fri) from settled_date to the logical date <= transaction_code.return_timeframe_banking_days'
  error_id: ERR_RETURN_WINDOW_EXPIRED
  http_status: 409
  applies_to: POST /network/payment-entries/{id}/returns
- priority: 19
  category: business_temporal
  check: Rule proposal COMMENT_OPEN -> BALLOTING requires logical date >= comment_opened_at date + 30 days
  error_id: ERR_COMMENT_PERIOD_TOO_SHORT
  http_status: 422
  applies_to: POST /network/rule-proposals/{id}/transition
- priority: 20
  category: business_temporal
  check: close-ballot requires logical date >= ballot_opened_at date + 14 days
  error_id: ERR_BALLOT_PERIOD_NOT_CLOSED
  http_status: 422
  applies_to: POST /network/rule-proposals/{id}/close-ballot
- priority: 21
  category: business_temporal
  check: PASSED -> EFFECTIVE requires logical date >= effective_date
  error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
  http_status: 422
  applies_to: POST /network/rule-proposals/{id}/transition
- priority: 22
  category: business_temporal
  check: run-settlement requires the logical time to be at or after the window's cutoff_time_utc on the current logical date
  error_id: ERR_WINDOW_NOT_CLOSED
  http_status: 409
  applies_to: POST /network/settlement-windows/{id}/run-settlement
- priority: 23
  category: business_temporal
  check: 'Same-day entry create: the requested window''s cutoff_time_utc is strictly after the current logical time'
  error_id: ERR_WINDOW_CUTOFF_PASSED
  http_status: 422
  applies_to: POST /network/payment-entries
- priority: 24
  category: business_temporal
  check: Inquiry escalate from OPENED requires logical now > response_deadline
  error_id: ERR_RESPONSE_DEADLINE_NOT_PASSED
  http_status: 409
  applies_to: POST /network/inquiry-cases/{id}/escalate
- priority: 25
  category: business_fiscal
  check: 'Same-day entry create: amount_cents <= window.per_entry_limit_cents (equal allowed)'
  error_id: ERR_SAME_DAY_ENTRY_LIMIT_EXCEEDED
  http_status: 422
  applies_to: POST /network/payment-entries
- priority: 26
  category: business_fiscal
  check: 'Same-day entry create: participant''s same-day used amount in the window today + amount_cents <= window.odfi_window_cap_cents
    (equal allowed)'
  error_id: ERR_WINDOW_CAPACITY_EXCEEDED
  http_status: 422
  applies_to: POST /network/payment-entries
- priority: 27
  category: business_fiscal
  check: 'Entry create: originator contingent_exposure_cents + amount_cents <= exposure_limit_cents (equal allowed), evaluated
    per exposure_position''s pinned order'
  error_id: ERR_EXPOSURE_LIMIT_EXCEEDED
  http_status: 422
  applies_to: POST /network/payment-entries
- priority: 28
  category: business_constraint
  check: Attestation ACCEPTED requires no EnforcementAction of the participant with status IN {ISSUED, CONTESTED}, and at
    least one COMPLETED audit with end_date >= period_year-01-01
  error_id: ERR_UNRESOLVED_ENFORCEMENT
  http_status: 422
  applies_to: POST /network/attestations/{id}/transition
- priority: 29
  category: business_constraint
  check: Attestation ACCEPTED audit precondition missing (no COMPLETED audit with end_date >= period_year-01-01) when no enforcement
    violation is present
  error_id: ERR_AUDIT_REQUIRED
  http_status: 422
  applies_to: POST /network/attestations/{id}/transition
- priority: 30
  category: business_temporal
  check: Audit IN_PROGRESS requires logical date >= start_date
  error_id: ERR_AUDIT_NOT_STARTED
  http_status: 422
  applies_to: POST /network/audits/{id}/transition
- priority: 31
  category: state
  check: 'OCC: expected_originator_version / expected_transaction_code_version equals the entity''s current version. Evaluated
    LAST on the OCC endpoints — after existence, state, and business rules — so a request that fails both a business rule
    and the version check reports the business error.'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: PATCH /network/originators/{id}/exposure-limit, POST /network/guidance-documents
# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint: sets the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and the logical clock NEVER falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Lazy state derivations (AccountValidation EXPIRED, ComplianceAttestation OVERDUE) evaluate against the new time on next read/write"]
  - method: POST
    path: /network/participants
    description: "Register a member institution; initial status ONBOARDING"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, participant_type, routing_number]
    output: Participant
    side_effects: []
  - method: GET
    path: /network/participants/{id}
    description: "Read one participant"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: GET
    path: /network/participants
    description: "List participants with pagination"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["status?", "participant_type?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: POST
    path: /network/participants/{id}/transition
    description: "Drive Participant state machine: to_state ACTIVE | SUSPENDED | TERMINATED"
    roles: [PlatformAdmin]
    code: 200
    input: [to_state]
    output: Participant
    side_effects: ["ACTIVE->SUSPENDED cascades to originators and their ORIGINATED entries; ->TERMINATED cascades to originators; SUSPENDED->ACTIVE blocked by unresolved enforcement"]
  - method: POST
    path: /network/originators
    description: "Register a third-party sender under the acting participant (participant_id := X-User-ID); initial status PENDING_DUE_DILIGENCE"
    roles: [ParticipantOfficer]
    code: 201
    input: [legal_name, risk_tier, exposure_limit_cents]
    output: Originator
    side_effects: []
  - method: GET
    path: /network/originators/{id}
    description: "Read one originator including computed exposure fields"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: Originator
    side_effects: []
  - method: GET
    path: /network/originators
    description: "List originators, filterable by owning participant"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: Originator[]
    side_effects: []
  - method: POST
    path: /network/originators/{id}/transition
    description: "Drive Originator state machine: to_state APPROVED | SUSPENDED | TERMINATED"
    roles: [ParticipantOfficer]
    code: 200
    input: [to_state]
    output: Originator
    side_effects: []
  - method: PATCH
    path: /network/originators/{id}/exposure-limit
    description: "Update exposure_limit_cents under OCC: expected_originator_version must equal the originator's current version"
    roles: [ParticipantOfficer]
    code: 200
    input: [exposure_limit_cents, expected_originator_version]
    output: Originator
    side_effects: ["increments Originator.version by 1"]
  - method: POST
    path: /network/transaction-codes
    description: "Define an entry class (authorization requirement, return timeframe, warranty obligations, account-validation flag)"
    roles: [PlatformAdmin]
    code: 201
    input: [code, entry_class, authorization_requirement, return_timeframe_banking_days, account_validation_required, warranty_obligations]
    output: TransactionCode
    side_effects: []
  - method: GET
    path: /network/transaction-codes/{id}
    description: "Read one transaction code"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: TransactionCode
    side_effects: []
  - method: GET
    path: /network/transaction-codes
    description: "List transaction codes"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: TransactionCode[]
    side_effects: []
  - method: POST
    path: /network/rule-proposals
    description: "File a rule change proposal against a transaction code; initial status DRAFT"
    roles: [PlatformAdmin]
    code: 201
    input: [transaction_code_id, title, summary, effective_date]
    output: RuleProposal
    side_effects: []
  - method: GET
    path: /network/rule-proposals/{id}
    description: "Read one rule proposal including live tallies and outcome"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: RuleProposal
    side_effects: []
  - method: GET
    path: /network/rule-proposals
    description: "List rule proposals"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["status?", "transaction_code_id?", "limit?", "offset?"]
    output: RuleProposal[]
    side_effects: []
  - method: POST
    path: /network/rule-proposals/{id}/transition
    description: "Drive RuleProposal: to_state COMMENT_OPEN | BALLOTING | RETURNED_FOR_REWORK | DRAFT | EFFECTIVE"
    roles: [PlatformAdmin]
    code: 200
    input: [to_state]
    output: RuleProposal
    side_effects: ["COMMENT_OPEN stamps comment_opened_at; BALLOTING stamps ballot_opened_at and enforces 30-day comment period; EFFECTIVE enforces effective_date and supersedes prior EFFECTIVE proposals of the same transaction code"]
  - method: POST
    path: /network/rule-proposals/{id}/close-ballot
    description: "Close balloting after the 14-day ballot period; computes ballot_outcome_tally, sets outcome, moves proposal to PASSED or REJECTED, locks ballots"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RuleProposal
    side_effects: ["outcome per ballot_outcome_tally; all CAST ballots -> LOCKED"]
  - method: POST
    path: /network/rule-proposals/{id}/ballots
    description: "Cast a ballot; one per (proposal, participant); voter must be ACTIVE"
    roles: [VotingDelegate]
    code: 201
    input: [vote]
    output: Ballot
    side_effects: ["increments the matching proposal tally counter"]
  - method: PATCH
    path: /network/ballots/{id}
    description: "Recast a ballot while the proposal is BALLOTING; vote must change"
    roles: [VotingDelegate]
    code: 200
    input: [vote]
    output: Ballot
    side_effects: ["decrements old vote's counter, increments new vote's counter; total cast count unchanged; increments Ballot.version by 1"]
  - method: GET
    path: /network/ballots/{id}
    description: "Read one ballot"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: Ballot
    side_effects: []
  - method: GET
    path: /network/ballots
    description: "List ballots filtered by proposal and/or voter"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["rule_proposal_id?", "participant_id?", "limit?", "offset?"]
    output: Ballot[]
    side_effects: []
  - method: POST
    path: /network/guidance-documents
    description: "Publish implementation guidance for an EFFECTIVE rule; half-open window overlap with existing PUBLISHED guidance of the same transaction code is rejected unless supersede_prior=true (OCC: expected_transaction_code_version)"
    roles: [PlatformAdmin]
    code: 201
    input: [rule_proposal_id, transaction_code_id, title, body_ref, effective_from, effective_until, supersede_prior, expected_transaction_code_version]
    output: GuidanceDocument
    side_effects: ["when supersede_prior=true, overlapping PUBLISHED guidance documents of the same transaction code -> SUPERSEDED; increments TransactionCode.version by 1"]
  - method: GET
    path: /network/guidance-documents/{id}
    description: "Read one guidance document"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: GuidanceDocument
    side_effects: []
  - method: GET
    path: /network/guidance-documents
    description: "List guidance documents filtered by rule proposal and/or transaction code"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["rule_proposal_id?", "transaction_code_id?", "status?", "limit?", "offset?"]
    output: GuidanceDocument[]
    side_effects: []

  - method: POST
    path: /network/settlement-windows
    description: "Seed a same-day settlement window (code, cutoff, per-entry limit, per-ODFI window cap)"
    roles: [PlatformAdmin]
    code: 201
    input: [window_code, cutoff_time_utc, per_entry_limit_cents, odfi_window_cap_cents]
    output: SettlementWindow
    side_effects: []
  - method: GET
    path: /network/settlement-windows
    description: "List settlement windows"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: SettlementWindow[]
    side_effects: []
  - method: POST
    path: /network/payment-entries
    description: "Originate an entry. same_day=true requires settlement_window_id and runs the same-day eligibility chain (cutoff, per-entry limit, ODFI window cap); same_day=false auto-assigns the earliest-cutoff window. Always runs account-validation, authorization-match, and exposure admission checks."
    roles: [ParticipantOfficer]
    code: 201
    input: [originator_id, transaction_code_id, amount_cents, receiver_account_number_hash, receiver_name, authorization_type, "same_day?", "settlement_window_id?"]
    output: PaymentEntry
    side_effects: ["Originator committed_exposure_cents and contingent_exposure_cents each increase by amount_cents; increments Originator.version by 1"]
  - method: GET
    path: /network/payment-entries/{id}
    description: "Read one payment entry"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: PaymentEntry
    side_effects: []
  - method: GET
    path: /network/payment-entries
    description: "List payment entries with filters"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["originator_id?", "originating_participant_id?", "transaction_code_id?", "settlement_window_id?", "status?", "limit?", "offset?"]
    output: PaymentEntry[]
    side_effects: []
  - method: POST
    path: /network/payment-entries/{id}/cancel
    description: "Cancel an ORIGINATED entry; releases exposure (compensating invariant)"
    roles: [ParticipantOfficer]
    code: 200
    input: []
    output: PaymentEntry
    side_effects: ["Originator committed_exposure_cents and contingent_exposure_cents each decrease by amount_cents; increments Originator.version by 1"]
  - method: POST
    path: /network/settlement-windows/{id}/run-settlement
    description: "Settle all ORIGINATED entries assigned to this window, at or after the window cutoff on the current logical date; computes per-entry fees and accrues them to each originating participant's current_period_fees_cents"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { settled_count: integer, settled_entry_ids: "string[]" }
    side_effects: ["Each settled entry: settled_at/settled_date stamped, entry_fee_cents computed per network_settlement_fee, originator exposure moves committed -> contingent (committed decreases, contingent unchanged), participant fee accrual with monthly reset"]
  - method: POST
    path: /network/payment-entries/{id}/returns
    description: "Return a SETTLED entry within its transaction code's banking-day timeframe; reason_class is derived from reason_code"
    roles: [ParticipantOfficer]
    code: 201
    input: [reason_code]
    output: ReturnRecord
    side_effects: ["Entry -> RETURNED; originator contingent_exposure_cents decreases by amount_cents; increments PaymentEntry.version and Originator.version by 1"]
  - method: GET
    path: /network/payment-entries/{id}/returns
    description: "List returns of one entry (0 or 1 element)"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ReturnRecord[]
    side_effects: []
  - method: GET
    path: /network/participants/{id}/returns
    description: "List return records filed by one participant (the receiving side's view)"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ReturnRecord[]
    side_effects: []
  - method: POST
    path: /network/account-validations
    description: "Record an account validation for (originator, account hash) using an acceptable verification method; validated_until = creation date + 365 days"
    roles: [ParticipantOfficer]
    code: 201
    input: [originator_id, account_number_hash, method]
    output: AccountValidation
    side_effects: []
  - method: GET
    path: /network/account-validations/{id}
    description: "Read one account validation (status VALID/EXPIRED derived on read)"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: AccountValidation
    side_effects: []
  - method: GET
    path: /network/account-validations
    description: "List account validations filtered by originator"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["originator_id?", "limit?", "offset?"]
    output: AccountValidation[]
    side_effects: []
  - method: POST
    path: /network/return-rate-snapshots
    description: "Compute and freeze a participant's return-rate snapshot for a period (return_rate_computation); auto-opens an InquiryCase per breached class when no OPEN inquiry already exists for (participant, period, class)"
    roles: [PlatformAdmin]
    code: 201
    input: [participant_id, period]
    output: ReturnRateSnapshot
    side_effects: ["For each breached class (unauth_breach, admin_breach, overall_breach) with no existing inquiry of status IN {OPENED, RESPONSE_SUBMITTED} for (participant, period, class): create InquiryCase OPENED with response_deadline = now + 14 days"]
  - method: GET
    path: /network/return-rate-snapshots/{id}
    description: "Read one snapshot"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: ReturnRateSnapshot
    side_effects: []
  - method: GET
    path: /network/return-rate-snapshots
    description: "List snapshots filtered by participant and period"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["participant_id?", "period?", "limit?", "offset?"]
    output: ReturnRateSnapshot[]
    side_effects: []
  - method: GET
    path: /network/inquiry-cases/{id}
    description: "Read one inquiry case"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: InquiryCase
    side_effects: []
  - method: GET
    path: /network/inquiry-cases
    description: "List inquiry cases filtered by participant, snapshot, status"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["participant_id?", "return_rate_snapshot_id?", "status?", "limit?", "offset?"]
    output: InquiryCase[]
    side_effects: []
  - method: POST
    path: /network/inquiry-cases/{id}/respond
    description: "Participant submits remediation response (OPENED -> RESPONSE_SUBMITTED)"
    roles: [ParticipantOfficer]
    code: 200
    input: [response_text]
    output: InquiryCase
    side_effects: []
  - method: POST
    path: /network/inquiry-cases/{id}/resolve
    description: "Network closes the inquiry with no enforcement (RESPONSE_SUBMITTED -> RESOLVED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: InquiryCase
    side_effects: []
  - method: POST
    path: /network/inquiry-cases/{id}/escalate
    description: "Escalate to national enforcement: creates an ISSUED EnforcementAction; from OPENED requires response_deadline passed; records escalated_by_user_id"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["InquiryCase -> ESCALATED; EnforcementAction created with inquiry_case_id set and escalated_by_user_id := X-User-ID"]
  - method: POST
    path: /network/enforcement-actions
    description: "Directly file an enforcement action (e.g. LATE_ATTESTATION, MISSING_ACCOUNT_VALIDATION); escalation_tier and fine_base_cents computed at creation"
    roles: [PlatformAdmin]
    code: 201
    input: [participant_id, violation_code, "inquiry_case_id?"]
    output: EnforcementAction
    side_effects: ["escalation_tier := min(prior UPHELD/PAID count, 3); fine_base_cents per enforcement_fine_schedule; escalated_by_user_id stays null"]
  - method: GET
    path: /network/enforcement-actions/{id}
    description: "Read one enforcement action"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []
  - method: GET
    path: /network/enforcement-actions
    description: "List enforcement actions filtered by participant, inquiry, status"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["participant_id?", "inquiry_case_id?", "status?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []
  - method: POST
    path: /network/enforcement-actions/{id}/transition
    description: "Drive EnforcementAction: to_state CONTESTED | UPHELD | WITHDRAWN | PAID. UPHELD enforces segregation of duties and fires the suspension cascade at cumulative upheld/paid count >= 3; PAID computes fine_total_cents with late accrual"
    roles: [PlatformAdmin]
    code: 200
    input: [to_state]
    output: EnforcementAction
    side_effects: ["UPHELD may cascade: participant SUSPENDED -> originators SUSPENDED -> ORIGINATED entries CANCELLED; PAID computes and freezes fine_total_cents"]
  - method: POST
    path: /network/attestations
    description: "Open the annual compliance attestation for (participant, period_year); due_date computed as (period_year+1)-03-01"
    roles: [PlatformAdmin]
    code: 201
    input: [participant_id, period_year]
    output: ComplianceAttestation
    side_effects: []
  - method: GET
    path: /network/attestations/{id}
    description: "Read one attestation (OVERDUE derived lazily on read)"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: ComplianceAttestation
    side_effects: ["Lazy OVERDUE flip persisted when PENDING and logical date > due_date"]
  - method: GET
    path: /network/attestations
    description: "List attestations filtered by participant, status"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: ComplianceAttestation[]
    side_effects: []
  - method: POST
    path: /network/attestations/{id}/transition
    description: "SUBMITTED (ParticipantOfficer of the participant, with attestation_text) or ACCEPTED / REJECTED (PlatformAdmin). ACCEPTED requires no unresolved enforcement and a qualifying COMPLETED audit."
    roles: [PlatformAdmin, ParticipantOfficer]
    code: 200
    input: [to_state, "attestation_text?"]
    output: ComplianceAttestation
    side_effects: ["SUBMITTED stamps submitted_at and late_submission"]
  - method: POST
    path: /network/audits
    description: "Schedule an audit engagement for a participant; closed-interval overlap with another SCHEDULED/IN_PROGRESS audit of the same participant is rejected"
    roles: [Auditor]
    code: 201
    input: [participant_id, start_date, end_date]
    output: AuditReport
    side_effects: ["created_by_user_id := X-User-ID"]
  - method: GET
    path: /network/audits/{id}
    description: "Read one audit report"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: []
    output: AuditReport
    side_effects: []
  - method: GET
    path: /network/audits
    description: "List audit reports filtered by participant, status"
    roles: [PlatformAdmin, ParticipantOfficer, VotingDelegate, Auditor]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: AuditReport[]
    side_effects: []
  - method: POST
    path: /network/audits/{id}/transition
    description: "Drive AuditReport: to_state IN_PROGRESS | COMPLETED | CANCELLED. COMPLETED requires findings_count and a different Auditor than the creator (segregation of duties)."
    roles: [Auditor]
    code: 200
    input: [to_state, "findings_count?"]
    output: AuditReport
    side_effects: ["COMPLETED stamps completed_by_user_id"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on this endpoint, or entity_backed caller's X-User-ID does not match the owning participant" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any id in path or body does not resolve to an existing resource" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Uniqueness violated: routing_number, transaction code code, one ballot per (proposal, participant), one snapshot per (participant, period), one attestation per (participant, period_year)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition's from-state does not match the entity's current state, or a terminal state is targeted" }
  - { id: ERR_PARTICIPANT_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE participant (entry create, return create, ballot cast, originator approve/reinstate) and the relevant participant is not ACTIVE" }
  - { id: ERR_ORIGINATOR_NOT_APPROVED, http: 409, condition: "Entry create on an originator whose status is not APPROVED" }
  - { id: ERR_ENTRY_NOT_SETTLED, http: 409, condition: "Return attempted on an entry whose status is not SETTLED (also covers a second return on an already-RETURNED entry)" }
  - { id: ERR_ACCOUNT_VALIDATION_REQUIRED, http: 422, condition: "Entry on a code with account_validation_required=true without a VALID AccountValidation for (originator, receiver_account_number_hash)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "UPHELD driven by the admin who escalated the inquiry, or audit COMPLETED by its creator" }
  - { id: ERR_AUTHORIZATION_REQUIREMENT_VIOLATION, http: 422, condition: "authorization_type does not equal the transaction code's authorization_requirement (requirement NONE accepts any)" }
  - { id: ERR_RETURN_PARTICIPANT_CONFLICT, http: 422, condition: "Returning participant equals the entry's originating participant" }
  - { id: ERR_GUIDANCE_WINDOW_OVERLAP, http: 409, condition: "New guidance's half-open [effective_from, effective_until) window intersects a PUBLISHED guidance of the same transaction code and supersede_prior is false" }
  - { id: ERR_PROPOSAL_NOT_EFFECTIVE, http: 409, condition: "Guidance create references a rule proposal whose status is not EFFECTIVE, or whose transaction_code_id differs from the body's" }
  - { id: ERR_AUDIT_WINDOW_OVERLAP, http: 409, condition: "New audit's CLOSED [start_date, end_date] interval intersects another SCHEDULED/IN_PROGRESS audit of the same participant (shared boundary date counts as overlap)" }
  - { id: ERR_VOTE_UNCHANGED, http: 422, condition: "Recast vote equals the ballot's current vote" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 409, condition: "Banking-day count from settled_date to today exceeds the transaction code's return_timeframe_banking_days" }
  - { id: ERR_COMMENT_PERIOD_TOO_SHORT, http: 422, condition: "COMMENT_OPEN -> BALLOTING before 30 days have elapsed" }
  - { id: ERR_BALLOT_PERIOD_NOT_CLOSED, http: 422, condition: "close-ballot before 14 days have elapsed since ballot_opened_at" }
  - { id: ERR_EFFECTIVE_DATE_NOT_REACHED, http: 422, condition: "PASSED -> EFFECTIVE before the proposal's effective_date" }
  - { id: ERR_WINDOW_NOT_CLOSED, http: 409, condition: "run-settlement invoked before the window's cutoff_time_utc on the current logical date" }
  - { id: ERR_WINDOW_CUTOFF_PASSED, http: 422, condition: "Same-day entry requested for a window whose cutoff has passed" }
  - { id: ERR_RESPONSE_DEADLINE_NOT_PASSED, http: 409, condition: "Escalate from OPENED while response_deadline is still in the future" }
  - { id: ERR_SAME_DAY_ENTRY_LIMIT_EXCEEDED, http: 422, condition: "Same-day entry amount_cents > window.per_entry_limit_cents" }
  - { id: ERR_WINDOW_CAPACITY_EXCEEDED, http: 422, condition: "Same-day entry would push the participant's window-day aggregate over window.odfi_window_cap_cents" }
  - { id: ERR_EXPOSURE_LIMIT_EXCEEDED, http: 422, condition: "Originator contingent_exposure_cents + amount_cents > exposure_limit_cents" }
  - { id: ERR_UNRESOLVED_ENFORCEMENT, http: 422, condition: "Participant has an EnforcementAction in status ISSUED or CONTESTED blocking attestation acceptance or reinstatement" }
  - { id: ERR_AUDIT_REQUIRED, http: 422, condition: "Attestation ACCEPTED without a COMPLETED audit whose end_date >= period_year-01-01" }
  - { id: ERR_AUDIT_NOT_STARTED, http: 422, condition: "Audit IN_PROGRESS before its start_date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_originator_version / expected_transaction_code_version does not equal the entity's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, amount_cents <= 0, unparseable date, effective_date not after creation date, effective_until not after effective_from, end_date < start_date, exposure_limit_cents <= 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Network operator staff (rules administration, settlement operations, enforcement, attestation review)"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /network/participants and participant transitions"
      - "POST /network/transaction-codes"
      - "POST /network/rule-proposals, transitions, close-ballot"
      - "POST /network/guidance-documents"
      - "POST /network/settlement-windows and run-settlement"
      - "POST /network/return-rate-snapshots"
      - "POST /network/inquiry-cases/{id}/resolve and /escalate"
      - "POST /network/enforcement-actions and transitions"
      - "POST /network/attestations; ACCEPTED/REJECTED attestation transitions"
    shared_operations: ["All GET endpoints"]
  - name: ParticipantOfficer
    description: "Operations officer of a member institution; acts strictly on behalf of the participant whose id equals X-User-ID"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /network/originators and originator transitions, PATCH exposure-limit"
      - "POST /network/payment-entries, cancel, returns"
      - "POST /network/account-validations"
      - "POST /network/inquiry-cases/{id}/respond"
      - "SUBMITTED attestation transition"
    shared_operations: ["All GET endpoints"]
  - name: VotingDelegate
    description: "A participant's designated rules voter; casts and recasts ballots as the participant (X-User-ID == participant id)"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /network/rule-proposals/{id}/ballots"
      - "PATCH /network/ballots/{id}"
    shared_operations: ["All GET endpoints"]
  - name: Auditor
    description: "Independent audit professional engaged under the network's audit requirement"
    identity: opaque
    exclusive_operations:
      - "POST /network/audits"
      - "POST /network/audits/{id}/transition"
    shared_operations: ["All GET endpoints"]
