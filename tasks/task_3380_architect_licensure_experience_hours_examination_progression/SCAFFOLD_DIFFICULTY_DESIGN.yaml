      - name: report_return_resubmit_credit_conservation
        grounds:
          - calculations.area_progress_aggregation
          - state_machines.ExperienceReport.SUBMITTED_to_RETURNED
          - state_machines.ExperienceReport.RETURNED_to_SUBMITTED
        distinguishing_aspect: |
          Conserved quantity: Candidate.total_credited_hours (experience-hour
          domain, different conserved quantity than CE hours). The RETURN of
          a never-verified report paired with its resubmission leaves the
          candidate's verified credit total at exactly 40 throughout, because
          only VERIFIED reports contribute.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C, supervisor S; R1 PPD 40h VERIFIED (total_credited_hours == 40); R2 PJM 40h SUBMITTED"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 40, work_period_start: "2026-01-05", work_period_end: "2026-02-02" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r1_id}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_MANAGEMENT", hours: 40, work_period_start: "2026-02-02", work_period_end: "2026-03-02" }, as: Candidate, as_user_id: "${cand_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r2_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          trigger:
            - { call: "POST /licensure/experience-reports/${r2_id}/return", payload: { return_reason: "fix dates" }, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "GET /licensure/candidates/${cand_id}/summary", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { total_mid: $.data.total_credited_hours } }
            - { call: "POST /licensure/experience-reports/${r2_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "GET /licensure/candidates/${cand_id}/summary", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { total_end: $.data.total_credited_hours } }
          assert:
            - "before return: total_credited_hours == 40 (only VERIFIED R1 contributes)"
            - "after return: captured total_mid == 40 (RETURN changed nothing countable)"
            - "after resubmit: captured total_end == 40 (invariant: total == SUM(credited_hours over VERIFIED) restored)"
            - "ExperienceReport.${r2_id}.status == SUBMITTED and credit_pct == 100 (resubmit restamps at the same clock)"
