          - entities.Load.fields.consolidated_weight_lbs
        distinguishing_aspect: |
          Numeric capacity boundary on POST /tms/loads/{id}/shipments: a total
          exactly EQUAL to planned_capacity_lbs (6000+4000==10000) is allowed;
          a total strictly GREATER (10000+1) is rejected. The reject fires on
          > capacity, not >=.
        test_recipe:
          setup:
            - "Load capacity 10000; one 6000-lb BOOKED shipment already consolidated (consolidated 6000)."
            - "A second BOOKED shipment of 4000 lbs ready to add."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
