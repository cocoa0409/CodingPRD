# =============================================================================
# SCAFFOLD: Mobile Heavy-Duty Truck Repair & Roadside (task 1543)
# Sections 1.0-1.7. Difficulty design (1.8) and corner design (1.9) live in
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Mobile Heavy-Duty Truck Repair & Roadside (mobile diesel repair service): service call intake & triage by symptom, technician dispatch with parts van inventory, on-site repair vs tow decision, emergency after-hours premium & travel time, warranty vs customer-pay determination, fleet account authorization limits, roadside inspection defect correction, invoicing & repeat-failure follow-up

domain_name: mobile-truck-repair-roadside
api_prefix: /roadside

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat            # peer entities joined by FK references; nested URLs used only for child creation
  state_machine_shape: cyclic      # dominant shape: reopen / revision / appeal / verification cycles; Invoice adds parallel dimensions
  relationship_patterns:
    - one_to_many
    - self_referential             # ServiceCall.repeat_of_call_id -> ServiceCall.id
    - cross_aggregate
  role_model: segregation_of_duties  # claim filer != claim decider; invoice issuer != invoice voider; OpsAdmin override layered on top
  consistency_model: immediate

# =============================================================================
# Section 1.0 Response Envelope (FIXED - verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Section 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Fleet customer legal name" }
      - { name: account_number, type: string, source: input, description: "External account number; unique across all fleets", constraints: "unique" }
      - { name: billing_email, type: string, source: input, description: "AP contact email" }
      - { name: per_call_authorization_limit_cents, type: integer, source: input, description: "Estimates with total_cents <= this limit may be approved by Dispatcher; strictly greater requires FleetManager (or OpsAdmin) approval" }
      - { name: monthly_spend_cap_cents, type: integer, source: input, description: "Projected month-to-date spend strictly greater than this blocks estimate approval and auto-suspends the fleet at invoice issue" }
      - { name: payment_terms_days, type: integer, source: input, default: 30, description: "Invoice due offset in days from issued_at" }
      - { name: rate_card_id, type: string, source: input, required: false, description: "FK -> RateCard.id; nullable. When set, this card prices all of the fleet's calls regardless of coverage window; when null, the window-covering card is used" }
      - { name: month_to_date_spend_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over this fleet's invoices with issue_status == ISSUED whose issued_at falls in the logical clock's current calendar month, plus same-month spend adjustments" }
      - { name: effective_discount_tier, type: enum, source: computed, default: "STANDARD", description: "STANDARD | GOLD | PLATINUM. Derived from month_to_date_spend_cents: >= 500000 PLATINUM (10%), >= 200000 GOLD (5%), else STANDARD (0%)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: suspension_reason, type: enum, source: system, default: "NONE", description: "NONE | ADMIN | CREDIT_HOLD" }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Card label" }
      - { name: labor_rate_standard_cents, type: integer, source: input, description: "Hourly labor for STANDARD technicians" }
      - { name: labor_rate_master_cents, type: integer, source: input, description: "Hourly labor for MASTER technicians" }
      - { name: after_hours_multiplier_bp, type: integer, source: input, description: "Basis-point multiplier applied to labor when the call is after-hours (15000 = 1.5x)" }
      - { name: travel_free_miles, type: integer, source: input, description: "One-way miles included at no charge on business-hours calls" }
      - { name: travel_per_mile_cents, type: integer, source: input, description: "Per billable mile" }
      - { name: travel_time_per_minute_cents, type: integer, source: input, description: "Per actual travel minute" }
      - { name: emergency_callout_fee_cents, type: integer, source: input, description: "Flat fee when priority == P1_EMERGENCY" }
      - { name: parts_tax_rate_bp, type: integer, source: input, description: "Basis-point tax applied to parts_subtotal_cents only (725 = 7.25%)" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (inclusive). Windows of distinct cards MUST NOT overlap; touching endpoints count as overlap (closed-closed semantics)" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: input, required: false, description: "FK -> FleetAccount.id; nullable - null means a retail (non-fleet) unit" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number", constraints: "unique" }
      - { name: unit_number, type: string, source: input, description: "Fleet or owner unit label" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: odometer_miles, type: integer, source: input, default: 0, description: "Last recorded odometer; monotone non-decreasing across PATCH and repair completion" }
      - { name: oem_warranty_expires_at, type: datetime, source: input, required: false, description: "OEM base coverage expiry timestamp; nullable" }
      - { name: oem_warranty_miles_limit, type: integer, source: input, required: false, description: "OEM base coverage mileage ceiling; nullable" }
      - { name: extended_warranty, type: boolean, source: input, default: false, description: "True when an extended service contract is active" }
      - { name: roadworthiness, type: enum, source: computed, default: "ROADWORTHY", description: "ROADWORTHY | OUT_OF_SERVICE. OUT_OF_SERVICE while any InspectionDefect with severity == OOS on this vehicle is in {OPEN, REPAIR_SCHEDULED, CORRECTED, VERIFICATION_FAILED, ESCALATED}" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: employee_code, type: string, source: input, description: "HR code", constraints: "unique" }
      - { name: certifications, type: array, source: input, description: "Array of enum: ENGINE | BRAKES | ELECTRICAL | HVAC | TIRES | WELDING | DOT_INSPECTION" }
      - { name: labor_rate_class, type: enum, source: input, description: "STANDARD | MASTER - selects the rate card labor column" }
      - { name: home_depot_city, type: string, source: input, description: "Base city (informational)" }
      - { name: status, type: enum, source: system, default: "OFF_DUTY", description: "OFF_DUTY | AVAILABLE | ON_BREAK | ON_DISPATCH. ON_DISPATCH is system-managed only" }
      - { name: current_dispatch_id, type: string, source: computed, required: false, description: "FK -> Dispatch.id; nullable. The technician's single in-flight dispatch (ACCEPTED / EN_ROUTE / ON_SITE)" }

  - name: ServiceCall
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: fleet_account_id, type: string, source: computed, required: false, description: "FK -> FleetAccount.id; nullable. Denormalized from Vehicle.fleet_account_id at intake; null for retail calls" }
      - { name: caller_name, type: string, source: input, description: "Caller contact name" }
      - { name: caller_phone, type: string, source: input, description: "Caller phone" }
      - { name: breakdown_location_text, type: string, source: input, description: "Where the unit is disabled" }
      - { name: distance_miles_from_depot, type: integer, source: input, description: "Dispatch desk's one-way mileage estimate to the breakdown site" }
      - { name: symptom_category, type: enum, source: input, description: "ENGINE_NO_START | OVERHEAT | BRAKE_FAULT | AIR_LEAK | ELECTRICAL | LIGHTING | TIRE_BLOWOUT | HVAC_ISSUE | OTHER; triage may reclassify" }
      - { name: symptom_description, type: string, source: input, description: "Free-text symptom narrative" }
      - { name: severity, type: enum, source: system, required: false, description: "BLOCKING | DRIVABLE | DEFERRED - set by triage; null before triage" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock timestamp at intake" }
      - { name: after_hours, type: boolean, source: computed, description: "True when hour(received_at, UTC) >= 18 or < 6 (boundary: 18:00:00Z is after-hours, 17:59:59Z is not)" }
      - { name: priority, type: enum, source: computed, required: false, description: "P1_EMERGENCY | P2_URGENT | P3_STANDARD. BLOCKING -> P1, DRIVABLE -> P2, DEFERRED -> P3; null before triage" }
      - { name: required_certification, type: enum, source: computed, required: false, description: "ENGINE | BRAKES | ELECTRICAL | TIRES | HVAC | ANY - mapped from symptom_category at triage" }
      - { name: required_part_class, type: enum, source: computed, required: false, description: "ENGINE | COOLING | BRAKE | AIR_SYSTEM | ELECTRICAL | LIGHTING | TIRE | HVAC | NONE - mapped from symptom_category at triage" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | TRIAGED | DISPATCHED | EN_ROUTE | ON_SITE | DIAGNOSED | REPAIR_IN_PROGRESS | REPAIR_COMPLETED | TOW_IN_PROGRESS | TOWED | INVOICED | CLOSED | REOPENED | CANCELLED" }
      - { name: diagnosis_summary, type: string, source: system, required: false, description: "Set by the diagnose action" }
      - { name: resolution_path, type: enum, source: system, default: "PENDING", description: "PENDING | ON_SITE_REPAIR | TOW_REQUIRED - set by diagnose" }
      - { name: labor_hours_actual, type: number, source: system, required: false, description: "Set by complete-repair; quarter-hour granularity" }
      - { name: completion_odometer_miles, type: integer, source: system, required: false, description: "Odometer recorded at complete-repair; must be >= Vehicle.odometer_miles" }
      - { name: completed_at, type: datetime, source: system, required: false, description: "Logical clock at complete-repair" }
      - { name: is_comeback, type: boolean, source: system, default: false, description: "True when a CONFIRMED_COMEBACK RepeatFailureCase names this call as new_service_call_id" }
      - { name: repeat_of_call_id, type: string, source: system, required: false, description: "FK -> ServiceCall.id; nullable. Set to the original call when this call is confirmed as a comeback (self-referential)" }
      - { name: linked_defect_id, type: string, source: system, required: false, description: "FK -> InspectionDefect.id; nullable. Set when a SafetyOfficer attaches this call as the correcting call of a defect" }
      - { name: hold_reason, type: enum, source: system, default: "NONE", description: "NONE | FLEET_CREDIT_HOLD - set by the invoice-issue suspension cascade on calls in {RECEIVED, TRIAGED, DISPATCHED}" }
      - { name: status_before_invoice, type: enum, source: system, required: false, description: "REPAIR_COMPLETED | TOWED - snapshot taken at invoice issue so invoice void can revert" }
      - { name: reopened_count, type: integer, source: system, default: 0, description: "Number of times this call has been reopened by a confirmed comeback" }
      - { name: cancel_reason, type: string, source: system, required: false, description: "Set by cancel" }

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - { name: service_call_id, type: string, source: system, description: "FK -> ServiceCall.id (from creation path)" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id" }
      - { name: window_start_at, type: datetime, source: input, description: "Planned service window start (half-open interval start)" }
      - { name: window_end_at, type: datetime, source: input, description: "Planned service window end (half-open interval end); must be > window_start_at" }
      - { name: planned_travel_miles, type: integer, source: input, description: "One-way planned miles" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | ACCEPTED | REJECTED | EN_ROUTE | ON_SITE | COMPLETED | RELEASED | EXPIRED | SUPERSEDED" }
      - { name: departed_at, type: datetime, source: system, required: false, description: "Logical clock at depart" }
      - { name: arrived_at, type: datetime, source: system, required: false, description: "Logical clock at arrive" }
      - { name: completed_at, type: datetime, source: system, required: false, description: "Logical clock at complete" }
      - { name: actual_travel_minutes, type: integer, source: computed, required: false, description: "floor((arrived_at - departed_at) / 60) at arrive" }
      - { name: actual_travel_miles, type: integer, source: system, required: false, description: "One-way actual miles, set by arrive input" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Set by reject" }
      - { name: release_reason, type: string, source: system, required: false, description: "Set by release" }

  - name: VanStockItem
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id (from creation path) - the parts van this stock rides on" }
      - { name: part_number, type: string, source: input, description: "SKU", constraints: "unique per technician_id" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: part_class, type: enum, source: input, description: "ENGINE | COOLING | BRAKE | AIR_SYSTEM | ELECTRICAL | LIGHTING | TIRE | HVAC | FILTERS" }
      - { name: qty_on_hand, type: integer, source: input, default: 0, description: "Units physically on the van; decremented by part usage, restored by returns and restock fulfillment" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Shop cost per unit (warranty valuation basis)" }
      - { name: unit_retail_cents, type: integer, source: input, description: "Customer-pay retail price per unit" }
      - { name: reorder_point, type: integer, source: input, default: 2, description: "When qty_on_hand <= reorder_point after a usage decrement, an AUTO_LOW_STOCK RestockRequest is opened" }
      - { name: restock_pending, type: boolean, source: computed, default: false, description: "True while a PENDING or APPROVED RestockRequest exists for this item" }

  - name: WorkEstimate
    parent: null
    common_fields: true
    fields:
      - { name: service_call_id, type: string, source: system, description: "FK -> ServiceCall.id (from creation path)" }
      - { name: revision, type: integer, source: system, default: 1, description: "Monotone per service call; increments when a REJECTED estimate is revised back to DRAFT" }
      - { name: labor_hours_est, type: number, source: input, description: "Estimated labor hours" }
      - { name: travel_miles_est, type: integer, source: input, description: "Estimated one-way miles" }
      - { name: parts_estimate_cents, type: integer, source: input, description: "Estimated parts total" }
      - { name: includes_tow, type: boolean, source: input, default: false, description: "Whether a tow is bundled into the estimate" }
      - { name: tow_estimate_cents, type: integer, source: input, default: 0, description: "Estimated tow charge" }
      - { name: total_cents, type: integer, source: computed, description: "Provisional variant of the pricing engine; see calculations.estimate_pricing" }
      - { name: requires_fleet_approval, type: boolean, source: computed, description: "True when the call has a fleet and total_cents > fleet.per_call_authorization_limit_cents" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED | EXPIRED" }
      - { name: decided_by, type: string, source: system, required: false, description: "X-User-ID of approver/rejecter" }
      - { name: decided_at, type: datetime, source: system, required: false, description: "Logical clock at approve/reject" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Logical clock at submit; SUBMITTED estimates expire after 7 calendar days via run_daily" }
      - { name: reject_reason, type: string, source: system, required: false, description: "Set by reject" }

  - name: PartUsage
    parent: null
    common_fields: true
    fields:
      - { name: service_call_id, type: string, source: system, description: "FK -> ServiceCall.id (from creation path)" }
      - { name: van_stock_item_id, type: string, source: input, description: "FK -> VanStockItem.id - must belong to the technician currently ON_SITE for the call" }
      - { name: part_number, type: string, source: computed, description: "Denormalized from VanStockItem at posting" }
      - { name: qty, type: integer, source: input, description: "Units consumed; must be >= 1" }
      - { name: charge_type, type: enum, source: input, default: "CUSTOMER_PAY", description: "CUSTOMER_PAY | SHOP_GUARANTEE. SHOP_GUARANTEE is valid only on comeback calls (is_comeback == true) and is excluded from the customer invoice and from tax" }
      - { name: unit_price_cents, type: integer, source: computed, description: "= VanStockItem.unit_retail_cents at posting (both charge types; SHOP_GUARANTEE lines are simply not summed into the invoice)" }
      - { name: line_total_cents, type: integer, source: computed, description: "= qty * unit_price_cents (exact integer cents)" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | RETURNED (returns are all-or-nothing per usage line)" }
      - { name: posted_at, type: datetime, source: system, description: "Logical clock at posting" }

  - name: TowOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_call_id, type: string, source: system, description: "FK -> ServiceCall.id (from creation path)" }
      - { name: tow_provider_name, type: string, source: input, description: "External tow vendor" }
      - { name: tow_unit_id, type: string, source: input, description: "Vendor tow unit identifier - the resource on which pickup-window overlap is enforced" }
      - { name: pickup_location_text, type: string, source: input, description: "Pickup address" }
      - { name: dropoff_location_text, type: string, source: input, description: "Drop destination" }
      - { name: pickup_window_start_at, type: datetime, source: input, description: "Requested pickup window start" }
      - { name: pickup_window_end_at, type: datetime, source: input, description: "Requested pickup window end; must be > start" }
      - { name: tow_fee_cents, type: integer, source: input, description: "Sublet tow charge passed through to the invoice" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | HOOKED | DELIVERED | CANCELLED" }
      - { name: hooked_at, type: datetime, source: system, required: false, description: "Logical clock at hook" }
      - { name: delivered_at, type: datetime, source: system, required: false, description: "Logical clock at deliver" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: service_call_id, type: string, source: system, description: "FK -> ServiceCall.id (from creation path)" }
      - { name: vehicle_id, type: string, source: computed, description: "FK -> Vehicle.id - denormalized from the call at filing" }
      - { name: claim_type, type: enum, source: input, description: "OEM_BASE | OEM_POWERTRAIN | EXTENDED_SERVICE_CONTRACT" }
      - { name: filed_by_technician_id, type: string, source: system, description: "FK -> Technician.id - the on-site technician; system-set from X-User-ID (Technician filer) or from the call's dispatch technician (WarrantyAdministrator filer)" }
      - { name: oem_labor_hours, type: number, source: input, description: "OEM flat-rate labor hours allowed for the covered repair" }
      - { name: oem_labor_rate_cents, type: integer, source: input, description: "OEM reimbursed labor rate" }
      - { name: parts_at_cost_cents, type: integer, source: input, description: "Parts value at shop cost covered by the OEM" }
      - { name: oem_value_cents, type: integer, source: computed, description: "= round_half_up(oem_labor_hours * oem_labor_rate_cents) + parts_at_cost_cents" }
      - { name: retail_value_cents, type: integer, source: computed, description: "= round_half_up(call.labor_hours_actual * class standard rate) + sum of POSTED CUSTOMER_PAY part line totals on the call" }
      - { name: recovered_cents, type: integer, source: computed, description: "= min(oem_value_cents, retail_value_cents) - the warranty-vs-customer-pay split" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | DENIED | APPEALED | SETTLED" }
      - { name: denial_reason, type: string, source: system, required: false, description: "Set when decided DENIED" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Appeals used; hard cap 2" }
      - { name: decided_by, type: string, source: system, required: false, description: "X-User-ID of the WarrantyAdministrator decider" }
      - { name: settled_amount_cents, type: integer, source: system, required: false, description: "Set at settle; must equal recovered_cents" }

  - name: InspectionDefect
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id (from creation path)" }
      - { name: source, type: enum, source: input, description: "ROADSIDE_DOT_INSPECTION | ANNUAL_INSPECTION | DRIVER_REPORT" }
      - { name: defect_code, type: string, source: input, description: "Regulation code, e.g. 393.9" }
      - { name: severity, type: enum, source: input, description: "OOS | NON_OOS - OOS flips the vehicle OUT_OF_SERVICE until VERIFIED" }
      - { name: citation_reference, type: string, source: input, required: false, description: "Roadside inspection report number; nullable" }
      - { name: discovered_at, type: datetime, source: input, description: "When the defect was cited" }
      - { name: correction_deadline_at, type: datetime, source: computed, description: "= discovered_at + 15 days" }
      - { name: correcting_service_call_id, type: string, source: system, required: false, description: "FK -> ServiceCall.id; nullable. Linked by attach-call" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | REPAIR_SCHEDULED | CORRECTED | VERIFIED | VERIFICATION_FAILED | ESCALATED" }
      - { name: correction_note, type: string, source: system, required: false, description: "Set by mark-corrected" }
      - { name: verified_by, type: string, source: system, required: false, description: "X-User-ID of verifying SafetyOfficer" }
      - { name: verified_at, type: datetime, source: system, required: false, description: "Logical clock at verify PASS" }
      - { name: escalation_count, type: integer, source: system, default: 0, description: "Times this defect has been escalated by run_daily" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: service_call_id, type: string, source: system, description: "FK -> ServiceCall.id (from creation path)" }
      - { name: fleet_account_id, type: string, source: computed, required: false, description: "FK -> FleetAccount.id; nullable. Denormalized from the call" }
      - { name: invoice_number, type: string, source: system, description: "INV- + zero-padded 6-digit monotone sequence" }
      - { name: issue_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ISSUED | VOID - parallel dimension 1" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | PARTIALLY_PAID | PAID | WRITTEN_OFF - parallel dimension 2, evolves independently of issue_status" }
      - { name: labor_hours_actual, type: number, source: computed, description: "Copied from the call at creation" }
      - { name: labor_rate_cents, type: integer, source: computed, description: "Class rate from the resolved rate card" }
      - { name: after_hours, type: boolean, source: computed, description: "Copied from the call" }
      - { name: labor_amount_cents, type: integer, source: computed, description: "round_half_up(hours * class rate * after-hours multiplier); halved for REDUCED comebacks; 0 for NO_CHARGE comebacks" }
      - { name: travel_miles_actual, type: integer, source: computed, description: "One-way actual miles from the call's completed dispatch" }
      - { name: travel_miles_billable, type: integer, source: computed, description: "Business hours: max(0, actual - travel_free_miles); after-hours: 2 * actual (portal-to-portal, no free allowance)" }
      - { name: travel_amount_cents, type: integer, source: computed, description: "= travel_miles_billable * travel_per_mile_cents" }
      - { name: travel_minutes_actual, type: integer, source: computed, description: "From dispatch.actual_travel_minutes" }
      - { name: travel_time_amount_cents, type: integer, source: computed, description: "= travel_minutes_actual * travel_time_per_minute_cents" }
      - { name: callout_fee_cents, type: integer, source: computed, description: "= emergency_callout_fee_cents when priority == P1_EMERGENCY else 0" }
      - { name: parts_subtotal_cents, type: integer, source: computed, description: "Sum of line_total_cents over PartUsage rows of the call with status == POSTED and charge_type == CUSTOMER_PAY" }
      - { name: tow_charge_cents, type: integer, source: computed, description: "Sum of tow_fee_cents over DELIVERED TowOrders of the call" }
      - { name: discount_tier, type: enum, source: computed, description: "STANDARD | GOLD | PLATINUM - tier snapshot from fleet month_to_date_spend_cents BEFORE this invoice" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(tier_pct * (labor + travel_amount + travel_time + callout)); tier pct: STANDARD 0, GOLD 5%, PLATINUM 10%" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up(parts_subtotal_cents * parts_tax_rate_bp / 10000) - computed ONCE on the subtotal, never per line" }
      - { name: warranty_offset_cents, type: integer, source: computed, description: "Sum of recovered_cents over claims of the call in {APPROVED, SETTLED}, capped at the pre-offset total; floor 0" }
      - { name: total_cents, type: integer, source: computed, description: "= labor + travel_amount + travel_time + callout - discount + parts_subtotal + tow + tax - warranty_offset; floor 0" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over POSTED payments" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= total_cents - amount_paid_cents" }
      - { name: issued_at, type: datetime, source: system, required: false, description: "Logical clock at issue" }
      - { name: due_at, type: datetime, source: system, required: false, description: "= issued_at + fleet.payment_terms_days (retail: 0 days)" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of creator" }
      - { name: issued_by, type: string, source: system, required: false, description: "X-User-ID of issuer - the issuer may not void the same invoice (segregation of duties)" }
      - { name: void_reason, type: string, source: system, required: false, description: "Set by void" }
      - { name: writeoff_reason, type: string, source: system, required: false, description: "Set by write-off" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id (from creation path)" }
      - { name: amount_cents, type: integer, source: input, description: "Must be >= 1 and <= invoice.outstanding_cents" }
      - { name: method, type: enum, source: input, description: "CHECK | CARD | ACH | FLEET_ACCOUNT" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock at posting" }
      - { name: allocation_json, type: object, source: computed, description: "Bucket allocation map in pinned order [tax, parts, tow, labor, travel_time, travel_miles, callout_fee]" }
      - { name: status, type: enum, source: system, default: "POSTED", description: "POSTED | VOID" }
      - { name: void_reason, type: string, source: system, required: false, description: "Set by void" }

  - name: RepeatFailureCase
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: original_service_call_id, type: string, source: input, description: "FK -> ServiceCall.id - must be CLOSED" }
      - { name: new_service_call_id, type: string, source: input, description: "FK -> ServiceCall.id - the fresh complaint under review" }
      - { name: symptom_category, type: enum, source: computed, description: "Copied from the new call; must equal the original call's symptom_category" }
      - { name: window_days, type: integer, source: computed, description: "floor((new_call.received_at - original_call.completed_at) / 86400)" }
      - { name: miles_since_repair, type: integer, source: computed, description: "vehicle.odometer_miles - original_call.completion_odometer_miles" }
      - { name: charge_policy, type: enum, source: computed, description: "NO_CHARGE when window_days <= 30 AND miles <= 1000; REDUCED when window_days <= 45 AND miles <= 2000; else FULL" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | UNDER_REVIEW | CONFIRMED_COMEBACK | REJECTED | RESOLVED" }
      - { name: decided_by, type: string, source: system, required: false, description: "X-User-ID of decider" }
      - { name: decision_note, type: string, source: system, required: false, description: "Set by decide" }

  - name: RestockRequest
    parent: null
    common_fields: true
    fields:
      - { name: van_stock_item_id, type: string, source: system, description: "FK -> VanStockItem.id" }
      - { name: technician_id, type: string, source: computed, description: "FK -> Technician.id - denormalized from the stock item" }
      - { name: source, type: enum, source: system, description: "AUTO_LOW_STOCK | MANUAL" }
      - { name: qty_requested, type: integer, source: system, description: "System: reorder_point + 2 - qty_on_hand at creation (min 1); manual: caller qty" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | FULFILLED | REJECTED" }
      - { name: fulfilled_qty, type: integer, source: system, required: false, description: "Set at fulfill; added to qty_on_hand" }
      - { name: reject_reason, type: string, source: system, required: false, description: "Set by reject" }

  - name: CallEvent
    parent: null
    common_fields: false
    fields:
      - { name: service_call_id, type: string, source: system, description: "FK -> ServiceCall.id" }
      - { name: event_type, type: enum, source: system, description: "CALL_RECEIVED | TRIAGED | DISPATCH_CREATED | DISPATCH_ACCEPTED | DISPATCH_REJECTED | DISPATCH_DEPARTED | DISPATCH_ARRIVED | DIAGNOSED | ESTIMATE_CREATED | ESTIMATE_APPROVED | ESTIMATE_REJECTED | REPAIR_STARTED | PART_POSTED | PART_RETURNED | REPAIR_COMPLETED | TOW_REQUESTED | TOW_HOOKED | TOW_DELIVERED | INVOICE_CREATED | INVOICE_ISSUED | INVOICE_VOIDED | PAYMENT_POSTED | PAYMENT_VOIDED | CALL_CLOSED | CALL_REOPENED | CALL_CANCELLED | HOLD_FLAGGED" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor (or 'system')" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor (or 'system')" }
      - { name: note, type: string, source: system, required: false, description: "Free-text detail" }

# =============================================================================
# Section 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceCall
    initial_state: RECEIVED
    terminal_states: [CANCELLED]
    note: "CLOSED is quasi-terminal: a confirmed comeback reopens it (cycle CLOSED -> REOPENED -> CLOSED). DIAGNOSED forks repair vs tow (branching with divergent side effects)."
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /roadside/service-calls/{serviceCallId}/triage"
        actor: Dispatcher
        preconditions:
          - "call.status == RECEIVED"
        side_effects:
          - "severity, priority, required_certification, required_part_class computed (calculations.after_hours_and_priority)"
          - "CallEvent TRIAGED appended"

      - from: TRIAGED
        to: DISPATCHED
        trigger: "system (on successful POST /roadside/service-calls/{serviceCallId}/dispatches)"
        actor: system
        preconditions: []
        side_effects:
          - "CallEvent DISPATCH_CREATED appended"
          - "ServiceCall.version incremented (dispatch create is a mutation on the call)"

      - from: DISPATCHED
        to: TRIAGED
        trigger: "system (on dispatch reject, release, or run_daily expiry of the call's latest PROPOSED dispatch)"
        actor: system
        preconditions:
          - "no remaining dispatch in {PROPOSED, ACCEPTED, EN_ROUTE, ON_SITE} for the call"
        side_effects:
          - "call awaits re-dispatch"

      - from: DISPATCHED
        to: EN_ROUTE
        trigger: "system (on POST /roadside/dispatches/{dispatchId}/depart)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EN_ROUTE
        to: ON_SITE
        trigger: "system (on POST /roadside/dispatches/{dispatchId}/arrive)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_SITE
        to: DIAGNOSED
        trigger: "POST /roadside/service-calls/{serviceCallId}/diagnose"
        actor: Technician
        preconditions:
          - "call.status == ON_SITE"
          - "actor is the technician of the call's ON_SITE dispatch (ERR_FORBIDDEN_OWNERSHIP)"
          - "resolution_path input in {ON_SITE_REPAIR, TOW_REQUIRED}"
        side_effects:
          - "diagnosis_summary and resolution_path recorded"
          - "CallEvent DIAGNOSED appended"

      - from: DIAGNOSED
        to: REPAIR_IN_PROGRESS
        trigger: "POST /roadside/service-calls/{serviceCallId}/start-repair"
        actor: Technician
        preconditions:
          - "resolution_path == ON_SITE_REPAIR (else ERR_RESOLUTION_PATH_CONFLICT)"
          - "no WorkEstimate of the call is in {DRAFT, SUBMITTED} (else ERR_ESTIMATE_NOT_APPROVED); an APPROVED estimate or no estimate passes"
        side_effects:
          - "CallEvent REPAIR_STARTED appended"

      - from: REPAIR_IN_PROGRESS
        to: REPAIR_COMPLETED
        trigger: "POST /roadside/service-calls/{serviceCallId}/complete-repair"
        actor: Technician
        preconditions:
          - "completion_odometer_miles >= vehicle.odometer_miles (else ERR_ODOMETER_REGRESSION)"
        side_effects:
          - "labor_hours_actual, completion_odometer_miles, completed_at recorded"
          - "vehicle.odometer_miles := completion_odometer_miles (cascade hop 1)"
          - "CallEvent REPAIR_COMPLETED appended"

      - from: DIAGNOSED
        to: TOW_IN_PROGRESS
        trigger: "system (on successful POST /roadside/service-calls/{serviceCallId}/tow-orders)"
        actor: system
        preconditions:
          - "resolution_path == TOW_REQUIRED"
        side_effects:
          - "CallEvent TOW_REQUESTED appended"

      - from: TOW_IN_PROGRESS
        to: DIAGNOSED
        trigger: "system (on POST /roadside/tow-orders/{towOrderId}/cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: TOW_IN_PROGRESS
        to: TOWED
        trigger: "system (on POST /roadside/tow-orders/{towOrderId}/deliver)"
        actor: system
        preconditions: []
        side_effects:
          - "CallEvent TOW_DELIVERED appended"

      - from: REPAIR_COMPLETED
        to: INVOICED
        trigger: "system (on POST /roadside/invoices/{invoiceId}/issue)"
        actor: system
        preconditions: []
        side_effects:
          - "status_before_invoice := REPAIR_COMPLETED"
          - "CallEvent INVOICE_ISSUED appended"

      - from: TOWED
        to: INVOICED
        trigger: "system (on POST /roadside/invoices/{invoiceId}/issue)"
        actor: system
        preconditions: []
        side_effects:
          - "status_before_invoice := TOWED"

      - from: INVOICED
        to: REPAIR_COMPLETED
        trigger: "system (on POST /roadside/invoices/{invoiceId}/void when status_before_invoice == REPAIR_COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "CallEvent INVOICE_VOIDED appended"

      - from: INVOICED
        to: TOWED
        trigger: "system (on POST /roadside/invoices/{invoiceId}/void when status_before_invoice == TOWED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: INVOICED
        to: CLOSED
        trigger: "system (on payment completing the balance, on write-off, or on issue of a zero-total invoice)"
        actor: system
        preconditions: []
        side_effects:
          - "CallEvent CALL_CLOSED appended"
          - "if this call is the new_service_call_id of a CONFIRMED_COMEBACK RepeatFailureCase: case -> RESOLVED and the case's original call REOPENED -> CLOSED (cascade hop 3)"

      - from: CLOSED
        to: REOPENED
        trigger: "system (on RepeatFailureCase decide with decision == CONFIRMED_COMEBACK naming this call as original)"
        actor: system
        preconditions: []
        side_effects:
          - "reopened_count += 1"
          - "CallEvent CALL_REOPENED appended"

      - from: REOPENED
        to: CLOSED
        trigger: "system (when the linked comeback call CLOSES)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /roadside/service-calls/{serviceCallId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: ["cancel_reason recorded", "CallEvent CALL_CANCELLED appended"]

      - from: TRIAGED
        to: CANCELLED
        trigger: "POST /roadside/service-calls/{serviceCallId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: ["cancel_reason recorded", "CallEvent CALL_CANCELLED appended"]

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /roadside/service-calls/{serviceCallId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "any PROPOSED or ACCEPTED dispatch of the call -> RELEASED; its technician -> AVAILABLE with current_dispatch_id cleared"
          - "cancel_reason recorded"

      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /roadside/service-calls/{serviceCallId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "the EN_ROUTE dispatch -> RELEASED; its technician -> AVAILABLE"
          - "cancel_reason recorded"

  - entity: Dispatch
    initial_state: PROPOSED
    terminal_states: [REJECTED, RELEASED, EXPIRED, SUPERSEDED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /roadside/dispatches/{dispatchId}/accept"
        actor: Technician
        preconditions:
          - "actor == dispatch.technician_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "technician.status == AVAILABLE (ERR_TECHNICIAN_NOT_AVAILABLE)"
        side_effects:
          - "technician.status -> ON_DISPATCH; technician.current_dispatch_id := dispatch.id"
          - "CallEvent DISPATCH_ACCEPTED appended"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /roadside/dispatches/{dispatchId}/reject"
        actor: Technician
        preconditions:
          - "actor == dispatch.technician_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "rejection_reason recorded"
          - "call DISPATCHED -> TRIAGED (no other active dispatch)"
          - "CallEvent DISPATCH_REJECTED appended"

      - from: PROPOSED
        to: RELEASED
        trigger: "POST /roadside/dispatches/{dispatchId}/release"
        actor: Dispatcher
        preconditions: []
        side_effects: ["call DISPATCHED -> TRIAGED (no other active dispatch)"]

      - from: PROPOSED
        to: EXPIRED
        trigger: "system (run_daily: window_end_at < now)"
        actor: system
        preconditions: []
        side_effects: ["call DISPATCHED -> TRIAGED (no other active dispatch)"]

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (on creation of a newer dispatch for the same call)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: EN_ROUTE
        trigger: "POST /roadside/dispatches/{dispatchId}/depart"
        actor: Technician
        preconditions: ["actor == dispatch.technician_id"]
        side_effects:
          - "departed_at set"
          - "call DISPATCHED -> EN_ROUTE"
          - "CallEvent DISPATCH_DEPARTED appended"

      - from: ACCEPTED
        to: RELEASED
        trigger: "POST /roadside/dispatches/{dispatchId}/release"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "technician.status -> AVAILABLE; current_dispatch_id cleared"
          - "call DISPATCHED -> TRIAGED"

      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /roadside/dispatches/{dispatchId}/arrive"
        actor: Technician
        preconditions: ["actor == dispatch.technician_id"]
        side_effects:
          - "arrived_at, actual_travel_miles recorded; actual_travel_minutes computed"
          - "call EN_ROUTE -> ON_SITE"
          - "CallEvent DISPATCH_ARRIVED appended"

      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /roadside/dispatches/{dispatchId}/complete"
        actor: Technician
        preconditions:
          - "actor == dispatch.technician_id"
          - "call.status in {REPAIR_COMPLETED, TOW_IN_PROGRESS, TOWED} (else ERR_INVALID_STATE)"
        side_effects:
          - "completed_at set"
          - "technician.status -> AVAILABLE; current_dispatch_id cleared"

  - entity: WorkEstimate
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    note: "Cyclic revision loop REJECTED -> DRAFT -> SUBMITTED; creation of a newer estimate supersedes any prior estimate in {DRAFT, SUBMITTED, APPROVED}."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /roadside/estimates/{estimateId}/submit"
        actor: Technician
        preconditions: []
        side_effects: ["submitted_at set"]

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /roadside/estimates/{estimateId}/approve"
        actor: FleetManager
        preconditions:
          - "fleet call: fleet.status == ACTIVE (ERR_FLEET_SUSPENDED / ERR_FLEET_CLOSED)"
          - "total_cents > per_call_authorization_limit_cents requires actor FleetManager of that fleet or OpsAdmin (Dispatcher -> ERR_AUTHORIZATION_REQUIRED)"
          - "fleet.month_to_date_spend_cents + total_cents > monthly_spend_cap_cents requires override_cap: true by OpsAdmin (else ERR_MONTHLY_CAP_EXCEEDED)"
        side_effects:
          - "decided_by/decided_at set"
          - "CallEvent ESTIMATE_APPROVED appended"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /roadside/estimates/{estimateId}/reject"
        actor: FleetManager
        preconditions: []
        side_effects: ["reject_reason set", "CallEvent ESTIMATE_REJECTED appended"]

      - from: REJECTED
        to: DRAFT
        trigger: "PATCH /roadside/estimates/{estimateId} (revise)"
        actor: Technician
        preconditions: []
        side_effects: ["revision += 1", "total_cents recomputed (calculations.estimate_pricing)"]

      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /roadside/estimates/{estimateId} (edit in place)"
        actor: Technician
        preconditions: []
        side_effects: ["total_cents recomputed"]

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (on creation of a newer estimate for the same call)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (on creation of a newer estimate for the same call)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (on creation of a newer estimate for the same call)"
        actor: system
        preconditions: []
        side_effects: ["the repair-start gate now refers to the newer estimate"]

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (run_daily: now > submitted_at + 7 days)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TowOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: HOOKED
        trigger: "POST /roadside/tow-orders/{towOrderId}/hook"
        actor: Dispatcher
        preconditions: []
        side_effects: ["hooked_at set", "CallEvent TOW_HOOKED appended"]

      - from: HOOKED
        to: DELIVERED
        trigger: "POST /roadside/tow-orders/{towOrderId}/deliver"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "delivered_at set"
          - "call TOW_IN_PROGRESS -> TOWED"
          - "CallEvent TOW_DELIVERED appended"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /roadside/tow-orders/{towOrderId}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: ["call TOW_IN_PROGRESS -> DIAGNOSED"]

  - entity: WarrantyClaim
    initial_state: DRAFT
    terminal_states: [SETTLED]
    note: "Appeal cycle DENIED -> APPEALED -> decide again; appeal_count hard cap 2 (third appeal attempt -> ERR_APPEAL_LIMIT_REACHED). DENIED at appeal_count == 2 is effectively terminal."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /roadside/warranty-claims/{claimId}/submit"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: ["recovered_cents computed (calculations.warranty_valuation)"]

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /roadside/warranty-claims/{claimId}/decide (decision=APPROVED)"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: ["decided_by set"]

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /roadside/warranty-claims/{claimId}/decide (decision=DENIED)"
        actor: WarrantyAdministrator
        preconditions: ["denial_reason required"]
        side_effects: ["decided_by, denial_reason set"]

      - from: APPEALED
        to: APPROVED
        trigger: "POST /roadside/warranty-claims/{claimId}/decide (decision=APPROVED)"
        actor: WarrantyAdministrator
        preconditions: []
        side_effects: ["decided_by set"]

      - from: APPEALED
        to: DENIED
        trigger: "POST /roadside/warranty-claims/{claimId}/decide (decision=DENIED)"
        actor: WarrantyAdministrator
        preconditions: ["denial_reason required"]
        side_effects: ["decided_by, denial_reason set"]

      - from: DENIED
        to: APPEALED
        trigger: "POST /roadside/warranty-claims/{claimId}/appeal"
        actor: Dispatcher
        preconditions: ["appeal_count < 2 (else ERR_APPEAL_LIMIT_REACHED)"]
        side_effects: ["appeal_count += 1"]

      - from: APPROVED
        to: SETTLED
        trigger: "POST /roadside/warranty-claims/{claimId}/settle"
        actor: WarrantyAdministrator
        preconditions: ["settled_amount_cents == recovered_cents (else ERR_VALIDATION)"]
        side_effects: ["settled_amount_cents recorded"]

  - entity: InspectionDefect
    initial_state: OPEN
    terminal_states: [VERIFIED]
    note: "Verification-failure loop CORRECTED -> VERIFICATION_FAILED -> REPAIR_SCHEDULED; deadline breach escalates any non-terminal, non-verified state."
    transitions:
      - from: OPEN
        to: REPAIR_SCHEDULED
        trigger: "POST /roadside/inspection-defects/{defectId}/attach-call"
        actor: SafetyOfficer
        preconditions: ["service_call.vehicle_id == defect.vehicle_id (ERR_VEHICLE_MISMATCH)"]
        side_effects: ["correcting_service_call_id set", "call.linked_defect_id := defect.id"]

      - from: VERIFICATION_FAILED
        to: REPAIR_SCHEDULED
        trigger: "POST /roadside/inspection-defects/{defectId}/attach-call"
        actor: SafetyOfficer
        preconditions: ["service_call.vehicle_id == defect.vehicle_id"]
        side_effects: ["correcting_service_call_id set"]

      - from: ESCALATED
        to: REPAIR_SCHEDULED
        trigger: "POST /roadside/inspection-defects/{defectId}/attach-call"
        actor: SafetyOfficer
        preconditions: ["service_call.vehicle_id == defect.vehicle_id"]
        side_effects: ["correcting_service_call_id set"]

      - from: REPAIR_SCHEDULED
        to: CORRECTED
        trigger: "POST /roadside/inspection-defects/{defectId}/mark-corrected"
        actor: Technician
        preconditions:
          - "linked correcting call.status == REPAIR_COMPLETED (else ERR_INVALID_STATE)"
          - "actor == the linked call's ON_SITE dispatch technician (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: ["correction_note set"]

      - from: CORRECTED
        to: VERIFIED
        trigger: "POST /roadside/inspection-defects/{defectId}/verify (outcome=PASS)"
        actor: SafetyOfficer
        preconditions: []
        side_effects:
          - "verified_by / verified_at set"
          - "vehicle.roadworthiness recomputed (calculations.vehicle_roadworthiness)"

      - from: CORRECTED
        to: VERIFICATION_FAILED
        trigger: "POST /roadside/inspection-defects/{defectId}/verify (outcome=FAIL)"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["vehicle.roadworthiness recomputed"]

      - from: OPEN
        to: ESCALATED
        trigger: "system (run_daily: now > correction_deadline_at)"
        actor: system
        preconditions: []
        side_effects: ["escalation_count += 1"]

      - from: REPAIR_SCHEDULED
        to: ESCALATED
        trigger: "system (run_daily: now > correction_deadline_at)"
        actor: system
        preconditions: []
        side_effects: ["escalation_count += 1"]

      - from: CORRECTED
        to: ESCALATED
        trigger: "system (run_daily: now > correction_deadline_at)"
        actor: system
        preconditions: []
        side_effects: ["escalation_count += 1"]

      - from: VERIFICATION_FAILED
        to: ESCALATED
        trigger: "system (run_daily: now > correction_deadline_at)"
        actor: system
        preconditions: []
        side_effects: ["escalation_count += 1"]

  - entity: Invoice
    initial_state: "DRAFT / UNPAID"
    terminal_states: ["VOID (issue_status)", "PAID | WRITTEN_OFF (payment_status)"]
    note: "PARALLEL DIMENSIONS on one row: issue_status (DRAFT -> ISSUED -> VOID) evolves independently of payment_status (UNPAID -> PARTIALLY_PAID -> PAID / WRITTEN_OFF). Combined state is the pair."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /roadside/invoices/{invoiceId}/issue (dimension: issue_status)"
        actor: BillingClerk
        preconditions:
          - "fleet call: fleet.status == ACTIVE (ERR_FLEET_SUSPENDED / ERR_FLEET_CLOSED)"
        side_effects:
          - "issued_at, issued_by, due_at set"
          - "call {REPAIR_COMPLETED, TOWED} -> INVOICED (status_before_invoice snapshot)"
          - "fleet.month_to_date_spend_cents += total_cents (cascade hop 1; calculations.fleet_mtd_spend)"
          - "if month_to_date_spend_cents > monthly_spend_cap_cents: fleet -> SUSPENDED with CREDIT_HOLD (hop 2); then every call of that fleet in {RECEIVED, TRIAGED, DISPATCHED} gets hold_reason = FLEET_CREDIT_HOLD (hop 3); then every PROPOSED dispatch of those calls -> EXPIRED and any DISPATCHED call whose dispatch expired reverts to TRIAGED (hop 4)"
          - "if total_cents == 0 (NO_CHARGE comeback): payment_status -> PAID and call INVOICED -> CLOSED immediately"

      - from: ISSUED
        to: VOID
        trigger: "POST /roadside/invoices/{invoiceId}/void (dimension: issue_status)"
        actor: OpsAdmin
        preconditions:
          - "issued_by != acting X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
          - "no POSTED payments exist on the invoice (ERR_INVOICE_HAS_PAYMENTS)"
        side_effects:
          - "void_reason set"
          - "fleet.month_to_date_spend_cents -= total_cents (compensating invariant)"
          - "if fleet SUSPENDED with CREDIT_HOLD and month_to_date_spend_cents <= monthly_spend_cap_cents: fleet -> ACTIVE (auto-reinstate)"
          - "call INVOICED -> status_before_invoice"

      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "system (on payment posting with 0 < amount_paid_cents < total_cents) (dimension: payment_status)"
        actor: system
        preconditions: []
        side_effects: ["amount_paid_cents / outstanding_cents recomputed"]

      - from: PARTIALLY_PAID
        to: UNPAID
        trigger: "system (on voiding the last POSTED payment) (dimension: payment_status)"
        actor: system
        preconditions: []
        side_effects: ["amount_paid_cents / outstanding_cents recomputed"]

      - from: UNPAID
        to: PAID
        trigger: "system (on payment posting bringing outstanding_cents to 0, or zero-total issue) (dimension: payment_status)"
        actor: system
        preconditions: []
        side_effects: ["call INVOICED -> CLOSED (cascade)"]

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system (on payment posting bringing outstanding_cents to 0) (dimension: payment_status)"
        actor: system
        preconditions: []
        side_effects: ["call INVOICED -> CLOSED (cascade)"]

      - from: UNPAID
        to: WRITTEN_OFF
        trigger: "POST /roadside/invoices/{invoiceId}/write-off (dimension: payment_status)"
        actor: OpsAdmin
        preconditions: ["issue_status == ISSUED", "outstanding_cents > 0"]
        side_effects:
          - "writeoff_reason set"
          - "call INVOICED -> CLOSED"
          - "month_to_date_spend_cents is NOT reduced (write-off is still recognized spend)"

      - from: PARTIALLY_PAID
        to: WRITTEN_OFF
        trigger: "POST /roadside/invoices/{invoiceId}/write-off (dimension: payment_status)"
        actor: OpsAdmin
        preconditions: ["issue_status == ISSUED", "outstanding_cents > 0"]
        side_effects:
          - "writeoff_reason set"
          - "call INVOICED -> CLOSED"
          - "month_to_date_spend_cents is NOT reduced"

  - entity: Payment
    initial_state: POSTED
    terminal_states: [VOID]
    transitions:
      - from: POSTED
        to: VOID
        trigger: "POST /roadside/payments/{paymentId}/void"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "allocation reversed: invoice.amount_paid_cents -= amount_cents; outstanding_cents recomputed (compensating invariant)"
          - "payment_status recomputed (PAID/PARTIALLY_PAID -> PARTIALLY_PAID/UNPAID)"
          - "CallEvent PAYMENT_VOIDED appended"

  - entity: RepeatFailureCase
    initial_state: OPEN
    terminal_states: [REJECTED, RESOLVED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /roadside/repeat-failure-cases/{caseId}/review"
        actor: Dispatcher
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: CONFIRMED_COMEBACK
        trigger: "POST /roadside/repeat-failure-cases/{caseId}/decide (decision=CONFIRMED_COMEBACK)"
        actor: OpsAdmin
        preconditions: ["charge_policy != FULL (else ERR_REPEAT_WINDOW_EXPIRED)"]
        side_effects:
          - "new call: is_comeback := true; repeat_of_call_id := original_service_call_id"
          - "original call CLOSED -> REOPENED with reopened_count += 1"
          - "decided_by set"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /roadside/repeat-failure-cases/{caseId}/decide (decision=REJECTED)"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["decided_by, decision_note set"]

      - from: CONFIRMED_COMEBACK
        to: RESOLVED
        trigger: "system (when the new (comeback) call CLOSES)"
        actor: system
        preconditions: []
        side_effects: ["original call REOPENED -> CLOSED"]

  - entity: FleetAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /roadside/fleet-accounts/{fleetAccountId}/suspend (reason ADMIN) or system (invoice issue crossing monthly cap: CREDIT_HOLD)"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "suspension_reason recorded"
          - "when CREDIT_HOLD: calls in {RECEIVED, TRIAGED, DISPATCHED} get hold_reason = FLEET_CREDIT_HOLD (CallEvent HOLD_FLAGGED appended to each) and their PROPOSED dispatches expire (DISPATCHED calls revert to TRIAGED)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /roadside/fleet-accounts/{fleetAccountId}/reinstate, or system (invoice void / spend adjustment / month rollover drops month_to_date_spend_cents <= monthly_spend_cap_cents while reason == CREDIT_HOLD)"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["suspension_reason := NONE"]

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /roadside/fleet-accounts/{fleetAccountId}/close"
        actor: OpsAdmin
        preconditions: ["no ServiceCall of the fleet in a non-terminal status (else ERR_FLEET_HAS_OPEN_CALLS)"]
        side_effects: []

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /roadside/fleet-accounts/{fleetAccountId}/close"
        actor: OpsAdmin
        preconditions: ["no ServiceCall of the fleet in a non-terminal status (else ERR_FLEET_HAS_OPEN_CALLS)"]
        side_effects: []

  - entity: Technician
    initial_state: OFF_DUTY
    terminal_states: []
    transitions:
      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "POST /roadside/technicians/{technicianId}/set-status (to_status=AVAILABLE)"
        actor: Technician
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: OFF_DUTY
        trigger: "POST /roadside/technicians/{technicianId}/set-status (to_status=OFF_DUTY)"
        actor: Technician
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: ON_BREAK
        trigger: "POST /roadside/technicians/{technicianId}/set-status (to_status=ON_BREAK)"
        actor: Technician
        preconditions: []
        side_effects: []

      - from: ON_BREAK
        to: AVAILABLE
        trigger: "POST /roadside/technicians/{technicianId}/set-status (to_status=AVAILABLE)"
        actor: Technician
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: ON_DISPATCH
        trigger: "system (on dispatch accept)"
        actor: system
        preconditions: []
        side_effects: ["current_dispatch_id set"]

      - from: ON_DISPATCH
        to: AVAILABLE
        trigger: "system (on dispatch complete / release-of-accepted / fleet-suspension expiry)"
        actor: system
        preconditions: []
        side_effects: ["current_dispatch_id cleared"]

  - entity: RestockRequest
    initial_state: PENDING
    terminal_states: [FULFILLED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /roadside/restock-requests/{restockRequestId}/approve"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: FULFILLED
        trigger: "POST /roadside/restock-requests/{restockRequestId}/fulfill"
        actor: OpsAdmin
        preconditions: ["fulfilled_qty >= 1"]
        side_effects:
          - "van_stock_item.qty_on_hand += fulfilled_qty"
          - "van_stock_item.restock_pending recomputed"

      - from: PENDING
        to: REJECTED
        trigger: "POST /roadside/restock-requests/{restockRequestId}/reject"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["van_stock_item.restock_pending recomputed"]

  - entity: PartUsage
    initial_state: POSTED
    terminal_states: [RETURNED]
    transitions:
      - from: POSTED
        to: RETURNED
        trigger: "POST /roadside/part-usages/{partUsageId}/return"
        actor: Technician
        preconditions:
          - "call.status == REPAIR_IN_PROGRESS (returns after completion are refused)"
          - "actor == the call's ON_SITE dispatch technician"
        side_effects:
          - "van_stock_item.qty_on_hand += qty (compensating invariant: post + return leaves qty_on_hand unchanged)"
          - "CallEvent PART_RETURNED appended"

# =============================================================================
# Section 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: estimate-create-stale-call
    parent_entity: ServiceCall
    write_endpoint: "POST /roadside/service-calls/{serviceCallId}/estimates"
    occ_field: expected_service_call_version
    description: |
      Creating a WorkEstimate against a ServiceCall whose version has advanced
      since the client last observed it is rejected. A newer estimate legitimately
      supersedes the prior DRAFT/SUBMITTED/APPROVED one, so the writer who last
      saw version N must send expected_service_call_version == N; any other value
      means the client's view of the call is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispatch-create-stale-call
    parent_entity: ServiceCall
    write_endpoint: "POST /roadside/service-calls/{serviceCallId}/dispatches"
    occ_field: expected_service_call_version
    description: |
      Creating a Dispatch against a ServiceCall whose version has advanced since
      the client last observed it is rejected. A new dispatch legitimately
      supersedes a PROPOSED one, so the expected version must match the client's
      last observation; a mismatch means the client is acting on stale call state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Section 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: after_hours_and_priority
    trigger: "POST /roadside/service-calls (after_hours) and POST /roadside/service-calls/{id}/triage (priority, required_certification, required_part_class)"
    algorithm: threshold
    formula: |
      after_hours = (hour(received_at UTC) >= 18) OR (hour(received_at UTC) < 6)
      # boundary: 18:00:00Z -> true; 17:59:59Z -> false; 06:00:00Z -> false; 05:59:59Z -> true
      priority: severity BLOCKING -> P1_EMERGENCY; DRIVABLE -> P2_URGENT; DEFERRED -> P3_STANDARD
      required_certification: ENGINE_NO_START|OVERHEAT -> ENGINE; BRAKE_FAULT|AIR_LEAK -> BRAKES;
        ELECTRICAL|LIGHTING -> ELECTRICAL; TIRE_BLOWOUT -> TIRES; HVAC_ISSUE -> HVAC; OTHER -> ANY
      required_part_class: ENGINE_NO_START -> ENGINE; OVERHEAT -> COOLING; BRAKE_FAULT -> BRAKE;
        AIR_LEAK -> AIR_SYSTEM; ELECTRICAL -> ELECTRICAL; LIGHTING -> LIGHTING; TIRE_BLOWOUT -> TIRE;
        HVAC_ISSUE -> HVAC; OTHER -> NONE
    input_set: "the ServiceCall being created / triaged"
    constants:
      AFTER_HOURS_START_HOUR: 18
      AFTER_HOURS_END_HOUR: 6
    precision: "integer hours, UTC"

  - name: rate_card_resolution
    trigger: "estimate create, invoice create"
    algorithm: selector
    formula: |
      if call.fleet_account_id is set and fleet.rate_card_id is set:
        card = that RateCard (window not consulted)
      else:
        candidates = RateCards with effective_from <= call.received_at <= effective_to
        # window non-overlap invariant guarantees |candidates| <= 1
        if |candidates| == 0: fail ERR_NO_ACTIVE_RATE_CARD
        card = candidates[0]
    input_set: "all RateCard rows"

  - name: dispatch_technician_selector
    trigger: "GET /roadside/service-calls/{serviceCallId}/dispatch-suggestion"
    algorithm: selector
    formula: |
      eligible = Technicians where:
        status == AVAILABLE
        AND (call.required_certification == ANY OR call.required_certification IN tech.certifications)
        AND (call.required_part_class == NONE OR exists VanStockItem on tech with
             part_class == call.required_part_class AND qty_on_hand >= 1)
      rank ascending by:
        (1) active_dispatch_count = count of tech's dispatches in {PROPOSED, ACCEPTED, EN_ROUTE, ON_SITE}
        (2) last_completed_at = max(completed_at) over tech's COMPLETED dispatches; NULL sorts FIRST
        (3) tech.created_at ASC (final tie-break; id never used)
      if eligible empty: fail ERR_NO_ELIGIBLE_TECHNICIAN
      else: candidate = first row; ranked_technician_ids = ordered ids
    input_set: "all Technicians, their Dispatches and VanStockItems; the TRIAGED call"

  - name: estimate_pricing
    trigger: "estimate create and PATCH /estimates/{id}"
    algorithm: tiered_pricing
    formula: |
      card = rate_card_resolution(call)
      class_rate = card.labor_rate_master_cents if the call's active-dispatch technician is MASTER
                   else card.labor_rate_standard_cents   # no active dispatch -> STANDARD
      mult = card.after_hours_multiplier_bp / 10000 if call.after_hours else 1
      labor = round_half_up(labor_hours_est * class_rate * mult)
      travel = max(0, travel_miles_est - card.travel_free_miles) * card.travel_per_mile_cents
      # provisional basis: ALWAYS one-way with free-mile deduction, even after hours
      travel_time = 0   # estimates never carry a travel-time component
      callout = card.emergency_callout_fee_cents if call.priority == P1_EMERGENCY else 0
      gross = labor + travel + callout
      tier_pct = tier of fleet.month_to_date_spend_cents at this moment (retail: STANDARD)
      discount = round_half_up(gross * tier_pct)
      tax = round_half_up(parts_estimate_cents * card.parts_tax_rate_bp / 10000)
      total_cents = gross - discount + parts_estimate_cents + (tow_estimate_cents if includes_tow else 0) + tax
    input_set: "the estimate inputs, the call, the fleet's current month_to_date_spend_cents, resolved rate card"
    precision: "integer cents; round_half_up at each marked step"
    variants:
      - name: provisional
        when: "estimate create / revise"
        difference: "estimated hours/miles/parts; one-way travel with free-mile deduction regardless of after_hours; no travel-time component"
      - name: final
        when: "invoice creation"
        difference: "see final_invoice_pricing - actuals, after-hours portal-to-portal travel, travel time included; same call data yields a different total"

  - name: final_invoice_pricing
    trigger: "POST /roadside/service-calls/{id}/invoices"
    algorithm: tiered_pricing
    formula: |
      card = rate_card_resolution(call)
      dispatch = the call's COMPLETED dispatch (latest by completed_at)
      mult = card.after_hours_multiplier_bp / 10000 if call.after_hours else 1
      labor_amount_cents = round_half_up(call.labor_hours_actual * class_rate * mult)
      # class_rate from the dispatched technician's labor_rate_class
      # comeback adjustment: NO_CHARGE -> labor/travel/travel_time/callout = 0;
      #                      REDUCED  -> labor_amount_cents = round_half_up(labor_amount_cents / 2)
      if call.after_hours: travel_miles_billable = 2 * dispatch.actual_travel_miles   # portal-to-portal
      else:                travel_miles_billable = max(0, dispatch.actual_travel_miles - card.travel_free_miles)
      travel_amount_cents = travel_miles_billable * card.travel_per_mile_cents
      travel_time_amount_cents = dispatch.actual_travel_minutes * card.travel_time_per_minute_cents
      callout_fee_cents = card.emergency_callout_fee_cents if call.priority == P1_EMERGENCY else 0
      gross = labor + travel_amount + travel_time + callout
      discount_cents = round_half_up(gross * tier_pct)   # tier from fleet_discount_tier (snapshot BEFORE this invoice)
      parts_subtotal_cents = sum(line_total_cents) over POSTED CUSTOMER_PAY PartUsage of the call
      tow_charge_cents = sum(tow_fee_cents) over DELIVERED TowOrders of the call
      tax_cents = round_half_up(parts_subtotal_cents * card.parts_tax_rate_bp / 10000)
      warranty_offset_cents = min(sum(recovered_cents over claims in {APPROVED, SETTLED}),
                                  gross - discount + parts_subtotal + tow + tax)   # floor 0
      total_cents = max(0, gross - discount_cents + parts_subtotal_cents + tow_charge_cents + tax_cents - warranty_offset_cents)
      # PINNED evaluation order: labor -> travel -> travel_time -> callout -> gross -> discount
      #   -> parts_subtotal -> tow -> tax -> warranty_offset -> total. Components are rounded
      #   individually in integer cents; the grand total is never re-rounded.
    input_set: "the REPAIR_COMPLETED|TOWED call, its completed dispatch, POSTED CUSTOMER_PAY usages, DELIVERED tows, decided claims, fleet mtd, resolved rate card"
    precision: "integer cents, round_half_up per component"
    variants:
      - name: final
        when: "invoice creation"
        difference: "actuals basis; after-hours travel portal-to-portal (2x one-way, no free miles); includes travel time"
      - name: provisional
        when: "estimate create / revise"
        difference: "see estimate_pricing - same call, different result"

  - name: travel_charge
    trigger: "within final_invoice_pricing"
    algorithm: threshold
    formula: |
      business hours: billable = max(0, actual_one_way_miles - travel_free_miles)
      after hours:      billable = 2 * actual_one_way_miles
      # boundary: actual == free_miles -> 0 billable; actual == free_miles + 1 -> exactly 1 mile billed
    input_set: "the call's completed dispatch"
    constants:
      PORTAL_TO_PORTAL_FACTOR: 2
    precision: "integer miles and cents"
    variants:
      - name: standard
        when: "call.after_hours == false"
        difference: "one-way basis with free-mile deduction"
      - name: after_hours_portal_to_portal
        when: "call.after_hours == true"
        difference: "2x one-way miles, free-mile allowance NOT deducted - identical mileage yields a higher charge"

  - name: fleet_discount_tier
    trigger: "within estimate_pricing and final_invoice_pricing"
    algorithm: threshold
    formula: |
      # CIRCULAR-LOOKING dependency, order PINNED: invoice total feeds mtd, but the tier used
      # for THIS document is computed from mtd BEFORE this document is added.
      mtd_before = fleet.month_to_date_spend_cents evaluated at document creation time
      tier = PLATINUM (0.10) if mtd_before >= 500000
             else GOLD (0.05) if mtd_before >= 200000
             else STANDARD (0.0)
      # boundaries: 199999 -> STANDARD; 200000 -> GOLD; 499999 -> GOLD; 500000 -> PLATINUM
      # only AFTER total_cents is finalized does fleet.month_to_date_spend_cents += total_cents (at issue)
    input_set: "the fleet row"
    constants:
      GOLD_THRESHOLD_CENTS: 200000
      PLATINUM_THRESHOLD_CENTS: 500000
      GOLD_PCT: 0.05
      PLATINUM_PCT: 0.10
    precision: "tier pct applied with round_half_up to integer cents"

  - name: parts_tax
    trigger: "within estimate_pricing and final_invoice_pricing"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: line_total = qty * unit_price (exact integer cents);
      # subtotal = sum of line totals; tax = round_half_up(subtotal * rate_bp / 10000) ONCE.
      # Per-line tax rounding then summing is FORBIDDEN (can differ by cents).
      parts_subtotal = sum(line_total_cents for POSTED CUSTOMER_PAY usages)
      tax_cents = round_half_up(parts_subtotal * parts_tax_rate_bp / 10000)
    input_set: "the call's PartUsage rows"
    precision: "integer cents, round_half_up, single rounding site"

  - name: warranty_valuation
    trigger: "claim create (oem_value), claim submit (retail_value, recovered)"
    algorithm: dual_valuation
    formula: |
      oem_value_cents = round_half_up(oem_labor_hours * oem_labor_rate_cents) + parts_at_cost_cents
      retail_value_cents = round_half_up(call.labor_hours_actual * card.labor_rate_standard_cents)
                           + sum(line_total_cents over POSTED CUSTOMER_PAY usages)
      # retail basis always uses the STANDARD class rate (OEMs reimburse standard, not premium)
      recovered_cents = min(oem_value_cents, retail_value_cents)
    input_set: "the claim inputs, the REPAIR_COMPLETED call, its POSTED CUSTOMER_PAY usages, resolved rate card"
    precision: "integer cents, round_half_up"
    variants:
      - name: oem_basis
        when: "always computed"
        difference: "flat-rate hours at OEM rate + parts at cost"
      - name: retail_basis
        when: "always computed"
        difference: "actual hours at standard retail rate + parts at retail - identical repair data, different value"

  - name: payment_waterfall_allocation
    trigger: "POST /roadside/invoices/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      buckets in PINNED order with current remaining balances:
        [tax_cents, parts_subtotal_cents, tow_charge_cents, labor_amount_cents,
         travel_time_amount_cents, travel_amount_cents, callout_fee_cents]
      # each bucket's remaining = face value - sum of prior POSTED allocations to it
      allocate payment amount_cents greedily: fill bucket 1, overflow to bucket 2, ... ;
      allocation_json records the per-bucket split for this payment.
      Payments process chronologically by received_at (logical clock); equal timestamps break
      ties by created_at ASC (never id).
    input_set: "the invoice, its POSTED payments"
    precision: "integer cents; final bucket takes the remainder; overpayment refused (ERR_PAYMENT_EXCEEDS_BALANCE)"

  - name: fleet_mtd_spend
    trigger: "invoice issue / invoice void / spend adjustment / read of FleetAccount / run_daily month rollover"
    algorithm: aggregation
    formula: |
      month_to_date_spend_cents =
        sum(total_cents over the fleet's invoices with issue_status == ISSUED
            and issued_at inside the logical clock's current calendar month [inclusive start, exclusive end))
        + sum(amount_cents over the fleet's spend adjustments created in the same window)
      # crossing monthly_spend_cap_cents (strictly greater) at issue triggers the suspension cascade;
      # projected check at estimate approval: mtd + estimate.total > cap -> ERR_MONTHLY_CAP_EXCEEDED
      # unless OpsAdmin passes override_cap: true. Boundary: projected == cap is ALLOWED.
    input_set: "the fleet's invoices and spend adjustments in the current clock month"
    precision: "integer cents"

  - name: repeat_failure_window
    trigger: "POST /roadside/repeat-failure-cases"
    algorithm: threshold
    formula: |
      window_days = floor((new_call.received_at - original_call.completed_at) / 86400)
      miles_since_repair = vehicle.odometer_miles - original_call.completion_odometer_miles
      charge_policy = NO_CHARGE if window_days <= 30 AND miles_since_repair <= 1000
                      else REDUCED if window_days <= 45 AND miles_since_repair <= 2000
                      else FULL
      # boundaries: day 30 / 1000 mi -> NO_CHARGE; day 31 (miles ok) -> REDUCED; day 45/2000mi -> REDUCED; day 46 -> FULL
    input_set: "the two calls and the vehicle"
    precision: "integer days and miles"

  - name: van_stock_reorder_trigger
    trigger: "after each PartUsage posting and each van-stock adjust"
    algorithm: threshold
    formula: |
      if qty_on_hand <= reorder_point AND no RestockRequest for this item in {PENDING, APPROVED}:
        create RestockRequest(source=AUTO_LOW_STOCK,
                              qty_requested = max(1, reorder_point + 2 - qty_on_hand))
        restock_pending = true
      # boundary: qty_on_hand == reorder_point triggers; reorder_point + 1 does not
    input_set: "the VanStockItem and its RestockRequests"
    precision: "integer units"

  - name: inspection_deadline_escalation
    trigger: "POST /roadside/_ops/run_daily"
    algorithm: threshold
    formula: |
      correction_deadline_at = discovered_at + 15 days (set at creation)
      for each InspectionDefect with status in {OPEN, REPAIR_SCHEDULED, CORRECTED, VERIFICATION_FAILED}
      and now > correction_deadline_at: status -> ESCALATED, escalation_count += 1
      # boundary: now == correction_deadline_at does NOT escalate (strictly greater)
    input_set: "all non-terminal defects"
    precision: "datetime comparison, UTC"

  - name: stale_dispatch_estimate_expiry
    trigger: "POST /roadside/_ops/run_daily"
    algorithm: threshold
    formula: |
      for each Dispatch in PROPOSED with window_end_at < now: -> EXPIRED; its call DISPATCHED -> TRIAGED
      for each WorkEstimate in SUBMITTED with now > submitted_at + 7 days: -> EXPIRED
      for each fleet SUSPENDED with reason CREDIT_HOLD: recompute month_to_date_spend_cents;
        if <= monthly_spend_cap_cents (e.g. after month rollover): -> ACTIVE, suspension_reason = NONE
    input_set: "all PROPOSED dispatches, SUBMITTED estimates, CREDIT_HOLD-suspended fleets"
    precision: "datetime comparison, UTC"

  - name: vehicle_roadworthiness
    trigger: "defect create, defect verify, defect status change"
    algorithm: aggregation
    formula: |
      roadworthiness = OUT_OF_SERVICE if exists InspectionDefect of the vehicle with
        severity == OOS and status in {OPEN, REPAIR_SCHEDULED, CORRECTED, VERIFICATION_FAILED, ESCALATED}
        else ROADWORTHY
    input_set: "the vehicle's defects"
    precision: "boolean derivation"

  - name: invoice_due_date
    trigger: "invoice issue"
    algorithm: projection
    formula: |
      due_at = issued_at + (fleet.payment_terms_days if fleet call else 0) days
      is_overdue (read-time) = now > due_at AND outstanding_cents > 0
    input_set: "the invoice and its fleet"
    precision: "datetime, UTC"

# =============================================================================
# Section 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and non-blank", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's declared roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership scope: Technician acts only on own dispatches / own on-site call work; FleetManager acts only on own fleet's estimates, calls, invoices", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "dispatch actions, diagnose, start-repair, complete-repair, part usage, mark-corrected, estimate approve/reject, fleet-scoped reads" }
  - { priority: 4, category: existence, check: "Path template ids resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all id-parameterized endpoints" }
  - { priority: 5, category: existence, check: "Body foreign keys resolve (vehicle_id, technician_id, van_stock_item_id, service_call_id, original/new_service_call_id, rate_card_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "create/action endpoints with body FKs" }
  - { priority: 6, category: business_constraint, check: "Request shape: required fields present, types correct, unknown fields rejected, quantities >= 1, amounts >= 0, window_end > window_start", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 7, category: business_constraint, check: "Enum fields carry declared members only", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all write endpoints with enum inputs" }
  - { priority: 8, category: state, check: "Target entity is in a from-state of the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "ServiceCall is not CANCELLED (terminal) for any further action", error_id: ERR_CALL_ALREADY_TERMINAL, http_status: 409, applies_to: "call-scoped actions" }
  - { priority: 10, category: state, check: "OCC: expected_service_call_version equals the call's current version on estimate/dispatch create", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST .../estimates, POST .../dispatches" }
  - { priority: 11, category: state, check: "start-repair: no WorkEstimate of the call in {DRAFT, SUBMITTED}", error_id: ERR_ESTIMATE_NOT_APPROVED, http_status: 409, applies_to: "POST .../start-repair" }
  - { priority: 12, category: state, check: "verify requires defect status CORRECTED", error_id: ERR_DEFECT_NOT_CORRECTED, http_status: 409, applies_to: "POST .../verify" }
  - { priority: 13, category: state, check: "appeal requires appeal_count < 2", error_id: ERR_APPEAL_LIMIT_REACHED, http_status: 409, applies_to: "POST .../appeal" }
  - { priority: 14, category: business_safety, check: "dispatch create: call.required_certification == ANY or in technician.certifications", error_id: ERR_TECHNICIAN_NOT_CERTIFIED, http_status: 409, applies_to: "POST .../dispatches" }
  - { priority: 15, category: business_safety, check: "invoice void: issued_by != acting X-User-ID", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST .../invoices/{id}/void" }
  - { priority: 16, category: business_temporal, check: "dispatch create: technician has no dispatch in {PROPOSED, ACCEPTED, EN_ROUTE, ON_SITE} whose [window_start, window_end) overlaps the new window (half-open: touching endpoints allowed)", error_id: ERR_DISPATCH_WINDOW_OVERLAP, http_status: 409, applies_to: "POST .../dispatches" }
  - { priority: 17, category: business_temporal, check: "tow create: no other TowOrder on the same tow_unit_id in {REQUESTED, HOOKED} whose pickup window expanded by +/-30 minutes intersects the new expanded window (touching counts as conflict)", error_id: ERR_TOW_WINDOW_OVERLAP, http_status: 409, applies_to: "POST .../tow-orders" }
  - { priority: 18, category: business_temporal, check: "rate card create: [effective_from, effective_to] must not overlap any existing card's closed window; touching endpoints count as overlap", error_id: ERR_RATE_CARD_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /roadside/rate-cards" }
  - { priority: 19, category: business_temporal, check: "odometer inputs must be >= vehicle.odometer_miles (PATCH vehicle, complete-repair)", error_id: ERR_ODOMETER_REGRESSION, http_status: 422, applies_to: "PATCH /roadside/vehicles/{id}, POST .../complete-repair" }
  - { priority: 20, category: business_temporal, check: "logical clock may only move forward", error_id: ERR_CLOCK_REGRESSION, http_status: 422, applies_to: "POST /roadside/_clock/set_current_utc" }
  - { priority: 21, category: business_referential, check: "fleet-scoped writes (intake, dispatch create, estimate approve, invoice issue) require fleet.status == ACTIVE when the fleet is SUSPENDED", error_id: ERR_FLEET_SUSPENDED, http_status: 409, applies_to: "intake, dispatch create, estimate approve, invoice issue" }
  - { priority: 22, category: business_referential, check: "same gate when fleet.status == CLOSED", error_id: ERR_FLEET_CLOSED, http_status: 409, applies_to: "intake, dispatch create, estimate approve, invoice issue" }
  - { priority: 23, category: business_referential, check: "fleet close requires no fleet ServiceCall in a non-terminal status", error_id: ERR_FLEET_HAS_OPEN_CALLS, http_status: 409, applies_to: "POST .../fleet-accounts/{id}/close" }
  - { priority: 24, category: business_referential, check: "claim create (OEM types): call.received_at < vehicle.oem_warranty_expires_at AND call.completion_odometer_miles <= vehicle.oem_warranty_miles_limit", error_id: ERR_WARRANTY_WINDOW_EXPIRED, http_status: 409, applies_to: "POST .../warranty-claims" }
  - { priority: 25, category: business_referential, check: "claim create (EXTENDED_SERVICE_CONTRACT): vehicle.extended_warranty == true", error_id: ERR_WARRANTY_NOT_APPLICABLE, http_status: 409, applies_to: "POST .../warranty-claims" }
  - { priority: 26, category: business_referential, check: "invoice create: no WarrantyClaim of the call in {DRAFT, SUBMITTED, APPEALED}", error_id: ERR_WARRANTY_CLAIM_UNDECIDED, http_status: 409, applies_to: "POST .../invoices" }
  - { priority: 27, category: business_referential, check: "part usage: van_stock_item.technician_id == the call's ON_SITE dispatch technician", error_id: ERR_PART_NOT_ON_VAN, http_status: 409, applies_to: "POST .../part-usages" }
  - { priority: 28, category: business_referential, check: "attach-call / repeat-case: referenced calls belong to the same vehicle as the defect/case", error_id: ERR_VEHICLE_MISMATCH, http_status: 409, applies_to: "POST .../attach-call, POST /roadside/repeat-failure-cases" }
  - { priority: 29, category: business_constraint, check: "vin unique across vehicles; employee_code unique across technicians; account_number unique across fleets", error_id: ERR_DUPLICATE_VIN, http_status: 409, applies_to: "POST /roadside/vehicles, POST /roadside/technicians, POST /roadside/fleet-accounts" }
  - { priority: 30, category: business_constraint, check: "at most one RepeatFailureCase per vehicle in {OPEN, UNDER_REVIEW, CONFIRMED_COMEBACK}", error_id: ERR_DUPLICATE_OPEN_CASE, http_status: 409, applies_to: "POST /roadside/repeat-failure-cases" }
  - { priority: 31, category: business_constraint, check: "invoice create: no other invoice of the call with issue_status != VOID; claim create: no non-VOID invoice exists for the call", error_id: ERR_INVOICE_EXISTS, http_status: 409, applies_to: "POST .../invoices, POST .../warranty-claims" }
  - { priority: 32, category: business_constraint, check: "dispatch create: no dispatch of the call in {ACCEPTED, EN_ROUTE, ON_SITE}", error_id: ERR_DISPATCH_ACTIVE, http_status: 409, applies_to: "POST .../dispatches" }
  - { priority: 33, category: business_constraint, check: "start-repair requires resolution_path == ON_SITE_REPAIR; tow create requires resolution_path == TOW_REQUIRED", error_id: ERR_RESOLUTION_PATH_CONFLICT, http_status: 409, applies_to: "POST .../start-repair, POST .../tow-orders" }
  - { priority: 34, category: business_constraint, check: "part usage qty <= van_stock_item.qty_on_hand", error_id: ERR_INSUFFICIENT_VAN_STOCK, http_status: 409, applies_to: "POST .../part-usages" }
  - { priority: 35, category: business_constraint, check: "dispatch-suggestion: eligible pool non-empty", error_id: ERR_NO_ELIGIBLE_TECHNICIAN, http_status: 409, applies_to: "GET .../dispatch-suggestion" }
  - { priority: 36, category: business_constraint, check: "repeat case: new call symptom_category == original call symptom_category", error_id: ERR_REPEAT_SYMPTOM_MISMATCH, http_status: 409, applies_to: "POST /roadside/repeat-failure-cases" }
  - { priority: 37, category: business_fiscal, check: "a rate card resolves for the call (fleet card or window-covering card)", error_id: ERR_NO_ACTIVE_RATE_CARD, http_status: 409, applies_to: "POST .../estimates, POST .../invoices" }
  - { priority: 38, category: business_fiscal, check: "estimate approve: total_cents > fleet.per_call_authorization_limit_cents requires FleetManager of that fleet or OpsAdmin", error_id: ERR_AUTHORIZATION_REQUIRED, http_status: 409, applies_to: "POST .../estimates/{id}/approve" }
  - { priority: 39, category: business_fiscal, check: "estimate approve: fleet.month_to_date_spend_cents + total_cents > monthly_spend_cap_cents without OpsAdmin override_cap", error_id: ERR_MONTHLY_CAP_EXCEEDED, http_status: 409, applies_to: "POST .../estimates/{id}/approve" }
  - { priority: 40, category: business_fiscal, check: "payment amount_cents <= invoice.outstanding_cents", error_id: ERR_PAYMENT_EXCEEDS_BALANCE, http_status: 422, applies_to: "POST .../payments" }
  - { priority: 41, category: business_fiscal, check: "invoice void: no POSTED payments on the invoice", error_id: ERR_INVOICE_HAS_PAYMENTS, http_status: 409, applies_to: "POST .../invoices/{id}/void" }

# =============================================================================
# Section 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock & ops run (test-driving / operator surface) ---
  - { method: POST, path: "/roadside/_clock/set_current_utc", description: "Advance the logical clock. Server boots with the clock fixed at 2026-08-01T00:00:00Z (never wall-clock); this endpoint moves it forward only.", roles: [OpsAdmin], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["rejects backward movement with ERR_CLOCK_REGRESSION"] }
  - { method: POST, path: "/roadside/_ops/run_daily", description: "Daily operations checkpoint: expire stale PROPOSED dispatches and stale SUBMITTED estimates, escalate overdue defects, reinstate CREDIT_HOLD fleets whose month spend is back within cap (incl. month rollover).", roles: [OpsAdmin], code: 200, input: [], output: { expired_dispatch_count: integer, expired_estimate_count: integer, escalated_defect_count: integer, reinstated_fleet_count: integer }, side_effects: ["calculations.stale_dispatch_estimate_expiry", "calculations.inspection_deadline_escalation", "calculations.fleet_mtd_spend"] }

  # --- FleetAccount ---
  - { method: POST, path: "/roadside/fleet-accounts", description: "Create a fleet account", roles: [OpsAdmin], code: 201, input: [company_name, account_number, billing_email, per_call_authorization_limit_cents, monthly_spend_cap_cents, "payment_terms_days?", "rate_card_id?"], output: FleetAccount, side_effects: ["status=ACTIVE, suspension_reason=NONE, month_to_date_spend_cents=0"] }
  - { method: GET, path: "/roadside/fleet-accounts/{fleetAccountId}", description: "Get a fleet account (FleetManager limited to own id)", roles: [OpsAdmin, Dispatcher, BillingClerk, FleetManager, WarrantyAdministrator], code: 200, input: [], output: FleetAccount, side_effects: [] }
  - { method: GET, path: "/roadside/fleet-accounts", description: "List fleet accounts", roles: [OpsAdmin, Dispatcher, BillingClerk], code: 200, input: ["status?", "rate_card_id?", "limit?", "offset?"], output: "FleetAccount[]", side_effects: [] }
  - { method: PATCH, path: "/roadside/fleet-accounts/{fleetAccountId}", description: "Update fleet limits / terms / rate card", roles: [OpsAdmin], code: 200, input: ["per_call_authorization_limit_cents?", "monthly_spend_cap_cents?", "payment_terms_days?", "rate_card_id?"], output: FleetAccount, side_effects: ["increments FleetAccount.version"] }
  - { method: POST, path: "/roadside/fleet-accounts/{fleetAccountId}/suspend", description: "Manual suspension (reason ADMIN)", roles: [OpsAdmin], code: 200, input: [], output: FleetAccount, side_effects: ["status -> SUSPENDED, suspension_reason=ADMIN"] }
  - { method: POST, path: "/roadside/fleet-accounts/{fleetAccountId}/reinstate", description: "Manual reinstatement", roles: [OpsAdmin], code: 200, input: [], output: FleetAccount, side_effects: ["status -> ACTIVE, suspension_reason=NONE"] }
  - { method: POST, path: "/roadside/fleet-accounts/{fleetAccountId}/close", description: "Close a fleet (requires no non-terminal calls)", roles: [OpsAdmin], code: 200, input: [], output: FleetAccount, side_effects: ["status -> CLOSED"] }
  - { method: POST, path: "/roadside/fleet-accounts/{fleetAccountId}/spend-adjustments", description: "Billing correction: signed adjustment to current-month spend (credit memo / surcharge true-up). Decreases can auto-reinstate a CREDIT_HOLD fleet.", roles: [OpsAdmin, BillingClerk], code: 201, input: [amount_cents, reason], output: FleetAccount, side_effects: ["month_to_date_spend_cents += amount_cents", "auto-reinstate evaluation (calculations.fleet_mtd_spend)"] }

  # --- Vehicle ---
  - { method: POST, path: "/roadside/vehicles", description: "Register a vehicle", roles: [OpsAdmin, Dispatcher], code: 201, input: [vin, unit_number, make, model, year, odometer_miles, "fleet_account_id?", "oem_warranty_expires_at?", "oem_warranty_miles_limit?", "extended_warranty?"], output: Vehicle, side_effects: ["roadworthiness=ROADWORTHY"] }
  - { method: GET, path: "/roadside/vehicles/{vehicleId}", description: "Get a vehicle", roles: [OpsAdmin, Dispatcher, Technician, FleetManager, BillingClerk, SafetyOfficer, WarrantyAdministrator], code: 200, input: [], output: Vehicle, side_effects: [] }
  - { method: GET, path: "/roadside/vehicles", description: "List vehicles", roles: [OpsAdmin, Dispatcher, FleetManager, SafetyOfficer], code: 200, input: ["fleet_account_id?", "roadworthiness?", "limit?", "offset?"], output: "Vehicle[]", side_effects: [] }
  - { method: PATCH, path: "/roadside/vehicles/{vehicleId}", description: "Update odometer (monotone) and warranty data", roles: [OpsAdmin, Dispatcher, Technician], code: 200, input: ["odometer_miles?", "unit_number?", "oem_warranty_expires_at?", "oem_warranty_miles_limit?", "extended_warranty?"], output: Vehicle, side_effects: ["odometer regression -> ERR_ODOMETER_REGRESSION"] }

  # --- Technician ---
  - { method: POST, path: "/roadside/technicians", description: "Onboard a technician", roles: [OpsAdmin], code: 201, input: [full_name, employee_code, certifications, labor_rate_class, home_depot_city], output: Technician, side_effects: ["status=OFF_DUTY"] }
  - { method: GET, path: "/roadside/technicians/{technicianId}", description: "Get a technician", roles: [OpsAdmin, Dispatcher, Technician], code: 200, input: [], output: Technician, side_effects: [] }
  - { method: GET, path: "/roadside/technicians", description: "List technicians", roles: [OpsAdmin, Dispatcher], code: 200, input: ["status?", "current_dispatch_id?", "limit?", "offset?"], output: "Technician[]", side_effects: [] }
  - { method: POST, path: "/roadside/technicians/{technicianId}/set-status", description: "Self-service availability transitions among {OFF_DUTY, AVAILABLE, ON_BREAK}; ON_DISPATCH is system-managed", roles: [OpsAdmin, Technician], code: 200, input: [to_status], output: Technician, side_effects: ["status transition per Technician machine"] }

  # --- RateCard ---
  - { method: POST, path: "/roadside/rate-cards", description: "Publish a rate card with a non-overlapping closed effective window", roles: [OpsAdmin], code: 201, input: [name, labor_rate_standard_cents, labor_rate_master_cents, after_hours_multiplier_bp, travel_free_miles, travel_per_mile_cents, travel_time_per_minute_cents, emergency_callout_fee_cents, parts_tax_rate_bp, effective_from, effective_to], output: RateCard, side_effects: ["window overlap -> ERR_RATE_CARD_WINDOW_OVERLAP"] }
  - { method: GET, path: "/roadside/rate-cards/{rateCardId}", description: "Get a rate card", roles: [OpsAdmin, Dispatcher, BillingClerk], code: 200, input: [], output: RateCard, side_effects: [] }
  - { method: GET, path: "/roadside/rate-cards", description: "List rate cards", roles: [OpsAdmin, Dispatcher, BillingClerk], code: 200, input: ["limit?", "offset?"], output: "RateCard[]", side_effects: [] }

  # --- VanStockItem ---
  - { method: POST, path: "/roadside/technicians/{technicianId}/van-stock", description: "Stock a part on a technician's van", roles: [OpsAdmin], code: 201, input: [part_number, description, part_class, qty_on_hand, unit_cost_cents, unit_retail_cents, "reorder_point?"], output: VanStockItem, side_effects: ["restock_pending=false"] }
  - { method: GET, path: "/roadside/van-stock/{vanStockItemId}", description: "Get a van stock item", roles: [OpsAdmin, Dispatcher, Technician], code: 200, input: [], output: VanStockItem, side_effects: [] }
  - { method: GET, path: "/roadside/van-stock", description: "List van stock", roles: [OpsAdmin, Dispatcher, Technician], code: 200, input: ["technician_id?", "part_class?", "limit?", "offset?"], output: "VanStockItem[]", side_effects: [] }
  - { method: POST, path: "/roadside/van-stock/{vanStockItemId}/adjust", description: "Manual stock correction (signed delta; result must be >= 0); re-evaluates the reorder trigger", roles: [OpsAdmin, Technician], code: 200, input: [qty_delta, reason], output: VanStockItem, side_effects: ["qty_on_hand += qty_delta", "calculations.van_stock_reorder_trigger"] }

  # --- ServiceCall ---
  - { method: POST, path: "/roadside/service-calls", description: "Intake a service call; stamps received_at from the logical clock and computes after_hours", roles: [Dispatcher, OpsAdmin], code: 201, input: [vehicle_id, caller_name, caller_phone, breakdown_location_text, distance_miles_from_depot, symptom_category, symptom_description], output: ServiceCall, side_effects: ["status=RECEIVED", "fleet_account_id denormalized from vehicle", "fleet SUSPENDED/CLOSED gate", "CallEvent CALL_RECEIVED"] }
  - { method: GET, path: "/roadside/service-calls/{serviceCallId}", description: "Get a service call", roles: [OpsAdmin, Dispatcher, Technician, FleetManager, BillingClerk, WarrantyAdministrator, SafetyOfficer], code: 200, input: [], output: ServiceCall, side_effects: [] }
  - { method: GET, path: "/roadside/service-calls", description: "List service calls", roles: [OpsAdmin, Dispatcher, FleetManager, BillingClerk], code: 200, input: ["fleet_account_id?", "vehicle_id?", "status?", "linked_defect_id?", "repeat_of_call_id?", "limit?", "offset?"], output: "ServiceCall[]", side_effects: [] }
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/triage", description: "Set severity; computes priority and required certification/part class", roles: [Dispatcher, OpsAdmin], code: 200, input: [severity, "symptom_category?"], output: ServiceCall, side_effects: ["status -> TRIAGED", "calculations.after_hours_and_priority"] }
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/diagnose", description: "On-site technician records diagnosis and the repair-vs-tow decision", roles: [Technician], code: 200, input: [diagnosis_summary, resolution_path], output: ServiceCall, side_effects: ["status -> DIAGNOSED"] }
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/start-repair", description: "Begin wrench time (estimate gate applies)", roles: [Technician], code: 200, input: [], output: ServiceCall, side_effects: ["status -> REPAIR_IN_PROGRESS"] }
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/complete-repair", description: "Finish repair; records actual labor hours and odometer", roles: [Technician], code: 200, input: [labor_hours_actual, completion_odometer_miles], output: ServiceCall, side_effects: ["status -> REPAIR_COMPLETED", "vehicle.odometer_miles updated"] }
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/cancel", description: "Cancel a call before on-site work (FleetManager: own fleet's calls only)", roles: [Dispatcher, OpsAdmin, FleetManager], code: 200, input: [reason], output: ServiceCall, side_effects: ["status -> CANCELLED", "active dispatches -> RELEASED, technicians freed"] }
  - { method: GET, path: "/roadside/service-calls/{serviceCallId}/dispatch-suggestion", description: "Selector read: ranked eligible technicians for this TRIAGED call", roles: [Dispatcher, OpsAdmin], code: 200, input: [], output: { candidate_technician_id: string, ranked_technician_ids: array }, side_effects: ["calculations.dispatch_technician_selector; empty pool -> ERR_NO_ELIGIBLE_TECHNICIAN"] }
  - { method: GET, path: "/roadside/service-calls/{serviceCallId}/events", description: "Append-only audit trail of the call", roles: [OpsAdmin, Dispatcher, FleetManager, BillingClerk], code: 200, input: ["event_type?", "limit?", "offset?"], output: "CallEvent[]", side_effects: [] }
  - { method: GET, path: "/roadside/call-events/{callEventId}", description: "Get a single call event", roles: [OpsAdmin, Dispatcher, FleetManager, BillingClerk], code: 200, input: [], output: CallEvent, side_effects: [] }
  - { method: GET, path: "/roadside/call-events", description: "List call events across calls (audit search)", roles: [OpsAdmin, Dispatcher, FleetManager, BillingClerk], code: 200, input: ["service_call_id?", "event_type?", "limit?", "offset?"], output: "CallEvent[]", side_effects: [] }

  # --- Dispatch ---
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/dispatches", description: "Propose a dispatch (OCC on the call; supersedes a PROPOSED dispatch)", roles: [Dispatcher, OpsAdmin], code: 201, input: [technician_id, window_start_at, window_end_at, planned_travel_miles, expected_service_call_version], output: Dispatch, side_effects: ["increments ServiceCall.version by 1", "prior PROPOSED dispatch -> SUPERSEDED", "call TRIAGED -> DISPATCHED", "certification + window-overlap + fleet-status gates"] }
  - { method: GET, path: "/roadside/dispatches/{dispatchId}", description: "Get a dispatch", roles: [OpsAdmin, Dispatcher, Technician], code: 200, input: [], output: Dispatch, side_effects: [] }
  - { method: GET, path: "/roadside/dispatches", description: "List dispatches", roles: [OpsAdmin, Dispatcher, Technician], code: 200, input: ["service_call_id?", "technician_id?", "status?", "limit?", "offset?"], output: "Dispatch[]", side_effects: [] }
  - { method: POST, path: "/roadside/dispatches/{dispatchId}/accept", description: "Assigned technician accepts", roles: [Technician], code: 200, input: [], output: Dispatch, side_effects: ["technician AVAILABLE -> ON_DISPATCH"] }
  - { method: POST, path: "/roadside/dispatches/{dispatchId}/reject", description: "Assigned technician rejects", roles: [Technician], code: 200, input: ["reason?"], output: Dispatch, side_effects: ["call DISPATCHED -> TRIAGED"] }
  - { method: POST, path: "/roadside/dispatches/{dispatchId}/depart", description: "Technician departs (clock stamps departed_at)", roles: [Technician], code: 200, input: [], output: Dispatch, side_effects: ["call DISPATCHED -> EN_ROUTE"] }
  - { method: POST, path: "/roadside/dispatches/{dispatchId}/arrive", description: "Technician arrives; records actual one-way miles and travel minutes", roles: [Technician], code: 200, input: [actual_travel_miles], output: Dispatch, side_effects: ["call EN_ROUTE -> ON_SITE", "actual_travel_minutes computed"] }
  - { method: POST, path: "/roadside/dispatches/{dispatchId}/complete", description: "Close out the dispatch after work/handoff", roles: [Technician], code: 200, input: [], output: Dispatch, side_effects: ["technician ON_DISPATCH -> AVAILABLE"] }
  - { method: POST, path: "/roadside/dispatches/{dispatchId}/release", description: "Dispatcher pulls a PROPOSED/ACCEPTED dispatch", roles: [Dispatcher, OpsAdmin], code: 200, input: ["reason?"], output: Dispatch, side_effects: ["ACCEPTED: technician -> AVAILABLE", "call DISPATCHED -> TRIAGED"] }

  # --- WorkEstimate ---
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/estimates", description: "Create an estimate (OCC on the call); supersedes prior estimates in {DRAFT, SUBMITTED, APPROVED}", roles: [Technician, Dispatcher, OpsAdmin], code: 201, input: [labor_hours_est, travel_miles_est, parts_estimate_cents, "includes_tow?", "tow_estimate_cents?", expected_service_call_version], output: WorkEstimate, side_effects: ["increments ServiceCall.version by 1", "prior estimates -> SUPERSEDED", "calculations.estimate_pricing", "CallEvent ESTIMATE_CREATED appended"] }
  - { method: GET, path: "/roadside/estimates/{estimateId}", description: "Get an estimate", roles: [OpsAdmin, Dispatcher, Technician, FleetManager, BillingClerk], code: 200, input: [], output: WorkEstimate, side_effects: [] }
  - { method: GET, path: "/roadside/estimates", description: "List estimates", roles: [OpsAdmin, Dispatcher, FleetManager], code: 200, input: ["service_call_id?", "status?", "limit?", "offset?"], output: "WorkEstimate[]", side_effects: [] }
  - { method: PATCH, path: "/roadside/estimates/{estimateId}", description: "Edit a DRAFT estimate, or revise a REJECTED one back to DRAFT (revision + 1)", roles: [Technician, Dispatcher, OpsAdmin], code: 200, input: ["labor_hours_est?", "travel_miles_est?", "parts_estimate_cents?", "includes_tow?", "tow_estimate_cents?"], output: WorkEstimate, side_effects: ["total_cents recomputed"] }
  - { method: POST, path: "/roadside/estimates/{estimateId}/submit", description: "Submit an estimate for approval", roles: [Technician, Dispatcher, OpsAdmin], code: 200, input: [], output: WorkEstimate, side_effects: ["status -> SUBMITTED", "submitted_at set"] }
  - { method: POST, path: "/roadside/estimates/{estimateId}/approve", description: "Approve: Dispatcher/OpsAdmin within the fleet limit, FleetManager (own fleet) or OpsAdmin above it; monthly cap projected check", roles: [Dispatcher, FleetManager, OpsAdmin], code: 200, input: ["override_cap?"], output: WorkEstimate, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/roadside/estimates/{estimateId}/reject", description: "Reject a submitted estimate", roles: [FleetManager, OpsAdmin], code: 200, input: ["reason?"], output: WorkEstimate, side_effects: ["status -> REJECTED"] }

  # --- PartUsage ---
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/part-usages", description: "Consume van parts on the call (repair in progress, own van only)", roles: [Technician], code: 201, input: [van_stock_item_id, qty, "charge_type?"], output: PartUsage, side_effects: ["qty_on_hand -= qty", "calculations.van_stock_reorder_trigger", "CallEvent PART_POSTED"] }
  - { method: GET, path: "/roadside/part-usages/{partUsageId}", description: "Get a part usage", roles: [OpsAdmin, Dispatcher, Technician, BillingClerk], code: 200, input: [], output: PartUsage, side_effects: [] }
  - { method: GET, path: "/roadside/part-usages", description: "List part usages", roles: [OpsAdmin, Dispatcher, Technician, BillingClerk], code: 200, input: ["service_call_id?", "van_stock_item_id?", "status?", "limit?", "offset?"], output: "PartUsage[]", side_effects: [] }
  - { method: POST, path: "/roadside/part-usages/{partUsageId}/return", description: "Return the full line to van stock (repair must still be in progress)", roles: [Technician], code: 200, input: [], output: PartUsage, side_effects: ["status -> RETURNED", "qty_on_hand += qty"] }

  # --- TowOrder ---
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/tow-orders", description: "Order a tow (call must be DIAGNOSED with resolution_path == TOW_REQUIRED)", roles: [Dispatcher, Technician, OpsAdmin], code: 201, input: [tow_provider_name, tow_unit_id, pickup_location_text, dropoff_location_text, pickup_window_start_at, pickup_window_end_at, tow_fee_cents], output: TowOrder, side_effects: ["call DIAGNOSED -> TOW_IN_PROGRESS", "buffered tow-window overlap check"] }
  - { method: GET, path: "/roadside/tow-orders/{towOrderId}", description: "Get a tow order", roles: [OpsAdmin, Dispatcher, Technician, BillingClerk], code: 200, input: [], output: TowOrder, side_effects: [] }
  - { method: GET, path: "/roadside/tow-orders", description: "List tow orders", roles: [OpsAdmin, Dispatcher, BillingClerk], code: 200, input: ["service_call_id?", "tow_unit_id?", "status?", "limit?", "offset?"], output: "TowOrder[]", side_effects: [] }
  - { method: POST, path: "/roadside/tow-orders/{towOrderId}/hook", description: "Tow unit hooked the vehicle", roles: [Dispatcher, OpsAdmin], code: 200, input: [], output: TowOrder, side_effects: ["status -> HOOKED"] }
  - { method: POST, path: "/roadside/tow-orders/{towOrderId}/deliver", description: "Tow delivered", roles: [Dispatcher, OpsAdmin], code: 200, input: [], output: TowOrder, side_effects: ["status -> DELIVERED", "call -> TOWED"] }
  - { method: POST, path: "/roadside/tow-orders/{towOrderId}/cancel", description: "Cancel a requested tow", roles: [Dispatcher, OpsAdmin], code: 200, input: [], output: TowOrder, side_effects: ["status -> CANCELLED", "call -> DIAGNOSED"] }

  # --- WarrantyClaim ---
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/warranty-claims", description: "File a warranty claim (call must be REPAIR_COMPLETED, no non-VOID invoice yet)", roles: [Technician, WarrantyAdministrator], code: 201, input: [claim_type, oem_labor_hours, oem_labor_rate_cents, parts_at_cost_cents], output: WarrantyClaim, side_effects: ["status=DRAFT", "oem_value_cents computed", "warranty window gates"] }
  - { method: GET, path: "/roadside/warranty-claims/{claimId}", description: "Get a claim", roles: [OpsAdmin, Dispatcher, Technician, WarrantyAdministrator, BillingClerk], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: GET, path: "/roadside/warranty-claims", description: "List claims", roles: [OpsAdmin, WarrantyAdministrator, BillingClerk], code: 200, input: ["service_call_id?", "vehicle_id?", "filed_by_technician_id?", "status?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: POST, path: "/roadside/warranty-claims/{claimId}/submit", description: "Submit to the OEM/administrator queue; computes retail basis and recovered split", roles: [WarrantyAdministrator], code: 200, input: [], output: WarrantyClaim, side_effects: ["status -> SUBMITTED", "retail_value_cents, recovered_cents computed"] }
  - { method: POST, path: "/roadside/warranty-claims/{claimId}/decide", description: "Decide a SUBMITTED or APPEALED claim (APPROVED/DENIED)", roles: [WarrantyAdministrator], code: 200, input: [decision, "denial_reason?"], output: WarrantyClaim, side_effects: ["status -> APPROVED | DENIED"] }
  - { method: POST, path: "/roadside/warranty-claims/{claimId}/appeal", description: "Appeal a DENIED claim (max 2 appeals)", roles: [Dispatcher, OpsAdmin], code: 200, input: [], output: WarrantyClaim, side_effects: ["status -> APPEALED", "appeal_count += 1"] }
  - { method: POST, path: "/roadside/warranty-claims/{claimId}/settle", description: "Record OEM remittance; amount must equal recovered_cents", roles: [WarrantyAdministrator], code: 200, input: [settled_amount_cents], output: WarrantyClaim, side_effects: ["status -> SETTLED"] }

  # --- InspectionDefect ---
  - { method: POST, path: "/roadside/vehicles/{vehicleId}/inspection-defects", description: "Record a roadside-inspection defect; OOS severity flips the vehicle OUT_OF_SERVICE", roles: [SafetyOfficer, OpsAdmin], code: 201, input: [source, defect_code, severity, "citation_reference?", discovered_at], output: InspectionDefect, side_effects: ["status=OPEN", "correction_deadline_at = discovered_at + 15d", "calculations.vehicle_roadworthiness"] }
  - { method: GET, path: "/roadside/inspection-defects/{inspectionDefectId}", description: "Get a defect", roles: [OpsAdmin, Dispatcher, Technician, SafetyOfficer, FleetManager], code: 200, input: [], output: InspectionDefect, side_effects: [] }
  - { method: GET, path: "/roadside/inspection-defects", description: "List defects", roles: [OpsAdmin, Dispatcher, SafetyOfficer, FleetManager], code: 200, input: ["vehicle_id?", "correcting_service_call_id?", "status?", "severity?", "limit?", "offset?"], output: "InspectionDefect[]", side_effects: [] }
  - { method: POST, path: "/roadside/inspection-defects/{inspectionDefectId}/attach-call", description: "Link a correcting service call (OPEN / VERIFICATION_FAILED / ESCALATED -> REPAIR_SCHEDULED)", roles: [SafetyOfficer, OpsAdmin], code: 200, input: [service_call_id], output: InspectionDefect, side_effects: ["status -> REPAIR_SCHEDULED", "call.linked_defect_id set"] }
  - { method: POST, path: "/roadside/inspection-defects/{inspectionDefectId}/mark-corrected", description: "On-site technician marks the defect corrected", roles: [Technician], code: 200, input: [correction_note], output: InspectionDefect, side_effects: ["status -> CORRECTED"] }
  - { method: POST, path: "/roadside/inspection-defects/{inspectionDefectId}/verify", description: "SafetyOfficer verifies correction (PASS -> VERIFIED, FAIL -> VERIFICATION_FAILED)", roles: [SafetyOfficer], code: 200, input: [outcome, "verification_note?"], output: InspectionDefect, side_effects: ["roadworthiness recomputed"] }

  # --- Invoice ---
  - { method: POST, path: "/roadside/service-calls/{serviceCallId}/invoices", description: "Draft the invoice: computes the full final pricing snapshot (call REPAIR_COMPLETED or TOWED; no undecided claims; no live invoice)", roles: [BillingClerk], code: 201, input: [], output: Invoice, side_effects: ["calculations.final_invoice_pricing", "issue_status=DRAFT, payment_status=UNPAID", "CallEvent INVOICE_CREATED"] }
  - { method: GET, path: "/roadside/invoices/{invoiceId}", description: "Get an invoice", roles: [OpsAdmin, Dispatcher, BillingClerk, FleetManager], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/roadside/invoices", description: "List invoices", roles: [OpsAdmin, BillingClerk, FleetManager], code: 200, input: ["fleet_account_id?", "service_call_id?", "issue_status?", "payment_status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/roadside/invoices/{invoiceId}/issue", description: "Issue the invoice (fleet must be ACTIVE); feeds fleet month spend and the suspension cascade", roles: [BillingClerk, OpsAdmin], code: 200, input: [], output: Invoice, side_effects: ["issue_status -> ISSUED", "call -> INVOICED", "calculations.fleet_mtd_spend cascade"] }
  - { method: POST, path: "/roadside/invoices/{invoiceId}/void", description: "Void an issued invoice (OpsAdmin; issuer may not void own invoice; no POSTED payments)", roles: [OpsAdmin], code: 200, input: [reason], output: Invoice, side_effects: ["issue_status -> VOID", "mtd reversal + possible auto-reinstate", "call reverts via status_before_invoice"] }
  - { method: POST, path: "/roadside/invoices/{invoiceId}/write-off", description: "Write off an unpaid balance (spend stays recognized)", roles: [OpsAdmin], code: 200, input: [reason], output: Invoice, side_effects: ["payment_status -> WRITTEN_OFF", "call -> CLOSED"] }

  # --- Payment ---
  - { method: POST, path: "/roadside/invoices/{invoiceId}/payments", description: "Post a payment; waterfall allocation across pinned buckets", roles: [BillingClerk], code: 201, input: [amount_cents, method, "received_at?"], output: Payment, side_effects: ["calculations.payment_waterfall_allocation", "invoice payment_status recompute", "CallEvent PAYMENT_POSTED", "full payment closes the call"] }
  - { method: GET, path: "/roadside/payments/{paymentId}", description: "Get a payment", roles: [OpsAdmin, BillingClerk], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: GET, path: "/roadside/payments", description: "List payments", roles: [OpsAdmin, BillingClerk], code: 200, input: ["invoice_id?", "status?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/roadside/payments/{paymentId}/void", description: "Void a posted payment (reverses allocation)", roles: [BillingClerk, OpsAdmin], code: 200, input: [reason], output: Payment, side_effects: ["status -> VOID", "invoice amounts recomputed"] }

  # --- RepeatFailureCase ---
  - { method: POST, path: "/roadside/repeat-failure-cases", description: "Open a repeat-failure case linking an original CLOSED call and a new complaint call on the same vehicle; computes window and charge policy", roles: [Dispatcher, OpsAdmin], code: 201, input: [vehicle_id, original_service_call_id, new_service_call_id], output: RepeatFailureCase, side_effects: ["calculations.repeat_failure_window", "status=OPEN"] }
  - { method: GET, path: "/roadside/repeat-failure-cases/{repeatFailureCaseId}", description: "Get a case", roles: [OpsAdmin, Dispatcher], code: 200, input: [], output: RepeatFailureCase, side_effects: [] }
  - { method: GET, path: "/roadside/repeat-failure-cases", description: "List cases", roles: [OpsAdmin, Dispatcher], code: 200, input: ["vehicle_id?", "original_service_call_id?", "new_service_call_id?", "status?", "limit?", "offset?"], output: "RepeatFailureCase[]", side_effects: [] }
  - { method: POST, path: "/roadside/repeat-failure-cases/{repeatFailureCaseId}/review", description: "Move case to UNDER_REVIEW", roles: [Dispatcher, OpsAdmin], code: 200, input: [], output: RepeatFailureCase, side_effects: [] }
  - { method: POST, path: "/roadside/repeat-failure-cases/{repeatFailureCaseId}/decide", description: "Confirm (requires charge_policy != FULL) or reject", roles: [OpsAdmin], code: 200, input: [decision, "decision_note?"], output: RepeatFailureCase, side_effects: ["CONFIRMED_COMEBACK: new call is_comeback=true, repeat_of_call_id set; original call REOPENED"] }

  # --- RestockRequest ---
  - { method: GET, path: "/roadside/restock-requests/{restockRequestId}", description: "Get a restock request", roles: [OpsAdmin, Technician], code: 200, input: [], output: RestockRequest, side_effects: [] }
  - { method: GET, path: "/roadside/restock-requests", description: "List restock requests", roles: [OpsAdmin, Technician], code: 200, input: ["van_stock_item_id?", "technician_id?", "status?", "limit?", "offset?"], output: "RestockRequest[]", side_effects: [] }
  - { method: POST, path: "/roadside/restock-requests/{restockRequestId}/approve", description: "Approve a pending restock", roles: [OpsAdmin], code: 200, input: [], output: RestockRequest, side_effects: ["status -> APPROVED"] }
  - { method: POST, path: "/roadside/restock-requests/{restockRequestId}/fulfill", description: "Fulfill: adds units back to the van", roles: [OpsAdmin], code: 200, input: [fulfilled_qty], output: RestockRequest, side_effects: ["status -> FULFILLED", "qty_on_hand += fulfilled_qty"] }
  - { method: POST, path: "/roadside/restock-requests/{restockRequestId}/reject", description: "Reject a pending restock", roles: [OpsAdmin], code: 200, input: [reason], output: RestockRequest, side_effects: ["status -> REJECTED"] }

# =============================================================================
# Section 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or blank X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's declared roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Actor is not the owning technician / fleet manager of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign key does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/unknown/mistyped field, non-positive quantity, inverted window, or other shape violation" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in a from-state of the requested transition" }
  - { id: ERR_CALL_ALREADY_TERMINAL, http: 409, condition: "Action attempted on a CANCELLED service call" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_service_call_version does not match the call's current version (OCC)" }
  - { id: ERR_ESTIMATE_NOT_APPROVED, http: 409, condition: "start-repair while an estimate of the call is DRAFT or SUBMITTED" }
  - { id: ERR_DEFECT_NOT_CORRECTED, http: 409, condition: "verify attempted on a defect not in CORRECTED" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "appeal attempted with appeal_count == 2" }
  - { id: ERR_TECHNICIAN_NOT_AVAILABLE, http: 409, condition: "dispatch accept while technician.status != AVAILABLE" }
  - { id: ERR_TECHNICIAN_NOT_CERTIFIED, http: 409, condition: "dispatch create: technician lacks the call's required certification" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "invoice void attempted by the same user who issued it" }
  - { id: ERR_DISPATCH_WINDOW_OVERLAP, http: 409, condition: "technician already holds a dispatch whose half-open window overlaps the requested one" }
  - { id: ERR_TOW_WINDOW_OVERLAP, http: 409, condition: "tow unit already committed within the +/-30-minute buffered pickup window" }
  - { id: ERR_RATE_CARD_WINDOW_OVERLAP, http: 409, condition: "rate card effective window overlaps an existing card (touching counts)" }
  - { id: ERR_ODOMETER_REGRESSION, http: 422, condition: "odometer input below vehicle.odometer_miles" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "clock set to an earlier instant than the current logical clock" }
  - { id: ERR_FLEET_SUSPENDED, http: 409, condition: "gated write attempted for a SUSPENDED fleet" }
  - { id: ERR_FLEET_CLOSED, http: 409, condition: "gated write attempted for a CLOSED fleet" }
  - { id: ERR_FLEET_HAS_OPEN_CALLS, http: 409, condition: "fleet close attempted with non-terminal service calls" }
  - { id: ERR_WARRANTY_WINDOW_EXPIRED, http: 409, condition: "OEM claim filed outside the time/mileage coverage window" }
  - { id: ERR_WARRANTY_NOT_APPLICABLE, http: 409, condition: "extended-contract claim on a vehicle without extended_warranty" }
  - { id: ERR_WARRANTY_CLAIM_UNDECIDED, http: 409, condition: "invoice create while a claim of the call is DRAFT/SUBMITTED/APPEALED" }
  - { id: ERR_PART_NOT_ON_VAN, http: 409, condition: "part usage against stock belonging to a different technician" }
  - { id: ERR_VEHICLE_MISMATCH, http: 409, condition: "linked call and defect/case refer to different vehicles" }
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "vin / employee_code / account_number already exists" }
  - { id: ERR_DUPLICATE_OPEN_CASE, http: 409, condition: "vehicle already has a repeat-failure case in {OPEN, UNDER_REVIEW, CONFIRMED_COMEBACK}" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "a non-VOID invoice already exists for the call (or a claim is filed after invoicing)" }
  - { id: ERR_DISPATCH_ACTIVE, http: 409, condition: "dispatch create while the call has a dispatch in {ACCEPTED, EN_ROUTE, ON_SITE}" }
  - { id: ERR_RESOLUTION_PATH_CONFLICT, http: 409, condition: "start-repair on a TOW_REQUIRED call, or tow order on an ON_SITE_REPAIR call" }
  - { id: ERR_INSUFFICIENT_VAN_STOCK, http: 409, condition: "usage qty exceeds van qty_on_hand" }
  - { id: ERR_NO_ELIGIBLE_TECHNICIAN, http: 409, condition: "dispatch-suggestion candidate pool is empty" }
  - { id: ERR_REPEAT_SYMPTOM_MISMATCH, http: 409, condition: "repeat case links calls with different symptom_category" }
  - { id: ERR_REPEAT_WINDOW_EXPIRED, http: 409, condition: "comeback confirmation attempted when charge_policy == FULL" }
  - { id: ERR_NO_ACTIVE_RATE_CARD, http: 409, condition: "no rate card resolves for the call at pricing time" }
  - { id: ERR_AUTHORIZATION_REQUIRED, http: 409, condition: "estimate total exceeds the fleet's per-call limit and actor is a Dispatcher" }
  - { id: ERR_MONTHLY_CAP_EXCEEDED, http: 409, condition: "projected month spend exceeds the fleet cap without OpsAdmin override" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "payment amount exceeds invoice outstanding_cents" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "void attempted on an invoice with POSTED payments" }

# =============================================================================
# Section 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Operations administrator: owns master data (fleets, rate cards, technicians, van stock), drives the logical clock and daily ops run, and holds override power (cap override, invoice void/write-off, comeback decision). Segregation: an OpsAdmin who issued an invoice may not void it."
    identity: opaque
    exclusive_operations:
      - "POST /roadside/_clock/set_current_utc, POST /roadside/_ops/run_daily"
      - "POST/PATCH /roadside/fleet-accounts, suspend, reinstate, close"
      - "POST /roadside/rate-cards, POST /roadside/technicians, POST /roadside/technicians/{id}/van-stock"
      - "POST /roadside/invoices/{id}/void, POST /roadside/invoices/{id}/write-off"
      - "POST /roadside/repeat-failure-cases/{id}/decide, restock approve/fulfill/reject"
    shared_operations:
      - "service call intake/triage/cancel, dispatch create/release, estimate create/edit/submit/approve/reject"
      - "tow orders, spend adjustments, payment void, read access to most resources"

  - name: Dispatcher
    description: "Service desk: intake, triage, dispatching, tow coordination, repeat-failure case intake/review, warranty appeals."
    identity: opaque
    exclusive_operations:
      - "POST /roadside/service-calls/{id}/triage"
      - "POST /roadside/repeat-failure-cases/{id}/review"
    shared_operations:
      - "POST /roadside/service-calls, dispatch create/release, estimate create/submit/approve (within fleet limit)"
      - "tow order create/hook/deliver/cancel, warranty claim appeal, vehicles create/update, reads"

  - name: Technician
    description: "Mobile diesel technician; X-User-ID equals the Technician id. Accepts/works own dispatches, diagnoses, repairs, posts/returns parts from own van, files warranty claims, marks defects corrected."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /roadside/dispatches/{id}/accept, reject, depart, arrive, complete (own dispatches only)"
      - "POST /roadside/service-calls/{id}/diagnose, start-repair, complete-repair (own on-site call)"
      - "POST /roadside/service-calls/{id}/part-usages, POST /roadside/part-usages/{id}/return (own van)"
      - "POST /roadside/inspection-defects/{id}/mark-corrected"
    shared_operations:
      - "POST /roadside/service-calls/{id}/warranty-claims, POST /roadside/service-calls/{id}/estimates"
      - "PATCH /roadside/estimates/{id}, POST /roadside/technicians/{id}/set-status (self), reads"

  - name: FleetManager
    description: "Fleet customer approver; X-User-ID equals the FleetAccount id. Approves/rejects own fleet's estimates (required above the per-call limit), may cancel own fleet's calls, reads own fleet's resources."
    identity: "entity_backed:FleetAccount"
    exclusive_operations:
      - "estimate approve above the per-call authorization limit (own fleet)"
      - "POST /roadside/estimates/{id}/reject (own fleet)"
    shared_operations:
      - "POST /roadside/service-calls/{id}/cancel (own fleet), fleet-scoped reads"

  - name: BillingClerk
    description: "Billing operator: drafts and issues invoices, posts and voids payments, posts spend adjustments. Segregation: cannot void invoices at all (OpsAdmin only)."
    identity: opaque
    exclusive_operations:
      - "POST /roadside/service-calls/{id}/invoices"
      - "POST /roadside/invoices/{id}/payments"
    shared_operations:
      - "POST /roadside/invoices/{id}/issue, POST /roadside/payments/{id}/void, spend adjustments, reads"

  - name: WarrantyAdministrator
    description: "Warranty desk: submits, decides, and settles claims. Segregation of duties: claims are filed by Technicians, decided by WarrantyAdministrator."
    identity: opaque
    exclusive_operations:
      - "POST /roadside/warranty-claims/{id}/submit, decide, settle"
    shared_operations:
      - "POST /roadside/service-calls/{id}/warranty-claims, reads"

  - name: SafetyOfficer
    description: "Compliance officer: records roadside-inspection defects, links correcting calls, verifies corrections."
    identity: opaque
    exclusive_operations:
      - "POST /roadside/vehicles/{id}/inspection-defects"
      - "POST /roadside/inspection-defects/{id}/attach-call, verify"
    shared_operations:
      - "defect and vehicle reads"
