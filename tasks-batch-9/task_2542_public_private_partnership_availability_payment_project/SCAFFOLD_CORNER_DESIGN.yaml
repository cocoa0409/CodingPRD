# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Index)
# Task 2542 — Public-Private Partnership Availability Payment Project
#
# Walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Section names and claim_type values are taken from that guide only; nothing is
# invented here. Corners already carried by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as `excluded_because:` stubs with no test_recipe.
#
# BASE CHAIN (referred to below as "the base chain"; every instance spells it out
# in full so each recipe is independently executable from an empty database):
#   clock 2026-09-01 -> Concessionaire "Meridian Infrastructure Partners"
#   -> Concession "A47 Availability Scheme" (masp 100000000, indexation 0.0325,
#      deduction_cap_pct 0.20, total_project_cost 400000000, debt committed
#      300000000, equity committed 100000000, irr 1200 bps, scheduled
#      commencement 2027-01-01, ld rate 250000/day, ld cap 5000000,
#      lifecycle reserve target 20000000)
#   -> financial-close 2026-09-15  => monthly_unitary_charge_cents 8604167
#   -> M1 120000000 requested / approved / disbursed
#      => equity_drawn 100000000, senior_debt_drawn 20000000,
#         cumulative_drawn_pct 0.3000, status CONSTRUCTION,
#         CONSTRUCTION_SEED 8000000 appended, reserve balance 8000000
#   -> clock 2027-01-21 -> certify-service-commencement 2027-01-21
#      => ld_accrued_cents 5000000 (20 late days x 250000, exactly the cap),
#         status OPERATIONS
#   -> ServicePeriod 1 [2027-03-01, 2027-04-01) => days_in_period 31,
#      gross_unitary_charge_cents 8604167, deduction_cap_cents 1720833
#   Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: concessionaire_creation_applies_status_and_counter_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /ppp/concessionaires]
          - entities.Concessionaire.fields.status
          - entities.Concessionaire.fields.concessions_count
          - entities.Concessionaire.fields.version
          - response_envelope.success
        distinguishing_aspect: |
          The 201 body must carry the two supplied inputs AND the three defaulted /
          system fields: status ACTIVE, concessions_count 0, version 1. A handler that
          returns only the echo of the request body, or that leaves concessions_count
          null, fails this even though the row was written.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-09-01 so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == \"object\" and meta.api_request_id is present"
            - "Concessionaire.${cnr_id}.legal_name == \"Meridian Infrastructure Partners\""
            - "Concessionaire.${cnr_id}.sponsor_equity_commitment_cents == 100000000"
            - "Concessionaire.${cnr_id}.status == \"ACTIVE\""
            - "Concessionaire.${cnr_id}.concessions_count == 0"
            - "Concessionaire.${cnr_id}.version == 1"
            - "Concessionaire.${cnr_id}.created_at == \"2026-09-01T00:00:00Z\" and updated_at == created_at"

      - name: concession_read_returns_every_derived_financial_field
        claim_type: retrieval
        grounds:
          - endpoints[GET /ppp/concessions/{id}]
          - entities.Concession.fields.monthly_unitary_charge_cents
          - entities.Concession.fields.cumulative_drawn_pct
          - entities.Concession.fields.lifecycle_reserve_balance_cents
          - entities.Concession.fields.ld_accrued_cents
        distinguishing_aspect: |
          The single-row read must expose the derived block, not just the input block.
          After the base chain the same GET must show monthly_unitary_charge_cents
          8604167, equity_drawn 100000000, senior_debt_drawn 20000000,
          cumulative_drawn_pct 0.3000, lifecycle_reserve_balance_cents 8000000 and
          ld_accrued_cents 5000000 — six fields no request body ever supplied.
        test_recipe:
          setup:
            - "The base chain through certify-service-commencement; concession at OPERATIONS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/certify-service-commencement"
              payload: { actual_commencement_date: "2027-01-21" }
              as: IndependentCertifier
          trigger:
            - call: "GET /ppp/concessions/${csn_id}"
              payload: {}
              as: LenderAgent
          assert:
            - "HTTP status is 200 and response_type == \"object\""
            - "Concession.${csn_id}.status == \"OPERATIONS\""
            - "Concession.${csn_id}.monthly_unitary_charge_cents == 8604167"
            - "Concession.${csn_id}.equity_drawn_cents == 100000000"
            - "Concession.${csn_id}.senior_debt_drawn_cents == 20000000"
            - "Concession.${csn_id}.cumulative_drawn_pct == 0.3000"
            - "Concession.${csn_id}.lifecycle_reserve_balance_cents == 8000000"
            - "Concession.${csn_id}.ld_accrued_cents == 5000000"
            - "Concession.${csn_id}.handback_status == \"NOT_SURVEYED\""
            - "Concession.${csn_id}.availability_deduction_ytd_cents == 0 and deduction_points_ytd == 0 and persistent_breach_flag == false"

      - name: drawdown_milestone_list_filters_by_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /ppp/drawdown-milestones]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.DrawdownMilestone.fields.sequence_no
        distinguishing_aspect: |
          Three milestones exist on one concession (sequence_no 1 REJECTED, 2 REQUESTED,
          3 REQUESTED). limit=1&offset=1 with status=REQUESTED must return exactly the
          second REQUESTED row with total_count 2 and has_more false — the filter must be
          applied BEFORE the window, not after, and total_count must count the filtered
          set rather than all three rows.
        test_recipe:
          setup:
            - "A concession at FINANCIAL_CLOSE with three milestones: sequence_no 1 rejected, sequence_no 2 and 3 still REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v1: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Mobilisation", requested_amount_cents: 10000000, expected_concession_version: "${csn_v1}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/reject"
              payload: { rejection_reason: "cost evidence incomplete" }
              as: IndependentCertifier
            - call: "GET /ppp/concessions/${csn_id}"
              payload: {}
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v2: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M2 Design Complete", requested_amount_cents: 20000000, expected_concession_version: "${csn_v2}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m2_id: $.data.id }
            - call: "GET /ppp/concessions/${csn_id}"
              payload: {}
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v3: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M3 Structures Complete", requested_amount_cents: 30000000, expected_concession_version: "${csn_v3}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m3_id: $.data.id }
          trigger:
            - call: "GET /ppp/drawdown-milestones?concession_id=${csn_id}&status=REQUESTED&limit=1&offset=1"
              payload: {}
              as: LenderAgent
          assert:
            - "HTTP status is 200 and response_type == \"array\""
            - "exactly 1 row is returned and it is DrawdownMilestone.${m3_id}"
            - "the returned row has sequence_no == 3 and status == \"REQUESTED\""
            - "total_count == 2 (the two REQUESTED rows only; the REJECTED row is excluded)"
            - "limit == 1 and offset == 1 and has_more == false"
            - "DrawdownMilestone.${m1_id} does not appear in the page"

      - name: deduction_event_listing_is_the_only_route_to_a_system_appended_event
        claim_type: listing
        grounds:
          - endpoints[GET /ppp/deduction-events]
          - endpoints[POST /ppp/service-periods/{id}/verify]
          - calculations.self_report_variance
          - entities.DeductionEvent.fields.deduction_type
        distinguishing_aspect: |
          The SELF_REPORT_UNDERSTATEMENT event the verify cascade appends is returned by
          no write response — verify returns the ServicePeriod. Listing the period's
          events by service_period_id is the only way to observe it, and the list must
          show sequence_no 1 with deduction_type SELF_REPORT_UNDERSTATEMENT, points 25
          and raw_amount_cents 31250 (reported 320, verified 340, variance 0.0625).
        test_recipe:
          setup:
            - "The base chain plus ServicePeriod 1, self-reported at (100, 2, 4) => reported_points 320."
            - "The authority verifies at (110, 2, 4) => verified 340, variance 0.0625 > 0.05, so one understatement event is appended by the system."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/certify-service-commencement"
              payload: { actual_commencement_date: "2027-01-21" }
              as: IndependentCertifier
            - call: "POST /ppp/concessions/${csn_id}/service-periods"
              payload: { period_index: 1, period_start: "2027-03-01", period_end: "2027-04-01" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { sp1_id: $.data.id, sp1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/service-periods/${sp1_id}/performance-reports"
              payload: { unavailable_minutes: 100, category_a_failures: 2, category_b_failures: 4, expected_service_period_version: "${sp1_v}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { pr1_id: $.data.id }
            - call: "POST /ppp/service-periods/${sp1_id}/verify"
              payload: { verified_unavailable_minutes: 110, verified_category_a_failures: 2, verified_category_b_failures: 4 }
              as: AuthorityOfficer
              as_user_id: "officer-beta"
          trigger:
            - call: "GET /ppp/deduction-events?service_period_id=${sp1_id}"
              payload: {}
              as: Concessionaire
              as_user_id: "${cnr_id}"
          assert:
            - "HTTP status is 200 and response_type == \"array\" and total_count == 1"
            - "the single row has deduction_type == \"SELF_REPORT_UNDERSTATEMENT\" and sequence_no == 1"
            - "the single row has points == 25 and raw_amount_cents == 31250 and status == \"ISSUED\""
            - "the single row has performance_report_id == \"${pr1_id}\""
            - "PerformanceReport.${pr1_id}.variance_pct == 0.0625 and status == \"VERIFIED\""
            - "ServicePeriod.${sp1_id}.total_deduction_cents == 31250 and net_payment_cents == 8572917"

      - name: get_unknown_service_period_returns_service_period_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /ppp/service-periods/{id}]
          - validations[priority=20]
          - errors[ERR_SERVICE_PERIOD_NOT_FOUND]
          - response_envelope.error
        distinguishing_aspect: |
          A syntactically valid but unknown path id must produce the entity-specific 404
          ERR_SERVICE_PERIOD_NOT_FOUND in the error envelope — not a generic 404, not an
          empty 200, and not ERR_CONCESSION_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database — no ServicePeriod row of any kind exists."
          setup_api_calls: []
          trigger:
            - call: "GET /ppp/service-periods/sp-does-not-exist"
              payload: {}
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response_type == \"error\""
            - "${err} == \"ERR_SERVICE_PERIOD_NOT_FOUND\""
            - "data.message is a non-empty string and data carries no entity fields"

      - name: concession_creation_without_masp_cents_is_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /ppp/concessions]
          - validations[priority=30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          masp_cents carries no default, so its absence must be a 400 at priority 30 and
          NOT a row written with masp_cents null (which would then make
          monthly_unitary_charge undefined at financial close). The twelve other required
          inputs are all present, isolating the missing field.
        test_recipe:
          setup:
            - "A concessionaire exists so that the body FK resolves and priority 25 cannot fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
          trigger:
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "GET /ppp/concessions?concessionaire_id=${cnr_id} returns total_count == 0 — no partial row was written"
            - "Concessionaire.${cnr_id}.concessions_count == 0"

      - name: relief_rejection_leaves_both_granted_figures_at_their_zero_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /ppp/relief-claims/{id}/determine]
          - entities.ReliefClaim.fields.granted_relief_days
          - entities.ReliefClaim.fields.granted_cost_cents
          - state_machines.ReliefClaim.NOTIFIED_to_REJECTED
        distinguishing_aspect: |
          determine with decision REJECT omits all three optional inputs. The two granted
          figures must remain at their declared default 0 rather than becoming null, so
          that the relief-day budget in calculations.contractual_time_windows can keep
          summing them, and determination_note must be null rather than "".
        test_recipe:
          setup:
            - "The base chain to OPERATIONS; clock at 2027-02-05."
            - "One RELIEF_EVENT claim notified for the closed window [2027-02-01, 2027-02-10] claiming 12 days and 4000000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/certify-service-commencement"
              payload: { actual_commencement_date: "2027-01-21" }
              as: IndependentCertifier
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/relief-claims"
              payload: { claim_type: "RELIEF_EVENT", event_start: "2027-02-01", event_end: "2027-02-10", claimed_relief_days: 12, claimed_cost_cents: 4000000 }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { rc1_id: $.data.id }
          trigger:
            - call: "POST /ppp/relief-claims/${rc1_id}/determine"
              payload: { decision: "REJECT" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
          assert:
            - "HTTP status is 200"
            - "ReliefClaim.${rc1_id}.status == \"REJECTED\""
            - "ReliefClaim.${rc1_id}.granted_relief_days == 0"
            - "ReliefClaim.${rc1_id}.granted_cost_cents == 0"
            - "ReliefClaim.${rc1_id}.determination_note == null"
            - "ReliefClaim.${rc1_id}.determined_at == \"2027-02-05T00:00:00Z\""
            - "ReliefClaim.${rc1_id}.notified_at == \"2027-02-05T00:00:00Z\" and claimed_relief_days == 12 (the claimed figures are untouched)"
            - "Concession.${csn_id}.ld_accrued_cents == 5000000 — a REJECTED claim excuses no late day"

      - name: service_period_creation_freezes_the_charge_and_derives_the_cap
        claim_type: computed_fields
        grounds:
          - endpoints[POST /ppp/concessions/{id}/service-periods]
          - entities.ServicePeriod.fields.days_in_period
          - entities.ServicePeriod.fields.gross_unitary_charge_cents
          - entities.ServicePeriod.fields.deduction_cap_cents
        distinguishing_aspect: |
