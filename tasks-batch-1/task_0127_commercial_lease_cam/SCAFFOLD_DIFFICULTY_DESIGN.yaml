              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /leases/${lease_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /expense-pools"
              payload: { property_id: "${prop_id}", pool_year: 2025, admin_fee_pct: 0 }
              as: Accountant
              captures: { pool_id: $.data.id }
            - call: "POST /expense-pools/${pool_id}/line-items"
              payload: { category: "UTILITIES", amount_cents: 800000, recoverability: "RECOVERABLE", is_variable: false }
              as: Accountant
            - call: "POST /reconciliations"
              payload: { lease_id: "${lease_id}", pool_id: "${pool_id}", recon_year: 2025 }
              as: PropertyManager
              as_user_id: "shared-user-9"
              captures: { recon_id: $.data.id }
            - call: "POST /reconciliations/${recon_id}/submit"
              payload: {}
              as: PropertyManager
              as_user_id: "shared-user-9"
            - call: "POST /reconciliations/${recon_id}/return"
              payload: {}
              as: Accountant
              as_user_id: "acct-009"
              captures: { recon_v: $.data.version }
          trigger:
            - call: "POST /reconciliations/${recon_id}/post"
              payload: { expected_reconciliation_version: "${recon_v}" }
              as: Accountant
              as_user_id: "shared-user-9"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Reconciliation.${recon_id}.status == DRAFT"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: percentage_rent_at_breakpoint_yields_zero
        grounds:
          - calculations.percentage_rent
          - entities.Lease.fields.pct_rent_breakpoint_cents
          - entities.SalesReport.fields.gross_sales_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on the percentage-rent metric via
          POST /leases/{id}/percentage-rent-run: gross_sales == breakpoint
          (3000000 == 3000000) yields excess 0 and pct_rent 0 (strict `>`),
          while 3000001 would yield a positive charge.
        test_recipe:
          setup:
            - "Active lease pct_rent_rate=0.06, pct_rent_breakpoint_cents=3000000, base_rent 0; a SalesReport for 2025 with gross_sales_cents exactly 3000000."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "PctProp", total_rentable_sqft: 100000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "PctTen", contact_email: "p@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
