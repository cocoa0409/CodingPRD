      - name: window_shaped_inputs_are_rejected_before_any_row_is_written
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_CEREMONY_WINDOW]
          - errors[ERR_INVALID_CRL_WINDOW]
          - errors[ERR_CRL_VALIDITY_TOO_LONG]
          - validations[priority=90]
          - validations[priority=92]
          - validations[priority=95]
        distinguishing_aspect: "Both window validators demand a STRICTLY positive length, so window_end == window_start and next_update == this_update are rejected rather than treated as instantaneous windows. The CRL validity ceiling is then inclusive: 25 hours is refused with ERR_CRL_VALIDITY_TOO_LONG while exactly max_crl_validity_hours (24) is accepted, and the first accepted publication is crl_number 1 with an empty entry list."
