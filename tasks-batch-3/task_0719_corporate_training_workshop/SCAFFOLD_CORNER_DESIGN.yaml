              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
          trigger:
            - call: "POST /training/cohorts/${coh_id}/sessions"
              payload: { title: "Late", starts_at: "2026-07-17T18:00:00Z", ends_at: "2026-07-17T19:00:00Z", room_or_url: "ROOM-X" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_SESSION_OUT_OF_RANGE"

