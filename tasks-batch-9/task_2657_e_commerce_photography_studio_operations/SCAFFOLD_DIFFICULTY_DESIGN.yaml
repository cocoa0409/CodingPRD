              payload: { session_id: "${sess_id}" }
              as: Producer
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${sesm_id}", talent_id: "${ph1_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T11:00:00Z", expected_session_version: "${sesm_v1}" }
              as: Producer
              captures: { bkm_id: $.data.id }
            - call: "POST /studio/talent-bookings/${bkm_id}/confirm"
              payload: {}
              as: Producer
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${sess_id}", talent_id: "${ph2_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T11:00:00Z", expected_session_version: "${sess_v1}" }
              as: Producer
              captures: { bks_id: $.data.id }
            - call: "POST /studio/talent-bookings/${bks_id}/confirm"
              payload: {}
              as: Producer
