  # ===========================================================================
  - section: endpoints
    instances:
      - name: ep_fitment_reverse_lookup_by_vehicle
        claim_type: Cross-reference link
        grounds: [endpoints, entities.Fitment.fields.vehicle_id]
        distinguishing_aspect: "GET /fitments?vehicle_id={id} returns the fitments for that vehicle (reverse FK reachability)."
        test_recipe:
          setup: ["one fitment linking a part to a vehicle"]
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "FL-1", description: "Part", list_price_cents: 1000, cost_cents: 400 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /vehicles"
              payload: { year: 2018, make: "HONDA", model: "CIVIC" }
              as: InventoryManager
              captures: { vid: $.data.id }
            - call: "POST /fitments"
              payload: { part_id: "${pid}", vehicle_id: "${vid}" }
              as: InventoryManager
              captures: { fid: $.data.id }
          trigger:
            - call: "GET /fitments?vehicle_id=${vid}"
              as: CounterClerk
          assert:
            - "response is an array containing exactly one fitment with id ${fid}"

      - name: ep_cross_reference_self_referential_lookup
        claim_type: Cross-reference link
        grounds: [endpoints, entities.CrossReference.fields.interchange_part_id]
        distinguishing_aspect: "GET /cross-references?part_id={id} returns interchange edges from that part (self-referential Part<->Part)."
        test_recipe:
          setup: ["two parts and a cross-reference between them"]
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "XR-OE", description: "OE part", list_price_cents: 5000, cost_cents: 2000 }
              as: InventoryManager
              captures: { oe: $.data.id }
            - call: "POST /parts"
