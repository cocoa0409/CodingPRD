              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 30000, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "B1", name: "IngB", station_type: "TOPPING", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ingb: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ingb}", capacity_grams: 30000, station_slot: 2, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h2: $.data.id }
          trigger:
            - call: "POST /api/refill-tasks"
              payload: { hopper_id: "${h1}", mode: "STANDARD" }
              as: LineOperator
              captures: { t1_req: $.data.requested_grams }
            - call: "POST /api/refill-tasks"
              payload: { hopper_id: "${h2}", mode: "STANDARD" }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "first manual refill accepted with requested_grams == 30000 (30000 <= 50000 budget)"
            - "second manual refill rejected with ERR_REFILL_BUDGET_EXCEEDED (402) — 30000 + 30000 = 60000 > 50000"
