            - *k_plan1
            - *k_attach1
            - *k_plan_v1
            - *k_run1
            - *k_clock_0901
            - *k_lot_v
            - *k_event1
            - *k_load1
            - &k_truck2
              call: "POST /transport-units"
              payload:
                hatchery_id: "${hatch_id}"
                unit_code: "TRK-02"
                tank_gallons: 500.0
                max_load_lbs: 300.0
                oxygen_lpm: 12.0
                certification_expires_at: "2027-01-01T00:00:00Z"
              as: HatcheryManager
              as_user_id: "${hatch_id}"
              captures: { truck2_id: $.data.id }
            - *k_req2
            - *k_plan3
            - *k_attach2
            - *k_plan3_v1
            - *k_run2
