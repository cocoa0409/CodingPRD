            - call: "POST /portability-transfers"
              payload: { participant_id: "${par_id}", source_account_id: "${acct_id}", destination_type: "EXTERNAL_IRA", external_institution_name: "Northline Trust Company", transfer_kind: "INDIRECT_60_DAY", amount_cents: 1000000 }
              as: Participant
              as_user_id: "${par_id}"
              captures: { tr5_id: "$.data.id" }
          trigger:
            - call: "POST /portability-transfers/${tr5_id}/return"
              payload: { return_reason: "Receiving institution could not accept an indirect rollover" }
              as: Recordkeeper
          assert:
            - "PortabilityTransfer.${tr5_id}.status == RETURNED"
            - "PortabilityTransfer.${tr5_id}.in_transit_cents == 0"
            - "PortabilityTransfer.${tr5_id}.fee_cents == 0"
            - "PortabilityTransfer.${tr5_id}.withholding_cents == 0"
            - "PortabilityTransfer.${tr5_id}.net_cents == 0"
            - "PortabilityTransfer.${tr5_id}.basis_portion_cents == 0"
            - "PortabilityTransfer.${tr5_id}.settled_on == null"
            - "PortabilityTransfer.${tr5_id}.is_taxable_distribution == false"
            - "ParticipantAccount.${acct_id}.balance_cents == 1200000"
            - "ParticipantAccount.${acct_id}.contribution_basis_cents == 600000"
            - "ParticipantAccount.${acct_id}.ytd_contribution_cents == 600000"
            - "ParticipantAccount.${acct_id}.remaining_headroom_cents == 100000"
            - "ParticipantAccount.${acct_id}.posture == UNRESTRICTED"
            - "ParticipantAccount.${acct_id}.account_status == OPEN"
            - "Participant.${par_id}.indirect_rollover_count == 0"
            - "PROGRAM_CASH before the trigger == ParticipantAccount.balance_cents 200000 + in_transit_cents 1000000 == 1200000"
            - "PROGRAM_CASH after the trigger == ParticipantAccount.balance_cents 1200000 + in_transit_cents 0 == 1200000"

      - name: contribution_room_conserved_across_remittance_posting_and_reversal
        grounds:
          - state_machines.PayrollRemittance.POSTED_to_REVERSED
          - state_machines.ExcessContributionCase.DETECTED_to_VOIDED
          - entities.ParticipantAccount.fields.ytd_contribution_cents
          - entities.ParticipantAccount.fields.remaining_headroom_cents
          - entities.ParticipantAccount.fields.uncorrected_excess_cents
          - entities.RemittanceLine.fields.status
          - calculations.participant_contribution_headroom
        distinguishing_aspect: |
          The conserved quantity is CONTRIBUTION ROOM (annual ceiling minus ytd), and the
          compensation has to reach a DERIVED CHILD rather than just money: reversing the second
          remittance must restore headroom from 0 back to 200000, drive ytd from 900000 back to
          500000, zero uncorrected_excess_cents, void the auto-created ExcessContributionCase and
          relax posture from RESTRICTED to UNRESTRICTED. Unlike the transfer round trip the
          compensation must delete-by-voiding a downstream entity, not merely re-credit a balance.
        test_recipe:
          setup:
            - "Program year 2026 with ira_annual_limit_cents 700000; Rosa Lim (age_at_year_end 46, catch_up_eligible false) enrolled and ACTIVE"
            - "Remittance A for 2026-02-01..2026-02-28 (pay_date 2026-03-05, gross 10000000 at 500 bp, deducted 500000) is posted at clock 2026-03-06, leaving ytd_contribution_cents 500000 and remaining_headroom_cents 200000 so CONTRIBUTION_ROOM is 200000"
            - "Remittance B for 2026-03-01..2026-03-31 (pay_date 2026-04-03, gross 8000000 at 500 bp, deducted 400000) is posted at clock 2026-04-05, driving ytd to 900000, allocating 400000, flagging excess 200000, exhausting headroom, opening one ExcessContributionCase in DETECTED and setting posture RESTRICTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { calendar_year: 2026, ira_annual_limit_cents: 700000, default_contribution_rate_bp: 500 }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "TDF2045", name: "Target Retirement 2045", category: "TARGET_DATE", target_year: 2045, expense_ratio_bp: 30, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /investment-options"
              payload: { fund_code: "MMKT01", name: "Government Money Market", category: "CAPITAL_PRESERVATION", expense_ratio_bp: 20, default_eligible: true }
              as: ProgramAdministrator
            - call: "POST /employers"
              payload: { ein: "12-3456789", legal_name: "Delta Fabrication LLC", worksite_state: "CA", employee_count: 60 }
              as: ProgramAdministrator
              captures: { emp_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/registration"
              payload: { non_fiduciary_acknowledged: true, payroll_contact_email: "payroll@delta.example" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /participants"
              payload: { full_name: "Rosa Lim", date_of_birth: "1980-05-10", email: "rosa.lim@x.example", ssn_last4: "1234", state_resident: true }
              as: ProgramAdministrator
              captures: { par_id: "$.data.id" }
            - call: "POST /employers/${emp_id}/enrollments"
              payload: { participant_id: "${par_id}", hire_date: "2026-01-05", annual_compensation_cents: 120000000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /_ops/auto-enrollment-run"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /participant-accounts"
              payload: { participant_id: "${par_id}" }
              as: ProgramAdministrator
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-06T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/payroll-remittances"
              payload: { pay_period_start: "2026-02-01", pay_period_end: "2026-02-28", pay_date: "2026-03-05", total_deducted_cents: 500000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { remA_id: "$.data.id" }
            - call: "POST /payroll-remittances/${remA_id}/remittance-lines"
              payload: { enrollment_id: "${enr_id}", gross_wages_cents: 10000000, deducted_cents: 500000 }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${remA_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${remA_id}/post"
              payload: { posting_reference: "PR-2026-A001" }
              as: Recordkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /employers/${emp_id}/payroll-remittances"
              payload: { pay_period_start: "2026-03-01", pay_period_end: "2026-03-31", pay_date: "2026-04-03", total_deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { remB_id: "$.data.id" }
            - call: "POST /payroll-remittances/${remB_id}/remittance-lines"
              payload: { enrollment_id: "${enr_id}", gross_wages_cents: 8000000, deducted_cents: 400000 }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { lineB_id: "$.data.id" }
            - call: "POST /payroll-remittances/${remB_id}/submit"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /payroll-remittances/${remB_id}/post"
              payload: { posting_reference: "PR-2026-B001" }
              as: Recordkeeper
            - call: "GET /participant-accounts/${acct_id}/excess-contribution-cases"
              payload: {}
              as: ProgramAdministrator
              captures: { caseB_id: "$.data[0].id" }
          trigger:
            - call: "POST /payroll-remittances/${remB_id}/reverse"
              payload: { reversal_reason: "Employer submitted a duplicated payroll file" }
              as: Recordkeeper
          assert:
            - "PayrollRemittance.${remB_id}.status == REVERSED"
            - "PayrollRemittance.${remB_id}.total_allocated_cents == 0"
            - "PayrollRemittance.${remB_id}.total_excess_cents == 0"
            - "RemittanceLine.${lineB_id}.status == REVERSED"
            - "RemittanceLine.${lineB_id}.allocated_cents == 0"
            - "RemittanceLine.${lineB_id}.excess_cents == 0"
            - "PayrollRemittance.${remA_id}.status == POSTED"
            - "PayrollRemittance.${remA_id}.total_allocated_cents == 500000"
            - "ParticipantAccount.${acct_id}.ytd_contribution_cents == 500000"
            - "ParticipantAccount.${acct_id}.remaining_headroom_cents == 200000"
            - "ParticipantAccount.${acct_id}.balance_cents == 500000"
            - "ParticipantAccount.${acct_id}.contribution_basis_cents == 500000"
            - "ParticipantAccount.${acct_id}.uncorrected_excess_cents == 0"
            - "ParticipantAccount.${acct_id}.posture == UNRESTRICTED"
            - "ExcessContributionCase.${caseB_id}.status == VOIDED"
            - "Employer.${emp_id}.unremitted_deduction_cents == 0"
            - "CONTRIBUTION_ROOM before Remittance B posted == 700000 - 500000 == 200000"
            - "CONTRIBUTION_ROOM after the reversal == 700000 - 500000 == 200000"
