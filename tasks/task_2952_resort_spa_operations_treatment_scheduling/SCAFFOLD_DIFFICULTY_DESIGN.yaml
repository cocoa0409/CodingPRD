  - rule_id: resource_temporal_overlap
    instances:

      - name: room_turnover_half_open_adjacency_at_exact_release_instant
        grounds:
          - validations[priority=25]
          - entities.TreatmentRoom.fields.turnover_buffer_minutes
          - entities.TreatmentRoom.fields.booked_minutes_total
          - entities.Appointment.fields.end_at
          - endpoints.POST_/appointments
        distinguishing_aspect: |
          Room occupancy is HALF-OPEN: [start_at, end_at + turnover) — so a
          booking starting one minute before the buffer expires is refused while
          a booking starting at the exact release instant is accepted. The
          resource under contention is the ROOM and the interval is extended by a
          turnover buffer the request never mentions. The other instance in this
          rule contends for the THERAPIST over a CLOSED interval, giving the
          opposite inclusivity at the touching instant.
        test_recipe:
          setup:
            - "HYDRO90 (90 min) / HYDRO-1 (turnover_buffer_minutes 30) / SENIOR therapist fixture"
            - "PLATINUM guest with a SCREENED_CLEAR intake and consent 2026.1"
            - "appointment A REQUESTED at 2026-08-10T17:00:00.000Z, so end_at is 18:30 and the room occupancy interval is [17:00, 19:00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: SpaDirector
            - call: "POST /treatment-types"
              payload: { code: "HYDRO90", name: "Marine Hydrotherapy 90", duration_minutes: 90, room_class_required: "HYDRO", required_skill_code: "HYDROTHERAPY", required_scope_level: "ADVANCED", base_price_cents: 30000, contraindication_codes: ["ACUTE_HYPERTENSION"], retail_product_line: "MARINE", required_consent_version: "2026.1", high_demand: true }
              as: SpaDirector
              captures: { tt_id: $.data.id }
            - call: "POST /treatment-rooms"
              payload: { code: "HYDRO-1", room_class: "HYDRO", capacity_guests: 1, turnover_buffer_minutes: 30, hourly_fixed_cost_cents: 4000 }
              as: SpaDirector
              captures: { room_id: $.data.id }
            - call: "POST /therapists"
              payload: { full_name: "Leilani Akana", employment_type: "EMPLOYEE", commission_tier: "SENIOR", base_hourly_cost_cents: 5200, practice_state_code: "HI" }
              as: SpaDirector
              captures: { th_id: $.data.id }
            - call: "POST /therapists/${th_id}/licenses"
              payload: { license_number: "HI-LMT-4410", license_type: "LMT", state_code: "HI", issued_on: "2024-01-01", expires_on: "2026-12-31", current_period_start_on: "2024-01-01", ce_hours_required: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic_id: $.data.id }
            - call: "POST /therapist-licenses/${lic_id}/review"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapists/${th_id}/certifications"
              payload: { skill_code: "HYDROTHERAPY", scope_level: "ADVANCED", granted_on: "2024-01-01", expires_on: "2027-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /therapists/${th_id}/shift-blocks"
              payload: { block_type: "AVAILABLE", start_at: "2026-08-10T08:00:00.000Z", end_at: "2026-08-10T23:00:00.000Z" }
              as: SpaCoordinator
            - call: "POST /guests"
              payload: { full_name: "Nia Kalani", resort_room_number: "1204", loyalty_tier: "PLATINUM", folio_limit_cents: 500000 }
              as: SpaCoordinator
              captures: { guest_id: $.data.id, g_v: $.data.version }
            - call: "POST /guests/${guest_id}/intake-forms"
              payload: { expected_guest_version: "${g_v}", condition_codes: [], medications: [] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-forms/${intake_id}/consent"
              payload: { consent_version: "2026.1" }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /intake-forms/${intake_id}/submit"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /intake-forms/${intake_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-3"
            - call: "POST /appointments"
              payload: { guest_id: "${guest_id}", treatment_type_id: "${tt_id}", room_id: "${room_id}", therapist_id: "${th_id}", start_at: "2026-08-10T17:00:00.000Z" }
              as: SpaCoordinator
              captures: { appt_a: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { guest_id: "${guest_id}", treatment_type_id: "${tt_id}", room_id: "${room_id}", therapist_id: "${th_id}", start_at: "2026-08-10T18:59:00.000Z" }
              as: SpaCoordinator
            - call: "POST /appointments"
              payload: { guest_id: "${guest_id}", treatment_type_id: "${tt_id}", room_id: "${room_id}", therapist_id: "${th_id}", start_at: "2026-08-10T19:00:00.000Z" }
              as: SpaCoordinator
              captures: { appt_b: $.data.id }
          assert:
            - "Appointment.${appt_a}.end_at == 2026-08-10T18:30:00.000Z and its room occupancy interval is [17:00, 19:00)"
            - "the first trigger returns 409 ERR_ROOM_TURNOVER_CONFLICT: 18:59 is still inside the half-open occupancy interval by one minute"
            - "the first trigger does NOT return ERR_THERAPIST_DOUBLE_BOOKED — the therapist's closed interval [17:00, 18:30] does not contain 18:59, so only the room rule can fire"
            - "the second trigger returns 201: 19:00 is exactly end_at + turnover_buffer_minutes, and touching at the release instant is allowed by the half-open upper bound"
            - "Appointment.${appt_b}.quoted_price_cents == 42800 (19:00Z is still inside the 16 <= hour < 20 peak window)"
            - "TreatmentRoom.${room_id}.booked_minutes_total == 240 == 2 * (90 + 30) — the rejected request contributed nothing"
            - "GET /appointments?room_id=${room_id} returns exactly 2 rows"

      - name: therapist_closed_interval_break_adjacency_at_touching_instant
        grounds:
          - validations[priority=24]
          - entities.ShiftBlock.fields.block_type
          - entities.ShiftBlock.fields.start_at
          - entities.Therapist.fields.assigned_minutes_total
          - endpoints.POST_/therapists/{id}/shift-blocks
          - endpoints.POST_/appointments
        distinguishing_aspect: |
          The therapist's calendar uses CLOSED intervals with both bounds
          inclusive, so a booking whose end_at exactly equals a BREAK block's
          start_at DOES intersect and is refused — the opposite verdict from the
          room's half-open upper bound tested in the other instance of this rule.
