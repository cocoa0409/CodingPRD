  - { method: GET, path: "/certificates", description: "List certificates, filterable by order_id and account_id (reverse-reachability for DestructionCertificate.order_id and .account_id)", roles: [AccountManager, ComplianceOfficer], code: 200,
      input: ["order_id?", "account_id?", "status?", "limit?", "offset?"], output: "DestructionCertificate[]", side_effects: [] }
  - { method: POST, path: "/certificates/{id}/void", description: "Void an issued certificate (ISSUED -> VOIDED)", roles: [ComplianceOfficer], code: 200, input: [], output: DestructionCertificate, side_effects: ["status -> VOIDED"] }

