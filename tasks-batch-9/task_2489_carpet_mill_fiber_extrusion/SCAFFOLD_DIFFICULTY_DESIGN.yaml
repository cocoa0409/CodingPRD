              as: MillPlanner
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "DOC_FF_1_70", source_test_ids: ["${pt}"], expires_at_utc: "2027-12-31T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
