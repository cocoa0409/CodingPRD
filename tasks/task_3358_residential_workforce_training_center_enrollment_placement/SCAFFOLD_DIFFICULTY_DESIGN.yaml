# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. All fixture arithmetic was
# executed against the declared formulas; asserts carry pre-computed literals.
# Shared literals: default clock 2026-09-01T00:00:00Z; eligible baseline applicant
# DOB 2002-03-10 (age 24), household_size 1, annual_income_cents 1200000,
# barrier_flags [FOSTER_CARE]; counselor intake id "counselor-1", reviewer
# "reviewer-1" (segregation of duties).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: performance_rate_provisional_vs_final
        grounds:
          - calculations.performance_rate
          - entities.PerformanceSnapshot.fields.variant
        distinguishing_aspect: |
          Dual variant on the OperatorContract domain: identical outcome data (1
          graduate, 1 leaver, 1 still-TRAINING active) yields graduation_rate
          0.6667 under the PROVISIONAL preview (actives counted as projected
          graduates in numerator and denominator) but 0.5000 under the FINAL
          close-period snapshot.
        test_recipe:
          setup:
            - "clock at 2026-09-01; one center (R-NORTH, 2 beds) with a WELDING program capacity 10"
            - "three enrolled students at the center: e_grad completes, e_leaver separates, e_active stays TRAINING"
            - "operator contract on the center opened 2026-09-01; clock advanced to 2026-09-02 before evaluation so the period is closable"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Center One", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 10 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Stu Grad", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e_grad: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Stu Leave", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a2}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e_leaver: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Stu Active", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a3: $.data.id, a3_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a3}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["OFFENDER"], expected_applicant_version: "${a3_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app3: $.data.id } }
            - { call: "POST /jc/applications/${app3}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app3}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a3}", as: AdmissionsCounselor, captures: { a3_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a3}/center-assignment", payload: { expected_applicant_version: "${a3_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a3}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e_active: $.data.id } }
            - { call: "POST /jc/enrollments/${e_grad}/transition", payload: { action: "complete" }, as: EnrollmentManager }
            - { call: "POST /jc/enrollments/${e_leaver}/transition", payload: { action: "separate", reason: "PERSONAL" }, as: EnrollmentManager }
            - { call: "POST /jc/operator-contracts", payload: { center_id: "${c1}", operator_name: "OpCo", contract_code: "K-100" }, as: OperatorAdmin, captures: { k1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: OperatorAdmin }
          trigger:
            - { call: "GET /jc/operator-contracts/${k1}/performance-preview", as: OperatorAdmin, captures: { prov_variant: $.data.variant, prov_rate: $.data.graduation_rate, prov_actives: $.data.projected_actives_count } }
            - { call: "POST /jc/operator-contracts/${k1}/close-period", as: OperatorAdmin, captures: { fin_variant: $.data.variant, fin_rate: $.data.graduation_rate, fin_grads: $.data.graduates_count, fin_leavers: $.data.leavers_count, fin_pay: $.data.payment_cents } }
            - { call: "GET /jc/operator-contracts/${k1}", as: OperatorAdmin, captures: { k_status: $.data.status } }
          assert:
            - "preview response: variant == PROVISIONAL, graduation_rate == 0.6667, projected_actives_count == 1 (same underlying data as the close)"
            - "snapshot response: variant == FINAL, graduation_rate == 0.5, graduates_count == 1, leavers_count == 1, payment_cents == 0"
            - "GET contract after close: status == PROBATION (0.5 < GRADUATION_RATE_FLOOR 0.6)"

      - name: wbl_hours_verified_vs_provisional
        grounds:
          - calculations.wbl_hours_credit
          - entities.WBLPlacement.fields.verified_hours_total
          - entities.WBLPlacement.fields.provisional_hours_total
        distinguishing_aspect: |
          Dual variant on the WBLPlacement domain (distinct from the
          OperatorContract domain of the sibling instance): the same two hour
          entries (10 verified + 8 unverified) yield verified_hours_total 10
          under the ACTUAL variant and provisional_hours_total 18 under the
          PROVISIONAL variant.
        test_recipe:
          setup:
            - "clock pinned at 2026-08-25 for setup so both hour entries fall inside [start_date, clock]"
            - "one TRAINING enrollment at a center; one ACTIVE employer agreement (window 2026-01-01..2026-12-31)"
            - "one placement PROPOSED then ACTIVATED on 2026-08-25 (start_date := 2026-08-25); clock advanced to 2026-08-26"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Center WBL", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Stu Wbl", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/employer-agreements", payload: { employer_name: "WeldShop LLC", trade_code: "WELDING", region_code: "R-NORTH", slot_count: 2, hourly_wage_floor_cents: 100000, effective_start: "2026-01-01", effective_end: "2026-12-31" }, as: OperatorAdmin, captures: { ag1: $.data.id } }
            - { call: "POST /jc/wbl-placements", payload: { enrollment_id: "${e1}", employer_agreement_id: "${ag1}", supervisor_id: "sup-1", hourly_wage_cents: 120000 }, as: TransitionSpecialist, captures: { w1: $.data.id } }
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "activate" }, as: TransitionSpecialist }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T00:00:00Z" }, as: OperatorAdmin }
          trigger:
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "record_hours", work_date: "2026-08-25", hours: 10, verified: true }, as: TransitionSpecialist }
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "record_hours", work_date: "2026-08-26", hours: 8, verified: false }, as: TransitionSpecialist, captures: { v_hours: $.data.verified_hours_total, p_hours: $.data.provisional_hours_total } }
          assert:
            - "verified_hours_total == 10 (ACTUAL variant counts only the verified entry)"
            - "provisional_hours_total == 18 (PROVISIONAL variant counts both entries)"
            - "WBLPlacement.${w1}.status == ACTIVE (recording hours does not change state)"

  - rule_id: combinatorial_formula
    instances:
      - name: center_ranking_multi_input_gated_scoring
        grounds:
          - calculations.center_assignment_ranking
          - errors[ERR_NO_ELIGIBLE_CENTER]
        distinguishing_aspect: |
          Combinatorial mode (a) — >= 3 inputs with non-linear interaction: hard
          gates (OPEN program with open_seats >= 1; beds gate for residential) and
          capped weighted terms (min caps at 10, binary geo points) combine so the
          center with the largest raw pools (C: 10 seats / 50 beds, different
          region, score 8.00) loses to a same-region center (B: 8 seats / 20 beds,
          score 9.00), while center D (CLOSED program) is gated out of the
          candidate set entirely despite 100 free beds.
        test_recipe:
          setup:
            - "clock default; four centers: A(R-NORTH, 4 beds, WELDING cap 3 -> score 4.70), B(R-NORTH, 20 beds, WELDING cap 8 -> 9.00), C(R-SOUTH, 50 beds, WELDING cap 10 -> 8.00), D(R-NORTH, 100 beds, WELDING program CLOSED)"
            - "applicant home_region R-NORTH, desired WELDING, ELIGIBLE, residential_track false"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Center A", region_code: "R-NORTH", total_beds: 4 }, as: OperatorAdmin, captures: { ca: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${ca}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Center B", region_code: "R-NORTH", total_beds: 20 }, as: OperatorAdmin, captures: { cb: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${cb}", trade_code: "WELDING", capacity: 8 }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Center C", region_code: "R-SOUTH", total_beds: 50 }, as: OperatorAdmin, captures: { cc: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${cc}", trade_code: "WELDING", capacity: 10 }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Center D", region_code: "R-NORTH", total_beds: 100 }, as: OperatorAdmin, captures: { cd: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${cd}", trade_code: "WELDING", capacity: 40 }, as: OperatorAdmin, captures: { pd: $.data.id } }
            - { call: "PATCH /jc/trade-programs/${pd}", payload: { status: "CLOSED" }, as: OperatorAdmin }
            - { call: "POST /jc/applicants", payload: { full_name: "Rank Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
          trigger:
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { win_center: $.data.assigned_center_id, win_score: $.data.assigned_center_score, win_status: $.data.assignment_status } }
          assert:
            - "assigned_center_id == ${cb} (score 9.00 beats C's 8.00 and A's 4.70)"
            - "assigned_center_score == 9.0 and assignment_status == ASSIGNED"
            - "ranked_candidates contains exactly 3 entries ordered [B(9.00), C(8.00), A(4.70)] — center D absent (gated: its only WELDING program is CLOSED)"

      - name: operator_payment_per_graduate_rounding_order
        grounds:
          - calculations.operator_performance_payment
          - entities.PerformanceSnapshot.fields.payment_cents
        distinguishing_aspect: |
          Combinatorial mode (b) — nested rounding where the pinned order (round
          per-graduate to whole cents, THEN sum) decides the result: two placed
          graduates at 149999 cents each pay round_half_up(200000 *
          149999/150000) = 199999 per graduate, total 399998; the non-conforming
          sum-then-round order yields 399997. Distinct mode from the sibling
          instance's gated weighted-sum formula.
        test_recipe:
          setup:
            - "clock 2026-09-01; one center (R-NORTH, 2 beds), WELDING program capacity 10"
            - "two students enrolled, both COMPLETED on 2026-09-01; both transition plans get JOB_PLACEMENT COMPLETED with starting_wage_cents 149999"
            - "operator contract opened 2026-09-01; clock advanced to 2026-09-02 so the period is closable"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /jc/centers", payload: { name: "Pay Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 10 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Grad One", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/enrollments/${e1}/transition", payload: { action: "complete" }, as: EnrollmentManager }
            - { call: "GET /jc/enrollments/${e1}/transition-plan", as: TransitionSpecialist, captures: { tp1: "$.data[0].id" } }
            - { call: "POST /jc/transition-plans/${tp1}/services", payload: { service_type: "JOB_PLACEMENT", outcome: "COMPLETED", starting_wage_cents: 149999 }, as: TransitionSpecialist }
            - { call: "POST /jc/applicants", payload: { full_name: "Grad Two", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a2}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e2: $.data.id } }
            - { call: "POST /jc/enrollments/${e2}/transition", payload: { action: "complete" }, as: EnrollmentManager }
            - { call: "GET /jc/enrollments/${e2}/transition-plan", as: TransitionSpecialist, captures: { tp2: "$.data[0].id" } }
            - { call: "POST /jc/transition-plans/${tp2}/services", payload: { service_type: "JOB_PLACEMENT", outcome: "COMPLETED", starting_wage_cents: 149999 }, as: TransitionSpecialist }
            - { call: "POST /jc/operator-contracts", payload: { center_id: "${c1}", operator_name: "OpCo", contract_code: "K-200" }, as: OperatorAdmin, captures: { k1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: OperatorAdmin }
          trigger:
            - { call: "POST /jc/operator-contracts/${k1}/close-period", as: OperatorAdmin, captures: { pay: $.data.payment_cents, avg_w: $.data.avg_starting_wage_cents, grate: $.data.graduation_rate, prate: $.data.placement_rate } }
            - { call: "GET /jc/operator-contracts/${k1}", as: OperatorAdmin, captures: { k_status: $.data.status } }
          assert:
            - "payment_cents == 399998 (199999 + 199999; sum-then-round would give 399997)"
            - "avg_starting_wage_cents == 149999, graduation_rate == 1.0, placement_rate == 1.0"
            - "contract status remains ACTIVE (both floors met)"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_review_appeal_cycle
        grounds:
          - state_machines.Application.INELIGIBLE_to_UNDER_REVIEW
          - state_machines.Application.UNDER_REVIEW_to_INFO_REQUESTED
          - calculations.eligibility_determination
        distinguishing_aspect: |
          Cyclic machine on Application: the case loops UNDER_REVIEW ->
          INFO_REQUESTED -> UNDER_REVIEW and later INELIGIBLE -> UNDER_REVIEW via
          appeal, re-determining on the updated income snapshot — no linear
          pipeline can express the second determination of the same case.
        test_recipe:
          setup:
            - "clock default; applicant with annual_income_cents 1500001 (one cent over the household-1 limit of 1500000), one barrier documented"
            - "application filed by counselor-1; reviewer-1 adjudicates"
          setup_api_calls:
            - { call: "POST /jc/applicants", payload: { full_name: "Cycle Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1500001, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "request_info", info_request_note: "verify income docs" }, as: EligibilityReviewer, as_user_id: "reviewer-1", captures: { st_info: $.data.status } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "provide_info" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { st_back: $.data.status } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1", captures: { st_det1: $.data.status, det1_reasons: $.data.determination_reasons } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "appeal", annual_income_cents: 1200000 }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { st_appeal: $.data.status } }
          trigger:
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1", captures: { st_det2: $.data.status, det2_reasons: $.data.determination_reasons } }
          assert:
            - "after request_info: status == INFO_REQUESTED; after provide_info: status == UNDER_REVIEW (first cycle edge)"
            - "first determination: status == INELIGIBLE with determination_reasons == [INCOME_EXCEEDS_LIMIT] (1500001 > 1500000)"
            - "appeal: status == UNDER_REVIEW (second cycle edge — the same case reopens)"
            - "second determination on the appealed snapshot (income 1200000): status == ELIGIBLE with determination_reasons == []"

      - name: enrollment_parallel_training_residential_dims
        grounds:
          - state_machines.Enrollment.training_status
          - state_machines.Enrollment.residential_status
          - state_machines.Credential.EARNED_to_VERIFIED
        distinguishing_aspect: |
          Parallel state dimensions on Enrollment (distinct entity from the
          sibling's Application cycle): a dormitory assignment moves only the
          residential axis (AWAITING_BED -> RESIDENT) while training stays
          REMEDIATION; a later HSE verification moves only the training axis
          (REMEDIATION -> TRAINING auto-advance) while residential stays
          RESIDENT. Each axis mutates without disturbing the other.
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, 2 beds) with WELDING program capacity 5, required_credential_types [HSE], supports_remediation true"
            - "eligible applicant assigned to the center, enrolled with residential_track true -> training REMEDIATION, residential AWAITING_BED"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Dim Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5, required_credential_types: ["HSE"], supports_remediation: true }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Dim Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e1: $.data.id, t0: $.data.training_status, r0: $.data.residential_status } }
          trigger:
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e1}", move_in_date: "2026-09-01", bed_label: "B-01" }, as: ResidentialAdvisor, captures: { da1: $.data.id } }
            - { call: "GET /jc/enrollments/${e1}", as: EnrollmentManager, captures: { t1: $.data.training_status, r1: $.data.residential_status } }
            - { call: "POST /jc/credentials", payload: { enrollment_id: "${e1}", credential_type: "HSE" }, as: CareerInstructor, captures: { cr1: $.data.id } }
            - { call: "POST /jc/credentials/${cr1}/transition", payload: { action: "verify" }, as: CareerInstructor }
            - { call: "GET /jc/enrollments/${e1}", as: EnrollmentManager, captures: { t2: $.data.training_status, r2: $.data.residential_status } }
          assert:
            - "at creation: training_status == REMEDIATION (HSE prerequisite missing, remediation supported) and residential_status == AWAITING_BED"
            - "after dormitory assignment: residential_status == RESIDENT while training_status == REMEDIATION (residential axis moved alone)"
            - "after HSE verify: training_status == TRAINING (auto-advance) while residential_status == RESIDENT (training axis moved alone)"
            - "DormitoryAssignment.${da1}.status == ACTIVE throughout"

  - rule_id: transitive_cascade
    instances:
      - name: board_separation_cascades_enrollment_dorm_center_program
        grounds:
          - state_machines.ConductIncident.BOARD_REVIEW_to_SEPARATION_ORDERED
          - state_machines.Enrollment.training_status
          - state_machines.DormitoryAssignment.ACTIVE_to_TERMINATED
          - calculations.dorm_occupancy_reconcile
        distinguishing_aspect: |
          Depth-3 cascade triggered by the conduct board decision (distinct
          trigger from the sibling's checkout): incident SEPARATION_ORDERED ->
          enrollment SEPARATED/RELEASED (link 1) -> its ACTIVE dormitory
          assignment TERMINATED with move_out stamped (link 2) -> center bed
          occupancy recomputed 1 -> 0 (link 3); the enrollment mutation also
          flips the FULL trade program back to OPEN as a parallel branch.
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, total_beds 1) with WELDING program capacity 1 (FULL after the enrollment)"
            - "resident student in TRAINING occupying bed B-01 since 2026-09-01"
            - "zero-tolerance incident (VIOLENCE) reported 2026-09-01, investigated, referred to board"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Cascade Center", region_code: "R-NORTH", total_beds: 1 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 1 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Case Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e1}", move_in_date: "2026-09-01", bed_label: "B-01" }, as: ResidentialAdvisor, captures: { da1: $.data.id } }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "VIOLENCE", occurred_at: "2026-09-01" }, as: ResidentialAdvisor, captures: { i1: $.data.id } }
            - { call: "POST /jc/conduct-incidents/${i1}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents/${i1}/transition", payload: { action: "refer_board" }, as: ResidentialAdvisor }
          trigger:
            - { call: "POST /jc/conduct-incidents/${i1}/transition", payload: { action: "separate" }, as: ResidentialAdvisor, captures: { i_status: $.data.status } }
            - { call: "GET /jc/enrollments/${e1}", as: EnrollmentManager, captures: { e_train: $.data.training_status, e_res: $.data.residential_status, e_exit: $.data.exit_reason } }
            - { call: "GET /jc/enrollments/${e1}/dormitory-assignments", as: ResidentialAdvisor, captures: { da_status: "$.data[0].status", da_out: "$.data[0].move_out_date" } }
            - { call: "GET /jc/centers/${c1}", as: OperatorAdmin, captures: { c_use: $.data.beds_in_use, c_avail: $.data.beds_available } }
            - { call: "GET /jc/centers/${c1}/trade-programs", as: OperatorAdmin, captures: { p_open: "$.data[0].open_seats", p_status: "$.data[0].status" } }
            - { call: "GET /jc/enrollments/${e1}/transition-plan", as: TransitionSpecialist, captures: { tp_status: "$.data[0].status" } }
          assert:
            - "incident status == SEPARATION_ORDERED"
            - "link 1: enrollment training_status == SEPARATED, residential_status == RELEASED, exit_reason == CONDUCT_BOARD"
            - "link 2: dormitory assignment status == TERMINATED with move_out_date == 2026-09-01 (clock date), bed_label B-01"
            - "link 3: center beds_in_use == 0 and beds_available == 1 (bed returned to the pool)"
            - "parallel branch: trade program open_seats == 1 and status == OPEN (auto-flip from FULL)"
            - "transition plan exists with status == ACTIVE and all tracks PENDING (no converted hire)"

      - name: checkout_cascades_residential_release_and_bed_reconcile
        grounds:
          - state_machines.DormitoryAssignment.ACTIVE_to_CHECKED_OUT
          - state_machines.Enrollment.residential_status
          - calculations.dorm_occupancy_reconcile
        distinguishing_aspect: |
          Depth-2 cascade with a different trigger than the sibling (a routine
          checkout, not a board decision): the checkout call mutates the
          DormitoryAssignment (ACTIVE -> CHECKED_OUT, link 1), and that
          assignment mutation itself flips the enrollment's residential axis
          RESIDENT -> RELEASED and recomputes center occupancy (link 2) — the
          training axis is untouched, proving the cascade is caused by the
          assignment mutation rather than by any enrollment-level action.
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, total_beds 2), WELDING program capacity 5"
            - "resident student in TRAINING occupying auto-selected bed B-01 since 2026-09-01"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Checkout Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Out Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e1}", move_in_date: "2026-09-01" }, as: ResidentialAdvisor, captures: { da1: $.data.id, da_bed: $.data.bed_label } }
            - { call: "GET /jc/centers/${c1}", as: OperatorAdmin, captures: { use_pre: $.data.beds_in_use, avail_pre: $.data.beds_available } }
          trigger:
            - { call: "POST /jc/dormitory-assignments/${da1}/checkout", payload: { move_out_date: "2026-10-15" }, as: ResidentialAdvisor, captures: { da_status: $.data.status, da_out: $.data.move_out_date } }
            - { call: "GET /jc/enrollments/${e1}", as: EnrollmentManager, captures: { e_train: $.data.training_status, e_res: $.data.residential_status } }
            - { call: "GET /jc/centers/${c1}", as: OperatorAdmin, captures: { use_post: $.data.beds_in_use, avail_post: $.data.beds_available } }
          assert:
            - "before checkout: center beds_in_use == 1, beds_available == 1; auto-selected bed_label == B-01"
            - "link 1: assignment status == CHECKED_OUT, move_out_date == 2026-10-15"
            - "link 2: enrollment residential_status == RELEASED while training_status == TRAINING (only the residential axis moved)"
            - "link 2 (ledger): center beds_in_use == 0, beds_available == 2 after the checkout"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dorm_assign_state_beats_capacity
        grounds:
          - validations[priority=8]
          - validations[priority=21]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_BED_AVAILABLE]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the target enrollment is
          UNENROLLED (cross-entity state violation, priority 8) AND the center's
          bed pool is exhausted (fiscal violation, priority 21) — the
          dual-failure request must return ERR_INVALID_STATE, proving state
          outranks capacity.
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, total_beds 1) with WELDING program capacity 5"
            - "student 1 resident in bed B-01 (pool exhausted); student 2 enrolled residential_track true then UNENROLLED (voluntary) before any bed assignment"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Prio Center", region_code: "R-NORTH", total_beds: 1 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Res One", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e1}", move_in_date: "2026-09-01" }, as: ResidentialAdvisor }
            - { call: "POST /jc/applicants", payload: { full_name: "Res Two", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a2}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e2: $.data.id } }
            - { call: "POST /jc/enrollments/${e2}/transition", payload: { action: "unenroll", reason: "WITHDRAWN" }, as: EnrollmentManager }
          trigger:
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e2}", move_in_date: "2026-09-01" }, as: ResidentialAdvisor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (enrollment is terminal; priority 7 state beats priority 21 business_fiscal)"
            - "the exhausted bed pool (ERR_NO_BED_AVAILABLE would also apply) is never reported"
            - "no DormitoryAssignment row is created for ${e2}"

      - name: wbl_create_safety_beats_referential
        grounds:
          - validations[priority=9]
          - validations[priority=20]
          - errors[ERR_CONDUCT_HOLD]
          - errors[ERR_AGREEMENT_INACTIVE]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential (distinct
          from the sibling's state vs business_fiscal): the enrollment carries an
          unresolved board review (conduct_hold, priority 9) AND the employer
          agreement is EXPIRED (referential violation, priority 20) — the
          dual-failure placement create must return ERR_CONDUCT_HOLD.
        test_recipe:
          setup:
            - "clock default 2026-09-01; center, WELDING program capacity 5; one TRAINING enrollment"
            - "a THEFT incident referred to the board -> conduct_hold true (BOARD_REVIEW pending)"
            - "employer agreement with effective_end 2026-08-01 -> EXPIRED at the default clock"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Hold Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Hold Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/conduct-incidents", payload: { enrollment_id: "${e1}", infraction_code: "THEFT", occurred_at: "2026-08-20" }, as: ResidentialAdvisor, captures: { i1: $.data.id } }
            - { call: "POST /jc/conduct-incidents/${i1}/transition", payload: { action: "begin_investigation" }, as: ResidentialAdvisor }
            - { call: "POST /jc/conduct-incidents/${i1}/transition", payload: { action: "refer_board" }, as: ResidentialAdvisor }
            - { call: "POST /jc/employer-agreements", payload: { employer_name: "OldShop", trade_code: "WELDING", region_code: "R-NORTH", slot_count: 2, hourly_wage_floor_cents: 100000, effective_start: "2026-01-01", effective_end: "2026-08-01" }, as: OperatorAdmin, captures: { ag1: $.data.id } }
          trigger:
            - { call: "POST /jc/wbl-placements", payload: { enrollment_id: "${e1}", employer_agreement_id: "${ag1}", supervisor_id: "sup-1", hourly_wage_cents: 120000 }, as: TransitionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONDUCT_HOLD (priority 9 business_safety beats priority 20 business_referential)"
            - "the expired agreement (ERR_AGREEMENT_INACTIVE would also apply) is never reported"
            - "no WBLPlacement row is created"

  - rule_id: boundary_precision_check
    instances:
      - name: income_exactly_at_limit_is_eligible
        grounds:
          - calculations.eligibility_determination
          - validations[priority=5]
        distinguishing_aspect: |
          Boundary on the income metric reached through the determine action:
          household_size 1 fixes the limit at exactly 1500000 cents; income
          1500000 is ELIGIBLE (the rule is `> limit`, not `>=`) while income
          1500001 — one cent over — is INELIGIBLE with reason
          INCOME_EXCEEDS_LIMIT. Both applicants are exactly 24 years old
          (DOB 2002-09-01 at the default clock), so age cannot confound the
          income boundary.
        test_recipe:
          setup:
            - "clock default 2026-09-01 (never explicitly set — also pins the startup default)"
            - "applicant A: DOB 2002-09-01 (exactly 24), household 1, income 1500000; applicant B: identical but income 1500001"
          setup_api_calls:
            - { call: "POST /jc/applicants", payload: { full_name: "Edge A", date_of_birth: "2002-09-01", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { aA: $.data.id, aA_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${aA}", household_size: 1, annual_income_cents: 1500000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${aA_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { appA: $.data.id } }
            - { call: "POST /jc/applications/${appA}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${appA}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1", captures: { stA: $.data.status, rsA: $.data.determination_reasons } }
            - { call: "POST /jc/applicants", payload: { full_name: "Edge B", date_of_birth: "2002-09-01", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { aB: $.data.id, aB_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${aB}", household_size: 1, annual_income_cents: 1500001, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${aB_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { appB: $.data.id } }
            - { call: "POST /jc/applications/${appB}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /jc/applications/${appB}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1", captures: { stB: $.data.status, rsB: $.data.determination_reasons } }
          assert:
            - "applicant A (income == limit): status == ELIGIBLE, determination_reasons == []"
            - "applicant B (income == limit + 1): status == INELIGIBLE, determination_reasons == [INCOME_EXCEEDS_LIMIT]"
            - "both determinations ran at age exactly 24 (inside the inclusive 16..24 window)"

      - name: last_bed_assignment_succeeds_then_pool_empty
        grounds:
          - calculations.dorm_occupancy_reconcile
          - errors[ERR_NO_BED_AVAILABLE]
        distinguishing_aspect: |
          Boundary on the free-bed count metric reached through the dormitory
          assignment endpoint (distinct metric and endpoint from the income
          sibling): with total_beds 1, the auto-select assignment of the last
          free bed succeeds (count hits exactly 0 — exhaustion is not an error),
          and the very next auto-select fails with ERR_NO_BED_AVAILABLE.
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, total_beds 1), WELDING program capacity 5"
            - "two eligible applicants, both assigned residential to the center and enrolled with residential_track true (both AWAITING_BED)"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Tiny Center", region_code: "R-NORTH", total_beds: 1 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Bed One", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Bed Two", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a2}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e1}", move_in_date: "2026-09-01" }, as: ResidentialAdvisor, captures: { da1: $.data.id, bed1: $.data.bed_label } }
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e2}", move_in_date: "2026-09-01" }, as: ResidentialAdvisor, captures: { err2: $.data.error_id } }
          assert:
            - "first auto-select succeeds on the LAST free bed: bed_label == B-01, status == ACTIVE (0 remaining is success, not an error)"
            - "second auto-select: error_id == ERR_NO_BED_AVAILABLE (pool exactly empty)"
            - "GET center after both: beds_in_use == 1, beds_available == 0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_requires_trade_program_open
        grounds:
          - validations[priority=19]
          - state_machines.TradeProgram
          - errors[ERR_PROGRAM_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Enrollment -> TradeProgram: enrollment creation is gated on
          the PROGRAM's state — after the program flips to CLOSED (PATCH), the
          create is rejected with ERR_PROGRAM_NOT_OPEN even though the applicant
          is eligible and assigned to that center.
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, 4 beds), WELDING program capacity 3"
            - "applicant ELIGIBLE and assigned while the program is OPEN; then the program is CLOSED via PATCH"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Gate Center", region_code: "R-NORTH", total_beds: 4 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 3 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Gate Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "PATCH /jc/trade-programs/${p1}", payload: { status: "CLOSED" }, as: OperatorAdmin }
          trigger:
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_NOT_OPEN (the program's own state gates the enrollment create)"
            - "no Enrollment row is created; applicant assignment_status stays ASSIGNED"

      - name: wbl_requires_employer_agreement_active
        grounds:
          - validations[priority=20]
          - entities.EmployerAgreement.fields.status
          - errors[ERR_AGREEMENT_INACTIVE]
        distinguishing_aspect: |
          Entity pair WBLPlacement -> EmployerAgreement (distinct from the
          sibling's Enrollment -> TradeProgram): placement creation is gated on
          the AGREEMENT's clock-derived status — an agreement whose effective_end
          (2026-08-01) precedes the clock date (2026-09-01) is EXPIRED and the
          create fails with ERR_AGREEMENT_INACTIVE for an otherwise clean
          TRAINING enrollment.
        test_recipe:
          setup:
            - "clock default 2026-09-01; center, WELDING program capacity 5; one TRAINING enrollment, no conduct history"
            - "employer agreement effective 2026-01-01..2026-08-01 (expired at the clock date)"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Agr Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Agr Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/employer-agreements", payload: { employer_name: "Expired LLC", trade_code: "WELDING", region_code: "R-NORTH", slot_count: 2, hourly_wage_floor_cents: 100000, effective_start: "2026-01-01", effective_end: "2026-08-01" }, as: OperatorAdmin, captures: { ag1: $.data.id } }
            - { call: "GET /jc/employer-agreements/${ag1}", as: TransitionSpecialist, captures: { ag_status: $.data.status } }
          trigger:
            - { call: "POST /jc/wbl-placements", payload: { enrollment_id: "${e1}", employer_agreement_id: "${ag1}", supervisor_id: "sup-1", hourly_wage_cents: 120000 }, as: TransitionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "GET agreement shows status == EXPIRED (derived from the clock, not stored)"
            - "error_id == ERR_AGREEMENT_INACTIVE on the placement create"
            - "no WBLPlacement row is created"

  - rule_id: resource_temporal_overlap
    instances:
      - name: dorm_bed_half_open_interval_adjacency
        grounds:
          - validations[priority=15]
          - entities.DormitoryAssignment.fields.move_out_date
          - errors[ERR_BED_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [move_in_date, move_out_date) on a single
          labeled bed resource — an open-ended assignment (move_out_date null)
          collides with any later move-in on the same bed, while a back-to-back
          assignment whose move_in_date equals the predecessor's move_out_date is
          adjacent, not overlapping, and is accepted.
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, total_beds 1), WELDING program capacity 5"
            - "two resident-track enrollments at the center; enrollment 1 holds B-01 from 2026-09-01 open-ended"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Adj Center", region_code: "R-NORTH", total_beds: 1 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Adj One", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e1}", move_in_date: "2026-09-01", bed_label: "B-01" }, as: ResidentialAdvisor, captures: { da1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Adj Two", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: true }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a2}", trade_program_id: "${p1}", residential_track: true }, as: EnrollmentManager, captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e2}", move_in_date: "2026-10-01", bed_label: "B-01" }, as: ResidentialAdvisor, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /jc/dormitory-assignments/${da1}/checkout", payload: { move_out_date: "2026-10-01" }, as: ResidentialAdvisor }
            - { call: "POST /jc/dormitory-assignments", payload: { enrollment_id: "${e2}", move_in_date: "2026-10-01", bed_label: "B-01" }, as: ResidentialAdvisor, captures: { da2: $.data.id, da2_status: $.data.status, da2_in: $.data.move_in_date } }
          assert:
            - "first attempt (open-ended predecessor): error_id == ERR_BED_OVERLAP"
            - "after checkout with move_out_date == 2026-10-01, the same move_in 2026-10-01 succeeds: status == ACTIVE (adjacent half-open intervals do not collide)"
            - "move_in 2026-10-01 == predecessor move_out 2026-10-01 is adjacency; one day earlier (2026-09-30) would have collided"

      - name: wbl_agreement_slot_concurrency_ceiling
        grounds:
          - validations[priority=22]
          - state_machines.WBLPlacement.PROPOSED_to_ACTIVE
          - errors[ERR_WBL_SLOT_EXCEEDED]
        distinguishing_aspect: |
          Different resource and different interval semantics from the sibling's
          half-open bed intervals: the employer agreement enforces an AGGREGATE
          CONCURRENCY ceiling — the count of coexisting ACTIVE placements
          under one agreement, with no date geometry at all. slot_count 1 admits
          the first activation and rejects the second with ERR_WBL_SLOT_EXCEEDED;
          terminating the first placement re-opens the ceiling for the second.
        test_recipe:
          setup:
            - "clock default; center, WELDING program capacity 5; two TRAINING enrollments"
            - "employer agreement slot_count 1, window 2026-01-01..2026-12-31, wage floor 100000"
            - "two PROPOSED placements under the agreement (creation does not consume slots — only activation does)"
          setup_api_calls:
            - { call: "POST /jc/centers", payload: { name: "Slot Center", region_code: "R-NORTH", total_beds: 2 }, as: OperatorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /jc/trade-programs", payload: { center_id: "${c1}", trade_code: "WELDING", capacity: 5 }, as: OperatorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Slot One", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a1}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["FOSTER_CARE"], expected_applicant_version: "${a1_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app1: $.data.id } }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app1}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a1}", as: AdmissionsCounselor, captures: { a1_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a1}/center-assignment", payload: { expected_applicant_version: "${a1_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a1}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e1: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Slot Two", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a2: $.data.id, a2_v: $.data.version } }
            - { call: "POST /jc/applications", payload: { applicant_id: "${a2}", household_size: 1, annual_income_cents: 1200000, barrier_flags: ["HOMELESS"], expected_applicant_version: "${a2_v}" }, as: AdmissionsCounselor, as_user_id: "counselor-1", captures: { app2: $.data.id } }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "begin_review" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /jc/applications/${app2}/transition", payload: { action: "determine" }, as: EligibilityReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /jc/applicants/${a2}", as: AdmissionsCounselor, captures: { a2_v2: $.data.version } }
            - { call: "POST /jc/applicants/${a2}/center-assignment", payload: { expected_applicant_version: "${a2_v2}", residential_track: false }, as: AdmissionsCounselor, as_user_id: "counselor-1" }
            - { call: "POST /jc/enrollments", payload: { applicant_id: "${a2}", trade_program_id: "${p1}", residential_track: false }, as: EnrollmentManager, captures: { e2: $.data.id } }
            - { call: "POST /jc/employer-agreements", payload: { employer_name: "OneSlot LLC", trade_code: "WELDING", region_code: "R-NORTH", slot_count: 1, hourly_wage_floor_cents: 100000, effective_start: "2026-01-01", effective_end: "2026-12-31" }, as: OperatorAdmin, captures: { ag1: $.data.id } }
            - { call: "POST /jc/wbl-placements", payload: { enrollment_id: "${e1}", employer_agreement_id: "${ag1}", supervisor_id: "sup-1", hourly_wage_cents: 120000 }, as: TransitionSpecialist, captures: { w1: $.data.id } }
            - { call: "POST /jc/wbl-placements", payload: { enrollment_id: "${e2}", employer_agreement_id: "${ag1}", supervisor_id: "sup-2", hourly_wage_cents: 120000 }, as: TransitionSpecialist, captures: { w2: $.data.id } }
          trigger:
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "activate" }, as: TransitionSpecialist, captures: { w1_status: $.data.status } }
            - { call: "POST /jc/wbl-placements/${w2}/transition", payload: { action: "activate" }, as: TransitionSpecialist, captures: { err_slot: $.data.error_id } }
            - { call: "POST /jc/wbl-placements/${w1}/transition", payload: { action: "terminate", termination_reason: "END_OF_ASSIGNMENT" }, as: TransitionSpecialist }
            - { call: "POST /jc/wbl-placements/${w2}/transition", payload: { action: "activate" }, as: TransitionSpecialist, captures: { w2_status: $.data.status } }
            - { call: "GET /jc/employer-agreements/${ag1}/wbl-placements", as: TransitionSpecialist }
          assert:
            - "first activation succeeds (count 0 < slot_count 1 at the ceiling check)"
            - "second activation while the first is ACTIVE: error_id == ERR_WBL_SLOT_EXCEEDED (aggregate ceiling, not interval geometry)"
            - "after terminating the first placement, the second activates: status == ACTIVE (the ceiling is count-based, so release re-opens it)"
            - "GET /jc/employer-agreements/{id}/wbl-placements lists exactly 2 rows: ${w1} TERMINATED and ${w2} ACTIVE (FK reverse-reachability)"

  - rule_id: compensating_invariant
    instances:
      - name: bed_assign_checkout_conserves_total_beds
        grounds:
          - calculations.dorm_occupancy_reconcile
          - entities.Center.fields.beds_in_use
          - entities.Center.fields.beds_available
        distinguishing_aspect: |
          Conserved quantity: Center.total_beds == beds_in_use + beds_available.
          The forward action (two auto-select assignments into a 2-bed center)
          paired with its compensating action (checkout of the first) leaves the
          invariant exact at every step: (0,2) -> (1,1) -> (2,0) -> (1,1).
        test_recipe:
          setup:
            - "clock default; center (R-NORTH, total_beds 2), WELDING program capacity 5"
            - "two resident-track enrollments, both AWAITING_BED"
          setup_api_calls:
