              as: FundAccountant
              captures: { sc_a: $.data.id }
            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "NV", registered_amount: 50000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_nv: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "NV", tax_id: "707-07-0707", primary_owner_name: "Edge Holder", dividend_option: "CASH" }
              as: TransferAgentOperator
              captures: { acc_e: $.data.id }
            - call: "POST /shareholder-accounts/${acc_e}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_e}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 50000.00 }
              as: TransferAgentOperator
              captures: { t_full: $.data.id }
            - call: "POST /trades"
              payload: { account_id: "${acc_e}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 0.01 }
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "the first capture returns HTTP 201 and Trade.${t_full}.blue_sky_registration_id == ${bs_nv}"
            - "BlueSkyRegistration.${bs_nv}.reserved_amount == 50000.00"
            - "BlueSkyRegistration.${bs_nv}.consumed_amount == 0.00"
            - "BlueSkyRegistration.${bs_nv}.remaining_amount == 0.00"
            - "BlueSkyRegistration.${bs_nv}.status == EXHAUSTED"
            - "the second capture returns HTTP 422 with error_id ERR_BLUE_SKY_CAPACITY_EXCEEDED"
            - "BlueSkyRegistration.${bs_nv}.reserved_amount is still 50000.00 after the rejected capture"

