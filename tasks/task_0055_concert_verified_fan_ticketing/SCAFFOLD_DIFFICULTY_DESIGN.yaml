  # ─────────────────────────────────────────────────────────────────────────
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_tier_seat_occupancy
        grounds:
          - state_machines.Order.PENDING_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - entities.PriceTier.fields.sold_count
        distinguishing_aspect: |
          Conserved quantity: PriceTier seat occupancy. After pay then refund, sold_count returns to
          its pre-pay value (0), i.e. sold_count is invariant across the forward(pay)+compensating(refund) pair.
        test_recipe:
          setup:
            - "Fan N completes a PAID Order for 2 seats in tier T (sold_count becomes 2), then refunds it."
          setup_api_calls:
