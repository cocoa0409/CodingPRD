      - name: aid_commitment_asset_not_shared_precedes_concurrency_limit
        grounds:
          - validations.priority_28_ERR_ASSET_NOT_SHARED
          - validations.priority_47_ERR_AID_CONCURRENCY_LIMIT
          - endpoints.post_mutual_aid_pact_commitments
          - calculations.aid_peak_overlap_capacity
        distinguishing_aspect: |
          Both violated rules live on the same endpoint but in different families — priority 28 is a
          cross-entity asset-attribute gate and priority 47 is a temporal-overlap count gate — and
          they are separated by nineteen priority slots rather than the adjacent slots used by the
          allocation pair. The control call swaps only the asset_id, holding all four window bounds
          fixed, so the overlap count stays at 3 and ERR_AID_CONCURRENCY_LIMIT must surface.
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions: the pact host and the requesting jurisdiction."
            - "One LifelineAsset with is_shared true and one LifelineAsset with is_shared false, both in the host jurisdiction."
            - "One OPEN MutualAidPact hosted by the host jurisdiction with pledged_units 10, max_concurrent_commitments 3 and window [2026-09-01, 2026-10-01)."
            - "Two COMMITTED MutualAidCommitments of 1 unit each on the shared asset over [2026-09-05, 2026-09-15) and [2026-09-10, 2026-09-20), so reserved_units is 2 and free_units is 8."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "WATER", name: "Harbor Water Treatment Plant", replacement_value_cents: 1200000000, service_population: 150000, redundancy_factor: 0.25, is_shared: true }
              as: RegionalAdministrator
              captures: { a_shared_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "POWER", name: "Harbor Depot Backup Feeder", replacement_value_cents: 400000000, service_population: 40000, redundancy_factor: 0.10, is_shared: false }
              as: RegionalAdministrator
              captures: { a_local_id: $.data.id }
            - call: "POST /resilience/mutual-aid-pacts"
              payload: { host_jurisdiction_id: "${j_harbor_id}", resource_class: "PUMPS", pledged_units: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", max_concurrent_commitments: 3 }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { pact_id: $.data.id, pact_v1: $.data.version }
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_shared_id}", committed_units: 1, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v1}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { c1_id: $.data.id }
            - call: "GET /resilience/mutual-aid-pacts/${pact_id}"
              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { pact_v2: $.data.version }
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_shared_id}", committed_units: 1, window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v2}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { c2_id: $.data.id }
            - call: "GET /resilience/mutual-aid-pacts/${pact_id}"
              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { pact_v3: $.data.version }
          trigger:
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_local_id}", committed_units: 1, window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-14T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v3}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_shared_id}", committed_units: 1, window_start: "2026-09-12T00:00:00Z", window_end: "2026-09-14T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v3}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
          assert:
            - "the first trigger call returns 409 with error_id ERR_ASSET_NOT_SHARED, even though the overlap count at 2026-09-12T00:00:00Z would also reach 3 and hit max_concurrent_commitments 3"
            - "the second trigger call returns 409 with error_id ERR_AID_CONCURRENCY_LIMIT, proving the overlap-count check is reachable and was skipped only because priority 28 fired first"
            - "neither rejection returns ERR_AID_CAPACITY_EXCEEDED, because the peak unit load would be 3, well inside pledged_units 10"
            - "MutualAidPact.${pact_id}.reserved_units == 2, free_units == 8, status == OPEN and version == 3 after both rejections"

  - rule_id: boundary_precision_check
    instances:
      - name: bcr_rounded_to_four_places_decides_the_grant_floor
        grounds:
          - calculations.benefit_cost_ratio
          - validations.priority_51_ERR_BCR_BELOW_FLOOR
          - entities.BenefitCostAnalysis.fields.bcr
          - entities.BenefitCostAnalysis.fields.grant_eligible
          - state_machines.BenefitCostAnalysis.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          Three projects differ only in avoided_loss_annual_cents — 2118960, 2118855 and 2118854 —
          against the identical cost measure 2118960. The first sits exactly on the floor, the second
          has an exact quotient of 0.9999500... that ROUND_HALF_UP lifts to 1.0000 and therefore
          passes, and the third quantizes to 0.9999 and is rejected. The pass/fail line is drawn on
          the stored 4-decimal bcr, not on the exact rational quotient, so an implementation that
          compares the unrounded ratio to 1 fails on the middle project by exactly one cent of input.
