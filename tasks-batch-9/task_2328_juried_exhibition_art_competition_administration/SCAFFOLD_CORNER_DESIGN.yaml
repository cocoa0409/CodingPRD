      - name: exhibition_two_axes_change_independently
        claim_type: parallel
        grounds:
          - state_machines.Exhibition[axis=status]
          - state_machines.Exhibition[axis=settlement_status]
        excluded_because:
          difficulty_instance: non_linear_state_machine / exhibition_status_and_settlement_axes_advance_independently
          rationale: "That §1.8 instance drives status ON_VIEW to CLOSED while settlement_status stays RECONCILING and asserts the BOOKS_CLOSED guard, which is exactly this parallel-axis claim."

      - name: jury_round_loops_back_to_open_within_its_bound
        claim_type: cyclic
        grounds:
          - state_machines.JuryRound.SCORING_COMPLETE_to_OPEN
          - errors[ERR_ROUND_REOPEN_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / jury_round_reopen_cycle_bounded_at_two
          rationale: "That §1.8 instance reopens twice, pins reopen_count at 2 and asserts the third attempt fails, covering both the loop and its termination condition."

      - name: shortlist_fork_paths_and_waitlist_rejoin
        claim_type: branching
        grounds:
          - state_machines.Artwork[axis=status].SHORTLISTED_to_ACCEPTED
          - state_machines.Artwork[axis=status].SHORTLISTED_to_WAITLISTED
          - state_machines.Artwork[axis=status].WAITLISTED_to_ACCEPTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / artwork_shortlist_fork_and_waitlist_rejoin
          rationale: "That §1.8 instance exercises all three fork arms from SHORTLISTED and the promotion rejoin in one recipe."

      - name: purchase_award_confirmation_cross_entity_chain
        claim_type: cross_entity
        grounds:
          - state_machines.Award.PROPOSED_to_CONFIRMED
          - entities.Sponsor.fields.purchase_award_committed_cents
        excluded_because:
          difficulty_instance: transitive_cascade / purchase_award_confirm_cascades_award_sale_artwork_ledger
          rationale: "That §1.8 instance verifies each of the four hops Award to Sponsor to Sale to Artwork to Exhibition ledger with literal cent values."

      - name: sale_void_compensates_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Sale.PAID_to_VOIDED
          - state_machines.Artwork[axis=status].SOLD_to_ON_VIEW
        excluded_because:
          difficulty_instance: compensating_invariant / sale_void_restores_exhibition_money_aggregates
          rationale: "That §1.8 instance asserts all four money aggregates return to 0 and the artwork returns to ON_VIEW with sold_price_cents null — the full undo with no drift."

      - name: promotion_guarded_by_parent_exhibition_phase
        claim_type: guarded_transitions
        grounds:
          - state_machines.Artwork[axis=status].WAITLISTED_to_ACCEPTED
          - errors[ERR_EXHIBITION_PHASE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / promotion_requires_exhibition_before_on_view
          rationale: "That §1.8 instance runs the identical promotion from two different parent-exhibition phases and shows only the guard differs."

  # =========================================================================
  # SECTION: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: sponsor_recognition_tier_constants_at_every_inclusive_floor
        claim_type: constants_applied
        grounds:
          - calculations.sponsor_recognition_tier
          - calculations.sponsor_recognition_tier.constants
          - entities.Sponsor.fields.recognition_tier
        distinguishing_aspect: "Every declared floor is exercised one cent below and exactly at the boundary in a single recipe, proving the comparison is >= and not > : 249999 NONE, 250000 BRONZE, 999999 BRONZE, 1000000 SILVER, 5000000 PRESENTING."
        test_recipe:
          setup: ["One DRAFT Exhibition; five sponsors created against it with contributions straddling each declared floor."]
