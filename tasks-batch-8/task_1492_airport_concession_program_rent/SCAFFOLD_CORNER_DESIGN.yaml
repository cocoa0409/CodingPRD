  - section: cross_cutting_layers
    instances:
      - name: lease_patch_stale_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: first PATCH with the observed version succeeds and bumps version; a second PATCH carrying the now-stale version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT lease; caller observed version v0"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "PATCH /concessions/leases/${l1}", payload: { expected_lease_version: "${v0}", min_spe_cents: 1100 }, as: AirportAdmin, captures: { v1: $.data.version } }
            - { call: "PATCH /concessions/leases/${l1}", payload: { expected_lease_version: "${v0}", min_spe_cents: 1200 }, as: AirportAdmin, captures: { err: $.data.error_id } }
          assert:
            - "v1 == v0 + 1"
            - "err == ERR_STALE_VERSION"

      - name: arrears_reconciles_after_partial_payment
        claim_type: derived_field_reconciliation
        grounds: ["calculations.arrears_reconciliation", "entities.Lease.fields.arrears_cents"]
        distinguishing_aspect: "Derived field: after a 300,000 partial payment on a 1,200,000 invoice, lease.arrears_cents reads exactly the open balance 900,000 in the same session (immediate consistency)."
        test_recipe:
          setup: ["Settlement 2026 INVOICED (1,200,000)"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/payments", payload: { amount_cents: 300000, method: "ACH" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "GET /concessions/leases/${l1}", payload: {}, as: ConcessionAnalyst, captures: { arr: $.data.arrears_cents } }
          assert:
            - "arr == 900000"

      - name: overdue_settlement_accepts_payment_to_paid
        claim_type: rate_threshold_triggers
        grounds: ["state_machines.RentSettlement.OVERDUE_to_PAID"]
        distinguishing_aspect: "OVERDUE does not block payment: after the sweep flips the settlement to OVERDUE, a full payment still settles it to PAID."
        test_recipe:
          setup: ["Settlement INVOICED (due 2027-02-14), swept to OVERDUE at clock 2027-02-15"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements/${s1}/invoice", payload: {}, as: ConcessionAnalyst }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-15T00:00:00Z" }, as: AirportAdmin }
          trigger:
            - { call: "POST /concessions/settlements/${s1}/payments", payload: { amount_cents: 1200000, method: "ACH" }, as: Tenant, as_user_id: "${t1}" }
            - { call: "GET /concessions/settlements/${s1}", payload: {}, as: ConcessionAnalyst, captures: { sstat: $.data.status } }
          assert:
            - "sstat == PAID"

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: report_accept_updates_settlement_in_same_request_chain
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "state_machines.SalesReport.SUBMITTED_to_ACCEPTED"]
        distinguishing_aspect: "Immediate consistency: the settlement recalculation triggered by ACCEPT is visible in the very next GET — no delay, no stale derived values."
        test_recipe:
          setup: ["ACTIVE lease; settlement 2026 ACCRUING (initial provisional pct 1,200,000: 12 x 100,000 projected); report 2026-01 gross 600,000 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /concessions/tenants", payload: { legal_name: "SkyEats LLC", contact_email: "ops@skyeats.com" }, as: AirportAdmin, captures: { t1: $.data.id } }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t1}", premises_code: "A1", category: "FOOD", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 1200000, pct_rate_below_bp: 800, pct_breakpoint_cents: 500000, pct_rate_above_bp: 1000, acdbe_goal_bp: 2000, ti_allowance_cents: 500000, buildout_deadline: "2026-09-30", min_spe_cents: 1000 }, as: AirportAdmin, captures: { l1: $.data.id } }
            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/settlements", payload: { lease_id: "${l1}", period_year: 2026 }, as: AirportAdmin, captures: { s1: $.data.id, pct0: $.data.percentage_due_cents } }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 600000 }, as: Tenant, as_user_id: "${t1}", captures: { r1: $.data.id } }
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "SUBMIT" }, as: Tenant, as_user_id: "${t1}" }
          trigger:
            - { call: "POST /concessions/sales-reports/${r1}/transition", payload: { action: "ACCEPT" }, as: ConcessionAnalyst }
            - { call: "GET /concessions/settlements/${s1}", payload: {}, as: ConcessionAnalyst, captures: { pct1: $.data.percentage_due_cents } }
          assert:
            - "pct0 == 1200000   # initial provisional: 12 x 100,000"
            - "pct1 == 1150000   # 50,000 actual + 11 x 100,000 — visible immediately after ACCEPT"
