      - name: empty_subcertification_scope_reads_zero_coverage_and_trips_the_scope_rule
        grounds:
          - calculations.certification_coverage_pct
          - validations[priority=42]
          - validations[priority=43]
          - state_machines.OfficerCertification.BLOCKED_to_ELIGIBLE
          - errors.ERR_CERT_SCOPE_EMPTY
        distinguishing_aspect: |
          The empty input set is a deliberate trap: coverage over zero sub-certifications is defined as
          0.00, NOT the vacuously-true 100.00, and eligibility is granted by the cycle transition
          regardless of coverage, so the certification does reach ELIGIBLE with an empty scope. Signing
          it must fail with ERR_CERT_SCOPE_EMPTY at priority 42 — ahead of the coverage rule at
          priority 43 — which is the only way to distinguish an implementation that defines the empty
          average as 100.00 (it would let the signature through) from one that follows the convention.
