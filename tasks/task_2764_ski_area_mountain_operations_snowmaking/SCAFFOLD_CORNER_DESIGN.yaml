        distinguishing_aspect: |
          SnowDepthReading is the only entity declared with common_fields false: it is an observation
          log, so it has no version and no updated_at, and section 1.5 declares no update or delete
          route for it. Correcting a stake therefore means appending a later reading and letting
          calculations.terrain_base_depth collapse to the latest per stake - which is exactly why the
          collapse rule exists. Two readings for S1 are posted and both remain retrievable.
