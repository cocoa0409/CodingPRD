            - "ReplacementOrder.${o2}.funding_mode_applied == PRO_RATA with allocated_total_cents == 100000"
            - "ReplacementOrder.${o2}.funding_allocations has a 33333-cent row on ${fs1} and a 66667-cent row on ${fs2}"
            - "FundingSource.${fs1}.committed_cents == 133333 and available_cents == 66667"
            - "FundingSource.${fs2}.committed_cents == 66667 and available_cents == 133333"

      - name: body_foreign_keys_are_resolved_in_declared_input_order
        claim_type: cross_reference_link
        grounds:
          - validations.priority_42_ERR_ENTITY_NOT_FOUND
          - endpoints.POST_lsl_service_lines
          - endpoints.POST_lsl_verification_appointments
        distinguishing_aspect: "An unresolvable street_project_id returns ERR_STREET_PROJECT_NOT_FOUND and an unresolvable crew_id returns ERR_CREW_NOT_FOUND, but when BOTH water_system_id and street_project_id are bogus the error is ERR_WATER_SYSTEM_NOT_FOUND, because FKs are validated in the order the endpoint's input list declares them."
        test_recipe:
          setup:
            - "One water system and one service line."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2104003", system_name: "FK Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
