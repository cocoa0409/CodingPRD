              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${liab_id}", text: "edit1", is_deviation: true } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { ver1_id: $.data.id, c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/deviation-approvals"
              payload: { contract_id: "${contract_id}", contract_version_id: "${ver1_id}", clause_template_id: "${liab_id}", justification: "ok" }
