              payload: { reason: "QUALITY_FAILURE", note: "late audit finding" }
              as: MedicalDirector
              as_user_id: "md-002"
          assert:
            - "StorageAccount.${acct_f5_id}.last_settlement_total_cents == -7560"
            - "StorageAccount.${acct_f1_id}.last_settlement_total_cents == 2500"
            - "the two settlements differ by exactly 10060 cents, the PRORATED_TERMINATION refund for 204 unused days"
            - "StorageAccount.${acct_f5_id}.balance_cents == 0"
            - "StorageAccount.${acct_f1_id}.balance_cents == 0"
            - "CordBloodUnit.${unit_f5_id}.availability_status == DISPOSED"
            - "CordBloodUnit.${unit_f1_id}.availability_status == DISPOSED"
            - "StorageTank.${tank_b_id}.occupied_slots == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_per_line_rounding_order_pinned_mode_b
        grounds:
          - calculations.storage_invoice_total
          - entities.StorageInvoice.fields.base_line_cents
          - entities.StorageInvoice.fields.surcharge_line_cents
          - entities.StorageInvoice.fields.admin_line_cents
          - entities.StorageInvoice.fields.amount_due_cents
          - entities.StorageTank.fields.tank_class
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order decides the cent. For prorated_days 100 on a PREMIUM
          tank the pinned round-per-line-then-sum order yields 4932 + 370 + 225 = 5527 cents, whereas
          sum-the-exact-lines-then-round yields 5526; the surcharge is computed on the ALREADY-ROUNDED
          base line, not on the exact one.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ONLINE PREMIUM tank with 10 slots holding one CRYOPRESERVED PRIVATE_FAMILY unit."
            - "That unit's StorageAccount has plan_term_years 5, paid_through_date 2027-06-30, balance_cents 0 and no invoices."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-P", tank_class: "PREMIUM", capacity_slots: 10 }
              as: FacilitiesEngineer
              captures: { tank_p_id: "$.data.id" }
            - call: "POST /cbb/enrollments"
