        excluded_because:
          difficulty_instance: usd_conversion_round_per_line_then_sum_pinned_order
          rationale: "The per-line-then-sum rounding order (21626 rather than the sum-then-round 21625 for the canonical three-line SELL) is exactly what that §1.8 combinatorial_formula instance pins, including the wrong-reading literal."

