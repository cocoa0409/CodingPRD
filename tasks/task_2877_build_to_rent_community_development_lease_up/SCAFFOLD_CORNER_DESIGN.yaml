              payload: { name: "Mistwood", market_code: "GA-ATL", total_planned_units: 9, product_mix: { DETACHED: 9, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
