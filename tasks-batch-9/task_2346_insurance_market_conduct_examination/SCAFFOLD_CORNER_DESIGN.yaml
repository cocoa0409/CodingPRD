      - name: abort_is_reachable_from_every_non_terminal_state_and_only_once
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /market-conduct/examinations/{id}/abort]
          - validations[priority 40 ERR_EXAM_ALREADY_TERMINAL]
          - state_machines.Examination
        distinguishing_aspect: |
          Abort is the only transition with no source-state precondition, so it fires identically from
          SCOPING and from DATA_CALL, and abort_reason is the one free-text field that is required rather
          than optional. Once the examination is terminal every other write on it - including a second
          abort - answers with the terminal refusal rather than with that endpoint's own state error,
          which shows the terminal guard is evaluated ahead of the per-endpoint state gates.
        test_recipe:
          setup:
            - "Two carriers: one examination still in SCOPING and one whose scope has been locked."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Boreal Casualty Company", naic_code: "10002", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { boreal_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${boreal_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_b_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_b_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { b_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_b_id}/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
          trigger:
            - call: "POST /market-conduct/examinations/${exam_id}/abort"
              payload: { abort_reason: "The examination is withdrawn following a company-wide receivership order." }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { a_status: "$.data.status", a_reason: "$.data.abort_reason" }
            - call: "POST /market-conduct/examinations/${exam_b_id}/abort"
              payload: { abort_reason: "The second examination is withdrawn after the carrier entered rehabilitation." }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { b_status: "$.data.status", b_reason: "$.data.abort_reason" }
            - call: "POST /market-conduct/examinations/${exam_id}/abort"
              payload: { abort_reason: "A second withdrawal is attempted on an already aborted examination." }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { err_twice: "$.data.error_id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { err_area: "$.data.error_id" }
            - call: "POST /market-conduct/examinations/${exam_b_id}/abort"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { err_no_reason: "$.data.error_id" }
            - call: "POST /market-conduct/scope-areas/${b_area_id}/data-calls"
              payload: { records_requested: 4000, response_due_date: "2026-09-15" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { err_dc: "$.data.error_id" }
            - call: "GET /market-conduct/examinations"
              payload: { status: "ABORTED" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
          assert:
            - "Aborting from SCOPING returns 200 with status == ABORTED and abort_reason stored verbatim"
            - "Aborting from DATA_CALL returns 200 with status == ABORTED - abort has no source-state precondition"
            - "A second abort returns 409 ERR_EXAM_ALREADY_TERMINAL rather than succeeding idempotently"
            - "Creating a scope area on the aborted SCOPING examination returns 409 ERR_EXAM_ALREADY_TERMINAL, not ERR_EXAM_NOT_IN_SCOPING - even though that examination was in SCOPING when it was aborted"
            - "Omitting abort_reason returns 422 ERR_INVALID_REQUEST - it is a required input, and the shape gate is reached before the terminal gate on that request"
            - "Issuing a data call under the aborted examination returns 409 ERR_EXAM_ALREADY_TERMINAL, not ERR_SCOPE_NOT_LOCKED"
            - "GET /market-conduct/examinations?status=ABORTED reports total_count == 2"
            - "The cascading child and counter effects of abort are asserted by the difficulty design, not restated here"

      - name: rebut_is_legal_only_from_responded_and_returns_the_criticism_to_issued
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /market-conduct/criticisms/{id}/rebut]
          - validations[priority 40 ERR_CRITICISM_STATE_INVALID]
          - entities.Criticism.fields.rebuttal_count
        distinguishing_aspect: |
          rebut and finalize share the identical RESPONDED precondition and the identical refusal code,
          so on a freshly issued criticism both are refused and after a rebuttal both are refused again -
          the criticism has to be answered before either is available. The two counters move on
          different schedules: rebuttal_count advances on the department's rebuttal while response_round
          advances only on the carrier's next answer, so after one rebuttal the pair reads 1 and 1.
        test_recipe:
          setup:
            - "One examination in the criticism phase with a freshly issued criticism."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
