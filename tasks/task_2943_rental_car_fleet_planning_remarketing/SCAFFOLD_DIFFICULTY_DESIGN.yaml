              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { t_rsk_lic: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${t_rsk_lic}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_rsk}/in-fleeting-tasks"
              payload: { task_type: "PREPARATION", cost_cents: 21000, window_start: "2026-01-08T08:00:00Z", window_end: "2026-01-08T10:00:00Z", bay_code: "B1" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { t_rsk_prep: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/in-fleeting-tasks/${t_pgm_prep}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/in-fleeting-tasks/${t_rsk_prep}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_pgm}/usage"
              payload: { odometer_km: 47000, rented_days_delta: 180, available_days_delta: 243, revenue_cents_delta: 1320000 }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_rsk}/usage"
              payload: { odometer_km: 47000, rented_days_delta: 180, available_days_delta: 243, revenue_cents_delta: 1320000 }
              as: MarketOperator
