# =============================================================================
# Formalwear & Costume Rental — Benchmark Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty band: Expert (§0.4).
# =============================================================================

scenario: "Formalwear & Costume Rental: garment/size inventory, measurement & fit, reservation by event date, deposit & damage waiver, pickup & return window, late/damage fee, alteration, group/wedding-party coordination"

domain_name: formalwear-costume-rental
api_prefix: /
# Flat topology: peer entities are addressed at the API root (e.g. /reservations,
# /garment-units). There is no single top-level resource to nest everything under.

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; reservations bind Customer + GarmentUnit
  # + Catalog + (optional) PartyOrder without URL nesting.

  state_machine_shape: branching
  # Reservation has fork-join (PICKED_UP -> {RETURNED, OVERDUE} -> SETTLED) with
  # divergent side-effect sets per branch; PartyOrder is compound (posture derived
  # from member reservation states); GarmentUnit cycles AVAILABLE<->IN_CLEANING.

  relationship_patterns:
    - one_to_many        # Catalog -> GarmentUnit; Customer -> Reservation; PartyOrder -> Reservation
    - cross_aggregate    # Reservation references GarmentUnit (inventory aggregate) and Customer (account aggregate)
    - polymorphic        # LedgerEntry.reservation_id is nullable (party-level vs reservation-level postings)

  role_model: peer_roles
  # Customer owns own reservations/profile/party; StoreClerk operates the shop
  # floor (inventory, pickup, return, alteration, settlement); StoreManager has
  # override surface (waive fees, retire units, clock).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Catalog
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation", default: 1 }
      - { name: style_name, type: string, source: input, description: "Style/SKU display name" }
      - { name: category, type: enum, source: input, description: "FORMALWEAR | COSTUME", constraints: "one of {FORMALWEAR, COSTUME}" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Base rental rate per rental-day in cents", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable security deposit held per unit at pickup", constraints: ">= 0" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Full replacement value used as damage-fee ceiling", constraints: ">= 0" }
      - { name: waiver_daily_rate_cents, type: integer, source: input, description: "Damage-waiver surcharge per rental-day when waiver opted in", constraints: ">= 0" }
      - { name: cleaning_buffer_days, type: integer, source: input, description: "Mandatory days a unit is unavailable after a return before the next pickup window may begin", constraints: ">= 0", default: 1 }
      - { name: late_fee_daily_rate_cents, type: integer, source: input, description: "Per-day late fee charged for each calendar day past the return-window end", constraints: ">= 0" }
      - { name: active_unit_count, type: integer, source: computed, description: "Count of GarmentUnit children whose status != RETIRED" }

  - name: GarmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation", default: 1 }
      - { name: catalog_id, type: string, source: input, description: "FK -> Catalog.id; the style this physical unit belongs to" }
      - { name: size_code, type: enum, source: input, description: "Garment size", constraints: "one of {XS, S, M, L, XL, XXL}" }
      - { name: condition_grade, type: enum, source: system, description: "GRADE_A | GRADE_B | GRADE_C; downgraded by damaged returns", default: "GRADE_A", constraints: "one of {GRADE_A, GRADE_B, GRADE_C}" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: "AVAILABLE", constraints: "one of {AVAILABLE, RESERVED, OUT, IN_CLEANING, RETIRED}" }
      - { name: damage_strike_count, type: integer, source: system, description: "Number of DAMAGED settlements recorded against this unit; drives auto-retire", default: 0 }
      - { name: available_from_iso, type: datetime, source: computed, description: "Earliest date this unit may next be picked up (last return end + Catalog.cleaning_buffer_days); null when never rented" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Customer" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation", default: 1 }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across customers" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Sum of deposits currently held for this customer across reservations in {PICKED_UP, OVERDUE}" }
      - { name: balance_owed_cents, type: integer, source: computed, description: "Sum of unpaid fee charges (late + damage + alteration) net of waivers and credits across this customer's settlements" }
      - { name: open_strike_count, type: integer, source: computed, description: "Count of this customer's settlements with disposition DAMAGED in trailing window; gates damage-waiver requirement" }

  - name: MeasurementProfile
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation", default: 1 }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the customer these measurements belong to" }
      - { name: chest_cm, type: integer, source: input, description: "Chest circumference in cm", constraints: "> 0" }
      - { name: waist_cm, type: integer, source: input, description: "Waist circumference in cm", constraints: "> 0" }
      - { name: inseam_cm, type: integer, source: input, description: "Inseam in cm", constraints: "> 0" }
      - { name: recommended_size_code, type: enum, source: computed, description: "Size derived from chest_cm via size chart", constraints: "one of {XS, S, M, L, XL, XXL}" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; tie-break key for unit selection and overdue sweep order" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation", default: 1 }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; who rents" }
      - { name: catalog_id, type: string, source: input, description: "FK -> Catalog.id; the requested style" }
      - { name: garment_unit_id, type: string, source: system, description: "FK -> GarmentUnit.id; the specific unit the server allocates at confirmation; null while PENDING" }
      - { name: party_order_id, type: string, source: input, description: "FK -> PartyOrder.id; null for standalone reservations (polymorphic optional link)" }
      - { name: requested_size_code, type: enum, source: input, description: "Size requested", constraints: "one of {XS, S, M, L, XL, XXL}" }
      - { name: event_date_iso, type: datetime, source: input, description: "Date of the customer's event; pickup window must end on/before it" }
      - { name: pickup_window_start_iso, type: datetime, source: input, description: "Inclusive start of the pickup window" }
      - { name: return_window_end_iso, type: datetime, source: input, description: "Inclusive end of the return window; late fees accrue per day after this" }
      - { name: damage_waiver_opted, type: boolean, source: input, description: "Whether the customer purchased the damage waiver at booking", default: false }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: "PENDING", constraints: "one of {PENDING, CONFIRMED, PICKED_UP, RETURNED, OVERDUE, SETTLED, CANCELLED}" }
      - { name: rental_days, type: integer, source: computed, description: "Inclusive day span from pickup_window_start to return_window_end used for rate math" }
      - { name: quoted_charge_cents, type: integer, source: computed, description: "Provisional booking quote: rental + waiver surcharge, computed at confirmation" }

  - name: Alteration
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation", default: 1 }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation being altered" }
      - { name: kind, type: enum, source: input, description: "Alteration type", constraints: "one of {HEM, TAKE_IN, LET_OUT}" }
      - { name: fee_cents, type: integer, source: input, description: "Flat alteration fee quoted by the clerk", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: "REQUESTED", constraints: "one of {REQUESTED, COMPLETED, CANCELLED}" }

  - name: PartyOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation; OCC parent for member-reservation creation", default: 1 }
      - { name: coordinator_customer_id, type: string, source: input, description: "FK -> Customer.id; the wedding-party / group coordinator" }
      - { name: event_date_iso, type: datetime, source: input, description: "The shared event date all member reservations must match" }
      - { name: required_member_count, type: integer, source: input, description: "Number of confirmed member reservations required before the party may LOCK", constraints: ">= 1" }
      - { name: confirmed_member_count, type: integer, source: computed, description: "Count of member reservations in {CONFIRMED, PICKED_UP, RETURNED, OVERDUE, SETTLED}" }
      - { name: posture, type: enum, source: computed, description: "Derived coordination state: FORMING (below required) | READY (>= required) | LOCKED (coordinator locked) | DISSOLVED", default: "FORMING", constraints: "one of {FORMING, READY, LOCKED, DISSOLVED}" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation", default: 1 }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation being closed out (1:1)" }
      - { name: returned_at_iso, type: datetime, source: input, description: "Actual return timestamp recorded by the clerk" }
      - { name: disposition, type: enum, source: input, description: "Inspection outcome", constraints: "one of {CLEAN, DAMAGED, LOST}" }
      - { name: late_days, type: integer, source: computed, description: "Calendar days returned_at is past return_window_end; 0 if on/before" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late fee component" }
      - { name: damage_fee_cents, type: integer, source: computed, description: "Damage/loss fee component before waiver" }
      - { name: waiver_credit_cents, type: integer, source: computed, description: "Amount of damage_fee absorbed by the damage waiver (0 when not opted)" }
      - { name: net_charge_cents, type: integer, source: computed, description: "Total customer owes after waiver and deposit application" }
      - { name: deposit_refund_cents, type: integer, source: computed, description: "Portion of deposit returned to the customer" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; append-order key for the ledger" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; account the posting belongs to" }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; null for party-level postings (polymorphic optional link)" }
      - { name: entry_type, type: enum, source: system, description: "DEPOSIT_HOLD | DEPOSIT_RELEASE | DEPOSIT_CAPTURE | FEE_CHARGE | FEE_WAIVE", constraints: "one of {DEPOSIT_HOLD, DEPOSIT_RELEASE, DEPOSIT_CAPTURE, FEE_CHARGE, FEE_WAIVE}" }
      - { name: amount_cents, type: integer, source: input, description: "Signed posting amount in cents; sign convention pinned in calc deposit_conservation" }

  - name: FitCheck
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation", default: 1 }
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the confirmed reservation being fitted" }
      - { name: measurement_profile_id, type: string, source: input, description: "FK -> MeasurementProfile.id; the measurements used for the check" }
      - { name: verdict, type: enum, source: computed, description: "Fit outcome derived from recommended_size_code vs Reservation.requested_size_code", constraints: "one of {PASS, NEEDS_ALTERATION, FAIL}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Reservation
    initial_state: PENDING
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /reservations/{id}/confirm"
        actor: StoreClerk
        preconditions:
          - "Reservation.status == PENDING"
          - "No other Reservation of the SAME customer_id in status {CONFIRMED, PICKED_UP, OVERDUE} has a rental window [pickup_window_start_iso, return_window_end_iso) that overlaps this one (half-open, no buffer) (else ERR_CUSTOMER_WINDOW_CONFLICT)"
          - "A GarmentUnit of Reservation.catalog_id with size_code == requested_size_code, status == AVAILABLE, condition_grade IN {GRADE_A, GRADE_B}, and (available_from_iso == null OR available_from_iso <= pickup_window_start_iso) exists (else ERR_NO_UNIT_AVAILABLE)"
          - "If party_order_id is set, PartyOrder.posture IN {FORMING, READY} and PartyOrder.event_date_iso == Reservation.event_date_iso (else ERR_PARTY_NOT_OPEN)"
          - "If party_order_id is set and OCC supplied, expected_party_order_version matches PartyOrder.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Server selects the GarmentUnit per calc unit_selection and pins Reservation.garment_unit_id"
          - "Selected GarmentUnit.status: AVAILABLE -> RESERVED"
          - "Compute Reservation.rental_days and Reservation.quoted_charge_cents per calc booking_quote (provisional variant)"
          - "If party_order_id is set: PartyOrder.confirmed_member_count recomputed; PartyOrder.posture recomputed (FORMING -> READY when confirmed_member_count >= required_member_count); PartyOrder.version += 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: "Customer or StoreClerk"
        preconditions:
          - "Reservation.status == PENDING"
        side_effects:
          - "No unit was allocated; nothing to release"
          - "If party_order_id set: PartyOrder.confirmed_member_count and posture recomputed; PartyOrder.version += 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: "Customer or StoreClerk"
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "Linked PartyOrder (if any) is NOT LOCKED (else ERR_PARTY_LOCKED)"
        side_effects:
          - "Allocated GarmentUnit.status: RESERVED -> AVAILABLE (released back to pool)"
          - "Any Alteration in REQUESTED for this reservation -> CANCELLED"
          - "If party_order_id set: PartyOrder.confirmed_member_count and posture recomputed (READY -> FORMING when count drops below required); PartyOrder.version += 1"
      - from: CONFIRMED
        to: PICKED_UP
        trigger: "POST /reservations/{id}/pickup"
        actor: StoreClerk
        preconditions:
          - "Reservation.status == CONFIRMED"
          - "A FitCheck exists for this reservation with verdict == PASS, OR verdict == NEEDS_ALTERATION with at least one COMPLETED Alteration on the reservation (else ERR_FIT_NOT_CLEARED); a FAIL verdict never clears pickup"
          - "All Alteration rows for this reservation are in {COMPLETED, CANCELLED} (no REQUESTED) (else ERR_ALTERATION_PENDING)"
          - "Customer.balance_owed_cents == 0 (else ERR_BALANCE_OUTSTANDING)"
        side_effects:
          - "Allocated GarmentUnit.status: RESERVED -> OUT"
          - "Append LedgerEntry DEPOSIT_HOLD for Catalog.deposit_cents; Customer.deposit_held_cents recomputed"
      - from: PICKED_UP
        to: RETURNED
        trigger: "POST /reservations/{id}/return with returned_at on/before return_window_end (any disposition: CLEAN, DAMAGED, or LOST)"
        actor: StoreClerk
        preconditions:
          - "Reservation.status IN {PICKED_UP, OVERDUE}"
          - "returned_at_iso (body) <= Reservation.return_window_end_iso  (this is the ON-TIME branch)"
        side_effects:
          - "Create Settlement; compute settlement_charges (on_time_branch: late_days = 0, late_fee_cents = 0; damage fee by disposition)"
          - "GarmentUnit.status: OUT -> IN_CLEANING; GarmentUnit.available_from_iso = returned_at + Catalog.cleaning_buffer_days"
          - "If disposition DAMAGED/LOST: GarmentUnit.condition_grade downgraded one grade and GarmentUnit.damage_strike_count += 1; unit auto-RETIRED when damage_strike_count >= MAX_STRIKES or disposition == LOST"
          - "Append ledger postings per calc deposit_conservation (DEPOSIT_CAPTURE for applied_from_deposit, FEE_CHARGE/FEE_WAIVE as applicable); Customer.deposit_held_cents, balance_owed_cents, open_strike_count recomputed"
        note: "ON-TIME branch: returned on/before the window end. No late fee. Diverges from the OVERDUE branch in that late_fee_cents is forced to 0."
      - from: PICKED_UP
        to: OVERDUE
        trigger: "POST /reservations/{id}/return with returned_at past window, OR POST /_clock/advance sweep crossing return_window_end while still PICKED_UP"
        actor: "StoreClerk or system"
        preconditions:
          - "Reservation.status == PICKED_UP"
          - "returned_at_iso (body) > Reservation.return_window_end_iso, OR clock sweep observes current clock > return_window_end_iso"
        side_effects:
          - "Via /return (LATE branch): Create Settlement; compute settlement_charges (late_branch: late_days > 0, late_fee_cents > 0; damage fee by disposition); GarmentUnit OUT -> IN_CLEANING; available_from_iso = returned_at + buffer; DAMAGED/LOST downgrade + strike + possible auto-RETIRE; deposit_conservation postings; Customer balances recomputed"
          - "Via clock sweep: NO Settlement created (unit still OUT); Reservation merely flagged OVERDUE so late fees will accrue when /return is eventually called"
        note: "OVERDUE branch diverges from the RETURNED branch: late_fee_cents > 0. Reaching OVERDUE via the sweep leaves the unit OUT with no Settlement; the eventual /return from OVERDUE creates the Settlement."
      - from: OVERDUE
        to: SETTLED
        trigger: "POST /reservations/{id}/return (when reached OVERDUE via clock sweep, no Settlement yet), OR POST /settlements/{id}/finalize"
        actor: StoreClerk
        preconditions:
          - "Reservation.status == OVERDUE"
          - "Via /return: no Settlement exists yet for this reservation. Via /finalize: a Settlement exists"
        side_effects:
          - "Via /return: Create Settlement (late_branch); GarmentUnit OUT -> IN_CLEANING; available_from_iso set; DAMAGED/LOST downgrade + strike + auto-RETIRE; deposit_conservation postings; Customer balances recomputed; Reservation -> SETTLED"
          - "Via /finalize: finalize deposit disposition (DEPOSIT_RELEASE for deposit_refund_cents); Reservation -> SETTLED"
      - from: RETURNED
        to: SETTLED
        trigger: "POST /settlements/{id}/finalize"
        actor: StoreClerk
        preconditions:
          - "Reservation.status == RETURNED"
          - "A Settlement exists for this reservation"
        side_effects:
          - "Finalize deposit disposition: DEPOSIT_RELEASE for Settlement.deposit_refund_cents (the un-applied portion of the deposit returned to the customer)"
          - "Append ledger postings per calc deposit_conservation; Customer.deposit_held_cents recomputed (the hold is now closed)"

  - entity: GarmentUnit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (Reservation confirm allocates this unit)"
        actor: system
        preconditions:
          - "GarmentUnit.status == AVAILABLE"
        side_effects:
          - "Unit pinned to the confirming Reservation"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (Reservation cancelled from CONFIRMED)"
        actor: system
        preconditions:
          - "GarmentUnit.status == RESERVED"
        side_effects:
          - "Unit released back to the available pool"
      - from: RESERVED
        to: OUT
        trigger: "system (Reservation pickup)"
        actor: system
        preconditions:
          - "GarmentUnit.status == RESERVED"
        side_effects:
          - "Unit is physically with the customer"
      - from: OUT
        to: IN_CLEANING
        trigger: "system (Reservation return / settlement)"
        actor: system
        preconditions:
          - "GarmentUnit.status == OUT"
        side_effects:
          - "available_from_iso set to returned_at + Catalog.cleaning_buffer_days"
          - "If disposition DAMAGED/LOST: condition_grade downgraded, damage_strike_count += 1"
      - from: IN_CLEANING
        to: AVAILABLE
        trigger: "POST /garment-units/{id}/clear-cleaning, OR POST /_clock/advance sweep crossing available_from_iso"
        actor: "StoreClerk or system"
        preconditions:
          - "GarmentUnit.status == IN_CLEANING"
          - "Current clock >= GarmentUnit.available_from_iso"
          - "GarmentUnit.damage_strike_count < MAX_STRIKES (else routed to RETIRED)"
        side_effects:
          - "Unit returns to the available pool"
      - from: IN_CLEANING
        to: RETIRED
        trigger: "system (return with disposition LOST, or damage_strike_count >= MAX_STRIKES), OR POST /garment-units/{id}/retire"
        actor: "system or StoreManager"
        preconditions:
          - "GarmentUnit.status IN {IN_CLEANING, AVAILABLE}"
        side_effects:
          - "Unit permanently removed from rental pool"
          - "Catalog.active_unit_count recomputed (decremented)"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /garment-units/{id}/retire"
        actor: StoreManager
        preconditions:
          - "GarmentUnit.status == AVAILABLE"
        side_effects:
          - "Catalog.active_unit_count recomputed (decremented)"

  - entity: PartyOrder
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: READY
        trigger: "system (member reservation confirmed pushing confirmed_member_count >= required_member_count)"
        actor: system
        preconditions:
          - "confirmed_member_count >= required_member_count"
        side_effects:
          - "Party is eligible to LOCK"
      - from: READY
        to: FORMING
        trigger: "system (member reservation cancelled dropping confirmed_member_count below required_member_count)"
        actor: system
        preconditions:
          - "confirmed_member_count < required_member_count"
        side_effects:
          - "Party no longer eligible to LOCK"
      - from: READY
        to: LOCKED
        trigger: "POST /party-orders/{id}/lock"
        actor: Customer
        preconditions:
          - "PartyOrder.posture == READY"
          - "Acting Customer is the coordinator_customer_id (else ERR_NOT_COORDINATOR)"
          - "expected_party_order_version matches PartyOrder.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Member reservations frozen against cancellation (CONFIRMED members may no longer be cancelled until pickup)"
          - "PartyOrder.version += 1"
      - from: FORMING
        to: DISSOLVED
        trigger: "POST /party-orders/{id}/dissolve"
        actor: Customer
        preconditions:
          - "PartyOrder.posture == FORMING"
          - "Acting Customer is the coordinator_customer_id (else ERR_NOT_COORDINATOR)"
        side_effects:
          - "All PENDING member reservations -> CANCELLED (cascade)"
          - "Each CANCELLED member that was CONFIRMED releases its GarmentUnit RESERVED -> AVAILABLE"

  - entity: Alteration
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /alterations/{id}/complete"
        actor: StoreClerk
        preconditions:
          - "Alteration.status == REQUESTED"
          - "Parent Reservation.status IN {CONFIRMED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Alteration fee added to Customer.balance_owed_cents via LedgerEntry FEE_CHARGE (reservation-scoped)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /alterations/{id}/cancel, OR system (parent reservation cancelled)"
        actor: "StoreClerk or system"
        preconditions:
          - "Alteration.status == REQUESTED"
        side_effects:
          - "No fee charged"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: party-member-create-stale-party
    parent_entity: PartyOrder
    write_endpoint: "POST /reservations/{id}/confirm"
    occ_field: "expected_party_order_version"
    description: |
      Confirming a member Reservation against a PartyOrder whose version has
      advanced since the client last observed it is rejected. Each member
      confirmation legitimately bumps PartyOrder.confirmed_member_count and may
      flip its posture FORMING -> READY (advancing PartyOrder.version); a client
      that confirmed against a now-stale party view is rejected so coordinators
      never lock a party whose membership shifted underneath their last read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: party-lock-stale-party
    parent_entity: PartyOrder
    write_endpoint: "POST /party-orders/{id}/lock"
    occ_field: "expected_party_order_version"
    description: |
      Locking a PartyOrder whose version has advanced since the coordinator last
      observed it is rejected. A member confirmation or cancellation that changed
      confirmed_member_count (advancing PartyOrder.version) makes the coordinator's
      readiness view stale; the lock is rejected so the party is never frozen at a
      membership count the coordinator did not actually see.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: unit_selection
    trigger: "POST /reservations/{id}/confirm"
    algorithm: forward_looking
    formula: |
      candidates = GarmentUnit where:
        catalog_id == Reservation.catalog_id
        AND size_code == Reservation.requested_size_code
        AND status == AVAILABLE
        AND condition_grade IN {GRADE_A, GRADE_B}
        AND (available_from_iso == null OR available_from_iso <= Reservation.pickup_window_start_iso)
      if candidates is empty -> raise ERR_NO_UNIT_AVAILABLE
      rank candidates by:
        1. condition_grade ASC by quality rank where GRADE_A(0) < GRADE_B(1)   # best condition first
        2. damage_strike_count ASC                                            # fewest prior strikes
        3. created_at ASC                                                     # oldest unit first (deterministic)
      select rank-1 candidate; tie-break is created_at ASC (never id)
    input_set: "GarmentUnit rows of the catalog in size, status AVAILABLE, grade A/B, free by pickup window start"
    precision: "n/a (selection)"

  - name: booking_quote
    trigger: "POST /reservations/{id}/confirm (provisional); recomputed never after pickup"
    algorithm: tiered_pricing
    formula: |
      rental_days = floor((return_window_end_iso - pickup_window_start_iso) / 1 day) + 1   # inclusive span
      # Tiered daily rate by rental_days (volume discount on the per-day rate):
      #   1..3 days   -> rate_multiplier = 1.00
      #   4..7 days   -> rate_multiplier = 0.90  (applies to ALL days, not marginal)
      #   8+ days     -> rate_multiplier = 0.80  (applies to ALL days)
      effective_daily = round_half_up(Catalog.daily_rate_cents * rate_multiplier)   # round the per-day rate first
      rental_cents = effective_daily * rental_days
      waiver_cents = (Reservation.damage_waiver_opted ? Catalog.waiver_daily_rate_cents * rental_days : 0)
      quoted_charge_cents = rental_cents + waiver_cents
    input_set: "Single Reservation + its Catalog"
    constants:
      TIER1_MAX_DAYS: 3
      TIER2_MAX_DAYS: 7
      TIER2_MULTIPLIER: 0.90
      TIER3_MULTIPLIER: 0.80
    precision: "round_half_up to whole cents; ROUNDING ORDER PINNED: round the per-day effective rate FIRST, then multiply by rental_days (NOT round(daily_rate*multiplier*days))"
    variants:
      - name: provisional
        when: "at confirm"
        difference: "computed from booking inputs; never includes late or damage fees"
      - name: final
        when: "carried into settlement as the rental baseline"
        difference: "same rental_cents; settlement adds late/damage on top (see settlement_charges)"

  - name: settlement_charges
    trigger: "POST /reservations/{id}/return (computes the full fee breakdown when the Settlement is created)"
    algorithm: threshold
    formula: |
      late_days = max(0, ceil_days(returned_at_iso - Reservation.return_window_end_iso))   # whole days strictly after window end
      late_fee_cents = late_days * Catalog.late_fee_daily_rate_cents
      # Damage fee depends on disposition AND condition baseline:
      if disposition == CLEAN:   damage_fee_cents = 0
      elif disposition == DAMAGED:
          damage_fee_cents = min(Catalog.replacement_value_cents,
                                 round_half_up(Catalog.replacement_value_cents * DAMAGE_PCT))
      elif disposition == LOST:  damage_fee_cents = Catalog.replacement_value_cents
      # Waiver absorbs damage_fee only (never late fee), capped at WAIVER_CAP_CENTS:
      waiver_credit_cents = (Reservation.damage_waiver_opted
                             ? min(damage_fee_cents, WAIVER_CAP_CENTS)
                             : 0)
      gross_fees = late_fee_cents + damage_fee_cents - waiver_credit_cents
      # Deposit waterfall: deposit first absorbs gross_fees, remainder refunded:
      deposit = Catalog.deposit_cents
      applied_from_deposit = min(deposit, gross_fees)
      net_charge_cents = max(0, gross_fees - deposit)          # what customer still owes beyond deposit
      deposit_refund_cents = deposit - applied_from_deposit    # what is returned to customer
    input_set: "Single Settlement + its Reservation + Catalog"
    constants:
      DAMAGE_PCT: 0.60
      WAIVER_CAP_CENTS: 30000
      MAX_STRIKES: 2
    precision: "round_half_up to whole cents; late_days via ceil of day difference; min()/max() applied AFTER rounding the damage percentage"
    variants:
      - name: on_time_branch
        when: "returned_at <= return_window_end (RETURNED path)"
        difference: "late_days forced to 0, late_fee_cents = 0; damage fee still applies by disposition"
      - name: late_branch
        when: "returned_at > return_window_end (OVERDUE -> SETTLED path)"
        difference: "late_days > 0 contributes late_fee_cents on top of any damage fee"

  - name: deposit_conservation
    trigger: "pickup (DEPOSIT_HOLD), return/finalize (DEPOSIT_RELEASE / DEPOSIT_CAPTURE / FEE_CHARGE / FEE_WAIVE)"
    algorithm: aggregation
    formula: |
      # Sign convention: DEPOSIT_HOLD = +deposit (held), DEPOSIT_RELEASE = -refund_portion,
      # DEPOSIT_CAPTURE = -applied_from_deposit (deposit consumed by fees),
      # FEE_CHARGE = +fee (customer owes), FEE_WAIVE = -waiver_credit.
      # Invariant pinned over a single reservation's full pickup->settle lifecycle:
      #   held_at_pickup == deposit_refund_cents + applied_from_deposit
      #   i.e. DEPOSIT_HOLD amount == (DEPOSIT_RELEASE magnitude) + (DEPOSIT_CAPTURE magnitude)
      # Customer.deposit_held_cents = sum(DEPOSIT_HOLD) - sum(DEPOSIT_RELEASE magnitudes)
      #                               - sum(DEPOSIT_CAPTURE magnitudes) over the customer's ledger
      # Customer.balance_owed_cents = sum(FEE_CHARGE) - sum(FEE_WAIVE magnitudes) over the customer
    input_set: "All LedgerEntry rows for the customer; per-reservation subset for the conservation invariant"
    precision: "integer cents; no rounding (postings are exact)"
    variants:
      - name: clean_close
        when: "disposition CLEAN, no late fee"
        difference: "DEPOSIT_HOLD fully matched by DEPOSIT_RELEASE; DEPOSIT_CAPTURE == 0"
      - name: fee_close
        when: "disposition DAMAGED/LOST or late return"
        difference: "DEPOSIT_CAPTURE absorbs part/all of deposit; FEE_CHARGE posts any overflow beyond deposit"

  - name: party_posture
    trigger: "member reservation confirm/cancel; party lock/dissolve"
    algorithm: aggregation
    formula: |
      confirmed_member_count = count(Reservation r where
        r.party_order_id == PartyOrder.id AND
        r.status IN {CONFIRMED, PICKED_UP, RETURNED, OVERDUE, SETTLED})
      posture:
        if explicitly LOCKED  -> LOCKED   (sticky until dissolve)
        elif explicitly DISSOLVED -> DISSOLVED
        elif confirmed_member_count >= required_member_count -> READY
        else -> FORMING
    input_set: "Member Reservation rows of the party with status in the named set"
    precision: "n/a (count + threshold)"

  - name: recommended_size
    trigger: "POST /customers/{id}/measurement-profiles and PUT on profile"
    algorithm: threshold
    formula: |
      # Size chart on chest_cm (lower bound inclusive, upper exclusive):
      #   chest < 86        -> XS
      #   86 <= chest < 96  -> S
      #   96 <= chest < 106 -> M
      #   106 <= chest < 116-> L
      #   116 <= chest < 126-> XL
      #   chest >= 126      -> XXL
      recommended_size_code = bucket(chest_cm)
    input_set: "Single MeasurementProfile"
    constants:
      XS_MAX: 86
      S_MAX: 96
      M_MAX: 106
      L_MAX: 116
      XL_MAX: 126
    precision: "n/a (bucketing); boundaries are half-open [lower, upper)"

  - name: fit_verdict
    trigger: "POST /fit-checks"
    algorithm: threshold
    formula: |
      # Size ordinal: XS=0, S=1, M=2, L=3, XL=4, XXL=5
      delta = abs(ordinal(MeasurementProfile.recommended_size_code) - ordinal(Reservation.requested_size_code))
      if delta == 0  -> verdict = PASS              # measured size matches the requested garment
      elif delta == 1 -> verdict = NEEDS_ALTERATION  # adjacent size: tailoring can close the gap
      else            -> verdict = FAIL              # >= 2 sizes off: garment cannot be made to fit
    input_set: "Single FitCheck joining its Reservation and MeasurementProfile"
    constants:
      ORDINALS: "XS=0, S=1, M=2, L=3, XL=4, XXL=5"
    precision: "n/a (ordinal distance); delta == 1 is the NEEDS_ALTERATION boundary, delta == 2 is the FAIL boundary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7; entity_backed roles acting on owned resources must match ownership FK"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists (Catalog, GarmentUnit, Customer, MeasurementProfile, Reservation, Alteration, PartyOrder, Settlement, FitCheck), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enum values valid, integers >= declared minimums, email unique on customer create"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 5
    category: business_temporal
    check: "Reservation window coherence: pickup_window_start_iso <= return_window_end_iso AND pickup window ends on/before event_date_iso AND event_date_iso in the future relative to clock"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_referential
    check: "Linked PartyOrder is open for member confirmation (posture IN {FORMING, READY}) and member event_date matches party event_date"
    error_id: ERR_PARTY_NOT_OPEN
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm when party_order_id set"

  - priority: 8
    category: business_referential
    check: "PartyOrder is LOCKED — a CONFIRMED member reservation may not be cancelled while its party is LOCKED"
    error_id: ERR_PARTY_LOCKED
    http_status: 409
    applies_to: "POST /reservations/{id}/cancel"

  - priority: 9
    category: business_constraint
    check: "Customer rental-window conflict: confirming would give the SAME customer two non-terminal reservations whose rental windows [pickup_window_start_iso, return_window_end_iso) overlap (half-open interval, no buffer)"
    error_id: ERR_CUSTOMER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 10
    category: business_safety
    check: "Confirm requires an allocatable unit: a matching AVAILABLE grade-A/B GarmentUnit free by the pickup window start must exist; temporal overlap with the cleaning buffer of a prior return (closed interval inflated by Catalog.cleaning_buffer_days) is a conflict"
    error_id: ERR_NO_UNIT_AVAILABLE
    http_status: 409
    applies_to: "POST /reservations/{id}/confirm"

  - priority: 11
    category: business_safety
    check: "Pickup blocked unless the reservation has a clearing FitCheck (verdict PASS, or NEEDS_ALTERATION with a COMPLETED alteration); a FAIL fit never clears"
    error_id: ERR_FIT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /reservations/{id}/pickup"

  - priority: 12
    category: business_constraint
    check: "Pickup blocked while any Alteration for the reservation is still REQUESTED"
    error_id: ERR_ALTERATION_PENDING
    http_status: 409
    applies_to: "POST /reservations/{id}/pickup"

  - priority: 13
    category: business_fiscal
    check: "Pickup blocked while Customer.balance_owed_cents > 0 (outstanding fees must be cleared first)"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /reservations/{id}/pickup"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_party_order_version (when supplied/required) equals PartyOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reservations/{id}/confirm (party member), POST /party-orders/{id}/lock"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Catalog ---
  - method: POST
    path: "/catalogs"
    description: "Create a garment style/SKU"
    roles: [StoreManager]
    code: 201
    input: [style_name, category, daily_rate_cents, deposit_cents, replacement_value_cents, waiver_daily_rate_cents, cleaning_buffer_days, late_fee_daily_rate_cents]
    output: Catalog
    side_effects: ["status defaults applied; active_unit_count = 0"]
  - method: GET
    path: "/catalogs/{id}"
    description: "Get a catalog style"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Catalog
    side_effects: []
  - method: GET
    path: "/catalogs"
    description: "List catalog styles (paginated)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: Catalog[]
    side_effects: []

  # --- GarmentUnit ---
  - method: POST
    path: "/garment-units"
    description: "Add a physical unit to a catalog style"
    roles: [StoreManager]
    code: 201
    input: [catalog_id, size_code]
    output: GarmentUnit
    side_effects: ["status=AVAILABLE, condition_grade=GRADE_A, damage_strike_count=0; Catalog.active_unit_count recomputed"]
  - method: GET
    path: "/garment-units/{id}"
    description: "Get a garment unit"
    roles: [StoreManager, StoreClerk]
    code: 200
    input: []
    output: GarmentUnit
    side_effects: []
  - method: GET
    path: "/garment-units"
    description: "List/filter garment units (reverse-reachability for Catalog FK)"
    roles: [StoreManager, StoreClerk]
    code: 200
    input: ["catalog_id?", "status?", "size_code?", "limit?", "offset?"]
    output: GarmentUnit[]
    side_effects: []
  - method: POST
    path: "/garment-units/{id}/clear-cleaning"
    description: "Return a unit from IN_CLEANING to AVAILABLE once buffer elapsed"
    roles: [StoreClerk]
    code: 200
    input: []
    output: GarmentUnit
    side_effects: ["IN_CLEANING -> AVAILABLE (or RETIRED when strikes >= MAX_STRIKES)"]
  - method: POST
    path: "/garment-units/{id}/retire"
    description: "Retire a unit permanently"
    roles: [StoreManager]
    code: 200
    input: ["expected_garment_unit_version"]
    output: GarmentUnit
    side_effects: ["status -> RETIRED; Catalog.active_unit_count recomputed; increments GarmentUnit.version by 1"]

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [StoreClerk, Customer]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: ["deposit_held_cents=0, balance_owed_cents=0, open_strike_count=0"]
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (computed balances)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- MeasurementProfile ---
  - method: POST
    path: "/customers/{id}/measurement-profiles"
    description: "Create a measurement profile for a customer"
    roles: [StoreClerk, Customer]
    code: 201
    input: [chest_cm, waist_cm, inseam_cm]
    output: MeasurementProfile
    side_effects: ["recommended_size_code computed via recommended_size"]
  - method: GET
    path: "/customers/{id}/measurement-profiles"
    description: "List a customer's measurement profiles (reverse-reachability for Customer FK)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: MeasurementProfile[]
    side_effects: []
  - method: GET
    path: "/measurement-profiles/{id}"
    description: "Get a measurement profile"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: MeasurementProfile
    side_effects: []

  # --- Reservation ---
  - method: POST
    path: "/reservations"
    description: "Book a reservation by event date (PENDING)"
    roles: [StoreClerk, Customer]
    code: 201
    input: [customer_id, catalog_id, requested_size_code, event_date_iso, pickup_window_start_iso, return_window_end_iso, "party_order_id?", "damage_waiver_opted?"]
    output: Reservation
    side_effects: ["status=PENDING; window coherence validated"]
  - method: GET
    path: "/reservations/{id}"
    description: "Get a reservation"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/reservations"
    description: "List/filter reservations (reverse-reachability for Customer, Catalog, GarmentUnit, PartyOrder FKs)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["customer_id?", "catalog_id?", "garment_unit_id?", "party_order_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: POST
    path: "/reservations/{id}/confirm"
    description: "Allocate a unit and confirm the reservation"
    roles: [StoreClerk]
    code: 200
    input: ["expected_party_order_version?"]
    output: Reservation
    side_effects: ["unit_selection; garment_unit_id pinned; unit AVAILABLE->RESERVED; booking_quote computed; party_posture recomputed; PartyOrder.version += 1 when party-linked"]
  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a reservation"
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: Reservation
    side_effects: ["unit released RESERVED->AVAILABLE if allocated; REQUESTED alterations -> CANCELLED; party_posture recomputed; PartyOrder.version += 1 when party-linked"]
  - method: POST
    path: "/reservations/{id}/pickup"
    description: "Hand the garment to the customer"
    roles: [StoreClerk]
    code: 200
    input: []
    output: Reservation
    side_effects: ["unit RESERVED->OUT; DEPOSIT_HOLD posted; deposit_held_cents recomputed"]
  - method: POST
    path: "/reservations/{id}/return"
    description: "Record a return; creates Settlement and routes to RETURNED/OVERDUE->SETTLED"
    roles: [StoreClerk]
    code: 200
    input: [returned_at_iso, disposition]
    output: Settlement
    side_effects: ["Settlement created; settlement_charges computed; unit OUT->IN_CLEANING; deposit_conservation postings; unit downgrade/retire on DAMAGED/LOST; customer balances recomputed"]

  # --- Alteration ---
  - method: POST
    path: "/alterations"
    description: "Request an alteration on a confirmed reservation"
    roles: [StoreClerk, Customer]
    code: 201
    input: [reservation_id, kind, fee_cents]
    output: Alteration
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/alterations/{id}"
    description: "Get an alteration"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Alteration
    side_effects: []
  - method: GET
    path: "/alterations"
    description: "List/filter alterations (reverse-reachability for Reservation FK)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["reservation_id?", "status?", "limit?", "offset?"]
    output: Alteration[]
    side_effects: []
  - method: POST
    path: "/alterations/{id}/complete"
    description: "Mark alteration completed; charges the fee"
    roles: [StoreClerk]
    code: 200
    input: []
    output: Alteration
    side_effects: ["status -> COMPLETED; FEE_CHARGE posted; balance_owed_cents recomputed"]
  - method: POST
    path: "/alterations/{id}/cancel"
    description: "Cancel an alteration"
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: Alteration
    side_effects: ["status -> CANCELLED; no fee"]

  # --- FitCheck ---
  - method: POST
    path: "/fit-checks"
    description: "Record a fit check on a confirmed reservation; computes verdict"
    roles: [StoreClerk]
    code: 201
    input: [reservation_id, measurement_profile_id]
    output: FitCheck
    side_effects: ["verdict computed via fit_verdict from MeasurementProfile.recommended_size_code vs Reservation.requested_size_code"]
  - method: GET
    path: "/fit-checks/{id}"
    description: "Get a fit check"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: FitCheck
    side_effects: []
  - method: GET
    path: "/fit-checks"
    description: "List/filter fit checks (reverse-reachability for Reservation + MeasurementProfile FKs)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["reservation_id?", "measurement_profile_id?", "verdict?", "limit?", "offset?"]
    output: FitCheck[]
    side_effects: []

  # --- PartyOrder ---
  - method: POST
    path: "/party-orders"
    description: "Create a group/wedding-party coordination order"
    roles: [Customer, StoreClerk]
    code: 201
    input: [coordinator_customer_id, event_date_iso, required_member_count]
    output: PartyOrder
    side_effects: ["posture=FORMING; confirmed_member_count=0"]
  - method: GET
    path: "/party-orders/{id}"
    description: "Get a party order (computed posture/count)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: PartyOrder
    side_effects: []
  - method: GET
    path: "/party-orders"
    description: "List/filter party orders (reverse-reachability for Customer coordinator FK)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["coordinator_customer_id?", "posture?", "limit?", "offset?"]
    output: PartyOrder[]
    side_effects: []
  - method: POST
    path: "/party-orders/{id}/lock"
    description: "Coordinator locks the party once READY"
    roles: [Customer]
    code: 200
    input: ["expected_party_order_version"]
    output: PartyOrder
    side_effects: ["posture READY->LOCKED; members frozen against cancel; increments PartyOrder.version by 1"]
  - method: POST
    path: "/party-orders/{id}/dissolve"
    description: "Coordinator dissolves a FORMING party"
    roles: [Customer]
    code: 200
    input: []
    output: PartyOrder
    side_effects: ["posture FORMING->DISSOLVED; PENDING members -> CANCELLED; CONFIRMED members release units"]

  # --- Settlement ---
  - method: GET
    path: "/settlements/{id}"
    description: "Get a settlement (computed fee breakdown)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/settlements"
    description: "List/filter settlements (reverse-reachability for Reservation FK)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["reservation_id?", "disposition?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/settlements/{id}/finalize"
    description: "Finalize a RETURNED/OVERDUE reservation's settlement (closes the deposit hold; moves reservation to SETTLED)"
    roles: [StoreClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Reservation RETURNED/OVERDUE -> SETTLED; DEPOSIT_RELEASE posted for deposit_refund_cents; deposit_held_cents recomputed"]
  - method: POST
    path: "/settlements/{id}/waive-fee"
    description: "Manager waives part/all of a settlement's net fee (override)"
    roles: [StoreManager]
    code: 200
    input: [waive_amount_cents, expected_settlement_version]
    output: Settlement
    side_effects: ["FEE_WAIVE posted; net_charge_cents reduced; balance_owed_cents recomputed; increments Settlement.version by 1"]

  # --- LedgerEntry (read) ---
  - method: GET
    path: "/ledger-entries/{id}"
    description: "Get a single ledger posting"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/ledger-entries"
    description: "List ledger postings (reverse-reachability for Customer + Reservation FKs)"
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["customer_id?", "reservation_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock to a given UTC instant; runs the overdue + cleaning-buffer sweep"
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["PICKED_UP reservations past return_window_end -> OVERDUE (no settlement); IN_CLEANING units past available_from_iso -> AVAILABLE; sweep order Reservation.created_at ASC"]
  - method: POST
    path: "/_clock/set"
    description: "Set the system clock to a fixed UTC instant without running the sweep (test setup)"
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["clock set; no state transitions fired"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity_backed role acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, integer below minimum, or duplicate customer email" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Reservation window incoherent: pickup_start > return_end, pickup window ends after event_date, or event_date not in the future" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_NO_UNIT_AVAILABLE, http: 409, condition: "No matching AVAILABLE grade-A/B unit free by the pickup window start (size/condition/buffer conflict)" }
  - { id: ERR_CUSTOMER_WINDOW_CONFLICT, http: 409, condition: "Confirming would give the same customer two non-terminal reservations with overlapping rental windows" }
  - { id: ERR_PARTY_NOT_OPEN, http: 409, condition: "Linked PartyOrder posture not in {FORMING, READY} or member event_date mismatch on confirm" }
  - { id: ERR_PARTY_LOCKED, http: 409, condition: "Cannot cancel a CONFIRMED member reservation whose PartyOrder is LOCKED" }
  - { id: ERR_NOT_COORDINATOR, http: 403, condition: "Acting customer is not the PartyOrder coordinator for lock/dissolve" }
  - { id: ERR_FIT_NOT_CLEARED, http: 409, condition: "Pickup blocked: no clearing FitCheck (PASS, or NEEDS_ALTERATION with a COMPLETED alteration); a FAIL fit never clears" }
  - { id: ERR_ALTERATION_PENDING, http: 409, condition: "Pickup blocked: a REQUESTED alteration remains on the reservation" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 409, condition: "Pickup blocked: Customer.balance_owed_cents > 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC mismatch)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "A renter; owns own reservations, measurement profiles, and party orders they coordinate."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /party-orders/{id}/lock — only the coordinator customer"
      - "POST /party-orders/{id}/dissolve — only the coordinator customer"
    shared_operations:
      - "POST /customers — self-register (also StoreClerk)"
      - "POST /customers/{id}/measurement-profiles — own profile (also StoreClerk)"
      - "POST /reservations — book own reservation (also StoreClerk)"
      - "POST /reservations/{id}/cancel — own reservation (also StoreClerk)"
      - "POST /alterations — request on own reservation (also StoreClerk)"
      - "POST /alterations/{id}/cancel — own alteration (also StoreClerk)"
      - "POST /party-orders — create (also StoreClerk)"
      - "GET reads on owned catalogs/reservations/profiles/parties/settlements/ledger"
  - name: StoreClerk
    description: "Shop-floor operator: confirms, picks up, returns, alters, clears cleaning; acts on any customer's resources."
    identity: "opaque"
    exclusive_operations:
      - "POST /reservations/{id}/confirm — allocate unit"
      - "POST /reservations/{id}/pickup"
      - "POST /reservations/{id}/return"
      - "POST /fit-checks — record fit check"
      - "POST /alterations/{id}/complete"
      - "POST /garment-units/{id}/clear-cleaning"
      - "POST /settlements/{id}/finalize"
    shared_operations:
      - "POST /customers, POST /customers/{id}/measurement-profiles, POST /reservations, POST /reservations/{id}/cancel, POST /alterations, POST /alterations/{id}/cancel, POST /party-orders — shared with Customer"
      - "GET reads — shared with all roles"
  - name: StoreManager
    description: "Inventory and financial authority: catalog setup, unit creation/retirement, fee waivers, system clock control."
    identity: "opaque"
    exclusive_operations:
      - "POST /catalogs"
      - "POST /garment-units"
      - "POST /garment-units/{id}/retire"
      - "POST /settlements/{id}/waive-fee"
      - "POST /_clock/advance"
      - "POST /_clock/set"
    shared_operations:
      - "GET reads — shared with all roles"
