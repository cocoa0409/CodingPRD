  # ===========================================================================
  # Rule 3 - Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: cycle_ready_reverts_to_loading_then_forward_again
        grounds:
          - state_machines.Cycle.READY_to_LOADING
          - state_machines.Cycle.LOADING_to_READY
          - concurrency_rules[load-position-create-stale-cycle]
          - entities.LoadPosition.fields.cycle_version_after
        distinguishing_aspect: |
          Cycle carries a genuine A->B->A loop: a READY cycle that receives a new
          LoadPosition drops back to LOADING (not forward, not terminal), the
          density is recomputed, and a second readiness sign-off returns it to
          READY - so the same state is occupied twice in one cycle's history.
        test_recipe:
          setup:
            - "One GAMMA chamber with pallet_capacity 8, one approved recipe RG with band [0.1000, 0.1060) requiring one MIN_DOSE and one ROUTINE dosimeter."
            - "One lot of P1 with total_pallet_count 4, two pallets already placed in position 1 of a cycle that has passed its first readiness sign-off and sits in READY with load_density_g_per_cm3 0.1000."
