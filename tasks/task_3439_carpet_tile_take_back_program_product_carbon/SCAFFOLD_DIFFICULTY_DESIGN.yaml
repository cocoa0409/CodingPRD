# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3439_carpet_tile_take_back_program_product_carbon
# 9 Difficulty Rules x >=2 instances; every recipe drives empty-DB -> target
# state using only §1.5 endpoints. Numeric asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pcf_operational_vs_lifecycle_diverge
        grounds:
          - calculations.pcf_footprint
          - calculations.batch_embodied_carbon
          - entities.PCFReport.fields.operational_kgco2e_per_m2
          - entities.PCFReport.fields.lifecycle_kgco2e_per_m2
        distinguishing_aspect: "One report submission on one fixed input set yields operational 5.950 and lifecycle 6.090 kgCO2e/m2 — two valid algorithms over the SAME carbon-accounting domain data producing different stored values, diverging by exactly transport 0.350 minus recovery-scaled end-of-life credit 0.210."
        test_recipe:
          setup:
            - "Collection CIR (CRADLE_TO_GRAVE, claim_intent NONE) with two RELEASED batches: DL-100 (100 m2, intensity 1.2, mix 200 kg fishing-net @0.50 + 200 kg virgin @2.10 -> embodied 6.400) and DL-101 (300 m2, intensity 0.8, mix 600 kg post-consumer @0.40 + 600 kg virgin @2.10 -> embodied 5.800)."
            - "One CREDITED take-back for the collection: collected 160 kg (recovered 40.00 m2), credited_at 2026-09-12 inside the report period [2026-09-01, 2026-10-01)."
            - "recovery_share = 40/400 = 0.1; eol_credit = round(2.10*0.1,4) = 0.2100."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_col_grave_none
              call: "POST /carpetloop/collections"
              payload: { name: "Cirrus", pattern_code: "CIR", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GRAVE", claim_intent: "NONE" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, col_v: $.data.version }
            - &k_lot_net200
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "RECLAIMED_FISHING_NET", quantity_kg: 200, carbon_factor_kgco2e_per_kg: 0.50 }
              as: PlatformAdmin
              captures: { lot1: $.data.id }
            - &k_lot_vir200
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "POLYCO", source_type: "VIRGIN", quantity_kg: 200, carbon_factor_kgco2e_per_kg: 2.10 }
              as: PlatformAdmin
              captures: { lot2: $.data.id }
            - &k_qc_lot1
              call: "POST /carpetloop/feedstock-lots/${lot1}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - &k_qc_lot2
              call: "POST /carpetloop/feedstock-lots/${lot2}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - &k_batch_b1
              call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-100", production_date: "2026-09-05T00:00:00Z", produced_m2: 100, mfg_intensity_kgco2e_per_m2: 1.2, delta_e: 0.4 }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - &k_alloc1
              call: "POST /carpetloop/feedstock-lots/${lot1}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 200 }
              as: SustainabilityManager
            - &k_alloc2
              call: "POST /carpetloop/feedstock-lots/${lot2}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 200 }
              as: SustainabilityManager
            - &k_rel_b1
              call: "POST /carpetloop/batches/${b1}/release"
              payload: {}
              as: PlatformAdmin
            - &k_lot_pct600
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "POST_CONSUMER_TILE", quantity_kg: 600, carbon_factor_kgco2e_per_kg: 0.40 }
              as: PlatformAdmin
              captures: { lot3: $.data.id }
            - &k_lot_vir600
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "POLYCO", source_type: "VIRGIN", quantity_kg: 600, carbon_factor_kgco2e_per_kg: 2.10 }
              as: PlatformAdmin
              captures: { lot4: $.data.id }
            - &k_qc_lot3
              call: "POST /carpetloop/feedstock-lots/${lot3}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - &k_qc_lot4
              call: "POST /carpetloop/feedstock-lots/${lot4}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - &k_batch_b2
              call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-101", production_date: "2026-09-10T00:00:00Z", produced_m2: 300, mfg_intensity_kgco2e_per_m2: 0.8, delta_e: 0.9 }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - &k_alloc3
              call: "POST /carpetloop/feedstock-lots/${lot3}/allocate"
              payload: { batch_id: "${b2}", quantity_kg: 600 }
              as: SustainabilityManager
            - &k_alloc4
              call: "POST /carpetloop/feedstock-lots/${lot4}/allocate"
              payload: { batch_id: "${b2}", quantity_kg: 600 }
              as: SustainabilityManager
            - &k_rel_b2
              call: "POST /carpetloop/batches/${b2}/release"
              payload: {}
              as: PlatformAdmin
            - &k_site1
              call: "POST /carpetloop/sites"
              payload: { contractor_name: "inst-bob", address: "1 Harbor Way", install_window_start: "2026-09-02T00:00:00Z", install_window_end: "2026-09-03T00:00:00Z", installation_system: "CONVENTIONAL", adhesive_free_certified: false, cert_expires_on: "2027-01-01T00:00:00Z", annual_replacement_budget_cents: 1000000 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { site1: $.data.id }
            - &k_install1
              call: "POST /carpetloop/sites/${site1}/install"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
            - &k_zone0
              call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-0", area_m2: 10 }
              as: Installer
              as_user_id: "inst-bob"
            - &k_tb1
              call: "POST /carpetloop/take-back-requests"
              payload: { site_id: "${site1}", collection_id: "${col_id}", condition_grade: "B", declared_area_m2: 40 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { tb1: $.data.id }
            - &k_sched1
              call: "POST /carpetloop/take-back-requests/${tb1}/schedule"
              payload: { pickup_window_start: "2026-09-12T00:00:00Z", pickup_window_end: "2026-09-13T00:00:00Z" }
              as: Installer
              as_user_id: "inst-bob"
            - &k_clock_sep12
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T06:00:00Z" }
              as: PlatformAdmin
            - &k_collect1
              call: "POST /carpetloop/take-back-requests/${tb1}/collect"
              payload: { collected_kg: 160 }
              as: Installer
              as_user_id: "inst-bob"
            - &k_sort1
              call: "POST /carpetloop/take-back-requests/${tb1}/sort"
              payload: { reuse_kg: 40, depolymerize_kg: 80, downcycle_kg: 40, landfill_kg: 0 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &k_rep1
              call: "POST /carpetloop/pcf-reports"
              payload: { collection_id: "${col_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", boundary: "CRADLE_TO_GRAVE", expected_collection_version: "${col_v}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { rep1: $.data.id }
          trigger:
            - &k_submit1
              call: "POST /carpetloop/pcf-reports/${rep1}/submit"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
          assert:
            - "PCFReport.${rep1}.status == SUBMITTED"
            - "PCFReport.${rep1}.operational_kgco2e_per_m2 == 5.950  (=(6.400*100 + 5.800*300)/400 at stored 3dp batch values)"
            - "PCFReport.${rep1}.lifecycle_kgco2e_per_m2 == 6.090  (= 5.950 + 0.350 - 0.2100, recovery_share 0.1)"
            - "both variant values are stored on the same report from one submission over one identical input set"
            - "PCFReport.${rep1}.submitted_by == \"sm-carol\""

      - name: takeback_credit_standard_vs_circular
        grounds:
          - calculations.takeback_credit
          - entities.TakeBackRequest.fields.credit_variant
          - entities.TakeBackRequest.fields.credit_cents
          - entities.ProductCollection.fields.claim_intent
        distinguishing_aspect: "The second dual-variant calculation lives in the customer-credit domain (not carbon accounting): identical collected mass, grade and pathway masses yield credit_cents 6000 under STANDARD (collection claim_intent NONE) versus 8400 under CIRCULAR (claim_intent CARBON_NEUTRAL), with credit_variant recording which algorithm ran."
        test_recipe:
          setup:
            - "Collection CIR (claim_intent NONE) with INSTALLED site S-A; collection LOP (claim_intent CARBON_NEUTRAL) with INSTALLED site S-B (different contractor so no window interaction)."
            - "Both take-backs declared with grade B and collected at 160 kg, sorted reuse 40 / depolymerize 80 / downcycle 40 / landfill 0 — byte-identical economic inputs."
            - "STANDARD: recovered 40.00 m2 x 150 = 6000. CIRCULAR: bonus raw 2880 capped to 2400 (40% of 6000) -> 8400."
          setup_api_calls:
            - *k_clock
            - *k_col_grave_none
            - *k_site1
            - *k_install1
            - *k_tb1
            - *k_sched1
            - &k_col_grave_neutral
              call: "POST /carpetloop/collections"
              payload: { name: "Looplet", pattern_code: "LOP", backing_type: "ADHESIVE_FREE_CAPABLE", lifecycle_boundary: "CRADLE_TO_GRAVE", claim_intent: "CARBON_NEUTRAL" }
              as: PlatformAdmin
              captures: { colB: $.data.id, colB_v: $.data.version }
            - &k_siteB
              call: "POST /carpetloop/sites"
              payload: { contractor_name: "inst-cory", address: "9 Meadow Ln", install_window_start: "2026-09-02T00:00:00Z", install_window_end: "2026-09-03T00:00:00Z", installation_system: "ADHESIVE_FREE", adhesive_free_certified: true, cert_expires_on: "2027-01-01T00:00:00Z", annual_replacement_budget_cents: 1000000 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { siteB: $.data.id }
            - call: "POST /carpetloop/sites/${siteB}/install"
              payload: {}
              as: Installer
              as_user_id: "inst-cory"
            - call: "POST /carpetloop/take-back-requests"
              payload: { site_id: "${siteB}", collection_id: "${colB}", condition_grade: "B", declared_area_m2: 40 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { tbB: $.data.id }
            - call: "POST /carpetloop/take-back-requests/${tbB}/schedule"
              payload: { pickup_window_start: "2026-09-12T00:00:00Z", pickup_window_end: "2026-09-13T00:00:00Z" }
              as: Installer
              as_user_id: "inst-cory"
            - *k_clock_sep12
            - *k_collect1
            - call: "POST /carpetloop/take-back-requests/${tbB}/collect"
              payload: { collected_kg: 160 }
              as: Installer
              as_user_id: "inst-cory"
          trigger:
            - *k_sort1
            - call: "POST /carpetloop/take-back-requests/${tbB}/sort"
              payload: { reuse_kg: 40, depolymerize_kg: 80, downcycle_kg: 40, landfill_kg: 0 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
          assert:
            - "TakeBackRequest.${tb1}.credit_variant == STANDARD and credit_cents == 6000"
            - "TakeBackRequest.${tbB}.credit_variant == CIRCULAR and credit_cents == 8400"
            - "the 2400-cent delta is exactly the capped pathway bonus (raw 2880 = 40*30 + 80*18 + 40*6, capped at 0.40 * 6000)"
            - "both take-backs reach CREDITED with identical inputs; only the collection claim_intent differs"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: credit_pathway_bonus_cap_binds
        grounds:
          - calculations.takeback_credit
          - entities.TakeBackRequest.fields.condition_grade
        distinguishing_aspect: "Mode (a) combinatorial formula: >=3 inputs (mass, grade rate, pathway split, claim_intent) with non-linear interaction — grade-tiered base plus pathway bonus clamped by min() against the 40% cap; one sort binds the cap (credit 8400), another stays under it (credit 10690)."
        test_recipe:
          setup:
            - "Collection LOP (claim_intent CARBON_NEUTRAL) with one INSTALLED site."
            - "Take-back T1: grade B, 160 kg, sort 40/80/40/0 -> base 6000, bonus raw 2880, cap 2400 BINDS -> 8400."
            - "Take-back T2: grade A, 160 kg, sort 10/20/5/125 -> base 10000, bonus raw 690, cap 4000 not binding -> 10690."
          setup_api_calls:
            - *k_clock
            - *k_col_grave_neutral
            - *k_site1
            - *k_install1
            - call: "POST /carpetloop/take-back-requests"
              payload: { site_id: "${site1}", collection_id: "${colB}", condition_grade: "B", declared_area_m2: 40 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { tb1: $.data.id }
            - *k_sched1
            - call: "POST /carpetloop/take-back-requests"
              payload: { site_id: "${site1}", collection_id: "${colB}", condition_grade: "A", declared_area_m2: 40 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { tb2: $.data.id }
            - call: "POST /carpetloop/take-back-requests/${tb2}/schedule"
              payload: { pickup_window_start: "2026-09-12T00:00:00Z", pickup_window_end: "2026-09-13T00:00:00Z" }
              as: Installer
              as_user_id: "inst-bob"
            - *k_clock_sep12
            - *k_collect1
            - call: "POST /carpetloop/take-back-requests/${tb2}/collect"
              payload: { collected_kg: 160 }
              as: Installer
              as_user_id: "inst-bob"
          trigger:
            - *k_sort1
            - call: "POST /carpetloop/take-back-requests/${tb2}/sort"
              payload: { reuse_kg: 10, depolymerize_kg: 20, downcycle_kg: 5, landfill_kg: 125 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
          assert:
            - "TakeBackRequest.${tb1}.credit_cents == 8400 (cap bound: min(2400, 2880) applied)"
            - "TakeBackRequest.${tb2}.credit_cents == 10690 (cap slack: bonus 690 < 4000 passes through)"
            - "TakeBackRequest.${tb2}.credit_variant == CIRCULAR"
            - "a cascade-created FeedstockLot for ${tb2} exists with quantity_kg == 20 and source_type POST_CONSUMER_TILE (GET /carpetloop/feedstock-lots?origin_takeback_id=${tb2})"

      - name: pcf_per_batch_rounding_order_pinned
        grounds:
          - calculations.pcf_footprint
          - calculations.batch_embodied_carbon
          - entities.TileBatch.fields.embodied_carbon_kg_per_m2
        distinguishing_aspect: "Mode (b) nested rounding: the pinned order rounds each batch's embodied carbon to 3dp BEFORE the m2-weighted mean; recomputing at full precision and rounding only the final mean (the rejected order) yields 5.500 instead of the pinned 5.501 — a one-millidigit divergence the test pins exactly."
        test_recipe:
          setup:
            - "Collection RND (CRADLE_TO_GATE, claim_intent NONE)."
            - "Batch DL-200: 100 m2, intensity 1.0, mix 275.001 kg @0.50 + 124.999 kg @2.10 -> feedstock component 3.999984 -> 4dp 4.0000 -> stored embodied 5.000."
            - "Batch DL-201: 100 m2, intensity 1.0, mix 212.438 kg @0.50 + 187.562 kg @2.10 -> feedstock component 5.000992 -> 4dp 5.0010 -> stored embodied 6.001."
            - "Pinned report mean: (5.000*100 + 6.001*100)/200 = 5.5005 -> 3dp half-up 5.501. Full-precision variant: (4.999984 + 6.000992)/2 = 5.500488 -> 5.500."
          setup_api_calls:
            - *k_clock
            - &k_col_gate_none
              call: "POST /carpetloop/collections"
              payload: { name: "Roundel", pattern_code: "RND", backing_type: "STANDARD", lifecycle_boundary: "CRADLE_TO_GATE", claim_intent: "NONE" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, col_v: $.data.version }
            - &k_lot_net275
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "RECLAIMED_FISHING_NET", quantity_kg: 275.001, carbon_factor_kgco2e_per_kg: 0.50 }
              as: PlatformAdmin
              captures: { lot1: $.data.id }
            - &k_lot_vir125
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "POLYCO", source_type: "VIRGIN", quantity_kg: 124.999, carbon_factor_kgco2e_per_kg: 2.10 }
              as: PlatformAdmin
              captures: { lot2: $.data.id }
            - *k_qc_lot1
            - *k_qc_lot2
            - &k_batch_b200
              call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-200", production_date: "2026-09-06T00:00:00Z", produced_m2: 100, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.2 }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${lot1}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 275.001 }
              as: SustainabilityManager
            - call: "POST /carpetloop/feedstock-lots/${lot2}/allocate"
              payload: { batch_id: "${b1}", quantity_kg: 124.999 }
              as: SustainabilityManager
            - *k_rel_b1
            - &k_lot_net212
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "RECLAIMED_FISHING_NET", quantity_kg: 212.438, carbon_factor_kgco2e_per_kg: 0.50 }
              as: PlatformAdmin
              captures: { lot3: $.data.id }
            - &k_lot_vir187
              call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "POLYCO", source_type: "VIRGIN", quantity_kg: 187.562, carbon_factor_kgco2e_per_kg: 2.10 }
              as: PlatformAdmin
              captures: { lot4: $.data.id }
            - *k_qc_lot3
            - *k_qc_lot4
            - &k_batch_b201
              call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-201", production_date: "2026-09-07T00:00:00Z", produced_m2: 100, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.3 }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${lot3}/allocate"
              payload: { batch_id: "${b2}", quantity_kg: 212.438 }
              as: SustainabilityManager
            - call: "POST /carpetloop/feedstock-lots/${lot4}/allocate"
              payload: { batch_id: "${b2}", quantity_kg: 187.562 }
              as: SustainabilityManager
            - *k_rel_b2
            - call: "POST /carpetloop/pcf-reports"
              payload: { collection_id: "${col_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", boundary: "CRADLE_TO_GATE", expected_collection_version: "${col_v}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { rep1: $.data.id }
          trigger:
            - *k_submit1
          assert:
            - "TileBatch.${b1}.embodied_carbon_kg_per_m2 == 5.000 and TileBatch.${b2}.embodied_carbon_kg_per_m2 == 6.001 (stored 3dp values)"
            - "PCFReport.${rep1}.operational_kgco2e_per_m2 == 5.501 (pinned: stored 3dp batch values weighted; the full-precision order would give 5.500)"
            - "PCFReport.${rep1}.lifecycle_kgco2e_per_m2 == 5.851 (no credited take-backs: 5.501 + 0.350 - 0.0000)"

      - name: claim_offset_requirement_evaluation_order
        grounds:
          - calculations.claim_offset_requirement
          - entities.CarbonClaim.fields.required_offset_kgco2e
          - entities.CarbonClaim.fields.offset_coverage
          - state_machines.CarbonClaim.APPROVED_to_PUBLISHED
        distinguishing_aspect: "Mode (c) circular-looking dependency pinned by evaluation order: required_offset_kgco2e is fixed at submit from the report's stored lifecycle variant (6.090 x 1000 + 500 buffer = 6590.0); retiring offsets mutates retired_kgco2e and offset_coverage only — never required — and the publish gate reads coverage FULL exactly at retired == required (6590 passes, 6000 fails)."
        test_recipe:
          setup:
            - "Full F1 carbon chain: collection CIR (CRADLE_TO_GRAVE), batches DL-100/DL-101 released, one credited take-back (recovered 40 m2), report REP-1 submitted (operational 5.950, lifecycle 6.090), verified by a distinct verifier, and PUBLISHED."
            - "ManufacturingTarget T (baseline 8.0, reduction 0.25 -> target 6.0) with no readings, posture AT_RISK."
            - "Claim CL: CARBON_NEGATIVE, volume 1000 m2, boundary CRADLE_TO_GRAVE, target T; submitted -> required 6590.0."
            - "Offsets retired 6000 (PARTIAL) then 590 (FULL at exactly 6590)."
          setup_api_calls:
            - *k_clock
            - *k_col_grave_none
            - *k_lot_net200
            - *k_lot_vir200
            - *k_qc_lot1
            - *k_qc_lot2
            - *k_batch_b1
            - *k_alloc1
            - *k_alloc2
            - *k_rel_b1
            - *k_lot_pct600
            - *k_lot_vir600
            - *k_qc_lot3
            - *k_qc_lot4
            - *k_batch_b2
            - *k_alloc3
            - *k_alloc4
            - *k_rel_b2
            - *k_site1
            - *k_install1
            - *k_zone0
            - *k_tb1
            - *k_sched1
            - *k_clock_sep12
            - *k_collect1
            - *k_sort1
            - *k_rep1
            - *k_submit1
            - &k_assign1
              call: "POST /carpetloop/pcf-reports/${rep1}/verification"
              payload: { action: "ASSIGN", verifier_org: "EcoAssure" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &k_clear1
              call: "POST /carpetloop/pcf-reports/${rep1}/verification"
              payload: { action: "CLEAR" }
              as: Verifier
              as_user_id: "ver-dana"
            - &k_publish1
              call: "POST /carpetloop/pcf-reports/${rep1}/publish"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &k_tgt1
              call: "POST /carpetloop/manufacturing-targets"
              payload: { program_name: "OpsNet-30", baseline_intensity_kgco2e_per_m2: 8.0, target_reduction_pct: 0.25 }
              as: PlatformAdmin
              captures: { tgt1: $.data.id }
            - &k_claim_neg
              call: "POST /carpetloop/carbon-claims"
              payload: { collection_id: "${col_id}", report_id: "${rep1}", claim_type: "CARBON_NEGATIVE", claimed_volume_m2: 1000, boundary: "CRADLE_TO_GRAVE", manufacturing_target_id: "${tgt1}" }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { cl1: $.data.id }
            - &k_cl_submit
              call: "POST /carpetloop/carbon-claims/${cl1}/submit"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - &k_off6000
