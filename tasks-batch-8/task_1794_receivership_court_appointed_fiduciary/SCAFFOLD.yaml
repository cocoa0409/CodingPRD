# =============================================================================
# Scaffold: Receivership & Court-Appointed Fiduciary Administration
# =============================================================================

scenario: |
  Receivership & Court-Appointed Fiduciary Administration (court-appointed receiver):
  appointment order scope & authority limits, asset marshalling & inventory, ongoing
  business operation decisions & court approval, creditor/investor claim intake &
  priority determination, professional retention & fee application, periodic status
  report to court, distribution plan approval & payment, discharge & final accounting

domain_name: receivership-fiduciary
api_prefix: /v1

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation   # finite estate pool distributed by priority-class waterfall
  complexity_layers:
    - optimistic_concurrency              # OCC on Case.version for cash-debiting writes
    - cascading_side_effects              # plan approval -> case status -> payment generation
    - dual_variant_calculation            # estimated vs realized collateral; lodestar vs contingent fees
    - rate_threshold_triggers             # authority_limit_cents approval gate; wage-priority cap; fee cap

  entity_topology: flat                   # all resources top-level under /v1; FK references in bodies/filters
  state_machine_shape: cyclic             # claim reconsideration and plan reject->amend loops
  relationship_patterns:
    - one_to_many                         # Case -> Assets/Claims/Engagements/Reports/Plans
    - cross_aggregate                     # Claim.collateral_asset_id, AuthorizationRequest.related_asset_id, Payment -> Claim+Plan

  role_model: segregation_of_duties       # Receiver/Creditor file; only Court adjudicates (decide/void/reconsider/discharge)
  consistency_model: immediate            # all mutations visible in the same request's response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (9 entities, flat topology)
# =============================================================================
entities:
  - name: Case
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: case_number, type: string, source: input, description: "Court case number; unique per court_jurisdiction" }
      - { name: court_jurisdiction, type: string, source: input, description: "Court of appointment, e.g. 'S.D.N.Y.'" }
      - { name: debtor_name, type: string, source: input, description: "Name of the entity in receivership" }
      - { name: appointed_receiver_name, type: string, source: input, description: "Name of the court-appointed receiver" }
      - { name: appointment_effective_at, type: datetime, source: input, description: "Effective timestamp of the appointment order; anchors the reporting calendar" }
      - { name: authority_limit_cents, type: integer, source: input, description: "Receiver may liquidate/abandon an asset without court approval only when its estimated_value_cents is NOT greater than this limit (> limit requires approval; == limit does not)" }
      - { name: business_operation_authorized, type: boolean, source: input, description: "Whether the appointment order authorizes continued business operation" }
      - { name: bar_date, type: datetime, source: input, description: "Claims bar date; claims filed with filed_at <= bar_date are timely (inclusive), later filings are barred" }
      - { name: reporting_interval_days, type: integer, source: input, description: "Cadence in days for PERIODIC status reports" }
      - { name: operating_reserve_cents, type: integer, source: input, description: "Cash floor for posture derivation; cash_on_hand below this flips posture to CASH_CONSTRAINED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISTRIBUTING | DISCHARGED" }
      - { name: cash_on_hand_cents, type: integer, source: computed, description: "Liquidation proceeds minus paid fees, net paid distributions, and approved expenditure authorizations (calc estate_cash_position)" }
      - { name: marshalled_value_cents, type: integer, source: computed, description: "Sum over non-ABANDONED assets of (LIQUIDATED ? liquidation_value_cents : estimated_value_cents)" }
      - { name: allowed_claims_total_cents, type: integer, source: computed, description: "Sum of allowed_amount_cents over claims in ALLOWED status" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | CASH_CONSTRAINED; CASH_CONSTRAINED iff cash_on_hand_cents < operating_reserve_cents" }
      - { name: next_report_period_start, type: datetime, source: computed, description: "Max period_end over non-REJECTED PERIODIC reports, else appointment_effective_at" }
      - { name: report_overdue, type: boolean, source: computed, description: "true iff logical clock time > next_report_period_start + reporting_interval_days" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning receivership case" }
      - { name: description, type: string, source: input, description: "Asset description" }
      - { name: asset_class, type: enum, source: input, description: "REAL_PROPERTY | CASH | SECURITIES | RECEIVABLE | EQUIPMENT | OTHER" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Receiver's estimated value at marshalling; >= 0" }
      - { name: liquidation_value_cents, type: integer, source: system, description: "Realized proceeds; null until LIQUIDATED" }
      - { name: liquidated_at, type: datetime, source: system, description: "Logical-clock timestamp of liquidation; null until LIQUIDATED" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | LIQUIDATED | ABANDONED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning receivership case" }
      - { name: creditor_name, type: string, source: input, description: "Creditor or investor name" }
      - { name: creditor_type, type: enum, source: input, description: "SECURED | PRIORITY_TAX | PRIORITY_WAGE | GENERAL_UNSECURED | INVESTOR" }
      - { name: filed_amount_cents, type: integer, source: input, description: "Claimed amount; > 0" }
      - { name: collateral_asset_id, type: string, source: input, description: "FK -> Asset.id; required iff creditor_type == SECURED; asset must belong to the same case and not be ABANDONED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp at claim creation" }
      - { name: status, type: enum, source: system, description: "FILED | ALLOWED | DISALLOWED" }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Allowed total set only via the determine transition; 0 <= allowed <= filed_amount_cents; cleared to null on reconsider" }
      - { name: secured_allowed_cents, type: integer, source: computed, description: "Bucket of the allowed amount paid in the SECURED class (calc claim_priority_determination); null until determined" }
      - { name: priority_allowed_cents, type: integer, source: computed, description: "Bucket paid in the PRIORITY class; null until determined" }
      - { name: general_allowed_cents, type: integer, source: computed, description: "Bucket paid in the GENERAL class (secured deficiency / wage-cap excess / plain general); null until determined" }
      - { name: investor_allowed_cents, type: integer, source: computed, description: "Bucket paid in the INVESTOR class; null until determined" }
      - { name: determined_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest determination; null when status == FILED" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning receivership case" }
      - { name: professional_name, type: string, source: input, description: "Lead professional name" }
      - { name: firm_name, type: string, source: input, description: "Firm name" }
      - { name: role_type, type: enum, source: input, description: "COUNSEL | ACCOUNTANT | AUCTIONEER | BROKER; at most one engagement in PROPOSED or APPROVED status per (case_id, role_type)" }
      - { name: fee_arrangement, type: enum, source: input, description: "HOURLY | CONTINGENT" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Default hourly rate; required iff fee_arrangement == HOURLY, forbidden otherwise" }
      - { name: contingency_pct, type: number, source: input, description: "Fraction of recovery charged (e.g. 0.10); required iff fee_arrangement == CONTINGENT, forbidden otherwise" }
      - { name: fee_cap_cents, type: integer, source: input, description: "Court-approved not-to-exceed budget for this engagement; > 0" }
      - { name: total_fees_paid_cents, type: integer, source: computed, description: "Sum of approved_amount_cents over this engagement's PAID fee applications" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | DENIED | EXHAUSTED | CLOSED" }

  - name: FeeApplication
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; the retained professional applying for fees" }
      - { name: period_start, type: datetime, source: input, description: "Fee period start (inclusive); must be < period_end" }
      - { name: period_end, type: datetime, source: input, description: "Fee period end (exclusive); half-open [period_start, period_end) intervals of non-DENIED applications on the same engagement must not overlap; gaps and adjacency are permitted" }
      - { name: time_entries, type: array, source: input, description: "Array of {hours: number, rate_cents: integer}; required and non-empty iff engagement.fee_arrangement == HOURLY; must be absent or empty for CONTINGENT" }
      - { name: expenses_cents, type: integer, source: input, description: "Expense reimbursement sought; >= 0" }
      - { name: recovery_basis_cents, type: integer, source: input, description: "Recovery amount the contingency percentage applies to; required iff CONTINGENT, forbidden for HOURLY" }
      - { name: requested_amount_cents, type: integer, source: computed, description: "Computed at creation by fee_request_calculation" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Set by the court via decide(APPROVE); must satisfy approved <= requested; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "FILED | APPROVED | PAID | DENIED" }

  - name: AuthorizationRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning receivership case" }
      - { name: request_type, type: enum, source: input, description: "EXPENDITURE | ASSET_LIQUIDATION | ASSET_ABANDONMENT | BUSINESS_DECISION" }
      - { name: description, type: string, source: input, description: "Narrative of the action sought" }
      - { name: amount_cents, type: integer, source: input, description: "Amount at issue; for EXPENDITURE this debits cash on APPROVE; > 0" }
      - { name: related_asset_id, type: string, source: input, description: "FK -> Asset.id; required iff request_type is ASSET_LIQUIDATION or ASSET_ABANDONMENT; forbidden otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the court decision; null until decided" }

  - name: StatusReport
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning receivership case" }
      - { name: report_type, type: enum, source: input, description: "PERIODIC | FINAL; FINAL creatable only while the case is DISTRIBUTING" }
      - { name: period_start, type: datetime, source: input, description: "Covered-period start (inclusive); must equal the case's next_report_period_start (contiguity — gaps rejected)" }
      - { name: period_end, type: datetime, source: input, description: "Covered-period end (exclusive); must be > period_start; half-open period must not overlap any other non-REJECTED report of the same case" }
      - { name: narrative, type: string, source: input, description: "Free-text report body" }
      - { name: status, type: enum, source: system, description: "FILED | ACCEPTED | REJECTED" }

  - name: DistributionPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; owning receivership case; at most one plan in FILED or APPROVED status per case" }
      - { name: reserve_cents, type: integer, source: input, description: "Court reserve withheld from the distribution pool; >= 0 and <= cash_on_hand at filing" }
      - { name: pool_snapshot_cents, type: integer, source: computed, description: "Provisional pool pinned at filing: cash_on_hand_cents - reserve_cents at that moment" }
      - { name: status, type: enum, source: system, description: "FILED | APPROVED | EXECUTED | REJECTED | WITHDRAWN" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock timestamp of approval; null until APPROVED" }

  - name: DistributionPayment
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> DistributionPlan.id; set at generation time on plan approval" }
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the claim this payment satisfies" }
      - { name: priority_class, type: enum, source: system, description: "SECURED | PRIORITY | GENERAL | INVESTOR — the bucket this payment draws from (rank order 1..4)" }
      - { name: scheduled_amount_cents, type: integer, source: system, description: "Amount computed by the final distribution_waterfall at plan approval; > 0" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Amount disbursed; equals scheduled_amount_cents on pay; null until PAID; a voided payment keeps paid_amount_cents for audit while cash is credited back" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment; null until PAID" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PAID | VOIDED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: ACTIVE
    terminal_states: [DISCHARGED]
    transitions:
      - from: ACTIVE
        to: DISTRIBUTING
        trigger: "system — fires when a DistributionPlan of this case transitions FILED -> APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "Case.status := DISTRIBUTING"
          - "On entry to DISTRIBUTING, the APPROVED plan's final waterfall schedule materializes: one DistributionPayment row (status SCHEDULED) is created per (claim, class bucket) with computed amount > 0, per distribution_waterfall final variant"
        note: "Cascade link B->C of rule transitive_cascade instance plan_approval_case_to_payment_generation"

      - from: DISTRIBUTING
        to: DISCHARGED
        trigger: "POST /v1/cases/{id}/discharge"
        actor: Court
        preconditions:
          - "Some plan of this case is EXECUTED (else ERR_DISCHARGE_BLOCKED)"
          - "No claim of this case is FILED (else ERR_DISCHARGE_BLOCKED)"
          - "No fee application of any engagement of this case is FILED or APPROVED (else ERR_DISCHARGE_BLOCKED)"
          - "A FINAL status report of this case is ACCEPTED (else ERR_DISCHARGE_BLOCKED)"
          - "No asset of this case is IDENTIFIED (else ERR_DISCHARGE_BLOCKED)"
          - "cash_on_hand_cents == 0 (else ERR_DISCHARGE_BLOCKED)"
        side_effects:
          - "Every engagement of this case in APPROVED or EXHAUSTED status -> CLOSED"

  - entity: Asset
    initial_state: IDENTIFIED
    terminal_states: [LIQUIDATED, ABANDONED]
    transitions:
      - from: IDENTIFIED
        to: LIQUIDATED
        trigger: "POST /v1/assets/{id}/liquidate"
        actor: Receiver
        preconditions:
          - "Case of this asset is ACTIVE (ERR_CASE_NOT_ACTIVE)"
          - "If estimated_value_cents > case.authority_limit_cents: authorization_id must be present and reference an APPROVED AuthorizationRequest of this case with request_type == ASSET_LIQUIDATION and related_asset_id == this asset (absent -> ERR_AUTHORIZATION_REQUIRED; present but wrong state/type/asset -> ERR_AUTHORIZATION_MISMATCH)"
          - "If estimated_value_cents <= case.authority_limit_cents: no authorization required"
        side_effects:
          - "liquidation_value_cents := input; liquidated_at := logical clock"
          - "Case.cash_on_hand_cents += liquidation_value_cents; Case.marshalled_value_cents recomputed; Case.posture recomputed; Case.version incremented"

      - from: IDENTIFIED
        to: ABANDONED
        trigger: "POST /v1/assets/{id}/abandon"
        actor: Receiver
        preconditions:
          - "Case of this asset is ACTIVE (ERR_CASE_NOT_ACTIVE)"
          - "Same authority-limit gate as liquidate, with request_type == ASSET_ABANDONMENT"
        side_effects:
          - "Case.marshalled_value_cents recomputed (asset now excluded)"
          - "SECURED claims referencing this asset as collateral are NOT modified; at their determination, an ABANDONED collateral asset contributes collateral value 0 (calc claim_priority_determination)"

  - entity: Claim
    initial_state: FILED
    terminal_states: []   # cyclic: ALLOWED/DISALLOWED loop back to FILED on reconsideration; the enclosing Case discharge freezes the cycle
    transitions:
      - from: FILED
        to: ALLOWED
        trigger: "POST /v1/claims/{id}/determine (determination=ALLOWED)"
        actor: Receiver
        preconditions:
          - "Case of this claim is ACTIVE or DISTRIBUTING (ERR_CASE_NOT_ACTIVE)"
          - "allowed_amount_cents present (ERR_INVALID_REQUEST) and <= filed_amount_cents (ERR_ALLOWED_EXCEEDS_FILED)"
        side_effects:
          - "Class buckets computed per claim_priority_determination (collateral basis: LIQUIDATED asset -> liquidation_value_cents; IDENTIFIED -> estimated_value_cents; ABANDONED -> 0)"
          - "determined_at := logical clock"
          - "Case.allowed_claims_total_cents recomputed"
          - "If the case's allowed_claims_total_cents changed and a DistributionPlan of the case is FILED, that plan -> WITHDRAWN (its premise — the determined claim totals — is stale)"

      - from: FILED
        to: DISALLOWED
        trigger: "POST /v1/claims/{id}/determine (determination=DISALLOWED)"
        actor: Receiver
        preconditions:
          - "Case of this claim is ACTIVE or DISTRIBUTING (ERR_CASE_NOT_ACTIVE)"
        side_effects:
          - "allowed_amount_cents := null; all four class buckets := null; determined_at := logical clock"

      - from: ALLOWED
        to: FILED
        trigger: "POST /v1/claims/{id}/reconsider"
        actor: Court
        preconditions:
          - "Case of this claim is ACTIVE or DISTRIBUTING (ERR_CASE_NOT_ACTIVE)"
        side_effects:
          - "allowed_amount_cents and all four class buckets := null; determined_at := null"
          - "Case.allowed_claims_total_cents recomputed (decreases by the cleared allowed amount)"
          - "If a DistributionPlan of the case is FILED, that plan -> WITHDRAWN"
          - "Every DistributionPayment of this claim in SCHEDULED status -> CANCELLED; scheduled funds remain as case cash (no cash movement, since SCHEDULED payments never debited cash)"

      - from: DISALLOWED
        to: FILED
        trigger: "POST /v1/claims/{id}/reconsider"
        actor: Court
        preconditions:
          - "Case of this claim is ACTIVE or DISTRIBUTING (ERR_CASE_NOT_ACTIVE)"
        side_effects:
          - "determined_at := null"

  - entity: Engagement
    initial_state: PROPOSED
    terminal_states: [DENIED, EXHAUSTED, CLOSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /v1/engagements/{id}/decide (decision=APPROVE)"
        actor: Court
        preconditions:
          - "Case of this engagement is ACTIVE or DISTRIBUTING (ERR_CASE_NOT_ACTIVE)"
        side_effects: []

      - from: PROPOSED
        to: DENIED
        trigger: "POST /v1/engagements/{id}/decide (decision=REJECT)"
        actor: Court
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EXHAUSTED
        trigger: "system — fires when total_fees_paid_cents >= fee_cap_cents becomes true after a fee-application payment"
        actor: system
        preconditions: []
        side_effects:
          - "EXHAUSTED engagements reject new fee applications with ERR_ENGAGEMENT_NOT_APPROVED (status is no longer APPROVED)"

      - from: APPROVED
        to: CLOSED
        trigger: "system — fires when the owning case is DISCHARGED"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXHAUSTED
        to: CLOSED
        trigger: "system — fires when the owning case is DISCHARGED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FeeApplication
    initial_state: FILED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /v1/fee-applications/{id}/decide (decision=APPROVE)"
        actor: Court
        preconditions:
          - "approved_amount_cents present (ERR_INVALID_REQUEST)"
          - "approved_amount_cents <= requested_amount_cents (ERR_AMOUNT_EXCEEDS_REQUEST)"
          - "Sum of approved_amount_cents over this engagement's APPROVED-or-PAID applications plus this approved_amount_cents <= engagement.fee_cap_cents (ERR_FEE_CAP_EXCEEDED; equality permitted)"
        side_effects:
          - "approved_amount_cents := input"

      - from: FILED
        to: DENIED
        trigger: "POST /v1/fee-applications/{id}/decide (decision=REJECT)"
        actor: Court
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: "POST /v1/fee-applications/{id}/pay"
        actor: Receiver
        preconditions:
          - "expected_case_version == case.version (ERR_STALE_CASE_VERSION)"
          - "Case of this application is ACTIVE or DISTRIBUTING (ERR_CASE_NOT_ACTIVE)"
          - "Case.cash_on_hand_cents >= approved_amount_cents (ERR_INSUFFICIENT_ESTATE_FUNDS)"
        side_effects:
          - "Case.cash_on_hand_cents -= approved_amount_cents; Case.version incremented; Case.posture recomputed"
          - "Engagement.total_fees_paid_cents recomputed; if total_fees_paid_cents >= fee_cap_cents, engagement -> EXHAUSTED"

  - entity: AuthorizationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/authorization-requests/{id}/decide (decision=APPROVE)"
        actor: Court
        preconditions:
          - "If request_type == EXPENDITURE: case.cash_on_hand_cents >= amount_cents (ERR_INSUFFICIENT_ESTATE_FUNDS)"
        side_effects:
          - "decided_at := logical clock"
          - "If request_type == EXPENDITURE: Case.cash_on_hand_cents -= amount_cents; Case.version incremented; Case.posture recomputed"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /v1/authorization-requests/{id}/decide (decision=REJECT)"
        actor: Court
        preconditions: []
        side_effects:
          - "decided_at := logical clock"

  - entity: StatusReport
    initial_state: FILED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /v1/status-reports/{id}/decide (decision=APPROVE)"
        actor: Court
        preconditions: []
        side_effects:
          - "Case.next_report_period_start and Case.report_overdue recompute (an ACCEPTED report advances the reporting calendar)"

      - from: FILED
        to: REJECTED
        trigger: "POST /v1/status-reports/{id}/decide (decision=REJECT)"
        actor: Court
        preconditions: []
        side_effects:
          - "REJECTED reports do not advance the reporting calendar and do not participate in overlap/contiguity checks; the receiver files a corrected NEW report"

  - entity: DistributionPlan
    initial_state: FILED
    terminal_states: [EXECUTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /v1/distribution-plans/{id}/decide (decision=APPROVE)"
        actor: Court
        preconditions: []
        side_effects:
          - "Final waterfall recomputed at approval time over claims currently ALLOWED (final variant of distribution_waterfall; may differ from the filing-time pool_snapshot if cash changed since filing)"
          - "approved_at := logical clock"
          - "Case of this plan: ACTIVE -> DISTRIBUTING (link A->B of cascade plan_approval_case_to_payment_generation)"
          - "On the case's entry to DISTRIBUTING, payment rows are generated (link B->C): one DistributionPayment (SCHEDULED) per (claim, class bucket) with amount > 0"

      - from: FILED
        to: REJECTED
        trigger: "POST /v1/distribution-plans/{id}/decide (decision=REJECT)"
        actor: Court
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: FILED
        trigger: "POST /v1/distribution-plans/{id}/amend"
        actor: Receiver
        preconditions:
          - "Re-runs all creation validations for the plan's case: case ACTIVE (ERR_CASE_NOT_ACTIVE), no overdue report (ERR_STATUS_REPORT_OVERDUE), all claims determined (ERR_UNDETERMINED_CLAIMS), no other plan FILED or APPROVED (ERR_PLAN_ALREADY_OPEN), reserve_cents (new value if provided, else existing) <= cash_on_hand (ERR_RESERVE_EXCEEDS_POOL)"
        side_effects:
          - "reserve_cents := amended value when provided"
          - "pool_snapshot_cents re-pinned from current cash"

      - from: FILED
        to: WITHDRAWN
        trigger: "system — fires when the case's allowed_claims_total_cents changes (claim determination or reconsideration) while this plan is FILED"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EXECUTED
        trigger: "system — fires when no DistributionPayment of this plan remains in SCHEDULED status (all PAID, VOIDED, or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DistributionPayment
    initial_state: SCHEDULED   # rows are system-generated on plan approval; no direct creation endpoint
    terminal_states: [PAID, VOIDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /v1/distribution-payments/{id}/pay"
        actor: Receiver
        preconditions:
          - "expected_case_version == case.version (ERR_STALE_CASE_VERSION)"
          - "No other payment of the same plan with a strictly lower priority_class rank (SECURED=1 < PRIORITY=2 < GENERAL=3 < INVESTOR=4) is in SCHEDULED status (ERR_SENIOR_CLASS_UNPAID); payments of the same class may be paid in any order"
          - "Case.cash_on_hand_cents >= scheduled_amount_cents (ERR_INSUFFICIENT_ESTATE_FUNDS)"
        side_effects:
          - "paid_amount_cents := scheduled_amount_cents; paid_at := logical clock"
          - "Case.cash_on_hand_cents -= scheduled_amount_cents; Case.version incremented; Case.posture recomputed"
          - "If no SCHEDULED payments remain on the plan, plan -> EXECUTED (bubble-up)"

      - from: PAID
        to: VOIDED
        trigger: "POST /v1/distribution-payments/{id}/void"
        actor: Court
        preconditions:
          - "The payment's plan is APPROVED (not EXECUTED) (ERR_PLAN_NOT_EXECUTING)"
        side_effects:
          - "Case.cash_on_hand_cents += paid_amount_cents; Case.version incremented; Case.posture recomputed (compensating action for pay)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — fires when the payment's claim is reconsidered (ALLOWED -> FILED)"
        actor: system
        preconditions: []
        side_effects:
          - "No cash movement (SCHEDULED never debited cash); cancelled amounts remain available in the estate"
          - "If no SCHEDULED payments remain on the plan, plan -> EXECUTED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on Case.version; serial-observable only)
# =============================================================================
concurrency_rules:
  - rule_id: fee-pay-stale-case
    parent_entity: Case
    write_endpoint: "POST /v1/fee-applications/{id}/pay"
    occ_field: expected_case_version
    description: |
      Paying a fee application against a Case whose version has advanced since
      the client last read it is rejected: the cash balance the client relied on
      to decide the estate could fund the payment is stale (e.g., another cash-
      debiting write has since landed). Expressed purely as a stale-version check
      on Case.version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: payment-pay-stale-case
    parent_entity: Case
    write_endpoint: "POST /v1/distribution-payments/{id}/pay"
    occ_field: expected_case_version
    description: |
      Paying a distribution payment against a Case whose version has advanced
      since the client last read it is rejected: the pool position the receiver
      relied on is stale (e.g., a fee payment or expenditure approval has since
      debited the estate). Expressed purely as a stale-version check on
      Case.version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_priority_determination
    trigger: "Claim FILED -> ALLOWED (determine with determination=ALLOWED); re-derived from current values on any later determination after a reconsider cycle"
    algorithm: threshold
    formula: |
      Inputs: creditor_type, allowed_amount_cents, collateral asset state/value.
      SECURED:
        collateral_basis = 0 if collateral asset ABANDONED
                         = collateral.liquidation_value_cents if LIQUIDATED (realized variant)
                         = collateral.estimated_value_cents if IDENTIFIED (estimated variant)
        secured_allowed_cents   = min(allowed_amount_cents, collateral_basis)
        general_allowed_cents   = allowed_amount_cents - secured_allowed_cents
        priority_allowed_cents  = 0; investor_allowed_cents = 0
      PRIORITY_WAGE:
        priority_allowed_cents  = min(allowed_amount_cents, WAGE_PRIORITY_CAP_CENTS)
        general_allowed_cents   = allowed_amount_cents - priority_allowed_cents
        secured_allowed_cents   = 0; investor_allowed_cents = 0
      PRIORITY_TAX:
        priority_allowed_cents  = allowed_amount_cents; all other buckets 0
      GENERAL_UNSECURED:
        general_allowed_cents   = allowed_amount_cents; all other buckets 0
      INVESTOR:
        investor_allowed_cents  = allowed_amount_cents; all other buckets 0 (subordinated)
      Invariant: secured + priority + general + investor == allowed_amount_cents.
    input_set: "The single claim being determined; collateral asset read at determination time"
    constants:
      WAGE_PRIORITY_CAP_CENTS: 1515000
    precision: "integer cents; no rounding"
    variants:
      - name: estimated_collateral
        when: "Collateral asset is IDENTIFIED (not yet liquidated) at determination time"
        difference: "Secured bucket uses estimated_value_cents — an unrealized appraisal"
      - name: realized_collateral
        when: "Collateral asset is LIQUIDATED at determination time"
        difference: "Secured bucket uses liquidation_value_cents — actual proceeds; for the same claim, a liquidation below estimate shifts dollars from the SECURED bucket to the GENERAL deficiency bucket"

  - name: distribution_waterfall
    trigger: "DistributionPlan creation/amend (provisional variant, pins pool_snapshot_cents) and DistributionPlan FILED -> APPROVED (final variant, generates DistributionPayment rows)"
    algorithm: waterfall_allocation
    formula: |
      pool = cash_on_hand_cents(at evaluation) - reserve_cents           (>= 0, validated)
      Class order by rank: SECURED(1) -> PRIORITY(2) -> GENERAL(3) -> INVESTOR(4)
      For each class in rank order:
        class_total = sum over ALLOWED claims of this case of that class's bucket
                      (secured_allowed_cents / priority_allowed_cents /
                       general_allowed_cents / investor_allowed_cents)
        if class_total == 0: skip the class (no rows, no division)
        if pool >= class_total:
          every bucket pays in full; pool -= class_total
        else:
          per-bucket raw = pool * bucket_i / class_total
          payment_i = floor(raw)                                   (integer cents)
          remainder = pool - sum(payment_i)
          distribute remainder one cent at a time to buckets ordered by
            bucket amount DESC, tie-break claim created_at ASC       (never id)
          (remainder < number of buckets in the class, so a single pass suffices)
          pool := 0
      Classes after an exhausted pool generate no rows (a bucket with computed
      amount 0 gets no DistributionPayment row at all).
    input_set: "Claims of the plan's case in status ALLOWED at evaluation time; buckets per claim_priority_determination"
    constants: {}
    precision: "integer cents; floor with deterministic single-pass remainder sweep"
    variants:
      - name: provisional_snapshot
        when: "Plan filed (created or amended): pins pool_snapshot_cents from cash at filing"
        difference: "Advisory figure for court notice; reflects filing-time cash"
      - name: final_schedule
        when: "Plan approved: pool recomputed from cash at approval and payment rows are generated"
        difference: "If cash moved between filing and approval (fee payments, expenditure approvals), final per-claim amounts differ from the provisional snapshot proportions"

  - name: fee_request_calculation
    trigger: "FeeApplication creation (initial status FILED)"
    algorithm: aggregation
    formula: |
      HOURLY (lodestar variant):
        per entry e in time_entries: line_e = round_half_up(e.hours * e.rate_cents)
        requested_amount_cents = sum(line_e) + expenses_cents
        PINNED ROUNDING ORDER: round each entry to whole cents FIRST (round-half-up),
        then sum, then add expenses. (Sum-then-round can differ by a cent.)
      CONTINGENT (percentage-of-recovery variant):
        requested_amount_cents = round_half_up(contingency_pct * recovery_basis_cents)
                                 + expenses_cents
    input_set: "The new application's time_entries / recovery_basis_cents / expenses_cents and its engagement's fee_arrangement, contingency_pct"
    constants: {}
    precision: "integer cents, round_half_up; per-entry rounding precedes summation"
    variants:
      - name: hourly_lodestar
        when: "engagement.fee_arrangement == HOURLY"
        difference: "Value of professional time: sum of rounded time-entry lines"
      - name: contingent_percentage
        when: "engagement.fee_arrangement == CONTINGENT"
        difference: "Percentage of the recovery obtained; for the same underlying engagement work the two approaches produce different requested amounts"

  - name: estate_cash_position
    trigger: "Asset liquidated; fee application paid; distribution payment paid or voided; EXPENDITURE authorization approved"
    algorithm: aggregation
    formula: |
      cash_on_hand_cents =
          sum(Asset.liquidation_value_cents where status == LIQUIDATED)
        - sum(FeeApplication.approved_amount_cents where status == PAID)
        - sum(DistributionPayment.paid_amount_cents where status == PAID)
        - sum(AuthorizationRequest.amount_cents where status == APPROVED and request_type == EXPENDITURE)
      marshalled_value_cents =
          sum over assets with status != ABANDONED of
            (LIQUIDATED ? liquidation_value_cents : estimated_value_cents)
      allowed_claims_total_cents =
          sum(Claim.allowed_amount_cents where status == ALLOWED)
      posture = CASH_CONSTRAINED if cash_on_hand_cents < operating_reserve_cents else NORMAL
      Conservation invariant (compensating pair pay/void):
        cash_on_hand_cents
          + sum(PAID fee approved amounts)
          + sum(paid_amount_cents over payments PAID net of later VOIDED)
          + sum(APPROVED EXPENDITURE amounts)
        == sum(liquidation proceeds)   at all times
    input_set: "All assets, fee applications, distribution payments, and authorization requests of the case"
    constants: {}
    precision: "integer cents"

  - name: reporting_calendar
    trigger: "StatusReport created/decided; logical clock advanced; plan creation (overdue gate)"
    algorithm: interval_merge
    formula: |
      next_report_period_start = max(period_end) over non-REJECTED PERIODIC reports
                                 of the case; if none, appointment_effective_at.
      report_overdue = (current_logical_utc > next_report_period_start
                        + reporting_interval_days)          (strictly greater)
      New report validation (PERIODIC and FINAL alike):
        period_start == next_report_period_start   (else ERR_REPORT_PERIOD_GAP)
        period_end   >  period_start               (else ERR_INVALID_REQUEST)
        half-open [period_start, period_end) must not intersect any other
          non-REJECTED report's period of the same case
          (else ERR_REPORT_PERIOD_OVERLAP; the overlap check is evaluated
           BEFORE the gap check)
    input_set: "Non-REJECTED StatusReports of the case; case appointment_effective_at and reporting_interval_days; logical clock"
    constants: {}
    precision: "datetime, second precision; half-open interval arithmetic"

  - name: engagement_fee_cap
    trigger: "FeeApplication decide(APPROVE) and FeeApplication pay"
    algorithm: threshold
    formula: |
      At decide(APPROVE): let committed = sum(approved_amount_cents over this
        engagement's applications in APPROVED or PAID status).
        Require committed + new_approved_amount <= fee_cap_cents
        (equality permitted; else ERR_FEE_CAP_EXCEEDED).
      At pay: total_fees_paid_cents recomputed; if total_fees_paid_cents >=
        fee_cap_cents the engagement auto-transitions APPROVED -> EXHAUSTED
        (boundary: reaching the cap exactly exhausts it).
    input_set: "Fee applications of the engagement"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role (Court | Receiver | Creditor | SystemAdmin)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present, types valid, enum values in range, conditional requirements satisfied (collateral_asset_id iff SECURED; hourly_rate_cents iff HOURLY; contingency_pct iff CONTINGENT; time_entries non-empty iff HOURLY application; recovery_basis_cents iff CONTINGENT application; related_asset_id iff ASSET_LIQUIDATION/ASSET_ABANDONMENT; allowed_amount_cents iff determination=ALLOWED; approved_amount_cents iff decision=APPROVE on fee applications; amounts > 0 where required; period_start < period_end)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Path ids exist, then body FK references exist and belong to the implied scope (collateral asset in the same case; engagement exists; plan/payment/fee-application ids exist)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "OCC: expected_case_version equals the case's current version (cash-debiting payment endpoints only)"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /v1/fee-applications/{id}/pay, POST /v1/distribution-payments/{id}/pay"

  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the requested transition (e.g., liquidate requires IDENTIFIED; decide requires the pending state; pay requires APPROVED/SCHEDULED; discharge requires DISTRIBUTING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: state
    check: "Cross-entity state gates: owning case ACTIVE (or ACTIVE|DISTRIBUTING where pinned) for claims create/determine/reconsider, asset liquidate/abandon, authorization-request create, fee-application pay, status-report create, plan create/amend; engagement APPROVED for fee-application create; plan APPROVED for payment void; case DISTRIBUTING for FINAL report creation"
    error_id: "ERR_CASE_NOT_ACTIVE | ERR_ENGAGEMENT_NOT_APPROVED | ERR_PLAN_NOT_EXECUTING"
    http_status: 409
    applies_to: various

  - priority: 8
    category: business_safety
    check: "Court-approval gate: liquidation/abandonment of an asset whose estimated_value_cents > authority_limit_cents requires a linked APPROVED AuthorizationRequest of matching type and asset (absent -> ERR_AUTHORIZATION_REQUIRED; mismatched -> ERR_AUTHORIZATION_MISMATCH; equality to the limit requires NO approval)"
    error_id: "ERR_AUTHORIZATION_REQUIRED | ERR_AUTHORIZATION_MISMATCH"
    http_status: 409
    applies_to: "POST /v1/assets/{id}/liquidate, POST /v1/assets/{id}/abandon"

  - priority: 9
    category: business_temporal
    check: "Court-calendar gates: claim filed_at must be <= bar_date (inclusive; later -> ERR_CLAIM_BARRED); plan creation/amendment blocked while the case's report_overdue flag is true (ERR_STATUS_REPORT_OVERDUE)"
    error_id: "ERR_CLAIM_BARRED | ERR_STATUS_REPORT_OVERDUE"
    http_status: 422
    applies_to: "POST /v1/claims, POST /v1/distribution-plans, POST /v1/distribution-plans/{id}/amend"

  - priority: 10
    category: business_constraint
    check: "Uniqueness, interval, and aggregate constraints, evaluated in this sub-order: (a) unique case_number per court_jurisdiction (ERR_DUPLICATE_CASE_NUMBER); (b) at most one PROPOSED/APPROVED engagement per (case_id, role_type) (ERR_ENGAGEMENT_ALREADY_ACTIVE); (c) at most one plan FILED/APPROVED per case (ERR_PLAN_ALREADY_OPEN); (d) plan filing requires no claim in FILED status (ERR_UNDETERMINED_CLAIMS); (e) fee-application half-open periods per engagement must not overlap (ERR_FEE_PERIOD_OVERLAP); (f) report periods must not overlap (ERR_REPORT_PERIOD_OVERLAP) then must be contiguous (ERR_REPORT_PERIOD_GAP) — overlap is evaluated BEFORE gap; (g) payment pay requires no SCHEDULED payment of a strictly senior class on the same plan (ERR_SENIOR_CLASS_UNPAID); (h) discharge aggregate preconditions (ERR_DISCHARGE_BLOCKED)"
    error_id: "ERR_DUPLICATE_CASE_NUMBER | ERR_ENGAGEMENT_ALREADY_ACTIVE | ERR_PLAN_ALREADY_OPEN | ERR_UNDETERMINED_CLAIMS | ERR_FEE_PERIOD_OVERLAP | ERR_REPORT_PERIOD_OVERLAP | ERR_REPORT_PERIOD_GAP | ERR_SENIOR_CLASS_UNPAID | ERR_DISCHARGE_BLOCKED"
    http_status: 409
    applies_to: various

  - priority: 11
    category: business_referential
    check: "Referenced-entity usability: collateral asset must not be ABANDONED (ERR_COLLATERAL_NOT_ELIGIBLE)"
    error_id: ERR_COLLATERAL_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /v1/claims"

  - priority: 12
    category: business_fiscal
    check: "Fiscal checks (always last): cash sufficiency for fee pay / payment pay / EXPENDITURE approval (ERR_INSUFFICIENT_ESTATE_FUNDS); reserve <= cash at plan filing (ERR_RESERVE_EXCEEDS_POOL); engagement fee cap at approval (ERR_FEE_CAP_EXCEEDED); approved <= requested (ERR_AMOUNT_EXCEEDS_REQUEST); allowed <= filed (ERR_ALLOWED_EXCEEDS_FILED)"
    error_id: "ERR_INSUFFICIENT_ESTATE_FUNDS | ERR_RESERVE_EXCEEDS_POOL | ERR_FEE_CAP_EXCEEDED | ERR_AMOUNT_EXCEEDS_REQUEST | ERR_ALLOWED_EXCEEDS_FILED"
    http_status: 409
    applies_to: various

# =============================================================================
# §1.5 API Endpoint Table (37 endpoints)
# =============================================================================
endpoints:
  # --- Case ---
  - method: POST
    path: "/v1/cases"
    description: "Court appoints a receiver: create the receivership case (starts ACTIVE)"
    roles: [Court]
    code: 201
    input: [case_number, court_jurisdiction, debtor_name, appointed_receiver_name, appointment_effective_at, authority_limit_cents, business_operation_authorized, bar_date, reporting_interval_days, operating_reserve_cents]
    output: Case
    side_effects: ["status=ACTIVE", "computed totals initialized to 0", "posture=NORMAL", "version=1"]

  - method: GET
    path: "/v1/cases/{id}"
    description: "Read a case including computed fields (cash_on_hand_cents, allowed_claims_total_cents, posture, report_overdue, version)"
    roles: [Court, Receiver, Creditor]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: POST
    path: "/v1/cases/{id}/discharge"
    description: "Court discharges the receiver after final accounting; only from DISTRIBUTING with all aggregate preconditions met"
    roles: [Court]
    code: 200
    input: []
    output: Case
    side_effects: ["status=DISCHARGED", "engagements APPROVED/EXHAUSTED -> CLOSED"]

  - method: GET
    path: "/v1/cases/{id}/assets"
    description: "List assets of a case (FK reverse lookup for Asset.case_id)"
    roles: [Court, Receiver]
    code: 200
    input: ["status?", "asset_class?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: GET
    path: "/v1/cases/{id}/engagements"
    description: "List professional engagements of a case (FK reverse lookup for Engagement.case_id)"
    roles: [Court, Receiver]
    code: 200
    input: ["status?", "role_type?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []

  - method: GET
    path: "/v1/cases/{id}/authorization-requests"
    description: "List authorization requests of a case (FK reverse lookup for AuthorizationRequest.case_id)"
    roles: [Court, Receiver]
    code: 200
    input: ["status?", "request_type?", "limit?", "offset?"]
    output: AuthorizationRequest[]
    side_effects: []

  - method: GET
    path: "/v1/cases/{id}/status-reports"
    description: "List status reports of a case (FK reverse lookup for StatusReport.case_id)"
    roles: [Court, Receiver]
    code: 200
    input: ["report_type?", "status?", "limit?", "offset?"]
    output: StatusReport[]
    side_effects: []

  # --- Asset ---
  - method: POST
    path: "/v1/assets"
    description: "Receiver marshals an asset into the estate inventory (starts IDENTIFIED)"
    roles: [Receiver]
    code: 201
    input: [case_id, description, asset_class, estimated_value_cents]
    output: Asset
    side_effects: ["status=IDENTIFIED", "case marshalled_value_cents recomputed"]

  - method: GET
    path: "/v1/assets/{id}"
    description: "Read an asset"
    roles: [Court, Receiver]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: POST
    path: "/v1/assets/{id}/liquidate"
    description: "Receiver liquidates an IDENTIFIED asset; authority-limit gate applies"
    roles: [Receiver]
    code: 200
    input: [liquidation_value_cents, "authorization_id?"]
    output: Asset
    side_effects: ["status=LIQUIDATED", "case cash_on_hand_cents += liquidation_value_cents", "case version incremented", "case posture recomputed"]

  - method: POST
    path: "/v1/assets/{id}/abandon"
    description: "Receiver abandons a valueless IDENTIFIED asset; authority-limit gate applies"
    roles: [Receiver]
    code: 200
    input: ["authorization_id?"]
    output: Asset
    side_effects: ["status=ABANDONED", "case marshalled_value_cents recomputed"]

  - method: GET
    path: "/v1/assets/{id}/authorization-requests"
    description: "List authorization requests referencing an asset (FK reverse lookup for AuthorizationRequest.related_asset_id)"
    roles: [Court, Receiver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuthorizationRequest[]
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/v1/claims"
    description: "File a creditor/investor claim (Creditor self-files or Receiver files on a creditor's behalf); bar-date gate applies"
    roles: [Receiver, Creditor]
    code: 201
    input: [case_id, creditor_name, creditor_type, filed_amount_cents, "collateral_asset_id?"]
    output: Claim
    side_effects: ["status=FILED", "filed_at := logical clock"]

  - method: GET
    path: "/v1/claims"
    description: "List claims with filters (FK reverse lookup for Claim.case_id and Claim.collateral_asset_id)"
    roles: [Court, Receiver, Creditor]
    code: 200
    input: ["case_id?", "collateral_asset_id?", "status?", "creditor_type?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/v1/claims/{id}"
    description: "Read a claim including computed class buckets"
    roles: [Court, Receiver, Creditor]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/v1/claims/{id}/determine"
    description: "Receiver determines a FILED claim (ALLOWED with allowed_amount_cents, or DISALLOWED)"
    roles: [Receiver]
    code: 200
    input: [determination, "allowed_amount_cents?"]
    output: Claim
    side_effects: ["class buckets computed per claim_priority_determination", "case allowed_claims_total_cents recomputed", "FILED plan auto-WITHDRAWN if totals changed"]

  - method: POST
    path: "/v1/claims/{id}/reconsider"
    description: "Court orders reconsideration: ALLOWED or DISALLOWED claim returns to FILED, buckets cleared"
    roles: [Court]
    code: 200
    input: []
    output: Claim
    side_effects: ["allowed fields cleared", "case allowed_claims_total_cents recomputed", "FILED plan auto-WITHDRAWN", "SCHEDULED payments of this claim -> CANCELLED"]

  - method: GET
    path: "/v1/claims/{id}/payments"
    description: "List distribution payments of a claim, ordered by priority_class rank ASC (FK reverse lookup for DistributionPayment.claim_id)"
    roles: [Court, Receiver, Creditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DistributionPayment[]
    side_effects: []

  # --- Engagement ---
  - method: POST
    path: "/v1/engagements"
    description: "Receiver proposes retention of a professional (starts PROPOSED; court approval required)"
    roles: [Receiver]
    code: 201
    input: [case_id, professional_name, firm_name, role_type, fee_arrangement, "hourly_rate_cents?", "contingency_pct?", fee_cap_cents]
    output: Engagement
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/v1/engagements/{id}"
    description: "Read an engagement including total_fees_paid_cents"
    roles: [Court, Receiver]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: POST
    path: "/v1/engagements/{id}/decide"
    description: "Court approves or denies a PROPOSED engagement"
    roles: [Court]
    code: 200
    input: [decision]
    output: Engagement
    side_effects: ["status -> APPROVED or DENIED"]

  - method: GET
    path: "/v1/engagements/{id}/fee-applications"
    description: "List fee applications of an engagement (FK reverse lookup for FeeApplication.engagement_id)"
    roles: [Court, Receiver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FeeApplication[]
    side_effects: []

  # --- FeeApplication ---
  - method: POST
    path: "/v1/fee-applications"
    description: "Receiver files a fee application (starts FILED); requested_amount_cents computed per fee_request_calculation; period non-overlap enforced per engagement"
    roles: [Receiver]
    code: 201
    input: [engagement_id, period_start, period_end, "time_entries?", expenses_cents, "recovery_basis_cents?"]
    output: FeeApplication
    side_effects: ["status=FILED", "requested_amount_cents computed"]

  - method: POST
    path: "/v1/fee-applications/{id}/decide"
    description: "Court approves (with approved_amount_cents <= requested) or denies a FILED fee application"
    roles: [Court]
    code: 200
    input: [decision, "approved_amount_cents?"]
    output: FeeApplication
    side_effects: ["status -> APPROVED or DENIED"]

  - method: POST
    path: "/v1/fee-applications/{id}/pay"
    description: "Receiver pays an APPROVED fee application; OCC on Case.version; debits estate cash; increments Case.version by 1"
    roles: [Receiver]
    code: 200
    input: [expected_case_version]
    output: FeeApplication
    side_effects: ["status=PAID", "case cash_on_hand_cents -= approved_amount_cents", "increments Case.version by 1", "engagement total_fees_paid_cents recomputed", "engagement -> EXHAUSTED when cap reached"]

  # --- AuthorizationRequest ---
  - method: POST
    path: "/v1/authorization-requests"
    description: "Receiver seeks court approval for an out-of-ordinary-course action (expenditure, asset liquidation/abandonment above the authority limit, business decision)"
    roles: [Receiver]
    code: 201
    input: [case_id, request_type, description, amount_cents, "related_asset_id?"]
    output: AuthorizationRequest
    side_effects: ["status=SUBMITTED"]

  - method: POST
    path: "/v1/authorization-requests/{id}/decide"
    description: "Court approves or denies a SUBMITTED authorization request; approving an EXPENDITURE debits estate cash immediately"
    roles: [Court]
    code: 200
    input: [decision]
    output: AuthorizationRequest
    side_effects: ["status -> APPROVED or DENIED", "EXPENDITURE approval: case cash_on_hand_cents -= amount_cents, case version incremented, posture recomputed"]

  # --- StatusReport ---
  - method: POST
    path: "/v1/status-reports"
    description: "Receiver files a periodic or final status report with the court (starts FILED); period contiguity and non-overlap enforced; FINAL requires case DISTRIBUTING"
    roles: [Receiver]
    code: 201
    input: [case_id, report_type, period_start, period_end, narrative]
    output: StatusReport
    side_effects: ["status=FILED"]

  - method: POST
    path: "/v1/status-reports/{id}/decide"
    description: "Court accepts or rejects a FILED status report"
    roles: [Court]
    code: 200
    input: [decision]
    output: StatusReport
    side_effects: ["status -> ACCEPTED or REJECTED", "ACCEPTED advances the case reporting calendar"]

  # --- DistributionPlan ---
  - method: POST
    path: "/v1/distribution-plans"
    description: "Receiver files a distribution plan (starts FILED); requires case ACTIVE, no overdue report, all claims determined, no other open plan, reserve <= cash"
    roles: [Receiver]
    code: 201
    input: [case_id, reserve_cents]
    output: DistributionPlan
    side_effects: ["status=FILED", "pool_snapshot_cents pinned (provisional variant)"]

  - method: GET
    path: "/v1/distribution-plans"
    description: "List distribution plans with filters (FK reverse lookup for DistributionPlan.case_id)"
    roles: [Court, Receiver, Creditor]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: DistributionPlan[]
    side_effects: []

  - method: GET
    path: "/v1/distribution-plans/{id}"
    description: "Read a distribution plan including pool_snapshot_cents"
    roles: [Court, Receiver, Creditor]
    code: 200
    input: []
    output: DistributionPlan
    side_effects: []

  - method: POST
    path: "/v1/distribution-plans/{id}/decide"
    description: "Court approves (final waterfall, case -> DISTRIBUTING, payment rows generated) or rejects a FILED plan"
    roles: [Court]
    code: 200
    input: [decision]
    output: DistributionPlan
    side_effects: ["status -> APPROVED or REJECTED", "on APPROVE: final distribution_waterfall computed, case -> DISTRIBUTING, DistributionPayment rows created SCHEDULED"]

  - method: POST
    path: "/v1/distribution-plans/{id}/amend"
    description: "Receiver amends a REJECTED plan back to FILED (optionally new reserve); re-runs all filing validations and re-pins the pool snapshot"
    roles: [Receiver]
    code: 200
    input: ["reserve_cents?"]
    output: DistributionPlan
    side_effects: ["REJECTED -> FILED", "pool_snapshot_cents re-pinned"]

  - method: GET
    path: "/v1/distribution-plans/{id}/payments"
    description: "List payments of a plan, ordered by priority_class rank ASC then claim created_at ASC (FK reverse lookup for DistributionPayment.plan_id)"
    roles: [Court, Receiver, Creditor]
    code: 200
    input: ["status?", "priority_class?", "limit?", "offset?"]
    output: DistributionPayment[]
    side_effects: []

  # --- DistributionPayment ---
  - method: POST
    path: "/v1/distribution-payments/{id}/pay"
    description: "Receiver pays a SCHEDULED distribution payment; OCC on Case.version; senior-class gate; debits estate cash; increments Case.version by 1"
    roles: [Receiver]
    code: 200
    input: [expected_case_version]
    output: DistributionPayment
    side_effects: ["status=PAID", "paid_amount_cents := scheduled_amount_cents", "case cash_on_hand_cents -= scheduled_amount_cents", "increments Case.version by 1", "plan -> EXECUTED when no SCHEDULED payments remain"]

  - method: POST
    path: "/v1/distribution-payments/{id}/void"
    description: "Court voids a PAID payment (e.g., uncashed check); credits estate cash back; compensating action for pay"
    roles: [Court]
    code: 200
    input: []
    output: DistributionPayment
    side_effects: ["status=VOIDED", "case cash_on_hand_cents += paid_amount_cents", "case version incremented", "case posture recomputed"]

  # --- Test-driving endpoint ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the clock MUST NOT fall back to wall-clock time. All business timestamps (filed_at, liquidated_at, decided_at, paid_at, overdue checks) read this clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced; computed flags such as report_overdue reflect the new time on next read"]

# =============================================================================
# §1.6 Error Code Catalog (28 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role recognized but not permitted on this endpoint (e.g., Receiver attempts a court adjudication)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum value, or unmet conditional requirement (collateral for SECURED, rate for HOURLY, etc.)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist (or is out of scope)" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not equal the case's current version on cash-debiting payment endpoints" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition (incl. discharge from non-DISTRIBUTING, decide on a decided instrument, pay on a non-payable application/payment)" }
  - { id: ERR_CASE_NOT_ACTIVE, http: 409, condition: "Owning case not in a required status (ACTIVE, or ACTIVE|DISTRIBUTING where pinned) for the operation" }
  - { id: ERR_ENGAGEMENT_NOT_APPROVED, http: 409, condition: "Fee application filed against an engagement not in APPROVED status (PROPOSED, DENIED, EXHAUSTED, or CLOSED)" }
  - { id: ERR_PLAN_NOT_EXECUTING, http: 409, condition: "Payment void attempted while the payment's plan is not APPROVED (e.g., already EXECUTED)" }
  - { id: ERR_AUTHORIZATION_REQUIRED, http: 409, condition: "Asset estimated_value_cents > case authority_limit_cents and no authorization_id supplied" }
  - { id: ERR_AUTHORIZATION_MISMATCH, http: 409, condition: "authorization_id supplied but the request is not APPROVED, or has the wrong request_type, or references a different asset" }
  - { id: ERR_CLAIM_BARRED, http: 422, condition: "Claim filed with logical-clock time strictly after the case bar_date (filed_at == bar_date is timely)" }
  - { id: ERR_STATUS_REPORT_OVERDUE, http: 422, condition: "Plan filing/amendment attempted while a periodic status report is overdue" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report period half-openly overlaps another non-REJECTED report of the same case (checked before the gap rule)" }
  - { id: ERR_REPORT_PERIOD_GAP, http: 409, condition: "Report period_start does not equal the case's next_report_period_start (contiguity required)" }
  - { id: ERR_FEE_PERIOD_OVERLAP, http: 409, condition: "Fee application period half-openly overlaps another non-DENIED application of the same engagement" }
  - { id: ERR_PLAN_ALREADY_OPEN, http: 409, condition: "Another plan of the case is FILED or APPROVED" }
  - { id: ERR_ENGAGEMENT_ALREADY_ACTIVE, http: 409, condition: "Another engagement of the case with the same role_type is PROPOSED or APPROVED" }
  - { id: ERR_UNDETERMINED_CLAIMS, http: 409, condition: "Plan filing/amendment attempted while any claim of the case is FILED" }
  - { id: ERR_DISCHARGE_BLOCKED, http: 409, condition: "Discharge aggregate precondition unmet: plan not EXECUTED, undetermined claims, non-terminal fee applications, no ACCEPTED FINAL report, non-terminal assets, or cash_on_hand_cents != 0" }
  - { id: ERR_DUPLICATE_CASE_NUMBER, http: 409, condition: "case_number already exists within the same court_jurisdiction" }
  - { id: ERR_COLLATERAL_NOT_ELIGIBLE, http: 409, condition: "Collateral asset is ABANDONED" }
  - { id: ERR_SENIOR_CLASS_UNPAID, http: 409, condition: "A payment of a strictly senior priority class on the same plan is still SCHEDULED" }
  - { id: ERR_INSUFFICIENT_ESTATE_FUNDS, http: 409, condition: "cash_on_hand_cents is below the amount the operation would debit (fee pay, distribution pay, EXPENDITURE approval)" }
  - { id: ERR_RESERVE_EXCEEDS_POOL, http: 422, condition: "reserve_cents exceeds cash_on_hand_cents at plan filing/amendment" }
  - { id: ERR_FEE_CAP_EXCEEDED, http: 422, condition: "Approving would push the engagement's committed (APPROVED+PAID) fees beyond fee_cap_cents" }
  - { id: ERR_AMOUNT_EXCEEDS_REQUEST, http: 422, condition: "approved_amount_cents exceeds requested_amount_cents" }
  - { id: ERR_ALLOWED_EXCEEDS_FILED, http: 422, condition: "allowed_amount_cents exceeds filed_amount_cents" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties: Receiver administers, Court adjudicates)
# =============================================================================
roles:
  - name: Court
    description: "The appointing court (judge/chambers). Adjudicates every instrument the receiver files: engagements, fee applications, authorization requests, status reports, distribution plans; reconsiders claims; voids payments; discharges the estate. X-User-ID is an operator id (e.g., chambers clerk), never an entity id."
    identity: opaque
    exclusive_operations:
      - "POST /v1/cases — appoint receiver / open case"
      - "POST /v1/cases/{id}/discharge — discharge and close the estate"
      - "POST /v1/claims/{id}/reconsider — order claim reconsideration"
      - "POST /v1/engagements/{id}/decide — rule on professional retention"
      - "POST /v1/fee-applications/{id}/decide — rule on fee applications"
      - "POST /v1/authorization-requests/{id}/decide — rule on authorization requests"
      - "POST /v1/status-reports/{id}/decide — accept/reject status reports"
      - "POST /v1/distribution-plans/{id}/decide — rule on distribution plans"
      - "POST /v1/distribution-payments/{id}/void — void a paid distribution"
    shared_operations:
      - "GET reads of cases, assets, claims, engagements, fee applications, authorization requests, status reports, plans, payments"

  - name: Receiver
    description: "The court-appointed fiduciary. Marshals and liquidates assets, operates the business within authority limits, determines claims, proposes engagements, files fee applications and status reports, files and amends the distribution plan, executes payments. Never adjudicates its own filings. X-User-ID is an operator id, never an entity id."
    identity: opaque
    exclusive_operations:
      - "POST /v1/assets, POST /v1/assets/{id}/liquidate, POST /v1/assets/{id}/abandon"
      - "POST /v1/claims/{id}/determine"
      - "POST /v1/engagements"
      - "POST /v1/fee-applications, POST /v1/fee-applications/{id}/pay"
      - "POST /v1/authorization-requests"
      - "POST /v1/status-reports"
      - "POST /v1/distribution-plans, POST /v1/distribution-plans/{id}/amend"
      - "POST /v1/distribution-payments/{id}/pay"
    shared_operations:
      - "POST /v1/claims (with Creditor — receiver may file on a creditor's behalf)"
      - "GET reads of cases, assets, claims, engagements, fee applications, authorization requests, status reports, plans, payments"

  - name: Creditor
    description: "A creditor or investor of the debtor. Files claims and reads the public estate record. X-User-ID is an opaque claimant account id, never an entity id (no ownership scoping is enforced)."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /v1/claims (with Receiver)"
      - "GET /v1/cases/{id}, GET /v1/claims, GET /v1/claims/{id}, GET /v1/claims/{id}/payments, GET /v1/distribution-plans, GET /v1/distribution-plans/{id}, GET /v1/distribution-plans/{id}/payments"

  - name: SystemAdmin
    description: "Test-harness operator role; controls only the logical clock. X-User-ID is an operator id, never an entity id."
    identity: opaque
    exclusive_operations:
      - "POST /v1/_clock/set_current_utc"
    shared_operations: []
