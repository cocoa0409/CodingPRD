      - name: landed_cost_freight_discount_tier_boundary_at_exactly_two_hundred_thousand_cents
        claim_type: threshold
        grounds:
          - calculations.distribution_order_landed_cost
          - calculations.distribution_order_landed_cost.constants.FREIGHT_DISCOUNT_TIER2_CENTS
        distinguishing_aspect: "Two orders straddle the tier-2 edge by one hundredth of a barrel. Tier selection reads the ROUNDED product value and is inclusive at the boundary, so 200000 cents takes 20% while 199600 takes 10% - and the discount is rounded on its own (898.8 -> 899) before subtraction."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer priced at exactly 40000 cents per bbl, FORMULA_EXEMPT and COLA_APPROVED."
            - "ID SELF_DISTRIBUTION license ACTIVE with cap 1000.00, so the channel is SELF_DISTRIBUTED and no franchise fee applies."
            - "No inventory is needed - the landed cost is computed at creation, before allocation."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
