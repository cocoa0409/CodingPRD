              as_user_id: "${p_r4a}"
              captures: { err_owner: "$.data.error_id" }
            - call: "PATCH /ipa/physicians/${p_r4a}/panel-status"
              payload: { panel_status: "CLOSED_TO_NEW" }
              as: PhysicianUser
              as_user_id: "${p_r4a}"
              captures: { p_r4a_panel: "$.data.panel_status" }
            - call: "GET /ipa/physicians/${p_r4b}"
              as: NetworkManager
              captures: { p_r4b_panel_after: "$.data.panel_status", p_r4b_v_after: "$.data.version" }
          assert:
            - "call 1 returns HTTP 403 with ${err_owner} == \"ERR_NOT_RESOURCE_OWNER\" (not ERR_UNAUTHORIZED — PhysicianUser is on the endpoint's roles list)"
            - "${p_r4a_panel} == \"CLOSED_TO_NEW\" — the identical request on the caller's own record succeeds"
            - "${p_r4b_panel_after} == \"OPEN\" and ${p_r4b_v_after} == ${p_r4b_v_active} — the rejected call left the other physician untouched"

      - name: recovery_submitter_cannot_approve_the_recovery_it_submitted
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_25_ERR_SEGREGATION_OF_DUTIES
          - state_machines.StopLossRecovery.SUBMITTED_to_APPROVED
          - complexity_profile.role_model
        distinguishing_aspect: |
          Segregation of duties is tracked on X-User-ID, not on the role: the same
          human who submitted a recovery must not adjudicate it even when acting
          under the ReinsuranceUnderwriter role. The approval attempt by
          user-claims-r5 (the submitter) must fail with
