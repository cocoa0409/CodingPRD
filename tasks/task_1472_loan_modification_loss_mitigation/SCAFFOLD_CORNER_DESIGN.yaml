      - name: borrower_cannot_create_program_option
        claim_type: rbac_denial
        grounds: ["roles[Borrower]", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Borrower is entity-scoped and has no configuration surface: POST /program-options as Borrower is denied before any body validation."
        test_recipe:
          setup: ["borrower exists"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Ada A", email: "ada@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /program-options", payload: { code: "HACK", waterfall_rank: 9, target_dti_bp: 9900, rate_floor_bp: 0, rate_step_bp: 1, max_term_months: 999, max_forbearance_pct_bp: 9900, min_delinquency_days: 0, max_delinquency_days: 9999 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
