          The deadline comparison is inclusive: inquiry P, responded at exactly its
          response_due_at 2026-08-10T00:00:00Z, is accepted and reaches
          RESPONSE_SUBMITTED with response_round_count 1, while inquiry Q with the identical
          deadline, responded one day later, returns 422 ERR_RESPONSE_DEADLINE_PASSED and
          stays OPEN with response_round_count 0.
        test_recipe:
          setup:
            - "Two ExaminationInquiry rows opened at 2026-08-01, EX-2026-P and EX-2026-Q,
               both with response_due_at 2026-08-10T00:00:00Z."
