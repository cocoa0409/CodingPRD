# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
#
# Breadth probe for task_2826 (library-programming). Walks
# references/claim-extraction-guide.md row by row against SCAFFOLD.yaml §1.1–§1.7.
# §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) is the depth probe; where a corner is already
# asserted there, this file carries an `excluded_because:` stub instead of a recipe.
#
# Conventions used by every recipe below:
#   * The logical clock is pinned first; its startup default is 2026-08-01T00:00:00.000Z.
#   * 2026-08-12 is a Wednesday and 2026-08-15 a Saturday — weekday-sensitive money
#     (WEEKEND_PREMIUM_RATE) is therefore controlled by the chosen program date.
#   * Every expected_*_version value is a ${var} captured from a server response, per
#     §1.8 contract item 3c; a fresh GET on the parent precedes every OCC write whose
#     parent may have been bumped by an intervening cascade.
#   * Opaque roles pin X-User-ID only where ownership or segregation of duties is
#     observable; the Reader role (entity_backed:Participant) always pins it.

scaffold_corner_design:

  # ================================================================= §1.1 ENTITIES
  - section: entities
    instances:

      - name: branch_creation_returns_all_declared_fields_with_zero_over_budget_counter
        claim_type: creation
        grounds:
          - entities.Branch
          - endpoints[POST /library/branches]
        distinguishing_aspect: "POST /library/branches with the four required inputs returns 201 and a Branch whose computed programs_over_budget_count is 0, not null and not absent."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Branch.${br}.name == \"Central Library\" and Branch.${br}.branch_code == \"CEN\""
            - "Branch.${br}.overlapping_program_capacity == 2 and Branch.${br}.per_program_fee_cap_cents == 150000"
            - "Branch.${br}.programs_over_budget_count == 0"
            - "The envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: branch_retrieval_by_id_returns_the_stored_branch_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /library/branches/{branch_id}]
          - entities.Branch
        distinguishing_aspect: "GET /library/branches/{branch_id} returns exactly the field values POST stored, including the computed counter, with no re-derivation drift."
        test_recipe:
          setup:
            - "One branch CEN exists (overlapping_program_capacity 2, per_program_fee_cap_cents 150000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "GET /library/branches/${br}"
              payload: {}
              as: ScreeningOfficer
          assert:
            - "HTTP status is 200"
            - "Branch.${br}.branch_code == \"CEN\" and Branch.${br}.per_program_fee_cap_cents == 150000"
            - "Branch.${br}.programs_over_budget_count == 0"

      - name: room_creation_defaults_status_to_available_and_takes_branch_id_from_the_path
        claim_type: defaults
        grounds:
          - entities.Room.fields.status
          - entities.Room.fields.branch_id
          - endpoints[POST /library/branches/{branch_id}/rooms]
        distinguishing_aspect: "Omitting `status` yields Room.status == AVAILABLE and Room.branch_id is taken from the path segment, not from any body field."
        test_recipe:
          setup:
            - "One branch CEN exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Room.${room}.status == AVAILABLE"
            - "Room.${room}.branch_id == ${br}"
            - "Room.${room}.accessibility_features == []"

      - name: room_creation_missing_required_capacity_seats_rejected
        claim_type: required_fields
        grounds:
          - entities.Room.fields.capacity_seats
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "capacity_seats has source: input and no default, so omitting it returns ERR_INVALID_REQUEST (400) and creates no Room."
        test_recipe:
          setup:
            - "One branch CEN exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /library/rooms filtered by branch_id == ${br} returns total_count == 0"

      - name: program_creation_derives_serves_minors_from_age_group_for_all_ages_and_adult
        claim_type: computed_fields
        grounds:
          - entities.Program.fields.serves_minors
          - entities.Program.fields.age_group
        distinguishing_aspect: "serves_minors is computed true for age_group ALL_AGES and false only for ADULT — the client never supplies it."
        test_recipe:
          setup:
            - "One branch CEN exists; the clock sits at 2026-08-01T00:00:00.000Z so a 2026-08-12 window is in the future."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Family Story Time", age_group: "ALL_AGES", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { p_all: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Adult Book Club", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T18:00:00.000Z", end_utc: "2026-08-12T19:00:00.000Z", attendance_target: 20, attendance_cap: 25, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { p_adult: $.data.id }
          assert:
            - "Program.${p_all}.serves_minors == true"
            - "Program.${p_adult}.serves_minors == false"
            - "Program.${p_all}.age_group == ALL_AGES and Program.${p_adult}.age_group == ADULT"

      - name: program_creation_defaults_partner_fields_accommodations_and_money_counters
        claim_type: defaults
        grounds:
          - entities.Program.fields.partner_type
          - entities.Program.fields.accessibility_accommodations
          - entities.Program.fields.materials_committed_cents
          - endpoints[POST /library/programs]
        distinguishing_aspect: "Omitting partner_type, accessibility_accommodations and challenge_id yields partner_type == NONE, an empty accommodations array, a null challenge_id and every money counter at 0 with budget_variance_cents equal to the sum of the two budgets."
        test_recipe:
          setup:
            - "One branch CEN exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
          assert:
            - "Program.${prog}.partner_type == NONE and Program.${prog}.partner_org_name == null and Program.${prog}.partner_insurance_expires_on == null"
            - "Program.${prog}.accessibility_accommodations == [] and Program.${prog}.challenge_id == null"
            - "Program.${prog}.registered_count == 0, confirmed_room_capacity == 0, materials_committed_cents == 0, presenter_fee_committed_cents == 0"
            - "Program.${prog}.materials_available_cents == 50000"
            - "Program.${prog}.budget_variance_cents == 250000 and Program.${prog}.budget_posture == WITHIN_BUDGET"
            - "Program.${prog}.operational_status == DRAFT and Program.${prog}.compliance_status == UNVERIFIED"

      - name: program_creation_with_unknown_age_group_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Program.fields.age_group
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "age_group is a closed enum of five members; \"PRESCHOOL\" is not one of them, so the create returns ERR_INVALID_REQUEST (400) rather than being coerced."
        test_recipe:
          setup:
            - "One branch CEN exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "PRESCHOOL", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /library/programs filtered by branch_id == ${br} returns total_count == 0"

      - name: program_creation_client_supplied_id_and_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Program.fields.operational_status
          - validations[priority=3]
        distinguishing_aspect: "Unknown body keys are ignored (validation priority 3), so a client-supplied id/version/operational_status cannot preempt the server-minted id or the DRAFT initial state."
        test_recipe:
          setup:
            - "One branch CEN exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000, id: "00000000-0000-0000-0000-000000000009", version: 99, operational_status: "CONFIRMED" }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
          assert:
            - "HTTP status is 201"
            - "${prog} != \"00000000-0000-0000-0000-000000000009\""
            - "Program.${prog}.operational_status == DRAFT"
            - "Program.${prog}.version != 99"

      - name: reservation_retrieval_exposes_computed_occupancy_window_and_effective_capacity
        claim_type: computed_fields
        grounds:
          - entities.RoomReservation.fields.occupancy_start_utc
          - entities.RoomReservation.fields.effective_capacity_seats
          - calculations.room_occupancy_interval
          - calculations.room_effective_capacity
        distinguishing_aspect: "A reservation of 14:00..15:00 with setup 15 / teardown 15 stores occupancy 13:45..15:15 and effective_capacity_seats 60 (no WHEELCHAIR_LAYOUT), all three derived server-side from inputs the client never sent."
        test_recipe:
          setup:
            - "Branch CEN with room Story Room (capacity_seats 60, min setup/teardown 15) and a DRAFT program 2026-08-12T14:00..15:00 with no accessibility accommodations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "GET /library/reservations/${resv}"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "RoomReservation.${resv}.occupancy_start_utc == 2026-08-12T13:45:00.000Z"
            - "RoomReservation.${resv}.occupancy_end_utc == 2026-08-12T15:15:00.000Z"
            - "RoomReservation.${resv}.effective_capacity_seats == 60"
            - "RoomReservation.${resv}.status == HELD and RoomReservation.${resv}.program_id == ${prog}"

      - name: presenter_creation_initialises_screening_and_engagement_fields
        claim_type: creation
        grounds:
          - entities.Presenter.fields.engagement_status
          - entities.Presenter.fields.screening_status
          - endpoints[POST /library/presenters]
        distinguishing_aspect: "A freshly registered presenter is PROSPECT with screening_decision NONE, screening_tier NONE, screening_status NONE, screening_valid_until null and executed_contract_count 0 — no screening is implied by registration."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "POST /library/presenters"
              payload: { legal_name: "Marisol Vega", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2027-01-01", quoted_fee_cents: 50000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Presenter.${pres}.engagement_status == PROSPECT"
            - "Presenter.${pres}.screening_decision == NONE and Presenter.${pres}.screening_tier == NONE and Presenter.${pres}.screening_status == NONE"
            - "Presenter.${pres}.screening_valid_until == null and Presenter.${pres}.screening_decided_on == null"
            - "Presenter.${pres}.executed_contract_count == 0"

      - name: reading_log_entry_carries_no_version_or_updated_at_field
        claim_type: immutability
        grounds:
          - entities.ReadingLogEntry
          - endpoints[GET /library/log-entries/{entry_id}]
        distinguishing_aspect: "ReadingLogEntry declares common_fields: false — its read exposes id and created_at but no updated_at and no version, and §1.5 offers no update endpoint for it."
        test_recipe:
          setup:
            - "An OPEN MINUTES challenge 2026-07-01..2026-08-31 with one tier (threshold 5000) and one enrolled participant; clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer 2026", logging_method: "MINUTES", unit_label: "minutes", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal: $.data.id }
            - call: "POST /library/reading-challenges/${chal}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 5000, prize_sku: "MEDAL", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${chal}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal}", home_branch_id: "${br}", display_name: "Ada L.", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { part: $.data.id }
          trigger:
            - call: "POST /library/participants/${part}/log-entries"
              payload: { units: 30, logged_on: "2026-08-01", source: "STAFF_DESK" }
              as: ProgramCoordinator
              captures: { entry: $.data.id }
            - call: "GET /library/log-entries/${entry}"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "ReadingLogEntry.${entry} response contains id and created_at"
            - "ReadingLogEntry.${entry} response contains no `version` key and no `updated_at` key"
            - "ReadingLogEntry.${entry}.entry_type == LOG and units == 30 and units_delta == 0"
            - "ReadingLogEntry.${entry}.participant_id == ${part} and corrected_entry_id == null"

      - name: incentive_tier_creation_takes_challenge_id_from_the_path_parent
        claim_type: parent_relationships
        grounds:
          - entities.IncentiveTier.fields.challenge_id
          - endpoints[POST /library/reading-challenges/{challenge_id}/incentive-tiers]
        distinguishing_aspect: "IncentiveTier.challenge_id has source: system and is set from the {challenge_id} path segment; the tier is reachable from its parent through GET /library/incentive-tiers?challenge_id=."
        test_recipe:
          setup:
            - "One PLANNING challenge exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer 2026", logging_method: "MINUTES", unit_label: "minutes", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal: $.data.id }
          trigger:
            - call: "POST /library/reading-challenges/${chal}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 60, prize_sku: "MEDAL", prize_units_per_participant: 1 }
              as: ProgramManager
              captures: { tier: $.data.id }
            - call: "GET /library/incentive-tiers"
              payload: { challenge_id: "${chal}" }
              as: ProgramManager
          assert:
            - "HTTP status is 201 on the create"
            - "IncentiveTier.${tier}.challenge_id == ${chal}"
            - "IncentiveTier.${tier}.award_count == 0 and IncentiveTier.${tier}.deferred_count == 0"
            - "The filtered list returns total_count == 1 and its single element id == ${tier}"

      - name: inventory_lot_creation_initialises_availability_and_active_status
        claim_type: creation
        grounds:
          - entities.InventoryLot.fields.quantity_available
          - entities.InventoryLot.fields.status
          - endpoints[POST /library/inventory-lots]
        distinguishing_aspect: "A new lot has quantity_available == quantity_procured, quantity_reserved 0, quantity_issued 0 and status ACTIVE — the conservation identity holds at creation."
        test_recipe:
          setup:
            - "One branch CEN exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
          trigger:
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "SUPPLY", sku: "CRAFT-KIT", unit_cost_cents: 250, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
              captures: { lot: $.data.id }
          assert:
            - "HTTP status is 201"
            - "InventoryLot.${lot}.quantity_available == 100, quantity_reserved == 0, quantity_issued == 0"
            - "InventoryLot.${lot}.status == ACTIVE"
            - "InventoryLot.${lot}.quantity_procured == InventoryLot.${lot}.quantity_available + quantity_reserved + quantity_issued"

      - name: participants_listing_reports_pagination_metadata_and_filters_by_challenge
        claim_type: listing
        grounds:
          - endpoints[GET /library/participants]
          - complexity_profile.consistency_model
        distinguishing_aspect: "GET /library/participants?challenge_id=&limit=2&offset=0 returns 2 of 3 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One PLANNING challenge with three enrolled participants at branch CEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer 2026", logging_method: "MINUTES", unit_label: "minutes", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal: $.data.id }
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal}", home_branch_id: "${br}", display_name: "Ada L.", age_band: "AGE_5_11" }
              as: ProgramCoordinator
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal}", home_branch_id: "${br}", display_name: "Ben O.", age_band: "AGE_12_17" }
              as: ProgramCoordinator
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal}", home_branch_id: "${br}", display_name: "Cy P.", age_band: "ADULT" }
              as: ProgramCoordinator
          trigger:
            - call: "GET /library/participants"
              payload: { challenge_id: "${chal}", limit: 2, offset: 0 }
              as: ProgramCoordinator
            - call: "GET /library/participants"
              payload: { challenge_id: "${chal}", limit: 2, offset: 2 }
              as: ProgramCoordinator
          assert:
            - "The first response has response_type == \"array\", total_count == 3, has_more == true and exactly 2 elements"
            - "The second response has total_count == 3, has_more == false and exactly 1 element"
            - "ReadingChallenge.${chal}.participant_count == 3"

      - name: program_creation_with_unknown_branch_id_body_fk_returns_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=6]
          - errors[ERR_BRANCH_NOT_FOUND]
        distinguishing_aspect: "The flat topology validates body foreign keys: an unresolvable branch_id returns ERR_BRANCH_NOT_FOUND (404) at priority 6 and persists no Program."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; no branch with the referenced id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "POST /library/programs"
              payload: { branch_id: "00000000-0000-0000-0000-0000000000ff", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err} == ERR_BRANCH_NOT_FOUND"
            - "GET /library/programs returns total_count == 0"

  # ============================================================ §1.2 STATE MACHINES
  - section: state_machines
    instances:

      - name: program_schedule_transition_draft_to_scheduled_with_a_held_reservation
        claim_type: valid_transition
        grounds:
          - state_machines.Program.operational_status[DRAFT -> SCHEDULED]
          - endpoints[POST /library/programs/{program_id}/schedule]
        distinguishing_aspect: "A HELD (not yet CONFIRMED) reservation satisfies the DRAFT -> SCHEDULED precondition for an IN_BRANCH program, and the reservation itself is left HELD by the transition."
        test_recipe:
          setup:
            - "Branch CEN, room Story Room, one DRAFT IN_BRANCH program for 2026-08-12T14:00..15:00 and one HELD reservation covering it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
          trigger:
            - call: "POST /library/programs/${prog}/schedule"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "HTTP status is 200"
            - "Program.${prog}.operational_status == SCHEDULED"
            - "Program.${prog}.compliance_status is still UNVERIFIED (the two dimensions are independent)"
            - "RoomReservation.${resv}.status is still HELD"
            - "Program.${prog}.version is strictly greater than the version returned by the create"

      - name: challenge_open_requires_at_least_one_incentive_tier
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ReadingChallenge.status[PLANNING -> OPEN]
          - validations[priority=42]
          - errors[ERR_CHALLENGE_HAS_NO_TIERS]
        distinguishing_aspect: "Opening a challenge whose tier ladder is empty is refused with ERR_CHALLENGE_HAS_NO_TIERS (422) and the challenge stays PLANNING, so tiers can still be added afterwards."
        test_recipe:
          setup:
            - "One PLANNING challenge with no IncentiveTier rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer 2026", logging_method: "MINUTES", unit_label: "minutes", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal: $.data.id }
          trigger:
            - call: "POST /library/reading-challenges/${chal}/open"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err} == ERR_CHALLENGE_HAS_NO_TIERS"
            - "ReadingChallenge.${chal}.status is still PLANNING"
            - "A subsequent POST /library/reading-challenges/${chal}/incentive-tiers still succeeds, proving the ladder was never locked"

      - name: second_reservation_create_supersedes_the_first_held_reservation
        claim_type: side_effect_execution
        grounds:
          - state_machines.RoomReservation.status[HELD -> SUPERSEDED]
          - endpoints[POST /library/programs/{program_id}/reservations]
        distinguishing_aspect: "Creating a second reservation for the same program drives the first from HELD to SUPERSEDED in the same request — it is not RELEASED and not left HELD alongside the newcomer."
        test_recipe:
          setup:
            - "Branch CEN with two rooms and a DRAFT program holding one HELD reservation on room A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room_a: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Meeting Room", capacity_seats: 40, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room_b: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v1: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room_a}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v1}" }
              as: ProgramCoordinator
              captures: { resv_a: $.data.id }
            - call: "GET /library/programs/${prog}"
              payload: {}
              as: ProgramCoordinator
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room_b}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v2}" }
              as: ProgramCoordinator
              captures: { resv_b: $.data.id }
          assert:
            - "HTTP status is 201"
            - "RoomReservation.${resv_a}.status == SUPERSEDED"
            - "RoomReservation.${resv_b}.status == HELD and RoomReservation.${resv_b}.room_id == ${room_b}"
            - "GET /library/reservations filtered by program_id == ${prog} and status == HELD returns total_count == 1"

      - name: program_close_out_from_scheduled_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Program.operational_status[CONFIRMED -> CLOSED_OUT]
          - validations[priority=11]
          - errors[ERR_PROGRAM_STATE_INVALID]
        distinguishing_aspect: "Close-out is refused with ERR_PROGRAM_STATE_INVALID (409) from SCHEDULED even when the clock has already passed end_utc, so the state gate at priority 11 outranks the temporal gate at priority 48."
        test_recipe:
          setup:
            - "A SCHEDULED (never confirmed) program whose end_utc has already passed on the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/schedule"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T16:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "POST /library/programs/${prog}/close-out"
              payload: { verified_registrant_attendance: 0, drop_in_headcount: 0, surveys_collected: 0 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_PROGRAM_STATE_INVALID (not ERR_PROGRAM_NOT_YET_ENDED)"
            - "Program.${prog}.operational_status is still SCHEDULED"
            - "Program.${prog}.gross_attendance == 0 and survey_response_rate_pct == 0.0 — no close-out arithmetic ran"

      - name: cancel_on_an_already_cancelled_program_rejected_rather_than_repeated
        claim_type: idempotency
        grounds:
          - state_machines.Program.operational_status[DRAFT -> CANCELLED]
          - validations[priority=11]
        distinguishing_aspect: "cancel is not idempotent-by-replay: the second call returns ERR_PROGRAM_STATE_INVALID (409) and the closure_reason recorded by the first call is not overwritten."
        test_recipe:
          setup:
            - "A DRAFT program that has been cancelled once with closure_reason \"Presenter unavailable\"."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /library/programs/${prog}/cancel"
              payload: { closure_reason: "Presenter unavailable" }
              as: ProgramManager
          trigger:
            - call: "POST /library/programs/${prog}/cancel"
              payload: { closure_reason: "Duplicate request" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_PROGRAM_STATE_INVALID"
            - "Program.${prog}.closure_reason == \"Presenter unavailable\""
            - "Program.${prog}.operational_status == CANCELLED"

      - name: newly_created_entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Program.operational_status.initial_state
          - state_machines.Program.compliance_status.initial_state
          - state_machines.ReadingChallenge.status.initial_state
          - state_machines.RoomReservation.status.initial_state
          - state_machines.InventoryLot.status.initial_state
        distinguishing_aspect: "Every §1.2 machine starts where §1.2 declares: Program DRAFT + UNVERIFIED, ReadingChallenge PLANNING, RoomReservation HELD, InventoryLot ACTIVE, Presenter NONE + PROSPECT — none of them starts one step further along."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
          trigger:
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 40, attendance_cap: 50, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer 2026", logging_method: "MINUTES", unit_label: "minutes", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "SUPPLY", sku: "CRAFT-KIT", unit_cost_cents: 250, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
              captures: { lot: $.data.id }
            - call: "POST /library/presenters"
              payload: { legal_name: "Marisol Vega", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2027-01-01", quoted_fee_cents: 50000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
          assert:
            - "Program.${prog}.operational_status == DRAFT and Program.${prog}.compliance_status == UNVERIFIED"
            - "RoomReservation.${resv}.status == HELD"
            - "ReadingChallenge.${chal}.status == PLANNING and ReadingChallenge.${chal}.prize_inventory_posture == AMPLE"
            - "InventoryLot.${lot}.status == ACTIVE"
            - "Presenter.${pres}.screening_status == NONE and Presenter.${pres}.engagement_status == PROSPECT"

      - name: closed_out_program_rejects_a_later_weather_close
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Program.operational_status.terminal_states
          - validations[priority=11]
          - validations[priority=51]
        distinguishing_aspect: "CLOSED_OUT is terminal: a weather-close attempt returns ERR_PROGRAM_STATE_INVALID (409, priority 11) rather than ERR_WEATHER_WINDOW_PASSED (422, priority 51), and none of the close-out ledger movements are undone."
        test_recipe:
          setup:
            - "A CONFIRMED program at branch CEN drawing 10 CRAFT-KIT units at 250 cents (draw_subtotal 2500, contingency 250, materials_committed 2750), closed out at clock 2026-08-12T16:00:00.000Z with zero attendance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
