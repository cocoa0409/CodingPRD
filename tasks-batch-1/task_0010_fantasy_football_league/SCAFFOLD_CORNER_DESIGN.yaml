              as: Commissioner
              as_user_id: "c22"
              captures: { pa: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb", position: "RB", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c22"
              captures: { pb: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pc", position: "QB", nfl_team: "BUF", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "c22"
              captures: { pc: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pd", position: "RB", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c22"
              captures: { pd: $.data.id }
            - call: "POST /leagues/${l_id}/start-draft"
              payload: { expected_league_version: "${l_v}" }
              as: Commissioner
              as_user_id: "c22"
              captures: { l_v2: $.data.version }
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${pa}", round: 1, overall_pick: 1, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c22"
            - call: "POST /draft-picks"
