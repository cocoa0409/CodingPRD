      - name: enrollment_remediation_then_certified_loop
        claim_type: Valid Transition
        grounds:
          - state_machines.TrainingEnrollment.ENROLLED_to_REMEDIATION
          - state_machines.TrainingEnrollment.REMEDIATION_to_CERTIFIED
          - entities.Worker.fields.certifications
        distinguishing_aspect: "The training retry loop: score 70 on an ENROLLED enrollment routes to REMEDIATION (no certification yet); a second assessment of 85 from REMEDIATION certifies and upserts Worker.certifications with level 2 / CERTIFIED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory; ACTIVE worker Ada."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_w_std
            - &k_enr_loop
              call: "POST /footwear/training-enrollments"
              payload: { worker_id: "${w1}", operation: "STITCHING", target_level: 2 }
              as: TrainingCoordinator
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /footwear/training-enrollments/${e1}/record-assessment"
              payload: { score: 70 }
              as: TrainingCoordinator
              captures: { st_mid: $.data.status, at_mid: $.data.attempt_count }
            - call: "POST /footwear/training-enrollments/${e1}/record-assessment"
              payload: { score: 85 }
              as: TrainingCoordinator
              captures: { st_end: $.data.status, at_end: $.data.attempt_count }
            - call: "GET /footwear/workers/${w1}"
              payload: {}
              as: TrainingCoordinator
          assert:
            - "after score 70: st_mid == REMEDIATION, at_mid == 1, last_score == 70, and Worker.${w1}.certifications is still []"
            - "after score 85 from REMEDIATION: st_end == CERTIFIED, at_end == 2, version == 3"
            - "Worker.${w1}.certifications == [ { operation: STITCHING, level: 2, cert_status: CERTIFIED } ] (system upsert on the CERTIFIED transition)"

      - name: assessment_score_80_certifies_79_routes_to_remediation
        claim_type: Boundary / Edge
        grounds:
