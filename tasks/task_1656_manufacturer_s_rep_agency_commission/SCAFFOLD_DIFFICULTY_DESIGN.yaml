              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/project-registrations"
              payload: { principal_id: "${p1}", customer_id: "${c1}", family_code: "CONNECTORS", project_name: "Project Susp" }
              as: Rep
              as_user_id: "${r1}"
              captures: { reg1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/suspend"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /rep-agency/project-registrations/${reg1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/project-registrations/${reg1}/approve"
