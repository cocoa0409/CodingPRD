# =============================================================================
errors:
  # --- Authentication / authorization ---
  - id: ERR_MISSING_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is absent or empty"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The role in X-User-Role is not permitted on this operation"

  # --- Not found ---
  - id: ERR_HOSPITAL_NOT_FOUND
    http: 404
    condition: "No Hospital exists with the supplied id, or a network_hospital_ids entry does not resolve"

  - id: ERR_SURVEY_NOT_FOUND
    http: 404
    condition: "No Survey exists with the supplied id"

  - id: ERR_SURVEY_MEASURE_NOT_FOUND
    http: 404
    condition: "No SurveyMeasure exists with the supplied id"

  - id: ERR_METHODOLOGY_VERSION_NOT_FOUND
    http: 404
    condition: "No MethodologyVersion exists with the supplied id"

  - id: ERR_HOSPITAL_METHODOLOGY_VERSION_NOT_FOUND
    http: 404
    condition: "No HospitalMethodologyVersion exists with the supplied id"

  - id: ERR_PENDING_METHODOLOGY_CHANGE_NOT_FOUND
    http: 404
    condition: "No PendingMethodologyChange exists with the supplied id"

  - id: ERR_MEASURE_SET_NOT_FOUND
    http: 404
    condition: "No HospitalMeasureSet exists for the hospital and methodology version"

  - id: ERR_SCORE_RUN_NOT_FOUND
    http: 404
    condition: "No ScoreRun exists with the supplied id"

  - id: ERR_RELEASE_CYCLE_NOT_FOUND
    http: 404
    condition: "No ReleaseCycle exists with the supplied id"

  - id: ERR_GRADE_NOT_FOUND
    http: 404
    condition: "No Grade exists with the supplied id, or the grade is not in the named cycle"

  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No HospitalReview exists with the supplied id for this hospital"

  - id: ERR_CORRECTION_NOT_FOUND
    http: 404
    condition: "No CorrectionRequest exists with the supplied id for this review"

  - id: ERR_REANALYSIS_REQUEST_NOT_FOUND
    http: 404
    condition: "No ReanalysisRequest exists with the supplied id for this hospital"

  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "No Employer exists with the supplied id"

  # --- Required input / malformed ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is absent, has the wrong type, or fails a declared field constraint; also raised when a foreign-key-checked field named earlier in the input list is unknown"

  - id: ERR_INVALID_MINIMUM_LETTER
    http: 400
    condition: "minimum_acceptable_letter is not one of A | B | C | D"

  - id: ERR_REANALYSIS_SELECTOR_ARITY
    http: 400
    condition: "subset_selector carries fewer than 1 or more than 20 entries"

  - id: ERR_REANALYSIS_SELECTOR_UNRESOLVED
    http: 400
    condition: "A subset_selector entry names a measure_code or domain absent from the survey's pinned methodology version"

  - id: ERR_INVALID_TEACHING_STATUS
    http: 400
    condition: "teaching_status is not TEACHING or NON_TEACHING"

  - id: ERR_INVALID_CORRECTION_TYPE
    http: 400
    condition: "correction_type is not one of MEASURE_VALUE_ERROR | MEASURE_OMISSION | SOURCE_PROGRAM_MISMATCH"

  - id: ERR_DUPLICATE_CCN
    http: 409
    condition: "ccn already belongs to another Hospital"

  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_hospital_version does not equal the parent Hospital's current version"

  # --- Hospital-level state ---
  - id: ERR_HOSPITAL_NOT_ACTIVE
    http: 409
    condition: "Hospital.status is SUSPENDED; submissions, scoring and refresh are refused"

  - id: ERR_METHODOLOGY_VERSION_REQUIRED
    http: 409
    condition: "The hospital has no pinned methodology version, so a survey cannot capture one"

  - id: ERR_SNAPSHOT_ALREADY_CURRENT
    http: 409
    condition: "The logical clock instant equals measure_set.source_snapshot_at, so refresh would rewrite nothing"

  # --- Survey state ---
  - id: ERR_SURVEY_ALREADY_SUBMITTED
    http: 409
    condition: "survey.af_status is not AWAITING_SUBMISSION at submit time"

  - id: ERR_SURVEY_RESPONSE_COUNT_INCONSISTENT
    http: 409
    condition: "completed_survey_count exceeds started_survey_count, or started_survey_count is zero"

  - id: ERR_SURVEY_SAMPLE_DENOMINATOR_INVALID
    http: 409
    condition: "entity_annual_discharges is less than 1"

  - id: ERR_SURVEY_HAS_NO_MEASURES
    http: 409
    condition: "The survey has no SurveyMeasure rows at submit time"

  - id: ERR_SURVEY_OWNER_MISMATCH
    http: 403
    condition: "The acting X-User-ID is not survey.submitted_by_user_id"

  - id: ERR_SURVEY_NOT_IN_DISCREPANCY
    http: 409
    condition: "survey.af_status is not DISCREPANCY_OPEN at resolve time"

  - id: ERR_SURVEY_VERIFICATION_ALREADY_OPEN
    http: 409
    condition: "A verification decision is already recorded on this survey in its current state"

  - id: ERR_SELF_VERIFICATION_FORBIDDEN
    http: 403
    condition: "The verifying X-User-ID equals survey.submitted_by_user_id (segregation of duties)"

  - id: ERR_SOURCE_DOCUMENTATION_REQUIRED
    http: 409
    condition: "A measure lacks source_program_id and the survey carries no adopted supporting documentation"

  # --- Measure set / scoring ---
  - id: ERR_MEASURE_SET_NOT_READY
    http: 409
    condition: "HospitalMeasureSet.readiness_state is not READY, so the hospital cannot be scored"

  - id: ERR_MEASURE_SET_OMITTED
    http: 409
    condition: "HospitalMeasureSet.readiness_state is OMITTED_FROM_CYCLE because four or more measures were substituted"

  - id: ERR_CHAR_EXEMPTION_UNSUPPORTED
    http: 409
    condition: "A CHAR_EXEMPT run was requested for a hospital that does have verified or publicly sourced measures"

  - id: ERR_METHODOLOGY_INCOMPLETE
    http: 409
    condition: "The pinned methodology version's measure_definitions do not cover all five domains with positive weights"

  - id: ERR_MEASURE_CODE_NOT_IN_METHODOLOGY
    http: 409
    condition: "A measure_code in the payload is absent from the pinned methodology version's measure_definitions"

  # --- Methodology change management ---
  - id: ERR_METHODOLOGY_NOT_COMPARABLE
    http: 409
    condition: "methodology_comparability_index for the requested change is below 0.80"

  - id: ERR_METHODOLOGY_UNCHANGED
    http: 409
    condition: "The requested methodology version equals the version already in scope for the operation"

  # --- Reanalysis ---
  - id: ERR_REANALYSIS_NOT_UNDER_REVIEW
    http: 409
    condition: "The reanalysis request is not in UNDER_REVIEW when a GRANT or REFUTE is attempted"

  - id: ERR_REANALYSIS_SURVEY_MISMATCH
    http: 409
    condition: "The reanalysis request does not reference the survey named in the operation"

  - id: ERR_REANALYSIS_REFERENCE_STALE
    http: 409
    condition: "The survey's pinned methodology version differs from the hospital's currently pinned version"

  - id: ERR_REANALYSIS_DOCUMENTS_INSUFFICIENT
    http: 409
    condition: "Fewer than six distinct document codes were supplied to support the grant"

  - id: ERR_REANALYSIS_REGRESSION_FORBIDDEN
    http: 403
    condition: "The requested adjusted_delta would lower the hospital's composite score"

  - id: ERR_HOSPITAL_OWNER_MISMATCH
    http: 403
    condition: "The acting X-User-ID does not correspond to the hospital named in the path"

  # --- Release cycle / grades ---
  - id: ERR_CYCLE_NOT_DRAFT
    http: 409
    condition: "The release cycle is not DRAFT when review is opened"

  - id: ERR_CYCLE_HAS_NO_GRADES
    http: 409
    condition: "The release cycle has zero Grade rows"

  - id: ERR_CYCLE_NOT_OPEN_FOR_CORRECTIONS
    http: 409
    condition: "The release cycle's state is not OPEN_REVIEW, so corrections cannot be accepted"

  - id: ERR_CORRECTION_WINDOW_CLOSED
    http: 409
    condition: "The logical clock instant is at or after the cycle's correction_window_ends_at"

  - id: ERR_CORRECTIONS_PENDING
    http: 409
    condition: "A CorrectionRequest in the cycle is still PENDING, so the correction stage cannot close"

  - id: ERR_REVIEWS_PENDING
    http: 409
    condition: "A HospitalReview in the cycle is still PENDING, so the cycle cannot reach EMBARGOED or PUBLISHED"

  - id: ERR_CYCLE_NOT_OPEN_FOR_CORRECTIONS
    http: 409
    condition: "The release cycle's state is not OPEN_REVIEW, so no new correction can be filed or decided"

  - id: ERR_CORRECTION_NOT_PENDING
    http: 409
    condition: "The CorrectionRequest is not PENDING when a decision is posted against it"

  - id: ERR_CORRECTION_MEASURE_NOT_CHALLENGED
    http: 409
    condition: "corrected_measure_codes includes a measure the parent review never challenged"

  - id: ERR_CYCLE_PUBLICATION_WINDOW_TOO_CLOSE
    http: 409
    condition: "A new release cycle's publication_date sits less than 30 days from the publication_date of a cycle bound to a different methodology version"

  - id: ERR_BENEFIT_WINDOW_CONTAINMENT_CONFLICT
    http: 409
    condition: "The submitted benefit-design window strictly contains another Employer's window in the same purchaser_type and minimum_acceptable_letter scope"

  - id: ERR_BENEFIT_WINDOW_INVALID
    http: 400
    condition: "benefit_window_to is not strictly greater than benefit_window_from"

  - id: ERR_EMBARGO_ACTIVE
    http: 409
    condition: "The logical clock instant is strictly before the cycle's publication_date"

  - id: ERR_CYCLE_ALREADY_PUBLISHED
    http: 409
    condition: "The release cycle is already PUBLISHED; no further scoring or correction is accepted"

  - id: ERR_CYCLE_GRADES_UNRESOLVED
    http: 409
    condition: "A Grade in the cycle is WITHHELD with no recorded reason, or is still in an unresolved state"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RatingAdmin
    description: "Methodology owner: registers hospitals, authors and publishes methodology versions, configures release cycles. Cannot verify surveys or decide reanalysis — that is the analyst's call."
    identity: opaque
    exclusive_operations:
      - "POST /methodology-versions — author a methodology version"
      - "POST /methodology-versions/{id}/publish — publish a version"
      - "POST /hospitals — register a hospital"
      - "PUT /hospitals/{id} — update hospital attributes"
      - "POST /hospitals/{id}/methodology-versions — pin a methodology version"
      - "POST /release-cycles — create a release cycle"
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "POST /hospitals/{id}/pending-methodology-changes — raise a methodology change"

  - name: HospitalRespondent
    description: "The hospital's own survey contact: opens and submits surveys, records measures, responds to discrepancies, files corrections and reanalysis requests, accepts preliminary results."
    identity: entity_backed:Hospital
    exclusive_operations:
      - "POST /hospitals/{id}/surveys — open a survey"
      - "PUT /surveys/{id} — correct respondent counts"
      - "POST /hospitals/{id}/survey-measures — record a measure"
      - "POST /surveys/{id}/submit — submit"
      - "POST /surveys/{id}/resolve — resolve a discrepancy"
      - "POST /hospitals/{id}/preliminary-results/{reviewId}/corrections — file a correction"
      - "POST /hospitals/{id}/reanalysis-requests — raise a reanalysis request"
      - "POST /hospitals/{id}/reanalysis-requests/{requestId}/decide with decision=WITHDRAW"
    shared_operations:
      - "POST /hospitals/{id}/pending-methodology-changes — raise a methodology change"
      - "POST /hospitals/{id}/preliminary-results/{reviewId}/accept — accept the preliminary result"

  - name: VerificationAnalyst
    description: "Independent verifier: verifies surveys, opens preliminary-result reviews, decides reanalysis requests and methodology-change reviews. Must never be the survey's own submitter."
    identity: opaque
    exclusive_operations:
      - "POST /surveys/{id}/verify — verify or dispute a survey"
      - "POST /hospitals/{id}/preliminary-results — open a review"
      - "POST /hospitals/{id}/reanalysis-requests/{requestId}/decide with decision=START_REVIEW | GRANT | REFUTE"
      - "POST /pending-methodology-changes/{id}/review — decide a methodology change"

  - name: RatingEngine
    description: "Operational scoring worker: rematerialises measure sets, cuts score runs, opens and publishes release cycles, and decides filed corrections. Holds no verification or methodology-authoring authority."
    identity: opaque
    exclusive_operations:
      - "POST /hospitals/{id}/refresh-measures — rematerialise a measure set"
      - "POST /hospitals/{id}/score-runs — score a hospital"
      - "POST /release-cycles/{id}/open-review — open the review window"
      - "POST /release-cycles/{id}/publish — publish the cycle"
      - "POST /hospitals/{id}/preliminary-results/{reviewId}/corrections/{correctionId}/decide — decide a filed correction"

  - name: PurchaserAdmin
    description: "Employer or coalition benefits administrator: maintains network listings and minimum acceptable letter for benefit design."
    identity: entity_backed:Employer
    exclusive_operations:
      - "POST /employers — register a purchaser"
      - "POST /employers/{id}/network-listings — set the network and minimum letter"
    shared_operations: []

  - name: AnyAuthenticated
    description: "Any role holding a valid X-User-ID and X-User-Role. Read-only access to the published and preliminary surfaces."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /hospitals"
      - "GET /hospitals/{id}"
      - "GET /methodology-versions and /methodology-versions/{id}"
      - "GET /surveys/{id}"
      - "GET /hospitals/{id}/composite-preview"
      - "GET /hospitals/{id}/scorecard"
      - "GET /hospitals/{id}/review-summary"
      - "GET /release-cycles and /release-cycles/{id}"
      - "GET /release-cycles/{id}/grades"
      - "GET /grades/{id}"
      - "GET /employers, /employers/{id}, /hospitals/{id}/employers"
      - "GET every hospital child collection listed in §1.5"