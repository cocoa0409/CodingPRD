              as: TourAccountant
              captures: { dn_bl_id: $.data.id }
          trigger:
            - call: "POST /markets"
              payload: { name: "Buyer Market", region_code: "BM", guarantee_exposure_limit_cents: 1000000 }
              as: TalentBuyer
              captures: { dn_err_1: $.data.error_id }
            - call: "POST /shows/${dn_sh_id}/exposure-override"
              payload: { exposure_override_limit_cents: 9000000, exposure_override_justification: "I would like more room" }
              as: TalentBuyer
              captures: { dn_err_2: $.data.error_id }
            - call: "POST /shows"
              payload: { artist_id: "${dn_ar_id}", venue_id: "${dn_vn_id}", event_at: "2026-12-09T02:00:00.000Z", load_in_at: "2026-12-08T14:00:00.000Z", load_out_at: "2026-12-09T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TourAccountant
