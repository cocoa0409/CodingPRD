  # =======================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cycle_charge_requires_account_status_active
        grounds:
          - validations[priority=20]
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Cycle.UNCHARGED_to_CHARGED
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: |
          ENTITY PAIR Cycle -> Account: the Cycle's UNCHARGED -> CHARGED transition is legal on the
          Cycle's own axis (status ALLOCATED, payment_status UNCHARGED) yet is refused purely
          because the parent Account moved to SUSPENDED.
        test_recipe:
          setup:
            - "One verified account with an ACTIVE subscription and one ALLOCATED, UNCHARGED cycle priced at 2999."
            - "SupportAgent then suspends the account with a stated reason."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Plan", default_pack_count: 2, promo_discount_pct: 0, allows_hypoallergenic: true }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /skus"
              payload: { code: "S2-STD-60", name: "Stage 2 Standard 60", stage: "S2", line: "STANDARD", pack_price_cents: 1200, pack_size_units: 60, allergen_tags: [], stock_packs: 50 }
              as: OpsAdmin
              captures: { sku_std: $.data.id }
            - call: "POST /accounts"
              payload: { email: "susp@example.com", full_name: "Suspended Household", payment_method_on_file: true }
              as: Anonymous
              captures: { acct_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /accounts/${acct_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /children"
              payload: { account_id: "${acct_id}", name: "Rin", birth_date: "2025-11-01", weight_grams: 7000 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /accounts/${acct_id}/suspend"
              payload: { reason: "Payment dispute under review" }
              as: SupportAgent
              as_user_id: "cs-1"
          trigger:
            - call: "POST /cycles/${c1}/charge"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_NOT_ACTIVE"
            - "HTTP status is 409"
            - "Cycle.${c1}.payment_status == UNCHARGED"
            - "Cycle.${c1}.charged_cash_cents == 0"
            - "Account.${acct_id}.status == SUSPENDED"

      - name: referral_vests_on_delivery_not_on_dispatch
        grounds:
          - state_machines.Referral.PENDING_to_VESTED
          - state_machines.Cycle.CUTOFF_LOCKED_to_DISPATCHED
          - state_machines.Cycle.DISPATCHED_to_DELIVERED
          - calculations.referral_credit_amount_cents
        distinguishing_aspect: |
          ENTITY PAIR Referral -> Cycle, a different pair from Cycle -> Account: the Referral stays
          PENDING while the referee's cycle is merely DISPATCHED and flips to VESTED only once that
          same cycle reaches DELIVERED, issuing exactly 1500 cents outside the promotional window.
        test_recipe:
          setup:
            - "Referrer A verified on 2026-06-01T00:00:00Z; referee B signed up with A's referral_code, producing a PENDING Referral."
            - "B's first cycle is allocated, locked, charged and DISPATCHED on 2026-06-08T00:00:00Z but not yet delivered."
