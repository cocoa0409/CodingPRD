            - call: "POST /v1/transfer-requests"
              payload: { vehicle_id: "${veh_a}", customer_id: "${cust1}", to_store_id: "${s_dal}", supersedes_request_id: "${tr1}", expected_vehicle_version: "${veh_a_v0}" }
              as: Customer
