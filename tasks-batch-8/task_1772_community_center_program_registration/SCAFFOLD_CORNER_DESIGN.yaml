            - { call: "POST /class-sessions", payload: { program_id: "${pg2}", instructor_id: "${ins}", title: "B1", capacity: 5, min_enrollment: 1, fee_resident_cents: 1000, fee_nonresident_cents: 1000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator }
