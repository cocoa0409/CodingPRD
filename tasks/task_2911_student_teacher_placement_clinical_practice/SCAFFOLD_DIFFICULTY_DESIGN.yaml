          excluded_cooperating_teacher_ids; hop 4 the vacated placement re-derives the agreement seat
          ledger, the teacher's active_placement_count and the supervisor's caseload_points to zero.
          Each hop is caused strictly by the previous one - nothing in the suspend payload names a
          placement, a request or a supervisor. The sibling cascade starts from an assessment score and
          propagates the other way, through the clinical dimension into observation scheduling.
