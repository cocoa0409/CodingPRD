            - call: "POST /coating/projects"
              payload: { project_name: "OCC Project", owner_name: "Owner", jurisdiction_code: "US-CA-SCAQMD", asset_type: "BRIDGE", warranty_budget_cents: 50000000 }
              as: ProjectEngineer
              captures:
                proj_id: $.data.id
                proj_v_stale: $.data.version
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${cs_id}", application_method: "SPRAY_AIRLESS" }
              as: ProjectEngineer
              captures:
                spec1_id: $.data.id
            - call: "POST /coating/projects/${proj_id}/specifications/${spec1_id}/issue"
              payload: { expected_project_version: "${proj_v_stale}" }
              as: ProjectEngineer
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${cs_id}", application_method: "SPRAY_AIRLESS", supersedes_specification_id: "${spec1_id}" }
              as: ProjectEngineer
              captures:
                spec2_id: $.data.id
          trigger:
            - call: "POST /coating/projects/${proj_id}/specifications/${spec2_id}/issue"
              payload: { expected_project_version: "${proj_v_stale}" }
              as: ProjectEngineer
          assert:
            - "HTTP 412 with error_id ERR_STALE_VERSION (proj_v_stale is one behind after the first issue bumped Project.version)"
            - "spec2 remains DRAFT on a follow-up GET"

      - name: spec_issue_correct_project_version_succeeds
        claim_type: optimistic_concurrency_success
        grounds:
          - "concurrency_rules[spec-issue-stale-project]"
        distinguishing_aspect: "Positive control: issuing with the CURRENT expected_project_version succeeds and advances Project.version by 1 — the OCC field is an enabler, not a blanket rejection."
        test_recipe:
          setup:
            - "clock; regulation; coating system; project PLANNING; one DRAFT spec; current project version captured via GET"
          setup_api_calls:
            - call: "POST /coating/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coating/voc-regulations"
              payload: { jurisdiction_code: "US-CA-SCAQMD", application_method: "SPRAY_AIRLESS", voc_limit_gpl: 340, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /coating/coating-systems"
              payload: { system_code: "SW-OCC-2", manufacturer_name: "SW", surface_prep_standard: "SSPC_SP10_NEAR_WHITE", min_surface_profile_mils: 2.0, max_surface_profile_mils: 4.0, coat_count: 3, total_dft_min_mils: 9.0, total_dft_max_mils: 15.0, base_voc_gpl: 250, thinner_voc_gpl: 420, max_thinner_pct: 0.10, adhesion_min_psi: 500 }
              as: TechnicalServiceEngineer
              captures:
                cs_id: $.data.id
            - call: "POST /coating/projects"
              payload: { project_name: "OCC Project 2", owner_name: "Owner", jurisdiction_code: "US-CA-SCAQMD", asset_type: "BRIDGE", warranty_budget_cents: 50000000 }
              as: ProjectEngineer
              captures:
                proj_id: $.data.id
                proj_v0: $.data.version
            - call: "POST /coating/projects/${proj_id}/specifications"
              payload: { coating_system_id: "${cs_id}", application_method: "SPRAY_AIRLESS" }
              as: ProjectEngineer
              captures:
                spec_id: $.data.id
          trigger:
            - call: "POST /coating/projects/${proj_id}/specifications/${spec_id}/issue"
              payload: { expected_project_version: "${proj_v0}" }
              as: ProjectEngineer
              captures:
                issued: $.data.status
          assert:
