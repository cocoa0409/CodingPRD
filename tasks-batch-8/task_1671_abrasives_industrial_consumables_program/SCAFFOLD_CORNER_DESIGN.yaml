              captures: { err2: $.data.error_id }
          assert:
            - "BlanketOrder.${bo_id}.substitution_status == PENDING after discontinuation"
            - "New release create: HTTP 409 ERR_SUBSTITUTION_PENDING"
            - "Pick on the ON_HOLD release: HTTP 409 ERR_INVALID_STATE_TRANSITION"
            - "Release.${rel_id}.status remains ON_HOLD; BlanketOrder.remaining_qty remains 45"

      - name: pick_empty_pool_rejected
        claim_type: precondition_enforcement
        grounds:
