scaffold_difficulty_design:
  # ==================================================================
  # Rule 1: dual_variant_calc (two different entity domains)
  # ==================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trade_in_provisional_vs_final_valuation
        grounds:
          - calculations.trade_in_valuation
          - state_machines.TradeInAppraisal.SUBMITTED_to_OFFERED
          - entities.TradeInAppraisal.fields.provisional_value_cents
          - entities.TradeInAppraisal.fields.final_value_cents
        distinguishing_aspect: |
          Entity domain: TradeInAppraisal. PROVISIONAL (desktop, self-reported) and
          FINAL (in-shop, reconditioning + market adjustment) are two valid valuations
          of the SAME instrument data and MUST differ: provisional 1862000 vs final 1883200.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01 (year 2026); one INDIVIDUAL customer; one GRAND trade-in built 2016, condition GOOD (age 10, age_factor 0.70, wear 5%)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Ann Avery", email: "ann@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals"
              payload: { customer_id: "${c_id}", category: "GRAND", manufacturer: "Steinway", model: "D", year_built: 2016, condition_grade: "GOOD" }
              as: SalesAssociate
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/evaluate"
              payload: { reconditioning_cost_cents: 150000, market_adjustment_pct: 0.10 }
              as: StoreManager
          assert:
            - "TradeInAppraisal.${a_id}.provisional_value_cents == 1862000"
            - "TradeInAppraisal.${a_id}.final_value_cents == 1883200"
            - "TradeInAppraisal.${a_id}.final_value_cents != TradeInAppraisal.${a_id}.provisional_value_cents"
            - "TradeInAppraisal.${a_id}.status == OFFERED"

      - name: consignment_gross_vs_net_split
        grounds:
          - calculations.consignment_payout
          - state_machines.Instrument.RESERVED_to_SOLD
          - entities.Consignor.fields.outstanding_payout_cents
          - entities.Consignor.fields.split_mode
        distinguishing_aspect: |
          Entity domain: Consignor payout ledger on Instrument sale (different domain from
          TradeInAppraisal valuation). For an identical 2000000-cent sale, GROSS_SPLIT pays
          1600000 while NET_SPLIT (recoverable_costs 80000) pays 1536000.
        test_recipe:
          setup:
            - "Two consignors, both commission_pct 0.20: G with split_mode GROSS_SPLIT, N with NET_SPLIT"
            - "Two CONSIGNMENT instruments, each list 2000000 / floor 1500000; N's instrument carries recoverable_costs_cents 80000; both listed AVAILABLE"
            - "One INDIVIDUAL customer; G's order created and PAID_IN_FULL (payout already posted)"
          setup_api_calls:
            - call: "POST /piano-dealer/consignors"
              payload: { full_name: "Gail Gross", email: "g@x.com", commission_pct: 0.20, split_mode: "GROSS_SPLIT", payout_method: "ACH" }
              as: StoreManager
              captures: { g_id: $.data.id }
            - call: "POST /piano-dealer/consignors"
              payload: { full_name: "Ned Net", email: "n@x.com", commission_pct: 0.20, split_mode: "NET_SPLIT", payout_method: "WIRE" }
              as: StoreManager
              captures: { n_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-G-1", category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 2010, condition_grade: "GOOD", acquisition_type: "CONSIGNMENT", consignor_id: "${g_id}", list_price_cents: 2000000, floor_price_cents: 1500000 }
              as: StoreManager
              captures: { ig_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-N-1", category: "GRAND", manufacturer: "Steinway", model: "B", year_built: 2011, condition_grade: "GOOD", acquisition_type: "CONSIGNMENT", consignor_id: "${n_id}", list_price_cents: 2000000, floor_price_cents: 1500000, recoverable_costs_cents: 80000 }
              as: StoreManager
              captures: { in_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${ig_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/instruments/${in_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Carl Buyer", email: "carl@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${ig_id}", unit_price_cents: 2000000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { og_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${og_id}/payments"
              payload: { amount_cents: 2015000, method: "CARD" }
              as: SalesAssociate
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${in_id}", unit_price_cents: 2000000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { on_id: $.data.id }
          trigger:
            - call: "POST /piano-dealer/sales-orders/${on_id}/payments"
              payload: { amount_cents: 2015000, method: "CARD" }
              as: SalesAssociate
          assert:
            - "Consignor.${g_id}.outstanding_payout_cents == 1600000"
            - "Consignor.${n_id}.outstanding_payout_cents == 1536000"
            - "Instrument.${ig_id}.status == SOLD and Instrument.${in_id}.status == SOLD"
            - "1600000 - 1536000 == 64000 (recoverable costs taxed only in NET_SPLIT)"

  # ==================================================================
  # Rule 2: combinatorial_formula (different modes: (a) vs (b))
  # ==================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: institutional_bid_tier_multiplier_ceiling
        grounds:
          - calculations.institutional_bid_price
          - entities.BidPackage.fields.total_cents
          - entities.Customer.fields.state_contract_ceiling_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — quantity tier selection (4 units
          hits the 8% tier), institution-type multiplier (EDUCATION 0.95), and a nested min()
          against the customer's state-contract ceiling (1700000 caps the 1748000 multiplied price).
        test_recipe:
          setup:
            - "INSTITUTIONAL EDUCATION customer with state_contract_ceiling_cents 1700000"
            - "Four NEW instruments, each list 500000 / floor 300000 (floor sum 1200000 < bid total)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "State University", email: "purchasing@su.edu", customer_type: "INSTITUTIONAL", institution_type: "EDUCATION", tax_exempt: true, state_contract_ceiling_cents: 1700000, credit_limit_cents: 0 }
              as: SalesAssociate
              captures: { cu_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-B-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { b1: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-B-2", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { b2: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-B-3", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { b3: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-B-4", category: "UPRIGHT", manufacturer: "Yamaha", model: "U1", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 300000 }
              as: StoreManager
              captures: { b4: $.data.id }
          trigger:
            - call: "POST /piano-dealer/bid-packages"
              payload: { customer_id: "${cu_id}", lines: [{ instrument_id: "${b1}", unit_price_cents: 500000 }, { instrument_id: "${b2}", unit_price_cents: 500000 }, { instrument_id: "${b3}", unit_price_cents: 500000 }, { instrument_id: "${b4}", unit_price_cents: 500000 }] }
              as: InstitutionalBidOfficer
              captures: { bid_id: $.data.id }
          assert:
            - "BidPackage.${bid_id}.quantity == 4"
            - "BidPackage.${bid_id}.subtotal_cents == 2000000"
            - "BidPackage.${bid_id}.tier_discount_pct == 0.08"
            - "BidPackage.${bid_id}.institution_multiplier == 0.95"
            - "BidPackage.${bid_id}.total_cents == 1700000 (min(1748000, ceiling 1700000); uncapped value 1748000 must NOT be returned)"

      - name: order_total_per_line_rounding_then_sum
        grounds:
          - calculations.order_total
          - calculations.delivery_fee
          - entities.SalesOrder.fields.subtotal_cents
          - entities.SalesOrder.fields.trade_in_credit_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is normative — per-line round_half_up THEN sum gives
          subtotal 600000; the alternative sum-then-round gives 599999. Trade-in cap (40% of
          subtotal = 240000) then clamps the 630000 appraisal; tax applies to the post-credit base.
        test_recipe:
          setup:
            - "One INDIVIDUAL customer; two NEW instruments each unit 333333 with 10% line discount"
            - "An ACCEPTED appraisal with final_value_cents 630000 (UPRIGHT 2016 EXCELLENT: provisional 630000, evaluate reconditioning 0 / adjustment 0.0)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Rita Round", email: "rita@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals"
              payload: { customer_id: "${c_id}", category: "UPRIGHT", manufacturer: "Kawai", model: "K300", year_built: 2016, condition_grade: "EXCELLENT" }
              as: SalesAssociate
              captures: { a_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/evaluate"
              payload: { reconditioning_cost_cents: 0, market_adjustment_pct: 0.0 }
              as: StoreManager
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/accept"
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-R-1", category: "GRAND", manufacturer: "Steinway", model: "M", year_built: 2023, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 333333, floor_price_cents: 1 }
              as: StoreManager
              captures: { r1: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-R-2", category: "GRAND", manufacturer: "Steinway", model: "M", year_built: 2023, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 333333, floor_price_cents: 1 }
              as: StoreManager
              captures: { r2: $.data.id }
            - call: "POST /piano-dealer/instruments/${r1}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/instruments/${r2}/list-for-sale"
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${r1}", unit_price_cents: 333333, discount_pct: 0.10 }, { instrument_id: "${r2}", unit_price_cents: 333333, discount_pct: 0.10 }], trade_in_appraisal_id: "${a_id}", tax_rate: 0.08, distance_miles: 30, stairs_count: 2, climate_controlled_required: true }
              as: SalesAssociate
              captures: { o_id: $.data.id }
          assert:
            - "SalesOrder.${o_id}.subtotal_cents == 600000 (per-line 300000 + 300000; sum-then-round 599999 is WRONG)"
            - "SalesOrder.${o_id}.trade_in_credit_cents == 240000 (min(630000, round(0.40 * 600000)))"
            - "SalesOrder.${o_id}.delivery_fee_cents == 52000 (15000 + 2*2500 + 12000 + 20000)"
            - "SalesOrder.${o_id}.tax_cents == 28800 (round(360000 * 0.08))"
            - "SalesOrder.${o_id}.total_cents == 440800"

  # ==================================================================
  # Rule 3: non_linear_state_machine (different entities)
  # ==================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appraisal_counter_loop_cycle
        grounds:
          - state_machines.TradeInAppraisal.OFFERED_to_COUNTERED
          - state_machines.TradeInAppraisal.COUNTERED_to_OFFERED
        distinguishing_aspect: |
          Cyclic machine on TradeInAppraisal: OFFERED -> COUNTERED -> OFFERED loop; the second
          evaluate recomputes final_value_cents (580000) and refreshes offered_at, proving the
          loop is a real re-entry rather than a one-way pipeline.
        test_recipe:
          setup:
            - "Customer with an UPRIGHT 2016 EXCELLENT appraisal evaluated to OFFERED (final 630000)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Connie Counter", email: "connie@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals"
              payload: { customer_id: "${c_id}", category: "UPRIGHT", manufacturer: "Kawai", model: "K300", year_built: 2016, condition_grade: "EXCELLENT" }
              as: SalesAssociate
              captures: { a_id: $.data.id }
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/evaluate"
              payload: { reconditioning_cost_cents: 0, market_adjustment_pct: 0.0 }
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/counter"
              payload: { counter_value_cents: 650000 }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /piano-dealer/trade-in-appraisals/${a_id}/evaluate"
              payload: { reconditioning_cost_cents: 50000, market_adjustment_pct: 0.0 }
              as: StoreManager
          assert:
            - "After counter: TradeInAppraisal.${a_id}.status == COUNTERED and counter_value_cents == 650000"
            - "After re-evaluate: TradeInAppraisal.${a_id}.status == OFFERED (cycle re-entry)"
            - "TradeInAppraisal.${a_id}.final_value_cents == 580000 (round((630000 - 50000) * 1.0))"

      - name: order_parallel_payment_and_fulfillment_dims
        grounds:
          - state_machines.SalesOrder.payment_status
          - state_machines.SalesOrder.fulfillment_status
          - state_machines.DeliveryJob.SCHEDULED_to_EN_ROUTE
        distinguishing_aspect: |
          Parallel state dimensions on SalesOrder: fulfillment can advance AWAITING_SCHEDULING ->
          DELIVERY_SCHEDULED -> OUT_FOR_DELIVERY -> DELIVERED while payment_status stays
          DEPOSIT_PAID, and payment later completes independently — the two dims evolve without
          blocking each other beyond the scheduling gate.
        test_recipe:
          setup:
            - "Customer; one AVAILABLE NEW instrument (500000/400000); order total 515000 (fee 15000, tax 0)"
            - "A climate-certified crew exists"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Pat Parallel", email: "pat@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-P-1", category: "GRAND", manufacturer: "Steinway", model: "O", year_built: 2022, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Alpha", climate_certified: true }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 200000, method: "CARD" }
              as: SalesAssociate
              captures: { dep_pay: $.data.payment_status, dep_ful: $.data.fulfillment_status }
          trigger:
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-06-01T09:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 315000, method: "CARD" }
              as: SalesAssociate
          assert:
            - "Deposit response: payment_status == DEPOSIT_PAID while fulfillment_status == AWAITING_SCHEDULING (${dep_pay}/${dep_ful})"
            - "After job complete (before final payment): order fulfillment_status == DELIVERED while payment_status == DEPOSIT_PAID"
            - "Final: SalesOrder.${o_id}.payment_status == PAID_IN_FULL and fulfillment_status == DELIVERED"
            - "Instrument.${i_id}.status == DELIVERED"

  # ==================================================================
  # Rule 4: transitive_cascade (different triggers; depths 3 and 2)
  # ==================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_return_cascade_depth3
        grounds:
          - state_machines.SalesOrder.fulfillment_status.INSTALLED_to_RETURNED
          - state_machines.Instrument.DELIVERED_to_IN_PREP
          - state_machines.WarrantyRegistration.REGISTERED_to_VOID
          - entities.Customer.fields.risk_score
        distinguishing_aspect: |
          Depth-3 chain from POST /sales-orders/{id}/complete-return: order -> RETURNED/REFUNDED
          causes line instrument -> IN_PREP (link 1), which causes its REGISTERED warranty -> VOID
          (link 2), which causes Customer.risk_score 700 -> 675 (link 3). Each hop is caused by the
          previous hop's mutation, not by the original request.
        test_recipe:
          setup:
            - "Customer (risk_score 700); order (500000 line, total 515000) PAID_IN_FULL, delivered 2026-05-10 and INSTALLED same day"
            - "WarrantyRegistration REGISTERED for the line instrument"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Wendy Return", email: "wendy@x.com", customer_type: "INDIVIDUAL" }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-W-1", category: "GRAND", manufacturer: "Steinway", model: "A", year_built: 2021, condition_grade: "GOOD", acquisition_type: "NEW", list_price_cents: 500000, floor_price_cents: 400000 }
              as: StoreManager
              captures: { i_id: $.data.id }
            - call: "POST /piano-dealer/instruments/${i_id}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i_id}", unit_price_cents: 500000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o_id}/payments"
              payload: { amount_cents: 515000, method: "BANK_TRANSFER" }
              as: SalesAssociate
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Beta", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /piano-dealer/delivery-jobs"
              payload: { order_id: "${o_id}", crew_id: "${cr_id}", window_start: "2026-05-10T09:00:00Z", window_end: "2026-05-10T12:00:00Z" }
              as: ServiceCoordinator
              captures: { j_id: $.data.id }
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/start"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/delivery-jobs/${j_id}/complete"
              as: ServiceCoordinator
            - call: "POST /piano-dealer/sales-orders/${o_id}/confirm-installation"
              as: StoreManager
            - call: "POST /piano-dealer/warranty-registrations"
              payload: { order_id: "${o_id}", instrument_id: "${i_id}" }
              as: SalesAssociate
              captures: { w_id: $.data.id }
            - call: "POST /piano-dealer/warranty-registrations/${w_id}/confirm"
              as: StoreManager
          trigger:
            - call: "POST /piano-dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /piano-dealer/sales-orders/${o_id}/complete-return"
              as: StoreManager
          assert:
            - "SalesOrder.${o_id}.fulfillment_status == RETURNED and payment_status == REFUNDED"
            - "Instrument.${i_id}.status == IN_PREP (cascade link 1)"
            - "WarrantyRegistration.${w_id}.status == VOID (cascade link 2)"
            - "Customer.${c_id}.risk_score == 675 (cascade link 3: 700 - 25)"

      - name: financing_default_repossession_cascade_depth2
        grounds:
          - state_machines.FinancingAgreement.ACTIVE_to_DEFAULTED
          - state_machines.SalesOrder.payment_status.FINANCED_ACTIVE_to_COLLECTIONS
          - state_machines.Instrument.DELIVERED_to_REPOSSESSION_HOLD
          - calculations.financing_schedule
        distinguishing_aspect: |
          Depth-2 chain from POST /financing-agreements/{id}/declare-default (a DIFFERENT trigger
          from complete-return): agreement -> DEFAULTED causes order.payment_status -> COLLECTIONS
          (link 1), which causes the delivered instrument -> REPOSSESSION_HOLD (link 2); risk_score
          drops 700 -> 550 as part of the same terminal hop.
        test_recipe:
          setup:
            - "Customer with credit_limit_cents 1000000; order (600000 line, total 615000) financed RENT_TO_OWN (principal 615000, term 36, monthly 7380), APPROVED at default clock 2026-05-01"
            - "Order delivered (instrument DELIVERED); clock then advanced to 2026-09-01 (4 whole months elapsed, 0 payments => missed_payments 4 >= 3)"
          setup_api_calls:
            - call: "POST /piano-dealer/customers"
              payload: { full_name: "Doug Default", email: "doug@x.com", customer_type: "INDIVIDUAL", credit_limit_cents: 1000000 }
              as: SalesAssociate
              captures: { c_id: $.data.id }
            - call: "POST /piano-dealer/instruments"
              payload: { serial_number: "SN-D-1", category: "UPRIGHT", manufacturer: "Yamaha", model: "U3", year_built: 2023, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 600000, floor_price_cents: 500000 }
              as: StoreManager
              captures: { i_id: $.data.id }
