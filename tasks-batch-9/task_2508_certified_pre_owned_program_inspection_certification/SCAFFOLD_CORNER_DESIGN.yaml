  # ===========================================================================
  # 8. From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: both_occ_rules_reject_stale_parent_versions
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.certification-create-stale-vehicle
          - concurrency_rules.listing-syndicate-stale-certification
          - errors.ERR_STALE_VEHICLE_VERSION
          - errors.ERR_STALE_CERTIFICATION_VERSION
        distinguishing_aspect: |
          Both declared concurrency rules are driven with a version that was genuinely fresh when the
          caller read it and was invalidated by an ordinary program action - opening the inspection for
          the vehicle rule, and the first syndication for the certification rule. The certification rule
          is the sharper one: syndication bumps Certification.version as a side effect, so a client that
          replays its own successful syndicate payload is stale against itself, and re-syndication must
          be forced to re-read rather than silently republishing an old snapshot.
        test_recipe:
          setup:
            - "Dealer D1, technician T1, published MPI-172 with P1, vehicle V1 whose version is captured at creation, and a PASSED inspection I1 - the inspection creation is what invalidates the captured vehicle version."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000036", model_year: 2023, in_service_date: "2023-05-10", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id, ver0: $.data.version }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
          trigger:
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${ver0}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ver1: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${ver1}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /cpo/certifications/${c1}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
              captures: { cver1: $.data.version }
            - call: "POST /cpo/listings"
              payload: { certification_id: "${c1}", channel: "OEM_SITE", price_cents: 2895000, disclosure_fields: ["CERTIFIED_BADGE", "WARRANTY_END_DATE", "INSPECTION_DATE", "CERTIFICATION_NUMBER"] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { l1: $.data.id }
            - call: "POST /cpo/listings/${l1}/syndicate"
              payload: { expected_certification_version: "${cver1}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { snap1: $.data.syndicated_snapshot_version }
            - call: "POST /cpo/listings/${l1}/syndicate"
              payload: { expected_certification_version: "${cver1}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/certifications/${c1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { cver2: $.data.version }
            - call: "POST /cpo/listings/${l1}/syndicate"
              payload: { expected_certification_version: "${cver2}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { snap2: $.data.syndicated_snapshot_version }
            - call: "POST /cpo/vehicles/${v1}/history-events"
              payload: { event_type: "ODOMETER_UPDATE", odometer_miles: 30500 }
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "trigger call 1 returns 412 ERR_STALE_VEHICLE_VERSION: ${ver0} was current when the vehicle was created, and opening the inspection bumped it"
            - "trigger call 1 creates nothing - Dealer.${d1}.lifetime_submitted_count is still 0 and no Certification row exists for ${v1}"
            - "trigger call 3 with the re-read ${ver1} succeeds, so the guard is a version comparison and not a blanket refusal"
            - "trigger call 6 returns 200 with status SYNDICATED and ${snap1} equal to the certification version AFTER syndication's own increment, i.e. strictly greater than ${cver1}"
            - "trigger call 7 replays the identical payload and returns 412 ERR_STALE_CERTIFICATION_VERSION: syndication invalidated the very version it was authorised with"
            - "trigger call 7 changes nothing - the listing is still SYNDICATED, syndicated_snapshot_version is still ${snap1}, and Certification.${c1}.version is still ${cver2}"
            - "trigger call 9 re-syndicates with the fresh ${cver2} and refreshes ${snap2} above ${snap1}, proving the SYNDICATED -> SYNDICATED self-loop is reachable only through a re-read"
            - "trigger call 10 increments Vehicle.${v1}.version again: every accepted write on an OCC parent moves its version, including the ones that carry no OCC field of their own"

      - name: claim_ratio_crosses_suspension_threshold_and_forces_takedowns
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.dealer_claim_ratio
          - calculations.dealer_risk_score
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          A single approved claim on a single-activation dealer is enough to put the ratio at 1.00, which
          crosses BOTH declared thresholds at once - and the rule must resolve to the harsher one,
          SUSPENDED with CLAIM_RATIO_SUSPENSION rather than PROBATION. The same call also proves the
          snapshot ordering pays this claim in full at share 1.00 while the next claim would be trimmed,
          and it drags the dealer's SUBMITTED certification and SYNDICATED listing down with it.
        test_recipe:
          setup:
            - "Dealer D1 with technicians T1 and T2; published MPI-172 with P1."
