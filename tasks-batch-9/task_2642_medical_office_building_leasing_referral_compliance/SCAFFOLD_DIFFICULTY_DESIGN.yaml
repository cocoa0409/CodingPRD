            - "STANDARD_EXAM candidate starting 2029-08-31 returns 409 ERR_SUITE_TERM_CONFLICT, because the closed interval includes the incumbent's term_end"
            - "All four candidates remain in status FMV_CERTIFIED and all four incumbent leases remain EXECUTED"
            - "Building.${b16_id}.leased_rentable_sf == 18000 and vacant_rentable_sf == 82000 — no probe changed the tenant mix"

      - name: shared_space_half_open_aggregate_capacity_sweep
        grounds:
          - calculations.shared_space_concurrent_load
          - validations[37]
          - validations[34]
          - errors.ERR_SHARED_SPACE_CAPACITY_EXCEEDED
          - errors.ERR_AFTER_HOURS_NOT_AUTHORIZED
          - entities.SharedSpace.fields.capacity_seats
        distinguishing_aspect: |
          A DIFFERENT resource entity (SharedSpace, not Suite) and DIFFERENT
          interval semantics (HALF-OPEN [window_start, window_end), so touching
          windows never compete) with an AGGREGATE seat constraint instead of a
          pairwise one: two individually-legal bookings of 10 and 14 seats push
          the load on [10:00, 11:00) to exactly 24, which is accepted because the
          test is strictly greater than capacity, and a third booking of a single
          seat inside that same hour is refused. A 24-seat booking starting exactly
          when the 14-seat one ends is then accepted, which no closed-interval
          implementation can reproduce.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with a 5000 sf STANDARD_EXAM suite and a WAITING_ROOM shared space of 24 seats open 07:00-19:00."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant on a DRAFT DIRECT lease with SPACE_SHARING_SCHEDULE on file and after_hours_authorized left false."
            - "The clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b17_id: $.data.id }
            - call: "POST /buildings/${b17_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s17_id: $.data.id }
            - call: "POST /buildings/${b17_id}/shared-spaces"
              payload: { name: "Second Floor Shared Waiting Room", space_type: "WAITING_ROOM", capacity_seats: 24, opens_at: "07:00", closes_at: "19:00" }
              as: PortfolioAdmin
              captures: { ss17_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568011" }
              as: PortfolioAdmin
              captures: { t17_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b17_id}", suite_id: "${s17_id}", tenant_id: "${t17_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { l17_id: $.data.id }
            - call: "POST /leases/${l17_id}/compliance-attestations"
              payload: { attestation_type: "SPACE_SHARING_SCHEDULE", on_file: true, document_reference: "SCH-2642-0017" }
              as: LeasingAgent
          trigger:
            - call: "POST /shared-space-bookings"
              payload: { shared_space_id: "${ss17_id}", lease_id: "${l17_id}", window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T11:00:00Z", occupant_count: 10 }
              as: LeasingAgent
              captures: { bk17a_id: $.data.id }
            - call: "POST /shared-space-bookings"
              payload: { shared_space_id: "${ss17_id}", lease_id: "${l17_id}", window_start: "2026-08-05T10:00:00Z", window_end: "2026-08-05T12:00:00Z", occupant_count: 14 }
              as: LeasingAgent
              captures: { bk17b_id: $.data.id }
            - call: "POST /shared-space-bookings"
              payload: { shared_space_id: "${ss17_id}", lease_id: "${l17_id}", window_start: "2026-08-05T10:30:00Z", window_end: "2026-08-05T11:30:00Z", occupant_count: 1 }
              as: LeasingAgent
            - call: "POST /shared-space-bookings"
              payload: { shared_space_id: "${ss17_id}", lease_id: "${l17_id}", window_start: "2026-08-05T12:00:00Z", window_end: "2026-08-05T13:00:00Z", occupant_count: 24 }
              as: LeasingAgent
              captures: { bk17d_id: $.data.id }
            - call: "POST /shared-space-bookings"
              payload: { shared_space_id: "${ss17_id}", lease_id: "${l17_id}", window_start: "2026-08-05T20:00:00Z", window_end: "2026-08-05T21:00:00Z", occupant_count: 1 }
              as: LeasingAgent
            - call: "GET /shared-space-bookings"
              payload: { shared_space_id: "${ss17_id}", status: "BOOKED" }
              as: LeasingAgent
          assert:
            - "The 09:00-11:00 booking for 10 returns 201 with status BOOKED and is_after_hours false"
            - "The 10:00-12:00 booking for 14 returns 201 — the load on [10:00, 11:00) is exactly 24, which is not greater than capacity_seats"
            - "The 10:30-11:30 booking for 1 returns 422 ERR_SHARED_SPACE_CAPACITY_EXCEEDED"
            - "The 12:00-13:00 booking for 24 returns 201, because [10:00, 12:00) and [12:00, 13:00) do not overlap under half-open semantics"
            - "The 20:00-21:00 booking returns 422 ERR_AFTER_HOURS_NOT_AUTHORIZED even though the room is empty at that hour"
            - "GET /shared-space-bookings?shared_space_id=${ss17_id}&status=BOOKED returns meta.total_count == 3, holding exactly ${bk17a_id}, ${bk17b_id} and ${bk17d_id}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: rentable_square_footage_conserved_across_execute_and_terminate
        grounds:
          - calculations.building_tenant_mix
          - entities.Building.fields.leased_rentable_sf
          - entities.Building.fields.vacant_rentable_sf
          - state_machines.Lease[ACTIVE -> TERMINATED]
          - entities.Suite.fields.occupancy_status
        distinguishing_aspect: |
          CONSERVED QUANTITY: rentable square feet. leased_rentable_sf +
          vacant_rentable_sf must equal total_rentable_sf 100000 at every step,
          and the termination must restore the exact pre-execution figures —
          leased 0, vacant 100000, anchor_share_pct 0.0000, posture BALANCED, the
          suite back to VACANT — with no 5000 sf of drift left behind in either
          the anchor or independent bucket.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with a single 5000 sf STANDARD_EXAM suite."
            - "One non-physician-owned INDEPENDENT_PRACTICE tenant on a DIRECT lease certified at 30.00 psf with SIGNED_LEASE on file."
            - "No rent invoices, so a MUTUAL termination is not blocked by priority 39."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b18_id: $.data.id }
            - call: "POST /buildings/${b18_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s18_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568021" }
              as: PortfolioAdmin
              captures: { t18_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b18_id}", suite_id: "${s18_id}", tenant_id: "${t18_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { l18_id: $.data.id }
            - call: "POST /leases/${l18_id}/submit-fmv-review"
              payload: { submission_note: "Corporate practice" }
              as: LeasingAgent
              as_user_id: "agent-001"
            - call: "POST /leases/${l18_id}/certify-fmv"
              payload: { certification_note: "30.00 psf inside [24.00, 34.50]" }
              as: ComplianceOfficer
              as_user_id: "compliance-001"
            - call: "POST /leases/${l18_id}/compliance-attestations"
              payload: { attestation_type: "SIGNED_LEASE", on_file: true, document_reference: "LSE-2642-0018" }
              as: LeasingAgent
            - call: "GET /buildings/${b18_id}"
              payload: {}
              as: PortfolioAdmin
          trigger:
            - call: "POST /leases/${l18_id}/execute"
              payload: { execution_note: "Executed" }
              as: LeasingAgent
            - call: "GET /buildings/${b18_id}"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /leases/${l18_id}/commence"
              payload: { commencement_note: "Keys delivered" }
              as: PropertyManager
            - call: "POST /leases/${l18_id}/terminate"
              payload: { termination_reason: "MUTUAL", termination_note: "Early surrender agreed" }
              as: PropertyManager
            - call: "GET /buildings/${b18_id}"
              payload: {}
              as: PortfolioAdmin
            - call: "GET /suites/${s18_id}"
              payload: {}
              as: PortfolioAdmin
          assert:
            - "Before execution: leased_rentable_sf 0, vacant_rentable_sf 100000, anchor_rentable_sf 0, independent_rentable_sf 0, anchor_share_pct 0.0000, tenant_mix_posture BALANCED"
            - "After execution: leased_rentable_sf 5000, vacant_rentable_sf 95000, independent_rentable_sf 5000, anchor_share_pct 0.0000, posture BALANCED, and 5000 + 95000 == 100000"
            - "After commencement the same figures hold and Suite.${s18_id}.occupancy_status == OCCUPIED"
            - "After termination: leased_rentable_sf 0, vacant_rentable_sf 100000, anchor_rentable_sf 0, independent_rentable_sf 0, anchor_share_pct 0.0000, posture BALANCED"
            - "Suite.${s18_id}.occupancy_status == VACANT with last_vacated_on 2026-09-01"
            - "The post-termination building figures are identical to the pre-execution figures — no square footage is stranded"

      - name: parking_stall_pool_conserved_across_allocate_and_revoke
        grounds:
          - calculations.parking_pool_balance
          - entities.Building.fields.staff_allocated_stalls
          - entities.Building.fields.patient_allocated_stalls
          - entities.Building.fields.unallocated_stalls
          - state_machines.ParkingAllocation
          - endpoints[POST /parking-allocations/{id}/revoke]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity type — integer parking stalls rather than
          rentable square feet — under the invariant staff + patient + unallocated
          == 400 across four writes: 20 staff, then 30 patient, then two
          revocations that must return the stalls to the pool in the opposite
          order. Because each allocation increments the building version, every
          request re-reads expected_building_version, so a stale-version bug and a
          conservation bug cannot be confused.
        test_recipe:
          setup:
            - "One 100000 sf Building with 400 total_parking_stalls and patient_min_reserve_pct 0.60, so reserve_minimum is ceil(240.0) == 240 and staff may hold at most 160."
            - "One 5000 sf STANDARD_EXAM suite and one non-physician-owned INDEPENDENT_PRACTICE tenant on a DRAFT DIRECT lease."
            - "No parking allocations yet, so the building starts at 0 / 0 / 400."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { b19_id: $.data.id }
            - call: "POST /buildings/${b19_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { s19_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568031" }
              as: PortfolioAdmin
              captures: { t19_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${b19_id}", suite_id: "${s19_id}", tenant_id: "${t19_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { l19_id: $.data.id }
            - call: "GET /buildings/${b19_id}"
              payload: {}
              as: PropertyManager
              captures: { b19_v1: $.data.version }
          trigger:
            - call: "POST /parking-allocations"
              payload: { expected_building_version: "${b19_v1}", building_id: "${b19_id}", lease_id: "${l19_id}", category: "STAFF", stall_count: 20 }
              as: PropertyManager
              captures: { pa19s_id: $.data.id }
            - call: "GET /buildings/${b19_id}"
              payload: {}
              as: PropertyManager
              captures: { b19_v2: $.data.version }
            - call: "POST /parking-allocations"
              payload: { expected_building_version: "${b19_v2}", building_id: "${b19_id}", lease_id: "${l19_id}", category: "PATIENT", stall_count: 30 }
              as: PropertyManager
              captures: { pa19p_id: $.data.id }
            - call: "POST /parking-allocations/${pa19s_id}/revoke"
              payload: { revocation_note: "Staff parking surrendered" }
              as: PropertyManager
            - call: "GET /buildings/${b19_id}"
              payload: {}
              as: PropertyManager
            - call: "POST /parking-allocations/${pa19p_id}/revoke"
              payload: { revocation_note: "Patient parking surrendered" }
              as: PropertyManager
            - call: "GET /buildings/${b19_id}"
              payload: {}
              as: PropertyManager
            - call: "GET /parking-allocations"
              payload: { building_id: "${b19_id}", status: "ACTIVE" }
              as: PropertyManager
          assert:
            - "Start state: staff_allocated_stalls 0, patient_allocated_stalls 0, unallocated_stalls 400"
            - "After the STAFF allocation of 20: 20 / 0 / 380 and 20 + 0 + 380 == 400"
            - "After the PATIENT allocation of 30: 20 / 30 / 350 and 20 + 30 + 350 == 400"
            - "After revoking the STAFF allocation: 0 / 30 / 370 and ParkingAllocation.${pa19s_id}.status == REVOKED"
            - "After revoking the PATIENT allocation: 0 / 0 / 400 and ParkingAllocation.${pa19p_id}.status == REVOKED"
            - "GET /parking-allocations?building_id=${b19_id}&status=ACTIVE returns meta.total_count == 0"
            - "The final pool equals the starting pool exactly — no stall is stranded in either category"
