          - validations[priority=28]
          - errors.ERR_ENCOUNTER_NOT_PENDING
          - errors.ERR_IDENTITY_NOT_ESTABLISHED
        distinguishing_aspect: |
          Category pair state (15) vs business_safety (28) on POST /citations. One request violates
          both rules at once — the encounter is already terminal AND its identity_capture_method is
          REFUSED — and the ordered walk must surface ERR_ENCOUNTER_NOT_PENDING (409), not the
          422 identity error that a naive "validate the payload semantics first" implementation
          reports. The second call removes only the higher-priority violation and proves the lower
          rule is still live, so the pair pins the order in both directions.
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED, line L1 assigned, deployment D1 ACTIVE over 2026-08-05T06:00:00Z..14:00:00Z."
