  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_confirm_requires_member_active
        grounds:
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
          - entities.Member.fields.status
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: "Reservation r1's REQUESTED->CONFIRMED transition is blocked because the OTHER entity Member is SUSPENDED (not ACTIVE) — cross-entity pair (Reservation, Member); the REQUESTED reservation survives suspension (only CONFIRMED are cascaded) so the guard is reachable."
        test_recipe:
          setup:
