            - "VehicleBlock.${b1_id}.state == CLOSED after the close"
            - "VehicleBlock.${b1_id}.actual_revenue_hours == 1.20"
            - "VehicleBlock.${b1_id}.boardings_count == 1"
            - "ServiceZone.${z_id}.boardings_per_revenue_hour == 0.83"
