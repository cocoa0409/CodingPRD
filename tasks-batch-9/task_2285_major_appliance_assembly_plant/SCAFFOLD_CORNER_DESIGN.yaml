              payload: {}
              as: QualityInspector
              captures: { err_cert_id: $.data.error_id }
          assert:
            - "HTTP 409 with error.error_id == ERR_INVALID_STATE"
            - "ProductionUnit.${unit1_id}.quality_status == PENDING with efficiency_index null and certification_tier null"

      - name: functional_cycle_before_electrical_safety_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=11]
          - errors.ERR_QUALITY_GATE_ORDER
          - state_machines.ProductionUnit.PENDING_to_SAFETY_PASSED
        distinguishing_aspect: "Gate order is enforced from PENDING: a FUNCTIONAL_CYCLE test before any ELECTRICAL_SAFETY pass returns 409 ERR_QUALITY_GATE_ORDER, records no QualityTest row, and the same test succeeds once the hipot test has passed."
        test_recipe:
          setup:
            - "Base fixture with unit1 released and quality_status PENDING (no tests recorded)"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
          trigger:
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 3 }
              as: QualityInspector
              captures: { err_gate_id: $.data.error_id }
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.30 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 3 }
              as: QualityInspector
          assert:
            - "Trigger 1: HTTP 409 with error.error_id == ERR_QUALITY_GATE_ORDER and GET /production-units/${unit1_id}/quality-tests total_count == 0"
            - "After trigger 2: ProductionUnit.${unit1_id}.quality_status == SAFETY_PASSED and the ELECTRICAL_SAFETY row has limit_value == 0.50 with result == PASS"
            - "After trigger 3: the FUNCTIONAL_CYCLE row has limit_value == 3 and result == PASS, and quality_status is still SAFETY_PASSED — WM-X has requires_leak_test true, so GATED needs a LEAK PASS as well"

      - name: failing_electrical_safety_test_quarantines_both_dimensions
        claim_type: side_effect_execution
        grounds:
          - state_machines.ProductionUnit.PENDING_to_QUARANTINED
          - state_machines.ProductionUnit.IN_STATION_to_REWORK
          - validations[priority=12]
          - errors.ERR_UNIT_QUARANTINED
        distinguishing_aspect: "A single FAIL result (hipot 0.60 against the 0.50 limit) mutates BOTH dimensions in one request — quality_status QUARANTINED and assembly_status REWORK with rework_count 1 — and complete-assembly then returns 409 ERR_UNIT_QUARANTINED."
        test_recipe:
          setup:
            - "Base fixture with unit1 released and quality_status PENDING"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
          trigger:
            - &c_hipotfail
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.60 }
              as: QualityInspector
              captures: { failtest_id: $.data.id }
            - call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
              captures: { err_quar_id: $.data.error_id }
          assert:
            - "Trigger 1: QualityTest.${failtest_id}.result == FAIL with limit_value == 0.50 and status == RECORDED (0.60 > 0.50 on a lower-is-better gate)"
            - "ProductionUnit.${unit1_id}: quality_status == QUARANTINED, assembly_status == REWORK, rework_count == 1"
            - "Trigger 2: HTTP 409 with error.error_id == ERR_UNIT_QUARANTINED and assembly_status still REWORK"
            - "BuildSlot.${slot1_id}.status is still RELEASED — a quarantine does not bubble up to the slot"

      - name: clear_quarantine_voids_failures_and_restarts_the_gate_chain
        claim_type: cyclic
        grounds:
          - state_machines.ProductionUnit.QUARANTINED_to_PENDING
          - state_machines.ProductionUnit.REWORK_to_IN_STATION
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "clear-quarantine closes the loop: the FAIL row flips RECORDED -> VOIDED, both dimensions return to PENDING x IN_STATION, and the gate chain must be re-walked from the beginning — a fresh hipot PASS is required before FUNCTIONAL_CYCLE is accepted again."
        test_recipe:
          setup:
            - "Base fixture with unit1 released; an ELECTRICAL_SAFETY test of 0.60 FAILED, so the unit is REWORK x QUARANTINED with rework_count 1"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - *c_hipotfail
          trigger:
            - call: "POST /production-units/${unit1_id}/clear-quarantine"
              payload: { note: "connector reseated" }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 3 }
              as: QualityInspector
              captures: { err_recycle_id: $.data.error_id }
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.30 }
              as: QualityInspector
          assert:
            - "Trigger 1: ProductionUnit.${unit1_id}.quality_status == PENDING and assembly_status == IN_STATION with rework_count still == 1 (the counter is a history, not a state)"
            - "QualityTest.${failtest_id}.status == VOIDED — GET /production-units/${unit1_id}/quality-tests?status=RECORDED returns total_count == 0"
            - "Trigger 2: HTTP 409 with error.error_id == ERR_QUALITY_GATE_ORDER — the voided PASS-less chain restarts from PENDING"
            - "Trigger 3: quality_status == SAFETY_PASSED again, so the same unit can be re-driven around the loop"

      - name: complete_assembly_bubbles_the_slot_from_released_to_built
        claim_type: bubble_up
        grounds:
          - state_machines.BuildSlot.RELEASED_to_BUILT
          - state_machines.ProductionUnit.IN_STATION_to_ASSEMBLED
        distinguishing_aspect: "complete-assembly bubbles up to the parent slot (RELEASED -> BUILT) while leaving quality_status PENDING and keeping the presentation slots committed, because only shipping releases line-side space."
        test_recipe:
          setup:
            - "Base fixture with unit1 released from BuildSlot index 1; ST10 carries the 2 committed presentation units"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
          trigger:
            - &c_asm1
              call: "POST /production-units/${unit1_id}/complete-assembly"
              payload: {}
              as: LineOperator
          assert:
            - "ProductionUnit.${unit1_id}.assembly_status == ASSEMBLED and quality_status == PENDING"
            - "BuildSlot.${slot1_id}.status == BUILT"
            - "Station.${st10_id}.presentation_slots_used == 2 and Line.${line_id}.presentation_slots_committed == 2 — unchanged by the bubble-up"
            - "ShiftPlan.${shift_a_id}.committed_labor_minutes == 150 — a BUILT slot stays in the labour input set"

      - name: shipping_releases_presentation_slots_to_the_line_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.ProductionUnit.ASSEMBLED_to_SHIPPED
          - entities.Line.fields.presentation_slots_committed
          - calculations.line_posture
        distinguishing_aspect: "ship is the only transition that hands line-side space back: Station.presentation_slots_used drops 2 -> 0, Line.presentation_slots_committed 2 -> 0 and free_slot_pct 97.50 -> 100.00, while the shift's committed labour stays at 150 because the slot is still BUILT."
        test_recipe:
          setup:
            - "Base fixture with unit1 driven to CERTIFIED (hipot 0.30, cycle 3, leak 1.10, ENERGY 380.00, WATER 184.00) and then ASSEMBLED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - *c_hipot1
            - &c_cyc1
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 3 }
              as: QualityInspector
            - &c_leak1
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "LEAK", measured_value: 1.10 }
              as: QualityInspector
            - &c_energy1
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 380.00 }
              as: QualityInspector
            - &c_water1
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 184.00 }
              as: QualityInspector
            - &c_cert1
              call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
            - *c_asm1
          trigger:
            - &c_ship1
              call: "POST /production-units/${unit1_id}/ship"
              payload: {}
              as: LineOperator
          assert:
            - "ProductionUnit.${unit1_id}.assembly_status == SHIPPED and quality_status == CERTIFIED (the declared terminal compound state)"
            - "Station.${st10_id}.presentation_slots_used == 0 and Station.${st20_id}.presentation_slots_used == 0"
            - "Line.${line_id}.presentation_slots_committed == 0, free_slot_pct == 100.00 and posture == OPEN"
            - "ShiftPlan.${shift_a_id}.committed_labor_minutes == 150 and BuildSlot.${slot1_id}.status == BUILT — shipping touches the slot ledger, not the labour ledger"

      - name: ship_unit_without_certification_returns_409
        claim_type: guarded_transitions
        grounds:
          - state_machines.ProductionUnit.ASSEMBLED_to_SHIPPED
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The ship transition carries a cross-dimension guard: an ASSEMBLED unit whose quality_status is GATED (all functional gates passed, never certified) returns 409 ERR_INVALID_STATE and keeps its presentation slots committed."
        test_recipe:
          setup:
            - "Base fixture with unit1 at GATED (hipot 0.30, cycle 3, leak 1.10) and ASSEMBLED, but never certified"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - *c_hipot1
            - *c_cyc1
            - *c_leak1
            - *c_asm1
          trigger:
            - call: "POST /production-units/${unit1_id}/ship"
              payload: {}
              as: LineOperator
              captures: { err_ship_id: $.data.error_id }
          assert:
            - "HTTP 409 with error.error_id == ERR_INVALID_STATE"
            - "ProductionUnit.${unit1_id}.assembly_status == ASSEMBLED and quality_status == GATED"
            - "Station.${st10_id}.presentation_slots_used == 2 and Line.${line_id}.free_slot_pct == 97.50 — the rejected ship released nothing"

      - name: cancelling_a_call_whose_slot_is_only_planned_cascades_nothing
        claim_type: conditional_cascade
        grounds:
          - state_machines.DeliveryCall.SCHEDULED_to_CANCELLED
          - state_machines.BuildSlot.SEQUENCED_to_PLANNED
        distinguishing_aspect: "The de-sequence cascade is conditional on the slot being SEQUENCED and pinned: cancelling a covering call while the slot is still PLANNED (never sequenced) leaves the slot PLANNED with sync_delivery_call_id null and every counter at zero — no side effect fires."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20, SUP1, sequenced module P-MOD-1 (line_side_max_units 1)"
            - "ModelVariant WM-M RELEASED: FAM_A, 1 option point, 100 labour minutes, POS-MOD on P-MOD-1 at ST10 qty 1"
            - "ShiftPlan A 06:00-14:00; DeliveryCall CM covering 09:00-10:00; BuildSlot index 1 (planned_start 09:30) left PLANNED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - &c_pmod
              call: "POST /parts"
              payload: { part_number: "P-MOD-1", supplier_id: "${sup1_id}", is_sequenced_module: true, line_side_max_units: 1 }
              as: PlantAdmin
              captures: { p_mod_id: $.data.id }
            - &c_wmm
              call: "POST /model-variants"
              payload: { model_code: "WM-M", family_code: "FAM_A", option_codes: ["OPT-MOD"], option_content_points: 1, labor_minutes: 100, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmm_id: $.data.id, wmm_v: $.data.version }
            - &c_bomm
              call: "POST /bom-lines"
              payload: { model_variant_id: "${wmm_id}", part_id: "${p_mod_id}", station_id: "${st10_id}", bom_position_code: "POS-MOD", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmm_v}" }
              as: PlantAdmin
            - &c_relm
              call: "POST /model-variants/${wmm_id}/release"
              payload: {}
              as: PlantAdmin
            - &c_lineread_m
              call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_v_m: $.data.version }
            - &c_shiftm
              call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${line_v_m}" }
              as: ProductionPlanner
              captures: { shift_m_id: $.data.id }
            - &c_callm
              call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_mod_id}", station_id: "${st10_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", sequenced_qty: 1 }
              as: ProductionPlanner
              captures: { callm2_id: $.data.id }
            - &c_slotm
              call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmm_id}", sequence_index: 1, planned_start: "2026-08-03T09:30:00Z" }
              as: ProductionPlanner
              captures: { slotm_id: $.data.id }
          trigger:
            - call: "POST /delivery-calls/${callm2_id}/cancel"
              payload: {}
              as: ProductionPlanner
          assert:
            - "DeliveryCall.${callm2_id}.status == CANCELLED with cancel_reason == PLANNER"
            - "BuildSlot.${slotm_id}.status == PLANNED with sync_delivery_call_id null, shift_plan_id null and allocated_slot_units == 0 — nothing to de-sequence"
            - "ShiftPlan.${shift_m_id}.committed_labor_minutes == 0 and Station.${st10_id}.presentation_slots_used == 0"
            - "Line.${line_id}.posture == OPEN and free_slot_pct == 100.00"

      - name: stopping_the_line_blocks_sequencing_until_it_is_restarted
        claim_type: cross_entity
        grounds:
          - state_machines.Line.RUNNING_to_STOPPED
          - calculations.line_posture
          - validations[priority=24]
          - errors.ERR_LINE_POSTURE_BLOCKED
        distinguishing_aspect: "A stop on the Line propagates to every child operation: sequencing returns 409 ERR_LINE_POSTURE_BLOCKED while posture is STOPPED, and the identical call succeeds after POST /lines/{id}/start restores posture OPEN."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED, ShiftPlan A 06:00-14:00, BuildSlot index 1 PLANNED"
            - "Line L1 stopped with reason 'tooling inspection'"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - call: "POST /lines/${line_id}/stop"
              payload: { reason: "tooling inspection" }
              as: LineOperator
          trigger:
            - call: "POST /build-slots/${slot1_id}/sequence"
              payload: {}
              as: ProductionPlanner
              captures: { err_stopped_id: $.data.error_id }
            - call: "POST /lines/${line_id}/start"
              payload: {}
              as: LineOperator
            - call: "POST /build-slots/${slot1_id}/sequence"
              payload: {}
              as: ProductionPlanner
          assert:
            - "Trigger 1: HTTP 409 with error.error_id == ERR_LINE_POSTURE_BLOCKED; Line.${line_id}.operating_mode == STOPPED, stop_reason == 'tooling inspection', posture == STOPPED"
            - "Trigger 2: operating_mode == RUNNING, stop_reason null, changeover_count == 0 (no to_family_code was supplied) and posture == OPEN"
            - "Trigger 3: HTTP 200 with BuildSlot.${slot1_id}.status == SEQUENCED, allocated_slot_units == 2 and ShiftPlan.${shift_a_id}.committed_labor_minutes == 150"

      - name: changeover_start_books_eighteen_minutes_and_retools_the_line
        claim_type: side_effect_execution
        grounds:
          - state_machines.Line.STOPPED_to_RUNNING
          - calculations.shift_committed_labor_minutes
          - errors.ERR_CHANGEOVER_REQUIRED
        distinguishing_aspect: "Restarting with to_family_code FAM_B retools the line (current_family_code FAM_B, changeover_count 1) and books CHANGEOVER_MINUTES onto the covering plan, so committed_labor_minutes becomes 18 with no slots sequenced; a FAM_A slot sequenced afterwards adds a second boundary charge and cannot be released (409 ERR_CHANGEOVER_REQUIRED)."
        test_recipe:
          setup:
            - "Base fixture: Line L1 tooled FAM_A with ST10/ST20, SUP1, P-DOOR-A, WM-X (FAM_A) RELEASED, ShiftPlan A 06:00-14:00 covering the 06:00 clock"
            - "BuildSlot index 1 is PLANNED (nothing sequenced, so the plan's labour counters are all 0), then the line is stopped for the changeover"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - call: "POST /lines/${line_id}/stop"
              payload: { reason: "model changeover" }
              as: LineOperator
          trigger:
            - call: "POST /lines/${line_id}/start"
              payload: { to_family_code: "FAM_B" }
              as: LineOperator
            - call: "POST /build-slots/${slot1_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${slot1_id}/release"
              payload: {}
              as: LineOperator
              captures: { err_family_id: $.data.error_id }
          assert:
            - "Trigger 1: Line.${line_id}.current_family_code == 'FAM_B', changeover_count == 1, operating_mode == RUNNING and posture == OPEN"
            - "Trigger 1: ShiftPlan.${shift_a_id}.unit_labor_minutes == 0, changeover_minutes == 18 (booked by the start) and committed_labor_minutes == 18"
            - "Trigger 2: BuildSlot.${slot1_id}.status == SEQUENCED and ShiftPlan.${shift_a_id}.unit_labor_minutes == 150, changeover_minutes == 36 (the 18 booked by the start plus 18 for the first slot's FAM_A differing from the line's current FAM_B) and committed_labor_minutes == 186 (gross 186 <= FATIGUE_T1_MAX 300, so ceil(186 * 1.00))"
            - "Trigger 3: HTTP 409 with error.error_id == ERR_CHANGEOVER_REQUIRED because WM-X is FAM_A while the line is now tooled FAM_B; BuildSlot.${slot1_id}.status is still SEQUENCED"
            - "No ProductionUnit exists: GET /production-units?build_slot_id=${slot1_id} returns total_count == 0"

      - name: no_fault_found_disposition_closes_the_return_without_charging_anyone
        claim_type: branching
        grounds:
          - state_machines.WarrantyReturn.TEARDOWN_to_CLOSED
          - calculations.warranty_failure_rate
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "BRANCH C short-circuits the join: analyze with disposition NO_FAULT_FOUND and no root_cause_part_id closes the return in one step, leaving Part.field_failure_count at 0, Supplier.on_time_score at 100.00 and engineering_change_id null."
        test_recipe:
          setup:
            - "Base fixture with unit1 CERTIFIED, ASSEMBLED and SHIPPED from BuildSlot index 1"
            - "Clock at 2026-08-03T12:00:00Z; WarrantyReturn WR1 on unit1 (field_hours 500) is in TEARDOWN"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - *c_hipot1
            - *c_cyc1
            - *c_leak1
            - *c_energy1
            - *c_water1
            - *c_cert1
            - *c_asm1
            - *c_ship1
            - &c_clock12
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T12:00:00Z" }
              as: PlantAdmin
            - &c_wr1
              call: "POST /warranty-returns"
              payload: { production_unit_id: "${unit1_id}", failure_code: "F-DOOR-SEAL", field_hours: 500, returned_at: "2026-08-03T11:00:00Z" }
              as: WarrantyAnalyst
              captures: { wr1_id: $.data.id }
            - &c_wr1_teardown
              call: "POST /warranty-returns/${wr1_id}/teardown"
              payload: {}
              as: WarrantyAnalyst
          trigger:
            - call: "POST /warranty-returns/${wr1_id}/analyze"
              payload: { disposition: "NO_FAULT_FOUND" }
              as: WarrantyAnalyst
          assert:
            - "WarrantyReturn.${wr1_id}.status == CLOSED with disposition == NO_FAULT_FOUND, root_cause_part_id null, engineering_change_id null and teardown_started_at == 2026-08-03T12:00:00Z"
            - "Part.${p_door_id}.field_failure_count == 0, cohort_failure_rate_per_1000 == 0.00 and lifecycle_status == ACTIVE"
            - "Supplier.${sup1_id}.quality_penalty_count == 0 and on_time_score == 100.00"
            - "GET /engineering-changes?source_warranty_return_id=${wr1_id} returns total_count == 0"

      - name: parallel_dimensions_advance_independently_on_one_unit
        claim_type: parallel
        grounds:
          - state_machines.ProductionUnit
        excluded_because:
          difficulty_instance: non_linear_state_machine / production_unit_assembly_and_quality_dimensions_advance_independently
          rationale: "The independence of assembly_status and quality_status, including the combined-state matrix, is the whole subject of the named §1.8 instance."

      - name: engineering_change_revision_loop_terminates_at_the_round_cap
        claim_type: cyclic
        grounds:
          - state_machines.EngineeringChange.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.EngineeringChange.UNDER_REVIEW_to_CANCELLED
        excluded_because:
          difficulty_instance: non_linear_state_machine / engineering_change_revision_loop_cancels_at_round_cap
          rationale: "The named §1.8 instance walks the loop three times and asserts the CANCELLED escape at EC_MAX_REVISION_ROUNDS + 1."

      - name: checkpoint_sweep_cascades_down_to_dependent_slots
        claim_type: cascade_down
        grounds:
          - state_machines.DeliveryCall.SCHEDULED_to_MISSED
          - state_machines.BuildSlot.SEQUENCED_to_PLANNED
        excluded_because:
          difficulty_instance: transitive_cascade / checkpoint_miss_demotes_supplier_and_de_sequences_slot_depth_four
          rationale: "The four-link miss -> demotion -> cancellation -> de-sequence chain is asserted link by link in the named §1.8 instance."

      - name: withdrawing_a_warranty_return_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.WarrantyReturn.ANALYZED_SUPPLIER_to_CLOSED_withdraw
        excluded_because:
          difficulty_instance: compensating_invariant / defect_attribution_conserved_across_warranty_withdrawal
          rationale: "All three compensations (disposition rewrite, part counters, supplier penalty and score) are asserted in the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:

      - name: option_load_window_counts_only_the_five_slot_rolling_window
        claim_type: input_set_filtering
        grounds:
          - calculations.option_load_window_cap
          - entities.BuildSlot.fields.option_points_snapshot
          - errors.ERR_OPTION_LOAD_WINDOW_EXCEEDED
        distinguishing_aspect: "The cap is evaluated per rolling 5-slot window, not over the whole line: with cap 31 a sixth 6-point slot is admitted because window [2..6] totals 30 (a whole-line sum would be 36 and reject it), while a seventh slot worth 8 points is rejected because window [3..7] totals 32."
        test_recipe:
          setup:
            - "Line L1 (option_load_limit_pct 63.00, baseline_headcount 20) with ST10/ST20, SUP1, P-DOOR-A; ShiftPlan A 06:00-14:00 headcount 20, so cap = floor(5 * 0.63 * 10 * 1.0000) = 31 and available_labor_minutes = 480"
            - "ModelVariant WM-L RELEASED: FAM_A, 6 option points, 50 labour minutes, POS-DOOR on P-DOOR-A at ST10 qty 1 -> ceil(1 * 20 / 24) = 1 presentation unit"
            - "ModelVariant WM-P RELEASED: FAM_A, 8 option points, 50 labour minutes, same single POS-DOOR position"
            - "Slots 1..5 of WM-L (07:00, 07:10, 07:20, 07:30, 07:40) are already SEQUENCED; slot 6 of WM-L (07:50) and slot 7 of WM-P (08:00) are PLANNED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - call: "POST /model-variants"
              payload: { model_code: "WM-L", family_code: "FAM_A", option_codes: ["OPT-A"], option_content_points: 6, labor_minutes: 50, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wml_id: $.data.id, wml_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wml_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wml_v}" }
              as: EngineeringLead
            - call: "POST /model-variants/${wml_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "POST /model-variants"
              payload: { model_code: "WM-P", family_code: "FAM_A", option_codes: ["OPT-A", "OPT-B", "OPT-C"], option_content_points: 8, labor_minutes: 50, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmp_id: $.data.id, wmp_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmp_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 1, effective_from_sequence: 1, expected_model_variant_version: "${wmp_v}" }
              as: EngineeringLead
            - call: "POST /model-variants/${wmp_id}/release"
              payload: {}
              as: PlantAdmin
            - *c_lineread
            - *c_shifta
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wml_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { w1_id: $.data.id }
            - call: "POST /build-slots/${w1_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wml_id}", sequence_index: 2, planned_start: "2026-08-03T07:10:00Z" }
              as: ProductionPlanner
              captures: { w2_id: $.data.id }
            - call: "POST /build-slots/${w2_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wml_id}", sequence_index: 3, planned_start: "2026-08-03T07:20:00Z" }
              as: ProductionPlanner
              captures: { w3_id: $.data.id }
            - call: "POST /build-slots/${w3_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wml_id}", sequence_index: 4, planned_start: "2026-08-03T07:30:00Z" }
              as: ProductionPlanner
              captures: { w4_id: $.data.id }
            - call: "POST /build-slots/${w4_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wml_id}", sequence_index: 5, planned_start: "2026-08-03T07:40:00Z" }
              as: ProductionPlanner
              captures: { w5_id: $.data.id }
            - call: "POST /build-slots/${w5_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wml_id}", sequence_index: 6, planned_start: "2026-08-03T07:50:00Z" }
              as: ProductionPlanner
              captures: { w6_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmp_id}", sequence_index: 7, planned_start: "2026-08-03T08:00:00Z" }
              as: ProductionPlanner
              captures: { w7_id: $.data.id }
          trigger:
            - call: "POST /build-slots/${w6_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - call: "POST /build-slots/${w7_id}/sequence"
              payload: {}
              as: ProductionPlanner
              captures: { err_window_id: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 200 with BuildSlot.${w6_id}.status == SEQUENCED, option_points_snapshot == 6 and allocated_slot_units == 1 — the binding window [2..6] totals 30 <= 31"
            - "After trigger 1: ShiftPlan.${shift_a_id}.unit_labor_minutes == 300, changeover_minutes == 0 and committed_labor_minutes == 300 (gross 300 is exactly FATIGUE_T1_MAX, tier 1.00)"
            - "After trigger 1: Station.${st10_id}.presentation_slots_used == 6 and Line.${line_id}.free_slot_pct == 92.50"
            - "Trigger 2: HTTP 422 with error.error_id == ERR_OPTION_LOAD_WINDOW_EXCEEDED because window [3..7] totals 6*4 + 8 = 32 > 31; BuildSlot.${w7_id}.status is still PLANNED and committed_labor_minutes is still 300"

      - name: efficiency_index_at_tier_a_plus_boundary_and_one_hundredth_above
        claim_type: constants_applied
        grounds:
          - calculations.efficiency_index
          - entities.ProductionUnit.fields.certification_tier
        distinguishing_aspect: "TIER_A_PLUS_MAX is inclusive on the 2-dp index: ENERGY 320.00 / WATER 160.00 give exactly 0.80 and certify A_PLUS, while ENERGY 324.00 / WATER 160.00 give 0.81 and certify A — the same weights, one tier apart."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED (energy_kwh_limit 400.00, water_liters_limit 200.00), ShiftPlan A 06:00-14:00"
            - "unit1 (slot index 1) GATED with hipot 0.30, cycle 3, leak 1.10, ENERGY 320.00, WATER 160.00"
            - "unit2 (slot index 2) GATED with hipot 0.31, cycle 3, leak 1.20, ENERGY 324.00, WATER 160.00"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
            - *c_hipot1
            - *c_cyc1
            - *c_leak1
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 320.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 160.00 }
              as: QualityInspector
            - *c_slot2
            - &c_seq2
              call: "POST /build-slots/${slot2_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - &c_rel2
              call: "POST /build-slots/${slot2_id}/release"
              payload: {}
              as: LineOperator
              captures: { unit2_id: $.data.id }
            - call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.31 }
              as: QualityInspector
            - call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "FUNCTIONAL_CYCLE", measured_value: 3 }
              as: QualityInspector
            - call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "LEAK", measured_value: 1.20 }
              as: QualityInspector
            - call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "ENERGY", measured_value: 324.00 }
              as: QualityInspector
            - call: "POST /production-units/${unit2_id}/quality-tests"
              payload: { test_type: "WATER", measured_value: 160.00 }
              as: QualityInspector
          trigger:
            - call: "POST /production-units/${unit1_id}/certify"
              payload: {}
              as: QualityInspector
            - call: "POST /production-units/${unit2_id}/certify"
              payload: {}
              as: QualityInspector
          assert:
            - "ProductionUnit.${unit1_id}: efficiency_index == 0.80 (0.6*0.8000 + 0.4*0.8000), certification_tier == A_PLUS, quality_status == CERTIFIED"
            - "ProductionUnit.${unit2_id}: efficiency_index == 0.81 (0.6*0.8100 + 0.4*0.8000 = 0.806 -> 0.81 half-up), certification_tier == A, quality_status == CERTIFIED"
            - "Both units' provisional_efficiency_index equals their efficiency_index here, because each type has exactly one RECORDED test"

      - name: presentation_allocation_ceiling_exhausts_a_one_slot_station
        claim_type: waterfall_allocation
        grounds:
          - calculations.presentation_slot_allocation
          - errors.ERR_PRESENTATION_SLOTS_EXHAUSTED
        distinguishing_aspect: "The per-position charge is ceil(qty_per_unit * PRESENTATION_WINDOW_UNITS / line_side_max_units) = ceil(2 * 20 / 24) = 2, so a station whose presentation_slot_capacity is 1 cannot host the position at all: sequencing returns 422 ERR_PRESENTATION_SLOTS_EXHAUSTED with the station counter untouched."
        test_recipe:
          setup:
            - "Line L3 (takt 120, option_load_limit_pct 63.00, baseline_headcount 20, FAM_A) with a single station ST-N of presentation_slot_capacity 1"
            - "SUP1 and P-DOOR-A (line_side_max_units 24); ModelVariant WM-N RELEASED with POS-DOOR on P-DOOR-A at ST-N qty 2 and 100 labour minutes"
            - "ShiftPlan A 06:00-14:00 headcount 20 on L3; BuildSlot index 1 (07:00) PLANNED"
          setup_api_calls:
            - *c_clock
            - *c_sup1
            - *c_pdoor
            - call: "POST /lines"
              payload: { line_code: "L3", takt_seconds: 120, option_load_limit_pct: 63.00, baseline_headcount: 20, current_family_code: "FAM_A" }
              as: PlantAdmin
              captures: { l3_id: $.data.id }
            - call: "POST /stations"
              payload: { line_id: "${l3_id}", station_code: "ST-N", position_index: 10, presentation_slot_capacity: 1, station_cycle_seconds: 110 }
              as: PlantAdmin
              captures: { stn_id: $.data.id }
            - call: "POST /model-variants"
              payload: { model_code: "WM-N", family_code: "FAM_A", option_codes: ["OPT-A"], option_content_points: 2, labor_minutes: 100, functional_cycle_count_required: 1, hipot_leakage_ma_limit: 0.50 }
              as: PlantAdmin
              captures: { wmn_id: $.data.id, wmn_v: $.data.version }
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmn_id}", part_id: "${p_door_id}", station_id: "${stn_id}", bom_position_code: "POS-DOOR", qty_per_unit: 2, effective_from_sequence: 1, expected_model_variant_version: "${wmn_v}" }
              as: EngineeringLead
            - call: "POST /model-variants/${wmn_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "GET /lines/${l3_id}"
              payload: {}
              as: ProductionPlanner
              captures: { l3_v: $.data.version }
            - call: "POST /shift-plans"
              payload: { line_id: "${l3_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${l3_v}" }
              as: ProductionPlanner
              captures: { shift_l3_id: $.data.id }
            - call: "POST /build-slots"
              payload: { line_id: "${l3_id}", model_variant_id: "${wmn_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { slotn_id: $.data.id }
          trigger:
            - call: "POST /build-slots/${slotn_id}/sequence"
              payload: {}
              as: ProductionPlanner
              captures: { err_pres_id: $.data.error_id }
          assert:
            - "HTTP 422 with error.error_id == ERR_PRESENTATION_SLOTS_EXHAUSTED — the position needs 2 units and ST-N offers 1"
            - "Station.${stn_id}.presentation_slots_used == 0 and Line.${l3_id}.presentation_slots_committed == 0, free_slot_pct == 100.00, posture == OPEN"
            - "BuildSlot.${slotn_id}.status == PLANNED with presentation_allocations == [] and ShiftPlan.${shift_l3_id}.committed_labor_minutes == 0"

      - name: supplier_score_floors_at_zero_and_suspends_the_supplier
        claim_type: aggregation
        grounds:
          - calculations.supplier_on_time_score
          - entities.Supplier.fields.status
          - errors.ERR_SUPPLIER_NOT_APPROVED
        distinguishing_aspect: "Six misses would arithmetically give 100 - 120 = -20, but the score floors at 0.00: one checkpoint sweeps all six calls, the supplier lands on exactly 0.00 with status SUSPENDED, and booking a new call for it then returns 409 ERR_SUPPLIER_NOT_APPROVED."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20, SUP1, P-DOOR-A"
            - "Six SCHEDULED calls at ST10, each 10 minutes long and separated by exactly DOCK_BUFFER_MINUTES: 06:00-06:10, 06:20-06:30, 06:40-06:50, 07:00-07:10, 07:20-07:30, 07:40-07:50"
            - "Clock advanced to 2026-08-03T08:06:00Z, past the last window_end plus the 15-minute grace"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T06:10:00Z", sequenced_qty: 2 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T06:20:00Z", window_end: "2026-08-03T06:30:00Z", sequenced_qty: 2 }
              as: ProductionPlanner
              captures: { f2_id: $.data.id }
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T06:40:00Z", window_end: "2026-08-03T06:50:00Z", sequenced_qty: 2 }
              as: ProductionPlanner
              captures: { f3_id: $.data.id }
            - call: "POST /delivery-calls"
