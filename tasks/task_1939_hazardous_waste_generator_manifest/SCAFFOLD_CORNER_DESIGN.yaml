# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1939: Hazardous Waste Generator & Manifest Management
# Sections/claim_types follow references/claim-extraction-guide.md.
# Clock default: 2026-08-01T00:00:00Z. Every recipe replays from empty-DB.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: generator_site_creation_defaults
        claim_type: defaults
        grounds:
          - entities.GeneratorSite.fields.current_month_generated_kg
          - entities.GeneratorSite.fields.generator_category
        distinguishing_aspect: "A fresh site at the default clock starts with zeroed counters, VSQG category, month key 2026-08, and version 1."
        test_recipe:
          setup: ["Empty DB; clock unset (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
          assert:
            - "GeneratorSite.${site_id}.current_month_generated_kg == 0.0"
            - "GeneratorSite.${site_id}.generator_category == VSQG"
            - "GeneratorSite.${site_id}.current_month_key == '2026-08'"
            - "GeneratorSite.${site_id}.open_exception_count == 0 and open_discrepancy_count == 0"
            - "GeneratorSite.${site_id}.version == 1"

      - name: waste_stream_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.WasteStream.fields.physical_state
          - validations[priority=5]
        distinguishing_aspect: "Omitting physical_state on stream creation is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"] }, as: WasteCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status == 400"
            - "GET /hazwaste/waste-streams?site_id=${site_id} returns total_count == 0"

      - name: container_unknown_field_rejected_input_ignored
        claim_type: system_fields
        grounds:
          - validations[priority=5]
          - entities.Container
        distinguishing_aspect: "Client-supplied system fields (id, version, accumulation_start_date) are unknown request fields and rejected with ERR_INVALID_REQUEST; the server mints them."
        test_recipe:
          setup: ["Site with ACTIVE stream and central area"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 50.0, version: 99 }, as: WasteCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (unknown field 'version' rejected)"

      - name: container_central_create_computed_fields
        claim_type: computed_fields
        grounds:
          - entities.Container.fields.accumulation_start_date
          - entities.Container.fields.deadline_days
          - calculations.accumulation_deadline_at
        distinguishing_aspect: "Creating directly into a CENTRAL_90DAY area stamps accumulation_start_date from the logical clock and snapshots a 180-day VSQG deadline."
        test_recipe:
          setup: ["Site with ACTIVE stream and central area; site VSQG at default clock"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 50.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
          assert:
            - "Container.${cont_id}.status == IN_CENTRAL_ACCUMULATION"
            - "Container.${cont_id}.accumulation_start_date == 2026-08-01T00:00:00Z"
            - "Container.${cont_id}.deadline_days == 180 and accumulation_deadline_at == 2027-01-28T00:00:00Z"
            - "Container.${cont_id}.is_labeled == false and is_inspection_overdue == false and is_accumulation_overdue == false"
            - "Container.${cont_id}.site_id == ${site_id} (derived from the area)"

      - name: manifest_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown manifest id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /hazwaste/manifests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: EHSManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status == 404"

      - name: biennial_reports_listing_pagination
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - entities.BiennialReport
        distinguishing_aspect: "The filtered list honors limit/offset with total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["Site with two DRAFT reports (2025 and 2027)"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_id}", report_year: 2025 }, as: EHSManager }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_id}", report_year: 2027 }, as: EHSManager }
          trigger:
            - { call: "GET /hazwaste/biennial-reports", as: EHSManager }
          assert:
            - "GET /hazwaste/biennial-reports?site_id=${site_id}&limit=1&offset=0 returns total_count == 2 and has_more == true"
            - "GET /hazwaste/biennial-reports?site_id=${site_id}&limit=1&offset=1 returns total_count == 2 and has_more == false"

      - name: container_create_cross_site_area_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=16]
          - errors[ERR_CROSS_SITE_REFERENCE]
          - entities.Container.fields.accumulation_area_id
        distinguishing_aspect: "Flat-topology FK integrity: a container whose stream belongs to site A cannot be placed in site B's area."
        test_recipe:
          setup: ["Site A with ACTIVE stream; site B with a CENTRAL_90DAY area"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_a: "$.data.id" } }
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site B", epa_id_number: "EPA-SITE-B" }, as: EHSManager, captures: { site_b: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_a}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_b}", name: "Central B", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_b: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_b}", quantity_gallons: 10, quantity_kg: 50.0 }, as: WasteCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_CROSS_SITE_REFERENCE and no container is persisted"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: container_initial_state_satellite_vs_central
        claim_type: initial_state
        grounds:
          - state_machines.Container.null_to_ACCUMULATING_AT_SATELLITE
          - state_machines.Container.null_to_IN_CENTRAL_ACCUMULATION
        distinguishing_aspect: "The creation area type selects the initial state: satellite starts ACCUMULATING_AT_SATELLITE with null accumulation_start_date; central starts IN_CENTRAL_ACCUMULATION with the clock stamped."
        test_recipe:
          setup: ["Site with ACTIVE stream plus one SATELLITE and one CENTRAL_90DAY area"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Booth SAA", area_type: "SATELLITE" }, as: WasteCoordinator, captures: { saa_id: "$.data.id" } }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { cen_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${saa_id}", quantity_gallons: 10, quantity_kg: 50.0 }, as: WasteCoordinator, captures: { cont_sat: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${cen_id}", quantity_gallons: 10, quantity_kg: 50.0 }, as: WasteCoordinator, captures: { cont_cen: "$.data.id" } }
          assert:
            - "Container.${cont_sat}.status == ACCUMULATING_AT_SATELLITE and accumulation_start_date is null"
            - "Container.${cont_cen}.status == IN_CENTRAL_ACCUMULATION and accumulation_start_date == 2026-08-01T00:00:00Z"

      - name: satellite_55_gallon_boundary_and_late_move
        claim_type: side_effect_execution
        grounds:
          - calculations.satellite_stream_gallons
          - state_machines.Container.ACCUMULATING_AT_SATELLITE_to_SATELLITE_LIMIT_EXCEEDED
          - entities.Container.fields.is_move_late
        distinguishing_aspect: "At exactly 55.0 gal the satellite limit is NOT exceeded (strictly-greater); 55.1 gal flips only the incoming container to SATELLITE_LIMIT_EXCEEDED, and a move after the 3-day grace sets is_move_late."
        test_recipe:
          setup: ["Site with ACTIVE stream; SATELLITE area and CENTRAL_90DAY area; clock default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Booth SAA", area_type: "SATELLITE" }, as: WasteCoordinator, captures: { saa_id: "$.data.id" } }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { cen_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${saa_id}", quantity_gallons: 30.0, quantity_kg: 100.0 }, as: WasteCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${saa_id}", quantity_gallons: 25.0, quantity_kg: 80.0 }, as: WasteCoordinator, captures: { c2: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${saa_id}", quantity_gallons: 0.1, quantity_kg: 1.0 }, as: WasteCoordinator, captures: { c3: "$.data.id" } }
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: EHSManager }
            - { call: "POST /hazwaste/containers/${c3}/move", payload: { target_area_id: "${cen_id}" }, as: WasteCoordinator, as_user_id: "wc-7" }
          assert:
            - "After 30.0 + 25.0 = 55.0 gal: both containers remain ACCUMULATING_AT_SATELLITE (boundary not exceeded)"
            - "Container.${c3}.status was SATELLITE_LIMIT_EXCEEDED after its create (total 55.1 > 55.0) with satellite_exceeded_at == 2026-08-01T00:00:00Z and move_deadline_at == 2026-08-04T00:00:00Z"
            - "After the 2026-08-05 move: Container.${c3}.status == IN_CENTRAL_ACCUMULATION and is_move_late == true"
            - "Container.${c1} and Container.${c2} remain ACCUMULATING_AT_SATELLITE (only the incoming container carries the exceedance)"

      - name: waste_stream_activate_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.WasteStream.CHARACTERIZED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "activate requires CHARACTERIZED; from DRAFT it is rejected and no fields change."
        test_recipe:
          setup: ["Site with a DRAFT stream (never characterized)"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE and HTTP status == 409"
            - "WasteStream.${stream_id}.status == DRAFT and characterization_version == 0"

      - name: characterize_retired_stream_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.WasteStream
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "A RETIRED stream rejects characterize with ERR_ALREADY_TERMINAL; no version or characterization changes."
        test_recipe:
          setup: ["Site with stream retired from ACTIVE (no containers)"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/retire", as: EHSManager, captures: { stream_v4: "$.data.version" } }
          trigger:
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 30.0, expected_waste_stream_version: "${stream_v4}" }, as: WasteCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_ALREADY_TERMINAL and HTTP status == 409"
            - "WasteStream.${stream_id}.status == RETIRED and characterization_version == 1"

      - name: partner_suspend_reinstate_and_reject_terminal
        claim_type: valid_transition
        grounds:
          - state_machines.WastePartner.APPROVED_to_SUSPENDED
          - state_machines.WastePartner.SUSPENDED_to_APPROVED
          - state_machines.WastePartner.PENDING_to_REJECTED
        distinguishing_aspect: "The partner machine cycles APPROVED -> SUSPENDED -> APPROVED (reinstate) and treats REJECTED as terminal: approving a REJECTED partner fails."
        test_recipe:
          setup: ["Two PENDING partners registered by aud-1"]
          setup_api_calls:
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TRANSPORTER", name: "HaulCo", epa_id_number: "EPA-TR-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { p1: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { p2: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/waste-partners/${p1}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${p1}/status", payload: { to_status: "SUSPENDED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${p1}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${p2}/status", payload: { to_status: "REJECTED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${p2}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2", captures: { err: "$.data.error_id" } }
          assert:
            - "WastePartner.${p1}.status == APPROVED after the suspend/reinstate lap"
            - "WastePartner.${p2}.status == REJECTED and the approve attempt returns err == ERR_ALREADY_TERMINAL"

      - name: biennial_report_amendment_loop
        claim_type: valid_transition
        grounds:
          - state_machines.BiennialReport.SUBMITTED_to_DRAFT
          - state_machines.BiennialReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "REJECT review loops the report back to DRAFT for amendment (submitted_at cleared); a resubmission can then be ACCEPTED, after which the terminal state locks."
        test_recipe:
          setup: ["Site with a DRAFT report for 2027"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_id}", report_year: 2027 }, as: EHSManager, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/biennial-reports/${rep_id}/submit", as: EHSManager }
            - { call: "POST /hazwaste/biennial-reports/${rep_id}/review", payload: { outcome: "REJECT" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/biennial-reports/${rep_id}/submit", as: EHSManager }
            - { call: "POST /hazwaste/biennial-reports/${rep_id}/review", payload: { outcome: "ACCEPT" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/biennial-reports/${rep_id}/review", payload: { outcome: "REJECT" }, as: ComplianceAuditor, captures: { err: "$.data.error_id" } }
          assert:
            - "After first review REJECT: status == DRAFT and submitted_at is null"
            - "After resubmit + ACCEPT: status == ACCEPTED"
            - "Third review on the terminal report: err == ERR_ALREADY_TERMINAL"

      - name: manifest_returned_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Manifest
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "A RETURNED manifest rejects every further action; a second confirm-return fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["Default clock; manifest RETURNED (full chain)"]
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
