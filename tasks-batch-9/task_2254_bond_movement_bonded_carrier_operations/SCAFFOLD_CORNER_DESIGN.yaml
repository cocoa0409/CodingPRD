  # =======================================================================
  - section: endpoints
    instances:

      - name: surety_raises_the_bond_limit_and_the_available_amount_follows
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /in-bond/bonds/{id}]
          - calculations.bond_obligation_ledger_balance
          - endpoints[GET /in-bond/bonds]
        distinguishing_aspect: "Raising limit_amount from 50000.00 to 60000.00 must recompute available_amount to 59958.25 while obligated_amount stays 41.75 and no ledger entry is appended; the filtered list read then returns that one bond."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; M1 filed (obligation 41.75)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
          trigger:
            - call: "PATCH /in-bond/bonds/${b1}"
              payload: { limit_amount: 60000.00 }
              as: SuretyAgent
              as_user_id: "${b1}"
            - call: "GET /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", status: "ACTIVE", limit: 10, offset: 0 }
              as: SuretyAgent
              as_user_id: "${b1}"
          assert:
            - "the PATCH returned HTTP 200"
            - "CustomsBond.${b1}.limit_amount == 60000.00"
            - "CustomsBond.${b1}.obligated_amount == 41.75"
            - "CustomsBond.${b1}.available_amount == 59958.25"
            - "CustomsBond.${b1}.status == ACTIVE"
            - "GET /in-bond/ledger-entries?bond_id=${b1} still returns total_count == 1 (a limit change is not a ledger event)"
            - "the list read returned HTTP 200 with response_type == array, 1 row whose id == ${b1}, total_count == 1, has_more == false"

      - name: replaced_seal_event_restores_integrity_without_lifting_the_system_hold
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /in-bond/seal-events]
          - entities.SealEvent.fields.resulting_seal_intact
          - entities.ExaminationHold.fields.created_by_system
        distinguishing_aspect: "A BROKEN_UNAUTHORIZED event must set seal_intact false and auto-create a SEAL_DISCREPANCY hold with created_by_system true; the following REPLACED event must restore seal_intact true and change seal_number, yet leave that hold OPEN and custody EXAM_HOLD."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; M1 filed and departed with seal SEAL-100 (IN_TRANSIT, seal_intact true)."
            - "Clock at 2026-08-05T00:00:00Z, well before the 2026-09-05 deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
          trigger:
            - call: "POST /in-bond/seal-events"
              payload: { movement_id: "${m1}", event_type: "BROKEN_UNAUTHORIZED", seal_number: "SEAL-100", port_code: "3901" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { se_broken: $.data.resulting_seal_intact }
            - call: "POST /in-bond/seal-events"
              payload: { movement_id: "${m1}", event_type: "REPLACED", seal_number: "SEAL-101", port_code: "3901" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { se_fixed: $.data.resulting_seal_intact }
          assert:
            - "both calls returned HTTP 201"
            - "the BROKEN_UNAUTHORIZED event carried resulting_seal_intact == false (captured as ${se_broken})"
            - "the REPLACED event carried resulting_seal_intact == true (captured as ${se_fixed})"
            - "InBondMovement.${m1}.seal_intact == true"
            - "InBondMovement.${m1}.seal_number == SEAL-101"
            - "InBondMovement.${m1}.custody_status == EXAM_HOLD"
            - "InBondMovement.${m1}.transit_status == IN_TRANSIT"
            - "GET /in-bond/examination-holds?movement_id=${m1} returns exactly 1 hold with hold_type == SEAL_DISCREPANCY, status == OPEN, created_by_system == true"
            - "Port.${p_chi}.open_hold_count == 1"
            - "GET /in-bond/movements/${m1}/seal-events returns 3 events in occurred_at ASC order with event_type APPLIED, BROKEN_UNAUTHORIZED, REPLACED"

