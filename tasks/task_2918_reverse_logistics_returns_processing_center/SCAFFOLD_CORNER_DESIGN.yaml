      - name: corner_ccl_cascading_side_effects_chain_end_to_end
        claim_type: Cascading side effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints[POST /catalog-items/{catalog_item_id}/recall]
          - state_machines.RefurbWorkOrder
        excluded_because:
          difficulty_instance: "transitive_cascade / mandatory_recall_cascades_through_refurb_abandon_to_shrink_ledger"
          rationale: "That §1.8 instance walks the full recall chain — catalog flag, line disposition, work-order abandonment, REFURB_COST ledger append and client recompute — and asserts every link, which is exactly the end-to-end cascade claim for this layer."

      - name: corner_ccl_dual_variant_calculation_diverges_on_switch
        claim_type: Dual variant calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.return_line_recovery_value
        excluded_because:
          difficulty_instance: "dual_variant_calc / recovery_value_provisional_vs_final_on_return_line"
          rationale: "That §1.8 instance asserts the provisional-at-grading and final-at-execution variants of recovery_value_cents on the same line plus the delta on switch, covering both variants of this layer."

  # =================================================================== #
  # SECTION 9 — consistency_model                                       #
  # =================================================================== #
  - section: consistency_model
    instances:
      - name: corner_cm_execute_cascade_is_visible_immediately_in_every_read
        claim_type: Immediate consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /disposition-orders/{disposition_order_id}/execute]
          - state_machines.ReturnAuthorization[RECEIVED -> CLOSED]
          - state_machines.ReturnLine_disposition_state
          - calculations.client_unit_conservation
        distinguishing_aspect: "Every one of the five cascade links is observable in the first read that follows the execute response — line DISPOSITIONED, ledger row appended, client counters moved, RMA CLOSED — with no second call, no retry and no intermediate state ever visible."
        test_recipe:
          setup:
            - "Client CC5 with a single-line RMA fully received and graded C, and its LIQUIDATE order APPROVED by u_super. Because the RMA has exactly one line, dispositioning it must also close the RMA in the same cascade."
