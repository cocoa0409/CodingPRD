  - rule_id: boundary_precision_check
    instances:
      - name: allowance_units_exactly_consumed_versus_one_unit_over
        grounds:
          - calculations.duty_exemption_accounting
          - entities.SaleLine.fields.allowance_excess_qty
          - entities.Sale.fields.duty_status
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
        distinguishing_aspect: |
          Endpoint POST /sales/{sale_id}/pickup at the allowance boundary of 2 units: qty 2 lands
          exactly ON the allowance (allowance_excess_qty 0, exempt 16000, duty 0, EXEMPT_CONFIRMED)
          while qty 3 is one unit OVER (allowance_excess_qty 1, exempt still 16000, duty 1920,
          DUTY_LIABLE), so the exempt figure is identical and only the excess tail is taxed.
