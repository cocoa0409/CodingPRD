    distinguishing_aspect: 'Chair sanitation interval semantics (buffer-after-occupation): a chair that finished a visit at

      10:00 with sanitation_minutes=5 cannot leave SANITIZING until current_clock >= sanitation_ready_at

      (10:05). Marking it sanitized at 10:02 — inside the buffer — fails ERR_SANITATION_WINDOW_OPEN.

      '
