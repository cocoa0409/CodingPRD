          trigger:
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "WIRE_STOCK", image_id: "00000000-0000-4000-8000-000000000000" }, as: FinanceAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN (role check fires before existence)"

      - name: photographer_submit_on_others_assignment_forbidden
        claim_type: role_denial
        grounds: [roles.Photographer, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership: Photographer P2 submitting to P1's assignment is rejected with ERR_FORBIDDEN because assignment.photographer_id != X-User-ID."
        test_recipe:
          setup: ["photographers P1 and P2; an assignment commissioned to P1"]
          setup_api_calls:
            - { call: "POST /photographers", payload: { full_name: "Sam Staff", email: "sam@acme.news", photographer_type: "STAFF", day_rate_cents: 25000, per_image_fee_cents: 40000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p1_id: $.data.id } }
            - { call: "POST /photographers", payload: { full_name: "Fran Free", email: "fran@freelance.io", photographer_type: "FREELANCE", day_rate_cents: 20000, per_image_fee_cents: 30000, royalty_rate_per_use_cents: 305 }, as: PhotoEditor, captures: { p2_id: $.data.id } }
            - { call: "POST /story-requests", payload: { headline: "Bridge fire", slug: "bridge-fire", needed_by: "2026-09-01T00:00:00Z", budget_cents: 30000 }, as: PhotoEditor, captures: { s_id: $.data.id } }
            - { call: "POST /story-requests/${s_id}/decide", payload: { decision: "COMMISSION", photographer_id: "${p1_id}", brief: "Fire scene", shoot_start: "2026-08-10T09:00:00Z", shoot_end: "2026-08-11T17:00:00Z" }, as: PhotoEditor, captures: { a_id: $.data.commissioned_assignment_id } }
