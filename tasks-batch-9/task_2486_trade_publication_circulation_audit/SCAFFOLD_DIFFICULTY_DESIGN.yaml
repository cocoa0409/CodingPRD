              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_e_id: $.data.id, sub_e_ver: $.data.version }
            - call: "POST /circulation/subscribers/${sub_e_id}/source-documents"
              payload: { doc_type: "SIGNED_REQUEST_CARD", captured_at: "2026-07-15T00:00:00Z", storage_ref: "s3://circ/e-card" }
              as: QualificationSpecialist
              as_user_id: "qs-01"
              captures: { doc_e_id: $.data.id }
            - call: "POST /circulation/qualification-requests"
              payload: { subscriber_id: "${sub_e_id}", source_document_id: "${doc_e_id}", request_channel: "DIRECT_MAIL", signed_at: "2026-07-01T00:00:00Z", attested_job_function_code: "PLANT_MGMT", attested_industry_code: "UTILITIES", attested_purchasing_authority: "SPECIFIES", expected_subscriber_version: "${sub_e_ver}" }
