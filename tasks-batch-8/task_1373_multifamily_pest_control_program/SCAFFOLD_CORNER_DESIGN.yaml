  # ============================================================== cross_cutting_layers
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_reschedule_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[treatment-reschedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Stale OCC on Treatment: client reads version, a notify-prep mutation advances it, and the reschedule carrying the pre-notify version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["SCHEDULED treatment on unit 101; client captured version V at creation; notify-prep then advances the version"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "OCC1 Hall", address: "44 OCC Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { tr: "$.data.id", tr_v: "$.data.version" } }
            - { call: "POST /pest/treatments/${tr}/notify-prep", payload: {}, as: PropertyManager }
          trigger:
            - { call: "POST /pest/treatments/${tr}/reschedule", payload: { window_start: "2026-08-12T09:00:00Z", window_end: "2026-08-12T10:00:00Z", expected_treatment_version: "${tr_v}" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_VERSION with HTTP 412 (notify-prep advanced the version past ${tr_v})"
      - name: occ_stale_resolve_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[chargeback-resolve-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Stale OCC on Chargeback via arithmetic expression: resolving with version-1 behind the current one -> 412 ERR_STALE_VERSION; the subsequent resolve with the fresh version succeeds."
        test_recipe:
          setup: ["DISPUTED chargeback; captured post-dispute version cb_v"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "OCC2 Hall", address: "45 OCC2 Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /pest/leases/${lease_id}/chargebacks", payload: { kind: "NON_COMPLIANCE_FEE" }, as: BillingClerk, as_user_id: "clerk-1", captures: { cb: "$.data.id" } }
            - { call: "POST /pest/chargebacks/${cb}/dispute", payload: { reason: "contest" }, as: Resident, as_user_id: "${res_id}", captures: { cb_v: "$.data.version" } }
          trigger:
            - { call: "POST /pest/chargebacks/${cb}/resolve-dispute", payload: { resolution: "UPHELD", expected_chargeback_version: "${cb_v} - 1" }, as: ComplianceOfficer, as_user_id: "officer-9", captures: { err: "$.data.error_id" } }
            - { call: "POST /pest/chargebacks/${cb}/resolve-dispute", payload: { resolution: "UPHELD", expected_chargeback_version: "${cb_v}" }, as: ComplianceOfficer, as_user_id: "officer-9", captures: { st: "$.data.status" } }
          assert:
            - "stale expression -> ERR_STALE_VERSION (HTTP 412)"
            - "fresh version -> status == UPHELD"
      - name: derived_fields_reconcile_on_completion
        claim_type: derived_field_reconciliation
        grounds: [calculations.technician_booked_minutes, entities.ServiceContract.fields.spent_cents]
        distinguishing_aspect: "Completion reconciles two derived fields atomically: contract spent_cents becomes 12000 and the technician's booked_minutes drops from 60 back to 0 in the same request."
        test_recipe:
          setup: ["treatment PREP_VERIFIED on unit 101 (60-minute window, CHEMICAL)"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Derived Hall", address: "46 Derived Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/leases", payload: { start_date: "2026-08-01", end_date: "2027-07-31", pest_addendum_signed: true, chargeback_clause_version: "v2026.1", chargeback_cap_cents: 100000 }, as: PropertyManager, captures: { lease_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/residents", payload: { full_name: "R One", email: "r1@x.com", lease_id: "${lease_id}" }, as: PropertyManager, captures: { res_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { tr: "$.data.id" } }
            - { call: "POST /pest/treatments/${tr}/notify-prep", payload: {}, as: PropertyManager }
            - { call: "POST /pest/treatments/${tr}/acknowledge-prep", payload: {}, as: Resident, as_user_id: "${res_id}" }
            - { call: "POST /pest/treatments/${tr}/verify-prep", payload: { compliant: true }, as: PropertyManager }
          trigger:
            - { call: "POST /pest/treatments/${tr}/complete", payload: { actual_minutes: 60 }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "GET /pest/contracts/${contract_id}", payload: {}, as: ProgramAdmin, captures: { spent: "$.data.spent_cents" } }
            - { call: "GET /pest/technicians/${tech_id}", payload: {}, as: ProgramAdmin, captures: { bm: "$.data.booked_minutes" } }
          assert:
            - "ServiceContract.spent_cents == 12000 (CHEMICAL estimate booked at completion)"
            - "Technician.booked_minutes == 0 (COMPLETED leaves the booked set; was 60 while scheduled)"

  # ============================================================== consistency_model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the POST response, a subsequent GET, and the parent's filtered list all reflect the same version and status without any delay."
        test_recipe:
          setup: ["property with ACTIVE contract; unit 101; technician"]
          setup_api_calls:
            - { call: "POST /pest/properties", payload: { name: "Cons Hall", address: "47 Cons Way" }, as: ProgramAdmin, captures: { prop_id: "$.data.id" } }
            - { call: "POST /pest/properties/${prop_id}/contracts", payload: { vendor_name: "PestCo", scope_pest_types: ["ROACHES"], visits_per_month: 4, coverage_per_incident_cents: 20000, heat_treatment_included: true, monthly_budget_cents: 1000000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: ProgramAdmin, captures: { contract_id: "$.data.id" } }
            - { call: "POST /pest/contracts/${contract_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /pest/properties/${prop_id}/units", payload: { unit_number: "101", floor: 1, stack_index: 1, bedrooms: 1 }, as: ProgramAdmin, captures: { unit_id: "$.data.id" } }
            - { call: "POST /pest/technicians", payload: { full_name: "T One", vendor_name: "PestCo" }, as: ProgramAdmin, captures: { tech_id: "$.data.id" } }
          trigger:
            - { call: "POST /pest/units/${unit_id}/treatments", payload: { technician_id: "${tech_id}", pest_type: "ROACHES", treatment_type: "CHEMICAL", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T10:00:00Z" }, as: PropertyManager, captures: { tr: "$.data.id", v_create: "$.data.version", st_create: "$.data.status" } }
            - { call: "GET /pest/treatments/${tr}", payload: {}, as: PropertyManager, captures: { v_get: "$.data.version", st_get: "$.data.status" } }
            - { call: "GET /pest/units/${unit_id}/treatments", payload: { status: "SCHEDULED" }, as: PropertyManager, captures: { listed: "$.data[0].id" } }
          assert:
            - "create response: status == SCHEDULED, version == 1"
            - "GET immediately after: identical version and status"
            - "filtered list (status=SCHEDULED) contains ${tr} as its only row"
