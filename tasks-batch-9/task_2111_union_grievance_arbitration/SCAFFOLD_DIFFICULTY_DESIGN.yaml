          - calculations.case_cost_allocation
          - entities.Arbitrator.fields.active_case_count
          - entities.Grievance.fields.cost_posture
        distinguishing_aspect: |
          Four-link chain from one strike: PanelStrike creation makes the demand
          ARBITRATOR_SELECTED; because of that the arbitrator's active_case_count rises
          and their derived status flips AVAILABLE -> FULL; because an arbitrator became
          engaged a SYSTEM ARBITRATOR_FEE CostEntry of 400000 is posted; because that
