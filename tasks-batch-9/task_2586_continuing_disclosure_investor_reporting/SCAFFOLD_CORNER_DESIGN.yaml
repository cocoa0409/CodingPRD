      - name: cycle_snapshots_the_weights_so_a_later_requirement_only_breaks_future_cycles
        claim_type: weighted_scoring
        grounds:
          - calculations.content_preparation_completeness_score
          - calculations.undertaking_delinquency_counters
          - validations.priority_18
        distinguishing_aspect: >-
          Weights must close at exactly 10000 when a cycle is created, and the cycle snapshots them
          into its items. Adding a sixth-of-a-report requirement afterwards therefore has two
          asymmetric consequences: the live undertaking total moves to 12000 and blocks the NEXT
          cycle with ERR_CONTENT_WEIGHTS_UNBALANCED, while the existing cycle keeps two items whose
          snapshots still sum to 10000 and still scores 60.00 off the fixed 10000 denominator. An
          implementation that recomputes item weights from the current requirement set would
          silently rescale the open cycle.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking (FYE 06-30) carrying two requirements, AUDITED_FINANCIALS 6000 and OPERATING_DATA_TABLE 4000."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", total0: "$.data.content_weight_bp_total" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 6000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_fin: "$.data.id", needs_opinion: "$.data.requires_audit_opinion" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 4000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_ops: "$.data.id" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { total_closed: "$.data.content_weight_bp_total" }
          trigger:
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id", score_new: "$.data.completeness_score_pct" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req_ops}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_ops: "$.data[0].id", snap_ops: "$.data[0].weight_bp_snapshot", ops_total: "$.total_count" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "BUDGET_SUMMARY", label: "Adopted Budget Summary", weight_bp: 2000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_budget: "$.data.id" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { total_broken: "$.data.content_weight_bp_total" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2027", period_start_date: "2026-07-01", period_end_date: "2027-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { items_after: "$.total_count" }
            - call: "PATCH /disclosure/cycle-content-items/${item_ops}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.xlsx" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_ops}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { score_after: "$.data.completeness_score_pct" }
          assert:
            - "${total0} == 0, ${total_closed} == 10000 and ${needs_opinion} == true for the AUDITED_FINANCIALS requirement"
            - "the FY2026 cycle is created (201) with ${score_new} == 0.00 — both items start NOT_STARTED"
            - "${ops_total} == 1 and ${snap_ops} == 4000 — the item snapshots its requirement's weight"
            - "${total_broken} == 12000 — the live undertaking total absorbs the new 2000-bp requirement immediately"
            - "${err_id} == ERR_CONTENT_WEIGHTS_UNBALANCED (422) — the closure check is evaluated against the CURRENT requirement set, so the next cycle cannot be opened"
            - "${items_after} == 2 — the already-created cycle does NOT gain an item for the new requirement"
            - "${score_after} == 60.00 — the attested 4000-bp item contributes 0.4000 and the untouched 6000-bp item contributes 0.0000; the denominator stays the constant 10000, not the undertaking's current 12000"

      - name: completeness_score_rounding_order
        claim_type: precision
        grounds:
          - calculations.content_preparation_completeness_score.precision
        excluded_because:
          difficulty_instance: completeness_score_rounds_each_item_before_summation
          rationale: >-
            The per-item round-to-4-then-sum-then-round-to-2 order and its rejected alternative are
            already pinned by the difficulty instance, whose 3333/3333/3333/1 fixture separates
            50.01 from 50.00. A second precision corner on the same formula would test the same
            code path with a weaker fixture.

      - name: risk_score_propagation_reaches_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.undertaking_disclosure_risk_score
        excluded_because:
          difficulty_instance: risk_score_escalates_on_the_persisted_prior_tier
          rationale: >-
            The single-pass, prior-tier-multiplier design (and the explicit prohibition on
            iterating to a fixed point, which would diverge) is the whole subject of that
            difficulty instance. The monotone-versus-live counter corner above already exercises
            the propagation chain from counters to score to tier to posture.

      - name: timeliness_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.cycle_timeliness_assessment.variants
        excluded_because:
          difficulty_instance: cycle_timeliness_submission_basis_vs_confirmation_basis_divergence
          rationale: >-
            The two-undertaking fixture in that difficulty instance holds submitted_at and
            repository_confirmed_at identical across the pair and shows SUBMISSION_BASIS yielding
            FILED_TIMELY where CONFIRMATION_BASIS yields FILED_LATE, together with the downstream
            failure event, counter bump and score change. There is no residual variant-divergence
            claim left to make.

      - name: lookback_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.official_statement_disclosure_lookback.variants
        excluded_because:
          difficulty_instance: official_statement_lookback_strict_five_year_vs_remediated_excluded
          rationale: >-
            Variant selection for the lookback is per-OfficialStatement configuration
            (lookback_policy), and that difficulty instance already runs the same failure history
            through both policies on two statements of the same issuer program, including the
            re-run at compliance-review time.

  - section: validations
    instances:

      - name: every_creation_gate_passes_at_its_exact_satisfaction_boundary
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_14
          - validations.priority_15
          - validations.priority_16
          - validations.priority_17
          - validations.priority_18
          - validations.priority_21
          - validations.priority_23
        distinguishing_aspect: >-
          Each gate is satisfied at the exact value where it would otherwise fire — the first
          undertaking on the issue, two requirements of DIFFERENT kinds summing to exactly 10000, a
          notice whose occurrence_date equals the clock date (the rule forbids only dates AFTER
          it), and a placement whose review window is a single day (start == end is legal because
          the constraint is <=). An implementation that hardens any of these into a strict
          comparison fails here while still passing every violation test.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue and nothing else; the clock is at its 2026-08-01 default."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_status: "$.data.status" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 6000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_fin: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 4000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_ops: "$.data.id" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { weight_total: "$.data.content_weight_bp_total" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id", cycle_status: "$.data.status" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-08-01" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { notice_id: "$.data.id", notice_status: "$.data.status", notice_occ: "$.data.occurrence_date" }
            - call: "POST /disclosure/direct-placements"
              payload: { issue_id: "${issue_id}", lender_name: "Harbor National Bank", principal_amount_cents: 2000000, execution_date: "2026-07-28", review_window_start_date: "2026-08-10", review_window_end_date: "2026-08-10", disclosure_practice: "VOLUNTARY" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { place_id: "$.data.id", place_status: "$.data.status", place_bp: "$.data.materiality_ratio_bp" }
          assert:
            - "${und_status} == ACTIVE — priority 14 permits the FIRST undertaking on the issue"
            - "${weight_total} == 10000 with two distinct kinds — priority 15 (uniqueness per kind) and priority 18 (closure at exactly 10000) are both satisfied, not merely unfired"
            - "${cycle_status} == DRAFTING — priorities 16, 17 and 18 all pass: no prior period to overlap, a non-empty requirement set, and a closed 10000 sum"
            - "${notice_status} == DETERMINATION_PENDING and ${notice_occ} == \"2026-08-01\" — occurrence_date EQUAL to the clock date is legal; only a later date is refused"
            - "${place_status} == RECEIVED and ${place_bp} == 200 — a single-day closed review window satisfies start <= end"
            - "no call in this instance returns an error_id"

      - name: defeased_issue_outranks_the_undertaking_uniqueness_rule
        claim_type: priority_ordering
        grounds:
          - validations.priority_9
          - validations.priority_14
          - state_machines[BondIssue].OUTSTANDING->DEFEASED
        distinguishing_aspect: >-
          The SAME request — a second undertaking on an issue that already has one — returns two
          different errors depending on the issue's state, and once the issue is defeased BOTH
          rules are violated simultaneously. Priority 9 must win, because a defeased issue is not a
          reportable obligation at all; an implementation that checks uniqueness first (the more
          natural database-level check) returns ERR_UNDERTAKING_ALREADY_EXISTS and fails.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with outstanding_par_amount_cents = 50000000 and exactly one ACTIVE Undertaking."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 50000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id", par: "$.data.outstanding_par_amount_cents" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "12-31" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_dup: "$.data.error_id" }
            - call: "POST /disclosure/bond-issues/${issue_id}/defease"
              payload: { defeasance_type: "LEGAL", escrow_deposit_cents: 50000000, occurrence_date: "2026-08-01" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_status: "$.data.status", par_after: "$.data.outstanding_par_amount_cents" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_status: "$.data.status", und_cause: "$.data.termination_cause" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "12-31" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_defeased: "$.data.error_id" }
            - call: "GET /disclosure/undertakings?issue_id=${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_total: "$.total_count" }
          assert:
            - "${par} == 50000000 and ${e_dup} == ERR_UNDERTAKING_ALREADY_EXISTS (409) — while the issue is OUTSTANDING only priority 14 is violated"
            - "${issue_status} == DEFEASED and ${par_after} == 0"
            - "${und_status} == TERMINATED with ${und_cause} == DEFEASANCE"
            - "${e_defeased} == ERR_ISSUE_NOT_OUTSTANDING (409) — priority 9 outranks priority 14 even though the terminated incumbent still makes the uniqueness rule true"
            - "${und_total} == 1 — neither rejected attempt persisted a row; the terminated undertaking is deliberately retained so the five-year lookback can still find its failures"

      - name: requirement_uniqueness_is_per_undertaking_and_kind
        claim_type: violation_to_error
        grounds:
          - validations.priority_15
          - entities.ContentRequirement.fields.kind
        distinguishing_aspect: >-
          Uniqueness is on the PAIR (undertaking_id, kind), so the same kind is refused on the same
          undertaking even with a different label and weight, while a different kind on the same
          undertaking and the same kind on a different undertaking both succeed. The rejected
          request must also leave content_weight_bp_total untouched, proving the check runs before
          the derived total is updated.
        test_recipe:
          setup:
            - "Two OUTSTANDING BondIssues, each with one ACTIVE Undertaking."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_a: "$.data.id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026B", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_b: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_a}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_a: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_b}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_b: "$.data.id" }
          trigger:
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_a}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 6000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { r1: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_a}", kind: "AUDITED_FINANCIALS", label: "Audited Financials (Enterprise Funds)", weight_bp: 1500 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_dup: "$.data.error_id" }
            - call: "GET /disclosure/undertakings/${und_a}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { total_a1: "$.data.content_weight_bp_total" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_a}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 4000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { r2: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_b}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 10000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { r3: "$.data.id" }
            - call: "GET /disclosure/content-requirements?undertaking_id=${und_a}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { count_a: "$.total_count" }
            - call: "GET /disclosure/undertakings/${und_a}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { total_a2: "$.data.content_weight_bp_total" }
          assert:
            - "${e_dup} == ERR_DUPLICATE_REQUIREMENT (409) — a different label and weight do not make it a different requirement"
            - "${total_a1} == 6000 — the refused row added nothing; the check precedes the derived total"
            - "${r2} and ${r3} are both created (201): a different kind on the same undertaking and the same kind on a different undertaking are unrelated"
            - "${count_a} == 2 and ${total_a2} == 10000"

      - name: empty_requirement_set_reports_absence_not_imbalance
        claim_type: cascading_validation
        grounds:
          - validations.priority_17
          - validations.priority_18
        distinguishing_aspect: >-
          The two cycle-creation gates are a deliberately ordered pair: an empty requirement set
          ALSO fails the 10000-closure test (its sum is 0), so the closure check must not run
          first or ERR_NO_CONTENT_REQUIREMENTS becomes unreachable. The same endpoint therefore
          returns three different outcomes on the same undertaking as requirements accumulate —
          absence, then imbalance, then success.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with one ACTIVE Undertaking that has NO ContentRequirement rows yet."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", total0: "$.data.content_weight_bp_total" }
          trigger:
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_empty: "$.data.error_id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 6000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { r1: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_unbalanced: "$.data.error_id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 4000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { r2: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id", cycle_status: "$.data.status", cycle_score: "$.data.completeness_score_pct" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_count: "$.total_count" }
            - call: "GET /disclosure/annual-report-cycles?undertaking_id=${und_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_total: "$.total_count" }
          assert:
            - "${total0} == 0"
            - "${e_empty} == ERR_NO_CONTENT_REQUIREMENTS (409) — NOT ERR_CONTENT_WEIGHTS_UNBALANCED, even though 0 != 10000"
            - "${e_unbalanced} == ERR_CONTENT_WEIGHTS_UNBALANCED (422) — with one 6000-bp row the set is non-empty, so the second gate is now the one that speaks"
            - "${cycle_status} == DRAFTING, ${cycle_score} == 0.00 and ${item_count} == 2 once the weights close at 10000"
            - "${cycle_total} == 1 — the two refused attempts left no partial cycle and no items behind"

      - name: a_second_draft_on_the_same_subject_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_29
          - endpoints.POST_/disclosure/filings
        distinguishing_aspect: >-
          Subject exclusivity counts DRAFT filings, not just filed ones: the first draft already
          occupies the subject even though nothing has been submitted. The tuple is the whole
          subject, so a second notice on the same issue is a different subject and drafts freely —
          an implementation that keys exclusivity on issue_id alone wrongly blocks it.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with an ACTIVE Undertaking and two MATERIAL notices."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2024-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { n1: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "MERGER_OR_SALE", occurrence_date: "2026-07-28" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { n2: "$.data.id" }
            - call: "POST /disclosure/material-event-notices/${n1}/determine"
              payload: { determination: "MATERIAL", determination_note: "Successor trustee appointed." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
            - call: "POST /disclosure/material-event-notices/${n2}/determine"
              payload: { determination: "MATERIAL", determination_note: "Asset transfer is material." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { iv1: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "MATERIAL_EVENT_NOTICE", material_event_id: "${n1}", expected_issue_version: "${iv1}" }
