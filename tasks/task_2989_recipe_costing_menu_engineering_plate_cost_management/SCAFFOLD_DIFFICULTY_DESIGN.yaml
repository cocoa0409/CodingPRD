            - "Recipe.${grill_id}.cost_state == STALE, batch_cost_micros == 3880071 (never recomputed by approve), kcal_per_portion_micros == 600000000 and sodium_mcg_per_portion == 930000"
            - "MenuItem.${mi_id}.plate_cost_state == STALE with plate_cost_cents still 100 and margin_class == UNCLASSIFIED"
  - rule_id: transitive_cascade
    instances:
      - name: price_feed_publication_five_hop_invalidation_from_ingredient_to_margin_class
        grounds:
          - state_machines.PriceFeed.DRAFT_to_PUBLISHED
          - entities.PriceFeed.fields.affected_recipe_count
          - entities.PriceFeed.fields.affected_menu_item_count
          - entities.PriceFeed.fields.superseded_price_count
          - entities.Recipe.fields.cost_state
          - entities.MenuItem.fields.plate_cost_state
          - entities.MenuItem.fields.margin_class
        distinguishing_aspect: |
          One publish call walks five sequential hops across four entity types: the new
          IngredientPrice truncates the old row (HOP 1), the sub-recipe that consumes the
          ingredient goes STALE (HOP 2), the PLATED parent that consumes the sub-recipe goes STALE
          purely because its CHILD moved (HOP 3 — a recipe-DAG edge, not an ingredient edge), its
          MenuItem's plate cost goes STALE (HOP 4) and the item's margin_class is reset (HOP 5),
          while every cost FIGURE stays frozen at its last roll-up. The other transitive_cascade
          instance starts from a spec-change approval and ends on an LTOCampaign reverse edge, and
          it changes nutrition roll-ups that this one leaves untouched.
        test_recipe:
          setup:
            - "Ingredient CHEDDAR-BLOCK (pack 2268) with one PUBLISHED open-ended MW price of 22000000 from 2026-07-01T00:00:00Z."
            - "Sub-recipe SUB-CHEESE (SUB_RECIPE, GRAM, batch_yield 1000, portions 10, cheddar ep 500) rolled up to batch_cost_micros 4850088 / portion 485009, ACTIVE and FRESH."
            - "Recipe PLATE-MAC (PLATED, EACH, batch_yield 5, portions 5) whose only component is a SUB_RECIPE line on SUB-CHEESE at ep 200; rolled up to batch_cost_micros 970018 / portion 194004, ACTIVE and FRESH. PLATE-MAC references CHEDDAR-BLOCK nowhere directly."
            - "MenuItem MI-MAC-MW ACTIVE in MW at 400 cents with plate_cost_cents 21, plate_cost_state FRESH and margin_class STAR from a CLASSIFIED single-line review."
            - "A DRAFT PriceFeed carrying one CHEDDAR-BLOCK line at 25000000 effective from 2026-07-15T00:00:00.000Z, which will truncate the open-ended 2026-07-01 row."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
              captures: { feed1_recipes: $.data.affected_recipe_count }
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-CHEESE", name: "Cheese Sauce Base", recipe_type: "SUB_RECIPE", base_uom: "GRAM", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
              captures: { sub_id: $.data.id, sub_v0: $.data.version }
            - call: "POST /culinary/recipes/${sub_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 500, sequence_no: 1, expected_recipe_version: "${sub_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sub_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { sub_batch: $.data.batch_cost_micros, sub_portion: $.data.portion_cost_micros }
            - call: "POST /culinary/recipes/${sub_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sub_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-MAC", name: "Mac and Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 5, portions_per_batch: 5 }
              as: RecipeDeveloper
              captures: { mac_id: $.data.id, mac_v0: $.data.version }
            - call: "POST /culinary/recipes/${mac_id}/components"
              payload: { component_type: "SUB_RECIPE", child_recipe_id: "${sub_id}", ep_quantity_base_units: 200, sequence_no: 1, expected_recipe_version: "${mac_v0}" }
              as: RecipeDeveloper
              captures: { mac_comp_id: $.data.id }
            - call: "POST /culinary/recipes/${mac_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { mac_batch: $.data.batch_cost_micros, mac_portion: $.data.portion_cost_micros, mac_depth: $.data.depth }
            - call: "POST /culinary/recipes/${mac_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${mac_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-MAC-MW", name: "Mac and Cheese", recipe_id: "${mac_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate_cents: $.data.plate_cost_cents, plate_micros: $.data.plate_cost_micros, fc_bps: $.data.food_cost_bps, cm_cents: $.data.contribution_margin_cents }
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/units"
              payload: { code: "UNIT-MW-01", name: "Downtown MW", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews"
              payload: { unit_id: "${unit_id}", period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-08-01T00:00:00.000Z", basis: "SALES_MIX_BASED" }
              as: CostAnalyst
              captures: { rev_id: $.data.id }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/mix-lines"
              payload: { menu_item_id: "${mi_id}", units_sold: 50, gross_sales_cents: 20000 }
              as: CostAnalyst
              captures: { line_id: $.data.id, line_snapshot: $.data.plate_cost_cents_snapshot }
            - call: "POST /culinary/menu-period-reviews/${rev_id}/classify"
              as: CostAnalyst
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed2_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed2_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 25000000, effective_from: "2026-07-15T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed2_line_id: $.data.id }
          trigger:
            - call: "POST /culinary/price-feeds/${feed2_id}/publish"
              as: CostAnalyst
              captures: { f2_status: $.data.status, f2_superseded: $.data.superseded_price_count, f2_recipes: $.data.affected_recipe_count, f2_items: $.data.affected_menu_item_count }
          assert:
            - "${feed1_recipes} == 0 — the first publish had nothing to invalidate, so the counters on the second publish are unambiguous"
            - "${sub_batch} == 4850088 and ${sub_portion} == 485009; ${mac_batch} == 970018 (200 * 4850088 / 1000 = 970017.6), ${mac_portion} == 194004 and ${mac_depth} == 1"
            - "${plate_micros} == 205884 and ${plate_cents} == 21 — s1 194004, s2 197884, garnish clamped up to GARNISH_FLOOR_MICROS 8000 because the proportional 2968 is below the floor"
            - "${fc_bps} == 525 and ${cm_cents} == 379; ${line_snapshot} == 21"
            - "${f2_status} == PUBLISHED and ${f2_superseded} == 1 — HOP 1 truncated the open-ended 2026-07-01 row to effective_to 2026-07-15 and flipped it to SUPERSEDED"
            - "${f2_recipes} == 2 — HOP 2 caught SUB-CHEESE through its ingredient and HOP 3 caught PLATE-MAC through the recipe-DAG edge alone"
            - "${f2_items} == 1 — HOP 4"
            - "Recipe.${sub_id}.cost_state == STALE with batch_cost_micros still 4850088 and portion_cost_micros still 485009"
            - "Recipe.${mac_id}.cost_state == STALE with batch_cost_micros still 970018 and portion_cost_micros still 194004"
            - "RecipeComponent.${mac_comp_id}.unit_cost_micros_used == 4850088 and extended_cost_micros == 970018 — the cascade invalidates states, never figures"
            - "MenuItem.${mi_id}.plate_cost_state == STALE with plate_cost_cents still 21 and margin_class == UNCLASSIFIED (HOP 5)"
            - "MenuMixLine.${line_id}.plate_cost_cents_snapshot == 21 and margin_class == STAR — the closed history the cascade must not rewrite"

      - name: spec_change_approval_cascade_from_component_to_lto_campaign
        grounds:
          - state_machines.SpecChangeOrder.PENDING_to_APPROVED
          - state_machines.LTOCampaign.COSTED_to_PLANNED
          - calculations.allergen_nutrition_rollup
          - entities.LTOCampaign.fields.promo_plate_cost_cents
          - entities.PrepGuide.fields.sync_state
          - entities.CountSheetLine.fields.sync_state
        distinguishing_aspect: |
          Approving one COMPONENT_QTY spec change walks component -> recipe -> menu item ->
          LTOCampaign, and the last hop is a REVERSE state-machine edge (COSTED back to PLANNED
          with its three promo figures cleared to 0) rather than another state flag; on the way it
          recomputes the nutrition roll-up (sodium 620000 -> 930000) while deliberately leaving
          batch_cost_micros at 3880071, and it enqueues the prep guide and the open count sheet as
