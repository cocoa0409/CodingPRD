  - method: POST
    path: "/v1/athletes/{id}/beacon_sessions"
    description: "Start a beacon sharing session; requires ACTIVE subscription and >= 1 safety contact; one LIVE session per athlete"
    roles: [Athlete, PlatformAdmin]
    code: 201
    input: []
    output: BeaconSession
    side_effects: ["status=LIVE, started_at=logical clock now"]

  - method: GET
    path: "/v1/athletes/{id}/beacon_sessions"
    description: "List beacon sessions of an athlete"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: "BeaconSession[]"
    side_effects: []

  - method: GET
    path: "/v1/beacon_sessions/{id}"
    description: "Get a beacon session"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: []
    output: BeaconSession
    side_effects: []

  - method: POST
    path: "/v1/athletes/{id}/beacon_sessions/{id}/ping"
    description: "Update the live location of a beacon session"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: [lat, lng]
    output: BeaconSession
    side_effects: ["last_location := {lat, lng}"]

  - method: POST
    path: "/v1/athletes/{id}/beacon_sessions/{id}/stop"
    description: "Stop a beacon session (self)"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: []
    output: BeaconSession
    side_effects: ["status LIVE -> ENDED"]

  - method: GET
    path: "/v1/heatmap"
    description: "Heat map aggregation: cells with contribution_count >= MIN_CELL_COUNT (3); opt-out athletes excluded"
    roles: [Athlete, PlatformAdmin, Moderator]
    code: 200
    input: ["city?", "sport_type?"]
    output: "HeatmapCell[]"
    side_effects: []

  # --- Route planning ---
  - method: POST
    path: "/v1/athletes/{id}/route_plans"
    description: "Create a route plan; free tier capped at FREE_WEEKLY_ROUTE_CAP (3) plans per week_start; computes estimated_load_score"
    roles: [Athlete, PlatformAdmin]
    code: 201
    input: [name, waypoints, distance_m, week_start]
    output: RoutePlan
    side_effects: ["estimated_load_score computed via route_load_score"]

  - method: GET
    path: "/v1/athletes/{id}/route_plans"
    description: "List route plans of an athlete"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: ["week_start?"]
    output: "RoutePlan[]"
    side_effects: []

  - method: GET
    path: "/v1/route_plans/{id}"
    description: "Get a route plan"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: []
    output: RoutePlan
    side_effects: []

  # --- Test-driving endpoints (declared per §1.5 priority ladder rung 3) ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time. Drives lazy transitions (subscription lapse, challenge close, event completion) and all time-window validations."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advanced; lazy transitions evaluate on next read"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity_backed ownership check failed (acting on another athlete's resource, non-admin club action)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist; also returned to non-owners reading an auto_hidden activity" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range numeric, body FK target does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in a state that forbids the operation (e.g. join a DRAFT/CLOSED challenge, RSVP to CANCELLED event, flag an effort whose activity is CONFIRMED, activate ACTIVE segment)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_athlete_version does not match the athlete's current version on privacy-zone update" }
  - { id: ERR_DUPLICATE_ACTIVITY, http: 409, condition: "strict_duplicate=true upload that duplicate detection would otherwise merge (same idempotency_key, or same device_source with started_at within 120s and distance within 5%)" }
  - { id: ERR_UNIQUE_VIOLATION, http: 409, condition: "Uniqueness constraint hit: email taken, second privacy zone for athlete, club name taken among non-ARCHIVED, segment (name, sport_type) taken among non-RETIRED, contact_email duplicate for athlete, second LIVE beacon session, second OPEN flag on same effort, duplicate club/challenge/event join" }
  - { id: ERR_SAFETY_VIOLATION, http: 422, condition: "Safety rule violated: beacon without safety contact, activating/updating a segment to hazard_index > 0 while it has ELIGIBLE efforts on leaderboards" }
  - { id: ERR_WINDOW_VIOLATION, http: 422, condition: "Temporal rule violated: challenge end before start, event scheduled_at not in the future, challenge started after end_date, RSVP/rejoin after scheduled_at" }
  - { id: ERR_SUBSCRIPTION_REQUIRED, http: 402, condition: "Feature gated behind an ACTIVE subscription: leaderboard limit > 10, route plan beyond free weekly cap, beacon session creation" }
  - { id: ERR_FREE_TIER_ROUTE_CAP, http: 402, condition: "Free-tier weekly route-plan cap reached (3 plans with same week_start)" }
  - { id: ERR_INCONSISTENT_REFERENCE, http: 422, condition: "Cross-entity reference inconsistent: event segment not ACTIVE or hazardous, corrected_sport_type equal to sport_type or invalid" }
  - { id: ERR_FLAG_SELF, http: 422, condition: "Reporter is the owner of the effort's activity" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Event RSVP would exceed capacity (rsvp_count == capacity) on create or rejoin" }
  - { id: ERR_CLUB_ARCHIVED, http: 409, condition: "Operation targets an ARCHIVED club (join, challenge create/start, event create)" }
  - { id: ERR_SEGMENT_OVERLAP, http: 409, condition: "Segment activation would create a duplicate course section: another ACTIVE same-sport segment has both endpoints within 50m (strict <)" }
  - { id: ERR_EVENT_TIME_OVERLAP, http: 409, condition: "Virtual event's half-open 1-hour window [scheduled_at, scheduled_at+3600s) intersects another PUBLISHED event of the same club" }
  - { id: ERR_DUPLICATE_MEMBERSHIP, http: 409, condition: "Athlete already holds a PENDING or ACTIVE membership in this club" }
  - { id: ERR_ALREADY_JOINED, http: 409, condition: "Athlete already holds a JOINED or COMPLETED participation in this challenge" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Athlete
    description: "Registered athlete acting on their own resources; X-User-ID equals the Athlete.id they act as"
    identity: "entity_backed:Athlete"
    exclusive_operations:
      - "POST /v1/athletes/{id}/activities — upload own activity"
      - "POST /v1/athletes/{id}/privacy_zones + PUT/disable/enable — manage own zone"
      - "POST /v1/athletes/{id}/safety_contacts — manage own contacts"
      - "POST /v1/athletes/{id}/beacon_sessions + ping/stop — own beacon sessions"
      - "POST /v1/athletes/{id}/route_plans — own route plans"
      - "DELETE /v1/athletes/{id} — self-deletion only"
      - "POST /v1/clubs/{id}/memberships/{mid}/leave — leave own membership"
      - "POST /v1/challenges/{id}/participations/{pid}/withdraw — withdraw own participation"
      - "POST /v1/events/{id}/rsvps/{rid}/decline|rejoin — own RSVP"
    shared_operations:
      - "POST /v1/athletes, GET reads of public resources"
      - "POST /v1/segments + activate/retire own segments"
      - "POST /v1/efforts/{id}/flags — flag others' efforts"
      - "POST /v1/clubs + archive own club; join clubs; approve/remove members when club ADMIN"
      - "POST /v1/clubs/{id}/challenges(+start/cancel) when club ADMIN; join challenges"
      - "POST /v1/clubs/{id}/events(+cancel) when club ADMIN; RSVP"
      - "GET /v1/segments/{id}/leaderboard, GET /v1/heatmap"

  - name: Moderator
    description: "Leaderboard-integrity moderator; adjudicates flags"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/flags/{id}/uphold"
      - "POST /v1/flags/{id}/reject"
    shared_operations:
      - "GET reads of activities, efforts, segments, flags, clubs, challenges, events, heatmap"
      - "POST /v1/activities/{id}/correct_category"

  - name: PlatformAdmin
    description: "Operator role with superset access (hierarchical override) and exclusive control of the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "All business endpoints (create athletes, subscriptions, zones, activities, segments, clubs, challenges, events; uphold/reject flags)"
