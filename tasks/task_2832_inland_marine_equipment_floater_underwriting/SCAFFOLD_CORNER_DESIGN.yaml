  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_occ_policy_version_guards_the_second_schedule_add
        claim_type: Optimistic Concurrency
        grounds:
          - concurrency_rules[equipment-item-create-stale-policy]
          - errors[ERR_STALE_POLICY_VERSION]
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: "The first item create bumps Policy.version, so re-using the token that authorised it on a second create returns 412 ERR_STALE_POLICY_VERSION and writes nothing; the rejected attempt does NOT bump the version, so the very same token becomes valid again only after a fresh read."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One DRAFT T2_URBAN policy (minimum 100000) with one SCHEDULED_EQUIPMENT part: ACV, per_item_limit 20000000, aggregate 200000000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Stale Token Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E2", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E2", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1} + 1" }
              as: Underwriter
              captures: { it2: $.data.id }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E3", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1} + 1" }
              as: Underwriter
          assert:
            - "after setup: Policy.${pol}.version == ${pol_v1} + 1 (the accepted E1 create bumped it) and CoveragePart.${cp}.rated_premium_cents == 173318"
            - "trigger[0] HTTP status == 412 and error_id == ERR_STALE_POLICY_VERSION"
            - "after trigger[0]: Policy.${pol}.version == ${pol_v1} + 1 - a REJECTED write does not increment the version"
            - "after trigger[0]: CoveragePart.${cp}.rated_premium_cents is still 173318 and exactly 1 EquipmentItem row exists"
            - "trigger[1] HTTP status == 201 with the correct current version; EquipmentItem.${it2}.rated_premium_cents == 173318"
            - "after trigger[1]: Policy.${pol}.version == ${pol_v1} + 2, CoveragePart.${cp}.rated_premium_cents == 346636, Policy.${pol}.written_premium_cents == 360501, total_insured_value_cents == 16320000"
            - "trigger[2] HTTP status == 412 and error_id == ERR_STALE_POLICY_VERSION - the token that just worked is now stale, proving the version advances on EVERY accepted write and not merely on the first"
            - "the part create in setup did NOT bump Policy.version: adding a coverage part is explicitly outside the OCC guard, so ${pol_v1} was still current for the E1 create"

      - name: corner_occ_coverage_part_version_guards_the_restatement
        claim_type: Optimistic Concurrency
        grounds:
          - concurrency_rules[value-report-supersede-stale-part]
          - errors[ERR_STALE_COVERAGE_PART_VERSION]
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: "Both an accepted value-report filing and an unrelated PATCH of the part bump CoveragePart.version, so a restatement carrying either pre-write token returns 412 ERR_STALE_COVERAGE_PART_VERSION while the same body with the freshly read token returns 201."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default, then advanced to 2026-09-10."
            - "One IN_FORCE T2_URBAN policy (minimum 100000) whose only part is a MONTHLY REPORTING_FORM at 250 bp with reporting_limit 20000000."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Stale Restatement Warehousing", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "REPORTING_FORM", valuation_basis: "ACV", deductible_cents: 100000, aggregate_limit_cents: 200000000, reporting_frequency: "MONTHLY", reporting_annual_rate_bp: 250, reporting_limit_cents: 20000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: UnderwritingManager
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: Underwriter
              captures: { cp_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/value-reports"
              payload: { period_start_date: "2026-08-01", period_end_date: "2026-08-31", reported_value_cents: 9000000, expected_coverage_part_version: "${cp_v1}" }
              as: Policyholder
              as_user_id: "${pol}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/value-reports"
              payload: { period_start_date: "2026-08-01", period_end_date: "2026-08-31", reported_value_cents: 12000000, expected_coverage_part_version: "${cp_v1}" }
              as: Policyholder
              as_user_id: "${pol}"
            - call: "PATCH /inland-marine/coverage-parts/${cp}"
              payload: { reporting_annual_rate_bp: 300 }
              as: Underwriter
            - call: "POST /inland-marine/coverage-parts/${cp}/value-reports"
              payload: { period_start_date: "2026-08-01", period_end_date: "2026-08-31", reported_value_cents: 12000000, expected_coverage_part_version: "${cp_v1} + 1" }
              as: Policyholder
              as_user_id: "${pol}"
            - call: "POST /inland-marine/coverage-parts/${cp}/value-reports"
              payload: { period_start_date: "2026-08-01", period_end_date: "2026-08-31", reported_value_cents: 12000000, expected_coverage_part_version: "${cp_v1} + 2" }
              as: Policyholder
              as_user_id: "${pol}"
              captures: { r2: $.data.id }
          assert:
            - "after setup: CoveragePart.${cp}.version == ${cp_v1} + 1 and ValueReport.${r1}.status == SUBMITTED"
            - "trigger[0] HTTP status == 412 and error_id == ERR_STALE_COVERAGE_PART_VERSION"
            - "after trigger[0]: ValueReport.${r1}.status is still SUBMITTED, superseded_by_report_id is still null, exactly 1 ValueReport row exists, and CoveragePart.${cp}.version is still ${cp_v1} + 1"
            - "trigger[1] HTTP status == 200 and CoveragePart.${cp}.version == ${cp_v1} + 2 - an unrelated endorsement also invalidates outstanding report tokens"
            - "trigger[2] HTTP status == 412 and error_id == ERR_STALE_COVERAGE_PART_VERSION (the token that was current between the two writes)"
            - "trigger[3] HTTP status == 201; ValueReport.${r2}.status == SUBMITTED and ValueReport.${r1}.status == SUPERSEDED with superseded_by_report_id == ${r2}"
            - "after trigger[3]: CoveragePart.${cp}.version == ${cp_v1} + 3"
            - "no ledger entry other than the INITIAL_PREMIUM +100000 exists at any point: nothing was adjudicated, so Policy.${pol}.premium_balance_cents == 100000 throughout"

      - name: corner_jobsite_resurvey_cascades_four_levels_to_the_policy
        claim_type: Cascading Side Effect
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - endpoints[POST /inland-marine/jobsites/{id}/security-survey]
          - calculations.jobsite_security_tier
          - calculations.equipment_item_premium
        distinguishing_aspect: "One security survey walks Jobsite -> EquipmentItem -> CoveragePart -> Policy in a single request: the site moves TIER_0 -> TIER_2, the item's applied_credit_bp moves 1500 -> 2200 and its premium 147321 -> 135188, the part follows to 135188 and the policy's written premium to 140596."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One DRAFT T2_URBAN policy (minimum 100000), one SCHEDULED_EQUIPMENT part, one UNSURVEYED jobsite at TIER_0, and one geo-tracked grade-A excavator standing on that jobsite (the tracker is what makes the TIER_0 assignment legal at all)."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Cascade Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Cascade Yard", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Excavator E1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: true, assigned_jobsite_id: "${js}", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /inland-marine/jobsites/${js}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: false }
              as: Underwriter
            - call: "GET /inland-marine/equipment-items/${it1}"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/coverage-parts/${cp}"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
          assert:
            - "before trigger[0]: Jobsite.${js}.status == UNSURVEYED, security_score == 0, security_tier == TIER_0; EquipmentItem.${it1}.applied_credit_bp == 1500 (geo tracker on a grade-A item only) and rated_premium_cents == 147321; CoveragePart.${cp}.rated_premium_cents == 147321; Policy.${pol}.written_premium_cents == 153214"
            - "trigger[0] HTTP status == 200; hop 1: Jobsite.${js}.security_score == 3 (fenced 1 + lighting 1 + alarm 1, guard weight 2 not earned), security_tier == TIER_2, status == SURVEYED, surveyed_at == 2026-08-01T00:00:00Z"
            - "trigger[1]: hop 2: EquipmentItem.${it1}.applied_credit_bp == 2200 (1500 geo + 700 TIER_2) and rated_premium_cents == 135188; insured_value_cents is unchanged at 8160000 and applied_base_rate_bp is unchanged at 180"
            - "trigger[2]: hop 3: CoveragePart.${cp}.rated_premium_cents == 135188"
            - "trigger[3]: hop 4: Policy.${pol}.sum_of_part_premiums_cents == 135188, written_premium_cents == 140596, total_insured_value_cents == 8160000 (unchanged - the cascade moves premium, not insured value)"
            - "the whole four-hop chain is visible with NO intervening quote: the survey itself re-rates, so trigger[1..3] are plain reads"
            - "ordering matters: applying the 700 bp tier credit before the 1500 bp geo credit or capping each separately would not reach 135188, since the credits are summed and then applied once as (10000 - 2200)"
            - "partial failure is atomic: a later re-survey of { fenced: false, lighting: false, alarm_monitored: false, guarded_24h: false } that would drop the site to TIER_0 is rejected only when the standing grade-A item has no tracker; here the item IS tracked, so such a re-survey succeeds and walks the same four hops back to applied_credit_bp 1500 / part 147321 / written 153214"

