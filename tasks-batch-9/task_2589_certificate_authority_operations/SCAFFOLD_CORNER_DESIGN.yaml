      - name: audit_opinion_gates_reject_out_of_order_findings_opinions_and_correspondence
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_AUDIT_PERIOD]
          - errors[ERR_AUDIT_ALREADY_OPEN]
          - errors[ERR_AUDIT_NOT_OPINED]
          - errors[ERR_AUDIT_NO_FINDINGS]
          - errors[ERR_AUDIT_NOT_IN_FIELDWORK]
          - errors[ERR_AUDIT_NOT_OPEN_FOR_FINDINGS]
          - validations[priority=97]
          - validations[priority=98]
          - validations[priority=55]
          - validations[priority=114]
          - validations[priority=54]
          - validations[priority=53]
        distinguishing_aspect: "The audit lifecycle is a one-way door in both directions: before the opinion, correspondence is refused (ERR_AUDIT_NOT_OPINED) and an opinion with zero findings is refused (ERR_AUDIT_NO_FINDINGS); after the opinion, a second opinion is refused (ERR_AUDIT_NOT_IN_FIELDWORK) and further findings are refused (ERR_AUDIT_NOT_OPEN_FOR_FINDINGS). Creation additionally rejects a zero-length period and a period longer than 366 days, and only one non-opined audit per root program may exist."
        test_recipe:
          setup:
            - "Empty database at 2026-08-01T00:00:00Z; one SCHEDULED MOZILLA audit covering 2025-08-01 to 2026-07-31 (364 days)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/root-program-audits"
              payload: { root_program: "MOZILLA", period_start: "2025-08-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /ca/root-program-audits"
              payload: { root_program: "APPLE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_period_zero: $.data.error_id }
            - call: "POST /ca/root-program-audits"
              payload: { root_program: "APPLE", period_start: "2026-01-01T00:00:00Z", period_end: "2027-02-05T00:00:00Z" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_period_too_long: $.data.error_id }
            - call: "POST /ca/root-program-audits"
              payload: { root_program: "MOZILLA", period_start: "2025-09-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_already_open: $.data.error_id }
            - call: "POST /ca/root-program-audits/${audit_id}/communications"
              payload: { root_program: "MOZILLA", body: "Follow-up filed before any opinion was issued" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_not_opined: $.data.error_id }
            - call: "POST /ca/root-program-audits/${audit_id}/opine"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_no_findings: $.data.error_id }
            - call: "POST /ca/root-program-audits/${audit_id}/findings"
              payload: { severity: "MINOR", summary: "CRL publication log retained only 90 days" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
            - call: "POST /ca/root-program-audits/${audit_id}/opine"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { opined_state: $.data.state }
            - call: "POST /ca/root-program-audits/${audit_id}/opine"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_not_in_fieldwork: $.data.error_id }
            - call: "POST /ca/root-program-audits/${audit_id}/findings"
              payload: { severity: "CRITICAL", summary: "Late finding raised after the opinion was issued" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_not_open_for_findings: $.data.error_id }
            - call: "POST /ca/root-program-audits/${audit_id}/communications"
              payload: { root_program: "MOZILLA", body: "Remediation plan for the single minor finding" }
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { comm_kind: $.data.kind, comm_deadline: $.data.within_deadline }
          assert:
            - "the first trigger returns HTTP 422 and ${err_period_zero} == ERR_INVALID_AUDIT_PERIOD"
            - "the second trigger returns HTTP 422 and ${err_period_too_long} == ERR_INVALID_AUDIT_PERIOD (2026-01-01 to 2027-02-05 is 400 days)"
            - "the third trigger returns HTTP 409 and ${err_already_open} == ERR_AUDIT_ALREADY_OPEN"
            - "GET /ca/root-program-audits returns total_count == 1 after the three rejected creations"
            - "the fourth trigger returns HTTP 409 and ${err_not_opined} == ERR_AUDIT_NOT_OPINED"
            - "the fifth trigger returns HTTP 422 and ${err_no_findings} == ERR_AUDIT_NO_FINDINGS while the audit is still SCHEDULED with finding_count == 0"
            - "after the findings call the audit is FIELDWORK with finding_count == 1 and critical_finding_count == 0"
            - "the seventh trigger returns HTTP 200 with ${opined_state} == UNQUALIFIED, opinion_at == 2026-08-01T00:00:00Z, assessed_subscriber_count == 0 and retired_profile_count == 0"
            - "the eighth trigger returns HTTP 409 and ${err_not_in_fieldwork} == ERR_AUDIT_NOT_IN_FIELDWORK"
            - "the ninth trigger returns HTTP 409 and ${err_not_open_for_findings} == ERR_AUDIT_NOT_OPEN_FOR_FINDINGS, and finding_count is still 1 with critical_finding_count 0"
            - "the tenth trigger returns HTTP 201 with ${comm_kind} == ROOT_PROGRAM_RESPONSE and ${comm_deadline} == true; GET /ca/root-program-audits/${audit_id}/communications returns total_count == 2 (the AUDIT_CLEAN_NOTICE from the opinion plus this response)"

      - name: a_second_open_vetting_or_authorization_for_the_same_key_is_refused
