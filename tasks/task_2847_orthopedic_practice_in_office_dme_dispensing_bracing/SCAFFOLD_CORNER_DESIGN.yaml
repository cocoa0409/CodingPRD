        excluded_because:
          difficulty_instance: awaiting_device_fitting_blocked_until_fab_order_accepted_rejected
          rationale: "That §1.8 instance is exactly the conditional-action claim for the fitting endpoint: identical request, refused while the fabrication order is unaccepted and accepted once the device is signed off, so the condition -- not the payload -- decides the outcome."

  - section: errors
    instances:
      - name: corner_unknown_path_ids_on_read_endpoints_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_CLINIC_NOT_FOUND]
          - errors[ERR_SUPPLIER_NOT_FOUND]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_PAR_LEVEL_NOT_FOUND]
          - errors[ERR_ENCOUNTER_NOT_FOUND]
          - errors[ERR_FITTER_NOT_FOUND]
          - errors[ERR_FITTING_RECORD_NOT_FOUND]
          - errors[ERR_FAB_ORDER_NOT_FOUND]
        distinguishing_aspect: |
          Every read endpoint that takes an id in the path must name the entity
          it failed to find, and it must do so with an EMPTY database -- there is
          no fallback to a generic 404 and no leaking of a neighbouring entity's
          error id. GET /dme/fitters/{id} is the interesting one: it is the only
          path-shaped use of ERR_FITTER_NOT_FOUND, which elsewhere is reserved
          for an unknown fitter ACTOR, so both readings of the same error id have
          to work.
        test_recipe:
          setup:
            - "no entities at all; every id below is a well-formed identifier that was never issued"
          setup_api_calls: []
          trigger:
            - call: "GET /dme/clinics/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PracticeAdmin
              captures: { err_clinic: $.data.error_id }
