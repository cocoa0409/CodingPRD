# §1.9 breadth probe for task_2995_reentry_employment_services
# One pass over the nine claim-extraction sections; corners already owned by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
scaffold_corner_design:
- section: entities
  instances:
  - name: create_participant_returns_every_declared_field_and_default
    claim_type: creation
    grounds:
    - entities.Participant.fields
    - endpoints[POST /participants]
    distinguishing_aspect: The create response must carry the whole Participant projection with the declared defaults
      already materialised — stage PRE_RELEASE, release_plan_status NONE, verified_document_types [], doc_completeness_pct
      0.0, engagement_posture OPEN, version 1 — not a bare {id} echo and not a row with null system fields.
    test_recipe:
      setup:
      - empty database
      - logical clock at 2026-08-01T08:00:00.000Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      trigger:
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      assert:
      - HTTP 201
      - data.full_name == "Marcus Reed"
      - data.facility_name == "Northgate Correctional"
      - data.facility_state == "OH"
      - data.expected_release_date == "2026-08-10"
      - data.record_categories == ["PROPERTY_OFFENSE"]
      - data.required_document_types == ["STATE_ID", "SSN_CARD", "BIRTH_CERTIFICATE", "WORK_HISTORY", "MEDICAID_APPLICATION"]
      - data.verified_document_types == []
      - data.doc_completeness_pct == 0.0
      - data.assessment_domain_scores == null
      - data.barrier_score == null
      - data.barrier_tier == null
      - data.stage == "PRE_RELEASE"
      - data.release_plan_status == "NONE"
      - data.release_plan_revision == 0
      - data.suspension_status == "NONE"
      - data.license_relief_status == "NONE"
      - data.petition_rounds_used == 0
      - data.engagement_posture == "OPEN"
      - data.actual_release_date == null
      - data.exit_reason == null and data.exit_date == null
      - data.assigned_case_manager_user_id == "cm-1"
      - data.version == 1 and data.id is a UUID with no type prefix
      - meta.api_request_id and meta.api_request_timestamp are present, response_type == "object"
  - name: get_grant_returns_stored_inputs_and_computed_ledger_columns
    claim_type: retrieval
    grounds:
    - entities.FunderGrant.fields
    - endpoints[GET /grants/{id}]
    - calculations.grant_ledger
    distinguishing_aspect: GET must return the stored grant with its computed ledger columns already reconciled at
      zero activity (committed 0, disbursed 0, available == authorized, posture OPEN) rather than nulls for the computed
      fields.
    test_recipe:
      setup:
      - empty database
      - one FunderGrant, no requests and no placements
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /grants
        payload:
          funder_name: Reentry Workforce Fund
          program_year: 2026
          authorized_cents: 100000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 75.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      trigger:
      - call: GET /grants/${g1_id}
        as: FunderAnalyst
        as_user_id: analyst-1
      assert:
      - HTTP 200
      - data.funder_name == "Reentry Workforce Fund"
      - data.program_year == 2026
      - data.authorized_cents == 100000
      - data.per_participant_cap_cents == 60000
      - data.retention_benchmark_pct == 75.0
      - data.allowed_categories == ["TOOLS", "UNIFORM", "TRANSIT_PASS", "ID_FEE", "LICENSE_FEE", "WAGE_SUBSIDY"]
      - data.committed_cents == 0
      - data.disbursed_cents == 0
      - data.available_cents == 100000
      - data.funding_posture == "OPEN"
      - data.open_request_count == 0
      - data.version == 1
  - name: list_participants_paginates_with_total_count_and_has_more
    claim_type: listing
    grounds:
    - endpoints[GET /participants]
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: total_count must report the whole matching set (3) while data carries only the page (2),
      and has_more must flip to false on the last page — a total_count that echoes the page length, or has_more computed
      from limit alone, fails.
    test_recipe:
      setup:
      - empty database
      - exactly three Participants created in order
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Dana Whitfield
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - DRUG_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p2_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Alvin Peters
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - DUI
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p3_id: $.data.id
      trigger:
      - call: GET /participants
        payload:
          limit: 2
          offset: 0
        as: CaseManager
        as_user_id: cm-1
      - call: GET /participants
        payload:
          limit: 2
          offset: 2
        as: CaseManager
        as_user_id: cm-1
      assert:
      - 'first call: HTTP 200, response_type == "array", data has 2 elements'
      - 'first call: total_count == 3, limit == 2, offset == 0, has_more == true'
      - 'second call: data has 1 element'
      - 'second call: total_count == 3, limit == 2, offset == 2, has_more == false'
      - the two pages together contain three distinct Participant ids
  - name: get_participant_with_an_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - validations[path-entity-exists]
    - errors[ERR_PARTICIPANT_NOT_FOUND]
    distinguishing_aspect: A syntactically valid UUID that belongs to another collection (a FunderGrant id) must still
      be a Participant miss — the addressed collection decides the NOT_FOUND code, not the id's mere existence somewhere
      in the database.
    test_recipe:
      setup:
      - one FunderGrant exists
      - no Participant exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /grants
        payload:
          funder_name: Reentry Workforce Fund
          program_year: 2026
          authorized_cents: 100000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 75.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      trigger:
      - call: GET /participants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          err: $.data.error_id
      assert:
      - HTTP 404
      - data.error_id == "ERR_PARTICIPANT_NOT_FOUND"
      - response_type == "error"
      - GET /grants/${g1_id} still returns HTTP 200 for the same id
  - name: create_job_opening_without_hourly_wage_cents_is_rejected
    claim_type: required_fields
    grounds:
    - validations[request-body-shape]
    - endpoints[POST /job-openings]
    - errors[ERR_VALIDATION]
    distinguishing_aspect: hourly_wage_cents carries no default and feeds both calculations.wage_subsidy_total and
      the match wage_component, so its absence is a 422 shape failure — not a JobOpening with a null wage.
    test_recipe:
      setup:
      - one ACTIVE EmployerPartnership pt1
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /employer-partnerships
        payload:
          employer_name: Northgate Logistics
          industry: LOGISTICS
          max_concurrent_placements: 2
          wotc_certified: true
          excluded_record_categories: []
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          pt1_id: $.data.id
      - call: POST /employer-partnerships/${pt1_id}/bonding-agreement
        payload:
          bond_coverage_cents: 500000
          bond_effective_date: '2026-08-01'
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ENGAGED
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ACTIVE
        as: EmployerLiaison
        as_user_id: liaison-1
      trigger:
      - call: POST /job-openings
        payload:
          partnership_id: ${pt1_id}
          title: Warehouse Associate
          occupation_code: 53-7062
          weekly_hours: 35
          openings_count: 2
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          err: $.data.error_id
      assert:
      - HTTP 422
      - data.error_id == "ERR_VALIDATION"
      - GET /employer-partnerships/${pt1_id}/job-openings returns total_count == 0
  - name: omitted_partnership_flags_take_their_declared_defaults
    claim_type: defaults
    grounds:
    - entities.EmployerPartnership.fields.wotc_certified
    - entities.EmployerPartnership.fields.excluded_record_categories
    - entities.EmployerPartnership.fields.fidelity_bond_enabled
    distinguishing_aspect: Omitting the two optional inputs must yield wotc_certified false and excluded_record_categories
      [] (not null), while the system-sourced bonding fields stay false/null until a bonding agreement is recorded.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      trigger:
      - call: POST /employer-partnerships
        payload:
          employer_name: Riverside Fabrication
          industry: MANUFACTURING
          max_concurrent_placements: 3
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          pt1_id: $.data.id
      assert:
      - HTTP 201
      - data.wotc_certified == false
      - data.excluded_record_categories == []
      - data.fidelity_bond_enabled == false
      - data.bond_coverage_cents == null and data.bond_effective_date == null
      - data.max_concurrent_placements == 3
      - data.active_placement_count == 0
      - data.status == "PROSPECT"
      - data.version == 1
  - name: work_shift_scheduled_hours_is_computed_from_the_interval
    claim_type: computed_fields
    grounds:
    - entities.WorkShift.fields.scheduled_hours
    - calculations.wage_subsidy_total
    distinguishing_aspect: scheduled_hours is a computed decimal derived from the stored interval (09:00->16:30 is
      7.5, not 7 and not 450), and the placement's projected subsidy must round the 7.5h tier-1 amount 6937.5 up to
      6938.
    test_recipe:
      setup: &id001
      - logical clock parked at 2026-08-01T08:00:00.000Z
      - 'FunderGrant g1: authorized_cents 30000, per_participant_cap_cents 60000, retention_benchmark_pct 75.0, allowed_categories
        = all six, restricted_floor 4500, funding_posture OPEN'
      - EmployerPartnership pt1 ACTIVE, wotc_certified true, fidelity_bond_enabled true, max_concurrent_placements
        2
      - 'JobOpening jo1 OPEN: hourly_wage_cents 1850, weekly_hours 35, openings_count 2, transit_accessible true'
      - 'Participant p1 POST_RELEASE: record_categories [PROPERTY_OFFENSE], doc_completeness_pct 80.0, barrier_score
        66.3 (HIGH), transportation_plan_type TRANSIT_PASS, engagement_posture OPEN'
      - SupervisionCase sc1 ACTIVE with work_authorization_status APPROVED and window [480, 1020]
      - Placement pl1 employment_status ACTIVE (offer accepted), start_date 2026-08-03, projected_subsidy_cents 0,
        actual_subsidy_cents 0
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /grants
        payload:
          funder_name: Reentry Workforce Fund
          program_year: 2026
          authorized_cents: 30000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 75.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: POST /employer-partnerships
        payload:
          employer_name: Northgate Logistics
          industry: LOGISTICS
          max_concurrent_placements: 2
          wotc_certified: true
          excluded_record_categories: []
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          pt1_id: $.data.id
      - call: POST /employer-partnerships/${pt1_id}/bonding-agreement
        payload:
          bond_coverage_cents: 500000
          bond_effective_date: '2026-08-01'
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ENGAGED
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /employer-partnerships/${pt1_id}/status
        payload:
          to_status: ACTIVE
        as: EmployerLiaison
        as_user_id: liaison-1
      - call: POST /job-openings
        payload:
          partnership_id: ${pt1_id}
          title: Warehouse Associate
          occupation_code: 53-7062
          hourly_wage_cents: 1850
          weekly_hours: 35
          openings_count: 2
          barred_record_categories: []
          requires_license: false
          requires_fidelity_bond: false
          transit_accessible: true
        as: EmployerLiaison
        as_user_id: liaison-1
        captures:
          jo1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 3
            transportation_score: 2
            health_score: 1
            work_history_score: 4
            documentation_score: 2
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: STATE_ID
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: SSN_CARD
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: BIRTH_CERTIFICATE
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/document-verifications
        payload:
          document_type: WORK_HISTORY
        as: CaseManager
        as_user_id: cm-1
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_v_a: $.data.version
      - call: PUT /participants/${p1_id}/release-plan
        payload:
          expected_participant_version: ${p1_v_a}
          housing_plan_type: TRANSITIONAL_HOUSING
          transportation_plan_type: TRANSIT_PASS
          health_coverage_target: MEDICAID
          planned_release_date: '2026-08-10'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /participants/${p1_id}/release-plan/approve
        payload: {}
        as: ProgramDirector
        as_user_id: pd-1
      - call: POST /participants/${p1_id}/release
        payload:
          actual_release_date: '2026-08-01'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /supervision-cases
        payload:
          participant_id: ${p1_id}
          officer_user_id: officer-1
          officer_name: M. Ruiz
          supervision_type: PAROLE
          expected_discharge_date: '2027-08-01'
        as: SupervisionOfficer
        as_user_id: officer-1
        captures:
          sc1_id: $.data.id
      - call: POST /supervision-cases/${sc1_id}/status
        payload:
          to_status: ACTIVE
        as: SupervisionOfficer
        as_user_id: officer-1
      - call: POST /supervision-cases/${sc1_id}/work-authorization
        payload:
          decision: APPROVED
          approved_window_start_minute: 480
          approved_window_end_minute: 1020
        as: SupervisionOfficer
        as_user_id: officer-1
      - call: GET /job-openings/${jo1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          jo1_v_a: $.data.version
      - call: POST /placements
        payload:
          participant_id: ${p1_id}
          job_opening_id: ${jo1_id}
          grant_id: ${g1_id}
          subsidy_track: SUBSIDIZED_WORK_EXPERIENCE
          expected_job_opening_version: ${jo1_v_a}
          start_date: '2026-08-03'
        as: CaseManager
        as_user_id: cm-1
        captures:
          pl1_id: $.data.id
      - call: POST /placements/${pl1_id}/offer-response
        payload:
          response: ACCEPTED
        as: Participant
        as_user_id: ${p1_id}
      trigger:
      - call: POST /placements/${pl1_id}/work-shifts
        payload:
          starts_at: '2026-08-05T09:00:00.000Z'
          ends_at: '2026-08-05T16:30:00.000Z'
        as: CaseManager
        as_user_id: cm-1
        captures:
          w1_id: $.data.id
      assert:
      - HTTP 201
      - data.scheduled_hours == 7.5
      - data.status == "SCHEDULED"
      - data.conflict_reason == null
      - data.placement_id == ${pl1_id}
      - GET /placements/${pl1_id} returns projected_subsidy_cents == 6938 (ROUND_HALF_UP(7.5 * 1850 * 0.5) = 6938)
        and actual_subsidy_cents == 0
      - GET /grants/${g1_id}/ledger returns committed_cents == 6938 and available_cents == 23062
  - name: support_request_system_fields_are_stamped_by_the_server
    claim_type: system_fields
    grounds:
    - entities.SupportRequest.fields.submitted_by_user_id
    - entities.SupportRequest.fields.status
    - entities.SupportRequest.fields.info_rounds_used
    distinguishing_aspect: submitted_by_user_id must come from the X-User-ID header (cm-1) and the review/settle/defer
      columns must be null on creation — the request body cannot seed them, and status is always SUBMITTED regardless
      of the grant's posture.
    test_recipe:
      setup:
      - logical clock at 2026-08-01T08:00:00.000Z
      - FunderGrant g1 authorized 100000, cap 60000, all categories allowed
      - Participant p1 PRE_RELEASE with a DRAFT release plan, not suspended
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
        as_user_id: cm-1
      - call: POST /grants
        payload:
          funder_name: Reentry Workforce Fund
          program_year: 2026
          authorized_cents: 100000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 75.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Marcus Reed
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - DRUG_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants/${p1_id}/assessment
        payload:
          assessment_domain_scores:
            housing_score: 0
            transportation_score: 0
            health_score: 0
            work_history_score: 0
            documentation_score: 0
        as: CaseManager
        as_user_id: cm-1
      - call: GET /participants/${p1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_v_a: $.data.version
      - call: PUT /participants/${p1_id}/release-plan
        payload:
          expected_participant_version: ${p1_v_a}
          housing_plan_type: TRANSITIONAL_HOUSING
          transportation_plan_type: OWN_VEHICLE
          health_coverage_target: MEDICAID
          planned_release_date: '2026-08-10'
        as: CaseManager
        as_user_id: cm-1
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_a: $.data.version
