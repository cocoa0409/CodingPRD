              as: EnergyManager
              as_user_id: "energy-1"
          trigger:
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T07:10:00Z", demand_tph: 15.000, priority_rank: 2 }
              as: EnergyManager
              as_user_id: "energy-1"
          assert:
            - "HTTP status is 201"
            - "response.data.status == 'GRANTED'"
            - "response.data.granted_tph == 15.000"
            - "response.data.curtailed_tph == 0.000"
            - "response.data.cogen_credit_usd == 433.43"

