            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/disputes", payload: { plan_year_id: "${plan}", account_id: "${acc}", claimant_territory_id: "${ty}", reason: "mine" }, as: SalesRep, as_user_id: "${rep}", captures: { dsp: $.data.id } }
