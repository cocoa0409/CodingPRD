            Employer.total_disbursed_cents was 120000, tier 1). So (IN_PROGRESS, SETTLED) and
            (PASSED, RESERVED) are both reachable, which is impossible under a single merged
            status field.

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: failed_outcome_drives_obligation_then_clawback_then_reversal_then_aggregates
        grounds: >-
          §1.2 Enrollment.academic_status FAILED transition declares an explicit four-hop chain in
          which each hop exists only because the previous one happened: hop 1 sets
          academic_status = FAILED, which (hop 2) is what creates the RepaymentObligation and moves
          funding_status SETTLED -> CLAWED_BACK, which (hop 3) is what appends the REVERSAL
          TaxLedgerEntry, which (hop 4) is what forces the Employee cap ledger, the Employee tax
          aggregates, open_repayment_balance_cents and the Employer rollups to be recomputed.
          Cutting any link leaves an observably different end state.
        distinguishing_aspect: >-
          Depth 4, triggered by POST /enrollments/{id}/academic-outcomes on a direct-bill
          enrollment that was paid up front, so the obligation principal is the FULL disbursed
          amount and the REVERSAL cancels a fully excluded benefit. The paired instance has the
          same depth but a completely different triggering transition
          (PATCH /employees/{id} termination) and a PRORATED principal.
        test_recipe:
          setup: >-
            The Beacon fixture: a DIRECT_BILL employer with cap 1000000, one eligible employee, and
            two paid enrollments - E1 for 10 credits (525000 cents, exactly consuming the §127
            exclusion limit) and E2 for 1 credit (52500 cents, fully imputed). Both invoices are
            PAID, so E1 sits at (IN_PROGRESS, SETTLED) with employer_disbursed_cents 525000.
          setup_api_calls:
            - *b_clock
            - *b_employer
            - *b_policy
            - *b_activate_policy
            - *b_employee
            - *b_school
            - *b_program
            - *b_agreement
            - *b_activate_agreement
            - *b_listing
            - *b_read_emp1
            - *b_enroll1
            - *b_confirm1
            - *b_invoices1
            - *b_approve1
            - *b_pay1
            - *b_read_emp2
            - *b_enroll2
            - *b_confirm2
            - *b_invoices2
            - *b_approve2
            - *b_pay2
          trigger: >-
            POST /enrollments/${enrollment_1_id}/academic-outcomes with completion_status FAILED,
            grade_points 1.50 and credits_earned 0
          assert: >-
            Hop 1: the created AcademicOutcome has completion_status FAILED and
            GET /enrollments/${enrollment_1_id} shows academic_status FAILED with credits_earned 0.
            Hop 2: GET /enrollments/${enrollment_1_id}/repayment-obligations returns total_count 1
            with trigger_reason ACADEMIC_FAILURE, principal_cents 525000
            (= employer_disbursed_cents, full recovery), paid_cents 0, waived_cents 0,
            balance_cents 525000, status ASSESSED, and the same enrollment now has funding_status
            CLAWED_BACK with employer_disbursed_cents still 525000 (retained for audit).
            Hop 3: GET /tax-ledger-entries?enrollment_id=${enrollment_1_id}&entry_type=REVERSAL
            returns total_count 1 with benefit_cents -525000, excluded_cents -525000 and
            imputed_income_cents 0 (the reversal mirrors what was actually excluded, not the limit).
            Hop 4: GET /employees/${employee_id} shows cap_reserved_cents 0,
            cap_disbursed_cents 52500, cap_clawback_hold_cents 525000,
            cap_available_cents 422500 (1000000 - 0 - 52500 - 525000),
            taxable_excluded_cents_ytd 0, imputed_income_cents_ytd 52500 and
            open_repayment_balance_cents 525000; GET /employers/${employer_id} shows
            total_disbursed_cents 52500 and total_imputed_income_cents 52500. E2 is untouched:
            (IN_PROGRESS, SETTLED) with employer_disbursed_cents 52500.

      - name: employee_termination_drives_prorated_obligation_then_clawback_then_reversal_then_aggregates
        grounds: >-
          §1.2/§1.4 make PATCH /employees/{id} with employment_status == TERMINATED the head of a
          different four-hop chain: hop 1 flips employment_status (and therefore
          eligibility_status), which (hop 2) is what makes repayment_assessment run with
          trigger_reason EARLY_DEPARTURE and prorate the principal by unserved commitment months,
          which (hop 3) is what moves funding_status SETTLED -> CLAWED_BACK and appends a REVERSAL
          mirroring the PRORATED principal, which (hop 4) is what leaves a non-zero residual in
          Employee.taxable_excluded_cents_ytd and zeroes Employer.total_disbursed_cents. The
          reversal is partial, so a broken hop cannot be masked by a symmetric cancellation.
        distinguishing_aspect: >-
          Same depth 4 but the triggering transition is an Employee attribute change
          (PATCH /employees/{id}), not an academic outcome, and the propagated amount is a
          PRORATED fraction (8/12 of the disbursed benefit) rather than the full amount - so the
          tax ledger keeps a residual instead of netting to zero as in the paired instance.
        test_recipe:
          setup: >-
            Lakeshore Health Partners with an ACTIVE REIMBURSEMENT policy (pct 0.55, cap 800000,
            service_commitment_months 12) and a clinical employee whose spring 2026 nursing
            enrollment PASSED with grade 3.60 and was reimbursed on 2026-05-05; the clock is then
            advanced to 2026-09-01, four whole months after the 2026-04-30 term end.
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
