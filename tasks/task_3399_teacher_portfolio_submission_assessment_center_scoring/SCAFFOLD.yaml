# =============================================================================
# Task 3399 — Teacher Portfolio Submission & Assessment Center Scoring
# National-board-style certification: eligibility, portfolio + assessment-center
# components, calibrated double-blind scoring, weighted aggregation, retakes,
# renewal, and state/district stipend administration.
# =============================================================================

scenario: |
  Teacher Portfolio Submission & Assessment Center Scoring (National Board for
  Professional Teaching Standards): candidate eligibility with licensure and
  teaching experience requirements before beginning the process, component
  structure across content knowledge assessment and portfolio entries with
  video, student work and written commentary, submission windows with technical
  requirements for video and document formats and student release
  documentation, assessor recruitment and training with scoring calibration,
  benchmark performances and inter-rater reliability monitoring, scoring
  aggregation across components with a weighted total and certification
  threshold, retake policy allowing individual components to be retried within
  a window, certification renewal requiring evidence of continued practice,
  state and district incentive programs tied to certification with stipend
  administration.

domain_name: teacher-portfolio-certification
api_prefix: "/"

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - selector_policy            # auto-assignment of eligible assessors
    - cascading_side_effects     # score finalize -> submission -> certification -> stipend
    - rate_threshold_triggers    # IRR floor, certification threshold, calibration counters
    - scheduled_actions          # clock-driven window expiry, NO_SHOW, CERTIFIED->EXPIRED

  entity_topology: graph         # flat collections + cross-aggregate FKs + a self-FK (retakes)
  state_machine_shape: cyclic    # eligibility resubmit loop, submission revision loop, assessor training loop, certification reopen loop
  relationship_patterns:
    - one_to_many                # Candidate -> ComponentSubmission, Certification -> RenewalApplication
    - cross_aggregate            # ScoringAssignment -> Assessor / ComponentSubmission / CalibrationBenchmark
    - polymorphic                # ScoringAssignment target: submission_id XOR benchmark_id
    - self_referential           # ComponentSubmission.prior_submission_id (retake chain)
  role_model: segregation_of_duties  # read-1 assessor != read-2 assessor; no same-district scoring; incentive admin cannot certify
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CertificationCycle
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique cycle code, e.g. NB-2027" }
      - { name: components, type: array, source: input, description: "Component definitions: array of { code: string, kind: ASSESSMENT|PORTFOLIO, weight: number }. Exactly one ASSESSMENT component; weights sum to exactly 1.000 (ERR_WEIGHT_SUM_INVALID)." }
      - { name: submission_window_open, type: datetime, source: input, description: "Inclusive start of the submission window (half-open interval start)" }
      - { name: submission_window_close, type: datetime, source: input, description: "Exclusive end of the submission window (half-open interval end)" }
      - { name: retake_window_close, type: datetime, source: input, description: "Exclusive end of the retake window; must be >= submission_window_close" }
      - { name: certification_threshold, type: number, source: input, description: "Weighted total at or above which certification is granted (boundary: >= certifies)" }
      - { name: max_attempts_per_component, type: integer, source: input, default: 2, description: "Original attempt plus retakes: attempt_number may not exceed this (ERR_RETAKE_LIMIT_REACHED)" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SCORING | CLOSED" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name" }
      - { name: email, type: string, source: input, description: "Unique email address" }
      - { name: license_number, type: string, source: input, description: "Teaching license number" }
      - { name: license_state, type: string, source: input, description: "Two-letter state that issued the license" }
      - { name: district_code, type: string, source: input, description: "Employing district code; drives stipend district matching and assessor conflict-of-interest" }
      - { name: years_experience, type: integer, source: input, description: "Completed years of classroom teaching; eligibility requires >= 3 (MIN_TEACHING_YEARS)" }
      - { name: fte_fraction, type: number, source: input, default: 1.0, description: "Teaching load fraction in [0.5, 1.0]; prorates stipends" }
      - { name: license_document_ref, type: string, source: input, description: "License evidence document reference; required to enter ELIGIBILITY_REVIEW", constraints: "set via submit-eligibility" }
      - { name: employer_verification_ref, type: string, source: input, description: "Employer experience-verification letter reference; required to enter ELIGIBILITY_REVIEW", constraints: "set via submit-eligibility" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ELIGIBILITY_REVIEW | ELIGIBLE | ELIGIBILITY_DENIED" }
      - { name: eligibility_note, type: string, source: system, description: "Reviewer note from the latest eligibility decision", default: null }

  - name: AssessmentCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Center name" }
      - { name: region_code, type: string, source: input, description: "Region the center serves" }
      - { name: slot_capacity, type: integer, source: input, description: "Seats per slot start instant (>= 1); capacity is counted per exact slot_start_at, not per overlapping interval" }

  - name: AssessmentBooking
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; taken from X-User-ID of the booking request" }
      - { name: center_id, type: string, source: input, description: "FK -> AssessmentCenter.id" }
      - { name: cycle_id, type: string, source: input, description: "FK -> CertificationCycle.id; the candidate must hold an IN_PROGRESS ASSESSMENT submission in this cycle" }
      - { name: slot_start_at, type: datetime, source: input, description: "Slot start instant; must be strictly after the logical clock and no later than the cycle submission_window_close" }
      - { name: slot_end_at, type: datetime, source: computed, description: "= slot_start_at + 120 minutes (SESSION_DURATION_MINUTES)" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: earned_score, type: number, source: system, description: "Content-knowledge score in [0.00, 4.00] on the 0.25 grid, recorded at completion", default: null }

  - name: ComponentSubmission
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; taken from X-User-ID of the create request" }
      - { name: cycle_id, type: string, source: system, description: "FK -> CertificationCycle.id; taken from the create path" }
      - { name: component_code, type: string, source: input, description: "Component code; must exist in the parent cycle's components array (ERR_COMPONENT_NOT_IN_CYCLE)" }
      - { name: kind, type: enum, source: computed, description: "ASSESSMENT | PORTFOLIO, copied from the cycle component definition at creation" }
      - { name: attempt_number, type: integer, source: computed, description: "1 + count of prior submissions for the same (candidate_id, cycle_id, component_code)" }
      - { name: prior_submission_id, type: string, source: system, description: "FK -> ComponentSubmission.id; self-reference to the attempt this retake supersedes; null on attempt 1", default: null }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | SUBMITTED | RETURNED | SCORING | ADJUDICATION_REQUIRED | SCORED | EXPIRED" }
      - { name: final_score, type: number, source: system, description: "Decided score for this attempt (2dp). PORTFOLIO: average of the two finalized reads (round_half_up 2dp), or the adjudicator's score; ASSESSMENT: the booking's earned_score", default: null }
      - { name: counted_score, type: number, source: computed, description: "Best valid attempt for certification aggregation: max of final_score over all SCORED attempts of the same (candidate_id, cycle_id, component_code); null until any attempt is SCORED", default: null }
      - { name: superseded, type: boolean, source: computed, description: "True when a later attempt exists for the same (candidate_id, cycle_id, component_code)", default: false }

  - name: Artifact
    parent: null
    common_fields: false   # immutable record: id + created_at only; no update endpoint
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> ComponentSubmission.id; taken from the upload path" }
      - { name: artifact_type, type: enum, source: input, description: "VIDEO | STUDENT_WORK | WRITTEN_COMMENTARY | RELEASE_FORM" }
      - { name: file_format, type: string, source: input, description: "Container/format. VIDEO: mp4|mov. STUDENT_WORK/WRITTEN_COMMENTARY/RELEASE_FORM: pdf|docx. Else ERR_ARTIFACT_FORMAT_INVALID" }
      - { name: file_size_mb, type: number, source: input, description: "Size in MB. VIDEO <= 500 (VIDEO_MAX_MB); all other types <= 50 (DOC_MAX_MB). Else ERR_ARTIFACT_SIZE_EXCEEDED" }
      - { name: duration_minutes, type: number, source: input, description: "Required iff artifact_type == VIDEO (else ERR_INVALID_REQUEST); must be <= 15 (VIDEO_MAX_MINUTES, else ERR_VIDEO_DURATION_EXCEEDED)", default: null }
      - { name: subject_student_count, type: integer, source: input, description: "Number of students appearing in a VIDEO or STUDENT_WORK artifact; >= 1 when supplied", default: null }

  - name: Assessor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Assessor name" }
      - { name: email, type: string, source: input, description: "Unique assessor email" }
      - { name: home_district_code, type: string, source: input, description: "Assessor's own district; conflict-of-interest bar against scoring candidates with the same district_code" }
      - { name: status, type: enum, source: system, description: "RECRUITED | IN_TRAINING | CALIBRATING | CALIBRATED | ACTIVE | SUSPENDED" }
      - { name: calibration_passes, type: integer, source: system, description: "Count of calibration reads within benchmark tolerance; reaching 2 (REQUIRED_CALIBRATION_PASSES) auto-transitions CALIBRATING -> CALIBRATED", default: 0 }
      - { name: calibration_failures, type: integer, source: system, description: "Count of calibration reads outside tolerance; reaching 3 (MAX_CALIBRATION_FAILURES) auto-transitions to SUSPENDED", default: 0 }
      - { name: calibrated_at, type: datetime, source: system, description: "Timestamp of the CALIBRATING -> CALIBRATED transition; selector tie-break", default: null }
      - { name: open_assignment_count, type: integer, source: computed, description: "Count of this assessor's ScoringAssignments in ASSIGNED or SCORE_SUBMITTED status; selector ranking key", default: 0 }
      - { name: scored_read_count, type: integer, source: system, description: "Count of finalized live (non-calibration) reads in the trailing reliability window", default: 0 }
      - { name: exact_agreement_rate, type: number, source: computed, description: "Over the trailing 10 (IRR_WINDOW) finalized live reads: fraction with |own_score - submission final_score| == 0; null until 10 reads exist", default: null }
      - { name: adjacent_agreement_rate, type: number, source: computed, description: "Same window, fraction with |own_score - final_score| <= 0.25 (ADJACENT_BAND); null until 10 reads exist", default: null }

  - name: CalibrationBenchmark
    parent: null
    common_fields: true
    fields:
      - { name: component_code, type: string, source: input, description: "Component code this benchmark performance exemplifies" }
      - { name: content_domain, type: string, source: input, description: "Free-text domain descriptor" }
      - { name: known_score, type: number, source: input, description: "Panel-blessed score on the 0.25 grid in [0.00, 4.00] (else ERR_SCORE_INVALID)" }
      - { name: tolerance, type: number, source: input, default: 0.25, description: "Calibration pass band: a calibration read passes when |read - known_score| <= tolerance" }

  - name: ScoringAssignment
    parent: null
    common_fields: true
    fields:
      - { name: assessor_id, type: string, source: system, description: "FK -> Assessor.id; explicit when the request supplies assessor_id, otherwise chosen by the assessor selector policy" }
      - { name: submission_id, type: string, source: input, description: "FK -> ComponentSubmission.id; live-scoring target. Exactly one of submission_id / benchmark_id must be non-null (ERR_ASSIGNMENT_TARGET_AMBIGUOUS)", default: null }
      - { name: benchmark_id, type: string, source: input, description: "FK -> CalibrationBenchmark.id; calibration target. Exactly one of submission_id / benchmark_id must be non-null (ERR_ASSIGNMENT_TARGET_AMBIGUOUS)", default: null }
      - { name: read_number, type: integer, source: computed, description: "Live target: 1 for the first read, 2 for the second blind read, 3 for the adjudication read (only when the submission is ADJUDICATION_REQUIRED). Calibration target: sequential per assessor." }
      - { name: status, type: enum, source: system, description: "ASSIGNED | SCORE_SUBMITTED | FINALIZED | REASSIGNED" }
      - { name: score, type: number, source: system, description: "Submitted score on the 0.25 grid in [0.00, 4.00] (else ERR_SCORE_INVALID)", default: null }
      - { name: score_submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of score submission" }
      - { name: is_within_tolerance, type: boolean, source: computed, description: "Calibration reads only: |score - benchmark.known_score| <= benchmark.tolerance; null for live reads", default: null }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; one certification record per (candidate_id, cycle_id), auto-created with the candidate's first submission in the cycle" }
      - { name: cycle_id, type: string, source: system, description: "FK -> CertificationCycle.id" }
      - { name: status, type: enum, source: system, description: "PENDING | CERTIFIED | DENIED | RENEWED | EXPIRED" }
      - { name: weighted_total_provisional, type: number, source: computed, description: "Provisional variant of weighted_certification_score: uses each component's LATEST attempt final_score (0 when unscored); recomputed on every score event", default: 0.0 }
      - { name: weighted_total_final, type: number, source: computed, description: "Final variant of weighted_certification_score: uses each component's counted_score (max across SCORED attempts); set when the certification is decided", default: null }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock timestamp of the CERTIFIED transition", default: null }
      - { name: valid_until, type: datetime, source: computed, description: "= certified_at + 1825 days (VALIDITY_DAYS); extended by another 1825 days on each renewal approval", default: null }

  - name: RenewalApplication
    parent: null
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: system, description: "FK -> Certification.id; taken from the create path" }
      - { name: evidence_items, type: array, source: input, description: "Continued-practice evidence: array of { evidence_type: string, description: string, hours: number >= 0 }. Must contain >= 1 item (ERR_INVALID_REQUEST)." }
      - { name: total_hours, type: number, source: computed, description: "Sum of evidence_items[].hours; approval requires total_hours >= 45 (MIN_RENEWAL_HOURS)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | RETURNED" }
      - { name: review_note, type: string, source: system, description: "Reviewer note from the latest renewal decision", default: null }

  - name: IncentiveProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: sponsor_state, type: string, source: input, description: "Two-letter sponsoring state" }
      - { name: sponsor_district_code, type: string, source: input, description: "When non-null the program is district-specific: only candidates whose district_code matches are eligible; when null, statewide: candidate.license_state must equal sponsor_state", default: null }
      - { name: budget_total_cents, type: integer, source: input, description: "Initial stipend budget in cents (>= 0)" }
      - { name: budget_remaining_cents, type: integer, source: computed, description: "budget_total_cents minus the sum of amount_cents over stipends in APPROVED or PAID status; PROPOSED stipends do not encumber" }
      - { name: base_stipend_cents, type: integer, source: input, description: "Base stipend before proration and multipliers" }
      - { name: early_bird_multiplier, type: number, source: input, default: 1.10, description: "Applied when certification.certified_at <= early_bird_deadline" }
      - { name: early_bird_deadline, type: datetime, source: input, description: "Certification timestamp deadline for the early multiplier; null disables the multiplier", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | EXHAUSTED. EXHAUSTED is automatic when budget_remaining_cents reaches 0; returns to OPEN when a revocation restores budget." }

  - name: StipendPayment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> IncentiveProgram.id" }
      - { name: certification_id, type: string, source: system, description: "FK -> Certification.id; at most one stipend row per (program_id, certification_id) pair — auto-proposal skips pairs already having a row" }
      - { name: amount_cents, type: integer, source: computed, description: "stipend_amount at proposal time: min(round_half_up(base_stipend_cents * fte_fraction * multiplier, 0), budget_remaining_cents at proposal)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | PAID | REVOKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CertificationCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /cycles/{id}/transition {to: OPEN}"
        actor: BoardAdministrator
        preconditions:
          - "Cycle must be DRAFT (ERR_INVALID_CYCLE_TRANSITION)"
        side_effects: []
      - from: OPEN
        to: SCORING
        trigger: "POST /cycles/{id}/transition {to: SCORING}"
        actor: BoardAdministrator
        preconditions:
          - "Cycle must be OPEN (ERR_INVALID_CYCLE_TRANSITION)"
          - "Logical clock must be >= submission_window_close (ERR_CYCLE_WINDOW_STILL_OPEN)"
        side_effects:
          - "Every ComponentSubmission of this cycle still in IN_PROGRESS, SUBMITTED, or RETURNED transitions to EXPIRED"
      - from: SCORING
        to: CLOSED
        trigger: "POST /cycles/{id}/transition {to: CLOSED}"
        actor: BoardAdministrator
        preconditions:
          - "Cycle must be SCORING (ERR_INVALID_CYCLE_TRANSITION)"
        side_effects:
          - "Every ComponentSubmission of this cycle in SCORING or ADJUDICATION_REQUIRED transitions to EXPIRED"

  - entity: Candidate
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: ELIGIBILITY_REVIEW
        trigger: "POST /candidates/{id}/submit-eligibility"
        actor: Candidate
        preconditions:
          - "Candidate must be REGISTERED or ELIGIBILITY_DENIED (ERR_CANDIDATE_NOT_SUBMITTABLE)"
          - "license_document_ref and employer_verification_ref both supplied (ERR_INVALID_REQUEST)"
        side_effects:
          - "Stores license_document_ref / employer_verification_ref on the candidate"
      - from: ELIGIBILITY_DENIED
        to: ELIGIBILITY_REVIEW
        trigger: "POST /candidates/{id}/submit-eligibility"
        actor: Candidate
        preconditions:
          - "Candidate must be REGISTERED or ELIGIBILITY_DENIED (ERR_CANDIDATE_NOT_SUBMITTABLE)"
          - "license_document_ref and employer_verification_ref both supplied (ERR_INVALID_REQUEST)"
        side_effects:
          - "Stores license_document_ref / employer_verification_ref on the candidate (resubmission loop)"
      - from: ELIGIBILITY_REVIEW
        to: ELIGIBLE
        trigger: "POST /candidates/{id}/verify-eligibility {decision: APPROVE}"
        actor: BoardAdministrator
        preconditions:
          - "Candidate must be ELIGIBILITY_REVIEW (ERR_CANDIDATE_NOT_IN_REVIEW)"
          - "years_experience >= 3, MIN_TEACHING_YEARS (ERR_EXPERIENCE_REQUIREMENT_NOT_MET)"
        side_effects:
          - "eligibility_note := request note"
      - from: ELIGIBILITY_REVIEW
        to: ELIGIBILITY_DENIED
        trigger: "POST /candidates/{id}/verify-eligibility {decision: REJECT}"
        actor: BoardAdministrator
        preconditions:
          - "Candidate must be ELIGIBILITY_REVIEW (ERR_CANDIDATE_NOT_IN_REVIEW)"
        side_effects:
          - "eligibility_note := request note"

  - entity: AssessmentBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /bookings/{id}/transition {to: CANCELLED}"
        actor: Candidate
        preconditions:
          - "Booking must be BOOKED (ERR_BOOKING_NOT_TRANSITIONABLE)"
          - "X-User-ID must equal booking.candidate_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Frees one seat: (center_id, slot_start_at) BOOKED count decrements; slot remaining capacity increments (compensating invariant)"
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /bookings/{id}/transition {to: COMPLETED, earned_score: X}"
        actor: ScoringAdministrator
        preconditions:
          - "Booking must be BOOKED (ERR_BOOKING_NOT_TRANSITIONABLE)"
          - "Logical clock must be >= slot_start_at (ERR_BOOKING_NOT_COMPLETABLE)"
          - "earned_score supplied and on the 0.25 grid within [0.00, 4.00] (ERR_SCORE_INVALID)"
        side_effects:
          - "earned_score recorded on the booking"
          - "Cascade hop 1: the matching ASSESSMENT ComponentSubmission (same candidate_id + cycle_id, latest attempt in IN_PROGRESS or RETURNED) transitions to SCORED with final_score := earned_score"
          - "Cascade hop 2: certification_aggregation recomputes for that candidate+cycle; if every cycle component now has a counted_score, the Certification is decided (CERTIFIED when weighted_total_final >= cycle.certification_threshold, else DENIED)"
          - "Cascade hop 3: when the Certification becomes CERTIFIED, stipend auto-proposal runs for every eligible OPEN IncentiveProgram"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (on POST /_clock/set_current_utc when the new clock passes slot_end_at while the booking is still BOOKED)"
        actor: system
        preconditions:
          - "Booking is BOOKED and slot_end_at < new logical clock"
        side_effects: []

  - entity: ComponentSubmission
    initial_state: IN_PROGRESS
    terminal_states: [EXPIRED]
    transitions:
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /submissions/{id}/submit"
        actor: Candidate
        preconditions:
          - "Submission must be IN_PROGRESS or RETURNED (ERR_SUBMISSION_NOT_SUBMITTABLE) — state checked before any temporal rule"
          - "Cycle must be OPEN (ERR_CYCLE_NOT_OPEN)"
          - "Logical clock within [cycle.submission_window_open, cycle.submission_window_close) (ERR_SUBMISSION_WINDOW_CLOSED)"
          - "PORTFOLIO kind: at least one WRITTEN_COMMENTARY artifact AND at least one of VIDEO or STUDENT_WORK (ERR_REQUIRED_ARTIFACT_MISSING)"
          - "PORTFOLIO kind: if any VIDEO or STUDENT_WORK artifact has subject_student_count >= 1, at least one RELEASE_FORM artifact on the same submission (ERR_RELEASE_FORM_MISSING)"
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /submissions/{id}/submit"
        actor: Candidate
        preconditions:
          - "Same precondition set as IN_PROGRESS -> SUBMITTED (revision loop)"
        side_effects: []
      - from: SUBMITTED
        to: SCORING
        trigger: "POST /submissions/{id}/tech-review {decision: ACCEPT}"
        actor: ScoringAdministrator
        preconditions:
          - "Submission must be SUBMITTED (ERR_SUBMISSION_NOT_REVIEWABLE)"
        side_effects:
          - "PORTFOLIO kind: none further (reads are created via POST /assignments)"
          - "ASSESSMENT kind: none (score arrives via booking completion)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /submissions/{id}/tech-review {decision: RETURN}"
        actor: ScoringAdministrator
        preconditions:
          - "Submission must be SUBMITTED (ERR_SUBMISSION_NOT_REVIEWABLE)"
        side_effects: []
      - from: SCORING
        to: ADJUDICATION_REQUIRED
        trigger: "system (on POST /assignments/{id}/submit-score completing the second read when |read1 - read2| > 0.50, DIVERGENCE_TOLERANCE)"
        actor: system
        preconditions:
          - "Both read 1 and read 2 are SCORE_SUBMITTED and |score1 - score2| > 0.50"
        side_effects:
          - "Reads 1 and 2 remain SCORE_SUBMITTED; a read_number 3 assignment becomes creatable"
      - from: ADJUDICATION_REQUIRED
        to: SCORED
        trigger: "system (on POST /assignments/{id}/submit-score for read_number 3)"
        actor: system
        preconditions:
          - "The adjudication assignment (read_number 3) has just submitted its score"
        side_effects:
          - "final_score := adjudicator's score"
          - "Reads 1, 2 and 3 all transition to FINALIZED"
          - "counted_score recomputed for this (candidate, cycle, component): max final_score over SCORED attempts; superseded flags refreshed"
          - "Cascade: certification_aggregation recomputes; decide CERTIFIED/DENIED when every component has a counted_score; on CERTIFIED, stipend auto-proposal fires"
      - from: SCORING
        to: SCORED
        trigger: "system (on POST /assignments/{id}/submit-score completing the second read when |read1 - read2| <= 0.50)"
        actor: system
        preconditions:
          - "Both read 1 and read 2 are SCORE_SUBMITTED and |score1 - score2| <= 0.50"
        side_effects:
          - "final_score := round_half_up((score1 + score2) / 2, 2)"
          - "Reads 1 and 2 transition to FINALIZED"
          - "counted_score recomputed; superseded flags refreshed"
          - "Cascade: certification_aggregation recomputes; decide CERTIFIED/DENIED when every component has a counted_score; on CERTIFIED, stipend auto-proposal fires"
      - from: IN_PROGRESS
        to: EXPIRED
        trigger: "system (on the cycle's OPEN -> SCORING transition)"
        actor: system
        preconditions:
          - "Submission is IN_PROGRESS, SUBMITTED, or RETURNED and the parent cycle is leaving OPEN"
        side_effects: []
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (on the cycle's OPEN -> SCORING transition)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: EXPIRED
        trigger: "system (on the cycle's OPEN -> SCORING transition)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCORING
        to: EXPIRED
        trigger: "system (on the cycle's SCORING -> CLOSED transition)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ADJUDICATION_REQUIRED
        to: EXPIRED
        trigger: "system (on the cycle's SCORING -> CLOSED transition)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Assessor
    initial_state: RECRUITED
    terminal_states: []
    transitions:
      - from: RECRUITED
        to: IN_TRAINING
        trigger: "POST /assessors/{id}/transition {to: IN_TRAINING}"
        actor: ScoringAdministrator
        preconditions:
          - "Assessor must be RECRUITED or SUSPENDED (ERR_INVALID_ASSESSOR_TRANSITION)"
        side_effects: []
      - from: SUSPENDED
        to: IN_TRAINING
        trigger: "POST /assessors/{id}/transition {to: IN_TRAINING}"
        actor: ScoringAdministrator
        preconditions:
          - "Assessor must be RECRUITED or SUSPENDED (ERR_INVALID_ASSESSOR_TRANSITION)"
        side_effects:
          - "Retraining loop: calibration_passes and calibration_failures reset to 0"
      - from: IN_TRAINING
        to: CALIBRATING
        trigger: "POST /assessors/{id}/transition {to: CALIBRATING}"
        actor: ScoringAdministrator
        preconditions:
          - "Assessor must be IN_TRAINING (ERR_INVALID_ASSESSOR_TRANSITION)"
        side_effects: []
      - from: CALIBRATING
        to: CALIBRATED
        trigger: "system (on POST /assignments/{id}/submit-score for a calibration read when calibration_passes reaches 2, REQUIRED_CALIBRATION_PASSES)"
        actor: system
        preconditions:
          - "Assessor is CALIBRATING and the submitted calibration read is within tolerance, bringing calibration_passes to 2"
        side_effects:
          - "calibrated_at := logical clock"
      - from: CALIBRATING
        to: SUSPENDED
        trigger: "system (on POST /assignments/{id}/submit-score for a calibration read when calibration_failures reaches 3, MAX_CALIBRATION_FAILURES)"
        actor: system
        preconditions:
          - "Assessor is CALIBRATING and the submitted calibration read is outside tolerance, bringing calibration_failures to 3"
        side_effects:
          - "Cascade hop 1: every ScoringAssignment of this assessor in ASSIGNED transitions to REASSIGNED"
          - "Cascade hop 2: for each affected ComponentSubmission, open_assignment_count bookkeeping refreshes and the submission's missing reads become re-assignable"
      - from: CALIBRATED
        to: ACTIVE
        trigger: "POST /assessors/{id}/transition {to: ACTIVE}"
        actor: ScoringAdministrator
        preconditions:
          - "Assessor must be CALIBRATED (ERR_INVALID_ASSESSOR_TRANSITION)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /assessors/{id}/transition {to: SUSPENDED} or system (on a finalized live read that brings exact_agreement_rate below 0.70 with scored_read_count >= 10, IRR_EXACT_FLOOR)"
        actor: ScoringAdministrator
        preconditions:
          - "Assessor must be ACTIVE (ERR_INVALID_ASSESSOR_TRANSITION) for the admin transition; system path fires automatically on the threshold breach"
        side_effects:
          - "Cascade hop 1: every ScoringAssignment of this assessor in ASSIGNED transitions to REASSIGNED"
          - "Cascade hop 2: for each affected ComponentSubmission, open_assignment_count bookkeeping refreshes and the submission's missing reads become re-assignable"

  - entity: ScoringAssignment
    initial_state: ASSIGNED
    terminal_states: [FINALIZED, REASSIGNED]
    transitions:
      - from: ASSIGNED
        to: SCORE_SUBMITTED
        trigger: "POST /assignments/{id}/submit-score"
        actor: Assessor
        preconditions:
          - "Assignment must be ASSIGNED (ERR_ASSIGNMENT_NOT_SUBMITTABLE)"
          - "X-User-ID must equal assignment.assessor_id (ERR_NOT_RESOURCE_OWNER)"
          - "score on the 0.25 grid within [0.00, 4.00] (ERR_SCORE_INVALID)"
        side_effects:
          - "score and score_submitted_at recorded"
          - "Calibration target: is_within_tolerance computed; calibration_passes or calibration_failures on the assessor increments; pass/fail counters may auto-transition the assessor (see Assessor machine); this assignment transitions straight to FINALIZED"
          - "Live target read 1: no further effect until read 2 is submitted"
          - "Live target read 2 when read 1 already submitted: |d| <= 0.50 finalizes both reads and SCOREs the submission; |d| > 0.50 moves the submission to ADJUDICATION_REQUIRED"
          - "Live target read 3 (adjudication): finalizes all three reads and SCOREs the submission with the adjudicator's score"
      - from: SCORE_SUBMITTED
        to: FINALIZED
        trigger: "system (set membership of a completed read set, or immediately for calibration reads)"
        actor: system
        preconditions: []
        side_effects:
          - "IRR window update for live reads: the assessor's trailing-10 exact/adjacent agreement rates recompute against the submission's final_score; exact_agreement_rate < 0.70 with scored_read_count >= 10 auto-suspends the assessor"
      - from: ASSIGNED
        to: REASSIGNED
        trigger: "system (when the owning assessor transitions to SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Certification
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "system (certification_aggregation: every component of the cycle has a counted_score and weighted_total_final >= cycle.certification_threshold)"
        actor: system
        preconditions:
          - "All cycle components have at least one SCORED attempt"
          - "weighted_total_final >= certification_threshold (boundary: equality certifies)"
        side_effects:
          - "certified_at := logical clock; valid_until := certified_at + 1825 days"
          - "Cascade: for every IncentiveProgram in OPEN status whose eligibility matches the candidate (district-specific: candidate.district_code == sponsor_district_code; statewide: candidate.license_state == sponsor_state) with budget_remaining_cents > 0, auto-create a StipendPayment in PROPOSED (skips pairs that already have a stipend row)"
      - from: PENDING
        to: DENIED
        trigger: "system (certification_aggregation: every component scored and weighted_total_final < certification_threshold)"
        actor: system
        preconditions:
          - "All cycle components have at least one SCORED attempt"
          - "weighted_total_final < certification_threshold"
        side_effects: []
      - from: DENIED
        to: PENDING
        trigger: "system (on POST /submissions/{id}/retake creating a new attempt for this candidate+cycle)"
        actor: system
        preconditions: []
        side_effects:
          - "weighted_total_final := null (decision reopened)"
      - from: CERTIFIED
        to: RENEWED
        trigger: "system (on POST /renewals/{id}/review {decision: APPROVE})"
        actor: system
        preconditions: []
        side_effects:
          - "valid_until := valid_until + 1825 days"
      - from: RENEWED
        to: RENEWED
        trigger: "system (on a subsequent POST /renewals/{id}/review {decision: APPROVE}; renewal of an already-renewed certification)"
        actor: system
        preconditions: []
        side_effects:
          - "valid_until := valid_until + 1825 days"
        note: "Self-loop: repeated renewals extend validity without leaving RENEWED."
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when the new clock passes valid_until)"
        actor: system
        preconditions:
          - "Status CERTIFIED or RENEWED and valid_until < new logical clock"
        side_effects: []
      - from: RENEWED
        to: EXPIRED
        trigger: "system (clock sweep)"
        actor: system
        preconditions:
          - "Status CERTIFIED or RENEWED and valid_until < new logical clock"
        side_effects: []

  - entity: RenewalApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /renewals/{id}/review {decision: APPROVE}"
        actor: BoardAdministrator
        preconditions:
          - "Renewal must be SUBMITTED or RETURNED (ERR_RENEWAL_NOT_REVIEWABLE)"
          - "total_hours >= 45, MIN_RENEWAL_HOURS (ERR_RENEWAL_HOURS_INSUFFICIENT)"
        side_effects:
          - "Certification transitions to RENEWED and valid_until extends by 1825 days"
      - from: RETURNED
        to: APPROVED
        trigger: "POST /renewals/{id}/review {decision: APPROVE}"
        actor: BoardAdministrator
        preconditions:
          - "Renewal must be SUBMITTED or RETURNED (ERR_RENEWAL_NOT_REVIEWABLE)"
          - "total_hours >= 45 (ERR_RENEWAL_HOURS_INSUFFICIENT)"
        side_effects:
          - "Certification transitions to RENEWED and valid_until extends by 1825 days"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /renewals/{id}/review {decision: RETURN}"
        actor: BoardAdministrator
        preconditions:
          - "Renewal must be SUBMITTED or RETURNED (ERR_RENEWAL_NOT_REVIEWABLE)"
        side_effects:
          - "review_note := request note"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /certifications/{id}/renewals (resubmission supersedes: the RETURNED application returns to SUBMITTED with the new evidence_items)"
        actor: Candidate
        preconditions:
          - "Certification must be CERTIFIED or RENEWED (ERR_CERTIFICATION_NOT_RENEWABLE)"
          - "Logical clock within [valid_until - 90 days, valid_until + 30 days] (ERR_RENEWAL_WINDOW_NOT_OPEN)"
        side_effects:
          - "evidence_items and total_hours replaced by the new payload (revision loop)"

  - entity: IncentiveProgram
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (on a stipend approval that debits budget_remaining_cents to exactly 0)"
        actor: system
        preconditions:
          - "budget_remaining_cents == 0 after the debit"
        side_effects: []
      - from: EXHAUSTED
        to: OPEN
        trigger: "system (on a stipend revocation that restores budget_remaining_cents above 0)"
        actor: system
        preconditions:
          - "budget_remaining_cents > 0 after the credit"
        side_effects: []

  - entity: StipendPayment
    initial_state: PROPOSED
    terminal_states: [PAID, REVOKED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /stipends/{id}/transition {to: APPROVED}"
        actor: IncentiveAdministrator
        preconditions:
          - "Stipend must be PROPOSED (ERR_STIPEND_NOT_TRANSITIONABLE)"
          - "program.budget_remaining_cents >= stipend.amount_cents (ERR_PROGRAM_BUDGET_EXHAUSTED) — an EXHAUSTED program has remaining == 0, so this single fiscal gate covers it"
        side_effects:
          - "program.budget_remaining_cents -= amount_cents; if it reaches exactly 0 the program transitions to EXHAUSTED"
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /stipends/{id}/transition {to: REVOKED}"
        actor: IncentiveAdministrator
        preconditions:
          - "Stipend must be PROPOSED or APPROVED (ERR_STIPEND_NOT_TRANSITIONABLE)"
        side_effects:
          - "No budget effect (PROPOSED stipends never encumbered budget)"
      - from: APPROVED
        to: PAID
        trigger: "POST /stipends/{id}/transition {to: PAID}"
        actor: IncentiveAdministrator
        preconditions:
          - "Stipend must be APPROVED (ERR_STIPEND_NOT_TRANSITIONABLE)"
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /stipends/{id}/transition {to: REVOKED}"
        actor: IncentiveAdministrator
        preconditions:
          - "Stipend must be PROPOSED or APPROVED (ERR_STIPEND_NOT_TRANSITIONABLE)"
        side_effects:
          - "program.budget_remaining_cents += amount_cents (compensating invariant: budget_remaining + sum(APPROVED, PAID amounts) == budget_total); if the program was EXHAUSTED it returns to OPEN"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
# Deliberately EMPTY. Every write-write conflict in this domain is decidable by
# a sequential observer of state: a second retake create sees attempt_number at
# the cap (state precondition -> ERR_RETAKE_LIMIT_REACHED); a second stipend
# approval sees budget_remaining_cents already debited (state precondition ->
# ERR_PROGRAM_BUDGET_EXHAUSTED); a second submission for the same component
# sees the open attempt (ERR_ACTIVE_ATTEMPT_EXISTS). Per SKILL.md §1.2.1's
# serial-observability filter, none of these is a true race, so no OCC entry is
# declared and no optimistic-concurrency complexity layer is claimed.
concurrency_rules: []

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: weighted_certification_score
    trigger: "every ComponentSubmission score event (read finalization, adjudication, booking completion) and every retake creation, for the affected (candidate_id, cycle_id) Certification"
    algorithm: weighted_scoring
    formula: |
      For each component c in cycle.components (order of the components array):
        contribution_c = round_half_up(counted_or_latest_score_c * weight_c, 3)
      weighted_total = round_half_up(sum(contribution_c), 2)
      ROUNDING ORDER IS PINNED: round each per-component contribution to 3
      decimal places FIRST (round_half_up), sum the rounded contributions, then
      round the sum to 2 decimal places (round_half_up). Summing raw products
      and rounding once is a different, non-conformant algorithm: with weights
      [0.325, 0.275, 0.225, 0.175] and scores [0.00, 0.25, 0.50, 1.50] the
      pinned order yields 0.45 while sum-then-round yields 0.44.
    input_set: "All components of the cycle; a component's score input depends on the variant (below). Components with no SCORED attempt contribute 0 in the provisional variant; the final variant is only defined once every component has a counted_score."
    constants:
      SCORE_MAX: 4.00
      SCORE_STEP: 0.25
    precision: "contributions 3 decimal places round_half_up; total 2 decimal places round_half_up"
    variants:
      - name: provisional
        when: "displayed on the Certification at all times as weighted_total_provisional"
        difference: "uses each component's LATEST-attempt final_score (0 when the latest attempt is unscored); a worse retake lowers the provisional total"
      - name: final
        when: "computed when every component has at least one SCORED attempt; drives the CERTIFIED/DENIED decision and is stored as weighted_total_final"
        difference: "uses each component's counted_score = max(final_score) over SCORED attempts; a worse retake does NOT lower the final total"

  - name: component_final_score
    trigger: "second live read submitted with |read1 - read2| <= DIVERGENCE_TOLERANCE, or adjudication read submitted"
    algorithm: aggregation
    formula: |
      Double-blind agreement path: final_score = round_half_up((read1 + read2) / 2, 2)
      Adjudication path: final_score = adjudicator's read3 score (no averaging)
      ASSESSMENT kind: final_score = booking.earned_score (single source)
    input_set: "The finalized reads of one ComponentSubmission attempt"
    constants:
      DIVERGENCE_TOLERANCE: 0.50
    precision: "2 decimal places, round_half_up"

  - name: counted_score
    trigger: "any attempt of a (candidate, cycle, component) reaches SCORED"
    algorithm: aggregation
    formula: |
      counted_score = max(final_score) over all attempts of the same
      (candidate_id, cycle_id, component_code) whose status == SCORED.
      Every attempt row of the same component triple carries this same value;
      superseded = true on every attempt except the highest-attempt_number row.
    input_set: "All attempts of the component triple in SCORED status (EXPIRED/RETURNED/IN_PROGRESS attempts excluded)"

  - name: stipend_amount
    trigger: "stipend auto-proposal on the CERTIFIED transition"
    algorithm: tiered_pricing
    formula: |
      multiplier = (certification.certified_at <= program.early_bird_deadline)
                   ? program.early_bird_multiplier : 1.0          # deadline null -> 1.0
      tentative  = round_half_up(program.base_stipend_cents
                                 * candidate.fte_fraction
                                 * multiplier, 0)                 # integer cents
      amount_cents = min(tentative, program.budget_remaining_cents)
      EVALUATION ORDER IS PINNED (circular-looking dependency resolved): the
      tentative amount is computed from base, fte, and multiplier FIRST; only
      then is it capped against the CURRENT budget_remaining_cents; the debit
      to budget_remaining_cents happens later, at APPROVE time, never at
      proposal. Worked: base 300000, fte 0.8, early 1.10 -> tentative 264000;
      budget 200000 -> amount 200000. Same inputs with fte 1.0 -> 330000.
    input_set: "One (IncentiveProgram, Certification) pair at proposal time"
    constants:
      DEFAULT_EARLY_BIRD_MULTIPLIER: 1.10
    precision: "integer cents, round_half_up at the multiplication step"

  - name: program_budget_remaining
    trigger: "stipend APPROVED (debit) and stipend REVOKED from APPROVED (credit)"
    algorithm: waterfall_allocation
    formula: |
      On APPROVE: budget_remaining_cents = budget_remaining_cents - amount_cents
      On REVOKE of an APPROVED stipend: budget_remaining_cents += amount_cents
      INVARIANT (compensating): budget_remaining_cents
        + sum(amount_cents over stipends in {APPROVED, PAID}) == budget_total_cents
      PROPOSED and REVOKED stipends encumber nothing. Program is EXHAUSTED iff
      budget_remaining_cents == 0, OPEN otherwise.
    input_set: "All StipendPayment rows of the program in APPROVED or PAID status"
    precision: "integer cents"

  - name: assessor_reliability_index
    trigger: "every live (non-calibration) ScoringAssignment transitions to FINALIZED"
    algorithm: threshold
    formula: |
      Window: the assessor's trailing 10 (IRR_WINDOW) finalized live reads,
      ordered by score_submitted_at ASC (created_at breaks exact ties).
      exact_rate    = count(|own_score - submission.final_score| == 0)    / 10
      adjacent_rate = count(|own_score - submission.final_score| <= 0.25) / 10
      Rates are null until 10 finalized live reads exist.
      AUTO-SUSPEND: when a finalization makes scored_read_count >= 10 and
      exact_agreement_rate < 0.70 (IRR_EXACT_FLOOR), the assessor transitions
      ACTIVE -> SUSPENDED. Boundary: exactly 0.70 does NOT suspend.
    input_set: "The assessor's live ScoringAssignments in FINALIZED status, excluding calibration reads and REASSIGNED assignments"
    constants:
      IRR_WINDOW: 10
      IRR_EXACT_FLOOR: 0.70
      ADJACENT_BAND: 0.25
    precision: "2 decimal places"
    variants:
      - name: exact
        when: "governs the auto-suspension decision"
        difference: "zero-tolerance match against the submission's final_score"
      - name: adjacent
        when: "reported alongside for program monitoring"
        difference: "counts reads within 0.25 of the final score; identical read set yields a strictly higher rate whenever any read is off by exactly 0.25"

  - name: calibration_outcome
    trigger: "calibration ScoringAssignment score submission"
    algorithm: threshold
    formula: |
      is_within_tolerance = |score - benchmark.known_score| <= benchmark.tolerance
      pass -> calibration_passes += 1; passes == 2 -> CALIBRATED (REQUIRED_CALIBRATION_PASSES)
      fail -> calibration_failures += 1; failures == 3 -> SUSPENDED (MAX_CALIBRATION_FAILURES)
      Boundary: |score - known_score| == tolerance PASSES (inclusive).
    input_set: "One calibration read and its benchmark"
    constants:
      REQUIRED_CALIBRATION_PASSES: 2
      MAX_CALIBRATION_FAILURES: 3

  - name: slot_capacity
    trigger: "POST /bookings creation and booking CANCELLED transition"
    algorithm: aggregation
    formula: |
      occupied(center, slot_start) = count of AssessmentBooking rows with
        center_id == center AND slot_start_at == slot_start AND status == BOOKED
      Creation requires occupied < center.slot_capacity (boundary: occupied ==
      slot_capacity rejects with ERR_SLOT_CAPACITY_FULL; slot_capacity - 1 succeeds).
      INTERVAL SEMANTICS: capacity pools are keyed on the EXACT slot_start_at
      instant; two bookings 30 minutes apart occupy DIFFERENT pools even though
      their 120-minute sessions overlap in time (contrast: cycle windows use
      half-open [open, close) adjacency-allowed semantics).
      INVARIANT (compensating): occupied + remaining == slot_capacity across
      every create/cancel pair.
    input_set: "BOOKED bookings of one center at one exact slot_start_at"
    constants:
      SESSION_DURATION_MINUTES: 120

  - name: renewal_total_hours
    trigger: "RenewalApplication creation / resubmission"
    algorithm: aggregation
    formula: |
      total_hours = sum(evidence_items[].hours)
      Approval requires total_hours >= 45 (MIN_RENEWAL_HOURS); exactly 45 passes.
    input_set: "The evidence_items array of the application"
    constants:
      MIN_RENEWAL_HOURS: 45

  - name: certification_validity
    trigger: "CERTIFIED transition, renewal APPROVE, clock sweep"
    algorithm: chronological
    formula: |
      valid_until = certified_at + 1825 days (VALIDITY_DAYS)
      On renewal APPROVE: valid_until = valid_until + 1825 days
      Clock sweep: status CERTIFIED or RENEWED with valid_until < now -> EXPIRED
      Renewal window: submittable when (valid_until - 90 days) <= now <= (valid_until + 30 days)
      (RENEWAL_LOOKBACK_DAYS, RENEWAL_GRACE_DAYS; both bounds inclusive)
    constants:
      VALIDITY_DAYS: 1825
      RENEWAL_LOOKBACK_DAYS: 90
      RENEWAL_GRACE_DAYS: 30

  - name: assessor_selector
    trigger: "POST /assignments with a submission target and no assessor_id"
    algorithm: selector
    formula: |
      Eligibility filter (ALL must hold):
        - assessor.status == ACTIVE
        - assessor.home_district_code != submission.candidate.district_code
        - assessor has no ScoringAssignment on this submission in
          ASSIGNED, SCORE_SUBMITTED, or FINALIZED status
      Ranking: open_assignment_count ASC; tie-break calibrated_at ASC
        (earlier calibration wins); final tie-break created_at ASC.
      Fallback: empty candidate set -> ERR_NO_ELIGIBLE_ASSESSOR (409).
    input_set: "All Assessor rows"
    note: "Random ids never participate in selection; the order above is total and deterministic."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed (POST /candidates and POST /_clock/set_current_utc excepted as declared)"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints except POST /candidates"

  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Ownership: a Candidate acting on a candidate-scoped resource has X-User-ID == resource.candidate_id (submissions, artifacts, bookings, renewals); an Assessor submitting a score has X-User-ID == assignment.assessor_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /submissions/{id}/submit, POST /submissions/{id}/retake, POST /submissions/{id}/artifacts, POST /bookings, POST /bookings/{id}/transition (CANCELLED), POST /certifications/{id}/renewals, POST /assignments/{id}/submit-score, GET /submissions/{id}, GET /submissions/{id}/artifacts, GET /bookings/{id}, GET /certifications/{id}, GET /certifications/{id}/renewals, GET /candidates/{id}, GET /assessors/{id}, GET /assignments/{id}"

  - priority: 4
    category: existence
    check: "Path identifiers resolve to existing resources, validated left-to-right; body-supplied ids (center_id, cycle_id, submission_id, benchmark_id, assessor_id) resolve as well"
    error_id: "ERR_CYCLE_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_CENTER_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_ASSESSOR_NOT_FOUND | ERR_BENCHMARK_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_RENEWAL_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_STIPEND_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: state
    check: "State preconditions of the invoked transition (per §1.2): candidate submittable/in-review/eligible, submission submittable/reviewable/scorable, cycle OPEN or transitionable, booking transitionable, assessor transitionable/scoring-eligible, renewal reviewable, certification renewable, stipend transitionable"
    error_id: "ERR_CANDIDATE_NOT_SUBMITTABLE | ERR_CANDIDATE_NOT_IN_REVIEW | ERR_CANDIDATE_NOT_ELIGIBLE | ERR_SUBMISSION_NOT_SUBMITTABLE | ERR_SUBMISSION_NOT_REVIEWABLE | ERR_SUBMISSION_NOT_SCORABLE | ERR_CYCLE_NOT_OPEN | ERR_INVALID_CYCLE_TRANSITION | ERR_BOOKING_NOT_TRANSITIONABLE | ERR_BOOKING_NOT_COMPLETABLE | ERR_INVALID_ASSESSOR_TRANSITION | ERR_ASSESSOR_NOT_SCORING_ELIGIBLE | ERR_RENEWAL_NOT_REVIEWABLE | ERR_CERTIFICATION_NOT_RENEWABLE | ERR_STIPEND_NOT_TRANSITIONABLE | ERR_ACTIVE_ATTEMPT_EXISTS | ERR_ACTIVE_RENEWAL_EXISTS | ERR_SUBMISSION_NOT_RETAKEABLE"
    http_status: 409
    applies_to: "all mutation endpoints"

  - priority: 6
    category: business_temporal
    check: "Window and clock rules: submission window half-open [open, close) on submit; retake window on retake; slot_start_at strictly after now and <= submission_window_close on booking; renewal window [valid_until-90d, valid_until+30d]; OPEN->SCORING requires clock >= submission_window_close"
    error_id: "ERR_SUBMISSION_WINDOW_CLOSED | ERR_RETAKE_WINDOW_CLOSED | ERR_SLOT_IN_PAST | ERR_SLOT_OUTSIDE_WINDOW | ERR_RENEWAL_WINDOW_NOT_OPEN | ERR_CYCLE_WINDOW_STILL_OPEN"
    http_status: 422
    applies_to: "POST /submissions/{id}/submit, POST /submissions/{id}/retake, POST /bookings, POST /certifications/{id}/renewals, POST /cycles/{id}/transition"

  - priority: 7
    category: business_constraint
    check: "Structural and numeric rules: required fields present (ERR_INVALID_REQUEST); cycle weights sum to 1.000 with exactly one ASSESSMENT component (ERR_WEIGHT_SUM_INVALID); component_code exists in cycle (ERR_COMPONENT_NOT_IN_CYCLE); new cycle window does not overlap an existing DRAFT/OPEN/SCORING cycle window under half-open [open, close) semantics — adjacency allowed (ERR_CYCLE_WINDOW_OVERLAP); score on 0.25 grid in [0.00,4.00] (ERR_SCORE_INVALID); exactly one of submission_id/benchmark_id on assignment create (ERR_ASSIGNMENT_TARGET_AMBIGUOUS); retake attempt cap (ERR_RETAKE_LIMIT_REACHED); slot capacity not full (ERR_SLOT_CAPACITY_FULL); at most one BOOKED booking per candidate per cycle (ERR_ACTIVE_BOOKING_EXISTS); years_experience >= 3 to approve eligibility (ERR_EXPERIENCE_REQUIREMENT_NOT_MET); artifact format/size/duration limits (ERR_ARTIFACT_FORMAT_INVALID, ERR_ARTIFACT_SIZE_EXCEEDED, ERR_VIDEO_DURATION_EXCEEDED); selector empty pool (ERR_NO_ELIGIBLE_ASSESSOR)"
    error_id: "ERR_INVALID_REQUEST | ERR_WEIGHT_SUM_INVALID | ERR_COMPONENT_NOT_IN_CYCLE | ERR_CYCLE_WINDOW_OVERLAP | ERR_SCORE_INVALID | ERR_ASSIGNMENT_TARGET_AMBIGUOUS | ERR_RETAKE_LIMIT_REACHED | ERR_SLOT_CAPACITY_FULL | ERR_ACTIVE_BOOKING_EXISTS | ERR_EXPERIENCE_REQUIREMENT_NOT_MET | ERR_ARTIFACT_FORMAT_INVALID | ERR_ARTIFACT_SIZE_EXCEEDED | ERR_VIDEO_DURATION_EXCEEDED | ERR_NO_ELIGIBLE_ASSESSOR"
    http_status: 422
    applies_to: "creation and action endpoints as listed per check"

  - priority: 8
    category: business_safety
    check: "Scoring integrity: an assessor may not hold a live assignment on a submission whose candidate.district_code == assessor.home_district_code (ERR_CONFLICT_OF_INTEREST); read 2 of a submission must go to a different assessor than read 1, and read 3 must differ from both (ERR_READ_SEGREGATION_VIOLATION)"
    error_id: "ERR_CONFLICT_OF_INTEREST | ERR_READ_SEGREGATION_VIOLATION"
    http_status: 403
    applies_to: "POST /assignments"

  - priority: 9
    category: business_referential
    check: "Portfolio composition at submit: at least one WRITTEN_COMMENTARY and at least one of VIDEO or STUDENT_WORK (ERR_REQUIRED_ARTIFACT_MISSING); when any VIDEO or STUDENT_WORK artifact has subject_student_count >= 1, at least one RELEASE_FORM artifact on the same submission (ERR_RELEASE_FORM_MISSING)"
    error_id: "ERR_REQUIRED_ARTIFACT_MISSING | ERR_RELEASE_FORM_MISSING"
    http_status: 422
    applies_to: "POST /submissions/{id}/submit"

  - priority: 10
    category: business_fiscal
    check: "Stipend approval: budget_remaining_cents >= amount_cents (ERR_PROGRAM_BUDGET_EXHAUSTED); an EXHAUSTED program has remaining 0 and fails the same gate"
    error_id: "ERR_PROGRAM_BUDGET_EXHAUSTED"
    http_status: 422
    applies_to: "POST /stipends/{id}/transition"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Startup default is exactly 2026-09-01T00:00:00Z; the server never falls back to wall-clock time. Setting the clock sweeps: BOOKED bookings whose slot_end_at passed -> NO_SHOW; CERTIFIED/RENEWED certifications whose valid_until passed -> EXPIRED. Submission expiry happens only on the cycle OPEN -> SCORING and SCORING -> CLOSED transitions (never on the clock), so the submission-window temporal gate stays reachable."
    roles: [BoardAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["expiry sweeps for bookings (NO_SHOW) and certifications (EXPIRED)"]

  - method: POST
    path: "/cycles"
    description: "Create a certification cycle in DRAFT. Rejects overlapping windows against any DRAFT/OPEN/SCORING cycle under half-open [open, close) semantics (adjacent is allowed) with ERR_CYCLE_WINDOW_OVERLAP; weights must sum to 1.000 with exactly one ASSESSMENT component (ERR_WEIGHT_SUM_INVALID)."
    roles: [BoardAdministrator]
    code: 201
    input: [code, components, submission_window_open, submission_window_close, retake_window_close, certification_threshold, "max_attempts_per_component?"]
    output: CertificationCycle
    side_effects: []

  - method: GET
    path: "/cycles/{id}"
    description: "Read one cycle."
    roles: [Candidate, Assessor, ScoringAdministrator, BoardAdministrator, IncentiveAdministrator]
    code: 200
    input: []
    output: CertificationCycle
    side_effects: []

  - method: POST
    path: "/cycles/{id}/transition"
    description: "Advance the cycle: DRAFT -> OPEN -> SCORING -> CLOSED. OPEN->SCORING requires the logical clock >= submission_window_close (ERR_CYCLE_WINDOW_STILL_OPEN) and expires all unsubmitted/unscored submissions of the cycle; SCORING->CLOSED expires SCORING/ADJUDICATION_REQUIRED submissions."
    roles: [BoardAdministrator]
    code: 200
    input: [to]
    output: CertificationCycle
    side_effects: ["submission EXPIRED sweeps per CertificationCycle machine"]

  - method: POST
    path: "/benchmarks"
    description: "Create a calibration benchmark performance with a panel-blessed known_score."
    roles: [ScoringAdministrator]
    code: 201
    input: [component_code, content_domain, known_score, "tolerance?"]
    output: CalibrationBenchmark
    side_effects: []

  - method: POST
    path: "/candidates"
    description: "Self-register a candidate (status REGISTERED). Open to Anonymous."
    roles: [Anonymous]
    code: 201
    input: [full_name, email, license_number, license_state, district_code, years_experience, "fte_fraction?"]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/candidates/{id}"
    description: "Read one candidate; a Candidate role caller may only read their own record."
    roles: [Candidate, ScoringAdministrator, BoardAdministrator, IncentiveAdministrator]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: POST
    path: "/candidates/{id}/submit-eligibility"
    description: "Submit licensure and experience evidence; REGISTERED or ELIGIBILITY_DENIED -> ELIGIBILITY_REVIEW (resubmission loop)."
    roles: [Candidate]
    code: 200
    input: [license_document_ref, employer_verification_ref]
    output: Candidate
    side_effects: ["Candidate status -> ELIGIBILITY_REVIEW"]

  - method: POST
    path: "/candidates/{id}/verify-eligibility"
    description: "Board decision on eligibility. APPROVE requires years_experience >= 3 (ERR_EXPERIENCE_REQUIREMENT_NOT_MET) and moves the candidate to ELIGIBLE; REJECT moves to ELIGIBILITY_DENIED."
    roles: [BoardAdministrator]
    code: 200
    input: [decision, "note?"]
    output: Candidate
    side_effects: ["Candidate status -> ELIGIBLE | ELIGIBILITY_DENIED"]

  - method: POST
    path: "/cycles/{id}/submissions"
    description: "Begin a component attempt for the calling candidate (X-User-ID). Requires the cycle OPEN and the candidate ELIGIBLE (ERR_CANDIDATE_NOT_ELIGIBLE); rejects when another attempt of the same component is still open (ERR_ACTIVE_ATTEMPT_EXISTS). Auto-creates the candidate's Certification (PENDING) for this cycle on first submission."
    roles: [Candidate]
    code: 201
    input: [component_code]
    output: ComponentSubmission
    side_effects: ["Certification auto-created in PENDING on the candidate's first submission of the cycle"]

  - method: GET
    path: "/submissions/{id}"
    description: "Read one submission; the owning candidate, administrators, and assessors holding an assignment on it may read."
    roles: [Candidate, Assessor, ScoringAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: ComponentSubmission
    side_effects: []

  - method: GET
    path: "/submissions"
    description: "List submissions with filters; reverse-reachability for candidate_id / cycle_id / prior_submission_id."
    roles: [Candidate, ScoringAdministrator, BoardAdministrator]
    code: 200
    input: ["candidate_id?", "cycle_id?", "prior_submission_id?", "status?", "limit?", "offset?"]
    output: "ComponentSubmission[]"
    side_effects: []

  - method: POST
    path: "/submissions/{id}/submit"
    description: "Submit (or resubmit from RETURNED) a component attempt. State gate (ERR_SUBMISSION_NOT_SUBMITTABLE) is checked before the window gate (ERR_SUBMISSION_WINDOW_CLOSED); portfolio composition gates follow (ERR_REQUIRED_ARTIFACT_MISSING before ERR_RELEASE_FORM_MISSING)."
    roles: [Candidate]
    code: 200
    input: []
    output: ComponentSubmission
    side_effects: ["status IN_PROGRESS|RETURNED -> SUBMITTED"]

  - method: POST
    path: "/submissions/{id}/tech-review"
    description: "Technical review of a SUBMITTED attempt: ACCEPT -> SCORING; RETURN -> RETURNED."
    roles: [ScoringAdministrator]
    code: 200
    input: [decision, "note?"]
    output: ComponentSubmission
    side_effects: ["status SUBMITTED -> SCORING | RETURNED"]

  - method: POST
    path: "/submissions/{id}/retake"
    description: "Create the next attempt for the same component. Source attempt must be SCORED (ERR_SUBMISSION_NOT_RETAKEABLE), attempt_number must stay <= cycle.max_attempts_per_component (ERR_RETAKE_LIMIT_REACHED), and the logical clock must be < cycle.retake_window_close (ERR_RETAKE_WINDOW_CLOSED). A DENIED Certification for this candidate+cycle reopens to PENDING."
    roles: [Candidate]
    code: 201
    input: []
    output: ComponentSubmission
    side_effects: ["new attempt created with prior_submission_id := id; attempt_number incremented; DENIED Certification -> PENDING"]

  - method: POST
    path: "/submissions/{id}/artifacts"
    description: "Upload an artifact to an IN_PROGRESS or RETURNED portfolio submission owned by the caller. Format/size/duration limits enforced synchronously."
    roles: [Candidate]
    code: 201
    input: [artifact_type, file_format, file_size_mb, "duration_minutes?", "subject_student_count?"]
    output: Artifact
    side_effects: []

  - method: GET
    path: "/submissions/{id}/artifacts"
    description: "List artifacts of a submission."
    roles: [Candidate, Assessor, ScoringAdministrator, BoardAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Artifact[]"
    side_effects: []

  - method: POST
    path: "/assessment-centers"
    description: "Create an assessment center with a per-slot seat capacity."
    roles: [BoardAdministrator]
    code: 201
    input: [name, region_code, slot_capacity]
    output: AssessmentCenter
    side_effects: []

  - method: GET
    path: "/assessment-centers/{id}"
    description: "Read one assessment center."
    roles: [Candidate, ScoringAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: AssessmentCenter
    side_effects: []

  - method: POST
    path: "/bookings"
    description: "Book a content-knowledge assessment slot for the calling candidate. Requires an IN_PROGRESS ASSESSMENT-kind submission in the given cycle (ERR_CANDIDATE_NOT_ELIGIBLE if the candidate is not ELIGIBLE; ERR_SUBMISSION_NOT_FOUND if no open ASSESSMENT attempt exists), slot_start_at strictly after now (ERR_SLOT_IN_PAST) and <= submission_window_close (ERR_SLOT_OUTSIDE_WINDOW), at most one BOOKED booking per candidate per cycle (ERR_ACTIVE_BOOKING_EXISTS), and occupied(center, slot_start_at) < slot_capacity (ERR_SLOT_CAPACITY_FULL)."
    roles: [Candidate]
    code: 201
    input: [center_id, cycle_id, slot_start_at]
    output: AssessmentBooking
    side_effects: ["occupies one seat of (center_id, slot_start_at); slot_end_at computed as slot_start_at + 120 minutes"]

  - method: GET
    path: "/bookings/{id}"
    description: "Read one booking; the owning candidate and administrators may read."
    roles: [Candidate, ScoringAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: AssessmentBooking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings with filters; reverse-reachability for candidate_id / center_id / cycle_id."
    roles: [ScoringAdministrator, BoardAdministrator]
    code: 200
    input: ["candidate_id?", "center_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: "AssessmentBooking[]"
    side_effects: []

  - method: POST
    path: "/bookings/{id}/transition"
    description: "Booking lifecycle: Candidate cancels their own BOOKED booking (to: CANCELLED, frees the seat); ScoringAdministrator completes (to: COMPLETED with earned_score, cascading to the ASSESSMENT submission and certification aggregation) or marks NO_SHOW."
    roles: [Candidate, ScoringAdministrator]
    code: 200
    input: [to, "earned_score?"]
    output: AssessmentBooking
    side_effects: ["CANCELLED frees the slot seat; COMPLETED cascades: submission SCORED -> certification_aggregation -> possible CERTIFIED -> stipend auto-proposal"]

  - method: POST
    path: "/assessors"
    description: "Recruit an assessor (status RECRUITED)."
    roles: [ScoringAdministrator]
    code: 201
    input: [full_name, email, home_district_code]
    output: Assessor
    side_effects: []

  - method: GET
    path: "/assessors/{id}"
    description: "Read one assessor including calibration counters and reliability rates; an Assessor role caller may only read their own record."
    roles: [Assessor, ScoringAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: Assessor
    side_effects: []

  - method: POST
    path: "/assessors/{id}/transition"
    description: "Advance the assessor: RECRUITED|SUSPENDED -> IN_TRAINING (resets calibration counters), IN_TRAINING -> CALIBRATING, CALIBRATED -> ACTIVE, ACTIVE -> SUSPENDED. CALIBRATING -> CALIBRATED and the IRR / failure-count suspensions are system transitions only (ERR_INVALID_ASSESSOR_TRANSITION if requested directly)."
    roles: [ScoringAdministrator]
    code: 200
    input: [to]
    output: Assessor
    side_effects: ["IN_TRAINING from SUSPENDED resets calibration_passes/failures; SUSPENDED cascades open ASSIGNED assignments to REASSIGNED"]

  - method: POST
    path: "/assignments"
    description: "Create a scoring assignment. Exactly one of submission_id / benchmark_id (ERR_ASSIGNMENT_TARGET_AMBIGUOUS — checked before conflict-of-interest). Live target: submission must be SCORING or ADJUDICATION_REQUIRED (ERR_SUBMISSION_NOT_SCORABLE), assessor must be ACTIVE (ERR_ASSESSOR_NOT_SCORING_ELIGIBLE), district conflict barred (ERR_CONFLICT_OF_INTEREST), read segregation enforced (ERR_READ_SEGREGATION_VIOLATION). Benchmark target: assessor must be CALIBRATING. Omitting assessor_id invokes the assessor_selector policy (ERR_NO_ELIGIBLE_ASSESSOR when the pool is empty)."
    roles: [ScoringAdministrator]
    code: 201
    input: ["submission_id?", "benchmark_id?", "assessor_id?"]
    output: ScoringAssignment
    side_effects: ["read_number computed; assessor.open_assignment_count increments"]

  - method: GET
    path: "/assignments/{id}"
    description: "Read one assignment; the assigned assessor and administrators may read."
    roles: [Assessor, ScoringAdministrator, BoardAdministrator]
    code: 200
    input: []
    output: ScoringAssignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments with filters; reverse-reachability for assessor_id / submission_id / benchmark_id."
    roles: [ScoringAdministrator, BoardAdministrator]
    code: 200
    input: ["assessor_id?", "submission_id?", "benchmark_id?", "status?", "limit?", "offset?"]
    output: "ScoringAssignment[]"
    side_effects: []

  - method: POST
    path: "/assignments/{id}/submit-score"
    description: "Assessor submits their blind score for their own ASSIGNED assignment. Calibration reads finalize immediately and drive calibration counters; live reads drive agreement/adjudication/finalization per the ComponentSubmission and ScoringAssignment machines."
    roles: [Assessor]
    code: 200
    input: [score]
    output: ScoringAssignment
    side_effects: ["assignment -> SCORE_SUBMITTED/FINALIZED; calibration counters; read-pair agreement -> submission SCORED or ADJUDICATION_REQUIRED; IRR window update; certification_aggregation cascade on submission SCORED"]

  - method: GET
    path: "/certifications/{id}"
    description: "Read one certification (weighted totals, status, validity)."
    roles: [Candidate, ScoringAdministrator, BoardAdministrator, IncentiveAdministrator]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: GET
    path: "/certifications"
    description: "List certifications with filters; reverse-reachability for candidate_id / cycle_id."
    roles: [ScoringAdministrator, BoardAdministrator, IncentiveAdministrator]
    code: 200
    input: ["candidate_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: "Certification[]"
    side_effects: []

  - method: POST
    path: "/certifications/{id}/renewals"
    description: "Submit a renewal application with continued-practice evidence. Certification must be CERTIFIED or RENEWED (ERR_CERTIFICATION_NOT_RENEWABLE), clock within [valid_until - 90 days, valid_until + 30 days] inclusive (ERR_RENEWAL_WINDOW_NOT_OPEN), and no other renewal SUBMITTED (ERR_ACTIVE_RENEWAL_EXISTS). Resubmitting against a RETURNED application reuses it (RETURNED -> SUBMITTED with new evidence)."
    roles: [Candidate]
    code: 201
    input: [evidence_items]
    output: RenewalApplication
    side_effects: ["total_hours computed"]

  - method: GET
    path: "/certifications/{id}/renewals"
    description: "List renewal applications of a certification."
    roles: [Candidate, BoardAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: "RenewalApplication[]"
    side_effects: []

  - method: POST
    path: "/renewals/{id}/review"
    description: "Board review of a renewal. APPROVE requires total_hours >= 45 (ERR_RENEWAL_HOURS_INSUFFICIENT) and extends the certification (RENEWED, valid_until += 1825 days); RETURN sends it back for revision."
    roles: [BoardAdministrator]
    code: 200
    input: [decision, "note?"]
    output: RenewalApplication
    side_effects: ["on APPROVE: Certification -> RENEWED, valid_until extended"]

  - method: POST
    path: "/incentive-programs"
    description: "Create a state or district incentive program with a stipend budget."
    roles: [IncentiveAdministrator]
    code: 201
    input: [name, sponsor_state, "sponsor_district_code?", budget_total_cents, base_stipend_cents, "early_bird_multiplier?", "early_bird_deadline?"]
    output: IncentiveProgram
    side_effects: []

  - method: GET
    path: "/incentive-programs/{id}"
    description: "Read one incentive program including budget_remaining_cents."
    roles: [Candidate, ScoringAdministrator, BoardAdministrator, IncentiveAdministrator]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: []

  - method: GET
    path: "/incentive-programs/{id}/stipends"
    description: "List stipend payments of a program."
    roles: [IncentiveAdministrator, BoardAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StipendPayment[]"
    side_effects: []

  - method: GET
    path: "/certifications/{id}/stipends"
    description: "List stipend payments attached to a certification."
    roles: [Candidate, IncentiveAdministrator, BoardAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StipendPayment[]"
    side_effects: []

  - method: POST
    path: "/stipends/{id}/transition"
    description: "Stipend lifecycle: PROPOSED -> APPROVED (debits program budget; ERR_PROGRAM_BUDGET_EXHAUSTED when insufficient; reaching exactly 0 exhausts the program), APPROVED -> PAID, PROPOSED|APPROVED -> REVOKED (revoking an APPROVED stipend credits the budget back and may reopen an EXHAUSTED program)."
    roles: [IncentiveAdministrator]
    code: 200
    input: [to]
    output: StipendPayment
    side_effects: ["budget debit/credit per program_budget_remaining; program OPEN <-> EXHAUSTED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed on any endpoint other than POST /candidates" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller's X-User-ID does not match the resource's owner field (candidate_id / assessor_id)" }
  # --- existence (404, left-to-right) ---
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "cycle id in path or body does not exist" }
  - { id: ERR_CANDIDATE_NOT_FOUND, http: 404, condition: "candidate id in path does not exist" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "submission id in path or body does not exist; also: booking create with no open ASSESSMENT attempt for (candidate, cycle)" }
  - { id: ERR_CENTER_NOT_FOUND, http: 404, condition: "center id in path or body does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "booking id in path does not exist" }
  - { id: ERR_ASSESSOR_NOT_FOUND, http: 404, condition: "assessor id in path or body does not exist" }
  - { id: ERR_BENCHMARK_NOT_FOUND, http: 404, condition: "benchmark_id in body does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignment id in path does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "certification id in path does not exist" }
  - { id: ERR_RENEWAL_NOT_FOUND, http: 404, condition: "renewal id in path does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "program id in path does not exist" }
  - { id: ERR_STIPEND_NOT_FOUND, http: 404, condition: "stipend id in path does not exist" }
  # --- state (409) ---
  - { id: ERR_CANDIDATE_NOT_SUBMITTABLE, http: 409, condition: "submit-eligibility on a candidate not in REGISTERED or ELIGIBILITY_DENIED" }
  - { id: ERR_CANDIDATE_NOT_IN_REVIEW, http: 409, condition: "verify-eligibility on a candidate not in ELIGIBILITY_REVIEW" }
  - { id: ERR_CANDIDATE_NOT_ELIGIBLE, http: 409, condition: "submission create or booking create by a candidate whose status is not ELIGIBLE" }
  - { id: ERR_SUBMISSION_NOT_SUBMITTABLE, http: 409, condition: "submit on a submission not in IN_PROGRESS or RETURNED (checked before window rules)" }
  - { id: ERR_SUBMISSION_NOT_REVIEWABLE, http: 409, condition: "tech-review on a submission not in SUBMITTED" }
  - { id: ERR_SUBMISSION_NOT_SCORABLE, http: 409, condition: "live assignment target submission not in SCORING or ADJUDICATION_REQUIRED; also: a third assignment when reads 1-2 already agreed" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "submission create or submit against a cycle not in OPEN" }
  - { id: ERR_INVALID_CYCLE_TRANSITION, http: 409, condition: "cycle transition not following DRAFT -> OPEN -> SCORING -> CLOSED" }
  - { id: ERR_BOOKING_NOT_TRANSITIONABLE, http: 409, condition: "booking transition from a status other than BOOKED" }
  - { id: ERR_BOOKING_NOT_COMPLETABLE, http: 409, condition: "COMPLETED requested before slot_start_at" }
  - { id: ERR_INVALID_ASSESSOR_TRANSITION, http: 409, condition: "assessor transition outside the declared machine (including direct requests of system-only transitions CALIBRATED/SUSPENDED-by-threshold)" }
  - { id: ERR_ASSESSOR_NOT_SCORING_ELIGIBLE, http: 409, condition: "live assignment for an assessor not ACTIVE, or benchmark assignment for an assessor not CALIBRATING" }
  - { id: ERR_RENEWAL_NOT_REVIEWABLE, http: 409, condition: "renewal review on an application not in SUBMITTED or RETURNED" }
  - { id: ERR_CERTIFICATION_NOT_RENEWABLE, http: 409, condition: "renewal create on a certification not in CERTIFIED or RENEWED" }
  - { id: ERR_STIPEND_NOT_TRANSITIONABLE, http: 409, condition: "stipend transition outside PROPOSED->APPROVED, APPROVED->PAID, PROPOSED|APPROVED->REVOKED" }
  - { id: ERR_ACTIVE_ATTEMPT_EXISTS, http: 409, condition: "submission create while another attempt of the same (candidate, cycle, component) is in IN_PROGRESS, SUBMITTED, RETURNED, SCORING, or ADJUDICATION_REQUIRED" }
  - { id: ERR_ACTIVE_RENEWAL_EXISTS, http: 409, condition: "renewal create while another application of the same certification is SUBMITTED" }
  - { id: ERR_SUBMISSION_NOT_RETAKEABLE, http: 409, condition: "retake on an attempt whose status is not SCORED" }
  # --- business_temporal (422) ---
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 422, condition: "submit outside the half-open [submission_window_open, submission_window_close)" }
  - { id: ERR_RETAKE_WINDOW_CLOSED, http: 422, condition: "retake at or after the cycle's retake_window_close" }
  - { id: ERR_SLOT_IN_PAST, http: 422, condition: "booking slot_start_at not strictly after the logical clock" }
  - { id: ERR_SLOT_OUTSIDE_WINDOW, http: 422, condition: "booking slot_start_at after the cycle's submission_window_close" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 422, condition: "renewal create outside [valid_until - 90d, valid_until + 30d] inclusive" }
  - { id: ERR_CYCLE_WINDOW_STILL_OPEN, http: 422, condition: "OPEN -> SCORING requested before the clock reaches submission_window_close" }
  # --- business_constraint (422 unless noted) ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, malformed value, or conditionally-required field absent (e.g. duration_minutes for VIDEO, earned_score for COMPLETED)" }
  - { id: ERR_WEIGHT_SUM_INVALID, http: 422, condition: "cycle component weights do not sum to exactly 1.000, or not exactly one ASSESSMENT component" }
  - { id: ERR_COMPONENT_NOT_IN_CYCLE, http: 422, condition: "component_code absent from the cycle's components array" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "new cycle window overlaps an existing DRAFT/OPEN/SCORING cycle window (half-open: touching endpoints allowed)" }
  - { id: ERR_SCORE_INVALID, http: 422, condition: "score outside [0.00, 4.00] or off the 0.25 grid" }
  - { id: ERR_ASSIGNMENT_TARGET_AMBIGUOUS, http: 422, condition: "neither or both of submission_id / benchmark_id supplied (checked before conflict-of-interest)" }
  - { id: ERR_RETAKE_LIMIT_REACHED, http: 422, condition: "retake would push attempt_number beyond cycle.max_attempts_per_component" }
  - { id: ERR_SLOT_CAPACITY_FULL, http: 409, condition: "occupied(center, slot_start_at) == slot_capacity at booking time" }
  - { id: ERR_ACTIVE_BOOKING_EXISTS, http: 409, condition: "candidate already holds a BOOKED booking in this cycle" }
  - { id: ERR_EXPERIENCE_REQUIREMENT_NOT_MET, http: 422, condition: "eligibility APPROVE with years_experience < 3" }
  - { id: ERR_ARTIFACT_FORMAT_INVALID, http: 422, condition: "file_format not in the allowed set for the artifact_type" }
  - { id: ERR_ARTIFACT_SIZE_EXCEEDED, http: 422, condition: "file_size_mb over the type limit (500 video / 50 documents)" }
  - { id: ERR_VIDEO_DURATION_EXCEEDED, http: 422, condition: "VIDEO duration_minutes > 15" }
  - { id: ERR_NO_ELIGIBLE_ASSESSOR, http: 409, condition: "selector policy found no ACTIVE, non-conflicted, not-already-assigned assessor" }
  # --- business_safety (403) ---
  - { id: ERR_CONFLICT_OF_INTEREST, http: 403, condition: "assessor.home_district_code == submission.candidate.district_code on a live assignment" }
  - { id: ERR_READ_SEGREGATION_VIOLATION, http: 403, condition: "read 2 assigned to the read-1 assessor, or read 3 assigned to a reader of read 1 or 2" }
  # --- business_referential (422) ---
  - { id: ERR_REQUIRED_ARTIFACT_MISSING, http: 422, condition: "portfolio submit without >= 1 WRITTEN_COMMENTARY and >= 1 of VIDEO/STUDENT_WORK" }
  - { id: ERR_RELEASE_FORM_MISSING, http: 422, condition: "portfolio submit with a VIDEO or STUDENT_WORK artifact having subject_student_count >= 1 but no RELEASE_FORM artifact (checked after ERR_REQUIRED_ARTIFACT_MISSING)" }
  # --- business_fiscal (422) ---
  - { id: ERR_PROGRAM_BUDGET_EXHAUSTED, http: 422, condition: "stipend approval with budget_remaining_cents < amount_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor; may only self-register as a candidate."
    identity: opaque
    exclusive_operations: ["POST /candidates"]
    shared_operations: []

  - name: Candidate
    description: "Teacher pursuing board certification; owns submissions, artifacts, bookings, and renewal applications."
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /candidates/{id}/submit-eligibility (own record)"
      - "POST /cycles/{id}/submissions (as self)"
      - "POST /submissions/{id}/submit (own)"
      - "POST /submissions/{id}/retake (own)"
      - "POST /submissions/{id}/artifacts (own)"
      - "POST /bookings (as self)"
      - "POST /bookings/{id}/transition to CANCELLED (own)"
      - "POST /certifications/{id}/renewals (own)"
    shared_operations:
      - "GET /candidates/{id} (own), GET /cycles/{id}, GET /submissions/{id} (own), GET /submissions (own), GET /submissions/{id}/artifacts (own), GET /bookings/{id} (own), GET /assessment-centers/{id}, GET /certifications/{id} (own), GET /certifications/{id}/renewals (own), GET /certifications/{id}/stipends (own), GET /incentive-programs/{id}"

  - name: Assessor
    description: "Calibrated scoring professional; submits blind scores on own assignments only."
    identity: "entity_backed:Assessor"
    exclusive_operations:
      - "POST /assignments/{id}/submit-score (own assignment)"
    shared_operations:
      - "GET /assessors/{id} (own), GET /assignments/{id} (own), GET /submissions/{id} (assigned), GET /submissions/{id}/artifacts (assigned), GET /cycles/{id}"

  - name: ScoringAdministrator
    description: "Runs the assessment center program: technical review, assessor pipeline, assignment orchestration, exam completion."
    identity: opaque
    exclusive_operations:
      - "POST /benchmarks"
      - "POST /submissions/{id}/tech-review"
      - "POST /assessors, POST /assessors/{id}/transition"
      - "POST /assignments"
      - "POST /bookings/{id}/transition to COMPLETED | NO_SHOW"
    shared_operations:
      - "GET reads across cycles, candidates, submissions, artifacts, bookings, assessors, assignments, certifications, centers"

  - name: BoardAdministrator
    description: "Board operations: cycle and center configuration, eligibility decisions, renewal review, logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /cycles, POST /cycles/{id}/transition"
      - "POST /assessment-centers"
      - "POST /candidates/{id}/verify-eligibility"
      - "POST /renewals/{id}/review"
    shared_operations:
      - "GET reads across cycles, candidates, submissions, artifacts, bookings, assessors, assignments, certifications, renewals, centers, programs, stipends"

  - name: IncentiveAdministrator
    description: "Administers state/district incentive programs and stipend disbursement; segregation of duties: cannot verify eligibility, review renewals, or score."
    identity: opaque
    exclusive_operations:
      - "POST /incentive-programs"
      - "POST /stipends/{id}/transition"
    shared_operations:
      - "GET /incentive-programs/{id}, GET /incentive-programs/{id}/stipends, GET /certifications/{id}, GET /certifications/{id}/stipends, GET /certifications, GET /candidates/{id}, GET /cycles/{id}"
