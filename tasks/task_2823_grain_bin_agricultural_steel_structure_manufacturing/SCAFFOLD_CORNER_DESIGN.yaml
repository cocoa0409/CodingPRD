      - name: both_failure_verdict_comparisons_are_strict_and_the_branch_order_ignores_the_other_axis
        claim_type: correct_result
        grounds:
          - calculations.failure_root_cause_determination
          - entities.FieldFailure.structural_verdict
          - entities.FieldFailure.corrosion_verdict
          - entities.FieldFailure.determined_cause
        distinguishing_aspect: "The first failure sits exactly ON both limits - observed_load_kpa equal to governing_demand_kpa 28.518 and measured_coating_loss_pct equal to the C3 limit 40.0 - and both strict comparisons therefore fall to the benign side, WITHIN_DESIGN and WITHIN_CLASS. The second failure exceeds both, yet because branch 3a is reserved for CORROSION_PERFORATION its EXCEEDS_CLASS corrosion verdict is irrelevant to a SIDEWALL_BUCKLE, which routes through 3c. Both determinations land on OVERLOAD_MISUSE from opposite verdict pairs, which is the one branch that fires no cross-entity side effect - so the design must still be DRAFT afterwards, proving the branch was evaluated rather than defaulted."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115 (zinc 350 -> corrosion_class C3, CORROSION_LOSS_LIMIT 40.0), engineer PE-1001, Dealer Alpha."
            - "BinDesign D1 (12.0 m x 9.6 m, ASD) with governing_demand_kpa 28.518."
            - "Two DealerOrders on D1, both OFFSEASON / NONE / GRAVITY, and no installation crew assigned to either."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id, cs_class: $.data.corrosion_class }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_gov: $.data.governing_demand_kpa }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { oa_id: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { ob_id: $.data.id }
          trigger:
            - call: "POST /field-failures"
              payload: { dealer_order_id: "${oa_id}", failure_mode: "CORROSION_PERFORATION", observed_load_kpa: 28.518, measured_coating_loss_pct: 40.0, service_years: 12.0 }
              as: QualityInspector
              captures: { ffa_id: $.data.id, ffa_design: $.data.bin_design_id }
            - call: "POST /field-failures/${ffa_id}/start-analysis"
              payload: {}
              as: QualityInspector
              captures: { ffa_sv: $.data.structural_verdict, ffa_cv: $.data.corrosion_verdict }
            - call: "POST /field-failures/${ffa_id}/determine"
              payload: {}
              as: QualityInspector
              captures: { ffa_cause: $.data.determined_cause, ffa_status: $.data.status }
            - call: "POST /field-failures"
              payload: { dealer_order_id: "${ob_id}", failure_mode: "SIDEWALL_BUCKLE", observed_load_kpa: 28.519, measured_coating_loss_pct: 40.1, service_years: 5.0 }
              as: QualityInspector
              captures: { ffb_id: $.data.id }
            - call: "POST /field-failures/${ffb_id}/start-analysis"
              payload: {}
              as: QualityInspector
              captures: { ffb_sv: $.data.structural_verdict, ffb_cv: $.data.corrosion_verdict }
            - call: "POST /field-failures/${ffb_id}/determine"
              payload: {}
              as: QualityInspector
              captures: { ffb_cause: $.data.determined_cause }
            - call: "GET /bin-designs/${d1_id}"
              as: QualityInspector
              captures: { d1_status_after: $.data.status }
          assert:
            - "the coating spec reports corrosion_class C3, whose CORROSION_LOSS_LIMIT is 40.0"
            - "both failures copied bin_design_id from their order at intake and were born in status INTAKE with all three verdict fields null"
            - "failure A reports structural_verdict WITHIN_DESIGN because 28.518 is not strictly greater than governing_demand_kpa 28.518"
            - "failure A reports corrosion_verdict WITHIN_CLASS because 40.0 is not strictly greater than the C3 limit 40.0"
            - "failure A determines determined_cause OVERLOAD_MISUSE via branch 3a and reaches status DETERMINED"
            - "failure B reports structural_verdict EXCEEDS_DESIGN (28.519 > 28.518) and corrosion_verdict EXCEEDS_CLASS (40.1 > 40.0)"
            - "failure B determines determined_cause OVERLOAD_MISUSE via branch 3c - the EXCEEDS_CLASS corrosion verdict is ignored because branch 3a only matches CORROSION_PERFORATION"
            - "the BinDesign is still status DRAFT after both determinations, because OVERLOAD_MISUSE fires no cross-entity side effect"

      # ---- calculations claims already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml ----

      - name: identical_geometry_under_asd_and_lrfd_yields_different_stiffener_counts
        claim_type: variant_divergence
        grounds:
          - calculations.structural_stiffener_requirement
        excluded_because:
          difficulty_instance: "dual_variant_calc / asd_vs_lrfd_stiffener_count_diverges_on_identical_bin_design"
          rationale: "The §1.8 instance already drives both allowables (90.0 vs 101.25) over one geometry and pins the divergent required_stiffener_count and utilization_ratio on both the BinDesign row and a cross-method DesignAnalysis, including the case where the analysis method differs from the design's own method. A separate §1.9 variant-divergence claim would restate it."

      - name: allocation_basis_changes_each_orders_freight_share
        claim_type: variant_divergence
        grounds:
          - calculations.freight_load_allocation
        excluded_because:
          difficulty_instance: "dual_variant_calc / freight_allocation_weight_vs_cube_basis_diverges_for_same_two_orders"
          rationale: "The §1.8 instance builds two loads carrying the same dense-kit plus bulky-kit pair, one WEIGHT and one CUBE, and asserts both allocated_freight_cents pairs plus the identical linehaul total, which is exactly the variant-divergence claim for this calculation."

      - name: aeration_airflow_respects_the_nested_minimum_and_maximum
        claim_type: correct_result
        grounds:
          - calculations.aeration_and_drying_capacity
        excluded_because:
          difficulty_instance: "combinatorial_formula / aeration_cfm_nested_min_max_with_moisture_and_depth_penalties"
          rationale: "The §1.8 instance already walks the full nested expression including the MAX_FAN_CFM saturation arm and the interaction with the priority-13 pre-clamp rejection. The §1.9 aeration instance above deliberately covers only the unsaturated AERATION path so the two do not overlap."

      - name: bolt_pack_quantity_ceils_per_course_before_multiplying
        claim_type: correct_result
        grounds:
          - calculations.kit_bill_of_materials
        excluded_because:
          difficulty_instance: "combinatorial_formula / bolt_pack_count_ceils_per_course_then_sums"
          rationale: "The §1.8 instance contrasts the per-course ceiling against the whole-bin ceiling on a geometry where the two answers differ, which is the only interesting content of this claim."

      - name: freight_surcharge_tier_boundaries_are_tested_on_each_side
        claim_type: constants_applied
        grounds:
          - calculations.order_price_and_credit
        excluded_because:
          difficulty_instance: "combinatorial_formula / order_freight_surcharge_tier_keyed_on_net_subtotal_not_on_total"
          rationale: "The §1.8 instance places net_subtotal_cents just under 6000000 while total_cents lands above it, which pins both the tier boundary and the fact that the tier key is the net subtotal rather than the total. The §1.9 pricing instance above stays inside a single tier on purpose."

      - name: high_wind_threshold_is_tested_at_and_below_the_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.structural_stiffener_requirement
        excluded_because:
          difficulty_instance: "boundary_precision_check / wind_speed_115_mph_adds_high_wind_stiffener_bonus_while_114_does_not"
          rationale: "The §1.8 instance tests 114 and 115 mph on otherwise identical designs and asserts the stiffener bonus, roof_ring_required and the utilization change together, which is the whole threshold claim."

      - name: cube_utilization_is_rounded_to_two_places_before_the_dispatch_gate
        claim_type: precision
        grounds:
          - calculations.freight_load_allocation
        excluded_because:
          difficulty_instance: "boundary_precision_check / high_cube_load_dispatches_at_exactly_75_00_pct_utilization_and_rejects_at_74_99"
          rationale: "The §1.8 instance dispatches at exactly 75.00 percent and rejects at 74.99 on a HIGH_CUBE_VAN, which pins both the 2-decimal rounding and the inclusive comparison at the gate."

      - name: coil_lot_running_mass_is_correct_after_add_and_after_reversal
        claim_type: aggregation_running_total
        grounds:
          - calculations.coil_mass_ledger
        excluded_because:
          difficulty_instance: "compensating_invariant / voiding_a_completed_run_restores_the_coil_lot_steel_mass_conservation_identity_with_zero_drift"
          rationale: "The §1.8 instance reconciles reserved, consumed, scrap and remaining across schedule, complete and void and asserts the conservation identity with zero drift, which subsumes the running-total claim for this aggregation."

      - name: dealer_credit_running_commitment_is_correct_after_add_and_after_release
        claim_type: aggregation_running_total
        grounds:
          - calculations.dealer_credit_ledger
        excluded_because:
          difficulty_instance: "compensating_invariant / cancelling_confirmed_orders_restores_the_dealer_credit_conservation_identity_without_double_release"
          rationale: "The §1.8 instance accumulates credit_committed_cents over several confirmed orders and then releases them one at a time, asserting that a repeated cancel cannot release twice - the add and reversal arms of this claim."

  # =====================================================================
  # SECTION: validations  (claim-extraction-guide Table 4)
  # =====================================================================
  - section: validations
    instances:

      - name: auth_and_role_outrank_everything_and_body_lookup_outranks_actor_scope
        claim_type: priority_ordering
        grounds:
          - validations.p1
          - validations.p2
          - validations.p5
          - validations.p6
          - errors.ERR_ENGINEER_SCOPE_VIOLATION
        distinguishing_aspect: "The two calls that are made here isolate the priority-5 / priority-6 boundary: the actor's X-User-ID is a UUID that resolves to no Engineer AND the body names a coating_spec_id that resolves to no CoatingSpec. Because body FK resolution is priority 5 and actor ownership is priority 6, the answer must be ERR_CONFIG_NOT_FOUND (404), not ERR_ENGINEER_SCOPE_VIOLATION (403). Removing the FK defect from the same bogus actor then yields the 403, proving both rules are live and only their order was under test. The header-level cases in the assert list close out priorities 1 and 2, which sit above even request-shape validation."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115 and a registered Engineer PE-1001 with a Dealer Alpha."
            - "No Engineer row exists for the UUID 00000000-0000-0000-0000-0000000000ee, and no CoatingSpec exists for 00000000-0000-0000-0000-0000000000cc."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
          trigger:
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "00000000-0000-0000-0000-0000000000cc", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "00000000-0000-0000-0000-0000000000ee"
              captures: { e_fk: $.data.error_id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "00000000-0000-0000-0000-0000000000ee"
              captures: { e_scope: $.data.error_id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { ok_id: $.data.id, ok_author: $.data.author_engineer_id }
          assert:
            - "the unknown-actor plus unknown-coating call returns HTTP 404 with error_id ERR_CONFIG_NOT_FOUND - priority 5 body FK resolution outranks the priority 6 actor-ownership check"
            - "the unknown-actor call with every FK valid returns HTTP 403 with error_id ERR_ENGINEER_SCOPE_VIOLATION"
            - "the same call by the registered engineer returns HTTP 201 with author_engineer_id equal to the acting engineer id, so neither rejection was caused by the payload"
            - "the same POST /bin-designs issued with the X-User-ID header entirely absent returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS even when the body also carries the unknown coating_spec_id - priority 1 outranks priorities 3, 5 and 6"
            - "the same call issued with X-User-Role: YardForeman (not one of the seven declared roles) also returns HTTP 401 with error_id ERR_MISSING_AUTH_HEADERS"
            - "the same call issued as PlantAdmin - a declared role that is not in this endpoint's roles list - returns HTTP 403 with error_id ERR_UNAUTHORIZED_ROLE even when diameter_m is omitted entirely, so priority 2 outranks priority 3"
            - "no BinDesign row is created by any of the rejected attempts: GET /bin-designs with dealer_id filter returns total_count 1"

      - name: moisture_gate_outranks_the_wind_gate_which_outranks_the_engineer_licence_gate
        claim_type: priority_ordering
        grounds:
          - validations.p9
          - validations.p10
          - validations.p15
          - errors.ERR_MOISTURE_EXCEEDS_COATING_LIMIT
          - errors.ERR_WIND_BELOW_JURISDICTION_MINIMUM
          - errors.ERR_ENGINEER_NOT_LICENSED_IN_JURISDICTION
        distinguishing_aspect: "One request violates all three business rules at once - moisture 15.0 against a G90 coating limited to 14.0, wind 90 mph against an IA-CENTRAL minimum of 105, and an engineer licensed only in NE-WEST - and the answer must be the priority-9 moisture error. Peeling the violations off one at a time then walks the ladder down to priority 10 and priority 15 in order. The final success call sits exactly ON both numeric limits (moisture 14.0 == 14.0 and wind 105 == 105), proving both comparisons are inclusive rather than strict."
        test_recipe:
          setup:
            - "Jurisdiction IA-CENTRAL with min_design_wind_speed_mph 105 and seismic_design_category B."
            - "CoatingSpec G90 with max_ambient_moisture_pct 14.0."
            - "Engineer PE-1001 licensed in IA-CENTRAL and Engineer PE-9001 licensed only in NE-WEST."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "IA-CENTRAL", name: "Iowa Central", seal_required: true, min_design_wind_speed_mph: 105, seismic_design_category: "B", permit_review_days: 21 }
              as: PlantAdmin
              captures: { j_ia_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
