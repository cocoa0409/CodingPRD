        distinguishing_aspect: |
          Boundary on metric net_door_cents at exactly versus_threshold_cents:
          comparator is strictly greater (>) — at exact equality, bonus_cents == 0.
          Metric: net_door_cents. Endpoint: POST /shows/{id}/settlement.
        test_recipe:
          setup:
            - "VERSUS deal: guarantee=50000, threshold=100000, split=0.60, expense_budget=0"
            - "Sell exactly 50 tickets at 2000 = 100000 gross, no expenses → net_door == 100000 == threshold exactly"
