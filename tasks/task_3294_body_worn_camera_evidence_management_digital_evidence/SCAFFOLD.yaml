    roles: [Officer, Supervisor]
    code: 200
    input: [category]
    output: Recording
    side_effects: ["if upload_status == INTEGRITY_VERIFIED: -> ACTIVE with retention_due_at computed and storage counters recomputed; if already ACTIVE: retention_due_at recomputed from original upload time with the new category"]

  - method: POST
