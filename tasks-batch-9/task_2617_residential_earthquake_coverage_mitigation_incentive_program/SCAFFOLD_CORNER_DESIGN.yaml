            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "156 Mitigation Mews", county_hazard_tier: "TIER_2", soil_class: "STIFF", structure_type: "WOOD_FRAME_CRIPPLE_WALL", year_built: 1958, dwelling_limit_cents: 20000000 }
