      - name: listing_expiry_is_strict_so_clock_equal_to_expires_on_blocks_release
        grounds:
          - calculations.certification_posture
          - constants.LISTING_TERM_DAYS
          - validations[priority=26]
          - validations[priority=31]
          - entities.CertificationListing.fields.expires_on
        distinguishing_aspect: |
          The coverage predicate is STRICT (clock < expires_on), so the instant the clock reaches
          2027-08-01T00:00:00Z exactly, posture drops LISTED -> UNLISTED even though the listing
          row itself is still status LISTED. One second earlier the same model is LISTED enough to
          approve a configuration; at the boundary instant the release of that very configuration
          is rejected with ERR_MODEL_NOT_LISTED (priority 26) rather than the lower-priority
          ERR_MODEL_VERSION_PIN_STALE, and the configuration must remain ENG_APPROVED with a null
