              as: MobilityCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /relocation-cases/${case_id}/authorize"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /relocation-cases/${case_id}/start"
              payload: {}
              as: MobilityCoordinator
            - call: "POST /expense-claims"
              payload: { case_id: "${case_id}", category: MISC, payment_method: REIMBURSEMENT, lines: [{ description: "Supplies", amount_cents: 60000 }] }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /expense-claims/${claim_id}/reject"
              payload: { reject_reason: "receipt missing" }
              as: FinanceSpecialist
          trigger:
            - call: "POST /expense-claims/${claim_id}/resubmit"
              payload: { lines: [{ description: "Supplies (corrected)", amount_cents: 45000 }] }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /relocation-cases/${case_id}"
              as: MobilityCoordinator
              captures: { case_v: $.data.version }
            - call: "POST /expense-claims/${claim_id}/approve"
              payload: { expected_case_version: "${case_v}" }
