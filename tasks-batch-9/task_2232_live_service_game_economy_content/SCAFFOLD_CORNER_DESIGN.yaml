              as: ContentProducer
              captures: { s8_id: $.data.id }
            - call: "POST /seasons/${s8_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p1", region_code: "NA", active_season_id: "${s7_id}" }
              as: LiveOpsCommander
              captures: { p1_id: $.data.id }
            - call: "POST /players/${p1_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { p1_soft_id: $.data.id }
            - call: "POST /players/${p1_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { p1_gem_id: $.data.id }
            - call: "POST /players"
              payload: { handle: "shore_p2", region_code: "EU", active_season_id: "${s8_id}" }
              as: LiveOpsCommander
              captures: { p2_id: $.data.id }
            - call: "POST /players/${p2_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { p2_gem_id: $.data.id }
            - call: "POST /episodes"
              payload: { season_id: "${s7_id}", sequence_no: 1, title: "E7 Tidefall", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 1200 }
              as: ContentProducer
              captures: { ep7_id: $.data.id }
            - call: "POST /episodes/${ep7_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /episodes"
              payload: { season_id: "${s8_id}", sequence_no: 1, title: "E8 Shorebreak", planned_release_at: "2026-08-02T00:00:00Z", xp_grant: 600, soft_currency_grant_minor: 900 }
              as: ContentProducer
              captures: { ep8_id: $.data.id }
            - call: "POST /episodes/${ep8_id}/schedule"
              payload: {}
              as: ContentProducer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /episodes/${ep7_id}/release"
              payload: {}
              as: ContentProducer
            - call: "POST /episodes/${ep8_id}/release"
              payload: {}
              as: ContentProducer
          assert:
            - "Episode.${ep7_id}.grant_batch_size == 1"
            - "CurrencyAccount.${p1_soft_id}.balance_minor == 1200"
            - "CurrencyAccount.${p1_gem_id}.balance_minor == 0"
            - "CurrencyAccount.${p2_gem_id}.balance_minor == 0"
