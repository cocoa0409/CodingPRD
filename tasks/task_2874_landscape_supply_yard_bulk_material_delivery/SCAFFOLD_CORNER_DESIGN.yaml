              as: YardAdmin
            - call: "POST /inventory-lots"
              payload: { material_id: "${mat_id}", gross_cubic_yards: 200.0, moisture_pct_at_intake: 15.0 }
              as: YardAdmin
            - call: "POST /contractor-accounts"
              payload: { business_name: "Tiebreak Grounds", credit_limit_cents: 9000000, po_required: false, driveway_protection_required: false }
              as: YardAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /material-orders"
