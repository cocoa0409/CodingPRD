        grounds: [state_machines.PlacementRequest, state_machines.PortableUnit, entities.School.hosted_portable_seats]
        excluded_because:
          difficulty_instance: transitive_cascade / permit_join_cascade_to_pad_occupation
          rationale: "That instance walks the four-level chain from the last permit approval through request, unit, pad and appropriation, and its sibling walks the unsafe-condition cascade back out again from a different trigger."

      - name: both_calculation_variants_and_the_delta_on_switching
        claim_type: dual_variant_calculation
        grounds: [calculations.program_capacity_seats.variants, calculations.unit_salvage_value.variants, calculations.alternative_cost_comparison.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / capacity_variant_state_loading_vs_district_policy
          rationale: "The three rule-1 instances each run both arms of a different dual-variant calculation over one fixture and assert the divergence."

      - name: server_side_selector_policy_is_deterministic
        claim_type: selector_policy
        grounds: [calculations.eligible_unit_selection, "endpoints[POST /facilities/placement-requests/{id}/auto-assign-unit]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / empty_eligible_unit_pool_at_auto_assign
          rationale: "That instance pins the filter set, the empty-pool error and the accumulated-cost-then-grade-then-created_at ranking of the surviving candidates."

      - name: derived_seat_and_money_fields_reconcile_after_every_write
        claim_type: derived_field_reconciliation
        grounds: [entities.School.hosted_portable_seats, entities.CapitalBudget.uncommitted_cents, calculations.budget_partition]
        excluded_because:
          difficulty_instance: compensating_invariant / hosted_seat_ledger_restored_on_decommission
          rationale: "That instance reconciles the campus seat ledger, the reliance flag and the appropriation partition across install and decommission, and its sibling does the same across encumbrance and withdrawal."

  # =========================================================================
  # SECTION 9 - consistency model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: every_cascade_is_visible_in_the_same_request
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.PlacementRequest]
        excluded_because:
          difficulty_instance: transitive_cascade / permit_join_cascade_to_pad_occupation
          rationale: "That instance reads the request, unit, pad, campus and appropriation immediately after the triggering call with no delay or retry, which is exactly the immediate-consistency claim; the compensating-invariant instances repeat it for the reversing direction."
