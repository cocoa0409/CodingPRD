        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=9]", "errors[ERR_STALE_ENTITY_VERSION]"]
        distinguishing_aspect: "A risk-assessment create that is BOTH stale-versioned and a same-year duplicate returns the OCC error ERR_STALE_ENTITY_VERSION (priority 6) ahead of ERR_RISK_ASSESSMENT_DRAFT_EXISTS (priority 9)."
