          trigger:
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T08:00:00Z", scheduled_end_at: "2026-08-11T12:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner, captures: { run_v2: $.data.version, rd_pin: $.data.label_version_pinned, r_status: $.data.production_status } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T13:00:00Z", scheduled_end_at: "2026-08-11T17:00:00Z", expected_production_run_version: "${run_v}" }, as: ProductionPlanner, captures: { err_stale: $.data.error_id } }
            - { call: "POST /v1/production-runs/${run_id}/schedule", payload: { batch_id: "${batch_id}", line_id: "${line_id}", scheduled_start_at: "2026-08-11T13:00:00Z", scheduled_end_at: "2026-08-11T17:00:00Z", expected_production_run_version: "${run_v2}" }, as: ProductionPlanner, captures: { err_state: $.data.error_id } }
          assert:
            - "r_status == SCHEDULED and run_v2 == ${run_v} + 1 (schedule bumps the version)"
            - "rd_pin == 1 (label_version_pinned captured from formula at schedule time — version pinning on approval)"
            - "err_stale == ERR_STALE_VERSION, HTTP 412 (stale expected_production_run_version)"
            - "err_state == ERR_RUN_STATE_INVALID, HTTP 409 (current version passes OCC; SCHEDULED is not a schedulable state)"

      - name: occ_order_allocate_stale
