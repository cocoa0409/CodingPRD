scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: liability_cap_montreal_vs_domestic_weight
        grounds:
          - calculations.liability_cap
          - entities.IrregularityReport.fields.effective_cap_cents
          - entities.IrregularityReport.fields.liability_regime
        distinguishing_aspect: |
          Liability-cap variant lives on the IrregularityReport/settlement domain: an identical
          contents loss of 100000 cents yields settlement_offer_cents 100000 under the MONTREAL
          flat cap (170016) but 50000 under the DOMESTIC weight-based cap (20kg x 2500).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carriers AA/BA; STANDARD passenger"
            - "Two bags, both 20kg, declared 0: bag_intl (is_international=true), bag_dom (false)"
            - "Two DELAYED reports, both swept to DECLARED_LOST at +504h, both assessed with contents_loss_cents=100000, both in SETTLEMENT_OFFERED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "BA", name: "Air Beta", is_interline_partner: true }, as: SystemAdmin, captures: { car_ba: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234501", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}", "${car_ba}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_intl: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234502", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_dom: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00001", passenger_id: "${pax}", bag_tag_id: "${bag_intl}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_intl: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00002", passenger_id: "${pax}", bag_tag_id: "${bag_dom}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_dom: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/reports/${rpt_intl}/assess-loss", payload: { contents_loss_cents: 100000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt_dom}/assess-loss", payload: { contents_loss_cents: 100000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt_intl}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt_dom}/offer-settlement", payload: { root_cause: "MISCONNECT", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
          trigger:
            - { call: "GET /baggage/reports/${rpt_intl}", as: ClaimsAdjuster }
            - { call: "GET /baggage/reports/${rpt_dom}", as: ClaimsAdjuster }
          assert:
            - "IrregularityReport.${rpt_intl}.liability_regime == MONTREAL"
            - "IrregularityReport.${rpt_intl}.effective_cap_cents == 170016"
            - "IrregularityReport.${rpt_intl}.settlement_offer_cents == 100000"
            - "IrregularityReport.${rpt_dom}.liability_regime == DOMESTIC"
            - "IrregularityReport.${rpt_dom}.effective_cap_cents == 50000"
            - "IrregularityReport.${rpt_dom}.settlement_offer_cents == 50000"

      - name: expense_reimbursement_perday_vs_pooled
        grounds:
          - calculations.expense_reimbursement
          - entities.ExpenseClaim.fields.reimbursable_total_cents
        distinguishing_aspect: |
          Expense-reimbursement variant lives on the ExpenseClaim domain (different entity domain
          than the liability-cap instance): identical USD receipts (20000 on day 1, 3000 on day 2,
          STANDARD tier) yield 10500 under the DOMESTIC per-day cap (7500+3000) but 23000 under
          the MONTREAL pooled cap.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; STANDARD passenger"
            - "bag_dom (domestic) and bag_intl (international), each with a DELAYED report in TRACING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234511", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_dom: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234512", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag_intl: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00011", passenger_id: "${pax}", bag_tag_id: "${bag_dom}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_dom: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00012", passenger_id: "${pax}", bag_tag_id: "${bag_intl}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt_intl: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt_dom}", receipts: [{ incurred_on: "2026-08-02", description: "toiletries", amount_minor: 20000, currency_code: "USD" }, { incurred_on: "2026-08-03", description: "shirt", amount_minor: 3000, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm_dom: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt_intl}", receipts: [{ incurred_on: "2026-08-02", description: "toiletries", amount_minor: 20000, currency_code: "USD" }, { incurred_on: "2026-08-03", description: "shirt", amount_minor: 3000, currency_code: "USD" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm_intl: $.data.id } }
          trigger:
            - { call: "POST /baggage/expense-claims/${clm_dom}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
            - { call: "POST /baggage/expense-claims/${clm_intl}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
          assert:
            - "ExpenseClaim.${clm_dom}.reimbursable_total_cents == 10500"
            - "ExpenseClaim.${clm_intl}.reimbursable_total_cents == 23000"
            - "ExpenseClaim.${clm_dom}.status == APPROVED"
            - "ExpenseClaim.${clm_intl}.status == APPROVED"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_offer_nested_min_max_branch
        grounds:
          - calculations.settlement_offer
          - calculations.depreciation_and_repair_decision
          - state_machines.IrregularityReport.CLAIM_REVIEW_to_SETTLEMENT_OFFERED
        distinguishing_aspect: |
          Mode (a): the offer formula combines >= 3 inputs (repair_payout_cents from the repair
          branch, contents_damage_cents, effective_cap_cents from weight/regime/declared value)
          through a conditional branch on claim path and nested min/max; here loss_basis is
          40000+15000=55000 but the DOMESTIC 20kg cap binds at 50000.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; passenger; domestic 20kg bag declared 0"
            - "DAMAGED report assessed repairable with contents_damage_cents=15000"
            - "Repair order: purchase 100000 on 2024-08-01, intake 2026-08-05, estimate 40000 -> depreciated 64000, decision REPAIR, payout 40000; report in CLAIM_REVIEW"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/repair-vendors", payload: { name: "FixIt", bench_capacity: 2 }, as: SystemAdmin, captures: { vnd: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234521", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00021", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/assess-damage", payload: { repairable: true, contents_damage_cents: 15000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/repair-orders", payload: { report_id: "${rpt}", vendor_id: "${vnd}", intake_date: "2026-08-05", promised_date: "2026-08-12", purchase_price_cents: 100000, purchase_date: "2024-08-01", repair_estimate_cents: 40000 }, as: ClaimsAdjuster, captures: { ro: $.data.id } }
            - { call: "POST /baggage/repair-orders/${ro}/decide", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /baggage/repair-orders/${ro}/complete", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "LOADING_ERROR", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
          assert:
            - "RepairOrder.${ro}.decision == REPAIR"
            - "RepairOrder.${ro}.depreciated_value_cents == 64000"
            - "RepairOrder.${ro}.payout_cents == 40000"
            - "IrregularityReport.${rpt}.settlement_offer_cents == 50000"
            - "IrregularityReport.${rpt}.effective_cap_cents == 50000"
            - "IrregularityReport.${rpt}.amount_payable_cents == 50000"

      - name: expense_fx_round_per_receipt_then_sum
        grounds:
          - calculations.expense_reimbursement
          - entities.ExpenseClaim.fields.claimed_total_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order — each EUR receipt is converted with round_half_up to
          whole cents BEFORE summing; two 95-cent EUR receipts yield 105+105=210, whereas the
          forbidden sum-then-round order would yield 209.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; passenger; international bag"
            - "DELAYED report in TRACING; one expense claim with two EUR receipts of 95 minor units each"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234522", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: true, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00022", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/expense-claims", payload: { report_id: "${rpt}", receipts: [{ incurred_on: "2026-08-02", description: "adapter", amount_minor: 95, currency_code: "EUR" }, { incurred_on: "2026-08-03", description: "snacks", amount_minor: 95, currency_code: "EUR" }] }, as: Passenger, as_user_id: "${pax}", captures: { clm: $.data.id } }
          trigger:
            - { call: "POST /baggage/expense-claims/${clm}/adjudicate", payload: { decision: "APPROVE" }, as: ClaimsAdjuster }
          assert:
            - "ExpenseClaim.${clm}.reimbursable_total_cents == 210"
            - "ExpenseClaim.${clm}.claimed_total_cents == 210"
            - "ExpenseClaim.${clm}.eligible_receipt_count == 2"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_settlement_reject_reoffer_cycle
        grounds:
          - state_machines.IrregularityReport.SETTLEMENT_OFFERED_to_CLAIM_REVIEW
          - state_machines.IrregularityReport.CLAIM_REVIEW_to_SETTLEMENT_OFFERED
        distinguishing_aspect: |
          IrregularityReport has a negotiation cycle: SETTLEMENT_OFFERED -> CLAIM_REVIEW on
          passenger reject, and CLAIM_REVIEW -> SETTLEMENT_OFFERED can run again, producing a
          fresh identical offer of 5000 (contents_damage only, no repair payout).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; passenger; domestic 20kg bag declared 0"
            - "DAMAGED report assessed non-repairable with contents_damage_cents=5000; report in SETTLEMENT_OFFERED with offer 5000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234531", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00031", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DAMAGED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/assess-damage", payload: { repairable: false, contents_damage_cents: 5000 }, as: ClaimsAdjuster }
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "LOADING_ERROR", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/reject-settlement", payload: {}, as: Passenger, as_user_id: "${pax}" }
            - { call: "POST /baggage/reports/${rpt}/offer-settlement", payload: { root_cause: "LOADING_ERROR", root_cause_station_id: "${stn}" }, as: ClaimsAdjuster }
          assert:
            - "After reject: IrregularityReport.${rpt}.status == CLAIM_REVIEW"
            - "After reject: IrregularityReport.${rpt}.amount_payable_cents == 0"
            - "After re-offer: IrregularityReport.${rpt}.status == SETTLEMENT_OFFERED"
            - "After re-offer: IrregularityReport.${rpt}.settlement_offer_cents == 5000"

      - name: dispatch_failure_reschedule_cycle
        grounds:
          - state_machines.DeliveryDispatch.DISPATCHED_to_FAILED_ATTEMPT
          - state_machines.DeliveryDispatch.FAILED_ATTEMPT_to_DISPATCHED
        distinguishing_aspect: |
          DeliveryDispatch (different entity than IrregularityReport) has a retry cycle:
          DISPATCHED -> FAILED_ATTEMPT -> DISPATCHED via reschedule, with attempt_count
          incrementing from 1 to 2 across the loop.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK served by courier (buffer 60); DELAYED report with a LOCATED event -> FOUND_PENDING_DELIVERY"
            - "Dispatch created with pickup 2026-08-02T10:00:00Z, then marked failed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/courier-services", payload: { name: "Speedy", serves_station_ids: ["${stn}"], turnaround_buffer_minutes: 60 }, as: SystemAdmin, captures: { crr: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234532", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00032", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
            - { call: "POST /baggage/reports/${rpt}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "LOCATED" }, as: BaggageServiceAgent }
            - { call: "POST /baggage/dispatches", payload: { report_id: "${rpt}", courier_service_id: "${crr}", pickup_at: "2026-08-02T10:00:00Z", travel_minutes: 120, delivery_address: "1 Main St" }, as: BaggageServiceAgent, captures: { dsp: $.data.id } }
            - { call: "POST /baggage/dispatches/${dsp}/mark-failed", payload: {}, as: BaggageServiceAgent }
          trigger:
            - { call: "POST /baggage/dispatches/${dsp}/reschedule", payload: { new_pickup_at: "2026-08-03T10:00:00Z" }, as: BaggageServiceAgent }
          assert:
            - "DeliveryDispatch.${dsp}.status == DISPATCHED"
            - "DeliveryDispatch.${dsp}.attempt_count == 2"
            - "DeliveryDispatch.${dsp}.pickup_at == 2026-08-03T10:00:00Z"
            - "IrregularityReport.${rpt}.status == DELIVERY_IN_PROGRESS"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, one depth >= 3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: located_event_three_hop_cascade
        grounds:
          - state_machines.IrregularityReport.TRACING_to_FOUND_PENDING_DELIVERY
          - state_machines.BagTag.MISHANDLED_to_IN_RECOVERY
          - entities.Station.fields.recovered_bag_count
        distinguishing_aspect: |
          Depth-3 cascade from POST tracing-events with event_type=LOCATED: the event creation
          flips the report TRACING->FOUND_PENDING_DELIVERY; that report mutation flips the bag
          MISHANDLED->IN_RECOVERY; and the LOCATED event recorded against the station increments
          Station.recovered_bag_count. Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK; carrier AA; passenger; domestic bag CHECKED"
            - "DELAYED report in TRACING; bag MISHANDLED; station.recovered_bag_count == 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /baggage/stations", payload: { station_code: "JFK", name: "New York JFK", bags_handled_total: 1000000 }, as: SystemAdmin, captures: { stn: $.data.id } }
            - { call: "POST /baggage/carriers", payload: { carrier_code: "AA", name: "Air Alpha", is_interline_partner: false }, as: SystemAdmin, captures: { car_aa: $.data.id } }
            - { call: "POST /baggage/passengers", payload: { full_name: "Pat Flyer", email: "pat@x.com", tier: "STANDARD" }, as: BaggageServiceAgent, captures: { pax: $.data.id } }
            - { call: "POST /baggage/bag-tags", payload: { tag_number: "0001234541", passenger_id: "${pax}", routing_carrier_ids: ["${car_aa}"], is_international: false, weight_kg: 20, declared_value_cents: 0 }, as: BaggageServiceAgent, captures: { bag: $.data.id } }
            - { call: "POST /baggage/reports", payload: { report_reference: "JFKAA00041", passenger_id: "${pax}", bag_tag_id: "${bag}", station_id: "${stn}", type: "DELAYED" }, as: BaggageServiceAgent, captures: { rpt: $.data.id } }
          trigger:
            - { call: "POST /baggage/reports/${rpt}/tracing-events", payload: { carrier_id: "${car_aa}", station_id: "${stn}", event_type: "LOCATED" }, as: BaggageServiceAgent, captures: { evt: $.data.id } }
          assert:
            - "IrregularityReport.${rpt}.status == FOUND_PENDING_DELIVERY"
            - "BagTag.${bag}.status == IN_RECOVERY"
            - "Station.${stn}.recovered_bag_count == 1"
            - "TracingEvent.${evt} exists with event_type == LOCATED"

      - name: delivery_mark_delivered_two_hop_cascade
        grounds:
          - state_machines.IrregularityReport.DELIVERY_IN_PROGRESS_to_DELIVERED
          - state_machines.DeliveryDispatch.DISPATCHED_to_DELIVERED
          - state_machines.BagTag.IN_RECOVERY_to_DELIVERED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST dispatches/{id}/mark-delivered, not a
          tracing event): the dispatch transition flips the report DELIVERY_IN_PROGRESS->DELIVERED,
          and that report mutation flips the bag IN_RECOVERY->DELIVERED and stamps delivered_on
          (closing the expense eligibility window).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; station JFK served by courier; DELAYED report in DELIVERY_IN_PROGRESS with a DISPATCHED dispatch; bag IN_RECOVERY"
          setup_api_calls:
