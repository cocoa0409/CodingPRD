            - { call: "GET /grants/${gA}", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { gA_avail: $.data.budget_available_cents, gA_status: $.data.status } }
            - { call: "POST /bookings/${bB2}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { err: $.data.error_id } }
          assert:
            - "UsageLog.${ulA}.usage_charge_cents == 15000; validation succeeds at exact fit (15000 <= 15000)"
            - "Grant.${gA}.budget_available_cents == 0 and status == EXHAUSTED (<= 0 boundary includes exactly 0)"
            - "Approving ${bB2} (estimate 6000) against grantB's 1000 remaining yields error_id == ERR_GRANT_BUDGET_EXCEEDED with HTTP 422"
            - "Booking.${bB2} remains REQUESTED after the failed approval"

      - name: rate_cap_exact_boundary_at_submit
        grounds:
          - calculations.derived_rate_computation
          - validations[priority=36]
        distinguishing_aspect: |
          Metric = rate ratio on POST /rate-sets/{id}/submit: a line at exactly
          110% of the prior fiscal year's EFFECTIVE internal rate (13200 vs
          12000) is accepted (<= cap); 13201 — one cent over — is rejected with
          ERR_RATE_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Canonical stack WITHOUT grant/booking; FY2026 rate set EFFECTIVE (internal 12000); FY2027 period OPEN; DRAFT rs27a with internal 13200; DRAFT rs27b with internal 13201"
          setup_api_calls:
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2027 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2027, effective_from: "2027-01-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 13200, external_rate_cents_per_hour: 19000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs27a: $.data.id } }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2027, effective_from: "2027-01-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 13201, external_rate_cents_per_hour: 19000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs27b: $.data.id } }
          trigger:
            - { call: "POST /rate-sets/${rs27a}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1", captures: { stA: $.data.status } }
            - { call: "POST /rate-sets/${rs27b}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "RateSet.${rs27a}.status == UNDER_REVIEW (13200 == 12000 x 1.10 exactly: allowed, <= semantics)"
            - "Submitting ${rs27b} (13201) yields error_id == ERR_RATE_CAP_EXCEEDED with HTTP 422 and the set stays DRAFT"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_approval_gated_by_training_state
        grounds:
          - state_machines.Booking.REQUESTED_to_APPROVED
          - state_machines.TrainingRecord.CERTIFIED_to_REVOKED
          - validations[priority=12]
        distinguishing_aspect: |
          Pair Booking -> TrainingRecord: approval of the same REQUESTED booking
          fails with ERR_TRAINING_REQUIRED while the (user, instrument) record
          is REVOKED, and succeeds after a fresh record is certified — the
          booking's valid transitions depend on a different entity's state.
        test_recipe:
          setup:
