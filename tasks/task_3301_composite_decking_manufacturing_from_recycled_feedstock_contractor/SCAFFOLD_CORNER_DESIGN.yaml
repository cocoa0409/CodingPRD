              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "L1", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line1: $.data.id }
            - call: "POST /decking/product-lines"
              payload: { name: "L2", color: "Brown", capped: false, profile: "SQUARE", emboss: "SMOOTH", board_length_ft: 12, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line2: $.data.id }
            - call: "POST /decking/stocking-commitments"
              payload: { dealer_id: "${dealer_id}", territory_code: "VA-N", product_line_id: "${line1}", committed_lf: 100, season_year: 2026 }
              as: ChannelManager
          trigger:
            - call: "POST /decking/stocking-commitments"
              payload: { dealer_id: "${dealer_id}", territory_code: "VA-N", product_line_id: "${line2}", committed_lf: 50, season_year: 2026 }
              as: ChannelManager
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_DUPLICATE_COMMITMENT"

      - name: close_season_before_year_end_rejected
        claim_type: Violation → Error
        grounds:
          - state_machines.StockingCommitment.OPEN_to_SHORTFALL_PENALIZED
