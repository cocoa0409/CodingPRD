# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2623 - Brand Safety & Ad Verification Operations
#
# Every instance grounds in SCAFFOLD.yaml sections 1.1-1.7 only. All numeric
# assertions were produced by executing the referenced calculations[].formula
# with its declared constants (Decimal, ROUND_HALF_UP) and are written as
# literals. The logical clock starts at the mandated default
# 2026-08-01T00:00:00Z and every instance moves it explicitly.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: suitability_tier_prebid_rollup_vs_postbid_page_level
        grounds:
          - calculations.page_suitability_tier
          - calculations.pre_bid_placement_decision
          - entities.Page.fields.current_tier
          - entities.MeasurementBatch.fields.assessed_tier
          - state_machines.Page.MODEL_CLASSIFIED_to_HUMAN_CONFIRMED
        distinguishing_aspect: |
          The two variants operate on the brand-suitability domain (Page /
          Publisher classification): for the SAME page with the SAME stored
          classification, variant pre_bid_domain_rollup returns HIGH_RISK
          (worst human-confirmed sibling page of the publisher inside the
          30-day window, model-only records ignored) while variant
          post_bid_page_level returns MEDIUM_RISK (the page's own effective
          record, model-only accepted), so the pre-bid call BLOCKS the same
          inventory the post-bid record marks compliant.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "Publisher 'Beacon Digital' with sourced_traffic_pct 0.40; page A (/arms-review) HUMAN_CONFIRMED at HIGH_RISK; page B (/casino-odds) MODEL_CLASSIFIED at MEDIUM_RISK."
            - "Campaign 'Q3 Display' (DISPLAY, cpm_cents 875, min_suitability_tier MEDIUM_RISK)."
            - "A PUBLISHED exclusion list whose only entry (DOMAIN other.example.com) does not match page B, pinned by a SYNCED pre-bid segment with suitability_floor_tier MEDIUM_RISK, so pre-bid gate 2 finds no candidate and falls through to the tier gate."
            - "One INGESTED measurement batch on page B: measured 10000, measurable 8000, in_view 6000, avg_in_view_seconds 1.2, avg_in_view_pixel_pct 0.6."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/arms-review" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_a_id: $.data.id, page_a_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_a_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_a_ver}", classifier_kind: "HUMAN", category_codes: ["ARMS"], ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_a_id: $.data.id }
            - call: "POST /page-classifications/${cls_a_id}/review"
              payload: { decision: "CONFIRM", review_note: "Weapons editorial confirmed" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/casino-odds" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_b_id: $.data.id, page_b_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_b_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_b_ver}", classifier_kind: "MODEL", category_codes: ["GAMBLING"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_b_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Q3 blocks" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { excl_list_id: $.data.id }
            - call: "POST /inventory-lists/${excl_list_id}/entries"
              payload: { entry_type: "DOMAIN", entry_value: "other.example.com" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists/${excl_list_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", exclusion_list_id: "${excl_list_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { seg_id: $.data.id }
            - call: "POST /pre-bid-segments/${seg_id}/sync"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_b_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 8000, in_view_impressions: 6000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_b_id: $.data.id }
          trigger:
            - call: "GET /pages/${page_b_id}/pre-bid-decision"
              payload: { segment_id: "${seg_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /measurement-batches/${batch_b_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
          assert:
            - "PageClassification.${cls_b_id}.base_risk_points == 15.00 and adjusted_risk_points == 15.00 and assigned_tier == MEDIUM_RISK and mfa_score == 13.50 and mfa_flag == false"
            - "PageClassification.${cls_a_id}.adjusted_risk_points == 40.00 and assigned_tier == HIGH_RISK"
            - "Page.${page_b_id}.current_tier == MEDIUM_RISK and classification_state == MODEL_CLASSIFIED"
            - "GET /pages/${page_b_id}/pre-bid-decision response effective_tier == HIGH_RISK"
            - "GET /pages/${page_b_id}/pre-bid-decision response decision == BLOCK and reason_code == BELOW_SUITABILITY_FLOOR and decisive_entry_id == null"
            - "MeasurementBatch.${batch_b_id}.assessed_tier == MEDIUM_RISK"
            - "MeasurementBatch.${batch_b_id}.suitability_breach_flag == false"
            - "The two variants disagree on the same page: pre-bid effective_tier HIGH_RISK vs post-bid assessed_tier MEDIUM_RISK"

      - name: claim_impression_basis_gross_at_intake_vs_net_at_approval
        grounds:
          - calculations.claim_impression_basis
          - calculations.claim_gross_credit_cents
          - calculations.claim_net_credit_cents
          - entities.RefundClaim.fields.claimed_impressions
          - entities.RefundClaim.fields.credited_impressions
          - state_machines.RefundClaim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The second dual-variant pair sits in a different entity domain -
          money and impression accounting on RefundClaim / MeasurementBatch,
          not suitability scoring on Page: for one identical quarantined batch
          the gross_impression_basis credits all 10000 measured impressions
          (provisional_credit_cents 8750) while net_measured_basis credits only
          the 6400 demonstrably defective impressions (gross_credit_cents
          5600), a 3600-impression delta that the approval freezes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z; advertiser credit_cap_cents 1000000."
            - "Campaign cpm_cents 875, min_suitability_tier MEDIUM_RISK, format DISPLAY; page C classified GENERAL so its tier is SAFE and no suitability breach occurs."
            - "One batch: measured 10000, measurable 6000, in_view 5000, avg_in_view_seconds 0.8 (below the 1.0s DISPLAY threshold, so qualified_in_view becomes 0), plus one CONFIRMED DATACENTER finding of 400 impressions; coverage_rate 0.6000 < floor 0.70, so certify lands in QUARANTINED and the batch becomes claimable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/recipes" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_c_id: $.data.id, page_c_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_c_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_c_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_c_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_c_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 6000, in_view_impressions: 5000, avg_in_view_seconds: 0.8, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_c_id: $.data.id }
            - call: "POST /ivt-findings"
              payload: { batch_id: "${batch_c_id}", ivt_class: "DATACENTER", flagged_impressions: 400, confidence: 0.90, detector_note: "AWS ranges" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { find_dc_id: $.data.id }
            - call: "POST /ivt-findings/${find_dc_id}/confirm"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches/${batch_c_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches/${batch_c_id}/certify"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_ver: $.data.version }
          trigger:
            - call: "POST /refund-claims"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", batch_ids: ["${batch_c_id}"], expected_campaign_version: "${camp_ver}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /refund-claims/${claim_id}/review"
              payload: {}
              as: DisputeOfficer
              as_user_id: "officer-1"
            - call: "POST /refund-claims/${claim_id}/approve"
              payload: { decision_note: "Coverage and datacenter traffic substantiated" }
              as: DisputeOfficer
              as_user_id: "officer-1"
          assert:
            - "MeasurementBatch.${batch_c_id}.coverage_rate == 0.6 and qualified_in_view_impressions == 0 and ivt_impressions == 400 and ivt_rate == 0.04 and scoring_status == QUARANTINED"
            - "RefundClaim.${claim_id}.claimed_impressions == 10000 immediately after creation (gross_impression_basis)"
            - "RefundClaim.${claim_id}.provisional_credit_cents == 8750 immediately after creation"
            - "RefundClaim.${claim_id}.credited_impressions == 6400 after approval (net_measured_basis)"
            - "RefundClaim.${claim_id}.gross_credit_cents == 5600 and admin_fee_rate == 0.15 and admin_fee_cents == 840 and net_credit_cents == 4760"
            - "RefundClaim.${claim_id}.credited_impressions != RefundClaim.${claim_id}.claimed_impressions; the delta is exactly 3600 unmeasurable impressions"
            - "Advertiser.${adv_id}.credit_received_cents_total == 4760 and Publisher.${pub_id}.credit_issued_cents_total == 4760"

  - rule_id: combinatorial_formula
    instances:

      - name: gross_credit_rounds_per_batch_before_summing
        grounds:
          - calculations.claim_gross_credit_cents
          - calculations.claim_impression_basis
          - calculations.viewability_and_coverage
          - entities.RefundClaim.fields.gross_credit_cents
        distinguishing_aspect: |
          Mode (b) - rounding order pinned. The claim cites two batches whose
          per-batch creditable impressions are 1501 and 2503 at cpm_cents 875.
          Rounding each batch first yields 1313 + 2190 = 3503 cents; summing the
          creditable impressions first (4004) and rounding once yields 3503.5 ->
          3504 cents. The one-cent gap only appears because both per-batch
          products land on a .x75 / .x25 fraction, so an implementation that
          aggregates before rounding is detected by a single assertion.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z; campaign cpm_cents 875, format DISPLAY, min_suitability_tier MEDIUM_RISK."
            - "Page classified GENERAL (SAFE) so no suitability breach inflates the basis."
            - "Batch 1: measured 3000, measurable 1501, in_view 1501, avg_in_view_seconds 0.5 -> qualified_in_view 0, coverage_rate 0.5003, creditable 1501."
            - "Batch 2 (window separated by an hour to clear the 60s buffer): measured 5000, measurable 2503, in_view 2503, avg_in_view_seconds 0.5 -> coverage_rate 0.5006, creditable 2503."
            - "Both batches certify into QUARANTINED (coverage below the 0.70 floor) and are therefore claimable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/recipes" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 3000, measurable_impressions: 1501, in_view_impressions: 1501, avg_in_view_seconds: 0.5, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch1_id: $.data.id }
            - call: "POST /measurement-batches/${batch1_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches/${batch1_id}/certify"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T02:00:00Z", window_end: "2026-08-01T03:00:00Z", measured_impressions: 5000, measurable_impressions: 2503, in_view_impressions: 2503, avg_in_view_seconds: 0.5, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch2_id: $.data.id }
            - call: "POST /measurement-batches/${batch2_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches/${batch2_id}/certify"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_ver: $.data.version }
            - call: "POST /refund-claims"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", batch_ids: ["${batch1_id}", "${batch2_id}"], expected_campaign_version: "${camp_ver}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { claim_id: $.data.id }
