scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: outstanding_balance_provisional_vs_finalized
        grounds:
          - calculations.outstanding_balance
          - entities.Subscription.fields.outstanding_balance_cents
          - state_machines.Subscription.PENDING_PAYMENT_to_CONFIRMED
        distinguishing_aspect: |
          On the Subscription/LedgerEntry domain, the provisional variant (PENDING_PAYMENT, before
          CHARGE_SEASON exists) yields outstanding_balance_cents == 9600 (add-on only), while the
          finalized variant (CONFIRMED, after CHARGE_SEASON of 50000) yields 59600 for identical add-on state.
        test_recipe:
          setup:
            - "OPEN season, MEDIUM share base_price 50000, BASELINE member, PICKUP site cap 100, season cap 100"
            - "A PENDING_PAYMENT subscription with one ATTACHED add-on (weekly_price 800 × 12 weeks = 9600 charged)"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S1", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-06-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
              captures: { season_id: $.data.id }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: $.data.id }
            - call: "POST /add-ons"
              payload: { season_id: "${season_id}", kind: "EGGS", weekly_price_cents: 800, weekly_supply_cap: 50 }
              as: FarmManager
              captures: { addon_id: $.data.id }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscription-add-ons"
              payload: { subscription_id: "${sub_id}", add_on_id: "${addon_id}" }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "GET /subscriptions/${sub_id}"
              as: FarmManager
              captures: { provisional_balance: $.data.outstanding_balance_cents, sea_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
          assert:
            - "Subscription.${sub_id}.outstanding_balance_cents == 9600 before confirm (provisional variant)"
            - "Subscription.${sub_id}.outstanding_balance_cents == 59600 after confirm (finalized variant: 50000 + 9600)"

      - name: hold_refund_value_early_vs_late_week
        grounds:
          - calculations.hold_refund_value
          - entities.VacationHold.fields.mode
          - state_machines.WeeklyBox.SCHEDULED_to_HELD
        distinguishing_aspect: |
          On the VacationHold/WeeklyBox domain, holding week_index 1 refunds 4167 cents (early_week_extra_cent variant)
          while holding week_index 12 refunds 4166 cents (late_week_floor variant) for the SAME season_price 50000
          over 12 weeks — the +1 remainder cent distinguishes the two valid per-week allocations.
        test_recipe:
          setup:
            - "OPEN season week_count 12, MEDIUM share base 50000, BASELINE member; subscription CONFIRMED so season_price_cents == 50000 and 12 SCHEDULED boxes exist"
            - "Clock at 2026-06-15 — before any delivery date"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S2", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-06-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
              captures: { season_id: $.data.id }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: $.data.id }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
            - call: "GET /subscriptions/${sub_id}/weekly-boxes"
              as: Member
              as_user_id: "${member_id}"
              captures: { box_w1_id: "$.data[0].id", box_w12_id: "$.data[11].id" }
          trigger:
            - call: "POST /vacation-holds"
              payload: { subscription_id: "${sub_id}", held_box_id: "${box_w1_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { hold1_id: $.data.id }
            - call: "POST /vacation-holds"
              payload: { subscription_id: "${sub_id}", held_box_id: "${box_w12_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { hold12_id: $.data.id }
          assert:
            - "LedgerEntry CREDIT_HOLD_REFUND for week 1 has amount_cents == -4167 (early_week_extra_cent)"
            - "LedgerEntry CREDIT_HOLD_REFUND for week 12 has amount_cents == -4166 (late_week_floor)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: workshare_credit_straddles_daily_cap_mode_a
        grounds:
          - calculations.workshare_credit
          - entities.WorkShareShift.fields.credit_earned_cents
          - state_machines.WorkShareShift.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Mode (a) non-linear ≥3-input formula: creditable_hours = max(0, min(hours, CAP - prior_same_date_hours))
          nests min/max over the shift's hours, the 6h daily cap, and accumulated prior same-date completed hours —
          a 4h-then-3h same-date pair credits 6000 then 3000 (only 2h of the second shift fit under the cap).
        test_recipe:
          setup:
            - "OPEN season, working-share subscription; member has two SCHEDULED shifts dated 2026-08-01: 4h (earlier created_at) and 3h"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S3", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-06-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
              captures: { season_id: $.data.id }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "SMALL", base_price_cents: 30000, items_per_box: 5 }
              as: FarmManager
              captures: { share_id: $.data.id }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /members"
              payload: { email: "m3@x.com", full_name: "M Three", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}", working_share_opt_in: true }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/work-share-shifts"
              payload: { scheduled_date: "2026-08-01T09:00:00Z", hours: 4 }
              as: Member
              as_user_id: "${member_id}"
              captures: { shift_a_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/work-share-shifts"
              payload: { scheduled_date: "2026-08-01T13:00:00Z", hours: 3 }
              as: Member
              as_user_id: "${member_id}"
              captures: { shift_b_id: $.data.id }
          trigger:
            - call: "POST /work-share-shifts/${shift_a_id}/complete"
              payload: {}
              as: FarmManager
            - call: "POST /work-share-shifts/${shift_b_id}/complete"
              payload: {}
              as: FarmManager
          assert:
            - "WorkShareShift.${shift_a_id}.credit_earned_cents == 6000"
            - "WorkShareShift.${shift_b_id}.credit_earned_cents == 3000"
            - "Member.${member_id}.wallet_credit_cents == 9000"

      - name: outstanding_balance_pinned_eval_order_mode_c
        grounds:
          - calculations.outstanding_balance
          - entities.Subscription.fields.outstanding_balance_cents
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: wallet_applied = min(wallet, max(net_after_refunds, 0))
          and outstanding = max(net − wallet_applied − payments, 0); wallet credit is capped by the POST-credit gross (net),
          not by the final balance, so the otherwise-circular wallet↔balance reference is well-defined. With season 50000,
          a 6000 wallet credit, and a 4167 hold refund: net = 50000 − 4167 = 45833, wallet_applied = min(6000, 45833) = 6000,
          outstanding = 45833 − 6000 = 39833.
        test_recipe:
          setup:
            - "CONFIRMED BASELINE working-share subscription (season_price 50000); a 4h work-share shift completed (wallet 6000); clock 2026-06-15, all boxes SCHEDULED; a REFUND hold placed on box week 2 (refund 4167)"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S4", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-06-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
              captures: { season_id: $.data.id }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: $.data.id }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m4@x.com", full_name: "M Four", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}", working_share_opt_in: true }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
            - call: "POST /subscriptions/${sub_id}/work-share-shifts"
              payload: { scheduled_date: "2026-08-05T09:00:00Z", hours: 4 }
              as: Member
              as_user_id: "${member_id}"
              captures: { shift_id: $.data.id }
            - call: "POST /work-share-shifts/${shift_id}/complete"
              payload: {}
              as: FarmManager
            - call: "GET /subscriptions/${sub_id}/weekly-boxes"
              as: Member
              as_user_id: "${member_id}"
              captures: { box_w2_id: "$.data[1].id" }
          trigger:
            - call: "POST /vacation-holds"
              payload: { subscription_id: "${sub_id}", held_box_id: "${box_w2_id}" }
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "LedgerEntry CREDIT_HOLD_REFUND for week 2 has amount_cents == -4167 (week_index 2 <= remainder 8)"
            - "Subscription.${sub_id}.outstanding_balance_cents == 39833 (net 45833 − wallet_applied 6000, pinned order)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: weekly_box_held_release_cycle
        grounds:
          - state_machines.WeeklyBox.SCHEDULED_to_HELD
          - state_machines.WeeklyBox.HELD_to_SCHEDULED
          - entities.WeeklyBox.fields.status
        distinguishing_aspect: |
          WeeklyBox is cyclic: SCHEDULED→HELD (place hold) then HELD→SCHEDULED (release) returns the box to its
          original status, distinguishing it from any linear pipeline — the same box re-enters SCHEDULED.
        test_recipe:
          setup:
            - "CONFIRMED subscription, clock 2026-06-15, box week 3 SCHEDULED; a REFUND hold placed on it"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S5", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-06-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
              captures: { season_id: $.data.id }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: $.data.id }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m5@x.com", full_name: "M Five", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
            - call: "GET /subscriptions/${sub_id}/weekly-boxes"
              as: Member
              as_user_id: "${member_id}"
              captures: { box_w3_id: "$.data[2].id" }
            - call: "POST /vacation-holds"
              payload: { subscription_id: "${sub_id}", held_box_id: "${box_w3_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /vacation-holds/${hold_id}/release"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "WeeklyBox.${box_w3_id}.status == SCHEDULED after release (returned from HELD)"
            - "VacationHold.${hold_id}.status == RELEASED"

      - name: subscription_parallel_billing_and_fulfillment_axes
        grounds:
          - state_machines.Subscription.PENDING_PAYMENT_to_CONFIRMED
          - state_machines.Subscription.NOT_STARTED_to_IN_SEASON
          - entities.Subscription.fields.fulfillment_status
        distinguishing_aspect: |
          Subscription evolves two independent axes on one row: billing_status reaches CONFIRMED at confirm while
          fulfillment_status is still NOT_STARTED; only the first box DELIVERED advances fulfillment to IN_SEASON —
          proving the axes change independently (parallel dimensions, not a single linear chain).
        test_recipe:
          setup:
            - "CONFIRMED subscription, clock 2026-07-01 (week 1 delivery date); box week 1 packed then delivered"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S6", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-06-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
              captures: { season_id: $.data.id }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: $.data.id }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m6@x.com", full_name: "M Six", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
            - call: "GET /subscriptions/${sub_id}/weekly-boxes"
              as: FarmManager
              captures: { box_w1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weekly-boxes/${box_w1_id}/pack"
              payload: {}
              as: FarmManager
          trigger:
            - call: "POST /weekly-boxes/${box_w1_id}/deliver"
              payload: {}
              as: FarmManager
          assert:
            - "Subscription.${sub_id}.billing_status == ACTIVE after first delivery"
            - "Subscription.${sub_id}.fulfillment_status == IN_SEASON after first delivery"
            - "Before this deliver, billing_status was CONFIRMED while fulfillment_status was NOT_STARTED (axes independent)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascades_boxes_holds_addons_depth3
        grounds:
          - state_machines.Subscription.CONFIRMED_to_CANCELLED
          - state_machines.WeeklyBox.HELD_to_SKIPPED
          - entities.SubscriptionAddOn.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from cancel: (1) cancel SKIPS non-terminal boxes; (2) a box that was HELD, on becoming
          SKIPPED, releases its VacationHold; (3) that teardown detaches ATTACHED add-ons and decrements
          AddOn.committed_count — each hop caused by the previous, not directly by cancel.
        test_recipe:
          setup:
            - "CONFIRMED subscription with one ATTACHED add-on (committed_count 1) and a REFUND hold on box week 4; clock 2026-06-15"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S7", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-06-30T00:00:00Z", total_share_capacity: 100 }
              as: FarmManager
              captures: { season_id: $.data.id }
            - call: "POST /pickup-sites"
              payload: { season_id: "${season_id}", name: "Downtown", kind: "PICKUP", weekly_capacity: 100 }
              as: DeliveryCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /share-types"
              payload: { season_id: "${season_id}", size: "MEDIUM", base_price_cents: 50000, items_per_box: 8 }
              as: FarmManager
              captures: { share_id: $.data.id }
            - call: "POST /add-ons"
              payload: { season_id: "${season_id}", kind: "FLOWERS", weekly_price_cents: 1000, weekly_supply_cap: 20 }
              as: FarmManager
              captures: { addon_id: $.data.id }
            - call: "POST /seasons/${season_id}/open"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "m7@x.com", full_name: "M Seven", sliding_scale_tier: "BASELINE" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { season_id: "${season_id}", member_id: "${member_id}", share_type_id: "${share_id}", current_site_id: "${site_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              as: FarmManager
              captures: { sea_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/confirm"
              payload: { expected_season_version: "${sea_v}" }
              as: FarmManager
            - call: "POST /subscription-add-ons"
              payload: { subscription_id: "${sub_id}", add_on_id: "${addon_id}" }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /subscriptions/${sub_id}/weekly-boxes"
              as: FarmManager
              captures: { box_w4_id: "$.data[3].id" }
            - call: "POST /vacation-holds"
              payload: { subscription_id: "${sub_id}", held_box_id: "${box_w4_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "WeeklyBox.${box_w4_id}.status == SKIPPED (hop 1)"
            - "VacationHold.${hold_id}.status == RELEASED (hop 2, caused by box becoming SKIPPED)"
            - "AddOn.${addon_id}.committed_count == 0 (hop 3, add-on detached) and SubscriptionAddOn.status == DETACHED"

      - name: workshare_complete_credit_balance_depth2
        grounds:
          - state_machines.WorkShareShift.SCHEDULED_to_COMPLETED
          - entities.Member.fields.wallet_credit_cents
          - calculations.outstanding_balance
        distinguishing_aspect: |
