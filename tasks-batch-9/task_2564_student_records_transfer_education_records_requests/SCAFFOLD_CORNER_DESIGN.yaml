            - "RecordsRequest.${req_no_consent}.status == \"ASSEMBLING\" and packet_status == \"NONE\" and packet_page_count == null"
            - "the second trigger call returns HTTP 200"
            - "RecordsRequest.${req_with_consent}.status == \"READY_FOR_RELEASE\" and packet_status == \"SNAPSHOT\""
            - "RecordsRequest.${req_with_consent}.packet_page_count == 100"
            - "CumulativeFile.${file_id}.last_packet_snapshot_at == \"2026-08-01T00:00:00.000Z\""

      - name: validate_requires_flag_and_reference_and_received_state
