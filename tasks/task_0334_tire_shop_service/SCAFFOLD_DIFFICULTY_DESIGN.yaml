              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/start-service"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: mileage_claim_approve_requires_committed_line
        grounds:
          - state_machines.MileageWarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.WorkOrderLine.PENDING_to_COMMITTED
          - validations[priority=7]
        distinguishing_aspect: |
          DIFFERENT entity pair MileageWarrantyClaim<-WorkOrderLine: approving a claim requires the
          covered WorkOrderLine.line_status == COMMITTED. With the order never approved (line still
          PENDING), claim approval is rejected with ERR_INVALID_STATE even though the mileage and
          tread eligibility values are all valid — the cross-entity line-state precondition (priority 7)
