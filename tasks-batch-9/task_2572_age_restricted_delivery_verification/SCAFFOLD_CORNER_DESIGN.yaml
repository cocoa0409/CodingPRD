          - calculations.order_restricted_unit_exposure.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / order_exposure_provisional_versus_final_policy_epoch
          rationale: "That §1.8 instance asserts both variants on byte-identical order data: 6.97 provisional against 7.87 final, with the 0.90 delta stated explicitly."

      - name: corner_risk_variant_selection_rolling_drives_posture_lifetime_does_not
        claim_type: variant_selection
        grounds:
          - calculations.partner_license_risk_score.variants
          - calculations.partner_posture_derivation.input_set
        excluded_because:
          difficulty_instance: dual_variant_calc / partner_risk_rolling_versus_lifetime_weighted
          rationale: "That §1.8 instance asserts rolling 55.00 versus lifetime 59.50 from the same case rows and that only the rolling variant is written to license_risk_score for posture derivation."

      - name: corner_restocking_fee_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.refusal_return_settlement.constants.RESTOCK_TIER_2_MAX
          - calculations.refusal_return_settlement.constants.RESTOCK_TIER_3_BPS
        excluded_because:
          difficulty_instance: combinatorial_formula / return_settlement_restocking_tier_keyed_on_pre_fee_gross
          rationale: "That §1.8 instance pins the tier lookup on the pre-fee gross 20400 to select 800 bps and contrasts the forbidden post-fee keying that would have selected 500 bps."

      - name: corner_exposure_rounding_precision_per_line_then_sum
        claim_type: precision
        grounds:
          - calculations.order_restricted_unit_exposure.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / exposure_per_line_rounding_order_decides_quota_verdict
          rationale: "That §1.8 instance asserts the pinned per-line-then-sum rounding produces 6.97 where the forbidden single-rounding order produces 6.96, and that the difference flips the quota verdict."

