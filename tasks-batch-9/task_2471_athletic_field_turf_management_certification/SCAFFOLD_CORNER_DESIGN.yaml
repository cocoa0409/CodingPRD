# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Probe)
# Task 2471 - Athletic Field Turf Management & Certification
#
# Taxonomy is fixed by references/claim-extraction-guide.md: `section:` values are
# the guide's nine sections, `claim_type:` values are its per-section rows.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs with no test_recipe.
#
# Shared bootstrap idiom used throughout: the very first POST /turf/staff-members
# is made as FacilitiesDirector with the all-zero X-User-ID, which is the single
# documented exemption from the role-identity check at validation priority 3;
# every later call uses a real captured staff-member id.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: field_creation_returns_derived_age_warranty_and_zeroed_counters
        claim_type: creation
        grounds:
          - endpoints[POST /turf/fields]
          - entities.Field.fields.age_years
          - entities.Field.fields.warranty_status
          - calculations.field_age_and_warranty_status
        distinguishing_aspect: "POST /turf/fields with all required fields returns 201 and the response already carries every derived field: age_years 8.30, warranty_status EXPIRED, play_status OPEN, certification_status NOT_CERTIFIED, all six counters 0 and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
            - "One FacilitiesDirector exists."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
          trigger:
            - call: "POST /turf/fields"
              payload: { name: "Grass Main 1", surface_type: "NATURAL_GRASS", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE", warranty_expires_on: "2026-04-15" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_ng: $.data.id, f_ng_age: $.data.age_years, f_ng_ver: $.data.version }
          assert:
            - "response status == 201"
            - "Field.${f_ng}.age_years == 8.30 and Field.${f_ng}.warranty_status == \"EXPIRED\" (warranty_expires_on 2026-04-15 is before the clock)"
            - "Field.${f_ng}.play_status == \"OPEN\" and Field.${f_ng}.certification_status == \"NOT_CERTIFIED\""
            - "Field.${f_ng}.cumulative_wear_units == 0.00, rest_debt_hours == 0.00, usage_hours_ytd == 0.00, nitrogen_applied_ytd_lb_per_1000_sq_ft == 0.00"
            - "Field.${f_ng}.open_mandatory_remediation_count == 0, open_advisory_remediation_count == 0, open_certification_packet_count == 0, open_replacement_plan_count == 0, unsafe_cancellation_count == 0"
            - "Field.${f_ng}.condition_index_agronomic == 71.17 and Field.${f_ng}.latest_gmax_mean_value is null"
            - "Field.${f_ng}.version == 1, id is a UUID, created_at == updated_at == \"2026-08-01T00:00:00Z\""
            - "Field.${f_ng}.retired_at is null, admin_closure_active == false, certified_until_utc is null"

      - name: field_retrieval_by_id_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints[GET /turf/fields/{id}]
          - entities.Field
        distinguishing_aspect: "GET /turf/fields/{id} returns byte-identical field values to the creation response, including the derived age_years 10.17 and warranty_status EXPIRED, and does not bump version."
        test_recipe:
          setup:
            - "One SYNTHETIC_TURF field installed 2016-06-01, expected_life_years 10, area 70000, infill_depth_mm 34.0, warranty_expires_on 2024-06-01, sanctioned_level REGIONAL, created at the default clock."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
          trigger:
            - call: "GET /turf/fields/${f_sy}"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { got_age: $.data.age_years, got_ver: $.data.version }
          assert:
            - "response status == 200 and response.data.id == ${f_sy}"
            - "Field.${f_sy}.age_years == 10.17, warranty_status == \"EXPIRED\", infill_depth_mm == 34.0, area_sq_ft == 70000, sanctioned_level == \"REGIONAL\""
            - "Field.${f_sy}.condition_index_agronomic == 65.00 (no impact test recorded, so safety_component is the NO_DATA value 50.00)"
            - "Field.${f_sy}.version == 1 - a read does not bump the OCC token"

      - name: field_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /turf/fields]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "With three fields stored, GET /turf/fields?limit=2&offset=0 returns exactly 2 items with total_count 3 and has_more true, and offset=2 returns 1 item with has_more false; default ordering is created_at ASC so the page boundary is deterministic."
        test_recipe:
          setup:
            - "Three fields created in this order at the default clock: Grass Main 1, Synthetic Stadium 1, Grass Practice 3."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Main 1", surface_type: "NATURAL_GRASS", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE", warranty_expires_on: "2026-04-15" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f1: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f2: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f3: $.data.id }
          trigger:
            - call: "GET /turf/fields"
              payload: { limit: 2, offset: 0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /turf/fields"
              payload: { limit: 2, offset: 2 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "first page: response status == 200, len(response.data) == 2, response.meta.total_count == 3, response.meta.has_more == true"
            - "first page items are ${f1} then ${f2} in created_at ASC order"
            - "second page: len(response.data) == 1, response.meta.total_count == 3, response.meta.has_more == false, item is ${f3}"
            - "GET /turf/fields with surface_type NATURAL_GRASS returns exactly ${f1} and ${f3}, total_count 2"

      - name: get_field_with_unknown_uuid_returns_field_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /turf/fields/{id}]
          - validations[priority=5]
          - errors[ERR_FIELD_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unused UUID on GET /turf/fields/{id} returns 404 ERR_FIELD_NOT_FOUND, not 200 with an empty body and not 400."
        test_recipe:
          setup:
            - "One FacilitiesDirector and no fields at all."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
          trigger:
            - call: "GET /turf/fields/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and response.data.error_id == \"ERR_FIELD_NOT_FOUND\""
            - "response.data.message is a non-empty string"
            - "GET /turf/staff-members/11111111-2222-3333-4444-555555555555 returns 404 ERR_STAFF_MEMBER_NOT_FOUND, GET /turf/maintenance-tasks/11111111-2222-3333-4444-555555555555 returns 404 ERR_MAINTENANCE_TASK_NOT_FOUND and GET /turf/capital-budgets/11111111-2222-3333-4444-555555555555 returns 404 ERR_CAPITAL_BUDGET_NOT_FOUND - each path entity has its own code"

      - name: field_create_missing_required_surface_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /turf/fields]
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required surface_type on POST /turf/fields returns 400 ERR_INVALID_REQUEST and creates no row, and the same holds for each of the other five required inputs."
        test_recipe:
          setup:
            - "One FacilitiesDirector; no fields."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
          trigger:
            - call: "POST /turf/fields"
              payload: { name: "Grass Main 1", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 and response.data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /turf/fields returns total_count 0 - nothing was persisted"
            - "the same 400 ERR_INVALID_REQUEST is returned when name, installed_on_date, expected_life_years, area_sq_ft or sanctioned_level is omitted individually"

      - name: staff_member_employment_status_defaults_to_active
        claim_type: defaults
        grounds:
          - endpoints[POST /turf/staff-members]
          - entities.StaffMember.fields.employment_status
        distinguishing_aspect: "Omitting the optional employment_status on POST /turf/staff-members yields employment_status ACTIVE, and the field is echoed in the creation response rather than left null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
          trigger:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id, s_agr_status: $.data.employment_status }
          assert:
            - "response status == 201 and StaffMember.${s_agr}.employment_status == \"ACTIVE\""
            - "StaffMember.${s_agr}.roles == [\"TurfAgronomist\"] and version == 1"
            - "creating a second staff member with employment_status \"INACTIVE\" explicitly yields employment_status \"INACTIVE\", so the default is a default and not a constant"

      - name: maintenance_task_recovery_credit_and_surface_class_are_computed
        claim_type: computed_fields
        grounds:
          - endpoints[POST /turf/maintenance-tasks]
          - entities.MaintenanceTask.fields.recovery_credit_hours
          - entities.MaintenanceTask.fields.surface_class
          - calculations.field_rest_debt_hours
        distinguishing_aspect: "recovery_credit_hours and surface_class are derived from task_type and the field's surface_type, not supplied by the client: AERATION on a natural-grass field yields 12.00 / NATURAL_GRASS, while SEAM_INSPECTION on a synthetic field yields 0.00 / SYNTHETIC_TURF."
        test_recipe:
          setup:
            - "One NATURAL_GRASS field (Grass Practice 3, installed 2025-08-01, life 12, area 60000, warranty 2030-08-01, LOCAL) and one SYNTHETIC_TURF field (Synthetic Stadium 1, installed 2016-06-01, life 10, area 70000, infill 34.0, warranty 2024-06-01, REGIONAL)."
            - "One TurfAgronomist."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Tobias Lund", roles: ["TurfAgronomist"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_agr: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Synthetic Stadium 1", surface_type: "SYNTHETIC_TURF", installed_on_date: "2016-06-01", expected_life_years: 10, area_sq_ft: 70000, sanctioned_level: "REGIONAL", warranty_expires_on: "2024-06-01", infill_depth_mm: 34.0 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_sy: $.data.id }
          trigger:
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_new}", assigned_staff_member_id: "${s_agr}", task_type: "AERATION", scheduled_start_utc: "2026-08-10T08:00:00Z", scheduled_end_utc: "2026-08-10T10:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t_aer: $.data.id, t_aer_credit: $.data.recovery_credit_hours }
            - call: "POST /turf/maintenance-tasks"
              payload: { field_id: "${f_sy}", assigned_staff_member_id: "${s_agr}", task_type: "SEAM_INSPECTION", scheduled_start_utc: "2026-08-11T08:00:00Z", scheduled_end_utc: "2026-08-11T09:00:00Z" }
              as: TurfAgronomist
              as_user_id: "${s_agr}"
              captures: { t_seam: $.data.id, t_seam_credit: $.data.recovery_credit_hours }
          assert:
            - "MaintenanceTask.${t_aer}.recovery_credit_hours == 12.00 and MaintenanceTask.${t_aer}.surface_class == \"NATURAL_GRASS\""
            - "MaintenanceTask.${t_seam}.recovery_credit_hours == 0.00 and MaintenanceTask.${t_seam}.surface_class == \"SYNTHETIC_TURF\""
            - "MaintenanceTask.${t_aer}.status == \"SCHEDULED\" and planned_for_certification_window == false (the optional flag defaults to false)"
            - "MaintenanceTask.${t_aer}.started_at_utc is null and completed_at_utc is null"
            - "an OVERSEEDING task on ${f_new} yields recovery_credit_hours 24.00 and an IRRIGATION task yields 4.00, so the credit is keyed on task_type"

      - name: field_create_with_client_supplied_system_fields_is_rejected
        claim_type: system_fields
        grounds:
          - endpoints[POST /turf/fields]
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "id, created_at, version, age_years and cumulative_wear_units are system- or computed-owned: supplying any of them in the POST /turf/fields body returns 400 ERR_INVALID_REQUEST rather than being silently honoured or silently dropped."
        test_recipe:
          setup:
            - "One FacilitiesDirector; no fields."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
          trigger:
            - call: "POST /turf/fields"
              payload: { name: "Grass Main 1", surface_type: "NATURAL_GRASS", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE", warranty_expires_on: "2026-04-15", id: "11111111-2222-3333-4444-555555555555", version: 9, age_years: 1.00, cumulative_wear_units: 500.00 }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 and response.data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /turf/fields returns total_count 0 - no row with the client-supplied id exists"
            - "GET /turf/fields/11111111-2222-3333-4444-555555555555 returns 404 ERR_FIELD_NOT_FOUND"

      - name: field_create_with_unknown_enum_member_is_rejected
        claim_type: type_constraints
        grounds:
          - endpoints[POST /turf/fields]
          - validations[priority=16]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "surface_type is a closed enum of NATURAL_GRASS and SYNTHETIC_TURF: the value HYBRID_BERMUDA returns 400 ERR_INVALID_REQUEST, and the same closed-enum treatment applies to sanctioned_level, activity_type, task_type, assessment_type and priority_basis."
        test_recipe:
          setup:
            - "One FacilitiesDirector; no fields."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
          trigger:
            - call: "POST /turf/fields"
              payload: { name: "Hybrid Field 9", surface_type: "HYBRID_BERMUDA", installed_on_date: "2018-04-15", expected_life_years: 12, area_sq_ft: 80000, sanctioned_level: "STATE" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 and response.data.error_id == \"ERR_INVALID_REQUEST\""
            - "the same 400 ERR_INVALID_REQUEST is returned for sanctioned_level \"OLYMPIC\", for POST /turf/usage-bookings with activity_type \"SCRIMMAGE\", for POST /turf/maintenance-tasks with task_type \"MOWING\" and for POST /turf/replacement-plans with priority_basis \"GUT_FEEL\""
            - "expected_life_years 0 and area_sq_ft 0 are likewise rejected with 400 ERR_INVALID_REQUEST - the numeric ranges are positive-only"
            - "GET /turf/fields returns total_count 0"

      - name: usage_ledger_entry_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.UsageLedgerEntry
          - endpoints[GET /turf/usage-ledger-entries/{id}]
          - calculations.field_cumulative_wear_units
        distinguishing_aspect: "UsageLedgerEntry is declared with common_fields false, so it exposes only id and created_at - no updated_at and no version - and the §1.5 surface offers no write endpoint for it: the only way to change the ledger is to append a further entry."
        test_recipe:
          setup:
            - "One NATURAL_GRASS field (Grass Practice 3) with a GAME booking 2026-08-02T19:00:00Z-2026-08-02T20:30:00Z for 40 participants, CONFIRMED at the default clock."
            - "Clock advanced to 2026-08-02T20:30:00Z and the booking closed out PLAYED, 1.50 hours, 40 participants, WET - producing exactly one PLAY_WEAR ledger entry of 3.65."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
            - call: "POST /turf/staff-members"
              payload: { full_name: "Priya Raman", roles: ["FieldOperationsCoordinator"] }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { s_ops: $.data.id }
            - call: "POST /turf/fields"
              payload: { name: "Grass Practice 3", surface_type: "NATURAL_GRASS", installed_on_date: "2025-08-01", expected_life_years: 12, area_sq_ft: 60000, sanctioned_level: "LOCAL", warranty_expires_on: "2030-08-01" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
              captures: { f_new: $.data.id }
            - call: "POST /turf/usage-bookings"
              payload: { field_id: "${f_new}", requested_by_staff_member_id: "${s_ops}", activity_type: "GAME", window_start_utc: "2026-08-02T19:00:00Z", window_end_utc: "2026-08-02T20:30:00Z", expected_participant_count: 40 }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { b1: $.data.id }
            - call: "POST /turf/usage-bookings/${b1}/confirm"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T20:30:00Z" }
              as: FacilitiesDirector
              as_user_id: "${s_dir}"
            - call: "POST /turf/usage-bookings/${b1}/close-out"
              payload: { outcome: "PLAYED", actual_duration_hours: 1.50, actual_participant_count: 40, weather_condition: "WET" }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
          trigger:
            - call: "GET /turf/usage-ledger-entries"
              payload: { field_id: "${f_new}" }
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
              captures: { led1: "$.data[0].id", led1_delta: "$.data[0].wear_units_delta" }
            - call: "GET /turf/usage-ledger-entries/${led1}"
              payload: {}
              as: FieldOperationsCoordinator
              as_user_id: "${s_ops}"
          assert:
            - "GET /turf/usage-ledger-entries with field_id ${f_new} returns total_count 1"
            - "UsageLedgerEntry.${led1}.entry_type == \"PLAY_WEAR\", wear_units_delta == 3.65, running_balance_after == 3.65, rest_requirement_hours == 3.83"
            - "the single-entry response body contains id and created_at but contains neither updated_at nor version"
            - "no PATCH, PUT or DELETE endpoint exists for /turf/usage-ledger-entries/{id} in §1.5 - the entity is append-only"
            - "UsageLedgerEntry.${led1}.effective_at_utc == \"2026-08-02T20:30:00Z\" and created_at == \"2026-08-02T20:30:00Z\""

      - name: maintenance_task_with_unknown_field_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /turf/maintenance-tasks]
          - validations[priority=18]
          - errors[ERR_FIELD_NOT_FOUND]
        distinguishing_aspect: "Under the flat entity topology every body-level foreign key is checked: an unused UUID in field_id on POST /turf/maintenance-tasks returns 404 ERR_FIELD_NOT_FOUND, and an unused UUID in assigned_staff_member_id returns 404 ERR_STAFF_MEMBER_NOT_FOUND."
        test_recipe:
          setup:
            - "One TurfAgronomist and one real NATURAL_GRASS field, so exactly one of the two foreign keys can be made bad at a time."
          setup_api_calls:
            - call: "POST /turf/staff-members"
              payload: { full_name: "Dana Reyes", roles: ["FacilitiesDirector"] }
              as: FacilitiesDirector
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { s_dir: $.data.id }
